// Single source of truth for capped tariff revenue (per tick, capped at 0.2% of GDP).
// Consolidates the cap logic that was previously duplicated across Trade, Tariffs, and Budget tabs.
function getCappedTariffRevenue(nation) {
    if (!tradeData || !tradeData.summary) return 0;
    var raw = Number(tradeData.summary.tariff_revenue) || 0;
    if (raw <= 0) return 0;
    // Cap at 5% of GDP — realistic range for high-tariff nations is 1-5% of GDP
    var gdp = Number(nation.gdp ?? nation.GDP ?? 0);
    return (gdp > 0) ? Math.min(raw, gdp * 0.05) : raw;
}

// ==================== TAXATION TAB STATE ====================
var currentFaction = null;

var taxRateChanges = {};  // { income_tax: 22, ... } — only keys that changed

// ==================== INIT ====================
initPage('economy', async function(state) {
    var nation = state.nation;

    if (!nation) {
        document.getElementById('content-area').innerHTML =
            '<div class="placeholder-panel">' +
            '<div class="ph-icon">📈</div>' +
            '<h3>No Nation Selected</h3>' +
            '<p>Your party is not assigned to a nation yet.</p>' +
            '</div>';
        return;
    }

    currentNation = nation;
    currentFaction = state.faction;
    await loadPreviousTickData(nation.id);
    var results = await Promise.allSettled([
        loadExpenditureData(nation.id, nation),
        loadTradeData(nation.id),
        loadAllNationsData(),
        loadTradeAgreements(nation.id),
        loadAidData(nation.id),
        loadTaxConnections(),
        loadTaxAdminFunding(nation),
        loadTaxPendingBills(nation.id),
        loadTaxHistory(nation.id),
        fetchActiveCoalition(_supabase, nation.id).then(function(c) { activeCoalition = c; }),
        loadIndustriesData(nation.id)
    ]);
    var failures = results.filter(function(r) { return r.status === 'rejected'; });
    if (failures.length > 0) {
        console.error('Economy data load failures:', failures.map(function(f) { return f.reason; }));
    }
    renderEconomyPage(nation);
});

// ==================== PREVIOUS TICK DATA ====================
async function loadPreviousTickData(nationId) {
    // Load current tick first so the cache key is correct
    var res = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    if (!res.data) return;
    currentTick = res.data.current_tick;

    var cacheKey = 'prev_tick_econ_' + nationId + '_t' + currentTick;
    var cached = qCache(cacheKey);
    if (cached) { previousTickData = cached; return; }

    var previousTick = currentTick - 1;
    if (previousTick < 0) return;

    var histRes = await _supabase.from('nations_history')
        .select('*').eq('nation_id', nationId).eq('tick', previousTick).limit(1);

    if (histRes.data && histRes.data.length > 0) {
        previousTickData = histRes.data[0];
        qCacheSet(cacheKey, previousTickData, 5 * 60 * 1000);
        return;
    }

    var fbRes = await _supabase.from('nations_history')
        .select('*').eq('nation_id', nationId).lt('tick', currentTick)
        .order('tick', { ascending: false }).limit(1);

    if (fbRes.data && fbRes.data.length > 0) {
        previousTickData = fbRes.data[0];
        qCacheSet(cacheKey, previousTickData, 5 * 60 * 1000);
    }
}

// ==================== PREVIOUS YEAR DATA ====================
async function loadExpenditureData(nationId, nation) {
    // No caching — always compute fresh from config + allocations
    // (admin config changes need to reflect immediately)

    var totals = {};
    var details = {};

    var res = await _supabase.from('active_laws')
        .select('passed_tick, is_reversal, policies(policy_name, fiscal_category, upfront_cost, ongoing_base_cost, ongoing_cost_per_tick, upfront_scaling_stat, ongoing_scaling_stat, policy_type)')
        .eq('nation_id', nationId)
        .eq('is_reversal', false);

    var yearStartTick = Math.floor(currentTick / GAME_CONFIG.TICKS_PER_YEAR) * GAME_CONFIG.TICKS_PER_YEAR;
    var inflationMult = getInflationMultiplier(nation.inflation);

    for (var i = 0; i < (res.data || []).length; i++) {
        var law = res.data[i];
        if (law.is_reversal) continue;
        var policy = law.policies;
        if (!policy || !policy.fiscal_category) continue;
        if (policy.policy_type === 'lever') continue; // Levers have no ongoing cost

        var cat = policy.fiscal_category;
        if (!totals[cat]) totals[cat] = 0;
        if (!details[cat]) details[cat] = [];

        var policyCost = 0;

        var ongoingBase = policy.ongoing_base_cost || policy.ongoing_cost_per_tick || 0;
        if (ongoingBase > 0) {
            var ongoingScaled = scaleCost(ongoingBase, policy.ongoing_scaling_stat, nation);
            policyCost += ongoingScaled * GAME_CONFIG.TICKS_PER_YEAR * 1000000;
        }

        if (law.passed_tick >= yearStartTick) {
            var upfront = policy.upfront_cost || 0;
            if (upfront > 0) {
                var upfrontScaled = scaleCost(upfront, policy.upfront_scaling_stat, nation);
                policyCost += upfrontScaled * 1000000;
            }
        }

        policyCost *= inflationMult;
        totals[cat] += policyCost;
        if (policyCost > 0) {
            details[cat].push({ name: policy.policy_name, cost: policyCost, type: 'policy' });
        }
    }

    // Institution costs from config, scaled by funding levels from budget_item_allocations
    {
        var configRes = await _supabase.from('ministry_institution_config').select('*');
        var allocRes = await _supabase.from('budget_item_allocations')
            .select('item_id, item_type, allocation_amount, needed_amount')
            .eq('nation_id', nationId)
            .eq('item_type', 'institution')
            .order('created_at', { ascending: true });
        var allocMap = buildFundingPctMap(allocRes.data);
        var population = Number(nation.population || 0);
        var gdp = Number(nation.gdp || 0);
        var catFundingSums = {}; // { fCat: { totalPct, count } }
        for (var k = 0; k < (configRes.data || []).length; k++) {
            var cfg = configRes.data[k];
            var mKey = cfg.ministry_key;
            var fCat = null;
            for (var fc in FISCAL_TO_MINISTRY_KEY) {
                if (FISCAL_TO_MINISTRY_KEY[fc] === mKey) { fCat = fc; break; }
            }
            if (!fCat) continue;
            var baseVal = Number(cfg.base_cost_per_capita || 0);
            var instNeeded = cfg.scaling_type === 'gdp' ? (baseVal / 100) * gdp : baseVal * population;
            instNeeded *= inflationMult;
            var instFundPct = getInstFundingPct(allocMap, cfg.id);
            var instCost = instNeeded * (instFundPct / 100);
            if (!catFundingSums[fCat]) catFundingSums[fCat] = { totalPct: 0, count: 0 };
            catFundingSums[fCat].totalPct += instFundPct;
            catFundingSums[fCat].count += 1;
            if (!totals[fCat]) totals[fCat] = 0;
            if (!details[fCat]) details[fCat] = [];
            totals[fCat] += instCost;
            if (instCost > 0) {
                details[fCat].push({
                    name: cfg.institution_name,
                    cost: instCost,
                    type: 'institution',
                    needed: instNeeded,
                    fundingPct: instFundPct
                });
            }
        }
        ministryFundingPcts = {};
        for (var mc in catFundingSums) {
            ministryFundingPcts[mc] = catFundingSums[mc].count > 0
                ? Math.round(catFundingSums[mc].totalPct / catFundingSums[mc].count)
                : 100;
        }
    }

    expenditureData = totals;
    expenditureDetails = details;
}

function scaleCost(baseCost, scalingStat, nation) {
    if (!scalingStat || !baseCost) return baseCost || 0;
    var statVal = Number(nation[scalingStat]) || 1;
    var divisor = RAW_SCALING_DIVISORS[scalingStat] || 50;
    return baseCost * (statVal / divisor);
}

// ==================== TRADE DATA ====================
async function loadTradeData(nationId) {
    var cacheKey = 'trade_data_' + nationId + '_t' + currentTick;
    var cached = qCache(cacheKey);
    if (cached) { tradeData = cached; return; }

    var sumRes = await _supabase.from('trade_summary')
        .select('*')
        .eq('nation_id', nationId)
        .order('tick', { ascending: false })
        .limit(1);

    if (sumRes.error) {
        console.error('[loadTradeData] trade_summary query failed:', sumRes.error.message);
        tradeData = null;
        return;
    }
    if (!sumRes.data || sumRes.data.length === 0) { tradeData = null; return; }
    var summary = sumRes.data[0];

    var flowRes = await _supabase.from('trade_flows')
        .select('sector, domestic_production, export_capacity, export_volume, import_demand, import_volume, net_flow, price_modifier')
        .eq('nation_id', nationId)
        .eq('tick', summary.tick);

    var prevFlowRes = await _supabase.from('trade_flows')
        .select('sector, export_volume, import_volume')
        .eq('nation_id', nationId)
        .eq('tick', summary.tick - 1);

    var flows = {};
    if (flowRes.data) {
        for (var i = 0; i < flowRes.data.length; i++) {
            flows[flowRes.data[i].sector] = flowRes.data[i];
        }
    }

    var prevFlows = {};
    if (prevFlowRes.data) {
        for (var i = 0; i < prevFlowRes.data.length; i++) {
            prevFlows[prevFlowRes.data[i].sector] = prevFlowRes.data[i];
        }
    }

    var partnerExportRes = await _supabase.from('trade_partners')
        .select('importer_nation_id, sector, trade_volume, affinity_score')
        .eq('exporter_nation_id', nationId)
        .eq('tick', summary.tick);

    var partnerImportRes = await _supabase.from('trade_partners')
        .select('exporter_nation_id, sector, trade_volume, affinity_score')
        .eq('importer_nation_id', nationId)
        .eq('tick', summary.tick);

    var nationRes = await _supabase.from('nations').select('id, name');
    var nationNames = {};
    if (nationRes.data) {
        for (var i = 0; i < nationRes.data.length; i++) {
            nationNames[nationRes.data[i].id] = nationRes.data[i].name;
        }
    }

    var partners = {};
    if (partnerExportRes.data) {
        for (var i = 0; i < partnerExportRes.data.length; i++) {
            var row = partnerExportRes.data[i];
            var pid = row.importer_nation_id;
            if (!partners[pid]) partners[pid] = { name: nationNames[pid] || 'Unknown', exportsTo: {}, importsFrom: {}, totalExports: 0, totalImports: 0, affinity: 0 };
            partners[pid].exportsTo[row.sector] = (partners[pid].exportsTo[row.sector] || 0) + Number(row.trade_volume);
            partners[pid].totalExports += Number(row.trade_volume);
            partners[pid].affinity = Math.max(partners[pid].affinity, Number(row.affinity_score) || 0);
        }
    }
    if (partnerImportRes.data) {
        for (var i = 0; i < partnerImportRes.data.length; i++) {
            var row = partnerImportRes.data[i];
            var pid = row.exporter_nation_id;
            if (!partners[pid]) partners[pid] = { name: nationNames[pid] || 'Unknown', exportsTo: {}, importsFrom: {}, totalExports: 0, totalImports: 0, affinity: 0 };
            partners[pid].importsFrom[row.sector] = (partners[pid].importsFrom[row.sector] || 0) + Number(row.trade_volume);
            partners[pid].totalImports += Number(row.trade_volume);
            partners[pid].affinity = Math.max(partners[pid].affinity, Number(row.affinity_score) || 0);
        }
    }

    // Fetch diplomatic relations for affinity breakdown (always, for diagnostics)
    var allAffinities = [];
    var relRes = await _supabase.from('diplomatic_relations')
        .select('nation_a_id, nation_b_id, relation_score, proximity, active_treaties');

    // Build lookup of relation rows by partner ID
    var relByPartner = {};
    if (relRes.data) {
        for (var i = 0; i < relRes.data.length; i++) {
            var r = relRes.data[i];
            var partnerId = null;
            if (r.nation_a_id === nationId) partnerId = r.nation_b_id;
            else if (r.nation_b_id === nationId) partnerId = r.nation_a_id;
            if (partnerId) relByPartner[partnerId] = r;
        }
    }

    // Compute affinity for ALL nations (not just those with diplomatic_relations rows).
    // This matches the backend trade engine which defaults to base=50, proximity=50
    // for pairs without a relation row.
    for (var nid in nationNames) {
        if (nid === nationId) continue;
        var r = relByPartner[nid] || null;
        var relScore = r ? (Number(r.relation_score) || 0) : 0;
        var prox = (r && r.proximity != null) ? Number(r.proximity) : 50;
        var treaties = (r && r.active_treaties) || [];
        var hasFTA = false, hasRSC = false, hasPTA = false, hasEmbargo = false;
        for (var t = 0; t < treaties.length; t++) {
            var ty = treaties[t].agreement_type || treaties[t].type || '';
            if (ty === 'free_trade') hasFTA = true;
            else if (ty === 'resource_supply') hasRSC = true;
            else if (ty === 'partial_trade') hasPTA = true;
            else if (ty === 'embargo') hasEmbargo = true;
        }
        var tradeBonus = hasFTA ? 25 : hasRSC ? 20 : hasPTA ? 15 : 0;
        var diplomaticBonus = relScore * 0.3;
        var proximityBonus = ((100 - prox) / 100) * 20;
        var embargoPenalty = hasEmbargo ? -40 : 0;
        var totalAffinity = Math.max(0, Math.min(100, 50 + diplomaticBonus + tradeBonus + embargoPenalty + proximityBonus));
        var breakdown = {
            base: 50,
            diplomatic: Math.round(diplomaticBonus * 10) / 10,
            relScore: relScore,
            trade: tradeBonus,
            tradeType: hasFTA ? 'FTA' : hasRSC ? 'RSC' : hasPTA ? 'PTA' : null,
            proximity: Math.round(proximityBonus * 10) / 10,
            proximityRaw: prox,
            embargo: embargoPenalty,
            total: Math.round(totalAffinity * 10) / 10
        };

        // Attach to existing trade partners, or create a zero-volume entry
        // so all nations appear in the Trading Partners grid
        if (!partners[nid]) {
            partners[nid] = { name: nationNames[nid] || 'Unknown', exportsTo: {}, importsFrom: {}, totalExports: 0, totalImports: 0, affinity: 0 };
        }
        partners[nid].affinityBreakdown = breakdown;

        // Collect all affinities for diagnostics
        allAffinities.push({ partnerId: nid, name: nationNames[nid] || 'Unknown', breakdown: breakdown });
    }

    tradeData = { summary: summary, flows: flows, prevFlows: prevFlows, partners: partners, allAffinities: allAffinities, nationNames: nationNames };
    qCacheSet(cacheKey, tradeData, 2 * 60 * 1000);

    // Fetch food land allocation for this nation
    if (!foodAllocation) {
        var allocRes = await _supabase.from('food_land_allocation')
            .select('grains_pct, livestock_pct, perishables_pct, cash_crops_pct')
            .eq('nation_id', nationId)
            .limit(1);
        if (allocRes.data && allocRes.data.length > 0) {
            foodAllocation = allocRes.data[0];
        } else {
            foodAllocation = DEFAULT_FOOD_ALLOCATION;
        }
    }

    // Fetch food stockpiles for this nation
    var stockRes = await _supabase.from('food_stockpiles')
        .select('sector, reserve_value, max_capacity, last_spoilage, last_inflow, last_outflow')
        .eq('nation_id', nationId);
    if (stockRes.data && stockRes.data.length > 0) {
        foodStockpiles = {};
        for (var si = 0; si < stockRes.data.length; si++) {
            foodStockpiles[stockRes.data[si].sector] = stockRes.data[si];
        }
    }
}

// ==================== ALL NATIONS DATA (NEW) ====================
async function loadAllNationsData() {
    var cacheKey = 'all_nations_econ_t' + currentTick;
    var cached = qCache(cacheKey);
    if (cached) { allNations = cached; return; }

    var res = await _supabase.from('nations')
        .select('id, name, gdp, population, gdp_growth, unemployment, inflation, standard_of_living, debt, tariffs, oil_and_gas, rare_minerals, arable_land, physical_infrastructure, digital_infrastructure, higher_education, credit, happiness, stability, manufacturing_output, service_output, currency_strength, energy_generation');

    if (res.data) {
        allNations = res.data;
        qCacheSet(cacheKey, allNations, 5 * 60 * 1000);
    } else {
        allNations = [];
    }
}

async function loadTradeAgreements(nationId) {
    try {
        var { data } = await _supabase.from('trade_agreements')
            .select('*')
            .eq('status', 'active')
            .or('nation_a_id.eq.' + nationId + ',nation_b_id.eq.' + nationId)
            .order('enacted_at_tick', { ascending: false });
        tradeAgreements = data || [];
    } catch (e) {
        tradeAgreements = [];
    }
}

// ==================== ECONOMIC AID DATA ====================
async function loadAidData(nationId) {
    try {
        var { data: aidStates } = await _supabase.from('aid_agreement_state')
            .select('*, trade_agreements!inner(status, agreement_type, articles, agreement_name, nation_a_id, nation_b_id)')
            .or('donor_nation_id.eq.' + nationId + ',recipient_nation_id.eq.' + nationId)
            .eq('trade_agreements.status', 'active')
            .eq('trade_agreements.agreement_type', 'economic_aid')
            .eq('is_suspended', false);

        var received = 0;
        var given = 0;
        var agreements = [];

        for (var i = 0; i < (aidStates || []).length; i++) {
            var state = aidStates[i];
            var amount = Number(state.current_annual_amount || 0);
            if (state.recipient_nation_id === nationId) received += amount;
            if (state.donor_nation_id === nationId) given += amount;
            agreements.push(state);
        }

        aidData = { received: received, given: given, agreements: agreements };
    } catch (e) {
        console.warn('[loadAidData] Error:', e);
        aidData = { received: 0, given: 0, agreements: [] };
    }
}

// ==================== TAB INFRASTRUCTURE ====================
function renderEconomyPage(nation) {
    var h = '';
    h += '<div class="econ-title-bar">';
    h += '<div class="econ-title">ECONOMY OF ' + escapeHtml(nation.name).toUpperCase() + '</div>';
    h += '</div>';
    h += renderTabBar();
    h += '<div id="econ-tab-content">';
    h += renderTabContent(nation);
    h += '</div>';
    document.getElementById('content-area').innerHTML = h;
    wireTabEvents(nation);
}

function renderTabBar() {
    var tabs = [
        { key: 'overview', label: 'Overview' },
        { key: 'budget', label: 'Budget' },
        { key: 'taxation', label: 'Taxation' },
        { key: 'trade', label: 'Trade' },
        { key: 'sectors', label: 'Sectors' },
        { key: 'industries', label: 'Industries' },
        { key: 'tariffs', label: 'Tariffs' }
    ];
    var h = '<div class="econ-tab-bar">';
    for (var i = 0; i < tabs.length; i++) {
        var cls = tabs[i].key === activeTab ? ' active' : '';
        h += '<button class="econ-tab' + cls + '" data-tab="' + tabs[i].key + '">' + tabs[i].label + '</button>';
    }
    h += '</div>';
    return h;
}

function renderTabContent(nation) {
    switch (activeTab) {
        case 'overview': return renderOverviewTab(nation);
        case 'budget': return renderBudgetTab(nation);
        case 'taxation': return renderTaxationTab(nation);
        case 'trade': return renderTradeTab(nation);
        case 'sectors': return renderSectorsTab(nation);
        case 'industries': return renderIndustriesTab(nation);
        case 'tariffs': return renderTariffsTab(nation);
        default: return '';
    }
}

function wireTabEvents(nation) {
    document.querySelectorAll('.econ-tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
            activeTab = tab.getAttribute('data-tab');
            renderEconomyPage(nation);
        });
    });
    if (activeTab === 'trade') {
        document.querySelectorAll('.tft-row-clickable').forEach(function(row) {
            row.addEventListener('click', function() {
                activeSector = row.getAttribute('data-sector');
                activeTab = 'sectors';
                renderEconomyPage(nation);
            });
        });
    }
    if (activeTab === 'sectors') {
        document.querySelectorAll('.sector-tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                selectSector(tab.getAttribute('data-sector'), currentNation);
            });
        });
        document.querySelectorAll('.food-subsector-tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                selectFoodSubsector(tab.getAttribute('data-subsector'), currentNation);
            });
        });
    }
    if (activeTab === 'budget') {
        document.querySelectorAll('.ministry-tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                selectMinistryCategory(tab.getAttribute('data-category'));
            });
        });
    }
    if (activeTab === 'taxation') {
        wireTaxSliders(nation);
    }
    if (activeTab === 'tariffs') {
        wireTariffSimulator(nation);
    }
}

function wireTariffSimulator(nation) {
    var slider = document.getElementById('tsim-range');
    if (!slider) return;

    var simData = gatherTariffSimData(nation);
    var currentRate = simData.currentRate;
    var currentDampener = simData.currentDampener;
    var totalCurrentImports = simData.totalCurrentImports;
    var sectorImports = simData.sectorImports;
    var collectionRate = simData.collectionRate;
    var currentTariffRev = simData.currentTariffRev;

    slider.addEventListener('input', function() {
        var simRate = parseInt(slider.value, 10);

        // Update fill bar
        var fill = document.getElementById('tsim-fill');
        if (fill) fill.style.width = simRate + '%';

        // Update sim label
        var label = document.getElementById('tsim-sim-label');
        if (label) {
            var isChanged = Math.round(simRate) !== Math.round(currentRate);
            label.innerHTML = 'SIMULATED: <strong>' + simRate + '%</strong>';
            label.classList.toggle('tsim-changed', isChanged);
        }

        // Update projections
        var projEl = document.getElementById('tsim-projections');
        if (projEl) {
            var gdpCap = Number(nation.gdp ?? nation.GDP ?? 0) * 0.05;
            projEl.innerHTML = renderTariffProjections(currentRate, simRate, currentDampener, totalCurrentImports, sectorImports, collectionRate, currentTariffRev, gdpCap);
        }
    });
}

function wireTaxSliders(nation) {
    document.querySelectorAll('.tax-rate-slider').forEach(function(slider) {
        slider.addEventListener('input', function() {
            var key = slider.getAttribute('data-tax-key');
            var newRate = parseInt(slider.value, 10);
            var origRate = originalRates[key];

            // Update rate change tracking
            if (newRate === origRate) {
                delete taxRateChanges[key];
            } else {
                taxRateChanges[key] = newRate;
            }

            // Re-render the full tab to keep everything in sync
            var contentEl = document.getElementById('econ-tab-content');
            if (contentEl) {
                contentEl.innerHTML = renderTaxationTab(nation);
                wireTaxSliders(nation);
            }
        });
    });
    document.querySelectorAll('.tax-reset-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var key = btn.getAttribute('data-tax-key');
            delete taxRateChanges[key];
            var contentEl = document.getElementById('econ-tab-content');
            if (contentEl) {
                contentEl.innerHTML = renderTaxationTab(nation);
                wireTaxSliders(nation);
            }
        });
    });
    var submitBtn = document.getElementById('tax-submit-btn');
    if (submitBtn && !submitBtn.disabled) {
        submitBtn.addEventListener('click', function() { submitTaxBill(nation); });
    }
}

async function submitTaxBill(nation) {
    var changedKeys = Object.keys(taxRateChanges).filter(function(k) { return taxRateChanges[k] !== originalRates[k]; });
    if (changedKeys.length === 0) return;

    var termBill = 'bill';

    // Build confirmation summary
    var gdp = Number(nation.gdp || 0);
    var eff = Number(nation.efficiency || 50);
    var corr = Number(nation.corruption || 50);
    var collectionRate = 0.35 + ((eff + (100 - corr)) / 200) * 0.65;
    var summaryLines = [];
    for (var i = 0; i < changedKeys.length; i++) {
        var key = changedKeys[i];
        var cfg = TAX_CONFIG.find(function(t) { return t.key === key; });
        if (!cfg) continue;
        var oldRate = originalRates[key];
        var newRate = taxRateChanges[key];
        var direction = newRate > oldRate ? 'increase' : 'decrease';
        var delta = gdp * ((newRate - oldRate) / 100) * cfg.gdpMultiplier * collectionRate;
        var rateDiff = newRate - oldRate;
        // All tax types: increases hurt approval, cuts boost it
        var approvalImpact = rateDiff > 0 ? rateDiff * -2 : Math.abs(rateDiff) * 1;
        var impactLine = '  Government approval: ' + (approvalImpact >= 0 ? '+' : '') + approvalImpact + ' (decays over time)';
        summaryLines.push(
            cfg.name + ': ' + oldRate + '% → ' + newRate + '% (' + direction + ')\n' +
            '  Revenue: ' + (delta >= 0 ? '+' : '') + formatBudgetCurrency(delta) + '/yr\n' +
            impactLine
        );
    }
    var confirmMsg = 'Submit Tax Reform Bill?\n\n' + summaryLines.join('\n\n');
    if (!confirm(confirmMsg)) return;

    try {
        // Get current tick
        var { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        var tick = shard ? shard.current_tick : 0;

        // Generate bill name
        var billName = changedKeys.length === 1
            ? TAX_CONFIG.find(function(t) { return t.key === changedKeys[0]; }).name + ' Reform Act'
            : 'Tax Reform Act';

        // Build preamble
        var preamble = 'This ' + termBill + ', put forth by the ' + currentFaction.faction_name +
            ', proposes changes to the tax rates of ' + escapeHtml(nation.name) + '.';

        // Insert bill
        var taxChangeSummary = changedKeys.map(function(key) {
            return {
                tax_key: key,
                old_rate: originalRates[key],
                new_rate: taxRateChanges[key]
            };
        });
        var { data: bill, error: billError } = await _supabase.from('bills').insert({
            nation_id: nation.id,
            proposed_by: currentFaction.id,
            proposed_tick: tick,
            bill_name: billName,
            bill_type: 'tax_reform',
            status: 'committee',
            proposer_name: currentFaction.faction_name,
            proposer_color: currentFaction.party_color,
            preamble: preamble,
            metadata: {
                tax_changes: taxChangeSummary,
                proposer: {
                    faction_id: currentFaction.id,
                    faction_name: currentFaction.faction_name
                },
                context: {
                    tick: tick,
                    nation_id: nation.id
                }
            }
        }).select().single();
        if (billError) throw billError;

        // Insert text articles for each tax change
        var articles = [];
        for (var j = 0; j < changedKeys.length; j++) {
            var artKey = changedKeys[j];
            var artCfg = TAX_CONFIG.find(function(t) { return t.key === artKey; });
            if (!artCfg) continue;
            var artOld = originalRates[artKey];
            var artNew = taxRateChanges[artKey];
            var artDelta = gdp * ((artNew - artOld) / 100) * artCfg.gdpMultiplier * collectionRate;
            var artRateDiff = artNew - artOld;
            var artApprovalText;
            var artApproval = artRateDiff > 0 ? artRateDiff * -2 : Math.abs(artRateDiff) * 1;
            artApprovalText = (artApproval >= 0 ? '+' : '') + artApproval + ' government approval (decays over time)';

            articles.push({
                bill_id: bill.id,
                policy_id: null,
                article_number: j + 1,
                added_by: currentFaction.id,
                article_title: artCfg.name + ' Rate Change',
                article_text: 'Proposing to change ' + artCfg.name + ' from ' + artOld +
                    '% to ' + artNew + '%. This would ' + (artDelta >= 0 ? 'generate' : 'cost') +
                    ' ' + formatBudgetCurrency(Math.abs(artDelta)) + ' per year in revenue.\n\n' +
                    'Estimated impact: ' + artApprovalText,
                effect_data: {
                    type: 'TAX_RATE_CHANGE',
                    tax_key: artKey,
                    old_rate: artOld,
                    new_rate: artNew
                }
            });
        }
        if (articles.length > 0) {
            var { error: articleError } = await _supabase.from('bill_articles').insert(articles);
            if (articleError) {
                // Articles failed — delete the orphaned bill and propagate the error
                await _supabase.from('bills').delete().eq('id', bill.id);
                throw new Error('Failed to save tax articles: ' + articleError.message);
            }
        }

        // Auto-add sponsor support
        var mySeats = currentFaction.seats || 0;
        var { error: supportError } = await _supabase.from('bill_support').insert({
            bill_id: bill.id, faction_id: currentFaction.id,
            stance: 'accept', seat_count: mySeats
        });
        if (supportError) {
            console.error('Failed to add sponsor support:', supportError.message);
        }

        // Reset state and navigate to the bill
        taxRateChanges = {};
        originalRates = {};
        window.location.href = 'bill.html?id=' + bill.id;
    } catch (e) {
        console.error('Error submitting tax bill:', e);
        alert('Error submitting tax ' + termBill + ': ' + (e.message || e));
    }
}

// ==================== OVERVIEW TAB ====================
function computeBudgetSummary(nation) {
    var budget = calculateNationalBudget(nation);
    var cappedTariff = getCappedTariffRevenue(nation);
    if (cappedTariff > 0) {
        applyTradeTariffOverride(budget, cappedTariff, Number(nation.gdp ?? nation.GDP ?? 0));
    }
    var aidReceived = aidData ? Number(aidData.received || 0) : 0;
    var aidGivenAmt = aidData ? Number(aidData.given || 0) : 0;
    budget.grossRevenue += aidReceived;
    var totalExp = 0;
    if (expenditureData) {
        for (var k in expenditureData) totalExp += expenditureData[k] || 0;
    }
    totalExp += budget.debtService || 0;
    totalExp += aidGivenAmt;
    return { budget: budget, totalExpenditure: totalExp, balance: budget.grossRevenue - totalExp };
}

function formatUnemploymentPct(stat) {
    return (0.7 + (stat - 1) * 34.3 / 99).toFixed(1) + '%';
}

    h += renderOverviewCard('Inflation', formatInflationRate(infl), inflStatus, getTrendArrow('inflation', infl, true));

    var sol = Number(nation.standard_of_living) || 50;
    h += renderOverviewCard('Std of Living', Math.round(sol), sol >= 70 ? 'surplus' : sol >= 40 ? 'neutral' : 'deficit', getTrendArrow('standard_of_living', sol, false));

    h += '</div>';
    h += '</div>';

    // --- Rankings ---
    h += renderRankings(nation);

    // --- Sector Health ---
    h += renderSectorHealth(nation);

    h += '</div>'; // .econ-overview
    return h;
}

function renderOverviewCard(label, value, colorClass, subHtml) {
    var h = '<div class="econ-card econ-card-' + colorClass + '">';
    h += '<div class="econ-card-label">' + escapeHtml(label) + '</div>';
    h += '<div class="econ-card-value">' + value + '</div>';
    if (subHtml) h += '<div class="econ-card-sub">' + subHtml + '</div>';
    h += '</div>';
    return h;
}

function renderRankings(nation) {
    if (!allNations || allNations.length === 0) return '';

    // Detect GDP/debt stored as 0-100 stat scores instead of raw dollars
    function fmtMonetary(key) {
        return function(v) {
            assertRawEconomicValue(v, key);
            if (v >= 0 && v <= 100000) {
                return '$' + Math.round(v);
            }
            return formatBudgetCurrency(v);
        };
    }
    var metrics = [
        { key: 'gdp', label: 'GDP', higher: true, fmt: fmtMonetary('gdp') },
        { key: 'gdp_growth', label: 'GDP Growth', higher: true, fmt: function(v) { var p = ((v - 50) / 50) * 1; return (p >= 0 ? '+' : '') + p.toFixed(2) + '%'; } },
        { key: 'standard_of_living', label: 'Std of Living', higher: true, fmt: function(v) { return Math.round(v); } },
        { key: 'unemployment', label: 'Unemployment', higher: false, fmt: function(v) { return formatUnemploymentPct(v); } },
        { key: 'debt', label: 'National Debt', higher: false, fmt: fmtMonetary('debt') }
    ];

    var h = '<div class="econ-section">';
    h += '<div class="econ-section-header">ECONOMIC RANKINGS</div>';
    h += '<div class="econ-ranking-table">';

    // Header row
    h += '<div class="econ-ranking-row econ-ranking-header">';
    h += '<div class="econ-ranking-cell econ-ranking-metric">Metric</div>';
    for (var r = 0; r < allNations.length; r++) {
        h += '<div class="econ-ranking-cell">#' + (r + 1) + '</div>';
    }
    h += '</div>';

    for (var m = 0; m < metrics.length; m++) {
        var metric = metrics[m];
        var sorted = allNations.slice().sort(function(a, b) {
            var va = Number(a[metric.key]) || 0;
            var vb = Number(b[metric.key]) || 0;
            return metric.higher ? (vb - va) : (va - vb);
        });

        h += '<div class="econ-ranking-row">';
        h += '<div class="econ-ranking-cell econ-ranking-metric">' + escapeHtml(metric.label) + '</div>';
        for (var s = 0; s < sorted.length; s++) {
            var isYou = sorted[s].id === nation.id;
            var cls = isYou ? ' econ-ranking-highlight' : '';
            h += '<div class="econ-ranking-cell' + cls + '">';
            var nColor = NATION_COLORS[sorted[s].name] || '';
            h += '<div class="econ-ranking-name"' + (nColor ? ' style="color:' + nColor + '"' : '') + '>' + escapeHtml(sorted[s].name) + '</div>';
            h += '<div class="econ-ranking-val">' + metric.fmt(Number(sorted[s][metric.key]) || 0) + '</div>';
            h += '</div>';
        }
        h += '</div>';
    }

    h += '</div>';
    h += '</div>';
    return h;
}

function renderSectorHealth(nation) {
    var h = '<div class="econ-section">';
    h += '<div class="econ-section-header">SECTOR HEALTH</div>';
    h += '<div class="econ-section-subtitle">Export capacity scores derived from nation stats. Marker shows export threshold.</div>';
    h += '<div class="econ-sector-health">';

    for (var i = 0; i < TRADE_SECTORS.length; i++) {
        var sector = TRADE_SECTORS[i];
        var score = getSectorScore(nation, sector);
        var pct = Math.min(100, Math.max(0, Math.round(score)));
        var color = pct >= 70 ? 'var(--green, #5cb85c)' : pct >= 40 ? 'var(--accent, #ffcc00)' : 'var(--red, #d9534f)';
        var aboveThreshold = score >= sector.export_threshold;

        h += '<div class="econ-sector-row">';
        h += '<div class="econ-sector-label">' + escapeHtml(sector.label) + '</div>';
        h += '<div class="econ-health-track">';
        h += '<div class="econ-health-fill" style="width:' + pct + '%;background:' + color + '"></div>';
        h += '<div class="econ-health-threshold" style="left:' + sector.export_threshold + '%" title="Export threshold: ' + sector.export_threshold + '"></div>';
        h += '</div>';
        h += '<div class="econ-health-value" style="color:' + color + '">' + pct + '</div>';
        if (!aboveThreshold) {
            h += '<div class="econ-health-warning">Below threshold (' + sector.export_threshold + ')</div>';
        }
        h += '</div>';
    }

    h += '</div>';
    h += '</div>';
    return h;
}

function getSectorScore(nation, sector) {
    if (sector.export_stat) {
        return Number(nation[sector.export_stat]) || 0;
    }
    if (sector.export_stats && sector.export_stats.length > 0) {
        var sum = 0;
        for (var i = 0; i < sector.export_stats.length; i++) {
            sum += Number(nation[sector.export_stats[i]]) || 0;
        }
        return sum / sector.export_stats.length;
    }
    return 0;
}

// ==================== TAXATION TAB ====================

async function loadTaxConnections() {
    var cacheKey = 'tax_connections';
    var cached = qCache(cacheKey);
    if (cached) { taxConnections = cached; return; }
    var { data } = await _supabase.from('stat_connections')
        .select('source_stat, source_dir, threshold, target_stat, target_dir, magnitude, dampening')
        .eq('enabled', true)
        .in('source_stat', ['income_tax', 'corporate_tax', 'sales_tax']);
    taxConnections = data || [];
    qCacheSet(cacheKey, taxConnections, 5 * 60 * 1000);
}


async function loadTaxAdminFunding(nation) {
    var cacheKey = 'tax_admin_funding_' + nation.id + '_t' + currentTick;
    var cached = qCache(cacheKey);
    if (cached) { taxAdminFunding = cached; return; }

    var allocated = 0;
    var needed = 0;

    // Compute needed from ministry_institution_config
    var { data: cfg } = await _supabase.from('ministry_institution_config')
        .select('base_cost_per_capita, scaling_type')
        .eq('id', 'tax_admin')
        .single();
    if (cfg) {
        var population = Number(nation.population || 0);
        var gdp = Number(nation.gdp || 0);
        needed = cfg.scaling_type === 'gdp'
            ? (Number(cfg.base_cost_per_capita) / 100) * gdp
            : Number(cfg.base_cost_per_capita) * population;
    }

    // Read actual allocation from budget_item_allocations (written by funding bill enactment)
    var { data: allocRows } = await _supabase.from('budget_item_allocations')
        .select('item_id, item_type, allocation_amount, needed_amount')
        .eq('nation_id', nation.id)
        .eq('item_type', 'institution')
        .eq('item_id', 'tax_admin')
        .order('created_at', { ascending: false })
        .limit(1);
    var fundingPctMap = buildFundingPctMap(allocRows);
    var fundingPct = getInstFundingPct(fundingPctMap, 'tax_admin');
    allocated = needed * (fundingPct / 100);
    taxAdminFunding = { allocated: allocated, needed: needed, fundingPct: fundingPct };
    qCacheSet(cacheKey, taxAdminFunding, 5 * 60 * 1000);
}

async function loadTaxPendingBills(nationId) {
    var cacheKey = 'tax_pending_bills_' + nationId;
    var cached = qCache(cacheKey);
    if (cached) { taxPendingBills = cached; return; }
    var { data } = await _supabase.from('bills')
        .select('id, bill_name, bill_type, status, proposed_by, metadata, bill_articles(article_title, article_text, effect_data)')
        .eq('nation_id', nationId)
        .eq('bill_type', 'tax_reform')
        .in('status', ['committee', 'floor', 'president_desk']);
    taxPendingBills = data || [];
    qCacheSet(cacheKey, taxPendingBills, 2 * 60 * 1000);
}

async function loadTaxHistory(nationId) {
    var cacheKey = 'tax_history_' + nationId + '_t' + currentTick;
    var cached = qCache(cacheKey);
    if (cached) { taxHistory = cached; return; }
    var { data } = await _supabase.from('nations_history')
        .select('tick, income_tax, corporate_tax, sales_tax, gdp, efficiency, corruption')
        .eq('nation_id', nationId)
        .order('tick', { ascending: false })
        .limit(12);
    taxHistory = (data || []).reverse(); // oldest first
    qCacheSet(cacheKey, taxHistory, 5 * 60 * 1000);
}

function computeSparklineRevenues(taxKey, gdpMultiplier) {
    var revenues = [];
    for (var i = 0; i < taxHistory.length; i++) {
        var snap = taxHistory[i];
        var rate = Number(snap[taxKey] || 0);
        var gdp = Number(snap.gdp || 0);
        var eff = Number(snap.efficiency || 50);
        var corr = Number(snap.corruption || 50);
        var cr = 0.35 + ((eff + (100 - corr)) / 200) * 0.65;
        revenues.push(gdp * (rate / 100) * gdpMultiplier * cr);
    }
    return revenues;
}

function getTaxEffects(taxKey) {
    return taxConnections.filter(function(c) { return c.source_stat === taxKey; });
}


function getSliderColorClass(rate, maxRate) {
    var pct = rate / maxRate;
    if (pct <= 0.25) return 'low';
    if (pct <= 0.50) return 'mid';
    if (pct <= 0.75) return 'high';
    return 'extreme';
}

function renderTaxationTab(nation) {
    var budget = calculateNationalBudget(nation);
    var cappedTariff = getCappedTariffRevenue(nation);
    if (cappedTariff > 0) {
        applyTradeTariffOverride(budget, cappedTariff, Number(nation.gdp ?? nation.GDP ?? 0));
    }

    var incomeTax = Math.round(Number(nation.income_tax || 0));
    var corpTax = Math.round(Number(nation.corporate_tax || 0));
    var salesTax = Math.round(Number(nation.sales_tax || 0));

    // Store original rates on first render (don't overwrite if already set)
    // Use integer-rounded values to match slider step=1 precision
    if (!originalRates._initialized) {
        originalRates = { income_tax: incomeTax, corporate_tax: corpTax, sales_tax: salesTax, _initialized: true };
    }

    // Warn if database rates have fractional parts that will be lost by integer sliders
    if (Math.round(Number(nation.income_tax || 0) * 10) % 10 !== 0 ||
        Math.round(Number(nation.corporate_tax || 0) * 10) % 10 !== 0 ||
        Math.round(Number(nation.sales_tax || 0) * 10) % 10 !== 0) {
        console.warn('[Taxation] DB tax rates have fractional precision — slider uses integer rounding');
    }

    var avgRate = (incomeTax + corpTax + salesTax) / 3;
    var totalTaxRevenue = budget.incomeRevenue + budget.corpRevenue + budget.salesRevenue;

    var h = '<div class="econ-tab-body">';

    // ── FISCAL SUMMARY BAR ──
    h += '<div class="tax-summary-bar">';
    h += '<div class="tax-summary-stat">';
    h += '<span class="tax-summary-label">Tax Revenue</span>';
    h += '<span class="tax-summary-value green">' + formatDualPeriod(totalTaxRevenue) + '</span>';
    h += '<span class="tax-summary-detail">' + (budget.grossRevenue > 0 ? Math.round(totalTaxRevenue / budget.grossRevenue * 100) : 0) + '% of total income</span>';
    h += '</div>';

    var taxBurden = Math.round(avgRate * 1.28);
    var burdenLabel = taxBurden < 30 ? 'Low (0–30)' : taxBurden < 50 ? 'Moderate-Low (30–50)' : taxBurden < 70 ? 'Moderate (50–70)' : taxBurden < 85 ? 'High (70–85)' : 'Very High (85+)';
    var burdenClass = taxBurden < 50 ? 'green' : taxBurden < 70 ? 'yellow' : 'red';
    h += '<div class="tax-summary-stat">';
    h += '<span class="tax-summary-label">Tax Burden</span>';
    h += '<span class="tax-summary-value ' + burdenClass + '">' + taxBurden + '</span>';
    h += '<span class="tax-summary-detail">' + burdenLabel + '</span>';
    h += '</div>';

    // Compliance: base from efficiency/corruption, modified by Tax Admin funding
    var efficiency = Number(nation.efficiency || 50);
    var corruption = Number(nation.corruption || 50);
    var baseCompliance = (efficiency + (100 - corruption)) / 2;
    var fundingBonus = taxAdminFunding.fundingPct >= 100 ? 5 :
                       taxAdminFunding.fundingPct >= 75 ? 0 :
                       taxAdminFunding.fundingPct >= 50 ? -5 :
                       taxAdminFunding.fundingPct >= 25 ? -10 : -20;
    var compliance = Math.max(0, Math.min(100, Math.round(baseCompliance + fundingBonus)));
    var complianceDetail = '';
    if (taxAdminFunding.fundingPct < 50) {
        complianceDetail = '&darr; Tax Admin underfunded (' + taxAdminFunding.fundingPct + '%)';
    } else if (corruption > 30) {
        complianceDetail = '&darr; ' + Math.round(corruption / 10) + '% from corruption';
    } else {
        complianceDetail = 'Healthy collection';
    }
    h += '<div class="tax-summary-stat">';
    h += '<span class="tax-summary-label">Compliance</span>';
    h += '<span class="tax-summary-value">' + compliance + '%</span>';
    h += '<span class="tax-summary-detail">' + complianceDetail + '</span>';
    h += '</div>';

    h += '<div class="tax-summary-stat">';
    h += '<span class="tax-summary-label">Avg Effective Rate</span>';
    h += '<span class="tax-summary-value">' + avgRate.toFixed(1) + '%</span>';
    h += '<span class="tax-summary-detail">Across all taxes</span>';
    h += '</div>';

    var pendingCount = taxPendingBills.length;
    h += '<div class="tax-summary-stat">';
    h += '<span class="tax-summary-label">Pending Changes</span>';
    if (pendingCount > 0) {
        h += '<span class="tax-summary-value yellow">' + pendingCount + '</span>';
        h += '<span class="tax-summary-detail">In legislature</span>';
    } else {
        h += '<span class="tax-summary-value" style="color:var(--text-dim);">0</span>';
        h += '<span class="tax-summary-detail">None pending</span>';
    }
    h += '</div>';

    // Submit button — greyed out unless eligible AND ≥1 rate changed
    var changedKeys = Object.keys(taxRateChanges).filter(function(k) { return taxRateChanges[k] !== originalRates[k]; });
    var hasChanges = changedKeys.length > 0;
    var mySeats = currentFaction ? (currentFaction.seats || 0) : 0;
    var isInGovt = activeCoalition && currentFaction && (activeCoalition.party_ids || []).indexOf(currentFaction.id) !== -1;
    var hasAuthority = mySeats >= 1 || isInGovt;
    var canSubmit = hasAuthority && hasChanges;
    var btnDisabled = !canSubmit;
    var termBill = 'Bill';
    var btnTitle = !hasAuthority ? 'Your party holds no legislature seats' : !hasChanges ? 'Adjust at least one tax rate' : 'Submit tax reform ' + termBill.toLowerCase();

    h += '<div class="tax-summary-spacer"></div>';
    h += '<button class="tax-submit-btn" id="tax-submit-btn" ' + (btnDisabled ? 'disabled' : '') + ' title="' + escapeHtml(btnTitle) + '">';
    h += 'Submit Tax ' + termBill;
    h += '</button>';

    h += '</div>'; // .tax-summary-bar

    // ── PRESIDENTIAL INFO CALLOUT ──
    if (hasElectedPresident(nation)) {
        h += '<div class="tax-info-callout">';
        h += '<span class="tax-info-callout-icon">&#8505;</span>';
        h += '<span class="tax-info-callout-text">Tax reform bills passed by the legislature must be <strong>signed by the President</strong> before taking effect. The President may veto, triggering a &frac23; override vote.</span>';
        h += '</div>';
    }

    // ── TAX CARDS ──
    h += '<div class="tax-list">';
    for (var i = 0; i < TAX_CONFIG.length; i++) {
        h += renderTaxCard(TAX_CONFIG[i], nation, budget);
    }
    h += '</div>';

    h += '</div>'; // .econ-tab-body
    return h;
}

function renderTaxCard(config, nation, budget) {
    var origRate = originalRates[config.key] || Math.round(Number(nation[config.key] || 0));
    var currentRate = (taxRateChanges[config.key] !== undefined) ? taxRateChanges[config.key] : origRate;
    var isChanged = currentRate !== origRate;
    var revenue = budget[config.revenueKey] || 0;
    var effects = getTaxEffects(config.key);

    // Revenue projection
    var gdp = Number(nation.gdp || 0);
    var eff = Number(nation.efficiency || 50);
    var corr = Number(nation.corruption || 50);
    var collectionRate = 0.35 + ((eff + (100 - corr)) / 200) * 0.65;
    var projectedRevenue = gdp * (currentRate / 100) * config.gdpMultiplier * collectionRate;
    var revenueDelta = projectedRevenue - revenue;

    var fillPct = config.maxRate > 0 ? Math.round((currentRate / config.maxRate) * 100) : 0;
    var colorClass = getSliderColorClass(currentRate, config.maxRate);

    var h = '<div class="tax-card' + (isChanged ? ' tax-card-changed' : '') + '">';

    // ── TOP ROW ──
    h += '<div class="tax-top">';
    h += '<span class="tax-name">' + escapeHtml(config.name) + '</span>';
    h += '<span class="tax-category-pill ' + config.categoryClass + '">' + escapeHtml(config.category) + '</span>';
    h += '<div class="tax-spacer"></div>';

    // Sparkline
    var sparkRevenues = computeSparklineRevenues(config.key, config.gdpMultiplier);
    if (sparkRevenues.length > 0) {
        var sparkMax = Math.max.apply(null, sparkRevenues) || 1;
        h += '<div class="tax-sparkline-container">';
        h += '<span class="tax-sparkline-label">' + sparkRevenues.length + ' ticks</span>';
        h += '<div class="tax-sparkline">';
        for (var s = 0; s < sparkRevenues.length; s++) {
            var barH = Math.max(2, Math.round((sparkRevenues[s] / sparkMax) * 20));
            var barCls = (s === sparkRevenues.length - 1) ? ' current' : '';
            h += '<div class="tax-spark-bar' + barCls + '" style="height:' + barH + 'px"></div>';
        }
        h += '</div>';
        h += '</div>';
    }

    h += '<div class="tax-revenue-block">';
    h += '<span class="tax-revenue-label">Revenue</span>';
    if (isChanged) {
        h += '<span class="tax-revenue-value">' + formatDualPeriod(projectedRevenue) + '</span>';
        var deltaClass = revenueDelta >= 0 ? 'tax-delta-positive' : 'tax-delta-negative';
        var deltaSign = revenueDelta >= 0 ? '+' : '';
        h += '<span class="tax-revenue-delta ' + deltaClass + '">' + formatDualPeriod(revenueDelta, deltaSign) + '</span>';
    } else {
        h += '<span class="tax-revenue-value">' + formatDualPeriod(revenue) + '</span>';
    }
    h += '</div>';
    h += '</div>';

    // ── SLIDER ROW ──
    h += '<div class="tax-slider-row">';
    h += '<div class="tax-rate-display" id="tax-rate-val-' + config.key + '">' + currentRate + '<span class="tax-pct">%</span></div>';
    h += '<div class="tax-slider-container">';
    h += '<div class="tax-slider-visual">';
    h += '<div class="tax-slider-track">';
    h += '<div class="tax-slider-fill ' + colorClass + '" id="tax-fill-' + config.key + '" style="width:' + fillPct + '%"></div>';
    h += '</div>';
    h += '<input type="range" class="tax-rate-slider" data-tax-key="' + config.key + '" min="0" max="' + config.maxRate + '" step="1" value="' + currentRate + '">';
    h += '</div>';
    h += '<div class="tax-slider-labels">';
    h += '<span class="tax-slider-min">0%</span>';
    h += '<span class="tax-slider-max">' + config.maxRate + '%</span>';
    h += '</div>';
    h += '</div>';
    if (isChanged) {
        h += '<button class="tax-reset-btn" data-tax-key="' + config.key + '">Reset</button>';
    }
    h += '</div>';

    // ── APPROVAL IMPACT PREVIEW ──
    if (isChanged) {
        var rateDiff = currentRate - origRate;
        if (config.key === 'corporate_tax') {
            // Corporate Tax: flat voter bloc effect on Business Owners
            var blocImpact = rateDiff > 0 ? -3 : 2;
            var blocLabel = blocImpact >= 0 ? 'VOTER BLOC APPROVAL INCREASE' : 'VOTER BLOC APPROVAL DECREASE';
            var blocClass = blocImpact >= 0 ? 'tax-approval-increase' : 'tax-approval-decrease';
            var blocSign = blocImpact >= 0 ? '+' : '';
            var blocExplain = rateDiff > 0 ? 'Raising corporate tax' : 'Lowering corporate tax';
            h += '<div class="tax-approval-impact ' + blocClass + '">';
            h += '<span class="tax-approval-badge">' + blocLabel + '</span> ';
            h += '<span class="tax-approval-value">' + blocSign + blocImpact + '%</span>';
            h += '<span class="tax-approval-explain">(' + blocExplain + ')</span>';
            h += '<span class="tax-approval-scope">Business Owners voter bloc (proposing party)</span>';
            h += '</div>';
        } else {
            var approvalImpact = rateDiff > 0 ? rateDiff * -2 : Math.abs(rateDiff) * 1;
            var impactLabel = approvalImpact >= 0 ? 'APPROVAL RATE INCREASE' : 'APPROVAL RATE DECREASE';
            var impactClass = approvalImpact >= 0 ? 'tax-approval-increase' : 'tax-approval-decrease';
            var impactSign = approvalImpact >= 0 ? '+' : '';
            var impactExplain = rateDiff > 0
                ? Math.abs(rateDiff) + '% increase &times; -2 per point'
                : Math.abs(rateDiff) + '% decrease &times; +1 per point';
            var scopeNote = 'Proposing party (all voter blocs)';
            h += '<div class="tax-approval-impact ' + impactClass + '">';
            h += '<span class="tax-approval-badge">' + impactLabel + '</span> ';
            h += '<span class="tax-approval-value">' + impactSign + approvalImpact + '%</span>';
            h += '<span class="tax-approval-explain">(' + impactExplain + ')</span>';
            h += '<span class="tax-approval-scope">' + scopeNote + '</span>';
            h += '</div>';
        }
    }

    // ── EFFECTS + HITS FOOTER ──
    h += '<div class="tax-bottom">';

    if (effects.length > 0) {
        h += '<div class="tax-effects-grid">';
        for (var i = 0; i < effects.length; i++) {
            var eff = effects[i];
            var arrowCls = eff.target_dir === 'up' ? 'up' : 'down';
            var arrowChar = eff.target_dir === 'up' ? '&#9650;' : '&#9660;';
            h += '<div class="tax-effect-item">';
            h += '<span class="tax-effect-arrow ' + arrowCls + '">' + arrowChar + '</span>';
            h += '<span class="tax-effect-stat">' + escapeHtml(formatStatName(eff.target_stat)) + '</span>';
            h += '</div>';
        }
        h += '</div>';
    } else {
        h += '<div class="tax-effects-empty">No stat effects configured</div>';
    }


    h += '</div>'; // .tax-bottom

    // ── PENDING BILL BANNER ──
    for (var p = 0; p < taxPendingBills.length; p++) {
        var pb = taxPendingBills[p];
        var matchesTax = false;
        var metadataChanges = pb.metadata && Array.isArray(pb.metadata.tax_changes)
            ? pb.metadata.tax_changes
            : [];
        for (var mt = 0; mt < metadataChanges.length; mt++) {
            var metaKey = metadataChanges[mt] ? (metadataChanges[mt].tax_key || metadataChanges[mt].key) : null;
            if (metaKey === config.key) {
                matchesTax = true;
                break;
            }
        }

        var billArticles = pb.bill_articles || [];
        if (!matchesTax) {
            for (var pa = 0; pa < billArticles.length; pa++) {
                var ed = billArticles[pa].effect_data || {};
                if (ed.tax_key === config.key) {
                    matchesTax = true; break;
                }
            }
        }
        if (matchesTax) {
            var statusLabel = pb.status === 'floor'
                ? 'Floor Vote'
                : (pb.status === 'president_desk' ? 'President Desk' : 'Committee');
            h += '<a href="bill.html?id=' + pb.id + '" class="tax-proposed-change">';
            h += '<span class="tax-proposed-icon">&#128203;</span>';
            h += '<span class="tax-proposed-text">Pending: <strong>' + escapeHtml(pb.bill_name) + '</strong></span>';
            h += '<span class="tax-proposed-status">' + statusLabel + '</span>';
            h += '</a>';
        }
    }

    h += '</div>'; // .tax-card
    return h;
}

// ==================== BUDGET TAB ====================

var MINISTRY_DESCRIPTIONS = {
    'Finance': 'Economic oversight',
    'Defense': 'Armed forces & security',
    'Healthcare': 'Public healthcare',
    'Education': 'Public schooling & universities',
    'Transportation': 'Roads, utilities, transit',
    'Interior': 'Civil administration',
    'Labor': 'Employment & welfare',
    'Energy': 'Power generation & regulation',
    'Justice': 'Courts & law enforcement',
    'Foreign Ministry': 'Diplomacy & foreign affairs',
    'Trade': 'Commerce & trade policy'
};

function renderBudgetTab(nation) {
    var budget = calculateNationalBudget(nation);

    // Apply tariff override using getCappedTariffRevenue (single source of truth)
    var cappedTariff = getCappedTariffRevenue(nation);
    if (cappedTariff > 0) {
        applyTradeTariffOverride(budget, cappedTariff, Number(nation.gdp ?? nation.GDP ?? 0));
    }

    var aidReceived = aidData ? Number(aidData.received || 0) : 0;
    var aidGiven = aidData ? Number(aidData.given || 0) : 0;
    budget.grossRevenue += aidReceived;

    var totalExpenditure = 0;
    var expByCat = {};
    if (expenditureData) {
        for (var k in expenditureData) {
            expByCat[k] = expenditureData[k] || 0;
            totalExpenditure += expenditureData[k] || 0;
        }
    }
    totalExpenditure += budget.debtService || 0;
    if (aidGiven > 0) totalExpenditure += aidGiven;

    var balance = budget.grossRevenue - totalExpenditure;
    var isDeficit = balance < 0;
    var balSign = balance >= 0 ? '+' : '';

    var h = '<div class="econ-tab-body">';

    // --- Summary bar: 3 cards ---
    h += '<div class="bv2-summary-bar">';
    h += '<div class="bv2-card">';
    h += '<div class="bv2-card-label" style="color:var(--green);">REVENUE</div>';
    h += '<div class="bv2-card-value">' + formatDualPeriod(budget.grossRevenue) + '</div>';
    h += '</div>';
    h += '<div class="bv2-card">';
    h += '<div class="bv2-card-label" style="color:var(--red);">EXPENDITURES</div>';
    h += '<div class="bv2-card-value">' + formatDualPeriod(totalExpenditure) + '</div>';
    h += '</div>';
    h += '<div class="bv2-card">';
    h += '<div class="bv2-card-label" style="color:' + (isDeficit ? 'var(--red)' : 'var(--green)') + ';">' + (isDeficit ? 'DEFICIT' : 'SURPLUS') + '</div>';
    h += '<div class="bv2-card-value" style="color:' + (isDeficit ? 'var(--red)' : 'var(--green)') + ';">' + formatDualPeriod(balance, balSign) + '</div>';
    h += '</div>';
    h += '</div>';

    // --- Split layout: budget left, ministry detail right ---
    h += '<div class="bv2-budget-split">';
    h += '<div class="bv2-budget-left">';

    // --- Two-column breakdown ---
    h += '<div class="bv2-breakdown">';

    // LEFT: Revenues
    h += '<div class="bv2-col">';
    h += '<div class="bv2-col-header">';
    h += '<span class="bv2-col-title" style="color:var(--green);">REVENUES</span>';
    h += '<span class="bv2-col-total" style="color:var(--green);">Total: ' + formatDualPeriod(budget.grossRevenue) + '</span>';
    h += '</div>';

    h += bv2RevenueRow('INCOME TAX', Math.round(Number(nation.income_tax || 0)) + '% rate · Income bracket', budget.incomeRevenue);
    h += bv2RevenueRow('SALES TAX', Math.round(Number(nation.sales_tax || 0)) + '% rate · Consumption', budget.salesRevenue);
    h += bv2RevenueRow('CORPORATE TAX', Math.round(Number(nation.corporate_tax || 0)) + '% rate · Corporate profits', budget.corpRevenue);
    h += bv2RevenueRow('TARIFF & TRADE', 'Import duties · Trade balance', budget.tariffRevenue);
    if (budget.oilRevenue > 0) {
        h += bv2RevenueRow('OIL & GAS', 'State resource revenue', budget.oilRevenue);
    }
    if (aidReceived > 0) {
        h += bv2RevenueRow('FOREIGN AID', 'Aid received from partners', aidReceived);
    }

    h += '<div class="bv2-total-row">';
    h += '<span class="bv2-total-label">TOTAL REVENUE</span>';
    h += '<span class="bv2-total-value">' + formatDualPeriod(budget.grossRevenue) + '</span>';
    h += '</div>';
    h += '</div>';

    // RIGHT: Expenditures
    h += '<div class="bv2-col">';
    h += '<div class="bv2-col-header">';
    h += '<span class="bv2-col-title" style="color:var(--red);">EXPENDITURES &mdash; MINISTRY COSTS</span>';
    h += '<span class="bv2-col-total" style="color:var(--red);">Total: ' + formatDualPeriod(totalExpenditure) + '</span>';
    h += '</div>';

    // Sort ministries by cost descending
    var sortedMins = [];
    for (var cat in expByCat) {
        if (expByCat[cat] > 0) {
            sortedMins.push({ name: cat, cost: expByCat[cat] });
        }
    }
    sortedMins.sort(function(a, b) { return b.cost - a.cost; });

    for (var i = 0; i < sortedMins.length; i++) {
        var m = sortedMins[i];
        var dispName = m.name === 'Foreign Ministry' ? 'MINISTRY OF FOREIGN AFFAIRS' : 'MINISTRY OF ' + m.name.toUpperCase();
        var desc = MINISTRY_DESCRIPTIONS[m.name] || '';
        var mFundPct = ministryFundingPcts[m.name] !== undefined ? ministryFundingPcts[m.name] : 100;
        h += bv2ExpenditureRow(dispName, desc, m.cost, mFundPct);
    }
    if (budget.debtService > 0) {
        h += bv2ExpenditureRow('INTEREST ON DEBT', 'Debt service payments', budget.debtService, null);
    }
    if (aidGiven > 0) {
        h += bv2ExpenditureRow('FOREIGN AID GIVEN', 'Aid commitments to partners', aidGiven, null);
    }

    h += '<div class="bv2-total-row">';
    h += '<span class="bv2-total-label">TOTAL EXPENDITURE</span>';
    h += '<span class="bv2-total-value">' + formatDualPeriod(totalExpenditure) + '</span>';
    h += '</div>';
    h += '</div>';

    h += '</div>'; // .bv2-breakdown

    // --- Net balance box ---
    var netColor = isDeficit ? 'var(--red)' : 'var(--green)';
    var netIcon = isDeficit ? '&#9660;' : '&#9650;'; // Down arrow for deficit, up for surplus
    var netLabel = isDeficit ? 'DEFICIT' : 'SURPLUS';
    h += '<div class="bv2-net-box" style="border-color:' + netColor + ';">';
    h += '<div class="bv2-net-header">';
    h += '<span class="bv2-net-icon" style="color:' + netColor + ';">' + netIcon + '</span>';
    h += '<span class="bv2-net-label" style="color:' + netColor + ';">' + netLabel + '</span>';
    h += '</div>';
    h += '<div class="bv2-net-amount" style="color:' + netColor + ';">' + formatDualPeriod(balance, balSign) + '</div>';
    if (isDeficit) {
        h += '<div class="bv2-net-subtext">SHORTFALL ATTRIBUTING TO NATIONAL DEBT THIS TICK</div>';
    }
    h += '<div class="bv2-net-breakdown">';
    h += '<div class="bv2-net-col"><div class="bv2-net-col-label">TOTAL REVENUE</div><div class="bv2-net-col-value">' + formatDualPeriod(budget.grossRevenue) + '</div></div>';
    h += '<div class="bv2-net-col"><div class="bv2-net-col-label">TOTAL EXPENDITURE</div><div class="bv2-net-col-value">' + formatDualPeriod(totalExpenditure) + '</div></div>';
    h += '<div class="bv2-net-col"><div class="bv2-net-col-label">NET</div><div class="bv2-net-col-value" style="color:' + netColor + ';">' + formatDualPeriod(balance, balSign) + '</div></div>';
    h += '</div>';
    h += '</div>';

    // --- Info notice ---
    if (isDeficit) {
        h += '<div class="bv2-info-bar">';
        h += '<span class="bv2-info-icon">i</span> ';
        h += 'The shortfall of <strong style="color:#d9534f;">' + formatBudgetCurrency(Math.abs(balance)) + '</strong> exceeds available revenue ';
        h += 'and is being added to the national debt each tick. ';
        h += 'Raise taxes, grow the economy, or reduce ministry funding to close the gap.';
        h += '</div>';
    }

    // --- Ministry Detail Panel (right column) ---
    h += '</div>'; // close .bv2-budget-left
    h += '<div class="bv2-budget-right">';
    h += renderMinistryPanel();
    h += '</div>';
    h += '</div>'; // close .bv2-budget-split

    h += '</div>'; // .econ-tab-body
    return h;
}

function bv2RevenueRow(label, subtitle, value) {
    var h = '<div class="bv2-row">';
    h += '<div class="bv2-row-left">';
    h += '<div class="bv2-row-label">' + escapeHtml(label) + '</div>';
    h += '<div class="bv2-row-subtitle">' + escapeHtml(subtitle) + '</div>';
    h += '</div>';
    h += '<div class="bv2-row-value">' + formatDualPeriod(value) + '</div>';
    h += '</div>';
    return h;
}

function bv2ExpenditureRow(label, subtitle, value, fundingPct) {
    var h = '<div class="bv2-row">';
    h += '<div class="bv2-row-left">';
    h += '<div class="bv2-row-label">' + escapeHtml(label) + '</div>';
    h += '<div class="bv2-row-subtitle">' + escapeHtml(subtitle) + '</div>';
    h += '</div>';
    h += '<div class="bv2-row-right">';
    if (fundingPct !== null) {
        h += '<span class="bv2-funding-badge">' + fundingPct + '%</span>';
    }
    h += '<span class="bv2-row-value">' + formatDualPeriod(value) + '</span>';
    h += '</div>';
    h += '</div>';
    return h;
}

// ==================== TRADE TAB ====================
function renderTradeTab(nation) {
    var h = '<div class="econ-tab-body"><div class="econ-overview">';

    if (!tradeData || !tradeData.summary) {
        h += '<div class="econ-section">';
        h += '<div class="econ-section-header">TRADE</div>';
        h += '<div class="trade-placeholder">Trade data will appear after the next tick.</div>';
        h += '</div></div></div>';
        return h;
    }

    var summary = tradeData.summary;
    var totalExports = Number(summary.total_exports) || 0;
    var totalImports = Number(summary.total_imports) || 0;
    var surplus = Number(summary.trade_surplus) || 0;

    // --- Trade Overview Cards ---
    h += '<div class="econ-section">';
    h += '<div class="econ-section-header">TRADE OVERVIEW</div>';
    h += '<div class="econ-cards-row econ-cards-4">';
    h += renderOverviewCard('Total Exports', formatDualPeriod(totalExports), 'surplus', null);
    h += renderOverviewCard('Total Imports', formatDualPeriod(totalImports), 'deficit', null);
    var balCls = surplus >= 0 ? 'surplus' : 'deficit';
    var balSign = surplus >= 0 ? '+' : '';
    h += renderOverviewCard('Trade Balance', formatDualPeriod(surplus, balSign), balCls, null);
    var cappedTariffRev = getCappedTariffRevenue(nation);
    h += renderOverviewCard('Tariff Revenue', formatDualPeriod(cappedTariffRev), cappedTariffRev > 0 ? 'surplus' : 'neutral', null);
    h += '</div>';
    h += '</div>';

    // --- Sector Flows Table ---
    h += renderSectorFlowsTable(nation);

    // --- Trade Scores ---
    h += renderTradeScoresSection(nation);

    // --- Trading Partners ---
    h += renderTradePartnersSection();

    h += '</div></div>';
    return h;
}

function renderSectorFlowsTable(nation) {
    if (!tradeData || !tradeData.flows) return '';

    var h = '<div class="econ-section">';
    h += '<div class="econ-section-header">SECTOR FLOWS</div>';
    h += '<div class="econ-section-subtitle">Export and import volumes by sector. Click a sector for details.</div>';

    // Table header
    h += '<div class="trade-flow-table">';
    h += '<div class="tft-header">';
    h += '<div class="tft-cell tft-sector">SECTOR</div>';
    h += '<div class="tft-cell tft-num">EXPORTS</div>';
    h += '<div class="tft-cell tft-num">IMPORTS</div>';
    h += '<div class="tft-cell tft-num">NET</div>';
    h += '<div class="tft-cell tft-num">PRICE MOD</div>';
    h += '<div class="tft-cell tft-trend">TREND</div>';
    h += '</div>';

    var totalExp = 0, totalImp = 0;

    for (var i = 0; i < TRADE_SECTORS.length; i++) {
        var sector = TRADE_SECTORS[i];
        var sKey = sector.key;
        var flow = tradeData.flows[sKey];
        var expVol = flow ? Number(flow.export_volume) || 0 : 0;
        var impVol = flow ? Number(flow.import_volume) || 0 : 0;
        var priceMod = flow ? Number(flow.price_modifier) || 1 : 1;
        var net = expVol - impVol;

        if (expVol <= 0 && impVol <= 0) continue;

        totalExp += expVol;
        totalImp += impVol;

        var netColor = net > 0 ? '#5cb85c' : net < 0 ? '#d9534f' : '#666';
        var netSign = net > 0 ? '+' : '';
        var priceColor = priceMod >= 1.05 ? '#5cb85c' : priceMod <= 0.95 ? '#d9534f' : '#888';

        // Trend from previous tick
        var prevExp = tradeData.prevFlows[sKey] ? Number(tradeData.prevFlows[sKey].export_volume) || 0 : null;
        var prevImp = tradeData.prevFlows[sKey] ? Number(tradeData.prevFlows[sKey].import_volume) || 0 : null;
        var prevNet = (prevExp !== null && prevImp !== null) ? prevExp - prevImp : null;

        h += '<div class="tft-row tft-row-clickable" data-sector="' + sKey + '">';
        h += '<div class="tft-cell tft-sector">';
        h += '<span class="tft-sector-name">' + escapeHtml(sector.label) + '</span>';
        if (sector.export_only) h += '<span class="tft-export-only">EXPORT ONLY</span>';
        h += '<span class="tft-drill-chevron">&#x203A;</span>';
        h += '</div>';
        h += '<div class="tft-cell tft-num" style="color:#5cb85c">' + formatBudgetCurrency(expVol) + '</div>';
        h += '<div class="tft-cell tft-num" style="color:#d9534f">' + (impVol > 0 ? formatBudgetCurrency(impVol) : '—') + '</div>';
        h += '<div class="tft-cell tft-num" style="color:' + netColor + '">' + netSign + formatBudgetCurrency(net) + '</div>';
        h += '<div class="tft-cell tft-num" style="color:' + priceColor + '">' + priceMod.toFixed(2) + 'x</div>';
        h += '<div class="tft-cell tft-trend">';
        if (prevNet !== null) {
            h += tradeTrendHtml(net, prevNet, false);
        } else {
            h += '<span class="budget-trend trend-neutral">&mdash;</span>';
        }
        h += '</div>';
        h += '</div>';
    }

    // Totals row
    var totalNet = totalExp - totalImp;
    var totalNetColor = totalNet > 0 ? '#5cb85c' : totalNet < 0 ? '#d9534f' : '#666';
    var totalNetSign = totalNet > 0 ? '+' : '';
    h += '<div class="tft-row tft-total">';
    h += '<div class="tft-cell tft-sector">TOTAL</div>';
    h += '<div class="tft-cell tft-num" style="color:#5cb85c">' + formatBudgetCurrency(totalExp) + '</div>';
    h += '<div class="tft-cell tft-num" style="color:#d9534f">' + formatBudgetCurrency(totalImp) + '</div>';
    h += '<div class="tft-cell tft-num" style="color:' + totalNetColor + '">' + totalNetSign + formatBudgetCurrency(totalNet) + '</div>';
    h += '<div class="tft-cell tft-num"></div>';
    h += '<div class="tft-cell tft-trend"></div>';
    h += '</div>';

    h += '</div>';
    h += '</div>';
    return h;
}

function renderTradeScoresSection(nation) {
    var n = nation;
    var scores = [
        {
            name: 'Manufacturing',
            value: Number(n.manufacturing_output) || 0,
            stats: [
                { label: 'Mfg. Output', value: Number(n.manufacturing_output) || 0 }
            ]
        },
        {
            name: 'Technology',
            value: ((Number(n.digital_infrastructure) || 0) + (Number(n.higher_education) || 0)) / 2,
            stats: [
                { label: 'Digital Infra', value: Number(n.digital_infrastructure) || 0 },
                { label: 'Higher Ed', value: Number(n.higher_education) || 0 }
            ]
        },
        {
            name: 'Tourism',
            value: ((Number(n.happiness) || 0) + (Number(n.stability) || 0) + (Number(n.physical_infrastructure) || 0)) / 3,
            stats: [
                { label: 'Happiness', value: Number(n.happiness) || 0 },
                { label: 'Stability', value: Number(n.stability) || 0 },
                { label: 'Phys. Infra', value: Number(n.physical_infrastructure) || 0 }
            ]
        },
        {
            name: 'Services & Finance',
            value: Number(n.service_output) || 0,
            stats: [
                { label: 'Service Output', value: Number(n.service_output) || 0 }
            ]
        }
    ];

    var h = '<div class="econ-section">';
    h += '<div class="econ-section-header">DERIVED TRADE SCORES</div>';
    h += '<div class="econ-section-subtitle">Composite scores determine export capacity in derived sectors.</div>';
    h += '<div class="trade-scores-grid">';

    for (var i = 0; i < scores.length; i++) {
        var s = scores[i];
        var rounded = Math.round(s.value * 10) / 10;
        var pct = Math.min(100, Math.round(s.value));
        var color = pct >= 70 ? '#5cb85c' : pct >= 40 ? '#f0efe6' : '#d9534f';
        var borderColor = pct >= 70 ? '#5cb85c' : pct >= 40 ? '#888' : '#d9534f';

        h += '<div class="trade-score-card" style="border-left-color:' + borderColor + '">';
        h += '<div class="trade-score-name"' + (NATION_COLORS[s.name] ? ' style="color:' + NATION_COLORS[s.name] + '"' : '') + '>' + escapeHtml(s.name) + '</div>';
        h += '<div class="trade-score-value" style="color:' + color + '">' + rounded.toFixed(1) + '</div>';
        h += '<div class="trade-score-bar"><div class="trade-score-bar-fill" style="width:' + pct + '%;background:' + borderColor + '"></div></div>';
        h += '<div class="trade-score-stats">';
        for (var j = 0; j < s.stats.length; j++) {
            var st = s.stats[j];
            var stColor = st.value >= 70 ? '#5cb85c' : st.value >= 40 ? '#f0efe6' : '#d9534f';
            h += '<span class="trade-score-stat">' + escapeHtml(st.label) + ' <strong style="color:' + stColor + '">' + Math.round(st.value) + '</strong></span>';
        }
        h += '</div>';
        h += '</div>';
    }

    h += '</div>';
    h += '</div>';
    return h;
}

// ==================== TRADE PARTNERS SECTION ====================
function renderTradePartnersSection() {
    if (!tradeData || !tradeData.partners) {
        return '';
    }

    var partners = tradeData.partners;
    var partnerIds = Object.keys(partners);
    if (partnerIds.length === 0) {
        return '';
    }

    partnerIds.sort(function(a, b) {
        var volA = partners[a].totalExports + partners[a].totalImports;
        var volB = partners[b].totalExports + partners[b].totalImports;
        return volB - volA;
    });

    var maxVolume = 0;
    for (var i = 0; i < partnerIds.length; i++) {
        var p = partners[partnerIds[i]];
        maxVolume = Math.max(maxVolume, p.totalExports + p.totalImports);
    }

    var h = '<div class="econ-section">';
    h += '<div class="econ-section-header">TRADING PARTNERS</div>';
    h += '<div class="econ-section-subtitle">Bilateral trade volumes sorted by total volume.</div>';
    h += '<div class="trade-partners-grid">';

    for (var i = 0; i < partnerIds.length; i++) {
        var pid = partnerIds[i];
        var p = partners[pid];
        var balance = p.totalExports - p.totalImports;
        var totalVol = p.totalExports + p.totalImports;
        var borderColor = balance > 0 ? '#5cb85c' : balance < 0 ? '#d9534f' : '#888';

        h += '<div class="partner-card" style="border-left-color:' + borderColor + '">';

        // Header row: name + affinity
        h += '<div class="partner-header">';
        h += '<div class="partner-name"' + (NATION_COLORS[p.name] ? ' style="color:' + NATION_COLORS[p.name] + '"' : '') + '>' + escapeHtml(p.name) + '</div>';
        var affTipHtml = '';
        if (p.affinityBreakdown) {
            var ab = p.affinityBreakdown;
            affTipHtml += '<div class="aff-tip-title">Trade Affinity</div>';
            affTipHtml += '<div class="aff-tip-desc">How likely two nations are to trade with each other, based on diplomacy, agreements, and geography.</div>';
            affTipHtml += '<div class="aff-tip-rows">';
            affTipHtml += '<div class="aff-tip-row"><span>Base</span><span>+' + ab.base + '</span></div>';
            affTipHtml += '<div class="aff-tip-row"><span>Diplomatic <span class="aff-tip-detail">(rel ' + ab.relScore + ' × 0.3)</span></span><span>' + (ab.diplomatic >= 0 ? '+' : '') + ab.diplomatic + '</span></div>';
            if (ab.tradeType) {
                affTipHtml += '<div class="aff-tip-row"><span>Trade Pact <span class="aff-tip-detail">(' + ab.tradeType + ')</span></span><span>+' + ab.trade + '</span></div>';
            }
            affTipHtml += '<div class="aff-tip-row"><span>Proximity <span class="aff-tip-detail">(dist ' + ab.proximityRaw + '/100)</span></span><span>+' + ab.proximity + '</span></div>';
            if (ab.embargo) {
                affTipHtml += '<div class="aff-tip-row aff-tip-negative"><span>Embargo</span><span>' + ab.embargo + '</span></div>';
            }
            affTipHtml += '</div>';
            affTipHtml += '<div class="aff-tip-total"><span>Total</span><span>' + Math.round(p.affinity) + ' / 100</span></div>';
        }
        h += '<div class="partner-affinity aff-tip-wrap">';
        h += '<span class="aff-tip-trigger">AFF ' + Math.round(p.affinity) + ' ⓘ</span>';
        if (affTipHtml) h += '<div class="aff-tooltip">' + affTipHtml + '</div>';
        h += '</div>';
        h += '</div>';

        // Stats row
        h += '<div class="partner-stats">';
        h += '<div class="partner-stat"><span class="partner-stat-label">EXP</span><span class="partner-stat-value exports">' + formatDualPeriod(p.totalExports) + '</span></div>';
        h += '<div class="partner-stat"><span class="partner-stat-label">IMP</span><span class="partner-stat-value imports">' + formatDualPeriod(p.totalImports) + '</span></div>';
        var balClass = balance >= 0 ? 'surplus' : 'deficit';
        var balSign = balance >= 0 ? '+' : '';
        h += '<div class="partner-stat"><span class="partner-stat-label">NET</span><span class="partner-stat-value ' + balClass + '">' + formatDualPeriod(balance, balSign) + '</span></div>';
        h += '</div>';

        // Volume bar
        if (maxVolume > 0) {
            var expPct = (p.totalExports / maxVolume) * 100;
            var impPct = (p.totalImports / maxVolume) * 100;
            h += '<div class="partner-bar-container">';
            h += '<div class="partner-bar">';
            h += '<div class="partner-bar-exports" style="width:' + expPct.toFixed(1) + '%"></div>';
            h += '<div class="partner-bar-imports" style="width:' + impPct.toFixed(1) + '%"></div>';
            h += '</div>';
            h += '</div>';
        }

        // Sector breakdown (compact)
        var sectorParts = [];
        for (var si = 0; si < TRADE_SECTORS.length; si++) {
            var sKey = TRADE_SECTORS[si].key;
            var expAmt = p.exportsTo[sKey] || 0;
            var impAmt = p.importsFrom[sKey] || 0;
            if (expAmt > 0 || impAmt > 0) {
                sectorParts.push({ label: TRADE_SECTORS[si].label, exp: expAmt, imp: impAmt });
            }
        }
        if (sectorParts.length > 0) {
            h += '<div class="partner-sectors">';
            for (var si = 0; si < sectorParts.length; si++) {
                var sp = sectorParts[si];
                var detail = '';
                if (sp.exp > 0 && sp.imp > 0) {
                    detail = '<span style="color:#5cb85c">' + formatBudgetCurrency(sp.exp) + '</span> / <span style="color:#d9534f">' + formatBudgetCurrency(sp.imp) + '</span>';
                } else if (sp.exp > 0) {
                    detail = '<span style="color:#5cb85c">' + formatBudgetCurrency(sp.exp) + '</span>';
                } else {
                    detail = '<span style="color:#d9534f">' + formatBudgetCurrency(sp.imp) + '</span>';
                }
                h += '<div class="partner-sector-line">';
                h += '<span class="partner-sector-name">' + escapeHtml(sp.label) + '</span>';
                h += '<span class="partner-sector-detail">' + detail + '</span>';
                h += '</div>';
            }
            h += '</div>';
        }

        h += '</div>';
    }

    h += '</div>';
    h += '</div>';
    return h;
}

// ==================== SECTORS TAB ====================
function renderSectorsTab(nation) {
    var h = '<div class="econ-tab-body"><div class="econ-overview">';

    // Sector selector tabs
    h += '<div class="econ-section sector-tabs-section">';
    h += '<div class="sector-tabs">';
    for (var i = 0; i < TRADE_SECTORS.length; i++) {
        var s = TRADE_SECTORS[i];
        var isFood = s.key === 'food_agriculture';
        var score = getSectorScore(nation, s);
