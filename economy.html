// ==================== TREND ARROW ====================
function getTrendArrow(statKey, currentValue, inverted) {
    if (!previousTickData || currentValue === null || currentValue === undefined) {
        return '<span class="trend-neutral">&mdash;</span>';
    }

    var prevValue = previousTickData[statKey];
    if (prevValue === null || prevValue === undefined) {
        return '<span class="trend-neutral">&mdash;</span>';
    }

    var delta = Number(currentValue) - Number(prevValue);
    var invertedClass = inverted ? ' inverted' : '';

    if (delta > 0.05) {
        return '<span class="trend-up' + invertedClass + '">&#9650; +' + formatDelta(delta) + '</span>';
    } else if (delta < -0.05) {
        return '<span class="trend-down' + invertedClass + '">&#9660; ' + formatDelta(delta) + '</span>';
    }
    return '<span class="trend-neutral">&mdash;</span>';
}

function formatDelta(d) {
    var abs = Math.abs(d);
    if (abs >= 10) return Math.round(abs);
    return abs.toFixed(1);
}

var _industriesCorps = [];
var _industriesSubsidiaries = []; // corps HQ'd elsewhere with properties here

var _industriesMaterials = [];
var _industriesEquipment = [];
var _industriesDeliveries = [];
var _industriesLoans = [];
var _industriesInsurance = [];
var _industriesShippingClaims = [];
var _industriesShippingVessels = [];
var _industriesShipMarket = [];
var _industriesVesselOrders = [];
var _industriesShippingRoutes = [];

async function loadIndustriesData(nationId) {
    var [corpsRes, contractsRes, materialsRes, equipmentRes, deliveriesRes, propsRes, loansRes] = await Promise.all([
        _supabase.from('factions')
            .select('id, faction_name, corp_ticker, corp_company_type, corp_sector, corp_subsector, party_funds, nation_id')
            .eq('faction_type', 'corporation')
            .is('abandoned_at', null),
        _supabase.from('construction_contracts')
            .select('id, budget_ceiling, status, awarded_to_faction, nation_id, template_key, sector')
            .eq('nation_id', nationId)
            .in('status', ['open', 'bidding', 'awarded', 'in_progress']),
        _supabase.from('corp_warehouse')
            .select('faction_id, material_key, quality_tier, quantity, total_value')
            .eq('nation_id', nationId),
        _supabase.from('corp_equipment')
            .select('faction_id, equipment_key, tier, owned, deployed, condition, maintenance_per_tick')
            .eq('nation_id', nationId),
        _supabase.from('construction_deliveries')
            .select('faction_id, contract_value, payment_received, total_cost, net_profit, delivered_tick')
            .eq('nation_id', nationId)
            .order('delivered_tick', { ascending: false })
            .limit(50),
        _supabase.from('corp_properties')
            .select('faction_id, type, name, nation_id')
            .eq('nation_id', nationId)
            .eq('is_active', true),
        _supabase.from('finance_active_loans')
            .select('id, lender_faction_id, borrower_faction_id, principal, interest_rate, total_paid, total_interest_paid, status, monthly_payment, term_months, purpose')
            .eq('nation_id', nationId)
    ]);
    // Load shipping data
    var [shippingClaimsRes, shippingVesselsRes, shipMarketRes, vesselOrdersRes, shippingRoutesRes] = await Promise.all([
        _supabase.from('shipping_claims').select('id, faction_id, revenue_per_transit, total_revenue, transits_completed, status').eq('nation_id', nationId),
        _supabase.from('corp_vessels').select('id, faction_id, vessel_class, status, condition, base_maintenance').eq('nation_id', nationId),
        _supabase.from('ship_market_listings').select('id, vessel_name, vessel_class, asking_price, condition, seller_type, seller_name, status, purchased_at_tick, listed_at_tick').eq('nation_id', nationId).order('listed_at_tick', { ascending: false }).limit(20),
        _supabase.from('vessel_orders').select('id, faction_id, vessel_name, vessel_class, total_cost, deposit_paid, balance_due, shipyard_nation, delivery_tick, build_ticks, status, ordered_at_tick').eq('shipyard_nation_id', nationId).order('ordered_at_tick', { ascending: false }).limit(20),
        _supabase.from('shipping_routes').select('id, origin_nation_id, destination_nation_id, origin_nation, destination_nation, trade_volume, estimated_revenue, shipping_subsector, transit_ticks, status, competition_count').or('origin_nation_id.eq.' + nationId + ',destination_nation_id.eq.' + nationId).eq('status', 'active'),
    ]);
    _industriesShippingClaims = shippingClaimsRes.data || [];
    _industriesShippingVessels = shippingVesselsRes.data || [];
    _industriesShipMarket = shipMarketRes.data || [];
    _industriesVesselOrders = vesselOrdersRes.data || [];
    _industriesShippingRoutes = shippingRoutesRes.data || [];

    var allCorps = corpsRes.data || [];
    _industriesCorps = allCorps.filter(function(c) { return c.nation_id === nationId; });
    var propFactionIds = new Set((propsRes.data || []).map(function(p) { return p.faction_id; }));
    _industriesSubsidiaries = allCorps.filter(function(c) {
        return c.nation_id !== nationId && propFactionIds.has(c.id);
    });
    _industriesContracts = contractsRes.data || [];
    _industriesMaterials = materialsRes.data || [];
    _industriesEquipment = equipmentRes.data || [];
    _industriesDeliveries = deliveriesRes.data || [];
    _industriesLoans = loansRes.data || [];
    _industriesInsurance = _industriesLoans.filter(function(l) { return l.purpose === 'Construction Insurance'; });
}

function fmtIndustryMoney(val) {
    if (val == null || val === 0) return '$0';
    val = Number(val);
    var abs = Math.abs(val);
    var sign = val < 0 ? '-' : '';
    if (abs >= 1e9) return sign + '$' + (abs / 1e9).toFixed(1) + 'B';
    if (abs >= 1e6) return sign + '$' + (abs / 1e6).toFixed(1) + 'M';
    if (abs >= 1e3) return sign + '$' + (abs / 1e3).toFixed(0) + 'K';
    return sign + '$' + Math.round(abs);
}

function renderIndustriesTab(nation) {
    var gdp = Number(nation.gdp) || 1;

    var constructionRevenue = _industriesContracts.reduce(function(s, c) { return s + (c.budget_ceiling || 0); }, 0);
    var constructionPct = gdp > 0 ? ((constructionRevenue / gdp) * 100) : 0;

    // Corp revenue ranking (from deliveries)
    var corpRevMap = {};
    _industriesDeliveries.forEach(function(d) {
        corpRevMap[d.faction_id] = (corpRevMap[d.faction_id] || 0) + (d.payment_received || 0);
    });

    // Combine local corps + subsidiaries for display
    var allLocalCorps = _industriesCorps.concat(_industriesSubsidiaries);

    // Construction column: only Construction-sector corps
    var constructionCorps = allLocalCorps.filter(function(c) { return (c.corp_sector || '').toLowerCase() === 'construction'; });
    var constructionCorpsSorted = constructionCorps.slice().sort(function(a, b) {
        return (corpRevMap[b.id] || 0) - (corpRevMap[a.id] || 0);
    });

    // Subsidiary lookup for parent display
    var subsidiaryIds = new Set(_industriesSubsidiaries.map(function(s) { return s.id; }));

    // ── MATERIALS: aggregate warehouse value ──

    var materialsRevenue = 0;
    _industriesMaterials.forEach(function(m) {

        materialsRevenue += (m.total_value || 0);
    });
    var materialsPct = gdp > 0 ? ((materialsRevenue / gdp) * 100) : 0;
    var materialKeys = Object.keys(materialTotals).sort(function(a, b) { return materialTotals[b] - materialTotals[a]; });

    // Material purchasers (corps with most material value)
    var matPurchaserMap = {};

    var matPurchasers = Object.entries(matPurchaserMap).sort(function(a, b) { return b[1] - a[1]; }).slice(0, 3);

    // ── VEHICLES/EQUIPMENT: aggregate by type ──
    var equipTotals = {};

    // ── FINANCE: loans, bonds, insurance ──
    var financeCorps = allLocalCorps.filter(function(c) { return (c.corp_sector || '').toLowerCase() === 'finance'; });
    var bankingCorps = financeCorps.filter(function(c) { return (c.corp_subsector || '').toLowerCase() === 'banking'; });

    var insuranceCorps = financeCorps.filter(function(c) { return (c.corp_subsector || '').toLowerCase() === 'insurance'; });

    // Finance overall: total principal outstanding
    var allLoansNonInsurance = _industriesLoans.filter(function(l) { return l.purpose !== 'Construction Insurance'; });
    var financeOutstanding = allLoansNonInsurance.reduce(function(s, l) { return s + (Number(l.principal) || 0); }, 0);

    var financePct = gdp > 0 ? ((financeOutstanding / gdp) * 100) : 0;

    // Investment: bonds and larger deals
    var investmentLoans = allLoansNonInsurance.filter(function(l) { return (Number(l.principal) || 0) >= 50000000; });

    var totalSoldValue = soldListings.reduce(function(s, l) { return s + (Number(l.asking_price) || 0); }, 0);
    var totalOrderValue = _industriesVesselOrders.reduce(function(s, o) { return s + (Number(o.total_cost) || 0); }, 0);
    var shipyardRevenue = totalSoldValue + totalOrderValue;
    var shipyardColor = '#8b9a6b';

    h += '<div style="background:var(--bg-card);border:1px solid var(--border-main);border-top:3px solid ' + shipyardColor + ';border-radius:8px;padding:16px;">';
    h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">';
    h += '<div style="display:flex;align-items:center;gap:6px;"><div style="width:6px;height:6px;border-radius:50%;background:' + shipyardColor + ';"></div><span style="font-size:0.85rem;font-weight:bold;color:' + shipyardColor + ';letter-spacing:1px;">SHIPS SOLD / BUILDING</span></div>';
    h += badge;
    h += '</div>';

    h += '<div style="display:flex;gap:12px;margin-bottom:14px;">';
    h += '<div style="flex:1;"><div style="font-size:0.55rem;color:var(--dtext-3);text-transform:uppercase;">Ships Sold</div><div style="font-size:1.15rem;font-weight:bold;color:var(--dgreen);">' + soldListings.length + '</div></div>';
    h += '<div style="flex:1;"><div style="font-size:0.55rem;color:var(--dtext-3);text-transform:uppercase;">Being Built</div><div style="font-size:1.15rem;font-weight:bold;color:var(--damber);">' + activeOrders.length + '</div></div>';
    h += '<div style="flex:1;"><div style="font-size:0.55rem;color:var(--dtext-3);text-transform:uppercase;">On Market</div><div style="font-size:1.15rem;font-weight:bold;color:var(--dtext-1);">' + availableListings.length + '</div></div>';
    h += '</div>';

    h += '<div style="display:flex;gap:12px;margin-bottom:14px;">';
    h += '<div style="flex:1;"><div style="font-size:0.55rem;color:var(--dtext-3);text-transform:uppercase;">Sales Revenue</div><div style="font-size:1.15rem;font-weight:bold;color:var(--dgreen);">' + fmtIndustryMoney(totalSoldValue) + '</div></div>';
    h += '<div style="flex:1;"><div style="font-size:0.55rem;color:var(--dtext-3);text-transform:uppercase;">Order Value</div><div style="font-size:1.15rem;font-weight:bold;color:var(--damber);">' + fmtIndustryMoney(totalOrderValue) + '</div></div>';
    h += '<div style="flex:1;"><div style="font-size:0.55rem;color:var(--dtext-3);text-transform:uppercase;">Delivered</div><div style="font-size:1.15rem;font-weight:bold;color:var(--dtext-1);">' + completedOrders.length + '</div></div>';
    h += '</div>';

    h += '<div style="font-size:0.7rem;color:var(--dtext-3);margin-bottom:14px;">Shipyard activity in this nation — vessels sold on the market, new builds commissioned, and orders delivered.</div>';

    // Recent activity
    h += secHeader('Recent Sales', shipyardColor);
    if (soldListings.length === 0) {
        h += '<div style="color:var(--dtext-3);font-size:0.7rem;padding:8px 0;font-style:italic;">No ships sold recently.</div>';
    } else {
        for (var si = 0; si < Math.min(3, soldListings.length); si++) {
            var sl = soldListings[si];
            h += '<div style="padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);display:flex;justify-content:space-between;align-items:center;">';
            h += '<div><div style="font-size:0.8rem;font-weight:700;color:var(--dtext-1);">' + escapeHtml(sl.vessel_name) + '</div>';
            h += '<div style="font-size:0.6rem;color:var(--dtext-3);">' + escapeHtml(sl.vessel_class) + ' · ' + sl.condition + '% condition · ' + escapeHtml(sl.seller_type) + '</div></div>';
            h += '<div style="font-size:0.85rem;font-weight:700;color:var(--dgreen);">' + fmtIndustryMoney(sl.asking_price) + '</div>';
            h += '</div>';
        }
    }

    h += secHeader('Active Commissions', shipyardColor);
    if (activeOrders.length === 0) {
        h += '<div style="color:var(--dtext-3);font-size:0.7rem;padding:8px 0;font-style:italic;">No vessels under construction.</div>';
    } else {
        var currentTick = (tradeData && tradeData.flows) ? Object.values(tradeData.flows)[0]?.tick || 0 : 0;
        for (var oi = 0; oi < Math.min(3, activeOrders.length); oi++) {
            var ao = activeOrders[oi];
            var ticksLeft = Math.max(0, (ao.delivery_tick || 0) - (nation.last_budget_tick || 0));
            h += '<div style="padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);display:flex;justify-content:space-between;align-items:center;">';
            h += '<div><div style="font-size:0.8rem;font-weight:700;color:var(--dtext-1);">' + escapeHtml(ao.vessel_name) + '</div>';
            h += '<div style="font-size:0.6rem;color:var(--dtext-3);">' + escapeHtml(ao.vessel_class) + ' · ' + ao.build_ticks + ' tick build · ' + ticksLeft + ' ticks left</div></div>';
            h += '<div style="font-size:0.85rem;font-weight:700;color:var(--damber);">' + fmtIndustryMoney(ao.total_cost) + '</div>';
            h += '</div>';
        }
    }

    h += '</div>';

    // ── FREIGHT MOVED ──
    var routes = _industriesShippingRoutes;
    var totalRoutes = routes.length;
    var totalVolume = routes.reduce(function(s, r) { return s + (Number(r.trade_volume) || 0); }, 0);
    var totalFreightRev = routes.reduce(function(s, r) { return s + (Number(r.estimated_revenue) || 0); }, 0);
    var totalTransits = _industriesShippingClaims.reduce(function(s, cl) { return s + (cl.transits_completed || 0); }, 0);

    // Breakdown by subsector
    var subsectorMap = {};
    routes.forEach(function(r) {
        var key = r.shipping_subsector || 'unknown';
        if (!subsectorMap[key]) subsectorMap[key] = { routes: 0, volume: 0, revenue: 0 };
        subsectorMap[key].routes++;
        subsectorMap[key].volume += Number(r.trade_volume) || 0;
        subsectorMap[key].revenue += Number(r.estimated_revenue) || 0;
    });

    // Top trade partners (other nation on each route)
    var partnerMap = {};
    routes.forEach(function(r) {
        var partner = r.origin_nation_id === nation.id ? (r.destination_nation || '?') : (r.origin_nation || '?');
        if (!partnerMap[partner]) partnerMap[partner] = { routes: 0, volume: 0 };
        partnerMap[partner].routes++;
        partnerMap[partner].volume += Number(r.trade_volume) || 0;
    });
    var topPartners = Object.entries(partnerMap).sort(function(a, b) { return b[1].volume - a[1].volume; }).slice(0, 5);

    var freightColor = '#c86a4a';
    var subsectorLabels = { bulk_cargo: 'Bulk Cargo', container_freight: 'Container', specialized_transport: 'Specialized' };
    var subsectorColors = { bulk_cargo: '#c8a832', container_freight: '#5a8aaa', specialized_transport: '#c86a4a' };

    h += '<div style="background:var(--bg-card);border:1px solid var(--border-main);border-top:3px solid ' + freightColor + ';border-radius:8px;padding:16px;">';
    h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">';
    h += '<div style="display:flex;align-items:center;gap:6px;"><div style="width:6px;height:6px;border-radius:50%;background:' + freightColor + ';"></div><span style="font-size:0.85rem;font-weight:bold;color:' + freightColor + ';letter-spacing:1px;">FREIGHT MOVED</span></div>';
    h += badge;
    h += '</div>';

    h += '<div style="display:flex;gap:12px;margin-bottom:14px;">';
    h += '<div style="flex:1;"><div style="font-size:0.55rem;color:var(--dtext-3);text-transform:uppercase;">Active Routes</div><div style="font-size:1.15rem;font-weight:bold;color:' + freightColor + ';">' + totalRoutes + '</div></div>';
    h += '<div style="flex:1;"><div style="font-size:0.55rem;color:var(--dtext-3);text-transform:uppercase;">Trade Volume</div><div style="font-size:1.15rem;font-weight:bold;color:var(--dgreen);">' + fmtIndustryMoney(totalVolume) + '</div></div>';
    h += '<div style="flex:1;"><div style="font-size:0.55rem;color:var(--dtext-3);text-transform:uppercase;">Transits Done</div><div style="font-size:1.15rem;font-weight:bold;color:var(--dtext-1);">' + totalTransits + '</div></div>';
    h += '</div>';

    h += '<div style="display:flex;gap:12px;margin-bottom:14px;">';
    h += '<div style="flex:1;"><div style="font-size:0.55rem;color:var(--dtext-3);text-transform:uppercase;">Freight Revenue</div><div style="font-size:1.15rem;font-weight:bold;color:var(--dgreen);">' + fmtIndustryMoney(totalFreightRev) + '</div></div>';
    h += '<div style="flex:1;"><div style="font-size:0.55rem;color:var(--dtext-3);text-transform:uppercase;">Avg/Route</div><div style="font-size:1.15rem;font-weight:bold;color:var(--dtext-1);">' + (totalRoutes > 0 ? fmtIndustryMoney(Math.round(totalFreightRev / totalRoutes)) : '$0') + '</div></div>';
    h += '<div style="flex:1;"><div style="font-size:0.55rem;color:var(--dtext-3);text-transform:uppercase;">Competition</div><div style="font-size:1.15rem;font-weight:bold;color:var(--dtext-1);">' + routes.reduce(function(s, r) { return s + (r.competition_count || 0); }, 0) + ' claims</div></div>';
    h += '</div>';

    h += '<div style="font-size:0.7rem;color:var(--dtext-3);margin-bottom:14px;">Total cargo volume passing through this nation\'s ports — imports, exports, and transit freight by shipping subsector.</div>';

    // Subsector breakdown
    h += secHeader('By Subsector', freightColor);
    var subsectorKeys = Object.keys(subsectorMap).sort(function(a, b) { return subsectorMap[b].volume - subsectorMap[a].volume; });
    if (subsectorKeys.length === 0) {
        h += '<div style="color:var(--dtext-3);font-size:0.7rem;padding:8px 0;font-style:italic;">No active shipping routes through this nation.</div>';
    } else {
        var maxSubVol = subsectorKeys.length > 0 ? subsectorMap[subsectorKeys[0]].volume : 1;
        for (var ski = 0; ski < subsectorKeys.length; ski++) {
            var sk = subsectorKeys[ski];
            var sd = subsectorMap[sk];
            var sLabel = subsectorLabels[sk] || sk;
            var sColor = subsectorColors[sk] || freightColor;
            var sBarW = maxSubVol > 0 ? Math.max(2, (sd.volume / maxSubVol) * 100) : 0;
            h += '<div style="padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);">';
            h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">';
            h += '<span style="font-size:0.8rem;font-weight:700;color:' + sColor + ';">' + escapeHtml(sLabel) + '</span>';
            h += '<span style="font-size:0.75rem;font-weight:700;color:var(--dgreen);">' + fmtIndustryMoney(sd.volume) + ' · ' + sd.routes + ' route' + (sd.routes !== 1 ? 's' : '') + '</span>';
            h += '</div>';
            h += '<div style="height:4px;background:rgba(255,255,255,0.04);border-radius:2px;overflow:hidden;"><div style="height:100%;width:' + sBarW + '%;background:' + sColor + ';border-radius:2px;opacity:0.7;"></div></div>';
            h += '</div>';
        }
    }

    // Top trade partners
    h += secHeader('Top Trade Partners', freightColor);
    if (topPartners.length === 0) {
        h += '<div style="color:var(--dtext-3);font-size:0.7rem;padding:8px 0;font-style:italic;">No trade partners via shipping.</div>';
    } else {
        var maxPartnerVol = topPartners.length > 0 ? topPartners[0][1].volume : 1;
        for (var pi = 0; pi < topPartners.length; pi++) {
            var pName = topPartners[pi][0];
            var pData = topPartners[pi][1];
            var pBarW = maxPartnerVol > 0 ? Math.max(2, (pData.volume / maxPartnerVol) * 100) : 0;
            h += '<div style="padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);">';
            h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">';
            h += '<span style="font-size:0.8rem;font-weight:700;color:var(--dtext-1);">' + escapeHtml(pName) + '</span>';
            h += '<span style="font-size:0.7rem;color:var(--dtext-3);">' + pData.routes + ' route' + (pData.routes !== 1 ? 's' : '') + ' · ' + fmtIndustryMoney(pData.volume) + '</span>';
            h += '</div>';
            h += '<div style="height:4px;background:rgba(255,255,255,0.04);border-radius:2px;overflow:hidden;"><div style="height:100%;width:' + pBarW + '%;background:' + freightColor + ';border-radius:2px;opacity:0.7;"></div></div>';
            h += '</div>';
        }
    }

    h += '</div>';

    h += '</div>'; // close grid
    h += '</div></div>'; // close econ-overview + econ-tab-body
    return h;
}

// ==================== RATING ====================

</script>
</body>
</html>
