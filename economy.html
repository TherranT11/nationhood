var expenditureData = null;
var expenditureDetails = null;

var aidData = null;  // { received: number, given: number, agreements: [...] }
var currentNation = null;
var allNations = null;
var activeTab = 'overview';
var tradeAgreements = null;

function getCappedTariffRevenue(_nation) {

var currentFaction = null;
var taxConnections = [];
// Tax Admin funding compliance bonus used to read from a tax_admin
// institution's allocation. Institutions are removed; default to 100%
// (no bonus, no penalty) until the rework lands.
var taxAdminFunding = { allocated: 0, needed: 0, fundingPct: 100 };

var originalRates = {};   // legacy tax-key map; tax columns removed in 19-col schema

// ==================== INIT ====================
initPage('economy', async function(state) {
    var nation = state.nation;

    if (!nation) {
        document.getElementById('content-area').innerHTML =
            '<div class="placeholder-panel">' +
            '<div class="ph-icon">📈</div>' +
            '<h3>No Nation Selected</h3>' +
            '<p>Your party is not assigned to a nation yet.</p>' +
            '</div>';
        return;
    }

    currentNation = nation;
    currentFaction = state.faction;
    await loadPreviousTickData(nation.id);
    var results = await Promise.allSettled([
        loadExpenditureData(nation.id, nation),
        loadAllNationsData(),
        loadTradeAgreements(nation.id),
        loadAidData(nation.id),
        loadTaxConnections(),
        loadTaxPendingBills(nation.id),
        fetchActiveCoalition(_supabase, nation.id).then(function(c) { activeCoalition = c; })
    ]);
    var failures = results.filter(function(r) { return r.status === 'rejected'; });
    if (failures.length > 0) {
        console.error('Economy data load failures:', failures.map(function(f) { return f.reason; }));
    }
    renderEconomyPage(nation);
});

// ==================== PREVIOUS TICK DATA ====================
async function loadPreviousTickData(nationId) {
    // Load current tick first so the cache key is correct
    var res = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    if (!res.data) return;
    currentTick = res.data.current_tick;

    var cacheKey = 'prev_tick_econ_' + nationId + '_t' + currentTick;
    var cached = qCache(cacheKey);
    if (cached) { previousTickData = cached; return; }

    var previousTick = currentTick - 1;
    if (previousTick < 0) return;

    var histRes = await _supabase.from('nations_history')
        .select('*').eq('nation_id', nationId).eq('tick', previousTick).limit(1);

    if (histRes.data && histRes.data.length > 0) {
        previousTickData = histRes.data[0];
        qCacheSet(cacheKey, previousTickData, 5 * 60 * 1000);
        return;
    }

    var fbRes = await _supabase.from('nations_history')
        .select('*').eq('nation_id', nationId).lt('tick', currentTick)
        .order('tick', { ascending: false }).limit(1);

    if (fbRes.data && fbRes.data.length > 0) {
        previousTickData = fbRes.data[0];
        qCacheSet(cacheKey, previousTickData, 5 * 60 * 1000);
    }
}

// ==================== PREVIOUS YEAR DATA ====================
async function loadExpenditureData(nationId, nation) {
    // No caching — always compute fresh from config + allocations
    // (admin config changes need to reflect immediately)

    var totals = {};
    var details = {};

    // Phase 5.2: embed the active option so fiscal_category / costs come
    // from the option that's actually active for this nation. Phase 2.5
    // onward stops writing those columns on the policies row.
    var res = await _supabase.from('active_laws')
        .select('passed_tick, is_reversal, policies(policy_name, fiscal_category, policy_type), selected_option:policy_options!selected_option_id(option_name, fiscal_category, upfront_cost, upfront_scaling_stat, ongoing_base_cost, ongoing_scaling_stat)')
        .eq('nation_id', nationId)
        .eq('is_reversal', false);

    var yearStartTick = Math.floor(currentTick / GAME_CONFIG.TICKS_PER_YEAR) * GAME_CONFIG.TICKS_PER_YEAR;
    var inflationMult = getInflationMultiplier(undefined);

    for (var i = 0; i < (res.data || []).length; i++) {
        var law = res.data[i];
        if (law.is_reversal) continue;
        var policy = law.policies;
        if (!policy) continue;
        if (policy.policy_type === 'lever') continue; // Levers have no ongoing cost

        var opt = law.selected_option || null;
        var cat = (opt && opt.fiscal_category) || policy.fiscal_category;
        if (!cat) continue;
        if (!totals[cat]) totals[cat] = 0;
        if (!details[cat]) details[cat] = [];

        var policyCost = 0;

        // Cost + scaling stat live on policy_options only (the policies-table
        // cost columns were dropped — selecting them errors the whole fetch).
        var ongoingBase = (opt && opt.ongoing_base_cost) || 0;
        var ongoingScaling = opt && opt.ongoing_scaling_stat;
        if (ongoingBase > 0) {
            var ongoingScaled = scalePolicyOngoingCost(ongoingBase, ongoingScaling, nation);
            policyCost += ongoingScaled * GAME_CONFIG.TICKS_PER_YEAR * 1000000;
        }

        if (law.passed_tick >= yearStartTick) {
            var upfront = (opt && opt.upfront_cost) || 0;
            var upfrontScaling = opt && opt.upfront_scaling_stat;
            if (upfront > 0) {
                var upfrontScaled = scalePolicyOngoingCost(upfront, upfrontScaling, nation);
                policyCost += upfrontScaled * 1000000;
            }
        }

        policyCost *= inflationMult;
        totals[cat] += policyCost;
        if (policyCost > 0) {
            // Surface the option name in the budget row so the player can
            // see which option of a multi-option policy is being charged.
            var displayName = (opt && opt.option_name)
                ? (policy.policy_name + ' — ' + opt.option_name)
                : policy.policy_name;
            details[cat].push({ name: displayName, cost: policyCost, type: 'policy' });
        }
    }

    // Institution costs used to be summed here; institutions are removed
    // pending the funding rework. Per-ministry funding percentages no
    // longer have a meaningful source until the rework lands.
    ministryFundingPcts = {};

    expenditureData = totals;
    expenditureDetails = details;
}

// ==================== TRADE DATA ====================

// ==================== ALL NATIONS DATA (NEW) ====================
async function loadAllNationsData() {
    var cacheKey = 'all_nations_econ_t' + currentTick;
    var cached = qCache(cacheKey);
    if (cached) { allNations = cached; return; }

    var res = await _supabase.from('nations')
        .select('id, name, gdp, population, gdp_growth, immigration, standard_of_living, cost_of_living, debt, budget, unrest, public_approval, crown_authority, energy, health, education, power, infrastructure, industry, farmland, service_sector, workforce');

    if (res.data) {
        allNations = res.data;
        qCacheSet(cacheKey, allNations, 5 * 60 * 1000);
    } else {
        allNations = [];
    }
}

async function loadTradeAgreements(nationId) {
    try {
        var { data } = await _supabase.from('trade_agreements')
            .select('*')
            .eq('status', 'active')
            .or('nation_a_id.eq.' + nationId + ',nation_b_id.eq.' + nationId)
            .order('enacted_at_tick', { ascending: false });
        tradeAgreements = data || [];
    } catch (e) {
        tradeAgreements = [];
    }
}

// ==================== ECONOMIC AID DATA ====================
async function loadAidData(nationId) {
    try {
        var { data: aidStates } = await _supabase.from('aid_agreement_state')
            .select('*, trade_agreements!inner(status, agreement_type, articles, agreement_name, nation_a_id, nation_b_id)')
            .or('donor_nation_id.eq.' + nationId + ',recipient_nation_id.eq.' + nationId)
            .eq('trade_agreements.status', 'active')
            .eq('trade_agreements.agreement_type', 'economic_aid')
            .eq('is_suspended', false);

        var received = 0;
        var given = 0;
        var agreements = [];

        for (var i = 0; i < (aidStates || []).length; i++) {
            var state = aidStates[i];
            var amount = Number(state.current_annual_amount || 0);
            if (state.recipient_nation_id === nationId) received += amount;
            if (state.donor_nation_id === nationId) given += amount;
            agreements.push(state);
        }

        aidData = { received: received, given: given, agreements: agreements };
    } catch (e) {
        console.warn('[loadAidData] Error:', e);
        aidData = { received: 0, given: 0, agreements: [] };
    }
}

// ==================== TAB INFRASTRUCTURE ====================
function renderEconomyPage(nation) {
    var h = '';
    h += '<div class="econ-title-bar">';
    h += '<div class="econ-title">ECONOMY OF ' + escapeHtml(nation.name).toUpperCase() + '</div>';
    h += '</div>';
    h += renderTabBar();
    h += '<div id="econ-tab-content">';
    h += renderTabContent(nation);
    h += '</div>';
    document.getElementById('content-area').innerHTML = h;
    wireTabEvents(nation);
}

function renderTabBar() {
    var tabs = [
        { key: 'overview', label: 'Overview' },
        { key: 'budget', label: 'Budget' },
        { key: 'taxation', label: 'Taxation' }
    ];
    var h = '<div class="econ-tab-bar">';
    for (var i = 0; i < tabs.length; i++) {
        var cls = tabs[i].key === activeTab ? ' active' : '';
        h += '<button class="econ-tab' + cls + '" data-tab="' + tabs[i].key + '">' + tabs[i].label + '</button>';
    }
    h += '</div>';
    return h;
}

function renderTabContent(nation) {
    switch (activeTab) {
        case 'overview': return renderOverviewTab(nation);
        case 'budget': return renderBudgetTab(nation);
        case 'taxation': return renderTaxationTab(nation);
        default: return '';
    }
}

function wireTabEvents(nation) {
    document.querySelectorAll('.econ-tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
            activeTab = tab.getAttribute('data-tab');
            renderEconomyPage(nation);
        });
    });
    if (activeTab === 'taxation') {
        wireTaxSliders(nation);
    }
    if (activeTab === 'budget') {
        document.querySelectorAll('.ministry-tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                selectMinistryCategory(tab.getAttribute('data-category'));
            });
        });
    }
}


function wireTaxSliders(nation) {
    document.querySelectorAll('.tax-rate-slider').forEach(function(slider) {
        slider.addEventListener('input', function() {
            var key = slider.getAttribute('data-tax-key');
            var newRate = parseInt(slider.value, 10);
            var origRate = originalRates[key];

            // Update rate change tracking
            if (newRate === origRate) {
                delete taxRateChanges[key];
            } else {
                taxRateChanges[key] = newRate;
            }

            // Re-render the full tab to keep everything in sync
            var contentEl = document.getElementById('econ-tab-content');
            if (contentEl) {
                contentEl.innerHTML = renderTaxationTab(nation);
                wireTaxSliders(nation);
            }
        });
    });
    document.querySelectorAll('.tax-reset-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var key = btn.getAttribute('data-tax-key');
            delete taxRateChanges[key];
            var contentEl = document.getElementById('econ-tab-content');
            if (contentEl) {
                contentEl.innerHTML = renderTaxationTab(nation);
                wireTaxSliders(nation);
            }
        });
    });
    var submitBtn = document.getElementById('tax-submit-btn');
    if (submitBtn && !submitBtn.disabled) {
        submitBtn.addEventListener('click', function() { submitTaxBill(nation); });
    }
}

async function submitTaxBill(nation) {
    var changedKeys = Object.keys(taxRateChanges).filter(function(k) { return taxRateChanges[k] !== originalRates[k]; });
    if (changedKeys.length === 0) return;

    var termBill = 'bill';

    // Build confirmation summary
    var summaryLines = [];
    for (var i = 0; i < changedKeys.length; i++) {
        var key = changedKeys[i];
        var cfg = TAX_CONFIG.find(function(t) { return t.key === key; });
        if (!cfg) continue;
        var oldRate = originalRates[key];
        var newRate = taxRateChanges[key];
        var direction = newRate > oldRate ? 'increase' : 'decrease';
        var compute = key === 'income_tax' ? computeIncomeTaxRevenue : computeCorporateTaxRevenue;
        var delta = compute(nation, newRate) - compute(nation, oldRate);
        var rateDiff = newRate - oldRate;
        // All tax types: increases hurt approval, cuts boost it
        var approvalImpact = rateDiff > 0 ? rateDiff * -2 : Math.abs(rateDiff) * 1;
        var impactLine = '  Government approval: ' + (approvalImpact >= 0 ? '+' : '') + approvalImpact + ' (decays over time)';
        summaryLines.push(
            cfg.name + ': ' + oldRate + ' → ' + newRate + ' (' + direction + ')\n' +
            '  Revenue/tick: ' + (delta >= 0 ? '+' : '') + formatBudgetCurrency(delta) + '\n' +
            impactLine
        );
    }
    var confirmMsg = 'Submit Tax Reform Bill?\n\n' + summaryLines.join('\n\n');
    if (!confirm(confirmMsg)) return;

    try {
        // Get current tick
        var { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        var tick = shard ? shard.current_tick : 0;

        // Generate bill name
        var billName = changedKeys.length === 1
            ? TAX_CONFIG.find(function(t) { return t.key === changedKeys[0]; }).name + ' Reform Act'
            : 'Tax Reform Act';

        // Build preamble
        var preamble = 'This ' + termBill + ', put forth by the ' + currentFaction.faction_name +
            ', proposes changes to the tax rates of ' + escapeHtml(nation.name) + '.';

        // Insert bill
        var taxChangeSummary = changedKeys.map(function(key) {
            return {
                tax_key: key,
                old_rate: originalRates[key],
                new_rate: taxRateChanges[key]
            };
        });
        var { data: bill, error: billError } = await _supabase.from('bills').insert({
            nation_id: nation.id,
            proposed_by: currentFaction.id,
            proposed_tick: tick,
            bill_name: billName,
            bill_type: 'tax_reform',
            status: 'committee',
            proposer_name: currentFaction.faction_name,
            proposer_color: currentFaction.party_color,
            preamble: preamble,
            metadata: {
                tax_changes: taxChangeSummary,
                proposer: {
                    faction_id: currentFaction.id,
                    faction_name: currentFaction.faction_name
                },
                context: {
                    tick: tick,
                    nation_id: nation.id
                }
            }
        }).select().single();
        if (billError) throw billError;

        // Insert text articles for each tax change
        var articles = [];
        for (var j = 0; j < changedKeys.length; j++) {
            var artKey = changedKeys[j];
            var artCfg = TAX_CONFIG.find(function(t) { return t.key === artKey; });
            if (!artCfg) continue;
            var artOld = originalRates[artKey];
            var artNew = taxRateChanges[artKey];
            var artComputeFn = artKey === 'income_tax' ? computeIncomeTaxRevenue : computeCorporateTaxRevenue;
            var artDelta = artComputeFn(nation, artNew) - artComputeFn(nation, artOld);
            var artRateDiff = artNew - artOld;
            var artApprovalText;
            var artApproval = artRateDiff > 0 ? artRateDiff * -2 : Math.abs(artRateDiff) * 1;
            artApprovalText = (artApproval >= 0 ? '+' : '') + artApproval + ' government approval (decays over time)';

            articles.push({
                bill_id: bill.id,
                policy_id: null,
                article_number: j + 1,
                added_by: currentFaction.id,
                article_title: artCfg.name + ' Rate Change',
                article_text: 'Proposing to change ' + artCfg.name + ' from ' + artOld +
                    ' to ' + artNew + '. This would ' + (artDelta >= 0 ? 'generate' : 'cost') +
                    ' ' + formatBudgetCurrency(Math.abs(artDelta)) + ' per tick in revenue.\n\n' +
                    'Estimated impact: ' + artApprovalText,
                effect_data: {
                    type: 'TAX_RATE_CHANGE',
                    tax_key: artKey,
                    old_rate: artOld,
                    new_rate: artNew
                }
            });
        }
        if (articles.length > 0) {
            var { error: articleError } = await _supabase.from('bill_articles').insert(articles);
            if (articleError) {
                // Articles failed — delete the orphaned bill and propagate the error
                await _supabase.from('bills').delete().eq('id', bill.id);
                throw new Error('Failed to save tax articles: ' + articleError.message);
            }
        }

        // Auto-add sponsor support
        var mySeats = currentFaction.seats || 0;
        var { error: supportError } = await _supabase.from('bill_support').insert({
            bill_id: bill.id, faction_id: currentFaction.id,
            stance: 'accept', seat_count: mySeats
        });
        if (supportError) {
            console.error('Failed to add sponsor support:', supportError.message);
        }

        // Reset state and navigate to the bill
        taxRateChanges = {};
        originalRates = {};
        window.location.href = 'bill.html?id=' + bill.id;
    } catch (e) {
        console.error('Error submitting tax bill:', e);
        alert('Error submitting tax ' + termBill + ': ' + (e.message || e));
    }
}

// ==================== OVERVIEW TAB ====================
function computeBudgetSummary(nation) {
    var budget = calculateNationalBudget(nation);
    var cappedTariff = getCappedTariffRevenue(nation);
    if (cappedTariff > 0) {
        applyTradeTariffOverride(budget, cappedTariff, Number(nation.gdp ?? nation.GDP ?? 0));
    }
    var aidReceived = aidData ? Number(aidData.received || 0) : 0;
    var aidGivenAmt = aidData ? Number(aidData.given || 0) : 0;
    budget.grossRevenue += aidReceived;
    var totalExp = 0;
    if (expenditureData) {
        for (var k in expenditureData) totalExp += expenditureData[k] || 0;
    }
    totalExp += budget.debtService || 0;
    totalExp += aidGivenAmt;
    return { budget: budget, totalExpenditure: totalExp, balance: budget.grossRevenue - totalExp };
}

function formatUnemploymentPct(stat) {
    return (0.7 + (stat - 1) * 34.3 / 99).toFixed(1) + '%';
}

function renderOverviewTab(nation) {
    var bs = computeBudgetSummary(nation);
    var debt = Number(nation.debt) || 0;

    var h = '<div class="econ-overview">';

    // Sovereign debt distress banner
    var _distressInfo = getDebtDistressLevel(nation);
    if (_distressInfo.level === 'critical') {
        h += '<div class="debt-distress-banner debt-distress-critical">';
        h += '<div class="distress-banner-icon">⚠</div>';
        h += '<div class="distress-banner-content">';
        h += '<div class="distress-banner-title">SOVEREIGN DEBT CRISIS WARNING</div>';
        h += '<div class="distress-banner-text">Debt has reached ' + formatDebtToGDP(getDebtToGDP(nation)) + ' of budget. ';
        if (_distressInfo.locked) h += 'Borrowing is locked out. ';
        if (_distressInfo.burden > 0) h += 'Government spending effectiveness reduced by ' + (_distressInfo.burden * 100).toFixed(0) + '%. ';
        h += 'Consider a <a href="laws.html" style="color:#d48a3c;text-decoration:underline;">Default Resolution</a> to restructure debt.</div>';
        h += '</div></div>';
    } else if (_distressInfo.level === 'distressed') {
        h += '<div class="debt-distress-banner debt-distress-warning">';
        h += '<div class="distress-banner-icon">📉</div>';
        h += '<div class="distress-banner-content">';
        h += '<div class="distress-banner-title">DEBT DISTRESS</div>';
        h += '<div class="distress-banner-text">Debt-to-Budget ratio at ' + formatDebtToGDP(getDebtToGDP(nation)) + '. Government spending effectiveness is impaired.</div>';
        h += '</div></div>';
    }

    // --- Fiscal Snapshot ---
    h += '<div class="econ-section">';
    h += '<div class="econ-section-header">FISCAL SNAPSHOT</div>';
    h += '<div class="econ-cards-row">';
    h += renderOverviewCard('Revenue', formatDualPeriod(bs.budget.grossRevenue), 'neutral', null);
    h += renderOverviewCard('Expenditures', formatDualPeriod(bs.totalExpenditure), 'neutral', null);
    var balClass = bs.balance >= 0 ? 'surplus' : 'deficit';
    var balSign = bs.balance >= 0 ? '+' : '';
    var balLabel = bs.balance >= 0 ? 'Surplus' : 'Deficit';
    h += renderOverviewCard(balLabel, formatDualPeriod(bs.balance, balSign), balClass, null);
    h += '</div>';
    h += '</div>';


    // Debt
    h += '<div class="econ-section">';
    h += '<div class="econ-section-header">NATIONAL DEBT</div>';
    var debtToRev = bs.budget.grossRevenue > 0 ? (debt / bs.budget.grossRevenue) : 0;
    var distress = getDebtDistressLevel(nation);
    var debtToGdpRatio = getDebtToGDP(nation);
    var burden = calculateDebtServiceBurden(nation);
    var isLocked = Boolean(nation.credit_locked_out);
    var dRating, dCls;
    if (distress.level === 'healthy') { dRating = 'HEALTHY'; dCls = 'excellent'; }
    else if (distress.level === 'elevated') { dRating = 'ELEVATED'; dCls = 'moderate'; }
    else if (distress.level === 'distressed') { dRating = 'DISTRESSED'; dCls = 'poor'; }
    else { dRating = 'CRITICAL'; dCls = 'critical'; }
    h += '<div class="econ-debt-card">';
    h += '<div class="econ-debt-amount">' + formatBudgetCurrency(debt) + '</div>';
    h += '<div class="econ-debt-metrics">';
    h += '<div class="econ-debt-metric"><span class="debt-metric-label">Debt-to-Budget</span><span class="debt-metric-value" style="color:' + distress.color + ';">' + formatDebtToGDP(debtToGdpRatio) + '</span></div>';
    h += '<div class="econ-debt-metric"><span class="debt-metric-label">Debt-to-Revenue</span><span class="debt-metric-value">' + (debtToRev * 100).toFixed(0) + '%</span></div>';
    h += '</div>';
    h += '<div class="econ-debt-rating rating-' + dCls + '">' + dRating + '</div>';
    if (burden > 0) {
        h += '<div class="debt-burden-bar">';
        h += '<div class="debt-burden-label">Debt Service Burden: <strong>' + (burden * 100).toFixed(1) + '%</strong> spending reduction</div>';
        h += '<div class="debt-burden-track"><div class="debt-burden-fill" style="width:' + Math.min(100, (burden / SOVEREIGN_DEFAULT_CONFIG.BURDEN_MAX) * 100) + '%;background:' + (burden >= 0.3 ? '#d9534f' : burden >= 0.15 ? '#d48a3c' : '#ffcc00') + ';"></div></div>';
        h += '</div>';
    }
    if (isLocked) {
        h += '<div class="credit-lockout-warning">';
        h += '<span class="lockout-icon">🔒</span>';
        h += '<span>BORROWING LOCKED OUT — Nation cannot borrow.</span>';
        h += '</div>';
    }
    h += '</div>';
    h += '</div>';


    // --- Macro Indicators ---
    h += '<div class="econ-section">';
    h += '<div class="econ-section-header">MACRO INDICATORS</div>';
    h += '<div class="econ-cards-row econ-cards-4">';

    var gdpGrowth = Number(nation.gdp_growth) || 50;
    var growthPct = (gdpGrowth - 50) / 50;
    var growthDisplay = (growthPct >= 0 ? '+' : '') + growthPct.toFixed(2) + '%';
    var gdpGrowthSub = getTrendArrow('gdp_growth', gdpGrowth, false);
    var yearlyPct = (Math.pow(1 + growthPct / 100, 12) - 1) * 100;
    var yearlyDisplay = (yearlyPct >= 0 ? '+' : '') + yearlyPct.toFixed(2) + '%';
    gdpGrowthSub += '<br><span style="font-size:11px;opacity:0.85">Predicted Yearly Growth: ' + yearlyDisplay + '</span>';
    h += renderOverviewCard('GDP Growth', growthDisplay, growthPct >= 0 ? 'surplus' : 'deficit', gdpGrowthSub);

    var unskilled = Number(nation.unskilled_workers) || 0;
    var skilled   = Number(nation.skilled_workers)   || 0;
    h += renderOverviewCard('Unskilled Workers', Math.round(unskilled), unskilled >= 70 ? 'surplus' : unskilled >= 40 ? 'neutral' : 'deficit', getTrendArrow('unskilled_workers', unskilled, false));
    h += renderOverviewCard('Skilled Workers',   Math.round(skilled),   skilled   >= 70 ? 'surplus' : skilled   >= 40 ? 'neutral' : 'deficit', getTrendArrow('skilled_workers',   skilled,   false));

    var sol = Number(nation.standard_of_living) || 50;
    h += renderOverviewCard('Std of Living', Math.round(sol), sol >= 70 ? 'surplus' : sol >= 40 ? 'neutral' : 'deficit', getTrendArrow('standard_of_living', sol, false));

    var col = Number(nation.cost_of_living) || 50;
    h += renderOverviewCard('Cost of Living', Math.round(col), col <= 30 ? 'surplus' : col <= 60 ? 'neutral' : 'deficit', getTrendArrow('cost_of_living', col, true));

    h += '</div>';
    h += '</div>';

    // --- Rankings ---
    h += renderRankings(nation);


    h += '</div>'; // .econ-overview
    return h;
}

function renderOverviewCard(label, value, colorClass, subHtml) {
    var h = '<div class="econ-card econ-card-' + colorClass + '">';
    h += '<div class="econ-card-label">' + escapeHtml(label) + '</div>';
    h += '<div class="econ-card-value">' + value + '</div>';
    if (subHtml) h += '<div class="econ-card-sub">' + subHtml + '</div>';
    h += '</div>';
    return h;
}

function renderRankings(nation) {
    if (!allNations || allNations.length === 0) return '';

    // budget + debt are abstract integers (migrations 20261206/20261207);
    // formatBudgetCurrency renders them as bare integers with thousands
    // separators, identical handling for both.
    var metrics = [
        { key: 'budget', label: 'Budget', higher: true, fmt: formatBudgetCurrency },
        { key: 'gdp_growth', label: 'GDP Growth', higher: true, fmt: function(v) { var p = ((v - 50) / 50) * 1; return (p >= 0 ? '+' : '') + p.toFixed(2) + '%'; } },
        { key: 'standard_of_living', label: 'Std of Living', higher: true, fmt: function(v) { return Math.round(v); } },
        { key: 'unskilled_workers', label: 'Unskilled Workers', higher: true, fmt: function(v) { return Math.round(v); } },
        { key: 'skilled_workers', label: 'Skilled Workers', higher: true, fmt: function(v) { return Math.round(v); } },
        { key: 'wages', label: 'Wages', higher: true, fmt: function(v) { return Math.round(v); } },
        { key: 'debt', label: 'National Debt', higher: false, fmt: formatBudgetCurrency }
    ];

    var h = '<div class="econ-section">';
    h += '<div class="econ-section-header">ECONOMIC RANKINGS</div>';
    h += '<div class="econ-ranking-table">';

    // Header row
    h += '<div class="econ-ranking-row econ-ranking-header">';
    h += '<div class="econ-ranking-cell econ-ranking-metric">Metric</div>';
    for (var r = 0; r < allNations.length; r++) {
        h += '<div class="econ-ranking-cell">#' + (r + 1) + '</div>';
    }
    h += '</div>';

    for (var m = 0; m < metrics.length; m++) {
        var metric = metrics[m];
        var sorted = allNations.slice().sort(function(a, b) {
            var va = Number(a[metric.key]) || 0;
            var vb = Number(b[metric.key]) || 0;
            return metric.higher ? (vb - va) : (va - vb);
        });

        h += '<div class="econ-ranking-row">';
        h += '<div class="econ-ranking-cell econ-ranking-metric">' + escapeHtml(metric.label) + '</div>';
        for (var s = 0; s < sorted.length; s++) {
            var isYou = sorted[s].id === nation.id;
            var cls = isYou ? ' econ-ranking-highlight' : '';
            h += '<div class="econ-ranking-cell' + cls + '">';
            var nColor = NATION_COLORS[sorted[s].name] || '';
            h += '<div class="econ-ranking-name"' + (nColor ? ' style="color:' + nColor + '"' : '') + '>' + escapeHtml(sorted[s].name) + '</div>';
            h += '<div class="econ-ranking-val">' + metric.fmt(Number(sorted[s][metric.key]) || 0) + '</div>';
            h += '</div>';
        }
        h += '</div>';
    }

    h += '</div>';
    h += '</div>';
    return h;
}



// ==================== TAXATION TAB ====================

async function loadTaxConnections() {
    var cacheKey = 'tax_connections';
    var cached = qCache(cacheKey);
    if (cached) { taxConnections = cached; return; }
    var { data } = await _supabase.from('stat_connections')
        .select('source_stat, source_dir, threshold, target_stat, target_dir, magnitude, dampening')
        .eq('enabled', true)
        .in('source_stat', ['income_tax', 'corporate_tax']);
    taxConnections = data || [];
    qCacheSet(cacheKey, taxConnections, 5 * 60 * 1000);
}


async function loadTaxPendingBills(nationId) {
    var cacheKey = 'tax_pending_bills_' + nationId;
    var cached = qCache(cacheKey);
    if (cached) { taxPendingBills = cached; return; }
    var { data } = await _supabase.from('bills')
        .select('id, bill_name, bill_type, status, proposed_by, metadata, bill_articles(article_title, article_text, effect_data)')
        .eq('nation_id', nationId)
        .eq('bill_type', 'tax_reform')
        .in('status', ['committee', 'floor', 'president_desk']);
    taxPendingBills = data || [];
    qCacheSet(cacheKey, taxPendingBills, 2 * 60 * 1000);
}

function getTaxEffects(taxKey) {
    return taxConnections.filter(function(c) { return c.source_stat === taxKey; });
}


function getSliderColorClass(rate, maxRate) {
    var pct = rate / maxRate;
    if (pct <= 0.25) return 'low';
    if (pct <= 0.50) return 'mid';
    if (pct <= 0.75) return 'high';
    return 'extreme';
}

function renderTaxationTab(nation) {
    var budget = calculateNationalBudget(nation);
    var cappedTariff = getCappedTariffRevenue(nation);
    if (cappedTariff > 0) {
        applyTradeTariffOverride(budget, cappedTariff, Number(nation.gdp ?? nation.GDP ?? 0));
    }

    var incomeTax = Math.round(Number(nation.income_tax || 0));
    var corpTax = Math.round(Number(nation.corporate_tax || 0));

    // Store original rates on first render (don't overwrite if already set)
    if (!originalRates._initialized) {
        originalRates = { income_tax: incomeTax, corporate_tax: corpTax, _initialized: true };
    }

    if (Math.round(Number(nation.income_tax || 0) * 10) % 10 !== 0 ||
        Math.round(Number(nation.corporate_tax || 0) * 10) % 10 !== 0) {
        console.warn('[Taxation] DB tax rates have fractional precision — slider uses integer rounding');
    }

    var avgRate = (incomeTax + corpTax) / 2;
    var totalTaxRevenue = budget.incomeRevenue + budget.corpRevenue;

    var h = '<div class="econ-tab-body">';

    // ── FISCAL SUMMARY BAR ──
    h += '<div class="tax-summary-bar">';
    h += '<div class="tax-summary-stat">';
    h += '<span class="tax-summary-label">Tax Revenue</span>';
    h += '<span class="tax-summary-value green">' + formatDualPeriod(totalTaxRevenue) + '</span>';
    h += '<span class="tax-summary-detail">' + (budget.grossRevenue > 0 ? Math.round(totalTaxRevenue / budget.grossRevenue * 100) : 0) + '% of total income</span>';
    h += '</div>';

    // Tax burden on the alpha 0-10 scale (avg of income + corporate rates).
    var taxBurden = avgRate.toFixed(1);
    var burdenLabel = avgRate < 3 ? 'Low (0–3)' : avgRate < 5 ? 'Moderate-Low (3–5)' : avgRate < 7 ? 'Moderate (5–7)' : avgRate < 8.5 ? 'High (7–8.5)' : 'Very High (8.5+)';
    var burdenClass = avgRate < 5 ? 'green' : avgRate < 7 ? 'yellow' : 'red';
    h += '<div class="tax-summary-stat">';
    h += '<span class="tax-summary-label">Tax Burden</span>';
    h += '<span class="tax-summary-value ' + burdenClass + '">' + taxBurden + '</span>';
    h += '<span class="tax-summary-detail">' + burdenLabel + '</span>';
    h += '</div>';

    // Compliance: base from efficiency/corruption, modified by Tax Admin funding
    var efficiency = Number(nation.efficiency || 50);
    var corruption = Number(nation.corruption || 50);
    var baseCompliance = (efficiency + (100 - corruption)) / 2;
    var fundingBonus = taxAdminFunding.fundingPct >= 100 ? 5 :
                       taxAdminFunding.fundingPct >= 75 ? 0 :
                       taxAdminFunding.fundingPct >= 50 ? -5 :
                       taxAdminFunding.fundingPct >= 25 ? -10 : -20;
    var compliance = Math.max(0, Math.min(100, Math.round(baseCompliance + fundingBonus)));
    var complianceDetail = '';
    if (taxAdminFunding.fundingPct < 50) {
        complianceDetail = '&darr; Tax Admin underfunded (' + taxAdminFunding.fundingPct + '%)';
    } else if (corruption > 30) {
        complianceDetail = '&darr; ' + Math.round(corruption / 10) + '% from corruption';
    } else {
        complianceDetail = 'Healthy collection';
    }
    h += '<div class="tax-summary-stat">';
    h += '<span class="tax-summary-label">Compliance</span>';
    h += '<span class="tax-summary-value">' + compliance + '%</span>';
    h += '<span class="tax-summary-detail">' + complianceDetail + '</span>';
    h += '</div>';

    h += '<div class="tax-summary-stat">';
    h += '<span class="tax-summary-label">Avg Effective Rate</span>';
    h += '<span class="tax-summary-value">' + avgRate.toFixed(1) + '%</span>';
    h += '<span class="tax-summary-detail">Across all taxes</span>';
    h += '</div>';

    var pendingCount = taxPendingBills.length;
    h += '<div class="tax-summary-stat">';
    h += '<span class="tax-summary-label">Pending Changes</span>';
    if (pendingCount > 0) {
        h += '<span class="tax-summary-value yellow">' + pendingCount + '</span>';
        h += '<span class="tax-summary-detail">In legislature</span>';
    } else {
        h += '<span class="tax-summary-value" style="color:var(--text-dim);">0</span>';
        h += '<span class="tax-summary-detail">None pending</span>';
    }
    h += '</div>';

    // Submit button — greyed out unless eligible AND ≥1 rate changed
    var changedKeys = Object.keys(taxRateChanges).filter(function(k) { return taxRateChanges[k] !== originalRates[k]; });
    var hasChanges = changedKeys.length > 0;
    var mySeats = currentFaction ? (currentFaction.seats || 0) : 0;
    var isInGovt = activeCoalition && currentFaction && (activeCoalition.party_ids || []).indexOf(currentFaction.id) !== -1;
    var hasAuthority = mySeats >= 1 || isInGovt;
    var canSubmit = hasAuthority && hasChanges;
    var btnDisabled = !canSubmit;
    var termBill = 'Bill';
    var btnTitle = !hasAuthority ? 'Your party holds no legislature seats' : !hasChanges ? 'Adjust at least one tax rate' : 'Submit tax reform ' + termBill.toLowerCase();

    h += '<div class="tax-summary-spacer"></div>';
    h += '<button class="tax-submit-btn" id="tax-submit-btn" ' + (btnDisabled ? 'disabled' : '') + ' title="' + escapeHtml(btnTitle) + '">';
    h += 'Submit Tax ' + termBill;
    h += '</button>';

    h += '</div>'; // .tax-summary-bar

    // ── PRESIDENTIAL INFO CALLOUT ──
    if (hasElectedPresident(nation)) {
        h += '<div class="tax-info-callout">';
        h += '<span class="tax-info-callout-icon">&#8505;</span>';
        h += '<span class="tax-info-callout-text">Tax reform bills passed by the legislature must be <strong>signed by the President</strong> before taking effect. The President may veto, triggering a &frac23; override vote.</span>';
        h += '</div>';
    }

    // ── TAX CARDS ──
    h += '<div class="tax-list">';
    for (var i = 0; i < TAX_CONFIG.length; i++) {
        h += renderTaxCard(TAX_CONFIG[i], nation, budget);
    }
    h += '</div>';

    h += '</div>'; // .econ-tab-body
    return h;
}

function renderTaxCard(config, nation, budget) {
    var origRate = originalRates[config.key] || Math.round(Number(nation[config.key] || 0));
    var currentRate = (taxRateChanges[config.key] !== undefined) ? taxRateChanges[config.key] : origRate;
    var isChanged = currentRate !== origRate;
    var revenue = budget[config.revenueKey] || 0;
    var effects = getTaxEffects(config.key);

    // Revenue projection (per-tick) using the live alpha formulas.
    var compute = config.key === 'income_tax' ? computeIncomeTaxRevenue : computeCorporateTaxRevenue;
    var projectedRevenue = compute(nation, currentRate);
    var revenueDelta = projectedRevenue - revenue;

    var fillPct = config.maxRate > 0 ? Math.round((currentRate / config.maxRate) * 100) : 0;
    var colorClass = getSliderColorClass(currentRate, config.maxRate);

    var h = '<div class="tax-card' + (isChanged ? ' tax-card-changed' : '') + '">';

    // ── TOP ROW ──
    h += '<div class="tax-top">';
    h += '<span class="tax-name">' + escapeHtml(config.name) + '</span>';
    h += '<span class="tax-category-pill ' + config.categoryClass + '">' + escapeHtml(config.category) + '</span>';
    h += '<div class="tax-spacer"></div>';

    h += '<div class="tax-revenue-block">';
    h += '<span class="tax-revenue-label">Revenue</span>';
    if (isChanged) {
        h += '<span class="tax-revenue-value">' + formatDualPeriod(projectedRevenue) + '</span>';
        var deltaClass = revenueDelta >= 0 ? 'tax-delta-positive' : 'tax-delta-negative';
        var deltaSign = revenueDelta >= 0 ? '+' : '';
        h += '<span class="tax-revenue-delta ' + deltaClass + '">' + formatDualPeriod(revenueDelta, deltaSign) + '</span>';
    } else {
        h += '<span class="tax-revenue-value">' + formatDualPeriod(revenue) + '</span>';
    }
    h += '</div>';
    h += '</div>';

    // ── SLIDER ROW ──
    h += '<div class="tax-slider-row">';
    h += '<div class="tax-rate-display" id="tax-rate-val-' + config.key + '">' + currentRate + '<span class="tax-pct">%</span></div>';
    h += '<div class="tax-slider-container">';
    h += '<div class="tax-slider-visual">';
    h += '<div class="tax-slider-track">';
    h += '<div class="tax-slider-fill ' + colorClass + '" id="tax-fill-' + config.key + '" style="width:' + fillPct + '%"></div>';
    h += '</div>';
    h += '<input type="range" class="tax-rate-slider" data-tax-key="' + config.key + '" min="0" max="' + config.maxRate + '" step="1" value="' + currentRate + '">';
    h += '</div>';
    h += '<div class="tax-slider-labels">';
    h += '<span class="tax-slider-min">0%</span>';
    h += '<span class="tax-slider-max">' + config.maxRate + '%</span>';
    h += '</div>';
    h += '</div>';
    if (isChanged) {
        h += '<button class="tax-reset-btn" data-tax-key="' + config.key + '">Reset</button>';
    }
    h += '</div>';

    // ── APPROVAL IMPACT PREVIEW ──
    if (isChanged) {
        var rateDiff = currentRate - origRate;
        if (config.key === 'corporate_tax') {
            // Corporate Tax: flat voter bloc effect on Business Owners
            var blocImpact = rateDiff > 0 ? -3 : 2;
            var blocLabel = blocImpact >= 0 ? 'VOTER BLOC APPROVAL INCREASE' : 'VOTER BLOC APPROVAL DECREASE';
            var blocClass = blocImpact >= 0 ? 'tax-approval-increase' : 'tax-approval-decrease';
            var blocSign = blocImpact >= 0 ? '+' : '';
            var blocExplain = rateDiff > 0 ? 'Raising corporate tax' : 'Lowering corporate tax';
            h += '<div class="tax-approval-impact ' + blocClass + '">';
            h += '<span class="tax-approval-badge">' + blocLabel + '</span> ';
            h += '<span class="tax-approval-value">' + blocSign + blocImpact + '%</span>';
            h += '<span class="tax-approval-explain">(' + blocExplain + ')</span>';
            h += '<span class="tax-approval-scope">Business Owners voter bloc (proposing party)</span>';
            h += '</div>';
        } else {
            var approvalImpact = rateDiff > 0 ? rateDiff * -2 : Math.abs(rateDiff) * 1;
            var impactLabel = approvalImpact >= 0 ? 'APPROVAL RATE INCREASE' : 'APPROVAL RATE DECREASE';
            var impactClass = approvalImpact >= 0 ? 'tax-approval-increase' : 'tax-approval-decrease';
            var impactSign = approvalImpact >= 0 ? '+' : '';
            var impactExplain = rateDiff > 0
                ? Math.abs(rateDiff) + '% increase &times; -2 per point'
                : Math.abs(rateDiff) + '% decrease &times; +1 per point';
            var scopeNote = 'Proposing party (all voter blocs)';
            h += '<div class="tax-approval-impact ' + impactClass + '">';
            h += '<span class="tax-approval-badge">' + impactLabel + '</span> ';
            h += '<span class="tax-approval-value">' + impactSign + approvalImpact + '%</span>';
            h += '<span class="tax-approval-explain">(' + impactExplain + ')</span>';
            h += '<span class="tax-approval-scope">' + scopeNote + '</span>';
            h += '</div>';
        }
    }

    // ── EFFECTS + HITS FOOTER ──
    h += '<div class="tax-bottom">';

    if (effects.length > 0) {
        h += '<div class="tax-effects-grid">';
        for (var i = 0; i < effects.length; i++) {
            var eff = effects[i];
            var arrowCls = eff.target_dir === 'up' ? 'up' : 'down';
            var arrowChar = eff.target_dir === 'up' ? '&#9650;' : '&#9660;';
            h += '<div class="tax-effect-item">';
            h += '<span class="tax-effect-arrow ' + arrowCls + '">' + arrowChar + '</span>';
            h += '<span class="tax-effect-stat">' + escapeHtml(formatStatName(eff.target_stat)) + '</span>';
            h += '</div>';
        }
        h += '</div>';
    } else {
        h += '<div class="tax-effects-empty">No stat effects configured</div>';
    }


    h += '</div>'; // .tax-bottom

    // ── PENDING BILL BANNER ──
    for (var p = 0; p < taxPendingBills.length; p++) {
        var pb = taxPendingBills[p];
        var matchesTax = false;
        var metadataChanges = pb.metadata && Array.isArray(pb.metadata.tax_changes)
            ? pb.metadata.tax_changes
            : [];
        for (var mt = 0; mt < metadataChanges.length; mt++) {
            var metaKey = metadataChanges[mt] ? (metadataChanges[mt].tax_key || metadataChanges[mt].key) : null;
            if (metaKey === config.key) {
                matchesTax = true;
                break;
            }
        }

        var billArticles = pb.bill_articles || [];
        if (!matchesTax) {
            for (var pa = 0; pa < billArticles.length; pa++) {
                var ed = billArticles[pa].effect_data || {};
                if (ed.tax_key === config.key) {
                    matchesTax = true; break;
                }
            }
        }
        if (matchesTax) {
            var statusLabel = pb.status === 'floor'
                ? 'Floor Vote'
                : (pb.status === 'president_desk' ? 'President Desk' : 'Committee');
            h += '<a href="bill.html?id=' + pb.id + '" class="tax-proposed-change">';
            h += '<span class="tax-proposed-icon">&#128203;</span>';
            h += '<span class="tax-proposed-text">Pending: <strong>' + escapeHtml(pb.bill_name) + '</strong></span>';
            h += '<span class="tax-proposed-status">' + statusLabel + '</span>';
            h += '</a>';
        }
    }

    h += '</div>'; // .tax-card
    return h;
}

// ==================== BUDGET TAB ====================

var MINISTRY_DESCRIPTIONS = {
    'Finance': 'Economic oversight',
    'Defense': 'Armed forces & security',
    'Healthcare': 'Public healthcare',
    'Education': 'Public schooling & universities',
    'Transportation': 'Roads, utilities, transit',
    'Interior': 'Civil administration',
    'Labor': 'Employment & welfare',
    'Energy': 'Power generation & regulation',
    'Justice': 'Courts & law enforcement',
    'Foreign Ministry': 'Diplomacy & foreign affairs',
    'Trade': 'Commerce & trade policy'
};

function renderBudgetTab(nation) {
    var budget = calculateNationalBudget(nation);

    // Apply tariff override using getCappedTariffRevenue (single source of truth)
    var cappedTariff = getCappedTariffRevenue(nation);
    if (cappedTariff > 0) {
        applyTradeTariffOverride(budget, cappedTariff, Number(nation.gdp ?? nation.GDP ?? 0));
    }

    var aidReceived = aidData ? Number(aidData.received || 0) : 0;
    var aidGiven = aidData ? Number(aidData.given || 0) : 0;
    budget.grossRevenue += aidReceived;

    var totalExpenditure = 0;
    var expByCat = {};
    if (expenditureData) {
        for (var k in expenditureData) {
            expByCat[k] = expenditureData[k] || 0;
            totalExpenditure += expenditureData[k] || 0;
        }
    }
    totalExpenditure += budget.debtService || 0;
    if (aidGiven > 0) totalExpenditure += aidGiven;

    var balance = budget.grossRevenue - totalExpenditure;
    var isDeficit = balance < 0;
    var balSign = balance >= 0 ? '+' : '';

    var h = '<div class="econ-tab-body">';

    // --- Summary bar: 3 cards ---
    h += '<div class="bv2-summary-bar">';
    h += '<div class="bv2-card">';
    h += '<div class="bv2-card-label" style="color:var(--green);">REVENUE</div>';
    h += '<div class="bv2-card-value">' + formatDualPeriod(budget.grossRevenue) + '</div>';
    h += '</div>';
    h += '<div class="bv2-card">';
    h += '<div class="bv2-card-label" style="color:var(--red);">EXPENDITURES</div>';
    h += '<div class="bv2-card-value">' + formatDualPeriod(totalExpenditure) + '</div>';
    h += '</div>';
    h += '<div class="bv2-card">';
    h += '<div class="bv2-card-label" style="color:' + (isDeficit ? 'var(--red)' : 'var(--green)') + ';">' + (isDeficit ? 'DEFICIT' : 'SURPLUS') + '</div>';
    h += '<div class="bv2-card-value" style="color:' + (isDeficit ? 'var(--red)' : 'var(--green)') + ';">' + formatDualPeriod(balance, balSign) + '</div>';
    h += '</div>';
    h += '</div>';

    // --- Split layout: budget left, ministry detail right ---
    h += '<div class="bv2-budget-split">';
    h += '<div class="bv2-budget-left">';

    // --- Two-column breakdown ---
    h += '<div class="bv2-breakdown">';

    // LEFT: Revenues
    h += '<div class="bv2-col">';
    h += '<div class="bv2-col-header">';
    h += '<span class="bv2-col-title" style="color:var(--green);">REVENUES</span>';
    h += '<span class="bv2-col-total" style="color:var(--green);">Total: ' + formatDualPeriod(budget.grossRevenue) + '</span>';
    h += '</div>';

    if (budget.grossRevenue > 0) {
        h += bv2RevenueRow('TAX REVENUE', 'Aggregate state taxation', Math.max(0, budget.grossRevenue - (aidReceived || 0)));
    }
    if (aidReceived > 0) {
        h += bv2RevenueRow('FOREIGN AID', 'Aid received from partners', aidReceived);
    }

    h += '<div class="bv2-total-row">';
    h += '<span class="bv2-total-label">TOTAL REVENUE</span>';
    h += '<span class="bv2-total-value">' + formatDualPeriod(budget.grossRevenue) + '</span>';
    h += '</div>';
    h += '</div>';

    // RIGHT: Expenditures
    h += '<div class="bv2-col">';
    h += '<div class="bv2-col-header">';
    h += '<span class="bv2-col-title" style="color:var(--red);">EXPENDITURES &mdash; MINISTRY COSTS</span>';
    h += '<span class="bv2-col-total" style="color:var(--red);">Total: ' + formatDualPeriod(totalExpenditure) + '</span>';
    h += '</div>';

    // Sort ministries by cost descending
    var sortedMins = [];
    for (var cat in expByCat) {
        if (expByCat[cat] > 0) {
            sortedMins.push({ name: cat, cost: expByCat[cat] });
        }
    }
    sortedMins.sort(function(a, b) { return b.cost - a.cost; });

    for (var i = 0; i < sortedMins.length; i++) {
        var m = sortedMins[i];
        var dispName = m.name === 'Foreign Ministry' ? 'MINISTRY OF FOREIGN AFFAIRS' : 'MINISTRY OF ' + m.name.toUpperCase();
        var desc = MINISTRY_DESCRIPTIONS[m.name] || '';
        var mFundPct = ministryFundingPcts[m.name] !== undefined ? ministryFundingPcts[m.name] : 100;
        h += bv2ExpenditureRow(dispName, desc, m.cost, mFundPct);
    }
    if (budget.debtService > 0) {
        h += bv2ExpenditureRow('INTEREST ON DEBT', 'Debt service payments', budget.debtService, null);
    }
    if (aidGiven > 0) {
        h += bv2ExpenditureRow('FOREIGN AID GIVEN', 'Aid commitments to partners', aidGiven, null);
    }

    h += '<div class="bv2-total-row">';
    h += '<span class="bv2-total-label">TOTAL EXPENDITURE</span>';
    h += '<span class="bv2-total-value">' + formatDualPeriod(totalExpenditure) + '</span>';
    h += '</div>';
    h += '</div>';

    h += '</div>'; // .bv2-breakdown

    // --- Net balance box ---
    var netColor = isDeficit ? 'var(--red)' : 'var(--green)';
    var netIcon = isDeficit ? '&#9660;' : '&#9650;'; // Down arrow for deficit, up for surplus
    var netLabel = isDeficit ? 'DEFICIT' : 'SURPLUS';
    h += '<div class="bv2-net-box" style="border-color:' + netColor + ';">';
    h += '<div class="bv2-net-header">';
    h += '<span class="bv2-net-icon" style="color:' + netColor + ';">' + netIcon + '</span>';
    h += '<span class="bv2-net-label" style="color:' + netColor + ';">' + netLabel + '</span>';
    h += '</div>';
    h += '<div class="bv2-net-amount" style="color:' + netColor + ';">' + formatDualPeriod(balance, balSign) + '</div>';
    if (isDeficit) {
        h += '<div class="bv2-net-subtext">SHORTFALL ATTRIBUTING TO NATIONAL DEBT THIS TICK</div>';
    }
    h += '<div class="bv2-net-breakdown">';
    h += '<div class="bv2-net-col"><div class="bv2-net-col-label">TOTAL REVENUE</div><div class="bv2-net-col-value">' + formatDualPeriod(budget.grossRevenue) + '</div></div>';
    h += '<div class="bv2-net-col"><div class="bv2-net-col-label">TOTAL EXPENDITURE</div><div class="bv2-net-col-value">' + formatDualPeriod(totalExpenditure) + '</div></div>';
    h += '<div class="bv2-net-col"><div class="bv2-net-col-label">NET</div><div class="bv2-net-col-value" style="color:' + netColor + ';">' + formatDualPeriod(balance, balSign) + '</div></div>';
    h += '</div>';
    h += '</div>';

    // --- Info notice ---
    if (isDeficit) {
        h += '<div class="bv2-info-bar">';
        h += '<span class="bv2-info-icon">i</span> ';
        h += 'The shortfall of <strong style="color:#d9534f;">' + formatBudgetCurrency(Math.abs(balance)) + '</strong> exceeds available revenue ';
        h += 'and is being added to the national debt each tick. ';
        h += 'Raise taxes, grow the economy, or reduce ministry funding to close the gap.';
        h += '</div>';
    }

    // --- Ministry Detail Panel (right column) ---
    h += '</div>'; // close .bv2-budget-left
    h += '<div class="bv2-budget-right">';
    h += renderMinistryPanel();
    h += '</div>';
    h += '</div>'; // close .bv2-budget-split

    h += '</div>'; // .econ-tab-body
    return h;
}

function bv2RevenueRow(label, subtitle, value) {
    var h = '<div class="bv2-row">';
    h += '<div class="bv2-row-left">';
    h += '<div class="bv2-row-label">' + escapeHtml(label) + '</div>';
    h += '<div class="bv2-row-subtitle">' + escapeHtml(subtitle) + '</div>';
    h += '</div>';
    h += '<div class="bv2-row-value">' + formatDualPeriod(value) + '</div>';
    h += '</div>';
    return h;
}

function bv2ExpenditureRow(label, subtitle, value, fundingPct) {
    var h = '<div class="bv2-row">';
    h += '<div class="bv2-row-left">';
    h += '<div class="bv2-row-label">' + escapeHtml(label) + '</div>';
    h += '<div class="bv2-row-subtitle">' + escapeHtml(subtitle) + '</div>';
    h += '</div>';
    h += '<div class="bv2-row-right">';
    if (fundingPct !== null) {
        h += '<span class="bv2-funding-badge">' + fundingPct + '%</span>';
    }
    h += '<span class="bv2-row-value">' + formatDualPeriod(value) + '</span>';
    h += '</div>';
    h += '</div>';
    return h;
}

    'Interior', 'Labor', 'Healthcare', 'Education',
    'Transportation', 'Energy', 'Justice', 'Foreign Ministry', 'Finance', 'Defense', 'Trade'
];

function renderMinistryPanel() {
    var h = '<div class="ministry-panel budget-panel">';

    h += '<div class="budget-header">';
    h += '<div class="budget-title">MINISTRY DETAIL</div>';
    h += '<div class="budget-subtitle">Expenditures by Ministry</div>';
    h += '</div>';

    h += '<div class="ministry-tabs">';
    for (var i = 0; i < MINISTRY_CATEGORIES.length; i++) {
        var cat = MINISTRY_CATEGORIES[i];
        var activeClass = i === 0 ? ' active' : '';
        h += '<button class="ministry-tab' + activeClass + '" data-category="' + escapeHtml(cat) + '">' + escapeHtml(cat) + '</button>';
    }
    h += '</div>';

    h += '<div id="ministry-policy-list">';
    h += renderMinistryPoliciesHtml(MINISTRY_CATEGORIES[0]);

function selectMinistryCategory(category) {
    document.querySelectorAll('.ministry-tab').forEach(function(t) { t.classList.remove('active'); });
    var target = document.querySelector('.ministry-tab[data-category="' + category + '"]');
    if (target) target.classList.add('active');
    renderMinistryPolicies(category);
}

function renderMinistryPolicies(category) {
    var el = document.getElementById('ministry-policy-list');
    if (el) el.innerHTML = renderMinistryPoliciesHtml(category);
}

function renderMinistryPoliciesHtml(category) {
    var items = (expenditureDetails && expenditureDetails[category]) ? expenditureDetails[category] : [];
    var h = '';

    if (items.length === 0) {
        h += '<div class="ministry-empty">No expenditures</div>';
        h += budgetTotalLine(0);
        return h;
    }

    var policies = items.filter(function(it) { return it.type !== 'institution'; });

    var total = 0;
    h += '<div class="ministry-policy-list">';

    if (policies.length > 0) {
        h += '<div class="ministry-section-label">Policies</div>';
        for (var k = 0; k < policies.length; k++) {
            total += policies[k].cost;
            h += budgetLineItem(policies[k].name, policies[k].cost, null, null);
        }
    }

    h += budgetTotalLine(total);
    h += '</div>';
    return h;
}

// ==================== BUDGET HELPERS ====================
// Budget, debt, revenue, and expenditure values are now stored on the
// unified abstract integer scale (migrations 20261206 + 20261207). No
// K/M/B/T suffixes — just the integer with thousands separator.
function formatBudgetCurrency(val) {
    if (val == null) return '$0';
    var v = Number(val);
    var sign = v < 0 ? '-' : '';
    return sign + '$' + Math.round(Math.abs(v)).toLocaleString('en-US');
}

/**
 * Dual-period display: shows annual value (large) with monthly beneath (small).
 * @param {number} annualValue - The yearly dollar amount.
 * @param {string} [prefix] - Optional prefix like '+' for positive signed values.
 */
function formatDualPeriod(annualValue, prefix) {
    prefix = prefix || '';
    var monthly = annualValue / 12;
    return '<span class="dual-period">' +
        '<span class="dual-period-yr">' + prefix + formatBudgetCurrency(annualValue) + '<span class="dual-period-label"> /yr</span></span>' +
        '<span class="dual-period-mo">' + prefix + formatBudgetCurrency(monthly) + '<span class="dual-period-label"> /mo</span></span>' +
        '</span>';
}


function budgetTrendHtml(current, previous, prevYear) {
    if (previous === null || previous === undefined) return '';
    if (previous === 0 && current === 0) return '';
    if (previous === 0) {
        return '<span class="budget-trend trend-up">&#9650; New</span>';
    }
    var pctChange = ((current - previous) / Math.abs(previous)) * 100;
    if (Math.abs(pctChange) < 0.1) {
        return '<span class="budget-trend trend-neutral">&mdash; 0.0% since Year ' + prevYear + '</span>';
    }
    if (pctChange > 0) {
        return '<span class="budget-trend trend-up">&#9650; ' + pctChange.toFixed(1) + '% since Year ' + prevYear + '</span>';
    }
    return '<span class="budget-trend trend-down">&#9660; ' + Math.abs(pctChange).toFixed(1) + '% since Year ' + prevYear + '</span>';
}

function budgetTotalLine(value) {
    var h = '<div class="budget-line-item budget-line-total">';
    h += '<div class="budget-line-top">';
    h += '<span class="budget-line-label">TOTAL</span>';
    h += '<span class="budget-line-value">' + formatBudgetCurrency(value) + '</span>';
    h += '</div>';
    h += '</div>';
    return h;
}


function budgetLineItem(label, value, prevValue, prevYear, annotation) {
    var h = '<div class="budget-line-item">';
    h += '<div class="budget-line-top">';
    h += '<span class="budget-line-label">' + escapeHtml(label) + '</span>';
    h += '<span class="budget-line-value">' + formatBudgetCurrency(value) + '</span>';
    h += '</div>';
    if (prevValue !== null && value > 0) {
        h += '<div class="budget-line-trend">' + budgetTrendHtml(value, prevValue, prevYear) + '</div>';
    }
    if (annotation) {
        h += '<div class="budget-line-trend"><span class="budget-trend trend-neutral">' + escapeHtml(annotation) + '</span></div>';
    }
    h += '</div>';
    return h;
}

// ==================== TREND ARROW ====================
function getTrendArrow(statKey, currentValue, inverted) {
    if (!previousTickData || currentValue === null || currentValue === undefined) {
        return '<span class="trend-neutral">&mdash;</span>';
    }

    var prevValue = previousTickData[statKey];
    if (prevValue === null || prevValue === undefined) {
        return '<span class="trend-neutral">&mdash;</span>';
    }

    var delta = Number(currentValue) - Number(prevValue);
    var invertedClass = inverted ? ' inverted' : '';

    if (delta > 0.05) {
        return '<span class="trend-up' + invertedClass + '">&#9650; +' + formatDelta(delta) + '</span>';
    } else if (delta < -0.05) {
        return '<span class="trend-down' + invertedClass + '">&#9660; ' + formatDelta(delta) + '</span>';
    }
    return '<span class="trend-neutral">&mdash;</span>';
}

function formatDelta(d) {
    var abs = Math.abs(d);
    if (abs >= 10) return Math.round(abs);
    return abs.toFixed(1);
}
