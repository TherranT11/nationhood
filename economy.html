        var isActive = isFood ? (activeSector === 'food_agriculture' || isFoodSubsector(activeSector)) : s.key === activeSector;
        var borderColor = score >= 70 ? '#5cb85c' : score >= 40 ? '#888' : '#d9534f';
        h += '<button class="sector-tab' + (isActive ? ' active' : '') + '" data-sector="' + s.key + '" style="' + (isActive ? 'border-bottom-color:' + borderColor : '') + '">';
        h += escapeHtml(s.label);
        h += '</button>';
    }
    h += '</div>';

    // Food sub-sector tabs (shown when Food & Agriculture is active)
    if (activeSector === 'food_agriculture' || isFoodSubsector(activeSector)) {
        h += '<div class="food-subsector-tabs">';
        for (var fi = 0; fi < FOOD_SUBSECTORS.length; fi++) {
            var fs = FOOD_SUBSECTORS[fi];
            var fsActive = fs.key === activeFoodSubsector;
            h += '<button class="food-subsector-tab' + (fsActive ? ' active' : '') + '" data-subsector="' + fs.key + '">';
            h += escapeHtml(fs.label);
            h += '</button>';
        }
        h += '</div>';
    }
    h += '</div>';

    // Sector detail
    h += '<div id="sector-detail">';
    if (activeSector === 'food_agriculture' || isFoodSubsector(activeSector)) {
        h += renderFoodSubsectorDetail(nation, activeFoodSubsector);
    } else {
        h += renderSectorDetail(nation, activeSector);
    }
    h += '</div>';

    h += '</div></div>';
    return h;
}

function selectSector(sectorKey, nation) {
    if (sectorKey === 'food_agriculture') {
        activeSector = 'food_agriculture';
        // Keep current food subsector or default to grains
        if (!isFoodSubsector(activeFoodSubsector)) activeFoodSubsector = 'grains_staples';
    } else if (isFoodSubsector(sectorKey)) {
        activeSector = 'food_agriculture';
        activeFoodSubsector = sectorKey;
    } else {
        activeSector = sectorKey;
    }

    // Update main tab active states
    document.querySelectorAll('.sector-tab').forEach(function(t) {
        t.classList.remove('active');
        t.style.borderBottomColor = 'transparent';
    });
    var mainKey = isFoodSubsector(sectorKey) ? 'food_agriculture' : sectorKey;
    var target = document.querySelector('.sector-tab[data-sector="' + mainKey + '"]');
    if (target) {
        target.classList.add('active');
        var sector = TRADE_SECTOR_MAP[mainKey];
        if (sector && nation) {
            var score = getSectorScore(nation, sector);
            var borderColor = score >= 70 ? '#5cb85c' : score >= 40 ? '#888' : '#d9534f';
            target.style.borderBottomColor = borderColor;
        }
    }

    // Re-render the full sectors tab to show/hide food sub-tabs
    var tabContent = document.getElementById('econ-tab-content');
    if (tabContent && nation) {
        tabContent.innerHTML = renderSectorsTab(nation);
        // Re-attach sector tab click handlers
        tabContent.querySelectorAll('.sector-tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                selectSector(tab.getAttribute('data-sector'), currentNation);
            });
        });
        tabContent.querySelectorAll('.food-subsector-tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                selectFoodSubsector(tab.getAttribute('data-subsector'), currentNation);
            });
        });
    }
}

function selectFoodSubsector(subsectorKey, nation) {
    activeFoodSubsector = subsectorKey;
    // Update food sub-tab active states
    document.querySelectorAll('.food-subsector-tab').forEach(function(t) {
        t.classList.remove('active');
    });
    var target = document.querySelector('.food-subsector-tab[data-subsector="' + subsectorKey + '"]');
    if (target) target.classList.add('active');
    // Re-render detail only
    var el = document.getElementById('sector-detail');
    if (el && nation) el.innerHTML = renderFoodSubsectorDetail(nation, subsectorKey);
}

// ==================== FOOD SUB-SECTOR DETAIL VIEW ====================
function renderFoodSubsectorDetail(nation, subsectorKey) {
    var sub = FOOD_SUBSECTOR_MAP[subsectorKey];
    if (!sub) return '<div class="econ-section"><div style="padding:16px;color:var(--text-secondary);">Unknown food sub-sector.</div></div>';

    var alloc = foodAllocation || DEFAULT_FOOD_ALLOCATION;
    var effectiveLand = getEffectiveArableLand(nation, subsectorKey, alloc);
    var allocPct = Number(alloc[sub.allocation_key]) || 0;

    var flow = (tradeData && tradeData.flows) ? tradeData.flows[subsectorKey] : null;
    // domProd = what this sub-sector actually produces each tick (gross).
    // expCap = exportable surplus after domestic demand + modifiers. The
    // Production card uses domProd; untraded-surplus math still uses expCap.
    var domProd = flow ? Number(flow.domestic_production) || 0 : 0;
    var expCap = flow ? Number(flow.export_capacity) || 0 : 0;
    var expVol = flow ? Number(flow.export_volume) || 0 : 0;
    var impDem = flow ? Number(flow.import_demand) || 0 : 0;
    var impVol = flow ? Number(flow.import_volume) || 0 : 0;
    var net = expVol - impVol;
    var priceMod = flow ? Number(flow.price_modifier) || 1 : 1;

    var h = '';

    // ── Header: Sub-sector name + description ──
    h += '<div class="econ-section">';
    h += '<div class="econ-section-header" style="display:flex;align-items:center;gap:10px;">';
    h += escapeHtml(sub.label).toUpperCase();
    if (sub.stockpilable) h += '<span style="font-size:0.6rem;padding:2px 6px;border-radius:3px;background:#2a3a2a;color:#5cb85c;font-weight:normal;letter-spacing:0.5px;">STOCKPILABLE</span>';
    h += '</div>';
    h += '<div class="econ-section-subtitle">' + escapeHtml(sub.description) + '</div>';

    // ── Top cards: 2 rows × 3 columns (Cash Crops layout) ──
    // Organic exports = current export volume (no trade deal needed)
    // Trade deal exports = 0 for now (RSC pre-allocations tracked separately in future)
    var organicExports = expVol;
    var tradeDealExports = 0;
    // Untraded surplus = production capacity beyond what's exported + consumed domestically
    var untradedSurplus = Math.max(0, expCap - expVol);
    var surplusAtCurrentPrice = Math.round(untradedSurplus * priceMod);
    var surplusAtFullPrice = untradedSurplus;

    var prodLabel = formatSectorVolume(domProd, subsectorKey);
    var demLabel = formatSectorVolume(impDem, subsectorKey);
    var orgExpLabel = formatSectorVolume(organicExports, subsectorKey);
    var tdExpLabel = formatSectorVolume(tradeDealExports, subsectorKey);
    var impLabel = formatSectorVolume(impVol, subsectorKey);
    var surplusLabel = formatSectorVolume(untradedSurplus, subsectorKey);

    h += '<div class="econ-cards-row econ-cards-3" style="margin-top:12px;">';
    h += renderOverviewCard('Production', prodLabel || formatBudgetCurrency(domProd), 'neutral', 'gross output / year');
    h += renderOverviewCard('Import Demand', demLabel || formatBudgetCurrency(impDem), impDem > domProd ? 'deficit' : 'neutral', 'imports wanted');
    h += renderOverviewCard('Exports \u2014 Organic', orgExpLabel || formatBudgetCurrency(organicExports), organicExports > 0 ? 'surplus' : 'neutral', organicExports > 0 ? 'no trade deal required' : 'no organic exports');
    h += '</div>';

    h += '<div class="econ-cards-row econ-cards-3" style="margin-top:0;">';
    h += renderOverviewCard('Exports \u2014 Trade Deals', tdExpLabel || formatBudgetCurrency(tradeDealExports), tradeDealExports > 0 ? 'surplus' : 'neutral', tradeDealExports > 0 ? 'active agreements' : 'no active deals');
    h += renderOverviewCard('Imports', impLabel || formatBudgetCurrency(impVol), impVol > 0 ? 'deficit' : 'neutral', impVol > 0 ? 'specialty varieties' : 'no imports');
    h += renderOverviewCard('Untraded Surplus \u2014 Seek Buyers', surplusLabel || formatBudgetCurrency(untradedSurplus), untradedSurplus > 0 ? 'deficit' : 'surplus', untradedSurplus > 0 ? 'sitting idle \u00b7 no buyer secured' : 'all production allocated');
    h += '</div>';

    // Surplus value calculation
    if (untradedSurplus > 0) {
        h += '<div style="padding:4px 16px;text-align:right;font-family:var(--font-mono);font-size:0.65rem;color:var(--text-dim);">';
        h += 'At current ' + priceMod.toFixed(2) + 'x&nbsp;&nbsp;&nbsp;' + formatBudgetCurrency(surplusAtCurrentPrice) + ' / yr';
        h += '<br>At full price 1.0x&nbsp;&nbsp;&nbsp;' + formatBudgetCurrency(surplusAtFullPrice) + ' / yr';
        h += '</div>';
    }

    // ── Unmet Demand stat penalty warning ──
    var totalSupply = expCap + impVol;
    var unmetDemand = Math.max(0, impDem - totalSupply);
    var unmetPct = impDem > 0 ? Math.round(unmetDemand / impDem * 100) : 0;
    if (unmetPct >= 5 && sub.stat_effects && sub.stat_effects.shortage) {
        var shortageStats = sub.stat_effects.shortage;
        var penaltyTags = Object.keys(shortageStats).map(function(statKey) {
            var weight = shortageStats[statKey];
            var arrow = weight > 0 ? '\u2191' : '\u2193';
            var label = statKey.replace(/_/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
            return '<span style="font-size:0.6rem;padding:2px 6px;border-radius:3px;background:rgba(217,83,79,0.08);color:#d9534f;border:1px solid rgba(217,83,79,0.2);white-space:nowrap;">' + escapeHtml(label) + ' ' + arrow + '</span>';
        }).join(' ');

        h += '<div style="padding:8px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">';
        h += '<span style="font-size:0.6rem;text-transform:uppercase;color:#d9534f;letter-spacing:1px;font-weight:700;">SHORTAGE EFFECTS</span>';
        h += penaltyTags;
        h += '</div>';
    }

    // ── Food Security Status (for food-security sectors only) ──
    if (sub.food_security_weight > 0) {
        var securityStatus = computeFoodSecurityStatus(tradeData ? tradeData.flows : null);
        var sectorSec = securityStatus.perSector[subsectorKey];
        var sectorRatio = sectorSec ? sectorSec.ratio : 1.0;
        var sectorLabel = sectorRatio >= 1.1 ? 'Surplus' : sectorRatio >= 0.9 ? 'Secure' : sectorRatio >= 0.75 ? 'Adequate' : sectorRatio >= 0.6 ? 'Strained' : sectorRatio >= 0.4 ? 'Shortage' : 'Crisis';
        var sectorColor = sectorRatio >= 1.1 ? '#5cb85c' : sectorRatio >= 0.9 ? '#4a9a5b' : sectorRatio >= 0.75 ? '#8ab563' : sectorRatio >= 0.6 ? '#d48a3c' : sectorRatio >= 0.4 ? '#c0392b' : '#8b0000';

        h += '<div style="display:flex;gap:16px;padding:8px 16px;align-items:center;flex-wrap:wrap;">';
        // Security badge
        h += '<div style="display:flex;align-items:center;gap:8px;">';
        h += '<span style="font-size:0.65rem;text-transform:uppercase;color:var(--text-muted);letter-spacing:1px;">Food Security</span>';
        h += '<span style="font-size:0.85rem;font-weight:bold;color:' + sectorColor + ';padding:3px 10px;border:1px solid ' + sectorColor + ';border-radius:4px;background:' + sectorColor + '15;">' + sectorLabel + '</span>';
        h += '</div>';
        // Overall food security
        h += '<div style="display:flex;align-items:center;gap:8px;">';
        h += '<span style="font-size:0.65rem;text-transform:uppercase;color:var(--text-muted);letter-spacing:1px;">Overall</span>';
        h += '<span style="font-size:0.8rem;font-weight:bold;color:' + securityStatus.color + ';padding:3px 10px;border:1px solid ' + securityStatus.color + ';border-radius:4px;background:' + securityStatus.color + '15;">' + escapeHtml(securityStatus.label) + '</span>';
        h += '</div>';
        h += '</div>';
    }

    // ── Global market info + unit price ──
    var avgPrice = getGlobalAverageUnitPrice(subsectorKey, priceMod);
    var priceColor = priceMod >= 1.3 ? '#d9534f' : priceMod <= 0.7 ? '#5cb85c' : 'var(--text-secondary)';
    var priceLabel = priceMod >= 1.5 ? 'high' : priceMod >= 1.2 ? 'elevated' : priceMod >= 0.8 ? 'stable' : priceMod >= 0.6 ? 'low' : 'oversupply';
    var sectorTradeBalance = expVol - impVol;
    h += '<div style="display:flex;gap:20px;padding:8px 16px;flex-wrap:wrap;align-items:center;">';
    h += '<div style="font-size:0.75rem;color:var(--text-muted);">Global Price <span style="color:' + priceColor + ';font-weight:bold;">' + priceMod.toFixed(2) + 'x</span> <span style="font-size:0.65rem;">(' + priceLabel + ')</span></div>';
    h += '<div style="font-size:0.75rem;color:var(--text-muted);">Global Avg Unit Price <span style="color:' + priceColor + ';font-weight:bold;">' + formatPricePerTonne(avgPrice) + '</span></div>';
    h += '<div style="margin-left:auto;font-size:0.75rem;">Net flow: <span style="font-weight:bold;color:' + (sectorTradeBalance >= 0 ? '#5cb85c' : '#d9534f') + ';">' + formatBudgetCurrency(sectorTradeBalance) + '</span> · ' + (sectorTradeBalance >= 0 ? 'net exporter' : 'net importer') + '</div>';
    h += '</div>';

    h += '</div>'; // end header section

    // ── Stockpile display (stockpilable sectors only) ──
    if (sub.stockpilable && STOCKPILE_CONFIG[subsectorKey]) {
        var stockData = (foodStockpiles && foodStockpiles[subsectorKey]) ? foodStockpiles[subsectorKey] : null;
        var reserveVal = stockData ? Number(stockData.reserve_value) || 0 : 0;
        var maxCap = stockData ? Number(stockData.max_capacity) || 0 : calculateStockpileCapacity(subsectorKey, nation);
        var lastSpoilage = stockData ? Number(stockData.last_spoilage) || 0 : 0;
        var lastInflow = stockData ? Number(stockData.last_inflow) || 0 : 0;
        var lastOutflow = stockData ? Number(stockData.last_outflow) || 0 : 0;
        var fillPct = maxCap > 0 ? Math.min(100, Math.round((reserveVal / maxCap) * 100)) : 0;

        // Calculate months of coverage
        var domesticConsumption = expCap > 0 ? Math.max(0, expCap - (flow ? Number(flow.export_volume) || 0 : 0)) + impDem : impDem;
        var monthsCoverage = calculateReserveMonths(reserveVal, domesticConsumption);

        var reserveVolume = formatSectorVolume(reserveVal, subsectorKey);
        var capVolume = formatSectorVolume(maxCap, subsectorKey);
        var spoilRate = calculateStockpileSpoilage(subsectorKey, nation);

        var fillColor = fillPct >= 60 ? '#5cb85c' : fillPct >= 30 ? '#d48a3c' : fillPct > 0 ? '#d9534f' : '#333';
        var monthsColor = monthsCoverage >= 6 ? '#5cb85c' : monthsCoverage >= 3 ? '#d48a3c' : '#d9534f';

        h += '<div class="econ-section">';
        h += '<div class="econ-section-header">STRATEGIC RESERVES</div>';

        // Reserve bar + stats
        h += '<div style="padding:8px 16px;">';

        // Top row: reserve level + months
        h += '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">';
        h += '<div style="font-size:0.85rem;color:var(--text-primary);font-weight:bold;">' + (reserveVolume || formatBudgetCurrency(reserveVal)) + '</div>';
        h += '<div style="font-size:0.75rem;color:' + monthsColor + ';font-weight:bold;">' + monthsCoverage + ' months coverage</div>';
        h += '</div>';

        // Capacity bar
        h += '<div style="height:20px;background:var(--bg-card);border-radius:3px;border:1px solid var(--border-color);overflow:hidden;margin-bottom:8px;">';
        h += '<div style="height:100%;width:' + fillPct + '%;background:' + fillColor + ';transition:width 0.3s;display:flex;align-items:center;justify-content:center;">';
        if (fillPct >= 15) h += '<span style="font-size:0.6rem;color:rgba(0,0,0,0.7);font-weight:600;">' + fillPct + '%</span>';
        h += '</div></div>';

        // Details row
        h += '<div style="display:flex;gap:16px;font-size:0.7rem;color:var(--text-muted);flex-wrap:wrap;">';
        h += '<span>Capacity: ' + (capVolume || formatBudgetCurrency(maxCap)) + '</span>';
        h += '<span>Spoilage: ' + spoilRate.toFixed(1) + '%/tick</span>';
        if (lastInflow > 0) h += '<span style="color:#5cb85c;">Inflow: +' + formatBudgetCurrency(lastInflow) + '</span>';
        if (lastOutflow > 0) h += '<span style="color:#d9534f;">Outflow: -' + formatBudgetCurrency(lastOutflow) + '</span>';
        if (lastSpoilage > 0) h += '<span style="color:#d48a3c;">Spoiled: -' + formatBudgetCurrency(lastSpoilage) + '</span>';
        h += '</div>';

        h += '</div></div>';
    }

    // ── Spoilage warning for perishables ──
    if (subsectorKey === 'fruits_vegetables') {
        var spoilage = calculateSpoilageMultiplier(nation);
        if (spoilage < 1.0) {
            var spoilagePct = Math.round((1 - spoilage) * 100);
            var spoilColor = spoilagePct >= 30 ? '#d9534f' : '#d48a3c';
            h += '<div class="econ-section" style="margin-top:0;">';
            h += '<div style="padding:10px 16px;border:1px solid ' + spoilColor + ';border-radius:4px;background:' + spoilColor + '15;margin:0 16px;">';
            h += '<div style="font-size:0.75rem;font-weight:bold;color:' + spoilColor + ';margin-bottom:4px;">SPOILAGE WARNING: ' + spoilagePct + '% of production lost</div>';
            h += '<div style="font-size:0.75rem;color:var(--text-secondary);">';
            var rail = Number(nation.rail_network) || 0;
            var infra = Number(nation.physical_infrastructure) || 0;
            var energy = Number(nation.energy_generation) || 0;
            var spoilReasons = [];
            if (rail < 40) spoilReasons.push('Rail Network ' + Math.round(rail) + ' (need 40+)');
            if (infra < 35) spoilReasons.push('Physical Infrastructure ' + Math.round(infra) + ' (need 35+)');
            if (energy < 30) spoilReasons.push('Energy Generation ' + Math.round(energy) + ' (need 30+)');
            h += 'Cold chain failure: ' + spoilReasons.join(' · ');
            h += '</div></div></div>';
        }
    }

    // ── Production Drivers ──
    h += '<div class="econ-section">';
    h += '<div class="econ-section-header">PRODUCTION DRIVERS</div>';
    h += '<div class="sector-drivers">';

    // Effective arable land (primary driver)
    var landPct = Math.min(100, Math.max(0, Math.round(effectiveLand)));
    var landColor = landPct >= 20 ? '#5cb85c' : landPct >= 10 ? '#888' : '#d9534f';
    h += '<div class="sector-driver-row">';
    h += '<div class="sector-driver-label">Arable Land (' + allocPct + '% of ' + Math.round(Number(nation.arable_land) || 0) + ')</div>';
    h += '<div class="sector-driver-track"><div class="sector-driver-fill" style="width:' + landPct + '%;background:' + landColor + '"></div></div>';
    h += '<div class="sector-driver-value" style="color:' + landColor + '">' + landPct.toFixed(1) + '</div>';
    h += '<div class="sector-driver-trend"></div>';
    h += '</div>';

    // Secondary drivers
    for (var di = 0; di < sub.drivers.length; di++) {
        var d = sub.drivers[di];
        if (d.stat === 'arable_land') continue;
        var val = Number(nation[d.stat]) || 0;
        var stPct = Math.min(100, Math.max(0, Math.round(val)));
        var stColor = stPct >= 70 ? '#5cb85c' : stPct >= 40 ? '#f0efe6' : '#d9534f';
        var barColor = stPct >= 70 ? '#5cb85c' : stPct >= 40 ? '#888' : '#d9534f';
        var label = formatStatLabel(d.stat);
        if (d.critical) label += ' (critical)';

        h += '<div class="sector-driver-row">';
        h += '<div class="sector-driver-label">' + escapeHtml(label) + '</div>';
        h += '<div class="sector-driver-track"><div class="sector-driver-fill" style="width:' + stPct + '%;background:' + barColor + '"></div></div>';
        h += '<div class="sector-driver-value" style="color:' + stColor + '">' + stPct + '</div>';
        var trendHtml = getTrendArrow(d.stat, val, false);
        h += '<div class="sector-driver-trend">' + trendHtml + '</div>';
        h += '</div>';
    }
    h += '</div></div>';

    // ── Demand Pressures ──
    h += '<div class="econ-section">';
    h += '<div class="econ-section-header">DEMAND PRESSURES</div>';
    h += '<div class="sector-drivers">';
    for (var ddi = 0; ddi < sub.demand_drivers.length; ddi++) {
        var dd = sub.demand_drivers[ddi];
        var ddVal, ddLabel;
        if (dd.type === 'population') {
            ddVal = Math.min(100, Math.round((Number(nation.population) || 0) / 250000));
            ddLabel = 'Population (' + Math.round((Number(nation.population) || 0) / 1000000) + 'M)';
        } else {
            ddVal = Number(nation[dd.stat]) || 0;
            ddLabel = formatStatLabel(dd.stat);
        }
        var ddPct = Math.min(100, Math.max(0, Math.round(ddVal)));
        var ddColor = ddPct >= 70 ? '#d9534f' : ddPct >= 40 ? '#888' : '#5cb85c';
        var ddBarColor = ddPct >= 70 ? '#d9534f' : ddPct >= 40 ? '#888' : '#5cb85c';

        h += '<div class="sector-driver-row">';
        h += '<div class="sector-driver-label">' + escapeHtml(ddLabel) + '</div>';
        h += '<div class="sector-driver-track"><div class="sector-driver-fill" style="width:' + ddPct + '%;background:' + ddBarColor + '"></div></div>';
        h += '<div class="sector-driver-value" style="color:' + ddColor + '">' + ddPct + '</div>';
        h += '<div class="sector-driver-trend"></div>';
        h += '</div>';
    }
    h += '</div></div>';

    // ── Trade Partners (reuse existing renderSectorPartners) ──
    h += renderSectorPartners(subsectorKey, sub);

    // ── Arable Land Allocation Bar ──
    h += renderArableLandAllocation(nation, alloc, subsectorKey);

    return h;
}

function renderArableLandAllocation(nation, alloc, activeSubsector) {
    var totalArable = Math.round(Number(nation.arable_land) || 0);
    var h = '<div class="econ-section">';
    h += '<div class="econ-section-header">ARABLE LAND ALLOCATION — ' + totalArable + ' TOTAL</div>';

    var segments = [
        { key: 'grains_pct', label: 'Grains', color: '#c9a54e' },
        { key: 'livestock_pct', label: 'Livestock', color: '#6aa3d9' },
        { key: 'perishables_pct', label: 'Perishables', color: '#5cb85c' },
        { key: 'cash_crops_pct', label: 'Cash Crops', color: '#d48a3c' }
    ];

    // Allocation bar
    h += '<div class="food-alloc-bar">';
    for (var i = 0; i < segments.length; i++) {
        var seg = segments[i];
        var pct = Number(alloc[seg.key]) || 0;
        var subKey = FOOD_SUBSECTORS[i].key;
        var isActive = subKey === activeSubsector;
        if (pct > 0) {
            h += '<div class="food-alloc-segment' + (isActive ? ' active' : '') + '" style="width:' + pct + '%;background:' + seg.color + (isActive ? '' : '80') + ';" title="' + seg.label + ': ' + pct + '%">';
            if (pct >= 12) h += '<span class="food-alloc-label">' + seg.label + ' ' + pct + '%</span>';
            h += '</div>';
        }
    }
    h += '</div>';

    // Legend with effective land values
    h += '<div class="food-alloc-legend">';
    for (var i = 0; i < segments.length; i++) {
        var seg = segments[i];
        var pct = Number(alloc[seg.key]) || 0;
        var effective = Math.round(totalArable * pct / 100 * 10) / 10;
        h += '<div class="food-alloc-legend-item">';
        h += '<span class="food-alloc-legend-swatch" style="background:' + seg.color + '"></span>';
        h += '<span>' + seg.label + ' <strong>' + pct + '%</strong></span>';
        h += '<span style="color:var(--text-muted);font-size:0.7rem;margin-left:4px;">(' + effective + ' effective)</span>';
        h += '</div>';
    }
    h += '</div>';

    h += '</div>';
    return h;
}

function renderSectorDetail(nation, sectorKey) {
    var sector = TRADE_SECTOR_MAP[sectorKey];
    if (!sector) return '';

    var score = getSectorScore(nation, sector);
    var pct = Math.min(100, Math.max(0, Math.round(score)));
    var aboveThreshold = score >= sector.export_threshold;
    var scoreColor = pct >= 70 ? '#5cb85c' : pct >= 40 ? '#f0efe6' : '#d9534f';
    var borderColor = pct >= 70 ? '#5cb85c' : pct >= 40 ? '#888' : '#d9534f';

    var flow = (tradeData && tradeData.flows) ? tradeData.flows[sectorKey] : null;
    var expVol = flow ? Number(flow.export_volume) || 0 : 0;
    var impVol = flow ? Number(flow.import_volume) || 0 : 0;
    var net = expVol - impVol;
    var priceMod = flow ? Number(flow.price_modifier) || 1 : 1;
    var isNetImporter = impVol > expVol;

    // Compute RSC-committed capacity for this sector
    var rscExportCommittedPct = 0;  // % of our export capacity locked to RSC buyers
    var rscImportCommittedPct = 0;  // % of our import demand locked to RSC sellers
    var rscExportPartners = [];     // names of buyers we're committed to
    var rscImportPartners = [];     // names of sellers we're committed to
    if (tradeAgreements && nation) {
        for (var _ri = 0; _ri < tradeAgreements.length; _ri++) {
            var _rsc = tradeAgreements[_ri];
            if (_rsc.agreement_type !== 'resource_supply') continue;
            var _arts = _rsc.articles || [];
            var _supplyArt = null;
            for (var _ai = 0; _ai < _arts.length; _ai++) {
                if (_arts[_ai].type === 'supply_commitment') { _supplyArt = _arts[_ai].data; break; }
            }
            if (!_supplyArt || _supplyArt.sector !== sectorKey || !_supplyArt.commitment_pct) continue;
            var _authorId = _supplyArt.author_nation_id || _rsc.nation_a_id;
            var _otherId = (_authorId === _rsc.nation_a_id) ? _rsc.nation_b_id : _rsc.nation_a_id;
            var _sellerId = _supplyArt.direction === 'we_buy' ? _otherId : _authorId;
            var _buyerId  = _supplyArt.direction === 'we_buy' ? _authorId : _otherId;
            var _pct = Number(_supplyArt.commitment_pct) || 0;
            if (_sellerId === nation.id) {
                rscExportCommittedPct += _pct;
                var _buyerName = (tradeData && tradeData.nationNames && tradeData.nationNames[_buyerId]) || _buyerId;
                rscExportPartners.push(_buyerName + ' (' + _pct + '%)');
            }
            if (_buyerId === nation.id) {
                rscImportCommittedPct += _pct;
                var _sellerName = (tradeData && tradeData.nationNames && tradeData.nationNames[_sellerId]) || _sellerId;
                rscImportPartners.push(_sellerName + ' (' + _pct + '%)');
            }
        }
    }

    var h = '';

    // --- Header card with score + volume summary ---
    h += '<div class="econ-section">';
    h += '<div class="econ-section-header">' + escapeHtml(sector.label).toUpperCase();
    if (sector.export_only) h += ' <span class="sector-badge">EXPORT ONLY</span>';
    h += '</div>';

    // ── 2×3 card layout (matching food subsector design) ──
    if (flow) {
        // prodVal = what the nation actually produces each tick (gross).
        // expCapVal = exportable surplus after domestic demand. The
        // Production card uses prodVal; untraded-surplus math uses expCapVal.
        var prodVal = Number(flow.domestic_production) || 0;
        var expCapVal = Number(flow.export_capacity) || 0;
        var demandVal = Number(flow.import_demand) || 0;

        var organicExp = expVol;
        var tradeDealExp = 0; // RSC pre-allocations tracked separately in future
        var untradedSurplus = Math.max(0, expCapVal - expVol);
        var surplusAtCurrentPrice = Math.round(untradedSurplus * priceMod);
        var surplusAtFullPrice = untradedSurplus;

        // Row 1: Production | Demand | Exports — Organic
        h += '<div class="econ-cards-row econ-cards-3" style="margin-top:12px;">';
        h += renderOverviewCard('Production', formatTradeVolume(prodVal, sectorKey), 'neutral', 'gross output / year');
        if (!sector.export_only) {
            h += renderOverviewCard('Import Demand', formatTradeVolume(demandVal, sectorKey), demandVal > prodVal ? 'deficit' : 'neutral', 'imports wanted');
        } else {
            h += renderOverviewCard('Revenue', formatBudgetCurrency(expVol), 'surplus', 'export revenue');
        }
        h += renderOverviewCard('Exports \u2014 Organic', formatTradeVolume(organicExp, sectorKey), organicExp > 0 ? 'surplus' : 'neutral', organicExp > 0 ? 'no trade deal required' : 'no organic exports');
        h += '</div>';

        // Row 2
        h += '<div class="econ-cards-row econ-cards-3" style="margin-top:0;">';
        if (sector.export_only) {
            h += renderOverviewCard('Agreements', formatTradeVolume(tradeDealExp, sectorKey), tradeDealExp > 0 ? 'surplus' : 'neutral', tradeDealExp > 0 ? 'active partnerships' : 'no active partnerships');
            h += renderOverviewCard('Inbound Demand', formatTradeVolume(impVol, sectorKey), impVol > 0 ? 'neutral' : 'neutral', 'visitors \u00b7 clients \u00b7 contracts');
            h += renderOverviewCard('Unrealized Capacity', formatTradeVolume(untradedSurplus, sectorKey), untradedSurplus > 0 ? 'deficit' : 'surplus', untradedSurplus > 0 ? 'capacity not generating revenue' : 'fully utilized');
        } else {
            h += renderOverviewCard('Exports \u2014 Trade Deals', formatTradeVolume(tradeDealExp, sectorKey), tradeDealExp > 0 ? 'surplus' : 'neutral', tradeDealExp > 0 ? 'active agreements' : 'no active deals');
            h += renderOverviewCard('Imports', formatTradeVolume(impVol, sectorKey), impVol > 0 ? 'deficit' : 'neutral', impVol > 0 ? 'foreign supply' : 'no imports');
            h += renderOverviewCard('Untraded Surplus \u2014 Seek Buyers', formatTradeVolume(untradedSurplus, sectorKey), untradedSurplus > 0 ? 'deficit' : 'surplus', untradedSurplus > 0 ? 'sitting idle \u00b7 no buyer secured' : 'all production allocated');
        }
        h += '</div>';

        // Surplus value calculation
        if (untradedSurplus > 0) {
            h += '<div style="padding:4px 16px;text-align:right;font-family:var(--font-mono);font-size:0.65rem;color:var(--text-dim);">';
            h += 'At current ' + priceMod.toFixed(2) + 'x&nbsp;&nbsp;&nbsp;' + formatBudgetCurrency(surplusAtCurrentPrice) + ' / yr';
            h += '<br>At full price 1.0x&nbsp;&nbsp;&nbsp;' + formatBudgetCurrency(surplusAtFullPrice) + ' / yr';
            h += '</div>';
        }

        // Footer: Global Price + Net flow
        var priceColor = priceMod >= 1.3 ? '#d9534f' : priceMod <= 0.7 ? '#5cb85c' : 'var(--text-secondary)';
        var priceLabel = priceMod >= 1.5 ? 'high' : priceMod >= 1.2 ? 'elevated' : priceMod >= 0.8 ? 'stable' : priceMod >= 0.6 ? 'low' : 'oversupply';
        h += '<div style="display:flex;gap:20px;padding:8px 16px;flex-wrap:wrap;align-items:center;">';
        h += '<div style="font-size:0.75rem;color:var(--text-muted);">Global Price <span style="color:' + priceColor + ';font-weight:bold;">' + priceMod.toFixed(2) + 'x</span> <span style="font-size:0.65rem;">(' + priceLabel + ')</span></div>';
        h += '<div style="margin-left:auto;font-size:0.75rem;">Net flow: <span style="font-weight:bold;color:' + (net >= 0 ? '#5cb85c' : '#d9534f') + ';">' + formatBudgetCurrency(net) + '</span> \u00b7 ' + (net >= 0 ? 'net exporter' : 'net importer') + '</div>';
        h += '</div>';
    } else {
        h += '<div style="padding:20px 16px;font-size:0.8rem;color:var(--text-dim);font-style:italic;">No trade flow data yet.</div>';
    }

    // Unmet demand warning (non-export-only sectors)
    if (flow && !sector.export_only) {
        var demandVal2 = Number(flow.import_demand) || 0;
        var supplyVal2 = Number(flow.export_capacity) || 0;
        var totalSectorSupply = supplyVal2 + impVol;
        var sectorUnmet = Math.max(0, demandVal2 - totalSectorSupply);
        var sectorUnmetPct = demandVal2 > 0 ? Math.round(sectorUnmet / demandVal2 * 100) : 0;
        if (sectorUnmetPct >= 5) {
            var urgency = sectorUnmetPct >= 50 ? '#d9534f' : '#d48a3c';
            var urgencyLabel = sectorUnmetPct >= 50 ? 'CRITICAL' : 'WARNING';
            h += '<div style="margin:8px 16px;padding:10px 14px;border-radius:4px;border:1px solid ' + urgency + ';background:' + urgency + '15;">';
            h += '<div style="font-size:0.75rem;font-weight:bold;color:' + urgency + ';margin-bottom:4px;">' + urgencyLabel + ': ' + sectorUnmetPct + '% of import demand unmet</div>';
            h += '</div>';
        }
    }

    h += '</div>'; // .econ-section

    // --- Why Imports / Why Exports explanation ---
    h += renderTradeExplanation(nation, sectorKey, sector, flow);

    // --- Export Drivers ---
    h += renderSectorDrivers(nation, sector);

    // --- Import Drivers ---
    h += renderImportDrivers(nation, sector);

    // --- Partner breakdown ---
    h += renderSectorPartners(sectorKey, sector);

    return h;
}

function renderTradeExplanation(nation, sectorKey, sector, flow) {
    if (!flow) return '';

    var expVol = Number(flow.export_volume) || 0;
    var impVol = Number(flow.import_volume) || 0;
    var expCap = Number(flow.export_capacity) || 0;
    var impDem = Number(flow.import_demand) || 0;
    var priceMod = Number(flow.price_modifier) || 1;

    var exportReasons = [];
    var importReasons = [];

    // --- Build export explanation ---
    if (expVol > 0) {
        var score = getSectorScore(nation, sector);
        exportReasons.push('Export capacity of ' + Math.round(score) + ' exceeds the threshold of ' + sector.export_threshold);
        if (priceMod < 0.85) exportReasons.push('Global oversupply is depressing prices (' + priceMod.toFixed(2) + 'x modifier)');
        else if (priceMod > 1.15) exportReasons.push('Strong global demand is boosting prices (' + priceMod.toFixed(2) + 'x modifier)');
    } else if (expCap > 0) {
        // Has capacity but no actual exports
        exportReasons.push('Has export capacity but no trade partners are buying');
        if (priceMod < 0.7) exportReasons.push('Global oversupply (' + priceMod.toFixed(2) + 'x) is reducing demand');

        // Check affinity issues
        var hasPartners = false;
        if (tradeData && tradeData.partners) {
            for (var pid in tradeData.partners) {
                var p = tradeData.partners[pid];
                if (p.exportsTo && p.exportsTo[sectorKey] > 0) { hasPartners = true; break; }
            }
        }
        if (!hasPartners) {
            exportReasons.push('No trade partners with sufficient affinity — consider signing trade agreements');
        }
    } else {
        var score = getSectorScore(nation, sector);
        if (score > (sector.export_threshold || 0)) {
            // Score is above threshold but capacity is still 0 — sector-specific gate
            if (sector.key === 'tourism' && (Number(nation.stability) || 0) <= 25) {
                exportReasons.push('Tourism requires stability above 25 (currently ' + Math.round(Number(nation.stability) || 0) + ')');
            } else if (sector.key === 'arms') {
                exportReasons.push('Arms exports require defense spending above 8% of budget');
            } else {
                exportReasons.push('Score of ' + Math.round(score) + ' is above threshold but capacity is blocked by other factors');
            }
        } else if (score > 0) {
            exportReasons.push('Score of ' + Math.round(score) + ' is below the export threshold of ' + sector.export_threshold);
        } else {
            exportReasons.push('No domestic production in this sector');
        }
    }

    // --- Build import explanation ---
    if (!sector.export_only) {
        if (impVol > 0) {
            if (sectorKey === 'fuel_energy') {
                var oilGas = Number(nation.oil_and_gas) || 0;
                var energyGen = Number(nation.energy_generation) || 0;
                var manuf = Number(nation.manufacturing_output) || 0;
                var urban = Number(nation.urbanization) || 0;
                var rail = Number(nation.rail_network) || 0;
                var col = Number(nation.cost_of_living) || 0;
                if (oilGas < 50 || energyGen < 50) importReasons.push('Domestic energy production is insufficient (Oil & Gas: ' + Math.round(oilGas) + ', Energy Gen: ' + Math.round(energyGen) + ')');
                if (manuf > 40) importReasons.push('Manufacturing sector ('+Math.round(manuf)+') drives industrial fuel consumption');
                if (urban > 50) importReasons.push('High urbanization ('+Math.round(urban)+') increases energy needs');
                if (rail < 40) importReasons.push('Weak rail network ('+Math.round(rail)+') forces reliance on fuel-based transport');
                if (col > 60) importReasons.push('High cost of living ('+Math.round(col)+') reflects energy-intensive lifestyles');
            } else if (sectorKey === 'food_agriculture') {
                var arableLand = Number(nation.arable_land) || 0;
                if (arableLand < 50) importReasons.push('Limited arable land ('+Math.round(arableLand)+') cannot feed the population');
                else importReasons.push('Population outpaces domestic food production');
            } else if (sectorKey === 'grains_staples') {
                var arableLand = Number(nation.arable_land) || 0;
                var pop = Number(nation.population) || 0;
                if (arableLand < 40) importReasons.push('Limited arable land ('+Math.round(arableLand)+') insufficient for grain production');
                if (pop > 8000000) importReasons.push('Large population ('+Math.round(pop/1000000)+'M) creates high staple demand');
                if (importReasons.length === 0) importReasons.push('Population demand outpaces domestic grain production');
            } else if (sectorKey === 'livestock_dairy') {
                var sol = Number(nation.standard_of_living) || 0;
                var arableLand = Number(nation.arable_land) || 0;
                if (sol > 50) importReasons.push('High standard of living ('+Math.round(sol)+') drives meat and dairy demand');
                if (arableLand < 40) importReasons.push('Limited pastureland constrains domestic livestock (Arable: '+Math.round(arableLand)+')');
                if (importReasons.length === 0) importReasons.push('Domestic livestock cannot meet population demand');
            } else if (sectorKey === 'fruits_vegetables') {
                var rail = Number(nation.rail_network) || 0;
                var infra = Number(nation.physical_infrastructure) || 0;
                var urban = Number(nation.urbanization) || 0;
                if (rail < 40) importReasons.push('Weak rail network ('+Math.round(rail)+') causes spoilage — cold chain failure');
                if (infra < 35) importReasons.push('Poor infrastructure ('+Math.round(infra)+') disrupts perishable distribution');
                if (urban > 60) importReasons.push('High urbanization ('+Math.round(urban)+') concentrates demand beyond local supply');
                if (importReasons.length === 0) importReasons.push('Domestic produce insufficient for population needs');
            } else if (sectorKey === 'cash_crops') {
                var sol = Number(nation.standard_of_living) || 0;
                if (sol > 50) importReasons.push('Wealthy population (Std. Living: '+Math.round(sol)+') imports premium goods (coffee, cocoa, tea)');
                else importReasons.push('Modest domestic demand for imported cash crop products');
            } else if (sectorKey === 'minerals') {
                var minerals = Number(nation.rare_minerals) || 0;
                var manuf = Number(nation.manufacturing_output) || 0;
                if (minerals < 60) importReasons.push('Low mineral reserves ('+Math.round(minerals)+') require imports');
                if (manuf > 30) importReasons.push('Manufacturing sector ('+Math.round(manuf)+') creates demand for raw material inputs');
            } else if (sectorKey === 'manufactured_goods') {
                var manuf = Number(nation.manufacturing_output) || 0;
                var sol = Number(nation.standard_of_living) || 0;
                if (manuf < 50) importReasons.push('Domestic manufacturing ('+Math.round(manuf)+') cannot meet consumer demand');
                if (sol > 50) importReasons.push('Higher standard of living ('+Math.round(sol)+') drives demand for imported goods');
            } else if (sectorKey === 'technology') {
                var digi = Number(nation.digital_infrastructure) || 0;
                if (digi < 50) importReasons.push('Low domestic tech capacity (Digital Infra: '+Math.round(digi)+')');
                else importReasons.push('Digital economy growth outpaces domestic production');
            } else if (sectorKey === 'arms') {
                importReasons.push('Defense spending requires equipment procurement');
            }
        } else if (impDem > 0) {
            importReasons.push('Has import demand but no trade partners are selling');
        } else {
            importReasons.push('Self-sufficient — no import demand in this sector');
        }
    }

    // --- Render ---
    var h = '<div class="econ-section">';
    h += '<div class="econ-section-header">TRADE ANALYSIS</div>';

    h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:12px 16px;">';

    // Export column
    h += '<div>';
    h += '<div style="font-size:0.7rem;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;letter-spacing:1px;">Why Exports = ' + formatBudgetCurrency(expVol) + '</div>';
    for (var i = 0; i < exportReasons.length; i++) {
        var eColor = expVol > 0 ? '#5cb85c' : 'var(--text-secondary)';
        h += '<div style="font-size:0.8rem;color:' + eColor + ';margin-bottom:4px;padding-left:10px;border-left:2px solid ' + eColor + ';">' + escapeHtml(exportReasons[i]) + '</div>';
    }
    h += '</div>';

    // Import column
    if (!sector.export_only) {
        h += '<div>';
        h += '<div style="font-size:0.7rem;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;letter-spacing:1px;">Why Imports = ' + formatBudgetCurrency(impVol) + '</div>';
        for (var i = 0; i < importReasons.length; i++) {
            var iColor = impVol > 0 ? '#d9534f' : 'var(--text-secondary)';
            h += '<div style="font-size:0.8rem;color:' + iColor + ';margin-bottom:4px;padding-left:10px;border-left:2px solid ' + iColor + ';">' + escapeHtml(importReasons[i]) + '</div>';
        }
        h += '</div>';
    }

    h += '</div>';

    // --- Unmet demand warning ---
    if (!sector.export_only && impDem > 0 && impVol < impDem) {
        var unmetPct = Math.round(((impDem - impVol) / impDem) * 100);
        if (unmetPct >= 5) {
            var urgency = unmetPct >= 50 ? '#d9534f' : '#d48a3c';
            var urgencyLabel = unmetPct >= 50 ? 'CRITICAL' : 'WARNING';
            h += '<div style="margin:8px 16px;padding:10px 14px;border-radius:4px;border:1px solid ' + urgency + ';background:' + urgency + '15;">';
            h += '<div style="font-size:0.75rem;font-weight:bold;color:' + urgency + ';margin-bottom:4px;">' + urgencyLabel + ': ' + unmetPct + '% of import demand unmet</div>';
            h += '<div style="font-size:0.75rem;color:var(--text-secondary);">';
            var penalties = [];
            if (sectorKey === 'fuel_energy') penalties = ['Energy Generation \u2193', 'Manufacturing Output \u2193', 'Inflation \u2191', 'Cost of Living \u2191'];
            else if (sectorKey === 'food_agriculture') penalties = ['Happiness \u2193', 'Civil Unrest \u2191', 'Healthcare Quality \u2193'];
            else if (sectorKey === 'grains_staples') penalties = ['Stability \u2193', 'Legitimacy \u2193', 'Civil Unrest \u2191', 'Poverty Rate \u2191', 'Happiness \u2193'];
            else if (sectorKey === 'livestock_dairy') penalties = ['Standard of Living \u2193', 'Happiness \u2193', 'Cost of Living \u2191'];
            else if (sectorKey === 'fruits_vegetables') penalties = ['Healthcare Quality \u2193', 'Happiness \u2193', 'Cost of Living \u2191'];
            else if (sectorKey === 'cash_crops') penalties = ['GDP Growth \u2193', 'Foreign Investment \u2193'];
            else if (sectorKey === 'minerals') penalties = ['Manufacturing Output \u2193', 'Infrastructure \u2193'];
            else if (sectorKey === 'manufactured_goods') penalties = ['Standard of Living \u2193', 'Cost of Living \u2191'];
            else if (sectorKey === 'technology') penalties = ['Digital Infrastructure \u2193', 'Innovation Index \u2193'];
            else if (sectorKey === 'arms') penalties = ['Military Strength \u2193'];
            if (penalties.length > 0) h += 'Stat impact: ' + penalties.join(' \u2022 ');
            h += '</div>';
            h += '</div>';
        }
    }

    // --- Recommendations ---
    var recs = [];
    if (tradeData && tradeData.allAffinities) {
        var tariffs = Number(nation.tariffs) || 0;

        // Check for partners without trade agreements
        var noAgreementPartners = [];
        var embargoPartners = [];
        var bestUntappedPartner = null;
        var bestUntappedAff = 0;
        for (var ai = 0; ai < tradeData.allAffinities.length; ai++) {
            var aEntry = tradeData.allAffinities[ai];
            var bd = aEntry.breakdown;
            if (bd.embargo < 0) {
                embargoPartners.push(aEntry.name);
            } else if (!bd.tradeType && bd.total > 20) {
                noAgreementPartners.push(aEntry);
                if (bd.total > bestUntappedAff) {
                    bestUntappedAff = bd.total;
                    bestUntappedPartner = aEntry;
                }
            }
        }

        // Export-side recommendations
        if (expVol === 0 && expCap > 0) {
            if (bestUntappedPartner) {
                recs.push({icon: '\uD83E\uDD1D', text: 'Sign a trade agreement with ' + bestUntappedPartner.name + ' (affinity: ' + Math.round(bestUntappedAff) + ') to unlock export markets'});
            }
            if (embargoPartners.length > 0) {
                recs.push({icon: '\u26A0\uFE0F', text: 'Active embargoes with ' + embargoPartners.join(', ') + ' are blocking trade — consider lifting them'});
            }
            if (noAgreementPartners.length > 1) {
                recs.push({icon: '\uD83D\uDCDC', text: noAgreementPartners.length + ' nations have no trade agreement with you — FTAs give +25 affinity'});
            }
        }

        // Import-side recommendations
        if (!sector.export_only && impDem > 0 && impVol < impDem * 0.9) {
            if (tariffs > 30) {
                recs.push({icon: '\uD83D\uDCB0', text: 'Lower tariffs (currently ' + Math.round(tariffs) + '%) to make imports cheaper and increase inflow'});
            }
            if (sectorKey === 'fuel_energy') {
                var rail = Number(nation.rail_network) || 0;
                var oilGas = Number(nation.oil_and_gas) || 0;
                if (rail < 40) {
                    recs.push({icon: '\uD83D\uDE82', text: 'Invest in rail infrastructure (' + Math.round(rail) + ') to reduce fuel dependency for transport'});
                }
                if (oilGas < 40) {
                    recs.push({icon: '\u26FD', text: 'Increase domestic oil & gas production (' + Math.round(oilGas) + ') through Energy Ministry funding'});
                }
                var energyGen = Number(nation.energy_generation) || 0;
                if (energyGen < 50) {
                    recs.push({icon: '\u26A1', text: 'Boost energy generation (' + Math.round(energyGen) + ') to reduce reliance on imported fuel'});
                }
            } else if (sectorKey === 'food_agriculture') {
                var arable = Number(nation.arable_land) || 0;
                if (arable < 50) {
                    recs.push({icon: '\uD83C\uDF3E', text: 'Invest in agricultural development (Arable Land: ' + Math.round(arable) + ') to reduce food import dependency'});
                }
            } else if (sectorKey === 'grains_staples') {
                var arable = Number(nation.arable_land) || 0;
                if (arable < 50) recs.push({icon: '\uD83C\uDF3E', text: 'Increase arable land ('+Math.round(arable)+') to boost grain production'});
                recs.push({icon: '\uD83D\uDCCA', text: 'Shift arable land allocation toward grains to improve food security'});
            } else if (sectorKey === 'livestock_dairy') {
                recs.push({icon: '\uD83D\uDCCA', text: 'Increase livestock land allocation or invest in pastoral infrastructure'});
            } else if (sectorKey === 'fruits_vegetables') {
                var rail = Number(nation.rail_network) || 0;
                var infra = Number(nation.physical_infrastructure) || 0;
                if (rail < 40) recs.push({icon: '\uD83D\uDE82', text: 'Rail network ('+Math.round(rail)+') below cold-chain threshold — spoilage is destroying supply'});
                if (infra < 35) recs.push({icon: '\uD83C\uDFD7\uFE0F', text: 'Physical infrastructure ('+Math.round(infra)+') too weak for perishable distribution'});
                recs.push({icon: '\uD83C\uDF3F', text: 'Improve logistics infrastructure to reduce spoilage before increasing production'});
            } else if (sectorKey === 'cash_crops') {
                recs.push({icon: '\u26A0\uFE0F', text: 'Cash crop imports have minimal food security value — consider reallocating land to staples'});
            } else if (sectorKey === 'minerals') {
                recs.push({icon: '\u26CF\uFE0F', text: 'Develop domestic mining capacity to reduce mineral import needs'});
            } else if (sectorKey === 'manufactured_goods') {
                var manuf = Number(nation.manufacturing_output) || 0;
                if (manuf < 50) {
                    recs.push({icon: '\uD83C\uDFED', text: 'Grow domestic manufacturing (' + Math.round(manuf) + ') to reduce dependence on imported goods'});
                }
            }
        }

        // Price-based recommendations
        if (priceMod > 1.3 && expCap > 0) {
            recs.push({icon: '\uD83D\uDCC8', text: 'Global prices are high (' + priceMod.toFixed(2) + 'x) — good time to increase exports in this sector'});
        } else if (priceMod < 0.7 && impDem > 0) {
            recs.push({icon: '\uD83D\uDCC9', text: 'Global oversupply (' + priceMod.toFixed(2) + 'x) — cheap imports available, consider stockpiling'});
        }
    }

    if (recs.length > 0) {
        h += '<div style="padding:8px 16px 12px;">';
        h += '<div style="font-size:0.7rem;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;letter-spacing:1px;">Recommendations</div>';
        for (var ri = 0; ri < recs.length; ri++) {
            h += '<div style="font-size:0.8rem;color:var(--text-primary);margin-bottom:6px;padding:6px 10px;background:var(--bg-hover);border-radius:3px;">';
            h += recs[ri].icon + ' ' + escapeHtml(recs[ri].text);
            h += '</div>';
        }
        h += '</div>';
    }

    h += '</div>';
    return h;
}

function renderSectorDrivers(nation, sector) {

function renderImportDrivers(nation, sector) {
    if (sector.export_only) return '';
    var drivers = TRADE_IMPORT_DRIVERS[sector.key];
    if (!drivers || drivers.length === 0) return '';

    var h = '<div class="econ-section">';
    h += '<div class="econ-section-header">IMPORT DRIVERS</div>';

        h += '<div class="econ-section-subtitle">' + escapeHtml(TRADE_IMPORT_HINTS[sector.key]) + '</div>';
    }

    h += '<div class="sector-drivers">';
    for (var i = 0; i < drivers.length; i++) {
        var d = drivers[i];
        var val = Number(nation[d.key]) || 0;
        var stPct = Math.min(100, Math.max(0, Math.round(val)));

        // For inverted drivers: low value = high import pressure (red=driving imports)
        // For normal drivers: high value = high import pressure
        var barColor, stColor;
        if (d.inverted) {
            // Low value drives imports: low=red (high demand), high=green (self-sufficient)
            barColor = stPct >= 70 ? '#5cb85c' : stPct >= 40 ? '#888' : '#d9534f';
            stColor = stPct >= 70 ? '#5cb85c' : stPct >= 40 ? '#f0efe6' : '#d9534f';
        } else {
            // High value drives imports: high=red (consuming more), low=green (low demand)
            barColor = stPct <= 30 ? '#5cb85c' : stPct <= 60 ? '#888' : '#d9534f';
            stColor = stPct <= 30 ? '#5cb85c' : stPct <= 60 ? '#f0efe6' : '#d9534f';
        }

        var label = formatStatLabel(d.key);
        var tag = d.inverted ? ' (low = more imports)' : ' (high = more imports)';

        h += '<div class="sector-driver-row">';
        h += '<div class="sector-driver-label">' + escapeHtml(label) + '</div>';
        h += '<div class="sector-driver-track">';
        h += '<div class="sector-driver-fill" style="width:' + stPct + '%;background:' + barColor + '"></div>';
        h += '</div>';
        h += '<div class="sector-driver-value" style="color:' + stColor + '">' + stPct + '</div>';

        var trendHtml = getTrendArrow(d.key, val, d.inverted);
        h += '<div class="sector-driver-trend">' + trendHtml + '</div>';
        h += '</div>';
    }

    h += '</div>';
    h += '</div>';
    return h;
}

function renderSectorPartners(sectorKey, sector) {
    if (!tradeData || !tradeData.partners) return '';

    var exportPartners = [];
    var importPartners = [];
    var partners = tradeData.partners;
    var partnerIds = Object.keys(partners);

    for (var i = 0; i < partnerIds.length; i++) {
        var pid = partnerIds[i];
        var p = partners[pid];
        var expAmt = p.exportsTo[sectorKey] || 0;
        var impAmt = p.importsFrom[sectorKey] || 0;
        if (expAmt > 0) exportPartners.push({ name: p.name, amount: expAmt, affinity: p.affinity });
        if (impAmt > 0) importPartners.push({ name: p.name, amount: impAmt, affinity: p.affinity });
    }

    exportPartners.sort(function(a, b) { return b.amount - a.amount; });
    importPartners.sort(function(a, b) { return b.amount - a.amount; });

    if (exportPartners.length === 0 && importPartners.length === 0) return '';

    var h = '<div class="econ-section">';
    h += '<div class="econ-section-header">TRADE PARTNERS — ' + escapeHtml(sector.label).toUpperCase() + '</div>';
    h += '<div class="sector-partners-grid">';

    // Export destinations
    h += '<div class="sector-partner-col">';
    h += '<div class="sector-partner-col-header">Export Destinations</div>';
    if (exportPartners.length === 0) {
        h += '<div class="sector-partner-empty">No exports this tick</div>';
    } else {
        var maxExp = exportPartners[0].amount;
        for (var i = 0; i < exportPartners.length; i++) {
            var ep = exportPartners[i];
            var barW = maxExp > 0 ? (ep.amount / maxExp * 100) : 0;
            h += '<div class="sector-partner-row">';
            h += '<div class="sector-partner-name"' + (NATION_COLORS[ep.name] ? ' style="color:' + NATION_COLORS[ep.name] + '"' : '') + '>' + escapeHtml(ep.name) + '</div>';
            h += '<div class="sector-partner-bar-wrap">';
            h += '<div class="sector-partner-bar" style="width:' + barW.toFixed(1) + '%;background:#5cb85c"></div>';
            h += '</div>';
            h += '<div class="sector-partner-amount" style="color:#5cb85c">' + formatBudgetCurrency(ep.amount) + '</div>';
            h += '</div>';
        }
    }
    h += '</div>';

    // Import sources (only if not export-only)
    if (!sector.export_only) {
        h += '<div class="sector-partner-col">';
        h += '<div class="sector-partner-col-header">Import Sources</div>';
        if (importPartners.length === 0) {
            h += '<div class="sector-partner-empty">No imports this tick</div>';
        } else {
            var maxImp = importPartners[0].amount;
            for (var i = 0; i < importPartners.length; i++) {
                var ip = importPartners[i];
                var barW = maxImp > 0 ? (ip.amount / maxImp * 100) : 0;
                h += '<div class="sector-partner-row">';
                h += '<div class="sector-partner-name"' + (NATION_COLORS[ip.name] ? ' style="color:' + NATION_COLORS[ip.name] + '"' : '') + '>' + escapeHtml(ip.name) + '</div>';
                h += '<div class="sector-partner-bar-wrap">';
                h += '<div class="sector-partner-bar" style="width:' + barW.toFixed(1) + '%;background:#d9534f"></div>';
                h += '</div>';
                h += '<div class="sector-partner-amount" style="color:#d9534f">' + formatBudgetCurrency(ip.amount) + '</div>';
                h += '</div>';
            }
        }
        h += '</div>';
    }

    h += '</div>'; // .sector-partners-grid
    h += '</div>';
    return h;
}

    var dampener = (1 - tariffRate / 200) * 100;
    h += renderOverviewCard('Import Dampener', dampener.toFixed(0) + '%', 'neutral', 'of full demand');

        h += '<div style="font-size:11px;color:var(--text-muted,#9e9a92);line-height:1.5;">Tariffs above 25% degrade diplomatic relations with <strong>all nations</strong> by <strong>-0.5/tick</strong> (floor: 10). Current rate: <strong>' + tariffRate.toFixed(0) + '%</strong>. Reduce tariffs below 25% to stop the penalty.</div>';

function gatherTariffSimData(nation) {
    var currentRate = Number(nation.tariffs) || 0;
    var eff = Number(nation.efficiency) || 50;
    var corr = Number(nation.corruption) || 50;
    var collectionRate = 0.35 + ((eff + (100 - corr)) / 200) * 0.65;
    var currentDampener = 1 - (currentRate / 200);

    var sectorImports = [];
    var totalCurrentImports = 0;
    if (tradeData && tradeData.flows) {
        for (var i = 0; i < TRADE_SECTORS.length; i++) {
            var s = TRADE_SECTORS[i];
            if (s.export_only) continue;
            var flow = tradeData.flows[s.key];
            var impVol = flow ? Number(flow.import_volume) || 0 : 0;
            if (impVol > 0) {
                sectorImports.push({ key: s.key, label: s.label, imports: impVol });
                totalCurrentImports += impVol;
            }
        }
    }

    var currentTariffRev = 0;
    if (tradeData && tradeData.summary) {
        currentTariffRev = Number(tradeData.summary.tariff_revenue) || 0;
    }

    return {
        currentRate: currentRate,
        collectionRate: collectionRate,
        currentDampener: currentDampener,
        sectorImports: sectorImports,
        totalCurrentImports: totalCurrentImports,
        currentTariffRev: currentTariffRev
    };
}

function renderTariffSimulator(nation) {
    var d = gatherTariffSimData(nation);
    if (d.totalCurrentImports <= 0) {
        var h = '<div class="econ-section">';
        h += '<div class="econ-section-header">TARIFF IMPACT SIMULATOR</div>';
        h += '<div class="econ-placeholder">No import data yet. Projections will appear once trade flows are established.</div>';
        h += '</div>';
        return h;
    }

    var h = '<div class="econ-section">';
    h += '<div class="econ-section-header">TARIFF IMPACT SIMULATOR</div>';
    h += '<div class="econ-section-subtitle">Drag to project how a tariff change would affect imports and revenue.</div>';

    // Slider
    h += '<div class="tsim-slider-row">';
    h += '<div class="tsim-slider-label">CURRENT: <strong>' + d.currentRate.toFixed(0) + '%</strong></div>';
    h += '<div class="tsim-slider-wrap">';
    h += '<div class="tsim-slider-fill" id="tsim-fill" style="width:' + d.currentRate + '%"></div>';
    h += '<input type="range" class="tsim-slider" id="tsim-range" min="0" max="100" step="1" value="' + d.currentRate.toFixed(0) + '">';
    h += '<div class="tsim-slider-labels"><span>0%</span><span>50%</span><span>100%</span></div>';
    h += '</div>';
    h += '<div class="tsim-sim-label" id="tsim-sim-label">SIMULATED: <strong>' + d.currentRate.toFixed(0) + '%</strong></div>';
    h += '</div>';

    // Projection cards
    h += '<div class="tsim-projections" id="tsim-projections">';
    var gdpCap = Number(nation.gdp ?? nation.GDP ?? 0) * 0.05;
    h += renderTariffProjections(d.currentRate, d.currentRate, d.currentDampener, d.totalCurrentImports, d.sectorImports, d.collectionRate, d.currentTariffRev, gdpCap);
    h += '</div>';

    h += '</div>';
    return h;
}

function renderTariffProjections(currentRate, simRate, currentDampener, totalCurrentImports, sectorImports, collectionRate, currentTariffRev, gdpCap) {
    var simDampener = 1 - (simRate / 200);
    var dampenerRatio = currentDampener > 0 ? simDampener / currentDampener : 1;

    var projectedTotalImports = Math.round(totalCurrentImports * dampenerRatio);
    var projectedTariffRev = Math.round(projectedTotalImports * (simRate / 100) * collectionRate);
    // Cap at 5% of GDP — realistic range for high-tariff nations
    if (gdpCap > 0) {
        projectedTariffRev = Math.min(projectedTariffRev, Math.round(gdpCap));
        currentTariffRev = Math.min(currentTariffRev, Math.round(gdpCap));
    }

    var importDelta = projectedTotalImports - totalCurrentImports;
    var revDelta = projectedTariffRev - currentTariffRev;
    var isChanged = Math.round(simRate) !== Math.round(currentRate);

    var h = '';

    // Summary cards
    h += '<div class="econ-cards-row econ-cards-4">';

    // Projected imports (neutral color — more/fewer imports isn't inherently good or bad)
    var impDeltaStr = importDelta !== 0 ? (importDelta > 0 ? '+' : '') + formatBudgetCurrency(importDelta) : '—';
    h += renderOverviewCard('Projected Imports', formatDualPeriod(projectedTotalImports), 'neutral', isChanged ? impDeltaStr : 'No change');

    // Projected tariff revenue
    var revColor = revDelta > 0 ? 'surplus' : revDelta < 0 ? 'deficit' : 'neutral';
    var revDeltaStr = revDelta !== 0 ? (revDelta > 0 ? '+' : '') + formatBudgetCurrency(revDelta) : '—';
    h += renderOverviewCard('Projected Revenue', formatDualPeriod(projectedTariffRev), revColor, isChanged ? revDeltaStr : 'No change');

    // Import dampener
    h += renderOverviewCard('Import Dampener', (simDampener * 100).toFixed(0) + '%', 'neutral', 'of full demand');

    var netDirection = revDelta > 0 ? 'More revenue' : revDelta < 0 ? 'Less revenue' : 'No change';
    var tradeDirection = importDelta > 0 ? ', more imports' : importDelta < 0 ? ', fewer imports' : '';
    var netSign = revDelta >= 0 ? '+' : '';
    h += renderOverviewCard('Net Effect', isChanged ? formatDualPeriod(revDelta, netSign) : '—', revColor, isChanged ? netDirection + tradeDirection : 'Drag the slider');

    h += '</div>';

    // Per-sector breakdown (only if changed)
    if (isChanged && sectorImports.length > 0) {
        h += '<div class="tsim-sector-table">';
        h += '<div class="tsim-sector-header">';
        h += '<div class="tsim-sector-cell tsim-sector-name">SECTOR</div>';
        h += '<div class="tsim-sector-cell tsim-sector-num">CURRENT IMPORTS</div>';
        h += '<div class="tsim-sector-cell tsim-sector-num">PROJECTED IMPORTS</div>';
        h += '<div class="tsim-sector-cell tsim-sector-num">CHANGE</div>';
        h += '</div>';

        for (var i = 0; i < sectorImports.length; i++) {
            var s = sectorImports[i];
            var projImp = Math.round(s.imports * dampenerRatio);
            var delta = projImp - s.imports;
            var deltaColor = delta > 0 ? '#5cb85c' : delta < 0 ? '#d9534f' : '#888';
            var deltaSign = delta > 0 ? '+' : '';

            h += '<div class="tsim-sector-row">';
            h += '<div class="tsim-sector-cell tsim-sector-name">' + escapeHtml(s.label) + '</div>';
            h += '<div class="tsim-sector-cell tsim-sector-num">' + formatBudgetCurrency(s.imports) + '</div>';
            h += '<div class="tsim-sector-cell tsim-sector-num">' + formatBudgetCurrency(projImp) + '</div>';
            h += '<div class="tsim-sector-cell tsim-sector-num" style="color:' + deltaColor + '">' + deltaSign + formatBudgetCurrency(delta) + '</div>';
            h += '</div>';
        }

        h += '</div>';
    }

    return h;
}

function renderTariffAgreementsSection(nation) {
    if (!tradeAgreements || tradeAgreements.length === 0) {
        var h = '<div class="econ-section">';
        h += '<div class="econ-section-header">TRADE AGREEMENTS</div>';
        h += '<div class="econ-placeholder">No active trade agreements. Negotiate FTAs or PTAs through the Diplomacy page.</div>';
        h += '</div>';
        return h;
    }

    // Build name lookup
    var nameMap = {};
    if (allNations) {
        for (var i = 0; i < allNations.length; i++) {
            nameMap[allNations[i].id] = allNations[i].name;
        }
    }

    var h = '<div class="econ-section">';
    h += '<div class="econ-section-header">TRADE AGREEMENTS (' + tradeAgreements.length + ')</div>';
    h += '<div class="econ-section-subtitle">Active bilateral agreements affecting your tariff rates and trade flows.</div>';
    h += '<div class="tariff-agreements-grid">';

    for (var i = 0; i < tradeAgreements.length; i++) {
        var ag = tradeAgreements[i];
        var partnerId = ag.nation_a_id === nation.id ? ag.nation_b_id : ag.nation_a_id;
        var partnerName = nameMap[partnerId] || 'Unknown';
        var typeInfo = TRADE_AGREEMENT_TYPES[ag.agreement_type] || {};
        var typeBadge = typeInfo.shortLabel || (ag.agreement_type || '').toUpperCase();

        // Duration info
        var durationText = 'Permanent';
        if (ag.duration_type === 'fixed' && ag.expires_at_tick) {
            var ticksLeft = ag.expires_at_tick - currentTick;
            if (ticksLeft > 0) {
                durationText = ticksLeft + ' ticks remaining';
            } else {
                durationText = 'Expiring';
            }
            if (ag.auto_renew) durationText += ' (auto-renew)';
        }

        // Border color by type
        var borderColor = ag.agreement_type === 'fta' ? '#5cb85c' : ag.agreement_type === 'pta' ? '#5b9bd5' : ag.agreement_type === 'goods_trade' ? '#c88444' : '#888';

        h += '<div class="tariff-agreement-card" style="border-left-color:' + borderColor + '">';
        h += '<div class="ta-card-header">';
        h += '<div class="ta-card-name">' + escapeHtml(ag.agreement_name || typeInfo.label || 'Agreement') + '</div>';
        h += '<div class="ta-card-badge" style="background:' + borderColor + '">' + escapeHtml(typeBadge) + '</div>';
        h += '</div>';
        h += '<div class="ta-card-partner">with <strong>' + escapeHtml(partnerName) + '</strong></div>';
        h += '<div class="ta-card-duration">' + escapeHtml(durationText) + '</div>';

        // Parse articles for tariff details
        var articles = ag.articles || [];
        var tariffArticles = [];
        var exemptionArticles = [];
        var supplyArticles = [];
        var subsidyArticles = [];

        for (var j = 0; j < articles.length; j++) {
            var art = articles[j];
            if (art.type === 'tariff_reduction') tariffArticles.push(art);
            else if (art.type === 'sector_exemption') exemptionArticles.push(art);
            else if (art.type === 'supply_commitment') supplyArticles.push(art);
            else if (art.type === 'subsidized_sector') subsidyArticles.push(art);
        }

        // FTA: show exemptions
        if (ag.agreement_type === 'fta') {
            h += '<div class="ta-card-detail ta-card-effect">All tariffs eliminated between parties</div>';
            if (exemptionArticles.length > 0) {
                h += '<div class="ta-card-exemptions">';
                h += '<span class="ta-card-detail-label">EXEMPTIONS:</span> ';
                var exemptNames = [];
                for (var j = 0; j < exemptionArticles.length; j++) {
                    var d = exemptionArticles[j].data || {};
                    exemptNames.push(escapeHtml(getSectorLabel(d.sector)));
                }
                h += exemptNames.join(', ');
                h += '</div>';
            }
        }

        // PTA: show per-sector reductions
        if (ag.agreement_type === 'pta' && tariffArticles.length > 0) {
            h += '<div class="ta-card-reductions">';
            for (var j = 0; j < tariffArticles.length; j++) {
                var d = tariffArticles[j].data || {};
                var sectorName = getSectorLabel(d.sector);
                var direction = d.direction === 'mutual' ? 'Mutual' : d.direction === 'your_exports' ? 'Your exports' : 'Their exports';
                var reduction = (d.reduction_pct || 0) + '%';
                h += '<div class="ta-reduction-line">';
                h += '<span class="ta-reduction-sector">' + escapeHtml(sectorName) + '</span>';
                h += '<span class="ta-reduction-dir">' + escapeHtml(direction) + '</span>';
                h += '<span class="ta-reduction-pct">&minus;' + escapeHtml(reduction) + '</span>';
                h += '</div>';
            }
            h += '</div>';
        }

        // RSC: show supply commitment
        if (ag.agreement_type === 'resource_supply' && supplyArticles.length > 0) {
            var d = supplyArticles[0].data || {};
            var sectorName = getSectorLabel(d.sector);
            var dir = d.direction === 'we_buy' ? 'We buy from' : 'We sell to';
            h += '<div class="ta-card-detail">' + escapeHtml(dir) + ' ' + escapeHtml(partnerName) + ': ' + escapeHtml(sectorName) + ' @ ' + (d.commitment_pct || 0) + '% commitment</div>';
        }

        // ES: show subsidy
        if (ag.agreement_type === 'export_subsidy' && subsidyArticles.length > 0) {
            var d = subsidyArticles[0].data || {};
            var sectorName = getSectorLabel(d.sector);
            h += '<div class="ta-card-detail">Subsidizing <strong>' + escapeHtml(sectorName) + '</strong> exports @ ' + (d.subsidy_pct || 0) + '%</div>';
        }

        h += '</div>';
    }

    h += '</div>';
    h += '</div>';
    return h;
}

function getSectorLabel(sectorKey) {
    for (var i = 0; i < TRADEABLE_SECTORS.length; i++) {
        if (TRADEABLE_SECTORS[i].key === sectorKey) return TRADEABLE_SECTORS[i].label;
    }
    for (var i = 0; i < TRADE_SECTORS.length; i++) {
        if (TRADE_SECTORS[i].key === sectorKey) return TRADE_SECTORS[i].label;
    }
    return sectorKey || 'All Sectors';
}

function renderTariffMatrix(nation) {
    if (!allNations || allNations.length === 0) return '';

    // Sort nations: current nation first, then alphabetically
    var sorted = allNations.slice().sort(function(a, b) {
        if (a.id === nation.id) return -1;
        if (b.id === nation.id) return 1;
        return (a.name || '').localeCompare(b.name || '');
    });

    // Build agreement lookup: agreementWith[nationId] = best agreement (most impactful)
    // Priority: FTA > PTA > UTR > others
    var agreementWith = {};
    var AGREEMENT_PRIORITY = { free_trade: 4, fta: 4, pta: 3, preferential_tariff: 3, unilateral_tariff_reduction: 2 };
    if (tradeAgreements) {
        for (var i = 0; i < tradeAgreements.length; i++) {
            var ag = tradeAgreements[i];
            if (ag.status !== 'active') continue;
            var partnerId = ag.nation_a_id === nation.id ? ag.nation_b_id : ag.nation_a_id;
            var newPri = AGREEMENT_PRIORITY[ag.agreement_type] || 1;
            var existPri = agreementWith[partnerId] ? (AGREEMENT_PRIORITY[agreementWith[partnerId].agreement_type] || 1) : 0;
            if (newPri > existPri) agreementWith[partnerId] = ag;
        }
    }

    var h = '<div class="econ-section">';
    h += '<div class="econ-section-header">TARIFF MATRIX</div>';
    h += '<div class="econ-section-subtitle">Tariff rates across all nations. Agreements may override effective rates between specific partners.</div>';

    h += '<div class="tariff-matrix">';

    // Header row
    h += '<div class="tm-header">';
    h += '<div class="tm-cell tm-nation-name">NATION</div>';
    h += '<div class="tm-cell tm-rate">TARIFF RATE</div>';
    h += '<div class="tm-cell tm-dampener">DAMPENER</div>';
    h += '<div class="tm-cell tm-agreement">AGREEMENT</div>';
    h += '<div class="tm-cell tm-effective">EFFECTIVE RATE</div>';
    h += '</div>';

    for (var i = 0; i < sorted.length; i++) {
        var n = sorted[i];
        var isYou = n.id === nation.id;
        var rate = Number(n.tariffs) || 0;
        var dampener = (1 - rate / 200) * 100;

        // Determine agreement status with this nation
        var ag = isYou ? null : agreementWith[n.id];
        var agLabel = '—';
        var effectiveRate = rate;
        var agBadgeColor = '#3a3930';

        if (ag) {
            var typeInfo = TRADE_AGREEMENT_TYPES[ag.agreement_type] || {};
            agLabel = typeInfo.shortLabel || (ag.agreement_type || '').toUpperCase();

            if (ag.agreement_type === 'fta') {
                // FTA: tariffs eliminated (check exemptions)
                var articles = ag.articles || [];
                var exemptions = articles.filter(function(a) { return a.type === 'sector_exemption'; });
                if (exemptions.length > 0) {
                    effectiveRate = 0;
                    agLabel += '*'; // asterisk for partial
                } else {
                    effectiveRate = 0;
                }
                agBadgeColor = '#5cb85c';
            } else if (ag.agreement_type === 'pta') {
                // PTA: partial reductions — approximate as weighted average
                var articles = ag.articles || [];
                var reductions = articles.filter(function(a) { return a.type === 'tariff_reduction'; });
                if (reductions.length > 0) {
                    var totalReduction = 0;
                    for (var j = 0; j < reductions.length; j++) {
                        totalReduction += Number(reductions[j].data.reduction_pct) || 0;
                    }
                    var avgReduction = totalReduction / reductions.length;
                    effectiveRate = Math.max(0, rate * (1 - avgReduction / 100));
                }
                agBadgeColor = '#5b9bd5';
            } else if (ag.agreement_type === 'unilateral_tariff_reduction') {
                // UTR: only the issuer gets reduced tariffs — the target sees no change
                var articles = ag.articles || [];
                var utrArt = articles.find(function(a) { return a.type === 'tariff_reduction'; });
                var utrPct = utrArt ? Number(utrArt.data?.reduction_pct || 0) : 50;
                var issuerId = utrArt && utrArt.data ? utrArt.data.issuer_nation_id : null;
                if (issuerId === nation.id) {
                    // We issued this UTR — apply reduction to OUR base rate
                    var yourRate = Number(nation.tariffs) || 0;
                    effectiveRate = Math.max(0, yourRate * (1 - utrPct / 100));
                    agLabel = 'UTR ' + utrPct + '%';
                    agBadgeColor = '#5cb85c';
                } else {
                    // We are the target — this UTR doesn't affect OUR tariffs, show as no agreement
                    ag = null;
                }
            } else if (ag.agreement_type === 'resource_supply') {
                agBadgeColor = '#d48a3c';
            }
        }

        var rateColor = rate <= 20 ? '#5cb85c' : rate <= 50 ? '#f0efe6' : '#d9534f';
        var effColor = effectiveRate <= 5 ? '#5cb85c' : effectiveRate <= 20 ? '#f0efe6' : effectiveRate <= 50 ? '#888' : '#d9534f';

        h += '<div class="tm-row' + (isYou ? ' tm-highlight' : '') + '">';
        h += '<div class="tm-cell tm-nation-name"' + (NATION_COLORS[n.name] ? ' style="color:' + NATION_COLORS[n.name] + '"' : '') + '>' + escapeHtml(n.name) + (isYou ? ' <span class="tm-you">(YOU)</span>' : '') + '</div>';
        h += '<div class="tm-cell tm-rate" style="color:' + rateColor + '">' + rate.toFixed(0) + '%</div>';
        h += '<div class="tm-cell tm-dampener">' + dampener.toFixed(0) + '%</div>';

        if (isYou) {
            h += '<div class="tm-cell tm-agreement">—</div>';
            h += '<div class="tm-cell tm-effective">—</div>';
        } else if (ag) {
            h += '<div class="tm-cell tm-agreement"><span class="tm-ag-badge" style="background:' + agBadgeColor + '">' + escapeHtml(agLabel) + '</span></div>';
            h += '<div class="tm-cell tm-effective" style="color:' + effColor + '">' + effectiveRate.toFixed(0) + '%</div>';
        } else {
            h += '<div class="tm-cell tm-agreement"><span class="tm-no-agreement">NONE</span></div>';
            h += '<div class="tm-cell tm-effective" style="color:' + rateColor + '">' + rate.toFixed(0) + '%</div>';
        }
        h += '</div>';
    }

    h += '</div>';
    h += '</div>';
    return h;
}

function tradeTrendHtml(current, previous, inverted) {
    if (previous === null || previous === undefined) return '';
    if (previous === 0 && current === 0) return '';
    if (previous === 0) {
        return '<span class="budget-trend trend-up">&#9650; New</span>';
    }
    var pctChange = ((current - previous) / Math.abs(previous)) * 100;
    if (Math.abs(pctChange) < 0.1) {
        return '<span class="budget-trend trend-neutral">&mdash; 0.0%</span>';
    }
    // For inverted stats (lower is better), swap the trend color: increase is bad, decrease is good
    var upClass = inverted ? 'trend-down' : 'trend-up';
    var downClass = inverted ? 'trend-up' : 'trend-down';
    if (pctChange > 0) {
        return '<span class="budget-trend ' + upClass + '">&#9650; +' + pctChange.toFixed(1) + '%</span>';
    }
    return '<span class="budget-trend ' + downClass + '">&#9660; ' + Math.abs(pctChange).toFixed(1) + '%</span>';
}

// ==================== BUDGET HELPERS ====================
function formatBudgetCurrency(val) {
    if (val == null) return '$0';
    val = Number(val);
    var sign = val < 0 ? '-' : '';
    var abs = Math.abs(val);
    if (abs >= 1e12) return sign + '$' + (abs / 1e12).toFixed(1) + ' Trillion';
    if (abs >= 1e9)  return sign + '$' + (abs / 1e9).toFixed(1) + ' Billion';
    if (abs >= 1e6)  return sign + '$' + (abs / 1e6).toFixed(1) + ' Million';
    if (abs >= 1e3)  return sign + '$' + (abs / 1e3).toFixed(1) + 'K';
    return sign + '$' + Math.round(abs).toLocaleString();
}

/**
 * Dual-period display: shows annual value (large) with monthly beneath (small).
 * @param {number} annualValue - The yearly dollar amount.
 * @param {string} [prefix] - Optional prefix like '+' for positive signed values.
 */
function formatDualPeriod(annualValue, prefix) {
    prefix = prefix || '';
    var monthly = annualValue / 12;
    return '<span class="dual-period">' +
        '<span class="dual-period-yr">' + prefix + formatBudgetCurrency(annualValue) + '<span class="dual-period-label"> /yr</span></span>' +
        '<span class="dual-period-mo">' + prefix + formatBudgetCurrency(monthly) + '<span class="dual-period-label"> /mo</span></span>' +
        '</span>';
}

function formatTradeVolume(val, sectorKey) {
    if (val == null) return '0';
    var vol = formatSectorVolume(Number(val), sectorKey);
    if (vol) return vol;
    // Sectors without display units (technology, services_finance): currency
    return formatBudgetCurrency(val);
}

function budgetTrendHtml(current, previous, prevYear) {
    if (previous === null || previous === undefined) return '';
    if (previous === 0 && current === 0) return '';
    if (previous === 0) {
        return '<span class="budget-trend trend-up">&#9650; New</span>';
    }
    var pctChange = ((current - previous) / Math.abs(previous)) * 100;
    if (Math.abs(pctChange) < 0.1) {
        return '<span class="budget-trend trend-neutral">&mdash; 0.0% since Year ' + prevYear + '</span>';
    }
    if (pctChange > 0) {
        return '<span class="budget-trend trend-up">&#9650; ' + pctChange.toFixed(1) + '% since Year ' + prevYear + '</span>';
    }
    return '<span class="budget-trend trend-down">&#9660; ' + Math.abs(pctChange).toFixed(1) + '% since Year ' + prevYear + '</span>';
}
