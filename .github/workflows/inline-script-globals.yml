name: Inline Script Globals

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-inline-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run lint:inline-scripts
