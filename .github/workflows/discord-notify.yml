name: Discord Changelog

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Build a clean list of commit messages (one per line, bulleted)
          COMMITS=$(echo '${{ toJSON(github.event.commits) }}' | jq -r '.[].message' | while IFS= read -r msg; do
            # Take only the first line of each commit message
            first_line=$(echo "$msg" | head -1)
            echo "- ${first_line}"
          done)

          # Use the repo name and short SHA as a simple header
          REPO="${{ github.event.repository.name }}"
          BRANCH="${{ github.ref_name }}"

          MESSAGE="**${REPO}** — pushed to \`${BRANCH}\`
${COMMITS}"

          # Send plain text (no embed) to Discord
          PAYLOAD=$(jq -n --arg content "$MESSAGE" '{"content": $content}')

          curl -s -H "Content-Type: application/json" \
               -d "$PAYLOAD" \
               "$DISCORD_WEBHOOK"
