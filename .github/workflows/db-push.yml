name: Apply Supabase migrations

# Runs `supabase db push` so SQL files in supabase/migrations/ reach
# the live database on the same push that publishes the frontend.
# Closes the recurring "migration sits in the repo but never reaches
# Supabase" gap that's bitten this project several times (column-drop
# crash on bootstrap, modifier-table RLS, corp_trade 5% vs 1%).
#
# Triggers on:
#   • push to main, but ONLY when supabase/migrations/** changed —
#     skips runs on doc / frontend-only commits.
#   • workflow_dispatch — manual button on the Actions tab for
#     emergency re-apply / first-run baseline checks.
#
# Concurrency lock so two near-simultaneous pushes can't race the
# same migration apply; the in-flight run finishes before the next
# starts.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/db-push.yml'
  workflow_dispatch:

concurrency:
  group: supabase-db-push
  cancel-in-progress: false

# DO_NOT_TRACK disables the CLI's PostHog telemetry client entirely.
# Without it, `supabase link` can exit 1 AFTER succeeding ("Finished
# supabase link." then "Timeout while shutting down PostHog") when the
# telemetry flush hangs on the runner — failing the whole job over an
# analytics ping.
env:
  DO_NOT_TRACK: "1"

jobs:
  db-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned (matching deploy.yml) instead of `latest`: a floating
          # version means every workflow run gambles on this week's CLI
          # release — the PostHog shutdown-timeout exit-1 arrived that
          # way. Bump deliberately.
          version: 2.101.0

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
                        --password    "${{ secrets.SUPABASE_DB_PASSWORD }}"

      # Two migrations sharing a version prefix is fatal but reads as a
      # baffling "duplicate key value violates unique constraint
      # schema_migrations_pkey" at push time: the first file records the
      # version, the second can never record itself, and every
      # subsequent run fails the same way. It has happened twice now
      # (parallel branches both taking the "next" number — 20270776 was
      # corp_tax_filing AND embassy_events). Fail fast with a readable
      # message instead.
      - name: Guard against duplicate migration versions
        run: |
          dups=$(ls supabase/migrations/*.sql | sed 's|.*/||; s|_.*||' | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "::error::Duplicate migration version number(s): $dups"
            echo "Two files in supabase/migrations/ share a version prefix."
            echo "Rename one of them to an unused number — the migration"
            echo "history table keys on the version, so duplicates can"
            echo "never both be recorded."
            exit 1
          fi

      - name: Show pending migrations (dry run)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase migration list --linked

      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # --include-all lets supabase apply migrations whose timestamp
        # is earlier than the latest already-recorded one. We need it
        # because the project has been back-filling sql-only migrations
        # that pre-date prod's most recent ledger entry — without the
        # flag, supabase exits 1 with "Found local migration files to
        # be inserted before the last migration on remote database".
        # All our migrations are idempotent (IF EXISTS / IF NOT EXISTS
        # / CREATE OR REPLACE) so re-running an earlier-dated file is
        # safe.
        run: |
          supabase db push --linked --include-all --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
