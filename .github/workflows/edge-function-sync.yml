name: Edge Function Sync

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-edge-function-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:edge-function-sync
