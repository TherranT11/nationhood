name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site + domain binding
        run: |
          mkdir -p dist
          cp index.html CNAME .nojekyll site.css *.js dist/   # all root modules — never hand-maintain this list (terms.js/formation.js/negotiations.js were missing before)
          cp -r assets home login signup startup nation-select party-creation play tutorial adminsetup dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
