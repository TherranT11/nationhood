name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# Build and deploy are SEPARATE jobs on purpose. Uploading the Pages artifact lives only in
# `build`; `deploy` just publishes it. So a "Re-run failed jobs" after a flaky publish re-runs
# `deploy` alone and never uploads a second artifact — which is what triggers the
# "Multiple artifacts named github-pages were unexpectedly found" error in a single-job setup.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Build the bundled site with Vite. Every page's first-party modules + the
      # Supabase client are bundled/minified/hashed into dist/. Pass-through statics
      # (theme.js, assets/, CNAME, .nojekyll) come from public/. No hand-maintained
      # file list — vite.config.js globs every index.html as a page entry.
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
