<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bills | Nationhood Alpha</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/laws.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="top-bar"></div>
<div id="content-area">
    <div class="loading-container"><div class="loading-spinner"></div><div>Loading bills...</div></div>
</div>

<!-- Draft Bill Modal -->
<div class="modal-overlay" id="draft-modal">
    <div class="modal-content" id="draft-modal-content">
        <div class="modal-header">
            <div class="modal-title" id="draft-modal-title">Draft New Bill</div>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="bill-article">
            <div class="article-label">Article I. Preamble</div>
            <div class="article-text" id="article-preamble">This bill seeks to enact the following provisions.</div>
        </div>
        <div class="draft-articles" id="draft-articles"></div>
        <div class="add-article-section" id="add-article-section" onclick="showAddArticleForm()">
            <span class="add-article-btn-text">+ Add Article</span>
        </div>
        <div class="add-text-article-section" id="add-text-article-section" onclick="showTextArticleForm()">
            <span class="add-text-article-btn-text">+ Add Text Article</span>
        </div>
        <div id="add-article-form" style="display:none;">
            <div class="form-group">
                <label class="form-label">Select Sector</label>
                <select class="form-select" id="sector-select" onchange="onSectorChange()">
                    <option value="">-- Choose a sector --</option>
                </select>
            </div>
            <div class="ideology-hint" id="ideology-hint" style="display:none;">
                Your party's ideology: <strong id="party-ideologies"></strong>
            </div>
            <div class="form-group" id="policy-group" style="display:none;">
                <label class="form-label">Select Policy</label>
                <div class="policy-options" id="policy-options"></div>
            </div>
            <div style="display:flex;gap:8px;margin-top:12px;">
                <button class="btn-cancel" onclick="hideAddArticleForm()">Cancel</button>
                <button class="btn-add" id="add-article-btn" disabled onclick="addArticle()">Add to Bill</button>
            </div>
        </div>
        <div id="add-text-article-form" style="display:none;">
            <div class="form-group">
                <label class="form-label">Article Title</label>
                <input type="text" class="form-input" id="text-article-title" placeholder="e.g., Transitional Provisions">
            </div>
            <div class="form-group">
                <label class="form-label">Article Text</label>
                <textarea class="text-article-input" id="text-article-body" placeholder="Write the full text of this article..."></textarea>
            </div>
            <div style="display:flex;gap:8px;margin-top:12px;">
                <button class="btn-cancel" onclick="hideTextArticleForm()">Cancel</button>
                <button class="btn-add" onclick="addTextArticle()">Add to Bill</button>
            </div>
        </div>
        <div class="bill-name-section" id="bill-name-section" style="display:none;">
            <div class="form-group" style="margin-bottom:0;">
                <label class="form-label" id="bill-name-label">Name Your Bill</label>
                <input type="text" class="form-input" id="bill-name-input" placeholder="e.g., The Religious Harmony Act">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn-submit" id="submit-bill-btn" disabled onclick="submitToCommittee()">Submit to Committee — 2 AP</button>
        </div>
    </div>
</div>

<!-- Committee Add Article Modal -->
<div class="modal-overlay" id="committee-add-modal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title" id="committee-modal-title">Add Article to Bill</div>
            <button class="modal-close" onclick="closeCommitteeAddModal()">&times;</button>
        </div>
        <div class="form-group">
            <label class="form-label">Select Sector</label>
            <select class="form-select" id="committee-sector-select" onchange="onCommitteeSectorChange()">
                <option value="">-- Choose a sector --</option>
            </select>
        </div>
        <div class="ideology-hint" id="committee-ideology-hint" style="display:none;">
            Your party's ideology: <strong id="committee-party-ideologies"></strong>
        </div>
        <div class="form-group" id="committee-policy-group" style="display:none;">
            <label class="form-label">Select Policy</label>
            <div class="policy-options" id="committee-policy-options"></div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeCommitteeAddModal()">Cancel</button>
            <button class="btn-add" id="committee-add-btn" disabled onclick="submitCommitteeArticle()">Add Article</button>
        </div>
    </div>
</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { initPage, qCache, qCacheSet, qCacheBust } from './js/common.js';
import { GAME_CONFIG, initGameConfigForNation, isGovernmentAutocracy, isGovernmentPresidential, loadSeats, detectHeadFaction, fetchActiveCoalition, getCompatiblePolicies, loadFactionIdeology, IDEOLOGY_TO_AXIS, resolveExpiredVotes, deductAP, calculateBillSupport, enactBill, failBill, syncVoteTallies, enactFoundationalBill, formatStatName, MAJOR_SECTORS, adjustBlocApproval, calculateBillDynamicPenalty, calculateIdeologyPenalty, formatMinorSector, signPresidentialBill, vetoPresidentialBill } from './js/game-common.js';
(function () {
    'use strict';
let currentNation = null, currentFaction = null, currentSeats = 0;
let allPartySeats = {}, allParties = [], allPolicies = [];
let activeLaws = [], committeeBills = [], floorBills = [], frozenBills = [], presidentDeskBills = [], recentBills = [];
let lawsIsAutocracy = false, isHeadFaction = false, headFactionId = null;
let isPresidential = false, isPresidentParty = false, presidentFactionId = null;
let isCaretaker = false;
let isNoGovernment = false;
let draftArticles = [], selectedPolicy = null;
let committeeSelectedPolicy = null, currentCommitteeBillId = null;
let pendingPolicyIds = new Set();
let isSubmitting = false;
let termBill = 'Bill', termBills = 'Bills', termDraft = 'Draft Bill', termPropose = 'Propose Bill';
let showingAllLaws = false;
let factionIdeology = null; // Dynamic ideology scores for current player

function _getCompatiblePolicies(sector) {
    const _activePolicyIds = new Set(activeLaws.map(al => al.policy_id));
    return getCompatiblePolicies(sector, allPolicies, currentFaction, lawsIsAutocracy, draftArticles.map(a => a.policy?.id).filter(Boolean), _activePolicyIds);
}

initPage('laws', async (state) => {
    const { nation, faction } = state;
    currentNation = nation;
    currentFaction = faction;
    initGameConfigForNation(nation);
    if (!nation) {
        document.getElementById('content-area').innerHTML = '<div class="placeholder-panel"><div class="ph-icon">📜</div><h3>No Nation Selected</h3><p>Your party is not assigned to a nation yet.</p></div>';
        return;
    }
    lawsIsAutocracy = (nation.government_type === 'Autocracy');
    isPresidential = (nation.government_type === 'Presidential');
    if (lawsIsAutocracy) { termBill = 'Decree'; termBills = 'Decrees'; termDraft = 'Draft Decree'; termPropose = 'Propose Decree'; document.title = 'Decrees | Nationhood Alpha'; }

    // Detect president's party
    if (isPresidential) {
        const { data: activePresident } = await _supabase.from('presidents')
            .select('faction_id').eq('nation_id', nation.id).eq('is_active', true).limit(1).maybeSingle();
        presidentFactionId = activePresident?.faction_id || null;
        isPresidentParty = (presidentFactionId && currentFaction?.id === presidentFactionId);
    }

    // Check for caretaker government (legislature frozen)
    // Bust coalition cache so caretaker status is never stale
    qCacheBust('coalition_');
    if (!lawsIsAutocracy) {
        const coalition = await fetchActiveCoalition(_supabase, nation.id);
        isCaretaker = coalition?.status === 'caretaker';
        isNoGovernment = !coalition;
        // Fallback: frozen bills are ground truth for caretaker status
        if (!isCaretaker) {
            const { count: frozenCount } = await _supabase
                .from('bills')
                .select('*', { count: 'exact', head: true })
                .eq('nation_id', nation.id)
                .eq('status', 'frozen');
            if (frozenCount && frozenCount > 0) isCaretaker = true;
        }
    }

    await loadLawsData();

    // Auto-resolve any floor bills whose voting window has expired
    const resolutions = await resolveExpiredVotes(_supabase, currentNation.id);
    if (resolutions.length > 0) {
        // Reload data after resolutions
        await loadLawsData();
        // Show notification
        const msgs = resolutions.map(r =>
            r.result === 'passed'
                ? '✅ ' + r.billName + ' PASSED (' + r.votesFor + ' for / ' + r.votesAgainst + ' against)'
                : '❌ ' + r.billName + ' FAILED (' + r.votesFor + ' for / ' + r.votesAgainst + ' against)'
        );
        setTimeout(() => { alert('Vote Results:\n\n' + msgs.join('\n')); }, 500);
    }

    if (lawsIsAutocracy) {
        const hf = await detectHeadFaction(_supabase, currentNation.id, allParties, allPartySeats, currentFaction?.id);
        headFactionId = hf.headFactionId; isHeadFaction = hf.isHeadFaction;
    }
    renderLawsPage();
});

async function loadLawsData() {
    try {
        const nid = currentNation.id;

        // Policies are static game data — cache aggressively
        const cachedPolicies = qCache('policies_active');

        const { data: parties } = await _supabase.from('factions').select('id, faction_name, is_npc, seats, action_points').eq('nation_id', nid).eq('faction_type', 'party');
        allParties = parties || [];
        const seatData = await loadSeats(_supabase, nid, lawsIsAutocracy, allParties, currentFaction?.id);
        allPartySeats = seatData.allPartySeats; currentSeats = seatData.currentSeats;

        // Refresh current faction AP from fresh DB data
        const freshFaction = allParties.find(p => p.id === currentFaction?.id);
        if (freshFaction && currentFaction) {
            currentFaction.action_points = freshFaction.action_points;
        }

        const queries = [
            cachedPolicies ? Promise.resolve({ data: cachedPolicies }) : _supabase.from('policies').select('*').eq('is_active', true),
            _supabase.from('active_laws').select('*, policies(*)').eq('nation_id', nid),
            _supabase.from('bills').select('*, factions(faction_name), bill_articles(*, policies(*), factions(faction_name)), bill_support(*)').eq('nation_id', nid).eq('status', 'committee'),
            _supabase.from('bills').select('*, factions(faction_name), bill_articles(*, policies(*))').eq('nation_id', nid).in('status', ['floor', 'vetoed']),
            _supabase.from('bills').select('*, factions(faction_name), bill_articles(*, policies(*))').eq('nation_id', nid).eq('status', 'frozen'),
            isPresidential ? _supabase.from('bills').select('*, factions(faction_name), bill_articles(*, policies(*))').eq('nation_id', nid).eq('status', 'president_desk') : Promise.resolve({ data: [] }),
            _supabase.from('bills').select('*, factions(faction_name)').eq('nation_id', nid).in('status', ['passed', 'failed']).order('passed_tick', { ascending: false }).limit(10)
        ];
        const [policiesRes, lawsRes, committeeRes, floorRes, frozenRes, deskRes, recentRes] = await Promise.all(queries);

        allPolicies = policiesRes.data || [];
        if (!cachedPolicies && allPolicies.length) qCacheSet('policies_active', allPolicies, 10 * 60 * 1000);
        activeLaws = lawsRes.data || [];
        committeeBills = committeeRes.data || [];
        floorBills = floorRes.data || [];
        frozenBills = frozenRes.data || [];
        presidentDeskBills = deskRes.data || [];
        recentBills = recentRes.data || [];

        // Load dynamic ideology scores for current player
        if (currentFaction) {
            factionIdeology = await loadFactionIdeology(_supabase, currentFaction.id);
        }

        // Collect policy IDs already in active bills (committee or floor)
        pendingPolicyIds = new Set();
        committeeBills.forEach(b => (b.bill_articles || []).forEach(a => { if (a.policy_id) pendingPolicyIds.add(a.policy_id); }));
        floorBills.forEach(b => (b.bill_articles || []).forEach(a => { if (a.policy_id) pendingPolicyIds.add(a.policy_id); }));
    } catch (error) { console.error('Error loading laws data:', error); }
}


// ==================== IDEOLOGY AWARENESS (PHASE 4) ====================

/**
 * Determine CSS class for an ideology chip based on alignment with player's
 * dynamic ideology scores. Green = aligned, Red = opposed, Gray = neutral.
 */
function getIdeologyChipClass(ideologyTag) {
    if (!factionIdeology) return 'neutral';
    const tag = (ideologyTag || '').toUpperCase();
    const mapping = IDEOLOGY_TO_AXIS[tag];
    if (!mapping) return 'neutral';

    const score = factionIdeology[mapping.axisKey] || 0;
    const alignment = score * mapping.direction;
    if (alignment > 10) return 'aligned';
    if (alignment < -10) return 'opposed';
    return 'neutral';
}

/**
 * Render ideology chip HTML for a policy, using dynamic alignment colors.
 */
function renderIdeologyChips(policy) {
    if (!policy) return '';
    const ideos = (policy.ideologies && Array.isArray(policy.ideologies) && policy.ideologies.length > 0)
        ? policy.ideologies : (policy.ideology ? [policy.ideology] : []);
    return ideos.map(i => {
        const colorClass = getIdeologyChipClass(i);
        return `<span class="article-ideology ${colorClass}">${i}</span>`;
    }).join(' ');
}

/**
 * Render ideology chip for the All Laws panel tag style.
 */
function renderIdeoTag(ideologyTag) {
    const colorClass = getIdeologyChipClass(ideologyTag);
    return `<span class="tag tag-ideo ${colorClass}">${ideologyTag}</span>`;
}


function renderLawsPage() {
    const canDraft = (currentFaction?.action_points || 0) >= GAME_CONFIG.DRAFT_BILL_AP_COST && currentSeats > 0 && !isCaretaker && !isNoGovernment;
const noSeatsTitle = currentSeats === 0 ? 'title="Your faction has no seats and cannot propose bills"' : (isCaretaker ? 'title="Legislature is dissolved — no new bills during caretaker government"' : (isNoGovernment ? 'title="Legislature is suspended until a new government is formed"' : ''));
    const pageTitle = lawsIsAutocracy ? `Decrees of ${currentNation.name}` : `Bills & Laws of ${currentNation.name}`;
    const html = `
        <div class="panel-padding">
            ${isCaretaker ? `
                <div style="background:linear-gradient(135deg,#2a1a00,#1a1200);border:2px solid #ff9800;border-radius:12px;padding:16px;margin-bottom:20px;text-align:center;">
                    <div style="font-size:1rem;color:#ff9800;font-weight:bold;text-transform:uppercase;letter-spacing:1.5px;">⚡ Legislature Dissolved</div>
                    <div style="font-size:0.8rem;color:var(--text-secondary);margin-top:6px;">Caretaker government in place. No new legislation until elections resolve.</div>
                </div>
            ` : (isNoGovernment ? `
                <div style="background:linear-gradient(135deg,#1a1a2e,#16213e);border:2px solid #4fc3f7;border-radius:12px;padding:16px;margin-bottom:20px;text-align:center;">
                    <div style="font-size:1rem;color:#4fc3f7;font-weight:bold;text-transform:uppercase;letter-spacing:1.5px;">🏛️ Legislature Suspended</div>
                    <div style="font-size:0.8rem;color:var(--text-secondary);margin-top:6px;">A new government must be formed before bills can be proposed.</div>
                </div>
            ` : '')}
            <div class="laws-header">
                <div class="section-header" style="margin-bottom:0;border-bottom:none;">${pageTitle}</div>
                <div class="laws-header-buttons">
                    <button class="all-laws-btn" onclick="toggleAllLaws()">📋 All Laws</button>
                    <button class="draft-btn ${lawsIsAutocracy ? 'autocracy-btn' : ''}" onclick="openDraftModal()" ${canDraft ? '' : 'disabled'} ${noSeatsTitle}>
                        ${termPropose} <span class="ap-cost">${GAME_CONFIG.DRAFT_BILL_AP_COST} AP</span>
                    </button>
                </div>
            </div>

            <!-- All Laws Panel (hidden by default) -->
            <div class="all-laws-panel" id="all-laws-panel">
                <button class="all-laws-back" onclick="toggleAllLaws()">← Back to Bills</button>
                <div class="section-header" style="font-size:1rem;">All Policies & Laws</div>
                <div class="all-laws-filters">
                    <input type="text" id="law-search" placeholder="Search by name..." oninput="filterAllLaws()">
                    <select id="law-filter-status" onchange="filterAllLaws()">
                        <option value="">All Status</option>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                    <select id="law-filter-sector" onchange="filterAllLaws()"><option value="">All Sectors</option></select>
                    <select id="law-filter-ideology" onchange="filterAllLaws()"><option value="">All Ideologies</option></select>
                    <span class="law-count-label" id="law-count-label">—</span>
                </div>
                <div id="all-laws-list"></div>
            </div>

            <!-- Bills View (shown by default) -->
            <div id="bills-view">
                ${presidentDeskBills.length > 0 ? renderPresidentDeskBills() : ''}
                ${frozenBills.length > 0 ? renderFrozenBills() : ''}
                ${floorBills.length > 0 ? renderFloorBills() : ''}
                ${committeeBills.length > 0 ? renderCommitteeBills() : ''}
                ${recentBills.length > 0 ? renderRecentBills() : ''}
                <div class="section-header">Active Laws</div>
                <div class="sector-accordion">
                    ${MAJOR_SECTORS.map(sector => renderMajorSector(sector)).join('')}
                </div>
            </div>
        </div>`;
    document.getElementById('content-area').innerHTML = html;
    populateAllLawsFilters();
}

// ==================== ALL LAWS VIEW ====================

function toggleAllLaws() {
    showingAllLaws = !showingAllLaws;
    document.getElementById('all-laws-panel').classList.toggle('active', showingAllLaws);
    document.getElementById('bills-view').style.display = showingAllLaws ? 'none' : 'block';
    if (showingAllLaws) filterAllLaws();
}

function populateAllLawsFilters() {
    const sectors = [...new Set(allPolicies.map(p => p.major_sector).filter(Boolean))].sort();
    const ideologies = new Set();
    allPolicies.forEach(p => {
        if (p.ideologies && Array.isArray(p.ideologies)) p.ideologies.forEach(i => ideologies.add(i));
        else if (p.ideology) ideologies.add(p.ideology);
    });
    const sectorSel = document.getElementById('law-filter-sector');
    if (sectorSel) sectorSel.innerHTML = '<option value="">All Sectors</option>' + sectors.map(s => `<option value="${s}">${s}</option>`).join('');
    const ideoSel = document.getElementById('law-filter-ideology');
    if (ideoSel) ideoSel.innerHTML = '<option value="">All Ideologies</option>' + [...ideologies].sort().map(i => `<option value="${i}">${i}</option>`).join('');
}

function filterAllLaws() {
    const search = (document.getElementById('law-search')?.value || '').toLowerCase();
    const status = document.getElementById('law-filter-status')?.value || '';
    const sector = document.getElementById('law-filter-sector')?.value || '';
    const ideology = document.getElementById('law-filter-ideology')?.value || '';

    const activePolicyIds = new Set(activeLaws.map(al => al.policy_id));

    let filtered = allPolicies.filter(p => {
        if (search && !(p.policy_name || '').toLowerCase().includes(search) && !(p.description || '').toLowerCase().includes(search)) return false;
        if (sector && p.major_sector !== sector) return false;
        if (status === 'active' && !activePolicyIds.has(p.id)) return false;
        if (status === 'inactive' && activePolicyIds.has(p.id)) return false;
        if (ideology) {
            const pIdeos = p.ideologies || (p.ideology ? [p.ideology] : []);
            if (!pIdeos.includes(ideology)) return false;
        }
        return true;
    });

    document.getElementById('law-count-label').textContent = filtered.length + ' policies';
    const container = document.getElementById('all-laws-list');
    if (filtered.length === 0) { container.innerHTML = '<div style="text-align:center;color:#666;padding:30px;">No policies match filters.</div>'; return; }

    container.innerHTML = filtered.map(p => {
        const isActive = activePolicyIds.has(p.id);
        const ideos = p.ideologies || (p.ideology ? [p.ideology] : []);
        const ideoHTML = ideos.map(i => renderIdeoTag(i)).join(' ');

        let effectsHTML = '';
        if (p.stat_effects && Array.isArray(p.stat_effects) && p.stat_effects.length > 0) {
            effectsHTML = p.stat_effects.map(e => {
                const arrow = e.direction === 'up' ? '▲' : '▼';
                const cls = e.direction === 'up' ? 'tag-stat-up' : 'tag-stat-down';
                return `<span class="tag ${cls}">${formatStatName(e.stat_key)} ${arrow}</span>`;
            }).join(' ');
        } else if (p.target_stat) {
            const arrow = p.stat_direction === 'UP' ? '▲' : '▼';
            const cls = p.stat_direction === 'UP' ? 'tag-stat-up' : 'tag-stat-down';
            effectsHTML = `<span class="tag ${cls}">${formatStatName(p.target_stat)} ${arrow}</span>`;
        }

        const upCost = p.upfront_cost || 0;
        const onCost = p.ongoing_base_cost || p.ongoing_cost_per_tick || 0;
        const fmtC = (m) => m >= 1000 ? '$' + (m / 1000).toFixed(m % 1000 === 0 ? 0 : 1) + 'B' : '$' + m + 'M';
        const costHTML = [];
        if (upCost > 0) costHTML.push(`Up: ${fmtC(upCost)}`);
        if (onCost > 0) costHTML.push(`On: ${fmtC(onCost)}/t`);

        return `<div class="law-card ${isActive ? 'law-active' : 'law-inactive'}">
            <div class="law-card-header">
                <div class="law-card-name">${p.policy_name} ${isActive ? '<span style="color:#4CAF50;font-size:0.75rem;">● ACTIVE</span>' : '<span style="color:#666;font-size:0.75rem;">○ INACTIVE</span>'}</div>
                <div class="law-card-sector">${p.major_sector || '—'}</div>
            </div>
            ${p.description ? `<div class="law-card-desc">${p.description}</div>` : ''}
            <div class="law-card-meta">
                ${ideoHTML} ${effectsHTML} ${costHTML.length > 0 ? `<span style="color:#ff9800;">${costHTML.join(' · ')}</span>` : ''}
            </div>
        </div>`;
    }).join('');
}

// ==================== FLOOR BILLS ====================

function renderFrozenBills() {
    return `<div class="section-header" style="color:#ff9800;">Frozen — Legislature Dissolved</div>` +
        frozenBills.map(bill => `
            <div class="floor-bill clickable-bill" style="opacity:0.6;border-color:#ff9800;" onclick="window.location.href='bill.html?id=${bill.id}'">
                <div class="committee-bill-header">
                    <div>
                        <div class="floor-bill-name">${bill.bill_name || 'Unnamed ' + termBill} <span style="background:#ff9800;color:#000;padding:2px 8px;border-radius:3px;font-size:0.65rem;font-weight:bold;text-transform:uppercase;margin-left:6px;">FROZEN</span></div>
                        <div class="committee-bill-sponsor">Proposed by ${bill.factions?.faction_name || 'Unknown'}</div>
                    </div>
                    <div class="floor-status" style="color:#ff9800;">FROZEN</div>
                </div>
                <div style="font-size:0.75rem;color:#ff9800;padding:8px 16px;">This ${termBill.toLowerCase()} has been frozen pending elections. It will be dismissed when the election resolves.</div>
            </div>
        `).join('');
}

// ==================== PRESIDENT'S DESK ====================

function renderPresidentDeskBills() {
    let html = `<div class="section-header" style="color:#1565C0;">President's Desk</div>`;
    html += presidentDeskBills.map(bill => {
        const articles = (bill.bill_articles || []).sort((a,b) => a.article_number - b.article_number);
        const articlesHtml = articles.length > 0
            ? articles.map(art => {
                if (!art.policies) return `<div class="bill-article-item"><div class="article-info"><span class="article-title">Art. ${art.article_number}. ${art.article_title || 'Untitled'} <span style="background:#2196F3;color:#fff;padding:1px 6px;border-radius:3px;font-size:0.6rem;font-weight:bold;">TEXT</span></span></div></div>`;
                const chipHTML = renderIdeologyChips(art.policies);
                return `<div class="bill-article-item"><div class="article-info"><span class="article-title">Art. ${art.article_number}. ${art.policies?.policy_name || 'Unknown'}</span>${chipHTML}<div class="article-desc">${art.policies?.description || ''}</div></div></div>`;
            }).join('')
            : (bill.bill_type === 'repeal' ? '<div class="bill-article-item"><div class="article-info"><span class="article-title" style="color:#ff4444;">🗑️ Proposes to rescind an active law</span></div></div>' : '');

        const deadlineTick = bill.president_desk_deadline || '?';
        const actionButtons = isPresidentParty
            ? `<div class="veto-banner" style="border-color:#1565C0;background:linear-gradient(135deg,#0d1b2a,#1b2838);">
                <div>
                    <div class="veto-banner-text" style="color:#64B5F6;">The President must sign or veto this bill</div>
                    <div style="font-size:0.75rem;color:#888;">Auto-signs at Tick ${deadlineTick} if no action taken</div>
                </div>
                <div style="display:flex;gap:8px;">
                    <button class="stance-btn" style="background:#4CAF50;color:#fff;" onclick="event.stopPropagation(); signBill('${bill.id}')">Sign Into Law</button>
                    <button class="stance-btn veto" onclick="event.stopPropagation(); vetoBill('${bill.id}')">Veto</button>
                </div>
            </div>`
            : `<div style="padding:8px 16px;font-size:0.8rem;color:#64B5F6;">Awaiting presidential action — auto-signs at Tick ${deadlineTick}</div>`;

        return `
            <div class="floor-bill clickable-bill" style="border-color:#1565C0;" onclick="window.location.href='bill.html?id=${bill.id}'">
                <div class="committee-bill-header">
                    <div>
                        <div class="floor-bill-name">${bill.bill_name || 'Unnamed Bill'}${bill.bill_type === 'repeal' ? ' <span style="background:#ff4444;color:#fff;padding:2px 8px;border-radius:3px;font-size:0.65rem;font-weight:bold;text-transform:uppercase;margin-left:6px;">Repeal</span>' : ''}</div>
                        <div class="committee-bill-sponsor">Proposed by ${bill.factions?.faction_name || 'Unknown'}</div>
                    </div>
                    <div class="floor-status" style="background:#1565C0;color:#fff;">ON PRESIDENT'S DESK</div>
                </div>
                <div class="bill-articles">${articlesHtml}</div>
                ${actionButtons}
                <div class="click-hint">Click to view full bill →</div>
            </div>`;
    }).join('');
    return html;
}

async function signBill(billId) {
    if (!isPresidentParty) return;
    if (!confirm('Sign this bill into law?')) return;
    try {
        await signPresidentialBill(_supabase, billId, currentFaction.id);
        alert('Bill signed into law.');
        await loadLawsData(); renderLawsPage();
    } catch (error) { console.error('Sign error:', error); alert('Error: ' + error.message); }
}

async function vetoBill(billId) {
    if (!isPresidentParty) return;
    const overrideSeats = Math.ceil(GAME_CONFIG.TOTAL_SEATS * GAME_CONFIG.VETO_OVERRIDE_THRESHOLD);
    if (!confirm(`VETO this bill?\n\nA veto override bill will be automatically created requiring ${overrideSeats}/${GAME_CONFIG.TOTAL_SEATS} seats (2/3 supermajority).\n\nProceed?`)) return;
    try {
        await vetoPresidentialBill(_supabase, billId, currentFaction.id);
        alert('Bill vetoed. A veto override bill has been sent to the floor.');
        await loadLawsData(); renderLawsPage();
    } catch (error) { console.error('Veto error:', error); alert('Error: ' + error.message); }
}

function renderFloorBills() {
    const activeFloor = floorBills.filter(b => b.status === 'floor');

    if (activeFloor.length > 0) html += `<div class="section-header" style="color:#4CAF50;">On The Floor</div>${activeFloor.map(bill => renderFloorBill(bill, false)).join('')}`;
    if (vetoedFloor.length > 0) html += `<div class="section-header" style="color:#ff4444;">Vetoed ${termBills}</div>${vetoedFloor.map(bill => renderFloorBill(bill, true)).join('')}`;

async function vetoDecree(billId) {
    if (!lawsIsAutocracy || !isHeadFaction) return;
    if (!confirm(`⛔ VETO this decree?\nYour faction loses -${GAME_CONFIG.VETO_APPROVAL_COST} Approval.\nProceed?`)) return;
    try {
        await _supabase.from('bills').update({ status: 'vetoed' }).eq('id', billId);
        await adjustBlocApproval(_supabase, currentFaction.id, -GAME_CONFIG.VETO_APPROVAL_COST);
        currentFaction.approval_rating = Math.max(0, (currentFaction.approval_rating || 0) - GAME_CONFIG.VETO_APPROVAL_COST);
        alert(`⛔ Decree vetoed. Lost ${GAME_CONFIG.VETO_APPROVAL_COST}% approval.`);
        await loadLawsData(); renderLawsPage();
    } catch (error) { console.error('Veto error:', error); alert('Error: ' + error.message); }
}

async function enactDecree(billId) {
    if (!lawsIsAutocracy || !isHeadFaction) return;
    if (!confirm('⚡ ENACT this decree?\nThis sends it directly to the floor for a vote.')) return;
    try {
        const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        await _supabase.from('bills').update({ status: 'floor', voting_ends_tick: (shard?.current_tick || 0) + GAME_CONFIG.VOTING_WINDOW_TICKS }).eq('id', billId);

        // Apply dynamic ideology penalty to sponsor
        const bill = committeeBills.find(b => b.id === billId);
        if (bill) {
            const sponsorIdeology = await loadFactionIdeology(_supabase, bill.proposed_by);
            if (sponsorIdeology) {
                const dynamicPenalty = calculateBillDynamicPenalty(sponsorIdeology, bill.bill_articles || []);
                if (dynamicPenalty < 0) {
                    await adjustBlocApproval(_supabase, bill.proposed_by, dynamicPenalty);
                    console.log(`Dynamic ideology penalty (decree→floor): ${dynamicPenalty} for sponsor`);
                }
            }
        }

        alert('⚡ Decree sent to the floor!');
        await loadLawsData(); renderLawsPage();
    } catch (error) { console.error('Enact error:', error); alert('Error: ' + error.message); }
}

// ==================== ACTIVE LAWS (SECTORS) ====================

function renderMajorSector(sector) {
    const sectorPolicies = allPolicies.filter(p => p.major_sector === sector.key);
    const minorSectors = [...new Set(sectorPolicies.map(p => p.minor_sector || p.law_category))];
    if (minorSectors.length === 0) return '';
    return `<div class="major-sector" id="sector-${sector.key}"><div class="major-sector-header" onclick="toggleMajorSector('${sector.key}')"><div class="major-sector-title">${sector.icon} ${sector.label}</div><div class="major-sector-arrow">▶</div></div><div class="major-sector-content">${minorSectors.map(minor => renderMinorSector(sector.key, minor)).join('')}</div></div>`;
}

function renderMinorSector(majorKey, minorKey) {
    const matchingLaws = activeLaws.filter(law => !law.is_reversal && law.policies?.major_sector === majorKey && (law.policies?.minor_sector === minorKey || law.policies?.law_category === minorKey));
    const safeMinor = (minorKey || '').replace(/'/g, "\\'");
    const lawsHTML = matchingLaws.length > 0 ? matchingLaws.map(law => renderActiveLaw(law)).join('') : '<div class="no-law">No active law in this area.</div>';
    return `<div class="minor-sector" id="minor-${majorKey}-${minorKey}"><div class="minor-sector-header" onclick="toggleMinorSector('${majorKey}','${safeMinor}')"><div class="minor-sector-title">${formatMinorSector(minorKey)}</div><div class="minor-sector-arrow">▶</div></div><div class="minor-sector-content">${lawsHTML}</div></div>`;
}

function renderActiveLaw(law) {
    const p = law.policies;
    let effectsHTML = '';
    if (p.stat_effects && Array.isArray(p.stat_effects) && p.stat_effects.length > 0) {
        effectsHTML = p.stat_effects.map(e => {
            const dir = e.direction === 'up' ? '↑' : '↓';
            const cls = e.direction === 'up' ? 'effect-up' : 'effect-down';
            return `${formatStatName(e.stat_key)} <span class="${cls}">${dir}</span>`;
        }).join(', ');
    } else if (p.target_stat) {
        const dir = p.stat_direction === 'UP' ? '↑' : '↓';
        const cls = p.stat_direction === 'UP' ? 'effect-up' : 'effect-down';
        effectsHTML = `${formatStatName(p.target_stat)} <span class="${cls}">${dir}</span>`;
    }
    return `<div class="active-law"><div class="active-law-name">${p.policy_name}</div><div class="active-law-desc">${p.description || ''}</div><div class="active-law-meta"><span>${effectsHTML}</span><span>Passed tick ${law.passed_tick || '?'}</span><button class="rescind-btn" onclick="rescindLaw('${law.id}','${p.policy_name.replace(/'/g, "\\'")}')">✕ Rescind</button></div></div>`;
}

function toggleMajorSector(key) { document.getElementById('sector-'+key).classList.toggle('expanded'); }
function toggleMinorSector(majorKey, minorKey) { document.getElementById('minor-'+majorKey+'-'+minorKey)?.classList.toggle('expanded'); }

async function rescindLaw(activeLawId, policyName) {
    if (currentSeats === 0) { alert('Your faction holds no seats and cannot propose bills.'); return; }
    if (!confirm('Propose a bill to rescind "' + policyName + '"?\n\nThis will create a repeal bill and send it to committee for a vote.')) return;
    try {
        const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const currentTick = shard?.current_tick || 0;
        const termBill = lawsIsAutocracy ? 'decree' : 'bill';
        const { data: bill, error: billError } = await _supabase.from('bills').insert({
            nation_id: currentNation.id,
            proposed_by: currentFaction.id,
            proposed_tick: currentTick,
            bill_name: 'Repeal: ' + policyName,
            bill_type: 'repeal',
            repeal_active_law_id: activeLawId,
            status: 'committee',
            preamble: 'This ' + termBill + ', put forth by the ' + currentFaction.faction_name + ', seeks to rescind the law "' + policyName + '" currently in effect in ' + currentNation.name + '.'
        }).select().single();
        if (billError) throw billError;

        // Auto-add sponsor support
        const mySeats = currentFaction.seats || 0;
        await _supabase.from('bill_support').insert({ bill_id: bill.id, faction_id: currentFaction.id, stance: 'accept', seat_count: mySeats });

        alert('Repeal bill created and sent to committee!');
        window.location.href = 'bill.html?id=' + bill.id;
    } catch (e) {
        console.error(e);
        alert('Error creating repeal bill: ' + e.message);
    }
}

        document.getElementById('submit-bill-btn').textContent = `Submit to Committee — ${GAME_CONFIG.DRAFT_BILL_AP_COST} AP`;
    }
    document.getElementById('article-preamble').textContent =
        `This ${lawsIsAutocracy ? 'decree' : 'bill'}, put forth in the ${lawsIsAutocracy ? 'regime' : 'legislature'} of the nation of ${currentNation.name}, by the ${currentFaction.faction_name}, seeks to enact the following provisions.`;
    populateSectorDropdown('sector-select');
    const ideo1 = currentFaction.ideology_value_1 || '', ideo2 = currentFaction.ideology_value_2 || '';
    document.getElementById('party-ideologies').textContent = (ideo1 || ideo2) ? [ideo1, ideo2].filter(Boolean).join(' + ') : 'None (all policies available)';
    renderDraftArticles(); hideAddArticleForm();
    document.getElementById('bill-name-section').style.display = 'none';
    document.getElementById('submit-bill-btn').disabled = true;
    document.getElementById('draft-modal').classList.add('active');

function populateSectorDropdown(selectId) {

    select.innerHTML = '<option value="">-- Choose a sector --</option>';

function renderFoundationalOptions() {
    const container = document.getElementById('policy-options');
    const currentSeatsTotal = GAME_CONFIG.TOTAL_SEATS;
    const required = Math.ceil(currentSeatsTotal * GAME_CONFIG.SUPERMAJORITY_THRESHOLD);
    container.innerHTML = `
        <div class="policy-option selected" style="border-color:#9C27B0;cursor:default;">
            <div class="policy-option-name">🏛 Electoral Makeup <span class="article-ideology" style="background:#9C27B0;color:#fff;">FOUNDATIONAL</span></div>
            <div class="policy-option-desc">Change the number of legislative seats. Requires 2/3 supermajority (${required} seats) to pass. Non-ideological — no approval penalties. If passed, seats are redistributed proportionally.</div>
            <div style="margin-top:12px;">
                <label style="color:#ccc;font-size:0.8rem;display:block;margin-bottom:6px;">Current seats: <strong>${currentSeatsTotal}</strong> — Proposed new total:</label>
                <input type="number" id="foundational-seats-input" min="50" max="500" step="10" value="${currentSeatsTotal}" onchange="this.value=Math.max(50,Math.min(500,parseInt(this.value)||50))" style="background:#252525;border:1px solid #9C27B0;color:#fff;padding:8px 12px;border-radius:4px;font-size:1rem;width:120px;">
            </div>
        </div>`;
    selectedPolicy = null;
    document.getElementById('add-article-btn').disabled = false;
}

function renderPolicyOptions(policies, containerId, buttonId) {
    const container = document.getElementById(containerId);
    if (policies.length === 0) { container.innerHTML = '<div class="no-law">No policies available in this sector.</div>'; return; }
    container.innerHTML = policies.map(policy => {
        const ideos = policy.ideologies || (policy.ideology ? [policy.ideology] : []);
        const ideoHTML = ideos.map(i => {
            const colorClass = getIdeologyChipClass(i);
            return `<span class="article-ideology ${colorClass}">${i}</span>`;
        }).join(' ');
        const isPending = pendingPolicyIds.has(policy.id);
        const isEnacted = policy.alreadyEnacted;
        const opposedClass = policy.isOpposed ? ' opposed' : '';
        const pendingClass = (isPending || isEnacted) ? ' pending' : '';
        const opposedBadge = policy.isOpposed ? '<span class="opposed-badge">⚠ Opposed</span>' : '';
        const pendingBadge = isPending ? '<span class="opposed-badge" style="background:#555;color:#ccc;">⏳ In Active Bill</span>' : '';
        const enactedBadge = isEnacted ? '<span class="opposed-badge" style="background:#2E7D32;color:#fff;">✅ Already Enacted</span>' : '';
        const opposedWarn = policy.isOpposed ? '<div class="opposed-warning">Ideologically opposed — approval penalty if proposed</div>' : '';
        let effectHTML = '';
        if (policy.stat_effects && Array.isArray(policy.stat_effects) && policy.stat_effects.length > 0) {
            effectHTML = policy.stat_effects.map(e => {
                const dir = e.direction === 'up' ? '↑' : '↓';
                const cls = e.direction === 'up' ? 'effect-up' : 'effect-down';
                return `${formatStatName(e.stat_key)} <span class="${cls}">${dir}</span>`;
            }).join(', ');
        } else if (policy.target_stat) {
            const dir = policy.stat_direction === 'UP' ? '↑' : '↓';
            const cls = policy.stat_direction === 'UP' ? 'effect-up' : 'effect-down';
            effectHTML = `${formatStatName(policy.target_stat)} <span class="${cls}">${dir}</span>`;
        }
        return `<div class="policy-option${opposedClass}${pendingClass}" data-policy-id="${policy.id}" onclick="${isEnacted ? '' : `selectPolicyOption('${policy.id}','${buttonId}')`}"><div class="policy-option-name">${policy.policy_name} ${ideoHTML} ${opposedBadge}${pendingBadge}${enactedBadge}</div><div class="policy-option-desc">${policy.description || ''}</div><div class="policy-option-effects">${effectHTML}</div>${opposedWarn}</div>`;
    }).join('');
}

function selectPolicyOption(policyId, buttonId) {
    selectedPolicy = allPolicies.find(p => p.id === policyId);
    document.querySelectorAll('.policy-option').forEach(el => el.classList.remove('selected'));
    document.querySelector(`[data-policy-id="${policyId}"]`)?.classList.add('selected');
    document.getElementById(buttonId).disabled = false;
}

function addArticle() {
    const sector = document.getElementById('sector-select').value;

    // Foundational article (Electoral Makeup)
    if (sector === 'FOUNDATIONAL') {
        const seatsInput = document.getElementById('foundational-seats-input');
        const newSeats = parseInt(seatsInput?.value, 10);
        if (isNaN(newSeats) || newSeats < 50 || newSeats > 500) {
            alert('Please enter a number between 50 and 500.');
            return;
        }
        if (newSeats === GAME_CONFIG.TOTAL_SEATS) {
            alert('The proposed seat count is the same as the current count.');
            return;
        }
        // Clear any existing articles — foundational bill is standalone
        draftArticles = [];
        draftArticles.push({
            articleNumber: 2,
            isFoundational: true,
            proposedSeats: newSeats,
            policy: null
        });
        renderDraftArticles(); hideAddArticleForm();
        // Auto-set bill name and disable adding more articles
        document.getElementById('bill-name-input').value = `Electoral Makeup Act (${newSeats} Seats)`;
        document.getElementById('bill-name-section').style.display = 'block';
        document.getElementById('submit-bill-btn').disabled = false;
        document.getElementById('add-article-section').style.display = 'none';
        document.getElementById('add-text-article-section').style.display = 'none';
        return;
    }

    if (!selectedPolicy) return;
    draftArticles.push({ articleNumber: draftArticles.length + 2, policy: selectedPolicy, isOpposed: selectedPolicy.isOpposed || false });
    renderDraftArticles(); hideAddArticleForm(); selectedPolicy = null;
    if (draftArticles.length > 0) { document.getElementById('bill-name-section').style.display = 'block'; document.getElementById('submit-bill-btn').disabled = false; }
}

function renderDraftArticles() {
    const container = document.getElementById('draft-articles');
    if (draftArticles.length === 0) { container.innerHTML = ''; return; }

    // Calculate dynamic ideology penalty for the draft
    let penaltySummary = '';
    if (factionIdeology) {
        const draftPolicyArticles = draftArticles.filter(a => a.policy).map(a => ({ policies: a.policy }));
        const dynamicPenalty = calculateBillDynamicPenalty(factionIdeology, draftPolicyArticles);
        if (dynamicPenalty < 0) {
            penaltySummary = `<div class="opposed-warning" style="margin:12px 0 4px;padding:10px;background:#2a1a1a;border-radius:6px;border:1px solid #ff4444;">
                ⚠ <strong>Ideology conflict detected</strong> — Estimated approval penalty: <strong>${dynamicPenalty.toFixed(1)}</strong> (based on your current ideological position)
            </div>`;
        }
    } else {
        // Fallback to static penalty if no ideology data
        const opposedCount = draftArticles.filter(a => a.isOpposed).length;
        const pol = currentNation?.polarization || 0;
        if (opposedCount > 0) {
            const floorPen = calculateIdeologyPenalty('floor', opposedCount, pol);
            const passPen = calculateIdeologyPenalty('passed', opposedCount, pol);
            penaltySummary = `<div class="opposed-warning" style="margin:12px 0 4px;padding:10px;background:#2a1a1a;border-radius:6px;border:1px solid #ff4444;">
                ⚠ <strong>${opposedCount} opposed article${opposedCount > 1 ? 's' : ''}</strong> — Floor penalty: <strong>${floorPen}</strong> approval | Pass penalty: <strong>${passPen}</strong> approval${pol >= 50 ? ' <span style="color:#ff9800;">(Polarization ' + pol + '%)</span>' : ''}
            </div>`;
        }
    }

    container.innerHTML = draftArticles.map((art, index) => {
        if (art.isFoundational) {
            const change = art.proposedSeats - GAME_CONFIG.TOTAL_SEATS;
            const changeText = change > 0 ? `+${change}` : `${change}`;
            return `<div class="draft-article-card" style="border-left:3px solid #9C27B0;">
                <div class="draft-article-info">
                    <div class="draft-article-num">Article ${art.articleNumber} — <span style="color:#9C27B0;">Foundational</span></div>
                    <div class="draft-article-name">🏛 Electoral Makeup</div>
                    <div class="draft-article-meta">Change seats: ${GAME_CONFIG.TOTAL_SEATS} → ${art.proposedSeats} (${changeText}) · Requires 2/3 supermajority · Non-ideological</div>
                </div>
                <button class="remove-article-btn" onclick="removeArticle(${index})">✕ Remove</button>
            </div>`;
        }
        if (art.isText) {
            return `<div class="draft-article-card" style="border-left:3px solid #2196F3;">
                <div class="draft-article-info">
                    <div class="draft-article-num">Article ${art.articleNumber} — <span style="color:#2196F3;">Text</span></div>
                    <div class="draft-article-name">${art.textTitle}</div>
                    <div class="draft-article-meta">${art.textBody.length > 120 ? art.textBody.substring(0, 120) + '…' : art.textBody}</div>
                </div>
                <button class="remove-article-btn" onclick="removeArticle(${index})">✕ Remove</button>
            </div>`;
        }
        const ideos = art.policy.ideologies || (art.policy.ideology ? [art.policy.ideology] : []);
        const ideoHTML = ideos.map(i => {
            const colorClass = getIdeologyChipClass(i);
            return `<span class="article-ideology ${colorClass}">${i}</span>`;
        }).join(' ');
        const opposedBadge = art.isOpposed ? ' <span class="opposed-badge">⚠ Opposed</span>' : '';
        const borderColor = art.isOpposed ? 'border-left:3px solid #ff4444;' : '';
        return `<div class="draft-article-card" style="${borderColor}"><div class="draft-article-info"><div class="draft-article-num">Article ${art.articleNumber}</div><div class="draft-article-name">${art.policy.policy_name} ${ideoHTML}${opposedBadge}</div><div class="draft-article-meta">${art.policy.description || ''}</div></div><button class="remove-article-btn" onclick="removeArticle(${index})">✕ Remove</button></div>`;
    }).join('') + penaltySummary;
}

function removeArticle(index) {
    draftArticles.splice(index, 1);
    draftArticles.forEach((art, i) => { art.articleNumber = i + 2; });
    renderDraftArticles();
    // Re-show add buttons (they may have been hidden for foundational bills)
    document.getElementById('add-article-section').style.display = 'block';
    document.getElementById('add-text-article-section').style.display = 'block';
    if (draftArticles.length === 0) { document.getElementById('bill-name-section').style.display = 'none'; document.getElementById('submit-bill-btn').disabled = true; }
}

async function submitToCommittee() {
    if (draftArticles.length === 0) return;
    if (isSubmitting) return;
    if (isCaretaker) { alert('Legislature is dissolved. No new bills during caretaker government.'); return; }
    if (isNoGovernment) { alert('Legislature is suspended. A new government must be formed before bills can be proposed.'); return; }
    if (currentSeats === 0) { alert('Your faction holds no seats and cannot propose bills.'); return; }
    isSubmitting = true;
    document.getElementById('submit-bill-btn').disabled = true;
    const billName = document.getElementById('bill-name-input').value.trim() || ('Unnamed ' + termBill);

    // Check if this is a foundational bill
    const isFoundationalBill = draftArticles.some(a => a.isFoundational);

    if (isFoundationalBill) {
        const foundationalArt = draftArticles.find(a => a.isFoundational);
        const proposedSeats = foundationalArt.proposedSeats;

        // Check: no existing pending/committee/floor foundational bill
        const { data: existingBill } = await _supabase
            .from('bills')
            .select('id')
            .eq('nation_id', currentNation.id)
            .eq('bill_type', 'foundational')
            .in('status', ['committee', 'floor'])
            .limit(1)
            .maybeSingle();

        if (existingBill) {
            alert('An Electoral Makeup bill is already pending.');
            return;
        }
    }

    // Atomic AP deduction — prevents race conditions and double-spend
    const apResult = await deductAP(_supabase, currentFaction.id, GAME_CONFIG.DRAFT_BILL_AP_COST);
    if (!apResult.success) { alert('Not enough AP to draft this bill.'); isSubmitting = false; return; }
    currentFaction.action_points = apResult.newAp;
    sessionStorage.removeItem('nationhood_state'); // bust stale AP cache

    try {
        const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const currentTick = shard?.current_tick || 0;

        const billInsert = {
            nation_id: currentNation.id, proposed_by: currentFaction.id, proposed_tick: currentTick, bill_name: billName, status: 'committee',
            preamble: isFoundationalBill
                ? `This foundational law, proposed by the ${currentFaction.faction_name}, seeks to change the number of legislative seats in ${currentNation.name} from ${GAME_CONFIG.TOTAL_SEATS} to ${draftArticles.find(a => a.isFoundational).proposedSeats}. Requires a two-thirds supermajority to pass.`
                : `This ${lawsIsAutocracy ? 'decree' : 'bill'}, put forth in the ${lawsIsAutocracy ? 'regime' : 'legislature'} of the nation of ${currentNation.name}, by the ${currentFaction.faction_name}, seeks to enact the following provisions.`
        };

        if (isFoundationalBill) {
            billInsert.bill_type = 'foundational';
            billInsert.proposed_seats = draftArticles.find(a => a.isFoundational).proposedSeats;
        }

        const { data: bill, error: billError } = await _supabase.from('bills').insert(billInsert).select().single();
        if (billError) throw billError;

        // Only insert bill_articles for non-foundational bills
        if (!isFoundationalBill) {
            const articles = draftArticles.map(art => {
                if (art.isText) {
                    return { bill_id: bill.id, policy_id: null, article_number: art.articleNumber, added_by: currentFaction.id, article_title: art.textTitle, article_text: art.textBody };
                }
                return { bill_id: bill.id, policy_id: art.policy.id, article_number: art.articleNumber, added_by: currentFaction.id };
            });
            await _supabase.from('bill_articles').insert(articles);
        }

        if (!lawsIsAutocracy) await _supabase.rpc('process_npc_committee_votes', { p_nation_id: currentNation.id });
        closeModal(); await loadLawsData(); renderLawsPage();
        alert(`"${billName}" submitted to committee!${isFoundationalBill ? '\n\nYou need at least one co-sponsor to send it to the floor.' : ''}`);
    } catch (error) { console.error('Error submitting:', error); alert('Error submitting. Please try again.'); } finally { isSubmitting = false; }
}

// ==================== COMMITTEE ACTIONS ====================

async function setStance(billId, stance) {
    try {
        await _supabase.from('bill_support').upsert({ bill_id: billId, faction_id: currentFaction.id, stance: stance, seat_count: currentSeats }, { onConflict: 'bill_id,faction_id' });
        await loadLawsData(); renderLawsPage();
    } catch (error) { console.error('Error setting stance:', error); alert('Error setting stance.'); }
}

async function retractBill(billId) {
    if (!confirm(`Retract this ${termBill.toLowerCase()}?`)) return;
    try {
        await _supabase.from('bill_support').delete().eq('bill_id', billId);
        await _supabase.from('bill_articles').delete().eq('bill_id', billId);
        await _supabase.from('bills').delete().eq('id', billId);
        await loadLawsData(); renderLawsPage();
        alert(termBill + ' retracted.');
    } catch (error) { console.error('Error retracting:', error); alert('Error retracting.'); }
}

async function submitCommitteeArticle() {
    if (!committeeSelectedPolicy || !currentCommitteeBillId) return;
    try {
        const { data: existingArticles } = await _supabase.from('bill_articles').select('article_number').eq('bill_id', currentCommitteeBillId).order('article_number', { ascending: false }).limit(1);
        const nextArticleNum = (existingArticles?.[0]?.article_number || 1) + 1;
        await _supabase.from('bill_articles').insert({ bill_id: currentCommitteeBillId, policy_id: committeeSelectedPolicy.id, article_number: nextArticleNum, added_by: currentFaction.id });
        await _supabase.from('bill_support').upsert({ bill_id: currentCommitteeBillId, faction_id: currentFaction.id, stance: 'accept', seat_count: currentSeats }, { onConflict: 'bill_id,faction_id' });
        closeCommitteeAddModal(); await loadLawsData(); renderLawsPage();
    } catch (error) { console.error('Error adding article:', error); alert('Error adding article.'); }
}

async function sendToFloor(billId) {
    try {
        const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        await _supabase.from('bills').update({ status: 'floor', voting_ends_tick: (shard?.current_tick || 0) + GAME_CONFIG.VOTING_WINDOW_TICKS }).eq('id', billId);

        // Apply dynamic ideology penalty to sponsor
        const bill = committeeBills.find(b => b.id === billId);
        if (bill && factionIdeology) {
            const dynamicPenalty = calculateBillDynamicPenalty(factionIdeology, bill.bill_articles || []);
            if (dynamicPenalty < 0) {
                await adjustBlocApproval(_supabase, bill.proposed_by, dynamicPenalty);
                console.log(`Dynamic ideology penalty (floor): ${dynamicPenalty} for sponsor`);
            }
        }

        await loadLawsData(); renderLawsPage();
        alert(termBill + ' sent to the floor!');
    } catch (error) { console.error('Error:', error); alert('Error sending to floor.'); }
}
