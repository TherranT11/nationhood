<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Laws | Nationhood Alpha</title>
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Shared Styles -->
    <link rel="stylesheet" href="css/dashboard.css">
    
    <!-- Page-specific styles -->
    <style>
        /* Header */
        .laws-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .draft-btn {
            background: linear-gradient(135deg, #ffcc00 0%, #e6b800 100%);
            border: none;
            border-radius: 6px;
            padding: 12px 24px;
            color: #121212;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .draft-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 204, 0, 0.4);
        }
        .draft-btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .draft-btn .ap-cost {
            background: rgba(0,0,0,0.2);
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 8px;
            font-size: 0.8rem;
        }
        
        /* Bills in Committee */
        .committee-section {
            margin-bottom: 24px;
        }
        .committee-bill {
            background: #1a1a1a;
            border: 2px solid #ff9800;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .committee-bill-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        .committee-bill-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ff9800;
            margin-bottom: 4px;
        }
        .committee-bill-sponsor {
            font-size: 0.85rem;
            color: #888;
        }
        .committee-support {
            text-align: right;
        }
        .support-percent {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ff9800;
        }
        .support-percent.enough {
            color: #4CAF50;
        }
        .support-label {
            font-size: 0.75rem;
            color: #888;
        }
        .support-bar {
            height: 8px;
            background: #333;
            border-radius: 4px;
            margin: 12px 0;
            overflow: hidden;
            position: relative;
        }
        .support-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff9800 0%, #ffcc00 100%);
            transition: width 0.3s;
        }
        .support-bar-fill.enough {
            background: linear-gradient(90deg, #4CAF50 0%, #8BC34A 100%);
        }
        .threshold-marker {
            position: absolute;
            left: 51%;
            top: 0;
            width: 2px;
            height: 100%;
            background: #fff;
            z-index: 1;
        }
        
        /* Articles list */
        .bill-articles {
            background: #252525;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 16px;
        }
        .bill-article-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #333;
        }
        .bill-article-item:last-child {
            border-bottom: none;
        }
        .article-info {
            flex: 1;
        }
        .article-title {
            color: #e0e0e0;
            font-weight: bold;
        }
        .article-ideology {
            font-size: 0.7rem;
            background: #4CAF50;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            margin-left: 8px;
        }
        .article-author {
            font-size: 0.75rem;
            color: #888;
        }
        
        /* Party stances */
        .party-stances {
            margin-top: 16px;
        }
        .party-stance-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #333;
        }
        .party-stance-row:last-child {
            border-bottom: none;
        }
        .party-stance-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .party-stance-name {
            color: #e0e0e0;
            font-weight: bold;
        }
        .party-stance-seats {
            color: #888;
            font-size: 0.85rem;
        }
        .stance-badge {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
        }
        .stance-sponsor { background: #ffcc00; color: #000; }
        .stance-accept { background: #4CAF50; color: #fff; }
        .stance-reject { background: #ff4444; color: #fff; }
        .stance-pending { background: #333; color: #888; }
        .party-stance-actions {
            display: flex;
            gap: 8px;
        }
        .stance-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .stance-btn:hover {
            opacity: 0.8;
        }
        .stance-btn.accept { background: #4CAF50; color: #fff; }
        .stance-btn.reject { background: #ff4444; color: #fff; }
        .stance-btn.add-article { background: #2196F3; color: #fff; }
        .stance-btn.send-floor { background: #ffcc00; color: #000; font-weight: bold; }
        .stance-btn.retract { background: #666; color: #fff; }
        
        /* Floor voting section */
        .floor-bill {
            background: #1a1a1a;
            border: 2px solid #4CAF50;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .floor-bill-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 4px;
        }
        .floor-status {
            background: #4CAF50;
            color: #fff;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .floor-votes {
            display: flex;
            gap: 24px;
            margin-top: 12px;
        }
        .votes-for { color: #4CAF50; font-weight: bold; }
        .votes-against { color: #ff4444; font-weight: bold; }
        
        /* Clickable Floor Bill */
        .clickable-bill {
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .floor-bill.clickable-bill:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.3);
        }
        .committee-bill.clickable-bill:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 152, 0, 0.3);
        }
        .article-desc {
            font-size: 0.8rem;
            color: #888;
            margin-top: 4px;
            font-style: italic;
        }
        .click-hint {
            text-align: right;
            font-size: 0.8rem;
            color: #4CAF50;
            margin-top: 12px;
            opacity: 0.7;
        }
        .clickable-bill:hover .click-hint {
            opacity: 1;
        }
        
        /* Sector Accordion */
        .sector-accordion {
            margin-bottom: 16px;
        }
        .major-sector {
            background: #1a1a1a;
            border-radius: 8px;
            margin-bottom: 8px;
            overflow: hidden;
        }
        .major-sector-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .major-sector-header:hover {
            background: #252525;
        }
        .major-sector-title {
            font-size: 1rem;
            font-weight: bold;
            color: #ffcc00;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .major-sector-arrow {
            color: #666;
            font-size: 1.2rem;
            transition: transform 0.3s;
        }
        .major-sector.expanded .major-sector-arrow {
            transform: rotate(90deg);
        }
        .major-sector-content {
            display: none;
            padding: 0 20px 16px;
        }
        .major-sector.expanded .major-sector-content {
            display: block;
        }
        
        /* Minor Sectors */
        .minor-sector {
            background: #252525;
            border-radius: 6px;
            margin-bottom: 8px;
            overflow: hidden;
        }
        .minor-sector-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .minor-sector-header:hover {
            background: #2a2a2a;
        }
        .minor-sector-title {
            font-size: 0.85rem;
            color: #e0e0e0;
        }
        .minor-sector-arrow {
            color: #555;
            font-size: 1rem;
            transition: transform 0.3s;
        }
        .minor-sector.expanded .minor-sector-arrow {
            transform: rotate(90deg);
        }
        .minor-sector-content {
            display: none;
            padding: 12px 16px;
            background: #1e1e1e;
            border-top: 1px solid #333;
        }
        .minor-sector.expanded .minor-sector-content {
            display: block;
        }
        
        /* Active Law Display */
        .active-law {
            background: #2a2a2a;
            border-left: 4px solid #4CAF50;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 8px;
        }
        .active-law-name {
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 4px;
        }
        .active-law-desc {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 8px;
        }
        .active-law-meta {
            display: flex;
            gap: 16px;
            font-size: 0.75rem;
            color: #888;
        }
        .no-law {
            color: #666;
            font-style: italic;
            padding: 8px 0;
        }
        
        /* Modal Overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background: #1a1a1a;
            border: 2px solid #ffcc00;
            border-radius: 12px;
            padding: 24px;
            max-width: 700px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #333;
        }
        .modal-title {
            font-size: 1.2rem;
            color: #ffcc00;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .modal-close:hover {
            color: #fff;
        }
        
        /* Bill Draft Form */
        .bill-article {
            background: #252525;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .article-label {
            font-size: 0.75rem;
            color: #ffcc00;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .article-text {
            color: #e0e0e0;
            font-size: 0.9rem;
            line-height: 1.6;
            font-style: italic;
        }
        
        /* Draft Articles List */
        .draft-articles {
            margin-bottom: 16px;
        }
        .draft-article-card {
            background: #252525;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .draft-article-info {
            flex: 1;
        }
        .draft-article-num {
            font-size: 0.7rem;
            color: #ffcc00;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .draft-article-name {
            color: #e0e0e0;
            font-weight: bold;
        }
        .draft-article-meta {
            font-size: 0.8rem;
            color: #888;
            margin-top: 4px;
        }
        .remove-article-btn {
            background: #ff4444;
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .remove-article-btn:hover {
            background: #ff6666;
        }
        
        /* Add Article Button */
        .add-article-section {
            background: #1e1e1e;
            border: 2px dashed #444;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            margin-bottom: 16px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }
        .add-article-section:hover {
            border-color: #ffcc00;
            background: #252525;
        }
        .add-article-btn-text {
            color: #ffcc00;
            font-weight: bold;
            font-size: 1rem;
        }
        
        /* Sector/Policy Selection */
        .form-group {
            margin-bottom: 16px;
        }
        .form-label {
            display: block;
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .form-select, .form-input {
            width: 100%;
            padding: 12px;
            background: #252525;
            border: 1px solid #444;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 0.9rem;
        }
        .form-select:focus, .form-input:focus {
            outline: none;
            border-color: #ffcc00;
        }
        .ideology-hint {
            background: #252525;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 0.85rem;
            color: #aaa;
        }
        .ideology-hint strong {
            color: #ffcc00;
        }
        
        /* Policy Options */
        .policy-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }
        .policy-option {
            background: #2a2a2a;
            border: 2px solid #333;
            border-radius: 6px;
            padding: 12px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .policy-option:hover {
            border-color: #555;
        }
        .policy-option.selected {
            border-color: #ffcc00;
        }
        .policy-option-name {
            font-weight: bold;
            color: #e0e0e0;
            margin-bottom: 4px;
        }
        .policy-option-desc {
            font-size: 0.8rem;
            color: #888;
        }
        .policy-option-effects {
            font-size: 0.75rem;
            color: #666;
            margin-top: 8px;
        }
        .effect-up { color: #4CAF50; }
        .effect-down { color: #ff4444; }
        
        /* Bill Name Input */
        .bill-name-section {
            background: #252525;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        
        /* Modal Footer */
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #333;
        }
        .btn-cancel {
            padding: 12px 24px;
            background: #333;
            border: none;
            border-radius: 6px;
            color: #888;
            cursor: pointer;
        }
        .btn-cancel:hover {
            background: #444;
            color: #fff;
        }
        .btn-submit {
            padding: 12px 24px;
            background: linear-gradient(135deg, #ffcc00 0%, #e6b800 100%);
            border: none;
            border-radius: 6px;
            color: #121212;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-submit:hover {
            box-shadow: 0 4px 12px rgba(255, 204, 0, 0.4);
        }
        .btn-submit:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            box-shadow: none;
        }
        .btn-add {
            padding: 8px 16px;
            background: #4CAF50;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<!-- ===== TOP BAR (rendered by common.js) ===== -->
<div id="top-bar"></div>

<!-- ===== CONTENT AREA ===== -->
<div id="content-area">
    <div class="loading-container">
        <div class="loading-spinner"></div>
        <div>Loading laws...</div>
    </div>
</div>

<!-- ===== DRAFT BILL MODAL ===== -->
<div class="modal-overlay" id="draft-modal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title">Draft New Bill</div>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        
        <!-- Article I - Preamble -->
        <div class="bill-article">
            <div class="article-label">Article I. Preamble</div>
            <div class="article-text" id="article-preamble">
                This bill, put forth in the legislature of the nation of [Nation], by the [Party], seeks to enact the following provisions.
            </div>
        </div>
        
        <!-- Draft Articles -->
        <div class="draft-articles" id="draft-articles">
            <!-- Populated dynamically -->
        </div>
        
        <!-- Add Article Section -->
        <div class="add-article-section" id="add-article-section" onclick="showAddArticleForm()">
            <span class="add-article-btn-text">+ Add Article</span>
        </div>
        
        <!-- Add Article Form (hidden by default) -->
        <div id="add-article-form" style="display: none;">
            <div class="form-group">
                <label class="form-label">Select Sector</label>
                <select class="form-select" id="sector-select" onchange="onSectorChange()">
                    <option value="">-- Choose a sector --</option>
                </select>
            </div>
            
            <div class="ideology-hint" id="ideology-hint" style="display: none;">
                Your party's ideology: <strong id="party-ideologies"></strong>
            </div>
            
            <div class="form-group" id="policy-group" style="display: none;">
                <label class="form-label">Select Policy</label>
                <div class="policy-options" id="policy-options"></div>
            </div>
            
            <div style="display: flex; gap: 8px; margin-top: 12px;">
                <button class="btn-cancel" onclick="hideAddArticleForm()">Cancel</button>
                <button class="btn-add" id="add-article-btn" disabled onclick="addArticle()">Add to Bill</button>
            </div>
        </div>
        
        <!-- Bill Name -->
        <div class="bill-name-section" id="bill-name-section" style="display: none;">
            <div class="form-group" style="margin-bottom: 0;">
                <label class="form-label">Name Your Bill</label>
                <input type="text" class="form-input" id="bill-name-input" placeholder="e.g., The Religious Harmony Act">
            </div>
        </div>
        
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="btn-submit" id="submit-bill-btn" disabled onclick="submitToCommittee()">
                Submit to Committee — 2 AP
            </button>
        </div>
    </div>
</div>

<!-- ===== ADD ARTICLE MODAL (for Committee) ===== -->
<div class="modal-overlay" id="committee-add-modal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title">Add Article to Bill</div>
            <button class="modal-close" onclick="closeCommitteeAddModal()">&times;</button>
        </div>
        
        <div class="form-group">
            <label class="form-label">Select Sector</label>
            <select class="form-select" id="committee-sector-select" onchange="onCommitteeSectorChange()">
                <option value="">-- Choose a sector --</option>
            </select>
        </div>
        
        <div class="ideology-hint" id="committee-ideology-hint" style="display: none;">
            Your party's ideology: <strong id="committee-party-ideologies"></strong>
        </div>
        
        <div class="form-group" id="committee-policy-group" style="display: none;">
            <label class="form-label">Select Policy</label>
            <div class="policy-options" id="committee-policy-options"></div>
        </div>
        
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeCommitteeAddModal()">Cancel</button>
            <button class="btn-add" id="committee-add-btn" disabled onclick="submitCommitteeArticle()">Add Article</button>
        </div>
    </div>
</div>

<!-- Shared Scripts -->
<script src="js/supabase-client.js"></script>
<script src="js/common.js"></script>

<!-- Page-Specific Script -->
<script>
/**
 * Laws Page
 * Browse laws, draft bills, committee review
 */

// Page state
let currentNation = null;
let currentFaction = null;
let currentSeats = 0;
let allPartySeats = {};
let allParties = [];
let allPolicies = [];
let activeLaws = [];
let committeeBills = [];
let floorBills = [];

// Draft state
let draftArticles = [];
let selectedPolicy = null;
let committeeSelectedPolicy = null;
let currentCommitteeBillId = null;

// Major sectors configuration
const MAJOR_SECTORS = [
    { key: 'ECONOMICS', label: 'Economics', icon: '💰' },
    { key: 'LABOR', label: 'Labor', icon: '👷' },
    { key: 'EDUCATION', label: 'Education', icon: '📚' },
    { key: 'ENERGY', label: 'Energy', icon: '⚡' },
    { key: 'SOCIAL', label: 'Social', icon: '🏥' },
    { key: 'MILITARY', label: 'Military & Security', icon: '🛡️' },
    { key: 'GOVERNANCE', label: 'Governance', icon: '🏛️' },
    { key: 'IMMIGRATION', label: 'Immigration', icon: '🌍' },
    { key: 'INTERNATIONAL', label: 'International', icon: '🌐' }
];

// Initialize page
initPage('laws', async (state) => {
    const { nation, faction } = state;
    
    currentNation = nation;
    currentFaction = faction;
    
    if (!nation) {
        document.getElementById('content-area').innerHTML = `
            <div class="placeholder-panel">
                <div class="ph-icon">📜</div>
                <h3>No Nation Selected</h3>
                <p>Your party is not assigned to a nation yet.</p>
            </div>
        `;
        return;
    }
    
    await loadLawsData();
    renderLawsPage();
});

/**
 * Load all required data
 */
async function loadLawsData() {
    try {
        // Get all parties in nation
        const { data: parties } = await _supabase
            .from('factions')
            .select('id, faction_name, is_npc')
            .eq('nation_id', currentNation.id)
            .eq('faction_type', 'party');
        
        allParties = parties || [];
        
        // Get current party seats from latest election
        const { data: election } = await _supabase
            .from('elections')
            .select('results')
            .eq('nation_id', currentNation.id)
            .eq('status', 'completed')
            .order('election_tick', { ascending: false })
            .limit(1)
            .maybeSingle();
        
        if (election?.results?.seats) {
            election.results.seats.forEach(s => {
                allPartySeats[s.party_id] = s.seats;
            });
            currentSeats = allPartySeats[currentFaction?.id] || 0;
        }
        
        const [policiesRes, lawsRes, committeeRes, floorRes] = await Promise.all([
            _supabase.from('policies').select('*').eq('is_active', true),
            _supabase.from('active_laws').select('*, policies(*)').eq('nation_id', currentNation.id),
            _supabase.from('bills').select('*, factions(faction_name), bill_articles(*, policies(*), factions(faction_name)), bill_support(*)').eq('nation_id', currentNation.id).eq('status', 'committee'),
            _supabase.from('bills').select('*, factions(faction_name), bill_articles(*, policies(*))').eq('nation_id', currentNation.id).eq('status', 'floor')
        ]);
        
        allPolicies = policiesRes.data || [];
        activeLaws = lawsRes.data || [];
        committeeBills = committeeRes.data || [];
        floorBills = floorRes.data || [];
        
    } catch (error) {
        console.error('Error loading laws data:', error);
    }
}

/**
 * Render a single committee bill
 */
function renderCommitteeBill(bill) {
    // Calculate support percentage
    const support = bill.bill_support || [];
    const acceptedSeats = support.filter(s => s.stance === 'accept').reduce((sum, s) => sum + s.seat_count, 0);
    
    // Add sponsor's seats
    const sponsorSeats = allPartySeats[bill.proposed_by] || 0;
    const totalSupport = acceptedSeats + sponsorSeats;
    const supportPercent = Math.round((totalSupport / 120) * 100);
    const hasEnough = supportPercent >= 51;
    
    // Check if current party is sponsor
    const isSponsor = bill.proposed_by === currentFaction?.id;
    
    // Check current party's stance
    const myStance = support.find(s => s.faction_id === currentFaction?.id);
    
    return `
        <div class="committee-bill clickable-bill" onclick="window.location.href='bill.html?id=${bill.id}'">
            <div class="committee-bill-header">
                <div>
                    <div class="committee-bill-name">${bill.bill_name || 'Unnamed Bill'}</div>
                    <div class="committee-bill-sponsor">Proposed by ${bill.factions?.faction_name || 'Unknown'}</div>
                </div>
                <div class="committee-support">
                    <div class="support-percent ${hasEnough ? 'enough' : ''}">${supportPercent}%</div>
                    <div class="support-label">Support (need 51%)</div>
                </div>
            </div>
            
            <div class="support-bar">
                <div class="threshold-marker"></div>
                <div class="support-bar-fill ${hasEnough ? 'enough' : ''}" style="width: ${supportPercent}%"></div>
            </div>
            
            <div class="bill-articles">
                ${(bill.bill_articles || []).sort((a,b) => a.article_number - b.article_number).map(art => `
                    <div class="bill-article-item">
                        <div class="article-info">
                            <span class="article-title">Art. ${art.article_number}. ${art.policies?.policy_name || 'Unknown'}</span>
                            <span class="article-ideology">${art.policies?.ideology || ''}</span>
                            <div class="article-desc">${art.policies?.description || ''}</div>
                        </div>
                    </div>
                `).join('')}
            </div>
            
            <div class="click-hint" style="color: #ff9800;">Click to view full bill & negotiate →</div>
        </div>
    `;
}

/**
 * Render all party stances for a committee bill
 */
function renderAllPartyStances(bill, isSponsor, myStance, hasEnough, support) {
    return allParties.map(party => {
        const partySeats = allPartySeats[party.id] || 0;
        const isCurrentParty = party.id === currentFaction?.id;
        const isPartyTheSponsor = party.id === bill.proposed_by;
        const partyStance = support.find(s => s.faction_id === party.id);
        
        let actionHtml = '';
        
        if (isPartyTheSponsor) {
            actionHtml = `
                <span class="stance-badge stance-sponsor">SPONSOR</span>
                ${isCurrentParty && hasEnough ? `<button class="stance-btn send-floor" onclick="sendToFloor('${bill.id}')">Send to Floor</button>` : ''}
                ${isCurrentParty ? `<button class="stance-btn retract" onclick="retractBill('${bill.id}')">Retract</button>` : ''}
            `;
        } else if (partyStance) {
            actionHtml = `<span class="stance-badge stance-${partyStance.stance}">${partyStance.stance.toUpperCase()}</span>`;
        } else if (isCurrentParty) {
            actionHtml = `
                <button class="stance-btn accept" onclick="setStance('${bill.id}', 'accept')">Accept</button>
                <button class="stance-btn reject" onclick="setStance('${bill.id}', 'reject')">Reject</button>
                <button class="stance-btn add-article" onclick="openCommitteeAddModal('${bill.id}')">+ Add Article</button>
            `;
        } else {
            actionHtml = `<span class="stance-badge stance-pending">PENDING</span>`;
        }
        
        return `
            <div class="party-stance-row">
                <div class="party-stance-info">
                    <span class="party-stance-name">${party.faction_name}${party.is_npc ? ' [AI]' : ''}</span>
                    <span class="party-stance-seats">(${partySeats} seats)</span>
                </div>
                <div class="party-stance-actions">
                    ${actionHtml}
                </div>
            </div>
        `;
    }).join('');
}

}

/**
 * Get policies compatible with player's ideology
 */
function getCompatiblePolicies(sector) {
    const ideo1 = (currentFaction.ideology_value_1 || '').toUpperCase();
    const ideo2 = (currentFaction.ideology_value_2 || '').toUpperCase();
    
    // Filter out policies already in draft
    const draftPolicyIds = draftArticles.map(a => a.policy.id);
    
    return allPolicies.filter(p => 
        p.major_sector === sector &&
        (p.ideology.toUpperCase() === ideo1 || p.ideology.toUpperCase() === ideo2) &&
        !draftPolicyIds.includes(p.id)
    );
}

    if (!selectedPolicy) return;
    
    draftArticles.push({

        policy: selectedPolicy
    });
    
    renderDraftArticles();
    hideAddArticleForm();

    if (draftArticles.length > 0) {

    if (draftArticles.length === 0) {

    container.innerHTML = draftArticles.map((art, index) => `

        </div>

 */

    draftArticles.splice(index, 1);
    
    // Renumber
    draftArticles.forEach((art, i) => {
        art.articleNumber = i + 2;
    });
    
    renderDraftArticles();
    
    if (draftArticles.length === 0) {
        document.getElementById('bill-name-section').style.display = 'none';
        document.getElementById('submit-bill-btn').disabled = true;
    }
}

/**
 * Submit bill to committee
 */
async function submitToCommittee() {
    if (draftArticles.length === 0) return;
    
    const billName = document.getElementById('bill-name-input').value.trim() || 'Unnamed Bill';
    
    try {
        // Get current tick
        const { data: shard } = await _supabase
            .from('shard')
            .select('current_tick')
            .eq('name', 'Alpha Shard')
            .single();
        
        const currentTick = shard?.current_tick || 0;
        
        // Create bill
        const { data: bill, error: billError } = await _supabase
            .from('bills')
            .insert({
                nation_id: currentNation.id,
                proposed_by: currentFaction.id,
                proposed_tick: currentTick,
                bill_name: billName,
                status: 'committee',
                preamble: `This bill, put forth in the legislature of the nation of ${currentNation.name}, by the ${currentFaction.faction_name}, seeks to enact the following provisions.`
            })
            .select()
            .single();
        
        if (billError) throw billError;
        
        // Create articles
        const articles = draftArticles.map(art => ({
            bill_id: bill.id,
            policy_id: art.policy.id,
            article_number: art.articleNumber,
            added_by: currentFaction.id
        }));
        
        const { error: articlesError } = await _supabase
            .from('bill_articles')
            .insert(articles);
        
        if (articlesError) throw articlesError;
        
        // Deduct AP
        await _supabase
            .from('factions')
            .update({ action_points: currentFaction.action_points - 2 })
            .eq('id', currentFaction.id);
        
        currentFaction.action_points -= 2;
        
        // Trigger NPC voting
        await _supabase.rpc('process_npc_committee_votes', { p_nation_id: currentNation.id });
        
        closeModal();
        await loadLawsData();
        renderLawsPage();
        
        alert(`"${billName}" submitted to committee!`);
        
    } catch (error) {
        console.error('Error submitting bill:', error);
        alert('Error submitting bill. Please try again.');
    }
}

/**
 * Set stance on a bill
 */
async function setStance(billId, stance) {
    try {
        const { error } = await _supabase
            .from('bill_support')
            .upsert({
                bill_id: billId,
                faction_id: currentFaction.id,
                stance: stance,
                seat_count: currentSeats
            }, { onConflict: 'bill_id,faction_id' });
        
        if (error) throw error;
        
        await loadLawsData();
        renderLawsPage();
        
    } catch (error) {
        console.error('Error setting stance:', error);
        alert('Error setting stance.');
    }
}

/**
 * Retract a bill from committee
 */
async function retractBill(billId) {
    if (!confirm('Are you sure you want to retract this bill? This cannot be undone.')) {
        return;
    }
    
    try {
        // Delete bill support first (foreign key)
        await _supabase
            .from('bill_support')
            .delete()
            .eq('bill_id', billId);
        
        // Delete bill articles (foreign key)
        await _supabase
            .from('bill_articles')
            .delete()
            .eq('bill_id', billId);
        
        // Delete the bill
        const { error } = await _supabase
            .from('bills')
            .delete()
            .eq('id', billId);
        
        if (error) throw error;
        
        await loadLawsData();
        renderLawsPage();
        
        alert('Bill retracted.');
        
    } catch (error) {
        console.error('Error retracting bill:', error);
        alert('Error retracting bill.');
    }
}

/**
 * Submit article to committee bill
 */
async function submitCommitteeArticle() {
    if (!committeeSelectedPolicy || !currentCommitteeBillId) return;
    
    try {
        // Get current article count
        const { data: existingArticles } = await _supabase
            .from('bill_articles')
            .select('article_number')
            .eq('bill_id', currentCommitteeBillId)
            .order('article_number', { ascending: false })
            .limit(1);
        
        const nextArticleNum = (existingArticles?.[0]?.article_number || 1) + 1;
        
        // Add article
        const { error } = await _supabase
            .from('bill_articles')
            .insert({
                bill_id: currentCommitteeBillId,
                policy_id: committeeSelectedPolicy.id,
                article_number: nextArticleNum,
                added_by: currentFaction.id
            });
        
        if (error) throw error;
        
        // Auto-accept the bill
        await _supabase
            .from('bill_support')
            .upsert({
                bill_id: currentCommitteeBillId,
                faction_id: currentFaction.id,
                stance: 'accept',
                seat_count: currentSeats
            }, { onConflict: 'bill_id,faction_id' });
        
        closeCommitteeAddModal();
        await loadLawsData();
        renderLawsPage();
        
    } catch (error) {
        console.error('Error adding article:', error);
        alert('Error adding article.');
    }
}

/**
 * Send bill to floor
 */
async function sendToFloor(billId) {
    try {
        const { data: shard } = await _supabase
            .from('shard')
            .select('current_tick')
            .eq('name', 'Alpha Shard')
            .single();
        
        const currentTick = shard?.current_tick || 0;
        
        const { error } = await _supabase
            .from('bills')
            .update({
                status: 'floor',
                voting_ends_tick: currentTick + 3
            })
            .eq('id', billId);
        
        if (error) throw error;
        
        await loadLawsData();
        renderLawsPage();
        
        alert('Bill sent to the floor for voting!');
        
    } catch (error) {
        console.error('Error sending to floor:', error);
        alert('Error sending bill to floor.');
    }
}

// ==================== UTILITIES ====================

function formatStatName(stat) {
    return stat.charAt(0).toUpperCase() + stat.slice(1).replace(/_/g, ' ');
}

function formatMinorSector(key) {
    return key.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}
