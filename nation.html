        <div class="loading-spinner"></div>
        <div>Loading nation data...</div>
    </div>

<!-- Shared Scripts -->

<!-- Page-Specific Script -->
<script type="module">
import { _supabase } from './js/supabase-client.js';
import { initPage, qCache, qCacheSet, formatNumber, scaleRawToDollars } from './js/common.js';
import { formatCurrencyShort } from './js/utils.js';
import { CANONICAL_GOVERNMENT_TYPES, isAutocracy, isPresidentialRepublic, getCanonicalGovernmentType, INVERTED_STATS, STATS_HIGHER_IS_BETTER, STATS_LOWER_IS_BETTER, normalizeNationStatKey, STAT_DECAY_CONFIG } from './js/game-common.js';
/**
 * Nation Page - Comprehensive Stats Display
 * With Rankings and Trend Arrows
 */

// All nations data for rankings
let allNations = [];
let totalNations = 0;
let previousTickData = null;
var statEffectsByKey = {};

// Initialize page
initPage('nation', async (state) => {
    const { nation, faction } = state;
    
    if (!nation) {
        document.getElementById('content-area').innerHTML = '<div class="placeholder-panel"><div class="ph-icon">🏴</div><h3>No Nation Selected</h3><p>Your party is not assigned to a nation yet.</p></div>';
        return;
    }
    
    // Fix placeholder government_type values from DB
    if (!nation.government_type || nation.government_type.toLowerCase().includes('your_gov_here')) {
        if (nation.name === 'San Estrella') nation.government_type = CANONICAL_GOVERNMENT_TYPES.PRESIDENTIAL_REPUBLIC;
    }

    await loadAllNations();
    await loadPreviousTickData(nation.id);
    await loadStatEffectSources(nation.id, nation);
    await renderNationPage(nation);
});

async function loadAllNations() {
    const cached = qCache('all_nations');
    if (cached) { allNations = cached; totalNations = cached.length; return; }
    const { data: nations, error } = await _supabase.from('nations').select('*');
    if (!error && nations) { allNations = nations; totalNations = nations.length; qCacheSet('all_nations', nations, 2 * 60 * 1000); }
}

async function loadPreviousTickData(nationId) {
    const cacheKey = 'prev_tick_' + nationId;
    const cached = qCache(cacheKey);
    if (cached) { previousTickData = cached; return; }
    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    if (!shard) { console.warn('[loadPreviousTickData] Shard not found — stat deltas unavailable'); return; }
    const previousTick = shard.current_tick - 1;
    if (previousTick < 0) { console.warn('[loadPreviousTickData] current_tick is', shard.current_tick, '— no previous tick yet'); return; }

    // Use .limit(1) instead of .maybeSingle() — maybeSingle sends an Accept header
    // that causes PostgREST to return HTTP 406 when 0 rows match, which logs a
    // console error even though supabase-js handles it gracefully.
    const { data: historyRows, error } = await _supabase.from('nations_history')
        .select('*').eq('nation_id', nationId).eq('tick', previousTick).limit(1);
    if (error) {
        console.warn('[loadPreviousTickData] Query error for tick ' + previousTick + ':', error.message);
    }
    const history = (historyRows && historyRows.length > 0) ? historyRows[0] : null;
    if (history) {
        previousTickData = history;
        qCacheSet(cacheKey, history, 5 * 60 * 1000);
        return;
    }

    // Fallback: grab the most recent history row before the current tick.
    // Covers gaps where a specific tick's snapshot failed or was skipped.
    const { data: fallback, error: fbErr } = await _supabase.from('nations_history')
        .select('*').eq('nation_id', nationId).lt('tick', shard.current_tick)
        .order('tick', { ascending: false }).limit(1);
    if (fbErr) {
        console.warn('[loadPreviousTickData] Fallback query error:', fbErr.message);
        return;
    }
    if (fallback && fallback.length > 0) {
        previousTickData = fallback[0];
        qCacheSet(cacheKey, fallback[0], 5 * 60 * 1000);
    }
    if (!previousTickData) {
        console.warn('[loadPreviousTickData] No history rows found for nation', nationId,
            'at tick', previousTick, 'or earlier.',
            'Stat change indicators (▲/▼) will not display.',
            'Ensure: (1) nations_history table has UNIQUE(nation_id, tick) constraint,',
            '(2) RLS SELECT policy exists on nations_history,',
            '(3) advance-tick edge function has run at least 2 ticks.');
    }
}

// ===== Affected-By: Data Fetching =====

async function loadStatEffectSources(nationId, nation) {
    var cacheKey = 'stat_effects_' + nationId;
    var cached = qCache(cacheKey);
    if (cached) { statEffectsByKey = cached; return; }

    var results = await Promise.all([
        _supabase.from('active_laws')
            .select('is_reversal, policies(policy_name, stat_effects)')
            .eq('nation_id', nationId),
        _supabase.from('active_crises')
            .select('crisis_id, crisis_templates(name, crisis_effects(stat_key, change_per_tick, target))')
            .eq('nation_id', nationId),
        _supabase.from('ministry_action_log')
            .select('action_key, stat_effects')
            .eq('nation_id', nationId)
            .eq('processed', false),
        _supabase.from('diplomatic_action_log')
            .select('action_type, stat_effects')
            .eq('nation_id', nationId)
            .eq('processed', false),
        loadLeaderTraitEffects(nationId, nation)
    ]);

    var map = {};
    parsePolicyEffects(results[0].data || [], map);
    parseCrisisEffects(results[1].data || [], map);
    parseMinistryEffects(results[2].data || [], map);
    parseDiplomaticEffects(results[3].data || [], map);
    parseLeaderTraitEffects(results[4], map);
    parseDecayEffects(nation, map);

    statEffectsByKey = map;
    qCacheSet(cacheKey, map, 2 * 60 * 1000);
}

async function loadLeaderTraitEffects(nationId, nation) {
    try {
        if (isPresidentialRepublic(nation)) {
            var res = await _supabase.from('presidents')
                .select('trait, first_name, last_name')
                .eq('nation_id', nationId)
                .eq('is_active', true)
                .limit(1);
            if (!res.data || res.data.length === 0 || !res.data[0].trait) return null;
            var president = res.data[0];
            var traitRes = await _supabase.from('leader_traits')
                .select('trait_key, effects')
                .eq('trait_key', president.trait)
                .limit(1);
            if (!traitRes.data || traitRes.data.length === 0) return null;
            return { name: president.first_name + ' ' + president.last_name, traitKey: traitRes.data[0].trait_key, effects: traitRes.data[0].effects };
        } else {
            var res = await _supabase.from('head_of_government')
                .select('first_name, last_name, trait_key, leader_traits(trait_key, effects)')
                .eq('nation_id', nationId)
                .eq('active', true)
                .limit(1);
            if (!res.data || res.data.length === 0) return null;
            var hog = res.data[0];
            if (!hog.leader_traits || !hog.leader_traits.effects) return null;
            return { name: hog.first_name + ' ' + hog.last_name, traitKey: hog.leader_traits.trait_key, effects: hog.leader_traits.effects };
        }
    } catch (e) {
        console.warn('[loadLeaderTraitEffects] Error:', e);
        return null;
    }
}

function addEffectToMap(map, statKey, name, direction, type) {
    var key = normalizeNationStatKey(statKey);
    if (!key) return;
    if (!map[key]) map[key] = [];
    // Deduplicate
    for (var i = 0; i < map[key].length; i++) {
        if (map[key][i].name === name && map[key][i].direction === direction && map[key][i].type === type) return;
    }
    map[key].push({ name: name, direction: direction, type: type });
}

function parsePolicyEffects(laws, map) {
    for (var i = 0; i < laws.length; i++) {
        var law = laws[i];
        if (law.is_reversal) continue;
        var policy = law.policies;
        if (!policy) continue;
        var effects = policy.stat_effects;
        if (!effects || !Array.isArray(effects)) continue;
        for (var j = 0; j < effects.length; j++) {
            var eff = effects[j];
            if (!eff.stat_key) continue;
            var dir = (eff.direction || 'up').toLowerCase() === 'up' ? 'up' : 'down';
            addEffectToMap(map, eff.stat_key, policy.policy_name, dir, 'Policy');
        }
    }
}

function parseCrisisEffects(crises, map) {
    for (var i = 0; i < crises.length; i++) {
        var c = crises[i];
        var t = c.crisis_templates;
        if (!t) continue;
        var effects = t.crisis_effects || [];
        for (var j = 0; j < effects.length; j++) {
            var eff = effects[j];
            if (eff.target !== 'nation' || !eff.stat_key) continue;
            var dir = eff.change_per_tick > 0 ? 'up' : 'down';
            addEffectToMap(map, eff.stat_key, t.name, dir, 'Crisis');
        }
    }
}

function parseMinistryEffects(actions, map) {
    for (var i = 0; i < actions.length; i++) {
        var action = actions[i];
        var effects = action.stat_effects;
        if (!effects || !Array.isArray(effects)) continue;
        for (var j = 0; j < effects.length; j++) {
            var eff = effects[j];
            if (eff.target && eff.target !== 'nation') continue;
            if (!eff.stat_key) continue;
            var dir = (eff.direction || 'up').toLowerCase() === 'up' ? 'up' : 'down';
            addEffectToMap(map, eff.stat_key, prettyStatName(action.action_key), dir, 'Ministry Action');
        }
    }
}

function parseDiplomaticEffects(actions, map) {
    for (var i = 0; i < actions.length; i++) {
        var action = actions[i];
        var effects = action.stat_effects;
        if (!effects || !Array.isArray(effects)) continue;
        for (var j = 0; j < effects.length; j++) {
            var eff = effects[j];
            if (!eff.stat_key) continue;
            var dir = (eff.direction || 'up').toLowerCase() === 'up' ? 'up' : 'down';
            addEffectToMap(map, eff.stat_key, prettyStatName(action.action_type), dir, 'Diplomatic Action');
        }
    }
}

function parseLeaderTraitEffects(traitData, map) {
    if (!traitData || !traitData.effects || !traitData.effects.nation_stat_per_tick) return;
    var perTick = traitData.effects.nation_stat_per_tick;
    var traitLabel = prettyStatName(traitData.traitKey);
    for (var rawStat in perTick) {
        if (!perTick.hasOwnProperty(rawStat)) continue;
        var delta = perTick[rawStat];
        if (delta === 0) continue;
        addEffectToMap(map, rawStat, traitLabel, delta > 0 ? 'up' : 'down', 'Leader Trait');
    }
}

function parseDecayEffects(nation, map) {
    for (var statKey in STAT_DECAY_CONFIG) {
        if (!STAT_DECAY_CONFIG.hasOwnProperty(statKey)) continue;
        var config = STAT_DECAY_CONFIG[statKey];
        var currentVal = nation[statKey] !== undefined && nation[statKey] !== null ? Number(nation[statKey]) : 50;
        if (currentVal === config.target) continue;
        var dir = currentVal > config.target ? 'down' : 'up';
        var label = config.type === 'erosion' ? 'Natural Erosion' : 'Natural Decay';
        addEffectToMap(map, statKey, label, dir, 'Decay');
    }
}

// ===== End Affected-By Data Fetching =====

function calculateRanking(statKey, value, inverted = false) {
    if (value === null || value === undefined) return null;
    const values = allNations.map(n => n[statKey]).filter(v => v !== null && v !== undefined);
    if (values.length === 0) return null;
    const sorted = [...values].sort((a, b) => inverted ? a - b : b - a);
    return sorted.indexOf(value) + 1;
}

function roundDelta(val) {
    return Math.abs(val) >= 1 ? Math.round(val).toString() : val.toFixed(1);
}

function getTrendArrow(statKey, currentValue, inverted, format) {
    if (!previousTickData || currentValue === null || currentValue === undefined) {
        return '<span class="trend-arrow trend-neutral">―</span>';
    }
    var historyKey = statKey === 'GDP' ? 'gdp' : statKey;
    var previousValue = previousTickData[historyKey];
    if (previousValue === null || previousValue === undefined) {
        return '<span class="trend-arrow trend-neutral">―</span>';
    }
    var delta = currentValue - previousValue;
    var invertedClass = inverted ? ' inverted' : '';
    // GDP/debt are stored as raw dollars — delta is already in dollars, no scaling needed.
    if (delta > 0) {
        var formatted = (format === 'currency' || format === 'gdp') ? '+' + formatCurrencyShort(delta) : '+' + roundDelta(delta);
        return '<span class="trend-arrow trend-up' + invertedClass + '">▲ ' + formatted + '</span>';
    } else if (delta < 0) {
        var formatted = (format === 'currency' || format === 'gdp') ? formatCurrencyShort(delta) : roundDelta(delta);
        return '<span class="trend-arrow trend-down' + invertedClass + '">▼ ' + formatted + '</span>';
    }
    return '<span class="trend-arrow trend-neutral">―</span>';
}

function prettyStatName(key) {
    return key.replace(/_/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
}

async function getShardTick() {
    var cached = qCache('shard_current_tick');
    if (cached) return cached;
    var res = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    if (res.data) { qCacheSet('shard_current_tick', res.data.current_tick, 30 * 1000); return res.data.current_tick; }
    return 0;
}

async function renderRevolutionBanner(nation) {
    // Check for post-revolution celebration banner (query event_log for recent DEMOCRATIC_REVOLUTION)
    var currentTick = await getShardTick();
    var revRes = await _supabase
        .from('event_log')
        .select('fired_at_tick, description_used')
        .eq('nation_id', nation.id)
        .eq('event_name', 'DEMOCRATIC_REVOLUTION')
        .order('fired_at_tick', { ascending: false })
        .limit(1)
        .maybeSingle();
    if (revRes.data && (currentTick - revRes.data.fired_at_tick) <= 5) {
        var ticksAgo = currentTick - revRes.data.fired_at_tick;
        var electionTick = revRes.data.fired_at_tick + 3;
        var ticksUntilElection = Math.max(0, electionTick - currentTick);
        var h = '<div class="revolution-complete-banner">';
        h += '<div class="revolution-icon">&#x1F3DB;</div>';
        h += '<div class="revolution-title">Revolution in the Streets!</div>';
        h += '<div class="revolution-subtitle">' + revRes.data.description_used + '</div>';
        if (ticksUntilElection > 0) {
            h += '<div style="margin-top:12px;">';
            h += '<span class="revolution-tag">Emergency Elections in ' + ticksUntilElection + ' tick' + (ticksUntilElection !== 1 ? 's' : '') + '</span>';
            h += '<span class="revolution-tag">Democracy Established</span>';
            h += '</div>';
        } else {
            h += '<div style="margin-top:12px;"><span class="revolution-tag">Democracy Established</span><span class="revolution-tag">Elections Complete</span></div>';
        }
        h += '</div>';
        return h;
    }

    // Check for active revolution countdown (Autocracy only)
    if (isAutocracy(nation) && nation.revolution_started_tick != null && nation.revolution_duration != null) {
        var elapsed = currentTick - nation.revolution_started_tick;
        var remaining = Math.max(0, nation.revolution_duration - elapsed);
        var h = '<div class="revolution-banner">';
        h += '<div class="revolution-icon">&#x1F525;</div>';
        h += '<div class="revolution-title">Democratic Revolution</div>';
        h += '<div class="revolution-subtitle">The people demand democracy. Pro-democracy protests grow stronger each day. The regime must act to restore order — or fall.</div>';
        h += '<div class="revolution-countdown">' + remaining + ' tick' + (remaining !== 1 ? 's' : '') + ' until revolution</div>';
        h += '</div>';
        return h;
    }

    return '';
}

async function renderCrisisSection(nationId, nation) {
    var h = '<div class="crisis-section"><div class="section-header">Ongoing Crises</div><div class="crisis-grid">';

    var crises = [];
    var cacheKey = 'crises_' + nationId;
    var cached = qCache(cacheKey);
    if (cached) {
        crises = cached;
    } else {
        var res = await _supabase
            .from('active_crises')
            .select('crisis_id, crisis_templates(name, description, crisis_end_triggers(stat_key), crisis_effects(stat_key, change_per_tick, target))')
            .eq('nation_id', nationId);
        if (!res.error && res.data) {
            crises = res.data;
            qCacheSet(cacheKey, crises, 2 * 60 * 1000);
        }
    }

    // Add revolution crisis box if active
    var hasRevolution = nation && isAutocracy(nation) && nation.revolution_started_tick != null && nation.revolution_duration != null;
    if (hasRevolution) {
        var currentTick = await getShardTick();
        var elapsed = currentTick - nation.revolution_started_tick;
        var remaining = Math.max(0, nation.revolution_duration - elapsed);
        h += '<div class="crisis-box active">';
        h += '<div class="crisis-name">Democratic Revolution</div>';
        h += '<div class="crisis-desc">The people demand democracy. Revolution grows stronger each day. ' + remaining + ' tick' + (remaining !== 1 ? 's' : '') + ' remain.</div>';
        h += '<div class="crisis-rising">Worsening: <span>Stability</span>, <span>Civil Unrest</span>, <span>Intl. Reputation</span></div>';
        h += '<div class="crisis-recovery">Avert: <span>Stability &ge; 15</span> or <span>Freedom &le; 50</span> or <span>Unrest &le; 70</span></div>';
        h += '</div>';
    }

    if (crises.length === 0 && !hasRevolution) {
        h += '<div class="crisis-box">No active crises</div>';
        h += '<div class="crisis-box">No active crises</div>';
    } else {
        for (var i = 0; i < crises.length; i++) {
            var c = crises[i];
            var t = c.crisis_templates;
            if (!t) continue;
            var endTriggers = t.crisis_end_triggers || [];
            var statNames = [];
            for (var j = 0; j < endTriggers.length; j++) {
                statNames.push(prettyStatName(endTriggers[j].stat_key));
            }
            var effects = t.crisis_effects || [];
            var risingStats = [];
            var fallingStats = [];
            for (var k = 0; k < effects.length; k++) {
                if (effects[k].target === 'nation' && effects[k].stat_key) {
                    if (effects[k].change_per_tick > 0) {
                        risingStats.push(prettyStatName(effects[k].stat_key));
                    } else if (effects[k].change_per_tick < 0) {
                        fallingStats.push(prettyStatName(effects[k].stat_key));
                    }
                }
            }
            h += '<div class="crisis-box active">';
            h += '<div class="crisis-name">' + t.name + '</div>';
            h += '<div class="crisis-desc">' + t.description + '</div>';
            if (risingStats.length > 0) {
                h += '<div class="crisis-rising">Rising: <span>' + risingStats.join('</span>, <span>') + '</span></div>';
            }
            if (fallingStats.length > 0) {
                h += '<div class="crisis-falling">Falling: <span>' + fallingStats.join('</span>, <span>') + '</span></div>';
            }
            if (statNames.length > 0) {
                h += '<div class="crisis-recovery">Recovery: <span>' + statNames.join('</span>, <span>') + '</span></div>';
            }
            h += '</div>';
        }
        // Fill empty slot if odd number of crises
        var totalBoxes = crises.length + (hasRevolution ? 1 : 0);
        if (totalBoxes % 2 !== 0) {
            h += '<div class="crisis-box">No additional crises</div>';
        }
    }

    h += '</div></div>';
    return h;
}

/**
 * Main render — uses string concatenation to avoid template literal escaping issues
 */
async function renderNationPage(nation) {
    var h = '';

    // Overview
    h += '<div class="nation-overview">';
    h += '<h1>' + nation.name + '</h1>';
    h += '<div class="overview-grid">';
    h += '<div class="overview-item"><div class="overview-label">Capital</div><div class="overview-value">' + (nation.capital || '—') + '</div></div>';
    h += '<div class="overview-item"><div class="overview-label">Government</div><div class="overview-value">' + (isPresidentialRepublic(nation) ? 'Presidential Republic' : (getCanonicalGovernmentType(nation, nation.government_type || '—'))) + '</div></div>';
    h += '<div class="overview-item"><div class="overview-label">Population</div><div class="overview-value">' + formatNumber(nation.population) + '</div></div>';
    var govAppr = nation.gov_approval ?? nation.national_approval ?? 50;
    var govInst = Math.round(nation.gov_approval_institutional ?? 50);
    var govOutc = Math.round(nation.gov_approval_outcomes ?? 50);
    var govEvRaw = nation.gov_approval_events ?? 0;
    var govEv = Math.round(Math.max(0, Math.min(100, 50 + govEvRaw)));
    h += '<div class="overview-item"><div class="overview-label">Government Approval</div><div class="overview-value gold">' + govAppr + '%</div>'
       + '<div class="gov-components">'
       + '<span class="gov-comp" title="Ministers & leadership">Inst ' + govInst + '</span>'
       + '<span class="gov-comp" title="Economic & social outcomes">Out ' + govOutc + '</span>'
       + '<span class="gov-comp" title="Recent events (decays)">Evt ' + govEv + '</span>'
       + '</div></div>';
    h += '<div class="overview-item"><div class="overview-label">GDP</div><div class="overview-value gold">' + formatCurrencyShort(scaleRawToDollars(nation.gdp)) + '</div></div>';
    h += '</div></div>';

    // Revolution banner (above crises)
    h += await renderRevolutionBanner(nation);

    // Crises
    h += await renderCrisisSection(nation.id, nation);

    // Stats
    h += '<div class="stats-section">';

    // ECONOMIC
    h += sectorBlock('💰', 'Economic', [
        renderStatBox('GDP', 'gdp', nation.gdp, 'Gross domestic product', 'gdp', false, scaleRawToDollars(nation.gdp)),
        renderStatBox('GDP Growth', 'gdp_growth', nation.gdp_growth, 'Annual economic growth rate'),
        renderStatBox('National Debt', 'debt', nation.debt, 'Government debt obligations', 'currency', true, scaleRawToDollars(nation.debt)),
        renderStatBox('Debt Growth', 'debt_growth', nation.debt_growth, 'Rate of debt accumulation', null, true),
        renderStatBox('Inflation', 'inflation', nation.inflation, 'Rate of price increases', null, true),
        renderStatBox('Interest Rates', 'interest_rates', nation.interest_rates, 'Central bank lending rate'),
        renderStatBox('Trade Balance', 'trade_balance', nation.trade_balance, 'Exports minus imports'),
        renderStatBox('Currency Strength', 'currency_strength', nation.currency_strength, 'Value of national currency'),
        renderStatBox('Foreign Investment', 'foreign_investment', nation.foreign_investment, 'International capital inflow'),
        renderStatBox('Credit Rating', 'credit', nation.credit, 'National creditworthiness')
    ]);

    // TAXATION
    h += sectorBlock('🧾', 'Taxation', [
        renderStatBox('Income Tax', 'income_tax', nation.income_tax, 'Tax rate on personal income'),
        renderStatBox('Corporate Tax', 'corporate_tax', nation.corporate_tax, 'Tax rate on business profits'),
        renderStatBox('Sales Tax', 'sales_tax', nation.sales_tax, 'Tax on goods and services'),
        renderStatBox('Tariffs', 'tariffs', nation.tariffs, 'Import/export duties')
    ]);

    // LABOR
    h += sectorBlock('👷', 'Labor & Employment', [
        renderStatBox('Unemployment', 'unemployment', nation.unemployment, 'Percentage without work', null, true),
        renderStatBox('Labor Participation', 'labor_force_participation', nation.labor_force_participation, 'Working-age adults employed'),
        renderStatBox('Minimum Wage', 'minimum_wage', nation.minimum_wage, 'Lowest legal hourly wage'),
        renderStatBox('Union Strength', 'union_strength', nation.union_strength, 'Power of labor unions'),
        renderStatBox('Poverty Rate', 'poverty_rate', nation.poverty_rate, 'Population below poverty line', null, true),
        renderStatBox('Income Inequality', 'income_inequality', nation.income_inequality, 'Gap between rich and poor', null, true)
    ]);

    // DEMOGRAPHICS
    h += sectorBlock('👥', 'Demographics', [

// ===== Affected-By: Click Handlers =====

function attachStatBoxClickHandlers() {
    var statBoxes = document.querySelectorAll('.stat-box[data-stat-key]');
    for (var i = 0; i < statBoxes.length; i++) {
        statBoxes[i].addEventListener('click', handleStatBoxClick);
    }
}

function handleStatBoxClick(e) {
    var box = this;
    var statKey = box.getAttribute('data-stat-key');
    var panel = document.getElementById('abp-' + statKey);
    if (!panel) return;

    var isOpen = box.classList.contains('stat-box-expanded');

    // Accordion: close all open panels
    var allExpanded = document.querySelectorAll('.stat-box-expanded');
    for (var i = 0; i < allExpanded.length; i++) {
        allExpanded[i].classList.remove('stat-box-expanded');
        var otherPanel = allExpanded[i].querySelector('.affected-by-panel');
        if (otherPanel) otherPanel.innerHTML = '';
    }

    // If was already open, just close (done above)
    if (isOpen) return;

    // Populate and open
    box.classList.add('stat-box-expanded');
    panel.innerHTML = buildAffectedByContent(statKey);
}

function buildAffectedByContent(statKey) {
    var effects = statEffectsByKey[statKey] || [];
    if (effects.length === 0) {
        return '<div class="affected-by-empty">No active effects</div>';
    }

    var h = '<div class="affected-by-title">Affected By</div>';
    for (var i = 0; i < effects.length; i++) {
        var eff = effects[i];
        var arrow = eff.direction === 'up' ? '&#9650;' : '&#9660;';
        var arrowClass = eff.direction === 'up' ? 'ab-arrow-up' : 'ab-arrow-down';
        var typeClass = 'ab-type-' + eff.type.toLowerCase().replace(/ /g, '-');
        h += '<div class="affected-by-row">';
        h += '<span class="ab-name">' + eff.name + '</span>';
        h += '<span class="ab-arrow ' + arrowClass + '">' + arrow + '</span>';
        h += '<span class="ab-type ' + typeClass + '">' + eff.type + '</span>';
        h += '</div>';
    }
    return h;
}

// ===== End Affected-By Click Handlers =====

/**
 * Helper: wrap stat boxes in a sector block
 */
function sectorBlock(icon, title, boxes) {
    return '<div class="sector-block"><div class="sector-header"><span class="sector-icon">' + icon + '</span> ' + title + '</div><div class="stat-boxes">' + boxes.join('') + '</div></div>';
}

/**
 * Render a single stat box with ranking and trend
 */
function renderStatBox(name, statKey, value, description, format, inverted, displayValue) {
    format = format || null;
    inverted = inverted || false;
    var numValue = parseInt(value) || 0;

    var colorClass = 'medium';
    if (value !== null && value !== undefined) {
        if (inverted) {
            if (numValue <= 30) colorClass = 'good';
            else if (numValue <= 60) colorClass = 'medium';
            else colorClass = 'bad';
        } else {
            if (numValue >= 70) colorClass = 'good';
            else if (numValue >= 40) colorClass = 'medium';
            else colorClass = 'bad';
        }
    }

    var showValue = (displayValue !== undefined) ? displayValue : value;
    var formattedValue = (showValue !== null && showValue !== undefined) ? (typeof showValue === 'number' ? Math.round(showValue * 10) / 10 : showValue) : 'N/A';
    if (format === 'currency' && typeof showValue === 'number') formattedValue = formatCurrencyShort(showValue);
    else if (format === 'gdp' && typeof showValue === 'number') formattedValue = formatCurrencyShort(showValue);
    else if (format === 'years' && typeof showValue === 'number') formattedValue = Math.round(showValue * 10) / 10 + ' yrs';

    var trendArrow = getTrendArrow(statKey, value, inverted, format);
    var rank = calculateRanking(statKey, value, inverted);
    var rankHTML = rank ? '<div class="stat-box-footer"><span class="ranking-badge' + (rank === 1 ? ' first' : '') + '">#' + rank + ' of ' + totalNations + '</span></div>' : '';

    var effectCount = (statEffectsByKey[statKey] || []).length;
    var effectHint = effectCount > 0 ? '<span class="stat-effect-dot" title="' + effectCount + ' active effect' + (effectCount !== 1 ? 's' : '') + '"></span>' : '';

    return '<div class="stat-box ' + colorClass + '" data-stat-key="' + statKey + '">' +
        '<div class="stat-box-header">' +
            '<span class="stat-box-name">' + effectHint + name + '</span>' +
            '<span class="stat-box-value ' + colorClass + '">' + formattedValue + ' ' + trendArrow + '</span>' +
        '</div>' +
        '<div class="stat-box-desc">' + description + '</div>' +
        rankHTML +
        '<div class="affected-by-panel" id="abp-' + statKey + '"></div>' +
    '</div>';
}
