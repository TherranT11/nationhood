<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nation | Nationhood Alpha</title>
    
    <!-- Supabase SDK -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://pbumjalxclmegzckhqqr.supabase.co" crossorigin>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Shared Styles -->
    <link rel="stylesheet" href="css/dashboard.css">
    
    <!-- Page-Specific Styles -->
    <style>
    /* Nation Overview Header */
    .nation-overview {
        background: var(--topbar-bg);
        border-bottom: 2px solid var(--border-main);
        padding: 24px;
    }
    .nation-overview h1 {
        color: var(--accent);
        font-size: 2rem;
        text-transform: uppercase;
        letter-spacing: 3px;
        margin-bottom: 16px;
    }
    .overview-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
    }
    .overview-item {
        background: var(--bg-card);
        padding: 12px 16px;
        border-radius: 6px;
        border-left: 3px solid var(--accent);
    }
    .overview-label {
        font-size: 0.7rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 4px;
    }
    .overview-value {
        font-size: 1.1rem;
        color: var(--text-primary);
        font-weight: bold;
    }
    .overview-value.gold { color: var(--accent); }

    /* Crisis Section */
    .crisis-section {
        padding: 24px;
        background: var(--bg-panel);
        border-bottom: 1px solid var(--border-main);
    }
    .crisis-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
    }
    .crisis-box {
        background: var(--bg-card);
        border: 2px dashed var(--border-main);
        border-radius: 8px;
        padding: 40px;
        text-align: center;
        color: var(--text-dim);
        font-style: italic;
    }
    .crisis-box.active {
        border: 2px solid var(--red);
        background: var(--bg-card);
        color: var(--text-primary);
        font-style: normal;
        text-align: left;
        padding: 20px;
    }
    .crisis-box.active .crisis-name {
        color: var(--red);
        font-size: 1rem;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
    }
    .crisis-box.active .crisis-desc {
        color: var(--text-secondary);
        font-size: 0.78rem;
        line-height: 1.5;
        margin-bottom: 12px;
    }
    .crisis-box.active .crisis-recovery {
        font-size: 0.72rem;
        color: var(--text-muted);
    }
    .crisis-box.active .crisis-recovery span {
        color: var(--orange);
        font-weight: bold;
    }
    .crisis-box.active .crisis-rising {
        font-size: 0.72rem;
        color: var(--text-muted);
        margin-bottom: 4px;
    }
    .crisis-box.active .crisis-rising span {
        color: var(--red);
        font-weight: bold;
    }

    /* Revolution Banner */
    .revolution-banner {
        background: linear-gradient(135deg, #3a0a0a 0%, #1a0000 100%);
        border: 2px solid #f44336;
        border-radius: 12px;
        padding: 24px;
        margin: 0 24px 16px;
        text-align: center;
        animation: revolution-pulse 2s ease-in-out infinite;
    }
    @keyframes revolution-pulse {
        0%, 100% { border-color: #f44336; box-shadow: 0 0 0 rgba(244,67,54,0); }
        50% { border-color: #ff8a80; box-shadow: 0 0 30px rgba(244,67,54,0.4); }
    }
    .revolution-banner .revolution-icon { font-size: 2.5rem; margin-bottom: 8px; }
    .revolution-banner .revolution-title {
        font-size: 1.3rem; color: #f44336; font-weight: bold;
        text-transform: uppercase; letter-spacing: 3px; margin-bottom: 8px;
    }
    .revolution-banner .revolution-subtitle {
        font-size: 0.85rem; color: #cc8888; line-height: 1.5; margin-bottom: 12px;
    }
    .revolution-banner .revolution-countdown {
        display: inline-block; padding: 6px 20px;
        background: rgba(244,67,54,0.15); border: 1px solid #f44336;
        border-radius: 6px; font-family: monospace;
        font-size: 1.1rem; font-weight: bold; color: #f44336;
    }
    .revolution-complete-banner {
        background: linear-gradient(135deg, #0a2a0a 0%, #001a00 100%);
        border: 2px solid #4CAF50;
        border-radius: 12px;
        padding: 24px;
        margin: 0 24px 16px;
        text-align: center;
        animation: revolution-celebrate 3s ease-in-out infinite;
    }
    @keyframes revolution-celebrate {
        0%, 100% { border-color: #4CAF50; box-shadow: 0 0 0 rgba(76,175,80,0); }
        50% { border-color: #81C784; box-shadow: 0 0 30px rgba(76,175,80,0.3); }
    }
    .revolution-complete-banner .revolution-icon { font-size: 2.5rem; margin-bottom: 8px; }
    .revolution-complete-banner .revolution-title {
        font-size: 1.3rem; color: #4CAF50; font-weight: bold;
        text-transform: uppercase; letter-spacing: 3px; margin-bottom: 8px;
    }
    .revolution-complete-banner .revolution-subtitle {
        font-size: 0.85rem; color: #81C784; line-height: 1.5; margin-bottom: 12px;
    }
    .revolution-tag {
        display: inline-block; padding: 4px 12px; margin: 4px;
        background: rgba(76,175,80,0.1); border: 1px solid rgba(76,175,80,0.25);
        border-radius: 4px; font-size: 0.75rem; color: #4CAF50;
    }

    /* Stats Sections */
    .stats-section {
        padding: 24px;
    }
    .sector-block {
        margin-bottom: 32px;
    }
    .sector-header {
        color: var(--accent);
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 16px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border-main);
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .sector-icon {
        font-size: 1.2rem;
    }
    .stat-boxes {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
    }
    @media (max-width: 900px) {
        .stat-boxes {
            grid-template-columns: repeat(2, 1fr);
        }
    }
    @media (max-width: 600px) {
        .stat-boxes {
            grid-template-columns: 1fr;
        }
    }

    /* Individual Stat Box */
    .stat-box {
        background: var(--bg-panel);
        border-radius: 6px;
        padding: 14px;
        border-left: 4px solid var(--border-main);
        transition: border-color 0.3s;
    }
    .stat-box.good { border-left-color: var(--green); }
    .stat-box.medium { border-left-color: var(--orange); }
    .stat-box.bad { border-left-color: var(--red); }

    .stat-box-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
    }
    .stat-box-name {
        font-size: 0.8rem;
        color: var(--text-primary);
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .stat-box-value {
        font-size: 1.2rem;
        font-weight: bold;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .stat-box-value.good { color: var(--green); }
    .stat-box-value.medium { color: var(--orange); }
    .stat-box-value.bad { color: var(--red); }

    .stat-box-desc {
        font-size: 0.72rem;
        color: var(--text-muted);
        line-height: 1.4;
        margin-bottom: 6px;
    }

    /* Trend Arrows */
    .trend-arrow {
        font-size: 0.9rem;
        font-weight: bold;
    }
    .trend-up { color: var(--green); }
    .trend-down { color: var(--red); }
    .trend-neutral { color: var(--text-muted); }

    /* For inverted stats, swap colors */
    .trend-up.inverted { color: var(--red); }
    .trend-down.inverted { color: var(--green); }

    /* Ranking Badge */
    .stat-box-footer {
        display: flex;
        justify-content: flex-end;
        margin-top: 4px;
    }
    .ranking-badge {
        font-size: 0.65rem;
        color: var(--text-secondary);
        background: var(--bg-card);
        padding: 2px 6px;
        border-radius: 3px;
    }
    .ranking-badge.first {
        color: var(--accent);
        background: var(--your-party-bg);
    }

    /* Voter Demographics Special Section */
    .voter-axis {
        background: var(--bg-panel);
        border-radius: 6px;
        padding: 14px;
        margin-bottom: 12px;
    }
    .voter-axis-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .voter-axis-left { color: var(--blue); }
    .voter-axis-right { color: var(--orange); }
    .voter-bar-container {
        height: 24px;
        background: var(--border-main);
        border-radius: 4px;
        overflow: hidden;
        display: flex;
    }
    .voter-bar-left {
        background: linear-gradient(90deg, #2196F3, #64B5F6);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 0.75rem;
        font-weight: bold;
    }
    .voter-bar-right {
        background: linear-gradient(90deg, #FFB74D, #ff9800);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 0.75rem;
        font-weight: bold;
        flex: 1;
    }
</style>
</head>
<body>

<!-- ===== TOP BAR ===== -->
<div id="top-bar"></div>

<!-- ===== CONTENT AREA ===== -->
<div id="content-area">
    <div class="loading-container">
        <div class="loading-spinner"></div>
        <div>Loading nation data...</div>
    </div>
</div>

<!-- Shared Scripts -->
<script src="js/supabase-client.js"></script>
<script src="js/common.js"></script>
<script src="js/game-common.js"></script>

<!-- Page-Specific Script -->
<script>
/**
 * Nation Page - Comprehensive Stats Display
 * With Rankings and Trend Arrows
 */

// All nations data for rankings
let allNations = [];
let totalNations = 0;
let previousTickData = null;

// Initialize page
initPage('nation', async (state) => {
    const { nation, faction } = state;
    
    if (!nation) {
        document.getElementById('content-area').innerHTML = '<div class="placeholder-panel"><div class="ph-icon">🏴</div><h3>No Nation Selected</h3><p>Your party is not assigned to a nation yet.</p></div>';
        return;
    }
    
    // Fix placeholder government_type values from DB
    if (!nation.government_type || nation.government_type.toLowerCase().includes('your_gov_here')) {
        if (nation.name === 'San Estrella') nation.government_type = 'Presidential';
    }

    await loadAllNations();
    await loadPreviousTickData(nation.id);
    await renderNationPage(nation);
});

async function loadAllNations() {
    const cached = qCache('all_nations');
    if (cached) { allNations = cached; totalNations = cached.length; return; }
    const { data: nations, error } = await _supabase.from('nations').select('*');
    if (!error && nations) { allNations = nations; totalNations = nations.length; qCacheSet('all_nations', nations, 2 * 60 * 1000); }
}

async function loadPreviousTickData(nationId) {
    const cacheKey = 'prev_tick_' + nationId;
    const cached = qCache(cacheKey);
    if (cached) { previousTickData = cached; return; }
    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    if (!shard) return;
    const previousTick = shard.current_tick - 1;
    if (previousTick < 0) return;

    // Use maybeSingle() — .single() errors on 0 rows, which silently
    // killed previousTickData when history was missing for the exact tick.
    const { data: history, error } = await _supabase.from('nations_history')
        .select('*').eq('nation_id', nationId).eq('tick', previousTick).maybeSingle();
    if (error) {
        console.warn('[loadPreviousTickData] Query error for tick ' + previousTick + ':', error.message);
    }
    if (history) {
        previousTickData = history;
        qCacheSet(cacheKey, history, 5 * 60 * 1000);
        return;
    }

    // Fallback: grab the most recent history row before the current tick.
    // Covers gaps where a specific tick's snapshot failed or was skipped.
    const { data: fallback, error: fbErr } = await _supabase.from('nations_history')
        .select('*').eq('nation_id', nationId).lt('tick', shard.current_tick)
        .order('tick', { ascending: false }).limit(1);
    if (fbErr) {
        console.warn('[loadPreviousTickData] Fallback query error:', fbErr.message);
        return;
    }
    if (fallback && fallback.length > 0) {
        previousTickData = fallback[0];
        qCacheSet(cacheKey, fallback[0], 5 * 60 * 1000);
    }
}

function calculateRanking(statKey, value, inverted = false) {
    if (value === null || value === undefined) return null;
    const values = allNations.map(n => n[statKey]).filter(v => v !== null && v !== undefined);
    if (values.length === 0) return null;
    const sorted = [...values].sort((a, b) => inverted ? a - b : b - a);
    return sorted.indexOf(value) + 1;
}

function roundDelta(val) {
    return Math.abs(val) >= 1 ? Math.round(val).toString() : val.toFixed(1);
}

function getTrendArrow(statKey, currentValue, inverted, format) {
    if (!previousTickData || currentValue === null || currentValue === undefined) {
        return '<span class="trend-arrow trend-neutral">―</span>';
    }
    var historyKey = statKey === 'GDP' ? 'gdp' : statKey;
    var previousValue = previousTickData[historyKey];
    if (previousValue === null || previousValue === undefined) {
        return '<span class="trend-arrow trend-neutral">―</span>';
    }
    var delta = currentValue - previousValue;
    var invertedClass = inverted ? ' inverted' : '';
    if (delta > 0) {
        var formatted = (format === 'currency') ? '+' + formatCurrencyShort(delta) : (format === 'gdp') ? '+' + formatCurrencyShort(delta) : '+' + roundDelta(delta);
        return '<span class="trend-arrow trend-up' + invertedClass + '">▲ ' + formatted + '</span>';
    } else if (delta < 0) {
        var formatted = (format === 'currency') ? formatCurrencyShort(delta) : (format === 'gdp') ? formatCurrencyShort(delta) : roundDelta(delta);
        return '<span class="trend-arrow trend-down' + invertedClass + '">▼ ' + formatted + '</span>';
    }
    return '<span class="trend-arrow trend-neutral">―</span>';
}

function prettyStatName(key) {
    return key.replace(/_/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
}

async function getShardTick() {
    var cached = qCache('shard_current_tick');
    if (cached) return cached;
    var res = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    if (res.data) { qCacheSet('shard_current_tick', res.data.current_tick, 30 * 1000); return res.data.current_tick; }
    return 0;
}

async function renderRevolutionBanner(nation) {
    // Check for post-revolution celebration banner (query event_log for recent DEMOCRATIC_REVOLUTION)
    var currentTick = await getShardTick();
    var revRes = await _supabase
        .from('event_log')
        .select('fired_at_tick, description_used')
        .eq('nation_id', nation.id)
        .eq('event_name', 'DEMOCRATIC_REVOLUTION')
        .order('fired_at_tick', { ascending: false })
        .limit(1)
        .maybeSingle();
    if (revRes.data && (currentTick - revRes.data.fired_at_tick) <= 5) {
        var ticksAgo = currentTick - revRes.data.fired_at_tick;
        var electionTick = revRes.data.fired_at_tick + 3;
        var ticksUntilElection = Math.max(0, electionTick - currentTick);
        var h = '<div class="revolution-complete-banner">';
        h += '<div class="revolution-icon">&#x1F3DB;</div>';
        h += '<div class="revolution-title">Revolution in the Streets!</div>';
        h += '<div class="revolution-subtitle">' + revRes.data.description_used + '</div>';
        if (ticksUntilElection > 0) {
            h += '<div style="margin-top:12px;">';
            h += '<span class="revolution-tag">Emergency Elections in ' + ticksUntilElection + ' tick' + (ticksUntilElection !== 1 ? 's' : '') + '</span>';
            h += '<span class="revolution-tag">Democracy Established</span>';
            h += '</div>';
        } else {
            h += '<div style="margin-top:12px;"><span class="revolution-tag">Democracy Established</span><span class="revolution-tag">Elections Complete</span></div>';
        }
        h += '</div>';
        return h;
    }

    // Check for active revolution countdown (Autocracy only)
    if (nation.government_type === 'Autocracy' && nation.revolution_started_tick != null && nation.revolution_duration != null) {
        var elapsed = currentTick - nation.revolution_started_tick;
        var remaining = Math.max(0, nation.revolution_duration - elapsed);
        var h = '<div class="revolution-banner">';
        h += '<div class="revolution-icon">&#x1F525;</div>';
        h += '<div class="revolution-title">Democratic Revolution</div>';
        h += '<div class="revolution-subtitle">The people demand democracy. Pro-democracy protests grow stronger each day. The regime must act to restore order — or fall.</div>';
        h += '<div class="revolution-countdown">' + remaining + ' tick' + (remaining !== 1 ? 's' : '') + ' until revolution</div>';
        h += '</div>';
        return h;
    }

    return '';
}

async function renderCrisisSection(nationId, nation) {
    var h = '<div class="crisis-section"><div class="section-header">Ongoing Crises</div><div class="crisis-grid">';

    var crises = [];
    var cacheKey = 'crises_' + nationId;
    var cached = qCache(cacheKey);
    if (cached) {
        crises = cached;
    } else {
        var res = await _supabase
            .from('active_crises')
            .select('crisis_id, crisis_templates(name, description, crisis_end_triggers(stat_key), crisis_effects(stat_key, change_per_tick, target))')
            .eq('nation_id', nationId);
        if (!res.error && res.data) {
            crises = res.data;
            qCacheSet(cacheKey, crises, 2 * 60 * 1000);
        }
    }

    // Add revolution crisis box if active
    var hasRevolution = nation && nation.government_type === 'Autocracy' && nation.revolution_started_tick != null && nation.revolution_duration != null;
    if (hasRevolution) {
        var currentTick = await getShardTick();
        var elapsed = currentTick - nation.revolution_started_tick;
        var remaining = Math.max(0, nation.revolution_duration - elapsed);
        h += '<div class="crisis-box active">';
        h += '<div class="crisis-name">Democratic Revolution</div>';
        h += '<div class="crisis-desc">The people demand democracy. Revolution grows stronger each day. ' + remaining + ' tick' + (remaining !== 1 ? 's' : '') + ' remain.</div>';
        h += '<div class="crisis-rising">Worsening: <span>Stability</span>, <span>Civil Unrest</span>, <span>Intl. Reputation</span></div>';
        h += '<div class="crisis-recovery">Avert: <span>Stability &ge; 15</span> or <span>Freedom &le; 50</span> or <span>Unrest &le; 70</span></div>';
        h += '</div>';
    }

    if (crises.length === 0 && !hasRevolution) {
        h += '<div class="crisis-box">No active crises</div>';
        h += '<div class="crisis-box">No active crises</div>';
    } else {
        for (var i = 0; i < crises.length; i++) {
            var c = crises[i];
            var t = c.crisis_templates;
            if (!t) continue;
            var endTriggers = t.crisis_end_triggers || [];
            var statNames = [];
            for (var j = 0; j < endTriggers.length; j++) {
                statNames.push(prettyStatName(endTriggers[j].stat_key));
            }
            var effects = t.crisis_effects || [];
            var risingStats = [];
            for (var k = 0; k < effects.length; k++) {
                if (effects[k].target === 'nation' && effects[k].stat_key && effects[k].change_per_tick > 0) {
                    risingStats.push(prettyStatName(effects[k].stat_key));
                }
            }
            h += '<div class="crisis-box active">';
            h += '<div class="crisis-name">' + t.name + '</div>';
            h += '<div class="crisis-desc">' + t.description + '</div>';
            if (risingStats.length > 0) {
                h += '<div class="crisis-rising">Rising: <span>' + risingStats.join('</span>, <span>') + '</span></div>';
            }
            if (statNames.length > 0) {
                h += '<div class="crisis-recovery">Recovery: <span>' + statNames.join('</span>, <span>') + '</span></div>';
            }
            h += '</div>';
        }
        // Fill empty slot if odd number of crises
        var totalBoxes = crises.length + (hasRevolution ? 1 : 0);
        if (totalBoxes % 2 !== 0) {
            h += '<div class="crisis-box">No additional crises</div>';
        }
    }

    h += '</div></div>';
    return h;
}

/**
 * Main render — uses string concatenation to avoid template literal escaping issues
 */
async function renderNationPage(nation) {
    var h = '';

    // Overview
    h += '<div class="nation-overview">';
    h += '<h1>' + nation.name + '</h1>';
    h += '<div class="overview-grid">';
    h += '<div class="overview-item"><div class="overview-label">Capital</div><div class="overview-value">' + (nation.capital || '—') + '</div></div>';
    h += '<div class="overview-item"><div class="overview-label">Government</div><div class="overview-value">' + (nation.government_type === 'Presidential' ? 'Presidential Republic' : (nation.government_type || '—')) + '</div></div>';
    h += '<div class="overview-item"><div class="overview-label">Population</div><div class="overview-value">' + formatPopulation(nation.population) + '</div></div>';
    h += '<div class="overview-item"><div class="overview-label">National Approval</div><div class="overview-value gold">' + (nation.national_approval || 50) + '%</div></div>';
    h += '<div class="overview-item"><div class="overview-label">GDP</div><div class="overview-value gold">' + formatGDP(nation.gdp) + '</div></div>';
    h += '</div></div>';

    // Revolution banner (above crises)
    h += await renderRevolutionBanner(nation);

    // Crises
    h += await renderCrisisSection(nation.id, nation);

    // Stats
    h += '<div class="stats-section">';

    // ECONOMIC
    h += sectorBlock('💰', 'Economic', [
        renderStatBox('GDP', 'gdp', nation.gdp, 'Gross domestic product', 'gdp'),
        renderStatBox('GDP Growth', 'gdp_growth', nation.gdp_growth, 'Annual economic growth rate'),
        renderStatBox('National Debt', 'debt', nation.debt, 'Government debt obligations', 'currency', true),
        renderStatBox('Debt Growth', 'debt_growth', nation.debt_growth, 'Rate of debt accumulation', null, true),
        renderStatBox('Inflation', 'inflation', nation.inflation, 'Rate of price increases', null, true),
        renderStatBox('Interest Rates', 'interest_rates', nation.interest_rates, 'Central bank lending rate'),
        renderStatBox('Trade Balance', 'trade_balance', nation.trade_balance, 'Exports minus imports'),
        renderStatBox('Currency Strength', 'currency_strength', nation.currency_strength, 'Value of national currency'),
        renderStatBox('Foreign Investment', 'foreign_investment', nation.foreign_investment, 'International capital inflow'),
        renderStatBox('Credit Rating', 'credit', nation.credit, 'National creditworthiness')
    ]);

    // TAXATION
    h += sectorBlock('🧾', 'Taxation', [
        renderStatBox('Income Tax', 'income_tax', nation.income_tax, 'Tax rate on personal income'),

/**
 * Helper: wrap stat boxes in a sector block
 */
function sectorBlock(icon, title, boxes) {
    return '<div class="sector-block"><div class="sector-header"><span class="sector-icon">' + icon + '</span> ' + title + '</div><div class="stat-boxes">' + boxes.join('') + '</div></div>';
}

/**
 * Render a single stat box with ranking and trend
 */
function renderStatBox(name, statKey, value, description, format, inverted) {
    format = format || null;
    inverted = inverted || false;
    var numValue = parseInt(value) || 0;

    var colorClass = 'medium';
    if (value !== null && value !== undefined) {
        if (inverted) {
            if (numValue <= 30) colorClass = 'good';
            else if (numValue <= 60) colorClass = 'medium';
            else colorClass = 'bad';
        } else {
            if (numValue >= 70) colorClass = 'good';
            else if (numValue >= 40) colorClass = 'medium';
            else colorClass = 'bad';
        }
    }

    var formattedValue = (value !== null && value !== undefined) ? (typeof value === 'number' ? Math.round(value * 10) / 10 : value) : 'N/A';
    if (format === 'currency' && typeof value === 'number') formattedValue = formatCurrencyShort(value);
    else if (format === 'gdp' && typeof value === 'number') formattedValue = formatCurrencyShort(value);
    else if (format === 'years' && typeof value === 'number') formattedValue = Math.round(value * 10) / 10 + ' yrs';

    var trendArrow = getTrendArrow(statKey, value, inverted, format);
    var rank = calculateRanking(statKey, value, inverted);
    var rankHTML = rank ? '<div class="stat-box-footer"><span class="ranking-badge' + (rank === 1 ? ' first' : '') + '">#' + rank + ' of ' + totalNations + '</span></div>' : '';

    return '<div class="stat-box ' + colorClass + '">' +
        '<div class="stat-box-header">' +
            '<span class="stat-box-name">' + name + '</span>' +
            '<span class="stat-box-value ' + colorClass + '">' + formattedValue + ' ' + trendArrow + '</span>' +
        '</div>' +
        '<div class="stat-box-desc">' + description + '</div>' +
        rankHTML +
    '</div>';
}

function renderVoterAxis(leftLabel, leftValue, rightLabel) {
    var leftPct = (leftValue !== null && leftValue !== undefined) ? Math.round(leftValue * 10) / 10 : 50;
    var rightPct = Math.round((100 - leftPct) * 10) / 10;
    return '<div class="voter-axis">' +
        '<div class="voter-axis-header"><span class="voter-axis-left">' + leftLabel + '</span><span class="voter-axis-right">' + rightLabel + '</span></div>' +
        '<div class="voter-bar-container">' +
            '<div class="voter-bar-left" style="width:' + leftPct + '%">' + leftPct + '%</div>' +
            '<div class="voter-bar-right">' + rightPct + '%</div>' +
        '</div></div>';
}

function formatPopulation(pop) {
    if (!pop) return 'N/A';
    return Number(pop).toLocaleString();
}

function formatCurrencyShort(val) {
    if (val == null) return 'N/A';
    val = Number(val);
    var sign = val < 0 ? '-' : '';
    var abs = Math.abs(val);
    if (abs >= 1e12) return sign + '$' + (abs / 1e12).toFixed(1) + ' Trillion';
    if (abs >= 1e9)  return sign + '$' + (abs / 1e9).toFixed(1) + ' Billion';
    if (abs >= 1e6)  return sign + '$' + (abs / 1e6).toFixed(1) + ' Million';
    return sign + '$' + abs.toLocaleString();
}

function formatGDP(gdp) {
    if (!gdp) return 'N/A';
    return formatCurrencyShort(gdp);
}
