<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nation | Nationhood Alpha</title>
    
    <!-- Supabase SDK -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://pbumjalxclmegzckhqqr.supabase.co" crossorigin>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Shared Styles -->
    <link rel="stylesheet" href="css/dashboard.css">
    
    <!-- Page-Specific Styles -->
    <style>
    /* Nation Overview Header */
    .nation-overview {
        background: var(--topbar-bg);
        border-bottom: 2px solid var(--border-main);
        padding: 24px;
    }
    .nation-overview h1 {
        color: var(--accent);
        font-size: 2rem;
        text-transform: uppercase;
        letter-spacing: 3px;
        margin-bottom: 16px;
    }
    .overview-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
    }
    .overview-item {
        background: var(--bg-card);
        padding: 12px 16px;
        border-radius: 6px;
        border-left: 3px solid var(--accent);
    }
    .overview-label {
        font-size: 0.7rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 4px;
    }
    .overview-value {
        font-size: 1.1rem;
        color: var(--text-primary);
        font-weight: bold;
    }
    .overview-value.gold { color: var(--accent); }

    /* Crisis Section */
    .crisis-section {
        padding: 24px;
        background: var(--bg-panel);
        border-bottom: 1px solid var(--border-main);
    }
    .crisis-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
    }
    .crisis-box {
        background: var(--bg-card);
        border: 2px dashed var(--border-main);
        border-radius: 8px;
        padding: 40px;
        text-align: center;
        color: var(--text-dim);
        font-style: italic;
    }
    .crisis-box.active {
        border: 2px solid var(--red);
        background: var(--bg-card);
        color: var(--text-primary);
        font-style: normal;
        text-align: left;
        padding: 20px;
    }
    .crisis-box.active .crisis-name {
        color: var(--red);
        font-size: 1rem;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
    }
    .crisis-box.active .crisis-desc {
        color: var(--text-secondary);
        font-size: 0.78rem;
        line-height: 1.5;
        margin-bottom: 12px;
    }
    .crisis-box.active .crisis-recovery {
        font-size: 0.72rem;
        color: var(--text-muted);
    }
    .crisis-box.active .crisis-recovery span {
        color: var(--orange);
        font-weight: bold;
    }
    .crisis-box.active .crisis-rising {
        font-size: 0.72rem;
        color: var(--text-muted);
        margin-bottom: 4px;
    }
    .crisis-box.active .crisis-rising span {
        color: var(--red);
        font-weight: bold;
    }

    /* Stats Sections */
    .stats-section {
        padding: 24px;
    }
    .sector-block {
        margin-bottom: 32px;
    }
    .sector-header {
        color: var(--accent);
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 16px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border-main);
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .sector-icon {
        font-size: 1.2rem;
    }
    .stat-boxes {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
    }
    @media (max-width: 900px) {
        .stat-boxes {
            grid-template-columns: repeat(2, 1fr);
        }
    }
    @media (max-width: 600px) {
        .stat-boxes {
            grid-template-columns: 1fr;
        }
    }

    /* Individual Stat Box */
    .stat-box {
        background: var(--bg-panel);
        border-radius: 6px;
        padding: 14px;
        border-left: 4px solid var(--border-main);
        transition: border-color 0.3s;
    }
    .stat-box.good { border-left-color: var(--green); }
    .stat-box.medium { border-left-color: var(--orange); }
    .stat-box.bad { border-left-color: var(--red); }

    .stat-box-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
    }
    .stat-box-name {
        font-size: 0.8rem;
        color: var(--text-primary);
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .stat-box-value {
        font-size: 1.2rem;
        font-weight: bold;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .stat-box-value.good { color: var(--green); }
    .stat-box-value.medium { color: var(--orange); }
    .stat-box-value.bad { color: var(--red); }

    .stat-box-desc {
        font-size: 0.72rem;
        color: var(--text-muted);
        line-height: 1.4;
        margin-bottom: 6px;
    }

    /* Trend Arrows */
    .trend-arrow {
        font-size: 0.9rem;
        font-weight: bold;
    }
    .trend-up { color: var(--green); }
    .trend-down { color: var(--red); }
    .trend-neutral { color: var(--text-muted); }

    /* For inverted stats, swap colors */
    .trend-up.inverted { color: var(--red); }
    .trend-down.inverted { color: var(--green); }

    /* Ranking Badge */
    .stat-box-footer {
        display: flex;
        justify-content: flex-end;
        margin-top: 4px;
    }
    .ranking-badge {
        font-size: 0.65rem;
        color: var(--text-secondary);
        background: var(--bg-card);
        padding: 2px 6px;
        border-radius: 3px;
    }
    .ranking-badge.first {
        color: var(--accent);
        background: var(--your-party-bg);
    }

    /* Voter Demographics Special Section */
    .voter-axis {
        background: var(--bg-panel);
        border-radius: 6px;
        padding: 14px;
        margin-bottom: 12px;
    }
    .voter-axis-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .voter-axis-left { color: var(--blue); }
    .voter-axis-right { color: var(--orange); }
    .voter-bar-container {
        height: 24px;
        background: var(--border-main);
        border-radius: 4px;
        overflow: hidden;
        display: flex;
    }
    .voter-bar-left {
        background: linear-gradient(90deg, #2196F3, #64B5F6);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 0.75rem;
        font-weight: bold;
    }
    .voter-bar-right {
        background: linear-gradient(90deg, #FFB74D, #ff9800);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 0.75rem;
        font-weight: bold;
        flex: 1;
    }
</style>
</head>
<body>

<!-- ===== TOP BAR ===== -->
<div id="top-bar"></div>

<!-- ===== CONTENT AREA ===== -->
<div id="content-area">
    <div class="loading-container">
        <div class="loading-spinner"></div>
        <div>Loading nation data...</div>
    </div>
</div>

<!-- Shared Scripts -->
<script src="js/supabase-client.js"></script>
<script src="js/common.js"></script>
<script src="js/game-common.js"></script>

<!-- Page-Specific Script -->
<script>
/**
 * Nation Page - Comprehensive Stats Display
 * With Rankings and Trend Arrows
 */

// All nations data for rankings
let allNations = [];
let totalNations = 0;
let previousTickData = null;

// Stats where LOWER is better (inverted coloring & trend arrows)
const INVERTED_STATS = [
    'unemployment', 'poverty_rate', 'income_inequality', 'death_rate',
    'pollution', 'carbon_emissions', 'crime_rate', 'incarceration_rate',
    'drug_use', 'corruption', 'polarization', 'civil_unrest', 'terrorism',
    'political_violence', 'emigration', 'sanctions', 'debt', 'debt_growth',
    'inflation', 'illegal_immigration', 'fuel_prices'
];

// Initialize page
initPage('nation', async (state) => {
    const { nation, faction } = state;
    
    if (!nation) {
        document.getElementById('content-area').innerHTML = '<div class="placeholder-panel"><div class="ph-icon">🏴</div><h3>No Nation Selected</h3><p>Your party is not assigned to a nation yet.</p></div>';
        return;
    }
    
    await loadAllNations();
    await loadPreviousTickData(nation.id);
    await renderNationPage(nation);
});

async function loadAllNations() {
    const cached = qCache('all_nations');
    if (cached) { allNations = cached; totalNations = cached.length; return; }
    const { data: nations, error } = await _supabase.from('nations').select('*');
    if (!error && nations) { allNations = nations; totalNations = nations.length; qCacheSet('all_nations', nations, 2 * 60 * 1000); }
}

async function loadPreviousTickData(nationId) {
    const cacheKey = 'prev_tick_' + nationId;
    const cached = qCache(cacheKey);
    if (cached) { previousTickData = cached; return; }
    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    if (!shard) return;
    const previousTick = shard.current_tick - 1;
    if (previousTick < 0) return;
    const { data: history, error } = await _supabase.from('nations_history').select('*').eq('nation_id', nationId).eq('tick', previousTick).single();
    if (!error && history) { previousTickData = history; qCacheSet(cacheKey, history, 5 * 60 * 1000); }
}

function calculateRanking(statKey, value, inverted = false) {
    if (value === null || value === undefined) return null;
    const values = allNations.map(n => n[statKey]).filter(v => v !== null && v !== undefined);
    if (values.length === 0) return null;
    const sorted = [...values].sort((a, b) => inverted ? a - b : b - a);
    return sorted.indexOf(value) + 1;
}

function roundDelta(val) {
    return Math.abs(val) >= 1 ? Math.round(val).toString() : val.toFixed(1);
}

function getTrendArrow(statKey, currentValue, inverted, format) {
    if (!previousTickData || currentValue === null || currentValue === undefined) {
        return '<span class="trend-arrow trend-neutral">―</span>';
    }
    var historyKey = statKey === 'GDP' ? 'gdp' : statKey;
    var previousValue = previousTickData[historyKey];
    if (previousValue === null || previousValue === undefined) {
        return '<span class="trend-arrow trend-neutral">―</span>';
    }
    var delta = currentValue - previousValue;
    var invertedClass = inverted ? ' inverted' : '';
    if (delta > 0) {
        var formatted = (format === 'currency') ? '+' + formatCurrencyShort(delta) : '+' + roundDelta(delta);
        return '<span class="trend-arrow trend-up' + invertedClass + '">▲ ' + formatted + '</span>';
    } else if (delta < 0) {
        var formatted = (format === 'currency') ? formatCurrencyShort(delta) : roundDelta(delta);
        return '<span class="trend-arrow trend-down' + invertedClass + '">▼ ' + formatted + '</span>';
    }
    return '<span class="trend-arrow trend-neutral">―</span>';
}

function prettyStatName(key) {
    return key.replace(/_/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
}

async function renderCrisisSection(nationId) {
    var h = '<div class="crisis-section"><div class="section-header">Ongoing Crises</div><div class="crisis-grid">';

    var crises = [];
    var cacheKey = 'crises_' + nationId;
    var cached = qCache(cacheKey);
    if (cached) {
        crises = cached;
    } else {
        var res = await _supabase
            .from('active_crises')
            .select('crisis_id, crisis_templates(name, description, crisis_end_triggers(stat_key), crisis_effects(stat_key, change_per_tick, target))')
            .eq('nation_id', nationId);
        if (!res.error && res.data) {
            crises = res.data;
            qCacheSet(cacheKey, crises, 2 * 60 * 1000);
        }
    }

    if (crises.length === 0) {
        h += '<div class="crisis-box">No active crises</div>';
        h += '<div class="crisis-box">No active crises</div>';
    } else {
        for (var i = 0; i < crises.length; i++) {
            var c = crises[i];
            var t = c.crisis_templates;
            if (!t) continue;
            var endTriggers = t.crisis_end_triggers || [];
            var statNames = [];
            for (var j = 0; j < endTriggers.length; j++) {
                statNames.push(prettyStatName(endTriggers[j].stat_key));
            }
            var effects = t.crisis_effects || [];
            var risingStats = [];
            for (var k = 0; k < effects.length; k++) {
                if (effects[k].target === 'nation' && effects[k].stat_key && effects[k].change_per_tick > 0) {
                    risingStats.push(prettyStatName(effects[k].stat_key));
                }
            }
            h += '<div class="crisis-box active">';
            h += '<div class="crisis-name">' + t.name + '</div>';
            h += '<div class="crisis-desc">' + t.description + '</div>';
            if (risingStats.length > 0) {
                h += '<div class="crisis-rising">Rising: <span>' + risingStats.join('</span>, <span>') + '</span></div>';
            }
            if (statNames.length > 0) {
                h += '<div class="crisis-recovery">Recovery: <span>' + statNames.join('</span>, <span>') + '</span></div>';
            }
            h += '</div>';
        }
    }

    h += '</div></div>';
    return h;
}

/**
 * Main render — uses string concatenation to avoid template literal escaping issues
 */
async function renderNationPage(nation) {
    var h = '';

    // Overview
    h += '<div class="nation-overview">';
    h += '<h1>' + nation.name + '</h1>';
    h += '<div class="overview-grid">';
    h += '<div class="overview-item"><div class="overview-label">Capital</div><div class="overview-value">' + (nation.capital || '—') + '</div></div>';
    h += '<div class="overview-item"><div class="overview-label">Government</div><div class="overview-value">' + (nation.government_type || '—') + '</div></div>';
    h += '<div class="overview-item"><div class="overview-label">Population</div><div class="overview-value">' + formatPopulation(nation.population) + '</div></div>';
    h += '<div class="overview-item"><div class="overview-label">National Approval</div><div class="overview-value gold">' + (nation.national_approval || 50) + '%</div></div>';
    h += '<div class="overview-item"><div class="overview-label">GDP</div><div class="overview-value gold">' + formatGDP(nation.GDP) + '</div></div>';
    h += '</div></div>';

    // Crises
    h += await renderCrisisSection(nation.id);

    // Stats
    h += '<div class="stats-section">';

    // ECONOMIC
    h += sectorBlock('💰', 'Economic', [
        renderStatBox('GDP', 'GDP', nation.GDP, 'Gross domestic product in billions', 'currency'),
        renderStatBox('GDP Growth', 'gdp_growth', nation.gdp_growth, 'Annual economic growth rate'),
        renderStatBox('National Debt', 'debt', nation.debt, 'Government debt obligations', 'currency', true),
        renderStatBox('Debt Growth', 'debt_growth', nation.debt_growth, 'Rate of debt accumulation', null, true),
        renderStatBox('Budget', 'budget', nation.budget, 'Government budget surplus/deficit'),
        renderStatBox('Inflation', 'inflation', nation.inflation, 'Rate of price increases', null, true),
        renderStatBox('Interest Rates', 'interest_rates', nation.interest_rates, 'Central bank lending rate'),
        renderStatBox('Trade Balance', 'trade_balance', nation.trade_balance, 'Exports minus imports'),
        renderStatBox('Currency Strength', 'currency_strength', nation.currency_strength, 'Value of national currency'),
        renderStatBox('Foreign Investment', 'foreign_investment', nation.foreign_investment, 'International capital inflow'),
        renderStatBox('Credit Rating', 'credit', nation.credit, 'National creditworthiness')
    ]);

    // TAXATION
    h += sectorBlock('🧾', 'Taxation', [
        renderStatBox('Income Tax', 'income_tax', nation.income_tax, 'Tax rate on personal income'),
        renderStatBox('Corporate Tax', 'corporate_tax', nation.corporate_tax, 'Tax rate on business profits'),
        renderStatBox('Sales Tax', 'sales_tax', nation.sales_tax, 'Tax on goods and services'),
        renderStatBox('Tariffs', 'tariffs', nation.tariffs, 'Import/export duties')
    ]);

    // LABOR
    h += sectorBlock('👷', 'Labor & Employment', [
        renderStatBox('Unemployment', 'unemployment', nation.unemployment, 'Percentage without work', null, true),
        renderStatBox('Labor Participation', 'labor_force_participation', nation.labor_force_participation, 'Working-age adults employed'),
        renderStatBox('Minimum Wage', 'minimum_wage', nation.minimum_wage, 'Lowest legal hourly wage'),
        renderStatBox('Union Strength', 'union_strength', nation.union_strength, 'Power of labor unions'),
        renderStatBox('Poverty Rate', 'poverty_rate', nation.poverty_rate, 'Population below poverty line', null, true),
        renderStatBox('Income Inequality', 'income_inequality', nation.income_inequality, 'Gap between rich and poor', null, true)
    ]);

    // DEMOGRAPHICS
    h += sectorBlock('👥', 'Demographics', [
        renderStatBox('Population Growth', 'population_growth', nation.population_growth, 'Rate of population change'),
        renderStatBox('Birth Rate', 'birth_rate', nation.birth_rate, 'Births per 1,000 people'),
        renderStatBox('Death Rate', 'death_rate', nation.death_rate, 'Deaths per 1,000 people', null, true),
        renderStatBox('Median Age', 'median_age', nation.median_age, 'Average age of population', 'years'),
        renderStatBox('Eligible Voters', 'eligible_voters', nation.eligible_voters, 'Citizens able to vote'),
        renderStatBox('Ethnic Diversity', 'ethnic_diversity', nation.ethnic_diversity, 'Cultural heterogeneity')
    ]);

    // HEALTHCARE
    h += sectorBlock('🏥', 'Healthcare', [
        renderStatBox('Healthcare Quality', 'healthcare_quality', nation.healthcare_quality, 'Overall medical care standard'),
        renderStatBox('Healthcare Accessibility', 'healthcare_accessibility', nation.healthcare_accessibility, 'Access to medical services across the population'),
        renderStatBox('Hospital Beds', 'beds_per_100k', nation.beds_per_100k, 'Beds per 100,000 people'),
        renderStatBox('Life Expectancy', 'lifespan', nation.lifespan, 'Average lifespan in years'),
        renderStatBox('Drug Use', 'drug_use', nation.drug_use, 'Substance abuse prevalence', null, true)
    ]);

    // EDUCATION
    h += sectorBlock('🎓', 'Education', [
        renderStatBox('Literacy Rate', 'literacy', nation.literacy, 'Population able to read/write'),
        renderStatBox('Higher Education', 'higher_education', nation.higher_education, 'University graduation rate'),
        renderStatBox('Education Accessibility', 'education_accessibility', nation.education_accessibility, 'Access to schooling across the population'),
        renderStatBox('Academic Immigration', 'academic_immigration', nation.academic_immigration, 'Scholars attracted to nation')
    ]);

    // INFRASTRUCTURE
    h += sectorBlock('🏗️', 'Infrastructure', [
        renderStatBox('Digital Infrastructure', 'digital_infrastructure', nation.digital_infrastructure, 'Internet and tech networks'),
        renderStatBox('Rail Network', 'rail_network', nation.rail_network, 'Train connectivity'),
        renderStatBox('Urbanization', 'urbanization', nation.urbanization, 'Population in cities'),
        renderStatBox('Energy Generation', 'energy_generation', nation.energy_generation, 'Power production capacity'),
        renderStatBox('Renewable Energy', 'renewable_energy_percentage', nation.renewable_energy_percentage, 'Clean energy percentage')
    ]);

    // RESOURCES
    h += sectorBlock('⛏️', 'Resources', [
        renderStatBox('Arable Land', 'arable_land', nation.arable_land, 'Farmable territory'),
        renderStatBox('Rare Minerals', 'rare_minerals', nation.rare_minerals, 'Valuable mineral deposits'),
        renderStatBox('Oil & Gas', 'oil_and_gas', nation.oil_and_gas, 'Fossil fuel reserves'),
        renderStatBox('Fuel Prices', 'fuel_prices', nation.fuel_prices, 'Cost of energy', null, true)
    ]);

    // ENVIRONMENT
    h += sectorBlock('🌍', 'Environment', [
        renderStatBox('Pollution', 'pollution', nation.pollution, 'Air and water contamination', null, true),
        renderStatBox('Carbon Emissions', 'carbon_emissions', nation.carbon_emissions, 'Greenhouse gas output', null, true)
    ]);

    // SOCIAL
    h += sectorBlock('🏠', 'Social', [
        renderStatBox('Standard of Living', 'standard_of_living', nation.standard_of_living, 'Quality of life index'),
        renderStatBox('Happiness', 'happiness', nation.happiness, 'National wellbeing index'),
        renderStatBox('Social Mobility', 'social_mobility', nation.social_mobility, 'Ability to change class'),
        renderStatBox('Benefits', 'benefits', nation.benefits, 'Social welfare programs'),
        renderStatBox('Crime Rate', 'crime_rate', nation.crime_rate, 'Criminal incidents per capita', null, true),
        renderStatBox('Incarceration Rate', 'incarceration_rate', nation.incarceration_rate, 'Imprisoned population', null, true)
    ]);

    // GOVERNANCE
    h += sectorBlock('🏛️', 'Governance', [
        renderStatBox('Stability', 'stability', nation.stability, 'Government steadiness'),
        renderStatBox('Legitimacy', 'legitimacy', nation.legitimacy, 'Public trust in government'),
        renderStatBox('Efficiency', 'efficiency', nation.efficiency, 'Bureaucratic effectiveness'),
        renderStatBox('Corruption', 'corruption', nation.corruption, 'Abuse of public office', null, true),
        renderStatBox('Press Freedom', 'press_freedom', nation.press_freedom, 'Media independence'),
        renderStatBox('Judicial Independence', 'judicial_independence', nation.judicial_independence, 'Court system fairness'),
        renderStatBox('Freedom Index', 'freedom_index', nation.freedom_index, 'Civil liberties rating'),
        renderStatBox('Polarization', 'polarization', nation.polarization, 'Political division', null, true)
    ]);

    // SECURITY
    h += sectorBlock('🛡️', 'Security', [
        renderStatBox('Civil Unrest', 'civil_unrest', nation.civil_unrest, 'Protests and riots', null, true),
        renderStatBox('Terrorism Threat', 'terrorism', nation.terrorism, 'Extremist activity level', null, true),
        renderStatBox('Political Violence', 'political_violence', nation.political_violence, 'Politically motivated attacks', null, true)
    ]);

    // IMMIGRATION
    h += sectorBlock('✈️', 'Immigration', [
        renderStatBox('Immigration', 'immigration', nation.immigration, 'People entering legally'),
        renderStatBox('Illegal Immigration', 'illegal_immigration', nation.illegal_immigration, 'Undocumented arrivals', null, true),
        renderStatBox('Emigration', 'emigration', nation.emigration, 'Citizens leaving (brain drain)', null, true)
    ]);

    // INTERNATIONAL
    h += sectorBlock('🌐', 'International', [
        renderStatBox('Intl. Reputation', 'international_reputation', nation.international_reputation, 'Global standing and respect'),
        renderStatBox('Trade Agreements', 'trade_agreements', nation.trade_agreements, 'Active trade deals', 'count'),
        renderStatBox('Sanctions', 'sanctions', nation.sanctions, 'International penalties', null, true)
    ]);

    // VOTER DEMOGRAPHICS
    h += '<div class="sector-block"><div class="sector-header"><span class="sector-icon">🗳️</span> Voter Demographics</div>';
    h += renderVoterAxis('Competition', nation.competition_voters, 'Cooperation');
    h += renderVoterAxis('Liberty', nation.liberty_voters, 'Equality');
    h += renderVoterAxis('Security', nation.security_voters, 'Freedom');
    h += renderVoterAxis('Globalism', nation.globalism_voters, 'Nationalism');
    h += '</div>';

    h += '</div>'; // end stats-section

    document.getElementById('content-area').innerHTML = h;
}

/**
 * Helper: wrap stat boxes in a sector block
 */
function sectorBlock(icon, title, boxes) {
    return '<div class="sector-block"><div class="sector-header"><span class="sector-icon">' + icon + '</span> ' + title + '</div><div class="stat-boxes">' + boxes.join('') + '</div></div>';
}

/**
 * Render a single stat box with ranking and trend
 */
function renderStatBox(name, statKey, value, description, format, inverted) {
    format = format || null;
    inverted = inverted || false;
    var numValue = parseInt(value) || 0;

    var colorClass = 'medium';
    if (value !== null && value !== undefined) {
        if (inverted) {
            if (numValue <= 30) colorClass = 'good';
            else if (numValue <= 60) colorClass = 'medium';
            else colorClass = 'bad';
        } else {
            if (numValue >= 70) colorClass = 'good';
            else if (numValue >= 40) colorClass = 'medium';
            else colorClass = 'bad';
        }
    }

    var formattedValue = (value !== null && value !== undefined) ? value : 'N/A';
    if (format === 'currency' && typeof value === 'number') formattedValue = formatCurrencyShort(value);
    else if (format === 'years' && typeof value === 'number') formattedValue = value + ' yrs';

    var trendArrow = getTrendArrow(statKey, value, inverted, format);
    var rank = calculateRanking(statKey, value, inverted);
    var rankHTML = rank ? '<div class="stat-box-footer"><span class="ranking-badge' + (rank === 1 ? ' first' : '') + '">#' + rank + ' of ' + totalNations + '</span></div>' : '';

    return '<div class="stat-box ' + colorClass + '">' +
        '<div class="stat-box-header">' +
            '<span class="stat-box-name">' + name + '</span>' +
            '<span class="stat-box-value ' + colorClass + '">' + formattedValue + ' ' + trendArrow + '</span>' +
        '</div>' +
        '<div class="stat-box-desc">' + description + '</div>' +
        rankHTML +
    '</div>';
}

function renderVoterAxis(leftLabel, leftValue, rightLabel) {
    var leftPct = (leftValue !== null && leftValue !== undefined) ? leftValue : 50;
    var rightPct = 100 - leftPct;
    return '<div class="voter-axis">' +
        '<div class="voter-axis-header"><span class="voter-axis-left">' + leftLabel + '</span><span class="voter-axis-right">' + rightLabel + '</span></div>' +
        '<div class="voter-bar-container">' +
            '<div class="voter-bar-left" style="width:' + leftPct + '%">' + leftPct + '%</div>' +
            '<div class="voter-bar-right">' + rightPct + '%</div>' +
        '</div></div>';
}

function formatPopulation(pop) {
    if (!pop) return 'N/A';
    return Number(pop).toLocaleString();
}

function formatCurrencyShort(val) {
    if (val == null) return 'N/A';
    val = Number(val);
    if (val >= 1e12) return '$' + (val / 1e12).toFixed(1) + ' Trillion';
    if (val >= 1e9) return '$' + (val / 1e9).toFixed(1) + ' Billion';
    if (val >= 1e6) return '$' + (val / 1e6).toFixed(1) + ' Million';
    return '$' + val.toLocaleString();
}

function formatGDP(gdp) {
    if (!gdp) return 'N/A';
    return formatCurrencyShort(gdp);
}
</script>
