// ===== HELPER FUNCTIONS =====

function healthColor(val, inverted) {
    var v = inverted ? 100 - val : val;
    if (v >= 65) return 'var(--n-green)';
    if (v >= 45) return 'var(--n-yellow)';
    if (v >= 25) return 'var(--n-orange)';
    return 'var(--n-red)';
}

// Resolve a CSS variable to its computed hex value (for SVG attributes that can't use var())
function getCSSColor(varName) {
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
}
function healthColorRaw(val, inverted) {
    var v = inverted ? 100 - val : val;
    if (v >= 65) return getCSSColor('--n-green');
    if (v >= 45) return getCSSColor('--n-yellow');
    if (v >= 25) return getCSSColor('--n-orange');
    return getCSSColor('--n-red');
}

function catHealth(cat, nation) {
    var scored = cat.stats.filter(function(s) {
        if (s.noHealth) return false;
        if (s.conditional && !s.conditional(nation)) return false;
        var v = nation[s.key];
        return v !== null && v !== undefined;
    });
    if (!scored.length) return 50;
    var sum = 0;
    for (var i = 0; i < scored.length; i++) {
        var v = Number(nation[scored[i].key]);
        if (isNaN(v)) v = 50;
        v = Math.max(0, Math.min(v, 100));
        if (scored[i].inverted) v = 100 - v;
        sum += v;
    }
    return sum / scored.length;
}

function isSectionOpen(catId) {
    if (sectionState[catId] !== undefined) return sectionState[catId];
    return !!defaultOpen[catId];
}

function toggleSection(catId) {
    var isOpen = isSectionOpen(catId);
    sectionState[catId] = !isOpen;
    sessionStorage.setItem('nationSectionState', JSON.stringify(sectionState));
    var header = document.querySelector('.cat-header[data-cat="' + catId + '"]');
    var body = document.getElementById('cat-body-' + catId);
    if (!header || !body) return;
    if (sectionState[catId]) {
        header.classList.add('cat-header--open');
        body.classList.add('cat-body--open');
    } else {
        header.classList.remove('cat-header--open');
        body.classList.remove('cat-body--open');
    }
}

// Initialize page
initPage('nation', async (state) => {
    const { nation, faction } = state;
    if (!nation) {
        document.getElementById('content-area').innerHTML = '<div class="loading-container"><div style="font-size:24px">No Nation</div><div>Your party is not assigned to a nation yet.</div></div>';
        return;
    }

    // Fix placeholder government_type values from DB
    if (!nation.government_type || nation.government_type.toLowerCase().includes('your_gov_here')) {
        nation.government_type = CANONICAL_GOVERNMENT_TYPES.PARLIAMENTARY_DEMOCRACY;
    }

    await Promise.all([
        loadAllNations(),
        loadPreviousTickData(nation.id),
        loadStatEffectSources(nation.id, nation),
        loadSparklineHistory(nation.id)
    ]);
    await renderNationPage(nation);

    // Auto-refresh when a tick advances (debounced to prevent concurrent renders)
    let _isRefreshing = false;
    window.addEventListener('tick-advanced', async () => {
        if (_isRefreshing) return;
        _isRefreshing = true;
        try {
            qCacheBust('prev_tick_');
            qCacheBust('sparkline_');
            qCacheBust('stat_effects_');
            qCacheBust('all_nations');
            previousTickData = null;
            sparklineHistory = {};
            statEffectsByKey = {};

            const freshState = await refreshGameState();
            const freshNation = freshState?.nation;
            if (!freshNation) return;

            await Promise.all([
                loadAllNations(),
                loadPreviousTickData(freshNation.id),
                loadStatEffectSources(freshNation.id, freshNation),
                loadSparklineHistory(freshNation.id)
            ]);
            await renderNationPage(freshNation);
        } catch (e) {
            console.error('[nation.html] Error refreshing after tick:', e);
        } finally {
            _isRefreshing = false;
        }
    });
});

async function loadAllNations() {
    const cached = qCache('all_nations');
    if (cached) { allNations = cached; totalNations = cached.length; return; }
    const { data: nations, error } = await _supabase.from('nations').select('*');
    if (!error && nations) { allNations = nations; totalNations = nations.length; qCacheSet('all_nations', nations, 2 * 60 * 1000); }
}

async function loadPreviousTickData(nationId) {
    const cacheKey = 'prev_tick_' + nationId;
    const cached = qCache(cacheKey);
    if (cached) { previousTickData = cached; return; }
    const currentTick = await getShardTick();
    if (!currentTick) return;
    const previousTick = currentTick - 1;
    if (previousTick < 0) { console.warn('[loadPreviousTickData] current_tick is', currentTick, '— no previous tick yet'); return; }

    // Use .limit(1) instead of .maybeSingle() — maybeSingle sends an Accept header
    // that causes PostgREST to return HTTP 406 when 0 rows match, which logs a
    // console error even though supabase-js handles it gracefully.
    const { data: historyRows, error } = await _supabase.from('nations_history')
        .select('*').eq('nation_id', nationId).eq('tick', previousTick).limit(1);
    if (error) {
        console.warn('[loadPreviousTickData] Query error for tick ' + previousTick + ':', error.message);
    }
    const history = (historyRows && historyRows.length > 0) ? historyRows[0] : null;
    if (history) {
        previousTickData = history;
        qCacheSet(cacheKey, history, 5 * 60 * 1000);
        return;
    }

    // No history row for the exact previous tick — fall back to the most recent
    // available snapshot, but only if it's within 2 ticks. Beyond that the delta
    // spans too many ticks and becomes misleading (shows stale cumulative change).
    const MAX_FALLBACK_AGE = 2;
    console.warn('[loadPreviousTickData] No history row for tick', previousTick,
        '— falling back to most recent snapshot (max age:', MAX_FALLBACK_AGE, 'ticks).');
    const { data: fallbackRows } = await _supabase.from('nations_history')
        .select('*').eq('nation_id', nationId)
        .gte('tick', currentTick - MAX_FALLBACK_AGE - 1)
        .lt('tick', currentTick)
        .order('tick', { ascending: false }).limit(1);
    if (fallbackRows && fallbackRows.length > 0) {
        previousTickData = fallbackRows[0];
        qCacheSet(cacheKey, fallbackRows[0], 2 * 60 * 1000); // shorter TTL for fallback
        console.warn('[loadPreviousTickData] Using fallback snapshot from tick', fallbackRows[0].tick);
    } else {
        console.warn('[loadPreviousTickData] No recent snapshot within', MAX_FALLBACK_AGE, 'ticks — trend arrows will show neutral.');
    }
}

async function loadSparklineHistory(nationId) {
    var cacheKey = 'sparkline_' + nationId;
    var cached = qCache(cacheKey);
    if (cached) { sparklineHistory = cached; return; }
    var currentTick = await getShardTick();
    if (!currentTick) return;
    var fromTick = Math.max(0, currentTick - 10);
    var { data: rows, error: histErr } = await _supabase.from('nations_history')
        .select('*').eq('nation_id', nationId)
        .gte('tick', fromTick).order('tick', { ascending: true });
    if (histErr) { console.warn('[loadSparklineHistory] Query error:', histErr.message); return; }
    if (!rows || rows.length === 0) return;
    // Build per-stat arrays
    var allKeys = [];
    for (var ci = 0; ci < STAT_CATEGORIES.length; ci++) {
        for (var si = 0; si < STAT_CATEGORIES[ci].stats.length; si++) {
            allKeys.push(STAT_CATEGORIES[ci].stats[si].key);
        }
    }
    var map = {};
    for (var ki = 0; ki < allKeys.length; ki++) {
        var k = allKeys[ki];
        var vals = [];
        for (var ri = 0; ri < rows.length; ri++) {
            var v = rows[ri][k];
            if (v === null || v === undefined) continue;
            var numeric = Number(v);
            if (!isNaN(numeric) && isFinite(numeric)) vals.push(numeric);
        }
        if (vals.length > 0) map[k] = vals;
    }
    sparklineHistory = map;
    qCacheSet(cacheKey, map, 2 * 60 * 1000);
}

// ===== Affected-By: Data Fetching =====

async function loadStatEffectSources(nationId, nation) {
    var cacheKey = 'stat_effects_' + nationId;
    var cached = qCache(cacheKey);
    if (cached) { statEffectsByKey = cached; return; }

    var results;
    try {
    results = await Promise.all([
        // Phase 5.4: also load the chosen option so per-stat "what's
        // affecting this" surfaces option-specific stat_effects rather
        // than the legacy policies row (which Phase 2.5 stops writing).
        // Phase 5-fix: trimmed select drops columns removed from the live
        // schema (target_stat, stat_direction, stat_change_per_tick,
        // duration_months); PostgREST rejects the whole Promise.all when
        // any selected column is missing, which would silently empty the
        // per-stat panel for option-bearing laws too.
        _supabase.from('active_laws')
            .select('is_reversal, passed_tick, effects_applied_through_tick, policies(policy_name), selected_option:policy_options!selected_option_id(option_name, stat_effects)')
            .eq('nation_id', nationId),
        _supabase.from('active_crises')
            .select('crisis_id, crisis_templates(name, crisis_effects(stat_key, change_per_tick, target))')
            .eq('nation_id', nationId),
        _supabase.from('ministry_action_log')
            .select('action_key, stat_effects, applied_at_tick')
            .eq('nation_id', nationId)
            .eq('processed', false),
        _supabase.from('diplomatic_action_log')
            .select('action_type, stat_effects, applied_at_tick')
            .eq('nation_id', nationId)
            .eq('processed', false),
        loadLeaderTraitEffects(nationId, nation),
        _supabase.from('stat_connections')
            .select('source_stat, source_dir, threshold, target_stat, target_dir, magnitude, dampening')
            .eq('enabled', true),
        _supabase.from('budget_item_allocations')
            .select('item_id, item_type, allocation_amount, needed_amount')
            .eq('nation_id', nationId)
            .eq('item_type', 'institution')
            .order('created_at', { ascending: true }),
        _supabase.from('ministry_institution_config')
            .select('*')
    ]);
    } catch (e) {
        console.warn('[loadStatEffectSources] Failed to fetch effect sources:', e.message);
        return;
    }

    var currentTick = await getShardTick();
    var map = {};
    parsePolicyEffects(results[0].data || [], map, currentTick);
    parseCrisisEffects(results[1].data || [], map);
    parseMinistryEffects(results[2].data || [], map, currentTick);
    parseDiplomaticEffects(results[3].data || [], map, currentTick);
    parseLeaderTraitEffects(results[4], map);
    parseInstitutionEffects(results[6].data || [], results[7].data || [], nation, map);
    parseDebtPressureEffects(nation, map);
    rawStatConnections = results[5].data || [];
    parseStatConnectionEffects(rawStatConnections, nation, map);
    parseTradeSystemEffects(nation, map);
    parseDecayEffects(nation, map);

    statEffectsByKey = map;
    qCacheSet(cacheKey, map, 2 * 60 * 1000);
}

async function loadLeaderTraitEffects(nationId, nation) {
    // Old leader_traits effect system removed — trait is display-only now
    return null;
    try {
        if (hasElectedPresident(nation)) {
            var res = await _supabase.from('presidents')
                .select('trait, first_name, last_name')
                .eq('nation_id', nationId)
                .eq('is_active', true)
                .limit(1);
            if (!res.data || res.data.length === 0 || !res.data[0].trait) return null;
            var president = res.data[0];
            var traitRes = await _supabase.from('leader_traits')
                .select('trait_key, effects')
                .eq('trait_key', president.trait)
                .limit(1);
            if (!traitRes.data || traitRes.data.length === 0) return null;
            return { name: president.first_name + ' ' + president.last_name, traitKey: traitRes.data[0].trait_key, effects: traitRes.data[0].effects };
        } else {
            var res = await _supabase.from('head_of_government')
                .select('first_name, last_name, trait_key, leader_traits(trait_key, effects)')
                .eq('nation_id', nationId)
                .eq('active', true)
                .limit(1);
            if (!res.data || res.data.length === 0) return null;
            var hog = res.data[0];
            if (!hog.leader_traits || !hog.leader_traits.effects) return null;
            return { name: hog.first_name + ' ' + hog.last_name, traitKey: hog.leader_traits.trait_key, effects: hog.leader_traits.effects };
        }
    } catch (e) {
        console.warn('[loadLeaderTraitEffects] Error:', e);
        return null;
    }
}

function addEffectToMap(map, statKey, name, direction, type, rate, remainingTicks, extras) {
    var key = normalizeNationStatKey(statKey);
    if (!key) return;
    if (!map[key]) map[key] = [];
    var parsedRate = (rate === null || rate === undefined || rate === '') ? null : Number(rate);
    if (!Number.isFinite(parsedRate)) parsedRate = null;
    var parsedRemaining = (remainingTicks === null || remainingTicks === undefined) ? null : Number(remainingTicks);
    if (!Number.isFinite(parsedRemaining) || parsedRemaining < 0) parsedRemaining = null;
    // Deduplicate and backfill missing rate where available
    for (var i = 0; i < map[key].length; i++) {
        if (map[key][i].name === name && map[key][i].direction === direction && map[key][i].type === type) {
            if ((map[key][i].rate === null || map[key][i].rate === undefined) && parsedRate !== null) {
                map[key][i].rate = parsedRate;
            }
            if ((map[key][i].remainingTicks === null || map[key][i].remainingTicks === undefined) && parsedRemaining !== null) {
                map[key][i].remainingTicks = parsedRemaining;
            }
            return;
        }
    }
    map[key].push({ name: name, direction: direction, type: type, rate: parsedRate, remainingTicks: parsedRemaining, extras: extras || null });
}

function parsePolicyEffects(laws, map, currentTick) {
    for (var i = 0; i < laws.length; i++) {
        var law = laws[i];
        var policy = law.policies;
        if (!policy) continue;
        var ticksSince = currentTick - (law.passed_tick || 0);
        // Phase 5.4: prefer the chosen option's stat_effects and label the
        // contribution with "Policy — Option" so the per-stat panel shows
        // which option of a multi-option policy is currently shifting the
        // stat. Falls back to the legacy policies columns for orphaned
        // pre-multi-option laws.
        var opt = law.selected_option || null;
        var baseName = (opt && opt.option_name)
            ? (policy.policy_name + ' — ' + opt.option_name)
            : policy.policy_name;
        var label = law.is_reversal ? (baseName + ' (Repeal)') : baseName;

        var effects = (opt && Array.isArray(opt.stat_effects) && opt.stat_effects.length > 0)
            ? opt.stat_effects
            : policy.stat_effects;
        if (effects && Array.isArray(effects) && effects.length > 0) {
            for (var j = 0; j < effects.length; j++) {
                var eff = effects[j];
                if (!eff.stat_key) continue;
                var delay = Number(eff.delay_ticks) || 0;
                var dur = Number(eff.duration_ticks) || 12;
                // Skip effects that haven't started yet or have expired
                if (ticksSince <= delay || ticksSince > delay + dur) continue;
                var dir = (eff.direction || 'up').toLowerCase() === 'up' ? 'up' : 'down';
                // Reversal laws flip the effect direction
                if (law.is_reversal) dir = (dir === 'up') ? 'down' : 'up';
                var rate = Number(eff.rate);
                if (!Number.isFinite(rate)) rate = Number(policy.stat_change_per_tick);
                if (!Number.isFinite(rate)) rate = 1;
                var remaining = (delay + dur) - ticksSince;
                addEffectToMap(map, eff.stat_key, label, dir, 'Policy', rate, remaining);
            }
            continue;
        }

        // Legacy policy fallback when stat_effects JSON is missing
        if (!policy.target_stat) continue;
        var legacyDur = Number(policy.duration_months) || 12;
        if (ticksSince <= 0 || ticksSince > legacyDur) continue;
        var legacyDir = (policy.stat_direction || 'up').toLowerCase() === 'up' ? 'up' : 'down';
        if (law.is_reversal) legacyDir = (legacyDir === 'up') ? 'down' : 'up';
        var legacyRate = Number(policy.stat_change_per_tick);
        if (!Number.isFinite(legacyRate)) legacyRate = 1;
        var legacyRemaining = legacyDur - ticksSince;
        addEffectToMap(map, policy.target_stat, label, legacyDir, 'Policy', legacyRate, legacyRemaining);
    }
}

function parseCrisisEffects(crises, map) {
    for (var i = 0; i < crises.length; i++) {
        var c = crises[i];
        var t = c.crisis_templates;
        if (!t) continue;
        var effects = t.crisis_effects || [];
        for (var j = 0; j < effects.length; j++) {
            var eff = effects[j];
            if (eff.target !== 'nation' || !eff.stat_key) continue;
            var dir = eff.change_per_tick > 0 ? 'up' : 'down';
            addEffectToMap(map, eff.stat_key, t.name, dir, 'Crisis');
        }
    }
}

function parseMinistryEffects(actions, map, currentTick) {
    for (var i = 0; i < actions.length; i++) {
        var action = actions[i];
        var effects = action.stat_effects;
        if (!effects || !Array.isArray(effects)) continue;
        var ticksSince = currentTick - (action.applied_at_tick || 0);
        for (var j = 0; j < effects.length; j++) {
            var eff = effects[j];
            if (eff.target && eff.target !== 'nation') continue;
            if (!eff.stat_key) continue;
            var dir = (eff.direction || 'up').toLowerCase() === 'up' ? 'up' : 'down';
            var delay = Number(eff.delay_ticks) || 0;
            var dur = Number(eff.duration_ticks) || 4;
            var remaining = (delay + dur) - ticksSince;
            addEffectToMap(map, eff.stat_key, prettyStatName(action.action_key), dir, 'Ministry Action', eff.rate || null, remaining);
        }
    }
}

function parseDiplomaticEffects(actions, map, currentTick) {
    for (var i = 0; i < actions.length; i++) {
        var action = actions[i];
        var effects = action.stat_effects;
        if (!effects || !Array.isArray(effects)) continue;
        var ticksSince = currentTick - (action.applied_at_tick || 0);
        for (var j = 0; j < effects.length; j++) {
            var eff = effects[j];
            if (!eff.stat_key) continue;
            var dir = (eff.direction || 'up').toLowerCase() === 'up' ? 'up' : 'down';
            var delay = Number(eff.delay_ticks) || 0;
            var dur = Number(eff.duration_ticks) || 4;
            var remaining = (delay + dur) - ticksSince;
            addEffectToMap(map, eff.stat_key, prettyStatName(action.action_type), dir, 'Diplomatic Action', eff.rate || null, remaining);
        }
    }
}

function parseLeaderTraitEffects(traitData, map) {
    if (!traitData || !traitData.effects || !traitData.effects.nation_stat_per_tick) return;
    var perTick = traitData.effects.nation_stat_per_tick;
    var traitLabel = prettyStatName(traitData.traitKey);
    for (var rawStat in perTick) {
        if (!perTick.hasOwnProperty(rawStat)) continue;
        var delta = perTick[rawStat];
        if (delta === 0) continue;
        addEffectToMap(map, rawStat, traitLabel, delta > 0 ? 'up' : 'down', 'Leader Trait');
    }
}

function parseStatConnectionEffects(connections, nation, map) {
    for (var i = 0; i < connections.length; i++) {
        var conn = connections[i];
        if (!conn.source_stat || !conn.target_stat) continue;
        var sourceVal = nation[conn.source_stat] !== undefined && nation[conn.source_stat] !== null
            ? Number(nation[conn.source_stat]) : 50;
        var triggered = conn.source_dir === 'above'
            ? sourceVal > conn.threshold
            : sourceVal < conn.threshold;
        if (!triggered) continue;
        var label = prettyStatName(conn.source_stat);
        addEffectToMap(map, conn.target_stat, label, conn.target_dir || 'up', 'Stat Link', Number(conn.magnitude) || null);
    }
}

var INSTITUTION_TIER_LABELS = [
    { minPct: 100, label: 'Fully Funded', color: '#4ade80' },
    { minPct: 90,  label: 'Stretched',    color: '#a3e635' },
    { minPct: 75,  label: 'Strained',     color: '#fbbf24' },
    { minPct: 50,  label: 'Underfunded',  color: '#f97316' },
    { minPct: 25,  label: 'Critical',     color: '#ef4444' },
    { minPct: 0,   label: 'Collapsed',    color: '#f43f5e' },
];

function getInstitutionTier(pct) {
    for (var i = 0; i < INSTITUTION_TIER_LABELS.length; i++) {
        if (pct >= INSTITUTION_TIER_LABELS[i].minPct) return INSTITUTION_TIER_LABELS[i];
    }
    return INSTITUTION_TIER_LABELS[INSTITUTION_TIER_LABELS.length - 1];
}

// Decay rates matching INSTITUTION_DECAY_TIERS in stats.js
var INST_DECAY_RATES = [
    { minPct: 100, primary: 0,   secondary: 0   },
    { minPct: 90,  primary: 0.3, secondary: 0   },
    { minPct: 75,  primary: 0.5, secondary: 0.2 },
    { minPct: 50,  primary: 0.9, secondary: 0.5 },
    { minPct: 25,  primary: 1.7, secondary: 0.9 },
    { minPct: 0,   primary: 2.7, secondary: 1.7 },
];

function getInstDecayRate(pct, role) {
    for (var i = 0; i < INST_DECAY_RATES.length; i++) {
        if (pct >= INST_DECAY_RATES[i].minPct) return INST_DECAY_RATES[i][role];
    }
    return INST_DECAY_RATES[INST_DECAY_RATES.length - 1][role];
}

function parseInstitutionEffects(allocations, institutions, nation, map) {
    // Build funding pct map
    var fundingMap = {};
    for (var i = 0; i < allocations.length; i++) {
        var row = allocations[i];
        var needed = Number(row.needed_amount || 0);
        fundingMap[row.item_id] = needed > 0
            ? Math.min(200, Math.round((Number(row.allocation_amount || 0) / needed) * 100))
            : 100;
    }
    // Show every institution on its covered stats — regardless of funding level
    for (var j = 0; j < institutions.length; j++) {
        var inst = institutions[j];
        var pct = fundingMap[inst.id] !== undefined ? fundingMap[inst.id] : 100;
        var tier = getInstitutionTier(pct);
        var isFullyFunded = pct >= 100;
        var isCollapsed = pct < 25;
        var hasGrowth = !!inst.growth_stat;

        var roles = ['primary', 'secondary'];
        for (var r = 0; r < roles.length; r++) {
            var statKey = inst[roles[r] + '_stat'];
            if (!statKey) continue;

            var rate = null;
            var dir = 'up';
            var badge = tier.label;

            if (isFullyFunded) {
                // Check if this institution has a growth stat that matches this stat key
                if (hasGrowth && inst.growth_stat === statKey) {
                    // Actively growing: +0.25/tick toward ceiling
                    var currentVal = nation[statKey] !== undefined && nation[statKey] !== null ? Number(nation[statKey]) : 0;
                    var ceiling = Number(inst.growth_ceiling || 30);
                    if (currentVal < ceiling) {
                        dir = 'up';
                        rate = 0.25;
                    } else {
                        // At ceiling — holding
                        dir = 'up';
                        rate = null;
                    }
                } else {
                    // Fully funded, no growth on this stat — holding (no decay)
                    dir = 'up';
                    rate = null;
                }
            } else {
                // Underfunded — decaying
                var decayRate = getInstDecayRate(pct, roles[r]);
                if (decayRate > 0) {
                    dir = 'down';
                    rate = decayRate;
                } else {
                    // e.g. Stretched secondary = 0 decay
                    dir = 'up';
                    rate = null;
                    badge = tier.label;
                }
            }

            var label = inst.institution_name || inst.name;
            addEffectToMap(map, statKey, label, dir, 'Institution', rate, null, {
                fundingPct: pct,
                tierLabel: badge,
                tierColor: tier.color,
                isCollapsed: isCollapsed,
                isFullyFunded: isFullyFunded,
                hasGrowthEffect: isFullyFunded && hasGrowth && inst.growth_stat === statKey,
            });
        }
    }
}

// ── Debt Pressure: graduated stat effects from debt-to-budget ratio ──
var DEBT_PRESSURE_TIERS_CLIENT = [
    { maxRatio: 0.60, label: 'Healthy',     color: '#4ade80', effects: {} },
    { maxRatio: 0.80, label: 'Elevated',    color: '#a3e635', effects: {} },
    { maxRatio: 1.00, label: 'Concerning',  color: '#fbbf24', effects: {} },
    { maxRatio: 1.50, label: 'Dangerous',   color: '#f97316', effects: {} },
    { maxRatio: 2.00, label: 'Severe',      color: '#ef4444', effects: {} },
    { maxRatio: Infinity, label: 'Crisis',  color: '#f43f5e', effects: {} },
];

function parseDebtPressureEffects(nation, map) {
    var debt = Number(nation.debt || 0);
    var budget = Number(nation.budget || 0);
    if (budget <= 0 || debt <= 0) return;
    var ratio = debt / budget;

    var tier = DEBT_PRESSURE_TIERS_CLIENT[0];
    for (var i = 0; i < DEBT_PRESSURE_TIERS_CLIENT.length; i++) {
        if (ratio <= DEBT_PRESSURE_TIERS_CLIENT[i].maxRatio) { tier = DEBT_PRESSURE_TIERS_CLIENT[i]; break; }
    }

    // Only show entries for stats that have nonzero effects at this tier
    var effects = tier.effects;
    var pctLabel = Math.round(ratio * 100) + '% Debt-to-Budget';
    for (var statKey in effects) {
        if (!effects.hasOwnProperty(statKey)) continue;
        var delta = effects[statKey];
        if (delta === 0) continue;
        var dir = delta > 0 ? 'up' : 'down';
        addEffectToMap(map, statKey, pctLabel, dir, 'Debt Pressure', Math.abs(delta), null, {
            tierLabel: tier.label,
            tierColor: tier.color,
            isDebtPressure: true,
        });
    }
}

// Stats known to be affected by the trade system engine each tick
var TRADE_AFFECTED_STATS = {
    gdp_growth: 'Trade Balance'
};

function parseTradeSystemEffects(nation, map) {
    for (var statKey in TRADE_AFFECTED_STATS) {
        if (!TRADE_AFFECTED_STATS.hasOwnProperty(statKey)) continue;
        var label = TRADE_AFFECTED_STATS[statKey];
        // We can't compute the exact direction without replicating the trade engine,
        // but we can detect the direction from the per-tick delta if available
        var dir = 'up';
        if (previousTickData && previousTickData[statKey] != null && nation[statKey] != null) {
            var delta = Number(nation[statKey]) - Number(previousTickData[statKey]);
            if (Math.abs(delta) >= 0.01) {
                dir = delta > 0 ? 'up' : 'down';
            } else {
                continue; // no measurable trade effect this tick
            }
        } else {
            continue; // no delta data, don't show speculative effect
        }
        addEffectToMap(map, statKey, label, dir, 'Trade');
    }
}

function parseDecayEffects(nation, map) {
    for (var statKey in STAT_DECAY_CONFIG) {
        if (!STAT_DECAY_CONFIG.hasOwnProperty(statKey)) continue;
        var config = STAT_DECAY_CONFIG[statKey];
        var currentVal = nation[statKey] !== undefined && nation[statKey] !== null ? Number(nation[statKey]) : 50;
        if (currentVal === config.target) continue;
        var dir = currentVal > config.target ? 'down' : 'up';
        var label = config.type === 'erosion' ? 'Natural Erosion' : 'Natural Decay';
        // Pass config.speed as the rate so the UI shows the numeric decay value
        addEffectToMap(map, statKey, label, dir, 'Decay', config.speed);
    }
}

// ===== End Affected-By Data Fetching =====

function calculateRanking(statKey, value, inverted = false) {
    if (value === null || value === undefined) return null;
    const values = allNations.map(n => n[statKey]).filter(v => v !== null && v !== undefined);
    if (values.length === 0) return null;
    // Count how many nations are strictly better (handles ties correctly)
    const betterCount = values.filter(v => inverted ? v < value : v > value).length;
    return betterCount + 1;
}

function prettyStatName(key) {
    return key.replace(/_/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
}

async function getShardTick() {
    var cached = qCache('shard_current_tick');
    if (cached) return cached;
    var res = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    if (res.data) { qCacheSet('shard_current_tick', res.data.current_tick, 30 * 1000); return res.data.current_tick; }
    return 0;
}

async function renderRevolutionBanner(nation) {
    var currentTick = await getShardTick();
    var revRows = await _supabase
        .from('event_log')
        .select('fired_at_tick, description_used')
        .eq('nation_id', nation.id)
        .eq('event_name', 'DEMOCRATIC_REVOLUTION')
        .order('fired_at_tick', { ascending: false })
        .limit(1);
    var revData = (revRows.data && revRows.data.length > 0) ? revRows.data[0] : null;
    if (revData && (currentTick - revData.fired_at_tick) <= 5) {
        var electionTick = revData.fired_at_tick + 3;
        var ticksUntilElection = Math.max(0, electionTick - currentTick);
        var h = '<div class="revolution-complete-banner">';
        h += '<div class="revolution-banner__title">Revolution in the Streets!</div>';
        h += '<div class="revolution-banner__subtitle">' + escapeHtml(revData.description_used) + '</div>';
        h += '<div class="revolution-banner__tags">';
        if (ticksUntilElection > 0) {
            h += '<span class="revolution-tag revolution-tag--green">Emergency Elections in ' + ticksUntilElection + ' tick' + (ticksUntilElection !== 1 ? 's' : '') + '</span>';
        } else {
            h += '<span class="revolution-tag revolution-tag--green">Elections Complete</span>';
        }
        h += '<span class="revolution-tag revolution-tag--green">Democracy Established</span></div></div>';
        return h;
    }
    return '';
}

// ===== DISPLAY HELPERS =====

function formatGdpGrowth(rawValue) {
    var v = Number(rawValue ?? 50);
    var pct = (v - 50) / 50;
    return (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
}

function formatTradeBalance(rawValue) {
    var v = Math.round(Number(rawValue ?? 50));
    var expPct = v, impPct = 100 - v;
    if (impPct === 0) return '100% Exports';
    if (expPct === 0) return '100% Imports';
    if (expPct === impPct) return 'Balanced';
    return expPct + '% Exp / ' + impPct + '% Imp';
}

// Detect budget/debt stored as 0-100 stat scores instead of raw dollars
var RAW_DOLLAR_KEYS = { budget: true, debt: true };
function isMisscaledMonetary(key, val) {
    return RAW_DOLLAR_KEYS[key] && val != null && Number(val) >= 0 && Number(val) <= 100000;
}

function formatUnemploymentPct(stat) {
    return (0.7 + (stat - 1) * 34.3 / 99).toFixed(1) + '%';
}

function getDisplayValue(stat, nation) {
    var raw = nation[stat.key];
    var format = stat.format;
    if (raw === null || raw === undefined) return 'N/A';
    if (format === 'currency') {
        assertRawEconomicValue(raw, stat.key);
    }
    if (format === 'currency' && isMisscaledMonetary(stat.key, raw)) {
        return '$' + Math.round(Number(raw));
    }
    if (format === 'count') return formatNumber(raw);
    if (format === 'currency') return formatCurrencyShort(scaleRawToDollars(raw));
    if (format === 'gdpgrowth') return formatGdpGrowth(raw);
    return Math.round(Number(raw) * 10) / 10;
}

// ===== FEATURED CONTAINERS =====

function buildFeaturedSparkSVG(data, color, w, h) {
    w = w || 200; h = h || 50;
    if (!data || data.length < 2) return '';
    var mn = Math.min.apply(null, data), mx = Math.max.apply(null, data), r = mx - mn || 1;
    var pts = data.map(function(v, i) {
        return ((i / (data.length - 1)) * w).toFixed(1) + ',' + (h - ((v - mn) / r) * h).toFixed(1);
    }).join(' ');
    // Build a filled area polygon
    var firstY = (h - ((data[0] - mn) / r) * h).toFixed(1);
    var lastX = w.toFixed(1);
    var lastY = (h - ((data[data.length - 1] - mn) / r) * h).toFixed(1);
    var areaPts = '0,' + h + ' 0,' + firstY + ' ' + pts + ' ' + lastX + ',' + h;
    return '<svg width="' + w + '" height="' + h + '" style="display:block;width:100%;height:100%;" preserveAspectRatio="none">' +
        '<polygon points="' + areaPts + '" fill="' + color + '" fill-opacity="0.08"/>' +
        '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="1.5" stroke-linejoin="round"/>' +
        '<circle cx="' + lastX + '" cy="' + lastY + '" r="2" fill="' + color + '"/></svg>';
}

function buildFeaturedAbpHTML(statKey) {
    var effects = statEffectsByKey[statKey] || [];
    if (effects.length === 0) return '';
    var h = '<div class="featured-card__abp-title">Affected By</div>';
    for (var i = 0; i < effects.length; i++) {
        var eff = effects[i];
        var ext = eff.extras;
        var isInst = eff.type === 'Institution' && ext;
        var isDebtP = ext && ext.isDebtPressure;
        var hasTierColor = isInst || isDebtP;

        // Row class — collapsed institutions get warning background
        var rowClass = 'featured-card__abp-row';
        if (isInst && ext.isCollapsed) rowClass += ' featured-card__abp-row--collapsed';
        h += '<div class="' + rowClass + '">';

        // Name — collapsed gets warning icon prefix
        if (isInst && ext.isCollapsed) {
            h += '<span class="featured-card__abp-name"><span class="featured-card__abp-warn">&#9888;</span>' + escapeHtml(eff.name) + '</span>';
        } else {
            h += '<span class="featured-card__abp-name">' + escapeHtml(eff.name) + '</span>';
        }

        // Arrow and rate
        if (isInst && ext.isFullyFunded && !ext.hasGrowthEffect) {
            // Holding entry — flat indicator, no rate
            h += '<span class="featured-card__abp-arrow featured-card__abp-arrow--hold">&#9644;</span>';
        } else {
            var arrow = eff.direction === 'up' ? '&#9650;' : '&#9660;';
            var arrowClass = eff.direction === 'up' ? 'featured-card__abp-arrow--up' : 'featured-card__abp-arrow--down';
            if (hasTierColor) arrowClass += ' featured-card__abp-arrow--inst';
            h += '<span class="featured-card__abp-arrow ' + arrowClass + '"' + (hasTierColor ? ' style="color:' + ext.tierColor + '"' : '') + '>' + arrow + '</span>';
        }

        if (eff.rate !== null && eff.rate !== undefined) {
            var sign = eff.direction === 'up' ? '+' : '-';
            var rateStyle = hasTierColor ? ' style="color:' + ext.tierColor + '"' : '';
            h += '<span class="featured-card__abp-rate"' + rateStyle + '>' + sign + (Math.round(Math.abs(Number(eff.rate)) * 100) / 100) + '/tick</span>';
        }

        // Type badge — institutions and debt pressure get tier-specific badges
        if (isInst) {
            h += '<span class="featured-card__abp-type featured-card__abp-type--institution" style="background:' + ext.tierColor + '18;color:' + ext.tierColor + '">' + escapeHtml(ext.tierLabel) + '</span>';
        } else if (isDebtP) {
            h += '<span class="featured-card__abp-type featured-card__abp-type--debt-pressure" style="background:' + ext.tierColor + '18;color:' + ext.tierColor + '">' + escapeHtml(ext.tierLabel) + '</span>';
        } else {
            var typeClass = 'featured-card__abp-type--' + eff.type.toLowerCase().replace(/ /g, '-');
            h += '<span class="featured-card__abp-type ' + typeClass + '">' + escapeHtml(eff.type) + '</span>';
        }

        if (eff.remainingTicks !== null && eff.remainingTicks !== undefined) {
            h += '<span class="featured-card__abp-ticks">' + eff.remainingTicks + ' tick' + (eff.remainingTicks !== 1 ? 's' : '') + '</span>';
        }
        h += '</div>';
    }
    return h;
}

function getGdpGrowthLabel(monthlyPct) {
    if (monthlyPct < -0.33) return 'Recession';
    if (monthlyPct < 0) return 'Stagnant';
    if (monthlyPct < 0.17) return 'No Growth';
    if (monthlyPct < 1) return 'Growing';
    return 'Booming';
}

function getGdpGrowthScaleItems(monthlyPct) {
    return [
        { label: 'Recession', range: '< -0.33%', active: monthlyPct < -0.33 },
        { label: 'Stagnant', range: '-0.33% to 0%', active: monthlyPct >= -0.33 && monthlyPct < 0 },
        { label: 'No Growth', range: '0% to 0.17%', active: monthlyPct >= 0 && monthlyPct < 0.17 },
        { label: 'Growing', range: '0.17% to 1%', active: monthlyPct >= 0.17 && monthlyPct < 1 },
        { label: 'Booming', range: '> 1%', active: monthlyPct >= 1 }
    ];
}

function buildRankingPipsHTML(rank, total) {
    if (!rank) return '';
    total = total || 6;
    var pipColor = rank <= 2 ? 'var(--n-green)' : rank <= 4 ? 'var(--n-yellow)' : 'var(--n-red)';
    var h = '<div class="compact-bottom__rank">';
    for (var i = 0; i < total; i++) {
        h += i < rank
            ? '<div class="compact-bottom__rank-pip" style="background:' + pipColor + ';"></div>'
            : '<div class="compact-bottom__rank-pip compact-bottom__rank-pip--empty"></div>';
    }
    h += '<span class="compact-bottom__rank-label">#' + rank + '</span></div>';
    return h;
}

function renderFeaturedGDPGrowth(nation) {
    var gdpGrowthRaw = Number(nation.gdp_growth ?? 50);
    var monthlyPct = ((gdpGrowthRaw - 50) / 50) * 1;
    var yearlyPct = (Math.pow(1 + monthlyPct / 100, 12) - 1) * 100;
    var growthStr = (monthlyPct >= 0 ? '+' : '') + monthlyPct.toFixed(2) + '%';
    var yearlyStr = (yearlyPct >= 0 ? '+' : '') + yearlyPct.toFixed(2) + '%';

    // Color based on growth
    var growthColor, borderColor, dotColor, tagColor, tagBorder;
    if (monthlyPct >= 0.17) { growthColor = getCSSColor('--n-green'); borderColor = 'var(--n-green)'; dotColor = 'var(--n-green)'; tagColor = 'var(--n-green)'; tagBorder = 'var(--n-green)'; }
    else if (monthlyPct >= 0) { growthColor = getCSSColor('--n-yellow'); borderColor = 'var(--n-yellow)'; dotColor = 'var(--n-yellow)'; tagColor = 'var(--n-yellow)'; tagBorder = 'var(--n-yellow)'; }
    else { growthColor = getCSSColor('--n-red'); borderColor = 'var(--n-red)'; dotColor = 'var(--n-red)'; tagColor = 'var(--n-red)'; tagBorder = 'var(--n-red)'; }

    var yearlyColor = yearlyPct >= 0 ? 'var(--n-green)' : 'var(--n-red)';

    var gdpLabel = getGdpGrowthLabel(monthlyPct);

    // Delta per tick
    var deltaStr = '';
    if (previousTickData && previousTickData.gdp_growth != null) {
        var prevGrowthRaw = Number(previousTickData.gdp_growth);
        var delta = gdpGrowthRaw - prevGrowthRaw;
        if (Math.abs(delta) >= 0.01) {
            var deltaDir = delta > 0 ? '\u25B2' : '\u25BC';
            var deltaColor = delta > 0 ? 'var(--n-green)' : 'var(--n-red)';
            deltaStr = '<span class="featured-card__delta" style="color:' + deltaColor + ';">' + deltaDir + ' ' + Math.abs((delta) / 50).toFixed(2) + '% per tick</span>';
        }
    }

    var scaleItems = getGdpGrowthScaleItems(monthlyPct);

    // Sparkline (large chart)
    var sparkData = sparklineHistory['gdp_growth'] ? sparklineHistory['gdp_growth'].slice() : [];
    if (gdpGrowthRaw != null) sparkData.push(gdpGrowthRaw);
    var chartSVG = buildFeaturedSparkSVG(sparkData, growthColor);

    var h = '<div class="featured-card featured-card--compact" style="border-left-color:' + borderColor + ';">';
    // Header
    h += '<div class="featured-card__header">';
    h += '<div class="featured-card__dot" style="background:' + dotColor + ';"></div>';
    h += '<span class="featured-card__title">GDP Growth</span>';
    h += '<span class="featured-card__tag" style="color:' + tagColor + ';border-color:' + tagBorder + ';">' + escapeHtml(gdpLabel) + '</span>';
    h += '</div>';

    // Description
    h += '<div class="featured-card__desc">Monthly economic growth rate</div>';

    // Value + side stats
    h += '<div class="featured-card__value-row">';
    h += '<div><span class="featured-card__big-value" style="color:' + tagColor + ';">' + growthStr + '</span></div>';
    h += '<div class="featured-card__side-stats">';
    h += '<div><span class="featured-card__side-label">Yearly Forecast</span></div>';
    h += '<div><span class="featured-card__side-value" style="color:' + yearlyColor + ';">' + yearlyStr + '</span></div>';
    h += '</div>';
    h += '</div>';

    // Delta
    if (deltaStr) h += deltaStr;

    // Chart (large sparkline)
    h += '<div class="featured-card__chart">' + chartSVG + '</div>';

    // Scale
    h += '<div class="featured-card__scale">';
    for (var i = 0; i < scaleItems.length; i++) {
        var si = scaleItems[i];
        h += '<div class="featured-card__scale-item' + (si.active ? ' featured-card__scale-item--active' : '') + '">';
        h += escapeHtml(si.label);
        h += '<span class="featured-card__scale-range">' + escapeHtml(si.range) + '</span>';
        h += '</div>';
    }
    h += '</div>';

    // Affected by
    var effects = statEffectsByKey['gdp_growth'] || [];
    if (effects.length > 0) {
        h += buildFeaturedAbpHTML('gdp_growth');
    } else {
        h += '<div class="compact-empty">No active effects</div>';
    }

    h += '</div>';
    return h;
}

function renderFeaturedDebt(nation) {
    var debtRaw = nation.debt ?? 0;
    var debtDisplay = formatCurrencyShort(scaleRawToDollars(debtRaw));
    // Split "$81.0 Billion" into value + unit
    var parts = debtDisplay.match(/^(\$[\d,.]+)\s*(.*)$/);
    var debtVal = parts ? parts[1] : debtDisplay;
    var debtUnit = parts ? parts[2] : '';

    // Debt is inverted: higher = worse → red
    var hcRaw = getCSSColor('--n-red');
    var borderColor = 'var(--n-red)';
    var dotColor = 'var(--n-red)';
    var tagColor = 'var(--n-red)';
    var tagBorder = 'var(--n-red)';

    // Delta per tick
    var deltaStr = '';
    if (previousTickData && previousTickData.debt != null && debtRaw != null) {
        var debtDelta = Number(debtRaw) - Number(previousTickData.debt);
        var deltaDir = debtDelta >= 0 ? '\u25B2' : '\u25BC';
        // For debt, down is good
        var deltaColor = debtDelta <= 0 ? 'var(--n-green)' : 'var(--n-red)';
        deltaStr = '<span class="featured-card__delta" style="color:' + deltaColor + ';">' + deltaDir + ' ' + Math.abs(debtDelta).toFixed(1) + ' per tick</span>';
    }

    // Sparkline (large chart)
    var sparkData = sparklineHistory['debt'] ? sparklineHistory['debt'].slice() : [];
    if (debtRaw != null) sparkData.push(Number(debtRaw));
    var chartSVG = buildFeaturedSparkSVG(sparkData, hcRaw);

    // Ranking (debt is inverted — lower is better)
    var rank = calculateRanking('debt', debtRaw, true);
    var rankHTML = buildRankingPipsHTML(rank, totalNations || 6);

    // Effects
    var effects = statEffectsByKey['debt'] || [];

    var h = '<div class="featured-card featured-card--compact" style="border-left-color:' + borderColor + ';">';
    // Header
    h += '<div class="featured-card__header">';
    h += '<div class="featured-card__dot" style="background:' + dotColor + ';"></div>';
    h += '<span class="featured-card__title">National Debt</span>';
    h += '</div>';

    // Description
    h += '<div class="featured-card__desc">Government debt obligations</div>';

    // Value row
    h += '<div class="featured-card__value-row">';
    h += '<div><span class="featured-card__big-value" style="color:' + tagColor + ';">' + debtVal + '</span>';
    if (debtUnit) h += '<span class="featured-card__big-unit" style="color:' + tagColor + ';">' + escapeHtml(debtUnit) + '</span>';
    h += '</div>';
    h += rankHTML;
    h += '</div>';

    // Delta
    if (deltaStr) h += deltaStr;

    // Chart (large sparkline)
    h += '<div class="featured-card__chart">' + chartSVG + '</div>';

    // Affected by
    if (effects.length > 0) {
        h += buildFeaturedAbpHTML('debt');
    } else {
        h += '<div class="compact-empty">No active effects</div>';
    }

    h += '</div>';
    return h;
}

// ===== GENERIC FEATURED CARD =====

function renderFeaturedStatCard(stat, nation) {
    var raw = nation[stat.key];
    var numVal = (raw !== null && raw !== undefined) ? Number(raw) : 50;
    if (isNaN(numVal)) numVal = 50;
    var inv = stat.inverted || false;
    var hc = healthColor(numVal, inv);
    var hcRaw = healthColorRaw(numVal, inv);
    var displayVal = getDisplayValue(stat, nation);
    var borderColor = hc;
    var dotColor = hc;

    // Delta per tick
    var deltaStr = '';
    if (previousTickData && previousTickData[stat.key] != null && raw != null) {
        var delta = Number(raw) - Number(previousTickData[stat.key]);
        if (Math.abs(delta) >= 0.01) {
            var deltaDir = delta >= 0 ? '\u25B2' : '\u25BC';
            var deltaGood = inv ? delta <= 0 : delta >= 0;
            var deltaColor = deltaGood ? 'var(--n-green)' : 'var(--n-red)';
            deltaStr = '<span class="featured-card__delta" style="color:' + deltaColor + ';">' + deltaDir + ' ' + Math.abs(delta).toFixed(2) + ' per tick</span>';
        }
    }

    // Sparkline
    var sparkData = sparklineHistory[stat.key] ? sparklineHistory[stat.key].filter(function(v) {
        return typeof v === 'number' && !isNaN(v) && isFinite(v);
    }) : [];
    if (raw != null && !isNaN(numVal) && isFinite(numVal)) sparkData.push(numVal);
    var chartSVG = buildFeaturedSparkSVG(sparkData, hcRaw);

    // Ranking
    var rank = calculateRanking(stat.key, raw, inv);
    var rankHTML = buildRankingPipsHTML(rank, totalNations || 6);

    // Scale tiers (generic 0-100 scale)
    var effective = inv ? 100 - numVal : numVal;
    var scaleItems = [
        { label: 'Critical', range: '0-20', active: effective < 20 },
        { label: 'Low', range: '20-40', active: effective >= 20 && effective < 40 },
        { label: 'Moderate', range: '40-60', active: effective >= 40 && effective < 60 },
        { label: 'Good', range: '60-80', active: effective >= 60 && effective < 80 },
        { label: 'Excellent', range: '80+', active: effective >= 80 }
    ];

    var h = '<div class="featured-card featured-card--generic" style="border-left:3px solid ' + borderColor + ';">';

    // Header
    h += '<div class="featured-card__header">';
    h += '<div class="featured-card__dot" style="background:' + dotColor + ';"></div>';
    h += '<span class="featured-card__title">' + escapeHtml(stat.name) + '</span>';
    if (rankHTML) h += rankHTML;
    h += '</div>';

    // Description
    h += '<div class="featured-card__desc">' + escapeHtml(stat.desc) + '</div>';

    // Value row
    h += '<div class="featured-card__value-row">';
    h += '<div><span class="featured-card__big-value" style="color:' + hc + ';">' + escapeHtml(String(displayVal)) + '</span></div>';
    h += '</div>';

    // Delta
    if (deltaStr) h += deltaStr;

    // Chart
    h += '<div class="featured-card__chart">' + chartSVG + '</div>';

    // Scale
    h += '<div class="featured-card__scale">';
    for (var i = 0; i < scaleItems.length; i++) {
        var si = scaleItems[i];
        h += '<div class="featured-card__scale-item' + (si.active ? ' featured-card__scale-item--active' : '') + '">';
        h += escapeHtml(si.label);
        h += '<span class="featured-card__scale-range">' + escapeHtml(si.range) + '</span>';
        h += '</div>';
    }
    h += '</div>';

    // Affected by
    var effects = statEffectsByKey[stat.key] || [];
    if (effects.length > 0) {
        h += buildFeaturedAbpHTML(stat.key);
    } else {
        h += '<div class="compact-empty">No active effects</div>';
    }

    h += '</div>';
    return h;
}

// Map of stat keys to their custom featured renderers
var FEATURED_RENDERERS = {
    gdp_growth: renderFeaturedGDPGrowth,
    debt: renderFeaturedDebt
};

function renderFeaturedCategory(cat, nation) {
    var hScore = catHealth(cat, nation);
    var hc = healthColor(hScore, false);
    var isOpen = isSectionOpen(cat.id);

    // Count alerts
    var alerts = 0;
    for (var i = 0; i < cat.stats.length; i++) {
        if (cat.stats[i].noHealth) continue;
        if (cat.stats[i].conditional && !cat.stats[i].conditional(nation)) continue;
        var sv = Number(nation[cat.stats[i].key] ?? 50);
        var effective = cat.stats[i].inverted ? 100 - sv : sv;
        if (effective < 15) alerts++;
    }

    var h = '<div class="cat-section">';

    // Header (identical structure to renderCategory)
    h += '<div class="cat-header' + (isOpen ? ' cat-header--open' : '') + '" data-cat="' + cat.id + '">';
    h += '<span class="cat-header__icon">' + cat.icon + '</span>';
    h += '<span class="cat-header__label" style="color:' + hc + ';">' + cat.label + '</span>';
    if (cat.blocs && cat.blocs.length > 0) {
        h += '<div class="cat-header__blocs">';
        for (var bi = 0; bi < cat.blocs.length; bi++) {
            h += '<span class="cat-header__bloc">' + escapeHtml(cat.blocs[bi]) + '</span>';
        }
        h += '</div>';
    }
    if (alerts > 0) {
        h += '<span class="cat-header__alert-badge">\u26A0 ' + alerts + '</span>';
    }
    h += '<div class="cat-header__health-bar"><div class="cat-header__health-fill" style="width:' + Math.min(hScore, 100) + '%;background:' + hc + ';"></div></div>';
    h += '<span class="cat-header__health-score" style="color:' + hc + ';">' + Math.round(hScore) + '</span>';
    h += '<span class="cat-header__chevron">\u25BC</span>';
    h += '</div>';

    // Body with featured grid
    h += '<div class="cat-body' + (isOpen ? ' cat-body--open' : '') + '" id="cat-body-' + cat.id + '">';
    h += '<div class="featured-grid">';
    for (var si = 0; si < cat.stats.length; si++) {
        var stat = cat.stats[si];
        if (stat.conditional && !stat.conditional(nation)) continue;
        if (FEATURED_RENDERERS[stat.key]) {
            h += FEATURED_RENDERERS[stat.key](nation);
        } else {
            h += renderFeaturedStatCard(stat, nation);
        }
    }
    h += '</div>';
    h += '</div>';
    h += '</div>';
    return h;
}

// ===== TAB SWITCHING =====

var _activeNationTab = 'profile';

function switchNationTab(tab) {
    if (tab === _activeNationTab) return;
    _activeNationTab = tab;
    document.querySelectorAll('.nation-tab').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.tab === tab);
    });
    document.querySelectorAll('.nation-tab-content').forEach(function(el) {
        el.style.display = 'none';
    });
    var target = document.getElementById('nation-tab-' + tab);
    if (target) target.style.display = '';
}

// ===== IMMIGRATION TAB =====

function renderImmigrationTab(nation) {
    // Calculate net migration from actual flow data (not fake formula)
    var totalInflow = 0;
    var totalOutflow = 0;
    if (migrationFlowData && migrationFlowData.length > 0) {
        var latestTick = getLatestMigrationTick();
        for (var fi = 0; fi < migrationFlowData.length; fi++) {
            var f = migrationFlowData[fi];
            if (f.tick !== latestTick) continue;
            if (f.dest_nation_id === nation.id) totalInflow += f.flow_count;
            if (f.origin_nation_id === nation.id) totalOutflow += f.flow_count;
        }
    }
    var netMigration = totalInflow - totalOutflow;

    // Capacity: how much room for growth (based on infrastructure, workforce, health)
    // Canonical-stats Phase 4: workforce split → average of the two new tiers.
    var infra = Number(nation.infrastructure ?? 50);
    var workforce = ((Number(nation.unskilled_workers) || 0) + (Number(nation.skilled_workers) || 0)) / 2;
    var health = Number(nation.health ?? 50);
    var capacity = Math.round((infra + workforce + health) / 3);

    var isPositive = netMigration >= 0;
    var migSign = isPositive ? '+' : '\u2212';
    var migColor = isPositive ? 'var(--n-green)' : 'var(--n-red)';
    var migLabel = isPositive ? 'NET POSITIVE' : 'NET NEGATIVE';
    var migLabelBg = isPositive ? 'var(--n-green-dim)' : 'var(--n-red-dim)';
    var capColor = capacity >= 60 ? 'var(--n-green)' : capacity >= 40 ? 'var(--n-yellow)' : 'var(--n-red)';
    var capBg = capacity >= 60 ? 'var(--n-green-dim)' : capacity >= 40 ? 'var(--n-yellow-dim)' : 'var(--n-red-dim)';

    var h = '';

    // ── Net Migration hero ──
    h += '<div class="imm-hero">';
    h += '<div class="imm-hero__top">';
    h += '<div class="imm-hero__left">';
    h += '<div class="imm-hero__label">NET MIGRATION THIS TICK</div>';
    h += '<div class="imm-hero__value" style="color:' + migColor + ';">' + migSign + formatNumber(Math.abs(netMigration)) + ' <span class="imm-hero__unit">people</span></div>';
    h += '</div>';
    h += '<div class="imm-hero__badges">';
    h += '<span class="imm-badge" style="color:' + migColor + ';background:' + migLabelBg + ';border-color:' + migColor + ';">' + migLabel + '</span>';
    h += '<span class="imm-badge" style="color:' + capColor + ';background:' + capBg + ';border-color:' + capColor + ';">CAPACITY: ' + capacity + '%</span>';
    h += '</div>';
    h += '</div>';
    h += '</div>';

    // ── Immigration stat card ──
    var stats = [
        { name: 'Immigration', key: 'immigration', desc: 'People entering legally', inverted: false }
    ];

    h += '<div class="imm-stats-row">';
    for (var i = 0; i < stats.length; i++) {
        var s = stats[i];
        var val = Number(nation[s.key] ?? 50);
        var hc = healthColor(val, s.inverted);

        // Delta
        var deltaHtml = '<span class="imm-stat__delta" style="color:var(--n-secondary);">&mdash; 0</span>';
        if (previousTickData && previousTickData[s.key] != null && nation[s.key] != null) {
            var delta = Number(nation[s.key]) - Number(previousTickData[s.key]);
            if (Math.abs(delta) >= 0.01) {
                var deltaGood = s.inverted ? delta <= 0 : delta >= 0;
                var dColor = deltaGood ? 'var(--n-green)' : 'var(--n-red)';
                var dDir = delta >= 0 ? '\u25B2' : '\u25BC';
                deltaHtml = '<span class="imm-stat__delta" style="color:' + dColor + ';">' + dDir + ' ' + Math.abs(delta).toFixed(1) + '</span>';
            }
        }

        h += '<div class="imm-stat-card" style="border-left:3px solid ' + hc + ';">';
        h += '<div class="imm-stat__label">' + escapeHtml(s.name.toUpperCase()) + '</div>';
        h += '<div class="imm-stat__value" style="color:' + hc + ';">' + val.toFixed(1) + '</div>';
        h += deltaHtml;
        h += '</div>';
    }
    h += '</div>';

    return h;
}

// ===== MIGRATION FLOW DATA =====

var migrationFlowData = null;

function getLatestMigrationTick() {
    if (!migrationFlowData || migrationFlowData.length === 0) return 0;
    var t = 0;
    for (var i = 0; i < migrationFlowData.length; i++) {
        if (migrationFlowData[i].tick > t) t = migrationFlowData[i].tick;
    }
    return t;
}

async function loadMigrationFlows(nationId) {
    // Get the latest tick that has migration data
    var { data: tickRow } = await _supabase
        .from('migration_flows')
        .select('tick')
        .order('tick', { ascending: false })
        .limit(1);
    var latestFlowTick = tickRow?.[0]?.tick;

    if (latestFlowTick != null) {
        // Fetch all flows for the latest tick only (all nations)
        var { data } = await _supabase
            .from('migration_flows')
            .select('*, origin:origin_nation_id(id, name), dest:dest_nation_id(id, name)')
            .eq('tick', latestFlowTick);
        migrationFlowData = data || [];
    } else {
        migrationFlowData = [];
    }
}

function renderMigrationSourcesPanel(nation) {
    if (!migrationFlowData || migrationFlowData.length === 0) {
        return '<div class="imm-section"><div class="imm-section-title">Immigration Sources</div><div class="imm-empty">No migration data yet. Data will appear after the next tick.</div></div>';
    }

    var latestTick = getLatestMigrationTick();

    var sources = {};
    var totalInflow = 0;
    for (var i = 0; i < migrationFlowData.length; i++) {
        var f = migrationFlowData[i];
        if (f.tick !== latestTick || f.dest_nation_id !== nation.id) continue;
        var originName = f.origin?.name || 'Unknown';
        if (!sources[originName]) sources[originName] = { legal: 0, illegal: 0, academic: 0, total: 0, reasons: [] };
        sources[originName][f.category] += f.flow_count;
        sources[originName].total += f.flow_count;
        totalInflow += f.flow_count;
        if (f.reasons && f.reasons.length > 0 && sources[originName].reasons.length === 0) {
            sources[originName].reasons = f.reasons;
        }
    }

    if (totalInflow === 0) {
        return '<div class="imm-section"><div class="imm-section-title">Immigration Sources</div><div class="imm-empty">No significant immigration this tick.</div></div>';
    }

    var sorted = Object.entries(sources).sort(function(a, b) { return b[1].total - a[1].total; });

    var h = '<div class="imm-section">';
    h += '<div class="imm-section-title">Immigration Sources</div>';

    for (var i = 0; i < sorted.length; i++) {
        var name = sorted[i][0];
        var s = sorted[i][1];

        h += '<div class="imm-flow-row">';
        h += '<div class="imm-flow-header">';
        h += '<span class="imm-flow-name">' + escapeHtml(name) + '</span>';
        h += '<span class="imm-flow-pct">' + pct + '%</span>';
        h += '<span class="imm-flow-count">' + formatNumber(s.total) + '</span>';
        h += '</div>';

        h += '<div class="imm-flow-bar">';
        var legalPct = s.total > 0 ? (s.legal / s.total * 100) : 0;
        var illegalPct = s.total > 0 ? (s.illegal / s.total * 100) : 0;
        var academicPct = s.total > 0 ? (s.academic / s.total * 100) : 0;
        h += '<div class="imm-flow-seg imm-flow-seg--legal" style="width:' + legalPct + '%" title="Legal: ' + formatNumber(s.legal) + '"></div>';
        h += '<div class="imm-flow-seg imm-flow-seg--academic" style="width:' + academicPct + '%" title="Academic: ' + formatNumber(s.academic) + '"></div>';
        h += '<div class="imm-flow-seg imm-flow-seg--illegal" style="width:' + illegalPct + '%" title="Illegal: ' + formatNumber(s.illegal) + '"></div>';
        h += '</div>';

        h += '<div class="imm-flow-cats">';
        if (s.legal > 0) h += '<span class="imm-cat-badge imm-cat--legal">Legal ' + formatNumber(s.legal) + '</span>';
        if (s.academic > 0) h += '<span class="imm-cat-badge imm-cat--academic">Academic ' + formatNumber(s.academic) + '</span>';
        if (s.illegal > 0) h += '<span class="imm-cat-badge imm-cat--illegal">Illegal ' + formatNumber(s.illegal) + '</span>';
        h += '</div>';

        if (s.reasons && s.reasons.length > 0) {
            h += '<div class="imm-flow-reasons">';
            for (var ri = 0; ri < s.reasons.length; ri++) {

            }

        }

        h += '</div>';
    }

    h += '<div class="imm-flow-total">Total: ' + formatNumber(totalInflow) + ' immigrants this tick</div>';
    h += '</div>';
    return h;
}

// ===== MIGRATION MATRIX =====

var NATION_MATRIX_COLORS = ['#22d3ee','#f472b6','#a78bfa','#4ade80','#facc15','#f97316','#60a5fa','#c084fc'];

function renderMigrationMatrix(nation) {
    if (!migrationFlowData || migrationFlowData.length === 0) return '';

    // Find latest tick in ALL data
    var latestTick = getLatestMigrationTick();

    // Collect unique nations from flows
    var nationMap = {};
    for (var i = 0; i < migrationFlowData.length; i++) {
        var f = migrationFlowData[i];
        if (f.tick !== latestTick) continue;
        if (f.origin && !nationMap[f.origin.id]) nationMap[f.origin.id] = f.origin.name;
        if (f.dest && !nationMap[f.dest.id]) nationMap[f.dest.id] = f.dest.name;
    }

    var nationIds = Object.keys(nationMap).sort(function(a, b) {
        // Current nation first, then alphabetical
        if (a === nation.id) return -1;
        if (b === nation.id) return 1;
        return nationMap[a].localeCompare(nationMap[b]);
    });
    if (nationIds.length < 2) return '';

    // Build flow lookup: matrix[originId][destId] = total flow
    var matrix = {};
    for (var i = 0; i < nationIds.length; i++) {
        matrix[nationIds[i]] = {};
        for (var j = 0; j < nationIds.length; j++) {
            matrix[nationIds[i]][nationIds[j]] = 0;
        }
    }
    for (var i = 0; i < migrationFlowData.length; i++) {
        var f = migrationFlowData[i];
        if (f.tick !== latestTick) continue;
        if (matrix[f.origin_nation_id] && matrix[f.origin_nation_id][f.dest_nation_id] !== undefined) {
            matrix[f.origin_nation_id][f.dest_nation_id] += f.flow_count;
        }
    }

    // Assign colors
    var colorMap = {};
    for (var i = 0; i < nationIds.length; i++) {
        colorMap[nationIds[i]] = NATION_MATRIX_COLORS[i % NATION_MATRIX_COLORS.length];
    }

    // Build table
    var h = '<div class="imm-matrix">';
    h += '<div class="imm-section-title">Migration Matrix — People Per Tick</div>';
    h += '<div class="imm-matrix-scroll"><table class="imm-matrix-table">';

    // Header row
    h += '<thead><tr><th class="imm-matrix-corner">FROM \\ TO</th>';
    for (var j = 0; j < nationIds.length; j++) {
        var shortName = nationMap[nationIds[j]].length > 10 ? nationMap[nationIds[j]].substring(0, 10) : nationMap[nationIds[j]];
        h += '<th class="imm-matrix-col-head" style="color:' + colorMap[nationIds[j]] + '">' + escapeHtml(shortName) + '</th>';
    }
    h += '<th class="imm-matrix-col-head imm-matrix-total-head">TOTAL OUT</th></tr></thead>';

    // Data rows
    h += '<tbody>';
    var colTotals = {};
    for (var j = 0; j < nationIds.length; j++) colTotals[nationIds[j]] = 0;

    for (var i = 0; i < nationIds.length; i++) {
        var originId = nationIds[i];
        var rowTotal = 0;
        h += '<tr>';
        h += '<td class="imm-matrix-row-head" style="color:' + colorMap[originId] + '">' + escapeHtml(nationMap[originId]) + '</td>';
        for (var j = 0; j < nationIds.length; j++) {
            var destId = nationIds[j];
            if (originId === destId) {
                h += '<td class="imm-matrix-cell imm-matrix-self">—</td>';
            } else {
                var val = matrix[originId][destId];
                rowTotal += val;
                colTotals[destId] += val;
                // Highlight cells where current nation is origin or dest
                var cellCls = 'imm-matrix-cell';
                if (originId === nation.id || destId === nation.id) cellCls += ' imm-matrix-highlight';
                h += '<td class="' + cellCls + '">' + formatNumber(val) + '</td>';
            }
        }
        h += '<td class="imm-matrix-cell imm-matrix-row-total">' + formatNumber(rowTotal) + '</td>';
        h += '</tr>';
    }

    // Total IN row
    h += '<tr class="imm-matrix-total-row"><td class="imm-matrix-row-head imm-matrix-total-head">TOTAL IN</td>';
    for (var j = 0; j < nationIds.length; j++) {
        h += '<td class="imm-matrix-cell imm-matrix-col-total">' + formatNumber(colTotals[nationIds[j]]) + '</td>';
    }
    h += '<td class="imm-matrix-cell"></td></tr>';

    h += '</tbody></table></div></div>';
    return h;
}

// ===== PULL FACTOR SCORE =====

var PULL_FACTORS = [
    { label: 'Standard of Living', key: 'standard_of_living', weight: 0.30 },
    { label: 'GDP Growth', key: 'gdp_growth', weight: 0.20 },
    { label: 'Health', key: 'health', weight: 0.15 },
    { label: 'Education', key: 'education', weight: 0.10 },
    { label: 'Unskilled Workers', key: 'unskilled_workers', weight: 0.05 },
    { label: 'Skilled Workers', key: 'skilled_workers', weight: 0.05 },
    { label: 'Infrastructure', key: 'infrastructure', weight: 0.15 }
];

function renderPullFactorScore(nation) {
    if (!allNations || allNations.length === 0) return '';
    var h = '<div class="imm-pull">';
    h += '<div class="imm-section-title">' + escapeHtml(nation.name) + ' Pull Factor Score</div>';

    h += '<div class="imm-pull-grid">';
    var compositeScore = 0;
    for (var i = 0; i < PULL_FACTORS.length; i++) {
        var pf = PULL_FACTORS[i];
        var rawVal = Math.round(Number(nation[pf.key] ?? 50));
        var weighted = Math.round(rawVal * pf.weight * 10) / 10;
        compositeScore += weighted;

        h += '<div class="imm-pull-row">';
        h += '<span class="imm-pull-label">' + escapeHtml(pf.label) + '</span>';
        h += '<span class="imm-pull-raw">' + rawVal + '</span>';
        h += '<span class="imm-pull-weight">x' + pf.weight + '</span>';
        h += '<span class="imm-pull-weighted">' + weighted.toFixed(1) + '</span>';
        h += '</div>';
    }
    h += '</div>';

    compositeScore = Math.round(compositeScore * 10) / 10;

    // Rank among all nations
    var rank = 1;
    var nCount = allNations.length;
    for (var n = 0; n < allNations.length; n++) {
        var other = allNations[n];
        if (other.id === nation.id) continue;
        var otherScore = 0;
        for (var i = 0; i < PULL_FACTORS.length; i++) {
            otherScore += Math.round(Number(other[PULL_FACTORS[i].key] ?? 50) * PULL_FACTORS[i].weight * 10) / 10;
        }
        if (Math.round(otherScore * 10) / 10 > compositeScore) rank++;
    }

    var scoreColor = compositeScore >= 60 ? 'var(--n-green)' : compositeScore >= 40 ? 'var(--n-yellow)' : 'var(--n-red)';

    h += '<div class="imm-pull-footer">';
    h += '<div class="imm-pull-composite"><span class="imm-pull-composite-label">COMPOSITE SCORE</span><span class="imm-pull-composite-val" style="color:' + scoreColor + '">' + compositeScore.toFixed(1) + '</span></div>';
    h += '<div class="imm-pull-rank">RANK: #' + rank + ' OF ' + nCount + ' NATIONS</div>';
    h += '</div>';

    h += '</div>';
    return h;
}

// ===== MAIN RENDER =====

async function renderNationPage(nation) {
    var h = '';

    // ---- Tab bar ----
    h += '<div class="nation-tab-bar">';
    h += '<button class="nation-tab' + (_activeNationTab === 'profile' ? ' active' : '') + '" data-tab="profile" onclick="switchNationTab(\'profile\')">Nation</button>';
    h += '<button class="nation-tab' + (_activeNationTab === 'statistics' ? ' active' : '') + '" data-tab="statistics" onclick="switchNationTab(\'statistics\')">Statistics</button>';
    h += '<button class="nation-tab' + (_activeNationTab === 'immigration' ? ' active' : '') + '" data-tab="immigration" onclick="switchNationTab(\'immigration\')">Immigration</button>';
    h += '</div>';

    // ---- Statistics tab ----
    h += '<div class="nation-body nation-tab-content" id="nation-tab-statistics"' + (_activeNationTab === 'statistics' ? '' : ' style="display:none;"') + '>';

    // Revolution banner
    h += await renderRevolutionBanner(nation);

    // Category sections
    for (var ci = 0; ci < STAT_CATEGORIES.length; ci++) {
        h += renderFeaturedCategory(STAT_CATEGORIES[ci], nation);
    }

    h += '</div>'; // end statistics tab

    // ---- Nation Profile tab (embedded nation-info.html) ----
    // Note: on tick-advanced this subtree is rebuilt along with every other
    // tab (see listener above), so the iframe reloads. Consistent with how
    // Immigration refreshes. Users on the profile tab
    // during a tick boundary will see it reload.
    h += '<div class="nation-body nation-tab-content" id="nation-tab-profile"' + (_activeNationTab === 'profile' ? '' : ' style="display:none;"') + '>';
    var _profileSlug = String(nation.name || '').toLowerCase().replace(/\s+/g, '');
    if (_profileSlug) {
        h += '<iframe id="nation-profile-frame" src="nation-info.html?name=' + encodeURIComponent(_profileSlug) + '&embedded=1" style="width:100%;min-height:85vh;border:0;background:var(--n-bg);display:block;"></iframe>';
    } else {
        h += '<div style="padding:40px;text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--text-dim);">Nation name unavailable — profile cannot be loaded.</div>';
    }
    h += '</div>'; // end profile tab

    // ---- Immigration tab ----
    h += '<div class="nation-body nation-tab-content" id="nation-tab-immigration"' + (_activeNationTab === 'immigration' ? '' : ' style="display:none;"') + '>';
    h += renderImmigrationTab(nation);
    h += '<div id="migration-flow-panels"><div class="imm-loading">Loading migration data...</div></div>';
    h += '</div>'; // end immigration tab

    document.getElementById('content-area').innerHTML = h;
    attachHandlers();

    // Load migration flows AFTER DOM is set so .then() can find the tab elements
    try {
        loadMigrationFlows(nation.id).then(function() {
            try {
                var immPanel = document.getElementById('nation-tab-immigration');
                if (immPanel) {
                    immPanel.innerHTML = renderImmigrationTab(nation)
                        + '<div id="migration-flow-panels">'
                        + '<div class="imm-panels-grid">'
                        + renderMigrationSourcesPanel(nation)
                        + renderMigrationDestsPanel(nation)
                        + '</div>'
                        + renderMigrationMatrix(nation)
                        + renderPullFactorScore(nation)
                        + '</div>';
                }
            } catch (renderErr) {
                console.error('[nation] Immigration tab render failed:', renderErr);
                var immPanel = document.getElementById('nation-tab-immigration');
                if (immPanel) immPanel.innerHTML = renderImmigrationTab(nation);
            }
        }).catch(function(err) { console.warn('[nation] Migration flow load failed:', err); });
    } catch (e) { console.warn('[nation] Migration flows not available:', e); }
}

// ===== CLICK HANDLERS =====

function attachHandlers() {
    // Section toggles
    var headers = document.querySelectorAll('.cat-header[data-cat]');
    for (var i = 0; i < headers.length; i++) {
        headers[i].addEventListener('click', function() {
            toggleSection(this.getAttribute('data-cat'));
        });
    }
}


</script>
