// Run in browser console: debugSparklines()
// Uses _nationId stashed during page init to avoid auth re-query
var _nationId = null;
window.debugSparklines = async function() {
    if (!_nationId) { console.error('Nation ID not set — page may not have loaded yet'); return; }
    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const tick = shard?.current_tick || 0;
    console.log('%c=== SPARKLINE HISTORY AUDIT ===', 'font-weight:bold;font-size:14px;color:#0af');
    console.log('Nation ID:', _nationId, '| Current tick:', tick);
    const { data: rows, error } = await _supabase.from('nations_history')
        .select('tick').eq('nation_id', _nationId).order('tick', { ascending: false }).limit(10);
    if (error) { console.error('Query error:', error.message); return; }
    if (!rows || rows.length === 0) {
        console.error('%cNO history rows found for this nation! Snapshots are not being written.', 'color:#f44;font-weight:bold');
    } else {
        console.log('Latest history ticks:', rows.map(r => r.tick));
        console.log('History rows found:', rows.length, '| Most recent tick:', rows[0].tick, '| Gap from current:', tick - rows[0].tick);
    }
};

// ===== STAT DELTA DIAGNOSTIC =====
// Run in browser console: debugStatDelta('education_accessibility')
window.debugStatDelta = async function(statKey) {
    const sk = statKey || 'education_accessibility';
    console.log(`%c=== STAT DELTA AUDIT: ${sk} ===`, 'font-weight:bold;font-size:14px;color:#0af');

    // 1. Get nation + shard
    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const tick = shard?.current_tick || 0;
    const { data: { user } } = await _supabase.auth.getUser();
    const { data: faction } = await _supabase.from('factions').select('nation_id').eq('user_id', user.id).single();
    const nationId = faction?.nation_id;
    if (!nationId) { console.error('No nation found'); return; }

    const { data: nation } = await _supabase.from('nations').select('*').eq('id', nationId).single();
    console.log(`Nation: ${nation.name} | Tick: ${tick} | Current ${sk}: ${nation[sk]}`);

    // 2. Previous tick value from history
    const { data: hist } = await _supabase.from('nations_history')
        .select(sk + ', tick').eq('nation_id', nationId)
        .lte('tick', tick).order('tick', { ascending: false }).limit(3);
    if (hist?.length) {
        console.log('%cHistory:', 'font-weight:bold');
        hist.forEach(h => console.log(`  tick ${h.tick}: ${h[sk]}`));
        const prev = hist.find(h => h.tick < tick);
        if (prev) console.log(`  Delta (tick ${prev.tick} → now): ${(Number(nation[sk]) - Number(prev[sk])).toFixed(1)}`);
    }

    // 3. Active laws affecting this stat
    const { data: laws } = await _supabase.from('active_laws')
        .select('id, bill_id, is_reversal, passed_tick, effects_applied_through_tick, reversal_effects, policies(policy_name, stat_effects, target_stat, stat_direction, stat_change_per_tick, duration_months)')
        .eq('nation_id', nationId);
    const hitLaws = (laws || []).filter(l => {
        const p = l.policies;
        if (!p) return false;
        if (p.target_stat === sk) return true;
        if (p.stat_effects?.some(e => normalizeNationStatKey(e.stat_key) === sk)) return true;
        if (l.is_reversal && l.reversal_effects?.some(e => normalizeNationStatKey(e.stat_key) === sk)) return true;
        return false;
    });
    console.log(`%cActive laws affecting ${sk}: ${hitLaws.length}`, 'font-weight:bold');
    hitLaws.forEach(l => {
        const p = l.policies;
        const effs = l.is_reversal ? l.reversal_effects : p.stat_effects;
        const relevant = (effs || []).filter(e => normalizeNationStatKey(e.stat_key) === sk);
        relevant.forEach(e => {
            const ticksSince = tick - (l.passed_tick || 0);
            const delay = Number(e.delay_ticks) || 0;
            const dur = Number(e.duration_ticks) || 12;
            const active = ticksSince > delay && ticksSince <= delay + dur;
            console.log(`  [${active ? 'ACTIVE' : 'dormant'}] "${p.policy_name}" | dir=${e.direction} rate=${e.rate}/tick | delay=${delay} dur=${dur} | ticksSince=${ticksSince} | passedTick=${l.passed_tick} lastApplied=${l.effects_applied_through_tick}`);
        });
        if (relevant.length === 0 && p.target_stat === sk) {
            console.log(`  [legacy] "${p.policy_name}" | dir=${p.stat_direction} rate=${p.stat_change_per_tick}/tick dur=${p.duration_months}`);
        }
    });

    // 4. Stat connections
    const { data: conns } = await _supabase.from('stat_connections')
        .select('*').eq('enabled', true).eq('target_stat', sk);
    console.log(`%cStat connections targeting ${sk}: ${(conns||[]).length}`, 'font-weight:bold');
    (conns || []).forEach(c => {
        const sourceVal = Number(nation[c.source_stat] ?? 50);
        const triggered = c.source_dir === 'above' ? sourceVal > c.threshold : sourceVal < c.threshold;
        console.log(`  [${triggered ? 'TRIGGERED' : 'inactive'}] ${c.source_stat} ${c.source_dir} ${c.threshold} (current: ${sourceVal}) → ${c.target_dir} ${c.magnitude} | dampening=${c.dampening}`);
        if (triggered && c.dampening) {
            const targetVal = Number(nation[sk] ?? 50);
            const eff = c.target_dir === 'up' ? c.magnitude * (1 - targetVal/100) : c.magnitude * (targetVal/100);
            console.log(`    effective magnitude after dampening: ${eff.toFixed(3)}`);
        }
    });

    // 5. Active crises
    const { data: crises } = await _supabase.from('active_crises')
        .select('crisis_id, started_tick, crisis_templates(name, crisis_effects(stat_key, change_per_tick, target))')
        .eq('nation_id', nationId);
    const hitCrises = (crises || []).filter(c =>
        c.crisis_templates?.crisis_effects?.some(e => e.target === 'nation' && normalizeNationStatKey(e.stat_key) === sk)
    );
    console.log(`%cActive crises affecting ${sk}: ${hitCrises.length}`, 'font-weight:bold');
    hitCrises.forEach(c => {
        const effs = c.crisis_templates.crisis_effects.filter(e => e.target === 'nation' && normalizeNationStatKey(e.stat_key) === sk);
        effs.forEach(e => console.log(`  "${c.crisis_templates.name}" | change_per_tick=${e.change_per_tick} | started tick ${c.started_tick}`));
    });

    // 6. Unprocessed ministry actions
    const { data: mActions } = await _supabase.from('ministry_action_log')
        .select('action_key, stat_effects, effects_applied_through_tick, applied_at_tick')
        .eq('nation_id', nationId).eq('processed', false);
    const hitMA = (mActions || []).filter(a =>
        a.stat_effects?.some(e => normalizeNationStatKey(e.stat_key) === sk)
    );
    console.log(`%cMinistry actions affecting ${sk}: ${hitMA.length}`, 'font-weight:bold');
    hitMA.forEach(a => {
        const effs = a.stat_effects.filter(e => normalizeNationStatKey(e.stat_key) === sk);
        effs.forEach(e => console.log(`  "${a.action_key}" | dir=${e.direction} rate=${e.rate} | applied tick ${a.applied_at_tick} lastApplied=${a.effects_applied_through_tick}`));
    });

    // 7. Decay config
    const dc = STAT_DECAY_CONFIG[sk];
    if (dc) {
        console.log(`%cDecay config: type=${dc.type} target=${dc.target} speed=${dc.speed}/tick`, 'font-weight:bold');
        const delta = Number(nation[sk]) > dc.target ? -dc.speed : dc.speed;
        console.log(`  Natural decay this tick: ${delta > 0 ? '+' : ''}${delta}`);
    } else {
        console.log(`%cNo decay config for ${sk}`, 'font-weight:bold');
    }

    console.log(`%c=== END AUDIT ===`, 'font-weight:bold;font-size:14px;color:#0af');
};

// ===== HELPER FUNCTIONS =====

function healthColor(val, inverted) {
    var v = inverted ? 100 - val : val;
    if (v >= 65) return 'var(--n-green)';
    if (v >= 45) return 'var(--n-yellow)';
    if (v >= 25) return 'var(--n-orange)';
    return 'var(--n-red)';
}

function healthColorRaw(val, inverted) {
    var v = inverted ? 100 - val : val;
    if (v >= 65) return '#4ade80';
    if (v >= 45) return '#facc15';
    if (v >= 25) return '#f97316';
    return '#ef4444';
}

function catHealth(cat, nation) {
    var scored = cat.stats.filter(function(s) {
        if (s.noHealth) return false;
        var v = nation[s.key];
        return v !== null && v !== undefined;
    });
    if (!scored.length) return 50;
    var sum = 0;
    for (var i = 0; i < scored.length; i++) {
        var v = Number(nation[scored[i].key]);
        if (isNaN(v)) v = 50;
        v = Math.max(0, Math.min(v, 100));
        if (scored[i].inverted) v = 100 - v;
        sum += v;
    }
    return sum / scored.length;
}

function buildSparklineSVG(data, color, w, h) {
    w = w || 48; h = h || 14;
    if (!data || data.length < 2) return '<span style="font-family:var(--n-font-mono);font-size:9px;color:var(--n-tertiary);">\u2014</span>';
    var mn = Math.min.apply(null, data), mx = Math.max.apply(null, data), r = mx - mn || 1;
    var pts = data.map(function(v, i) {
        return ((i / (data.length - 1)) * w).toFixed(1) + ',' + (h - ((v - mn) / r) * h).toFixed(1);
    }).join(' ');
    var lastY = (h - ((data[data.length - 1] - mn) / r) * h).toFixed(1);
    return '<svg width="' + w + '" height="' + h + '" style="display:block;flex-shrink:0;">' +
        '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="1.5" stroke-linejoin="round"/>' +
        '<circle cx="' + w + '" cy="' + lastY + '" r="1.5" fill="' + color + '"/></svg>';
}

function buildRankBar(rank, total) {
    total = total || totalNations || 6;
    if (!rank) return '';
    var pipColor = rank <= 2 ? '#4ade80' : rank <= 4 ? '#facc15' : '#ef4444';
    var h = '<div class="stat-card__rank">';
    for (var i = 0; i < total; i++) {
        if (i < rank) {
            h += '<div class="stat-card__rank-pip" style="background:' + pipColor + ';"></div>';
        } else {
            h += '<div class="stat-card__rank-pip stat-card__rank-pip--empty"></div>';
        }
    }
    h += '<span class="stat-card__rank-label">#' + rank + '</span></div>';
    return h;
}

function isSectionOpen(catId) {
    if (sectionState[catId] !== undefined) return sectionState[catId];
    return !!defaultOpen[catId];
}

function toggleSection(catId) {
    var isOpen = isSectionOpen(catId);
    sectionState[catId] = !isOpen;
    sessionStorage.setItem('nationSectionState', JSON.stringify(sectionState));
    var header = document.querySelector('.cat-header[data-cat="' + catId + '"]');
    var body = document.getElementById('cat-body-' + catId);
    if (!header || !body) return;
    if (sectionState[catId]) {
        header.classList.add('cat-header--open');
        body.classList.add('cat-body--open');
    } else {
        header.classList.remove('cat-header--open');
        body.classList.remove('cat-body--open');
    }
}

// Initialize page
initPage('nation', async (state) => {
    const { nation, faction } = state;
    _nationId = nation?.id || null;

    if (!nation) {
        document.getElementById('content-area').innerHTML = '<div class="loading-container"><div style="font-size:24px">No Nation</div><div>Your party is not assigned to a nation yet.</div></div>';
        return;
    }

    // Fix placeholder government_type values from DB
    if (!nation.government_type || nation.government_type.toLowerCase().includes('your_gov_here')) {
        if (nation.name === 'San Estrella') nation.government_type = CANONICAL_GOVERNMENT_TYPES.PRESIDENTIAL_REPUBLIC;
    }

    await Promise.all([
        loadAllNations(),
        loadPreviousTickData(nation.id),
        loadStatEffectSources(nation.id, nation),
        loadSparklineHistory(nation.id),
        loadActiveCrises(nation.id)
    ]);
    await renderNationPage(nation);
});

async function loadAllNations() {
    const cached = qCache('all_nations');
    if (cached) { allNations = cached; totalNations = cached.length; return; }
    const { data: nations, error } = await _supabase.from('nations').select('*');
    if (!error && nations) { allNations = nations; totalNations = nations.length; qCacheSet('all_nations', nations, 2 * 60 * 1000); }
}

async function loadPreviousTickData(nationId) {
    const cacheKey = 'prev_tick_' + nationId;
    const cached = qCache(cacheKey);
    if (cached) { previousTickData = cached; return; }
    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    if (!shard) { console.warn('[loadPreviousTickData] Shard not found — stat deltas unavailable'); return; }
    const previousTick = shard.current_tick - 1;
    if (previousTick < 0) { console.warn('[loadPreviousTickData] current_tick is', shard.current_tick, '— no previous tick yet'); return; }

    // Use .limit(1) instead of .maybeSingle() — maybeSingle sends an Accept header
    // that causes PostgREST to return HTTP 406 when 0 rows match, which logs a
    // console error even though supabase-js handles it gracefully.
    const { data: historyRows, error } = await _supabase.from('nations_history')
        .select('*').eq('nation_id', nationId).eq('tick', previousTick).limit(1);
    if (error) {
        console.warn('[loadPreviousTickData] Query error for tick ' + previousTick + ':', error.message);
    }
    const history = (historyRows && historyRows.length > 0) ? historyRows[0] : null;
    if (history) {
        previousTickData = history;
        qCacheSet(cacheKey, history, 5 * 60 * 1000);
        return;
    }

    // No history row for the exact previous tick — fall back to the most recent
    // available snapshot, but only if it's within 2 ticks. Beyond that the delta
    // spans too many ticks and becomes misleading (shows stale cumulative change).
    const MAX_FALLBACK_AGE = 2;
    console.warn('[loadPreviousTickData] No history row for tick', previousTick,
        '— falling back to most recent snapshot (max age:', MAX_FALLBACK_AGE, 'ticks).');
    const { data: fallbackRows } = await _supabase.from('nations_history')
        .select('*').eq('nation_id', nationId)
        .gte('tick', shard.current_tick - MAX_FALLBACK_AGE - 1)
        .lt('tick', shard.current_tick)
        .order('tick', { ascending: false }).limit(1);
    if (fallbackRows && fallbackRows.length > 0) {
        previousTickData = fallbackRows[0];
        qCacheSet(cacheKey, fallbackRows[0], 2 * 60 * 1000); // shorter TTL for fallback
        console.warn('[loadPreviousTickData] Using fallback snapshot from tick', fallbackRows[0].tick);
    } else {
        console.warn('[loadPreviousTickData] No recent snapshot within', MAX_FALLBACK_AGE, 'ticks — trend arrows will show neutral.');
    }
}

async function loadSparklineHistory(nationId) {
    var cacheKey = 'sparkline_' + nationId;
    var cached = qCache(cacheKey);
    if (cached) { sparklineHistory = cached; return; }
    var { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    if (!shard) return;
    var fromTick = Math.max(0, shard.current_tick - 10);
    var { data: rows } = await _supabase.from('nations_history')
        .select('*').eq('nation_id', nationId)
        .gte('tick', fromTick).order('tick', { ascending: true });
    if (!rows || rows.length === 0) return;
    // Build per-stat arrays
    var allKeys = [];
    for (var ci = 0; ci < STAT_CATEGORIES.length; ci++) {
        for (var si = 0; si < STAT_CATEGORIES[ci].stats.length; si++) {
            allKeys.push(STAT_CATEGORIES[ci].stats[si].key);
        }
    }
    var map = {};
    for (var ki = 0; ki < allKeys.length; ki++) {
        var k = allKeys[ki];
        var vals = [];
        for (var ri = 0; ri < rows.length; ri++) {
            var v = rows[ri][k];
            if (v !== null && v !== undefined) vals.push(Number(v));
        }
        if (vals.length > 0) map[k] = vals;
    }
    sparklineHistory = map;
    qCacheSet(cacheKey, map, 2 * 60 * 1000);
}

async function loadActiveCrises(nationId) {
    var cacheKey = 'crises_' + nationId;
    var cached = qCache(cacheKey);
    if (cached) { activeCrises = cached; return; }
    var res = await _supabase
        .from('active_crises')
        .select('crisis_id, crisis_templates(name, description, crisis_end_triggers(stat_key), crisis_effects(stat_key, change_per_tick, target))')
        .eq('nation_id', nationId);
    if (!res.error && res.data) {
        activeCrises = res.data;
        qCacheSet(cacheKey, res.data, 2 * 60 * 1000);
    }
}

// ===== Affected-By: Data Fetching =====

async function loadStatEffectSources(nationId, nation) {
    var cacheKey = 'stat_effects_' + nationId;
    var cached = qCache(cacheKey);
    if (cached) { statEffectsByKey = cached; return; }

    var results = await Promise.all([
        _supabase.from('active_laws')
            .select('is_reversal, passed_tick, policies(policy_name, stat_effects)')
            .eq('nation_id', nationId),
        _supabase.from('active_crises')
            .select('crisis_id, crisis_templates(name, crisis_effects(stat_key, change_per_tick, target))')
            .eq('nation_id', nationId),
        _supabase.from('ministry_action_log')
            .select('action_key, stat_effects')
            .eq('nation_id', nationId)
            .eq('processed', false),
        _supabase.from('diplomatic_action_log')
            .select('action_type, stat_effects')
            .eq('nation_id', nationId)
            .eq('processed', false),
        loadLeaderTraitEffects(nationId, nation)
    ]);

    var currentTick = await getShardTick();
    var map = {};
    parsePolicyEffects(results[0].data || [], map, currentTick);
    parseCrisisEffects(results[1].data || [], map);
    parseMinistryEffects(results[2].data || [], map);
    parseDiplomaticEffects(results[3].data || [], map);
    parseLeaderTraitEffects(results[4], map);
    parseDecayEffects(nation, map);

    statEffectsByKey = map;
    qCacheSet(cacheKey, map, 2 * 60 * 1000);
}

async function loadLeaderTraitEffects(nationId, nation) {
    try {
        if (isPresidentialRepublic(nation)) {
            var res = await _supabase.from('presidents')
                .select('trait, first_name, last_name')
                .eq('nation_id', nationId)
                .eq('is_active', true)
                .limit(1);
            if (!res.data || res.data.length === 0 || !res.data[0].trait) return null;
            var president = res.data[0];
            var traitRes = await _supabase.from('leader_traits')
                .select('trait_key, effects')
                .eq('trait_key', president.trait)
                .limit(1);
            if (!traitRes.data || traitRes.data.length === 0) return null;
            return { name: president.first_name + ' ' + president.last_name, traitKey: traitRes.data[0].trait_key, effects: traitRes.data[0].effects };
        } else {
            var res = await _supabase.from('head_of_government')
                .select('first_name, last_name, trait_key, leader_traits(trait_key, effects)')
                .eq('nation_id', nationId)
                .eq('active', true)
                .limit(1);
            if (!res.data || res.data.length === 0) return null;
            var hog = res.data[0];
            if (!hog.leader_traits || !hog.leader_traits.effects) return null;
            return { name: hog.first_name + ' ' + hog.last_name, traitKey: hog.leader_traits.trait_key, effects: hog.leader_traits.effects };
        }
    } catch (e) {
        console.warn('[loadLeaderTraitEffects] Error:', e);
        return null;
    }
}

function addEffectToMap(map, statKey, name, direction, type, rate) {
    var key = normalizeNationStatKey(statKey);
    if (!key) return;
    if (!map[key]) map[key] = [];
    // Deduplicate
    for (var i = 0; i < map[key].length; i++) {
        if (map[key][i].name === name && map[key][i].direction === direction && map[key][i].type === type) return;
    }
    map[key].push({ name: name, direction: direction, type: type, rate: rate || null });
}

function parsePolicyEffects(laws, map, currentTick) {
    for (var i = 0; i < laws.length; i++) {
        var law = laws[i];
        var policy = law.policies;
        if (!policy) continue;
        var effects = policy.stat_effects;
        if (!effects || !Array.isArray(effects)) continue;
        var ticksSince = currentTick - (law.passed_tick || 0);
        for (var j = 0; j < effects.length; j++) {
            var eff = effects[j];
            if (!eff.stat_key) continue;
            var delay = Number(eff.delay_ticks) || 0;
            var dur = Number(eff.duration_ticks) || 12;
            // Skip effects that haven't started yet or have expired
            if (ticksSince <= delay || ticksSince > delay + dur) continue;
            var dir = (eff.direction || 'up').toLowerCase() === 'up' ? 'up' : 'down';
            // Reversal laws flip the effect direction
            if (law.is_reversal) dir = (dir === 'up') ? 'down' : 'up';
            var label = law.is_reversal ? policy.policy_name + ' (Repeal)' : policy.policy_name;
            var rate = Number(eff.rate) || 1;
            addEffectToMap(map, eff.stat_key, label, dir, 'Policy', rate);
        }
    }
}

function parseCrisisEffects(crises, map) {
    for (var i = 0; i < crises.length; i++) {
        var c = crises[i];
        var t = c.crisis_templates;
        if (!t) continue;
        var effects = t.crisis_effects || [];
        for (var j = 0; j < effects.length; j++) {
            var eff = effects[j];
            if (eff.target !== 'nation' || !eff.stat_key) continue;
            var dir = eff.change_per_tick > 0 ? 'up' : 'down';
            addEffectToMap(map, eff.stat_key, t.name, dir, 'Crisis');
        }
    }
}

function parseMinistryEffects(actions, map) {
    for (var i = 0; i < actions.length; i++) {
        var action = actions[i];
        var effects = action.stat_effects;
        if (!effects || !Array.isArray(effects)) continue;
        for (var j = 0; j < effects.length; j++) {
            var eff = effects[j];
            if (eff.target && eff.target !== 'nation') continue;
            if (!eff.stat_key) continue;
            var dir = (eff.direction || 'up').toLowerCase() === 'up' ? 'up' : 'down';
            addEffectToMap(map, eff.stat_key, prettyStatName(action.action_key), dir, 'Ministry Action');
        }
    }
}

function parseDiplomaticEffects(actions, map) {
    for (var i = 0; i < actions.length; i++) {
        var action = actions[i];
        var effects = action.stat_effects;
        if (!effects || !Array.isArray(effects)) continue;
        for (var j = 0; j < effects.length; j++) {
            var eff = effects[j];
            if (!eff.stat_key) continue;
            var dir = (eff.direction || 'up').toLowerCase() === 'up' ? 'up' : 'down';
            addEffectToMap(map, eff.stat_key, prettyStatName(action.action_type), dir, 'Diplomatic Action');
        }
    }
}

function parseLeaderTraitEffects(traitData, map) {
    if (!traitData || !traitData.effects || !traitData.effects.nation_stat_per_tick) return;
    var perTick = traitData.effects.nation_stat_per_tick;
    var traitLabel = prettyStatName(traitData.traitKey);
    for (var rawStat in perTick) {
        if (!perTick.hasOwnProperty(rawStat)) continue;
        var delta = perTick[rawStat];
        if (delta === 0) continue;
        addEffectToMap(map, rawStat, traitLabel, delta > 0 ? 'up' : 'down', 'Leader Trait');
    }
}

function parseDecayEffects(nation, map) {
    for (var statKey in STAT_DECAY_CONFIG) {
        if (!STAT_DECAY_CONFIG.hasOwnProperty(statKey)) continue;
        var config = STAT_DECAY_CONFIG[statKey];
        var currentVal = nation[statKey] !== undefined && nation[statKey] !== null ? Number(nation[statKey]) : 50;
        if (currentVal === config.target) continue;
        var dir = currentVal > config.target ? 'down' : 'up';
        var label = config.type === 'erosion' ? 'Natural Erosion' : 'Natural Decay';
        addEffectToMap(map, statKey, label, dir, 'Decay');
    }
}

// ===== End Affected-By Data Fetching =====

function calculateRanking(statKey, value, inverted = false) {
    if (value === null || value === undefined) return null;
    const values = allNations.map(n => n[statKey]).filter(v => v !== null && v !== undefined);
    if (values.length === 0) return null;
    // Count how many nations are strictly better (handles ties correctly)
    const betterCount = values.filter(v => inverted ? v < value : v > value).length;
    return betterCount + 1;
}

function prettyStatName(key) {
    return key.replace(/_/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
}

async function getShardTick() {
    var cached = qCache('shard_current_tick');
    if (cached) return cached;
    var res = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    if (res.data) { qCacheSet('shard_current_tick', res.data.current_tick, 30 * 1000); return res.data.current_tick; }
    return 0;
}

// ===== DISPLAY HELPERS =====

function formatGdpGrowth(rawValue) {
    var v = Number(rawValue ?? 50);
    var pct = ((v - 50) / 50) * 3;
    return (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
}

function formatTradeBalance(rawValue) {
    var v = Math.round(Number(rawValue ?? 50));
    var expPct = v, impPct = 100 - v;
    if (impPct === 0) return '100% Exports';
    if (expPct === 0) return '100% Imports';
    if (expPct === impPct) return 'Balanced';
    return expPct + '% Exp / ' + impPct + '% Imp';
}

// Detect GDP/debt stored as 0-100 stat scores instead of raw dollars
var RAW_DOLLAR_KEYS = { gdp: true, debt: true };
function isMisscaledMonetary(key, val) {
    return RAW_DOLLAR_KEYS[key] && val != null && Number(val) >= 0 && Number(val) <= 100000;
}

function getDisplayValue(stat, nation) {
    var raw = nation[stat.key];
    var format = stat.format;
    if (raw === null || raw === undefined) return 'N/A';
    if (format === 'gdp' || format === 'currency') {
        assertRawEconomicValue(raw, stat.key);
    }
    if ((format === 'gdp' || format === 'currency') && isMisscaledMonetary(stat.key, raw)) {
        return '$' + Math.round(Number(raw));
    }
    if (format === 'count') return formatNumber(raw);
    if (format === 'gdp') return formatCurrencyShort(scaleRawToDollars(raw));
    if (format === 'currency') return formatCurrencyShort(scaleRawToDollars(raw));
    if (format === 'gdpgrowth') return formatGdpGrowth(raw);
    if (format === 'trade') return formatTradeBalance(raw);
    if (format === 'inflation') return formatInflationRate(raw);
    if (format === 'years') return (Math.round(Number(raw) * 10) / 10) + ' yrs';
    return Math.round(Number(raw) * 10) / 10;
}

// ===== FEATURED CONTAINERS =====

function buildFeaturedSparkSVG(data, color, w, h) {
    w = w || 200; h = h || 50;
    if (!data || data.length < 2) return '';
    var mn = Math.min.apply(null, data), mx = Math.max.apply(null, data), r = mx - mn || 1;
    var pts = data.map(function(v, i) {
        return ((i / (data.length - 1)) * w).toFixed(1) + ',' + (h - ((v - mn) / r) * h).toFixed(1);
    }).join(' ');
    // Build a filled area polygon
    var firstY = (h - ((data[0] - mn) / r) * h).toFixed(1);
    var lastX = w.toFixed(1);
    var lastY = (h - ((data[data.length - 1] - mn) / r) * h).toFixed(1);
    var areaPts = '0,' + h + ' 0,' + firstY + ' ' + pts + ' ' + lastX + ',' + h;
    return '<svg width="' + w + '" height="' + h + '" style="display:block;width:100%;height:100%;" preserveAspectRatio="none">' +
        '<polygon points="' + areaPts + '" fill="' + color + '" fill-opacity="0.08"/>' +
        '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="1.5" stroke-linejoin="round"/>' +
        '<circle cx="' + lastX + '" cy="' + lastY + '" r="2" fill="' + color + '"/></svg>';
}

function buildFeaturedAbpHTML(statKey) {
    var effects = statEffectsByKey[statKey] || [];
    if (effects.length === 0) return '';
    var h = '<div class="featured-card__abp-title">Affected By</div>';
    for (var i = 0; i < effects.length; i++) {
        var eff = effects[i];
        var arrow = eff.direction === 'up' ? '&#9650;' : '&#9660;';
        var arrowClass = eff.direction === 'up' ? 'featured-card__abp-arrow--up' : 'featured-card__abp-arrow--down';
        var typeClass = 'featured-card__abp-type--' + eff.type.toLowerCase().replace(/ /g, '-');
        h += '<div class="featured-card__abp-row">';
        h += '<span class="featured-card__abp-name">' + escapeHtml(eff.name) + '</span>';
        h += '<span class="featured-card__abp-arrow ' + arrowClass + '">' + arrow + '</span>';
        if (eff.rate) {
            var sign = eff.direction === 'up' ? '+' : '-';
            h += '<span class="featured-card__abp-rate">' + sign + eff.rate + '/tick</span>';
        }
        h += '<span class="featured-card__abp-type ' + typeClass + '">' + escapeHtml(eff.type) + '</span>';
        h += '</div>';
    }
    return h;
}

function renderFeaturedGDP(nation) {
    var gdpRaw = nation.gdp;
    var gdpGrowthRaw = Number(nation.gdp_growth ?? 50);
    var monthlyPct = ((gdpGrowthRaw - 50) / 50) * 3;
    var yearlyPct = (Math.pow(1 + monthlyPct / 100, 12) - 1) * 100;
    var gdpDisplay = formatCurrencyShort(scaleRawToDollars(gdpRaw));
    // Split "$88.7 Billion" into value + unit
    var parts = gdpDisplay.match(/^(\$[\d,.]+)\s*(.*)$/);
    var gdpVal = parts ? parts[1] : gdpDisplay;
    var gdpUnit = parts ? parts[2] : '';

    // Delta per tick
    var deltaStr = '';
    if (previousTickData && previousTickData.gdp != null && gdpRaw != null) {
        var gdpDelta = Number(gdpRaw) - Number(previousTickData.gdp);
        var deltaDir = gdpDelta >= 0 ? '\u25B2' : '\u25BC';
        var deltaColor = gdpDelta >= 0 ? 'var(--n-green)' : 'var(--n-red)';
        deltaStr = '<span class="featured-card__delta" style="color:' + deltaColor + ';">' + deltaDir + ' ' + Math.abs(gdpDelta).toFixed(1) + ' per tick</span>';
    }

    // Growth rate color
    var growthColor = monthlyPct >= 0 ? 'var(--n-green)' : 'var(--n-red)';
    var yearlyColor = yearlyPct >= 0 ? 'var(--n-green)' : 'var(--n-red)';
    var growthStr = (monthlyPct >= 0 ? '+' : '') + monthlyPct.toFixed(2) + '%';
    var yearlyStr = (yearlyPct >= 0 ? '+' : '') + yearlyPct.toFixed(2) + '%';

    // GDP growth label
    var gdpLabel, tagColor, tagBorder;
    if (monthlyPct < -1) { gdpLabel = 'Collapse'; tagColor = 'var(--n-red)'; tagBorder = 'rgba(239,68,68,0.3)'; }
    else if (monthlyPct < 0) { gdpLabel = 'Recession'; tagColor = 'var(--n-orange)'; tagBorder = 'rgba(249,115,22,0.3)'; }
    else if (monthlyPct < 0.5) { gdpLabel = 'Stagnant'; tagColor = 'var(--n-yellow)'; tagBorder = 'rgba(250,204,21,0.3)'; }
    else if (monthlyPct < 3) { gdpLabel = 'Growing'; tagColor = 'var(--n-green)'; tagBorder = 'rgba(74,222,128,0.3)'; }
    else { gdpLabel = 'Booming'; tagColor = 'var(--n-green)'; tagBorder = 'rgba(74,222,128,0.3)'; }

    // Dot color matches tag
    var dotColor = tagColor;

    // Scale items
    var scaleItems = [
        { label: 'Collapse', range: '<0%', active: monthlyPct < -1 },
        { label: 'Recession', range: '0-0.5%', active: monthlyPct >= -1 && monthlyPct < 0 },
        { label: 'Stagnant', range: '0.5-70%', active: monthlyPct >= 0 && monthlyPct < 0.5 },
        { label: 'Growing', range: '1.0-3.00%', active: monthlyPct >= 0.5 && monthlyPct < 3 },
        { label: 'Booming', range: '>3.00%', active: monthlyPct >= 3 }
    ];

    // Sparkline
    var sparkData = sparklineHistory['gdp'] ? sparklineHistory['gdp'].slice() : [];
    if (gdpRaw != null) sparkData.push(Number(gdpRaw));
    var chartColor = monthlyPct >= 0 ? '#4ade80' : '#ef4444';
    var chartSVG = buildFeaturedSparkSVG(sparkData, chartColor);

    var h = '<div class="featured-card featured-card--gdp">';
    // Header
    h += '<div class="featured-card__header">';
    h += '<div class="featured-card__dot" style="background:' + dotColor + ';"></div>';
    h += '<span class="featured-card__title">Gross Domestic Product</span>';
    h += '<span class="featured-card__tag" style="color:' + tagColor + ';border-color:' + tagBorder + ';">' + escapeHtml(gdpLabel) + '</span>';
    h += '</div>';

    // Description
    h += '<div class="featured-card__desc">Gross domestic product</div>';

    // Value + side stats
    h += '<div class="featured-card__value-row">';
    h += '<div><span class="featured-card__big-value" style="color:' + tagColor + ';">' + gdpVal + '</span>';
    if (gdpUnit) h += '<span class="featured-card__big-unit" style="color:' + tagColor + ';">' + escapeHtml(gdpUnit) + '</span>';
    h += '</div>';
    h += '<div class="featured-card__side-stats">';
    h += '<div><span class="featured-card__side-label">Growth Rate</span></div>';
    h += '<div><span class="featured-card__side-value" style="color:' + growthColor + ';">' + growthStr + '</span></div>';
    h += '<div><span class="featured-card__side-label">Yearly Forecast</span></div>';
    h += '<div><span class="featured-card__side-value" style="color:' + yearlyColor + ';">' + yearlyStr + '</span></div>';
    h += '</div>';
    h += '</div>';

    // Delta
    if (deltaStr) h += deltaStr;

    // Chart
    h += '<div class="featured-card__chart">' + chartSVG + '</div>';

    // Scale
    h += '<div class="featured-card__scale">';
    for (var i = 0; i < scaleItems.length; i++) {
        var si = scaleItems[i];
        h += '<div class="featured-card__scale-item' + (si.active ? ' featured-card__scale-item--active' : '') + '">';
        h += escapeHtml(si.label);
        h += '<span class="featured-card__scale-range">' + escapeHtml(si.range) + '</span>';
        h += '</div>';
    }
    h += '</div>';

    // Affected by
    h += buildFeaturedAbpHTML('gdp');
    // Also include gdp_growth effects
    var gdpGrowthEffects = statEffectsByKey['gdp_growth'] || [];
    if (gdpGrowthEffects.length > 0 && !(statEffectsByKey['gdp'] || []).length) {
        h += buildFeaturedAbpHTML('gdp_growth');
    }

    h += '</div>';
    return h;
}

function renderFeaturedInflation(nation) {
    var inflRaw = Number(nation.inflation ?? 0);
    var rate = inflationRate(inflRaw);
    var rateStr = formatInflationRate(inflRaw);
    var label = getInflationLabel(inflRaw);

    // Tag color
    var iClass = inflationColorClass(inflRaw);
    var tagColor, tagBorder, dotColor;
    if (iClass === 'good') { tagColor = 'var(--n-green)'; tagBorder = 'rgba(74,222,128,0.3)'; dotColor = 'var(--n-green)'; }
    else if (iClass === 'medium') { tagColor = 'var(--n-yellow)'; tagBorder = 'rgba(250,204,21,0.3)'; dotColor = 'var(--n-yellow)'; }
    else { tagColor = 'var(--n-red)'; tagBorder = 'rgba(239,68,68,0.3)'; dotColor = 'var(--n-red)'; }

    // Delta per tick
    var deltaStr = '';
    if (previousTickData && previousTickData.inflation != null) {
        var prevRate = inflationRate(Number(previousTickData.inflation));
        var rateDelta = rate - prevRate;
        // For inflation, down is good
        var deltaDir = rateDelta >= 0 ? '\u25B2' : '\u25BC';
        var deltaColor = rateDelta <= 0 ? 'var(--n-green)' : 'var(--n-red)';

        { label: 'Moderate', range: '1-3%', active: rate >= 1 && rate < 3 },
        { label: 'High', range: '3-8%', active: rate >= 3 && rate < 8 },
        { label: 'Hyper', range: '8%+', active: rate >= 8 }
    ];

    // Sparkline — for inflation, invert visually: down line = good
    var sparkData = sparklineHistory['inflation'] ? sparklineHistory['inflation'].slice() : [];
    if (inflRaw != null) sparkData.push(inflRaw);
    // Color: green if good/stable, red if bad
    var chartColor = iClass === 'good' ? '#4ade80' : iClass === 'medium' ? '#facc15' : '#ef4444';
    var chartSVG = buildFeaturedSparkSVG(sparkData, chartColor);

    var h = '<div class="featured-card featured-card--inflation">';

    h += '<div class="featured-card__header">';
    h += '<div class="featured-card__dot" style="background:' + dotColor + ';"></div>';
    h += '<span class="featured-card__title">Inflation</span>';
    h += '<span class="featured-card__tag" style="color:' + tagColor + ';border-color:' + tagBorder + ';">' + escapeHtml(label) + '</span>';
    h += '</div>';

    // Description
    h += '<div class="featured-card__desc">Inflation growth rate</div>';

    // Value row
    h += '<div class="featured-card__value-row">';
    h += '<div><span class="featured-card__big-value" style="color:' + tagColor + ';">' + rateStr + '</span></div>';
    h += '</div>';

    // Delta
    if (deltaStr) h += deltaStr;

    // Chart
    h += '<div class="featured-card__chart">' + chartSVG + '</div>';

    // Scale
    h += '<div class="featured-card__scale">';
    for (var i = 0; i < scaleItems.length; i++) {
        var si = scaleItems[i];
        h += '<div class="featured-card__scale-item' + (si.active ? ' featured-card__scale-item--active' : '') + '">';
        h += escapeHtml(si.label);
        h += '<span class="featured-card__scale-range">' + escapeHtml(si.range) + '</span>';
        h += '</div>';
    }
    h += '</div>';

    // Affected by
    h += buildFeaturedAbpHTML('inflation');

    h += '</div>';
    return h;
}

function renderFeaturedGDPGrowth(nation) {
    var gdpGrowthRaw = Number(nation.gdp_growth ?? 50);
    var monthlyPct = ((gdpGrowthRaw - 50) / 50) * 3;
    var yearlyPct = (Math.pow(1 + monthlyPct / 100, 12) - 1) * 100;
    var growthStr = (monthlyPct >= 0 ? '+' : '') + monthlyPct.toFixed(2) + '%';
    var yearlyStr = (yearlyPct >= 0 ? '+' : '') + yearlyPct.toFixed(2) + '%';

    // Color based on growth
    var growthColor, borderColor, dotColor, tagColor, tagBorder;
    if (monthlyPct >= 0.5) { growthColor = '#4ade80'; borderColor = '#4ade80'; dotColor = 'var(--n-green)'; tagColor = 'var(--n-green)'; tagBorder = 'rgba(74,222,128,0.3)'; }
    else if (monthlyPct >= 0) { growthColor = '#facc15'; borderColor = '#facc15'; dotColor = 'var(--n-yellow)'; tagColor = 'var(--n-yellow)'; tagBorder = 'rgba(250,204,21,0.3)'; }
    else { growthColor = '#ef4444'; borderColor = '#ef4444'; dotColor = 'var(--n-red)'; tagColor = 'var(--n-red)'; tagBorder = 'rgba(239,68,68,0.3)'; }

    var yearlyColor = yearlyPct >= 0 ? 'var(--n-green)' : 'var(--n-red)';

    // Growth label
    var gdpLabel;
    if (monthlyPct < -1) { gdpLabel = 'Collapse'; }
    else if (monthlyPct < 0) { gdpLabel = 'Recession'; }
    else if (monthlyPct < 0.5) { gdpLabel = 'Stagnant'; }
    else if (monthlyPct < 3) { gdpLabel = 'Growing'; }
    else { gdpLabel = 'Booming'; }

    // Delta per tick
    var deltaStr = '';
    if (previousTickData && previousTickData.gdp_growth != null) {
        var prevGrowthRaw = Number(previousTickData.gdp_growth);
        var delta = gdpGrowthRaw - prevGrowthRaw;
        if (Math.abs(delta) >= 0.01) {
            var deltaDir = delta > 0 ? '\u25B2' : '\u25BC';
            var deltaColor = delta > 0 ? 'var(--n-green)' : 'var(--n-red)';
            deltaStr = '<span class="featured-card__delta" style="color:' + deltaColor + ';">' + deltaDir + ' ' + Math.abs(((delta) / 50) * 3).toFixed(2) + '% per tick</span>';
        }
    }

    // Scale items
    var scaleItems = [
        { label: 'Collapse', range: '<0%', active: monthlyPct < -1 },
        { label: 'Recession', range: '0-0.5%', active: monthlyPct >= -1 && monthlyPct < 0 },
        { label: 'Stagnant', range: '0.5-70%', active: monthlyPct >= 0 && monthlyPct < 0.5 },
        { label: 'Growing', range: '1.0-3.00%', active: monthlyPct >= 0.5 && monthlyPct < 3 },
        { label: 'Booming', range: '>3.00%', active: monthlyPct >= 3 }
    ];

    // Sparkline (large chart)
    var sparkData = sparklineHistory['gdp_growth'] ? sparklineHistory['gdp_growth'].slice() : [];
    if (gdpGrowthRaw != null) sparkData.push(gdpGrowthRaw);
    var chartSVG = buildFeaturedSparkSVG(sparkData, growthColor);

    var h = '<div class="featured-card featured-card--compact" style="border-left-color:' + borderColor + ';">';
    // Header
    h += '<div class="featured-card__header">';
    h += '<div class="featured-card__dot" style="background:' + dotColor + ';"></div>';
    h += '<span class="featured-card__title">GDP Growth</span>';
    h += '<span class="featured-card__tag" style="color:' + tagColor + ';border-color:' + tagBorder + ';">' + escapeHtml(gdpLabel) + '</span>';
    h += '</div>';

    // Description
    h += '<div class="featured-card__desc">Monthly economic growth rate</div>';

    // Value + side stats
    h += '<div class="featured-card__value-row">';
    h += '<div><span class="featured-card__big-value" style="color:' + tagColor + ';">' + growthStr + '</span></div>';
    h += '<div class="featured-card__side-stats">';
    h += '<div><span class="featured-card__side-label">Yearly Forecast</span></div>';
    h += '<div><span class="featured-card__side-value" style="color:' + yearlyColor + ';">' + yearlyStr + '</span></div>';
    h += '</div>';
    h += '</div>';

    // Delta
    if (deltaStr) h += deltaStr;

    // Chart (large sparkline)
    h += '<div class="featured-card__chart">' + chartSVG + '</div>';

    // Scale
    h += '<div class="featured-card__scale">';
    for (var i = 0; i < scaleItems.length; i++) {
        var si = scaleItems[i];
        h += '<div class="featured-card__scale-item' + (si.active ? ' featured-card__scale-item--active' : '') + '">';
        h += escapeHtml(si.label);
        h += '<span class="featured-card__scale-range">' + escapeHtml(si.range) + '</span>';
        h += '</div>';
    }
    h += '</div>';

    // Affected by
    var effects = statEffectsByKey['gdp_growth'] || [];
    if (effects.length > 0) {
        h += buildFeaturedAbpHTML('gdp_growth');
    } else {
        h += '<div class="compact-empty">No active effects</div>';
    }

    h += '</div>';
    return h;
}

function renderFeaturedDebt(nation) {

    if (previousTickData && previousTickData.debt != null && debtRaw != null) {

    }

    var sparkData = sparklineHistory['debt'] ? sparklineHistory['debt'].slice() : [];

    if (debtUnit) h += '<span class="featured-card__big-unit" style="color:' + tagColor + ';">' + escapeHtml(debtUnit) + '</span>';

    if (effects.length > 0) {

            var deltaDir = delta >= 0 ? '\u25B2' : '\u25BC';

            var deltaColor = deltaGood ? 'var(--n-green)' : 'var(--n-red)';
            deltaStr = '<span class="featured-card__delta" style="color:' + deltaColor + ';">' + deltaDir + ' ' + Math.abs(delta).toFixed(2) + ' per tick</span>';

    var sparkData = sparklineHistory[stat.key] ? sparklineHistory[stat.key].slice() : [];

    // Ranking
    var rank = calculateRanking(stat.key, raw, inv);

        var total = totalNations || 6;

        for (var ri = 0; ri < total; ri++) {
            if (ri < rank) {

            }
        }
        rankHTML += '<span class="compact-bottom__rank-label">#' + rank + '</span></div>';
    }

    // Scale tiers (generic 0-100 scale)
    var effective = inv ? 100 - numVal : numVal;
    var scaleItems = [

        { label: 'Low', range: '20-40', active: effective >= 20 && effective < 40 },
        { label: 'Moderate', range: '40-60', active: effective >= 40 && effective < 60 },
        { label: 'Good', range: '60-80', active: effective >= 60 && effective < 80 },
        { label: 'Excellent', range: '80+', active: effective >= 80 }
    ];

    var h = '<div class="featured-card featured-card--generic" style="border-left:3px solid ' + borderColor + ';">';

    // Header
    h += '<div class="featured-card__header">';
    h += '<div class="featured-card__dot" style="background:' + dotColor + ';"></div>';
    h += '<span class="featured-card__title">' + escapeHtml(stat.name) + '</span>';
    if (rankHTML) h += rankHTML;
    h += '</div>';

    // Description
    h += '<div class="featured-card__desc">' + escapeHtml(stat.desc) + '</div>';

    // Value row
    h += '<div class="featured-card__value-row">';
    h += '<div><span class="featured-card__big-value" style="color:' + hc + ';">' + escapeHtml(String(displayVal)) + '</span></div>';
    h += '</div>';

    // Delta
    if (deltaStr) h += deltaStr;

    // Chart
    h += '<div class="featured-card__chart">' + chartSVG + '</div>';

    // Scale
    h += '<div class="featured-card__scale">';
    for (var i = 0; i < scaleItems.length; i++) {
        var si = scaleItems[i];
        h += '<div class="featured-card__scale-item' + (si.active ? ' featured-card__scale-item--active' : '') + '">';
        h += escapeHtml(si.label);
        h += '<span class="featured-card__scale-range">' + escapeHtml(si.range) + '</span>';
        h += '</div>';
    }
    h += '</div>';

    // Affected by
    var effects = statEffectsByKey[stat.key] || [];
    if (effects.length > 0) {
        h += buildFeaturedAbpHTML(stat.key);
    } else {
        h += '<div class="compact-empty">No active effects</div>';
    }

    h += '</div>';
    return h;
}

// Map of stat keys to their custom featured renderers
var FEATURED_RENDERERS = {
    gdp: renderFeaturedGDP,
    gdp_growth: renderFeaturedGDPGrowth,
    inflation: renderFeaturedInflation,
    debt: renderFeaturedDebt
};

function renderFeaturedCategory(cat, nation) {
    var hScore = catHealth(cat, nation);
    var hc = healthColor(hScore, false);
    var isOpen = isSectionOpen(cat.id);

    // Count alerts
    var alerts = 0;
    for (var i = 0; i < cat.stats.length; i++) {
        if (cat.stats[i].noHealth) continue;
        var sv = Number(nation[cat.stats[i].key] ?? 50);
        var effective = cat.stats[i].inverted ? 100 - sv : sv;
        if (effective < 15) alerts++;
    }

    var h = '<div class="cat-section">';

    // Header (identical structure to renderCategory)
    h += '<div class="cat-header' + (isOpen ? ' cat-header--open' : '') + '" data-cat="' + cat.id + '">';
    h += '<span class="cat-header__icon">' + cat.icon + '</span>';
    h += '<span class="cat-header__label" style="color:' + hc + ';">' + cat.label + '</span>';
    if (cat.blocs && cat.blocs.length > 0) {
        h += '<div class="cat-header__blocs">';
        for (var bi = 0; bi < cat.blocs.length; bi++) {
            h += '<span class="cat-header__bloc">' + escapeHtml(cat.blocs[bi]) + '</span>';
        }
        h += '</div>';
    }
    if (alerts > 0) {
        h += '<span class="cat-header__alert-badge">\u26A0 ' + alerts + '</span>';
    }
    h += '<div class="cat-header__health-bar"><div class="cat-header__health-fill" style="width:' + Math.min(hScore, 100) + '%;background:' + hc + ';"></div></div>';
    h += '<span class="cat-header__health-score" style="color:' + hc + ';">' + Math.round(hScore) + '</span>';
    h += '<span class="cat-header__chevron">\u25BC</span>';
    h += '</div>';

    // Body with featured grid
    h += '<div class="cat-body' + (isOpen ? ' cat-body--open' : '') + '" id="cat-body-' + cat.id + '">';
    h += '<div class="featured-grid">';
    for (var si = 0; si < cat.stats.length; si++) {
        var stat = cat.stats[si];
        if (FEATURED_RENDERERS[stat.key]) {
            h += FEATURED_RENDERERS[stat.key](nation);
        } else {
            h += renderFeaturedStatCard(stat, nation);
        }
    }
    h += '</div>';
    h += '</div>';
    h += '</div>';
    return h;
}

function renderStatCard(stat, nation) {
    var raw = nation[stat.key];
    var numVal = (raw !== null && raw !== undefined) ? Number(raw) : 50;
    if (isNaN(numVal)) numVal = 50;
    var inv = stat.inverted || false;
    var hc = healthColor(numVal, inv);
    var hcRaw = healthColorRaw(numVal, inv);

    var displayVal = getDisplayValue(stat, nation);

    // Trend
    var trendHTML = '';
    if (previousTickData) {
        var histKey = stat.key;
        var prevVal = previousTickData[histKey];
        if (prevVal !== null && prevVal !== undefined && raw !== null && raw !== undefined) {
            var delta = Number(raw) - Number(prevVal);
            if (Math.abs(delta) >= 0.01) {
                var tDir = inv ? -delta : delta;
                var tColor = tDir > 0 ? 'var(--n-green)' : 'var(--n-red)';
                trendHTML = '<span class="stat-card__trend" style="color:' + tColor + ';">' + (tDir > 0 ? '\u25B2' : '\u25BC') + '</span>';
            }
        }
    }

    // Tag (e.g. inflation label)
    var tagHTML = '';
    if (stat.key === 'inflation' && raw !== null && raw !== undefined) {
        var label = getInflationLabel(raw);
        if (label) {
            var tagColor, tagBg, tagBorder;
            var iClass = inflationColorClass(raw);
            if (iClass === 'good') { tagColor = 'var(--n-green)'; tagBg = 'var(--n-green-dim)'; tagBorder = 'rgba(74,222,128,0.2)'; }
            else if (iClass === 'medium') { tagColor = 'var(--n-yellow)'; tagBg = 'var(--n-yellow-dim)'; tagBorder = 'rgba(250,204,21,0.2)'; }
            else { tagColor = 'var(--n-red)'; tagBg = 'var(--n-red-dim)'; tagBorder = 'rgba(239,68,68,0.2)'; }
            tagHTML = '<span class="stat-card__tag" style="color:' + tagColor + ';background:' + tagBg + ';border:1px solid ' + tagBorder + ';">' + escapeHtml(label) + '</span>';
        }
    }

    // Sparkline — append current value so the line reaches "now"
    var sparkData = sparklineHistory[stat.key] ? sparklineHistory[stat.key].slice() : null;
    if (raw !== null && raw !== undefined) {
        if (!sparkData) sparkData = [];
        sparkData.push(Number(raw));
    }
    var sparkHTML = buildSparklineSVG(sparkData, hcRaw);

    // Rank
    var rank = calculateRanking(stat.key, raw, inv);
    var rankHTML = buildRankBar(rank);

    // Alert (stat below 15 effective)
    var effective = inv ? 100 - numVal : numVal;
    var isAlert = !stat.noHealth && effective < 15;

    // Effect dot
    var effectCount = (statEffectsByKey[stat.key] || []).length;

    var h = '<div class="stat-card" data-stat-key="' + stat.key + '" style="border-left-color:' + hcRaw + ';">';

    // Alert triangle
    if (isAlert) h += '<div class="stat-card__alert-tri"></div>';

    // Top row
    h += '<div class="stat-card__top">';
    h += '<div class="stat-card__name-area">';
    if (effectCount > 0) h += '<span class="stat-card__effect-dot" title="' + effectCount + ' active effect' + (effectCount !== 1 ? 's' : '') + '"></span>';
    h += '<span class="stat-card__name">' + escapeHtml(stat.name) + '</span>';
    h += trendHTML;
    h += tagHTML;
    h += '</div>';
    h += '<div class="stat-card__value-area">';
    h += '<span class="stat-card__sparkline">' + sparkHTML + '</span>';
    h += '<span class="stat-card__value" style="color:' + hc + ';">' + displayVal + '</span>';
    h += '</div></div>';

    // Bottom row
    h += '<div class="stat-card__bottom">';
    h += '<span class="stat-card__desc">' + escapeHtml(stat.desc || '') + '</span>';
    h += rankHTML;
    h += '</div>';

    // Predicted yearly growth for GDP Growth
    if (stat.key === 'gdp_growth') {
        var monthlyPct = ((numVal - 50) / 50) * 3;
        var yearlyPct = (Math.pow(1 + monthlyPct / 100, 12) - 1) * 100;
        var yearlyStr = (yearlyPct >= 0 ? '+' : '') + yearlyPct.toFixed(2) + '%';
        var yearlyColor = yearlyPct >= 0 ? 'var(--n-green)' : 'var(--n-red)';
        h += '<div style="padding:4px 10px 2px;font-size:11px;color:var(--dtxt-muted);letter-spacing:0.3px;">Predicted Yearly Growth: <span style="color:' + yearlyColor + ';font-weight:600;">' + yearlyStr + '</span></div>';
    }

    // Alert message
    if (isAlert) {
        h += '<div class="stat-card__alert-msg">\u26A0 Critical \u2014 approaching crisis threshold</div>';
    }

    // Affected-by panel
    h += '<div class="stat-card__abp" id="abp-' + stat.key + '"></div>';

    h += '</div>';
    return h;
}

// ===== CLICK HANDLERS =====

function attachHandlers() {
    // Section toggles
    var headers = document.querySelectorAll('.cat-header[data-cat]');
    for (var i = 0; i < headers.length; i++) {
        headers[i].addEventListener('click', function() {
            toggleSection(this.getAttribute('data-cat'));
        });
    }

    // Stat card click → affected-by panel
    var cards = document.querySelectorAll('.stat-card[data-stat-key]');
    for (var i = 0; i < cards.length; i++) {
        cards[i].addEventListener('click', handleStatCardClick);
    }
}

function handleStatCardClick(e) {
    var card = this;
    var statKey = card.getAttribute('data-stat-key');
    var panel = document.getElementById('abp-' + statKey);
    if (!panel) return;

    var isOpen = card.classList.contains('stat-card--expanded');

    // Accordion: close all
    var allExpanded = document.querySelectorAll('.stat-card--expanded');
    for (var i = 0; i < allExpanded.length; i++) {
        allExpanded[i].classList.remove('stat-card--expanded');
        var p = allExpanded[i].querySelector('.stat-card__abp');
        if (p) p.innerHTML = '';
    }

    if (isOpen) return;

    card.classList.add('stat-card--expanded');
    panel.innerHTML = buildAffectedByContent(statKey);
}

function buildAffectedByContent(statKey) {
    var effects = statEffectsByKey[statKey] || [];
    if (effects.length === 0) {
        return '<div class="abp-empty">No active effects</div>';
    }
    var h = '<div class="abp-title">Affected By</div>';
    for (var i = 0; i < effects.length; i++) {
        var eff = effects[i];
        var arrow = eff.direction === 'up' ? '&#9650;' : '&#9660;';
        var arrowClass = eff.direction === 'up' ? 'abp-arrow--up' : 'abp-arrow--down';
        var typeClass = 'abp-type--' + eff.type.toLowerCase().replace(/ /g, '-');
        h += '<div class="abp-row">';
        h += '<span class="abp-name">' + escapeHtml(eff.name) + '</span>';
        h += '<span class="abp-arrow ' + arrowClass + '">' + arrow + '</span>';
        if (eff.rate) {
            var sign = eff.direction === 'up' ? '+' : '-';
            h += '<span class="abp-rate">' + sign + eff.rate + '/tick</span>';
        }
        h += '<span class="abp-type ' + typeClass + '">' + escapeHtml(eff.type) + '</span>';
        h += '</div>';
    }
    return h;
}

</script>
