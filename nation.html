// ===== HELPER FUNCTIONS =====

function healthColor(val, inverted) {
    var v = inverted ? 100 - val : val;
    if (v >= 65) return 'var(--n-green)';
    if (v >= 45) return 'var(--n-yellow)';
    if (v >= 25) return 'var(--n-orange)';
    return 'var(--n-red)';
}

// Resolve a CSS variable to its computed hex value (for SVG attributes that can't use var())
function getCSSColor(varName) {
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
}
function healthColorRaw(val, inverted) {
    var v = inverted ? 100 - val : val;
    if (v >= 65) return getCSSColor('--n-green');
    if (v >= 45) return getCSSColor('--n-yellow');
    if (v >= 25) return getCSSColor('--n-orange');
    return getCSSColor('--n-red');
}

function catHealth(cat, nation) {
    var scored = cat.stats.filter(function(s) {
        if (s.noHealth) return false;
        var v = nation[s.key];
        return v !== null && v !== undefined;
    });
    if (!scored.length) return 50;
    var sum = 0;
    for (var i = 0; i < scored.length; i++) {
        var v = Number(nation[scored[i].key]);
        if (isNaN(v)) v = 50;
        v = Math.max(0, Math.min(v, 100));
        if (scored[i].inverted) v = 100 - v;
        sum += v;
    }
    return sum / scored.length;
}

function isSectionOpen(catId) {
    if (sectionState[catId] !== undefined) return sectionState[catId];
    return !!defaultOpen[catId];
}

function toggleSection(catId) {
    var isOpen = isSectionOpen(catId);
    sectionState[catId] = !isOpen;
    sessionStorage.setItem('nationSectionState', JSON.stringify(sectionState));
    var header = document.querySelector('.cat-header[data-cat="' + catId + '"]');
    var body = document.getElementById('cat-body-' + catId);
    if (!header || !body) return;
    if (sectionState[catId]) {
        header.classList.add('cat-header--open');
        body.classList.add('cat-body--open');
    } else {
        header.classList.remove('cat-header--open');
        body.classList.remove('cat-body--open');
    }
}

// Initialize page
initPage('nation', async (state) => {
    const { nation, faction } = state;
    if (!nation) {
        document.getElementById('content-area').innerHTML = '<div class="loading-container"><div style="font-size:24px">No Nation</div><div>Your party is not assigned to a nation yet.</div></div>';
        return;
    }

    // Fix placeholder government_type values from DB
    if (!nation.government_type || nation.government_type.toLowerCase().includes('your_gov_here')) {
        nation.government_type = CANONICAL_GOVERNMENT_TYPES.PARLIAMENTARY_DEMOCRACY;
    }

    await Promise.all([
        loadAllNations(),
        loadPreviousTickData(nation.id),
        loadStatEffectSources(nation.id, nation),
        loadSparklineHistory(nation.id)
    ]);
    await renderNationPage(nation);

    // Auto-refresh when a tick advances (debounced to prevent concurrent renders)
    let _isRefreshing = false;
    window.addEventListener('tick-advanced', async () => {
        if (_isRefreshing) return;
        _isRefreshing = true;
        try {
            qCacheBust('prev_tick_');
            qCacheBust('sparkline_');
            qCacheBust('stat_effects_');
            qCacheBust('all_nations');
            previousTickData = null;
            sparklineHistory = {};
            statEffectsByKey = {};

            const freshState = await refreshGameState();
            const freshNation = freshState?.nation;
            if (!freshNation) return;

            await Promise.all([
                loadAllNations(),
                loadPreviousTickData(freshNation.id),
                loadStatEffectSources(freshNation.id, freshNation),
                loadSparklineHistory(freshNation.id)
            ]);
            await renderNationPage(freshNation);
        } catch (e) {
            console.error('[nation.html] Error refreshing after tick:', e);
        } finally {
            _isRefreshing = false;
        }
    });
});

async function loadAllNations() {
    const cached = qCache('all_nations');
    if (cached) { allNations = cached; totalNations = cached.length; return; }
    const { data: nations, error } = await _supabase.from('nations').select('*');
    if (!error && nations) { allNations = nations; totalNations = nations.length; qCacheSet('all_nations', nations, 2 * 60 * 1000); }
}

async function loadPreviousTickData(nationId) {
    const cacheKey = 'prev_tick_' + nationId;
    const cached = qCache(cacheKey);
    if (cached) { previousTickData = cached; return; }
    const currentTick = await getShardTick();
    if (!currentTick) return;
    const previousTick = currentTick - 1;
    if (previousTick < 0) { console.warn('[loadPreviousTickData] current_tick is', shard.current_tick, '— no previous tick yet'); return; }

    // Use .limit(1) instead of .maybeSingle() — maybeSingle sends an Accept header
    // that causes PostgREST to return HTTP 406 when 0 rows match, which logs a
    // console error even though supabase-js handles it gracefully.
    const { data: historyRows, error } = await _supabase.from('nations_history')
        .select('*').eq('nation_id', nationId).eq('tick', previousTick).limit(1);
    if (error) {
        console.warn('[loadPreviousTickData] Query error for tick ' + previousTick + ':', error.message);
    }
    const history = (historyRows && historyRows.length > 0) ? historyRows[0] : null;
    if (history) {
        previousTickData = history;
        qCacheSet(cacheKey, history, 5 * 60 * 1000);
        return;
    }

    // No history row for the exact previous tick — fall back to the most recent
    // available snapshot, but only if it's within 2 ticks. Beyond that the delta
    // spans too many ticks and becomes misleading (shows stale cumulative change).
    const MAX_FALLBACK_AGE = 2;
    console.warn('[loadPreviousTickData] No history row for tick', previousTick,
        '— falling back to most recent snapshot (max age:', MAX_FALLBACK_AGE, 'ticks).');
    const { data: fallbackRows } = await _supabase.from('nations_history')
        .select('*').eq('nation_id', nationId)
        .gte('tick', shard.current_tick - MAX_FALLBACK_AGE - 1)
        .lt('tick', shard.current_tick)
        .order('tick', { ascending: false }).limit(1);
    if (fallbackRows && fallbackRows.length > 0) {
        previousTickData = fallbackRows[0];
        qCacheSet(cacheKey, fallbackRows[0], 2 * 60 * 1000); // shorter TTL for fallback
        console.warn('[loadPreviousTickData] Using fallback snapshot from tick', fallbackRows[0].tick);
    } else {
        console.warn('[loadPreviousTickData] No recent snapshot within', MAX_FALLBACK_AGE, 'ticks — trend arrows will show neutral.');
    }
}

async function loadSparklineHistory(nationId) {
    var cacheKey = 'sparkline_' + nationId;
    var cached = qCache(cacheKey);
    if (cached) { sparklineHistory = cached; return; }
    var currentTick = await getShardTick();
    if (!currentTick) return;
    var fromTick = Math.max(0, currentTick - 10);
    var { data: rows, error: histErr } = await _supabase.from('nations_history')
        .select('*').eq('nation_id', nationId)
        .gte('tick', fromTick).order('tick', { ascending: true });
    if (histErr) { console.warn('[loadSparklineHistory] Query error:', histErr.message); return; }
    if (!rows || rows.length === 0) return;
    // Build per-stat arrays
    var allKeys = [];
    for (var ci = 0; ci < STAT_CATEGORIES.length; ci++) {
        for (var si = 0; si < STAT_CATEGORIES[ci].stats.length; si++) {
            allKeys.push(STAT_CATEGORIES[ci].stats[si].key);
        }
    }
    var map = {};
    for (var ki = 0; ki < allKeys.length; ki++) {
        var k = allKeys[ki];
        var vals = [];
        for (var ri = 0; ri < rows.length; ri++) {
            var v = rows[ri][k];
            if (v === null || v === undefined) continue;
            var numeric = Number(v);
            if (!isNaN(numeric) && isFinite(numeric)) vals.push(numeric);
        }
        if (vals.length > 0) map[k] = vals;
    }
    sparklineHistory = map;
    qCacheSet(cacheKey, map, 2 * 60 * 1000);
}

async function loadStatEffectSources(nationId, nation) {
    var cacheKey = 'stat_effects_' + nationId;
    var cached = qCache(cacheKey);
    if (cached) { statEffectsByKey = cached; return; }

    var results;
    try {
    results = await Promise.all([
        _supabase.from('active_laws')
            .select('is_reversal, passed_tick, effects_applied_through_tick, policies(policy_name, stat_effects, target_stat, stat_direction, stat_change_per_tick, duration_months)')
            .eq('nation_id', nationId),
        _supabase.from('active_crises')
            .select('crisis_id, crisis_templates(name, crisis_effects(stat_key, change_per_tick, target))')
            .eq('nation_id', nationId),
        _supabase.from('ministry_action_log')
            .select('action_key, stat_effects, applied_at_tick')
            .eq('nation_id', nationId)
            .eq('processed', false),
        _supabase.from('diplomatic_action_log')
            .select('action_type, stat_effects, applied_at_tick')
            .eq('nation_id', nationId)
            .eq('processed', false),
        loadLeaderTraitEffects(nationId, nation),
        _supabase.from('stat_connections')
            .select('source_stat, source_dir, threshold, target_stat, target_dir, magnitude, dampening')
            .eq('enabled', true),
        _supabase.from('budget_item_allocations')
            .select('item_id, item_type, allocation_amount, needed_amount')
            .eq('nation_id', nationId)
            .eq('item_type', 'institution')
            .order('created_at', { ascending: true }),
        _supabase.from('ministry_institution_config')
            .select('id, institution_name, primary_stat, secondary_stat, growth_stat, growth_ceiling')
    ]);
    } catch (e) {
        console.warn('[loadStatEffectSources] Failed to fetch effect sources:', e.message);
        return;
    }

    var currentTick = await getShardTick();
    var map = {};
    parsePolicyEffects(results[0].data || [], map, currentTick);
    parseCrisisEffects(results[1].data || [], map);
    parseMinistryEffects(results[2].data || [], map, currentTick);
    parseDiplomaticEffects(results[3].data || [], map, currentTick);
    parseLeaderTraitEffects(results[4], map);
    parseInstitutionEffects(results[6].data || [], results[7].data || [], nation, map);
    parseDebtPressureEffects(nation, map);
    parseStatConnectionEffects(results[5].data || [], nation, map);
    parseTradeSystemEffects(nation, map);
    parseDecayEffects(nation, map);

    statEffectsByKey = map;
    qCacheSet(cacheKey, map, 2 * 60 * 1000);
}

async function loadLeaderTraitEffects(nationId, nation) {
    try {
        if (isPresidentialRepublic(nation)) {
            var res = await _supabase.from('presidents')
                .select('trait, first_name, last_name')
                .eq('nation_id', nationId)
                .eq('is_active', true)
                .limit(1);
            if (!res.data || res.data.length === 0 || !res.data[0].trait) return null;
            var president = res.data[0];
            var traitRes = await _supabase.from('leader_traits')
                .select('trait_key, effects')
                .eq('trait_key', president.trait)
                .limit(1);
            if (!traitRes.data || traitRes.data.length === 0) return null;
            return { name: president.first_name + ' ' + president.last_name, traitKey: traitRes.data[0].trait_key, effects: traitRes.data[0].effects };
        } else {
            var res = await _supabase.from('head_of_government')
                .select('first_name, last_name, trait_key, leader_traits(trait_key, effects)')
                .eq('nation_id', nationId)
                .eq('active', true)
                .limit(1);
            if (!res.data || res.data.length === 0) return null;
            var hog = res.data[0];
            if (!hog.leader_traits || !hog.leader_traits.effects) return null;
            return { name: hog.first_name + ' ' + hog.last_name, traitKey: hog.leader_traits.trait_key, effects: hog.leader_traits.effects };
        }
    } catch (e) {
        console.warn('[loadLeaderTraitEffects] Error:', e);
        return null;
    }
}

function addEffectToMap(map, statKey, name, direction, type, rate, remainingTicks, extras) {
    var key = normalizeNationStatKey(statKey);
    if (!key) return;
    if (!map[key]) map[key] = [];
    var parsedRate = (rate === null || rate === undefined || rate === '') ? null : Number(rate);
    if (!Number.isFinite(parsedRate)) parsedRate = null;
    var parsedRemaining = (remainingTicks === null || remainingTicks === undefined) ? null : Number(remainingTicks);
    if (!Number.isFinite(parsedRemaining) || parsedRemaining < 0) parsedRemaining = null;
    // Deduplicate and backfill missing rate where available
    for (var i = 0; i < map[key].length; i++) {
        if (map[key][i].name === name && map[key][i].direction === direction && map[key][i].type === type) {
            if ((map[key][i].rate === null || map[key][i].rate === undefined) && parsedRate !== null) {
                map[key][i].rate = parsedRate;
            }
            if ((map[key][i].remainingTicks === null || map[key][i].remainingTicks === undefined) && parsedRemaining !== null) {
                map[key][i].remainingTicks = parsedRemaining;
            }
            return;
        }
    }
    map[key].push({ name: name, direction: direction, type: type, rate: parsedRate, remainingTicks: parsedRemaining, extras: extras || null });
}

function parsePolicyEffects(laws, map, currentTick) {
    for (var i = 0; i < laws.length; i++) {
        var law = laws[i];
        var policy = law.policies;
        if (!policy) continue;
        var ticksSince = currentTick - (law.passed_tick || 0);
        var label = law.is_reversal ? policy.policy_name + ' (Repeal)' : policy.policy_name;

        var effects = policy.stat_effects;
        if (effects && Array.isArray(effects) && effects.length > 0) {
            for (var j = 0; j < effects.length; j++) {
                var eff = effects[j];
                if (!eff.stat_key) continue;
                var delay = Number(eff.delay_ticks) || 0;
                var dur = Number(eff.duration_ticks) || 12;
                // Skip effects that haven't started yet or have expired
                if (ticksSince <= delay || ticksSince > delay + dur) continue;
                var dir = (eff.direction || 'up').toLowerCase() === 'up' ? 'up' : 'down';
                // Reversal laws flip the effect direction
                if (law.is_reversal) dir = (dir === 'up') ? 'down' : 'up';
                var rate = Number(eff.rate);
                if (!Number.isFinite(rate)) rate = Number(policy.stat_change_per_tick);
                if (!Number.isFinite(rate)) rate = 1;
                var remaining = (delay + dur) - ticksSince;
                addEffectToMap(map, eff.stat_key, label, dir, 'Policy', rate, remaining);
            }
            continue;
        }

        // Legacy policy fallback when stat_effects JSON is missing
        if (!policy.target_stat) continue;
        var legacyDur = Number(policy.duration_months) || 12;
        if (ticksSince <= 0 || ticksSince > legacyDur) continue;
        var legacyDir = (policy.stat_direction || 'up').toLowerCase() === 'up' ? 'up' : 'down';
        if (law.is_reversal) legacyDir = (legacyDir === 'up') ? 'down' : 'up';
        var legacyRate = Number(policy.stat_change_per_tick);
        if (!Number.isFinite(legacyRate)) legacyRate = 1;
        var legacyRemaining = legacyDur - ticksSince;
        addEffectToMap(map, policy.target_stat, label, legacyDir, 'Policy', legacyRate, legacyRemaining);
    }
}

function parseCrisisEffects(crises, map) {
    for (var i = 0; i < crises.length; i++) {
        var c = crises[i];
        var t = c.crisis_templates;
        if (!t) continue;
        var effects = t.crisis_effects || [];
        for (var j = 0; j < effects.length; j++) {
            var eff = effects[j];
            if (eff.target !== 'nation' || !eff.stat_key) continue;
            var dir = eff.change_per_tick > 0 ? 'up' : 'down';
            addEffectToMap(map, eff.stat_key, t.name, dir, 'Crisis');
        }
    }
}

function parseMinistryEffects(actions, map, currentTick) {
    for (var i = 0; i < actions.length; i++) {
        var action = actions[i];
        var effects = action.stat_effects;
        if (!effects || !Array.isArray(effects)) continue;
        var ticksSince = currentTick - (action.applied_at_tick || 0);
        for (var j = 0; j < effects.length; j++) {
            var eff = effects[j];
            if (eff.target && eff.target !== 'nation') continue;
            if (!eff.stat_key) continue;
            var dir = (eff.direction || 'up').toLowerCase() === 'up' ? 'up' : 'down';
            var delay = Number(eff.delay_ticks) || 0;
            var dur = Number(eff.duration_ticks) || 4;
            var remaining = (delay + dur) - ticksSince;
            addEffectToMap(map, eff.stat_key, prettyStatName(action.action_key), dir, 'Ministry Action', eff.rate || null, remaining);
        }
    }
}

function parseDiplomaticEffects(actions, map, currentTick) {
    for (var i = 0; i < actions.length; i++) {
        var action = actions[i];
        var effects = action.stat_effects;
        if (!effects || !Array.isArray(effects)) continue;
        var ticksSince = currentTick - (action.applied_at_tick || 0);
        for (var j = 0; j < effects.length; j++) {
            var eff = effects[j];
            if (!eff.stat_key) continue;
            var dir = (eff.direction || 'up').toLowerCase() === 'up' ? 'up' : 'down';
            var delay = Number(eff.delay_ticks) || 0;
            var dur = Number(eff.duration_ticks) || 4;
            var remaining = (delay + dur) - ticksSince;
            addEffectToMap(map, eff.stat_key, prettyStatName(action.action_type), dir, 'Diplomatic Action', eff.rate || null, remaining);
        }
    }
}

function parseLeaderTraitEffects(traitData, map) {
    if (!traitData || !traitData.effects || !traitData.effects.nation_stat_per_tick) return;
    var perTick = traitData.effects.nation_stat_per_tick;
    var traitLabel = prettyStatName(traitData.traitKey);
    for (var rawStat in perTick) {
        if (!perTick.hasOwnProperty(rawStat)) continue;
        var delta = perTick[rawStat];
        if (delta === 0) continue;
        addEffectToMap(map, rawStat, traitLabel, delta > 0 ? 'up' : 'down', 'Leader Trait');
    }
}

function parseStatConnectionEffects(connections, nation, map) {
    for (var i = 0; i < connections.length; i++) {
        var conn = connections[i];
        if (!conn.source_stat || !conn.target_stat) continue;
        var sourceVal = nation[conn.source_stat] !== undefined && nation[conn.source_stat] !== null
            ? Number(nation[conn.source_stat]) : 50;
        var triggered = conn.source_dir === 'above'
            ? sourceVal > conn.threshold
            : sourceVal < conn.threshold;
        if (!triggered) continue;
        var label = prettyStatName(conn.source_stat);
        addEffectToMap(map, conn.target_stat, label, conn.target_dir || 'up', 'Stat Link', Number(conn.magnitude) || null);
    }
}

var INSTITUTION_TIER_LABELS = [
    { minPct: 100, label: 'Fully Funded', color: '#4ade80' },
    { minPct: 90,  label: 'Stretched',    color: '#a3e635' },
    { minPct: 75,  label: 'Strained',     color: '#fbbf24' },
    { minPct: 50,  label: 'Underfunded',  color: '#f97316' },
    { minPct: 25,  label: 'Critical',     color: '#ef4444' },
    { minPct: 0,   label: 'Collapsed',    color: '#f43f5e' },
];

function getInstitutionTier(pct) {
    for (var i = 0; i < INSTITUTION_TIER_LABELS.length; i++) {
        if (pct >= INSTITUTION_TIER_LABELS[i].minPct) return INSTITUTION_TIER_LABELS[i];
    }
    return INSTITUTION_TIER_LABELS[INSTITUTION_TIER_LABELS.length - 1];
}

// Decay rates matching INSTITUTION_DECAY_TIERS in stats.js
var INST_DECAY_RATES = [
    { minPct: 100, primary: 0,   secondary: 0   },
    { minPct: 90,  primary: 0.3, secondary: 0   },
    { minPct: 75,  primary: 0.5, secondary: 0.2 },
    { minPct: 50,  primary: 0.9, secondary: 0.5 },
    { minPct: 25,  primary: 1.7, secondary: 0.9 },
    { minPct: 0,   primary: 2.7, secondary: 1.7 },
];

function getInstDecayRate(pct, role) {
    for (var i = 0; i < INST_DECAY_RATES.length; i++) {
        if (pct >= INST_DECAY_RATES[i].minPct) return INST_DECAY_RATES[i][role];
    }
    return INST_DECAY_RATES[INST_DECAY_RATES.length - 1][role];
}

function parseInstitutionEffects(allocations, institutions, nation, map) {
    // Build funding pct map
    var fundingMap = {};
    for (var i = 0; i < allocations.length; i++) {
        var row = allocations[i];
        var needed = Number(row.needed_amount || 0);
        fundingMap[row.item_id] = needed > 0
            ? Math.min(200, Math.round((Number(row.allocation_amount || 0) / needed) * 100))
            : 100;
    }
    // Show every institution on its covered stats — regardless of funding level
    for (var j = 0; j < institutions.length; j++) {
        var inst = institutions[j];
        var pct = fundingMap[inst.id] !== undefined ? fundingMap[inst.id] : 100;
        var tier = getInstitutionTier(pct);
        var isFullyFunded = pct >= 100;
        var isCollapsed = pct < 25;
        var hasGrowth = !!inst.growth_stat;

        var roles = ['primary', 'secondary'];
        for (var r = 0; r < roles.length; r++) {
            var statKey = inst[roles[r] + '_stat'];
            if (!statKey) continue;

            var rate = null;
            var dir = 'up';
            var badge = tier.label;

            if (isFullyFunded) {
                // Check if this institution has a growth stat that matches this stat key
                if (hasGrowth && inst.growth_stat === statKey) {
                    // Actively growing: +0.25/tick toward ceiling
                    var currentVal = nation[statKey] !== undefined && nation[statKey] !== null ? Number(nation[statKey]) : 0;
                    var ceiling = Number(inst.growth_ceiling || 30);
                    if (currentVal < ceiling) {
                        dir = 'up';
                        rate = 0.25;
                    } else {
                        // At ceiling — holding
                        dir = 'up';
                        rate = null;
                    }
                } else {
                    // Fully funded, no growth on this stat — holding (no decay)
                    dir = 'up';
                    rate = null;
                }
            } else {
                // Underfunded — decaying
                var decayRate = getInstDecayRate(pct, roles[r]);
                if (decayRate > 0) {
                    dir = 'down';
                    rate = decayRate;
                } else {
                    // e.g. Stretched secondary = 0 decay
                    dir = 'up';
                    rate = null;
                    badge = tier.label;
                }
            }

            var label = inst.institution_name || inst.name;
            addEffectToMap(map, statKey, label, dir, 'Institution', rate, null, {
                fundingPct: pct,
                tierLabel: badge,
                tierColor: tier.color,
                isCollapsed: isCollapsed,
                isFullyFunded: isFullyFunded,
                hasGrowthEffect: isFullyFunded && hasGrowth && inst.growth_stat === statKey,
            });
        }
    }
}

// ── Debt Pressure: graduated stat effects from debt-to-GDP ratio ──
var DEBT_PRESSURE_TIERS_CLIENT = [
    { maxRatio: 0.60, label: 'Healthy',     color: '#4ade80', effects: {} },
    { maxRatio: 0.80, label: 'Elevated',    color: '#a3e635', effects: { interest_rates: 0.05 } },
    { maxRatio: 1.00, label: 'Concerning',  color: '#fbbf24', effects: { interest_rates: 0.1, foreign_investment: -0.1, currency_strength: -0.05 } },
    { maxRatio: 1.50, label: 'Dangerous',   color: '#f97316', effects: { interest_rates: 0.2, foreign_investment: -0.2, currency_strength: -0.15 } },
    { maxRatio: 2.00, label: 'Severe',      color: '#ef4444', effects: { interest_rates: 0.4, foreign_investment: -0.4, currency_strength: -0.3 } },
    { maxRatio: Infinity, label: 'Crisis',  color: '#f43f5e', effects: { interest_rates: 0.7, foreign_investment: -0.7, currency_strength: -0.5 } },
];

function parseDebtPressureEffects(nation, map) {
    var debt = Number(nation.debt || 0);
    var gdp = Number(nation.gdp || 0);
    if (gdp <= 0 || debt <= 0) return;
    var ratio = debt / gdp;

    var tier = DEBT_PRESSURE_TIERS_CLIENT[0];
    for (var i = 0; i < DEBT_PRESSURE_TIERS_CLIENT.length; i++) {
        if (ratio <= DEBT_PRESSURE_TIERS_CLIENT[i].maxRatio) { tier = DEBT_PRESSURE_TIERS_CLIENT[i]; break; }
    }

    // Only show entries for stats that have nonzero effects at this tier
    var effects = tier.effects;
    var pctLabel = Math.round(ratio * 100) + '% Debt-to-GDP';
    for (var statKey in effects) {
        if (!effects.hasOwnProperty(statKey)) continue;
        var delta = effects[statKey];
        if (delta === 0) continue;
        var dir = delta > 0 ? 'up' : 'down';
        // interest_rates going UP is bad; foreign_investment/currency going DOWN is bad
        // So for display: interest_rates up = red arrow, others down = red arrow
        addEffectToMap(map, statKey, pctLabel, dir, 'Debt Pressure', Math.abs(delta), null, {
            tierLabel: tier.label,
            tierColor: tier.color,
            isDebtPressure: true,
        });
    }
}

// Stats known to be affected by the trade system engine each tick
var TRADE_AFFECTED_STATS = {
    gdp_growth: 'Trade Balance',
    currency_strength: 'Trade Balance',
    inflation: 'Import Prices',
    unemployment: 'Trade Displacement'
};

function parseTradeSystemEffects(nation, map) {
    for (var statKey in TRADE_AFFECTED_STATS) {
        if (!TRADE_AFFECTED_STATS.hasOwnProperty(statKey)) continue;
        var label = TRADE_AFFECTED_STATS[statKey];
        // We can't compute the exact direction without replicating the trade engine,
        // but we can detect the direction from the per-tick delta if available
        var dir = 'up';
        if (previousTickData && previousTickData[statKey] != null && nation[statKey] != null) {
            var delta = Number(nation[statKey]) - Number(previousTickData[statKey]);
            if (Math.abs(delta) >= 0.01) {
                dir = delta > 0 ? 'up' : 'down';
            } else {
                continue; // no measurable trade effect this tick
            }
        } else {
            continue; // no delta data, don't show speculative effect
        }
        addEffectToMap(map, statKey, label, dir, 'Trade');
    }
}

function parseDecayEffects(nation, map) {
    for (var statKey in STAT_DECAY_CONFIG) {
        if (!STAT_DECAY_CONFIG.hasOwnProperty(statKey)) continue;
        var config = STAT_DECAY_CONFIG[statKey];
        var currentVal = nation[statKey] !== undefined && nation[statKey] !== null ? Number(nation[statKey]) : 50;
        if (currentVal === config.target) continue;
        var dir = currentVal > config.target ? 'down' : 'up';
        var label = config.type === 'erosion' ? 'Natural Erosion' : 'Natural Decay';
        addEffectToMap(map, statKey, label, dir, 'Decay');
    }
}

// ===== End Affected-By Data Fetching =====

function calculateRanking(statKey, value, inverted = false) {
    if (value === null || value === undefined) return null;
    const values = allNations.map(n => n[statKey]).filter(v => v !== null && v !== undefined);
    if (values.length === 0) return null;
    // Count how many nations are strictly better (handles ties correctly)
    const betterCount = values.filter(v => inverted ? v < value : v > value).length;
    return betterCount + 1;
}

function prettyStatName(key) {
    return key.replace(/_/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
}

async function getShardTick() {
    var cached = qCache('shard_current_tick');
    if (cached) return cached;
    var res = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    if (res.data) { qCacheSet('shard_current_tick', res.data.current_tick, 30 * 1000); return res.data.current_tick; }
    return 0;
}

async function renderRevolutionBanner(nation) {
    var currentTick = await getShardTick();
    var revRows = await _supabase
        .from('event_log')
        .select('fired_at_tick, description_used')
        .eq('nation_id', nation.id)
        .eq('event_name', 'DEMOCRATIC_REVOLUTION')
        .order('fired_at_tick', { ascending: false })
        .limit(1);
    var revData = (revRows.data && revRows.data.length > 0) ? revRows.data[0] : null;
    if (revData && (currentTick - revData.fired_at_tick) <= 5) {
        var electionTick = revData.fired_at_tick + 3;
        var ticksUntilElection = Math.max(0, electionTick - currentTick);
        var h = '<div class="revolution-complete-banner">';
        h += '<div class="revolution-banner__title">Revolution in the Streets!</div>';
        h += '<div class="revolution-banner__subtitle">' + escapeHtml(revData.description_used) + '</div>';
        h += '<div class="revolution-banner__tags">';
        if (ticksUntilElection > 0) {
            h += '<span class="revolution-tag revolution-tag--green">Emergency Elections in ' + ticksUntilElection + ' tick' + (ticksUntilElection !== 1 ? 's' : '') + '</span>';
        } else {
            h += '<span class="revolution-tag revolution-tag--green">Elections Complete</span>';
        }
        h += '<span class="revolution-tag revolution-tag--green">Democracy Established</span></div></div>';
        return h;
    }
    if (isAutocracy(nation) && nation.revolution_started_tick != null && nation.revolution_duration != null) {
        var elapsed = currentTick - nation.revolution_started_tick;
        var remaining = Math.max(0, nation.revolution_duration - elapsed);
        var h = '<div class="revolution-banner">';
        h += '<div class="revolution-banner__title">Democratic Revolution</div>';
        h += '<div class="revolution-banner__subtitle">The people demand democracy. Pro-democracy protests grow stronger each day.</div>';
        h += '<div class="revolution-banner__countdown">' + remaining + ' tick' + (remaining !== 1 ? 's' : '') + ' until revolution</div>';
        h += '</div>';
        return h;
    }
    return '';
}

// ===== DISPLAY HELPERS =====

function formatGdpGrowth(rawValue) {
    var v = Number(rawValue ?? 50);
    var pct = (v - 50) / 50;
    return (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
}

function formatTradeBalance(rawValue) {
    var v = Math.round(Number(rawValue ?? 50));
    var expPct = v, impPct = 100 - v;
    if (impPct === 0) return '100% Exports';
    if (expPct === 0) return '100% Imports';
    if (expPct === impPct) return 'Balanced';
    return expPct + '% Exp / ' + impPct + '% Imp';
}

// Detect GDP/debt stored as 0-100 stat scores instead of raw dollars
var RAW_DOLLAR_KEYS = { gdp: true, debt: true };
function isMisscaledMonetary(key, val) {
    return RAW_DOLLAR_KEYS[key] && val != null && Number(val) >= 0 && Number(val) <= 100000;
}

function formatUnemploymentPct(stat) {
    return (0.7 + (stat - 1) * 34.3 / 99).toFixed(1) + '%';
}

function getDisplayValue(stat, nation) {
    var raw = nation[stat.key];
    var format = stat.format;
    if (raw === null || raw === undefined) return 'N/A';
    if (format === 'gdp' || format === 'currency') {
        assertRawEconomicValue(raw, stat.key);
    }
    if ((format === 'gdp' || format === 'currency') && isMisscaledMonetary(stat.key, raw)) {
        return '$' + Math.round(Number(raw));
    }
    if (format === 'count') return formatNumber(raw);
    if (format === 'gdp' || format === 'currency') return formatCurrencyShort(scaleRawToDollars(raw));
    if (format === 'gdpgrowth') return formatGdpGrowth(raw);
    if (format === 'trade') return formatTradeBalance(raw);
    if (format === 'inflation') return formatInflationRate(raw);
    if (format === 'fuel') return formatFuelPrice(raw, nation.currency_strength, nation.inflation);
    if (format === 'years') return (Math.round(Number(raw) * 10) / 10) + ' yrs';
    if (format === 'unemployment') return formatUnemploymentPct(Number(raw));
    return Math.round(Number(raw) * 10) / 10;
}

function buildFeaturedSparkSVG(data, color, w, h) {
    w = w || 200; h = h || 50;
    if (!data || data.length < 2) return '';
    var mn = Math.min.apply(null, data), mx = Math.max.apply(null, data), r = mx - mn || 1;
    var pts = data.map(function(v, i) {
        return ((i / (data.length - 1)) * w).toFixed(1) + ',' + (h - ((v - mn) / r) * h).toFixed(1);
    }).join(' ');
    // Build a filled area polygon
    var firstY = (h - ((data[0] - mn) / r) * h).toFixed(1);
    var lastX = w.toFixed(1);
    var lastY = (h - ((data[data.length - 1] - mn) / r) * h).toFixed(1);
    var areaPts = '0,' + h + ' 0,' + firstY + ' ' + pts + ' ' + lastX + ',' + h;
    return '<svg width="' + w + '" height="' + h + '" style="display:block;width:100%;height:100%;" preserveAspectRatio="none">' +
        '<polygon points="' + areaPts + '" fill="' + color + '" fill-opacity="0.08"/>' +
        '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="1.5" stroke-linejoin="round"/>' +
        '<circle cx="' + lastX + '" cy="' + lastY + '" r="2" fill="' + color + '"/></svg>';
}

function buildFeaturedAbpHTML(statKey) {
    var effects = statEffectsByKey[statKey] || [];
    if (effects.length === 0) return '';
    var h = '<div class="featured-card__abp-title">Affected By</div>';
    for (var i = 0; i < effects.length; i++) {
        var eff = effects[i];
        var ext = eff.extras;
        var isInst = eff.type === 'Institution' && ext;
        var isDebtP = ext && ext.isDebtPressure;
        var hasTierColor = isInst || isDebtP;

        // Row class — collapsed institutions get warning background
        var rowClass = 'featured-card__abp-row';
        if (isInst && ext.isCollapsed) rowClass += ' featured-card__abp-row--collapsed';
        h += '<div class="' + rowClass + '">';

        // Name — collapsed gets warning icon prefix
        if (isInst && ext.isCollapsed) {
            h += '<span class="featured-card__abp-name"><span class="featured-card__abp-warn">&#9888;</span>' + escapeHtml(eff.name) + '</span>';
        } else {
            h += '<span class="featured-card__abp-name">' + escapeHtml(eff.name) + '</span>';
        }

        // Arrow and rate
        if (isInst && ext.isFullyFunded && !ext.hasGrowthEffect) {
            // Holding entry — flat indicator, no rate
            h += '<span class="featured-card__abp-arrow featured-card__abp-arrow--hold">&#9644;</span>';
        } else {
            var arrow = eff.direction === 'up' ? '&#9650;' : '&#9660;';
            var arrowClass = eff.direction === 'up' ? 'featured-card__abp-arrow--up' : 'featured-card__abp-arrow--down';
            if (hasTierColor) arrowClass += ' featured-card__abp-arrow--inst';
            h += '<span class="featured-card__abp-arrow ' + arrowClass + '"' + (hasTierColor ? ' style="color:' + ext.tierColor + '"' : '') + '>' + arrow + '</span>';
        }

        if (eff.rate !== null && eff.rate !== undefined) {
            var sign = eff.direction === 'up' ? '+' : '-';
            var rateStyle = hasTierColor ? ' style="color:' + ext.tierColor + '"' : '';
            h += '<span class="featured-card__abp-rate"' + rateStyle + '>' + sign + (Math.round(Math.abs(Number(eff.rate)) * 100) / 100) + '/tick</span>';
        }

        // Type badge — institutions and debt pressure get tier-specific badges
        if (isInst) {
            h += '<span class="featured-card__abp-type featured-card__abp-type--institution" style="background:' + ext.tierColor + '18;color:' + ext.tierColor + '">' + escapeHtml(ext.tierLabel) + '</span>';
        } else if (isDebtP) {
            h += '<span class="featured-card__abp-type featured-card__abp-type--debt-pressure" style="background:' + ext.tierColor + '18;color:' + ext.tierColor + '">' + escapeHtml(ext.tierLabel) + '</span>';
        } else {
            var typeClass = 'featured-card__abp-type--' + eff.type.toLowerCase().replace(/ /g, '-');
            h += '<span class="featured-card__abp-type ' + typeClass + '">' + escapeHtml(eff.type) + '</span>';
        }

        if (eff.remainingTicks !== null && eff.remainingTicks !== undefined) {
            h += '<span class="featured-card__abp-ticks">' + eff.remainingTicks + ' tick' + (eff.remainingTicks !== 1 ? 's' : '') + '</span>';
        }
        h += '</div>';
    }
    return h;
}

function getGdpGrowthLabel(monthlyPct) {
    if (monthlyPct < -0.33) return 'Recession';
    if (monthlyPct < 0) return 'Stagnant';
    if (monthlyPct < 0.17) return 'No Growth';
    if (monthlyPct < 1) return 'Growing';
    return 'Booming';
}

function getGdpGrowthScaleItems(monthlyPct) {
    return [
        { label: 'Recession', range: '< -0.33%', active: monthlyPct < -0.33 },
        { label: 'Stagnant', range: '-0.33% to 0%', active: monthlyPct >= -0.33 && monthlyPct < 0 },
        { label: 'No Growth', range: '0% to 0.17%', active: monthlyPct >= 0 && monthlyPct < 0.17 },
        { label: 'Growing', range: '0.17% to 1%', active: monthlyPct >= 0.17 && monthlyPct < 1 },
        { label: 'Booming', range: '> 1%', active: monthlyPct >= 1 }
    ];
}

function buildRankingPipsHTML(rank, total) {
    if (!rank) return '';
    total = total || 6;
    var pipColor = rank <= 2 ? 'var(--n-green)' : rank <= 4 ? 'var(--n-yellow)' : 'var(--n-red)';
    var h = '<div class="compact-bottom__rank">';
    for (var i = 0; i < total; i++) {
        h += i < rank
            ? '<div class="compact-bottom__rank-pip" style="background:' + pipColor + ';"></div>'
            : '<div class="compact-bottom__rank-pip compact-bottom__rank-pip--empty"></div>';
    }
    h += '<span class="compact-bottom__rank-label">#' + rank + '</span></div>';
    return h;
}

function renderFeaturedGDP(nation) {
    var gdpRaw = nation.gdp ?? 0;

        var si = scaleItems[i];

    h += '<div class="cat-header' + (isOpen ? ' cat-header--open' : '') + '" data-cat="' + cat.id + '">';
    h += '<span class="cat-header__icon">' + cat.icon + '</span>';
    h += '<span class="cat-header__label" style="color:' + hc + ';">' + cat.label + '</span>';
    if (cat.blocs && cat.blocs.length > 0) {
        h += '<div class="cat-header__blocs">';
        for (var bi = 0; bi < cat.blocs.length; bi++) {
            h += '<span class="cat-header__bloc">' + escapeHtml(cat.blocs[bi]) + '</span>';
        }
        h += '</div>';
    }
    if (alerts > 0) {
        h += '<span class="cat-header__alert-badge">\u26A0 ' + alerts + '</span>';
    }
    h += '<div class="cat-header__health-bar"><div class="cat-header__health-fill" style="width:' + Math.min(hScore, 100) + '%;background:' + hc + ';"></div></div>';
    h += '<span class="cat-header__health-score" style="color:' + hc + ';">' + Math.round(hScore) + '</span>';
    h += '<span class="cat-header__chevron">\u25BC</span>';
    h += '</div>';

    // Body with featured grid
    h += '<div class="cat-body' + (isOpen ? ' cat-body--open' : '') + '" id="cat-body-' + cat.id + '">';
    h += '<div class="featured-grid">';
    for (var si = 0; si < cat.stats.length; si++) {
        var stat = cat.stats[si];
        if (FEATURED_RENDERERS[stat.key]) {
            h += FEATURED_RENDERERS[stat.key](nation);
        } else {
            h += renderFeaturedStatCard(stat, nation);
        }
    }
    h += '</div>';
    h += '</div>';
    h += '</div>';
    return h;
}

// ===== MAIN RENDER =====

async function renderNationPage(nation) {
    var h = '';
    // ---- Body ----
    h += '<div class="nation-body">';

    // Revolution banner
    h += await renderRevolutionBanner(nation);

    // ---- Category sections ----
    for (var ci = 0; ci < STAT_CATEGORIES.length; ci++) {
        h += renderFeaturedCategory(STAT_CATEGORIES[ci], nation);
    }

    h += '</div>'; // end nation-body
    document.getElementById('content-area').innerHTML = h;
    attachHandlers();
}

// ===== CLICK HANDLERS =====

function attachHandlers() {
    // Section toggles
    var headers = document.querySelectorAll('.cat-header[data-cat]');
    for (var i = 0; i < headers.length; i++) {
        headers[i].addEventListener('click', function() {
            toggleSection(this.getAttribute('data-cat'));
        });
    }
}


</script>
