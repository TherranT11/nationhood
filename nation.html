<script>
/**
 * Nation Page - Comprehensive Stats Display
 * With Rankings and Trend Arrows
 */

// All nations data for rankings
let allNations = [];
let totalNations = 0;
let previousTickData = null;

// Stats where LOWER is better (inverted coloring & trend arrows)
const INVERTED_STATS = [
    'unemployment', 'poverty_rate', 'income_inequality', 'death_rate',
    'pollution', 'carbon_emissions', 'crime_rate', 'incarceration_rate',
    'drug_use', 'corruption', 'polarization', 'civil_unrest', 'terrorism',
    'political_violence', 'emigration', 'sanctions', 'debt', 'debt_growth',
    'inflation', 'illegal_immigration', 'fuel_prices'
];

// Initialize page
initPage('nation', async (state) => {
    const { nation, faction } = state;
    
    if (!nation) {
        document.getElementById('content-area').innerHTML = `
            <div class="placeholder-panel">
                <div class="ph-icon">🏴</div>
                <h3>No Nation Selected</h3>
                <p>Your party is not assigned to a nation yet.</p>
            </div>
        `;
        return;
    }
    
    // Load all nations for rankings
    await loadAllNations();
    
    // Load previous tick data for trends
    await loadPreviousTickData(nation.id);
    
    await renderNationPage(nation);
});

/**
 * Load all nations for ranking comparisons
 */
async function loadAllNations() {
    const { data: nations, error } = await _supabase
        .from('nations')
        .select('*');
    
    if (!error && nations) {
        allNations = nations;
        totalNations = nations.length;
    }
}

/**
 * Load previous tick data for trend arrows
 */
async function loadPreviousTickData(nationId) {
    // Get current tick
    const { data: shard } = await _supabase
        .from('shard')
        .select('current_tick')
        .eq('name', 'Alpha Shard')
        .single();
    
    if (!shard) return;
    
    // Get previous tick's snapshot
    const previousTick = shard.current_tick - 1;
    if (previousTick < 0) return;
    
    const { data: history, error } = await _supabase
        .from('nations_history')
        .select('*')
        .eq('nation_id', nationId)
        .eq('tick', previousTick)
        .single();
    
    if (!error && history) {
        previousTickData = history;
    }
}

/**
 * Calculate ranking for a stat (1 = best)
 * @param {string} statKey - The stat column name
 * @param {number} value - Current nation's value
 * @param {boolean} inverted - If true, lower is better
 * @returns {number} Rank (1-indexed)
 */
function calculateRanking(statKey, value, inverted = false) {
    if (value === null || value === undefined) return null;
    
    const values = allNations
        .map(n => n[statKey])
        .filter(v => v !== null && v !== undefined);
    
    if (values.length === 0) return null;
    
    // Sort: for normal stats, higher is better (descending)
    // For inverted stats, lower is better (ascending)
    const sorted = [...values].sort((a, b) => inverted ? a - b : b - a);
    
    return sorted.indexOf(value) + 1;
}

/**
 * Get trend arrow for a stat
 * @param {string} statKey - The stat column name
 * @param {number} currentValue - Current value
 * @param {boolean} inverted - If true, lower is better
 * @returns {string} HTML for trend arrow
 */
function getTrendArrow(statKey, currentValue, inverted = false) {
    if (!previousTickData || currentValue === null || currentValue === undefined) {
        return '<span class="trend-arrow trend-neutral">―</span>';
    }
    
    // Handle case mismatch: nations table has "GDP" but history table has "gdp"
    const historyKey = statKey === 'GDP' ? 'gdp' : statKey;
    const previousValue = previousTickData[historyKey];
    if (previousValue === null || previousValue === undefined) {
        return '<span class="trend-arrow trend-neutral">―</span>';
    }
    
    const invertedClass = inverted ? ' inverted' : '';
    
    if (currentValue > previousValue) {
        return `<span class="trend-arrow trend-up${invertedClass}">▲</span>`;
    } else if (currentValue < previousValue) {
        return `<span class="trend-arrow trend-down${invertedClass}">▼</span>`;
    } else {
        return '<span class="trend-arrow trend-neutral">―</span>';
    }
}

/**
 * Render a single stat box with ranking and trend
 */
function renderStatBox(name, statKey, value, description, format = null, inverted = false) {
    const displayValue = value ?? 'N/A';
    const numValue = parseInt(value) || 0;
    
    // Determine color class
    let colorClass = 'medium';
    if (value !== null && value !== undefined) {
        if (inverted) {
            // Lower is better
            if (numValue <= 30) colorClass = 'good';
            else if (numValue <= 60) colorClass = 'medium';
            else colorClass = 'bad';
        } else {
            // Higher is better
            if (numValue >= 70) colorClass = 'good';
            else if (numValue >= 40) colorClass = 'medium';
            else colorClass = 'bad';
        }
    }
    
    // Format the display value
    let formattedValue = displayValue;
    if (format === 'currency' && typeof value === 'number') {
        formattedValue = '$' + value + 'B';
    } else if (format === 'years' && typeof value === 'number') {
        formattedValue = value + ' yrs';
    } else if (format === 'count' && typeof value === 'number') {
        formattedValue = value;
    } else if (typeof value === 'number') {
        formattedValue = value;
    }
    
    // Get trend arrow
    const trendArrow = getTrendArrow(statKey, value, inverted);
    
    // Get ranking
    const rank = calculateRanking(statKey, value, inverted);
    const rankDisplay = rank ? `#${rank} of ${totalNations}` : '';
    const rankClass = rank === 1 ? 'first' : '';
    
    return `
        <div class="stat-box ${colorClass}">
            <div class="stat-box-header">
                <span class="stat-box-name">${name}</span>
                <span class="stat-box-value ${colorClass}">
                    ${formattedValue}
                    ${trendArrow}
                </span>
            </div>
            <div class="stat-box-desc">${description}</div>
            ${rankDisplay ? `<div class="stat-box-footer"><span class="ranking-badge ${rankClass}">${rankDisplay}</span></div>` : ''}
        </div>
    `;
}

/**
 * Render voter axis bar
 */
function renderVoterAxis(leftLabel, leftValue, rightLabel) {
    const leftPct = leftValue ?? 50;
    const rightPct = 100 - leftPct;
    
    return `
        <div class="voter-axis">
            <div class="voter-axis-header">
                <span class="voter-axis-left">${leftLabel}</span>
                <span class="voter-axis-right">${rightLabel}</span>
            </div>
            <div class="voter-bar-container">
                <div class="voter-bar-left" style="width: ${leftPct}%">${leftPct}%</div>
                <div class="voter-bar-right">${rightPct}%</div>
            </div>
        </div>
    `;
}

/**
 * Format population with commas
 */
function formatPopulation(pop) {
    if (!pop) return 'N/A';
    return Number(pop).toLocaleString();
}

/**
 * Format GDP as billions
 */
function formatGDP(gdp) {
    if (!gdp) return 'N/A';
    return '$' + gdp + 'B';
}
</script>
