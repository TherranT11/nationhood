<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@400&family=Spectral:wght@300;400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#0F1417; --ink2:#151C20; --line:#33413F;
    --vellum:#E6E0D0; --vellum-dim:#9AA39B;
    --brass:#C8A15A; --seal:#9B3B33; --ocean:#132C3C;
    --display:'Grenze Gotisch','Iowan Old Style',Georgia,serif;
    --body:'Spectral','Iowan Old Style',Georgia,serif;
    --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { background:var(--ink); color:var(--vellum); font-family:var(--body); display:flex; flex-direction:column; }
  :focus-visible { outline:1px solid var(--brass); outline-offset:2px; }

  /* Header — crest + realm identity, Log out on the right. */
  .topbar { flex:0 0 auto; background:var(--ink); border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:11px 22px; }
  .brand-left { display:flex; align-items:center; gap:15px; min-width:0; }
  .brand-crest { flex:0 0 auto; }
  .brand-text { min-width:0; }
  .realm { font-family:var(--display); font-size:24px; line-height:1.05; color:var(--vellum); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sub { font-family:var(--mono); font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--vellum-dim); margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .logout { flex:0 0 auto; font-family:var(--mono); font-size:11px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--vellum-dim); background:none; border:1px solid var(--line); padding:9px 18px; cursor:pointer;
    transition:border-color 160ms ease, color 160ms ease; }
  .logout:hover { border-color:var(--seal); color:var(--vellum); }

  /* Resource strip — labels now; values arrive with a resource system. */
  .resources { display:flex; background:var(--ink2); border-top:1px solid var(--line); }
  .res { flex:1 1 0; min-width:0; padding:9px 22px; border-right:1px solid var(--line); }
  .res:last-child { border-right:none; }
  .res-k { font-family:var(--mono); font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:var(--vellum-dim); }
  .res-v { font-family:var(--mono); font-size:14px; color:var(--vellum); margin-top:5px; }

  /* Working area — console on the left, the world map box on the right half. */
  .main { flex:1 1 auto; display:flex; min-height:0; }
  .console { flex:1 1 50%; min-width:0; display:flex; align-items:center; justify-content:center;
    padding:32px; background:var(--ink); }
  .console-note { font-family:var(--mono); font-size:12px; letter-spacing:0.08em; color:var(--vellum-dim); text-align:center; }

  .mapbox { flex:1 1 50%; min-width:0; position:relative; overflow:hidden; background:var(--ocean); border-left:1px solid var(--line); }
  .wmap { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  .wmap.dragging { cursor:grabbing; }

  .zoom { position:absolute; right:14px; bottom:14px; display:flex; flex-direction:column; gap:6px; z-index:2; }
  .zoom button { width:34px; height:34px; font-family:var(--mono); font-size:16px; line-height:1; color:var(--vellum);
    background:rgba(15,20,23,0.82); border:1px solid var(--line); cursor:pointer;
    transition:border-color 140ms ease, color 140ms ease; }
  .zoom button:hover { border-color:var(--brass); color:var(--brass); }

  .stage-note { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:12px; letter-spacing:0.08em; color:var(--vellum-dim); text-align:center; padding:24px; }

  @media (max-width:900px) {
    .main { flex-direction:column; }
    .console { flex:0 0 auto; padding:22px; }
    .mapbox { flex:1 1 auto; min-height:60vh; border-left:none; border-top:1px solid var(--line); }
    .realm { font-size:19px; }
    .res { padding:9px 12px; }
    .resources { overflow-x:auto; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="brand-left">
        <svg class="brand-crest" width="34" height="37" viewBox="23 4 154 168" fill="none" aria-hidden="true">
          <path d="M100 10 L169 48 L169 124 L100 162 L31 124 L31 48 Z" stroke="#C8A15A" stroke-width="5" stroke-linejoin="round"/>
          <path d="M100 29 L152 58 L152 116 L100 145 L48 116 L48 58 Z" stroke="#8A6E3C" stroke-width="2" stroke-linejoin="round"/>
          <path d="M71 101 L77 75 L88 89 L100 66 L112 89 L123 75 L129 101 Z" fill="#C8A15A"/>
          <circle cx="77" cy="72" r="4.5" fill="#C8A15A"/>
          <circle cx="100" cy="62" r="5" fill="#C8A15A"/>
          <circle cx="123" cy="72" r="4.5" fill="#C8A15A"/>
          <path d="M100 111 L111 122 L100 133 L89 122 Z" fill="#C8A15A"/>
        </svg>
        <div class="brand-text">
          <div class="realm" id="realm">&nbsp;</div>
          <div class="sub" id="sub">&nbsp;</div>
        </div>
      </div>
      <button class="logout" id="logout">Log out</button>
    </div>

    <div class="resources">
      <div class="res"><div class="res-k">Coin</div><div class="res-v">—</div></div>
      <div class="res"><div class="res-k">Grain</div><div class="res-v">—</div></div>
      <div class="res"><div class="res-k">Stone</div><div class="res-v">—</div></div>
      <div class="res"><div class="res-k">Iron</div><div class="res-v">—</div></div>
      <div class="res"><div class="res-k">Levies</div><div class="res-v">—</div></div>
      <div class="res"><div class="res-k">Subjects</div><div class="res-v">—</div></div>
    </div>
  </div>

  <div class="main">
    <div class="console">
      <div class="console-note" id="console-note">Your realm's affairs will appear here.</div>
    </div>

    <div class="mapbox">
      <svg class="wmap" id="wmap" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMin meet" aria-label="World map">
        <defs>
          <pattern id="swell" width="120" height="60" patternUnits="userSpaceOnUse">
            <path d="M0 30 q30 -10 60 0 t60 0" fill="none" stroke="#2E5468" stroke-width="1" opacity="0.22"/>
          </pattern>
        </defs>
        <rect width="1200" height="800" fill="#132C3C"/>
        <rect width="1200" height="800" fill="url(#swell)"/>
        <g id="wdyn"></g>
      </svg>
      <div class="zoom" id="zoom" hidden>
        <button id="zin" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="zout" title="Zoom out" aria-label="Zoom out">−</button>
        <button id="zreset" title="Reset view" aria-label="Reset view">⤢</button>
      </div>
      <div class="stage-note" id="stage-note" hidden></div>
    </div>
  </div>

  <script type="module">
    import { currentUser, currentNation, signOut, loadWorldMap } from '../supabase.js';
    import { PEOPLES, SIDE_LABEL } from '../peoples.js';
    import { renderTerrain, renderSettlements } from '../worldmap.js';

    const $ = (id) => document.getElementById(id);

    // Gate: signed in AND founded. Otherwise send them where they belong.
    (async () => {
      const user = await currentUser();
      if (!user) { window.location.href = '/login/'; return; }
      const { data: nation, error: nationErr } = await currentNation();
      // A load error is not the same as "not founded" — don't misroute to /found.
      if (nationErr) { $('console-note').textContent = 'Your realm could not be loaded. Please refresh.'; return; }
      if (!nation) { window.location.href = '/found/'; return; }

      const P = PEOPLES[nation.people] || {};
      // e.g. "Ordane" / "HUMAN KINGDOM · FORCES OF GOOD · VERREN"
      $('realm').textContent = nation.realm;
      $('sub').textContent = [P.name, SIDE_LABEL[nation.side], nation.house].filter(Boolean).join(' · ');
      document.title = nation.realm + ' — Nationhood';

      drawStage(nation);
    })();

    // Render the world map into the map box, with this ruler's capital renamed to
    // their chosen name and marked "you are here". Only the player's own nation is
    // known (RLS), so other slots keep their authored map names. On success, wire
    // up zoom/pan; on failure, show a note in place of the map.
    async function drawStage(nation) {
      const note = $('stage-note');
      const showNote = (t) => { $('wmap').hidden = true; note.textContent = t; note.hidden = false; };
      try {
        const { data: row, error } = await loadWorldMap();
        if (error) return showNote('The world map could not be loaded.');

        const map = row && row.data;
        if (!map || !(map.settlements || []).length) return showNote('The cartographers have not yet charted the world.');

        const placed = nation.capital_slot && map.settlements.some((s) => s.id === nation.capital_slot);
        const names = placed ? { [nation.capital_slot]: nation.capital } : {};
        $('wdyn').innerHTML =
          renderTerrain(map) + renderSettlements(map, { highlightId: placed ? nation.capital_slot : null, names });
        enablePanZoom();
      } catch (err) {
        showNote('The world map could not be loaded.');
      }
    }

    // Pan/zoom over the map's viewBox. Clamped so the view never leaves the map:
    // zoom out stops at the full 1200×800, zoom in stops at 8×.
    function enablePanZoom() {
      const wmap = $('wmap');
      const BW = 1200, BH = 800, MINW = BW / 8;
      const view = { x: 0, y: 0, w: BW, h: BH };

      const apply = () => wmap.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
      const clamp = () => {
        view.w = Math.min(BW, Math.max(MINW, view.w));
        view.h = view.w * (BH / BW);
        view.x = Math.min(BW - view.w, Math.max(0, view.x));
        view.y = Math.min(BH - view.h, Math.max(0, view.y));
      };
      // Uniform pixels-per-unit scale under xMidYMin meet (same on both axes).
      // The map top-aligns (offY = 0), matching the Cartographer's framing; any
      // horizontal slack is centred (xMid), so offX halves the leftover width.
      const rectScale = (r) => Math.min(r.width / view.w, r.height / view.h);
      const zoomAt = (clientX, clientY, factor) => {
        const r = wmap.getBoundingClientRect(), s = rectScale(r);
        if (!(s > 0)) return;
        const mx = view.x + (clientX - r.left - (r.width - view.w * s) / 2) / s;
        const my = view.y + (clientY - r.top) / s;
        const ratio = Math.min(BW, Math.max(MINW, view.w * factor)) / view.w;
        view.x = mx - (mx - view.x) * ratio;
        view.y = my - (my - view.y) * ratio;
        view.w = view.w * ratio;
        clamp(); apply();
      };

      wmap.addEventListener('wheel', (e) => {
        e.preventDefault();
        zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 0.85 : 1 / 0.85);
      }, { passive: false });

      let dragging = false, lastX = 0, lastY = 0;
      wmap.addEventListener('pointerdown', (e) => {
        dragging = true; lastX = e.clientX; lastY = e.clientY;
        try { wmap.setPointerCapture(e.pointerId); } catch (err) { /* capture unsupported — pan still tracks */ }
        wmap.classList.add('dragging');
      });
      wmap.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const s = rectScale(wmap.getBoundingClientRect());
        if (!(s > 0)) return;
        view.x -= (e.clientX - lastX) / s; view.y -= (e.clientY - lastY) / s;
        lastX = e.clientX; lastY = e.clientY;
        clamp(); apply();
      });
      const endDrag = (e) => {
        if (!dragging) return;
        dragging = false;
        try { wmap.releasePointerCapture(e.pointerId); } catch (err) { /* pointer already released */ }
        wmap.classList.remove('dragging');
      };
      wmap.addEventListener('pointerup', endDrag);
      wmap.addEventListener('pointercancel', endDrag);

      const centerZoom = (factor) => { const r = wmap.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, factor); };
      $('zin').addEventListener('click', () => centerZoom(0.7));
      $('zout').addEventListener('click', () => centerZoom(1 / 0.7));
      $('zreset').addEventListener('click', () => { view.x = 0; view.y = 0; view.w = BW; clamp(); apply(); });
      $('zoom').hidden = false;
    }

    const logoutBtn = $('logout');
    logoutBtn.addEventListener('click', async () => {
      if (logoutBtn.disabled) return;
      logoutBtn.disabled = true; logoutBtn.textContent = 'Departing…';
      try { await signOut(); } catch (err) { /* redirect regardless */ }
      window.location.href = '/';
    });
  </script>
</body>
</html>
