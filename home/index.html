<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/theme.js"></script>
<title>Main Menu · Nationhood Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;--surface:#FFFFFF;--ink:#111114;--muted:#5b5b63;--soft:#8d8d95;
    --line:#E4E2DD;--line2:#cfcfcf;--card:var(--surface);--chip:#F3F2EF;--discord:#5865f2;
    --indigo:#5546E8;--indigo-soft:#ECE9FD;
  }
  /* Dark mode: theme.js flips the shared tokens; these rules cover this page's
     own tokens, the literal-coloured "inverted" badges, and the card splashes. */
  html[data-theme="dark"] .mark{background:var(--indigo)}
  html[data-theme="dark"] .confirm-btn{background:var(--indigo)}
  html[data-theme="dark"] .card__ico{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100%;display:flex;flex-direction:column}

  /* navbar: same bar as the rest of the site, in its signed-in state */
  header{border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:64px;max-width:900px;margin:0 auto;width:100%;padding:0 22px}
  .brand{font-weight:800;font-size:19px;letter-spacing:-0.02em}
  .nav-actions{display:flex;align-items:center;gap:10px}
  .gamedate{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--indigo);background:var(--indigo-soft);border-radius:999px;padding:8px 14px;white-space:nowrap}
  .btn{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;padding:9px 16px;border-radius:999px;border:1px solid transparent;cursor:pointer;font-family:inherit;transition:background .15s,border-color .15s,opacity .15s;white-space:nowrap}
  .btn-ghost{border-color:var(--line);color:var(--ink);background:var(--card)}
  .btn-ghost:hover{border-color:var(--line2)}
  .btn-discord{background:var(--discord);color:#fff}
  .btn-discord:hover{background:#4752c4}
  .btn[disabled]{opacity:.55;cursor:default}

  .shell{flex:1;display:flex;flex-direction:column;max-width:900px;margin:0 auto;width:100%;padding:18px 22px 40px}

  .hero{text-align:center;padding:42px 0 30px}
  .mark{width:60px;height:60px;border-radius:15px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;background:var(--ink)}
  .mark svg{width:33px;height:33px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .hero h1{font-weight:900;font-size:clamp(36px,8vw,60px);letter-spacing:-.03em;line-height:1;color:var(--ink)}
  .hero .eyebrow{font-family:'Space Mono',monospace;font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);margin-top:14px}

  .menu{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  @media(max-width:640px){.menu{grid-template-columns:1fr}}

  /* base card: black text, white bg; --accent set per card for the splash */
  .card{--accent:#111114;--tint:#F3F2EF;position:relative;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:24px 22px;cursor:pointer;color:var(--ink);transition:transform .16s,border-color .18s,box-shadow .2s;overflow:hidden;font-family:inherit}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--accent);opacity:0;transition:opacity .2s}
  .card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 18px 42px -20px color-mix(in srgb, var(--accent) 55%, transparent)}
  .card:hover::before{opacity:1}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .card__ico{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--tint);border:1px solid color-mix(in srgb, var(--accent) 30%, transparent);color:var(--accent);margin-bottom:16px}
  .card__ico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .card h2{font-weight:800;font-size:23px;letter-spacing:-.02em;color:var(--ink)}
  .card p{color:var(--muted);font-size:15px;margin-top:8px;line-height:1.5;max-width:34ch}
  .card .go{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-top:16px;display:inline-flex;align-items:center;gap:6px}
  .tag{position:absolute;top:18px;right:18px;font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 11px;border-radius:20px;font-weight:700}
  .tag.start{color:#fff;background:var(--accent)}
  .tag.live,.tag.progress{color:var(--accent);border:1.5px solid color-mix(in srgb, var(--accent) 50%, transparent);display:flex;align-items:center;gap:6px;font-weight:700}
  .tag.live .pd,.tag.progress .pd{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.8s infinite}
  .tag.lock{color:var(--accent);border:1.5px solid color-mix(in srgb, var(--accent) 50%, transparent);display:flex;align-items:center;gap:5px;font-weight:700}
  .tag.lock svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .card.sub{padding:20px}
  .card.sub h2{font-size:19px}
  .card.sub .card__ico{width:40px;height:40px;margin-bottom:13px}

  /* disabled card: greyed out, not yet playable */
  .card:disabled{opacity:.45;cursor:not-allowed}
  .card:disabled:hover{transform:none;border-color:var(--line);box-shadow:none}
  .card:disabled:hover::before{opacity:0}

  .foot{margin-top:auto;padding-top:28px;text-align:center;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.08em;color:var(--soft)}
  .foot a{color:var(--ink);text-decoration:none}.foot a:hover{text-decoration:underline}

  /* selected tutorial card */
  .card.sel{border-color:var(--accent)}

  /* confirm bar: slides up once Tutorial is chosen */
  .confirm-bar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);transform:translateY(100%);pointer-events:none;transition:transform .28s}
  .confirm-bar.show{transform:translateY(0);pointer-events:auto}
  .confirm-in{max-width:900px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  .confirm-label{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.04em;color:var(--muted)}
  .confirm-label b{color:var(--ink);font-weight:700}
  .confirm-btn{background:var(--ink);color:#fff;font-weight:700;font-size:15px;border:1.5px solid transparent;border-radius:11px;padding:11px 22px;cursor:pointer;font-family:inherit;transition:filter .15s,transform .12s,opacity .15s}
  .confirm-btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
  .confirm-btn[disabled]{opacity:.55;cursor:default}
  .confirm-btns{display:flex;gap:10px}
  .confirm-cancel{background:var(--card);border:1.5px solid var(--line);color:var(--ink);font-weight:700;font-size:15px;border-radius:11px;padding:11px 18px;cursor:pointer;font-family:inherit;transition:border-color .15s}
  .confirm-cancel:hover{border-color:var(--ink)}
  @media (max-width:560px){
    .nav{height:56px;padding:0 16px}
    .nav-actions{gap:8px}
    .gamedate{display:none}
    .btn{padding:8px 14px;font-size:13px}
    .shell{padding:16px 16px 40px}
    .confirm-in{padding:12px 16px}
    .confirm-btns{flex:1}
    .confirm-cancel,.confirm-btn{flex:1}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <header>
    <div class="nav">
      <div class="brand">Nationhood</div>
      <nav class="nav-actions">
        <a class="btn btn-discord" href="https://discord.gg/HBvWxJUm8" target="_blank" rel="noopener" aria-label="Join the Discord">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.369A19.79 19.79 0 0 0 16.558 3a13.6 13.6 0 0 0-.6 1.23 18.27 18.27 0 0 0-5.487 0A13.6 13.6 0 0 0 9.87 3a19.79 19.79 0 0 0-3.76 1.369C2.72 9.046 1.79 13.605 2.255 18.1a19.9 19.9 0 0 0 6.073 3.058c.49-.668.926-1.377 1.302-2.122a12.93 12.93 0 0 1-2.05-.978c.172-.126.34-.257.502-.392a14.2 14.2 0 0 0 12.036 0c.164.135.332.266.502.392-.654.386-1.343.714-2.052.98.376.743.812 1.452 1.302 2.12a19.86 19.86 0 0 0 6.075-3.058c.546-5.21-.93-9.728-3.93-13.73ZM9.682 15.33c-1.182 0-2.157-1.086-2.157-2.42 0-1.333.955-2.42 2.157-2.42 1.21 0 2.176 1.097 2.157 2.42 0 1.334-.955 2.42-2.157 2.42Zm4.636 0c-1.182 0-2.157-1.086-2.157-2.42 0-1.333.955-2.42 2.157-2.42 1.21 0 2.176 1.097 2.157 2.42 0 1.334-.946 2.42-2.157 2.42Z"/></svg>
          Discord
        </a>
        <button class="btn btn-ghost" id="logout" type="button">Log out</button>
        <span class="gamedate"></span>
      </nav>
    </div>
  </header>

  <div class="shell">
    <div class="hero">
      <div class="mark"><svg viewBox="0 0 24 24"><path d="M3 9l9-5 9 5"/><path d="M3 9h18M4 20h16M6 20v-9M10 20v-9M14 20v-9M18 20v-9"/></svg></div>
      <h1>Nationhood</h1>
      <div class="eyebrow">Choose your path</div>
    </div>

    <div class="menu">
      <button class="card" id="tutorial" style="--accent:#5546E8;--tint:#ECE9FD">
        <span class="tag start" id="tutorialTag">Start Here</span>
        <span class="card__ico"><svg viewBox="0 0 24 24"><path d="M5 3v18M5 4h11l-2 4 2 4H5"/></svg></span>
        <h2>Tutorial</h2>
        <p>Take power as the Front Sessau in 1980. Form a government, weather the energy shock, and learn to rule.</p>
        <span class="go" id="tutorialGo">Begin &rarr;</span>
      </button>

      <button class="card" id="online" style="--accent:#1f9d57;--tint:#E5F6EC">
        <span class="tag live"><span class="pd"></span>Live</span>
        <span class="card__ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></span>
        <h2>Join the Online Game</h2>
        <p>Enter the living world among thousands of real players. Found a party or a corporation, and make your mark.</p>
        <span class="go">Enter the world &rarr;</span>
      </button>

      <button class="card sub" style="--accent:#E8820E;--tint:#FCEFDD" disabled>
        <span class="card__ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></span>
        <h2>About</h2>
        <p>What Nationhood is, who's behind it, and how it all works.</p>
        <span class="go">Learn more &rarr;</span>
      </button>

      <button class="card sub" id="nationverse" style="--accent:#1f86d6;--tint:#E3F1FB">
        <span class="tag lock"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>Patreon</span>
        <span class="card__ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5"/><ellipse cx="12" cy="12" rx="11" ry="4.2" transform="rotate(-24 12 12)"/></svg></span>
        <h2>Join the Nationverse</h2>
        <p>Enter a thriving and persistent world and make your mark on history.</p>
        <span class="go">Enter &rarr;</span>
      </button>
    </div>

    <div class="foot">NATIONHOOD · nationhoodgame.com · <a href="https://discord.gg/HBvWxJUm8" target="_blank" rel="noopener">Join the Discord</a></div>
  </div>

  <div class="confirm-bar" id="confirm-bar">
    <div class="confirm-in">
      <span class="confirm-label" id="confirmLabel">Start the <b>Tutorial</b>?</span>
      <div class="confirm-btns">
        <button class="confirm-cancel" id="confirm-cancel" type="button">Cancel</button>
        <button class="confirm-btn" id="confirm-btn" type="button">Confirm?</button>
      </div>
    </div>
  </div>
<script type="module">
  import { requireUser, getTutorialProgress, logout } from '/tutorial/shell.js';
  import { mountGameDate } from '/gamedate.js';

  mountGameDate(document.querySelector('.gamedate')); // live game date (one source)

  // Guard + resume state: only signed-in players see this page, and the
  // Tutorial card shows "In Progress" once they've chosen a party.
  (async () => {
    const user = await requireUser();
    if (!user) return; // not signed in (redirected) or keys not configured
    const progress = await getTutorialProgress(user.id);
    if (!progress || !progress.party) return; // not started yet: leave defaults
    const tag = document.getElementById('tutorialTag');
    tag.className = 'tag progress';
    tag.innerHTML = '<span class="pd"></span>In Progress';
    document.getElementById('tutorialGo').innerHTML = 'Continue &rarr;';
    document.getElementById('confirmLabel').innerHTML = 'Continue the <b>Tutorial</b>?';
  })();

  // Tutorial: choosing it reveals the confirm bar; Confirm enters the tutorial.
  const tutorial = document.getElementById('tutorial');
  const confirmBar = document.getElementById('confirm-bar');
  const confirmBtn = document.getElementById('confirm-btn');
  tutorial.addEventListener('click', () => {
    tutorial.classList.add('sel');
    confirmBar.classList.add('show');
  });
  document.getElementById('confirm-cancel').addEventListener('click', () => {
    confirmBar.classList.remove('show');
    tutorial.classList.remove('sel');
  });
  let starting = false; // loading lock: blocks double-fire
  confirmBtn.addEventListener('click', () => {
    if (starting) return;
    starting = true;
    confirmBtn.disabled = true;
    window.location.href = '/tutorial/';
  });

  // Log out (shared logic in shell.js).
  document.getElementById('logout').addEventListener('click', logout);

  // Join the Online Game → the rules gate.
  document.getElementById('online').addEventListener('click', () => {
    window.location.href = '/startup/';
  });

  // Join the Nationverse → code gate. Prompts for the access code on EVERY click (a Patreon-perk
  // ceremony, not real access control — the code lives in this file, viewable in source, and the
  // world is also reachable from the Online Game card).
  const ACCESS_CODE = 'patreon1';                       // compared lowercased + trimmed
  let nvBusy = false;                                   // loading lock: blocks double-fire
  document.getElementById('nationverse').addEventListener('click', () => {
    if (nvBusy) return;
    const entered = window.prompt('Enter your access code to join the Nationverse:');
    if (entered == null) return;                        // cancelled
    if (entered.trim().toLowerCase() === ACCESS_CODE) {
      nvBusy = true;
      window.location.href = '/startup/?nv=1';           // marks the rules gate as the Nationverse flow
    } else {
      window.alert('That code isn’t right. Access is a Patreon perk — check there for the current code.');
    }
  });
</script>
</body>
</html>
