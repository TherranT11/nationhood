<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@400&family=Spectral:wght@300;400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink2:#151C20; --line:#33413F;
    --vellum:#E6E0D0; --vellum-dim:#9AA39B;
    --brass:#C8A15A; --brass-dim:#8A6E3C; --seal:#9B3B33; --ocean:#132C3C;
    --display:'Grenze Gotisch','Iowan Old Style',Georgia,serif;
    --body:'Spectral','Iowan Old Style',Georgia,serif;
    --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { background:var(--ocean); color:var(--vellum); font-family:var(--body); display:flex; flex-direction:column; }
  :focus-visible { outline:1px solid var(--brass); outline-offset:2px; }

  /* Top bar: realm identity + game date on the left, log out on the right. */
  .topbar { flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:12px 20px; background:var(--ink2); border-bottom:1px solid var(--line); }
  .ident { display:flex; align-items:baseline; gap:11px; min-width:0; overflow:hidden; white-space:nowrap; }
  .i-realm { font-family:var(--display); font-size:22px; line-height:1; color:var(--vellum); }
  .i-sep { color:var(--brass-dim); }
  .i-dyn { font-style:italic; font-size:14px; color:var(--brass); }
  .i-pipe { color:var(--line); margin:0 3px; }
  .i-time { font-family:var(--mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--vellum-dim); }

  .logout { flex:0 0 auto; font-family:var(--mono); font-size:11px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--vellum-dim); background:none; border:1px solid var(--line); padding:9px 18px; cursor:pointer;
    transition:border-color 160ms ease, color 160ms ease; }
  .logout:hover { border-color:var(--seal); color:var(--vellum); }

  /* Stage: the world map is the canvas the game will be built on. */
  .stage { flex:1 1 auto; position:relative; overflow:hidden; background:var(--ocean); }
  .wmap { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .stage-note { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:12px; letter-spacing:0.08em; color:var(--vellum-dim); text-align:center; padding:24px; }

  @media (max-width:560px) { .i-realm { font-size:18px; } }
</style>
</head>
<body>
  <div class="topbar">
    <div class="ident" id="ident" hidden>
      <span class="i-realm" id="i-realm"></span>
      <span class="i-sep">·</span>
      <span class="i-dyn" id="i-dyn"></span>
      <span class="i-pipe">|</span>
      <span class="i-time" id="i-date"></span>
      <span class="i-pipe">|</span>
      <span class="i-time" id="i-season"></span>
    </div>
    <button class="logout" id="logout">Log out</button>
  </div>

  <div class="stage">
    <svg class="wmap" id="wmap" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet" aria-label="World map">
      <defs>
        <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
          <path d="M50 0 H0 V50" fill="none" stroke="#33413F" stroke-width="0.5" opacity="0.28"/>
        </pattern>
        <pattern id="swell" width="120" height="60" patternUnits="userSpaceOnUse">
          <path d="M0 30 q30 -10 60 0 t60 0" fill="none" stroke="#2E5468" stroke-width="1" opacity="0.22"/>
        </pattern>
      </defs>
      <rect width="1200" height="800" fill="#132C3C"/>
      <rect width="1200" height="800" fill="url(#swell)"/>
      <g id="wdyn"></g>
    </svg>
    <div class="stage-note" id="stage-note" hidden></div>
  </div>

  <script type="module">
    import { currentUser, currentNation, signOut, loadWorldMap } from '../supabase.js';
    import { PEOPLES } from '../peoples.js';
    import { renderTerrain, renderSettlements } from '../worldmap.js';

    // Game date — static for now. There is no tick/clock backend yet; these are
    // the single source for the displayed date until one exists.
    const GAME_YEAR = '846 S.A.';
    const GAME_SEASON = 'Early Spring';

    const $ = (id) => document.getElementById(id);

    // Gate: signed in AND founded. Otherwise send them where they belong.
    (async () => {
      const user = await currentUser();
      if (!user) { window.location.href = '/login/'; return; }
      const { data: nation } = await currentNation();
      if (!nation) { window.location.href = '/found/'; return; }

      const P = PEOPLES[nation.people];
      $('i-realm').textContent = nation.realm;                 // e.g. Marrowgate
      $('i-dyn').textContent = P.lineage + ' ' + nation.house; // e.g. House of Calloway
      $('i-date').textContent = GAME_YEAR;
      $('i-season').textContent = GAME_SEASON;
      $('ident').hidden = false;
      document.title = nation.realm + ' — Nationhood';

      drawStage(nation);
    })();

    // Render the world map as the stage canvas, with this ruler's capital renamed
    // to their chosen name and marked "you are here". Only the player's own nation
    // is known (RLS), so other slots keep their authored map names.
    async function drawStage(nation) {
      const wmap = $('wmap'), note = $('stage-note');
      const showNote = (t) => { wmap.hidden = true; note.textContent = t; note.hidden = false; };
      try {
        const { data: row, error } = await loadWorldMap();
        if (error) return showNote('The world map could not be loaded.');

        const map = row && row.data;
        if (!map || !(map.settlements || []).length) return showNote('The cartographers have not yet charted the world.');

        const placed = nation.capital_slot && map.settlements.some((s) => s.id === nation.capital_slot);
        const names = placed ? { [nation.capital_slot]: nation.capital } : {};
        $('wdyn').innerHTML =
          renderTerrain(map) + renderSettlements(map, { highlightId: placed ? nation.capital_slot : null, names });
      } catch (err) {
        showNote('The world map could not be loaded.');
      }
    }

    const logoutBtn = $('logout');
    logoutBtn.addEventListener('click', async () => {
      if (logoutBtn.disabled) return;
      logoutBtn.disabled = true; logoutBtn.textContent = 'Departing…';
      try { await signOut(); } catch (err) { /* redirect regardless */ }
      window.location.href = '/';
    });
  </script>
</body>
</html>
