<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nationhood — Events</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Shared Styles -->
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/civic.css">
</head>
<body>

<!-- ===== TOP BAR (rendered by common.js) ===== -->
<div id="top-bar"></div>

<!-- ===== CONTENT AREA ===== -->
<div id="content-area">
    <div id="civic-root" style="min-height:400px;"></div>
</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { initPage } from './js/common.js';
import './js/guide.js';
import { initCivic } from './js/civic.js';

initPage('events', async (state) => {
    const { faction, nation, shard } = state;
    const currentTick = shard?.current_tick || 0;
    await initCivic(_supabase, nation.id, faction.id, currentTick, nation.name, faction.abbreviation);
});
</script>

</body>
</html>
