<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Cruceran | Nationhood Alpha</title>
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/events.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="top-bar"></div>

<!-- Newspaper content injected here by JS -->
<div id="newspaper-root">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;">
    <div class="loading-container">
      <div class="loading-spinner"></div>
      <div style="color:var(--text-secondary)">Loading The Cruceran...</div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════
     WRITE OP-ED — NEWSPAPER-STYLE EDITOR
     ═══════════════════════════════════════════════════ -->
<div class="np-oped-overlay" id="oped-modal">
  <div class="np-oped-editor">

    <!-- Editor Header -->
    <div class="np-oped-editor__header">
      <div class="np-oped-editor__header-left">
        <div class="np-oped-editor__section-tag">Opinion</div>
        <div class="np-oped-editor__title">Letters to the Editor</div>
      </div>
      <div class="np-oped-editor__header-right">
        <div class="np-oped-editor__cost">
          <span class="np-oped-editor__cost-icon">&#9998;</span>
          <span>1 Action Point</span>
        </div>
        <button class="np-oped-editor__close" id="oped-close-btn" title="Close">&times;</button>
      </div>
    </div>

    <!-- Decorative rule -->
    <div class="np-oped-editor__rule"></div>

    <!-- Two-column layout: Editor + Preview -->
    <div class="np-oped-editor__body">

      <!-- Left: Form -->
      <div class="np-oped-editor__form">
        <div class="np-oped-editor__field">
          <label class="np-oped-editor__label">Headline</label>
          <input type="text" id="oped-headline" class="np-oped-editor__headline-input"
                 placeholder="A bold opinion deserves a bold headline..."
                 maxlength="120" autocomplete="off">
          <div class="np-oped-editor__charcount"><span id="oped-headline-count">0</span> / 120</div>
        </div>

        <div class="np-oped-editor__field">
          <label class="np-oped-editor__label">Your Argument</label>
          <textarea id="oped-body" class="np-oped-editor__body-input"
                    placeholder="State your party's position. Make your case to the citizens. The Cruceran editorial board will review all submissions for the next edition..."
                    maxlength="800" rows="10"></textarea>
          <div class="np-oped-editor__charcount"><span id="oped-body-count">0</span> / 800</div>
        </div>

        <div class="np-oped-editor__field">
          <label class="np-oped-editor__label">Section</label>
          <select id="oped-topic" class="np-oped-editor__topic-select">
            <option value="domestic">Domestic Policy</option>
            <option value="economy">Economy &amp; Finance</option>
            <option value="international">International Affairs</option>
            <option value="defence">Defence &amp; Security</option>
            <option value="society">Society &amp; Culture</option>
          </select>
        </div>
      </div>

      <!-- Right: Live Preview -->
      <div class="np-oped-editor__preview-pane">
        <div class="np-oped-editor__preview-masthead">
          <div class="np-oped-editor__preview-masthead-pre">Preview</div>
          <div class="np-oped-editor__preview-masthead-title">THE CRUCERAN</div>
          <div class="np-oped-editor__preview-masthead-sub">Opinion Section</div>
        </div>
        <div class="np-oped-editor__preview-card" id="oped-preview-content">
          <div class="np-opinion-card" style="margin:0;border:none;background:transparent;padding:0;">
            <div class="np-opinion-card__label">Opinion</div>
            <h3 class="np-opinion-card__headline">Your headline will appear here...</h3>
            <p class="np-opinion-card__body" style="color:var(--np-text-light);font-style:italic;">Start writing to see how your op-ed will look in The Cruceran.</p>
            <div class="np-opinion-card__author">— Your Party</div>
          </div>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="np-oped-editor__footer">
      <div class="np-oped-editor__error" id="oped-error"></div>
      <div class="np-oped-editor__footer-actions">
        <button class="np-oped-editor__btn-cancel" id="oped-cancel-btn">Discard</button>
        <button class="np-oped-editor__btn-submit" id="oped-submit-btn" disabled>
          <span class="np-oped-editor__btn-submit-text">Submit to Editor</span>
          <span class="np-oped-editor__btn-submit-cost">1 AP</span>
        </button>
      </div>
    </div>

  </div>
</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { initPage } from './js/common.js';
import { escapeHtml, tickToDate } from './js/utils.js';
import { deductAP, generateArticle, EVENT_TYPES } from './js/game-common.js';

/* ══════════════════════════════════════════════════════
   PRIORITY CONSTANTS
   ══════════════════════════════════════════════════════ */
const PRIORITY = {
  WAR: 1,
  CRISIS: 2,
  GOVERNMENT: 3,
  LEGISLATION: 4,
  ECONOMY: 5,
  DIPLOMACY: 6,
  GENERAL: 7,
  OPED: 8
};

const PRIORITY_LABELS = {
  [PRIORITY.WAR]: { tag: 'War Declaration', cls: 'tag--crisis', size: 'hero' },
  [PRIORITY.CRISIS]: { tag: 'Crisis Event', cls: 'tag--crisis', size: 'hero' },
  [PRIORITY.GOVERNMENT]: { tag: 'Government', cls: 'tag--domestic', size: 'featured' },
  [PRIORITY.LEGISLATION]: { tag: 'Legislation', cls: 'tag--domestic', size: 'standard' },
  [PRIORITY.ECONOMY]: { tag: 'Economy', cls: 'tag--economy', size: 'standard' },
  [PRIORITY.DIPLOMACY]: { tag: 'International', cls: 'tag--international', size: 'standard' },
  [PRIORITY.GENERAL]: { tag: 'General', cls: 'tag--defence', size: 'brief' },
  [PRIORITY.OPED]: { tag: 'Opinion', cls: 'tag--opinion', size: 'oped' }
};

/* ══════════════════════════════════════════════════════
   CATEGORY MAPPING (from event_log categories)
   ══════════════════════════════════════════════════════ */
function eventCategoryToPriority(category) {
  if (!category) return PRIORITY.GENERAL;
  const c = category.toLowerCase();
  if (c.includes('war') || c.includes('conflict')) return PRIORITY.WAR;
  if (c.includes('crisis') || c === 'natural_disaster' || c === 'natural-disaster') return PRIORITY.CRISIS;
  if (c.includes('government') || c.includes('election') || c.includes('coalition') || c === 'electoral') return PRIORITY.GOVERNMENT;
  if (c.includes('legal') || c.includes('bill') || c.includes('law')) return PRIORITY.LEGISLATION;
  if (c.includes('econom') || c.includes('budget') || c.includes('trade')) return PRIORITY.ECONOMY;
  if (c.includes('diplom') || c.includes('international') || c.includes('military')) return PRIORITY.DIPLOMACY;
  return PRIORITY.GENERAL;
}

function categoryToSection(category) {
  if (!category) return 'domestic';
  const c = category.toLowerCase();
  if (c.includes('econom') || c.includes('budget') || c.includes('trade')) return 'economy';
  if (c.includes('diplom') || c.includes('international')) return 'international';
  if (c.includes('military') || c.includes('defence') || c.includes('defense') || c.includes('conflict') || c.includes('war')) return 'defence';
  if (c.includes('crisis') || c.includes('disaster')) return 'crisis';
  return 'domestic';
}

/* ══════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════ */
let _state = null;
let _events = [];
let _opeds = [];
let _nationName = 'Valdoria';
let _currentEdition = 'national';

/* ══════════════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════════════ */
initPage('events', async (state) => {
  _state = state;
  const { nation, faction, shard } = state;
  if (!nation) {
    document.getElementById('newspaper-root').innerHTML =
      '<div style="text-align:center;padding:80px 20px;color:#888;">' +
      '<div style="font-size:2rem;margin-bottom:12px;">No Nation</div>' +
      '<div>Your party is not assigned to a nation yet.</div></div>';
    return;
  }

  _nationName = nation.name || 'Valdoria';

  // Load events, campaign actions, op-eds, and parties in parallel
  const [events, campaignActions, opeds, parties] = await Promise.all([
    loadEvents(nation.id, shard),
    loadCampaignActions(nation.id, shard),
    loadOpEds(nation.id, shard),
    loadParties(nation.id)
  ]);

  _events = events;
  _opeds = opeds;

  // Generate rich articles from templates
  const articles = buildArticles(events, campaignActions, _nationName);

  renderNewspaper(nation, faction, shard, articles, opeds, parties);
  setupOpEdModal(faction, nation, shard);
});

/* ══════════════════════════════════════════════════════
   DATA LOADING
   ══════════════════════════════════════════════════════ */
async function loadEvents(nationId, shard) {
  const currentTick = shard?.current_tick || 0;
  const { data, error } = await _supabase
    .from('event_log')
    .select('*')
    .eq('nation_id', nationId)
    .order('fired_at_tick', { ascending: false })
    .limit(50);
  if (error) { console.error('Failed to load events:', error); return []; }
  return (data || []).map(e => ({
    ...e,
    // Normalize column names for render functions
    headline: e.event_name || '',
    description: e.description_chosen || '',
    tick: e.fired_at_tick,
    effects: e.effects_applied || null,
    priority: eventCategoryToPriority(e.category),
    section: categoryToSection(e.category),
    isCurrent: e.fired_at_tick === currentTick || e.fired_at_tick === currentTick - 1
  }));
}

async function loadOpEds(nationId, shard) {
  // op_eds table may not exist yet — gracefully handle
  try {
    // Try new schema FK (author_faction_id → factions) first
    let { data, error } = await _supabase
      .from('op_eds')
      .select('*, factions!author_faction_id(faction_name, abbreviation, party_color)')
      .eq('nation_id', nationId)
      .order('created_at', { ascending: false })
      .limit(20);
    if (error) {
      // Fallback: old schema FK (faction_id → factions)
      const res = await _supabase
        .from('op_eds')
        .select('*, factions(faction_name, abbreviation, party_color)')
        .eq('nation_id', nationId)
        .order('created_at', { ascending: false })
        .limit(20);
      if (res.error) {
        console.warn('op_eds table not found (run migration):', res.error.message);
        return [];
      }
      data = res.data;
    }
    return data || [];
  } catch {
    return [];
  }
}

async function loadParties(nationId) {
  const { data } = await _supabase
    .from('factions')
    .select('id, faction_name, abbreviation, seats, approval_rating, party_color, party_logo, action_points')
    .eq('nation_id', nationId)
    .eq('faction_type', 'party');
  return data || [];
}

async function loadCampaignActions(nationId, shard) {
  const currentTick = shard?.current_tick || 0;
  try {
    const { data, error } = await _supabase
      .from('campaign_actions')
      .select('*, factions:party_id(faction_name, abbreviation)')
      .eq('nation_id', nationId)
      .gte('tick_performed', Math.max(0, currentTick - 20))
      .order('tick_performed', { ascending: false })
      .limit(30);
    if (error) { console.warn('campaign_actions load failed:', error.message); return []; }
    return data || [];
  } catch { return []; }
}

/* ══════════════════════════════════════════════════════
   VALDORIAN TEMPLATE ENGINE — MAP RAW DATA → ARTICLES
   ══════════════════════════════════════════════════════ */

/**
 * Map a campaign_action row to a Valdorian event object.
 * Covers all 9 action_types: attack, rally, outreach, press_conference,
 * make_promise, steward_mobilize, steward_detected_mobilize,
 * coalition_detected, no_confidence_failed, party_disbanded.
 */
function campaignActionToEvent(action, nationName) {
  const r = action.result || {};
  const partyName = action.factions?.faction_name || r.faction_name || 'A party';
  const tick = action.tick_performed || 0;
  const totalEffect = (r.effects || []).reduce((s, e) => s + Math.abs(e.value || 0), 0);

  switch (action.action_type) {
    case 'attack':
      return {
        event_type: 'attack_campaign',
        section: 'politics', tier: 2,
        topic_tags: ['campaign', 'attack'],
        party_name: partyName,
        target_name: r.targetName || 'the opposition',
        vector_name: r.vectorName || 'political record',
        outcome: r.outcomeId || 'effective',
        outcome_name: r.outcomeName || 'Effective',
        nation_name: nationName, tick, _source: action,
      };
    case 'rally':
      return {
        event_type: 'rally',
        section: 'politics', tier: 2,
        topic_tags: ['campaign', 'rally'],
        party_name: partyName,
        subject_name: r.blocName || 'national issues',
        bloc_name: r.blocName || '',
        ideology_tag: (r.tags || [])[0] || '',
        momentum_change: totalEffect,
        blocs_alienated: 0,
        nation_name: nationName, tick, _source: action,
      };
    case 'outreach':
      return {
        event_type: 'voter_outreach',
        section: 'politics', tier: 3,
        topic_tags: ['campaign', 'outreach'],
        party_name: partyName,
        bloc_name: r.blocName || 'voters',
        effect: totalEffect,
        nation_name: nationName, tick, _source: action,
      };
    case 'press_conference':
      return {
        event_type: 'press_conference',
        section: 'politics', tier: 2,
        topic_tags: ['campaign'],
        party_name: partyName,
        leader_name: r.leaderName || partyName,
        subject_name: r.subject || 'policy',
        momentum_change: r.momentumChange || totalEffect,
        nation_name: nationName, tick, _source: action,
      };
    case 'make_promise':
      return {
        event_type: 'issue_statement',
        section: 'politics', tier: 3,
        topic_tags: ['campaign', 'promise'],
        party_name: partyName,
        subject_name: r.demandText || r.promiseType || 'a key policy issue',
        promise_type: r.promiseType || '',
        deadline_ticks: r.deadlineTicks || 0,
        bloc_name: (r.affectedBlocNames || []).join(', ') || '',
        nation_name: nationName, tick, _source: action,
      };
    case 'steward_mobilize':
      return {
        event_type: 'voter_outreach',
        section: 'politics', tier: 3,
        topic_tags: ['steward', 'mobilize'],
        party_name: partyName,
        bloc_name: r.bloc_name || 'supporters',
        effect: r.legitimacy_change || r.standing_change || 0,
        nation_name: nationName, tick, _source: action,
      };
    case 'steward_detected_mobilize':
      return {
        event_type: 'scandal',
        section: 'politics', tier: 1,
        topic_tags: ['steward', 'scandal'],
        party_name: r.faction_name || partyName,
        leader_name: r.steward_name || 'A party operative',
        scandal_type: 'covert mobilization',
        severity: 'major',
        nation_name: nationName, tick, _source: action,
      };
    case 'coalition_detected':
      return {
        event_type: 'scandal',
        section: 'politics', tier: 1,
        topic_tags: ['coalition', 'scandal'],
        party_name: r.faction_a_name || 'Unknown',
        target_name: r.faction_b_name || 'Unknown',
        leader_name: r.faction_a_name || 'Party leaders',
        scandal_type: 'secret coalition',
        severity: 'major',
        nation_name: nationName, tick, _source: action,
      };
    case 'no_confidence_failed':
      return {
        event_type: 'no_confidence',
        section: 'politics', tier: 1,
        topic_tags: ['government', 'no_confidence'],
        party_name: partyName,
        pm_name: r.pm_name || 'the Prime Minister',
        votes_for: r.votes_for || 0,
        votes_against: r.votes_against || 0,
        outcome: 'failed',
        nation_name: nationName, tick, _source: action,
      };
    case 'party_disbanded':
      return {
        event_type: 'coalition_collapsed',
        section: 'politics', tier: 1,
        topic_tags: ['party', 'disbanded'],
        party_name: r.faction_name || partyName,
        reason: r.reason || 'inactivity',
        nation_name: nationName, tick, _source: action,
      };
    default:
      return null;
  }
}

/**
 * Map an event_log row to a Valdorian event object.
 * Comprehensively maps all advance-tick event_name patterns to the
 * 61 Valdorian EVENT_TYPES.
 */
function eventLogToEvent(entry, nationName) {
  const name = (entry.event_name || '').toUpperCase();
  const rawName = entry.event_name || '';
  const cat = (entry.category || '').toLowerCase();
  const desc = entry.description_used || entry.description_chosen || '';
  const tick = entry.fired_at_tick || 0;
  const effects = entry.effects_applied || {};

  let event_type = null;

  // ── CRISIS EVENTS ──
  if (name.includes('CRISIS_STARTED') && name.includes('SOVEREIGN')) event_type = 'debt_crisis';
  else if (name.includes('SOVEREIGN DEFAULT') || name.includes('SOVEREIGN_DEFAULT')) event_type = 'sovereign_default';
  else if (name.includes('DEFAULT') && name.includes('CONTAGION')) event_type = 'sovereign_default';
  else if (name.includes('DEFAULT') && name.includes('RESOLUTION')) event_type = 'sovereign_default';
  else if (name.includes('CRISIS_STARTED') && name.includes('SHUTDOWN')) event_type = 'government_shutdown';
  else if (name.includes('CRISIS_RESOLVED') && name.includes('SHUTDOWN')) event_type = 'crisis_resolved';
  else if (name.includes('CRISIS_STARTED')) event_type = 'crisis_started';
  else if (name.includes('CRISIS_RESOLVED')) event_type = 'crisis_resolved';
  // Revolution events → crisis_ongoing
  else if (name.includes('REVOLUTION_WARNING') || name.includes('REVOLUTION_ESCALATION')) event_type = 'crisis_ongoing';
  else if (name.includes('DEMOCRATIC_REVOLUTION')) event_type = 'crisis_started';
  else if (name.includes('REVOLUTION_AVERTED')) event_type = 'crisis_resolved';
  // Shutdown without CRISIS_ prefix
  else if (name.includes('SHUTDOWN')) event_type = 'government_shutdown';
  // Currency / hyperinflation
  else if (name.includes('CURRENCY') && name.includes('COLLAPSE')) event_type = 'currency_collapse';
  else if (name.includes('HYPERINFLATION')) event_type = 'hyperinflation';
  // Ministry crisis
  else if (name.includes('MINISTRY') && name.includes('CRISIS')) event_type = 'ministry_crisis';

  // ── GOVERNMENT EVENTS ──
  else if (name.includes('NO CONFIDENCE') && name.includes('FALL')) event_type = 'no_confidence';
  else if (name.includes('NO CONFIDENCE') && name.includes('FAIL')) event_type = 'no_confidence';
  else if (name.includes('NO CONFIDENCE')) event_type = 'no_confidence';
  else if (name.includes('COALITION') && name.includes('FORMED')) event_type = 'coalition_formed';
  else if (name.includes('COALITION') && (name.includes('COLLAPSE') || name.includes('DISSOLVE'))) event_type = 'coalition_collapsed';
  else if (name.includes('LEGISLATURE DISSOLVED')) event_type = 'election';
  else if (name.includes('SNAP') && name.includes('ELECTION')) event_type = 'election';
  else if (name.includes('FORMATION_WINDOW') || name.includes('FORMATION_DEADLINE')) event_type = 'election';
  else if (name.includes('FORMATION_SNAP')) event_type = 'election';
  else if (name.includes('EMERGENCY_MINORITY')) event_type = 'coalition_formed';
  else if (name.includes('ELECTION')) event_type = 'election';
  // Coup
  else if (name.includes('COUP')) event_type = 'coup_attempt';
  // Scandal
  else if (name.includes('SCANDAL')) event_type = 'scandal';
  // Party disbanded
  else if (name.includes('DISBANDED')) event_type = 'coalition_collapsed';

  // ── LEGISLATION ──
  else if (name.includes('BILL') && (name.includes('PASS') || name.includes('SIGNED'))) event_type = 'bill_vote_pass';
  else if (name.includes('BILL') && (name.includes('FAIL') || name.includes('REJECT'))) event_type = 'bill_vote_fail';
  else if (name.includes('BUDGET') && (name.includes('PASS') || name.includes('APPROVED'))) event_type = 'budget_vote';
  else if (name.includes('BUDGET') && name.includes('STALL')) event_type = 'default_budget_stall';

  // ── ECONOMY ──
  else if (name.includes('ECONOMIC') && name.includes('CRISIS')) event_type = 'economic_crisis';
  else if (name.includes('CENTRAL BANK') || name.includes('CENTRAL_BANK')) event_type = 'central_bank';
  else if (name.includes('MILESTONE')) event_type = 'stat_milestone';

  // ── DIPLOMACY & MILITARY ──
  else if (name.includes('WAR') && name.includes('FAIL')) event_type = 'war_failed';
  else if (name.includes('WAR')) event_type = 'war_declaration';
  else if (name.includes('PEACE')) event_type = 'peace_accepted';
  else if (name.includes('ALLIANCE')) event_type = 'alliance_signed';
  else if (name.includes('AMBASSADOR') && name.includes('RETIRE')) event_type = 'ambassador_recalled';
  else if (name.includes('AMBASSADOR')) event_type = 'ambassador_recalled';
  else if (name.includes('NEGOTIATION') || name.includes('DIPLOMATIC')) event_type = 'state_visit';
  else if (name.includes('TRADE')) event_type = 'trade_agreement';
  else if (name.includes('INTERNATIONAL ORG') || name.includes('IO_FOUNDED')) event_type = 'io_founded';
  else if (name.includes('PATROL')) event_type = 'military_patrol';
  else if (name.includes('EXERCISE') || name.includes('JOINT')) event_type = 'joint_exercises';

  // ── DEFAULT / DECAY EVENTS ──
  else if (name.includes('STAT') && name.includes('DECAY')) event_type = 'default_stat_decay';
  else if (name.includes('MOMENTUM') && (name.includes('DECAY') || name.includes('FADING'))) event_type = 'default_momentum_decay';
  else if (name.includes('INACTION')) event_type = 'default_inaction';

  // ── ENDORSEMENT ──
  else if (name.includes('ENDORSE')) event_type = 'endorsement';
  // ── FUNDRAISER ──
  else if (name.includes('FUNDRAIS') || name.includes('FUND_RAIS')) event_type = 'fundraiser';

  // ── Catch-all by category ──
  if (!event_type) {
    if (cat === 'crisis') event_type = 'crisis_ongoing';
    else if (cat === 'government' || cat === 'political') event_type = 'default_inaction';
    else if (cat === 'economy' || cat === 'economic') event_type = 'stat_milestone';
    else if (cat === 'diplomatic' || cat === 'diplomacy') event_type = 'state_visit';
    else if (cat === 'military') event_type = 'military_patrol';
  }

  if (!event_type) return null;
  const meta = EVENT_TYPES[event_type];
  if (!meta) return null;

  // Extract crisis/subject name from event_name (e.g., "CRISIS_STARTED: Government Shutdown" → "Government Shutdown")
  const subjectName = rawName.replace(/^(?:CRISIS_(?:STARTED|RESOLVED|ONGOING)|REVOLUTION_\w+|DEMOCRATIC_REVOLUTION):\s*/i, '').trim() || rawName;

  // Extract party name from description if available (e.g., "The Smith Government has fallen")
  const pmMatch = desc.match(/(?:the\s+)?(\w+)\s+Government/i);
  const pmName = effects.pm_last_name || (pmMatch ? pmMatch[1] : 'the Prime Minister');

  // Extract bill name
  const billMatch = desc.match(/(?:bill|act|law)\s+"?([^".,]+)"?/i);
  const billName = billMatch ? billMatch[1] : subjectName;

  return {
    event_type,
    section: meta.section,
    tier: meta.tier,
    topic_tags: [cat],
    nation_name: nationName,
    pm_name: pmName,
    crisis_name: subjectName,
    bill_name: billName,
    party_name: subjectName,
    target_name: subjectName,
    stat_name: subjectName,
    leader_name: pmName,
    bloc_name: '',
    subject_name: subjectName,
    description: desc,
    severity: meta.tier <= 1 ? 'severe' : 'moderate',
    outcome: name.includes('FAIL') ? 'failed' : name.includes('PASS') ? 'passed' : '',
    votes_for: effects.votes_for || 0,
    votes_against: effects.votes_against || 0,
    margin: Math.abs((effects.votes_for || 0) - (effects.votes_against || 0)),
    tick,
    _source: entry,
  };
}

/**
 * Convert raw data sources into Valdorian articles using the template engine.
 * Falls back to raw event formatting if no template matches.
 */
function buildArticles(events, campaignActions, nationName) {
  const valdorianEvents = [];

  // Map campaign actions
  for (const action of campaignActions) {
    const evt = campaignActionToEvent(action, nationName);
    if (evt) valdorianEvents.push(evt);
  }

  // Map event_log entries
  for (const entry of events) {
    const evt = eventLogToEvent(entry, nationName);
    if (evt) valdorianEvents.push(evt);
  }

  // Generate articles through the template engine
  const articles = [];
  for (const evt of valdorianEvents) {
    const article = generateArticle(evt);
    if (article) {
      // Carry over raw source data for fallback fields
      article._tick = evt.tick;
      article._source = evt._source;
      article._description = evt._source?.description_used || evt._source?.description_chosen || evt._source?.result?.headline || '';
      articles.push(article);
    }
  }

  // Also include event_log entries that didn't map to any template (raw format)
  const mappedEventIds = new Set(articles.filter(a => a._source?.id).map(a => a._source.id));
  for (const entry of events) {
    if (mappedEventIds.has(entry.id)) continue;
    articles.push({
      _isRaw: true,
      headline: entry.headline || entry.event_name || 'News Update',
      lede: entry.description || '',
      section: entry.section || 'domestic',
      tier: entry.priority || 3,
      _tick: entry.tick || entry.fired_at_tick || 0,
      _source: entry,
      topic_tags: [],
      body_paragraphs: [],
      quotes: [],
      byline: { reporter: 'The Cruceran Staff', time: '' },
    });
  }

  // Sort by tick (newest first), then by tier (most important first)
  articles.sort((a, b) => {
    if ((b._tick || 0) !== (a._tick || 0)) return (b._tick || 0) - (a._tick || 0);
    return (a.tier || 4) - (b.tier || 4);
  });

  return articles;
}

  <h1 class="np-masthead__title">THE CRUCERAN</h1>
  <div class="np-masthead__sub">The Paper for the World at Large</div>
  <button class="np-oped-btn" id="write-oped-btn" title="Write an Op-Ed (1 AP)">
    <span class="np-oped-btn__icon">&#9998;</span>

    <span class="np-oped-btn__cost">1 AP</span>

</header>

<!-- NAV TABS -->

  <div class="np-nav-tabs__item np-nav-tabs__item--active" data-tab="front">Front Page</div>
  <div class="np-nav-tabs__item" data-tab="domestic">Domestic</div>

function renderNoEvents() {

    <div style="text-align:center;padding:60px 20px;">

      </div>
    </div>
  `;
}

function renderHeroArticle(article) {
  const section = article.section || 'domestic';
  const sectionLabel = article.section_label || section.charAt(0).toUpperCase() + section.slice(1);
  const headline = article.headline || 'Breaking News';
  const lede = article.lede || article._description || '';
  const bodyParagraphs = article.body_paragraphs || [];
  const reporter = article.byline?.reporter || 'The Cruceran Staff';
  const quotes = article.quotes || [];

  return `
    <article class="np-hero">
      <div class="np-hero__tags">
        ${article.tier <= 1 ? '<span class="np-tag np-tag--crisis">Breaking</span>' : ''}
        <span class="np-tag np-tag--${section}" style="${article.section_color ? 'background:' + article.section_color + '22;color:' + article.section_color : ''}">${escapeHtml(sectionLabel)}</span>
        ${article.developing_story ? '<span class="np-tag" style="background:#ff980022;color:#ff9800;">Developing</span>' : ''}
      </div>
      <h2 class="np-hero__headline">${escapeHtml(headline)}</h2>
      ${article.subheadline ? `<div style="font-family:var(--np-font-serif);font-size:16px;color:var(--np-text-secondary);margin-top:4px;">${escapeHtml(article.subheadline)}</div>` : ''}
      ${lede ? `<p class="np-hero__lede">${escapeHtml(lede)}</p>` : ''}
      <div class="np-hero__byline">
        <strong>${escapeHtml(reporter)}</strong> · Tick ${article._tick || article.tick || '?'}
      </div>
      ${bodyParagraphs.length > 0 ? `
      <div class="np-hero__body">
        ${bodyParagraphs.map(p => `<p>${escapeHtml(p)}</p>`).join('')}
      </div>` : ''}
      ${quotes.length > 0 ? quotes.map(q => `
      <blockquote style="border-left:3px solid var(--np-accent-gold);margin:12px 0;padding:8px 16px;font-style:italic;color:var(--np-text-secondary);font-family:var(--np-font-serif);">
        ${escapeHtml(q.text || q)}
      </blockquote>`).join('') : ''}
    </article>
  `;
}

function renderImpactBox(effects) {
  let parsed = effects;
  if (typeof effects === 'string') {
    try { parsed = JSON.parse(effects); } catch { return ''; }
  }
  if (!parsed || typeof parsed !== 'object') return '';

  const entries = Object.entries(parsed);
  if (entries.length === 0) return '';

  return `
    <div class="np-hero__impact">
      <div class="np-hero__impact-title">Mechanical Impact — Your Nation</div>
      <div class="np-impact-grid">
        ${entries.map(([key, val]) => {
          const label = key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
          const num = parseFloat(val);
          const cls = num < 0 ? 'np-impact-row__value--negative' : num > 0 ? 'np-impact-row__value--positive' : 'np-impact-row__value--neutral';
          const arrow = num < 0 ? '&#9660;' : num > 0 ? '&#9650;' : '';
          return `
            <div class="np-impact-row">
              <span class="np-impact-row__label">${escapeHtml(label)}</span>
              <span class="np-impact-row__value ${cls}">${arrow} ${escapeHtml(String(val))}</span>
            </div>`;
        }).join('')}
      </div>
    </div>
  `;
}

function renderStoryCard(article) {
  const section = article.section || 'domestic';
  const sectionLabel = article.section_label || section.charAt(0).toUpperCase() + section.slice(1);
  const headline = article.headline || 'News Update';
  const lede = article.lede || article._description || '';
  const reporter = article.byline?.reporter || '';
  return `
    <article class="np-story-card">
      <div class="np-story-card__tags">
        <span class="np-tag np-tag--${section} np-tag--dot" style="${article.section_color ? 'background:' + article.section_color + '22;color:' + article.section_color : ''}">${escapeHtml(sectionLabel)}</span>
      </div>
      <h3 class="np-story-card__headline">${escapeHtml(headline)}</h3>
      ${lede ? `<p class="np-story-card__lede">${escapeHtml(lede.substring(0, 180))}${lede.length > 180 ? '...' : ''}</p>` : ''}
      <div class="np-story-card__meta">${reporter ? escapeHtml(reporter) + ' · ' : ''}Tick ${article._tick || article.tick || '?'}</div>
    </article>
  `;
}

function renderBrief(article) {
  const section = article.section || 'domestic';
  const sectionLabel = article.section_label || section.charAt(0).toUpperCase() + section.slice(1);
  const text = article.headline || 'Event';
  return `
    <li class="np-brief">
      ${escapeHtml(text)}
      <span class="np-tag np-tag--${section}">${escapeHtml(sectionLabel)}</span>
    </li>
  `;
}

function renderOpEdCard(oped) {
  const factionName = oped.factions?.faction_name || 'Anonymous';
  const abbr = oped.factions?.abbreviation || '?';
  return `
    <div class="np-opinion-card">
      <div class="np-opinion-card__label">Opinion</div>
      <h3 class="np-opinion-card__headline">${escapeHtml(oped.headline || 'Untitled')}</h3>
      <p class="np-opinion-card__body">${escapeHtml(oped.body || '')}</p>
      <div class="np-opinion-card__author">— ${escapeHtml(factionName)} (${escapeHtml(abbr)})</div>
    </div>
  `;
}

function renderArchive(articles, currentTick) {
  // Group articles by tick ranges (every 2 ticks = 1 edition)
  const editions = {};
  articles.forEach(a => {
    const tick = a._tick || a.tick || 0;
    const edKey = Math.floor(tick / 2) * 2;
    if (!editions[edKey]) editions[edKey] = [];
    editions[edKey].push(a);
  });

  const keys = Object.keys(editions).map(Number).sort((a, b) => b - a).slice(0, 5);
  if (keys.length === 0) {
    return '<div style="font-family:var(--np-font-ui);font-size:13px;color:var(--np-text-muted);padding:12px 0;">No previous editions yet.</div>';
  }

  return keys.map(k => {
    const items = editions[k];
    const dateRange = `Ticks ${k}–${k + 1}`;
    const headlines = items.slice(0, 3).map(a => a.headline || 'Event').join(' · ');
    return `
      <div class="np-archive-item">
        <div class="np-archive-item__header">${escapeHtml(dateRange)} — ${items.length} ${items.length === 1 ? 'story' : 'stories'}</div>
        <div class="np-archive-item__highlights">Highlights: ${escapeHtml(headlines)}</div>
      </div>
    `;
  }).join('');
}

function renderSidebarBulletin(articles) {
  const recent = articles.slice(0, 5);
  if (recent.length === 0) {
    return `
      <div class="np-sidebar-section">
        <div class="np-sidebar-section__title">Bulletin</div>
        <div style="font-family:var(--np-font-ui);font-size:13px;color:var(--np-text-muted);padding:12px 0;">No recent bulletins.</div>
      </div>
    `;
  }
  return `
    <div class="np-sidebar-section">
      <div class="np-sidebar-section__title">Bulletin</div>
      ${recent.map(a => {
        const section = a.section || 'domestic';
        const sectionLabel = a.section_label || section.charAt(0).toUpperCase() + section.slice(1);
        return `
          <div class="np-bulletin-item">
            <div class="np-bulletin-item__tags">
              <span class="np-tag np-tag--${section} np-tag--dot">${escapeHtml(sectionLabel)}</span>
            </div>
            <h4 class="np-bulletin-item__headline">${escapeHtml(a.headline || 'Event')}</h4>
            <div class="np-bulletin-item__time">Tick ${a._tick || a.tick || '?'}</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderSidebarStats(nation) {
  if (!nation) return '';
  const stats = [
    { label: 'Population', value: nation.population ? Number(nation.population).toLocaleString() : '—', arrow: '' },
    { label: 'GDP Growth', value: nation.gdp_growth != null ? nation.gdp_growth + '%' : '—', arrow: nation.gdp_growth > 0 ? 'up' : nation.gdp_growth < 0 ? 'down' : '' },
    { label: 'Unemployment', value: nation.unemployment != null ? nation.unemployment + '%' : '—', arrow: 'down' },
    { label: 'Stability', value: nation.stability != null ? String(nation.stability) : '—', arrow: nation.stability < 50 ? 'down' : '' },
  ];

  return `
    <div class="np-sidebar-section">
      <div class="np-sidebar-section__title">National Indicators</div>
      ${stats.map(s => `
        <div class="np-stat-row">
          <span class="np-stat-row__label">${escapeHtml(s.label)}</span>
          <span class="np-stat-row__value">
            ${escapeHtml(s.value)}
            ${s.arrow === 'up' ? '<span class="np-stat-row__arrow np-stat-row__arrow--up">&#9650;</span>' : ''}
            ${s.arrow === 'down' ? '<span class="np-stat-row__arrow np-stat-row__arrow--down">&#9660;</span>' : ''}
          </span>
        </div>
      `).join('')}
    </div>
  `;
}

function renderSidebarElection(parties, shard) {
  if (!parties || parties.length === 0) return '';

  const totalSeats = parties.reduce((sum, p) => sum + (p.seats || 0), 0) || 1;
  const sorted = [...parties].sort((a, b) => (b.seats || 0) - (a.seats || 0));

  return `
    <div class="np-sidebar-section">
      <div class="np-sidebar-section__title">Parliament Standings</div>
      ${sorted.map(p => {
        const pct = totalSeats > 0 ? ((p.seats || 0) / totalSeats * 100).toFixed(1) : '0.0';
        const color = p.party_color || '#666';
        return `
          <div class="np-poll-bar-group">
            <div class="np-poll-bar__header">
              <span class="np-poll-bar__name">${escapeHtml(p.abbreviation || p.faction_name || '?')}</span>
              <span class="np-poll-bar__value">${p.seats || 0} seats (${pct}%)</span>
            </div>
            <div class="np-poll-bar__track">
              <div class="np-poll-bar__fill" style="width:${pct}%;background:${color};"></div>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

/* ══════════════════════════════════════════════════════
   TAB FILTERING
   ══════════════════════════════════════════════════════ */
function filterByTab(tab, articles, opeds, sectionToTab) {
  const main = document.querySelector('.np-content__main');
  if (!main) return;

  if (tab === 'opinion') {
    main.innerHTML = `
      <div class="np-section-label">Op-Eds & Opinion</div>
      ${opeds.length > 0 ? opeds.map(o => renderOpEdCard(o)).join('') :
        '<div style="font-family:var(--np-font-ui);font-size:14px;color:var(--np-text-muted);padding:40px 0;text-align:center;">No op-eds published yet. Be the first to write one!</div>'}
    `;
    return;
  }

  let filtered = articles;
  if (tab !== 'front' && sectionToTab) {
    filtered = articles.filter(a => sectionToTab(a.section) === tab);
  }

  const hero = filtered[0];
  const rest = filtered.slice(1, 7);
  const briefs = filtered.slice(7, 15);

  main.innerHTML = `
    ${hero ? renderHeroArticle(hero) : renderNoEvents()}
    ${rest.length > 0 ? `
    <hr class="np-divider np-divider--heavy">
    <div class="np-section-label">More Stories</div>
    <div class="np-stories-grid">
      ${rest.map(a => renderStoryCard(a)).join('')}
    </div>` : ''}
    ${briefs.length > 0 ? `
    <hr class="np-divider">
    <div class="np-section-label">Briefs</div>
    <ul class="np-briefs-list">
      ${briefs.map(a => renderBrief(a)).join('')}
    </ul>` : ''}
  `;
}

/* ══════════════════════════════════════════════════════
   OP-ED MODAL
   ══════════════════════════════════════════════════════ */
let _opedModalInitialized = false;

function setupOpEdModal(faction, nation, shard) {
  // Prevent duplicate listeners — only bind once
  if (_opedModalInitialized) return;
  _opedModalInitialized = true;

  const modal = document.getElementById('oped-modal');
  const headline = document.getElementById('oped-headline');
  const bodyEl = document.getElementById('oped-body');
  const topic = document.getElementById('oped-topic');
  const submitBtn = document.getElementById('oped-submit-btn');
  const submitText = submitBtn.querySelector('.np-oped-editor__btn-submit-text');
  const cancelBtn = document.getElementById('oped-cancel-btn');
  const closeBtn = document.getElementById('oped-close-btn');
  const errorEl = document.getElementById('oped-error');
  const headlineCount = document.getElementById('oped-headline-count');
  const bodyCount = document.getElementById('oped-body-count');
  const previewContent = document.getElementById('oped-preview-content');

  function validate() {
    const h = headline.value.trim();
    const b = bodyEl.value.trim();
    submitBtn.disabled = h.length < 10 || b.length < 30;

    // Update char counts
    headlineCount.textContent = headline.value.length;
    bodyCount.textContent = bodyEl.value.length;

    // Update live preview
    previewContent.innerHTML = `
      <div class="np-opinion-card" style="margin:0;border:none;background:transparent;padding:0;">
        <div class="np-opinion-card__label">Opinion</div>
        <h3 class="np-opinion-card__headline">${escapeHtml(h || 'Your headline will appear here...')}</h3>
        <p class="np-opinion-card__body"${!b ? ' style="color:var(--np-text-light);font-style:italic;"' : ''}>${escapeHtml(b || 'Start writing to see how your op-ed will look in The Cruceran.')}</p>
        <div class="np-opinion-card__author">— ${escapeHtml(faction.faction_name || 'Your Party')} (${escapeHtml(faction.abbreviation || '?')})</div>
      </div>
    `;
  }

  headline.addEventListener('input', validate);
  bodyEl.addEventListener('input', validate);

  function openModal() {
    modal.classList.add('np-oped-overlay--open');
    document.body.style.overflow = 'hidden';
    headline.focus();
  }

  function closeModal() {
    modal.classList.remove('np-oped-overlay--open');
    document.body.style.overflow = '';
    errorEl.textContent = '';
    errorEl.classList.remove('np-oped-editor__error--visible');
  }

  cancelBtn.addEventListener('click', closeModal);
  closeBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

  // Expose openModal for the Write Op-Ed button (re-bound after each render)
  window._openOpEdModal = openModal;

  submitBtn.addEventListener('click', async () => {
    const h = headline.value.trim();
    const b = bodyEl.value.trim();
    const t = topic.value;

    if (h.length < 10) {
      errorEl.textContent = 'Headline must be at least 10 characters.';
      errorEl.classList.add('np-oped-editor__error--visible');
      return;
    }
    if (b.length < 30) {
      errorEl.textContent = 'Body must be at least 30 characters.';
      errorEl.classList.add('np-oped-editor__error--visible');
      return;
    }

    submitBtn.disabled = true;
    submitText.textContent = 'Submitting...';
    errorEl.classList.remove('np-oped-editor__error--visible');

    // Deduct 1 AP
    const apResult = await deductAP(_supabase, faction.id, 1);
    if (!apResult.success) {
      errorEl.textContent = apResult.error || 'Insufficient AP.';
      errorEl.classList.add('np-oped-editor__error--visible');
      submitBtn.disabled = false;
      submitText.textContent = 'Submit to Editor';
      return;
    }

    // Insert op-ed (supports both old and new schema via fallback)
    const leaderName = faction.leader_name || faction.faction_name || 'Anonymous';
    const nextTick = (shard?.current_tick || 0) + 1;
    let insertError = null;
    // Try new schema first (author_faction_id, section, published_tick, status)
    const { error: err1 } = await _supabase.from('op_eds').insert([{
      nation_id: nation.id,
      author_faction_id: faction.id,
      author_name: leaderName,
      headline: h,
      body: b,
      section: t,
      status: 'published',
      published_tick: nextTick,
      created_at: new Date().toISOString()
    }]);
    if (err1) {
      // Fallback: try old schema (faction_id, topic, publish_tick)
      const { error: err2 } = await _supabase.from('op_eds').insert([{
        nation_id: nation.id,
        faction_id: faction.id,
        headline: h,
        body: b,
        topic: t,
        publish_tick: nextTick,
        created_at: new Date().toISOString()
      }]);
      insertError = err2;
    }
    const error = insertError;

    if (error) {
      errorEl.textContent = 'Failed to publish: ' + error.message;
      errorEl.classList.add('np-oped-editor__error--visible');
      submitBtn.disabled = false;
      submitText.textContent = 'Submit to Editor';
      console.error('Op-ed insert failed:', error);
      return;
    }

    // Success — close modal and refresh
    closeModal();
    headline.value = '';
    bodyEl.value = '';
    headlineCount.textContent = '0';
    bodyCount.textContent = '0';
    submitText.textContent = 'Submit to Editor';
    validate(); // reset preview

    // Reload and re-render
    _opeds = await loadOpEds(nation.id, shard);
    const parties = await loadParties(nation.id);
    _events = await loadEvents(nation.id, shard);
    const campaignActions = await loadCampaignActions(nation.id, shard);
    const articles = buildArticles(_events, campaignActions, nation.name || 'Valdoria');
    renderNewspaper(nation, faction, shard, articles, _opeds, parties);
  });
}
</script>
</body>
</html>
