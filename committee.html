<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Committee</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --bg:#080808; --panel:#0d0d0d;
    --line:rgba(255,255,255,0.07); --txt:#d4d4d4; --mut:#888; --faint:#666;
    --comm:#c89070; --comm-dim:#5a3e2a; --comm-bright:#dba88c;
  }
  body { background:var(--bg); color:var(--txt); font-family:-apple-system,system-ui,sans-serif;
    min-height:100vh; }
  .content { max-width:1280px; margin:0 auto; padding:30px 22px; }

  .loading { padding:60px 22px; text-align:center; color:var(--faint); font-size:11px;
    letter-spacing:0.13em; }

  .crumb { font-size:9px; letter-spacing:0.13em; color:var(--faint); margin-bottom:16px; }
  .crumb a { color:var(--mut); text-decoration:none; }
  .crumb a:hover { color:#bbb; }
  .crumb .sep { margin:0 7px; color:#3a3a3a; }
  .crumb .here { color:var(--comm); }

  .comm-card { background:var(--panel); border:0.5px solid var(--line); border-radius:7px;
    overflow:hidden; border-left:3px solid var(--comm); }

  .ch-row { display:flex; align-items:flex-start; gap:14px; padding:16px 20px;
    border-bottom:0.5px solid var(--line); }
  .ch-badge { width:38px; height:38px; border-radius:5px; background:#0a0a0a;
    border:0.5px solid var(--comm-dim); color:var(--comm-bright);
    display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .ch-info { flex:1; min-width:0; }
  .ch-name { font-size:15px; font-weight:600; color:#fff; letter-spacing:-0.005em; line-height:1.3; }
  .ch-desc { font-size:10.5px; color:var(--mut); margin-top:4px; line-height:1.55; }
  .ch-stat { flex-shrink:0; text-align:right; font-size:9px; color:var(--mut); letter-spacing:0.04em; }
  .ch-stat-val { font-size:18px; color:#fff; font-weight:700; font-variant-numeric:tabular-nums;
    display:block; line-height:1; }
  .ch-stat-lab { font-size:8px; color:var(--faint); margin-top:3px; }

  .members { padding:16px 20px; border-bottom:0.5px solid var(--line); background:#0a0a0a; }
  .mem-lab { font-size:8.5px; letter-spacing:0.14em; color:var(--faint); font-weight:600;
    margin-bottom:12px; }
  .mem-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .mem { display:flex; flex-direction:column; align-items:center; text-align:center;
    padding:10px 8px; background:var(--panel); border:0.5px solid var(--line); border-radius:5px; }
  .mem.chair { border-color:var(--comm-dim); background:rgba(200,144,112,0.04); }
  .mem-badge { width:32px; height:32px; border-radius:50%; display:flex; align-items:center;
    justify-content:center; font-size:11px; font-weight:700; color:#fff; margin-bottom:7px;
    background:#1a1a1a; }
  .mem-role { font-size:7.5px; letter-spacing:0.14em; font-weight:700; margin-bottom:3px; }
  .mem.chair .mem-role { color:var(--comm-bright); }
  .mem:not(.chair) .mem-role { color:var(--faint); }
  .mem-name { font-size:10.5px; font-weight:600; color:#fff; line-height:1.3; margin-bottom:4px; }
  .mem-party { font-size:9px; color:var(--mut); letter-spacing:0.02em; }
  .mem-you { font-size:8px; letter-spacing:0.12em; font-weight:700; color:#5aafa5;
    margin-top:4px; }
  .mem-empty { grid-column:1 / -1; padding:18px 0; text-align:center; font-size:11px;
    color:var(--faint); font-style:italic; }

  .agenda { padding:16px 20px; border-bottom:0.5px solid var(--line); }
  .ag-head { display:flex; align-items:center; gap:11px; margin-bottom:11px; }
  .ag-lab { font-size:8.5px; letter-spacing:0.14em; color:var(--faint); font-weight:600; flex:1; }
  .ag-status { font-size:8px; letter-spacing:0.13em; font-weight:700; padding:3px 8px;
    border-radius:3px; background:#0d0d0d; color:var(--mut); border:0.5px solid var(--line); }
  .ag-empty { font-size:11px; color:var(--faint); font-style:italic; text-align:center;
    padding:18px 0; }

  .testimony { padding:16px 20px; border-bottom:0.5px solid var(--line); }
  .tm-head { display:flex; align-items:center; gap:11px; margin-bottom:11px; }
  .tm-lab { font-size:8.5px; letter-spacing:0.14em; color:var(--faint); font-weight:600; flex:1; }

  .chat { background:#080808; border:0.5px solid var(--line); border-radius:5px; overflow:hidden; }
  .chat-feed { min-height:140px; max-height:380px; overflow-y:auto; padding:12px 14px;
    display:flex; flex-direction:column; gap:9px; }
  .chat-empty { padding:24px 0; text-align:center; font-size:11px; color:var(--faint);
    font-style:italic; }
  .chat-input { padding:11px 14px; border-top:0.5px solid var(--line); background:#0a0a0a;
    display:flex; align-items:center; gap:11px; }
  .input-disabled { flex:1; font-size:10px; color:var(--faint); font-style:italic; padding:9px 12px;
    background:#080808; border:0.5px dashed var(--line); border-radius:4px; text-align:center; }
  .input-disabled strong { color:var(--mut); font-style:normal; }
  .input-disabled a { color:var(--comm); text-decoration:none; }
  .input-disabled a:hover { color:var(--comm-bright); }

  .actions { padding:16px 20px; }
  .ac-lab { font-size:8.5px; letter-spacing:0.14em; color:var(--faint); font-weight:600;
    margin-bottom:10px; }
  .ac-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
  .act-btn { background:#0a0a0a; border:0.5px solid var(--line); border-radius:5px;
    padding:13px 14px; text-align:left; display:flex; flex-direction:column; gap:5px;
    transition:all 0.15s; cursor:not-allowed; opacity:0.5; }
  .act-btn.enabled { cursor:pointer; opacity:1; }
  .act-btn.enabled:hover { background:#101010; border-color:var(--comm-dim); }
  .act-btn.enabled:hover .act-name { color:var(--comm-bright); }
  .act-head { display:flex; align-items:center; gap:8px; }
  .act-ic { font-size:13px; color:var(--comm-bright); flex-shrink:0; }
  .act-name { font-size:11px; font-weight:600; color:#fff; letter-spacing:0.04em; flex:1; }
  .act-desc { font-size:9.5px; color:var(--mut); line-height:1.5; }

  .activities { padding:16px 20px; border-top:0.5px solid var(--line); background:#0a0a0a; }
  .av-lab { font-size:8.5px; letter-spacing:0.14em; color:var(--faint); font-weight:600;
    margin-bottom:11px; }
  .av-empty { font-size:11px; color:var(--faint); font-style:italic; text-align:center;
    padding:18px 0; }

  .upcoming { padding:16px 20px; border-top:0.5px solid var(--line); }
  .up-lab { font-size:8.5px; letter-spacing:0.14em; color:var(--faint); font-weight:600;
    margin-bottom:11px; }
  .up-empty { font-size:11px; color:var(--faint); font-style:italic; text-align:center;
    padding:18px 0; }

  /* Proposed-law row in Upcoming Agenda. Brass-on-deep matches the
     drafting modal so a proposal looks like the same artifact in
     either place. */
  .up-row { background:#0d0a07; border:0.5px solid #2a2218; border-left:2px solid #c8a26e;
    border-radius:4px; padding:10px 14px; margin-bottom:8px; display:flex; align-items:center; gap:14px; }
  .up-row:last-child { margin-bottom:0; }
  .up-cat { font-size:8px; letter-spacing:0.14em; color:#dcb88a; font-weight:700;
    padding:2px 7px; border-radius:2px; background:#161208; border:0.5px solid #5a4630; flex-shrink:0; }
  .up-row-body { flex:1; min-width:0; }
  .up-section { color:#fff; font-size:11.5px; font-weight:600; letter-spacing:-0.005em; }
  .up-section .sep { color:#666; margin:0 6px; font-weight:400; }
  .up-section .snippet { color:#cfcabf; font-weight:400; font-family:Georgia,serif;
    font-style:italic; font-size:11px; }
  .up-meta { color:#666; font-size:9.5px; margin-top:3px; letter-spacing:0.02em; }
  .up-meta b { color:#888; font-weight:600; }
</style>
</head>
<body>

<div id="pol-topbar-container"></div>

<div class="content" id="content" style="display:none;">
  <div class="crumb" id="crumb-host"></div>
  <div class="comm-card" id="comm-host"></div>
</div>

<div id="loading" class="loading">LOADING…</div>

<script type="module">
import { bootstrapPolitician } from './js/politician-topbar.js';
import { _supabase } from './js/supabase-client.js';
import { safeHexColor, factionInitials, displayName } from './js/utils.js';
import { COMMITTEES, applyForCommittee } from './js/committees.js';

const ROLE_LABEL = {
  chair:            'CHAIR',
  vice_chair:       'VICE CHAIR',
  ranking_minority: 'RANKING MINORITY',
  member:           'MEMBER',
};

function escHtml(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

async function init() {
  const params = new URLSearchParams(location.search);
  const key    = params.get('key') || 'defense_foreign_affairs';
  const meta   = COMMITTEES[key];
  if (!meta) { showFail('Unknown committee.'); return; }

  let ctx = null;
  try { ctx = await bootstrapPolitician('nation'); }
  catch (err) {
    console.error('committee: bootstrap failed', err);
    showFail('Failed to load. Please reload the page.');
    return;
  }
  if (!ctx) return;

  const nationId = ctx.faction?.nation_id;
  if (!nationId) { showFail('No nation associated with this politician.'); return; }

  document.title = `${meta.name} — ${ctx.nation?.name || 'Nation'}`;

  // Seed (or noop) the committee for this nation, then fetch.
  let committeeId = null;
  try {
    const { data, error } = await _supabase.rpc('ensure_committee', {
      p_nation_id: nationId, p_committee_key: key,
    });
    if (error) throw error;
    if (!data?.success) { showFail(`Could not load committee: ${data?.reason || 'unknown'}.`); return; }
    committeeId = data.committee_id;
  } catch (err) {
    console.error('committee: ensure_committee failed', err);
    showFail('Could not load committee.');
    return;
  }

  // Members with party join (party_color, faction_name, abbreviation).
  const { data: members, error: memErr } = await _supabase
    .from('committee_members')
    .select('id, slot_idx, role, party_id, npc_first_name, npc_last_name, politician_faction_id, party:factions!party_id(faction_name, abbreviation, party_color), politician:factions!politician_faction_id(leader_first_name, leader_last_name, nickname)')
    .eq('committee_id', committeeId)
    .order('slot_idx', { ascending: true });
  if (memErr) console.warn('committee: members fetch failed', memErr);

  // Queued proposals → render in Upcoming Agenda. Joined to the
  // author faction so we can render "Proposed by …" off real names.
  const { data: proposals, error: propErr } = await _supabase
    .from('committee_proposals')
    .select('id, category, section, articles, proposed_at_tick, author:factions!author_faction_id(leader_first_name, leader_last_name, nickname)')
    .eq('committee_id', committeeId)
    .eq('status', 'queued')
    .order('created_at', { ascending: false });
  if (propErr) console.warn('committee: proposals fetch failed', propErr);

  renderCrumb(ctx, meta);
  renderCommittee(ctx, meta, members || [], committeeId, proposals || []);
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}

function showFail(msg) {
  const el = document.getElementById('loading');
  if (el) { el.textContent = msg; el.style.color = '#c87a7a'; }
}

function renderCrumb(ctx, meta) {
  const polName = [ctx.faction?.leader_first_name, ctx.faction?.leader_last_name].filter(Boolean).join(' ');
  document.getElementById('crumb-host').innerHTML = `
    <a href="politician-home.html">${escHtml(polName.toUpperCase() || 'POLITICIAN')}</a>
    <span class="sep">&rsaquo;</span>
    <a href="politician-nation.html">${escHtml((ctx.nation?.name || 'NATION').toUpperCase())}</a>
    <span class="sep">&rsaquo;</span>
    <span>COMMITTEES</span>
    <span class="sep">&rsaquo;</span>
    <span class="here">${escHtml(meta.name.toUpperCase())}</span>`;
}

function renderCommittee(ctx, meta, members, committeeId, proposals) {
  const viewerPolId = ctx.faction?.id || null;
  const isMP = ctx.faction?.politician_office === 'member_of_parliament';
  const onCommittee = members.some(m => m.politician_faction_id && m.politician_faction_id === viewerPolId);

  document.getElementById('comm-host').innerHTML = `
    <div class="ch-row">
      <div class="ch-badge">${meta.icon}</div>
      <div class="ch-info">
        <div class="ch-name">${escHtml(meta.name)}</div>
        <div class="ch-desc">${escHtml(meta.desc)}</div>
      </div>
      <div class="ch-stat">
        <span class="ch-stat-val">${members.length}</span>
        <span class="ch-stat-lab">MEMBERS</span>
      </div>
    </div>

    <div class="members">
      <div class="mem-lab">COMMITTEE MEMBERS</div>
      <div class="mem-grid">${renderMembers(members, viewerPolId)}</div>
    </div>

    <div class="agenda">
      <div class="ag-head">
        <span class="ag-lab">MONTHLY AGENDA</span>
        <span class="ag-status">NO ACTIVE WORK</span>
      </div>
      <div class="ag-empty">No current work item.</div>
    </div>

    <div class="testimony">
      <div class="tm-head">
        <span class="tm-lab">HEARING RECORD</span>
      </div>
      <div class="chat">
        <div class="chat-feed">
          <div class="chat-empty">No testimony recorded.</div>
        </div>
        <div class="chat-input">${renderInputBanner(isMP, onCommittee)}</div>
      </div>
    </div>

    <div class="actions">
      <div class="ac-lab">COMMITTEE ACTIONS${onCommittee ? '' : ' &middot; MEMBERS ONLY'}</div>
      <div class="ac-grid">${renderActions(onCommittee)}</div>
    </div>

    <div class="activities">
      <div class="av-lab">LIST OF ACTIVITIES &middot; PAST THIRTY TICKS</div>
      <div class="av-empty">No activities recorded.</div>
    </div>

    <div class="upcoming">
      <div class="up-lab">UPCOMING AGENDA</div>
      ${renderProposals(proposals || [])}
    </div>`;

  // Delegated click handler. Apply CTA fires the apply RPC; action
  // buttons are still stub-alerted until hearing/vote/markup flows land.
  document.getElementById('comm-host').addEventListener('click', (e) => {
    const apply = e.target.closest('#comm-apply-cta');
    if (apply) {
      e.preventDefault();
      submitApplication(apply, committeeId);
      return;
    }
    const action = e.target.closest('.act-btn.enabled');
    if (action) {
      alert('Committee action is not yet wired up.');
    }
  });
}

async function submitApplication(link, committeeId) {
  if (link.dataset.busy === '1') return;
  link.dataset.busy = '1';
  const originalText = link.textContent;
  link.textContent = 'Submitting…';
  const res = await applyForCommittee(committeeId);
  if (!res.success) {
    alert(res.humanError);
    link.dataset.busy = ''; link.textContent = originalText;
    return;
  }
  alert(`Admission vote opened. Resolves at tick ${res.data.resolve_at_tick}.`);
  window.location.href = 'politician-nation.html#sec-voting';
}

function renderMembers(members, viewerPolId) {
  if (!members.length) {
    return `<div class="mem-empty">No members seated yet.</div>`;
  }
  return members.map(m => {
    // Real-player seats null the NPC name fields and populate the
    // politician join; NPC seats keep npc_first/last. Build a
    // faction-shaped object either way so displayName() does the
    // "(Nickname)" formatting consistently. NPCs have no nickname.
    const fac = m.politician_faction_id
      ? m.politician
      : { leader_first_name: m.npc_first_name, leader_last_name: m.npc_last_name };
    const baseInitials = [fac?.leader_first_name, fac?.leader_last_name].filter(Boolean).join(' ').trim() || '—';
    const fullName = displayName(fac) || '—';
    const initials = factionInitials(baseInitials, null);
    const partyColor = safeHexColor(m.party?.party_color);
    const partyName = m.party?.faction_name || 'Independent';
    const isChair   = m.role === 'chair';
    const isYou     = m.politician_faction_id && m.politician_faction_id === viewerPolId;
    return `
      <div class="mem${isChair ? ' chair' : ''}">
        <div class="mem-badge" style="background:${partyColor};">${escHtml(initials)}</div>
        <div class="mem-role">${escHtml(ROLE_LABEL[m.role] || 'MEMBER')}</div>
        <div class="mem-name">${escHtml(fullName)}</div>
        <div class="mem-party">${escHtml(partyName)}</div>
        ${isYou ? '<div class="mem-you">YOU</div>' : ''}
      </div>`;
  }).join('');
}

function renderInputBanner(isMP, onCommittee) {
  if (onCommittee) {
    return `<div class="input-disabled"><strong>You are a member.</strong> &middot; The testimony interface will open here once a hearing is in session.</div>`;
  }
  if (isMP) {
    return `<div class="input-disabled"><strong>You are not on this committee.</strong> &middot; Read-only. <a href="#" id="comm-apply-cta">Apply for committee membership</a> to participate.</div>`;
  }
  return `<div class="input-disabled"><strong>Observer access.</strong> &middot; Members of Parliament may apply for committee membership.</div>`;
}

function renderActions(onCommittee) {
  const actions = [
    { ic: '☞', name: 'HOLD A HEARING',        desc: 'Call witnesses, take public testimony. The chamber and the press both watch.' },
    { ic: '☇', name: 'VOTE ON APPROPRIATIONS', desc: 'Approve, modify, or deny funding for ministries and programs in the committee’s remit.' },
    { ic: '✎', name: 'AMEND A PROPOSAL',      desc: 'Modify a bill clause-by-clause before it goes to the chamber floor.' },
  ];
  return actions.map(a => `
    <button class="act-btn${onCommittee ? ' enabled' : ''}" type="button"${onCommittee ? '' : ' disabled'}>
      <div class="act-head">
        <span class="act-ic">${a.ic}</span>
        <span class="act-name">${escHtml(a.name)}</span>
      </div>
      <div class="act-desc">${escHtml(a.desc)}</div>
    </button>`).join('');
}

// Queued proposals rendered as compact rows. Category pill on the
// left, "Section · first-article snippet" on top, "Proposed by …
// at tick N" on bottom. First article's text is truncated to ~120
// chars for the snippet so long bills don't blow up the layout.
function renderProposals(proposals) {
  if (!proposals.length) return '<div class="up-empty">No upcoming items.</div>';
  return proposals.map(p => {
    const firstArticle = Array.isArray(p.articles) && p.articles.length ? p.articles[0] : null;
    const snippet = firstArticle?.text
        ? escHtml(firstArticle.text.length > 120 ? firstArticle.text.slice(0, 117).trim() + '…' : firstArticle.text)
        : '';
    const a = p.author || {};
    const authorName = [a.leader_first_name, a.leader_last_name].filter(Boolean).join(' ') || 'Unknown';
    const nick = (a.nickname || '').trim();
    const who = nick ? `${authorName} (${nick})` : authorName;
    const cat = (p.category || '').toUpperCase();
    return `<div class="up-row">
      <span class="up-cat">${escHtml(cat)}</span>
      <div class="up-row-body">
        <div class="up-section">${escHtml(p.section || '')}${snippet ? `<span class="sep">·</span><span class="snippet">${snippet}</span>` : ''}</div>
        <div class="up-meta">Proposed by <b>${escHtml(who)}</b> &middot; tick ${escHtml(String(p.proposed_at_tick ?? '?'))}</div>
      </div>
    </div>`;
  }).join('');
}

init();
</script>
</body>
</html>
