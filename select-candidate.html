<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Candidate | Nationhood Alpha</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/select-candidate.css">
</head>
<body>

<div id="top-bar"></div>

<div id="content-area">
    <div class="sc-page" id="sc-page">
        <div class="sc-loading">
            <div class="loading-spinner"></div>
            <div>Loading candidates...</div>
        </div>
    </div>
</div>

<script type="module">

import { _supabase } from './js/supabase-client.js';
import { initPage, getAdminNationOverride, getAdminFactionOverride } from './js/common.js';
import { escapeHtml } from './js/utils.js';
import {
    initGameConfigForNation,
    isPresidentialRepublic,
    fetchActiveCoalition, loadSeats, syncVoteTallies,
    deductAP, adjustMomentumAll,
    GAME_CONFIG
} from './js/game-common.js';

// ── Role detection ──
const params = new URLSearchParams(window.location.search);
const ROLE = params.get('role') || 'pm'; // pm | president | ambassador

const ROLE_CONFIG = {
    pm: {
        icon: '\u{1F451}',
        title: 'Select Your Prime Minister',
        description: 'Your coalition has formed and your party holds the Prime Minister post. Choose who will lead the nation.',
        badgePrefix: 'Appointing for',
        confirmLabel: 'Appoint Prime Minister',
        confirmWarning: '\u26A0 This choice is permanent for the duration of the term.',
        confirmVerb: 'Appoint',
        progressLabel: 'Appointing...',
        emptyTitle: 'No Candidates',
        initTab: 'government',
        redirectUrl: 'government.html',
        eventKey: 'pm_appointed',
        showTraits: true,
        showIdeology: true,
    },
    president: {
        icon: '\u{1F3DB}',
        title: 'Select Your Candidate',
        description: 'Choose your party\'s presidential nominee for the upcoming election. Your candidate will compete against nominees from other parties in the popular vote.',
        badgePrefix: 'Nominating for',
        confirmLabel: 'Nominate Candidate',
        confirmWarning: 'This choice is permanent. Your nominee will run in the presidential election.',
        confirmVerb: 'Nominate',
        progressLabel: 'Nominating...',
        emptyTitle: 'Presidential Selection',
        initTab: 'government',
        redirectUrl: 'politics.html',
        eventKey: null,
        showTraits: true,
        showIdeology: true,
    },
    ambassador: {
        icon: '\u{1F3DB}\uFE0F',
        title: 'Appoint Ambassador',
        description: null, // set dynamically with target nation
        badgePrefix: 'Foreign Minister:',
        confirmLabel: 'Nominate Ambassador',
        confirmWarning: null, // set dynamically
        confirmVerb: null,
        progressLabel: null,
        emptyTitle: 'Ambassador Appointment',
        initTab: 'diplomacy',
        redirectUrl: null, // set dynamically
        eventKey: null,
        showTraits: false,
        showIdeology: false,
    },
};

const cfg = ROLE_CONFIG[ROLE] || ROLE_CONFIG.pm;

let currentNation = null;
let currentFaction = null;
let candidates = [];
let selectedCandidateIndex = null; // Ambassador (index)

// Ambassador-specific state
let targetNation = null;
let allParties = [];


const AMB_FIRST_NAMES = [
    'Carlos','Diego','Fernando','H\u00E9ctor','Marcos','Ram\u00F3n','Jos\u00E9','Luis','Miguel',
    'Antonio','Roberto','Francisco','Eduardo','Pablo','Alejandro','Rafael','Gabriel',
    'Santiago','Andr\u00E9s','Javier','Ricardo','Tom\u00E1s','Emilio','Sergio','Nicol\u00E1s',
    'Arturo','Enrique','Oscar','Felipe','Gonzalo','Ignacio','Mateo','Dante'
];
const AMB_LAST_NAMES = [
    'Velasco','Salazar','Guerrero','R\u00EDos','Morales','Torres','Mendoza','Castillo',
    'Herrera','Vargas','Reyes','Cruz','Navarro','Delgado','Ortiz','Romero','Flores',
    'Ram\u00EDrez','Guzm\u00E1n','Medina','Soto','Pacheco','Ibarra','Carrasco','Espinoza',
    'Montenegro','Echeverr\u00EDa','Valdez','C\u00F3rdoba','Aguilar','Paredes','Lara'
];

// ── Helper: diplomacy back URL (ambassador) ──
function diploBackUrl() {
    const p = [];
    const on = getAdminNationOverride(); if (on) p.push('nation_id=' + on);
    const of_ = getAdminFactionOverride(); if (of_) p.push('faction_id=' + of_);
    return 'diplomacy.html' + (p.length ? '?' + p.join('&') : '');
}

// Set page title
document.title = cfg.title + ' | Nationhood Alpha';

// ── Init ──
initPage(cfg.initTab, async (state) => {
    const { nation, faction } = state;
    currentNation = nation;
    currentFaction = faction;

    if (!nation || !faction) {
        renderEmpty('No nation or party found.');
        return;
    }

    if (ROLE === 'pm') await initPM();
    else if (ROLE === 'president') await initPresident();
    else if (ROLE === 'ambassador') await initAmbassador();
});

// ═══════════════════════════════════════
//  PM init — parliamentary systems auto-appoint party leader, no candidate selection needed
// ═══════════════════════════════════════
async function initPM() {
    // Parliamentary PM selection is now automatic — redirect to government page
    renderEmpty('Prime Ministers are now automatically appointed from your Party Leader when a coalition forms. <a href="government.html">View Government \u2192</a>');
}


// ═══════════════════════════════════════
//  President init
// ═══════════════════════════════════════
async function initPresident() {
    // Presidential nominees are now automatically the party leader — no manual selection needed
    renderEmpty('Your Party Leader is automatically your presidential nominee. <a href="government.html">View Government \u2192</a>');
}

// ═══════════════════════════════════════
//  Ambassador init
// ═══════════════════════════════════════
async function initAmbassador() {
    const targetId = params.get('target');
    if (!targetId) {
        renderEmpty('No target nation specified. <a href="' + diploBackUrl() + '">Back to Diplomacy</a>');
        return;
    }

    const { data: tNation } = await _supabase.from('nations').select('*').eq('id', targetId).single();
    if (!tNation) {
        renderEmpty('Target nation not found. <a href="' + diploBackUrl() + '">Back to Diplomacy</a>');
        return;
    }
    targetNation = tNation;

    // Check if already have active or pending ambassador
    const { data: existing } = await _supabase
        .from('ambassadors')
        .select('id, status')
        .eq('nation_id', currentNation.id)
        .eq('target_nation_id', targetNation.id)
        .eq('is_active', true)
        .maybeSingle();

    if (existing) {
        const statusLabel = existing.status === 'active' ? 'an active' : 'a pending';
        renderEmpty('You already have ' + statusLabel + ' ambassador to ' + targetNation.name + '. <a href="' + diploBackUrl() + '">Back to Diplomacy</a>');
        return;
    }

    // Check FM role
    const coalition = await fetchActiveCoalition(_supabase, currentNation.id);
    const alloc = coalition?.ministry_allocations || {};
    let isFM = alloc.foreign === currentFaction.id;

    if (!isFM) {
        const { data: fmEntry } = await _supabase
            .from('ministries')
            .select('party_id')
            .eq('nation_id', currentNation.id)
            .eq('ministry_key', 'foreign')
            .eq('is_active', true)
            .maybeSingle();
        if (fmEntry && fmEntry.party_id === currentFaction.id) isFM = true;
    }

    if (!isFM) {
        renderEmpty('Only the Foreign Minister can appoint ambassadors. <a href="' + diploBackUrl() + '">Back to Diplomacy</a>');
        return;
    }

    if (!coalition) {
        renderEmpty('No government is currently seated. Ambassador appointments require an active government. <a href="' + diploBackUrl() + '">Back to Diplomacy</a>');
        return;
    }

    if (coalition?.status === 'caretaker') {
        renderEmpty('Appointments are suspended during caretaker government. <a href="' + diploBackUrl() + '">Back to Diplomacy</a>');
        return;
    }

    // Load all active parties
    const { data: parties } = await _supabase
        .from('factions')
        .select('id, faction_name, color')
        .eq('nation_id', currentNation.id);
    allParties = parties || [];

    if (allParties.length === 0) {
        renderEmpty('No political parties found. <a href="' + diploBackUrl() + '">Back to Diplomacy</a>');
        return;
    }

    generateAmbassadorCandidates();
    renderCandidates();
}

function generateAmbassadorCandidates() {
    candidates = allParties.map(party => ({
        partyId: party.id,
        partyName: party.faction_name,
        partyColor: party.color || '#888',
        firstName: AMB_FIRST_NAMES[Math.floor(Math.random() * AMB_FIRST_NAMES.length)],
        lastName: AMB_LAST_NAMES[Math.floor(Math.random() * AMB_LAST_NAMES.length)],
        age: 35 + Math.floor(Math.random() * 31)
    }));
    selectedCandidateIndex = null;
}

// ═══════════════════════════════════════
//  Render
// ═══════════════════════════════════════
function renderCandidates() {
    const page = document.getElementById('sc-page');

    const cardsHTML = candidates.map((c, i) => `
        <div class="sc-card" id="sc-card-${i}" onclick="selectCandidate(${i})">
            <div class="sc-card-header">
                <div class="sc-card-avatar">\u{1F464}</div>
                <div class="sc-card-name">${c.firstName} ${c.lastName}</div>
                <div class="sc-card-age">Age ${c.age}</div>
            </div>
            <div class="sc-card-party">
                <div class="sc-party-label">Party Affiliation</div>
                <div class="sc-party-tag">
                    <span class="sc-party-tag-dot" style="background:${c.partyColor}"></span>
                    ${escapeHtml(c.partyName)}
                </div>
            </div>
            <div class="sc-card-footer">
                <div class="sc-select-indicator">Select</div>
            </div>
        </div>
    `).join('');

    const description = 'Select a candidate to serve as your nation\'s Ambassador to <strong>' + escapeHtml(targetNation.name) + '</strong>.';

    const confirmWarning = 'A confirmation vote will be held in Parliament (51% required).';

    page.innerHTML = `
        <div class="sc-header">
            <span class="sc-header-icon">${cfg.icon}</span>
            <h1>${cfg.title}</h1>
            <p>${description}</p>
            <div class="sc-party-badge">
                <div class="sc-party-dot"></div>
                <span>${cfg.badgePrefix} <strong>${escapeHtml(currentFaction.faction_name)}</strong></span>
            </div>
        </div>

        <div class="sc-regen"><a onclick="regenerate()">Re-generate candidates</a></div>

        <div class="sc-candidates auto-grid" id="sc-candidates">
            ${cardsHTML}
        </div>

        <div class="sc-confirm-section" id="sc-confirm-section">
            <div class="sc-confirm-summary" id="sc-confirm-summary">Select a candidate above</div>
            <button class="sc-confirm-btn" id="sc-confirm-btn" disabled onclick="confirmSelection()">
                Nominate Ambassador <span class="ap-cost">1 AP</span>
            </button>
            <div class="sc-confirm-warning">${confirmWarning}</div>
        </div>
    `;
}

// ═══════════════════════════════════════
//  Select candidate
// ═══════════════════════════════════════
function selectCandidate(idOrIndex) {
    document.querySelectorAll('.sc-card').forEach(el => el.classList.remove('selected'));

    selectedCandidateIndex = idOrIndex;
    document.getElementById('sc-card-' + idOrIndex).classList.add('selected');

    const c = candidates[idOrIndex];
    document.getElementById('sc-confirm-summary').innerHTML =
        'Nominate <strong>' + escapeHtml(c.firstName) + ' ' + escapeHtml(c.lastName) + '</strong> (' +
        escapeHtml(c.partyName) + ') as Ambassador to <strong>' + escapeHtml(targetNation.name) + '</strong>';

    document.getElementById('sc-confirm-btn').disabled = false;
}

// ═══════════════════════════════════════
//  Confirm selection
// ═══════════════════════════════════════
async function confirmSelection() {
    await confirmAmbassador();
}


async function confirmAmbassador() {
    if (selectedCandidateIndex === null) return;

    const candidate = candidates[selectedCandidateIndex];

    if (!confirm(
        '\u{1F3DB}\uFE0F Nominate ' +
        candidate.firstName + ' ' + candidate.lastName + ' as Ambassador to ' + targetNation.name + '?\n\n' +
        'Party: ' + candidate.partyName + '\n' +
        'Cost: 1 AP\n' +
        candidate.partyName + ' will gain +1 Approval.\n\n' +
        'A confirmation bill will go to a floor vote in Parliament.'
    )) return;

    const btn = document.getElementById('sc-confirm-btn');
    btn.disabled = true;
    btn.textContent = 'Nominating...';

    try {
        // Deduct 1 AP
        const apResult = await deductAP(_supabase, currentFaction.id, 1);
        if (!apResult.success) {
            if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
            alert('Not enough AP (need 1). Current AP: ' + (apResult.currentAp ?? '?'));
            btn.disabled = false; btn.textContent = 'Nominate Ambassador';
            return;
        }
        currentFaction.action_points = apResult.newAp;

        const { data: shard } = await _supabase
            .from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const currentTick = shard?.current_tick || 0;

        let confirmationBillId = null;

        const billName = 'Confirmation of ' + candidate.firstName + ' ' + candidate.lastName + ' as Ambassador to ' + targetNation.name;
            const preamble = 'This motion, filed by the ' + currentFaction.faction_name + ', confirms the appointment of ' + candidate.firstName + ' ' + candidate.lastName + ' (' + candidate.partyName + ') as Ambassador to ' + targetNation.name + '. A simple majority (51%) is required for confirmation.';

            const { data: nominationResult, error: nominationError } = await _supabase.rpc('create_ambassador_nomination_with_bill', {
                p_nation_id: currentNation.id,
                p_target_nation_id: targetNation.id,
                p_faction_id: candidate.partyId,
                p_proposed_by: currentFaction.id,
                p_first_name: candidate.firstName,
                p_last_name: candidate.lastName,
                p_age: candidate.age,
                p_current_tick: currentTick,
                p_bill_name: billName,
                p_preamble: preamble,
                p_voting_ends_tick: currentTick + 6
            });

            if (nominationError) throw nominationError;

            const nominationRow = Array.isArray(nominationResult) ? nominationResult[0] : nominationResult;
            if (!nominationRow?.ambassador_id || !nominationRow?.bill_id) {
                throw new Error('Ambassador nomination failed: server did not return expected IDs.');
            }

            confirmationBillId = nominationRow.bill_id;

        // +1 approval to the candidate's party
        await adjustMomentumAll(_supabase, currentNation.id, candidate.partyId, 1, 'diplomacy:ambassador_selected');

        // Auto-cast FM seats on the confirmation bill
        if (!confirmationBillId) throw new Error('Missing confirmation bill ID from nomination RPC.');

            const { data: parties } = await _supabase
                .from('factions')
                .select('id, faction_name')
                .eq('nation_id', currentNation.id);
            const seatData = await loadSeats(_supabase, currentNation.id, false, parties || [], currentFaction.id);
            const mySeats = seatData.allPartySeats[currentFaction.id] || 0;

            if (mySeats > 0) {
                await _supabase.from('bill_support').upsert({
                    bill_id: confirmationBillId,
                    faction_id: currentFaction.id,
                    stance: 'yes',
                    seat_count: mySeats
                });
            }

            await syncVoteTallies(_supabase, confirmationBillId);

        const msg = '\u{1F3DB}\uFE0F ' + candidate.firstName + ' ' + candidate.lastName + ' has been nominated as Ambassador to ' + targetNation.name + '. A confirmation vote has been filed in Parliament.';
        alert(msg);
        window.location.href = diploBackUrl();

    } catch (e) {
        console.error('Error nominating ambassador:', e);
        alert('Error: ' + e.message);
        btn.disabled = false;
        btn.textContent = 'Nominate Ambassador';
    }
}

// ── Ambassador regenerate ──
function regenerate() {
    generateAmbassadorCandidates();
    renderCandidates();
}

// ── Empty state ──
function renderEmpty(message) {
    document.getElementById('sc-page').innerHTML = `
        <div class="sc-empty">
            <span style="font-size:3rem;display:block;margin-bottom:16px;opacity:0.3;">${cfg.icon}</span>
            <h3>${cfg.emptyTitle}</h3>
            <p>${message}</p>
        </div>
    `;
}

// Expose functions for HTML onclick handlers
window.selectCandidate = selectCandidate;
window.confirmSelection = confirmSelection;
window.regenerate = regenerate;
</script>
</body>
</html>
