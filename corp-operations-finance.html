<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Operations | Nationhood Alpha</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/corp-topbar.css">
<link rel="stylesheet" href="css/corp-light-theme.css">
<style>
:root {
  --bg-0: #0e0e0c;
  --bg-1: #1a1a1a;
  --bg-2: #1a1a17;
  --bg-3: #252525;
  --bg-4: #24241f;
  --bg-5: #2c2c26;
  --bg-hover: #282822;
  /* Panel palette — these flip under body.light-mode. Dark defaults here, light
     overrides in the body.light-mode block below. */
  --bg-card: #1a1a17;
  --bg-panel: #252525;
  --panel-main: #1f1f1a;
  --panel-border: rgba(255,255,255,0.08);
  --panel-text: #c4c2b8;
  --panel-muted: #888;
  --text-bright: #f0efe6;
  --text-primary: #c4c2b8;
  --text-secondary: #888;
  --text-muted: #666;
  --text-dim: #4a4940;
  --text-ghost: #333229;
  --border-hair: rgba(255,255,255,0.04);
  --border-0: rgba(255,255,255,0.06);
  --border-1: rgba(255,255,255,0.08);
  --border-2: rgba(255,255,255,0.12);
  --green: #5cb85c;
  --red: #d9534f;
  --amber: #c8a832;
  --gold: #c8a832;
  --orange: #e8724a;
  --blue: #5bc0de;
  --purple: #9b59b6;
  --teal: #5aafa5;
  --teal-border: rgba(90,175,165,0.25);
  --crimson: #dc3545;
  --font-mono: 'JetBrains Mono', monospace;
  --font-sans: 'IBM Plex Sans', sans-serif;
  --font-serif: 'IBM Plex Serif', serif;
}
/* Light-mode panel palette — preserves the exact original hex values so light
   mode renders identically to before the var conversion. */
body.light-mode {
  --bg-card: #ffffff;
  --bg-panel: #faf9f5;
  --panel-main: #f8f7f2;
  --panel-border: #e8e7e0;
  --panel-text: #e8e4dc;
  --panel-muted: #6a6660;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font-sans); background:var(--bg-0); color:var(--text-primary); min-height:100vh; }

/* Top bar — matches corp-dashboard.html layout */
.top-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 22px; height: 53px;
  background: var(--bg-2); border-bottom: 1px solid var(--border-0);
}
.top-bar-left { display: flex; align-items: center; gap: 0; }
.top-bar-sep {
  width: 1px; height: 31px; background: var(--border-1);
  margin: 0 16px; flex-shrink: 0;
}
.top-bar-right { display: flex; align-items: center; gap: 10px; }
.corp-badge { display: flex; align-items: center; gap: 8px; }
.corp-logo {
  width: 35px; height: 35px;
  background: var(--bg-3); border: 1px solid var(--border-0); border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--text-dim);
}
.corp-name-bar {
  font-family: var(--font-serif); font-size: 14px; font-weight: 500;
  color: var(--text-bright); letter-spacing: 0.02em; white-space: nowrap;
}
.tick-info { display: flex; gap: 20px; align-items: center; }
.tick-item { display: flex; flex-direction: column; gap: 1px; }
.tick-label {
  font-family: var(--font-mono); font-size: 9.5px; font-weight: 500;
  letter-spacing: 0.06em; text-transform: uppercase; color: #7a7868;
}
.tick-value {
  font-family: var(--font-mono); font-size: 13px; font-weight: 500;
  color: var(--text-bright);
}
.logout-btn { font-family:var(--font-mono); font-size:9px; padding:4px 10px; background:var(--bg-3); border:1px solid var(--border-1); color:var(--text-secondary); cursor:pointer; letter-spacing:0.5px; }
.corp-name-badge {
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  padding: 4px 10px; background: rgba(90,175,165,0.08);
  border: 1px solid var(--teal-border); color: var(--teal); letter-spacing: 0.5px; cursor: pointer;
}
.topbar-cash {
  font-family: var(--font-mono); font-size: 12px; font-weight: 700;
  letter-spacing: 0.5px; color: var(--gold);
  padding: 4px 12px; background: rgba(200,168,50,0.08); border: 1px solid rgba(200,168,50,0.2);
}

/* Nav */
.corp-hamburger { display:none; background:var(--bg-2); border:1px solid var(--border-0); color:var(--text-secondary); font-size:18px; padding:6px 12px; cursor:pointer; width:100%; text-align:left; }
.corp-nav { display:flex; padding:0 22px; gap:0; height:40px; background:var(--bg-2); border-bottom:1px solid var(--border-0); }
.corp-nav-tab {
  font-family:var(--font-mono); font-size:10px; font-weight:500; letter-spacing:0.8px; text-transform:uppercase;
  color:var(--text-dim); text-decoration:none; padding:0 14px; display:flex; align-items:center;
  border-bottom:2px solid transparent; transition: color 0.15s, border-color 0.15s;
}
.corp-nav-tab:hover { color: #a8a797; }
.corp-nav-tab.active { color:var(--text-bright); border-bottom-color:var(--text-bright); }
body.light-mode .corp-nav-tab { color:#666660; }
body.light-mode .corp-nav-tab:hover { color:#333330; }
body.light-mode .corp-nav-tab.active { color:#1a1a17; border-bottom-color:#1a1a17; }

/* Deal Flow container — Deal cards scaled up ~40% and given full borders so
   they read clearly as tap targets. Designed around a ≥44px high row to
   satisfy touch guidelines without further mobile overrides. */
.df-container { width:440px; height:520px; background:var(--panel-main); border:1px solid var(--panel-border); display:flex; flex-direction:column; overflow:hidden; }
.df-header { padding:10px 16px; border-bottom:1px solid var(--panel-border); display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
.df-header__left { display:flex; align-items:center; gap:8px; }
.df-header__dot { font-size:10px; color:var(--teal); }
.df-header__title { font-family:var(--font-mono); font-size:14px; font-weight:700; letter-spacing:2px; color:#9e9a92; text-transform:uppercase; }
.df-filters { padding:8px 14px; border-bottom:1px solid var(--panel-border); background:var(--bg-panel); flex-shrink:0; display:flex; gap:4px; }
.df-pill { flex:1; text-align:center; padding:7px 0; font-family:var(--font-mono); font-size:11px; font-weight:700; cursor:pointer; letter-spacing:0.8px; border:1px solid var(--panel-border); color:#6a6660; background:transparent; transition:all 0.1s; }
.df-pill.active-all { color:#000; background:#8b9a6b; border-color:#8b9a6b; }
.df-pill.active-loan { color:#000; background:#5a8aaa; border-color:#5a8aaa; }
.df-pill.active-insure { color:#000; background:#aa7a5a; border-color:#aa7a5a; }
.df-pill.active-bond { color:#000; background:#8a6aaa; border-color:#8a6aaa; }
/* Card list — padded gutter + gap so cards read as discrete tappable units. */
.df-list { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:8px; }
.df-deal { padding:12px 14px; border:1px solid var(--panel-border); border-left:3px solid transparent; background:var(--bg-panel); cursor:pointer; position:relative; transition:border-color 0.12s, background 0.12s, transform 0.08s; }
.df-deal:hover { background:#201e1a; border-color:#3a3a32; border-left-color:#6a6660; }
.df-deal:active { transform:scale(0.995); }
.df-deal.sel-loan { border-left-color:#5a8aaa; background:rgba(90,138,170,0.08); border-color:rgba(90,138,170,0.35); }
.df-deal.sel-insure { border-left-color:#aa7a5a; background:rgba(170,122,90,0.08); border-color:rgba(170,122,90,0.35); }
.df-deal.sel-bond { border-left-color:#8a6aaa; background:rgba(138,106,170,0.08); border-color:rgba(138,106,170,0.35); }
.df-badge { font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:0.5px; padding:2px 7px; line-height:16px; display:inline-block; }
.df-badge-loan { color:#5a8aaa; background:rgba(90,138,170,0.08); border:1px solid rgba(90,138,170,0.2); }
.df-badge-insure { color:#aa7a5a; background:rgba(170,122,90,0.08); border:1px solid rgba(170,122,90,0.2); }
.df-badge-bond { color:#8a6aaa; background:rgba(138,106,170,0.08); border:1px solid rgba(138,106,170,0.2); }
.df-badge-gov { color:#a3b07e; background:rgba(163,176,126,0.1); border:1px solid rgba(163,176,126,0.2); }
.df-badge-corp { color:#c8a832; background:rgba(200,168,50,0.08); border:1px solid rgba(200,168,50,0.2); }
.df-badge-nation { color:#8b9a6b; background:rgba(139,154,107,0.08); border:1px solid rgba(139,154,107,0.15); }
.df-risk-low { color:#5c5; }
.df-risk-moderate { color:#ca5; }
.df-risk-elevated { color:#c84; }
.df-risk-high { color:#c55; }
.df-metrics { display:flex; gap:0; background:var(--bg-panel); border:1px solid var(--panel-border); }
.df-metrics > div { padding:6px 10px; }
.df-metrics > div + div { border-left:1px solid var(--panel-border); }
.df-metrics__label { font-family:var(--font-mono); font-size:9px; color:#6a6660; letter-spacing:0.5px; }
.df-metrics__value { font-family:var(--font-mono); font-weight:700; margin-top:2px; }
.df-detail { background:var(--bg-card); border:1px solid var(--panel-border); padding:7px 10px; margin-top:6px; }
.df-detail-row { display:flex; justify-content:space-between; padding:3px 0; }
.df-detail-row + .df-detail-row { border-top:1px solid var(--panel-border); }
.df-detail-label { font-family:var(--font-mono); font-size:11px; color:#6a6660; }
.df-detail-value { font-family:var(--font-mono); font-size:12px; }
.df-footer { padding:10px 14px; border-top:1px solid var(--panel-border); background:var(--bg-panel); flex-shrink:0; display:flex; justify-content:space-between; align-items:center; }
.df-footer__counts { display:flex; gap:12px; }
.df-footer__count { display:flex; align-items:center; gap:5px; }
.df-footer__count-dot { width:7px; height:7px; border-radius:1px; }
.df-footer__count-label { font-family:var(--font-mono); font-size:10px; color:#6a6660; letter-spacing:0.5px; }
.df-footer__count-num { font-family:var(--font-mono); font-size:11px; font-weight:700; color:#9e9a92; }
.df-review-btn { padding:9px 22px; font-family:var(--font-mono); font-size:12px; font-weight:700; letter-spacing:1.2px; border:1px solid var(--panel-border); cursor:default; color:#6a6660; background:transparent; opacity:0.4; transition:background 0.12s, transform 0.08s; }
.df-review-btn.active { color:#000; background:#8b9a6b; border-color:#8b9a6b; cursor:pointer; opacity:1; }
.df-review-btn.active:hover { background:#9aa97a; }
.df-review-btn.active:active { transform:scale(0.97); }
.df-new-dot { position:absolute; left:4px; top:50%; transform:translateY(-50%); width:6px; height:6px; border-radius:50%; background:#c8a832; }

/* Active Portfolio container */
.ap-container { width:380px; height:450px; background:var(--panel-main); border:1px solid var(--panel-border); display:flex; flex-direction:column; overflow:hidden; }
.ap-summary { display:flex; border-bottom:1px solid var(--panel-border); background:var(--bg-panel); flex-shrink:0; }
.ap-summary__cell { padding:6px 14px; }
.ap-summary__cell + .ap-summary__cell { border-left:1px solid var(--panel-border); }
.ap-summary__label { font-family:var(--font-mono); font-size:7px; color:#6a6660; letter-spacing:0.8px; }
.ap-summary__value { font-family:var(--font-mono); font-weight:700; margin-top:1px; }
.ap-list { flex:1; overflow-y:auto; }
.ap-deal { border-bottom:1px solid var(--panel-border); border-left:2px solid transparent; cursor:pointer; }
.ap-deal:hover { background: var(--border-hair); }
.ap-deal.alert-orange { border-left-color:#c84; }
.ap-deal.alert-red { border-left-color:#c55; }
.ap-deal.alert-yellow { border-left-color:#ca5; }
.ap-deal__inner { padding:7px 14px; }
.ap-deal__alert { margin-top:4px; padding:4px 6px; font-size:9px; line-height:1.4; }
.ap-deal__expanded { margin-top:6px; padding:6px 8px; background:var(--bg-card); border:1px solid var(--panel-border); }
.ap-detail-row { display:flex; justify-content:space-between; padding:2px 0; }
.ap-detail-row + .ap-detail-row { border-top:1px solid var(--panel-border); }
.ap-detail-label { font-family:var(--font-mono); font-size:7px; color:#6a6660; }
.ap-detail-value { font-family:var(--font-mono); font-size:9px; font-weight:700; }
.ap-actions { display:flex; gap:4px; margin-top:6px; }
.ap-action-btn { flex:1; padding:4px 0; text-align:center; cursor:pointer; font-family:var(--font-mono); font-size:7px; font-weight:700; background:transparent; }
.ap-action-btn.green { color:#5c5; border:1px solid #2a5a3a; background:rgba(74,170,136,0.06); }
.ap-action-btn.orange { color:#c84; border:1px solid rgba(204,136,68,0.27); }
.ap-action-btn.red { color:#c55; border:1px solid rgba(204,85,85,0.27); }
.ap-action-btn.purple { color:#8a6aaa; border:1px solid rgba(138,106,170,0.27); }
.ap-action-btn.olive { color:#8b9a6b; border:1px solid rgba(139,154,107,0.27); }
.ap-claim-box { padding:4px 6px; margin-bottom:4px; background:rgba(204,85,85,0.04); border:1px solid rgba(204,85,85,0.1); }
.ap-empty { padding:30px 20px; text-align:center; font-family:var(--font-mono); font-size:12px; color:#6a6660; line-height:1.6; }

/* Reserves & Risk container */
.rr-container { width:380px; height:450px; background:var(--panel-main); border:1px solid var(--panel-border); display:flex; flex-direction:column; overflow:hidden; }
.rr-section-bar { padding:6px 14px; border-bottom:1px solid var(--panel-border); background:var(--bg-panel); font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:1.5px; color:#a3b07e; text-transform:uppercase; }
.rr-section { padding:8px 14px; border-bottom:1px solid var(--panel-border); }
.rr-seg-bar { width:100%; display:flex; overflow:hidden; }
.rr-seg-legend { display:flex; justify-content:space-between; margin-top:4px; }
.rr-seg-legend-item { display:flex; align-items:center; gap:4px; font-family:var(--font-mono); font-size:8px; color:#9e9a92; }
.rr-seg-legend-dot { width:6px; height:6px; }
.rr-reserve-cells { display:flex; gap:0; margin-top:8px; background:var(--bg-panel); border:1px solid var(--panel-border); }
.rr-reserve-cell { flex:1; padding:4px 8px; }
.rr-reserve-cell + .rr-reserve-cell { border-left:1px solid var(--panel-border); }
.rr-type-row { display:flex; align-items:center; padding:3px 0; }
.rr-type-row + .rr-type-row { border-top:1px solid var(--panel-border); }
.rr-conc-row { display:flex; align-items:center; padding:3px 0; }
.rr-conc-row + .rr-conc-row { border-top:1px solid var(--panel-border); }
.rr-warning { padding:6px 14px; border-bottom:1px solid var(--panel-border); background:rgba(204,85,85,0.03); font-size:9px; color:#c84; line-height:1.5; }

/* Collections container */
.cc-container { width:380px; height:450px; background:var(--panel-main); border:1px solid var(--panel-border); display:flex; flex-direction:column; overflow:hidden; }
.cc-scorecard { display:flex; border-bottom:1px solid var(--panel-border); background:var(--bg-panel); flex-shrink:0; }
.cc-scorecard__cell { flex:1; padding:6px 14px; }
.cc-scorecard__cell + .cc-scorecard__cell { border-left:1px solid var(--panel-border); }
.cc-scorecard__label { font-family:var(--font-mono); font-size:7px; color:#6a6660; letter-spacing:0.8px; }
.cc-scorecard__value { font-family:var(--font-mono); font-size:13px; font-weight:700; margin-top:1px; }
.cc-winloss { padding:5px 14px; border-bottom:1px solid var(--panel-border); display:flex; align-items:center; gap:8px; flex-shrink:0; }
.cc-winloss__bar { flex:1; display:flex; height:4px; }
.cc-winloss__stat { font-family:var(--font-mono); font-size:8px; font-weight:700; }
.cc-list { flex:1; overflow-y:auto; }
.cc-deal { border-bottom:1px solid var(--panel-border); cursor:pointer; }
.cc-deal:hover { background: var(--border-hair); }
.cc-deal__inner { padding:7px 14px; }
.cc-deal__expanded { margin-top:6px; background:var(--bg-card); border:1px solid var(--panel-border); padding:6px 8px; }
.cc-detail-row { display:flex; justify-content:space-between; padding:2px 0; }
.cc-detail-row + .cc-detail-row { border-top:1px solid var(--panel-border); }
.cc-empty { padding:30px 20px; text-align:center; font-family:var(--font-mono); font-size:9px; color:#6a6660; line-height:1.6; }

/* Content layout */
.ops-grid { display:flex; justify-content:center; gap:12px; align-items:flex-start; flex-wrap:wrap; }

@media (max-width: 768px) {
  .df-container { width:100%; }
  .ap-container { width:100%; }
  .rr-container { width:100%; }
  .cc-container { width:100%; }
  .rd-overlay { align-items:flex-start !important; padding:8px; overflow-y:auto; }
  .rd-modal { width:95vw !important; max-height:none !important; }
  .rd-body { flex-direction:column !important; overflow:visible !important; }
  .rd-left { overflow-y:visible !important; }
  .rd-right { width:100% !important; border-left:none !important; border-top:1px solid var(--panel-border); overflow-y:visible !important; }
}

/* Review Deal Modal */
.rd-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:500; align-items:center; justify-content:center; }
.rd-overlay.open { display:flex; }
.rd-modal { width:680px; max-height:92vh; background:var(--panel-main); border:1px solid var(--panel-border); display:flex; flex-direction:column; overflow-y:auto; }
.rd-header { padding:10px 16px; border-bottom:1px solid var(--panel-border); background:var(--bg-panel); flex-shrink:0; }
.rd-tabs { display:flex; gap:4px; margin-top:8px; }
.rd-tab { flex:1; text-align:center; padding:4px 0; font-family:var(--font-mono); font-size:8px; font-weight:700; cursor:pointer; border:1px solid var(--panel-border); border-bottom:2px solid transparent; color:#6a6660; background:transparent; }
.rd-tab.active-loan { color:#000; background:#5a8aaa; border-color:#5a8aaa; border-bottom-color:#5a8aaa; }
.rd-tab.active-insure { color:#000; background:#aa7a5a; border-color:#aa7a5a; border-bottom-color:#aa7a5a; }
.rd-tab.active-bond { color:#000; background:#8a6aaa; border-color:#8a6aaa; border-bottom-color:#8a6aaa; }
.rd-body { flex:1; display:flex; overflow:hidden; min-height:0; }
.rd-left { flex:1; border-right:1px solid var(--panel-border); overflow-y:auto; }
.rd-right { width:260px; display:flex; flex-direction:column; overflow-y:auto; }
.rd-section-bar { padding:6px 14px; border-bottom:1px solid var(--panel-border); background:var(--bg-panel); font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; }
.rd-applicant { padding:8px 14px; border-bottom:1px solid var(--panel-border); }
.rd-applicant__stats { display:flex; gap:0; background:var(--bg-panel); border:1px solid var(--panel-border); }
.rd-applicant__stat { flex:1; padding:4px 8px; text-align:center; }
.rd-applicant__stat + .rd-applicant__stat { border-left:1px solid var(--panel-border); }
.rd-applicant__stat-label { font-family:var(--font-mono); font-size:7px; color:#6a6660; letter-spacing:0.5px; }
.rd-applicant__stat-value { font-family:var(--font-mono); font-size:11px; font-weight:700; margin-top:1px; }
.rd-control { padding:10px 14px; border-bottom:1px solid var(--panel-border); }
.rd-control__header { display:flex; justify-content:space-between; margin-bottom:4px; }
.rd-control__label { font-family:var(--font-mono); font-size:9px; color:#6a6660; letter-spacing:0.8px; }
.rd-control__value { font-family:var(--font-mono); font-weight:700; }
.rd-control__range { width:100%; height:4; -webkit-appearance:none; appearance:none; background:transparent; outline:none; cursor:pointer; }
.rd-control__range::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:var(--panel-text); border:2px solid var(--panel-border); cursor:pointer; margin-top:-4px; }
.rd-control__range::-webkit-slider-runnable-track { height:4px; border-radius:2px; }
.rd-control__hints { display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:7px; color:#6a6660; margin-top:2px; }
.rd-presets { display:flex; gap:3px; }
.rd-preset { flex:1; text-align:center; padding:3px 0; font-family:var(--font-mono); font-size:8px; font-weight:700; cursor:pointer; border:1px solid var(--panel-border); color:#6a6660; background:transparent; }
.rd-risk-row { display:flex; justify-content:space-between; padding:4px 14px; border-bottom:1px solid var(--panel-border); }
.rd-risk-label { font-family:var(--font-mono); font-size:8px; color:#6a6660; letter-spacing:0.5px; }
.rd-risk-value { font-family:var(--font-mono); font-size:10px; font-weight:700; }
.rd-bar { width:100%; height:4px; background:var(--panel-border); }

.rd-expected.negative { background:rgba(204,85,85,0.03); }
.rd-formula { padding:3px 14px; border-bottom:1px solid var(--panel-border); font-family:var(--font-mono); font-size:7px; color:#6a6660; }
.rd-nation-stat { display:flex; align-items:center; gap:6px; padding:2px 0; }
.rd-footer { padding:10px 16px; border-top:1px solid var(--panel-border); background:var(--bg-panel); flex-shrink:0; display:flex; justify-content:space-between; align-items:center; }
.rd-footer__metric { }
.rd-footer__metric-label { font-family:var(--font-mono); font-size:7px; color:#6a6660; letter-spacing:0.8px; }
.rd-footer__metric-value { font-family:var(--font-mono); font-size:12px; font-weight:700; }
.rd-btn-decline { padding:6px 16px; font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:1px; color:#c55; border:1px solid rgba(204,85,85,0.27); background:transparent; cursor:pointer; }
.rd-btn-action { padding:6px 20px; font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:1px; color:#000; cursor:pointer; border:none; }
.rd-btn-action.loan { background:#5a8aaa; }
.rd-btn-action.insure { background:#aa7a5a; }
.rd-btn-action.bond { background:#8a6aaa; }

/* Faction dropdown */
.corp-faction-dropdown { display:none; position:absolute; top:100%; right:0; background:var(--bg-3); border:1px solid var(--border-1); z-index:100; min-width:200px; margin-top:4px; }
.corp-faction-dropdown.open { display:block; }
.corp-faction-dropdown__item { display:flex; align-items:center; gap:8px; padding:8px 12px; cursor:pointer; font-family:var(--font-mono); font-size:10px; color:var(--text-primary); border-bottom:1px solid var(--border-0); }
.corp-faction-dropdown__item:hover { background:var(--bg-hover); }
.corp-faction-dropdown__item.active { color:var(--teal); background:rgba(90,175,165,0.05); }

/* Responsive */
@media (max-width: 768px) {
  .top-bar { padding:6px 10px; }
  .tick-info { gap:8px; }
  .corp-hamburger { display:block; }
  .corp-nav { display:none; flex-direction:column; height:auto; padding:0; }
  .corp-nav.nav-open { display:flex; }
  .corp-nav.nav-open .corp-nav-tab { padding:10px 22px; border-bottom:none; border-left:2px solid transparent; }
  .corp-nav.nav-open .corp-nav-tab.active { border-left-color:var(--text-bright); border-bottom:none; }
}

<body>
<script src="js/corp-theme-init.js"></script>
  <!-- Shared top bar + nav (rendered by corp-topbar.js) -->
  <div id="corp-topbar-container"></div>

  <div class="content">
    <div id="operations-content" class="ops-grid">
      <div class="df-container" id="df-container"></div>
      <div class="ap-container" id="ap-container"></div>
      <div class="rr-container" id="rr-container"></div>
      <div class="cc-container" id="cc-container"></div>
    </div>
  </div>

  <!-- Review Deal Modal -->
  <div class="rd-overlay" id="rd-overlay" onclick="if(event.target===this)rdClose()">
    <div class="rd-modal" id="rd-modal"></div>
  </div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { escapeHtml, tickToDate } from './js/utils.js';

let allUserFactions = [];
let faction = null;
let nationStats = null;
let shard = null;
let _hasDeregulation = false; // Financial Sector Deregulation Act active
let _branchCount = 0;         // active branch_office properties owned by this corp

// ──────────────────────────────────────────────────────────────
// Deployable capital — single source of truth.
//
// Two gates both have to clear before the corp can underwrite more:
//   1. Reserve gate: cash must stay ≥ reserveReqPct × exposure
//      (15%, or 12% under Financial Sector Deregulation).
//   2. Lending-cap gate: deployed capital must stay ≤ a capped
//      fraction of TOTAL CAPITAL (cash + deployed) — 50% base +
//      15% per branch_office, max 100%. Measuring against total
//      capital rather than cash keeps the base invariant across an
//      origination, so loans don't cannibalise their own cap (see
//      the block comment on totalCapital below for why).
//
// Previously the Reserves & Risk card used the reserve gate alone
// while the loan validator used the lending-cap gate alone. A corp
// that looked like it had headroom on the card could still get
// blocked at offer time. Both callers now route through this helper,
// so the card and the validator can't disagree.
function computeDeployable(cash, portfolio, branchCount, hasDeregulation) {
    const loanExposure    = portfolio.filter(p => p.type === 'LOAN')  .reduce((s, p) => s + (p.remaining || 0), 0);
    const insureExposure  = portfolio.filter(p => p.type === 'INSURE').reduce((s, p) => s + (p.coverage  || 0), 0);
    const bondExposure    = portfolio.filter(p => p.type === 'BOND')  .reduce((s, p) => s + (p.faceValue || 0), 0);
    const totalExposure   = loanExposure + insureExposure + bondExposure;
    // Deployed capital for the lending-cap check uses the CURRENTLY
    // outstanding figure per position — principal minus repayments for
    // loans, current coverage for insurance, face value for bonds. Prior
    // code used p.principal here, which counted the ORIGINAL loan amount
    // forever; a $50M loan repaid down to $10M was still taking $50M of
    // cap, so partial repayments never freed any headroom. Borrowers
    // paying down = both cash-in AND exposure-out; both now flow through.
    const totalDeployed   = portfolio.reduce((s, p) => {
        if (p.type === 'LOAN')   return s + (Number(p.remaining) || 0);
        if (p.type === 'INSURE') return s + (Number(p.coverage)  || 0);
        if (p.type === 'BOND')   return s + (Number(p.faceValue) || Number(p.principal) || 0);
        return s;
    }, 0);

    const reserveReqPct   = hasDeregulation ? 0.12 : 0.15;
    const requiredReserve = Math.round(totalExposure * reserveReqPct);
    const reserveAvail    = Math.max(0, cash - requiredReserve);

    // Lending cap is a fraction of TOTAL CAPITAL (cash + deployed), not
    // just cash. Prior code used `cash × pct`, but the server deducts
    // loan principal from the lender's cash the moment a borrower
    // accepts (see corp-dashboard.html acceptOffer). Cash shrinks and
    // deployed grows by the same amount, so the old formula's cap
    // shrank alongside every loan — a single leveraged origination
    // could trap the corp below its own cap until repayments
    // rebuilt cash. Summing cash + totalDeployed makes the base
    // invariant across a loan origination (it's a zero-sum shift on the
    // balance sheet), so the cap reflects the corp's true capacity to
    // underwrite rather than eating itself every time a loan goes out.
    const totalCapital    = cash + totalDeployed;
    const lendingCapPct   = Math.min(100, 50 + (branchCount || 0) * 15);
    const lendingCap      = Math.round(totalCapital * lendingCapPct / 100);
    const capAvail        = Math.max(0, lendingCap - totalDeployed);

    const deployable      = Math.min(reserveAvail, capAvail);
    const limiter         = capAvail < reserveAvail ? 'lending_cap' : 'reserve_ratio';

    return {
        cash, totalExposure, totalDeployed,
        loanExposure, insureExposure, bondExposure,
        reserveReqPct, requiredReserve, reserveAvail,
        lendingCapPct, lendingCap, capAvail,
        deployable, limiter,
    };
}

function fmtMoney(n) {
    if (Math.abs(n) >= 1_000_000) return '$' + (n / 1_000_000).toFixed(1) + 'M';
    if (Math.abs(n) >= 1000) return '$' + (n / 1000).toFixed(0) + 'k';
    return '$' + Math.round(n).toLocaleString();
}

// ==================== DEAL FLOW ====================

const DF_TYPE_META = {
    LOAN:   { class: 'loan',   label: 'LOAN' },
    INSURE: { class: 'insure', label: 'INSURE' },
    BOND:   { class: 'bond',   label: 'BOND' },
};
const DF_RISK_META = {
    LOW:      { class: 'df-risk-low',      label: 'LOW RISK' },
    MODERATE: { class: 'df-risk-moderate',  label: 'MODERATE' },
    ELEVATED: { class: 'df-risk-elevated',  label: 'ELEVATED' },
    HIGH:     { class: 'df-risk-high',      label: 'HIGH RISK' },
};

// Deal data — loaded from finance_loan_requests
let dfDeals = [];

let dfFilter = 'ALL';
let dfNationFilter = 'all'; // 'all' or 'mine'
let dfSelected = -1;

async function loadDealFlow() {
    if (!faction || !shard) return;
    // Load all open requests across the shard (loans + bonds + insurance)
    const { data: requests, error: reqErr } = await _supabase
        .from('finance_loan_requests')
        .select('*, requesting_faction:factions!requesting_faction_id(id, faction_name, abbreviation, corp_ticker, corp_subsector, nation_id, corp_cash_reserves, corp_debt, corp_reputation), issuer_nation:nations!issuer_nation_id(id, name, stability, credit, debt, gdp, gdp_growth, corruption)')
        .eq('status', 'open')
        .order('created_tick', { ascending: false });
    if (reqErr) console.error('[DealFlow] Request query error:', reqErr.message);

    // Fetch nation stats for borrower corps (stability, credit, gdp for risk assessment)
    const borrowerNationIds = [...new Set((requests || []).filter(r => r.requesting_faction?.nation_id).map(r => r.requesting_faction.nation_id))];
    let borrowerNations = {};
    if (borrowerNationIds.length > 0) {
        const { data: bNations } = await _supabase
            .from('nations')
            .select('id, name, stability, credit, gdp, gdp_growth, corruption, debt')
            .in('id', borrowerNationIds);
        for (const n of (bNations || [])) borrowerNations[n.id] = n;
    }

    // Check which requests this corp already made an offer on
    const { data: myOffers } = await _supabase
        .from('finance_loan_offers')
        .select('request_id')
        .eq('offering_faction_id', faction.id);
    const offeredSet = new Set((myOffers || []).map(o => o.request_id));

    // Fetch active loan counts + total outstanding per borrower faction
    const borrowerFactionIds = [...new Set((requests || []).filter(r => r.requesting_faction?.id).map(r => r.requesting_faction.id))];
    let borrowerLoanData = {}; // factionId → { count, totalOutstanding }
    if (borrowerFactionIds.length > 0) {
        const { data: activeLoans } = await _supabase
            .from('finance_active_loans')
            .select('borrower_faction_id, principal, total_paid')
            .in('borrower_faction_id', borrowerFactionIds)
            .in('status', ['current', 'late', 'delinquent']);
        for (const loan of (activeLoans || [])) {
            if (!borrowerLoanData[loan.borrower_faction_id]) {
                borrowerLoanData[loan.borrower_faction_id] = { count: 0, totalOutstanding: 0 };
            }
            borrowerLoanData[loan.borrower_faction_id].count++;
            const outstanding = Math.max(0, Number(loan.principal || 0) - Number(loan.total_paid || 0));
            borrowerLoanData[loan.borrower_faction_id].totalOutstanding += outstanding;
        }
        // Also check auto-rate loan policies
        const { data: autoPolicies } = await _supabase
            .from('subsidiary_auto_policies')
            .select('borrower_faction_id, principal, remaining_principal')
            .in('borrower_faction_id', borrowerFactionIds)
            .eq('service_type', 'loan')
            .eq('status', 'active');
        for (const p of (autoPolicies || [])) {
            if (!borrowerLoanData[p.borrower_faction_id]) {
                borrowerLoanData[p.borrower_faction_id] = { count: 0, totalOutstanding: 0 };
            }
            borrowerLoanData[p.borrower_faction_id].count++;
            borrowerLoanData[p.borrower_faction_id].totalOutstanding += Number(p.remaining_principal || p.principal || 0);
        }
    }

    const subsector = (faction.corp_subsector || '').toLowerCase();

    dfDeals = (requests || []).filter(req => {
        // Banking sees loans, Investment sees bonds, Insurance sees insurance
        if (req.request_type === 'bond') return subsector === 'investment';
        if (req.request_type === 'insurance') return subsector === 'insurance';
        return subsector === 'banking';
    }).map(req => {
        if (req.request_type === 'bond') {
            const n = req.issuer_nation;
            const stability = Number(n?.stability ?? 50);
            const creditRating = Number(n?.credit ?? 50);
            const gdp = Number(n?.gdp ?? 1);
            const debt = Number(n?.debt ?? 0);
            const debtToGdp = gdp > 0 ? Math.round((debt / gdp) * 100) : 0;
            return {
                id: req.id,
                type: 'BOND',
                applicant: n?.name || 'Unknown Nation',
                abbr: (n?.name || '??').slice(0, 3).toUpperCase(),
                entity: 'GOV',
                nation: n?.name || 'N/A',
                nation_id: req.issuer_nation_id,
                amount: req.amount || 0,
                term: req.term_months,
                couponRate: Number(req.coupon_rate || 5),
                purpose: req.purpose || 'Government Bond',
                stability,
                creditRating,
                debtToGdp,
                gdpGrowth: Number(n?.gdp_growth ?? 50),
                corruption: Number(n?.corruption ?? 50),
                risk: stability >= 60 && creditRating >= 50 ? 'LOW'
                    : stability >= 35 && creditRating >= 30 ? 'MODERATE'
                    : 'HIGH',
                isNew: !offeredSet.has(req.id),
                ticksLeft: (req.expires_tick || 0) - (shard?.current_tick || 0),
                requestId: req.id,
                alreadyOffered: offeredSet.has(req.id),
            };
        }
        if (req.request_type === 'insurance') {
            const insRep = Number(req.requesting_faction?.corp_reputation ?? 50);
            const insStability = Number(borrowerNations[req.requesting_faction?.nation_id]?.stability ?? 50);
            return {
                id: req.id,
                type: 'INSURE',
                applicant: req.requesting_faction?.faction_name || 'Unknown',
                abbr: req.requesting_faction?.abbreviation || req.requesting_faction?.corp_ticker || '??',
                entity: 'CORP',
                nation: borrowerNations[req.requesting_faction?.nation_id]?.name || 'N/A',
                nation_id: req.requesting_faction?.nation_id,
                amount: req.amount || 0,
                term: req.term_months || 0,
                purpose: req.purpose || 'Construction Insurance',
                reputation: insRep,
                projectValue: req.amount || 0,
                stability: insStability,
                risk: insRep >= 60 && insStability >= 50 ? 'LOW' : insRep >= 35 ? 'MODERATE' : 'HIGH',
                isNew: !offeredSet.has(req.id),
                ticksLeft: (req.expires_tick || 0) - (shard?.current_tick || 0),
                requestId: req.id,
                insuredContractId: req.insured_contract_id,
                insuredVesselId: req.insured_vessel_id,
                isVesselInsurance: !!req.insured_vessel_id,
                alreadyOffered: offeredSet.has(req.id),
                requestingFactionId: req.requesting_faction?.id,
            };
        }
        return {
            id: req.id,
            type: 'LOAN',
            applicant: req.requesting_faction?.faction_name || 'Unknown',
            abbr: req.requesting_faction?.abbreviation || req.requesting_faction?.corp_ticker || '??',
            entity: 'CORP',
            nation: borrowerNations[req.requesting_faction?.nation_id]?.name || 'N/A',
            nation_id: req.requesting_faction?.nation_id,
            requestingFactionId: req.requesting_faction?.id,
            amount: req.amount,
            term: req.term_months,
            purpose: req.purpose || '',
            reputation: Number(req.requesting_faction?.corp_reputation ?? 50),
            revenue: Number(req.requesting_faction?.corp_cash_reserves ?? 0),
            corp_cash_reserves: Number(req.requesting_faction?.corp_cash_reserves ?? 0),
            corp_debt: Number(req.requesting_faction?.corp_debt ?? 0),
            activeLoans: (borrowerLoanData[req.requesting_faction?.id] || {}).count || 0,
            totalOutstanding: (borrowerLoanData[req.requesting_faction?.id] || {}).totalOutstanding || 0,
            creditRating: Number(borrowerNations[req.requesting_faction?.nation_id]?.credit ?? 50),
            stability: Number(borrowerNations[req.requesting_faction?.nation_id]?.stability ?? 50),
            risk: (() => {
                const cr = Number(borrowerNations[req.requesting_faction?.nation_id]?.credit ?? 50);
                const rep = Number(req.requesting_faction?.corp_reputation ?? 50);
                if (cr >= 60 && rep >= 60) return 'LOW';
                if (cr >= 35 && rep >= 35) return 'MODERATE';
                if (cr >= 20 || rep >= 20) return 'ELEVATED';
                return 'HIGH';
            })(),
            isNew: !offeredSet.has(req.id),
            ticksLeft: (req.expires_tick || 0) - (shard?.current_tick || 0),
            collateral: req.collateral_type || 'unsecured',
            requestId: req.id,
            alreadyOffered: offeredSet.has(req.id),
        };
    });
    renderDealFlow();
}

function dfCanReview(deal) {
    if (!faction) return false;
    const subsector = (faction.corp_subsector || '').toLowerCase();
    const allowedType = SUBSECTOR_DEAL_MAP[subsector];
    return deal.type === allowedType;
}

function dfSetFilter(type) {
    dfFilter = type;
    dfSelected = -1;
    renderDealFlow();
}

function dfSelectDeal(idx) {
    dfSelected = dfSelected === idx ? -1 : idx;
    renderDealFlow();
}

function renderDealFlow() {
    const container = document.getElementById('df-container');
    if (!container) return;

    let deals = dfFilter === 'ALL' ? dfDeals : dfDeals.filter(d => d.type === dfFilter);
    if (dfNationFilter === 'mine' && faction?.nation_id) {
        deals = deals.filter(d => d.nation_id === faction.nation_id);
    }
    const newCount = dfDeals.filter(d => d.isNew).length;
    const totalCount = dfDeals.length;

    // Header
    let html = `<div class="df-header">
        <div class="df-header__left">
            <span class="df-header__dot">&#9679;</span>
            <span class="df-header__title">Deal Flow</span>
        </div>
        <div style="display:flex;gap:6px;align-items:center;">
            ${newCount > 0 ? `<span class="df-badge df-badge-corp">${newCount} NEW</span>` : ''}
            <span style="font-family:var(--font-mono);font-size:12px;color:#6a6660;">${totalCount} OPEN</span>
        </div>
    </div>`;

    // Filter bar
    const filters = [
        { id: 'ALL', label: 'All', activeClass: 'active-all' },
        { id: 'LOAN', label: 'Loans', activeClass: 'active-loan' },
        { id: 'INSURE', label: 'Insurance', activeClass: 'active-insure' },
        { id: 'BOND', label: 'Bonds', activeClass: 'active-bond' },
    ];
    html += '<div class="df-filters">';
    for (const f of filters) {
        html += `<span class="df-pill${dfFilter === f.id ? ' ' + f.activeClass : ''}" onclick="dfSetFilter('${f.id}')">${f.label}</span>`;
    }
    html += `<span style="margin-left:auto;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:0.5px;cursor:pointer;padding:6px 10px;border:1px solid ${dfNationFilter === 'mine' ? '#5c544' : 'var(--panel-border)'};color:${dfNationFilter === 'mine' ? '#5c5' : '#6a6660'};background:${dfNationFilter === 'mine' ? 'rgba(92,204,92,0.06)' : 'transparent'};" onclick="dfToggleNation()">${dfNationFilter === 'mine' ? 'MY NATION' : 'ALL NATIONS'}</span>`;
    html += '</div>';

    // Deal list
    html += '<div class="df-list">';
    if (deals.length === 0) {
        html += '<div class="ap-empty">No deals available.<br>Deals appear when corporations request financing or governments issue bonds.</div>';
    }
    for (let i = 0; i < deals.length; i++) {
        const d = deals[i];
        const globalIdx = dfDeals.indexOf(d);
        const isSel = dfSelected === globalIdx;
        const tm = DF_TYPE_META[d.type];
        const rm = DF_RISK_META[d.risk];
        const canReview = dfCanReview(d);

        html += `<div class="df-deal${isSel ? ' sel-' + tm.class : ''}" onclick="dfSelectDeal(${globalIdx})" style="${canReview ? '' : 'opacity:0.5;'}">`;

        // New dot
        if (d.isNew && canReview) html += '<div class="df-new-dot"></div>';

        // Row 1: type badge + applicant + entity + lock if mismatched
        html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px;">
            <span class="df-badge df-badge-${tm.class}">${tm.label}</span>
            <span style="font-size:15px;font-weight:600;color:var(--panel-text);">${escapeHtml(d.applicant)}</span>
            <span class="df-badge df-badge-${d.entity.toLowerCase()}">${d.entity}</span>
            ${canReview ? '' : '<span style="font-family:var(--font-mono);font-size:10px;color:#6a6660;margin-left:auto;">&#128274;</span>'}
        </div>`;

        // Row 2: nation + risk
        const riskColor = rm.class === 'df-risk-low' ? '#5c5' : rm.class === 'df-risk-moderate' ? '#ca5' : rm.class === 'df-risk-elevated' ? '#c84' : '#c55';
        html += `<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;">
            <span class="df-badge df-badge-nation">${escapeHtml(d.nation.toUpperCase())}</span>
            <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;padding:2px 7px;line-height:16px;color:${riskColor};background:${riskColor}12;border:1px solid ${riskColor}25;">${rm.label}</span>
        </div>`;

        // Row 3: metrics
        const amountLabel = d.type === 'BOND' ? 'FACE VALUE' : d.type === 'INSURE' ? 'COVERAGE' : 'AMOUNT';
        const qualLabel = d.type === 'BOND' ? 'COUPON' : 'REP';
        const qualValue = d.type === 'BOND' ? d.couponRate + '%' : (d.reputation || d.stability);
        const qualNum = d.type === 'BOND' ? d.couponRate * 10 : (d.reputation || d.stability);
        const qualColor = d.type === 'BOND' ? '#c8a832' : qualNum >= 60 ? '#5c5' : qualNum >= 35 ? '#ca5' : '#c84';

        html += `<div class="df-metrics">
            <div style="flex:1;">
                <div class="df-metrics__label">${amountLabel}</div>
                <div class="df-metrics__value" style="font-size:15px;color:var(--panel-text);">${fmtMoney(d.amount)}</div>
            </div>
            <div style="flex:0.7;text-align:center;">
                <div class="df-metrics__label">TERM</div>
                <div class="df-metrics__value" style="font-size:14px;color:var(--panel-text);">${d.term}mo</div>
            </div>
            <div style="flex:0.8;text-align:center;">
                <div class="df-metrics__label">${qualLabel}</div>
                <div class="df-metrics__value" style="font-size:14px;color:${qualColor};">${qualValue}</div>
            </div>
        </div>`;

        // Expanded detail
        if (isSel) {
            html += `<div style="margin-top:8px;font-size:13px;color:#9e9a92;line-height:1.5;margin-bottom:8px;">${escapeHtml(d.purpose)}</div>`;

            if (!canReview) {
                const neededSub = d.type === 'LOAN' ? 'Banking' : d.type === 'INSURE' ? 'Insurance' : 'Investment';
                html += `<div style="padding:8px 10px;background:rgba(106,102,96,0.06);border:1px solid var(--panel-border);font-family:var(--font-mono);font-size:11px;color:#6a6660;line-height:1.5;">
                    &#128274; Requires <span style="color:var(--panel-text);font-weight:700;">${neededSub}</span> subsector to underwrite.
                    ${faction?.corp_subsector ? 'Your subsector: <span style="color:#aa7a5a;">' + escapeHtml(faction.corp_subsector) + '</span>.' : ''}
                    Establish a subsidiary with this subsector to access these deals.
                </div>`;
            } else {
                html += '<div class="df-detail">';
            }

            if (canReview) {
                if (d.type === 'LOAN') {
                    const dtrPct = d.corp_cash_reserves > 0 ? Math.round((d.corp_debt / d.corp_cash_reserves) * 100) : 0;
                    const dtrColor = dtrPct > 50 ? '#c84' : '#5c5';
                    const debtColor = d.corp_debt > d.corp_cash_reserves * 0.5 ? '#c84' : '#9e9a92';
                    html += `<div class="df-detail-row"><span class="df-detail-label">CASH</span><span class="df-detail-value" style="color:#9e9a92;">${fmtMoney(d.corp_cash_reserves)}</span></div>`;
                    html += `<div class="df-detail-row"><span class="df-detail-label">DEBT</span><span class="df-detail-value" style="color:${debtColor};">${fmtMoney(d.corp_debt)}</span></div>`;
                    html += `<div class="df-detail-row"><span class="df-detail-label">DEBT/CASH</span><span class="df-detail-value" style="color:${dtrColor};font-weight:700;">${dtrPct}%</span></div>`;
                } else if (d.type === 'BOND') {
                    const stabColor = d.stability >= 50 ? '#5c5' : d.stability >= 30 ? '#ca5' : '#c84';
                    const dtgColor = d.debtToGdp > 60 ? '#c55' : d.debtToGdp > 40 ? '#c84' : '#5c5';
                    const crColor = d.creditRating >= 60 ? '#5c5' : d.creditRating >= 35 ? '#ca5' : '#c55';
                    html += `<div class="df-detail-row"><span class="df-detail-label">STABILITY</span><span class="df-detail-value" style="color:${stabColor};">${d.stability}/100</span></div>`;
                    html += `<div class="df-detail-row"><span class="df-detail-label">DEBT/GDP</span><span class="df-detail-value" style="color:${dtgColor};">${d.debtToGdp}%</span></div>`;
                    html += `<div class="df-detail-row"><span class="df-detail-label">CREDIT RATING</span><span class="df-detail-value" style="color:${crColor};font-weight:700;">${d.creditRating}/100</span></div>`;
                } else if (d.type === 'INSURE') {
                    const repColor = d.reputation >= 60 ? '#5c5' : d.reputation >= 35 ? '#ca5' : '#c84';
                    const assetLabel = d.projectValue ? 'PROJECT VALUE' : 'FLEET VALUE';
                    const assetValue = d.projectValue || d.fleetValue;
                    html += `<div class="df-detail-row"><span class="df-detail-label">REPUTATION</span><span class="df-detail-value" style="color:${repColor};">${d.reputation}/100</span></div>`;
                    html += `<div class="df-detail-row"><span class="df-detail-label">${assetLabel}</span><span class="df-detail-value" style="color:#9e9a92;">${fmtMoney(assetValue)}</span></div>`;
                }
                html += '</div>'; // close df-detail
            }
        }

        html += '</div>'; // close df-deal
    }
    html += '</div>'; // close df-list

    // Footer
    const loanCount = dfDeals.filter(d => d.type === 'LOAN').length;
    const insureCount = dfDeals.filter(d => d.type === 'INSURE').length;
    const bondCount = dfDeals.filter(d => d.type === 'BOND').length;

    html += `<div class="df-footer">
        <div class="df-footer__counts">
            <div class="df-footer__count"><div class="df-footer__count-dot" style="background:#5a8aaa;"></div><span class="df-footer__count-label">LOAN</span><span class="df-footer__count-num">${loanCount}</span></div>
            <div class="df-footer__count"><div class="df-footer__count-dot" style="background:#aa7a5a;"></div><span class="df-footer__count-label">INSURE</span><span class="df-footer__count-num">${insureCount}</span></div>
            <div class="df-footer__count"><div class="df-footer__count-dot" style="background:#8a6aaa;"></div><span class="df-footer__count-label">BOND</span><span class="df-footer__count-num">${bondCount}</span></div>
        </div>
        ${(() => {
            const selDeal = dfSelected >= 0 ? dfDeals[dfSelected] : null;
            const canRev = selDeal && dfCanReview(selDeal);
            if (canRev) {
                return `<div class="df-review-btn active" onclick="rdOpen(${dfSelected})">REVIEW DEAL</div>`;
            } else if (selDeal && !canRev) {
                return `<div class="df-review-btn" style="opacity:0.4;cursor:not-allowed;" title="Requires matching subsector">&#128274; LOCKED</div>`;
            } else {
                return `<div class="df-review-btn">REVIEW DEAL</div>`;
            }
        })()}
    </div>`;

    container.innerHTML = html;
}

const AP_STATUS_META = {

    DELINQUENT: { color: '#c55', label: 'DELINQUENT' },

    ACTIVE:     { color: '#5c5', label: 'ACTIVE' },
    WATCHLIST:  { color: '#ca5', label: 'WATCHLIST' },
    DEFAULT:    { color: '#c55', label: 'DEFAULT' },
};

// Portfolio data — populated from DB when deal system is wired
let apPortfolio = [];
let apFilter = 'ALL';
let apExpanded = -1;

function apSetFilter(type) {
    apFilter = type;
    apExpanded = -1;

function apToggle(idx) {

function renderActivePortfolio() {

    const deals = apFilter === 'ALL' ? apPortfolio : apPortfolio.filter(d => d.type === apFilter);

// ── Portfolio Action Handlers ──

async function apRestructure(loanId) {
    const newRate = prompt('RESTRUCTURE LOAN\n\nEnter new annual interest rate (1-20%):\n(This extends the term by 12 months and resets missed payments.)');
    if (!newRate) return;
    const rate = parseFloat(newRate);
    if (isNaN(rate) || rate < 1 || rate > 20) { alert('Rate must be between 1% and 20%.'); return; }

    const { data: loan } = await _supabase.from('finance_active_loans').select('*').eq('id', loanId).single();
    if (!loan) { alert('Loan not found.'); return; }

    const newTerm = loan.term_months + 12;
    const monthlyRate = rate / 100 / 12;
    const remaining = Number(loan.remaining_principal ?? Math.max(0, Number(loan.principal || 0) - Number(loan.total_paid || 0)));
    const newPayment = monthlyRate > 0
        ? Math.round(remaining * (monthlyRate * Math.pow(1 + monthlyRate, newTerm)) / (Math.pow(1 + monthlyRate, newTerm) - 1))
        : Math.round(remaining / newTerm);

    if (!confirm(`Restructure to ${rate}% over ${newTerm} months?\nNew monthly payment: ${fmtMoney(newPayment)}\nMissed payments reset to 0.`)) return;

    const { error } = await _supabase.from('finance_active_loans').update({
        interest_rate: rate,
        term_months: newTerm,
        monthly_payment: newPayment,
        payments_missed: 0,
        status: 'current',
    }).eq('id', loanId);

    if (error) { alert('Failed: ' + error.message); return; }
    alert('Loan restructured.');
    await loadActivePortfolio();
    renderActivePortfolio();
}

async function apCallLoan(loanId) {
    if (!confirm('CALL LOAN\n\nDemand immediate full repayment of remaining principal.\nThe borrower will have 3 ticks to pay or default.\n\nProceed?')) return;

    const { error } = await _supabase.from('finance_active_loans').update({
        status: 'delinquent',
        payments_missed: 3, // one more miss → default with collateral recovery
    }).eq('id', loanId);

    if (error) { alert('Failed: ' + error.message); return; }
    alert('Loan called. Borrower has 1 tick to pay before default.');
    await loadActivePortfolio();
    renderActivePortfolio();
}

async function apForeclose(loanId) {
    if (!confirm('FORECLOSE\n\nImmediately default the loan and seize collateral.\nCollateral recovery: Equipment 60%, Property 75%, Unsecured 0%.\n\nThis cannot be undone. Proceed?')) return;

    const { data: loan } = await _supabase.from('finance_active_loans').select('*').eq('id', loanId).single();
    if (!loan) { alert('Loan not found.'); return; }

    const remaining = Number(loan.remaining_principal ?? Math.max(0, Number(loan.principal || 0) - Number(loan.total_paid || 0)));
    let recovery = 0;
    if (loan.collateral_type === 'equipment') recovery = 0.6;
    else if (loan.collateral_type === 'property') recovery = 0.75;

    const recoveredAmount = Math.round(remaining * recovery);

    // Credit recovery to lender
    if (recoveredAmount > 0) {
        const { data: lender } = await _supabase.from('factions').select('corp_cash_reserves').eq('id', faction.id).single();
        await _supabase.from('factions').update({
            corp_cash_reserves: Number(lender?.corp_cash_reserves || 0) + recoveredAmount
        }).eq('id', faction.id);
        faction.corp_cash_reserves = Number(lender?.corp_cash_reserves || 0) + recoveredAmount;
    }

    await _supabase.from('finance_active_loans').update({
        status: 'defaulted',
        completed_tick: shard?.current_tick || 0,
    }).eq('id', loanId);

    alert('Foreclosed. Recovered: ' + fmtMoney(recoveredAmount) + ' from ' + (loan.collateral_type || 'unsecured') + ' collateral.');
    await loadActivePortfolio();
    renderActivePortfolio();
}

async function apPayClaim(loanId) {
    const { data: policy } = await _supabase.from('finance_active_loans').select('*').eq('id', loanId).single();
    if (!policy) { alert('Policy not found.'); return; }

    const claimAmount = Number(policy.principal || 0) - Number(policy.claims_paid || 0);
    const deductible = Number(policy.deductible_pct || 0) / 100;
    const payout = Math.round(claimAmount * (1 - deductible));

    if (!confirm(`PAY CLAIM IN FULL\n\nClaim: ${fmtMoney(claimAmount)}\nDeductible: ${policy.deductible_pct}%\nPayout: ${fmtMoney(payout)}\n\nThis will be deducted from your cash reserves.`)) return;

    const { data: lender } = await _supabase.from('factions').select('corp_cash_reserves').eq('id', faction.id).single();
    const cash = Number(lender?.corp_cash_reserves || 0);
    if (cash < payout) { alert('Insufficient funds. You have ' + fmtMoney(cash) + '.'); return; }

    // Deduct from insurer
    await _supabase.from('factions').update({ corp_cash_reserves: cash - payout }).eq('id', faction.id);
    faction.corp_cash_reserves = cash - payout;

    // Credit to policyholder
    const { data: holder } = await _supabase.from('factions').select('corp_cash_reserves').eq('id', policy.borrower_faction_id).single();
    if (holder) {
        await _supabase.from('factions').update({
            corp_cash_reserves: Number(holder.corp_cash_reserves || 0) + payout
        }).eq('id', policy.borrower_faction_id);
    }

    // Update policy
    await _supabase.from('finance_active_loans').update({
        claims_paid: Number(policy.claims_paid || 0) + payout,
        claims_count: (policy.claims_count || 0) + 1,
    }).eq('id', loanId);

    alert('Claim paid: ' + fmtMoney(payout));
    await loadActivePortfolio();
    renderActivePortfolio();
}

async function apNegotiateClaim(loanId) {
    const pctStr = prompt('NEGOTIATE CLAIM\n\nOffer a percentage of the claim to settle (10-90%):\n(Policyholder may reject low offers.)');
    if (!pctStr) return;
    const pct = parseInt(pctStr);
    if (isNaN(pct) || pct < 10 || pct > 90) { alert('Must be between 10% and 90%.'); return; }

    // Simulate acceptance: higher offers more likely accepted
    const acceptChance = pct / 100;
    const accepted = Math.random() < acceptChance;

    if (!accepted) {
        alert('Offer rejected. The policyholder wants a higher settlement.');
        return;
    }

    const { data: policy } = await _supabase.from('finance_active_loans').select('*').eq('id', loanId).single();
    if (!policy) return;

    const fullClaim = Number(policy.principal || 0) - Number(policy.claims_paid || 0);
    const payout = Math.round(fullClaim * pct / 100);

    const { data: lender } = await _supabase.from('factions').select('corp_cash_reserves').eq('id', faction.id).single();
    const cash = Number(lender?.corp_cash_reserves || 0);
    if (cash < payout) { alert('Insufficient funds.'); return; }

    await _supabase.from('factions').update({ corp_cash_reserves: cash - payout }).eq('id', faction.id);
    faction.corp_cash_reserves = cash - payout;

    const { data: holder } = await _supabase.from('factions').select('corp_cash_reserves').eq('id', policy.borrower_faction_id).single();
    if (holder) {
        await _supabase.from('factions').update({
            corp_cash_reserves: Number(holder.corp_cash_reserves || 0) + payout
        }).eq('id', policy.borrower_faction_id);
    }

    await _supabase.from('finance_active_loans').update({
        claims_paid: Number(policy.claims_paid || 0) + payout,
        claims_count: (policy.claims_count || 0) + 1,
        status: 'repaid', // settled
    }).eq('id', loanId);

    alert('Claim settled at ' + pct + '% (' + fmtMoney(payout) + '). Policy closed.');
    await loadActivePortfolio();
    renderActivePortfolio();
}

async function apDisputeClaim(loanId) {
    if (!confirm('DISPUTE CLAIM\n\nChallenge the validity of this claim.\nThis freezes the claim for 4 ticks while investigated.\nIf investigation finds the claim valid, you pay in full + 10% penalty.\nIf investigation finds fraud, claim is dismissed.\n\nDispute?')) return;

    // Simple resolution: 70% chance claim is valid, 30% fraud
    // Resolution happens immediately for now (future: delay 4 ticks)
    const isValid = Math.random() < 0.7;

    if (isValid) {
        alert('Investigation complete: claim is VALID.\nYou must now pay the full claim.');
        // Pay in full happens on next portfolio action
    } else {
        await _supabase.from('finance_active_loans').update({
            status: 'repaid', // dismissed
            claims_count: (0), // fraud claim not counted
        }).eq('id', loanId);
        alert('Investigation complete: FRAUDULENT CLAIM detected.\nClaim dismissed. Policy remains active.');
    }
    await loadActivePortfolio();
    renderActivePortfolio();
}

async function apSellPosition(loanId) {
    const { data: position } = await _supabase.from('finance_active_loans').select('*').eq('id', loanId).single();
    if (!position) { alert('Position not found.'); return; }

    const remaining = Number(position.remaining_principal ?? Math.max(0, Number(position.principal || 0) - Number(position.total_paid || 0)));
    const marketValue = Math.round(remaining * 0.85); // 15% discount for secondary market

    if (!confirm(`SELL POSITION\n\nRemaining value: ${fmtMoney(remaining)}\nMarket price (85%): ${fmtMoney(marketValue)}\n\nYou receive ${fmtMoney(marketValue)} immediately.\nThe position is removed from your portfolio.`)) return;

    // Credit sale proceeds
    const { data: lender } = await _supabase.from('factions').select('corp_cash_reserves').eq('id', faction.id).single();
    await _supabase.from('factions').update({
        corp_cash_reserves: Number(lender?.corp_cash_reserves || 0) + marketValue
    }).eq('id', faction.id);
    faction.corp_cash_reserves = Number(lender?.corp_cash_reserves || 0) + marketValue;

    // Mark as sold
    await _supabase.from('finance_active_loans').update({
        status: 'repaid',
        completed_tick: shard?.current_tick || 0,
    }).eq('id', loanId);

    alert('Position sold for ' + fmtMoney(marketValue) + '.');
    await loadActivePortfolio();
    renderActivePortfolio();
}

function rrSegBar(segments, h) {
    const total = segments.reduce((a, s) => a + s.value, 0);
    if (total === 0) return `<div class="rr-seg-bar" style="height:${h}px;background:var(--panel-border);"></div>`;
    return `<div class="rr-seg-bar" style="height:${h}px;">${segments.map(s =>
        `<div style="width:${(s.value / total * 100).toFixed(1)}%;height:100%;background:${s.color};"></div>`
    ).join('')}</div>`;
}

function renderReservesRisk() {
    const container = document.getElementById('rr-container');
    if (!container) return;

    // One source of truth — same helper the loan-offer validator uses, so
    // the card can't claim headroom the validator will reject.
    const cash = Number(faction?.corp_cash_reserves) || 0;
    const cap = computeDeployable(cash, apPortfolio, _branchCount, _hasDeregulation);
    const {
        totalExposure, requiredReserve, reserveReqPct,
        loanExposure, insureExposure, bondExposure,
        lendingCapPct, lendingCap, totalDeployed,
        deployable: availableCapital, limiter,
    } = cap;
    const deployed = totalExposure;
    const totalAssets = cash + deployed;
    const reserveRatio = totalExposure > 0 ? Math.round((cash / totalExposure) * 100) : 100;
    const minRatioPct = Math.round(reserveReqPct * 100);
    const reserveHealth = reserveRatio >= 30 ? 'HEALTHY' : reserveRatio >= 20 ? 'ADEQUATE' : reserveRatio >= minRatioPct ? 'THIN' : 'CRITICAL';
    const reserveColor = reserveRatio >= 30 ? '#5c5' : reserveRatio >= 20 ? '#ca5' : reserveRatio >= minRatioPct ? '#c84' : '#c55';

    // Concentration by nation
    const nationMap = {};
    for (const p of apPortfolio) {
        const n = p.nation || 'Unknown';
        const exp = p.remaining || p.coverage || p.faceValue || 0;
        nationMap[n] = (nationMap[n] || 0) + exp;
    }
    const nationConc = Object.entries(nationMap)
        .map(([name, exposure]) => ({ name, exposure, pct: totalExposure > 0 ? Math.round(exposure / totalExposure * 100) : 0 }))
        .sort((a, b) => b.exposure - a.exposure);

    // Concentration by sector
    const sectorMap = {};
    for (const p of apPortfolio) {
        const sec = p.type === 'BOND' ? 'Government' : p.sector || 'Other';
        const exp = p.remaining || p.coverage || p.faceValue || 0;
        sectorMap[sec] = (sectorMap[sec] || 0) + exp;
    }
    const sectorConc = Object.entries(sectorMap)
        .map(([name, exposure]) => ({ name, exposure, pct: totalExposure > 0 ? Math.round(exposure / totalExposure * 100) : 0 }))
        .sort((a, b) => b.exposure - a.exposure);

    const topNationPct = nationConc.length > 0 ? nationConc[0].pct : 0;
    const concRisk = topNationPct > 60 ? 'HIGH' : topNationPct > 40 ? 'MODERATE' : 'LOW';
    const concColor = concRisk === 'HIGH' ? '#c55' : concRisk === 'MODERATE' ? '#ca5' : '#5c5';

    // ── Header ──
    let html = `<div class="df-header">
        <div class="df-header__left">
            <span class="df-header__dot">&#9679;</span>
            <span class="df-header__title">Reserves & Risk</span>
        </div>
        <span style="font-family:var(--font-mono);font-size:8px;font-weight:700;padding:1px 6px;color:${reserveColor};background:${reserveColor}12;border:1px solid ${reserveColor}25;">${reserveHealth}</span>
    </div>`;

    html += '<div style="flex:1;overflow-y:auto;">';

    // ── Deregulation policy banner ──
    if (_hasDeregulation) {
        html += `<div style="padding:5px 14px;background:rgba(200,168,50,0.06);border-bottom:1px solid rgba(200,168,50,0.15);display:flex;align-items:center;gap:6px;">
            <span style="font-family:var(--font-mono);font-size:7px;font-weight:700;padding:1px 5px;color:#c8a832;background:rgba(200,168,50,0.12);border:1px solid rgba(200,168,50,0.25);">POLICY</span>
            <span style="font-family:var(--font-mono);font-size:8px;color:#c8a832;">Financial Sector Deregulation Act</span>
            <span style="font-family:var(--font-mono);font-size:7px;color:#6a6660;">Reserve req: ${minRatioPct}% &middot; Interest: +10%</span>
        </div>`;
    }

    // ── Capital Position ──
    html += '<div class="rr-section-bar">Capital Position</div>';
    html += '<div class="rr-section">';
    html += `<div style="display:flex;justify-content:space-between;margin-bottom:4px;">
        <span style="font-family:var(--font-mono);font-size:8px;color:#6a6660;letter-spacing:0.8px;">TOTAL CAPITAL</span>
        <span style="font-family:var(--font-mono);font-size:14px;font-weight:700;color:var(--panel-text);">${fmtMoney(totalAssets)}</span>
    </div>`;
    html += rrSegBar([{ value: cash, color: '#5c5' }, { value: deployed, color: '#8b9a6b' }], 6);
    html += `<div class="rr-seg-legend">
        <div class="rr-seg-legend-item"><div class="rr-seg-legend-dot" style="background:#5c5;"></div>Cash ${fmtMoney(cash)}</div>
        <div class="rr-seg-legend-item"><div class="rr-seg-legend-dot" style="background:#8b9a6b;"></div>Deployed ${fmtMoney(deployed)}</div>
    </div>`;
    html += '</div>';

    // ── Reserve Ratio ──
    html += '<div class="rr-section">';
    html += `<div style="display:flex;justify-content:space-between;margin-bottom:4px;">
        <span style="font-family:var(--font-mono);font-size:8px;color:#6a6660;letter-spacing:0.8px;">RESERVE RATIO</span>
        <span style="font-family:var(--font-mono);font-size:16px;font-weight:700;color:${reserveColor};">${reserveRatio}%</span>
    </div>`;
    html += `<div class="rd-bar" style="height:5px;"><div class="rd-bar__fill" style="width:${Math.min(reserveRatio / 60 * 100, 100)}%;background:${reserveColor};"></div></div>`;
    html += `<div style="display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:7px;color:#6a6660;margin-top:3px;">
        <span style="color:#c55;">${minRatioPct}% minimum</span><span>30% healthy</span><span style="color:#5c5;">60%+</span>
    </div>`;
    // Three cells so the math reads straight off the card: reserve
    // requirement (liquidity gate) · lending cap (% of total capital
    // gate, the invariant that drives AVAILABLE) · the available
    // headroom that's the min of both.
    html += `<div class="rr-reserve-cells">
        <div class="rr-reserve-cell"><div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;letter-spacing:0.5px;">REQUIRED (${minRatioPct}%)</div><div style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:#c84;margin-top:1px;">${fmtMoney(requiredReserve)}</div></div>
        <div class="rr-reserve-cell"><div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;letter-spacing:0.5px;">LENDING CAP (${lendingCapPct}%)</div><div style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--panel-text);margin-top:1px;">${fmtMoney(lendingCap)}</div></div>
        <div class="rr-reserve-cell"><div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;letter-spacing:0.5px;">AVAILABLE TO DEPLOY</div><div style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:${availableCapital > 0 ? '#5c5' : '#c55'};margin-top:1px;">${fmtMoney(availableCapital)}</div></div>
    </div>`;
    // Show which gate is the binding constraint so the user can read the
    // Available To Deploy figure without wondering why it's lower than
    // they expected.
    {
        const noteText = limiter === 'lending_cap'
            ? `Capped at ${lendingCapPct}% of total capital (branch offices: ${_branchCount}). Deployed ${fmtMoney(totalDeployed)} of ${fmtMoney(lendingCap)}.`
            : `Reserve requirement binds (${minRatioPct}% of exposure).`;
        html += `<div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;margin-top:6px;letter-spacing:0.02em;">${noteText}</div>`;
    }
    html += '</div>';

    // ── Exposure by Type ──
    html += '<div class="rr-section-bar">Exposure by Type</div>';
    html += '<div class="rr-section">';
    if (totalExposure > 0) {
        html += rrSegBar([
            { value: loanExposure, color: '#5a8aaa' },
            { value: insureExposure, color: '#aa7a5a' },
            { value: bondExposure, color: '#8a6aaa' },
        ], 6);
        html += '<div style="margin-top:6px;">';
        const types = [
            { label: 'Loans', value: loanExposure, color: '#5a8aaa', pct: totalExposure > 0 ? Math.round(loanExposure / totalExposure * 100) : 0 },
            { label: 'Insurance', value: insureExposure, color: '#aa7a5a', pct: totalExposure > 0 ? Math.round(insureExposure / totalExposure * 100) : 0 },
            { label: 'Bonds', value: bondExposure, color: '#8a6aaa', pct: totalExposure > 0 ? Math.round(bondExposure / totalExposure * 100) : 0 },
        ];
        for (let i = 0; i < types.length; i++) {
            const t = types[i];
            html += `<div class="rr-type-row">
                <div style="width:6px;height:6px;background:${t.color};margin-right:6px;"></div>
                <span style="flex:1;font-family:var(--font-mono);font-size:9px;color:#9e9a92;">${t.label}</span>
                <span style="font-family:var(--font-mono);font-size:9px;color:var(--panel-text);width:50px;text-align:right;">${fmtMoney(t.value)}</span>
                <span style="font-family:var(--font-mono);font-size:8px;color:#6a6660;width:28px;text-align:right;">${t.pct}%</span>
            </div>`;
        }
        html += '</div>';
    } else {
        html += '<div style="font-family:var(--font-mono);font-size:9px;color:#6a6660;text-align:center;padding:8px 0;">No exposure</div>';
    }
    html += '</div>';

    // ── Concentration Risk ──
    html += `<div class="rr-section-bar" style="display:flex;justify-content:space-between;align-items:center;">
        <span>Concentration Risk</span>
        <span style="font-family:var(--font-mono);font-size:8px;font-weight:700;padding:1px 6px;color:${concColor};background:${concColor}12;border:1px solid ${concColor}25;">${concRisk}</span>
    </div>`;
    html += '<div class="rr-section">';

    if (nationConc.length > 0) {
        html += '<div style="font-family:var(--font-mono);font-size:8px;color:#6a6660;letter-spacing:0.8px;margin-bottom:4px;">BY NATION</div>';
        for (const n of nationConc) {
            const barColor = n.pct > 50 ? '#c84' : n.pct > 30 ? '#ca5' : '#5c5';
            html += `<div class="rr-conc-row">
                <span style="font-family:var(--font-mono);font-size:7px;padding:0 4px;color:#8b9a6b;background:rgba(139,154,107,0.08);border:1px solid rgba(139,154,107,0.15);line-height:12px;width:52px;text-align:center;">${escapeHtml(n.name.toUpperCase().slice(0, 6))}</span>
                <div style="flex:1;margin:0 6px;"><div class="rd-bar"><div class="rd-bar__fill" style="width:${n.pct}%;background:${barColor};"></div></div></div>
                <span style="font-family:var(--font-mono);font-size:9px;color:var(--panel-text);width:50px;text-align:right;">${fmtMoney(n.exposure)}</span>
                <span style="font-family:var(--font-mono);font-size:8px;font-weight:700;width:28px;text-align:right;color:${n.pct > 50 ? '#c84' : '#9e9a92'};">${n.pct}%</span>
            </div>`;
        }
    }

    if (sectorConc.length > 0) {
        html += '<div style="font-family:var(--font-mono);font-size:8px;color:#6a6660;letter-spacing:0.8px;margin-top:8px;margin-bottom:4px;">BY SECTOR</div>';
        for (const s of sectorConc) {
            const barColor = s.pct > 50 ? '#c84' : s.pct > 30 ? '#ca5' : '#5c5';
            html += `<div class="rr-conc-row">
                <span style="font-family:var(--font-mono);font-size:8px;color:#9e9a92;width:52px;">${escapeHtml(s.name)}</span>
                <div style="flex:1;margin:0 6px;"><div class="rd-bar"><div class="rd-bar__fill" style="width:${s.pct}%;background:${barColor};"></div></div></div>
                <span style="font-family:var(--font-mono);font-size:9px;color:var(--panel-text);width:50px;text-align:right;">${fmtMoney(s.exposure)}</span>
                <span style="font-family:var(--font-mono);font-size:8px;font-weight:700;width:28px;text-align:right;color:${s.pct > 50 ? '#c84' : '#9e9a92'};">${s.pct}%</span>
            </div>`;
        }
    }

    if (nationConc.length === 0 && sectorConc.length === 0) {
        html += '<div style="font-family:var(--font-mono);font-size:9px;color:#6a6660;text-align:center;padding:8px 0;">No positions to analyze</div>';
    }
    html += '</div>';

    // ── Risk Management Actions ──
    html += '<div class="rr-section-bar">Actions</div>';
    html += '<div class="rr-section">';

    // Lending cap info
    html += `<div style="display:flex;justify-content:space-between;margin-bottom:6px;">
        <span style="font-family:var(--font-mono);font-size:8px;color:#6a6660;">Max single-deal size (${minRatioPct}% reserve)</span>
        <span style="font-family:var(--font-mono);font-size:9px;font-weight:700;color:var(--panel-text);">${fmtMoney(availableCapital)}</span>
    </div>`;

    // Diversification recommendation
    if (topNationPct > 50 && nationConc.length > 1) {
        const overweight = nationConc[0];
        const targetPct = Math.round(100 / nationConc.length);
        const idealExp = Math.round(totalExposure * targetPct / 100);
        const excess = overweight.exposure - idealExp;
        html += `<div style="padding:6px 8px;background:rgba(200,136,68,0.06);border:1px solid rgba(200,136,68,0.15);margin-bottom:6px;">
            <div style="font-family:var(--font-mono);font-size:7px;font-weight:700;color:#c84;margin-bottom:2px;">DIVERSIFICATION TIP</div>
            <div style="font-family:var(--font-mono);font-size:8px;color:#9e9a92;line-height:1.5;">
                ${escapeHtml(overweight.name)} is ${overweight.pct}% of your book (target: ~${targetPct}%).
                Reduce exposure by ~${fmtMoney(excess)} or grow positions in other nations.
            </div>
        </div>`;
    }

    // Portfolio health score
    const lateCount = apPortfolio.filter(p => p.status === 'LATE' || p.status === 'DELINQUENT').length;
    const healthFactors = [];
    if (reserveRatio >= 30) healthFactors.push('reserves'); // +1
    if (topNationPct <= 40) healthFactors.push('diversified'); // +1
    if (lateCount === 0) healthFactors.push('no_delinquent'); // +1
    if (apPortfolio.length >= 3) healthFactors.push('scale'); // +1
    const healthScore = healthFactors.length;
    const healthLabel = healthScore >= 4 ? 'EXCELLENT' : healthScore >= 3 ? 'GOOD' : healthScore >= 2 ? 'FAIR' : 'POOR';
    const healthColor = healthScore >= 4 ? '#5c5' : healthScore >= 3 ? '#ca5' : healthScore >= 2 ? '#c84' : '#c55';

    html += `<div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="font-family:var(--font-mono);font-size:8px;color:#6a6660;">PORTFOLIO HEALTH</span>
        <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:${healthColor};">${healthLabel} (${healthScore}/4)</span>
    </div>`;
    html += `<div style="margin-top:4px;display:flex;gap:3px;">
        ${['Reserves', 'Diversified', 'No Defaults', 'Scale'].map((label, i) => {
            const passed = healthFactors.length > i && healthFactors.includes(['reserves', 'diversified', 'no_delinquent', 'scale'][i]);
            return `<span style="flex:1;text-align:center;padding:2px 0;font-family:var(--font-mono);font-size:6px;font-weight:700;color:${passed ? '#5c5' : '#6a6660'};border:1px solid ${passed ? 'rgba(92,204,92,0.2)' : 'var(--panel-border)'};background:${passed ? 'rgba(92,204,92,0.04)' : 'transparent'};">${passed ? '✓' : '✗'} ${label}</span>`;
        }).join('')}
    </div>`;

    html += '</div>';

    // Concentration warning
    if (topNationPct > 60 && nationConc.length > 0) {
        html += `<div class="rr-warning"><span style="font-family:var(--font-mono);font-size:8px;font-weight:700;color:#c55;">CONCENTRATION WARNING: </span>${topNationPct}% of exposure is in ${escapeHtml(nationConc[0].name)}. A sovereign crisis or economic downturn in this nation would affect the majority of your portfolio. Consider diversifying across nations.</div>`;
    }

    html += '</div>'; // close scrollable area

const CC_OUTCOME_META = {

// Collections data — populated from DB when deal system is wired
let ccResolved = [];
let ccExpanded = -1;

function ccToggle(idx) {
    ccExpanded = ccExpanded === idx ? -1 : idx;
    renderCollections();
}

function renderCollections() {
    const container = document.getElementById('cc-container');
    if (!container) return;

    const totalEarned = ccResolved.reduce((s, d) => s + (d.earned || 0), 0);
    const totalLost = ccResolved.reduce((s, d) => s + (d.lost || 0), 0);
    const totalNet = ccResolved.reduce((s, d) => s + (d.net || 0), 0);
    const winCount = ccResolved.filter(d => d.net > 0).length;
    const lossCount = ccResolved.filter(d => d.net < 0).length;
    const profitable = totalNet >= 0;

    // Header
    let html = `<div class="df-header">
        <div class="df-header__left">
            <span class="df-header__dot">&#9679;</span>
            <span class="df-header__title">Collections</span>
        </div>
        <span style="font-family:var(--font-mono);font-size:9px;color:#6a6660;">${ccResolved.length} RESOLVED</span>
    </div>`;

    // Scorecard
    html += `<div class="cc-scorecard">
        <div class="cc-scorecard__cell">
            <div class="cc-scorecard__label">EARNED</div>
            <div class="cc-scorecard__value" style="color:#5c5;">${fmtMoney(totalEarned)}</div>
        </div>
        <div class="cc-scorecard__cell">
            <div class="cc-scorecard__label">LOST</div>
            <div class="cc-scorecard__value" style="color:#c55;">${fmtMoney(totalLost)}</div>
        </div>
        <div class="cc-scorecard__cell" style="background:${profitable ? 'rgba(92,204,92,0.03)' : 'rgba(204,85,85,0.03)'};">
            <div class="cc-scorecard__label">NET P&amp;L</div>
            <div class="cc-scorecard__value" style="color:${profitable ? '#5c5' : '#c55'};">${profitable ? '+' : ''}${fmtMoney(totalNet)}</div>
        </div>
    </div>`;

    // Win/Loss bar
    if (ccResolved.length > 0) {
        const winPct = (winCount / ccResolved.length) * 100;
        html += `<div class="cc-winloss">
            <div class="cc-winloss__bar">
                <div style="width:${winPct}%;background:#5c5;height:100%;"></div>
                <div style="flex:1;background:#c55;height:100%;"></div>
            </div>
            <span class="cc-winloss__stat" style="color:#5c5;">${winCount}W</span>
            <span style="font-family:var(--font-mono);font-size:8px;color:#6a6660;">&mdash;</span>
            <span class="cc-winloss__stat" style="color:#c55;">${lossCount}L</span>

    // Resolved deals list
    html += '<div class="cc-list">';

    if (ccResolved.length === 0) {
        html += '<div class="cc-empty">No resolved deals yet.<br>Completed loans, expired policies, and matured bonds appear here.</div>';
    }
