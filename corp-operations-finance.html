const AP_STATUS_META = {
    CURRENT:    { color: '#5c5', label: 'CURRENT' },
    LATE:       { color: '#c84', label: 'LATE' },
    DELINQUENT: { color: '#c55', label: 'DELINQUENT' },
    CLAIM:      { color: '#c55', label: 'CLAIM FILED' },
    ACTIVE:     { color: '#5c5', label: 'ACTIVE' },
    WATCHLIST:  { color: '#ca5', label: 'WATCHLIST' },
    DEFAULT:    { color: '#c55', label: 'DEFAULT' },
};

// Portfolio data — populated from DB when deal system is wired
let apPortfolio = [];
let apFilter = 'ALL';
let apExpanded = -1;

function apSetFilter(type) {
    apFilter = type;
    apExpanded = -1;
    renderActivePortfolio();
}

function apToggle(idx) {
    apExpanded = apExpanded === idx ? -1 : idx;
    renderActivePortfolio();
}

function renderActivePortfolio() {
    const container = document.getElementById('ap-container');
    if (!container) return;

    const deals = apFilter === 'ALL' ? apPortfolio : apPortfolio.filter(d => d.type === apFilter);
    const totalExposure = apPortfolio.reduce((s, p) => s + (p.remaining || p.coverage || p.faceValue || 0), 0);
    const totalEarned = apPortfolio.reduce((s, p) => s + (p.earned || p.premiumsCollected || p.couponsReceived || 0), 0);
    const loanCashCollectedTotal = apPortfolio
        .filter(p => p.type === 'LOAN')
        .reduce((s, p) => s + (p.cashCollected || 0), 0);
    const loanInterestRevenueTotal = apPortfolio
        .filter(p => p.type === 'LOAN')
        .reduce((s, p) => s + (p.interestRevenue || 0), 0);
    const alertCount = apPortfolio.filter(p => p.hasAlert).length;

    // Header
    let html = `<div class="df-header">
        <div class="df-header__left">
            <span class="df-header__dot">&#9679;</span>
            <span class="df-header__title">Active Portfolio</span>
        </div>
        <div style="display:flex;gap:4px;align-items:center;">
            ${alertCount > 0 ? `<span style="font-family:var(--font-mono);font-size:8px;font-weight:700;padding:1px 6px;color:#c55;background:rgba(204,85,85,0.08);border:1px solid rgba(204,85,85,0.15);">${alertCount} ALERT${alertCount > 1 ? 'S' : ''}</span>` : ''}
            <span style="font-family:var(--font-mono);font-size:9px;color:#6a6660;">${apPortfolio.length} ACTIVE</span>
        </div>
    </div>`;

    // Summary bar
    html += `<div class="ap-summary">
        <div class="ap-summary__cell" style="flex:1;">
            <div class="ap-summary__label">TOTAL EXPOSURE</div>
            <div class="ap-summary__value" style="font-size:14px;color:#c55;">${fmtMoney(totalExposure)}</div>
        </div>
        <div class="ap-summary__cell" style="flex:1;">
            <div class="ap-summary__label">TOTAL EARNED</div>
            <div class="ap-summary__value" style="font-size:14px;color:#5c5;">${fmtMoney(totalEarned)}</div>
        </div>
        <div class="ap-summary__cell" style="flex:0.6;">
            <div class="ap-summary__label">DEALS</div>
            <div style="display:flex;gap:4px;margin-top:3px;">
                ${['LOAN', 'INSURE', 'BOND', 'EQUITY'].map(t => {
                    const count = apPortfolio.filter(p => p.type === t).length;
                    const color = t === 'LOAN' ? '#5a8aaa' : t === 'INSURE' ? '#aa7a5a' : t === 'BOND' ? '#8a6aaa' : '#c89a4a';
                    return `<div style="display:flex;align-items:center;gap:2px;"><div style="width:4px;height:4px;background:${color};border-radius:1px;"></div><span style="font-family:var(--font-mono);font-size:8px;font-weight:700;color:#9e9a92;">${count}</span></div>`;
                }).join('')}
            </div>
        </div>
    </div>`;
    html += `<div class="ap-summary" style="margin-top:-1px;border-top:none;">
        <div class="ap-summary__cell" style="flex:1;">
            <div class="ap-summary__label" title="Total loan cash collected across active loans. Loan cash collected = interest portion + principal portion.">LOAN CASH COLLECTED (INTEREST + PRINCIPAL)</div>
            <div class="ap-summary__value" style="font-size:12px;color:var(--panel-text);">${fmtMoney(loanCashCollectedTotal)}</div>
        </div>
        <div class="ap-summary__cell" style="flex:1;">
            <div class="ap-summary__label" title="Interest portion of loan payments recognized as operating revenue. Principal repayment increases cash but is not profit.">LOAN INTEREST REVENUE (P&L)</div>
            <div class="ap-summary__value" style="font-size:12px;color:#5c5;">${fmtMoney(loanInterestRevenueTotal)}</div>
        </div>
    </div>`;

    // Filter pills
    html += '<div class="df-filters">';
    for (const f of [
        { id: 'ALL', label: 'All', activeClass: 'active-all' },
        { id: 'LOAN', label: 'Loans', activeClass: 'active-loan' },
        { id: 'INSURE', label: 'Policies', activeClass: 'active-insure' },
        { id: 'BOND', label: 'Bonds', activeClass: 'active-bond' },
        { id: 'EQUITY', label: 'Equity', activeClass: 'active-equity' },
    ]) {
        html += `<span class="df-pill${apFilter === f.id ? ' ' + f.activeClass : ''}" onclick="apSetFilter('${f.id}')">${f.label}</span>`;
    }
    html += '</div>';

    // Portfolio list
    html += '<div class="ap-list">';

    if (deals.length === 0) {
        html += '<div class="ap-empty">No active positions.<br>Review deals from the Deal Flow to build your portfolio.</div>';
    }

    for (let i = 0; i < deals.length; i++) {
        const d = deals[i];
        const globalIdx = apPortfolio.indexOf(d);
        const isExp = apExpanded === globalIdx;
        const tm = DF_TYPE_META[d.type];
        const sm = AP_STATUS_META[d.status] || AP_STATUS_META.CURRENT;
        const hasAlert = d.hasAlert === true;
        const elapsed = d.paymentsMade || 0;
        const term = d.term || 1;
        const pctComplete = Math.round((elapsed / term) * 100);

        const alertClass = hasAlert ? (sm.color === '#c55' ? 'alert-red' : sm.color === '#c84' ? 'alert-orange' : 'alert-yellow') : '';
        html += `<div class="ap-deal ${alertClass}" onclick="apToggle(${globalIdx})">
            <div class="ap-deal__inner" style="${isExp ? 'background:' + (tm.class === 'loan' ? 'rgba(90,138,170,0.08)' : tm.class === 'insure' ? 'rgba(170,122,90,0.08)' : 'rgba(138,106,170,0.08)') : ''}">`;

        // Row 1: type + counterparty + status
        html += `<div style="display:flex;align-items:center;gap:5px;margin-bottom:3px;">
            <span class="df-badge df-badge-${tm.class}">${tm.label}</span>
            <span style="font-size:11px;font-weight:600;color:var(--panel-text);flex:1;">${escapeHtml(d.counterparty)}</span>
            <span style="font-family:var(--font-mono);font-size:7px;font-weight:700;padding:0 5px;line-height:12px;color:${sm.color};background:${sm.color}12;border:1px solid ${sm.color}25;">${sm.label}</span>
        </div>`;

        // Row 2: nation + progress
        const lastDivStr = d.type === 'EQUITY' && (d.lastDividendAmount || 0) > 0
            ? ` · LAST: ${fmtMoney(d.lastDividendAmount)}`
            : '';
        const progressText = d.type === 'EQUITY'
            ? `SERIES ${escapeHtml(d.series || '?')} — ${elapsed} DIVIDEND${elapsed === 1 ? '' : 'S'} PAID${lastDivStr}`
            : `${elapsed}/${term}mo — ${pctComplete}%`;
        html += `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
            <span class="df-badge df-badge-nation" style="line-height:12px;">${escapeHtml((d.nation || '').toUpperCase())}</span>
            <span style="font-family:var(--font-mono);font-size:8px;color:#6a6660;">${progressText}</span>
        </div>`;

        // Progress bar. Equity is perpetual (no term), so the bar is always
        // full — it's a visual marker, not a progress indicator.
        const barBaseColor = tm.class === 'loan' ? '#5a8aaa' : tm.class === 'insure' ? '#aa7a5a' : tm.class === 'bond' ? '#8a6aaa' : '#c89a4a';
        const barColor = hasAlert ? sm.color : barBaseColor;
        const barWidth = d.type === 'EQUITY' ? 100 : Math.min(pctComplete, 100);
        html += `<div class="rd-bar"><div class="rd-bar__fill" style="width:${barWidth}%;background:${barColor};"></div></div>`;

        // Row 3: metrics
        const exposureLabel = d.type === 'LOAN' ? 'REMAINING'
            : d.type === 'INSURE' ? 'COVERAGE'
            : d.type === 'EQUITY' ? 'CAPITAL DEPLOYED'
            : 'FACE VALUE';
        const exposureVal = d.remaining || d.coverage || d.faceValue || 0;
        const rateLabel = d.type === 'LOAN' ? 'RATE'
            : d.type === 'INSURE' ? 'PREMIUM'
            : d.type === 'EQUITY' ? 'STAKE'
            : 'COUPON';
        const rateVal = d.rate || d.premiumRate || d.coupon || 0;
        const earnedVal = d.earned || d.premiumsCollected || d.couponsReceived || 0;
        // Per-type label so lenders don't read "EARNED" as gross cashflow: for
        // loans it's the interest portion only, not principal repayment.
        const earnedLabel = d.type === 'LOAN' ? 'INTEREST REVENUE (P&L)'
            : d.type === 'INSURE' ? 'PREMIUMS EARNED'
            : d.type === 'EQUITY' ? 'DIVIDENDS RECEIVED'
            : 'COUPONS EARNED';
        const earnedTooltip = d.type === 'LOAN'
            ? 'Loan monthly cash = interest + principal. This metric tracks interest revenue only; principal is asset repayment.'
            : d.type === 'EQUITY'
            ? 'Cumulative dividends paid by the target corp. Each tick = equity_pct × their monthly profit (losses pay $0).'
            : '';
        const rateColor = barBaseColor;

        html += `<div class="df-metrics" style="margin-top:4px;">
            <div style="flex:1;padding:3px 6px;border-right:1px solid var(--panel-border);">
                <div style="font-family:var(--font-mono);font-size:6px;color:#6a6660;letter-spacing:0.5px;">${exposureLabel}</div>
                <div style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--panel-text);margin-top:1px;">${fmtMoney(exposureVal)}</div>
            </div>
            <div style="flex:0.8;padding:3px 6px;text-align:center;border-right:1px solid var(--panel-border);">
                <div style="font-family:var(--font-mono);font-size:6px;color:#6a6660;letter-spacing:0.5px;">${rateLabel}</div>
                <div style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:${rateColor};margin-top:1px;">${rateVal}%</div>
            </div>
            <div style="flex:1;padding:3px 6px;text-align:right;">

                <div style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:#5c5;margin-top:1px;">${fmtMoney(earnedVal)}</div>

        if (hasAlert) {
            html += `<div class="ap-deal__alert" style="background:${sm.color}08;border:1px solid ${sm.color}20;color:${sm.color};">${escapeHtml(d.alertMsg || '')}</div>`;

        if (isExp) {
            html += '<div class="ap-deal__expanded">';

            if (d.type === 'LOAN') {
                const missedPayments = Number(d.paymentsMissed || 0);
                const isLateOrDelinquent = d.status === 'LATE' || d.status === 'DELINQUENT';
                const rows = [
                    { label: 'PRINCIPAL', value: fmtMoney(d.principal || 0) },
                    { label: 'REMAINING', value: fmtMoney(d.remaining || 0), color: 'var(--panel-text)' },
                    { label: 'MONTHLY INTEREST PORTION (P&L REVENUE)', value: fmtMoney(d.monthlyInterestPortion || 0), color: '#5c5', title: 'Recognized operating revenue from this month\'s loan payment.' },
                    { label: 'MONTHLY PRINCIPAL PORTION (ASSET REPAYMENT)', value: fmtMoney(d.monthlyPrincipalPortion || 0), title: 'Principal repayment increases cash and reduces receivable; it is not profit.' },
                    { label: 'TOTAL MONTHLY PAYMENT (CASH COLLECTED)', value: fmtMoney(d.monthlyPayment || 0), title: 'Loan cash collected each month = interest portion + principal portion.' },
                    { label: 'INTEREST REVENUE TO DATE (P&L)', value: fmtMoney(d.interestRevenue || 0), color: '#5c5', title: 'Cumulative operating revenue recognized from interest.' },
                    { label: 'PRINCIPAL REPAID TO DATE (ASSET REPAYMENT)', value: fmtMoney(d.principalRepaid || 0), title: 'Cumulative principal repaid. Cash inflow, not revenue.' },
                    { label: 'LOAN CASH COLLECTED TO DATE (INTEREST + PRINCIPAL)', value: fmtMoney(d.cashCollected || 0), title: 'Cumulative loan cash collected = interest + principal.' },
                    { label: 'MISSED PAYMENTS', value: String(d.missedPayments || 0), color: (d.missedPayments || 0) > 0 ? '#c55' : '#5c5' },
                    { label: 'NEXT DUE', value: d.nextPayment || '—', color: d.status === 'LATE' ? '#c55' : '#9e9a92' },
                ];
                for (const r of rows) {
                    html += `<div class="ap-detail-row"><span class="ap-detail-label" title="${r.title || ''}">${r.label}</span><span class="ap-detail-value" style="color:${r.color || '#9e9a92'};">${r.value}</span></div>`;
                }
                if (isLateOrDelinquent && missedPayments > 0) {
                    const canRestructure = isLateOrDelinquent;
                    const restructureReason = canRestructure
                        ? 'WHEN TO USE: Preserve the relationship when the borrower can recover but needs breathing room. ACTION: Applies term extension + rate reset + missed-payment reset. FINANCIAL CONSEQUENCES: Lowers near-term monthly cash, restarts delinquency pressure, and extends time to full principal recovery.'
                        : 'WHEN TO USE: Only available once the loan is LATE or DELINQUENT. ACTION: Would apply term extension + rate reset + missed-payment reset. FINANCIAL CONSEQUENCES: Trades faster collections for a softer repayment path and longer exposure window.';

                    const isEscalated = d.status === 'DELINQUENT' || missedPayments >= 3;
                    const canCallLoan = !isEscalated;
                    const callLoanReason = canCallLoan
                        ? 'WHEN TO USE: Escalate after repeated misses when you want hard collection pressure before foreclosure. ACTION: Demands accelerated repayment and advances delinquency escalation timing. FINANCIAL CONSEQUENCES: Raises default risk and may accelerate losses if the borrower cannot cure quickly.'
                        : 'WHEN TO USE: Already escalated. ACTION: Accelerated repayment demand + delinquency escalation timing are already in force. FINANCIAL CONSEQUENCES: No additional escalation benefit until status changes.';

                    const canForeclose = d.status === 'DELINQUENT' || missedPayments >= 3;
                    const forecloseReason = canForeclose
                        ? 'WHEN TO USE: Final remedy after delinquency threshold is reached and recovery via normal payments is unlikely. ACTION: Immediate default + collateral recovery payout (cash 70%, property 80%, equipment 50%). FINANCIAL CONSEQUENCES: Irreversible action; ends future interest/principal cashflow and realizes immediate recovery/loss now.'
                        : 'WHEN TO USE: Requires delinquent/default threshold first (DELINQUENT status or 3+ missed payments). ACTION: Immediate default + collateral recovery payout (cash 70%, property 80%, equipment 50%). FINANCIAL CONSEQUENCES: Irreversible once triggered and converts expected future cashflow into immediate realized recovery/loss.';

                    const loanActionBtn = (colorClass, label, enabled, onclickJs, reason) => {
                        const disabledClass = enabled ? '' : ' disabled';
                        const clickAttr = enabled ? ` onclick="${onclickJs}"` : '';
                        return `<div class="ap-action-btn ${colorClass}${disabledClass}" title="${escapeHtml(reason)}"${clickAttr}>${label}</div>`;
                    };

                    html += '<div class="ap-actions">';
                    html += loanActionBtn('green', 'RESTRUCTURE', canRestructure, `apRestructure('${d.id}')`, restructureReason);
                    html += loanActionBtn('orange', 'CALL LOAN', canCallLoan, `apCallLoan('${d.id}')`, callLoanReason);
                    html += loanActionBtn('red', 'FORECLOSE', canForeclose, `apForeclose('${d.id}')`, forecloseReason);
                    html += '</div>';
                }
            } else if (d.type === 'INSURE') {
                const rows = [
                    { label: 'COVERAGE', value: fmtMoney(d.coverage || 0) },
                    { label: 'PREMIUMS COLLECTED', value: fmtMoney(d.premiumsCollected || 0), color: '#5c5' },
                    { label: 'CLAIMS FILED', value: String(d.claims || 0), color: (d.claims || 0) > 0 ? '#c84' : '#5c5' },
                    { label: 'PAID OUT', value: fmtMoney(d.paidOut || 0), color: (d.paidOut || 0) > 0 ? '#c55' : '#6a6660' },
                ];
                for (const r of rows) {
                    html += `<div class="ap-detail-row"><span class="ap-detail-label">${r.label}</span><span class="ap-detail-value" style="color:${r.color || '#9e9a92'};">${r.value}</span></div>`;
                }
                if (d.status === 'CLAIM' && d.claimAmount) {
                    html += `<div class="ap-claim-box"><div style="font-family:var(--font-mono);font-size:7px;color:#c55;letter-spacing:0.8px;margin-bottom:2px;">PENDING CLAIM</div><div style="font-family:var(--font-mono);font-size:11px;font-weight:700;color:#c55;">${fmtMoney(d.claimAmount)}</div></div>`;
                    html += `<div class="ap-actions"><div class="ap-action-btn green" onclick="apPayClaim('${d.id}')">PAY IN FULL</div><div class="ap-action-btn orange" onclick="apNegotiateClaim('${d.id}')">NEGOTIATE</div><div class="ap-action-btn red" onclick="apDisputeClaim('${d.id}')">DISPUTE</div></div>`;
                }
            } else if (d.type === 'BOND') {
                const rows = [
                    { label: 'FACE VALUE', value: fmtMoney(d.faceValue || 0) },
                    { label: 'COUPONS RECEIVED', value: fmtMoney(d.couponsReceived || 0), color: '#5c5' },
                    { label: 'NEXT COUPON', value: d.nextCoupon || '—' },
                    { label: 'ANNUAL YIELD', value: fmtMoney(Math.round((d.faceValue || 0) * (d.coupon || 0) / 100)), color: '#8a6aaa' },
                ];
                for (const r of rows) {
                    html += `<div class="ap-detail-row"><span class="ap-detail-label">${r.label}</span><span class="ap-detail-value" style="color:${r.color || '#9e9a92'};">${r.value}</span></div>`;
                }
                html += `<div class="ap-actions"><div class="ap-action-btn purple" onclick="apSellPosition('${d.id}')">SELL POSITION</div><div class="ap-action-btn olive">HOLD</div></div>`;
            } else if (d.type === 'EQUITY') {
                const avgPerTick = (d.paymentsMade || 0) > 0
                    ? Math.round((d.dividendsReceived || 0) / d.paymentsMade)
                    : 0;
                const roiPct = (d.principal || 0) > 0
                    ? Math.round(((d.dividendsReceived || 0) / d.principal) * 10000) / 100
                    : 0;
                const rows = [
                    { label: 'CAPITAL DEPLOYED', value: fmtMoney(d.principal || 0) },
                    { label: 'STAKE', value: (d.equityPct || 0) + '%', color: '#c89a4a' },
                    { label: 'SERIES', value: escapeHtml(d.series || '?'), color: '#c89a4a' },
                    { label: 'DIVIDENDS RECEIVED', value: fmtMoney(d.dividendsReceived || 0), color: '#5c5', title: 'Cumulative dividends since buy-in.' },
                    { label: 'LAST DIVIDEND PAID', value: (d.lastDividendAmount || 0) > 0 ? fmtMoney(d.lastDividendAmount) : '—', color: (d.lastDividendAmount || 0) > 0 ? '#5c5' : '#6a6660', title: 'The most recent tick payout. $0 if the target had a loss or no cash that tick.' },
                    { label: 'AVG DIVIDEND / PAID TICK', value: fmtMoney(avgPerTick), title: 'Cumulative dividends divided by the count of actual payout ticks. Loss ticks are excluded from the denominator.' },
                    { label: 'DIVIDENDS PAID', value: String(d.paymentsMade || 0), title: 'Number of ticks this position actually distributed cash.' },
                    { label: 'LAST DIVIDEND TICK', value: d.lastDividendTick != null ? 'Tick ' + d.lastDividendTick : '—' },
                    { label: 'ROI TO DATE', value: roiPct + '%', color: roiPct >= 0 ? '#5c5' : '#c55', title: 'Cumulative dividends / capital deployed. Equity is perpetual — no principal return expected; ROI accumulates indefinitely.' },
                ];
                if (d.forSalePrice != null) {
                    rows.push({ label: 'LISTED FOR SALE', value: fmtMoney(d.forSalePrice), color: '#c89a4a', title: 'Any Investment corp can buy this stake at the asking price. Sale transfers ownership and resets your dividend counter.' });
                }
                for (const r of rows) {
                    html += `<div class="ap-detail-row"><span class="ap-detail-label" title="${r.title || ''}">${r.label}</span><span class="ap-detail-value" style="color:${r.color || '#9e9a92'};">${r.value}</span></div>`;
                }
                // Seller-side secondary-market actions (Phase 8). LIST /
                // CANCEL are direct UPDATEs (the permissive active_loans
                // policy allows the holder to edit their own row); the BUY
                // side is an RPC because it crosses factions.
                if (d.forSalePrice != null) {
                    html += `<div class="ap-actions"><div class="ap-action-btn orange" onclick="apCancelListing('${d.id}')" title="Remove this stake from the secondary market.">CANCEL LISTING</div></div>`;
                } else {
                    html += `<div class="ap-actions"><div class="ap-action-btn purple" onclick="apListForSale('${d.id}', ${d.principal || 0})" title="List this stake on the secondary market at an asking price.">LIST FOR SALE</div></div>`;
                }
            }

            html += '</div>'; // close expanded
        }

        html += '</div></div>'; // close inner + deal
    }

    html += '</div>'; // close list

    // ROI metrics
    const totalDeployed = apPortfolio.reduce((s, p) => s + (p.principal || p.coverage || p.faceValue || 0), 0);
    const roiPct = totalDeployed > 0 ? Math.round((totalEarned / totalDeployed) * 10000) / 100 : 0;
    const avgRate = apPortfolio.length > 0
        ? Math.round(apPortfolio.reduce((s, p) => s + (p.rate || 0), 0) / apPortfolio.length * 10) / 10
        : 0;
    const lateCount = apPortfolio.filter(p => p.status === 'LATE' || p.status === 'DELINQUENT').length;
    const defaultRate = apPortfolio.length > 0 ? Math.round(lateCount / apPortfolio.length * 100) : 0;

    // Footer
    html += `<div class="df-footer" style="flex-direction:column;gap:6px;">
        <div style="display:flex;gap:8px;justify-content:space-between;width:100%;">
            <div><div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;letter-spacing:0.8px;">EXPOSURE</div><div style="font-family:var(--font-mono);font-size:11px;font-weight:700;color:#c55;">${fmtMoney(totalExposure)}</div></div>
            <div><div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;letter-spacing:0.8px;">EARNED</div><div style="font-family:var(--font-mono);font-size:11px;font-weight:700;color:#5c5;">${fmtMoney(totalEarned)}</div></div>
            <div><div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;letter-spacing:0.8px;">ROI</div><div style="font-family:var(--font-mono);font-size:11px;font-weight:700;color:${roiPct >= 0 ? '#5c5' : '#c55'};">${roiPct}%</div></div>
            <div><div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;letter-spacing:0.8px;">AVG RATE</div><div style="font-family:var(--font-mono);font-size:11px;font-weight:700;color:#ca5;">${avgRate}%</div></div>
            <div><div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;letter-spacing:0.8px;">RISK</div><div style="font-family:var(--font-mono);font-size:11px;font-weight:700;color:${defaultRate > 20 ? '#c55' : defaultRate > 0 ? '#ca5' : '#5c5'};">${defaultRate}%</div></div>
        </div>
        <div style="display:flex;gap:6px;">
            ${['LOAN', 'INSURE', 'BOND', 'EQUITY'].map(t => {
                const color = t === 'LOAN' ? '#5a8aaa' : t === 'INSURE' ? '#aa7a5a' : t === 'BOND' ? '#8a6aaa' : '#c89a4a';
                const count = apPortfolio.filter(p => p.type === t).length;
                return `<div style="text-align:center;padding:1px 6px;border:1px solid ${count > 0 ? color + '33' : 'var(--panel-border)'};background:${count > 0 ? color + '0a' : 'transparent'};"><div style="font-family:var(--font-mono);font-size:6px;color:${color};">${t}</div><div style="font-family:var(--font-mono);font-size:9px;font-weight:700;color:${count > 0 ? 'var(--panel-text)' : '#6a6660'};">${count}</div></div>`;
            }).join('')}
        </div>
    </div>`;

    container.innerHTML = html;
}

// ── Portfolio Action Handlers ──

async function apRestructure(loanId) {
    const { data: currentLoan } = await _supabase.from('finance_active_loans').select('status,payments_missed').eq('id', loanId).single();
    const currentStatus = String(currentLoan?.status || '').toUpperCase();
    const missedPayments = Number(currentLoan?.payments_missed || 0);
    if (!((currentStatus === 'LATE' || currentStatus === 'DELINQUENT') && missedPayments > 0)) {
        alert('Restructure unavailable. Only late/delinquent loans with missed payments can be restructured.');
        return;
    }

    const newRate = prompt('RESTRUCTURE LOAN\n\nEnter new annual interest rate (1-20%):\n(This extends the term by 12 months and resets missed payments.)');
    if (!newRate) return;
    const rate = parseFloat(newRate);
    if (isNaN(rate) || rate < 1 || rate > 20) { alert('Rate must be between 1% and 20%.'); return; }

    const { data: loan } = await _supabase.from('finance_active_loans').select('*').eq('id', loanId).single();
    if (!loan) { alert('Loan not found.'); return; }

    const newTerm = loan.term_months + 12;
    // Flat-interest schedule — matches the server's per-tick math and the
    // canonical regression in scripts/test-flat-interest-loans.mjs. The
    // prior amortization formula here diverged from the server and left
    // restructured loans unable to fully amortize, same bug class that
    // affected acceptOffer.
    const remaining = Number(loan.remaining_principal || 0);
    const monthlyInterest = Math.round((remaining * (rate / 100)) / 12);
    const monthlyPrincipal = Math.round(remaining / newTerm);
    const newPayment = monthlyInterest + monthlyPrincipal;

    if (!confirm(`Restructure to ${rate}% over ${newTerm} months?\nNew monthly payment: ${fmtMoney(newPayment)}\nMissed payments reset to 0.`)) return;

    const { error } = await _supabase.from('finance_active_loans').update({
        interest_rate: rate,
        term_months: newTerm,
        monthly_payment: newPayment,
        payments_missed: 0,
        status: 'current',
    }).eq('id', loanId);

    if (error) { alert('Failed: ' + error.message); return; }
    alert('Loan restructured.');
    await loadActivePortfolio();
    renderActivePortfolio();
}

async function apCallLoan(loanId) {
    const { data: currentLoan } = await _supabase.from('finance_active_loans').select('status,payments_missed').eq('id', loanId).single();
    const currentStatus = String(currentLoan?.status || '').toUpperCase();
    const missedPayments = Number(currentLoan?.payments_missed || 0);
    if (currentStatus === 'DELINQUENT' || missedPayments >= 3) {
        alert('Call Loan unavailable. Loan is already in a delinquent/escalated state.');
        return;
    }

    if (!confirm('CALL LOAN\n\nDemand immediate full repayment of remaining principal.\nThe borrower will have 3 ticks to pay or default.\n\nProceed?')) return;

    const { error } = await _supabase.from('finance_active_loans').update({
        status: 'delinquent',
        payments_missed: 3, // one more miss → default with collateral recovery
    }).eq('id', loanId);

    if (error) { alert('Failed: ' + error.message); return; }
    alert('Loan called. Borrower has 1 tick to pay before default.');
    await loadActivePortfolio();
    renderActivePortfolio();
}

async function apForeclose(loanId) {
    const { data: currentLoan } = await _supabase.from('finance_active_loans').select('status,payments_missed').eq('id', loanId).single();
    const currentStatus = String(currentLoan?.status || '').toUpperCase();
    const missedPayments = Number(currentLoan?.payments_missed || 0);
    if (!(currentStatus === 'DELINQUENT' || missedPayments >= 3)) {
        alert('Foreclose unavailable. Requires delinquent/default threshold state.');
        return;
    }

    if (!confirm('FORECLOSE\n\nImmediately default the loan and seize collateral.\nCollateral recovery: Equipment 60%, Property 75%, Unsecured 0%.\n\nThis cannot be undone. Proceed?')) return;

    const { data: loan } = await _supabase.from('finance_active_loans').select('*').eq('id', loanId).single();
    if (!loan) { alert('Loan not found.'); return; }

    const remaining = Math.max(0, Number(loan.remaining_principal || 0));
    let recovery = 0;
    if (loan.collateral_type === 'equipment') recovery = 0.6;
    else if (loan.collateral_type === 'property') recovery = 0.75;

    const recoveredAmount = Math.round(remaining * recovery);

    // Credit recovery to lender
    if (recoveredAmount > 0) {
        const { data: lender } = await _supabase.from('factions').select('corp_cash_reserves').eq('id', faction.id).single();
        await _supabase.from('factions').update({
            corp_cash_reserves: Number(lender?.corp_cash_reserves || 0) + recoveredAmount
        }).eq('id', faction.id);
        faction.corp_cash_reserves = Number(lender?.corp_cash_reserves || 0) + recoveredAmount;
    }

    await _supabase.from('finance_active_loans').update({
        status: 'defaulted',
        completed_tick: shard?.current_tick || 0,
    }).eq('id', loanId);

    alert('Foreclosed. Recovered: ' + fmtMoney(recoveredAmount) + ' from ' + (loan.collateral_type || 'unsecured') + ' collateral.');
    await loadActivePortfolio();
    renderActivePortfolio();
}

async function apPayClaim(loanId) {
    const { data: policy } = await _supabase.from('finance_active_loans').select('*').eq('id', loanId).single();
    if (!policy) { alert('Policy not found.'); return; }

    const claimAmount = Number(policy.principal || 0) - Number(policy.claims_paid || 0);
    const deductible = Number(policy.deductible_pct || 0) / 100;
    const payout = Math.round(claimAmount * (1 - deductible));

    if (!confirm(`PAY CLAIM IN FULL\n\nClaim: ${fmtMoney(claimAmount)}\nDeductible: ${policy.deductible_pct}%\nPayout: ${fmtMoney(payout)}\n\nThis will be deducted from your cash reserves.`)) return;

    const { data: lender } = await _supabase.from('factions').select('corp_cash_reserves').eq('id', faction.id).single();
    const cash = Number(lender?.corp_cash_reserves || 0);
    if (cash < payout) { alert('Insufficient funds. You have ' + fmtMoney(cash) + '.'); return; }

    // Deduct from insurer
    await _supabase.from('factions').update({ corp_cash_reserves: cash - payout }).eq('id', faction.id);
    faction.corp_cash_reserves = cash - payout;

    // Credit to policyholder
    const { data: holder } = await _supabase.from('factions').select('corp_cash_reserves').eq('id', policy.borrower_faction_id).single();
    if (holder) {
        await _supabase.from('factions').update({
            corp_cash_reserves: Number(holder.corp_cash_reserves || 0) + payout
        }).eq('id', policy.borrower_faction_id);
    }

    // Update policy
    await _supabase.from('finance_active_loans').update({
        claims_paid: Number(policy.claims_paid || 0) + payout,
        claims_count: (policy.claims_count || 0) + 1,
    }).eq('id', loanId);

    alert('Claim paid: ' + fmtMoney(payout));
    await loadActivePortfolio();
    renderActivePortfolio();
}

async function apNegotiateClaim(loanId) {
    const pctStr = prompt('NEGOTIATE CLAIM\n\nOffer a percentage of the claim to settle (10-90%):\n(Policyholder may reject low offers.)');
    if (!pctStr) return;
    const pct = parseInt(pctStr);
    if (isNaN(pct) || pct < 10 || pct > 90) { alert('Must be between 10% and 90%.'); return; }

    // Simulate acceptance: higher offers more likely accepted
    const acceptChance = pct / 100;
    const accepted = Math.random() < acceptChance;

    if (!accepted) {
        alert('Offer rejected. The policyholder wants a higher settlement.');
        return;
    }

    const { data: policy } = await _supabase.from('finance_active_loans').select('*').eq('id', loanId).single();
    if (!policy) return;

    const fullClaim = Number(policy.principal || 0) - Number(policy.claims_paid || 0);
    const payout = Math.round(fullClaim * pct / 100);

    const { data: lender } = await _supabase.from('factions').select('corp_cash_reserves').eq('id', faction.id).single();
    const cash = Number(lender?.corp_cash_reserves || 0);
    if (cash < payout) { alert('Insufficient funds.'); return; }

    await _supabase.from('factions').update({ corp_cash_reserves: cash - payout }).eq('id', faction.id);
    faction.corp_cash_reserves = cash - payout;

    const { data: holder } = await _supabase.from('factions').select('corp_cash_reserves').eq('id', policy.borrower_faction_id).single();
    if (holder) {
        await _supabase.from('factions').update({
            corp_cash_reserves: Number(holder.corp_cash_reserves || 0) + payout
        }).eq('id', policy.borrower_faction_id);
    }

    await _supabase.from('finance_active_loans').update({
        claims_paid: Number(policy.claims_paid || 0) + payout,
        claims_count: (policy.claims_count || 0) + 1,
        status: 'repaid', // settled
    }).eq('id', loanId);

    alert('Claim settled at ' + pct + '% (' + fmtMoney(payout) + '). Policy closed.');
    await loadActivePortfolio();
    renderActivePortfolio();
}

async function apDisputeClaim(loanId) {
    if (!confirm('DISPUTE CLAIM\n\nChallenge the validity of this claim.\nThis freezes the claim for 4 ticks while investigated.\nIf investigation finds the claim valid, you pay in full + 10% penalty.\nIf investigation finds fraud, claim is dismissed.\n\nDispute?')) return;

    // Simple resolution: 70% chance claim is valid, 30% fraud
    // Resolution happens immediately for now (future: delay 4 ticks)
    const isValid = Math.random() < 0.7;

    if (isValid) {
        alert('Investigation complete: claim is VALID.\nYou must now pay the full claim.');
        // Pay in full happens on next portfolio action
    } else {
        await _supabase.from('finance_active_loans').update({
            status: 'repaid', // dismissed
            claims_count: (0), // fraud claim not counted
        }).eq('id', loanId);
        alert('Investigation complete: FRAUDULENT CLAIM detected.\nClaim dismissed. Policy remains active.');
    }
    await loadActivePortfolio();
    renderActivePortfolio();
}

async function apSellPosition(loanId) {
    const { data: position } = await _supabase.from('finance_active_loans').select('*').eq('id', loanId).single();
    if (!position) { alert('Position not found.'); return; }

    const remaining = Number(position.principal || 0) - Number(position.total_paid || 0);
    const marketValue = Math.round(remaining * 0.85); // 15% discount for secondary market

    if (!confirm(`SELL POSITION\n\nRemaining value: ${fmtMoney(remaining)}\nMarket price (85%): ${fmtMoney(marketValue)}\n\nYou receive ${fmtMoney(marketValue)} immediately.\nThe position is removed from your portfolio.`)) return;

    // Credit sale proceeds
    const { data: lender } = await _supabase.from('factions').select('corp_cash_reserves').eq('id', faction.id).single();
    await _supabase.from('factions').update({
        corp_cash_reserves: Number(lender?.corp_cash_reserves || 0) + marketValue
    }).eq('id', faction.id);
    faction.corp_cash_reserves = Number(lender?.corp_cash_reserves || 0) + marketValue;

    // Mark as sold
    await _supabase.from('finance_active_loans').update({
        status: 'repaid',
        completed_tick: shard?.current_tick || 0,
    }).eq('id', loanId);

    alert('Position sold for ' + fmtMoney(marketValue) + '.');
    await loadActivePortfolio();
    renderActivePortfolio();
}

// ── Equity: list for sale / cancel listing (Phase 8) ──
// Direct UPDATEs against finance_active_loans. The table has a permissive
// FOR ALL policy so the holder can flip for_sale_price on their own row.
// The buy side is an RPC (cross-faction cash); list/cancel are not.
async function apListForSale(positionId, principal) {
    const suggested = Number(principal) > 0
        ? Math.round(Number(principal) * 1.25 / 1_000_000)
        : 10;
    const input = prompt(
        'LIST STAKE FOR SALE\n\n' +
        'Enter asking price in millions USD (e.g., 75 for $75M).\n\n' +
        `Suggested: ${suggested} (1.25× your original capital).`
    );
    if (input === null) return;
    const priceM = parseFloat(input);
    if (isNaN(priceM) || priceM <= 0) { alert('Price must be a positive number.'); return; }
    const price = Math.round(priceM * 1_000_000);

    const { error } = await _supabase.from('finance_active_loans')
        .update({ for_sale_price: price })
        .eq('id', positionId);
    if (error) { alert('Failed to list position: ' + error.message); return; }

    alert(`Stake listed for ${fmtMoney(price)}. Other Investment corps can now buy it from Deal Flow → Secondary.`);
    await loadActivePortfolio();
}

async function apCancelListing(positionId) {
    if (!confirm('Remove this stake from the secondary market?')) return;
    const { error } = await _supabase.from('finance_active_loans')
        .update({ for_sale_price: null })
        .eq('id', positionId);
    if (error) { alert('Failed to cancel listing: ' + error.message); return; }
    await loadActivePortfolio();
}

window.apListForSale = apListForSale;
window.apCancelListing = apCancelListing;

// ==================== RESERVES & RISK ====================

function rrSegBar(segments, h) {
    const total = segments.reduce((a, s) => a + s.value, 0);
    if (total === 0) return `<div class="rr-seg-bar" style="height:${h}px;background:var(--panel-border);"></div>`;
    return `<div class="rr-seg-bar" style="height:${h}px;">${segments.map(s =>
        `<div style="width:${(s.value / total * 100).toFixed(1)}%;height:100%;background:${s.color};"></div>`
    ).join('')}</div>`;
}

function renderReservesRisk() {
    const container = document.getElementById('rr-container');
    if (!container) return;

    // One source of truth — same helper the loan-offer validator uses, so
    // the card can't claim headroom the validator will reject.
    const cash = Number(faction?.corp_cash_reserves) || 0;
    const cap = computeDeployable(cash, apPortfolio, _branchCount, _hasDeregulation);
    const {
        totalExposure, requiredReserve, reserveReqPct,
        loanExposure, insureExposure, bondExposure,
        lendingCapPct, lendingCap, totalDeployed,
        deployable: availableCapital, limiter,
    } = cap;
    // Breadcrumb for a prior intermittent bug: Reserves & Risk would
    // render $0 exposure while the Active Portfolio card next to it
    // clearly had entries. Suggests apPortfolio got mutated or the
    // remaining formula went sideways. Keep a one-liner log so if we
    // see it again we know the portfolio shape at the moment of desync.
    if (apPortfolio.length > 0 && totalExposure === 0) {
        console.warn('[RR] Portfolio has entries but totalExposure=0. Sample:',
            apPortfolio.slice(0, 3).map(p => ({ type: p.type, remaining: p.remaining, principal: p.principal })));
    }
    const deployed = totalExposure;
    const totalAssets = cash + deployed;
    const reserveRatio = totalExposure > 0 ? Math.round((cash / totalExposure) * 100) : 100;
    const minRatioPct = Math.round(reserveReqPct * 100);
    const reserveHealth = reserveRatio >= 30 ? 'HEALTHY' : reserveRatio >= 20 ? 'ADEQUATE' : reserveRatio >= minRatioPct ? 'THIN' : 'CRITICAL';
    const reserveColor = reserveRatio >= 30 ? '#5c5' : reserveRatio >= 20 ? '#ca5' : reserveRatio >= minRatioPct ? '#c84' : '#c55';

    // Concentration by nation
    const nationMap = {};
    for (const p of apPortfolio) {
        const n = p.nation || 'Unknown';
        const exp = p.remaining || p.coverage || p.faceValue || 0;
        nationMap[n] = (nationMap[n] || 0) + exp;
    }
    const nationConc = Object.entries(nationMap)
        .map(([name, exposure]) => ({ name, exposure, pct: totalExposure > 0 ? Math.round(exposure / totalExposure * 100) : 0 }))
        .sort((a, b) => b.exposure - a.exposure);

    // Concentration by sector
    const sectorMap = {};
    for (const p of apPortfolio) {
        const sec = p.type === 'BOND' ? 'Government' : p.sector || 'Other';
        const exp = p.remaining || p.coverage || p.faceValue || 0;
        sectorMap[sec] = (sectorMap[sec] || 0) + exp;
    }
    const sectorConc = Object.entries(sectorMap)
        .map(([name, exposure]) => ({ name, exposure, pct: totalExposure > 0 ? Math.round(exposure / totalExposure * 100) : 0 }))
        .sort((a, b) => b.exposure - a.exposure);

    const topNationPct = nationConc.length > 0 ? nationConc[0].pct : 0;
    const concRisk = topNationPct > 60 ? 'HIGH' : topNationPct > 40 ? 'MODERATE' : 'LOW';
    const concColor = concRisk === 'HIGH' ? '#c55' : concRisk === 'MODERATE' ? '#ca5' : '#5c5';

    // ── Header ──
    let html = `<div class="df-header">
        <div class="df-header__left">
            <span class="df-header__dot">&#9679;</span>
            <span class="df-header__title">Reserves & Risk</span>
        </div>
        <span style="font-family:var(--font-mono);font-size:8px;font-weight:700;padding:1px 6px;color:${reserveColor};background:${reserveColor}12;border:1px solid ${reserveColor}25;">${reserveHealth}</span>
    </div>`;

    html += '<div style="flex:1;overflow-y:auto;">';

    // ── Deregulation policy banner ──
    if (_hasDeregulation) {
        html += `<div style="padding:5px 14px;background:rgba(200,168,50,0.06);border-bottom:1px solid rgba(200,168,50,0.15);display:flex;align-items:center;gap:6px;">
            <span style="font-family:var(--font-mono);font-size:7px;font-weight:700;padding:1px 5px;color:#c8a832;background:rgba(200,168,50,0.12);border:1px solid rgba(200,168,50,0.25);">POLICY</span>
            <span style="font-family:var(--font-mono);font-size:8px;color:#c8a832;">Financial Sector Deregulation Act</span>
            <span style="font-family:var(--font-mono);font-size:7px;color:#6a6660;">Reserve req: ${minRatioPct}% &middot; Interest: +10%</span>
        </div>`;
    }

    // ── Capital Position ──
    html += '<div class="rr-section-bar">Capital Position</div>';
    html += '<div class="rr-section">';
    html += `<div style="display:flex;justify-content:space-between;margin-bottom:4px;">
        <span style="font-family:var(--font-mono);font-size:8px;color:#6a6660;letter-spacing:0.8px;">TOTAL CAPITAL</span>
        <span style="font-family:var(--font-mono);font-size:14px;font-weight:700;color:var(--panel-text);">${fmtMoney(totalAssets)}</span>
    </div>`;
    html += rrSegBar([{ value: cash, color: '#5c5' }, { value: deployed, color: '#8b9a6b' }], 6);
    html += `<div class="rr-seg-legend">
        <div class="rr-seg-legend-item"><div class="rr-seg-legend-dot" style="background:#5c5;"></div>Cash ${fmtMoney(cash)}</div>
        <div class="rr-seg-legend-item"><div class="rr-seg-legend-dot" style="background:#8b9a6b;"></div>Deployed ${fmtMoney(deployed)}</div>
    </div>`;
    html += '</div>';

    // ── Reserve Ratio ──
    html += '<div class="rr-section">';
    html += `<div style="display:flex;justify-content:space-between;margin-bottom:4px;">
        <span style="font-family:var(--font-mono);font-size:8px;color:#6a6660;letter-spacing:0.8px;">RESERVE RATIO</span>
        <span style="font-family:var(--font-mono);font-size:16px;font-weight:700;color:${reserveColor};">${reserveRatio}%</span>
    </div>`;
    html += `<div class="rd-bar" style="height:5px;"><div class="rd-bar__fill" style="width:${Math.min(reserveRatio / 60 * 100, 100)}%;background:${reserveColor};"></div></div>`;
    html += `<div style="display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:7px;color:#6a6660;margin-top:3px;">
        <span style="color:#c55;">${minRatioPct}% minimum</span><span>30% healthy</span><span style="color:#5c5;">60%+</span>
    </div>`;
    // Three cells so the math reads straight off the card: reserve
    // requirement (liquidity gate) · lending cap (% of total capital
    // gate, the invariant that drives AVAILABLE) · the available
    // headroom that's the min of both.
    html += `<div class="rr-reserve-cells">
        <div class="rr-reserve-cell"><div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;letter-spacing:0.5px;">REQUIRED (${minRatioPct}%)</div><div style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:#c84;margin-top:1px;">${fmtMoney(requiredReserve)}</div></div>
        <div class="rr-reserve-cell"><div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;letter-spacing:0.5px;">LENDING CAP (${lendingCapPct}%)</div><div style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--panel-text);margin-top:1px;">${fmtMoney(lendingCap)}</div></div>
        <div class="rr-reserve-cell"><div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;letter-spacing:0.5px;">AVAILABLE TO DEPLOY</div><div style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:${availableCapital > 0 ? '#5c5' : '#c55'};margin-top:1px;">${fmtMoney(availableCapital)}</div></div>
    </div>`;
    // Show which gate is the binding constraint so the user can read the
    // Available To Deploy figure without wondering why it's lower than
    // they expected.
    {
        const noteText = limiter === 'lending_cap'
            ? `Capped at ${lendingCapPct}% of total capital (branch offices: ${_branchCount}). Deployed ${fmtMoney(totalDeployed)} of ${fmtMoney(lendingCap)}.`
            : `Reserve requirement binds (${minRatioPct}% of exposure).`;
        html += `<div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;margin-top:6px;letter-spacing:0.02em;">${noteText}</div>`;
    }
    html += '</div>';

    // ── Exposure by Type ──
    html += '<div class="rr-section-bar">Exposure by Type</div>';
    html += '<div class="rr-section">';
    if (totalExposure > 0) {
        html += rrSegBar([
            { value: loanExposure, color: '#5a8aaa' },
            { value: insureExposure, color: '#aa7a5a' },
            { value: bondExposure, color: '#8a6aaa' },
        ], 6);
        html += '<div style="margin-top:6px;">';
        const types = [
            { label: 'Loans', value: loanExposure, color: '#5a8aaa', pct: totalExposure > 0 ? Math.round(loanExposure / totalExposure * 100) : 0 },
            { label: 'Insurance', value: insureExposure, color: '#aa7a5a', pct: totalExposure > 0 ? Math.round(insureExposure / totalExposure * 100) : 0 },
            { label: 'Bonds', value: bondExposure, color: '#8a6aaa', pct: totalExposure > 0 ? Math.round(bondExposure / totalExposure * 100) : 0 },
        ];
        for (let i = 0; i < types.length; i++) {
            const t = types[i];
            html += `<div class="rr-type-row">
                <div style="width:6px;height:6px;background:${t.color};margin-right:6px;"></div>
                <span style="flex:1;font-family:var(--font-mono);font-size:9px;color:#9e9a92;">${t.label}</span>
                <span style="font-family:var(--font-mono);font-size:9px;color:var(--panel-text);width:50px;text-align:right;">${fmtMoney(t.value)}</span>
                <span style="font-family:var(--font-mono);font-size:8px;color:#6a6660;width:28px;text-align:right;">${t.pct}%</span>
            </div>`;
        }
        html += '</div>';
    } else {
        html += '<div style="font-family:var(--font-mono);font-size:9px;color:#6a6660;text-align:center;padding:8px 0;">No exposure</div>';
    }
    html += '</div>';

    // ── Concentration Risk ──
    html += `<div class="rr-section-bar" style="display:flex;justify-content:space-between;align-items:center;">
        <span>Concentration Risk</span>
        <span style="font-family:var(--font-mono);font-size:8px;font-weight:700;padding:1px 6px;color:${concColor};background:${concColor}12;border:1px solid ${concColor}25;">${concRisk}</span>
    </div>`;
    html += '<div class="rr-section">';

    if (nationConc.length > 0) {
        html += '<div style="font-family:var(--font-mono);font-size:8px;color:#6a6660;letter-spacing:0.8px;margin-bottom:4px;">BY NATION</div>';
        for (const n of nationConc) {
            const barColor = n.pct > 50 ? '#c84' : n.pct > 30 ? '#ca5' : '#5c5';
            html += `<div class="rr-conc-row">
                <span style="font-family:var(--font-mono);font-size:7px;padding:0 4px;color:#8b9a6b;background:rgba(139,154,107,0.08);border:1px solid rgba(139,154,107,0.15);line-height:12px;width:52px;text-align:center;">${escapeHtml(n.name.toUpperCase().slice(0, 6))}</span>
                <div style="flex:1;margin:0 6px;"><div class="rd-bar"><div class="rd-bar__fill" style="width:${n.pct}%;background:${barColor};"></div></div></div>
                <span style="font-family:var(--font-mono);font-size:9px;color:var(--panel-text);width:50px;text-align:right;">${fmtMoney(n.exposure)}</span>
                <span style="font-family:var(--font-mono);font-size:8px;font-weight:700;width:28px;text-align:right;color:${n.pct > 50 ? '#c84' : '#9e9a92'};">${n.pct}%</span>
            </div>`;
        }
    }

    if (sectorConc.length > 0) {
        html += '<div style="font-family:var(--font-mono);font-size:8px;color:#6a6660;letter-spacing:0.8px;margin-top:8px;margin-bottom:4px;">BY SECTOR</div>';
        for (const s of sectorConc) {
            const barColor = s.pct > 50 ? '#c84' : s.pct > 30 ? '#ca5' : '#5c5';
            html += `<div class="rr-conc-row">
                <span style="font-family:var(--font-mono);font-size:8px;color:#9e9a92;width:52px;">${escapeHtml(s.name)}</span>
                <div style="flex:1;margin:0 6px;"><div class="rd-bar"><div class="rd-bar__fill" style="width:${s.pct}%;background:${barColor};"></div></div></div>
                <span style="font-family:var(--font-mono);font-size:9px;color:var(--panel-text);width:50px;text-align:right;">${fmtMoney(s.exposure)}</span>
                <span style="font-family:var(--font-mono);font-size:8px;font-weight:700;width:28px;text-align:right;color:${s.pct > 50 ? '#c84' : '#9e9a92'};">${s.pct}%</span>
            </div>`;
        }
    }

    if (nationConc.length === 0 && sectorConc.length === 0) {
        html += '<div style="font-family:var(--font-mono);font-size:9px;color:#6a6660;text-align:center;padding:8px 0;">No positions to analyze</div>';
    }
    html += '</div>';

    // ── Risk Management Actions ──
    html += '<div class="rr-section-bar">Actions</div>';
    html += '<div class="rr-section">';

    // Lending cap info
    html += `<div style="display:flex;justify-content:space-between;margin-bottom:6px;">
        <span style="font-family:var(--font-mono);font-size:8px;color:#6a6660;">Max single-deal size (${minRatioPct}% reserve)</span>
        <span style="font-family:var(--font-mono);font-size:9px;font-weight:700;color:var(--panel-text);">${fmtMoney(availableCapital)}</span>
    </div>`;

    // Diversification recommendation
    if (topNationPct > 50 && nationConc.length > 1) {
        const overweight = nationConc[0];
        const targetPct = Math.round(100 / nationConc.length);
        const idealExp = Math.round(totalExposure * targetPct / 100);
        const excess = overweight.exposure - idealExp;
        html += `<div style="padding:6px 8px;background:rgba(200,136,68,0.06);border:1px solid rgba(200,136,68,0.15);margin-bottom:6px;">
            <div style="font-family:var(--font-mono);font-size:7px;font-weight:700;color:#c84;margin-bottom:2px;">DIVERSIFICATION TIP</div>
            <div style="font-family:var(--font-mono);font-size:8px;color:#9e9a92;line-height:1.5;">
                ${escapeHtml(overweight.name)} is ${overweight.pct}% of your book (target: ~${targetPct}%).
                Reduce exposure by ~${fmtMoney(excess)} or grow positions in other nations.
            </div>
        </div>`;
    }

    // Portfolio health score
    const lateCount = apPortfolio.filter(p => p.status === 'LATE' || p.status === 'DELINQUENT').length;
    const healthFactors = [];
    if (reserveRatio >= 30) healthFactors.push('reserves'); // +1
    if (topNationPct <= 40) healthFactors.push('diversified'); // +1
    if (lateCount === 0) healthFactors.push('no_delinquent'); // +1
    if (apPortfolio.length >= 3) healthFactors.push('scale'); // +1
    const healthScore = healthFactors.length;
    const healthLabel = healthScore >= 4 ? 'EXCELLENT' : healthScore >= 3 ? 'GOOD' : healthScore >= 2 ? 'FAIR' : 'POOR';
    const healthColor = healthScore >= 4 ? '#5c5' : healthScore >= 3 ? '#ca5' : healthScore >= 2 ? '#c84' : '#c55';

    html += `<div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="font-family:var(--font-mono);font-size:8px;color:#6a6660;">PORTFOLIO HEALTH</span>
        <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:${healthColor};">${healthLabel} (${healthScore}/4)</span>
    </div>`;
    html += `<div style="margin-top:4px;display:flex;gap:3px;">
        ${['Reserves', 'Diversified', 'No Defaults', 'Scale'].map((label, i) => {
            const passed = healthFactors.length > i && healthFactors.includes(['reserves', 'diversified', 'no_delinquent', 'scale'][i]);
            return `<span style="flex:1;text-align:center;padding:2px 0;font-family:var(--font-mono);font-size:6px;font-weight:700;color:${passed ? '#5c5' : '#6a6660'};border:1px solid ${passed ? 'rgba(92,204,92,0.2)' : 'var(--panel-border)'};background:${passed ? 'rgba(92,204,92,0.04)' : 'transparent'};">${passed ? '✓' : '✗'} ${label}</span>`;
        }).join('')}
    </div>`;

    html += '</div>';

    // Concentration warning
    if (topNationPct > 60 && nationConc.length > 0) {
        html += `<div class="rr-warning"><span style="font-family:var(--font-mono);font-size:8px;font-weight:700;color:#c55;">CONCENTRATION WARNING: </span>${topNationPct}% of exposure is in ${escapeHtml(nationConc[0].name)}. A sovereign crisis or economic downturn in this nation would affect the majority of your portfolio. Consider diversifying across nations.</div>`;
    }

    html += '</div>'; // close scrollable area

    // ── Footer ──
    html += `<div class="df-footer" style="justify-content:space-between;">
        <div><div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;letter-spacing:0.8px;">DEPLOYABLE CAPITAL</div><div style="font-family:var(--font-mono);font-size:14px;font-weight:700;color:${availableCapital > 0 ? '#5c5' : '#c55'};">${fmtMoney(availableCapital)}</div></div>
        <div style="text-align:right;"><div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;letter-spacing:0.8px;">TOTAL EXPOSURE</div><div style="font-family:var(--font-mono);font-size:14px;font-weight:700;color:var(--panel-text);">${fmtMoney(totalExposure)}</div></div>
    </div>`;

    container.innerHTML = html;
}

const CC_OUTCOME_META = {
    REPAID:      { color: '#5c5', label: 'REPAID' },
    DEFAULTED:   { color: '#c55', label: 'DEFAULTED' },
    EXPIRED:     { color: '#5c5', label: 'EXPIRED' },
    CLAIMED:     { color: '#c84', label: 'CLAIMED' },
    MATURED:     { color: '#5c5', label: 'MATURED' },
    SOLD:        { color: '#ca5', label: 'SOLD EARLY' },
    FORECLOSED:  { color: '#c55', label: 'FORECLOSED' },
};

// Collections data — populated from DB when deal system is wired
let ccResolved = [];
let ccExpanded = -1;

function ccToggle(idx) {
    ccExpanded = ccExpanded === idx ? -1 : idx;
    renderCollections();
}

function renderCollections() {
    const container = document.getElementById('cc-container');
    if (!container) return;

    const totalEarned = ccResolved.reduce((s, d) => s + (d.earned || 0), 0);
    const totalLost = ccResolved.reduce((s, d) => s + (d.lost || 0), 0);
    const totalNet = ccResolved.reduce((s, d) => s + (d.net || 0), 0);
    const winCount = ccResolved.filter(d => d.net > 0).length;
    const lossCount = ccResolved.filter(d => d.net < 0).length;
    const profitable = totalNet >= 0;

    // Header
    let html = `<div class="df-header">
        <div class="df-header__left">
            <span class="df-header__dot">&#9679;</span>
            <span class="df-header__title">Collections</span>
        </div>
        <span style="font-family:var(--font-mono);font-size:9px;color:#6a6660;">${ccResolved.length} RESOLVED</span>
    </div>`;

    // Scorecard
    html += `<div class="cc-scorecard">
        <div class="cc-scorecard__cell">
            <div class="cc-scorecard__label">EARNED</div>
            <div class="cc-scorecard__value" style="color:#5c5;">${fmtMoney(totalEarned)}</div>
        </div>
        <div class="cc-scorecard__cell">
            <div class="cc-scorecard__label">LOST</div>
            <div class="cc-scorecard__value" style="color:#c55;">${fmtMoney(totalLost)}</div>
        </div>
        <div class="cc-scorecard__cell" style="background:${profitable ? 'rgba(92,204,92,0.03)' : 'rgba(204,85,85,0.03)'};">
            <div class="cc-scorecard__label">NET P&amp;L</div>
            <div class="cc-scorecard__value" style="color:${profitable ? '#5c5' : '#c55'};">${profitable ? '+' : ''}${fmtMoney(totalNet)}</div>
        </div>
    </div>`;

    // Win/Loss bar
    if (ccResolved.length > 0) {
        const winPct = (winCount / ccResolved.length) * 100;
        html += `<div class="cc-winloss">
            <div class="cc-winloss__bar">
                <div style="width:${winPct}%;background:#5c5;height:100%;"></div>
                <div style="flex:1;background:#c55;height:100%;"></div>
            </div>
            <span class="cc-winloss__stat" style="color:#5c5;">${winCount}W</span>
            <span style="font-family:var(--font-mono);font-size:8px;color:#6a6660;">&mdash;</span>
            <span class="cc-winloss__stat" style="color:#c55;">${lossCount}L</span>
        </div>`;
    }

    // Resolved deals list
    html += '<div class="cc-list">';

    if (ccResolved.length === 0) {
        html += '<div class="cc-empty">No resolved deals yet.<br>Completed loans, expired policies, and matured bonds appear here.</div>';
    }

    for (let i = 0; i < ccResolved.length; i++) {
        const d = ccResolved[i];
        const tm = DF_TYPE_META[d.type] || { class: 'loan', label: d.type };
        const om = CC_OUTCOME_META[d.outcome] || { color: '#9e9a92', label: d.outcome };
        const isExp = ccExpanded === i;
        const isProfitable = d.net >= 0;

        html += `<div class="cc-deal" onclick="ccToggle(${i})" style="border-left:2px solid ${isProfitable ? '#5c5' : '#c55'};">

    html += '</div>'; // close list

    // Footer
    html += `<div class="df-footer" style="justify-content:space-between;">

            }).join('')}

    container.innerHTML = html;
}

const SUBSECTOR_DEAL_MAP = { banking: ['LOAN'], insurance: ['INSURE'], investment: ['BOND', 'EQUITY', 'SECONDARY'] };

// Loan controls

let rdLoanTermsText = '';

// Insurance controls
let rdInsurePremium = 3.5;

let rdInsureDeductible = 10;
let rdInsureTerm = 12;
let rdPolicyTerms = '';

const INSURE_TERM_OPTIONS = [6, 12, 24, 36, 48, 60];
const INSURE_COVERAGE_PCTS = [50, 60, 70, 80, 90, 100];

// Bond controls

    { id: 'none', label: 'None', recovery: 0, desc: 'Unsecured loan. No recovery on default.' },
    { id: 'equipment', label: 'Equipment', recovery: 60, desc: 'Seize financed equipment on default — recover ~60%.' },
    { id: 'property', label: 'Property', recovery: 75, desc: 'Corporate property lien — recover ~75%.' },
    { id: 'full', label: 'Full Assets', recovery: 90, desc: 'Full asset claim — recover ~90% but harder sell.' },
];

function rdOpen(dealIdx) {
    const deal = dfDeals[dealIdx];
    if (!deal) return;
    // Equity and Secondary have their own dedicated buy flows (dfBuyEquityStake
    // / dfBuyListedStake). rdOpen is the loan/bond/insurance "review + offer"
    // modal and doesn't apply to either — refuse to open as belt-and-suspenders
    // against edge triggers.
    if (deal.type === 'EQUITY' || deal.type === 'SECONDARY') return;
    rdDeal = deal;
    rdType = deal.type;

    // Reset controls to defaults based on deal
    if (deal.type === 'LOAN') {
        rdLoanRate = 8;
        rdLoanAmount = deal.amount;
        rdLoanTerm = deal.term || 24;
        rdLoanCollateral = deal.collateral || 'unsecured';
        rdLoanTermsText = '';
    } else if (deal.type === 'INSURE') {
        // Vessel insurance pays half the premium of project/construction
        // insurance; underwriters set the rate in a 0.5–4% band instead of 1–8%.
        rdInsurePremium = deal.isVesselInsurance ? 1.5 : 3.5;
        rdInsureCoverage = deal.amount;
        rdInsureDeductible = 10;
        rdInsureTerm = 12;
        rdPolicyTerms = '';
    } else if (deal.type === 'BOND') {
        rdBondAmount = Math.round(deal.amount * 0.25);
    }

    document.getElementById('rd-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
    renderReviewDeal();
}

function rdClose() {
    document.getElementById('rd-overlay').classList.remove('open');
    document.body.style.overflow = '';
    rdDeal = null;
}

// Persist a status='declined' offer row. loadDealFlow() reads these
// rows into `declinedSet` and filters out any request the current
// corp declined, so the deal disappears from this financier's Deal
// Flow while staying visible to others. Pending/accepted offers from
// the same financier on other requests are still shown (with a
// disabled "ALREADY OFFERED" button) — only declines hide the card.
async function rdDecline() {
    const deal = rdDeal;
    if (!deal || !faction?.id) { rdClose(); return; }
    // Defense in depth — button is disabled in the footer when
    // alreadyOffered, but guard here too in case the handler is
    // invoked programmatically. INSERT would fail the unique
    // constraint on (request_id, offering_faction_id) silently.
    if (deal.alreadyOffered) { rdClose(); return; }
    try {
        const { error } = await _supabase.from('finance_loan_offers').insert({
            request_id: deal.requestId || deal.id,
            offering_faction_id: faction.id,
            // CHECK constraint requires >= 1.0; value is meaningless for
            // a declined offer — the row exists only to hide the request
            // from this financier's Deal Flow.
            interest_rate: 1.0,
            collateral_type: 'unsecured',
            status: 'declined',
            created_tick: (shard?.current_tick) || 0,
        });
        if (error) console.warn('[Decline] finance_loan_offers insert failed:', error.message);
    } catch (err) {
        console.warn('[Decline] Unexpected error:', err?.message || err);
    }
    rdClose();
    if (typeof loadDealFlow === 'function') loadDealFlow();
}
window.rdDecline = rdDecline;

function rdBar(value, max, color) {

function renderReviewDeal() {
    const modal = document.getElementById('rd-modal');
    if (!modal || !rdDeal) return;

    const d = rdDeal;
    const typeColor = rdType === 'LOAN' ? '#5a8aaa' : rdType === 'INSURE' ? '#aa7a5a' : '#8a6aaa';

    // ── Loan calculations ──
    const loanTotalInterest = Math.round(rdLoanAmount * (rdLoanRate / 100) * (rdLoanTerm / 12));
    const loanMonthlyPayment = Math.round((rdLoanAmount + loanTotalInterest) / rdLoanTerm);
    const borrowerRevenue = d.revenue || 47400000;
    const loanDebtService = Math.round(loanMonthlyPayment / borrowerRevenue * 1200);

    const baseDefault = 12;
    const rateDefaultMod = Math.max(0, (rdLoanRate - 6) * 1.5);
    const amountDefaultMod = rdLoanAmount > 15000000 ? 3 : 0;
    const collateralMod = rdLoanCollateral === 'none' ? 3 : rdLoanCollateral === 'full' ? -2 : 0;
    // Debt-to-cash ratio: heavily indebted corps are riskier
    const borrowerDebt = Number(d.corp_debt || 0);
    const borrowerCash = Number(d.corp_cash_reserves || 1);
    const debtRatioMod = borrowerDebt > 0 ? Math.min(15, Math.round((borrowerDebt / Math.max(borrowerCash, 1)) * 5)) : 0;
    const defaultProb = Math.min(60, Math.max(2, Math.round(baseDefault + rateDefaultMod + amountDefaultMod + collateralMod + debtRatioMod)));
    const defaultColor = defaultProb <= 15 ? '#5c5' : defaultProb <= 30 ? '#ca5' : defaultProb <= 45 ? '#c84' : '#c55';
    const defaultLabel = defaultProb <= 15 ? 'LOW' : defaultProb <= 30 ? 'MODERATE' : defaultProb <= 45 ? 'ELEVATED' : 'HIGH';

    const baseAccept = 95;
    const rateAcceptMod = (rdLoanRate - 4) * 8;
    const partialMod = rdLoanAmount < (d.amount || 18000000) ? 10 : 0;
    const collateralAcceptMod = rdLoanCollateral === 'full' ? 15 : rdLoanCollateral === 'property' ? 8 : rdLoanCollateral === 'none' ? -5 : 0;
    const acceptProb = Math.max(10, Math.min(95, Math.round(baseAccept - rateAcceptMod - partialMod - collateralAcceptMod)));
    const acceptColor = acceptProb >= 70 ? '#5c5' : acceptProb >= 45 ? '#ca5' : acceptProb >= 25 ? '#c84' : '#c55';

    const collateralDisplayMap = { unsecured: 'none', equipment: 'equipment', property: 'property' };
    const collTier = COLLATERAL_TIERS.find(c => c.id === (collateralDisplayMap[rdLoanCollateral] || rdLoanCollateral)) || COLLATERAL_TIERS[0];
    const loanExpectedReturn = Math.round(loanTotalInterest * (1 - defaultProb / 100));

    // ── Insurance calculations ──
    // Insurer sets the policy term via rdInsureTerm; the borrower's
    // request carries no meaningful term anymore.
    const insureTermYears = rdInsureTerm / 12;
    const insureTotalPremiums = Math.round(rdInsureCoverage * (rdInsurePremium / 100) * insureTermYears);
    const baseClaimProb = 100 - (d.reputation || 50); // lower rep = higher claim chance
    const insureClaimProb = Math.max(5, Math.min(50, Math.round(baseClaimProb * 0.4)));
    const insureMaxExposure = Math.round(rdInsureCoverage * (1 - rdInsureDeductible / 100));
    const insureExpectedPayout = Math.round(insureMaxExposure * (insureClaimProb / 100));
    const insureExpectedProfit = insureTotalPremiums - insureExpectedPayout;
    const claimColor = insureClaimProb <= 12 ? '#5c5' : insureClaimProb <= 22 ? '#ca5' : insureClaimProb <= 35 ? '#c84' : '#c55';

    // ── Bond calculations ──
    const bondCoupon = d.couponRate || 6.2;
    const bondTermMonths = d.term || 60;
    const bondTermYears = bondTermMonths / 12;
    const bondAnnualCoupon = Math.round(rdBondAmount * (bondCoupon / 100));
    const bondTotalReturn = Math.round(rdBondAmount * (bondCoupon / 100) * bondTermYears);
    // Default probability from stability + credit rating + debt/GDP
    const bondStability = d.stability || 50;
    const bondCreditRating = d.creditRating || 50;
    const bondDebtToGdp = d.debtToGdp || 30;
    const bondBaseDefault = Math.max(2, Math.round(
        (100 - bondStability) * 0.15 + (100 - bondCreditRating) * 0.15 + Math.max(0, bondDebtToGdp - 30) * 0.3
    ));
    const bondDefaultProb = Math.min(60, bondBaseDefault);
    const bondDefaultColor = bondDefaultProb <= 10 ? '#5c5' : bondDefaultProb <= 20 ? '#ca5' : bondDefaultProb <= 35 ? '#c84' : '#c55';
    const bondExpectedReturn = Math.round(bondTotalReturn * (1 - bondDefaultProb / 100));

    // ── HEADER ──

                <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:#c8a832;">${escapeHtml(d.abbr)}</span>
                <span style="font-size:13px;font-weight:700;color:var(--panel-text);">${escapeHtml(d.applicant)}</span>
                <span class="df-badge df-badge-${d.entity.toLowerCase()}">${d.entity}</span>
            </div>
            <div style="font-size:10px;color:#9e9a92;line-height:1.5;margin-bottom:6px;">${escapeHtml(d.purpose)}</div>
            <div class="rd-applicant__stats">
                <div class="rd-applicant__stat"><div class="rd-applicant__stat-label">REP</div><div class="rd-applicant__stat-value" style="color:${repColor};">${d.reputation || '—'}</div></div>

                <div class="rd-applicant__stat"><div class="rd-applicant__stat-label">REQUESTED</div><div class="rd-applicant__stat-value" style="color:var(--panel-text);">${fmtMoney(d.amount)}</div></div>

        </div>`;

        // Show requestor's desired coverage
        if (d.purpose && d.purpose !== 'Construction Insurance') {
            html += `<div style="padding:8px 14px;background:rgba(170,122,90,0.04);border-bottom:1px solid rgba(170,122,90,0.12);">
                <div style="font-family:var(--font-mono);font-size:7px;font-weight:700;color:#aa7a5a;letter-spacing:0.8px;margin-bottom:3px;">REQUESTED COVERAGE</div>

            </div>`;
        }

        html += `<div class="rd-section-bar" style="color:#aa7a5a;">Set Policy Terms</div>`;

        // Premium Rate — vessel insurance runs a 0.5–4% band (half the
        // rate of non-vessel insurance, where the band stays 1–8%).
        const isVesselPolicy = !!rdDeal.isVesselInsurance;
        const premMin  = isVesselPolicy ? 0.5 : 1;
        const premMax  = isVesselPolicy ? 4   : 8;
        const premOptions = [];
        for (let p = premMin; p <= premMax + 0.001; p += 0.5) premOptions.push(+p.toFixed(2));
        if (!premOptions.includes(rdInsurePremium)) rdInsurePremium = premOptions[Math.floor(premOptions.length / 2)];
        html += `<div class="rd-control">
            <div class="rd-control__header">
                <span class="rd-control__label">PREMIUM RATE (ANNUAL)</span>
                <span class="rd-control__value" style="font-size:16px;color:#aa7a5a;">${rdInsurePremium}%</span>
            </div>
            <select class="rd-control__select" onchange="rdSetInsurePremium(this.value)">
                ${premOptions.map(p => `<option value="${p}"${p === rdInsurePremium ? ' selected' : ''}>${p}%</option>`).join('')}
            </select>
            <div class="rd-control__hints"><span>${premMin}% (competitive)</span><span>${premMax}% (expensive)</span></div>
        </div>`;

        // Coverage Amount — presets as percentages of the requested amount,
        // capped at the asset-value ceiling (70% of project/fleet value).
        const coverageCeiling = Math.round((d.projectValue || d.fleetValue || d.amount) * 0.7);
        const coverageOptions = INSURE_COVERAGE_PCTS
            .map(pct => ({ pct, value: Math.min(Math.round(d.amount * pct / 100), coverageCeiling) }))
            .filter((opt, i, arr) => i === 0 || opt.value !== arr[i - 1].value);
        if (!coverageOptions.some(o => o.value === rdInsureCoverage)) {

        }
        html += `<div class="rd-control">
            <div class="rd-control__header">
                <span class="rd-control__label">COVERAGE AMOUNT</span>
                <span class="rd-control__value" style="font-size:14px;color:var(--panel-text);">${fmtMoney(rdInsureCoverage)}</span>
            </div>
            <select class="rd-control__select" onchange="rdSetInsureCoverage(this.value)">
                ${coverageOptions.map(o => `<option value="${o.value}"${o.value === rdInsureCoverage ? ' selected' : ''}>${o.pct}% of request — ${fmtMoney(o.value)}</option>`).join('')}
            </select>
        </div>`;

        // Policy Term — insurer chooses coverage duration. Policy expires
        // at this term regardless of project status.
        html += `<div class="rd-control">
            <div class="rd-control__header">
                <span class="rd-control__label">POLICY TERM</span>

        </div>`;

        // Deductible presets
        html += `<div class="rd-control">
            <div class="rd-control__header">
                <span class="rd-control__label">DEDUCTIBLE</span>
                <span class="rd-control__value" style="font-size:14px;color:var(--panel-text);">${rdInsureDeductible}%</span>
            </div>
            <div class="rd-presets">`;
        for (const d2 of [5, 10, 15, 20, 25]) {
            const isActive = rdInsureDeductible === d2;
            html += `<span class="rd-preset" onclick="rdSetInsureDeductible(${d2})" style="${isActive ? 'color:#000;background:#aa7a5a;border-color:#aa7a5a;' : ''}">${d2}%</span>`;

        html += `</div>
            <div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;margin-top:4px;">Policyholder pays first ${rdInsureDeductible}% of any claim (${fmtMoney(Math.round(rdInsureCoverage * rdInsureDeductible / 100))})</div>
        </div>`;

        // Agreed coverage terms text box
        html += `<div class="rd-control">
            <div class="rd-control__header">
                <span class="rd-control__label">WHAT WE AGREE TO COVER</span>
            </div>
            <textarea id="rd-policy-terms" rows="3" placeholder="e.g., Covers weather delays, material damage, and labor disputes. Excludes negligence and acts of war. Maximum payout per claim: 50% of coverage."
                style="width:100%;box-sizing:border-box;padding:6px 8px;font-family:var(--font-mono);font-size:9px;color:var(--panel-text);background:var(--panel-main);border:1px solid var(--panel-border);resize:vertical;line-height:1.5;"
                oninput="rdPolicyTerms=this.value">${rdPolicyTerms || ''}</textarea>

    }

    if (rdType === 'BOND') {
        // Issuer info
        const stabColor = bondStability >= 50 ? '#5c5' : bondStability >= 30 ? '#ca5' : bondStability >= 15 ? '#c84' : '#c55';
        html += `<div class="rd-applicant">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
                <span class="df-badge df-badge-gov" style="font-size:8px;padding:2px 6px;">GOV</span>
                <span style="font-size:13px;font-weight:700;color:var(--panel-text);">${escapeHtml(d.applicant)}</span>
            </div>
            <div style="font-size:10px;color:#9e9a92;line-height:1.5;margin-bottom:6px;">${escapeHtml(d.purpose)}</div>
            <div class="rd-applicant__stats">
                <div class="rd-applicant__stat"><div class="rd-applicant__stat-label">TOTAL ISSUE</div><div class="rd-applicant__stat-value" style="color:var(--panel-text);">${fmtMoney(d.amount)}</div></div>
                <div class="rd-applicant__stat"><div class="rd-applicant__stat-label">COUPON</div><div class="rd-applicant__stat-value" style="color:#8a6aaa;">${bondCoupon}%</div></div>

        // Acceptance Likelihood
        html += `<div class="rd-section-bar" style="color:#5a8aaa;">Acceptance Likelihood</div>`;
        html += `<div class="rd-control">
            <div class="rd-control__header">

        // Projected Returns
        html += `<div class="rd-section-bar" style="color:#5c5;">Projected Returns</div>`;
        html += `<div class="rd-risk-row"><span class="rd-risk-label">CAPITAL AT RISK</span><span class="rd-risk-value" style="color:#c55;">${fmtMoney(rdLoanAmount)}</span></div>`;
        html += `<div class="rd-risk-row"><span class="rd-risk-label">TOTAL INTEREST</span><span class="rd-risk-value" style="color:#5c5;">${fmtMoney(loanTotalInterest)}</span></div>`;

        html += `<div class="rd-risk-row"><span class="rd-risk-label">MAX EXPOSURE</span><span class="rd-risk-value" style="color:#c55;">${fmtMoney(insureMaxExposure)}</span></div>`;
        html += `<div class="rd-risk-row"><span class="rd-risk-label">TOTAL PREMIUMS</span><span class="rd-risk-value" style="color:#5c5;">${fmtMoney(insureTotalPremiums)}</span></div>`;
        html += `<div class="rd-risk-row"><span class="rd-risk-label">EXPECTED PAYOUT</span><span class="rd-risk-value" style="color:#c84;">${fmtMoney(insureExpectedPayout)}</span></div>`;

        html += `<div class="rd-formula">Premiums (${fmtMoney(insureTotalPremiums)}) − expected payout (${insureClaimProb}% × ${fmtMoney(insureMaxExposure)})</div>`;

    if (rdType === 'BOND') {
        // Sovereign Default Risk
        html += `<div class="rd-section-bar" style="color:#a3b07e;">Risk Assessment</div>`;
        html += `<div class="rd-control">
            <div class="rd-control__header">
                <span class="rd-control__label">SOVEREIGN DEFAULT RISK</span>

            </div>

        </div>`;

        // Projected Returns
        html += `<div class="rd-section-bar" style="color:#5c5;">Projected Returns</div>`;
        html += `<div class="rd-risk-row"><span class="rd-risk-label">CAPITAL AT RISK</span><span class="rd-risk-value" style="color:#c55;">${fmtMoney(rdBondAmount)}</span></div>`;
        html += `<div class="rd-risk-row"><span class="rd-risk-label">ANNUAL COUPON</span><span class="rd-risk-value" style="color:#5c5;">${fmtMoney(bondAnnualCoupon)}</span></div>`;
        html += `<div class="rd-risk-row"><span class="rd-risk-label">TOTAL RETURN (${Math.round(bondTermYears)}yr)</span><span class="rd-risk-value" style="color:#5c5;">${fmtMoney(bondTotalReturn)}</span></div>`;

        html += `<div class="rd-expected"><span style="font-family:var(--font-mono);font-size:9px;font-weight:700;color:var(--panel-text);">EXPECTED RETURN</span><span style="font-family:var(--font-mono);font-size:14px;font-weight:700;color:#5c5;">${fmtMoney(bondExpectedReturn)}</span></div>`;
        html += `<div class="rd-formula">Risk-adjusted: total coupon × (1 - ${bondDefaultProb}% default)</div>`;
