    html += '</div>'; // close rd-right
    html += '</div>'; // close rd-body

    // ── FOOTER ──
    const footerCapital = rdType === 'LOAN' ? rdLoanAmount : rdType === 'INSURE' ? rdInsureCoverage : rdBondAmount;
    const footerReturn = rdType === 'LOAN' ? loanExpectedReturn : rdType === 'INSURE' ? insureExpectedProfit : bondExpectedReturn;
    const footerRisk = rdType === 'LOAN' ? defaultProb : rdType === 'INSURE' ? insureClaimProb : bondDefaultProb;
    const footerRiskColor = rdType === 'LOAN' ? defaultColor : rdType === 'INSURE' ? claimColor : bondDefaultColor;
    const actionLabel = rdType === 'LOAN' ? 'OFFER LOAN' : rdType === 'INSURE' ? 'WRITE POLICY' : 'BUY BONDS';
    const actionClass = rdType.toLowerCase();
    const alreadyOffered = !!d.alreadyOffered;
    const actionDisabled = alreadyOffered ? 'disabled' : '';
    const actionTitle = alreadyOffered ? ' title="You already have an offer on this request."' : '';
    const actionButtonLabel = alreadyOffered ? 'ALREADY OFFERED' : actionLabel;
    // DECLINE shares the alreadyOffered gate with the action button:
    // clicking decline on a card where this corp already has a pending
    // offer would INSERT a duplicate (request_id, offering_faction_id)
    // row into finance_loan_offers and fail the unique constraint
    // silently. Disabling the button here is the simplest prevention.
    // Tradeoff: a financier cannot retract a pending offer via this
    // path. If "retract + decline in one click" is wanted, convert
    // rdDecline to an UPDATE when alreadyOffered is true.
    const declineDisabled = alreadyOffered ? 'disabled' : '';
    const declineTitle = alreadyOffered ? ' title="Retract the pending offer first before declining."' : '';

    html += `<div class="rd-footer">
        <div style="display:flex;gap:12px;">
            <div class="rd-footer__metric"><div class="rd-footer__metric-label">CAPITAL AT RISK</div><div class="rd-footer__metric-value" style="color:#c55;">${fmtMoney(footerCapital)}</div></div>
            <div class="rd-footer__metric"><div class="rd-footer__metric-label">EXPECTED RETURN</div><div class="rd-footer__metric-value" style="color:#5c5;">${fmtMoney(footerReturn)}</div></div>
            <div class="rd-footer__metric"><div class="rd-footer__metric-label">RISK</div><div class="rd-footer__metric-value" style="color:${footerRiskColor};">${footerRisk}%</div></div>
        </div>
        <div style="display:flex;gap:6px;">
            <button class="rd-btn-decline" onclick="rdDecline()" ${declineDisabled}${declineTitle}>DECLINE</button>
            <button class="rd-btn-action ${actionClass}" onclick="rdSubmitOffer()" ${actionDisabled}${actionTitle}>${actionButtonLabel}</button>
        </div>
    </div>`;

    modal.innerHTML = html;
}

// ==================== SUBMIT OFFER ====================

let _submittingOffer = false;
async function rdSubmitOffer() {
    if (!rdDeal || !faction || !shard || _submittingOffer) return;
    if (rdDeal.alreadyOffered) {
        alert('You already submitted an offer for this request.');
        return;
    }
    _submittingOffer = true;

    const currentTick = shard.current_tick || 0;

    // Re-fetch live cash + active positions at submit time so the cap
    // check reflects anything the tick has changed since the page
    // loaded: loan repayments crediting cash, bond coupons landing,
    // insurance premiums collected, other loans paid down. The
    // module-level faction.corp_cash_reserves + apPortfolio can be
    // many minutes stale, which is exactly the state a player hits
    // right after a tick processes — cash in their "bank" goes up,
    // deployed principal goes down, but the cached numbers said the
    // cap was still blown from the old snapshot.
    const [cashRes, liveLoansRes] = await Promise.all([
        _supabase.from('factions').select('corp_cash_reserves').eq('id', faction.id).single(),
        _supabase.from('finance_active_loans')
            .select('principal, remaining_principal, finance_loan_requests!inner(request_type)')
            .eq('lender_faction_id', faction.id)
            .in('status', ['current', 'late', 'delinquent']),
    ]);
    if (cashRes.error || liveLoansRes.error) {
        alert('Could not verify current cash or portfolio. Try again.');
        _submittingOffer = false;
        return;
    }
    const cash = Number(cashRes.data?.corp_cash_reserves) || 0;
    // Mirror the shape apPortfolio uses so computeDeployable sees the
    // same fields it was designed for — principal / remaining /
    // coverage / faceValue / type.
    const livePortfolio = (liveLoansRes.data || []).map(l => {
        const req = l.finance_loan_requests?.request_type;
        const type = req === 'insurance' ? 'INSURE' : req === 'bond' ? 'BOND' : 'LOAN';
        const principal = Number(l.principal) || 0;
        const remainingPrincipal = Math.max(0, Number(l.remaining_principal || 0));
        return {
            type,
            principal,
            remaining: type === 'INSURE' ? 0 : remainingPrincipal,
            coverage:  type === 'INSURE' ? principal : 0,
            faceValue: type === 'BOND'   ? principal : 0,
        };
    });
    // Keep the in-memory caches aligned with what we just read so the
    // Reserves & Risk card (re-rendered after this submit) doesn't lag.
    if (faction) faction.corp_cash_reserves = cash;

    if (rdDeal.type === 'LOAN') {
        const rate = rdLoanRate;
        if (rate < 1 || rate > 20) { alert('Interest rate must be 1-20%.'); _submittingOffer = false; return; }

        // Use the live portfolio + live cash we just fetched, not the
        // module caches. Same helper the Reserves & Risk card calls
        // on render, so what the card shows and what the validator
        // enforces stay in sync once the cache catches up post-submit.
        const cap = computeDeployable(cash, livePortfolio, _branchCount, _hasDeregulation);
        if (rdDeal.amount > cap.deployable) {
            const why = cap.limiter === 'lending_cap'
                ? `Lending cap (${cap.lendingCapPct}% of total capital = ${fmtMoney(cap.lendingCap)}). Already deployed ${fmtMoney(cap.totalDeployed)}.`
                : `Reserve requirement (${Math.round(cap.reserveReqPct * 100)}% of exposure = ${fmtMoney(cap.requiredReserve)}). Cash ${fmtMoney(cap.cash)}.`;
            alert(
                `Insufficient deployable capital.\n${why}\n` +
                `Available: ${fmtMoney(cap.deployable)}\n` +
                `This loan: ${fmtMoney(rdDeal.amount)}` +
                (cap.limiter === 'lending_cap' && _branchCount === 0
                    ? '\n\nBuild a Branch Office to raise your lending cap (+15% each).'
                    : '')
            );
            _submittingOffer = false;
            return;
        }

        if (cash < rdDeal.amount) { alert('Insufficient cash reserves to fund this loan.'); _submittingOffer = false; return; }

        const collateralMap = { none: 'unsecured', equipment: 'equipment', property: 'property', full: 'property' };
        const collateral = collateralMap[rdLoanCollateral] || 'unsecured';

        const offerRow = {
            request_id: rdDeal.requestId,
            offering_faction_id: faction.id,
            interest_rate: rate,
            collateral_type: collateral,
            created_tick: currentTick,
        };
        if (rdLoanTermsText.trim()) offerRow.offer_terms = rdLoanTermsText.trim();

        const { error } = await _supabase.from('finance_loan_offers').insert(offerRow);
        if (error) {
            _submittingOffer = false;
            if (error.message.includes('unique') || error.message.includes('duplicate')) {
                alert('You have already submitted an offer for this loan request.');
            } else { alert('Failed to submit offer: ' + error.message); }
            return;
        }
    } else if (rdDeal.type === 'BOND') {
        if (cash < rdBondAmount) { alert('Insufficient cash reserves. Need ' + fmtMoney(rdBondAmount) + ', have ' + fmtMoney(cash) + '.'); _submittingOffer = false; return; }

        // Insert bond purchase as an offer (immediate — no acceptance needed from gov)
        const { error: offerErr } = await _supabase.from('finance_loan_offers').insert({
            request_id: rdDeal.requestId,
            offering_faction_id: faction.id,
            interest_rate: rdDeal.couponRate,
            collateral_type: 'unsecured',
            status: 'accepted',
            created_tick: currentTick,
        });
        if (offerErr) { alert('Failed to buy bonds: ' + offerErr.message); _submittingOffer = false; return; }

        // Create active loan record (bond position).
        // borrower_faction_id has a FK to factions — previously this was set
        // to rdDeal.requestId (a request UUID, NOT a faction UUID), which
        // violated the FK on every bond purchase. Resolve the issuing
        // faction from the bond request row itself — that's the PM's party
        // that issued the bond.
        const r = (rdDeal.couponRate / 100) / 12;
        const n = rdDeal.term;
        const monthlyPayment = Math.round(rdBondAmount * r); // coupon only, no amortization

        const { data: bondReq, error: reqErr } = await _supabase
            .from('finance_loan_requests')
            .select('requesting_faction_id')
            .eq('id', rdDeal.requestId)
            .single();
        if (reqErr || !bondReq?.requesting_faction_id) {
            alert('Failed to create bond position: could not resolve issuer faction.');
            _submittingOffer = false;
            return;
        }

        const { error: loanErr } = await _supabase.from('finance_active_loans').insert({
            request_id: rdDeal.requestId,
            offer_id: null,
            borrower_faction_id: bondReq.requesting_faction_id,
            lender_faction_id: faction.id,
            nation_id: rdDeal.nation_id || faction.nation_id,
            principal: rdBondAmount,
            interest_rate: rdDeal.couponRate,
            term_months: rdDeal.term,
            collateral_type: 'unsecured',
            purpose: rdDeal.purpose,
            monthly_payment: monthlyPayment,
            started_tick: currentTick,
        });
        if (loanErr) { alert('Failed to create bond position: ' + loanErr.message); _submittingOffer = false; return; }

        // Deduct cash from investment bank
        await _supabase.from('factions').update({
            corp_cash_reserves: Math.max(0, cash - rdBondAmount)
        }).eq('id', faction.id);

        // Nation receives bond proceeds (government borrows from banker)
        // Debt INCREASES because the nation now owes this principal back at maturity
        const { data: nationData } = await _supabase.from('nations').select('debt').eq('id', rdDeal.nation_id).single();
        if (nationData) {
            const { error: debtErr } = await _supabase.from('nations').update({
                debt: Number(nationData.debt || 0) + rdBondAmount
            }).eq('id', rdDeal.nation_id);
            if (debtErr) console.warn('[Bonds] Failed to update nation debt:', debtErr.message);
        }

        faction.corp_cash_reserves = Math.max(0, cash - rdBondAmount);
    } else if (rdDeal.type === 'INSURE') {
        // Insurance: write policy — no upfront cost, premiums collected per tick
        const annualPremium = rdInsurePremium;
        const coverage = rdInsureCoverage;
        const deductible = rdInsureDeductible;
        const monthlyPremiumAmt = Math.round(coverage * (annualPremium / 100) / 12);

        const { error: offerErr } = await _supabase.from('finance_loan_offers').insert({
            request_id: rdDeal.requestId,
            offering_faction_id: faction.id,
            interest_rate: annualPremium,
            collateral_type: 'unsecured',
            status: 'accepted',
            created_tick: currentTick,
        });
        if (offerErr) {
            _submittingOffer = false;
            if (offerErr.message.includes('unique') || offerErr.message.includes('duplicate')) {
                alert('You have already submitted a policy offer for this request.');
            } else {
                alert('Failed to write policy: ' + offerErr.message);
            }
            return;
        }

        // Mark request as funded and get the requesting faction.
        // NOTE: the loan_requests_update RLS policy only allows the
        // REQUESTING corp to update — the offering corp (us) is blocked.
        // That returns {data:null, error:null}, silently. The acceptedSet
        // filter in loadDealFlow() is what actually keeps written deals off
        // the board for the offering corp. We still attempt the flip here
        // so the funded_tick is set if RLS is ever loosened, and we warn
        // on BOTH outcomes so the real status is visible in the console.
        const { data: fundedReq, error: fundedErr } = await _supabase.from('finance_loan_requests').update({
            status: 'funded', funded_tick: currentTick,
        }).eq('id', rdDeal.requestId).select('requesting_faction_id').single();
        if (fundedErr) console.warn('[Insurance] Failed to mark request funded:', fundedErr.message);
        else if (!fundedReq) console.warn('[Insurance] Request status flip returned no row (likely RLS-blocked) for requestId:', rdDeal.requestId);

        // Create active insurance policy as a loan record
        const policyRow = {
            request_id: rdDeal.requestId,
            offer_id: null,
            borrower_faction_id: fundedReq?.requesting_faction_id || rdDeal.requestingFactionId,
            lender_faction_id: faction.id,
            nation_id: faction.nation_id,
            principal: coverage,
            interest_rate: annualPremium,
            term_months: rdInsureTerm,
            collateral_type: 'unsecured',
            purpose: rdDeal.isVesselInsurance
                ? 'Vessel Insurance — ' + rdDeal.applicant
                : 'Insurance Policy — ' + rdDeal.applicant,
            monthly_payment: monthlyPremiumAmt,
            started_tick: currentTick,
            deductible_pct: deductible,
            policy_terms: rdPolicyTerms.trim() || null,
        };
        // Link to vessel or contract
        if (rdDeal.insuredVesselId) policyRow.insured_vessel_id = rdDeal.insuredVesselId;
        if (rdDeal.insuredContractId) policyRow.insured_contract_id = rdDeal.insuredContractId;

        const { error: policyErr } = await _supabase.from('finance_active_loans').insert(policyRow);
        if (policyErr) { alert('Failed to create policy record: ' + policyErr.message); _submittingOffer = false; return; }
    } else {
        _submittingOffer = false;
        return;
    }

    rdClose();
    dfSelected = -1;
    // Refresh portfolio too so the Reserves & Risk card reflects the new
    // BOND / INSURANCE position immediately (LOAN offers are still
    // pending acceptance so apPortfolio is unchanged for that path, but
    // running the reload unconditionally is a single SELECT and keeps
    // the two caches aligned post-submit).
    await Promise.all([loadDealFlow(), loadActivePortfolio()]);
    _submittingOffer = false;
}

window.rdSubmitOffer = rdSubmitOffer;

// ==================== LOAD ACTIVE PORTFOLIO ====================

async function loadActivePortfolio() {
    if (!faction) { renderActivePortfolio(); return; }

    const { data: loans } = await _supabase
        .from('finance_active_loans')
        .select('*, borrower:factions!borrower_faction_id(id, faction_name, abbreviation, corp_ticker, nation), loan_nation:nations!nation_id(name), finance_loan_requests!inner(request_type)')
        .eq('lender_faction_id', faction.id)
        .in('status', ['current', 'late', 'delinquent'])
        .order('started_tick', { ascending: false });

    const TYPE_MAP = { loan: 'LOAN', bond: 'BOND', insurance: 'INSURE', equity: 'EQUITY' };
    const isInsurance = (loan) => loan.finance_loan_requests?.request_type === 'insurance';
    const isEquity = (loan) => loan.finance_loan_requests?.request_type === 'equity';
    const loanCashCollected = (loan) => {
        const monthlyPayment = Number(loan.monthly_payment || 0);
        const paymentsMade = Number(loan.payments_made || 0);
        const bookedTotalPaid = Number(loan.total_paid || 0);
        const fallbackPaid = monthlyPayment * paymentsMade;
        return Math.max(0, bookedTotalPaid || fallbackPaid);
    };
    const loanInterestRevenue = (loan) => {
        const cashCollected = loanCashCollected(loan);
        return Math.max(0, Math.min(cashCollected, Number(loan.total_interest_paid || 0)));
    };
    const loanPrincipalRepaid = (loan) => Math.max(0, loanCashCollected(loan) - loanInterestRevenue(loan));
    // True remaining balance. Previously `principal - total_paid` — but
    // total_paid accumulates the FULL monthly payment (interest + principal)
    // in the tick processor, so subtracting it from principal drifts NEGATIVE
    // past a loan's amortization crossover. Correct identity:
    //   principal_paid = total_paid - total_interest_paid
    //   remaining      = principal - principal_paid
    // Math.max(0, …) guards against floating-point underflow at the last
    // payment of a loan's term.
    const loanRemaining = (loan) => Math.max(
        0,
        Number(loan.principal || 0)
        - Number(loan.total_paid || 0)
        + Number(loan.total_interest_paid || 0)
    );
    apPortfolio = (loans || []).map(loan => ({
        monthlyInterestPortion: Math.max(0, Math.min(
            Number(loan.monthly_payment || 0),
            Math.round(Math.max(0, Number(loan.remaining_principal || 0)) * ((Number(loan.interest_rate || 0) / 100) / 12))
        )),
        monthlyPrincipalPortion: Math.max(0, Number(loan.monthly_payment || 0) - Math.max(0, Math.min(
            Number(loan.monthly_payment || 0),
            Math.round(Math.max(0, Number(loan.remaining_principal || 0)) * ((Number(loan.interest_rate || 0) / 100) / 12))
        ))),
        id: loan.id,
        type: TYPE_MAP[loan.finance_loan_requests?.request_type] || 'LOAN',
        counterparty: loan.borrower?.faction_name || 'Unknown',
        abbr: loan.borrower?.abbreviation || loan.borrower?.corp_ticker || '??',
        nation: loan.loan_nation?.name || loan.borrower?.nation || 'Unknown',
        // Equity is perpetual — principal stays fully deployed as "exposure".
        // Insurance has no principal exposure (it's a service contract).
        remaining: isInsurance(loan) ? 0
            : isEquity(loan) ? Number(loan.principal || 0)
            : Math.max(0, Number(loan.remaining_principal || 0)),
        principal: loan.principal,
        // EARNED for equity = cumulative dividends (total_paid is pure dividend since monthly_payment=0).
        earned: isInsurance(loan) ? ((loan.monthly_payment || 0) * (loan.payments_made || 0))
            : isEquity(loan) ? Number(loan.total_paid || 0)
            : loanInterestRevenue(loan),
        cashCollected: (isInsurance(loan) || isEquity(loan)) ? undefined : loanCashCollected(loan),
        interestRevenue: (isInsurance(loan) || isEquity(loan)) ? undefined : loanInterestRevenue(loan),
        principalRepaid: (isInsurance(loan) || isEquity(loan)) ? undefined : loanPrincipalRepaid(loan),
        // For equity, rate = equity_pct (stake %) so AVG RATE in the footer is meaningful.
        rate: isEquity(loan) ? Number(loan.equity_pct || 0) : loan.interest_rate,
        term: loan.term_months,
        paymentsMade: loan.payments_made,
        paymentsMissed: loan.payments_missed,
        monthlyPayment: loan.monthly_payment,
        status: loan.status.toUpperCase(),
        collateral: loan.collateral_type,
        purpose: loan.purpose || '',
        hasAlert: loan.status === 'late' || loan.status === 'delinquent',
        alertLevel: loan.status === 'delinquent' ? 'red' : loan.status === 'late' ? 'orange' : null,
        alertMsg: loan.status === 'delinquent'
            ? `${loan.payments_missed} missed payments. Default imminent.`
            : loan.status === 'late'
            ? `${loan.payments_missed} missed payment${loan.payments_missed > 1 ? 's' : ''}. Monitor closely.`
            : null,
        // Insurance-specific fields
        coverage: isInsurance(loan) ? loan.principal : undefined,
        premiumsCollected: isInsurance(loan) ? ((loan.monthly_payment || 0) * (loan.payments_made || 0)) : undefined,
        paidOut: isInsurance(loan) ? (loan.claims_paid || 0) : undefined,
        claims: isInsurance(loan) ? (loan.claims_count || 0) : undefined,
        deductible: isInsurance(loan) ? (loan.deductible_pct || 0) : undefined,
        // Equity-specific fields
        equityPct: isEquity(loan) ? Number(loan.equity_pct || 0) : undefined,
        series: isEquity(loan) ? (loan.series || '?') : undefined,
        dividendsReceived: isEquity(loan) ? Number(loan.total_paid || 0) : undefined,
        lastDividendTick: isEquity(loan) ? loan.last_payment_tick : undefined,
        lastDividendAmount: isEquity(loan) ? Number(loan.last_payment_amount || 0) : undefined,
        forSalePrice: isEquity(loan) && loan.for_sale_price != null ? Number(loan.for_sale_price) : null,
    }));

    renderActivePortfolio();
}

// ==================== LOAD COLLECTIONS ====================

async function loadCollections() {
    if (!faction) { renderCollections(); return; }

    const { data: loans } = await _supabase
        .from('finance_active_loans')
        .select('*, borrower:factions!borrower_faction_id(id, faction_name, abbreviation, corp_ticker, nation), loan_nation:nations!nation_id(name), finance_loan_requests!inner(request_type)')
        .eq('lender_faction_id', faction.id)
        .in('status', ['repaid', 'defaulted'])
        .order('completed_tick', { ascending: false });

    const CTYPE_MAP = { loan: 'LOAN', bond: 'BOND', insurance: 'INSURE' };
    ccResolved = (loans || []).map(loan => {
        const earned = loan.total_interest_paid || 0;
        const lost = loan.status === 'defaulted' ? Math.max(0, Number(loan.remaining_principal || 0)) : 0;
        return {
            type: CTYPE_MAP[loan.finance_loan_requests?.request_type] || 'LOAN',
            counterparty: loan.borrower?.faction_name || 'Unknown',
            abbr: loan.borrower?.abbreviation || loan.borrower?.corp_ticker || '??',
            nation: loan.loan_nation?.name || loan.borrower?.nation || '',
            outcome: loan.status === 'repaid' ? 'REPAID' : 'DEFAULTED',
            principal: loan.principal,
            earned,
            lost,
            net: earned - lost,
            resolved: loan.completed_tick ? 'Tick ' + loan.completed_tick : '',
            term: loan.term_months + 'mo',
            rate: loan.interest_rate + '%',
            note: loan.status === 'repaid'
                ? `Fully repaid over ${loan.payments_made} payments.`
                : `Defaulted after ${loan.payments_missed} missed payments. ${loan.collateral_type !== 'unsecured' ? 'Collateral (' + loan.collateral_type + ') partially recovered losses.' : 'Unsecured — no collateral recovery.'}`,
        };
    });

    renderCollections();
}

// ==================== HEALTH INSURANCE (Phase 2) ====================
//
// Phase 2 adds live policyholder pools + premium revenue. The tick processor
// (advance-corp-tick → processHealthInsurancePools) writes to
// health_insurance_pools each tick; this panel reads that table plus the
// owned Insurance Offices and renders a per-nation pool card.
//
// The blocker states from Phase 1 still apply:
//   – LOCKED: no Insurance Office owned
//   – POLICY-BLOCKED: every owned office is in a nation with Universal Healthcare
//   – UNDERSTAFFED: corp_skilled_workforce < 60% of total office capacity
//   – UNVERIFIED: active_laws lookup failed (can't confirm policy gate)
//   – READY: at least one office is operating normally

// Tunables mirrored from the tick processor so the UI can show projected
// caps + forthcoming premium without a round-trip. Keep in sync with
// supabase/functions/advance-corp-tick/index.ts processHealthInsurancePools.
const HI_POLICIES_PER_CAPACITY = 50;
const HI_SKILLED_WORKFORCE_RATIO = 0.60;

let _hiState = {
    subsectorAllowed: false,    // corp_subsector === 'insurance'
    offices: [],                // [{ id, name, capacity, nation_id, nation_name }]
    poolsByNation: {},          // nation_id → pool row
    universalHealthcareNations: new Set(), // nation_ids where the Act is in force
    lawsLookupFailed: false,    // true if the active_laws fetch errored
    officesLookupFailed: false, // true if corp_properties fetch errored
    poolsLookupFailed: false,   // true if health_insurance_pools fetch errored
    skilled: 0,                 // faction.corp_skilled_workforce
    skilledRequired: 0,         // ~60% of total office capacity
};

async function loadHealthInsurance() {
    if (!faction) { renderHealthInsurance(); return; }

    _hiState.subsectorAllowed = (faction.corp_subsector || '').toLowerCase() === 'insurance';
    _hiState.skilled = Number(faction.corp_skilled_workforce || 0);
    _hiState.offices = [];
    _hiState.poolsByNation = {};
    _hiState.universalHealthcareNations = new Set();
    _hiState.skilledRequired = 0;
    _hiState.officesLookupFailed = false;
    _hiState.poolsLookupFailed = false;
    _hiState.lawsLookupFailed = false;

    if (!_hiState.subsectorAllowed) { renderHealthInsurance(); return; }

    // Owned Insurance Offices across all nations the corp operates in
    const { data: offices, error: officesErr } = await _supabase
        .from('corp_properties')
        .select('id, name, capacity, nation_id, nations:nation_id(name)')
        .eq('faction_id', faction.id)
        .eq('type', 'insurance_office')
        .eq('is_active', true);
    if (officesErr) {
        console.warn('[HealthIns] office fetch failed:', officesErr.message);
        _hiState.officesLookupFailed = true;
    }

    _hiState.offices = (offices || []).map(o => ({
        id: o.id,
        name: o.name,
        capacity: Number(o.capacity || 0),
        nation_id: o.nation_id,
        nation_name: o.nations?.name || 'Unknown',
    }));

    const totalCapacity = _hiState.offices.reduce((s, o) => s + o.capacity, 0);
    _hiState.skilledRequired = Math.ceil(totalCapacity * HI_SKILLED_WORKFORCE_RATIO);

    const officeNationIds = [...new Set(_hiState.offices.map(o => o.nation_id))];

    // Parallel: laws lookup + pool rows. Independent queries so we don't
    // pay sequential round-trips; a failure in one shouldn't block the other.
    const [lawsRes, poolsRes] = await Promise.all([
        officeNationIds.length > 0
            ? _supabase.from('active_laws')
                .select('nation_id, policy:policies!policy_id(policy_key)')
                .in('nation_id', officeNationIds)
            : Promise.resolve({ data: [], error: null }),
        _supabase.from('health_insurance_pools')
            .select('*')
            .eq('faction_id', faction.id),
    ]);

    // Universal Healthcare gate. If the lookup fails we surface the error in
    // the panel rather than silently flipping to READY — a missed gate could
    // let a corp claim to operate in a nation where the Act is in force.
    if (lawsRes.error) {
        console.warn('[HealthIns] active_laws fetch failed:', lawsRes.error.message);
        _hiState.lawsLookupFailed = true;
    } else {
        for (const l of (lawsRes.data || [])) {
            if (l.policy?.policy_key === 'universal_healthcare') {
                _hiState.universalHealthcareNations.add(l.nation_id);
            }
        }
    }

    // Index pools by nation. New offices in a nation where no pool exists yet
    // (tick hasn't run since construction) render with zero policyholders.
    // A fetch failure is surfaced in the UI rather than silently showing
    // zeroes — a corp with a real pool would think they're earning nothing.
    if (poolsRes.error) {
        console.warn('[HealthIns] pools fetch failed:', poolsRes.error.message);
        _hiState.poolsLookupFailed = true;
    } else {
        for (const pool of (poolsRes.data || [])) {
            _hiState.poolsByNation[pool.nation_id] = pool;
        }
    }

    renderHealthInsurance();
}

function renderHealthInsurance() {
    const container = document.getElementById('hi-container');
    if (!container) return;

    // Non-Insurance subsector corps see a "not available" stub. Phase 1 only
    // surfaces the panel for Insurance corps; other Finance subsectors
    // (Banking, Investment) get a one-line note.
    if (!_hiState.subsectorAllowed) {
        container.innerHTML = `
        <div class="hi-header">
            <div class="hi-header__title">Health Insurance</div>
            <div class="hi-header__badge hi-badge-locked">N/A</div>
        </div>
        <div class="hi-body">
            <div class="hi-callout">
                <div class="hi-callout__title">Insurance subsector only</div>
                <div class="hi-callout__body">Health Insurance is a product of the Insurance subsector. Banking and Investment corps cannot offer it.</div>
            </div>
        </div>`;
        return;
    }

    const officeCount = _hiState.offices.length;
    const totalCapacity = _hiState.offices.reduce((s, o) => s + o.capacity, 0);
    const blockedNations = _hiState.universalHealthcareNations;
    const operatingOffices = _hiState.offices.filter(o => !blockedNations.has(o.nation_id));
    const operatingCapacity = operatingOffices.reduce((s, o) => s + o.capacity, 0);
    const understaffed = _hiState.skilled < _hiState.skilledRequired;

    let badgeClass, badgeLabel;
    if (officeCount === 0) { badgeClass = 'hi-badge-locked'; badgeLabel = 'LOCKED'; }
    else if (operatingOffices.length === 0) { badgeClass = 'hi-badge-gated'; badgeLabel = 'POLICY-BLOCKED'; }
    else if (_hiState.lawsLookupFailed) { badgeClass = 'hi-badge-understaffed'; badgeLabel = 'UNVERIFIED'; }
    else if (understaffed) { badgeClass = 'hi-badge-understaffed'; badgeLabel = 'UNDERSTAFFED'; }
    else { badgeClass = 'hi-badge-ready'; badgeLabel = 'READY'; }

    let bodyHtml = '';

    // ── State 1: no Insurance Office anywhere ──
    if (officeCount === 0) {
        // Distinguish "truly no offices" from "couldn't fetch offices". The
        // two look identical on-screen without this flag and would mislead a
        // player who has offices but hit a transient Supabase error.
        bodyHtml = _hiState.officesLookupFailed
            ? `
            <div class="hi-callout" style="border-color:rgba(200,132,68,0.45);">
                <div class="hi-callout__title" style="color:#c84;">Could not load offices</div>
                <div class="hi-callout__body">Failed to fetch your Insurance Office properties. Refresh the page; if this persists, check your connection and open the console for details.</div>
            </div>`
            : `
            <div class="hi-callout">
                <div class="hi-callout__title">Build an Insurance Office to begin</div>
                <div class="hi-callout__body">
                    A Health Insurance operation needs a physical Insurance Office in a nation before policies can be written.
                    You can <strong>buy</strong> one from the property marketplace, <strong>commission</strong> one via Construction Project,
                    or <strong>convert</strong> an existing office.
                </div>
            </div>
            <a class="hi-cta" href="expansion.html">GO TO PROPERTY &amp; EXPANSION →</a>`;
    } else {
        // ── States 2-4: at least one office exists ──
        // Group offices by nation so we can render one pool card per nation
        // (pools live at the (faction, nation) level, not per-office).
        const nationMap = {};
        for (const o of _hiState.offices) {
            if (!nationMap[o.nation_id]) {
                nationMap[o.nation_id] = { nation_id: o.nation_id, nation_name: o.nation_name, offices: [], capacity: 0 };
            }
            nationMap[o.nation_id].offices.push(o);
            nationMap[o.nation_id].capacity += o.capacity;
        }

        // Corp-wide totals across all pools
        const totalPolicyholders = Object.values(_hiState.poolsByNation).reduce((s, p) => s + Number(p.policyholders || 0), 0);
        const lastTickRevenue = Object.values(_hiState.poolsByNation).reduce((s, p) => s + Number(p.last_tick_revenue || 0), 0);
        const lifetimeRevenue = Object.values(_hiState.poolsByNation).reduce((s, p) => s + Number(p.total_revenue_collected || 0), 0);

        const skilledColor = understaffed ? '#c84' : '#5c5';
        const skilledNote = understaffed
            ? `Need ${(_hiState.skilledRequired - _hiState.skilled).toLocaleString()} more skilled workers to staff offices. Offices are idle — no policyholder growth, no revenue.`
            : `Skilled workforce sufficient to staff all offices.`;

        // Per-nation pool cards
        const poolCardsHtml = Object.values(nationMap).map(n => {
            const pool = _hiState.poolsByNation[n.nation_id];
            const blocked = blockedNations.has(n.nation_id);
            const maxPolicyholders = n.capacity * HI_POLICIES_PER_CAPACITY;
            const holders = pool ? Number(pool.policyholders || 0) : 0;
            const fillPct = maxPolicyholders > 0 ? Math.min(100, Math.round(holders / maxPolicyholders * 100)) : 0;
            const addressable = pool ? Number(pool.last_tick_addressable || 0) : 0;
            const premium = pool ? Number(pool.last_tick_premium || 0) : 0;
            const revenue = pool ? Number(pool.last_tick_revenue || 0) : 0;

            const tagColor = blocked ? '#c55' : (understaffed ? '#c84' : '#5c5');
            const tagLabel = blocked ? 'BLOCKED' : (understaffed ? 'IDLE' : 'OPERATING');
            const barColor = blocked || understaffed ? '#6a6660' : '#5c5';
            const borderColor = blocked ? 'rgba(204,85,85,0.35)' : 'var(--panel-border)';

            return `
            <div class="hi-callout" style="padding:8px 10px;border-color:${borderColor};">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;">
                    <div style="font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:0.8px;color:var(--text-bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(n.nation_name)}</div>
                    <span style="font-family:var(--font-mono);font-size:8px;font-weight:700;padding:2px 6px;color:${tagColor};border:1px solid ${tagColor}55;background:${tagColor}11;flex-shrink:0;">${tagLabel}</span>
                </div>
                <div style="display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;color:#9e9a92;margin-bottom:3px;">
                    <span>Policyholders</span>
                    <span style="color:var(--panel-text);font-weight:700;">${holders.toLocaleString()} / ${maxPolicyholders.toLocaleString()}</span>
                </div>
                <div style="width:100%;height:3px;background:var(--panel-border);margin-bottom:6px;">
                    <div style="width:${fillPct}%;height:100%;background:${barColor};"></div>
                </div>
                <div class="hi-stat-row">
                    <span class="hi-stat-label">Addressable Market</span>
                    <span class="hi-stat-value">${addressable > 0 ? addressable.toLocaleString() : '—'}</span>
                </div>
                <div class="hi-stat-row">
                    <span class="hi-stat-label">Premium / mo</span>
                    <span class="hi-stat-value">${premium > 0 ? '$' + premium.toLocaleString() : '—'}</span>
                </div>
                <div class="hi-stat-row">
                    <span class="hi-stat-label">Last Tick Revenue</span>
                    <span class="hi-stat-value" style="color:${revenue > 0 ? '#5c5' : '#6a6660'};">${revenue > 0 ? '+' + fmtMoney(revenue) : '—'}</span>
                </div>
                <div class="hi-stat-row">
                    <span class="hi-stat-label">Offices</span>
                    <span class="hi-stat-value">${n.offices.length} · cap ${n.capacity.toLocaleString()}</span>
                </div>
            </div>`;
        }).join('');

        const noPoolsYet = Object.keys(_hiState.poolsByNation).length === 0;

        bodyHtml = `
            <div class="hi-callout">
                <div class="hi-callout__title">Phase 2 — Premium income</div>
                <div class="hi-callout__body">${noPoolsYet
                    ? `Offices are built but the corp tick hasn't processed yet. Policyholders start arriving on the next tick.`
                    : `Policyholders grow slowly toward the addressable-market cap each tick. Premium scales with the nation's inflation.`}</div>
            </div>

            <div class="hi-callout" style="padding:8px 12px;">
                <div class="hi-stat-row">
                    <span class="hi-stat-label">Total Policyholders</span>
                    <span class="hi-stat-value">${totalPolicyholders.toLocaleString()}</span>
                </div>
                <div class="hi-stat-row">
                    <span class="hi-stat-label">Last Tick Revenue</span>
                    <span class="hi-stat-value" style="color:${lastTickRevenue > 0 ? '#5c5' : '#6a6660'};">${lastTickRevenue > 0 ? '+' + fmtMoney(lastTickRevenue) : '—'}</span>
                </div>
                <div class="hi-stat-row">
                    <span class="hi-stat-label">Lifetime Revenue</span>
                    <span class="hi-stat-value">${lifetimeRevenue > 0 ? fmtMoney(lifetimeRevenue) : '—'}</span>
                </div>
                <div class="hi-stat-row">
                    <span class="hi-stat-label">Skilled Workforce</span>
                    <span class="hi-stat-value" style="color:${skilledColor}">${_hiState.skilled.toLocaleString()} / ${_hiState.skilledRequired.toLocaleString()}</span>
                </div>
            </div>

            ${blockedNations.size > 0 ? `
            <div class="hi-callout" style="border-color:rgba(204,85,85,0.35);">
                <div class="hi-callout__title" style="color:#c55;">Universal Healthcare in force</div>
                <div class="hi-callout__body">${blockedNations.size} of your nation${blockedNations.size > 1 ? 's' : ''} have the Universal Healthcare Act active. Insurance Offices in those nations cannot write new private health policies.</div>
            </div>` : ''}

            ${_hiState.lawsLookupFailed ? `
            <div class="hi-callout" style="border-color:rgba(200,132,68,0.45);">
                <div class="hi-callout__title" style="color:#c84;">Policy gate unverified</div>
                <div class="hi-callout__body">Could not check active laws — Universal Healthcare blocking is unconfirmed. Refresh the page; if this persists, do not assume offices are clear to operate.</div>
            </div>` : ''}

            ${_hiState.poolsLookupFailed ? `
            <div class="hi-callout" style="border-color:rgba(200,132,68,0.45);">
                <div class="hi-callout__title" style="color:#c84;">Pool data unavailable</div>
                <div class="hi-callout__body">Could not load health insurance pool stats — the policyholder and revenue numbers shown may be stale or missing. Refresh the page.</div>
            </div>` : ''}

            ${understaffed ? `
            <div class="hi-callout" style="border-color:${skilledColor}55;">
                <div class="hi-callout__title" style="color:${skilledColor};">Staffing</div>
                <div class="hi-callout__body">${skilledNote}</div>
            </div>` : ''}

            <div>
                <div style="font-family:var(--font-mono);font-size:9px;color:#6a6660;letter-spacing:0.8px;text-transform:uppercase;margin-bottom:4px;">Pools</div>
                ${poolCardsHtml}
            </div>`;
    }

    container.innerHTML = `
        <div class="hi-header">
            <div class="hi-header__title">Health Insurance</div>
            <div class="hi-header__badge ${badgeClass}">${badgeLabel}</div>
        </div>
        <div class="hi-body">
            ${bodyHtml}
        </div>`;
}

// Actions still lives inside corp-operations.html for now (Expansion
async function init() {
    const urlTab = new URLSearchParams(window.location.search).get('tab');
    // Legacy ?tab=expansion and ?tab=actions bookmarks: redirect to the
    // standalone pages. Both Expansion and Actions now live on dedicated
    // URLs (as of Alpha 2.2.2.0 and 2.2.2.2 respectively).
    if (urlTab === 'actions') {
        window.location.href = 'actions.html';
        return;
    }
    if (urlTab === 'expansion') {
        window.location.href = 'expansion.html';
        return;
    }

    const { data: { user } } = await _supabase.auth.getUser();
    if (!user) { window.location.href = 'login.html'; return; }

    // Inspector mode: admin panel impersonation via ?faction_id= URL
    // param. Fetch the target faction directly and skip sessionStorage
    // writes + sector redirects so the admin's real session isn't
    // disturbed and the page they picked isn't auto-navigated away.
    const urlFactionId = new URLSearchParams(location.search).get('faction_id');
    const isInspectorMode = !!urlFactionId;
    if (isInspectorMode) {
        const { data: inspected, error: inspectErr } = await _supabase.from('factions').select('*').eq('id', urlFactionId).single();
        if (inspectErr) console.warn('[Inspector] faction fetch failed:', inspectErr.message);
        else if (inspected?.faction_type === 'corporation') faction = inspected;
    }

    if (!faction) {
        const { data: allFactions } = await _supabase
            .from('factions')
            .select('*')
            .or(`id.eq.${user.id},linked_user_id.eq.${user.id}`);

        allUserFactions = (allFactions || []).filter(f => f.nation_id);

        const activeFactionId = sessionStorage.getItem('active_faction_id');
        faction = allUserFactions.find(f => f.id === activeFactionId)
            || allUserFactions.find(f => f.faction_type === 'corporation')
            || allUserFactions[0];

        if (!faction) {
            await _supabase.auth.signOut();
            window.location.href = 'login.html';
            return;
        }

        if (faction.faction_type !== 'corporation') {
            window.location.href = 'dashboard.html';
            return;
        }

        // If this corp is NOT Finance, redirect to the correct operations page
        if (faction.corp_sector !== 'Finance') {
            window.location.href = (SECTOR_OPS_PAGE[faction.corp_sector] || 'corp-operations.html') + window.location.search;
            return;
        }

        sessionStorage.setItem('active_faction_id', faction.id);
    }

    // Load nation + shard
    const [nationRes, shardRes] = await Promise.all([
        faction.nation_id
            ? _supabase.from('nations').select('*').eq('id', faction.nation_id).single()
            : Promise.resolve({ data: null }),
        _supabase.from('shard').select('current_tick, current_date, next_tick_at, tick_interval_hours').eq('name', 'Alpha Shard').single(),
    ]);

    if (nationRes.data) nationStats = nationRes.data;
    shard = shardRes.data;

    // Render shared top bar
    const _topBarContainer = document.getElementById('corp-topbar-container');
    if (_topBarContainer) {
        const { renderCorpTopBar } = await import('./js/corp-topbar.js');
        renderCorpTopBar(_topBarContainer, { faction, shard, activeTab: 'operations', allUserFactions });
    }

    // Faction switcher
    renderFactionSwitcher();

    // Check for Financial Sector Deregulation Act
    if (faction.nation_id) {
        const { data: laws } = await _supabase.from('active_laws')
            .select('id, policy:policies!policy_id(policy_key)')
            .eq('nation_id', faction.nation_id).limit(100);
        _hasDeregulation = (laws || []).some(l =>
            l.policy?.policy_key?.startsWith('financial_sector_deregulation'));
    }

    // Fetch active branch office count once — feeds computeDeployable for
    // both the Reserves & Risk card and the loan-offer validator so the
    // two stay aligned.
    {
        const { data: branches } = await _supabase
            .from('corp_properties')
            .select('id')
            .eq('faction_id', faction.id)
            .eq('type', 'branch_office')
            .eq('is_active', true);
        _branchCount = branches?.length || 0;
    }

    // Load data and render containers
    await loadDealFlow();
    await loadActivePortfolio();
    renderReservesRisk();
    await loadCollections();
    await loadHealthInsurance();

    // Tick countdown (corp tick is midpoint between political ticks)
    if (shard?.next_tick_at) {
        const intervalMs = (Number(shard.tick_interval_hours) || 8) * 3600000;
        const politicalTickAt = new Date(shard.next_tick_at).getTime();
        const lastAdvanceAt = politicalTickAt - intervalMs;
        const corpDueAt = lastAdvanceAt + (intervalMs / 2);
        const nextCorpTickAt = new Date(corpDueAt > Date.now() ? corpDueAt : politicalTickAt + (intervalMs / 2));
        startCountdown(nextCorpTickAt);
    }

}

function renderFactionSwitcher() {
    const dropdown = document.getElementById('corp-faction-dropdown');
    if (!dropdown || allUserFactions.length <= 1) return;
    let html = '';
    for (const f of allUserFactions) {
        const isActive = f.id === faction.id;
        const label = f.faction_type === 'corporation' ? 'CORP' : 'PARTY';
        html += `<div class="corp-faction-dropdown__item${isActive ? ' active' : ''}" onclick="switchFaction('${f.id}')">
            <span style="font-size:7px;padding:1px 4px;background:${f.faction_type === 'corporation' ? 'rgba(90,175,165,0.1)' : 'rgba(200,168,50,0.1)'};border:1px solid ${f.faction_type === 'corporation' ? 'var(--teal-border)' : 'rgba(200,168,50,0.2)'};color:${f.faction_type === 'corporation' ? 'var(--teal)' : 'var(--amber)'}">${label}</span>
            <span>${escapeHtml(f.faction_name || '--')}</span>
        </div>`;
    }
    dropdown.innerHTML = html;
}

function toggleCorpDropdown() {
    document.getElementById('corp-faction-dropdown').classList.toggle('open');
}

function switchFaction(factionId) {
    sessionStorage.setItem('active_faction_id', factionId);
    const f = allUserFactions.find(x => x.id === factionId);
    if (f && f.faction_type === 'party') {
        window.location.href = 'dashboard.html';
    } else {
        // Route to the target corp's sector-specific Operations page —
        // a plain reload keeps non-Finance corps on the Finance page
        // until the init() sector-guard redirects them.
        window.location.href = SECTOR_OPS_PAGE[f?.corp_sector] || 'corp-operations.html';
    }
}

async function doLogout() {
    await _supabase.auth.signOut();
    window.location.href = 'login.html';
}

function startCountdown(nextTickAt) {
    const el = document.getElementById('tick-countdown');
    if (!el) return;
    function update() {
        const diff = new Date(nextTickAt) - new Date();
        if (diff <= 0) { el.textContent = 'Processing...'; return; }
        const h = Math.floor(diff / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        el.textContent = `${h}h ${m}m ${s}s`;
    }
    update();
    setInterval(update, 1000);
}

window.toggleCorpDropdown = toggleCorpDropdown;
window.switchFaction = switchFaction;
window.doLogout = doLogout;

init();
</script>
</body>
</html>
