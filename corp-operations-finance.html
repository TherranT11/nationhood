        const d = ccResolved[i];
        const tm = DF_TYPE_META[d.type] || { class: 'loan', label: d.type };
        const om = CC_OUTCOME_META[d.outcome] || { color: '#9e9a92', label: d.outcome };
        const isExp = ccExpanded === i;
        const isProfitable = d.net >= 0;

        html += `<div class="cc-deal" onclick="ccToggle(${i})" style="border-left:2px solid ${isProfitable ? '#5c5' : '#c55'};">
        <div class="cc-deal__inner" style="${isExp ? 'background:' + (d.type === 'LOAN' ? 'rgba(90,138,170,0.08)' : d.type === 'INSURE' ? 'rgba(170,122,90,0.08)' : 'rgba(138,106,170,0.08)') : ''}">`;

        // Row 1: Type + counterparty + outcome
        html += `<div style="display:flex;align-items:center;gap:5px;margin-bottom:3px;">
            <span class="df-badge df-badge-${tm.class}">${tm.label}</span>
            <span style="font-size:11px;font-weight:600;color:var(--panel-text);flex:1;">${escapeHtml(d.counterparty)}</span>
            <span style="font-family:var(--font-mono);font-size:7px;font-weight:700;padding:0 5px;line-height:12px;color:${om.color};background:${om.color}12;border:1px solid ${om.color}25;">${om.label}</span>
        </div>`;

        // Row 2: Nation + date
        html += `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
            <span class="df-badge df-badge-nation" style="line-height:12px;">${escapeHtml((d.nation || '').toUpperCase())}</span>
            <span style="font-family:var(--font-mono);font-size:8px;color:#6a6660;">${escapeHtml(d.resolved || '')}</span>
        </div>`;

        // Row 3: P&L bar
        html += '<div class="df-metrics">';
        html += `<div style="flex:1;padding:3px 8px;">
            <div class="df-metrics__label">PRINCIPAL</div>
            <div class="df-metrics__value" style="font-size:10px;color:var(--panel-text);margin-top:1px;">${fmtMoney(d.principal || 0)}</div>
        </div>`;
        html += `<div style="flex:0.8;padding:3px 8px;text-align:center;border-left:1px solid var(--panel-border);">
            <div class="df-metrics__label">EARNED</div>
            <div class="df-metrics__value" style="font-size:10px;color:#5c5;margin-top:1px;">${fmtMoney(d.earned || 0)}</div>
        </div>`;
        if (d.lost > 0) {

                <div class="df-metrics__label">LOST</div>
                <div class="df-metrics__value" style="font-size:10px;color:#c55;margin-top:1px;">${fmtMoney(d.lost)}</div>

        html += `<div style="flex:1;padding:3px 8px;text-align:right;border-left:1px solid var(--panel-border);background:${isProfitable ? 'rgba(92,204,92,0.03)' : 'rgba(204,85,85,0.03)'};">
            <div class="df-metrics__label">NET</div>
            <div class="df-metrics__value" style="font-size:11px;color:${isProfitable ? '#5c5' : '#c55'};margin-top:1px;">${isProfitable ? '+' : ''}${fmtMoney(d.net || 0)}</div>
        </div>`;
        html += '</div>';

        // Expanded details
        if (isExp) {
            html += '<div class="cc-deal__expanded">';
            if (d.term) {
                html += `<div class="cc-detail-row">
                    <span style="font-family:var(--font-mono);font-size:7px;color:#6a6660;">TERM</span>
                    <span style="font-family:var(--font-mono);font-size:9px;color:#9e9a92;">${escapeHtml(d.term)}</span>
                </div>`;
            }
            if (d.rate) {
                html += `<div class="cc-detail-row">
                    <span style="font-family:var(--font-mono);font-size:7px;color:#6a6660;">RATE</span>
                    <span style="font-family:var(--font-mono);font-size:9px;color:#9e9a92;">${escapeHtml(d.rate)}</span>
                </div>`;
            }
            if (d.note) {
                html += `<div style="padding:4px 0;">
                    <div style="font-size:9px;color:${isProfitable ? '#9e9a92' : '#c84'};line-height:1.5;">${escapeHtml(d.note)}</div>
                </div>`;
            }
            html += '</div>';
        }

        html += '</div></div>'; // close inner + deal
    }

    html += '</div>'; // close list

    // Footer
    html += `<div class="df-footer" style="justify-content:space-between;">
        <div>
            <div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;letter-spacing:0.8px;">LIFETIME P&amp;L</div>
            <div style="font-family:var(--font-mono);font-size:14px;font-weight:700;color:${profitable ? '#5c5' : '#c55'};">${profitable ? '+' : ''}${fmtMoney(totalNet)}</div>
        </div>
        <div style="display:flex;gap:6px;">
            ${Object.entries(
                ccResolved.reduce((acc, d) => { acc[d.outcome] = (acc[d.outcome] || 0) + 1; return acc; }, {})
            ).map(([outcome, count]) => {
                const om = CC_OUTCOME_META[outcome] || { color: '#9e9a92', label: outcome };
                return `<div style="text-align:center;">
                    <div style="font-family:var(--font-mono);font-size:6px;color:${om.color};letter-spacing:0.3px;">${om.label}</div>
                    <div style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--panel-text);">${count}</div>
                </div>`;
            }).join('')}
        </div>
    </div>`;

    container.innerHTML = html;
}

// ==================== REVIEW DEAL MODAL ====================

const SUBSECTOR_DEAL_MAP = { banking: 'LOAN', insurance: 'INSURE', investment: 'BOND' };

let rdDeal = null;       // the deal being reviewed
let rdType = 'LOAN';     // active tab

// Loan controls
let rdLoanRate = 8;
let rdLoanAmount = 18000000;
let rdLoanTerm = 24;
let rdLoanCollateral = 'equipment';
let rdLoanTermsText = '';

// Insurance controls
let rdInsurePremium = 3.5;
let rdInsureCoverage = 12000000;
let rdInsureDeductible = 10;
let rdPolicyTerms = '';

// Bond controls
let rdBondAmount = 25000000;
const COLLATERAL_TIERS = [
    { id: 'none', label: 'None', recovery: 0, desc: 'Unsecured loan. No recovery on default.' },
    { id: 'equipment', label: 'Equipment', recovery: 60, desc: 'Seize financed equipment on default — recover ~60%.' },
    { id: 'property', label: 'Property', recovery: 75, desc: 'Corporate property lien — recover ~75%.' },
    { id: 'full', label: 'Full Assets', recovery: 90, desc: 'Full asset claim — recover ~90% but harder sell.' },
];

function rdOpen(dealIdx) {
    const deal = dfDeals[dealIdx];
    if (!deal) return;
    rdDeal = deal;
    rdType = deal.type;

    // Reset controls to defaults based on deal
    if (deal.type === 'LOAN') {
        rdLoanRate = 8;
        rdLoanAmount = deal.amount;
        rdLoanTerm = deal.term || 24;
        rdLoanCollateral = deal.collateral || 'unsecured';
        rdLoanTermsText = '';
    } else if (deal.type === 'INSURE') {
        // Vessel insurance pays half the premium of project/construction
        // insurance; underwriters set the rate in a 0.5–4% band instead of 1–8%.
        rdInsurePremium = deal.isVesselInsurance ? 1.75 : 3.5;
        rdInsureCoverage = deal.amount;
        rdInsureDeductible = 10;
        rdPolicyTerms = '';
    } else if (deal.type === 'BOND') {
        rdBondAmount = Math.round(deal.amount * 0.25);
    }

    document.getElementById('rd-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
    renderReviewDeal();
}

function rdClose() {
    document.getElementById('rd-overlay').classList.remove('open');
    document.body.style.overflow = '';
    rdDeal = null;
}

function rdSetLoanRate(v) { rdLoanRate = Number(v); renderReviewDeal(); }
function rdSetLoanCollateral(v) { rdLoanCollateral = v; renderReviewDeal(); }
function rdSetLoanTermsText(v) { rdLoanTermsText = v; }
function rdSetInsurePremium(v) { rdInsurePremium = Number(v); renderReviewDeal(); }
function rdSetInsureCoverage(v) { rdInsureCoverage = Number(v); renderReviewDeal(); }
function rdSetInsureDeductible(v) { rdInsureDeductible = Number(v); renderReviewDeal(); }
function rdSetBondAmount(v) { rdBondAmount = Number(v); renderReviewDeal(); }

function rdBar(value, max, color) {
    const pct = Math.min((value / max) * 100, 100);
    return `<div class="rd-bar"><div class="rd-bar__fill" style="width:${pct}%;background:${color};"></div></div>`;
}

function renderReviewDeal() {
    const modal = document.getElementById('rd-modal');
    if (!modal || !rdDeal) return;

    const d = rdDeal;
    const typeColor = rdType === 'LOAN' ? '#5a8aaa' : rdType === 'INSURE' ? '#aa7a5a' : '#8a6aaa';

    // ── Loan calculations ──
    const loanTotalInterest = Math.round(rdLoanAmount * (rdLoanRate / 100) * (rdLoanTerm / 12));
    const loanMonthlyPayment = Math.round((rdLoanAmount + loanTotalInterest) / rdLoanTerm);
    const borrowerRevenue = d.revenue || 47400000;
    const loanDebtService = Math.round(loanMonthlyPayment / borrowerRevenue * 1200);

    const baseDefault = 12;
    const rateDefaultMod = Math.max(0, (rdLoanRate - 6) * 1.5);
    const amountDefaultMod = rdLoanAmount > 15000000 ? 3 : 0;
    const collateralMod = rdLoanCollateral === 'none' ? 3 : rdLoanCollateral === 'full' ? -2 : 0;
    // Debt-to-cash ratio: heavily indebted corps are riskier
    const borrowerDebt = Number(d.corp_debt || 0);
    const borrowerCash = Number(d.corp_cash_reserves || 1);
    const debtRatioMod = borrowerDebt > 0 ? Math.min(15, Math.round((borrowerDebt / Math.max(borrowerCash, 1)) * 5)) : 0;
    const defaultProb = Math.min(60, Math.max(2, Math.round(baseDefault + rateDefaultMod + amountDefaultMod + collateralMod + debtRatioMod)));
    const defaultColor = defaultProb <= 15 ? '#5c5' : defaultProb <= 30 ? '#ca5' : defaultProb <= 45 ? '#c84' : '#c55';
    const defaultLabel = defaultProb <= 15 ? 'LOW' : defaultProb <= 30 ? 'MODERATE' : defaultProb <= 45 ? 'ELEVATED' : 'HIGH';

    const baseAccept = 95;
    const rateAcceptMod = (rdLoanRate - 4) * 8;
    const partialMod = rdLoanAmount < (d.amount || 18000000) ? 10 : 0;
    const collateralAcceptMod = rdLoanCollateral === 'full' ? 15 : rdLoanCollateral === 'property' ? 8 : rdLoanCollateral === 'none' ? -5 : 0;
    const acceptProb = Math.max(10, Math.min(95, Math.round(baseAccept - rateAcceptMod - partialMod - collateralAcceptMod)));
    const acceptColor = acceptProb >= 70 ? '#5c5' : acceptProb >= 45 ? '#ca5' : acceptProb >= 25 ? '#c84' : '#c55';

    const collateralDisplayMap = { unsecured: 'none', equipment: 'equipment', property: 'property' };
    const collTier = COLLATERAL_TIERS.find(c => c.id === (collateralDisplayMap[rdLoanCollateral] || rdLoanCollateral)) || COLLATERAL_TIERS[0];
    const loanExpectedReturn = Math.round(loanTotalInterest * (1 - defaultProb / 100));

    // ── Insurance calculations ──
    const insureTermYears = (d.term || 18) / 12;
    const insureTotalPremiums = Math.round(rdInsureCoverage * (rdInsurePremium / 100) * insureTermYears);
    const baseClaimProb = 100 - (d.reputation || 50); // lower rep = higher claim chance
    const insureClaimProb = Math.max(5, Math.min(50, Math.round(baseClaimProb * 0.4)));
    const insureMaxExposure = Math.round(rdInsureCoverage * (1 - rdInsureDeductible / 100));
    const insureExpectedPayout = Math.round(insureMaxExposure * (insureClaimProb / 100));
    const insureExpectedProfit = insureTotalPremiums - insureExpectedPayout;
    const claimColor = insureClaimProb <= 12 ? '#5c5' : insureClaimProb <= 22 ? '#ca5' : insureClaimProb <= 35 ? '#c84' : '#c55';

    // ── Bond calculations ──
    const bondCoupon = d.couponRate || 6.2;
    const bondTermMonths = d.term || 60;
    const bondTermYears = bondTermMonths / 12;
    const bondAnnualCoupon = Math.round(rdBondAmount * (bondCoupon / 100));
    const bondTotalReturn = Math.round(rdBondAmount * (bondCoupon / 100) * bondTermYears);
    // Default probability from stability + credit rating + debt/GDP
    const bondStability = d.stability || 50;
    const bondCreditRating = d.creditRating || 50;
    const bondDebtToGdp = d.debtToGdp || 30;
    const bondBaseDefault = Math.max(2, Math.round(
        (100 - bondStability) * 0.15 + (100 - bondCreditRating) * 0.15 + Math.max(0, bondDebtToGdp - 30) * 0.3
    ));
    const bondDefaultProb = Math.min(60, bondBaseDefault);
    const bondDefaultColor = bondDefaultProb <= 10 ? '#5c5' : bondDefaultProb <= 20 ? '#ca5' : bondDefaultProb <= 35 ? '#c84' : '#c55';
    const bondExpectedReturn = Math.round(bondTotalReturn * (1 - bondDefaultProb / 100));

    // ── HEADER ──
    let html = `<div class="rd-header">
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <div style="display:flex;align-items:center;gap:8px;">
                <span style="font-size:8px;color:${typeColor};">&#9679;</span>
                <span style="font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:2px;color:#9e9a92;text-transform:uppercase;">Review Deal</span>
            </div>
            <span onclick="rdClose()" style="font-family:var(--font-mono);font-size:14px;color:#6a6660;cursor:pointer;">&#215;</span>
        </div>`;

    // Single tab showing this deal's type and applicant
    const tabClass = rdType === 'LOAN' ? 'active-loan' : rdType === 'INSURE' ? 'active-insure' : 'active-bond';
    const tabLabel = rdType === 'LOAN' ? 'Loan' : rdType === 'INSURE' ? 'Insure' : 'Bond';
    html += `<div class="rd-tabs">
        <span class="rd-tab ${tabClass}" style="cursor:default;">${tabLabel} — ${escapeHtml(d.applicant)}</span>
    </div></div>`;

    // ── BODY ──
    html += '<div class="rd-body">';

    // ═══ LEFT PANEL ═══
    html += '<div class="rd-left">';

    if (rdType === 'LOAN') {
        // Applicant info
        const repColor = (d.reputation || 50) >= 60 ? '#5c5' : (d.reputation || 50) >= 35 ? '#ca5' : '#c84';
        html += `<div class="rd-applicant">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
                <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:#c8a832;">${escapeHtml(d.abbr)}</span>
                <span style="font-size:13px;font-weight:700;color:var(--panel-text);">${escapeHtml(d.applicant)}</span>
                <span class="df-badge df-badge-${d.entity.toLowerCase()}">${d.entity}</span>
            </div>
            <div style="font-size:10px;color:#9e9a92;line-height:1.5;margin-bottom:6px;">${escapeHtml(d.purpose)}</div>
            <div class="rd-applicant__stats">
                <div class="rd-applicant__stat"><div class="rd-applicant__stat-label">CASH</div><div class="rd-applicant__stat-value" style="color:#5c5;">${fmtMoney(d.corp_cash_reserves || 0)}</div></div>
                <div class="rd-applicant__stat"><div class="rd-applicant__stat-label">TOTAL DEBT</div><div class="rd-applicant__stat-value" style="color:#c84;">${fmtMoney(d.corp_debt || 0)}</div></div>
                <div class="rd-applicant__stat"><div class="rd-applicant__stat-label">REP</div><div class="rd-applicant__stat-value" style="color:${repColor};">${d.reputation || '—'}</div></div>
                <div class="rd-applicant__stat"><div class="rd-applicant__stat-label">REQUESTED</div><div class="rd-applicant__stat-value" style="color:var(--panel-text);">${fmtMoney(d.amount)}</div></div>
            </div>
            <div style="margin-top:6px;padding:6px 8px;background:rgba(200,136,68,0.04);border:1px solid rgba(200,136,68,0.12);">
                <div style="font-family:var(--font-mono);font-size:8px;font-weight:700;color:#c84;letter-spacing:0.8px;margin-bottom:4px;">EXISTING OBLIGATIONS</div>
                <div style="display:flex;gap:16px;">
                    <div><span style="font-family:var(--font-mono);font-size:7px;color:#6a6660;">ACTIVE LOANS</span><div style="font-family:var(--font-mono);font-size:12px;font-weight:700;color:${d.activeLoans > 0 ? '#c84' : '#5c5'};">${d.activeLoans}</div></div>
                    <div><span style="font-family:var(--font-mono);font-size:7px;color:#6a6660;">OUTSTANDING</span><div style="font-family:var(--font-mono);font-size:12px;font-weight:700;color:${d.totalOutstanding > 0 ? '#c84' : '#5c5'};">${fmtMoney(d.totalOutstanding)}</div></div>
                    <div><span style="font-family:var(--font-mono);font-size:7px;color:#6a6660;">DEBT-TO-CASH</span><div style="font-family:var(--font-mono);font-size:12px;font-weight:700;color:${d.corp_debt > d.corp_cash_reserves ? '#c55' : d.corp_debt > 0 ? '#ca5' : '#5c5'};">${d.corp_cash_reserves > 0 ? (d.corp_debt / d.corp_cash_reserves * 100).toFixed(0) + '%' : '—'}</div></div>
                </div>
            </div>
        </div>`;

        // Section: Set Loan Terms
        html += `<div class="rd-section-bar" style="color:#5a8aaa;">Set Loan Terms</div>`;

        // Interest Rate slider
        const ratePct = ((rdLoanRate - 3) / 15) * 100;
        html += `<div class="rd-control">

        // Borrower's requested terms (read-only)

                ${COLLATERAL_TIERS.map(c => `<div onclick="rdSetLoanCollateral('${c.id}')" style="
                    flex:1;padding:6px 4px;text-align:center;
                    font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:0.3px;
                    background:${rdLoanCollateral === c.id || (collateralDisplayMap[rdLoanCollateral] || rdLoanCollateral) === c.id ? 'rgba(90,138,170,0.12)' : 'transparent'};
                    border:1px solid ${rdLoanCollateral === c.id || (collateralDisplayMap[rdLoanCollateral] || rdLoanCollateral) === c.id ? 'rgba(90,138,170,0.3)' : 'var(--panel-border)'};
                    color:${rdLoanCollateral === c.id || (collateralDisplayMap[rdLoanCollateral] || rdLoanCollateral) === c.id ? '#5a8aaa' : '#6a6660'};
                    cursor:pointer;
                ">${c.label}</div>`).join('')}
            </div>
            <div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;margin-top:6px;">
                ${collTier.id === 'none' ? 'No collateral. Higher risk, lower acceptance chance.'
                : collTier.id === 'equipment' ? 'Borrower pledges equipment as security. Moderate risk reduction.'
                : 'Borrower pledges property. Strongest security, highest acceptance.'}
            </div>
        </div>`;

        // Offer Terms text field
        html += `<div class="rd-control">
            <div class="rd-control__header">
                <span class="rd-control__label">OFFER TERMS (OPTIONAL)</span>
            </div>
            <textarea id="rd-loan-terms" maxlength="500" rows="3" placeholder="e.g. Early repayment penalty of 2%. Quarterly reporting required..." oninput="rdSetLoanTermsText(this.value)" style="
                width:100%;margin-top:6px;padding:8px 10px;
                background:var(--panel-main);border:1px solid var(--panel-border);color:var(--panel-text);
                font-family:var(--font-sans);font-size:11px;line-height:1.5;
                resize:vertical;outline:none;box-sizing:border-box;
            ">${escapeHtml(rdLoanTermsText)}</textarea>
            <div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;margin-top:4px;">Visible to the borrower. 500 characters max.</div>
        </div>`;
    }

    if (rdType === 'INSURE') {
        // Applicant info
        const repColor = (d.reputation || 50) >= 60 ? '#5c5' : (d.reputation || 50) >= 35 ? '#ca5' : '#c84';
        const assetLabel = d.projectValue ? 'PROJECT' : 'FLEET';
        const assetValue = d.projectValue || d.fleetValue || 0;
        html += `<div class="rd-applicant">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
                <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:#c8a832;">${escapeHtml(d.abbr)}</span>
                <span style="font-size:13px;font-weight:700;color:var(--panel-text);">${escapeHtml(d.applicant)}</span>
                <span class="df-badge df-badge-${d.entity.toLowerCase()}">${d.entity}</span>
            </div>
            <div style="font-size:10px;color:#9e9a92;line-height:1.5;margin-bottom:6px;">${escapeHtml(d.purpose)}</div>
            <div class="rd-applicant__stats">
                <div class="rd-applicant__stat"><div class="rd-applicant__stat-label">REP</div><div class="rd-applicant__stat-value" style="color:${repColor};">${d.reputation || '—'}</div></div>
                <div class="rd-applicant__stat"><div class="rd-applicant__stat-label">${assetLabel}</div><div class="rd-applicant__stat-value" style="color:var(--panel-text);">${fmtMoney(assetValue)}</div></div>
                <div class="rd-applicant__stat"><div class="rd-applicant__stat-label">REQUESTED</div><div class="rd-applicant__stat-value" style="color:var(--panel-text);">${fmtMoney(d.amount)}</div></div>
                <div class="rd-applicant__stat"><div class="rd-applicant__stat-label">TERM</div><div class="rd-applicant__stat-value" style="color:var(--panel-text);">${d.term}mo</div></div>
            </div>
        </div>`;

        // Show requestor's desired coverage
        if (d.purpose && d.purpose !== 'Construction Insurance') {
            html += `<div style="padding:8px 14px;background:rgba(170,122,90,0.04);border-bottom:1px solid rgba(170,122,90,0.12);">
                <div style="font-family:var(--font-mono);font-size:7px;font-weight:700;color:#aa7a5a;letter-spacing:0.8px;margin-bottom:3px;">REQUESTED COVERAGE</div>
                <div style="font-size:10px;color:var(--panel-text);line-height:1.5;white-space:pre-wrap;">${escapeHtml(d.purpose)}</div>
            </div>`;
        }

        html += `<div class="rd-section-bar" style="color:#aa7a5a;">Set Policy Terms</div>`;

        // Premium Rate slider — vessel insurance runs a 0.5–4% band (half the
        // rate of non-vessel insurance, where the band stays 1–8%).
        const isVesselPolicy = !!rdDeal.isVesselInsurance;
        const premMin  = isVesselPolicy ? 0.5  : 1;
        const premMax  = isVesselPolicy ? 4    : 8;
        const premStep = isVesselPolicy ? 0.25 : 0.5;
        const premPct  = premMax > premMin ? ((rdInsurePremium - premMin) / (premMax - premMin)) * 100 : 0;
        html += `<div class="rd-control">
            <div class="rd-control__header">
                <span class="rd-control__label">PREMIUM RATE (ANNUAL)</span>
                <span class="rd-control__value" style="font-size:16px;color:#aa7a5a;">${rdInsurePremium}%</span>
            </div>
            <input type="range" class="rd-control__range" min="${premMin}" max="${premMax}" step="${premStep}" value="${rdInsurePremium}"
                oninput="rdSetInsurePremium(this.value)"
                style="background:linear-gradient(90deg,#aa7a5a ${premPct}%,var(--panel-border) ${premPct}%);">
            <div class="rd-control__hints"><span>${premMin}% (competitive)</span><span>${premMax}% (expensive)</span></div>
        </div>`;

        // Coverage Amount slider
        const maxCoverage = Math.round((d.projectValue || d.fleetValue || d.amount) * 0.7);
        const minCoverage = Math.round(d.amount * 0.33);
        const covPct = ((rdInsureCoverage - minCoverage) / (maxCoverage - minCoverage)) * 100;
        html += `<div class="rd-control">
            <div class="rd-control__header">
                <span class="rd-control__label">COVERAGE AMOUNT</span>
                <span class="rd-control__value" style="font-size:14px;color:var(--panel-text);">${fmtMoney(rdInsureCoverage)}</span>
            </div>
            <input type="range" class="rd-control__range" min="${minCoverage}" max="${maxCoverage}" step="1000000" value="${rdInsureCoverage}"
                oninput="rdSetInsureCoverage(this.value)"
                style="background:linear-gradient(90deg,#aa7a5a ${covPct}%,var(--panel-border) ${covPct}%);">
            <div class="rd-control__hints"><span>${fmtMoney(minCoverage)} (partial)</span><span>${fmtMoney(maxCoverage)} (max)</span></div>
        </div>`;

        // Deductible presets
        html += `<div class="rd-control">
            <div class="rd-control__header">
                <span class="rd-control__label">DEDUCTIBLE</span>
                <span class="rd-control__value" style="font-size:14px;color:var(--panel-text);">${rdInsureDeductible}%</span>
            </div>
            <div class="rd-presets">`;
        for (const d2 of [5, 10, 15, 20, 25]) {
            const isActive = rdInsureDeductible === d2;
            html += `<span class="rd-preset" onclick="rdSetInsureDeductible(${d2})" style="${isActive ? 'color:#000;background:#aa7a5a;border-color:#aa7a5a;' : ''}">${d2}%</span>`;
        }
        html += `</div>
            <div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;margin-top:4px;">Policyholder pays first ${rdInsureDeductible}% of any claim (${fmtMoney(Math.round(rdInsureCoverage * rdInsureDeductible / 100))})</div>
        </div>`;

        // Agreed coverage terms text box
        html += `<div class="rd-control">
            <div class="rd-control__header">
                <span class="rd-control__label">WHAT WE AGREE TO COVER</span>
            </div>
            <textarea id="rd-policy-terms" rows="3" placeholder="e.g., Covers weather delays, material damage, and labor disputes. Excludes negligence and acts of war. Maximum payout per claim: 50% of coverage."
                style="width:100%;box-sizing:border-box;padding:6px 8px;font-family:var(--font-mono);font-size:9px;color:var(--panel-text);background:var(--panel-main);border:1px solid var(--panel-border);resize:vertical;line-height:1.5;"
                oninput="rdPolicyTerms=this.value">${rdPolicyTerms || ''}</textarea>
        </div>`;
    }

    if (rdType === 'BOND') {
        // Issuer info
        const stabColor = bondStability >= 50 ? '#5c5' : bondStability >= 30 ? '#ca5' : bondStability >= 15 ? '#c84' : '#c55';
        html += `<div class="rd-applicant">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
                <span class="df-badge df-badge-gov" style="font-size:8px;padding:2px 6px;">GOV</span>
                <span style="font-size:13px;font-weight:700;color:var(--panel-text);">${escapeHtml(d.applicant)}</span>
            </div>
            <div style="font-size:10px;color:#9e9a92;line-height:1.5;margin-bottom:6px;">${escapeHtml(d.purpose)}</div>
            <div class="rd-applicant__stats">
                <div class="rd-applicant__stat"><div class="rd-applicant__stat-label">TOTAL ISSUE</div><div class="rd-applicant__stat-value" style="color:var(--panel-text);">${fmtMoney(d.amount)}</div></div>
                <div class="rd-applicant__stat"><div class="rd-applicant__stat-label">COUPON</div><div class="rd-applicant__stat-value" style="color:#8a6aaa;">${bondCoupon}%</div></div>
                <div class="rd-applicant__stat"><div class="rd-applicant__stat-label">TERM</div><div class="rd-applicant__stat-value" style="color:var(--panel-text);">${bondTermMonths}mo</div></div>
                <div class="rd-applicant__stat"><div class="rd-applicant__stat-label">STABILITY</div><div class="rd-applicant__stat-value" style="color:${stabColor};">${bondStability}</div></div>
            </div>
        </div>`;

        // Purchase Amount
        html += `<div class="rd-section-bar" style="color:#8a6aaa;">Purchase Amount</div>`;
        const bondMax = d.amount;
        const bondMin = Math.max(5000000, Math.ceil(bondMax * 0.05 / 5000000) * 5000000);
        const bondPct = ((rdBondAmount - bondMin) / (bondMax - bondMin)) * 100;
        html += `<div class="rd-control">
            <div class="rd-control__header">
                <span class="rd-control__label">BUY AMOUNT</span>
                <span class="rd-control__value" style="font-size:16px;color:#8a6aaa;">${fmtMoney(rdBondAmount)}</span>
            </div>
            <input type="range" class="rd-control__range" min="${bondMin}" max="${bondMax}" step="5000000" value="${rdBondAmount}"
                oninput="rdSetBondAmount(this.value)"
                style="background:linear-gradient(90deg,#8a6aaa ${bondPct}%,var(--panel-border) ${bondPct}%);">
            <div class="rd-control__hints"><span>${fmtMoney(bondMin)} (small position)</span><span>${fmtMoney(bondMax)} (full issuance)</span></div>
            <div style="font-family:var(--font-mono);font-size:8px;color:#6a6660;margin-top:6px;">Coupon rate and term are set by issuer. You choose how much to buy.</div>
        </div>`;

        // Nation Risk Profile
        html += `<div class="rd-control" style="padding-top:8px;">
            <div style="font-family:var(--font-mono);font-size:8px;color:#6a6660;letter-spacing:1px;margin-bottom:6px;text-transform:uppercase;">Nation Risk Profile</div>`;
        const nationStats = [
            { key: 'stability', value: bondStability, label: 'Political stability', invert: false },
            { key: 'debt_to_gdp', value: bondDebtToGdp, label: 'Debt burden', invert: true },
            { key: 'credit_rating', value: bondCreditRating, label: 'Creditworthiness', invert: false },
            { key: 'gdp_growth', value: d.gdpGrowth || 54, label: 'Economic trajectory', invert: false },
            { key: 'corruption', value: d.corruption || 62, label: 'Institutional risk', invert: true },
        ];
        for (const s of nationStats) {
            const barColor = s.invert
                ? (s.value > 60 ? '#c55' : s.value > 40 ? '#ca5' : '#5c5')
                : (s.value >= 50 ? '#5c5' : s.value >= 30 ? '#ca5' : s.value >= 15 ? '#c84' : '#c55');
            html += `<div class="rd-nation-stat">
                <span style="font-family:var(--font-mono);font-size:8px;color:#9e9a92;width:90px;">${s.key}</span>
                <div style="width:40px;">${rdBar(s.value, 100, barColor)}</div>
                <span style="font-family:var(--font-mono);font-size:9px;color:var(--panel-text);width:18px;text-align:right;">${s.value}</span>
                <span style="font-family:var(--font-mono);font-size:7px;color:#6a6660;">${s.label}</span>
            </div>`;
        }
        html += `</div>`;
    }

    html += '</div>'; // close rd-left

    // ═══ RIGHT PANEL ═══
    html += '<div class="rd-right">';

    if (rdType === 'LOAN') {
        // Risk Assessment
        html += `<div class="rd-section-bar" style="color:#a3b07e;">Risk Assessment</div>`;
        html += `<div class="rd-control">
            <div class="rd-control__header">
                <span class="rd-control__label">DEFAULT PROBABILITY</span>
                <span class="rd-control__value" style="font-size:14px;color:${defaultColor};">${defaultProb}%</span>
            </div>
            ${rdBar(defaultProb, 100, defaultColor)}
            <div style="font-family:var(--font-mono);font-size:8px;font-weight:700;color:${defaultColor};margin-top:4px;">${defaultLabel}</div>
            <div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;margin-top:2px;">Higher rates and larger amounts increase default risk.</div>
        </div>`;

        // Acceptance Likelihood
        html += `<div class="rd-section-bar" style="color:#5a8aaa;">Acceptance Likelihood</div>`;
        html += `<div class="rd-control">
            <div class="rd-control__header">
                <span class="rd-control__label">BORROWER ACCEPTS</span>
                <span class="rd-control__value" style="font-size:14px;color:${acceptColor};">${acceptProb}%</span>
            </div>
            ${rdBar(acceptProb, 100, acceptColor)}
            <div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;margin-top:4px;">High rates and restrictive collateral reduce acceptance.</div>
        </div>`;

        // Projected Returns
        html += `<div class="rd-section-bar" style="color:#5c5;">Projected Returns</div>`;
        html += `<div class="rd-risk-row"><span class="rd-risk-label">CAPITAL AT RISK</span><span class="rd-risk-value" style="color:#c55;">${fmtMoney(rdLoanAmount)}</span></div>`;
        html += `<div class="rd-risk-row"><span class="rd-risk-label">TOTAL INTEREST</span><span class="rd-risk-value" style="color:#5c5;">${fmtMoney(loanTotalInterest)}</span></div>`;
        html += `<div class="rd-risk-row"><span class="rd-risk-label">MONTHLY PAYMENT</span><span class="rd-risk-value" style="color:#9e9a92;">${fmtMoney(loanMonthlyPayment)}</span></div>`;

        const dsColor = loanDebtService > 30 ? '#c55' : loanDebtService > 15 ? '#ca5' : '#5c5';
        html += `<div class="rd-risk-row"><span class="rd-risk-label">BORROWER DEBT SERVICE</span><span class="rd-risk-value" style="color:${dsColor};">${loanDebtService}% of revenue</span></div>`;

        html += `<div class="rd-expected"><span style="font-family:var(--font-mono);font-size:9px;font-weight:700;color:var(--panel-text);">EXPECTED RETURN</span><span style="font-family:var(--font-mono);font-size:14px;font-weight:700;color:#5c5;">${fmtMoney(loanExpectedReturn)}</span></div>`;
        html += `<div class="rd-formula">Risk-adjusted: total interest × (1 - ${defaultProb}% default)</div>`;
    }

    if (rdType === 'INSURE') {
        // Claim Probability
        html += `<div class="rd-section-bar" style="color:#a3b07e;">Risk Assessment</div>`;
        html += `<div class="rd-control">
            <div class="rd-control__header">
                <span class="rd-control__label">CLAIM PROBABILITY</span>
                <span class="rd-control__value" style="font-size:14px;color:${claimColor};">${insureClaimProb}%</span>
            </div>
            ${rdBar(insureClaimProb, 100, claimColor)}
            <div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;margin-top:4px;">Based on contractor reputation, project complexity, and nation stability.</div>
        </div>`;

        // Projected Returns
        html += `<div class="rd-section-bar" style="color:#5c5;">Projected Returns</div>`;
        html += `<div class="rd-risk-row"><span class="rd-risk-label">MAX EXPOSURE</span><span class="rd-risk-value" style="color:#c55;">${fmtMoney(insureMaxExposure)}</span></div>`;
        html += `<div class="rd-risk-row"><span class="rd-risk-label">TOTAL PREMIUMS</span><span class="rd-risk-value" style="color:#5c5;">${fmtMoney(insureTotalPremiums)}</span></div>`;
        html += `<div class="rd-risk-row"><span class="rd-risk-label">EXPECTED PAYOUT</span><span class="rd-risk-value" style="color:#c84;">${fmtMoney(insureExpectedPayout)}</span></div>`;

        const profitClass = insureExpectedProfit > 0 ? '' : ' negative';
        const profitColor = insureExpectedProfit > 0 ? '#5c5' : '#c55';
        html += `<div class="rd-expected${profitClass}"><span style="font-family:var(--font-mono);font-size:9px;font-weight:700;color:var(--panel-text);">EXPECTED PROFIT</span><span style="font-family:var(--font-mono);font-size:14px;font-weight:700;color:${profitColor};">${fmtMoney(insureExpectedProfit)}</span></div>`;
        html += `<div class="rd-formula">Premiums (${fmtMoney(insureTotalPremiums)}) − expected payout (${insureClaimProb}% × ${fmtMoney(insureMaxExposure)})</div>`;
    }

    if (rdType === 'BOND') {
        // Sovereign Default Risk
        html += `<div class="rd-section-bar" style="color:#a3b07e;">Risk Assessment</div>`;
        html += `<div class="rd-control">
            <div class="rd-control__header">
                <span class="rd-control__label">SOVEREIGN DEFAULT RISK</span>
                <span class="rd-control__value" style="font-size:14px;color:${bondDefaultColor};">${bondDefaultProb}%</span>
            </div>
            ${rdBar(bondDefaultProb, 100, bondDefaultColor)}
            <div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;margin-top:4px;">Based on stability, debt/GDP, credit rating, and economic trajectory.</div>
        </div>`;

        // Projected Returns
        html += `<div class="rd-section-bar" style="color:#5c5;">Projected Returns</div>`;
        html += `<div class="rd-risk-row"><span class="rd-risk-label">CAPITAL AT RISK</span><span class="rd-risk-value" style="color:#c55;">${fmtMoney(rdBondAmount)}</span></div>`;
        html += `<div class="rd-risk-row"><span class="rd-risk-label">ANNUAL COUPON</span><span class="rd-risk-value" style="color:#5c5;">${fmtMoney(bondAnnualCoupon)}</span></div>`;
        html += `<div class="rd-risk-row"><span class="rd-risk-label">TOTAL RETURN (${Math.round(bondTermYears)}yr)</span><span class="rd-risk-value" style="color:#5c5;">${fmtMoney(bondTotalReturn)}</span></div>`;

        html += `<div class="rd-expected"><span style="font-family:var(--font-mono);font-size:9px;font-weight:700;color:var(--panel-text);">EXPECTED RETURN</span><span style="font-family:var(--font-mono);font-size:14px;font-weight:700;color:#5c5;">${fmtMoney(bondExpectedReturn)}</span></div>`;
        html += `<div class="rd-formula">Risk-adjusted: total coupon × (1 - ${bondDefaultProb}% default)</div>`;
    }

    html += '</div>'; // close rd-right
    html += '</div>'; // close rd-body

    // ── FOOTER ──
    const footerCapital = rdType === 'LOAN' ? rdLoanAmount : rdType === 'INSURE' ? rdInsureCoverage : rdBondAmount;
    const footerReturn = rdType === 'LOAN' ? loanExpectedReturn : rdType === 'INSURE' ? insureExpectedProfit : bondExpectedReturn;
    const footerRisk = rdType === 'LOAN' ? defaultProb : rdType === 'INSURE' ? insureClaimProb : bondDefaultProb;
    const footerRiskColor = rdType === 'LOAN' ? defaultColor : rdType === 'INSURE' ? claimColor : bondDefaultColor;
    const actionLabel = rdType === 'LOAN' ? 'OFFER LOAN' : rdType === 'INSURE' ? 'WRITE POLICY' : 'BUY BONDS';
    const actionClass = rdType.toLowerCase();
    const alreadyOffered = !!d.alreadyOffered;
    const actionDisabled = alreadyOffered ? 'disabled' : '';
    const actionTitle = alreadyOffered ? ' title="You already have an offer on this request."' : '';
    const actionButtonLabel = alreadyOffered ? 'ALREADY OFFERED' : actionLabel;

    html += `<div class="rd-footer">
        <div style="display:flex;gap:12px;">
            <div class="rd-footer__metric"><div class="rd-footer__metric-label">CAPITAL AT RISK</div><div class="rd-footer__metric-value" style="color:#c55;">${fmtMoney(footerCapital)}</div></div>
            <div class="rd-footer__metric"><div class="rd-footer__metric-label">EXPECTED RETURN</div><div class="rd-footer__metric-value" style="color:#5c5;">${fmtMoney(footerReturn)}</div></div>
            <div class="rd-footer__metric"><div class="rd-footer__metric-label">RISK</div><div class="rd-footer__metric-value" style="color:${footerRiskColor};">${footerRisk}%</div></div>
        </div>
        <div style="display:flex;gap:6px;">
            <button class="rd-btn-decline" onclick="rdClose()">DECLINE</button>
            <button class="rd-btn-action ${actionClass}" onclick="rdSubmitOffer()" ${actionDisabled}${actionTitle}>${actionButtonLabel}</button>
        </div>
    </div>`;

    modal.innerHTML = html;
}

window.rdOpen = rdOpen;
window.rdClose = rdClose;
window.rdSetLoanRate = rdSetLoanRate;
window.rdSetLoanCollateral = rdSetLoanCollateral;
window.rdSetLoanTermsText = rdSetLoanTermsText;
window.rdSetInsurePremium = rdSetInsurePremium;
window.rdSetInsureCoverage = rdSetInsureCoverage;
window.rdSetInsureDeductible = rdSetInsureDeductible;
window.rdSetBondAmount = rdSetBondAmount;

// ==================== SUBMIT OFFER ====================

let _submittingOffer = false;
async function rdSubmitOffer() {
    if (!rdDeal || !faction || !shard || _submittingOffer) return;
    if (rdDeal.alreadyOffered) {
        alert('You already submitted an offer for this request.');
        return;
    }
    _submittingOffer = true;

    const currentTick = shard.current_tick || 0;

    // Re-fetch live cash + active positions at submit time so the cap
    // check reflects anything the tick has changed since the page
    // loaded: loan repayments crediting cash, bond coupons landing,
    // insurance premiums collected, other loans paid down. The
    // module-level faction.corp_cash_reserves + apPortfolio can be
    // many minutes stale, which is exactly the state a player hits
    // right after a tick processes — cash in their "bank" goes up,
    // deployed principal goes down, but the cached numbers said the
    // cap was still blown from the old snapshot.
    const [cashRes, liveLoansRes] = await Promise.all([
        _supabase.from('factions').select('corp_cash_reserves').eq('id', faction.id).single(),
        _supabase.from('finance_active_loans')
            .select('principal, total_paid, finance_loan_requests!inner(request_type)')
            .eq('lender_faction_id', faction.id)
            .in('status', ['current', 'late', 'delinquent']),
    ]);
    if (cashRes.error || liveLoansRes.error) {
        alert('Could not verify current cash or portfolio. Try again.');
        _submittingOffer = false;
        return;
    }
    const cash = Number(cashRes.data?.corp_cash_reserves) || 0;
    // Mirror the shape apPortfolio uses so computeDeployable sees the
    // same fields it was designed for — principal / remaining /
    // coverage / faceValue / type.
    const livePortfolio = (liveLoansRes.data || []).map(l => {
        const req = l.finance_loan_requests?.request_type;
        const type = req === 'insurance' ? 'INSURE' : req === 'bond' ? 'BOND' : 'LOAN';
        const principal = Number(l.principal) || 0;
        const totalPaid = Number(l.total_paid) || 0;
        return {
            type,
            principal,
            remaining: type === 'INSURE' ? 0 : Math.max(0, principal - totalPaid),
            coverage:  type === 'INSURE' ? principal : 0,
            faceValue: type === 'BOND'   ? principal : 0,
        };
    });
    // Keep the in-memory caches aligned with what we just read so the
    // Reserves & Risk card (re-rendered after this submit) doesn't lag.
    if (faction) faction.corp_cash_reserves = cash;

    if (rdDeal.type === 'LOAN') {
        const rate = rdLoanRate;
        if (rate < 1 || rate > 20) { alert('Interest rate must be 1-20%.'); _submittingOffer = false; return; }

        // Use the live portfolio + live cash we just fetched, not the
        // module caches. Same helper the Reserves & Risk card calls
        // on render, so what the card shows and what the validator
        // enforces stay in sync once the cache catches up post-submit.
        const cap = computeDeployable(cash, livePortfolio, _branchCount, _hasDeregulation);
        if (rdDeal.amount > cap.deployable) {
            const why = cap.limiter === 'lending_cap'
                ? `Lending cap (${cap.lendingCapPct}% of total capital = ${fmtMoney(cap.lendingCap)}). Already deployed ${fmtMoney(cap.totalDeployed)}.`
                : `Reserve requirement (${Math.round(cap.reserveReqPct * 100)}% of exposure = ${fmtMoney(cap.requiredReserve)}). Cash ${fmtMoney(cap.cash)}.`;
            alert(
                `Insufficient deployable capital.\n${why}\n` +
                `Available: ${fmtMoney(cap.deployable)}\n` +
                `This loan: ${fmtMoney(rdDeal.amount)}` +
                (cap.limiter === 'lending_cap' && _branchCount === 0
                    ? '\n\nBuild a Branch Office to raise your lending cap (+15% each).'
                    : '')
            );
            _submittingOffer = false;
            return;
        }

        if (cash < rdDeal.amount) { alert('Insufficient cash reserves to fund this loan.'); _submittingOffer = false; return; }

        const collateralMap = { none: 'unsecured', equipment: 'equipment', property: 'property', full: 'property' };
        const collateral = collateralMap[rdLoanCollateral] || 'unsecured';

        const offerRow = {
            request_id: rdDeal.requestId,
            offering_faction_id: faction.id,
            interest_rate: rate,
            collateral_type: collateral,
            created_tick: currentTick,
        };
        if (rdLoanTermsText.trim()) offerRow.offer_terms = rdLoanTermsText.trim();

        const { error } = await _supabase.from('finance_loan_offers').insert(offerRow);
        if (error) {
            _submittingOffer = false;
            if (error.message.includes('unique') || error.message.includes('duplicate')) {
                alert('You have already submitted an offer for this loan request.');
            } else { alert('Failed to submit offer: ' + error.message); }
            return;
        }
    } else if (rdDeal.type === 'BOND') {
        if (cash < rdBondAmount) { alert('Insufficient cash reserves. Need ' + fmtMoney(rdBondAmount) + ', have ' + fmtMoney(cash) + '.'); _submittingOffer = false; return; }

        // Insert bond purchase as an offer (immediate — no acceptance needed from gov)
        const { error: offerErr } = await _supabase.from('finance_loan_offers').insert({
            request_id: rdDeal.requestId,
            offering_faction_id: faction.id,
            interest_rate: rdDeal.couponRate,
            collateral_type: 'unsecured',
            status: 'accepted',
            created_tick: currentTick,
        });
        if (offerErr) { alert('Failed to buy bonds: ' + offerErr.message); _submittingOffer = false; return; }

        // Create active loan record (bond position).
        // borrower_faction_id has a FK to factions — previously this was set
        // to rdDeal.requestId (a request UUID, NOT a faction UUID), which
        // violated the FK on every bond purchase. Resolve the issuing
        // faction from the bond request row itself — that's the PM's party
        // that issued the bond.
        const r = (rdDeal.couponRate / 100) / 12;
        const n = rdDeal.term;
        const monthlyPayment = Math.round(rdBondAmount * r); // coupon only, no amortization

        const { data: bondReq, error: reqErr } = await _supabase
            .from('finance_loan_requests')
            .select('requesting_faction_id')
            .eq('id', rdDeal.requestId)
            .single();
        if (reqErr || !bondReq?.requesting_faction_id) {
            alert('Failed to create bond position: could not resolve issuer faction.');
            _submittingOffer = false;
            return;
        }

        const { error: loanErr } = await _supabase.from('finance_active_loans').insert({
            request_id: rdDeal.requestId,
            offer_id: null,
            borrower_faction_id: bondReq.requesting_faction_id,
            lender_faction_id: faction.id,
            nation_id: rdDeal.nation_id || faction.nation_id,
            principal: rdBondAmount,
            interest_rate: rdDeal.couponRate,
            term_months: rdDeal.term,
            collateral_type: 'unsecured',
            purpose: rdDeal.purpose,
            monthly_payment: monthlyPayment,
            remaining_principal: rdBondAmount,
            started_tick: currentTick,
        });
        if (loanErr) { alert('Failed to create bond position: ' + loanErr.message); _submittingOffer = false; return; }

        // Deduct cash from investment bank
        await _supabase.from('factions').update({
            corp_cash_reserves: Math.max(0, cash - rdBondAmount)
        }).eq('id', faction.id);

        // Nation receives bond proceeds (government borrows from banker)
        // Debt INCREASES because the nation now owes this principal back at maturity
        const { data: nationData } = await _supabase.from('nations').select('debt').eq('id', rdDeal.nation_id).single();
        if (nationData) {
            const { error: debtErr } = await _supabase.from('nations').update({
                debt: Number(nationData.debt || 0) + rdBondAmount
            }).eq('id', rdDeal.nation_id);
            if (debtErr) console.warn('[Bonds] Failed to update nation debt:', debtErr.message);
        }

        faction.corp_cash_reserves = Math.max(0, cash - rdBondAmount);
    } else if (rdDeal.type === 'INSURE') {
        // Insurance: write policy — no upfront cost, premiums collected per tick
        const annualPremium = rdInsurePremium;
        const coverage = rdInsureCoverage;
        const deductible = rdInsureDeductible;
        const monthlyPremiumAmt = Math.round(coverage * (annualPremium / 100) / 12);

        const { error: offerErr } = await _supabase.from('finance_loan_offers').insert({
            request_id: rdDeal.requestId,
            offering_faction_id: faction.id,
            interest_rate: annualPremium,
            collateral_type: 'unsecured',
            status: 'accepted',
            created_tick: currentTick,
        });
        if (offerErr) {
            _submittingOffer = false;
            if (offerErr.message.includes('unique') || offerErr.message.includes('duplicate')) {
                alert('You have already submitted a policy offer for this request.');
            } else {
                alert('Failed to write policy: ' + offerErr.message);
            }
            return;
        }

        // Mark request as funded and get the requesting faction
        const { data: fundedReq } = await _supabase.from('finance_loan_requests').update({
            status: 'funded', funded_tick: currentTick,
        }).eq('id', rdDeal.requestId).select('requesting_faction_id').single();

        // Create active insurance policy as a loan record
        const policyRow = {
            request_id: rdDeal.requestId,
            offer_id: null,
            borrower_faction_id: fundedReq?.requesting_faction_id || rdDeal.requestingFactionId,
            lender_faction_id: faction.id,
            nation_id: faction.nation_id,
            principal: coverage,
            interest_rate: annualPremium,
            term_months: 0, // until project completes or vessel decommissioned
            collateral_type: 'unsecured',
            purpose: rdDeal.isVesselInsurance
                ? 'Vessel Insurance — ' + rdDeal.applicant
                : 'Insurance Policy — ' + rdDeal.applicant,
            monthly_payment: monthlyPremiumAmt,
            started_tick: currentTick,
            deductible_pct: deductible,
            policy_terms: rdPolicyTerms.trim() || null,
        };
        // Link to vessel or contract
        if (rdDeal.insuredVesselId) policyRow.insured_vessel_id = rdDeal.insuredVesselId;
        if (rdDeal.insuredContractId) policyRow.insured_contract_id = rdDeal.insuredContractId;

        const { error: policyErr } = await _supabase.from('finance_active_loans').insert(policyRow);
        if (policyErr) { alert('Failed to create policy record: ' + policyErr.message); _submittingOffer = false; return; }
    } else {
        _submittingOffer = false;
        return;
    }

    rdClose();
    dfSelected = -1;
    // Refresh portfolio too so the Reserves & Risk card reflects the new
    // BOND / INSURANCE position immediately (LOAN offers are still
    // pending acceptance so apPortfolio is unchanged for that path, but
    // running the reload unconditionally is a single SELECT and keeps
    // the two caches aligned post-submit).
    await Promise.all([loadDealFlow(), loadActivePortfolio()]);
    _submittingOffer = false;
}

window.rdSubmitOffer = rdSubmitOffer;

// ==================== LOAD ACTIVE PORTFOLIO ====================

async function loadActivePortfolio() {
    if (!faction) { renderActivePortfolio(); return; }

    const { data: loans } = await _supabase
        .from('finance_active_loans')
        .select('*, borrower:factions!borrower_faction_id(id, faction_name, abbreviation, corp_ticker, nation), loan_nation:nations!nation_id(name), finance_loan_requests!inner(request_type)')
        .eq('lender_faction_id', faction.id)
        .in('status', ['current', 'late', 'delinquent'])
        .order('started_tick', { ascending: false });

    const TYPE_MAP = { loan: 'LOAN', bond: 'BOND', insurance: 'INSURE' };
    const isInsurance = (loan) => loan.finance_loan_requests?.request_type === 'insurance';
    apPortfolio = (loans || []).map(loan => ({
        id: loan.id,
        type: TYPE_MAP[loan.finance_loan_requests?.request_type] || 'LOAN',
        counterparty: loan.borrower?.faction_name || 'Unknown',
        abbr: loan.borrower?.abbreviation || loan.borrower?.corp_ticker || '??',
        nation: loan.loan_nation?.name || loan.borrower?.nation || 'Unknown',
        remaining: isInsurance(loan) ? 0 : loan.principal - loan.total_paid,
        principal: loan.principal,
        earned: isInsurance(loan) ? ((loan.monthly_payment || 0) * (loan.payments_made || 0)) : (loan.total_interest_paid || 0),
        rate: loan.interest_rate,
        term: loan.term_months,
        paymentsMade: loan.payments_made,
        paymentsMissed: loan.payments_missed,
        monthlyPayment: loan.monthly_payment,
        status: loan.status.toUpperCase(),
        collateral: loan.collateral_type,
        purpose: loan.purpose || '',
        alert: loan.status === 'late' || loan.status === 'delinquent',
        alertLevel: loan.status === 'delinquent' ? 'red' : loan.status === 'late' ? 'orange' : null,
        alertMsg: loan.status === 'delinquent'
            ? `${loan.payments_missed} missed payments. Default imminent.`
            : loan.status === 'late'
            ? `${loan.payments_missed} missed payment${loan.payments_missed > 1 ? 's' : ''}. Monitor closely.`
            : null,
        // Insurance-specific fields
        coverage: isInsurance(loan) ? loan.principal : undefined,
        premiumsCollected: isInsurance(loan) ? ((loan.monthly_payment || 0) * (loan.payments_made || 0)) : undefined,
        paidOut: isInsurance(loan) ? (loan.claims_paid || 0) : undefined,
        claims: isInsurance(loan) ? (loan.claims_count || 0) : undefined,
        deductible: isInsurance(loan) ? (loan.deductible_pct || 0) : undefined,
    }));

    renderActivePortfolio();
}

// ==================== LOAD COLLECTIONS ====================

async function loadCollections() {
    if (!faction) { renderCollections(); return; }

    const { data: loans } = await _supabase
        .from('finance_active_loans')
        .select('*, borrower:factions!borrower_faction_id(id, faction_name, abbreviation, corp_ticker, nation), loan_nation:nations!nation_id(name), finance_loan_requests!inner(request_type)')
        .eq('lender_faction_id', faction.id)
        .in('status', ['repaid', 'defaulted'])
        .order('completed_tick', { ascending: false });

    const CTYPE_MAP = { loan: 'LOAN', bond: 'BOND', insurance: 'INSURE' };
    ccResolved = (loans || []).map(loan => {
        const earned = loan.total_interest_paid || 0;
        const lost = loan.status === 'defaulted' ? Math.max(0, loan.principal - loan.total_paid) : 0;
        return {
            type: CTYPE_MAP[loan.finance_loan_requests?.request_type] || 'LOAN',
            counterparty: loan.borrower?.faction_name || 'Unknown',
            abbr: loan.borrower?.abbreviation || loan.borrower?.corp_ticker || '??',
            nation: loan.loan_nation?.name || loan.borrower?.nation || '',
            outcome: loan.status === 'repaid' ? 'REPAID' : 'DEFAULTED',
            principal: loan.principal,
            earned,
            lost,
            net: earned - lost,
            resolved: loan.completed_tick ? 'Tick ' + loan.completed_tick : '',
            term: loan.term_months + 'mo',
            rate: loan.interest_rate + '%',
            note: loan.status === 'repaid'
                ? `Fully repaid over ${loan.payments_made} payments.`
                : `Defaulted after ${loan.payments_missed} missed payments. ${loan.collateral_type !== 'unsecured' ? 'Collateral (' + loan.collateral_type + ') partially recovered losses.' : 'Unsecured — no collateral recovery.'}`,
        };
    });

    renderCollections();
}

function routeToSharedOperationsTab(tab) {
    const nextUrl = new URL('corp-operations.html', window.location.href);
    nextUrl.search = window.location.search;
    const params = nextUrl.searchParams;
    params.set('tab', tab);
    nextUrl.search = params.toString() ? `?${params.toString()}` : '';
    window.location.href = nextUrl.toString();
}

function switchToExpansion(e) {
    if (e?.preventDefault) e.preventDefault();
    routeToSharedOperationsTab('expansion');
}

function switchToActions(e) {
    if (e?.preventDefault) e.preventDefault();
    routeToSharedOperationsTab('actions');
}

async function init() {
    const urlTab = new URLSearchParams(window.location.search).get('tab');
    const isSharedTab = urlTab === 'expansion' || urlTab === 'actions';
    const activeTab = isSharedTab ? urlTab : 'operations';

    const { data: { user } } = await _supabase.auth.getUser();
    if (!user) { window.location.href = 'login.html'; return; }

    const { data: allFactions } = await _supabase
        .from('factions')
        .select('*')
        .or(`id.eq.${user.id},linked_user_id.eq.${user.id}`);

    allUserFactions = (allFactions || []).filter(f => f.nation_id);

    const activeFactionId = sessionStorage.getItem('active_faction_id');
    faction = allUserFactions.find(f => f.id === activeFactionId)
        || allUserFactions.find(f => f.faction_type === 'corporation')
        || allUserFactions[0];

    if (!faction) {
        await _supabase.auth.signOut();
        window.location.href = 'login.html';
        return;
    }

    if (faction.faction_type !== 'corporation') {
        window.location.href = 'dashboard.html';
        return;
    }

    // If this corp is NOT Finance, redirect to the correct operations page
    if (faction.corp_sector !== 'Finance') {
        const SECTOR_OPS = { Construction: 'corp-operations.html', Shipping: 'corp-operations-shipping.html' };
        window.location.href = (SECTOR_OPS[faction.corp_sector] || 'corp-operations.html') + window.location.search;
        return;
    }

    // Expansion/actions are implemented in shared operations views, not Finance.
    if (isSharedTab) {
        routeToSharedOperationsTab(urlTab);
        return;
    }

    sessionStorage.setItem('active_faction_id', faction.id);

    // Load nation + shard
    const [nationRes, shardRes] = await Promise.all([
        faction.nation_id
            ? _supabase.from('nations').select('*').eq('id', faction.nation_id).single()
            : Promise.resolve({ data: null }),
        _supabase.from('shard').select('current_tick, current_date, next_tick_at, tick_interval_hours').eq('name', 'Alpha Shard').single(),
    ]);

    if (nationRes.data) nationStats = nationRes.data;
    shard = shardRes.data;

    // Render shared top bar
    const _topBarContainer = document.getElementById('corp-topbar-container');
    if (_topBarContainer) {
        const { renderCorpTopBar } = await import('./js/corp-topbar.js');
        renderCorpTopBar(_topBarContainer, { faction, shard, activeTab, allUserFactions });
    }

    // Faction switcher
    renderFactionSwitcher();

    // Check for Financial Sector Deregulation Act
    if (faction.nation_id) {
        const { data: laws } = await _supabase.from('active_laws')
            .select('id, policy:policies!policy_id(policy_key)')
            .eq('nation_id', faction.nation_id).limit(100);
        _hasDeregulation = (laws || []).some(l =>
            l.policy?.policy_key?.startsWith('financial_sector_deregulation'));
    }

    // Fetch active branch office count once — feeds computeDeployable for
    // both the Reserves & Risk card and the loan-offer validator so the
    // two stay aligned.
    {
        const { data: branches } = await _supabase
            .from('corp_properties')
            .select('id')
            .eq('faction_id', faction.id)
            .eq('type', 'branch_office')
            .eq('is_active', true);
        _branchCount = branches?.length || 0;
    }

    // Load data and render containers
    await loadDealFlow();
    await loadActivePortfolio();
    renderReservesRisk();
    await loadCollections();

    // Tick countdown (corp tick is midpoint between political ticks)
    if (shard?.next_tick_at) {
        const intervalMs = (Number(shard.tick_interval_hours) || 8) * 3600000;
        const politicalTickAt = new Date(shard.next_tick_at).getTime();
        const lastAdvanceAt = politicalTickAt - intervalMs;
        const corpDueAt = lastAdvanceAt + (intervalMs / 2);
        const nextCorpTickAt = new Date(corpDueAt > Date.now() ? corpDueAt : politicalTickAt + (intervalMs / 2));
        startCountdown(nextCorpTickAt);
    }

}

function renderFactionSwitcher() {
    const dropdown = document.getElementById('corp-faction-dropdown');
    if (!dropdown || allUserFactions.length <= 1) return;
    let html = '';
    for (const f of allUserFactions) {
        const isActive = f.id === faction.id;
        const label = f.faction_type === 'corporation' ? 'CORP' : 'PARTY';
        html += `<div class="corp-faction-dropdown__item${isActive ? ' active' : ''}" onclick="switchFaction('${f.id}')">
            <span style="font-size:7px;padding:1px 4px;background:${f.faction_type === 'corporation' ? 'rgba(90,175,165,0.1)' : 'rgba(200,168,50,0.1)'};border:1px solid ${f.faction_type === 'corporation' ? 'var(--teal-border)' : 'rgba(200,168,50,0.2)'};color:${f.faction_type === 'corporation' ? 'var(--teal)' : 'var(--amber)'}">${label}</span>
            <span>${escapeHtml(f.faction_name || '--')}</span>
        </div>`;
    }
    dropdown.innerHTML = html;
}

function toggleCorpDropdown() {
    document.getElementById('corp-faction-dropdown').classList.toggle('open');
}

function switchFaction(factionId) {
    sessionStorage.setItem('active_faction_id', factionId);
    const f = allUserFactions.find(x => x.id === factionId);
    if (f && f.faction_type === 'party') {
        window.location.href = 'dashboard.html';
    } else {
        window.location.reload();
    }
}

async function doLogout() {
    await _supabase.auth.signOut();
    window.location.href = 'login.html';
}

function startCountdown(nextTickAt) {
    const el = document.getElementById('tick-countdown');
    if (!el) return;
    function update() {
        const diff = new Date(nextTickAt) - new Date();
        if (diff <= 0) { el.textContent = 'Processing...'; return; }
        const h = Math.floor(diff / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        el.textContent = `${h}h ${m}m ${s}s`;
    }
    update();
    setInterval(update, 1000);
}

window.toggleCorpDropdown = toggleCorpDropdown;
window.switchFaction = switchFaction;
window.doLogout = doLogout;
window.switchToExpansion = switchToExpansion;
window.switchToActions = switchToActions;

init();
</script>
