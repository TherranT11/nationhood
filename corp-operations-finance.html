<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Operations | Nationhood Alpha</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #0e0e0c;
  --bg-1: #1a1a1a;
  --bg-2: #1a1a17;
  --bg-3: #252525;
  --bg-4: #24241f;
  --bg-5: #2c2c26;
  --bg-hover: #282822;
  --text-bright: #f0efe6;
  --text-primary: #c4c2b8;
  --text-secondary: #888;
  --text-muted: #666;
  --text-dim: #4a4940;
  --text-ghost: #333229;
  --border-hair: rgba(255,255,255,0.04);
  --border-0: rgba(255,255,255,0.06);
  --border-1: rgba(255,255,255,0.08);
  --border-2: rgba(255,255,255,0.12);
  --green: #5cb85c;
  --red: #d9534f;
  --amber: #c8a832;
  --gold: #c8a832;
  --orange: #e8724a;
  --blue: #5bc0de;
  --purple: #9b59b6;
  --teal: #5aafa5;
  --teal-border: rgba(90,175,165,0.25);
  --crimson: #dc3545;
  --font-mono: 'JetBrains Mono', monospace;
  --font-sans: 'IBM Plex Sans', sans-serif;
  --font-serif: 'IBM Plex Serif', serif;
}
body.light-mode {
  --bg-0: #f5f4f0; --bg-1: #eae9e4; --bg-2: #e0dfd8; --bg-3: #d6d5ce; --bg-4: #cccbc4; --bg-5: #c2c1ba;
  --bg-hover: #d8d7d0; --text-bright: #1a1a17; --text-primary: #333330; --text-secondary: #666660;
  --text-muted: #999990; --text-dim: #bbbbaa; --text-ghost: #ddddcc;
  --border-hair: rgba(0,0,0,0.04); --border-0: rgba(0,0,0,0.08); --border-1: rgba(0,0,0,0.12); --border-2: rgba(0,0,0,0.16);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font-sans); background:var(--bg-0); color:var(--text-primary); min-height:100vh; }

/* Top bar */
.top-bar { display:flex; align-items:center; justify-content:space-between; padding:6px 22px; background:var(--bg-2); border-bottom:1px solid var(--border-0); min-height:42px; flex-wrap:wrap; gap:6px; }
.top-bar-left { display:flex; align-items:center; gap:10px; }
.top-bar-sep { width:1px; height:22px; background:var(--border-1); }
.top-bar-right { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.corp-logo { width:24px; height:24px; border-radius:4px; background:var(--teal); border:1px solid var(--teal-border); }
.corp-name-bar { font-family:var(--font-mono); font-size:11px; font-weight:600; color:var(--text-bright); letter-spacing:0.5px; }
.tick-info { display:flex; gap:14px; }
.tick-item { text-align:center; }
.tick-label { font-size:7px; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim); font-family:var(--font-mono); }
.tick-value { font-size:11px; font-weight:600; font-family:var(--font-mono); color:var(--text-bright); margin-top:1px; }
.theme-toggle-btn { font-family:var(--font-mono); font-size:8px; padding:3px 8px; background:var(--bg-3); border:1px solid var(--border-1); color:var(--text-secondary); cursor:pointer; letter-spacing:0.5px; }
.logout-btn { font-family:var(--font-mono); font-size:8px; padding:3px 8px; background:var(--bg-3); border:1px solid var(--border-1); color:var(--text-secondary); cursor:pointer; letter-spacing:0.5px; }
.corp-name-badge { font-family:var(--font-mono); font-size:9px; padding:3px 8px; background:rgba(90,175,165,0.08); border:1px solid var(--teal-border); color:var(--teal); letter-spacing:0.5px; }
.topbar-cash { font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:0.5px; color:var(--gold); padding:3px 8px; background:rgba(200,168,50,0.08); border:1px solid rgba(200,168,50,0.2); }

/* Nav */
.corp-hamburger { display:none; background:var(--bg-2); border:1px solid var(--border-0); color:var(--text-secondary); font-size:18px; padding:6px 12px; cursor:pointer; width:100%; text-align:left; }
.corp-nav { display:flex; padding:0 22px; gap:0; height:40px; background:var(--bg-2); border-bottom:1px solid var(--border-0); }
.corp-nav__tab {
  font-family:var(--font-mono); font-size:10px; font-weight:500; letter-spacing:0.8px; text-transform:uppercase;
  color:var(--text-dim); text-decoration:none; padding:0 14px; display:flex; align-items:center;
  border-bottom:2px solid transparent; transition: color 0.15s, border-color 0.15s;
}
.corp-nav__tab:hover { color: #a8a797; }
.corp-nav__tab.active { color:var(--text-bright); border-bottom-color:var(--text-bright); }
body.light-mode .corp-nav__tab { color:#666660; }
body.light-mode .corp-nav__tab:hover { color:#333330; }
body.light-mode .corp-nav__tab.active { color:#1a1a17; border-bottom-color:#1a1a17; }

/* Deal Flow container */
.df-container { width:380px; height:450px; background:#1a1a16; border:1px solid #2a2a24; display:flex; flex-direction:column; overflow:hidden; }
.df-header { padding:8px 14px; border-bottom:1px solid #2a2a24; display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
.df-header__left { display:flex; align-items:center; gap:6px; }
.df-header__dot { font-size:8px; color:var(--teal); }
.df-header__title { font-family:var(--font-mono); font-size:11px; font-weight:700; letter-spacing:2px; color:#9e9a92; text-transform:uppercase; }
.df-filters { padding:5px 14px; border-bottom:1px solid #2a2a24; background:#1c1c18; flex-shrink:0; display:flex; gap:3px; }
.df-pill { flex:1; text-align:center; padding:3px 0; font-family:var(--font-mono); font-size:8px; font-weight:700; cursor:pointer; letter-spacing:0.5px; border:1px solid #2a2a24; color:#6a6660; background:transparent; transition:all 0.1s; }
.df-pill.active-all { color:#000; background:#8b9a6b; border-color:#8b9a6b; }
.df-pill.active-loan { color:#000; background:#5a8aaa; border-color:#5a8aaa; }
.df-pill.active-insure { color:#000; background:#aa7a5a; border-color:#aa7a5a; }
.df-pill.active-bond { color:#000; background:#8a6aaa; border-color:#8a6aaa; }
.df-list { flex:1; overflow-y:auto; }
.df-deal { padding:8px 14px; border-bottom:1px solid #2a2a24; border-left:2px solid transparent; cursor:pointer; position:relative; }
.df-deal:hover { background:rgba(255,255,255,0.01); }
.df-deal.sel-loan { border-left-color:#5a8aaa; background:rgba(90,138,170,0.08); }
.df-deal.sel-insure { border-left-color:#aa7a5a; background:rgba(170,122,90,0.08); }
.df-deal.sel-bond { border-left-color:#8a6aaa; background:rgba(138,106,170,0.08); }
.df-badge { font-family:var(--font-mono); font-size:7px; font-weight:700; letter-spacing:0.5px; padding:1px 5px; line-height:13px; display:inline-block; }
.df-badge-loan { color:#5a8aaa; background:rgba(90,138,170,0.08); border:1px solid rgba(90,138,170,0.2); }
.df-badge-insure { color:#aa7a5a; background:rgba(170,122,90,0.08); border:1px solid rgba(170,122,90,0.2); }
.df-badge-bond { color:#8a6aaa; background:rgba(138,106,170,0.08); border:1px solid rgba(138,106,170,0.2); }
.df-badge-gov { color:#a3b07e; background:rgba(163,176,126,0.1); border:1px solid rgba(163,176,126,0.2); }
.df-badge-corp { color:#c8a832; background:rgba(200,168,50,0.08); border:1px solid rgba(200,168,50,0.2); }
.df-badge-nation { color:#8b9a6b; background:rgba(139,154,107,0.08); border:1px solid rgba(139,154,107,0.15); }
.df-risk-low { color:#5c5; }
.df-risk-moderate { color:#ca5; }
.df-risk-elevated { color:#c84; }
.df-risk-high { color:#c55; }
.df-metrics { display:flex; gap:0; background:#1c1c18; border:1px solid #2a2a24; }
.df-metrics > div { padding:4px 8px; }
.df-metrics > div + div { border-left:1px solid #2a2a24; }
.df-metrics__label { font-family:var(--font-mono); font-size:7px; color:#6a6660; letter-spacing:0.5px; }
.df-metrics__value { font-family:var(--font-mono); font-weight:700; margin-top:1px; }
.df-detail { background:#121210; border:1px solid #2a2a24; padding:5px 8px; margin-top:6px; }
.df-detail-row { display:flex; justify-content:space-between; padding:2px 0; }
.df-detail-row + .df-detail-row { border-top:1px solid #2a2a24; }
.df-detail-label { font-family:var(--font-mono); font-size:8px; color:#6a6660; }
.df-detail-value { font-family:var(--font-mono); font-size:9px; }
.df-footer { padding:8px 14px; border-top:1px solid #2a2a24; background:#1c1c18; flex-shrink:0; display:flex; justify-content:space-between; align-items:center; }
.df-footer__counts { display:flex; gap:10px; }
.df-footer__count { display:flex; align-items:center; gap:4px; }
.df-footer__count-dot { width:5px; height:5px; border-radius:1px; }
.df-footer__count-label { font-family:var(--font-mono); font-size:7px; color:#6a6660; }
.df-footer__count-num { font-family:var(--font-mono); font-size:8px; font-weight:700; color:#9e9a92; }
.df-review-btn { padding:4px 14px; font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:1px; border:1px solid #2a2a24; cursor:default; color:#6a6660; background:transparent; opacity:0.4; }
.df-review-btn.active { color:#000; background:#8b9a6b; border-color:#8b9a6b; cursor:pointer; opacity:1; }
.df-new-dot { position:absolute; left:4px; top:50%; transform:translateY(-50%); width:4px; height:4px; border-radius:50%; background:#c8a832; }

/* Active Portfolio container */
.ap-container { width:380px; height:450px; background:#1a1a16; border:1px solid #2a2a24; display:flex; flex-direction:column; overflow:hidden; }
.ap-summary { display:flex; border-bottom:1px solid #2a2a24; background:#1c1c18; flex-shrink:0; }
.ap-summary__cell { padding:6px 14px; }
.ap-summary__cell + .ap-summary__cell { border-left:1px solid #2a2a24; }
.ap-summary__label { font-family:var(--font-mono); font-size:7px; color:#6a6660; letter-spacing:0.8px; }
.ap-summary__value { font-family:var(--font-mono); font-weight:700; margin-top:1px; }
.ap-list { flex:1; overflow-y:auto; }
.ap-deal { border-bottom:1px solid #2a2a24; border-left:2px solid transparent; cursor:pointer; }
.ap-deal:hover { background:rgba(255,255,255,0.01); }
.ap-deal.alert-orange { border-left-color:#c84; }
.ap-deal.alert-red { border-left-color:#c55; }
.ap-deal.alert-yellow { border-left-color:#ca5; }
.ap-deal__inner { padding:7px 14px; }
.ap-deal__alert { margin-top:4px; padding:4px 6px; font-size:9px; line-height:1.4; }
.ap-deal__expanded { margin-top:6px; padding:6px 8px; background:#121210; border:1px solid #2a2a24; }
.ap-detail-row { display:flex; justify-content:space-between; padding:2px 0; }
.ap-detail-row + .ap-detail-row { border-top:1px solid #2a2a24; }
.ap-detail-label { font-family:var(--font-mono); font-size:7px; color:#6a6660; }
.ap-detail-value { font-family:var(--font-mono); font-size:9px; font-weight:700; }
.ap-actions { display:flex; gap:4px; margin-top:6px; }
.ap-action-btn { flex:1; padding:4px 0; text-align:center; cursor:pointer; font-family:var(--font-mono); font-size:7px; font-weight:700; background:transparent; }
.ap-action-btn.green { color:#5c5; border:1px solid #2a5a3a; background:rgba(74,170,136,0.06); }
.ap-action-btn.orange { color:#c84; border:1px solid rgba(204,136,68,0.27); }
.ap-action-btn.red { color:#c55; border:1px solid rgba(204,85,85,0.27); }
.ap-action-btn.purple { color:#8a6aaa; border:1px solid rgba(138,106,170,0.27); }
.ap-action-btn.olive { color:#8b9a6b; border:1px solid rgba(139,154,107,0.27); }
.ap-claim-box { padding:4px 6px; margin-bottom:4px; background:rgba(204,85,85,0.04); border:1px solid rgba(204,85,85,0.1); }
.ap-empty { padding:30px 20px; text-align:center; font-family:var(--font-mono); font-size:9px; color:#6a6660; line-height:1.6; }

/* Reserves & Risk container */
.rr-container { width:380px; height:450px; background:#1a1a16; border:1px solid #2a2a24; display:flex; flex-direction:column; overflow:hidden; }
.rr-section-bar { padding:6px 14px; border-bottom:1px solid #2a2a24; background:#1c1c18; font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:1.5px; color:#a3b07e; text-transform:uppercase; }
.rr-section { padding:8px 14px; border-bottom:1px solid #2a2a24; }
.rr-seg-bar { width:100%; display:flex; overflow:hidden; }
.rr-seg-legend { display:flex; justify-content:space-between; margin-top:4px; }
.rr-seg-legend-item { display:flex; align-items:center; gap:4px; font-family:var(--font-mono); font-size:8px; color:#9e9a92; }
.rr-seg-legend-dot { width:6px; height:6px; }
.rr-reserve-cells { display:flex; gap:0; margin-top:8px; background:#1c1c18; border:1px solid #2a2a24; }
.rr-reserve-cell { flex:1; padding:4px 8px; }
.rr-reserve-cell + .rr-reserve-cell { border-left:1px solid #2a2a24; }
.rr-type-row { display:flex; align-items:center; padding:3px 0; }
.rr-type-row + .rr-type-row { border-top:1px solid #2a2a24; }
.rr-conc-row { display:flex; align-items:center; padding:3px 0; }
.rr-conc-row + .rr-conc-row { border-top:1px solid #2a2a24; }
.rr-warning { padding:6px 14px; border-bottom:1px solid #2a2a24; background:rgba(204,85,85,0.03); font-size:9px; color:#c84; line-height:1.5; }

/* Collections container */
.cc-container { width:380px; height:450px; background:#1a1a16; border:1px solid #2a2a24; display:flex; flex-direction:column; overflow:hidden; }
.cc-scorecard { display:flex; border-bottom:1px solid #2a2a24; background:#1c1c18; flex-shrink:0; }
.cc-scorecard__cell { flex:1; padding:6px 14px; }
.cc-scorecard__cell + .cc-scorecard__cell { border-left:1px solid #2a2a24; }
.cc-scorecard__label { font-family:var(--font-mono); font-size:7px; color:#6a6660; letter-spacing:0.8px; }
.cc-scorecard__value { font-family:var(--font-mono); font-size:13px; font-weight:700; margin-top:1px; }
.cc-winloss { padding:5px 14px; border-bottom:1px solid #2a2a24; display:flex; align-items:center; gap:8px; flex-shrink:0; }
.cc-winloss__bar { flex:1; display:flex; height:4px; }
.cc-winloss__stat { font-family:var(--font-mono); font-size:8px; font-weight:700; }
.cc-list { flex:1; overflow-y:auto; }
.cc-deal { border-bottom:1px solid #2a2a24; cursor:pointer; }
.cc-deal:hover { background:rgba(255,255,255,0.01); }
.cc-deal__inner { padding:7px 14px; }
.cc-deal__expanded { margin-top:6px; background:#121210; border:1px solid #2a2a24; padding:6px 8px; }
.cc-detail-row { display:flex; justify-content:space-between; padding:2px 0; }
.cc-detail-row + .cc-detail-row { border-top:1px solid #2a2a24; }
.cc-empty { padding:30px 20px; text-align:center; font-family:var(--font-mono); font-size:9px; color:#6a6660; line-height:1.6; }

/* Content layout */
.ops-grid { display:flex; justify-content:center; gap:12px; align-items:flex-start; flex-wrap:wrap; }

@media (max-width: 768px) {
  .df-container { width:100%; }
  .ap-container { width:100%; }
  .rr-container { width:100%; }
  .cc-container { width:100%; }
  .rd-modal { width:95vw !important; }
  .rd-body { flex-direction:column !important; }
  .rd-right { width:100% !important; border-left:none !important; border-top:1px solid #2a2a24; }
}

/* Review Deal Modal */
.rd-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:500; align-items:center; justify-content:center; }
.rd-overlay.open { display:flex; }
.rd-modal { width:680px; max-height:92vh; background:#1a1a16; border:1px solid #2a2a24; display:flex; flex-direction:column; overflow:hidden; }
.rd-header { padding:10px 16px; border-bottom:1px solid #2a2a24; background:#1c1c18; flex-shrink:0; }
.rd-tabs { display:flex; gap:4px; margin-top:8px; }
.rd-tab { flex:1; text-align:center; padding:4px 0; font-family:var(--font-mono); font-size:8px; font-weight:700; cursor:pointer; border:1px solid #2a2a24; border-bottom:2px solid transparent; color:#6a6660; background:transparent; }
.rd-tab.active-loan { color:#000; background:#5a8aaa; border-color:#5a8aaa; border-bottom-color:#5a8aaa; }
.rd-tab.active-insure { color:#000; background:#aa7a5a; border-color:#aa7a5a; border-bottom-color:#aa7a5a; }
.rd-tab.active-bond { color:#000; background:#8a6aaa; border-color:#8a6aaa; border-bottom-color:#8a6aaa; }
.rd-body { flex:1; display:flex; overflow:hidden; min-height:0; }
.rd-left { flex:1; border-right:1px solid #2a2a24; overflow-y:auto; }
.rd-right { width:260px; display:flex; flex-direction:column; overflow-y:auto; }
.rd-section-bar { padding:6px 14px; border-bottom:1px solid #2a2a24; background:#1c1c18; font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; }
.rd-applicant { padding:8px 14px; border-bottom:1px solid #2a2a24; }
.rd-applicant__stats { display:flex; gap:0; background:#1c1c18; border:1px solid #2a2a24; }
.rd-applicant__stat { flex:1; padding:4px 8px; text-align:center; }
.rd-applicant__stat + .rd-applicant__stat { border-left:1px solid #2a2a24; }
.rd-applicant__stat-label { font-family:var(--font-mono); font-size:7px; color:#6a6660; letter-spacing:0.5px; }
.rd-applicant__stat-value { font-family:var(--font-mono); font-size:11px; font-weight:700; margin-top:1px; }
.rd-control { padding:10px 14px; border-bottom:1px solid #2a2a24; }
.rd-control__header { display:flex; justify-content:space-between; margin-bottom:4px; }
.rd-control__label { font-family:var(--font-mono); font-size:9px; color:#6a6660; letter-spacing:0.8px; }
.rd-control__value { font-family:var(--font-mono); font-weight:700; }
.rd-control__range { width:100%; height:4; -webkit-appearance:none; appearance:none; background:transparent; outline:none; cursor:pointer; }
.rd-control__range::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:#e8e4dc; border:2px solid #2a2a24; cursor:pointer; margin-top:-4px; }
.rd-control__range::-webkit-slider-runnable-track { height:4px; border-radius:2px; }
.rd-control__hints { display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:7px; color:#6a6660; margin-top:2px; }
.rd-presets { display:flex; gap:3px; }
.rd-preset { flex:1; text-align:center; padding:3px 0; font-family:var(--font-mono); font-size:8px; font-weight:700; cursor:pointer; border:1px solid #2a2a24; color:#6a6660; background:transparent; }
.rd-risk-row { display:flex; justify-content:space-between; padding:4px 14px; border-bottom:1px solid #2a2a24; }
.rd-risk-label { font-family:var(--font-mono); font-size:8px; color:#6a6660; letter-spacing:0.5px; }
.rd-risk-value { font-family:var(--font-mono); font-size:10px; font-weight:700; }
.rd-bar { width:100%; height:4px; background:#2a2a24; }
.rd-bar__fill { height:100%; transition:width 0.2s; }
.rd-expected { display:flex; justify-content:space-between; padding:6px 14px; border-bottom:1px solid #2a2a24; background:rgba(92,204,92,0.03); }
.rd-expected.negative { background:rgba(204,85,85,0.03); }
.rd-formula { padding:3px 14px; border-bottom:1px solid #2a2a24; font-family:var(--font-mono); font-size:7px; color:#6a6660; }
.rd-nation-stat { display:flex; align-items:center; gap:6px; padding:2px 0; }
.rd-footer { padding:10px 16px; border-top:1px solid #2a2a24; background:#1c1c18; flex-shrink:0; display:flex; justify-content:space-between; align-items:center; }
.rd-footer__metric { }
.rd-footer__metric-label { font-family:var(--font-mono); font-size:7px; color:#6a6660; letter-spacing:0.8px; }
.rd-footer__metric-value { font-family:var(--font-mono); font-size:12px; font-weight:700; }
.rd-btn-decline { padding:6px 16px; font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:1px; color:#c55; border:1px solid rgba(204,85,85,0.27); background:transparent; cursor:pointer; }
.rd-btn-action { padding:6px 20px; font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:1px; color:#000; cursor:pointer; border:none; }
.rd-btn-action.loan { background:#5a8aaa; }
.rd-btn-action.insure { background:#aa7a5a; }

  .tick-info { gap:8px; }

  .corp-nav.nav-open .corp-nav__tab { padding:10px 22px; border-bottom:none; border-left:2px solid transparent; }
  .corp-nav.nav-open .corp-nav__tab.active { border-left-color:var(--text-bright); border-bottom:none; }
}
</style>
</head>
<body>
  <div class="top-bar">
    <div class="top-bar-left">
      <div style="display:flex;align-items:center;gap:8px;">

    <div class="top-bar-right">
      <span class="topbar-cash" id="topbar-cash">CASH: --</span>
      <div class="faction-switcher" id="faction-switcher" style="position:relative;">
        <span class="corp-name-badge" id="corp-name-badge" onclick="toggleCorpDropdown()" style="cursor:pointer;">--</span>
        <div class="corp-faction-dropdown" id="corp-faction-dropdown"></div>

      <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-toggle">Light</button>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <button class="corp-hamburger" onclick="document.querySelector('.corp-nav').classList.toggle('nav-open')">&#9776;</button>
  <nav class="corp-nav" id="corp-nav">
    <a href="corp-dashboard.html" class="corp-nav__tab" data-tab="home">Home</a>
    <a href="corp-operations-finance.html" class="corp-nav__tab active" data-tab="operations">Operations</a>
    <a href="corp-operations.html?tab=expansion" class="corp-nav__tab" data-tab="expansion">Expansion</a>
    <a href="#" class="corp-nav__tab" data-tab="industries" onclick="return false;" style="opacity:0.4;cursor:not-allowed;">Industries</a>

    <a href="#" class="corp-nav__tab" data-tab="lobbying" onclick="return false;" style="opacity:0.4;cursor:not-allowed;">Lobbying</a>
    <a href="news.html" class="corp-nav__tab" data-tab="news">News</a>
    <a href="wiki.html" class="corp-nav__tab" data-tab="wiki">Wiki</a>
  </nav>

  <div class="content">
    <div id="operations-content" class="ops-grid">
      <div class="df-container" id="df-container"></div>
      <div class="ap-container" id="ap-container"></div>
      <div class="rr-container" id="rr-container"></div>
      <div class="cc-container" id="cc-container"></div>
    </div>
  </div>

  <!-- Review Deal Modal -->
  <div class="rd-overlay" id="rd-overlay" onclick="if(event.target===this)rdClose()">
    <div class="rd-modal" id="rd-modal"></div>
  </div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { escapeHtml, tickToDate } from './js/utils.js';

let allUserFactions = [];
let faction = null;
let nationStats = null;
let shard = null;

function fmtMoney(n) {
    if (Math.abs(n) >= 1_000_000) return '$' + (n / 1_000_000).toFixed(1) + 'M';
    if (Math.abs(n) >= 1000) return '$' + (n / 1000).toFixed(0) + 'k';
    return '$' + Math.round(n).toLocaleString();
}

// ==================== DEAL FLOW ====================

const DF_TYPE_META = {
    LOAN:   { class: 'loan',   label: 'LOAN' },
    INSURE: { class: 'insure', label: 'INSURE' },
    BOND:   { class: 'bond',   label: 'BOND' },
};
const DF_RISK_META = {
    LOW:      { class: 'df-risk-low',      label: 'LOW RISK' },
    MODERATE: { class: 'df-risk-moderate',  label: 'MODERATE' },
    ELEVATED: { class: 'df-risk-elevated',  label: 'ELEVATED' },
    HIGH:     { class: 'df-risk-high',      label: 'HIGH RISK' },
};

// Deal data — loaded from finance_loan_requests
let dfDeals = [];

let dfFilter = 'ALL';
let dfSelected = -1;

async function loadDealFlow() {
    if (!faction || !shard) return;
    // Load open loan requests in the same nation (visible to finance corps)
    const { data: requests } = await _supabase
        .from('finance_loan_requests')
        .select('*, requesting_faction:factions!requesting_faction_id(id, faction_name, abbreviation, corp_ticker, corp_subsector, corp_reputation, corp_credit_rating, nation_id)')
        .eq('nation_id', faction.nation_id)
        .eq('status', 'open')
        .order('created_tick', { ascending: false });

    // Check which requests this corp already made an offer on
    const { data: myOffers } = await _supabase
        .from('finance_loan_offers')
        .select('request_id')
        .eq('offering_faction_id', faction.id);
    const offeredSet = new Set((myOffers || []).map(o => o.request_id));

    dfDeals = (requests || []).map(req => ({
        id: req.id,
        type: 'LOAN',
        applicant: req.requesting_faction?.faction_name || 'Unknown',
        abbr: req.requesting_faction?.abbreviation || req.requesting_faction?.corp_ticker || '??',
        entity: 'CORP',
        nation: 'N/A',
        amount: req.amount,
        term: req.term_months,
        purpose: req.purpose || '',
        reputation: req.requesting_faction?.corp_reputation ?? 50,
        creditRating: req.requesting_faction?.corp_credit_rating ?? 50,
        risk: (req.requesting_faction?.corp_credit_rating ?? 50) >= 60 ? 'LOW'
            : (req.requesting_faction?.corp_credit_rating ?? 50) >= 40 ? 'MODERATE'
            : (req.requesting_faction?.corp_credit_rating ?? 50) >= 25 ? 'ELEVATED' : 'HIGH',
        isNew: !offeredSet.has(req.id),
        ticksLeft: (req.expires_tick || 0) - (shard?.current_tick || 0),
        requestId: req.id,
        alreadyOffered: offeredSet.has(req.id),
    }));
    renderDealFlow();
}

function dfCanReview(deal) {
    if (!faction) return false;
    const subsector = (faction.corp_subsector || '').toLowerCase();
    const allowedType = SUBSECTOR_DEAL_MAP[subsector];
    return deal.type === allowedType;
}

function dfSetFilter(type) {
    dfFilter = type;
    dfSelected = -1;
    renderDealFlow();
}

function dfSelectDeal(idx) {
    dfSelected = dfSelected === idx ? -1 : idx;
    renderDealFlow();
}

function renderDealFlow() {
    const container = document.getElementById('df-container');
    if (!container) return;

    const deals = dfFilter === 'ALL' ? dfDeals : dfDeals.filter(d => d.type === dfFilter);
    const newCount = dfDeals.filter(d => d.isNew).length;
    const totalCount = dfDeals.length;

    // Header
    let html = `<div class="df-header">
        <div class="df-header__left">
            <span class="df-header__dot">&#9679;</span>
            <span class="df-header__title">Deal Flow</span>
        </div>
        <div style="display:flex;gap:4px;align-items:center;">
            ${newCount > 0 ? `<span class="df-badge df-badge-corp" style="font-size:8px;">${newCount} NEW</span>` : ''}
            <span style="font-family:var(--font-mono);font-size:9px;color:#6a6660;">${totalCount} OPEN</span>
        </div>
    </div>`;

    // Filter bar
    const filters = [
        { id: 'ALL', label: 'All', activeClass: 'active-all' },
        { id: 'LOAN', label: 'Loans', activeClass: 'active-loan' },
        { id: 'INSURE', label: 'Insurance', activeClass: 'active-insure' },
        { id: 'BOND', label: 'Bonds', activeClass: 'active-bond' },
    ];
    html += '<div class="df-filters">';
    for (const f of filters) {
        html += `<span class="df-pill${dfFilter === f.id ? ' ' + f.activeClass : ''}" onclick="dfSetFilter('${f.id}')">${f.label}</span>`;
    }
    html += '</div>';

    // Deal list
    html += '<div class="df-list">';
    if (deals.length === 0) {
        html += '<div class="ap-empty">No deals available.<br>Deals appear when corporations request financing or governments issue bonds.</div>';
    }
    for (let i = 0; i < deals.length; i++) {
        const d = deals[i];
        const globalIdx = dfDeals.indexOf(d);
        const isSel = dfSelected === globalIdx;
        const tm = DF_TYPE_META[d.type];
        const rm = DF_RISK_META[d.risk];
        const canReview = dfCanReview(d);

        html += `<div class="df-deal${isSel ? ' sel-' + tm.class : ''}" onclick="dfSelectDeal(${globalIdx})" style="${canReview ? '' : 'opacity:0.5;'}">`;

        // New dot
        if (d.isNew && canReview) html += '<div class="df-new-dot"></div>';

        // Row 1: type badge + applicant + entity + lock if mismatched
        html += `<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;">
            <span class="df-badge df-badge-${tm.class}">${tm.label}</span>
            <span style="font-size:11px;font-weight:600;color:#e8e4dc;">${escapeHtml(d.applicant)}</span>
            <span class="df-badge df-badge-${d.entity.toLowerCase()}">${d.entity}</span>
            ${canReview ? '' : '<span style="font-family:var(--font-mono);font-size:7px;color:#6a6660;margin-left:auto;">&#128274;</span>'}
        </div>`;

        // Row 2: nation + risk
        html += `<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;">
            <span class="df-badge df-badge-nation" style="line-height:12px;">${escapeHtml(d.nation.toUpperCase())}</span>
            <span class="df-badge ${rm.class}" style="font-weight:700;line-height:12px;background:currentColor;-webkit-background-clip:unset;padding:0 4px;">`;
        // Risk badge with colored background
        html += `</span>`;
        // Re-do risk badge properly
        html = html.slice(0, html.lastIndexOf('<span class="df-badge ' + rm.class));
        const riskColor = rm.class === 'df-risk-low' ? '#5c5' : rm.class === 'df-risk-moderate' ? '#ca5' : rm.class === 'df-risk-elevated' ? '#c84' : '#c55';
        html += `<span style="font-family:var(--font-mono);font-size:7px;font-weight:700;padding:0 4px;line-height:12px;color:${riskColor};background:${riskColor}12;border:1px solid ${riskColor}25;">${rm.label}</span>
        </div>`;

        // Row 3: metrics
        const amountLabel = d.type === 'BOND' ? 'FACE VALUE' : d.type === 'INSURE' ? 'COVERAGE' : 'AMOUNT';
        const qualLabel = d.type === 'BOND' ? 'COUPON' : 'REP';
        const qualValue = d.type === 'BOND' ? d.couponRate + '%' : (d.reputation || d.stability);
        const qualNum = d.type === 'BOND' ? d.couponRate * 10 : (d.reputation || d.stability);
        const qualColor = d.type === 'BOND' ? '#c8a832' : qualNum >= 60 ? '#5c5' : qualNum >= 35 ? '#ca5' : '#c84';

        html += `<div class="df-metrics">
            <div style="flex:1;">
                <div class="df-metrics__label">${amountLabel}</div>
                <div class="df-metrics__value" style="font-size:12px;color:#e8e4dc;">${fmtMoney(d.amount)}</div>
            </div>
            <div style="flex:0.7;text-align:center;">
                <div class="df-metrics__label">TERM</div>
                <div class="df-metrics__value" style="font-size:11px;color:#e8e4dc;">${d.term}mo</div>
            </div>
            <div style="flex:0.8;text-align:center;">
                <div class="df-metrics__label">${qualLabel}</div>
                <div class="df-metrics__value" style="font-size:11px;color:${qualColor};">${qualValue}</div>
            </div>
        </div>`;

        // Expanded detail
        if (isSel) {
            html += `<div style="margin-top:6px;font-size:10px;color:#9e9a92;line-height:1.5;margin-bottom:6px;">${escapeHtml(d.purpose)}</div>`;

            if (!canReview) {
                const neededSub = d.type === 'LOAN' ? 'Banking' : d.type === 'INSURE' ? 'Insurance' : 'Investment';
                html += `<div style="padding:6px 8px;background:rgba(106,102,96,0.06);border:1px solid #2a2a24;font-family:var(--font-mono);font-size:8px;color:#6a6660;line-height:1.5;">
                    &#128274; Requires <span style="color:#e8e4dc;font-weight:700;">${neededSub}</span> subsector to underwrite.
                    ${faction?.corp_subsector ? 'Your subsector: <span style="color:#aa7a5a;">' + escapeHtml(faction.corp_subsector) + '</span>.' : ''}
                    Establish a subsidiary with this subsector to access these deals.
                </div>`;
            } else {
                html += '<div class="df-detail">';
            }

            if (canReview) {
                if (d.type === 'LOAN') {
                    const dtrPct = Math.round((d.debt / d.revenue) * 100);
                    const dtrColor = dtrPct > 50 ? '#c84' : '#5c5';
                    const debtColor = d.debt > d.revenue * 0.5 ? '#c84' : '#9e9a92';
                    html += `<div class="df-detail-row"><span class="df-detail-label">ANNUAL REVENUE</span><span class="df-detail-value" style="color:#9e9a92;">${fmtMoney(d.revenue)}</span></div>`;
                    html += `<div class="df-detail-row"><span class="df-detail-label">EXISTING DEBT</span><span class="df-detail-value" style="color:${debtColor};">${fmtMoney(d.debt)}</span></div>`;
                    html += `<div class="df-detail-row"><span class="df-detail-label">DEBT/REVENUE</span><span class="df-detail-value" style="color:${dtrColor};font-weight:700;">${dtrPct}%</span></div>`;
                } else if (d.type === 'BOND') {
                    const stabColor = d.stability >= 50 ? '#5c5' : d.stability >= 30 ? '#ca5' : '#c84';
                    const dtgColor = d.debtToGdp > 60 ? '#c55' : d.debtToGdp > 40 ? '#c84' : '#5c5';
                    const crColor = d.creditRating >= 60 ? '#5c5' : d.creditRating >= 35 ? '#ca5' : '#c55';
                    html += `<div class="df-detail-row"><span class="df-detail-label">STABILITY</span><span class="df-detail-value" style="color:${stabColor};">${d.stability}/100</span></div>`;
                    html += `<div class="df-detail-row"><span class="df-detail-label">DEBT/GDP</span><span class="df-detail-value" style="color:${dtgColor};">${d.debtToGdp}%</span></div>`;
                    html += `<div class="df-detail-row"><span class="df-detail-label">CREDIT RATING</span><span class="df-detail-value" style="color:${crColor};font-weight:700;">${d.creditRating}/100</span></div>`;
                } else if (d.type === 'INSURE') {
                    const repColor = d.reputation >= 60 ? '#5c5' : d.reputation >= 35 ? '#ca5' : '#c84';
                    const assetLabel = d.projectValue ? 'PROJECT VALUE' : 'FLEET VALUE';
                    const assetValue = d.projectValue || d.fleetValue;
                    html += `<div class="df-detail-row"><span class="df-detail-label">REPUTATION</span><span class="df-detail-value" style="color:${repColor};">${d.reputation}/100</span></div>`;
                    html += `<div class="df-detail-row"><span class="df-detail-label">${assetLabel}</span><span class="df-detail-value" style="color:#9e9a92;">${fmtMoney(assetValue)}</span></div>`;
                }
                html += '</div>'; // close df-detail
            }
        }

        html += '</div>'; // close df-deal
    }
    html += '</div>'; // close df-list

    // Footer
    const loanCount = dfDeals.filter(d => d.type === 'LOAN').length;
    const insureCount = dfDeals.filter(d => d.type === 'INSURE').length;
    const bondCount = dfDeals.filter(d => d.type === 'BOND').length;

    html += `<div class="df-footer">
        <div class="df-footer__counts">
            <div class="df-footer__count"><div class="df-footer__count-dot" style="background:#5a8aaa;"></div><span class="df-footer__count-label">LOAN</span><span class="df-footer__count-num">${loanCount}</span></div>
            <div class="df-footer__count"><div class="df-footer__count-dot" style="background:#aa7a5a;"></div><span class="df-footer__count-label">INSURE</span><span class="df-footer__count-num">${insureCount}</span></div>
            <div class="df-footer__count"><div class="df-footer__count-dot" style="background:#8a6aaa;"></div><span class="df-footer__count-label">BOND</span><span class="df-footer__count-num">${bondCount}</span></div>
        </div>
        ${(() => {
            const selDeal = dfSelected >= 0 ? dfDeals[dfSelected] : null;
            const canRev = selDeal && dfCanReview(selDeal);
            if (canRev) {
                return `<div class="df-review-btn active" onclick="rdOpen(${dfSelected})">REVIEW DEAL</div>`;
            } else if (selDeal && !canRev) {
                return `<div class="df-review-btn" style="opacity:0.4;cursor:not-allowed;" title="Requires matching subsector">&#128274; LOCKED</div>`;
            } else {
                return `<div class="df-review-btn">REVIEW DEAL</div>`;
            }
        })()}
    </div>`;

    container.innerHTML = html;
}

window.dfSetFilter = dfSetFilter;
window.dfSelectDeal = dfSelectDeal;

// ==================== ACTIVE PORTFOLIO ====================

const AP_STATUS_META = {
    CURRENT:    { color: '#5c5', label: 'CURRENT' },
    LATE:       { color: '#c84', label: 'LATE' },
    DELINQUENT: { color: '#c55', label: 'DELINQUENT' },
    CLAIM:      { color: '#c55', label: 'CLAIM FILED' },
    ACTIVE:     { color: '#5c5', label: 'ACTIVE' },
    WATCHLIST:  { color: '#ca5', label: 'WATCHLIST' },
    DEFAULT:    { color: '#c55', label: 'DEFAULT' },
};

// Portfolio data — populated from DB when deal system is wired
let apPortfolio = [];
let apFilter = 'ALL';
let apExpanded = -1;

function apSetFilter(type) {
    apFilter = type;
    apExpanded = -1;
    renderActivePortfolio();
}

function apToggle(idx) {
    apExpanded = apExpanded === idx ? -1 : idx;
    renderActivePortfolio();
}

function renderActivePortfolio() {
    const container = document.getElementById('ap-container');
    if (!container) return;

    const deals = apFilter === 'ALL' ? apPortfolio : apPortfolio.filter(d => d.type === apFilter);
    const totalExposure = apPortfolio.reduce((s, p) => s + (p.remaining || p.coverage || p.faceValue || 0), 0);
    const totalEarned = apPortfolio.reduce((s, p) => s + (p.earned || p.premiumsCollected || p.couponsReceived || 0), 0);
    const alertCount = apPortfolio.filter(p => p.alert).length;

    // Header
    let html = `<div class="df-header">
        <div class="df-header__left">
            <span class="df-header__dot">&#9679;</span>
            <span class="df-header__title">Active Portfolio</span>
        </div>
        <div style="display:flex;gap:4px;align-items:center;">
            ${alertCount > 0 ? `<span style="font-family:var(--font-mono);font-size:8px;font-weight:700;padding:1px 6px;color:#c55;background:rgba(204,85,85,0.08);border:1px solid rgba(204,85,85,0.15);">${alertCount} ALERT${alertCount > 1 ? 'S' : ''}</span>` : ''}
            <span style="font-family:var(--font-mono);font-size:9px;color:#6a6660;">${apPortfolio.length} ACTIVE</span>
        </div>
    </div>`;

    // Summary bar
    html += `<div class="ap-summary">
        <div class="ap-summary__cell" style="flex:1;">
            <div class="ap-summary__label">TOTAL EXPOSURE</div>
            <div class="ap-summary__value" style="font-size:14px;color:#c55;">${fmtMoney(totalExposure)}</div>
        </div>
        <div class="ap-summary__cell" style="flex:1;">
            <div class="ap-summary__label">TOTAL EARNED</div>
            <div class="ap-summary__value" style="font-size:14px;color:#5c5;">${fmtMoney(totalEarned)}</div>
        </div>
        <div class="ap-summary__cell" style="flex:0.6;">
            <div class="ap-summary__label">DEALS</div>
            <div style="display:flex;gap:4px;margin-top:3px;">
                ${['LOAN', 'INSURE', 'BOND'].map(t => {
                    const count = apPortfolio.filter(p => p.type === t).length;
                    const color = t === 'LOAN' ? '#5a8aaa' : t === 'INSURE' ? '#aa7a5a' : '#8a6aaa';
                    return `<div style="display:flex;align-items:center;gap:2px;"><div style="width:4px;height:4px;background:${color};border-radius:1px;"></div><span style="font-family:var(--font-mono);font-size:8px;font-weight:700;color:#9e9a92;">${count}</span></div>`;
                }).join('')}
            </div>
        </div>
    </div>`;

    // Filter pills
    html += '<div class="df-filters">';
    for (const f of [
        { id: 'ALL', label: 'All', activeClass: 'active-all' },
        { id: 'LOAN', label: 'Loans', activeClass: 'active-loan' },
        { id: 'INSURE', label: 'Policies', activeClass: 'active-insure' },
        { id: 'BOND', label: 'Bonds', activeClass: 'active-bond' },
    ]) {
        html += `<span class="df-pill${apFilter === f.id ? ' ' + f.activeClass : ''}" onclick="apSetFilter('${f.id}')">${f.label}</span>`;
    }
    html += '</div>';

    // Portfolio list
    html += '<div class="ap-list">';

    if (deals.length === 0) {
        html += '<div class="ap-empty">No active positions.<br>Review deals from the Deal Flow to build your portfolio.</div>';
    }

    for (let i = 0; i < deals.length; i++) {
        const d = deals[i];
        const globalIdx = apPortfolio.indexOf(d);
        const isExp = apExpanded === globalIdx;
        const tm = DF_TYPE_META[d.type];
        const sm = AP_STATUS_META[d.status] || AP_STATUS_META.CURRENT;
        const hasAlert = !!d.alert;
        const elapsed = d.elapsed || 0;
        const term = d.term || 1;
        const pctComplete = Math.round((elapsed / term) * 100);

        const alertClass = hasAlert ? (sm.color === '#c55' ? 'alert-red' : sm.color === '#c84' ? 'alert-orange' : 'alert-yellow') : '';
        html += `<div class="ap-deal ${alertClass}" onclick="apToggle(${globalIdx})">

                <div style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:${rateColor};margin-top:1px;">${rateVal}%</div>

            <div style="flex:1;padding:3px 6px;text-align:right;">

        // Alert banner

            html += `<div class="ap-deal__alert" style="background:${sm.color}08;border:1px solid ${sm.color}20;color:${sm.color};">${escapeHtml(d.alert)}</div>`;

        // Expanded details
        if (isExp) {
            html += '<div class="ap-deal__expanded">';

            if (d.type === 'LOAN') {
                const rows = [
                    { label: 'PRINCIPAL', value: fmtMoney(d.principal || 0) },
                    { label: 'REMAINING', value: fmtMoney(d.remaining || 0), color: '#e8e4dc' },
                    { label: 'MONTHLY PAYMENT', value: fmtMoney(d.monthlyPayment || 0) },
                    { label: 'MISSED PAYMENTS', value: String(d.missedPayments || 0), color: (d.missedPayments || 0) > 0 ? '#c55' : '#5c5' },
                    { label: 'NEXT DUE', value: d.nextPayment || '—', color: d.status === 'LATE' ? '#c55' : '#9e9a92' },
                ];
                for (const r of rows) {
                    html += `<div class="ap-detail-row"><span class="ap-detail-label">${r.label}</span><span class="ap-detail-value" style="color:${r.color || '#9e9a92'};">${r.value}</span></div>`;
                }
                if (d.status !== 'CURRENT') {

            } else if (d.type === 'INSURE') {
                const rows = [
                    { label: 'COVERAGE', value: fmtMoney(d.coverage || 0) },
                    { label: 'PREMIUMS COLLECTED', value: fmtMoney(d.premiumsCollected || 0), color: '#5c5' },

                for (const r of rows) {

                if (d.status === 'CLAIM' && d.claimAmount) {

                const rows = [

    html += '</div>'; // close list

    // Footer
    html += `<div class="df-footer">

            <div><div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;letter-spacing:0.8px;">EXPOSURE</div><div style="font-family:var(--font-mono);font-size:11px;font-weight:700;color:#c55;">${fmtMoney(totalExposure)}</div></div>
            <div><div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;letter-spacing:0.8px;">EARNED</div><div style="font-family:var(--font-mono);font-size:11px;font-weight:700;color:#5c5;">${fmtMoney(totalEarned)}</div></div>
        </div>
        <div style="display:flex;gap:6px;">
            ${['LOAN', 'INSURE', 'BOND'].map(t => {
                const color = t === 'LOAN' ? '#5a8aaa' : t === 'INSURE' ? '#aa7a5a' : '#8a6aaa';
                const count = apPortfolio.filter(p => p.type === t).length;

    container.innerHTML = html;

// ==================== RESERVES & RISK ====================

function rrSegBar(segments, h) {
    const total = segments.reduce((a, s) => a + s.value, 0);
    if (total === 0) return `<div class="rr-seg-bar" style="height:${h}px;background:#2a2a24;"></div>`;
    return `<div class="rr-seg-bar" style="height:${h}px;">${segments.map(s =>
        `<div style="width:${(s.value / total * 100).toFixed(1)}%;height:100%;background:${s.color};"></div>`
    ).join('')}</div>`;
}

function renderReservesRisk() {
    const container = document.getElementById('rr-container');
    if (!container) return;

    // Compute from portfolio + faction cash
    const cash = Number(faction?.corp_cash_reserves) || 0;
    const loanExposure = apPortfolio.filter(p => p.type === 'LOAN').reduce((s, p) => s + (p.remaining || 0), 0);
    const insureExposure = apPortfolio.filter(p => p.type === 'INSURE').reduce((s, p) => s + (p.coverage || 0), 0);
    const bondExposure = apPortfolio.filter(p => p.type === 'BOND').reduce((s, p) => s + (p.faceValue || 0), 0);
    const totalExposure = loanExposure + insureExposure + bondExposure;
    const deployed = totalExposure;
    const totalAssets = cash + deployed;

    const requiredReserve = Math.round(totalExposure * 0.15);
    const reserveRatio = totalExposure > 0 ? Math.round((cash / totalExposure) * 100) : 100;
    const reserveHealth = reserveRatio >= 30 ? 'HEALTHY' : reserveRatio >= 20 ? 'ADEQUATE' : reserveRatio >= 15 ? 'THIN' : 'CRITICAL';
    const reserveColor = reserveRatio >= 30 ? '#5c5' : reserveRatio >= 20 ? '#ca5' : reserveRatio >= 15 ? '#c84' : '#c55';
    const availableCapital = Math.max(0, cash - requiredReserve);

    // Concentration by nation
    const nationMap = {};
    for (const p of apPortfolio) {
        const n = p.nation || 'Unknown';
        const exp = p.remaining || p.coverage || p.faceValue || 0;
        nationMap[n] = (nationMap[n] || 0) + exp;
    }
    const nationConc = Object.entries(nationMap)
        .map(([name, exposure]) => ({ name, exposure, pct: totalExposure > 0 ? Math.round(exposure / totalExposure * 100) : 0 }))
        .sort((a, b) => b.exposure - a.exposure);

    // Concentration by sector
    const sectorMap = {};
    for (const p of apPortfolio) {
        const sec = p.type === 'BOND' ? 'Government' : p.sector || 'Other';
        const exp = p.remaining || p.coverage || p.faceValue || 0;
        sectorMap[sec] = (sectorMap[sec] || 0) + exp;
    }
    const sectorConc = Object.entries(sectorMap)
        .map(([name, exposure]) => ({ name, exposure, pct: totalExposure > 0 ? Math.round(exposure / totalExposure * 100) : 0 }))
        .sort((a, b) => b.exposure - a.exposure);

    const topNationPct = nationConc.length > 0 ? nationConc[0].pct : 0;
    const concRisk = topNationPct > 60 ? 'HIGH' : topNationPct > 40 ? 'MODERATE' : 'LOW';
    const concColor = concRisk === 'HIGH' ? '#c55' : concRisk === 'MODERATE' ? '#ca5' : '#5c5';

    // ── Header ──
    let html = `<div class="df-header">
        <div class="df-header__left">
            <span class="df-header__dot">&#9679;</span>
            <span class="df-header__title">Reserves & Risk</span>
        </div>
        <span style="font-family:var(--font-mono);font-size:8px;font-weight:700;padding:1px 6px;color:${reserveColor};background:${reserveColor}12;border:1px solid ${reserveColor}25;">${reserveHealth}</span>
    </div>`;

    html += '<div style="flex:1;overflow-y:auto;">';

    // ── Capital Position ──
    html += '<div class="rr-section-bar">Capital Position</div>';
    html += '<div class="rr-section">';
    html += `<div style="display:flex;justify-content:space-between;margin-bottom:4px;">
        <span style="font-family:var(--font-mono);font-size:8px;color:#6a6660;letter-spacing:0.8px;">TOTAL ASSETS</span>
        <span style="font-family:var(--font-mono);font-size:14px;font-weight:700;color:#e8e4dc;">${fmtMoney(totalAssets)}</span>
    </div>`;
    html += rrSegBar([{ value: cash, color: '#5c5' }, { value: deployed, color: '#8b9a6b' }], 6);
    html += `<div class="rr-seg-legend">
        <div class="rr-seg-legend-item"><div class="rr-seg-legend-dot" style="background:#5c5;"></div>Cash ${fmtMoney(cash)}</div>
        <div class="rr-seg-legend-item"><div class="rr-seg-legend-dot" style="background:#8b9a6b;"></div>Deployed ${fmtMoney(deployed)}</div>
    </div>`;
    html += '</div>';

    // ── Reserve Ratio ──
    html += '<div class="rr-section">';
    html += `<div style="display:flex;justify-content:space-between;margin-bottom:4px;">
        <span style="font-family:var(--font-mono);font-size:8px;color:#6a6660;letter-spacing:0.8px;">RESERVE RATIO</span>
        <span style="font-family:var(--font-mono);font-size:16px;font-weight:700;color:${reserveColor};">${reserveRatio}%</span>
    </div>`;
    html += `<div class="rd-bar" style="height:5px;"><div class="rd-bar__fill" style="width:${Math.min(reserveRatio / 60 * 100, 100)}%;background:${reserveColor};"></div></div>`;
    html += `<div style="display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:7px;color:#6a6660;margin-top:3px;">
        <span style="color:#c55;">15% minimum</span><span>30% healthy</span><span style="color:#5c5;">60%+</span>
    </div>`;
    html += `<div class="rr-reserve-cells">
        <div class="rr-reserve-cell"><div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;letter-spacing:0.5px;">REQUIRED (15%)</div><div style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:#c84;margin-top:1px;">${fmtMoney(requiredReserve)}</div></div>
        <div class="rr-reserve-cell"><div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;letter-spacing:0.5px;">AVAILABLE TO DEPLOY</div><div style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:${availableCapital > 0 ? '#5c5' : '#c55'};margin-top:1px;">${fmtMoney(availableCapital)}</div></div>
    </div>`;
    html += '</div>';

    // ── Exposure by Type ──
    html += '<div class="rr-section-bar">Exposure by Type</div>';
    html += '<div class="rr-section">';
    if (totalExposure > 0) {
        html += rrSegBar([
            { value: loanExposure, color: '#5a8aaa' },
            { value: insureExposure, color: '#aa7a5a' },
            { value: bondExposure, color: '#8a6aaa' },
        ], 6);
        html += '<div style="margin-top:6px;">';
        const types = [
            { label: 'Loans', value: loanExposure, color: '#5a8aaa', pct: totalExposure > 0 ? Math.round(loanExposure / totalExposure * 100) : 0 },
            { label: 'Insurance', value: insureExposure, color: '#aa7a5a', pct: totalExposure > 0 ? Math.round(insureExposure / totalExposure * 100) : 0 },
            { label: 'Bonds', value: bondExposure, color: '#8a6aaa', pct: totalExposure > 0 ? Math.round(bondExposure / totalExposure * 100) : 0 },
        ];
        for (let i = 0; i < types.length; i++) {
            const t = types[i];
            html += `<div class="rr-type-row">
                <div style="width:6px;height:6px;background:${t.color};margin-right:6px;"></div>
                <span style="flex:1;font-family:var(--font-mono);font-size:9px;color:#9e9a92;">${t.label}</span>
                <span style="font-family:var(--font-mono);font-size:9px;color:#e8e4dc;width:50px;text-align:right;">${fmtMoney(t.value)}</span>
                <span style="font-family:var(--font-mono);font-size:8px;color:#6a6660;width:28px;text-align:right;">${t.pct}%</span>
            </div>`;
        }
        html += '</div>';
    } else {
        html += '<div style="font-family:var(--font-mono);font-size:9px;color:#6a6660;text-align:center;padding:8px 0;">No exposure</div>';
    }
    html += '</div>';

    // ── Concentration Risk ──
    html += `<div class="rr-section-bar" style="display:flex;justify-content:space-between;align-items:center;">
        <span>Concentration Risk</span>
        <span style="font-family:var(--font-mono);font-size:8px;font-weight:700;padding:1px 6px;color:${concColor};background:${concColor}12;border:1px solid ${concColor}25;">${concRisk}</span>
    </div>`;
    html += '<div class="rr-section">';

    if (nationConc.length > 0) {
        html += '<div style="font-family:var(--font-mono);font-size:8px;color:#6a6660;letter-spacing:0.8px;margin-bottom:4px;">BY NATION</div>';
        for (const n of nationConc) {
            const barColor = n.pct > 50 ? '#c84' : n.pct > 30 ? '#ca5' : '#5c5';
            html += `<div class="rr-conc-row">
                <span style="font-family:var(--font-mono);font-size:7px;padding:0 4px;color:#8b9a6b;background:rgba(139,154,107,0.08);border:1px solid rgba(139,154,107,0.15);line-height:12px;width:52px;text-align:center;">${escapeHtml(n.name.toUpperCase().slice(0, 6))}</span>
                <div style="flex:1;margin:0 6px;"><div class="rd-bar"><div class="rd-bar__fill" style="width:${n.pct}%;background:${barColor};"></div></div></div>
                <span style="font-family:var(--font-mono);font-size:9px;color:#e8e4dc;width:50px;text-align:right;">${fmtMoney(n.exposure)}</span>
                <span style="font-family:var(--font-mono);font-size:8px;font-weight:700;width:28px;text-align:right;color:${n.pct > 50 ? '#c84' : '#9e9a92'};">${n.pct}%</span>
            </div>`;
        }
    }

    if (sectorConc.length > 0) {
        html += '<div style="font-family:var(--font-mono);font-size:8px;color:#6a6660;letter-spacing:0.8px;margin-top:8px;margin-bottom:4px;">BY SECTOR</div>';
        for (const s of sectorConc) {
            const barColor = s.pct > 50 ? '#c84' : s.pct > 30 ? '#ca5' : '#5c5';
            html += `<div class="rr-conc-row">
                <span style="font-family:var(--font-mono);font-size:8px;color:#9e9a92;width:52px;">${escapeHtml(s.name)}</span>
                <div style="flex:1;margin:0 6px;"><div class="rd-bar"><div class="rd-bar__fill" style="width:${s.pct}%;background:${barColor};"></div></div></div>
                <span style="font-family:var(--font-mono);font-size:9px;color:#e8e4dc;width:50px;text-align:right;">${fmtMoney(s.exposure)}</span>
                <span style="font-family:var(--font-mono);font-size:8px;font-weight:700;width:28px;text-align:right;color:${s.pct > 50 ? '#c84' : '#9e9a92'};">${s.pct}%</span>
            </div>`;
        }
    }

    if (nationConc.length === 0 && sectorConc.length === 0) {
        html += '<div style="font-family:var(--font-mono);font-size:9px;color:#6a6660;text-align:center;padding:8px 0;">No positions to analyze</div>';
    }
    html += '</div>';

    // Concentration warning
    if (topNationPct > 60 && nationConc.length > 0) {
        html += `<div class="rr-warning"><span style="font-family:var(--font-mono);font-size:8px;font-weight:700;color:#c55;">CONCENTRATION WARNING: </span>${topNationPct}% of exposure is in ${escapeHtml(nationConc[0].name)}. A sovereign crisis or economic downturn in this nation would affect the majority of your portfolio. Consider diversifying across nations.</div>`;
    }

    html += '</div>'; // close scrollable area

    // ── Footer ──
    html += `<div class="df-footer" style="justify-content:space-between;">
        <div><div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;letter-spacing:0.8px;">DEPLOYABLE CAPITAL</div><div style="font-family:var(--font-mono);font-size:14px;font-weight:700;color:${availableCapital > 0 ? '#5c5' : '#c55'};">${fmtMoney(availableCapital)}</div></div>
        <div style="text-align:right;"><div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;letter-spacing:0.8px;">TOTAL EXPOSURE</div><div style="font-family:var(--font-mono);font-size:14px;font-weight:700;color:#e8e4dc;">${fmtMoney(totalExposure)}</div></div>
    </div>`;

    container.innerHTML = html;
}

        <div class="cc-scorecard__cell">

        <div class="cc-scorecard__cell">
            <div class="cc-scorecard__label">LOST</div>
            <div class="cc-scorecard__value" style="color:#c55;">${fmtMoney(totalLost)}</div>
        </div>
        <div class="cc-scorecard__cell" style="background:${profitable ? 'rgba(92,204,92,0.03)' : 'rgba(204,85,85,0.03)'};">
            <div class="cc-scorecard__label">NET P&amp;L</div>
            <div class="cc-scorecard__value" style="color:${profitable ? '#5c5' : '#c55'};">${profitable ? '+' : ''}${fmtMoney(totalNet)}</div>
        </div>
    </div>`;

    // Win/Loss bar
    if (ccResolved.length > 0) {
        const winPct = (winCount / ccResolved.length) * 100;
        html += `<div class="cc-winloss">
            <div class="cc-winloss__bar">
                <div style="width:${winPct}%;background:#5c5;height:100%;"></div>
                <div style="flex:1;background:#c55;height:100%;"></div>
            </div>
            <span class="cc-winloss__stat" style="color:#5c5;">${winCount}W</span>
            <span style="font-family:var(--font-mono);font-size:8px;color:#6a6660;">&mdash;</span>
            <span class="cc-winloss__stat" style="color:#c55;">${lossCount}L</span>
        </div>`;
    }

    // Resolved deals list
    html += '<div class="cc-list">';

    if (ccResolved.length === 0) {
        html += '<div class="cc-empty">No resolved deals yet.<br>Completed loans, expired policies, and matured bonds appear here.</div>';
    }

    for (let i = 0; i < ccResolved.length; i++) {
        const d = ccResolved[i];
        const tm = DF_TYPE_META[d.type] || { class: 'loan', label: d.type };
        const om = CC_OUTCOME_META[d.outcome] || { color: '#9e9a92', label: d.outcome };
        const isExp = ccExpanded === i;
        const isProfitable = d.net >= 0;

        html += `<div class="cc-deal" onclick="ccToggle(${i})" style="border-left:2px solid ${isProfitable ? '#5c5' : '#c55'};">
        <div class="cc-deal__inner" style="${isExp ? 'background:' + (d.type === 'LOAN' ? 'rgba(90,138,170,0.08)' : d.type === 'INSURE' ? 'rgba(170,122,90,0.08)' : 'rgba(138,106,170,0.08)') : ''}">`;

        // Row 1: Type + counterparty + outcome
        html += `<div style="display:flex;align-items:center;gap:5px;margin-bottom:3px;">
            <span class="df-badge df-badge-${tm.class}">${tm.label}</span>
            <span style="font-size:11px;font-weight:600;color:#e8e4dc;flex:1;">${escapeHtml(d.counterparty)}</span>
            <span style="font-family:var(--font-mono);font-size:7px;font-weight:700;padding:0 5px;line-height:12px;color:${om.color};background:${om.color}12;border:1px solid ${om.color}25;">${om.label}</span>
        </div>`;

        // Row 2: Nation + date
        html += `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
            <span class="df-badge df-badge-nation" style="line-height:12px;">${escapeHtml((d.nation || '').toUpperCase())}</span>
            <span style="font-family:var(--font-mono);font-size:8px;color:#6a6660;">${escapeHtml(d.resolved || '')}</span>
        </div>`;

        // Row 3: P&L bar
        html += '<div class="df-metrics">';
        html += `<div style="flex:1;padding:3px 8px;">
            <div class="df-metrics__label">PRINCIPAL</div>
            <div class="df-metrics__value" style="font-size:10px;color:#e8e4dc;margin-top:1px;">${fmtMoney(d.principal || 0)}</div>
        </div>`;
        html += `<div style="flex:0.8;padding:3px 8px;text-align:center;border-left:1px solid #2a2a24;">
            <div class="df-metrics__label">EARNED</div>
            <div class="df-metrics__value" style="font-size:10px;color:#5c5;margin-top:1px;">${fmtMoney(d.earned || 0)}</div>
        </div>`;
        if (d.lost > 0) {
            html += `<div style="flex:0.8;padding:3px 8px;text-align:center;border-left:1px solid #2a2a24;">
                <div class="df-metrics__label">LOST</div>
                <div class="df-metrics__value" style="font-size:10px;color:#c55;margin-top:1px;">${fmtMoney(d.lost)}</div>
            </div>`;
        }
        html += `<div style="flex:1;padding:3px 8px;text-align:right;border-left:1px solid #2a2a24;background:${isProfitable ? 'rgba(92,204,92,0.03)' : 'rgba(204,85,85,0.03)'};">
            <div class="df-metrics__label">NET</div>
            <div class="df-metrics__value" style="font-size:11px;color:${isProfitable ? '#5c5' : '#c55'};margin-top:1px;">${isProfitable ? '+' : ''}${fmtMoney(d.net || 0)}</div>
        </div>`;
        html += '</div>';

        // Expanded details
        if (isExp) {
            html += '<div class="cc-deal__expanded">';
            if (d.term) {
                html += `<div class="cc-detail-row">
                    <span style="font-family:var(--font-mono);font-size:7px;color:#6a6660;">TERM</span>
                    <span style="font-family:var(--font-mono);font-size:9px;color:#9e9a92;">${escapeHtml(d.term)}</span>
                </div>`;
            }
            if (d.rate) {
                html += `<div class="cc-detail-row">
                    <span style="font-family:var(--font-mono);font-size:7px;color:#6a6660;">RATE</span>
                    <span style="font-family:var(--font-mono);font-size:9px;color:#9e9a92;">${escapeHtml(d.rate)}</span>
                </div>`;
            }
            if (d.note) {
                html += `<div style="padding:4px 0;">
                    <div style="font-size:9px;color:${isProfitable ? '#9e9a92' : '#c84'};line-height:1.5;">${escapeHtml(d.note)}</div>
                </div>`;
            }
            html += '</div>';
        }

        html += '</div></div>'; // close inner + deal
    }

    html += '</div>'; // close list

    // Footer
    html += `<div class="df-footer" style="justify-content:space-between;">
        <div>
            <div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;letter-spacing:0.8px;">LIFETIME P&amp;L</div>
            <div style="font-family:var(--font-mono);font-size:14px;font-weight:700;color:${profitable ? '#5c5' : '#c55'};">${profitable ? '+' : ''}${fmtMoney(totalNet)}</div>
        </div>
        <div style="display:flex;gap:6px;">
            ${Object.entries(
                ccResolved.reduce((acc, d) => { acc[d.outcome] = (acc[d.outcome] || 0) + 1; return acc; }, {})
            ).map(([outcome, count]) => {
                const om = CC_OUTCOME_META[outcome] || { color: '#9e9a92', label: outcome };
                return `<div style="text-align:center;">
                    <div style="font-family:var(--font-mono);font-size:6px;color:${om.color};letter-spacing:0.3px;">${om.label}</div>
                    <div style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:#e8e4dc;">${count}</div>
                </div>`;
            }).join('')}
        </div>
    </div>`;

    container.innerHTML = html;
}

window.ccToggle = ccToggle;

// ==================== REVIEW DEAL MODAL ====================

const SUBSECTOR_DEAL_MAP = { banking: 'LOAN', insurance: 'INSURE', investment: 'BOND' };

let rdDeal = null;       // the deal being reviewed
let rdType = 'LOAN';     // active tab

// Loan controls
let rdLoanRate = 8;
let rdLoanAmount = 18000000;
let rdLoanTerm = 24;
let rdLoanCollateral = 'equipment';

// Insurance controls
let rdInsurePremium = 3.5;
let rdInsureCoverage = 12000000;
let rdInsureDeductible = 10;

// Bond controls
let rdBondAmount = 25000000;
const COLLATERAL_TIERS = [
    { id: 'none', label: 'None', recovery: 0, desc: 'Unsecured loan. No recovery on default.' },
    { id: 'equipment', label: 'Equipment', recovery: 60, desc: 'Seize financed equipment on default — recover ~60%.' },
    { id: 'property', label: 'Property', recovery: 75, desc: 'Corporate property lien — recover ~75%.' },
    { id: 'full', label: 'Full Assets', recovery: 90, desc: 'Full asset claim — recover ~90% but harder sell.' },
];

function rdOpen(dealIdx) {
    const deal = dfDeals[dealIdx];
    if (!deal) return;
    rdDeal = deal;
    rdType = deal.type;

    // Reset controls to defaults based on deal
    if (deal.type === 'LOAN') {
        rdLoanRate = 8;
        rdLoanAmount = deal.amount;
        rdLoanTerm = deal.term || 24;
        rdLoanCollateral = 'equipment';
    } else if (deal.type === 'INSURE') {
        rdInsurePremium = 3.5;
        rdInsureCoverage = deal.amount;
        rdInsureDeductible = 10;
    } else if (deal.type === 'BOND') {
        rdBondAmount = Math.round(deal.amount * 0.25);
    }

    document.getElementById('rd-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
    renderReviewDeal();
}

function rdClose() {
    document.getElementById('rd-overlay').classList.remove('open');
    document.body.style.overflow = '';
    rdDeal = null;
}

function rdSetLoanRate(v) { rdLoanRate = Number(v); renderReviewDeal(); }
function rdSetLoanAmount(v) { rdLoanAmount = Number(v); renderReviewDeal(); }
function rdSetLoanTerm(v) { rdLoanTerm = Number(v); renderReviewDeal(); }
function rdSetCollateral(v) { rdLoanCollateral = v; renderReviewDeal(); }
function rdSetInsurePremium(v) { rdInsurePremium = Number(v); renderReviewDeal(); }
function rdSetInsureCoverage(v) { rdInsureCoverage = Number(v); renderReviewDeal(); }
function rdSetInsureDeductible(v) { rdInsureDeductible = Number(v); renderReviewDeal(); }
function rdSetBondAmount(v) { rdBondAmount = Number(v); renderReviewDeal(); }

function rdBar(value, max, color) {
    const pct = Math.min((value / max) * 100, 100);
    return `<div class="rd-bar"><div class="rd-bar__fill" style="width:${pct}%;background:${color};"></div></div>`;
}

function renderReviewDeal() {
    const modal = document.getElementById('rd-modal');
    if (!modal || !rdDeal) return;

    const d = rdDeal;
    const typeColor = rdType === 'LOAN' ? '#5a8aaa' : rdType === 'INSURE' ? '#aa7a5a' : '#8a6aaa';

    // ── Loan calculations ──
    const loanTotalInterest = Math.round(rdLoanAmount * (rdLoanRate / 100) * (rdLoanTerm / 12));
    const loanMonthlyPayment = Math.round((rdLoanAmount + loanTotalInterest) / rdLoanTerm);
    const borrowerRevenue = d.revenue || 47400000;
    const loanDebtService = Math.round(loanMonthlyPayment / borrowerRevenue * 1200);

    const baseDefault = 12;
    const rateDefaultMod = Math.max(0, (rdLoanRate - 6) * 1.5);
    const amountDefaultMod = rdLoanAmount > 15000000 ? 3 : 0;
    const collateralMod = rdLoanCollateral === 'none' ? 3 : rdLoanCollateral === 'full' ? -2 : 0;
    const defaultProb = Math.min(60, Math.max(2, Math.round(baseDefault + rateDefaultMod + amountDefaultMod + collateralMod)));
    const defaultColor = defaultProb <= 15 ? '#5c5' : defaultProb <= 30 ? '#ca5' : defaultProb <= 45 ? '#c84' : '#c55';
    const defaultLabel = defaultProb <= 15 ? 'LOW' : defaultProb <= 30 ? 'MODERATE' : defaultProb <= 45 ? 'ELEVATED' : 'HIGH';

    const baseAccept = 95;
    const rateAcceptMod = (rdLoanRate - 4) * 8;
    const partialMod = rdLoanAmount < (d.amount || 18000000) ? 10 : 0;
    const collateralAcceptMod = rdLoanCollateral === 'full' ? 15 : rdLoanCollateral === 'property' ? 8 : rdLoanCollateral === 'none' ? -5 : 0;
    const acceptProb = Math.max(10, Math.min(95, Math.round(baseAccept - rateAcceptMod - partialMod - collateralAcceptMod)));
    const acceptColor = acceptProb >= 70 ? '#5c5' : acceptProb >= 45 ? '#ca5' : acceptProb >= 25 ? '#c84' : '#c55';

    const collTier = COLLATERAL_TIERS.find(c => c.id === rdLoanCollateral);
    const loanExpectedReturn = Math.round(loanTotalInterest * (1 - defaultProb / 100));

    // ── Insurance calculations ──
    const insureTermYears = (d.term || 18) / 12;
    const insureTotalPremiums = Math.round(rdInsureCoverage * (rdInsurePremium / 100) * insureTermYears);
    const baseClaimProb = 100 - (d.reputation || 50); // lower rep = higher claim chance
    const insureClaimProb = Math.max(5, Math.min(50, Math.round(baseClaimProb * 0.4)));
    const insureMaxExposure = Math.round(rdInsureCoverage * (1 - rdInsureDeductible / 100));
    const insureExpectedPayout = Math.round(insureMaxExposure * (insureClaimProb / 100));
    const insureExpectedProfit = insureTotalPremiums - insureExpectedPayout;
    const claimColor = insureClaimProb <= 12 ? '#5c5' : insureClaimProb <= 22 ? '#ca5' : insureClaimProb <= 35 ? '#c84' : '#c55';

    // ── Bond calculations ──
    const bondCoupon = d.couponRate || 6.2;
    const bondTermMonths = d.term || 60;
    const bondTermYears = bondTermMonths / 12;
    const bondAnnualCoupon = Math.round(rdBondAmount * (bondCoupon / 100));
    const bondTotalReturn = Math.round(rdBondAmount * (bondCoupon / 100) * bondTermYears);
    // Default probability from stability + credit rating + debt/GDP
    const bondStability = d.stability || 50;
    const bondCreditRating = d.creditRating || 50;
    const bondDebtToGdp = d.debtToGdp || 30;
    const bondBaseDefault = Math.max(2, Math.round(
        (100 - bondStability) * 0.15 + (100 - bondCreditRating) * 0.15 + Math.max(0, bondDebtToGdp - 30) * 0.3
    ));
    const bondDefaultProb = Math.min(60, bondBaseDefault);
    const bondDefaultColor = bondDefaultProb <= 10 ? '#5c5' : bondDefaultProb <= 20 ? '#ca5' : bondDefaultProb <= 35 ? '#c84' : '#c55';
    const bondExpectedReturn = Math.round(bondTotalReturn * (1 - bondDefaultProb / 100));

    // ── HEADER ──
    let html = `<div class="rd-header">
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <div style="display:flex;align-items:center;gap:8px;">
                <span style="font-size:8px;color:${typeColor};">&#9679;</span>
                <span style="font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:2px;color:#9e9a92;text-transform:uppercase;">Review Deal</span>
            </div>
            <span onclick="rdClose()" style="font-family:var(--font-mono);font-size:14px;color:#6a6660;cursor:pointer;">&#215;</span>
        </div>`;

    // Single tab showing this deal's type and applicant
    const tabClass = rdType === 'LOAN' ? 'active-loan' : rdType === 'INSURE' ? 'active-insure' : 'active-bond';
    const tabLabel = rdType === 'LOAN' ? 'Loan' : rdType === 'INSURE' ? 'Insure' : 'Bond';
    html += `<div class="rd-tabs">
        <span class="rd-tab ${tabClass}" style="cursor:default;">${tabLabel} — ${escapeHtml(d.applicant)}</span>
    </div></div>`;

    // ── BODY ──
    html += '<div class="rd-body">';

    // ═══ LEFT PANEL ═══
    html += '<div class="rd-left">';

    if (rdType === 'LOAN') {
        // Applicant info
        const repColor = (d.reputation || 50) >= 60 ? '#5c5' : (d.reputation || 50) >= 35 ? '#ca5' : '#c84';
        html += `<div class="rd-applicant">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
                <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:#c8a832;">${escapeHtml(d.abbr)}</span>
                <span style="font-size:13px;font-weight:700;color:#e8e4dc;">${escapeHtml(d.applicant)}</span>
                <span class="df-badge df-badge-${d.entity.toLowerCase()}">${d.entity}</span>
            </div>
            <div style="font-size:10px;color:#9e9a92;line-height:1.5;margin-bottom:6px;">${escapeHtml(d.purpose)}</div>
            <div class="rd-applicant__stats">
                <div class="rd-applicant__stat"><div class="rd-applicant__stat-label">REVENUE</div><div class="rd-applicant__stat-value" style="color:#5c5;">${fmtMoney(d.revenue || 0)}</div></div>
                <div class="rd-applicant__stat"><div class="rd-applicant__stat-label">DEBT</div><div class="rd-applicant__stat-value" style="color:#c84;">${fmtMoney(d.debt || 0)}</div></div>
                <div class="rd-applicant__stat"><div class="rd-applicant__stat-label">REP</div><div class="rd-applicant__stat-value" style="color:${repColor};">${d.reputation || '—'}</div></div>
                <div class="rd-applicant__stat"><div class="rd-applicant__stat-label">REQUESTED</div><div class="rd-applicant__stat-value" style="color:#e8e4dc;">${fmtMoney(d.amount)}</div></div>
            </div>
        </div>`;

        // Section: Set Loan Terms
        html += `<div class="rd-section-bar" style="color:#5a8aaa;">Set Loan Terms</div>`;

        // Interest Rate slider
        const ratePct = ((rdLoanRate - 3) / 15) * 100;
        html += `<div class="rd-control">
            <div class="rd-control__header">
                <span class="rd-control__label">INTEREST RATE (ANNUAL)</span>
                <span class="rd-control__value" style="font-size:16px;color:#5a8aaa;">${rdLoanRate}%</span>
            </div>
            <input type="range" class="rd-control__range" min="3" max="18" step="0.5" value="${rdLoanRate}"
                oninput="rdSetLoanRate(this.value)"
                style="background:linear-gradient(90deg,#5a8aaa ${ratePct}%,#2a2a24 ${ratePct}%);">
            <div class="rd-control__hints"><span>3% (generous)</span><span>18% (predatory)</span></div>
        </div>`;

        // Loan Amount slider — $5M to $150M
        const maxLoanAmt = 150000000;
        const amtPct = ((rdLoanAmount - 5000000) / Math.max(1, maxLoanAmt - 5000000)) * 100;
        html += `<div class="rd-control">
            <div class="rd-control__header">
                <span class="rd-control__label">LOAN AMOUNT</span>
                <span class="rd-control__value" style="font-size:14px;color:#e8e4dc;">${fmtMoney(rdLoanAmount)}</span>
            </div>
            <input type="range" class="rd-control__range" min="5000000" max="${maxLoanAmt}" step="5000000" value="${rdLoanAmount}"
                oninput="rdSetLoanAmount(this.value)"
                style="background:linear-gradient(90deg,#5a8aaa ${amtPct}%,#2a2a24 ${amtPct}%);">
            <div class="rd-control__hints"><span>$5M</span><span>$150M</span></div>
        </div>`;

        // Term presets
        html += `<div class="rd-control">
            <div class="rd-control__header">
                <span class="rd-control__label">TERM (MONTHS)</span>
                <span class="rd-control__value" style="font-size:14px;color:#e8e4dc;">${rdLoanTerm}mo</span>
            </div>
            <div class="rd-presets">`;
        for (const t of [12, 24, 36, 48, 60, 72, 84, 96, 108, 120]) {
            const isActive = rdLoanTerm === t;
            html += `<span class="rd-preset" onclick="rdSetLoanTerm(${t})" style="${isActive ? 'color:#000;background:#5a8aaa;border-color:#5a8aaa;' : ''}">${t}</span>`;
        }
        html += `</div></div>`;

        // Collateral tiers
        html += `<div class="rd-control">
            <div class="rd-control__label" style="margin-bottom:6px;">COLLATERAL REQUIREMENT</div>
            <div class="rd-presets">`;
        for (const c of COLLATERAL_TIERS) {
            const isActive = rdLoanCollateral === c.id;
            html += `<div onclick="rdSetCollateral('${c.id}')" style="flex:1;padding:5px 4px;text-align:center;cursor:pointer;background:${isActive ? 'rgba(90,138,170,0.09)' : 'transparent'};border:1px solid ${isActive ? 'rgba(90,138,170,0.27)' : '#2a2a24'};">
                <div style="font-family:var(--font-mono);font-size:8px;font-weight:700;color:${isActive ? '#5a8aaa' : '#6a6660'};">${c.label}</div>

            <div style="font-family:var(--font-mono);font-size:7px;color:#6a6660;margin-top:4px;">${collTier.desc}</div>
        </div>`;
    }

    if (rdType === 'INSURE') {
        // Applicant info
        const repColor = (d.reputation || 50) >= 60 ? '#5c5' : (d.reputation || 50) >= 35 ? '#ca5' : '#c84';
        const assetLabel = d.projectValue ? 'PROJECT' : 'FLEET';
        const assetValue = d.projectValue || d.fleetValue || 0;
        html += `<div class="rd-applicant">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">

                <span style="font-size:13px;font-weight:700;color:#e8e4dc;">${escapeHtml(d.applicant)}</span>
                <span class="df-badge df-badge-${d.entity.toLowerCase()}">${d.entity}</span>

            <div style="font-size:10px;color:#9e9a92;line-height:1.5;margin-bottom:6px;">${escapeHtml(d.purpose)}</div>
            <div class="rd-applicant__stats">
                <div class="rd-applicant__stat"><div class="rd-applicant__stat-label">REP</div><div class="rd-applicant__stat-value" style="color:${repColor};">${d.reputation || '—'}</div></div>
                <div class="rd-applicant__stat"><div class="rd-applicant__stat-label">${assetLabel}</div><div class="rd-applicant__stat-value" style="color:#e8e4dc;">${fmtMoney(assetValue)}</div></div>
                <div class="rd-applicant__stat"><div class="rd-applicant__stat-label">REQUESTED</div><div class="rd-applicant__stat-value" style="color:#e8e4dc;">${fmtMoney(d.amount)}</div></div>
                <div class="rd-applicant__stat"><div class="rd-applicant__stat-label">TERM</div><div class="rd-applicant__stat-value" style="color:#e8e4dc;">${d.term}mo</div></div>
            </div>
        </div>`;

        html += `<div class="rd-section-bar" style="color:#aa7a5a;">Set Policy Terms</div>`;

        // Premium Rate slider
        const premPct = ((rdInsurePremium - 1) / 7) * 100;
        html += `<div class="rd-control">
            <div class="rd-control__header">
                <span class="rd-control__label">PREMIUM RATE (ANNUAL)</span>
                <span class="rd-control__value" style="font-size:16px;color:#aa7a5a;">${rdInsurePremium}%</span>
            </div>
            <input type="range" class="rd-control__range" min="1" max="8" step="0.5" value="${rdInsurePremium}"
                oninput="rdSetInsurePremium(this.value)"
                style="background:linear-gradient(90deg,#aa7a5a ${premPct}%,#2a2a24 ${premPct}%);">
            <div class="rd-control__hints"><span>1% (competitive)</span><span>8% (expensive)</span></div>
        </div>`;

        // Coverage Amount slider
        const maxCoverage = Math.round((d.projectValue || d.fleetValue || d.amount) * 0.7);
        const minCoverage = Math.round(d.amount * 0.33);
        const covPct = ((rdInsureCoverage - minCoverage) / (maxCoverage - minCoverage)) * 100;
        html += `<div class="rd-control">
            <div class="rd-control__header">
                <span class="rd-control__label">COVERAGE AMOUNT</span>
                <span class="rd-control__value" style="font-size:14px;color:#e8e4dc;">${fmtMoney(rdInsureCoverage)}</span>
            </div>
            <input type="range" class="rd-control__range" min="${minCoverage}" max="${maxCoverage}" step="1000000" value="${rdInsureCoverage}"
                oninput="rdSetInsureCoverage(this.value)"
                style="background:linear-gradient(90deg,#aa7a5a ${covPct}%,#2a2a24 ${covPct}%);">
            <div class="rd-control__hints"><span>${fmtMoney(minCoverage)} (partial)</span><span>${fmtMoney(maxCoverage)} (max)</span></div>
