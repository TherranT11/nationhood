<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Operations | Nationhood Alpha</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #0e0e0c;
  --bg-1: #1a1a1a;
  --bg-2: #1a1a17;
  --bg-3: #252525;
  --bg-4: #24241f;
  --bg-5: #2c2c26;
  --bg-hover: #282822;
  --text-bright: #f0efe6;
  --text-primary: #c4c2b8;
  --text-secondary: #888;
  --text-muted: #666;
  --text-dim: #4a4940;
  --text-ghost: #333229;
  --border-hair: rgba(255,255,255,0.04);
  --border-0: rgba(255,255,255,0.06);
  --border-1: rgba(255,255,255,0.08);
  --border-2: rgba(255,255,255,0.12);
  --green: #5cb85c;
  --red: #d9534f;
  --amber: #c8a832;
  --gold: #c8a832;
  --orange: #e8724a;
  --blue: #5bc0de;
  --purple: #9b59b6;
  --teal: #5aafa5;
  --teal-border: rgba(90,175,165,0.25);
  --crimson: #dc3545;
  --font-mono: 'JetBrains Mono', monospace;
  --font-sans: 'IBM Plex Sans', sans-serif;
  --font-serif: 'IBM Plex Serif', serif;
}
body.light-mode {
  --bg-0: #f5f4f0; --bg-1: #eae9e4; --bg-2: #e0dfd8; --bg-3: #d6d5ce; --bg-4: #cccbc4; --bg-5: #c2c1ba;
  --bg-hover: #d8d7d0; --text-bright: #1a1a17; --text-primary: #333330; --text-secondary: #666660;
  --text-muted: #999990; --text-dim: #bbbbaa; --text-ghost: #ddddcc;
  --border-hair: rgba(0,0,0,0.04); --border-0: rgba(0,0,0,0.08); --border-1: rgba(0,0,0,0.12); --border-2: rgba(0,0,0,0.16);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font-sans); background:var(--bg-0); color:var(--text-primary); min-height:100vh; }

/* Top bar */
.top-bar { display:flex; align-items:center; justify-content:space-between; padding:6px 22px; background:var(--bg-2); border-bottom:1px solid var(--border-0); min-height:42px; flex-wrap:wrap; gap:6px; }
.top-bar-left { display:flex; align-items:center; gap:10px; }
.top-bar-sep { width:1px; height:22px; background:var(--border-1); }
.top-bar-right { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.corp-logo { width:24px; height:24px; border-radius:4px; background:var(--teal); border:1px solid var(--teal-border); }
.corp-name-bar { font-family:var(--font-mono); font-size:11px; font-weight:600; color:var(--text-bright); letter-spacing:0.5px; }
.tick-info { display:flex; gap:14px; }
.tick-item { text-align:center; }
.tick-label { font-size:7px; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim); font-family:var(--font-mono); }
.tick-value { font-size:11px; font-weight:600; font-family:var(--font-mono); color:var(--text-bright); margin-top:1px; }
.theme-toggle-btn { font-family:var(--font-mono); font-size:8px; padding:3px 8px; background:var(--bg-3); border:1px solid var(--border-1); color:var(--text-secondary); cursor:pointer; letter-spacing:0.5px; }
.logout-btn { font-family:var(--font-mono); font-size:8px; padding:3px 8px; background:var(--bg-3); border:1px solid var(--border-1); color:var(--text-secondary); cursor:pointer; letter-spacing:0.5px; }
.corp-name-badge { font-family:var(--font-mono); font-size:9px; padding:3px 8px; background:rgba(90,175,165,0.08); border:1px solid var(--teal-border); color:var(--teal); letter-spacing:0.5px; }
.topbar-cash { font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:0.5px; color:var(--gold); padding:3px 8px; background:rgba(200,168,50,0.08); border:1px solid rgba(200,168,50,0.2); }

/* Nav */
.corp-hamburger { display:none; background:var(--bg-2); border:1px solid var(--border-0); color:var(--text-secondary); font-size:18px; padding:6px 12px; cursor:pointer; width:100%; text-align:left; }
.corp-nav { display:flex; padding:0 22px; gap:0; height:40px; background:var(--bg-2); border-bottom:1px solid var(--border-0); }
.corp-nav__tab {
  font-family:var(--font-mono); font-size:10px; font-weight:500; letter-spacing:0.8px; text-transform:uppercase;
  color:var(--text-dim); text-decoration:none; padding:0 14px; display:flex; align-items:center;
  border-bottom:2px solid transparent; transition: color 0.15s, border-color 0.15s;
}
.corp-nav__tab:hover { color: #a8a797; }
.corp-nav__tab.active { color:var(--text-bright); border-bottom-color:var(--text-bright); }
body.light-mode .corp-nav__tab { color:#666660; }
body.light-mode .corp-nav__tab:hover { color:#333330; }
body.light-mode .corp-nav__tab.active { color:#1a1a17; border-bottom-color:#1a1a17; }

/* Deal Flow container */
.df-container { width:380px; background:#1a1a16; border:1px solid #2a2a24; display:flex; flex-direction:column; overflow:hidden; max-height:450px; }
.df-header { padding:8px 14px; border-bottom:1px solid #2a2a24; display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
.df-header__left { display:flex; align-items:center; gap:6px; }
.df-header__dot { font-size:8px; color:var(--teal); }
.df-header__title { font-family:var(--font-mono); font-size:11px; font-weight:700; letter-spacing:2px; color:#9e9a92; text-transform:uppercase; }
.df-filters { padding:5px 14px; border-bottom:1px solid #2a2a24; background:#1c1c18; flex-shrink:0; display:flex; gap:3px; }
.df-pill { flex:1; text-align:center; padding:3px 0; font-family:var(--font-mono); font-size:8px; font-weight:700; cursor:pointer; letter-spacing:0.5px; border:1px solid #2a2a24; color:#6a6660; background:transparent; transition:all 0.1s; }
.df-pill.active-all { color:#000; background:#8b9a6b; border-color:#8b9a6b; }
.df-pill.active-loan { color:#000; background:#5a8aaa; border-color:#5a8aaa; }
.df-pill.active-insure { color:#000; background:#aa7a5a; border-color:#aa7a5a; }
.df-pill.active-bond { color:#000; background:#8a6aaa; border-color:#8a6aaa; }
.df-list { flex:1; overflow-y:auto; }
.df-deal { padding:8px 14px; border-bottom:1px solid #2a2a24; border-left:2px solid transparent; cursor:pointer; position:relative; }
.df-deal:hover { background:rgba(255,255,255,0.01); }
.df-deal.sel-loan { border-left-color:#5a8aaa; background:rgba(90,138,170,0.08); }
.df-deal.sel-insure { border-left-color:#aa7a5a; background:rgba(170,122,90,0.08); }
.df-deal.sel-bond { border-left-color:#8a6aaa; background:rgba(138,106,170,0.08); }
.df-badge { font-family:var(--font-mono); font-size:7px; font-weight:700; letter-spacing:0.5px; padding:1px 5px; line-height:13px; display:inline-block; }
.df-badge-loan { color:#5a8aaa; background:rgba(90,138,170,0.08); border:1px solid rgba(90,138,170,0.2); }
.df-badge-insure { color:#aa7a5a; background:rgba(170,122,90,0.08); border:1px solid rgba(170,122,90,0.2); }
.df-badge-bond { color:#8a6aaa; background:rgba(138,106,170,0.08); border:1px solid rgba(138,106,170,0.2); }
.df-badge-gov { color:#a3b07e; background:rgba(163,176,126,0.1); border:1px solid rgba(163,176,126,0.2); }
.df-badge-corp { color:#c8a832; background:rgba(200,168,50,0.08); border:1px solid rgba(200,168,50,0.2); }
.df-badge-nation { color:#8b9a6b; background:rgba(139,154,107,0.08); border:1px solid rgba(139,154,107,0.15); }
.df-risk-low { color:#5c5; }
.df-risk-moderate { color:#ca5; }
.df-risk-elevated { color:#c84; }
.df-risk-high { color:#c55; }
.df-metrics { display:flex; gap:0; background:#1c1c18; border:1px solid #2a2a24; }
.df-metrics > div { padding:4px 8px; }
.df-metrics > div + div { border-left:1px solid #2a2a24; }
.df-metrics__label { font-family:var(--font-mono); font-size:7px; color:#6a6660; letter-spacing:0.5px; }
.df-metrics__value { font-family:var(--font-mono); font-weight:700; margin-top:1px; }
.df-detail { background:#121210; border:1px solid #2a2a24; padding:5px 8px; margin-top:6px; }
.df-detail-row { display:flex; justify-content:space-between; padding:2px 0; }
.df-detail-row + .df-detail-row { border-top:1px solid #2a2a24; }
.df-detail-label { font-family:var(--font-mono); font-size:8px; color:#6a6660; }
.df-detail-value { font-family:var(--font-mono); font-size:9px; }
.df-footer { padding:8px 14px; border-top:1px solid #2a2a24; background:#1c1c18; flex-shrink:0; display:flex; justify-content:space-between; align-items:center; }
.df-footer__counts { display:flex; gap:10px; }
.df-footer__count { display:flex; align-items:center; gap:4px; }
.df-footer__count-dot { width:5px; height:5px; border-radius:1px; }
.df-footer__count-label { font-family:var(--font-mono); font-size:7px; color:#6a6660; }
.df-footer__count-num { font-family:var(--font-mono); font-size:8px; font-weight:700; color:#9e9a92; }
.df-review-btn { padding:4px 14px; font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:1px; border:1px solid #2a2a24; cursor:default; color:#6a6660; background:transparent; opacity:0.4; }
.df-review-btn.active { color:#000; background:#8b9a6b; border-color:#8b9a6b; cursor:pointer; opacity:1; }
.df-new-dot { position:absolute; left:4px; top:50%; transform:translateY(-50%); width:4px; height:4px; border-radius:50%; background:#c8a832; }

/* Content layout */
.ops-grid { display:flex; justify-content:center; gap:12px; align-items:flex-start; flex-wrap:wrap; }

@media (max-width: 768px) {
  .df-container { width:100%; max-height:none; }
  .rd-modal { width:95vw !important; }
  .rd-body { flex-direction:column !important; }
  .rd-right { width:100% !important; border-left:none !important; border-top:1px solid #2a2a24; }
}

/* Review Deal Modal */
.rd-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:500; align-items:center; justify-content:center; }
.rd-overlay.open { display:flex; }
.rd-modal { width:680px; max-height:92vh; background:#1a1a16; border:1px solid #2a2a24; display:flex; flex-direction:column; overflow:hidden; }
.rd-header { padding:10px 16px; border-bottom:1px solid #2a2a24; background:#1c1c18; flex-shrink:0; }
.rd-tabs { display:flex; gap:4px; margin-top:8px; }
.rd-tab { flex:1; text-align:center; padding:4px 0; font-family:var(--font-mono); font-size:8px; font-weight:700; cursor:pointer; border:1px solid #2a2a24; border-bottom:2px solid transparent; color:#6a6660; background:transparent; }
.rd-tab.active-loan { color:#000; background:#5a8aaa; border-color:#5a8aaa; border-bottom-color:#5a8aaa; }
.rd-tab.active-insure { color:#000; background:#aa7a5a; border-color:#aa7a5a; border-bottom-color:#aa7a5a; }
.rd-tab.active-bond { color:#000; background:#8a6aaa; border-color:#8a6aaa; border-bottom-color:#8a6aaa; }
.rd-body { flex:1; display:flex; overflow:hidden; min-height:0; }
.rd-left { flex:1; border-right:1px solid #2a2a24; overflow-y:auto; }
.rd-right { width:260px; display:flex; flex-direction:column; overflow-y:auto; }
.rd-section-bar { padding:6px 14px; border-bottom:1px solid #2a2a24; background:#1c1c18; font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; }
.rd-applicant { padding:8px 14px; border-bottom:1px solid #2a2a24; }
.rd-applicant__stats { display:flex; gap:0; background:#1c1c18; border:1px solid #2a2a24; }
.rd-applicant__stat { flex:1; padding:4px 8px; text-align:center; }
.rd-applicant__stat + .rd-applicant__stat { border-left:1px solid #2a2a24; }
.rd-applicant__stat-label { font-family:var(--font-mono); font-size:7px; color:#6a6660; letter-spacing:0.5px; }
.rd-applicant__stat-value { font-family:var(--font-mono); font-size:11px; font-weight:700; margin-top:1px; }
.rd-control { padding:10px 14px; border-bottom:1px solid #2a2a24; }
.rd-control__header { display:flex; justify-content:space-between; margin-bottom:4px; }
.rd-control__label { font-family:var(--font-mono); font-size:9px; color:#6a6660; letter-spacing:0.8px; }
.rd-control__value { font-family:var(--font-mono); font-weight:700; }
.rd-control__range { width:100%; height:4; -webkit-appearance:none; appearance:none; background:transparent; outline:none; cursor:pointer; }
.rd-control__range::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:#e8e4dc; border:2px solid #2a2a24; cursor:pointer; margin-top:-4px; }
.rd-control__range::-webkit-slider-runnable-track { height:4px; border-radius:2px; }
.rd-control__hints { display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:7px; color:#6a6660; margin-top:2px; }
.rd-presets { display:flex; gap:3px; }
.rd-preset { flex:1; text-align:center; padding:3px 0; font-family:var(--font-mono); font-size:8px; font-weight:700; cursor:pointer; border:1px solid #2a2a24; color:#6a6660; background:transparent; }
.rd-risk-row { display:flex; justify-content:space-between; padding:4px 14px; border-bottom:1px solid #2a2a24; }
.rd-risk-label { font-family:var(--font-mono); font-size:8px; color:#6a6660; letter-spacing:0.5px; }
.rd-risk-value { font-family:var(--font-mono); font-size:10px; font-weight:700; }
.rd-bar { width:100%; height:4px; background:#2a2a24; }
.rd-bar__fill { height:100%; transition:width 0.2s; }
.rd-expected { display:flex; justify-content:space-between; padding:6px 14px; border-bottom:1px solid #2a2a24; background:rgba(92,204,92,0.03); }
.rd-expected.negative { background:rgba(204,85,85,0.03); }
.rd-formula { padding:3px 14px; border-bottom:1px solid #2a2a24; font-family:var(--font-mono); font-size:7px; color:#6a6660; }
.rd-nation-stat { display:flex; align-items:center; gap:6px; padding:2px 0; }
.rd-footer { padding:10px 16px; border-top:1px solid #2a2a24; background:#1c1c18; flex-shrink:0; display:flex; justify-content:space-between; align-items:center; }
.rd-footer__metric { }
.rd-footer__metric-label { font-family:var(--font-mono); font-size:7px; color:#6a6660; letter-spacing:0.8px; }
.rd-footer__metric-value { font-family:var(--font-mono); font-size:12px; font-weight:700; }
.rd-btn-decline { padding:6px 16px; font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:1px; color:#c55; border:1px solid rgba(204,85,85,0.27); background:transparent; cursor:pointer; }
.rd-btn-action { padding:6px 20px; font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:1px; color:#000; cursor:pointer; border:none; }
.rd-btn-action.loan { background:#5a8aaa; }
.rd-btn-action.insure { background:#aa7a5a; }
.rd-btn-action.bond { background:#8a6aaa; }

/* Faction dropdown */
.corp-faction-dropdown { display:none; position:absolute; top:100%; right:0; background:var(--bg-3); border:1px solid var(--border-1); z-index:100; min-width:200px; margin-top:4px; }
.corp-faction-dropdown.open { display:block; }
.corp-faction-dropdown__item { display:flex; align-items:center; gap:8px; padding:8px 12px; cursor:pointer; font-family:var(--font-mono); font-size:10px; color:var(--text-primary); border-bottom:1px solid var(--border-0); }
.corp-faction-dropdown__item:hover { background:var(--bg-hover); }
.corp-faction-dropdown__item.active { color:var(--teal); background:rgba(90,175,165,0.05); }

/* Responsive */
@media (max-width: 768px) {
  .top-bar { padding:6px 10px; }
  .tick-info { gap:8px; }
  .corp-hamburger { display:block; }
  .corp-nav { display:none; flex-direction:column; height:auto; padding:0; }
  .corp-nav.nav-open { display:flex; }
  .corp-nav.nav-open .corp-nav__tab { padding:10px 22px; border-bottom:none; border-left:2px solid transparent; }
  .corp-nav.nav-open .corp-nav__tab.active { border-left-color:var(--text-bright); border-bottom:none; }
}
</style>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { escapeHtml, tickToDate } from './js/utils.js';

let allUserFactions = [];
let faction = null;
let nationStats = null;
let shard = null;

function fmtMoney(n) {
    if (Math.abs(n) >= 1_000_000) return '$' + (n / 1_000_000).toFixed(1) + 'M';
    if (Math.abs(n) >= 1000) return '$' + (n / 1000).toFixed(0) + 'k';
    return '$' + Math.round(n).toLocaleString();
}

// ==================== DEAL FLOW ====================

const DF_TYPE_META = {
    LOAN:   { class: 'loan',   label: 'LOAN' },
    INSURE: { class: 'insure', label: 'INSURE' },

const DF_RISK_META = {
    LOW:      { class: 'df-risk-low',      label: 'LOW RISK' },
    MODERATE: { class: 'df-risk-moderate',  label: 'MODERATE' },
    ELEVATED: { class: 'df-risk-elevated',  label: 'ELEVATED' },
    HIGH:     { class: 'df-risk-high',      label: 'HIGH RISK' },
};

// Sample deal data — will be replaced with DB queries when deal system is wired
const SAMPLE_DEALS = [
    {
        type: 'LOAN', applicant: 'Salazar Construction', abbr: 'SZC', entity: 'CORP', nation: 'Melizea',
        amount: 18000000, purpose: 'Equipment acquisition — Heavy Infrastructure expansion. 2 Tower Cranes, 3 Heavy Haulers.',
        term: 24, reputation: 65, revenue: 47400000, debt: 22000000, risk: 'MODERATE', isNew: true,
    },
    {
        type: 'BOND', applicant: 'Republic of Melizea', abbr: 'MEL', entity: 'GOV', nation: 'Melizea',
        amount: 100000000, purpose: 'National Infrastructure Bond — Series 2013-B. Funding highway and rail expansion over 5 years.',
        term: 60, couponRate: 6.2, stability: 23, debtToGdp: 42, creditRating: 38, risk: 'ELEVATED', isNew: true,
    },

function dfCanReview(deal) {
    if (!faction) return false;
    const subsector = (faction.corp_subsector || '').toLowerCase();

    return deal.type === allowedType;
}

function dfSetFilter(type) {
    dfFilter = type;
    dfSelected = -1;
    renderDealFlow();
}

function dfSelectDeal(idx) {

        // Risk badge with colored background

        const riskColor = rm.class === 'df-risk-low' ? '#5c5' : rm.class === 'df-risk-moderate' ? '#ca5' : rm.class === 'df-risk-elevated' ? '#c84' : '#c55';

            if (!canReview) {

                    &#128274; Requires <span style="color:#e8e4dc;font-weight:700;">${neededSub}</span> subsector to underwrite.
                    ${faction?.corp_subsector ? 'Your subsector: <span style="color:#aa7a5a;">' + escapeHtml(faction.corp_subsector) + '</span>.' : ''}

                </div>`;
            } else {
                html += '<div class="df-detail">';
            }

            if (canReview) {
                if (d.type === 'LOAN') {
                    const dtrPct = Math.round((d.debt / d.revenue) * 100);
                    const dtrColor = dtrPct > 50 ? '#c84' : '#5c5';
                    const debtColor = d.debt > d.revenue * 0.5 ? '#c84' : '#9e9a92';
                    html += `<div class="df-detail-row"><span class="df-detail-label">ANNUAL REVENUE</span><span class="df-detail-value" style="color:#9e9a92;">${fmtMoney(d.revenue)}</span></div>`;

                    html += `<div class="df-detail-row"><span class="df-detail-label">DEBT/REVENUE</span><span class="df-detail-value" style="color:${dtrColor};font-weight:700;">${dtrPct}%</span></div>`;
                } else if (d.type === 'BOND') {
                    const stabColor = d.stability >= 50 ? '#5c5' : d.stability >= 30 ? '#ca5' : '#c84';
                    const dtgColor = d.debtToGdp > 60 ? '#c55' : d.debtToGdp > 40 ? '#c84' : '#5c5';
                    const crColor = d.creditRating >= 60 ? '#5c5' : d.creditRating >= 35 ? '#ca5' : '#c55';
                    html += `<div class="df-detail-row"><span class="df-detail-label">STABILITY</span><span class="df-detail-value" style="color:${stabColor};">${d.stability}/100</span></div>`;
                    html += `<div class="df-detail-row"><span class="df-detail-label">DEBT/GDP</span><span class="df-detail-value" style="color:${dtgColor};">${d.debtToGdp}%</span></div>`;
                    html += `<div class="df-detail-row"><span class="df-detail-label">CREDIT RATING</span><span class="df-detail-value" style="color:${crColor};font-weight:700;">${d.creditRating}/100</span></div>`;
                } else if (d.type === 'INSURE') {
                    const repColor = d.reputation >= 60 ? '#5c5' : d.reputation >= 35 ? '#ca5' : '#c84';
                    const assetLabel = d.projectValue ? 'PROJECT VALUE' : 'FLEET VALUE';
                    const assetValue = d.projectValue || d.fleetValue;
                    html += `<div class="df-detail-row"><span class="df-detail-label">REPUTATION</span><span class="df-detail-value" style="color:${repColor};">${d.reputation}/100</span></div>`;
                    html += `<div class="df-detail-row"><span class="df-detail-label">${assetLabel}</span><span class="df-detail-value" style="color:#9e9a92;">${fmtMoney(assetValue)}</span></div>`;
                }
                html += '</div>'; // close df-detail
            }
        }

        html += '</div>'; // close df-deal
    }
    html += '</div>'; // close df-list

    // Footer
    const loanCount = SAMPLE_DEALS.filter(d => d.type === 'LOAN').length;
    const insureCount = SAMPLE_DEALS.filter(d => d.type === 'INSURE').length;
    const bondCount = SAMPLE_DEALS.filter(d => d.type === 'BOND').length;

    html += `<div class="df-footer">
        <div class="df-footer__counts">
            <div class="df-footer__count"><div class="df-footer__count-dot" style="background:#5a8aaa;"></div><span class="df-footer__count-label">LOAN</span><span class="df-footer__count-num">${loanCount}</span></div>
            <div class="df-footer__count"><div class="df-footer__count-dot" style="background:#aa7a5a;"></div><span class="df-footer__count-label">INSURE</span><span class="df-footer__count-num">${insureCount}</span></div>
            <div class="df-footer__count"><div class="df-footer__count-dot" style="background:#8a6aaa;"></div><span class="df-footer__count-label">BOND</span><span class="df-footer__count-num">${bondCount}</span></div>
        </div>
        ${(() => {
            const selDeal = dfSelected >= 0 ? SAMPLE_DEALS[dfSelected] : null;
            const canRev = selDeal && dfCanReview(selDeal);
            if (canRev) {
                return `<div class="df-review-btn active" onclick="rdOpen(${dfSelected})">REVIEW DEAL</div>`;
            } else if (selDeal && !canRev) {
                return `<div class="df-review-btn" style="opacity:0.4;cursor:not-allowed;" title="Requires matching subsector">&#128274; LOCKED</div>`;
            } else {
                return `<div class="df-review-btn">REVIEW DEAL</div>`;
            }
        })()}
    </div>`;

    container.innerHTML = html;
}

// ==================== REVIEW DEAL MODAL ====================

const SUBSECTOR_DEAL_MAP = { banking: 'LOAN', insurance: 'INSURE', investment: 'BOND' };

let rdDeal = null;       // the deal being reviewed
let rdType = 'LOAN';     // active tab

// Loan controls
let rdLoanRate = 8;
let rdLoanAmount = 18000000;
let rdLoanTerm = 24;
let rdLoanCollateral = 'equipment';

// Insurance controls
let rdInsurePremium = 3.5;
let rdInsureCoverage = 12000000;
let rdInsureDeductible = 10;

// Bond controls
let rdBondAmount = 25000000;
const COLLATERAL_TIERS = [
    { id: 'none', label: 'None', recovery: 0, desc: 'Unsecured loan. No recovery on default.' },
    { id: 'equipment', label: 'Equipment', recovery: 60, desc: 'Seize financed equipment on default — recover ~60%.' },
    { id: 'property', label: 'Property', recovery: 75, desc: 'Corporate property lien — recover ~75%.' },
    { id: 'full', label: 'Full Assets', recovery: 90, desc: 'Full asset claim — recover ~90% but harder sell.' },
];

function rdOpen(dealIdx) {
    const deal = SAMPLE_DEALS[dealIdx];
    if (!deal) return;
    rdDeal = deal;
    rdType = deal.type;

    // Reset controls to defaults based on deal
    if (deal.type === 'LOAN') {
        rdLoanRate = 8;
        rdLoanAmount = deal.amount;
        rdLoanTerm = deal.term || 24;
        rdLoanCollateral = 'equipment';
    } else if (deal.type === 'INSURE') {
        rdInsurePremium = 3.5;
        rdInsureCoverage = deal.amount;
        rdInsureDeductible = 10;
    } else if (deal.type === 'BOND') {
        rdBondAmount = Math.round(deal.amount * 0.25);
    }

    document.getElementById('rd-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
    renderReviewDeal();
}

function rdClose() {
    document.getElementById('rd-overlay').classList.remove('open');
    document.body.style.overflow = '';
    rdDeal = null;
}

function rdSetTab(type) {
    rdType = type;
    renderReviewDeal();
}

function rdSetLoanRate(v) { rdLoanRate = Number(v); renderReviewDeal(); }
function rdSetLoanAmount(v) { rdLoanAmount = Number(v); renderReviewDeal(); }
function rdSetLoanTerm(v) { rdLoanTerm = Number(v); renderReviewDeal(); }
function rdSetCollateral(v) { rdLoanCollateral = v; renderReviewDeal(); }
function rdSetInsurePremium(v) { rdInsurePremium = Number(v); renderReviewDeal(); }
function rdSetInsureCoverage(v) { rdInsureCoverage = Number(v); renderReviewDeal(); }
function rdSetInsureDeductible(v) { rdInsureDeductible = Number(v); renderReviewDeal(); }
function rdSetBondAmount(v) { rdBondAmount = Number(v); renderReviewDeal(); }

function rdBar(value, max, color) {
    const pct = Math.min((value / max) * 100, 100);
    return `<div class="rd-bar"><div class="rd-bar__fill" style="width:${pct}%;background:${color};"></div></div>`;
}

function renderReviewDeal() {
    const modal = document.getElementById('rd-modal');
    if (!modal || !rdDeal) return;

    const d = rdDeal;
    const typeColor = rdType === 'LOAN' ? '#5a8aaa' : rdType === 'INSURE' ? '#aa7a5a' : '#8a6aaa';

    // ── Loan calculations ──
    const loanTotalInterest = Math.round(rdLoanAmount * (rdLoanRate / 100) * (rdLoanTerm / 12));
    const loanMonthlyPayment = Math.round((rdLoanAmount + loanTotalInterest) / rdLoanTerm);
    const borrowerRevenue = d.revenue || 47400000;
    const loanDebtService = Math.round(loanMonthlyPayment / borrowerRevenue * 1200);

    const baseDefault = 12;
    const rateDefaultMod = Math.max(0, (rdLoanRate - 6) * 1.5);
    const amountDefaultMod = rdLoanAmount > 15000000 ? 3 : 0;
    const collateralMod = rdLoanCollateral === 'none' ? 3 : rdLoanCollateral === 'full' ? -2 : 0;
    const defaultProb = Math.min(60, Math.max(2, Math.round(baseDefault + rateDefaultMod + amountDefaultMod + collateralMod)));
    const defaultColor = defaultProb <= 15 ? '#5c5' : defaultProb <= 30 ? '#ca5' : defaultProb <= 45 ? '#c84' : '#c55';
    const defaultLabel = defaultProb <= 15 ? 'LOW' : defaultProb <= 30 ? 'MODERATE' : defaultProb <= 45 ? 'ELEVATED' : 'HIGH';

    const baseAccept = 95;
    const rateAcceptMod = (rdLoanRate - 4) * 8;
    const partialMod = rdLoanAmount < (d.amount || 18000000) ? 10 : 0;
    const collateralAcceptMod = rdLoanCollateral === 'full' ? 15 : rdLoanCollateral === 'property' ? 8 : rdLoanCollateral === 'none' ? -5 : 0;
    const acceptProb = Math.max(10, Math.min(95, Math.round(baseAccept - rateAcceptMod - partialMod - collateralAcceptMod)));
    const acceptColor = acceptProb >= 70 ? '#5c5' : acceptProb >= 45 ? '#ca5' : acceptProb >= 25 ? '#c84' : '#c55';

    const collTier = COLLATERAL_TIERS.find(c => c.id === rdLoanCollateral);
    const loanExpectedReturn = Math.round(loanTotalInterest * (1 - defaultProb / 100));

    // ── Insurance calculations ──
    const insureTermYears = (d.term || 18) / 12;
    const insureTotalPremiums = Math.round(rdInsureCoverage * (rdInsurePremium / 100) * insureTermYears);
    const baseClaimProb = 100 - (d.reputation || 50); // lower rep = higher claim chance
    const insureClaimProb = Math.max(5, Math.min(50, Math.round(baseClaimProb * 0.4)));
    const insureMaxExposure = Math.round(rdInsureCoverage * (1 - rdInsureDeductible / 100));
    const insureExpectedPayout = Math.round(insureMaxExposure * (insureClaimProb / 100));
    const insureExpectedProfit = insureTotalPremiums - insureExpectedPayout;
    const claimColor = insureClaimProb <= 12 ? '#5c5' : insureClaimProb <= 22 ? '#ca5' : insureClaimProb <= 35 ? '#c84' : '#c55';

    // ── Bond calculations ──
    const bondCoupon = d.couponRate || 6.2;
    const bondTermMonths = d.term || 60;
    const bondTermYears = bondTermMonths / 12;
    const bondAnnualCoupon = Math.round(rdBondAmount * (bondCoupon / 100));
    const bondTotalReturn = Math.round(rdBondAmount * (bondCoupon / 100) * bondTermYears);
    // Default probability from stability + credit rating + debt/GDP
    const bondStability = d.stability || 50;
    const bondCreditRating = d.creditRating || 50;
    const bondDebtToGdp = d.debtToGdp || 30;
    const bondBaseDefault = Math.max(2, Math.round(
        (100 - bondStability) * 0.15 + (100 - bondCreditRating) * 0.15 + Math.max(0, bondDebtToGdp - 30) * 0.3
    ));
    const bondDefaultProb = Math.min(60, bondBaseDefault);
    const bondDefaultColor = bondDefaultProb <= 10 ? '#5c5' : bondDefaultProb <= 20 ? '#ca5' : bondDefaultProb <= 35 ? '#c84' : '#c55';
    const bondExpectedReturn = Math.round(bondTotalReturn * (1 - bondDefaultProb / 100));

    // ── HEADER ──
    let html = `<div class="rd-header">
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <div style="display:flex;align-items:center;gap:8px;">
                <span style="font-size:8px;color:${typeColor};">&#9679;</span>

            </div>
            <span onclick="rdClose()" style="font-family:var(--font-mono);font-size:14px;color:#6a6660;cursor:pointer;">&#215;</span>
        </div>
        <div class="rd-tabs">`;

    // Single tab showing this deal's type and applicant
    const tabClass = rdType === 'LOAN' ? 'active-loan' : rdType === 'INSURE' ? 'active-insure' : 'active-bond';
    const tabLabel = rdType === 'LOAN' ? 'Loan' : rdType === 'INSURE' ? 'Insure' : 'Bond';
    html += `<div class="rd-tabs">
        <span class="rd-tab ${tabClass}" style="cursor:default;">${tabLabel} — ${escapeHtml(d.applicant)}</span>
    </div></div>`;

    // ── BODY ──
    html += '<div class="rd-body">';

    // ═══ LEFT PANEL ═══
    html += '<div class="rd-left">';

    if (rdType === 'LOAN') {
        // Applicant info
        const repColor = (d.reputation || 50) >= 60 ? '#5c5' : (d.reputation || 50) >= 35 ? '#ca5' : '#c84';
        html += `<div class="rd-applicant">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
                <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:#c8a832;">${escapeHtml(d.abbr)}</span>
                <span style="font-size:13px;font-weight:700;color:#e8e4dc;">${escapeHtml(d.applicant)}</span>
                <span class="df-badge df-badge-${d.entity.toLowerCase()}">${d.entity}</span>
            </div>
            <div style="font-size:10px;color:#9e9a92;line-height:1.5;margin-bottom:6px;">${escapeHtml(d.purpose)}</div>
            <div class="rd-applicant__stats">
                <div class="rd-applicant__stat"><div class="rd-applicant__stat-label">REVENUE</div><div class="rd-applicant__stat-value" style="color:#5c5;">${fmtMoney(d.revenue || 0)}</div></div>
                <div class="rd-applicant__stat"><div class="rd-applicant__stat-label">DEBT</div><div class="rd-applicant__stat-value" style="color:#c84;">${fmtMoney(d.debt || 0)}</div></div>
                <div class="rd-applicant__stat"><div class="rd-applicant__stat-label">REP</div><div class="rd-applicant__stat-value" style="color:${repColor};">${d.reputation || '—'}</div></div>
                <div class="rd-applicant__stat"><div class="rd-applicant__stat-label">REQUESTED</div><div class="rd-applicant__stat-value" style="color:#e8e4dc;">${fmtMoney(d.amount)}</div></div>

        // Section: Set Loan Terms
        html += `<div class="rd-section-bar" style="color:#5a8aaa;">Set Loan Terms</div>`;

        html += `<div class="rd-control">

            <div class="rd-control__hints"><span>$5M (partial)</span><span>${fmtMoney(maxLoanAmt)} (over-fund)</span></div>

        // Term presets
        html += `<div class="rd-control">
            <div class="rd-control__header">

                <span class="rd-control__value" style="font-size:14px;color:#e8e4dc;">${rdLoanTerm}mo</span>

            <div class="rd-presets">`;

window.rdOpen = rdOpen;
window.rdClose = rdClose;
window.rdSetTab = rdSetTab;
window.rdSetLoanRate = rdSetLoanRate;
window.rdSetLoanAmount = rdSetLoanAmount;
window.rdSetLoanTerm = rdSetLoanTerm;
window.rdSetCollateral = rdSetCollateral;
window.rdSetInsurePremium = rdSetInsurePremium;

window.rdSetInsureDeductible = rdSetInsureDeductible;

async function init() {
    const { data: { user } } = await _supabase.auth.getUser();
    if (!user) { window.location.href = 'login.html'; return; }

    const { data: allFactions } = await _supabase
        .from('factions')
        .select('*')
        .or(`id.eq.${user.id},linked_user_id.eq.${user.id}`);

    allUserFactions = (allFactions || []).filter(f => f.nation_id);

    const activeFactionId = sessionStorage.getItem('active_faction_id');
    faction = allUserFactions.find(f => f.id === activeFactionId)
        || allUserFactions.find(f => f.faction_type === 'corporation')
        || allUserFactions[0];

    if (!faction) {
        await _supabase.auth.signOut();
        window.location.href = 'login.html';
        return;
    }

    if (faction.faction_type !== 'corporation') {
        window.location.href = 'dashboard.html';
        return;
    }

    // If this corp is NOT Finance, redirect to the correct operations page
    if (faction.corp_sector !== 'Finance') {
        window.location.href = 'corp-operations.html' + window.location.search;
        return;
    }

    sessionStorage.setItem('active_faction_id', faction.id);

    // Load nation + shard
    const [nationRes, shardRes] = await Promise.all([
        faction.nation_id
            ? _supabase.from('nations').select('*').eq('id', faction.nation_id).single()
            : Promise.resolve({ data: null }),
        _supabase.from('shard').select('current_tick, current_date, next_tick_at, tick_interval_hours').eq('name', 'Alpha Shard').single(),
    ]);

    if (nationRes.data) nationStats = nationRes.data;
    shard = shardRes.data;

    // Populate topbar
    document.getElementById('corp-name-bar').textContent = faction.faction_name || 'Corp';
    document.getElementById('corp-name-badge').textContent =
        (faction.abbreviation || faction.corp_ticker || faction.faction_name || '--').toUpperCase();
    document.getElementById('topbar-cash').textContent =
        'CASH: ' + fmtMoney(Number(faction.corp_cash_reserves) || 0);

    if (shard) {
        document.getElementById('game-date').textContent = shard.current_date || tickToDate(shard.current_tick);
        document.getElementById('tick-number').textContent = shard.current_tick || '--';
    }

    // Faction switcher
    renderFactionSwitcher();

    // Render Deal Flow container
    renderDealFlow();

    // Tick countdown
    if (shard?.next_tick_at) startCountdown(shard.next_tick_at);

}

function renderFactionSwitcher() {
    const dropdown = document.getElementById('corp-faction-dropdown');
    if (!dropdown || allUserFactions.length <= 1) return;
    let html = '';
    for (const f of allUserFactions) {
        const isActive = f.id === faction.id;
        const label = f.faction_type === 'corporation' ? 'CORP' : 'PARTY';
        html += `<div class="corp-faction-dropdown__item${isActive ? ' active' : ''}" onclick="switchFaction('${f.id}')">
            <span style="font-size:7px;padding:1px 4px;background:${f.faction_type === 'corporation' ? 'rgba(90,175,165,0.1)' : 'rgba(200,168,50,0.1)'};border:1px solid ${f.faction_type === 'corporation' ? 'var(--teal-border)' : 'rgba(200,168,50,0.2)'};color:${f.faction_type === 'corporation' ? 'var(--teal)' : 'var(--amber)'}">${label}</span>
            <span>${escapeHtml(f.faction_name || '--')}</span>
        </div>`;
    }
    dropdown.innerHTML = html;
}

function toggleCorpDropdown() {
    document.getElementById('corp-faction-dropdown').classList.toggle('open');
}

function switchFaction(factionId) {
    sessionStorage.setItem('active_faction_id', factionId);
    const f = allUserFactions.find(x => x.id === factionId);
    if (f && f.faction_type === 'party') {
        window.location.href = 'dashboard.html';
    } else {
        window.location.reload();
    }
}

function toggleTheme() {
    document.body.classList.toggle('light-mode');
    const isLight = document.body.classList.contains('light-mode');
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
    document.getElementById('theme-toggle').textContent = isLight ? 'Dark' : 'Light';
}

async function doLogout() {
    await _supabase.auth.signOut();
    window.location.href = 'login.html';
}

function startCountdown(nextTickAt) {
    const el = document.getElementById('tick-countdown');
    function update() {
        const diff = new Date(nextTickAt) - new Date();
        if (diff <= 0) { el.textContent = 'Processing...'; return; }
        const h = Math.floor(diff / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        el.textContent = `${h}h ${m}m ${s}s`;
    }
    update();
    setInterval(update, 1000);
}
