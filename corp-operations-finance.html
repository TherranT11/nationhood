<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Operations | Nationhood Alpha</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #0e0e0c;
  --bg-1: #1a1a1a;
  --bg-2: #1a1a17;
  --bg-3: #252525;
  --bg-4: #24241f;
  --bg-5: #2c2c26;
  --bg-hover: #282822;
  --text-bright: #f0efe6;
  --text-primary: #c4c2b8;
  --text-secondary: #888;
  --text-muted: #666;
  --text-dim: #4a4940;
  --text-ghost: #333229;
  --border-hair: rgba(255,255,255,0.04);
  --border-0: rgba(255,255,255,0.06);
  --border-1: rgba(255,255,255,0.08);
  --border-2: rgba(255,255,255,0.12);
  --green: #5cb85c;
  --red: #d9534f;
  --amber: #c8a832;
  --gold: #c8a832;
  --orange: #e8724a;
  --blue: #5bc0de;
  --purple: #9b59b6;
  --teal: #5aafa5;
  --teal-border: rgba(90,175,165,0.25);
  --crimson: #dc3545;
  --font-mono: 'JetBrains Mono', monospace;
  --font-sans: 'IBM Plex Sans', sans-serif;
  --font-serif: 'IBM Plex Serif', serif;
}
body.light-mode {
  --bg-0: #f5f4f0; --bg-1: #eae9e4; --bg-2: #e0dfd8; --bg-3: #d6d5ce; --bg-4: #cccbc4; --bg-5: #c2c1ba;
  --bg-hover: #d8d7d0; --text-bright: #1a1a17; --text-primary: #333330; --text-secondary: #666660;
  --text-muted: #999990; --text-dim: #bbbbaa; --text-ghost: #ddddcc;
  --border-hair: rgba(0,0,0,0.04); --border-0: rgba(0,0,0,0.08); --border-1: rgba(0,0,0,0.12); --border-2: rgba(0,0,0,0.16);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font-sans); background:var(--bg-0); color:var(--text-primary); min-height:100vh; }

/* Top bar */
.top-bar { display:flex; align-items:center; justify-content:space-between; padding:6px 22px; background:var(--bg-2); border-bottom:1px solid var(--border-0); min-height:42px; flex-wrap:wrap; gap:6px; }
.top-bar-left { display:flex; align-items:center; gap:10px; }
.top-bar-sep { width:1px; height:22px; background:var(--border-1); }
.top-bar-right { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.corp-logo { width:24px; height:24px; border-radius:4px; background:var(--teal); border:1px solid var(--teal-border); }
.corp-name-bar { font-family:var(--font-mono); font-size:11px; font-weight:600; color:var(--text-bright); letter-spacing:0.5px; }
.tick-info { display:flex; gap:14px; }
.tick-item { text-align:center; }
.tick-label { font-size:7px; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim); font-family:var(--font-mono); }
.tick-value { font-size:11px; font-weight:600; font-family:var(--font-mono); color:var(--text-bright); margin-top:1px; }
.theme-toggle-btn { font-family:var(--font-mono); font-size:8px; padding:3px 8px; background:var(--bg-3); border:1px solid var(--border-1); color:var(--text-secondary); cursor:pointer; letter-spacing:0.5px; }
.logout-btn { font-family:var(--font-mono); font-size:8px; padding:3px 8px; background:var(--bg-3); border:1px solid var(--border-1); color:var(--text-secondary); cursor:pointer; letter-spacing:0.5px; }
.corp-name-badge { font-family:var(--font-mono); font-size:9px; padding:3px 8px; background:rgba(90,175,165,0.08); border:1px solid var(--teal-border); color:var(--teal); letter-spacing:0.5px; }
.topbar-cash { font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:0.5px; color:var(--gold); padding:3px 8px; background:rgba(200,168,50,0.08); border:1px solid rgba(200,168,50,0.2); }

/* Nav */
.corp-hamburger { display:none; background:var(--bg-2); border:1px solid var(--border-0); color:var(--text-secondary); font-size:18px; padding:6px 12px; cursor:pointer; width:100%; text-align:left; }
.corp-nav { display:flex; padding:0 22px; gap:0; height:40px; background:var(--bg-2); border-bottom:1px solid var(--border-0); }
.corp-nav__tab {
  font-family:var(--font-mono); font-size:10px; font-weight:500; letter-spacing:0.8px; text-transform:uppercase;
  color:var(--text-dim); text-decoration:none; padding:0 14px; display:flex; align-items:center;
  border-bottom:2px solid transparent; transition: color 0.15s, border-color 0.15s;
}
.corp-nav__tab:hover { color: #a8a797; }
.corp-nav__tab.active { color:var(--text-bright); border-bottom-color:var(--text-bright); }
body.light-mode .corp-nav__tab { color:#666660; }
body.light-mode .corp-nav__tab:hover { color:#333330; }
body.light-mode .corp-nav__tab.active { color:#1a1a17; border-bottom-color:#1a1a17; }

/* Deal Flow container */
.df-container { width:380px; background:#1a1a16; border:1px solid #2a2a24; display:flex; flex-direction:column; overflow:hidden; max-height:450px; }
.df-header { padding:8px 14px; border-bottom:1px solid #2a2a24; display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
.df-header__left { display:flex; align-items:center; gap:6px; }
.df-header__dot { font-size:8px; color:var(--teal); }
.df-header__title { font-family:var(--font-mono); font-size:11px; font-weight:700; letter-spacing:2px; color:#9e9a92; text-transform:uppercase; }
.df-filters { padding:5px 14px; border-bottom:1px solid #2a2a24; background:#1c1c18; flex-shrink:0; display:flex; gap:3px; }
.df-pill { flex:1; text-align:center; padding:3px 0; font-family:var(--font-mono); font-size:8px; font-weight:700; cursor:pointer; letter-spacing:0.5px; border:1px solid #2a2a24; color:#6a6660; background:transparent; transition:all 0.1s; }
.df-pill.active-all { color:#000; background:#8b9a6b; border-color:#8b9a6b; }
.df-pill.active-loan { color:#000; background:#5a8aaa; border-color:#5a8aaa; }
.df-pill.active-insure { color:#000; background:#aa7a5a; border-color:#aa7a5a; }
.df-pill.active-bond { color:#000; background:#8a6aaa; border-color:#8a6aaa; }
.df-list { flex:1; overflow-y:auto; }
.df-deal { padding:8px 14px; border-bottom:1px solid #2a2a24; border-left:2px solid transparent; cursor:pointer; position:relative; }
.df-deal:hover { background:rgba(255,255,255,0.01); }
.df-deal.sel-loan { border-left-color:#5a8aaa; background:rgba(90,138,170,0.08); }
.df-deal.sel-insure { border-left-color:#aa7a5a; background:rgba(170,122,90,0.08); }
.df-deal.sel-bond { border-left-color:#8a6aaa; background:rgba(138,106,170,0.08); }
.df-badge { font-family:var(--font-mono); font-size:7px; font-weight:700; letter-spacing:0.5px; padding:1px 5px; line-height:13px; display:inline-block; }
.df-badge-loan { color:#5a8aaa; background:rgba(90,138,170,0.08); border:1px solid rgba(90,138,170,0.2); }
.df-badge-insure { color:#aa7a5a; background:rgba(170,122,90,0.08); border:1px solid rgba(170,122,90,0.2); }
.df-badge-bond { color:#8a6aaa; background:rgba(138,106,170,0.08); border:1px solid rgba(138,106,170,0.2); }
.df-badge-gov { color:#a3b07e; background:rgba(163,176,126,0.1); border:1px solid rgba(163,176,126,0.2); }
.df-badge-corp { color:#c8a832; background:rgba(200,168,50,0.08); border:1px solid rgba(200,168,50,0.2); }
.df-badge-nation { color:#8b9a6b; background:rgba(139,154,107,0.08); border:1px solid rgba(139,154,107,0.15); }
.df-risk-low { color:#5c5; }
.df-risk-moderate { color:#ca5; }
.df-risk-elevated { color:#c84; }
.df-risk-high { color:#c55; }
.df-metrics { display:flex; gap:0; background:#1c1c18; border:1px solid #2a2a24; }
.df-metrics > div { padding:4px 8px; }
.df-metrics > div + div { border-left:1px solid #2a2a24; }
.df-metrics__label { font-family:var(--font-mono); font-size:7px; color:#6a6660; letter-spacing:0.5px; }
.df-metrics__value { font-family:var(--font-mono); font-weight:700; margin-top:1px; }
.df-detail { background:#121210; border:1px solid #2a2a24; padding:5px 8px; margin-top:6px; }
.df-detail-row { display:flex; justify-content:space-between; padding:2px 0; }
.df-detail-row + .df-detail-row { border-top:1px solid #2a2a24; }
.df-detail-label { font-family:var(--font-mono); font-size:8px; color:#6a6660; }
.df-detail-value { font-family:var(--font-mono); font-size:9px; }
.df-footer { padding:8px 14px; border-top:1px solid #2a2a24; background:#1c1c18; flex-shrink:0; display:flex; justify-content:space-between; align-items:center; }
.df-footer__counts { display:flex; gap:10px; }
.df-footer__count { display:flex; align-items:center; gap:4px; }
.df-footer__count-dot { width:5px; height:5px; border-radius:1px; }
.df-footer__count-label { font-family:var(--font-mono); font-size:7px; color:#6a6660; }
.df-footer__count-num { font-family:var(--font-mono); font-size:8px; font-weight:700; color:#9e9a92; }
.df-review-btn { padding:4px 14px; font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:1px; border:1px solid #2a2a24; cursor:default; color:#6a6660; background:transparent; opacity:0.4; }
.df-review-btn.active { color:#000; background:#8b9a6b; border-color:#8b9a6b; cursor:pointer; opacity:1; }
.df-new-dot { position:absolute; left:4px; top:50%; transform:translateY(-50%); width:4px; height:4px; border-radius:50%; background:#c8a832; }

/* Content layout */
.ops-grid { display:flex; justify-content:center; gap:12px; align-items:flex-start; flex-wrap:wrap; }

@media (max-width: 768px) {
  .df-container { width:100%; max-height:none; }
}

/* Faction dropdown */
.corp-faction-dropdown { display:none; position:absolute; top:100%; right:0; background:var(--bg-3); border:1px solid var(--border-1); z-index:100; min-width:200px; margin-top:4px; }
.corp-faction-dropdown.open { display:block; }
.corp-faction-dropdown__item { display:flex; align-items:center; gap:8px; padding:8px 12px; cursor:pointer; font-family:var(--font-mono); font-size:10px; color:var(--text-primary); border-bottom:1px solid var(--border-0); }
.corp-faction-dropdown__item:hover { background:var(--bg-hover); }
.corp-faction-dropdown__item.active { color:var(--teal); background:rgba(90,175,165,0.05); }

/* Responsive */
@media (max-width: 768px) {
  .top-bar { padding:6px 10px; }
  .tick-info { gap:8px; }
  .corp-hamburger { display:block; }
  .corp-nav { display:none; flex-direction:column; height:auto; padding:0; }
  .corp-nav.nav-open { display:flex; }
  .corp-nav.nav-open .corp-nav__tab { padding:10px 22px; border-bottom:none; border-left:2px solid transparent; }
  .corp-nav.nav-open .corp-nav__tab.active { border-left-color:var(--text-bright); border-bottom:none; }
}
</style>
</head>
<body>
  <div class="top-bar">
    <div class="top-bar-left">
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="corp-logo" id="corp-logo"></div>
        <span class="corp-name-bar" id="corp-name-bar">Loading...</span>
      </div>
      <div class="top-bar-sep"></div>
      <div class="tick-info">
        <div class="tick-item">
          <div class="tick-label">Game Date</div>
          <div class="tick-value" id="game-date">--</div>
        </div>
        <div class="tick-item">
          <div class="tick-label">Tick</div>
          <div class="tick-value" id="tick-number">--</div>
        </div>
        <div class="tick-item">
          <div class="tick-label">Next Tick</div>
          <div class="tick-value" id="tick-countdown">--</div>
        </div>
      </div>
    </div>
    <div class="top-bar-version" style="font-family:var(--font-mono);font-size:8px;color:var(--text-dim);letter-spacing:0.5px;opacity:0.6;">Alpha 2.1.1.1</div>
    <div class="top-bar-right">
      <span class="topbar-cash" id="topbar-cash">CASH: --</span>
      <div class="faction-switcher" id="faction-switcher" style="position:relative;">
        <span class="corp-name-badge" id="corp-name-badge" onclick="toggleCorpDropdown()" style="cursor:pointer;">--</span>
        <div class="corp-faction-dropdown" id="corp-faction-dropdown"></div>
      </div>
      <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-toggle">Light</button>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <button class="corp-hamburger" onclick="document.querySelector('.corp-nav').classList.toggle('nav-open')">&#9776;</button>
  <nav class="corp-nav" id="corp-nav">
    <a href="corp-dashboard.html" class="corp-nav__tab" data-tab="home">Home</a>
    <a href="corp-operations-finance.html" class="corp-nav__tab active" data-tab="operations">Operations</a>
    <a href="corp-operations.html?tab=expansion" class="corp-nav__tab" data-tab="expansion">Expansion</a>
    <a href="#" class="corp-nav__tab" data-tab="industries" onclick="return false;" style="opacity:0.4;cursor:not-allowed;">Industries</a>
    <a href="#" class="corp-nav__tab" data-tab="innovation" onclick="return false;" style="opacity:0.4;cursor:not-allowed;">Innovation</a>
    <a href="#" class="corp-nav__tab" data-tab="lobbying" onclick="return false;" style="opacity:0.4;cursor:not-allowed;">Lobbying</a>
    <a href="news.html" class="corp-nav__tab" data-tab="news">News</a>
    <a href="wiki.html" class="corp-nav__tab" data-tab="wiki">Wiki</a>
  </nav>

  <div class="content">
    <div id="operations-content" class="ops-grid">
      <!-- Deal Flow Container -->
      <div class="df-container" id="df-container"></div>
    </div>
  </div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { escapeHtml, tickToDate } from './js/utils.js';

let allUserFactions = [];
let faction = null;
let nationStats = null;
let shard = null;

function fmtMoney(n) {
    if (Math.abs(n) >= 1_000_000) return '$' + (n / 1_000_000).toFixed(1) + 'M';
    if (Math.abs(n) >= 1000) return '$' + (n / 1000).toFixed(0) + 'k';
    return '$' + Math.round(n).toLocaleString();
}

// ==================== DEAL FLOW ====================

const DF_TYPE_META = {
    LOAN:   { class: 'loan',   label: 'LOAN' },
    INSURE: { class: 'insure', label: 'INSURE' },
    BOND:   { class: 'bond',   label: 'BOND' },
};
const DF_RISK_META = {
    LOW:      { class: 'df-risk-low',      label: 'LOW RISK' },
    MODERATE: { class: 'df-risk-moderate',  label: 'MODERATE' },
    ELEVATED: { class: 'df-risk-elevated',  label: 'ELEVATED' },
    HIGH:     { class: 'df-risk-high',      label: 'HIGH RISK' },
};

// Sample deal data — will be replaced with DB queries when deal system is wired
const SAMPLE_DEALS = [
    {
        type: 'LOAN', applicant: 'Salazar Construction', abbr: 'SZC', entity: 'CORP', nation: 'Melizea',
        amount: 18000000, purpose: 'Equipment acquisition — Heavy Infrastructure expansion. 2 Tower Cranes, 3 Heavy Haulers.',
        term: 24, reputation: 65, revenue: 47400000, debt: 22000000, risk: 'MODERATE', isNew: true,
    },
    {
        type: 'BOND', applicant: 'Republic of Melizea', abbr: 'MEL', entity: 'GOV', nation: 'Melizea',
        amount: 100000000, purpose: 'National Infrastructure Bond — Series 2013-B. Funding highway and rail expansion over 5 years.',
        term: 60, couponRate: 6.2, stability: 23, debtToGdp: 42, creditRating: 38, risk: 'ELEVATED', isNew: true,
    },
    {
        type: 'INSURE', applicant: 'Constructora del Sur', abbr: 'CDS', entity: 'CORP', nation: 'Melizea',
        amount: 12000000, purpose: 'Project liability insurance — San Maria Water Treatment Facility. Coverage for construction defects, delays, and third-party claims.',
        term: 18, reputation: 52, projectValue: 28500000, risk: 'MODERATE', isNew: false,
    },
    {
        type: 'LOAN', applicant: 'Torres & Vega Group', abbr: 'TVG', entity: 'CORP', nation: 'Melizea',
        amount: 5000000, purpose: 'Working capital — bridge financing to cover material procurement pending contract payment.',
        term: 6, reputation: 34, revenue: 14800000, debt: 2200000, risk: 'ELEVATED', isNew: false,
    },
    {
        type: 'INSURE', applicant: 'McKenna Construction', abbr: 'MKAV', entity: 'CORP', nation: 'Avelia',
        amount: 8000000, purpose: 'Fleet insurance — 32 units of construction equipment across all active project sites.',
        term: 12, reputation: 38, fleetValue: 16400000, risk: 'LOW', isNew: false,
    },
    {
        type: 'BOND', applicant: 'Republic of Sangreza', abbr: 'SNG', entity: 'GOV', nation: 'Sangreza',
        amount: 45000000, purpose: 'Emergency Fiscal Bond — Series 2013-A. Covering budget shortfall from commodity price collapse.',
        term: 36, couponRate: 9.8, stability: 44, debtToGdp: 68, creditRating: 24, risk: 'HIGH', isNew: true,
    },
];

let dfFilter = 'ALL';
let dfSelected = -1;

function dfSetFilter(type) {
    dfFilter = type;
    dfSelected = -1;
    renderDealFlow();
}

function dfSelectDeal(idx) {
    dfSelected = dfSelected === idx ? -1 : idx;
    renderDealFlow();
}

function renderDealFlow() {
    const container = document.getElementById('df-container');
    if (!container) return;

    const deals = dfFilter === 'ALL' ? SAMPLE_DEALS : SAMPLE_DEALS.filter(d => d.type === dfFilter);
    const newCount = SAMPLE_DEALS.filter(d => d.isNew).length;
    const totalCount = SAMPLE_DEALS.length;

    // Header
    let html = `<div class="df-header">
        <div class="df-header__left">
            <span class="df-header__dot">&#9679;</span>
            <span class="df-header__title">Deal Flow</span>
        </div>
        <div style="display:flex;gap:4px;align-items:center;">
            ${newCount > 0 ? `<span class="df-badge df-badge-corp" style="font-size:8px;">${newCount} NEW</span>` : ''}
            <span style="font-family:var(--font-mono);font-size:9px;color:#6a6660;">${totalCount} OPEN</span>
        </div>
    </div>`;

    // Filter bar
    const filters = [
        { id: 'ALL', label: 'All', activeClass: 'active-all' },
        { id: 'LOAN', label: 'Loans', activeClass: 'active-loan' },
        { id: 'INSURE', label: 'Insurance', activeClass: 'active-insure' },
        { id: 'BOND', label: 'Bonds', activeClass: 'active-bond' },
    ];
    html += '<div class="df-filters">';
    for (const f of filters) {
        html += `<span class="df-pill${dfFilter === f.id ? ' ' + f.activeClass : ''}" onclick="dfSetFilter('${f.id}')">${f.label}</span>`;
    }
    html += '</div>';

    // Deal list
    html += '<div class="df-list">';
    for (let i = 0; i < deals.length; i++) {
        const d = deals[i];
        const globalIdx = SAMPLE_DEALS.indexOf(d);
        const isSel = dfSelected === globalIdx;
        const tm = DF_TYPE_META[d.type];
        const rm = DF_RISK_META[d.risk];

        html += `<div class="df-deal${isSel ? ' sel-' + tm.class : ''}" onclick="dfSelectDeal(${globalIdx})">`;

        // New dot
        if (d.isNew) html += '<div class="df-new-dot"></div>';

        // Row 1: type badge + applicant + entity
        html += `<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;">
            <span class="df-badge df-badge-${tm.class}">${tm.label}</span>
            <span style="font-size:11px;font-weight:600;color:#e8e4dc;">${escapeHtml(d.applicant)}</span>
            <span class="df-badge df-badge-${d.entity.toLowerCase()}">${d.entity}</span>
        </div>`;

        // Row 2: nation + risk
        html += `<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;">
            <span class="df-badge df-badge-nation" style="line-height:12px;">${escapeHtml(d.nation.toUpperCase())}</span>
            <span class="df-badge ${rm.class}" style="font-weight:700;line-height:12px;background:currentColor;-webkit-background-clip:unset;padding:0 4px;">`;
        // Risk badge with colored background
        html += `</span>`;
        // Re-do risk badge properly
        html = html.slice(0, html.lastIndexOf('<span class="df-badge ' + rm.class));
        const riskColor = rm.class === 'df-risk-low' ? '#5c5' : rm.class === 'df-risk-moderate' ? '#ca5' : rm.class === 'df-risk-elevated' ? '#c84' : '#c55';
        html += `<span style="font-family:var(--font-mono);font-size:7px;font-weight:700;padding:0 4px;line-height:12px;color:${riskColor};background:${riskColor}12;border:1px solid ${riskColor}25;">${rm.label}</span>
        </div>`;

        // Row 3: metrics
        const amountLabel = d.type === 'BOND' ? 'FACE VALUE' : d.type === 'INSURE' ? 'COVERAGE' : 'AMOUNT';
        const qualLabel = d.type === 'BOND' ? 'COUPON' : 'REP';
        const qualValue = d.type === 'BOND' ? d.couponRate + '%' : (d.reputation || d.stability);
        const qualNum = d.type === 'BOND' ? d.couponRate * 10 : (d.reputation || d.stability);
        const qualColor = d.type === 'BOND' ? '#c8a832' : qualNum >= 60 ? '#5c5' : qualNum >= 35 ? '#ca5' : '#c84';

        html += `<div class="df-metrics">
            <div style="flex:1;">
                <div class="df-metrics__label">${amountLabel}</div>
                <div class="df-metrics__value" style="font-size:12px;color:#e8e4dc;">${fmtMoney(d.amount)}</div>
            </div>
            <div style="flex:0.7;text-align:center;">
                <div class="df-metrics__label">TERM</div>
                <div class="df-metrics__value" style="font-size:11px;color:#e8e4dc;">${d.term}mo</div>
            </div>
            <div style="flex:0.8;text-align:center;">
                <div class="df-metrics__label">${qualLabel}</div>
                <div class="df-metrics__value" style="font-size:11px;color:${qualColor};">${qualValue}</div>
            </div>
        </div>`;

        // Expanded detail
        if (isSel) {
            html += `<div style="margin-top:6px;font-size:10px;color:#9e9a92;line-height:1.5;margin-bottom:6px;">${escapeHtml(d.purpose)}</div>`;
            html += '<div class="df-detail">';

            if (d.type === 'LOAN') {
                const dtrPct = Math.round((d.debt / d.revenue) * 100);
                const dtrColor = dtrPct > 50 ? '#c84' : '#5c5';
                const debtColor = d.debt > d.revenue * 0.5 ? '#c84' : '#9e9a92';
                html += `<div class="df-detail-row"><span class="df-detail-label">ANNUAL REVENUE</span><span class="df-detail-value" style="color:#9e9a92;">${fmtMoney(d.revenue)}</span></div>`;
                html += `<div class="df-detail-row"><span class="df-detail-label">EXISTING DEBT</span><span class="df-detail-value" style="color:${debtColor};">${fmtMoney(d.debt)}</span></div>`;
                html += `<div class="df-detail-row"><span class="df-detail-label">DEBT/REVENUE</span><span class="df-detail-value" style="color:${dtrColor};font-weight:700;">${dtrPct}%</span></div>`;
            } else if (d.type === 'BOND') {
                const stabColor = d.stability >= 50 ? '#5c5' : d.stability >= 30 ? '#ca5' : '#c84';
                const dtgColor = d.debtToGdp > 60 ? '#c55' : d.debtToGdp > 40 ? '#c84' : '#5c5';
                const crColor = d.creditRating >= 60 ? '#5c5' : d.creditRating >= 35 ? '#ca5' : '#c55';
                html += `<div class="df-detail-row"><span class="df-detail-label">STABILITY</span><span class="df-detail-value" style="color:${stabColor};">${d.stability}/100</span></div>`;
                html += `<div class="df-detail-row"><span class="df-detail-label">DEBT/GDP</span><span class="df-detail-value" style="color:${dtgColor};">${d.debtToGdp}%</span></div>`;
                html += `<div class="df-detail-row"><span class="df-detail-label">CREDIT RATING</span><span class="df-detail-value" style="color:${crColor};font-weight:700;">${d.creditRating}/100</span></div>`;
            } else if (d.type === 'INSURE') {
                const repColor = d.reputation >= 60 ? '#5c5' : d.reputation >= 35 ? '#ca5' : '#c84';
                const assetLabel = d.projectValue ? 'PROJECT VALUE' : 'FLEET VALUE';
                const assetValue = d.projectValue || d.fleetValue;
                html += `<div class="df-detail-row"><span class="df-detail-label">REPUTATION</span><span class="df-detail-value" style="color:${repColor};">${d.reputation}/100</span></div>`;
                html += `<div class="df-detail-row"><span class="df-detail-label">${assetLabel}</span><span class="df-detail-value" style="color:#9e9a92;">${fmtMoney(assetValue)}</span></div>`;
            }

            html += '</div>';
        }

        html += '</div>'; // close df-deal
    }
    html += '</div>'; // close df-list

    // Footer
    const loanCount = SAMPLE_DEALS.filter(d => d.type === 'LOAN').length;
    const insureCount = SAMPLE_DEALS.filter(d => d.type === 'INSURE').length;
    const bondCount = SAMPLE_DEALS.filter(d => d.type === 'BOND').length;

    html += `<div class="df-footer">
        <div class="df-footer__counts">
            <div class="df-footer__count"><div class="df-footer__count-dot" style="background:#5a8aaa;"></div><span class="df-footer__count-label">LOAN</span><span class="df-footer__count-num">${loanCount}</span></div>
            <div class="df-footer__count"><div class="df-footer__count-dot" style="background:#aa7a5a;"></div><span class="df-footer__count-label">INSURE</span><span class="df-footer__count-num">${insureCount}</span></div>
            <div class="df-footer__count"><div class="df-footer__count-dot" style="background:#8a6aaa;"></div><span class="df-footer__count-label">BOND</span><span class="df-footer__count-num">${bondCount}</span></div>
        </div>
        <div class="df-review-btn${dfSelected >= 0 ? ' active' : ''}">REVIEW DEAL</div>
    </div>`;

    container.innerHTML = html;
}

window.dfSetFilter = dfSetFilter;
window.dfSelectDeal = dfSelectDeal;

async function init() {
    const { data: { user } } = await _supabase.auth.getUser();
    if (!user) { window.location.href = 'login.html'; return; }

    const { data: allFactions } = await _supabase
        .from('factions')
        .select('*')
        .or(`id.eq.${user.id},linked_user_id.eq.${user.id}`);

    allUserFactions = (allFactions || []).filter(f => f.nation_id);

    const activeFactionId = sessionStorage.getItem('active_faction_id');
    faction = allUserFactions.find(f => f.id === activeFactionId)
        || allUserFactions.find(f => f.faction_type === 'corporation')
        || allUserFactions[0];

    if (!faction) {
        await _supabase.auth.signOut();
        window.location.href = 'login.html';
        return;
    }

    if (faction.faction_type !== 'corporation') {
        window.location.href = 'dashboard.html';
        return;
    }

    // If this corp is NOT Finance, redirect to the correct operations page
    if (faction.corp_sector !== 'Finance') {
        window.location.href = 'corp-operations.html' + window.location.search;
        return;
    }

    sessionStorage.setItem('active_faction_id', faction.id);

    // Load nation + shard
    const [nationRes, shardRes] = await Promise.all([
        faction.nation_id
            ? _supabase.from('nations').select('*').eq('id', faction.nation_id).single()
            : Promise.resolve({ data: null }),
        _supabase.from('shard').select('current_tick, current_date, next_tick_at, tick_interval_hours').eq('name', 'Alpha Shard').single(),
    ]);

    if (nationRes.data) nationStats = nationRes.data;
    shard = shardRes.data;

    // Populate topbar
    document.getElementById('corp-name-bar').textContent = faction.faction_name || 'Corp';
    document.getElementById('corp-name-badge').textContent =
        (faction.abbreviation || faction.corp_ticker || faction.faction_name || '--').toUpperCase();
    document.getElementById('topbar-cash').textContent =
        'CASH: ' + fmtMoney(Number(faction.corp_cash_reserves) || 0);

    if (shard) {
        document.getElementById('game-date').textContent = shard.current_date || tickToDate(shard.current_tick);
        document.getElementById('tick-number').textContent = shard.current_tick || '--';
    }

    // Faction switcher
    renderFactionSwitcher();

    // Render Deal Flow container
    renderDealFlow();

    // Tick countdown
    if (shard?.next_tick_at) startCountdown(shard.next_tick_at);

}

function renderFactionSwitcher() {
    const dropdown = document.getElementById('corp-faction-dropdown');
    if (!dropdown || allUserFactions.length <= 1) return;
    let html = '';
    for (const f of allUserFactions) {
        const isActive = f.id === faction.id;
        const label = f.faction_type === 'corporation' ? 'CORP' : 'PARTY';
        html += `<div class="corp-faction-dropdown__item${isActive ? ' active' : ''}" onclick="switchFaction('${f.id}')">
            <span style="font-size:7px;padding:1px 4px;background:${f.faction_type === 'corporation' ? 'rgba(90,175,165,0.1)' : 'rgba(200,168,50,0.1)'};border:1px solid ${f.faction_type === 'corporation' ? 'var(--teal-border)' : 'rgba(200,168,50,0.2)'};color:${f.faction_type === 'corporation' ? 'var(--teal)' : 'var(--amber)'}">${label}</span>
            <span>${escapeHtml(f.faction_name || '--')}</span>
        </div>`;
    }
    dropdown.innerHTML = html;
}

function toggleCorpDropdown() {
    document.getElementById('corp-faction-dropdown').classList.toggle('open');
}

function switchFaction(factionId) {
    sessionStorage.setItem('active_faction_id', factionId);
    const f = allUserFactions.find(x => x.id === factionId);
    if (f && f.faction_type === 'party') {
        window.location.href = 'dashboard.html';
    } else {
        window.location.reload();
    }
}

function toggleTheme() {
    document.body.classList.toggle('light-mode');
    const isLight = document.body.classList.contains('light-mode');
    localStorage.setItem('theme', isLight ? 'light' : 'dark');
    document.getElementById('theme-toggle').textContent = isLight ? 'Dark' : 'Light';
}

async function doLogout() {
    await _supabase.auth.signOut();
    window.location.href = 'login.html';
}

function startCountdown(nextTickAt) {
    const el = document.getElementById('tick-countdown');
    function update() {
        const diff = new Date(nextTickAt) - new Date();
        if (diff <= 0) { el.textContent = 'Processing...'; return; }
        const h = Math.floor(diff / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        el.textContent = `${h}h ${m}m ${s}s`;
    }
    update();
    setInterval(update, 1000);
}

// Theme on load
if (localStorage.getItem('theme') === 'light') {
    document.body.classList.add('light-mode');
    document.getElementById('theme-toggle').textContent = 'Dark';
}

window.toggleCorpDropdown = toggleCorpDropdown;
window.switchFaction = switchFaction;
window.toggleTheme = toggleTheme;
window.doLogout = doLogout;

init();
</script>
</body>
</html>
