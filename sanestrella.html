// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════

var nation = null;
var profile = null;
var originalProfile = null;
var allNations = [];
var totalNations = 0;
var previousTickData = null;
var parties = [];
var factions = [];
var relations = [];

var editMode = false;

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════

initPage('sanestrella', async function(state) {
    try {
        await loadAllData(state);
        renderPage();
    } catch (err) {
        console.error('Error loading San Estrella:', err);
        document.getElementById('content-area').innerHTML =
            '<div class="se-loading">Error loading San Estrella: ' + escapeHtml(err.message) + '</div>';
    }
}, false);

// ═══════════════════════════════════════════════════════════════
// DATA LOADING
// ═══════════════════════════════════════════════════════════════

async function loadAllData(state) {
    // 1. Fetch San Estrella nation
    var nationRes = await _supabase.from('nations').select('*').eq('name', NATION_NAME).single();
    if (nationRes.error) throw nationRes.error;
    nation = nationRes.data;

    // Fix placeholder government_type
    if (!nation.government_type || nation.government_type.toLowerCase().includes('your_gov_here')) {
        nation.government_type = 'Presidential';
    }

    // 2. Parallel fetches
    var results = await Promise.all([
        loadProfile(nation.id),
        loadAllNations(),
        loadPreviousTickData(nation.id),
        loadParties(nation.id),
        loadRelations(nation.id)
    ]);

    profile = results[0];
    originalProfile = JSON.parse(JSON.stringify(profile));

    // 3. Check edit permission
    if (state.faction && state.faction.nation_id === nation.id) {
        canEdit = true;
    }
}

async function loadProfile(nationId) {
    var cacheKey = 'nation_profile_' + nationId;
    var cached = qCache(cacheKey);
    if (cached) return cached;

    var res = await _supabase.from('nation_profiles').select('*').eq('nation_id', nationId).limit(1);
    var data = (res.data && res.data.length > 0) ? res.data[0] : getDefaultProfile(nationId);
    qCacheSet(cacheKey, data, 2 * 60 * 1000);
    return data;
}

function getDefaultProfile(nationId) {
    return {
        nation_id: nationId,
        flag_image_url: null,
        demonym: 'Estrellan',
        motto: '"Por la tierra y su gente" \u2014 For the land and its people',
        anthem: 'Himno de las Estrellas',
        founded_text: 'Independence: March 14, 1847',
        currency_name: 'Estrellan Peso (\u20B1)',
        languages: 'Spanish (official), Estrellano Creole (regional)',
        religion: 'Mixed \u2014 Catholic 42%, Evangelical 18%, Secular 31%, Other 9%',
        calling_code: '+58',
        driving_side: 'Right',
        region: 'Southern Coast',
        area_text: '187,400 km\u00B2',
        coastline_text: '640 km',
        borders_text: 'Montequilla (north), Sangreza (east)',
        terrain_text: 'Coastal lowlands, central plateau, western highlands',
        climate_text: 'Tropical maritime, hurricane season June\u2013November',
        overview_text: '',
        history_entries: []
    };
}

async function loadAllNations() {
    var cached = qCache('all_nations');
    if (cached) { allNations = cached; totalNations = cached.length; return; }
    var res = await _supabase.from('nations').select('*');
    if (!res.error && res.data) {
        allNations = res.data;
        totalNations = res.data.length;
        qCacheSet('all_nations', res.data, 2 * 60 * 1000);
    }
}

async function loadPreviousTickData(nationId) {
    var cacheKey = 'prev_tick_' + nationId;
    var cached = qCache(cacheKey);
    if (cached) { previousTickData = cached; return; }

    var shardRes = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    if (!shardRes.data) return;

    var previousTick = shardRes.data.current_tick - 1;
    if (previousTick < 0) return;

    var histRes = await _supabase.from('nations_history').select('*')
        .eq('nation_id', nationId).eq('tick', previousTick).limit(1);
    if (histRes.data && histRes.data.length > 0) {
        previousTickData = histRes.data[0];
        qCacheSet(cacheKey, histRes.data[0], 5 * 60 * 1000);
        return;
    }

    // Fallback: most recent history row
    var fbRes = await _supabase.from('nations_history').select('*')
        .eq('nation_id', nationId).lt('tick', shardRes.data.current_tick)
        .order('tick', { ascending: false }).limit(1);
    if (fbRes.data && fbRes.data.length > 0) {
        previousTickData = fbRes.data[0];
        qCacheSet(cacheKey, fbRes.data[0], 5 * 60 * 1000);
    }
}

async function loadParties(nationId) {
    var results = await Promise.all([
        _supabase.from('parties').select('*').eq('nation_id', nationId).order('seats', { ascending: false }),
        _supabase.from('factions').select('*').eq('nation_id', nationId).eq('faction_type', 'party')
    ]);
    parties = results[0].data || [];
    factions = results[1].data || [];
}

async function loadRelations(nationId) {
    var res = await _supabase.from('diplomatic_relations').select('*')
        .or('nation_a_id.eq.' + nationId + ',nation_b_id.eq.' + nationId);
    relations = res.data || [];
}

// ═══════════════════════════════════════════════════════════════
// STAT HELPERS
// ═══════════════════════════════════════════════════════════════

function getStatValue(stat) {
    if (stat.computed === 'gdp_per_capita') {
        return nation.population > 0 ? scaleRawToDollars(nation.gdp) / nation.population : 0;
    }
    if (stat.computed === 'debt_to_gdp') {
        return nation.gdp > 0 ? (nation.debt / nation.gdp * 100) : 0;
    }
    return nation[stat.key];
}

function formatStatValue(value, stat) {
    if (value === null || value === undefined) return 'N/A';
    if (stat.format === 'gdp') return formatCurrencyShort(scaleRawToDollars(value));
    if (stat.format === 'currency') return formatCurrencyShort(scaleRawToDollars(value));
    if (stat.format === 'currency_raw') return '$' + Math.round(value).toLocaleString();
    if (stat.format === 'number') return formatNumber(value);
    var num = Math.round(value * 10) / 10;
    return num + (stat.suffix || '');
}

function isStatInverted(stat) {
    if (stat.inverted !== undefined) return stat.inverted;
    return stat.key ? INVERTED_SET.has(stat.key) : false;
}

function getTrendArrow(key, currentValue, inverted, format) {
    if (!previousTickData || currentValue === null || currentValue === undefined || !key) {
        return '<span class="se-stat-trend neutral">\u2014</span>';
    }
    var prev = previousTickData[key];
    if (prev === null || prev === undefined) {
        return '<span class="se-stat-trend neutral">\u2014</span>';
    }
    var delta = currentValue - prev;
    var invertedClass = inverted ? ' inverted' : '';
    if (delta > 0) {
        var formatted = (format === 'currency' || format === 'gdp')
            ? '+' + formatCurrencyShort(scaleRawToDollars(delta))
            : '+' + roundDelta(delta);
        return '<span class="se-stat-trend up' + invertedClass + '">\u25B2 ' + formatted + '</span>';
    }
    if (delta < 0) {
        var formatted = (format === 'currency' || format === 'gdp')
            ? formatCurrencyShort(scaleRawToDollars(delta))
            : roundDelta(delta);
        return '<span class="se-stat-trend down' + invertedClass + '">\u25BC ' + formatted + '</span>';
    }
    return '<span class="se-stat-trend neutral">\u2014</span>';
}

function roundDelta(val) {
    return Math.abs(val) >= 1 ? Math.round(val).toString() : val.toFixed(1);
}

function calculateRanking(key, value, inverted) {
    if (value === null || value === undefined || !key) return null;
    var values = allNations.map(function(n) { return n[key]; }).filter(function(v) { return v !== null && v !== undefined; });
    if (values.length === 0) return null;
    var sorted = values.slice().sort(function(a, b) { return inverted ? a - b : b - a; });
    return (sorted.indexOf(value) + 1) + '/' + values.length;
}

function getRelationTier(score) {
    if (score >= 90) return { label: 'Allied', css: 'friendly' };
    if (score >= 70) return { label: 'Friendly', css: 'friendly' };
    if (score >= 50) return { label: 'Warm', css: 'friendly' };
    if (score >= 35) return { label: 'Neutral', css: 'neutral' };
    if (score >= 20) return { label: 'Cold', css: 'cool' };
    if (score >= 5)  return { label: 'Hostile', css: 'cool' };
    return { label: 'Adversarial', css: 'cool' };
}

// ═══════════════════════════════════════════════════════════════
// RENDERING
// ═══════════════════════════════════════════════════════════════

function renderPage() {
    var h = '<div class="se-page">';

    // Header
    h += renderHeader();

    // 3-column layout
    h += '<div class="se-layout">';
    h += renderTOC();
    h += '<div class="se-main">';
    h += renderOverview();
    h += renderGovernment();
    h += renderHistory();
    for (var i = 0; i < STAT_SECTIONS.length; i++) {
        h += renderStatSection(STAT_SECTIONS[i]);
    }
    h += renderRelations();
    h += '</div>';
    h += renderSidebar();
    h += '</div>';

    h += '</div>';
    document.getElementById('content-area').innerHTML = h;

    // Attach event listeners after rendering
    attachEventListeners();
}

function renderHeader() {
    var approval = nation.national_approval || 50;
    var approvalClass = approval >= 55 ? 'good' : approval >= 45 ? 'mid' : 'bad';
    var govType = isPresidentialRepublic(nation) ? 'Presidential Republic' : getCanonicalGovernmentType(nation);
    var motto = profile.motto || '';

    var h = '<div class="se-header">';
    h += '<div class="se-header-left">';
    h += '<div class="se-header-label">NATION PROFILE</div>';
    h += '<h1>' + escapeHtml(nation.name) + '</h1>';
    h += '<div class="se-header-motto" id="se-motto">' + escapeHtml(motto) + '</div>';
    if (canEdit) {
        h += '<button class="se-edit-toggle" id="se-edit-toggle" onclick="window._seToggleEdit()">EDIT PROFILE</button>';
    }
    h += '</div>';
    h += '<div class="se-header-right">';
    h += '<div class="se-approval-label">NATIONAL APPROVAL</div>';
    h += '<div class="se-approval-value ' + approvalClass + '">' + approval + '%</div>';
    h += '<div class="se-gov-type">' + escapeHtml(govType) + '</div>';
    h += '</div>';
    h += '</div>';
    return h;
}

function renderTOC() {
    var items = ['Overview', 'Government', 'History'];
    for (var i = 0; i < STAT_SECTIONS.length; i++) {
        items.push(STAT_SECTIONS[i].title);
    }
    items.push('Relations');

    var h = '<div class="se-toc">';
    h += '<div class="se-toc-title">CONTENTS</div>';
    for (var i = 0; i < items.length; i++) {
        var id = items[i].toLowerCase().replace(/[^a-z]/g, '');
        h += '<div class="se-toc-item" onclick="document.getElementById(\'section-' + id + '\')?.scrollIntoView({behavior:\'smooth\',block:\'start\'})">' + escapeHtml(items[i]) + '</div>';
    }
    h += '</div>';
    return h;
}

function renderOverview() {
    var text = profile.overview_text || 'No overview has been written for this nation yet.';
    var firstChar = text.charAt(0);
    var restText = text.substring(1);

    var h = '<div id="section-overview" class="se-overview">';
    h += '<div class="se-overview-text" id="se-overview-text">';
    h += '<span class="drop-cap">' + escapeHtml(firstChar) + '</span>';
    h += escapeHtml(restText);
    h += '</div>';
    h += '</div>';
    return h;
}

function renderGovernment() {
    var allParties = parties.map(function(p) {
        return { name: p.name, seats: p.seats || 0, color: p.color || '#60a5fa', governing: p.governing || false, ideology: p.ideology || '', leader: p.leader_name || '', isPlayer: false };
    }).concat(factions.map(function(f) {
        return { name: f.faction_name, seats: f.seats || 0, color: f.color || '#60a5fa', governing: f.in_government || false, ideology: '', leader: '', isPlayer: true };
    }));
    allParties.sort(function(a, b) { return b.seats - a.seats; });

    var totalSeats = 0;
    var govSeats = 0;
    for (var i = 0; i < allParties.length; i++) {
        totalSeats += allParties[i].seats;
        if (allParties[i].governing) govSeats += allParties[i].seats;
    }
    if (totalSeats === 0) totalSeats = 1;

    var h = '<div id="section-government" class="se-gov">';
    h += '<div class="se-section-header"><span class="icon">\u{1F3DB}\uFE0F</span><span class="title">GOVERNMENT & POLITICS</span></div>';

    // Seat bar
    h += '<div style="margin:14px 0">';
    h += '<div class="se-seat-bar-label">NATIONAL ASSEMBLY \u2014 ' + totalSeats + ' SEATS';
    h += '<span class="coalition">Coalition: ' + govSeats + '</span>';
    h += '<span class="opposition">Opposition: ' + (totalSeats - govSeats) + '</span>';
    h += '</div>';
    h += '<div class="se-seat-bar">';
    for (var i = 0; i < allParties.length; i++) {
        var p = allParties[i];
        var w = (p.seats / totalSeats * 100);
        h += '<div style="width:' + w + '%;background:' + escapeAttr(p.color) + ';opacity:' + (p.governing ? '1' : '0.5') + '"></div>';
    }
    h += '</div></div>';

    // Party cards
    h += '<div class="se-party-grid">';
    for (var i = 0; i < allParties.length; i++) {
        var p = allParties[i];
        h += '<div class="se-party-card' + (p.governing ? ' governing' : '') + '" style="border-left-color:' + escapeAttr(p.color) + '">';
        h += '<div class="se-party-card-header">';
        h += '<span class="se-party-card-name">' + escapeHtml(p.name) + (p.isPlayer ? ' (Player)' : '') + '</span>';
        h += '<span class="se-party-card-seats" style="color:' + escapeAttr(p.color) + '">' + p.seats + '</span>';
        h += '</div>';
        h += '<div class="se-party-card-meta">';
        h += '<span>' + escapeHtml(p.ideology) + '</span>';
        h += '<span>' + escapeHtml(p.leader) + '</span>';
        h += '</div>';
        if (p.governing) {
            h += '<div class="se-party-card-tag">GOVERNING COALITION</div>';
        }
        h += '</div>';
    }
    h += '</div>';
    h += '</div>';
    return h;
}

function renderHistory() {
    var entries = profile.history_entries || [];

    var h = '<div id="section-history" class="se-history">';
    h += '<div class="se-section-header"><span class="icon">\u{1F4DC}</span><span class="title">HISTORY</span></div>';
    h += '<div class="se-history-list" id="se-history-list">';

    if (entries.length === 0) {
        h += '<div style="font-family:var(--se-serif);font-size:12px;color:var(--se-dim);padding:12px 0;">No history entries yet.</div>';
    } else {
        for (var i = 0; i < entries.length; i++) {
            h += '<div class="se-history-item">';
            h += '<span class="se-history-year">' + escapeHtml(entries[i].year || '') + '</span>';
            h += '<span class="se-history-event">' + escapeHtml(entries[i].event || '') + '</span>';
            h += '</div>';
        }
    }

    h += '</div></div>';
    return h;
}

function renderStatSection(section) {
    var h = '<div id="section-' + section.id + '" class="se-stat-section">';
    h += '<div class="se-section-header"><span class="icon">' + section.icon + '</span><span class="title">' + section.title.toUpperCase() + '</span></div>';
    h += '<div style="padding:6px 0">';

    // Column headers
    h += '<div class="se-stat-columns">';
    h += '<span class="se-stat-col-header se-stat-col-value">VALUE</span>';
    h += '<span class="se-stat-col-header se-stat-col-trend">TREND</span>';
    h += '<span class="se-stat-col-header se-stat-col-rank">RANK</span>';
    h += '</div>';

    // Stat rows
    for (var i = 0; i < section.stats.length; i++) {
        h += renderStatRow(section.stats[i]);
    }

    h += '</div></div>';
    return h;
}

function renderStatRow(stat) {
    var value = getStatValue(stat);
    var inverted = isStatInverted(stat);
    var formatted = formatStatValue(value, stat);
    var trend = stat.key ? getTrendArrow(stat.key, nation[stat.key], inverted, stat.format) : '<span class="se-stat-trend neutral">\u2014</span>';
    var rank = stat.key ? calculateRanking(stat.key, nation[stat.key], inverted) : '\u2014';

    // Alert styling for very bad stats
    var alertClass = '';
    if (stat.key && value !== null && value !== undefined) {
        var numVal = Number(value);
        if (inverted && numVal > 40) alertClass = ' alert';
        else if (!inverted && numVal < 30) alertClass = ' alert';
    }

    var h = '<div class="se-stat-row">';
    h += '<span class="se-stat-name' + alertClass + '">' + escapeHtml(stat.name) + '</span>';
    h += '<span class="se-stat-value">' + formatted + '</span>';
    h += trend;
    h += '<span class="se-stat-rank">' + (rank || '\u2014') + '</span>';
    h += '</div>';
    return h;
}

function renderRelations() {
    if (relations.length === 0) return '';

    var h = '<div id="section-relations" class="se-relations">';
    h += '<div class="se-section-header"><span class="icon">\u{1F91D}</span><span class="title">BILATERAL RELATIONS</span></div>';
    h += '<div style="padding:10px 0">';

    for (var i = 0; i < relations.length; i++) {
        var rel = relations[i];
        var otherNationId = rel.nation_a_id === nation.id ? rel.nation_b_id : rel.nation_a_id;
        var otherNation = allNations.find(function(n) { return n.id === otherNationId; });
        if (!otherNation) continue;

        var score = rel.relation_score || 35;
        var tier = getRelationTier(score);

        h += '<div class="se-relation-card ' + tier.css + '">';
        h += '<div class="se-relation-header">';
        h += '<span class="se-relation-name">' + escapeHtml(otherNation.name) + '</span>';
        h += '<div class="se-relation-right">';
        h += '<span class="se-relation-tag ' + tier.css + '">' + tier.label.toUpperCase() + '</span>';
        h += '<span class="se-relation-score">' + score + '</span>';
        h += '</div></div>';
        h += '<div class="se-relation-trade">Relation Type: ' + escapeHtml(rel.relation_type || 'neutral') + '</div>';
        h += '</div>';
    }

    h += '</div></div>';
    return h;
}

function renderSidebar() {
    var p = profile;
    var gdpDollars = scaleRawToDollars(nation.gdp);
    var gdpPerCapita = nation.population > 0 ? gdpDollars / nation.population : 0;
    var debtToGdp = nation.gdp > 0 ? (nation.debt / nation.gdp * 100).toFixed(1) : 0;
    var govType = isPresidentialRepublic(nation) ? 'Presidential Republic' : getCanonicalGovernmentType(nation);

    var h = '<div class="se-sidebar"><div class="se-infobox">';

    // Flag area
    h += '<div class="se-flag-area' + (editMode ? ' editable' : '') + '" id="se-flag-area">';
    h += '<div class="se-flag-pattern"></div>';
    if (p.flag_image_url) {
        h += '<img src="' + escapeAttr(p.flag_image_url) + '" alt="Flag of ' + escapeAttr(nation.name) + '">';
    } else {
        h += '<div class="se-flag-placeholder">\u{1F1F8} \u{1F1EA}</div>';
    }
    if (editMode) {
        h += '<div class="se-flag-overlay" onclick="window._seEditFlag()">Click to set flag image</div>';
    }
    h += '<div class="se-flag-url-input' + (editMode ? '' : '') + '" id="se-flag-input">';
    h += '<input type="text" placeholder="Enter image URL..." value="' + escapeAttr(p.flag_image_url || '') + '" id="se-flag-url">';
    h += '</div>';
    h += '</div>';

    // Infobox body
    h += '<div class="se-infobox-body">';
    h += '<div class="se-infobox-title">Republic of ' + escapeHtml(nation.name) + '</div>';
    h += '<div class="se-infobox-motto">' + escapeHtml(p.motto || '') + '</div>';
    h += '<div class="se-infobox-divider"></div>';

    // Auto-generated info rows
    h += infoRow('Capital', nation.capital || '\u2014');
    h += infoRow('Government', govType);
    h += infoRow('Legislature', (nation.legislature_name || 'National Assembly') + ' (' + (nation.legislature_seats || 120) + ')');
    h += '<div class="se-infobox-divider"></div>';

    h += infoRow('Population', formatNumber(nation.population));
    h += infoRow('GDP', formatCurrencyShort(gdpDollars), 'gold');
    h += infoRow('GDP Per Capita', '$' + Math.round(gdpPerCapita).toLocaleString());
    h += infoRow('Debt-to-GDP', debtToGdp + '%', Number(debtToGdp) > 80 ? 'bad' : '');

    // Editable info rows
    h += '<div class="se-infobox-divider"></div>';
    h += editableInfoRow('Currency', 'currency_name', p.currency_name);
    h += editableInfoRow('Languages', 'languages', p.languages);
    h += editableInfoRow('Religion', 'religion', p.religion);
    h += '<div class="se-infobox-divider"></div>';

    h += editableInfoRow('Founded', 'founded_text', p.founded_text);
    h += editableInfoRow('Anthem', 'anthem', p.anthem);
    h += editableInfoRow('Calling Code', 'calling_code', p.calling_code);
    h += editableInfoRow('Drives on', 'driving_side', p.driving_side);
    h += '<div class="se-infobox-divider"></div>';

    h += editableInfoRow('Area', 'area_text', p.area_text);
    h += editableInfoRow('Coastline', 'coastline_text', p.coastline_text);
    h += editableInfoRow('Borders', 'borders_text', p.borders_text);
    h += editableInfoRow('Terrain', 'terrain_text', p.terrain_text);
    h += editableInfoRow('Climate', 'climate_text', p.climate_text);
    h += editableInfoRow('Region', 'region', p.region);
    h += '<div class="se-infobox-divider"></div>';

    h += infoRow('Median Age', (nation.median_age || 0) + ' years');
    h += infoRow('Life Expectancy', (nation.lifespan || 0) + ' years');
    h += infoRow('Literacy', (nation.literacy || 0) + '%');

    // Key indicators
    h += '<div class="se-indicators">';
    h += '<div class="se-indicators-title">KEY INDICATORS</div>';
    h += indicatorBar('Stability', nation.stability || 0, '#22c55e');
    h += indicatorBar('Freedom', nation.freedom_index || 0, '#60a5fa');
    h += indicatorBar('Corruption', nation.corruption || 0, '#f97316');
    h += indicatorBar('Happiness', nation.happiness || 0, '#facc15');
    h += indicatorBar('Reputation', nation.international_reputation || 0, '#c084fc');
    h += '</div>';

    h += '</div></div></div>';
    return h;
}

function infoRow(label, value, colorClass) {
    return '<div class="se-info-row"><span class="se-info-label">' + escapeHtml(label) + '</span><span class="se-info-value' + (colorClass ? ' ' + colorClass : '') + '">' + escapeHtml(String(value)) + '</span></div>';
}

function editableInfoRow(label, fieldKey, value) {
    if (editMode) {
        return '<div class="se-info-row"><span class="se-info-label">' + escapeHtml(label) + '</span><span class="se-info-value"><input type="text" data-field="' + escapeAttr(fieldKey) + '" value="' + escapeAttr(value || '') + '"></span></div>';
    }
    return infoRow(label, value || '\u2014');
}

function indicatorBar(label, value, color) {
    var h = '<div class="se-indicator">';
    h += '<span class="se-indicator-label">' + escapeHtml(label) + '</span>';
    h += '<div class="se-indicator-bar"><div class="se-indicator-fill" style="width:' + Math.min(value, 100) + '%;background:' + color + '"></div></div>';
    h += '<span class="se-indicator-value">' + Math.round(value) + '</span>';
    h += '</div>';
    return h;
}

// ═══════════════════════════════════════════════════════════════
// EDIT MODE
// ═══════════════════════════════════════════════════════════════

function toggleEditMode() {
    editMode = !editMode;
    if (!editMode) {
        // Revert to original profile on cancel
        profile = JSON.parse(JSON.stringify(originalProfile));
    }
    renderPage();
}

function editFlag() {
    var input = document.getElementById('se-flag-input');
    if (input) {
        input.classList.toggle('visible');
    }
}

function enterOverviewEdit() {
    var el = document.getElementById('se-overview-text');
    if (!el) return;
    var text = profile.overview_text || '';
    el.innerHTML = '<textarea id="se-overview-textarea" style="width:100%;min-height:200px;font-family:var(--se-serif);font-size:13px;line-height:1.75;color:#c4c2b8;background:rgba(255,255,255,0.04);border:1px solid rgba(250,204,21,0.25);border-radius:3px;padding:12px;resize:vertical;outline:none;box-sizing:border-box;">' + escapeHtml(text) + '</textarea>';
}

function enterHistoryEdit() {
    var el = document.getElementById('se-history-list');
    if (!el) return;
    var entries = profile.history_entries || [];
    var h = '';
    for (var i = 0; i < entries.length; i++) {
        h += '<div class="se-history-edit-row">';
        h += '<input class="year" type="text" value="' + escapeAttr(entries[i].year || '') + '" placeholder="Year" data-idx="' + i + '" data-field="year">';
        h += '<input class="event" type="text" value="' + escapeAttr(entries[i].event || '') + '" placeholder="Event description" data-idx="' + i + '" data-field="event">';
        h += '<button class="remove-btn" onclick="window._seRemoveHistory(' + i + ')">x</button>';
        h += '</div>';
    }
    h += '<button class="se-add-history-btn" onclick="window._seAddHistory()">+ Add Entry</button>';
    el.innerHTML = h;
}

function addHistoryEntry() {
    if (!profile.history_entries) profile.history_entries = [];
    profile.history_entries.push({ year: '', event: '' });
    enterHistoryEdit();
}

function removeHistoryEntry(idx) {
    if (!profile.history_entries) return;
    profile.history_entries.splice(idx, 1);
    enterHistoryEdit();
}

async function saveProfile() {
    // Collect editable field values from inputs
    var inputs = document.querySelectorAll('[data-field]');
    for (var i = 0; i < inputs.length; i++) {
        var field = inputs[i].getAttribute('data-field');
        // History entries are handled separately
        if (field === 'year' || field === 'event') {
            var idx = parseInt(inputs[i].getAttribute('data-idx'));
            if (!profile.history_entries[idx]) profile.history_entries[idx] = {};
            profile.history_entries[idx][field] = inputs[i].value;
        } else {
            profile[field] = inputs[i].value;
        }
    }

    // Overview textarea
    var ta = document.getElementById('se-overview-textarea');
    if (ta) {
        profile.overview_text = ta.value;
    }

    // Flag URL
    var flagInput = document.getElementById('se-flag-url');
    if (flagInput) {
        profile.flag_image_url = flagInput.value || null;
    }

    // Motto
    var mottoInput = document.querySelector('[data-field="motto"]');
    if (mottoInput) {
        profile.motto = mottoInput.value;
    }

    // Build upsert payload
    var payload = {
        nation_id: nation.id,
        flag_image_url: profile.flag_image_url,
        demonym: profile.demonym,
        motto: profile.motto,
        anthem: profile.anthem,
        founded_text: profile.founded_text,
        currency_name: profile.currency_name,
        languages: profile.languages,
        religion: profile.religion,
        calling_code: profile.calling_code,
        driving_side: profile.driving_side,
        region: profile.region,
        area_text: profile.area_text,
        coastline_text: profile.coastline_text,
        borders_text: profile.borders_text,
        terrain_text: profile.terrain_text,
        climate_text: profile.climate_text,
        overview_text: profile.overview_text,
        history_entries: profile.history_entries || [],
        updated_at: new Date().toISOString()
    };

    // Include id if we have one (update), omit for insert
    if (profile.id) {
        payload.id = profile.id;
    }

    var res = await _supabase.from('nation_profiles').upsert(payload, { onConflict: 'nation_id' });
    if (res.error) {
        alert('Error saving profile: ' + res.error.message);
        return;
    }

    // Bust cache and reload
    qCacheSet('nation_profile_' + nation.id, null, 0);
    originalProfile = JSON.parse(JSON.stringify(profile));
    editMode = false;
    renderPage();
}

// ═══════════════════════════════════════════════════════════════
// EVENT LISTENERS
// ═══════════════════════════════════════════════════════════════

function attachEventListeners() {
    if (!editMode || !canEdit) return;

    // Show edit controls for overview
    var overviewEl = document.getElementById('se-overview-text');
    if (overviewEl && editMode) {
        enterOverviewEdit();
    }

    // Show edit controls for history
    if (editMode) {
        enterHistoryEdit();
    }

    // Show flag URL input
    var flagInput = document.getElementById('se-flag-input');
    if (flagInput && editMode) {
        flagInput.classList.add('visible');
    }

    // Show save/cancel bar
    if (editMode) {
        var header = document.querySelector('.se-header');
        if (header) {
            var bar = document.createElement('div');
            bar.className = 'se-edit-bar';
            bar.innerHTML = '<span class="label">EDITING PROFILE</span>' +
                '<button class="se-cancel-btn" onclick="window._seToggleEdit()">Cancel</button>' +
                '<button class="se-save-btn" onclick="window._seSaveProfile()">Save Changes</button>';
            header.after(bar);
        }
    }

    // Add motto edit in header
    if (editMode) {
        var mottoEl = document.getElementById('se-motto');
        if (mottoEl) {
            mottoEl.innerHTML = '<input type="text" data-field="motto" value="' + escapeAttr(profile.motto || '') + '" style="background:rgba(255,255,255,0.04);border:1px solid rgba(250,204,21,0.25);color:var(--se-text);font-family:var(--se-serif);font-size:13px;font-style:italic;padding:4px 8px;border-radius:3px;outline:none;width:100%;box-sizing:border-box;">';
        }
    }

    // Toggle button active state
    var toggleBtn = document.getElementById('se-edit-toggle');
    if (toggleBtn && editMode) {
        toggleBtn.classList.add('active');
        toggleBtn.textContent = 'CANCEL EDITING';
    }
}

// ═══════════════════════════════════════════════════════════════
// GLOBAL HANDLERS
// ═══════════════════════════════════════════════════════════════

window._seToggleEdit = toggleEditMode;
window._seEditFlag = editFlag;
window._seAddHistory = addHistoryEntry;
window._seRemoveHistory = removeHistoryEntry;
window._seSaveProfile = saveProfile;

</script>
