<script src="js/supabase-client.js"></script>

<!-- Page-Specific Script -->
<script>
/**
 * World Page
 * Displays the world map and nation intel
 */

let userFaction = null;

// Initialize page
initPage('world', async (state) => {
    userFaction = state.faction;
    setupWorldMap();
}, false);

/**
 * Setup click handlers for the world map
 */
function setupWorldMap() {
    document.querySelectorAll('.land').forEach(path => {
        path.addEventListener('click', async (e) => {
            e.stopPropagation();
            
            document.querySelectorAll('.land').forEach(l => l.classList.remove('selected-nation'));
            e.target.classList.add('selected-nation');
            
            const name = e.target.getAttribute('data-nation-name');
            const sidebar = document.getElementById('world-intel');
            sidebar.innerHTML = '<p style="color:#888;font-style:italic;">Loading ' + name + '…</p>';
            
            try {
                const { data: nation, error } = await _supabase
                    .from('nations')
                    .select('*')
                    .eq('name', name)
                    .single();
                
                if (error || !nation) {
                    sidebar.innerHTML = '<p style="color:#f44;">Nation not found.</p>';
                    return;
                }
                
                renderNationIntel(nation);
            } catch (e) {
                console.error('Error loading nation:', e);
                sidebar.innerHTML = '<p style="color:#f44;">Error loading data.</p>';
            }
        });
    });
}

/**
 * Render nation intel in the sidebar
 */
async function renderNationIntel(nation) {
    const sidebar = document.getElementById('world-intel');
    
    // Fetch current party count
    const { count: partyCount } = await _supabase
        .from('factions')
        .select('*', { count: 'exact', head: true })
        .eq('nation_id', nation.id)
        .eq('faction_type', 'party')
        .eq('is_npc', false);

    // Fetch party details
    const { data: parties } = await _supabase
        .from('factions')
        .select('id, faction_name, abbreviation, seats, approval_rating, is_npc')
        .eq('nation_id', nation.id)
        .eq('faction_type', 'party')
        .order('seats', { ascending: false });
    
    const maxParties = nation.max_parties || (nation.government_type === 'Autocracy' ? 4 : 8);
    const spotsRemaining = maxParties - (partyCount || 0);
    const isFull = spotsRemaining <= 0;
    
    const baseDescription = generateBaseDescription(nation);
    const statDescriptions = generateStatDescriptions(nation);
    
    const flagUrls = {
        'Melizea': 'https://raw.githubusercontent.com/TherranT11/nationhood/main/assets/flags/Melizea.png',
        'Avelia': 'https://raw.githubusercontent.com/TherranT11/nationhood/main/assets/flags/Avelia.png',
        'Sangreza': 'https://raw.githubusercontent.com/TherranT11/nationhood/main/assets/flags/sangreza.png',
        'Montequilla': 'https://raw.githubusercontent.com/TherranT11/nationhood/main/assets/flags/Montequilla.png'
    };
    const flagUrl = flagUrls[nation.name] || null;
    
    const isAutocracy = nation.government_type === 'Autocracy';
    const partyLabel = isAutocracy ? 'Factions' : 'Parties';
    
    sidebar.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;">
            <div>
                <h3 style="color:#ffcc00;font-size:1.2rem;margin-bottom:4px;">${nation.name}</h3>
                <p style="color:#888;font-size:0.8rem;margin-bottom:0;font-style:italic;">Capital: ${nation.capital || '—'}</p>
            </div>
            ${flagUrl ? `<img src="${flagUrl}" alt="${nation.name} flag" style="width:64px;height:auto;border:1px solid #444;border-radius:3px;" />` : ''}
        </div>
        <div style="margin-bottom:16px;"></div>
        
        <!-- Party/Faction Count -->
        <div style="background:${isFull ? '#2a1a1a' : '#1a2a1a'};border:1px solid ${isFull ? '#ff4444' : '#4CAF50'};border-radius:6px;padding:12px;margin-bottom:16px;text-align:center;">
            <div style="font-size:0.7rem;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">${partyLabel}</div>
            <div style="font-size:1.4rem;font-weight:bold;color:${isFull ? '#ff4444' : '#4CAF50'};">
                ${partyCount || 0} / ${maxParties}
            </div>
            <div style="font-size:0.75rem;color:${isFull ? '#ff4444' : '#aaa'};margin-top:4px;">
                ${isFull ? '⚠️ FULL — No spots available' : `${spotsRemaining} spot${spotsRemaining !== 1 ? 's' : ''} remaining`}
            </div>
            <button onclick="document.getElementById('party-preview').style.display = document.getElementById('party-preview').style.display === 'none' ? 'block' : 'none'" 
                style="width:100%;margin-top:10px;padding:8px;background:transparent;border:1px solid #444;border-radius:4px;color:#888;font-size:0.75rem;cursor:pointer;text-transform:uppercase;letter-spacing:1px;transition:0.2s;"
                onmouseover="this.style.borderColor='#ffcc00';this.style.color='#ffcc00'" 
                onmouseout="this.style.borderColor='#444';this.style.color='#888'">
                View Parties ▾
            </button>
            <div id="party-preview" style="display:none;margin-top:10px;">
                ${(parties || []).length === 0 
                    ? '<p style="color:#666;font-style:italic;font-size:0.8rem;text-align:center;">No parties yet</p>'
                    : (parties || []).map(p => `
                        <div style="background:#252525;border-radius:6px;padding:10px 12px;margin-bottom:8px;border-left:3px solid ${p.is_npc ? '#666' : '#ffcc00'};">
                            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                                <div style="font-weight:bold;color:#e0e0e0;font-size:0.85rem;">${p.faction_name}${p.is_npc ? ' <span style="background:#ff9800;color:#000;padding:2px 6px;border-radius:3px;font-size:0.6rem;font-weight:bold;margin-left:6px;">NPC</span>' : ''}</div>
                                <div style="font-size:0.75rem;color:#ffcc00;font-weight:bold;">${p.seats || 0} seats</div>
                            </div>
                            <div style="display:flex;justify-content:space-between;align-items:center;">
                                <div style="font-size:0.7rem;color:#888;">${p.abbreviation || ''}</div>
                                <div style="font-size:0.7rem;color:${(p.approval_rating || 0) >= 50 ? '#4CAF50' : '#ff4444'};">${Math.round(p.approval_rating || 0)}% approval</div>
                            </div>
                        </div>
                    `).join('')}
            </div>
        </div>
        
        <!-- Key Stats -->
        <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px;">
            ${intelRow('Population', formatNumber(nation.population), '#ffcc00')}
            ${intelRow('Government', nation.government_type || '—', '#fff')}
        </div>
        
        <!-- Description -->
        <div style="font-size:0.82rem;color:#ccc;line-height:1.5;margin-bottom:16px;">
            ${baseDescription}
        </div>
        
        <!-- Stat-based Insights -->
        ${statDescriptions.length > 0 ? `
            <div style="border-top:1px solid #333;padding-top:14px;margin-top:14px;">
                <div style="font-size:0.7rem;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;">Intelligence Report</div>
                <div style="font-size:0.8rem;color:#aaa;line-height:1.6;">
                    ${statDescriptions.map(d => `<p style="margin-bottom:8px;">• ${d}</p>`).join('')}
                </div>
            </div>
        ` : ''}
        
        <div style="margin-top: 20px;">
            ${getNationButton(nation, isFull)}
        </div>
    `;
}

/**
 * Generate base description based on population size
 */
function generateBaseDescription(nation) {
    const pop = nation.population || 0;
    let sizeDesc = 'a nation';
    
    if (pop > 100000000) {
        sizeDesc = 'a massive nation with over 100 million citizens';
    } else if (pop > 50000000) {
        sizeDesc = 'a large nation with tens of millions of citizens';
    } else if (pop > 20000000) {
        sizeDesc = 'a moderately sized nation';
    } else if (pop > 5000000) {
        sizeDesc = 'a smaller nation';
    } else {
        sizeDesc = 'a small nation-state';
    }
    
    return `This country is ${sizeDesc} located on the Andorran continent. Its capital, ${nation.capital || 'the central city'}, serves as the political and economic heart of the nation.`;
}

/**
 * Generate stat-based description snippets
 */
function generateStatDescriptions(nation) {
    const descriptions = [];
    
    if (nation.arable_land >= 75) descriptions.push("Fertile agricultural lands produce abundant crops, making this country a regional breadbasket.");
    if (nation.rare_minerals >= 75) descriptions.push("Rich deposits of rare earth minerals make this country a key player in global supply chains.");
    if (nation.oil_and_gas >= 75) descriptions.push("Vast petroleum reserves have shaped the economy and grant significant geopolitical leverage.");
    if (nation.civil_unrest >= 60) descriptions.push("Civil unrest is widespread, with protests and riots frequently disrupting daily life.");
    if (nation.crime_rate >= 60) descriptions.push("High crime rates plague urban centers, straining law enforcement resources.");
    if (nation.pollution >= 60) descriptions.push("Industrial pollution has caused significant environmental damage across the nation.");
    if (nation.corruption >= 60) descriptions.push("Government corruption is endemic, eroding public trust in institutions.");
    if (nation.terrorism >= 60) descriptions.push("Domestic terrorism poses an ongoing security threat to the population.");
    if (nation.political_violence >= 60) descriptions.push("Political violence is common, with clashes between opposing factions.");
    if (nation.poverty_rate >= 60) descriptions.push("Widespread poverty affects a significant portion of the population.");
    if (nation.unemployment >= 60) descriptions.push("High unemployment has left many citizens struggling to find work.");
    if (nation.happiness >= 70) descriptions.push("Citizens report high levels of satisfaction and national well-being.");
    if (nation.literacy >= 85) descriptions.push("A highly educated population drives innovation and economic growth.");
    if (nation.healthcare_quality >= 70) descriptions.push("Quality healthcare ensures a high standard of living for citizens.");
    if (nation.freedom_index >= 70) descriptions.push("Strong civil liberties protect individual rights and freedoms.");
    if (nation.standard_of_living >= 70) descriptions.push("A high standard of living provides comfort and opportunity for most citizens.");
    if (nation.stability <= 30) descriptions.push("Political instability threatens the nation's future and deters foreign investment.");
    if (nation.freedom_index <= 30) descriptions.push("Civil liberties remain heavily restricted under authoritarian governance.");
    if (nation.legitimacy <= 30) descriptions.push("The government struggles to maintain public trust and legitimacy.");
    if (nation.happiness <= 30) descriptions.push("National morale is low, with widespread dissatisfaction among the populace.");
    if (nation.healthcare_quality <= 30) descriptions.push("Healthcare infrastructure is severely lacking, affecting public health outcomes.");
    if (nation.GDP >= 100) descriptions.push("A powerful economy makes this country a major force in regional trade.");
    if (nation.debt >= 80) descriptions.push("Mounting national debt threatens long-term economic stability.");
    if (nation.inflation >= 70) descriptions.push("Runaway inflation has eroded purchasing power and savings.");
    if (nation.population_growth <= 30) descriptions.push("Population decline poses challenges for the workforce and social services.");
    if (nation.emigration >= 70) descriptions.push("Brain drain is a serious concern as skilled workers seek opportunities abroad.");
    
    return descriptions;
}

/**
 * Create an intel row for the sidebar
 */
function intelRow(label, value, color) {
    return `
        <div style="background:#252525;padding:8px 10px;border-radius:4px;display:flex;justify-content:space-between;">
            <span style="font-size:0.72rem;color:#888;text-transform:uppercase;">${label}</span>
            <span style="font-size:0.88rem;color:${color};font-weight:bold;">${value}</span>
        </div>
    `;
}

/**
 * Get the appropriate button for the nation sidebar
 */
function getNationButton(nation, isFull = false) {
    const hasNation = userFaction && userFaction.nation_id;
    
    if (!hasNation) {
        if (isFull) {
            return `<button disabled style="width:100%; padding:14px; background:#444; color:#888; border:none; border-radius:4px; font-weight:bold; font-size:0.95rem; cursor:not-allowed; text-transform:uppercase; letter-spacing:1px;">NATION FULL</button>`;
        }
        return `<button onclick="joinNation('${nation.name}')" style="width:100%; padding:14px; background:#4CAF50; color:#fff; border:none; border-radius:4px; font-weight:bold; font-size:0.95rem; cursor:pointer; text-transform:uppercase; letter-spacing:1px; transition:0.3s;">JOIN ${nation.name.toUpperCase()}</button>`;
    }
    
    return `<button onclick="window.location.href='${nation.name.toLowerCase()}.html'" style="width:100%; padding:14px; background:#ffcc00; color:#000; border:none; border-radius:4px; font-weight:bold; font-size:0.95rem; cursor:pointer; text-transform:uppercase; letter-spacing:1px; transition:0.3s;">VIEW ${nation.name.toUpperCase()}</button>`;
}

/**
 * Join a nation — redirects to createparty.html
 */
function joinNation(nationName) {
    window.location.href = `createparty.html?nation=${nationName.toLowerCase()}`;
}
</script>
