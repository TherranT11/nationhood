<!-- Page-Specific Script -->
<script>
/**
 * World Page
 * Displays the world map and nation intel
 */

// Initialize page
initPage('world', async (state) => {
    setupWorldMap();
});

/**
 * Setup click handlers for the world map
 */
function setupWorldMap() {
    document.querySelectorAll('.land').forEach(path => {
        path.addEventListener('click', async (e) => {
            e.stopPropagation();
            
            // Update selection highlight
            document.querySelectorAll('.land').forEach(l => l.classList.remove('selected-nation'));
            e.target.classList.add('selected-nation');
            
            // Get nation name from data attribute
            const name = e.target.getAttribute('data-nation-name');
            const sidebar = document.getElementById('world-intel');
            sidebar.innerHTML = '<p style="color:#888;font-style:italic;">Loading ' + name + '…</p>';
            
            // Fetch nation data
            try {
                const { data: nation, error } = await _supabase
                    .from('nations')
                    .select('*')
                    .eq('name', name)
                    .single();
                
                if (error || !nation) {
                    sidebar.innerHTML = '<p style="color:#f44;">Nation not found.</p>';
                    return;
                }
                
                renderNationIntel(nation);
            } catch (e) {
                console.error('Error loading nation:', e);
                sidebar.innerHTML = '<p style="color:#f44;">Error loading data.</p>';
            }
        });
    });
}

/**
 * Render nation intel in the sidebar
 */
function renderNationIntel(nation) {
    const sidebar = document.getElementById('world-intel');
    
    sidebar.innerHTML = `
        <h3 style="color:#ffcc00;font-size:1.1rem;margin-bottom:6px;">${nation.name}</h3>
        <p style="color:#888;font-size:0.78rem;margin-bottom:14px;">Capital: ${nation.capital || '—'}</p>
        <div style="display:flex;flex-direction:column;gap:8px;">
            ${intelRow('Population', formatNumber(nation.population), '#ffcc00')}
            ${intelRow('Government', nation.government_type || '—', '#fff')}
            ${intelRow('GDP', formatCurrency(nation.GDP), '#4CAF50')}
            ${intelRow('Debt', formatCurrency(nation.debt), '#ff9800')}
            ${intelRow('Stability', nation.stability != null ? nation.stability : 'N/A', getStabilityColor(nation.stability))}
            ${intelRow('Civil Unrest', nation.civil_unrest != null ? nation.civil_unrest : 'N/A', getStabilityColor(100 - nation.civil_unrest))}
        </div>
        
        <div style="margin-top: 20px;">
            <a href="nation.html" style="color: #2196F3; font-size: 0.85rem;">
                View Full Details →
            </a>
        </div>
    `;
}

/**
 * Create an intel row for the sidebar
 */
function intelRow(label, value, color) {
    return `
        <div style="background:#252525;padding:8px 10px;border-radius:4px;display:flex;justify-content:space-between;">
            <span style="font-size:0.72rem;color:#888;text-transform:uppercase;">${label}</span>
            <span style="font-size:0.88rem;color:${color};font-weight:bold;">${value}</span>
        </div>
    `;
}

/**
 * Get color based on stability value
 */
function getStabilityColor(value) {
    if (value == null) return '#666';
    if (value >= 70) return '#4CAF50';
    if (value >= 40) return '#ff9800';
    return '#ff4444';
}
</script>
