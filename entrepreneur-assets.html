<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Character — Entrepreneur</title>
<style>
  /* Topbar/nav/body-base come from js/entrepreneur-topbar.js (one source,
     shared by every entrepreneur page). This page styles only its own body.
     The identity header mirrors entrepreneur-dashboard.html's .identity-body
     look (this codebase inlines per-page body styles). */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background:#050505; color:#d4d4d4; font-family:-apple-system,system-ui,sans-serif; min-height:100vh; }
  .ch-content { padding:32px 24px 24px; max-width:1280px; }

  .ch-identity { margin-bottom:28px; }
  .ch-identity .eyebrow { color:#8aaa6a; font-size:10px; letter-spacing:0.15em; margin-bottom:6px; }
  .ch-identity .name { display:flex; align-items:baseline; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .ch-identity .first { font-size:46px; font-weight:500; color:#fff; letter-spacing:-0.01em; line-height:1; }
  .ch-identity .last {
    font-size:46px; font-family:Georgia,'Times New Roman',serif; font-style:italic;
    color:#8aaa6a; letter-spacing:-0.01em; line-height:1;
  }
  .ch-identity .meta-row { display:flex; gap:28px; font-size:11px; letter-spacing:0.08em; color:#888; flex-wrap:wrap; }
  .ch-identity .meta-row .label { color:#555; margin-right:6px; }
  .ch-identity .meta-row .val { color:#d4d4d4; }

  /* Status row: Current Location (with the Travel action) · Asset Status ·
     Warrants — three equal cards that wrap on narrow screens. */
  .ch-cards { display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; margin-top:20px; }
  .ch-card {
    min-width:0;
    background:#121212; border:0.5px solid rgba(255,255,255,0.08); border-radius:4px;
    padding:16px 18px;
  }
  .ch-card-label { color:#8aaa6a; font-size:10px; letter-spacing:0.15em; margin-bottom:8px; }
  .ch-card-empty { color:#555; font-size:11px; letter-spacing:0.04em; }
  .ch-loc-value { font-size:20px; font-weight:500; color:#fff; display:flex; align-items:center; gap:10px; }
  .ch-loc-tag {
    font-size:9px; letter-spacing:0.1em; color:#8aaa6a; border:0.5px solid rgba(138,170,106,0.3);
    border-radius:3px; padding:2px 6px;
  }

  /* Leaderboard row: shares the 3-column grid so the boards line up under the
     status cards (Reputable under Current Location, Net Worth under Asset
     Status). Reputation board: top 3 green, bottom 5 red (top wins on overlap). */
  .ch-boards { display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; margin-top:20px; }
  .ch-rep {
    min-width:0; height:420px;
    background:#121212; border:0.5px solid rgba(255,255,255,0.08); border-radius:4px;
    display:flex; flex-direction:column;
  }
  @media (max-width:860px) { .ch-cards, .ch-boards { grid-template-columns:1fr; } }
  .ch-rep-head {
    flex:none; padding:14px 16px; border-bottom:0.5px solid rgba(255,255,255,0.08);
    color:#8aaa6a; font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
  }
  .ch-rep-list { flex:1; overflow-y:auto; }
  .ch-rep-row {
    display:flex; align-items:center; gap:8px; padding:9px 16px; font-size:12px;
    border-bottom:0.5px solid rgba(255,255,255,0.04);
  }
  .ch-rep-row .rk { flex:none; width:22px; color:#555; font-size:10px; }
  .ch-rep-row .nm { flex:1; min-width:0; display:flex; align-items:center; gap:6px; }
  .ch-rep-row .who { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#d4d4d4; }
  .ch-rep-row .nat { flex:none; font-size:9px; letter-spacing:0.06em; text-transform:uppercase;
    color:#8aaa6a; border:0.5px solid rgba(138,170,106,0.3); border-radius:3px; padding:1px 5px; }
  .ch-rep-row .rp { flex:none; font-weight:600; color:#d4d4d4; font-variant-numeric:tabular-nums; }
  .ch-rep-row.rep-top .who, .ch-rep-row.rep-top .rp { color:#8aaa6a; }
  .ch-rep-row.rep-bottom .who, .ch-rep-row.rep-bottom .rp { color:#d88d82; }
  .ch-rep-empty { padding:16px; color:#555; font-size:11px; letter-spacing:0.06em; }

  /* Personal liability — post-bankruptcy debt recourse. Shown only when owed. */
  .ch-liability { display:none; margin-top:20px; max-width:420px;
    background:#1a1212; border:0.5px solid rgba(216,141,130,0.45); border-radius:4px; padding:16px 18px; }
  .ch-liability.show { display:block; }
  .ch-liability .lab { color:#d88d82; font-size:10px; letter-spacing:0.15em; margin-bottom:8px; }
  .ch-liability .amt { font-size:20px; font-weight:500; color:#d88d82; }
  .ch-liability .note { color:#888; font-size:11px; line-height:1.5; margin:8px 0 12px; }
  .ch-liability .settle-btn { font-size:11px; letter-spacing:0.06em; color:#d4d4d4; background:#1a1a1a;
    border:0.5px solid rgba(255,255,255,0.15); border-radius:3px; padding:7px 14px; cursor:pointer; }
  .ch-liability .settle-btn:disabled { opacity:0.5; cursor:default; }
  .ch-liability .msg { font-size:10px; margin-top:8px; color:#888; min-height:12px; }

  /* Travel — relocate the founder for $20k personal funds. */
  .ch-travel-btn { margin-top:10px; font-size:11px; letter-spacing:0.05em; color:#d4b87a; background:#1a160d;
    border:0.5px solid rgba(212,184,122,0.4); border-radius:3px; padding:7px 14px; cursor:pointer; font-family:inherit; }
  .ch-travel-btn:hover { background:#221c10; }
  .ch-travel-btn:disabled { opacity:0.5; cursor:default; }
  .ch-travel-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.78); z-index:700;
    align-items:center; justify-content:center; padding:30px; }
  .ch-travel-overlay.show { display:flex; }
  .ch-travel-modal { background:#0c0c0c; border:0.5px solid rgba(212,184,122,0.3); border-radius:6px; width:100%;
    max-width:420px; font-family:var(--font-mono,monospace); overflow:hidden; }
  .ch-travel-modal .ct-head { display:flex; align-items:center; justify-content:space-between; padding:14px 18px;
    border-bottom:0.5px solid rgba(255,255,255,0.08); }
  .ch-travel-modal .ct-eyebrow { color:#d4b87a; font-size:10px; letter-spacing:0.15em; }
  .ch-travel-modal .ct-x { background:none; border:none; color:#888; font-size:18px; cursor:pointer; line-height:1; }
  .ch-travel-modal .ct-title { font-size:20px; color:#fff; padding:14px 18px 2px; }
  .ch-travel-modal .ct-sub { font-size:11px; color:#9a9a92; line-height:1.5; padding:0 18px 12px; }
  .ch-travel-modal .ct-cost { font-size:11px; color:#888; padding:0 18px 12px; letter-spacing:0.03em; }
  .ch-travel-modal .ct-cost b { color:#d4d4d4; } .ch-travel-modal .ct-cost b.ok { color:#8aaa6a; } .ch-travel-modal .ct-cost b.no { color:#d88d82; }
  .ch-travel-modal .ct-select { width:calc(100% - 36px); margin:0 18px 12px; background:#161616; color:#d4d4d4;
    border:0.5px solid rgba(255,255,255,0.15); border-radius:4px; padding:9px 10px; font-size:13px; font-family:inherit; }
  .ch-travel-modal .ct-empty { padding:0 18px 12px; font-size:12px; color:#888; }
  .ch-travel-modal .ct-msg { padding:0 18px 10px; font-size:11px; color:#d88d82; }
  .ch-travel-modal .ct-foot { display:flex; gap:8px; justify-content:flex-end; padding:14px 18px;
    border-top:0.5px solid rgba(255,255,255,0.08); background:#0d0d0d; }
  .ch-travel-modal .ct-btn { padding:9px 16px; font-size:11px; letter-spacing:0.06em; border-radius:3px; cursor:pointer; font-family:inherit; }
  .ch-travel-modal .ct-btn.sec { border:0.5px solid rgba(255,255,255,0.15); color:#888; background:transparent; }
  .ch-travel-modal .ct-btn.pri { background:#2a2210; border:0.5px solid #d4b87a; color:#e8d8b0; font-weight:600; }

  @media (max-width:600px) {
    .ch-identity .first, .ch-identity .last { font-size:34px; }
    .ch-identity .meta-row { gap:16px; }
  }

  /* Mobile refresh — phone-class viewport. Tighten container padding,
     shrink the modal overlay safe-area, and bring every actionable
     control up to a 44px tap target. The 860px / 600px rules above
     handle stacking + hero shrink at tablet; this block is phone-only. */
  @media (max-width:640px) {
    .ch-content { padding:20px 14px 20px; }
    .ch-identity { margin-bottom:20px; }
    .ch-identity .first, .ch-identity .last { font-size:28px; }
    .ch-cards, .ch-boards { gap:12px; margin-top:16px; }
    .ch-card { padding:14px 14px; }
    .ch-rep { height:360px; }

    /* Touch targets: travel / settle / modal buttons hit 44px. */
    .ch-travel-btn, .ch-liability .settle-btn,
    .ch-travel-modal .ct-btn { min-height:44px; padding:12px 16px; font-size:12px; }
    .ch-travel-modal .ct-x { min-width:44px; min-height:44px; font-size:22px; }
    .ch-travel-modal .ct-select { min-height:44px; padding:11px 12px; font-size:14px; }

    /* Modal overlay: drop the 30px safe-area down to 16px so the modal
       has full viewport width minus a thin gutter. */
    .ch-travel-overlay { padding:16px; }
    .ch-travel-modal { max-width:100%; max-height:90vh; overflow:auto; }
  }
  @media (max-width:360px) {
    .ch-content { padding:16px 10px 16px; }
    .ch-identity .first, .ch-identity .last { font-size:24px; }
    .ch-travel-overlay { padding:10px; }
  }
</style>
</head>
<body>
<div id="ent-topbar"></div>
<div class="ch-content">
  <div class="ch-identity">
    <div class="eyebrow">— ENTREPRENEUR —</div>
    <div class="name"><span class="first" id="ch-first">—</span><span class="last" id="ch-last"></span></div>
    <div class="meta-row">
      <div><span class="label">AGE</span><span class="val" id="ch-age">—</span></div>
      <div><span class="label">ORIGIN</span><span class="val" id="ch-origin">—</span></div>
      <div><span class="label">ARCHETYPE</span><span class="val" id="ch-archetype">—</span></div>
    </div>
  </div>

  <div class="ch-cards">
    <div class="ch-card">
      <div class="ch-card-label">CURRENT LOCATION</div>
      <div class="ch-loc-value"><span id="ch-location">—</span><span class="ch-loc-tag" id="ch-loc-tag">HOME</span></div>
      <button class="ch-travel-btn" id="ch-travel-btn">&#9992; Travel — $20,000</button>
    </div>
    <div class="ch-card">
      <div class="ch-card-label">ASSET STATUS</div>
      <div class="ch-card-empty" id="ch-asset-status"></div>
    </div>
    <div class="ch-card">
      <div class="ch-card-label">WARRANTS</div>
      <div id="ch-warrants"></div>
    </div>
  </div>

  <div class="ch-liability" id="ch-liability">
    <div class="lab">PERSONAL LIABILITY</div>
    <div class="amt" id="ch-liab-amt">—</div>
    <div class="note">Unpaid debt from a bankrupt corporation follows you personally. You cannot found new corporations until it is settled from your personal funds.</div>
    <button class="settle-btn" id="ch-settle-btn">Settle from personal funds</button>
    <div class="msg" id="ch-settle-msg"></div>
  </div>

  <div class="ch-boards">
    <div class="ch-rep">
      <div class="ch-rep-head">Reputable Entrepreneurs</div>
      <div class="ch-rep-list" id="ch-rep-list"></div>
    </div>
    <div class="ch-rep">
      <div class="ch-rep-head">Entrepreneur Net Worth</div>
      <div class="ch-rep-list" id="ch-nw-list"></div>
    </div>
  </div>
</div>
<div class="ch-travel-overlay" id="ch-travel-overlay"></div>
<script type="module">
import { bootstrapEntrepreneur } from './js/entrepreneur-topbar.js';
import { ENTREPRENEUR_ARCHETYPES } from './js/game/factions.js';
import { _supabase } from './js/supabase-client.js';

(async () => {
  // bootstrapEntrepreneur already fetches the character fields we need
  // (leader_first_name/last/age, nation, entrepreneur_archetype) — one source.
  const ctx = await bootstrapEntrepreneur('assets');
  const f = ctx?.faction;
  if (!f) return;

  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  const first = f.leader_first_name || (f.faction_name || '').split(/\s+/)[0] || '—';
  const last  = f.leader_last_name  || (f.faction_name || '').split(/\s+/).slice(1).join(' ') || '';
  const arch  = ENTREPRENEUR_ARCHETYPES[f.entrepreneur_archetype] || null;

  set('ch-first', first);
  set('ch-last', last);
  set('ch-age', f.leader_age != null ? String(f.leader_age) : '—');
  set('ch-origin', f.nation ? String(f.nation).toUpperCase() : '—');
  set('ch-archetype', arch ? arch.name : '—');
  // Current location = factions.nation (mutable via Travel).
  set('ch-location', f.nation ? String(f.nation) : 'Home Nation');

  // ── Travel: $20k personal funds relocates the founder to any nation. ──
  // ORIGIN (birthplace) is immutable — read it from ent_origin_nation, falling
  // back to the current nation if the column isn't migrated yet. (usd is defined
  // above; esc below — both in scope by the time the modal renders on click.)
  const TRAVEL_COST = 20000;
  let originName = f.nation;
  try {
    const { data: o } = await _supabase.from('factions').select('ent_origin_nation').eq('id', f.id).maybeSingle();
    if (o && o.ent_origin_nation) originName = o.ent_origin_nation;
  } catch (_) { /* column not migrated yet → origin = current location */ }
  set('ch-origin', originName ? String(originName).toUpperCase() : '—');
  const locTag = document.getElementById('ch-loc-tag');
  const setTag = (loc) => { if (locTag) locTag.textContent = (String(loc || '') === String(originName || '')) ? 'HOME' : 'ABROAD'; };
  setTag(f.nation);

  const travelBtn = document.getElementById('ch-travel-btn');
  const tOverlay = document.getElementById('ch-travel-overlay');
  if (travelBtn && tOverlay) {
    let tBusy = false;
    const closeT = () => { if (!tBusy) tOverlay.classList.remove('show'); };
    let curLoc = f.nation;

    function renderT(nations, funds, msg) {
      const afford = funds >= TRAVEL_COST;
      const opts = nations.map(n => `<option value="${esc(n.id)}">${esc(n.name)}</option>`).join('');
      tOverlay.innerHTML = `<div class="ch-travel-modal">
        <div class="ct-head"><span class="ct-eyebrow">— TRAVEL —</span><button class="ct-x" id="ct-x">&times;</button></div>
        <div class="ct-title">Board a Plane</div>
        <div class="ct-sub">Relocate your entrepreneur to any nation. Remember: you can only found a corporation in your home nation, and you must be there to do it — travel takes you abroad.</div>
        <div class="ct-cost">Cost <b>${usd(TRAVEL_COST)}</b> &middot; Personal Funds <b class="${afford ? 'ok' : 'no'}">${usd(funds)}</b></div>
        ${nations.length ? `<select id="ct-nation" class="ct-select">${opts}</select>` : `<div class="ct-empty">No other nation to travel to.</div>`}
        ${msg ? `<div class="ct-msg">${esc(msg)}</div>` : ''}
        <div class="ct-foot"><button class="ct-btn sec" id="ct-cancel">Cancel</button>${(nations.length && afford) ? `<button class="ct-btn pri" id="ct-board">Board Plane</button>` : ''}</div>
      </div>`;
      document.getElementById('ct-x').onclick = closeT;
      document.getElementById('ct-cancel').onclick = closeT;
      const board = document.getElementById('ct-board');
      if (board) board.onclick = async () => {
        if (tBusy) return;
        const nid = document.getElementById('ct-nation')?.value;
        if (!nid) return;
        tBusy = true; board.disabled = true; board.textContent = 'Boarding…';
        try {
          const { data, error } = await _supabase.rpc('entrepreneur_travel', { p_nation_id: nid });
          if (error || !data?.success) {
            const r = data?.reason;
            const m = error ? error.message
              : r === 'insufficient_funds' ? `Not enough personal funds (have ${usd(data.have)}, need ${usd(data.cost)}).`
              : r === 'already_there' ? 'You are already there.'
              : 'Travel failed.';
            tBusy = false; board.disabled = false; renderT(nations, funds, m); return;
          }
          curLoc = data.location;
          set('ch-location', data.location); setTag(data.location);
          tBusy = false; tOverlay.classList.remove('show');
        } catch (e) {
          tBusy = false; board.disabled = false; renderT(nations, funds, e?.message || 'Travel failed.');
        }
      };
    }

    travelBtn.onclick = async () => {
      travelBtn.disabled = true;
      let nations = [], funds = 0;
      try {
        const [nRes, fRes] = await Promise.all([
          _supabase.from('nations').select('id, name').order('name'),
          _supabase.from('factions').select('party_funds').eq('id', f.id).maybeSingle(),
        ]);
        nations = (nRes.data || []).filter(n => String(n.name) !== String(curLoc));
        funds = Number(fRes.data?.party_funds) || 0;
      } catch (_) { /* render with empty */ }
      travelBtn.disabled = false;
      renderT(nations, funds, '');
      tOverlay.classList.add('show');
    };
    tOverlay.onclick = (e) => { if (e.target === tOverlay) closeT(); };
  }

  // ── Personal liability (post-bankruptcy debt recourse). Shown only when the
  //    founder owes; settling from personal funds re-enables founding corps. ──
  const usd = (n) => '$' + Math.round(Math.max(0, Number(n) || 0)).toLocaleString('en-US');
  // Read the liability on its own (not via the shared bootstrap) so a not-yet-
  // applied ent_unpaid_debt column can never break the universal topbar; a
  // missing column / error just yields 0 (no card).
  const { data: _liab } = await _supabase.from('factions')
    .select('ent_unpaid_debt').eq('id', f.id).maybeSingle();
  const owed = Math.max(0, Number(_liab?.ent_unpaid_debt) || 0);
  if (owed > 0) {
    const card = document.getElementById('ch-liability');
    const sBtn = document.getElementById('ch-settle-btn');
    const sMsg = document.getElementById('ch-settle-msg');
    set('ch-liab-amt', usd(owed));
    if (card) card.classList.add('show');
    if (sBtn) sBtn.onclick = async () => {
      sBtn.disabled = true; const prev = sBtn.textContent; sBtn.textContent = 'Settling…';
      if (sMsg) sMsg.textContent = '';
      try {
        const { data, error } = await _supabase.rpc('settle_personal_debt', { p_amount: owed });
        if (error) { if (sMsg) sMsg.textContent = 'Failed: ' + error.message; sBtn.disabled = false; sBtn.textContent = prev; return; }
        if (!data?.success) {
          if (sMsg) sMsg.textContent = data?.reason === 'insufficient_funds'
            ? `Not enough personal funds (have ${usd(data.have)}, owe ${usd(data.owed)}).`
            : 'Settle failed: ' + (data?.reason || 'unknown');
          sBtn.disabled = false; sBtn.textContent = prev; return;
        }
        location.reload();
      } catch (e) { if (sMsg) sMsg.textContent = 'Failed: ' + (e?.message || e); sBtn.disabled = false; sBtn.textContent = prev; }
    };
  }

  // ── Reputable Entrepreneurs leaderboard: every active entrepreneur by
  //    reputation, descending. Top 3 green, bottom 5 red (top wins overlap). ──
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
    c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const natTag = (n) => n ? `<span class="nat">${esc(String(n))}</span>` : '';
  let nationById = new Map();   // faction_id → origin nation, built from the rep query, reused by net worth
  const list = document.getElementById('ch-rep-list');
  if (list) {
    const { data: ents, error } = await _supabase
      .from('factions')
      .select('id, faction_name, leader_first_name, leader_last_name, ent_reputation, nation')
      .eq('faction_type', 'entrepreneur')
      .is('abandoned_at', null)
      .order('ent_reputation', { ascending: false, nullsFirst: false });
    if (error) console.warn('[entrepreneur-assets] reputation list failed:', error.message);
    const rows = ents || [];
    nationById = new Map(rows.map(r => [r.id, r.nation]));
    list.innerHTML = rows.length
      ? rows.map((r, i) => {
          const nm = [r.leader_first_name, r.leader_last_name].filter(Boolean).join(' ').trim()
            || r.faction_name || 'Unknown';
          const rep = Math.round(Number(r.ent_reputation) || 0);
          const cls = i < 3 ? 'rep-top' : (i >= rows.length - 5 ? 'rep-bottom' : '');
          return `<div class="ch-rep-row ${cls}"><span class="rk">${i + 1}</span>`
            + `<span class="nm"><span class="who">${esc(nm)}</span>${natTag(r.nation)}</span>`
            + `<span class="rp">${rep}</span></div>`;
        }).join('')
      : '<div class="ch-rep-empty">No entrepreneurs yet.</div>';
  }

  // ── Entrepreneur Net Worth: cash + held public stock + private-stake book
  //    value, ranked desc. Computed server-side (get_entrepreneur_net_worth)
  //    off the one-source book value so it matches displayed valuations. ──
  const fmtMoney = (n) => {
    const v = Math.round(Number(n) || 0), a = Math.abs(v);
    if (a >= 1e9) return '$' + (v / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
    if (a >= 1e6) return '$' + (v / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (a >= 1e3) return '$' + (v / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
    return '$' + v.toLocaleString('en-US');
  };
  const nwList = document.getElementById('ch-nw-list');
  if (nwList) {
    const { data: nw, error: nwErr } = await _supabase.rpc('get_entrepreneur_net_worth');
    if (nwErr) console.warn('[entrepreneur-assets] net worth failed:', nwErr.message);
    const nwRows = Array.isArray(nw) ? nw : [];
    nwList.innerHTML = nwRows.length
      ? nwRows.map((r, i) => `<div class="ch-rep-row"><span class="rk">${i + 1}</span>`
          + `<span class="nm"><span class="who">${esc(r.name || 'Unknown')}</span>${natTag(nationById.get(r.faction_id))}</span>`
          + `<span class="rp">${fmtMoney(r.net_worth)}</span></div>`).join('')
      : '<div class="ch-rep-empty">No entrepreneurs yet.</div>';
  }

  // ── Warrants — rendered from this entrepreneur's active arrest warrants.
  //    No warrants system exists yet, so the list is empty and the card falls
  //    back to its default empty-state; wire the query into `warrants` here when
  //    the Minister-of-Justice warrant feature ships. ──
  const warrants = [];
  const wEl = document.getElementById('ch-warrants');
  if (wEl) {
    wEl.innerHTML = warrants.length
      ? warrants.map(w => `<div class="ch-card-empty" style="color:#d88d82;">${esc(w.label || '')}</div>`).join('')
      : '<div class="ch-card-empty">No active arrest warrants</div>';
  }
})().catch(e => console.warn('[entrepreneur-assets] init failed:', e?.message || e));
</script>
</body>
</html>
