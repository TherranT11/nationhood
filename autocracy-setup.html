<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Autocracy Setup | Nationhood Alpha</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg-0: #0e0e0c;
  --bg-1: #141412;
  --bg-2: #1a1a17;
  --bg-3: #1e1e1a;
  --bg-4: #24241f;
  --bg-5: #2c2c26;
  --bg-hover: #282822;
  --text-bright: #e2e0d6;
  --text-primary: #c4c2b8;
  --text-secondary: #8a8778;
  --text-muted: #6b6a5e;
  --text-dim: #4a4940;
  --text-ghost: #333229;
  --border-hair: rgba(255,255,255,0.04);
  --border-0: rgba(255,255,255,0.06);
  --border-1: rgba(255,255,255,0.08);
  --border-2: rgba(255,255,255,0.12);
  --green: #5cb85c;
  --green-faint: rgba(92,184,92,0.08);
  --green-border: rgba(92,184,92,0.18);
  --red: #d9534f;
  --red-faint: rgba(217,83,79,0.08);
  --red-border: rgba(217,83,79,0.18);
  --amber: #c8a64e;
  --amber-faint: rgba(200,166,78,0.08);
  --amber-border: rgba(200,166,78,0.18);
  --blue: #5b9bd5;
  --blue-faint: rgba(91,155,213,0.08);
  --blue-border: rgba(91,155,213,0.18);
  --purple: #8b7ec8;
  --purple-faint: rgba(139,126,200,0.08);
  --purple-border: rgba(139,126,200,0.18);
  --teal: #5aafa5;
  --teal-faint: rgba(90,175,165,0.08);
  --teal-border: rgba(90,175,165,0.18);
  --orange: #d48a3c;
  --orange-faint: rgba(212,138,60,0.08);
  --orange-border: rgba(212,138,60,0.18);
  --font-mono: 'JetBrains Mono', monospace;
  --font-ui: 'IBM Plex Sans', -apple-system, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg-0);
  color: var(--text-primary);
  font-family: var(--font-ui);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.page-header {
  text-align: center;
  padding: 48px 20px 12px;
  max-width: 640px;
}
.page-header h1 {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.page-header .title {
  font-family: var(--font-ui);
  font-size: 18px;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 6px;
}
.page-header .subtitle {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  line-height: 1.5;
}

/* Nation badge */
.nation-badge {
  width: 100%;
  max-width: 640px;
  padding: 0 16px;
  margin-bottom: 12px;
}
.nation-badge__inner {
  background: var(--bg-2);
  border: 1px solid var(--border-0);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.nation-badge__label {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.nation-badge__sep {
  width: 1px;
  height: 14px;
  background: var(--border-0);
}
.nation-badge__name {
  font-family: var(--font-ui);
  font-size: 12px;
  font-weight: 700;
  color: var(--text-bright);
}
.nation-badge__gov {
  font-family: var(--font-mono);
  font-size: 8.5px;
  font-weight: 700;
  padding: 1px 6px;
  background: var(--red-faint);
  color: var(--red);
  border: 1px solid var(--red-border);
}

/* Section panels */
.section-panel {
  width: 100%;
  max-width: 640px;
  padding: 0 16px;
  margin-bottom: 8px;
}
.panel {
  background: var(--bg-2);
  border: 1px solid var(--border-0);
}
.panel__header {
  background: var(--bg-3);
  border-bottom: 1px solid var(--border-hair);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.panel__dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
}
.panel__title {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--text-secondary);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.panel__body {
  padding: 10px;
}

/* Ideology axes */
.axis-block {
  margin-bottom: 6px;
}
.axis-block:last-child {
  margin-bottom: 0;
}
.axis-header {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
}
.axis-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--purple);
}
.axis-label {
  font-family: var(--font-mono);
  font-size: 8px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.axis-body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.ideo-card {
  background: var(--bg-3);
  border: 1px solid var(--border-0);
  padding: 10px 12px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.ideo-card:hover {
  background: var(--bg-hover);
  border-color: var(--border-1);
}
.ideo-card.selected {
  background: var(--blue-faint);
  border-color: var(--blue-border);
}
.ideo-card.disabled {
  opacity: 0.25;
  cursor: not-allowed;
  pointer-events: none;
}
.ideo-name {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.ideo-card.selected .ideo-name {
  color: var(--blue);
}
.ideo-desc {
  font-family: var(--font-ui);
  font-size: 10px;
  color: var(--text-muted);
  line-height: 1.4;
}

/* Selection bar */
.selection-bar {
  width: 100%;
  max-width: 640px;
  padding: 0 16px;
  margin-bottom: 8px;
}
.selection-inner {
  background: var(--bg-2);
  border: 1px solid var(--border-0);
  padding: 10px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sel-label {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.sel-tags {
  display: flex;
  gap: 6px;
}
.sel-tag {
  font-family: var(--font-mono);
  font-size: 8.5px;
  font-weight: 700;
  padding: 2px 8px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  background: var(--blue-faint);
  color: var(--blue);
  border: 1px solid var(--blue-border);
}
.sel-placeholder {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-dim);
}

/* Faction name list */
.name-option {
  background: var(--bg-3);
  border: 1px solid var(--border-0);
  padding: 9px 12px;
  margin-bottom: 4px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.name-option:last-child {
  margin-bottom: 0;
}
.name-option:hover:not(.taken):not(.selected) {
  background: var(--bg-hover);
  border-color: var(--border-1);
}
.name-option.selected {
  background: var(--red-faint);
  border-color: var(--red-border);
}
.name-option.taken {
  opacity: 0.3;
  cursor: not-allowed;
  pointer-events: none;
}
.name-option__text {
  font-family: var(--font-ui);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
}
.name-option.selected .name-option__text {
  color: var(--red);
}
.name-option__taken-badge {
  font-family: var(--font-mono);
  font-size: 7px;
  font-weight: 700;
  padding: 1px 5px;
  background: var(--bg-5);
  color: var(--text-ghost);
  border: 1px solid var(--border-0);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

/* Action bar */
.action-bar {
  width: 100%;
  max-width: 640px;
  padding: 0 16px 48px;
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
}
.btn {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  padding: 7px 14px;
  background: var(--bg-3);
  border: 1px solid var(--border-0);
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.btn:hover {
  background: var(--bg-4);
  color: var(--text-secondary);
  border-color: var(--border-1);
}
.btn-create {
  background: var(--bg-3);
}
.btn-create:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}
.btn-create.ready {
  background: var(--green-faint);
  color: var(--green);
  border-color: var(--green-border);
}
.btn-create.ready:hover {
  background: rgba(92,184,92,0.14);
}

.error-msg {
  width: 100%;
  max-width: 640px;
  padding: 0 16px;
  margin-bottom: 8px;
}
.error-msg__inner {
  background: var(--red-faint);
  border: 1px solid var(--red-border);
  border-left: 3px solid var(--red);
  color: var(--red);
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 8px 12px;
  display: none;
}

.loading-msg {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  text-align: center;
  padding: 80px 20px;
}
</style>
</head>
<body>

<div id="loading" class="loading-msg">LOADING...</div>

<div id="page-content" style="display:none; width:100%; flex-direction:column; align-items:center;">
  <div class="page-header">
    <h1>Step 2 of 2</h1>
    <div class="title">Establish Your Faction</div>
    <div class="subtitle">In an autocracy, factions operate within the regime. Choose your ideological alignment and claim a faction name. Names already claimed by others are unavailable.</div>
  </div>

  <div class="nation-badge">
    <div class="nation-badge__inner" id="nation-badge"></div>
  </div>

  <div class="error-msg"><div class="error-msg__inner" id="error-message"></div></div>

  <!-- Ideology Selection -->
  <div class="section-panel">
    <div class="panel">
      <div class="panel__header">
        <div class="panel__dot" style="background:var(--purple)"></div>
        <span class="panel__title">Ideology — Select 2</span>
      </div>
      <div class="panel__body" id="axes-container"></div>
    </div>
  </div>

  <div class="selection-bar">
    <div class="selection-inner">
      <span class="sel-label">Ideology</span>
      <div id="sel-tags" class="sel-tags">
        <span class="sel-placeholder">Pick 2 ideologies</span>
      </div>
    </div>
  </div>

  <!-- Faction Name Selection -->
  <div class="section-panel">
    <div class="panel">
      <div class="panel__header">
        <div class="panel__dot" style="background:var(--red)"></div>
        <span class="panel__title">Faction Name</span>
      </div>
      <div class="panel__body" id="names-container"></div>
    </div>
  </div>

  <div class="action-bar">
    <button class="btn" onclick="goBack()">&#x25C0; BACK</button>
    <button class="btn btn-create" id="btn-create" disabled onclick="createFaction()">CREATE FACTION &#x25B6;</button>
  </div>
</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { escapeHtml } from './js/utils.js';

const AXES = [
  {
    key: 'liberty_equality',
    label: 'Liberty vs Equality',
    left: { name: 'Liberty', desc: 'Individual rights and minimal state interference.' },
    right: { name: 'Equality', desc: 'Collective fairness through redistribution.' }
  },
  {
    key: 'security_freedom',
    label: 'Security vs Freedom',
    left: { name: 'Security', desc: 'State protection through law enforcement and strong institutions.' },
    right: { name: 'Freedom', desc: 'Personal autonomy and privacy. Minimal government intrusion.' }
  },
  {
    key: 'individualism_collectivism',
    label: 'Individualism vs Collectivism',
    left: { name: 'Individualism', desc: 'Self-reliance and private enterprise.' },
    right: { name: 'Collectivism', desc: 'Communal structures and shared institutions.' }
  },
  {
    key: 'tradition_progress',
    label: 'Tradition vs Progress',
    left: { name: 'Tradition', desc: 'Cultural continuity and inherited social structures.' },
    right: { name: 'Progress', desc: 'Social reform, scientific advancement, and challenging norms.' }
  },
  {
    key: 'globalism_nationalism',
    label: 'Globalism vs Nationalism',
    left: { name: 'Globalism', desc: 'International cooperation and multilateral governance.' },
    right: { name: 'Nationalism', desc: 'National sovereignty and cultural identity.' }
  }
];

const FACTION_NAMES = [
  'Security Directorate',
  'National Defense Council',
  'Military Affairs Commission',
  'Strategic Command Bureau',
  'Order & Stability Front',
  'Patriotic Union',
  'National Front',
  "People's Vanguard",
  'Revolutionary Guard Council',
  'Permanent Committee for National Unity',
  'Political Guidance Bureau',
  'National Renewal Movement',
  'Cultural Sovereignty Directorate',
  'Ideological Affairs Committee',
  "People's Mobilization Front",
  'Central Planning Authority',
  'State Development Council',
  'Administrative Reform Directorate',
  'National Resources Commission',
  'Sovereign Affairs Bureau'
];

const IDEOLOGY_COLORS = {
  'Liberty': '#3b82f6', 'Equality': '#ef4444',
  'Tradition': '#a855f7', 'Progress': '#22c55e',
  'Security': '#f59e0b', 'Freedom': '#06b6d4',
  'Globalism': '#14b8a6', 'Nationalism': '#f97316',
  'Individualism': '#eab308', 'Collectivism': '#ec4899'
};

const IDEOLOGY_AXIS_MAP = {
  'Liberty':       { axis: 'liberty_equality',           dir: -1 },
  'Equality':      { axis: 'liberty_equality',           dir:  1 },
  'Tradition':     { axis: 'tradition_progress',         dir: -1 },
  'Progress':      { axis: 'tradition_progress',         dir:  1 },
  'Security':      { axis: 'security_freedom',           dir: -1 },
  'Freedom':       { axis: 'security_freedom',           dir:  1 },
  'Globalism':     { axis: 'globalism_nationalism',      dir: -1 },
  'Nationalism':   { axis: 'globalism_nationalism',      dir:  1 },
  'Individualism': { axis: 'individualism_collectivism', dir: -1 },
  'Collectivism':  { axis: 'individualism_collectivism', dir:  1 }
};

const FIRST_NAMES = [
  'Alejandro','Camila','Diego','Valentina','Mateo','Isabela','Sebastian','Luca',
  'Andres','Gabriel','Joaquin','Mariana','Carlos','Tomas','Rafael','Edwin',
  'Emilio','Catalina','Fernando','Renata'
];
const LAST_NAMES = [
  'Velasco','Mendoza','Guerrero','Salazar','Castillo','Herrera','Morales','Rios',
  'Delgado','Espinoza','Guzman','Navarro','Cordoba','Echeverria','Pacheco','Montero',
  'Aguilar','Valenzuela','Carrasco','Ibarra'
];

let currentUser = null;
let nationData = null;
let takenNames = new Set();
let selectedIdeologies = []; // array of {name, axisKey}
let selectedName = null;

async function init() {
  const { data: { user } } = await _supabase.auth.getUser();
  if (!user) { window.location.href = 'login.html'; return; }
  currentUser = user;

  // Check if user already has a faction
  const { data: faction } = await _supabase
    .from('factions').select('id, nation_id').eq('id', user.id).eq('faction_type', 'party').maybeSingle();
  if (faction && faction.nation_id) {
    window.location.href = 'dashboard.html';
    return;
  }

  // Load pending nation from sessionStorage
  const raw = sessionStorage.getItem('nationhood_pending_nation');
  if (!raw) {
    window.location.href = 'select-nation.html';
    return;
  }
  nationData = JSON.parse(raw);
  if (!nationData.id || nationData.government_type !== 'Autocracy') {
    window.location.href = 'select-nation.html';
    return;
  }

  // Render nation badge
  document.getElementById('nation-badge').innerHTML = `
    <span class="nation-badge__label">Nation</span>
    <span class="nation-badge__sep"></span>
    <span class="nation-badge__name">${escapeHtml(nationData.name)}</span>
    <span class="nation-badge__gov">AUTOCRACY</span>
  `;

  // Load existing faction names in this nation
  const { data: existingFactions } = await _supabase
    .from('factions')
    .select('faction_name')
    .eq('nation_id', nationData.id)
    .eq('faction_type', 'party');

  if (existingFactions) {
    for (const f of existingFactions) {
      takenNames.add(f.faction_name);
    }
  }

  renderAxes();
  renderNames();

  document.getElementById('loading').style.display = 'none';
  const content = document.getElementById('page-content');
  content.style.display = 'flex';
}

function renderAxes() {
  const container = document.getElementById('axes-container');
  container.innerHTML = AXES.map(axis => {
    const lColor = IDEOLOGY_COLORS[axis.left.name] || 'var(--text-bright)';
    const rColor = IDEOLOGY_COLORS[axis.right.name] || 'var(--text-bright)';
    return `
    <div class="axis-block">
      <div class="axis-header">
        <div class="axis-dot"></div>
        <span class="axis-label">${axis.label}</span>
      </div>
      <div class="axis-body">
        <div class="ideo-card" data-ideology="${axis.left.name}" data-opposite="${axis.right.name}" data-axis="${axis.key}" onclick="toggleIdeo(this)">
          <div class="ideo-name" style="color:${lColor}">${axis.left.name}</div>
          <div class="ideo-desc">${axis.left.desc}</div>
        </div>
        <div class="ideo-card" data-ideology="${axis.right.name}" data-opposite="${axis.left.name}" data-axis="${axis.key}" onclick="toggleIdeo(this)">
          <div class="ideo-name" style="color:${rColor}">${axis.right.name}</div>
          <div class="ideo-desc">${axis.right.desc}</div>
        </div>
      </div>
    </div>
  `}).join('');
}

function renderNames() {
  const container = document.getElementById('names-container');
  container.innerHTML = FACTION_NAMES.map(name => {
    const taken = takenNames.has(name);
    return `
      <div class="name-option ${taken ? 'taken' : ''}" data-name="${escapeHtml(name)}" onclick="selectName(this)">
        <span class="name-option__text">${escapeHtml(name)}</span>
        ${taken ? '<span class="name-option__taken-badge">Taken</span>' : ''}
      </div>
    `;
  }).join('');
}

function toggleIdeo(el) {
  if (el.classList.contains('disabled')) return;

  const ideology = el.dataset.ideology;
  const opposite = el.dataset.opposite;
  const axisKey = el.dataset.axis;

  if (el.classList.contains('selected')) {
    el.classList.remove('selected');
    selectedIdeologies = selectedIdeologies.filter(s => s.name !== ideology);
    const opp = document.querySelector(`.ideo-card[data-ideology="${opposite}"]`);
    if (opp) opp.classList.remove('disabled');
  } else {
    if (selectedIdeologies.length >= 2) return;
    el.classList.add('selected');
    selectedIdeologies.push({ name: ideology, axisKey });
    const opp = document.querySelector(`.ideo-card[data-ideology="${opposite}"]`);
    if (opp) opp.classList.add('disabled');
  }

  updateUI();
}

function selectName(el) {
  if (el.classList.contains('taken')) return;

  const name = el.dataset.name;

  // Deselect previous
  document.querySelectorAll('.name-option.selected').forEach(n => n.classList.remove('selected'));

  if (selectedName === name) {
    selectedName = null;
  } else {
    selectedName = name;
    el.classList.add('selected');
  }

  updateUI();
}

function updateUI() {
  // Ideology tags
  const tags = document.getElementById('sel-tags');
  if (selectedIdeologies.length === 0) {
    tags.innerHTML = '<span class="sel-placeholder">Pick 2 ideologies</span>';
  } else {
    tags.innerHTML = selectedIdeologies.map(s => {
      const c = IDEOLOGY_COLORS[s.name] || 'var(--blue)';
      return `<span class="sel-tag" style="color:${c};border-color:${c};background:${c}18">${s.name}</span>`;
    }).join('');
  }

  // Create button
  const btn = document.getElementById('btn-create');
  const valid = selectedIdeologies.length === 2 && selectedName;
  btn.disabled = !valid;
  btn.classList.toggle('ready', !!valid);
}

async function createFaction() {
  if (selectedIdeologies.length !== 2 || !selectedName) return;

  const btn = document.getElementById('btn-create');
  btn.disabled = true;
  btn.textContent = 'CREATING...';

  sessionStorage.removeItem('nationhood_state');

  try {
    const { data: shardData } = await _supabase
      .from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const currentTick = shardData?.current_tick || 0;

    const leader = {
      first: FIRST_NAMES[Math.floor(Math.random() * FIRST_NAMES.length)],
      last: LAST_NAMES[Math.floor(Math.random() * LAST_NAMES.length)],
      age: 35 + Math.floor(Math.random() * 20)
    };

    // Generate abbreviation from faction name (first letter of up to 3 alphabetic words)
    const words = selectedName.split(/\s+/).filter(w => /^[A-Za-z]/.test(w));
    let abbr = words.slice(0, 3).map(w => w[0].toUpperCase()).join('');
    // Pad to 3 chars if needed (e.g. "People's Vanguard" -> "PVG" from consonants)
    if (abbr.length < 3) {
      const allChars = selectedName.replace(/[^A-Za-z]/g, '').toUpperCase();
      while (abbr.length < 3 && abbr.length < allChars.length) {
        const next = allChars[abbr.length];
        if (!abbr.includes(next)) abbr += next;
        else abbr += allChars.charAt(Math.min(abbr.length + 1, allChars.length - 1));
      }
    }

    const { error: upsertError } = await _supabase
      .from('factions')
      .upsert({
        id: currentUser.id,
        faction_type: 'party',
        faction_name: selectedName,
        nation_id: nationData.id,
        nation: nationData.name,
        abbreviation: abbr,
        ideology_value_1: selectedIdeologies[0].name,
        ideology_value_2: selectedIdeologies[1].name,
        seats: 0,
        needs_rebuild: false,
        party_color: '#d9534f',
        party_logo: 'star',
        party_description: null,
        leader_first_name: leader.first,
        leader_last_name: leader.last,
        leader_age: leader.age,
        founded_tick: currentTick,
        action_points: 5,
        approval_rating: null
      });

    if (upsertError) throw upsertError;

    // Initialize ideology spectrum
    const m1 = IDEOLOGY_AXIS_MAP[selectedIdeologies[0].name];
    const m2 = IDEOLOGY_AXIS_MAP[selectedIdeologies[1].name];

    if (m1 && m2) {
      const { error: rpcError } = await _supabase.rpc('initialize_faction_ideology', {
        p_faction_id: currentUser.id,
        p_ideology_1: selectedIdeologies[0].name,
        p_ideology_2: selectedIdeologies[1].name
      });

      if (rpcError) {
        const row = {
          faction_id: currentUser.id,
          liberty_equality: 0,
          tradition_progress: 0,
          security_freedom: 0,
          globalism_nationalism: 0,
          individualism_collectivism: 0,
          declared_axis_1: m1.axis,
          declared_direction_1: m1.dir,
          declared_axis_2: m2.axis,
          declared_direction_2: m2.dir
        };
        row[m1.axis] = 30 * m1.dir;
        row[m2.axis] = 30 * m2.dir;

        await _supabase.from('faction_ideology').upsert(row, { onConflict: 'faction_id' });
      }
    }

    // Seed bloc approvals
    try {
      const { data: blocs } = await _supabase
        .from('voter_blocs')
        .select('id, axis_liberty_equality, axis_tradition_progress, axis_security_freedom, axis_globalism_nationalism, axis_individualism_collectivism')
        .eq('nation_id', nationData.id)
        .eq('is_active', true);

      if (blocs && blocs.length > 0) {
        const { data: ideo } = await _supabase.from('faction_ideology')
          .select('liberty_equality, tradition_progress, security_freedom, globalism_nationalism, individualism_collectivism')
          .eq('faction_id', currentUser.id)
          .maybeSingle();

        const rows = blocs.map(bloc => {
          let mult = 1.0;
          if (ideo) {
            const axes = ['liberty_equality','tradition_progress','security_freedom','globalism_nationalism','individualism_collectivism'];
            let opposed = 0, aligned = 0;
            for (const ax of axes) {
              const ps = ideo[ax] || 0;
              const bs = bloc['axis_' + ax] ?? 50;
              if (Math.abs(ps) < 20 || Math.abs(bs - 50) < 10) continue;
              if ((ps < 0 ? 'L' : 'R') === (bs < 50 ? 'L' : 'R')) aligned++; else opposed++;
            }
            if (opposed >= 2) mult = 0.70;
            else if (opposed === 1) mult = 0.80;
            else if (aligned === 0) mult = 0.90;
          }
          return {
            faction_id: currentUser.id,
            bloc_id: bloc.id,
            preference_score: Math.round(40 * mult * 100) / 100
          };
        });

        await _supabase.from('faction_bloc_approval')
          .upsert(rows, { onConflict: 'faction_id,bloc_id', ignoreDuplicates: true });
      }
    } catch (e) { console.warn('Bloc approval seeding non-blocking:', e); }

    // Clean up and redirect
    sessionStorage.removeItem('nationhood_pending_nation');
    sessionStorage.removeItem('nationhood_state');
    window.location.href = 'dashboard.html';

  } catch (error) {
    console.error('Error creating faction:', error);
    const errEl = document.getElementById('error-message');
    errEl.textContent = 'Error: ' + error.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'CREATE FACTION';
    btn.classList.add('ready');
  }
}

function goBack() {
  window.location.href = 'select-nation.html';
}

init();

window.toggleIdeo = toggleIdeo;
window.selectName = selectName;
window.createFaction = createFaction;
window.goBack = goBack;
</script>
