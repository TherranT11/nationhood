<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home | Nationhood</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root { --font-mono: 'JetBrains Mono', monospace; --font-ui: 'IBM Plex Sans', -apple-system, sans-serif; }
  /* Page chrome (topbar/nav/.ent-content) is injected by
     js/entrepreneur-topbar.js — shared with the entrepreneur pages. */
  .biz-empty { max-width: 560px; margin: 60px auto; text-align: center; }
  .biz-empty .eyebrow { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.2em;
    color: #8aaa6a; font-weight: 700; margin-bottom: 10px; }
  .biz-empty h1 { font-family: Georgia, serif; font-size: 24px; color: #fff; margin: 0 0 10px; font-weight: 500; }
  .biz-empty h1 em { font-style: italic; color: #aac88a; }
  .biz-empty p { font-size: 12px; color: #888; line-height: 1.7; margin: 0; }
  #loading { font-family: var(--font-mono); font-size: 10px; color: #4a4940;
    text-align: center; padding: 80px 20px; }
</style>
</head>
<body>

<div id="ent-topbar"></div>
<div id="loading">LOADING...</div>
<div class="ent-content" id="page-content" style="display:none;">
  <div class="biz-empty">
    <div class="eyebrow">BUSINESSMAN · ALPHA</div>
    <h1>The first day of the <em>rest of your life</em></h1>
    <p>Your career starts here. The Career, Corporations, Market, and Forum
       desks open soon — for now, get a feel for the city and watch the ticks
       roll by.</p>
  </div>
</div>

<script type="module">
import { bootstrapBusinessman } from './js/entrepreneur-topbar.js';

(async () => {
  try {
    const ctx = await bootstrapBusinessman('home');
    if (!ctx) return; // redirected (no auth / no businessman faction)
    document.getElementById('loading').style.display = 'none';
    document.getElementById('page-content').style.display = 'block';
  } catch (err) {
    console.error('businessman-home: bootstrap failed', err);
    document.getElementById('loading').textContent = 'FAILED TO LOAD — PLEASE REFRESH';
  }
})();
</script>
</body>
</html>
