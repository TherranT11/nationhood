<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home | Nationhood</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root { --font-mono: 'JetBrains Mono', monospace; --font-ui: 'IBM Plex Sans', -apple-system, sans-serif; }
  /* Page chrome (topbar/nav/.ent-content) is injected by
     js/entrepreneur-topbar.js — shared with the entrepreneur pages. */
  /* All eight identity cards on one row at desktop widths; the
     minmax(0,1fr) lets cards shrink below their content's natural
     width instead of forcing a wrap. Narrow screens fall back to a
     4-up / 2-up grid. */
  .biz-row { display:grid; grid-template-columns:repeat(8, minmax(0, 1fr)); gap:10px;
    max-width:1600px; margin:0 auto; }
  @media (max-width:1100px) { .biz-row { grid-template-columns:repeat(4, minmax(0, 1fr)); } }
  @media (max-width:560px)  { .biz-row { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
  .biz-card { background:#0d0d0d; border:0.5px solid rgba(255,255,255,0.08); border-radius:5px;
    padding:14px 16px; }
  .biz-card .lab { font-family:var(--font-mono); font-size:8.5px; letter-spacing:0.16em;
    color:#666; font-weight:700; margin-bottom:7px; }
  .biz-card { min-width:0; }
  .biz-card .val { font-size:13px; color:#fff; line-height:1.4; overflow-wrap:break-word; }
  .biz-card .sub { font-family:var(--font-mono); font-size:10px; color:#888; margin-top:4px; }
  .biz-card .val.money { font-family:var(--font-mono); color:#8aaa6a; }
  .biz-card .val.ok    { color:#8aaa6a; }
  .biz-card .val.bad   { color:#d9534f; }
  .biz-status-line { font-size:11.5px; color:#8aaa6a; line-height:1.6; }
  .biz-status-line.bad { color:#d9534f; }

  .biz-section { max-width:1280px; margin:26px auto 0; }
  .section-heading { display:flex; align-items:baseline; gap:10px; margin-bottom:14px; }
  .section-heading .roman { color:#555; font-size:11px; letter-spacing:0.1em; }
  .section-heading .sans { font-size:22px; font-weight:500; color:#fff; }
  .section-heading .serif { font-size:22px; font-family:Georgia, 'Times New Roman', serif;
    font-style:italic; color:#8aaa6a; }
  .biz-pi-empty { padding:26px 16px; text-align:center; color:#555; font-size:11.5px;
    font-style:italic; background:#0a0a0a; border:0.5px dashed rgba(255,255,255,0.08);
    border-radius:5px; }
  .biz-pi-card { display:flex; align-items:center; gap:14px; padding:13px 16px; margin-bottom:8px;
    background:rgba(122,154,200,0.05); border:0.5px solid rgba(122,154,200,0.35);
    border-radius:5px; text-decoration:none; }
  .biz-pi-card:hover { background:rgba(122,154,200,0.1); }
  .biz-pi-card .t { font-family:var(--font-mono); font-size:10px; letter-spacing:0.12em;
    color:#7a9ac8; font-weight:700; min-width:0; overflow-wrap:break-word; }
  .biz-pi-card .sub { font-size:11px; color:#888; margin-top:3px; font-family:inherit;
    letter-spacing:0; font-weight:400; }
  .biz-pi-card .go { margin-left:auto; font-family:var(--font-mono); font-size:9px;
    color:#7a9ac8; white-space:nowrap; flex-shrink:0; }

  /* Construction project tracker (7 stages, horizontal) */
  .biz-proj-card { padding:14px 16px; margin-bottom:8px; background:#0b0d0a;
    border:0.5px solid rgba(138,170,106,0.35); border-radius:5px; }
  .biz-proj-card .t { font-size:12.5px; color:#fff; font-weight:600; }
  .biz-proj-card .due { font-family:var(--font-mono); font-size:9.5px; color:#8aaa6a;
    font-weight:400; }
  .biz-proj-card .stages { display:grid; grid-template-columns:repeat(7, 1fr); gap:5px;
    margin-top:11px; }
  .biz-proj-card .stage { background:#0d0d0d; border:0.5px solid rgba(255,255,255,0.08);
    border-radius:4px; padding:7px 5px; text-align:center; opacity:0.45; min-width:0; }
  .biz-proj-card .stage.done { opacity:0.8; border-color:rgba(138,170,106,0.3); }
  .biz-proj-card .stage.done .n { color:#8aaa6a; }
  .biz-proj-card .stage.cur { opacity:1; background:#10140e; border-color:#8aaa6a; }
  .biz-proj-card .stage.cur .n, .biz-proj-card .stage.cur .s { color:#aac88a; }
  .biz-proj-card .stage .n { font-family:var(--font-mono); font-size:11px; color:#888;
    font-weight:700; }
  .biz-proj-card .stage .s { font-size:8.5px; color:#999; margin-top:3px; line-height:1.35;
    overflow-wrap:break-word; }
  .biz-proj-card .stage-desc { margin-top:10px; font-size:10.5px; color:#999;
    line-height:1.55; }
  .biz-proj-card .stage-desc b { color:#aac88a; font-weight:600; }
  @media (max-width:760px) { .biz-proj-card .stages { grid-template-columns:repeat(4, 1fr); } }

  /* Current Role card */
  .cr-card { background:#0b0d0a; border:0.5px solid rgba(138,170,106,0.3); border-radius:6px;
    overflow:hidden; }
  .cr-head { padding:16px 18px 14px; border-bottom:0.5px solid rgba(138,170,106,0.15); }
  .cr-tier { font-family:var(--font-mono); font-size:8.5px; letter-spacing:0.18em; color:#8aaa6a;
    font-weight:700; }
  .cr-title { font-size:16px; color:#fff; font-weight:700; margin-top:4px; }
  .cr-desc { font-size:12px; color:#999; margin-top:5px; line-height:1.5; }
  .cr-actions-label { font-family:var(--font-mono); font-size:8.5px; letter-spacing:0.16em;
    color:#666; font-weight:700; padding:12px 18px 0; }
  .cr-actions { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; padding:10px 18px 16px; }
  .cr-act { background:#0d0d0d; border:0.5px solid rgba(255,255,255,0.08); border-radius:4px;
    padding:11px 13px; opacity:0.45; cursor:not-allowed; }
  .cr-act .nm { font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.12em; color:#ddd;
    font-weight:700; }
  .cr-act .ds { font-size:10.5px; color:#888; margin-top:5px; line-height:1.5; }
  .cr-foot { padding:12px 18px 14px; }
  .cr-go { font-family:var(--font-mono); font-size:9px; letter-spacing:0.13em; font-weight:700;
    color:#8aaa6a; text-decoration:none; padding:7px 12px; border:0.5px solid #4a6a4a;
    border-radius:4px; display:inline-block; }
  .cr-go:hover { background:rgba(138,170,106,0.1); color:#aac88a; }

  #loading { font-family: var(--font-mono); font-size: 10px; color: #4a4940;
    text-align: center; padding: 80px 20px; }
</style>
</head>
<body>

<div id="ent-topbar"></div>
<div id="loading">LOADING...</div>
<div class="ent-content" id="page-content" style="display:none;">
  <div class="biz-row" id="biz-row"></div>
  <!-- Pressing Issues — same surface every faction home carries.
       Open job interviews render here (both sides of the table);
       more cards land as mechanics do (warrants, audits…). -->
  <div class="biz-section">
    <div class="section-heading">
      <span class="roman">I.</span>
      <span class="sans">Pressing</span>
      <span class="serif">Issues</span>
    </div>
    <div id="biz-pressing-issues">
      <div class="biz-pi-empty">No pressing issues right now.</div>
    </div>
  </div>
  <!-- Current Role — the employment card (20270799 record). Title,
       employer, and the three Operations actions; the actions are
       chartered but not yet wired, so they render greyed out. -->
  <div class="biz-section">
    <div class="section-heading">
      <span class="roman">II.</span>
      <span class="sans">Current</span>
      <span class="serif">Role</span>
    </div>
    <div id="biz-current-role">
      <div class="biz-pi-empty">No Current Role right now. Go to Careers and apply.</div>
    </div>
  </div>
</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { bootstrapBusinessman } from './js/entrepreneur-topbar.js';
import { hfFmtBig, escapeHtml as esc, tickToDate } from './js/utils.js';
import { CONSTRUCTION_STAGES, JOB_TRACKS } from './js/game/corp-blueprints.js';

(async () => {
  try {
    const ctx = await bootstrapBusinessman('home');
    if (!ctx) return; // redirected (no auth / no businessman faction)
    const f = ctx.faction;

    // {City}: rolled uniformly at creation (biz_home_city, 20270789).
    // Capital fetch is only the fallback for a pre-backfill row.
    let city = f.biz_home_city || '—';
    if (!f.biz_home_city) {
      try {
        const { data, error } = await _supabase.from('nations')
          .select('capital').eq('id', f.nation_id).maybeSingle();
        if (error) throw error;
        city = data?.capital || '—';
      } catch (e) {
        console.warn('[businessman-home] capital fetch failed:', e?.message || e);
      }
    }

    const cash      = Number(f.party_funds) || 0;
    const resName   = f.biz_residence_name || '—';
    const resWorth  = Number(f.biz_residence_worth) || 0;
    // Debt: no businessman debt instruments exist yet — when loans
    // land, sum them here. Net worth = cash on hand + residence,
    // minus that (currently zero) debt.
    const debt      = 0;
    const netWorth  = cash + resWorth - debt;
    const place     = `${city}, ${f.nation || '—'}`;

    // Status is DERIVED, not hardcoded: Free/Under Arrest comes from
    // factions.status (the same flag the arrest lock uses). Warrants
    // and investigations have no businessman-targeting systems yet,
    // so they read their all-clear defaults — wire real queries here
    // when those mechanics land.
    // Occupation, in precedence order: a salaried job (the 20270799
    // employment record — set when a corp owner hires you), then corp
    // ownership ("Owner of {first corp}", +N more if several), then
    // Unemployed. Salary reads the same record: yearly ÷ 12 per tick.
    let occupationHtml = '<div class="val">Unemployed</div>';
    let salaryYearly = 0;
    let employerName = null;
    let ownedCorps = [];
    try {
      const [{ data: corps, error: ownErr }, employer] = await Promise.all([
        _supabase.from('entrepreneur_corps')
          .select('id, name').eq('owner_faction_id', f.id).order('created_at'),
        f.biz_employer_corp_id
          ? _supabase.from('entrepreneur_corps')
              .select('name').eq('id', f.biz_employer_corp_id).maybeSingle()
          : Promise.resolve({ data: null, error: null }),
      ]);
      if (ownErr) throw ownErr;
      if (employer.error) throw employer.error;
      const ownerSub = corps?.length
        ? `<div class="sub">Owner of ${esc(corps[0].name)}${corps.length > 1 ? ` +${corps.length - 1} more` : ''}</div>`
        : '';
      if (f.biz_job_title) {
        salaryYearly = Number(f.biz_salary_yearly) || 0;
        employerName = employer.data?.name || null;
        occupationHtml = `<div class="val">${esc(f.biz_job_title)}</div>`
          + (employerName ? `<div class="sub">at ${esc(employerName)}</div>` : '')
          + ownerSub;
      } else if (corps?.length) {
        occupationHtml = `<div class="val">Owner of ${esc(corps[0].name)}</div>`
          + (corps.length > 1 ? `<div class="sub">+${corps.length - 1} more</div>` : '');
      }
      ownedCorps = corps || [];
    } catch (e) {
      console.warn('[businessman-home] occupation fetch failed:', e?.message || e);
    }

    const arrested  = String(f.status || '').toLowerCase() === 'arrested';
    const statusHtml = arrested
      ? `<div class="biz-status-line bad">Under Arrest</div>
         <div class="biz-status-line">No Warrants</div>
         <div class="biz-status-line">No Active Investigations</div>`
      : `<div class="biz-status-line">Free</div>
         <div class="biz-status-line">No Warrants</div>
         <div class="biz-status-line">No Active Investigations</div>`;

    document.getElementById('biz-row').innerHTML = `
      <div class="biz-card">
        <div class="lab">CURRENT LOCATION</div>
        <div class="val">${esc(place)}</div>
      </div>
      <div class="biz-card">
        <div class="lab">RESIDENCE</div>
        <div class="val">${esc(resName)}</div>
        <div class="sub">${esc(place)} &middot; Worth: ${esc(hfFmtBig(resWorth))}</div>
      </div>
      <div class="biz-card">
        <div class="lab">DEBT</div>
        <div class="val money">${esc(hfFmtBig(debt))}</div>
      </div>
      <div class="biz-card">
        <div class="lab">NET WORTH</div>
        <div class="val money">${esc(hfFmtBig(netWorth))}</div>
        <div class="sub">cash + residence</div>
      </div>
      <div class="biz-card">
        <div class="lab">ASSETS</div>
        <div class="val ${arrested ? 'bad' : 'ok'}">${arrested ? 'Frozen' : 'Unfrozen'}</div>
      </div>
      <div class="biz-card">
        <div class="lab">STATUS</div>
        ${statusHtml}
      </div>
      <div class="biz-card">
        <div class="lab">OCCUPATION</div>
        ${occupationHtml}
      </div>
      <div class="biz-card">
        <div class="lab">SALARY</div>
        <div class="val money">${esc(hfFmtBig(Math.round(salaryYearly / 12)))}</div>
        <div class="sub">per tick${salaryYearly ? ` &middot; ${esc(hfFmtBig(salaryYearly))}/yr` : ''}</div>
      </div>`;

    // Pressing Issues — two sources share the container: open job
    // interviews (both sides of the table) and construction projects
    // in flight where this character is the assigned PM or the corp
    // owner (the 7-stage tracker, 20270808).
    const piCards = [];
    try {
      const { data: ivs, error: ivErr } = await _supabase.from('job_interviews')
        .select(`id, corp_id, owner_faction_id,
                 opening:job_openings!opening_id(title),
                 corp:entrepreneur_corps!corp_id(name)`)
        .or(`owner_faction_id.eq.${f.id},applicant_faction_id.eq.${f.id}`)
        .eq('status', 'open');
      if (ivErr) throw ivErr;
      for (const iv of (ivs || [])) {
        const interviewer = iv.owner_faction_id === f.id;
        const href = interviewer
          ? `business-corp.html?id=${encodeURIComponent(iv.corp_id)}`
          : 'businessman-career.html';
        piCards.push(`
          <a class="biz-pi-card" href="${esc(href)}">
            <div>
              <div class="t">JOB INTERVIEW — ${esc(iv.opening?.title || 'Role')} for ${esc(iv.corp?.name || '—')}</div>
              <div class="sub">${interviewer
                ? 'You are interviewing a candidate. Open the chat from your applicant board.'
                : 'An employer wants to talk to you. Open the chat from your Career page.'}</div>
            </div>
            <span class="go">${interviewer ? 'GO TO CORP →' : 'GO TO CAREER →'}</span>
          </a>`);
      }
    } catch (e) {
      console.warn('[businessman-home] interviews fetch failed:', e?.message || e);
    }

    try {
      const currentTick = Number(ctx.shard?.current_tick) || 0;
      const { data: projs, error: pjErr } = await _supabase.from('corp_construction_projects')
        .select(`id, city, started_tick, completes_at_tick, materials_supplied, equipment_supplied,
                 blueprint:corp_blueprints!blueprint_id(name, building_type, materials_needed),
                 corp:entrepreneur_corps!corp_id(name, owner_faction_id),
                 pm:job_applicants!pm_applicant_id(applicant_faction_id)`)
        .eq('status', 'building');
      if (pjErr) throw pjErr;
      const mine = (projs || []).filter(p =>
        p.pm?.applicant_faction_id === f.id || p.corp?.owner_faction_id === f.id);
      for (const p of mine) {
        const total   = Math.max(1, p.completes_at_tick - p.started_tick);
        const elapsed = Math.min(total, Math.max(0, currentTick - p.started_tick));
        const stageIdx = Math.min(CONSTRUCTION_STAGES.length - 1,
          Math.floor((elapsed / total) * CONSTRUCTION_STAGES.length));
        const remaining = Math.max(0, p.completes_at_tick - currentTick);
        const cur = CONSTRUCTION_STAGES[stageIdx];
        // Materials gate completion (20270817): a due build parks
        // until supplied — say so instead of a misleading countdown.
        const need = Number(p.blueprint?.materials_needed) || 0;
        const got  = Number(p.materials_supplied) || 0;
        const hasEq = Number(p.equipment_supplied) >= 1;
        const parked = remaining === 0 && (got < need || !hasEq);
        piCards.push(`
          <div class="biz-proj-card">
            <div class="t">${esc(p.blueprint?.name || 'Construction')} Project in ${esc(p.city)}.
              <span class="due">${parked
                ? `AWAITING ${got < need ? `MATERIALS (${got}/${need})` : ''}${got < need && !hasEq ? ' + ' : ''}${!hasEq ? 'EQUIPMENT' : ''} — run Procurement`
                : `Expected Completion Date: ${esc(tickToDate(p.completes_at_tick))}
                   (${remaining} tick${remaining === 1 ? '' : 's'} remaining) · Materials ${got}/${need} · Equipment ${hasEq ? '✓' : '—'}`}</span></div>
            <div class="stages">
              ${CONSTRUCTION_STAGES.map((s, i) => `
                <div class="stage${i < stageIdx ? ' done' : i === stageIdx ? ' cur' : ''}" title="${esc(s.phase)} — ${esc(s.desc)}">
                  <div class="n">${i + 1}</div>
                  <div class="s">${esc(s.name)}</div>
                </div>`).join('')}
            </div>
            <div class="stage-desc"><b>${esc(cur.phase)}.</b> ${esc(cur.desc)}</div>
          </div>`);
      }
    } catch (e) {
      console.warn('[businessman-home] projects fetch failed:', e?.message || e);
    }

    if (piCards.length) {
      document.getElementById('biz-pressing-issues').innerHTML = piCards.join('');
    }

    // Current Role — a salaried job renders the employment card; the
    // track derives from which JOB_TRACKS ladder holds the title.
    // Operations gets its three greyed field actions; Leadership has
    // none specced yet, so its card is the role brief alone. Owning a
    // corporation IS a role too, so owners get an ownership card per
    // corp pointing at the Executive Actions desk. Only with neither
    // does the "go apply" empty state stand.
    if (f.biz_job_title) {
      const isLeadership = JOB_TRACKS.leadership.some(r => r.name === f.biz_job_title);
      const ROLE_DESCS = {
        'Project Manager (PM)':
          'You run the job site — schedules, subcontractors, inspections. The owner sets direction; you make the building happen.',
        'Senior Project Manager':
          'You carry the flagship contracts and keep several sites moving at once — the owner hears about problems only after you’ve solved them.',
        'Regional Director of Operations':
          'Every project manager in the region answers to you. You set the build tempo, settle disputes, and answer for the margins.',
      };
      const desc = isLeadership
        ? JOB_TRACKS.leadership.find(r => r.name === f.biz_job_title).desc
        : (ROLE_DESCS[f.biz_job_title] || 'You work the Operations track. Do the job well and the ladder is yours to climb.');
      document.getElementById('biz-current-role').innerHTML = `
        <div class="cr-card">
          <div class="cr-head">
            <div class="cr-tier">EMPLOYMENT &middot; ${isLeadership ? 'LEADERSHIP' : 'OPERATIONS'}</div>
            <div class="cr-title">${esc(f.biz_job_title)} for ${esc(employerName || '—')}</div>
            <div class="cr-desc">${esc(desc)}</div>
          </div>
          ${isLeadership ? '' : `
          <div class="cr-actions-label">REPEATABLE ACTIONS &middot; PICK ONE EACH TICK</div>
          <div class="cr-actions">
            <div class="cr-act" title="Coming soon">
              <div class="nm">ADVANCE CONSTRUCTION</div>
              <div class="ds">Push the active project forward a stage — keep the schedule honest and the contract on time.</div>
            </div>
            <div class="cr-act" title="Coming soon">
              <div class="nm">SOURCE MATERIALS</div>
              <div class="ds">Hunt down steel, concrete, and lumber at better prices to stretch the project budget.</div>
            </div>
            <div class="cr-act" title="Coming soon">
              <div class="nm">SCHEDULE CREWS</div>
              <div class="ds">Line up the right crews for the next phase so no one stands around on the clock.</div>
            </div>
          </div>`}
        </div>`;
    } else if (ownedCorps.length) {
      document.getElementById('biz-current-role').innerHTML = ownedCorps.map(c => `
        <div class="cr-card" style="margin-bottom:10px;">
          <div class="cr-head">
            <div class="cr-tier">OWNERSHIP &middot; EXECUTIVE</div>
            <div class="cr-title">Owner of ${esc(c.name)}</div>
            <div class="cr-desc">You sit at the top of the org chart — hiring, blueprints,
              bids, and builds are all run from the corporation&rsquo;s Executive Actions desk.</div>
          </div>
          <div class="cr-foot">
            <a class="cr-go" href="business-corp.html?id=${encodeURIComponent(c.id)}">GO TO CORPORATION &rarr;</a>
          </div>
        </div>`).join('');
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('page-content').style.display = 'block';
  } catch (err) {
    console.error('businessman-home: bootstrap failed', err);
    document.getElementById('loading').textContent = 'FAILED TO LOAD — PLEASE REFRESH';
  }
})();
</script>
</body>
</html>
