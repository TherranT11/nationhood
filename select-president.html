<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select President | Nationhood Alpha</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/select-president.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="top-bar"></div>

<div id="content-area">
    <div class="pm-page" id="pm-page">
        <div class="pm-loading">
            <div class="loading-spinner"></div>
            <div>Loading candidates...</div>
        </div>
    </div>
</div>

<script type="module">

import { _supabase } from './js/supabase-client.js';
import { initPage } from './js/common.js';
import { initGameConfigForNation, selectPresidentCandidate, GAME_CONFIG, isPresidentialRepublic } from './js/game-common.js';
let currentNation = null;
let currentFaction = null;
let candidates = [];
let traits = {};
let selectedCandidateId = null;

initPage('government', async (state) => {
    const { nation, faction } = state;
    currentNation = nation;
    currentFaction = faction;

    if (!nation || !faction) {
        renderEmpty('No nation or party found.');
        return;
    }

    if (!isPresidentialRepublic(nation)) {
        renderEmpty('This page is only for Presidential Democracies. <a href="government.html">Back to Government</a>');
        return;
    }

    // Load traits
    const { data: traitRows } = await _supabase
        .from('leader_traits')
        .select('*');
    (traitRows || []).forEach(t => { traits[t.trait_key] = t; });

    // Load unselected presidential candidates for this faction
    const { data: candidateRows } = await _supabase
        .from('pm_candidates')
        .select('*')
        .eq('nation_id', nation.id)
        .eq('faction_id', faction.id)
        .eq('candidate_type', 'presidential')
        .eq('selected', false)
        .order('created_at', { ascending: true });

    candidates = candidateRows || [];

    if (candidates.length === 0) {
        // Check if already nominated
        const { data: nominated } = await _supabase
            .from('pm_candidates')
            .select('id')
            .eq('nation_id', nation.id)
            .eq('faction_id', faction.id)
            .eq('candidate_type', 'presidential')
            .eq('selected', true)
            .limit(1)
            .maybeSingle();

        if (nominated) {
            renderEmpty('You have already nominated your presidential candidate. <a href="government.html">View Government</a>');
        } else {
            renderEmpty('No candidates available yet. Presidential nominees are generated 6 months before the election.');
        }
        return;
    }

    // Load upcoming election info and current tick for display
    const { data: upcomingElection } = await _supabase
        .from('elections')
        .select('election_tick')
        .eq('nation_id', nation.id)
        .eq('status', 'scheduled')
        .eq('election_type', 'presidential')
        .order('election_tick', { ascending: true })
        .limit(1)
        .maybeSingle();
    const { data: shard } = await _supabase
        .from('shard')
        .select('current_tick')
        .eq('name', 'Alpha Shard')
        .single();
    window._upcomingElectionTick = upcomingElection?.election_tick || null;
    window._currentTick = shard?.current_tick || 0;

    renderCandidates();
});

function getIdeologyClass(tag) {
    return 'ideo-' + (tag || '').toLowerCase();
}

function renderCandidates() {
    const page = document.getElementById('pm-page');

    const cardsHTML = candidates.map(c => {
        const trait = traits[c.trait_key] || {};
        const ideoClass = getIdeologyClass(c.ideology);

        return `
            <div class="pm-card" id="card-${c.id}" onclick="selectCandidate('${c.id}')">
                <div class="pm-card-header">
                    <div class="pm-card-avatar">🏛</div>
                    <div class="pm-card-name">${c.first_name} ${c.last_name}</div>
                    <div class="pm-card-age">Age ${c.age}</div>
                </div>

                <div class="pm-card-ideology">
                    <div class="pm-ideology-label">Ideology</div>
                    <div class="pm-ideology-tag ${ideoClass}">${c.ideology}</div>
                    <div class="pm-ideology-shift">+15 shift toward ${c.ideology.charAt(0) + c.ideology.slice(1).toLowerCase()} if elected</div>
                </div>

                <div class="pm-card-trait">
                    <div class="pm-trait-label">Leader Trait</div>
                    <div class="pm-trait-name">${trait.trait_name || c.trait_key}</div>
                    <div class="pm-trait-desc">${trait.description || ''}</div>
                    <div class="pm-trait-effect upside">${trait.upside || 'Unknown'}</div>
                    <div class="pm-trait-effect downside">${trait.downside || 'Unknown'}</div>
                </div>

                <div class="pm-card-footer">
                    <div class="pm-select-indicator">Select</div>
                </div>
            </div>
        `;
    }).join('');

    const ticksRemaining = window._upcomingElectionTick && window._currentTick
        ? window._upcomingElectionTick - window._currentTick
        : null;
    const ticksUntil = ticksRemaining && ticksRemaining > 0
        ? `Election in ${ticksRemaining} month${ticksRemaining !== 1 ? 's' : ''}`
        : '';

    page.innerHTML = `
        <div class="pm-header">
            <span class="pm-header-icon">🏛</span>
            <h1>Select Your Candidate</h1>
            <p>Choose your party's presidential nominee for the upcoming election. Your candidate will compete against nominees from other parties in the popular vote.</p>
            <div class="pm-party-badge">
                <div class="pm-party-dot"></div>
                <span>Nominating for <strong>${currentFaction.faction_name}</strong></span>
            </div>
            ${ticksUntil ? `<div style="color:var(--text-secondary);font-size:0.8rem;margin-top:8px;">${ticksUntil}</div>` : ''}
        </div>

        <div class="pm-candidates" id="pm-candidates">
            ${cardsHTML}
        </div>

        <div class="pm-confirm-section" id="pm-confirm-section">
            <div class="pm-confirm-summary" id="pm-confirm-summary">Select a candidate above</div>
            <button class="pm-confirm-btn" id="pm-confirm-btn" disabled onclick="confirmSelection()">
                Nominate Candidate
            </button>
            <div class="pm-confirm-warning">This choice is permanent. Your nominee will run in the presidential election.</div>
        </div>
    `;
}

function selectCandidate(candidateId) {
    selectedCandidateId = candidateId;

    document.querySelectorAll('.pm-card').forEach(el => el.classList.remove('selected'));
    document.getElementById('card-' + candidateId).classList.add('selected');

    const candidate = candidates.find(c => c.id === candidateId);
    const trait = traits[candidate.trait_key] || {};

    document.getElementById('pm-confirm-summary').innerHTML =
        `Nominate <strong>${candidate.first_name} ${candidate.last_name}</strong> — ` +
        `<span style="color:var(--accent)">${trait.trait_name || candidate.trait_key}</span> · ` +
        `${candidate.ideology}`;

    document.getElementById('pm-confirm-btn').disabled = false;
}

async function confirmSelection() {
    if (!selectedCandidateId) return;

    const candidate = candidates.find(c => c.id === selectedCandidateId);
    const trait = traits[candidate.trait_key] || {};

    if (!confirm(
        `Nominate ${candidate.first_name} ${candidate.last_name} as your presidential candidate?\n\n` +
        `Ideology: ${candidate.ideology}\n` +
        `Trait: ${trait.trait_name || candidate.trait_key}\n` +
        `  ${trait.upside || ''}\n` +
        `  ${trait.downside || ''}\n\n` +
        `This choice is permanent. If your party wins the election, this candidate becomes President.`
    )) return;

    const btn = document.getElementById('pm-confirm-btn');
    btn.disabled = true;
    btn.textContent = 'Nominating...';

    try {
        const { data: shard } = await _supabase
            .from('shard')
            .select('current_tick')
            .eq('name', 'Alpha Shard')
            .single();

        await selectPresidentCandidate(
            _supabase,
            selectedCandidateId,
            currentNation.id,
            currentFaction.id,
            shard?.current_tick || 0
        );

        alert(`${candidate.first_name} ${candidate.last_name} has been nominated as your presidential candidate!`);
        window.location.href = 'government.html';

    } catch (e) {
        console.error('Error nominating candidate:', e);
        alert('Error: ' + e.message);
        btn.disabled = false;
        btn.textContent = 'Nominate Candidate';
    }
}

function renderEmpty(message) {
    document.getElementById('pm-page').innerHTML = `
        <div class="pm-empty">
            <span style="font-size:3rem;display:block;margin-bottom:16px;opacity:0.3;">🏛</span>
            <h3>Presidential Selection</h3>
            <p>${message}</p>
        </div>
    `;
}


// Expose functions for HTML onclick/onchange handlers
window.selectCandidate = selectCandidate;
window.confirmSelection = confirmSelection;
</script>
</body>
</html>
