<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home | Nationhood Alpha</title>

<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/news.css">
<link rel="stylesheet" href="css/radio.css">

<!-- Fonts: news page needs Playfair Display, Source Serif 4, Inter, Outfit, Noto Sans -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500&family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;600;700;800;900&family=Noto+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

<style>
/* ── Home subtab bar ── */
.home-subtabs {
    display: flex;
    gap: 0;
    padding: 0 22px;
    background: var(--bg-body);
    border-bottom: 1px solid var(--border-main);
    /* Horizontal scroll fallback if more subtabs land later. */
    overflow-x: auto;
    scrollbar-width: none;
}
.home-subtabs::-webkit-scrollbar { display: none; }
.home-subtab {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 9px 18px;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: color 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
}
.home-subtab:hover {
    color: var(--text-secondary);
}
.home-subtab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
}

/* ── Content panels ── */
.home-panel { display: none; }
.home-panel.active { display: block; flex: 1; overflow-y: auto; min-height: 0; }

/* ── Broadcast placeholder (until Phase 3) ── */
.broadcast-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    text-align: center;
    color: var(--text-secondary);
    padding: 40px 20px;
}
.broadcast-placeholder-icon {
    font-size: 2.5rem;
    margin-bottom: 16px;
    opacity: 0.4;
}
.broadcast-placeholder-title {
    font-family: var(--font-mono);
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
}
.broadcast-placeholder-desc {
    font-size: 0.85rem;
    color: var(--text-muted);
    max-width: 400px;
    line-height: 1.5;
}

/* ── Mobile ──
   Bigger tap targets (≥44px per WCAG 2.5.5); stacked top bar on phones is
   taller, so don't lean on calc(100vh - N) for placeholder height. */
@media (max-width: 768px) {
    .home-subtabs { padding: 0 12px; }
    .home-subtab { padding: 12px 16px; font-size: 11px; }
}
@media (max-width: 480px) {
    .home-subtabs { padding: 0 8px; }
    .home-subtab { padding: 12px 14px; font-size: 10px; letter-spacing: 0.08em; }
    .broadcast-placeholder { min-height: 50vh; padding: 28px 16px; }
    .broadcast-placeholder-icon { font-size: 2rem; }
}
</style>
</head>

<body>

<!-- Top bar rendered by common.js -->
<div id="top-bar"></div>

<!-- Subtab bar: NEWS / BROADCAST -->
<div class="home-subtabs" id="home-subtabs">
    <button class="home-subtab active" data-panel="news" id="subtab-news">News</button>
    <button class="home-subtab" data-panel="broadcast" id="subtab-broadcast">Broadcast</button>
</div>

<!-- NEWS panel — newspaper content (rendered by news.js) -->
<div class="home-panel active" id="panel-news">
    <div id="newspaper-root"></div>
</div>

<!-- BROADCAST panel — radio system -->
<div class="home-panel" id="panel-broadcast">
    <div id="broadcast-root">
        <div style="display:flex;align-items:center;justify-content:center;min-height:300px;color:var(--text-dim);font-family:var(--font-mono);font-size:10px;">Loading radio...</div>
    </div>
</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { initPage } from './js/common.js';
import { initNewspaper } from './js/news.js';
import { initRadio } from './js/radio.js';

let _state = null;
let _newsInitialized = false;
let _radioInitialized = false;

// Subtab switching
function switchPanel(panelKey) {
    document.querySelectorAll('.home-subtab').forEach(t => t.classList.toggle('active', t.dataset.panel === panelKey));
    document.querySelectorAll('.home-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + panelKey));
    sessionStorage.setItem('home_subtab', panelKey);

    // Lazy-init news on first switch back (if user started on broadcast)
    if (panelKey === 'news' && !_newsInitialized && _state) {
        _newsInitialized = true;
        initNewspaper(_supabase, _state);
    }

    // Lazy-init radio on first switch to broadcast
    if (panelKey === 'broadcast' && !_radioInitialized && _state) {
        _radioInitialized = true;
        initRadio(_supabase, _state);
    }
}

document.getElementById('home-subtabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.home-subtab');
    if (!btn || btn.classList.contains('active')) return;
    switchPanel(btn.dataset.panel);
});

initPage('dashboard', async (state) => {
    _state = state;

    // Restore last active subtab
    const saved = sessionStorage.getItem('home_subtab');
    if (saved === 'broadcast') {
        switchPanel('broadcast');
    } else {
        // Default: init news immediately
        _newsInitialized = true;
        await initNewspaper(_supabase, state);
    }
});
</script>

</body>
</html>
