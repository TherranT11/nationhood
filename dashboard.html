<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home | Nationhood Alpha</title>

<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/map.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<style>
  #content-area {
    margin: 16px 20px;
    padding: 20px 20px 20px 0;
    overflow-x: auto !important;
  }
  .dash-layout {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }
  .dash-left-col {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .dash-row {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }

  /* ── Nation Card ── */
  .dash-card {
    background: var(--bg-panel);
    border: 1px solid var(--border-main);
    border-radius: 8px;
    overflow: hidden;
    width: 380px;
    height: 520px;
  }
  .dash-card-header {
    background: var(--bg-card);
    padding: 10px 20px;
    margin-bottom: 14px;
    font-size: 0.9rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-secondary);
    text-align: center;
  }

  /* ── Tabbed card header ── */
  .dash-card-tabs {
    display: flex;
    gap: 0;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border-main);
    margin-bottom: 14px;
  }
  .dash-card-tab {
    flex: 1;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-secondary);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 10px 18px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .dash-card-tab:hover { color: var(--text-primary); }
  .dash-card-tab.active {
    color: var(--text-primary);
    border-bottom-color: var(--text-primary);
  }
  .dash-tab-pane { display: none; }
  .dash-tab-pane.active { display: block; }

  /* ── Events list ── */
  .dash-events-scroll {
    overflow-y: auto;
    padding: 0 14px 14px;
    flex: 1;
  }
  .dash-event-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 7px 6px;
    border-bottom: 1px solid var(--border-main);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
  }
  .dash-event-date {
    color: var(--text-secondary);
    min-width: 70px;
    flex-shrink: 0;
    opacity: 0.6;
  }
  .dash-event-icon {
    flex-shrink: 0;
    font-size: 0.72rem;
  }
  .dash-event-text {
    color: var(--text-primary);
    flex: 1;
    line-height: 1.4;
  }
  .dash-event-category {
    font-size: 0.6rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 1px 5px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .dash-card-body {
    padding: 6px 20px 20px;
  }

  .nation-identity {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    margin-bottom: 24px;
  }
  .nation-flag-box {
    width: 80px;
    height: 56px;
    background: var(--bg-card);
    border: 1px solid var(--border-main);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .nation-flag-box img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  .nation-flag-box .abbr-fallback {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 0.05em;
  }
  .nation-identity h2 {
    font-family: 'IBM Plex Serif', serif;
    font-size: 1.35rem;
    font-weight: 600;
    color: var(--text-primary);
  }
  .nation-identity .motto {
    font-family: 'IBM Plex Serif', serif;
    font-style: italic;
    font-size: 0.9rem;
    color: var(--text-secondary);
  }

  .nation-stats-list {
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .nation-stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 4px;
    border-top: 1px solid var(--border-light);
    font-size: 0.9rem;
  }
  .nation-stat-row:last-child {
    padding-bottom: 0;
  }
  .nation-stat-row .label {
    color: var(--text-secondary);
  }
  .nation-stat-row .value {
    color: var(--text-primary);
    font-weight: 500;
    text-align: right;
  }

  /* ── Government Card ── */
  .gov-admin-name {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 6px;
  }
  .gov-badges {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }
  .gov-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 3px 8px;
    border-radius: 3px;
    border: 1px solid var(--border-main);
    color: var(--text-primary);
    background: var(--bg-card);
  }
  .gov-leader-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 8px;
  }
  .gov-initials {
    width: 28px;
    height: 28px;
    border-radius: 4px;
    background: var(--bg-card);
    border: 1px solid var(--border-main);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--text-secondary);
    flex-shrink: 0;
  }
  .gov-leader-name {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--text-primary);
  }
  .gov-leader-meta {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.72rem;
    color: var(--text-secondary);
    margin-top: 1px;
  }
  .gov-leader-party {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 3px;
  }
  .gov-party-dot {
    width: 7px;
    height: 7px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .gov-party-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    font-weight: 500;
  }
  .gov-section-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .gov-divider {
    height: 1px;
    background: var(--border-light);
    margin: 10px 0;
  }
  .gov-seat-bar {
    display: flex;
    height: 10px;
    border-radius: 3px;
    overflow: hidden;
    background: rgba(255,255,255,0.04);
    margin-bottom: 6px;
  }
  .gov-seat-segment {
    height: 100%;
  }
  .gov-coalition-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
  }
  .gov-coalition-name {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.78rem;
    color: var(--text-primary);
    flex: 1;
  }
  .gov-coalition-seats {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    font-weight: 600;
  }
  .gov-seats-combined {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    color: var(--text-muted);
    text-align: right;
    margin-top: 2px;
  }
  .gov-approval-big {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.6rem;
    font-weight: 700;
    line-height: 1;
  }
  .gov-footer {
    background: var(--bg-card);
    border-top: 1px solid var(--border-main);
    margin: 0;
    padding: 8px 20px 8px 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .gov-footer-label {
    text-transform: uppercase;
  }
  .gov-footer-detail {
    color: var(--text-muted);
    font-weight: 400;
  }

  /* ── Elections Card ── */
  .election-item {
    border-left: 3px solid #888;
    padding: 8px 14px;
    margin-bottom: 12px;
  }
  .election-item.midterm { border-left-color: #e8a435; }
  .election-item.presidential { border-left-color: #e05c4d; }
  .election-item.parliamentary { border-left-color: #4da6e0; }
  .election-item-type {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-primary);
  }
  .election-item-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .elections-suspended {
    font-style: italic;
    color: var(--text-secondary);
    font-size: 0.9rem;
    padding: 20px 0;
  }
</style>
</head>

<body>

<!-- Top bar rendered by common.js -->
<div id="top-bar"></div>

<div id="content-area">
  <div class="dash-layout">

    <!-- ── Left Column ── -->
    <div class="dash-left-col">
      <div class="dash-row">

        <!-- ── Nation Card ── -->
        <div class="dash-card" id="nation-card">
          <div class="dash-card-header">NATION</div>
          <div class="dash-card-body">
          <div class="nation-identity">
            <div class="nation-flag-box" id="nation-flag-box">
              <span class="abbr-fallback" id="nation-abbr"></span>
            </div>
            <h2 id="nation-name"></h2>
            <div class="motto" id="nation-motto"></div>
          </div>
          <div class="nation-stats-list" id="nation-stats-list"></div>
          </div>
        </div>

        <!-- ── Government Card ── -->
        <div class="dash-card" id="gov-card">
          <div class="dash-card-header">GOVERNMENT</div>
          <div class="dash-card-body" id="gov-card-body">
            <div style="display:flex;align-items:center;justify-content:center;height:340px;color:var(--text-secondary);font-size:0.85rem;">Loading government&hellip;</div>
          </div>
        </div>

      </div>

      <!-- ── Elections + Events Row ── -->
      <div class="dash-row">
        <div class="dash-card" id="elections-card">
          <div class="dash-card-header">ELECTIONS</div>
          <div class="dash-card-body" id="elections-card-body"></div>
        </div>

        <div class="dash-card" id="events-card" style="display:flex;flex-direction:column;">
          <div class="dash-card-header">EVENTS</div>
          <div class="dash-events-scroll" id="dash-events-list"></div>
        </div>
      </div>

    </div>

    <!-- ── Right Column: World Map ── -->
    <div class="dash-card" id="world-map-card" style="flex:1; min-width:760px; height:900px;">
      <div class="dash-card-header">WORLD MAP</div>
      <div class="dash-card-body" id="world-map-body" style="padding:0; flex:1; overflow:hidden;">
        <img src="./assets/World Map Crucera3.svg" alt="World Map" style="width:100%; height:100%; object-fit:fill; display:block;">
      </div>
    </div>

  </div>
</div>

<script type="module">
import { initPage, formatNumber } from './js/common.js';
import './js/guide.js';
import { _supabase } from './js/supabase-client.js';
import { fetchActiveCoalition } from './js/game/government-structure.js';
import { isPresidentialRepublic, isAutocracy, isParliamentaryDemocracy } from './js/game/government-types.js';
import { tickToDate, MONTHS } from './js/utils.js';

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

initPage('home', async (state) => {
  const { nation } = state;

  // Fetch nation profile for flag, motto, founded_year, languages
  const { data: profiles } = await _supabase
    .from('nation_profiles')
    .select('flag_url, motto, founded_year, languages')
    .eq('nation_id', nation.id)
    .limit(1);
  const profile = (profiles && profiles.length > 0) ? profiles[0] : {};

  // ── Flag (same source as top bar: nation.flag_url) ──
  const flagBox = document.getElementById('nation-flag-box');
  if (nation.flag_url) {
    const img = document.createElement('img');
    img.src = nation.flag_url;
    img.alt = nation.name + ' flag';
    flagBox.innerHTML = '';
    flagBox.appendChild(img);
  } else {
    document.getElementById('nation-abbr').textContent =
      nation.name.split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 3);
  }

  // ── Name & Motto ──
  document.getElementById('nation-name').textContent = nation.name;

  const motto = profile.motto || generateMotto(nation.name);
  document.getElementById('nation-motto').textContent = '\u201C' + motto + '\u201D';

  // ── Stats rows ──
  const rows = [
    { label: 'Established', value: profile.founded_year || '\u2014' },
    { label: 'Government', value: nation.government_type || '\u2014' },
    { label: 'Capital', value: nation.capital || '\u2014' },
    { label: 'Language', value: profile.languages || 'Estrellan' },
    { label: 'Population', value: formatNumber(nation.population) },
  ];

  const list = document.getElementById('nation-stats-list');
  list.innerHTML = rows.map(r =>
    `<div class="nation-stat-row">
       <span class="label">${r.label}</span>
       <span class="value">${r.value}</span>
     </div>`
  ).join('');

  // ══════════════════════════════════════
  // ── Government Card ──
  // ══════════════════════════════════════
  try {
    const isPres = isPresidentialRepublic(nation);
    const isAuto = isAutocracy(nation);

    // Parallel data fetches (including previous-tick approval to avoid sequential round-trip)
    const [
      { data: allParties },
      { data: shardRow },
      { data: administration },
      coalitionResult,
      presidentResult,
      prevApprovalResult
    ] = await Promise.all([
      _supabase.from('factions')
        .select('id, seats, faction_name, abbreviation, party_color')
        .eq('nation_id', nation.id)
        .eq('faction_type', 'party'),
      _supabase.from('shard')
        .select('current_tick')
        .eq('name', 'Alpha Shard')
        .single(),
      _supabase.from('administrations')
        .select('admin_name, government_type, coalition_parties, total_seats, started_at_tick')
        .eq('nation_id', nation.id)
        .is('ended_at_tick', null)
        .order('started_at_tick', { ascending: false })
        .limit(1)
        .maybeSingle(),
      fetchActiveCoalition(_supabase, nation.id),
      isPres
        ? _supabase.from('presidents')
            .select('id, faction_id, first_name, last_name, age, terms_served, elected_tick, term_ends_tick, is_active')
            .eq('nation_id', nation.id)
            .eq('is_active', true)
            .order('elected_tick', { ascending: false })
            .limit(1)
            .maybeSingle()
        : Promise.resolve({ data: null }),
      _supabase.from('nations_history')
        .select('gov_approval')
        .eq('nation_id', nation.id)
        .order('tick', { ascending: false })
        .limit(1)
        .maybeSingle()
    ]);

    const coalition = coalitionResult;
    const president = presidentResult?.data ?? presidentResult;
    const currentTick = shardRow?.data?.current_tick ?? shardRow?.current_tick ?? 0;
    const parties = allParties || [];
    const govCard = document.getElementById('gov-card');

    // Empty state: no active coalition
    if (!coalition) {
      document.getElementById('gov-card-body').innerHTML = `
        <div style="display:flex;align-items:center;justify-content:center;height:340px;color:var(--text-secondary);font-style:italic;font-size:0.9rem;">
          Government is currently being formed
        </div>
      `;
      return;
    }

    // Previous approval for delta (already fetched in parallel)
    const prevApproval = prevApprovalResult?.data?.gov_approval ?? null;

    // ── Compute values ──
    const approval = Math.round(Number(nation.gov_approval ?? 50));
    const approvalColor = approval >= 50 ? 'var(--green)' : approval >= 35 ? 'var(--orange)' : 'var(--red)';
    // Strip any trailing ", YYYY" from stored admin_name to avoid duplication
    const rawAdminName = administration?.admin_name || 'Government';
    const adminName = rawAdminName.replace(/,\s*\d{4}$/, '');
    const startYear = (administration?.started_at_tick != null) ? 2000 + Math.floor(administration.started_at_tick / 12) : null;
    const currentYear = 2000 + Math.floor(currentTick / 12);
    let yearSuffix = '';
    if (startYear != null) {
      if (currentYear > startYear) {
        yearSuffix = `, ${startYear}-${currentYear}`;
      } else {
        yearSuffix = `, ${startYear}`;
      }
    }

    // Gov type badge
    const govTypeLabel = isAuto ? 'Autocracy' : isPres ? 'Presidential' : 'Parliamentary';

    // Coalition info
    const coalitionIds = new Set(coalition?.party_ids || []);
    const governing = parties.filter(p => coalitionIds.has(p.id));
    const govSeats = governing.reduce((s, p) => s + (p.seats || 0), 0);
    const totalSeats = parties.reduce((s, p) => s + (p.seats || 0), 0);
    const majority = Math.ceil(totalSeats / 2);
    const isMajority = govSeats >= majority;

    // Coalition type badge
    const coalitionBadge = governing.length > 1 ? 'Coalition' : governing.length === 1 ? 'Single Party' : '';

    // ── Leader 1 (President or PM) ──
    let leader1Html = '';
    if (isPres && president) {
      const presParty = parties.find(p => p.id === president.faction_id);
      const presColor = presParty?.party_color || '#888';
      const presAbbr = presParty?.abbreviation || (presParty?.faction_name || '??').substring(0, 3).toUpperCase();
      const termOrd = president.terms_served > 1 ? (president.terms_served === 2 ? '2nd' : president.terms_served + 'th') : '1st';
      const initials = ((president.first_name || '?')[0] + (president.last_name || '?')[0]).toUpperCase();
      leader1Html = `
        <div class="gov-leader-row">
          <div class="gov-initials">${esc(initials)}</div>
          <div>
            <div class="gov-leader-name">${esc(president.first_name + ' ' + president.last_name)}</div>
            <div class="gov-leader-meta">President &middot; Age ${president.age || '?'} &middot; ${termOrd} Term</div>
            <div class="gov-leader-party">
              <div class="gov-party-dot" style="background:${presColor}"></div>
              <span class="gov-party-label" style="color:${presColor}">${esc(presAbbr)}</span>
            </div>
          </div>
        </div>`;
    } else if (!isPres && !isAuto && coalition) {
      // Parliamentary: PM from lead party
      const leadParty = parties.find(p => p.id === coalition.lead_party_id);
      const pmColor = leadParty?.party_color || '#888';
      const pmName = leadParty?.faction_name || 'Unknown';
      const pmAbbr = leadParty?.abbreviation || pmName.substring(0, 3).toUpperCase();
      const initials = pmName.split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2);
      leader1Html = `
        <div class="gov-leader-row">
          <div class="gov-initials">${esc(initials)}</div>
          <div>
            <div class="gov-leader-name">${esc(pmName)}</div>
            <div class="gov-leader-meta">Prime Minister</div>
            <div class="gov-leader-party">
              <div class="gov-party-dot" style="background:${pmColor}"></div>
              <span class="gov-party-label" style="color:${pmColor}">${esc(pmAbbr)}</span>
            </div>
          </div>
        </div>`;
    } else if (isAuto) {
      const hosName = (nation.head_of_state_first_name && nation.head_of_state_last_name)
        ? nation.head_of_state_first_name + ' ' + nation.head_of_state_last_name : 'Unknown';
      const initials = ((nation.head_of_state_first_name || '?')[0] + (nation.head_of_state_last_name || '?')[0]).toUpperCase();
      const rulingParty = nation.ruling_faction_id ? parties.find(p => p.id === nation.ruling_faction_id) : null;
      const rpColor = rulingParty?.party_color || '#c8a64e';
      const rpAbbr = rulingParty?.abbreviation || (rulingParty?.faction_name || '??').substring(0, 3).toUpperCase();
      leader1Html = `
        <div class="gov-leader-row">
          <div class="gov-initials">${esc(initials)}</div>
          <div>
            <div class="gov-leader-name">${esc(hosName)}</div>
            <div class="gov-leader-meta">Generalísimo${nation.head_of_state_age ? ' &middot; Age ' + nation.head_of_state_age : ''}</div>
            <div class="gov-leader-party">
              <div class="gov-party-dot" style="background:${rpColor}"></div>
              <span class="gov-party-label" style="color:${rpColor}">${esc(rpAbbr)}</span>
            </div>
          </div>
        </div>`;
    }

    // ── Leader 2 (VP or Head of State) ──
    let leader2Html = '';
    const hosFirst = nation.head_of_state_first_name || '';
    const hosLast = nation.head_of_state_last_name || '';
    if (isPres && hosFirst && hosLast) {
      const initials = (hosFirst[0] + hosLast[0]).toUpperCase();
      leader2Html = `
        <div class="gov-leader-row">
          <div class="gov-initials">${esc(initials)}</div>
          <div>
            <div class="gov-leader-name">${esc(hosFirst + ' ' + hosLast)}</div>
            <div class="gov-leader-meta">Vice President</div>
          </div>
        </div>`;
    } else if (!isPres && !isAuto && hosFirst && hosLast) {
      const initials = (hosFirst[0] + hosLast[0]).toUpperCase();
      leader2Html = `
        <div class="gov-leader-row">
          <div class="gov-initials">${esc(initials)}</div>
          <div>
            <div class="gov-leader-name">${esc(hosFirst + ' ' + hosLast)}</div>
            <div class="gov-leader-meta">Head of State</div>
          </div>
        </div>`;
    }

    // ── Coalition bar ──
    const sortedGov = [...governing].sort((a, b) => (b.seats || 0) - (a.seats || 0));
    const barHtml = totalSeats > 0
      ? sortedGov.map(p => {
          const pct = ((p.seats || 0) / totalSeats) * 100;
          if (pct <= 0) return '';
          return `<div class="gov-seat-segment" style="width:${pct.toFixed(2)}%;background:${p.party_color || '#8a8778'}"></div>`;
        }).join('')
      : '';

    // ── Coalition party rows ──
    const partyRowsHtml = sortedGov.map(p =>
      `<div class="gov-coalition-row">
        <div class="gov-party-dot" style="background:${p.party_color || '#8a8778'}"></div>
        <span class="gov-coalition-name">${esc(p.faction_name || 'Unknown')}</span>
        <span class="gov-coalition-seats" style="color:${p.party_color || 'var(--text-primary)'}">${p.seats || 0}</span>
      </div>`
    ).join('');

    // ── Footer ──
    const govLabel = isMajority ? 'Majority Government' : 'Minority Government';
    const footerDetail = `${govSeats}/${totalSeats} seats (${majority} needed)`;

    // ── Build card ──
    document.getElementById('gov-card-body').innerHTML = `
      <div class="gov-admin-name">${esc(adminName)}${yearSuffix}</div>
      <div class="gov-badges">
        <span class="gov-badge">${esc(govTypeLabel)}</span>
        ${coalitionBadge ? `<span class="gov-badge">${esc(coalitionBadge)}</span>` : ''}
      </div>

      ${leader1Html}
      ${leader2Html}

      <div class="gov-divider"></div>

      <div class="gov-section-title">Governing Coalition</div>
      <div class="gov-seat-bar">${barHtml}</div>
      ${partyRowsHtml}
      <div class="gov-seats-combined">${govSeats} seats combined</div>

      <div class="gov-divider"></div>

      <div class="gov-section-title">Approval</div>
      <div class="gov-approval-big" style="color:${approvalColor}">${approval}%</div>
    `;

    // Footer (inside gov card, outside body padding)
    let footer = govCard.querySelector('.gov-footer');
    if (!footer) {
      footer = document.createElement('div');
      footer.className = 'gov-footer';
      govCard.appendChild(footer);
    }
    footer.innerHTML = `
      <span class="gov-footer-label">${esc(govLabel)}</span>
      <span class="gov-footer-detail">${esc(footerDetail)}</span>
    `;

    // ── Load Events card ──
    loadDashEvents(nation.id, currentTick, parties);

  } catch (e) {
    console.error('Government card error:', e);
  }

  // ══════════════════════════════════════
  // ── Elections Card ──
  // ══════════════════════════════════════
  try {
    const isPres = isPresidentialRepublic(nation);
    const isAuto = isAutocracy(nation);
    const elBody = document.getElementById('elections-card-body');

    if (isAuto) {
      elBody.innerHTML = `<div class="elections-suspended">Elections are suspended.</div>`;
    } else {
      // Fetch current tick
      const { data: shardData } = await _supabase
        .from('shard')
        .select('current_tick')
        .eq('name', 'Alpha Shard')
        .single();
      const currentTick = shardData?.current_tick ?? 0;

      // Fetch scheduled elections ordered by tick
      const { data: scheduled } = await _supabase
        .from('elections')
        .select('election_tick, election_type')
        .eq('nation_id', nation.id)
        .eq('status', 'scheduled')
        .gt('election_tick', currentTick)
        .order('election_tick', { ascending: true })
        .limit(10);

      // Build the list of next 5 elections
      let elections = [];

      if (isPres) {
        // For presidential: need alternating Midterm / Presidential pattern
        // Midterm = parliamentary election in a presidential system
        const parlElections = (scheduled || []).filter(e => e.election_type === 'parliamentary');
        const presElections = (scheduled || []).filter(e => e.election_type === 'presidential');

        // Merge and sort by tick, label midterm vs presidential
        const merged = [
          ...parlElections.map(e => ({ tick: e.election_tick, type: 'Midterms', css: 'midterm' })),
          ...presElections.map(e => ({ tick: e.election_tick, type: 'Presidential', css: 'presidential' }))
        ].sort((a, b) => a.tick - b.tick);

        elections = merged.slice(0, 5);

        // If not enough scheduled, project future ones
        if (elections.length < 5) {
          const lastParl = parlElections.length ? parlElections[parlElections.length - 1].election_tick : null;
          const lastPres = presElections.length ? presElections[presElections.length - 1].election_tick : null;
          let nextParl = lastParl ? lastParl + 24 : currentTick + 24;
          let nextPres = lastPres ? lastPres + 48 : currentTick + 48;

          while (elections.length < 5) {
            if (nextParl <= nextPres) {
              elections.push({ tick: nextParl, type: 'Midterms', css: 'midterm' });
              nextParl += 24;
            } else {
              elections.push({ tick: nextPres, type: 'Presidential', css: 'presidential' });
              nextPres += 48;
            }
          }
          elections.sort((a, b) => a.tick - b.tick);
          elections = elections.slice(0, 5);
        }
      } else {
        // Parliamentary: all elections are simply "Parliamentary"
        const parlScheduled = (scheduled || []).map(e => ({
          tick: e.election_tick, type: 'Parliamentary', css: 'parliamentary'
        }));

        elections = parlScheduled.slice(0, 5);

        // Project if not enough
        if (elections.length < 5) {
          const lastTick = parlScheduled.length
            ? parlScheduled[parlScheduled.length - 1].tick
            : currentTick;
          let next = lastTick + 24;
          while (elections.length < 5) {
            elections.push({ tick: next, type: 'Parliamentary', css: 'parliamentary' });
            next += 24;
          }
        }
      }

      elBody.innerHTML = elections.map(e => {
        const year = 2000 + Math.floor(e.tick / 12);
        const month = MONTHS[e.tick % 12];
        return `<div class="election-item ${e.css}">
          <div class="election-item-type">${e.type}</div>
          <div class="election-item-date">${month}, ${year}</div>
        </div>`;
      }).join('');
    }
  } catch (e) {
    console.error('Elections card error:', e);
  }
});

// ══════════════════════════════════════
// ── Dashboard Events Feed ──
// ══════════════════════════════════════
const EVENT_CATEGORY_STYLES = {
  crisis:      { icon: '\u26A0', color: '#e74c3c', bg: 'rgba(231,76,60,0.12)', label: 'CRISIS' },
  government:  { icon: '\u2696', color: '#f1c40f', bg: 'rgba(241,196,15,0.10)', label: 'GOV' },
  POLITICAL:   { icon: '\u2605', color: '#3498db', bg: 'rgba(52,152,219,0.12)', label: 'POLITICAL' },
  Trade:       { icon: '\u2693', color: '#2ecc71', bg: 'rgba(46,204,113,0.12)', label: 'TRADE' },
  Diplomatic:  { icon: '\uD83C\uDF10', color: '#9b59b6', bg: 'rgba(155,89,182,0.12)', label: 'DIPLOMATIC' },
};
const EVENT_CATEGORY_DEFAULT = { icon: '\u2022', color: '#888', bg: 'rgba(136,136,136,0.08)', label: '' };

async function loadDashEvents(nationId, currentTick, parties) {
  const container = document.getElementById('dash-events-list');
  if (!container) return;
  container.innerHTML = '<div style="color:var(--text-secondary);padding:16px;font-size:0.75rem;text-align:center;">Loading events\u2026</div>';

  // Build party name → color map for highlighting
  const partyColorMap = {};
  (parties || []).forEach(p => {
    if (p.faction_name && p.party_color) {
      partyColorMap[p.faction_name] = p.party_color;
    }
  });

  /** Escape HTML then apply party color + bold event-name highlighting */
  function colorizeText(text, eventName) {
    let html = esc(text);
    // Bold the event/bill name if it appears in the description
    if (eventName && text.includes(eventName)) {
      const escaped = esc(eventName);
      html = html.replace(escaped, `<strong>${escaped}</strong>`);
    }
    // Color-code party names
    for (const [name, color] of Object.entries(partyColorMap)) {
      const escaped = esc(name);
      const safeColor = color.replace(/[^a-zA-Z0-9#(),.\s%]/g, '');
      html = html.replaceAll(escaped, `<span style="color:${safeColor};font-weight:600">${escaped}</span>`);
    }
    return html;
  }

  try {
    // Fetch from event_log — covers crises, bills, government events, trade, diplomatic
    const { data: events, error } = await _supabase
      .from('event_log')
      .select('*')
      .eq('nation_id', nationId)
      .order('fired_at_tick', { ascending: false })
      .limit(50);

    if (error) throw error;

    if (!events || events.length === 0) {
      container.innerHTML = '<div style="color:var(--text-secondary);padding:24px;font-size:0.75rem;text-align:center;font-style:italic;">No events recorded yet.</div>';
      return;
    }

    const rows = events.map(ev => {
      const dateStr = tickToDate(ev.fired_at_tick);
      const desc = ev.description_chosen || ev.description_used || '';
      const eventName = ev.event_name || '';
      const cat = EVENT_CATEGORY_STYLES[ev.category] || EVENT_CATEGORY_DEFAULT;

      // Show bold event name as headline, colorized description below
      const headline = eventName ? `<strong>${esc(eventName)}</strong>` : '';
      const body = desc ? colorizeText(desc, eventName) : '';
      const displayText = headline && body ? `${headline} — ${body}` : (body || headline || 'Event');

      return `<div class="dash-event-row">
        <span class="dash-event-date">${esc(dateStr)}</span>
        <span class="dash-event-icon" style="color:${cat.color}">${cat.icon}</span>
        <span class="dash-event-text">${displayText}</span>
        ${cat.label ? `<span class="dash-event-category" style="color:${cat.color};background:${cat.bg}">${cat.label}</span>` : ''}
      </div>`;
    }).join('');

    container.innerHTML = rows;
  } catch (e) {
    console.error('Events feed error:', e);
    container.innerHTML = '<div style="color:var(--text-secondary);padding:16px;font-size:0.75rem;">Failed to load events.</div>';
  }
}

/** Simple deterministic motto generator based on nation name */
function generateMotto(name) {
  const mottos = [
    'Forged in Unity, Bound by Liberty',
    'Strength Through the People',
    'One Land, One Purpose',
    'From Many, Greatness',
    'Liberty and Justice for All',
    'Progress, Honor, Unity',
    'Built on Courage, Sustained by Hope',
    'In Unity We Prosper',
    'A Nation of the People',
    'Forward Together, Backward Never',
  ];
  // Deterministic pick based on character sum
  let sum = 0;
  for (let i = 0; i < name.length; i++) sum += name.charCodeAt(i);
  return mottos[sum % mottos.length];
}
