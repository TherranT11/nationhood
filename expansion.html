<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>

  --bg-1: #1a1a1a;
  --bg-2: #1a1a17;
  --bg-3: #252525;
  --bg-4: #24241f;

  --text-primary: #c4c2b8;
  --text-secondary: #888;

  --text-dim: #4a4940;
  --text-ghost: #333229;
  --border-hair: rgba(255,255,255,0.04);

  --border-1: rgba(255,255,255,0.08);
  --border-2: rgba(255,255,255,0.12);
  --green: #5cb85c;
  --green-faint: rgba(92,184,92,0.08);
  --green-border: rgba(92,184,92,0.18);
  --red: #d9534f;
  --red-faint: rgba(217,83,79,0.08);
  --red-border: rgba(217,83,79,0.18);
  --amber: #c8a64e;
  --amber-faint: rgba(200,166,78,0.08);
  --amber-border: rgba(200,166,78,0.18);
  --blue: #5b9bd5;
  --blue-faint: rgba(91,155,213,0.08);
  --blue-border: rgba(91,155,213,0.18);
  --teal: #5aafa5;
  --teal-faint: rgba(90,175,165,0.08);
  --teal-border: rgba(90,175,165,0.18);
  --gold: #c8a832;
  --gold-faint: rgba(200,168,50,0.08);
  --gold-border: rgba(200,168,50,0.20);
  --orange: #c88444;
  --orange-faint: rgba(200,132,68,0.08);
  --orange-border: rgba(200,132,68,0.18);
  --font-mono: 'JetBrains Mono', monospace;
  --font-ui: 'IBM Plex Sans', -apple-system, sans-serif;
  --font-serif: 'IBM Plex Serif', Georgia, serif;
  /* Panel palette — flips under body.light-mode. Dark defaults; light override below. */
  --bg-card: #1a1a17;
  --bg-panel: #252525;
  --panel-main: #1f1f1a;
  --panel-border: rgba(255,255,255,0.08);
  --panel-text: #c4c2b8;
  --panel-muted: #888;
  --border-main: rgba(255,255,255,0.12);
}
body.light-mode {
  --bg-card: #ffffff;
  --bg-panel: #faf9f5;
  --panel-main: #f8f7f2;
  --panel-border: #e8e7e0;
  --panel-text: #e8e4dc;
  --panel-muted: #6a6660;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg-0);
  color: var(--text-primary);
  font-family: var(--font-ui);
  min-height: 100vh;
}

.loading-msg {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh;
  font-family: var(--font-mono); font-size: 11px; font-weight: 500;
  letter-spacing: 2px; color: var(--text-dim);
}
</style>
</head>
<body>
<script src="js/corp-theme-init.js"></script>
<div id="corp-topbar-container"></div>

<div id="loading" class="loading-msg">LOADING…</div>

<div id="page-content" style="display:none;padding:20px;max-width:1400px;margin:0 auto;">
  <div id="expansion-content" style="display:flex;justify-content:center;gap:12px;align-items:flex-start;flex-wrap:wrap;width:100%;">
    <!-- Row 1: Hire/Fire, Workforce, New Property, Create Subsidiary -->
    <div id="hf-card-container"></div>
    <div id="wf-summary-container"></div>
    <div id="new-property-container"></div>
    <div id="create-subsidiary-container"></div>
    <!-- Row 2: Manage Subsidiaries, Corporations -->
    <div id="manage-subsidiaries-container"></div>
    <div id="corporations-container"></div>
  </div>
</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { escapeHtml, hfFmtBig } from './js/utils.js';
import { renderCorpTopBar } from './js/corp-topbar.js';
import { initSubDashboard } from './js/corp-sub-dashboard.js';
import { loadAllCorporations as fetchAllCorporations } from './js/corp-all-corporations.js';
import { loadSubsidiaryMarketSafe } from './js/corp-shipping-data.js';
import { computeCorpValuation, computeFinanceReceivableValue } from './js/game/corp-valuation.js';
import {
    SUB_GDP_NEUTRAL,
    SUB_DEFAULT_REPUTATION,
    computeSubsidiaryTickDelta
} from './js/game/subsidiary-economics.js';

// ── Core corp-page state (mirrors corp-operations.html) ──
let allUserFactions = [];
let faction = null;
let nationStats = null;
let shard = null;

// `_allNations` is read (never written) by renderSubsidiaryMarketplaceCard
// for nation-name labeling. corp-operations.html had the same reference
// without a declaration, relying on listings being empty in practice. We
// declare it empty here to avoid a latent ReferenceError if the marketplace
// ever returns a listing with a nation_id.
let _allNations = [];

let _hfChanges = { general: 0, skilled: 0, innovative: 0 };
let _hfConfirming = false;

const HF_TYPES = [
    { id: 'general', label: 'General Workforce', multiplier: 2, color: '#8b9a6b', factionKey: 'corp_general_workforce' },
    { id: 'skilled', label: 'Skilled Workforce', multiplier: 3, color: '#c8a832', factionKey: 'corp_skilled_workforce' },
    { id: 'innovative', label: 'Innovative Workforce', multiplier: 6, color: '#c84', factionKey: 'corp_innovative_workforce' },
];
function hfCalcWage(multiplier) {
    const minWage = Number(nationStats?.minimum_wage ?? 50);
    const inflation = Number(nationStats?.inflation ?? 50);
    const sol = Number(nationStats?.standard_of_living ?? 50);
    const baseAnnual = (minWage / 100) * 48000;
    const inflMod = 1 + ((inflation - 50) / 100 * 0.5);
    const solMod = 1 + ((sol - 50) / 100 * 0.5);
    return Math.round(baseAnnual * multiplier * inflMod * solMod);
}

// hfFmtBig moved to js/utils.js (shared across the three corp-operations
// pages, expansion.html, and actions.html).
function hfGetCapacity() {
    // Total capacity from owned properties (condition-scaled) + 500 base HQ
    const propCapacity = _ownedProperties.reduce((sum, p) => {
        const cap = Number(p.capacity || 0);
        const cond = Number(p.condition || 0) / 100;
        return sum + Math.floor(cap * cond);
    }, 0);
    return propCapacity + 500; // 500 = National HQ base capacity
}

function hfSetChange(id, delta) {
    const type = HF_TYPES.find(t => t.id === id);
    const current = Number(faction?.[type.factionKey] ?? 0);
    const newDelta = _hfChanges[id] + delta;
    if (current + newDelta < 0) return;

    // Check capacity on hiring (not firing)
    if (delta > 0) {
        const totalAfter = HF_TYPES.reduce((s, t) => {
            const cur = Number(faction?.[t.factionKey] ?? 0);
            const pendingDelta = t.id === id ? newDelta : _hfChanges[t.id];
            return s + cur + pendingDelta;
        }, 0);
        const capacity = hfGetCapacity();
        if (totalAfter > capacity) return; // silently block — UI shows capacity
    }

    _hfChanges[id] = newDelta;
    renderHireFireCard();
}

function hfReset(id) {
    if (id) { _hfChanges[id] = 0; } else { _hfChanges = { general: 0, skilled: 0, innovative: 0 }; }
    renderHireFireCard();
}

async function hfConfirm() {
    if (_hfConfirming) return;
    const hasChanges = Object.values(_hfChanges).some(v => v !== 0);
    if (!hasChanges) return;

    // Calculate hiring cost (10% of annual wage per new hire, firing is free)
    let hiringCost = 0;
    for (const type of HF_TYPES) {
        const change = _hfChanges[type.id];
        if (change > 0) {
            hiringCost += change * hfCalcWage(type.multiplier) * 0.1;
        }
    }

    const cash = Number(faction?.corp_cash_reserves ?? 0);
    if (hiringCost > cash) {
        alert('Insufficient cash reserves. Hiring cost: ' + hfFmtBig(hiringCost) + ', available: ' + hfFmtBig(cash));
        return;
    }

    // Enforce capacity limit before writing
    const totalAfterAll = HF_TYPES.reduce((s, t) => s + Number(faction?.[t.factionKey] ?? 0) + _hfChanges[t.id], 0);
    const cap = hfGetCapacity();
    if (totalAfterAll > cap) {
        alert('Cannot hire beyond property capacity (' + cap.toLocaleString() + '). You need more workplaces.');
        return;
    }

    const msg = hiringCost > 0
        ? 'Confirm workforce changes?\n\nHiring fee: ' + hfFmtBig(hiringCost) + ' (deducted from cash reserves)'
        : 'Confirm workforce changes?\n\nFiring workers — no cost.';
    if (!confirm(msg)) return;

    _hfConfirming = true;
    try {
        const updates = {};
        for (const type of HF_TYPES) {
            const current = Number(faction?.[type.factionKey] ?? 0);
            updates[type.factionKey] = Math.max(0, current + _hfChanges[type.id]);
        }
        if (hiringCost > 0) {
            updates.corp_cash_reserves = Math.max(0, cash - Math.round(hiringCost));
        }
        const { error } = await _supabase.from('factions').update(updates).eq('id', faction.id);
        if (error) throw error;

        // Update local state
        Object.assign(faction, updates);
        _hfChanges = { general: 0, skilled: 0, innovative: 0 };
        // Update cash display
        const cashEl = document.getElementById('topbar-cash');
        if (cashEl) {
            const newCash = Number(faction.corp_cash_reserves ?? 0);
            cashEl.textContent = 'CASH: ' + (newCash >= 1e6 ? '$' + (newCash / 1e6).toFixed(1) + 'M' : '$' + Math.round(newCash / 1000) + 'k');
        }
        renderHireFireCard();
    } catch (err) {
        alert('Error: ' + err.message);
    } finally {
        _hfConfirming = false;
    }
}

function renderHireFireCard() {
    const container = document.getElementById('hf-card-container');
    if (!container) return;

    const mono = "'JetBrains Mono', monospace";
    const C = { bg: 'var(--bg-card)', surface: 'var(--panel-main)', card: 'var(--bg-panel)', border: 'var(--panel-border)',
        accent: '#8b9a6b', gold: '#c8a832', orange: '#c84',
        greenBright: '#5c5', red: '#c55', redDim: '#a44',
        text: 'var(--panel-text)', muted: '#9e9a92', dim: '#6a6660' };

    const minWage = Number(nationStats?.minimum_wage ?? 50);
    const inflation = Number(nationStats?.inflation ?? 50);
    const sol = Number(nationStats?.standard_of_living ?? 50);
    const baseAnnual = (minWage / 100) * 48000;
    const inflMod = (1 + ((inflation - 50) / 100 * 0.5)).toFixed(2);
    const solMod = (1 + ((sol - 50) / 100 * 0.5)).toFixed(2);
    const nationName = nationStats?.name || faction?.nation || 'Nation';

    const hasChanges = Object.values(_hfChanges).some(v => v !== 0);

    const capacity = hfGetCapacity();
    let totalCurrent = 0, totalAfter = 0, totalCurrentCost = 0, totalAfterCost = 0;
    let typesHtml = '';

    for (const type of HF_TYPES) {
        const current = Number(faction?.[type.factionKey] ?? 0);
        const change = _hfChanges[type.id];
        const after = current + change;
        const wage = hfCalcWage(type.multiplier);
        const isHiring = change > 0;
        const isFiring = change < 0;
        const currentAnnual = current * wage;
        const afterAnnual = after * wage;
        const delta = afterAnnual - currentAnnual;

        totalCurrent += current;
        totalAfter += after;
        totalCurrentCost += currentAnnual;
        totalAfterCost += afterAnnual;

        const bgTint = change !== 0 ? (isHiring ? 'rgba(92,204,92,0.02)' : 'rgba(204,85,85,0.02)') : 'transparent';

        typesHtml += `
        <div style="padding:10px 14px;border-bottom:1px solid ${C.border};background:${bgTint};">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                <div style="display:flex;align-items:center;gap:6px;">
                    <div style="width:4px;height:14px;background:${type.color}"></div>
                    <span style="font-size:12px;font-weight:700;color:${C.text}">${type.label}</span>
                </div>
                <div style="display:flex;align-items:baseline;gap:4px;">
                    <span style="font-family:${mono};font-size:16px;font-weight:700;color:${C.text}">${current.toLocaleString()}</span>
                    ${change !== 0 ? `<span style="font-family:${mono};font-size:10px;color:${C.dim}">→</span>
                    <span style="font-family:${mono};font-size:16px;font-weight:700;color:${isHiring ? C.greenBright : C.red}">${after.toLocaleString()}</span>` : ''}
                </div>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                <span style="font-family:${mono};font-size:8px;color:${C.dim}">WAGE (MIN × ${type.multiplier}.0 × ${inflMod} × ${solMod})</span>
                <span style="font-family:${mono};font-size:10px;color:${type.color}">${hfFmtBig(wage)}/yr</span>
            </div>
            <div style="display:flex;align-items:center;gap:4px;">
                <div onclick="hfSetChange('${type.id}',-50)" style="width:28px;height:24px;display:flex;align-items:center;justify-content:center;font-family:${mono};font-size:8px;font-weight:700;color:${C.red};border:1px solid ${C.border};cursor:pointer;background:${C.card}">-50</div>
                <div onclick="hfSetChange('${type.id}',-10)" style="width:28px;height:24px;display:flex;align-items:center;justify-content:center;font-family:${mono};font-size:8px;font-weight:700;color:${C.redDim};border:1px solid ${C.border};cursor:pointer;background:${C.card}">-10</div>
                <div style="flex:1;text-align:center;padding:2px 0;background:${change !== 0 ? C.card : 'transparent'};border:1px solid ${change !== 0 ? C.border : 'transparent'}">
                    ${change !== 0 ? `<div style="display:flex;align-items:center;justify-content:center;gap:6px;">
                        <span style="font-family:${mono};font-size:12px;font-weight:700;color:${isHiring ? C.greenBright : C.red}">${isHiring ? '+' : ''}${change}</span>
                        <span onclick="hfReset('${type.id}')" style="font-family:${mono};font-size:8px;color:${C.dim};cursor:pointer;padding:0 4px">✕</span>
                    </div>` : `<span style="font-family:${mono};font-size:9px;color:${C.dim}">—</span>`}
                </div>
                <div onclick="hfSetChange('${type.id}',10)" style="width:28px;height:24px;display:flex;align-items:center;justify-content:center;font-family:${mono};font-size:8px;font-weight:700;color:${C.greenBright};border:1px solid ${C.border};cursor:pointer;background:${C.card}">+10</div>
                <div onclick="hfSetChange('${type.id}',50)" style="width:28px;height:24px;display:flex;align-items:center;justify-content:center;font-family:${mono};font-size:8px;font-weight:700;color:${C.greenBright};border:1px solid ${C.border};cursor:pointer;background:${C.card}">+50</div>
            </div>
            ${change !== 0 ? `<div style="margin-top:6px;padding:4px 8px;background:${C.bg};border:1px solid ${C.border};display:flex;justify-content:space-between;align-items:center;">
                <span style="font-family:${mono};font-size:8px;color:${C.dim}">ANNUAL COST IMPACT</span>
                <span style="font-family:${mono};font-size:10px;font-weight:700;color:${delta > 0 ? C.red : C.greenBright}">${delta > 0 ? '+' : ''}${hfFmtBig(delta)}/yr</span>
            </div>` : ''}
        </div>`;
    }

    const costDelta = totalAfterCost - totalCurrentCost;

    container.innerHTML = `
    <div style="width:380px;height:450px;background:${C.surface};border:1px solid ${C.border};display:flex;flex-direction:column;overflow:hidden;font-family:'IBM Plex Sans',sans-serif;">
        <div style="padding:8px 14px;border-bottom:1px solid ${C.border};display:flex;justify-content:space-between;align-items:center;flex-shrink:0;">
            <div style="display:flex;align-items:center;gap:6px;">
                <span style="font-size:8px;color:${C.accent}">●</span>
                <span style="font-family:${mono};font-size:11px;font-weight:700;letter-spacing:2px;color:${C.muted};text-transform:uppercase">Hire / Fire</span>
            </div>
            <span style="font-family:${mono};font-size:8px;font-weight:700;letter-spacing:0.8px;padding:1px 6px;color:${C.accent};background:rgba(139,154,107,0.08);border:1px solid rgba(139,154,107,0.15)">${nationName.toUpperCase()}</span>
        </div>
        <div style="flex:1;overflow:auto;">
            <div style="padding:6px 14px;border-bottom:1px solid ${C.border};background:${C.card};">
                <div style="font-family:${mono};font-size:8px;letter-spacing:1.5px;color:${C.dim};text-transform:uppercase;margin-bottom:4px">Wage Inputs</div>
                <div style="display:flex;gap:0;">
                    <div style="flex:1;padding:2px 6px;border-right:1px solid ${C.border}">
                        <div style="font-family:${mono};font-size:7px;color:${C.dim};letter-spacing:0.5px">MIN WAGE</div>
                        <div style="font-family:${mono};font-size:10px;font-weight:700;color:${C.text}">${minWage}/100</div>
                        <div style="font-family:${mono};font-size:7px;color:${C.dim}">${hfFmtBig(baseAnnual)}/yr</div>
                    </div>
                    <div style="flex:1;padding:2px 6px;border-right:1px solid ${C.border}">
                        <div style="font-family:${mono};font-size:7px;color:${C.dim};letter-spacing:0.5px">INFLATION</div>
                        <div style="font-family:${mono};font-size:10px;font-weight:700;color:${C.text}">${inflation}/100</div>
                        <div style="font-family:${mono};font-size:7px;color:${C.dim}">×${inflMod}</div>
                    </div>
                    <div style="flex:1;padding:2px 6px;">
                        <div style="font-family:${mono};font-size:7px;color:${C.dim};letter-spacing:0.5px">STD OF LIVING</div>
                        <div style="font-family:${mono};font-size:10px;font-weight:700;color:${C.text}">${sol}/100</div>
                        <div style="font-family:${mono};font-size:7px;color:${C.dim}">×${solMod}</div>
                    </div>
                </div>
            </div>
            ${typesHtml}
        </div>
        <div style="padding:8px 14px;border-top:1px solid ${C.border};background:${C.card};flex-shrink:0;">
            <div style="display:flex;justify-content:space-between;align-items:center;${hasChanges ? 'margin-bottom:6px;' : ''}">
                <div>
                    <div style="font-family:${mono};font-size:7px;color:${C.dim};letter-spacing:0.8px">WORKFORCE / CAPACITY</div>
                    <div style="display:flex;align-items:baseline;gap:4px;">
                        <span style="font-family:${mono};font-size:13px;font-weight:700;color:${totalCurrent >= capacity ? C.red : C.text}">${hasChanges ? totalAfter.toLocaleString() : totalCurrent.toLocaleString()}</span>
                        <span style="font-family:${mono};font-size:9px;color:${C.dim}">/ ${capacity.toLocaleString()}</span>
                    </div>
                    ${totalCurrent >= capacity && !hasChanges ? `<div style="font-family:${mono};font-size:7px;color:${C.red};margin-top:2px;">Need workplaces to hire new employees.</div>` : ''}
                </div>
                <div style="text-align:right;">
                    <div style="font-family:${mono};font-size:7px;color:${C.dim};letter-spacing:0.8px">ANNUAL WAGES</div>
                    <div style="display:flex;align-items:baseline;gap:4px;justify-content:flex-end;">
                        <span style="font-family:${mono};font-size:11px;font-weight:700;color:${C.text}">${hfFmtBig(totalCurrentCost)}</span>
                        ${hasChanges ? `<span style="font-family:${mono};font-size:9px;color:${C.dim}">→</span>
                        <span style="font-family:${mono};font-size:11px;font-weight:700;color:${costDelta > 0 ? C.red : C.greenBright}">${hfFmtBig(totalAfterCost)}</span>` : ''}
                    </div>
                </div>
            </div>
            ${hasChanges ? `<div style="display:flex;justify-content:space-between;align-items:center;padding-top:6px;border-top:1px solid ${C.border};">
                <div style="display:flex;align-items:center;gap:6px;">
                    <span style="font-family:${mono};font-size:8px;color:${C.dim}">NET CHANGE</span>
                    <span style="font-family:${mono};font-size:11px;font-weight:700;color:${costDelta > 0 ? C.red : C.greenBright}">${costDelta > 0 ? '+' : ''}${hfFmtBig(costDelta)}/yr</span>
                    <span style="font-family:${mono};font-size:8px;color:${C.dim}">(${costDelta > 0 ? '+' : ''}${hfFmtBig(Math.round(costDelta / 12))}/tick)</span>
                </div>
                <div style="display:flex;gap:6px;">
                    <div onclick="hfReset()" style="padding:4px 12px;font-family:${mono};font-size:8px;font-weight:700;letter-spacing:1px;color:${C.dim};border:1px solid ${C.border};cursor:pointer">RESET</div>
                    <div onclick="hfConfirm()" style="padding:4px 14px;font-family:${mono};font-size:8px;font-weight:700;letter-spacing:1px;color:#000;background:${C.accent};cursor:pointer">CONFIRM</div>
                </div>
            </div>` : ''}
        </div>
    </div>`;
}

function renderWorkforceSummary() {
    const container = document.getElementById('wf-summary-container');
    if (!container) return;

    const mono = "'JetBrains Mono', monospace";
    const C = { bg: 'var(--bg-card)', surface: 'var(--panel-main)', card: 'var(--bg-panel)', border: 'var(--panel-border)',
        accent: '#8b9a6b', gold: '#c8a832', orange: '#c84', blue: '#5a9abf',
        text: 'var(--panel-text)', muted: '#9e9a92', dim: '#6a6660', red: '#c55' };

    const nationName = (nationStats?.name || faction?.nation || 'Nation').toUpperCase();
    const minWage = Number(nationStats?.minimum_wage ?? 50);
    const inflation = Number(nationStats?.inflation ?? 50);
    const sol = Number(nationStats?.standard_of_living ?? 50);
    const baseAnnual = (minWage / 100) * 48000;
    const inflMod = 1 + ((inflation - 50) / 100 * 0.5);
    const solMod = 1 + ((sol - 50) / 100 * 0.5);

    const tiers = [
        { label: 'General Workforce', mult: 2, color: C.accent, key: 'corp_general_workforce', countColor: C.text },
        { label: 'Skilled Workforce', mult: 3, color: C.gold, key: 'corp_skilled_workforce', countColor: C.blue },
        { label: 'Innovative Workforce', mult: 6, color: C.orange, key: 'corp_innovative_workforce', countColor: C.gold },
    ];

    let totalCount = 0, totalCost = 0;
    let tiersHtml = '';

    for (const t of tiers) {
        const count = Number(faction?.[t.key] ?? 0);

async function loadAvailableProperties() {
    if (!faction?.nation_id) return;

    const { data, error } = await _supabase
        .from('available_properties')
        .select('*, property_catalog:catalog_id(subsector_lock)')
        .eq('nation_id', faction.nation_id)
        .eq('status', 'available')
        .order('price', { ascending: true });

    if (error) { console.warn('[Property] Failed to load marketplace:', error.message); return; }

    // Subsector / sector filtering — keep only listings this corp can actually
    // build under. Warehouses are construction-only; subsector_lock pins
    // specialised buildings (Insurance Office, etc.) to one subsector.
    const isConstruction = faction?.corp_sector === 'Construction';
    const subsector = (faction?.corp_subsector || '').toLowerCase();
    _npAvailable = (data || [])
        .filter(p => isConstruction || p.type !== 'warehouse')
        .filter(p => {
            const lock = p.property_catalog?.subsector_lock;
            return !lock || lock === subsector;
        })
        .map(p => ({
            ...p,
            adjusted_cost: p.price,
            adjusted_maintenance: p.monthly_maintenance,
        }));
}

function npSelect(idx) {
    _npSelected = _npSelected === idx ? null : idx;

let _npBuying = false;
async function npBuyProperty() {
    if (_npSelected === null || _npBuying) return;
    const prop = _npAvailable[_npSelected];
    if (!prop) return;

    const cash = Number(faction?.corp_cash_reserves ?? 0);
    if (prop.adjusted_cost > cash) {
        alert('Insufficient cash reserves.\nProperty: ' + hfFmtBig(prop.adjusted_cost) + '\nCash: ' + hfFmtBig(cash));
        return;
    }

    if (!confirm('Buy "' + prop.name + '" for ' + hfFmtBig(prop.adjusted_cost) + '?\n\nMonthly maintenance: ' + hfFmtBig(prop.adjusted_maintenance) + '/mo\nCondition: ' + prop.condition + '%\n\nThis will be deducted from your cash reserves.')) return;

    _npBuying = true;
    try {
        // 1. Insert into corp_properties
        const { error: insertErr } = await _supabase.from('corp_properties').insert({
            faction_id: faction.id,
            nation_id: faction.nation_id,
            catalog_id: prop.catalog_id || null,
            name: prop.name,
            type: prop.type,
            role: prop.type,              // marketplace purchase — role mirrors type
            style: prop.style,
            capacity: prop.capacity,
            purchase_price: prop.adjusted_cost,
            monthly_maintenance: prop.adjusted_maintenance,
            condition: prop.condition,
            city: prop.city,
            purchased_at_tick: Number(document.getElementById('tick-number')?.textContent || 0),
            is_active: true,
        });
        if (insertErr) throw insertErr;

        // 2. Deduct cash
        const newCash = Math.max(0, cash - prop.adjusted_cost);
        const { error: cashErr } = await _supabase.from('factions').update({ corp_cash_reserves: newCash }).eq('id', faction.id);
        if (cashErr) throw cashErr;
        faction.corp_cash_reserves = newCash;

        // 3. Mark available property as sold
        if (prop.id) {
            await _supabase.from('available_properties').update({ status: 'sold', purchased_by: faction.id }).eq('id', prop.id);
        }

        // 4. Update cash display
        const cashEl = document.getElementById('topbar-cash');
        if (cashEl) {
            cashEl.textContent = 'CASH: ' + (newCash >= 1e6 ? '$' + (newCash / 1e6).toFixed(1) + 'M' : '$' + Math.round(newCash / 1000) + 'k');
        }

        // 5. Refresh
        _npSelected = null;
        await loadAvailableProperties();
        renderNewPropertyCard();
        renderPropertyCard(); // refresh owned properties card

        alert('Property purchased: ' + prop.name + '\n\nDeducted: ' + hfFmtBig(prop.adjusted_cost));
    } catch (err) {
        alert('Purchase failed: ' + err.message);
    } finally {
        _npBuying = false;
    }
}

const CP_STYLE_META = {
    Basic:       { costMod: 1.0, maintMod: 1.0, repGain: 1, color: '#6a6660', desc: 'Functional. No frills.' },
    Modern:      { costMod: 1.4, maintMod: 1.2, repGain: 2, color: '#8b9a6b', desc: 'Contemporary design. Good retention.' },
    Sustainable: { costMod: 1.6, maintMod: 0.8, repGain: 3, color: '#5c5',    desc: 'Green building. Lower upkeep.' },
    Innovative:  { costMod: 2.0, maintMod: 1.5, repGain: 4, color: '#c8a832', desc: 'Cutting edge. Attracts top talent.' },
    Heritage:    { costMod: 1.3, maintMod: 1.4, repGain: 2, color: '#c84',    desc: 'Restored historic. High character.' },
    Premium:     { costMod: 2.5, maintMod: 1.8, repGain: 5, color: '#ca5',    desc: 'Flagship prestige. Maximum reputation.' },
};

let _cpModal = false;
let _cpData = { name: '', type: 'Office Building', size: 2000, style: 'Modern', nationId: null, nationName: null };
let _cpSubmitting = false;
let _cpNations = []; // nations where corp has HQ or Regional HQ

function cpCalcBudget() {
    const inflation = Number(nationStats?.inflation ?? 50);
    const inflMod = 1 + ((inflation - 50) / 100 * 0.3);
    const styleMod = CP_STYLE_META[_cpData.style]?.costMod || 1.0;
    const typeMod = _cpData.type === 'Warehouse' ? 0.75 : 1.0;
    const total = Math.round(_cpData.size * 100000 * inflMod * styleMod * typeMod);
    const maint = Math.round(total * 0.007 * (CP_STYLE_META[_cpData.style]?.maintMod || 1.0));
    return { total, maint, inflMod, styleMod };
}

async function npOpenConstructionModal() {
    _cpModal = true;
    const homeNationId = faction?.nation_id;
    const homeName = nationStats?.name || faction?.nation || 'Home Nation';
    _cpData = { name: '', type: 'Office Building', size: 2000, style: 'Modern', nationId: homeNationId, nationName: homeName };

    // Build list of nations where corp has presence (National HQ + Regional HQs)
    _cpNations = [{ id: homeNationId, name: homeName, label: 'National HQ' }];
    try {
        const { data: hqProps } = await _supabase.from('corp_properties')
            .select('nation_id, name, nations!nation_id(name)')
            .eq('faction_id', faction.id)
            .eq('type', 'regional_hq')
            .eq('is_active', true);
        for (const hq of (hqProps || [])) {
            if (hq.nation_id === homeNationId) continue;
            _cpNations.push({ id: hq.nation_id, name: hq.nations?.name || 'Unknown', label: hq.name || 'Regional HQ' });

    renderConstructionModal();

async function cpSubmit() {
    if (_cpSubmitting || !_cpData.name.trim()) return;
    if (!_cpData.nationId) { alert('Select a location.'); return; }
    _cpSubmitting = true;

    try {
        const budget = cpCalcBudget();
        const targetNationId = _cpData.nationId;
        const nationName = _cpData.nationName || 'Unknown';
        const repGain = CP_STYLE_META[_cpData.style]?.repGain || 1;

        // Generate project code: PVT-C1-2015
        const shardRes = await _supabase.from('shard').select('current_tick, current_date').eq('name', 'Alpha Shard').single();
        const currentTick = shardRes.data?.current_tick || 0;
        const gameYear = (shardRes.data?.current_date || '').match(/\d{4}/)?.[0] || '2015';

        // Count existing private contracts to generate sequence
        const { count: existingCount } = await _supabase.from('construction_contracts')
            .select('id', { count: 'exact', head: true })
            .eq('nation_id', targetNationId)
            .eq('issuer_type', 'PRIVATE');
        const seq = (existingCount || 0) + 1;
        const projectCode = `PVT-C${seq}-${gameYear}`;

        // Insert into construction_contracts
        const { error } = await _supabase.from('construction_contracts').insert({
            nation_id: targetNationId,
            template_key: 'custom_building',
            sector: 'civil_engineering',
            name: _cpData.name.trim(),
            project_type: _cpData.type,
            project_subtype: _cpData.style,
            description: `${_cpData.type} (${_cpData.style}) — ${_cpData.size.toLocaleString()} employees, commissioned by ${faction.faction_name}`,
            project_code: projectCode,
            budget_ceiling: budget.total,
            timeline_ticks: Math.max(4, Math.ceil(_cpData.size / 2000) + 2),
            required_materials: (() => {
                const k = _cpData.size / 1000; // units per 1,000 employees
                const s = _cpData.style;
                const styleMat = {
                    Basic:       { concrete: 1.0, steel: 1.0, glass: 0.5, em: 1.0, lumber: 1.5, heavy: 1.0, agg: 1.0 },
                    Modern:      { concrete: 1.1, steel: 1.1, glass: 1.4, em: 1.4, lumber: 0.5, heavy: 1.1, agg: 1.1 },
                    Sustainable: { concrete: 0.9, steel: 0.9, glass: 0.9, em: 0.9, lumber: 1.5, heavy: 0.9, agg: 0.9 },
                    Innovative:  { concrete: 1.2, steel: 1.2, glass: 2.0, em: 2.0, lumber: 0.5, heavy: 2.0, agg: 1.2 },
                    Heritage:    { concrete: 1.3, steel: 1.3, glass: 1.3, em: 1.3, lumber: 2.0, heavy: 1.3, agg: 1.3 },
                    Premium:     { concrete: 1.5, steel: 1.5, glass: 2.5, em: 1.5, lumber: 1.0, heavy: 1.5, agg: 1.5 },
                }[s] || { concrete: 1, steel: 1, glass: 1, em: 1, lumber: 1, heavy: 1, agg: 1 };
                const r = (base, mod) => Math.max(1, Math.ceil(k * base * mod));
                return {
                    concrete: r(8, styleMat.concrete),
                    steel: r(6, styleMat.steel),
                    glass_facades: r(3, styleMat.glass),
                    em_systems: r(4, styleMat.em),
                    lumber: r(1, styleMat.lumber),
                    heavy_parts: r(2, styleMat.heavy),
                    aggregate: r(3, styleMat.agg),
                };
            })(),
            required_equipment: (() => {
                const sz = _cpData.size;
                const equip = { trucks: Math.ceil(sz / 2000) + 1, mixers: Math.ceil(sz / 3000) + 1 };
                if (sz > 1000) { equip.excavators = Math.ceil(sz / 3000) + 1; equip.cranes = Math.ceil(sz / 4000) + 1; }
                if (sz > 3000) { equip.bulldozers = Math.ceil(sz / 4000) + 1; equip.haulers = Math.ceil(sz / 5000) + 1; }
                if (sz > 8000) { equip.pile_drivers = Math.ceil(sz / 6000) + 1; }
                return equip;
            })(),
            required_workforce: { general: Math.ceil(_cpData.size * 0.08), skilled: Math.ceil(_cpData.size * 0.03) },
            status: 'open',
            generated_at_tick: currentTick,
            bidding_ends_tick: currentTick + 3,
            issuer_type: 'PRIVATE',
            issuer_name: faction.faction_name,
            issuer_faction_id: faction.id,
        });

        if (error) throw error;

        cpClose();
        alert('Construction project submitted!\n\n' +
            'Project: ' + _cpData.name.trim() + '\n' +
            'Code: ' + projectCode + '\n' +
            'Budget: ' + hfFmtBig(budget.total) + '\n' +
            'Expected Reputation: +' + Math.ceil((budget.adjusted / 100_000_000) * 3) + ' (+3 per $100M)\n\n' +
            'All construction corporations in ' + nationName + ' can now bid on this project.');
    } catch (err) {
        alert('Failed to submit project: ' + err.message);
    } finally {
        _cpSubmitting = false;
    }
}

let _propActing = false;

async function propSell(propId) {
    if (_propActing) return;
    const prop = _ownedProperties.find(p => p.id === propId);
    if (!prop) return;

    // Sale value: 60% of purchase price × condition × inflation
    const inflMod = 1 + ((Number(nationStats?.inflation ?? 50) - 50) / 100 * 0.3);
    const conditionFactor = (prop.condition || 50) / 100;
    const saleValue = Math.round((prop.purchase_price || 0) * 0.6 * conditionFactor * inflMod);

    if (!confirm('Sell "' + prop.name + '"?\n\nSale value: ' + hfFmtBig(saleValue) + ' (60% × ' + prop.condition + '% condition × inflation)\n\nThe property will go back on the market for 6 ticks.\nThis cannot be undone.')) return;

    _propActing = true;
    try {
        // 1. Deactivate owned property
        await _supabase.from('corp_properties').update({ is_active: false }).eq('id', propId);

        // 2. Add sale value to cash
        const cash = Number(faction?.corp_cash_reserves ?? 0);
        const newCash = cash + saleValue;
        await _supabase.from('factions').update({ corp_cash_reserves: newCash }).eq('id', faction.id);
        faction.corp_cash_reserves = newCash;

        // 3. Put it back on the market for 6 ticks
        const shardRes = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const currentTick = shardRes.data?.current_tick || 0;

        await _supabase.from('available_properties').insert({
            nation_id: faction.nation_id,
            catalog_id: prop.catalog_id || null,
            name: prop.name,
            type: prop.type,
            style: prop.style,
            capacity: prop.capacity,
            price: Math.round(saleValue * 1.1), // slight markup from sale value
            monthly_maintenance: prop.monthly_maintenance,
            condition: prop.condition,
            city: prop.city,
            generated_at_tick: currentTick,
            expires_at_tick: currentTick + 6,
            status: 'available',
        });

        // 4. Update UI
        const cashEl = document.getElementById('topbar-cash');
        if (cashEl) cashEl.textContent = 'CASH: ' + (newCash >= 1e6 ? '$' + (newCash / 1e6).toFixed(1) + 'M' : '$' + Math.round(newCash / 1000) + 'k');

        await loadOwnedProperties();
        renderPropertyCard();
        await loadAvailableProperties();
        renderNewPropertyCard();
        alert('Sold "' + prop.name + '" for ' + hfFmtBig(saleValue));
    } catch (err) {

    }
}

const SUB_RATES = { SALE: 0.8, DISSOLVE: 0.6 };

function subParseAmount(input) {
    if (!input) return 0;
    const cleaned = input.trim().replace(/[$,]/g, '');
    const mMatch = cleaned.match(/^([\d.]+)\s*[Mm]$/);
    const kMatch = cleaned.match(/^([\d.]+)\s*[Kk]$/);
    if (mMatch) return Math.round(parseFloat(mMatch[1]) * 1000000);
    if (kMatch) return Math.round(parseFloat(kMatch[1]) * 1000);
    return Math.round(parseFloat(cleaned));
}

function subUpdateTopbarCash(cash) {
    const cashEl = document.getElementById('topbar-cash');
    if (cashEl) cashEl.textContent = 'CASH: ' + (cash >= 1e6 ? '$' + (cash / 1e6).toFixed(1) + 'M' : '$' + Math.round(cash / 1000) + 'k');
}

function subGetNationName(nationId) {
    return _subNations.find(n => n.id === nationId)?.name || '—';
}

function subGetNationProps(nationId) {
    return _ownedProperties.filter(p => p.nation_id === nationId);
}

let _mSubSelected = 0;
let _subProjectCounts = {}; // nation_id -> number of active projects

async function loadSubsidiaryProjectCounts() {
    if (!faction?.id) return;
    try {
        const { data } = await _supabase
            .from('construction_contracts')
            .select('nation_id')
            .eq('awarded_to_faction', faction.id)
            .in('status', ['in_progress', 'awarded']);
        _subProjectCounts = {};
        for (const c of (data || [])) {
            if (c.nation_id) _subProjectCounts[c.nation_id] = (_subProjectCounts[c.nation_id] || 0) + 1;
        }
    } catch (e) { /* non-fatal */ }
}

function getSubsidiaryData(hqProp) {
    const nationProps = subGetNationProps(hqProp.nation_id);
    const totalVal = nationProps.reduce((s, p) => s + Number(p.purchase_price || 0), 0);
    const totalCapacity = nationProps.reduce((s, p) => s + Number(p.capacity || 0), 0);
    const projects = _subProjectCounts[hqProp.nation_id] || 0;
    const nationData = _subNations.find(n => n.id === hqProp.nation_id);

    const words = (hqProp.name || '').trim().split(/\s+/);
    const abbr = words.length >= 2
        ? words.map(w => w[0]).join('').toUpperCase().slice(0, 4)
        : (hqProp.name || 'SUB').slice(0, 4).toUpperCase();

    const subCash = Number(hqProp.sub_cash || 0);
    const gdpGrowth = Number(nationData?.gdp_growth ?? 50);
    const projectedTick = computeSubsidiaryTickDelta({
        subCash,
        gdpGrowth,
        parentReputation: Number(faction?.corp_reputation ?? 50),
    });
    const revenue = projectedTick.netDelta;

    return {
        id: hqProp.id,
        name: hqProp.name,
        abbr,
        nation: nationData?.name || hqProp.city || '—',
        nationId: hqProp.nation_id,
        sector: faction?.corp_sector || 'General',
        subsector: hqProp.subsector || faction?.corp_subsector || '—',
        revenue,
        debt: 0,
        cash: subCash,
        reputation: SUB_DEFAULT_REPUTATION,
        valuation: totalVal,
        workforce: totalCapacity,
        projects,
        established: hqProp.created_at ? new Date(hqProp.created_at).getFullYear().toString() : '—',
        trend: revenue > 0 ? 'up' : revenue < 0 ? 'down' : (gdpGrowth >= SUB_GDP_NEUTRAL && subCash > 0 ? 'flat' : 'down'),
        profitable: revenue > 0,
        projectedInvestmentReturn: projectedTick.investmentReturn,
        projectedOverhead: projectedTick.overhead,
        hqProp,
    };
}

// ─── SELL / DISSOLVE: unified liquidation (different multiplier) ───
async function _subLiquidate(propId, mode) {
    if (_subActionLock) return;
    const hq = _ownedProperties.find(p => p.id === propId);
    if (!hq) return;
    const isSell = mode === 'sell';
    const rate = isSell ? SUB_RATES.SALE : SUB_RATES.DISSOLVE;
    const verb = isSell ? 'SELL' : 'DISSOLVE';
    const pastVerb = isSell ? 'sold' : 'dissolved';
    const rateLabel = isSell ? '80%' : '60%';

    const nationName = subGetNationName(hq.nation_id);
    const nationProps = subGetNationProps(hq.nation_id);
    const propValue = nationProps.reduce((s, p) => s + Math.round((p.purchase_price || 0) * rate * (p.condition || 50) / 100), 0);
    const subCash = Number(hq.sub_cash || 0);
    const totalReturn = propValue + subCash;

    if (!confirm(
        verb + ' subsidiary "' + hq.name + '"?\n\n' +
        nationProps.length + ' properties at ' + rateLabel + ' × condition:\n' +
        '  Property value: ' + hfFmtBig(propValue) + '\n' +
        '  Subsidiary cash: ' + hfFmtBig(subCash) + '\n' +
        '  ─────────────────\n' +
        '  Total return: ' + hfFmtBig(totalReturn) + '\n\n' +
        'All operations in ' + nationName + ' cease.\nThis cannot be undone.'
    )) return;

    _subActionLock = true;
    try {
        const propIds = nationProps.map(p => p.id);
        // Deactivate properties — use .eq() for single, .in() for multiple (avoids Supabase .in() 400 on single-element arrays)
        if (propIds.length === 1) {
            const { error: propErr } = await _supabase.from('corp_properties').update({ is_active: false }).eq('id', propIds[0]);
            if (propErr) throw propErr;
        } else if (propIds.length > 1) {
            const { error: propErr } = await _supabase.from('corp_properties').update({ is_active: false }).in('id', propIds);
            if (propErr) throw propErr;
        }
        // Zero out subsidiary cash on the HQ (separate update in case migration not yet applied)
        await _supabase.from('corp_properties').update({ sub_cash: 0 }).eq('id', propId).then(() => {}).catch(() => {});
        const newCash = Number(faction?.corp_cash_reserves ?? 0) + totalReturn;
        await _supabase.from('factions').update({ corp_cash_reserves: newCash }).eq('id', faction.id);
        faction.corp_cash_reserves = newCash;
        subUpdateTopbarCash(newCash);
        await subReloadCards();
        alert('Subsidiary ' + pastVerb + '. ' + nationProps.length + ' properties liquidated.\nTotal received: ' + hfFmtBig(totalReturn));
    } catch (err) { alert('Failed: ' + err.message); }
    finally { _subActionLock = false; }
}
function subSell(propId) { _subLiquidate(propId, 'sell'); }

// ─── PUT UP FOR SALE: list subsidiary on marketplace ───
async function subPutForSale(propId) {
    if (_subActionLock) return;
    const hq = _ownedProperties.find(p => p.id === propId);
    if (!hq) return;

    const nationName = subGetNationName(hq.nation_id);
    const nationProps = subGetNationProps(hq.nation_id);
    const valuation = nationProps.reduce((s, p) => s + Math.round((p.purchase_price || 0) * 0.8 * (p.condition || 50) / 100), 0);
    const subCash = Number(hq.sub_cash || 0);
    const monthlyRev = Math.round(subCash * 0.05); // rough estimate

    if (!confirm(
        'PUT UP FOR SALE: "' + hq.name + '"\n\n' +
        'Nation: ' + nationName + '\n' +
        'Estimated Valuation: ' + hfFmtBig(valuation) + '\n' +
        'Subsidiary Cash: ' + hfFmtBig(subCash) + '\n' +
        'Subsector: ' + (hq.subsector || 'General') + '\n\n' +
        'This will list your subsidiary on the marketplace.\n' +
        'Other corporations can place bids (minimum $1M).\n' +
        'You review and accept bids.\n\n' +
        'Continue?'
    )) return;

    _subActionLock = true;
    try {
        const currentTick = shard?.current_tick || 0;
        const { data, error } = await _supabase.from('subsidiary_sales').insert({
            subsidiary_id: propId,

function isFeatureUnavailableSupabaseError(error) {
    if (!error) return false;
    const code = String(error.code || '').toUpperCase();
    const message = String(error.message || '');
    return code === 'PGRST202'
        || code === 'PGRST205'
        || code === '42P01'
        || /Could not find the table/i.test(message)
        || /schema cache/i.test(message);
}

async function runSubsidiaryMarketplaceQuery(queryPromise, label) {
    const { data, error } = await queryPromise;
    if (!error) return { data: data || [], error: null, unavailable: false };

    if (isFeatureUnavailableSupabaseError(error)) {
        console.warn('[SubMarket] ' + label + ' unavailable in this environment:', error.message);
        return { data: [], error, unavailable: true };
    }

    console.error('[SubMarket] ' + label + ' failed:', error.message);
    return { data: [], error, unavailable: false };
}

async function subPlaceBid(saleId, subName, valuation) {
    const amountStr = prompt('Place bid for "' + subName + '"\n\nValuation: ' + hfFmtBig(valuation) + '\nMinimum bid: $1M\n\nEnter bid amount ($):');
    if (!amountStr) return;
    const amount = Math.round(Number(amountStr));
    if (isNaN(amount) || amount < 1000000) {
        alert('Minimum bid is $1,000,000.');
        return;
    }
    const cash = Number(faction?.corp_cash_reserves ?? 0);
    if (amount > cash) {
        alert('Insufficient funds. You have ' + hfFmtBig(cash) + '.');
        return;
    }

    const { error } = await _supabase.from('subsidiary_bids').insert({
        sale_id: saleId,
        bidder_faction_id: faction.id,
        bid_amount: amount,
        status: 'pending',
        placed_at_tick: shard?.current_tick || 0,
    });

    if (error) {
        if (error.message.includes('duplicate') || error.message.includes('unique')) {
            alert('You already have a bid on this subsidiary.');
        } else {
            alert('Failed to place bid: ' + error.message);
        }
        return;
    }

    alert('Bid of ' + hfFmtBig(amount) + ' placed on "' + subName + '".\nThe seller will review your bid.');
    await loadMarketplaceListings();
    renderSubsidiaryMarketplaceCard();
}

async function subViewBids(saleId) {
    const sale = _marketplaceListings.find(l => l.id === saleId);
    if (!sale) return;
    const bids = (sale.subsidiary_bids || []).filter(b => b.status === 'pending');
    if (bids.length === 0) { alert('No pending bids.'); return; }

    // Fetch bidder names
    const bidderIds = bids.map(b => b.bidder_faction_id);
    const { data: bidders } = await _supabase.from('factions').select('id, faction_name').in('id', bidderIds);
    const nameMap = {};
    (bidders || []).forEach(f => { nameMap[f.id] = f.faction_name; });

    let msg = 'Bids for "' + sale.subsidiary_name + '":\n\n';
    const sortedBids = bids.sort((a, b) => b.bid_amount - a.bid_amount);
    for (let i = 0; i < sortedBids.length; i++) {
        const b = sortedBids[i];
        msg += (i + 1) + '. ' + (nameMap[b.bidder_faction_id] || 'Unknown') + ': ' + hfFmtBig(b.bid_amount) + '\n';
    }
    msg += '\nEnter the number of the bid to accept (or cancel):';

    const choice = prompt(msg);
    if (!choice) return;
    const idx = parseInt(choice, 10) - 1;
    if (isNaN(idx) || idx < 0 || idx >= sortedBids.length) { alert('Invalid selection.'); return; }

    const acceptedBid = sortedBids[idx];
    const bidderName = nameMap[acceptedBid.bidder_faction_id] || 'Unknown';

    if (!confirm('Accept bid of ' + hfFmtBig(acceptedBid.bid_amount) + ' from ' + bidderName + '?\n\nThis will transfer ownership of "' + sale.subsidiary_name + '" to them.\nYou will receive ' + hfFmtBig(acceptedBid.bid_amount) + ' in cash.\n\nThis cannot be undone.')) return;

    await subAcceptBid(sale, acceptedBid);
}

let _acceptBidLock = false;
async function subAcceptBid(sale, bid) {
    if (_acceptBidLock) return;
    _acceptBidLock = true;
    try {
        const currentTick = shard?.current_tick || 0;

        // 1. Deduct from buyer
        const { data: buyer } = await _supabase.from('factions').select('corp_cash_reserves').eq('id', bid.bidder_faction_id).single();
        const buyerCash = Number(buyer?.corp_cash_reserves ?? 0);
        if (buyerCash < bid.bid_amount) {
            alert('Buyer has insufficient funds. Bid cannot be completed.');
            await _supabase.from('subsidiary_bids').update({ status: 'rejected', resolved_at_tick: currentTick }).eq('id', bid.id);
            return;
        }

        var { error: buyErr } = await _supabase.from('factions').update({ corp_cash_reserves: buyerCash - bid.bid_amount }).eq('id', bid.bidder_faction_id);
        if (buyErr) { alert('Failed to deduct from buyer: ' + buyErr.message); return; }

        // 2. Credit to seller
        const sellerCash = Number(faction?.corp_cash_reserves ?? 0);
        var { error: sellErr } = await _supabase.from('factions').update({ corp_cash_reserves: sellerCash + bid.bid_amount }).eq('id', faction.id);
        if (sellErr) {
            // Rollback buyer deduction
            await _supabase.from('factions').update({ corp_cash_reserves: buyerCash }).eq('id', bid.bidder_faction_id);
            alert('Failed to credit seller: ' + sellErr.message);
            return;
        }
        faction.corp_cash_reserves = sellerCash + bid.bid_amount;

        // 3. Transfer subsidiary ownership
        await _supabase.from('corp_properties').update({ faction_id: bid.bidder_faction_id }).eq('id', sale.subsidiary_id);

        // 4. Transfer all properties in that nation to buyer
        const subNationProps = _ownedProperties.filter(p => p.nation_id === sale.nation_id && p.faction_id === faction.id);
        for (const prop of subNationProps) {
            await _supabase.from('corp_properties').update({ faction_id: bid.bidder_faction_id }).eq('id', prop.id);
        }

        // 5. Mark sale completed, bid accepted, other bids rejected
        await _supabase.from('subsidiary_sales').update({ status: 'completed', completed_at_tick: currentTick, accepted_bid_id: bid.id }).eq('id', sale.id);
        await _supabase.from('subsidiary_bids').update({ status: 'accepted', resolved_at_tick: currentTick }).eq('id', bid.id);
        await _supabase.from('subsidiary_bids').update({ status: 'rejected', resolved_at_tick: currentTick }).eq('sale_id', sale.id).neq('id', bid.id);

        subUpdateTopbarCash(faction.corp_cash_reserves);
        alert('Sale complete! Received ' + hfFmtBig(bid.bid_amount) + '.\n\n"' + sale.subsidiary_name + '" has been transferred to the buyer.');
        await subReloadCards();
        await loadMarketplaceListings();
        renderSubsidiaryMarketplaceCard();
    } catch (err) {
        console.error('[SubMarket] Accept bid error:', err);
        alert('Transfer failed: ' + err.message);
    } finally {
        _acceptBidLock = false;
    }
}

async function subCancelSale(saleId) {

}

// ─── INJECT / WITHDRAW: unified cash transfer between parent ↔ subsidiary ───
async function _subTransfer(propId, isWithdraw) {
    if (_subActionLock) return;
    const hq = _ownedProperties.find(p => p.id === propId);
    if (!hq) return;
    const parentCash = Number(faction?.corp_cash_reserves ?? 0);
    const subCash = Number(hq.sub_cash || 0);
    const verb = isWithdraw ? 'WITHDRAW' : 'INJECT CAPITAL';

    if (isWithdraw && subCash <= 0) { alert('This subsidiary has no cash to withdraw.'); return; }

    const maxAmount = isWithdraw ? subCash : parentCash;
    const input = prompt(
        verb + (isWithdraw ? ' from ' : ' into ') + hq.name + '\n\n' +
        'Parent cash: ' + hfFmtBig(parentCash) + '\n' +
        'Subsidiary cash: ' + hfFmtBig(subCash) + '\n\n' +
        'Enter amount (e.g., 5000000 or 5M):'
    );
    if (!input) return;

    const amount = subParseAmount(input);
    if (!amount || amount <= 0 || isNaN(amount)) { alert('Invalid amount.'); return; }
    if (amount > maxAmount) { alert('Insufficient ' + (isWithdraw ? 'subsidiary' : 'parent') + ' cash. Available: ' + hfFmtBig(maxAmount)); return; }

    const newParent = isWithdraw ? parentCash + amount : parentCash - amount;
    const newSub = isWithdraw ? subCash - amount : subCash + amount;
    if (!confirm(verb + ' ' + hfFmtBig(amount) + (isWithdraw ? ' from ' : ' into ') + hq.name + '?\n\nParent: ' + hfFmtBig(parentCash) + ' → ' + hfFmtBig(newParent) + '\nSubsidiary: ' + hfFmtBig(subCash) + ' → ' + hfFmtBig(newSub))) return;

    _subActionLock = true;
    try {
        await Promise.all([
            _supabase.from('factions').update({ corp_cash_reserves: newParent }).eq('id', faction.id),
            _supabase.from('corp_properties').update({ sub_cash: newSub }).eq('id', propId),
        ]);
        faction.corp_cash_reserves = newParent;
        hq.sub_cash = newSub;
        subUpdateTopbarCash(newParent);
        renderManageSubsidiariesCard();
        alert((isWithdraw ? 'Withdrew ' : 'Injected ') + hfFmtBig(amount) + (isWithdraw ? ' from ' : ' into ') + hq.name + '.');
    } catch (err) { alert('Failed: ' + err.message); }
    finally { _subActionLock = false; }
}
function subInjectCapital(propId) { _subTransfer(propId, false); }
function subWithdraw(propId) { _subTransfer(propId, true); }

// ─── MERGE: Absorb subsidiary into parent corporation ───
async function subMerge(propId) {
    if (_subActionLock) return;
    const sourceHq = _ownedProperties.find(p => p.id === propId);
    if (!sourceHq) return;

    const sourceData = getSubsidiaryData(sourceHq);
    const sourceNation = sourceData.nation;
    const sourceProps = subGetNationProps(sourceHq.nation_id);
    const sourceVal = sourceData.valuation;
    const sourceCash = sourceData.cash;
    const sourceRep = sourceData.reputation;
    const sourceSubsector = sourceData.subsector;
    const mergeCost = Math.round(sourceVal * 2.25);

    // Reputation impact: +10% or -20% of subsidiary's rep
    const repGain = Math.round(sourceRep * 0.10);
    const repLoss = Math.round(sourceRep * 0.20);

    // Workforce: hire workers to fill total capacity
    // hfGetCapacity() already includes subsidiary properties (they're in _ownedProperties)
    const totalCapacity = hfGetCapacity();
    const currentWorkforce = HF_TYPES.reduce((s, t) => s + Number(faction?.[t.factionKey] ?? 0), 0);
    const workersToHire = Math.max(0, totalCapacity - currentWorkforce);

    const parentCash = Number(faction?.corp_cash_reserves ?? 0);
    if (mergeCost > parentCash) {
        alert(
            'Insufficient cash to acquire subsidiary.\n\n' +
            'Acquisition cost (2.25× valuation): ' + hfFmtBig(mergeCost) + '\n' +
            'Available cash: ' + hfFmtBig(parentCash)
        );
        return;
    }

    if (sourceData.projects > 0) {
        alert('Cannot merge — subsidiary has ' + sourceData.projects + ' active project(s). Complete or abandon them first.');
        return;
    }

    if (!confirm(
        'MERGE "' + sourceHq.name + '" INTO YOUR CORPORATION\n\n' +
        'Acquisition cost (2.25× valuation): ' + hfFmtBig(mergeCost) + '\n' +
        'Subsidiary cash absorbed: ' + hfFmtBig(sourceCash) + '\n' +
        'Net cost: ' + hfFmtBig(mergeCost - sourceCash) + '\n\n' +
        '• ' + sourceProps.length + ' properties transferred to parent\n' +
        '• Subsidiary subsector "' + sourceSubsector + '" added to portfolio\n' +
        '• Workers hired to max capacity (+' + workersToHire.toLocaleString() + ')\n' +
        '• Reputation: +' + repGain + ' or -' + repLoss + ' (from sub rep ' + sourceRep + ')\n\n' +
        'This cannot be undone.'
    )) return;

    _subActionLock = true;
    try {
        // Transfer all properties to parent nation; demote HQ, clear subsidiary fields
        const parentNationId = faction.nation_id;
        if (sourceProps.length > 0) {
            const nonHqIds = sourceProps.filter(p => p.id !== sourceHq.id).map(p => p.id);
            if (nonHqIds.length === 1) {
                const { error: propErr } = await _supabase.from('corp_properties').update({
                    nation_id: parentNationId,
                    type: 'office',
                }).eq('id', nonHqIds[0]);
                if (propErr) throw propErr;
            } else if (nonHqIds.length > 1) {
                const { error: propErr } = await _supabase.from('corp_properties').update({
                    nation_id: parentNationId,
                    type: 'office',
                }).in('id', nonHqIds);
                if (propErr) throw propErr;
            }
            // Demote HQ: clear sub_cash, subsector, convert to office
            const { error: hqErr } = await _supabase.from('corp_properties').update({
                nation_id: parentNationId,
                type: 'office',
                sub_cash: 0,
                subsector: null,
            }).eq('id', sourceHq.id);
            if (hqErr) throw hqErr;
        }

        // Compute faction updates
        const newParentCash = parentCash - mergeCost + sourceCash;
        const currentGeneral = Number(faction?.corp_general_workforce ?? 0);
        const newGeneral = currentGeneral + workersToHire;
        const repDelta = Math.random() >= 0.5 ? repGain : -repLoss;
        const currentStanding = Number(faction?.standing ?? 50);
        const newStanding = Math.max(0, Math.min(100, currentStanding + repDelta));

        const { error: factionErr } = await _supabase.from('factions').update({
            corp_cash_reserves: newParentCash,
            corp_general_workforce: newGeneral,
            standing: newStanding,
        }).eq('id', faction.id);
        if (factionErr) throw factionErr;

        faction.corp_cash_reserves = newParentCash;
        faction.corp_general_workforce = newGeneral;
        faction.standing = newStanding;
        subUpdateTopbarCash(newParentCash);

        await subReloadCards();
        alert(
            'Merger complete!\n\n' +
            '"' + sourceHq.name + '" absorbed into your corporation.\n' +
            'Cost: ' + hfFmtBig(mergeCost) + ' | Cash absorbed: ' + hfFmtBig(sourceCash) + '\n' +
            'Reputation ' + (repDelta >= 0 ? '+' : '') + repDelta + ' (now ' + newStanding + ')\n' +
            'Workers hired: +' + workersToHire.toLocaleString() + ' general workforce\n' +
            'Properties: ' + sourceProps.length + ' transferred to parent'
        );
    } catch (err) { alert('Merge failed: ' + err.message); }
    finally { _subActionLock = false; }
}

async function loadNationsForSubsidiary() {
    const { data, error } = await _supabase.from('nations').select('*').order('name');
    if (error) { console.warn('[Subsidiary] Failed to load nations:', error.message); }
    _subNations = (data || []).filter(n => n.id !== faction?.nation_id);

    // Count active corps per nation for demand indicator
    const { data: corps } = await _supabase.from('factions')
        .select('nation_id')
        .eq('faction_type', 'corporation')
        .is('abandoned_at', null);
    _subNationCorpCounts = {};
    for (const c of (corps || [])) {
        if (c.nation_id) _subNationCorpCounts[c.nation_id] = (_subNationCorpCounts[c.nation_id] || 0) + 1;
    }

    // Default sector and subsector to parent's
    _subSelectedSector = faction?.corp_sector || '';
    _subSelectedSubsector = faction?.corp_subsector || '';
}

function subGetSubsectors() {
    const sector = _subSelectedSector || faction?.corp_sector || '';
    return SUB_SUBSECTORS[sector] || [{ id: 'general', name: sector || 'General', mod: 0 }];
}

function subSetSector(sector) {
    _subSelectedSector = sector;
    // Reset subsector to first option of new sector
    const subs = SUB_SUBSECTORS[sector];
    _subSelectedSubsector = subs ? subs[0].name : '';
    renderCreateSubsidiaryCard();
}

function subGetSectorMultiplier() {
    const parentSector = faction?.corp_sector || '';
    if (_subSelectedSector === parentSector) return 1;
    return SUB_SECTOR_MULTIPLIERS[_subSelectedSector] || 4;
}

function subGetSubsectorMod() {
    const subsectors = subGetSubsectors();
    const sel = subsectors.find(s => s.name === _subSelectedSubsector);
    return sel ? sel.mod : 0;
}

function subCalcNationMultiplier(n) {
    const sol = Number(n.standard_of_living ?? 50);
    // Multiplier based on standard of living: higher SoL = more expensive
    return Math.max(0.5, Math.round((sol / 50) * 100) / 100);
}

function subCalcEntryCost(n) {
    const BASE = 50000000;
    const sectorMult = subGetSectorMultiplier();
    const subsectorMod = 1 + subGetSubsectorMod();
    const nationMult = subCalcNationMultiplier(n);
    return Math.round(Math.max(10000000, BASE * sectorMult * subsectorMod * nationMult));
}

function subGetDemand(nationId) {
    const count = _subNationCorpCounts[nationId] || 0;
    if (count <= 1) return { label: 'HIGH', color: '#5c5' };
    if (count <= 3) return { label: 'MODERATE', color: '#ca5' };
    return { label: 'LOW', color: '#c55' };
}

function subSelectNation(nationId) {
    _subSelectedNation = _subSelectedNation === nationId ? null : nationId;
    if (_subSelectedNation) {
        const n = _subNations.find(x => x.id === _subSelectedNation);
        _subCustomName = (faction?.faction_name || 'Subsidiary') + ' ' + (n?.name || '');
    } else {
        _subCustomName = '';
    }
    renderCreateSubsidiaryCard();
}

function subSetSubsector(name) {
    _subSelectedSubsector = name;
    renderCreateSubsidiaryCard();
}

function subSetName(val) {
    _subCustomName = val;
}

function subSetAbbr(val) {
    _subCustomAbbr = val.toUpperCase().slice(0, 4);
}

async function subCreate() {
    if (_subCreating || !_subSelectedNation) return;
    const nation = _subNations.find(n => n.id === _subSelectedNation);
    if (!nation) return;

    const subName = (_subCustomName || '').trim();
    const subAbbr = (_subCustomAbbr || '').trim();
    if (!subName) { alert('Please enter a corporation name for the subsidiary.'); return; }
    if (subAbbr.length < 2) { alert('Please enter an abbreviation (2-4 chars).'); return; }

    // Check if already have subsidiary there (marketplace HQs don't count — they have role='regional_hq')
    const existing = _ownedProperties.find(p => p.nation_id === nation.id && p.role === 'subsidiary');
    if (existing) { alert('You already have a subsidiary in ' + nation.name); return; }

    const cost = subCalcEntryCost(nation);
    const cash = Number(faction?.corp_cash_reserves ?? 0);
    if (cost > cash) {
        alert('Insufficient cash. Entry cost: ' + hfFmtBig(cost) + ', available: ' + hfFmtBig(cash));
        return;
    }

    if (!confirm('Establish subsidiary in ' + nation.name + '?\n\nName: ' + subName + ' (' + subAbbr + ')\nSubsector: ' + (_subSelectedSubsector || 'General') + '\nEntry cost: ' + hfFmtBig(cost) + '\nCreates a Regional HQ (500 capacity)\nUnlocks ' + nation.name + ' for operations\n\nDeducted from cash reserves.')) return;

    _subCreating = true;
    try {
        const shardRes = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const currentTick = shardRes.data?.current_tick || 0;
        const condition = 85 + Math.floor(Math.random() * 16); // 85-100% new build
        const maint = Math.round(cost * 0.005);

        // Create subsidiary (stored as type='regional_hq' for legacy compat,
        // distinguished from marketplace HQs by role='subsidiary').
        const { error: propErr } = await _supabase.from('corp_properties').insert({
            faction_id: faction.id,
            nation_id: nation.id,
            name: subName,
            type: 'regional_hq',
            role: 'subsidiary',
            style: 'Modern',
            capacity: 500,
            purchase_price: cost,
            monthly_maintenance: maint,
            condition: condition,
            city: nation.capital || nation.name,
            purchased_at_tick: currentTick,
            is_active: true,
            subsector: _subSelectedSubsector || faction?.corp_subsector || null,
        });
        if (propErr) throw propErr;

        // Deduct cash
        const newCash = Math.max(0, cash - cost);
        await _supabase.from('factions').update({ corp_cash_reserves: newCash }).eq('id', faction.id);
        faction.corp_cash_reserves = newCash;

        subUpdateTopbarCash(newCash);

        // Log corporate event for news ticker + world events
        const selectedSector = _subSelectedSector || faction?.corp_sector || 'Unknown';
        try {
            await _supabase.from('event_log').insert({
                nation_id: nation.id,
                event_name: 'New Subsidiary Established',
                category: 'corporate',
                description_chosen: `${faction.faction_name} has invested ${hfFmtBig(cost)} to establish ${subName}, a new ${selectedSector} corporation in ${nation.name}.`,
                fired_at_tick: shard?.current_tick || 0,
            });
        } catch (_) { /* non-blocking */ }

        // One-time GDP growth nudge (+0.2) for the subsidiary nation
        try {
            const { data: subNation } = await _supabase.from('nations').select('gdp_growth').eq('id', nation.id).single();
            if (subNation) {
                await _supabase.from('nations').update({
                    gdp_growth: Math.min(100, Number(subNation.gdp_growth || 50) + 0.2)
                }).eq('id', nation.id);
            }
        } catch (_) { /* non-blocking */ }

        _subSelectedNation = null;
        _subCustomName = '';
        _subCustomAbbr = '';
        await subReloadCards();
        alert('Subsidiary "' + subName + '" established in ' + nation.name + '!\n\nCost: ' + hfFmtBig(cost) + '\nRegional HQ created with ' + condition + '% condition.');
    } catch (err) {
        alert('Failed: ' + err.message);
    } finally {
        _subCreating = false;
    }
}

    if (!faction || !shard) return;
    const cash = Number(faction.corp_cash_reserves ?? 0);
    if (cash < 500000) { alert('Insufficient cash. Need $500k.'); return; }

    const { error } = await _supabase.from('factions').update({
        corp_cash_reserves: cash - 500000,
    }).eq('id', faction.id);
    if (error) { alert('Failed: ' + error.message); return; }

    faction.corp_cash_reserves = cash - 500000;
    _investigatedCorps[targetCorpId] = true;
    localStorage.setItem('nationhood_investigated_corps', JSON.stringify(_investigatedCorps));

    // Reload the target corp's full data (including hidden financials)
    const { data: fullCorpData } = await _supabase.from('factions')
        .select('corp_cash_reserves, corp_loans, corp_reputation, corp_general_workforce, corp_skilled_workforce, corp_innovative_workforce')
        .eq('id', targetCorpId).single();
    if (fullCorpData) {
        const corp = _allCorps.find(c => c.id === targetCorpId);
        if (corp) {
            Object.assign(corp, fullCorpData);
            const cash = Number(fullCorpData.corp_cash_reserves || 0);
            const loans = Number(fullCorpData.corp_loans || 0);
            let receivables = 0;
            try {
                const { data: financePositions } = await _supabase.from('finance_active_loans')
                    .select('principal, remaining_principal, finance_loan_requests!inner(request_type)')
                    .eq('lender_faction_id', targetCorpId)
                    .in('status', ['current', 'late', 'delinquent']);
                receivables = computeFinanceReceivableValue(financePositions || []).total;
            } catch (err) {
                console.warn('[corpInvestigate] receivable lookup failed:', err);
            }
            corp.reputation = Math.round(Number(fullCorpData.corp_reputation ?? 50));
            corp.revenue = Math.round(cash * 0.1);
            corp.valuation = computeCorpValuation({ cash, loans, financeReceivables: receivables });
        }
    }

    renderCorporationsCard();
}

function renderCorporationsCard() {

                <div style="font-family:${mono};font-size:7px;color:${C.dim};margin-top:1px">${c._isSub ? '<span style="color:#8a6aaa;">SUB</span> · ' : ''}${c.corp_subsector || c.corp_sector || '—'}</div>
            </div>
            <span style="width:62px"><span style="font-family:${mono};font-size:8px;padding:1px 5px;color:${C.accent};background:rgba(139,154,107,0.08);border:1px solid rgba(139,154,107,0.15)">${(c.nation || '—').toUpperCase().slice(0,6)}</span></span>

            { label: 'Subsector', value: sel.corp_subsector || '—', color: C.accent },

            { label: 'Cash Reserves', value: isPrivateHidden ? 'UNDISCLOSED' : hfFmtBig(sel.corp_cash_reserves || 0), color: isPrivateHidden ? C.dim : C.text },

                <span style="font-family:${mono};font-size:14px;font-weight:700;color:${C.gold}">${sel.abbr}</span>

                ${sel._isSub ? `<span style="font-family:${mono};font-size:8px;font-weight:700;padding:2px 6px;color:#8a6aaa;background:rgba(138,106,170,0.08);border:1px solid rgba(138,106,170,0.2)">SUBSIDIARY</span>` : ''}
                ${sel.isPlayer ? `<span style="font-family:${mono};font-size:8px;font-weight:700;padding:2px 6px;color:${C.blue};background:rgba(90,138,170,0.08);border:1px solid rgba(90,138,170,0.2)">PLAYER</span>` : `<span style="font-family:${mono};font-size:8px;color:${C.dim}">NPC</span>`}

        </div>
        ${stats.map(r => `<div style="display:flex;justify-content:space-between;padding:5px 16px;border-bottom:1px solid ${C.border};">
            <span style="font-family:${mono};font-size:10px;color:${C.dim};text-transform:uppercase">${r.label}</span>
            <span style="font-family:${mono};font-size:11px;font-weight:700;color:${r.value === 'UNDISCLOSED' ? C.dim : r.color};${r.value === 'UNDISCLOSED' ? 'font-style:italic;' : ''}">${r.value}</span>
        </div>`).join('')}
        <div style="padding:6px 14px;border-bottom:1px solid ${C.border};flex-shrink:0;">
            <div style="width:100%;height:4px;background:${C.border}"><div style="width:${sel.reputation}%;height:100%;background:${sel.reputation >= 70 ? C.greenBright : sel.reputation >= 40 ? C.accent : C.yellow}"></div></div>
        </div>
        ${isPrivateHidden ? `<div style="padding:6px 14px;border-bottom:1px solid ${C.border};background:rgba(200,168,50,0.03);">
            <div style="font-family:${mono};font-size:8px;color:${C.gold};margin-bottom:2px">PRIVATE — FINANCIALS UNDISCLOSED</div>
            <div style="font-size:9px;color:${C.dim};line-height:1.4">Use INVESTIGATE to reveal financial data for 12 ticks.</div>
        </div>` : ''}
        ${isState ? `<div style="padding:6px 14px;border-bottom:1px solid ${C.border};background:rgba(204,136,68,0.03);">
            <div style="font-family:${mono};font-size:8px;color:${C.orange};margin-bottom:2px">STATE-OWNED ENTERPRISE</div>
            <div style="font-size:9px;color:${C.dim};line-height:1.4">Government-controlled. Cannot be acquired directly. May be privatized by parliamentary vote.</div>
        </div>` : ''}
        <div style="flex:1"></div>
        <div style="padding:6px 14px;border-top:1px solid ${C.border};background:${C.card};flex-shrink:0;">
            <div style="font-family:${mono};font-size:8px;letter-spacing:1.5px;color:${C.dim};text-transform:uppercase;margin-bottom:6px">Actions</div>
            <div style="display:flex;gap:4px;margin-bottom:4px;">
                <div onclick="${isPrivateHidden ? `corpInvestigate('${sel.id}')` : ''}" style="flex:1;padding:5px 0;text-align:center;cursor:${isPrivateHidden ? 'pointer' : 'default'};font-family:${mono};font-size:8px;font-weight:700;color:${isPrivateHidden ? C.blue : isInvestigated ? C.greenBright : C.dim};border:1px solid ${isPrivateHidden ? C.blue + '44' : isInvestigated ? C.greenBright + '44' : C.border};opacity:${isPrivateHidden ? 1 : 0.3}">${isInvestigated ? 'INVESTIGATED ✓' : 'INVESTIGATE — $500k'}</div>
                <div style="flex:1;padding:5px 0;text-align:center;cursor:pointer;font-family:${mono};font-size:8px;font-weight:700;color:${C.accent};border:1px solid ${C.accent}44">PARTNER</div>
            </div>

                <div style="flex:1;padding:5px 0;text-align:center;cursor:${isState ? 'not-allowed' : 'pointer'};font-family:${mono};font-size:8px;font-weight:700;color:${isState ? C.dim : C.orange};border:1px solid ${isState ? C.border : C.orange + '44'};opacity:${isState ? 0.3 : 1}">MERGER</div>
            </div>
            ${isState ? `<div style="margin-top:4px;font-family:${mono};font-size:7px;color:${C.dim}">State-owned corps cannot be acquired or merged.</div>` : ''}
        </div>`;
    } else {
        detailHtml = `<div style="padding:30px;text-align:center;font-family:${mono};font-size:10px;color:${C.dim}">Select a corporation to view details.</div>`;
    }

    // Filter pills
    const filterHtml = `
    <div style="padding:6px 16px;border-bottom:1px solid ${C.border};background:${C.card};display:flex;gap:12px;align-items:center;flex-shrink:0;">
        <div style="display:flex;gap:3px;align-items:center;">
            <span style="font-family:${mono};font-size:8px;color:${C.dim};letter-spacing:0.8px;width:40px">NATION</span>
            <span onclick="corpFilterNation('ALL')" style="padding:3px 8px;font-family:${mono};font-size:8px;font-weight:700;cursor:pointer;color:${_corpFilterNation === 'ALL' ? '#000' : C.dim};background:${_corpFilterNation === 'ALL' ? C.accent : 'transparent'};border:1px solid ${_corpFilterNation === 'ALL' ? C.accent : C.border}">ALL</span>
            ${nations.map(n => `<span onclick="corpFilterNation('${n}')" style="padding:3px 8px;font-family:${mono};font-size:8px;font-weight:700;cursor:pointer;color:${_corpFilterNation === n ? '#000' : C.dim};background:${_corpFilterNation === n ? C.accent : 'transparent'};border:1px solid ${_corpFilterNation === n ? C.accent : C.border}">${n}</span>`).join('')}
        </div>
        <div style="flex:1"></div>
        <div style="display:flex;gap:3px;align-items:center;">
            <span style="font-family:${mono};font-size:8px;color:${C.dim};letter-spacing:0.8px">SORT</span>
            ${['REPUTATION', 'REVENUE', 'VALUATION'].map(s => `<span onclick="corpSort('${s}')" style="padding:3px 8px;font-family:${mono};font-size:8px;font-weight:700;cursor:pointer;color:${_corpSortBy === s ? '#000' : C.dim};background:${_corpSortBy === s ? C.accent : 'transparent'};border:1px solid ${_corpSortBy === s ? C.accent : C.border}">${s}</span>`).join('')}

                <span style="font-size:8px;color:${C.accent}">●</span>
                <span style="font-family:${mono};font-size:11px;font-weight:700;letter-spacing:2px;color:${C.muted};text-transform:uppercase">Corporations</span>
            </div>
            <span style="font-family:${mono};font-size:9px;color:${C.dim}">${_allCorps.length} IN DATABASE</span>
        </div>
        ${filterHtml}
        <div style="flex:1;display:flex;overflow:hidden;">
            <div style="flex:1;border-right:1px solid ${C.border};display:flex;flex-direction:column;">
                <div style="display:flex;padding:5px 16px;border-bottom:1px solid ${C.border};background:${C.card};flex-shrink:0;">
                    <span style="width:42px;font-family:${mono};font-size:8px;color:${C.dim}">ABBR</span>
                    <span style="flex:1.3;font-family:${mono};font-size:8px;color:${C.dim}">CORPORATION</span>
                    <span style="width:62px;font-family:${mono};font-size:8px;color:${C.dim}">NATION</span>
                    <span style="width:56px;font-family:${mono};font-size:8px;color:${C.dim};text-align:right">REV</span>
                    <span style="width:34px;font-family:${mono};font-size:8px;color:${C.dim};text-align:right">REP</span>
                    <span style="width:56px;font-family:${mono};font-size:8px;color:${C.dim};text-align:right">VALUE</span>
                    <span style="width:48px;font-family:${mono};font-size:8px;color:${C.dim};text-align:center">STATUS</span>
                </div>
                <div style="flex:1;overflow:auto;">${tableRows}</div>
            </div>
            <div style="width:280px;display:flex;flex-direction:column;overflow:auto;">
                ${detailHtml}

        </div>
    </div>`;
}

window.corpSelect = corpSelect;
window.corpInvestigate = corpInvestigate;
window.corpFilterNation = corpFilterNation;
window.corpSort = corpSort;

// Hire/Fire card onclick handlers. On the old in-page Expansion tab
// these lived in corp-operations.html's tail at lines ~14226-14228; the
// Commit 1 extraction pulled every other hf* helper into this file but
// missed re-binding these three to window, which made every +10/-10/+50/
// -50/X/CONFIRM button on the HF card throw ReferenceError.
window.hfSetChange = hfSetChange;
window.hfReset = hfReset;
window.hfConfirm = hfConfirm;

// ── Init ──
// On page load: fetch faction + shard + nationStats, render topbar, then
// run the full load+render pipeline that switchToExpansion used to run
// inside corp-operations.html. No sector redirect — Expansion works for
// every corp sector (Construction, Shipping, Finance) with content
// filtered by faction.corp_sector inside the render helpers.
async function init() {
    const { data: { user } } = await _supabase.auth.getUser();
    if (!user) { window.location.href = 'login.html'; return; }

    // Inspector mode: admin panel impersonation via ?faction_id=
    const urlFactionId = new URLSearchParams(location.search).get('faction_id');
    if (urlFactionId) {
        const { data: inspected, error: inspectErr } = await _supabase
            .from('factions').select('*').eq('id', urlFactionId).single();
        if (inspectErr) console.warn('[Inspector] faction fetch failed:', inspectErr.message);
        else if (inspected?.faction_type === 'corporation') faction = inspected;
    }

    if (!faction) {
        const { data: allFactions } = await _supabase.from('factions')
            .select('*').or(`id.eq.${user.id},linked_user_id.eq.${user.id}`);
        allUserFactions = (allFactions || []).filter(f => f.nation_id);

        const activeFactionId = sessionStorage.getItem('active_faction_id');
        faction = allUserFactions.find(f => f.id === activeFactionId)
            || allUserFactions.find(f => f.faction_type === 'corporation')
            || allUserFactions[0];

        if (!faction) { await _supabase.auth.signOut(); window.location.href = 'login.html'; return; }
        if (faction.faction_type !== 'corporation') { window.location.href = 'dashboard.html'; return; }
    }

    const [nationRes, shardRes] = await Promise.all([
        faction.nation_id
            ? _supabase.from('nations').select('*').eq('id', faction.nation_id).single()
            : Promise.resolve({ data: null }),
        _supabase.from('shard').select('current_tick, current_date, next_tick_at, tick_interval_hours').eq('name', 'Alpha Shard').single(),
    ]);
    if (nationRes.data) nationStats = nationRes.data;
    shard = shardRes.data;

    // Render shared top bar with EXPANSION marked active.
    const topBarContainer = document.getElementById('corp-topbar-container');
    if (topBarContainer) {
        renderCorpTopBar(topBarContainer, { faction, shard, activeTab: 'expansion', allUserFactions });
    }

    // Show the page before kicking off the (potentially slow) render
    // pipeline so the topbar isn't delayed.
    document.getElementById('loading').style.display = 'none';
    document.getElementById('page-content').style.display = 'block';

    // Load + render pipeline — this is the exact body switchToExpansion
    // used to run inside corp-operations.html.
    await loadOwnedProperties();
    renderHireFireCard();
    renderWorkforceSummary();
    await loadAvailableProperties();
    renderNewPropertyCard();
    await loadNationsForSubsidiary();
    await loadSubsidiaryProjectCounts();
    renderCreateSubsidiaryCard();
    renderManageSubsidiariesCard();
    await loadAllCorporations();
    renderCorporationsCard();
    await loadMarketplaceListings();
    renderSubsidiaryMarketplaceCard();
}

init();
</script>
