<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum | Nationhood Alpha</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/forum.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="top-bar"></div>
<div id="content-area">
    <div id="forum-container">
        <div class="forum-loading">Loading forum...</div>
    </div>
</div>

<!-- Create Post Modal -->
<div class="forum-modal-overlay" id="create-post-modal">
    <div class="forum-modal">
        <div class="forum-modal-title">Create Post</div>
        <div class="forum-modal-identity" id="modal-identity"></div>
        <div class="form-group">
            <label class="form-label">Title</label>
            <input type="text" class="form-input" id="post-title" maxlength="200" placeholder="Thread title (5-200 characters)">
            <div class="char-count"><span id="title-chars">0</span>/200</div>
        </div>
        <div class="form-group">
            <label class="form-label">Body</label>
            <textarea class="form-input" id="post-body" maxlength="5000" placeholder="Write your post (10-5000 characters)"></textarea>
            <div class="char-count"><span id="body-chars">0</span>/5000</div>
        </div>
        <div class="internal-toggle">
            <input type="checkbox" id="post-internal">
            <div>
                <div class="internal-toggle-text"><strong>Internal Post Only</strong></div>
                <div class="internal-toggle-hint">Only political parties of this nation can reply. Other players can still read this thread.</div>
            </div>
        </div>
        <div class="forum-modal-footer">
            <button class="btn-cancel" id="modal-cancel-btn">Cancel</button>
            <button class="btn-submit" id="modal-submit-btn" disabled>Create Post</button>
        </div>
    </div>
</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { initPage, formatNumber, scaleRawToDollars } from './js/common.js';
import { escapeHtml, truncate } from './js/utils.js';

/**
 * Forum Page
 * Three levels: Categories > Subcategories (Nations) > Threads > Thread View
 * Routing via URL hash: #categories, #nations, #threads/<subcat-id>, #thread/<thread-id>
 */

let currentFaction = null;
let currentNation = null;
let currentShard = null;

// Nation descriptions (hardcoded for v1)
const NATION_DESCRIPTIONS = {
    'Avelia': 'A prosperous city-state with the highest standard of living on the continent.',
    'Melizea': 'A collapsing petrostate gripped by hyperinflation and civil unrest.',
    'Montequilla': 'A struggling republic caught between debt and reform.',
    'San Estrella': 'A resource-rich but corrupt republic drowning in debt.',
    'Sangreza': 'An oil-rich autocracy ruled with an iron fist.',
    'Veldaria': 'A resilient nation forging its identity amid regional tensions.'
};

const CATEGORY_ICONS = {
    'Nations': '\u{1F30D}',
    'Organizations': '\u{1F3DB}\u{FE0F}',
    'Conflicts': '\u{2694}\u{FE0F}'
};

const REPLIES_PER_PAGE = 20;

// ===== DATE HELPERS =====

function tickToDate(tick) {
    // Game starts at January 2000 (tick 0)
    const gameStartMonth = 1;
    const gameStartYear = 2000;
    const totalMonths = (gameStartMonth - 1) + tick;
    const year = gameStartYear + Math.floor(totalMonths / 12);
    const month = (totalMonths % 12) + 1;
    const monthNames = [
        'January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'
    ];
    return `${monthNames[month - 1]} ${year}`;
}

// ===== ROUTING =====

function getRoute() {
    const hash = window.location.hash.slice(1) || 'categories';
    const parts = hash.split('/');
    return { view: parts[0], id: parts[1] || null, page: parseInt(parts[2]) || 1 };
}

function navigate(hash) {
    window.location.hash = hash;
}

// ===== RENDER: CATEGORIES =====

async function renderCategories() {
    const container = document.getElementById('forum-container');
    container.innerHTML = '<div class="forum-loading">Loading...</div>';

    const { data: categories, error } = await _supabase
        .from('forum_categories')
        .select('*')
        .order('sort_order');

    if (error || !categories) {
        container.innerHTML = '<div class="forum-empty">Failed to load forum categories.</div>';
        return;
    }

    // Get nation count for the Nations category
    const nationsCategory = categories.find(c => c.name === 'Nations');
    let nationCount = 0;
    if (nationsCategory) {
        const { count } = await _supabase
            .from('forum_subcategories')
            .select('id', { count: 'exact', head: true })
            .eq('category_id', nationsCategory.id)
            .eq('is_enabled', true);
        nationCount = count || 0;
    }

    let html = `
        <div class="forum-breadcrumb">
            <span class="bc-current">Forum</span>
        </div>
    `;

    for (const cat of categories) {
        const icon = CATEGORY_ICONS[cat.name] || '';
        const isEnabled = cat.is_enabled;

        if (isEnabled) {
            const countLabel = cat.name === 'Nations' ? `${nationCount} nations` : '';
            html += `
                <div class="forum-card" onclick="window.location.hash='nations'">
                    <div class="forum-card-header">
                        <div class="forum-card-name"><span class="forum-card-icon">${icon}</span> ${cat.name}</div>
                        ${countLabel ? `<span class="forum-card-badge badge-count">${countLabel}</span>` : ''}
                    </div>
                    <div class="forum-card-desc">${cat.description || ''}</div>
                    <div class="forum-card-arrow">${countLabel} &rarr;</div>
                </div>
            `;
        } else {
            html += `
                <div class="forum-card disabled">
                    <div class="forum-card-header">
                        <div class="forum-card-name"><span class="forum-card-icon">${icon}</span> ${cat.name}</div>
                        <span class="forum-card-badge badge-coming-soon">Coming Soon</span>
                    </div>
                    <div class="forum-card-desc">${cat.description || ''}</div>
                </div>
            `;
        }
    }

    container.innerHTML = html;
}

// ===== RENDER: NATIONS (Subcategories) =====

async function renderNations() {
    const container = document.getElementById('forum-container');
    container.innerHTML = '<div class="forum-loading">Loading nations...</div>';

    // Get the Nations category
    const { data: nationsCategory } = await _supabase
        .from('forum_categories')
        .select('id')
        .eq('name', 'Nations')
        .single();

    if (!nationsCategory) {
        container.innerHTML = '<div class="forum-empty">Nations category not found.</div>';
        return;
    }

    // Get subcategories with nation data
    const { data: subcats } = await _supabase
        .from('forum_subcategories')
        .select('*, nations(id, name, government_type, population, gdp, stability, flag_url)')
        .eq('category_id', nationsCategory.id)
        .eq('is_enabled', true)
        .order('sort_order');

    if (!subcats || subcats.length === 0) {
        container.innerHTML = '<div class="forum-empty">No nations found.</div>';
        return;
    }

    // Get thread counts per subcategory
    const subcatIds = subcats.map(s => s.id);
    const { data: threadCounts } = await _supabase
        .from('forum_threads')
        .select('subcategory_id')
        .in('subcategory_id', subcatIds);

    const countMap = {};
    if (threadCounts) {
        for (const t of threadCounts) {
            countMap[t.subcategory_id] = (countMap[t.subcategory_id] || 0) + 1;
        }
    }

    let html = `
        <div class="forum-breadcrumb">
            <a href="#categories">Forum</a>
            <span class="bc-sep">&rsaquo;</span>
            <span class="bc-current">Nations</span>
        </div>
    `;

    for (const subcat of subcats) {
        const nation = subcat.nations;
        if (!nation) continue;

        const count = countMap[subcat.id] || 0;
        const desc = NATION_DESCRIPTIONS[nation.name] || '';
        const pop = nation.population ? formatNumber(nation.population) : 'N/A';
        const gdpScaled = scaleRawToDollars(nation.gdp);
        const gdp = gdpScaled ? '$' + formatNumber(Math.round(gdpScaled / 1e9)) + 'B' : 'N/A';
        const stability = nation.stability != null ? nation.stability : 'N/A';

        const flagUrl = nation.flag_url || '';

        html += `
            <div class="nation-forum-card" onclick="window.location.hash='threads/${subcat.id}'">
                <div class="nation-card-top">
                    <div class="nation-card-left">
                        ${flagUrl ? `<img class="nation-card-flag" src="${flagUrl}" alt="${escapeHtml(nation.name)} flag">` : ''}
                        <div class="nation-card-info">
                            <span class="nation-card-name">${escapeHtml(nation.name)}</span>
                            <span class="nation-card-govt">${nation.government_type || 'Unknown'}</span>
                        </div>
                    </div>
                    <span class="forum-card-badge badge-count">${count} thread${count !== 1 ? 's' : ''}</span>
                </div>
                <div class="nation-card-desc">${desc}</div>
                <div class="nation-card-stats">
                    <span><span class="stat-label">Pop:</span> <span class="stat-value">${pop}</span></span>
                    <span><span class="stat-label">GDP:</span> <span class="stat-value">${gdp}</span></span>
                    <span><span class="stat-label">Stability:</span> <span class="stat-value">${stability}</span></span>
                </div>
                <div class="nation-card-arrow">${count} thread${count !== 1 ? 's' : ''} &rarr;</div>
            </div>
        `;
    }

    container.innerHTML = html;
}

// ===== RENDER: THREAD LIST =====

async function renderThreadList(subcategoryId) {
    const container = document.getElementById('forum-container');
    container.innerHTML = '<div class="forum-loading">Loading threads...</div>';

    // Get subcategory + nation info
    const { data: subcat } = await _supabase
        .from('forum_subcategories')
        .select('*, nations(id, name, flag_url)')
        .eq('id', subcategoryId)
        .single();

    if (!subcat) {
        container.innerHTML = '<div class="forum-empty">Subcategory not found.</div>';
        return;
    }

    const nationName = subcat.nations?.name || subcat.name;
    const subcatNationId = subcat.nation_id;
    const canCreateThread = currentFaction && currentFaction.nation_id === subcatNationId;

    // Get threads with faction info
    const { data: threads } = await _supabase
        .from('forum_threads')
        .select('*, factions(id, faction_name, nation_id, color, nations!nation_id(name))')
        .eq('subcategory_id', subcategoryId)
        .order('is_pinned', { ascending: false })
        .order('last_activity_tick', { ascending: false });

    let html = `
        <div class="forum-breadcrumb">
            <a href="#categories">Forum</a>
            <span class="bc-sep">&rsaquo;</span>
            <a href="#nations">Nations</a>
            <span class="bc-sep">&rsaquo;</span>
            <span class="bc-current">${nationName}</span>
        </div>
        <div class="forum-header">
            <div class="forum-title">${nationName}</div>
            <div>
                ${canCreateThread
                    ? `<button class="create-post-btn" onclick="openCreatePostModal('${subcategoryId}', '${subcatNationId}')">+ Create Post</button>`
                    : `<span class="create-post-hint">Only ${escapeHtml(nationName)} parties can start threads here</span>`}
            </div>
        </div>
    `;

    if (!threads || threads.length === 0) {
        html += `
            <div class="forum-empty">
                No posts yet. Be the first to start a discussion.
            </div>
        `;
    } else {
        for (const thread of threads) {
            const faction = thread.factions;
            const factionName = faction?.faction_name || 'Unknown Faction';
            const factionNation = faction?.nations?.name || 'Unknown';
            const lockIcon = thread.is_internal ? '<span class="lock-icon">\u{1F512}</span> ' : '';
            const postedDate = tickToDate(thread.tick_posted);
            const lastReply = thread.reply_count > 0
                ? ` &middot; Last reply: ${tickToDate(thread.last_activity_tick)}`
                : '';

            html += `
                <div class="thread-card" onclick="window.location.hash='thread/${thread.id}'">
                    <div class="thread-card-title">${lockIcon}"${escapeHtml(thread.title)}"</div>
                    <div class="thread-card-meta">
                        <span>Posted by: <span class="thread-card-author">${escapeHtml(factionName)}</span></span>
                        <span class="meta-sep">(<span class="thread-card-nation">${escapeHtml(factionNation)}</span>)</span>
                        <span class="meta-sep">&middot;</span>
                        <span>${postedDate}</span>
                        <span class="meta-sep">&middot;</span>
                        <span>${thread.reply_count} repl${thread.reply_count !== 1 ? 'ies' : 'y'}</span>
                        ${thread.reply_count > 0 ? `<span>${lastReply}</span>` : ''}
                    </div>
                </div>
            `;
        }
    }

    container.innerHTML = html;
}

// ===== RENDER: THREAD VIEW =====

async function renderThreadView(threadId, page) {
    const container = document.getElementById('forum-container');
    container.innerHTML = '<div class="forum-loading">Loading thread...</div>';

    // Get thread with faction info + subcategory nation_id for internal checks
    const { data: thread, error } = await _supabase
        .from('forum_threads')
        .select('*, factions(id, faction_name, nation_id, color, seats, nations!nation_id(name)), forum_subcategories(id, nation_id, nations!nation_id(name))')
        .eq('id', threadId)
        .single();

    if (error || !thread) {
        container.innerHTML = '<div class="forum-empty">Thread not found.</div>';
        return;
    }

    const subcatId = thread.subcategory_id;
    const subcatNationId = thread.forum_subcategories?.nation_id || null;
    const subcatNationName = thread.forum_subcategories?.nations?.name || 'Unknown';
    const threadFaction = thread.factions;
    const isAuthor = currentFaction && thread.faction_id === currentFaction.id;

    // Get total reply count for pagination
    const { count: totalReplies } = await _supabase
        .from('forum_replies')
        .select('id', { count: 'exact', head: true })
        .eq('thread_id', threadId);

    const totalPages = Math.max(1, Math.ceil((totalReplies || 0) / REPLIES_PER_PAGE));
    if (page > totalPages) page = totalPages;

    // Get replies for current page
    const offset = (page - 1) * REPLIES_PER_PAGE;
    const { data: replies } = await _supabase
        .from('forum_replies')
        .select('*, factions(id, faction_name, nation_id, color, seats, nations!nation_id(name))')
        .eq('thread_id', threadId)
        .order('created_at', { ascending: true })
        .range(offset, offset + REPLIES_PER_PAGE - 1);

    // Can this user reply?
    const canReply = canUserReply(thread, subcatNationId);

    // Breadcrumb
    let html = `
        <div class="forum-breadcrumb">
            <a href="#categories">Forum</a>
            <span class="bc-sep">&rsaquo;</span>
            <a href="#nations">Nations</a>
            <span class="bc-sep">&rsaquo;</span>
            <a href="#threads/${subcatId}">${escapeHtml(subcatNationName)}</a>
            <span class="bc-sep">&rsaquo;</span>
            <span class="bc-current">${thread.is_internal ? '\u{1F512} ' : ''}"${escapeHtml(truncate(thread.title, 40))}"</span>
        </div>
    `;

    // OP post
    html += renderPost(thread, threadFaction, thread.tick_posted, thread.body, true, threadId, null, isAuthor, thread.is_internal);

    // Replies
    if (replies) {
        for (const reply of replies) {
            const replyFaction = reply.factions;
            const isReplyAuthor = currentFaction && reply.faction_id === currentFaction.id;
            html += renderPost(reply, replyFaction, reply.tick_posted, reply.body, false, threadId, reply.id, isReplyAuthor, thread.is_internal);
        }
    }

    // Pagination
    if (totalPages > 1) {
        html += '<div class="forum-pagination">';
        if (page > 1) {
            html += `<button onclick="window.location.hash='thread/${threadId}/${page - 1}'">&laquo; Prev</button>`;
        }
        for (let i = 1; i <= totalPages; i++) {
            html += `<button class="${i === page ? 'active' : ''}" onclick="window.location.hash='thread/${threadId}/${i}'">${i}</button>`;
        }
        if (page < totalPages) {
            html += `<button onclick="window.location.hash='thread/${threadId}/${page + 1}'">Next &raquo;</button>`;
        }
        html += '</div>';
    }

    // Reply box or internal notice
    if (canReply) {
        html += `
            <div class="reply-box">
                <textarea id="reply-body" placeholder="Write a reply..." maxlength="5000"></textarea>
                <div class="reply-box-footer">
                    <button class="reply-submit-btn" id="reply-submit-btn" disabled onclick="submitReply('${threadId}')">Post Reply</button>
                </div>
            </div>
        `;
    } else if (thread.is_internal) {
        html += `
            <div class="internal-notice">
                <span class="lock-icon">\u{1F512}</span> This thread is restricted to internal discussion.
                Only political parties of <strong>${escapeHtml(subcatNationName)}</strong> can reply.
            </div>
        `;
    }

    // Internal toggle for author
    if (isAuthor) {
        html += `
            <div style="margin-top: 16px; display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--bg-card); border-radius: 6px;">
                <input type="checkbox" id="toggle-internal" ${thread.is_internal ? 'checked' : ''} onchange="toggleInternal('${threadId}', this.checked)">
                <label for="toggle-internal" style="font-size: 0.85rem; color: var(--text-secondary); cursor: pointer;">
                    <strong style="color: var(--orange);">\u{1F512} Internal Post Only</strong> — Only parties of ${escapeHtml(subcatNationName)} can reply
                </label>
            </div>
        `;
    }

    container.innerHTML = html;

    // Bind reply textarea validation
    const replyBody = document.getElementById('reply-body');
    const replyBtn = document.getElementById('reply-submit-btn');
    if (replyBody && replyBtn) {
        replyBody.addEventListener('input', () => {
            const len = replyBody.value.trim().length;
            replyBtn.disabled = len < 1 || len > 5000;
        });
    }
}

function renderPost(item, faction, tick, body, isOp, threadId, replyId, isAuthor, isInternal) {
    const factionName = faction?.faction_name || 'Dissolved Faction';
    const factionNation = faction?.nations?.name || 'Unknown';
    const factionColor = faction?.color || '#888';
    const factionSeats = faction?.seats != null ? faction.seats : '?';
    const dateStr = tickToDate(tick);
    const isDissolved = !faction || !faction.id;

    let actionsHtml = '';
    if (isAuthor) {
        const editTarget = isOp ? `editOP('${threadId}')` : `editReply('${replyId}')`;
        actionsHtml += `<button class="post-action-btn" onclick="event.stopPropagation(); ${editTarget}">Edit</button>`;
    }

    return `
        <div class="thread-post ${isOp ? 'op' : ''}" id="${isOp ? 'post-op' : 'post-' + replyId}">
            <div class="post-header">
                <div class="post-author-info">
                    <div class="post-author-name">
                        ${escapeHtml(factionName)}
                        ${isDissolved ? '<span class="dissolved-badge">Dissolved</span>' : ''}
                    </div>
                    <div class="post-author-detail">
                        <span class="post-color-dot" style="background:${factionColor}"></span>
                        ${escapeHtml(factionNation)} &middot; ${factionSeats} seats
                    </div>
                </div>
                <div class="post-date">${dateStr}</div>
            </div>
            <div class="post-body" id="${isOp ? 'body-op' : 'body-' + replyId}">${escapeHtml(body)}</div>
            ${actionsHtml ? `<div class="post-actions">${actionsHtml}</div>` : ''}
        </div>
    `;
}

function canUserReply(thread, subcatNationId) {
    if (!currentFaction) return false;
    if (!thread.is_internal) return true;
    // Internal threads: only parties belonging to this nation can reply
    return currentFaction.nation_id === subcatNationId;
}

// ===== ACTIONS =====

// -- Create Post Modal --

let activeSubcategoryId = null;
let activeSubcategoryNationId = null;

window.openCreatePostModal = function(subcatId, nationId) {
    activeSubcategoryId = subcatId;
    activeSubcategoryNationId = nationId;

    // Double-check: only parties of this nation can create threads
    if (!currentFaction || currentFaction.nation_id !== nationId) {
        alert('Only political parties of this nation can start threads here.');
        return;
    }
    const modal = document.getElementById('create-post-modal');
    const identity = document.getElementById('modal-identity');
    const factionColor = currentFaction?.color || '#888';
    const factionName = currentFaction?.faction_name || 'Unknown';
    const nationName = currentNation?.name || 'Unknown';

    identity.innerHTML = `Posting as: <strong>${escapeHtml(factionName)}</strong> (${escapeHtml(nationName)}) <span class="post-color-dot" style="background:${factionColor}"></span>`;

    document.getElementById('post-title').value = '';
    document.getElementById('post-body').value = '';
    document.getElementById('post-internal').checked = false;
    document.getElementById('title-chars').textContent = '0';
    document.getElementById('body-chars').textContent = '0';
    document.getElementById('modal-submit-btn').disabled = true;

    modal.classList.add('active');
};

window.closeCreatePostModal = function() {
    document.getElementById('create-post-modal').classList.remove('active');
    activeSubcategoryId = null;
    activeSubcategoryNationId = null;
};

// Modal cancel
document.getElementById('modal-cancel-btn').addEventListener('click', () => window.closeCreatePostModal());

// Close on overlay click
document.getElementById('create-post-modal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) window.closeCreatePostModal();
});

// Input validation
const titleInput = document.getElementById('post-title');
const bodyInput = document.getElementById('post-body');

function validateCreateForm() {
    const titleLen = titleInput.value.trim().length;
    const bodyLen = bodyInput.value.trim().length;
    document.getElementById('title-chars').textContent = titleInput.value.length;
    document.getElementById('body-chars').textContent = bodyInput.value.length;
    document.getElementById('modal-submit-btn').disabled = titleLen < 5 || titleLen > 200 || bodyLen < 10 || bodyLen > 5000;
}
titleInput.addEventListener('input', validateCreateForm);
bodyInput.addEventListener('input', validateCreateForm);

// Submit create post
document.getElementById('modal-submit-btn').addEventListener('click', async () => {
    const btn = document.getElementById('modal-submit-btn');
    if (btn.disabled) return;
    btn.disabled = true;
    btn.textContent = 'Creating...';

    const title = titleInput.value.trim();
    const body = bodyInput.value.trim();
    const isInternal = document.getElementById('post-internal').checked;

    // Get current tick
    const { data: shard } = await _supabase
        .from('shard')
        .select('current_tick')
        .eq('name', 'Alpha Shard')
        .single();

    const tick = shard?.current_tick || 0;

    const { data: newThread, error } = await _supabase
        .from('forum_threads')
        .insert({
            subcategory_id: activeSubcategoryId,
            faction_id: currentFaction.id,
            title: title,
            body: body,
            tick_posted: tick,
            last_activity_tick: tick,
            is_internal: isInternal
        })
        .select('id')
        .single();

    btn.textContent = 'Create Post';

    if (error) {
        alert('Failed to create post: ' + error.message);
        btn.disabled = false;
        return;
    }

    window.closeCreatePostModal();
    navigate('thread/' + newThread.id);
});

// -- Submit Reply --

window.submitReply = async function(threadId) {
    const replyBody = document.getElementById('reply-body');
    const btn = document.getElementById('reply-submit-btn');
    const body = replyBody.value.trim();

    if (body.length < 1 || body.length > 5000) return;
    btn.disabled = true;
    btn.textContent = 'Posting...';

    // Verify reply permission: for internal threads, only parties of the same nation can reply
    const { data: threadCheck } = await _supabase
        .from('forum_threads')
        .select('faction_id, is_internal, forum_subcategories(nation_id)')
        .eq('id', threadId)
        .single();

    if (threadCheck && threadCheck.is_internal) {
        const threadNationId = threadCheck.forum_subcategories?.nation_id;
        if (currentFaction.nation_id !== threadNationId) {
            alert('This thread is restricted to internal discussion. Only parties of this nation can reply.');
            btn.textContent = 'Post Reply';
            btn.disabled = false;
            return;
        }
    }

    const { data: shard } = await _supabase
        .from('shard')
        .select('current_tick')
        .eq('name', 'Alpha Shard')
        .single();

    const tick = shard?.current_tick || 0;

    const { error: replyError } = await _supabase
        .from('forum_replies')
        .insert({
            thread_id: threadId,
            faction_id: currentFaction.id,
            body: body,
            tick_posted: tick
        });

    if (replyError) {
        alert('Failed to post reply: ' + replyError.message);
        btn.textContent = 'Post Reply';
        btn.disabled = false;
        return;
    }

    // reply_count and last_activity_tick are auto-updated by DB trigger
    // Fetch the updated count for pagination
    const { count: actualCount } = await _supabase
        .from('forum_replies')
        .select('id', { count: 'exact', head: true })
        .eq('thread_id', threadId);

    // Navigate to last page to see the new reply
    const totalPages = Math.max(1, Math.ceil((actualCount || 1) / REPLIES_PER_PAGE));
    // Force re-render
    const route = getRoute();
    if (route.view === 'thread' && route.id === threadId && route.page === totalPages) {
        await renderThreadView(threadId, totalPages);
    } else {
        navigate(`thread/${threadId}/${totalPages}`);
    }
};

// -- Edit OP --

window.editOP = async function(threadId) {
    const bodyEl = document.getElementById('body-op');
    if (!bodyEl) return;
    const currentBody = bodyEl.textContent;
    const postEl = document.getElementById('post-op');

    // Replace body with textarea
    bodyEl.outerHTML = `
        <textarea class="edit-body-area" id="edit-op-area" maxlength="5000">${escapeHtml(currentBody)}</textarea>
        <div class="edit-actions">
            <button class="edit-cancel" onclick="cancelEdit('${threadId}')">Cancel</button>
            <button class="edit-save" onclick="saveOP('${threadId}')">Save</button>
        </div>
    `;
};

window.saveOP = async function(threadId) {
    const area = document.getElementById('edit-op-area');
    if (!area) return;
    const newBody = area.value.trim();
    if (newBody.length < 10 || newBody.length > 5000) {
        alert('Post body must be between 10 and 5000 characters.');
        return;
    }

    const { error } = await _supabase
        .from('forum_threads')
        .update({ body: newBody, updated_at: new Date().toISOString() })
        .eq('id', threadId)
        .eq('faction_id', currentFaction.id);

    if (error) {
        alert('Failed to save: ' + error.message);
        return;
    }

    const route = getRoute();
    await renderThreadView(threadId, route.page);
};

window.cancelEdit = async function(threadId) {
    const route = getRoute();
    await renderThreadView(threadId, route.page);
};

// -- Edit Reply --

window.editReply = async function(replyId) {
    const bodyEl = document.getElementById('body-' + replyId);
    if (!bodyEl) return;
    const currentBody = bodyEl.textContent;

    bodyEl.outerHTML = `
        <textarea class="edit-body-area" id="edit-reply-area-${replyId}" maxlength="5000">${escapeHtml(currentBody)}</textarea>
        <div class="edit-actions">
            <button class="edit-cancel" onclick="cancelReplyEdit()">Cancel</button>
            <button class="edit-save" onclick="saveReply('${replyId}')">Save</button>
        </div>
    `;
};

window.saveReply = async function(replyId) {
    const area = document.getElementById('edit-reply-area-' + replyId);
    if (!area) return;
    const newBody = area.value.trim();
    if (newBody.length < 1 || newBody.length > 5000) {
        alert('Reply must be between 1 and 5000 characters.');
        return;
    }

    const { error } = await _supabase
        .from('forum_replies')
        .update({ body: newBody, updated_at: new Date().toISOString() })
        .eq('id', replyId)
        .eq('faction_id', currentFaction.id);

    if (error) {
        alert('Failed to save: ' + error.message);
        return;
    }

    const route = getRoute();
    await renderThreadView(route.id, route.page);
};

window.cancelReplyEdit = async function() {
    const route = getRoute();
    await renderThreadView(route.id, route.page);
};

// -- Toggle Internal --

window.toggleInternal = async function(threadId, isInternal) {
    const { error } = await _supabase
        .from('forum_threads')
        .update({ is_internal: isInternal })
        .eq('id', threadId)
        .eq('faction_id', currentFaction.id);

    if (error) {
        alert('Failed to update: ' + error.message);
    }
};

// ===== ROUTER =====

async function handleRoute() {
    const route = getRoute();
    switch (route.view) {
        case 'categories':
            await renderCategories();
            break;
        case 'nations':
            await renderNations();
            break;
        case 'threads':
            if (route.id) await renderThreadList(route.id);
            else await renderCategories();
            break;
        case 'thread':
            if (route.id) await renderThreadView(route.id, route.page);
            else await renderCategories();
            break;
        default:
            await renderCategories();
    }
}

window.addEventListener('hashchange', handleRoute);

// ===== INIT =====

initPage('forum', async (state) => {
    currentFaction = state.faction;
    currentNation = state.nation;
    currentShard = state.shard;
    await handleRoute();
});
</script>
