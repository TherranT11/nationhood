<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · Nationhood Game</title>
<link rel="stylesheet" href="/site.css">
<style>
  body {
    margin: 0; background: #fff; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* form */
  .auth { max-width: 380px; margin: 0 auto; padding: 64px 24px; }
  h1 { font-size: 26px; letter-spacing: -0.03em; font-weight: 800; margin: 0 0 24px; text-align: center; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 6px; }
  .field { margin-bottom: 16px; }
  input {
    width: 100%; font-size: 15px; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 12px; background: #fff; color: var(--ink); outline: none;
    transition: border-color .15s ease;
  }
  input:focus { border-color: #b9b9b9; }
  .actions { display: flex; gap: 10px; margin-top: 22px; }
  .actions .btn { flex: 1; padding: 12px 16px; font-size: 15px; }
  .msg { margin-top: 16px; font-size: 14px; text-align: center; min-height: 20px; }
  .msg.error { color: var(--err); }
  .msg.ok { color: var(--muted); }
</style>
</head>
<body>
  <header>
    <div class="wrap nav">
      <div class="brand">Nationhood</div>
      <nav class="nav-actions">
        <a class="btn btn-discord" href="https://discord.gg/HBvWxJUm8" target="_blank" rel="noopener" aria-label="Join the Discord">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.369A19.79 19.79 0 0 0 16.558 3a13.6 13.6 0 0 0-.6 1.23 18.27 18.27 0 0 0-5.487 0A13.6 13.6 0 0 0 9.87 3a19.79 19.79 0 0 0-3.76 1.369C2.72 9.046 1.79 13.605 2.255 18.1a19.9 19.9 0 0 0 6.073 3.058c.49-.668.926-1.377 1.302-2.122a12.93 12.93 0 0 1-2.05-.978c.172-.126.34-.257.502-.392a14.2 14.2 0 0 0 12.036 0c.164.135.332.266.502.392-.654.386-1.343.714-2.052.98.376.743.812 1.452 1.302 2.12a19.86 19.86 0 0 0 6.075-3.058c.546-5.21-.93-9.728-3.93-13.73ZM9.682 15.33c-1.182 0-2.157-1.086-2.157-2.42 0-1.333.955-2.42 2.157-2.42 1.21 0 2.176 1.097 2.157 2.42 0 1.334-.955 2.42-2.157 2.42Zm4.636 0c-1.182 0-2.157-1.086-2.157-2.42 0-1.333.955-2.42 2.157-2.42 1.21 0 2.176 1.097 2.157 2.42 0 1.334-.946 2.42-2.157 2.42Z"/></svg>
          Discord
        </a>
        <a class="btn btn-ghost login" href="/login/">Login</a>
        <a class="btn btn-solid" href="/signup/">Sign Up</a>
      </nav>
    </div>
  </header>

  <main class="auth">
    <h1>Login</h1>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <div class="actions">
        <a class="btn btn-ghost" href="/" role="button">Go Back</a>
        <button class="btn btn-solid" type="submit" id="submit-btn">Login</button>
      </div>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script type="module">
    import { supabase, isConfigured, currentParty } from '/supabase.js';

    const form = document.getElementById('login-form');
    const btn = document.getElementById('submit-btn');
    const msg = document.getElementById('msg');

    function setMsg(text, kind) {
      msg.textContent = text;
      msg.className = 'msg' + (kind ? ' ' + kind : '');
    }

    let submitting = false; // loading lock: blocks double-fire

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (submitting) return;

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        setMsg('Please enter your e-mail and password.', 'error');
        return;
      }
      if (!isConfigured) {
        setMsg('Login is not connected yet (Supabase keys missing).', 'error');
        return;
      }

      submitting = true;
      btn.disabled = true;
      setMsg('Signing you in…', 'ok');

      try {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) {
          setMsg(error.message, 'error');
          submitting = false;
          btn.disabled = false;
          return;
        }
        // Returning player with a party → their instance; otherwise the menu.
        const party = await currentParty();
        window.location.href = party ? '/play/' : '/home/';
      } catch (err) {
        setMsg('Something went wrong. Please try again.', 'error');
        submitting = false;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
