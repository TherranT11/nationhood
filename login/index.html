<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nationhood — Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@400&family=Spectral:wght@300;400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#0F1417; --ink2:#151C20; --line:#33413F;
    --vellum:#E6E0D0; --vellum-dim:#9AA39B;
    --brass:#C8A15A; --brass-dim:#8A6E3C; --seal:#9B3B33;
    --display:'Grenze Gotisch','Iowan Old Style',Georgia,serif;
    --body:'Spectral','Iowan Old Style',Georgia,serif;
    --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--vellum); font-family:var(--body);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:48px 24px; }
  :focus-visible { outline:1px solid var(--brass); outline-offset:3px; }

  .wrap { width:100%; max-width:420px; }
  .mono { font-family:var(--mono); }

  .masthead { text-align:center; margin-bottom:38px; }
  .crest { display:block; margin:0 auto; }
  .title { font-family:var(--display); font-size:48px; font-weight:400; line-height:0.95; margin:16px 0 0; }
  .tagline { display:flex; align-items:center; justify-content:center; gap:14px; margin-top:14px; }
  .tagline .rule { height:1px; width:28px; background:var(--brass-dim); }
  .tagline .words { font-family:var(--mono); font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--vellum-dim); white-space:nowrap; }

  .label { font-family:var(--mono); font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--vellum-dim); display:block; margin-bottom:8px; }
  .field { margin-bottom:20px; }
  .field.pass { margin-bottom:18px; }
  .field-top { display:flex; justify-content:space-between; align-items:baseline; }

  input[type="text"], input[type="password"] { width:100%; box-sizing:border-box; background:var(--ink2);
    border:1px solid var(--line); color:var(--vellum); padding:13px 14px; font-size:15px; font-family:inherit;
    border-radius:0; outline:none; transition:border-color 160ms ease; }
  input[type="text"]:focus, input[type="password"]:focus { border-color:var(--brass); }
  input::placeholder { color:var(--vellum-dim); opacity:0.5; }

  .toggle { font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--vellum-dim); cursor:pointer; background:none; border:none; }
  .toggle:hover { color:var(--brass); }

  .row { display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; }
  .remember { display:flex; align-items:center; gap:9px; font-size:13px; color:var(--vellum-dim); font-weight:300; cursor:pointer; }
  .remember input { accent-color:var(--brass); width:14px; height:14px; }
  .link { font-size:13px; color:var(--vellum-dim); font-weight:300; cursor:pointer; background:none; border:none;
    border-bottom:1px solid var(--line); padding:0; font-family:inherit; }
  .link:hover { color:var(--brass); border-color:var(--brass); }

  .actions { display:flex; gap:12px; }
  .btn { padding:14px 0; font-size:13px; letter-spacing:0.16em; text-transform:uppercase; font-family:inherit;
    cursor:pointer; transition:background 160ms ease, color 160ms ease, border-color 160ms ease, opacity 160ms ease; }
  .btn-quiet { width:110px; flex-shrink:0; background:transparent; color:var(--vellum-dim); border:1px solid var(--line); }
  .btn-quiet:hover { color:var(--brass); border-color:var(--brass); }
  .btn-solid { flex:1; background:var(--brass); color:var(--ink); border:1px solid var(--brass); }
  .btn-solid:hover:not(:disabled) { background:var(--vellum); border-color:var(--vellum); }
  .btn:disabled { cursor:not-allowed; opacity:0.4; }

  .signup-note { text-align:center; margin-top:26px; font-size:13px; color:var(--vellum-dim); font-weight:300; }
  .signup-note .link { color:var(--vellum); border-color:var(--brass-dim); }

  .tick { margin-top:34px; padding-top:18px; border-top:1px solid var(--line); display:flex; justify-content:space-between;
    font-family:var(--mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--vellum-dim); }
  .tick .clock { color:var(--brass); }

  .alert { border:1px solid var(--seal); background:var(--ink2); padding:12px 14px; margin-bottom:22px;
    font-size:13px; line-height:1.6; color:var(--vellum); font-weight:300; }
  .alert[hidden] { display:none; }
  .alert-k { font-family:var(--mono); font-size:10px; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--seal); display:block; margin-bottom:5px; }

  @media (max-width:640px) { .title { font-size:40px; } }
</style>
</head>
<body>
  <div class="wrap">

    <div class="masthead">
      <svg class="crest" width="84" height="92" viewBox="23 4 154 168" fill="none" aria-hidden="true">
        <path d="M100 10 L169 48 L169 124 L100 162 L31 124 L31 48 Z" stroke="#C8A15A" stroke-width="5" stroke-linejoin="round"/>
        <path d="M100 29 L152 58 L152 116 L100 145 L48 116 L48 58 Z" stroke="#8A6E3C" stroke-width="2" stroke-linejoin="round"/>
        <path d="M71 101 L77 75 L88 89 L100 66 L112 89 L123 75 L129 101 Z" fill="#C8A15A" stroke-linejoin="round"/>
        <circle cx="77" cy="72" r="4.5" fill="#C8A15A"/>
        <circle cx="100" cy="62" r="5" fill="#C8A15A"/>
        <circle cx="123" cy="72" r="4.5" fill="#C8A15A"/>
        <path d="M100 111 L111 122 L100 133 L89 122 Z" fill="#C8A15A"/>
      </svg>
      <h1 class="title">Log in</h1>
      <div class="tagline">
        <span class="rule" aria-hidden="true"></span>
        <span class="words">Second Age · Vaunt</span>
        <span class="rule" aria-hidden="true"></span>
      </div>
    </div>

    <div class="alert" id="alert" role="alert" hidden>
      <span class="alert-k">Refused at the gate</span>
      <span id="alert-msg"></span>
    </div>

    <div class="field">
      <label class="label" for="ident">Email or nickname</label>
      <input id="ident" type="text" placeholder="Ruler name" autocomplete="username">
    </div>

    <div class="field pass">
      <div class="field-top">
        <label class="label" for="pass">Password</label>
        <button class="toggle" id="pass-toggle" type="button">Show</button>
      </div>
      <input id="pass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <div class="row">
      <label class="remember"><input type="checkbox" id="remember" checked> Keep me signed in</label>
      <button class="link" type="button" id="forgot">Forgot password?</button>
    </div>

    <div class="actions">
      <button class="btn btn-quiet" onclick="location.href='/'">Back</button>
      <button class="btn btn-solid" id="login" disabled>Log in</button>
    </div>

    <div class="signup-note">
      No nation yet? <button class="link" type="button" onclick="location.href='/signup/'">Found one</button>
    </div>

    <div class="tick">
      <span>Next tick</span>
      <span class="clock" id="clock">--:--:--</span>
    </div>

  </div>

  <script type="module">
    import { signIn } from '../supabase.js';

    const $ = (id) => document.getElementById(id);
    const ident = $('ident'), pass = $('pass'), login = $('login');
    const alertBox = $('alert'), alertMsg = $('alert-msg');

    // Enable Log in once both fields have content; clear any error as they type.
    function update() { login.disabled = !(ident.value.trim() && pass.value.length); }
    function onInput() { alertBox.hidden = true; update(); }
    ident.addEventListener('input', onInput);
    pass.addEventListener('input', onInput);

    // Show / hide the passphrase.
    $('pass-toggle').addEventListener('click', () => {
      const show = pass.type === 'password';
      pass.type = show ? 'text' : 'password';
      $('pass-toggle').textContent = show ? 'Hide' : 'Show';
    });

    // Enter submits from either field (submit itself is wired with auth later).
    [ident, pass].forEach((el) => el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !login.disabled) login.click();
    }));

    // Real sign-in: resolve nickname→email if needed, verify, then into founding.
    login.addEventListener('click', async () => {
      if (login.disabled) return;
      login.disabled = true; login.textContent = 'Riding for the gate…'; alertBox.hidden = true;
      const { error } = await signIn({ ident: ident.value, password: pass.value });
      if (error) {
        alertMsg.textContent = error.message || "That name and passphrase don't match.";
        alertBox.hidden = false;
        login.textContent = 'Log in'; update();
        return;
      }
      window.location.href = '/found/';
    });

    // Forgot password has no flow yet — left non-functional until built.
    $('forgot').addEventListener('click', () => {});

    // "Next tick" — real countdown to the next 8-hour boundary (00:00 / 08:00 /
    // 16:00 UTC), matching the tick schedule described on the About page.
    const clock = $('clock');
    const pad = (n) => String(n).padStart(2, '0');
    function renderClock() {
      const now = new Date();
      const secsOfDay = now.getUTCHours() * 3600 + now.getUTCMinutes() * 60 + now.getUTCSeconds();
      const left = 8 * 3600 - (secsOfDay % (8 * 3600));
      clock.textContent = pad(Math.floor(left / 3600)) + ':' + pad(Math.floor((left % 3600) / 60)) + ':' + pad(left % 60);
    }
    renderClock();
    setInterval(renderClock, 1000);
  </script>
</body>
</html>
