<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Party | Nationhood Alpha</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/party-actions.css">
<link rel="stylesheet" href="css/party-overview.css">
</head>
<body>

<!-- Top bar -->
<div id="top-bar"></div>

<!-- Subtabs: Actions | Parties | Election | Past Elections -->
<div class="pa-subtabs" id="pa-subtabs">
    <button class="pa-subtab active" data-panel="actions">Actions</button>
    <button class="pa-subtab" data-panel="parties">Parties</button>
    <button class="pa-subtab" data-panel="election">Election</button>
    <button class="pa-subtab" data-panel="past-elections">Past Elections</button>
</div>

<!-- ACTIONS panel -->
<div class="pa-panel active" id="panel-actions">
    <div id="pa-actions-root">
        <div style="display:flex;align-items:center;justify-content:center;min-height:300px;color:var(--text-dim);font-family:var(--font-mono);font-size:10px;">Loading...</div>
    </div>
</div>

<!-- PARTIES panel -->
<div class="pa-panel" id="panel-parties">
    <div id="pa-parties-root">
        <div style="display:flex;align-items:center;justify-content:center;min-height:300px;color:var(--text-dim);font-family:var(--font-mono);font-size:10px;">Loading...</div>
    </div>
</div>

<!-- ELECTION panel — coalition formation -->
<div class="pa-panel" id="panel-election">
    <div id="pa-election-root">
        <div style="display:flex;align-items:center;justify-content:center;min-height:300px;color:var(--text-dim);font-family:var(--font-mono);font-size:10px;">Loading...</div>
    </div>
</div>

<!-- PAST ELECTIONS panel (placeholder) -->
<div class="pa-panel" id="panel-past-elections">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:calc(100vh - 140px);text-align:center;color:var(--text-secondary);">
        <div style="font-family:var(--font-mono);font-size:0.9rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;">UI 2.0 IS COMING</div>
        <div style="font-size:0.85rem;color:var(--text-muted);">Please be patient while we roll this out.</div>
    </div>
</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { initPage } from './js/common.js';
import { initPartyActions } from './js/party-actions.js';
import { initPartyOverview } from './js/party-overview.js';
import { initCoalitionFormation, isFormationNeeded, renderFormationTab } from './js/coalition-formation.js';

let _state = null;
let _actionsInitialized = false;
let _partiesInitialized = false;
let _electionInitialized = false;

function switchPanel(key) {
    document.querySelectorAll('.pa-subtab').forEach(t => t.classList.toggle('active', t.dataset.panel === key));
    document.querySelectorAll('.pa-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + key));
    sessionStorage.setItem('party_subtab', key);

    if (key === 'actions' && !_actionsInitialized && _state) {
        _actionsInitialized = true;
        initPartyActions(_supabase, _state);
    }
    if (key === 'parties' && !_partiesInitialized && _state) {
        _partiesInitialized = true;
        initPartyOverview(_supabase, _state, 'pa-parties-root');
    }
    if (key === 'election' && !_electionInitialized && _state) {
        _electionInitialized = true;
        renderFormationTab(document.getElementById('pa-election-root'));
    }
}

document.getElementById('pa-subtabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.pa-subtab');
    if (!btn || btn.classList.contains('active')) return;
    switchPanel(btn.dataset.panel);
});

initPage('politics', async (state) => {
    _state = state;

    // Check for coalition formation need (runs in parallel, non-blocking)
    initCoalitionFormation(_supabase, state).then(({ needed }) => {
        if (needed) {
            // Add amber notification badge to Election tab AND Actions tab
            const electionTab = document.querySelector('.pa-subtab[data-panel="election"]');
            const actionsTab = document.querySelector('.pa-subtab[data-panel="actions"]');
            if (electionTab && !electionTab.querySelector('.pa-subtab-badge')) {
                electionTab.innerHTML += '<span class="pa-subtab-badge"></span>';
            }
            if (actionsTab && !actionsTab.querySelector('.pa-subtab-badge')) {
                actionsTab.innerHTML += '<span class="pa-subtab-badge"></span>';
            }
        }
    });

    const saved = sessionStorage.getItem('party_subtab');
    if (saved && saved !== 'actions') {
        switchPanel(saved);
    } else {
        _actionsInitialized = true;
        await initPartyActions(_supabase, state);
    }
});
</script>
</body>
</html>
