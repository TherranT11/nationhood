<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Politics | Nationhood Alpha</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<!-- Shared Styles -->
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/parties.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* ═══════════════════════════════════════
   POLITICS PAGE — DESIGN GUIDE V3 OVERRIDES
   ═══════════════════════════════════════ */
:root {
    --dbg-0: #0e0e0c;
    --dbg-1: #141412;
    --dbg-2: #1a1a17;
    --dbg-3: #1e1e1a;
    --dbg-4: #24241f;
    --dbg-5: #2c2c26;
    --dbg-hover: #282822;
    --dtxt-bright: #e2e0d6;
    --dtxt-primary: #c4c2b8;
    --dtxt-secondary: #8a8778;
    --dtxt-muted: #6b6a5e;
    --dtxt-dim: #4a4940;
    --dtxt-ghost: #333229;
    --dborder-hair: rgba(255,255,255,0.04);
    --dborder-0: rgba(255,255,255,0.06);
    --dborder-1: rgba(255,255,255,0.08);
    --dborder-2: rgba(255,255,255,0.12);
    --dgreen: #5cb85c;
    --dgreen-faint: rgba(92,184,92,0.08);
    --dgreen-border: rgba(92,184,92,0.18);
    --dred: #d9534f;
    --dred-faint: rgba(217,83,79,0.08);
    --dred-border: rgba(217,83,79,0.18);
    --damber: #c8a64e;
    --damber-faint: rgba(200,166,78,0.08);
    --damber-border: rgba(200,166,78,0.18);
    --dblue: #5b9bd5;
    --dblue-faint: rgba(91,155,213,0.08);
    --dblue-border: rgba(91,155,213,0.18);
    --dtext-0: #e2e0d6;
    --dtext-1: #c4c2b8;
    --dtext-2: #8a8778;
    --dtext-3: #6b6a5e;
    --dfont-mono: 'JetBrains Mono', monospace;
    --dfont-ui: 'IBM Plex Sans', -apple-system, sans-serif;
    --dfont-serif: 'IBM Plex Serif', Georgia, serif;
}

/* ── Page layout ── */
.pol-page {
    padding: 24px 28px 60px;
}

/* ── Party card box ── */
.pol-party-card {
    width: 380px;
    min-width: 300px;
    flex: 0 1 380px;
    background: var(--dbg-2);
    border: 1px solid var(--dborder-0);
    border-radius: 6px;
    padding: 22px 24px 24px;
    overflow-y: auto;
}

/* ── Section label ── */
.pol-section-label {
    font-family: var(--dfont-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dtxt-muted);
    margin-bottom: 18px;
}

/* ── Party header row ── */
.pol-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
}
.pol-logo {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 2px solid var(--dborder-2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: var(--dbg-3);
}
.pol-logo svg {
    display: block;
}
.pol-header-info {
    min-width: 0;
}
.pol-party-name {
    font-family: var(--dfont-ui);
    font-size: 20px;
    font-weight: 700;
    color: var(--dtxt-bright);
    line-height: 1.2;
    margin-bottom: 6px;
}

/* ── Role badge + established ── */
.pol-meta-row {
    display: flex;
    align-items: center;
    gap: 10px;
}
.pol-role-badge {
    font-family: var(--dfont-mono);
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 3px;
}
.pol-role-gov {
    background: var(--dgreen-faint);
    border: 1px solid var(--dgreen-border);
    color: var(--dgreen);
}
.pol-role-opp {
    background: var(--dred-faint);
    border: 1px solid var(--dred-border);
    color: var(--dred);
}
.pol-role-lead {
    background: var(--dgreen-faint);
    border: 1px solid var(--dgreen-border);
    color: var(--dgreen);
}
.pol-role-strongman {
    background: var(--damber-faint);
    border: 1px solid var(--damber-border);
    color: var(--damber);
}
.pol-established {
    font-family: var(--dfont-mono);
    font-size: 10.5px;
    color: var(--dtxt-muted);
}

/* ── Ideology tags row ── */
.pol-ideo-row {
    display: flex;
    gap: 10px;
    margin: 18px 0;
}
.pol-ideo-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--dbg-3);
    border: 1px solid var(--dborder-1);
    border-radius: 4px;
    padding: 6px 12px;
}
.pol-ideo-label {
    font-family: var(--dfont-mono);
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dtxt-muted);
}
.pol-ideo-value {
    font-family: var(--dfont-ui);
    font-size: 13px;
    font-weight: 600;
}

/* Ideology colors */
.pol-ideo-liberty       { color: #9C27B0; }
.pol-ideo-equality      { color: #E91E63; }
.pol-ideo-freedom       { color: #2196F3; }
.pol-ideo-security      { color: #FF9800; }
.pol-ideo-individualism { color: #eab308; }
.pol-ideo-collectivism  { color: #ec4899; }
.pol-ideo-tradition     { color: #795548; }
.pol-ideo-progress      { color: #00BCD4; }
.pol-ideo-nationalism   { color: #FF5722; }
.pol-ideo-globalism     { color: #3F51B5; }

/* ── Divider ── */
.pol-divider {
    border: none;
    border-top: 1px solid var(--dborder-0);
    margin: 18px 0;
}

/* ── Leader section ── */
.pol-leader-section {
    margin-bottom: 20px;
}
.pol-leader-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
}
.pol-sub-label {
    font-family: var(--dfont-mono);
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--dtxt-muted);
}
.pol-leader-name {
    font-family: var(--dfont-ui);
    font-size: 17px;
    font-weight: 600;
    color: var(--dtxt-bright);
    margin-bottom: 2px;
}
.pol-leader-age {
    font-family: var(--dfont-mono);
    font-size: 13px;
    font-weight: 400;
    color: var(--dtxt-secondary);
}
.pol-leader-ideo {
    font-family: var(--dfont-ui);
    font-size: 12px;
    font-weight: 500;
}

/* ── Party Leadership button ── */
.pol-leadership-btn {
    font-family: var(--dfont-mono);
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dtxt-secondary);
    background: var(--dbg-3);
    border: 1px solid var(--dborder-1);
    border-radius: 4px;
    padding: 7px 14px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
}
.pol-leadership-btn:hover {
    color: var(--dtxt-bright);
    border-color: var(--dborder-2);
    background: var(--dbg-4);
}

/* ── Deputy / Whip row ── */
.pol-officers-row {
    display: flex;
    gap: 40px;
    margin-bottom: 20px;
}
.pol-officer {
    min-width: 0;
}
.pol-officer-label {
    font-family: var(--dfont-mono);
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--dtxt-muted);
    margin-bottom: 4px;
}
.pol-officer-name {
    font-family: var(--dfont-ui);
    font-size: 14px;
    font-weight: 500;
    color: var(--dtxt-primary);
}

/* ── Stats row (seats + vote share) ── */
.pol-stats-row {
    display: flex;
    gap: 40px;
}
.pol-stat-block {}
.pol-stat-label {
    font-family: var(--dfont-mono);
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--dtxt-muted);
    margin-bottom: 6px;
}
.pol-stat-value {
    font-family: var(--dfont-mono);
    font-size: 26px;
    font-weight: 700;
    color: var(--dtxt-bright);
    line-height: 1;
}
.pol-stat-total {
    font-size: 16px;
    font-weight: 400;
    color: var(--dtxt-muted);
}
.pol-stat-delta {
    font-family: var(--dfont-mono);
    font-size: 11px;
    font-weight: 600;
    margin-left: 6px;
}
.pol-stat-delta.up { color: var(--dgreen); }
.pol-stat-delta.down { color: var(--dred); }
.pol-stat-delta.flat { color: var(--dtxt-muted); }
.pol-stat-note {
    font-family: var(--dfont-mono);
    font-size: 10px;
    color: var(--dtxt-dim);
    margin-top: 4px;
}

/* ── Loading ── */
.pol-loading {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 200px;
    color: var(--dtxt-muted);
    font-family: var(--dfont-mono);
    font-size: 12px;
}

/* ── Top row layout ── */
.pol-columns {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    justify-content: center;
    flex-wrap: wrap;
}

/* ── Second row ── */
.pol-row-2 {
    display: flex;
    gap: 16px;
    margin-top: 16px;
    justify-content: center;
    align-items: flex-start;
    flex-wrap: wrap;
}

/* ── Modifiers box ── */
.pol-modifiers-box {
    width: 380px;
    flex-shrink: 0;
    background: var(--dbg-2);
    border: 1px solid var(--dborder-0);
    border-radius: 6px;
    padding: 22px 24px 24px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
}
.pol-mod-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
}
.pol-mod-title {
    font-family: var(--dfont-mono);
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--dtxt-muted);
}
.pol-mod-count {
    font-family: var(--dfont-mono);
    font-size: 10px;
    font-weight: 600;
    color: var(--dtxt-dim);
}
.pol-mod-card {
    background: var(--dbg-3);
    border: 1px solid var(--dborder-1);
    border-left: 3px solid #4ade80;
    border-radius: 4px;
    padding: 14px 16px;
}
.pol-mod-card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
}
.pol-mod-icon {
    font-size: 14px;
    color: #4ade80;
    flex-shrink: 0;
}
.pol-mod-label {
    font-family: var(--dfont-ui);
    font-size: 13px;
    font-weight: 600;
    color: var(--dtxt-bright);
    line-height: 1.3;
}
.pol-mod-effect {
    font-family: var(--dfont-ui);
    font-size: 12px;
    font-weight: 400;
    color: var(--dtxt-secondary);
    margin-bottom: 10px;
    padding-left: 22px;
}
.pol-mod-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-left: 22px;
}
.pol-mod-expires {
    font-family: var(--dfont-mono);
    font-size: 9.5px;
    font-weight: 600;
    color: var(--dtxt-dim);
    background: var(--dbg-4);
    border-radius: 3px;
    padding: 2px 8px;
}
.pol-mod-source {
    font-family: var(--dfont-mono);
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dtxt-dim);
}
.pol-mod-empty {
    font-family: var(--dfont-ui);
    font-size: 13px;
    color: var(--dtxt-dim);
    flex: 1;
    display: flex;
    align-items: center;
}

/* ── Parliament box ── */
.pol-parliament-box {
    width: 380px;
    min-width: 300px;
    flex: 0 1 380px;
    background: var(--dbg-2);
    border: 1px solid var(--dborder-0);
    border-radius: 4px;
    padding: 22px 24px 24px;
    overflow-y: auto;
}
.pol-parl-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
}
.pol-parl-title {
    font-family: var(--dfont-mono);
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--dtxt-muted);
}
.pol-parl-seats-count {
    font-family: var(--dfont-mono);
    font-size: 10px;
    font-weight: 600;
    color: var(--dtxt-dim);
}
.pol-seat-bar-wrap {
    position: relative;
    margin-bottom: 18px;
}
.pol-seat-bar {
    display: flex;
    gap: 2px;
    height: 14px;
    border-radius: 3px;
    overflow: hidden;
}
.pol-seat-segment {
    height: 100%;
    border-radius: 2px;
    min-width: 2px;
}
.pol-majority-line {
    position: absolute;
    top: -3px;
    bottom: -3px;
    width: 0;
    border-left: 2px dashed var(--dtxt-dim);
    pointer-events: none;
}
.pol-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    margin-top: 14px;
}
.pol-section-header:first-of-type {
    margin-top: 0;
}
.pol-section-title {
    font-family: var(--dfont-mono);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dtxt-dim);
}
.pol-section-seats {
    font-family: var(--dfont-mono);
    font-size: 10px;
    font-weight: 600;
    color: var(--dtxt-dim);
}
.pol-parl-party-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid var(--dborder-hair);
}
.pol-parl-party-row:last-child {
    border-bottom: none;
}
.pol-mini-logo {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--dfont-mono);
    font-size: 7px;
    font-weight: 800;
    color: #fff;
    flex-shrink: 0;
    text-transform: uppercase;
}
.pol-parl-party-name {
    font-family: var(--dfont-ui);
    font-size: 12.5px;
    font-weight: 500;
    color: var(--dtxt-primary);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.pol-parl-party-seats {
    font-family: var(--dfont-mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--dtxt-secondary);
}
.pol-you-pill {
    font-family: var(--dfont-mono);
    font-size: 8px;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: var(--dblue);
    background: var(--dblue-faint);
    border: 1px solid var(--dblue-border);
    border-radius: 3px;
    padding: 1px 5px;
}
.pol-hog-pill {
    font-family: var(--dfont-mono);
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--damber);
    background: var(--damber-faint);
    border: 1px solid var(--damber-border);
    border-radius: 3px;
    padding: 1px 5px;
}
.pol-margin-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 16px;
    padding: 8px 0;
    border-top: 1px solid var(--dborder-0);
    font-family: var(--dfont-mono);
    font-size: 11px;
    font-weight: 600;
}
.pol-margin-positive {
    color: var(--dgreen);
}
.pol-margin-negative {
    color: var(--dred);
}
.pol-margin-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
}
.pol-margin-positive .pol-margin-dot {
    background: var(--dgreen);
}
.pol-margin-negative .pol-margin-dot {
    background: var(--dred);
}

/* ── Ideology box ── */
.pol-ideology-box {
    width: 380px;
    min-width: 300px;
    flex: 0 1 380px;
    background: var(--dbg-2);
    border: 1px solid var(--dborder-0);
    border-radius: 4px;
    padding: 16px 20px;
    overflow-y: auto;
}
.pol-ideo-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}
.pol-ideo-legend {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
}
.pol-ideo-legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 3px 8px;
    border-radius: 3px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--dborder-0);
    cursor: default;
}
.pol-ideo-legend-item:hover {
    border-color: rgba(255,255,255,0.12);
}
.pol-ideo-legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 2px;
}
.pol-ideo-legend-abbr {
    font-family: var(--dfont-mono);
    font-size: 9px;
    font-weight: 700;
}
.pol-ideo-legend-you {
    font-family: var(--dfont-mono);
    font-size: 7px;
    color: var(--dtxt-muted);
}
.pol-ideo-zone-legend {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 14px;
}
.pol-ideo-zone-item {
    display: flex;
    align-items: center;
    gap: 5px;
}
.pol-ideo-zone-line {
    width: 12px;
    height: 1px;
}
.pol-ideo-zone-label {
    font-family: var(--dfont-mono);
    font-size: 8px;
    color: var(--dtxt-muted);
}
.pol-ideo-axes {
    display: flex;
    flex-direction: column;
    gap: 14px;
}
.pol-ideo-axis-labels {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
}
.pol-ideo-axis-label {
    font-family: var(--dfont-mono);
    font-size: 9px;
    font-weight: 600;
    color: var(--dtxt-secondary);
}
.pol-ideo-track {
    position: relative;
    height: 24px;
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid var(--dborder-0);
    background: rgba(255,255,255,0.02);
}
.pol-ideo-zone-line-v {
    position: absolute;
    top: 0;
    width: 1px;
    height: 100%;
}
.pol-ideo-center-line {
    position: absolute;
    left: 50%;
    top: 0;
    width: 1px;
    height: 100%;
    background: rgba(107,106,94,0.27);
}
.pol-ideo-marker {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 2px;
}
.pol-ideo-summaries {
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px solid var(--dborder-0);
    display: flex;
    flex-direction: column;
    gap: 5px;
}
.pol-ideo-summary-row {
    font-family: var(--dfont-mono);
    font-size: 9.5px;
    color: var(--dtxt-secondary);
    line-height: 1.4;
}
.pol-ideo-summary-abbr {
    font-weight: 700;
    margin-right: 4px;
}
.pol-ideo-summary-stances {
    font-weight: 400;
}


/* ── Election Forecast box ── */
.pol-forecast-box {
    width: 380px;
    min-width: 280px;
    flex: 0 1 380px;
    background: var(--dbg-2);
    border: 1px solid var(--dborder-0);
    border-radius: 4px;
    padding: 16px 20px;
    overflow-y: auto;
}
.pol-fc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
}
.pol-fc-phase {
    font-family: var(--dfont-mono);
    font-size: 8px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 2px;
}
.pol-fc-empty {
    padding: 16px 0;
    text-align: center;
}
.pol-fc-empty-title {
    font-family: var(--dfont-mono);
    font-size: 11px;
    color: var(--dtxt-muted);
    margin-bottom: 8px;
}
.pol-fc-empty-detail {
    font-family: var(--dfont-mono);
    font-size: 9px;
    color: var(--dtxt-muted);
    line-height: 1.6;
}
.pol-fc-countdown {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

}
.pol-id-cooldown-ticks {

.pol-id-error {

}

}
.pol-id-icon-cat {
    font-family: var(--dfont-mono);

}

    border-radius: 3px;
}
.pol-id-upload-text {

    color: var(--dtext-3);

}
.pol-id-upload-hint {
    font-family: var(--dfont-mono);
    font-size: 8px;

}
.pol-id-remove-btn {

}

    font-family: var(--dfont-mono);
    font-size: 9px;
    color: var(--dtext-3);
}
.pol-id-save-btn {
    font-family: var(--dfont-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 7px 20px;
    border-radius: 3px;

    background: var(--damber-faint);
    border: 1px solid var(--damber);

}
.pol-id-save-btn.saved {

.pol-row-3 {
    display: flex;
    gap: 16px;
    margin-top: 16px;

    align-items: flex-start;
    flex-wrap: wrap;
}

.pol-election-box {
    flex: 1 1 380px;
    min-width: 300px;
    background: var(--dbg-2);
    border: 1px solid var(--dborder-0);
    border-radius: 6px;
    padding: 22px 24px 24px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
}
.pol-el-tabs {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--dborder-0);
    margin-bottom: 12px;
}
.pol-el-tab {
    font-family: var(--dfont-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dtext-3);

    border: none;

.pol-el-bar-fill {

.pol-el-winner-badge {

<body>

<!-- ===== TOP BAR ===== -->
<div id="top-bar"></div>

<!-- ===== CONTENT AREA ===== -->
<div id="content-area">
    <div class="pol-loading">Loading...</div>
</div>

<!-- Page Script -->
<script type="module">
import { _supabase } from './js/supabase-client.js';
import { initPage, formatCurrency } from './js/common.js';
import { getPartyIconSVG, getPartyLogoHTML, PARTY_ICONS, PARTY_COLOR_PALETTE, colorDistance } from './js/party-icons.js';
import { tickToDate, escapeHtml as utilEscapeHtml, getIdeologyClass } from './js/utils.js';
import { fetchActiveCoalition, loadSeats, isGovernmentAutocracy, isPresidentialRepublic, initGameConfigForNation, GAME_CONFIG, RALLY_CONFIG, RALLY_OUTCOMES, getRallyOutcomeWeights, getRallyRiskLevel, executeRally, OUTREACH_CONFIG, computeOutreachAlignment, calcOutreachEffect, calcOutreachFriction, executeOutreach, ATTACK_CONFIG, ATTACK_VECTORS, ATTACK_OUTCOMES, getAttackOutcomeWeights, gatherAttackEvidence, buildAttackVectors, computeAttackCredibility, executeAttack, MAKE_PROMISE_CONFIG, executeMakePromise, getPromiseableStats, MOBILIZE_CONFIG, executeMobilize, SUCCESSOR_CONFIG, executeAppointSuccessor, executeRevokeSuccessor, executeDynastyAction, executePledgeAllegiance, executeConsolidatePower, executeDemonstrateCompetence, executeEmbezzleFunds, getEmbezzleRiskLabel, executeBuyInfluence, executeIntimidate, executeIntimidationResponse, executePurge, executeRedistributeSeats, canAttemptCoup, getCoupEstimate, executeCoupAttempt, sendCoupInvitation, respondToCoupInvitation, getRegimeHealthTier, deductAP, disbandParty, PILLAR_TO_STEWARD_TYPE, STEWARD_TYPE_LABELS, STEWARD_TYPE_DESCRIPTIONS, ensureBlocApprovals, IDEOLOGY_OPPOSITES, IDEOLOGY_TO_AXIS, PM_FIRST_NAMES, PM_LAST_NAMES, loadNationIdeologies, getFullIdeologyProfile, getIdeologyLabel, IDEOLOGY_AXES } from './js/game-common.js';
import { isAutocracy } from './js/game/government-types.js';
import { ISSUE_CATEGORY_STATS, statDirectionSign } from './js/game/stats.js';

initPage('politics', async (state) => {
    const { nation, faction, shard } = state;

    if (!nation || !faction) {
        document.getElementById('content-area').innerHTML =
            '<div class="pol-loading">No nation or party data available.</div>';
        return;
    }

    // Initialize game config for this nation (needed for autocracy action costs)
    await initGameConfigForNation(_supabase, nation.id);

    // Fetch full faction data (state.faction has SELECT * so should be complete)
    const f = faction;
    const currentTick = shard?.current_tick || 0;

    // Fetch total seats from all parties
    const { data: allParties } = await _supabase
        .from('factions')
        .select('id, seats, national_vote_share, faction_name, abbreviation, party_color')
        .eq('nation_id', nation.id)
        .eq('faction_type', 'party');

    // Fetch ideology scores for all parties
    const partyIds = (allParties || []).map(p => p.id);
    const { data: allPartyIdeologies } = partyIds.length > 0
        ? await _supabase
            .from('faction_ideology')
            .select('faction_id, liberty_equality, tradition_progress, security_freedom, globalism_nationalism, individualism_collectivism')
            .in('faction_id', partyIds)
        : { data: [] };

    // Normalise seat counts from election results (single source of truth)
    const { currentSeats } = await loadSeats(_supabase, nation.id, isAutocracy(nation), allParties || [], f.id);

    const totalSeats = (allParties || []).reduce((sum, p) => sum + (p.seats || 0), 0);
    const mySeats = currentSeats;

    // Compute vote share
    const myVoteShare = Number(f.national_vote_share || 0);
    const voteSharePct = myVoteShare.toFixed(1);

    // Get last completed election for vote share date + delta
    const { data: lastElection } = await _supabase
        .from('elections')
        .select('election_tick, results')
        .eq('nation_id', nation.id)
        .eq('status', 'completed')
        .order('election_tick', { ascending: false })
        .limit(1)
        .maybeSingle();

    let lastElectionDate = null;
    let seatDelta = null;
    if (lastElection) {
        lastElectionDate = tickToDate(lastElection.election_tick);

        // Try to compute seat delta from election results
        const results = lastElection.results;
        if (Array.isArray(results)) {
            const myResult = results.find(r => r.party_id === f.id);
            if (myResult && typeof myResult.seats_won === 'number') {
                // Previous seats = seats before that election
                const prevSeats = typeof myResult.seats_before === 'number' ? myResult.seats_before : null;
                if (prevSeats !== null) {
                    seatDelta = mySeats - prevSeats;
                }
            }
        }
    }

    // Fetch coalition to determine governing/opposition
    const coalition = await fetchActiveCoalition(_supabase, nation.id);
    const isAutoNation = isAutocracy(nation);
    let role = 'Opposition';
    if (isAutoNation && nation.ruling_faction_id === f.id) {
        role = 'Strongman';
    } else if (coalition && coalition.party_ids && coalition.party_ids.includes(f.id)) {
        role = coalition.lead_party_id === f.id ? 'Lead — Governing' : 'Governing Coalition';
    }

    // Fetch active crises
    const { data: activeCrises } = await _supabase
        .from('active_crises')
        .select('id, started_at_tick, crisis_templates(name, description)')
        .eq('nation_id', nation.id);

    // Fetch next scheduled election
    const { data: nextElection } = await _supabase
        .from('elections')
        .select('election_tick')
        .eq('nation_id', nation.id)
        .eq('status', 'scheduled')
        .order('election_tick', { ascending: true })
        .limit(1)
        .maybeSingle();

    // Fetch per-party momentum (average across blocs)
    const { data: blocApprovals } = partyIds.length > 0
        ? await _supabase
            .from('faction_bloc_approval')
            .select('faction_id, momentum')
            .in('faction_id', partyIds)
        : { data: [] };

    // Generate deterministic deputy leader and party whip names from faction id
    const officerNames = generateOfficerNames(f.id);

    // Fetch previous tick's gov_approval for delta display
    const { data: prevSnap } = await _supabase
        .from('nations_history')
        .select('gov_approval')
        .eq('nation_id', nation.id)
        .eq('tick', currentTick - 1)
        .single();
    const prevApproval = prevSnap?.gov_approval ?? null;

    // Fetch active president (presidential systems)
    const { data: president } = await _supabase
        .from('presidents')
        .select('id, faction_id, first_name, last_name, age, ideology, trait, trait_upside, trait_downside, elected_tick, term_ends_tick, is_active, terms_served')
        .eq('nation_id', nation.id)
        .eq('is_active', true)
        .order('elected_tick', { ascending: false })
        .limit(1)
        .maybeSingle();

    // Fetch current administration
    const { data: administration } = await _supabase
        .from('administrations')
        .select('id, admin_name, government_type, started_at_tick, president_name, president_party_id, president_party_name')
        .eq('nation_id', nation.id)
        .is('ended_at_tick', null)
        .order('started_at_tick', { ascending: false })
        .limit(1)
        .maybeSingle();

    // Fetch last completed parliamentary election
    const { data: lastParliamentary } = await _supabase
        .from('elections')
        .select('election_tick, results, election_type')
        .eq('nation_id', nation.id)
        .eq('status', 'completed')
        .eq('election_type', 'parliamentary')
        .order('election_tick', { ascending: false })
        .limit(1)
        .maybeSingle();

    // Fetch last completed presidential election
    const { data: lastPresidential } = await _supabase
        .from('elections')
        .select('election_tick, results, election_type')
        .eq('nation_id', nation.id)
        .eq('status', 'completed')
        .eq('election_type', 'presidential')
        .order('election_tick', { ascending: false })
        .limit(1)
        .maybeSingle();

    // Fetch all scheduled elections (for upcoming panel)
    const { data: scheduledElections } = await _supabase
        .from('elections')
        .select('election_tick, election_type')
        .eq('nation_id', nation.id)
        .eq('status', 'scheduled')
        .order('election_tick', { ascending: true });

    // Fetch voter blocs for coalition overview
    const { data: voterBlocs } = await _supabase
        .from('voter_blocs')
        .select('id, bloc_name, population_weight, is_active, axis_liberty_equality, axis_tradition_progress, axis_security_freedom, axis_globalism_nationalism, axis_individualism_collectivism, priority_issues, ideology_1, ideology_2, ideology_3, ideology_4, ideology_5')
        .eq('nation_id', nation.id)
        .eq('is_active', true);

    // Fetch player's faction_bloc_approval rows (preference_score per bloc)
    const { data: playerBlocApprovals } = await _supabase
        .from('faction_bloc_approval')
        .select('bloc_id, preference_score')
        .eq('faction_id', f.id);

    renderPartyTab(f, nation, {
        totalSeats,
        mySeats,
        voteSharePct,
        lastElectionDate,
        seatDelta,
        role,
        isAutoNation,
        coalition,
        currentTick,
        officerNames,
        allParties,
        allPartyIdeologies,
        activeCrises,
        nextElection,
        blocApprovals,
        prevApproval,
        lastParliamentary,
        lastPresidential,
        scheduledElections,
        president,
        administration,
        voterBlocs,
        playerBlocApprovals
    });
});

/**
 * Generate deterministic officer names from faction UUID.
 * Uses the UUID bytes to seed a simple selection from name pools.
 */
function generateOfficerNames(factionId) {
    const FIRST_NAMES = [
        'Katarina', 'Viktor', 'Elena', 'Andrei', 'Mira', 'Stefan', 'Nadia', 'Lukas',
        'Irina', 'Gregor', 'Sonja', 'Dmitri', 'Anya', 'Marko', 'Petra', 'Nikolai',
        'Lena', 'Branko', 'Olga', 'Jovan', 'Rada', 'Pavel', 'Vesna', 'Boris',
        'Milena', 'Dragan', 'Zora', 'Aleksei', 'Daria', 'Milos'
    ];
    const LAST_NAMES = [
        'Dreki', 'Reznik', 'Volkov', 'Kovar', 'Brandt', 'Jovic', 'Petrov', 'Lazar',
        'Novak', 'Kadric', 'Zelenko', 'Varga', 'Ivic', 'Balasz', 'Horta', 'Demic',
        'Maric', 'Gruber', 'Tesic', 'Orlov', 'Szabo', 'Pavic', 'Radic', 'Leko',
        'Tomic', 'Kosta', 'Bauer', 'Haris', 'Petrovic', 'Lukic'
    ];

    // Parse hex characters from UUID to get seed values
    const hex = factionId.replace(/-/g, '');
    const seedA = parseInt(hex.substring(0, 4), 16);
    const seedB = parseInt(hex.substring(4, 8), 16);
    const seedC = parseInt(hex.substring(8, 12), 16);
    const seedD = parseInt(hex.substring(12, 16), 16);

    return {
        deputyFirst: FIRST_NAMES[seedA % FIRST_NAMES.length],
        deputyLast: LAST_NAMES[seedB % LAST_NAMES.length],
        whipFirst: FIRST_NAMES[seedC % FIRST_NAMES.length],
        whipLast: LAST_NAMES[seedD % LAST_NAMES.length]
    };
}

function hogTitle(govType) {
    if (!govType) return 'Head of Gov.';
    const g = govType.toLowerCase();
    if (g === 'democracy' || g.includes('parliament')) return 'PM';
    if (g.includes('president')) return 'President';
    if (g === 'autocracy' || g.includes('dictator') || g.includes('authorit')) return 'Strongman';
    return 'Head of Gov.';
}

function renderParliamentBox(allParties, coalition, nation, playerFactionId) {
    const parties = allParties || [];
    const totalSeats = parties.reduce((sum, p) => sum + (p.seats || 0), 0);
    const majority = Math.ceil(totalSeats / 2);
    const isAuto = isAutocracy(nation);

    // For autocracies without a coalition, use ruling_faction_id to split governing/opposition
    let coalitionIds, leadPartyId;
    if (isAuto && !coalition && nation.ruling_faction_id) {
        coalitionIds = new Set([nation.ruling_faction_id]);
        leadPartyId = nation.ruling_faction_id;
    } else {
        coalitionIds = new Set(coalition?.party_ids || []);
        leadPartyId = coalition?.lead_party_id || null;
    }

    // Split into governing and opposition
    const governing = parties.filter(p => coalitionIds.has(p.id));
    const opposition = parties.filter(p => !coalitionIds.has(p.id));
    const govSeats = governing.reduce((sum, p) => sum + (p.seats || 0), 0);
    const oppSeats = opposition.reduce((sum, p) => sum + (p.seats || 0), 0);

    // Seat composition bar — sorted by seats desc
    const barParties = [...parties].sort((a, b) => (b.seats || 0) - (a.seats || 0));
    const segmentsHtml = totalSeats > 0
        ? barParties.map(p => {
            const pct = ((p.seats || 0) / totalSeats) * 100;
            if (pct <= 0) return '';
            const c = p.party_color || '#8a8778';
            return `<div class="pol-seat-segment" style="width:${pct.toFixed(2)}%;background:${c}"></div>`;
        }).join('')
        : '';

    // Majority line position
    const majPct = totalSeats > 0 ? (majority / totalSeats) * 100 : 50;
    const majorityLineHtml = `<div class="pol-majority-line" style="left:${majPct.toFixed(2)}%"></div>`;

    // Government title
    const title = hogTitle(nation?.government_type);

    // Party row renderer
    function partyRow(p) {
        const logo = miniLogo(p.party_color, p.abbreviation, p.faction_name);
        const name = escapeHtml(p.faction_name || 'Unknown');
        const seats = p.seats || 0;
        const isPlayer = p.id === playerFactionId;
        const isHoG = p.id === leadPartyId;
        const pills = [
            isHoG ? `<span class="pol-hog-pill">${escapeHtml(title)}</span>` : '',
            isPlayer ? '<span class="pol-you-pill">YOU</span>' : ''
        ].filter(Boolean).join(' ');
        return `<div class="pol-parl-party-row">
            ${logo}
            <span class="pol-parl-party-name">${name}</span>
            ${pills}
            <span class="pol-parl-party-seats">${seats}</span>
        </div>`;
    }

    const govRowsHtml = governing.length > 0
        ? governing.sort((a, b) => (b.seats || 0) - (a.seats || 0)).map(partyRow).join('')
        : '';
    const oppRowsHtml = opposition.length > 0
        ? opposition.sort((a, b) => (b.seats || 0) - (a.seats || 0)).map(partyRow).join('')
        : '';

    // Margin
    const margin = govSeats - majority;
    const marginPositive = margin >= 0;
    const marginCls = marginPositive ? 'pol-margin-positive' : 'pol-margin-negative';
    const marginText = marginPositive
        ? `+${margin} above majority`
        : `${Math.abs(margin)} below majority`;

    return `
        <div class="pol-parliament-box">
            <div class="pol-parl-header">
                <span class="pol-parl-title">Parliament</span>
                <span class="pol-parl-seats-count">${totalSeats} seats</span>
            </div>

            <div class="pol-seat-bar-wrap">
                <div class="pol-seat-bar">${segmentsHtml}</div>
                ${majorityLineHtml}
            </div>

            <div class="pol-section-header">
                <span class="pol-section-title">${isAuto ? 'Ruling Party' : 'Governing Coalition'}</span>
                <span class="pol-section-seats">${govSeats} seats</span>
            </div>
            ${govRowsHtml}

            <div class="pol-section-header">
                <span class="pol-section-title">Opposition</span>
                <span class="pol-section-seats">${oppSeats} seats</span>
            </div>
            ${oppRowsHtml}

            <div class="pol-margin-row ${marginCls}">
                <span class="pol-margin-dot"></span>
                <span>${marginText}</span>
            </div>
        </div>`;
}

function computeIssueImportance(nation, statKeys) {
    let total = 0, count = 0;
    for (const key of statKeys) {
        const val = Number(nation[key] ?? 50);
        const dir = statDirectionSign(key);
        if (dir === 0) continue;
        // Higher-is-better: badness = 100 - val. Lower-is-better: badness = val.
        const badness = dir === 1 ? (100 - val) : val;
        total += Math.max(0, Math.min(100, badness));
        count++;
    }
    return count > 0 ? Math.round(total / count) : 0;
}

function importanceColor(pct) {
    if (pct >= 60) return 'var(--dred)';
    if (pct >= 40) return 'var(--damber)';

}

function renderIdeologyBox(allParties, allPartyIdeologies, playerFactionId) {

        id: p.id,

        abbr: p.abbreviation || (p.faction_name || '??').substring(0, 2).toUpperCase(),
        color: p.party_color || '#8a8778',

    }));

    // Party legend
    const legendHtml = partyData.map(p =>
        `<div class="pol-ideo-legend-item">
            <div class="pol-ideo-legend-dot" style="background:${p.color}"></div>
            <span class="pol-ideo-legend-abbr" style="color:${p.color}">${escapeHtml(p.abbr)}</span>
            ${p.isPlayer ? '<span class="pol-ideo-legend-you">YOU</span>' : ''}
        </div>`
    ).join('');

    // Zone legend
    const zoneLegendHtml = `
        <div class="pol-ideo-zone-legend">
            <div class="pol-ideo-zone-item">
                <div class="pol-ideo-zone-line" style="background:rgba(250,204,21,0.33)"></div>
                <span class="pol-ideo-zone-label">Centrist / Moderate</span>
            </div>
            <div class="pol-ideo-zone-item">
                <div class="pol-ideo-zone-line" style="background:rgba(239,68,68,0.33)"></div>
                <span class="pol-ideo-zone-label">Moderate / Radical</span>
            </div>
        </div>`;

    // Axis tracks
    const axesHtml = IDEOLOGY_AXES.map(ax => {
        // Party markers on this axis
        const markersHtml = partyData.map(p => {
            const rawVal = Number(p.ideo[ax.key] ?? 0); // -100 to +100
            const pos = (rawVal + 100) / 2; // normalize to 0–100
            return `<div class="pol-ideo-marker" style="left:${pos}%;width:10px;height:10px;background:${p.color}"></div>`;
        }).join('');

        return `<div>
            <div class="pol-ideo-axis-labels">
                <span class="pol-ideo-axis-label">${escapeHtml(ax.leftLabel)}</span>
                <span class="pol-ideo-axis-label">${escapeHtml(ax.rightLabel)}</span>
            </div>
            <div class="pol-ideo-track">
                <div class="pol-ideo-zone-line-v" style="left:15%;background:rgba(239,68,68,0.2)"></div>
                <div class="pol-ideo-zone-line-v" style="left:85%;background:rgba(239,68,68,0.2)"></div>
                <div class="pol-ideo-zone-line-v" style="left:35%;background:rgba(250,204,21,0.2)"></div>
                <div class="pol-ideo-zone-line-v" style="left:65%;background:rgba(250,204,21,0.2)"></div>
                <div class="pol-ideo-center-line"></div>
                ${markersHtml}
            </div>
        </div>`;
    }).join('');

    // Party stance summaries
    const summariesHtml = partyData.map(p => {
        const stances = [];
        for (const ax of IDEOLOGY_AXES) {
            const raw = Number(p.ideo[ax.key] ?? 0);
            const pos = (raw + 100) / 2; // 0-100
            if (pos >= 35 && pos <= 65) continue; // centrist — skip
            const side = pos < 50 ? ax.leftLabel : ax.rightLabel;
            const zone = (pos <= 15 || pos >= 85) ? 'Radical' : 'Moderate';
            const zoneColor = zone === 'Radical' ? 'var(--dred)' : 'var(--damber)';
            stances.push(`<span style="color:${zoneColor}">${zone}</span> ${escapeHtml(side)}`);
        }
        if (stances.length === 0) return '';
        return `<div class="pol-ideo-summary-row">
            <span class="pol-ideo-summary-abbr" style="color:${p.color}">${escapeHtml(p.abbr)}:</span>
            <span class="pol-ideo-summary-stances">${stances.join(', ')}</span>
        </div>`;
    }).filter(Boolean).join('');

    return `
        <div class="pol-ideology-box">
            <div class="pol-ideo-header">
                <span class="pol-mod-title">Ideology — All Parties</span>
            </div>
            <div class="pol-ideo-legend">${legendHtml}</div>
            ${zoneLegendHtml}
            <div class="pol-ideo-axes">${axesHtml}</div>
            ${summariesHtml ? `<div class="pol-ideo-summaries">${summariesHtml}</div>` : ''}
        </div>`;
}

function renderForecastBox(allParties, totalSeats, currentTick, nextElection, blocApprovals, playerFactionId) {
    const FORECAST_START = 12;
    const MARGIN_START = 12;
    const electionTick = nextElection?.election_tick || 0;
    const ticksLeft = electionTick > currentTick ? electionTick - currentTick : 0;
    const forecastVisible = electionTick > 0 && ticksLeft <= FORECAST_START;
    const majority = Math.ceil(totalSeats / 2);

    // Phase label
    const phase = ticksLeft <= 5 ? 'CAMPAIGN SEASON' : ticksLeft <= 10 ? 'MID CYCLE' : 'EARLY CYCLE';
    const phaseColor = ticksLeft <= 5 ? 'var(--dred)' : ticksLeft <= 10 ? 'var(--damber)' : 'var(--dgreen)';

    if (!forecastVisible) {
        const ticksUntilForecast = electionTick > 0 ? ticksLeft - FORECAST_START : 0;
        const detail = electionTick > 0
            ? `Forecast available in <span style="color:var(--dtxt-secondary);font-weight:700">${ticksUntilForecast} ticks</span><br>Polling begins ${FORECAST_START} ticks before election`
            : 'No election currently scheduled';
        return `
            <div class="pol-forecast-box">
                <div class="pol-fc-header">
                    <span class="pol-mod-title">Election Forecast</span>
                </div>
                <div class="pol-fc-empty">
                    <div class="pol-fc-empty-title">Insufficient polling data</div>
                    <div class="pol-fc-empty-detail">${detail}</div>
                </div>
            </div>`;
    }

    // Compute per-party momentum (average across blocs)
    const momMap = {};
    const momCount = {};
    for (const row of (blocApprovals || [])) {
        const fid = row.faction_id;
        momMap[fid] = (momMap[fid] || 0) + Number(row.momentum || 0);
        momCount[fid] = (momCount[fid] || 0) + 1;
    }

    const seatMargin = Math.max(1, MARGIN_START - (FORECAST_START - ticksLeft));

    // Build party forecast data
    const parties = (allParties || []).map(p => {
        const voteShare = Number(p.national_vote_share || 0);
        const estSeats = Math.round((voteShare / 100) * totalSeats);
        const avgMom = momCount[p.id] ? Math.round(momMap[p.id] / momCount[p.id]) : 0;
        return { ...p, estSeats, momentum: avgMom };
    }).sort((a, b) => b.estSeats - a.estSeats);

    // Confidence
    const confLabel = seatMargin >= 10 ? 'VERY LOW' : seatMargin >= 7 ? 'LOW' : seatMargin >= 5 ? 'MODERATE' : seatMargin >= 3 ? 'HIGH' : 'VERY HIGH';
    const confColor = seatMargin >= 10 ? 'var(--dred)' : seatMargin >= 7 ? 'var(--damber)' : seatMargin >= 5 ? 'var(--damber)' : seatMargin >= 3 ? '#22d3ee' : 'var(--dgreen)';
    const confPct = ((FORECAST_START - ticksLeft) / FORECAST_START) * 100;

    // Party bands
    const bandsHtml = parties.map(p => {
        const lo = Math.max(p.estSeats - seatMargin, 0);
        const hi = Math.min(p.estSeats + seatMargin, totalSeats);
        const loPct = (lo / totalSeats) * 100;
        const hiPct = (hi / totalSeats) * 100;
        const color = p.party_color || '#8a8778';
        const abbr = p.abbreviation || (p.faction_name || '??').substring(0, 2).toUpperCase();
        const isPlayer = p.id === playerFactionId;
        const momColor = p.momentum > 0 ? 'var(--dgreen)' : p.momentum < 0 ? 'var(--dred)' : 'var(--dtxt-muted)';
        const momArrow = p.momentum > 0 ? '▲' : p.momentum < 0 ? '▼' : '—';
        const momText = p.momentum !== 0 ? `${momArrow}${Math.abs(p.momentum)}` : momArrow;
        const majLinePct = (majority / totalSeats) * 100;

        return `<div class="pol-fc-party">
            <div class="pol-fc-party-header">
                <div class="pol-fc-party-left">
                    <div class="pol-fc-party-dot" style="background:${color}"></div>
                    <span class="pol-fc-party-abbr" style="color:${color}">${escapeHtml(abbr)}</span>
                    ${isPlayer ? '<span class="pol-ideo-legend-you">YOU</span>' : ''}
                </div>
                <div class="pol-fc-party-right">
                    <span class="pol-fc-momentum" style="color:${momColor}">${momText}</span>
                    <span class="pol-fc-range">${lo}–${hi}</span>
                    <span class="pol-fc-seats-label">seats</span>
                </div>
            </div>
            <div class="pol-fc-band">
                <div class="pol-fc-band-fill" style="left:${loPct.toFixed(1)}%;width:${(hiPct - loPct).toFixed(1)}%;background:${color}22;border-color:${color}33"></div>
                <div class="pol-fc-maj-line" style="left:${majLinePct.toFixed(1)}%"></div>
            </div>
        </div>`;
    }).join('');

    // Race status
    const playerParty = parties.find(p => p.id === playerFactionId);
    const topRival = parties.find(p => p.id !== playerFactionId);
    let statusHtml = '';
    if (playerParty && topRival) {
        const pLo = Math.max(playerParty.estSeats - seatMargin, 0);
        const pHi = Math.min(playerParty.estSeats + seatMargin, totalSeats);
        const rLo = Math.max(topRival.estSeats - seatMargin, 0);
        const rHi = Math.min(topRival.estSeats + seatMargin, totalSeats);
        const overlap = Math.max(0, Math.min(pHi, rHi) - Math.max(pLo, rLo));
        const totalRange = pHi - pLo;
        const overlapPct = totalRange > 0 ? Math.round((overlap / totalRange) * 100) : 0;
        const pAbbr = playerParty.abbreviation || 'YOU';
        const rAbbr = topRival.abbreviation || 'RIVAL';
        const label = overlapPct > 70 ? 'TOO CLOSE TO CALL'
            : overlapPct > 30 ? 'COMPETITIVE'
            : overlapPct > 0 ? (playerParty.estSeats > topRival.estSeats ? `LEANING ${pAbbr}` : `LEANING ${rAbbr}`)
            : (playerParty.estSeats > topRival.estSeats ? `${pAbbr} LEADS` : `${rAbbr} LEADS`);
        const statusColor = overlapPct > 70 ? 'var(--dred)' : overlapPct > 30 ? 'var(--damber)' : 'var(--dgreen)';
        const desc = overlapPct > 70 ? `${pAbbr} and ${rAbbr} seat ranges fully overlap. Outcome is uncertain.`
            : overlapPct > 30 ? 'Bands are narrowing. Late campaigns could decide the race.'
            : overlapPct > 0 ? 'Leading party is emerging, but the gap is not yet decisive.'
            : 'Ranges no longer overlap. Leader is identifiable.';
        statusHtml = `
            <div class="pol-fc-status" style="background:${statusColor}08;border-color:${statusColor}">
                <div class="pol-fc-status-header">
                    <span class="pol-fc-status-label" style="color:${statusColor}">${escapeHtml(label)}</span>
                    <span class="pol-fc-status-overlap">${overlapPct}% overlap</span>
                </div>
                <div class="pol-fc-status-desc">${desc}</div>
            </div>`;
    }

    return `
        <div class="pol-forecast-box">
            <div class="pol-fc-header">
                <span class="pol-mod-title">Election Forecast</span>
                <span class="pol-fc-phase" style="color:${phaseColor};background:${phaseColor}15">${phase}</span>
            </div>
            <div class="pol-fc-countdown">
                <div>
                    <span class="pol-fc-ticks-big" style="color:${phaseColor}">${ticksLeft}</span>
                    <span class="pol-fc-ticks-label">ticks</span>
                </div>
                <div style="text-align:right">
                    <div style="display:flex;align-items:center;gap:4px;justify-content:flex-end">
                        <span class="pol-fc-margin-label">Margin:</span>
                        <span class="pol-fc-margin-val" style="color:${confColor}">±${seatMargin} seats</span>
                    </div>
                    <span class="pol-fc-conf-badge" style="color:${confColor};background:${confColor}15">${confLabel} CONFIDENCE</span>
                </div>
            </div>
            <div class="pol-fc-conf-bar">
                <div class="pol-fc-conf-fill" style="width:${confPct.toFixed(0)}%;background:${confColor}"></div>
            </div>
            ${bandsHtml}
            <div class="pol-fc-maj-legend">
                <div class="pol-fc-maj-dash"></div>
                <span class="pol-fc-maj-text">Majority: ${majority} seats</span>
            </div>
            ${statusHtml}
        </div>`;
}
