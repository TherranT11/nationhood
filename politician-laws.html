<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Politician — Laws</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
.content { padding:32px 24px 24px; }

.crumb { font-size:10px; letter-spacing:0.12em; color:#666; text-transform:uppercase;
  margin-bottom:18px; font-weight:600; }
.crumb a { color:#888; text-decoration:none; }
.crumb a:hover { color:#5aafa5; }
.crumb .sep { margin:0 8px; color:#444; }
.crumb .here { color:#cfcabf; }

.page-head { margin-bottom:26px; padding-bottom:18px;
  border-bottom:0.5px solid rgba(255,255,255,0.07); }
.page-eyebrow { font-size:10px; letter-spacing:0.18em; color:#7a4a4a;
  text-transform:uppercase; font-weight:600; margin-bottom:8px; }
.page-title { font-size:30px; font-weight:500; color:#fff; letter-spacing:-0.01em;
  font-family:Georgia,'Times New Roman',serif; font-style:italic; }
.page-sub { font-size:13px; color:#888; margin-top:8px; letter-spacing:0.02em; }

.law-empty { padding:80px 20px; text-align:center; color:#5a5a5a;
  font-size:13px; line-height:1.55; max-width:520px; margin:0 auto; }
.law-empty strong { color:#888; font-weight:600; }

/* Per-sector section — same shape as modifiers.html's .mod-section.
   Sectors render in a fixed order so the same nation always reads
   in the same order; unrecognised major_sector values fall into a
   tail "Other" bucket. */
.law-section { margin-bottom:28px; }
.law-section__head { font-size:10px; letter-spacing:0.18em; text-transform:uppercase;
  color:#7a7468; font-weight:600; padding-bottom:8px; margin-bottom:12px;
  border-bottom:0.5px solid rgba(255,255,255,0.06); }
.law-section__grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.law-section__grid > .law-card { margin-bottom:0; }

/* Law card — visual scale mirrors the modifier card 1.5x baseline
   so the two surfaces feel cohesive. Accent on the left border is
   slate-blue for laws (distinguishing them from the severity-keyed
   modifier accent strip). */
.law-card { background:#0f1212; border:0.5px solid rgba(255,255,255,0.05);
  border-left:6px solid #7a9aab;
  border-radius:8px; padding:21px 27px; margin-bottom:10px; }
.law-card__top { display:flex; justify-content:space-between; align-items:baseline;
  gap:18px; flex-wrap:wrap; }
.law-card__name { font-size:22px; color:#fff; font-weight:600; letter-spacing:0.01em; }
.law-card__pos  { font-size:13px; letter-spacing:0.10em; text-transform:uppercase;
  font-weight:700; color:#7a9aab; padding:3px 12px;
  border:0.5px solid rgba(122,154,171,0.45); border-radius:4px;
  background:rgba(122,154,171,0.08); }
.law-card__desc { font-style:italic; font-size:18px; color:#888; line-height:1.55;
  margin-top:12px; }
.law-card__pos-desc { font-size:14px; color:#aaa; line-height:1.55; margin-top:12px;
  padding-top:12px; border-top:0.5px dashed rgba(255,255,255,0.05); }
.law-card__meta { font-size:11px; color:#5a5a5a; margin-top:10px; letter-spacing:0.04em; }

.loading { font-family:monospace; font-size:11px; color:#4a4940;
  text-align:center; padding:80px 20px; }
.fail { font-family:monospace; font-size:11px; color:#c87a7a;
  text-align:center; padding:80px 20px; }

/* Bills in vote — 20270423 voting MVP. Visual rhythm matches the
   law-cards (slate accent) but borrowed amber from the elections
   chrome for "in flight" bills to read as "live & time-pressured". */
.bills-section { margin-bottom:30px; padding-bottom:22px;
  border-bottom:0.5px solid rgba(255,255,255,0.07); }
.bills-section__head { font-size:10px; letter-spacing:0.18em; text-transform:uppercase;
  color:#7a7468; font-weight:600; padding-bottom:8px; margin-bottom:12px;
  border-bottom:0.5px solid rgba(255,255,255,0.06); }
.bills-empty { font-size:12px; color:#5a5a5a; font-style:italic;
  padding:14px 0; }

.bill-card { background:#0d0d0c; border:0.5px solid rgba(122,154,171,0.18);
  border-left:2px solid rgba(122,154,171,0.4); border-radius:5px;
  padding:14px 16px; margin-bottom:10px; }
.bill-card.voting { border-left-color:#c8a64e; }
.bill-card__head { display:flex; justify-content:space-between; align-items:baseline;
  gap:10px; margin-bottom:6px; flex-wrap:wrap; }
.bill-card__policy { font-size:13px; font-weight:600; color:#fff; }
.bill-card__status { font-size:9px; letter-spacing:0.13em; text-transform:uppercase;
  color:#888; font-family:monospace; }
.bill-card__status.passed { color:#7ac3a1; }
.bill-card__status.failed { color:#c87a7a; }
.bill-card__status.voting { color:#c8a64e; }
.bill-card__status.expired { color:#666; }
.bill-card__change { font-size:11px; color:#888; margin:6px 0; line-height:1.5; }
.bill-card__change .from { color:#666; }
.bill-card__change .to   { color:#7a9aab; font-weight:500; }
.bill-card__meta { font-size:10px; color:#666; margin:4px 0 6px;
  letter-spacing:0.03em; }
.bill-card__stance { font-size:10px; color:#666; margin-bottom:8px;
  letter-spacing:0.04em; line-height:1.6; }
.bill-card__stance .pos { color:#7ac3a1; }
.bill-card__stance .neg { color:#c87a7a; }
.bill-card__row { display:flex; justify-content:space-between; align-items:center;
  margin-top:8px; gap:10px; flex-wrap:wrap; }
.bill-card__tally { font-size:11px; color:#888; font-variant-numeric:tabular-nums; }
.bill-card__tally .y { color:#7ac3a1; }
.bill-card__tally .n { color:#c87a7a; }
.bill-card__actions { display:flex; gap:6px; }
.bill-vote-btn { font-family:monospace; font-size:9px; letter-spacing:0.13em;
  background:transparent; border:0.5px solid rgba(255,255,255,0.2); color:#cfcabf;
  padding:6px 12px; border-radius:3px; cursor:pointer; text-transform:uppercase; }
.bill-vote-btn.yes:hover:not(:disabled) { border-color:#7ac3a1; color:#7ac3a1; }
.bill-vote-btn.no:hover:not(:disabled)  { border-color:#c87a7a; color:#c87a7a; }
.bill-vote-btn:disabled  { opacity:0.4; cursor:default; }
.bill-vote-btn.cast.yes  { background:rgba(122,195,161,0.15); border-color:#7ac3a1; color:#7ac3a1; }
.bill-vote-btn.cast.no   { background:rgba(200,122,122,0.15); border-color:#c87a7a; color:#c87a7a; }

@media (max-width:700px) {
  .content { padding:20px 14px 16px; }
  .page-title { font-size:24px; }
  .law-card { padding:18px 21px; }
  .law-section__grid { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<div id="pol-topbar-container"></div>

<div class="content" id="content" style="display:none;">
  <div class="crumb">
    <a href="politician-nation.html">NATION</a>
    <span class="sep">&rsaquo;</span>
    <span class="here">LAWS</span>
  </div>
  <div class="page-head">
    <div class="page-eyebrow" id="ph-eyebrow">— Active Codebook —</div>
    <div class="page-title">Active <span style="font-style:normal;font-family:inherit;color:#fff;">Laws</span></div>
    <div class="page-sub" id="ph-sub">—</div>
  </div>
  <div id="bills-host"></div>
  <div id="law-host"></div>
</div>

<div id="loading" class="loading">LOADING...</div>

<script type="module">
import { bootstrapPolitician } from './js/politician-topbar.js';
import { _supabase } from './js/supabase-client.js';
import { escapeHtml, tickToYear } from './js/utils.js';
import { MAJOR_SECTORS } from './js/game/diplomacy-constants.js';

// One source of truth for sector ordering + labels — the same array
// that drives the diplomacy / policy admin surfaces. Buckets are keyed
// by uppercase (the DB stores major_sector in either case across
// migration vintages); display uses the canonical label. Unknown
// sectors fall through into a tail "Other" bucket.
const SECTOR_KEYS   = MAJOR_SECTORS.map(s => s.key);
const SECTOR_LABELS = new Map(MAJOR_SECTORS.map(s => [s.key, s.label]));

async function init() {
  let ctx = null;
  try { ctx = await bootstrapPolitician('nation'); }
  catch (err) {
    console.error('politician-laws: bootstrap failed', err);
    document.getElementById('loading').textContent = 'Failed to load. Please reload the page.';
    return;
  }
  if (!ctx) return;

  const nation = ctx.nation;
  if (!nation) {
    document.getElementById('loading').textContent = 'No nation associated with this politician.';
    return;
  }

  document.title = `${nation.name} — Laws`;
  document.getElementById('ph-sub').textContent =
    `${nation.name}${nation.capital ? ` · capital ${nation.capital}` : ''}`;

  await renderLaws(nation.id);
  await renderBills(nation.id, ctx);

  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}

async function renderLaws(nationId) {
  const host = document.getElementById('law-host');

  // Active laws joined to the policy definition + the selected option.
  // is_reversal rows are filtered out — those are transient repeal
  // bookkeeping that doesn't represent an actual live law (laws.html
  // already documents this; same filter applies here for the same
  // reason).
  const { data, error } = await _supabase
    .from('active_laws')
    .select(`
      id,
      passed_tick,
      policies (
        id, policy_name, description, major_sector
      ),
      selected_option:policy_options!selected_option_id (
        option_name, option_description
      )
    `)
    .eq('nation_id', nationId)
    .eq('is_reversal', false);

  if (error) {
    console.error('politician-laws: load failed', error);
    host.innerHTML =
      `<div class="fail">Failed to load laws.<br>` +
      `${escapeHtml(error.message || '')}</div>`;
    return;
  }

  // Drop rows whose policies join came back null (FK orphan between
  // the active row and our read; same defence the modifiers page
  // uses against template deletions).
  const rows = (data || [])
    .map(r => r.policies ? {
      ...r.policies,
      passed_tick:        r.passed_tick,
      option_name:        r.selected_option?.option_name || null,
      option_description: r.selected_option?.option_description || null,
    } : null)
    .filter(Boolean);

  if (rows.length === 0) {
    host.innerHTML =
      `<div class="law-empty">` +
        `<strong>No active laws on the books.</strong><br>` +
        `Laws surface here when the legislature passes legislation that's been signed into effect. None on file for this nation right now.` +
      `</div>`;
    return;
  }

  // Bucket by major_sector (uppercased to absorb either casing in
  // the DB). Unrecognised sectors fall into Other so a new sector
  // landing on policies doesn't silently drop the row.
  const buckets = new Map(SECTOR_KEYS.map(k => [k, []]));
  const other = [];
  for (const r of rows) {
    const key = String(r.major_sector || '').toUpperCase();
    (buckets.has(key) ? buckets.get(key) : other).push(r);
  }
  for (const arr of buckets.values()) arr.sort((a, b) => a.policy_name.localeCompare(b.policy_name));
  other.sort((a, b) => a.policy_name.localeCompare(b.policy_name));

  let html = '';
  for (const key of SECTOR_KEYS) {
    const laws = buckets.get(key);
    if (!laws.length) continue;
    html += renderSection(SECTOR_LABELS.get(key) || key, laws);
  }
  if (other.length) html += renderSection('Other', other);
  host.innerHTML = html;
}

function renderSection(sector, laws) {
  return (
    `<div class="law-section">` +
      `<div class="law-section__head">${escapeHtml(sector)}</div>` +
      `<div class="law-section__grid">` +
        laws.map(renderCard).join('') +
      `</div>` +
    `</div>`
  );
}

function renderCard(law) {
  const name = law.policy_name || 'Unnamed law';
  const desc = (law.description || '').trim();
  const optName = (law.option_name || '').trim();
  const optDesc = (law.option_description || '').trim();
  const passedYear = (law.passed_tick != null) ? tickToYear(law.passed_tick) : null;
  return (
    `<div class="law-card">` +
      `<div class="law-card__top">` +
        `<div class="law-card__name">${escapeHtml(name)}</div>` +
        (optName ? `<div class="law-card__pos">${escapeHtml(optName)}</div>` : '') +
      `</div>` +
      (desc ? `<div class="law-card__desc">${escapeHtml(desc)}</div>` : '') +
      (optDesc ? `<div class="law-card__pos-desc">${escapeHtml(optDesc)}</div>` : '') +
      (passedYear ? `<div class="law-card__meta">Passed ${escapeHtml(String(passedYear))}</div>` : '') +
    `</div>`
  );
}

// ─────────────────────────────────────────────────────────────────────
// Bills in vote — 20270423 voting MVP.
// Renders any currently in-flight bills with yes/no buttons + a recent-
// history strip below. Voting goes through the cast_vote_on_bill
// SECURITY DEFINER RPC so RLS doesn't have to grant client writes on
// assembly_bill_votes.
// ─────────────────────────────────────────────────────────────────────

function fmtStance(alignment) {
  // alignment is {Archetype: ±1, …}; render as up-to-3 chips, positives
  // first, negatives second, others (zero) suppressed. Empty stance →
  // a muted "(no archetype tilt)" so the row reads complete.
  if (!alignment || typeof alignment !== 'object') return '<span class="bill-card__stance">(no archetype tilt)</span>';
  const entries = Object.entries(alignment).filter(([, v]) => Number(v) !== 0);
  if (!entries.length) return '<span class="bill-card__stance">(no archetype tilt)</span>';
  const pos = entries.filter(([, v]) => Number(v) > 0).map(([k]) => `<span class="pos">+${escapeHtml(k)}</span>`);
  const neg = entries.filter(([, v]) => Number(v) < 0).map(([k]) => `<span class="neg">−${escapeHtml(k)}</span>`);
  return `<div class="bill-card__stance">${[...pos, ...neg].join(' · ')}</div>`;
}

async function renderBills(nationId, ctx) {
  const billsHost   = document.getElementById('bills-host');
  const viewerPolId = ctx?.faction?.id || null;
  const currentTick = Number(ctx?.shard?.current_tick) || 0;

  const [billsRes, votesRes] = await Promise.all([
    _supabase.from('assembly_bills')
      .select(`id, policy_id, current_option_id, proposed_option_id, archetype_alignment,
               status, proposed_at_tick, close_at_tick, yes_seats, no_seats, created_at,
               policy:policies!policy_id(policy_name, major_sector),
               current:policy_options!current_option_id(option_name),
               proposed:policy_options!proposed_option_id(option_name),
               proposer:factions!proposer_politician_id(leader_first_name, leader_last_name),
               proposer_party:factions!proposer_party_id(faction_name)`)
      .eq('nation_id', nationId)
      .order('created_at', { ascending: false })
      .limit(10),
    viewerPolId
      ? _supabase.from('assembly_bill_votes').select('bill_id, position').eq('politician_id', viewerPolId)
      : Promise.resolve({ data: [], error: null }),
  ]);
  if (billsRes.error) console.warn('[politician-laws] bills fetch failed', billsRes.error);
  if (votesRes.error) console.warn('[politician-laws] votes fetch failed', votesRes.error);

  const bills    = billsRes.data || [];
  const voteMap  = new Map((votesRes.data || []).map(v => [v.bill_id, v.position]));
  const voting   = bills.filter(b => b.status === 'voting');
  const recent   = bills.filter(b => b.status !== 'voting').slice(0, 5);

  // Bills section header + voting cards + recent strip.
  const votingHtml = voting.length
    ? voting.map(b => renderBillCard(b, voteMap.get(b.id) || null, currentTick)).join('')
    : '<div class="bills-empty">No bills currently up for vote.</div>';
  const recentHtml = recent.length
    ? `<div class="bills-section__head" style="margin-top:18px;">Recent</div>` +
      recent.map(b => renderBillCard(b, voteMap.get(b.id) || null, currentTick)).join('')
    : '';
  billsHost.innerHTML = `
    <div class="bills-section">
      <div class="bills-section__head">Bills in Vote</div>
      ${votingHtml}
      ${recentHtml}
    </div>`;

  // Vote button handlers — delegated to the bills-host root.
  billsHost.onclick = async (e) => {
    const btn = e.target.closest('.bill-vote-btn');
    if (!btn || btn.disabled) return;
    const billId = btn.dataset.billId;
    const pos    = btn.dataset.pos;
    if (!billId || !pos) return;
    billsHost.querySelectorAll(`[data-bill-id="${billId}"].bill-vote-btn`).forEach(b => b.disabled = true);
    try {
      const { data, error } = await _supabase.rpc('cast_vote_on_bill', { p_bill_id: billId, p_position: pos });
      if (error) throw error;
      if (!data?.success) { alert('Could not vote: ' + (data?.reason || 'unknown')); return; }
      location.reload();
    } catch (err) {
      alert('Failed: ' + (err?.message || err));
      billsHost.querySelectorAll(`[data-bill-id="${billId}"].bill-vote-btn`).forEach(b => b.disabled = false);
    }
  };
}

function renderBillCard(b, viewerVote, currentTick) {
  const policyName = b.policy?.policy_name || 'Unknown policy';
  const fromName   = b.current?.option_name  || '(no current option)';
  const toName     = b.proposed?.option_name || '(unknown option)';
  const status     = b.status || 'voting';
  const statusLabel = status === 'voting' ? 'In Vote'
                    : status === 'passed'  ? 'Passed'
                    : status === 'failed'  ? 'Failed'
                    :                        'Expired';
  const isVoting   = status === 'voting';
  const ticksLeft  = isVoting ? Math.max(0, Number(b.close_at_tick) - currentTick) : null;
  const closeNote  = isVoting
    ? (ticksLeft === 0 ? 'closes this tick' : `closes in ${ticksLeft} tick${ticksLeft === 1 ? '' : 's'}`)
    : '';

  let row;
  if (isVoting) {
    const yesCls = (viewerVote === 'yes') ? 'bill-vote-btn yes cast' : 'bill-vote-btn yes';
    const noCls  = (viewerVote === 'no')  ? 'bill-vote-btn no cast'  : 'bill-vote-btn no';
    row = `<div class="bill-card__row">
        <div class="bill-card__tally">${escapeHtml(closeNote)}</div>
        <div class="bill-card__actions">
          <button class="${yesCls}" data-bill-id="${escapeHtml(b.id)}" data-pos="yes">Yes</button>
          <button class="${noCls}"  data-bill-id="${escapeHtml(b.id)}" data-pos="no">No</button>
        </div>
      </div>`;
  } else {
    const y = Number(b.yes_seats) || 0;
    const n = Number(b.no_seats)  || 0;
    row = `<div class="bill-card__row">
        <div class="bill-card__tally">
          <span class="y">${y} yes</span> · <span class="n">${n} no</span>
        </div>
      </div>`;
  }

  // Proposer attribution: "Mariana Castillo · Partido Patria Roja"
  // when both name and party are present; falls back gracefully if
  // either is missing (joined faction was abandoned, party deleted).
  const proposerName = [b.proposer?.leader_first_name, b.proposer?.leader_last_name].filter(Boolean).join(' ').trim();
  const partyName    = b.proposer_party?.faction_name || '';
  const propTxt = proposerName && partyName ? `${proposerName} · ${partyName}`
                : proposerName               ? proposerName
                : partyName                  ? partyName
                :                              '';
  const propRow = propTxt ? `<div class="bill-card__meta">Proposed by ${escapeHtml(propTxt)}</div>` : '';

  return `<div class="bill-card ${isVoting ? 'voting' : ''}">
    <div class="bill-card__head">
      <div class="bill-card__policy">${escapeHtml(policyName)}</div>
      <div class="bill-card__status ${status}">${escapeHtml(statusLabel)}</div>
    </div>
    <div class="bill-card__change">
      <span class="from">${escapeHtml(fromName)}</span> → <span class="to">${escapeHtml(toName)}</span>
    </div>
    ${propRow}
    ${fmtStance(b.archetype_alignment)}
    ${row}
  </div>`;
}

init();
</script>
</body>
</html>
