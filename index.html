<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nationhood: Rise and Fall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Unicase:wght@400;500;600;700&family=Spline+Sans+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   NATIONHOOD: RISE AND FALL — HOME
   Four pylon gates on a glazed-brick field.
   ========================================================== */
:root{
  --lapis:        #17386B;
  --lapis-deep:   #0E2449;
  --lapis-lift:   #22497F;
  --papyrus:      #E9DCBD;
  --gold:         #C9962F;
  --gold-bright:  #EBC163;
  --clay:         #8B5E3C;
  --on-lapis-dim: #93A9C9;
  --incise: "Cormorant Unicase", Georgia, serif;
  --meta:   "Spline Sans Mono", ui-monospace, monospace;
}

*,*::before,*::after{ box-sizing:border-box; }

body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:clamp(38px,7vh,74px);
  padding:44px 22px;

  background-color:var(--lapis);
  /* glazed brick coursing + light falling from above the gate */
  background-image:
    repeating-linear-gradient(0deg,  rgba(0,0,0,.20) 0 1px, transparent 1px 38px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.13) 0 1px, transparent 1px 76px),
    radial-gradient(58% 46% at 50% 4%,  rgba(235,193,99,.20), transparent 68%),
    radial-gradient(120% 88% at 50% 108%, rgba(0,0,0,.55), transparent 62%);
  background-attachment:fixed;

  font-family:var(--meta);
  color:var(--papyrus);
  -webkit-font-smoothing:antialiased;
}

/* ---------------- title ---------------- */
.crown{ text-align:center; }

.cartouche{
  display:inline-block;
  padding:clamp(11px,2vw,17px) clamp(28px,5vw,58px);
  border:2px solid var(--gold);
  border-radius:999px;
  background:rgba(201,150,47,.09);
  box-shadow:inset 0 0 0 4px rgba(233,220,189,.16),
             0 0 44px rgba(201,150,47,.16);
}
.cartouche h1{
  margin:0;
  font-family:var(--incise); font-weight:600;
  font-size:clamp(31px,6.4vw,66px);
  letter-spacing:.15em; text-indent:.15em;
  line-height:1.04;
  color:var(--papyrus);
}

.crown__sub{
  margin:clamp(14px,2.4vh,22px) 0 0;
  font-family:var(--incise); font-weight:500;
  font-size:clamp(13px,1.9vw,18px);
  letter-spacing:.44em; text-indent:.44em;
  color:var(--gold);
}

/* ---------------- the four gates ---------------- */
.gates{
  display:grid;
  grid-template-columns:repeat(4, minmax(0,1fr));
  gap:clamp(14px,2.6vw,34px);
  width:min(100%, 880px);
  list-style:none; margin:0; padding:0;
}

.gate{
  display:block;
  text-decoration:none;
  text-align:center;
  transition:transform .28s ease;
}
.gate svg{ display:block; width:100%; height:auto; overflow:visible; }

.gate__label{
  display:block;
  margin-top:15px;
  font-family:var(--incise); font-weight:600;
  font-size:clamp(12px,1.55vw,17px);
  letter-spacing:.2em; text-indent:.2em;
  color:var(--on-lapis-dim);
  transition:color .28s ease;
  white-space:nowrap;
}

/* stonework */
.gate .stone{ fill:url(#face); stroke:rgba(201,150,47,.55); stroke-width:1.4; transition:stroke .28s ease; }
.gate .cornice{ fill:url(#faceLift); stroke:rgba(201,150,47,.6); stroke-width:1.4; }
.gate .plinth{ fill:#0E2449; stroke:rgba(201,150,47,.4); stroke-width:1.2; }
.gate .door{ fill:url(#doorDark); stroke:rgba(201,150,47,.42); stroke-width:1.2; transition:fill .3s ease; }
.gate .cipher{ stroke:var(--gold); fill:none; stroke-width:2.2;
               stroke-linecap:round; stroke-linejoin:round; transition:stroke .28s ease; }
.gate .cipher-solid{ fill:var(--gold); stroke:none; transition:fill .28s ease; }

/* Sign up stands open by default — the primary way in */
.gate--open .door{ fill:url(#doorLit); }
.gate--open .gate__label{ color:var(--papyrus); }

/* any gate opens on approach */
.gate:hover,
.gate:focus-visible{ transform:translateY(-6px); }
.gate:hover .door,
.gate:focus-visible .door{ fill:url(#doorLit); }
.gate:hover .stone,
.gate:focus-visible .stone{ stroke:var(--gold-bright); }
.gate:hover .cipher,
.gate:focus-visible .cipher{ stroke:var(--gold-bright); }
.gate:hover .cipher-solid,
.gate:focus-visible .cipher-solid{ fill:var(--gold-bright); }
.gate:hover .gate__label,
.gate:focus-visible .gate__label{ color:var(--gold-bright); }

.gate:focus{ outline:none; }
.gate:focus-visible{ outline:2px solid var(--gold-bright); outline-offset:10px; }

/* ---------------- entrance ---------------- */
@keyframes rise{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:none; } }
.crown{ animation:rise .8s ease-out both; }
.gates li{ animation:rise .8s ease-out both; }
.gates li:nth-child(1){ animation-delay:.16s; }
.gates li:nth-child(2){ animation-delay:.26s; }
.gates li:nth-child(3){ animation-delay:.36s; }
.gates li:nth-child(4){ animation-delay:.46s; }

/* ---------------- responsive ---------------- */
@media (max-width:760px){
  .gates{ grid-template-columns:repeat(2, minmax(0,1fr)); width:min(100%, 400px); gap:22px 20px; }
  .gate__label{ font-size:14px; letter-spacing:.16em; text-indent:.16em; }
}
@media (max-width:360px){
  .gate__label{ font-size:12.5px; }
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation:none !important; transition:none !important; }
}
</style>
</head>
<body>

<!-- shared gradients for every gate -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#22497F"/>
      <stop offset=".55" stop-color="#1A3D70"/>
      <stop offset="1"   stop-color="#102B55"/>
    </linearGradient>
    <linearGradient id="faceLift" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A5893"/>
      <stop offset="1" stop-color="#1B406F"/>
    </linearGradient>
    <linearGradient id="doorDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1B36"/>
      <stop offset="1" stop-color="#050E1E"/>
    </linearGradient>
    <linearGradient id="doorLit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#F0CE7C"/>
      <stop offset=".42" stop-color="#C9962F"/>
      <stop offset="1"   stop-color="#7A5715"/>
    </linearGradient>
  </defs>
</svg>

<div class="crown">
  <div class="cartouche"><h1>NATIONHOOD</h1></div>
  <p class="crown__sub">RISE AND FALL</p>
</div>

<ul class="gates">

  <!-- ============ LOG IN ============ -->
  <li>
    <a class="gate" href="/login">
      <svg viewBox="0 0 160 236" aria-hidden="true" focusable="false">
        <rect class="cornice" x="16" y="1" width="128" height="8"/>
        <path class="cornice" d="M 20 9 L 140 9 L 130 32 L 30 32 Z"/>
        <path class="stone"   d="M 30 32 L 130 32 L 148 224 L 12 224 Z"/>
        <path class="door"    d="M 60 224 L 64 112 L 96 112 L 100 224 Z"/>
        <rect class="plinth"  x="4" y="224" width="152" height="9"/>
        <!-- door bolt -->
        <g transform="translate(80,72)">
          <rect class="cipher" x="-19" y="-6" width="38" height="12" rx="2"/>
          <circle class="cipher-solid" cx="0" cy="0" r="4"/>
        </g>
      </svg>
      <span class="gate__label">LOG IN</span>
    </a>
  </li>

  <!-- ============ SIGN UP (stands open) ============ -->
  <li>
    <a class="gate gate--open" href="/signup">
      <svg viewBox="0 0 160 236" aria-hidden="true" focusable="false">
        <rect class="cornice" x="16" y="1" width="128" height="8"/>
        <path class="cornice" d="M 20 9 L 140 9 L 130 32 L 30 32 Z"/>
        <path class="stone"   d="M 30 32 L 130 32 L 148 224 L 12 224 Z"/>
        <path class="door"    d="M 60 224 L 64 112 L 96 112 L 100 224 Z"/>
        <rect class="plinth"  x="4" y="224" width="152" height="9"/>
        <!-- sun rising over the horizon -->
        <g transform="translate(80,74)">
          <path class="cipher" d="M -21 8 L 21 8"/>
          <path class="cipher" d="M -13 8 A 13 13 0 0 1 13 8"/>
          <path class="cipher" d="M 0 -18 L 0 -13"/>
          <path class="cipher" d="M -15 -11 L -12 -8"/>
          <path class="cipher" d="M 15 -11 L 12 -8"/>
        </g>
      </svg>
      <span class="gate__label">SIGN UP</span>
    </a>
  </li>

  <!-- ============ WIKI ============ -->
  <li>
    <a class="gate" href="#">
      <svg viewBox="0 0 160 236" aria-hidden="true" focusable="false">
        <rect class="cornice" x="16" y="1" width="128" height="8"/>
        <path class="cornice" d="M 20 9 L 140 9 L 130 32 L 30 32 Z"/>
        <path class="stone"   d="M 30 32 L 130 32 L 148 224 L 12 224 Z"/>
        <path class="door"    d="M 60 224 L 64 112 L 96 112 L 100 224 Z"/>
        <rect class="plinth"  x="4" y="224" width="152" height="9"/>
        <!-- inscribed tablet -->
        <g transform="translate(80,72)">
          <rect class="cipher" x="-16" y="-19" width="32" height="38" rx="3"/>
          <path class="cipher" d="M -9 -10 L 9 -10"/>
          <path class="cipher" d="M -9 -1 L 9 -1"/>
          <path class="cipher" d="M -9 8 L 3 8"/>
        </g>
      </svg>
      <span class="gate__label">WIKI</span>
    </a>
  </li>

  <!-- ============ ABOUT ============ -->
  <li>
    <a class="gate" href="/about">
      <svg viewBox="0 0 160 236" aria-hidden="true" focusable="false">
        <rect class="cornice" x="16" y="1" width="128" height="8"/>
        <path class="cornice" d="M 20 9 L 140 9 L 130 32 L 30 32 Z"/>
        <path class="stone"   d="M 30 32 L 130 32 L 148 224 L 12 224 Z"/>
        <path class="door"    d="M 60 224 L 64 112 L 96 112 L 100 224 Z"/>
        <rect class="plinth"  x="4" y="224" width="152" height="9"/>
        <!-- watching eye -->
        <g transform="translate(80,72)">
          <path class="cipher" d="M -22 0 Q 0 -17 22 0 Q 0 17 -22 0 Z"/>
          <circle class="cipher-solid" cx="0" cy="0" r="5.4"/>
          <path class="cipher" d="M 8 9 L 14 20"/>
        </g>
      </svg>
      <span class="gate__label">ABOUT</span>
    </a>
  </li>

</ul>

</body>
</html>
