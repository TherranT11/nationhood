<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nationhood | Faction Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
<div class="page-title">Nationhood</div>
<div class="login-card">
    <div class="login-header">
        <span class="dot"></span>
        <span class="title">Faction Login</span>
    </div>
    <div class="login-body">
        <div class="initials-block">
            <div class="initials-icon">NH</div>
            <div class="initials-subtitle">Enter the Chronicle</div>
        </div>
        <div class="rule"></div>
        <form id="login-form">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn-login" id="login-btn">Enter the Chronicle</button>
            <div id="error-message" class="error"></div>
            <div id="loading-message" class="loading"></div>
        </form>
        <div class="signup-link">
            New to the continent? <a href="signup.html">Establish a Faction</a>
        </div>
    </div>
</div>
<script type="module">
import { _supabase } from './js/supabase-client.js';

    // On page load, check if user is already logged in
    (async () => {
        const { data: { user } } = await _supabase.auth.getUser();
        if (user) {
            // Already authenticated — route them appropriately
            await routeUser(user);
        }
    })();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const errorMsg   = document.getElementById('error-message');
        const loadingMsg = document.getElementById('loading-message');
        const loginBtn   = document.getElementById('login-btn');

        errorMsg.textContent   = '';
        loadingMsg.textContent = '';

        const email    = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        // Disable button and show loading state
        loginBtn.disabled = true;
        loadingMsg.textContent = 'Signing in…';

        try {
            const { data, error } = await _supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });
            if (error) throw error;

            loadingMsg.textContent = 'Checking faction status…';

            // Route based on faction setup state
            await routeUser(data.user);

        } catch (error) {
            console.error('Login error:', error);
            errorMsg.textContent = error.message || 'Login failed. Please try again.';
            loginBtn.disabled    = false;
            loadingMsg.textContent = '';
        }
    });

    /**
     * Checks the user's faction status and redirects accordingly:
     *   - Has a party with a nation assigned → dashboard.html
     *   - Anything else (no faction, no nation, etc.) → select-nation.html
     */
    async function routeUser(user) {
        try {
            const { data: faction } = await _supabase
                .from('factions')
                .select('*')
                .eq('id', user.id)
                .single();

            if (faction && faction.faction_type === 'party' && faction.nation_id) {
                // Fully set up — go to home dashboard
                window.location.href = 'dashboard.html';
            } else {
                // Needs setup — route into nation selection onboarding
                window.location.href = 'select-nation.html';
            }

        } catch (error) {
            console.error('Faction check error:', error);
            // If faction lookup fails, send user to onboarding instead of dropping into gameplay.
            window.location.href = 'select-nation.html';
        }
    }
</script>
</body>
</html>
