<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Party Leadership | Nationhood Alpha</title>
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/party-leadership.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>

<div id="top-bar"></div>

<div id="content-area" style="margin:16px auto;max-width:960px;padding:0 16px;">
    <div class="pl-container" id="pl-container">
        <div style="display:flex;align-items:center;justify-content:center;height:200px;color:var(--text-dim);font-family:var(--font-mono);font-size:10px;">Loading...</div>
    </div>
</div>

<script type="module">

import { _supabase } from './js/supabase-client.js';
import { initPage } from './js/common.js';
import { escapeHtml } from './js/utils.js';
import { getNationNames, deductAP } from './js/game-common.js';
import {
    POSITIVE_MAP, NEGATIVE_MAP,
    IDEOLOGY_COLORS, CATEGORY_COLORS,
    getElectabilityTier, getAPCostColor, getAPCostLabel,
    generateLeadershipCandidates
} from './js/game/party-leadership.js';
import { PM_TRAIT_KEYS } from './js/game/political-actions.js';
import { isPresidentialRepublic, isAutocracy } from './js/game/government-types.js';

let currentNation = null;
let currentFaction = null;
let currentShard = null;

// Candidates for the leader role
let candidatesByRole = { leader: [] };

// Current leader (from DB)
let currentLeaders = { leader: null };

// Selected candidate index
let selectedIndex = { leader: null };

// Double-fire guard for appoint action
let isAppointing = false;

// Track whether candidates were refreshed this tick (loaded from DB)
let lastRefreshTick = null;

// ── Init ──
initPage('politics', async (state) => {
    const { nation, faction, shard } = state;
    currentNation = nation;
    currentFaction = faction;
    currentShard = shard;

    if (!nation || !faction) {
        document.getElementById('pl-container').innerHTML =
            '<div style="padding:40px;text-align:center;color:var(--text-dim);font-family:var(--font-mono);font-size:10px;">No nation or party found.</div>';
        return;
    }

    // Load current leaders from faction data
    loadCurrentLeaders();

    // Load persisted candidates (or generate if first visit)
    await generateAllCandidates();

    // Render
    render();
});

function loadCurrentLeaders() {
    // Current party leader is stored on the faction
    if (currentFaction.leader_first_name && currentFaction.leader_last_name) {
        currentLeaders.leader = {
            firstName: currentFaction.leader_first_name,
            lastName: currentFaction.leader_last_name,
            age: currentFaction.leader_age || null,
            electability: currentFaction.electability ?? 50,
            ideology: currentFaction.leader_ideology || null,
            positiveTraits: currentFaction.leader_positive_traits || [],
            negativeTraits: currentFaction.leader_negative_traits || [],
        };
    }

}

function buildCurrentCandidateEntry() {
    const cl = currentLeaders.leader;
    if (!cl) return null;
    return {
        firstName: cl.firstName,
        lastName: cl.lastName,
        age: cl.age || 45,
        ideology: cl.ideology || currentFaction.ideology_value_1 || 'PROGRESS',
        positiveTraits: cl.positiveTraits || [],
        negativeTraits: cl.negativeTraits || [],
        apCost: 0,
        costBreakdown: { positiveTotal: 0, negativeTotal: 0, rawCost: 0, apCost: 0 },
        isCurrent: true,
        electability: cl.electability ?? 50,
    };
}

async function persistCandidates(factionId, role, candidates) {
    const { error } = await _supabase.from('leadership_candidates').upsert({
        faction_id: factionId,
        role,
        candidates,
        generated_at: new Date().toISOString(),
    }, { onConflict: 'faction_id,role' });
    if (error) console.warn(`Failed to persist ${role} candidates (non-blocking):`, error.message);
}

async function generateAllCandidates() {
    const nationName = currentNation.name || '';
    const factionId = currentFaction.id;

    // Try to load persisted candidates from DB first
    let candidates = null;
    const { data: stored, error: loadErr } = await _supabase
        .from('leadership_candidates')
        .select('candidates, last_refresh_tick')
        .eq('faction_id', factionId)
        .eq('role', 'leader')
        .maybeSingle();

    if (!loadErr && stored && Array.isArray(stored.candidates) && stored.candidates.length > 0) {
        candidates = stored.candidates;
        lastRefreshTick = stored.last_refresh_tick;
    } else {
        // Generate fresh candidates and persist them
        candidates = generateLeadershipCandidates(nationName, getNationNames, 3, 'leader');
        await persistCandidates(factionId, 'leader', candidates);
    }

    candidatesByRole.leader = candidates;

    // Prepend current leader as a 0-cost option
    const currentEntry = buildCurrentCandidateEntry();
    if (currentEntry) candidatesByRole.leader.unshift(currentEntry);

    selectedIndex.leader = null;
}

// ═══════════════════════════════════════
//  Render
// ═══════════════════════════════════════
function render() {
    const container = document.getElementById('pl-container');
    const candidates = candidatesByRole.leader;
    const sel = selectedIndex.leader;
    const selectedCandidate = sel !== null ? candidates[sel] : null;

    // Header cost display
    let headerCostHTML = '';
    let appointBtnHTML = '';
    if (selectedCandidate && !selectedCandidate.isCurrent) {
        const costColor = getAPCostColor(selectedCandidate.apCost);
        const costLabel = getAPCostLabel(selectedCandidate.apCost);
        headerCostHTML = `<span class="pl-header-cost" style="color:${costColor}">${costLabel}</span>`;
        appointBtnHTML = `<button class="pl-appoint-btn" onclick="window._appointLeader()">Appoint Party Leader</button>`;
    }

    container.innerHTML = `
        <div class="pl-header">
            <button class="pl-back-btn" onclick="window.location.href='politics.html'">&larr; Back</button>
            <div class="pl-header-left">
                <div class="pl-header-title">Party Leadership</div>
                <div class="pl-header-sub">${escapeHtml(currentFaction.faction_name)}</div>
            </div>
            <div class="pl-header-right">
                ${headerCostHTML}
                ${appointBtnHTML}
            </div>
        </div>

        <div class="pl-body">
            <div class="pl-list" id="pl-list">
                ${renderCandidateList(candidates, sel)}
                ${renderRefreshButton()}
            </div>
            <div class="pl-detail" id="pl-detail">
                ${selectedCandidate ? renderCandidateDetail(selectedCandidate) : '<div class="pl-detail-empty">Select a candidate</div>'}
            </div>
        </div>
    `;
}

function renderCandidateList(candidates, selectedIdx) {
    if (!candidates || candidates.length === 0) {
        return '<div style="padding:20px;text-align:center;color:var(--text-dim);font-family:var(--font-mono);font-size:9px;">No candidates available.</div>';
    }

    return candidates.map((c, i) => {
        const isActive = i === selectedIdx;
        const costColor = getAPCostColor(c.apCost);
        const costLabel = getAPCostLabel(c.apCost);
        const ideology = c.ideology || '';
        const ideologyColor = IDEOLOGY_COLORS[ideology] || '#888';
        const ideologyLabel = ideology ? ideology.charAt(0) + ideology.slice(1).toLowerCase() : 'Unknown';
        const electTier = c.electability != null ? getElectabilityTier(c.electability) : null;
        const currentPill = c.isCurrent ? `<span class="pl-current-pill">CURRENT</span>` : '';

        return `
            <div class="pl-list-row ${isActive ? 'active' : ''}" onclick="window._selectCandidate(${i})">
                <div class="pl-list-row-top">
                    <span class="pl-list-name">${escapeHtml(c.firstName)} ${escapeHtml(c.lastName)}${currentPill}</span>
                    <span class="pl-list-cost" style="color:${costColor}">${costLabel}</span>
                </div>
                <div class="pl-list-age">Age ${c.age || '—'}</div>
                <div class="pl-list-meta">
                    <span class="pl-list-ideology">
                        <span class="pl-ideology-dot" style="background:${ideologyColor}"></span>
                        <span style="color:${ideologyColor}">${ideologyLabel}</span>
                    </span>
                    ${electTier ? `<span class="pl-list-electability">
                        <span class="pl-list-electability-label">Electability: </span>
                        <span style="color:${electTier.color}">${electTier.label}</span>
                    </span>` : ''}
                </div>
            </div>
        `;
    }).join('');
}

function renderCandidateDetail(c) {
    const initials = ((c.firstName || '')[0] || '') + ((c.lastName || '')[0] || '');
    const ideology = c.ideology || '';
    const ideologyColor = IDEOLOGY_COLORS[ideology] || '#888';
    const ideologyLabel = ideology ? ideology.charAt(0) + ideology.slice(1).toLowerCase() : 'Unknown';
    const electTier = c.electability != null ? getElectabilityTier(c.electability) : null;
    const costColor = getAPCostColor(c.apCost);

    // Cost box colors
    const costFaintBg = costColor + '14'; // ~8% opacity
    const costBorder = costColor + '33'; // ~20% opacity

    // Strengths
    const positiveTraits = (c.positiveTraits || []).map(key => POSITIVE_MAP[key]).filter(Boolean);
    const posTotal = positiveTraits.reduce((sum, t) => sum + t.cost, 0);

    // Weaknesses
    const negativeTraits = (c.negativeTraits || []).map(key => NEGATIVE_MAP[key]).filter(Boolean);
    const negTotal = negativeTraits.reduce((sum, t) => sum + t.relief, 0);

    // Use costBreakdown from candidate, fall back to computed values
    const rawCost = c.costBreakdown ? c.costBreakdown.rawCost : (posTotal - negTotal);
    const finalAP = c.costBreakdown ? c.costBreakdown.apCost : Math.max(0, Math.min(8, Math.round(posTotal - negTotal)));
    const finalColor = getAPCostColor(c.isCurrent ? 0 : finalAP);

    return `
        <!-- Identity Block -->
        <div class="pl-identity">
            <div class="pl-avatar">${escapeHtml(initials)}</div>
            <div class="pl-identity-info">
                <div class="pl-detail-name">${escapeHtml(c.firstName)} ${escapeHtml(c.lastName)}</div>
                <div class="pl-detail-age">Age ${c.age || '—'}</div>
                <div class="pl-detail-ideology">
                    <span class="pl-ideology-dot" style="background:${ideologyColor}"></span>
                    <span style="color:${ideologyColor}">${ideologyLabel}</span>
                </div>
            </div>
            <div class="pl-cost-box" style="background:${costFaintBg};border:1px solid ${costBorder}">
                <div class="pl-cost-number" style="color:${costColor}">${c.isCurrent ? 'FREE' : (c.apCost === 0 ? 'FREE' : c.apCost)}</div>
                <div class="pl-cost-label">Appointment cost</div>
            </div>
        </div>

        ${electTier ? `<!-- Electability Bar -->
        <div class="pl-electability" style="border-left:3px solid ${electTier.color}">
            <div class="pl-electability-header">
                <span class="pl-electability-title">ELECTABILITY</span>
                <span class="pl-electability-badge" style="color:${electTier.color};background:${electTier.color + '14'};border:1px solid ${electTier.color + '33'}">${electTier.label.toUpperCase()}</span>
            </div>
            <div class="pl-electability-track">
                <div class="pl-electability-fill" style="width:${c.electability}%;background:${electTier.color}"></div>
            </div>
            <div class="pl-electability-scale">
                <span>V.Low</span><span>Low</span><span>Moderate</span><span>High</span><span>V.High</span>
            </div>
        </div>` : ''}

        <!-- Strengths -->
        <div class="pl-section-header">STRENGTHS ${positiveTraits.length > 0 ? `<span style="color:var(--green)">+${posTotal.toFixed(1)}</span>` : ''}</div>
        ${positiveTraits.length > 0 ? positiveTraits.map(t => {
            const cat = CATEGORY_COLORS[t.category] || CATEGORY_COLORS['AP'];
            return `
                <div class="pl-trait-card strength">
                    <div class="pl-trait-top">
                        <div class="pl-trait-name-wrap">
                            <span class="pl-trait-name">${escapeHtml(t.name)}</span>
                            <span class="pl-trait-category" style="color:${cat.color};background:${cat.bg};border:1px solid ${cat.border}">${t.category.toUpperCase()}</span>
                        </div>
                        <span class="pl-trait-cost positive">+${t.cost.toFixed(1)}</span>
                    </div>
                    <div class="pl-trait-effect">${escapeHtml(t.effect)}</div>
                </div>
            `;
        }).join('') : '<div style="padding:8px 0;color:var(--text-dim);font-family:var(--font-mono);font-size:9px;">None</div>'}

        <!-- Weaknesses -->
        <div class="pl-section-header">WEAKNESSES ${negativeTraits.length > 0 ? `<span style="color:var(--red)">&minus;${negTotal.toFixed(1)}</span>` : ''}</div>
        ${negativeTraits.length > 0 ? negativeTraits.map(t => {
            const cat = CATEGORY_COLORS[t.category] || CATEGORY_COLORS['AP'];
            return `
                <div class="pl-trait-card weakness">
                    <div class="pl-trait-top">
                        <div class="pl-trait-name-wrap">
                            <span class="pl-trait-name">${escapeHtml(t.name)}</span>
                            <span class="pl-trait-category" style="color:${cat.color};background:${cat.bg};border:1px solid ${cat.border}">${t.category.toUpperCase()}</span>
                        </div>
                        <span class="pl-trait-cost negative">&minus;${t.relief.toFixed(1)}</span>
                    </div>
                    <div class="pl-trait-effect">${escapeHtml(t.effect)}</div>
                </div>
            `;
        }).join('') : '<div style="padding:8px 0;color:var(--text-dim);font-family:var(--font-mono);font-size:9px;">None</div>'}

        <!-- Cost Breakdown -->
        ${!c.isCurrent ? `
        <div class="pl-breakdown">
            <div class="pl-breakdown-title">COST BREAKDOWN</div>
            <div class="pl-breakdown-math">
                <span class="pos">+${posTotal.toFixed(1)}</span>
                <span class="op"> strengths </span>
                <span class="neg">&minus; ${negTotal.toFixed(1)}</span>
                <span class="op"> weaknesses </span>
                <span class="op">= </span>
                <span class="raw">${rawCost.toFixed(1)} raw</span>
                <span class="op"> &rarr; </span>
                <span class="final" style="color:${finalColor}">${finalAP} AP</span>
            </div>
        </div>
        ` : `
        <div class="pl-breakdown">
            <div class="pl-breakdown-title">COST BREAKDOWN</div>
            <div class="pl-breakdown-math">
                <span style="color:var(--green);font-weight:700">Current leader &mdash; reappointment is free</span>
            </div>
        </div>
        `}
    `;
}

function renderRefreshButton() {
    const currentTick = currentShard?.current_tick || 0;
    const alreadyUsed = lastRefreshTick != null && lastRefreshTick >= currentTick;

    if (alreadyUsed) {
        return `<div class="pl-refresh-wrap">
            <button class="pl-refresh-btn pl-refresh-used" disabled>Refresh Leaders</button>
            <div class="pl-refresh-note">Can only be used once per tick.</div>
        </div>`;
    }

    return `<div class="pl-refresh-wrap">
        <button class="pl-refresh-btn" onclick="window._refreshLeaders()">Refresh Leaders</button>
        <div class="pl-refresh-note">5 AP — wipe all candidates and generate new ones</div>
    </div>`;
}

// ═══════════════════════════════════════
//  Global handlers
// ═══════════════════════════════════════
window._refreshLeaders = async function() {
    if (isAppointing) return;

    const currentTick = currentShard?.current_tick || 0;
    if (lastRefreshTick != null && lastRefreshTick >= currentTick) {
        alert('Can only be used once per tick.');
        return;
    }

    if (!confirm('Refresh all leadership candidates?\n\nThis will wipe the current candidates and generate new ones.\nCost: 5 AP')) return;

    isAppointing = true; // reuse the lock to prevent concurrent actions
    const btn = document.querySelector('.pl-refresh-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Refreshing...'; }

    try {
        // Deduct 5 AP
        const apResult = await deductAP(_supabase, currentFaction.id, 5);
        if (!apResult.success) {
            alert('Not enough AP. Need 5 AP, have ' + (apResult.currentAp ?? '?') + '.');
            return;
        }
        currentFaction.action_points = apResult.newAp;

        // Generate fresh candidates
        const nationName = currentNation.name || '';
        const newCandidates = generateLeadershipCandidates(nationName, getNationNames, 3, 'leader');

        // Persist to DB with last_refresh_tick
        const { error: upsertErr } = await _supabase.from('leadership_candidates').upsert({
            faction_id: currentFaction.id,
            role: 'leader',
            candidates: newCandidates,
            generated_at: new Date().toISOString(),
            last_refresh_tick: currentTick,
        }, { onConflict: 'faction_id,role' });
        if (upsertErr) {
            console.error('Failed to persist refreshed candidates:', upsertErr.message);
            alert('Error saving new candidates: ' + upsertErr.message);
            return;
        }

        // Update local state
        lastRefreshTick = currentTick;
        candidatesByRole.leader = newCandidates;

        // Prepend current leader as 0-cost option
        const currentEntry = buildCurrentCandidateEntry();
        if (currentEntry) candidatesByRole.leader.unshift(currentEntry);

        selectedIndex.leader = null;
        render();
    } catch (e) {
        alert('Error: ' + e.message);
    } finally {
        isAppointing = false;
        // Restore button if render() was never called (failure/early-return path).
        // After a successful render() the old element is detached → isConnected is false → no-op.
        if (btn && btn.isConnected) {
            btn.disabled = false;
            btn.textContent = 'Refresh Leaders';
        }
    }
};

window._selectCandidate = function(index) {
    selectedIndex.leader = index;
    render();
};


window._appointLeader = async function() {
    if (isAppointing) return;

    const sel = selectedIndex.leader;
    if (sel === null) return;

    const candidate = candidatesByRole.leader[sel];
    if (!candidate || candidate.isCurrent) return;

    const confirmLines = [
        `Appoint ${candidate.firstName} ${candidate.lastName} as Party Leader?\n`,
        `Cost: ${getAPCostLabel(candidate.apCost)}`,
        `Ideology: ${candidate.ideology}`,
    ];
    if (candidate.electability != null) {
        confirmLines.push(`Electability: ${getElectabilityTier(candidate.electability).label}`);
    }
    confirmLines.push('', 'This will replace the current party leader.');
    const isRulingPartyPreCheck = currentNation?.ruling_faction_id === currentFaction?.id;
    const isParliamentaryPreCheck = !isPresidentialRepublic(currentNation) && !isAutocracy(currentNation);
    if (isRulingPartyPreCheck && isParliamentaryPreCheck) {
        confirmLines.push('As the ruling party leader, they will also become Prime Minister.');
    }
    if (!confirm(confirmLines.join('\n'))) return;

    isAppointing = true;
    const btn = document.querySelector('.pl-appoint-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Appointing...'; }

    try {
        const currentTick = currentShard?.current_tick || 0;

        // Deduct AP if cost > 0
        if (candidate.apCost > 0) {
            await deductAP(_supabase, currentFaction.id, candidate.apCost);
        }

        // Update faction with new leader data
        const updateFields = {
            leader_first_name: candidate.firstName,
            leader_last_name: candidate.lastName,
            leader_age: candidate.age,
            electability: candidate.electability,
            leader_ideology: candidate.ideology || null,
            leader_positive_traits: candidate.positiveTraits || [],
            leader_negative_traits: candidate.negativeTraits || [],
        };

        const { error: updateErr } = await _supabase.from('factions').update(updateFields).eq('id', currentFaction.id);
        if (updateErr) throw new Error('Failed to update faction: ' + updateErr.message);

        // If this faction is the ruling party (parliamentary), update PM records
        // so the new leader becomes PM with a fresh trait
        const isRulingParty = currentNation.ruling_faction_id === currentFaction.id;
        const isParliamentary = !isPresidentialRepublic(currentNation) && !isAutocracy(currentNation);
        if (isRulingParty && isParliamentary) {
            const newTraitKey = PM_TRAIT_KEYS[Math.floor(Math.random() * PM_TRAIT_KEYS.length)];
            const leaderAge = candidate.age || (35 + Math.floor(Math.random() * 16));
            const pmFullName = `${candidate.firstName} ${candidate.lastName}`;

            // Update head_of_government record
            const { error: hogErr } = await _supabase.from('head_of_government')
                .update({
                    first_name: candidate.firstName,
                    last_name: candidate.lastName,
                    age: leaderAge,
                    trait_key: newTraitKey,
                    appointed_tick: currentTick
                })
                .eq('nation_id', currentNation.id)
                .eq('active', true);
            if (hogErr) console.warn('Failed to update head_of_government (non-blocking):', hogErr.message);

            // Update PM ministry row
            const { error: minErr } = await _supabase.from('ministries')
                .update({
                    minister_first_name: candidate.firstName,
                    minister_last_name: candidate.lastName,
                    minister_age: leaderAge
                })
                .eq('nation_id', currentNation.id)
                .eq('ministry_key', 'prime_minister')
                .eq('is_active', true);
            if (minErr) console.warn('Failed to update PM ministry (non-blocking):', minErr.message);

            // Update administration record
            const { error: admErr } = await _supabase.from('administrations')
                .update({
                    prime_minister: pmFullName,
                    admin_name: `${candidate.lastName} Administration`,
                    updated_at: new Date().toISOString()
                })
                .eq('nation_id', currentNation.id)
                .is('ended_at_tick', null);
            if (admErr) console.warn('Failed to update administration (non-blocking):', admErr.message);

            // Apply trait on_appoint_stability effect (matches autoAppointPartyLeaderAsPM)
            try {
                const { data: trait } = await _supabase.from('leader_traits').select('effects').eq('trait_key', newTraitKey).single();
                if (trait?.effects?.on_appoint_stability) {
                    const newStability = Math.max(0, Math.min(100, (currentNation.stability || 50) + trait.effects.on_appoint_stability));
                    await _supabase.from('nations').update({ stability: newStability }).eq('id', currentNation.id);
                }
            } catch (e) { console.warn('PM trait stability effect failed (non-blocking):', e); }

            // Fire pm_appointed system event so other players see the PM change
            try {
                await _supabase.rpc('fire_system_event', {
                    p_trigger_key: 'pm_appointed',
                    p_nation_id: currentNation.id,
                    p_tick: currentTick,
                    p_placeholders: {
                        nation: currentNation.name || '',
                        pm_name: pmFullName,
                        party: currentFaction.faction_name,
                        trait: newTraitKey
                    }
                });
            } catch (e) { console.warn('PM appointed event fire failed (non-blocking):', e); }

            console.log(`Ruling party leader change → PM updated: ${pmFullName} (trait: ${newTraitKey})`);
        }

        // Log event
        const oldLeader = currentLeaders.leader;
        const eventDescription = oldLeader
            ? `${candidate.firstName} ${candidate.lastName} replaces ${oldLeader.firstName} ${oldLeader.lastName} as Party Leader of ${currentFaction.faction_name}.`
            : `${candidate.firstName} ${candidate.lastName} appointed as Party Leader of ${currentFaction.faction_name}.`;

        await _supabase.from('event_log').insert({
            nation_id: currentNation.id,
            event_name: 'New Party Leader',
            description_chosen: eventDescription,
            category: 'POLITICAL',
            fired_at_tick: currentTick,
        }).then(({ error }) => {
            if (error) console.warn('Event log insert failed (non-blocking):', error.message);
        });

        // Update local state
        const leaderState = {
            firstName: candidate.firstName,
            lastName: candidate.lastName,
            age: candidate.age,
            ideology: candidate.ideology,
            positiveTraits: candidate.positiveTraits,
            negativeTraits: candidate.negativeTraits,
        };
        if (candidate.electability != null) leaderState.electability = candidate.electability;
        currentLeaders.leader = leaderState;

        // Generate fresh candidates for this role and persist to DB
        const nationName = currentNation.name || '';
        const newCandidates = generateLeadershipCandidates(nationName, getNationNames, 3, 'leader');
        await persistCandidates(currentFaction.id, 'leader', newCandidates);

        candidatesByRole.leader = newCandidates;

        // Prepend the newly appointed leader as current (0 cost)
        const currentEntry = buildCurrentCandidateEntry();
        if (currentEntry) candidatesByRole.leader.unshift(currentEntry);

        selectedIndex.leader = 0; // Select the current leader
        render();

        alert(`${candidate.firstName} ${candidate.lastName} has been appointed as Party Leader!`);

    } catch (e) {
        alert('Error: ' + e.message);
        if (btn) { btn.disabled = false; btn.textContent = `Appoint Party Leader`; }
    } finally {
        isAppointing = false;
    }
};

</script>

</body>
</html>
