<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Army Operations | Nationhood Alpha</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #0e0e0c; --bg-2: #1a1a17; --bg-card: #1a1a17;
  --text-bright: #f0efe6; --text-primary: #c4c2b8; --text-secondary: #888;
  --text-dim: #4a4940; --border-0: rgba(255,255,255,0.06);
  --border-1: rgba(255,255,255,0.08); --army: #b6533f;
  --font-mono: 'JetBrains Mono', monospace; --font-sans: 'IBM Plex Sans', sans-serif;
  --font-serif: 'IBM Plex Serif', serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg-0); color: var(--text-primary); font-family: var(--font-sans); }
.ao-wrap { max-width: 1160px; margin: 0 auto; padding: 22px 24px 60px; }
.ao-subtabs { display: flex; gap: 26px; border-bottom: 1px solid var(--border-1); margin-bottom: 26px; }
.ao-subtab { background: none; border: 0; color: var(--text-dim); font-family: var(--font-mono);
  font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
  padding: 0 0 12px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color .12s, border-color .12s; }
.ao-subtab:hover { color: var(--text-secondary); }
.ao-subtab.is-sel { color: var(--text-bright); border-bottom-color: var(--army); }
.ao-head { margin-bottom: 28px; }
.ao-head__eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.22em;
  color: var(--army); font-weight: 700; text-transform: uppercase; }
.ao-head__title { font-size: 30px; font-weight: 700; color: var(--text-bright); margin-top: 8px;
  letter-spacing: -0.01em; }
.ao-head__title em { font-family: var(--font-serif); font-style: italic; font-weight: 600; }
.ao-empty { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim);
  padding: 30px 22px; text-align: center; background: var(--bg-card);
  border: 1px solid var(--border-0); }
.ao-loading { padding: 60px; text-align: center; font-family: var(--font-mono);
  font-size: 12px; color: var(--text-dim); }
</style>
</head>
<body>
  <div id="mil-topbar-host"></div>
  <div class="ao-wrap" id="ao-root">
    <div class="ao-loading">Loading operations…</div>
  </div>

<script type="module">
import { bootstrapArmyPage } from './js/army-page.js';
import { renderOrderOfBattle } from './js/create-unit.js';

const OPS_FACTION_COLS = 'id, faction_type, faction_name, nation_id, abandoned_at, is_banned, branch, army_manpower';
let _faction = null, _shard = null;

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// Two subtabs. The big serif-accented title is driven by the active
// one. Both bodies are intentionally empty scaffolding for now —
// Order of Battle and Conflict get built out in later passes.
const SUBTABS = [
  { key: 'oob',      label: 'Order of Battle', titlePlain: 'Order of ', titleAccent: 'Battle',
    empty: 'No order of battle established yet.' },
  { key: 'conflict', label: 'Conflict',        titlePlain: '',          titleAccent: 'Conflict',
    empty: 'No active conflicts.' },
];

let _subtab = 'oob';

function render() {
  const root = document.getElementById('ao-root');
  if (!root) return;
  const sel = SUBTABS.find(t => t.key === _subtab) || SUBTABS[0];

  const subtabsHtml = SUBTABS.map(t =>
    `<button class="ao-subtab${t.key === _subtab ? ' is-sel' : ''}" data-subtab="${esc(t.key)}">${esc(t.label)}</button>`
  ).join('');

  root.innerHTML = `
    <div class="ao-subtabs">${subtabsHtml}</div>
    <div class="ao-head">
      <div class="ao-head__eyebrow">— Operations —</div>
      <div class="ao-head__title">${esc(sel.titlePlain)}<em>${esc(sel.titleAccent)}</em></div>
    </div>
    ${sel.key === 'oob' ? '<div id="oob-host"></div>' : `<div class="ao-empty">${esc(sel.empty)}</div>`}`;

  root.querySelectorAll('[data-subtab]').forEach(btn => {
    btn.addEventListener('click', () => {
      _subtab = btn.getAttribute('data-subtab');
      render();
    });
  });

  if (_subtab === 'oob') {
    renderOrderOfBattle(_faction, _shard, document.getElementById('oob-host'));
  }
}

async function init() {
  const ctx = await bootstrapArmyPage({ activeTab: 'operations', factionSelect: OPS_FACTION_COLS });
  if (!ctx) return; // bootstrap already redirected
  _faction = ctx.faction;
  _shard = ctx.shard;
  render();
}

init().catch(err => {
  console.error('army-operations init failed:', err);
  const root = document.getElementById('ao-root');
  if (root) root.innerHTML = '<div class="ao-loading">Failed to load operations.</div>';
});
</script>
</body>
</html>
