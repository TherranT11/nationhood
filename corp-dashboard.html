<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corporate Dashboard | Nationhood</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/corp-topbar.css">
<link rel="stylesheet" href="css/corp-light-theme.css">
<style>
/* ──────────────────────────────────────────────────────────
   CORP DASHBOARD — REDESIGN
   Scoped under body.corp-redesign so the .cr-* rules don't
   leak. Uses the existing site palette (--bg-*, --text-*,
   --green/red/amber/etc.) and IBM Plex Sans/Serif + JetBrains
   Mono fonts to match corp-operations-finance.html and the
   other corp pages. Light-mode overrides included so the
   theme toggle on corp-topbar works here too.
   ────────────────────────────────────────────────────────── */
body.corp-redesign {
  --bg-0: #0e0e0c;
  --bg-1: #1a1a1a;
  --bg-2: #1a1a17;
  --bg-3: #252525;
  --bg-4: #24241f;
  --bg-5: #2c2c26;
  --bg-hover: #282822;
  --bg-card: #1a1a17;
  --bg-panel: #252525;
  --panel-main: #1f1f1a;
  --panel-border: rgba(255,255,255,0.08);
  --text-bright: #f0efe6;
  --text-primary: #c4c2b8;
  --text-secondary: #888;
  --text-muted: #666;
  --text-dim: #4a4940;
  --text-ghost: #333229;
  --border-hair: rgba(255,255,255,0.04);
  --border-0: rgba(255,255,255,0.06);
  --border-1: rgba(255,255,255,0.08);
  --border-2: rgba(255,255,255,0.12);
  --green: #5cb85c;
  --green-border: rgba(92,184,92,0.30);
  --red: #d9534f;
  --red-border: rgba(217,83,79,0.30);
  --amber: #c8a832;
  --amber-faint: rgba(200,168,50,0.08);
  --amber-border: rgba(200,168,50,0.20);
  --gold: #c8a832;
  --orange: #e8724a;
  --blue: #5bc0de;
  --teal: #5aafa5;

  --font-mono:  'JetBrains Mono', monospace;
  --font-sans:  'IBM Plex Sans', sans-serif;
  --font-serif: 'IBM Plex Serif', serif;

  background: var(--bg-0);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.45;
  margin: 0;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
body.corp-redesign * { box-sizing: border-box; }

body.corp-redesign.light-mode {
  --bg-card: #ffffff;
  --bg-panel: #faf9f5;
  --panel-main: #f8f7f2;
  --panel-border: #e8e7e0;
  --bg-0: #faf9f5;
  --bg-3: #f0eee6;
  --border-hair: #e8e7e0;
  --border-1: #e0dfd6;
  --text-bright: #1a1a17;
  --text-primary: #2d2d28;
  --text-secondary: #555550;
  --text-muted: #6a6660;
  --text-dim: #888880;
}

.cr-loading {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-dim);
  text-align: center;
  padding: 80px 20px;
}

.cr-layout {
  max-width: 1440px;
  margin: 0 auto;
  padding: 22px 22px 56px;
}

/* ── MASTHEAD ── */
.cr-masthead {
  display: grid;
  grid-template-columns: auto 1fr auto;  /* logo | identity | ticker */
  gap: 28px;
  align-items: end;
  padding-bottom: 22px;
  border-bottom: 1px solid var(--border-0);
  margin-bottom: 24px;
}
body.corp-redesign.light-mode .cr-masthead { border-bottom-color: var(--panel-border); }

/* Corp logo block — shows custom_logo_url when present, otherwise the
   first two characters of the ticker as a fallback monogram. Sized to
   sit visually balanced against the 52px serif corp name. */
.cr-corp-logo {
  width: 96px;
  height: 96px;
  border-radius: 4px;
  background: var(--bg-3);
  border: 1px solid var(--border-1);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
  margin-bottom: 6px; /* aligns visual baseline with the meta row */
}
body.corp-redesign.light-mode .cr-corp-logo {
  background: var(--bg-panel);
  border-color: var(--panel-border);
}
.cr-corp-logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.cr-corp-logo-monogram {
  font-family: var(--font-mono);
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--text-dim);
}

.cr-masthead-eyebrow {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.20em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 12px;
}
.cr-corp-name {
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: 52px;
  line-height: 0.96;
  letter-spacing: -0.01em;
  color: var(--text-bright);
  margin: 0 0 14px;
}
.cr-corp-name em {
  font-style: italic;
  color: var(--gold);
  font-weight: 500;
}
.cr-corp-meta {
  display: flex;
  gap: 20px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  flex-wrap: wrap;
}
.cr-corp-meta strong {
  color: var(--text-bright);
  font-weight: 600;
}

.cr-ticker-block {
  text-align: right;
  border-left: 1px solid var(--border-0);
  padding-left: 28px;
  min-width: 200px;
}
body.corp-redesign.light-mode .cr-ticker-block { border-left-color: var(--panel-border); }
.cr-ticker-symbol {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.16em;
  color: var(--text-dim);
  margin-bottom: 8px;
}
.cr-ticker-price {
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: 34px;
  color: var(--text-bright);
  line-height: 1;
  margin-bottom: 5px;
  font-variant-numeric: tabular-nums;
}
.cr-ticker-change {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
}
.cr-ticker-change.positive { color: var(--green); }
.cr-ticker-change.negative { color: var(--red); }

/* ── MAIN GRID ── */
.cr-main-grid {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 22px;
}

/* ── PANEL (matches fin-card pattern from other corp pages) ── */
.cr-panel {
  background: var(--bg-card);
  border: 1px solid var(--border-1);
  display: flex;
  flex-direction: column;
}
body.corp-redesign.light-mode .cr-panel { border-color: var(--panel-border); }
/* Bespoke gold corner ticks from the original mockup are dropped — the
   dot-header pattern below replaces them. */
.cr-panel-corner { display: none; }

.cr-panel-header,
.cr-event-panel-header {
  background: var(--bg-3);
  border-bottom: 1px solid var(--border-hair);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
body.corp-redesign.light-mode .cr-panel-header,
body.corp-redesign.light-mode .cr-event-panel-header {
  background: var(--bg-panel);
  border-bottom-color: var(--panel-border);
}
.cr-panel-title {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 8px;
}
.cr-panel-title::before {
  content: '●';
  font-size: 8px;
  color: var(--gold);
}
.cr-panel-meta {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.cr-placeholder {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 0.04em;
  padding: 28px 16px;
  text-align: center;
  font-style: italic;
}
.cr-placeholder strong {
  color: var(--gold);
  font-weight: 600;
}

/* ── STATS SECTION (right column) ── */
.cr-stats-section {
  display: flex;
  flex-direction: column;
  gap: 22px;
}
.cr-section-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 12px;
}
.cr-section-header h2 {
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: 22px;
  color: var(--text-bright);
  margin: 0;
}
.cr-section-header h2 .num {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--gold);
  margin-right: 10px;
  letter-spacing: 0.06em;
  vertical-align: middle;
}
.cr-section-header .desc {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-dim);
}

/* ── FINANCIAL ROW ── */
.cr-financial-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.cr-fin-card {
  background: var(--bg-card);
  border: 1px solid var(--border-1);
  padding: 14px 14px 12px;
  position: relative;
  overflow: hidden;
}
body.corp-redesign.light-mode .cr-fin-card { border-color: var(--panel-border); }
.cr-fin-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 24px; height: 1px;
  background: var(--gold);
}
.cr-fin-card-label {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
}
.cr-fin-card-value {
  font-family: var(--font-serif);
  font-size: 26px;
  font-weight: 500;
  color: var(--text-bright);
  line-height: 1;
  margin-bottom: 6px;
  font-variant-numeric: tabular-nums;
}
.cr-fin-currency {
  font-family: var(--font-sans);
  font-size: 12px;
  color: var(--text-dim);
  font-weight: 400;
  margin-right: 1px;
  vertical-align: top;
  line-height: 26px;
}
.cr-fin-suffix {
  font-size: 14px;
  color: var(--text-dim);
}
.cr-fin-card-trend {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 0.04em;
  min-height: 13px;
}
.cr-fin-card-trend.positive { color: var(--green); }
.cr-fin-card-trend.negative { color: var(--red); }

/* Expandable fin cards: cursor + hover chrome on the four cards. */
.cr-fin-card.is-expandable { cursor: pointer; }
.cr-fin-card.is-expandable:hover { border-color: var(--border-2, var(--border-1)); }
.cr-fin-card-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.cr-fin-card-chevron {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  transition: transform 0.15s ease;
}
.cr-fin-card.is-expanded .cr-fin-card-chevron {
  transform: rotate(180deg);
}
.cr-fin-card-expansion {
  display: none;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed var(--border-1);
  font-family: var(--font-mono);
  font-size: 9px;
}
.cr-fin-card.is-expanded .cr-fin-card-expansion {
  display: block;
}
.cr-fin-card-expansion-tick + .cr-fin-card-expansion-tick {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border-hair, rgba(255,255,255,0.04));
}
.cr-fin-card-expansion-tick-label {
  font-size: 8px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 4px;
}
.cr-fin-card-expansion-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 2px 0;
}
.cr-fin-card-expansion-group + .cr-fin-card-expansion-group {
  margin-top: 6px;
}
.cr-fin-card-expansion-group-head {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 4px 0 2px;
  border-bottom: 1px solid var(--border-hair, rgba(255,255,255,0.04));
  margin-bottom: 2px;
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-secondary);
}
.cr-fin-card-expansion-empty {
  font-style: italic;
  color: var(--text-dim);
  text-align: center;
  padding: 6px 0 2px;
}
.cr-sparkline {
  margin-top: 8px;
  height: 22px;
  width: 100%;
  opacity: 0.6;
  display: block;
}
.cr-sparkline-empty {
  margin-top: 8px;
  height: 22px;
  display: flex;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-dim);
  letter-spacing: 0.04em;
  font-style: italic;
  opacity: 0.7;
}

/* ── OPERATING INDICATORS ── */
.cr-perf-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--border-1);
  border: 1px solid var(--border-1);
}
body.corp-redesign.light-mode .cr-perf-grid {
  background: var(--panel-border);
  border-color: var(--panel-border);
}
.cr-perf-card {
  background: var(--bg-card);
  padding: 18px 20px;
  position: relative;
}
.cr-perf-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 12px;
}
.cr-perf-name {
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: 16px;
  color: var(--text-bright);
  letter-spacing: -0.005em;
}
.cr-perf-value {
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 19px;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
}
.cr-perf-value .cr-max {
  color: var(--text-dim);
  font-size: 11px;
  font-weight: 400;
}
.cr-perf-meter {
  display: flex;
  gap: 3px;
  margin-bottom: 10px;
}
.cr-perf-meter-cell {
  flex: 1;
  height: 7px;
  background: var(--bg-3);
  border: 1px solid var(--border-1);
}
body.corp-redesign.light-mode .cr-perf-meter-cell {
  background: var(--bg-panel);
  border-color: var(--panel-border);
}
.cr-perf-meter-cell.filled {
  background: var(--gold);
  border-color: var(--gold);
}
.cr-perf-meter-cell.filled.warn {
  background: var(--red);
  border-color: var(--red);
}
.cr-perf-meter-cell.filled.good {
  background: var(--green);
  border-color: var(--green);
}
.cr-perf-desc {
  font-size: 11px;
  line-height: 1.5;
  color: var(--text-secondary);
  font-family: var(--font-sans);
}
.cr-perf-desc strong {
  color: var(--text-bright);
  font-weight: 500;
}
/* ── OWNERSHIP CARD (renders inside the perf grid) ── */
.cr-ownership-bar {
  display: flex;
  height: 8px;
  margin-bottom: 14px;
  background: var(--bg-3);
  border: 1px solid var(--border-1);
}
body.corp-redesign.light-mode .cr-ownership-bar {
  background: var(--bg-panel);
  border-color: var(--panel-border);
}
.cr-ownership-bar > div { transition: opacity 0.15s; }
.cr-ownership-bar > div:hover { opacity: 0.75; }
.cr-ownership-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 0;
  padding: 0;
}
.cr-ownership-list li {
  display: grid;
  grid-template-columns: 8px 1fr auto;
  gap: 10px;
  align-items: center;
  font-size: 11px;
  line-height: 1;
}
.cr-ownership-swatch { width: 8px; height: 8px; border-radius: 1px; }
.cr-ownership-name {
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 11px;
}
.cr-ownership-pct {
  font-family: var(--font-mono);
  font-weight: 600;
  color: var(--text-bright);
  font-variant-numeric: tabular-nums;
  font-size: 11px;
}
.cr-you-tag {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 5px;
  background: var(--gold);
  color: var(--bg-0);
  font-family: var(--font-mono);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.08em;
  border-radius: 1px;
  vertical-align: middle;
}
.cr-ownership-empty {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  font-style: italic;
  padding: 8px 0;
}

/* ── DISPATCHES FEED ── */
.cr-event-tab-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-hair);
  flex-wrap: wrap;
}
body.corp-redesign.light-mode .cr-event-tab-row { border-bottom-color: var(--panel-border); }
.cr-event-tab-bar {
  display: flex;
  gap: 0;
}
.cr-event-tab {
  background: transparent;
  border: 1px solid var(--border-1);
  padding: 4px 9px;
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s;
  border-right: none;
}
body.corp-redesign.light-mode .cr-event-tab { border-color: var(--panel-border); }
.cr-event-tab:last-child { border-right: 1px solid var(--border-1); }
body.corp-redesign.light-mode .cr-event-tab:last-child { border-right-color: var(--panel-border); }
.cr-event-tab:hover:not(.active) {
  color: var(--text-secondary);
  background: var(--bg-3);
}
body.corp-redesign.light-mode .cr-event-tab:hover:not(.active) { background: var(--bg-panel); }
.cr-event-tab.active {
  color: var(--bg-0);
  background: var(--gold);
  border-color: var(--gold);
}
.cr-event-tab.active + .cr-event-tab { border-left-color: var(--gold); }

.cr-event-list {
  list-style: none;
  margin: 0;
  padding: 0 14px;
  display: flex;
  flex-direction: column;
  max-height: 720px;
  overflow-y: auto;
}
.cr-event-list::-webkit-scrollbar { width: 4px; }
.cr-event-list::-webkit-scrollbar-track { background: transparent; }
.cr-event-list::-webkit-scrollbar-thumb { background: var(--border-1); border-radius: 2px; }
.cr-event-item {
  padding: 12px 0;
  border-bottom: 1px solid var(--border-hair);
  position: relative;
}
body.corp-redesign.light-mode .cr-event-item { border-bottom-color: var(--panel-border); }
.cr-event-item:last-child { border-bottom: none; }
.cr-event-item::before {
  content: '';
  position: absolute;
  left: -14px; top: 0; bottom: 0;
  width: 2px;
  background: transparent;
}
.cr-event-item.cat-politics::before  { background: var(--blue);  opacity: 0.6; }
.cr-event-item.cat-corporate::before { background: var(--gold);  opacity: 0.6; }
.cr-event-item.cat-military::before  { background: var(--red);   opacity: 0.6; }

.cr-event-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
  gap: 8px;
}
.cr-event-tag {
  font-family: var(--font-mono);
  font-size: 8.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 2px 6px;
  border: 1px solid var(--border-1);
  color: var(--text-muted);
  background: var(--bg-3);
}
body.corp-redesign.light-mode .cr-event-tag { background: var(--bg-panel); border-color: var(--panel-border); }
.cr-event-tag.tag-politics {
  color: var(--blue);
  border-color: rgba(91,192,222,0.35);
  background: rgba(91,192,222,0.08);
}
.cr-event-tag.tag-corporate {
  color: var(--gold);
  border-color: var(--amber-border);
  background: var(--amber-faint);
}
.cr-event-tag.tag-military {
  color: var(--red);
  border-color: var(--red-border);
  background: rgba(217,83,79,0.08);
}
.cr-event-nation {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-dim);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.cr-event-flag {
  width: 14px;
  height: 9px;
  object-fit: cover;
  border-radius: 1px;
  flex-shrink: 0;
}
.cr-event-time {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-dim);

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { escapeHtml, escapeAttr, tickToDate } from './js/utils.js';
import { computeCorpValuation } from './js/game/corp-valuation.js';
import { amortizedMonthlyPayment } from './js/game/loan-math.js';

// Balance-sheet categories excluded from P&L per the corp_cash_events
// schema. SSoT: sql/migrations/20260701_corp_cash_events_table.sql:36-38.
const CAPITAL_CATEGORIES = new Set(['capital_in', 'capital_out', 'debt_principal']);

let faction = null;
let nation = null;
let _ownedProperties = [];
let shard = null;
let allUserFactions = [];

// Dispatches feed state — one cache slot per (category, scope) combination
// so re-clicking a tab is instant after the first fetch. Reset on page load.
const _eventState = {
    category: 'politics',  // 'politics' | 'corporate' | 'military'
    scope:    'nation',    // 'nation'   | 'world'
    cache:    {},          // key = `${category}:${scope}` -> array of rows
    inflight: null,        // current fetch's key, to ignore stale resolutions
};

function fmtMoney(n) {
    const num = Number(n) || 0;
    const sign = num < 0 ? '-' : '';
    const abs = Math.abs(num);
    if (abs >= 1e9) return sign + '$' + (abs / 1e9).toFixed(2) + 'B';
    if (abs >= 1e6) return sign + '$' + (abs / 1e6).toFixed(2) + 'M';
    if (abs >= 1e3) return sign + '$' + (abs / 1e3).toFixed(1) + 'k';
    return sign + '$' + Math.round(abs).toLocaleString();
}

// Split a money value into ($)(value)(suffix) for the masthead/fin-card
// styling that wants the dollar sign and unit suffix smaller than the
// numeric portion.
function fmtMoneyParts(n) {
    const num = Number(n) || 0;
    const sign = num < 0 ? '-' : '';
    const abs = Math.abs(num);
    if (abs >= 1e9)  return { sign, value: (abs / 1e9).toFixed(1), suffix: 'B' };
    if (abs >= 1e6)  return { sign, value: (abs / 1e6).toFixed(1), suffix: 'M' };
    if (abs >= 1e3)  return { sign, value: (abs / 1e3).toFixed(1), suffix: 'k' };
    return { sign, value: Math.round(abs).toLocaleString(), suffix: '' };
}

function renderMoneyHtml(n) {
    const { sign, value, suffix } = fmtMoneyParts(n);
    const suffixHtml = suffix ? `<span class="cr-fin-suffix">${suffix}</span>` : '';
    return `<span class="cr-fin-currency">${sign}$</span>${value}${suffixHtml}`;
}

function renderSparklineSvg(series, colorVar) {
    // null series = "this card has no historical series at all" (e.g. debt
    // isn't tracked per tick). Render nothing so the card is not visually
    // cluttered with a meaningless empty state.
    if (series === null) return '';
    if (!Array.isArray(series) || series.length < 2) {
        return '<div class="cr-sparkline-empty">— no history yet</div>';
    }
    const w = 120, h = 24;
    let min = Infinity, max = -Infinity;
    for (const v of series) {
        const n = Number(v);
        if (Number.isFinite(n)) {
            if (n < min) min = n;
            if (n > max) max = n;
        }
    }
    if (!Number.isFinite(min) || !Number.isFinite(max)) {
        return '<div class="cr-sparkline-empty">— no history yet</div>';
    }
    const range = max - min;
    const points = series.map((v, i) => {
        const x = (i / (series.length - 1)) * w;
        // When all values are equal (range=0), draw a flat line in the
        // middle of the viewBox rather than at the bottom (the previous
        // `range || 1` fallback caused the divisor to be 1, but the
        // numerator (v - min) was always 0, pinning every point to y=h).
        const y = range === 0 ? h / 2 : h - ((Number(v) - min) / range) * h;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    return `<svg class="cr-sparkline" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <polyline points="${points}" fill="none" stroke="${colorVar}" stroke-width="1.2"/>
    </svg>`;
}

// tickToDate returns 'MMM, YYYY' (e.g. 'Mar, 2026'). Pull just the
// 4-digit year for "Founded 1924" style display in the masthead meta
// row. Use a regex match instead of split/trim so a future format
// change (different separator, missing space, etc.) degrades to the
// full date string rather than silently displaying an empty token.
function tickToYear(tick) {
    if (tick == null) return null;
    const formatted = tickToDate(tick) || '';
    const match = formatted.match(/(\d{4})/);
    return match ? match[1] : formatted;
}

// Italicize the last word of the corp name in accent-gold for the masthead
// display (matches the mockup's "Volkov *Industries*" treatment).
function renderCorpNameHtml(name) {
    if (!name) return 'Unnamed Corporation';
    const trimmed = name.trim();
    if (!trimmed) return 'Unnamed Corporation';
    const parts = trimmed.split(/\s+/);
    if (parts.length === 1) {
        return `<em>${escapeHtml(parts[0])}</em>`;
    }
    const last = parts.pop();
    return `${escapeHtml(parts.join(' '))} <em>${escapeHtml(last)}</em>`;
}

async function init() {
    const { data: { user } } = await _supabase.auth.getUser();
    if (!user) { window.location.href = 'login.html'; return; }

    // Inspector-mode override (?faction_id= for admin impersonation).
    const url = new URL(location.href);
    const inspectFactionId = url.searchParams.get('faction_id');

    // User's own factions (primary id match OR linked secondary corp).
    const { data: ownedFactions, error: factionsErr } = await _supabase
        .from('factions')
        .select('*')
        .or(`id.eq.${user.id},linked_user_id.eq.${user.id}`);

    if (factionsErr) {
        showFatal('Failed to load factions: ' + factionsErr.message);
        return;
    }
    allUserFactions = (ownedFactions || []).filter(f => f.nation_id || f.faction_type === 'entrepreneur'); // entrepreneur is nation-agnostic (nation_id null)

    // Pick the active corp: ?faction_id= override, then sessionStorage
    // hint (set by the faction switcher), then any user-owned corp.
    // Persist the final pick to sessionStorage so the topbar's plain
    // <a href> nav into sector pages (airline-operations, aviation-
    // operations, etc.) finds the right corp instead of falling back
    // to user.id and bouncing.
    if (inspectFactionId) {
        const { data: inspected, error: inspectErr } = await _supabase
            .from('factions').select('*').eq('id', inspectFactionId).single();
        if (inspectErr || !inspected) {
            showFatal('Inspector faction not found.');
            return;
        }
        faction = inspected;
    } else {
        const hintedId = sessionStorage.getItem('active_faction_id');
        const hinted = hintedId
            ? allUserFactions.find(f => f.id === hintedId && f.faction_type === 'corporation')
            : null;
        faction = hinted || allUserFactions.find(f => f.faction_type === 'corporation');
    }

    if (!faction || faction.faction_type !== 'corporation') {
        showFatal('No corporation linked to this account.');
        return;
    }
    sessionStorage.setItem('active_faction_id', faction.id);

    // Shard + nation + per-tick P&L (corp_cash_events) + cash_end history
    // (corp_cash_history) + ownership in parallel. Phase 3 reads P&L from
    // corp_cash_events (the SSoT). cash_end stays on corp_cash_history
    // until Phase 4 retires the legacy aggregate tables.
    const HISTORY_TICKS = 12;
    const [shardRes, nationRes, eventsRes, cashHistRes, ownershipRes, debtRes] = await Promise.all([
        _supabase.from('shard')
            .select('current_tick, current_date, name, next_tick_at, tick_interval_hours')
            .eq('name', 'Alpha Shard').single(),
        faction.nation_id
            ? _supabase.from('nations')
                .select('id, name, capital')
                .eq('id', faction.nation_id).single()
            : Promise.resolve({ data: null, error: null }),
        // Pull category + label so the expandable Revenue / Costs cards can
        // show per-event detail in addition to the per-tick aggregates.
        _supabase.from('corp_cash_events')
            .select('tick, category, label, delta')
            .eq('corp_id', faction.id)
            .order('tick', { ascending: false })
            .limit(HISTORY_TICKS * 30),  // ~30 events / tick is the practical ceiling
        _supabase.from('corp_cash_history')
            .select('tick, cash_end')
            .eq('faction_id', faction.id)
            .order('tick', { ascending: false })
            .limit(HISTORY_TICKS),
        _supabase.from('corp_ownership')
            .select('holder_type, holder_id, pct')
            .eq('corp_id', faction.id)
            .order('pct', { ascending: false }),
        // Active bank_loans drive the Outstanding Debt card's expanded
        // detail. Only loans the corp BORROWED — paid-off loans are
        // excluded by the status filter.
        _supabase.from('bank_loans')
            .select('id, principal, outstanding, apr, term_ticks, status, issued_at_tick, matures_at_tick, lender_faction_id, factions:lender_faction_id(faction_name, abbreviation)')
            .eq('borrower_faction_id', faction.id)
            .in('status', ['pending_payout', 'active'])
            .order('issued_at_tick', { ascending: false }),
    ]);
    if (shardRes.error) {
        showFatal('Failed to load shard: ' + shardRes.error.message);
        return;
    }
    shard = shardRes.data;
    nation = nationRes?.data || null;
    if (nationRes?.error) {
        console.error('[corp-dashboard] nation fetch error:', nationRes.error.message);
    }
    if (eventsRes?.error) {
        console.error('[corp-dashboard] corp_cash_events fetch error:', eventsRes.error.message);
    }
    if (cashHistRes?.error) {
        console.error('[corp-dashboard] corp_cash_history fetch error:', cashHistRes.error.message);
    }
    if (ownershipRes?.error) {
        console.error('[corp-dashboard] corp_ownership fetch error:', ownershipRes.error.message);
    }
    if (debtRes?.error) {
        console.error('[corp-dashboard] bank_loans fetch error:', debtRes.error.message);
    }
    const activeLoans = debtRes?.data || [];
    // Aggregate cash events into per-tick {profit, events} buckets.
    // profit = signed sum of P&L-only deltas. Balance-sheet flows
    // (CAPITAL_CATEGORIES) are excluded from the profit total per the
    // corp_cash_events schema comment
    // (sql/migrations/20260701_corp_cash_events_table.sql:36-38) but are
    // retained in the events array so renderProfitExpansion can list them
    // under their own Capital Movements group.
    const byTick = new Map();
    for (const e of (eventsRes?.data || [])) {
        const t = Number(e.tick);
        const d = Number(e.delta) || 0;
        const bucket = byTick.get(t) || { profit: 0, events: [] };
        if (!CAPITAL_CATEGORIES.has(e.category)) {
            bucket.profit += d;
        }
        bucket.events.push({ category: e.category, label: e.label, delta: d });
        byTick.set(t, bucket);
    }
    const cashByTick = new Map((cashHistRes?.data || []).map(r => [Number(r.tick), Number(r.cash_end)]));

    // Build oldest-first {tick, profit, events, cash_end} array. Use the
    // union of ticks present in either source so quiet ticks (cash but no
    // events, or events but no cash snapshot) still appear with the
    // missing fields filled in as 0 / null / [].
    const allTicks = new Set([...byTick.keys(), ...cashByTick.keys()]);
    const pnlHistory = [...allTicks].sort((a, b) => a - b).map(t => ({
        tick:     t,
        profit:   byTick.get(t)?.profit ?? 0,
        events:   byTick.get(t)?.events ?? [],
        cash_end: cashByTick.get(t)     ?? null,
    }));
    const ownership = ownershipRes?.data || [];

    // Mount the shared corp topbar.
    const topbarContainer = document.getElementById('corp-topbar-container');
    if (topbarContainer) {
        try {
            const { renderCorpTopBar } = await import('./js/corp-topbar.js');
            renderCorpTopBar(topbarContainer, {
                faction, shard, activeTab: 'home', allUserFactions,
            });
        } catch (e) {
            console.error('[corp-dashboard] topbar render failed:', e);
        }
    }

    // Load active properties so the masthead valuation includes the
    // National HQ + any other holdings. The HQ is a real corp_properties
    // row now (20260711_persist_national_hq.sql) so a flat select is
    // enough — no synthetic-row helper needed.
    try {
        const { data: props } = await _supabase
            .from('corp_properties')
            .select('*')
            .eq('faction_id', faction.id)
            .eq('is_active', true);
        _ownedProperties = props || [];
    } catch (err) {
        console.warn('[corp-dashboard] property fetch failed:', err?.message);
        _ownedProperties = [];
    }

    renderMasthead(pnlHistory);
    renderFinancialRow(pnlHistory, activeLoans);
    renderOperatingIndicators(ownership, user.id);
    renderFooter();
    bindDispatchTabs();
    loadDispatches();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('page-content').style.display = '';

    // Loan negotiations: deep-link auto-mount only. Borrower-side
    // entry into negotiations now lives in Pressing Issues on
    // corp-operations.html (banks respond → negotiation appears
    // there). The "+ Negotiate New Loan" picker was removed in the
    // Phase 6 unification.
    try {
        const urlNeg = new URL(location.href).searchParams.get('negotiation');
        if (urlNeg) {
            const lnm = await import('./js/loan-negotiation-modal.js');
            await lnm.mountLoanNegotiationModal({ supabase: _supabase, negotiationId: urlNeg });
        }
    } catch (e) {
        console.warn('[corp-dashboard] loan-negotiation init failed:', e?.message || e);
    }
}

function renderMasthead(history) {
    const sector = faction.corp_sector || 'Unspecified Sector';
    document.getElementById('cr-sector').textContent = `— ${sector} —`;

    // Corp logo: custom upload if present, otherwise ticker-initials monogram.
    const logoEl = document.getElementById('cr-corp-logo');
    const monoEl = document.getElementById('cr-corp-logo-monogram');
    if (logoEl && monoEl) {
        if (faction.custom_logo_url) {
            logoEl.innerHTML = `<img src="${escapeAttr(faction.custom_logo_url)}" alt="${escapeAttr(faction.faction_name || '')}" />`;
        } else {
            const tk = (faction.corp_ticker || faction.abbreviation || '').toUpperCase();
            monoEl.textContent = tk.slice(0, 2) || '—';
        }
    }

    document.getElementById('cr-corp-name').innerHTML =
        renderCorpNameHtml(faction.faction_name);

    document.getElementById('cr-founded').textContent =
        tickToYear(faction.founded_tick) || '—';
    document.getElementById('cr-hq').textContent =
        nation?.capital || nation?.name || '—';
    document.getElementById('cr-ticker-text').textContent =
        faction.corp_ticker || faction.abbreviation || '—';

    const ticker = faction.corp_ticker || faction.abbreviation || '—';
    document.getElementById('cr-ticker-symbol').textContent = ticker;

    // Full valuation = cash + property + vessels − loans (+ finance
    // receivables for Finance corps). Same SSoT helper as actions.html
    // and the server-side bankruptcy / bailout math.
    const cash = Number(faction.corp_cash_reserves) || 0;
    const debt = Number(faction.corp_debt) || 0;
    const valuation = computeCorpValuation({
        cash,
        loans: debt,
        properties: _ownedProperties,
        vessels: [],            // dashboard skips per-vessel detail; equipmentValue falls back to 0
        financeReceivables: [], // ditto for Finance receivables — Phase pickup if needed
        currentTick: shard?.current_tick || 0,
    });
    document.getElementById('cr-ticker-price').textContent = fmtMoney(valuation);

    // Valuation delta vs the prior tick. We don't snapshot debt or asset
    // values per tick, so we approximate prior-tick
    // valuation by swapping cash for prev.cash_end and holding everything
    // else constant.
    const prev = history?.length > 0 ? history[history.length - 1] : null;
    const changeEl = document.getElementById('cr-ticker-change');
    const valuationLabel = 'valuation (cash + assets − debt)';
    if (prev && Number.isFinite(Number(prev.cash_end))) {
        const prevValuation = computeCorpValuation({
            cash: Number(prev.cash_end),
            loans: debt,
            properties: _ownedProperties,
            vessels: [],
            financeReceivables: [],
            currentTick: shard?.current_tick || 0,
        });
        const delta = valuation - prevValuation;
        if (delta === 0) {
            changeEl.textContent = `— unchanged · ${valuationLabel}`;
            changeEl.className = 'cr-ticker-change';
        } else {
            const arrow = delta > 0 ? '▲' : '▼';
            const sign  = delta > 0 ? '+' : '';
            changeEl.textContent = `${arrow} ${sign}${fmtMoney(delta)} · ${valuationLabel}`;
            changeEl.className = 'cr-ticker-change ' + (delta > 0 ? 'positive' : 'negative');
        }
    } else {
        changeEl.textContent = `— ${valuationLabel}`;
        changeEl.className = 'cr-ticker-change';
    }
}

function renderFinancialRow(history, activeLoans) {
    // SSoT: cash + debt come from the live factions row; profit comes
    // from corp_cash_events aggregated per tick (history, built in init).
    // No card recomputes either set — they share these inputs.
    const cash = Number(faction.corp_cash_reserves) || 0;
    const debt = Number(faction.corp_debt)          || 0;
    const currentTick = Number(shard?.current_tick) || 0;

    // The Net Profit card shows the most recent SETTLED tick (tick <
    // currentTick) that actually moved cash. Quiet ticks are skipped so
    // the player doesn't get a stale "$0 — unchanged" card just because
    // nothing happened the moment before they opened the page.
    const settledWithEvents = [...history]
        .filter(h => Number(h.tick) < currentTick && (h.events || []).length > 0)
        .sort((a, b) => Number(b.tick) - Number(a.tick));
    const lastSettled  = settledWithEvents[0] || null;
    const priorSettled = settledWithEvents[1] || null;

    // Cash trend: delta vs the most recent prior cash_end snapshot.
    const prevCashEntry = [...history].reverse()
        .find(h => Number(h.tick) < currentTick && Number.isFinite(Number(h.cash_end)));
    const prevCash = prevCashEntry ? Number(prevCashEntry.cash_end) : null;

    // Sparkline series (oldest-first).
    const cashSeries   = history.map(h => Number(h.cash_end));
    const profitSeries = history.map(h => Number(h.profit));

    // Outstanding-debt trend: surface the next tick's aggregate payment
    // when there are active loans, so the player sees what's about to
    // hit their cash. SSoT amortization formula in js/game/loan-math.js.
    const nextLoanPayment = (activeLoans || [])
        .filter(l => l.status === 'active')
        .reduce((sum, l) => sum + amortizedMonthlyPayment(l.principal, l.apr, l.term_ticks), 0);
    const debtTrend = debt <= 0
        ? '— debt-free'
        : (nextLoanPayment > 0
            ? `Next payment ${fmtMoney(nextLoanPayment)} · next tick`
            : '— outstanding');

    const row = document.getElementById('cr-fin-row');
    if (!row) return;

    row.innerHTML = [
        renderFinCard({
            label: 'Cash',
            value: cash,
            prev: prevCash,
            series: cashSeries,
            colorVar: 'var(--cr-accent-green)',
            invert: false,
            cardId: 'cash',
            // Cash is a balance, not an aggregate. The events that move
            // it live in Net Profit's drill-down — sparkline-only here.
        }),
        renderFinCard({
            label: 'Net Profit (last tick)',
            value: lastSettled  ? Number(lastSettled.profit)  : 0,
            prev:  priorSettled ? Number(priorSettled.profit) : null,
            series: profitSeries,
            colorVar: 'var(--cr-accent-gold)',
            invert: false,
            cardId: 'profit',
            expandedHtml: renderProfitExpansion(lastSettled),
        }),
        renderFinCard({
            label: 'Outstanding Debt',
            value: debt,
            prev: null,
            series: null,
            colorVar: 'var(--cr-text-tertiary)',
            invert: true,
            staticTrend: debtTrend,
            cardId: 'debt',
            expandedHtml: renderActiveLoansExpansion(activeLoans),
        }),
    ].join('');

    // One delegated click handler for all three cards. Drawer-internal
    // clicks don't toggle (reserved for future drill-down controls).
    row.onclick = (ev) => {
        const card = ev.target.closest('.cr-fin-card');
        if (!card) return;
        if (ev.target.closest('.cr-fin-card-expansion')) return;
        card.classList.toggle('is-expanded');
    };
}

// Net Profit drill-down: one tick, three groups (Revenue / Costs /
// Capital Movements). Revenue + Costs are P&L; Capital Movements
// surfaces balance-sheet flows (loan principal in/out, equity moves)
// so a +$61M loan repayment received shows up as its own line even
// though it doesn't move P&L.
function renderProfitExpansion(settled) {
    if (!settled || (settled.events || []).length === 0) {
        return `<div class="cr-fin-card-expansion-empty">No movements last tick.</div>`;
    }
    const pnlEvents     = settled.events.filter(e => !CAPITAL_CATEGORIES.has(e.category));
    const capitalEvents = settled.events.filter(e =>  CAPITAL_CATEGORIES.has(e.category));
    const revenue = pnlEvents.filter(e => Number(e.delta) > 0);
    const costs   = pnlEvents.filter(e => Number(e.delta) < 0);
    const revenueTotal = revenue.reduce((s, e) => s + Number(e.delta), 0);
    const costsTotal   = costs.reduce((s, e) => s + Number(e.delta), 0);
    const capitalTotal = capitalEvents.reduce((s, e) => s + Number(e.delta), 0);

    const rowColor = (delta) => Number(delta) >= 0 ? 'var(--green)' : 'var(--red)';

    const groupHtml = (title, items, total, color, opts = {}) => {
        if (items.length === 0) return '';
        const sortedRows = items
            .slice()
            .sort((a, b) => Math.abs(Number(b.delta)) - Math.abs(Number(a.delta)))
            .map(e => {
                const d = Number(e.delta);
                const sign = d >= 0 ? '+' : '-';
                // Mixed-sign groups (Capital Movements) color each row by
                // its own sign; single-sign groups (Revenue / Costs) use
                // the group's color.
                const rc = opts.mixedSigns ? rowColor(d) : color;
                return `<div class="cr-fin-card-expansion-row">
                    <span style="color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(e.label || e.category || '?')}</span>
                    <span style="color:${rc};font-weight:700;font-variant-numeric:tabular-nums;">${sign}${fmtMoney(Math.abs(d))}</span>
                </div>`;
            }).join('');
        const headColor = opts.mixedSigns ? rowColor(total) : color;
        const sign = total >= 0 ? '+' : '-';
        return `<div class="cr-fin-card-expansion-group">
            <div class="cr-fin-card-expansion-group-head">
                <span>${title}</span>
                <span style="color:${headColor};font-weight:700;font-variant-numeric:tabular-nums;">${sign}${fmtMoney(Math.abs(total))}</span>
            </div>
            ${sortedRows}
        </div>`;
    };

    return `<div class="cr-fin-card-expansion-tick">
        <div class="cr-fin-card-expansion-tick-label">Tick ${settled.tick}</div>
        ${groupHtml('Revenue',           revenue,        revenueTotal, 'var(--green)')}
        ${groupHtml('Costs',             costs,          costsTotal,   'var(--red)')}
        ${groupHtml('Capital Movements', capitalEvents,  capitalTotal, null, { mixedSigns: true })}
    </div>`;
}

// Outstanding Debt expansion: list active bank_loans the corp owes. No
// per-tick filtering — debt only changes on disbursement / closure, and
// the live ledger is the most useful detail.
function renderActiveLoansExpansion(activeLoans) {
    const loans = activeLoans || [];
    if (loans.length === 0) {
        return `<div class="cr-fin-card-expansion-empty">No active loans. Open Request Loan in Actions to negotiate one.</div>`;
    }
    return loans.map(l => {
        const lender = l.factions?.faction_name || 'Unknown bank';
        const ticker = l.factions?.abbreviation || '';
        const apr = Number(l.apr || 0);
        const outstanding = Number(l.outstanding || 0);
        const payment = l.status === 'active'
            ? amortizedMonthlyPayment(l.principal, l.apr, l.term_ticks)
            : 0;
        return `<div class="cr-fin-card-expansion-tick">
            <div class="cr-fin-card-expansion-tick-label">${escapeHtml(lender)}${ticker ? ' [' + escapeHtml(ticker) + ']' : ''} · ${apr.toFixed(2)}% APR</div>
            <div class="cr-fin-card-expansion-row">
                <span style="color:var(--text-secondary);">Outstanding</span>
                <span style="color:var(--text-bright);font-weight:700;font-variant-numeric:tabular-nums;">${fmtMoney(outstanding)}</span>
            </div>
            ${payment > 0 ? `<div class="cr-fin-card-expansion-row">
                <span style="color:var(--text-secondary);">Per-tick payment</span>
                <span style="color:var(--text-bright);font-weight:700;font-variant-numeric:tabular-nums;">${fmtMoney(payment)}</span>
            </div>` : ''}
            <div class="cr-fin-card-expansion-row">
                <span style="color:var(--text-secondary);">Status</span>
                <span style="color:${l.status === 'active' ? 'var(--green)' : 'var(--amber)'};font-family:var(--font-mono);font-size:9px;">${escapeHtml(l.status)}</span>
            </div>
        </div>`;
    }).join('');
}

function renderFinCard({ label, value, prev, series, colorVar, invert, staticTrend, cardId, expandedHtml }) {
    let trendHtml;
    let trendClass = '';
    if (staticTrend) {
        trendHtml = staticTrend;
    } else if (prev == null) {
        trendHtml = '— no prior tick yet';
    } else {
        const delta = Number(value) - Number(prev);
        if (delta === 0) {
            trendHtml = '— unchanged vs last tick';
        } else {
            const arrow = delta > 0 ? '▲' : '▼';
            const sign  = delta > 0 ? '+' : '';
            const isGood = invert ? delta < 0 : delta > 0;
            trendClass = isGood ? 'positive' : 'negative';
            trendHtml = `${arrow} ${sign}${fmtMoney(delta)} vs last tick`;
        }
    }

    const expansion = expandedHtml
        ? `<div class="cr-fin-card-expansion">${expandedHtml}</div>`
        : '';
    const isExpandable = !!expandedHtml;
    return `<div class="cr-fin-card${isExpandable ? ' is-expandable' : ''}" data-card-id="${escapeHtml(cardId || '')}">
        <div class="cr-fin-card-label">
            <span>${escapeHtml(label)}</span>
            ${isExpandable ? '<span class="cr-fin-card-chevron">▾</span>' : ''}
        </div>
        <div class="cr-fin-card-value">${renderMoneyHtml(value)}</div>
        <div class="cr-fin-card-trend ${trendClass}">${trendHtml}</div>
        ${renderSparklineSvg(series, colorVar)}
        ${expansion}
    </div>`;
}

// Categorize a 0-10 score into a meter color band. Used by renderPerfCard
// to drive the per-cell .filled.warn / .filled / .filled.good classes.
function scoreBand(score) {
    if (score >= 7) return 'good';
    if (score >= 4) return 'mid';
    return 'warn';
}

// Generate a short context blurb from the score band so the card has copy
// without needing a narrative-events feed (event-driven flavor text lands
// later, alongside the dispatches feed in Phase 4).
function scoreBlurb(label, score) {
    const band = scoreBand(score);
    const map = {
        good: { 'Innovation':     '<strong>Strong R&D pipeline.</strong> Industry-leading research output.',
                'Market Share':   '<strong>Sector leader.</strong> Dominant position with pricing power.',
                'Reputation':     '<strong>Trusted operator.</strong> Premium standing with regulators and the public.',
                'Productivity':   '<strong>High output per worker.</strong> Operations running well above average.',
                'Employee Wages': '<strong>Above industry median.</strong> Talent retention is strong.',
                'Assets':         '<strong>Substantial holdings.</strong> Strong collateral and capacity.' },
        mid:  { 'Innovation':     '<strong>Steady output.</strong> Holding pace with the sector.',
                'Market Share':   '<strong>Mid-tier presence.</strong> Defensible but not dominant.',
                'Reputation':     '<strong>Mixed standing.</strong> No major scandals, no breakout goodwill.',
                'Productivity':   '<strong>Average efficiency.</strong> Room for operational gains.',
                'Employee Wages': '<strong>Industry-standard pay.</strong> No flight risk, no extra loyalty.',
                'Assets':         '<strong>Adequate holdings.</strong> Workable but room to grow.' },
        warn: { 'Innovation':     '<strong>Stagnating R&D.</strong> Competitors are pulling ahead.',
                'Market Share':   '<strong>Marginal player.</strong> Vulnerable to consolidation.',
                'Reputation':     '<strong>Reputation under pressure.</strong> Recovery requires investment.',
                'Productivity':   '<strong>Underperforming.</strong> Costs eating into output.',
                'Employee Wages': '<strong>Below market.</strong> Turnover risk and morale issues.',
                'Assets':         '<strong>Lean operation.</strong> Limited collateral and capacity.' },
    };
    return (map[band] && map[band][label]) || '';
}

function renderPerfMeter(score) {
    // Floor to integer count of filled cells; max 10.
    const filled = Math.max(0, Math.min(10, Math.round(Number(score) || 0)));
    const band = scoreBand(score);
    const cellClass = band === 'good' ? 'filled good'
                    : band === 'warn' ? 'filled warn'
                    : 'filled';
    const cells = [];
    for (let i = 0; i < 10; i++) {
        cells.push(`<div class="cr-perf-meter-cell${i < filled ? ' ' + cellClass : ''}"></div>`);
    }
    return `<div class="cr-perf-meter">${cells.join('')}</div>`;
}

function renderPerfCard(label, score) {
    const num = Number(score) || 0;
    const display = Number.isInteger(num) ? num.toString() : num.toFixed(1);
    // Per-stat delta would go in a top-right tag here, but it requires per-
    // tick stat history (no corp_stat_history table exists). Omitted entirely
    // rather than rendered as a meaningless "— —" placeholder; will return
    // when the history table lands.
    return `<div class="cr-perf-card">
        <div class="cr-perf-header">
            <div class="cr-perf-name">${escapeHtml(label)}</div>
            <div class="cr-perf-value">${escapeHtml(display)}<span class="cr-max">/10</span></div>
        </div>
        ${renderPerfMeter(num)}
        <div class="cr-perf-desc">${scoreBlurb(label, num)}</div>
    </div>`;
}

// Map a corp_ownership.holder_type to a swatch color. Keeps the bar and the
// list visually aligned to a small fixed palette regardless of how many
// stakeholders are present.
const OWNERSHIP_COLORS = {
    player:       'var(--cr-accent-gold)',
    state:        '#5a7896',
    shareholders: '#8a722f',
    rival_corp:   'var(--cr-accent-red)',
    other:        '#6b6856',
};

function ownershipColor(holderType) {
    return OWNERSHIP_COLORS[holderType] || OWNERSHIP_COLORS.other;
}

function ownershipLabel(holder) {
    const nationName = nation?.name || 'the State';
    switch (holder.holder_type) {
        // 'player' renders as "Private" (the ownership category) — the
        // "YOU" tag rendered separately at the row level still identifies
        // the current player as the holder when applicable.
        case 'player':       return 'Private';
        case 'state':        return `State of ${escapeHtml(nationName)}`;
        case 'shareholders': return 'Public Shareholders';
        case 'rival_corp':   return 'Rival Corporation';
        case 'other':        return 'Other';
        default:             return escapeHtml(holder.holder_type || 'Unknown');
    }
}

function renderOwnershipCard(ownership, currentUserId) {
    if (!ownership || ownership.length === 0) {
        return `<div class="cr-perf-card">
            <div class="cr-perf-header">
                <div class="cr-perf-name">Ownership</div>
                <div class="cr-perf-value">—<span class="cr-max">%</span></div>
            </div>
            <div class="cr-ownership-empty">No ownership data on file.</div>
        </div>`;
    }

    // Total a player's stake (if any) for the headline value.
    const playerShare = ownership
        .filter(o => o.holder_type === 'player' && o.holder_id === currentUserId)
        .reduce((sum, o) => sum + Number(o.pct || 0), 0);
    const headline = playerShare > 0 ? playerShare.toFixed(0) : '—';

    const barSegments = ownership.map(o => {
        const pct = Number(o.pct) || 0;
        const color = ownershipColor(o.holder_type);
        return `<div style="width:${pct}%;background:${color};" title="${ownershipLabel(o)} — ${pct.toFixed(1)}%"></div>`;
    }).join('');

    const listItems = ownership.map(o => {
        const pct   = Number(o.pct) || 0;
        const color = ownershipColor(o.holder_type);
        const isYou = o.holder_type === 'player' && o.holder_id === currentUserId;
        const youTag = isYou ? '<span class="cr-you-tag">YOU</span>' : '';
        return `<li>
            <span class="cr-ownership-swatch" style="background:${color};"></span>
            <span class="cr-ownership-name">${ownershipLabel(o)}${youTag}</span>
            <span class="cr-ownership-pct">${pct.toFixed(1)}%</span>
        </li>`;
    }).join('');

    return `<div class="cr-perf-card">
        <div class="cr-perf-header">
            <div class="cr-perf-name">Ownership</div>
            <div class="cr-perf-value">${headline}<span class="cr-max">%</span></div>
        </div>
        <div class="cr-ownership-bar">${barSegments}</div>
        <ul class="cr-ownership-list">${listItems}</ul>
    </div>`;
}

function renderOperatingIndicators(ownership, currentUserId) {
    const grid = document.getElementById('cr-perf-grid');
    if (!grid) return;

    grid.innerHTML = [
        renderPerfCard('Innovation',     faction.corp_innovation),
        renderPerfCard('Market Share',   faction.corp_market_share),
        renderPerfCard('Reputation',     faction.corp_reputation),
        renderPerfCard('Productivity',   faction.corp_productivity),
        renderPerfCard('Employee Wages', faction.corp_employee_wages),
        renderPerfCard('Assets',         faction.corp_assets),
        renderOwnershipCard(ownership, currentUserId),
    ].join('');
}

// ─── DISPATCHES FEED ─────────────────────────────────────────

// Convert raw event_name (often SCREAMING_SNAKE) to title-cased prose, matching
// the legacy corp dashboard's `formatEventName` so events like
// FORMATION_WINDOW_START render as "Formation Window Start".
function formatEventName(raw) {
    if (!raw) return '';
    return String(raw).replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

// event_log.category has many values across the codebase. Map category
// into the Politics/Corporate tab (Military is matched earlier by
// trigger_key — see dispatchBucketForRow). Compared against row.category
// lower-cased, so casing variants ('Trade', 'POLITICAL', etc.) all land
// in the right tab.
const POLITICS_CATEGORIES = [
    'politics', 'political', 'government', 'crisis',
    'diplomatic', 'diplomacy', 'international', 'economy',
    'executive_order', 'protest', 'bill', 'new_party',
];
const CORPORATE_CATEGORIES = [
    'corporate', 'business', 'trade',
];
// Military dispatches carry category 'government' but a trigger_key
// prefixed 'military_' (command appointed/resigned). Check trigger_key
// first so they bucket into Military, not Politics.
function dispatchBucketForRow(row) {
    if ((row?.trigger_key || '').toLowerCase().startsWith('military_')) return 'military';
    const c = (row?.category || '').toLowerCase();
    if (CORPORATE_CATEGORIES.includes(c)) return 'corporate';
    if (POLITICS_CATEGORIES.includes(c))  return 'politics';
    return null;
}

function bindDispatchTabs() {
    document.querySelectorAll('.cr-event-tab-bar').forEach(bar => {
        bar.addEventListener('click', (e) => {
            const btn = e.target.closest('.cr-event-tab');
            if (!btn || btn.classList.contains('active')) return;
            const axis = bar.getAttribute('data-tab-axis');
            // Update active state within this group only.
            bar.querySelectorAll('.cr-event-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            // Update state and reload.
            if (axis === 'category') {
                _eventState.category = btn.getAttribute('data-category');
            } else if (axis === 'scope') {
                _eventState.scope = btn.getAttribute('data-scope');
            }
            loadDispatches();
        });
    });
}

async function loadDispatches() {
    const key = `${_eventState.category}:${_eventState.scope}`;
    const listEl  = document.getElementById('cr-event-list');
    const countEl = document.getElementById('cr-event-count');
    if (!listEl) return;

    // Hit cache first.
    if (_eventState.cache[key]) {
        renderDispatchList(_eventState.cache[key]);
        return;
    }

    listEl.innerHTML = '<li class="cr-event-empty">Loading…</li>';
    if (countEl) countEl.textContent = '—';

    _eventState.inflight = key;
    const myNationId = faction.nation_id;

    // Pull a wide window and bucket client-side so casing variants
    // ('Trade' vs 'trade', 'POLITICAL' vs 'political') don't fall through.
    let q = _supabase.from('event_log')
        .select('id, event_name, description_used, description_chosen, category, trigger_key, fired_at_tick, nation_id, nations(name, nation_profiles(flag_url))')
        .not('category', 'is', null)
        .order('fired_at_tick', { ascending: false })
        .limit(120);

    if (_eventState.scope === 'nation') {
        if (!myNationId) {
            renderDispatchList([]);
            return;
        }
        q = q.eq('nation_id', myNationId);
    } else {
        // World scope. Allow null nation_id matches to surface (some events
        // may be cross-nation); the .neq still excludes the player's own.
        if (myNationId) q = q.neq('nation_id', myNationId);
    }

    const { data, error } = await q;

    // Bail if a newer tab click superseded this fetch.
    if (_eventState.inflight !== key) return;

    if (error) {
        console.error('[corp-dashboard] event_log fetch error:', error.message);
        listEl.innerHTML = '<li class="cr-event-empty">Failed to load dispatches.</li>';
        return;
    }

    const wantBucket = _eventState.category; // 'politics' | 'corporate' | 'military'
    const rows = (data || [])
        .filter(r => dispatchBucketForRow(r) === wantBucket)
        .slice(0, 30);
    _eventState.cache[key] = rows;
    renderDispatchList(rows);
}

function renderDispatchList(rows) {
    const listEl  = document.getElementById('cr-event-list');
    const countEl = document.getElementById('cr-event-count');
    if (!listEl) return;

    if (countEl) {
        countEl.textContent = rows.length === 0 ? 'NONE' : `${rows.length} ITEM${rows.length === 1 ? '' : 'S'}`;
    }

    if (rows.length === 0) {
        listEl.innerHTML = `<li class="cr-event-empty">No ${escapeHtml(_eventState.category)} dispatches in ${_eventState.scope === 'nation' ? 'your nation' : 'the world'} yet.</li>`;
        return;
    }

    const currentTick = Number(shard?.current_tick) || 0;
    const showNation = _eventState.scope === 'world';

    // Tag color and left-edge stripe always reflect the active bucket so
    // Politics events with subcategory "crisis" or "government" still render
    // with the consistent politics-blue accent — and likewise for Corporate.
    const bucket    = _eventState.category;
    const tagClass  = `tag-${bucket}`;
    const itemClass = `cat-${bucket}`;

    listEl.innerHTML = rows.map(row => {
        // Keep the actual subcategory text on the tag so players can see why
        // a row was bucketed (e.g. "GOVERNMENT" / "CRISIS" / "BUSINESS").
        const cat = row.category || bucket;

        const ticksAgo = Math.max(0, currentTick - (Number(row.fired_at_tick) || 0));
        const timeStr  = ticksAgo === 0 ? 'JUST NOW'
                       : ticksAgo === 1 ? '1 TICK AGO'
                       : `${ticksAgo} TICKS AGO`;

        const nationName = row.nations?.name || row.nation || null;
        // nations -> nation_profiles is a 1:1 join in Supabase. The shape
        // comes back as either an object or a single-item array depending on
        // the relation cardinality; normalise both before reading flag_url.
        const np = row.nations?.nation_profiles;
        const flagUrl = (Array.isArray(np) ? np[0]?.flag_url : np?.flag_url) || null;
        const flagImg = flagUrl
            ? `<img class="cr-event-flag" src="${escapeAttr(flagUrl)}" alt="" />`
            : '';
        const nationBadge = (showNation && nationName)
            ? `<span class="cr-event-nation">${flagImg}${escapeHtml(nationName)}</span>`
            : '';

        const headlineRaw = formatEventName(row.event_name) || 'Untitled dispatch';
        // Producers split between description_chosen (newer RPCs / corp
        // events) and description_used (older inserts). Read both so the
        // dispatch panel is the single source of truth for body text.
        const body = (row.description_chosen || row.description_used || '').trim();

        return `<li class="cr-event-item ${itemClass}">
            <div class="cr-event-meta">
                <span class="cr-event-tag ${tagClass}">${escapeHtml(cat)}</span>
                ${nationBadge}
                <span class="cr-event-time">${timeStr}</span>
            </div>
            <div class="cr-event-headline">${escapeHtml(headlineRaw)}</div>
            ${body ? `<div class="cr-event-body">${escapeHtml(body)}</div>` : ''}
        </li>`;
    }).join('');
}

function renderFooter() {
    document.getElementById('cr-audit-date').textContent =
        shard?.current_date || tickToDate(shard?.current_tick) || '—';
    document.getElementById('cr-footer-tick').textContent =
        shard?.current_tick != null ? `TICK ${shard.current_tick}` : '—';
}

function showFatal(msg) {
    const el = document.getElementById('loading');
    el.textContent = msg;
    el.style.color = 'var(--cr-accent-red)';
}

init().catch(err => {
    console.error('[corp-dashboard] init failed:', err);
    showFatal('Failed to load: ' + (err?.message || 'unknown error'));
});
</script>
