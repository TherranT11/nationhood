<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corporation HQ | Nationhood Alpha</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #0e0e0c;
  --bg-1: #1a1a1a;
  --bg-2: #1a1a17;
  --bg-3: #252525;
  --bg-4: #24241f;
  --bg-5: #2c2c26;
  --bg-hover: #282822;
  --text-bright: #f0efe6;
  --text-primary: #c4c2b8;
  --text-secondary: #888;
  --text-muted: #666;
  --text-dim: #4a4940;
  --text-ghost: #333229;
  --border-hair: rgba(255,255,255,0.04);
  --border-0: rgba(255,255,255,0.06);
  --border-1: rgba(255,255,255,0.08);
  --border-2: rgba(255,255,255,0.12);
  --green: #5cb85c;
  --green-faint: rgba(92,184,92,0.08);
  --green-border: rgba(92,184,92,0.18);
  --red: #d9534f;
  --amber: #c8a64e;
  --amber-faint: rgba(200,166,78,0.08);
  --amber-border: rgba(200,166,78,0.18);
  --blue: #5b9bd5;
  --blue-faint: rgba(91,155,213,0.08);
  --blue-border: rgba(91,155,213,0.18);
  --teal: #5aafa5;
  --teal-faint: rgba(90,175,165,0.08);
  --teal-border: rgba(90,175,165,0.18);
  --font-mono: 'JetBrains Mono', monospace;
  --font-ui: 'IBM Plex Sans', -apple-system, sans-serif;
  --font-serif: 'IBM Plex Serif', Georgia, serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg-0);
  color: var(--text-primary);
  font-family: var(--font-ui);
  min-height: 100vh;
}

/* ── Top bar (matches party dashboard) ── */
.top-bar-row1 {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 9px 22px;
  height: 53px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--border-0);
}
.top-bar-left { display: flex; align-items: center; gap: 0; }
.top-bar-sep {
  width: 1px; height: 31px; background: rgba(255,255,255,0.08);
  margin: 0 16px; flex-shrink: 0;
}
.corp-badge {
  display: flex; align-items: center; gap: 8px;
}
.corp-logo {
  width: 35px; height: 35px;
  background: var(--bg-3);
  border: 1px solid var(--border-0);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 700;
  color: var(--text-dim);
}
.corp-name-bar {
  font-family: var(--font-serif);
  font-size: 14px; font-weight: 500;
  color: var(--text-bright);
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.tick-info { display: flex; gap: 20px; align-items: center; }
.tick-item { display: flex; flex-direction: column; gap: 1px; }
.tick-label {
  font-family: var(--font-mono);
  font-size: 9.5px; font-weight: 500;
  letter-spacing: 0.06em; text-transform: uppercase;
  color: #7a7868;
}
.tick-value {
  font-family: var(--font-mono);
  font-size: 13px; font-weight: 500;
  color: var(--text-bright);
}
.top-bar-right { display: flex; align-items: center; gap: 10px; }
.corp-name-badge {
  font-family: var(--font-mono);
  font-size: 12px; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--teal);
  background: var(--teal-faint);
  border: 1px solid var(--teal-border);
  border-left: 3px solid var(--teal);
  padding: 3px 9px;
}
.topbar-ap {
  display: flex; align-items: center; gap: 3px;
  padding: 3px 8px;
  background: var(--amber-faint);
  border: 1px solid var(--amber-border);
}
.topbar-ap__count {
  font-family: var(--font-mono);
  font-size: 12px; font-weight: 800; color: var(--amber);
  min-width: 18px; text-align: right;
}
.theme-toggle-btn {
  font-family: var(--font-mono);
  font-size: 9px; font-weight: 500;
  letter-spacing: 0.06em; text-transform: uppercase;
  background: var(--bg-3);
  border: 1px solid var(--border-0);
  color: var(--text-dim);
  padding: 4px 10px;
  cursor: pointer;
  transition: all 0.1s;
}
.theme-toggle-btn:hover {
  background: var(--bg-hover);
  color: var(--text-muted);
  border-color: var(--border-1);
}
.logout-btn {
  font-family: var(--font-mono);
  font-size: 9px; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
  background: transparent;
  border: 1px solid rgba(217,83,79,0.3);
  color: var(--red);
  padding: 4px 10px;
  cursor: pointer;
  transition: background 0.1s;
}
.logout-btn:hover {
  background: rgba(217,83,79,0.08);
}

/* ── Content ── */
.content {
  padding: 24px 20px;
  display: flex;
  justify-content: center;
  gap: 12px;
  align-items: flex-start;
  flex-wrap: wrap;
}
/* ── Subsidiaries card — fixed 380×450 ── */
.subs-card {
  width: 380px; height: 450px;
  background: var(--bg-2); border: 1px solid var(--border-0);
  display: flex; flex-direction: column; overflow: hidden;
}
.subs-card__body {
  flex: 1; display: flex; align-items: center; justify-content: center;
}
.subs-card__empty {
  font-family: var(--font-mono); font-size: 9px; color: var(--text-dim);
  letter-spacing: 0.04em; text-align: center;
}

/* ── Identity card — fixed 380×450 ── */
.id-card {
  width: 380px;
  height: 450px;
  background: var(--bg-2);
  border: 1px solid var(--border-0);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.id-card__header {
  background: var(--bg-3);
  border-bottom: 1px solid var(--border-hair);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.id-card__header-left {
  display: flex; align-items: center; gap: 8px;
}
.id-card__dot {
  width: 5px; height: 5px; border-radius: 50%; background: var(--teal);
}
.id-card__label {
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase;
}
.id-card__type-badge {
  font-family: var(--font-mono); font-size: 8px; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
  padding: 3px 9px; border-radius: 2px;
  background: var(--teal-faint); border: 1px solid var(--teal-border); color: var(--teal);
}
.id-card__body {
  flex: 1; padding: 14px 20px;
  display: flex; flex-direction: column;
}
.id-card__logo-area {
  text-align: center; margin-bottom: 8px;
}
.id-card__logo {
  width: 48px; height: 48px; margin: 0 auto;
  background: var(--bg-3); border: 1px solid var(--border-0); border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 16px; font-weight: 700; color: var(--text-dim);
}
.id-card__corp-name {
  font-family: var(--font-ui); font-size: 17px; font-weight: 700;
  color: var(--text-bright); text-align: center; margin-bottom: 2px;
}
.id-card__slogan {
  font-family: var(--font-serif); font-size: 11px; font-style: italic;
  color: var(--text-muted); text-align: center; margin-bottom: 10px;
}
.id-card__divider {
  height: 1px; background: var(--border-0); margin-bottom: 6px;
}
.id-card__rows {
  flex: 1;
}
.id-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 5px 0; border-bottom: 1px solid var(--border-hair);
}
.id-row:last-child { border-bottom: none; }
.id-row__label {
  font-family: var(--font-mono); font-size: 10px; font-weight: 500;
  color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase;
}
.id-row__value {
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  color: var(--text-primary); text-align: right;
}

/* ── Slogan editor ── */
.slogan-bar {
  margin-top: 8px; padding-top: 8px;
  border-top: 1px solid var(--border-0);
  display: flex; gap: 6px; align-items: center;
}
.slogan-bar input {
  flex: 1; padding: 6px 8px;
  background: var(--bg-4); border: 1px solid var(--border-0); border-radius: 3px;
  color: var(--text-bright); font-family: var(--font-serif); font-size: 11px;
  font-style: italic; outline: none; transition: border-color 0.15s;
}
.slogan-bar input:focus { border-color: var(--teal-border); }
.slogan-bar input::placeholder { color: var(--text-ghost); }
.slogan-bar button {
  font-family: var(--font-mono); font-size: 8px; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
  padding: 6px 10px; cursor: pointer;
  background: var(--teal-faint); border: 1px solid var(--teal-border); color: var(--teal);
  border-radius: 2px; transition: background 0.15s; white-space: nowrap;
}
.slogan-bar button:hover { background: rgba(90,175,165,0.14); }
.slogan-bar button:disabled { opacity: 0.3; cursor: not-allowed; }
.slogan-hint {
  font-family: var(--font-mono); font-size: 7.5px; color: var(--text-dim);
  margin-top: 3px; letter-spacing: 0.02em;
}
.slogan-hint--error { color: var(--red); }
.slogan-hint--ok { color: var(--green); }

/* ── Finances card — fixed 380×450 ── */
.fin-card {
  width: 380px; height: 450px;
  background: var(--bg-2); border: 1px solid var(--border-0);
  display: flex; flex-direction: column; overflow: hidden;
}
.fin-card__header {
  background: var(--bg-3); border-bottom: 1px solid var(--border-hair);
  padding: 8px 14px; display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.fin-card__header-left { display: flex; align-items: center; gap: 8px; }
.fin-card__scroll { flex: 1; overflow-y: auto; }
.fin-section {
  padding: 8px 14px 6px; border-bottom: 1px solid var(--border-0);
}
.fin-section__title {
  font-family: var(--font-mono); font-size: 9px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px;
}
.fin-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 3px 0; border-bottom: 1px solid var(--border-hair);
}
.fin-row:last-child { border-bottom: none; }
.fin-row__label { font-family: var(--font-ui); font-size: 11px; color: var(--text-muted); }
.fin-row__value { font-family: var(--font-mono); font-size: 11px; font-weight: 600; }
.fin-row__badge {
  font-family: var(--font-mono); font-size: 7px; letter-spacing: 0.5px;
  color: var(--text-dim); padding: 0 4px; border: 1px solid var(--border-0);
  margin-left: 6px;
}
.fin-total {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 0 4px;
}
.fin-total__label { font-family: var(--font-ui); font-size: 11px; font-weight: 600; color: var(--text-bright); }
.fin-total__value { font-family: var(--font-mono); font-size: 13px; font-weight: 700; }
.fin-net {
  padding: 10px 14px; border-bottom: 1px solid var(--border-0);
  display: flex; justify-content: space-between; align-items: center;
}
.fin-net__label {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 1.5px;
  color: var(--text-dim); text-transform: uppercase;
}
.fin-net__value { font-family: var(--font-mono); font-size: 20px; font-weight: 700; }
.fin-cash-debt {
  display: flex; border-bottom: 1px solid var(--border-0);
}
.fin-cash-debt__cell {
  flex: 1; padding: 8px 14px;
}
.fin-cash-debt__cell + .fin-cash-debt__cell { border-left: 1px solid var(--border-0); }
.fin-cash-debt__label {
  font-family: var(--font-mono); font-size: 8px; letter-spacing: 1.5px;
  color: var(--text-dim); text-transform: uppercase; margin-bottom: 2px;
}
.fin-cash-debt__value { font-family: var(--font-mono); font-size: 16px; font-weight: 700; }
/* Segment bar */
.seg-bar { width: 100%; height: 5px; background: var(--border-0); display: flex; overflow: hidden; margin-bottom: 4px; }
.seg-bar__seg { height: 100%; }
.seg-legend { display: flex; gap: 10px; margin-bottom: 8px; }
.seg-legend__item { display: flex; align-items: center; gap: 3px; }
.seg-legend__dot { width: 6px; height: 6px; }
.seg-legend__label { font-family: var(--font-mono); font-size: 8px; color: var(--text-dim); }
/* Driver rows */
.drv-row { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
.drv-row__name {
  font-family: var(--font-mono); font-size: 9px; color: var(--text-muted);
  width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.drv-row__bar { width: 50px; height: 3px; background: var(--border-0); }
.drv-row__bar-fill { height: 100%; }
.drv-row__val { font-family: var(--font-mono); font-size: 9px; color: var(--text-bright); width: 20px; text-align: right; }
.drv-row__dir { font-family: var(--font-mono); font-size: 8px; width: 8px; }
.drv-row__wt { font-family: var(--font-mono); font-size: 8px; color: var(--text-dim); width: 24px; text-align: right; }
.drv-row__note {
  font-family: var(--font-mono); font-size: 7px; color: var(--text-dim);
  padding: 0 3px; border: 1px solid var(--border-0);
}
.drv-multiplier {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 6px; padding-top: 4px; border-top: 1px solid var(--border-0);
}
.drv-multiplier__label { font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); }
.drv-multiplier__value { font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--teal); }

/* ── Stats card — fixed 380×450 ── */
.stats-card {
  width: 380px; height: 450px;
  background: var(--bg-2); border: 1px solid var(--border-0);
  display: flex; flex-direction: column; overflow: hidden;
}
.stats-card__scroll { flex: 1; overflow-y: auto; }
.stats-section {
  padding: 6px 14px; border-bottom: 1px solid var(--border-0);
  background: var(--bg-3);
}
.stats-section__label {
  font-family: var(--font-mono); font-size: 9px; font-weight: 700;
  letter-spacing: 1.5px; color: var(--teal); text-transform: uppercase;
}
.stats-hero {
  padding: 10px 14px; border-bottom: 1px solid var(--border-0);
  background: rgba(90,175,165,0.02);
}
.stats-hero__top {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;
}
.stats-hero__name {
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  letter-spacing: 1.5px; color: var(--teal); text-transform: uppercase;
}
.stats-hero__right { display: flex; align-items: baseline; gap: 6px; }
.stats-hero__val { font-family: var(--font-mono); font-size: 22px; font-weight: 700; color: var(--teal); }
.stats-hero__max { font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); }
.stats-hero__bar { width: 100%; height: 4px; background: var(--border-0); }
.stats-hero__bar-fill { height: 100%; background: var(--teal); }
.stat-item {
  display: flex; align-items: center; padding: 5px 14px;
  border-bottom: 1px solid var(--border-hair);
}
.stat-item__left { flex: 1; min-width: 0; }
.stat-item__name-row { display: flex; align-items: center; gap: 6px; }
.stat-item__name {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 1px;
  color: var(--text-dim); text-transform: uppercase;
}
.stat-item__decay {
  font-family: var(--font-mono); font-size: 7px; color: var(--red);
  padding: 0 3px; border: 1px solid var(--border-0); line-height: 12px;
}
.stat-item__nation {
  font-family: var(--font-mono); font-size: 7px; letter-spacing: 0.5px;
  color: var(--teal); padding: 0 4px; margin-top: 2px; display: inline-block;
  background: var(--teal-faint); border: 1px solid var(--teal-border); line-height: 12px;
}
.stat-item__right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.stat-item__val { font-family: var(--font-mono); font-size: 13px; font-weight: 700; }
.stat-item__max { font-family: var(--font-mono); font-size: 8px; color: var(--text-dim); }
.stat-item__change {
  display: flex; align-items: center; gap: 2px;
  min-width: 36px; justify-content: flex-end;
}
.stat-item__dir { font-family: var(--font-mono); font-size: 9px; }
.stat-item__delta { font-family: var(--font-mono); font-size: 9px; }

/* ── Property card — fixed 380×450 ── */
.prop-card {
  width: 380px; height: 450px;
  background: var(--bg-2); border: 1px solid var(--border-0);
  display: flex; flex-direction: column; overflow: hidden;
}
.prop-card__content { flex: 1; display: flex; flex-direction: column; }
.prop-asset {
  padding: 12px 14px; border-bottom: 1px solid var(--border-0);
}
.prop-asset__top { display: flex; justify-content: space-between; align-items: flex-start; }
.prop-asset__name { font-family: var(--font-ui); font-size: 13px; font-weight: 600; color: var(--text-bright); }
.prop-asset__nation {
  font-family: var(--font-mono); font-size: 7px; letter-spacing: 0.5px;
  color: var(--teal); padding: 1px 5px; margin-top: 4px; display: inline-block;
  background: var(--teal-faint); border: 1px solid var(--teal-border);
}
.prop-asset__badge {
  font-family: var(--font-mono); font-size: 9px; font-weight: 700;
  letter-spacing: 1px; padding: 1px 8px;
  color: var(--green); background: var(--green-faint); border: 1px solid var(--green-border);
}
.prop-cost-box {
  margin-top: 10px; padding: 8px 10px;
  background: var(--bg-3); border: 1px solid var(--border-0);
}
.prop-cost-row {
  display: flex; justify-content: space-between; padding: 3px 0;
  border-bottom: 1px solid var(--border-0);
}
.prop-cost-row:last-child { border-bottom: none; }
.prop-cost-row__label { font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); }
.prop-cost-row__value { font-family: var(--font-mono); font-size: 10px; }
.prop-total {
  padding: 10px 14px; border-top: 1px solid var(--border-0);
  background: rgba(90,175,165,0.02);
  display: flex; justify-content: space-between; align-items: center;
  margin-top: auto;
}
.prop-total__label {
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  letter-spacing: 1.5px; color: var(--text-dim); text-transform: uppercase;
}
.prop-total__value { font-family: var(--font-mono); font-size: 16px; font-weight: 700; color: var(--teal); }

/* ── Loading ── */
.loading-msg {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  text-align: center;
  padding: 80px 20px;
}
</style>
</head>
<body>

<div id="loading" class="loading-msg">LOADING CORPORATION...</div>

<div id="page-content" style="display:none;">
  <!-- Top bar (matches party dashboard layout) -->
  <div class="top-bar-row1">
    <div class="top-bar-left">
      <div class="corp-badge">
        <div class="corp-logo" id="corp-logo"></div>
        <span class="corp-name-bar" id="corp-name-bar">Loading...</span>
      </div>
      <div class="top-bar-sep"></div>
      <div class="tick-info">
        <div class="tick-item">
          <div class="tick-label">Game Date</div>
          <div class="tick-value" id="game-date">--</div>
        </div>
        <div class="tick-item">
          <div class="tick-label">Tick</div>
          <div class="tick-value" id="tick-number">--</div>
        </div>
        <div class="tick-item">
          <div class="tick-label">Next Tick</div>
          <div class="tick-value" id="tick-countdown">--</div>
        </div>
      </div>
    </div>
    <div class="top-bar-right">
      <span class="corp-name-badge" id="corp-name-badge">--</span>
      <span class="topbar-ap" id="topbar-ap"></span>
      <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-toggle">Light</button>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <div class="content">
    <div class="id-card">
      <div class="id-card__header">
        <div class="id-card__header-left">
          <div class="id-card__dot"></div>
          <span class="id-card__label">Corporation</span>
        </div>
        <span class="id-card__type-badge" id="id-type-badge">--</span>
      </div>
      <div class="id-card__body">
        <div class="id-card__logo-area">
          <div class="id-card__logo" id="id-logo"></div>
        </div>
        <div class="id-card__corp-name" id="id-corp-name">--</div>
        <div class="id-card__slogan" id="id-slogan">"--"</div>
        <div class="id-card__divider"></div>

    </div>

    <!-- Finances card -->
    <div class="fin-card">
      <div class="fin-card__header">
        <div class="fin-card__header-left">
          <span style="font-size:8px;color:var(--green);">●</span>
          <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;">Finances</span>

    <!-- Stats card -->

      <div class="fin-card__header">
        <div class="fin-card__header-left">
          <span style="font-size:8px;color:var(--teal);">●</span>
          <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;">Core Stats</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-family:var(--font-mono);font-size:8px;color:var(--text-dim);letter-spacing:1px;">VAL</span>
          <span style="font-family:var(--font-mono);font-size:8px;color:var(--text-dim);letter-spacing:1px;width:42px;text-align:right;">CHANGE</span>

    <!-- Property card -->
    <div class="prop-card">
      <div class="fin-card__header">
        <div class="fin-card__header-left">
          <span style="font-size:8px;color:var(--amber);">●</span>
          <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;">Property</span>
        </div>
        <span style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);" id="prop-count">1 ASSET</span>

    <!-- Subsidiaries card -->
    <div class="subs-card">

          <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;">Subsidiaries</span>

        <span style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);">0 ACTIVE</span>

        <div class="subs-card__empty">No subsidiaries established.<br>Expand into new markets to create subsidiaries.</div>
      </div>

  </div>
</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { escapeHtml } from './js/utils.js';

async function init() {
    const { data: { user } } = await _supabase.auth.getUser();
    if (!user) { window.location.href = 'login.html'; return; }

    // Load corporation faction
    const { data: faction, error } = await _supabase
        .from('factions')
        .select('*')
        .eq('id', user.id)
        .single();

    if (error || !faction) {
        console.error('Corp dashboard: faction load failed', error);
        await _supabase.auth.signOut();
        window.location.href = 'login.html';
        return;
    }

    // If this isn't a corporation, redirect to the right dashboard
    if (faction.faction_type !== 'corporation') {
        window.location.href = 'dashboard.html';
        return;
    }

    // Load nation + shard data
    let nationName = faction.nation || '';
    let nationStats = null;
    const [nationRes, shardRes] = await Promise.all([
        faction.nation_id
            ? _supabase.from('nations').select('*').eq('id', faction.nation_id).single()
            : Promise.resolve({ data: null }),
        _supabase.from('shard').select('current_tick, current_date, next_tick_at').eq('name', 'Alpha Shard').single(),
    ]);
    if (nationRes.data) {
        nationName = nationRes.data.name;
        nationStats = nationRes.data;
    }
    const shard = shardRes.data;

    // Populate top bar — left side
    const ticker = faction.corp_ticker || faction.abbreviation || '';
    document.getElementById('corp-logo').textContent = ticker.slice(0, 2) || '—';
    document.getElementById('corp-name-bar').textContent = faction.faction_name || 'Unnamed Corp';

    // Tick info
    if (shard) {
        document.getElementById('game-date').textContent = shard.current_date || '—';
        document.getElementById('tick-number').textContent = shard.current_tick || '—';
        if (shard.next_tick_at) {
            nextTickAt = new Date(shard.next_tick_at);
            startTickCountdown();
        }
    }

    // Top bar — right side
    document.getElementById('corp-name-badge').textContent =
        (faction.faction_name || 'Corp') + (ticker ? ' [' + ticker + ']' : '');
    const ap = faction.action_points ?? 0;
    document.getElementById('topbar-ap').innerHTML =
        '<span class="topbar-ap__count">' + ap + ' AP</span>';

    // ── Populate identity card ──
    document.getElementById('id-type-badge').textContent = faction.corp_company_type || '—';
    document.getElementById('id-logo').textContent = ticker.slice(0, 3) || '—';
    document.getElementById('id-corp-name').textContent = faction.faction_name || 'Unnamed Corp';
    const currentSlogan = faction.party_description || '';
    document.getElementById('id-slogan').textContent = currentSlogan ? '"' + currentSlogan + '"' : '"--"';

    // Derive established year from game date (e.g. "August, 2013" → "2013")
    const estYear = shard?.current_date ? shard.current_date.replace(/.*,\s*/, '') : '—';

    const ceoName = (faction.leader_first_name && faction.leader_last_name)
        ? faction.leader_first_name + ' ' + faction.leader_last_name + (faction.leader_age ? ' (' + faction.leader_age + ')' : '')
        : '—';

    document.getElementById('id-rows').innerHTML = `
        <div class="id-row">
            <span class="id-row__label">Established</span>
            <span class="id-row__value">${escapeHtml(estYear)}</span>
        </div>
        <div class="id-row">
            <span class="id-row__label">Headquarters</span>
            <span class="id-row__value">${escapeHtml(nationName || '—')}</span>
        </div>
        <div class="id-row">
            <span class="id-row__label">Sector</span>
            <span class="id-row__value">${escapeHtml(faction.corp_sector || '—')}</span>
        </div>
        <div class="id-row">
            <span class="id-row__label">Specialization</span>
            <span class="id-row__value">${escapeHtml(faction.corp_subsector || '—')}</span>
        </div>
        <div class="id-row">
            <span class="id-row__label">CEO</span>
            <span class="id-row__value">${escapeHtml(ceoName)}</span>
        </div>
        <div class="id-row">
            <span class="id-row__label">Company Type</span>
            <span class="id-row__value">${escapeHtml(faction.corp_company_type || '—')}</span>
        </div>
        <div class="id-row">
            <span class="id-row__label">Stock Ticker</span>
            <span class="id-row__value" style="color:var(--teal);letter-spacing:0.1em;">${escapeHtml(ticker)}</span>
        </div>
    `;

    // ── Slogan editor ──
    const sloganCooldownTick = faction.last_rename_tick || 0;
    const currentTick = shard?.current_tick || 0;
    const SLOGAN_COOLDOWN = 120;
    const ticksRemaining = Math.max(0, (sloganCooldownTick + SLOGAN_COOLDOWN) - currentTick);
    const canEditSlogan = ticksRemaining <= 0;

    const sloganEditor = document.getElementById('slogan-editor');
    sloganEditor.innerHTML = `
        <div class="slogan-bar">
            <input type="text" id="slogan-input" placeholder="Enter a slogan..." maxlength="60" value="${escapeHtml(currentSlogan)}">
            <button id="slogan-save-btn" onclick="saveSlogan()" ${canEditSlogan ? '' : 'disabled'}>Save</button>
        </div>
        <div class="slogan-hint" id="slogan-hint">${canEditSlogan ? '60 characters max. 120 tick cooldown after change.' : ticksRemaining + ' ticks until you can change slogan.'}</div>
    `;

    // Store for save handler
    window._corpFactionId = faction.id;
    window._currentTick = currentTick;

    // ── Populate finances card ──
    renderFinances(nationStats, shard);
    renderStats(nationName);
    renderProperty(nationStats, nationName, faction, shard);

    // Show page
    document.getElementById('loading').style.display = 'none';
    document.getElementById('page-content').style.display = 'block';
}

function renderFinances(nation, shard) {
    const currentTick = shard?.current_tick || 0;
    document.getElementById('fin-tick').textContent = 'TICK ' + currentTick;

    // Market revenue calculation
    const BASE_RATE = 50_000_000; // $50M base → output $10M-$99M range
    const s = (key) => Number(nation?.[key] ?? 50);

    const gdpFactor     = 1 + (s('gdp_growth') - 50) / 100 * 0.4;
    const urbanFactor   = 1 + (s('urbanization') - 50) / 100 * 0.3;
    const popFactor     = 1 + (s('population_growth') - 50) / 100 * 0.2;
    const solFactor     = 1 + (s('standard_of_living') - 50) / 100 * 0.15;
    const infraFactor   = 1 + (50 - s('physical_infrastructure')) / 100 * 0.1;
    const inflFactor    = 1 - Math.max(0, s('inflation') - 50) / 100 * 0.1;
    const intFactor     = 1 - Math.max(0, s('interest_rates') - 50) / 100 * 0.1;

    const multiplier = gdpFactor * urbanFactor * popFactor * solFactor * infraFactor * inflFactor * intFactor;
    const marketRev = Math.round(BASE_RATE * multiplier);

    const govContracts = 0;
    const pvtContracts = 0;
    const totalRevenue = govContracts + pvtContracts + marketRev;

    // Expenses (all zero for now — placeholder)
    const wages = 0, materials = 0, facilities = 0, equipment = 0, debtService = 0, taxes = 0;
    const totalExpenses = wages + materials + facilities + equipment + debtService + taxes;
    const netProfit = totalRevenue - totalExpenses;
    const cash = 0, debt = 0;

    function fmt(n) {
        if (Math.abs(n) >= 1_000_000) return '$' + (n / 1_000_000).toFixed(1) + 'M';
        if (Math.abs(n) >= 1000) return '$' + (n / 1000).toFixed(1) + 'k';
        return '$' + n.toLocaleString();
    }

    // Driver data for display
    const drivers = [
        { stat: 'gdp_growth', value: s('gdp_growth'), weight: '0.4' },
        { stat: 'urbanization', value: s('urbanization'), weight: '0.3' },
        { stat: 'population_growth', value: s('population_growth'), weight: '0.2' },
        { stat: 'standard_of_living', value: s('standard_of_living'), weight: '0.15' },
        { stat: 'physical_infra', value: s('physical_infrastructure'), weight: '0.1', note: 'INV' },
        { stat: 'inflation', value: s('inflation'), weight: '-0.1', neg: true },
        { stat: 'interest_rates', value: s('interest_rates'), weight: '-0.1', neg: true },
    ];

    function barColor(d) {
        if (d.neg) return d.value > 50 ? 'var(--red)' : 'var(--green)';
        if (d.note) return d.value < 50 ? 'var(--green)' : 'var(--red)';
        return d.value >= 50 ? 'var(--green)' : d.value >= 35 ? 'var(--amber)' : 'var(--red)';
    }

    const revTotal = totalRevenue || 1;
    const govPct = (govContracts / revTotal * 100).toFixed(1);
    const pvtPct = (pvtContracts / revTotal * 100).toFixed(1);
    const mktPct = (marketRev / revTotal * 100).toFixed(1);

    document.getElementById('fin-body').innerHTML = `
        <!-- Revenue -->
        <div class="fin-section">
            <div class="fin-section__title" style="color:var(--green);">Revenue</div>
            <div class="seg-bar">
                <div class="seg-bar__seg" style="width:${govPct}%;background:var(--teal);"></div>
                <div class="seg-bar__seg" style="width:${pvtPct}%;background:var(--amber);"></div>
                <div class="seg-bar__seg" style="width:${mktPct}%;background:var(--text-dim);"></div>
            </div>
            <div class="seg-legend">
                <div class="seg-legend__item"><div class="seg-legend__dot" style="background:var(--teal)"></div><span class="seg-legend__label">Gov</span></div>
                <div class="seg-legend__item"><div class="seg-legend__dot" style="background:var(--amber)"></div><span class="seg-legend__label">Private</span></div>
                <div class="seg-legend__item"><div class="seg-legend__dot" style="background:var(--text-dim)"></div><span class="seg-legend__label">Market</span></div>
            </div>
            <div class="fin-row"><span class="fin-row__label">Government Contracts</span><span class="fin-row__value" style="color:var(--green)">${fmt(govContracts)}</span></div>
            <div class="fin-row"><span class="fin-row__label">Private Contracts</span><span class="fin-row__value" style="color:var(--green)">${fmt(pvtContracts)}</span></div>
            <div class="fin-row"><span class="fin-row__label">Market Revenue<span class="fin-row__badge">DERIVED</span></span><span class="fin-row__value" style="color:var(--green)">${fmt(marketRev)}</span></div>
            <div class="fin-total">
                <span class="fin-total__label">Total Revenue</span>
                <span class="fin-total__value" style="color:var(--green)">${fmt(totalRevenue)}</span>
            </div>
        </div>
        <!-- Expenses -->
        <div class="fin-section">
            <div class="fin-section__title" style="color:var(--red);">Expenses</div>
            <div class="fin-row"><span class="fin-row__label">Workforce Wages</span><span class="fin-row__value" style="color:#a44">${fmt(wages)}</span></div>
            <div class="fin-row"><span class="fin-row__label">Materials & Supplies</span><span class="fin-row__value" style="color:#a44">${fmt(materials)}</span></div>
            <div class="fin-row"><span class="fin-row__label">Facilities</span><span class="fin-row__value" style="color:#a44">${fmt(facilities)}</span></div>
            <div class="fin-row"><span class="fin-row__label">Equipment</span><span class="fin-row__value" style="color:#a44">${fmt(equipment)}</span></div>
            <div class="fin-row"><span class="fin-row__label">Debt Service</span><span class="fin-row__value" style="color:#a44">${fmt(debtService)}</span></div>
            <div class="fin-row"><span class="fin-row__label">Taxes</span><span class="fin-row__value" style="color:#a44">${fmt(taxes)}</span></div>
            <div class="fin-total">
                <span class="fin-total__label">Total Expenses</span>
                <span class="fin-total__value" style="color:var(--red)">${fmt(totalExpenses)}</span>
            </div>
        </div>
        <!-- Net Profit -->
        <div class="fin-net" style="background:${netProfit >= 0 ? 'rgba(92,204,92,0.02)' : 'rgba(204,85,85,0.02)'}">
            <span class="fin-net__label">Net Profit</span>
            <span class="fin-net__value" style="color:${netProfit >= 0 ? 'var(--green)' : 'var(--red)'}">${fmt(netProfit)}</span>
        </div>
        <!-- Cash & Debt -->
        <div class="fin-cash-debt">
            <div class="fin-cash-debt__cell">
                <div class="fin-cash-debt__label">Cash</div>
                <div class="fin-cash-debt__value" style="color:var(--text-bright)">${fmt(cash)}</div>
            </div>
            <div class="fin-cash-debt__cell">
                <div class="fin-cash-debt__label">Debt</div>
                <div class="fin-cash-debt__value" style="color:var(--amber)">${fmt(debt)}</div>
            </div>
        </div>
        <!-- Market Revenue Drivers -->
        <div style="padding:8px 14px;">
            <div style="font-family:var(--font-mono);font-size:9px;letter-spacing:1.5px;color:var(--text-dim);text-transform:uppercase;margin-bottom:6px;">Market Revenue Drivers</div>
            ${drivers.map(d => `
                <div class="drv-row">
                    <span class="drv-row__name">${d.stat}</span>
                    <div class="drv-row__bar"><div class="drv-row__bar-fill" style="width:${d.value}%;background:${barColor(d)}"></div></div>
                    <span class="drv-row__val">${d.value}</span>
                    <span class="drv-row__wt">&times;${d.weight}</span>
                    ${d.note ? '<span class="drv-row__note">' + d.note + '</span>' : ''}
                </div>
            `).join('')}
            <div class="drv-multiplier">
                <span class="drv-multiplier__label">EFFECTIVE MULTIPLIER</span>
                <span class="drv-multiplier__value">&times;${multiplier.toFixed(2)}</span>
            </div>
        </div>
    `;
}

function renderStats(nationName) {
    const nation = nationName.toUpperCase();

    // Starting values (these will come from DB later)
    const stats = [
        // { label, value, change, decay, nation, max, isHero }
        { label: 'Reputation', value: 65, change: 0, decay: true, max: 100, isHero: true },
        // Core
        { label: 'Workforce Size', value: 3000, change: 0, section: 'Core' },
        { label: 'Workforce Skill', value: 50, change: 0, decay: true, max: 100 },
        { label: 'Operational Efficiency', value: 50, change: 0, decay: true, max: 100 },
        // Market & Financials
        { label: 'Market Share', value: 5, change: 0, nation, max: 100, section: 'Market & Financials' },
        { label: 'Credit Rating', value: 50, change: 0, max: 100 },
        // Political Standing
        { label: 'Regulatory Standing', value: 50, change: 0, nation, max: 100, section: 'Political Standing' },
        { label: 'Political Influence', value: 10, change: 0, decay: true, nation, max: 100 },
        // Innovation
        { label: 'Innovation', value: 20, change: 0, decay: true, max: 100, section: 'Innovation' },
    ];

    function valColor(v, max) {
        if (!max || max > 100) return 'var(--text-primary)';
        const pct = v / max * 100;
        if (pct >= 70) return 'var(--green)';
        if (pct >= 40) return 'var(--amber)';
        if (pct >= 20) return 'var(--orange, #d48a3c)';
        return 'var(--red)';
    }

    function changeHtml(change) {
        const n = parseFloat(change);
        const color = n > 0 ? 'var(--green)' : n < 0 ? 'var(--red)' : 'var(--text-dim)';
        const arrow = n > 0 ? '▲' : n < 0 ? '▼' : '–';
        return `<div class="stat-item__change">
            <span class="stat-item__dir" style="color:${color}">${arrow}</span>
            <span class="stat-item__delta" style="color:${color}">${Math.abs(n).toFixed(1)}</span>
        </div>`;
    }

    let html = '';

    for (const s of stats) {
        // Hero stat (reputation)
        if (s.isHero) {
            html += `
                <div class="stats-hero">
                    <div class="stats-hero__top">
                        <div style="display:flex;align-items:center;gap:6px;">
                            <span class="stats-hero__name">${s.label}</span>
                            ${s.decay ? '<span class="stat-item__decay">DECAYS</span>' : ''}
                        </div>
                        <div class="stats-hero__right">
                            <span class="stats-hero__val">${s.value}</span>
                            <span class="stats-hero__max">/100</span>
                            ${changeHtml(s.change)}
                        </div>
                    </div>
                    <div class="stats-hero__bar"><div class="stats-hero__bar-fill" style="width:${s.value}%"></div></div>
                </div>`;
            continue;
        }

        // Section header
        if (s.section) {
            html += `<div class="stats-section"><span class="stats-section__label">${s.section}</span></div>`;
        }

        // Regular stat row
        const hasMax = s.max && s.max <= 100;
        html += `
            <div class="stat-item">
                <div class="stat-item__left">
                    <div class="stat-item__name-row">
                        <span class="stat-item__name">${s.label}</span>
                        ${s.decay ? '<span class="stat-item__decay">DECAYS</span>' : ''}
                    </div>
                    ${s.nation ? '<span class="stat-item__nation">' + escapeHtml(s.nation) + '</span>' : ''}
                </div>
                <div class="stat-item__right">
                    <span class="stat-item__val" style="color:${hasMax ? valColor(s.value, s.max) : 'var(--text-primary)'}">${typeof s.value === 'number' ? s.value.toLocaleString() : s.value}</span>
                    ${hasMax ? '<span class="stat-item__max">/100</span>' : ''}
                    ${changeHtml(s.change)}
                </div>
            </div>`;
    }

    document.getElementById('stats-body').innerHTML = html;
}

function renderProperty(nation, nationName, faction, shard) {
    const s = (key) => Number(nation?.[key] ?? 50);
    const currentTick = shard?.current_tick || 0;
    const foundedTick = faction.founded_tick || currentTick;
    const TICKS_PER_YEAR = 12;
    const yearsSinceFounded = Math.max(0, (currentTick - foundedTick) / TICKS_PER_YEAR);

    const BASE_COST = 8_000_000;

    // Inflation compound: (1 + (inflation/100 × 0.05))^years
    const inflationStat = s('inflation');
    const inflationAnnual = 1 + (inflationStat / 100 * 0.05);
    const inflationCompound = Math.pow(inflationAnnual, yearsSinceFounded);

    // Stability multiplier: 1 + ((50 - stability) / 100 × 0.3)
    const stability = s('stability');
    const stabilityMult = 1 + ((50 - stability) / 100 * 0.3);

    // Unrest multiplier: 1 + (civil_unrest / 100 × 0.2)
    const unrest = s('civil_unrest');
    const unrestMult = 1 + (unrest / 100 * 0.2);

    const adjustedCost = Math.round(BASE_COST * inflationCompound * stabilityMult * unrestMult);

    function fmtBig(n) {
        if (Math.abs(n) >= 1_000_000) return '$' + (n / 1_000_000).toFixed(2) + 'M';
        if (Math.abs(n) >= 1000) return '$' + (n / 1000).toFixed(1) + 'k';
        return '$' + n.toLocaleString();
    }

    const natUp = (nationName || 'UNKNOWN').toUpperCase();

    document.getElementById('prop-body').innerHTML = `
        <div class="prop-asset">
            <div class="prop-asset__top">
                <div>
                    <div class="prop-asset__name">Corporate Headquarters</div>
                    <span class="prop-asset__nation">${escapeHtml(natUp)}</span>
                </div>
                <span class="prop-asset__badge">OWNED</span>
            </div>
            <div class="prop-cost-box">
                <div class="prop-cost-row">
                    <span class="prop-cost-row__label">BASE COST</span>
                    <span class="prop-cost-row__value" style="color:var(--text-muted);">$8,000,000</span>
                </div>
                <div class="prop-cost-row">
                    <span class="prop-cost-row__label">INFLATION (${escapeHtml(natUp)})</span>
                    <span class="prop-cost-row__value" style="color:${inflationStat > 50 ? 'var(--red)' : 'var(--green)'}">
                        ${inflationStat}/100 &mdash; &times;${inflationCompound.toFixed(2)}
                    </span>
                </div>
                <div class="prop-cost-row">
                    <span class="prop-cost-row__label">STABILITY (${escapeHtml(natUp)})</span>
                    <span class="prop-cost-row__value" style="color:${stability < 50 ? 'var(--red)' : 'var(--green)'}">
                        ${stability}/100 &mdash; &times;${stabilityMult.toFixed(2)}
                    </span>
                </div>
                <div class="prop-cost-row">
                    <span class="prop-cost-row__label">CIVIL UNREST (${escapeHtml(natUp)})</span>
                    <span class="prop-cost-row__value" style="color:${unrest > 20 ? 'var(--red)' : 'var(--green)'}">
                        ${unrest}/100 &mdash; &times;${unrestMult.toFixed(2)}
                    </span>
                </div>
                <div class="prop-cost-row" style="padding-top:4px;">
                    <span class="prop-cost-row__label" style="color:var(--text-muted);">ADJUSTED VALUE</span>
                    <span class="prop-cost-row__value" style="font-size:11px;font-weight:700;color:var(--text-bright);">${fmtBig(adjustedCost)}</span>
                </div>
            </div>
        </div>
        <div style="flex:1;"></div>
        <div class="prop-total">
            <span class="prop-total__label">Total Property Value</span>
            <span class="prop-total__value">${fmtBig(adjustedCost)}</span>
        </div>
    `;
}

// ── Tick countdown ──
let nextTickAt = null;
let tickInterval = null;

function startTickCountdown() {
    if (tickInterval) clearInterval(tickInterval);
    tickInterval = setInterval(updateCountdown, 1000);
    updateCountdown();
}

function updateCountdown() {
    const el = document.getElementById('tick-countdown');
    if (!el || !nextTickAt) { if (el) el.textContent = '—'; return; }
    const diff = nextTickAt - Date.now();
    if (diff <= 0) { el.textContent = 'Tick due...'; clearInterval(tickInterval); return; }
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    el.textContent = h + 'h ' + m + 'm ' + s + 's';
}

// ── Theme toggle ──
function toggleTheme() {
    document.body.classList.toggle('light-mode');
    const btn = document.getElementById('theme-toggle');
    btn.textContent = document.body.classList.contains('light-mode') ? 'Dark' : 'Light';
    localStorage.setItem('nationhood_theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
}
// Restore theme on load
if (localStorage.getItem('nationhood_theme') === 'light') {
    document.body.classList.add('light-mode');
    const btn = document.getElementById('theme-toggle');
    if (btn) btn.textContent = 'Dark';
}

async function saveSlogan() {
    const input = document.getElementById('slogan-input');
    const hint = document.getElementById('slogan-hint');
    const btn = document.getElementById('slogan-save-btn');
    const slogan = (input.value || '').trim().slice(0, 60);

    if (slogan.length === 0) {
        hint.textContent = 'Slogan cannot be empty.';
        hint.className = 'slogan-hint slogan-hint--error';
        return;
    }

    btn.disabled = true;
    btn.textContent = '...';
    hint.textContent = '';

    try {
        const { error } = await _supabase.from('factions').update({
            party_description: slogan,
            last_rename_tick: window._currentTick,
        }).eq('id', window._corpFactionId);

        if (error) throw error;

        document.getElementById('id-slogan').textContent = '"' + slogan + '"';
        hint.textContent = 'Slogan saved! Next change in 120 ticks.';
        hint.className = 'slogan-hint slogan-hint--ok';
        btn.textContent = 'Save';
        // Keep disabled after save (cooldown now active)
    } catch (err) {
        console.error('Slogan save failed:', err);
        hint.textContent = 'Failed to save slogan.';
        hint.className = 'slogan-hint slogan-hint--error';
        btn.disabled = false;
        btn.textContent = 'Save';
    }
}

async function doLogout() {
    await _supabase.auth.signOut();
    window.location.href = 'login.html';
}

window.doLogout = doLogout;
window.toggleTheme = toggleTheme;
window.saveSlogan = saveSlogan;

init();
</script>
