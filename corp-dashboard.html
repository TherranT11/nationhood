<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corporate Dashboard | Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400&family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter+Tight:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/corp-topbar.css">
<style>
/* ──────────────────────────────────────────────────────────
   CORP DASHBOARD — REDESIGN (Phase 1)
   All rules are scoped under body.corp-redesign so the
   bespoke palette / fonts do not leak into other corp pages.
   Class prefix: .cr-* (corp-redesign).
   ────────────────────────────────────────────────────────── */
body.corp-redesign {
  --cr-bg-primary:    #0d0e0c;
  --cr-bg-secondary:  #14150f;
  --cr-bg-card:       #1a1b14;
  --cr-bg-elevated:   #21221a;
  --cr-line:          #2c2d22;
  --cr-line-bright:   #3d3f30;
  --cr-text-primary:  #e8e3d3;
  --cr-text-secondary:#9a9580;
  --cr-text-tertiary: #6b6856;
  --cr-accent-gold:   #c9a449;
  --cr-accent-gold-dim:#8a722f;
  --cr-accent-red:    #c85a3a;
  --cr-accent-green:  #8aa653;
  --cr-accent-blue:   #5a7896;
  --cr-serif: 'Fraunces', Georgia, serif;
  --cr-sans:  'Inter Tight', system-ui, sans-serif;
  --cr-mono:  'JetBrains Mono', monospace;

  background: var(--cr-bg-primary);
  color: var(--cr-text-primary);
  font-family: var(--cr-sans);
  font-size: 14px;
  line-height: 1.45;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  margin: 0;
}

body.corp-redesign * { box-sizing: border-box; }

/* Subtle paper-grain overlay */
body.corp-redesign::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    radial-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
    radial-gradient(rgba(255,255,255,0.008) 1px, transparent 1px);
  background-size: 3px 3px, 7px 7px;
  background-position: 0 0, 1px 1px;
  pointer-events: none;
  z-index: 1;
  mix-blend-mode: overlay;
}

.cr-loading {
  font-family: var(--cr-mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--cr-text-tertiary);
  text-align: center;
  padding: 80px 20px;
}

.cr-layout {
  max-width: 1440px;
  margin: 0 auto;
  padding: 24px 36px 60px;
  position: relative;
  z-index: 2;
}

/* ── MASTHEAD ── */
.cr-masthead {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 40px;
  align-items: end;
  padding-bottom: 28px;
  border-bottom: 1px solid var(--cr-line);
  margin-bottom: 32px;
}
.cr-masthead-date {
  display: flex;
  align-items: baseline;
  gap: 14px;
  font-family: var(--cr-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--cr-text-secondary);
  padding-bottom: 12px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--cr-line);
}
.cr-masthead-date strong {
  color: var(--cr-text-primary);
  font-weight: 500;
}
.cr-masthead-date .cr-date-divider {
  color: var(--cr-line-bright);
}
.cr-masthead-eyebrow {
  font-family: var(--cr-mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--cr-accent-gold-dim);
  margin-bottom: 14px;
}
.cr-corp-name {
  font-family: var(--cr-serif);
  font-weight: 500;
  font-size: 68px;
  line-height: 0.92;
  letter-spacing: -0.02em;
  color: var(--cr-text-primary);
  margin: 0 0 16px;
}
.cr-corp-name em {
  font-style: italic;
  color: var(--cr-accent-gold);
}
.cr-corp-meta {
  display: flex;
  gap: 24px;
  font-family: var(--cr-mono);
  font-size: 11px;
  color: var(--cr-text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  flex-wrap: wrap;
}
.cr-corp-meta span strong {
  color: var(--cr-text-primary);
  font-weight: 500;
}

.cr-ticker-block {
  text-align: right;
  border-left: 1px solid var(--cr-line);
  padding-left: 32px;
  min-width: 200px;
}
.cr-ticker-symbol {
  font-family: var(--cr-mono);
  font-size: 14px;
  letter-spacing: 0.18em;
  color: var(--cr-text-tertiary);
  margin-bottom: 8px;
}
.cr-ticker-price {
  font-family: var(--cr-serif);
  font-weight: 400;
  font-size: 42px;
  color: var(--cr-text-primary);
  line-height: 1;
  margin-bottom: 6px;
  font-variant-numeric: tabular-nums;
}
.cr-ticker-change {
  font-family: var(--cr-mono);
  font-size: 12px;
  color: var(--cr-text-tertiary);
}

/* ── MAIN GRID ── */
.cr-main-grid {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 32px;
}

/* ── PANEL (shared) ── */
.cr-panel {
  background: var(--cr-bg-card);
  border: 1px solid var(--cr-line);
  padding: 22px;
  position: relative;
}
.cr-panel-corner {
  position: absolute;
  width: 8px; height: 8px;
  border-color: var(--cr-accent-gold-dim);
}
.cr-panel-corner-tl { top: -1px; left: -1px; border-top: 1px solid; border-left: 1px solid; }
.cr-panel-corner-tr { top: -1px; right: -1px; border-top: 1px solid; border-right: 1px solid; }
.cr-panel-corner-bl { bottom: -1px; left: -1px; border-bottom: 1px solid; border-left: 1px solid; }
.cr-panel-corner-br { bottom: -1px; right: -1px; border-bottom: 1px solid; border-right: 1px solid; }

.cr-panel-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--cr-line);
  margin-bottom: 18px;
}
.cr-panel-title {
  font-family: var(--cr-serif);
  font-style: italic;
  font-weight: 400;
  font-size: 18px;
  color: var(--cr-text-primary);
}
.cr-panel-meta {
  font-family: var(--cr-mono);
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--cr-text-tertiary);
}

.cr-placeholder {
  font-family: var(--cr-mono);
  font-size: 11px;
  color: var(--cr-text-tertiary);
  letter-spacing: 0.05em;
  padding: 40px 0;
  text-align: center;
  font-style: italic;
  text-transform: none;
}
.cr-placeholder strong {
  color: var(--cr-accent-gold-dim);
  font-weight: 500;
}

/* ── STATS SECTION (right column) ── */
.cr-stats-section {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

/* ── FINANCIAL ROW (Phase 2) ── */
.cr-financial-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}
.cr-fin-card {
  background: var(--cr-bg-card);
  border: 1px solid var(--cr-line);
  padding: 18px 18px 16px;
  position: relative;
  overflow: hidden;
}
.cr-fin-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 28px; height: 1px;
  background: var(--cr-accent-gold);
}
.cr-fin-card-label {
  font-family: var(--cr-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--cr-text-secondary);
  margin-bottom: 10px;
}
.cr-fin-card-value {
  font-family: var(--cr-serif);
  font-size: 32px;
  font-weight: 400;
  color: var(--cr-text-primary);
  line-height: 1;
  margin-bottom: 8px;
  font-variant-numeric: tabular-nums;
}
.cr-fin-currency {
  font-family: var(--cr-sans);
  font-size: 14px;
  color: var(--cr-text-tertiary);
  font-weight: 400;
  margin-right: 2px;
  vertical-align: top;
  line-height: 32px;
}
.cr-fin-suffix {
  font-size: 18px;
  color: var(--cr-text-tertiary);
}
.cr-fin-card-trend {
  font-family: var(--cr-mono);
  font-size: 10px;
  color: var(--cr-text-tertiary);
  letter-spacing: 0.05em;
  min-height: 14px;
}
.cr-fin-card-trend.positive { color: var(--cr-accent-green); }
.cr-fin-card-trend.negative { color: var(--cr-accent-red); }
.cr-sparkline {
  margin-top: 10px;
  height: 24px;
  width: 100%;
  opacity: 0.55;
  display: block;
}
.cr-sparkline-empty {
  margin-top: 10px;
  height: 24px;
  display: flex;
  align-items: center;
  font-family: var(--cr-mono);
  font-size: 9px;
  color: var(--cr-text-tertiary);
  letter-spacing: 0.05em;
  font-style: italic;
  opacity: 0.6;
}

/* ── OPERATING INDICATORS (Phase 3) ── */
.cr-perf-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--cr-line);
  border: 1px solid var(--cr-line);
}
.cr-perf-card {
  background: var(--cr-bg-card);
  padding: 22px 24px;
  position: relative;
}
.cr-perf-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 14px;
}
.cr-perf-name {
  font-family: var(--cr-serif);
  font-weight: 500;
  font-size: 17px;
  color: var(--cr-text-primary);
  letter-spacing: -0.01em;
}
.cr-perf-value {
  font-family: var(--cr-mono);
  font-weight: 400;
  font-size: 22px;
  color: var(--cr-accent-gold);
  font-variant-numeric: tabular-nums;
}
.cr-perf-value .cr-max {
  color: var(--cr-text-tertiary);
  font-size: 13px;
}
.cr-perf-meter {
  display: flex;
  gap: 3px;
  margin-bottom: 10px;
}
.cr-perf-meter-cell {
  flex: 1;
  height: 8px;
  background: var(--cr-bg-secondary);
  border: 1px solid var(--cr-line-bright);
}
.cr-perf-meter-cell.filled {
  background: var(--cr-accent-gold);
  border-color: var(--cr-accent-gold);
  box-shadow: 0 0 4px rgba(201, 164, 73, 0.4);
}
.cr-perf-meter-cell.filled.warn {
  background: var(--cr-accent-red);
  border-color: var(--cr-accent-red);
  box-shadow: 0 0 4px rgba(200, 90, 58, 0.4);
}
.cr-perf-meter-cell.filled.good {
  background: var(--cr-accent-green);
  border-color: var(--cr-accent-green);
  box-shadow: 0 0 4px rgba(138, 166, 83, 0.4);
}
.cr-perf-desc {
  font-size: 12px;
  line-height: 1.5;
  color: var(--cr-text-secondary);
  font-family: var(--cr-sans);
}
.cr-perf-desc strong {
  color: var(--cr-text-primary);
  font-weight: 500;
}
.cr-perf-trend-tag {
  position: absolute;
  top: 22px;
  right: 24px;
}
.cr-delta {
  font-family: var(--cr-mono);
  font-size: 10px;
  padding: 2px 6px;
  background: var(--cr-bg-elevated);
  border: 1px solid var(--cr-line-bright);
  color: var(--cr-text-secondary);
  letter-spacing: 0.05em;
}
.cr-delta.up   { color: var(--cr-accent-green); border-color: rgba(138, 166, 83, 0.3); }
.cr-delta.down { color: var(--cr-accent-red);   border-color: rgba(200, 90, 58, 0.3); }

/* ── OWNERSHIP CARD (sits inside the perf grid) ── */
.cr-ownership-bar {
  display: flex;
  height: 10px;
  margin-bottom: 16px;
  background: var(--cr-bg-secondary);
  border: 1px solid var(--cr-line);
}
.cr-ownership-bar > div {
  transition: opacity 0.15s;
}
.cr-ownership-bar > div:hover {
  opacity: 0.75;
}
.cr-ownership-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 0;
  padding: 0;
}
.cr-ownership-list li {
  display: grid;
  grid-template-columns: 8px 1fr auto;
  gap: 10px;
  align-items: center;
  font-size: 12px;
  line-height: 1;
}
.cr-ownership-swatch {
  width: 8px;
  height: 8px;
  border-radius: 1px;
}
.cr-ownership-name {
  color: var(--cr-text-primary);
  font-family: var(--cr-sans);
  font-size: 12px;
}
.cr-ownership-pct {
  font-family: var(--cr-mono);
  font-weight: 500;
  color: var(--cr-text-primary);
  font-variant-numeric: tabular-nums;
  font-size: 12px;
}
.cr-you-tag {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 5px;
  background: var(--cr-accent-gold);
  color: var(--cr-bg-primary);
  font-family: var(--cr-mono);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.1em;
  border-radius: 1px;
  vertical-align: middle;
}
.cr-ownership-empty {
  font-family: var(--cr-mono);
  font-size: 10px;
  color: var(--cr-text-tertiary);
  font-style: italic;
  padding: 8px 0;
}
.cr-section-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: -8px;
}
.cr-section-header h2 {
  font-family: var(--cr-serif);
  font-weight: 500;
  font-style: italic;
  font-size: 28px;
  color: var(--cr-text-primary);
  margin: 0;
}
.cr-section-header h2 .num {
  font-family: var(--cr-mono);
  font-style: normal;
  font-size: 14px;
  color: var(--cr-accent-gold-dim);
  margin-right: 12px;
  letter-spacing: 0.1em;
  vertical-align: middle;
}
.cr-section-header .desc {
  font-family: var(--cr-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--cr-text-tertiary);
}

/* ── FOOTER STRIP ── */
.cr-footer-strip {
  margin-top: 32px;
  padding: 14px 0;
  border-top: 1px solid var(--cr-line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--cr-mono);
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--cr-text-tertiary);
}
.cr-footer-strip em {
  font-family: var(--cr-serif);
  font-style: italic;
  color: var(--cr-accent-gold-dim);
  text-transform: none;
  letter-spacing: 0;
  font-size: 12px;
}

/* Responsive */
@media (max-width: 1100px) {
  .cr-main-grid { grid-template-columns: 1fr; }
  .cr-corp-name { font-size: 48px; }
}
@media (max-width: 720px) {
  .cr-layout { padding: 16px 18px 40px; }
  .cr-masthead { grid-template-columns: 1fr; }
  .cr-ticker-block { border-left: none; padding-left: 0; text-align: left; border-top: 1px solid var(--cr-line); padding-top: 18px; }
  .cr-corp-name { font-size: 38px; }
}
</style>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { escapeHtml, tickToDate } from './js/utils.js';

let faction = null;
let nation = null;
let shard = null;
let allUserFactions = [];

function fmtMoney(n) {
    const num = Number(n) || 0;
    const sign = num < 0 ? '-' : '';
    const abs = Math.abs(num);
    if (abs >= 1e9) return sign + '$' + (abs / 1e9).toFixed(2) + 'B';
    if (abs >= 1e6) return sign + '$' + (abs / 1e6).toFixed(2) + 'M';
    if (abs >= 1e3) return sign + '$' + (abs / 1e3).toFixed(1) + 'k';
    return sign + '$' + Math.round(abs).toLocaleString();
}

// Split a money value into ($)(value)(suffix) for the masthead/fin-card
// styling that wants the dollar sign and unit suffix smaller than the
// numeric portion.
function fmtMoneyParts(n) {
    const num = Number(n) || 0;
    const sign = num < 0 ? '-' : '';
    const abs = Math.abs(num);
    if (abs >= 1e9)  return { sign, value: (abs / 1e9).toFixed(1), suffix: 'B' };
    if (abs >= 1e6)  return { sign, value: (abs / 1e6).toFixed(1), suffix: 'M' };
    if (abs >= 1e3)  return { sign, value: (abs / 1e3).toFixed(1), suffix: 'k' };
    return { sign, value: Math.round(abs).toLocaleString(), suffix: '' };
}

function renderMoneyHtml(n) {
    const { sign, value, suffix } = fmtMoneyParts(n);
    const suffixHtml = suffix ? `<span class="cr-fin-suffix">${suffix}</span>` : '';
    return `<span class="cr-fin-currency">${sign}$</span>${value}${suffixHtml}`;
}

function renderSparklineSvg(series, colorVar) {
    // null series = "this card has no historical series at all" (e.g. debt
    // is not tracked in corp_pnl_history). Render nothing so the card is
    // not visually cluttered with a meaningless empty state.
    if (series === null) return '';
    if (!Array.isArray(series) || series.length < 2) {
        return '<div class="cr-sparkline-empty">— no history yet</div>';
    }
    const w = 120, h = 24;
    let min = Infinity, max = -Infinity;
    for (const v of series) {
        const n = Number(v);
        if (Number.isFinite(n)) {
            if (n < min) min = n;
            if (n > max) max = n;
        }
    }
    if (!Number.isFinite(min) || !Number.isFinite(max)) {
        return '<div class="cr-sparkline-empty">— no history yet</div>';
    }
    const range = max - min || 1;
    const points = series.map((v, i) => {
        const x = (i / (series.length - 1)) * w;
        const y = h - ((Number(v) - min) / range) * h;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    return `<svg class="cr-sparkline" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
        <polyline points="${points}" fill="none" stroke="${colorVar}" stroke-width="1.2"/>
    </svg>`;
}

// tickToDate returns 'MMM, YYYY' (e.g. 'Mar, 2026'). Pull just the year for
// "Founded 1924" style display in the masthead meta row.
function tickToYear(tick) {
    if (tick == null) return null;
    const formatted = tickToDate(tick); // 'Mar, 2026'
    const parts = formatted.split(',');
    return (parts[1] || formatted).trim();
}

// Italicize the last word of the corp name in accent-gold for the masthead
// display (matches the mockup's "Volkov *Industries*" treatment).
function renderCorpNameHtml(name) {
    if (!name) return 'Unnamed Corporation';
    const trimmed = name.trim();
    if (!trimmed) return 'Unnamed Corporation';
    const parts = trimmed.split(/\s+/);
    if (parts.length === 1) {
        return `<em>${escapeHtml(parts[0])}</em>`;
    }
    const last = parts.pop();
    return `${escapeHtml(parts.join(' '))} <em>${escapeHtml(last)}</em>`;
}

async function init() {
    const { data: { user } } = await _supabase.auth.getUser();
    if (!user) { window.location.href = 'login.html'; return; }

    // Inspector-mode override (?faction_id= for admin impersonation).
    const url = new URL(location.href);
    const inspectFactionId = url.searchParams.get('faction_id');

    // User's own factions (primary id match OR linked secondary corp).
    const { data: ownedFactions, error: factionsErr } = await _supabase
        .from('factions')
        .select('*')
        .or(`id.eq.${user.id},linked_user_id.eq.${user.id}`);

    if (factionsErr) {
        showFatal('Failed to load factions: ' + factionsErr.message);
        return;
    }
    allUserFactions = (ownedFactions || []).filter(f => f.nation_id);

    // Pick the active corp: ?faction_id= override, then any user-owned corp.
    if (inspectFactionId) {
        const { data: inspected, error: inspectErr } = await _supabase
            .from('factions').select('*').eq('id', inspectFactionId).single();
        if (inspectErr || !inspected) {
            showFatal('Inspector faction not found.');
            return;
        }
        faction = inspected;
    } else {
        faction = allUserFactions.find(f => f.faction_type === 'corporation');
    }

    if (!faction || faction.faction_type !== 'corporation') {
        showFatal('No corporation linked to this account.');
        return;
    }

    // Shard + nation + per-tick P&L history + ownership in parallel.
    const [shardRes, nationRes, pnlRes, ownershipRes] = await Promise.all([
        _supabase.from('shard')
            .select('current_tick, current_date, name')
            .eq('name', 'Alpha Shard').single(),
        faction.nation_id
            ? _supabase.from('nations')
                .select('id, name, capital')
                .eq('id', faction.nation_id).single()
            : Promise.resolve({ data: null, error: null }),
        _supabase.from('corp_pnl_history')
            .select('tick, revenue, costs, wages, cash_start, cash_end')
            .eq('corp_id', faction.id)
            .order('tick', { ascending: false })
            .limit(12),
        _supabase.from('corp_ownership')
            .select('holder_type, holder_id, pct')
            .eq('corp_id', faction.id)
            .order('pct', { ascending: false }),
    ]);
    if (shardRes.error) {
        showFatal('Failed to load shard: ' + shardRes.error.message);
        return;
    }
    shard = shardRes.data;
    nation = nationRes?.data || null;
    if (pnlRes?.error) {
        console.error('[corp-dashboard] pnl_history fetch error:', pnlRes.error.message);
    }
    if (ownershipRes?.error) {
        console.error('[corp-dashboard] corp_ownership fetch error:', ownershipRes.error.message);
    }
    // Reverse so oldest-first for sparkline left-to-right.
    const pnlHistory = (pnlRes?.data || []).slice().reverse();
    const ownership  = ownershipRes?.data || [];

    // Mount the shared corp topbar.
    const topbarContainer = document.getElementById('corp-topbar-container');
    if (topbarContainer) {
        try {
            const { renderCorpTopBar } = await import('./js/corp-topbar.js');
            renderCorpTopBar(topbarContainer, {
                faction, shard, activeTab: 'home', allUserFactions,
            });
        } catch (e) {
            console.error('[corp-dashboard] topbar render failed:', e);
        }
    }

    renderMasthead();
    renderFinancialRow(pnlHistory);
    renderOperatingIndicators(ownership, user.id);
    renderFooter();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('page-content').style.display = '';
}

function renderMasthead() {
    // Current in-game date + tick at top of masthead.
    const dateStr = shard?.current_date || tickToDate(shard?.current_tick) || '—';
    document.getElementById('cr-current-date').textContent = dateStr;
    document.getElementById('cr-current-tick').textContent =
        shard?.current_tick != null ? String(shard.current_tick) : '—';

    const sector = faction.corp_sector || 'Unspecified Sector';
    document.getElementById('cr-sector').textContent = `— ${sector} —`;

    document.getElementById('cr-corp-name').innerHTML =
        renderCorpNameHtml(faction.faction_name);

    document.getElementById('cr-founded').textContent =
        tickToYear(faction.founded_tick) || '—';
    document.getElementById('cr-hq').textContent =
        nation?.capital || nation?.name || '—';
    document.getElementById('cr-ticker-text').textContent =
        faction.corp_ticker || faction.abbreviation || '—';

    const ticker = faction.corp_ticker || faction.abbreviation || '—';
    document.getElementById('cr-ticker-symbol').textContent = ticker;

    const cash = Number(faction.corp_cash_reserves) || 0;
    const debt = Number(faction.corp_debt) || 0;
    const valuation = cash - debt;
    document.getElementById('cr-ticker-price').textContent = fmtMoney(valuation);
    // Delta vs last tick will land in Phase 2 once corp_pnl_history is wired.
    document.getElementById('cr-ticker-change').textContent =
        '— · valuation (cash − debt)';
}

function renderFinancialRow(history) {
    // Current-tick values from the corp row.
    const cash    = Number(faction.corp_cash_reserves) || 0;
    const revenue = Number(faction.corp_revenue_current_tick) || 0;
    const costs   = Number(faction.corp_costs_current_tick) || 0;
    const wages   = Number(faction.corp_wages_current_tick) || 0;
    const debt    = Number(faction.corp_debt) || 0;
    const opex    = costs + wages;

    // Most recent prior-tick row (history is oldest-first; last entry is the
    // most recent prior tick). Used for the per-card "vs last tick" delta.
    const prev = history.length > 0 ? history[history.length - 1] : null;
    const prevCash    = prev ? Number(prev.cash_end) : null;
    const prevRevenue = prev ? Number(prev.revenue) : null;
    const prevOpex    = prev ? (Number(prev.costs) + Number(prev.wages)) : null;

    // Sparkline series (oldest-first across `history`).
    const cashSeries    = history.map(h => Number(h.cash_end));
    const revenueSeries = history.map(h => Number(h.revenue));
    const opexSeries    = history.map(h => Number(h.costs) + Number(h.wages));

    const row = document.getElementById('cr-fin-row');
    if (!row) return;

    row.innerHTML = [
        renderFinCard({
            label: 'Cash',
            value: cash,
            prev: prevCash,
            series: cashSeries,
            colorVar: 'var(--cr-accent-green)',
            invert: false,
        }),
        renderFinCard({
            label: 'Revenue',
            value: revenue,
            prev: prevRevenue,
            series: revenueSeries,
            colorVar: 'var(--cr-accent-gold)',
            invert: false,
        }),
        renderFinCard({
            label: 'Costs & Wages',
            value: opex,
            prev: prevOpex,
            series: opexSeries,
            colorVar: 'var(--cr-accent-red)',
            invert: true,  // higher costs are bad
        }),
        renderFinCard({
            label: 'Outstanding Debt',
            value: debt,
            // No debt-history column in corp_pnl_history — pass null series so
            // the sparkline area is suppressed entirely (not just empty).
            prev: null,
            series: null,
            colorVar: 'var(--cr-text-tertiary)',
            invert: true,
            staticTrend: debt > 0 ? '— outstanding' : '— debt-free',
        }),
    ].join('');
}

function renderFinCard({ label, value, prev, series, colorVar, invert, staticTrend }) {
    let trendHtml;
    let trendClass = '';
    if (staticTrend) {
        trendHtml = staticTrend;
    } else if (prev == null) {
        trendHtml = '— no prior tick yet';
    } else {
        const delta = Number(value) - Number(prev);
        if (delta === 0) {
            trendHtml = '— unchanged vs last tick';
        } else {
            const arrow = delta > 0 ? '▲' : '▼';
            const sign  = delta > 0 ? '+' : '';
            const isGood = invert ? delta < 0 : delta > 0;
            trendClass = isGood ? 'positive' : 'negative';
            trendHtml = `${arrow} ${sign}${fmtMoney(delta)} vs last tick`;
        }
    }

    return `<div class="cr-fin-card">
        <div class="cr-fin-card-label">${escapeHtml(label)}</div>
        <div class="cr-fin-card-value">${renderMoneyHtml(value)}</div>
        <div class="cr-fin-card-trend ${trendClass}">${trendHtml}</div>
        ${renderSparklineSvg(series, colorVar)}
    </div>`;
}

// Categorize a 0-10 score into a meter color band. Used by renderPerfCard
// to drive the per-cell .filled.warn / .filled / .filled.good classes.
function scoreBand(score) {
    if (score >= 7) return 'good';
    if (score >= 4) return 'mid';
    return 'warn';
}

// Generate a short context blurb from the score band so the card has copy
// without needing a narrative-events feed (event-driven flavor text lands
// later, alongside the dispatches feed in Phase 4).
function scoreBlurb(label, score) {
    const band = scoreBand(score);
    const map = {
        good: { 'Innovation':     '<strong>Strong R&D pipeline.</strong> Industry-leading research output.',
                'Market Share':   '<strong>Sector leader.</strong> Dominant position with pricing power.',
                'Reputation':     '<strong>Trusted operator.</strong> Premium standing with regulators and the public.',
                'Productivity':   '<strong>High output per worker.</strong> Operations running well above average.',
                'Employee Wages': '<strong>Above industry median.</strong> Talent retention is strong.',
                'Assets':         '<strong>Substantial holdings.</strong> Strong collateral and capacity.' },
        mid:  { 'Innovation':     '<strong>Steady output.</strong> Holding pace with the sector.',
                'Market Share':   '<strong>Mid-tier presence.</strong> Defensible but not dominant.',
                'Reputation':     '<strong>Mixed standing.</strong> No major scandals, no breakout goodwill.',
                'Productivity':   '<strong>Average efficiency.</strong> Room for operational gains.',
                'Employee Wages': '<strong>Industry-standard pay.</strong> No flight risk, no extra loyalty.',
                'Assets':         '<strong>Adequate holdings.</strong> Workable but room to grow.' },
        warn: { 'Innovation':     '<strong>Stagnating R&D.</strong> Competitors are pulling ahead.',
                'Market Share':   '<strong>Marginal player.</strong> Vulnerable to consolidation.',
                'Reputation':     '<strong>Reputation under pressure.</strong> Recovery requires investment.',
                'Productivity':   '<strong>Underperforming.</strong> Costs eating into output.',
                'Employee Wages': '<strong>Below market.</strong> Turnover risk and morale issues.',
                'Assets':         '<strong>Lean operation.</strong> Limited collateral and capacity.' },
    };
    return (map[band] && map[band][label]) || '';
}

function renderPerfMeter(score) {
    // Floor to integer count of filled cells; max 10.
    const filled = Math.max(0, Math.min(10, Math.round(Number(score) || 0)));
    const band = scoreBand(score);
    const cellClass = band === 'good' ? 'filled good'
                    : band === 'warn' ? 'filled warn'
                    : 'filled';
    const cells = [];
    for (let i = 0; i < 10; i++) {
        cells.push(`<div class="cr-perf-meter-cell${i < filled ? ' ' + cellClass : ''}"></div>`);
    }
    return `<div class="cr-perf-meter">${cells.join('')}</div>`;
}

function renderPerfCard(label, score) {
    const num = Number(score) || 0;
    const display = Number.isInteger(num) ? num.toString() : num.toFixed(1);
    // Per-stat delta requires per-tick stat history (not yet stored).
    // Show a neutral em-dash placeholder until a corp_stat_history table lands.
    const deltaTag = `<span class="cr-delta cr-perf-trend-tag">— —</span>`;
    return `<div class="cr-perf-card">
        ${deltaTag}
        <div class="cr-perf-header">
            <div class="cr-perf-name">${escapeHtml(label)}</div>
            <div class="cr-perf-value">${escapeHtml(display)}<span class="cr-max">/10</span></div>
        </div>
        ${renderPerfMeter(num)}
        <div class="cr-perf-desc">${scoreBlurb(label, num)}</div>
    </div>`;
}

// Map a corp_ownership.holder_type to a swatch color. Keeps the bar and the
// list visually aligned to a small fixed palette regardless of how many
// stakeholders are present.
const OWNERSHIP_COLORS = {
    player:       'var(--cr-accent-gold)',
    state:        '#5a7896',
    shareholders: '#8a722f',
    rival_corp:   'var(--cr-accent-red)',
    other:        '#6b6856',
};

function ownershipColor(holderType) {
    return OWNERSHIP_COLORS[holderType] || OWNERSHIP_COLORS.other;
}

function ownershipLabel(holder) {
    const nationName = nation?.name || 'the State';
    switch (holder.holder_type) {
        case 'player':       return 'You';
        case 'state':        return `State of ${escapeHtml(nationName)}`;
        case 'shareholders': return 'Public Shareholders';
        case 'rival_corp':   return 'Rival Corporation';
        case 'other':        return 'Other';
        default:             return escapeHtml(holder.holder_type || 'Unknown');
    }
}

function renderOwnershipCard(ownership, currentUserId) {
    if (!ownership || ownership.length === 0) {
        return `<div class="cr-perf-card">
            <div class="cr-perf-header">
                <div class="cr-perf-name">Ownership</div>
                <div class="cr-perf-value">—<span class="cr-max">%</span></div>
            </div>
            <div class="cr-ownership-empty">No ownership data on file.</div>
        </div>`;
    }

    // Total a player's stake (if any) for the headline value.
    const playerShare = ownership
        .filter(o => o.holder_type === 'player' && o.holder_id === currentUserId)
        .reduce((sum, o) => sum + Number(o.pct || 0), 0);
    const headline = playerShare > 0 ? playerShare.toFixed(0) : '—';

    const barSegments = ownership.map(o => {
        const pct = Number(o.pct) || 0;
        const color = ownershipColor(o.holder_type);
        return `<div style="width:${pct}%;background:${color};" title="${ownershipLabel(o)} — ${pct.toFixed(1)}%"></div>`;
    }).join('');

    const listItems = ownership.map(o => {
        const pct   = Number(o.pct) || 0;
        const color = ownershipColor(o.holder_type);
        const isYou = o.holder_type === 'player' && o.holder_id === currentUserId;
        const youTag = isYou ? '<span class="cr-you-tag">YOU</span>' : '';
        return `<li>
            <span class="cr-ownership-swatch" style="background:${color};"></span>
            <span class="cr-ownership-name">${ownershipLabel(o)}${youTag}</span>
            <span class="cr-ownership-pct">${pct.toFixed(1)}%</span>
        </li>`;
    }).join('');

    return `<div class="cr-perf-card">
        <div class="cr-perf-header">
            <div class="cr-perf-name">Ownership</div>
            <div class="cr-perf-value">${headline}<span class="cr-max">%</span></div>
        </div>
        <div class="cr-ownership-bar">${barSegments}</div>
        <ul class="cr-ownership-list">${listItems}</ul>
    </div>`;
}

function renderOperatingIndicators(ownership, currentUserId) {
    const grid = document.getElementById('cr-perf-grid');
    if (!grid) return;

    grid.innerHTML = [
        renderPerfCard('Innovation',     faction.corp_innovation),
        renderPerfCard('Market Share',   faction.corp_market_share),
        renderPerfCard('Reputation',     faction.corp_reputation),
        renderPerfCard('Productivity',   faction.corp_productivity),
        renderPerfCard('Employee Wages', faction.corp_employee_wages),
        renderPerfCard('Assets',         faction.corp_assets),
        renderOwnershipCard(ownership, currentUserId),
    ].join('');
}

function renderFooter() {
    document.getElementById('cr-audit-date').textContent =
        shard?.current_date || tickToDate(shard?.current_tick) || '—';
    document.getElementById('cr-footer-tick').textContent =
        shard?.current_tick != null ? `TICK ${shard.current_tick}` : '—';
}

function showFatal(msg) {
    const el = document.getElementById('loading');
    el.textContent = msg;
    el.style.color = 'var(--cr-accent-red)';
}

init().catch(err => {
    console.error('[corp-dashboard] init failed:', err);
    showFatal('Failed to load: ' + (err?.message || 'unknown error'));
});
</script>
