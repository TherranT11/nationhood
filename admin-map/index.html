<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nationhood — Cartographer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@400&family=Spectral:wght@300;400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#0F1417; --ink2:#151C20; --ink3:#1B2429; --line:#33413F;
    --vellum:#E6E0D0; --vellum-dim:#9AA39B; --brass:#C8A15A; --brass-dim:#8A6E3C;
    --seal:#9B3B33; --plague:#8DA85C; --ocean:#132C3C; --coast:#2E5468;
    --display:'Grenze Gotisch',Georgia,serif; --body:'Spectral',Georgia,serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--vellum); font-family:var(--body); padding:20px; }
  :focus-visible { outline:1px solid var(--brass); outline-offset:2px; }
  .mono { font-family:var(--mono); }
  input, select { outline:none; }
  input:focus, select:focus { border-color:var(--brass); }

  .titlebar { display:flex; align-items:baseline; gap:14px; margin-bottom:16px; }
  .titlebar .name { font-family:var(--display); font-size:28px; }
  .titlebar .sub { font-family:var(--mono); font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:var(--vellum-dim); }

  .checking { font-family:var(--mono); font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--vellum-dim); }

  .wrap { display:grid; grid-template-columns:226px 1fr; gap:18px; }
  @media (max-width:820px) { .wrap { grid-template-columns:1fr; } }

  .toolbar { border:1px solid var(--line); background:var(--ink2); padding:14px; align-self:start; }
  .head { font-family:var(--mono); font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:var(--vellum-dim); margin:18px 0 9px; }
  .head:first-child { margin-top:0; }
  .tbtn { width:100%; text-align:left; background:transparent; border:1px solid var(--line); color:var(--vellum-dim);
    padding:9px 11px; font-size:12px; font-family:inherit; cursor:pointer; margin-bottom:6px;
    transition:border-color 140ms ease, color 140ms ease; }
  .tbtn:hover { border-color:var(--brass-dim); color:var(--vellum); }
  .tbtn.active { background:var(--ink3); border-color:var(--brass); color:var(--vellum); }
  .tbtn.danger { border-color:var(--seal); color:var(--seal); }
  .swatches { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:2px; }
  .swatch { height:30px; cursor:pointer; border:1px solid var(--line); }
  .swatch.active { border-color:var(--vellum); }
  .swatch-name { font-family:var(--mono); font-size:10px; color:var(--vellum-dim); margin-top:7px; }

  .map { width:100%; height:auto; display:block; border:1px solid var(--line); background:var(--ocean); touch-action:none; }
  .inspector { margin-top:14px; border:1px solid var(--line); background:var(--ink2); padding:14px;
    display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap; }
  .insp-k { font-family:var(--mono); font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--vellum-dim); margin-bottom:7px; }
  .insp-input { width:100%; box-sizing:border-box; background:var(--ink); border:1px solid var(--line); color:var(--vellum); padding:10px 12px; font-size:15px; font-family:inherit; }
  .insp-select { background:var(--ink); border:1px solid var(--line); color:var(--vellum); padding:10px 12px; font-size:14px; font-family:inherit; }
  .insp-help { font-family:var(--mono); font-size:12px; color:var(--vellum-dim); line-height:1.8; }
  .counts { font-family:var(--mono); font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--vellum-dim);
    margin-top:10px; display:flex; gap:20px; flex-wrap:wrap; }
</style>
</head>
<body>
  <div class="titlebar">
    <span class="name">Cartographer</span>
    <span class="sub">Nationhood · map maker</span>
  </div>

  <div class="checking" id="checking">Checking access…</div>

  <div class="wrap" id="app" hidden>
    <!-- toolbar built by JS -->
    <div class="toolbar" id="toolbar"></div>

    <div>
      <svg class="map" id="map" viewBox="0 0 1200 800">
        <defs>
          <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
            <path d="M50 0 H0 V50" fill="none" stroke="#33413F" stroke-width="0.5" opacity="0.28"/>
          </pattern>
          <pattern id="swell" width="120" height="60" patternUnits="userSpaceOnUse">
            <path d="M0 30 q30 -10 60 0 t60 0" fill="none" stroke="#2E5468" stroke-width="1" opacity="0.22"/>
          </pattern>
        </defs>
        <rect width="1200" height="800" fill="#132C3C"/>
        <rect width="1200" height="800" fill="url(#swell)"/>
        <g id="dyn"></g>
      </svg>

      <div class="inspector" id="inspector"></div>

      <div class="counts" id="counts"></div>
    </div>
  </div>

  <script type="module">
    import { currentUser } from '../supabase.js';

    const ADMIN_EMAIL = 'therrant@gmail.com';
    const T = { ink:'#0F1417', vellum:'#E6E0D0', brass:'#C8A15A', seal:'#9B3B33', coast:'#2E5468' };
    const VW = 1200, VH = 800, SNAP = 26;

    const TYPES = {
      humanTown:    { label:'Human town',    color:'#C8A15A', r:5 },
      humanCity:    { label:'Human city',    color:'#C8A15A', r:8 },
      humanCapital: { label:'Human capital', color:'#C8A15A', r:11 },
      orcVillage:   { label:'Orc village',   color:'#9B3B33', r:6 },
      orcTribe:     { label:'Orc tribe',     color:'#9B3B33', r:10 },
    };
    const FILLS = [
      { name:'Human',    stroke:'#C8A15A', fill:'rgba(200,161,90,0.16)' },
      { name:'Orc',      stroke:'#9B3B33', fill:'rgba(155,59,51,0.18)' },
      { name:'Elf',      stroke:'#8DA85C', fill:'rgba(141,168,92,0.15)' },
      { name:'Dwarf',    stroke:'#7E93A8', fill:'rgba(126,147,168,0.15)' },
      { name:'Neutral',  stroke:'#9AA39B', fill:'rgba(154,163,155,0.12)' },
      { name:'Blighted', stroke:'#6B5B8A', fill:'rgba(107,91,138,0.18)' },
    ];
    const LANDS = [
      { name:'Green', fill:'#2C3A2B', stroke:'#4A5C42' },
      { name:'Plain', fill:'#3A3A2C', stroke:'#5C5A43' },
      { name:'Waste', fill:'#3A322B', stroke:'#5C4E42' },
      { name:'Stone', fill:'#2E343A', stroke:'#4C555C' },
      { name:'Frost', fill:'#333F44', stroke:'#556A70' },
      { name:'Blight',fill:'#332B3A', stroke:'#524563' },
    ];

    let uid = 0;
    const nextId = () => 'id' + (++uid);
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    const state = {
      tool:'humanTown', settlements:[], landmasses:[], terrain:0, roads:[], borders:[],
      draft:null, sel:null, palette:0, labels:true, history:[],
    };
    let dragId = null;
    const svg = $('map'), dyn = $('dyn');

    const toPath = (pts, close) =>
      pts.map((p,i) => (i===0?'M':'L') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ') + (close ? ' Z' : '');

    function markerSvg(type, selected) {
      const c = TYPES[type].color, ring = selected ? T.vellum : c;
      const selRing = (r) => selected ? `<circle r="${r}" fill="none" stroke="${T.vellum}" stroke-width="1" opacity="0.7"/>` : '';
      if (type === 'humanCapital') return `<circle r="15" fill="none" stroke="${ring}" stroke-width="1" opacity="0.6"/>`
        + `<circle r="10" fill="${T.ink}" stroke="${c}" stroke-width="2"/>`
        + `<path d="M-5 3 L-4 -4 L-1.5 -0.5 L0 -5 L1.5 -0.5 L4 -4 L5 3 Z" fill="${c}"/>`;
      if (type === 'humanCity') return selRing(14) + `<circle r="8" fill="${T.ink}" stroke="${c}" stroke-width="2"/><circle r="3" fill="${c}"/>`;
      if (type === 'humanTown') return selRing(11) + `<circle r="5" fill="${c}" stroke="${T.ink}" stroke-width="1.5"/>`;
      if (type === 'orcTribe') return selRing(16) + `<path d="M0 -12 L11 7 L-11 7 Z" fill="${T.ink}" stroke="${c}" stroke-width="2" stroke-linejoin="round"/><path d="M0 -4 L4 4 L-4 4 Z" fill="${c}"/>`;
      return selRing(12) + `<path d="M0 -7 L6 5 L-6 5 Z" fill="${c}" stroke="${T.ink}" stroke-width="1.5" stroke-linejoin="round"/>`;
    }

    // ---- render ----
    function renderMap() {
      let s = '';
      state.landmasses.forEach((l) => {
        s += `<path d="${toPath(l.points,true)}" fill="none" stroke="${T.coast}" stroke-width="9" stroke-linejoin="round" opacity="0.55"/>`;
        s += `<path d="${toPath(l.points,true)}" fill="${l.fill}" stroke="${l.stroke}" stroke-width="1.5" stroke-linejoin="round"/>`;
      });
      s += `<rect width="${VW}" height="${VH}" fill="url(#grid)"/>`;
      state.borders.forEach((b) => { s += `<path d="${toPath(b.points,true)}" fill="${b.fill}" stroke="${b.stroke}" stroke-width="1.5" stroke-linejoin="round"/>`; });
      state.roads.forEach((r) => { s += `<path d="${toPath(r.points,false)}" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`; });
      if (state.draft) {
        const d = state.draft;
        const fill = d.kind === 'border' ? FILLS[state.palette].fill : d.kind === 'land' ? LANDS[state.terrain].fill : 'none';
        const stroke = d.kind === 'border' ? FILLS[state.palette].stroke : d.kind === 'land' ? LANDS[state.terrain].stroke : '#000000';
        s += `<path d="${toPath(d.points, d.kind!=='road')}" fill="${fill}" stroke="${stroke}" stroke-width="${d.kind==='road'?2.5:1.5}" stroke-dasharray="6 4" stroke-linecap="round"/>`;
      }
      state.settlements.forEach((st) => {
        s += `<g data-id="${st.id}" transform="translate(${st.x} ${st.y})" style="cursor:${state.tool==='select'?'move':'pointer'}">`;
        s += markerSvg(st.type, state.sel === st.id);
        if (state.labels) s += `<text x="${TYPES[st.type].r+8}" y="4" font-family="var(--mono)" font-size="13" fill="${state.sel===st.id?T.vellum:'#CFD6CE'}" stroke="${T.ink}" stroke-width="3" paint-order="stroke" style="pointer-events:none">${esc(st.name)}</text>`;
        s += `</g>`;
      });
      dyn.innerHTML = s;
      svg.style.cursor = state.tool === 'select' ? 'default' : 'crosshair';
    }

    function renderInspector() {
      const el = $('inspector');
      const sel = state.sel ? state.settlements.find((x) => x.id === state.sel) : null;
      if (!sel) {
        el.innerHTML = `<div class="insp-help">Draw a landmass first, then place settlements on it · Travel line drags roads between towns · Border encloses and tints territory · Select to move or rename</div>`;
        return;
      }
      el.innerHTML =
        `<div style="flex:1;min-width:220px"><div class="insp-k">Settlement name</div><input class="insp-input" id="insp-name" value="${esc(sel.name)}"></div>` +
        `<div><div class="insp-k">Type</div><select class="insp-select" id="insp-type">` +
          Object.entries(TYPES).map(([k,v]) => `<option value="${k}"${k===sel.type?' selected':''}>${v.label}</option>`).join('') +
        `</select></div>` +
        `<button class="tbtn danger" id="insp-del" style="width:120px;margin-bottom:0">Delete</button>`;
      $('insp-name').addEventListener('input', (e) => { sel.name = e.target.value; renderMap(); });
      $('insp-type').addEventListener('change', (e) => { sel.type = e.target.value; renderMap(); });
      $('insp-del').addEventListener('click', removeSelected);
    }

    function renderCounts() {
      $('counts').innerHTML =
        `<span>${state.landmasses.length} landmasses</span><span>${state.settlements.length} settlements</span>` +
        `<span>${state.roads.length} travel lines</span><span>${state.borders.length} borders</span>` +
        `<span style="margin-left:auto">Ctrl/Cmd + Z to undo · Del to remove</span>`;
    }

    function refreshToolbarActive() {
      document.querySelectorAll('[data-tool]').forEach((b) => b.classList.toggle('active', b.dataset.tool === state.tool));
      document.querySelectorAll('[data-terrain]').forEach((b) => b.classList.toggle('active', +b.dataset.terrain === state.terrain));
      document.querySelectorAll('[data-palette]').forEach((b) => b.classList.toggle('active', +b.dataset.palette === state.palette));
      $('terrain-name').textContent = LANDS[state.terrain].name;
      $('palette-name').textContent = FILLS[state.palette].name;
      $('labels-btn').classList.toggle('active', state.labels);
      $('labels-btn').textContent = state.labels ? 'Hide names' : 'Show names';
    }

    function render() { renderMap(); renderInspector(); renderCounts(); refreshToolbarActive(); }

    // ---- history ----
    function snapshot() {
      state.history.push(JSON.parse(JSON.stringify({
        settlements: state.settlements, roads: state.roads, borders: state.borders, landmasses: state.landmasses,
      })));
      if (state.history.length > 40) state.history.shift();
    }
    function undo() {
      const last = state.history.pop();
      if (!last) return;
      state.settlements = last.settlements; state.roads = last.roads; state.borders = last.borders; state.landmasses = last.landmasses;
      state.sel = null; render();
    }
    function undoLastOf(key) { snapshot(); state[key] = state[key].slice(0, -1); render(); }
    function removeSelected() { if (!state.sel) return; snapshot(); state.settlements = state.settlements.filter((x) => x.id !== state.sel); state.sel = null; render(); }

    // ---- geometry / pointer ----
    const ptOf = (e) => { const r = svg.getBoundingClientRect(); return [((e.clientX-r.left)/r.width)*VW, ((e.clientY-r.top)/r.height)*VH]; };
    function snapToSettlement([x,y]) {
      let best = null, bd = SNAP;
      for (const s of state.settlements) { const d = Math.hypot(s.x-x, s.y-y); if (d < bd) { bd = d; best = s; } }
      return best ? [best.x, best.y] : [x, y];
    }

    function onDown(e) {
      if (e.button === 2) return;
      const p = ptOf(e);
      svg.setPointerCapture(e.pointerId);
      if (TYPES[state.tool]) {
        snapshot();
        const id = nextId();
        const n = state.settlements.filter((s) => s.type === state.tool).length + 1;
        state.settlements.push({ id, type: state.tool, x: p[0], y: p[1], name: `${TYPES[state.tool].label} ${n}` });
        state.sel = id; render();
        const inp = $('insp-name'); if (inp) inp.select();
        return;
      }
      if (state.tool === 'land')   { state.draft = { kind:'land',   points:[p] }; render(); return; }
      if (state.tool === 'road')   { state.draft = { kind:'road',   points:[snapToSettlement(p)] }; render(); return; }
      if (state.tool === 'border') { state.draft = { kind:'border', points:[p] }; render(); return; }
      if (state.tool === 'select') {
        const g = e.target.closest('[data-id]');
        if (g) { snapshot(); dragId = g.getAttribute('data-id'); state.sel = dragId; render(); }
        else { state.sel = null; render(); }
      }
    }
    function onMove(e) {
      const p = ptOf(e);
      if (dragId) { const s = state.settlements.find((x) => x.id === dragId); if (s) { s.x = p[0]; s.y = p[1]; } renderMap(); return; }
      if (!state.draft) return;
      const last = state.draft.points[state.draft.points.length - 1];
      if (Math.hypot(p[0]-last[0], p[1]-last[1]) < 4) return;
      state.draft.points.push(p); renderMap();
    }
    function onUp() {
      if (dragId) { dragId = null; return; }
      if (!state.draft) return;
      if (state.draft.points.length > 2) {
        snapshot();
        if (state.draft.kind === 'road') {
          const pts = state.draft.points.slice(); pts[pts.length-1] = snapToSettlement(pts[pts.length-1]);
          state.roads.push({ id: nextId(), points: pts });
        } else if (state.draft.kind === 'land') {
          state.landmasses.push({ id: nextId(), points: state.draft.points, ...LANDS[state.terrain] });
        } else {
          state.borders.push({ id: nextId(), points: state.draft.points, ...FILLS[state.palette] });
        }
      }
      state.draft = null; render();
    }

    function exportSvg() {
      state.sel = null; renderMap();
      const src = new XMLSerializer().serializeToString(svg);
      const blob = new Blob(['<?xml version="1.0"?>' + src], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'nationhood-map.svg'; a.click();
      URL.revokeObjectURL(url);
    }

    // ---- toolbar ----
    function buildToolbar() {
      const tb = $('toolbar');
      tb.innerHTML =
        `<div class="head">Land</div>` +
        `<button class="tbtn" data-tool="land">Draw landmass</button>` +
        `<div class="swatches">${LANDS.map((l,i) => `<button class="swatch" data-terrain="${i}" title="${l.name}" style="background:${l.fill}"></button>`).join('')}</div>` +
        `<div class="swatch-name" id="terrain-name"></div>` +
        `<div class="head">Place</div>` +
        Object.entries(TYPES).map(([k,v]) => `<button class="tbtn" data-tool="${k}"><span style="color:${v.color};margin-right:8px">●</span>${v.label}</button>`).join('') +
        `<div class="head">Draw</div>` +
        `<button class="tbtn" data-tool="road">Travel line</button>` +
        `<button class="tbtn" data-tool="border">Border + fill</button>` +
        `<button class="tbtn" data-tool="select">Select / move</button>` +
        `<div class="head">Border colour</div>` +
        `<div class="swatches">${FILLS.map((f,i) => `<button class="swatch" data-palette="${i}" title="${f.name}" style="background:${f.fill}"></button>`).join('')}</div>` +
        `<div class="swatch-name" id="palette-name"></div>` +
        `<div class="head">Map</div>` +
        `<button class="tbtn" id="undo-btn">Undo</button>` +
        `<button class="tbtn" data-removelast="landmasses">Remove last landmass</button>` +
        `<button class="tbtn" data-removelast="roads">Remove last line</button>` +
        `<button class="tbtn" data-removelast="borders">Remove last border</button>` +
        `<button class="tbtn" id="labels-btn">Hide names</button>` +
        `<button class="tbtn" id="export-btn">Export SVG</button>` +
        `<button class="tbtn danger" id="clear-btn">Clear map</button>`;

      tb.querySelectorAll('[data-tool]').forEach((b) => b.addEventListener('click', () => { state.tool = b.dataset.tool; render(); }));
      tb.querySelectorAll('[data-terrain]').forEach((b) => b.addEventListener('click', () => { state.terrain = +b.dataset.terrain; state.tool = 'land'; render(); }));
      tb.querySelectorAll('[data-palette]').forEach((b) => b.addEventListener('click', () => { state.palette = +b.dataset.palette; render(); }));
      tb.querySelectorAll('[data-removelast]').forEach((b) => b.addEventListener('click', () => undoLastOf(b.dataset.removelast)));
      $('undo-btn').addEventListener('click', undo);
      $('labels-btn').addEventListener('click', () => { state.labels = !state.labels; render(); });
      $('export-btn').addEventListener('click', exportSvg);
      $('clear-btn').addEventListener('click', () => { snapshot(); state.settlements=[]; state.roads=[]; state.borders=[]; state.landmasses=[]; state.sel=null; render(); });
    }

    function init() {
      buildToolbar();
      svg.addEventListener('pointerdown', onDown);
      svg.addEventListener('pointermove', onMove);
      svg.addEventListener('pointerup', onUp);
      svg.addEventListener('pointerleave', onUp);
      svg.addEventListener('contextmenu', (e) => e.preventDefault());
      window.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.key === 'Delete' || e.key === 'Backspace') removeSelected();
        if (e.key === 'Escape') { state.draft = null; state.sel = null; render(); }
        if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); undo(); }
      });
      render();
    }

    // ---- admin gate: only the owner's account ----
    (async () => {
      const user = await currentUser();
      if (!user) { window.location.href = '/login/'; return; }
      if ((user.email || '').toLowerCase() !== ADMIN_EMAIL) { window.location.href = '/'; return; }
      $('checking').hidden = true;
      $('app').hidden = false;
      init();
    })();
  </script>
</body>
</html>
