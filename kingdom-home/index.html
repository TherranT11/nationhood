<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your House — Kingdoms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Alegreya:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0d0e11;
    --steel: #1a1d24;
    --steel-edge: #2e333f;
    --bone: #d8d2c4;
    --bone-dim: #8f8a7e;
    --gold: #b99653;
    --gold-bright: #d9b56a;
    --faint: #5c5a52;
    --blood: #7a2e2a;
    --blood-text: #c9857f;
    --green: #7d9a5c;
    --display: 'Cinzel', serif;
    --body: 'Alegreya', serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--bone);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.6;
  }

  /* ---- top bar ---- */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0 1.5rem;
    background: var(--steel);
    border-bottom: 1px solid var(--steel-edge);
    z-index: 10;
  }
  .topbar-house {
    font-family: var(--display);
    font-weight: 600;
    font-size: 0.95rem;
    letter-spacing: 0.14em;
    color: var(--bone);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .topbar-house .sep { color: var(--steel-edge); margin: 0 0.7rem; font-weight: 400; }
  .topbar-house .era { color: var(--bone-dim); letter-spacing: 0.18em; }

  /* resources — pushed to the right of the bar */
  .topbar-res {
    margin-left: auto;
    display: flex;
    align-items: baseline;
    gap: 1.4rem;
    overflow-x: auto;
    scrollbar-width: none;
    white-space: nowrap;
  }
  .topbar-res::-webkit-scrollbar { display: none; }
  .res {
    font-family: var(--display);
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--bone-dim);
  }
  .res b { color: var(--bone); font-weight: 700; font-size: 0.9rem; margin-right: 0.4rem; letter-spacing: 0.02em; }

  .topbar-leave {
    flex-shrink: 0;
    font-family: var(--display);
    font-weight: 600;
    font-size: 0.66rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--bone-dim);
    background: none;
    border: 1px solid var(--steel-edge);
    padding: 0.5rem 1rem;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .topbar-leave:hover, .topbar-leave:focus-visible { border-color: var(--gold); color: var(--gold); }
  .topbar-leave:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---- left sidebar ---- */
  .sidebar {
    position: fixed;
    left: 0; top: 56px; bottom: 0;
    width: 190px;
    background: var(--steel);
    border-right: 1px solid var(--steel-edge);
    padding: 1rem 0;
    display: flex;
    flex-direction: column;
    z-index: 5;
  }
  .nav-item {
    font-family: var(--display);
    font-weight: 600;
    font-size: 0.78rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    text-align: left;
    color: var(--bone-dim);
    background: none;
    border: none;
    border-left: 3px solid transparent;
    padding: 0.85rem 1.5rem;
    cursor: pointer;
    transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .nav-item:hover { color: var(--bone); }
  .nav-item.active { color: var(--gold); border-left-color: var(--gold); background: #15130c; }
  .nav-item:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }

  /* ---- stage (the selected hall — UI to come) ---- */
  .stage { margin-left: 190px; padding-top: 56px; min-height: 100vh; }
  .stage-empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: calc(100vh - 56px);
    gap: 0.6rem;
    color: var(--bone-dim);
  }
  .stage-empty h2 {
    font-family: var(--display); font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--bone); font-size: 1.3rem;
  }
  .stage-empty p { font-style: italic; }

  /* ---- Home hall: Head of House card ---- */
  .home-wrap { padding: 1.5rem; display: flex; gap: 1.5rem; align-items: flex-start; flex-wrap: wrap; }
  .hoh { width: 320px; max-width: 100%; background: var(--steel); border: 1px solid var(--steel-edge); }
  .hoh-title {
    font-family: var(--display); font-weight: 600; font-size: 0.8rem; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--bone); padding: 0.9rem 1.1rem; border-bottom: 1px solid var(--steel-edge);
  }
  .hoh-banner {
    position: relative; height: 130px; background: var(--ink); border-bottom: 1px solid var(--steel-edge);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .hoh-banner img { width: 100%; height: 100%; object-fit: contain; display: block; padding: 8px; }
  .hoh-banner .ph { font-family: var(--display); font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--bone-dim); }
  .hoh-edit {
    position: absolute; top: 8px; right: 8px;
    font-family: var(--display); font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--bone); background: rgba(13,14,17,0.78); border: 1px solid var(--steel-edge); padding: 0.35rem 0.7rem; cursor: pointer;
  }
  .hoh-edit:hover { border-color: var(--gold); color: var(--gold); }
  .kv { padding: 0.4rem 1.1rem 1rem; }
  .kv-row { display: flex; justify-content: space-between; gap: 1rem; padding: 0.55rem 0; border-bottom: 1px solid var(--steel-edge); }
  .kv-row:last-child { border-bottom: none; }
  .kv-k { font-family: var(--display); font-size: 0.62rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--bone-dim); flex: none; padding-top: 0.15rem; }
  .kv-v { text-align: right; color: var(--bone); }
  .kv-v.dim { color: var(--bone-dim); font-style: italic; }

  /* ---- Holdings container ---- */
  .holdings { flex: 1; min-width: 340px; align-self: flex-start; background: var(--steel); border: 1px solid var(--steel-edge); }
  .hd-body { padding: 0.3rem 1.1rem 1.1rem; }
  .hd-table { width: 100%; border-collapse: collapse; }
  .hd-table th {
    font-family: var(--display); font-size: 0.6rem; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--bone-dim); font-weight: 600; text-align: right; padding: 0.7rem 0.75rem; border-bottom: 1px solid var(--steel-edge);
  }
  .hd-table th.hd-name { text-align: left; }
  .hd-table td { padding: 0.85rem 0.75rem; border-bottom: 1px solid var(--steel-edge); text-align: right; color: var(--bone); }
  .hd-table td.hd-name { text-align: left; font-family: var(--display); letter-spacing: 0.04em; }
  .hd-table tr:last-child td { border-bottom: none; }
  .hd-star { color: var(--gold); }
  .hd-go {
    font-family: var(--display); font-weight: 600; font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--bone); background: none; border: 1px solid var(--steel-edge); padding: 0.5rem 0.9rem; cursor: pointer; white-space: nowrap;
  }
  .hd-go:hover { border-color: var(--gold); color: var(--gold); }
  .hd-empty { color: var(--bone-dim); font-style: italic; }
  .hd-note { color: var(--bone-dim); font-style: italic; font-size: 0.8rem; padding: 0.8rem 0.75rem 0; }

  /* ---- Cards hand (full width, below Head of House + Holdings) ---- */
  .cards { flex-basis: 100%; width: 100%; background: var(--steel); border: 1px solid var(--steel-edge); }
  .cards-head {
    display: flex; align-items: baseline; gap: 0.6rem;
    padding: 0.9rem 1.1rem; border-bottom: 1px solid var(--steel-edge);
  }
  .cards-title { font-family: var(--display); font-weight: 600; font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--bone); }
  .cards-count { font-family: var(--display); font-size: 0.8rem; letter-spacing: 0.1em; color: var(--gold); }
  .cards-body { padding: 1.1rem; display: flex; gap: 1rem; flex-wrap: wrap; }
  .card-slot {
    flex: 1 1 130px; max-width: 160px; aspect-ratio: 3 / 4;
    border: 1px dashed var(--steel-edge); background: var(--ink);
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 0.5rem;
    font-family: var(--display); font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--bone-dim);
  }
  .card-slot.filled { border-style: solid; border-color: var(--gold); color: var(--bone); cursor: pointer; flex-direction: column; gap: .3rem; transition: transform .15s ease, border-color .15s ease; }
  .card-slot.filled:hover { transform: translateY(-3px); border-color: var(--gold-bright); }
  .card-slot .cs-top { font-family: var(--display); font-weight: 600; font-size: .78rem; letter-spacing: .1em; color: var(--bone); }
  .card-slot .cs-div { color: var(--faint); }
  .card-slot .cs-bot { font-family: var(--display); font-size: .68rem; letter-spacing: .1em; color: var(--bone-dim); }
  .cards-draw { margin-left: auto; padding: .4rem 1rem; font-size: .6rem; }

  /* ---- card play modal ---- */
  .card-play { width: min(520px, 94vw); max-height: 88vh; overflow-y: auto; }
  .pc-side { border: 1px solid var(--steel-edge); padding: 1rem 1.1rem 1.15rem; margin-bottom: .9rem; }
  .pc-side.playable { border-color: var(--gold); }
  .pc-head { display: flex; align-items: baseline; gap: .6rem; margin-bottom: .5rem; }
  .pc-name { font-family: var(--display); font-weight: 600; font-size: .95rem; letter-spacing: .1em; text-transform: uppercase; }
  .pc-which { font-family: var(--display); font-size: .55rem; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); }
  .pc-cost { font-family: var(--display); font-size: .62rem; letter-spacing: .08em; color: var(--gold); margin-bottom: .6rem; }
  .pc-eff { list-style: none; font-size: .84rem; color: var(--bone-dim); line-height: 1.5; margin-bottom: .5rem; }
  .pc-eff li { padding-left: .85rem; position: relative; }
  .pc-eff li::before { content: "\00b7"; position: absolute; left: .2rem; color: var(--gold); }
  .pc-note { font-size: .78rem; font-style: italic; color: var(--faint); margin-top: .4rem; padding-left: .1rem; }
  .pc-play { margin-top: .7rem; font-family: var(--display); font-weight: 600; font-size: .62rem; letter-spacing: .16em; text-transform: uppercase; color: #16130b; background: var(--gold); border: none; padding: .5rem 1.4rem; cursor: pointer; }
  .pc-play:hover { background: var(--gold-bright); }
  .pc-play:disabled { background: none; color: var(--faint); border: 1px solid var(--steel-edge); cursor: not-allowed; }
  .pc-why { margin-top: .6rem; font-family: var(--display); font-size: .55rem; letter-spacing: .12em; text-transform: uppercase; color: #c9857f; }
  .pc-result { font-size: .98rem; color: var(--bone); line-height: 1.6; padding: .4rem .1rem 1rem; }

  /* ============================================================
     Holdings view — collapsible holdings + build catalog
     ============================================================ */
  .holding { background: var(--steel); border: 1px solid var(--steel-edge); margin-bottom: 1rem; }
  .holding-head {
    display: flex; align-items: center; gap: 1.25rem; width: 100%;
    background: none; border: none; cursor: pointer; text-align: left;
    padding: 1.1rem 1.4rem; color: var(--bone); font-family: var(--body); transition: background .15s ease;
  }
  .holding-head:hover { background: #1e222b; }
  .chev {
    width: 9px; height: 9px; border-right: 1.5px solid var(--gold); border-bottom: 1.5px solid var(--gold);
    transform: rotate(-45deg); transition: transform .2s ease; flex: none; margin-top: -3px;
  }
  .holding.open .chev { transform: rotate(45deg); margin-top: -6px; }
  .holding-name { font-family: var(--display); font-weight: 600; font-size: .95rem; letter-spacing: .12em; text-transform: uppercase; }
  .holding-name .star { color: var(--gold); }
  .terrain { font-size: .8rem; font-style: italic; color: var(--faint); }

  .head-stats { margin-left: auto; display: flex; gap: 2rem; align-items: center; flex-wrap: wrap; }
  .hstat { text-align: right; }
  .hstat .lbl { display: block; font-family: var(--display); font-size: .58rem; letter-spacing: .18em; text-transform: uppercase; color: var(--bone-dim); }
  .hstat .val { font-family: var(--display); font-weight: 600; font-size: 1rem; }
  .hstat .val.warn { color: #c9857f; }

  .land-meter { width: 110px; }
  .land-bar { height: 4px; background: var(--steel-edge); margin-top: .35rem; display: flex; gap: 2px; }
  .land-pip { flex: 1; background: var(--steel-edge); }
  .land-pip.used { background: var(--gold); }

  .holding-body { display: none; border-top: 1px solid var(--steel-edge); padding: 1.5rem 1.4rem 1.75rem; }
  .holding.open .holding-body { display: block; }

  .sec-title { font-family: var(--display); font-weight: 600; font-size: .68rem; letter-spacing: .22em; text-transform: uppercase; color: var(--bone-dim); margin-bottom: .9rem; }
  .sec-title .count { color: var(--faint); }

  .built-list { display: flex; flex-direction: column; gap: .5rem; margin-bottom: 2rem; }
  .built-row {
    display: flex; align-items: center; gap: 1rem; background: var(--ink);
    border: 1px solid var(--steel-edge); border-left: 2px solid var(--gold); padding: .7rem 1rem;
  }
  .built-name { font-family: var(--display); font-weight: 600; font-size: .82rem; letter-spacing: .1em; text-transform: uppercase; min-width: 150px; }
  .built-eff { font-size: .85rem; color: var(--bone-dim); flex: 1; }
  .built-plot { font-family: var(--display); font-size: .58rem; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }
  .raze {
    background: none; border: 1px solid var(--steel-edge); color: var(--faint);
    font-family: var(--display); font-size: .55rem; letter-spacing: .14em; text-transform: uppercase; padding: .35rem .7rem; cursor: pointer;
  }
  .raze:hover { border-color: var(--blood); color: #c9857f; }
  .empty-note { font-size: .88rem; font-style: italic; color: var(--faint); padding: .5rem 0 1.5rem; }

  .cat-block { margin-bottom: 1.5rem; }
  .cat-name { font-family: var(--display); font-weight: 600; font-size: .62rem; letter-spacing: .24em; text-transform: uppercase; color: var(--gold); padding-bottom: .5rem; margin-bottom: .85rem; border-bottom: 1px solid var(--steel-edge); }
  .bld-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: .8rem; }
  .bld {
    background: var(--ink); border: 1px solid var(--steel-edge); padding: .9rem 1rem 1rem;
    display: flex; flex-direction: column; gap: .55rem; position: relative; transition: border-color .15s ease, transform .15s ease;
  }
  .bld.can:hover { border-color: var(--gold); transform: translateY(-2px); }
  .bld-top { display: flex; align-items: baseline; gap: .5rem; }
  .bld-num { font-family: var(--display); font-size: .62rem; color: var(--faint); }
  .bld-name { font-family: var(--display); font-weight: 600; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
  .bld-costs { display: flex; gap: .9rem; font-size: .78rem; }
  .bld-costs .c-gold { color: var(--gold); font-family: var(--display); font-weight: 600; font-size: .7rem; letter-spacing: .08em; }
  .bld-costs .c-up { color: #c9857f; font-family: var(--display); font-size: .7rem; letter-spacing: .08em; }
  .bld-costs .c-land { color: var(--bone-dim); font-family: var(--display); font-size: .7rem; letter-spacing: .08em; }
  .bld-eff { list-style: none; font-size: .83rem; color: var(--bone-dim); line-height: 1.5; }
  .bld-eff li { padding-left: .85rem; position: relative; }
  .bld-eff li::before { content: "\00b7"; position: absolute; left: .2rem; color: var(--gold); }
  .bld-eff li.needs { color: var(--faint); font-style: italic; }
  .bld-eff li.needs::before { color: var(--faint); }
  .build-btn {
    margin-top: auto; font-family: var(--display); font-weight: 600; font-size: .62rem; letter-spacing: .16em; text-transform: uppercase;
    color: #16130b; background: var(--gold); border: none; padding: .5rem 0; cursor: pointer;
  }
  .build-btn:hover { background: var(--gold-bright); }
  .bld.cant { opacity: .42; }
  .bld.cant .build-btn { background: none; color: var(--faint); border: 1px solid var(--steel-edge); cursor: not-allowed; }
  .lock-why { font-family: var(--display); font-size: .55rem; letter-spacing: .12em; text-transform: uppercase; color: #c9857f; text-align: center; }

  /* ---- Dynasty tree ---- */
  .view-wrap { padding: 1.5rem; }
  .panel { background: var(--steel); border: 1px solid var(--steel-edge); }
  .panel-head {
    font-family: var(--display); font-weight: 600; font-size: 0.78rem; letter-spacing: 0.24em;
    text-transform: uppercase; color: var(--bone); padding: 1.1rem 1.4rem; border-bottom: 1px solid var(--steel-edge);
  }
  .panel-body { padding: 2.5rem 1.5rem 3rem; }
  .tree { display: flex; flex-direction: column; align-items: center; }
  .couple { display: flex; align-items: center; flex-wrap: wrap; justify-content: center; gap: .25rem; }
  .marriage { flex: none; width: 34px; height: 2px; background: var(--gold); opacity: .55; }   /* the bond between spouses */
  .dyn-card {
    background: var(--ink); border: 1px solid var(--steel-edge); padding: 1rem 1.6rem 0.9rem;
    min-width: 190px; text-align: center; transition: border-color 0.2s ease, background 0.2s ease;
  }
  .dyn-card { cursor: pointer; }
  .dyn-card:hover { border-color: var(--gold); background: #14171f; }
  .dyn-card.head { border-top: 2px solid var(--gold); }   /* marks the head of house */
  .dyn-name { font-family: var(--display); font-weight: 600; font-size: 1rem; letter-spacing: 0.08em; color: var(--bone); }
  .dyn-name .age { color: var(--bone-dim); font-weight: 400; font-size: 0.85rem; }
  .dyn-role {
    font-family: var(--display); font-weight: 700; font-size: 0.62rem; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--gold); margin-top: 0.25rem;
  }
  .dyn-sub { font-size: 0.85rem; font-style: italic; color: var(--bone-dim); margin-top: 0.15rem; }

  /* ============================================================
     Court view — sovereign + council (all seats start empty)
     ============================================================ */
  .court { width: min(1000px, 100%); margin: 0 auto; }
  .court-title {
    font-family: var(--display); font-weight: 600; font-size: .72rem; letter-spacing: .28em;
    text-transform: uppercase; color: var(--bone-dim); text-align: center; margin-bottom: 1.5rem;
  }
  .sovereign {
    background: var(--steel); border: 1px solid var(--gold); padding: 2rem 2rem 1.9rem;
    text-align: center; position: relative; margin-bottom: 2.5rem;
  }
  .sovereign::before, .sovereign::after { content: ""; position: absolute; width: 14px; height: 14px; border: 1px solid var(--gold); opacity: .6; }
  .sovereign::before { top: 6px; left: 6px; border-right: none; border-bottom: none; }
  .sovereign::after { bottom: 6px; right: 6px; border-left: none; border-top: none; }
  .crown { display: block; margin: 0 auto .9rem; }
  .seat-label { font-family: var(--display); font-weight: 600; font-size: .62rem; letter-spacing: .26em; text-transform: uppercase; color: var(--gold); margin-bottom: .6rem; }
  .council-title { font-family: var(--display); font-weight: 600; font-size: .66rem; letter-spacing: .26em; text-transform: uppercase; color: var(--bone-dim); text-align: center; margin-bottom: 1.25rem; }
  .council { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 1rem; }
  .seat {
    background: var(--steel); border: 1px solid var(--steel-edge); border-top: 2px solid var(--gold);
    padding: 1.2rem 1.3rem 1.15rem; text-align: center; transition: border-color .2s ease, background .2s ease;
  }
  .seat.vacant { border-top-color: var(--steel-edge); }
  .seat.vacant .seat-label { color: var(--faint); }
  .seat-vacant-text { font-style: italic; color: var(--faint); font-size: .92rem; }
  .court-foot { margin-top: 2rem; text-align: center; font-size: .9rem; font-style: italic; color: var(--faint); }
  .sov-name { font-family: var(--display); font-weight: 600; font-size: 1.5rem; letter-spacing: .08em; line-height: 1.35; }
  .sov-name .age { color: var(--bone-dim); font-weight: 400; font-size: 1rem; }
  .sov-reign { margin-top: .9rem; padding-top: .9rem; border-top: 1px solid var(--steel-edge); display: inline-block; min-width: min(420px, 90%); font-family: var(--display); font-size: .78rem; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
  .yours-tag { margin-top: .9rem; font-family: var(--display); font-size: .55rem; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-bright); }
  .claim-btn { margin-top: 1.2rem; }

  /* ============================================================
     Laws view — the realm's standing laws (no assembly, so no vote/debate UI)
     ============================================================ */
  .laws { width: min(1040px, 100%); margin: 0 auto; }
  .laws-head { text-align: center; margin-bottom: 2rem; }
  .laws-title { font-family: var(--display); font-weight: 600; font-size: .72rem; letter-spacing: .28em; text-transform: uppercase; color: var(--bone-dim); }
  .laws-sub { font-style: italic; color: var(--faint); margin-top: .4rem; font-size: .92rem; }
  .laws-voice { display: inline-flex; gap: 1.75rem; margin-top: 1.1rem; padding: .7rem 1.5rem; border: 1px solid var(--steel-edge); background: var(--steel); }
  .voice-item { text-align: center; }
  .voice-item .lbl { display: block; font-family: var(--display); font-size: .55rem; letter-spacing: .2em; text-transform: uppercase; color: var(--bone-dim); }
  .voice-item .val { font-family: var(--display); font-weight: 600; font-size: .9rem; color: var(--gold); }
  .group-title { font-family: var(--display); font-weight: 600; font-size: .62rem; letter-spacing: .24em; text-transform: uppercase; color: var(--gold); border-bottom: 1px solid var(--steel-edge); padding-bottom: .5rem; margin: 2rem 0 1rem; }
  .law { background: var(--steel); border: 1px solid var(--steel-edge); padding: 1.3rem 1.4rem 1.4rem; margin-bottom: 1rem; }
  .law-top { display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .law-name { font-family: var(--display); font-weight: 600; font-size: .88rem; letter-spacing: .12em; text-transform: uppercase; }
  .law-now { font-family: var(--display); font-weight: 600; font-size: .8rem; letter-spacing: .08em; color: var(--gold); margin-left: auto; }
  .track { display: flex; gap: 3px; margin-bottom: .45rem; }
  .tier { flex: 1; height: 5px; background: var(--steel-edge); }
  .tier.below { background: #4a4433; }
  .tier.at { background: var(--gold); }
  .tier-names { display: flex; gap: 3px; margin-bottom: 1rem; }
  .tier-name { flex: 1; font-family: var(--display); font-size: .55rem; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); text-align: center; line-height: 1.4; }
  .tier-name.at { color: var(--bone); }
  .law-eff { list-style: none; font-size: .9rem; color: var(--bone-dim); }
  .law-eff li { padding-left: .9rem; position: relative; }
  .law-eff li::before { content: "\00b7"; position: absolute; left: .2rem; color: var(--gold); }
  .law-you { margin-top: .9rem; padding-top: .8rem; border-top: 1px solid var(--steel-edge); font-size: .9rem; color: var(--gold); }
  .law-you .tag { font-family: var(--display); font-size: .55rem; letter-spacing: .18em; text-transform: uppercase; color: var(--bone-dim); margin-right: .6rem; }

  /* ============================================================
     Conflict view — strength snapshot + wars/claims/pacts/feuds (all start empty)
     Reuses .group-title for section headers.
     ============================================================ */
  .conflict { width: min(1060px, 100%); margin: 0 auto; }
  .group-title:first-child { margin-top: 0; }
  .group-title .muted { color: var(--faint); }
  .strength { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); background: var(--steel); border: 1px solid var(--steel-edge); }
  .str-cell { padding: 1rem 1.1rem; border-right: 1px solid var(--steel-edge); }
  .str-cell:last-child { border-right: none; }
  .str-cell .lbl { display: block; font-family: var(--display); font-size: .55rem; letter-spacing: .2em; text-transform: uppercase; color: var(--bone-dim); }
  .str-cell .val { font-family: var(--display); font-weight: 600; font-size: 1.25rem; color: var(--bone); }
  .str-cell .val.zero { color: var(--blood-text); }
  .str-cell .note { display: block; font-size: .78rem; font-style: italic; color: var(--faint); }
  .empty { background: var(--steel); border: 1px dashed var(--steel-edge); padding: 1.4rem 1.5rem; margin-bottom: .6rem; }
  .empty p { font-style: italic; color: var(--faint); font-size: .92rem; }
  .empty .ways { margin-top: .9rem; font-style: normal; color: var(--bone-dim); font-size: .88rem; }
  .empty .ways li { list-style: none; padding-left: .9rem; position: relative; }
  .empty .ways li::before { content: "\00b7"; position: absolute; left: .2rem; color: var(--gold); }

  /* ---- banner upload modal ---- */
  .modal-back { position: fixed; inset: 0; background: rgba(6,7,9,0.75); display: none; align-items: center; justify-content: center; z-index: 20; }
  .modal-back.open { display: flex; }
  .modal { width: min(440px, 92vw); background: var(--steel); border: 1px solid var(--gold); padding: 1.75rem 1.75rem 1.5rem; }
  .modal-title { font-family: var(--display); font-weight: 600; font-size: 0.95rem; letter-spacing: 0.18em; text-transform: uppercase; text-align: center; margin-bottom: 1.1rem; }
  .modal-preview {
    height: 140px; background: var(--ink); border: 1px dashed var(--steel-edge);
    display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 1rem;
    color: var(--bone-dim); font-size: 0.8rem; font-style: italic;
  }
  .modal-preview img { width: 100%; height: 100%; object-fit: contain; }
  .modal input[type=file] { width: 100%; color: var(--bone-dim); font-family: var(--body); font-size: 0.85rem; }
  .modal-note { color: var(--bone-dim); font-size: 0.78rem; font-style: italic; margin: 0.6rem 0 1.2rem; text-align: center; }
  .modal-note.err { color: #cc9a90; }
  .modal-actions { display: flex; justify-content: center; gap: 0.8rem; }
  .mbtn {
    font-family: var(--display); font-weight: 600; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
    padding: 0.6rem 1.4rem; cursor: pointer; background: none; border: 1px solid var(--steel-edge); color: var(--bone);
  }
  .mbtn:hover { border-color: var(--gold); color: var(--gold); }
  .mbtn.primary { background: var(--gold); color: #16130b; border-color: var(--gold); }
  .mbtn.primary:hover { background: var(--gold-bright); color: #16130b; }
  .mbtn:disabled { opacity: 0.4; cursor: default; }
  .char-card { width: min(340px, 92vw); }
  .char-card .kv { padding: 0 0 1.1rem; }
</style>
</head>
<body>

<header class="topbar">
  <span class="topbar-house" id="house-label">&hellip;</span>
  <div class="topbar-res" id="topbar-res"></div>
  <button class="topbar-leave" id="leave-btn" type="button">Leave World</button>
</header>

<aside class="sidebar" id="sidebar">
  <button class="nav-item active" data-view="home" type="button">Home</button>
  <button class="nav-item" data-view="dynasty" type="button">Dynasty</button>
  <button class="nav-item" data-view="holdings" type="button">Holdings</button>
  <button class="nav-item" data-view="court" type="button">Court</button>
  <button class="nav-item" data-view="laws" type="button">Laws</button>
  <button class="nav-item" data-view="conflict" type="button">Conflict</button>
</aside>

<main class="stage" id="stage"></main>

<!-- Banner upload modal -->
<div class="modal-back" id="banner-modal">
  <div class="modal">
    <div class="modal-title">House Banner</div>
    <div class="modal-preview" id="banner-preview">No image chosen</div>
    <input type="file" id="banner-file" accept="image/png,image/jpeg,image/webp,image/gif">
    <p class="modal-note" id="banner-note">PNG, JPG, WebP or GIF · up to 2 MB · free</p>
    <div class="modal-actions">
      <button class="mbtn primary" id="banner-save" type="button" disabled>Save Banner</button>
      <button class="mbtn" id="banner-cancel" type="button">Cancel</button>
    </div>
  </div>
</div>

<!-- Character popup (opened from a Dynasty card) -->
<div class="modal-back" id="char-modal">
  <div class="modal char-card">
    <div class="modal-title" id="char-name">&hellip;</div>
    <div class="kv" id="char-body"></div>
    <div class="modal-actions"><button class="mbtn" id="char-close" type="button">Close</button></div>
  </div>
</div>

<!-- Card play popup (opened from a hand card): choose the top or bottom side and play it -->
<div class="modal-back" id="card-modal">
  <div class="modal card-play">
    <div class="modal-title" id="card-title">Play a Card</div>
    <div id="card-body"></div>
    <div class="modal-actions"><button class="mbtn" id="card-close" type="button">Close</button></div>
  </div>
</div>

<script type="module">
  import { supabase, isConfigured } from '/supabase.js';
  import { esc, houseLabel, TREASURY_SPEC, LORD_STAT_SPEC } from '/kingdoms.js';   // shared Kingdoms helpers (one source)
  import { uploadToStorage } from '/upload.js';                    // one image-upload path (2 MB cap)

  let house = null;         // the signed-in player's house
  let catalog = [];         // building specs (from kingdoms_building_specs; one source)
  const specByNum = {};     // num → spec
  let cardCatalog = [];     // card sides (from kingdoms_cards; one source)
  const cardSides = {};     // `${card_key}:${side}` → row

  const setBar = name => {
    document.getElementById('house-label').innerHTML =
      esc(houseLabel(name)) + '<span class="sep">|</span><span class="era">Year 845 V.E.</span>';
  };
  // Land used by the buildings standing in a county, and the plots left free — one source for both.
  const usedLand = c => (c.buildings || []).reduce((s, b) => s + (specByNum[b.building_num] ? specByNum[b.building_num].land : 0), 0);
  const freeLand = c => Math.max(0, (c.available_land || 0) - usedLand(c));
  // House-derived helpers used by more than one view — one source each.
  const primarySeat = () => {                    // primary county's place name: "County of Amberfield" → "Amberfield"
    const cs = (house && house.counties) || [];
    return cs.length ? cs[0].name.replace(/^\s*County of\s+/i, '').trim() : '';
  };
  const realmName = () => (house && house.heritage === 'Aldren') ? 'Aldren' : ((house && house.heritage) || 'the Realm');
  const holdingLord = () => (house && house.leader_name) || 'Head of House';   // no appoint-lord mechanic yet: the head of house holds every county
  const unrestOf = c => (c && c.unrest != null) ? c.unrest : 1;                 // defaults to 1
  // Sovereign / rank — one source. The realm's crown title (only Aldren exists) and the head's full rank.
  const SOVEREIGN_TITLE = 'King';
  const nationName = () => 'Kingdom of ' + realmName();                          // "Kingdom of Aldren"
  const sovereignRank = () => SOVEREIGN_TITLE + ' of the ' + nationName();       // "King of the Kingdom of Aldren"
  const isSovereign = () => !!(house && house.is_sovereign);
  const nameOfHouse = (name, houseName) => esc(name || 'Unknown') + ' of ' + esc(houseLabel(houseName));   // "Everard of House Ashvale"
  const fullRank = () => {                                                       // the head of house's rank, seat included
    const seat = primarySeat();
    const feudal = (house.leader_title || 'Count') + (seat ? ' of ' + seat : '');   // "Count of Amberfield"
    return isSovereign() ? sovereignRank() + ', ' + feudal : feudal;            // sovereign keeps the feudal title too
  };
  // The top bar shows the house Treasury: Gold + Population from resources, Available Plots = free land across holdings.
  const updateTopbar = () => {
    const res = house && house.resources ? house.resources : {};
    const freePlots = (house && house.counties || []).reduce((s, c) => s + freeLand(c), 0);
    const vals = { gold: res.gold || 0, food: res.food || 0, population: res.population || 0, plots: freePlots, prestige: res.prestige || 0 };
    document.getElementById('topbar-res').innerHTML = TREASURY_SPEC.map(s =>
      '<span class="res"><b>' + Number(vals[s.key] || 0).toLocaleString() + '</b>' + esc(s.label) + '</span>'
    ).join('');
  };

  document.getElementById('leave-btn').addEventListener('click', () => { window.location.href = '/kingdoms/'; });

  // ---- sidebar navigation ----
  const VIEW_TITLES = { home: 'Home', dynasty: 'Dynasty', holdings: 'Holdings', court: 'Court', laws: 'Laws', conflict: 'Conflict' };
  function renderView(view) {
    const stage = document.getElementById('stage');
    if (view === 'home') { renderHome(stage); return; }
    if (view === 'dynasty') { renderDynasty(stage); return; }
    if (view === 'holdings') { renderHoldings(stage); return; }
    if (view === 'court') { renderCourt(stage); return; }
    if (view === 'laws') { renderLaws(stage); return; }
    if (view === 'conflict') { renderConflict(stage); return; }
    stage.innerHTML = '<div class="stage-empty"><h2>' + esc(VIEW_TITLES[view] || view) + '</h2><p>This hall is not yet built.</p></div>';
  }
  document.querySelectorAll('.nav-item').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderView(btn.dataset.view);
  }));

  // ---- Home hall: Head of House ----
  const bannerInner = () => house && house.banner_url
    ? '<img alt="House banner" src="' + esc(house.banner_url) + '">'
    : '<span class="ph">House banner</span>';
  const kvRow = (k, v, dim) => '<div class="kv-row"><span class="kv-k">' + esc(k) + '</span><span class="kv-v' + (dim ? ' dim' : '') + '">' + v + '</span></div>';

  function renderHome(stage) {
    if (!house) { stage.innerHTML = ''; return; }
    const name = nameOfHouse(house.leader_name, house.house_name);
    const culture = house.heritage === 'Aldren' ? 'Aldric' : esc(house.heritage || '—');
    const counties = house.counties || [];
    const holdings = counties.length ? esc(counties.map(c => c.name).join(', ')) : null;
    const res = house.resources || {};
    const lordStats = LORD_STAT_SPEC.map(s => kvRow(s.label, esc(Number(res[s.key] || 0)))).join('');
    stage.innerHTML =
      '<div class="home-wrap">' +
        '<div class="hoh">' +
          '<div class="hoh-title">Head of House</div>' +
          '<div class="hoh-banner" id="hoh-banner">' + bannerInner() +
            '<button class="hoh-edit" id="banner-edit" type="button">Edit</button></div>' +
          '<div class="kv">' +
            kvRow('Name', name) +
            kvRow('Age', esc(house.leader_age != null ? house.leader_age : '—')) +
            kvRow('Title', esc(fullRank())) +
            lordStats +
            kvRow('Holdings', holdings || '—', !holdings) +
            kvRow('Culture', culture) +
            kvRow('Spouse', house.spouse_name ? esc(house.spouse_name) : '—', !house.spouse_name) +
            kvRow('Children', '—', true) +
            kvRow('Liege', '—', true) +
          '</div>' +
        '</div>' +
        holdingsCard(counties) +
        cardsCard() +
      '</div>';
    document.getElementById('banner-edit').addEventListener('click', openBanner);
    const go = document.getElementById('hd-go');
    if (go) go.addEventListener('click', () => document.querySelector('.nav-item[data-view="holdings"]').click());
    const draw = document.getElementById('draw-card');
    if (draw) draw.addEventListener('click', drawCard);
    stage.querySelectorAll('.card-slot.filled[data-hand]').forEach(el => {
      const open = () => openCard(el.dataset.hand);
      el.addEventListener('click', open);
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
    });
  }

  // Holdings container: the house's counties (each with its own land/population), primary estate starred.
  function holdingsCard(counties) {
    const rows = counties.length
      ? counties.map((c, i) =>
          '<tr><td class="hd-name">' + esc(c.name) + (i === 0 ? ' <span class="hd-star">*</span>' : '') + '</td>' +
          '<td class="hd-name">' + esc(holdingLord()) + '</td>' +
          '<td>' + Number(c.available_land || 0).toLocaleString() + '</td>' +
          '<td>' + Number(c.population || 0).toLocaleString() + '</td>' +
          '<td>' + esc(unrestOf(c)) + '</td>' +
          '<td>' + (i === 0 ? '<button class="hd-go" id="hd-go" type="button">Go to Holdings</button>' : '') + '</td></tr>').join('')
      : '<tr><td class="hd-name hd-empty" colspan="6">No holdings yet.</td></tr>';
    return '<div class="holdings"><div class="hoh-title">Holdings</div><div class="hd-body">' +
      '<table class="hd-table"><thead><tr>' +
        '<th class="hd-name">Name</th><th class="hd-name">Lord</th><th>Available Land</th><th>Population</th><th>Unrest</th><th></th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>' +
      (counties.length ? '<p class="hd-note">* Primary Estate</p>' : '') +
    '</div></div>';
  }

  // Cards container: the house's hand (up to HAND_MAX). Full width, below Head of House + Holdings.
  // Each card has a top and a bottom (e.g. Feast / Feud); click one to choose a side and play it.
  const HAND_MAX = 5;
  function cardsCard() {
    const hand = house.hand || [];
    const slots = [];
    for (let i = 0; i < HAND_MAX; i++) {
      const c = hand[i];
      if (c) {
        const top = cardSides[c.card_key + ':top'], bot = cardSides[c.card_key + ':bottom'];
        slots.push('<div class="card-slot filled" role="button" tabindex="0" data-hand="' + esc(c.id) + '">' +
          '<span class="cs-top">' + esc(top ? top.name : c.card_key) + '</span>' +
          '<span class="cs-div">' + (bot ? '&mdash;' : '') + '</span>' +
          '<span class="cs-bot">' + esc(bot ? bot.name : '') + '</span></div>');
      } else {
        slots.push('<div class="card-slot"><span>Empty</span></div>');
      }
    }
    const canDraw = hand.length < HAND_MAX;
    return '<div class="cards">' +
      '<div class="cards-head"><span class="cards-title">Cards</span>' +
        '<span class="cards-count">( ' + hand.length + ' / ' + HAND_MAX + ' )</span>' +
        '<button class="mbtn cards-draw" id="draw-card" type="button"' + (canDraw ? '' : ' disabled') + '>Draw a Card</button></div>' +
      '<div class="cards-body">' + slots.join('') + '</div>' +
    '</div>';
  }

  // ---- card play: draw, open a card, choose a side, play it ----
  const cardModal = document.getElementById('card-modal');
  let carding = false;   // guards draw/play against double-fire

  // One guarded path for draw and play: lock, run the RPC, then reload + repaint the Home hall.
  // Returns the RPC outcome ({ data } | { error }) so play can narrate its result; null if it was locked.
  async function cardAction(run) {
    if (carding) return null;
    carding = true;
    let out;
    try { const { data, error } = await run(); if (error) throw error; out = { data }; }
    catch (e) { out = { error: e }; }
    try { await reloadThenRender(renderHome); } catch (e) {}
    carding = false;
    return out;
  }
  const drawCard = () => cardAction(() => supabase.rpc('kingdoms_draw'));

  // Friendly text for the errors the play RPC can raise (the affordable ones are already gated in the modal).
  function friendlyCardError(e) {
    const m = (e && e.message) || '';
    if (m.includes('already_married')) return 'There is no unmarried Personality of your House to wed.';
    if (m.includes('cannot_pay')) return 'You cannot pay the cost.';
    if (m.includes('not_playable')) return 'That side cannot be played yet.';
    if (m.includes('not_your_card')) return 'That card is no longer in your hand.';
    return '';
  }
  function showCardResult(msg) {
    document.getElementById('card-title').textContent = 'Result';
    document.getElementById('card-body').innerHTML = '<p class="pc-result">' + esc(msg) + '</p>';
    cardModal.classList.add('open');
  }

  // The one side of a card as a block: name, cost, effects, notes, and a Play button gated by cost/playability.
  function sideHTML(handId, key, side, which) {
    const c = cardSides[key + ':' + side];
    if (!c) return '';
    const res = house.resources || {};
    const affordable = (res.gold || 0) >= c.cost_gold && (res.food || 0) >= c.cost_food;
    const can = c.playable && affordable;
    const why = !c.playable ? 'Not yet available' : !affordable ? 'You cannot pay the cost' : '';
    const eff = (c.effects || []).map(e => '<li>' + esc(e) + '</li>').join('');
    const notes = (c.notes || []).map(n => '<p class="pc-note">' + esc(n) + '</p>').join('');
    return '<div class="pc-side' + (can ? ' playable' : '') + '">' +
      '<div class="pc-head"><span class="pc-name">' + esc(c.name) + '</span><span class="pc-which">' + esc(which) + '</span></div>' +
      '<div class="pc-cost">Cost: ' + esc(c.cost_text || 'None') + '</div>' +
      '<ul class="pc-eff">' + eff + '</ul>' + notes +
      (can
        ? '<button class="pc-play" type="button" data-play="' + esc(handId) + '" data-side="' + esc(side) + '">Play ' + esc(c.name) + '</button>'
        : '<div class="pc-why">' + esc(why) + '</div>') +
    '</div>';
  }

  function openCard(handId) {
    const card = (house.hand || []).find(h => h.id === handId);
    if (!card) return;
    document.getElementById('card-title').textContent = 'Play a Card';
    document.getElementById('card-body').innerHTML =
      sideHTML(handId, card.card_key, 'top', 'Top') + sideHTML(handId, card.card_key, 'bottom', 'Bottom');
    document.getElementById('card-body').querySelectorAll('[data-play]').forEach(btn =>
      btn.addEventListener('click', () => playCard(btn.dataset.play, btn.dataset.side)));
    cardModal.classList.add('open');
  }
  function closeCard() { cardModal.classList.remove('open'); }

  async function playCard(handId, side) {
    closeCard();   // the modal (and its Play button) closes first, so it can't be double-fired
    const r = await cardAction(() => supabase.rpc('kingdoms_play_card', { p_hand_id: handId, p_side: side }));
    if (!r) return;                                                  // was locked
    const msg = r.error ? friendlyCardError(r.error) : r.data;       // narrate the outcome (e.g. the Marry roll)
    if (msg) showCardResult(msg);
  }

  document.getElementById('card-close').addEventListener('click', closeCard);
  cardModal.addEventListener('click', e => { if (e.target === cardModal) closeCard(); });

  // ---- Holdings hall: collapsible holdings + build catalog ----
  const CAT_ORDER = ['Food', 'Economy', 'Military', 'Administration', 'Religion', 'Prestige'];
  const holdingOpen = {};   // county id → expanded?

  function renderHoldings(stage) {
    if (!house) { stage.innerHTML = ''; return; }
    const counties = house.counties || [];
    if (!counties.length) {
      stage.innerHTML = '<div class="view-wrap"><p class="empty-note">Your house holds no land yet.</p></div>';
      return;
    }
    counties.forEach((c, i) => { if (holdingOpen[c.id] === undefined) holdingOpen[c.id] = (i === 0); });
    stage.innerHTML = '<div class="view-wrap">' + counties.map((c, i) => holdingHTML(c, i === 0)).join('') + '</div>';

    stage.querySelectorAll('[data-toggle]').forEach(el => el.addEventListener('click', () => {
      const id = el.dataset.toggle; holdingOpen[id] = !holdingOpen[id]; renderHoldings(stage);
    }));
    stage.querySelectorAll('[data-build]').forEach(btn => btn.addEventListener('click', () => doBuild(btn.dataset.build, Number(btn.dataset.num))));
    stage.querySelectorAll('[data-raze]').forEach(btn => btn.addEventListener('click', () => doRaze(btn.dataset.raze)));
  }

  function holdingHTML(h, primary) {
    const used = usedLand(h), free = freeLand(h);
    let pips = '';
    for (let i = 0; i < (h.available_land || 0); i++) pips += '<span class="land-pip' + (i < used ? ' used' : '') + '"></span>';
    const terrain = (h.terrain ? esc(h.terrain) : '') + (primary ? ' · Primary Estate' : '');
    return '<section class="holding' + (holdingOpen[h.id] ? ' open' : '') + '">' +
      '<button class="holding-head" type="button" aria-expanded="' + !!holdingOpen[h.id] + '" data-toggle="' + esc(h.id) + '">' +
        '<span class="chev" aria-hidden="true"></span>' +
        '<span>' +
          '<span class="holding-name">' + esc(h.name) + (primary ? '<span class="star"> *</span>' : '') + '</span><br>' +
          '<span class="terrain">' + terrain + '</span>' +
        '</span>' +
        '<span class="head-stats">' +
          '<span class="hstat"><span class="lbl">Lord</span><span class="val">' + esc(holdingLord()) + '</span></span>' +
          '<span class="hstat"><span class="lbl">Population</span><span class="val">' + Number(h.population || 0).toLocaleString() + '</span></span>' +
          '<span class="hstat"><span class="lbl">Unrest</span><span class="val">' + esc(unrestOf(h)) + '</span></span>' +
          '<span class="hstat"><span class="lbl">Buildings</span><span class="val">' + (h.buildings || []).length + '</span></span>' +
          '<span class="hstat land-meter">' +
            '<span class="lbl">Available Land</span>' +
            '<span class="val' + (free === 0 ? ' warn' : '') + '">' + free + ' <span style="color:var(--faint);font-size:.72rem;">/ ' + (h.available_land || 0) + '</span></span>' +
            '<span class="land-bar">' + pips + '</span>' +
          '</span>' +
        '</span>' +
      '</button>' +
      '<div class="holding-body">' + holdingBodyHTML(h) + '</div>' +
    '</section>';
  }

  function holdingBodyHTML(h) {
    const built = h.buildings || [];
    const free = freeLand(h);
    const gold = house.resources ? (house.resources.gold || 0) : 0;
    let out = '<h3 class="sec-title">Constructed <span class="count">&mdash; ' + built.length + '</span></h3>';

    if (!built.length) {
      out += '<p class="empty-note">No buildings stand here. The land is open.</p>';
    } else {
      out += '<div class="built-list">' + built.map(row => {
        const b = specByNum[row.building_num]; if (!b) return '';
        const eff = (b.eff || []).map(e => esc(e)).join(' · ');
        return '<div class="built-row">' +
          '<span class="built-name">' + esc(b.name) + '</span>' +
          '<span class="built-eff">' + eff + '</span>' +
          '<span class="built-plot">' + b.land + ' plot' + (b.land > 1 ? 's' : '') + (b.upkeep ? ' · ' + b.upkeep + ' upkeep' : '') + '</span>' +
          '<button class="raze" type="button" data-raze="' + esc(row.id) + '">Raze</button>' +
        '</div>';
      }).join('') + '</div>';
    }

    out += '<h3 class="sec-title">Construct <span class="count">&mdash; ' + free + ' plot' + (free === 1 ? '' : 's') + ' free, ' + gold + ' gold</span></h3>';
    out += CAT_ORDER.map(cat => {
      const list = catalog.filter(b => b.category === cat);
      if (!list.length) return '';
      return '<div class="cat-block"><h4 class="cat-name">' + esc(cat) + '</h4><div class="bld-grid">' +
        list.map(b => buildingCardHTML(h, b, free, gold)).join('') +
      '</div></div>';
    }).join('');
    return out;
  }

  function buildingCardHTML(h, b, free, gold) {
    const noTerrain = b.needs === 'hills' && !h.hills;
    const noGold = b.cost > gold;
    const noLand = b.land > free;
    const can = !noTerrain && !noGold && !noLand;
    const why = noTerrain ? (b.need_text || 'Terrain required') : noLand ? 'No room' : noGold ? 'Not enough gold' : '';
    return '<div class="bld ' + (can ? 'can' : 'cant') + '">' +
      '<div class="bld-top"><span class="bld-num">' + b.num + '</span><span class="bld-name">' + esc(b.name) + '</span></div>' +
      '<div class="bld-costs">' +
        '<span class="c-gold">' + b.cost + ' Gold</span>' +
        (b.upkeep ? '<span class="c-up">' + b.upkeep + ' Upkeep</span>' : '') +
        '<span class="c-land">' + b.land + ' Plot' + (b.land > 1 ? 's' : '') + '</span>' +
      '</div>' +
      '<ul class="bld-eff">' + (b.eff || []).map(e => '<li>' + esc(e) + '</li>').join('') +
        (b.need_text ? '<li class="needs">' + esc(b.need_text) + '</li>' : '') +
      '</ul>' +
      (can
        ? '<button class="build-btn" type="button" data-build="' + esc(h.id) + '" data-num="' + b.num + '">Build</button>'
        : '<div class="lock-why">' + esc(why) + '</div>') +
    '</div>';
  }

  // Build/raze share one guarded path: the lock blocks a second click before the first resolves, and the
  // server (which enforces gold/land/terrain/ownership) is the authority — we always reload the true state.
  let acting = false;
  async function holdingAction(run) {
    if (acting) return;
    acting = true;
    try {
      const { error } = await run();
      if (error) throw error;            // e.g. not_enough_gold / no_room / terrain_required (already gated in UI)
    } catch (e) { /* fall through: the reload below shows the true server state */ }
    try { await reloadThenRender(renderHoldings); } catch (e) { /* keep the current view rather than crash */ }
    acting = false;
  }
  const doBuild = (countyId, num) => holdingAction(() => supabase.rpc('kingdoms_build', { p_county: countyId, p_building: num }));
  const doRaze = (buildingId) => holdingAction(() => supabase.rpc('kingdoms_raze', { p_building: buildingId }));

  // Re-fetch the house after a server write, repaint the top bar, then re-render the given view.
  // One reload path shared by build/raze and Claim the Throne.
  async function reloadThenRender(render) {
    await loadHouseData();
    updateTopbar();
    render(document.getElementById('stage'));
  }

  // ---- Dynasty hall: the house tree (new players hold only the head of house) ----
  // A dynasty member as a plain object → the tree card and the character popup read from the same shape.
  function headOfHouse() {
    const res = house.resources || {};
    return {
      name: house.leader_name || 'Unknown',
      age: house.leader_age,
      spouse: house.spouse_name || null, children: null,   // spouse set by the Marry card; children not yet modeled
      ambition: Number(res.ambition || 0),
      prowess: Number(res.prowess || 0),
      administration: Number(res.administration || 0)
    };
  }

  // The head's spouse as a plain character (a courtier who wed in; we track only her name so far).
  function spouseCharacter() {
    return { name: house.spouse_name, age: null, spouse: house.leader_name, children: null, ambition: null, prowess: null, administration: null };
  }

  function renderDynasty(stage) {
    if (!house) { stage.innerHTML = ''; return; }
    const label = houseLabel(house.house_name);
    const title = esc(fullRank());
    const age = house.leader_age != null ? ' <span class="age">(' + esc(house.leader_age) + ')</span>' : '';
    const headCard =
      '<div class="dyn-card head" id="dyn-head" role="button" tabindex="0">' +
        '<div class="dyn-name">' + esc(house.leader_name || 'Unknown') + age + '</div>' +
        '<div class="dyn-role">Head of ' + esc(label) + '</div>' +
        '<div class="dyn-sub">' + title + '</div>' +
      '</div>';
    const spouseCard = house.spouse_name   // once married, the spouse joins the tree beside the head
      ? '<span class="marriage" aria-hidden="true"></span>' +
        '<div class="dyn-card" id="dyn-spouse" role="button" tabindex="0">' +
          '<div class="dyn-name">' + esc(house.spouse_name) + '</div>' +
          '<div class="dyn-role">Consort of ' + esc(label) + '</div>' +
          '<div class="dyn-sub">Courtier of the realm</div>' +
        '</div>'
      : '';
    stage.innerHTML =
      '<div class="view-wrap"><section class="panel">' +
        '<h2 class="panel-head">Dynasty of ' + esc(label) + '</h2>' +
        '<div class="panel-body"><div class="tree"><div class="couple">' + headCard + spouseCard + '</div></div></div>' +
      '</section></div>';
    wireCard('dyn-head', () => openCharacter(headOfHouse()));
    wireCard('dyn-spouse', () => openCharacter(spouseCharacter()));
  }

  // Attach click + keyboard "open" to a dynasty card if it's present.
  function wireCard(id, open) {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('click', open);
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
  }

  // ---- Court hall: sovereign + council (every seat starts empty — no one is seated yet) ----
  const COURT_SEATS = ['Steward', 'Master of Coin', 'Marshal of the Realm', 'Master of Laws', 'Master of Ships', 'Spymaster'];
  const CROWN_SVG = '<svg class="crown" width="46" height="30" viewBox="0 0 46 30" aria-hidden="true">' +
    '<path d="M4 26 L7 8 L15 17 L23 4 L31 17 L39 8 L42 26 Z" fill="none" stroke="#b99653" stroke-width="1.6" stroke-linejoin="round"/>' +
    '<circle cx="23" cy="3" r="2" fill="#b99653"/><circle cx="7" cy="7" r="1.6" fill="#b99653"/><circle cx="39" cy="7" r="1.6" fill="#b99653"/></svg>';

  function renderCourt(stage) {
    if (!house) { stage.innerHTML = ''; return; }
    const seats = COURT_SEATS.map(label =>
      '<div class="seat vacant"><p class="seat-label">' + esc(label) + '</p>' +
      '<p class="seat-vacant-text">The seat stands empty.</p></div>').join('');

    const sov = house.sovereign;
    let sovInner;
    if (sov) {                                          // the realm has a sovereign — show them
      const age = sov.leader_age != null ? ' <span class="age">' + esc(sov.leader_age) + '</span>' : '';
      const yours = isSovereign() ? '<p class="yours-tag">Your House holds the throne</p>' : '';
      sovInner = CROWN_SVG +
        '<p class="seat-label">Sovereign</p>' +
        '<p class="sov-name">' + nameOfHouse(sov.leader_name, sov.house_name) + ',' + age + '</p>' +
        '<p class="sov-reign">' + esc(sovereignRank()) + '</p>' + yours;
    } else {                                            // empty throne — offer the claim (only place, only at start)
      sovInner = CROWN_SVG +
        '<p class="seat-label">Sovereign</p>' +
        '<p class="seat-vacant-text">The throne sits empty.</p>' +
        '<button class="mbtn primary claim-btn" id="claim-throne" type="button">Claim the Throne</button>';
    }
    const foot = isSovereign()
      ? esc(houseLabel(house.house_name)) + ' sits the throne of the ' + esc(nationName()) + '.'
      : esc(houseLabel(house.house_name)) + ' holds no seat at this court.';

    stage.innerHTML =
      '<div class="view-wrap"><div class="court">' +
        '<h2 class="court-title">The Court of ' + esc(realmName()) + '</h2>' +
        '<section class="sovereign">' + sovInner + '</section>' +
        '<h3 class="council-title">The King’s Council</h3>' +
        '<div class="council">' + seats + '</div>' +
        '<p class="court-foot">' + foot + '</p>' +
      '</div></div>';

    const claimBtn = document.getElementById('claim-throne');
    if (claimBtn) claimBtn.addEventListener('click', claimThrone);
  }

  // Claim the empty throne: the head of house becomes Sovereign (+7 Prestige). Guarded against double-fire;
  // the server is authoritative (one sovereign per realm), and we reload the true state after.
  let claiming = false;
  async function claimThrone() {
    if (claiming) return;
    claiming = true;
    try {
      const { error } = await supabase.rpc('kingdoms_claim_throne');
      if (error) throw error;
    } catch (e) { /* fall through: the reload shows the true state (e.g. someone beat us to it) */ }
    try { await reloadThenRender(renderCourt); } catch (e) {}
    claiming = false;
  }

  // ---- Laws hall: the realm's standing laws. Crown-set; Aldren starts High on Crown Authority and holds no
  // assembly, so there is no vote or debate — the tiers below simply show where each law stands. ----
  const LAW_GROUPS = ['Crown', 'Coin', 'Sword', 'Justice'];
  const LAWS = [
    { group: 'Crown', name: 'Crown Authority', at: 3,
      tiers: ['Minimal', 'Limited', 'Moderate', 'High', 'Absolute'],
      eff: ['The Crown may revoke any vassal’s title at will',
            'Vassals owe the greater share of their levies to the Crown',
            'Royal justice overrides a lord’s own courts'],
      you: () => 'The Crown’s word runs law in your halls; you hold your lands at its pleasure.' },
    { group: 'Crown', name: 'Succession', at: 1,
      tiers: ['Elective', 'Partition', 'Primogeniture', 'Ultimogeniture'],
      eff: ['Holdings are divided among all trueborn sons on the lord’s death',
            'Houses fracture quickly, but cadet branches multiply'],
      you: () => 'With no children born, your holdings would pass to your nearest kin.' },
    { group: 'Coin', name: 'Crown Taxation', at: 1,
      tiers: ['None', 'Tithe — 1 in 10', 'Fifth — 1 in 5', 'Half'],
      eff: ['Each vassal owes the Crown one tenth of gold raised in Taxation',
            'Refusal earns a claim against your titles'],
      you: () => 'For every 10 gold you raise in Taxation, 1 is owed to the Crown.' },
    { group: 'Coin', name: 'Right of Toll', at: 1,
      tiers: ['Forbidden', 'Granted', 'Crown Monopoly'],
      eff: ['Lords may levy tolls on roads and rivers crossing their domain',
            '+1 Gold per Market at Taxation'],
      you: c => 'Build a Market in ' + (c.seat || 'your domain') + ' to claim the toll.' },
    { group: 'Sword', name: 'Vassal Wars', at: 1,
      tiers: ['Unrestricted', 'With Cause', 'Feuds Only', 'Forbidden'],
      eff: ['A vassal may war upon another only with a recognised claim or grievance',
            'War without cause brands you Oathbreaker — −2 Prestige, and the Crown may intervene'],
      you: () => 'You hold no claims. You cannot lawfully war upon anyone.' },
    { group: 'Sword', name: 'Levy Obligation', at: 1,
      tiers: ['Voluntary', 'One in Ten', 'One in Five'],
      eff: ['When the Crown calls its banners, each lord owes one man in ten',
            'Failing the call costs 3 Prestige and the Crown’s favour'],
      you: () => 'When the Crown calls its banners, you owe one man in ten of your levy.' },
    { group: 'Justice', name: 'Right of Trial', at: 1,
      tiers: ['Lord’s Judgment', 'Trial by Combat', 'Royal Courts'],
      eff: ['The accused may demand a champion and settle the matter in arms',
            'Prowess decides guilt as often as evidence'],
      you: c => 'Your Prowess is ' + c.prowess + '. ' + (c.prowess > 0 ? 'Meet your accuser in the field if you must.' : 'Avoid accusation, or find a champion.') }
  ];

  function lawHTML(law, ctx) {
    const track = law.tiers.map((t, i) => '<span class="tier' + (i < law.at ? ' below' : i === law.at ? ' at' : '') + '"></span>').join('');
    const names = law.tiers.map((t, i) => '<span class="tier-name' + (i === law.at ? ' at' : '') + '">' + esc(t) + '</span>').join('');
    const eff = law.eff.map(e => '<li>' + esc(e) + '</li>').join('');
    return '<section class="law">' +
      '<div class="law-top"><span class="law-name">' + esc(law.name) + '</span>' +
        '<span class="law-now">' + esc(law.tiers[law.at]) + '</span></div>' +
      '<div class="track">' + track + '</div>' +
      '<div class="tier-names">' + names + '</div>' +
      '<ul class="law-eff">' + eff + '</ul>' +
      '<p class="law-you"><span class="tag">Your House</span>' + esc(law.you(ctx)) + '</p>' +
    '</section>';
  }

  function renderLaws(stage) {
    if (!house) { stage.innerHTML = ''; return; }
    const res = house.resources || {};
    const ctx = { prowess: Number(res.prowess || 0), seat: primarySeat() };
    const groups = LAW_GROUPS.map(g => {
      const laws = LAWS.filter(l => l.group === g);
      return laws.length ? '<h3 class="group-title">' + esc(g) + '</h3>' + laws.map(l => lawHTML(l, ctx)).join('') : '';
    }).join('');
    stage.innerHTML =
      '<div class="view-wrap"><div class="laws">' +
        '<div class="laws-head">' +
          '<h2 class="laws-title">The Laws of ' + esc(realmName()) + '</h2>' +
          '<p class="laws-sub">Decreed by the Crown and binding on every vassal. This realm holds no assembly — the lords have no vote.</p>' +
          '<div class="laws-voice"><span class="voice-item"><span class="lbl">Your Standing</span>' +
            '<span class="val">' + esc(isSovereign() ? SOVEREIGN_TITLE : (house.leader_title || 'Count')) + '</span></span></div>' +
        '</div>' + groups +
      '</div></div>';
  }

  // ---- Conflict hall: strength snapshot + wars / claims / pacts / feuds. Everything starts empty (no king's
  // summons, no other houses, no armies yet); only Prowess and the house name are real. ----
  function renderConflict(stage) {
    if (!house) { stage.innerHTML = ''; return; }
    const res = house.resources || {};
    const prowess = Number(res.prowess || 0);
    const lord = house.leader_name || 'Your lord';
    const label = houseLabel(house.house_name);
    const cells = [
      { lbl: 'Levy Raised', val: '0', note: 'No levies raised' },
      { lbl: 'Men-at-Arms', val: '0', zero: true, note: 'None trained' },
      { lbl: 'Prowess', val: String(prowess), zero: prowess === 0, note: prowess === 0 ? lord + ' is untested' : 'Led by ' + lord },
      { lbl: 'Defense', val: '0', note: 'No Watchtower, no Keep' },
      { lbl: 'Cavalry', val: '—', zero: true, note: 'Requires Stables' }
    ];
    const strength = cells.map(c =>
      '<div class="str-cell"><span class="lbl">' + esc(c.lbl) + '</span>' +
      '<span class="val' + (c.zero ? ' zero' : '') + '">' + esc(c.val) + '</span>' +
      '<span class="note">' + esc(c.note) + '</span></div>').join('');

    stage.innerHTML =
      '<div class="view-wrap"><div class="conflict">' +
        '<h3 class="group-title">Your Strength</h3>' +
        '<div class="strength">' + strength + '</div>' +

        '<h3 class="group-title">Wars <span class="muted">— none in the realm</span></h3>' +
        '<div class="empty"><p>No wars are being fought. The realm keeps an uneasy peace.</p></div>' +

        '<h3 class="group-title">Claims &amp; Grievances <span class="muted">— none held</span></h3>' +
        '<div class="empty"><p>You hold no claim upon any title. Under <em>Vassal Wars — With Cause</em>, you cannot lawfully war upon anyone.</p>' +
          '<ul class="ways">' +
            '<li>Marry into a house with a disputed inheritance</li>' +
            '<li>Employ a Spymaster to fabricate a claim — 6 Gold, and the risk of discovery</li>' +
            '<li>Inherit through the death of a kinsman</li>' +
            '<li>Answer a grievance done to your house, and name it cause</li>' +
          '</ul></div>' +

        '<h3 class="group-title">Pacts &amp; Alliances <span class="muted">— none</span></h3>' +
        '<div class="empty"><p>No pacts bind your house. You stand alone.</p></div>' +

        '<h3 class="group-title">Feuds <span class="muted">— none</span></h3>' +
        '<div class="empty"><p>No house holds a grievance against ' + esc(label) + '. Your name is clean, and unremarkable.</p></div>' +
      '</div></div>';
  }

  // ---- character popup ----
  const charModal = document.getElementById('char-modal');
  function openCharacter(c) {
    document.getElementById('char-name').textContent = (c.name || 'Unknown') + ' of ' + houseLabel(house.house_name);
    document.getElementById('char-body').innerHTML =
      kvRow('Age', esc(c.age != null ? c.age : '—'), c.age == null) +
      kvRow('Spouse', c.spouse ? esc(c.spouse) : '—', !c.spouse) +
      kvRow('Children', c.children ? esc(c.children) : '—', !c.children) +
      kvRow('Ambition', c.ambition != null ? esc(c.ambition) : '—', c.ambition == null) +
      kvRow('Prowess', c.prowess != null ? esc(c.prowess) : '—', c.prowess == null) +
      kvRow('Administration', c.administration != null ? esc(c.administration) : '—', c.administration == null);
    charModal.classList.add('open');
  }
  function closeCharacter() { charModal.classList.remove('open'); }
  document.getElementById('char-close').addEventListener('click', closeCharacter);
  charModal.addEventListener('click', e => { if (e.target === charModal) closeCharacter(); });

  // ---- banner upload modal ----
  const modal = document.getElementById('banner-modal');
  const fileInput = document.getElementById('banner-file');
  const preview = document.getElementById('banner-preview');
  const note = document.getElementById('banner-note');
  const saveBtn = document.getElementById('banner-save');
  const NOTE_DEFAULT = 'PNG, JPG, WebP or GIF · up to 2 MB · free';
  let chosenFile = null, uploading = false;

  function openBanner() {
    chosenFile = null; fileInput.value = ''; saveBtn.disabled = true;
    note.textContent = NOTE_DEFAULT; note.className = 'modal-note';
    preview.innerHTML = house && house.banner_url ? '<img alt="Current banner" src="' + esc(house.banner_url) + '">' : 'No image chosen';
    modal.classList.add('open');
  }
  function closeBanner() { if (!uploading) modal.classList.remove('open'); }

  fileInput.addEventListener('change', () => {
    const f = fileInput.files && fileInput.files[0];
    if (!f) { chosenFile = null; saveBtn.disabled = true; return; }
    if (f.size > 2 * 1024 * 1024) { note.textContent = 'That image is over 2 MB.'; note.className = 'modal-note err'; chosenFile = null; saveBtn.disabled = true; return; }
    chosenFile = f; saveBtn.disabled = false;
    note.textContent = NOTE_DEFAULT; note.className = 'modal-note';
    preview.innerHTML = '<img alt="Preview" src="' + URL.createObjectURL(f) + '">';
  });
  saveBtn.addEventListener('click', async () => {
    if (!chosenFile || uploading || !house) return;
    uploading = true; saveBtn.disabled = true; note.textContent = 'Uploading…'; note.className = 'modal-note';
    try {
      const url = await uploadToStorage('kingdoms-banners', '', chosenFile, 2);
      const { error } = await supabase.rpc('kingdoms_set_banner', { p_house: house.id, p_url: url });
      if (error) throw error;
      house.banner_url = url;
      uploading = false;
      closeBanner();
      renderHome(document.getElementById('stage'));   // repaint the card with the new banner
    } catch (e) { uploading = false; note.textContent = e.message || 'Upload failed. Try again.'; note.className = 'modal-note err'; saveBtn.disabled = false; }
  });
  document.getElementById('banner-cancel').addEventListener('click', closeBanner);
  modal.addEventListener('click', e => { if (e.target === modal) closeBanner(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeBanner(); closeCharacter(); closeCard(); } });

  // ---- data load ----
  async function ensureCatalog() {
    if (catalog.length) return;
    const { data, error } = await supabase.from('kingdoms_building_specs')
      .select('num, name, category, cost, land, upkeep, needs, eff, need_text').order('num', { ascending: true });
    if (error) throw error;
    catalog = data || [];
    catalog.forEach(s => { specByNum[s.num] = s; });
  }

  async function ensureCards() {
    if (cardCatalog.length) return;
    const { data, error } = await supabase.from('kingdoms_cards')
      .select('card_key, side, name, cost_text, cost_gold, cost_food, effects, notes, playable');
    if (error) throw error;
    cardCatalog = data || [];
    cardCatalog.forEach(c => { cardSides[c.card_key + ':' + c.side] = c; });
  }

  // Load (or reload) the signed-in player's house: the leader row, its counties, and each county's buildings.
  // Returns false if there is no signed-in user or no house (caller redirects).
  async function loadHouseData() {
    const { data: u } = await supabase.auth.getUser();
    const uid = u && u.user ? u.user.id : null;
    if (!uid) return false;
    const { data, error } = await supabase.from('kingdoms_leaders')
      .select('id, house_name, heritage, leader_name, leader_age, leader_title, banner_url, resources, is_sovereign, spouse_name')
      .eq('user_id', uid).order('created_at', { ascending: false }).limit(1).maybeSingle();
    if (error) throw error;
    if (!data) return false;
    house = data;
    const { data: cs } = await supabase.from('kingdoms_counties')
      .select('id, name, available_land, population, terrain, hills, unrest').eq('held_by', house.id).order('name', { ascending: true });
    house.counties = cs || [];
    const ids = house.counties.map(c => c.id);
    let builds = [];
    if (ids.length) {
      const { data: bd } = await supabase.from('kingdoms_holding_buildings')
        .select('id, county_id, building_num').in('county_id', ids).order('created_at', { ascending: true });
      builds = bd || [];
    }
    house.counties.forEach(c => { c.buildings = builds.filter(b => b.county_id === c.id); });
    // Who, if anyone, holds the realm's throne (public game state; may be this house or another).
    const { data: sov } = await supabase.from('kingdoms_leaders')
      .select('leader_name, house_name, leader_age').eq('heritage', house.heritage).eq('is_sovereign', true)
      .order('created_at', { ascending: true }).limit(1).maybeSingle();
    house.sovereign = sov || null;
    const { data: hand } = await supabase.from('kingdoms_hand')
      .select('id, card_key').eq('house_id', house.id).order('created_at', { ascending: true });
    house.hand = hand || [];   // the cards currently in hand
    return true;
  }

  (async () => {
    if (!isConfigured) { setBar('—'); return; }
    try {
      await ensureCatalog();                                     // building specs (one source, small, cached)
      await ensureCards();                                       // card catalog (one source, small, cached)
      const ok = await loadHouseData();
      if (!ok) { window.location.replace('/kingdoms/'); return; } // not signed in / no house yet
      setBar(house.house_name);
      updateTopbar();
      renderView('home');
    } catch (e) { window.location.replace('/kingdoms/'); }
  })();
</script>

</body>
</html>
