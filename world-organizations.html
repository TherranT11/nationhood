<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Organizations</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  :root{
    --bg:#080808; --panel:#0d0d0d; --panel2:#101010;
    --line:rgba(255,255,255,0.07); --txt:#d4d4d4; --mut:#888; --faint:#666;
    --amber:#c8a64e; --amber-bg:#161208; --amber-dim:rgba(200,166,78,0.4);
    --neu:#d4b87a;
  }
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,system-ui,sans-serif;min-height:100vh;}
  .content{padding:30px 22px;}
  .wrap{max-width:1280px;margin:0 auto;}

  .crumb{font-size:9px;letter-spacing:0.13em;color:var(--faint);margin-bottom:16px;text-transform:uppercase;}
  .crumb a{color:var(--mut);text-decoration:none;}
  .crumb a:hover{color:var(--amber);}
  .crumb .sep{margin:0 7px;color:#3a3a3a;}

  /* Header: title block left, Found New Organization action right. */
  .page-header{margin-bottom:28px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;}
  .ph-eyebrow{font-size:10px;letter-spacing:0.18em;color:var(--amber);text-transform:uppercase;
    font-family:monospace;margin-bottom:10px;}
  .ph-title{font-size:28px;font-weight:500;letter-spacing:-0.01em;color:#fff;
    font-family:Georgia,'Times New Roman',serif;font-style:italic;}
  .ph-sub{font-size:12px;color:var(--mut);margin-top:8px;}

  .wom-found{flex-shrink:0;padding:11px 18px;background:var(--amber-bg);
    border:0.5px solid var(--amber-dim);border-radius:5px;color:var(--amber);
    font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;
    cursor:pointer;font-family:monospace;}
  .wom-found:hover{background:rgba(200,166,78,0.16);}

  .locked{margin-top:60px;text-align:center;color:var(--neu);font-size:14px;
    font-family:Georgia,serif;font-style:italic;}

  .section{background:var(--panel);border:0.5px solid var(--line);border-radius:6px;
    padding:18px;margin-bottom:18px;}
  .section-head{font-size:10px;letter-spacing:0.16em;color:var(--mut);text-transform:uppercase;
    font-family:monospace;margin-bottom:14px;}
  .sec-empty{color:#555;font-size:12px;font-style:italic;text-align:center;padding:24px 0;}

  /* World Organization category sectors — one source in
     js/game/world-org-sectors.js; the nations page carries the same CSS. */
  .wo-cat{background:#0a0a09;border:0.5px solid rgba(255,255,255,0.08);
    border-left:2px solid var(--wo-accent,#555);border-radius:6px;margin-bottom:8px;}
  .wo-cat:last-child{margin-bottom:0;}
  .wo-cat summary{padding:12px 16px;cursor:pointer;list-style:none;
    display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .wo-cat summary::-webkit-details-marker{display:none;}
  .wo-cat-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .wo-cat-ico{width:22px;text-align:center;color:var(--wo-accent,#888);font-size:14px;flex-shrink:0;}
  .wo-cat-name{font-size:13px;font-weight:600;color:#e2e2e2;letter-spacing:0.02em;}
  .wo-cat-meta{font-size:11px;color:#777;white-space:nowrap;}
  .wo-cat-meta b{color:#aaa;font-weight:600;}
  .wo-cat[open] summary{border-bottom:0.5px solid rgba(255,255,255,0.06);}
  .wo-cat-body{padding:14px 16px;}
  .wo-org{font-size:13px;color:#d4d4d4;padding:8px 10px;background:var(--panel2);
    border:0.5px solid var(--line);border-radius:4px;margin-bottom:6px;}
  .wo-org:last-child{margin-bottom:0;}

  .loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--mut);font-size:12px;letter-spacing:0.1em;z-index:50;}
</style>
</head>
<body>
<div id="pol-topbar-container"></div>
<div id="ent-topbar"></div>

<div class="content">
  <div class="wrap">
    <div class="crumb" id="crumb"></div>
    <div class="page-header">
      <div>
        <div class="ph-eyebrow">— WORLD ORGANIZATIONS —</div>
        <h1 class="ph-title">World Organization Management</h1>
        <div class="ph-sub" id="ph-sub"></div>
      </div>
      <button type="button" class="wom-found" id="found-org">Found New Organization</button>
    </div>

    <div id="locked" class="locked" style="display:none">
      Only the Foreign Affairs &amp; Trade Minister or the Head of Government can manage world organizations.
    </div>

    <div id="page" style="display:none">
      <section class="section">
        <div class="section-head">Memberships by Sector</div>
        <div id="wo-cats"></div>
      </section>
    </div>
  </div>
</div>

<div id="loading" class="loading">LOADING...</div>

<script type="module">
import { bootstrapPoliticianOrBusinessman } from './js/politician-topbar.js';
import { _supabase } from './js/supabase-client.js';
import { escapeHtml } from './js/utils.js';
import { worldOrgSectorsHtml } from './js/game/world-org-sectors.js';

async function init() {
  let ctx = null;
  try { ctx = await bootstrapPoliticianOrBusinessman('nation', 'nation'); }
  catch (err) {
    console.error('world-organizations: bootstrap failed', err);
    document.getElementById('loading').textContent = 'Failed to load. Please reload the page.';
    return;
  }
  if (!ctx) return;

  const nation  = ctx.nation;
  const faction = ctx.faction;
  if (!nation || !faction) {
    document.getElementById('loading').textContent = 'No nation associated with this politician.';
    return;
  }

  document.title = `${nation.name} — World Organizations`;
  document.getElementById('ph-sub').textContent = nation.name;
  document.getElementById('crumb').innerHTML =
    `<a href="politician-nation.html">${escapeHtml((nation.name || 'NATION').toUpperCase())}</a>` +
    ` <span class="sep">·</span> WORLD ORGANIZATIONS`;

  // Gate: the dedicated Foreign Minister post (politician_foreign_minister_at_tick,
  // 20270868) or the Head of Government. Matches the Cabinet Office's entry.
  const isFM = faction.politician_foreign_minister_at_tick != null;
  const { data: hog, error: hogErr } = await _supabase.from('head_of_government')
    .select('faction_id').eq('nation_id', nation.id).eq('active', true).maybeSingle();
  if (hogErr) console.warn('world-organizations: head_of_government fetch failed', hogErr);
  const isPM = !!hog && hog.faction_id === faction.id;

  document.getElementById('loading').style.display = 'none';
  if (!isFM && !isPM) {
    document.getElementById('locked').style.display = 'block';
    document.getElementById('found-org').style.display = 'none';
    return;
  }

  // No organizations exist yet — the five sectors render 0/0 until the
  // founding flow + an organizations table land. One source for the cards.
  document.getElementById('wo-cats').innerHTML = worldOrgSectorsHtml();
  document.getElementById('page').style.display = 'block';

  document.getElementById('found-org').addEventListener('click', () => {
    alert('Founding a new organization is coming soon.');
  });
}

init();
</script>
</body>
</html>
