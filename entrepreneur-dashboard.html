<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Entrepreneur — Home</title>
<style>
  /* Topbar/nav/switcher styling + body base live in
     js/entrepreneur-topbar.js (one source, used by every entrepreneur
     page). This page only styles its own body content. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #050505; color: #d4d4d4; font-family: -apple-system, system-ui, sans-serif; min-height: 100vh; }
  .container { width: 100%; }
  .content { padding: 32px 24px 24px; }
  .hero { display: grid; grid-template-columns: 1fr auto; gap: 32px; margin-bottom: 28px; }
  .identity { display: flex; align-items: flex-start; gap: 20px; }
  .identity-portrait {
    width: 88px; height: 88px;
    background: linear-gradient(135deg, #2a2a25, #1a1a17);
    border: 0.5px solid rgba(138,170,106,0.3);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    color: #8aaa6a;
    font-size: 28px;
    font-weight: 500;
    letter-spacing: 0.03em;
    flex-shrink: 0;
  }
  .identity-body .eyebrow { color: #8aaa6a; font-size: 10px; letter-spacing: 0.15em; margin-bottom: 6px; }
  .identity-body .name { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .identity-body .first { font-size: 46px; font-weight: 500; color: #fff; letter-spacing: -0.01em; line-height: 1; }
  .identity-body .last {
    font-size: 46px;
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    color: #8aaa6a;
    letter-spacing: -0.01em;
    line-height: 1;
  }
  .identity-body .meta-row {
    display: flex; gap: 28px; font-size: 11px; letter-spacing: 0.08em; color: #888; margin-bottom: 12px;
  }
  .identity-body .meta-row .label { color: #555; margin-right: 6px; }
  .identity-body .meta-row .val { color: #d4d4d4; }
  .identity-body .bio {
    font-size: 12px; color: #888; line-height: 1.6; max-width: 600px;
    font-style: italic; font-family: Georgia, 'Times New Roman', serif;
  }
  .anchor {
    text-align: right; padding-left: 28px;
    border-left: 0.5px solid rgba(255,255,255,0.08); min-width: 280px;
  }
  .anchor-label { color: #555; font-size: 10px; letter-spacing: 0.15em; margin-bottom: 6px; }
  .anchor-value { font-size: 52px; font-weight: 500; color: #fff; letter-spacing: -0.02em; line-height: 1; }
  .anchor-sub { color: #555; font-size: 10px; margin-top: 8px; letter-spacing: 0.08em; }
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: #121212; border: 0.5px solid rgba(255,255,255,0.08);
    border-radius: 4px; padding: 14px 16px;
  }
  .stat-card.accent { border-top: 2px solid #8aaa6a; }
  .stat-card .stat-label { color: #666; font-size: 10px; letter-spacing: 0.13em; margin-bottom: 8px; }
  .stat-card .stat-value { font-size: 24px; font-weight: 500; color: #fff; line-height: 1; }
  .stat-card .stat-value.gold { color: #8aaa6a; }
  .stat-card .stat-sub { color: #888; font-size: 11px; margin-top: 6px; letter-spacing: 0.05em; }
  .main-grid { display: grid; grid-template-columns: 320px 1fr; gap: 22px; }
  .events-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .events-header .title {
    color: #8aaa6a; font-size: 11px; letter-spacing: 0.15em; font-weight: 500;
    display: flex; align-items: center; gap: 6px;
  }
  .events-header .title .dot { display: inline-block; width: 6px; height: 6px; background: #8aaa6a; border-radius: 50%; }
  .events-header .count { color: #555; font-size: 10px; letter-spacing: 0.1em; }
  .empty {
    background: #121212; border: 0.5px dashed rgba(255,255,255,0.10);
    border-radius: 4px; padding: 22px 18px; color: #666;
    font-size: 12px; line-height: 1.6; text-align: center;
  }
  .ev-tabs { display: flex; gap: 4px; margin-bottom: 12px; }
  .ev-tab { flex: 1; padding: 7px 0; text-align: center; font-size: 10px; letter-spacing: 0.1em;
    color: #888; background: #121212; border: 0.5px solid rgba(255,255,255,0.08);
    border-radius: 3px; cursor: pointer; }
  .ev-tab:hover:not(.active) { color: #d4d4d4; }
  .ev-tab.active { color: #8aaa6a; border-color: #6a8a4a; background: #131613; }
  .ev-list { list-style: none; display: flex; flex-direction: column; max-height: 600px; overflow-y: auto; }
  .ev-item { padding: 12px 0; border-bottom: 0.5px solid rgba(255,255,255,0.06); }
  .ev-item:last-child { border-bottom: none; }
  .ev-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .ev-tag { font-size: 9px; letter-spacing: 0.08em; padding: 2px 7px; border-radius: 3px;
    background: #1f2a1a; color: #8aaa6a; text-transform: uppercase; }
  .ev-nation { font-size: 9px; color: #888; letter-spacing: 0.06em; display: flex; align-items: center; gap: 4px; }
  .ev-nation img { width: 12px; height: 9px; object-fit: cover; border-radius: 1px; }
  .ev-time { margin-left: auto; font-size: 9px; color: #555; letter-spacing: 0.1em; }
  .ev-head { font-size: 13px; font-weight: 500; color: #fff; margin-bottom: 3px; }
  .ev-body { font-size: 11px; color: #888; line-height: 1.5; }
  .ev-empty { color: #666; font-size: 12px; padding: 22px 4px; text-align: center; line-height: 1.6; }
  .right-col { display: flex; flex-direction: column; gap: 28px; }
  .section-heading { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
  .section-heading .roman { color: #555; font-size: 11px; letter-spacing: 0.1em; }
  .section-heading .sans { font-size: 22px; font-weight: 500; color: #fff; }
  .section-heading .serif {
    font-size: 22px; font-family: Georgia, 'Times New Roman', serif; font-style: italic; color: #8aaa6a;
  }
  .section-heading .meta { margin-left: auto; color: #555; font-size: 10px; letter-spacing: 0.1em; }
  .ch-list { display: flex; flex-direction: column; gap: 10px; }
  .ch-row { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center;
    background: #121212; border: 0.5px solid rgba(255,255,255,0.08); border-left: 2px solid #8aaa6a;
    border-radius: 4px; padding: 14px 16px; cursor: pointer; text-decoration: none; }
  .ch-row:hover { background: #141614; border-color: rgba(138,170,106,0.3); }
  .ch-name { font-size: 15px; font-weight: 500; color: #fff; margin-bottom: 7px; }
  .ch-fields { display: flex; gap: 20px; flex-wrap: wrap; font-size: 10px; letter-spacing: 0.08em; }
  .ch-fields .k { color: #555; margin-right: 5px; }
  .ch-fields .v { color: #d4d4d4; }
  .ch-arrow { color: #555; font-size: 16px; }

  /* Personal debt panel — same visual rhythm as ch-row + ch-fields
     but with an amber accent strip and a payment form when active. */
  .pd-card { background: #121212; border: 0.5px solid rgba(255,255,255,0.08);
    border-left: 2px solid #c8a64e; border-radius: 4px; padding: 16px 18px; }
  .pd-head { font-size: 11px; letter-spacing: 0.12em; color: #c8a64e;
    text-transform: uppercase; margin-bottom: 10px; }
  .pd-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
    margin-bottom: 14px; }
  .pd-cell .k { font-size: 9px; letter-spacing: 0.13em; color: #555;
    text-transform: uppercase; margin-bottom: 5px; }
  .pd-cell .v { font-size: 18px; color: #fff; font-variant-numeric: tabular-nums; }
  .pd-cell .sub { font-size: 10px; color: #666; margin-top: 2px; }
  .pd-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    border-top: 0.5px solid rgba(255,255,255,0.06); padding-top: 12px; }
  .pd-form input { background: #0d0d0d; border: 0.5px solid rgba(255,255,255,0.15);
    color: #cfcabf; padding: 8px 10px; font-size: 12px; border-radius: 3px;
    width: 140px; font-family: inherit; font-variant-numeric: tabular-nums; }
  .pd-form button { font-family: monospace; font-size: 9px; letter-spacing: 0.13em;
    background: transparent; border: 0.5px solid rgba(200,166,78,0.5); color: #c8a64e;
    padding: 8px 14px; border-radius: 3px; cursor: pointer; text-transform: uppercase; }
  .pd-form button:hover:not(:disabled) { background: rgba(200,166,78,0.12); }
  .pd-form button:disabled { opacity: 0.4; cursor: default; }
  .pd-form .hint { font-size: 10px; color: #666; }
  .pd-hint { font-size: 11px; color: #666; line-height: 1.55; margin-top: 10px; }
  /* Pending request — per-offer rows + accept buttons (20270448). */
  .pd-offers { display: flex; flex-direction: column; gap: 6px; }
  .pd-offer { display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px; background: #0d0d0d; border: 0.5px solid rgba(255,255,255,0.08);
    border-radius: 4px; }
  .pd-offer-bank { font-size: 12px; color: #cfcabf; font-weight: 600; }
  .pd-offer-apr  { font-size: 10px; color: #888; letter-spacing: 0.04em; margin-top: 2px; }
  .pd-offer-accept { font-family: monospace; font-size: 9px; letter-spacing: 0.13em;
    padding: 6px 14px; background: transparent; color: #8aaa6a;
    border: 0.5px solid #6a8a4a; border-radius: 3px; cursor: pointer; text-transform: uppercase; }
  .pd-offer-accept:hover:not(:disabled) { background: rgba(138,170,106,0.12); }
  .pd-offer-accept:disabled { opacity: 0.4; cursor: default; }
  .pd-empty { font-size: 11px; color: #666; font-style: italic; padding: 8px 0; }
  @media (max-width: 700px) {
    .pd-grid { grid-template-columns: 1fr; }
  }
  .footer-note {
    margin-top: 28px; padding-top: 14px;
    border-top: 0.5px solid rgba(255,255,255,0.05);
    text-align: center; color: #444; font-size: 10px; letter-spacing: 0.1em;
  }
  .loading { text-align:center; color:#666; font-size:12px; padding:60px 0; letter-spacing:0.1em; }

  /* ── Mobile (≤700px): hero / stats / main-grid all stack vertically */
  @media (max-width:700px) {
    .ent-content { padding-left:12px; padding-right:12px; }
    .hero { grid-template-columns:1fr; gap:18px; margin-bottom:20px; }
    .stats-row { grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:20px; }
    .main-grid { grid-template-columns:1fr; gap:18px; }
    .ch-row { grid-template-columns:1fr; gap:8px; padding:12px 14px; }
  }

  /* Mobile refresh — phone-class viewport. Shrinks hero type so the name
     fits at 375px, unbinds the anchor block's min-width so it can't push
     past 360px, brings tabs/rows up to 44px touch targets, and tightens
     container padding. The 700px rule above handles the column stack. */
  @media (max-width:640px) {
    .content { padding:20px 14px 18px; }
    .identity { gap:14px; }
    .identity-portrait { width:64px; height:64px; font-size:22px; }
    .identity-body .name { flex-wrap:wrap; gap:8px; }
    .identity-body .first, .identity-body .last { font-size:30px; }
    .identity-body .meta-row { gap:16px; }
    .anchor { padding-left:0; border-left:none; min-width:0; text-align:left; }
    .anchor-value { font-size:36px; }
    .stat-card { padding:12px 14px; }
    .stat-card .stat-value { font-size:20px; }
    .ev-tab { min-height:44px; padding:12px 4px; font-size:11px; }
    .ev-item { padding:14px 0; }
    .ch-row { padding:14px 14px; min-height:44px; }
    .section-heading .sans, .section-heading .serif { font-size:18px; }
  }
  @media (max-width:360px) {
    .content { padding:16px 10px 14px; }
    .stats-row { grid-template-columns:1fr; }
    .identity-body .first, .identity-body .last { font-size:26px; }
    .anchor-value { font-size:30px; }
  }
</style>
</head>
<body>
<div class="container">
  <div id="ent-topbar"></div>
  <div class="content">
    <div class="loading" id="loading">LOADING…</div>
    <div id="app" style="display:none;">

      <div class="hero">
        <div class="identity">
          <div class="identity-portrait" id="portrait">—</div>
          <div class="identity-body">
            <div class="eyebrow">— ENTREPRENEUR —</div>
            <div class="name">
              <span class="first" id="first-name">—</span>
              <span class="last" id="last-name"></span>
            </div>
            <div class="meta-row">
              <div><span class="label">AGE</span><span class="val" id="age">—</span></div>
              <div><span class="label">ORIGIN</span><span class="val" id="origin">—</span></div>
              <div><span class="label">ARCHETYPE</span><span class="val" id="archetype">—</span></div>
            </div>
            <div class="bio" id="bio"></div>
          </div>
        </div>

        <div class="anchor">
          <div class="anchor-label">NET WORTH</div>
          <div class="anchor-value" id="net-worth">—</div>
          <div class="anchor-sub" id="net-worth-sub">cash + share holdings</div>
        </div>
      </div>

      <div class="stats-row" id="stats-row"></div>

      <div class="main-grid">

        <div class="events">
          <div class="events-header">
            <div class="title"><span class="dot"></span>DISPATCHES</div>
            <div class="count" id="ent-event-count">—</div>
          </div>
          <div class="ev-tabs" id="ent-event-tabs">
            <div class="ev-tab active" data-category="politics">POLITICS</div>
            <div class="ev-tab" data-category="corporate">CORPORATE</div>
            <div class="ev-tab" data-category="military">MILITARY</div>
          </div>
          <ul class="ev-list" id="ent-event-list"><li class="ev-empty">Loading…</li></ul>
        </div>

        <div class="right-col">
          <div>
            <div class="section-heading">
              <span class="roman">I.</span>
              <span class="sans">Pressing</span>
              <span class="serif">Issues</span>
            </div>
            <div id="ent-pi-host">
              <div id="ent-pi-acq"></div>
              <div id="ent-pi-invest"></div>
              <div id="ent-pi-board"></div>
              <div id="ent-pi-counsel"></div>
              <div id="ent-pi-negotiations"></div>
              <div id="ent-pi-consultancy"></div>
              <div id="ent-pi-bonusvotes"></div>
              <div id="ent-pi-empty"><div class="empty">No pressing issues.</div></div>
            </div>
          </div>

          <div>
            <div class="section-heading">
              <span class="roman">II.</span>
              <span class="sans">Corporate</span>
              <span class="serif">Holdings</span>
              <span class="meta" id="ch-count">—</span>
            </div>
            <div id="ch-list"><div class="empty">Loading…</div></div>
          </div>

          <div>
            <div class="section-heading">
              <span class="roman">III.</span>
              <span class="sans">Personal</span>
              <span class="serif">Debt</span>
            </div>
            <div id="pd-host"><div class="empty">Loading…</div></div>
          </div>
        </div>
      </div>

      <div class="footer-note" id="footer-note">ENTREPRENEUR · NATIONHOOD ALPHA</div>

    </div>
  </div>
</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { hfFmtBig, escapeHtml, escapeAttr, titleCase, fmtValuation, pctOwned, industryTitleLabel } from './js/utils.js';
import { computeEntrepreneurValuation } from './js/game/corp-valuation.js';
import { fetchCorpBookAggregates } from './js/corp-book-value.js';
import { ENTREPRENEUR_ARCHETYPES, ENT_STAT_DISPLAY } from './js/game/factions.js';
import { bootstrapEntrepreneur } from './js/entrepreneur-topbar.js';
import { mountBoardPressingIssues } from './js/corp-board-pressing-issues.js';
import { mountAcquisitionPressingIssues } from './js/acquisition-pressing-issues.js';
import { mountInvestmentPressingIssues } from './js/corp-investment-pressing-issues.js';
import { mountTrialCounselPressingIssues } from './js/trial-counsel-pressing-issues.js';
import { mountContractNegotiationPressingIssues } from './js/contract-negotiation-pressing-issues.js';
import { mountConsultancyPressingIssues } from './js/consultancy-pressing-issues.js';
import { mountBonusVotePressingIssues } from './js/bonus-vote-pressing-issues.js';

function setText(id, v) { const el = document.getElementById(id); if (el) el.textContent = v; }

// ── Dispatches feed (World-only; entrepreneur is nation-agnostic so no
// Nation tab). Logic mirrors corp-dashboard's dispatches — a deliberate
// per-page copy (the cross-page extraction is tracked separately).
function formatEventName(raw) {
  if (!raw) return '';
  return String(raw).replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}
const POLITICS_CATEGORIES = ['politics','political','government','crisis','diplomatic','diplomacy','international','economy','executive_order','protest','bill','new_party'];
const CORPORATE_CATEGORIES = ['corporate','business','trade'];
function dispatchBucketForRow(row) {
  if ((row?.trigger_key || '').toLowerCase().startsWith('military_')) return 'military';
  const c = (row?.category || '').toLowerCase();
  if (CORPORATE_CATEGORIES.includes(c)) return 'corporate';
  if (POLITICS_CATEGORIES.includes(c)) return 'politics';
  return null;
}
const _evState = { category: 'politics', cache: {}, inflight: null };
let _evTick = 0;

function bindDispatchTabs() {
  const bar = document.getElementById('ent-event-tabs');
  if (!bar) return;
  bar.addEventListener('click', (e) => {
    const btn = e.target.closest('.ev-tab');
    if (!btn || btn.classList.contains('active')) return;
    bar.querySelectorAll('.ev-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    _evState.category = btn.getAttribute('data-category');
    loadDispatches();
  });
}

async function loadDispatches() {
  const listEl = document.getElementById('ent-event-list');
  const countEl = document.getElementById('ent-event-count');
  if (!listEl) return;
  const key = _evState.category;
  if (_evState.cache[key]) { renderDispatchList(_evState.cache[key]); return; }
  listEl.innerHTML = '<li class="ev-empty">Loading…</li>';
  if (countEl) countEl.textContent = '—';
  _evState.inflight = key;
  // World scope: entrepreneur has no nation, so no nation filter.
  const { data, error } = await _supabase.from('event_log')
    .select('id, event_name, description_used, description_chosen, category, trigger_key, fired_at_tick, nation_id, nations(name, nation_profiles(flag_url))')
    .not('category', 'is', null)
    .order('fired_at_tick', { ascending: false })
    .limit(120);
  if (_evState.inflight !== key) return;
  if (error) {
    console.warn('[entrepreneur-dashboard] event_log fetch error:', error.message);
    listEl.innerHTML = '<li class="ev-empty">Failed to load dispatches.</li>';
    return;
  }
  const rows = (data || []).filter(r => dispatchBucketForRow(r) === key).slice(0, 30);
  _evState.cache[key] = rows;
  renderDispatchList(rows);
}

function renderDispatchList(rows) {
  const listEl = document.getElementById('ent-event-list');
  const countEl = document.getElementById('ent-event-count');
  if (!listEl) return;
  if (countEl) countEl.textContent = rows.length === 0 ? 'NONE' : `${rows.length} ITEM${rows.length === 1 ? '' : 'S'}`;
  if (rows.length === 0) {
    listEl.innerHTML = `<li class="ev-empty">No ${escapeHtml(_evState.category)} dispatches in the world yet.</li>`;
    return;
  }
  listEl.innerHTML = rows.map(row => {
    const cat = row.category || _evState.category;
    const ago = Math.max(0, _evTick - (Number(row.fired_at_tick) || 0));
    const timeStr = ago === 0 ? 'JUST NOW' : ago === 1 ? '1 TICK AGO' : `${ago} TICKS AGO`;
    const nationName = row.nations?.name || null;
    const np = row.nations?.nation_profiles;
    const flagUrl = (Array.isArray(np) ? np[0]?.flag_url : np?.flag_url) || null;
    const nationBadge = nationName
      ? `<span class="ev-nation">${flagUrl ? `<img src="${escapeAttr(flagUrl)}" alt="" />` : ''}${escapeHtml(nationName)}</span>`
      : '';
    const head = formatEventName(row.event_name) || 'Untitled dispatch';
    const body = (row.description_chosen || row.description_used || '').trim();
    return `<li class="ev-item">
      <div class="ev-meta"><span class="ev-tag">${escapeHtml(cat)}</span>${nationBadge}<span class="ev-time">${timeStr}</span></div>
      <div class="ev-head">${escapeHtml(head)}</div>
      ${body ? `<div class="ev-body">${escapeHtml(body)}</div>` : ''}
    </li>`;
  }).join('');
}
function initials(first, last, fallbackName) {
  const a = (first || '').trim(), b = (last || '').trim();
  if (a || b) return ((a[0] || '') + (b[0] || '')).toUpperCase() || '—';
  const w = String(fallbackName || '').trim().split(/\s+/).filter(Boolean);
  return ((w[0]?.[0] || '') + (w[1]?.[0] || '')).toUpperCase() || '—';
}

// ── Corporate Holdings: one row per corp the entrepreneur is tied to —
// corps they FOUNDED (entrepreneur_corps.owner_faction_id) and corps
// they hold SHARES in (corp_shareholdings), merged by corp id so a
// founded-then-IPO'd corp shows once. Fields: industry, type
// (private/public), HQ, ownership, status, valuation.
//
// NET WORTH is computed server-side by get_my_net_worth_breakdown()
// (sql/migrations/20270387) — see loadNetWorth below. That RPC and the
// leaderboard's get_entrepreneur_net_worth() both delegate to the same
// SQL helper, so the home-page headline can never drift from the
// leaderboard. This module no longer computes the net-worth total
// client-side.
function renderHoldings(positions) {
  const listEl = document.getElementById('ch-list');
  const countEl = document.getElementById('ch-count');
  if (!listEl) return;
  const n = positions.length;
  if (countEl) countEl.textContent = n === 0 ? '0 ACTIVE POSITIONS' : `${n} ACTIVE POSITION${n === 1 ? '' : 'S'}`;
  if (n === 0) {
    listEl.innerHTML = '<div class="empty">No corporate holdings yet.<br>Found a corporation or buy shares from the Corporations tab. Board seats, mergers &amp; acquisitions are coming soon.</div>';
    return;
  }
  listEl.innerHTML = `<div class="ch-list">${positions.map(pos => {
    const c = pos.corp;
    const isFounder = pos.relationship === 'founder';
    const typeLabel = titleCase(c.listing || 'private');

    let ownership, status;
    if (isFounder && c.listing !== 'public') {
      ownership = '100%';
      status = 'Founder · 100% Owner';
    } else if (isFounder) {
      ownership = pos.shares > 0 ? `${pos.shares} sh${pos.pct == null ? '' : ` · ${pos.pct}%`}` : '—';
      status = 'Founder';
    } else {
      ownership = `${pos.shares} sh${pos.pct == null ? '' : ` · ${pos.pct}%`}`;
      status = 'Shareholder';
    }

    // Valuation figure computed once in loadHoldings (pos.valuation).
    const valKey = pos.valuation.kind === 'book' ? 'BOOK VALUE' : 'VALUATION';
    const valVal = fmtValuation(pos.valuation.amount);

    return `
    <a class="ch-row" href="entrepreneur-corp.html?id=${encodeURIComponent(c.id)}">
      <div>
        <div class="ch-name">${escapeHtml(c.name || 'Corporation')}</div>
        <div class="ch-fields">
          <span><span class="k">INDUSTRY</span><span class="v">${escapeHtml(industryTitleLabel(c.industry))}</span></span>
          <span><span class="k">TYPE</span><span class="v">${escapeHtml(typeLabel)}</span></span>
          <span><span class="k">HQ</span><span class="v">${escapeHtml(c.hq?.name || '—')}</span></span>
          <span><span class="k">OWNERSHIP</span><span class="v">${escapeHtml(ownership)}</span></span>
          <span><span class="k">STATUS</span><span class="v">${escapeHtml(status)}</span></span>
          <span><span class="k">${valKey}</span><span class="v">${valVal}</span></span>
        </div>
      </div>
      <div class="ch-arrow">▸</div>
    </a>`;
  }).join('')}</div>`;
}

// Server-side net worth: cash + held public stock (sell-side liquidation
// value) + held private stakes (book proportion) + private founded corps
// with no share model (full book to owner). All four come back as
// components in one RPC, so the headline and the "cash $X · holdings $Y"
// subline read from the same source as the leaderboard. On failure the
// baseline cash figure init() already wrote stays put.
async function loadNetWorth() {
  const { data, error } = await _supabase.rpc('get_my_net_worth_breakdown');
  if (error || !data || data.success === false) {
    if (error) console.warn('[entrepreneur-dashboard] net-worth RPC failed:', error.message);
    setText('net-worth-sub', 'holdings unavailable — showing cash only');
    return;
  }
  const cash     = Number(data.cash) || 0;
  const holdings = (Number(data.public_holdings)        || 0)
                 + (Number(data.private_holdings_share) || 0)
                 + (Number(data.private_holdings_own)   || 0);
  setText('net-worth', hfFmtBig(Number(data.total) || (cash + holdings)));
  setText('net-worth-sub', `cash ${hfFmtBig(cash)} · holdings ${hfFmtBig(holdings)}`);
}

async function loadHoldings(entId) {
  const listEl = document.getElementById('ch-list');
  if (!listEl) return;
  if (!entId) { renderHoldings([]); return; }

  const CORP_COLS = 'id, name, industry, listing, starting_capital, treasury_cash, share_price, shares_outstanding, hq:nations!hq_nation_id(name)';
  // Two sources, merged by corp id: founded corps + share positions.
  // gt('shares',0) drops fully-sold positions.
  const [foundedRes, sharesRes] = await Promise.all([
    _supabase.from('entrepreneur_corps').select(CORP_COLS).eq('owner_faction_id', entId),
    _supabase.from('corp_shareholdings')
      .select(`shares, corp:entrepreneur_corps!corp_id(${CORP_COLS})`)
      .eq('holder_faction_id', entId)
      .gt('shares', 0),
  ]);
  if (foundedRes.error) console.warn('[entrepreneur-dashboard] founded-corps fetch error:', foundedRes.error.message);
  if (sharesRes.error)  console.warn('[entrepreneur-dashboard] portfolio fetch error:', sharesRes.error.message);

  if (foundedRes.error && sharesRes.error) {
    const countEl = document.getElementById('ch-count');
    if (countEl) countEl.textContent = '—';
    listEl.innerHTML = '<div class="empty">Failed to load holdings.</div>';
    return;   // net-worth is set independently by loadNetWorth
  }

  // One row per corp, keyed by id. Founded first; a matching share
  // position is folded into that row (founded-then-IPO'd corp).
  const byId = new Map();
  for (const c of (foundedRes.data || [])) {
    if (!c) continue;
    byId.set(c.id, { corp: c, relationship: 'founder', shares: 0, pct: null });
  }
  for (const r of (sharesRes.data || [])) {
    if (!r.corp) continue;   // FK guarantees corp resolves; defensive
    const shares = Number(r.shares) || 0;
    const existing = byId.get(r.corp.id);
    if (existing) {
      existing.shares = shares;
      existing.pct = pctOwned(shares, Number(r.corp.shares_outstanding) || 0);
    } else {
      byId.set(r.corp.id, {
        corp: r.corp, relationship: 'shareholder', shares,
        pct: pctOwned(shares, Number(r.corp.shares_outstanding) || 0),
      });
    }
  }

  // Book-value aggregates for every held corp — fetched once via the
  // shared fetchCorpBookAggregates so each corp's headline figure is
  // dynamic book value, not stale seed capital. Public corps were
  // previously skipped (they surfaced as market cap), now included for
  // the same reason as the directory pages: market cap can be self-
  // pumped via the corp_trade flat-fill curve.
  const bookAgg = await fetchCorpBookAggregates(
    [...byId.values()].filter(p => p.corp).map(p => p.corp.id));

  // Per-corp valuation from the shared single source (see
  // js/game/corp-valuation.js §3). Read by render + sort below;
  // display-only, never feeds net worth.
  for (const p of byId.values()) {
    p.valuation = computeEntrepreneurValuation(p.corp, bookAgg.get(p.corp.id));
  }

  // Sort by corp valuation (book value, pump-proof). The headline
  // net worth is set by loadNetWorth from the server RPC and is no
  // longer summed from this list.
  const positions = [...byId.values()].sort(
    (a, b) => (b.valuation.amount || 0) - (a.valuation.amount || 0));
  renderHoldings(positions);
}

// Personal Debt panel — 20270448 multi-bank bidding model. Three states:
//   active loan                → balance card + "Make Debt Payment" form
//   pending request, offers… → request card + per-offer Accept buttons + Cancel
//   no loan and no request    → "Open Loan Request" form (principal + term + bidding window)
// All math (interest accrual / per-tick payment / total owed) is
// server-side via get_my_personal_loan + make_personal_loan_payment +
// accept_personal_loan_offer. The page never re-implements the formula.
async function loadPersonalDebt(borrowerFactionId) {
  const host = document.getElementById('pd-host');
  if (!host) return;

  // Lazy expiry sweep — flips any pending requests past their deadline
  // to 'expired' before we read them. No tick-handler dependency.
  await _supabase.rpc('expire_stale_personal_loan_requests');

  // Active loan takes priority over a pending request (you can't hold both).
  const { data: loan, error: loanErr } = await _supabase.rpc('get_my_personal_loan');
  if (loanErr) {
    console.warn('[entrepreneur-dashboard] get_my_personal_loan failed:', loanErr.message);
    host.innerHTML = '<div class="empty">Could not load personal debt.</div>';
    return;
  }
  if (loan?.has_loan) { renderActiveLoan(host, loan); return; }

  // No active loan — check for a pending open request.
  if (borrowerFactionId) {
    const { data: req, error: reqErr } = await _supabase.from('personal_loan_requests')
      .select('id, principal, term_ticks, placed_at_tick, expires_at_tick')
      .eq('borrower_faction_id', borrowerFactionId)
      .eq('status', 'pending')
      .maybeSingle();
    if (reqErr) console.warn('[entrepreneur-dashboard] pending request fetch:', reqErr.message);
    if (req) {
      const { data: offers, error: offersErr } = await _supabase.from('personal_loan_offers')
        .select('id, apr, placed_at_tick, '
              + 'bank:entrepreneur_corps!bank_corp_id(id, name)')
        .eq('request_id', req.id)
        .eq('status', 'pending')
        .order('apr', { ascending: true });
      if (offersErr) console.warn('[entrepreneur-dashboard] offers fetch:', offersErr.message);
      renderPendingRequest(host, req, offers || []);
      return;
    }
  }

  renderLoanRequestForm(host);
}

function renderLoanRequestForm(host) {
  host.innerHTML = `
    <div class="pd-card">
      <div class="pd-head">No Active Loan</div>
      <div class="pd-hint">Open a personal loan RFP — banking corps in your home nation that hold a completed Banking Office can compete for the rate. Principal <b>$100K&ndash;$25M</b>; term <b>12&ndash;240 ticks</b>; bidding window <b>1&ndash;48 ticks</b>. Pick the lowest offer you like, or cancel before any are placed.</div>
      <div class="pd-form" style="margin-top:14px; gap:10px; flex-wrap:wrap;">
        <span class="hint">Principal (USD)</span>
        <input type="number" id="pd-req-amt"  min="100000" max="25000000" step="100000" value="1000000" />
        <span class="hint">Term (ticks)</span>
        <input type="number" id="pd-req-term" min="12" max="240" step="1" value="48" />
        <span class="hint">Bidding window (ticks)</span>
        <input type="number" id="pd-req-bid"  min="1" max="48" step="1" value="6" />
        <button id="pd-req-btn" type="button">Open Loan Request</button>
      </div>
    </div>`;
  document.getElementById('pd-req-btn').onclick = handleOpenRequest;
}

function renderPendingRequest(host, req, offers) {
  const fmt = (n) => '$' + hfFmtBig(Number(n) || 0);
  const offersHtml = offers.length
    ? offers.map(o => {
        const bankName = o.bank?.name || 'Unknown bank';
        const aprPct  = (Number(o.apr) * 100).toFixed(2);
        return `
          <div class="pd-offer">
            <div class="pd-offer-info">
              <div class="pd-offer-bank">${escapeHtml(bankName)}</div>
              <div class="pd-offer-apr">${aprPct}% APR · placed T${o.placed_at_tick}</div>
            </div>
            <button class="pd-offer-accept" type="button" data-oid="${escapeAttr(o.id)}">Accept</button>
          </div>`;
      }).join('')
    : '<div class="pd-empty">No offers yet — banks have until expiry to post.</div>';
  host.innerHTML = `
    <div class="pd-card">
      <div class="pd-head">Open Request &middot; ${fmt(req.principal)} over ${req.term_ticks} ticks</div>
      <div class="pd-hint">Bidding closes at T${req.expires_at_tick}. Lowest APR offer is at the top.</div>
      <div class="pd-offers" style="margin-top:12px;">
        ${offersHtml}
      </div>
      <div class="pd-form" style="margin-top:14px;">
        <button id="pd-req-cancel" type="button" data-rid="${escapeAttr(req.id)}">Cancel Request</button>
      </div>
    </div>`;
  document.querySelectorAll('.pd-offer-accept').forEach(btn => {
    btn.addEventListener('click', handleAcceptOffer);
  });
  document.getElementById('pd-req-cancel').onclick = handleCancelRequest;
}

function renderActiveLoan(host, loan) {
  // Server-supplied amounts. fmtBigUsd would be cleaner; the existing
  // hfFmtBig produces "$1.20M" formatting which matches the rest of
  // the page's money formatting.
  const fmt = (n) => '$' + hfFmtBig(Number(n) || 0);
  host.innerHTML = `
    <div class="pd-card">
      <div class="pd-head">Active Loan${loan.lender_corp_name ? ' &middot; from ' + escapeHtml(loan.lender_corp_name) : ''}</div>
      <div class="pd-grid">
        <div class="pd-cell"><div class="k">Principal Remaining</div><div class="v">${fmt(loan.principal_remaining)}</div><div class="sub">of ${fmt(loan.principal)} borrowed</div></div>
        <div class="pd-cell"><div class="k">Accrued Interest</div><div class="v">${fmt(loan.accrued_interest)}</div><div class="sub">${Number(loan.apr_pct).toFixed(1)}% APR</div></div>
        <div class="pd-cell"><div class="k">Total Owed</div><div class="v">${fmt(loan.total_owed)}</div><div class="sub">payments go to interest first</div></div>
      </div>
      <div class="pd-form">
        <span class="hint">Payment (USD)</span>
        <input type="number" id="pd-pay-amt" min="1" step="10000" value="${Math.max(1, Number(loan.total_owed) || 0)}" />
        <button id="pd-pay-btn" type="button" data-loan-id="${escapeAttr(loan.loan_id)}">Make Debt Payment</button>
      </div>
    </div>`;
  document.getElementById('pd-pay-btn').onclick = handleMakePayment;
}

async function handleOpenRequest() {
  const btn  = document.getElementById('pd-req-btn');
  const amt  = parseInt(document.getElementById('pd-req-amt').value,  10);
  const term = parseInt(document.getElementById('pd-req-term').value, 10);
  const bid  = parseInt(document.getElementById('pd-req-bid').value,  10);
  if (!Number.isFinite(amt)  || amt  < 100000 || amt  > 25000000) { alert('Principal must be $100K–$25M.'); return; }
  if (!Number.isFinite(term) || term < 12     || term > 240)      { alert('Term must be 12–240 ticks.'); return; }
  if (!Number.isFinite(bid)  || bid  < 1      || bid  > 48)       { alert('Bidding window must be 1–48 ticks.'); return; }
  const prev = btn.textContent; btn.disabled = true; btn.textContent = 'OPENING…';
  try {
    const { data, error } = await _supabase.rpc('open_personal_loan_request', {
      p_principal: amt, p_term_ticks: term, p_bidding_ticks: bid,
    });
    if (error) throw error;
    if (!data?.success) {
      const R = {
        not_authenticated:       'Sign in to open a request.',
        no_entrepreneur:         'No entrepreneur faction on this account.',
        no_nation:               'Your entrepreneur has no home nation.',
        invalid_principal:       'Principal must be $100K–$25M.',
        invalid_term:            'Term must be 12–240 ticks.',
        invalid_bidding_window:  'Bidding window must be 1–48 ticks.',
        loan_already_active:     'You already have an active personal loan.',
        request_already_pending: 'You already have a pending request — cancel it before opening a new one.',
      };
      alert(R[data?.reason] || ('Could not open: ' + (data?.reason || 'unknown')));
      btn.disabled = false; btn.textContent = prev;
      return;
    }
    location.reload();
  } catch (e) {
    alert('Failed: ' + (e?.message || e));
    btn.disabled = false; btn.textContent = prev;
  }
}

async function handleAcceptOffer(e) {
  const btn  = e.currentTarget;
  const oid  = btn.dataset.oid;
  if (!oid) { alert('Offer id missing — reload the page.'); return; }
  if (!confirm('Accept this loan offer? Cash transfers immediately and other offers auto-decline.')) return;
  const prev = btn.textContent; btn.disabled = true; btn.textContent = 'ACCEPTING…';
  try {
    const { data, error } = await _supabase.rpc('accept_personal_loan_offer', { p_offer_id: oid });
    if (error) throw error;
    if (!data?.success) {
      const R = {
        not_authenticated:       'Sign in to accept.',
        offer_not_found:         'Offer no longer exists — reload.',
        offer_not_pending:       'Offer is no longer pending.',
        request_not_pending:     'Request is no longer pending.',
        not_borrower:            'You are not the borrower on this request.',
        bank_insufficient_funds: "The bank's owner no longer has the cash to fund this loan. Wait for another offer or cancel.",
        bank_corp_not_found:     'Bank corp no longer exists — reload.',
        bank_owner_not_found:    'Bank owner no longer exists — reload.',
      };
      alert(R[data?.reason] || ('Accept failed: ' + (data?.reason || 'unknown')));
      btn.disabled = false; btn.textContent = prev;
      return;
    }
    location.reload();
  } catch (e2) {
    alert('Failed: ' + (e2?.message || e2));
    btn.disabled = false; btn.textContent = prev;
  }
}

async function handleCancelRequest(e) {
  const btn = e.currentTarget;
  const rid = btn.dataset.rid;
  if (!rid) { alert('Request id missing — reload the page.'); return; }
  if (!confirm('Cancel this request? All pending offers will be auto-declined.')) return;
  const prev = btn.textContent; btn.disabled = true; btn.textContent = 'CANCELLING…';
  try {
    const { data, error } = await _supabase.rpc('cancel_personal_loan_request', { p_request_id: rid });
    if (error) throw error;
    if (!data?.success) {
      alert('Cancel failed: ' + (data?.reason || 'unknown'));
      btn.disabled = false; btn.textContent = prev;
      return;
    }
    location.reload();
  } catch (e2) {
    alert('Failed: ' + (e2?.message || e2));
    btn.disabled = false; btn.textContent = prev;
  }
}

async function handleMakePayment(e) {
  const btn = e.currentTarget;
  const amt = parseInt(document.getElementById('pd-pay-amt').value, 10);
  const loanId = btn.dataset.loanId;
  if (!Number.isFinite(amt) || amt < 1) { alert('Payment amount must be at least $1.'); return; }
  if (!loanId)                          { alert('Loan id missing — reload the page.'); return; }
  const prev = btn.textContent; btn.disabled = true; btn.textContent = 'PAYING…';
  try {
    const { data, error } = await _supabase.rpc('make_personal_loan_payment',
      { p_loan_id: loanId, p_amount: amt });
    if (error) throw error;
    if (!data?.success) {
      const R = {
        not_authenticated:  'Sign in to make a payment.',
        no_entrepreneur:    'No entrepreneur faction on this account.',
        not_borrower:       'You are not the borrower on this loan.',
        invalid_amount:     'Payment must be at least $1.',
        loan_not_found:     'Loan not found — reload the page.',
        loan_not_active:    'Loan is no longer active.',
        insufficient_funds: data?.have != null && data?.need != null
          ? `Insufficient cash — need $${hfFmtBig(data.need)}, have $${hfFmtBig(data.have)}.`
          : 'Insufficient cash for that payment.',
      };
      alert(R[data?.reason] || ('Payment failed: ' + (data?.reason || 'unknown')));
      btn.disabled = false; btn.textContent = prev;
      return;
    }
    location.reload();
  } catch (e2) {
    alert('Failed: ' + (e2?.message || e2));
    btn.disabled = false; btn.textContent = prev;
  }
}

(async () => {
  try {
    // Shared topbar (auth + fetch + render) — one source for every
    // entrepreneur page. Returns null if it redirected (no auth / no
    // entrepreneur faction).
    const ctx = await bootstrapEntrepreneur('home');
    if (!ctx) return;
    const f = ctx.faction;

    const first = f.leader_first_name || (f.faction_name || '').split(/\s+/)[0] || '';
    const last  = f.leader_last_name  || (f.faction_name || '').split(/\s+/).slice(1).join(' ') || '';
    const arch  = ENTREPRENEUR_ARCHETYPES[f.entrepreneur_archetype] || null;

    setText('portrait', initials(first, last, f.faction_name));
    setText('first-name', first || (f.faction_name || 'Entrepreneur'));
    setText('last-name', last);
    setText('age', f.leader_age != null ? String(f.leader_age) : '—');
    setText('origin', f.nation ? String(f.nation).toUpperCase() : '—');
    setText('archetype', arch ? arch.name : '—');
    document.getElementById('bio').textContent = arch ? `"${arch.description}"` : '';

    // Baseline so the headline isn't blank while loadNetWorth's RPC is
    // in flight. loadNetWorth replaces both lines once the server answers.
    setText('net-worth', hfFmtBig(Number(f.party_funds) || 0));

    // Real stats — the three set at archetype selection (Reputation,
    // Influence, Skill). Capital is shown via net-worth above. Total
    // is derived. ENT_STAT_DISPLAY is the single source of truth for
    // label + column mapping; see js/game/factions.js.
    const stats = ENT_STAT_DISPLAY.map(s => [s.long, f[s.key]]);
    const total = stats.reduce((s, [, v]) => s + (Number(v) || 0), 0);
    document.getElementById('stats-row').innerHTML = stats.map(([label, v], i) => `
      <div class="stat-card${i === 0 ? ' accent' : ''}">
        <div class="stat-label">${label}</div>
        <div class="stat-value${i === 0 ? ' gold' : ''}">${v != null ? Number(v) : '—'}</div>
        <div class="stat-sub">${i === 0 ? `total ${total}` : '&nbsp;'}</div>
      </div>`).join('');

    setText('footer-note', `${(f.faction_name || 'ENTREPRENEUR').toUpperCase()} · ENTREPRENEUR · NATIONHOOD ALPHA`);

    _evTick = Number(ctx.shard?.current_tick) || 0;
    bindDispatchTabs();
    loadDispatches();

    const entId = ctx.faction?.id;
    loadHoldings(entId);
    loadNetWorth();
    loadPersonalDebt(entId);

    // Pressing Issues: two sources share this column — open acquisition
    // negotiations (2.6.8.3) and pending Board-Join votes (20270160).
    // Each renders into its own host; the shared empty line shows only
    // when both are empty, so a single source still suppresses it.
    const tickFn = () => Number(ctx.shard?.current_tick) || 0;
    let _acqCtl = null, _boardCtl = null, _investCtl = null, _counselCtl = null, _negCtl = null, _consultCtl = null, _bonusCtl = null;
    const syncPiEmpty = () => {
      const total = (_acqCtl?.getCount() || 0) + (_boardCtl?.getCount() || 0)
                  + (_investCtl?.getCount() || 0) + (_counselCtl?.getCount() || 0)
                  + (_negCtl?.getCount() || 0)
                  + (_consultCtl?.getCount() || 0) + (_bonusCtl?.getCount() || 0);
      const el = document.getElementById('ent-pi-empty');
      if (el) el.style.display = total === 0 ? '' : 'none';
    };
    _acqCtl = mountAcquisitionPressingIssues({
      supabase: _supabase, faction: f,
      host: document.getElementById('ent-pi-acq'),
      showEmpty: false, onChange: syncPiEmpty,
    });
    _investCtl = mountInvestmentPressingIssues({
      supabase: _supabase, faction: f,
      host: document.getElementById('ent-pi-invest'),
      showEmpty: false, onChange: syncPiEmpty,
    });
    _boardCtl = mountBoardPressingIssues({
      supabase: _supabase, faction: f,
      host: document.getElementById('ent-pi-board'),
      currentTick: tickFn, showEmpty: false, onChange: syncPiEmpty,
    });
    _counselCtl = mountTrialCounselPressingIssues({
      supabase: _supabase, faction: f,
      host: document.getElementById('ent-pi-counsel'),
      showEmpty: false, onChange: syncPiEmpty,
    });
    _negCtl = mountContractNegotiationPressingIssues({
      supabase: _supabase, faction: f,
      host: document.getElementById('ent-pi-negotiations'),
      showEmpty: false, onChange: syncPiEmpty,
    });
    _consultCtl = mountConsultancyPressingIssues({
      supabase: _supabase, faction: f,
      host: document.getElementById('ent-pi-consultancy'),
      showEmpty: false, onChange: syncPiEmpty,
    });
    _bonusCtl = mountBonusVotePressingIssues({
      supabase: _supabase, faction: f,
      host: document.getElementById('ent-pi-bonusvotes'),
      showEmpty: false, onChange: syncPiEmpty,
    });

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  } catch (e) {
    const l = document.getElementById('loading');
    if (l) l.textContent = 'FAILED TO LOAD — PLEASE REFRESH';
    console.warn('[entrepreneur-dashboard] init failed:', e?.message || e);
  }
})();
