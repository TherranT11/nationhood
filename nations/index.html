<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose your nation · Nationhood Game</title>
<link rel="stylesheet" href="/site.css">
<script src="/theme.js"></script>
<style>
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .pick { max-width: 1180px; margin: 0 auto; padding: 44px 24px 80px; }
  .pick h1 { font-size: clamp(28px, 5vw, 38px); letter-spacing: -0.03em; font-weight: 800; margin: 0 0 10px; }
  .date { color: var(--muted); font-size: 15px; font-weight: 600; margin: 0 0 30px; }
  .date b { color: var(--ink); font-weight: 700; }
  .empty { padding: 48px 24px; border: 1px dashed var(--line); border-radius: 14px; text-align: center; color: var(--muted); font-size: 14.5px; }

  /* Nation cards — a responsive grid; each shows the 13 stats + its authored parties. */
  .nvgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 22px; }
  @media (max-width: 560px) { .nvgrid { grid-template-columns: 1fr; } }
  .nvcard { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--surface); }
  .nvbanner { height: 150px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--bg); border-bottom: 1px solid var(--line); }
  .nvbanner img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
  .nvbanner .ph { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .nvbody { padding: 20px 22px 22px; }
  .nvname { font-size: 23px; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
  .nvsub { color: var(--muted); font-size: 13px; font-style: italic; margin: 4px 0 0; }
  .nvdesc { color: var(--muted); font-size: 14px; line-height: 1.55; margin: 12px 0 0; }
  .nvstats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 7px; margin-top: 16px; }
  .nvstat { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 1px solid var(--line); border-radius: 9px; padding: 7px 11px; font-size: 12.5px; }
  .nvstat .k { color: var(--muted); }
  .nvstat .v { font-weight: 800; }
  .nvpart { margin-top: 16px; }
  .nvpart .hd { font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .prow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .prow .pn { font-weight: 700; }
  .prow .pmeta { color: var(--muted); font-size: 12px; }
  @media (max-width: 560px) { .pick { padding: 32px 16px 64px; } }
</style>
</head>
<body>
  <header>
    <div class="wrap nav">
      <div class="brand">Nationhood</div>
      <nav class="nav-actions">
        <a class="btn btn-discord" href="https://discord.gg/HBvWxJUm8" target="_blank" rel="noopener" aria-label="Join the Discord">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.369A19.79 19.79 0 0 0 16.558 3a13.6 13.6 0 0 0-.6 1.23 18.27 18.27 0 0 0-5.487 0A13.6 13.6 0 0 0 9.87 3a19.79 19.79 0 0 0-3.76 1.369C2.72 9.046 1.79 13.605 2.255 18.1a19.9 19.9 0 0 0 6.073 3.058c.49-.668.926-1.377 1.302-2.122a12.93 12.93 0 0 1-2.05-.978c.172-.126.34-.257.502-.392a14.2 14.2 0 0 0 12.036 0c.164.135.332.266.502.392-.654.386-1.343.714-2.052.98.376.743.812 1.452 1.302 2.12a19.86 19.86 0 0 0 6.075-3.058c.546-5.21-.93-9.728-3.93-13.73ZM9.682 15.33c-1.182 0-2.157-1.086-2.157-2.42 0-1.333.955-2.42 2.157-2.42 1.21 0 2.176 1.097 2.157 2.42 0 1.334-.955 2.42-2.157 2.42Zm4.636 0c-1.182 0-2.157-1.086-2.157-2.42 0-1.333.955-2.42 2.157-2.42 1.21 0 2.176 1.097 2.157 2.42 0 1.334-.946 2.42-2.157 2.42Z"/></svg>
          <span class="btn-label">Discord</span>
        </a>
        <button class="btn btn-ghost" id="logout" type="button">Log out</button>
      </nav>
    </div>
  </header>

  <main class="pick">
    <h1>Choose the nation you will call home.</h1>
    <p class="date">Current Date: <b id="gamedate">…</b></p>
    <div id="nations"><div class="empty">Loading…</div></div>
  </main>

  <script type="module">
    import { supabase, isConfigured, logout } from '/supabase.js';
    import { mountGameDate } from '/gamedate.js';   // live game date (one source)
    import { esc } from '/util.js';
    import { NV_STATS } from '/nationverse.js';      // the 13 stats (one source)

    mountGameDate(document.getElementById('gamedate'));
    document.getElementById('logout').addEventListener('click', logout);

    const box = document.getElementById('nations');

    (async () => {
      if (!isConfigured) { box.innerHTML = '<div class="empty">Nation data isn’t connected yet.</div>'; return; }
      try {
        const { data, error } = await supabase.from('nationverse_nations').select('*').order('name', { ascending: true });
        if (error) throw error;
        const rows = data || [];
        if (!rows.length) { box.innerHTML = '<div class="empty">Nations will appear here soon.</div>'; return; }
        box.className = 'nvgrid';
        box.innerHTML = rows.map(n => {
          const stats = n.stats || {};
          const statHtml = NV_STATS.map(([key, nm]) =>
            '<div class="nvstat"><span class="k">' + esc(nm) + '</span><span class="v">' + (stats[key] != null ? stats[key] : '—') + '</span></div>'
          ).join('');
          const sub = [n.analogous ? 'Analogous: ' + esc(n.analogous) : '', n.capital ? 'Capital: ' + esc(n.capital) : ''].filter(Boolean).join(' · ');
          const flag = n.flag
            ? '<img alt="Flag" src="' + esc(n.flag) + '">'
            : '<span class="ph">' + esc(n.name || '') + '</span>';
          const parties = (n.parties || []).length
            ? '<div class="nvpart"><div class="hd">Parties</div>' + n.parties.map(p =>
                '<div class="prow"><span class="pn">' + esc(p.name || 'Unnamed') + '</span>' +
                '<span class="pmeta">' + [esc(p.ideology || ''), (p.seats != null ? p.seats + ' seats' : '')].filter(Boolean).join(' · ') + '</span></div>'
              ).join('') + '</div>'
            : '';
          return '<article class="nvcard">' +
            '<div class="nvbanner">' + flag + '</div>' +
            '<div class="nvbody">' +
              '<h2 class="nvname">' + esc(n.name || 'Unknown') + '</h2>' +
              (sub ? '<p class="nvsub">' + sub + '</p>' : '') +
              (n.description ? '<p class="nvdesc">' + esc(n.description) + '</p>' : '') +
              '<div class="nvstats">' + statHtml + '</div>' +
              parties +
            '</div></article>';
        }).join('');
        // Flag fallback: if an asset 404s, swap in the name placeholder.
        box.querySelectorAll('.nvbanner img').forEach((img, i) => {
          img.onerror = () => img.replaceWith(Object.assign(document.createElement('span'), { className: 'ph', textContent: rows[i] && rows[i].name || '' }));
        });
      } catch (e) { box.innerHTML = '<div class="empty">Couldn’t load nations. Try again shortly.</div>'; }
    })();
  </script>
</body>
</html>
