<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wiki | Nationhood Alpha</title>
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/wiki.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="top-bar"></div>

<div class="wiki-container" id="wiki-root">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:40vh;">
    <div class="loading-container">
      <div class="loading-spinner"></div>
      <div style="color:var(--text-secondary)">Loading wiki...</div>
    </div>
  </div>
</div>

<script>
// Wiki defaults to light mode — apply immediately to prevent flash
(function() {
    const saved = localStorage.getItem('nationhood_theme');
    if (saved !== 'dark') {
        document.body.classList.add('light-mode');
    }
})();
</script>
<script type="module">
import { _supabase } from './js/supabase-client.js';
import { escapeHtml } from './js/utils.js';
import { initWikiPage, renderWikiSearchBar, fetchPage, fetchPageList, fetchExistingSlugs, renderWikiLinks, renderInfobox, slugify, fetchFactionNames, renderTagDisplay } from './js/wiki.js';

(async () => {
    const state = await initWikiPage();
    if (!state) return;
    const { isLoggedIn, faction } = state;
    const root = document.getElementById('wiki-root');
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug') || 'home';

    // --- HOME PAGE: curated landing ---
    if (slug === 'home') {
        let allPages = [];
        try {
            allPages = await fetchPageList(_supabase);
        } catch (_) {}

        // Random "Explore" page — pick one random page with content
        let exploreHtml = '';
        if (allPages.length > 0) {
            const randPage = allPages[Math.floor(Math.random() * allPages.length)];
            try {
                const { data: full } = await _supabase
                    .from('wiki_pages')
                    .select('id, slug, title, body, template_type, template_data, infobox_image')
                    .eq('id', randPage.id)
                    .single();
                if (full) {
                    const typeLabel = full.template_type ? full.template_type.charAt(0).toUpperCase() + full.template_type.slice(1) : '';
                    const sidebarImg = full.infobox_image
                        ? `<img src="${escapeHtml(full.infobox_image)}" alt="${escapeHtml(full.title)}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;margin-bottom:8px;">`
                        : '';
                    const sidebarHtml = (sidebarImg || typeLabel) ? `
                        <div class="wiki-explore-sidebar" style="flex:0 0 180px;border-right:1px solid var(--border-color);padding:14px;text-align:center;">
                            ${sidebarImg}
                            <div style="font-weight:700;font-size:13px;color:var(--text-primary);">${escapeHtml(full.title)}</div>
                            ${typeLabel ? `<div style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-top:4px;">${escapeHtml(typeLabel)}</div>` : ''}
                        </div>` : '';
                    const rawBody = (full.body || '').replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
                    const previewText = rawBody.length > 600 ? rawBody.slice(0, 600) + '...' : rawBody;
                    exploreHtml = `
                    <div class="wiki-home-section">
                        <div class="wiki-home-card">
                            <div class="wiki-home-card-title" style="display:flex;align-items:center;justify-content:space-between;">
                                <span>Explore Nationhood</span>
                                <a href="wiki.html?slug=${encodeURIComponent(full.slug)}" class="wiki-btn" style="font-size:9px;padding:3px 10px;margin:0;">Read Full Page</a>
                            </div>
                            <div class="wiki-home-card-body" style="padding:0;">
                                <div style="display:flex;gap:0;">
                                    ${sidebarHtml}
                                    <div style="flex:1;padding:16px;overflow:hidden;">
                                        <a href="wiki.html?slug=${encodeURIComponent(full.slug)}" style="color:var(--accent);font-weight:700;font-size:15px;text-decoration:none;">${escapeHtml(full.title)}</a>
                                        <p style="color:var(--text-secondary);font-size:12.5px;line-height:1.6;margin-top:8px;">${escapeHtml(previewText)}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>`;
                }
            } catch (_) {}
        }

        const importantPages = allPages.filter(p => p.template_type).slice(0, 8);
        const recentPages = [...allPages]
            .sort((a, b) => (b.updated_at || '').localeCompare(a.updated_at || ''))
            .slice(0, 8);

        const importantHtml = importantPages.length
            ? importantPages.map(p => {
                const badge = p.template_type
                    ? `<span class="wiki-page-row-type">${escapeHtml(p.template_type)}</span>`
                    : '';
                return `<a href="wiki.html?slug=${encodeURIComponent(p.slug)}" class="wiki-page-row">
                    <span class="wiki-page-row-title">${escapeHtml(p.title)}</span>${badge}
                </a>`;
            }).join('')
            : '<p style="color:var(--text-muted);font-size:13px;padding:10px 0;">No pages with templates yet.</p>';

        const recentHtml = recentPages.length
            ? recentPages.map(p => {
                const updated = p.updated_at ? new Date(p.updated_at).toLocaleDateString() : '';
                return `<a href="wiki.html?slug=${encodeURIComponent(p.slug)}" class="wiki-page-row">
                    <span class="wiki-page-row-title">${escapeHtml(p.title)}</span>
                    <span class="wiki-page-row-meta">${updated}</span>
                </a>`;
            }).join('')
            : '<p style="color:var(--text-muted);font-size:13px;padding:10px 0;">No pages yet.</p>';

        const newPageBtn = isLoggedIn
            ? '<a href="wiki-edit.html?new=1" class="wiki-btn wiki-btn-primary">New Page</a>'
            : '';

        root.innerHTML = `
            <div class="wiki-page-header">
                <h1 class="wiki-page-title">Wiki</h1>
                <div class="wiki-header-actions">
                    ${newPageBtn}
                    <a href="wiki-list.html" class="wiki-btn">All Pages</a>
                </div>
            </div>

            <div class="wiki-home-section" style="margin-top:20px;">
                <div class="wiki-home-card">
                    <div class="wiki-home-card-title">About</div>
                    <div class="wiki-home-card-body">
                        <p>Welcome to the <strong>Nationhood Wiki</strong> — the living encyclopedia of your world.</p>
                        <p>Document nations, history, key figures, corporations, religions, and cultures. Every player can create and edit pages. Use <code>[[Page Name]]</code> in the editor to link between pages.</p>
                        <p><strong>${allPages.length}</strong> page${allPages.length !== 1 ? 's' : ''} and counting.</p>
                    </div>
                </div>
            </div>

            ${exploreHtml}

            <div class="wiki-home-columns">
                <div class="wiki-home-section">
                    <div class="wiki-home-card">
                        <div class="wiki-home-card-title">Important Pages</div>
                        <div class="wiki-page-list">${importantHtml}</div>
                    </div>
                </div>
                <div class="wiki-home-section">
                    <div class="wiki-home-card">
                        <div class="wiki-home-card-title">Recently Updated</div>
                        <div class="wiki-page-list">${recentHtml}</div>
                    </div>
                </div>
            </div>
        `;

        await renderWikiSearchBar(root);
        return;
    }

    // --- REGULAR PAGE VIEW ---
    let page;
    try {
        page = await fetchPage(_supabase, slug);
    } catch (err) {
        root.innerHTML = `<div class="wiki-empty"><h2>Error</h2><p>${escapeHtml(err.message)}</p></div>`;
        return;
    }

    if (!page) {
        const createBtn = isLoggedIn
            ? `<a href="wiki-edit.html?new=1&title=${encodeURIComponent(slug)}" class="wiki-btn wiki-btn-primary">Create This Page</a>`
            : '';
        root.innerHTML = `
            <div class="wiki-empty">
                <h2>Page Not Found</h2>
                <p>The wiki page "<strong>${escapeHtml(slug)}</strong>" doesn't exist yet.</p>
                ${createBtn}
                <div style="margin-top:12px;">
                    <a href="wiki.html" class="wiki-btn">Wiki Home</a>
                    <a href="wiki-list.html" class="wiki-btn">All Pages</a>
                </div>
            </div>
        `;
        return;
    }

    // Fetch existing slugs for link colouring
    let existingSlugs = new Set();
    try {
        existingSlugs = await fetchExistingSlugs(_supabase);
    } catch (_) {}

    const bodyHtml = renderWikiLinks(page.body || '<p><em>This page is empty.</em></p>', existingSlugs);
    const infoboxHtml = renderInfobox(page);
    const tagsHtml = renderTagDisplay(page.tags);

    // Fetch faction names for attribution
    const factionIds = [page.created_by, page.updated_by].filter(Boolean);
    const factionNames = await fetchFactionNames(_supabase, factionIds);
    const createdName = factionNames[page.created_by] || null;
    const updatedName = factionNames[page.updated_by] || null;
    const createdDate = page.created_at ? new Date(page.created_at).toLocaleDateString() : '';
    const updatedDate = page.updated_at ? new Date(page.updated_at).toLocaleDateString() : '';

    let metaHtml = '';
    const metaParts = [];
    if (createdName) metaParts.push(`Created by <strong>${escapeHtml(createdName)}</strong> on ${createdDate}`);
    if (updatedName && page.updated_by !== page.created_by) {
        metaParts.push(`Last edited by <strong>${escapeHtml(updatedName)}</strong> on ${updatedDate}`);
    } else if (updatedDate && updatedDate !== createdDate) {
        metaParts.push(`Last edited on ${updatedDate}`);
    }
    if (metaParts.length) {
        metaHtml = `<div class="wiki-page-meta">${metaParts.join(' · ')}</div>`;
    }

    // Find backlinks
    let backlinks = [];
    try {
        const { data: byTitle } = await _supabase
            .from('wiki_pages')
            .select('slug, title')
            .neq('slug', page.slug)
            .ilike('body', `%[[${page.title}]]%`);
        backlinks = byTitle || [];

        if (page.slug !== slugify(page.title)) {
            const { data: bySlug } = await _supabase
                .from('wiki_pages')
                .select('slug, title')
                .neq('slug', page.slug)
                .ilike('body', `%[[${page.slug}]]%`);
            if (bySlug) {
                const existingSlugs2 = new Set(backlinks.map(b => b.slug));
                bySlug.forEach(b => { if (!existingSlugs2.has(b.slug)) backlinks.push(b); });
            }
        }
    } catch (_) {}

    const backlinksHtml = backlinks.length
        ? `<div class="wiki-backlinks">
            <div class="wiki-backlinks-title">What links here</div>
            <div class="wiki-backlinks-list">${backlinks.map(b =>
                `<a href="wiki.html?slug=${encodeURIComponent(b.slug)}" class="wiki-backlink-item">${escapeHtml(b.title)}</a>`
            ).join('')}</div>
           </div>`
        : '';

    const isLocked = !!page.locked_by;
    const lockHtml = isLocked
        ? `<span class="wiki-lock-badge" title="Locked by creator — only they can edit">Locked</span>`
        : '';

    // Only show edit controls for logged-in users
    let editBtnHtml = '';
    if (isLoggedIn && faction) {
        const isCreator = page.created_by === faction.id;
        const canEdit = !isLocked || isCreator;
        editBtnHtml = canEdit
            ? `<a href="wiki-edit.html?slug=${encodeURIComponent(page.slug)}" class="wiki-btn">Edit</a>`
            : `<span class="wiki-btn wiki-btn-disabled" title="This page is locked by its creator">Locked</span>`;
    }

    root.innerHTML = `
        <div class="wiki-page-header">
            <h1 class="wiki-page-title">${escapeHtml(page.title)} ${lockHtml}</h1>
            <div class="wiki-header-actions">
                ${editBtnHtml}
                <a href="wiki.html" class="wiki-btn">Wiki Home</a>
                <a href="wiki-list.html" class="wiki-btn">All Pages</a>
            </div>
        </div>
        ${metaHtml}
        <div class="wiki-page-layout">
            <div class="wiki-body-col">
                <div class="wiki-body-content">${bodyHtml}</div>
                ${tagsHtml}
                ${backlinksHtml}
            </div>
            ${infoboxHtml}
        </div>
    `;

    await renderWikiSearchBar(root);
})();
</script>
</body>
</html>
