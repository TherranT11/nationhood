<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nationhood | Admin Panel</title>
    
        <link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- Login Section -->
<div id="login-section">
    <div class="login-box">
        <h1>⚠️ Admin Panel ⚠️</h1>
        <div class="warning">
            <strong>⚠️ RESTRICTED ACCESS</strong><br>
            This panel contains dangerous operations. Unauthorized access is prohibited.<br>
            You must be logged in with an admin-role account.
        </div>
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="admin-email" placeholder="Admin email">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="admin-password" placeholder="Enter password">
        </div>
        <button class="btn btn-danger btn-full" id="admin-auth-btn">AUTHENTICATE</button>
        <div id="auth-error" class="status error hidden"></div>
        <div id="auth-checking" class="status" style="display:none;color:#c8a64e;text-align:center;margin-top:10px;">Verifying admin access...</div>
        <div class="back-link"><a href="dashboard.html">← Back to Game</a></div>
    </div>
</div>

<!-- Admin content loaded dynamically from admin-panel.html after server-side auth -->
<div id="admin-section"></div>

<script type="module">
/* OLD TEMPLATE CONTENT REMOVED — now loaded from admin-panel.html */

import { _supabase } from './js/supabase-client.js';
import { fmtBudgetCurrency, escapeHtml, escapeAttr } from './js/utils.js';
import { GAME_CONFIG, initGameConfigForNation, FORMATION_DEADLINE_TICKS } from './js/game/config.js';
import { CANONICAL_GOVERNMENT_TYPES, getCanonicalGovernmentType, isGovernmentPresidential } from './js/game/government-types.js'
import { RAW_SCALING_DIVISORS } from './js/game/diplomacy-constants.js';
import { FISCAL_CATEGORIES, FISCAL_TO_MINISTRY_KEY, computeMinistryPolicyCost, getInflationMultiplier, buildBudgetData, applyTradeTariffOverride, applyGdpGrowth, calculateNationalBudget } from './js/game/budget.js';
import { processElections, processGovernmentVacancy, resolveNoConfidence, runManualElectionByGovernmentType } from './js/game/elections.js';
import { processEvents, processCrises, processStatEffects, processMinistryActions, processOngoingCosts, snapshotNationHistory, processPMTraitEffects, formatStatName, getNationNames } from './js/game/political-actions.js';
import { processPresidentDesk, processPresidentialTermEnd, triggerPresidentialCandidateSelection, autoSelectPresidentialCandidates } from './js/game/presidential.js';
import { recalcDerivedApproval, resolveExpiredVotes } from './js/game/bills.js';
import { targetEquilibrium, convergeStat, isTargetBasedStat } from './js/game/policies.js';
import { NATION_STAT_COLUMNS, STAT_DECAY_CONFIG, normalizeNationStatKey } from './js/game/stats.js';
import { runElectionPreview, runPresidentialElectionPreview } from './js/game/election-simulation.js';
import { SECTIONS, EVENT_TYPES, HEADLINE_TEMPLATES, LEDE_TEMPLATES, BODY_BLOCK_TEMPLATES, QUOTE_TEMPLATES, OPINION_TRIGGERS, REPORTERS } from './js/game/valdorian-templates.js';
import { generateArticle, generateTickArticles } from './js/game/valdorian-generator.js';
import { calculateTotalWeightedPopularity, calculateSectorContributions, parsePopularity } from './js/game/sectors.js';

    let isAuthenticated = false;
    let nations = [];
    let selectedElectionNation = null;
    let currentTickInterval = 1;

    // ==================== SERVER-SIDE AUTH ====================
    function showTab(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelector(`.tab[onclick="showTab('${tabName}')"]`).classList.add('active');
        document.getElementById(`tab-${tabName}`).classList.add('active');
        if (tabName === 'integrity') showIntegrityView('clusters');
    }

    // Check if already logged in with admin role on page load
    (async () => {
        const { data: { user } } = await _supabase.auth.getUser();
        if (user) {
            await verifyAdminRole();
        }
    })();

    async function authenticate() {
        const email = document.getElementById('admin-email').value.trim();
        const password = document.getElementById('admin-password').value;
        const errorDiv = document.getElementById('auth-error');
        const checkingDiv = document.getElementById('auth-checking');
        errorDiv.classList.add('hidden');
        checkingDiv.style.display = 'block';

        try {
            // Step 1: Sign in via Supabase Auth (server-side JWT validation)
            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
            if (error) throw new Error(error.message);

            // Step 2: Verify admin role server-side via RPC
            await verifyAdminRole();
        } catch (err) {
            checkingDiv.style.display = 'none';
            errorDiv.textContent = err.message || 'Authentication failed.';
            errorDiv.classList.remove('hidden');
        }
    }

    async function verifyAdminRole() {
        const errorDiv = document.getElementById('auth-error');
        const checkingDiv = document.getElementById('auth-checking');

        try {
            const { data: result, error } = await _supabase.rpc('verify_admin_access');
            if (error) throw new Error(error.message);

            if (result?.authorized) {
                isAuthenticated = true;
                document.getElementById('login-section').classList.add('hidden');
                // Load admin panel HTML from database via RPC — only admins can access
                const { data: panelHtml, error: panelErr } = await _supabase.rpc('get_admin_panel');
                if (panelErr || !panelHtml) throw new Error('Failed to load admin panel: ' + (panelErr?.message || 'no content'));
                document.getElementById('admin-section').innerHTML = panelHtml;
                document.dispatchEvent(new Event('admin-panel-loaded'));
                loadAllData();
            } else {
                throw new Error(result?.reason || 'Not authorized. Your account does not have admin privileges.');
            }
        } catch (err) {
            if (checkingDiv) checkingDiv.style.display = 'none';
            errorDiv.textContent = err.message || 'Admin verification failed.';
            errorDiv.classList.remove('hidden');
            // Sign out if they authenticated but aren't admin
            await _supabase.auth.signOut();
        }
    }

    async function logout() {
        isAuthenticated = false;
        await _supabase.auth.signOut();
        document.getElementById('admin-section').innerHTML = '';
        window.location.reload();
    }

    document.getElementById('admin-auth-btn').addEventListener('click', authenticate);
    document.getElementById('admin-password').addEventListener('keypress', (e) => { if (e.key === 'Enter') authenticate(); });

    async function loadAllData() {
        if (!isAuthenticated) return;
        await loadShardInfo();
        await loadStats();
        await loadNations();
        await loadElectionNations();
        await updateScheduleTickHint();
        await loadSectorNations();
        await loadProvinceNations();
        await loadInspectorNations();
        await loadMinistryConfig();
        await loadAddNationInit();
        await loadAddPartyInit();
    }

    // ==================== SHARD TAB ====================
    async function loadShardInfo() {
        try {
            const { data: shard } = await _supabase.from('shard').select('*').eq('name', 'Alpha Shard').single();
            document.getElementById('info-name').textContent = shard.name;
            document.getElementById('info-date').textContent = shard.current_date || 'Not Set';
            document.getElementById('info-tick').textContent = shard.current_tick || 0;
            currentTickInterval = shard.tick_interval_hours || 1;
            updateIntervalButtons();
            if (shard.next_tick_at) {
                const nextTickDate = new Date(shard.next_tick_at);
                const timeUntil = nextTickDate - new Date();
                if (timeUntil > 0) {
                    const hours = Math.floor(timeUntil / (1000*60*60));
                    const minutes = Math.floor((timeUntil % (1000*60*60)) / (1000*60));
                    document.getElementById('info-next-tick').textContent = `${nextTickDate.toLocaleString()} (in ${hours}h ${minutes}m)`;
                    document.getElementById('info-next-tick').style.color = '#ffcc00';
                } else {
                    document.getElementById('info-next-tick').textContent = `${nextTickDate.toLocaleString()} (OVERDUE)`;
                    document.getElementById('info-next-tick').style.color = '#d9534f';
                }
            } else { document.getElementById('info-next-tick').textContent = 'Not Scheduled'; }
        } catch (error) { console.error('Error loading shard info:', error); }
    }
    function updateIntervalButtons() {
        document.querySelectorAll('.interval-btn').forEach(btn => {
            btn.classList.toggle('active', parseInt(btn.getAttribute('data-hours')) === currentTickInterval);
        });
    }
    async function setTickInterval(hours) {
        if (!isAuthenticated) return;
        const status = document.getElementById('interval-status');
        try {
            // Recalculate next_tick_at from NOW + new interval
            const nextTickAt = new Date(Date.now() + hours * 60 * 60 * 1000).toISOString();
            const { error } = await _supabase.from('shard').update({ tick_interval_hours: hours, next_tick_at: nextTickAt }).eq('name', 'Alpha Shard');
            if (error) throw error;
            currentTickInterval = hours; updateIntervalButtons();
            await loadShardInfo();
            status.className = 'status success'; status.textContent = `✅ Tick interval set to ${hours} hour${hours > 1 ? 's' : ''} — next tick in ${hours}h`; status.classList.remove('hidden');
            setTimeout(() => status.classList.add('hidden'), 3000);
        } catch (error) { status.className = 'status error'; status.textContent = '❌ Error: ' + error.message; status.classList.remove('hidden'); }
    }
    async function advanceTickAdmin() {
        if (!isAuthenticated) return;
        const status = document.getElementById('tick-status');
        status.className = 'status info'; status.textContent = 'Invoking advance-tick Edge Function...'; status.classList.remove('hidden');

        try {
            const { data, error } = await _supabase.functions.invoke('advance-tick', {
                body: { force: true }
            });

            if (error) {
                console.error('Edge Function invoke error:', error);
                status.className = 'status error';
                status.textContent = '❌ Edge Function error: ' + (error.message || error);
                return;
            }

            if (data.status === 'locked') {
                status.className = 'status error';
                status.textContent = '❌ Another process is already processing the tick. Wait and try again.';
                return;
            }

            if (data.error) {
                status.className = 'status error';
                status.textContent = '❌ Tick error: ' + data.error;
                return;
            }

            // Success — display summary
            const summary = data.summary;
            let msg = `✅ Tick ${summary.tick} complete! (${summary.nations} nations)`;
            const parts = [];
            if (summary.effects?.length) parts.push(`${summary.effects.reduce((s,e) => s + e.effects.length, 0)} law effects`);
            if (summary.ministryActions?.length) parts.push(`${summary.ministryActions.reduce((s,e) => s + e.effects.length, 0)} ministry effects`);
            if (summary.costs?.length) parts.push(`${summary.costs.length} cost deductions`);
            if (summary.apDistributed !== undefined) parts.push(`${summary.apDistributed} AP distributed`);
            if (summary.apFailed > 0) parts.push(`${summary.apFailed} AP failures`);
            if (parts.length) msg += ' — ' + parts.join(', ');
            status.className = 'status success'; status.textContent = msg;
            await loadShardInfo(); await loadStats();
        } catch (err) {
            console.error('advanceTickAdmin error:', err);
            status.className = 'status error'; status.textContent = '❌ Error: ' + err.message;
        }
    }

    async function reprocessTickAdmin() {
        if (!isAuthenticated) return;
        const status = document.getElementById('tick-status');
        status.className = 'status info'; status.textContent = 'Reprocessing current tick (no advance)...'; status.classList.remove('hidden');

        try {
            const { data, error } = await _supabase.functions.invoke('advance-tick', {
                body: { force: true, reprocess: true }
            });

            if (error) {
                console.error('Edge Function invoke error:', error);
                status.className = 'status error';
                status.textContent = '❌ Edge Function error: ' + (error.message || error);
                return;
            }

            if (data.status === 'locked') {
                status.className = 'status error';
                status.textContent = '❌ Another process is already processing. Wait and try again.';
                return;
            }

            if (data.error) {
                status.className = 'status error';
                status.textContent = '❌ Tick error: ' + data.error;
                return;
            }

            const summary = data.summary;
            let msg = `✅ Reprocessed tick ${summary.tick} (${summary.nations} nations) — no advance`;
            const parts = [];
            if (summary.effects?.length) parts.push(`${summary.effects.reduce((s,e) => s + e.effects.length, 0)} law effects`);
            if (summary.ministryActions?.length) parts.push(`${summary.ministryActions.reduce((s,e) => s + e.effects.length, 0)} ministry effects`);
            if (summary.elections?.length) parts.push(`${summary.elections.length} elections`);
            if (summary.resolutions?.length) parts.push(`${summary.resolutions.reduce((s,e) => s + e.bills.length, 0)} bill resolutions`);
            if (parts.length) msg += ' — ' + parts.join(', ');
            status.className = 'status success'; status.textContent = msg;
            await loadShardInfo(); await loadStats();
        } catch (err) {
            console.error('reprocessTickAdmin error:', err);
            status.className = 'status error'; status.textContent = '❌ Error: ' + err.message;
        }
    }

    // ==================== STATS ====================
    async function loadStats() {
        try {
            const { count: nationCount } = await _supabase.from('nations').select('*', { count: 'exact', head: true });
            const { count: playerCount } = await _supabase.from('factions').select('*', { count: 'exact', head: true }).eq('faction_type', 'party');
            const { count: partyCount } = await _supabase.from('factions').select('*', { count: 'exact', head: true }).eq('faction_type', 'party');
            const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
            document.getElementById('stat-nations').textContent = nationCount || 0;
            document.getElementById('stat-players').textContent = playerCount || 0;
            document.getElementById('stat-parties').textContent = partyCount || 0;
            document.getElementById('stat-tick').textContent = shard?.current_tick || 0;
        } catch (error) { console.error('Error loading stats:', error); }
    }

    // ==================== ELECTIONS TAB ====================
    async function loadElectionNations() {
        try {
            const { data } = await _supabase.from('nations').select('*').order('name');
            nations = data || [];
            const select = document.getElementById('election-nation-select');
            select.innerHTML = '<option value="">-- Choose a nation --</option>';
            nations.forEach(n => { select.innerHTML += `<option value="${n.id}">${escHtml(n.name)}</option>`; });

            // Populate schedule-election nation dropdown
            const schedSelect = document.getElementById('schedule-nation-select');
            schedSelect.innerHTML = '<option value="__all__">All Nations (Democracies)</option>';
            nations.forEach(n => {
                schedSelect.innerHTML += `<option value="${n.id}">${escHtml(n.name)} (${getCanonicalGovernmentType(n)})</option>`;
            });
        } catch (error) { console.error(error); }
    }
    async function onElectionNationSelect() {
        const nationId = document.getElementById('election-nation-select').value;
        const infoDiv = document.getElementById('election-nation-info');
        const btn = document.getElementById('run-election-btn');
        const previewBtn = document.getElementById('preview-election-btn');
        const typeSelector = document.getElementById('election-type-selector');
        const warningDiv = document.getElementById('election-type-warning');
        warningDiv.style.display = 'none';
        typeSelector.style.display = 'none';
        document.getElementById('election-info-scheduled').style.display = 'none';
        document.getElementById('election-info-candidates').style.display = 'none';
        if (!nationId) { infoDiv.classList.add('hidden'); btn.disabled = true; previewBtn.disabled = true; selectedElectionNation = null; return; }
        selectedElectionNation = nations.find(n => n.id === nationId);
        const isPresidential = isGovernmentPresidential(selectedElectionNation);
        const { count: partyCount } = await _supabase.from('factions').select('*', { count: 'exact', head: true }).eq('nation_id', nationId).eq('faction_type', 'party');
        const { data: lastElection } = await _supabase.from('elections').select('election_tick').eq('nation_id', nationId).eq('status', 'completed').order('election_tick', { ascending: false }).limit(1).maybeSingle();
        document.getElementById('election-info-gov-type').textContent = getCanonicalGovernmentType(selectedElectionNation);
        document.getElementById('election-info-seats').textContent = selectedElectionNation.total_seats || 120;
        document.getElementById('election-info-voters').textContent = Math.round((selectedElectionNation.population || 0) * 0.65).toLocaleString();
        document.getElementById('election-info-parties').textContent = partyCount || 0;
        document.getElementById('election-info-last').textContent = lastElection ? `Tick ${lastElection.election_tick}` : 'Never';

        if (isPresidential) {
            typeSelector.style.display = 'block';
            const { data: _shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
            const currentTick = _shard?.current_tick || 0;

            // Show next scheduled elections
            const { data: nextParl } = await _supabase.from('elections').select('election_tick')
                .eq('nation_id', nationId).eq('status', 'scheduled').eq('election_type', 'parliamentary')
                .order('election_tick', { ascending: true }).limit(1).maybeSingle();
            const { data: nextPres } = await _supabase.from('elections').select('election_tick')
                .eq('nation_id', nationId).eq('status', 'scheduled').eq('election_type', 'presidential')
                .order('election_tick', { ascending: true }).limit(1).maybeSingle();

            let schedText = '';
            if (nextParl) schedText += `Parliamentary: tick ${nextParl.election_tick} (${nextParl.election_tick - currentTick} away)`;
            if (nextPres) schedText += `${schedText ? ' | ' : ''}General Election: tick ${nextPres.election_tick} (${nextPres.election_tick - currentTick} away)`;
            if (schedText) {
                document.getElementById('election-info-next').textContent = schedText;
                document.getElementById('election-info-scheduled').style.display = '';
            }

            // Show candidate status
            const { count: selectedCandidates } = await _supabase.from('pm_candidates').select('*', { count: 'exact', head: true })
                .eq('nation_id', nationId).eq('candidate_type', 'presidential').eq('selected', true);
            const { count: unselectedCandidates } = await _supabase.from('pm_candidates').select('*', { count: 'exact', head: true })
                .eq('nation_id', nationId).eq('candidate_type', 'presidential').eq('selected', false);
            const candText = (selectedCandidates || 0) > 0
                ? `${selectedCandidates} selected, ${unselectedCandidates || 0} unselected`
                : (unselectedCandidates || 0) > 0
                    ? `${unselectedCandidates} generated (none selected)`
                    : 'None generated yet';
            document.getElementById('election-info-cand-status').textContent = candText;
            document.getElementById('election-info-candidates').style.display = '';

            // Update warning when type changes
            updateElectionTypeWarning(currentTick, selectedCandidates || 0, unselectedCandidates || 0);
            document.getElementById('election-type-select').onchange = () => updateElectionTypeWarning(currentTick, selectedCandidates || 0, unselectedCandidates || 0);
        }

        infoDiv.classList.remove('hidden'); btn.disabled = false; previewBtn.disabled = false;
    }

    function updateElectionTypeWarning(currentTick, selectedCount, unselectedCount) {
        const warningDiv = document.getElementById('election-type-warning');
        const elType = document.getElementById('election-type-select').value;
        if (elType !== 'presidential') {
            warningDiv.style.display = 'none';
            return;
        }
        const hasCandidates = selectedCount > 0 || unselectedCount > 0;
        if (!hasCandidates) {
            warningDiv.style.display = 'block';
            warningDiv.innerHTML = '<strong>No candidates exist.</strong> Running a presidential election will auto-generate candidates for all parties and auto-select them. No player will get to choose their nominee.';
        } else if (selectedCount === 0) {
            warningDiv.style.display = 'block';
            warningDiv.innerHTML = '<strong>Candidates generated but none selected.</strong> All parties will have a candidate auto-selected before the vote runs.';
        } else {
            warningDiv.style.display = 'none';
        }
    }
    async function runElection() {
        if (!isAuthenticated) return;
        if (!selectedElectionNation) return;
        const status = document.getElementById('election-status');
        const resultsDiv = document.getElementById('election-results');
        const resultsContent = document.getElementById('election-results-content');
        const btn = document.getElementById('run-election-btn');
        btn.disabled = true; btn.textContent = '⏳ Running Election...';
        status.className = 'status info'; status.textContent = 'Simulating election...'; status.classList.remove('hidden'); resultsDiv.classList.add('hidden');
        try {
            const { data: nationRow, error: nationError } = await _supabase
                .from('nations')
                .select('id, name, government_type')
                .eq('id', selectedElectionNation.id)
                .single();
            if (nationError) throw nationError;

            const { data: _shard2 } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
            const currentTick = _shard2?.current_tick || 0;
            const isPresidential = isGovernmentPresidential(nationRow);

            // Use admin-selected election type for Presidential nations
            const selectedElectionType = isPresidential
                ? document.getElementById('election-type-select').value
                : 'parliamentary';

            if (isPresidential) {
                const typeLabel = selectedElectionType === 'presidential' ? 'General Election (seats + president)' : 'Parliamentary (midterm)';
                const confirmMsg = `Run a ${typeLabel} election for ${nationRow.name}?\n\n` +
                    (selectedElectionType === 'presidential'
                        ? 'This will reshuffle parliamentary seats AND determine a new president via candidate popular vote. If no candidates exist, they will be auto-generated and auto-selected.'
                        : 'This will reshuffle parliamentary seats. The president stays in office.') +
                    '\n\nContinue?';
                if (!window.confirm(confirmMsg)) {
                    status.className = 'status info';
                    status.textContent = 'Election cancelled.';
                    return;
                }
            }

            const runResult = await runManualElectionByGovernmentType(_supabase, nationRow, {
                currentTick,
                electionType: selectedElectionType
            });

            // Display results — for general elections show both seats and candidates
            const candidateResults = runResult?.completedElection?.results?.presidential_candidates || [];
            const seatResultsDisplay = runResult?.completedElection?.results?.seats || runResult?.seatResults || [];
            let resultsHtml = '';

            if (seatResultsDisplay.length > 0) {
                const totalSeats = selectedElectionNation.total_seats || 120;
                resultsHtml += `<h4 style="color:#d48a3c;margin:0 0 8px;">Parliamentary Seats</h4>`;
                resultsHtml += seatResultsDisplay
                    .sort((a, b) => b.seats - a.seats)
                    .map(r => `<div class="result-party"><div><div class="result-party-name">${escHtml(r.party_name)}</div><div class="result-bar" style="width:200px;"><div class="result-bar-fill" style="width:${(r.seats/totalSeats)*100}%"></div></div></div><div class="result-party-seats">${r.seats} seats</div></div>`)
                    .join('');
            }

            if (candidateResults.length > 0) {
                const sorted = [...candidateResults].sort((a, b) => b.votes - a.votes);
                if (resultsHtml) resultsHtml += `<hr style="border-color:#333;margin:12px 0;">`;
                resultsHtml += `<h4 style="color:#5cb85c;margin:0 0 8px;">Presidential Vote</h4>`;
                resultsHtml += sorted.map(c => {
                    const isWinner = c.winner;
                    return `<div class="result-party" style="${isWinner ? 'border-left:3px solid #5cb85c;padding-left:8px;' : ''}">
                        <div><div class="result-party-name">${isWinner ? '&#x2713; ' : ''}${escHtml(c.candidate_name)} (${escHtml(c.party_name)})</div>
                        <div style="font-size:0.75rem;color:#888;">${c.ideology || ''}</div>
                        <div class="result-bar" style="width:200px;"><div class="result-bar-fill" style="width:${c.vote_percentage || 0}%"></div></div></div>
                        <div class="result-party-seats">${(c.votes || 0).toLocaleString()} votes (${c.vote_percentage || 0}%)</div>
                    </div>`;
                }).join('');
            }

            if (resultsHtml) {
                resultsContent.innerHTML = resultsHtml;
                resultsDiv.classList.remove('hidden');
            }

            const electionLabel = runResult?.electionType ? ` (${runResult.electionType})` : '';
            status.className = 'status success';
            status.textContent = `✅ Election completed for ${selectedElectionNation.name}${electionLabel}!`;
        } catch (error) {
            console.error(error);
            status.className = 'status error';
            status.textContent = '❌ Error: ' + error.message;
        } finally {
            btn.disabled = false;
            btn.textContent = '🗳️ RUN ELECTION NOW';
        }
    }

    async function previewElection() {
        if (!selectedElectionNation) return;
        const status = document.getElementById('election-status');
        const previewDiv = document.getElementById('election-preview');
        const previewContent = document.getElementById('election-preview-content');
        const previewSummary = document.getElementById('election-preview-summary');
        const previewBlocs = document.getElementById('election-preview-blocs');
        const btn = document.getElementById('preview-election-btn');

        btn.disabled = true; btn.textContent = '⏳ Simulating...';
        status.className = 'status info'; status.textContent = 'Running client-side election preview...'; status.classList.remove('hidden');
        previewDiv.classList.add('hidden');

        // Determine if this should be a presidential preview

        const maxVotes = candidates.length > 0 ? candidates[0].votes : 1;

            const isWinner = c.winner;

            return `<div class="result-party" style="${isWinner ? 'border-left:3px solid #5cb85c; padding-left:8px;' : ''}">
                <div>
                    <div class="result-party-name">
                        ${isWinner ? '&#x2713; ' : ''}${escHtml(c.candidate_name)}
                        <span style="color:#888; font-size:0.75rem;">(${escHtml(c.party_name)})</span>
                        ${c.ideology ? `<span style="background:#333; color:#ddd; font-size:0.65rem; padding:1px 5px; border-radius:8px; margin-left:4px;">${escHtml(c.ideology)}</span>` : ''}
                    </div>
                    <div class="result-bar" style="width:200px;">
                        <div class="result-bar-fill" style="width:${barW}%"></div>
                    </div>
                </div>
                <div class="result-party-seats">
                    ${c.votes.toLocaleString()} votes <span style="color:#888; font-size:0.75rem;">(${c.vote_percentage}%${c.approval != null ? ' · ' + c.approval + '% approval' : ''})</span>
                </div>
            </div>`;
        }).join('');
    }

    function renderBlocBreakdown(container, blocDetails, nameMap, title) {
        const stepLabels = { 0: 'Unaligned', 1: 'Full Match', 2: 'Partial Match', 3: 'No Opposition', 4: 'Forced/Abstain' };
        const stepCounts = {};
        for (const d of blocDetails) {
            stepCounts[d.step] = (stepCounts[d.step] || 0) + 1;
        }

        function renderBlocVotes(blocVotes, voterCount) {
            if (!blocVotes || Object.keys(blocVotes).length === 0) return '';
            const entries = Object.entries(blocVotes)
                .map(([pid, votes]) => ({ name: nameMap[pid] || pid.slice(0,8), votes }))
                .sort((a, b) => b.votes - a.votes);
            const maxVotes = entries[0].votes;
            return entries.map(e => {
                const pct = voterCount > 0 ? ((e.votes / voterCount) * 100).toFixed(1) : '0.0';
                const barW = maxVotes > 0 ? (e.votes / maxVotes) * 100 : 0;
                const isBold = e.votes === maxVotes ? 'font-weight:bold; color:#ffcc00;' : 'color:#aaa;';
                return `<div style="display:flex; align-items:center; gap:6px; margin:2px 0; font-size:0.7rem;">
                    <span style="width:120px; ${isBold} white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escHtml(e.name)}</span>
                    <div style="flex:1; height:8px; background:#222; border-radius:3px; overflow:hidden;">
                        <div style="width:${barW}%; height:100%; background:${e.votes === maxVotes ? '#ffcc00' : '#555'}; border-radius:3px;"></div>
                    </div>
                    <span style="width:80px; text-align:right; ${isBold}">${e.votes.toLocaleString()} (${pct}%)</span>
                </div>`;
            }).join('');
        }

        const summaryLabel = title || `Bloc breakdown: ${blocDetails.length} blocs processed`;
        const stepInfo = Object.entries(stepCounts).map(([s,c]) => `Step ${s}: ${c}`).join(', ');

        container.innerHTML = `
            <details>
                <summary style="cursor:pointer; color:#d48a3c; font-size:0.85rem;">
                    ${summaryLabel}
                    (${stepInfo})
                </summary>
                <div style="max-height:500px; overflow-y:auto; margin-top:8px;">
                    ${blocDetails.sort((a,b) => b.voter_count - a.voter_count).map(d => `
                        <details style="border-bottom:1px solid #222; padding:4px 0;">
                            <summary style="cursor:pointer; display:flex; justify-content:space-between; align-items:center; font-size:0.75rem; color:${d.step === 4 ? '#ff6666' : '#ccc'};">
                                <span style="flex:1;">${escHtml(d.bloc_name)}</span>
                                <span style="width:80px; text-align:right;">${d.voter_count.toLocaleString()}</span>
                                <span style="width:90px; text-align:center; color:#888;">${stepLabels[d.step] || d.step}</span>
                                <span style="width:50px; text-align:right;">${d.eligible_count || '-'}</span>
                                <span style="width:70px; text-align:right; color:${d.abstentions > 0 ? '#ff6666' : '#666'};">${d.abstentions > 0 ? d.abstentions.toLocaleString() + ' abs' : '-'}</span>
                            </summary>
                            <div style="padding:4px 8px 8px 16px; background:#1a1a1a; border-radius:4px; margin-top:4px;">
                                ${renderBlocVotes(d.blocVotes, d.voter_count - d.abstentions)}
                            </div>
                        </details>
                    `).join('')}
                </div>
            </details>
        `;
    }

    // ==================== SCHEDULE ELECTION ====================
    let scheduleCurrentTick = 0;

    async function scheduleElection() {
        if (!isAuthenticated) return;
        const nationSelect = document.getElementById('schedule-nation-select');
        const typeSelect = document.getElementById('schedule-type-select');
        const tickInput = document.getElementById('schedule-tick-input');
        const freqSelect = document.getElementById('schedule-frequency-select');
        const status = document.getElementById('schedule-status');
        const btn = document.getElementById('schedule-election-btn');

        const targetTick = parseInt(tickInput.value);
        const frequency = parseInt(freqSelect.value);
        if (!targetTick || targetTick < 1) {
            status.className = 'status error'; status.textContent = 'Enter a valid tick.'; status.classList.remove('hidden');
            return;
        }

        // Validate tick is in the future
        const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const currentTick = shard?.current_tick || 0;
        if (targetTick <= currentTick) {
            status.className = 'status error';
            status.textContent = `❌ Tick must be in the future. Current tick is ${currentTick}.`;
            status.classList.remove('hidden');
            return;
        }

        const electionType = typeSelect.value; // 'presidential' or 'parliamentary'
        const nationValue = nationSelect.value;

        // Determine which nations to schedule for
        let targetNations;
        if (nationValue === '__all__') {
            const { data } = await _supabase.from('nations').select('id, name, government_type');
            targetNations = data || [];
        } else {
            const { data } = await _supabase.from('nations').select('id, name, government_type')
                .eq('id', nationValue).single();
            targetNations = data ? [data] : [];
        }

        if (targetNations.length === 0) {
            status.className = 'status error'; status.textContent = 'No eligible nations found.'; status.classList.remove('hidden');
            return;
        }

        btn.disabled = true;
        status.className = 'status info'; status.textContent = '⏳ Scheduling & saving frequency...'; status.classList.remove('hidden');

        try {
            // Save the frequency to each nation so advanceTick uses it for auto-scheduling
            for (const nation of targetNations) {
                const freqUpdate = {};
                if (electionType === 'presidential') {
                    freqUpdate.presidential_term_ticks = frequency;
                } else {
                    freqUpdate.parliamentary_term_ticks = frequency;
                    freqUpdate.election_frequency = frequency;
                }
                const { error: updErr } = await _supabase.from('nations').update(freqUpdate).eq('id', nation.id);
                if (updErr) console.warn(`Failed to update frequency for ${nation.name}:`, updErr);
            }

            // Delete any existing scheduled elections of this type for these nations
            for (const nation of targetNations) {
                const { error: delErr } = await _supabase.from('elections').delete()
                    .eq('nation_id', nation.id)
                    .eq('status', 'scheduled')
                    .eq('election_type', electionType);
                if (delErr) console.warn(`Failed to clear old scheduled ${electionType} elections for ${nation.name}:`, delErr);
            }

            const rows = [];
            for (const nation of targetNations) {
                rows.push({
                    nation_id: nation.id,
                    election_tick: targetTick,
                    election_type: electionType,
                    status: 'scheduled'
                });
            }

            const { data: inserted, error } = await _supabase.from('elections').insert(rows).select();

            if (error) {
                status.className = 'status error';
                status.textContent = '❌ Insert error: ' + error.message;
                console.error('Election schedule insert error:', error);
            } else {
                const dbCount = inserted?.length || 0;
                const typeLabel = electionType === 'presidential' ? 'Presidential' : 'Parliamentary';
                status.className = 'status success';
                status.textContent = `✅ Scheduled ${typeLabel} for ${targetNations.length} nation(s) at tick ${targetTick}, frequency set to every ${frequency} ticks — ${dbCount} record(s) confirmed in DB`;
                console.log('Scheduled elections:', inserted);

                // Update the cached nations data with new frequency
                for (const nation of targetNations) {
                    const cached = nations.find(n => n.id === nation.id);
                    if (cached) {
                        if (electionType === 'presidential') {
                            cached.presidential_term_ticks = frequency;
                        } else {
                            cached.parliamentary_term_ticks = frequency;
                            cached.election_frequency = frequency;
                        }
                    }
                }
            }
        } catch (err) {
            status.className = 'status error';
            status.textContent = '❌ Unexpected error: ' + err.message;
            console.error('scheduleElection error:', err);
        }
        btn.disabled = false;
        status.classList.remove('hidden');
    }

    function onScheduleNationChange() {
        const nationValue = document.getElementById('schedule-nation-select').value;
        const typeSelect = document.getElementById('schedule-type-select');
        const freqSelect = document.getElementById('schedule-frequency-select');
        const freqHint = document.getElementById('schedule-freq-hint');
        const presOption = typeSelect.querySelector('option[value="presidential"]');

        if (nationValue === '__all__') {
            presOption.disabled = false;
            freqHint.textContent = '';
        } else {
            const nation = nations.find(n => n.id === nationValue);
            if (nation && !isGovernmentPresidential(nation)) {
                presOption.disabled = true;
                typeSelect.value = 'parliamentary';
            } else {
                presOption.disabled = false;
            }

            // Show current frequency from foundation law
            if (nation) {
                const parlFreq = nation.parliamentary_term_ticks || nation.election_frequency || 24;
                const presFreq = nation.presidential_term_ticks || 48;
                const isPres = isGovernmentPresidential(nation);
                if (isPres) {
                    freqHint.textContent = `Current: Parliamentary every ${parlFreq} ticks, Presidential every ${presFreq} ticks`;
                } else {
                    freqHint.textContent = `Current: Parliamentary every ${parlFreq} ticks`;
                }
                // Pre-select the current frequency in the dropdown
                const currentType = typeSelect.value;
                const currentFreq = currentType === 'presidential' ? presFreq : parlFreq;
                if (freqSelect.querySelector(`option[value="${currentFreq}"]`)) {
                    freqSelect.value = currentFreq;
                }
            }
        }
        updateElectionPreviewList();
    }

    function updateElectionPreviewList() {
        const tickInput = document.getElementById('schedule-tick-input');
        const freqSelect = document.getElementById('schedule-frequency-select');
        const typeSelect = document.getElementById('schedule-type-select');
        const previewBox = document.getElementById('schedule-preview-box');
        const previewList = document.getElementById('schedule-preview-list');

        const firstTick = parseInt(tickInput.value);
        const frequency = parseInt(freqSelect.value);
        const electionType = typeSelect.value === 'presidential' ? 'Presidential' : 'Parliamentary';

        if (!firstTick || firstTick < 1 || !frequency) {
            previewBox.style.display = 'none';
            return;
        }

        // Generate ~10 projected election ticks
        const ticks = [];
        for (let i = 0; i < 10; i++) {
            const tick = firstTick + (i * frequency);
            ticks.push(tick);
        }

        const currentTick = scheduleCurrentTick || 0;
        let html = `<div style="color:#8a8778; font-size:0.7rem; margin-bottom:6px;">Next ${electionType} elections (every ${frequency} ticks):</div>`;
        html += ticks.map((t, i) => {
            const isFuture = t > currentTick;
            const marker = i === 0 ? ' ← first (scheduled now)' : '';
            const color = isFuture ? '#c8c4b8' : '#5c5a50';
            const pastLabel = !isFuture ? ' (past)' : '';
            return `<div style="color:${color}; padding:2px 0;">Tick ${t}${marker}${pastLabel}</div>`;
        }).join('');

        previewList.innerHTML = html;
        previewBox.style.display = 'block';
    }

    async function loadAllPlayers(filter) {
        try {
            document.getElementById('players-list').innerHTML = '<div class="no-players">Loading...</div>';
            const [{ data: factions }, { data: shard }, { data: allStandings }] = await Promise.all([
                _supabase.from('factions').select('id, faction_name, abbreviation, faction_type, nation_id, nation, seats, action_points, last_seen_tick, founded_tick, corp_sector, corp_subsector, linked_user_id, corp_cash_reserves, party_funds').order('faction_name'),
                _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single(),
                _supabase.from('faction_electoral_standing').select('faction_id, party_approval')
            ]);
            const approvalMap = Object.fromEntries((allStandings || []).map(s => [s.faction_id, s.party_approval]));
            // Attach party_approval to each faction for display
            (factions || []).forEach(f => { f.party_approval = approvalMap[f.id] ?? null; });
            allPlayersCache = factions || [];
            shardCurrentTick = shard?.current_tick || 0;

            // Fetch player emails via admin RPC
            try {
                const factionIds = (factions || []).map(f => f.id);
                if (factionIds.length > 0) {
                    const { data: emailData } = await _supabase.rpc('admin_get_player_emails', { p_faction_ids: factionIds });
                    if (emailData) {
                        const emailMap = Object.fromEntries(emailData.map(e => [e.faction_id, e]));
                        allPlayersCache.forEach(f => {
                            const info = emailMap[f.id];
                            f._email = info?.email || null;
                            f._displayName = info?.display_name || null;
                        });
                    }
                }
            } catch (_) { /* non-fatal — emails just won't show */ }

            renderPlayers(filter);
        } catch (error) { console.error(error); document.getElementById('players-list').innerHTML = '<div class="no-players" style="color:#d9534f;">Error loading players</div>'; }
    }
    function filterPlayers(filter) { renderPlayers(filter); }
    function getInactivityBadge(player) {
        if (!player.nation_id) return '';
        // Corporations don't have inactivity — no seats to lose
        if (player.faction_type === 'corporation') return '<span style="background:#1a2a2a; color:#5aafa5; padding:3px 8px; border-radius:3px; font-size:0.7rem; font-weight:bold;">CORP</span>';
        // If never seen, use founded_tick as reference — only truly "new" if founded recently (< 3 ticks)
        if (player.last_seen_tick == null) {
            const ticksSinceFounded = shardCurrentTick - (player.founded_tick || 0);
            if (ticksSinceFounded < 3) return '<span style="background:#1a1a2a; color:#64b5f6; padding:3px 8px; border-radius:3px; font-size:0.7rem; font-weight:bold;">NEW</span>';
            // Never logged in but founded long ago — treat as inactive using founded_tick
            const inactive = ticksSinceFounded;
            if (inactive >= 12) return `<span style="background:#2a1a1a; color:#d9534f; padding:3px 8px; border-radius:3px; font-size:0.7rem; font-weight:bold;">NO SEATS (${inactive} ticks)</span>`;
            if (inactive >= 6) return `<span style="background:#2a1a0a; color:#ff8800; padding:3px 8px; border-radius:3px; font-size:0.7rem; font-weight:bold;">DRAINING (${inactive} ticks)</span>`;
            if (inactive >= 3) return `<span style="background:#2a2a0a; color:#ffcc00; padding:3px 8px; border-radius:3px; font-size:0.7rem; font-weight:bold;">IDLE (${inactive} ticks)</span>`;
            return '<span style="background:#1a2a1a; color:#5cb85c; padding:3px 8px; border-radius:3px; font-size:0.7rem; font-weight:bold;">ACTIVE</span>';
        }
        const inactive = shardCurrentTick - player.last_seen_tick;
        if (inactive >= 12) return `<span style="background:#2a1a1a; color:#d9534f; padding:3px 8px; border-radius:3px; font-size:0.7rem; font-weight:bold;">NO SEATS (${inactive} ticks)</span>`;
        if (inactive >= 6) return `<span style="background:#2a1a0a; color:#ff8800; padding:3px 8px; border-radius:3px; font-size:0.7rem; font-weight:bold;">DRAINING (${inactive} ticks)</span>`;
        if (inactive >= 3) return `<span style="background:#2a2a0a; color:#ffcc00; padding:3px 8px; border-radius:3px; font-size:0.7rem; font-weight:bold;">IDLE (${inactive} ticks)</span>`;

    async function removePlayer(playerId, nationId, partyName) {
        if (!isAuthenticated) return;
        if (!confirm(`Remove ${partyName} from this nation? This will zero their seats, redistribute to remaining parties, and clean up related records.`)) return;
        try {
            const { data, error } = await _supabase.rpc('admin_kick_party', { p_faction_id: playerId, p_nation_id: nationId });
            if (error) throw error;
            const summary = data ? Object.entries(data).map(([k,v]) => `${k}: ${v}`).join(', ') : 'done';
            alert(`✅ "${partyName}" removed!\n${summary}`);
            await loadStats(); await loadNations();
        } catch (error) { alert('❌ Error: ' + error.message); }
    }
    async function deleteParty(factionId, partyName) {
        if (!isAuthenticated) return;
        if (!confirm(`⚠️ PERMANENTLY DELETE "${partyName}"?`)) return;
        try {
            const { data, error } = await _supabase.rpc('admin_delete_party', { p_faction_id: factionId });
            if (error) throw error;
            if (data?.error) {
                // Safeguard triggered — faction belongs to a real player
                if (!confirm(`⚠️ ${data.error}\n\nForce delete anyway?`)) return;
                const { data: d2, error: e2 } = await _supabase.rpc('admin_delete_party', { p_faction_id: factionId, p_force: true });
                if (e2) throw e2;
            }
            alert(`✅ "${partyName}" deleted!`);
            await loadStats(); await loadNations();
        } catch (error) { alert('❌ Error: ' + error.message); }
    }

    async function adminRemoveCash(factionId, factionName, factionType) {
        if (!isAuthenticated) return;
        const isCorp = factionType === 'corporation';
        const label = isCorp ? 'corp cash reserves' : 'party funds';
        const column = isCorp ? 'corp_cash_reserves' : 'party_funds';

        const input = prompt(`Remove ${label} from "${factionName}".\n\nEnter amount in dollars (e.g. 5000000 for $5M), or "all" to zero out:`);
        if (input === null) return;
        const removeAll = input.trim().toLowerCase() === 'all';
        const amount = removeAll ? 0 : parseInt(input.replace(/[,\s]/g, ''), 10);
        if (!removeAll && (isNaN(amount) || amount <= 0)) { alert('Invalid amount. Enter a positive number.'); return; }

        try {
            const { data: f } = await _supabase.from('factions').select(column).eq('id', factionId).single();
            const current = Number(f?.[column] ?? 0);
            const updated = removeAll ? 0 : Math.max(0, current - amount);
            const { error } = await _supabase.from('factions').update({ [column]: updated }).eq('id', factionId);
            if (error) throw error;
            alert(`${removeAll ? 'Zeroed' : 'Removed $' + (amount/1e6).toFixed(2) + 'M from'} "${factionName}" ${label}.\n$${(current/1e6).toFixed(2)}M → $${(updated/1e6).toFixed(2)}M`);
            await loadAllPlayers(document.getElementById('player-filter')?.value || 'all');
        } catch (error) { alert('Error: ' + error.message); }
    }
