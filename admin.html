// ==================== SEED STATS EDITOR ====================
// Allows admin to view and edit per-nation tick-1 seed stats.
// Changes are written to the seed_stats JSONB column, which the
// shard reset function uses to restore nation state.

const SEED_STAT_CATEGORIES = {
    'Economy': ['gdp', 'gdp_growth', 'debt', 'debt_growth', 'inflation', 'interest_rates', 'trade_balance', 'currency_strength', 'foreign_investment', 'credit', 'budget'],
    'Taxation': ['income_tax', 'corporate_tax', 'sales_tax', 'tariffs'],
    'Labor': ['unemployment', 'labor_force_participation', 'minimum_wage', 'union_strength', 'poverty_rate', 'income_inequality'],
    'Demographics': ['population', 'population_growth', 'birth_rate', 'death_rate', 'median_age', 'ethnic_diversity', 'eligible_voters'],
    'Healthcare': ['healthcare_quality', 'healthcare_accessibility', 'beds_per_100k', 'lifespan', 'drug_use'],
    'Education': ['literacy', 'higher_education', 'education_accessibility', 'academic_immigration'],
    'Infrastructure': ['physical_infrastructure', 'digital_infrastructure', 'rail_network', 'urbanization', 'energy_generation', 'renewable_energy_percentage'],
    'Resources': ['arable_land', 'rare_minerals', 'oil_and_gas', 'fuel_prices'],
    'Environment': ['pollution', 'carbon_emissions'],
    'Society': ['standard_of_living', 'happiness', 'religious', 'social_mobility', 'benefits', 'crime_rate', 'incarceration_rate', 'cost_of_living', 'housing_affordability', 'manufacturing_output', 'service_output'],
    'Governance': ['stability', 'legitimacy', 'efficiency', 'corruption', 'press_freedom', 'judicial_independence', 'freedom_index', 'polarization'],
    'Security': ['civil_unrest', 'terrorism', 'political_violence'],
    'Migration': ['immigration', 'illegal_immigration', 'emigration'],
    'International': ['international_reputation'],
    'Government': ['government_type', 'total_seats', 'first_election_tick'],
};

// Stats stored as raw dollar values (not 0-100 scores)
const SEED_RAW_STATS = new Set(['gdp', 'debt', 'budget', 'population', 'eligible_voters']);
// Schema defaults — used to flag stats that were never explicitly set
const SEED_SCHEMA_DEFAULTS = {
    standard_of_living: 50, urbanization: 50, population_growth: 0,
    currency_strength: 50, physical_infrastructure: 50, rail_network: 50,
    energy_generation: 50, foreign_investment: 50, arable_land: 50,
    rare_minerals: 50, oil_and_gas: 50, stability: 50, corruption: 50,
};

let _seedNations = [];
let _seedSelectedNationId = null;

async function initSeedEditor() {
    // Insert container after the danger zone section if not already present
    if (document.getElementById('seed-editor-root')) return;

    // Find a place to put it — after the reset section or at the end of admin content
    const adminSection = document.getElementById('admin-section');
    if (!adminSection) return;

    const root = document.createElement('div');
    root.id = 'seed-editor-root';
    root.style.cssText = 'margin:20px;padding:20px;background:#1a1a1a;border:1px solid #333;font-family:JetBrains Mono,monospace;';
    adminSection.appendChild(root);

    root.innerHTML = `
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
            <div style="width:6px;height:6px;border-radius:50%;background:#facc15;"></div>
            <span style="font-size:11px;font-weight:700;letter-spacing:0.1em;color:#ccc;text-transform:uppercase;">Tick 1 Seed Stats Editor</span>
        </div>
        <div style="display:flex;gap:12px;align-items:center;margin-bottom:16px;">
            <select id="seed-nation-select" onchange="seedSelectNation(this.value)"
                style="background:#222;color:#eee;border:1px solid #444;padding:6px 10px;font-family:inherit;font-size:12px;min-width:200px;">
                <option value="">— Select a nation —</option>
            </select>
            <button onclick="seedSave()" id="seed-save-btn"
                style="background:#2a6e2a;color:#fff;border:1px solid #3a8a3a;padding:6px 14px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:0.05em;">
                SAVE TO SEED
            </button>
            <button onclick="seedLoadLive()" id="seed-load-live-btn"
                style="background:#555;color:#eee;border:1px solid #666;padding:6px 14px;font-family:inherit;font-size:11px;cursor:pointer;letter-spacing:0.05em;">
                LOAD LIVE VALUES
            </button>
            <span id="seed-editor-status" style="font-size:10px;color:#888;margin-left:auto;"></span>
        </div>
        <div id="seed-editor-body" style="max-height:600px;overflow-y:auto;"></div>
    `;

    // Load nations
    const { data: nations, error: nErr } = await _supabase.from('nations').select('id, name, seed_stats').order('name');
    if (nErr) { console.error('[SeedEditor] Failed to load nations:', nErr.message); return; }
    _seedNations = nations || [];

    const sel = document.getElementById('seed-nation-select');
    for (const n of _seedNations) {
        const opt = document.createElement('option');
        opt.value = n.id;
        opt.textContent = n.name;
        sel.appendChild(opt);
    }
}

async function seedSelectNation(nationId) {
    if (!nationId) {
        document.getElementById('seed-editor-body').innerHTML = '';
        _seedSelectedNationId = null;
        return;
    }
    _seedSelectedNationId = nationId;
    const nation = _seedNations.find(n => n.id === nationId);
    if (!nation) return;

    const seed = nation.seed_stats || {};
    const body = document.getElementById('seed-editor-body');
    const statusEl = document.getElementById('seed-editor-status');
    statusEl.textContent = 'Loading...';
    statusEl.style.color = '#888';

    // Fetch live nation data for delta comparison
    let live = {};
    try {
        const { data, error } = await _supabase.from('nations').select('*').eq('id', nationId).single();
        if (!error && data) live = data;
    } catch (_) { /* non-fatal — deltas just won't show */ }

    // Count coverage: how many stats in the editor have a saved seed value
    const allEditorStats = Object.values(SEED_STAT_CATEGORIES).flat();
    const savedCount = allEditorStats.filter(s => seed[s] !== undefined && seed[s] !== null).length;
    const totalCount = allEditorStats.length;
    const pct = Math.round((savedCount / totalCount) * 100);
    const coverageColor = pct >= 90 ? '#5cb85c' : pct >= 60 ? '#c8a64e' : '#d9534f';

    let html = '';

    // Coverage bar
    html += `<div style="margin-bottom:14px;padding:8px 10px;background:#111;border:1px solid #333;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
            <span style="font-size:8px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.06em;">Seed Coverage</span>
            <span style="font-size:10px;font-weight:700;color:${coverageColor};">${savedCount}/${totalCount} stats (${pct}%)</span>
        </div>
        <div style="height:4px;background:#333;border-radius:2px;overflow:hidden;">
            <div style="height:100%;width:${pct}%;background:${coverageColor};border-radius:2px;"></div>
        </div>
        ${pct < 100 ? `<div style="font-size:7px;color:#888;margin-top:4px;">Stats not in seed will keep their live values after reset instead of resetting.</div>` : ''}
    </div>`;

    for (const [category, stats] of Object.entries(SEED_STAT_CATEGORIES)) {
        html += `<div style="margin-bottom:12px;">
            <div style="font-size:8px;font-weight:700;letter-spacing:0.08em;color:#888;text-transform:uppercase;padding:4px 0;border-bottom:1px solid #333;margin-bottom:6px;">${category}</div>
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:4px 16px;">`;

        for (const stat of stats) {
            const val = seed[stat];
            const isRaw = SEED_RAW_STATS.has(stat);
            const isString = stat === 'government_type';
            const isTickField = stat === 'first_election_tick';
            const schemaDefault = SEED_SCHEMA_DEFAULTS[stat];
            const isDefault = schemaDefault !== undefined && (val === schemaDefault || val === undefined || val === null);
            const displayVal = val !== undefined && val !== null ? val : (schemaDefault !== undefined ? schemaDefault : '');
            const label = stat.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

            const warnStyle = isDefault ? 'border-color:#c8a64e;background:#2a2510;' : '';
            const warnBadge = isDefault ? '<span style="font-size:7px;color:#c8a64e;font-weight:700;margin-left:4px;" title="At schema default — may need tuning">DEFAULT</span>' : '';

            // Delta: compare seed value to live value
            let deltaHtml = '';
            const liveVal = live[stat];
            if (liveVal !== undefined && liveVal !== null && !isString) {
                const seedNum = (val !== undefined && val !== null) ? Number(val) : (schemaDefault !== undefined ? schemaDefault : null);
                const liveNum = Number(liveVal);
                if (seedNum !== null && !isNaN(seedNum) && !isNaN(liveNum) && seedNum !== liveNum) {
                    const diff = liveNum - seedNum;
                    if (isRaw) {
                        const absDiff = Math.abs(diff);
                        const diffLabel = absDiff >= 1e9 ? (diff/1e9).toFixed(1)+'B' : absDiff >= 1e6 ? (diff/1e6).toFixed(0)+'M' : diff.toLocaleString();
                        const sign = diff > 0 ? '+' : '';
                        const color = '#5b9bd5';
                        deltaHtml = `<span style="font-size:7px;color:${color};font-family:inherit;" title="Live: ${liveNum.toLocaleString()}">live ${sign}${diffLabel}</span>`;
                    } else {
                        const sign = diff > 0 ? '+' : '';
                        const color = Math.abs(diff) > 10 ? '#d9534f' : '#5b9bd5';
                        deltaHtml = `<span style="font-size:7px;color:${color};font-family:inherit;" title="Live: ${liveNum.toFixed(1)}">live ${sign}${diff.toFixed(1)}</span>`;
                    }
                }
            }

            const badges = [warnBadge, deltaHtml].filter(Boolean).join(' ');

            if (isString) {
                html += `<div style="display:flex;align-items:center;gap:6px;padding:2px 0;">
                    <label style="font-size:9px;color:#aaa;min-width:120px;text-transform:uppercase;letter-spacing:0.03em;">${label}</label>
                    <input type="text" data-stat="${stat}" value="${displayVal}"
                        style="background:#222;color:#eee;border:1px solid #444;padding:3px 6px;font-family:inherit;font-size:11px;width:140px;${warnStyle}">
                    ${badges}
                </div>`;
            } else if (isTickField) {
                html += `<div style="display:flex;align-items:center;gap:6px;padding:2px 0;">
                    <label style="font-size:9px;color:#aaa;min-width:120px;text-transform:uppercase;letter-spacing:0.03em;">${label}</label>
                    <input type="number" data-stat="${stat}" value="${displayVal}" step="1" min="1" max="999"
                        style="background:#222;color:#eee;border:1px solid #444;padding:3px 6px;font-family:inherit;font-size:11px;width:70px;${warnStyle}"
                        title="Tick number for first election after reset" placeholder="e.g. 6">
                    ${badges}
                </div>`;
            } else if (isRaw) {
                html += `<div style="display:flex;align-items:center;gap:6px;padding:2px 0;">
                    <label style="font-size:9px;color:#aaa;min-width:120px;text-transform:uppercase;letter-spacing:0.03em;">${label}</label>
                    <input type="text" data-stat="${stat}" value="${typeof displayVal === 'number' ? displayVal.toLocaleString() : displayVal}"
                        style="background:#222;color:#eee;border:1px solid #444;padding:3px 6px;font-family:inherit;font-size:11px;width:140px;${warnStyle}"
                        title="Raw value (not 0-100)">
                    ${badges}
                </div>`;
            } else {
                html += `<div style="display:flex;align-items:center;gap:6px;padding:2px 0;">
                    <label style="font-size:9px;color:#aaa;min-width:120px;text-transform:uppercase;letter-spacing:0.03em;">${label}</label>
                    <input type="number" data-stat="${stat}" value="${displayVal}" step="0.1" min="0" max="100"
                        style="background:#222;color:#eee;border:1px solid #444;padding:3px 6px;font-family:inherit;font-size:11px;width:70px;${warnStyle}">
                    ${badges}
                </div>`;
            }
        }
        html += `</div></div>`;
    }

    const savedAt = seed._saved_at;
    const footer = savedAt ? `Last saved: ${new Date(savedAt).toLocaleString()}` : 'No seed saved yet — stats will not be restored on reset';
    const footerColor = savedAt ? '#666' : '#d9534f';
    html += `<div style="font-size:9px;color:${footerColor};margin-top:12px;padding-top:8px;border-top:1px solid #333;">${footer}</div>`;

    body.innerHTML = html;
    statusEl.textContent = `Loaded seed for ${nation.name}`;
    statusEl.style.color = '#888';
}

async function seedSave() {
    if (!_seedSelectedNationId) return;
    const statusEl = document.getElementById('seed-editor-status');
    const btn = document.getElementById('seed-save-btn');
    btn.disabled = true;
    statusEl.textContent = 'Saving...';
    statusEl.style.color = '#5b9bd5';

    try {
        const inputs = document.querySelectorAll('#seed-editor-body [data-stat]');
        const seed = {};

        for (const input of inputs) {
            const stat = input.dataset.stat;
            const raw = input.value.trim();
            if (raw === '') continue;

            if (stat === 'government_type') {
                seed[stat] = raw;
            } else if (SEED_RAW_STATS.has(stat)) {
                // Parse raw values (remove commas)
                const num = Number(raw.replace(/,/g, ''));
                if (!isNaN(num)) seed[stat] = num;
            } else if (stat === 'total_seats' || stat === 'median_age' || stat === 'first_election_tick') {
                seed[stat] = parseInt(raw, 10);
            } else {
                const num = parseFloat(raw);
                if (!isNaN(num)) seed[stat] = num;
            }
        }

        // Validate GDP/debt are dollar-scale
        if (seed.gdp !== undefined && seed.gdp >= 0 && seed.gdp <= 100000) {
            statusEl.textContent = `GDP=${seed.gdp} looks like a stat score, not dollars. Aborting.`;
            statusEl.style.color = '#d9534f';
            btn.disabled = false;
            return;
        }

        seed._saved_at = new Date().toISOString();

        const { error } = await _supabase.from('nations')
            .update({ seed_stats: seed })
            .eq('id', _seedSelectedNationId);

        if (error) throw error;

        // Update local cache
        const nation = _seedNations.find(n => n.id === _seedSelectedNationId);
        if (nation) nation.seed_stats = seed;

        const statCount = Object.keys(seed).filter(k => k !== '_saved_at').length;
        statusEl.textContent = `Saved ${statCount} stats for ${nation?.name || 'nation'}`;
        statusEl.style.color = '#5cb85c';
    } catch (err) {
        console.error('[SeedEditor] Save failed:', err);
        statusEl.textContent = `Save failed: ${err.message}`;
        statusEl.style.color = '#d9534f';
    } finally {
        btn.disabled = false;
    }
}

async function seedLoadLive() {
    if (!_seedSelectedNationId) return;
    const statusEl = document.getElementById('seed-editor-status');
    statusEl.textContent = 'Loading live values...';
    statusEl.style.color = '#5b9bd5';

    try {
        const { data: nation, error } = await _supabase.from('nations')
            .select('*')
            .eq('id', _seedSelectedNationId)
            .single();
        if (error) throw error;

        // Populate inputs with live values instead of seed values
        const inputs = document.querySelectorAll('#seed-editor-body [data-stat]');
        for (const input of inputs) {
            const stat = input.dataset.stat;
            const val = nation[stat];
            if (val !== undefined && val !== null) {
                if (SEED_RAW_STATS.has(stat) && typeof val === 'number') {
                    input.value = val.toLocaleString();
                } else {
                    input.value = val;
                }
                // Clear warning styling since we have a live value
                input.style.borderColor = '#5b9bd5';
                input.style.background = '#1a2530';
            }
        }

        statusEl.textContent = `Loaded live values for ${nation.name} — edit and SAVE TO SEED when ready`;
        statusEl.style.color = '#5b9bd5';
    } catch (err) {
        console.error('[SeedEditor] Load live failed:', err);
        statusEl.textContent = `Failed: ${err.message}`;
        statusEl.style.color = '#d9534f';
    }
}

window.initSeedEditor = initSeedEditor;
window.seedSelectNation = seedSelectNation;
window.seedSave = seedSave;
window.seedLoadLive = seedLoadLive;

// Auto-init when admin panel loads
document.addEventListener('admin-panel-loaded', () => {
    setTimeout(initSeedEditor, 500);
});

// ==================== MODERATION TAB (Phase 5c) ====================
// Surfaces the message_reports queue + lets admins wipe messages and
// mute / ban chat members per channel. Reads and writes assume the
// caller is an admin (RLS enforces that on every table).

let _modView = 'reports';

function showModView(view) {
    _modView = view;
    document.querySelectorAll('.mod-btn').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById('mod-btn-' + view);
    if (btn) btn.classList.add('active');
    const status = document.getElementById('mod-status');
    if (status) status.textContent = 'Loading...';
    if (view === 'reports') renderModReports();
    else if (view === 'muted') renderModMutedBanned();
    else if (view === 'actions') renderModManualActions();
}
window.showModView = showModView;

async function renderModReports() {
    const container = document.getElementById('mod-content');
    const status = document.getElementById('mod-status');
    if (!container) return;

    try {
        const { data: reports, error } = await _supabase
            .from('message_reports')
            .select('id, message_kind, message_id, chat_id, reporter_faction_id, reason, created_at, resolved_at')
            .is('resolved_at', null)
            .order('created_at', { ascending: false })
            .limit(50);
        if (error) throw error;

        if (!reports || reports.length === 0) {
            container.innerHTML = `<div style="color:#888;padding:20px;text-align:center;">No open reports.</div>`;
            if (status) status.textContent = '';
            return;
        }

        // Collect ids for batched hydration of message + reporter.
        const groupIds = reports.filter(r => r.message_kind === 'group').map(r => r.message_id);
        const dmIds    = reports.filter(r => r.message_kind === 'dm').map(r => r.message_id);
        const factionIds = [...new Set(reports.map(r => r.reporter_faction_id).filter(Boolean))];

        const [groupMsgs, dmMsgs, factions] = await Promise.all([
            groupIds.length
                ? _supabase.from('group_chat_messages').select('id, chat_id, sender_id, message_text, created_at, deleted_at').in('id', groupIds)
                : Promise.resolve({ data: [] }),
            dmIds.length
                ? _supabase.from('direct_messages').select('id, sender_id, receiver_id, message_text, created_at, deleted_at').in('id', dmIds)
                : Promise.resolve({ data: [] }),
            factionIds.length
                ? _supabase.from('factions').select('id, faction_name, abbreviation').in('id', factionIds)
                : Promise.resolve({ data: [] }),
        ]);

        const msgMap = {};
        for (const m of (groupMsgs.data || [])) msgMap[m.id] = { kind: 'group', ...m };
        for (const m of (dmMsgs.data || [])) msgMap[m.id] = { kind: 'dm', ...m };
        const factionMap = {};
        for (const f of (factions.data || [])) factionMap[f.id] = f;

        container.innerHTML = reports.map(r => {
            const m = msgMap[r.message_id];
            const reporter = factionMap[r.reporter_faction_id];
            const reporterName = reporter?.faction_name || '(unknown)';
            const msgText = m ? (m.deleted_at ? '<em>[already deleted]</em>' : escapeHtml(m.message_text || '').slice(0, 500)) : '<em>[message not found]</em>';
            const senderId = m?.sender_id || '';
            const chatId = m?.chat_id || r.chat_id || '';
            const deleteBtn = m && !m.deleted_at
                ? `<button class="btn btn-secondary" style="padding:4px 10px;font-size:0.75rem;" onclick="modWipeMessage('${escapeAttr(r.message_kind)}','${escapeAttr(r.message_id)}','${escapeAttr(r.id)}')">Wipe</button>`
                : '';
            const muteCtrl = (r.message_kind === 'group' && senderId && chatId)
                ? `<button class="btn btn-secondary" style="padding:4px 10px;font-size:0.75rem;margin-left:6px;" onclick="modMute('${escapeAttr(chatId)}','${escapeAttr(senderId)}', 60)">Mute 1h</button>
                   <button class="btn btn-secondary" style="padding:4px 10px;font-size:0.75rem;margin-left:6px;" onclick="modBan('${escapeAttr(chatId)}','${escapeAttr(senderId)}')">Ban</button>`
                : '';
            return `<div style="background:#1f1f1c;border:1px solid #333;border-radius:4px;padding:12px;margin-bottom:10px;">
                <div style="font-size:0.75rem;color:#888;margin-bottom:4px;">
                    ${new Date(r.created_at).toLocaleString()} &middot;
                    reported by <strong>${escapeHtml(reporterName)}</strong> &middot;
                    ${escapeHtml(r.message_kind)} ${senderId ? 'from sender ' + senderId.slice(0,8) : ''}
                </div>
                <div style="color:#e0dbc8;margin-bottom:6px;">${msgText}</div>
                <div style="color:#c8a64e;font-size:0.8rem;font-style:italic;margin-bottom:8px;">Reason: ${escapeHtml(r.reason || '')}</div>
                <div>
                    ${deleteBtn}
                    ${muteCtrl}
                    <button class="btn btn-secondary" style="padding:4px 10px;font-size:0.75rem;margin-left:6px;" onclick="modDismissReport('${escapeAttr(r.id)}')">Dismiss</button>
                </div>
            </div>`;
        }).join('');
        if (status) status.textContent = `${reports.length} open report${reports.length === 1 ? '' : 's'}.`;
    } catch (err) {
        console.error('[Mod] reports load failed:', err);
        container.innerHTML = `<div style="color:#d9534f;padding:20px;">Failed to load reports: ${err.message || err}</div>`;
    }
}

// Supabase update returns success with 0 rows affected when no row
// matches — without a .select() round-trip the admin thinks the action
// worked. All mod mutations below verify the affected row set.
async function modWipeMessage(kind, messageId, reportId) {
    if (!confirm('Wipe this message? It will be replaced with a tombstone for all viewers.')) return;
    const table = kind === 'dm' ? 'direct_messages' : 'group_chat_messages';
    try {
        const { data, error } = await _supabase.from(table)
            .update({ deleted_at: new Date().toISOString() })
            .eq('id', messageId)
            .select('id');
        if (error) throw error;
        if (!data || data.length === 0) { alert('Wipe failed: message not found.'); return; }
        if (reportId) await modDismissReport(reportId, true);
        else renderModReports();
    } catch (err) {
        alert('Wipe failed: ' + (err.message || err));
    }
}
window.modWipeMessage = modWipeMessage;

async function modMute(chatId, factionId, minutes) {
    const mins = parseInt(minutes, 10);
    if (!mins || mins < 1) { alert('Invalid mute duration.'); return; }
    const until = new Date(Date.now() + mins * 60 * 1000).toISOString();
    try {
        const { data, error } = await _supabase.from('group_chat_members')
            .update({ muted_until: until })
            .eq('chat_id', chatId).eq('faction_id', factionId)
            .select('chat_id');
        if (error) throw error;
        if (!data || data.length === 0) { alert('Mute failed: no matching membership row.'); return; }
        alert(`Muted until ${new Date(until).toLocaleString()}.`);
    } catch (err) {
        alert('Mute failed: ' + (err.message || err));
    }
}
window.modMute = modMute;

async function modBan(chatId, factionId) {
    if (!confirm('Permanently ban this faction from this channel? Reversible via the Active Mutes / Bans tab.')) return;
    try {
        const { data, error } = await _supabase.from('group_chat_members')
            .update({ banned_at: new Date().toISOString() })
            .eq('chat_id', chatId).eq('faction_id', factionId)
            .select('chat_id');
        if (error) throw error;
        if (!data || data.length === 0) { alert('Ban failed: no matching membership row.'); return; }
        alert('Ban applied.');
    } catch (err) {
        alert('Ban failed: ' + (err.message || err));
    }
}
window.modBan = modBan;

async function modUnmute(chatId, factionId) {
    try {
        const { data, error } = await _supabase.from('group_chat_members')
            .update({ muted_until: null, banned_at: null, banned_by: null })
            .eq('chat_id', chatId).eq('faction_id', factionId)
            .select('chat_id');
        if (error) throw error;
        if (!data || data.length === 0) { alert('Clear failed: no matching row.'); return; }
        renderModMutedBanned();
    } catch (err) { alert('Unmute failed: ' + (err.message || err)); }
}
window.modUnmute = modUnmute;

async function modDismissReport(reportId, skipReload) {
    try {
        const { data: { user } } = await _supabase.auth.getUser();
        const { error } = await _supabase.from('message_reports')
            .update({ resolved_at: new Date().toISOString(), resolved_by: user?.id || null })
            .eq('id', reportId);
        if (error) throw error;
        if (!skipReload) renderModReports();
    } catch (err) {
        alert('Dismiss failed: ' + (err.message || err));
    }
}
window.modDismissReport = modDismissReport;

async function renderModMutedBanned() {
    const container = document.getElementById('mod-content');
    const status = document.getElementById('mod-status');
    if (!container) return;

    try {
        const { data, error } = await _supabase
            .from('group_chat_members')
            .select('chat_id, faction_id, muted_until, banned_at, group_chats(name, chat_type), factions(faction_name, abbreviation)')
            .or('banned_at.not.is.null,muted_until.not.is.null');
        if (error) throw error;

        // Filter out expired mutes client-side since the trigger evaluates
        // live but the DB may carry stale past-value rows.
        const now = Date.now();
        const active = (data || []).filter(r => r.banned_at || (r.muted_until && new Date(r.muted_until).getTime() > now));

        if (active.length === 0) {
            container.innerHTML = `<div style="color:#888;padding:20px;text-align:center;">No active mutes or bans.</div>`;
            if (status) status.textContent = '';
            return;
        }
        container.innerHTML = active.map(r => {
            const state = r.banned_at ? 'BANNED' : 'MUTED until ' + new Date(r.muted_until).toLocaleString();
            const who = r.factions?.faction_name || r.faction_id.slice(0, 8);
            const where = r.group_chats?.name || r.chat_id.slice(0, 8);
            return `<div style="background:#1f1f1c;border:1px solid #333;border-radius:4px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">
                <div>
                    <strong style="color:#e0dbc8;">${escapeHtml(who)}</strong>
                    <span style="color:#888;"> in </span>
                    <strong style="color:#c8a64e;">${escapeHtml(where)}</strong>
                    <div style="color:#888;font-size:0.75rem;margin-top:2px;">${state}</div>
                </div>
                <button class="btn btn-secondary" style="padding:4px 10px;font-size:0.75rem;" onclick="modUnmute('${escapeAttr(r.chat_id)}','${escapeAttr(r.faction_id)}')">Clear</button>
            </div>`;
        }).join('');
        if (status) status.textContent = `${active.length} active restriction${active.length === 1 ? '' : 's'}.`;
    } catch (err) {
        console.error('[Mod] muted/banned load failed:', err);
        container.innerHTML = `<div style="color:#d9534f;padding:20px;">Failed to load: ${err.message || err}</div>`;
    }
}

function renderModManualActions() {
    const container = document.getElementById('mod-content');
    const status = document.getElementById('mod-status');
    if (status) status.textContent = '';
    container.innerHTML = `
        <div style="background:#1f1f1c;border:1px solid #333;border-radius:4px;padding:14px;margin-bottom:12px;">
            <h3 style="margin-top:0;">Pin / Unpin a message</h3>
            <p style="color:#888;font-size:0.85rem;">Max 3 pinned messages per channel (enforced by trigger). Paste a message id.</p>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <input type="text" id="mod-pin-msg-id" placeholder="message uuid" style="flex:1;min-width:240px;padding:6px 8px;background:#111;border:1px solid #333;color:#e0dbc8;border-radius:3px;">
                <button class="btn btn-secondary" onclick="modPinMessage(true)" style="padding:6px 14px;">Pin</button>
                <button class="btn btn-secondary" onclick="modPinMessage(false)" style="padding:6px 14px;">Unpin</button>
            </div>
            <div id="mod-pin-result" style="margin-top:8px;font-size:0.8rem;color:#888;"></div>
        </div>
        <div style="background:#1f1f1c;border:1px solid #333;border-radius:4px;padding:14px;">
            <h3 style="margin-top:0;">Look up a faction by name</h3>
            <p style="color:#888;font-size:0.85rem;">Finds a faction id for use in the pin / mute / ban forms.</p>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <input type="text" id="mod-faction-search" placeholder="faction name" style="flex:1;min-width:240px;padding:6px 8px;background:#111;border:1px solid #333;color:#e0dbc8;border-radius:3px;">
                <button class="btn btn-secondary" onclick="modFactionLookup()" style="padding:6px 14px;">Search</button>
            </div>
            <div id="mod-faction-results" style="margin-top:10px;font-size:0.85rem;"></div>
        </div>
    `;
}

async function modPinMessage(pinOn) {
    const idEl = document.getElementById('mod-pin-msg-id');
    const resultEl = document.getElementById('mod-pin-result');
    const msgId = idEl?.value?.trim();
    if (!msgId) { resultEl.textContent = 'Enter a message id.'; return; }
    try {
        const { data, error } = await _supabase.from('group_chat_messages')
            .update({ pinned_at: pinOn ? new Date().toISOString() : null })
            .eq('id', msgId)
            .select('id');
        if (error) throw error;
        if (!data || data.length === 0) {
            resultEl.style.color = '#d9534f';
            resultEl.textContent = 'No message with that id in group_chat_messages.';
            return;
        }
        resultEl.style.color = '#8fd48f';
        resultEl.textContent = pinOn ? 'Pinned.' : 'Unpinned.';
    } catch (err) {
        resultEl.style.color = '#d9534f';
        resultEl.textContent = 'Failed: ' + (err.message || err);
    }
}
window.modPinMessage = modPinMessage;

async function modFactionLookup() {
    const q = document.getElementById('mod-faction-search')?.value?.trim();
    const resultsEl = document.getElementById('mod-faction-results');
    if (!q) { resultsEl.textContent = 'Enter a name.'; return; }
    try {
        const { data, error } = await _supabase
            .from('factions')
            .select('id, faction_name, abbreviation, faction_type, nation_id, nations(name)')
            .ilike('faction_name', `%${q}%`)
            .limit(20);
        if (error) throw error;
        if (!data || data.length === 0) { resultsEl.textContent = 'No matches.'; return; }
        resultsEl.innerHTML = data.map(f => `
            <div style="padding:6px 8px;border-bottom:1px solid #2a2a27;display:flex;gap:8px;align-items:center;justify-content:space-between;">
                <div>
                    <strong>${escapeHtml(f.faction_name || '?')}</strong>
                    <span style="color:#888;font-size:0.75rem;"> ${escapeHtml(f.abbreviation || '')} &middot; ${escapeHtml(f.faction_type || '')} &middot; ${escapeHtml(f.nations?.name || '—')}</span>
                </div>
                <code style="font-size:0.75rem;color:#c8a64e;">${f.id}</code>
            </div>
        `).join('');
    } catch (err) {
        resultsEl.style.color = '#d9534f';
        resultsEl.textContent = 'Search failed: ' + (err.message || err);
    }
}
window.modFactionLookup = modFactionLookup;

// Auto-load reports whenever the Moderation tab is opened.
var _prevShowTabMod = showTab;
showTab = function(tabName) {
    _prevShowTabMod(tabName);
    if (tabName === 'moderation') showModView(_modView || 'reports');
};
window.showTab = showTab;

</script>
