    for (var k in catCounts) {
        h += '<div style="display:flex;justify-content:space-between;font-size:0.78rem;margin-bottom:2px;">';
        h += '<span style="color:' + (SC_CAT_COLORS[k] || '#888') + ';">' + (SC_CAT_LABELS[k] || k) + '</span>';
        h += '<span style="color:#e0e0e0;font-weight:bold;">' + catCounts[k] + '</span></div>';
    }
    h += '</div>';

    document.getElementById('sc-overview').innerHTML = h;
}

// ── Connection list ──
function renderScConnections() {
    var filterCat = document.getElementById('sc-filter-cat').value;
    var filterStat = document.getElementById('sc-filter-stat').value;
    var filtered = scConnections.filter(function(c) {
        if (filterCat !== 'all' && c.category !== filterCat) return false;
        if (filterStat && c.source_stat !== filterStat && c.target_stat !== filterStat) return false;
        return true;
    });
    document.getElementById('sc-tab-count').textContent = scConnections.length;
    document.getElementById('sc-filter-info').textContent = 'Showing ' + filtered.length + ' of ' + scConnections.length;

    var optionsHtml = buildStatOptionGroups();
    var h = '';
    for (var i = 0; i < filtered.length; i++) {
        h += renderScCard(filtered[i], optionsHtml);
    }
    if (filtered.length === 0) {
        h = '<div class="sc-empty">No connections match current filters.</div>';
    }
    document.getElementById('sc-connection-list').innerHTML = h;
}

function renderScCard(conn, optionsHtml) {
    var id = conn.id;
    var isInverse = conn.target_dir === 'down';
    var srcColor = SC_CAT_COLORS[conn.category] || '#facc15';
    var tgtColor = isInverse ? '#ef4444' : '#22c55e';
    var dirArrow = conn.target_dir === 'up' ? '&#9650;' : '&#9660;';
    var dirClass = conn.target_dir === 'up' ? 'sc-dir-up' : 'sc-dir-down';
    var condClass = conn.source_dir === 'above' ? 'sc-cond-above' : 'sc-cond-below';

    var h = '<div class="sc-card ' + (conn.enabled ? '' : 'disabled ') + 'cat-' + escSc(conn.category) + '" data-id="' + escSc(id) + '">';

    // Sentence
    h += '<div class="sc-sentence">';
    h += '<span class="sc-muted">When </span>';
    h += '<span class="sc-src" style="color:' + srcColor + ';">' + (conn.source_stat ? escSc(formatStatName(conn.source_stat)) : '___') + '</span>';
    h += '<span class="sc-muted"> is </span>';
    h += '<span class="sc-cond ' + condClass + '">' + escSc(conn.source_dir) + ' ' + conn.threshold + '</span>';
    h += '<span class="sc-muted"> then </span>';
    h += '<span class="sc-tgt" style="color:' + tgtColor + ';">' + (conn.target_stat ? escSc(formatStatName(conn.target_stat)) : '___') + '</span>';
    h += '<span class="sc-muted"> moves </span>';
    h += '<span class="' + dirClass + '">' + dirArrow + ' ' + escSc(conn.target_dir) + '</span>';
    h += '<span class="sc-muted"> by </span>';
    h += '<span class="sc-mag">' + conn.magnitude + '</span>';
    h += '<span class="sc-muted">/tick</span>';
    if (conn.delay_ticks > 0) {
        h += '<span class="sc-muted"> after </span>';
        h += '<span class="sc-delay">' + conn.delay_ticks + ' ticks</span>';
    }
    h += '</div>';

    // Editable fields
    h += '<div class="sc-fields">';
    h += scSelectField('SOURCE STAT', 'source_stat', id, conn.source_stat, optionsHtml, 180);
    h += scSimpleSelect('CONDITION', 'source_dir', id, conn.source_dir, [['above','is above'],['below','is below']], 100);
    h += scNumberField('THRESHOLD', 'threshold', id, conn.threshold, 0, 100, 1, 65);
    h += '<div class="sc-field-arrow">&rarr;</div>';
    h += scSelectField('TARGET STAT', 'target_stat', id, conn.target_stat, optionsHtml, 180);
    h += scSimpleSelect('DIRECTION', 'target_dir', id, conn.target_dir, [['up','&#9650; Increases'],['down','&#9660; Decreases']], 110);
    h += scNumberField('MAGNITUDE', 'magnitude', id, conn.magnitude, 0.01, 2, 0.05, 65);
    h += '</div>';

    // Bottom row
    h += '<div class="sc-bottom">';
    h += '<div class="sc-bottom-left">';
    h += scSimpleSelect('DELAY', 'delay_ticks', id, conn.delay_ticks,
        SC_DELAY_OPTIONS.map(function(d) { return [d.value, d.label + ' (' + d.desc + ')']; }), 160);
    h += '<div class="sc-field"><label>DAMPENING</label>';
    h += '<button class="sc-toggle ' + (conn.dampening ? 'on' : '') + '" onclick="toggleScField(\'' + id + '\',\'dampening\')">' + (conn.dampening ? 'ENABLED' : 'DISABLED') + '</button></div>';
    h += scSimpleSelect('CATEGORY', 'category', id, conn.category,
        Object.entries(SC_CAT_LABELS).map(function(e) { return [e[0], e[1]]; }), 140);
    h += '<div class="sc-field"><label>ACTIVE</label>';
    h += '<button class="sc-toggle ' + (conn.enabled ? 'on' : '') + '" onclick="toggleScField(\'' + id + '\',\'enabled\')">' + (conn.enabled ? 'ON' : 'OFF') + '</button></div>';
    h += '</div>';
    h += '<div class="sc-bottom-right">';
    h += '<button class="sc-btn-dup" onclick="duplicateScConnection(\'' + id + '\')">DUPLICATE</button>';
    h += '<button class="sc-btn-del" onclick="deleteScConnection(\'' + id + '\')">DELETE</button>';
    h += '</div>';
    h += '</div>';

    h += '</div>';
    return h;
}

function scSelectField(label, field, id, val, optionsHtml, w) {
    return '<div class="sc-field" style="width:' + w + 'px;">' +
        '<label>' + label + '</label>' +
        '<select onchange="updateScField(\'' + id + '\',\'' + field + '\',this.value)" style="width:100%;">' +
        optionsHtml.replace('value="' + escSc(val) + '"', 'value="' + escSc(val) + '" selected') +
        '</select></div>';
}

function scSimpleSelect(label, field, id, val, options, w) {
    var h = '<div class="sc-field" style="width:' + w + 'px;"><label>' + label + '</label><select onchange="updateScField(\'' + id + '\',\'' + field + '\',this.value)" style="width:100%;">';
    for (var i = 0; i < options.length; i++) {
        var ov = options[i][0], ol = options[i][1];
        h += '<option value="' + escSc(ov) + '"' + (String(val) === String(ov) ? ' selected' : '') + '>' + ol + '</option>';
    }
    h += '</select></div>';
    return h;
}

function scNumberField(label, field, id, val, min, max, step, w) {
    return '<div class="sc-field"><label>' + label + '</label>' +
        '<input type="number" value="' + val + '" min="' + min + '" max="' + max + '" step="' + step + '"' +
        ' style="width:' + w + 'px;" onchange="updateScField(\'' + id + '\',\'' + field + '\',parseFloat(this.value)||0)">' +
        '</div>';
}

// ── CRUD operations ──
var _scSaveTimer = null;
function scheduleScSave(conn) {
    // Debounce: save 500ms after last edit
    clearTimeout(_scSaveTimer);
    _scSaveTimer = setTimeout(function() { saveScConnection(conn); }, 500);
}

async function saveScConnection(conn) {
    var payload = {
        source_stat: conn.source_stat,
        source_dir: conn.source_dir,
        threshold: conn.threshold,
        target_stat: conn.target_stat,
        target_dir: conn.target_dir,
        magnitude: conn.magnitude,
        delay_ticks: conn.delay_ticks,
        dampening: conn.dampening,
        category: conn.category,
        enabled: conn.enabled,
        updated_at: new Date().toISOString()
    };

    if (conn._isNew) {
        var { data, error } = await _supabase.from('stat_connections').insert(payload).select().single();
        if (error) { console.error('Failed to insert stat connection:', error); return; }
        // Replace temp id with real id
        var idx = scConnections.findIndex(function(c) { return c.id === conn.id; });
        if (idx >= 0) {
            scConnections[idx] = data;
        }
    } else {
        var { error } = await _supabase.from('stat_connections').update(payload).eq('id', conn.id);
        if (error) { console.error('Failed to update stat connection:', error); return; }
    }
    renderScOverview();
}

function getScConn(id) {
    return scConnections.find(function(c) { return c.id === id; });
}

function updateScField(id, field, value) {
    var conn = getScConn(id);
    if (!conn) return;
    if (field === 'delay_ticks' || field === 'threshold') value = parseFloat(value) || 0;
    if (field === 'magnitude') value = parseFloat(value) || 0.1;
    conn[field] = value;
    scheduleScSave(conn);
    renderScConnections();
}

function toggleScField(id, field) {
    var conn = getScConn(id);
    if (!conn) return;
    conn[field] = !conn[field];
    scheduleScSave(conn);
    renderScConnections();
}

async function addScConnection() {
    var tempId = '_temp_' + (scNextTempId++);
    var conn = {
        id: tempId,
        source_stat: '',
        source_dir: 'above',
        threshold: 20,
        target_stat: '',
        target_dir: 'up',
        magnitude: 0.1,
        delay_ticks: 0,
        dampening: true,
        category: 'economic',
        enabled: false,
        _isNew: true
    };
    scConnections.push(conn);
    await saveScConnection(conn);
    renderScOverview();
    renderScConnections();
    // Scroll to bottom
    var list = document.getElementById('sc-connection-list');
    list.lastElementChild && list.lastElementChild.scrollIntoView({ behavior: 'smooth' });
}

async function duplicateScConnection(id) {
    var orig = getScConn(id);
    if (!orig) return;
    var tempId = '_temp_' + (scNextTempId++);
    var conn = {
        id: tempId,
        source_stat: orig.source_stat,
        source_dir: orig.source_dir,
        threshold: orig.threshold,
        target_stat: orig.target_stat,
        target_dir: orig.target_dir,
        magnitude: orig.magnitude,
        delay_ticks: orig.delay_ticks,
        dampening: orig.dampening,
        category: orig.category,
        enabled: false,
        _isNew: true
    };
    scConnections.push(conn);
    await saveScConnection(conn);
    renderScOverview();
    renderScConnections();
}

async function deleteScConnection(id) {
    if (!confirm('Delete this connection?')) return;
    var conn = getScConn(id);
    if (conn && !conn._isNew) {
        var { error } = await _supabase.from('stat_connections').delete().eq('id', id);
        if (error) { console.error('Failed to delete stat connection:', error); return; }
    }
    scConnections = scConnections.filter(function(c) { return c.id !== id; });
    renderScOverview();
    renderScConnections();
}

// ── Cascade map ──
function renderScCascade() {
    var enabled = scConnections.filter(function(c) { return c.enabled; });
    var statsMap = {};
    for (var i = 0; i < SC_ALL_STATS.length; i++) {
        var s = SC_ALL_STATS[i];
        var outgoing = enabled.filter(function(c) { return c.source_stat === s; });
        var incoming = enabled.filter(function(c) { return c.target_stat === s; });
        if (outgoing.length + incoming.length > 0) {
            statsMap[s] = { name: s, outgoing: outgoing, incoming: incoming, total: outgoing.length + incoming.length };
        }
    }

    var sorted = Object.values(statsMap).sort(function(a, b) { return b.total - a.total; }).slice(0, 12);
    if (sorted.length === 0) {
        document.getElementById('sc-cascade-body').innerHTML = '<div class="sc-empty">No enabled connections to visualize.</div>';
        return;
    }

    var maxTotal = sorted[0].total;
    var h = '<div style="font-size:0.7rem;color:#666;text-transform:uppercase;letter-spacing:1px;font-weight:bold;margin-bottom:14px;">CASCADE MAP — Most Connected Stats</div>';
    h += '<div class="sc-cascade-grid">';
    for (var i = 0; i < sorted.length; i++) {
        var s = sorted[i];
        var intensity = s.total / maxTotal;
        var bg = 'rgba(250,204,21,' + (0.02 + intensity * 0.06).toFixed(3) + ')';
        var border = 'rgba(250,204,21,' + (0.05 + intensity * 0.12).toFixed(3) + ')';
        h += '<div class="sc-cascade-card" style="background:' + bg + ';border-color:' + border + ';">';
        h += '<div class="sc-cascade-name">' + escSc(formatStatName(s.name)) + '</div>';
        h += '<div class="sc-cascade-counts">';
        h += '<div><span class="sc-cascade-count-label">OUT </span><span class="sc-cascade-count-val sc-cascade-out">' + s.outgoing.length + '</span></div>';
        h += '<div><span class="sc-cascade-count-label">IN </span><span class="sc-cascade-count-val sc-cascade-in">' + s.incoming.length + '</span></div>';
        h += '</div>';
        for (var j = 0; j < Math.min(s.outgoing.length, 3); j++) {
            var c = s.outgoing[j];
            h += '<div class="sc-cascade-link">&rarr; ' + escSc(formatStatName(c.target_stat)) +
                ' <span style="color:' + (c.target_dir === 'up' ? '#22c55e' : '#ef4444') + ';">' +
                (c.target_dir === 'up' ? '&#9650;' : '&#9660;') + c.magnitude + '</span></div>';
        }
        for (var j = 0; j < Math.min(s.incoming.length, 2); j++) {
            var c = s.incoming[j];
            h += '<div class="sc-cascade-link">&larr; ' + escSc(formatStatName(c.source_stat)) +
                ' <span style="color:' + (c.target_dir === 'up' ? '#22c55e' : '#ef4444') + ';">' +
                (c.target_dir === 'up' ? '&#9650;' : '&#9660;') + c.magnitude + '</span></div>';
        }
        h += '</div>';
    }
    h += '</div>';
    document.getElementById('sc-cascade-body').innerHTML = h;
}

// ── Loop detector ──
function renderScSafety() {
    var enabled = scConnections.filter(function(c) { return c.enabled; });

    // 2-hop loop detection
    var loops = [];
    for (var i = 0; i < enabled.length; i++) {
        for (var j = i + 1; j < enabled.length; j++) {
            var a = enabled[i], b = enabled[j];
            if (a.target_stat === b.source_stat && b.target_stat === a.source_stat) {
                loops.push({ a: a, b: b });
            }
        }
    }

    var h = '';
    if (loops.length === 0) {
        h += '<div class="sc-loop-ok">&#10003; No feedback loops detected in current connections.</div>';
    } else {
        h += '<div class="sc-loop-warn">';
        h += '<div class="sc-loop-title">&#9888; FEEDBACK LOOPS DETECTED — ' + loops.length + ' loop' + (loops.length > 1 ? 's' : '') + '</div>';
        for (var i = 0; i < loops.length; i++) {
            var lp = loops[i];
            var reinforcing = (lp.a.target_dir === lp.b.target_dir);
            h += '<div class="sc-loop-item">';
            h += '<span class="sc-loop-label">' + escSc(formatStatName(lp.a.source_stat)) + '</span>';
            h += '<span class="sc-loop-arrow"> ' + (lp.a.target_dir === 'up' ? '&#9650;' : '&#9660;') + ' &rarr; </span>';
            h += '<span class="sc-loop-label">' + escSc(formatStatName(lp.a.target_stat)) + '</span>';
            h += '<span class="sc-loop-arrow"> ' + (lp.b.target_dir === 'up' ? '&#9650;' : '&#9660;') + ' &rarr; </span>';
            h += '<span class="sc-loop-label">' + escSc(formatStatName(lp.b.target_stat)) + '</span>';
            h += '<span class="sc-loop-cycle">&#8635; CYCLE</span>';
            if (reinforcing) {
                h += '<div class="sc-loop-reinforcing">&#9888; REINFORCING — this loop will spiral. Ensure dampening is on for both connections.</div>';
            } else {
                h += '<div class="sc-loop-balancing">&#10003; BALANCING — this loop is self-correcting. Generally safe.</div>';
            }
            h += '</div>';
        }
        h += '<div class="sc-loop-hint">Reinforcing loops cause death spirals or runaway growth. Enable dampening and use delays to slow them. Balancing loops are natural and self-stabilizing.</div>';
        h += '</div>';
    }

    // Dampening explainer
    h += '<div class="sc-explainer">';
    h += '<div class="sc-explainer-title">HOW DAMPENING WORKS</div>';
    h += '<div class="sc-explainer-body">';
    h += '<div class="em">Without dampening:</div>';
    h += '<div>actual_change = magnitude</div>';
    h += '<div class="dim">Same effect regardless of current value. Causes runaway spirals.</div>';
    h += '<div class="em">With dampening (stat moving UP):</div>';
    h += '<div>actual_change = magnitude &times; (1 - current_value / 100)</div>';
    h += '<div class="dim">Effect weakens as stat approaches 100. Crime at 10 &rarr; strong push. Crime at 80 &rarr; weak push.</div>';
    h += '<div class="em">With dampening (stat moving DOWN):</div>';
    h += '<div>actual_change = magnitude &times; (current_value / 100)</div>';
    h += '<div class="dim">Effect weakens as stat approaches 0. Can\'t drain what\'s already empty.</div>';
    h += '</div></div>';

    // Delay explainer
    h += '<div class="sc-explainer">';
    h += '<div class="sc-explainer-title">DELAY TIERS</div>';
    h += '<div class="sc-delay-grid">';
    for (var i = 0; i < SC_DELAY_OPTIONS.length; i++) {
        var d = SC_DELAY_OPTIONS[i];
        h += '<div class="sc-delay-card">';
        h += '<div class="sc-delay-name">' + escSc(d.label) + '</div>';
        h += '<div class="sc-delay-ticks">' + escSc(d.desc) + '</div>';
        h += '<div class="sc-delay-desc">' + escSc(d.detail) + '</div>';
        h += '</div>';
    }
    h += '</div></div>';

    document.getElementById('sc-safety-body').innerHTML = h;
}

async function initStatAudit() {

    const sSel = document.getElementById('sa-stat-select');

if (document.getElementById('sa-nation-select')) initStatAudit();
else document.addEventListener('admin-panel-loaded', initStatAudit);

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

async function runStatAudit() {
    const nationId = document.getElementById('sa-nation-select').value;
    const sk = document.getElementById('sa-stat-select').value;
    const out = document.getElementById('sa-results');
    if (!nationId || !sk) { out.textContent = 'Select a nation and stat.'; return; }
    out.innerHTML = '<span style="color:#888;">Running audit...</span>';

    const lines = [];
    const log = (s, color) => lines.push(color ? `<span style="color:${color}">${esc(s)}</span>` : esc(s));
    const heading = (s) => lines.push(`\n<span style="color:#0af;font-weight:bold;font-size:1rem;">${esc(s)}</span>`);

    // 1. Nation + shard
    const [{ data: shard }, { data: nation }] = await Promise.all([
        _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single(),
        _supabase.from('nations').select('*').eq('id', nationId).single()
    ]);
    const tick = shard?.current_tick || 0;

    heading(`STAT DELTA AUDIT: ${formatStatName(sk)}`);
    log(`Nation: ${nation.name} | Tick: ${tick} | Current value: ${nation[sk]}`);

    // 2. History
    heading('HISTORY (last 5 ticks)');
    const { data: hist } = await _supabase.from('nations_history')
        .select(sk + ', tick').eq('nation_id', nationId)
        .lte('tick', tick).order('tick', { ascending: false }).limit(5);
    if (hist?.length) {
        for (const h of hist) log(`  tick ${h.tick}: ${h[sk]}`);
        const prev = hist.find(h => h.tick < tick);
        if (prev) {
            const d = (Number(nation[sk]) - Number(prev[sk])).toFixed(1);
            log(`  Delta (tick ${prev.tick} → now): ${d > 0 ? '+' : ''}${d}`, d < 0 ? '#f44' : d > 0 ? '#4f4' : '#888');
        }
    } else {
        log('  No history rows found.', '#888');
    }

    // 3. Active laws
    heading('ACTIVE LAWS');
    // Phase 5-fix: trimmed select to columns that exist in the live
    // schema (target_stat / stat_direction / stat_change_per_tick /
    // duration_months were dropped during the Phase 2.5 saga). Embedded
    // selected_option so the per-stat audit reflects the active option
    // for multi-option laws.
    const { data: laws } = await _supabase.from('active_laws')
        .select('id, bill_id, is_reversal, passed_tick, effects_applied_through_tick, reversal_effects, policies(policy_name), selected_option:policy_options!selected_option_id(option_name, stat_effects, is_target_based, stat_targets)')
        .eq('nation_id', nationId);
    const hitLaws = (laws || []).filter(l => {
        const p = l.policies;
        if (!p) return false;
        // Phase 5-fix: prefer the active option's stat_effects for
        // multi-option laws; the legacy target_stat path is gone with
        // the trimmed schema.
        // Phase 5-fix: policies.stat_effects column is gone from the live
        // schema, so multi-option laws read effects from the option only.
        const effects = (Array.isArray(l.selected_option?.stat_effects) && l.selected_option.stat_effects.length > 0)
            ? l.selected_option.stat_effects
            : null;
        if (effects?.some(e => normalizeNationStatKey(e.stat_key) === sk)) return true;
        if (l.is_reversal && l.reversal_effects?.some(e => normalizeNationStatKey(e.stat_key) === sk)) return true;
        return false;
    });
    if (hitLaws.length === 0) {
        log('  None affecting this stat.', '#888');
    }
    for (const l of hitLaws) {
        const p = l.policies;
        const effs = l.is_reversal ? (l.reversal_effects || []) : (p.stat_effects || []);
        const relevant = effs.filter(e => normalizeNationStatKey(e.stat_key) === sk);
        for (const e of relevant) {
            const ticksSince = tick - (l.passed_tick || 0);
            const delay = Number(e.delay_ticks) || 0;
            const dur = Number(e.duration_ticks) || 12;
            const active = ticksSince > delay && ticksSince <= delay + dur;
            const rate = Number(e.rate) || 1;
            const perTick = e.direction === 'down' ? -rate : +rate;
            const reversalTag = l.is_reversal ? ' (REVERSAL — unwinding repealed law)' : '';
            log(`  ${active ? '[ACTIVE]' : '[dormant]'}${l.is_reversal ? '[REVERSAL]' : ''} "${p.policy_name}" | ${e.direction} ${rate}/tick | delay=${delay} dur=${dur} | ticksSince=${ticksSince} | lastApplied=${l.effects_applied_through_tick}${reversalTag}`,
                active ? (perTick < 0 ? '#f44' : '#4f4') : '#666');
        }
        // Legacy single-stat format
        if (relevant.length === 0 && normalizeNationStatKey(p.target_stat) === sk) {
            log(`  [legacy] "${p.policy_name}" | ${p.stat_direction} ${p.stat_change_per_tick}/tick dur=${p.duration_months}`, '#fa0');
        }
    }

    // 4. Stat connections
    // 3b. Target-based policies — the modern model the convergence engine uses
    //     (one source: policies.js targetEquilibrium/convergeStat).
    heading('TARGET-BASED POLICIES');
    let tbDelta = 0;
    const tbContribs = [];
    for (const l of (laws || [])) {
        const opt = l.selected_option;
        if (!opt || !opt.is_target_based || !Array.isArray(opt.stat_targets)) continue;
        for (const t of opt.stat_targets) {
            if (normalizeNationStatKey(t?.stat_key) !== sk || !isTargetBasedStat(sk)) continue;
            const target = Number(t.target), pull = Number(t.pull);
            if (!Number.isFinite(target) || !Number.isFinite(pull) || pull <= 0) continue;
            tbContribs.push({ target, pull,
                label: (l.policies?.policy_name || 'Policy') + (opt.option_name ? ' — ' + opt.option_name : '') });
        }
    }
    if (tbContribs.length === 0) {
        log('  None pulling this stat.', '#888');
    } else {
        for (const c of tbContribs) log(`  ${c.label} → target ${c.target} (pull ${c.pull})`);
        const cur = Number(nation[sk] ?? 50);
        const eq = targetEquilibrium(sk, tbContribs);
        tbDelta = convergeStat(cur, eq, sk) - cur;
        log(`  Aggregate equilibrium: ${eq == null ? '—' : Math.round(eq * 100) / 100} | current ${cur} | convergence this tick: ${tbDelta > 0 ? '+' : ''}${tbDelta}`);
    }

    heading('STAT CONNECTIONS');
    const { data: conns } = await _supabase.from('stat_connections')
        .select('*').eq('enabled', true).eq('target_stat', sk);
    if (!conns?.length) {
        log('  No connections targeting this stat.', '#888');
    }
    for (const c of (conns || [])) {
        const sourceVal = Number(nation[c.source_stat] ?? 50);
        const triggered = c.source_dir === 'above' ? sourceVal > c.threshold : sourceVal < c.threshold;
        let effMag = Number(c.magnitude);
        if (triggered && c.dampening) {
            const tv = Number(nation[sk] ?? 50);
            effMag = c.target_dir === 'up' ? c.magnitude * (1 - tv / 100) : c.magnitude * (tv / 100);
        }
        const perTick = triggered ? (c.target_dir === 'down' ? -effMag : +effMag) : 0;
        log(`  ${triggered ? '[TRIGGERED]' : '[inactive]'} ${c.source_stat} ${c.source_dir} ${c.threshold} (now: ${sourceVal}) → ${c.target_dir} mag=${c.magnitude}${c.dampening ? ` (eff: ${effMag.toFixed(2)})` : ''} | dampening=${c.dampening}`,
            triggered ? (perTick < 0 ? '#f44' : '#4f4') : '#666');
    }

    // Also check connections where this stat is the SOURCE (for context)
    const { data: srcConns } = await _supabase.from('stat_connections')
        .select('*').eq('enabled', true).eq('source_stat', sk);
    if (srcConns?.length) {
        log('');
        log(`  (This stat is also a SOURCE for ${srcConns.length} connection(s):)`, '#888');
        for (const c of srcConns) {
            const sv = Number(nation[sk] ?? 50);
            const triggered = c.source_dir === 'above' ? sv > c.threshold : sv < c.threshold;
            log(`    ${triggered ? '[TRIGGERED]' : '[inactive]'} → ${c.target_stat} ${c.target_dir} mag=${c.magnitude} when ${sk} ${c.source_dir} ${c.threshold}`, '#888');
        }
    }

    // Crisis sunset (Phase 3): the ACTIVE CRISES section (active_crises
    // + crisis_templates + crisis_effects join) is removed. Stat impact
    // from modifiers should land here when the modifier diagnostic
    // surface lands.

    // 6. Ministry actions
    heading('MINISTRY ACTIONS (unprocessed)');
    const { data: mActions } = await _supabase.from('ministry_action_log')
        .select('action_key, stat_effects, effects_applied_through_tick, applied_at_tick')
        .eq('nation_id', nationId).eq('processed', false);
    const hitMA = (mActions || []).filter(a =>
        a.stat_effects?.some(e => normalizeNationStatKey(e.stat_key) === sk)
    );
    if (hitMA.length === 0) {
        log('  None.', '#888');
    }
    for (const a of hitMA) {
        const effs = a.stat_effects.filter(e => normalizeNationStatKey(e.stat_key) === sk);
        for (const e of effs) {
            log(`  "${a.action_key}" | ${e.direction} ${e.rate}/tick | applied tick ${a.applied_at_tick} lastApplied=${a.effects_applied_through_tick}`, '#fa0');
        }
    }

    // 7. Decay config
    heading('NATURAL DECAY');
    const dc = STAT_DECAY_CONFIG[sk];
    if (dc) {
        const cv = Number(nation[sk] ?? 50);
        const delta = cv === dc.target ? 0 : (cv > dc.target ? -dc.speed : dc.speed);
        log(`  type=${dc.type} | target=${dc.target} | speed=${dc.speed}/tick | current=${cv} | decay this tick: ${delta > 0 ? '+' : ''}${delta}`);
    } else {
        log('  No decay config — stat holds value indefinitely.', '#888');
    }

    // 8. Institution funding section was removed when institutions were
    //    dropped (sql/migrations/20261004_drop_institutions.sql). Stat
    //    decay no longer has an institution-shield modifier; only the
    //    natural rate above applies, plus any policy floor/ceiling.

    // Summary
    heading('TOTAL ESTIMATED PER-TICK IMPACT');
    let total = 0;
    // Decay
    if (dc) {
        const cv = Number(nation[sk] ?? 50);
        if (cv !== dc.target) total += cv > dc.target ? -dc.speed : dc.speed;
    }
    // Active laws
    for (const l of hitLaws) {
        const p = l.policies;
        const effs = l.is_reversal ? (l.reversal_effects || []) : (p.stat_effects || []);
        for (const e of effs.filter(e => normalizeNationStatKey(e.stat_key) === sk)) {
            const ticksSince = tick - (l.passed_tick || 0);
            const delay = Number(e.delay_ticks) || 0;
            const dur = Number(e.duration_ticks) || 12;
            if (ticksSince > delay && ticksSince <= delay + dur) {
                total += e.direction === 'down' ? -(Number(e.rate) || 1) : (Number(e.rate) || 1);
            }
        }
    }
    // Stat connections (triggered)
    for (const c of (conns || [])) {
        const sourceVal = Number(nation[c.source_stat] ?? 50);
        const triggered = c.source_dir === 'above' ? sourceVal > c.threshold : sourceVal < c.threshold;
        if (!triggered) continue;
        let effMag = Number(c.magnitude);
        if (c.dampening) {
            const tv = Number(nation[sk] ?? 50);
            effMag = c.target_dir === 'up' ? c.magnitude * (1 - tv / 100) : c.magnitude * (tv / 100);
        }
        total += c.target_dir === 'down' ? -effMag : +effMag;
    }
    // Crisis sunset (Phase 3): crisis contribution to per-tick impact
    // removed (active_crises read is gone above).
    // Target-based policy convergence (the modern model)
    total += tbDelta;
    total = Math.round(total * 100) / 100;
    log(`  Estimated net change: ${total > 0 ? '+' : ''}${total} per tick`, total < 0 ? '#f44' : total > 0 ? '#4f4' : '#888');
    log(`  (Does not include unprocessed ministry actions or leader trait effects)`, '#666');

    out.innerHTML = lines.join('\n');
    document.getElementById('sa-revise-section').style.display = 'block';
    document.getElementById('sa-revise-value').value = '';
    document.getElementById('sa-revise-result').textContent = '';
}

}

let _integrityFingerprints = [];
let _integrityBans = [];
let _integrityFactions = [];

async function loadIntegrityData() {
    const status = document.getElementById('integrity-status');
    if (status) status.textContent = 'Loading...';
    try {
        const [fpRes, banRes, facRes] = await Promise.all([
            _supabase.from('player_fingerprints').select('*').order('last_seen_at', { ascending: false }),
            _supabase.from('player_bans').select('*').order('banned_at', { ascending: false }),
            _supabase.from('factions').select('id, faction_name, abbreviation, nation_id, nation, founded_tick, is_banned').order('founded_tick', { ascending: false })
        ]);
        if (fpRes.error) throw fpRes.error;
        _integrityFingerprints = fpRes.data || [];
        _integrityBans = banRes.data || [];
        _integrityFactions = facRes.data || [];
        if (status) status.textContent = `${_integrityFingerprints.length} fingerprint(s), ${_integrityBans.filter(b => b.is_active).length} active ban(s), ${_integrityFactions.length} player(s)`;
    } catch (e) {
        if (status) status.innerHTML = `<span style="color:#d9534f;">Error: ${e.message}</span><br><span style="color:#888;font-size:0.8rem;">Run the migration: sql/migrations/20260301_player_integrity.sql</span>`;
        _integrityFingerprints = [];
        _integrityBans = [];
        _integrityFactions = [];
    }
}

function showIntegrityView(view) {
    // Highlight active sub-tab button
    document.querySelectorAll('#tab-integrity .btn.int-btn').forEach(b => b.classList.remove('active'));
    const activeBtn = document.getElementById('int-btn-' + view);
    if (activeBtn) activeBtn.classList.add('active');

    loadIntegrityData().then(() => {
        const container = document.getElementById('integrity-content');
        if (!container) return;
        if (view === 'clusters') renderIntegrityClusters(container);
        else if (view === 'all') renderAllFingerprints(container);
        else if (view === 'bans') renderActiveBans(container);
        else if (view === 'timeline') renderCreationTimeline(container);
    }).catch(err => {
        console.error('Integrity view error:', err);
        const container = document.getElementById('integrity-content');
        if (container) container.innerHTML = `<div style="color:#d9534f;padding:20px;">Error loading integrity data: ${err.message}</div>`;
    });
}
window.showIntegrityView = showIntegrityView;

function renderIntegrityClusters(container) {
    if (_integrityFingerprints.length === 0) {
        container.innerHTML = '<div style="color:#888;padding:20px;text-align:center;">No fingerprint data yet. Players will be tracked as they log in after the migration is applied.</div>';
        return;
    }

    // Group by fingerprint
    const fpGroups = {};
    for (const fp of _integrityFingerprints) {
        if (!fpGroups[fp.fingerprint]) fpGroups[fp.fingerprint] = [];
        fpGroups[fp.fingerprint].push(fp);
    }

    // Find clusters (same fingerprint, multiple users)
    const suspicious = Object.entries(fpGroups)
        .filter(([_, group]) => {
            const uniqueUsers = new Set(group.map(g => g.user_id));
            return uniqueUsers.size > 1;
        })
        .sort((a, b) => b[1].length - a[1].length);

    if (suspicious.length === 0) {
        container.innerHTML = '<div style="color:#5cb85c;padding:20px;text-align:center;font-weight:bold;">No suspicious clusters detected. All fingerprints are unique per user.</div>';
        return;
    }

    let html = `<div style="color:#d48a3c;margin-bottom:16px;font-weight:bold;">${suspicious.length} suspicious cluster(s) found — multiple accounts sharing the same browser fingerprint</div>`;

    for (const [fpHash, group] of suspicious) {
        const uniqueUsers = [...new Set(group.map(g => g.user_id))];
        const nations = [...new Set(group.filter(g => g.nation_id).map(g => g.nation_id))];
        const sameNation = nations.length <= 1 && nations.length > 0;

        html += `
        <div style="border:1px solid ${sameNation ? '#d9534f' : '#d48a3c'};border-radius:6px;padding:16px;margin-bottom:12px;background:${sameNation ? 'rgba(255,68,68,0.08)' : 'rgba(255,152,0,0.06)'};">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                <div>
                    <span style="color:${sameNation ? '#d9534f' : '#d48a3c'};font-weight:bold;font-size:1rem;">${sameNation ? '🚨 HIGH RISK' : '⚠️ SUSPICIOUS'} — ${uniqueUsers.length} accounts</span>
                    ${sameNation ? '<span style="color:#d9534f;font-size:0.8rem;margin-left:8px;">(Same nation!)</span>' : ''}
                </div>
                <span style="color:#555;font-size:0.75rem;font-family:monospace;">FP: ${escHtml(fpHash.substring(0, 16))}...</span>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
                ${group.map(g => {
                    const faction = _integrityFactions.find(f => f.id === g.user_id);
                    const name = faction ? faction.faction_name : 'Unknown';
                    const nation = faction?.nation || '—';
                    const isBanned = faction?.is_banned;
                    return `<div style="background:#1a1a2e;border:1px solid #333;border-radius:4px;padding:8px 12px;font-size:0.8rem;">
                        <div style="font-weight:bold;color:${isBanned ? '#666' : '#e0e0e0'};">${escHtml(name)} ${isBanned ? '<span style="color:#d9534f;">[BANNED]</span>' : ''}</div>
                        <div style="color:#888;font-size:0.75rem;">Nation: ${escHtml(nation)}</div>
                        <div style="color:#666;font-size:0.7rem;">${escHtml(g.timezone || '?')} · ${escHtml(g.screen_sig || '?')} · ${escHtml(g.language || '?')}</div>
                        <div style="color:#555;font-size:0.7rem;">Sessions: ${g.session_count} · Last: ${new Date(g.last_seen_at).toLocaleDateString()}</div>
                        ${!isBanned ? `<button style="margin-top:6px;padding:3px 10px;background:#aa0000;color:#fff;border:none;border-radius:3px;font-size:0.7rem;cursor:pointer;" onclick="banPlayer('${g.user_id}', '${escHtml(name)}')">Ban</button>
                        <button style="margin-top:6px;margin-left:4px;padding:3px 10px;background:#886600;color:#fff;border:none;border-radius:3px;font-size:0.7rem;cursor:pointer;" onclick="suspendPlayer('${g.user_id}', '${escHtml(name)}')">Suspend</button>` : `<button style="margin-top:6px;padding:3px 10px;background:#2a6600;color:#fff;border:none;border-radius:3px;font-size:0.7rem;cursor:pointer;" onclick="unbanPlayer('${g.user_id}', '${escHtml(name)}')">Unban</button>`}
                    </div>`;
                }).join('')}
            </div>
        </div>`;
    }

    container.innerHTML = html;
}

    if (_integrityFingerprints.length === 0) {
        container.innerHTML = '<div style="color:#888;padding:20px;text-align:center;">No fingerprint data collected yet.</div>';

function renderCreationTimeline(container) {
    if (_integrityFactions.length === 0) {
        container.innerHTML = '<div style="color:#888;padding:20px;text-align:center;">No player data.</div>';
        return;
    }

    // Sort by founded_tick descending
    const sorted = [..._integrityFactions].sort((a, b) => (b.founded_tick || 0) - (a.founded_tick || 0));

    // Detect rapid creation bursts (3+ parties in same tick or within 2 ticks)
    const tickGroups = {};
    for (const f of sorted) {
        const tick = f.founded_tick || 0;
        if (!tickGroups[tick]) tickGroups[tick] = [];
        tickGroups[tick].push(f);
    }

    let html = '<div style="margin-bottom:16px;color:#888;">Party creation timeline — newest first. Bursts of rapid creation are highlighted.</div>';
    html += '<table style="width:100%;border-collapse:collapse;font-size:0.8rem;"><thead><tr style="border-bottom:2px solid #333;color:#888;text-align:left;">';
    html += '<th style="padding:8px;">Tick</th><th style="padding:8px;">Party</th><th style="padding:8px;">Nation</th><th style="padding:8px;">Status</th>';
    html += '</tr></thead><tbody>';

    for (const f of sorted) {
        const tick = f.founded_tick || 0;
        const burst = (tickGroups[tick] || []).length >= 3;
        const rowBg = burst ? 'rgba(255,152,0,0.12)' : 'transparent';

        html += `<tr style="border-bottom:1px solid #222;background:${rowBg};">
            <td style="padding:8px;color:#888;font-family:monospace;">${tick} ${burst ? '<span style="color:#d48a3c;font-weight:bold;">⚡ BURST</span>' : ''}</td>
            <td style="padding:8px;font-weight:bold;color:${f.is_banned ? '#666' : '#e0e0e0'};">${escHtml(f.faction_name || '?')} ${f.abbreviation ? '[' + escHtml(f.abbreviation) + ']' : ''} ${f.is_banned ? '<span style="color:#d9534f;font-size:0.7rem;">[BANNED]</span>' : ''}</td>
            <td style="padding:8px;color:#888;">${escHtml(f.nation || '—')}</td>
            <td style="padding:8px;color:${f.nation_id ? '#5cb85c' : '#d9534f'};">${f.nation_id ? 'Active' : 'No Nation'}</td>
        </tr>`;
    }

    html += '</tbody></table>';
    container.innerHTML = html;
}

async function banPlayer(userId, playerName) {
    const reason = prompt(`Ban "${playerName}" permanently?\n\nEnter reason:`);
    if (reason === null) return;
    try {
        await _supabase.from('player_bans').insert([{
            user_id: userId,
            ban_type: 'banned',
            reason: reason || 'Multi-account abuse',
            banned_by: 'admin'
        }]);
        await _supabase.from('factions').update({ is_banned: true }).eq('id', userId);
        alert(`${playerName} has been banned.`);
        showIntegrityView('clusters');
    } catch (e) { alert('Error: ' + e.message); }
}
window.banPlayer = banPlayer;

async function suspendPlayer(userId, playerName) {
    const days = prompt(`Suspend "${playerName}" for how many days?`, '7');
    if (days === null) return;
    const until = new Date();
    until.setDate(until.getDate() + parseInt(days, 10));
    const reason = prompt('Enter reason:', 'Suspected multi-account abuse');
    if (reason === null) return;
    try {
        await _supabase.from('player_bans').insert([{
            user_id: userId,
            ban_type: 'suspended',
            reason: reason,
            banned_until: until.toISOString(),
            banned_by: 'admin'
        }]);
        await _supabase.from('factions').update({ is_banned: true }).eq('id', userId);
        alert(`${playerName} suspended until ${until.toLocaleDateString()}.`);
        showIntegrityView('clusters');
    } catch (e) { alert('Error: ' + e.message); }
}
window.suspendPlayer = suspendPlayer;

async function unbanPlayer(userId, playerName) {
    if (!confirm(`Lift ban on "${playerName}"?`)) return;
    try {
        await _supabase.from('player_bans').update({
            is_active: false,
            lifted_at: new Date().toISOString(),
            lift_reason: 'Lifted by admin'
        }).eq('user_id', userId).eq('is_active', true);
        await _supabase.from('factions').update({ is_banned: false }).eq('id', userId);
        alert(`Ban lifted for ${playerName}.`);
        showIntegrityView('bans');
    } catch (e) { alert('Error: ' + e.message); }
}
window.unbanPlayer = unbanPlayer;

let _issueNations = [];
let _issueRelations = [];

async function initIssueSpawner() {
    console.log('[Issues Spawner] Initializing...');
    const container = document.getElementById('issue-spawner-panel');
    if (!container) { console.warn('[Issues Spawner] Container not found'); return; }

    // Load nations
    const { data: nats, error: natErr } = await _supabase.from('nations').select('id, name').order('name');
    if (natErr) console.error('[Issues Spawner] Nations load error:', natErr);
    _issueNations = nats || [];
    console.log('[Issues Spawner] Loaded', _issueNations.length, 'nations');

    // Load diplomatic relations (for border types + current tension info)
    const { data: rels, error: relErr } = await _supabase.from('diplomatic_relations')
        .select('nation_a_id, nation_b_id, border_types, relation_score, proximity');
    if (relErr) console.error('[Issues Spawner] Relations load error:', relErr);
    _issueRelations = rels || [];

    renderIssueSpawner();
    console.log('[Issues Spawner] Rendered.');
}

function getRelation(aId, bId) {
    const cA = aId < bId ? aId : bId;
    const cB = aId < bId ? bId : aId;
    return _issueRelations.find(r => r.nation_a_id === cA && r.nation_b_id === cB);
}

function renderModifierCheckboxes() {
    const container = document.getElementById('is-modifiers');
    if (!container) return;

    // Filter modifiers to only show those relevant to the selected issue type
    const typeKey = document.getElementById('is-issue-type')?.value || 'maritime_fishing_rights';
    const allowedKeys = ISSUE_MODIFIER_KEYS[typeKey];

    const groups = { structural: [], competitive: [], escalation: [] };
    for (const [key, mod] of Object.entries(ISSUE_SPAWNER_MODIFIERS)) {
        if (allowedKeys && !allowedKeys.has(key)) continue;
        groups[mod.category] = groups[mod.category] || [];
        groups[mod.category].push({ key, ...mod });
    }

    let html = '';
    for (const [cat, mods] of Object.entries(groups)) {
        const catColor = cat === 'structural' ? '#5bc0de' : cat === 'competitive' ? '#f0ad4e' : '#d9534f';
        html += `<div style="grid-column:1/-1;margin-top:8px;"><span style="color:${catColor};font-size:11px;font-weight:bold;text-transform:uppercase;">${cat}</span></div>`;
        for (const m of mods) {
            const chanceTag = m.spawn_chance != null ? ` <span style="color:#888;font-size:10px;">(${Math.round(m.spawn_chance * 100)}%)</span>` : '';
            const durTag = m.duration ? ` <span style="color:#666;font-size:10px;">${m.duration}t</span>` : m.is_periodic ? ` <span style="color:#666;font-size:10px;">periodic</span>` : '';
            html += `<label style="display:flex;align-items:center;gap:6px;color:#ccc;font-size:12px;padding:2px 4px;cursor:pointer;">
                <input type="checkbox" class="is-mod-cb" data-key="${m.key}" value="1"> ${esc(m.name)}${chanceTag}${durTag}
            </label>`;
        }
    }
    container.innerHTML = html;
}

function onIssueNationChange() {
    const aId = document.getElementById('is-nation-a').value;
    const bId = document.getElementById('is-nation-b').value;
    const infoDiv = document.getElementById('is-relation-info');

    // Update favor labels
    const aName = _issueNations.find(n => n.id === aId)?.name || 'Nation A';
    const bName = _issueNations.find(n => n.id === bId)?.name || 'Nation B';
    document.getElementById('is-favor-label-a').textContent = aName;
    document.getElementById('is-favor-label-b').textContent = bName;

    if (!aId || !bId || aId === bId) {
        infoDiv.style.display = 'none';
        return;
    }

    const rel = getRelation(aId, bId);
    if (rel) {
        const borders = rel.border_types || [];
        const borderStr = borders.length ? borders.join(', ') : 'none';
        infoDiv.innerHTML = `<strong>Relation:</strong> score ${rel.relation_score}, proximity ${rel.proximity} | <strong>Borders:</strong> ${borderStr}`;
        infoDiv.style.display = 'block';
    } else {
        infoDiv.innerHTML = '<span style="color:#d9534f;">No diplomatic relation found between these nations.</span>';
        infoDiv.style.display = 'block';
    }

    // Check border requirement
    checkBorderRequirement();
}

function onIssueTypeChange() {
    const typeKey = document.getElementById('is-issue-type').value;
    const typeDef = ISSUE_SPAWNER_TYPES[typeKey];
    document.getElementById('is-type-desc').textContent = typeDef?.description || '';
    // Show/hide administering nation selector
    const adminRow = document.getElementById('is-admin-nation-row');
    if (adminRow) adminRow.style.display = typeDef?.has_administering_nation ? 'block' : 'none';
    checkBorderRequirement();
    // Filter modifier checkboxes to show only relevant modifiers for this issue type
    renderModifierCheckboxes();
}

function checkBorderRequirement() {
    const typeKey = document.getElementById('is-issue-type').value;
    const typeDef = ISSUE_SPAWNER_TYPES[typeKey];
    const aId = document.getElementById('is-nation-a').value;
    const bId = document.getElementById('is-nation-b').value;
    const warnDiv = document.getElementById('is-border-warning');

    if (!typeDef?.required_border || !aId || !bId || aId === bId) {
        warnDiv.style.display = 'none';
        return;
    }

    const rel = getRelation(aId, bId);
    const borders = rel?.border_types || [];
    if (!borders.includes(typeDef.required_border)) {
        warnDiv.textContent = `Warning: This issue requires a "${typeDef.required_border}" border, but these nations share: ${borders.length ? borders.join(', ') : 'none'}. You can still spawn it for testing.`;
        warnDiv.style.display = 'block';
    } else {
        warnDiv.style.display = 'none';
    }
}

function updateFavorLabel() {
    const val = parseInt(document.getElementById('is-favor').value, 10);
    const label = val === 0 ? '0 (Neutral)' : `${val}`;
    document.getElementById('is-favor-val').textContent = label;
}

function isSelectStarterMods() {
    const typeKey = document.getElementById('is-issue-type').value;
    const typeDef = ISSUE_SPAWNER_TYPES[typeKey];
    if (!typeDef) return;

    document.querySelectorAll('.is-mod-cb').forEach(cb => {
        const key = cb.dataset.key;
        const mod = ISSUE_SPAWNER_MODIFIERS[key];
        if (typeDef.starter_modifiers.includes(key)) {
            // Respect spawn_chance for probabilistic starters
            const chance = mod?.spawn_chance ?? 1.0;
            cb.checked = Math.random() < chance;
        } else {
            cb.checked = false;
        }
    });
}

function isSelectAllMods() {
    document.querySelectorAll('.is-mod-cb').forEach(cb => cb.checked = true);
}

function isClearMods() {
    document.querySelectorAll('.is-mod-cb').forEach(cb => cb.checked = false);
}

async function spawnBilateralIssue() {
    const status = document.getElementById('is-spawn-status');
    const nationA = document.getElementById('is-nation-a').value;
    const nationB = document.getElementById('is-nation-b').value;
    const issueType = document.getElementById('is-issue-type').value;
    const tension = parseFloat(document.getElementById('is-tension').value);
    const favor = parseInt(document.getElementById('is-favor').value, 10);
    const favorSide = document.querySelector('input[name="is-favor-side"]:checked')?.value || 'a';
    const issueStatus = document.getElementById('is-status').value;

    if (!nationA || !nationB) { status.textContent = 'Select both nations.'; status.style.color = '#d9534f'; return; }
    if (nationA === nationB) { status.textContent = 'Nations must be different.'; status.style.color = '#d9534f'; return; }

    // Build modifiers array
    const modifiers = [];
    document.querySelectorAll('.is-mod-cb:checked').forEach(cb => {
        const key = cb.dataset.key;
        const def = ISSUE_SPAWNER_MODIFIERS[key];
        if (!def) return;
        modifiers.push({
            modifier_key: key,
            category: def.category,
            applies_to: def.applies_to || 'both',
            stat_effects: def.stat_effects || [],
            duration_remaining: def.duration || null,
            is_periodic: def.is_periodic || false,
            periodic_interval: def.periodic_interval || null,
            periodic_duration: def.periodic_duration || null,
        });
    });

    status.textContent = 'Spawning...'; status.style.color = '#ffcc00';

    // Determine administering nation for territorial issues
    const typeDef = ISSUE_SPAWNER_TYPES[issueType];
    let adminNationId = null;
    if (typeDef?.has_administering_nation) {
        const adminSide = document.getElementById('is-admin-nation')?.value || 'a';
        adminNationId = adminSide === 'a' ? nationA : nationB;
    }

    const { data, error } = await _supabase.rpc('admin_spawn_bilateral_issue', {
        p_nation_a_id: nationA,
        p_nation_b_id: nationB,
        p_issue_type: issueType,
        p_tension: tension,
        p_favor: favor,
        p_favor_nation: favorSide,
        p_modifiers: modifiers,
        p_status: issueStatus,
        p_administering_nation_id: adminNationId,
    });

    if (error) {
        status.textContent = 'RPC error: ' + error.message;
        status.style.color = '#d9534f';
        return;
    }

    if (data?.ok) {
        const aName = _issueNations.find(n => n.id === nationA)?.name || '?';
        const bName = _issueNations.find(n => n.id === nationB)?.name || '?';
        status.innerHTML = `<span style="color:#5cb85c;">Spawned!</span> ${esc(aName)} vs ${esc(bName)} — tension ${data.tension}, favor ${data.favor} — ${modifiers.length} modifier(s). ID: <code style="color:#ffcc00;">${data.issue_id?.slice(0,8)}</code>`;
        // Load active issues list
        await loadActiveIssues();
    } else {
        status.textContent = data?.message || 'Unknown error';
        status.style.color = '#d9534f';
    }
}

async function loadActiveIssues() {
    const list = document.getElementById('is-active-list');
    if (!list) return;

    const { data: issues } = await _supabase
        .from('bilateral_issues')
        .select('id, issue_type, nation_a_id, nation_b_id, tension, favor, status, created_tick')
        .in('status', ['active', 'partial', 'escalated'])
        .order('created_tick', { ascending: false });

    if (!issues || issues.length === 0) {
        list.innerHTML = '<div style="color:#888;font-size:13px;padding:8px;">No active issues.</div>';
        return;
    }

    const nameMap = {};
    _issueNations.forEach(n => nameMap[n.id] = n.name);

    let html = '<table style="width:100%;font-size:12px;border-collapse:collapse;">';
    html += '<tr style="color:#999;border-bottom:1px solid #444;"><th style="text-align:left;padding:4px;">Type</th><th>Nations</th><th>Tension</th><th>Favor</th><th>Status</th><th>Tick</th><th></th></tr>';
    for (const i of issues) {
        const tensionColor = i.tension <= 2 ? '#5cb85c' : i.tension <= 5 ? '#f0ad4e' : i.tension <= 8 ? '#d9534f' : '#ff4444';
        html += `<tr style="border-bottom:1px solid #333;">
            <td style="padding:4px;color:#ccc;">${esc(i.issue_type.replace(/_/g, ' '))}</td>
            <td style="padding:4px;color:#ccc;">${esc(nameMap[i.nation_a_id] || '?')} vs ${esc(nameMap[i.nation_b_id] || '?')}</td>
            <td style="padding:4px;text-align:center;color:${tensionColor};font-weight:bold;">${i.tension}</td>
            <td style="padding:4px;text-align:center;color:#ccc;">${i.favor > 0 ? '+' : ''}${i.favor}</td>
            <td style="padding:4px;text-align:center;"><span style="color:${i.status === 'active' ? '#5cb85c' : i.status === 'escalated' ? '#d9534f' : '#f0ad4e'};">${i.status}</span></td>
            <td style="padding:4px;text-align:center;color:#888;">${i.created_tick}</td>
            <td style="padding:4px;"><button class="btn btn-danger btn-sm" onclick="deleteIssue('${i.id}')" style="font-size:10px;padding:2px 8px;">Delete</button></td>
        </tr>`;
    }
    html += '</table>';
    list.innerHTML = html;
}

async function deleteIssue(issueId) {
    if (!confirm('Delete this issue and all its modifiers/history?')) return;

    const { data, error } = await _supabase.rpc('admin_delete_bilateral_issue', { p_issue_id: issueId });
    if (error) { alert('Delete failed: ' + error.message); return; }
    if (!data?.ok) { alert(data?.message || 'Delete failed.'); return; }
    await loadActiveIssues();
}
