    /** Save every nation's current stats into seed_stats JSONB column */
    async function snapshotSeedStats() {
        if (!isAuthenticated) return;
        const statusEl = document.getElementById('seed-status');
        const infoEl = document.getElementById('seed-info');
        statusEl.innerHTML = '<span style="color:#5b9bd5; font-weight:bold;">Snapshotting...</span>';

        try {
            const { data: nations, error } = await _supabase.from('nations').select('*');
            if (error) throw error;
            if (!nations || nations.length === 0) { statusEl.innerHTML = '<span style="color:#d48a3c;">No nations found.</span>'; return; }

            let count = 0;
            for (const nation of nations) {
                const snapshot = {};
                for (const key of NATION_STAT_COLUMNS) {
                    if (nation[key] !== undefined && nation[key] !== null) {
                        snapshot[key] = nation[key];
                    }
                }
                // Also save government-adjacent fields
                ['total_seats', 'government_type'].forEach(k => {
                    if (nation[k] !== undefined && nation[k] !== null) snapshot[k] = nation[k];
                });

                // Validate GDP/debt are in dollar scale before saving seed
                // (prevents snapshotting corrupted 0-100 stat scores)
                if (snapshot.gdp !== undefined && snapshot.gdp >= 0 && snapshot.gdp <= 100000) {
                    console.error(`[snapshotSeedStats] REFUSING to snapshot ${nation.name}: GDP=${snapshot.gdp} is not dollar-scale`);
                    statusEl.innerHTML = `<span style="color:#d9534f; font-weight:bold;">⚠ ${nation.name} GDP=${snapshot.gdp} looks corrupted (0-100 stat score). Fix data first.</span>`;
                    return;
                }
                if (snapshot.debt !== undefined && snapshot.debt > 0 && snapshot.debt <= 100000) {
                    console.error(`[snapshotSeedStats] REFUSING to snapshot ${nation.name}: debt=${snapshot.debt} is not dollar-scale`);
                    statusEl.innerHTML = `<span style="color:#d9534f; font-weight:bold;">⚠ ${nation.name} debt=${snapshot.debt} looks corrupted (0-100 stat score). Fix data first.</span>`;
                    return;
                }

                const { error: uErr } = await _supabase.from('nations')
                    .update({ seed_stats: snapshot })
                    .eq('id', nation.id);
                if (uErr) throw uErr;
                count++;
            }

            statusEl.innerHTML = `<span style="color:#5cb85c; font-weight:bold;">✅ Saved seed for ${count} nation(s)</span>`;
            infoEl.textContent = 'Snapshot taken at ' + new Date().toLocaleString();
        } catch (error) {
            console.error(error);
            statusEl.innerHTML = `<span style="color:#d9534f; font-weight:bold;">❌ ${error.message}</span>`;
        }
    }

    /** Full shard reset — restores nation stats, deletes all game state */
    async function resetShard() {
        if (!isAuthenticated) return;
        if (!confirm('⚠️ FULL SHARD RESET — this will delete ALL parties, corporations, laws, elections, and game data. All players will be sent to faction-select on next login. Continue?')) return;
        if (!confirm('⚠️ SECOND CONFIRMATION — Are you absolutely sure? This cannot be undone!')) return;

        const btn = document.getElementById('reset-btn');
        const status = document.getElementById('reset-status');
        const log = document.getElementById('reset-log');
        btn.disabled = true;
        status.className = 'status info'; status.textContent = 'Resetting...'; status.classList.remove('hidden');
        log.innerHTML = '';

        const logMsg = (msg, color = '#aaa') => {
            log.innerHTML += `<div style="color:${color};">${msg}</div>`;
            log.scrollTop = log.scrollHeight;
        };

        try {
            // 1. Reset shard clock to tick 1, January 2000
            logMsg('Resetting shard clock...');
            const tickHours = currentTickInterval || 1; // fallback to 1 hour if undefined
            const nextTick = new Date(Date.now() + tickHours * 60 * 60 * 1000);
            const { error: shardErr } = await _supabase.from('shard').update({
                current_date: 'January, 2000', current_tick: 1,
                next_tick_at: nextTick.toISOString()
            }).eq('name', 'Alpha Shard');
            if (shardErr) throw shardErr;
            logMsg('✓ Shard clock reset to January 2000, tick 1', '#5cb85c');

            // 2. Clear all game-state tables via RPC (bypasses RLS, handles FK ordering)
            logMsg('Clearing game state tables (106+ tables)...');
            const { data: clearResult, error: clearErr } = await _supabase.rpc('admin_reset_tables');
            if (clearErr) {
                logMsg('⚠ admin_reset_tables RPC failed: ' + clearErr.message, '#d48a3c');
                logMsg('  (Run sql/create_admin_reset_tables.sql in Supabase first)', '#888');
            } else {
                let tablesCleared = 0;
                for (const [table, val] of Object.entries(clearResult || {})) {
                    if (typeof val === 'number' && val > 0) {
                        logMsg(`  ✓ ${table}: ${val} rows deleted`, '#666');
                        tablesCleared++;
                    }
                }
                logMsg(`✓ Game state tables cleared (${tablesCleared} had data)`, '#5cb85c');
            }

            // 3. Delete all factions (parties + corporations) using admin_delete_party RPC
            logMsg('Deleting all factions (parties + corporations)...');
            const { data: allFactions, error: facErr } = await _supabase.from('factions').select('id, faction_name, faction_type');
            if (facErr) logMsg('⚠ Failed to load factions: ' + facErr.message, '#d48a3c');
            let delOk = 0, delFail = 0;
            for (const f of (allFactions || [])) {
                const { error: rpcErr } = await _supabase.rpc('admin_delete_party', { p_faction_id: f.id, p_force: true });
                if (rpcErr) {
                    logMsg(`  ⚠ ${f.faction_name} (${f.faction_type}): ${rpcErr.message}`, '#d48a3c');
                    delFail++;
                } else {
                    delOk++;
                }
            }
            if (delOk > 0) logMsg(`✓ Deleted ${delOk} factions`, '#5cb85c');
            if (delFail > 0) logMsg(`⚠ ${delFail} factions failed to delete`, '#d48a3c');
            if (delOk === 0 && delFail === 0) logMsg('No factions to delete', '#888');

            // 4. Restore nation stats from seed_stats
            logMsg('Restoring nation stats from seed...');
            const { data: nations, error: nErr } = await _supabase.from('nations').select('id, name, seed_stats');
            if (nErr) throw nErr;

            let restored = 0, skipped = 0;
            for (const nation of (nations || [])) {
                if (!nation.seed_stats || Object.keys(nation.seed_stats).length === 0) {
                    logMsg(`  ⚠ ${nation.name}: no seed stats saved, skipping`, '#d48a3c');
                    skipped++;
                    continue;
                }
                // Only restore columns that exist in NATION_STAT_COLUMNS + known extras
                const update = {};
                const validKeys = new Set([...NATION_STAT_COLUMNS,
                    'total_seats', 'government_type', 'gov_approval',
                    'head_of_state_first_name', 'head_of_state_last_name',
                    'parliamentary_term_ticks', 'presidential_term_ticks',
                ]);
                for (const [k, v] of Object.entries(nation.seed_stats)) {
                    if (validKeys.has(k)) update[k] = v;
                }
                // Clear references that point to deleted factions/state
                update.ruling_faction_id = null;
                update.gov_approval = 50; // reset to neutral
                update.debt = nation.seed_stats.debt ?? 0; // reset debt (default 0)
                update.monarch_faction_id = null; // clear monarchy references
                update.failed_formation_attempts = 0;
                // Reset foundational law terms to defaults
                update.parliamentary_term_ticks = nation.seed_stats.parliamentary_term_ticks || 48;
                update.presidential_term_ticks = nation.seed_stats.presidential_term_ticks || null;

                const { error: uErr } = await _supabase.from('nations').update(update).eq('id', nation.id);
                if (uErr) logMsg(`  ⚠ ${nation.name}: ${uErr.message}`, '#d48a3c');
                else { logMsg(`  ✓ ${nation.name} restored (${Object.keys(update).length} stats)`, '#666'); restored++; }
            }
            if (skipped > 0) logMsg(`⚠ ${skipped} nation(s) had no seed — use "Save Current Stats as Seed" first`, '#d48a3c');
            logMsg(`✓ ${restored} nation(s) restored from seed`, '#5cb85c');

            // 5. Clear session storage for all users (force faction-select on next login)
            // Players with no faction_id → redirected to select-nation.html by loadGameState()
            logMsg('✓ All factions deleted — players will be sent to faction-select on next login', '#5cb85c');

            // 6. Re-seed initial elections for each nation
            // Each nation gets a random 1d6+1 (2-7 ticks) before first election.
            logMsg('Scheduling initial elections...');
            let electionsSch = 0;
            for (const nation of (nations || [])) {
                const seed = nation.seed_stats || {};
                const govType = (seed.government_type || '').toLowerCase();
                const parlTerm = seed.parliamentary_term_ticks;
                const presTerm = seed.presidential_term_ticks;

                if (!parlTerm && !presTerm) {
                    logMsg(`  — ${nation.name}: no term length in seed, skipping`, '#888');
                    continue;
                }

                // First election tick: 1d6+1 (random 2-7 ticks after reset)
                const firstTick = Math.floor(Math.random() * 6) + 2;

                // Parliamentary election (all nations with a parliamentary term)
                if (parlTerm) {
                    const { error: elErr } = await _supabase.from('elections').insert({
                        nation_id: nation.id,
                        election_tick: firstTick,
                        election_type: 'parliamentary',
                        status: 'scheduled'
                    });
                    if (!elErr) { electionsSch++; logMsg(`  ${nation.name}: parliamentary at tick ${firstTick}`, '#aaa'); }
                    else logMsg(`  ⚠ ${nation.name} parliamentary: ${elErr.message}`, '#d48a3c');
                }

                // Presidential election (presidential nations)
                if (presTerm && govType.includes('presidential')) {
                    const presTick = Math.floor(Math.random() * 6) + 2; // 1d6+1
                    const { error: elErr } = await _supabase.from('elections').insert({
                        nation_id: nation.id,
                        election_tick: presTick,
                        election_type: 'presidential',
                        status: 'scheduled'
                    });
                    if (!elErr) { electionsSch++; logMsg(`  ${nation.name}: presidential at tick ${presTick}`, '#aaa'); }
                    else logMsg(`  ⚠ ${nation.name} presidential: ${elErr.message}`, '#d48a3c');
                }
            }
            logMsg(`✓ ${electionsSch} initial elections scheduled`, '#5cb85c');

            // 7. Done
            status.className = 'status success';
            status.textContent = `✅ Shard reset complete! ${restored} nations restored, ${delOk} factions deleted, ${electionsSch} elections scheduled.`;
            await loadAllData();
        } catch (error) {
            console.error(error);
            logMsg('❌ FATAL: ' + error.message, '#d9534f');
            status.className = 'status error'; status.textContent = '❌ Error: ' + error.message;
        }
        btn.disabled = false;
    }

    // ==================== SECTORS TAB ====================

    let sectorNationId = null;
    let sectorListData = [];

    const SECTOR_BTN_STYLE = 'padding:4px 12px; font-size:0.8rem;';
    const SECTOR_REMOVE_BTN_STYLE = 'padding:4px 10px; font-size:0.8rem; margin-left:6px; background:transparent; color:#ef5350; border:1px solid #442222; cursor:pointer; border-radius:2px;';

    function validateSectorFields(name, weight, baseTurnout) {
        if (!name) return 'Name cannot be empty.';
        if (isNaN(weight) || weight < 1) return 'Weight must be at least 1.';
        if (isNaN(baseTurnout) || baseTurnout < 0.50 || baseTurnout > 1.30) return 'Base Turnout must be between 0.50 and 1.30.';
        return null;
    }

    async function withButtonLock(btn, fn) {
        if (btn) { btn.disabled = true; btn.dataset.originalText = btn.textContent; }
        try { return await fn(); }
        finally { if (btn) { btn.disabled = false; } }
    }

    async function loadSectorNations() {
        try {
            const { data, error } = await _supabase.from('nations').select('id, name').order('name');
            if (error) throw error;
            const select = document.getElementById('sector-nation-select');
            if (!select) return;
            select.innerHTML = '<option value="">-- Choose a nation --</option>';
            (data || []).forEach(n => {
                select.innerHTML += `<option value="${n.id}">${escHtml(n.name)}</option>`;
            });
        } catch (err) { console.error('loadSectorNations failed', err); }
    }

    async function onSectorNationSelect() {
        const nationId = document.getElementById('sector-nation-select').value;
        const infoDiv = document.getElementById('sector-nation-info');
        // Always reset Phase 1 panels — leaving them populated after a nation
        // switch would let an admin save edits to the previous nation while
        // the dropdown reads as the new one.
        clearPhase1Panels();
        if (!nationId) { infoDiv.classList.add('hidden'); sectorNationId = null; sectorListData = []; return; }
        sectorNationId = nationId;
        infoDiv.classList.remove('hidden');
        const container = document.getElementById('sector-list-container');
        if (container) container.innerHTML = '<div class="no-players">Loading sectors…</div>';
        await loadSectorsForNation(nationId);
    }

    async function loadSectorsForNation(nationId) {
        try {
            const { data, error } = await _supabase
                .from('sectors')
                .select('*')
                .eq('nation_id', nationId)
                .eq('is_active', true)
                .order('display_order');
            if (error) throw error;
            sectorListData = data || [];
            renderSectorList();
            updateSectorTotals();
        } catch (err) {
            console.error('loadSectorsForNation failed', err);
            const c = document.getElementById('sector-list-container');
            if (c) c.innerHTML = `<div style="color:#e57373;">Error loading sectors: ${escHtml(err.message || String(err))}</div>`;
        }
    }

    function renderSectorList() {
        const container = document.getElementById('sector-list-container');
        if (!container) return;
        if (sectorListData.length === 0) {
            container.innerHTML = '<div class="no-players">No active sectors for this nation. The 12 defaults should have been seeded automatically — check the migration applied cleanly.</div>';
            return;
        }
        const inputStyle = 'background:#1a1a1a; border:1px solid #333; color:#eee; padding:4px; border-radius:2px;';
        let html = `
            <table style="width:100%; border-collapse:collapse; font-size:0.9rem;">
                <thead>
                    <tr style="background:#252525; color:#ffcc00; text-transform:uppercase; font-size:0.7rem; letter-spacing:1px;">
                        <th style="padding:8px; text-align:left; border-bottom:1px solid #444; width:32px;">#</th>
                        <th style="padding:8px; text-align:left; border-bottom:1px solid #444;">Name</th>
                        <th style="padding:8px; text-align:left; border-bottom:1px solid #444;">Description</th>
                        <th style="padding:8px; text-align:center; border-bottom:1px solid #444; width:90px;">Weight</th>
                        <th style="padding:8px; text-align:left; border-bottom:1px solid #444; width:160px;" title="Primary nation stat that drives this sector's weight at election time. Suffix _inverse = use 100 - value.">Primary Stat</th>
                        <th style="padding:8px; text-align:left; border-bottom:1px solid #444; width:160px;" title="Optional secondary stat. Blends 70% primary / 30% secondary before stepping.">Secondary Stat</th>
                        <th style="padding:8px; text-align:center; border-bottom:1px solid #444; width:120px;">Base Turnout</th>
                        <th style="padding:8px; text-align:center; border-bottom:1px solid #444; width:90px;">Type</th>
                        <th style="padding:8px; text-align:center; border-bottom:1px solid #444; width:170px;">Actions</th>
                    </tr>
                </thead>
                <tbody>
        `;
        sectorListData.forEach((s, idx) => {
            const typeBadge = s.is_default
                ? '<span style="background:#1976d2; color:#fff; padding:2px 8px; border-radius:3px; font-size:0.7rem; letter-spacing:0.5px;">DEFAULT</span>'
                : '<span style="background:#7b1fa2; color:#fff; padding:2px 8px; border-radius:3px; font-size:0.7rem; letter-spacing:0.5px;">CUSTOM</span>';
            const removeBtn = s.is_default
                ? ''
                : `<button data-sector-action="remove" data-sector-id="${s.id}" style="${SECTOR_REMOVE_BTN_STYLE}" onclick="softDeleteSector('${s.id}')">Remove</button>`;
            html += `
                <tr id="sector-row-${s.id}" style="border-bottom:1px solid #2a2a2a;">
                    <td style="padding:8px; color:#888;">${idx + 1}</td>
                    <td style="padding:8px;"><input type="text" data-sector-id="${s.id}" data-field="name" value="${escapeAttr(s.name)}" maxlength="80" style="width:100%; ${inputStyle}"></td>
                    <td style="padding:8px;"><input type="text" data-sector-id="${s.id}" data-field="description" value="${escapeAttr(s.description || '')}" maxlength="240" style="width:100%; ${inputStyle}"></td>
                    <td style="padding:8px;"><input type="number" data-sector-id="${s.id}" data-field="weight" min="1" step="1" value="${s.weight}" onchange="updateSectorTotals()" oninput="updateSectorTotals()" style="width:60px; text-align:center; ${inputStyle}"></td>
                    <td style="padding:8px;"><span style="font-family:monospace; font-size:0.78rem; color:${s.primary_stat ? '#a3b07e' : '#777'};">${escapeHtml(s.primary_stat || '—')}</span></td>
                    <td style="padding:8px;"><span style="font-family:monospace; font-size:0.78rem; color:${s.secondary_stat ? '#9aa07e' : '#777'};">${escapeHtml(s.secondary_stat || '—')}</span></td>
                    <td style="padding:8px;"><input type="number" data-sector-id="${s.id}" data-field="base_turnout" min="0.50" max="1.30" step="0.05" value="${parseFloat(s.base_turnout).toFixed(2)}" style="width:90px; text-align:center; ${inputStyle}"></td>
                    <td style="padding:8px; text-align:center;">${typeBadge}</td>
                    <td style="padding:8px; text-align:center; white-space:nowrap;">
                        <button class="btn btn-primary" data-sector-action="update" data-sector-id="${s.id}" style="${SECTOR_BTN_STYLE}" onclick="updateSector('${s.id}', this)">Update</button>
                        ${removeBtn}
                    </td>
                </tr>
            `;
        });
        html += '</tbody></table>';
        container.innerHTML = html;
    }

    function updateSectorTotals() {
        const totalWeightEl = document.getElementById('sector-total-weight');
        const statusEl = document.getElementById('sector-weight-status');
        const countEl = document.getElementById('sector-count-display');
        if (!totalWeightEl) return;

        let totalWeight = 0;
        let defaultCount = 0;
        let customCount = 0;
        sectorListData.forEach(s => {
            const input = document.querySelector(`input[data-sector-id="${s.id}"][data-field="weight"]`);
            const w = input ? parseInt(input.value, 10) : s.weight;
            if (!isNaN(w)) totalWeight += w;
            if (s.is_default) defaultCount++; else customCount++;
        });

        totalWeightEl.textContent = totalWeight;
        countEl.textContent = `${defaultCount} default + ${customCount} custom = ${defaultCount + customCount}`;

        // Recommended band is 24-26 — the seat-allocation math was tuned
        // for that range. A nation can ship higher: per-sector and
        // total-weight caps were both relaxed so admins can shape an
        // outsized bloc when the design calls for it.
        if (totalWeight < 24) {
            statusEl.textContent = `below recommended band 24-26 (${24 - totalWeight} short)`;
            statusEl.style.color = '#e57373';
        } else if (totalWeight > 26) {
            statusEl.textContent = `above recommended band 24-26 (${totalWeight - 26} over — allowed, but check seat-math impact)`;
            statusEl.style.color = '#d4a83c';
        } else {
            statusEl.textContent = 'within recommended band 24-26';
            statusEl.style.color = '#81c784';
        }
    }

    async function updateSector(sectorId, btn) {
        const nameInput = document.querySelector(`input[data-sector-id="${sectorId}"][data-field="name"]`);
        const descInput = document.querySelector(`input[data-sector-id="${sectorId}"][data-field="description"]`);
        const weightInput = document.querySelector(`input[data-sector-id="${sectorId}"][data-field="weight"]`);
        const turnoutInput = document.querySelector(`input[data-sector-id="${sectorId}"][data-field="base_turnout"]`);
        if (!nameInput || !weightInput || !turnoutInput) return;

        const name = (nameInput.value || '').trim();
        const description = (descInput.value || '').trim();
        const weight = parseInt(weightInput.value, 10);
        const baseTurnout = parseFloat(turnoutInput.value);

        const validationError = validateSectorFields(name, weight, baseTurnout);
        if (validationError) { alert(validationError); return; }

        await withButtonLock(btn, async () => {
            try {
                const { error } = await _supabase
                    .from('sectors')
                    .update({ name, description, weight, base_turnout: baseTurnout })
                    .eq('id', sectorId);
                if (error) throw error;
                if (sectorNationId) await loadSectorsForNation(sectorNationId);
            } catch (err) {
                console.error('updateSector failed', err);
                alert('Update failed: ' + (err.message || String(err)));
            }
        });
    }

    async function addCustomSector(btn) {
        if (!sectorNationId) return;
        const nameEl = document.getElementById('new-sector-name');
        const descEl = document.getElementById('new-sector-description');
        const weightEl = document.getElementById('new-sector-weight');
        const turnoutEl = document.getElementById('new-sector-turnout');
        const statusEl = document.getElementById('sector-add-status');

        const name = (nameEl.value || '').trim();
        const description = (descEl.value || '').trim();
        const weight = parseInt(weightEl.value, 10);
        const baseTurnout = parseFloat(turnoutEl.value);

        const setError = msg => { statusEl.style.color = '#e57373'; statusEl.textContent = msg; };
        statusEl.textContent = '';

        const validationError = validateSectorFields(name, weight, baseTurnout);
        if (validationError) return setError(validationError);

        const sectorKey = generateSectorKey(name);
        if (!sectorKey) return setError('Could not generate a key from this name — use letters/numbers.');
        if (sectorListData.some(s => s.sector_key === sectorKey)) return setError(`A sector with key "${sectorKey}" already exists in this nation.`);

        const nextOrder = sectorListData.reduce((m, s) => Math.max(m, s.display_order || 0), 0) + 1;

        await withButtonLock(btn, async () => {
            try {
                const { error } = await _supabase
                    .from('sectors')
                    .insert({
                        nation_id: sectorNationId,
                        sector_key: sectorKey,
                        name,
                        description,
                        weight,
                        base_turnout: baseTurnout,
                        is_default: false,
                        is_active: true,
                        display_order: nextOrder
                    });
                if (error) throw error;
                nameEl.value = '';
                descEl.value = '';
                weightEl.value = 1;
                turnoutEl.value = '1.00';
                statusEl.style.color = '#81c784';
                statusEl.textContent = `Added "${name}" (key: ${sectorKey}). All factions in this nation now have popularity 0 for it.`;
                await loadSectorsForNation(sectorNationId);
            } catch (err) {
                console.error('addCustomSector failed', err);
                setError('Insert failed: ' + (err.message || String(err)));
            }
        });
    }

    async function softDeleteSector(sectorId) {
        const sector = sectorListData.find(s => s.id === sectorId);
        const sectorName = sector ? sector.name : 'this sector';
        if (!confirm(`Soft-delete "${sectorName}"?\n\nThe sector will be hidden from gameplay but its popularity history is preserved. Affects only this nation.`)) return;
        const btn = document.querySelector(`button[data-sector-action="remove"][data-sector-id="${sectorId}"]`);
        await withButtonLock(btn, async () => {
            try {
                const { error } = await _supabase
                    .from('sectors')
                    .update({ is_active: false })
                    .eq('id', sectorId);
                if (error) throw error;
                if (sectorNationId) await loadSectorsForNation(sectorNationId);
            } catch (err) {
                console.error('softDeleteSector failed', err);
                alert('Soft-delete failed: ' + (err.message || String(err)));
            }
        });
    }

    function generateSectorKey(name) {
        return (name || '')
            .toUpperCase()
            .replace(/\([^)]*\)/g, ' ')
            .replace(/[^A-Z0-9\s_]/g, ' ')
            .trim()
            .replace(/\s+/g, '_')
            .replace(/_+/g, '_')
            .replace(/^_|_$/g, '');
    }

    // ==================== PROVINCES TAB ====================
    // Partition model: per sector, Σ province weights must equal the
    // nation-level sectors.weight. Phase 1 is display-only — nothing here
    // touches the election engine; it only writes province_sector_weights
    // for the election-map panels to read.

    let provinceNationId = null;
    let provinceSectors = [];          // [{ id, name, weight }] active, ordered
    let provinceList = [];             // [{ id, name, display_order }]
    let provinceWeightMap = {};        // `${provinceId}|${sectorId}` -> weight

    const PROV_INPUT_STYLE = 'background:#1a1a1a; border:1px solid #333; color:#eee; padding:4px; border-radius:2px;';

    async function loadProvinceNations() {
        try {
            const { data, error } = await _supabase.from('nations').select('id, name').order('name');
            if (error) throw error;
            const select = document.getElementById('province-nation-select');
            if (!select) return;
            select.innerHTML = '<option value="">-- Choose a nation --</option>';
            (data || []).forEach(n => {
                select.innerHTML += `<option value="${n.id}">${escHtml(n.name)}</option>`;
            });
        } catch (err) { console.error('loadProvinceNations failed', err); }
    }

    async function onProvinceNationSelect() {
        const nationId = document.getElementById('province-nation-select').value;
        const infoDiv = document.getElementById('province-nation-info');
        const addStatus = document.getElementById('province-add-status');
        const saveStatus = document.getElementById('province-save-status');
        if (addStatus) addStatus.textContent = '';
        if (saveStatus) saveStatus.textContent = '';
        if (!nationId) {
            infoDiv.classList.add('hidden');
            provinceNationId = null; provinceSectors = []; provinceList = []; provinceWeightMap = {};
            return;
        }
        provinceNationId = nationId;
        infoDiv.classList.remove('hidden');
        const c = document.getElementById('province-grid-container');
        if (c) c.innerHTML = '<div class="no-players">Loading…</div>';
        await loadProvincesForNation(nationId);
    }

    async function loadProvincesForNation(nationId) {
        try {
            const [secRes, provRes] = await Promise.all([
                _supabase.from('sectors').select('id, name, weight')
                    .eq('nation_id', nationId).eq('is_active', true).order('display_order'),
                _supabase.from('provinces').select('id, name, display_order')
                    .eq('nation_id', nationId).order('display_order'),
            ]);
            if (secRes.error) throw secRes.error;
            if (provRes.error) throw provRes.error;
            provinceSectors = secRes.data || [];
            provinceList = provRes.data || [];
            provinceWeightMap = {};
            const provIds = provinceList.map(p => p.id);
            if (provIds.length) {
                const { data: w, error: wErr } = await _supabase
                    .from('province_sector_weights')
                    .select('province_id, sector_id, weight')
                    .in('province_id', provIds);
                if (wErr) throw wErr;
                (w || []).forEach(r => { provinceWeightMap[`${r.province_id}|${r.sector_id}`] = r.weight; });
            }
            renderProvinceGrid();
        } catch (err) {
            console.error('loadProvincesForNation failed', err);
            const c = document.getElementById('province-grid-container');
            if (c) c.innerHTML = `<div style="color:#e57373;">Error loading provinces: ${escHtml(err.message || String(err))}</div>`;
        }
    }

    function provCellWeight(provinceId, sectorId) {
        const v = provinceWeightMap[`${provinceId}|${sectorId}`];
        return Number.isFinite(v) ? v : 0;
    }

    function renderProvinceGrid() {
        const container = document.getElementById('province-grid-container');
        if (!container) return;
        if (provinceSectors.length === 0) {
            container.innerHTML = '<div class="no-players">This nation has no active sectors — add sectors in the Sectors tab first.</div>';
            recomputeProvinceBalance();
            return;
        }
        if (provinceList.length === 0) {
            container.innerHTML = '<div class="no-players">No provinces yet. Add a province above to begin partitioning sector weights.</div>';
            recomputeProvinceBalance();
            return;
        }
        let html = `
            <table style="width:100%; border-collapse:collapse; font-size:0.9rem;">
                <thead>
                    <tr style="background:#252525; color:#ffcc00; text-transform:uppercase; font-size:0.7rem; letter-spacing:1px;">
                        <th style="padding:8px; text-align:left; border-bottom:1px solid #444;">Sector</th>
                        <th style="padding:8px; text-align:center; border-bottom:1px solid #444; width:90px;" title="Nation weight — the budget to split. Edit it in the Sectors tab.">Nation Wt</th>`;
        provinceList.forEach(p => {
            html += `<th style="padding:8px; text-align:center; border-bottom:1px solid #444; width:110px;">
                        ${escHtml(p.name)}
                        <button title="Delete province" onclick="deleteProvince('${p.id}', this)"
                          style="display:block; margin:4px auto 0; padding:2px 8px; font-size:0.7rem; background:transparent; color:#ef5350; border:1px solid #442222; cursor:pointer; border-radius:2px;">Delete</button>
                     </th>`;
        });
        html += `<th style="padding:8px; text-align:center; border-bottom:1px solid #444; width:110px;">Allocated</th>
                    </tr></thead><tbody>`;
        provinceSectors.forEach(s => {
            html += `<tr id="prov-row-${s.id}" style="border-bottom:1px solid #2a2a2a;">
                        <td style="padding:8px;">${escHtml(s.name)}</td>
                        <td style="padding:8px; text-align:center; color:#a3b07e; font-weight:bold;">${Number(s.weight) || 0}</td>`;
            provinceList.forEach(p => {
                html += `<td style="padding:8px; text-align:center;">
                            <input type="number" min="0" max="${Number(s.weight) || 0}" step="1"
                              data-prov-id="${p.id}" data-sector-id="${s.id}" data-field="pweight"
                              value="${provCellWeight(p.id, s.id)}"
                              oninput="recomputeProvinceBalance()"
                              style="width:54px; text-align:center; ${PROV_INPUT_STYLE}"></td>`;
            });
            html += `<td style="padding:8px; text-align:center;" id="prov-alloc-${s.id}">—</td></tr>`;
        });
        html += '</tbody></table>';
        container.innerHTML = html;
        recomputeProvinceBalance();
    }

    function recomputeProvinceBalance() {
        const saveBtn = document.getElementById('province-save-btn');
        const balStatus = document.getElementById('province-balance-status');
        const haveGrid = provinceSectors.length > 0 && provinceList.length > 0;
        let allBalanced = haveGrid;
        provinceSectors.forEach(s => {
            const target = Number(s.weight) || 0;
            let sum = 0;
            provinceList.forEach(p => {
                const inp = document.querySelector(`input[data-prov-id="${p.id}"][data-sector-id="${s.id}"][data-field="pweight"]`);
                const v = inp ? parseInt(inp.value, 10) : provCellWeight(p.id, s.id);
                if (!isNaN(v)) sum += v;
            });
            const cell = document.getElementById(`prov-alloc-${s.id}`);
            const ok = sum === target;
            if (!ok) allBalanced = false;
            if (cell) {
                cell.textContent = `${sum} / ${target}`;
                cell.style.color = ok ? '#81c784' : '#e57373';
                cell.style.fontWeight = 'bold';
            }
        });
        if (balStatus) {
            if (!haveGrid) {
                balStatus.textContent = provinceList.length === 0 ? 'add a province to begin' : 'no active sectors';
                balStatus.style.color = '#888';
            } else if (allBalanced) {
                balStatus.textContent = 'balanced — every sector sums to its nation weight';
                balStatus.style.color = '#81c784';
            } else {
                balStatus.textContent = 'unbalanced — fix the red rows before saving';
                balStatus.style.color = '#e57373';
            }
        }
        if (saveBtn) {
            saveBtn.disabled = !allBalanced;
            saveBtn.style.opacity = allBalanced ? '1' : '0.5';
            saveBtn.style.cursor = allBalanced ? 'pointer' : 'not-allowed';
        }
        return allBalanced;
    }

    async function addProvince(btn) {
        if (!provinceNationId) return;
        const nameEl = document.getElementById('new-province-name');
        const statusEl = document.getElementById('province-add-status');
        const name = (nameEl.value || '').trim();
        const setErr = m => { statusEl.style.color = '#e57373'; statusEl.textContent = m; };
        statusEl.textContent = '';
        if (!name) return setErr('Province name cannot be empty.');
        if (provinceList.some(p => p.name.toLowerCase() === name.toLowerCase()))
            return setErr(`A province named "${name}" already exists in this nation.`);
        const nextOrder = provinceList.reduce((m, p) => Math.max(m, p.display_order || 0), 0) + 1;
        await withButtonLock(btn, async () => {
            try {
                const { error } = await _supabase.from('provinces')
                    .insert({ nation_id: provinceNationId, name, display_order: nextOrder });
                if (error) throw error;
                nameEl.value = '';
                statusEl.style.color = '#81c784';
                statusEl.textContent = `Added "${name}" (weights start at 0 — partition the sectors and Save).`;
                await loadProvincesForNation(provinceNationId);
            } catch (err) {
                console.error('addProvince failed', err);
                setErr('Insert failed: ' + (err.message || String(err)));
            }
        });
    }

    async function deleteProvince(provinceId, btn) {
        const p = provinceList.find(x => x.id === provinceId);
        const pName = p ? p.name : 'this province';
        if (!confirm(`Delete "${pName}"?\n\nIts per-sector weights are removed permanently. Any sector it contributed to will become unbalanced until you re-partition and Save.`)) return;
        await withButtonLock(btn, async () => {
            try {
                const { error } = await _supabase.from('provinces').delete().eq('id', provinceId);
                if (error) throw error;
                await loadProvincesForNation(provinceNationId);
            } catch (err) {
                console.error('deleteProvince failed', err);
                alert('Delete failed: ' + (err.message || String(err)));
            }
        });
    }

    async function saveProvinceWeights(btn) {
        if (!provinceNationId) return;
        const statusEl = document.getElementById('province-save-status');
        statusEl.textContent = '';
        if (!recomputeProvinceBalance()) {
            statusEl.style.color = '#e57373';
            statusEl.textContent = 'Cannot save: some sectors are not balanced to their nation weight.';
            return;
        }
        const rows = [];
        provinceList.forEach(p => {
            provinceSectors.forEach(s => {
                const inp = document.querySelector(`input[data-prov-id="${p.id}"][data-sector-id="${s.id}"][data-field="pweight"]`);
                let v = inp ? parseInt(inp.value, 10) : 0;
                if (isNaN(v) || v < 0) v = 0;
                const maxW = Number(s.weight) || 0;   // a province can't exceed the sector's nation weight
                if (v > maxW) v = maxW;
                rows.push({ province_id: p.id, sector_id: s.id, weight: v });
            });
        });
        await withButtonLock(btn, async () => {
            try {
                const { error } = await _supabase
                    .from('province_sector_weights')
                    .upsert(rows, { onConflict: 'province_id,sector_id' });
                if (error) throw error;
                statusEl.style.color = '#81c784';
                statusEl.textContent = `Saved ${rows.length} province-sector weights.`;
                await loadProvincesForNation(provinceNationId);
            } catch (err) {
                console.error('saveProvinceWeights failed', err);
                statusEl.style.color = '#e57373';
                statusEl.textContent = 'Save failed: ' + (err.message || String(err));
            }
        });
    }

    // ==================== ADD NATION TAB ====================
    // Politician refocus: this form seeds nations for the Politician segment.
    // The five politician_* columns are entered inline in the form HTML
    // (companion migration 20270363); the legacy 26-stat 0-100 grid is gone.
    // The legacy nations.gdp / nations.debt columns are mirrored server-side
    // from politician_gdp / politician_debt inside admin_create_nation, so the
    // (legacy) Parties surface keeps showing sensible numbers.

    let nnPolicyCache = [];

    // Single source of truth for which UI fields / payload keys each gov-type uses.
    function nnGovFlags(govKey) {
        return {
            isPres: govKey === 'presidential' || govKey === 'semipresidential',
            hasPM: govKey !== 'presidential',
            isMonarchy: govKey === 'constitutional_monarchy' || govKey === 'absolute_monarchy',
            isAbsolute: govKey === 'absolute_monarchy',
        };
    }

    function onAddNationGovType() {
        const t = document.getElementById('nn-govtype')?.value;
        if (!t) return;
        const { isMonarchy, isPres, isAbsolute, hasPM } = nnGovFlags(t);
        const show = (id, on) => { const e = document.getElementById(id); if (e) e.style.display = on ? '' : 'none'; };
        show('nn-dynasty-wrap', isMonarchy);
        show('nn-presterm-wrap', isPres);
        show('nn-preslimit-wrap', isPres);
        show('nn-parlterm-wrap', hasPM && !isAbsolute);
        const titleEl = document.getElementById('nn-hos_title');
        if (titleEl && (titleEl.value === 'President' || titleEl.value === 'King' || titleEl.value === '')) {
            titleEl.value = isMonarchy ? 'King' : 'President';
        }
        const note = document.getElementById('nn-election-note');
        if (note) note.textContent = isAbsolute
            ? 'Absolute Monarchy: no elections — seats are static and a caretaker royal government holds indefinitely.'
            : 'First election fires 1–6 ticks after creation (caretaker handoff).';
    }

    async function loadAddNationPolicies() {
        const box = document.getElementById('nn-policies-list');
        if (!box) return;
        try {
            const { data, error } = await _supabase.from('policies')
                .select('id, policy_name, major_sector, policy_type, policy_options(id, option_name, option_order, is_active)')
                .order('major_sector').order('policy_name');
            if (error) throw error;
            // Keep every policy (both 'structural' and 'lever'). Each carries its
            // own active options sorted by option_order; the form renders an
            // inline select per policy so the admin can pick the starting choice.
            nnPolicyCache = (data || []).map(p => ({
                ...p,
                policy_options: (p.policy_options || [])
                    .filter(o => o.is_active !== false)
                    .sort((a, b) => (a.option_order ?? 0) - (b.option_order ?? 0)),
            }));
            renderAddNationPolicies(nnPolicyCache);
        } catch (err) {
            console.error('loadAddNationPolicies failed', err);
            box.innerHTML = '<span style="color:#e57373;">Failed to load policies.</span>';
        }
    }

    function renderAddNationPolicies(list) {
        const box = document.getElementById('nn-policies-list');
        if (!box) return;
        if (!list.length) { box.innerHTML = '<span style="color:#888;">No matching policies.</span>'; return; }
        box.innerHTML = list.map(p => {
            const opts = p.policy_options || [];
            const sel = opts.length
                ? `<select class="nn-pol-opt" data-policy="${p.id}" style="font-size:0.72rem; max-width:220px; margin-left:6px;">` +
                  opts.map((o, i) => `<option value="${o.id}"${i === 0 ? ' selected' : ''}>${o.option_name}</option>`).join('') +
                  '</select>'
                : '';
            return `<div style="display:flex; align-items:center; gap:6px; padding:2px 0; font-size:0.82rem;">` +
                `<label style="flex:1;"><input type="checkbox" class="nn-pol" value="${p.id}"> ` +
                `<span style="color:#888;">[${p.major_sector || '—'}]</span> ${p.policy_name}</label>${sel}</div>`;
        }).join('');
    }

    function filterAddNationPolicies() {
        const q = (document.getElementById('nn-policy-filter')?.value || '').toLowerCase();
        renderAddNationPolicies(nnPolicyCache.filter(p =>
            !q || (p.policy_name || '').toLowerCase().includes(q) || (p.major_sector || '').toLowerCase().includes(q)));
    }

    // Diplomacy proximities — one input per existing nation, sourced from the
    // shared `nations` array (already loaded by loadElectionNations earlier in
    // loadAllData).
    function renderAddNationProximities() {
        const box = document.getElementById('nn-proximities');
        if (!box) return;
        const list = (nations || []).slice().sort((a, b) =>
            (a.name || '').localeCompare(b.name || ''));
        if (!list.length) { box.innerHTML = '<span style="color:#888;">No existing nations yet.</span>'; return; }
        const def = document.getElementById('nn-proximity-default')?.value || '80';
        box.innerHTML = list.map(n =>
            `<div style="display:flex; justify-content:space-between; align-items:center; padding:3px 0; font-size:0.82rem;">` +
            `<span>${escHtml(n.name)}</span>` +
            `<input type="number" class="nn-prox" data-nation="${n.id}" min="0" max="100" value="${def}" style="width:60px;"></div>`
        ).join('');
    }

    function applyDefaultProximity() {
        const v = document.getElementById('nn-proximity-default')?.value;
        if (v === undefined) return;
        document.querySelectorAll('.nn-prox').forEach(inp => { inp.value = v; });
    }

    // Canonical continents — surfaced in the Add Nation picker even
    // when no nation has been seeded there yet. Unioned with whatever
    // values already exist on nations.continent so historical entries
    // never drop out.
    const NN_CANONICAL_CONTINENTS = ['Al-Makir', 'Crucera', 'Faresia', 'Meridian', 'Serranthia'];
    async function loadAddNationContinents() {
        try {
            const { data } = await _supabase.from('nations').select('continent');
            const dl = document.getElementById('nn-continent-list');
            if (!dl) return;
            const fromDb = (data || []).map(n => n.continent).filter(Boolean);
            const seen = [...new Set([...NN_CANONICAL_CONTINENTS, ...fromDb])].sort();
            dl.innerHTML = seen.map(c => `<option value="${c}">`).join('');
        } catch (_) { /* non-fatal */ }
    }

    // Map the form's gov-type key to (government_type, hos_election_method).
    const NN_GOVTYPE_MAP = {
        parliamentary:          { gt: 'Parliamentary',     method: 'parliamentary' },
        presidential:           { gt: 'Presidential',      method: 'direct_vote' },
        constitutional_monarchy:{ gt: 'Parliamentary',     method: 'hereditary' },
        absolute_monarchy:      { gt: 'Absolute Monarchy', method: 'hereditary' },
    };

    function nnVal(id) { const e = document.getElementById(id); return e ? e.value.trim() : ''; }

    async function createNation(btn) {
        const statusEl = document.getElementById('nn-status');
        const setErr = m => { statusEl.style.color = '#e57373'; statusEl.textContent = m; };
        statusEl.textContent = '';
        const govKey = nnVal('nn-govtype');
        const map = NN_GOVTYPE_MAP[govKey];
        if (!map) return setErr('Pick a government type.');
        if (nnVal('nn-name').length < 2) return setErr('Name must be at least 2 characters.');
        if (nnVal('nn-capital').length < 2) return setErr('Capital is required.');

        const { isPres, hasPM, isMonarchy } = nnGovFlags(govKey);

        const policies = [...document.querySelectorAll('.nn-pol:checked')].map(cb => {
            const sel = document.querySelector(`.nn-pol-opt[data-policy="${cb.value}"]`);
            return { id: cb.value, option_id: sel?.value || null };
        });

        const payload = {
            name: nnVal('nn-name'),
            official_name: nnVal('nn-official_name'),
            capital: nnVal('nn-capital'),
            continent: nnVal('nn-continent'),
            government_type: map.gt,
            hos_election_method: map.method,
            total_seats: nnVal('nn-total_seats'),
            max_parties: nnVal('nn-max_parties'),
            head_of_state_title: nnVal('nn-hos_title'),
            head_of_state_first_name: nnVal('nn-hos_first'),
            head_of_state_last_name: nnVal('nn-hos_last'),
            head_of_state_age: nnVal('nn-hos_age'),
            population: nnVal('nn-population'),
            // Politician-side stats — the only headline numbers the form collects.
            // admin_create_nation mirrors politician_gdp/politician_debt into the
            // legacy nations.gdp/nations.debt columns for the (legacy) parties view.
            politician_gdp:             nnVal('nn-politician_gdp'),
            politician_budget:          nnVal('nn-politician_budget'),
            politician_debt:            nnVal('nn-politician_debt'),
            politician_stability:       nnVal('nn-politician_stability'),
            politician_civil_freedoms:  nnVal('nn-politician_civil_freedoms'),
            politician_gdp_growth:      nnVal('nn-politician_gdp_growth'),
            proximities: Object.fromEntries(
                [...document.querySelectorAll('.nn-prox')].map(i => [i.dataset.nation, i.value])
            ),
            flag_url: nnVal('nn-flag_url'),
            demonym: nnVal('nn-demonym'),
            currency_name: nnVal('nn-currency_name'),
            religion: nnVal('nn-religion'),
            languages: nnVal('nn-languages'),
            founded_year: nnVal('nn-founded_year'),
            motto: nnVal('nn-motto'),
            overview: nnVal('nn-overview'),
            policies,
        };
        if (isMonarchy) payload.dynasty_name = nnVal('nn-dynasty_name');
        if (isPres) {
            payload.presidential_term_ticks = nnVal('nn-presidential_term_ticks');
            payload.presidential_term_limit = nnVal('nn-presidential_term_limit');
        }
        if (hasPM) payload.parliamentary_term_ticks = nnVal('nn-parliamentary_term_ticks');

        await withButtonLock(btn, async () => {
            try {
                const { data, error } = await _supabase.rpc('admin_create_nation', { p_payload: payload });
                if (error) throw error;
                if (!data || !data.success) {
                    return setErr('Create failed: ' + (data?.reason || 'unknown'));
                }
                statusEl.style.color = '#81c784';
                statusEl.textContent = `Created "${data.name}" (${data.government_type}) — ${data.ministries} ministries, ` +
                    `${data.diplomatic_relations} relations, ${data.policies} policies` +
                    (data.first_election_tick ? `, first election @ tick ${data.first_election_tick}.` : ' (no elections).');
                document.getElementById('nn-name').value = '';
                document.getElementById('nn-capital').value = '';
                await Promise.all([loadSectorNations(), loadProvinceNations(), loadInspectorNations(),
                                   loadElectionNations(), loadAddNationContinents()]);
                // Pick up the just-created nation in the per-nation proximity list.
                renderAddNationProximities();
            } catch (err) {
                console.error('createNation failed', err);
                setErr('Create failed: ' + (err.message || String(err)));
            }
        });
    }

    async function loadAddNationInit() {
        onAddNationGovType();
        renderAddNationProximities();
        await loadAddNationContinents();
        await loadAddNationPolicies();
    }

    // ==================== ADD PARTY TAB ====================
    // Creates a Politician Movement Party (faction_type='movement_party') —
    // surfaces on politician-movements.html, hidden from every legacy parties
    // surface. The form carries an Archetype label dropdown + Status dropdown
    // (Governing / Coalition / Opposition) added in 20270394; both are
    // display-only — no stronghold seeding, no coalition-system wiring.
    // The "Head of Government?" checkbox, when set with a leader filled in,
    // overwrites the chosen nation's head_of_state_first_name / last_name
    // (silent server-side update; the form copy warns the admin).
    function loadAddPartyInit() {
        // Nation dropdown — reuse the shared `nations` list (already loaded by
        // loadElectionNations earlier in loadAllData) instead of re-querying.
        const sel = document.getElementById('ap-nation');
        if (sel) {
            sel.innerHTML = '<option value="">-- Choose a nation --</option>' +
                nations.map(n => `<option value="${n.id}">${escHtml(n.name)}</option>`).join('');
            // Wire-up only on first init to avoid stacking listeners across
            // re-loads. Once a nation is chosen, regenerate culture-appropriate
            // deputy + whip names + ages. Admin can override any field after.
            if (!sel.dataset.apNationWired) {
                sel.addEventListener('change', onAddPartyNationChange);
                sel.dataset.apNationWired = '1';
            }
        }
    }

    // Officer auto-fill formula — JS mirror of the SQL helpers in
    // 20270415 (pick_random_pool_name + roll_officer_age). The two
    // sites can't literally share a function across runtimes, so any
    // change to the pool-pick rule or age range must land in both:
    // here AND in 20270415's helper bodies. Inline here keeps the
    // pre-fill local to the admin form; SQL is what every backend
    // caller (admin_create_party today, future RPCs / backfills
    // tomorrow) reads from.
    function _apPick(pool) {
        if (!pool || !pool.length) return '';
        return pool[Math.floor(Math.random() * pool.length)];
    }
    function _apRollOfficerAge() {
        return 35 + Math.floor(Math.random() * 31);   // 35..65 inclusive
    }

    // Pre-fill Deputy Leader + Party Whip name + age fields from the chosen
    // nation's culture pool (js/game/political-actions.js getNationNames).
    // Always overwrites whatever's in the fields: a nation switch implies a
    // culture switch, and stale Hajjaran names on an Avelian movement would
    // be confusing.
    function onAddPartyNationChange() {
        const sel = document.getElementById('ap-nation');
        const opt = sel?.selectedOptions?.[0];
        const nationName = opt?.textContent || '';
        if (!nationName) return;
        const pool = getNationNames(nationName);
        const setVal = (id, v) => { const el = document.getElementById(id); if (el) el.value = v; };
        setVal('ap-deputy-first', _apPick(pool.firstNames));
        setVal('ap-deputy-last',  _apPick(pool.lastNames));
        setVal('ap-deputy-age',   String(_apRollOfficerAge()));
        setVal('ap-whip-first',   _apPick(pool.firstNames));
        setVal('ap-whip-last',    _apPick(pool.lastNames));
        setVal('ap-whip-age',     String(_apRollOfficerAge()));
    }

    async function createParty(btn) {
        const statusEl = document.getElementById('ap-status');
        const setErr = m => { statusEl.style.color = '#e57373'; statusEl.textContent = m; };
        statusEl.textContent = '';
        if (!nnVal('ap-nation')) return setErr('Pick a nation.');
        if (nnVal('ap-name').length < 2) return setErr('Party name must be at least 2 characters.');
        if (nnVal('ap-abbr').length < 1) return setErr('Abbreviation is required.');

        // Logo Icon / Custom Logo URL inputs were removed from the form
        // (20270394). The RPC still accepts the fields for non-form
        // callers; from this surface we just omit them and let the
        // server default party_logo='star' / custom_logo_url=NULL.
        const hogEl = document.getElementById('ap-hog');
        const payload = {
            nation_id: nnVal('ap-nation'),
            faction_name: nnVal('ap-name'),
            abbreviation: nnVal('ap-abbr'),
            seats: nnVal('ap-seats'),
            popularity_pct: nnVal('ap-popularity'),
            party_color: nnVal('ap-color'),
            archetype: nnVal('ap-archetype'),
            party_status: nnVal('ap-party-status'),
            is_head_of_government: !!(hogEl && hogEl.checked),
            party_description: nnVal('ap-desc'),
            leader_first_name: nnVal('ap-leader-first'),
            leader_last_name: nnVal('ap-leader-last'),
            leader_age: nnVal('ap-leader-age'),
            deputy_first_name: nnVal('ap-deputy-first'),
            deputy_last_name: nnVal('ap-deputy-last'),
            deputy_age: nnVal('ap-deputy-age'),
            whip_first_name: nnVal('ap-whip-first'),
            whip_last_name: nnVal('ap-whip-last'),
            whip_age: nnVal('ap-whip-age'),
        };

        await withButtonLock(btn, async () => {
            try {
                const { data, error } = await _supabase.rpc('admin_create_party', { p_payload: payload });
                if (error) throw error;
                if (!data || !data.success) return setErr('Create failed: ' + (data?.reason || 'unknown'));
                statusEl.style.color = '#81c784';
                const hogNote = data.head_of_government_set ? ' · Head of Government replaced.' : '';
                statusEl.textContent = `Created movement party "${data.faction_name}" [${data.abbreviation}] — ${data.seats} seats.${hogNote}`;
                document.getElementById('ap-name').value = '';
                document.getElementById('ap-abbr').value = '';
                document.getElementById('ap-desc').value = '';
                // Uncheck HoG so an immediate re-submit doesn't silently
                // overwrite the head of state we just set. Archetype +
                // Status stay set so the admin can spin up a batch of
                // parties with the same posture without re-picking.
                const hogReset = document.getElementById('ap-hog');
                if (hogReset) hogReset.checked = false;
                await loadNations();
            } catch (err) {
                console.error('createParty failed', err);
                setErr('Create failed: ' + (err.message || String(err)));
            }
        });
    }

    // ==================== SECTORS TAB — PHASE 1: POPULARITY EDITOR + DIAGNOSTICS ====================

    let sectorPopFactions = [];
    let sectorPopSectors = [];
    let sectorPopOriginal = new Map(); // key: `${factionId}:${sectorId}` -> integer-tenths popularity

    // Reset Phase 1 panels back to their unloaded state. Called from
    // onSectorNationSelect so a nation switch can never leave a stale grid
    // visible (which would let an admin save edits to the wrong nation).
    function clearPhase1Panels() {
        sectorPopFactions = [];
        sectorPopSectors = [];
        sectorPopOriginal = new Map();
        const editorContainer = document.getElementById('sector-popularity-editor-container');
        const editorStatus    = document.getElementById('sector-popularity-editor-status');
        const saveBtn         = document.getElementById('sector-popularity-save-btn');
        const diagContainer   = document.getElementById('sector-diagnostics-container');
        if (editorContainer) editorContainer.innerHTML = '';
        if (editorStatus)    { editorStatus.textContent = ''; editorStatus.style.color = ''; }
        if (saveBtn)         saveBtn.style.display = 'none';
        if (diagContainer)   diagContainer.innerHTML = '';
    }

    // Read one editor cell's parsed value, original value, and dirty/invalid
    // state. Single source of truth for the input-state pattern reused by
    // onPopularityCellInput, anyPopularityDirty, and saveFactionPopularityChanges.
    function getCellState(input) {
        const original = parseInt(input.dataset.original, 10);
        const parsed = parsePopularity(input.value);
        return {
            original,
            parsed,
            invalid: parsed === null,
            dirty: parsed !== null && parsed !== original,
        };
    }

    // Apply visual styling to an editor cell based on its state. Single
    // source of truth so the dirty/invalid/clean palette stays in sync.
    function setCellStyle(input, state) {
        if (state.invalid) {
            input.style.borderColor = '#e57373';
            input.style.background = '#3a1d1d';
        } else if (state.dirty) {
            input.style.borderColor = '#facc15';
            input.style.background = '#3a2f0d';
        } else {
            input.style.borderColor = '#333';
            input.style.background = '#1a1a1a';
        }
    }

    async function fetchPopulationDataForSelectedNation() {
        if (!sectorNationId) throw new Error('No nation selected.');
        const [{ data: factions, error: fErr }, { data: sectors, error: sErr }] = await Promise.all([
            _supabase.from('factions')
                .select('id, faction_name, abbreviation')
                .eq('nation_id', sectorNationId)
                .order('faction_name'),
            _supabase.from('sectors')
                .select('id, sector_key, name, weight, base_turnout, is_active, display_order')
                .eq('nation_id', sectorNationId)
                .eq('is_active', true)
                .order('display_order')
        ]);
        if (fErr) throw fErr;
        if (sErr) throw sErr;

        const factionList = factions || [];
        const sectorList = sectors || [];
        let popularity = [];
        if (factionList.length > 0) {
            const { data: pop, error: pErr } = await _supabase
                .from('faction_sector_popularity')
                .select('faction_id, sector_id, popularity')
                .in('faction_id', factionList.map(f => f.id));
            if (pErr) throw pErr;
            popularity = pop || [];
        }
        return { factions: factionList, sectors: sectorList, popularity };
    }

    async function loadFactionPopularityEditor() {
        const statusEl = document.getElementById('sector-popularity-editor-status');
        const container = document.getElementById('sector-popularity-editor-container');
        const saveBtn = document.getElementById('sector-popularity-save-btn');
        if (!sectorNationId) { statusEl.style.color = '#e57373'; statusEl.textContent = 'Select a nation first.'; return; }

        // Capture the nation we're loading for. If the user switches nations
        // before the fetch resolves, we discard the stale result.
        const fetchNationId = sectorNationId;
        statusEl.style.color = ''; statusEl.textContent = 'Loading…';
        container.innerHTML = '';
        if (saveBtn) saveBtn.style.display = 'none';

        try {
            const { factions, sectors, popularity } = await fetchPopulationDataForSelectedNation();
            if (sectorNationId !== fetchNationId) return; // user switched mid-fetch
            sectorPopFactions = factions;
            sectorPopSectors = sectors;
            sectorPopOriginal = new Map();
            for (const r of popularity) {
                sectorPopOriginal.set(`${r.faction_id}:${r.sector_id}`, Number(r.popularity) || 0);
            }
            renderFactionPopularityEditor();
            statusEl.textContent = `${sectorPopFactions.length} faction${sectorPopFactions.length === 1 ? '' : 's'} × ${sectorPopSectors.length} sectors loaded.`;
        } catch (err) {
            if (sectorNationId !== fetchNationId) return; // already moved on
            console.error('loadFactionPopularityEditor failed', err);
            statusEl.style.color = '#e57373';
            statusEl.textContent = 'Load failed: ' + (err.message || String(err));
        }
    }

    function renderFactionPopularityEditor() {
        const container = document.getElementById('sector-popularity-editor-container');
        if (sectorPopFactions.length === 0) {
            container.innerHTML = '<div class="no-players">This nation has no factions yet.</div>';
            return;
        }
        if (sectorPopSectors.length === 0) {
            container.innerHTML = '<div class="no-players">No active sectors for this nation.</div>';
            return;
        }
        const inputStyle = 'background:#1a1a1a; border:1px solid #333; color:#eee; padding:3px 4px; border-radius:2px; width:54px; text-align:center; font-family:inherit; font-size:0.85rem;';
        const headerCell = 'padding:6px 8px; text-align:center; border-bottom:1px solid #444; color:#ffcc00; text-transform:uppercase; font-size:0.65rem; letter-spacing:0.5px; min-width:72px;';

        let html = '<table style="border-collapse:collapse; font-size:0.85rem;"><thead><tr style="background:#252525;">';
        html += '<th style="padding:6px 8px; text-align:left; border-bottom:1px solid #444; color:#ffcc00; text-transform:uppercase; font-size:0.7rem; letter-spacing:1px; position:sticky; left:0; background:#252525; z-index:1; min-width:200px;">Faction</th>';
        for (const s of sectorPopSectors) {
            const tooltip = `${s.name} (W=${s.weight}, T=${parseFloat(s.base_turnout).toFixed(2)})`;
            const shortLabel = s.sector_key.replace(/_/g, ' ');
            html += `<th style="${headerCell}" title="${escHtml(tooltip)}">${escHtml(shortLabel)}</th>`;
        }
        html += '</tr></thead><tbody>';

        for (const f of sectorPopFactions) {
            const label = f.abbreviation ? `${escHtml(f.faction_name)} <span style="color:#888;">(${escHtml(f.abbreviation)})</span>` : escHtml(f.faction_name);
            html += '<tr style="border-bottom:1px solid #2a2a2a;">';
            html += `<td style="padding:6px 8px; position:sticky; left:0; background:#1a1a1a; z-index:1;">${label}</td>`;
            for (const s of sectorPopSectors) {
                const key = `${f.id}:${s.id}`;
                const current = sectorPopOriginal.get(key) ?? 0;
                const display = (current / 10).toFixed(1);
                html += `<td style="padding:4px 6px; text-align:center;"><input type="number" min="0" max="10" step="0.1" value="${display}" data-faction-id="${f.id}" data-sector-id="${s.id}" data-original="${current}" oninput="onPopularityCellInput(this)" style="${inputStyle}"></td>`;
            }
            html += '</tr>';
        }
        html += '</tbody></table>';
        container.innerHTML = html;
    }

    function onPopularityCellInput(input) {
        setCellStyle(input, getCellState(input));
        const saveBtn = document.getElementById('sector-popularity-save-btn');
        if (saveBtn) saveBtn.style.display = anyPopularityDirty() ? 'inline-block' : 'none';
    }

    function anyPopularityDirty() {
        const inputs = document.querySelectorAll('#sector-popularity-editor-container input[data-faction-id]');
        for (const input of inputs) {
            if (getCellState(input).dirty) return true;
        }
        return false;
    }

    async function saveFactionPopularityChanges() {
        const statusEl = document.getElementById('sector-popularity-editor-status');
        const saveBtn = document.getElementById('sector-popularity-save-btn');
        const inputs = document.querySelectorAll('#sector-popularity-editor-container input[data-faction-id]');
        // Lock save scope to the nation that's currently selected. If the
        // user switches nations after upsert resolves but before we update
        // the in-memory state, we abort the state-refresh step (the DB write
        // already landed against the correct nation).
        const saveNationId = sectorNationId;

        const upserts = [];
        const invalid = [];
        for (const input of inputs) {
            const state = getCellState(input);
            if (state.invalid) { invalid.push(input); continue; }
            if (state.dirty) {
                upserts.push({ faction_id: input.dataset.factionId, sector_id: input.dataset.sectorId, popularity: state.parsed });
            }
        }

        if (invalid.length > 0) {
            statusEl.style.color = '#e57373';
            statusEl.textContent = `${invalid.length} cell${invalid.length === 1 ? '' : 's'} have invalid values (must be 0.0–10.0). Fix and try again.`;
            return;
        }
        if (upserts.length === 0) {
            statusEl.style.color = '#888';
            statusEl.textContent = 'No changes to save.';
            return;
        }

        if (saveBtn) saveBtn.disabled = true;
        statusEl.style.color = '';
        statusEl.textContent = `Saving ${upserts.length} change${upserts.length === 1 ? '' : 's'}…`;
        try {
            const { error } = await _supabase
                .from('faction_sector_popularity')
                .upsert(upserts, { onConflict: 'faction_id,sector_id' });
            if (error) throw error;
            // If the nation changed mid-save, the DOM/state we'd be syncing
            // doesn't apply anymore — bail out without touching the new view.
            if (sectorNationId !== saveNationId) return;
            for (const input of inputs) {
                const state = getCellState(input);
                if (state.invalid) continue;
                input.dataset.original = String(state.parsed);
                setCellStyle(input, { ...state, dirty: false });
                sectorPopOriginal.set(`${input.dataset.factionId}:${input.dataset.sectorId}`, state.parsed);
            }
            if (saveBtn) saveBtn.style.display = 'none';
            statusEl.style.color = '#81c784';
            statusEl.textContent = `Saved ${upserts.length} change${upserts.length === 1 ? '' : 's'}.`;
        } catch (err) {
            console.error('saveFactionPopularityChanges failed', err);
            statusEl.style.color = '#e57373';
            statusEl.textContent = 'Save failed: ' + (err.message || String(err));
        } finally {
            if (saveBtn) saveBtn.disabled = false;
        }
    }

    function renderSectorDiagnostics(factions, sectors, popularity, hasDirtyEditor = false) {
        const container = document.getElementById('sector-diagnostics-container');
        if (factions.length === 0) {
            container.innerHTML = '<div class="no-players">This nation has no factions yet.</div>';
            return;
        }

        const rows = factions.map(f => ({
            faction: f,
            twp: calculateTotalWeightedPopularity(f.id, sectors, popularity),
            contribs: calculateSectorContributions(f.id, sectors, popularity),
        }));
        rows.sort((a, b) => b.twp - a.twp);
        const maxTwp = rows.length > 0 ? rows[0].twp : 0;

        let html = '';
        if (hasDirtyEditor) {
            html += '<div style="margin-bottom:12px; padding:10px 12px; background:#3a2f0d; border-left:3px solid #facc15; color:#ffe89a; font-size:0.85rem;">The popularity editor above has unsaved edits. Diagnostics below reflect the <strong>saved</strong> database state, not your pending changes — save the editor first to see their impact here.</div>';
        }

        const headerCell = 'padding:8px; border-bottom:1px solid #444; color:#ffcc00; text-transform:uppercase; font-size:0.7rem; letter-spacing:1px;';
        html += '<table style="width:100%; border-collapse:collapse; font-size:0.9rem;"><thead><tr style="background:#252525;">';
        html += `<th style="${headerCell} text-align:left; width:40px;">#</th>`;
        html += `<th style="${headerCell} text-align:left;">Faction</th>`;
        html += `<th style="${headerCell} text-align:right; width:100px;">TWP</th>`;
        html += `<th style="${headerCell} text-align:left;">Top sector contributions</th>`;
        html += '</tr></thead><tbody>';

        rows.forEach((row, idx) => {
            const f = row.faction;
            const label = f.abbreviation ? `${escHtml(f.faction_name)} <span style="color:#888;">(${escHtml(f.abbreviation)})</span>` : escHtml(f.faction_name);
            const sortedContribs = [...row.contribs].sort((a, b) => b.contribution - a.contribution);
            const top = sortedContribs.slice(0, 3)
                .filter(c => c.contribution > 0)
                .map(c => `${escHtml(c.name)}: <strong>${c.contribution.toFixed(0)}</strong>`)
                .join(' &middot; ');
            html += '<tr style="border-bottom:1px solid #2a2a2a;">';
            html += `<td style="padding:8px; color:#888;">${idx + 1}</td>`;
            html += `<td style="padding:8px;">${label}</td>`;
            html += `<td style="padding:8px; text-align:right; color:#ffcc00; font-weight:bold; font-size:1rem;">${row.twp.toFixed(0)}</td>`;
            html += `<td style="padding:8px; color:#aaa;">${top || '<em style="color:#666;">all sectors at 0</em>'}</td>`;
            html += '</tr>';
        });
        html += '</tbody></table>';

        if (maxTwp === 0) {
            html += '<div style="margin-top:12px; padding:10px 12px; background:#2a2317; border-left:3px solid #ffcc00; color:#aaa; font-size:0.85rem;">All factions show TWP=0 because every <code>faction_sector_popularity.popularity</code> is currently 0. Use the Faction Popularity Editor above to set values, then reload diagnostics.</div>';
        }
        container.innerHTML = html;
    }

    var connected = new Set([].concat(Array.from(sources), Array.from(targets)));
    var orphans = SC_ALL_STATS.filter(function(s) { return !connected.has(s); });
