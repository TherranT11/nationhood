// ==================== SEED STATS EDITOR ====================
// Allows admin to view and edit per-nation tick-1 seed stats.
// Changes are written to the seed_stats JSONB column, which the
// shard reset function uses to restore nation state.

// Phase 9b: alpha-23 stat menu plus the population metadata column
// (eligible_voters dropped — derived from population × 0.65).
const SEED_STAT_CATEGORIES = {
    'Fiscal': ['budget', 'debt', 'gdp_growth', 'income_tax', 'corporate_tax'],
    'Governance': ['state_apparatus', 'public_approval', 'crown_authority', 'corruption'],
    'Stability': ['unrest', 'crime'],
    'Population': ['population', 'immigration'],
    'Wellbeing': ['health', 'education', 'standard_of_living', 'cost_of_living'],
    'Productive base': ['infrastructure', 'industry', 'farmland', 'service_sector', 'workforce', 'energy'],
    'International': ['power'],
    'Government': ['government_type', 'total_seats', 'first_election_tick'],
};

// Stats stored as raw values (not 0-100 scores)
const SEED_RAW_STATS = new Set(['debt', 'budget', 'population']);
// Schema defaults — used to flag stats that were never explicitly set
const SEED_SCHEMA_DEFAULTS = {
    control: 50, public_approval: 50, crown_authority: 50, corruption: 50,
    unrest: 20, crime: 30, health: 50, education: 50,
    standard_of_living: 50, cost_of_living: 50,
    infrastructure: 50, industry: 50, farmland: 50,
    service_sector: 50, workforce: 50, energy: 50, power: 50,
    income_tax: 5, corporate_tax: 5,
};

let _seedNations = [];
let _seedSelectedNationId = null;

async function initSeedEditor() {
    // Insert container after the danger zone section if not already present
    if (document.getElementById('seed-editor-root')) return;

    // Find a place to put it — after the reset section or at the end of admin content
    const adminSection = document.getElementById('admin-section');
    if (!adminSection) return;

    const root = document.createElement('div');
    root.id = 'seed-editor-root';
    root.style.cssText = 'margin:20px;padding:20px;background:#1a1a1a;border:1px solid #333;font-family:JetBrains Mono,monospace;';
    adminSection.appendChild(root);

    root.innerHTML = `
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
            <div style="width:6px;height:6px;border-radius:50%;background:#facc15;"></div>
            <span style="font-size:11px;font-weight:700;letter-spacing:0.1em;color:#ccc;text-transform:uppercase;">Tick 1 Seed Stats Editor</span>
        </div>
        <div style="display:flex;gap:12px;align-items:center;margin-bottom:16px;">
            <select id="seed-nation-select" onchange="seedSelectNation(this.value)"
                style="background:#222;color:#eee;border:1px solid #444;padding:6px 10px;font-family:inherit;font-size:12px;min-width:200px;">
                <option value="">— Select a nation —</option>
            </select>
            <button onclick="seedSave()" id="seed-save-btn"
                style="background:#2a6e2a;color:#fff;border:1px solid #3a8a3a;padding:6px 14px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:0.05em;">
                SAVE TO SEED
            </button>
            <button onclick="seedLoadLive()" id="seed-load-live-btn"
                style="background:#555;color:#eee;border:1px solid #666;padding:6px 14px;font-family:inherit;font-size:11px;cursor:pointer;letter-spacing:0.05em;">
                LOAD LIVE VALUES
            </button>
            <span id="seed-editor-status" style="font-size:10px;color:#888;margin-left:auto;"></span>
        </div>
        <div id="seed-editor-body" style="max-height:600px;overflow-y:auto;"></div>
    `;

    // Load nations
    const { data: nations, error: nErr } = await _supabase.from('nations').select('id, name, seed_stats').order('name');
    if (nErr) { console.error('[SeedEditor] Failed to load nations:', nErr.message); return; }
    _seedNations = nations || [];

    const sel = document.getElementById('seed-nation-select');
    for (const n of _seedNations) {
        const opt = document.createElement('option');
        opt.value = n.id;
        opt.textContent = n.name;
        sel.appendChild(opt);
    }
}

async function seedSelectNation(nationId) {
    if (!nationId) {
        document.getElementById('seed-editor-body').innerHTML = '';
        _seedSelectedNationId = null;
        return;
    }
    _seedSelectedNationId = nationId;
    const nation = _seedNations.find(n => n.id === nationId);
    if (!nation) return;

    const seed = nation.seed_stats || {};
    const body = document.getElementById('seed-editor-body');
    const statusEl = document.getElementById('seed-editor-status');
    statusEl.textContent = 'Loading...';
    statusEl.style.color = '#888';

    // Fetch live nation data for delta comparison
    let live = {};
    try {
        const { data, error } = await _supabase.from('nations').select('*').eq('id', nationId).single();
        if (!error && data) live = data;
    } catch (_) { /* non-fatal — deltas just won't show */ }

    // Count coverage: how many stats in the editor have a saved seed value
    const allEditorStats = Object.values(SEED_STAT_CATEGORIES).flat();
    const savedCount = allEditorStats.filter(s => seed[s] !== undefined && seed[s] !== null).length;
    const totalCount = allEditorStats.length;
    const pct = Math.round((savedCount / totalCount) * 100);
    const coverageColor = pct >= 90 ? '#5cb85c' : pct >= 60 ? '#c8a64e' : '#d9534f';

    let html = '';

    // Coverage bar
    html += `<div style="margin-bottom:14px;padding:8px 10px;background:#111;border:1px solid #333;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
            <span style="font-size:8px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.06em;">Seed Coverage</span>
            <span style="font-size:10px;font-weight:700;color:${coverageColor};">${savedCount}/${totalCount} stats (${pct}%)</span>
        </div>
        <div style="height:4px;background:#333;border-radius:2px;overflow:hidden;">
            <div style="height:100%;width:${pct}%;background:${coverageColor};border-radius:2px;"></div>
        </div>
        ${pct < 100 ? `<div style="font-size:7px;color:#888;margin-top:4px;">Stats not in seed will keep their live values after reset instead of resetting.</div>` : ''}
    </div>`;

    for (const [category, stats] of Object.entries(SEED_STAT_CATEGORIES)) {
        html += `<div style="margin-bottom:12px;">
            <div style="font-size:8px;font-weight:700;letter-spacing:0.08em;color:#888;text-transform:uppercase;padding:4px 0;border-bottom:1px solid #333;margin-bottom:6px;">${category}</div>
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:4px 16px;">`;

        for (const stat of stats) {
            const val = seed[stat];
            const isRaw = SEED_RAW_STATS.has(stat);
            const isString = stat === 'government_type';
            const isTickField = stat === 'first_election_tick';
            const schemaDefault = SEED_SCHEMA_DEFAULTS[stat];
            const isDefault = schemaDefault !== undefined && (val === schemaDefault || val === undefined || val === null);
            const displayVal = val !== undefined && val !== null ? val : (schemaDefault !== undefined ? schemaDefault : '');
            const label = stat.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

            const warnStyle = isDefault ? 'border-color:#c8a64e;background:#2a2510;' : '';
            const warnBadge = isDefault ? '<span style="font-size:7px;color:#c8a64e;font-weight:700;margin-left:4px;" title="At schema default — may need tuning">DEFAULT</span>' : '';

            // Delta: compare seed value to live value
            let deltaHtml = '';
            const liveVal = live[stat];
            if (liveVal !== undefined && liveVal !== null && !isString) {
                const seedNum = (val !== undefined && val !== null) ? Number(val) : (schemaDefault !== undefined ? schemaDefault : null);
                const liveNum = Number(liveVal);
                if (seedNum !== null && !isNaN(seedNum) && !isNaN(liveNum) && seedNum !== liveNum) {
                    const diff = liveNum - seedNum;
                    if (isRaw) {
                        const absDiff = Math.abs(diff);
                        const diffLabel = absDiff >= 1e9 ? (diff/1e9).toFixed(1)+'B' : absDiff >= 1e6 ? (diff/1e6).toFixed(0)+'M' : diff.toLocaleString();
                        const sign = diff > 0 ? '+' : '';
                        const color = '#5b9bd5';
                        deltaHtml = `<span style="font-size:7px;color:${color};font-family:inherit;" title="Live: ${liveNum.toLocaleString()}">live ${sign}${diffLabel}</span>`;
                    } else {
                        const sign = diff > 0 ? '+' : '';
                        const color = Math.abs(diff) > 10 ? '#d9534f' : '#5b9bd5';
                        deltaHtml = `<span style="font-size:7px;color:${color};font-family:inherit;" title="Live: ${liveNum.toFixed(1)}">live ${sign}${diff.toFixed(1)}</span>`;
                    }
                }
            }

            const badges = [warnBadge, deltaHtml].filter(Boolean).join(' ');

            if (isString) {
                html += `<div style="display:flex;align-items:center;gap:6px;padding:2px 0;">
                    <label style="font-size:9px;color:#aaa;min-width:120px;text-transform:uppercase;letter-spacing:0.03em;">${label}</label>
                    <input type="text" data-stat="${stat}" value="${displayVal}"
                        style="background:#222;color:#eee;border:1px solid #444;padding:3px 6px;font-family:inherit;font-size:11px;width:140px;${warnStyle}">
                    ${badges}
                </div>`;
            } else if (isTickField) {
                html += `<div style="display:flex;align-items:center;gap:6px;padding:2px 0;">
                    <label style="font-size:9px;color:#aaa;min-width:120px;text-transform:uppercase;letter-spacing:0.03em;">${label}</label>
                    <input type="number" data-stat="${stat}" value="${displayVal}" step="1" min="1" max="999"
                        style="background:#222;color:#eee;border:1px solid #444;padding:3px 6px;font-family:inherit;font-size:11px;width:70px;${warnStyle}"
                        title="Tick number for first election after reset" placeholder="e.g. 6">
                    ${badges}
                </div>`;
            } else if (isRaw) {
                html += `<div style="display:flex;align-items:center;gap:6px;padding:2px 0;">
                    <label style="font-size:9px;color:#aaa;min-width:120px;text-transform:uppercase;letter-spacing:0.03em;">${label}</label>
                    <input type="text" data-stat="${stat}" value="${typeof displayVal === 'number' ? displayVal.toLocaleString() : displayVal}"
                        style="background:#222;color:#eee;border:1px solid #444;padding:3px 6px;font-family:inherit;font-size:11px;width:140px;${warnStyle}"
                        title="Raw value (not 0-100)">
                    ${badges}
                </div>`;
            } else {
                html += `<div style="display:flex;align-items:center;gap:6px;padding:2px 0;">
                    <label style="font-size:9px;color:#aaa;min-width:120px;text-transform:uppercase;letter-spacing:0.03em;">${label}</label>
                    <input type="number" data-stat="${stat}" value="${displayVal}" step="0.1" min="0" max="100"
                        style="background:#222;color:#eee;border:1px solid #444;padding:3px 6px;font-family:inherit;font-size:11px;width:70px;${warnStyle}">
                    ${badges}
                </div>`;
            }
        }
        html += `</div></div>`;
    }

    const savedAt = seed._saved_at;
    const footer = savedAt ? `Last saved: ${new Date(savedAt).toLocaleString()}` : 'No seed saved yet — stats will not be restored on reset';
    const footerColor = savedAt ? '#666' : '#d9534f';
    html += `<div style="font-size:9px;color:${footerColor};margin-top:12px;padding-top:8px;border-top:1px solid #333;">${footer}</div>`;

    body.innerHTML = html;
    statusEl.textContent = `Loaded seed for ${nation.name}`;
    statusEl.style.color = '#888';
}

async function seedSave() {
    if (!_seedSelectedNationId) return;
    const statusEl = document.getElementById('seed-editor-status');
    const btn = document.getElementById('seed-save-btn');
    btn.disabled = true;
    statusEl.textContent = 'Saving...';
    statusEl.style.color = '#5b9bd5';

    try {
        const inputs = document.querySelectorAll('#seed-editor-body [data-stat]');
        const seed = {};

        for (const input of inputs) {
            const stat = input.dataset.stat;
            const raw = input.value.trim();
            if (raw === '') continue;

            if (stat === 'government_type') {
                seed[stat] = raw;
            } else if (SEED_RAW_STATS.has(stat)) {
                // Parse raw values (remove commas)
                const num = Number(raw.replace(/,/g, ''));
                if (!isNaN(num)) seed[stat] = num;
            } else if (stat === 'total_seats' || stat === 'median_age' || stat === 'first_election_tick') {
                seed[stat] = parseInt(raw, 10);
            } else {
                const num = parseFloat(raw);
                if (!isNaN(num)) seed[stat] = num;
            }
        }

        // Validate GDP/debt are dollar-scale
        if (seed.gdp !== undefined && seed.gdp >= 0 && seed.gdp <= 100000) {
            statusEl.textContent = `GDP=${seed.gdp} looks like a stat score, not dollars. Aborting.`;
            statusEl.style.color = '#d9534f';
            btn.disabled = false;
            return;
        }

        seed._saved_at = new Date().toISOString();

        const { error } = await _supabase.from('nations')
            .update({ seed_stats: seed })
            .eq('id', _seedSelectedNationId);

        if (error) throw error;

        // Update local cache
        const nation = _seedNations.find(n => n.id === _seedSelectedNationId);
        if (nation) nation.seed_stats = seed;

        const statCount = Object.keys(seed).filter(k => k !== '_saved_at').length;
        statusEl.textContent = `Saved ${statCount} stats for ${nation?.name || 'nation'}`;
        statusEl.style.color = '#5cb85c';
    } catch (err) {
        console.error('[SeedEditor] Save failed:', err);
        statusEl.textContent = `Save failed: ${err.message}`;
        statusEl.style.color = '#d9534f';
    } finally {
        btn.disabled = false;
    }
}

async function seedLoadLive() {
    if (!_seedSelectedNationId) return;
    const statusEl = document.getElementById('seed-editor-status');
    statusEl.textContent = 'Loading live values...';
    statusEl.style.color = '#5b9bd5';

    try {
        const { data: nation, error } = await _supabase.from('nations')
            .select('*')
            .eq('id', _seedSelectedNationId)
            .single();
        if (error) throw error;

        // Populate inputs with live values instead of seed values
        const inputs = document.querySelectorAll('#seed-editor-body [data-stat]');
        for (const input of inputs) {
            const stat = input.dataset.stat;
            const val = nation[stat];
            if (val !== undefined && val !== null) {
                if (SEED_RAW_STATS.has(stat) && typeof val === 'number') {
                    input.value = val.toLocaleString();
                } else {
                    input.value = val;
                }
                // Clear warning styling since we have a live value
                input.style.borderColor = '#5b9bd5';
                input.style.background = '#1a2530';
            }
        }

        statusEl.textContent = `Loaded live values for ${nation.name} — edit and SAVE TO SEED when ready`;
        statusEl.style.color = '#5b9bd5';
    } catch (err) {
        console.error('[SeedEditor] Load live failed:', err);
        statusEl.textContent = `Failed: ${err.message}`;
        statusEl.style.color = '#d9534f';
    }
}

window.initSeedEditor = initSeedEditor;
window.seedSelectNation = seedSelectNation;
window.seedSave = seedSave;
window.seedLoadLive = seedLoadLive;

// Auto-init when admin panel loads
document.addEventListener('admin-panel-loaded', () => {
    setTimeout(initSeedEditor, 500);
});

// ==================== HUBS TAB ====================
// Airline hubs (airline_cities) + the airline_city_ranges distance matrix.
// Reads go direct (tables are world-readable); writes go through is_admin()
// gated RPCs (admin_create_hub / admin_update_hub / admin_delete_hub /
// admin_set_hub_ranges) since these tables have no client write policy.
let hubNations = [];     // [{id,name,population}]
let hubNationPop = {};   // nation id -> population
let hubsAll = [];        // [{id,nation_id,name,population_pct,is_capital,nation_name}]
let hubRangeMap = {};    // "aId|bId" (both directions) -> distance
const HUB_INPUT = 'background:#1a1a1a; border:1px solid #333; color:#eee; padding:4px; border-radius:2px;';

async function initHubsTab() {
    await loadHubNations();
    await loadHubs();
}

async function loadHubNations() {
    try {
        const { data, error } = await _supabase.from('nations').select('id, name, population').order('name');
        if (error) throw error;
        hubNations = data || [];
        hubNationPop = {};
        hubNations.forEach(n => { hubNationPop[n.id] = n.population; });
        const sel = document.getElementById('hub-nation-select');
        if (sel) {
            sel.innerHTML = '<option value="">-- Choose a nation --</option>'
                + hubNations.map(n => `<option value="${n.id}">${escHtml(n.name)}</option>`).join('');
        }
    } catch (err) { console.error('loadHubNations failed', err); }
}

function onHubNationSelect() {
    const id = document.getElementById('hub-nation-select').value;
    const popDiv = document.getElementById('hub-nation-pop');
    const form = document.getElementById('hub-add-form');
    const st = document.getElementById('hub-add-status'); if (st) st.textContent = '';
    if (!id) {
        if (popDiv) popDiv.innerHTML = 'Population: &mdash;';
        if (form) form.classList.add('hidden');
        return;
    }
    if (popDiv) popDiv.textContent = 'Population: ' + (Number(hubNationPop[id]) || 0).toLocaleString();
    if (form) form.classList.remove('hidden');
}

async function loadHubs() {
    try {
        const [cityRes, rangeRes] = await Promise.all([
            _supabase.from('airline_cities').select('id, nation_id, name, population_pct, is_capital'),
            _supabase.from('airline_city_ranges').select('city_a_id, city_b_id, distance'),
        ]);
        if (cityRes.error) throw cityRes.error;
        if (rangeRes.error) throw rangeRes.error;
        const nameById = {}; hubNations.forEach(n => { nameById[n.id] = n.name; });
        hubsAll = (cityRes.data || []).map(c => ({ ...c, nation_name: nameById[c.nation_id] || '?' }));
        hubsAll.sort((a, b) => a.nation_name.localeCompare(b.nation_name) || a.name.localeCompare(b.name));
        hubRangeMap = {};
        (rangeRes.data || []).forEach(r => {
            hubRangeMap[`${r.city_a_id}|${r.city_b_id}`] = r.distance;
            hubRangeMap[`${r.city_b_id}|${r.city_a_id}`] = r.distance;
        });
        renderHubList();
        renderHubMatrix();
    } catch (err) {
        console.error('loadHubs failed', err);
        const c = document.getElementById('hub-list-container');
        if (c) c.innerHTML = `<div style="color:#e57373;">Error loading hubs: ${escHtml(err.message || String(err))}</div>`;
    }
}

function renderHubList() {
    const c = document.getElementById('hub-list-container');
    if (!c) return;
    if (hubsAll.length === 0) {
        c.innerHTML = '<div class="no-players">No hubs yet. Select a nation above and add one.</div>';
        return;
    }
    const th = 'padding:8px; border-bottom:1px solid #444; text-align:left;';
    let html = `<table style="width:100%; border-collapse:collapse; font-size:0.9rem;">
        <thead><tr style="background:#252525; color:#ffcc00; text-transform:uppercase; font-size:0.7rem; letter-spacing:1px;">
            <th style="${th}">Nation</th><th style="${th}">Name</th>
            <th style="${th} width:90px;">Weight</th>
            <th style="${th} width:70px;">Capital</th>
            <th style="${th} width:150px;">Actions</th>
        </tr></thead><tbody>`;
    hubsAll.forEach(h => {
        html += `<tr data-hub-row="${h.id}" style="border-bottom:1px solid #2a2a2a;">
            <td style="padding:8px; color:#9aa;">${escHtml(h.nation_name)}</td>
            <td style="padding:8px;"><input type="text" maxlength="80" data-hf="name" value="${escapeAttr(h.name)}" style="width:140px; ${HUB_INPUT}"></td>
            <td style="padding:8px;"><input type="number" min="0" max="100" step="0.01" data-hf="weight" value="${Number(h.population_pct)}" style="width:70px; text-align:center; ${HUB_INPUT}"></td>
            <td style="padding:8px; text-align:center;"><input type="checkbox" data-hf="capital"${h.is_capital ? ' checked' : ''}></td>
            <td style="padding:8px;">
                <button class="btn btn-success" style="padding:3px 10px; font-size:0.75rem;" onclick="saveHub('${h.id}', this)">Save</button>
                <button style="padding:3px 10px; font-size:0.75rem; background:transparent; color:#ef5350; border:1px solid #442222; cursor:pointer; border-radius:2px;" onclick="deleteHub('${h.id}', this)">Delete</button>
            </td></tr>`;
    });
    html += '</tbody></table>';
    c.innerHTML = html;
}

function renderHubMatrix() {
    const c = document.getElementById('hub-matrix-container');
    if (!c) return;
    if (hubsAll.length < 2) {
        c.innerHTML = '<div class="no-players">Add at least two hubs to set ranges.</div>';
        return;
    }
    const th = 'padding:6px; border:1px solid #333; font-size:0.75rem;';
    let html = `<table style="border-collapse:collapse; font-size:0.85rem;"><thead><tr>
        <th style="${th} background:#252525;"></th>`;
    hubsAll.forEach(h => {
        html += `<th style="${th} background:#252525; color:#ffcc00; writing-mode:vertical-rl; transform:rotate(180deg); height:90px;">${escHtml(h.name)}</th>`;
    });
    html += '</tr></thead><tbody>';
    hubsAll.forEach((rowH, i) => {
        html += `<tr><th style="${th} background:#252525; color:#ffcc00; text-align:right;">${escHtml(rowH.name)}</th>`;
        hubsAll.forEach((colH, j) => {
            if (i === j) {
                html += `<td style="${th} background:#1a1a1a; text-align:center; color:#555;">—</td>`;
            } else if (i < j) {
                const v = hubRangeMap[`${rowH.id}|${colH.id}`];
                html += `<td style="${th} text-align:center;"><input type="number" min="1" step="1"
                    data-ri="${i}" data-rj="${j}" value="${Number.isFinite(v) ? v : ''}"
                    style="width:48px; text-align:center; ${HUB_INPUT}"></td>`;
            } else {
                const v = hubRangeMap[`${rowH.id}|${colH.id}`];
                html += `<td style="${th} text-align:center; color:#777; background:#1d1d1d;">${Number.isFinite(v) ? v : ''}</td>`;
            }
        });
        html += '</tr>';
    });
    html += '</tbody></table>';
    c.innerHTML = html;
}

async function addHub(btn) {
    const nationId = document.getElementById('hub-nation-select').value;
    const statusEl = document.getElementById('hub-add-status');
    const setErr = m => { statusEl.style.color = '#e57373'; statusEl.textContent = m; };
    statusEl.textContent = '';
    if (!nationId) return setErr('Select a nation first.');
    const name = (document.getElementById('hub-new-name').value || '').trim();
    const weight = parseFloat(document.getElementById('hub-new-weight').value);
    const isCapital = document.getElementById('hub-new-capital').checked;
    if (name.length < 2) return setErr('Hub name must be at least 2 characters.');
    if (!Number.isFinite(weight) || weight < 0 || weight > 100) return setErr('Weight must be 0–100.');
    await withButtonLock(btn, async () => {
        try {
            const { data, error } = await _supabase.rpc('admin_create_hub', {
                p_nation_id: nationId, p_name: name, p_weight: weight, p_is_capital: isCapital,
            });
            if (error) throw error;
            if (!data || !data.success) {
                const REASON = {
                    name_exists: 'A hub with that name already exists in this nation.',
                    nation_not_found: 'Nation no longer exists.',
                };
                return setErr(REASON[data?.reason] || ('Could not add hub: ' + (data?.reason || 'unknown')));
            }
            document.getElementById('hub-new-name').value = '';
            statusEl.style.color = '#81c784';
            statusEl.textContent = `Added "${name}".`;
            await loadHubs();
        } catch (err) { setErr('Failed: ' + (err.message || String(err))); }
    });
}

async function saveHub(hubId, btn) {
    const row = document.querySelector(`tr[data-hub-row="${hubId}"]`);
    if (!row) return;
    const get = f => row.querySelector(`[data-hf="${f}"]`);
    const name = (get('name').value || '').trim();
    const weight = parseFloat(get('weight').value);
    const isCapital = get('capital').checked;
    if (name.length < 2) return alert('Hub name must be at least 2 characters.');
    if (!Number.isFinite(weight) || weight < 0 || weight > 100) return alert('Weight must be 0–100.');
    await withButtonLock(btn, async () => {
        try {
            const { data, error } = await _supabase.rpc('admin_update_hub', {
                p_hub_id: hubId, p_name: name, p_weight: weight, p_is_capital: isCapital,
            });
            if (error) throw error;
            if (!data || !data.success) {
                const REASON = {
                    name_exists: 'Another hub in this nation already has that name.',
                    hub_not_found: 'Hub no longer exists.',
                    capital_exists: 'This nation already has a capital.',
                };
                return alert(REASON[data?.reason] || ('Could not save: ' + (data?.reason || 'unknown')));
            }
            await loadHubs();
        } catch (err) { alert('Failed: ' + (err.message || String(err))); }
    });
}

async function deleteHub(hubId, btn) {
    const h = hubsAll.find(x => x.id === hubId);
    if (!confirm(`Delete hub "${h ? h.name : hubId}"?\n\nIts terminal slots and all range entries are removed. Blocked if any slot is owned or an active route uses it.`)) return;
    await withButtonLock(btn, async () => {
        try {
            const { data, error } = await _supabase.rpc('admin_delete_hub', { p_hub_id: hubId });
            if (error) throw error;
            if (!data || !data.success) {
                const REASON = {
                    has_owned_terminals: 'Cannot delete: a terminal slot here is owned by an airline.',
                    has_active_routes: 'Cannot delete: an active route uses this hub.',
                    hub_not_found: 'Hub no longer exists.',
                };
                return alert(REASON[data?.reason] || ('Could not delete: ' + (data?.reason || 'unknown')));
            }
            await loadHubs();
        } catch (err) { alert('Failed: ' + (err.message || String(err))); }
    });
}

async function saveHubRanges(btn) {
    const statusEl = document.getElementById('hub-ranges-status');
    statusEl.textContent = '';
    const pairs = [];
    document.querySelectorAll('#hub-matrix-container input[data-ri]').forEach(inp => {
        const i = parseInt(inp.dataset.ri, 10), j = parseInt(inp.dataset.rj, 10);
        const r = parseInt(inp.value, 10);
        if (Number.isFinite(r) && r > 0 && hubsAll[i] && hubsAll[j]) {
            pairs.push({ a: hubsAll[i].id, b: hubsAll[j].id, r });
        }
    });
    if (pairs.length === 0) {
        statusEl.style.color = '#e57373';
        statusEl.textContent = 'Nothing to save — enter at least one range.';
        return;
    }
    await withButtonLock(btn, async () => {
        try {
            const { data, error } = await _supabase.rpc('admin_set_hub_ranges', { p_ranges: pairs });
            if (error) throw error;
            if (!data || !data.success) {
                statusEl.style.color = '#e57373';
                statusEl.textContent = 'Could not save: ' + (data?.reason || 'unknown');
                return;
            }
            statusEl.style.color = '#81c784';
            statusEl.textContent = `Saved ${data.pairs_saved} range pair(s).`;
            await loadHubs();
        } catch (err) {
            statusEl.style.color = '#e57373';
            statusEl.textContent = 'Failed: ' + (err.message || String(err));
        }
    });
}

window.onHubNationSelect = onHubNationSelect;
window.addHub = addHub;
window.saveHub = saveHub;
window.deleteHub = deleteHub;
window.saveHubRanges = saveHubRanges;

var _prevShowTabHubs = showTab;
showTab = function(tabName) {
    _prevShowTabHubs(tabName);
    if (tabName === 'hubs') initHubsTab();
};
window.showTab = showTab;

</script>
