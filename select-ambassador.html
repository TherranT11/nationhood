<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appoint Ambassador | Nationhood Alpha</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/select-ambassador.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="top-bar"></div>

<div id="content-area">
    <div class="amb-page" id="amb-page">
        <div class="amb-loading">
            <div class="loading-spinner"></div>
            <div>Loading...</div>
        </div>
    </div>
</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { initPage, getAdminNationOverride, getAdminFactionOverride } from './js/common.js';
import { adjustMomentumAll, fetchActiveCoalition, isGovernmentAutocracy, loadSeats, syncVoteTallies, deductAP } from './js/game-common.js';
import { escapeHtml } from './js/utils.js';
(function () {
    'use strict';
const FIRST_NAMES_POOL = [
    'Carlos','Diego','Fernando','Héctor','Marcos','Ramón','José','Luis','Miguel',
    'Antonio','Roberto','Francisco','Eduardo','Pablo','Alejandro','Rafael','Gabriel',
    'Santiago','Andrés','Javier','Ricardo','Tomás','Emilio','Sergio','Nicolás',
    'Arturo','Enrique','Oscar','Felipe','Gonzalo','Ignacio','Mateo','Dante'
];
const LAST_NAMES_POOL = [
    'Velasco','Salazar','Guerrero','Ríos','Morales','Torres','Mendoza','Castillo',
    'Herrera','Vargas','Reyes','Cruz','Navarro','Delgado','Ortiz','Romero','Flores',
    'Ramírez','Guzmán','Medina','Soto','Pacheco','Ibarra','Carrasco','Espinoza',
    'Montenegro','Echeverría','Valdez','Córdoba','Aguilar','Paredes','Lara'
];

let currentNation = null;
let currentFaction = null;
let targetNation = null;
let allParties = [];
let candidates = [];
let selectedCandidateIndex = null;
let isAutocracy = false;

function diploBackUrl() {
    const params = [];
    const on = getAdminNationOverride(); if (on) params.push('nation_id=' + on);
    const of = getAdminFactionOverride(); if (of) params.push('faction_id=' + of);
    return 'diplomacy.html' + (params.length ? '?' + params.join('&') : '');
}

initPage('diplomacy', async (state) => {
    currentNation = state.nation;
    currentFaction = state.faction;

    if (!currentNation || !currentFaction) {
        renderEmpty('No nation or party found.');
        return;
    }

    isAutocracy = isGovernmentAutocracy(currentNation);

    // Get target nation from URL
    const params = new URLSearchParams(window.location.search);
    const targetId = params.get('target');
    if (!targetId) {
        renderEmpty(`No target nation specified. <a href="${diploBackUrl()}">Back to Diplomacy</a>`);
        return;
    }

    // Load target nation
    const { data: tNation } = await _supabase.from('nations').select('*').eq('id', targetId).single();
    if (!tNation) {
        renderEmpty(`Target nation not found. <a href="${diploBackUrl()}">Back to Diplomacy</a>`);
        return;
    }
    targetNation = tNation;

    // Check if already have active or pending ambassador
    const { data: existing } = await _supabase
        .from('ambassadors')
        .select('id, status')
        .eq('nation_id', currentNation.id)
        .eq('target_nation_id', targetNation.id)
        .eq('is_active', true)
        .maybeSingle();

    if (existing) {
        const statusLabel = existing.status === 'active' ? 'an active' : 'a pending';
        renderEmpty(`You already have ${statusLabel} ambassador to ${targetNation.name}. <a href="${diploBackUrl()}">Back to Diplomacy</a>`);
        return;
    }

    // Check FM role — coalition allocations first, then ministries table (autocracies)
    const coalition = await fetchActiveCoalition(_supabase, currentNation.id);
    const alloc = coalition?.ministry_allocations || {};
    let isFM = alloc.foreign === currentFaction.id;

    // In autocracies, ministers are stored in the ministries table, not coalition allocations
    if (!isFM) {
        const { data: fmEntry } = await _supabase
            .from('ministries')
            .select('party_id')
            .eq('nation_id', currentNation.id)
            .eq('ministry_key', 'foreign')
            .eq('is_active', true)
            .maybeSingle();
        if (fmEntry && fmEntry.party_id === currentFaction.id) {
            isFM = true;
        }
    }

    if (!isFM) {
        renderEmpty(`Only the Foreign Minister can appoint ambassadors. <a href="${diploBackUrl()}">Back to Diplomacy</a>`);
        return;
    }

    if (!isAutocracy && !coalition) {
        renderEmpty(`No government is currently seated. Ambassador appointments require an active government. <a href="${diploBackUrl()}">Back to Diplomacy</a>`);
        return;
    }

    if (coalition?.status === 'caretaker') {
        renderEmpty(`Appointments are suspended during caretaker government. <a href="${diploBackUrl()}">Back to Diplomacy</a>`);
        return;
    }

    // Load all active parties
    const { data: parties } = await _supabase
        .from('factions')
        .select('id, faction_name, color')
        .eq('nation_id', currentNation.id);

    // Load rejected ambassador nominations for this target nation
    const { data: rejectedAmbassadors } = await _supabase
        .from('ambassadors')
        .select('faction_id')
        .eq('nation_id', currentNation.id)
        .eq('target_nation_id', targetNation.id)
        .eq('status', 'rejected');
    const rejectedPartyIds = new Set((rejectedAmbassadors || []).map(a => a.faction_id));

    allParties = (parties || []).filter(p => !rejectedPartyIds.has(p.id));

    if (allParties.length === 0) {
        renderEmpty(`No eligible parties remain for ambassador nomination. <a href="${diploBackUrl()}">Back to Diplomacy</a>`);
        return;
    }

    generateCandidates();
    renderCandidates();
});

function generateCandidates() {
    candidates = allParties.map(party => ({
        partyId: party.id,
        partyName: party.faction_name,
        partyColor: party.color || '#888',
        firstName: FIRST_NAMES_POOL[Math.floor(Math.random() * FIRST_NAMES_POOL.length)],
        lastName: LAST_NAMES_POOL[Math.floor(Math.random() * LAST_NAMES_POOL.length)],
        age: 35 + Math.floor(Math.random() * 31)
    }));
    selectedCandidateIndex = null;
}

function renderCandidates() {
    const page = document.getElementById('amb-page');

    const cardsHTML = candidates.map((c, i) => `
        <div class="amb-card" id="amb-card-${i}" onclick="selectCandidate(${i})">
            <div class="amb-card-header">
                <div class="amb-card-avatar">👤</div>
                <div class="amb-card-name">${c.firstName} ${c.lastName}</div>
                <div class="amb-card-age">Age ${c.age}</div>
            </div>
            <div class="amb-card-party">
                <div class="amb-party-label">Party Affiliation</div>
                <div class="amb-party-tag">
                    <span class="amb-party-tag-dot" style="background:${c.partyColor}"></span>
                    ${c.partyName}
                </div>
            </div>
            <div class="amb-card-footer">
                <div class="amb-select-indicator">Select</div>
            </div>
        </div>
    `).join('');

    page.innerHTML = `
        <div class="amb-header">
            <span class="amb-header-icon">🏛️</span>
            <h1>Appoint Ambassador</h1>
            <p>Select a candidate to serve as your nation's Ambassador to <strong>${escapeHtml(targetNation.name)}</strong>.</p>
            <div class="amb-party-badge">
                <div class="amb-party-dot"></div>
                <span>Foreign Minister: <strong>${escapeHtml(currentFaction.faction_name)}</strong></span>
            </div>
        </div>

        <div class="amb-regen">
            <a onclick="regenerate()">Re-generate candidates</a>
        </div>

        <div class="amb-candidates" id="amb-candidates">
            ${cardsHTML}
        </div>

        <div class="amb-confirm-section" id="amb-confirm-section">
            <div class="amb-confirm-summary" id="amb-confirm-summary">Select a candidate above</div>
            <button class="amb-confirm-btn" id="amb-confirm-btn" disabled onclick="confirmNomination()">
                Nominate Ambassador <span class="ap-cost">1 AP</span>
            </button>
            <div class="amb-confirm-warning">${isAutocracy ? 'The ambassador will be appointed immediately.' : 'A confirmation vote will be held in Parliament (51% required).'}</div>
        </div>
    `;
}

function selectCandidate(index) {
    selectedCandidateIndex = index;
    document.querySelectorAll('.amb-card').forEach(el => el.classList.remove('selected'));
    document.getElementById('amb-card-' + index).classList.add('selected');

    const c = candidates[index];
    document.getElementById('amb-confirm-summary').innerHTML =
        `Nominate <strong>${escapeHtml(c.firstName)} ${escapeHtml(c.lastName)}</strong> (${escapeHtml(c.partyName)}) as Ambassador to <strong>${escapeHtml(targetNation.name)}</strong>`;
    document.getElementById('amb-confirm-btn').disabled = false;
}

function regenerate() {
    generateCandidates();
    renderCandidates();
}

async function confirmNomination() {
    if (selectedCandidateIndex === null) return;

    const candidate = candidates[selectedCandidateIndex];

    if ((currentFaction.action_points || 0) < 1) { alert('Not enough AP (need 1).'); return; }

    const actionLabel = isAutocracy ? 'appoint' : 'nominate';
    if (!confirm(
        `🏛️ ${actionLabel.charAt(0).toUpperCase() + actionLabel.slice(1)} ${candidate.firstName} ${candidate.lastName} as Ambassador to ${targetNation.name}?\n\n` +
        `Party: ${candidate.partyName}\n` +
        `Cost: 1 AP\n` +
        `${candidate.partyName} will gain +1 Approval.\n\n` +
        (isAutocracy ? 'The ambassador will be appointed immediately.' : 'A confirmation bill will go to a floor vote in Parliament.')
    )) return;

    const btn = document.getElementById('amb-confirm-btn');
    btn.disabled = true;
    btn.textContent = isAutocracy ? 'Appointing...' : 'Nominating...';

    try {
        // Server-side check: ensure party wasn't rejected for this post
        const { data: priorRejection } = await _supabase.from('ambassadors')
            .select('id').eq('nation_id', currentNation.id).eq('target_nation_id', targetNation.id)
            .eq('faction_id', candidate.partyId).eq('status', 'rejected').limit(1);
        if (priorRejection && priorRejection.length > 0) {
            alert('This party was previously rejected for this ambassadorship and cannot be re-nominated.');
            btn.disabled = false; btn.textContent = 'Nominate Ambassador'; return;
        }

        // Deduct 1 AP
        const apResult = await deductAP(_supabase, currentFaction.id, 1);
        if (!apResult.success) { alert('Not enough AP (need 1).'); btn.disabled = false; btn.textContent = 'Nominate Ambassador'; return; }
        currentFaction.action_points = apResult.newAp;

        // Get current tick
        const { data: shard } = await _supabase
            .from('shard')
            .select('current_tick')
            .eq('name', 'Alpha Shard')
            .single();
        const currentTick = shard?.current_tick || 0;

        let confirmationBillId = null;

        if (isAutocracy) {
            // Autocracies appoint immediately and do not file a confirmation bill.
            const { data: insertedAmbassador, error: ambError } = await _supabase
                .from('ambassadors')
                .insert({
                    nation_id: currentNation.id,
                    target_nation_id: targetNation.id,
                    faction_id: candidate.partyId,
                    ambassador_first_name: candidate.firstName,
                    ambassador_last_name: candidate.lastName,
                    ambassador_age: candidate.age,
                    status: 'active',
                    is_active: true,
                    appointed_at_tick: currentTick
                })
                .select()
                .single();

            if (ambError) throw ambError;
        } else {
            const billName = `Confirmation of ${candidate.firstName} ${candidate.lastName} as Ambassador to ${targetNation.name}`;
            const preamble = `This motion, filed by the ${currentFaction.faction_name}, confirms the appointment of ${candidate.firstName} ${candidate.lastName} (${candidate.partyName}) as Ambassador to ${targetNation.name}. A simple majority (51%) is required for confirmation.`;

            const { data: nominationResult, error: nominationError } = await _supabase.rpc('create_ambassador_nomination_with_bill', {
                p_nation_id: currentNation.id,
                p_target_nation_id: targetNation.id,
                p_faction_id: candidate.partyId,
                p_proposed_by: currentFaction.id,
                p_first_name: candidate.firstName,
                p_last_name: candidate.lastName,
                p_age: candidate.age,
                p_current_tick: currentTick,
                p_bill_name: billName,
                p_preamble: preamble,
                p_voting_ends_tick: currentTick + 6
            });

            if (nominationError) throw nominationError;

            const nominationRow = Array.isArray(nominationResult) ? nominationResult[0] : nominationResult;
            if (!nominationRow?.ambassador_id || !nominationRow?.bill_id) {
                throw new Error('Ambassador nomination failed: server did not return expected IDs.');
            }

            confirmationBillId = nominationRow.bill_id;
        }

        // +1 approval to the candidate's party
        await adjustMomentumAll(_supabase, currentNation.id, candidate.partyId, 1, 'diplomacy:ambassador_selected');

        // Democracy: auto-cast FM seats on the confirmation bill created by RPC
        if (!isAutocracy) {
            if (!confirmationBillId) throw new Error('Missing confirmation bill ID from nomination RPC.');

            // Auto-cast FM party's seats as YES
            const { data: parties } = await _supabase
                .from('factions')
                .select('id, faction_name')
                .eq('nation_id', currentNation.id);
            const seatData = await loadSeats(_supabase, currentNation.id, false, parties || [], currentFaction.id);
            const mySeats = seatData.allPartySeats[currentFaction.id] || 0;

            if (mySeats > 0) {
                await _supabase.from('bill_support').upsert({
                    bill_id: confirmationBillId,
                    faction_id: currentFaction.id,
                    stance: 'yes',
                    seat_count: mySeats
                });
            }

            // Sync vote tallies
            await syncVoteTallies(_supabase, confirmationBillId);
        }

        const msg = isAutocracy
            ? `🏛️ ${candidate.firstName} ${candidate.lastName} has been appointed Ambassador to ${targetNation.name}!`
            : `🏛️ ${candidate.firstName} ${candidate.lastName} has been nominated as Ambassador to ${targetNation.name}. A confirmation vote has been filed in Parliament.`;
        alert(msg);
        window.location.href = diploBackUrl();

    } catch (e) {
        console.error('Error nominating ambassador:', e);
        alert('Error: ' + e.message);
        btn.disabled = false;
        btn.textContent = 'Nominate Ambassador';
    }
}

function renderEmpty(message) {
    document.getElementById('amb-page').innerHTML = `
        <div class="amb-empty">
            <span style="font-size:3rem;display:block;margin-bottom:16px;opacity:0.3;">🏛️</span>
            <h3>Ambassador Appointment</h3>
            <p>${message}</p>
        </div>
    `;
}

// Expose handlers used by inline HTML attributes
window.selectCandidate = selectCandidate;
window.regenerate = regenerate;
window.confirmNomination = confirmNomination;
})();
</script>
</body>
</html>
