<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Your Party | Nationhood Alpha</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #0e0e0c;
  --bg-1: #1a1a1a;
  --bg-2: #1a1a17;
  --bg-3: #252525;
  --bg-4: #24241f;
  --bg-5: #2c2c26;
  --bg-hover: #282822;
  --text-bright: #f0efe6;
  --text-primary: #c4c2b8;
  --text-secondary: #888;
  --text-muted: #666;
  --text-dim: #4a4940;
  --text-ghost: #333229;
  --border-hair: rgba(255,255,255,0.04);
  --border-0: rgba(255,255,255,0.06);
  --border-1: rgba(255,255,255,0.08);
  --border-2: rgba(255,255,255,0.12);
  --green: #5cb85c;
  --green-faint: rgba(92,184,92,0.08);
  --green-border: rgba(92,184,92,0.18);
  --red: #d9534f;
  --red-faint: rgba(217,83,79,0.08);
  --red-border: rgba(217,83,79,0.18);
  --amber: #c8a64e;
  --amber-faint: rgba(200,166,78,0.08);
  --amber-border: rgba(200,166,78,0.18);
  --blue: #5b9bd5;
  --blue-faint: rgba(91,155,213,0.08);
  --blue-border: rgba(91,155,213,0.18);
  --purple: #8b7ec8;
  --purple-faint: rgba(139,126,200,0.08);
  --purple-border: rgba(139,126,200,0.18);
  --font-mono: 'JetBrains Mono', monospace;
  --font-ui: 'IBM Plex Sans', -apple-system, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg-0);
  color: var(--text-primary);
  font-family: var(--font-ui);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.page-header {
  text-align: center;
  padding: 48px 0 16px;
  max-width: 560px;
}
.page-header h1 {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.page-header .title {
  font-family: var(--font-ui);
  font-size: 18px;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 6px;
}
.page-header .subtitle {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  line-height: 1.5;
}

/* Ideology summary bar */
.ideo-bar {
  width: 100%;
  max-width: 560px;
  background: var(--bg-2);
  border: 1px solid var(--border-0);
  padding: 10px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.ideo-bar .label {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--text-secondary);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.ideo-bar .tags {
  display: flex;
  gap: 6px;
}
.ideo-tag {
  font-family: var(--font-mono);
  font-size: 8.5px;
  font-weight: 700;
  padding: 2px 8px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  border: 1px solid currentColor;
}

/* Form panel */
.form-panel {
  width: 100%;
  max-width: 560px;
  background: var(--bg-2);
  border: 1px solid var(--border-0);
  margin-bottom: 8px;
}
.form-panel__header {
  background: var(--bg-3);
  border-bottom: 1px solid var(--border-hair);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.form-panel__dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
}
.form-panel__title {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--text-secondary);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.form-panel__body {
  padding: 12px;
}

/* Input styling */
.input-group {
  margin-bottom: 14px;
}
.input-group:last-child {
  margin-bottom: 0;
}
.input-label {
  display: block;
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--text-secondary);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.input-label .hint {
  font-weight: 400;
  color: var(--text-muted);
  text-transform: none;
  letter-spacing: 0;
}
input[type="text"], textarea {
  width: 100%;
  padding: 8px 10px;
  background: var(--bg-1);
  border: 1px solid var(--border-1);
  color: var(--text-bright);
  font-family: var(--font-ui);
  font-size: 12px;
  transition: border-color 0.15s;
}
input[type="text"]:focus, textarea:focus {
  outline: none;
  border-color: var(--border-2);
}
textarea {
  resize: vertical;
  min-height: 48px;
  font-family: var(--font-ui);
}
.char-counter {
  text-align: right;
  font-family: var(--font-mono);
  font-size: 8px;
  color: var(--text-ghost);
  margin-top: 3px;
}
.inline-fields {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 10px;
}

/* Color palette */
.cp-color-palette {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.cp-swatch {
  width: 24px;
  height: 24px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: border-color 0.15s;
}
.cp-swatch:hover { border-color: var(--border-2); }
.cp-swatch.active { border-color: var(--text-bright); }
.cp-hex-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
}
.cp-hex-input {
  width: 72px;
  background: var(--bg-1);
  border: 1px solid var(--border-1);
  color: var(--text-bright);
  padding: 4px 6px;
  font-family: var(--font-mono);
  font-size: 10px;
}
.cp-hex-input:focus { outline: none; border-color: var(--border-2); }
.cp-color-preview {
  width: 18px;
  height: 18px;
  border: 1px solid var(--border-1);
}

/* Logo grid */
.cp-logo-grid {
  max-height: 180px;
  overflow-y: auto;
  border: 1px solid var(--border-0);
  padding: 6px;
  background: var(--bg-1);
}
.cp-icon-cat {
  font-family: var(--font-mono);
  font-size: 7px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-ghost);
  margin: 4px 0 3px;
  padding-bottom: 2px;
  border-bottom: 1px solid var(--border-hair);
}
.cp-icon-cat:first-child { margin-top: 0; }
.cp-icon-row {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  margin-bottom: 3px;
}
.cp-icon-opt {
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: 1px solid transparent;
  background: var(--bg-3);
  color: var(--text-secondary);
  transition: border-color 0.15s, background 0.15s;
}
.cp-icon-opt:hover { background: var(--bg-hover); border-color: var(--border-1); }
.cp-icon-opt.active { border-color: var(--amber); background: var(--amber-faint); }

/* Preview card */
.preview-card {
  width: 100%;
  max-width: 560px;
  background: var(--bg-2);
  border: 1px solid var(--border-0);
  margin-bottom: 12px;
}
.preview-card__header {
  background: var(--bg-3);
  border-bottom: 1px solid var(--border-hair);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.preview-card__body {
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.preview-logo {
  width: 36px;
  height: 36px;
  background: var(--bg-4);
  border: 1px solid var(--border-0);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
}
.preview-info {
  flex: 1;
}
.preview-name {
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 700;
  color: var(--text-bright);
}
.preview-abbr {
  font-family: var(--font-mono);
  font-size: 8.5px;
  font-weight: 700;
  padding: 1px 6px;
  display: inline-block;
  margin-left: 6px;
}
.preview-desc {
  font-family: var(--font-ui);
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* Action buttons */
.action-bar {
  width: 100%;
  max-width: 560px;
  display: flex;
  justify-content: space-between;
  padding-bottom: 48px;
}
.btn {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  padding: 7px 14px;
  background: var(--bg-3);
  border: 1px solid var(--border-0);
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.btn:hover {
  background: var(--bg-4);
  color: var(--text-secondary);
  border-color: var(--border-1);
}
.btn-next {
  background: var(--bg-3);
}
.btn-next:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}
.btn-next.ready {
  background: var(--green-faint);
  color: var(--green);
  border-color: var(--green-border);
}
.btn-next.ready:hover {
  background: rgba(92,184,92,0.14);
}

.error-msg {
  width: 100%;
  max-width: 560px;
  background: var(--red-faint);
  border: 1px solid var(--red-border);
  border-left: 3px solid var(--red);
  color: var(--red);
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 8px 12px;
  margin-bottom: 12px;
  display: none;
}

.loading-msg {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  text-align: center;
  padding: 80px 20px;
}

/* ── Mobile ── */
@media (max-width: 480px) {
  .inline-fields { grid-template-columns: 1fr; }
  .ideo-card { padding: 8px 10px; }
  .ideo-card .ideo-name { font-size: 11px; }
  .ideo-card .ideo-desc { font-size: 9px; }
  .form-panel { padding: 14px; }
  .cp-swatch { width: 20px; height: 20px; }
}
</style>
  <script type="module" crossorigin src="/assets/createparty-BJrU-6fT.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/supabase-client-BXEzLDpS.js">
  <link rel="modulepreload" crossorigin href="/assets/party-icons-CJ7uQoDE.js">
  <link rel="modulepreload" crossorigin href="/assets/utils-C2W-HleY.js">
</head>
<body>

<div id="loading" class="loading-msg">AUTHENTICATING...</div>

<div id="page-content" style="display:none;">
  <div class="page-header">
    <h1>Step 3 of 3</h1>
    <div class="title">Build Your Party</div>
    <div class="subtitle">Name your political party, choose a color and logo. This is how other players will see you.</div>
  </div>

  <div class="ideo-bar">
    <span class="label">Ideology</span>
    <div class="tags" id="ideo-tags"></div>
  </div>

  <div id="error-message" class="error-msg"></div>

  <!-- Name + Abbreviation -->
  <div class="form-panel">
    <div class="form-panel__header">
      <div class="form-panel__dot" style="background:var(--blue)"></div>
      <span class="form-panel__title">Identity</span>
    </div>
    <div class="form-panel__body">
      <div class="inline-fields">
        <div class="input-group">
          <label class="input-label">Party Name</label>
          <input type="text" id="party-name" placeholder="The Progressive Workers Alliance" maxlength="100">
        </div>
        <div class="input-group">
          <label class="input-label">Abbreviation</label>
          <input type="text" id="party-abbr" placeholder="PWA" maxlength="4" style="text-transform:uppercase; font-family:var(--font-mono); font-weight:700; letter-spacing:0.1em;">
          <div class="char-counter"><span id="abbr-counter">0</span>/4</div>
        </div>
      </div>
      <div class="input-group">
        <label class="input-label">Description <span class="hint">(optional, max 200 chars)</span></label>
        <textarea id="party-desc" maxlength="200" rows="2" placeholder="A brief description of your party's platform..."></textarea>
      </div>
    </div>
  </div>

  <!-- Color -->
  <div class="form-panel">
    <div class="form-panel__header">
      <div class="form-panel__dot" style="background:var(--amber)"></div>
      <span class="form-panel__title">Color</span>
    </div>
    <div class="form-panel__body">
      <div id="cp-color-palette" class="cp-color-palette"></div>
      <div class="cp-hex-row">
        <span style="font-family:var(--font-mono);font-size:8px;color:var(--text-ghost);text-transform:uppercase;letter-spacing:0.08em;">Custom</span>
        <input type="text" id="cp-custom-hex" class="cp-hex-input" maxlength="7" placeholder="#E63946">
        <div id="cp-color-preview" class="cp-color-preview"></div>
      </div>
    </div>
  </div>

  <!-- Logo -->
  <div class="form-panel">
    <div class="form-panel__header">
      <div class="form-panel__dot" style="background:var(--teal)"></div>
      <span class="form-panel__title">Logo</span>
    </div>
    <div class="form-panel__body">
      <div id="cp-logo-grid" class="cp-logo-grid"></div>
    </div>
  </div>

  <!-- Preview -->
  <div class="preview-card" id="preview-card" style="display:none;">
    <div class="preview-card__header">
      <div class="form-panel__dot" style="background:var(--green)"></div>
      <span class="form-panel__title">Preview</span>
    </div>
    <div class="preview-card__body">
      <div class="preview-logo" id="preview-logo"></div>
      <div class="preview-info">
        <span class="preview-name" id="preview-name"></span>
        <span class="preview-abbr" id="preview-abbr"></span>
        <div class="preview-desc" id="preview-desc"></div>
      </div>
    </div>
  </div>

  <div class="action-bar">
    <button class="btn" onclick="goBack()">&#x25C0; BACK</button>
    <button class="btn btn-next" id="btn-next" disabled onclick="proceed()">CREATE PARTY &#x25B6;</button>
  </div>
</div>

</body>
</html>
