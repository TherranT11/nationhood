<body>

<!-- ===== TOP BAR (rendered by common.js) ===== -->
<div id="top-bar"></div>

<!-- ===== SUBTABS (matching Actions/Home page style) ===== -->
<div id="diplo-subtabs" class="diplo-subtabs"></div>

<!-- ===== WORLD SUBTAB ===== -->
<div id="subtab-world" class="diplo-subtab-content">
<div class="world-page">
    <div class="world-top-row">
        <!-- Left column: map stacked above the All Nations grid so the
             grid sits directly under the map regardless of how tall the
             nation-highlight side panel grows. -->
        <div class="world-map-col">
            <div class="world-map-panel" id="world-map-panel">
                <img id="world-map-img" src="/assets/World%20Map%20Crucera%203.1-9pFuWCel.svg" alt="World Map" draggable="false"
                     style="width:100%;height:auto;pointer-events:none;">
                <div class="world-map-controls">
                    <div class="world-map-btn" id="map-zoom-in">+</div>
                    <div class="world-map-btn" id="map-zoom-out">&minus;</div>
                    <div class="world-map-btn" id="map-zoom-reset">&#8634;</div>
                </div>
                <div class="world-map-zoom" id="map-zoom-label">100%</div>
                <div class="world-map-hint">scroll to zoom &middot; drag to pan</div>
            </div>

            <!-- All Nations grid — populated by renderNationList(); search
                 input in the side panel filters it. -->
            <div class="world-nations-grid-wrap">
                <div class="world-nations-grid-header">ALL NATIONS</div>
                <div id="world-nations-grid" class="world-nations-grid"></div>
            </div>
        </div>

        <!-- Nation highlight panel (search + selected nation card) -->
        <div class="world-side">
            <div class="world-highlight" id="world-highlight">
                <div class="world-highlight-header">
                    <div class="world-highlight-dot" style="background:var(--accent);"></div>
                    <span class="world-highlight-title">Nation Overview</span>
                </div>
                <!-- Search input -->
                <div style="padding:8px 14px;border-bottom:1px solid var(--border-main);">
                    <input id="world-nation-search" type="text" placeholder="Search nations..." style="width:100%;padding:6px 10px;background:var(--bg-card);border:1px solid var(--border-main);color:var(--text-bright);font-family:var(--font-mono);font-size:11px;outline:none;box-sizing:border-box;">
                </div>
                <div class="world-highlight-body" id="world-highlight-body">
                    <div class="world-highlight-empty">
                        <div style="font-size:1.5rem;margin-bottom:8px;opacity:0.4;">&#127758;</div>
                        <div style="font-family:var(--font-mono);font-size:10px;">Select a nation</div>
                        <div style="font-family:var(--font-mono);font-size:8px;margin-top:4px;">Type a name above or select from the list</div>
                    </div>
                </div>
            </div>
        </div>
    </div><!-- /world-top-row -->
</div>
</div><!-- /subtab-world -->

</div>

            <div id="trade-left" style="width:480px;flex-shrink:0;display:flex;flex-direction:column;gap:8px;"></div>

</div>

    <div class="sports-page" id="sports-page">
        <div class="sports-eyebrow">— MINISTRY OF SPORTS —</div>
        <h1 class="sports-title"><span class="sports-title-accent">Vola</span> Program</h1>
        <div class="sports-subtitle" id="sports-subtitle"></div>
        <div class="sports-cards" id="sports-cards"></div>

    </div>
</div>

<!-- ═══ Trade Negotiation Modal (must be outside page container for position:fixed) ═══ -->
<div class="modal-overlay" id="trade-neg-modal" onclick="/* do not close on outside click */">
    <div class="trade-neg-modal-content" onclick="event.stopPropagation();">
        <div class="trade-neg-modal-header" id="trade-neg-header"></div>
        <div class="trade-neg-modal-body">
            <div class="trade-neg-econ trade-neg-econ--mine" id="trade-neg-my-econ"></div>
            <div class="trade-neg-main" id="trade-neg-main">
                <div id="trade-neg-articles"></div>
                <div id="trade-neg-add-article-form" style="display:none;"></div>
            </div>
            <div class="trade-neg-chat" id="trade-neg-chat-panel">
                <div class="trade-neg-chat__header">Trade Negotiations Discuss</div>
                <div class="trade-neg-chat__messages" id="trade-neg-chat-messages"></div>
                <div class="trade-neg-chat__input" id="trade-neg-chat-input-bar">
                    <input type="text" id="trade-neg-chat-input" placeholder="Type a message..." maxlength="2000">
                    <button id="trade-neg-chat-send" disabled>Send</button>
                </div>
            </div>
            <div class="trade-neg-econ trade-neg-econ--theirs" id="trade-neg-their-econ"></div>
        </div>
        <div class="trade-neg-modal-footer">
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button class="trade-neg-footer-btn trade-neg-footer-btn--add" id="trade-neg-add-structured-btn" onclick="negStructuredArticleOpen()">Add Article</button>
                <button class="trade-neg-footer-btn trade-neg-footer-btn--add" id="trade-neg-add-article-btn" onclick="negArticleShowForm()">Add Text Article</button>
                <button class="trade-neg-footer-btn trade-neg-footer-btn--add" id="trade-neg-name-btn" onclick="negNameAgreementOpen()" style="border-color:var(--amber);color:var(--amber);">Name Agreement</button>
            </div>
            <div style="display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;">
                <button class="trade-neg-footer-btn trade-neg-footer-btn--toggle" id="trade-neg-agreement-btn" onclick="negAgreementToggle()">Not in Agreement [0/2]</button>
                <button class="trade-neg-footer-btn trade-neg-footer-btn--enact" id="trade-neg-send-parliament-btn" onclick="sendTradeToParliamentFromModal()" style="display:none;">Send to Parliament</button>
                <button class="trade-neg-withdraw-btn" id="trade-neg-withdraw-btn" onclick="withdrawFromNegotiations()">Withdraw from Negotiations</button>
            </div>
        </div>
    </div>
</div>

</div>
