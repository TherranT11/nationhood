  <script type="module" crossorigin src="/assets/diplomacy-an6odc5z.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/supabase-client-CiYoFhIh.js">
  <link rel="modulepreload" crossorigin href="/assets/preload-helper-BXl3LOEh.js">
  <link rel="modulepreload" crossorigin href="/assets/common-DtfiRwOl.js">
  <link rel="modulepreload" crossorigin href="/assets/utils-CY90Gazr.js">
  <link rel="modulepreload" crossorigin href="/assets/government-types-CONVKpUN.js">

</head>
<body>

<!-- ===== TOP BAR (rendered by common.js) ===== -->
<div id="top-bar"></div>

<!-- ===== SUBTABS (matching Actions/Home page style) ===== -->
<div id="diplo-subtabs" class="diplo-subtabs"></div>

<!-- ===== WORLD SUBTAB ===== -->
<div id="subtab-world" class="diplo-subtab-content">
<div class="world-page">
    <!-- Map panel -->
    <div class="world-map-panel" id="world-map-panel">
        <img id="world-map-img" src="/assets/World%20Map%20Crucera%202.5-DcFodXsz.svg" alt="World Map" draggable="false"
             style="width:100%;height:auto;pointer-events:none;">
        <div class="world-map-controls">
            <div class="world-map-btn" id="map-zoom-in">+</div>
            <div class="world-map-btn" id="map-zoom-out">&minus;</div>
            <div class="world-map-btn" id="map-zoom-reset">&#8634;</div>
        </div>
        <div class="world-map-zoom" id="map-zoom-label">100%</div>
        <div class="world-map-hint">scroll to zoom &middot; drag to pan</div>
    </div>

    <!-- Nation highlight panel -->
    <div style="display:flex;flex-direction:column;gap:12px;flex-shrink:0;">
    <div class="world-highlight" id="world-highlight">
        <div class="world-highlight-header">
            <div class="world-highlight-dot" style="background:var(--accent);"></div>
            <span class="world-highlight-title">Nation Overview</span>
        </div>
        <!-- Search input -->
        <div style="padding:8px 14px;border-bottom:1px solid var(--border-main);">
            <input id="world-nation-search" type="text" placeholder="Search nations..." style="width:100%;padding:6px 10px;background:var(--bg-card);border:1px solid var(--border-main);color:var(--text-bright);font-family:var(--font-mono);font-size:11px;outline:none;box-sizing:border-box;">
        </div>
        <div class="world-highlight-body" id="world-highlight-body">
            <div class="world-highlight-empty">
                <div style="font-size:1.5rem;margin-bottom:8px;opacity:0.4;">&#127758;</div>
                <div style="font-family:var(--font-mono);font-size:10px;">Select a nation</div>
                <div style="font-family:var(--font-mono);font-size:8px;margin-top:4px;">Type a name above or select from the list</div>
            </div>
        </div>
    </div>

    </div>
</div>
</div><!-- /subtab-world -->

<!-- ===== TRADE SUBTAB ===== -->
<div id="subtab-trade" class="diplo-subtab-content" style="display:none;">
    <div id="trade-page" style="padding:0 12px 12px;">
        <div id="trade-header-stats"></div>
        <div style="display:flex;gap:10px;margin-top:8px;">
            <div id="trade-left" style="width:480px;flex-shrink:0;display:flex;flex-direction:column;gap:8px;"></div>
            <div id="trade-right" style="flex:1;display:flex;flex-direction:column;gap:8px;"></div>
        </div>
    </div>
</div>

<!-- Original content hidden during UI 2.0 rollout -->
<div id="content-area-disabled" style="display:none;">
    <div class="page-header" id="diplo-header"></div>
    <div class="dashboard">
        <div class="row">
            <div class="box box--third box--h450" id="box-relations">
                <div class="box-header">
                    <div class="box-dot box-dot--teal"></div>
                    <span class="box-label">Foreign Relations</span>
                    <div class="box-header-right"><span class="badge badge--dim" id="relations-count"></span></div>
                </div>
                <div class="box-body" id="relations-body"></div>
            </div>
            <div class="box box--third box--h450" id="box-actions">
                <div class="box-header">
                    <div class="box-dot box-dot--blue"></div>
                    <span class="box-label">Diplomatic Actions</span>
                </div>
                <div class="box-body" id="actions-body"></div>
            </div>
            <div class="box box--third box--h450" id="box-negotiations">
                <div class="box-header">
                    <div class="box-dot box-dot--amber"></div>
                    <span class="box-label">Agreements</span>
                    <div class="box-header-right"><span class="badge badge--amber neg-unseen-badge" id="negotiations-unseen"></span><span class="badge badge--dim" id="negotiations-count"></span></div>
                </div>
                <div class="box-body" id="negotiations-body"></div>
            </div>
        </div>
        <!-- ═══ ROW 2: Full-width Draft ═══ -->
        <div class="row">
            <!-- Draft Initiative (full width) -->
            <div class="box box--full box--h480" id="box-draft">
                <div class="box-header">
                    <div class="box-dot box-dot--teal"></div>
                    <span class="box-label">Draft Initiative</span>
                    <div class="box-header-right"><span class="badge badge--teal" id="draft-status"></span></div>
                </div>
                <div class="box-body" id="draft-body" style="display:flex;flex-direction:column;"></div>
            </div>
        </div>
    </div>
    <!-- ═══ World Nations View (hidden by default) ═══ -->
    <div id="world-nations-view" class="wn-grid wn-grid--hidden"></div>

    <!-- ═══ International Party Organisations View (hidden by default) ═══ -->
    <div id="ipo-view" class="ipo-view ipo-view--hidden"></div>

    <!-- ═══ IPO Creation Modal ═══ -->
    <div class="modal-overlay" id="ipo-create-modal">
        <div class="ipo-modal-content" id="ipo-create-modal-inner"></div>
    </div>

    <!-- ═══ Trade Negotiation Modal ═══ -->
    <div class="modal-overlay" id="trade-neg-modal">
        <div class="trade-neg-modal-content">
            <div class="trade-neg-modal-header" id="trade-neg-header"></div>
            <div class="trade-neg-modal-body">
                <div class="trade-neg-main" id="trade-neg-main">
                    <div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-dim);font-family:var(--font-mono);font-size:11px;">Trade articles will appear here in a future update.</div>
                </div>
                <div class="trade-neg-chat" id="trade-neg-chat-panel">
                    <div class="trade-neg-chat__header">Trade Negotiations Discuss</div>
                    <div class="trade-neg-chat__messages" id="trade-neg-chat-messages"></div>
                    <div class="trade-neg-chat__input" id="trade-neg-chat-input-bar">
                        <input type="text" id="trade-neg-chat-input" placeholder="Type a message..." maxlength="2000">
                        <button id="trade-neg-chat-send" disabled>Send</button>
                    </div>
                </div>
            </div>
            <div class="trade-neg-modal-footer">
                <button class="trade-neg-withdraw-btn" id="trade-neg-withdraw-btn" onclick="withdrawFromNegotiations()">Withdraw from Negotiations</button>
            </div>
        </div>
    </div>
</div>

</html>
