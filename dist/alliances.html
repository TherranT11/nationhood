<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strategic Alliances | Nationhood Alpha</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #0e0e0c;
  --bg-1: #1a1a1a;
  --bg-2: #1a1a17;
  --bg-3: #252525;
  --bg-4: #24241f;
  --bg-5: #2c2c26;
  --bg-hover: #282822;
  --text-bright: #f0efe6;
  --text-primary: #c4c2b8;
  --text-secondary: #888;
  --text-muted: #666;
  --text-dim: #4a4940;
  --text-ghost: #333229;
  --border-hair: rgba(255,255,255,0.04);
  --border-0: rgba(255,255,255,0.06);
  --border-1: rgba(255,255,255,0.08);
  --border-2: rgba(255,255,255,0.12);
  --green: #5cb85c;
  --green-faint: rgba(92,184,92,0.08);
  --green-border: rgba(92,184,92,0.18);
  --red: #d9534f;
  --amber: #c8a64e;
  --amber-faint: rgba(200,166,78,0.08);
  --amber-border: rgba(200,166,78,0.18);
  --blue: #5b9bd5;
  --blue-faint: rgba(91,155,213,0.08);
  --blue-border: rgba(91,155,213,0.18);
  --teal: #5aafa5;
  --teal-faint: rgba(90,175,165,0.08);
  --teal-border: rgba(90,175,165,0.18);
  --gold: #c8a832;
  --font-mono: 'JetBrains Mono', monospace;
  --font-ui: 'IBM Plex Sans', -apple-system, sans-serif;
  --font-serif: 'IBM Plex Serif', Georgia, serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-0); color: var(--text-primary); font-family: var(--font-ui); min-height: 100vh; }
.loading-msg { padding: 40px; text-align: center; font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }

.alliances-shell { max-width: 1200px; margin: 0 auto; padding: 48px 32px; }

/* ── List view (landing) ── */
.al-page-head {
    display: flex; justify-content: space-between; align-items: flex-end; gap: 32px;
}
.al-page-eyebrow {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em;
    color: var(--amber); text-transform: uppercase;
}
.al-page-context {
    margin-top: 6px;
    font-family: var(--font-serif); font-size: 22px; color: var(--text-bright);
}
.al-page-stats { display: flex; gap: 36px; align-items: flex-end; }
.al-stat__label {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.14em;
    color: var(--text-dim); text-transform: uppercase;
}
.al-stat__value {
    margin-top: 2px;
    font-family: var(--font-mono); font-size: 22px; font-weight: 700;
    color: var(--amber); letter-spacing: 0.02em;
}
.al-rule { margin-top: 20px; height: 1px; background: var(--border-0); }

/* 3-column stat grid for the expanded alliance card. Wraps cleanly
   with 5 stats (3 on top, 2 on bottom). */
.al-stat-grid {
    margin-top: 14px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}
@media (max-width: 720px) {
    .al-stat-grid { grid-template-columns: repeat(2, 1fr); }
}

.al-controls {
    margin-top: 20px;
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
}
.al-filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.al-filter-label {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em;
    color: var(--text-dim); text-transform: uppercase; margin-right: 8px;
}
.al-filter-pill {
    font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
    padding: 6px 12px; cursor: pointer;
    background: transparent; color: var(--text-dim);
    border: 1px solid var(--border-1);
    transition: all 0.1s;
}
.al-filter-pill:hover { color: var(--text-primary); border-color: var(--text-dim); }
.al-filter-pill.active {
    color: var(--amber); border-color: var(--amber); background: var(--amber-faint);
}

.al-found-btn {
    font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    padding: 9px 18px; cursor: pointer;
    background: var(--amber-faint); color: var(--amber);
    border: 1px solid var(--amber-border);
    transition: all 0.12s;
}
.al-found-btn:hover { background: var(--amber); color: #000; }

.al-section { margin-top: 32px; }
.al-section__title {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em;
    color: var(--text-dim); text-transform: uppercase; margin-bottom: 12px;
}
.al-empty {
    padding: 28px 24px;
    border: 1px dashed var(--border-1); background: transparent;
    text-align: center;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em;
    color: var(--text-dim); text-transform: uppercase;
}

/* Alliance row (collapsed + expanded shells — kept ready for when
   real alliance rows arrive; today the arrays are empty so these
   classes don't render but stay in CSS so the renderer is plug-in). */
.al-row {
    background: var(--bg-2); border: 1px solid var(--border-0);
    border-left: 3px solid var(--amber);
    margin-bottom: 12px;
}
.al-row__head {
    padding: 14px 16px; display: flex; align-items: center; gap: 12px;
    cursor: pointer;
}
.al-row__chevron {
    font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); width: 12px;
}
.al-row__name {
    font-family: var(--font-serif); font-size: 16px; font-weight: 600; color: var(--text-bright);
    /* Cap the name so a long charter title can't push the right-rail
       metrics off the row. flex-min-width:0 lets the cell actually
       shrink instead of holding the natural text width. */
    flex: 0 1 auto; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.al-row__tags { display: flex; gap: 4px; flex-wrap: wrap; }
.al-row__tag {
    font-family: var(--font-mono); font-size: 8px; font-weight: 700; letter-spacing: 0.08em;
    padding: 3px 7px; text-transform: uppercase;
    border: 1px solid var(--border-2); color: var(--text-dim);
}
.al-row__tag--cooperative  { color: var(--green); border-color: var(--green-border); background: var(--green-faint); }
.al-row__tag--coordinating { color: var(--blue);  border-color: var(--blue-border);  background: var(--blue-faint); }
.al-row__tag--cartel       { color: var(--red);   border-color: rgba(217,83,79,0.3); background: rgba(217,83,79,0.08); }
.al-row__metrics {
    margin-left: auto; display: flex; gap: 24px; align-items: baseline;
}
.al-row__metric { text-align: right; }
.al-row__metric-label {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.12em;
    color: var(--text-dim); text-transform: uppercase;
}
.al-row__metric-value {
    margin-top: 2px;
    font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--text-primary);
}
.al-row__sub {
    padding: 0 16px 12px 40px;
    font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); letter-spacing: 0.04em;
}
.al-row__expanded { padding: 0 16px 16px 40px; }

.al-actions {
    margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap;
    padding-top: 14px; border-top: 1px solid var(--border-0);
}
.al-actions .spacer { flex: 1 1 auto; }
.al-btn {
    font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; padding: 9px 16px; cursor: pointer;
    background: transparent; border: 1px solid var(--border-1); color: var(--text-primary);
    transition: all 0.1s;
}
.al-btn:hover:not(:disabled) { border-color: var(--text-bright); color: var(--text-bright); }
.al-btn:disabled { cursor: not-allowed; opacity: 0.45; }
.al-btn--primary { color: var(--amber); border-color: var(--amber-border); background: var(--amber-faint); }
.al-btn--leave   { color: var(--red);   border-color: rgba(217,83,79,0.3); background: rgba(217,83,79,0.04); }

/* ── Negotiation view ── */
.ng-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; margin-top: 16px; }
.ng-head__title { font-family: var(--font-serif); font-size: 28px; font-weight: 600; color: var(--text-bright); letter-spacing: -0.01em; }
.ng-head__sub { margin-top: 8px; display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }
.ng-head__metrics { display: flex; gap: 36px; align-items: flex-end; }
.ng-head__metric { text-align: right; }

.ng-grid { margin-top: 24px; display: grid; grid-template-columns: 320px 1fr; gap: 24px; align-items: start; }
@media (max-width: 1000px) { .ng-grid { grid-template-columns: 1fr; } }
.ng-left { display: flex; flex-direction: column; gap: 0; }

.ng-member {
    background: var(--bg-2); border: 1px solid var(--border-0);
    border-left: 3px solid var(--border-1);
    margin-bottom: 8px;
}
.ng-member__top { display: flex; gap: 10px; padding: 10px 12px; align-items: center; }
.ng-member__body { flex: 1 1 auto; min-width: 0; }
.ng-member__footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 12px; border-top: 1px solid var(--border-0);
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase;
}
.ng-member__status { color: var(--text-dim); }
.ng-member__vote   { color: var(--text-primary); }

.ng-tally { margin-top: 18px; padding: 14px; background: var(--bg-2); border: 1px solid var(--border-0); }
.ng-tally__row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.ng-tally__label { flex: 0 0 130px; font-family: var(--font-mono); font-size: 10px; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ng-tally__bar   { flex: 1 1 auto; height: 4px; background: var(--bg-4); }
.ng-tally__fill  { height: 100%; transition: width 0.15s; }
.ng-tally__count { flex: 0 0 28px; text-align: right; font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--text-bright); }
.ng-tally__footer { margin-top: 12px; font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); letter-spacing: 0.04em; }

.ng-right { display: flex; flex-direction: column; gap: 0; }
.ng-articles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
@media (max-width: 720px) { .ng-articles { grid-template-columns: 1fr; } }
.ng-article {
    background: var(--bg-2); border: 1px solid var(--border-0);
    padding: 14px; cursor: pointer; transition: border-color 0.1s, background 0.1s;
}
.ng-article:hover { border-color: var(--text-dim); }
.ng-article.selected { border-color: var(--amber); background: rgba(200,166,78,0.06); }
.ng-article__head { display: flex; align-items: baseline; gap: 8px; }
.ng-article__radio { color: var(--amber); font-size: 14px; line-height: 1; flex: 0 0 auto; }
.ng-article__name  { flex: 1 1 auto; font-size: 14px; font-weight: 700; color: var(--text-bright); }
.ng-article__weight { font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); letter-spacing: 0.06em; text-transform: uppercase; }
.ng-article__body  { margin-top: 8px; font-size: 12px; color: var(--text-secondary); line-height: 1.45; }
.ng-article__meta  {
    margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border-0);
    display: flex; gap: 16px;
    font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); letter-spacing: 0.06em;
}
.ng-article__meta b { color: var(--text-primary); font-weight: 700; }
.ng-article__voters {
    margin-top: 8px; display: flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); letter-spacing: 0.06em;
}

.ng-your-vote {
    margin-top: 12px; padding: 12px 14px;
    background: var(--bg-2); border: 1px solid var(--border-0);
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
}
.ng-your-vote__value { margin-top: 2px; font-size: 14px; font-weight: 700; color: var(--green); }

.ng-chat { margin-top: 18px; background: var(--bg-2); border: 1px solid var(--border-0); display: flex; flex-direction: column; }
.ng-chat__head { padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-0); }
.ng-chat__scroll { padding: 12px 14px; max-height: 360px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.ng-chat__msg-head { display: flex; align-items: baseline; gap: 8px; }
.ng-chat__msg-author { font-size: 12px; font-weight: 700; color: var(--amber); }
.ng-chat__msg-ago    { margin-left: auto; font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); }
.ng-chat__msg-body   { margin-top: 4px; font-size: 13px; color: var(--text-primary); line-height: 1.5; }
.ng-chat__compose { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--border-0); }
.ng-chat__compose .fnd-input { flex: 1 1 auto; }

/* Confirm modal (apply to open alliance) */
.al-modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: none; align-items: center; justify-content: center;
    z-index: 9700;
}
.al-modal-overlay.open { display: flex; }
.al-modal {
    width: 460px; max-width: calc(100vw - 32px);
    background: var(--bg-2); border: 1px solid var(--border-2);
    padding: 24px;
}
.al-modal__title {
    font-family: var(--font-serif); font-size: 20px; color: var(--text-bright); font-weight: 600;
}
.al-modal__body {
    margin-top: 12px; font-size: 13px; color: var(--text-secondary); line-height: 1.5;
}
.al-modal__actions {
    margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;
}

/* Aligned Interest vote modal — wider 2-column layout (vote left, chat right). */
.al-aiv-modal {
    width: 920px; max-width: calc(100vw - 24px);
    max-height: 88vh;
    background: var(--bg-2); border: 1px solid var(--border-2);
    display: flex; flex-direction: column; overflow: hidden;
}
.al-aiv-header {
    padding: 14px 18px; border-bottom: 1px solid var(--border-main, rgba(255,255,255,0.06));
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.al-aiv-title {
    font-family: var(--font-serif); font-size: 18px; color: var(--text-bright); font-weight: 600;
}
.al-aiv-subtitle {
    font-family: var(--font-mono); font-size: 10px; color: var(--text-dim);
    letter-spacing: 0.1em; text-transform: uppercase;
}
.al-aiv-body {
    display: flex; flex: 1; min-height: 0; overflow: hidden;
}
.al-aiv-vote-pane {
    flex: 1; padding: 16px 20px; overflow-y: auto;
    border-right: 1px solid var(--border-main, rgba(255,255,255,0.06));
    min-width: 0;
}
.al-aiv-chat-pane {
    width: 320px; flex-shrink: 0; display: flex; flex-direction: column; min-width: 0;
}
.al-aiv-chat-head {
    padding: 10px 14px; font-family: var(--font-mono); font-size: 9px;
    letter-spacing: 0.18em; color: var(--text-dim); text-transform: uppercase;
    border-bottom: 1px solid var(--border-main, rgba(255,255,255,0.06));
}
.al-aiv-chat-list {
    flex: 1; overflow-y: auto; padding: 10px 12px;
    display: flex; flex-direction: column; gap: 8px; min-height: 0;
}
.al-aiv-chat-msg {
    font-size: 12px; line-height: 1.45; color: var(--text-primary);
}
.al-aiv-chat-msg__head {
    font-family: var(--font-mono); font-size: 9px; color: var(--text-dim);
    letter-spacing: 0.06em; margin-bottom: 2px;
}
.al-aiv-chat-msg--observer .al-aiv-chat-msg__body { color: #6a6660; font-style: italic; }
.al-aiv-chat-msg--system   .al-aiv-chat-msg__body {
    color: var(--amber); font-family: var(--font-mono); font-size: 11px;
}
.al-aiv-chat-tag {
    display: inline-block; font-family: var(--font-mono); font-size: 8px;
    letter-spacing: 0.08em; padding: 0 4px; border: 1px solid #6a6660;
    color: #6a6660; margin-left: 4px; vertical-align: middle;
}
.al-aiv-chat-input {
    padding: 10px 12px; border-top: 1px solid var(--border-main, rgba(255,255,255,0.06));
    display: flex; gap: 6px;
}
.al-aiv-chat-input input {
    flex: 1; padding: 7px 10px; background: var(--bg-1); color: var(--text-bright);
    border: 1px solid var(--border-main, rgba(255,255,255,0.06)); font-size: 12px; outline: none;
}
.al-aiv-chat-input button {
    padding: 7px 12px; background: var(--amber); color: #000; border: none; cursor: pointer;
    font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
}
.al-aiv-chat-input button:disabled { opacity: 0.5; cursor: not-allowed; }
.al-aiv-section-label {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.18em;
    color: var(--text-dim); text-transform: uppercase; margin: 14px 0 6px;
}
.al-aiv-radios { display: flex; flex-wrap: wrap; gap: 6px; }
.al-aiv-radio {
    cursor: pointer; padding: 8px 12px; border: 1px solid var(--border-main, rgba(255,255,255,0.1));
    background: var(--bg-1); color: var(--text-secondary);
    font-family: var(--font-mono); font-size: 11px; min-width: 56px; text-align: center;
    transition: all 0.15s;
}
.al-aiv-radio:hover { border-color: var(--amber); color: var(--text-bright); }
.al-aiv-radio.selected { border-color: var(--amber); background: rgba(200,168,50,0.12); color: var(--amber); }
.al-aiv-radio.disabled { opacity: 0.4; cursor: not-allowed; }
.al-aiv-tally {
    margin-top: 14px; padding: 10px 12px; background: var(--bg-1);
    border: 1px solid var(--border-main, rgba(255,255,255,0.06));
    font-family: var(--font-mono); font-size: 11px; line-height: 1.6;
}
.al-aiv-actions {
    margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
}
.al-aiv-actions button {
    padding: 8px 14px; font-family: var(--font-mono); font-size: 10px; font-weight: 700;
    letter-spacing: 0.06em; cursor: pointer; transition: all 0.15s;
}
.al-aiv-actions button:disabled { opacity: 0.4; cursor: not-allowed; }
.al-aiv-actions .btn-submit {
    background: var(--amber); color: #000; border: 1px solid var(--amber);
}
.al-aiv-actions .btn-withdraw {
    background: transparent; color: #c55; border: 1px solid #c55;
}
.al-aiv-actions .btn-close {
    background: transparent; color: var(--text-dim); border: 1px solid var(--border-main, rgba(255,255,255,0.06));
}
.al-aiv-status {
    padding: 8px 12px; margin-bottom: 12px; border-radius: 2px;
    font-family: var(--font-mono); font-size: 11px; line-height: 1.45;
}
.al-aiv-status--info  { background: rgba(90,175,165,0.08);  border-left: 2px solid var(--accent, #5aafa5); color: var(--text-secondary); }
.al-aiv-status--warn  { background: rgba(200,150,50,0.08); border-left: 2px solid var(--amber); color: var(--text-secondary); }
.al-aiv-status--error { background: rgba(200,80,80,0.08);  border-left: 2px solid #c55; color: #c55; }
@media (max-width: 720px) {
    .al-aiv-modal { width: 100%; max-width: 100%; max-height: 100vh; border: none; }
    .al-aiv-body { flex-direction: column; overflow-y: auto; }
    .al-aiv-vote-pane { border-right: none; border-bottom: 1px solid var(--border-main, rgba(255,255,255,0.06)); }
    .al-aiv-chat-pane { width: 100%; max-height: 38vh; }
}

/* ── Found-alliance form ── */
.fnd-crumb {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-dim);
}
.fnd-crumb__link {
    color: var(--text-dim); text-decoration: none; cursor: pointer;
}
.fnd-crumb__link:hover { color: var(--text-primary); }
.fnd-crumb__sep { margin: 0 8px; color: var(--text-ghost); }
.fnd-crumb__current { color: var(--amber); }

.fnd-h1 {
    margin-top: 16px;
    font-family: var(--font-serif); font-size: 28px; font-weight: 600;
    color: var(--text-bright); letter-spacing: -0.01em;
}
.fnd-lede {
    margin-top: 8px; max-width: 720px;
    font-size: 14px; line-height: 1.5; color: var(--text-secondary);
}
.fnd-lede__highlight { color: var(--amber); }
.fnd-rule { margin-top: 28px; height: 1px; background: var(--border-0); }

.fnd-step { margin-top: 32px; }
.fnd-step__head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.fnd-step__num {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em;
    color: var(--text-dim); text-transform: uppercase;
}
.fnd-step__title {
    font-family: var(--font-serif); font-size: 18px; font-weight: 600;
