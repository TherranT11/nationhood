<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corporate Dashboard | Nationhood</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ──────────────────────────────────────────────────────────
   CORP DASHBOARD — REDESIGN
   Scoped under body.corp-redesign so the .cr-* rules don't
   leak. Uses the existing site palette (--bg-*, --text-*,
   --green/red/amber/etc.) and IBM Plex Sans/Serif + JetBrains
   Mono fonts to match corp-operations-finance.html and the
   other corp pages. Light-mode overrides included so the
   theme toggle on corp-topbar works here too.
   ────────────────────────────────────────────────────────── */
body.corp-redesign {
  --bg-0: #0e0e0c;
  --bg-1: #1a1a1a;
  --bg-2: #1a1a17;
  --bg-3: #252525;
  --bg-4: #24241f;
  --bg-5: #2c2c26;
  --bg-hover: #282822;
  --bg-card: #1a1a17;
  --bg-panel: #252525;
  --panel-main: #1f1f1a;
  --panel-border: rgba(255,255,255,0.08);
  --text-bright: #f0efe6;
  --text-primary: #c4c2b8;
  --text-secondary: #888;
  --text-muted: #666;
  --text-dim: #4a4940;
  --text-ghost: #333229;
  --border-hair: rgba(255,255,255,0.04);
  --border-0: rgba(255,255,255,0.06);
  --border-1: rgba(255,255,255,0.08);
  --border-2: rgba(255,255,255,0.12);
  --green: #5cb85c;
  --green-border: rgba(92,184,92,0.30);
  --red: #d9534f;
  --red-border: rgba(217,83,79,0.30);
  --amber: #c8a832;
  --amber-faint: rgba(200,168,50,0.08);
  --amber-border: rgba(200,168,50,0.20);
  --gold: #c8a832;
  --orange: #e8724a;
  --blue: #5bc0de;
  --teal: #5aafa5;

  --font-mono:  'JetBrains Mono', monospace;
  --font-sans:  'IBM Plex Sans', sans-serif;
  --font-serif: 'IBM Plex Serif', serif;

  background: var(--bg-0);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.45;
  margin: 0;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
body.corp-redesign * { box-sizing: border-box; }

body.corp-redesign.light-mode {
  --bg-card: #ffffff;
  --bg-panel: #faf9f5;
  --panel-main: #f8f7f2;
  --panel-border: #e8e7e0;
  --bg-0: #faf9f5;
  --bg-3: #f0eee6;
  --border-hair: #e8e7e0;
  --border-1: #e0dfd6;
  --text-bright: #1a1a17;
  --text-primary: #2d2d28;
  --text-secondary: #555550;
  --text-muted: #6a6660;
  --text-dim: #888880;
}

.cr-loading {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-dim);
  text-align: center;
  padding: 80px 20px;
}

.cr-layout {
  max-width: 1440px;
  margin: 0 auto;
  padding: 22px 22px 56px;
}

/* ── MASTHEAD ── */
.cr-masthead {
  display: grid;
  grid-template-columns: auto 1fr auto;  /* logo | identity | ticker */
  gap: 28px;
  align-items: end;
  padding-bottom: 22px;
  border-bottom: 1px solid var(--border-0);
  margin-bottom: 24px;
}
body.corp-redesign.light-mode .cr-masthead { border-bottom-color: var(--panel-border); }

/* Corp logo block — shows custom_logo_url when present, otherwise the
   first two characters of the ticker as a fallback monogram. Sized to
   sit visually balanced against the 52px serif corp name. */
.cr-corp-logo {
  width: 96px;
  height: 96px;
  border-radius: 4px;
  background: var(--bg-3);
  border: 1px solid var(--border-1);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
  margin-bottom: 6px; /* aligns visual baseline with the meta row */
}
body.corp-redesign.light-mode .cr-corp-logo {
  background: var(--bg-panel);
  border-color: var(--panel-border);
}
.cr-corp-logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.cr-corp-logo-monogram {
  font-family: var(--font-mono);
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--text-dim);
}

.cr-masthead-eyebrow {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.20em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 12px;
}
.cr-corp-name {
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: 52px;
  line-height: 0.96;
  letter-spacing: -0.01em;
  color: var(--text-bright);
  margin: 0 0 14px;
}
.cr-corp-name em {
  font-style: italic;
  color: var(--gold);
  font-weight: 500;
}
.cr-corp-meta {
  display: flex;
  gap: 20px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  flex-wrap: wrap;
}
.cr-corp-meta strong {
  color: var(--text-bright);
  font-weight: 600;
}

.cr-ticker-block {
  text-align: right;
  border-left: 1px solid var(--border-0);
  padding-left: 28px;
  min-width: 200px;
}
body.corp-redesign.light-mode .cr-ticker-block { border-left-color: var(--panel-border); }
.cr-ticker-symbol {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.16em;
  color: var(--text-dim);
  margin-bottom: 8px;
}
.cr-ticker-price {
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: 34px;
  color: var(--text-bright);
  line-height: 1;
  margin-bottom: 5px;
  font-variant-numeric: tabular-nums;
}
.cr-ticker-change {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
}
.cr-ticker-change.positive { color: var(--green); }
.cr-ticker-change.negative { color: var(--red); }

/* ── MAIN GRID ── */
.cr-main-grid {
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 22px;
}

/* ── PANEL (matches fin-card pattern from other corp pages) ── */
.cr-panel {
  background: var(--bg-card);
  border: 1px solid var(--border-1);
  display: flex;
  flex-direction: column;
}
body.corp-redesign.light-mode .cr-panel { border-color: var(--panel-border); }
/* Bespoke gold corner ticks from the original mockup are dropped — the
   dot-header pattern below replaces them. */
.cr-panel-corner { display: none; }

.cr-panel-header,
.cr-event-panel-header {
  background: var(--bg-3);
  border-bottom: 1px solid var(--border-hair);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
body.corp-redesign.light-mode .cr-panel-header,
body.corp-redesign.light-mode .cr-event-panel-header {
  background: var(--bg-panel);
  border-bottom-color: var(--panel-border);
}
.cr-panel-title {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 8px;
}
.cr-panel-title::before {
  content: '●';
  font-size: 8px;
  color: var(--gold);
}
.cr-panel-meta {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.cr-placeholder {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 0.04em;
  padding: 28px 16px;
  text-align: center;
  font-style: italic;
}
.cr-placeholder strong {
  color: var(--gold);
  font-weight: 600;
}

/* ── STATS SECTION (right column) ── */
.cr-stats-section {
  display: flex;
  flex-direction: column;
  gap: 22px;
}
.cr-section-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 12px;
}
.cr-section-header h2 {
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: 22px;
  color: var(--text-bright);
  margin: 0;
}
.cr-section-header h2 .num {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--gold);
  margin-right: 10px;
  letter-spacing: 0.06em;
  vertical-align: middle;
}
.cr-section-header .desc {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-dim);
}

/* ── FINANCIAL ROW ── */
.cr-financial-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.cr-fin-card {
  background: var(--bg-card);
  border: 1px solid var(--border-1);
  padding: 14px 14px 12px;
  position: relative;
  overflow: hidden;
}
body.corp-redesign.light-mode .cr-fin-card { border-color: var(--panel-border); }
.cr-fin-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 24px; height: 1px;
  background: var(--gold);
}
.cr-fin-card-label {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
}
.cr-fin-card-value {
  font-family: var(--font-serif);
  font-size: 26px;
  font-weight: 500;
  color: var(--text-bright);
  line-height: 1;
  margin-bottom: 6px;
  font-variant-numeric: tabular-nums;
}
.cr-fin-currency {
  font-family: var(--font-sans);
  font-size: 12px;
  color: var(--text-dim);
  font-weight: 400;
  margin-right: 1px;
  vertical-align: top;
  line-height: 26px;
}
.cr-fin-suffix {
  font-size: 14px;
  color: var(--text-dim);
}
.cr-fin-card-trend {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 0.04em;
  min-height: 13px;
}
.cr-fin-card-trend.positive { color: var(--green); }
.cr-fin-card-trend.negative { color: var(--red); }
.cr-sparkline {
  margin-top: 8px;
  height: 22px;
  width: 100%;
  opacity: 0.6;
  display: block;
}
.cr-sparkline-empty {
  margin-top: 8px;
  height: 22px;
  display: flex;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-dim);
  letter-spacing: 0.04em;
  font-style: italic;
  opacity: 0.7;
}

/* ── OPERATING INDICATORS ── */
.cr-perf-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--border-1);
  border: 1px solid var(--border-1);
}
body.corp-redesign.light-mode .cr-perf-grid {
  background: var(--panel-border);
  border-color: var(--panel-border);
}
.cr-perf-card {
  background: var(--bg-card);
  padding: 18px 20px;
  position: relative;
}
.cr-perf-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 12px;
}
.cr-perf-name {
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: 16px;
  color: var(--text-bright);
  letter-spacing: -0.005em;
}
.cr-perf-value {
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 19px;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
}
.cr-perf-value .cr-max {
  color: var(--text-dim);
  font-size: 11px;
  font-weight: 400;
}
.cr-perf-meter {
  display: flex;
  gap: 3px;
  margin-bottom: 10px;
}
.cr-perf-meter-cell {
  flex: 1;
  height: 7px;
  background: var(--bg-3);
  border: 1px solid var(--border-1);
}
body.corp-redesign.light-mode .cr-perf-meter-cell {
  background: var(--bg-panel);
  border-color: var(--panel-border);
}
.cr-perf-meter-cell.filled {
  background: var(--gold);
  border-color: var(--gold);
}
.cr-perf-meter-cell.filled.warn {
  background: var(--red);
  border-color: var(--red);
}
.cr-perf-meter-cell.filled.good {
  background: var(--green);
  border-color: var(--green);
}
.cr-perf-desc {
  font-size: 11px;
  line-height: 1.5;
  color: var(--text-secondary);
  font-family: var(--font-sans);
}
.cr-perf-desc strong {
  color: var(--text-bright);
  font-weight: 500;
}
/* ── OWNERSHIP CARD (renders inside the perf grid) ── */
.cr-ownership-bar {
  display: flex;
  height: 8px;
  margin-bottom: 14px;
  background: var(--bg-3);
  border: 1px solid var(--border-1);
}
body.corp-redesign.light-mode .cr-ownership-bar {
  background: var(--bg-panel);
  border-color: var(--panel-border);
}
.cr-ownership-bar > div { transition: opacity 0.15s; }
.cr-ownership-bar > div:hover { opacity: 0.75; }
.cr-ownership-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 0;
  padding: 0;
}
.cr-ownership-list li {
  display: grid;
  grid-template-columns: 8px 1fr auto;
  gap: 10px;
  align-items: center;
  font-size: 11px;
  line-height: 1;
}
.cr-ownership-swatch { width: 8px; height: 8px; border-radius: 1px; }
.cr-ownership-name {
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 11px;
}
.cr-ownership-pct {
  font-family: var(--font-mono);
  font-weight: 600;
  color: var(--text-bright);
  font-variant-numeric: tabular-nums;
  font-size: 11px;
}
.cr-you-tag {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 5px;
  background: var(--gold);
  color: var(--bg-0);
  font-family: var(--font-mono);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.08em;
  border-radius: 1px;
  vertical-align: middle;
}
.cr-ownership-empty {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  font-style: italic;
  padding: 8px 0;
}

/* ── DISPATCHES FEED ── */
.cr-event-tab-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-hair);
  flex-wrap: wrap;
}
body.corp-redesign.light-mode .cr-event-tab-row { border-bottom-color: var(--panel-border); }
.cr-event-tab-bar {
  display: flex;
  gap: 0;
}
.cr-event-tab {
  background: transparent;
  border: 1px solid var(--border-1);
  padding: 4px 9px;
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s;
  border-right: none;
}
body.corp-redesign.light-mode .cr-event-tab { border-color: var(--panel-border); }
.cr-event-tab:last-child { border-right: 1px solid var(--border-1); }
body.corp-redesign.light-mode .cr-event-tab:last-child { border-right-color: var(--panel-border); }
.cr-event-tab:hover:not(.active) {
  color: var(--text-secondary);
  background: var(--bg-3);
}
body.corp-redesign.light-mode .cr-event-tab:hover:not(.active) { background: var(--bg-panel); }
.cr-event-tab.active {
  color: var(--bg-0);
  background: var(--gold);
  border-color: var(--gold);
}
.cr-event-tab.active + .cr-event-tab { border-left-color: var(--gold); }

.cr-event-list {
  list-style: none;
  margin: 0;
  padding: 0 14px;
  display: flex;
  flex-direction: column;
  max-height: 720px;
  overflow-y: auto;
}
.cr-event-list::-webkit-scrollbar { width: 4px; }
.cr-event-list::-webkit-scrollbar-track { background: transparent; }
.cr-event-list::-webkit-scrollbar-thumb { background: var(--border-1); border-radius: 2px; }
.cr-event-item {
  padding: 12px 0;
  border-bottom: 1px solid var(--border-hair);
  position: relative;
}
body.corp-redesign.light-mode .cr-event-item { border-bottom-color: var(--panel-border); }
.cr-event-item:last-child { border-bottom: none; }
.cr-event-item::before {
  content: '';
  position: absolute;
  left: -14px; top: 0; bottom: 0;
  width: 2px;
  background: transparent;
}
.cr-event-item.cat-politics::before  { background: var(--blue);  opacity: 0.6; }
.cr-event-item.cat-corporate::before { background: var(--gold);  opacity: 0.6; }

.cr-event-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
  gap: 8px;
}
.cr-event-tag {
  font-family: var(--font-mono);
  font-size: 8.5px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 2px 6px;
  border: 1px solid var(--border-1);
  color: var(--text-muted);
  background: var(--bg-3);
}
body.corp-redesign.light-mode .cr-event-tag { background: var(--bg-panel); border-color: var(--panel-border); }
.cr-event-tag.tag-politics {
  color: var(--blue);
  border-color: rgba(91,192,222,0.35);
  background: rgba(91,192,222,0.08);
}
.cr-event-tag.tag-corporate {
  color: var(--gold);
  border-color: var(--amber-border);
  background: var(--amber-faint);
}
.cr-event-nation {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-dim);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.cr-event-flag {
  width: 14px;
  height: 9px;
  object-fit: cover;
  border-radius: 1px;
  flex-shrink: 0;
}
.cr-event-time {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  margin-left: auto;
}
.cr-event-headline {
  font-family: var(--font-serif);
  font-weight: 500;
  font-size: 13.5px;
  line-height: 1.35;
  color: var(--text-bright);
  margin-bottom: 5px;
  letter-spacing: -0.005em;
}
.cr-event-body {
  font-size: 11.5px;
  line-height: 1.5;
  color: var(--text-secondary);
}
.cr-event-empty {
  padding: 24px 0;
  text-align: center;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  font-style: italic;
  letter-spacing: 0.04em;
  list-style: none;
}

/* ── FOOTER STRIP ── */
.cr-footer-strip {
  margin-top: 28px;
  padding: 12px 0;
  border-top: 1px solid var(--border-0);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-dim);
}
body.corp-redesign.light-mode .cr-footer-strip { border-top-color: var(--panel-border); }
.cr-footer-strip em {
  font-family: var(--font-serif);
  font-style: italic;
  color: var(--gold);
  text-transform: none;
  letter-spacing: 0;
  font-size: 11px;
}

/* ── RESPONSIVE ── */
@media (max-width: 1100px) {
  .cr-main-grid { grid-template-columns: 1fr; }
  .cr-corp-name { font-size: 40px; }
  .cr-financial-row { grid-template-columns: repeat(2, 1fr); }
  /* Logo + identity stay together on the left, ticker drops below. */
  .cr-masthead { grid-template-columns: auto 1fr; }
  .cr-ticker-block {
    grid-column: 1 / -1;
    border-left: none;
    padding-left: 0;
    text-align: left;
    border-top: 1px solid var(--border-0);
    padding-top: 16px;
    margin-top: 8px;
  }
  body.corp-redesign.light-mode .cr-ticker-block { border-top-color: var(--panel-border); }
}
@media (max-width: 720px) {
  .cr-layout { padding: 16px 14px 40px; }
  .cr-masthead { grid-template-columns: 1fr; }
  .cr-corp-logo { width: 72px; height: 72px; }
  .cr-corp-logo-monogram { font-size: 22px; }
  .cr-corp-name { font-size: 32px; }
  .cr-perf-grid { grid-template-columns: 1fr; }
}
