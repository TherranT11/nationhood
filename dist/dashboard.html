<style>
/* ── Home subtab bar ── */
.home-subtabs {
    display: flex;
    gap: 0;
    padding: 0 22px;
    background: var(--bg-body);
    border-bottom: 1px solid var(--border-main);
}
.home-subtab {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 9px 18px;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: color 0.15s;
}
.home-subtab:hover {
    color: var(--text-secondary);
}
.home-subtab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
}

/* ── Content panels ── */
.home-panel { display: none; }
.home-panel.active { display: block; flex: 1; overflow-y: auto; min-height: 0; }

/* ── Broadcast placeholder (until Phase 3) ── */
.broadcast-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 160px);
    text-align: center;
    color: var(--text-secondary);
    padding: 40px 20px;
}
.broadcast-placeholder-icon {
    font-size: 2.5rem;
    margin-bottom: 16px;
    opacity: 0.4;
}
.broadcast-placeholder-title {
    font-family: var(--font-mono);
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
}
.broadcast-placeholder-desc {
    font-size: 0.85rem;
    color: var(--text-muted);
    max-width: 400px;
    line-height: 1.5;
}

/* ── Mobile ── */
@media (max-width: 480px) {
    .home-subtabs { padding: 0 10px; }
    .home-subtab { padding: 8px 12px; font-size: 9px; }
}
</style>

<!-- Subtab bar: NEWS / BROADCAST -->

    <button class="home-subtab active" data-panel="news" id="subtab-news">News</button>
    <button class="home-subtab" data-panel="broadcast" id="subtab-broadcast">Broadcast</button>
</div>

<!-- NEWS panel — newspaper content (rendered by news.js) -->
<div class="home-panel active" id="panel-news">
    <div id="newspaper-root"></div>
</div>

<!-- BROADCAST panel — radio system -->

    <div id="broadcast-root">

    </div>
