<style>
/* ── Home subtab bar ── */
.home-subtabs {
    display: flex;
    gap: 0;
    padding: 0 22px;
    background: var(--bg-body);
    border-bottom: 1px solid var(--border-main);
    /* Horizontal scroll fallback if more subtabs land later. */
    overflow-x: auto;
    scrollbar-width: none;
}
.home-subtabs::-webkit-scrollbar { display: none; }
.home-subtab {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 9px 18px;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: color 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
}
.home-subtab:hover {
    color: var(--text-secondary);
}
.home-subtab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
}

/* ── Content panels ── */
.home-panel { display: none; }
.home-panel.active { display: block; flex: 1; overflow-y: auto; min-height: 0; }

/* ── Mobile ──
   Bigger tap targets (≥44px per WCAG 2.5.5). */
@media (max-width: 768px) {
    .home-subtabs { padding: 0 12px; }
    .home-subtab { padding: 12px 16px; font-size: 11px; }
}
@media (max-width: 480px) {
    .home-subtabs { padding: 0 8px; }
    .home-subtab { padding: 12px 14px; font-size: 10px; letter-spacing: 0.08em; }
}
</style>
