<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Neptune | Nationhood Alpha</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #0e0e0c; --bg-1: #1a1a1a; --bg-2: #1a1a17; --bg-3: #252525;
  --text-bright: #f0efe6; --text-primary: #c4c2b8; --text-secondary: #888;
  --text-muted: #666; --text-dim: #4a4940;
  --border-1: rgba(255,255,255,0.08); --border-2: rgba(255,255,255,0.12);
  --red: #d9534f; --teal: #5aafa5; --teal-faint: rgba(90,175,165,0.08); --teal-border: rgba(90,175,165,0.3);
  --font-mono: 'JetBrains Mono', monospace; --font-ui: 'IBM Plex Sans', -apple-system, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-0); color: var(--text-primary); font-family: var(--font-ui);
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.card { width: 100%; max-width: 440px; background: var(--bg-2); border: 1px solid var(--border-1); padding: 36px 32px; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--teal); margin-bottom: 10px; }
.title { font-family: var(--font-ui); font-size: 20px; font-weight: 700; color: var(--text-bright); margin-bottom: 6px; }
.subtitle { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); line-height: 1.6; margin-bottom: 24px; }
.label { display: block; font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; }
.code-input { width: 100%; padding: 12px; font-family: var(--font-mono); font-size: 14px; background: var(--bg-1);
  border: 1px solid var(--border-2); color: var(--text-bright); outline: none; }
.code-input:focus { border-color: var(--teal-border); }
.error { display: none; font-family: var(--font-mono); font-size: 10px; color: var(--red); margin-top: 10px; }
.actions { display: flex; gap: 10px; margin-top: 24px; }
.btn { flex: 1; padding: 12px; font-family: var(--font-mono); font-size: 11px; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; transition: all 0.15s; border: 1px solid var(--border-2); }
.btn--cancel { background: transparent; color: var(--text-muted); }
.btn--cancel:hover { color: var(--text-bright); border-color: var(--text-muted); }
.btn--confirm { background: var(--teal-faint); color: var(--teal); border-color: var(--teal-border); }
.btn--confirm:hover { background: var(--teal); color: var(--bg-0); }
.loading { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }
</style>
  <script type="module" crossorigin src="/assets/character-select-D4OXn8TH.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/supabase-client-BXEzLDpS.js">
</head>
<body>

<div id="loading" class="loading">AUTHENTICATING...</div>

<div id="gate" class="card" style="display:none;">
  <div class="eyebrow">Project Neptune</div>
  <div class="title">Alpha Code Required</div>
  <div class="subtitle">Project Neptune is in closed alpha. Enter your access code to continue.</div>

  <label class="label" for="np-code">Alpha Code</label>
  <input type="password" id="np-code" class="code-input" placeholder="Enter your access code..." maxlength="40" autocomplete="off">
  <div id="np-error" class="error">Incorrect code.</div>

  <div class="actions">
    <button class="btn btn--cancel" id="np-cancel">Cancel</button>
    <button class="btn btn--confirm" id="np-confirm">Confirm</button>
  </div>
</div>

</body>
</html>
