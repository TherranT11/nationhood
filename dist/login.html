<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nationhood | Faction Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/login-DfJs0jjo.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/supabase-client-BXEzLDpS.js">
  <link rel="stylesheet" crossorigin href="/assets/login-IaTQuOY2.css">
</head>
<body>
<div class="page-title">Nationhood</div>
<div class="login-card">
    <div class="login-header">
        <span class="dot"></span>
        <span class="title">Faction Login</span>
    </div>
    <div class="login-body">
        <div class="initials-block">
            <div class="initials-icon">NH</div>
            <div class="initials-subtitle">Enter the Chronicle</div>
        </div>
        <div class="rule"></div>
        <form id="login-form">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <div class="forgot-link">
                <a href="forgot-password.html">Forgot password?</a>
            </div>
            <button type="submit" class="btn-login" id="submit-btn">Enter the Chronicle</button>
            <div id="error-message" class="error"></div>
            <div id="success-message" class="success"></div>
        </form>
        <div class="signup-link">
            New to the continent? <a href="signup.html">Establish a Faction</a>
        </div>
    </div>
</div>
</body>
</html>
