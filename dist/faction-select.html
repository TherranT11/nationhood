<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose Your Ideology | Nationhood Alpha</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #0e0e0c;
  --bg-1: #1a1a1a;
  --bg-2: #1a1a17;
  --bg-3: #252525;
  --bg-4: #24241f;
  --bg-5: #2c2c26;
  --bg-hover: #282822;
  --text-bright: #f0efe6;
  --text-primary: #c4c2b8;
  --text-secondary: #888;
  --text-muted: #666;
  --text-dim: #4a4940;
  --text-ghost: #333229;
  --border-hair: rgba(255,255,255,0.04);
  --border-0: rgba(255,255,255,0.06);
  --border-1: rgba(255,255,255,0.08);
  --border-2: rgba(255,255,255,0.12);
  --green: #5cb85c;
  --green-faint: rgba(92,184,92,0.08);
  --green-border: rgba(92,184,92,0.18);
  --red: #d9534f;
  --red-faint: rgba(217,83,79,0.08);
  --red-border: rgba(217,83,79,0.18);
  --amber: #c8a64e;
  --amber-faint: rgba(200,166,78,0.08);
  --amber-border: rgba(200,166,78,0.18);
  --blue: #5b9bd5;
  --blue-faint: rgba(91,155,213,0.08);
  --blue-border: rgba(91,155,213,0.18);
  --purple: #8b7ec8;
  --purple-faint: rgba(139,126,200,0.08);
  --purple-border: rgba(139,126,200,0.18);
  --teal: #5aafa5;
  --teal-faint: rgba(90,175,165,0.08);
  --teal-border: rgba(90,175,165,0.18);
  --orange: #d48a3c;
  --orange-faint: rgba(212,138,60,0.08);
  --orange-border: rgba(212,138,60,0.18);
  --font-mono: 'JetBrains Mono', monospace;
  --font-ui: 'IBM Plex Sans', -apple-system, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg-0);
  color: var(--text-primary);
  font-family: var(--font-ui);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.page-header {
  text-align: center;
  padding: 48px 20px 12px;
  max-width: 640px;
}
.page-header h1 {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.page-header .title {
  font-family: var(--font-ui);
  font-size: 18px;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 6px;
}
.page-header .subtitle {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  line-height: 1.5;
}

.axes-container {
  width: 100%;
  max-width: 640px;
  padding: 0 16px 24px;
}

.axis-block {
  background: var(--bg-2);
  border: 1px solid var(--border-0);
  margin-bottom: 8px;
}
.axis-header {
  background: var(--bg-3);
  border-bottom: 1px solid var(--border-hair);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.axis-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--purple);
}
.axis-label {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.axis-body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  padding: 10px;
}
.ideo-card {
  background: var(--bg-3);
  border: 1px solid var(--border-0);
  padding: 10px 12px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.ideo-card:hover {
  background: var(--bg-hover);
  border-color: var(--border-1);
}
.ideo-card.selected {
  background: var(--blue-faint);
  border-color: var(--blue-border);
}
.ideo-card.disabled {
  opacity: 0.25;
  cursor: not-allowed;
  pointer-events: none;
}
.ideo-name {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.ideo-card.selected .ideo-name {
  /* color inherited from inline style per ideology */
}
.ideo-desc {
  font-family: var(--font-ui);
  font-size: 10px;
  color: var(--text-muted);
  line-height: 1.4;
}

.selection-bar {
  width: 100%;
  max-width: 640px;
  padding: 0 16px;
  margin-bottom: 16px;
}
.selection-inner {
  background: var(--bg-2);
  border: 1px solid var(--border-0);
  padding: 10px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sel-label {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.sel-tags {
  display: flex;
  gap: 6px;
}
.sel-tag {
  font-family: var(--font-mono);
  font-size: 8.5px;
  font-weight: 700;
  padding: 2px 8px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  background: var(--blue-faint);
  color: var(--blue);
  border: 1px solid var(--blue-border);
}
.sel-placeholder {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-dim);
}

.action-bar {
  width: 100%;
  max-width: 640px;
  padding: 0 16px 48px;
  display: flex;
  justify-content: flex-end;
}
.btn-next {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  padding: 7px 14px;
  background: var(--bg-3);
  border: 1px solid var(--border-0);
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.btn-next:hover:not(:disabled) {
  background: var(--bg-4);
  color: var(--text-secondary);
  border-color: var(--border-1);
}
.btn-next:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}
.btn-next.ready {
  background: var(--green-faint);
  color: var(--green);
  border-color: var(--green-border);
}
.btn-next.ready:hover {
  background: rgba(92,184,92,0.14);
}

.loading-msg {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  text-align: center;
  padding: 80px 20px;
}
</style>

</head>

  <div class="page-header">
    <h1>Step 2 of 3</h1>
    <div class="title">Define Your Political Identity</div>
    <div class="subtitle">Select exactly 2 ideologies from different axes. Each choice locks out its opposite. These will shape your party's platform and voter appeal.</div>
  </div>

  <div class="axes-container" id="axes-container"></div>

  <div class="selection-bar">
    <div class="selection-inner">
      <span class="sel-label">Selected</span>
      <div id="sel-tags" class="sel-tags">
        <span class="sel-placeholder">Pick 2 ideologies</span>
      </div>
    </div>
  </div>

  <div class="action-bar" style="display:flex;justify-content:space-between;">
    <button class="btn-next" style="background:var(--bg-3);color:var(--text-muted);" onclick="goBack()">&#x25C0; BACK</button>
    <button class="btn-next" id="btn-next" disabled onclick="proceed()">CONTINUE &#x25B6;</button>
  </div>
</div>

</body>
</html>
