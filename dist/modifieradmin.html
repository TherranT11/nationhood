<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modifier Admin | Nationhood Alpha</title>
<style>
  :root {
    --bg:        #0d0d0d;
    --panel:    #141414;
    --panel-2:  #1a1a1a;
    --panel-3:  #252525;
    --border:   #333;
    --border-2: #444;
    --text:     #e0e0e0;
    --muted:    #888;
    --dim:      #666;

    /* Severity palette (matches the user-facing modifier page) */
    --sev-green:  #4ec98a;
    --sev-yellow: #c8a64e;
    --sev-red:    #d97070;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; }

  .admin-container { max-width: 1200px; margin: 0 auto; padding: 24px; }
  .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;
    border-bottom: 2px solid var(--sev-green); padding-bottom: 16px; }
  .admin-title { font-size: 1.6rem; color: var(--sev-green); font-weight: bold;
    text-transform: uppercase; letter-spacing: 2px; }
  .admin-subtitle { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
  .admin-actions { display: flex; gap: 10px; }

  .btn { padding: 10px 18px; border: none; border-radius: 6px; font-weight: bold; font-size: 0.82rem;
    cursor: pointer; transition: all 0.15s; text-transform: uppercase; letter-spacing: 0.5px; }
  .btn:hover { transform: translateY(-1px); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-primary { background: linear-gradient(135deg, var(--sev-green), #3a9468); color: #07140d; }
  .btn-primary:hover { box-shadow: 0 4px 12px rgba(78, 201, 138, 0.25); }
  .btn-danger { background: var(--sev-red); color: #fff; }
  .btn-ghost { background: var(--panel-3); color: #aaa; border: 1px solid var(--border-2); }
  .btn-ghost:hover { color: #fff; border-color: var(--dim); }
  .btn-small { padding: 6px 12px; font-size: 0.72rem; }
  .btn-icon { padding: 6px 10px; font-size: 0.85rem; background: none; border: 1px solid var(--border-2);
    color: var(--muted); border-radius: 4px; cursor: pointer; }
  .btn-icon:hover { color: var(--sev-red); border-color: var(--sev-red); }
  .btn-back { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.9rem;
    display: inline-flex; align-items: center; gap: 6px; margin-bottom: 16px; padding: 0; }
  .btn-back:hover { color: var(--sev-green); }

  .filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
  .filters input, .filters select { padding: 9px 12px; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 5px; color: var(--text); font-size: 0.85rem; }
  .filters input { flex: 1; min-width: 200px; }
  .filters input:focus, .filters select:focus { outline: none; border-color: var(--sev-green); }
  .mod-count { color: var(--muted); font-size: 0.82rem; margin-left: auto; }

  .mod-card { background: var(--panel-2); border-radius: 8px; padding: 14px 20px; margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center; cursor: pointer;
    transition: all 0.15s; border-left: 4px solid var(--border); }
  .mod-card:hover { background: #1f1f1f; transform: translateX(4px); }
  .mod-card[data-sev="green"]  { border-left-color: var(--sev-green); }
  .mod-card[data-sev="yellow"] { border-left-color: var(--sev-yellow); }
  .mod-card[data-sev="red"]    { border-left-color: var(--sev-red); }
  .mod-card.inactive { opacity: 0.45; }
  .mod-card-left { flex: 1; min-width: 0; }
  .mod-card-name { font-weight: bold; font-size: 0.98rem; margin-bottom: 4px; color: #fff; }
  .mod-card-meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 0.74rem;
    color: var(--muted); align-items: center; }

  .tag { display: inline-block; padding: 3px 9px; border-radius: 3px; font-size: 0.66rem;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .tag-cat     { background: #1a2030; color: #88a0c8; border: 1px solid #3a4868; }
  .tag-trig    { background: #2a1f1a; color: #d49a7a; border: 1px solid #6d4a30; }
  .tag-end     { background: #1a2a1a; color: var(--sev-green); border: 1px solid #3a6a4a; }
  .tag-fx      { background: #2a1a2a; color: #c87adc; border: 1px solid #6a3a6e; }
  .tag-sev-green   { background: rgba(78,201,138,0.12); color: var(--sev-green); }
  .tag-sev-yellow  { background: rgba(200,166,78,0.12); color: var(--sev-yellow); }
  .tag-sev-red     { background: rgba(217,112,112,0.12); color: var(--sev-red); }
  .tag-inactive    { background: var(--panel-2); color: var(--dim); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--dim); font-size: 0.9rem; }
  .empty-state-icon { font-size: 2rem; margin-bottom: 12px; opacity: 0.5; }

  .editor { background: var(--panel); border: 2px solid var(--border); border-radius: 12px; overflow: hidden; }
  .editor-header { background: var(--panel-2); padding: 18px 22px;
    border-bottom: 2px solid var(--sev-green); display: flex; justify-content: space-between; align-items: center; }
  .editor-title { font-size: 1.15rem; color: var(--sev-green); font-weight: bold;
    text-transform: uppercase; letter-spacing: 1px; }
  .editor-body { padding: 22px; }
  .editor-footer { padding: 16px 22px; background: var(--panel-2); border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end; gap: 10px; }

  .form-row { display: grid; gap: 14px; margin-bottom: 14px; }
  .form-row.cols-2 { grid-template-columns: 1fr 1fr; }
  .form-row.cols-3 { grid-template-columns: 2fr 1fr 1fr; }
  .form-group { margin-bottom: 14px; }
  .form-label { display: block; font-size: 0.72rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; font-weight: bold; }
  .form-input, .form-select, .form-textarea { width: 100%; padding: 10px 12px; background: var(--panel-3);
    border: 1px solid var(--border-2); border-radius: 6px; color: var(--text); font-size: 0.88rem;
    font-family: inherit; }
  .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--sev-green); }
  .form-textarea { min-height: 70px; resize: vertical; }
  .form-hint { font-size: 0.72rem; color: var(--dim); margin-top: 4px; }

  .editor-section { background: var(--panel-2); border-radius: 8px; padding: 14px 18px;
    margin-bottom: 14px; border: 1px solid var(--border); }
  .editor-section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .editor-section-title { font-size: 0.84rem; font-weight: bold; text-transform: uppercase;
    letter-spacing: 1px; color: #cfcabf; }
  .editor-section-title.end { color: var(--sev-green); }

  .trigger-item, .end-trigger-item {
    display: grid; grid-template-columns: 1.6fr 1fr 1fr auto;
    gap: 8px; align-items: center; margin-bottom: 8px;
  }
  .effect-item { display: grid; grid-template-columns: 1fr auto; gap: 8px;
    align-items: center; margin-bottom: 8px; }

  .section-divider { text-align: center; color: var(--dim); font-size: 0.72rem;
    text-transform: uppercase; letter-spacing: 2px; margin: 14px 0; }
  .section-divider::before, .section-divider::after { content: ''; display: inline-block;
    width: 60px; height: 1px; background: var(--border); vertical-align: middle; margin: 0 12px; }

  /* Severity radio group */
  .sev-radio { display: flex; gap: 8px; }
  .sev-radio label { flex: 1; padding: 10px; text-align: center; background: var(--panel-3);
    border: 1px solid var(--border-2); border-radius: 6px; cursor: pointer; font-size: 0.78rem;
    text-transform: uppercase; letter-spacing: 1px; font-weight: bold; transition: all 0.15s; }
  .sev-radio input { display: none; }
  .sev-radio input + span { display: block; }
  .sev-radio label[data-sev="green"]:hover  { border-color: var(--sev-green); color: var(--sev-green); }
  .sev-radio label[data-sev="yellow"]:hover { border-color: var(--sev-yellow); color: var(--sev-yellow); }
  .sev-radio label[data-sev="red"]:hover    { border-color: var(--sev-red); color: var(--sev-red); }
  .sev-radio label.selected[data-sev="green"]  { background: rgba(78,201,138,0.14);
    border-color: var(--sev-green); color: var(--sev-green); }
  .sev-radio label.selected[data-sev="yellow"] { background: rgba(200,166,78,0.14);
    border-color: var(--sev-yellow); color: var(--sev-yellow); }
  .sev-radio label.selected[data-sev="red"]    { background: rgba(217,112,112,0.14);
    border-color: var(--sev-red); color: var(--sev-red); }

  /* Active toggle */
  .toggle-wrap { display: flex; gap: 12px; align-items: center; margin-top: 6px; }
  .toggle { position: relative; display: inline-block; width: 44px; height: 22px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider { position: absolute; cursor: pointer; inset: 0; background: var(--panel-3);
    border: 1px solid var(--border-2); border-radius: 22px; transition: 0.2s; }
  .toggle-slider::before { position: absolute; content: ""; height: 16px; width: 16px;
    left: 2px; top: 2px; background: var(--muted); border-radius: 50%; transition: 0.2s; }
  .toggle input:checked + .toggle-slider { background: rgba(78,201,138,0.2); border-color: var(--sev-green); }
  .toggle input:checked + .toggle-slider::before { transform: translateX(22px); background: var(--sev-green); }
  .toggle-label { font-size: 0.82rem; color: var(--muted); }

  .loading-container { display: flex; flex-direction: column; align-items: center; padding: 80px 20px;
    color: var(--muted); }
  .loading-spinner { width: 32px; height: 32px; border: 3px solid var(--border);
    border-top-color: var(--sev-green); border-radius: 50%; animation: spin 0.8s linear infinite;
    margin-bottom: 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 700px) {
    .admin-container { padding: 14px; }
    .admin-header { flex-direction: column; align-items: flex-start; gap: 12px; }
    .form-row.cols-2, .form-row.cols-3 { grid-template-columns: 1fr; }
    .trigger-item, .end-trigger-item { grid-template-columns: 1fr; }
    .mod-card { flex-direction: column; align-items: flex-start; gap: 10px; }
  }
</style>

<body>
<div class="admin-container" id="content-area">
