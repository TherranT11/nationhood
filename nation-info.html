<!-- Loading state -->

<!-- Main 3-column layout (hidden until loaded) -->
<div id="page" class="encyclopedia-layout" style="display:none;">

    <!-- ===== LEFT: Table of Contents ===== -->
    <nav class="toc-column">
        <div class="toc-title">Contents</div>
        <a class="toc-link" href="#overview">Overview</a>
        <a class="toc-link" href="#history">History</a>

        <a class="toc-link" href="#labor">Labor</a>
        <a class="toc-link" href="#healthcare">Healthcare</a>
        <a class="toc-link" href="#education">Education</a>
        <a class="toc-link" href="#infrastructure">Infrastructure</a>
        <a class="toc-link" href="#resources">Resources</a>
        <a class="toc-link" href="#society">Society</a>

    <!-- ===== CENTER: Main Content ===== -->

                <img id="nation-flag" class="nation-flag" src="" alt="Flag" onerror="this.style.display='none';">
                <div class="nation-title-block">
                    <h1 class="nation-title" id="nation-title"></h1>
                    <div class="nation-subtitle" id="gov-type"></div>
                    <div class="nation-motto editable">

                        <span class="edit-field"><input class="edit-input-sm" id="motto-edit" placeholder="National motto"></span>
                    </div>
                </div>
                <button class="edit-toggle" id="edit-toggle" style="display:none;" onclick="toggleEditMode()">Edit</button>
            </div>
        </div>

        <!-- Overview -->
        <div id="overview" class="section-anchor"></div>
        <div class="section-heading"><span class="icon">&#128214;</span> Overview</div>
        <div class="editable">
            <div class="view-field overview-text" id="overview-view"></div>
            <div class="edit-field"><textarea class="edit-textarea" id="overview-edit" placeholder="Nation overview..."></textarea></div>
        </div>

        <!-- History -->
        <div id="history" class="section-anchor"></div>
        <div class="section-heading"><span class="icon">&#128220;</span> History</div>
        <div id="timeline-container"></div>

        <!-- Government -->
        <div id="government" class="section-anchor"></div>
        <div class="section-heading"><span class="icon">&#127963;</span> Government</div>
        <div id="government-section"></div>

        <!-- Bilateral Relations -->
        <div id="relations" class="section-anchor"></div>
        <div class="section-heading"><span class="icon">&#127760;</span> Bilateral Relations</div>
        <div id="relations-section"></div>

        <!-- Stat Sections (generated by JS) -->
        <div id="stats-container"></div>

        <!-- Save bar (fixed at bottom in edit mode) -->
        <div class="save-bar">
            <span class="save-status" id="save-status"></span>
            <button class="cancel-btn" onclick="toggleEditMode()">Cancel</button>
            <button class="save-btn" id="save-btn" onclick="saveProfile()">Save Changes</button>
        </div>
    </main>

    <!-- ===== RIGHT: Sidebar ===== -->
    <aside class="sidebar-column">
        <div class="sidebar-title">Quick Facts</div>
        <div id="sidebar-fields"></div>

        <div class="sidebar-title" style="margin-top:28px;">Live Stats</div>
        <div id="sidebar-live"></div>
    </aside>
</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { escapeHtml } from './js/utils.js';
import { STAT_DECAY_CONFIG, STATS_LOWER_IS_BETTER } from './js/game/stats.js';
import { fetchPreviousNationTick, assertRawEconomicValue } from './js/common.js';

// Resolve nation name from query parameter: nation-info.html?name=sangreza
const _QS = new URLSearchParams(window.location.search);
const NATION_SLUG = _QS.get('name');
const IS_EMBEDDED = _QS.get('embedded') === '1';
if (!NATION_SLUG) { window.location.href = 'dashboard.html'; }

// Map slugs to proper nation names (handles spaces and casing)
const SLUG_TO_NAME = {
    'melizea': 'Melizea',
    'avelia': 'Avelia',
    'sangreza': 'Sangreza',
    'montequilla': 'Montequilla',
    'sanestrella': 'San Estrella',
    'palvera': 'Palvera',
    'calveth': 'Calveth',
    'flandis': 'Flandis',
    'dravka': 'Dravka',
    'vostia': 'Vostia',
    'sierramar': 'Sierramar',
    'hajjara': 'Hajjara'
};
const NATION_NAME = SLUG_TO_NAME[NATION_SLUG.toLowerCase()] || NATION_SLUG.charAt(0).toUpperCase() + NATION_SLUG.slice(1);

// When embedded inside nation.html's iframe, hide the "← Home" back link
// so the inner frame doesn't try to navigate itself to dashboard.html.
// Also re-skin the page to the dashboard design tokens — body bg, font
// stack, and amber accent — so the subtab reads as part of the app
// rather than the standalone encyclopedia theme.
if (IS_EMBEDDED) {
    const css = document.createElement('style');
    css.textContent = `
        .toc-back { display: none !important; }
        body {
            background: #141412 !important;
            color: #c8c4b8 !important;
            font-family: 'IBM Plex Sans', -apple-system, sans-serif !important;
        }
        .toc-column { background: #1a1a17 !important; border-right-color: rgba(200,196,184,0.06) !important; }
        .toc-title,
        .toc-link,
        .nation-subtitle,
        .section-heading,
        .edit-toggle,
        .sidebar-title { font-family: 'JetBrains Mono', monospace !important; }
        .toc-link { color: #8a8778 !important; }
        .toc-link:hover,
        .toc-link.active {
            color: #b09a5b !important;
            border-left-color: #b09a5b !important;
            background: rgba(176,154,91,0.08) !important;
        }
        .nation-title {
            font-family: 'IBM Plex Serif', serif !important;
            color: #b09a5b !important;
        }
        .section-heading {
            color: #b09a5b !important;
            border-bottom-color: rgba(200,196,184,0.06) !important;
        }
        .sidebar-column { background: #1a1a17 !important; border-left-color: rgba(200,196,184,0.06) !important; }
        .sidebar-title { color: #b09a5b !important; }
        .edit-toggle { color: #b09a5b !important; border-color: #b09a5b !important; }
        .edit-toggle:hover { background: rgba(176,154,91,0.1) !important; }
        .edit-toggle.active { background: #b09a5b !important; color: #141412 !important; }
        .party-card-seats { color: #b09a5b !important; }
        .party-card-tag { background: #b09a5b !important; color: #141412 !important; }
        .loading-spinner { border-top-color: #b09a5b !important; }
    `;
    document.head.appendChild(css);
}

let nation = null;
let profile = null;
let allNations = [];
let previousTick = null;
let historyFetchFailed = false;
let userCanEdit = false;
let isEditing = false;

// ---------- Formatters ----------
function fmt(n) { return (n == null) ? 'N/A' : Number(n).toLocaleString(); }
function fmtCur(val) {
    if (val == null) return 'N/A';
    val = Number(val);
    if (val >= 1e12) return '$' + (val / 1e12).toFixed(1) + 'T';
    if (val >= 1e9) return '$' + (val / 1e9).toFixed(1) + 'B';
    if (val >= 1e6) return '$' + (val / 1e6).toFixed(1) + 'M';
    return '$' + val.toLocaleString();
}
function roundDelta(v) { return Math.abs(v) >= 1 ? Math.round(v).toString() : v.toFixed(1); }

// Inverted stats (lower = better)
const INVERTED = new Set([
    'debt','unrest','cost_of_living'
]);

function colorClass(val, inverted, key) {
    var n = Number(val) || 0;
    if (inverted) return n <= 30 ? 'good' : n <= 60 ? 'medium' : 'bad';
    return n >= 70 ? 'good' : n >= 40 ? 'medium' : 'bad';
}

function ranking(key, val, inverted) {
    if (val == null) return null;
    var vals = allNations.map(function(n) { return n[key]; }).filter(function(v) { return v != null; });
    if (!vals.length) return null;
    var sorted = vals.slice().sort(function(a, b) { return inverted ? a - b : b - a; });
    return sorted.indexOf(val) + 1;
}

function trendHTML(key, current, inverted, isCurrency) {
    if (historyFetchFailed) return '<span class="stat-trend unavailable" title="Trend unavailable: history fetch failed">&#9888; unavailable</span>';
    if (!previousTick || current == null) return '<span class="stat-trend neutral">&mdash;</span>';
    var prev = previousTick[key];
    if (prev == null) return '<span class="stat-trend neutral">&mdash;</span>';
    var delta = current - prev;
    var inv = inverted ? ' inverted' : '';
    if (delta > 0) {
        var f = isCurrency ? '+' + fmtCur(delta) : '+' + roundDelta(delta);
        return '<span class="stat-trend up' + inv + '">&#9650; ' + f + '</span>';
    }
    if (delta < 0) {
        var f = isCurrency ? fmtCur(delta) : roundDelta(delta);
        return '<span class="stat-trend down' + inv + '">&#9660; ' + f + '</span>';
    }
    return '<span class="stat-trend neutral">&mdash;</span>';
}

// Budget/debt scaling (raw dollars stored in DB)
// Detect misscaled values (0-100 stat scores instead of raw dollars)
var RAW_DOLLAR_KEYS = { budget: true, debt: true };
function isMisscaledMonetary(key, val) {
    return RAW_DOLLAR_KEYS[key] && val != null && Number(val) >= 0 && Number(val) <= 100000;
}
function scaleGDP(raw) { return raw; }

// ---------- Stat Card Builder ----------
function statCard(label, key, val, desc, format, inverted, displayVal) {
    var dv = displayVal !== undefined ? displayVal : val;
    var shown;
    if (format === 'currency' || format === 'gdp') {
        assertRawEconomicValue(dv, key);
    }
    if (typeof dv === 'string') shown = dv;
    else if ((format === 'currency' || format === 'gdp') && isMisscaledMonetary(key, dv)) {
        shown = '$' + Math.round(Number(dv));
    } else if (format === 'currency' || format === 'gdp') shown = fmtCur(dv);
    else if (format === 'years') shown = (dv != null ? (Math.round(dv * 10) / 10) + ' yrs' : 'N/A');
    else shown = dv != null ? (Math.round(Number(dv) * 10) / 10).toString() : 'N/A';

    // Skip 0-100 health coloring for raw dollar stats
    var cc = (format === 'currency' || format === 'gdp') && RAW_DOLLAR_KEYS[key] ? 'neutral' : colorClass(val, inverted, key);
    var trend = trendHTML(key, val, inverted, format === 'currency' || format === 'gdp');
    var rank = ranking(key, val, inverted);
    var rankHtml = rank ? '<div class="stat-rank' + (rank === 1 ? ' first' : '') + '">#' + rank + ' of ' + allNations.length + '</div>' : '';

    var barWidth = Math.min(100, Math.max(0, Number(val) || 0));
    var barHtml = (format !== 'currency' && format !== 'gdp' && format !== 'years' && format !== 'count')
        ? '<div class="stat-bar"><div class="stat-bar-fill ' + cc + '" style="width:' + barWidth + '%"></div></div>'
        : '';

    // Decay indicator — show direction + speed for stats with natural decay
    var decayHtml = '';
    var decayConf = STAT_DECAY_CONFIG[key];
    if (decayConf && val != null) {
        var numVal = Number(val);
        if (!isNaN(numVal)) {
            var atTarget = Math.abs(numVal - decayConf.target) < 0.05;
            if (atTarget) {
                decayHtml = '<div class="stat-decay stat-decay--neutral">Decay: at target</div>';
            } else {
                var movingDown = numVal > decayConf.target;
                var sign = movingDown ? '\u2212' : '+';
                // For inverted stats (lower is better), moving toward a HIGH target is bad
                var isInverted = STATS_LOWER_IS_BETTER.indexOf(key) !== -1;
                var isGood = isInverted ? movingDown : !movingDown;
                decayHtml = '<div class="stat-decay ' + (isGood ? 'stat-decay--up' : 'stat-decay--down') + '">Decay: ' + sign + decayConf.speed + '/tick</div>';
            }
        }
    }

    return '<div class="stat-card">' +
        '<div class="stat-name">' + label + '</div>' +
        '<div class="stat-value-row"><span class="stat-val ' + cc + '">' + shown + '</span>' + trend + '</div>' +
        barHtml + rankHtml + decayHtml +
        '<div class="stat-desc">' + desc + '</div>' +
    '</div>';
}

// ---------- Stat Section Definitions ----------
var STAT_SECTIONS = [
    { id: 'economy', icon: '&#128176;', title: 'Economy', stats: [
        ['Budget', 'budget', 'Government budget', 'currency', false, function(n){ return scaleGDP(n.budget); }],
        ['GDP Growth', 'gdp_growth', 'Monthly growth rate', null, false, function(n){ var p = ((Number(n.gdp_growth ?? 50) - 50) / 50) * 1; return (p >= 0 ? '+' : '') + p.toFixed(2) + '%'; }],
        ['National Debt', 'debt', 'Government debt', 'currency', true, function(n){ return scaleGDP(n.debt); }],
        ['Income Tax', 'income_tax', 'Personal income tax rate (0-10)', 'count', false, function(n){ return Number(n.income_tax ?? 0).toFixed(0); }],
        ['Corporate Tax', 'corporate_tax', 'Business income tax rate (0-10)', 'count', false, function(n){ return Number(n.corporate_tax ?? 0).toFixed(0); }],
        ['Cost of Living', 'cost_of_living', 'Consumer cost burden', null, true],
        ['Service Sector', 'service_sector', 'Domestic service sector activity'],
        ['Industry', 'industry', 'Industrial production'],
        ['Energy', 'energy', 'Energy supply'],
        ['Global Image', 'global_image', 'International standing — diplomatic, cultural, and trade leverage abroad']
    ]},
    { id: 'labor', icon: '&#128119;', title: 'Labor & Employment', stats: [
        ['Unskilled Workers', 'unskilled_workers', 'Entry-level service, agricultural, and manual labor capacity'],
        ['Skilled Workers', 'skilled_workers', 'Trained, certified, and professional labor capacity'],
        ['Wages', 'wages', 'Aggregate wage level across the labor market']
    ]},
    { id: 'healthcare', icon: '&#127973;', title: 'Healthcare', stats: [
        ['Health', 'health', 'Healthcare system quality and access']
    ]},
    { id: 'education', icon: '&#127891;', title: 'Education', stats: [
        ['Education', 'education', 'Education system quality']
    ]},
    { id: 'infrastructure', icon: '&#127959;', title: 'Infrastructure', stats: [
        ['Infrastructure', 'infrastructure', 'Roads, rail, digital networks']
    ]},
    { id: 'resources', icon: '&#9935;', title: 'Resources', stats: [
        ['Farmland', 'farmland', 'Farmable territory']
    ]},
    { id: 'society', icon: '&#127968;', title: 'Society', stats: [
        ['Standard of Living', 'standard_of_living', 'Quality of life'],
        ['Cost of Living', 'cost_of_living', 'Consumer cost burden', null, true]
    ]},
    { id: 'governance', icon: '&#127963;', title: 'Governance', stats: [
        ['State Apparatus', 'control', 'Government control of territory'],
        ['Public Approval', 'public_approval', 'Public approval of the government'],
        ['Corruption', 'corruption', 'Government corruption level', null, true],
        ['Crown Authority', 'crown_authority', 'Authority of the crown', null, false, null, function(n){ return n.crown_authority != null; }]
    ]},
    { id: 'security', icon: '&#128737;', title: 'Security', stats: [
        ['Unrest', 'unrest', 'Protests, riots & political violence', null, true],
        ['Crime', 'crime', 'Criminal activity level', null, true]
    ]},
    { id: 'immigration', icon: '&#9992;', title: 'Immigration', stats: [
        ['Immigration', 'immigration', 'Legal arrivals']
    ]}
];

// ---------- Data Loading ----------
async function loadPage() {
    try {
        // Parallel: user, nation, all nations
        var [userRes, nationRes, allRes] = await Promise.all([
            _supabase.auth.getUser(),
            _supabase.from('nations').select('*').eq('name', NATION_NAME).single(),
            _supabase.from('nations').select('*')
        ]);

        if (!userRes.data.user) { window.location.href = 'login.html'; return; }
        if (nationRes.error) throw nationRes.error;
        nation = nationRes.data;
        allNations = allRes.data || [];

        // Update page title and header with nation data
        document.title = nation.name + ' | Nationhood Alpha';
        document.getElementById('nation-title').textContent = nation.name;
        document.getElementById('gov-type').textContent = nation.hos_election_method === 'hereditary' ? 'Constitutional Monarchy' : (nation.government_type || '');

        // Parallel: profile, previous tick, factions, relations, user faction check
        var [profileRes, shardRes, factionsRes, relationsRes, ambFromRes, ambToRes, electionRes, userFactionRes] = await Promise.all([
            _supabase.from('nation_profiles').select('*').eq('nation_id', nation.id).limit(1),
            _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single(),
            _supabase.from('factions').select('*').eq('nation_id', nation.id).eq('faction_type', 'party'),
            _supabase.from('diplomatic_relations').select('*, nation_a:nations!diplomatic_relations_nation_a_id_fkey(id,name), nation_b:nations!diplomatic_relations_nation_b_id_fkey(id,name)').or('nation_a_id.eq.' + nation.id + ',nation_b_id.eq.' + nation.id),
            _supabase.from('ambassadors').select('target_nation_id').eq('nation_id', nation.id).eq('is_active', true).eq('status', 'active'),
            _supabase.from('ambassadors').select('nation_id').eq('target_nation_id', nation.id).eq('is_active', true).eq('status', 'active'),
            _supabase.from('elections').select('results').eq('nation_id', nation.id).eq('status', 'completed').eq('election_type', 'parliamentary').order('election_tick', { ascending: false }).limit(1).maybeSingle(),
            _supabase.from('factions').select('nation_id').eq('id', userRes.data.user.id).eq('nation_id', nation.id).eq('faction_type', 'party').limit(1)
        ]);

        profile = (profileRes.data && profileRes.data.length > 0) ? profileRes.data[0] : {};

        // Check edit permission — only factions in this nation can edit
        userCanEdit = userFactionRes.data && userFactionRes.data.length > 0;

        // Load previous tick data
        if (shardRes.data) {
            var histState = await fetchPreviousNationTick(nation.id, shardRes.data.current_tick);
            previousTick = histState.previousTick;
            historyFetchFailed = histState.historyFetchFailed;
        }

        render(factionsRes.data || [], relationsRes.data || [], ambFromRes.data || [], ambToRes.data || [], electionRes.data);
    } catch (err) {
        console.error('Load error:', err);
        document.getElementById('loading').innerHTML = '<div style="color:#ff5555;">Error: ' + err.message + '</div>';
    }
}

// ---------- Render ----------
function render(factions, relations, ambFrom, ambTo, latestElection) {
    // Flag from profile, fallback to assets/flags/{name}.png
    const flagEl = document.getElementById('nation-flag');
    const flagSrc = profile.flag_url || `assets/flags/${nation.name}.png`;
    flagEl.src = flagSrc;
    flagEl.onerror = () => { flagEl.style.display = 'none'; };

    // Motto
    document.getElementById('motto-view').textContent = profile.motto || '';
    document.getElementById('motto-edit').value = profile.motto || '';

    // Overview
    document.getElementById('overview-view').textContent = profile.overview || 'No overview available.';
    document.getElementById('overview-edit').value = profile.overview || '';

    // History timeline
    renderTimeline(profile.history_timeline || []);

    // Government
    renderGovernment(factions, latestElection);

    // Relations
    renderRelations(relations, ambFrom, ambTo);

    // Stats
    renderStats();

    // Sidebar
    renderSidebar();

    // Edit button
    if (userCanEdit) document.getElementById('edit-toggle').style.display = 'block';

    // Show page
    document.getElementById('loading').style.display = 'none';
    document.getElementById('page').style.display = 'grid';

    // TOC scroll highlight
    initTocHighlight();
}

// ---------- Timeline ----------
function renderTimeline(entries) {
    var container = document.getElementById('timeline-container');
    var h = '<div class="timeline" id="timeline">';
    for (var i = 0; i < entries.length; i++) {
        var e = entries[i];
        h += '<div class="timeline-entry" data-idx="' + i + '">';
        h += '<span class="timeline-year view-field">' + (e.year || '') + '</span>';
        h += '<span class="edit-field"><input class="edit-input-sm timeline-year-input" value="' + (e.year || '').replace(/"/g, '&quot;') + '" style="width:70px" placeholder="Year"></span>';
        h += '<span class="timeline-event view-field">' + (e.event || '') + '</span>';
        h += '<span class="edit-field" style="flex:1;display:flex;gap:4px;align-items:center;">';
        h += '<input class="edit-input-sm timeline-event-input" value="' + (e.event || '').replace(/"/g, '&quot;') + '" style="flex:1" placeholder="Event description">';
        h += '<button class="timeline-move-btn" onclick="moveTimelineEntry(' + i + ',-1)"' + (i === 0 ? ' disabled' : '') + ' title="Move up">&#9650;</button>';
        h += '<button class="timeline-move-btn" onclick="moveTimelineEntry(' + i + ',1)"' + (i === entries.length - 1 ? ' disabled' : '') + ' title="Move down">&#9660;</button>';
        h += '<button class="timeline-remove-btn" onclick="removeTimelineEntry(' + i + ')" title="Remove">&#10005;</button>';
        h += '</span>';
        h += '</div>';
    }
    h += '</div>';
    h += '<div class="edit-field"><button class="timeline-add-btn" onclick="addTimelineEntry()">+ Add Entry</button></div>';
    container.innerHTML = h;
}

// ---------- Government ----------
function renderGovernment(factions, latestElection) {
    // Build seat map from latest election results (authoritative source)
    var electionSeats = {};
    var electionVotes = (latestElection && latestElection.results && latestElection.results.votes) || (latestElection && latestElection.results && latestElection.results.seats) || [];
    for (var i = 0; i < electionVotes.length; i++) {
        electionSeats[electionVotes[i].party_id] = electionVotes[i].seats;
    }

    var allParties = [];
    for (var i = 0; i < (factions || []).length; i++) {
        var seats = electionSeats[factions[i].id] !== undefined ? electionSeats[factions[i].id] : (factions[i].seats || 0);
        allParties.push({ name: factions[i].faction_name, seats: seats });
    }
    allParties.sort(function(a, b) { return (b.seats || 0) - (a.seats || 0); });

    var totalSeats = nation.total_seats || 120;

    // Color palette for parties
    var colors = ['#f0c040','#4ea8de','#e06060','#50c878','#c080e0','#e0a050','#60c0c0','#e07090'];

    var h = '<div class="seat-bar-container">';
    h += '<div class="seat-bar">';
    for (var i = 0; i < allParties.length; i++) {
        var pct = ((allParties[i].seats / totalSeats) * 100).toFixed(1);
        var c = colors[i % colors.length];
        h += '<div class="seat-bar-segment" style="width:' + pct + '%;background:' + c + ';">';
        if (allParties[i].seats > 0) h += '<span class="seat-bar-label">' + allParties[i].seats + '</span>';
        h += '</div>';
    }
    h += '</div></div>';

    h += '<div class="party-cards">';
    for (var i = 0; i < allParties.length; i++) {
        var c = colors[i % colors.length];
        h += '<div class="party-card" style="border-left-color:' + c + ';">';
        h += '<div class="party-card-name">' + escapeHtml(allParties[i].name);
        if (i === 0 && allParties[i].seats > 0) h += '<span class="party-card-tag">Leading</span>';
        h += '</div>';
        h += '<div class="party-card-seats">' + allParties[i].seats + ' seats</div>';
        h += '</div>';
    }
    if (allParties.length === 0) {
        h += '<div style="color:#666;font-style:italic;padding:16px;">No parties yet.</div>';
    }
    h += '</div>';

    document.getElementById('government-section').innerHTML = h;
}

// ---------- Relations ----------
function renderRelations(relations, ambFrom, ambTo) {
    if (!relations || relations.length === 0) {
        document.getElementById('relations-section').innerHTML = '<div style="color:#666;font-style:italic;">No diplomatic relations established.</div>';
        return;
    }
    var h = '<div class="relations-grid">';
    for (var i = 0; i < relations.length; i++) {
        var r = relations[i];
        var other = (r.nation_a && r.nation_a.id === nation.id) ? r.nation_b : r.nation_a;
        if (!other) continue;
        // Embassy open only if both nations have an active ambassador to each other
        var hasOurAmb = ambFrom.some(function(a) { return a.target_nation_id === other.id; });
        var hasTheirAmb = ambTo.some(function(a) { return a.nation_id === other.id; });
        var embStatus = (hasOurAmb && hasTheirAmb) ? 'open' : 'closed';
        h += '<div class="relation-card">';
        h += '<div class="relation-nation">' + escapeHtml(other.name) + '</div>';
        h += '<span class="relation-type ' + (r.relation_type || 'neutral') + '">' + (r.relation_type || 'neutral') + '</span>';
        h += '<div class="relation-score">Score: ' + (r.relation_score != null ? r.relation_score : '?') + ' / 100</div>';
        h += '<div class="relation-embassy">Embassy: ' + embStatus + '</div>';
        h += '</div>';
    }
    h += '</div>';
    document.getElementById('relations-section').innerHTML = h;
}

// ---------- Stats ----------
function renderStats() {
    var h = '';
    if (historyFetchFailed) {
        h += '<div class="stat-warning-badge">&#9888; Trend deltas unavailable (history fetch failed).</div>';
    }
    for (var s = 0; s < STAT_SECTIONS.length; s++) {
        var sec = STAT_SECTIONS[s];
        h += '<div id="' + sec.id + '" class="section-anchor"></div>';
        h += '<div class="section-heading"><span class="icon">' + sec.icon + '</span> ' + sec.title + '</div>';
        h += '<div class="stat-section"><div class="stat-grid">';
        for (var i = 0; i < sec.stats.length; i++) {
            var st = sec.stats[i];
            var label = st[0], key = st[1], desc = st[2];
            var format = st[3] || null;
            var inverted = st[4] || false;
            var displayFn = st[5] || null;
            var showFn = st[6] || null;
            if (showFn && !showFn(nation)) continue;
            var val = nation[key];
            var displayVal = displayFn ? displayFn(nation) : undefined;
            h += statCard(label, key, val, desc, format, inverted, displayVal);
        }
        h += '</div></div>';
    }
    document.getElementById('stats-container').innerHTML = h;
}

    ['currency_name', 'Currency'],
    ['founded_year', 'Founded'],
    ['national_anthem', 'Anthem'],
    ['national_animal', 'National Animal'],

    ['geographic_region', 'Region'],
    ['climate', 'Climate'],
    ['area_sq_km', 'Area (sq km)'],
    ['coastline_km', 'Coastline (km)'],
    ['natural_resources', 'Resources'],
    ['major_industries', 'Industries'],

    ['major_imports', 'Imports'],
    ['calling_code', 'Calling Code'],

function renderSidebar() {
    // Editable lore fields
    var h = '';
    for (var i = 0; i < SIDEBAR_FIELDS.length; i++) {
        var key = SIDEBAR_FIELDS[i][0], label = SIDEBAR_FIELDS[i][1];
        var val = profile[key] || '';
        h += '<div class="sidebar-field editable">';
        h += '<div class="sidebar-label">' + label + '</div>';
        h += '<div class="sidebar-value view-field">' + (val || '&mdash;') + '</div>';
        h += '<div class="edit-field"><input class="edit-input-sm sidebar-edit" data-key="' + key + '" value="' + val.replace(/"/g, '&quot;') + '"></div>';
        h += '</div>';
    }
    document.getElementById('sidebar-fields').innerHTML = h;

    // Live stats
    var liveStats = [
        ['Population', fmt(nation.population)],
        ['Budget', fmtCur(scaleGDP(nation.budget))],
        ['Nat. Debt', fmtCur(scaleGDP(nation.debt))],
        ['Approval', (nation.gov_approval ?? 40) + '%'],
        ['State Apparatus', nation.control != null ? Number(nation.control).toFixed(0) : 'N/A'],
        ['Unrest', nation.unrest != null ? Number(nation.unrest).toFixed(0) : 'N/A']
    ];
    var lh = '';
    for (var i = 0; i < liveStats.length; i++) {
        lh += '<div class="sidebar-field">';

        lh += '<div class="sidebar-value">' + liveStats[i][1] + '</div>';

// ---------- Edit Mode ----------
window.toggleEditMode = function() {
    isEditing = !isEditing;
    document.getElementById('page').classList.toggle('editing', isEditing);
    var btn = document.getElementById('edit-toggle');
    btn.textContent = isEditing ? 'Editing' : 'Edit';
    btn.classList.toggle('active', isEditing);
    document.getElementById('save-status').textContent = '';
};

window.addTimelineEntry = function() {
    var entries = gatherTimeline();
    entries.push({ year: '', event: '' });
    renderTimeline(entries);
    // Re-apply editing class to new DOM
    if (isEditing) document.getElementById('page').classList.add('editing');
};

window.removeTimelineEntry = function(idx) {
    var entries = gatherTimeline();
    entries.splice(idx, 1);
    renderTimeline(entries);
    if (isEditing) document.getElementById('page').classList.add('editing');
};

window.moveTimelineEntry = function(idx, dir) {
    var entries = gatherTimeline();
    var target = idx + dir;
    if (target < 0 || target >= entries.length) return;
    var temp = entries[idx];
    entries[idx] = entries[target];
    entries[target] = temp;
    renderTimeline(entries);
    if (isEditing) document.getElementById('page').classList.add('editing');
};

function gatherTimeline() {
    var entries = [];
    var yearInputs = document.querySelectorAll('.timeline-year-input');
    var eventInputs = document.querySelectorAll('.timeline-event-input');
    for (var i = 0; i < yearInputs.length; i++) {
        entries.push({ year: yearInputs[i].value, event: eventInputs[i] ? eventInputs[i].value : '' });
    }
    return entries;
}

window.saveProfile = async function() {
    var saveBtn = document.getElementById('save-btn');
    var status = document.getElementById('save-status');
    saveBtn.disabled = true;
    status.textContent = 'Saving...';
    status.style.color = '#f0c040';

    var data = {
        nation_id: nation.id,
        motto: document.getElementById('motto-edit').value,
        overview: document.getElementById('overview-edit').value,
        history_timeline: gatherTimeline()
    };

    // Gather sidebar fields
    var sidebarInputs = document.querySelectorAll('.sidebar-edit');
    for (var i = 0; i < sidebarInputs.length; i++) {
        data[sidebarInputs[i].getAttribute('data-key')] = sidebarInputs[i].value;
    }

    // Flag URL (from current profile — not editable in sidebar for now)
    if (profile.flag_url) data.flag_url = profile.flag_url;

    var { error } = await _supabase.from('nation_profiles').upsert(data, { onConflict: 'nation_id' });

    if (error) {
        status.textContent = 'Error: ' + error.message;
        status.style.color = '#ff5555';
        saveBtn.disabled = false;
        return;
    }

    // Update local state
    for (var k in data) profile[k] = data[k];
    status.textContent = 'Saved!';
    status.style.color = '#4caf50';
    saveBtn.disabled = false;

    // Re-render view fields
    document.getElementById('motto-view').textContent = profile.motto || '';
    document.getElementById('overview-view').textContent = profile.overview || 'No overview available.';
    renderSidebar();
    // Keep editing class on sidebar
    if (isEditing) document.getElementById('page').classList.add('editing');
};

// ---------- TOC Scroll Highlight ----------
function initTocHighlight() {
    var links = document.querySelectorAll('.toc-link');
    var sections = [];
    for (var i = 0; i < links.length; i++) {
        var href = links[i].getAttribute('href');
        if (href && href.startsWith('#')) {
            var el = document.getElementById(href.slice(1));
            if (el) sections.push({ link: links[i], el: el });
        }
    }
    if (!sections.length) return;

    var mainCol = document.querySelector('.main-column');
    function onScroll() {
        var scrollTop = window.scrollY || document.documentElement.scrollTop;
        var active = sections[0].link;
        for (var i = 0; i < sections.length; i++) {
            if (sections[i].el.offsetTop <= scrollTop + 80) active = sections[i].link;
        }
        for (var i = 0; i < sections.length; i++) sections[i].link.classList.remove('active');
        active.classList.add('active');
    }
    window.addEventListener('scroll', onScroll);
    onScroll();
}

loadPage();
