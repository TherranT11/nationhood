<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Army Actions | Nationhood Alpha</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #0e0e0c; --bg-2: #1a1a17; --bg-3: #252525; --bg-card: #1a1a17;
  --text-bright: #f0efe6; --text-primary: #c4c2b8; --text-secondary: #888;
  --text-muted: #666; --text-dim: #4a4940;
  --border-0: rgba(255,255,255,0.06); --border-1: rgba(255,255,255,0.08);
  --army: #b6533f; --green: #5cb85c; --red: #c55;
  --font-mono: 'JetBrains Mono', monospace; --font-sans: 'IBM Plex Sans', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg-0); color: var(--text-primary); font-family: var(--font-sans); }
.aa-wrap { max-width: 1160px; margin: 0 auto; padding: 22px 24px 60px; }
.aa-head { display: flex; align-items: baseline; gap: 12px; padding-bottom: 14px;
  border-bottom: 1px solid var(--border-1); margin-bottom: 18px; }
.aa-head__eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em;
  color: var(--army); font-weight: 700; text-transform: uppercase; }
.aa-head__faction { font-size: 13px; color: var(--text-secondary); }
.aa-grid { display: grid; grid-template-columns: 280px 1fr; gap: 18px; align-items: start; }
.aa-rail { display: flex; flex-direction: column; gap: 8px; }
.aa-officer { display: flex; align-items: center; gap: 10px; text-align: left;
  background: var(--bg-2); border: 1px solid var(--border-0);
  border-left: 3px solid var(--border-0); padding: 10px 12px; cursor: pointer;
  color: inherit; font: inherit; transition: border-color .12s, background .12s; }
.aa-officer:hover { border-color: var(--border-1); }
.aa-officer.is-sel { border-color: rgba(182,83,63,0.27);
  border-left-color: var(--army); background: rgba(182,83,63,0.05); }
.aa-tile { width: 45px; height: 45px; flex: none; display: flex; align-items: center;
  justify-content: center; font-family: var(--font-mono); font-size: 14px; font-weight: 700;
  color: var(--army); background: rgba(182,83,63,0.08); border: 1px solid rgba(182,83,63,0.2); }
.aa-officer__role { font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--army); }
.aa-officer__name { font-size: 13px; font-weight: 600; color: var(--text-bright); margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.aa-officer.is-dim .aa-officer__name { color: var(--text-muted); }
.aa-officer__meta { font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); margin-top: 3px; }
.aa-panel { background: var(--bg-2); border: 1px solid var(--border-0); min-height: 320px; }
.aa-panel__top { display: flex; align-items: center; gap: 12px;
  padding: 14px 20px; border-bottom: 1px solid var(--border-0); }
.aa-avatar { width: 56px; height: 56px; flex: none; display: flex; align-items: center;
  justify-content: center; font-family: var(--font-mono); font-size: 18px; font-weight: 700;
  color: var(--army); background: rgba(182,83,63,0.08); border: 1px solid rgba(182,83,63,0.2); }
.aa-panel__role { font-family: var(--font-mono); font-size: 22px; font-weight: 700; color: var(--army); }
.aa-panel__name { font-size: 19px; font-weight: 700; color: var(--text-bright); margin-left: 8px; }
.aa-panel__sub { font-family: var(--font-mono); font-size: 13px; color: var(--text-dim); margin-top: 2px; }
.aa-act { padding: 16px 20px; border-bottom: 1px solid var(--border-0);
  cursor: pointer; transition: background .12s; }
.aa-act:last-child { border-bottom: none; }
.aa-act:hover { background: rgba(182,83,63,0.04); }
.aa-act__head { display: flex; justify-content: space-between; align-items: center;
  gap: 10px; margin-bottom: 6px; }
.aa-act__title { display: flex; align-items: center; gap: 10px; }
.aa-act__name { font-size: 18px; font-weight: 700; color: var(--text-bright); }
.aa-badge { font-family: var(--font-mono); font-size: 9px; font-weight: 700; letter-spacing: 0.3px;
  padding: 2px 6px; line-height: 14px; color: var(--text-dim); background: var(--bg-3);
  border: 1px solid var(--border-0); text-transform: uppercase; }
.aa-badge--irreversible { color: var(--red); }
.aa-act__cost { font-family: var(--font-mono); font-size: 14px; font-weight: 700;
  color: var(--green); white-space: nowrap; }
.aa-act__cost--warn { color: var(--red); }
.aa-act__desc { font-size: 14px; color: var(--text-muted); line-height: 1.6; }
.aa-empty { padding: 22px 20px; font-family: var(--font-mono); font-size: 12px;
  color: var(--text-dim); line-height: 1.7; }
.aa-loading { padding: 60px; text-align: center; font-family: var(--font-mono);
  font-size: 12px; color: var(--text-dim); }
</style>
</head>
<body>
  <div id="mil-topbar-host"></div>
  <div class="aa-wrap" id="aa-root">
    <div class="aa-loading">Loading army command…</div>
  </div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { getNationNames } from './js/game/political-actions.js';
import { bootstrapArmyPage } from './js/army-page.js';
import { openCreateUnitModal, openCreateArmyModal } from './js/create-unit.js';
import { openReportModal } from './js/report-defense.js';
import { openForeignOfficerExchangeModal } from './js/foreign-officer-exchange.js';
import { openCombinedArmsSchoolModal } from './js/combined-arms-school.js';
import { isFactionInactive, getFactionDashboardUrl } from './js/game/factions.js';

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// Officer roster definition. Chief of Staff is the army faction's
// leader_* (single source, generated at army-join — never regenerated
// here). The other three are auto-generated + locked in on first load.
const ROSTER = [
  { key: 'cos',   role: 'Chief of Staff',
    desc: 'Principal military advisor; heads the army’s command structure.' },
  { key: 'qm',    role: 'Quartermaster General', col: 'army_qm',
    desc: 'Logistics, supply lines, and matériel.' },
  { key: 'intel', role: 'Director of Intelligence', col: 'army_intel',
    desc: 'Reconnaissance, counter-intelligence, and threat assessment.' },
  { key: 'cmd',   role: 'Commanding General', col: 'army_cmd',
    desc: 'Field command of deployed forces.' },
];

let _faction = null;
let _selected = 'cos';

function officerName(o) {
  if (o.key === 'cos') {
    return { first: _faction.leader_first_name, last: _faction.leader_last_name, age: _faction.leader_age };
  }
  return {
    first: _faction[`${o.col}_first_name`],
    last:  _faction[`${o.col}_last_name`],
    age:   _faction[`${o.col}_age`],
  };
}

function render() {
  const root = document.getElementById('aa-root');
  if (!root) return;
  const railHtml = ROSTER.map(o => {
    const n = officerName(o);
    const has = n.first && n.last;
    const full = has ? `${n.first} ${n.last}` : 'Unassigned';
    const init = has ? (n.first[0] + n.last[0]).toUpperCase() : '–';
    return `<button class="aa-officer${_selected === o.key ? ' is-sel' : ''}${has ? '' : ' is-dim'}" data-officer="${o.key}">
      <div class="aa-tile">${esc(init)}</div>
      <div style="flex:1;min-width:0;">
        <div class="aa-officer__role">${esc(o.role)}</div>
        <div class="aa-officer__name">${esc(full)}</div>
        <div class="aa-officer__meta">${n.age ? 'Age ' + esc(n.age) : 'Vacant'}</div>
      </div>
    </button>`;
  }).join('');

  const sel = ROSTER.find(o => o.key === _selected) || ROSTER[0];
  const sn = officerName(sel);
  const has = sn.first && sn.last;
  const selFull = has ? `${sn.first} ${sn.last}` : 'Unassigned';
  const initials = has ? (sn.first[0] + sn.last[0]).toUpperCase() : '–';
  const nationName = _faction.__nation_name || '';

  // Chief of Staff + Commanding General have actions; the other
  // offices show their remit until their actions are built out.
  let body;
  if (sel.key === 'cos') {
    body = `
        <div class="aa-act" data-act="create-unit">
          <div class="aa-act__head">
            <div class="aa-act__title"><span class="aa-act__name">Create Unit</span></div>
            <span class="aa-act__cost">$2+</span>
          </div>
          <div class="aa-act__desc">Commission a new combat formation — $2 action fee plus construction cost from the defense budget.</div>
        </div>
        <div class="aa-act" data-act="create-army">
          <div class="aa-act__head">
            <div class="aa-act__title"><span class="aa-act__name">Create Army</span></div>
            <span class="aa-act__cost">$2</span>
          </div>
          <div class="aa-act__desc">Form your units into a cohesive fighting force — a named army (Regular, Guard, or Paramilitary) that can be deployed and given orders. $2 action fee from the army treasury.</div>
        </div>
        <div class="aa-act" data-act="report-defense">
          <div class="aa-act__head">
            <div class="aa-act__title"><span class="aa-act__name">Report to Defense Minister</span></div>
            <span class="aa-act__cost">$1</span>
          </div>
          <div class="aa-act__desc">File a confidential briefing to the Defense Minister — it appears in the nation's Pressing Issues. 12-tick cooldown.</div>
        </div>
        <div class="aa-act" data-act="resign">
          <div class="aa-act__head">
            <div class="aa-act__title"><span class="aa-act__name">Resign</span><span class="aa-badge aa-badge--irreversible">Irreversible</span></div>
            <span class="aa-act__cost aa-act__cost--warn">−1 APPROVAL</span>
          </div>
          <div class="aa-act__desc">Resign your commission as Chief of Staff and head into a peaceful retirement. Removes your command of this army.</div>
        </div>`;
  } else if (sel.key === 'qm') {
    body = `
        <div class="aa-act" data-act="combined-arms-school">
          <div class="aa-act__head">
            <div class="aa-act__title"><span class="aa-act__name">Establish Combined Arms School</span></div>
            <span class="aa-act__cost">$55</span>
          </div>
          <div class="aa-act__desc">Stand up a national staff college teaching combined arms doctrine, joint operations, and modern warfare. Posts a construction contract for corporations to bid on. Removes 2,000 manpower immediately; on completion (≈36 months): Professionalism +6, Officer Corps +4. Then $2/tick under National Infrastructure. 24-tick cooldown.</div>
        </div>`;
  } else if (sel.key === 'cmd') {
    body = `
        <div class="aa-act" data-act="foreign-officer-exchange">
          <div class="aa-act__head">
            <div class="aa-act__title"><span class="aa-act__name">Foreign Officer Exchange Program</span></div>
            <span class="aa-act__cost">$12</span>
          </div>
          <div class="aa-act__desc">Send select officers abroad to study at foreign military academies and embed with allied units. Returning officers bring back modern doctrine, professional standards, and international networks. 24-tick cooldown.</div>
        </div>`;
  } else {
    body = `<div class="aa-empty">${esc(sel.desc)}<br><br>No actions available for this office yet.</div>`;
  }

  root.innerHTML = `
    <div class="aa-head">
      <span class="aa-head__eyebrow">Army Command</span>
      <span class="aa-head__faction">${esc(_faction.faction_name || 'Army')}${nationName ? ' · ' + esc(nationName) : ''}</span>
    </div>
    <div class="aa-grid">
      <div class="aa-rail">${railHtml}</div>
      <div class="aa-panel">
        <div class="aa-panel__top">
          <div class="aa-avatar">${esc(initials)}</div>
          <div>
            <div><span class="aa-panel__role">${esc(sel.role)}</span><span class="aa-panel__name">${esc(selFull)}</span></div>
            <div class="aa-panel__sub">${sn.age ? 'Age ' + esc(sn.age) : 'Unassigned'}${nationName ? ' · ' + esc(nationName) : ''}</div>
          </div>
        </div>
        ${body}
      </div>
    </div>`;

  root.querySelectorAll('[data-officer]').forEach(btn => {
    btn.addEventListener('click', () => {
      _selected = btn.getAttribute('data-officer');
      render();
    });
  });

  const cu = root.querySelector('[data-act="create-unit"]');
  if (cu) cu.onclick = () => openCreateUnitModal(_faction);
  const ca = root.querySelector('[data-act="create-army"]');
  if (ca) ca.onclick = () => openCreateArmyModal(_faction);
  const rs = root.querySelector('[data-act="resign"]');
  if (rs) rs.onclick = () => triggerResign(_faction);
  const rd = root.querySelector('[data-act="report-defense"]');
  if (rd) rd.onclick = () => openReportModal(_faction);
  const fo = root.querySelector('[data-act="foreign-officer-exchange"]');
  if (fo) fo.onclick = () => openForeignOfficerExchangeModal(_faction);
  const cas = root.querySelector('[data-act="combined-arms-school"]');
  if (cas) cas.onclick = () => openCombinedArmsSchoolModal(_faction);
}

let _resigning = false;
async function triggerResign(faction) {
  if (_resigning) return;
  const nationName = faction.__nation_name || 'your nation';
  const ok = confirm(
    `Resign your commission as Chief of Staff of the ${faction.faction_name || 'Army'} of ${nationName}? `
    + `You will head off into a peaceful retirement. −1 Public Approval. This cannot be undone.`);
  if (!ok) return;
  _resigning = true;
  try {
    const { data, error } = await _supabase.rpc('resign_military_faction', { p_faction_id: faction.id });
    if (error) { alert('Failed to resign: ' + error.message); return; }
    if (data && data.success === false) { alert(data.error || 'Could not resign.'); return; }

    // Route back to the player's remaining faction (party → corp), or
    // the faction picker if the army was their only one.
    const { data: { user } } = await _supabase.auth.getUser();
    const { data: rows, error: rErr } = await _supabase
      .from('factions')
      .select('id, faction_type, branch, abandoned_at, is_banned, linked_user_id')
      .or(`id.eq.${user.id},linked_user_id.eq.${user.id}`);
    if (rErr) console.warn('post-resign faction lookup failed:', rErr.message);
    const active = (rows || []).filter(f => f.faction_type !== 'military' && !isFactionInactive(f));
    const next = active.find(f => f.faction_type === 'party')
              || active.find(f => f.faction_type === 'corporation')
              || null;
    if (next) {
      sessionStorage.setItem('active_faction_id', next.id);
      window.location.href = getFactionDashboardUrl(next) || 'dashboard.html';
    } else {
      window.location.href = 'faction-select.html';
    }
  } finally {
    _resigning = false;
  }
}

const ACTIONS_FACTION_COLS = 'id, faction_type, faction_name, nation_id, abandoned_at, is_banned, branch, party_funds, army_manpower, leader_first_name, leader_last_name, leader_age, army_qm_first_name, army_qm_last_name, army_qm_age, army_intel_first_name, army_intel_last_name, army_intel_age, army_cmd_first_name, army_cmd_last_name, army_cmd_age';

async function init() {
  const ctx = await bootstrapArmyPage({ activeTab: 'actions', factionSelect: ACTIONS_FACTION_COLS });
  if (!ctx) return; // bootstrap already redirected
  _faction = ctx.faction;
  const nation = ctx.nation;

  // Lazy-generate + lock in any missing officer (QM / Intel / Cmd).
  // The Chief of Staff (leader_*) was generated at army-join and is
  // never regenerated here. Generation needs the nation's name pool;
  // if the nation lookup failed OR the pool is empty we render
  // placeholders and let the next load retry rather than write garbage.
  //
  // Accepted tolerance: on the first-ever load two concurrent loads
  // could each generate different names and both write — last write
  // wins and it self-heals on the next load. Sub-second window, first
  // load only, cosmetic; not worth a conditional-write guard that
  // would complicate the defensive partial-missing path.
  const pool = nation?.name ? getNationNames(nation.name) : null;
  if (pool && pool.firstNames?.length && pool.lastNames?.length) {
    const { firstNames, lastNames } = pool;
    const updates = {};
    for (const o of ROSTER) {
      if (o.key === 'cos') continue;
      if (!_faction[`${o.col}_first_name`]) {
        const f = firstNames[Math.floor(Math.random() * firstNames.length)];
        const l = lastNames[Math.floor(Math.random() * lastNames.length)];
        const a = 50 + Math.floor(Math.random() * 26); // 50..75, same band as the Chief
        updates[`${o.col}_first_name`] = f;
        updates[`${o.col}_last_name`]  = l;
        updates[`${o.col}_age`]        = a;
        _faction[`${o.col}_first_name`] = f;
        _faction[`${o.col}_last_name`]  = l;
        _faction[`${o.col}_age`]        = a;
      }
    }
    if (Object.keys(updates).length > 0) {
      await _supabase.from('factions').update(updates).eq('id', _faction.id)
        .then(({ error }) => {
          if (error) console.warn('Army officer lock-in failed (will retry next load):', error.message);
        });
    }
  }

  render();
}

init().catch(err => {
  console.error('army-actions init failed:', err);
  const root = document.getElementById('aa-root');
  if (root) root.innerHTML = '<div class="aa-loading">Failed to load army command.</div>';
});
</script>
</body>
</html>
