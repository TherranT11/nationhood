<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nations | Nationhood Alpha</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #0e0e0c;
  --bg-1: #1a1a1a;
  --bg-2: #1a1a17;
  --bg-3: #252525;
  --bg-4: #24241f;
  --bg-5: #2c2c26;
  --bg-hover: #282822;
  --text-bright: #f0efe6;
  --text-primary: #c4c2b8;
  --text-secondary: #888;
  --text-muted: #666;
  --text-dim: #4a4940;
  --text-ghost: #333229;
  --border-hair: rgba(255,255,255,0.04);
  --border-0: rgba(255,255,255,0.06);
  --border-1: rgba(255,255,255,0.08);
  --border-2: rgba(255,255,255,0.12);
  --green: #5cb85c;
  --green-faint: rgba(92,184,92,0.08);
  --green-border: rgba(92,184,92,0.18);
  --red: #d9534f;
  --amber: #c8a64e;
  --amber-faint: rgba(200,166,78,0.08);
  --amber-border: rgba(200,166,78,0.18);
  --blue: #5b9bd5;
  --blue-faint: rgba(91,155,213,0.08);
  --blue-border: rgba(91,155,213,0.18);
  --teal: #5aafa5;
  --teal-faint: rgba(90,175,165,0.08);
  --teal-border: rgba(90,175,165,0.18);
  --gold: #c8a832;
  --font-mono: 'JetBrains Mono', monospace;
  --font-ui: 'IBM Plex Sans', -apple-system, sans-serif;
  --font-serif: 'IBM Plex Serif', Georgia, serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg-0);
  color: var(--text-primary);
  font-family: var(--font-ui);
  min-height: 100vh;
}

/* ── Top bar ── */
.top-bar-row1 {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 22px; height: 53px;
  background: var(--bg-2); border-bottom: 1px solid var(--border-0);
}
.top-bar-left { display: flex; align-items: center; gap: 0; }
.top-bar-sep { width: 1px; height: 31px; background: rgba(255,255,255,0.08); margin: 0 16px; flex-shrink: 0; }
.corp-badge { display: flex; align-items: center; gap: 8px; }
.corp-logo {
  width: 35px; height: 35px; background: var(--bg-3); border: 1px solid var(--border-0); border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--text-dim);
}
.corp-name-bar { font-family: var(--font-serif); font-size: 14px; font-weight: 500; color: var(--text-bright); letter-spacing: 0.02em; white-space: nowrap; }
.tick-info { display: flex; gap: 20px; align-items: center; }
.tick-item { display: flex; flex-direction: column; gap: 1px; }
.tick-label { font-family: var(--font-mono); font-size: 9.5px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #7a7868; }
.tick-value { font-family: var(--font-mono); font-size: 13px; font-weight: 500; color: var(--text-bright); }
.top-bar-right { display: flex; align-items: center; gap: 10px; }
.topbar-cash { font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: 0.5px; color: var(--gold); padding: 3px 8px; background: rgba(200,168,50,0.08); border: 1px solid rgba(200,168,50,0.2); }
.corp-name-badge { font-family: var(--font-mono); font-size: 11px; font-weight: 600; padding: 4px 10px; background: rgba(90,175,165,0.08); border: 1px solid var(--teal-border); color: var(--teal); letter-spacing: 0.5px; cursor: pointer; }
.corp-faction-dropdown { display: none; position: absolute; top: 100%; right: 0; background: var(--bg-3); border: 1px solid var(--border-1); z-index: 100; min-width: 180px; }
.corp-faction-dropdown.open { display: block; }
.corp-faction-dropdown__item { padding: 8px 12px; cursor: pointer; font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
.corp-faction-dropdown__item:hover { background: var(--bg-hover); color: var(--text-bright); }
.corp-faction-dropdown__item.active { color: var(--teal); }
.theme-toggle-btn, .logout-btn { font-family: var(--font-mono); font-size: 9px; padding: 4px 10px; background: var(--bg-3); border: 1px solid var(--border-1); color: var(--text-secondary); cursor: pointer; }
.loading-msg { padding: 40px; text-align: center; font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }

/* ── Nav ── */
.corp-hamburger { display: none; background: var(--bg-2); border: 1px solid var(--border-0); color: var(--text-secondary); font-size: 18px; padding: 6px 12px; cursor: pointer; width: 100%; text-align: left; }
.corp-nav { display: flex; padding: 0 22px; gap: 0; height: 40px; background: var(--bg-2); border-bottom: 1px solid var(--border-0); }
.corp-nav__tab {
  font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase;
  color: #8a8978; text-decoration: none; padding: 0 14px; display: flex; align-items: center;
  border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s;
}
.corp-nav__tab:hover { color: #a8a797; }
.corp-nav__tab.active { color: var(--text-bright); border-bottom-color: var(--text-bright); }

/* ── Content ── */
.content { padding: 20px; }

/* ── Continent tabs ── */
.continent-tabs { display: flex; gap: 4px; margin-bottom: 8px; }
.continent-tab {
  padding: 6px 20px; cursor: pointer;
  font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: 1px;
  border: 1px solid var(--border-0); text-transform: uppercase;
}
.continent-tab.active { color: #000; background: #8b9a6b; border-color: #8b9a6b; }
.continent-tab:not(.active) { color: var(--text-dim); background: transparent; }

/* ── Main layout ── */
.nations-layout { display: flex; gap: 8px; }
.nations-list { width: 340px; background: var(--bg-2); border: 1px solid var(--border-0); display: flex; flex-direction: column; max-height: calc(100vh - 160px); overflow: hidden; flex-shrink: 0; }
.nations-list-scroll { flex: 1; overflow-y: auto; }
.nations-detail { flex: 1; background: var(--bg-2); border: 1px solid var(--border-0); display: flex; flex-direction: column; max-height: calc(100vh - 160px); overflow: hidden; }
.nations-detail-scroll { flex: 1; overflow-y: auto; }

/* ── Mobile ── */
@media (max-width: 820px) {
  .corp-hamburger { display: block; }
  .corp-nav { display: none; flex-direction: column; height: auto; padding: 0; }
  .corp-nav.nav-open { display: flex; }
  .corp-nav.nav-open .corp-nav__tab { padding: 10px 22px; border-bottom: none; border-left: 2px solid transparent; }
  .corp-nav.nav-open .corp-nav__tab.active { border-left-color: var(--text-bright); border-bottom: none; }
  .nations-layout { flex-direction: column; }
  .nations-list { width: 100%; max-height: 300px; }
  .nations-detail { max-height: none; }
}
</style>
</head>
<body>

<div id="loading" class="loading-msg">LOADING NATIONS...</div>

<div id="page-content" style="display:none;">
  <!-- Top bar -->
  <div class="top-bar-row1">
    <div class="top-bar-left">
      <div class="corp-badge">
        <div class="corp-logo" id="corp-logo"></div>
        <span class="corp-name-bar" id="corp-name-bar">Loading...</span>
      </div>
      <div class="top-bar-sep"></div>
      <div class="tick-info">
        <div class="tick-item">
          <div class="tick-label">Game Date</div>
          <div class="tick-value" id="game-date">--</div>
        </div>
        <div class="tick-item">
          <div class="tick-label">Tick</div>
          <div class="tick-value" id="tick-number">--</div>
        </div>
        <div class="tick-item">
          <div class="tick-label">Next Tick</div>
          <div class="tick-value" id="tick-countdown">--</div>
        </div>
      </div>
    </div>
    <div class="top-bar-version" style="font-family:var(--font-mono);font-size:10px;color:#f0efe6;letter-spacing:0.5px;opacity:0.8;">Alpha 2.1.5.3</div>
    <div class="top-bar-right">
      <span class="topbar-cash" id="topbar-cash">CASH: --</span>
      <div class="faction-switcher" id="faction-switcher" style="position:relative;">
        <span class="corp-name-badge" id="corp-name-badge" onclick="toggleCorpDropdown()" style="cursor:pointer;">--</span>
        <div class="corp-faction-dropdown" id="corp-faction-dropdown"></div>
      </div>
      <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-toggle">Light</button>
      <button class="logout-btn" onclick="doLogout()">Logout</button>
    </div>
  </div>

  <!-- Nav tabs -->
  <button class="corp-hamburger" onclick="document.querySelector('.corp-nav').classList.toggle('nav-open')">&#9776;</button>
  <nav class="corp-nav" id="corp-nav">
    <a href="corp-dashboard.html" class="corp-nav__tab" data-tab="home">Home</a>
    <a href="corp-operations.html" class="corp-nav__tab" data-tab="operations" id="nav-operations">Operations</a>
    <a href="corp-operations.html?tab=expansion" class="corp-nav__tab" data-tab="expansion">Expansion</a>
    <a href="corp-operations.html?tab=actions" class="corp-nav__tab" data-tab="actions">Actions</a>
    <a href="#" class="corp-nav__tab" data-tab="innovation" onclick="return false;" style="opacity:0.4;cursor:not-allowed;">Innovation</a>
    <a href="corp-nations.html" class="corp-nav__tab active" data-tab="nations">Nations</a>
    <a href="news.html" class="corp-nav__tab" data-tab="news">News</a>
    <a href="wiki.html" class="corp-nav__tab" data-tab="wiki">Wiki</a>
  </nav>

  <div class="content">
    <!-- Page header -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <span style="font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:2px;color:#8b9a6b;text-transform:uppercase;">Nations</span>
        <span id="nation-count" style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);">-- nations tracked</span>
      </div>
    </div>

    <!-- Continent tabs -->
    <div class="continent-tabs" id="continent-tabs"></div>

    <!-- Main layout -->
    <div class="nations-layout">
      <div class="nations-list">
        <div class="nations-list-scroll" id="nations-list"></div>
      </div>
      <div class="nations-detail">
        <div class="nations-detail-scroll" id="nations-detail">
          <div style="padding:40px;text-align:center;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);">Select a nation to view details.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { escapeHtml } from './js/utils.js';

let allUserFactions = [];
let faction = null;
let shard = null;
let _allNations = [];
let _continents = {};
let _selectedContinent = '';
let _selectedNationIdx = 0;
let _presenceMap = {};  // { nationId: { hq, properties, projects, voyages, loanExposure, bondExposure, totalExposure } }
let _corpsByNation = {}; // { nationId: [corp, ...] }

function fmtMoney(n) {
    if (n === null || n === undefined) return '—';
    const abs = Math.abs(n);
    const sign = n < 0 ? '-' : '';
    if (abs >= 1e9) return sign + '$' + (abs / 1e9).toFixed(1) + 'B';
    if (abs >= 1e6) return sign + '$' + (abs / 1e6).toFixed(1) + 'M';
    if (abs >= 1e3) return sign + '$' + (abs / 1e3).toFixed(0) + 'k';
    return sign + '$' + abs.toLocaleString();
}

// ── Init ──
async function init() {
    const { data: { user } } = await _supabase.auth.getUser();
    if (!user) { window.location.href = 'login.html'; return; }

    const { data: allFactions } = await _supabase.from('factions')
        .select('*').or(`id.eq.${user.id},linked_user_id.eq.${user.id}`);
    allUserFactions = (allFactions || []).filter(f => f.nation_id);

    const activeFactionId = sessionStorage.getItem('active_faction_id');
    faction = allUserFactions.find(f => f.id === activeFactionId)
        || allUserFactions.find(f => f.faction_type === 'corporation')
        || allUserFactions[0];

    if (!faction) { await _supabase.auth.signOut(); window.location.href = 'login.html'; return; }
    if (faction.faction_type !== 'corporation') { window.location.href = 'dashboard.html'; return; }

    // Load shard + all nations
    const [shardRes, nationsRes] = await Promise.all([
        _supabase.from('shard').select('current_tick, current_date, next_tick_at, tick_interval_hours').eq('name', 'Alpha Shard').single(),
        _supabase.from('nations').select('*').order('name'),
    ]);
    shard = shardRes.data;
    _allNations = nationsRes.data || [];

    // Group by continent (use first word of name or hardcode mapping)
    // For now, all nations are on the same continent — group all together
    _continents = {};
    for (const n of _allNations) {
        const cont = n.continent || 'Crucera';
        if (!_continents[cont]) _continents[cont] = [];
        _continents[cont].push(n);
    }
    // If no continent field, put all in one group
    if (Object.keys(_continents).length === 1 && _continents['Crucera']?.length === _allNations.length) {
        _continents = { 'All Nations': _allNations };
    }
    _selectedContinent = Object.keys(_continents)[0] || '';
    _selectedNationIdx = 0;

    // Load presence data: properties, projects, voyages, loans, bonds, corporations
    try {
        const [propsRes, projectsRes, voyagesRes, loansRes, corpsRes] = await Promise.all([
            _supabase.from('corp_properties').select('nation_id').eq('faction_id', faction.id).eq('is_active', true),
            _supabase.from('construction_contracts').select('nation_id, budget_ceiling').eq('awarded_to_faction', faction.id).in('status', ['awarded', 'in_progress']),
            _supabase.from('shipping_claims').select('id, shipping_routes(origin_nation_id, destination_nation_id)').eq('faction_id', faction.id).eq('status', 'active'),
            _supabase.from('finance_active_loans').select('nation_id, principal, status, lender_faction_id, borrower_faction_id, finance_loan_requests(request_type)').in('status', ['current', 'late', 'delinquent']),
            _supabase.from('factions')
                .select('id, faction_name, abbreviation, corp_sector, corp_subsector, corp_cash_reserves, nation_id, corp_ticker, custom_logo_url')
                .eq('faction_type', 'corporation').is('abandoned_at', null),
        ]);

        // Build presence map for YOUR corp
        _presenceMap = {};
        const myNationId = faction.nation_id;
        for (const n of _allNations) {
            _presenceMap[n.id] = { hq: n.id === myNationId, properties: 0, projects: 0, voyages: 0, loanExposure: 0, bondExposure: 0, totalExposure: 0 };
        }

        // Properties
        for (const p of (propsRes.data || [])) {
            if (_presenceMap[p.nation_id]) _presenceMap[p.nation_id].properties++;
        }

        // Active construction projects
        for (const p of (projectsRes.data || [])) {
            if (_presenceMap[p.nation_id]) _presenceMap[p.nation_id].projects++;
        }

        // Shipping voyages (count both origin and destination nations)
        for (const v of (voyagesRes.data || [])) {
            const route = v.shipping_routes;
            if (route?.origin_nation_id && _presenceMap[route.origin_nation_id]) _presenceMap[route.origin_nation_id].voyages++;
            if (route?.destination_nation_id && _presenceMap[route.destination_nation_id]) _presenceMap[route.destination_nation_id].voyages++;
        }

        // Loan and bond exposure (where YOUR corp is lender)
        for (const loan of (loansRes.data || [])) {
            if (loan.lender_faction_id !== faction.id) continue;
            const nId = loan.nation_id;
            if (!_presenceMap[nId]) continue;
            const principal = Number(loan.principal || 0);
            const reqType = loan.finance_loan_requests?.request_type || 'loan';
            if (reqType === 'bond') {
                _presenceMap[nId].bondExposure += principal;
            } else {
                _presenceMap[nId].loanExposure += principal;
            }
        }

        // Calculate total exposure per nation
        for (const nId of Object.keys(_presenceMap)) {
            const p = _presenceMap[nId];
            p.totalExposure = p.loanExposure + p.bondExposure;
        }

        // Build corps per nation (all corporations, not just yours)
        _corpsByNation = {};
        for (const c of (corpsRes.data || [])) {
            if (!c.nation_id) continue;
            if (!_corpsByNation[c.nation_id]) _corpsByNation[c.nation_id] = [];
            _corpsByNation[c.nation_id].push(c);
        }
    } catch (presErr) {
        console.warn('Failed to load presence data:', presErr.message);
    }

    // Populate top bar
    const ticker = faction.corp_ticker || faction.abbreviation || '';
    document.getElementById('corp-logo').textContent = ticker.slice(0, 2) || '—';
    document.getElementById('corp-name-bar').textContent = faction.faction_name || 'Corporation';
    document.getElementById('corp-name-badge').textContent = ticker.toUpperCase() || '--';
    document.getElementById('topbar-cash').textContent = 'CASH: ' + fmtMoney(Number(faction.corp_cash_reserves) || 0);
    document.getElementById('nation-count').textContent = _allNations.length + ' nations tracked';

    if (shard) {
        document.getElementById('game-date').textContent = shard.current_date || '--';
        document.getElementById('tick-number').textContent = shard.current_tick || '--';
    }

    // If non-Construction corp, update Operations link
    if (faction.corp_sector && faction.corp_sector !== 'Construction') {
        const SECTOR_OPS = { Finance: 'corp-operations-finance.html' };
        const sectorPage = SECTOR_OPS[faction.corp_sector];
        if (sectorPage) {
            const opsTab = document.querySelector('[data-tab="operations"]');
            if (opsTab) opsTab.href = sectorPage;
        }
    }

    // Render
    renderContinentTabs();
    renderNationList();
    renderNationDetail();

    // Faction switcher
    renderFactionSwitcher();

    // Show page
    document.getElementById('loading').style.display = 'none';
    document.getElementById('page-content').style.display = 'block';

    // Tick countdown
    if (shard?.next_tick_at) {
        const updateCountdown = () => {
            const ms = new Date(shard.next_tick_at).getTime() - Date.now();
            if (ms <= 0) { document.getElementById('tick-countdown').textContent = 'NOW'; return; }
            const h = Math.floor(ms / 3600000);
            const m = Math.floor((ms % 3600000) / 60000);
            const s = Math.floor((ms % 60000) / 1000);
            document.getElementById('tick-countdown').textContent = `${h}h ${m}m ${s}s`;
        };
        updateCountdown();
        setInterval(updateCountdown, 1000);
    }
}

function renderContinentTabs() {
    const container = document.getElementById('continent-tabs');
    container.innerHTML = Object.keys(_continents).map(c => {
        const isActive = c === _selectedContinent;
        return `<div onclick="selectContinent('${escapeHtml(c)}')" class="continent-tab${isActive ? ' active' : ''}">${escapeHtml(c.toUpperCase())} (${_continents[c].length})</div>`;
    }).join('');
}

function selectContinent(c) {
    _selectedContinent = c;
    _selectedNationIdx = 0;
    renderContinentTabs();
    renderNationList();
    renderNationDetail();
}

function selectNation(idx) {
    _selectedNationIdx = idx;
    renderNationList();
    renderNationDetail();
}

function statColor(v, invert) {
    if (invert) return v >= 60 ? '#c55' : v >= 40 ? '#ca5' : '#5c5';
    return v >= 60 ? '#5c5' : v >= 40 ? '#ca5' : v >= 20 ? '#c84' : '#c55';
}

function renderNationList() {
    const container = document.getElementById('nations-list');
    const nations = _continents[_selectedContinent] || [];
    if (nations.length === 0) {
        container.innerHTML = '<div style="padding:20px;text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--text-dim);">No nations in this region.</div>';
        return;
    }

    container.innerHTML = nations.map((n, i) => {
        const isSel = _selectedNationIdx === i;
        const presence = _presenceMap[n.id] || {};
        const hasPresence = presence.hq || presence.properties > 0;
        const stability = Number(n.stability ?? 50);
        const corpTax = Number(n.corporate_tax ?? 0);
        const gdpGrowth = Number(n.gdp_growth ?? 50);
        const civilUnrest = Number(n.civil_unrest ?? 50);
        const corruption = Number(n.corruption ?? 50);
        const gdpGrowthPct = ((gdpGrowth - 50) / 50 * 3).toFixed(1);
        const govType = (n.government_type || 'Democracy').replace(/_/g, ' ');

        // Warnings
        const warnings = [];
        if (civilUnrest > 60) warnings.push({ label: 'HIGH UNREST', color: '#c84' });
        if (stability < 30) warnings.push({ label: 'UNSTABLE', color: '#c55' });
        if (corruption > 65) warnings.push({ label: 'CORRUPT', color: '#c84' });

        const corpCount = (_corpsByNation[n.id] || []).length;

        return `<div onclick="selectNation(${i})" style="
            padding:10px 14px;border-bottom:1px solid var(--border-0);cursor:pointer;
            border-left:3px solid ${isSel ? '#8b9a6b' : 'transparent'};
            background:${isSel ? 'rgba(139,154,107,0.03)' : 'transparent'};
        ">
            <!-- Row 1: Name + badges -->
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;">
                <span style="font-size:14px;font-weight:700;color:var(--text-bright);">${escapeHtml(n.name)}</span>
                ${hasPresence ? `<span style="font-family:var(--font-mono);font-size:6px;font-weight:700;padding:1px 5px;line-height:11px;color:#5c5;background:rgba(92,204,92,0.06);border:1px solid rgba(92,204,92,0.15);">YOU OPERATE HERE</span>` : ''}
                ${presence.hq ? `<span style="font-family:var(--font-mono);font-size:6px;font-weight:700;padding:1px 5px;line-height:11px;color:var(--gold);background:rgba(200,168,50,0.08);border:1px solid rgba(200,168,50,0.2);">HQ</span>` : ''}
            </div>

            <!-- Row 2: Gov type + corp count -->
            <div style="font-family:var(--font-mono);font-size:8px;color:var(--text-dim);margin-bottom:5px;">
                ${escapeHtml(govType)} · ${corpCount} corp${corpCount !== 1 ? 's' : ''} · Pop: ${((n.population || 0) / 1e6).toFixed(1)}M
            </div>

            <!-- Row 3: Key stats mini bar -->
            <div style="display:flex;gap:0;background:var(--bg-3);border:1px solid var(--border-0);">
                <div style="flex:1;padding:3px 6px;border-right:1px solid var(--border-0);text-align:center;">
                    <div style="font-family:var(--font-mono);font-size:6px;color:var(--text-dim);">STAB</div>
                    <div style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:${statColor(stability)};margin-top:1px;">${stability}</div>
                </div>
                <div style="flex:1;padding:3px 6px;border-right:1px solid var(--border-0);text-align:center;">
                    <div style="font-family:var(--font-mono);font-size:6px;color:var(--text-dim);">CORP TAX</div>
                    <div style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:${statColor(corpTax, true)};margin-top:1px;">${corpTax}%</div>
                </div>
                <div style="flex:1;padding:3px 6px;border-right:1px solid var(--border-0);text-align:center;">
                    <div style="font-family:var(--font-mono);font-size:6px;color:var(--text-dim);">GDP ▲</div>
                    <div style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:${Number(gdpGrowthPct) > 0 ? '#5c5' : '#c55'};margin-top:1px;">${Number(gdpGrowthPct) > 0 ? '+' : ''}${gdpGrowthPct}%</div>
                </div>
                <div style="flex:1.2;padding:3px 6px;text-align:center;">
                    <div style="font-family:var(--font-mono);font-size:6px;color:var(--text-dim);">GDP</div>
                    <div style="font-family:var(--font-mono);font-size:9px;font-weight:700;color:var(--text-primary);margin-top:1px;">${fmtMoney(n.gdp)}</div>
                </div>
            </div>

            <!-- Row 4: Warning tags -->
            ${warnings.length > 0 ? `<div style="display:flex;gap:3px;margin-top:4px;flex-wrap:wrap;">
                ${warnings.map(w => `<span style="font-family:var(--font-mono);font-size:6px;font-weight:700;padding:1px 4px;line-height:11px;color:${w.color};background:${w.color}0a;border:1px solid ${w.color}20;">${w.label}</span>`).join('')}
            </div>` : ''}
        </div>`;
    }).join('');
}

function renderNationDetail() {
    const container = document.getElementById('nations-detail');
    const nations = _continents[_selectedContinent] || [];
    const sel = nations[_selectedNationIdx];
    if (!sel) {
        container.innerHTML = '<div style="padding:40px;text-align:center;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);">Select a nation to view details.</div>';
        return;
    }

    const s = (key) => Number(sel[key] ?? 50);
    const govType = (sel.government_type || 'Democracy').replace(/_/g, ' ');
    const presence = _presenceMap[sel.id] || {};
    const corps = _corpsByNation[sel.id] || [];
    const gdpGrowthPct = ((s('gdp_growth') - 50) / 50 * 3).toFixed(1);

    let html = '';

    // ── Nation header ──
    html += `<div style="padding:14px 20px;border-bottom:1px solid var(--border-0);background:var(--bg-3);flex-shrink:0;">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:5px;">
            <span style="font-size:23px;font-weight:700;color:var(--text-bright);">${escapeHtml(sel.name)}</span>
            ${presence.hq ? '<span style="font-family:var(--font-mono);font-size:9px;font-weight:700;padding:3px 8px;color:var(--gold);background:rgba(200,168,50,0.08);border:1px solid rgba(200,168,50,0.2);">YOUR HQ</span>' : ''}
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
            <span style="font-family:var(--font-mono);font-size:12px;color:var(--text-dim);">${escapeHtml(govType)}</span>
            <span style="font-family:var(--font-mono);font-size:12px;color:var(--text-dim);">·</span>
            <span style="font-family:var(--font-mono);font-size:12px;color:var(--text-dim);">Pop: ${((sel.population || 0) / 1e6).toFixed(1)}M</span>
            <span style="font-family:var(--font-mono);font-size:12px;color:var(--text-dim);">·</span>
            <span style="font-family:var(--font-mono);font-size:12px;color:var(--text-dim);">Capital: ${escapeHtml(sel.capital || '—')}</span>
        </div>
    </div>`;

    // ── Economic Health ──
    html += `<div style="padding:8px 20px;border-bottom:1px solid var(--border-0);background:var(--bg-3);">
        <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:1.5px;color:#a3b07e;text-transform:uppercase;">Economic Health</span>
    </div>`;
    html += `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border-bottom:1px solid var(--border-0);">`;
    const econStats = [
        { label: 'GDP', value: fmtMoney(sel.gdp), color: 'var(--text-bright)' },
        { label: 'GDP GROWTH', value: `${Number(gdpGrowthPct) > 0 ? '+' : ''}${gdpGrowthPct}%`, color: Number(gdpGrowthPct) > 0 ? '#5c5' : '#c55' },
        { label: 'POPULATION', value: `${((sel.population || 0) / 1e6).toFixed(1)}M`, color: 'var(--text-bright)' },
        { label: 'URBANIZATION', value: s('urbanization'), color: statColor(s('urbanization')) },
        { label: 'INFLATION', value: s('inflation'), color: statColor(s('inflation'), true) },
        { label: 'UNEMPLOYMENT', value: `${s('unemployment')}%`, color: statColor(s('unemployment'), true) },
    ];
    for (let i = 0; i < econStats.length; i++) {
        const st = econStats[i];
        html += `<div style="padding:8px 14px;${i % 3 < 2 ? 'border-right:1px solid var(--border-0);' : ''}${i < 3 ? 'border-bottom:1px solid var(--border-0);' : ''}">
            <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);letter-spacing:0.5px;">${st.label}</div>
            <div style="font-family:var(--font-mono);font-size:17px;font-weight:700;color:${st.color};margin-top:3px;">${st.value}</div>
        </div>`;
    }
    html += '</div>';

    // ── Business Environment ──
    html += `<div style="padding:8px 20px;border-bottom:1px solid var(--border-0);background:var(--bg-3);">
        <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:1.5px;color:#a3b07e;text-transform:uppercase;">Business Environment</span>
    </div>`;
    html += '<div style="padding:8px 20px;border-bottom:1px solid var(--border-0);">';
    const bizStats = [
        { stat: 'Corporate Tax', value: s('corporate_tax'), display: s('corporate_tax') + '%', invert: true },
        { stat: 'Stability', value: s('stability'), display: s('stability'), invert: false },
        { stat: 'Foreign Investment', value: s('foreign_investment'), display: s('foreign_investment'), invert: false },
        { stat: 'Corruption', value: s('corruption'), display: s('corruption'), invert: true },
        { stat: 'Judicial Independence', value: s('judicial_independence'), display: s('judicial_independence'), invert: false },
        { stat: 'Civil Unrest', value: s('civil_unrest'), display: s('civil_unrest'), invert: true },
        { stat: 'Currency Strength', value: s('currency_strength'), display: s('currency_strength'), invert: false },
        { stat: 'Credit Rating', value: s('credit'), display: s('credit'), invert: false },
    ];
    for (let i = 0; i < bizStats.length; i++) {
        const bs = bizStats[i];
        const sc = statColor(bs.value, bs.invert);
        html += `<div style="display:flex;align-items:center;gap:8px;padding:4px 0;${i < bizStats.length - 1 ? 'border-bottom:1px solid var(--border-0);' : ''}">
            <span style="font-family:var(--font-mono);font-size:12px;color:var(--text-muted);width:170px;">${bs.stat}</span>
            <div style="flex:1;height:4px;background:var(--border-0);"><div style="width:${bs.value}%;height:100%;background:${sc};"></div></div>
            <span style="font-family:var(--font-mono);font-size:13px;font-weight:700;color:${sc};width:42px;text-align:right;">${bs.display}</span>
        </div>`;
    }
    html += '</div>';

    // ── Risk Indicators ──
    const risks = [];
    if (s('stability') < 30) risks.push({ icon: '⚠', color: '#c84', text: 'Stability below 30. Political collapse, coup, or revolution possible.' });
    if (s('civil_unrest') > 60) risks.push({ icon: '⚠', color: '#c84', text: 'High civil unrest. Strikes, protests, and disruptions likely.' });
    if (s('corruption') > 65) risks.push({ icon: '⚠', color: '#c84', text: 'High corruption. Regulatory risk, bribery costs, unpredictable enforcement.' });
    if (s('inflation') > 65) risks.push({ icon: '⚠', color: '#ca5', text: 'High inflation. Currency devaluation risk, rising input costs.' });
    if (s('foreign_investment') < 25) risks.push({ icon: '⚠', color: '#ca5', text: 'Low foreign investment. Capital flight risk, limited financing options.' });
    if (s('judicial_independence') < 25) risks.push({ icon: '⚠', color: '#c55', text: 'Low judicial independence. Contracts may not be enforceable.' });

    if (risks.length > 0) {
        html += `<div style="padding:8px 20px;border-bottom:1px solid var(--border-0);background:var(--bg-3);">
            <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:1.5px;color:#c55;text-transform:uppercase;">Risk Indicators</span>
        </div>`;
        html += '<div style="padding:8px 20px;border-bottom:1px solid var(--border-0);">';
        for (const r of risks) {
            html += `<div style="display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--border-0);">
                <span style="font-family:var(--font-mono);font-size:12px;color:${r.color};font-weight:700;">${r.icon}</span>
                <span style="font-size:13px;color:${r.color};">${r.text}</span>
            </div>`;
        }
        html += '</div>';
    }

    // ── Active Corporations in this Nation ──
    html += `<div style="padding:8px 20px;border-bottom:1px solid var(--border-0);background:var(--bg-3);">
        <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:1.5px;color:#5a8aaa;text-transform:uppercase;">Corporations &amp; Subsidiaries</span>
        <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);margin-left:8px;">${corps.length} active</span>
    </div>`;
    if (corps.length > 0) {
        html += '<div style="border-bottom:1px solid var(--border-0);">';
        for (const c of corps) {
            const isYours = c.id === faction.id;
            const ticker = (c.abbreviation || c.corp_ticker || '??').toUpperCase();
            const logoHtml = c.custom_logo_url
                ? `<img src="${escapeHtml(c.custom_logo_url)}" alt="" style="width:32px;height:32px;object-fit:cover;border-radius:4px;flex-shrink:0;">`
                : `<div style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:rgba(200,168,50,0.08);border:1px solid rgba(200,168,50,0.2);border-radius:4px;flex-shrink:0;font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--gold);">${escapeHtml(ticker.slice(0,3))}</div>`;
            html += `<div style="display:flex;align-items:center;gap:10px;padding:8px 20px;border-bottom:1px solid var(--border-0);">
                ${logoHtml}
                <div style="flex:1;min-width:0;">
                    <div style="font-size:14px;font-weight:600;color:${isYours ? '#5c5' : 'var(--text-primary)'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                        ${escapeHtml(c.faction_name)}${isYours ? ' <span style="font-family:var(--font-mono);font-size:9px;color:#5c5;border:1px solid rgba(92,204,92,0.2);padding:1px 4px;">YOU</span>' : ''}
                    </div>
                    <div style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);">${escapeHtml(c.corp_sector || '—')} · ${escapeHtml(c.corp_subsector || '—')}</div>
                </div>
                <span style="font-family:var(--font-mono);font-size:12px;color:var(--text-muted);">${fmtMoney(c.corp_cash_reserves)}</span>
            </div>`;
        }
        html += '</div>';
    } else {
        html += '<div style="padding:14px 20px;font-family:var(--font-mono);font-size:12px;color:var(--text-dim);border-bottom:1px solid var(--border-0);">No corporations headquartered in this nation.</div>';
    }

    // Your Presence
    html += `<div style="padding:8px 20px;border-bottom:1px solid var(--border-0);background:var(--bg-3);">
        <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;">Your Presence</span>
    </div>`;
    html += '<div id="your-presence-container" style="padding:14px 20px;font-family:var(--font-mono);font-size:12px;color:var(--text-dim);">Loading presence data...</div>';

    container.innerHTML = html;

    // Phase 5 will populate the presence container
    renderYourPresence(sel);
}

function renderYourPresence(nation) {
    const container = document.getElementById('your-presence-container');
    if (!container) return;
    const p = _presenceMap[nation.id] || {};

    const presenceItems = [
        { label: 'HQ', value: p.hq ? 'YES' : '—', color: p.hq ? 'var(--gold)' : 'var(--text-dim)' },
        { label: 'PROPERTIES', value: p.properties || '—', color: p.properties > 0 ? '#8b9a6b' : 'var(--text-dim)' },
        { label: 'ACTIVE PROJECTS', value: p.projects || '—', color: p.projects > 0 ? 'var(--text-bright)' : 'var(--text-dim)' },
        { label: 'ACTIVE VOYAGES', value: p.voyages || '—', color: p.voyages > 0 ? '#5a8aaa' : 'var(--text-dim)' },
        { label: 'LOAN EXPOSURE', value: p.loanExposure > 0 ? fmtMoney(p.loanExposure) : '—', color: p.loanExposure > 0 ? '#c84' : 'var(--text-dim)' },
        { label: 'BOND EXPOSURE', value: p.bondExposure > 0 ? fmtMoney(p.bondExposure) : '—', color: p.bondExposure > 0 ? '#c84' : 'var(--text-dim)' },
    ];

    let html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--bg-3);border:1px solid var(--border-0);margin-bottom:8px;">';
    for (let i = 0; i < presenceItems.length; i++) {
        const item = presenceItems[i];
        html += `<div style="padding:7px 14px;${i % 2 === 0 ? 'border-right:1px solid var(--border-0);' : ''}${i < presenceItems.length - 2 ? 'border-bottom:1px solid var(--border-0);' : ''}">
            <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);letter-spacing:0.5px;">${item.label}</div>
            <div style="font-family:var(--font-mono);font-size:14px;font-weight:700;color:${item.color};margin-top:2px;">${item.value}</div>
        </div>`;
    }
    html += '</div>';

    // Total exposure hero number
    const exposureColor = p.totalExposure > 50000000 ? '#c55' : p.totalExposure > 10000000 ? '#c84' : p.totalExposure > 0 ? '#ca5' : 'var(--text-dim)';
    html += `<div style="padding:10px 14px;background:${p.totalExposure > 50000000 ? 'rgba(204,85,85,0.04)' : p.totalExposure > 0 ? 'rgba(200,168,50,0.03)' : 'transparent'};border:1px solid ${p.totalExposure > 50000000 ? 'rgba(204,85,85,0.15)' : 'var(--border-0)'};display:flex;justify-content:space-between;align-items:center;">
        <span style="font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--text-bright);">TOTAL EXPOSURE</span>
        <span style="font-family:var(--font-mono);font-size:22px;font-weight:700;color:${exposureColor};">${p.totalExposure > 0 ? fmtMoney(p.totalExposure) : '—'}</span>
    </div>`;

    // No presence message
    if (!p.hq && !p.properties && !p.projects && !p.voyages && p.totalExposure === 0) {
        html += '<div style="padding:10px 0;font-family:var(--font-mono);font-size:12px;color:var(--text-dim);text-align:center;">No operations in this nation.</div>';
    }

    container.innerHTML = html;
}

// ── Faction switcher ──
function renderFactionSwitcher() {
    const dropdown = document.getElementById('corp-faction-dropdown');
    if (!dropdown || allUserFactions.length <= 1) return;
    let html = '';
    for (const f of allUserFactions) {
        const isActive = f.id === faction.id;
        const label = f.faction_type === 'corporation' ? 'CORP' : 'PARTY';
        html += `<div class="corp-faction-dropdown__item${isActive ? ' active' : ''}" onclick="switchToFaction('${f.id}')">
            <span style="font-size:7px;padding:1px 4px;border:1px solid var(--border-1);margin-right:4px;">${label}</span>
            ${escapeHtml(f.faction_name || 'Unknown')}
        </div>`;
    }
    dropdown.innerHTML = html;
}

function toggleCorpDropdown() {
    document.getElementById('corp-faction-dropdown')?.classList.toggle('open');
}

function switchToFaction(factionId) {
    sessionStorage.setItem('active_faction_id', factionId);
    const f = allUserFactions.find(x => x.id === factionId);
    if (f?.faction_type === 'party') window.location.href = 'dashboard.html';
    else window.location.href = 'corp-dashboard.html';
}

async function doLogout() {
    await _supabase.auth.signOut();
    window.location.href = 'login.html';
}

function toggleTheme() {
    document.body.classList.toggle('light-mode');
    const btn = document.getElementById('theme-toggle');
    if (btn) btn.textContent = document.body.classList.contains('light-mode') ? 'Dark' : 'Light';
}

window.selectContinent = selectContinent;
window.selectNation = selectNation;
window.toggleCorpDropdown = toggleCorpDropdown;
window.switchToFaction = switchToFaction;
window.doLogout = doLogout;
window.toggleTheme = toggleTheme;

init();
</script>
</body>
</html>
