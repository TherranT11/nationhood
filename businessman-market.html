<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market | Nationhood</title>
<style>
  .ent-content { max-width: 1100px; margin: 0 auto; padding: 26px 24px 60px; }

  .mk-tabs { display:flex; gap:8px; margin-bottom:22px; }
  .mk-tab { padding:10px 18px; font-family:var(--font-mono); font-size:10.5px;
    letter-spacing:0.12em; font-weight:700; background:#0a0a0a; color:#888;
    border:1px solid rgba(255,255,255,0.1); border-radius:4px; text-align:center; }
  .mk-tab.locked { opacity:0.35; cursor:not-allowed; }
  .mk-tab[data-panel] { cursor:pointer; }
  .mk-tab[data-panel]:hover { border-color:rgba(138,170,106,0.4); }
  .mk-tab.sel { background:#10140e; border-color:#8aaa6a; color:#aac88a; }

  .mk-panel { background:#0b0d0a; border:0.5px solid rgba(138,170,106,0.25);
    border-radius:6px; padding:16px 18px 18px; }
  .mk-head { display:flex; align-items:center; gap:14px; margin-bottom:16px; }
  .mk-head .rule { flex:1; height:1px; background:rgba(138,170,106,0.25); }
  .mk-head .t { font-family:var(--font-mono); font-size:11px; letter-spacing:0.3em;
    color:#aac88a; font-weight:700; white-space:nowrap; }

  .mk-grid { display:grid; grid-template-columns:1.6fr 1fr 1fr; gap:8px 14px;
    align-items:center; }
  .mk-grid .h { font-family:var(--font-mono); font-size:8.5px; letter-spacing:0.14em;
    color:#555; font-weight:700; padding-bottom:4px;
    border-bottom:0.5px solid rgba(255,255,255,0.07); }
  .mk-grid .c { font-size:12.5px; color:#ccc; padding:9px 0; min-width:0;
    overflow-wrap:break-word; }
  .mk-grid .c.nm { color:#fff; font-weight:600; }
  .mk-grid .c.money { font-family:var(--font-mono); color:#8aaa6a; }
  .mk-grid .c .sub { display:block; font-family:var(--font-mono); font-size:9px;
    color:#666; margin-top:3px; }

  .mk-empty { padding:26px 16px; text-align:center; color:#555; font-size:11.5px;
    font-style:italic; background:#0a0a0a; border:0.5px dashed rgba(255,255,255,0.08);
    border-radius:5px; }

  #loading { font-family:var(--font-mono); font-size:10px; color:#4a4940;
    text-align:center; padding:80px 20px; }
</style>
</head>
<body>

<div id="ent-topbar"></div>
<div id="loading">LOADING...</div>
<div class="ent-content" id="page-content" style="display:none;">
  <div class="mk-tabs">
    <div class="mk-tab locked" title="Coming soon">CORPORATIONS</div>
    <div class="mk-tab locked" title="Coming soon">ASSETS</div>
    <div class="mk-tab" data-panel="mk-products">PRODUCTS</div>
    <div class="mk-tab sel" data-panel="mk-raw">RAW MATERIALS</div>
  </div>
  <div class="mk-panel" id="mk-raw">
    <div class="mk-head"><span class="rule"></span><span class="t">RAW MATERIALS</span><span class="rule"></span></div>
    <div id="mk-rows"><div class="mk-empty">Loading the exchange…</div></div>
  </div>
  <div class="mk-panel" id="mk-products" style="display:none;">
    <div class="mk-head"><span class="rule"></span><span class="t">PRODUCTS</span><span class="rule"></span></div>
    <div id="mk-product-rows"><div class="mk-empty">Loading the exchange…</div></div>
  </div>
</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { bootstrapBusinessman } from './js/entrepreneur-topbar.js';
import { hfFmtBig, escapeHtml as esc } from './js/utils.js';

(async () => {
  try {
    const ctx = await bootstrapBusinessman('market');
    if (!ctx) return; // redirected (no auth / no businessman faction)

    // Each listing's numbers come from its one server source
    // (construction_materials_market 20270811/12,
    // construction_equipment_market 20270815) — the future purchase
    // RPCs read the same functions, so listed prices are charged
    // prices. One renderer shapes every market row.
    const marketRow = (name, mkt) => `
      <div class="mk-grid">
        <div class="h">NAME</div><div class="h">AMOUNT AVAILABLE</div><div class="h">COST PER UNIT</div>
        <div class="c nm">${esc(name)}</div>
        <div class="c">${esc(Number(mkt.amount_available).toLocaleString())} units</div>
        <div class="c money">${esc(hfFmtBig(Number(mkt.cost_per_unit) || 0))}
          <span class="sub">base ${esc(hfFmtBig(Number(mkt.base_cost) || 0))} × ${esc(String(mkt.scarcity_mult))} scarcity</span>
        </div>
      </div>`;
    const loadListing = async (rpc, name, hostId) => {
      const host = document.getElementById(hostId);
      try {
        const { data: mkt, error } = await _supabase.rpc(rpc,
          { p_nation_id: ctx.faction.nation_id });
        if (error) throw error;
        if (!mkt?.success) throw new Error(mkt?.reason || 'unknown');
        host.innerHTML = marketRow(name, mkt);
      } catch (e) {
        console.warn(`[businessman-market] ${rpc} fetch failed:`, e?.message || e);
        host.innerHTML = '<div class="mk-empty">Could not load the exchange — try again shortly.</div>';
      }
    };
    loadListing('construction_materials_market', 'Construction Materials', 'mk-rows');
    loadListing('construction_equipment_market', 'Construction Equipment', 'mk-product-rows');

    // Tab switching — only the panels with data-panel are live;
    // Corporations / Assets stay locked.
    document.querySelectorAll('.mk-tab[data-panel]').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.mk-tab[data-panel]').forEach(t =>
          t.classList.toggle('sel', t === tab));
        document.querySelectorAll('.mk-panel').forEach(p =>
          p.style.display = p.id === tab.dataset.panel ? 'block' : 'none');
      });
    });

    document.getElementById('loading').style.display = 'none';
    document.getElementById('page-content').style.display = 'block';
  } catch (err) {
    console.error('businessman-market: bootstrap failed', err);
    document.getElementById('loading').textContent = 'FAILED TO LOAD — PLEASE REFRESH';
  }
})();
</script>
</body>
</html>
