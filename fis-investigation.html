<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIS Investigation — Nationhood</title>
<style>
  body { margin:0; min-height:100vh; background:#050505; color:#d4d4d4;
         font-family:-apple-system,system-ui,sans-serif; }
  .wrap { max-width:880px; margin:0 auto; padding:24px 22px 60px; }
  .crumb { font-size:9px; letter-spacing:0.13em; color:#666; margin-bottom:14px; }
  .crumb a { color:#888; text-decoration:none; }
  .crumb a:hover { color:#a5c0d0; }
  .crumb .sep { margin:0 7px; color:#3a3a3a; }
  .crumb .here { color:#a5c0d0; }

  .page-head { background:#0d0d0d; border:0.5px solid rgba(255,255,255,0.08);
               border-left:3px solid #7a9aab; border-radius:6px; padding:18px 22px;
               margin-bottom:18px; display:flex; align-items:flex-start; gap:18px; }
  .ph-icon { width:42px; height:42px; border-radius:5px; background:#0e1218;
             border:0.5px solid #3a5060; color:#a5c0d0; display:flex;
             align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
  .ph-info { flex:1; min-width:0; }
  .ph-eyebrow { font-size:8.5px; letter-spacing:0.18em; color:#7a9aab; font-weight:700; margin-bottom:4px; }
  .ph-title { font-family:Georgia,serif; font-size:22px; font-weight:500; color:#fff; line-height:1.2; }
  .ph-title em { font-style:italic; color:#a5c0d0; }
  .ph-meta { font-size:10.5px; color:#888; margin-top:8px; line-height:1.6; }
  .ph-meta strong { color:#bbb; font-weight:600; }

  .card { background:#0d0d0d; border:0.5px solid rgba(255,255,255,0.08);
          border-radius:6px; padding:18px 22px; margin-bottom:14px; }
  .card-lab { font-size:9px; letter-spacing:0.16em; color:#7a9aab; font-weight:700; margin-bottom:10px; }
  .card-body { font-size:12px; color:#cfcabf; line-height:1.6; }
  .card-body strong { color:#fff; font-weight:600; }

  .placeholder { font-size:11px; color:#666; font-style:italic; padding:18px 0; text-align:center; }

  /* Two-column case layout: history feed left, target + actions right. */
  .case-grid { display:grid; grid-template-columns: 1.3fr 1fr; gap:14px; align-items:start; }
  @media (max-width: 760px) { .case-grid { grid-template-columns:1fr; } }

  .hist-list { display:flex; flex-direction:column; max-height:65vh; overflow-y:auto; }
  .hist-row { padding:11px 2px; border-bottom:0.5px solid rgba(255,255,255,0.06); }
  .hist-row:last-child { border-bottom:none; }
  .hist-meta { display:flex; align-items:baseline; gap:8px; margin-bottom:4px; }
  .hist-title { font-size:11.5px; color:#fff; font-weight:600; }
  .hist-tick { margin-left:auto; font-size:8.5px; color:#666; font-family:monospace;
               letter-spacing:0.04em; flex-shrink:0; }
  .hist-body { font-size:10.5px; color:#999; line-height:1.55; }
  /* Fraud-flavoured rows get the red accent — these are exactly the
     lines an agent is hunting for. */
  .hist-row.flagged .hist-title { color:#e07a7a; }
  .hist-row.flagged { border-left:2px solid #5a2020; padding-left:9px; }
  .hist-empty { padding:24px 8px; font-size:11px; color:#666; font-style:italic; text-align:center; }

  .loading { font-size:11px; color:#666; font-style:italic; padding:60px 22px; text-align:center; }
  .fail    { color:#d49a9a; font-size:11px; padding:60px 22px; text-align:center; }

  .close-inv-btn { display:block; width:100%; padding:10px 14px; background:transparent;
    border:0.5px solid rgba(200,120,120,0.35); border-radius:4px; color:#c87a7a;
    font-size:9.5px; letter-spacing:0.14em; font-weight:700; cursor:pointer;
    font-family:inherit; margin-top:12px; }
  .close-inv-btn:hover:not(:disabled) { background:#160e0e; border-color:#c87a7a; color:#fff; }
  .close-inv-btn:disabled { opacity:0.5; cursor:not-allowed; }
  .close-inv-note { font-size:9.5px; color:#666; margin-top:6px; text-align:center; font-style:italic; }
</style>
</head>
<body>

<!-- Politician topbar (shared across every politician page). Bootstraps
     the session + renders the chip + tab nav. -->
<div id="pol-topbar-container"></div>

<div class="wrap">
  <div class="crumb">
    <a href="politician-home.html">HOME</a>
    <span class="sep">&rsaquo;</span>
    <span class="here">INVESTIGATION</span>
  </div>
  <div id="content" class="loading">Loading case file&hellip;</div>
</div>

<script type="module">
import { bootstrapPolitician } from './js/politician-topbar.js';
import { _supabase } from './js/supabase-client.js';
import { tickToDate } from './js/utils.js';

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}
function fmtCategory(c) {
  return (c || '').replace(/_/g, ' ').replace(/\b\w/g, x => x.toUpperCase());
}

async function init() {
  const id = new URLSearchParams(location.search).get('id');
  const content = document.getElementById('content');
  if (!id) { content.className = 'fail'; content.textContent = 'No investigation id.'; return; }

  // bootstrapPolitician redirects to login / first-steps if the user
  // isn't an authenticated politician. Returns null in that case;
  // the function navigates so we just bail out.
  let ctx;
  try { ctx = await bootstrapPolitician('home'); }
  catch (err) {
    content.className = 'fail';
    content.textContent = 'Failed to load. Please reload the page.';
    console.warn('[fis-investigation] bootstrap failed:', err?.message || err);
    return;
  }
  if (!ctx) return;

  // 20270769 fix: entrepreneur_corps.hq was dropped in
  // sql/migrations/20270142_entrepreneur_corp_hq_nation.sql and
  // replaced by hq_nation_id (FK → nations.id). Join the nation
  // through that FK to surface the HQ as "{Nation Name}".
  const { data, error } = await _supabase.from('fis_investigations')
    .select('id, category, target_corp_id, target_corp_name, status, opened_at_tick, closed_at_tick, agent_faction_id, target_corp:entrepreneur_corps!target_corp_id(name, industry, hq_nation:nations!hq_nation_id(name))')
    .eq('id', id)
    .maybeSingle();
  if (error) { content.className = 'fail'; content.textContent = 'Could not load case: ' + (error.message || 'try again'); return; }
  if (!data)  { content.className = 'fail'; content.textContent = 'Case not found.'; return; }

  const targetName = data.target_corp?.name || data.target_corp_name || '—';
  const industry   = (data.target_corp?.industry || '').replace(/_/g, ' ').toUpperCase();
  const hqNation   = data.target_corp?.hq_nation?.name || null;
  // [Close Investigation] only renders for the owning agent on an
  // active case — observers and sealed cases get the read-only view.
  const isOwnActiveCase = data.status === 'active'
    && data.agent_faction_id === (ctx.faction?.id || null);

  // Corporate History — same source the corp page's Corporate History
  // container reads (list_corp_history, 20270564: event_log scoped to
  // the corp + corp_tax_bills issuance/payment rows, capped at 50).
  // Soft-fail: a fetch error degrades to an inline message rather than
  // tanking the case file.
  let histEvents = null;   // null = fetch failed; [] = genuinely empty
  if (data.target_corp_id) {
    try {
      const { data: hist, error: histErr } = await _supabase.rpc('list_corp_history',
        { p_corp_id: data.target_corp_id });
      if (histErr) throw histErr;
      if (hist?.success) histEvents = Array.isArray(hist.events) ? hist.events : [];
    } catch (err) {
      console.warn('[fis-investigation] corp history fetch failed:', err?.message || err);
    }
  }

  const histHtml = (() => {
    if (!data.target_corp_id) {
      return '<div class="hist-empty">Target corporation no longer exists — its records went with it.</div>';
    }
    if (histEvents === null) {
      return '<div class="hist-empty">Could not load corporate records. Refresh to retry.</div>';
    }
    if (histEvents.length === 0) {
      return '<div class="hist-empty">No recorded transactions yet.</div>';
    }
    return histEvents.map(ev => {
      // Fraud-flavoured kinds get the red accent — the needles the
      // agent is hunting in this haystack.
      const flagged = String(ev.kind || '').includes('fraud');
      return `
      <div class="hist-row${flagged ? ' flagged' : ''}">
        <div class="hist-meta">
          <span class="hist-title">${escHtml(ev.title || '—')}</span>
          <span class="hist-tick">${escHtml(tickToDate(Number(ev.tick) || 0))}</span>
        </div>
        <div class="hist-body">${escHtml(ev.body || '')}</div>
      </div>`;
    }).join('');
  })();

  content.className = '';
  content.innerHTML = `
    <div class="page-head">
      <div class="ph-icon">🔍</div>
      <div class="ph-info">
        <div class="ph-eyebrow">FEDERAL INVESTIGATIONS SERVICE &middot; ACTIVE CASE</div>
        <div class="ph-title">Investigation into <em>${escHtml(targetName)}</em></div>
        <div class="ph-meta">
          <strong>${escHtml(fmtCategory(data.category))}</strong>
          &middot; Opened at tick ${escHtml(String(data.opened_at_tick ?? '?'))}
          &middot; Status: <strong>${escHtml((data.status || '').toUpperCase())}</strong>
        </div>
      </div>
    </div>

    <div class="case-grid">
      <div class="card" style="margin-bottom:0;">
        <div class="card-lab">CORPORATE HISTORY AND TRANSACTIONS</div>
        <div class="hist-list">${histHtml}</div>
      </div>

      <div>
        <div class="card">
          <div class="card-lab">TARGET</div>
          <div class="card-body">
            <strong>${escHtml(targetName)}</strong>${industry ? ` &middot; ${escHtml(industry)}` : ''}
            ${hqNation ? `<br>Headquartered in ${escHtml(hqNation)}.` : ''}
          </div>
        </div>

        <div class="card">
          <div class="card-lab">CASE ACTIONS</div>
          <div class="placeholder">Subpoena, interview, and evidence mechanics land in a follow-up. This page is the persistent surface for the case file.</div>
          ${isOwnActiveCase ? `
          <button type="button" class="close-inv-btn" id="close-inv-btn">&#10005; CLOSE INVESTIGATION</button>
          <div class="close-inv-note">Closing without findings costs <strong>−1 Reputation</strong>.</div>` : ''}
        </div>
      </div>
    </div>`;

  // [Close Investigation] — agent-only, active cases only. Confirm →
  // RPC (status='closed', −1 Reputation) → back to politician-home
  // (the Pressing Issues card drops since the list RPC filters
  // status='active').
  const closeBtn = document.getElementById('close-inv-btn');
  if (closeBtn) {
    closeBtn.addEventListener('click', async () => {
      if (closeBtn.disabled) return;
      if (!confirm('Close this investigation? You found nothing — this costs 1 Reputation and the case file is sealed.')) return;
      closeBtn.disabled = true;
      const prev = closeBtn.textContent;
      closeBtn.textContent = 'CLOSING…';
      try {
        const { data: res, error: rpcErr } = await _supabase.rpc('politician_fis_close_investigation', {
          p_faction_id:       ctx.faction?.id || null,
          p_investigation_id: id,
        });
        if (rpcErr) throw rpcErr;
        if (!res?.success) {
          const REASON = {
            not_authenticated:       'You are not signed in.',
            invalid_arguments:       'Malformed request — refresh and retry.',
            no_politician:           'No politician faction found.',
            investigation_not_found: 'This case no longer exists.',
            not_your_case:           'This is not your case to close.',
            already_closed:          'This case is already closed.',
          };
          alert(REASON[res?.reason] || ('Could not close: ' + (res?.reason || 'unknown')));
          closeBtn.disabled = false;
          closeBtn.textContent = prev;
          return;
        }
        window.location.href = 'politician-home.html';
      } catch (e) {
        alert('Failed: ' + (e?.message || e));
        closeBtn.disabled = false;
        closeBtn.textContent = prev;
      }
    });
  }
}

init().catch(err => {
  const content = document.getElementById('content');
  content.className = 'fail';
  content.textContent = 'Init failed: ' + (err?.message || 'unknown error');
});
</script>

</body>
</html>
