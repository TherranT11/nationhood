<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melizea | Nationhood Alpha</title>
    
        <link rel="stylesheet" href="css/melizea.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="nation-container">
    <div id="loading" class="loading">
        Loading Melizea data...
    </div>
    
    <div id="content" style="display: none;">
        <h1 id="nation-name">MELIZEA</h1>
        
        <!-- Nation Stats -->
        <div class="stats-section">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-label">Government Type</div>
                    <div class="stat-value" id="government-type">Loading...</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Capital</div>
                    <div class="stat-value" id="capital">Loading...</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Population</div>
                    <div class="stat-value" id="population">Loading...</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Stability</div>
                    <div class="stat-value" id="stability">Loading...</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Civil Unrest</div>
                    <div class="stat-value" id="civil-unrest">Loading...</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">GDP</div>
                    <div class="stat-value" id="gdp">Loading...</div>
                </div>
            </div>
        </div>
        
        <!-- Voter Blocs -->
        <h2>Voter Blocs</h2>
        <div class="interest-groups" id="interest-groups">
            <!-- Populated by JavaScript -->
        </div>
        
        <!-- Government -->
        <h2>Government</h2>
        <div class="government-section">
            <div class="head-of-government">
                <div class="head-label">Head of Government</div>
                <div class="head-value" id="head-of-government">Loading...</div>
            </div>
            
            <div class="parties-list" id="parties-list">
                <!-- Populated by JavaScript -->
            </div>
        </div>
        
        <!-- Action Buttons -->
        <div class="action-buttons">
            <button class="btn btn-back" onclick="goBack()">← GO BACK</button>
            <button class="btn btn-continue" id="continue-btn" onclick="continueToPartyCreation()">CONTINUE →</button>
        </div>
    </div>
</div>

<script type="module">
const { createClient } = supabase;
const supabaseUrl = 'https://pbumjalxclmegzckhqqr.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBidW1qYWx4Y2xtZWd6Y2tocXFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3ODk0NTUsImV4cCI6MjA4NTM2NTQ1NX0.ykjUqdJbwF3yliond1Vz2lcNQZCWA-5SnviruXm4ypI';
    const _supabase = createClient(supabaseUrl, supabaseKey);
    
    const NATION_NAME = 'Melizea';
    let nationData = null;
    let currentUser = null;
    
    // Ideology color mapping
    const ideologyColors = {
        'LIBERTY': 'ideology-liberty',
        'EQUALITY': 'ideology-equality',
        'FREEDOM': 'ideology-freedom',
        'SECURITY': 'ideology-security',
        'COOPERATION': 'ideology-cooperation',
        'COMPETITION': 'ideology-competition',
        'TRADITION': 'ideology-tradition',
        'PROGRESS': 'ideology-progress',
        'NATIONALISM': 'ideology-nationalism',
        'GLOBALISM': 'ideology-globalism'
    };
    
    async function loadNationData() {
        try {
            // Check if user is logged in
            const { data: { user } } = await _supabase.auth.getUser();
            if (!user) {
                window.location.href = "login.html";
                return;
            }
            currentUser = user;
            
            // Load nation data
            const { data: nation, error: nationError } = await _supabase
                .from('nations')
                .select('*')
                .eq('name', NATION_NAME)
                .single();
            
            if (nationError) throw nationError;
            nationData = nation;
            
            // Load interest groups
            const { data: interestGroups, error: groupsError } = await _supabase
                .from('interest_groups')
                .select('*')
                .eq('nation_id', nation.id)
                .order('population', { ascending: false });
            
            if (groupsError) throw groupsError;
            
            // Load parties (both NPC and player)
            const { data: parties, error: partiesError } = await _supabase
                .from('parties')
                .select('*')
                .eq('nation_id', nation.id)
                .order('seats', { ascending: false });
            
            // Also load player factions that are parties
            const { data: playerFactions, error: factionsError } = await _supabase
                .from('factions')
                .select('*')
                .eq('nation_id', nation.id)
                .eq('faction_type', 'party');
            
            // Display the data
            displayNationData(nation, interestGroups, parties || [], playerFactions || []);
            
        } catch (error) {
            console.error('Error loading nation data:', error);
            document.getElementById('loading').innerHTML = `
                <div class="error">
                    Error loading nation data: ${error.message}
                </div>
                <button class="btn btn-back" onclick="goBack()" style="margin-top: 20px;">← GO BACK</button>
            `;
        }
    }
    
    function getIdeologyTags(group) {
        const ideologies = [];
        
        // Your database stores ideology names as text in ideology_value_1, ideology_value_2, etc.
        // Each interest group simply supports certain ideologies (binary: yes or no)
        
        if (group.ideology_value_1) {
            ideologies.push(group.ideology_value_1.toUpperCase());
        }
        if (group.ideology_value_2) {
            ideologies.push(group.ideology_value_2.toUpperCase());
        }
        if (group.ideology_value_3) {
            ideologies.push(group.ideology_value_3.toUpperCase());
        }
        if (group.ideology_value_4) {
            ideologies.push(group.ideology_value_4.toUpperCase());
        }
        
        return ideologies;
    }
    
    function displayNationData(nation, interestGroups, parties, playerFactions) {
        // Format numbers
        const formatNumber = (num) => {
            if (num === null || num === undefined) return 'N/A';
            return num.toLocaleString();
        };
        const formatCurrency = (val) => {
            if (val == null) return 'N/A';
            val = Number(val);
            if (val >= 1e12) return '$' + (val / 1e12).toFixed(1) + ' Trillion';
            if (val >= 1e9) return '$' + (val / 1e9).toFixed(1) + ' Billion';
            if (val >= 1e6) return '$' + (val / 1e6).toFixed(1) + ' Million';
            return '$' + val.toLocaleString();
        };

        // Display nation stats
        document.getElementById('government-type').textContent = nation.government_type || 'Not Set';
        document.getElementById('capital').textContent = nation.capital || 'Unknown';
        document.getElementById('population').textContent = formatNumber(nation.population);
        document.getElementById('stability').textContent = nation.stability || 'N/A';
        document.getElementById('civil-unrest').textContent = nation.civil_unrest || 'N/A';
        document.getElementById('gdp').textContent = nation.gdp ? formatCurrency(nation.gdp) : 'N/A';
        
        // Display interest groups
        const groupsContainer = document.getElementById('interest-groups');
        if (interestGroups && interestGroups.length > 0) {
            groupsContainer.innerHTML = interestGroups.map(group => {
                const ideologies = getIdeologyTags(group);
                const ideologyHTML = ideologies.map(ideology => 
                    `<span class="ideology-tag ${ideologyColors[ideology] || ''}">${ideology}</span>`
                ).join('');
                
                return `
                    <div class="interest-group-card">
                        <div class="interest-group-header">
                            <span class="interest-group-name">${group.group_name || group.name || 'Unknown Group'} <span class="interest-group-pop">(${formatNumber(group.population)})</span></span>
                        </div>
                        <div class="interest-group-ideologies">
                            ${ideologyHTML || '<span style="color: #666;">No ideologies defined</span>'}
                        </div>
                        <div class="interest-group-desc">
                            "${group.description || 'No description available.'}"
                        </div>
                    </div>
                `;
            }).join('');
        } else {
            groupsContainer.innerHTML = '<p style="color: #888;">No voter blocs defined yet.</p>';
        }
        
        // Combine NPC parties and player factions
        const allParties = [
            ...parties.map(p => ({ ...p, isPlayer: false })),
            ...playerFactions.map(f => ({
                name: f.faction_name,
                seats: f.seats || 0,
                isPlayer: true,
                is_npc: false
            }))
        ];
        
        // Sort by seats
        allParties.sort((a, b) => (b.seats || 0) - (a.seats || 0));
        
        // Find head of government (party with most seats)
        const headParty = allParties.length > 0 && allParties[0].seats > 0 
            ? allParties[0].name 
            : 'None (No majority)';
        
        document.getElementById('head-of-government').textContent = headParty;
        
        // Display parties
        const partiesContainer = document.getElementById('parties-list');
        if (allParties.length > 0) {
            partiesContainer.innerHTML = allParties.map(party => `
                <div class="party-item">
                    <span class="party-name">${party.name}${party.isPlayer ? ' (Player)' : ''}</span>
                    <span class="party-seats">${party.seats || 0} Seats</span>
                </div>
            `).join('');
        } else {
            partiesContainer.innerHTML = '<p style="color: #888;">No political parties yet.</p>';
        }
        
        // Show content, hide loading
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
    }
    
    function goBack() {
        window.location.href = 'world.html';
    }
    
    async function continueToPartyCreation() {
        // Check if user already has a party in this nation
        const { data: existingParty } = await _supabase
            .from('factions')
            .select('*')
            .eq('id', currentUser.id)
            .eq('faction_type', 'party')
            .single();
        
        if (existingParty && existingParty.nation_id === nationData.id) {
            alert('You already have a party in this nation!');
            return;
        }
        
        if (existingParty && existingParty.nation_id !== nationData.id) {
            alert('You already have a party in another nation. You can only have one party.');
            return;
        }
        
        // Continue to party creation
        window.location.href = 'createparty.html?nation=' + NATION_NAME.toLowerCase();
    }
    
    // Load data on page load
    loadNationData();

// Expose functions for HTML onclick/onchange handlers
window.goBack = goBack;
window.continueToPartyCreation = continueToPartyCreation;
</script>

</body>
</html>
