<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Politician — Forum Category</title>
<style>
/* Body base + topbar styles come from js/politician-topbar.js. This
   page styles the category-detail surface: a header that mirrors the
   row's zone palette, followed by a thread list (or empty state).
   Threads themselves wait on the v2 write path. */
* { box-sizing:border-box; }

.content { padding:18px 24px 40px; max-width:1280px; margin:0 auto; }

/* ─── Breadcrumb back-link ────────────────────────────────────────── */
.back-link {
  display:inline-flex; align-items:center; gap:6px;
  font-size:10px; letter-spacing:0.14em; font-weight:700;
  text-transform:uppercase; color:#888; text-decoration:none;
  padding:8px 0; margin-bottom:10px;
}
.back-link:hover { color:#7ac8c8; }

/* ─── Category header ─────────────────────────────────────────────── */
.cathead {
  background:#0a0a0a;
  border:1px solid rgba(255,255,255,0.06);
  border-radius:6px;
  margin-bottom:18px;
  overflow:hidden;
}
.cathead.world   { border-top:3px solid #9a7050; --zc:#9a7050; --zc-dim:#4a3020; --zc-bg:#160d08; --zc-bright:#c89070; }
.cathead.players { border-top:3px solid #7a9aab; --zc:#7a9aab; --zc-dim:#3a5060; --zc-bg:#0e1318; --zc-bright:#9ab8c8; }
.cathead.game    { border-top:3px solid #8a7aa8; --zc:#8a7aa8; --zc-dim:#403852; --zc-bg:#0f0c14; --zc-bright:#a89ac8; }

.cathead-row {
  padding:22px 28px;
  display:flex; align-items:center; gap:18px;
}
.cathead-glyph {
  width:54px; height:54px;
  border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  font-size:22px;
  flex-shrink:0;
  background:var(--zc-bg);
  border:1px solid var(--zc-dim);
  color:var(--zc-bright);
}
.cathead-info { flex:1; min-width:0; }
.cathead-eyebrow {
  font-size:8.5px; letter-spacing:0.22em; font-weight:700;
  text-transform:uppercase; margin-bottom:5px;
  color:var(--zc);
}
.cathead-title {
  font-family:Georgia,serif; font-size:26px; color:#fff;
  font-weight:500; letter-spacing:-0.008em; line-height:1.15;
}
.cathead-desc {
  font-size:11px; color:#888; margin-top:6px;
  font-style:italic; line-height:1.5;
}
.cathead-stat {
  padding:9px 14px; border-radius:4px;
  font-size:9px; letter-spacing:0.14em; font-weight:700;
  text-transform:uppercase; flex-shrink:0;
  background:var(--zc-bg);
  border:1px solid var(--zc-dim);
  color:var(--zc-bright);
}

/* ─── Action bar (New Thread) ─────────────────────────────────────── */
.actbar {
  background:#0a0a0a;
  border:1px solid rgba(255,255,255,0.06);
  border-radius:5px;
  padding:10px 14px;
  margin-bottom:18px;
  display:flex; align-items:center; justify-content:space-between;
}
.actbar-meta { font-size:10px; color:#888; letter-spacing:0.05em; }
.act-newthread {
  padding:9px 14px; border-radius:3px;
  background:transparent;
  border:1px solid rgba(90,175,165,0.5);
  color:#7ac8c8;
  font-size:9px; letter-spacing:0.14em; font-weight:700;
  cursor:pointer; font-family:inherit; text-transform:uppercase;
}
.act-newthread:hover:not(:disabled) { background:rgba(90,175,165,0.08); color:#fff; }
.act-newthread:disabled { opacity:0.4; cursor:not-allowed; }

/* ─── Thread list ─────────────────────────────────────────────────── */
.thread-list {
  background:#0a0a0a;
  border:1px solid rgba(255,255,255,0.06);
  border-radius:6px;
  overflow:hidden;
}
.thread-row {
  display:grid;
  grid-template-columns:1.6fr 110px 1fr 140px;
  align-items:center;
  padding:14px 22px;
  border-bottom:1px solid rgba(255,255,255,0.04);
  cursor:pointer;
  transition:background 0.12s;
  gap:18px;
}
.thread-row:last-child { border-bottom:none; }
.thread-row:hover { background:#0d0d0d; }
.thread-row.unread { background:rgba(90,175,165,0.025); }
.thread-row.unread:hover { background:rgba(90,175,165,0.04); }

.thread-title {
  font-family:Georgia,serif; font-size:14px; color:#fff;
  font-weight:500; letter-spacing:-0.005em; line-height:1.3;
  display:flex; align-items:center; gap:8px;
}
.thread-title .new-dot {
  width:6px; height:6px; border-radius:50%;
  background:#5aafa5; flex-shrink:0;
  box-shadow:0 0 6px #5aafa5;
}
.thread-row:not(.unread) .thread-title .new-dot { display:none; }
.thread-opener {
  font-size:9.5px; color:#888; margin-top:3px;
}
.thread-opener .author { color:#7ac8c8; }

/* Nation chip beside the thread title. International (no flag URL,
   no name) renders the chip without an <img>, so the layout stays
   consistent. */
.nation-chip {
  display:inline-flex; align-items:center; gap:5px;
  margin-left:8px; vertical-align:middle;
  padding:2px 8px 2px 6px; border-radius:3px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  font-size:8.5px; letter-spacing:0.12em; font-weight:700;
  text-transform:uppercase; color:#bbb;
}
.nation-chip-flag {
  width:14px; height:10px; object-fit:cover;
  border:0.5px solid rgba(255,255,255,0.1); border-radius:1px;
  flex-shrink:0;
}
.nation-chip-name { line-height:1; }

.thread-count { text-align:right; }
.thread-count-num {
  font-family:Georgia,serif; font-size:16px; color:#ddd;
  font-weight:500; font-style:italic;
  line-height:1; letter-spacing:-0.005em;
}
.thread-count-lab {
  font-size:7.5px; letter-spacing:0.16em; color:#666;
  font-weight:700; text-transform:uppercase; margin-top:4px;
}

.thread-last {
  font-size:10px; color:#888; line-height:1.45;
  overflow:hidden; min-width:0;
}
.thread-last-by { color:#ccc; font-style:italic; font-family:Georgia,serif; font-size:11.5px; }
.thread-last-meta { font-size:9px; color:#666; margin-top:3px; }
.thread-last-meta .author { color:#7ac8c8; }

.thread-when {
  display:flex; flex-direction:column; align-items:flex-end;
  font-size:9.5px; color:#888;
  text-align:right; gap:3px;
}
.thread-when .stamp { color:#bbb; font-style:italic; }

.thread-empty {
  padding:80px 24px; text-align:center;
  color:#666; font-size:12px; font-style:italic;
}
.thread-empty .big {
  font-family:Georgia,serif; font-size:18px; color:#888;
  font-style:italic; margin-bottom:8px;
}

.loading {
  font-family:monospace; font-size:11px; color:#4a4940;
  text-align:center; padding:80px 20px;
}
</style>
</head>
<body>

<div id="pol-topbar-container"></div>

<div class="content" id="content" style="display:none;">
  <a class="back-link" href="politician-forum.html">&lsaquo; Back to Forum</a>
  <div id="cathead-host"></div>

  <div class="actbar">
    <div class="actbar-meta" id="actbar-meta">—</div>
    <button class="act-newthread" id="new-thread-btn" disabled>&#9999; New Thread</button>
  </div>

  <div id="thread-host"></div>
</div>

<div id="loading" class="loading">LOADING...</div>

<script type="module">
import { bootstrapPolitician } from './js/politician-topbar.js';
import { _supabase }            from './js/supabase-client.js';
import { escHtml, fmtInt, formatRelative, ZONE_META, getSlugFromUrl, renderNationChip }
  from './js/forum-utils.js';

function zoneLabel(zone) {
  // Detail-page eyebrow combines the zone numeral + name into one
  // breadcrumb-style string. Shape lives here because index renders
  // them separately on two lines; detail wants them inline.
  const meta = ZONE_META[zone];
  return meta ? `${meta.eyebrow} · ${meta.name}` : (zone || '');
}

function bindThreadRowClicks() {
  document.querySelectorAll('.thread-row[data-thread-id]').forEach(row => {
    row.addEventListener('click', () => {
      const id = row.dataset.threadId;
      if (id) window.location.href = `politician-forum-thread.html?id=${encodeURIComponent(id)}`;
    });
  });
}

function bindNewThreadButton(slug) {
  const btn = document.getElementById('new-thread-btn');
  if (!btn || !slug) return;
  btn.disabled = false;
  btn.title = 'Start a new thread in this category';
  btn.addEventListener('click', () => {
    window.location.href = `politician-forum-compose.html?slug=${encodeURIComponent(slug)}`;
  });
}

async function init() {
  let ctx = null;
  try { ctx = await bootstrapPolitician('forum'); }
  catch (err) {
    console.error('politician-forum-category: bootstrap failed', err);
    document.getElementById('loading').textContent = 'Failed to load. Please reload the page.';
    return;
  }
  if (!ctx) return;

  const slug = getSlugFromUrl();
  if (!slug) {
    document.getElementById('loading').innerHTML =
      'No category specified. <a href="politician-forum.html" style="color:#7ac8c8;text-decoration:underline;">Back to the Forum index.</a>';
    return;
  }

  await loadCategory(ctx, slug);
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}

async function loadCategory(ctx, slug) {
  const head = document.getElementById('cathead-host');
  const list = document.getElementById('thread-host');
  const meta = document.getElementById('actbar-meta');
  try {
    const { data, error } = await _supabase.rpc('get_forum_category', {
      p_slug:              slug,
      p_viewer_faction_id: ctx?.faction?.id || null,
    });
    if (error) throw error;
    if (!data?.success) {
      const reason = data?.reason || 'unknown';
      const msg = reason === 'category_not_found'
        ? `Category "${escHtml(slug)}" doesn't exist.`
        : `Could not load category (${escHtml(reason)}).`;
      head.innerHTML = `<div class="cathead"><div class="cathead-row"><div class="cathead-info"><div class="cathead-title">—</div><div class="cathead-desc">${msg}</div></div></div></div>`;
      list.innerHTML = '';
      meta.textContent = '';
      return;
    }
    document.title = `${data.category.name} — Politician Forum`;
    head.innerHTML = renderHead(data.category);
    list.innerHTML = renderThreadList(data.threads);
    meta.textContent = `${fmtInt(data.thread_count)} thread${data.thread_count === 1 ? '' : 's'} in this category`;
    bindNewThreadButton(data.category.slug);
    bindThreadRowClicks();
  } catch (e) {
    console.error('politician-forum-category: load failed', e);
    head.innerHTML = `<div class="cathead"><div class="cathead-row"><div class="cathead-info"><div class="cathead-title">—</div><div class="cathead-desc">Failed to load: ${escHtml(e?.message || e)}</div></div></div></div>`;
  }
}

function renderHead(cat) {
  return `
    <div class="cathead ${escHtml(cat.zone)}">
      <div class="cathead-row">
        <div class="cathead-glyph">${cat.icon_html || ''}</div>
        <div class="cathead-info">
          <div class="cathead-eyebrow">${escHtml(zoneLabel(cat.zone))}</div>
          <div class="cathead-title">${escHtml(cat.name || '')}</div>
          <div class="cathead-desc">${escHtml(cat.description || '')}</div>
        </div>
      </div>
    </div>`;
}

function renderThreadList(threads) {
  if (!Array.isArray(threads) || threads.length === 0) {
    return `
      <div class="thread-list">
        <div class="thread-empty">
          <div class="big">No threads yet</div>
          <div>Be the first to post when the New Thread mechanic lands.</div>
        </div>
      </div>`;
  }
  return `<div class="thread-list">${threads.map(renderThreadRow).join('')}</div>`;
}

function renderThreadRow(t) {
  const unread = !!t.unread;
  const posts = Number(t.post_count || 0);
  return `
    <div class="thread-row${unread ? ' unread' : ''}" data-thread-id="${escHtml(t.thread_id || '')}">
      <div>
        <div class="thread-title">${escHtml(t.title || '')}${renderNationChip(t.nation_name, t.nation_flag_url)}<span class="new-dot"></span></div>
        <div class="thread-opener">opened by <span class="author">${escHtml(t.opener_name || '—')}</span></div>
      </div>
      <div class="thread-count">
        <div class="thread-count-num">${fmtInt(posts)}</div>
        <div class="thread-count-lab">Post${posts === 1 ? '' : 's'}</div>
      </div>
      <div class="thread-last">
        <div class="thread-last-by">${escHtml(t.last_post_author_name || '—')}</div>
        <div class="thread-last-meta">most recent <span class="author">${escHtml(formatRelative(t.last_post_at))}</span></div>
      </div>
      <div class="thread-when">
        <span class="stamp">${escHtml(formatRelative(t.last_post_at))}</span>
      </div>
    </div>`;
}

init();
</script>
</body>
</html>
