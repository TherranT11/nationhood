    // ── Voter Bloc card expand/collapse ──
    (function initVbaCards() {
        let expandedId = null;
        el.querySelectorAll('.vba-card').forEach(card => {
            const header = card.querySelector('.vba-card-header');
            const expanded = card.querySelector('.vba-card-expanded');
            if (!header || !expanded) return;
            header.style.cursor = 'pointer';
            header.addEventListener('click', () => {
                const blocId = card.dataset.blocId;
                if (expandedId === blocId) {
                    expanded.style.display = 'none';
                    card.style.borderColor = 'rgba(255,255,255,0.06)';
                    expandedId = null;
                } else {
                    // Collapse previously expanded
                    el.querySelectorAll('.vba-card').forEach(c => {
                        const exp = c.querySelector('.vba-card-expanded');
                        if (exp) exp.style.display = 'none';
                        c.style.borderColor = 'rgba(255,255,255,0.06)';
                    });
                    expanded.style.display = 'block';
                    card.style.borderColor = 'rgba(255,255,255,0.1)';
                    expandedId = blocId;
                }
            });
        });
    })();

    // ── Presidential Nominee Selector ──
    (function initPresNomineeSelector() {
        const section = document.getElementById('pres-nominee-section');
        if (!section) return;

        let selectedId = null;
        const cards = section.querySelectorAll('.pres-nom-card');
        const confirmBtn = document.getElementById('pres-nominee-confirm-btn');
        const confirmSummary = document.getElementById('pres-nominee-confirm-summary');

        // Toggle selector visibility
        window.toggleNomineeSelector = function() {
            const sel = document.getElementById('pres-nominee-selector');
            if (!sel) return;
            sel.style.display = sel.style.display === 'none' ? 'block' : 'none';
        };

        // Card selection
        cards.forEach(card => {
            card.addEventListener('click', () => {
                selectedId = card.dataset.candidateId;
                cards.forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                const nameEl = card.querySelector('.pm-card-name');
                const traitEl = card.querySelector('.pm-trait-name');
                const ideoEl = card.querySelector('.pm-ideology-tag');
                if (confirmSummary) {
                    confirmSummary.innerHTML =
                        `Nominate <strong>${nameEl?.textContent || ''}</strong> — ` +
                        `<span style="color:var(--accent)">${traitEl?.textContent || ''}</span> · ` +
                        `${ideoEl?.textContent || ''}`;
                }
                if (confirmBtn) confirmBtn.disabled = false;
            });
        });

        // Confirm nomination
        window.confirmPresNominee = async function() {
            if (!selectedId) return;
            const card = document.getElementById('pres-card-' + selectedId);
            const nameEl = card?.querySelector('.pm-card-name');
            const name = nameEl?.textContent || 'this candidate';

            if (!confirm(
                `Nominate ${name} as your presidential candidate?\n\n` +
                `This choice is permanent. They will also become your Party Leader.\n` +
                `If your party wins the election, they become President.`
            )) return;

            if (confirmBtn) {
                confirmBtn.disabled = true;
                confirmBtn.textContent = 'Nominating...';
            }

            try {
                const { data: shard } = await _supabase
                    .from('shard')
                    .select('current_tick')
                    .eq('name', 'Alpha Shard')
                    .single();

                const candidate = await selectPresidentCandidate(
                    _supabase,
                    selectedId,
                    currentNation.id,
                    currentFaction.id,
                    shard?.current_tick || 0
                );

                // Also update party leader to the nominee
                if (candidate) {
                    await _supabase.from('factions').update({
                        leader_first_name: candidate.first_name,
                        leader_last_name: candidate.last_name,
                        leader_age: candidate.age
                    }).eq('id', currentFaction.id);
                }

                alert(`${name} has been nominated as your presidential candidate and is now your Party Leader!`);
                await renderParties();
            } catch (e) {
                console.error('Error nominating candidate:', e);
                alert('Error: ' + e.message);
                if (confirmBtn) {
                    confirmBtn.disabled = false;
                    confirmBtn.textContent = 'Nominate Candidate';
                }
            }
        };

            editColor = hex;
            hexInput.value = hex;
            colorPreview.style.background = hex;
            paletteEl.querySelectorAll('.edit-color-swatch').forEach(sw => {
                sw.classList.toggle('active', sw.dataset.hex.toUpperCase() === hex.toUpperCase());
            });
            checkColorSimilarity(hex);
        }

        function checkColorSimilarity(hex) {
            const otherColors = (allParties || [])
                .filter(p => p.id !== f.id && p.party_color)
                .map(p => ({ name: p.faction_name, color: p.party_color }));
            let warning = '';
            for (const other of otherColors) {
                if (colorDistance(hex, other.color) < 30) {
                    warning = 'Another party (' + other.name + ') is already using a very similar color. This may cause confusion in charts and maps.';
                    break;
                }
            }
            colorWarning.style.display = warning ? 'block' : 'none';
            colorWarning.textContent = warning;
        }

        paletteEl.addEventListener('click', (e) => {
            const sw = e.target.closest('.edit-color-swatch');
            if (sw) selectColor(sw.dataset.hex);
        });

        hexInput.addEventListener('input', () => {
            const val = hexInput.value.trim();
            if (/^#[0-9a-fA-F]{6}$/.test(val)) {
                selectColor(val);
            }
        });

        checkColorSimilarity(editColor);

        // Logo grid
        const logoGrid = document.getElementById('edit-logo-grid');
        let logoHtml = '';
        const categories = {};
        for (const [key, icon] of Object.entries(PARTY_ICONS)) {
            if (!categories[icon.category]) categories[icon.category] = [];
            categories[icon.category].push({ key, label: icon.label });
        }
        for (const [cat, icons] of Object.entries(categories)) {
            logoHtml += '<div class="edit-logo-category">' + cat + '</div>';
            for (const icon of icons) {
                const isActive = icon.key === editLogo;
                logoHtml += '<div class="edit-logo-option' + (isActive ? ' active' : '') + '" data-key="' + icon.key + '" title="' + icon.label + '">' + getPartyIconSVG(icon.key, 28, isActive ? editColor : '#888') + '</div>';

        logoGrid.addEventListener('click', (e) => {
            const opt = e.target.closest('.edit-logo-option');

                const isActive = o.dataset.key === editLogo;

            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';

            const newDesc = (descInput.value || '').trim().slice(0, 200);
            const { error } = await _supabase.from('factions').update({
                party_description: newDesc || null,
                party_color: editColor,

                custom_logo_url: null,

            if (error) {
                statusEl.textContent = 'Error: ' + error.message;
                statusEl.style.color = '#ff4444';

                statusEl.textContent = 'Saved!';

            saveBtn.textContent = 'Save Changes';

            let axesHtml = '';

                for (const fid of selectedIds) {
                    const ideo = ideoByFaction[fid];

                    const party = (allParties || []).find(p => p.id === fid);
                    if (!party) continue;
                    const score = ideo[axis.key] || 0;
                    const position = 50 + (score / 2);
                    const color = party.party_color || '#666';
                    const isMe = fid === f.id;

                    dotsHtml += `
                        <div class="ideo-dot" style="left:${position}%;background:${color};${isMe ? 'z-index:5;' : ''}" data-faction-id="${fid}">

            }

            let summaryHtml = '';
            for (const fid of selectedIds) {

                const party = (allParties || []).find(p => p.id === fid);
