    // ── Rally UI ──
    let rallyScreen = 'select'; // 'select' | 'preview' | 'results'
    let rallySelectedIdx = null;
    let rallyResults = null;
    let rallyFilter = 'All';
    let rallyShowAll = false;

    // Fetch recent rallies for cooldown/diminish info
    const { data: recentRallies } = await _supabase
        .from('campaign_actions')
        .select('tick_performed, result')
        .eq('party_id', f.id)
        .eq('action_type', 'rally')
        .gte('tick_performed', (currentShard?.current_tick || 0) - RALLY_CONFIG.DIMINISH_WINDOW)
        .order('tick_performed', { ascending: false });

    const ralliedThisTick = (recentRallies || []).some(r => r.tick_performed === (currentShard?.current_tick || 0));

    // Get tag use counts for diminishing returns display
    function getTagUseCounts(tags) {
        const counts = {};
        for (const tag of tags) counts[tag] = 0;
        for (const r of (recentRallies || [])) {
            for (const t of (r.result?.tags || [])) {
                if (counts[t] !== undefined) counts[t]++;
            }
        }
        return counts;
    }

    // Ideology tag colors from IDEOLOGY_AXES
    const IDEO_COLORS = {};
    for (const ax of IDEOLOGY_AXES) {
        IDEO_COLORS[ax.left] = ax.leftColor;
        IDEO_COLORS[ax.right] = ax.rightColor;
    }
    function colorTag(tag) {
        const upper = tag.toUpperCase();
        const color = IDEO_COLORS[upper] || 'var(--text-muted, #888)';
        const label = tag.charAt(0).toUpperCase() + tag.slice(1).toLowerCase();
        return `<span style="color:${color};font-weight:700">${label}</span>`;
    }
    function colorTagUpper(tag) {
        const upper = tag.toUpperCase();
        const color = IDEO_COLORS[upper] || 'var(--text-muted, #888)';
        return `<span style="color:${color};font-weight:700">${upper}</span>`;
    }

    function renderRally() {
        const container = document.getElementById('rally-container');
        if (!container) return;

        if (rallyScreen === 'select') {
            const costOk = currentAP >= RALLY_CONFIG.AP_COST && (f.party_funds || 0) >= RALLY_CONFIG.MONEY_COST;
            const allTags = ['All', 'Tradition', 'Progress', 'Liberty', 'Equality', 'Security', 'Freedom', 'Nationalism', 'Globalism', 'Collectivism', 'Individualism'];
            const filterBtns = allTags.map(t => {
                const color = t === 'All' ? '' : IDEO_COLORS[t.toUpperCase()] || '';
                const style = color && rallyFilter === t ? ` style="border-color:${color};color:${color}"` : color ? ` style="color:${color}"` : '';
                return `<button class="rally-filter-btn${rallyFilter === t ? ' active' : ''}" data-filter="${t}"${style}>${t}</button>`;
            }).join('');

            let filtered = RALLY_SUBJECTS.map((s, i) => ({ ...s, idx: i }));
            if (rallyFilter !== 'All') {
                filtered = filtered.filter(s => s.tags.includes(rallyFilter.toUpperCase()));
            }
            const shown = rallyShowAll ? filtered : filtered.slice(0, 15);
            const hasMore = filtered.length > 15 && !rallyShowAll;

            let rows = shown.map(s =>
                `<div class="rally-subject-row${!costOk || ralliedThisTick ? ' disabled' : ''}" data-idx="${s.idx}">
                    <span class="rally-subject-name">${s.name}</span>
                    <span class="rally-subject-tags">${s.tags.map(t => colorTagUpper(t)).join('&nbsp; ')}</span>
                </div>`
            ).join('');

            container.innerHTML = `
                <div class="rally-panel">
                    <div class="rally-header-row">
                        <span class="rally-title">Hold a Rally</span>
                        <span class="rally-cost">Cost: ${RALLY_CONFIG.AP_COST} AP + $${(RALLY_CONFIG.MONEY_COST).toLocaleString()}</span>
                    </div>
                    <div class="rally-desc">Choose a subject for your rally. Each subject has ideology tags that determine which voter blocs are energized and which are alienated.</div>
                    ${ralliedThisTick ? '<div class="rally-cooldown">You have already held a rally this tick.</div>' : ''}
                    ${!costOk && !ralliedThisTick ? '<div class="rally-cooldown">Not enough AP or funds.</div>' : ''}
                    <div class="rally-divider"></div>
                    <div class="rally-filters">${filterBtns}</div>
                    <div class="rally-divider"></div>
                    <div class="rally-subject-header">
                        <span class="rally-subject-name">Subject</span>
                        <span class="rally-subject-tags">Tags</span>
                    </div>
                    <div class="rally-subject-list">${rows}</div>
                    ${hasMore ? `<div class="rally-show-all">Showing 15 of ${filtered.length} subjects <button class="rally-show-all-btn">[Show All]</button></div>` : ''}
                </div>`;

            // Event listeners
            container.querySelectorAll('.rally-filter-btn').forEach(btn => {
                btn.addEventListener('click', () => { rallyFilter = btn.dataset.filter; rallyShowAll = false; renderRally(); });
            });
            container.querySelectorAll('.rally-subject-row:not(.disabled)').forEach(row => {
                row.addEventListener('click', () => { rallySelectedIdx = parseInt(row.dataset.idx); rallyScreen = 'preview'; renderRally(); });
            });
            const showAllBtn = container.querySelector('.rally-show-all-btn');
            if (showAllBtn) showAllBtn.addEventListener('click', () => { rallyShowAll = true; renderRally(); });

        } else if (rallyScreen === 'preview') {
            const subject = RALLY_SUBJECTS[rallySelectedIdx];
            const classified = classifyRallyBlocs(subject, blocs || []);
            const energized = classified.filter(c => c.classification === 'energized');
            const alienated = classified.filter(c => c.classification === 'alienated');
            const unaffected = classified.filter(c => c.classification === 'unaffected');

            const tagCounts = getTagUseCounts(subject.tags);
            const diminished = subject.tags.filter(t => tagCounts[t] > 0);

            const tagLabels = subject.tags.map(t => t.charAt(0) + t.slice(1).toLowerCase());
            const tagColored = subject.tags.map(t => colorTagUpper(t)).join('&nbsp; ');
            const tagColoredMixed = subject.tags.map(t => colorTag(t)).join(' or ');

            function blocPctLabel(c) { return `(${Math.round(c.popWeight)}%)`; }
            function matchLabel(c) { return c.matchTag ? colorTagUpper(c.matchTag) : ''; }
            function opposeLabel(c) {
                if (!c.opposeTag) return '';
                const opp = IDEOLOGY_OPPOSITES[c.opposeTag];
                return opp ? '\u2190 ' + colorTag(opp) : '';
            }

            const enPop = energized.reduce((s, c) => s + c.popWeight, 0);
            const alPop = alienated.reduce((s, c) => s + c.popWeight, 0);
            const unPop = unaffected.reduce((s, c) => s + c.popWeight, 0);

            let diminishHtml = '';
            if (diminished.length > 0) {
                diminishHtml = diminished.map(t => {
                    const uses = tagCounts[t];
                    const label = t.charAt(0) + t.slice(1).toLowerCase();
                    const last = (recentRallies || []).find(r => (r.result?.tags || []).includes(t));
                    const ago = last ? (currentShard?.current_tick || 0) - last.tick_performed : '?';
                    const effect = uses === 1 ? 'halved' : 'quartered';
                    return `<div class="rally-diminish-warn">Diminished effect: You rallied on ${label.toUpperCase()} ${ago} tick${ago !== 1 ? 's' : ''} ago. Energize effect ${effect} for ${label}-aligned blocs.</div>`;
                }).join('');
            }

            container.innerHTML = `
                <div class="rally-panel">
                    <div class="rally-header-row">
                        <span class="rally-title">Hold a Rally</span>
                        <span class="rally-cost">Cost: ${RALLY_CONFIG.AP_COST} AP + $${(RALLY_CONFIG.MONEY_COST).toLocaleString()}</span>
                    </div>
                    <div class="rally-selected">
                        <div class="rally-selected-label">SELECTED: "${subject.name}"</div>
                        <div class="rally-selected-tags">Tags: ${tagColored}</div>
                    </div>
                    <div class="rally-divider rally-divider-accent"></div>

                    <div class="rally-section-title">PROJECTED EFFECTS</div>

                    <div class="rally-group-label rally-energized">ENERGIZED <span class="rally-group-note">(share ${tagColoredMixed})</span></div>
                    <div class="rally-group-box">
                        ${energized.length === 0 ? '<div class="rally-group-empty">None</div>' :
                            energized.map(c => `<div class="rally-bloc-row rally-energized">▲ ${c.blocName} ${blocPctLabel(c)} <span class="rally-bloc-tag">${matchLabel(c).toUpperCase()}</span> <span class="rally-bloc-est">est. +1 to +2</span></div>`).join('')}
                    </div>

                    <div class="rally-group-label rally-alienated">ALIENATED <span class="rally-group-note">(oppose ${tagColoredMixed})</span></div>
                    <div class="rally-group-box">
                        ${alienated.length === 0 ? '<div class="rally-group-empty">None</div>' :
                            alienated.map(c => `<div class="rally-bloc-row rally-alienated">▼ ${c.blocName} ${blocPctLabel(c)} <span class="rally-bloc-tag">${opposeLabel(c)}</span> <span class="rally-bloc-est">est. 0 to -2</span></div>`).join('')}
                    </div>

                    <div class="rally-group-label rally-unaffected">UNAFFECTED</div>
                    <div class="rally-group-box">
                        ${unaffected.length === 0 ? '<div class="rally-group-empty">None</div>' :
                            unaffected.map(c => `<div class="rally-bloc-row rally-unaffected">\u2014 ${c.blocName} ${blocPctLabel(c)} <span class="rally-bloc-tag">no match or opposition</span></div>`).join('')}
                    </div>

                    <div class="rally-divider"></div>
                    <div class="rally-momentum-est">MOMENTUM: +${RALLY_CONFIG.GLOBAL_MOMENTUM_MIN} to +${RALLY_CONFIG.GLOBAL_MOMENTUM_MAX} (global)</div>
                    <div class="rally-divider"></div>

                    ${diminishHtml ? `<div class="rally-diminish-section">${diminishHtml}</div><div class="rally-divider"></div>` : ''}

                    <div class="rally-net-est">
                        <div class="rally-net-title">NET ESTIMATE</div>
                        <div>Energized: ${energized.length} bloc${energized.length !== 1 ? 's' : ''} (${Math.round(enPop)}% of electorate)</div>
                        <div>Alienated: ${alienated.length} bloc${alienated.length !== 1 ? 's' : ''} (${Math.round(alPop)}% of electorate)</div>
                        <div>Unaffected: ${unaffected.length} bloc${unaffected.length !== 1 ? 's' : ''} (${Math.round(unPop)}% of electorate)</div>
                    </div>

                    <div class="rally-actions">
                        <button class="rally-btn rally-btn-confirm" id="rally-confirm">CONFIRM RALLY</button>
                        <button class="rally-btn rally-btn-cancel" id="rally-cancel">CANCEL</button>
                    </div>
                </div>`;

            document.getElementById('rally-confirm').addEventListener('click', async () => {
                const btn = document.getElementById('rally-confirm');
                btn.disabled = true;
                btn.textContent = 'Executing...';
                const tick = currentShard?.current_tick || 0;
                const result = await executeRally(_supabase, f.id, n.id, rallySelectedIdx, tick);
                if (result.success) {
                    rallyResults = result;
                    rallyScreen = 'results';
                    renderRally();
                } else {
                    alert(result.error);
                    btn.disabled = false;
                    btn.textContent = 'CONFIRM RALLY';
                }
            });
            document.getElementById('rally-cancel').addEventListener('click', () => { rallyScreen = 'select'; rallySelectedIdx = null; renderRally(); });

        } else if (rallyScreen === 'results') {
            const r = rallyResults;
            const subject = r.subject;
            const tagColored2 = subject.tags.map(t => colorTagUpper(t)).join('&nbsp; ');
            const energized = r.blocResults.filter(c => c.classification === 'energized');
            const alienated = r.blocResults.filter(c => c.classification === 'alienated');
            const unaffected = r.blocResults.filter(c => c.classification === 'unaffected');

            function resultRow(c, symbol) {
                const sign = c.prefDelta > 0 ? '+' : '';
                return `<div class="rally-bloc-row ${c.classification === 'energized' ? 'rally-energized' : c.classification === 'alienated' ? 'rally-alienated' : 'rally-unaffected'}">${symbol} ${c.blocName} <span class="rally-result-delta">${c.prefDelta === 0 ? 'no change' : sign + c.prefDelta + ' preference'}</span> <span class="rally-result-pref">(${c.oldPref}% \u2192 ${c.newPref}%)</span></div>`;
            }

            container.innerHTML = `
                <div class="rally-panel rally-panel-results">
                    <div class="rally-title">Rally Results</div>
                    <div class="rally-selected">
                        <div>"${subject.name}"</div>
                        <div class="rally-selected-tags">${tagColored2}</div>
                    </div>
                    <div class="rally-divider rally-divider-accent"></div>

                    <div class="rally-group-label rally-energized">ENERGIZED</div>
                    <div class="rally-group-box">
                        ${energized.length === 0 ? '<div class="rally-group-empty">None</div>' :
                            energized.map(c => resultRow(c, '▲')).join('')}
                    </div>

                    <div class="rally-group-label rally-alienated">ALIENATED</div>
                    <div class="rally-group-box">
                        ${alienated.length === 0 ? '<div class="rally-group-empty">None</div>' :
                            alienated.map(c => resultRow(c, '▼')).join('')}
                    </div>

                    <div class="rally-group-label rally-unaffected">UNAFFECTED</div>
                    <div class="rally-group-box">
                        ${unaffected.length === 0 ? '<div class="rally-group-empty">None</div>' :
                            unaffected.map(c => resultRow(c, '\u2014')).join('')}
                    </div>

                    <div class="rally-divider"></div>
                    <div class="rally-results-summary">
                        <div>Momentum: +${r.globalMomentum} (global)</div>
                        <div>Cost: $${RALLY_CONFIG.MONEY_COST.toLocaleString()} deducted \u2014 Treasury: $${r.oldTreasury.toLocaleString()} \u2192 $${r.newTreasury.toLocaleString()}</div>
                        <div>AP: ${r.newAp + RALLY_CONFIG.AP_COST} \u2192 ${r.newAp}</div>
                    </div>

                    <div class="rally-actions">
                        <button class="rally-btn rally-btn-cancel" id="rally-dismiss">DISMISS</button>
                    </div>
                </div>`;

            document.getElementById('rally-dismiss').addEventListener('click', () => {
                rallyScreen = 'select';
                rallySelectedIdx = null;
                rallyResults = null;
                renderParties(); // full refresh to update AP, treasury, etc.
            });
        }
    }

    renderRally();

    // ── Press Conference UI ──
    let pcScreen = 'select'; // 'select' | 'preview' | 'results'
    let pcSelectedStat = null;
    let pcResults = null;
    let pcFilter = 'All';

    // Fetch recent press conferences for cooldown
    const { data: recentPCs } = await _supabase
        .from('campaign_actions')
        .select('tick_performed, result')
        .eq('party_id', f.id)
        .eq('action_type', 'press_conference')
        .gte('tick_performed', (currentShard?.current_tick || 0) - PRESS_CONF_CONFIG.SAME_STAT_WINDOW)
        .order('tick_performed', { ascending: false });

    const pcThisTick = (recentPCs || []).some(r => r.tick_performed === (currentShard?.current_tick || 0));

    // Build stat list with trend + ministry + holder info
    const { data: allMinistries } = await _supabase
        .from('ministries')
        .select('party_id, ministry_key')
        .eq('nation_id', n.id)
        .eq('is_active', true);

    const ministryHolder = {};
    for (const m of (allMinistries || [])) ministryHolder[m.ministry_key] = m.party_id;
    if (coalition && coalition.lead_party_id) ministryHolder['prime_minister'] = coalition.lead_party_id;

    // Fetch history from 3 ticks ago for trend (wider window catches gradual changes)
    let pcPrevStats = null;
    const pcTick = currentShard?.current_tick || 0;
    const PC_TREND_WINDOW = 3;
    if (pcTick > 0) {
        const lookbackTick = Math.max(0, pcTick - PC_TREND_WINDOW);
        const { data: histRow } = await _supabase
            .from('nations_history').select('*')
            .eq('nation_id', n.id).eq('tick', lookbackTick).maybeSingle();
        if (histRow) {
            pcPrevStats = histRow;
        } else {
            // Fallback: oldest available row before current tick
            const { data: fallbackRows } = await _supabase
                .from('nations_history').select('*')
                .eq('nation_id', n.id).lt('tick', pcTick)
                .order('tick', { ascending: true }).limit(1);
            pcPrevStats = fallbackRows?.[0] || null;
        }
    }

    const MINISTRY_DISPLAY = {
        prime_minister: 'PM', interior: 'Interior', foreign: 'Foreign',
        defense: 'Defense', finance: 'Finance', education: 'Education',
        healthcare: 'Healthcare', labor: 'Labor', justice: 'Justice',
        transportation: 'Transport', security: 'Security'
    };

    const statList = [];
    const FLAT_THRESHOLD_PC = 0.15;
    for (const [statKey, ministryKey] of Object.entries(STAT_TO_MINISTRY)) {
        const sign = statDirectionSign(statKey);
        if (sign === 0) continue;
        const cur = n[statKey];
        const prev = pcPrevStats ? pcPrevStats[statKey] : null;
        if (cur == null) continue;

        const rawDelta = (prev != null) ? cur - prev : 0;
        const improvement = rawDelta * sign;
        let trend = 'flat';
        if (improvement > FLAT_THRESHOLD_PC) trend = 'well';
        else if (improvement < -FLAT_THRESHOLD_PC) trend = 'badly';

        const holderId = ministryHolder[ministryKey] || null;
        let mode;
        if (holderId === f.id) mode = 'credit';
        else if (holderId) mode = 'attack';
        else mode = 'attention';

        const holderParty = holderId ? partyLookup[holderId] : null;
        const holderAbbr = holderParty?.abbreviation || (holderId === f.id ? 'YOU' : null);

        // Check same-stat penalty
        const sameStatRecent = (recentPCs || []).filter(r => r.result?.statKey === statKey);

        statList.push({
            statKey,
            label: statKey.replace(/_/g, ' '),
            ministryKey,
            ministryLabel: MINISTRY_DISPLAY[ministryKey] || ministryKey,
            trend,
            mode,
            holderId,
            holderAbbr,
            holderColor: holderParty?.party_color || '#666',
            willBackfire: (mode === 'credit' && trend === 'badly') || (mode === 'attack' && trend === 'well'),
            isFlat: trend === 'flat',
            sameStatPenalty: sameStatRecent.length > 0,
        });
    }

    // Group stats by ministry for the filter
    const ministryKeys = [...new Set(statList.map(s => s.ministryKey))];

    function renderPC() {
        const container = document.getElementById('pc-container');
        if (!container) return;

        if (pcScreen === 'select') {
            const costOk = (f.action_points || 0) >= PRESS_CONF_CONFIG.AP_COST && (f.party_funds || 0) >= PRESS_CONF_CONFIG.MONEY_COST;
            const canAct = costOk && !pcThisTick;

            // Filter buttons: All + ministry names
            const filterOptions = ['All', ...ministryKeys.map(k => MINISTRY_DISPLAY[k] || k)];
            const filterBtns = filterOptions.map(label => {
                return `<button class="pc-filter-btn${pcFilter === label ? ' active' : ''}" data-filter="${label}">${label}</button>`;
            }).join('');

            // Filter stats
            let filtered = statList;
            if (pcFilter !== 'All') {
                filtered = statList.filter(s => (MINISTRY_DISPLAY[s.ministryKey] || s.ministryKey) === pcFilter);
            }

            // Sort: trending badly first (good attack targets), then well, then flat
            const trendOrder = { badly: 0, well: 1, flat: 2 };
            filtered.sort((a, b) => trendOrder[a.trend] - trendOrder[b.trend]);

            const rows = filtered.map(s => {
                const trendIcon = s.trend === 'well' ? '<span class="pc-trend-good">▲</span>'
                    : s.trend === 'badly' ? '<span class="pc-trend-bad">▼</span>'
                    : '<span class="pc-trend-flat">—</span>';
                const modeIcon = s.mode === 'credit' ? '📣' : s.mode === 'attack' ? '⚔️' : '📢';
                const modeLabel = s.mode === 'credit' ? 'Credit' : s.mode === 'attack' ? 'Attack' : 'Attention';
                const backfireWarn = s.willBackfire ? ' <span class="pc-backfire-warn">⚠</span>' : '';
                const penaltyNote = s.sameStatPenalty ? ' <span class="pc-penalty-note">½</span>' : '';
                const holderTag = s.holderAbbr
                    ? `<span class="pc-holder" style="color:${s.holderColor}">${s.holderAbbr}</span>`
                    : '<span class="pc-holder pc-holder-none">—</span>';
                const statLabel = s.label.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                return `<div class="pc-stat-row${!canAct ? ' disabled' : ''}" data-stat="${s.statKey}">
                    <span class="pc-stat-trend">${trendIcon}</span>
                    <span class="pc-stat-name">${statLabel}</span>
                    <span class="pc-stat-ministry">${s.ministryLabel}</span>
                    ${holderTag}
                    <span class="pc-stat-mode pc-mode-${s.mode}">${modeIcon} ${modeLabel}${backfireWarn}${penaltyNote}</span>
                </div>`;
            }).join('');

            container.innerHTML = `
                <div class="pc-panel">
                    <div class="pc-header-row">
                        <span class="pc-title">Press Conference</span>
                        <span class="pc-cost">Cost: ${PRESS_CONF_CONFIG.AP_COST} AP + $${PRESS_CONF_CONFIG.MONEY_COST.toLocaleString()}</span>
                    </div>
                    <div class="pc-desc">Speak publicly about a national stat. Take credit, attack rivals, or draw attention.</div>
                    ${pcThisTick ? '<div class="pc-cooldown">You have already held a press conference this tick.</div>' : ''}
                    ${!costOk && !pcThisTick ? '<div class="pc-cooldown">Not enough AP or funds.</div>' : ''}
                    <div class="pc-divider"></div>
                    <div class="pc-filters">${filterBtns}</div>
                    <div class="pc-divider"></div>
                    <div class="pc-stat-header">
                        <span class="pc-stat-trend">Trend</span>
                        <span class="pc-stat-name">Stat</span>
                        <span class="pc-stat-ministry">Ministry</span>
                        <span class="pc-holder">Holder</span>
                        <span class="pc-stat-mode">Action</span>
                    </div>
                    <div class="pc-stat-list">${rows}</div>
                    <div class="pc-legend">
                        <span>📣 Credit = your ministry</span>
                        <span>⚔️ Attack = rival's ministry</span>
                        <span>📢 Attention = no holder</span>
                        <span>⚠ = backfire (wrong trend)</span>
                        <span>½ = same-stat penalty</span>
                        <span>— = flat (reduced effect)</span>
                    </div>
                </div>`;

            container.querySelectorAll('.pc-filter-btn').forEach(btn => {
                btn.addEventListener('click', () => { pcFilter = btn.dataset.filter; renderPC(); });
            });
            container.querySelectorAll('.pc-stat-row:not(.disabled)').forEach(row => {
                row.addEventListener('click', () => { pcSelectedStat = row.dataset.stat; pcScreen = 'preview'; renderPC(); });
            });

        } else if (pcScreen === 'preview') {
            const s = statList.find(x => x.statKey === pcSelectedStat);
            if (!s) { pcScreen = 'select'; renderPC(); return; }

            const statLabel = s.label.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
            const trendLabel = s.trend === 'well' ? 'Trending Well ▲' : s.trend === 'badly' ? 'Trending Badly ▼' : 'Flat —';
            const trendClass = s.trend === 'well' ? 'pc-trend-good' : s.trend === 'badly' ? 'pc-trend-bad' : 'pc-trend-flat';

            // Find caring blocs
            const caringBlocsList = [];
            for (const b of (blocs || [])) {
                const issues = b.priority_issues || [];
                for (const issue of issues) {
                    const catStats = ISSUE_CATEGORY_STATS[issue] || [];
                    if (catStats.includes(s.statKey)) {
                        caringBlocsList.push(b.bloc_name);
                        break;
                    }
                }
            }

            const flatNote = s.isFlat ? ' (reduced — stat is flat)' : '';
            const penaltyNotes = [s.sameStatPenalty ? 'same-stat penalty' : '', s.isFlat ? 'flat stat' : ''].filter(Boolean).join(' + ');
            const penaltySuffix = penaltyNotes ? ` (reduced: ${penaltyNotes})` : '';

            let projectedHtml = '';
            if (s.mode === 'credit') {
                if (s.willBackfire) {
                    projectedHtml = `
                        <div class="pc-projection pc-proj-bad">
                            <div class="pc-proj-title">BACKFIRE — Stat is Actively Declining Under Your Watch</div>
                            <div>Your momentum: ${PRESS_CONF_CONFIG.CREDIT_BACKFIRE_MOMENTUM}${s.sameStatPenalty ? ' (halved from same-stat penalty)' : ''}</div>
                            ${caringBlocsList.length > 0 ? `<div>Caring blocs get ${PRESS_CONF_CONFIG.CREDIT_BACKFIRE_PREF} preference toward you</div>` : ''}
                            <div class="pc-proj-headline">Projected headline: "${s.holderAbbr || 'YOU'} Claims Credit — Public Not Convinced"</div>
                        </div>`;
                } else {
                    const creditTitle = s.isFlat
                        ? 'TAKING CREDIT — Stat is Stable Under Your Watch'
                        : 'TAKING CREDIT — Stat is Improving Under Your Watch';
                    projectedHtml = `
                        <div class="pc-projection pc-proj-good">
                            <div class="pc-proj-title">${creditTitle}</div>
                            <div>Your momentum: +${PRESS_CONF_CONFIG.CREDIT_MOMENTUM_MIN} to +${PRESS_CONF_CONFIG.CREDIT_MOMENTUM_MAX}${penaltySuffix}</div>
                            ${caringBlocsList.length > 0 ? `<div>Caring blocs get +${PRESS_CONF_CONFIG.CREDIT_PREF_DELTA} preference toward you</div>` : ''}
                        </div>`;
                }
            } else if (s.mode === 'attack') {
                if (s.willBackfire) {
                    projectedHtml = `
                        <div class="pc-projection pc-proj-bad">
                            <div class="pc-proj-title">BACKFIRE — Stat is Actually Improving</div>
                            <div>Your momentum: ${PRESS_CONF_CONFIG.ATTACK_BACKFIRE_SELF_MOMENTUM}${s.sameStatPenalty ? ' (halved from same-stat penalty)' : ''}</div>
                            <div>${s.holderAbbr} gets +${PRESS_CONF_CONFIG.ATTACK_BACKFIRE_TARGET_MOMENTUM} momentum (sympathy boost)</div>
                            <div class="pc-proj-headline">Projected headline: "Attack on ${s.holderAbbr} Backfires — Stat is Up"</div>
                        </div>`;
                } else {
                    const attackTitle = s.isFlat
                        ? `ATTACK — Criticizing ${s.holderAbbr} for Stagnant Performance`
                        : `ATTACK — Blaming ${s.holderAbbr} for a Failing Stat`;
                    projectedHtml = `
                        <div class="pc-projection pc-proj-good">
                            <div class="pc-proj-title">${attackTitle}</div>
                            <div>${s.holderAbbr}'s momentum: -${PRESS_CONF_CONFIG.ATTACK_TARGET_MOM_MIN} to -${PRESS_CONF_CONFIG.ATTACK_TARGET_MOM_MAX}${penaltySuffix}</div>
                            <div>Your momentum: +${PRESS_CONF_CONFIG.ATTACK_SELF_MOM_MIN} to +${PRESS_CONF_CONFIG.ATTACK_SELF_MOM_MAX}${penaltySuffix}</div>
                            ${caringBlocsList.length > 0 ? `<div>Credit transfer: caring blocs shift -${PRESS_CONF_CONFIG.ATTACK_PREF_SHIFT} from ${s.holderAbbr}, +${PRESS_CONF_CONFIG.ATTACK_PREF_SHIFT} to you</div>` : ''}
                        </div>`;
                }
            } else {
                projectedHtml = `
                    <div class="pc-projection pc-proj-neutral">
                        <div class="pc-proj-title">DRAWING ATTENTION — No Party Holds This Ministry</div>
                        <div>Your momentum: +${PRESS_CONF_CONFIG.ATTENTION_MOMENTUM_MIN} to +${PRESS_CONF_CONFIG.ATTENTION_MOMENTUM_MAX}${s.sameStatPenalty ? ' (reduced: same-stat penalty)' : ''}</div>
                        <div>No credit transfer (nobody to blame or praise)</div>
                    </div>`;
            }

            const caringHtml = caringBlocsList.length > 0
                ? `<div class="pc-caring-blocs"><span class="pc-caring-label">Blocs who care:</span> ${caringBlocsList.join(', ')}</div>`
                : '<div class="pc-caring-blocs"><span class="pc-caring-label">No blocs have this as a priority issue.</span></div>';

            container.innerHTML = `
                <div class="pc-panel">
                    <div class="pc-header-row">
                        <span class="pc-title">Press Conference</span>
                        <span class="pc-cost">Cost: ${PRESS_CONF_CONFIG.AP_COST} AP + $${PRESS_CONF_CONFIG.MONEY_COST.toLocaleString()}</span>
                    </div>
                    <div class="pc-selected">
                        <div class="pc-selected-stat">${statLabel}</div>
                        <div class="pc-selected-meta">
                            <span class="${trendClass}">${trendLabel}</span>
                            <span class="pc-selected-ministry">${s.ministryLabel}${s.holderAbbr ? ` — held by <span style="color:${s.holderColor};font-weight:700">${s.holderAbbr}</span>` : ' — no holder'}</span>
                        </div>
                    </div>
                    <div class="pc-divider pc-divider-accent"></div>
                    ${projectedHtml}
                    <div class="pc-divider"></div>
                    ${caringHtml}
                    ${s.sameStatPenalty ? '<div class="pc-same-stat-warn">⚠ Same-stat penalty: You\'ve spoken about this stat recently. Momentum effects halved.</div>' : ''}
                    <div class="pc-actions">
                        <button class="pc-btn pc-btn-confirm${s.willBackfire ? ' pc-btn-danger' : ''}" id="pc-confirm">${s.willBackfire ? 'PROCEED ANYWAY' : 'HOLD PRESS CONFERENCE'}</button>
                        <button class="pc-btn pc-btn-cancel" id="pc-cancel">CANCEL</button>
                    </div>
                </div>`;

            document.getElementById('pc-confirm').addEventListener('click', async () => {
                const btn = document.getElementById('pc-confirm');
                btn.disabled = true;
                btn.textContent = 'Speaking...';
                const tick = currentShard?.current_tick || 0;
                const result = await executePressConference(_supabase, f.id, n.id, pcSelectedStat, tick);
                if (result.success) {
                    pcResults = result;
                    pcScreen = 'results';
                    renderPC();
                } else {
                    alert(result.error);
                    btn.disabled = false;
                    btn.textContent = s.willBackfire ? 'PROCEED ANYWAY' : 'HOLD PRESS CONFERENCE';
                }
            });
            document.getElementById('pc-cancel').addEventListener('click', () => { pcScreen = 'select'; pcSelectedStat = null; renderPC(); });

        } else if (pcScreen === 'results') {
            const r = pcResults;
            const statLabel = r.statLabel.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

            const modeLabel = r.mode === 'credit' ? (r.backfire ? 'Credit (Backfire!)' : 'Taking Credit')
                : r.mode === 'attack' ? (r.backfire ? 'Attack (Backfire!)' : 'Attack')
                : 'Drawing Attention';
            const modeClass = r.backfire ? 'pc-result-backfire' : (r.mode === 'attention' ? 'pc-result-neutral' : 'pc-result-success');

            let blocHtml = '';
            if (r.blocResults.length > 0) {
                const selfResults = r.blocResults.filter(b => b.party === 'self');
                const targetResults = r.blocResults.filter(b => b.party === 'target');
                if (selfResults.length > 0) {
                    blocHtml += `<div class="pc-result-group"><div class="pc-result-group-label">Your preference changes:</div>`;
                    for (const b of selfResults) {
                        const sign = b.prefDelta > 0 ? '+' : '';
                        blocHtml += `<div class="pc-result-bloc">${b.blocName}: ${sign}${b.prefDelta} (${b.oldPref}% → ${b.newPref}%)</div>`;
                    }
                    blocHtml += '</div>';
                }
                if (targetResults.length > 0) {
                    blocHtml += `<div class="pc-result-group"><div class="pc-result-group-label">${r.targetAbbr}'s preference changes:</div>`;
                    for (const b of targetResults) {
                        const sign = b.prefDelta > 0 ? '+' : '';
                        blocHtml += `<div class="pc-result-bloc">${b.blocName}: ${sign}${b.prefDelta} (${b.oldPref}% → ${b.newPref}%)</div>`;
                    }
                    blocHtml += '</div>';
                }
            } else {
                blocHtml = '<div class="pc-result-group"><div class="pc-result-bloc">No preference changes.</div></div>';
            }

            container.innerHTML = `
                <div class="pc-panel pc-panel-results">
                    <div class="pc-title">Press Conference Results</div>
                    <div class="pc-result-headline ${modeClass}">"${r.headline}"</div>
                    <div class="pc-result-mode">${modeLabel}</div>
                    <div class="pc-divider pc-divider-accent"></div>

                    <div class="pc-result-section">
                        <div class="pc-result-stat">Stat: ${statLabel}</div>
                        <div class="pc-result-momentum">Your momentum: ${r.selfMomentumDelta > 0 ? '+' : ''}${r.selfMomentumDelta}${r.sameStatPenalty && r.flatStat ? ' (reduced — same-stat + flat stat)' : r.sameStatPenalty ? ' (reduced — same-stat penalty)' : r.flatStat ? ' (reduced — flat stat)' : ''}</div>
                        ${r.targetAbbr ? `<div class="pc-result-momentum">${r.targetAbbr}'s momentum: ${r.targetMomentumDelta > 0 ? '+' : ''}${r.targetMomentumDelta}</div>` : ''}
                    </div>

                    <div class="pc-divider"></div>
                    ${blocHtml}
                    <div class="pc-divider"></div>

                    <div class="pc-results-summary">
                        <div>Cost: $${PRESS_CONF_CONFIG.MONEY_COST.toLocaleString()} deducted — Treasury: $${r.oldTreasury.toLocaleString()} → $${r.newTreasury.toLocaleString()}</div>
                        <div>AP: ${r.newAp + PRESS_CONF_CONFIG.AP_COST} → ${r.newAp}</div>
                    </div>

                    <div class="pc-actions">
                        <button class="pc-btn pc-btn-cancel" id="pc-dismiss">DISMISS</button>
                    </div>
                </div>`;

            document.getElementById('pc-dismiss').addEventListener('click', () => {
                pcScreen = 'select';
                pcSelectedStat = null;
                pcResults = null;
                renderParties();
            });
        }
    }

    renderPC();

    // ── Voter Outreach UI ──
    let outreachScreen = 'select'; // 'select' | 'results'
    let outreachResults = null;

    // Fetch recent outreach for cooldown
    const { data: recentOutreach } = await _supabase
        .from('campaign_actions')
        .select('tick_performed, result')
        .eq('party_id', f.id)
        .eq('action_type', 'outreach')
        .gte('tick_performed', (currentShard?.current_tick || 0) - OUTREACH_CONFIG.COOLDOWN_TICKS + 1)
        .order('tick_performed', { ascending: false });

    const recentOutreachBlocIds = new Set((recentOutreach || []).map(r => r.result?.blocId).filter(Boolean));

    function renderOutreach() {
        const container = document.getElementById('outreach-container');
        if (!container) return;

        if (outreachScreen === 'select') {
            const costOk = (f.action_points || 0) >= OUTREACH_CONFIG.AP_COST && (f.party_funds || 0) >= OUTREACH_CONFIG.MONEY_COST;

            const rows = (blocs || []).map(b => {
                const onCooldown = recentOutreachBlocIds.has(b.id);
                const disabled = !costOk || onCooldown;
                const approvalRow = (allBlocApprovals || []).find(a => a.bloc_id === b.id && a.faction_id === f.id);
                const currentPref = approvalRow ? Math.round(approvalRow.preference_score || 0) : '?';
                const popPct = b.population_weight ? Math.round(b.population_weight) + '%' : '';
                return `<div class="outreach-bloc-row${disabled ? ' disabled' : ''}" data-bloc-id="${b.id}">
                    <span class="outreach-bloc-name">${b.bloc_name}</span>
                    <span class="outreach-bloc-pop">${popPct}</span>
                    <span class="outreach-bloc-pref">${currentPref}%</span>
                    ${onCooldown ? '<span class="outreach-bloc-cd">recent</span>' : '<span class="outreach-bloc-cd"></span>'}
                </div>`;
            }).join('');

            container.innerHTML = `
                <div class="outreach-panel">
                    <div class="outreach-header-row">
                        <span class="outreach-title">Voter Outreach</span>
                        <span class="outreach-cost">Cost: ${OUTREACH_CONFIG.AP_COST} AP + $${OUTREACH_CONFIG.MONEY_COST.toLocaleString()}</span>
                    </div>
                    <div class="outreach-desc">Door knocking, community events, local engagement. Guaranteed small gain with one bloc, no backlash.</div>
                    ${!costOk ? '<div class="outreach-cooldown">Not enough AP or funds.</div>' : ''}
                    <div class="outreach-divider"></div>
                    <div class="outreach-bloc-header">
                        <span class="outreach-bloc-name">Bloc</span>
                        <span class="outreach-bloc-pop">Pop</span>
                        <span class="outreach-bloc-pref">Pref</span>
                        <span class="outreach-bloc-cd"></span>
                    </div>
                    <div class="outreach-bloc-list">${rows}</div>
                </div>`;

            container.querySelectorAll('.outreach-bloc-row:not(.disabled)').forEach(row => {
                row.addEventListener('click', async () => {
                    const blocId = row.dataset.blocId;
                    // Confirm inline — just execute directly (spec says no risk)
                    row.classList.add('disabled');
                    row.style.opacity = '0.5';
                    const tick = currentShard?.current_tick || 0;
                    const result = await executeOutreach(_supabase, f.id, n.id, blocId, tick);
                    if (result.success) {
                        outreachResults = result;
                        outreachScreen = 'results';
                        renderOutreach();
                    } else {
                        alert(result.error);
                        row.classList.remove('disabled');
                        row.style.opacity = '';
                    }
                });
            });

        } else if (outreachScreen === 'results') {
            const r = outreachResults;
            container.innerHTML = `
                <div class="outreach-panel outreach-panel-results">
                    <div class="outreach-title">Voter Outreach Results</div>
                    <div class="outreach-divider outreach-divider-accent"></div>
                    <div class="outreach-result-bloc">${r.blocName}</div>
                    <div class="outreach-result-pref">Preference: +${r.prefDelta} (${r.oldPref}% → ${r.newPref}%)</div>
                    <div class="outreach-divider"></div>
                    <div class="outreach-result-summary">
                        <div>Cost: $${OUTREACH_CONFIG.MONEY_COST.toLocaleString()} — Treasury: $${r.oldTreasury.toLocaleString()} → $${r.newTreasury.toLocaleString()}</div>
                        <div>AP: ${r.newAp + OUTREACH_CONFIG.AP_COST} → ${r.newAp}</div>
                    </div>
                    <div class="outreach-actions">
                        <button class="outreach-btn" id="outreach-dismiss">DISMISS</button>
                    </div>
                </div>`;

            document.getElementById('outreach-dismiss').addEventListener('click', () => {
                outreachScreen = 'select';
                outreachResults = null;
                renderParties();
            });
        }
    }

    renderOutreach();

    // ── Fundraiser UI ──
    let fundraiserScreen = 'closed'; // 'closed' | 'offer' | 'result'
    let fundraiserOffer = null;
    let fundraiserResult = null;

    window.openFundraiserForBloc = function(blocId) {
        fundraiserScreen = 'loading';
        renderFundraiser();
        executeFundraiserOffer(_supabase, f.id, n.id, currentShard?.current_tick || 0, blocId).then(result => {
            if (result.success) {
                fundraiserOffer = result;
                fundraiserScreen = 'offer';
            } else {
                alert(result.error);
                fundraiserScreen = 'closed';
            }
            renderFundraiser();
        });
    };

    function renderFundraiser() {
        const container = document.getElementById('fundraiser-container');
        if (!container) return;

        if (fundraiserScreen === 'closed') {
            const costOk = currentAP >= FUNDRAISER_CONFIG.AP_COST;
            const disabled = !costOk;

            const blocRows = (blocs || []).map(b => {
                const approvalRow = (allBlocApprovals || []).find(a => a.bloc_id === b.id && a.faction_id === f.id);
                const currentPref = approvalRow ? Math.round(approvalRow.preference_score || 0) : 0;
                const tooLow = currentPref < 20;
                const ranges = DONATION_RANGES[b.bloc_name];
                const rangeLabel = ranges
                    ? `$${Math.round(ranges.small[0]/1000)}k–$${Math.round(ranges.large[1]/1000)}k`
                    : '';
                const isDisabled = disabled || tooLow;
                return `<div class="fundraiser-bloc-row${isDisabled ? ' disabled' : ''}" data-bloc-id="${b.id}">
                    <span class="fundraiser-bloc-name">${b.bloc_name}</span>
                    <span class="fundraiser-bloc-pref">${currentPref}%</span>
                    <span class="fundraiser-bloc-range">${rangeLabel}</span>
                    ${tooLow ? '<span class="fundraiser-bloc-status" style="color:#ff4444;">won\'t fund</span>' : ''}
                </div>`;
            }).join('');

            container.innerHTML = `
                <div class="fundraiser-panel">
                    <div class="fundraiser-header-row">
                        <span class="fundraiser-title">Hold a Fundraiser</span>
                        <span class="fundraiser-cost">Cost: ${FUNDRAISER_CONFIG.AP_COST} AP</span>
                    </div>
                    <div class="fundraiser-donor-desc">Choose a voter bloc to approach for donations. They'll offer clean money, or big money with a political demand.</div>
                    ${!costOk ? '<div class="outreach-cooldown" style="color:#ff4444;">Not enough AP.</div>' : ''}
                    <div class="fundraiser-divider"></div>
                    <div class="fundraiser-bloc-header">
                        <span class="fundraiser-bloc-name">Bloc</span>
                        <span class="fundraiser-bloc-pref">Pref</span>
                        <span class="fundraiser-bloc-range">Range</span>
                    </div>
                    <div class="fundraiser-bloc-list">${blocRows}</div>
                </div>`;

            container.querySelectorAll('.fundraiser-bloc-row:not(.disabled)').forEach(row => {
                row.addEventListener('click', () => {
                    window.openFundraiserForBloc(row.dataset.blocId);
                });
            });
            return;
        }

        if (fundraiserScreen === 'loading') {
            container.innerHTML = `
                <div class="fundraiser-panel">
                    <div class="fundraiser-header-row">
                        <span class="fundraiser-title">Fundraiser</span>
                        <span class="fundraiser-cost">Cost: ${FUNDRAISER_CONFIG.AP_COST} AP</span>
                    </div>
                    <div style="text-align:center;padding:30px;color:var(--text-muted);">Finding donors...</div>
                </div>`;
            return;
        }

        if (fundraiserScreen === 'offer') {
            const o = fundraiserOffer;
            const bloc = o.bloc;
            const offer = o.offer;
            const ideoTags = o.blocIdeologyTags.map(t => colorTagUpper(t)).join('&nbsp; ');
            const conflictHtml = o.conflicts.length > 0
                ? o.conflicts.map(c => `<div class="fundraiser-conflict">WARNING: ${c.message}</div>`).join('')
                : '';

            const bigBlocked = o.bigOffersBlocked;

            container.innerHTML = `
                <div class="fundraiser-panel">
                    <div class="fundraiser-header-row">
                        <span class="fundraiser-title">Fundraiser</span>
                        <span class="fundraiser-cost">Cost: ${FUNDRAISER_CONFIG.AP_COST} AP</span>
                    </div>

                    <div class="fundraiser-donor-info">
                        <div class="fundraiser-donor-name">DONOR: ${bloc.bloc_name.toUpperCase()}</div>
                        <div class="fundraiser-donor-ideology">Ideology: ${ideoTags}</div>
                    </div>
                    <div class="fundraiser-donor-desc">A delegation of ${bloc.bloc_name.toLowerCase()} would like to support your party.</div>
                    <div class="fundraiser-divider"></div>

                    <div class="fundraiser-option">
                        <div class="fundraiser-option-label">OPTION A: NO STRINGS</div>
                        <div class="fundraiser-option-box">
                            <div class="fundraiser-option-amount">Accept $${offer.smallAmount.toLocaleString()}${o.smallHalved ? ' <span style="color:#ffa500;font-size:0.85em;">(half rate — active promise pending)</span>' : ''}</div>
                            <div class="fundraiser-option-desc">No obligations. No promises. Clean money.</div>
                            <button class="fundraiser-btn fundraiser-btn-accept" id="fundraiser-accept-small">ACCEPT</button>
                        </div>
                    </div>

                    ${!bigBlocked ? `
                    <div class="fundraiser-option">
                        <div class="fundraiser-option-label">OPTION B: WITH CONDITIONS</div>
                        <div class="fundraiser-option-box fundraiser-option-big">
                            <div class="fundraiser-option-amount">Accept $${offer.largeAmount.toLocaleString()}</div>
                            <div class="fundraiser-option-demand">DEMAND: "${offer.demand.resolvedText}"</div>
                            <div class="fundraiser-option-deadline">Deadline: ${offer.deadline} ticks (due by Tick ${(o.currentTick || 0) + offer.deadline})</div>
                            <div class="fundraiser-divider-thin"></div>
                            <div class="fundraiser-rewards">
                                <div class="fundraiser-reward-good">IF YOU DELIVER: +${FUNDRAISER_CONFIG.PROMISE_KEPT_PREF_BONUS} preference with ${bloc.bloc_name}, +${FUNDRAISER_CONFIG.PROMISE_KEPT_MOMENTUM} momentum</div>
                                <div class="fundraiser-reward-bad">IF YOU FAIL: ${FUNDRAISER_CONFIG.PROMISE_BROKEN_DONOR_PREF} preference with ${bloc.bloc_name}, ${FUNDRAISER_CONFIG.PROMISE_BROKEN_ALL_PREF} preference with ALL blocs, ${FUNDRAISER_CONFIG.PROMISE_BROKEN_MOMENTUM} momentum</div>
                            </div>
                            ${conflictHtml}
                            <button class="fundraiser-btn fundraiser-btn-promise" id="fundraiser-accept-large">ACCEPT WITH PROMISE</button>
                        </div>
                    </div>
                    ` : `
                    <div class="fundraiser-option">
                        <div class="fundraiser-option-label">OPTION B: UNAVAILABLE</div>
                        <div class="fundraiser-option-box fundraiser-option-locked">
                            <div class="fundraiser-option-desc" style="color:#ff4444;">${o.hasActivePromiseWithBloc
                                ? 'Large donations are unavailable. Fulfill your active promise to this bloc before requesting another.'
                                : 'Large donations are unavailable. This bloc doesn\'t trust you with conditions right now.'}</div>
                        </div>
                    </div>
                    `}

                    <div class="fundraiser-decline">
                        <button class="fundraiser-btn fundraiser-btn-decline" id="fundraiser-decline">DECLINE BOTH — NO FUNDRAISER</button>
                    </div>
                </div>`;

            // Wire up buttons
            document.getElementById('fundraiser-accept-small').addEventListener('click', async () => {
                const btn = document.getElementById('fundraiser-accept-small');
                btn.disabled = true; btn.textContent = 'Processing...';
                const result = await acceptSmallDonation(_supabase, f.id, n.id, bloc.id, bloc.bloc_name, offer.smallAmount, o.currentTick, o.factionAbbr);
                if (result.success) {
                    fundraiserResult = result;
                    fundraiserScreen = 'result';
                    renderFundraiser();
                } else {
                    alert(result.error || 'Failed');
                    btn.disabled = false; btn.textContent = 'ACCEPT';
                }
            });

            if (!bigBlocked) {
                document.getElementById('fundraiser-accept-large').addEventListener('click', async () => {
                    const btn = document.getElementById('fundraiser-accept-large');
                    btn.disabled = true; btn.textContent = 'Processing...';
                    const result = await acceptLargeDonation(
                        _supabase, f.id, n.id, bloc.id, bloc.bloc_name,
                        offer.largeAmount, offer.demand, offer.demandIndex,
                        offer.deadline, o.currentTick, o.nationStats, o.factionAbbr
                    );
                    if (result.success) {
                        fundraiserResult = result;
                        fundraiserScreen = 'result';
                        renderFundraiser();
                    } else {
                        alert(result.error || 'Failed');
                        btn.disabled = false; btn.textContent = 'ACCEPT WITH PROMISE';
                    }
                });
            }

            document.getElementById('fundraiser-decline').addEventListener('click', async () => {
                const btn = document.getElementById('fundraiser-decline');
                btn.disabled = true; btn.textContent = 'Declining...';
                const result = await declineFundraiser(_supabase, f.id, n.id, bloc.id, bloc.bloc_name, o.currentTick);
                if (result.success) {
                    fundraiserResult = { ...result, blocName: bloc.bloc_name };
                    fundraiserScreen = 'result';
                    renderFundraiser();
                } else {
                    alert(result.error || 'Failed');
                    btn.disabled = false; btn.textContent = 'DECLINE BOTH — NO FUNDRAISER';
                }
            });

        } else if (fundraiserScreen === 'result') {
            const r = fundraiserResult;
            let resultBody = '';

            if (r.type === 'small_donation') {
                resultBody = `
                    <div class="fundraiser-result-heading">FUNDRAISER RESULTS</div>
                    <div class="fundraiser-result-line">Donor: ${r.blocName}</div>
                    <div class="fundraiser-result-line">Accepted: $${r.amount.toLocaleString()} (no strings)</div>
                    <div class="fundraiser-divider-thin"></div>
                    <div class="fundraiser-result-line">Treasury: $${r.oldTreasury.toLocaleString()} → $${r.newTreasury.toLocaleString()}</div>
                    <div class="fundraiser-result-line">AP: ${r.newAp + FUNDRAISER_CONFIG.AP_COST} → ${r.newAp}</div>`;
            } else if (r.type === 'large_donation') {
                resultBody = `
                    <div class="fundraiser-result-heading">FUNDRAISER RESULTS</div>
                    <div class="fundraiser-result-line">Donor: ${r.blocName}</div>
                    <div class="fundraiser-result-line">Accepted: $${r.amount.toLocaleString()} with conditions</div>
                    <div class="fundraiser-divider-thin"></div>
                    <div class="fundraiser-result-line">Treasury: $${r.oldTreasury.toLocaleString()} → $${r.newTreasury.toLocaleString()}</div>
                    <div class="fundraiser-result-line">AP: ${r.newAp + FUNDRAISER_CONFIG.AP_COST} → ${r.newAp}</div>
                    <div class="fundraiser-divider-thin"></div>
                    <div class="fundraiser-result-promise">
                        <div class="fundraiser-result-promise-label">PROMISE RECORDED</div>
                        <div>"${r.demandText}"</div>
                        <div>Deadline: ${r.deadline} ticks (due Tick ${r.tickDeadline})</div>
                        <div style="color:var(--text-muted);font-size:0.82rem;margin-top:6px;">This promise is now tracked on your Promises tab below.</div>
                    </div>
                    ${r.headline ? `<div class="fundraiser-result-headline">CIVIC: "${r.headline}"</div>` : ''}`;
            } else {
                resultBody = `
                    <div class="fundraiser-result-heading">FUNDRAISER DECLINED</div>
                    <div class="fundraiser-result-line">You declined both offers from ${r.blocName}.</div>
                    <div class="fundraiser-result-line">AP: ${r.newAp + FUNDRAISER_CONFIG.AP_COST} → ${r.newAp}</div>`;
            }

            container.innerHTML = `
                <div class="fundraiser-panel fundraiser-panel-results">
                    ${resultBody}
                    <div class="fundraiser-actions">
                        <button class="fundraiser-btn fundraiser-btn-dismiss" id="fundraiser-dismiss">DISMISS</button>
                    </div>
                </div>`;

            document.getElementById('fundraiser-dismiss').addEventListener('click', () => {
                fundraiserScreen = 'closed';
                fundraiserOffer = null;
                fundraiserResult = null;
                renderFundraiser();
                renderPromises(); // Refresh promises after fundraiser
            });
        }
    }

    // ── Active Promises UI (Phase 5) ──
    async function renderPromises() {
        const container = document.getElementById('promises-container');
        if (!container) return;

        const { data: promises } = await _supabase
            .from('fundraiser_promises')
            .select('*')
            .eq('party_id', f.id)
            .order('tick_created', { ascending: false });

        const activePromises = (promises || []).filter(p => p.status === 'active');
        const resolvedPromises = (promises || []).filter(p => p.status !== 'active');

        if (activePromises.length === 0 && resolvedPromises.length === 0) {
            container.innerHTML = '';
            return;
        }

        const currentTick = currentShard?.current_tick || 0;

        function promiseStatusIcon(p) {
            if (p.status === 'fulfilled') return '<span style="color:#4CAF50;">FULFILLED</span>';
            if (p.status === 'broken') return '<span style="color:#ff4444;">BROKEN</span>';

            const remaining = p.tick_deadline - currentTick;
            const elapsed = currentTick - p.tick_created;
            const total = p.deadline_ticks;
            const pct = Math.min(100, Math.round((elapsed / total) * 100));

            // Determine status from progress
            const prog = p.progress || {};
            let statusText = 'IN PROGRESS';
            let statusColor = '#ff9800';
            let statusIcon = 'hourglass';

            if (remaining <= Math.ceil(total * 0.25)) {
                statusText = 'AT RISK';
                statusColor = '#ff4444';
                statusIcon = 'warning';
            } else if (prog.has_ministry || (prog.completed && prog.completed > 0)) {
                statusText = 'IN PROGRESS';
                statusColor = '#ff9800';
                statusIcon = 'progress';
            }

            return `<span style="color:${statusColor};">${statusText}</span>`;
        }

        function promiseProgressBar(p) {
            if (p.status !== 'active') return '';
            const elapsed = currentTick - p.tick_created;
            const total = p.deadline_ticks;
            const pct = Math.min(100, Math.round((elapsed / total) * 100));
            const remaining = p.tick_deadline - currentTick;
            const barColor = remaining <= Math.ceil(total * 0.25) ? '#ff4444' : '#ff9800';
            const filled = Math.round(pct / 3.125); // 32 chars
            const empty = 32 - filled;
            return `<div class="promise-bar-wrap">
                <div class="promise-bar"><div class="promise-bar-fill" style="width:${pct}%;background:${barColor};"></div></div>
                <span class="promise-bar-label">(${elapsed} of ${total} ticks elapsed)</span>
            </div>`;
        }

        function promiseProgressDetails(p) {
            if (p.status !== 'active') return '';
            const prog = p.progress || {};
            const lines = [];

            if (prog.has_ministry !== undefined) {
                lines.push(prog.has_ministry
                    ? `<span style="color:#4CAF50;">Ministry (${prog.ministry_key}): Acquired</span>`
                    : `<span style="color:#ff9800;">Ministry (${prog.ministry_key}): Not yet acquired</span>`);
            }
            if (prog.current_value !== undefined && prog.target_value !== undefined) {
                const cond = p.conditions || {};
                const stat = cond.stat_key || '';
                const dir = cond.direction === 'below' ? 'needs' : 'needs';
                const needed = Math.abs(prog.target_value - prog.current_value);
                const met = cond.direction === 'below'
                    ? prog.current_value <= prog.target_value
                    : prog.current_value >= prog.target_value;
                lines.push(met
                    ? `<span style="color:#4CAF50;">${stat}: ${prog.current_value} (target: ${prog.target_value}) — MET</span>`
                    : `<span style="color:#ff9800;">${stat}: ${prog.current_value} → ${dir} ${prog.target_value} (${needed.toFixed(1)} more)</span>`);
            }
            if (prog.completed !== undefined && prog.required !== undefined) {
                lines.push(`<span>Progress: ${prog.completed} / ${prog.required}</span>`);
            }
            if (prog.sustained_count !== undefined) {
                lines.push(`<span>Sustained: ${prog.sustained_count} / ${prog.required} consecutive ticks</span>`);
            }
            if (prog.floor !== undefined && prog.current_value !== undefined) {
                lines.push(`<span>Floor: ${prog.floor} (current: ${prog.current_value})</span>`);
            }
            if (prog.stats && Array.isArray(prog.stats)) {
                for (const s of prog.stats) {
                    lines.push(s.met
                        ? `<span style="color:#4CAF50;">${s.stat_key}: ${s.current} (target: ${s.target}) — MET</span>`
                        : `<span style="color:#ff9800;">${s.stat_key}: ${s.current} → needs ${s.target}</span>`);
                }
            }
            return lines.length > 0 ? `<div class="promise-progress-details">${lines.join('<br>')}</div>` : '';
        }

        const activeHTML = activePromises.map(p => {
            const remaining = p.tick_deadline - currentTick;
            return `<div class="promise-card">
                <div class="promise-card-header">
                    <span class="promise-card-bloc">Promise to ${p.bloc_name}</span>
                    <span class="promise-card-amount">$${(p.donation_amount || 0).toLocaleString()} received</span>
                </div>
                <div class="promise-card-demand">"${p.demand_text}"</div>
                <div class="promise-card-deadline">Deadline: ${remaining} ticks remaining (due Tick ${p.tick_deadline})</div>
                <div class="promise-card-status">STATUS: ${promiseStatusIcon(p)}</div>
                ${promiseProgressDetails(p)}
                ${promiseProgressBar(p)}
                <div class="promise-card-stakes">
                    <div style="color:#4CAF50;font-size:0.82rem;">Success: +${FUNDRAISER_CONFIG.PROMISE_KEPT_PREF_BONUS} pref w/ ${p.bloc_name}, +${FUNDRAISER_CONFIG.PROMISE_KEPT_MOMENTUM} momentum</div>
                    <div style="color:#ff4444;font-size:0.82rem;">Failure: ${FUNDRAISER_CONFIG.PROMISE_BROKEN_DONOR_PREF} pref w/ ${p.bloc_name}, ${FUNDRAISER_CONFIG.PROMISE_BROKEN_ALL_PREF} all blocs, ${FUNDRAISER_CONFIG.PROMISE_BROKEN_MOMENTUM} momentum</div>
                </div>
            </div>`;
        }).join('');

        const resolvedHTML = resolvedPromises.slice(0, 5).map(p => {
            const icon = p.status === 'fulfilled' ? '<span style="color:#4CAF50;">FULFILLED</span>' : '<span style="color:#ff4444;">BROKEN</span>';
            return `<div class="promise-card promise-card-resolved">
                <div class="promise-card-header">
                    <span class="promise-card-bloc">Promise to ${p.bloc_name}</span>
                    <span>${icon}</span>
                </div>
                <div class="promise-card-demand" style="color:var(--text-muted);">"${p.demand_text}"</div>
                <div style="color:var(--text-muted);font-size:0.78rem;">Resolved at Tick ${p.tick_resolved || '?'} | $${(p.donation_amount || 0).toLocaleString()}</div>
            </div>`;
        }).join('');

        container.innerHTML = `
            <div class="promises-panel">
                <div class="promises-header">ACTIVE PROMISES</div>
                ${activePromises.length > 0 ? activeHTML : '<div class="promises-empty">No active promises.</div>'}
                ${resolvedPromises.length > 0 ? `
                    <div class="promises-header" style="margin-top:16px;">PROMISE HISTORY</div>
                    ${resolvedHTML}
                ` : ''}
            </div>`;
    }

    renderPromises();

    // ── Tab Switching ──
    // Render default fundraiser panel (always visible, like rally/outreach)
    renderFundraiser();
}

// ── Ideology Section ──
async function renderIdeologySection() {
    const container = document.getElementById('ideology-container');
    if (!container || !currentNation || !ideologyAllParties) return;

    const ideologies = await loadNationIdeologies(_supabase, currentNation.id);
    const ideoMap = {};
    for (const row of (ideologies || [])) ideoMap[row.faction_id] = row;

    // Build party selector buttons — user's party first
    const sorted = [...ideologyAllParties].sort((a, b) => {
        if (a.id === currentFaction.id) return -1;
        if (b.id === currentFaction.id) return 1;
        return 0;
    });

    const selectedId = selectedIdeologyFactionId || currentFaction.id;
    const btnHtml = sorted.map(p => {
        const isActive = p.id === selectedId;
        const color = p.party_color || '#666';
        const star = p.id === currentFaction.id ? ' \u2605' : '';
        const activeStyle = isActive
            ? `border-color:${color}; color:${color};`
            : '';
        return `<button class="ideology-party-btn${isActive ? ' active' : ''}" data-fid="${p.id}" style="${activeStyle}">${p.abbreviation || p.faction_name}${star}</button>`;
    }).join('');

    // Build slider axes for selected faction
    const ideoRow = ideoMap[selectedId] || {};
    let axesHtml = '';
    const leanings = [];

    for (const axis of IDEOLOGY_AXES) {
        const score = ideoRow[axis.key] || 0;
        const absScore = Math.abs(score);
        const pct = ((score + 100) / 200) * 100; // -100→0%, 0→50%, +100→100%

        // Determine marker color: blend toward the side it leans
        const markerColor = score < 0 ? axis.leftColor : score > 0 ? axis.rightColor : '#888';

        axesHtml += `
            <div class="ideology-axis-row">
                <span class="ideology-axis-label ideology-axis-label-left" style="color:${axis.leftColor}">${axis.left}</span>
                <div class="ideology-track">
                    <div class="ideology-track-center"></div>
                    <div class="ideology-marker" style="left:${pct}%;background:${markerColor}">
                        <span class="ideology-marker-value">${absScore}</span>
                    </div>
                </div>
                <span class="ideology-axis-label ideology-axis-label-right" style="color:${axis.rightColor}">${axis.right}</span>
            </div>`;

        leanings.push(getIdeologyLabel(score, axis));
    }

    const leaningsHtml = leanings.map(l =>
        `<span class="ideology-leaning-item">${l}</span>`
    ).join(' <span style="color:var(--text-muted,#666)">\u00B7</span> ');

    container.innerHTML = `
        <div class="ideology-section">
            <div class="ideology-header">Ideology</div>
            <div class="ideology-party-selector">${btnHtml}</div>
            <div class="ideology-axes">${axesHtml}</div>
            <div class="ideology-leanings">${leaningsHtml}</div>
        </div>`;

    // Bind party selector clicks
    container.querySelectorAll('.ideology-party-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            selectedIdeologyFactionId = btn.dataset.fid;
            renderIdeologySection();
        });
    });
}

// Re-render ideology on tick advance
window.addEventListener('tick-advanced', () => {
    renderIdeologySection();
});

initPage('parties', async (state) => {
    const { nation, faction, shard } = state;
    currentFaction = faction;
    currentNation = nation;
    currentShard = shard;
    initGameConfigForNation(nation);
    await renderParties();
});
</script>
