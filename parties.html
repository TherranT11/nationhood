<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parties | Nationhood Alpha</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/parties.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="top-bar"></div>
<div id="content-area">
    <div class="loading-container">
        <div class="loading-spinner"></div>
        <div>Loading parties...</div>
    </div>
</div>
<script type="module">
import { _supabase } from './js/supabase-client.js';
import { initPage, qCache, formatCurrency } from './js/common.js';
import { loadSeats, fetchActiveCoalition, isGovernmentAutocracy, initGameConfigForNation, GAME_CONFIG, runElectionPreview, STAT_TO_MINISTRY, statDirectionSign, ISSUE_CATEGORY_STATS, RALLY_SUBJECTS, RALLY_CONFIG, IDEOLOGY_OPPOSITES, IDEOLOGY_TO_AXIS, IDEOLOGY_AXES, classifyRallyBlocs, executeRally, PRESS_CONF_CONFIG, executePressConference, OUTREACH_CONFIG, executeOutreach, FUNDRAISER_CONFIG, DONATION_RANGES, DONOR_DEMANDS, executeFundraiserOffer, acceptSmallDonation, acceptLargeDonation, declineFundraiser, getFullIdeologyProfile, loadNationIdeologies } from './js/game-common.js';
import { getPartyIconSVG } from './js/party-icons.js';

let currentFaction = null;
let currentNation = null;
let currentShard = null;
let selectedIdeologyFactionId = null;
let ideologyAllParties = null;

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function tickToDate(tick) {
    if (tick == null) return '—';
    const y = 2000 + Math.floor(tick / 12);
    return `${MONTHS[tick % 12]}, ${y}`;
}

function ordinal(n) {
    const s = ['th','st','nd','rd'];
    const v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function getPartyRole(factionId, seats, coalition) {
    if (!seats || seats === 0) return 'No Seats';
    if (coalition && coalition.party_ids && coalition.party_ids.includes(factionId)) {
        return coalition.lead_party_id === factionId
            ? 'Lead — Governing Coalition'
            : 'Governing Coalition';
    }
    return 'Opposition';
}

function getRoleBadgeClass(role) {
    if (role.includes('Governing')) return 'role-badge-gov';
    if (role === 'Opposition') return 'role-badge-opp';
    return 'role-badge-none';
}

function buildIdeologyTags(f) {
    let html = '';
    if (f.ideology_value_1) {
        const cls = 'tag-' + f.ideology_value_1.toLowerCase();
        html += `<span class="ideology-tag ${cls}">${f.ideology_value_1}</span>`;
    }
    if (f.ideology_value_2) {
        const cls = 'tag-' + f.ideology_value_2.toLowerCase();
        html += `<span class="ideology-tag ${cls}">${f.ideology_value_2}</span>`;
    }
    return html;
}

async function renderParties() {
    const el = document.getElementById('content-area');
    const f = currentFaction;
    const n = currentNation;

    if (!f || !n) {
        console.warn('[parties] Missing faction or nation:', { faction: f, nation: n });
        el.innerHTML = '<p style="color:var(--text-muted);text-align:center;margin-top:40px;">No party data available.</p>';
        return;
    }

    const isAutocracy = isGovernmentAutocracy(n);

    if (isAutocracy) {
        // ── Autocracy Party Page ──

        // Archetype definitions
        const ARCHETYPES = {
            strongman: {
                label: 'The Strongman',
                desc: 'Supreme ruler of the nation. All power flows from you.'
            },
            general: {
                label: 'General',
                desc: 'Commands the armed forces. Loyalty is earned on the battlefield.'
            },
            intelligence_chief: {
                label: 'Intelligence Chief',
                desc: 'Knows every secret worth knowing. Information is power.'
            },
            party_chairman: {
                label: 'Party Chairman',
                desc: 'Controls the party apparatus. Bureaucracy bends to your will.'
            },
            oligarch: {
                label: 'Oligarch',
                desc: 'Wealth buys influence. The economy answers to you.'
            },
            security_chief: {
                label: 'Security Chief',
                desc: 'Runs the secret police. Fear keeps the regime intact.'
            },
            heir_apparent: {
                label: 'Heir Apparent',
                desc: 'Next in line — if you survive long enough.'
            }
        };
        const NON_STRONGMAN_KEYS = ['general', 'intelligence_chief', 'party_chairman', 'oligarch', 'security_chief', 'heir_apparent'];

        // Deterministic archetype assignment based on faction ID
        function getArchetype(factionId, isRuling) {
            if (isRuling) return ARCHETYPES.strongman;
            // Simple hash from faction UUID to pick a stable index
            let hash = 0;
            for (let i = 0; i < factionId.length; i++) {
                hash = ((hash << 5) - hash) + factionId.charCodeAt(i);
                hash |= 0;
            }
            const idx = Math.abs(hash) % NON_STRONGMAN_KEYS.length;
            return ARCHETYPES[NON_STRONGMAN_KEYS[idx]];
        }

        // Fetch all factions
        const { data: allFactions } = await _supabase
            .from('factions')
            .select('id, faction_name, abbreviation, seats, party_color, party_logo, leader_first_name, leader_last_name, leader_age, founded_tick, ideology_value_1, ideology_value_2, loyalty, action_points, party_funds')
            .eq('nation_id', n.id)
            .eq('faction_type', 'party');

        const seatData = await loadSeats(_supabase, n.id, true, allFactions || [], f.id);
        const mySeats = seatData.currentSeats || 0;
        const isRuling = n.ruling_faction_id === f.id;
        const myArchetype = getArchetype(f.id, isRuling);

        // For Strongman, use head-of-state name from nation; for others, use faction leader
        const leaderFirst = isRuling ? (n.head_of_state_first_name || f.leader_first_name || 'Unknown') : (f.leader_first_name || 'Unknown');
        const leaderLast = isRuling ? (n.head_of_state_last_name || f.leader_last_name || 'Unknown') : (f.leader_last_name || 'Unknown');
        const leaderAge = isRuling ? (n.head_of_state_age || f.leader_age || '—') : (f.leader_age || '—');
        const leaderName = `${leaderFirst} ${leaderLast}`;
        const partyColor = f.party_color || '#ffcc00';
        const logoSvg = getPartyIconSVG(f.party_logo, 44, partyColor);
        const founded = tickToDate(f.founded_tick);
        const roleBadge = isRuling
            ? '<span class="role-badge role-badge-gov">Ruling Faction</span>'
            : '<span class="role-badge role-badge-opp">Opposition</span>';
        const ideologyTags = buildIdeologyTags(f);
        const abbr = f.abbreviation ? `<span class="my-party-abbr">(${f.abbreviation})</span>` : '';

        // ── Standing box: Grip (Strongman) or Loyalty + Ambition (others) ──
        function getGripLevel(val) {
            if (val >= 90) return { label: 'ABSOLUTE', desc: 'You are untouchable. For now.', color: '#4CAF50' };
            if (val >= 75) return { label: 'FIRM', desc: 'Stable. No immediate threats.', color: '#4CAF50' };
            if (val >= 60) return { label: 'SECURE', desc: 'Manageable but watch the cracks.', color: '#4CAF50' };
            if (val >= 45) return { label: 'SHAKY', desc: 'Multiple brokers are unhappy. Act now.', color: '#ff9800' };
            if (val >= 30) return { label: 'FRAGILE', desc: 'Coup is being actively planned.', color: '#ff5722' };
            return { label: 'CRUMBLING', desc: 'You will be overthrown within 1\u20133 ticks.', color: '#ff4444' };
        }
        function getLoyaltyLevel(val) {
            if (val >= 90) return { label: 'DEVOTED', desc: 'Will die for you. Probably.', color: '#4CAF50' };
            if (val >= 75) return { label: 'LOYAL', desc: 'Reliable. Keep rewarding.', color: '#4CAF50' };
            if (val >= 60) return { label: 'CONTENT', desc: 'No complaints. Could change.', color: '#4CAF50' };
            if (val >= 40) return { label: 'WAVERING', desc: 'Unhappy. Looking at options. Act soon.', color: '#ff9800' };
            if (val >= 20) return { label: 'HOSTILE', desc: 'Actively plotting. Purge or appease immediately.', color: '#ff5722' };
            return { label: 'MUTINOUS', desc: 'Will join any coup attempt. May lead one.', color: '#ff4444' };
        }
        function getAmbitionLevel(val) {
            if (val >= 76) return { label: 'DANGEROUS', desc: 'Actively wants your job. Will create opportunity.', color: '#ff4444' };
            if (val >= 51) return { label: 'SCHEMING', desc: 'Would take your job if the opportunity arose.', color: '#ff9800' };
            if (val >= 26) return { label: 'WATCHFUL', desc: 'Keeping their options open.', color: '#4CAF50' };
            return { label: 'CONTENT', desc: 'No interest in your job. Safe.', color: '#4CAF50' };
        }

        let standingHTML = '';
        if (isRuling) {
            const grip = getGripLevel(f.grip ?? 75);

            const unrest = n.civil_unrest ?? 0;
            const violence = n.political_violence ?? 0;
            const stability = n.stability ?? 100;
            const raw = (unrest * 0.35) + (violence * 0.35) + ((100 - stability) * 0.30);
            const coupPct = Math.round(Math.max(0, Math.min(100, raw)));

            let coupLabel, coupColor;
            if (coupPct >= 75) { coupLabel = 'CRITICAL'; coupColor = '#ff4444'; }
            else if (coupPct >= 50) { coupLabel = 'HIGH'; coupColor = '#ff5722'; }
            else if (coupPct >= 30) { coupLabel = 'ELEVATED'; coupColor = '#ff9800'; }
            else if (coupPct >= 15) { coupLabel = 'LOW'; coupColor = '#4CAF50'; }
            else { coupLabel = 'MINIMAL'; coupColor = '#4CAF50'; }

            const plotMsg = coupPct >= 50
                ? 'Active plots detected. Factions are mobilizing.'
                : 'No active plots detected.';

            standingHTML = `
            <div class="standing-box">
                <div class="standing-header">Your Standing</div>
                <div class="standing-columns">
                    <div class="standing-col">
                        <div class="standing-row">
                            <div class="standing-label">Grip on Power</div>
                            <div class="standing-value" style="color:${grip.color}">${grip.label}</div>
                        </div>
                        <div class="standing-desc">${grip.desc}</div>
                    </div>
                    <div class="standing-col">
                        <div class="standing-row">
                            <div class="standing-label">Coup Risk</div>
                            <div class="standing-value" style="color:${coupColor}">${coupPct}%</div>
                        </div>
                        <div class="coup-risk-bar-track">
                            <div class="coup-risk-bar-fill" style="width:${coupPct}%;background:${coupColor}"></div>
                        </div>
                        <div class="standing-desc">${plotMsg}</div>
                    </div>
                </div>
            </div>`;
        } else {
            const loyalty = getLoyaltyLevel(f.loyalty ?? 75);
            const ambition = getAmbitionLevel(f.ambition ?? 15);
            standingHTML = `
            <div class="standing-box">
                <div class="standing-header">Your Standing</div>
                <div class="standing-row">
                    <div class="standing-label">Loyalty</div>
                    <div class="standing-value" style="color:${loyalty.color}">${loyalty.label}</div>
                </div>
                <div class="standing-desc">${loyalty.desc}</div>
                <div class="standing-row" style="margin-top: 12px;">
                    <div class="standing-label">Ambition</div>
                    <div class="standing-value" style="color:${ambition.color}">${ambition.label}</div>
                </div>
                <div class="standing-desc">${ambition.desc}</div>
            </div>`;
        }

        // ── Action Points (all autocracy players) ──
        const currentAP = Math.min(f.action_points || 0, GAME_CONFIG.MAX_AP);
        const maxAP = GAME_CONFIG.MAX_AP;
        const apPct = Math.round((currentAP / maxAP) * 100);
        const treasury = f.party_funds || 0;
        const treasuryFmt = treasury >= 1_000_000
            ? '$' + (treasury / 1_000_000).toFixed(1).replace(/\.0$/, '') + 'M'
            : '$' + treasury.toLocaleString();

        let apTip;
        if (currentAP >= maxAP) {
            apTip = 'AP is full — spend it before it goes to waste.';
        } else if (currentAP <= 2) {
            apTip = 'AP is low. Choose your next move carefully.';
        } else {
            apTip = 'Spend AP on purges, decrees, and crackdowns.';
        }

        el.innerHTML = `
        <div class="parties-page">
        <div class="autocracy-top-row">
        <div class="my-party-card" style="border-left-color:${partyColor}; max-width: 420px; flex: 1 1 0;">
            <div class="my-party-top-row">
                <div class="my-party-logo" style="color:${partyColor}">
                    ${logoSvg}
                </div>
                <div class="my-party-identity">
                    <div class="my-party-name-row">
                        <span class="my-party-name" style="color:${partyColor}">${f.faction_name}</span>
                        ${abbr}
                    </div>
                    <div class="my-party-role-row">
                        ${roleBadge}
                    </div>
                    <div class="my-party-ideology-row">
                        ${ideologyTags}
                    </div>
                </div>
            </div>

            <div class="my-party-stats">
                <div class="my-party-stat">
                    <div class="stat-label">${myArchetype.label}</div>
                    <div class="stat-val">${leaderName}, ${leaderAge}</div>
                    <div class="stat-sublabel">${myArchetype.desc}</div>
                </div>
                <div class="my-party-stat">
                    <div class="stat-label">Seats</div>
                    <div class="stat-val">${mySeats} / ${GAME_CONFIG.TOTAL_SEATS}</div>
                </div>
                <div class="my-party-stat">
                    <div class="stat-label">In Power Since</div>
                    <div class="stat-val">${founded}</div>
                </div>
            </div>
        </div>
        ${standingHTML}
        <div class="ap-panel">
            <div class="ap-header">Action Points</div>
            <div class="ap-score-row">
                <span class="ap-value">${currentAP}</span>
                <span class="ap-max">/ ${maxAP}</span>
            </div>
            <div class="ap-bar-track">
                <div class="ap-bar-fill" style="width:${apPct}%;background:${partyColor}"></div>
            </div>
            <div class="ap-tip">${apTip}</div>
            <div class="ap-treasury">
                <span class="ap-treasury-label">Treasury</span>
                <span class="ap-treasury-value">${treasuryFmt}</span>
            </div>
        </div>
        </div>
        </div>
        `;
        return;
    }

    // Fetch all parties for seat + vote share data
    const { data: allParties } = await _supabase
        .from('factions')
        .select('id, faction_name, abbreviation, seats, national_vote_share, party_color, party_logo, leader_first_name, leader_last_name, leader_age, founded_tick, ideology_value_1, ideology_value_2')
        .eq('nation_id', n.id)
        .eq('faction_type', 'party');

    // Load ideology data for all parties
    const nationIdeologies = await loadNationIdeologies(_supabase, n.id);
    const ideoByFaction = {};
    for (const row of (nationIdeologies || [])) {
        ideoByFaction[row.faction_id] = row;
    }

    const seatData = await loadSeats(_supabase, n.id, false, allParties || [], f.id);
    const mySeats = seatData.currentSeats || 0;

    const coalition = await fetchActiveCoalition(_supabase, n.id);

    // Fetch next scheduled election
    const { data: nextElection } = await _supabase
        .from('elections').select('election_tick')
        .eq('nation_id', n.id).eq('status', 'scheduled')
        .gt('election_tick', currentShard?.current_tick || 0)
        .order('election_tick', { ascending: true }).limit(1).maybeSingle();

    // Fetch momentum data for all parties
    const allPartyIds = (allParties || []).map(p => p.id);
    const { data: allBlocApprovals } = await _supabase
        .from('faction_bloc_approval')
        .select('faction_id, momentum, bloc_id, approval, preference_score')
        .in('faction_id', allPartyIds);

    const { data: blocs } = await _supabase
        .from('voter_blocs')
        .select('id, bloc_name, population_weight, priority_issues, axis_liberty_equality, axis_tradition_progress, axis_security_freedom, axis_globalism_nationalism, axis_individualism_collectivism')
        .eq('nation_id', n.id)
        .eq('is_active', true);

    const blocWeights = {};
    for (const b of (blocs || [])) blocWeights[b.id] = b.population_weight || 1;

    // Compute weighted-average momentum per party
    const partyMomentum = {};
    for (const row of (allBlocApprovals || [])) {
        if (!partyMomentum[row.faction_id]) partyMomentum[row.faction_id] = { wSum: 0, wTotal: 0 };
        const w = blocWeights[row.bloc_id] || 1;
        partyMomentum[row.faction_id].wSum += (row.momentum || 0) * w;
        partyMomentum[row.faction_id].wTotal += w;
    }
    const partyScores = allPartyIds.map(id => {
        const m = partyMomentum[id];
        const raw = m && m.wTotal > 0 ? m.wSum / m.wTotal : 0;
        return { id, score: Math.round(Math.max(0, Math.min(100, 50 + raw))) };
    }).sort((a, b) => b.score - a.score);

    const myEntry = partyMomentum[f.id];
    const rawMomentum = myEntry && myEntry.wTotal > 0 ? myEntry.wSum / myEntry.wTotal : 0;
    const momentumScore = Math.round(Math.max(0, Math.min(100, 50 + rawMomentum)));
    const decayPerTick = Math.round(Math.abs(rawMomentum) * 0.20 * 10) / 10;
    const momentumRank = partyScores.findIndex(p => p.id === f.id) + 1;
    const totalParties = partyScores.length;
    const role = getPartyRole(f.id, mySeats, coalition);
    const badgeClass = getRoleBadgeClass(role);

    const partyColor = f.party_color || '#ffcc00';
    const logoSvg = getPartyIconSVG(f.party_logo, 44, partyColor);
    const treasury = formatCurrency(f.party_funds || 0);
    const founded = tickToDate(f.founded_tick);
    const leaderName = f.leader_first_name && f.leader_last_name
        ? f.leader_first_name + ' ' + f.leader_last_name + (f.leader_age ? ', ' + f.leader_age : '')
        : '—';
    const ideologyTags = buildIdeologyTags(f);
    const abbr = f.abbreviation ? `<span class="my-party-abbr">(${f.abbreviation})</span>` : '';

    // Build projected vote share bars via election simulation
    const partyLookup = {};
    for (const p of (allParties || [])) partyLookup[p.id] = p;

    let parties = [];
    try {
        const preview = await runElectionPreview(_supabase, n.id);
        parties = (preview.results || []).map(r => ({
            id: r.party_id,
            share: r.vote_percentage || 0,
            abbreviation: partyLookup[r.party_id]?.abbreviation || null,
            party_color: partyLookup[r.party_id]?.party_color || '#666',
            faction_name: r.party_name
        }));
    } catch (e) {
        console.warn('Election preview unavailable:', e.message);
        parties = (allParties || []).map(p => ({
            ...p, share: p.national_vote_share || 0
        }));
    }
    parties.sort((a, b) => b.share - a.share);
    const maxShare = Math.max(...parties.map(p => p.share), 1);

    let voteBarsHtml = '';
    for (const p of parties) {
        const pct = p.share.toFixed(1);
        const barW = (p.share / maxShare) * 100;
        const color = p.party_color || '#666';
        const isMe = p.id === f.id;
        const label = p.abbreviation || p.faction_name;
        voteBarsHtml += `
            <div class="vote-bar-row${isMe ? ' vote-bar-mine' : ''}">
                <span class="vote-bar-label">${label}</span>
                <div class="vote-bar-track">
                    <div class="vote-bar-fill" style="width:${barW}%;background:${color}"></div>
                </div>
                <span class="vote-bar-pct">${pct}%</span>
            </div>`;
    }

    const nextElectionDate = nextElection ? tickToDate(nextElection.election_tick) : '—';

    // === Approval by Voter Bloc (compute data) ===
    const blocLookup = {};
    for (const b of (blocs || [])) blocLookup[b.id] = b;

    const approvalByBloc = {};
    for (const row of (allBlocApprovals || [])) {
        if (!approvalByBloc[row.bloc_id]) approvalByBloc[row.bloc_id] = {};
        approvalByBloc[row.bloc_id][row.faction_id] = row.preference_score ?? row.approval ?? 0;
    }

    const blocRows = (blocs || []).map(b => {
        const myApproval = approvalByBloc[b.id]?.[f.id] ?? 0;
        let leaderId = null;
        let leaderApproval = -1;
        for (const pid of allPartyIds) {
            const a = approvalByBloc[b.id]?.[pid] ?? 0;
            if (a > leaderApproval) { leaderApproval = a; leaderId = pid; }
        }
        const leaderParty = partyLookup[leaderId];
        const isLeading = leaderId === f.id;
        const margin = leaderApproval - myApproval;
        return {
            blocId: b.id,
            blocName: b.bloc_name,
            popWeight: b.population_weight || 0,
            myApproval,
            leaderId,
            leaderAbbr: leaderParty?.abbreviation || '?',
            leaderColor: leaderParty?.party_color || '#666',
            isLeading,
            margin
        };
    }).sort((a, b) => b.myApproval - a.myApproval);

    const blocsLeading = blocRows.filter(r => r.isLeading);
    const leadingCount = blocsLeading.length;
    const leadingPopPct = Math.round(blocsLeading.reduce((s, r) => s + r.popWeight, 0));
    const swingBlocs = blocRows.filter(r => !r.isLeading && r.margin <= 3);

    // === Performance Credit ===
    const MINISTRY_NAMES = {
        prime_minister: 'Prime Minister', interior: 'Interior', foreign: 'Foreign',
        defense: 'Defense', finance: 'Finance', education: 'Education',
        healthcare: 'Healthcare', labor: 'Labor', justice: 'Justice',
        transportation: 'Transportation', security: 'Security'
    };

    // Fetch ministries held by our party
    const { data: myMinistries } = await _supabase
        .from('ministries')
        .select('ministry_key')
        .eq('nation_id', n.id)
        .eq('party_id', f.id)
        .eq('is_active', true);

    // Check if we're PM
    const isPM = coalition && coalition.lead_party_id === f.id;

    const heldKeys = new Set((myMinistries || []).map(m => m.ministry_key));
    if (isPM) heldKeys.add('prime_minister');
    const heldMinistryCount = heldKeys.size;

    // Build stat-to-trend data if we hold ministries
    let trendingWell = [];
    let trendingBadly = [];
    let trendingFlat = [];
    let swingWarnings = [];

    if (heldMinistryCount > 0) {
        // Fetch previous tick stats
        const currentTick = currentShard?.current_tick || 0;
        let prevStats = null;
        if (currentTick > 0) {
            const { data: histRow } = await _supabase
                .from('nations_history')
                .select('*')
                .eq('nation_id', n.id)
                .eq('tick', currentTick - 1)
                .single();
            prevStats = histRow;
        }

        // Find all stats we're responsible for
        const myStats = [];
        for (const [statKey, ministryKey] of Object.entries(STAT_TO_MINISTRY)) {
            if (heldKeys.has(ministryKey)) myStats.push(statKey);
        }

        // Compute trends
        const FLAT_THRESHOLD = 0.15;
        for (const statKey of myStats) {
            const current = n[statKey];
            const prev = prevStats ? prevStats[statKey] : null;
            if (current == null) continue;

            const sign = statDirectionSign(statKey);
            if (sign === 0) continue;

            const rawDelta = (prev != null) ? current - prev : 0;
            const improvement = rawDelta * sign; // positive = getting better

            const label = statKey.replace(/_/g, ' ');
            if (Math.abs(rawDelta) < FLAT_THRESHOLD) {
                trendingFlat.push({ statKey, label });
            } else if (improvement > 0) {
                trendingWell.push({ statKey, label, arrow: sign > 0 ? '▲' : '▼' });
            } else {
                trendingBadly.push({ statKey, label, arrow: sign > 0 ? '▼' : '▲' });
            }
        }

        // Build campaign actions
        let campaignActionsHTML = '';
        const lastPollData = null;   // TODO: fetch from campaign_actions when poll feature is implemented
        const previousPollData = null;

    // === Action Points Panel ===
    const currentAP = Math.min(f.action_points || 0, GAME_CONFIG.MAX_AP);

    // === Approval by Voter Bloc (build HTML) ===
    const totalEligible = n.eligible_voters || 0;
    function compactNum(v) {

        if (v >= 1_000) return (v / 1_000).toFixed(v >= 100_000 ? 0 : 1).replace(/\.0$/, '') + 'K';

    }

    let blocTableHtml = '';
    for (const r of blocRows) {

        const voters = compactNum(totalEligible * (r.popWeight / 100));
        blocTableHtml += `
            <div class="bloc-row${r.isLeading ? ' bloc-row-leading' : ''}">

    const swingText = swingBlocs.length > 0
        ? `Swing Blocs (within 3%): ${swingBlocs.map(r => r.blocName).join(', ')}`
        : 'No swing blocs';

    // === Build Other Parties Cards (segmented by Governing / Opposition) ===
    const otherParties = (allParties || []).filter(p => p.id !== f.id);
    let otherPartiesHtml = '';
    if (otherParties.length > 0) {
        const govParties = [];
        const oppParties = [];
        for (const op of otherParties) {
            const opSeats = seatData.allPartySeats[op.id] || 0;
            const opRole = getPartyRole(op.id, opSeats, coalition);
            if (opRole.includes('Governing')) {
                govParties.push({ ...op, _seats: opSeats, _role: opRole });
            } else {
                oppParties.push({ ...op, _seats: opSeats, _role: opRole });

        }

        function buildOtherPartyCards(list) {
            let html = '';
            for (const op of list) {
                const opColor = op.party_color || '#666';
                const opLogo = getPartyIconSVG(op.party_logo, 36, opColor);
                const opBadgeClass = getRoleBadgeClass(op._role);
                const opLeader = op.leader_first_name && op.leader_last_name

                const opFounded = tickToDate(op.founded_tick);
                const opIdeology = buildIdeologyTags(op);
                const opAbbr = op.abbreviation
                    ? `<span class="other-party-abbr">(${op.abbreviation})</span>` : '';

                html += `
                <div class="other-party-card" style="border-left-color:${opColor}">
                    <div class="other-party-top-row">
                        <div class="other-party-logo" style="color:${opColor}">${opLogo}</div>

                                <span class="other-party-name" style="color:${opColor}">${op.faction_name}</span>

                            </div>
                            <div class="other-party-role-row">

            <div class="bloc-table-header">

                <span class="bloc-bar-track-header"></span>
                <span class="bloc-approval">Your Approval</span>
                <span class="bloc-change">Change</span>

            <div class="bloc-table-body">

            <div class="bloc-approval-footer">

        <div class="actions-row">
            <div id="rally-container"></div>

        </div>

            <div id="fundraiser-container"></div>
        </div>

        <div id="promises-container"></div>

        ${otherPartiesHtml}

        ${ideologyComparisonHtml}

        </div>
    `;

    // ── Ideology Comparison: chip toggle logic ──
    const ideoSection = document.getElementById('ideology-section');
    if (ideoSection) {
        const selector = document.getElementById('ideology-party-selector');
        const chartEl = document.getElementById('ideology-chart');

        function rebuildIdeologyChart() {
            const selectedChips = selector.querySelectorAll('.ideology-party-chip.selected');
            const selectedIds = [...selectedChips].map(c => c.dataset.factionId);

            let axesHtml = '';
            for (const axis of IDEOLOGY_AXES) {
                let dotsHtml = '<div class="ideo-axis-center"></div>';

                for (const fid of selectedIds) {
                    const ideo = ideoByFaction[fid];
                    if (!ideo) continue;
                    const party = (allParties || []).find(p => p.id === fid);
                    if (!party) continue;
                    const score = ideo[axis.key] || 0;
                    const position = 50 + (score / 2);
                    const color = party.party_color || '#666';
                    const isMe = fid === f.id;

                    dotsHtml += `
                        <div class="ideo-dot" style="left:${position}%;background:${color};${isMe ? 'z-index:5;' : ''}" data-faction-id="${fid}">
                            <div class="ideo-dot-tooltip">${party.faction_name}: ${score > 0 ? '+' : ''}${score}</div>
                        </div>`;
                }

                axesHtml += `
                <div class="ideo-axis">
                    <div class="ideo-axis-label left">${axis.leftLabel}</div>
                    <div class="ideo-axis-track" data-axis-key="${axis.key}">
                        ${dotsHtml}
                    </div>
                    <div class="ideo-axis-label right">${axis.rightLabel}</div>
                </div>`;
            }

            let summaryHtml = '';
            for (const fid of selectedIds) {
                const ideo = ideoByFaction[fid];
                if (!ideo) continue;
                const party = (allParties || []).find(p => p.id === fid);
                if (!party) continue;

                const profile = getFullIdeologyProfile(ideo);
                const nonCentrist = profile.filter(p => p.label !== 'Centrist');
                if (nonCentrist.length === 0) continue;

                summaryHtml += `
                    <div class="ideology-label-row">
                        <div class="ideology-label-swatch" style="background:${party.party_color || '#666'}"></div>
                        <span class="ideology-label-name">${party.faction_name}</span>

            chartEl.innerHTML = axesHtml + summaryHtml;

        selector.addEventListener('click', (e) => {
