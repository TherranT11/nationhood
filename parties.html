                    <span class="outreach-friction-clean">No opposed blocs \u2014 clean outreach</span>
                </div>`;
            }

            detailHtml = `
            <div class="outreach-detail-panel">
                <div class="outreach-detail-header">
                    <span class="outreach-detail-title">Outreach: ${escapeHtml(selectedBloc.bloc_name)}</span>
                    <span class="outreach-detail-approval">
                        <span class="outreach-detail-approval-label">Current approval:</span>
                        <span style="color:${outreachGetApprovalColor(selectedApproval)};font-weight:700">${selectedApproval}</span>
                    </span>
                </div>
                <div class="outreach-detail-body">
                    ${effectHtml}
                    ${ideoHtml}
                    ${frictionHtml}
                </div>
                <div class="outreach-execute-row">
                    <span class="outreach-execute-warn">Guaranteed result. No randomness, no headlines, no polarization.</span>
                    <button class="outreach-btn-execute" id="outreach-execute">Conduct Outreach \u2014 ${OUTREACH_CONFIG.AP_COST} AP</button>
                </div>
            </div>`;
        }

        // ─── Result card ───
        let resultHtml = '';
        if (outreachResult) {
            const effectRows = (outreachResult.effects || []).map(eff => {
                const valColor = eff.value > 0 ? '#4ade80' : eff.value < 0 ? '#ef4444' : '#6b6a5e';
                const valStr = eff.value > 0 ? '+' + eff.value : '' + eff.value;
                const isFriction = eff.value < 0;
                return `<div class="outreach-result-effect-row">
                    <span>${escapeHtml(eff.bloc)}${isFriction ? ' (friction)' : ''}</span>
                    <span style="color:${valColor};font-weight:700">${valStr}</span>
                </div>`;
            }).join('');

            resultHtml = `
            <div class="outreach-result-card">
                <div class="outreach-result-banner">
                    <span class="outreach-result-title">Outreach Complete</span>
                    <span class="outreach-result-dismiss" id="outreach-dismiss">Dismiss</span>
                </div>
                <div class="outreach-result-body">
                    <div class="outreach-result-flavor">Party organizers spent the week in ${escapeHtml((outreachResult.effects?.[0]?.bloc || 'local').toLowerCase())} communities \u2014 attending meetings, hearing concerns, building relationships. No cameras, no speeches. Just work.</div>
                    <div class="outreach-result-effects">
                        ${effectRows}
                        <div class="outreach-result-effect-row">
                            <span>Polarization</span>
                            <span style="color:#4ade80;font-weight:700">+0</span>
                        </div>
                        <div class="outreach-result-effect-row">
                            <span>Headline generated</span>
                            <span style="color:#6b6a5e;font-weight:700">None</span>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        // ─── Outreach history ───
        let historyHtml = '';
        if (outreachHistory.length > 0) {
            const historyRows = outreachHistory.map(r => {
                const res = r.result || {};
                const tick = r.tick_performed;
                const effect = res.diminished || 0;
                const frictionSummary = (res.effects || []).filter(e => e.value < 0).map(e => e.value + ' ' + (e.bloc || '').split(' ')[0]).join(', ');
                return `<div class="outreach-history-row">
                    <span class="outreach-history-tick">Tick ${tick}</span>
                    <span class="outreach-history-bloc">${escapeHtml(res.blocName || '?')}</span>
                    <span class="outreach-history-effect" style="color:#4ade80">+${effect}</span>
                    <span class="outreach-history-friction" style="color:${frictionSummary ? '#ef4444' : '#6b6a5e'}">${frictionSummary || 'No friction'}</span>
                </div>`;
            }).join('');

            historyHtml = `
            <div class="outreach-history">
                <div class="outreach-history-header">Outreach History</div>
                ${historyRows}
            </div>`;
        }

        container.innerHTML = `
            <div class="outreach-panel">
                <div class="outreach-header-row">
                    <div class="outreach-header-left">
                        <span class="outreach-title">Voter Outreach</span>
                        <span class="outreach-pill-safe">Safe</span>
                    </div>
                    <div class="outreach-header-right">
                        <span class="outreach-pill-cost">${OUTREACH_CONFIG.AP_COST} AP</span>
                    </div>
                </div>

                <div class="outreach-tagline">Guaranteed result \u00B7 No random outcomes \u00B7 No polarization \u00B7 No headlines \u00B7 Slow and steady</div>

                ${outreachedThisTick ? '<div class="outreach-cooldown">You have already conducted outreach this tick.</div>' : ''}
                ${!costOk && !outreachedThisTick ? '<div class="outreach-cooldown">Not enough AP (need ' + OUTREACH_CONFIG.AP_COST + ').</div>' : ''}

                ${resultHtml}

                <div class="outreach-bloc-select-header">
                    <span class="outreach-section-label">Select Target Bloc</span>
                    <span class="outreach-bloc-select-hint">Higher ideological alignment = stronger outreach effect</span>
                </div>
                <div class="outreach-bloc-grid">${blocCards}</div>

                ${detailHtml}
                ${historyHtml}
            </div>`;

        // Event listeners
        container.querySelectorAll('.outreach-bloc-card:not(.disabled)').forEach(card => {
            card.addEventListener('click', () => {
                outreachSelectedBloc = card.dataset.blocId;
                outreachResult = null;
                renderOutreach();
            });
        });

        const executeBtn = document.getElementById('outreach-execute');
        if (executeBtn) {
            executeBtn.addEventListener('click', async () => {
                executeBtn.disabled = true;
                executeBtn.textContent = 'Executing...';
                const tick = currentShard?.current_tick || 0;
                const result = await executeOutreach(_supabase, f.id, n.id, outreachSelectedBloc, tick);
                if (result.success) {
                    outreachResult = result;
                    renderOutreach();
                } else {
                    alert(result.error);
                    executeBtn.disabled = false;
                    executeBtn.textContent = 'Conduct Outreach \u2014 ' + OUTREACH_CONFIG.AP_COST + ' AP';
                }
            });
        }

        const dismissBtn = document.getElementById('outreach-dismiss');
        if (dismissBtn) {
            dismissBtn.addEventListener('click', () => {
                outreachResult = null;
                outreachSelectedBloc = null;
                renderParties(); // full refresh for AP update
            });
        }
    }

    renderOutreach();

    // ── Rally UI (bloc-targeted with outcome odds) ──
    let rallySelectedBloc = null;
    let rallyResult = null;

    // Fetch recent rallies for cooldown + rallied_recently count
    const { data: recentRallies } = await _supabase
        .from('campaign_actions')
        .select('tick_performed, result')
        .eq('party_id', f.id)
        .eq('action_type', 'rally')
        .gte('tick_performed', (currentShard?.current_tick || 0) - RALLY_CONFIG.COOLDOWN_WINDOW)
        .order('tick_performed', { ascending: false });

    const ralliedThisTick = (recentRallies || []).some(r => r.tick_performed === (currentShard?.current_tick || 0));

    // Fetch active crisis count + nation stats for weight modifiers
    const { count: rallyCrisisCount } = await _supabase
        .from('active_crises').select('id', { count: 'exact', head: true }).eq('nation_id', n.id);
    const rallyNationState = {
        polarization: Number(n.polarization ?? 0),
        civilUnrest: Number(n.civil_unrest ?? 0),
        stability: Number(n.stability ?? 50),
        crisisCount: rallyCrisisCount || 0,
    };

    function getBlocRalliedRecently(blocId) {
        return (recentRallies || []).filter(r => r.result?.blocId === blocId).length;
    }

    // Rally history from recent rallies
    const rallyHistory = (recentRallies || []).filter(r => r.result?.outcomeId).slice(0, 6);

    // Outcome color map
    const OUTCOME_COLORS = { rousing: '#4ade80', solid: '#22d3ee', low: '#facc15', gaffe: '#f97316', divisive: '#ef4444', counter: '#991b1b' };
    const OUTCOME_ICONS = { rousing: '\u2605', solid: '\u25CF', low: '\u25E6', gaffe: '\u26A0', divisive: '\u25C6', counter: '\u2715' };

    function getApprovalColor(val) {
        if (val >= 65) return '#4ade80';
        if (val >= 45) return '#facc15';
        if (val >= 30) return '#f97316';
        return '#ef4444';
    }

    function renderRally() {
        const container = document.getElementById('rally-container');
        if (!container) return;
        const costOk = currentAP >= RALLY_CONFIG.AP_COST;
        const canRally = costOk && !ralliedThisTick;

        // Build bloc approval lookup
        const myApprovals = {};
        for (const row of (allBlocApprovals || [])) {
            if (row.faction_id === f.id) myApprovals[row.bloc_id] = Math.round(row.preference_score || 0);
        }

        const selectedBloc = rallySelectedBloc ? (blocs || []).find(b => b.id === rallySelectedBloc) : null;
        const selectedApproval = selectedBloc ? (myApprovals[selectedBloc.id] || 50) : 0;
        const selectedRallied = selectedBloc ? getBlocRalliedRecently(selectedBloc.id) : 0;
        const selectedWeights = selectedBloc ? getRallyOutcomeWeights(selectedApproval, selectedRallied, rallyNationState) : null;
        const selectedRisk = selectedWeights ? getRallyRiskLevel(selectedWeights) : null;

        const RISK_COLORS = { safe: '#4ade80', moderate: '#facc15', risky: '#f97316', dangerous: '#ef4444' };

        // ─── Bloc selection grid ───
        const blocCards = (blocs || []).map(b => {
            const approval = myApprovals[b.id] || 50;
            const isSelected = rallySelectedBloc === b.id;
            const approvalColor = getApprovalColor(approval);
            const bRallied = getBlocRalliedRecently(b.id);
            const bWeights = getRallyOutcomeWeights(approval, bRallied, rallyNationState);
            const bRisk = getRallyRiskLevel(bWeights);
            const hasWarning = bRallied > 0 || approval < 30;
            const riskColor = RISK_COLORS[bRisk] || '#888';
            // Ideology pills
            const ideoPills = [];
            const AXIS_LABELS = [
                { key: 'axis_liberty_equality', left: 'Liberty', right: 'Equality' },
                { key: 'axis_tradition_progress', left: 'Tradition', right: 'Progress' },
                { key: 'axis_security_freedom', left: 'Security', right: 'Freedom' },
                { key: 'axis_globalism_nationalism', left: 'Globalism', right: 'Nationalism' },
                { key: 'axis_individualism_collectivism', left: 'Individualism', right: 'Collectivism' },
            ];
            for (const ax of AXIS_LABELS) {
                const val = b[ax.key] ?? 50;
                if (val < 40) ideoPills.push(ax.left);
                else if (val > 60) ideoPills.push(ax.right);
            }

            return `<div class="rally-bloc-card${isSelected ? ' selected' : ''}${!canRally ? ' disabled' : ''}" data-bloc-id="${b.id}">
                <div class="rally-bloc-card-top">
                    <span class="rally-bloc-card-name">${escapeHtml(b.bloc_name)}</span>
                    <span class="rally-bloc-card-approval" style="color:${approvalColor}">${approval}</span>
                </div>
                <div class="rally-bloc-card-bottom">
                    <span class="rally-bloc-card-pop">${Math.round(b.population_weight)}% electorate</span>
                    <span class="rally-bloc-card-risk">
                        ${hasWarning ? '<span style="color:#f97316;margin-right:3px">\u26A0</span>' : ''}
                        <span style="color:${riskColor}">${bRisk.charAt(0).toUpperCase() + bRisk.slice(1)}</span>
                    </span>
                </div>
                <div class="rally-bloc-card-bar"><div class="rally-bloc-card-bar-fill" style="width:${approval}%;background:${approvalColor}"></div></div>
            </div>`;
        }).join('');

        // ─── Detail panel (when bloc selected + no result showing) ───
        let detailHtml = '';
        if (selectedBloc && selectedWeights && !rallyResult) {
            const outcomeOrder = ['rousing', 'solid', 'low', 'gaffe', 'divisive', 'counter'];

            // Outcome probability bar
            const barSegments = outcomeOrder.map(key => {
                const pct = selectedWeights[key] || 0;
                if (pct < 2) return '';
                return `<div class="rally-outcome-bar-seg" style="width:${pct}%;background:${OUTCOME_COLORS[key]}" title="${RALLY_OUTCOMES.find(o=>o.id===key)?.name}: ${pct}%"></div>`;
            }).join('');

            const barLabels = outcomeOrder.map(key => {
                const pct = selectedWeights[key] || 0;
                const o = RALLY_OUTCOMES.find(o => o.id === key);
                return `<div class="rally-outcome-label"><div class="rally-outcome-dot" style="background:${OUTCOME_COLORS[key]}"></div><span class="rally-outcome-name">${o?.name || key}</span><span class="rally-outcome-pct" style="color:${OUTCOME_COLORS[key]}">${pct}%</span></div>`;
            }).join('');

            // Context modifiers
            const mods = [];
            if (selectedApproval > 60) mods.push({ label: 'High approval with bloc', effect: '\u2191 Rousing Success chance', color: '#4ade80' });
            if (selectedApproval < 30) mods.push({ label: 'Low approval with bloc', effect: '\u2191 Low Turnout, Gaffe chance', color: '#ef4444' });
            if (rallyNationState.crisisCount > 0) mods.push({ label: 'Active crisis', effect: '\u2191 Gaffe, Counter-Protest chance', color: '#ef4444' });
            if (rallyNationState.polarization > 60) mods.push({ label: 'High polarization (' + rallyNationState.polarization + ')', effect: '\u2191 Divisive Speech chance', color: '#f97316' });
            if (rallyNationState.civilUnrest > 40) mods.push({ label: 'Elevated civil unrest (' + rallyNationState.civilUnrest + ')', effect: '\u2191 Counter-Protest chance', color: '#ef4444' });
            if (selectedRallied > 0) mods.push({ label: 'Rallied this bloc ' + selectedRallied + 'x recently', effect: '\u2191 Gaffe chance (stale material)', color: '#f97316' });
            if (mods.length === 0) mods.push({ label: 'No adverse conditions', effect: 'Standard outcome weights', color: '#4ade80' });

            const modsHtml = mods.map(m => `<div class="rally-mod-row"><span style="color:${m.color}">${m.label}</span><span class="rally-mod-effect">${m.effect}</span></div>`).join('');

            // Outcome reference cards
            const outcomeCards = RALLY_OUTCOMES.map(o => {
                const pct = selectedWeights[o.id] || 0;
                const targetColor = o.targetMin >= 0 ? '#4ade80' : '#ef4444';
                const targetLabel = o.targetMin === o.targetMax ? (o.targetMin >= 0 ? '+' : '') + o.targetMin : (o.targetMin >= 0 ? '+' : '') + o.targetMin + ' to ' + (o.targetMax >= 0 ? '+' : '') + o.targetMax;
                let spillLabel = 'None';
                if (o.spilloverScope === 'adjacent') spillLabel = '+' + o.spillover + ' adjacent blocs';
                else if (o.spilloverScope === 'random_adjacent') spillLabel = o.spillover + ' random adjacent bloc';
                else if (o.spilloverScope === 'all_others') spillLabel = o.spillover + ' ALL other blocs';
                else if (o.spilloverScope === 'all') spillLabel = o.spillover + ' all blocs';
                const spillColor = o.spillover > 0 ? '#4ade80' : o.spillover < 0 ? '#ef4444' : '#6b6a5e';

                return `<div class="rally-outcome-card">
                    <div class="rally-outcome-card-top">
                        <span><span style="color:${OUTCOME_COLORS[o.id]}">${OUTCOME_ICONS[o.id]}</span> <span style="color:${OUTCOME_COLORS[o.id]};font-weight:700">${o.name}</span></span>
                        <span style="color:${OUTCOME_COLORS[o.id]};font-weight:700">${pct}%</span>
                    </div>
                    <div class="rally-outcome-card-detail">
                        Target: <span style="color:${targetColor}">${targetLabel}</span>
                        ${o.spilloverScope !== 'none' ? ' \u00B7 Spillover: <span style="color:' + spillColor + '">' + spillLabel + '</span>' : ''}
                        ${o.polarization > 0 ? ' \u00B7 Pol: <span style="color:#f97316">+' + o.polarization + '</span>' : ''}
                    </div>
                </div>`;
            }).join('');

            const riskColor = RISK_COLORS[selectedRisk] || '#888';

            detailHtml = `
            <div class="rally-detail-panel">
                <div class="rally-detail-header">
                    <div class="rally-detail-title-row">
                        <span class="rally-detail-title">Rally: ${escapeHtml(selectedBloc.bloc_name)}</span>
                        <span class="rally-risk-pill" style="background:${riskColor}15;color:${riskColor};border-color:${riskColor}33">${selectedRisk.charAt(0).toUpperCase() + selectedRisk.slice(1)}</span>
                    </div>
                    <div class="rally-detail-approval-row">
                        <span class="rally-detail-approval-label">Current approval:</span>
                        <span class="rally-detail-approval-val" style="color:${getApprovalColor(selectedApproval)}">${selectedApproval}</span>
                    </div>
                </div>
                <div class="rally-detail-body">
                    <div class="rally-section-label">Active Modifiers</div>
                    <div class="rally-mods">${modsHtml}</div>

                    <div class="rally-section-label" style="margin-top:14px">Outcome Odds</div>
                    <div class="rally-outcome-bar">${barSegments}</div>
                    <div class="rally-outcome-labels">${barLabels}</div>

                    <div class="rally-section-label" style="margin-top:14px">Possible Outcomes</div>
                    <div class="rally-outcome-grid">${outcomeCards}</div>

                    <div class="rally-execute-row">
                        <span class="rally-execute-warn">This action cannot be undone. Results are determined by weighted random roll.</span>
                        <button class="rally-btn-execute" id="rally-execute">Hold Rally \u2014 ${RALLY_CONFIG.AP_COST} AP</button>
                    </div>
                </div>
            </div>`;
        }

        // ─── Result card ───
        let resultHtml = '';
        if (rallyResult) {
            const outcome = RALLY_OUTCOMES.find(o => o.id === rallyResult.outcomeId);
            const oColor = OUTCOME_COLORS[rallyResult.outcomeId] || '#888';
            const oIcon = OUTCOME_ICONS[rallyResult.outcomeId] || '';

            const effectRows = (rallyResult.effects || []).map(eff => {
                const valColor = eff.value > 0 ? '#4ade80' : eff.value < 0 ? '#ef4444' : '#6b6a5e';
                const valStr = eff.value > 0 ? '+' + eff.value : '' + eff.value;
                return `<div class="rally-result-effect-row"><span>${escapeHtml(eff.bloc || eff.stat)}</span><span style="color:${valColor};font-weight:700">${valStr}</span></div>`;
            }).join('');

            resultHtml = `
            <div class="rally-result-card" style="border-color:${oColor}">
                <div class="rally-result-banner" style="background:linear-gradient(90deg, ${oColor}15, transparent);border-bottom-color:${oColor}33">
                    <div class="rally-result-banner-left">
                        <span style="color:${oColor};font-size:16px">${oIcon}</span>
                        <span style="color:${oColor};font-weight:700;font-size:16px">${outcome?.name || rallyResult.outcomeName}</span>
                    </div>
                    <span class="rally-result-dismiss" id="rally-dismiss">Dismiss</span>
                </div>
                <div class="rally-result-body">
                    <div class="rally-result-headline">"${escapeHtml(rallyResult.headline)}"</div>
                    <div class="rally-result-effects">${effectRows}</div>
                </div>
            </div>`;
        }

        // ─── Rally history ───
        let historyHtml = '';
        if (rallyHistory.length > 0) {
            const historyRows = rallyHistory.map(r => {
                const res = r.result || {};
                const oColor = OUTCOME_COLORS[res.outcomeId] || '#888';
                const tick = r.tick_performed;
                const effectSummary = (res.effects || []).filter(e => e.bloc).map(e => (e.value >= 0 ? '+' : '') + e.value + ' ' + e.bloc).join(', ');
                return `<div class="rally-history-row" style="border-left-color:${oColor}">
                    <span class="rally-history-tick">Tick ${tick}</span>
                    <span class="rally-history-outcome" style="color:${oColor}">${res.outcomeName || '?'}</span>
                    <span class="rally-history-headline">"${escapeHtml(res.headline || '')}"</span>
                    <span class="rally-history-effect" style="color:${effectSummary.startsWith('+') ? '#4ade80' : effectSummary.startsWith('-') ? '#ef4444' : '#6b6a5e'}">${effectSummary || ''}</span>
                </div>`;
            }).join('');

            historyHtml = `
            <div class="rally-history">
                <div class="rally-history-header">Rally History</div>
                ${historyRows}
            </div>`;
        }

        container.innerHTML = `
            <div class="rally-panel">
                <div class="rally-header-row">
                    <div class="rally-header-left">
                        <span class="rally-title">Hold a Rally</span>
                    </div>
                    <div class="rally-header-right">
                        ${rallyNationState.polarization > 60 ? '<span class="rally-header-stat"><span class="rally-header-stat-label">Polarization</span><span class="rally-header-stat-val" style="color:#f97316">' + rallyNationState.polarization + '</span></span>' : ''}
                        ${rallyNationState.crisisCount > 0 ? '<span class="rally-pill-crisis">Crisis Active</span>' : ''}
                        <span class="rally-pill-cost">${RALLY_CONFIG.AP_COST} AP</span>
                    </div>
                </div>

                ${ralliedThisTick ? '<div class="rally-cooldown">You have already held a rally this tick.</div>' : ''}
                ${!costOk && !ralliedThisTick ? '<div class="rally-cooldown">Not enough AP (need ${RALLY_CONFIG.AP_COST}).</div>' : ''}

                ${resultHtml}

                <div class="rally-bloc-select-header">
                    <span class="rally-section-label">Select Voter Bloc to Rally</span>
                    <span class="rally-bloc-select-hint">Your approval with the bloc affects outcome odds</span>
                </div>
                <div class="rally-bloc-grid">${blocCards}</div>

                ${detailHtml}
                ${historyHtml}
            </div>`;

        // Event listeners
        container.querySelectorAll('.rally-bloc-card:not(.disabled)').forEach(card => {
            card.addEventListener('click', () => {
                rallySelectedBloc = card.dataset.blocId;
                rallyResult = null;
                renderRally();
            });
        });

        const executeBtn = document.getElementById('rally-execute');
        if (executeBtn) {
            executeBtn.addEventListener('click', async () => {
                executeBtn.disabled = true;
                executeBtn.textContent = 'Executing...';
                const tick = currentShard?.current_tick || 0;
                const result = await executeRally(_supabase, f.id, n.id, rallySelectedBloc, tick);
                if (result.success) {
                    rallyResult = result;
                    renderRally();
                } else {
                    alert(result.error);
                    executeBtn.disabled = false;
                    executeBtn.textContent = 'Hold Rally \u2014 ' + RALLY_CONFIG.AP_COST + ' AP';
                }
            });
        }

        const dismissBtn = document.getElementById('rally-dismiss');
        if (dismissBtn) {
            dismissBtn.addEventListener('click', () => {
                rallyResult = null;
                rallySelectedBloc = null;
                renderParties(); // full refresh for AP update
            });
        }
    }

    renderRally();

    // ── Make Promise UI ──
    let pmShowCreator = false;
    let pmPromiseType = null;   // 'stat' | 'crisis'
    let pmSelectedStat = null;
    let pmSelectedCrisis = null;
    let pmResult = null;

    // Load active crises for the crisis selector
    const { data: activeCrises } = await _supabase
        .from('active_crises')
        .select('id, crisis_id, started_at_tick')
        .eq('nation_id', n.id);

    // Load crisis template info
    const crisisTemplateIds = (activeCrises || []).map(ac => ac.crisis_id);
    let crisisTemplateMap = {};
    if (crisisTemplateIds.length > 0) {
        const { data: crisisTemplates } = await _supabase
            .from('crisis_templates')
            .select('id, name, description')
            .in('id', crisisTemplateIds);
        for (const ct of (crisisTemplates || [])) crisisTemplateMap[ct.id] = ct;
    }

    const activeCrisesList = (activeCrises || []).map(ac => ({
        id: ac.id,
        templateId: ac.crisis_id,
        name: crisisTemplateMap[ac.crisis_id]?.name || 'Unknown Crisis',
        description: crisisTemplateMap[ac.crisis_id]?.description || '',
        ticksActive: Math.max(0, (currentShard?.current_tick || 0) - (ac.started_at_tick || 0)),
    }));

    // Build stat list for stat promise selector
    const promiseStatList = getPromiseableStats(n);

    // Load existing promises + active promise count
    const { data: allPromises } = await _supabase
        .from('fundraiser_promises')
        .select('*')
        .eq('party_id', f.id)
        .order('tick_created', { ascending: false });

    const activePromisesList = (allPromises || []).filter(p => p.status === 'active');
    const resolvedPromisesList = (allPromises || []).filter(p => p.status === 'fulfilled' || p.status === 'broken');
    const keptCount = resolvedPromisesList.filter(p => p.status === 'fulfilled').length;
    const brokenCount = resolvedPromisesList.filter(p => p.status === 'broken').length;

    // Track which stats already have active promises
    const activeStatKeys = new Set(activePromisesList.filter(p => p.demand_type === 'stat_target').map(p => p.conditions?.stat_key));
    const activeCrisisPromiseIds = new Set(activePromisesList.filter(p => p.demand_type === 'crisis_resolution').map(p => p.conditions?.crisis_id));

    function renderPromiseMaker() {
        const container = document.getElementById('promise-maker-container');
        if (!container) return;

        const canAffordAP = (f.action_points || 0) >= MAKE_PROMISE_CONFIG.AP_COST;
        const atLimit = activePromisesList.length >= MAKE_PROMISE_CONFIG.MAX_ACTIVE_PROMISES;
        const currentTick = currentShard?.current_tick || 0;
        const madePromiseThisTick = (allPromises || []).some(p => p.tick_created === currentTick);

        // Find affected blocs for the selected stat
        let affectedBlocNames = [];
        let selectedStatData = null;
        if (pmSelectedStat) {
            selectedStatData = promiseStatList.find(s => s.statKey === pmSelectedStat);
            for (const b of (blocs || [])) {
                const issues = b.priority_issues || [];
                for (const issue of issues) {
                    const catStats = ISSUE_CATEGORY_STATS[issue] || [];
                    if (catStats.includes(pmSelectedStat)) {
                        affectedBlocNames.push(b.bloc_name);
                        break;
                    }
                }
            }
        }

        // ── Promise Creator Panel ──
        let creatorHtml = '';
        if (pmShowCreator) {
            const crisisActive = pmPromiseType === 'crisis';
            const statActive = pmPromiseType === 'stat';

            // Crisis selector
            let crisisSelectorHtml = '';
            if (crisisActive) {
                if (activeCrisesList.length === 0) {
                    crisisSelectorHtml = '<div class="pm-empty">No active crises to resolve.</div>';
                } else {
                    crisisSelectorHtml = '<div class="pm-sub-label">Select Active Crisis</div><div class="pm-crisis-list">' +
                        activeCrisesList.map(c => {
                            const sel = pmSelectedCrisis === c.id;
                            const alreadyPromised = activeCrisisPromiseIds.has(c.id);
                            return `<div class="pm-crisis-row${sel ? ' selected' : ''}${alreadyPromised ? ' disabled' : ''}" data-crisis="${c.id}">
                                <div class="pm-crisis-top">
                                    <span class="pm-crisis-name${sel ? ' selected' : ''}">${escapeHtml(c.name)}</span>
                                    <span class="pm-crisis-ticks">${alreadyPromised ? 'Already promised' : 'Active ' + c.ticksActive + ' ticks'}</span>
                                </div>
                                <div class="pm-crisis-desc">${escapeHtml(c.description)}</div>
                            </div>`;
                        }).join('') + '</div>';
                }
            }

            // Stat selector
            let statSelectorHtml = '';
            if (statActive) {
                const statGrid = promiseStatList.map(s => {
                    const sel = pmSelectedStat === s.statKey;
                    const alreadyPromised = activeStatKeys.has(s.statKey);
                    const dirIcon = s.promiseDirection === 'increase' ? '▲' : '▼';
                    const dirColor = s.promiseDirection === 'increase' ? '#4ade80' : '#ef4444';
                    return `<div class="pm-stat-cell${sel ? ' selected' : ''}${alreadyPromised ? ' disabled' : ''}" data-stat="${s.statKey}">
                        <span class="pm-stat-cell-name${sel ? ' selected' : ''}">${s.label}</span>
                        <span class="pm-stat-cell-val">${Math.round(s.value)} <span style="color:${dirColor};font-size:0.7em">${dirIcon}</span></span>
                    </div>`;
                }).join('');

                let previewHtml = '';
                if (selectedStatData) {
                    const dir = selectedStatData.promiseDirection;
                    const targetVal = dir === 'increase'
                        ? Math.min(100, Math.round(selectedStatData.value + MAKE_PROMISE_CONFIG.STAT_DELTA))
                        : Math.max(0, Math.round(selectedStatData.value - MAKE_PROMISE_CONFIG.STAT_DELTA));

                    previewHtml = `
                        <div class="pm-preview">
                            <div class="pm-preview-header">
                                <span class="pm-preview-text">Promise to <span class="pm-hl-cyan">${dir === 'increase' ? 'increase' : 'decrease'} ${selectedStatData.label}</span> by ${MAKE_PROMISE_CONFIG.STAT_DELTA}</span>
                            </div>
                            <div class="pm-preview-stats">
                                <div class="pm-preview-stat">
                                    <span class="pm-preview-label">CURRENT</span>
                                    <span class="pm-preview-big">${Math.round(selectedStatData.value)}</span>
                                </div>
                                <span class="pm-preview-arrow">→</span>
                                <div class="pm-preview-stat">
                                    <span class="pm-preview-label">TARGET</span>
                                    <span class="pm-preview-big pm-hl-cyan">${targetVal}</span>
                                </div>
                                <div style="flex:1"></div>
                                <div class="pm-preview-stat">
                                    <span class="pm-preview-label">DEADLINE</span>
                                    <span class="pm-preview-deadline">1D24 + 6 ticks</span>
                                    <span class="pm-preview-label">(7–30 ticks)</span>
                                </div>
                            </div>
                            <div class="pm-affected">
                                <span class="pm-sub-label">Affected Voter Blocs</span>
                                <div class="pm-affected-list">
                                    ${affectedBlocNames.length > 0
                                        ? affectedBlocNames.map(b => '<span class="pm-bloc-pill">' + escapeHtml(b) + '</span>').join('')
                                        : '<span class="pm-no-blocs">No blocs prioritize this category</span>'}
                                </div>
                                ${affectedBlocNames.length > 0 ? '<div class="pm-immediate-bump">Immediate: +' + MAKE_PROMISE_CONFIG.APPROVAL_ON_PROMISE_STAT + ' approval with affected blocs on promise</div>' : ''}
                            </div>
                        </div>`;
                }

                statSelectorHtml = `
                    <div class="pm-sub-label">Select Stat to Address</div>
                    <div class="pm-stat-grid">${statGrid}</div>
                    ${previewHtml}`;
            }

            // Consequences preview
            let consequencesHtml = '';
            if (pmSelectedCrisis || pmSelectedStat) {
                const bumpText = pmPromiseType === 'crisis'
                    ? 'Minor approval bump with all blocs on promise'
                    : 'Moderate approval bump with affected blocs on promise';
                consequencesHtml = `
                    <div class="pm-consequences">
                        <span class="pm-sub-label">Consequences</span>
                        <div class="pm-consequence-list">
                            <div class="pm-consequence"><span class="pm-c-up">▲</span> ${bumpText}</div>
                            <div class="pm-consequence"><span class="pm-c-up">▲</span> If kept: <span class="pm-hl-green">+${MAKE_PROMISE_CONFIG.APPROVAL_IF_KEPT} approval</span> with promised blocs</div>
                            <div class="pm-consequence"><span class="pm-c-down">▼</span> If governing &amp; unfulfilled: <span class="pm-hl-red">−1D3 approval/tick</span> with promised blocs</div>
                            <div class="pm-consequence"><span class="pm-c-down">▼</span> If broken: <span class="pm-hl-red">approval loss</span> — rebuild rapport by holding rallies</div>
                            <div class="pm-consequence"><span class="pm-c-down">▼</span> Not in coalition? Promise expires automatically</div>
                        </div>
                    </div>`;
            }

            creatorHtml = `
                <div class="pm-creator">
                    <div class="pm-creator-header">
                        <span class="pm-creator-title">Make a Promise</span>
                        <span class="pm-creator-close" id="pm-close-creator">✕</span>
                    </div>
                    <div class="pm-type-btns">
                        <div class="pm-type-btn${crisisActive ? ' crisis-active' : ''}" data-type="crisis">
                            <span class="pm-type-label${crisisActive ? ' crisis-active' : ''}">Solve a Crisis</span>
                            <span class="pm-type-desc">Minor bump with all believing blocs</span>
                        </div>
                        <div class="pm-type-btn${statActive ? ' stat-active' : ''}" data-type="stat">
                            <span class="pm-type-label${statActive ? ' stat-active' : ''}">Address an Issue</span>
                            <span class="pm-type-desc">Moderate bump with blocs who care about that stat</span>
                        </div>
                    </div>
                    ${crisisSelectorHtml}
                    ${statSelectorHtml}
                    ${consequencesHtml}
                    <div class="pm-submit-row">
                        <button class="pm-btn pm-btn-cancel" id="pm-cancel">Cancel</button>
                        <button class="pm-btn pm-btn-submit${(!pmSelectedCrisis && !pmSelectedStat) ? ' disabled' : ''}" id="pm-submit" ${(!pmSelectedCrisis && !pmSelectedStat) ? 'disabled' : ''}>Make Promise — ${MAKE_PROMISE_CONFIG.AP_COST} AP</button>
                    </div>
                </div>`;
        }

        // ── Result card ──
        let resultHtml = '';
        if (pmResult) {
            const r = pmResult;
            const effectsHtml = r.blocEffects.map(e =>
                '<div class="pm-result-effect">' + escapeHtml(e.blocName) + ': +' + e.delta + ' (' + e.oldPref + ' → ' + e.newPref + ')</div>'
            ).join('') || '<div class="pm-result-effect">No approval changes.</div>';

            resultHtml = `
                <div class="pm-result-card">
                    <div class="pm-result-title">${escapeHtml(r.headline)}</div>
                    <div class="pm-result-meta">
                        <span class="pm-pill pm-pill-${r.promiseType === 'crisis' ? 'red' : 'cyan'}">${r.promiseType === 'crisis' ? 'Crisis' : 'Stat'}</span>
                        <span class="pm-result-deadline">Deadline: ${r.deadlineTicks} ticks (Tick ${r.tickDeadline})</span>
                    </div>
                    <div class="pm-result-effects-label">Immediate Approval Effects</div>
                    ${effectsHtml}
                    <div class="pm-result-ap">AP: ${r.newAp + MAKE_PROMISE_CONFIG.AP_COST} → ${r.newAp}</div>
                    <div class="pm-submit-row">
                        <button class="pm-btn pm-btn-cancel" id="pm-dismiss">DISMISS</button>
                    </div>
                </div>`;
        }

        // ── Active Promises List ──
        let activeHtml = '';
        if (activePromisesList.length > 0) {
            activeHtml = activePromisesList.map(p => {
                const isCrisis = p.demand_type === 'crisis_resolution';
                const cond = p.conditions || {};
                const prog = p.progress || {};
                const remaining = p.tick_deadline - currentTick;
                const elapsed = currentTick - p.tick_created;
                const total = p.deadline_ticks || 1;
                const timePct = Math.min(100, Math.round((elapsed / total) * 100));

                let timeColor = '#4ade80';
                if (remaining <= 3) timeColor = '#ef4444';
                else if (remaining <= 6) timeColor = '#f97316';
                else if (remaining <= 10) timeColor = '#facc15';

                let statusLabel = 'IN PROGRESS';
                let statusColor = 'yellow';
                if (remaining <= Math.ceil(total * 0.25)) {
                    statusLabel = 'AT RISK';
                    statusColor = 'orange';
                }

                let progressBarHtml = '';
                if (!isCrisis && cond.stat_key) {
                    const cur = Number(n[cond.stat_key] ?? cond.baseline_value ?? 50);
                    const tgt = cond.target_value;
                    const start = cond.baseline_value ?? cur;
                    const dir = cond.direction === 'below' ? 'decrease' : 'increase';
                    let pct;
                    if (dir === 'decrease') {
                        pct = start === tgt ? 100 : Math.max(0, Math.min(100, ((start - cur) / (start - tgt)) * 100));
                    } else {
                        pct = start === tgt ? 100 : Math.max(0, Math.min(100, ((cur - start) / (tgt - start)) * 100));
                    }
                    let barColor = '#22d3ee';
                    if (pct >= 100) barColor = '#4ade80';
                    else if (pct >= 60) barColor = '#22d3ee';
                    else if (pct >= 30) barColor = '#facc15';
                    else barColor = '#ef4444';

                    const statLabel = cond.stat_key.replace(/_/g, ' ');
                    progressBarHtml = `
                        <div class="pm-card-progress">
                            <div class="pm-card-progress-labels">
                                <span>${escapeHtml(statLabel)}: ${Math.round(cur)} → target ${tgt}</span>
                                <span>started at ${Math.round(start)}</span>
                            </div>
                            <div class="pm-bar-wrap">
                                <div class="pm-bar-track"><div class="pm-bar-fill" style="width:${Math.min(100, pct)}%;background:${barColor}"></div></div>
                                <span class="pm-bar-pct" style="color:${barColor}">${Math.round(pct)}%</span>
                            </div>
                        </div>`;
                }

                const penaltyAccum = prog.penalty_accumulated || 0;
                let penaltyHtml = penaltyAccum > 0
                    ? '<span class="pm-penalty">−' + penaltyAccum + ' accumulated penalty</span>'
                    : '<span class="pm-no-penalty">No penalties yet</span>';

                const blocNames = (p.bloc_name || '').split(', ').filter(Boolean);
                const borderLeftColor = statusColor === 'orange' ? '#f97316' : '#facc15';

                return `<div class="pm-card" style="border-left-color:${borderLeftColor}">
                    <div class="pm-card-top">
                        <div class="pm-card-left">
                            <span class="pm-pill pm-pill-${isCrisis ? 'red' : 'cyan'}">${isCrisis ? 'Crisis' : 'Stat'}</span>
                            <span class="pm-card-label">${escapeHtml(p.demand_text)}</span>
                        </div>
                        <span class="pm-pill pm-pill-${statusColor}">${statusLabel}</span>
                    </div>
                    ${progressBarHtml}
                    <div class="pm-card-time">
                        <div class="pm-card-time-labels">
                            <span>Promised Tick ${p.tick_created}</span>
                            <span>Deadline Tick ${p.tick_deadline}</span>
                        </div>
                        <div class="pm-bar-wrap">
                            <div class="pm-bar-track" style="height:3px"><div class="pm-bar-fill" style="width:${timePct}%;background:${timeColor}"></div></div>
                            <span class="pm-bar-pct" style="color:${timeColor};min-width:60px">${remaining > 0 ? remaining + ' ticks' : 'EXPIRED'}</span>
                        </div>
                    </div>
                    <div class="pm-card-bottom">
                        <div class="pm-card-blocs">${blocNames.map(b => '<span class="pm-bloc-tag">' + escapeHtml(b) + '</span>').join('')}</div>
                        <div class="pm-card-penalty">${penaltyHtml}</div>
                    </div>
                </div>`;
            }).join('');
        }

        // ── Resolved Promises ──
        let resolvedHtml = '';
        if (resolvedPromisesList.length > 0) {
            resolvedHtml = resolvedPromisesList.slice(0, 5).map(p => {
                const isKept = p.status === 'fulfilled';
                const statusLabel = isKept ? 'KEPT' : 'BROKEN';
                const statusColor = isKept ? 'green' : 'red';
                const borderColor = isKept ? '#4ade80' : '#ef4444';
                const isCrisis = p.demand_type === 'crisis_resolution';
                const prog = p.progress || {};
                const penaltyAccum = prog.penalty_accumulated || 0;
                const blocNames = (p.bloc_name || '').split(', ').filter(Boolean);

                return `<div class="pm-card pm-card-resolved" style="border-left-color:${borderColor}">
                    <div class="pm-card-top">
                        <div class="pm-card-left">
                            <span class="pm-pill pm-pill-${isCrisis ? 'red' : 'cyan'}">${isCrisis ? 'Crisis' : 'Stat'}</span>
                            <span class="pm-card-label">${escapeHtml(p.demand_text)}</span>
                        </div>
                        <span class="pm-pill pm-pill-${statusColor}">${statusLabel}</span>
                    </div>
                    <div class="pm-card-bottom">
                        <div class="pm-card-blocs">${blocNames.map(b => '<span class="pm-bloc-tag">' + escapeHtml(b) + '</span>').join('')}</div>
                        <div class="pm-card-penalty">
                            ${isKept
                                ? '<span class="pm-no-penalty">+' + MAKE_PROMISE_CONFIG.APPROVAL_IF_KEPT + ' approval reward applied</span>'
                                : '<span class="pm-penalty">−' + penaltyAccum + ' total penalty · approval lost</span>'}
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        // ── Assemble full panel ──
        container.innerHTML = `
            <div class="pm-panel">
                <div class="pm-header-row">
                    <span class="pm-title">Make Promise</span>
                    <span class="pm-cost">Cost: ${MAKE_PROMISE_CONFIG.AP_COST} AP</span>
                </div>
                <div class="pm-stats-row">
                    <div class="pm-stat-counter"><span class="pm-stat-counter-label">Kept</span><span class="pm-stat-counter-val pm-hl-green">${keptCount}</span></div>
                    <div class="pm-stat-counter"><span class="pm-stat-counter-label">Broken</span><span class="pm-stat-counter-val pm-hl-red">${brokenCount}</span></div>
                    <div class="pm-stat-counter"><span class="pm-stat-counter-label">Active</span><span class="pm-stat-counter-val pm-hl-yellow">${activePromisesList.length}</span></div>
                </div>

                ${pmResult ? resultHtml : (pmShowCreator ? creatorHtml : `
                    <button class="pm-open-creator-btn${(!canAffordAP || atLimit || madePromiseThisTick) ? ' disabled' : ''}" id="pm-open-creator" ${(!canAffordAP || atLimit || madePromiseThisTick) ? 'disabled' : ''}>
                        + Make a Promise
                    </button>
                    ${!canAffordAP ? '<div class="pm-warn">Not enough AP.</div>' : ''}
                    ${atLimit ? '<div class="pm-warn">Maximum active promises reached.</div>' : ''}
                    ${madePromiseThisTick ? '<div class="pm-warn">1 promise per tick. Wait for the next tick.</div>' : ''}
                `)}

                ${activePromisesList.length > 0 ? `
                    <div class="pm-section-header">
                        <span class="pm-section-title">Active Promises</span>
                        <span class="pm-section-note">Penalties tick while governing · Deadline = 1D24 + 6 ticks</span>
                    </div>
                    <div class="pm-card-list">${activeHtml}</div>
                ` : ''}

                ${resolvedPromisesList.length > 0 ? `
                    <div class="pm-section-header" style="margin-top:16px">
                        <span class="pm-section-title">Resolved Promises</span>
                        <span class="pm-section-note">Kept = +${MAKE_PROMISE_CONFIG.APPROVAL_IF_KEPT} approval · Broken = approval loss</span>
                    </div>
                    <div class="pm-card-list">${resolvedHtml}</div>
                ` : ''}

                <div class="pm-rules">
                    <span class="pm-rules-title">How Promises Work</span>
                    <div class="pm-rules-grid">
                        <div>
                            <div class="pm-rules-heading">On Making a Promise</div>
                            <div class="pm-rules-text">
                                Crisis promise → minor approval bump with all blocs<br>
                                Stat promise → moderate approval bump with affected blocs<br>
                                Direction is automatic — good stats increase, bad stats decrease<br>
                                Deadline: 1D24 + 6 ticks (7–30 ticks)
                            </div>
                        </div>
                        <div>
                            <div class="pm-rules-heading">While Governing</div>
                            <div class="pm-rules-text">
                                Every tick unfulfilled → 1D3 approval loss with promised blocs<br>
                                Promise kept → +${MAKE_PROMISE_CONFIG.APPROVAL_IF_KEPT} approval with promised blocs<br>
                                Deadline expires → approval loss, rebuild rapport via rallies<br>
                                Not in coalition → promise expires automatically
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;

        // ── Event listeners ──
        const openBtn = document.getElementById('pm-open-creator');
        if (openBtn) openBtn.addEventListener('click', () => { pmShowCreator = true; pmPromiseType = null; pmSelectedStat = null; pmSelectedCrisis = null; renderPromiseMaker(); });

        const closeBtn = document.getElementById('pm-close-creator');
        if (closeBtn) closeBtn.addEventListener('click', () => { pmShowCreator = false; renderPromiseMaker(); });

        const cancelBtn = document.getElementById('pm-cancel');
        if (cancelBtn) cancelBtn.addEventListener('click', () => { pmShowCreator = false; renderPromiseMaker(); });

        const dismissBtn = document.getElementById('pm-dismiss');
        if (dismissBtn) dismissBtn.addEventListener('click', () => { pmResult = null; renderParties(); });

        // Type buttons
        container.querySelectorAll('.pm-type-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const type = btn.dataset.type;
                pmPromiseType = type;
                if (type === 'crisis') { pmSelectedStat = null; }
                if (type === 'stat') { pmSelectedCrisis = null; }
                renderPromiseMaker();
            });
        });

        // Crisis rows
        container.querySelectorAll('.pm-crisis-row:not(.disabled)').forEach(row => {
            row.addEventListener('click', () => {
                pmSelectedCrisis = row.dataset.crisis;
                renderPromiseMaker();
            });
        });

        // Stat cells
        container.querySelectorAll('.pm-stat-cell:not(.disabled)').forEach(cell => {
            cell.addEventListener('click', () => {
                pmSelectedStat = cell.dataset.stat;
                renderPromiseMaker();
            });
        });

        // Submit button
        const submitBtn = document.getElementById('pm-submit');
        if (submitBtn && !submitBtn.disabled) {
            submitBtn.addEventListener('click', async () => {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Making Promise...';
                const tick = currentShard?.current_tick || 0;
                const params = pmPromiseType === 'crisis'
                    ? { crisisId: pmSelectedCrisis }
                    : { statKey: pmSelectedStat };
                const result = await executeMakePromise(_supabase, f.id, n.id, tick, pmPromiseType, params);
                if (result.success) {
                    pmResult = result;
                    pmShowCreator = false;
                    // Refresh promise lists
                    const { data: refreshed } = await _supabase
                        .from('fundraiser_promises').select('*')
                        .eq('party_id', f.id).order('tick_created', { ascending: false });
                    activePromisesList.length = 0;
                    resolvedPromisesList.length = 0;
                    for (const p of (refreshed || [])) {
                        if (p.status === 'active') activePromisesList.push(p);
                        else if (p.status === 'fulfilled' || p.status === 'broken') resolvedPromisesList.push(p);
                    }
                    activeStatKeys.clear();
                    activeCrisisPromiseIds.clear();
                    for (const p of activePromisesList) {
                        if (p.demand_type === 'stat_target') activeStatKeys.add(p.conditions?.stat_key);
                        if (p.demand_type === 'crisis_resolution') activeCrisisPromiseIds.add(p.conditions?.crisis_id);
                    }
                    renderPromiseMaker();
                } else {
                    alert(result.error);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Make Promise — ' + MAKE_PROMISE_CONFIG.AP_COST + ' AP';
                }
            });
        }
    }

    renderPromiseMaker();

    // ── Attack Campaign UI ──
    let attackSelectedTarget = null;
    let attackSelectedVector = null;
    let attackResult = null;
    let attackEvidenceCache = {}; // { factionId: evidence }

    // Fetch recent attacks for credibility calc
    const { data: recentAttackActions } = await _supabase
        .from('campaign_actions')
        .select('tick_performed, result')
        .eq('party_id', f.id)
        .eq('action_type', 'attack')
        .gte('tick_performed', (currentShard?.current_tick || 0) - ATTACK_CONFIG.COOLDOWN_WINDOW)
        .order('tick_performed', { ascending: false });

    const attackedThisTick = (recentAttackActions || []).some(r => r.tick_performed === (currentShard?.current_tick || 0));
    const attackCredibility = computeAttackCredibility((recentAttackActions || []).length);

    // Attack history
    const { data: attackHistory } = await _supabase
        .from('campaign_actions')
        .select('tick_performed, result')
        .eq('party_id', f.id)
        .eq('action_type', 'attack')
        .order('tick_performed', { ascending: false })
        .limit(6);

    // Rival parties (exclude self)
    const rivalParties = (allParties || []).filter(p => p.id !== f.id);

    const ATTACK_OUTCOME_COLORS = {
        devastating: '#4ade80', effective: '#22d3ee', glancing: '#facc15',
        backfire: '#f97316', mutual: '#ef4444',
    };
    const ATTACK_OUTCOME_ICONS = {
        devastating: '\u2726', effective: '\u25CF', glancing: '\u25E6',
        backfire: '\u26A0', mutual: '\u2715',
    };

    async function loadEvidenceForTarget(targetId) {
        if (attackEvidenceCache[targetId]) return attackEvidenceCache[targetId];
        const evidence = await gatherAttackEvidence(_supabase, targetId, n.id, currentShard?.current_tick || 0);
        attackEvidenceCache[targetId] = evidence;
        return evidence;
    }

    async function renderAttack() {
        const container = document.getElementById('attack-container');
        if (!container) return;
        const costOk = currentAP >= ATTACK_CONFIG.AP_COST;
        const canAttack = costOk && !attackedThisTick;

        // Build rival approval lookup
        const rivalApprovals = {};
        for (const row of (allBlocApprovals || [])) {
            if (!rivalApprovals[row.faction_id]) rivalApprovals[row.faction_id] = [];
            rivalApprovals[row.faction_id].push(row);
        }

        // Compute average approval per rival
        function avgApproval(fid) {
            const rows = rivalApprovals[fid] || [];
            if (rows.length === 0) return 50;
            const total = rows.reduce((s, r) => s + (r.preference_score || 0), 0);
            return Math.round(total / rows.length);
        }

        // Credibility bar color
        const credColor = attackCredibility > 60 ? '#4ade80' : attackCredibility > 30 ? '#facc15' : '#ef4444';

        // Get current coalition for governing status
        const activeCoalition = await fetchActiveCoalition(_supabase, n.id);
        const coalitionIds = new Set(activeCoalition?.party_ids || []);

        // ─── Target cards ───
        const targetCards = rivalParties.map(p => {
            const isSelected = attackSelectedTarget === p.id;
            const avg = avgApproval(p.id);
            const isGov = coalitionIds.has(p.id);
            const cached = attackEvidenceCache[p.id];
            const ammo = cached
                ? cached.broken_promises.length + cached.controversial_votes.length + (cached.is_governing ? cached.governance_record.length : 0)
                : null;
            const ammoColor = ammo === null ? '#6b6a5e' : ammo >= 2 ? '#4ade80' : ammo === 1 ? '#facc15' : '#ef4444';

            return `<div class="attack-target-card${isSelected ? ' selected' : ''}${!canAttack ? ' disabled' : ''}" data-target-id="${p.id}">
                <div class="attack-target-left">
                    <span class="attack-target-name">${escapeHtml(p.faction_name)}</span>
                    <span class="attack-target-pill">${p.seats || 0} seats</span>
                    ${isGov ? '<span class="attack-target-pill attack-pill-gov">Gov</span>' : ''}
                </div>
                <div class="attack-target-right">
                    ${ammo !== null ? `<div class="attack-target-ammo">
                        <span class="attack-target-ammo-label">Ammo:</span>
                        ${[0, 1, 2].map(i => `<div class="attack-ammo-dot${i < ammo ? ' filled' : ''}" style="${i < ammo ? 'background:' + ammoColor : ''}"></div>`).join('')}
                    </div>` : ''}
                    <span class="attack-target-approval">Avg: ${avg}</span>
                </div>
            </div>`;
        }).join('');

        // ─── Vector selection + detail (when target selected) ───
        let vectorHtml = '';
        if (attackSelectedTarget && !attackResult) {
            const evidence = attackEvidenceCache[attackSelectedTarget];
            const vectors = evidence ? buildAttackVectors(evidence) : [];
            const target = rivalParties.find(p => p.id === attackSelectedTarget);

            const vectorCards = vectors.map(v => {
                const isSelected = attackSelectedVector === v.id;
                const hasEvidence = v.evidence && v.evidence.length > 0;
                const isDisabled = v.evidence_required && !hasEvidence;
                const strengthColor = v.strength === 'strong' ? '#4ade80' : v.strength === 'moderate' ? '#facc15' : '#ef4444';
                const backfireLabel = v.strength === 'strong' ? 'Low' : v.strength === 'moderate' ? 'Med' : 'High';

                let evidenceHtml = '';
                if (isSelected && hasEvidence) {
                    const rows = v.evidence.map((e, i) => {
                        const text = e.text || e.bill || (e.stat + ' ' + e.change) || '?';
                        const detail = e.bloc || (e.stance === 'reject' ? 'Voted NO (' + e.outcome + ')' : e.stance === 'accept' ? 'Voted YES (' + e.outcome + ')' : '') || '';
                        return `<div class="attack-evidence-row">
                            <span class="attack-evidence-text">${escapeHtml(text)}</span>
                            ${detail ? '<span class="attack-evidence-detail">' + escapeHtml(detail) + '</span>' : ''}
                        </div>`;
                    }).join('');
                    evidenceHtml = `<div class="attack-evidence-section">
                        <span class="attack-evidence-label">Available Evidence</span>
                        ${rows}
                    </div>`;
                }

                return `<div class="attack-vector-card${isSelected ? ' selected' : ''}${isDisabled ? ' disabled' : ''}" data-vector-id="${v.id}">
                    <div class="attack-vector-top">
                        <div class="attack-vector-left">
                            <span class="attack-vector-icon${isSelected ? ' active' : ''}">${v.icon}</span>
                            <span class="attack-vector-name">${v.name}</span>
                            <span class="attack-strength-pill" style="background:${strengthColor}12;color:${strengthColor};border-color:${strengthColor}33">${v.strength} evidence</span>
                        </div>
                        <span class="attack-backfire-label">Backfire risk: ${backfireLabel}</span>
                    </div>
                    <span class="attack-vector-desc">${v.description}</span>
                    ${evidenceHtml}
                    ${isDisabled ? '<span class="attack-vector-disabled-msg">No evidence available \u2014 ' + v.name.toLowerCase() + ' requires factual basis</span>' : ''}
                </div>`;
            }).join('');

            // Outcome odds bar
            let oddsHtml = '';
            const selectedVec = vectors.find(v => v.id === attackSelectedVector);
            if (selectedVec) {
                const weights = getAttackOutcomeWeights(selectedVec.strength);
                const order = ['devastating', 'effective', 'glancing', 'backfire', 'mutual'];

                const barSegments = order.map(key => {
                    const pct = weights[key] || 0;
                    if (pct < 2) return '';
                    return `<div class="attack-outcome-bar-seg" style="width:${pct}%;background:${ATTACK_OUTCOME_COLORS[key]}" title="${ATTACK_OUTCOMES.find(o=>o.id===key)?.name}: ${pct}%"></div>`;
                }).join('');

                const barLabels = order.map(key => {
                    const pct = weights[key] || 0;
                    const o = ATTACK_OUTCOMES.find(o => o.id === key);
                    return `<div class="attack-outcome-label"><div class="attack-outcome-dot" style="background:${ATTACK_OUTCOME_COLORS[key]}"></div><span class="attack-outcome-name">${o?.name || key}</span><span class="attack-outcome-pct" style="color:${ATTACK_OUTCOME_COLORS[key]}">${pct}%</span></div>`;
                }).join('');

                oddsHtml = `
                <div class="attack-odds-section">
                    <span class="attack-section-label">Outcome Odds</span>
                    <div class="attack-outcome-bar">${barSegments}</div>
                    <div class="attack-outcome-labels">${barLabels}</div>
                </div>

                <div class="attack-consequences">
                    <span class="attack-section-label">Guaranteed Consequences</span>
                    <div class="attack-consequence-list">
                        <div class="attack-consequence-row"><span class="attack-warn-icon">\u26A0</span><span>Attack credibility drops <span style="color:#ef4444">\u221220%</span> (currently ${attackCredibility}%)</span></div>
                        <div class="attack-consequence-row"><span class="attack-warn-icon">\u26A0</span><span>Opens <span style="color:#ef4444">counter-attack window</span> \u2014 target can respond for 1 AP (3 ticks)</span></div>
                        <div class="attack-consequence-row"><span class="attack-warn-icon">\u26A0</span><span>Polarization <span style="color:#f97316">+1 to +2</span></span></div>
                    </div>
                </div>

                <div class="attack-execute-row">
                    <span class="attack-execute-warn">This action cannot be undone. The target will be notified and can counter-attack.</span>
                    <button class="attack-btn-execute" id="attack-execute">Launch Attack \u2014 ${ATTACK_CONFIG.AP_COST} AP</button>
                </div>`;
            }

            vectorHtml = `
            <div class="attack-vector-panel">
                <div class="attack-vector-header">
                    <span class="attack-vector-header-title">Attack: ${escapeHtml(target?.faction_name || '?')}</span>
                    <span class="attack-vector-header-hint">Select your angle of attack</span>
                </div>
                <div class="attack-vector-body">
                    <div class="attack-vector-list">${vectorCards}</div>
                    ${oddsHtml}
                </div>
            </div>`;
        }

        // ─── Result card ───
        let resultHtml = '';
        if (attackResult) {
            const outcome = ATTACK_OUTCOMES.find(o => o.id === attackResult.outcomeId);
            const oColor = ATTACK_OUTCOME_COLORS[attackResult.outcomeId] || '#888';
            const oIcon = ATTACK_OUTCOME_ICONS[attackResult.outcomeId] || '';

            const effectRows = (attackResult.effects || []).map(eff => {
                const valColor = eff.value > 0 ? '#4ade80' : eff.value < 0 ? '#ef4444' : '#6b6a5e';
                const valStr = eff.value > 0 ? '+' + eff.value : '' + eff.value;
                return `<div class="attack-result-effect-row"><span>${escapeHtml(eff.label)}</span><span style="color:${valColor};font-weight:700">${valStr}</span></div>`;
            }).join('');

            resultHtml = `
            <div class="attack-result-card" style="border-color:${oColor}">
                <div class="attack-result-banner" style="background:linear-gradient(90deg, ${oColor}15, transparent);border-bottom-color:${oColor}33">
                    <div class="attack-result-banner-left">
                        <span style="color:${oColor};font-size:16px">${oIcon}</span>
                        <span style="color:${oColor};font-weight:700;font-size:16px">${outcome?.name || attackResult.outcomeName}</span>
                    </div>
                    <span class="attack-result-dismiss" id="attack-dismiss">Dismiss</span>
                </div>
                <div class="attack-result-body">
                    <div class="attack-result-headline">"${escapeHtml(attackResult.headline)}"</div>
                    <div class="attack-result-effects">${effectRows}</div>
                    ${attackResult.opensCounter ? '<div class="attack-counter-warning">\u26A0 Target can now launch a Counter-Attack for 1 AP (3 tick window, +2 effectiveness bonus)</div>' : ''}
                </div>
            </div>`;
        }

        // ─── Attack history ───
        let historyHtml = '';
        if ((attackHistory || []).length > 0) {
            const historyRows = (attackHistory || []).map(r => {
                const res = r.result || {};
                const oColor = ATTACK_OUTCOME_COLORS[res.outcomeId] || '#888';
                const tick = r.tick_performed;
                const effectSummary = (res.effects || []).map(e => (e.value >= 0 ? '+' : '') + e.value + ' ' + (e.label || '').split(' ')[0]).join(', ');
                return `<div class="attack-history-row" style="border-left-color:${oColor}">
                    <span class="attack-history-tick">Tick ${tick}</span>
                    <span class="attack-history-target">vs ${escapeHtml(res.targetAbbrev || '?')}</span>
                    <span class="attack-history-outcome" style="color:${oColor}">${res.outcomeName || '?'}</span>
                    <span class="attack-history-headline">"${escapeHtml(res.headline || '')}"</span>
                    <span class="attack-history-effect">${effectSummary || ''}</span>
                </div>`;
            }).join('');

            historyHtml = `
            <div class="attack-history">
                <div class="attack-history-header">Attack History</div>
                ${historyRows}
            </div>`;
        }

        container.innerHTML = `
            <div class="attack-panel">
                <div class="attack-header-row">
                    <div class="attack-header-left">
                        <span class="attack-title">Attack Campaign</span>
                    </div>
                    <div class="attack-header-right">
                        <div class="attack-credibility">
                            <span class="attack-credibility-label">Attack Credibility</span>
                            <div class="attack-credibility-bar-wrap">
                                <div class="attack-credibility-bar">
                                    <div class="attack-credibility-fill" style="width:${attackCredibility}%;background:${credColor}"></div>
                                </div>
                                <span class="attack-credibility-val" style="color:${credColor}">${attackCredibility}%</span>
                            </div>
                        </div>
                        <span class="attack-pill-cost">${ATTACK_CONFIG.AP_COST} AP</span>
                    </div>
                </div>

                ${attackedThisTick ? '<div class="attack-cooldown">You have already launched an attack this tick.</div>' : ''}
                ${!costOk && !attackedThisTick ? '<div class="attack-cooldown">Not enough AP (need ' + ATTACK_CONFIG.AP_COST + ').</div>' : ''}

                ${resultHtml}

                <div class="attack-target-select-header">
                    <span class="attack-section-label">Select Target Party</span>
                    <span class="attack-target-hint">Parties with more ammunition are easier to attack</span>
                </div>
                <div class="attack-target-grid">${targetCards}</div>

                ${vectorHtml}
                ${historyHtml}
            </div>`;

        // ─── Event listeners ───
        container.querySelectorAll('.attack-target-card:not(.disabled)').forEach(card => {
            card.addEventListener('click', async () => {
                const tid = card.dataset.targetId;
                attackSelectedTarget = tid;
                attackSelectedVector = null;
                attackResult = null;
                // Load evidence if not cached
                await loadEvidenceForTarget(tid);
                renderAttack();
            });
        });

        container.querySelectorAll('.attack-vector-card:not(.disabled)').forEach(card => {
            card.addEventListener('click', () => {
                attackSelectedVector = card.dataset.vectorId;
                renderAttack();
            });
        });

        const executeBtn = document.getElementById('attack-execute');
        if (executeBtn) {
            executeBtn.addEventListener('click', async () => {
                executeBtn.disabled = true;
                executeBtn.textContent = 'Executing...';
                const tick = currentShard?.current_tick || 0;
                const result = await executeAttack(_supabase, f.id, n.id, attackSelectedTarget, attackSelectedVector, tick);
                if (result.success) {
                    attackResult = result;
                    renderAttack();
                } else {
                    alert(result.error);
                    executeBtn.disabled = false;
                    executeBtn.textContent = 'Launch Attack \u2014 ' + ATTACK_CONFIG.AP_COST + ' AP';
                }
            });
        }

        const dismissBtn = document.getElementById('attack-dismiss');
        if (dismissBtn) {
            dismissBtn.addEventListener('click', () => {
                attackResult = null;
                attackSelectedTarget = null;
                attackSelectedVector = null;
                renderParties(); // full refresh for AP update
            });
        }
    }

    renderAttack();
    } // end if(false) — old democracy actions disabled

    // Scroll to the section specified in the URL hash (from dashboard quick actions)
    if (window.location.hash) {
        const target = document.getElementById(window.location.hash.substring(1));
        if (target) {
            setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
        }
    }

}

// ── Ideology Section ──
async function renderIdeologySection() {
    const container = document.getElementById('ideology-container');
    if (!container || !currentNation || !ideologyAllParties) return;

    const ideologies = await loadNationIdeologies(_supabase, currentNation.id);
    const ideoMap = {};
    for (const row of (ideologies || [])) ideoMap[row.faction_id] = row;

    // Build party selector buttons — user's party first
    const sorted = [...ideologyAllParties].sort((a, b) => {
        if (a.id === currentFaction.id) return -1;
        if (b.id === currentFaction.id) return 1;
        return 0;
    });

    const selectedId = selectedIdeologyFactionId || currentFaction.id;
    const btnHtml = sorted.map(p => {
        const isActive = p.id === selectedId;
        const color = p.party_color || '#666';
        const star = p.id === currentFaction.id ? ' \u2605' : '';
        const activeStyle = isActive
            ? `border-color:${color}; color:${color};`
            : '';
        return `<button class="ideology-party-btn${isActive ? ' active' : ''}" data-fid="${p.id}" style="${activeStyle}">${p.abbreviation || p.faction_name}${star}</button>`;
    }).join('');

    // Build slider axes for selected faction
    const ideoRow = ideoMap[selectedId] || {};
    let axesHtml = '';
    const leanings = [];

    for (const axis of IDEOLOGY_AXES) {
        const score = ideoRow[axis.key] || 0;
        const absScore = Math.abs(score);
        const pct = ((score + 100) / 200) * 100; // -100→0%, 0→50%, +100→100%

        // Determine marker color: blend toward the side it leans
        const markerColor = score < 0 ? axis.leftColor : score > 0 ? axis.rightColor : '#888';

        axesHtml += `
            <div class="ideology-axis-row">
                <span class="ideology-axis-label ideology-axis-label-left" style="color:${axis.leftColor}">${axis.left}</span>
                <div class="ideology-track">
                    <div class="ideology-track-center"></div>
                    <div class="ideology-marker" style="left:${pct}%;background:${markerColor}">
                        <span class="ideology-marker-value">${absScore}</span>
                    </div>
                </div>
                <span class="ideology-axis-label ideology-axis-label-right" style="color:${axis.rightColor}">${axis.right}</span>
            </div>`;

        leanings.push(getIdeologyLabel(score, axis));
    }

    const leaningsHtml = leanings.map(l =>
        `<span class="ideology-leaning-item">${l}</span>`
    ).join(' <span style="color:var(--text-muted,#666)">\u00B7</span> ');

    container.innerHTML = `
        <div class="ideology-section">
            <div class="ideology-header">Ideology</div>
            <div class="ideology-party-selector">${btnHtml}</div>
            <div class="ideology-axes">${axesHtml}</div>
            <div class="ideology-leanings">${leaningsHtml}</div>
        </div>`;

    // Bind party selector clicks
    container.querySelectorAll('.ideology-party-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            selectedIdeologyFactionId = btn.dataset.fid;
            renderIdeologySection();
        });
    });
}

// Re-render ideology on tick advance
window.addEventListener('tick-advanced', () => {
    renderIdeologySection();
});

initPage('parties', async (state) => {
    const { nation, faction, shard } = state;
    currentFaction = faction;
    currentNation = nation;
    currentShard = shard;
    initGameConfigForNation(nation);
    await renderParties();
});
</script>
