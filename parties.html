<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Parties | Nationhood Alpha</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/parties.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="top-bar"></div>
<div id="content-area">
    <div class="loading-container">
        <div class="loading-spinner"></div>
        <div>Loading parties...</div>
    </div>
</div>
<script type="module">
import { _supabase } from './js/supabase-client.js';
import { initPage, qCache } from './js/common.js';

let currentFaction = null;
let currentNation = null;

async function renderParties() {
    const el = document.getElementById('content-area');
    el.innerHTML = '<p style="color:var(--text-muted);text-align:center;margin-top:40px;">Parties page — redesign in progress.</p>';
}

document.addEventListener('DOMContentLoaded', async () => {
    const ctx = await initPage();
    if (!ctx) return;
    currentFaction = ctx.faction;
    currentNation = ctx.nation;
    await renderParties();
});
</script>
</body>
</html>
