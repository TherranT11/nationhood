                <div class="stat-card"><div class="stat-label">Party Funds</div><div class="stat-value" id="party-funds">$${(f?.party_funds || 0).toLocaleString()}</div></div>
                <div class="stat-card"><div class="stat-label" title="Weighted average approval across all voter blocs">Approval Rating</div><div class="stat-value" id="party-approval">${f?._derivedApproval ?? f?.approval_rating ?? 0}%</div></div>
            </div>
            ${(() => {
                if (!blocs || blocs.length === 0 || !f) return '';
                const pollResult = lastPollData?.result;
                const prevResult = previousPollData?.result;
                const pollDate = lastPollData?.result?.poll_date || null;
                const polledBlocIds = pollResult?.bloc_results ? Object.keys(pollResult.bloc_results) : [];

                if (!pollResult) {
                    return `<div class="poll-panel">
                        <div class="poll-panel-header">
                            <div class="poll-panel-title">Poll for ${f.faction_name}</div>
                        </div>
                        <div class="poll-no-data">No polls conducted yet. Use <strong>Generate Poll</strong> to survey voter blocs.</div>
                    </div>`;
                }

                const blocRows = blocs.map(bloc => {
                    const polled = pollResult.bloc_results?.[bloc.id];
                    if (!polled) return `<div class="poll-bloc-unpolled">${bloc.bloc_name} — not polled</div>`;
                    const prev = prevResult?.bloc_results?.[bloc.id];
                    const color = polled.shown >= 55 ? '#4CAF50' : polled.shown <= 35 ? '#ff4444' : '#ff9800';
                    let deltaHTML = '';
                    if (prev) {
                        const diff = polled.shown - prev.shown;
                        if (diff > 0) deltaHTML = `<span class="poll-bloc-delta up">+${diff}</span>`;
                        else if (diff < 0) deltaHTML = `<span class="poll-bloc-delta down">${diff}</span>`;
                        else deltaHTML = `<span class="poll-bloc-delta flat">—</span>`;
                    }
                    return `<div class="poll-bloc-row">
                        <span class="poll-bloc-name">${bloc.bloc_name}</span>
                        <div class="poll-bloc-bar"><div class="poll-bloc-bar-fill" style="width:${polled.shown}%;background:${color};"></div></div>
                        <span class="poll-bloc-value" style="color:${color};">${polled.shown}%</span>
                        ${deltaHTML}
                    </div>`;
                }).join('');

                return `<div class="poll-panel">
                    <div class="poll-panel-header">
                        <div class="poll-panel-title">Poll for ${f.faction_name}</div>
                        <div class="poll-panel-date">${pollDate ? 'Conducted: ' + pollDate : ''}</div>
                    </div>
                    <div>${blocRows}</div>
                    <div class="poll-margin-note">± margin of error</div>
                </div>`;
            })()}
            <div id="poll-selector" class="poll-selector"></div>

            <div class="section-header" style="margin-top: 20px;">Party Actions</div>
            <div class="action-grid" style="grid-template-columns: repeat(2, 1fr); margin-bottom: 16px;">
                <div class="action-card">
                    <div class="action-header">
                        <div class="action-title">Generate Poll</div>
                        <div class="action-cost">2 AP + $25k/bloc</div>
                    </div>
                    <div class="action-desc">
                        Commission a poll to reveal your approval with selected voter blocs.
                        Results have a <strong>margin of error</strong>.
                        <br><span style="color: #888; font-size: 0.78rem;">Cooldown: 1 per 3 ticks.</span>
                    </div>
                    <button class="action-btn" id="btn-generate-poll" onclick="openPollSelector()">
                        Generate Poll
                    </button>
                </div>
                <div class="action-card">
                    <div class="action-header">
                        <div class="action-title">Build Coalition</div>
                        <div class="action-cost">3 AP + $200k</div>
                    </div>
                    <div class="action-desc">

                        <strong>Always a net negative overall</strong> — pandering sharpens your base, it doesn't grow it.
                        <br><span style="color: #888; font-size: 0.78rem;">Cooldown: 2 ticks (global). Diminishing returns per bloc within 10 ticks.</span>
                    </div>
                    <button class="action-btn" id="btn-build-coalition" onclick="openCoalitionPanel()">
                        Build Coalition
                    </button>
                </div>
            </div>
            <div id="coalition-panel" class="donor-panel"></div>

            <div class="section-header" style="margin-top: 20px;">Recent Actions</div>
            <div id="action-log" class="action-log"><div class="action-log-empty">No actions taken yet this campaign.</div></div>`;
    }

    // Build Performance Credit HTML
    let perfCreditHtml = '';
    if (heldMinistryCount === 0) {
        perfCreditHtml = `
            <div class="perf-panel">
                <div class="perf-header">Performance Credit</div>
                <div class="perf-empty">
                    <div class="perf-empty-label">Ministries: None</div>
                    <div class="perf-empty-msg">You earn no credit for stat improvements. Attack rivals who do, or negotiate your way into a coalition.</div>
                </div>
            </div>`;
    } else {
        const ministryList = [...heldKeys].map(k => MINISTRY_NAMES[k] || k).join(', ');
        let titleParts = [];
        if (isPM) titleParts.push('Prime Minister');
        const nonPM = [...heldKeys].filter(k => k !== 'prime_minister');
        if (nonPM.length > 0) titleParts.push(nonPM.map(k => MINISTRY_NAMES[k] || k).join(', '));
        const titleLine = titleParts.join(' + ');

        const MAX_TREND_ITEMS = 5;
        let trendsHtml = '';
        if (trendingWell.length > 0) {
            const shown = trendingWell.slice(0, MAX_TREND_ITEMS);
            const extra = trendingWell.length - shown.length;
            trendsHtml += `<div class="perf-trend-section">
                <div class="perf-trend-label perf-trend-good">Trending well:</div>
                ${shown.map(t => `<div class="perf-trend-item perf-trend-good">${t.arrow} ${t.label}</div>`).join('')}
                ${extra > 0 ? `<div class="perf-trend-item perf-trend-good">+ ${extra} more</div>` : ''}
            </div>`;
        }
        if (trendingBadly.length > 0) {
            const shown = trendingBadly.slice(0, MAX_TREND_ITEMS);
            const extra = trendingBadly.length - shown.length;
            trendsHtml += `<div class="perf-trend-section">
                <div class="perf-trend-label perf-trend-bad">Trending badly:</div>
                ${shown.map(t => `<div class="perf-trend-item perf-trend-bad">${t.arrow} ${t.label}</div>`).join('')}
                ${extra > 0 ? `<div class="perf-trend-item perf-trend-bad">+ ${extra} more</div>` : ''}
            </div>`;
        }
        if (trendingFlat.length > 0) {
            trendsHtml += `<div class="perf-trend-section">
                <div class="perf-trend-item perf-trend-flat">── ${trendingFlat.length} stat${trendingFlat.length !== 1 ? 's' : ''} flat</div>
            </div>`;
        }
        if (trendingWell.length === 0 && trendingBadly.length === 0 && trendingFlat.length === 0) {
            trendsHtml = '<div class="perf-trend-none">No trend data yet.</div>';
        }

        let warningsHtml = '';
        if (swingWarnings.length > 0) {
            warningsHtml = swingWarnings.map(w =>
                `<div class="perf-warning">⚠ ${w.stats.map(s => s.charAt(0).toUpperCase() + s.slice(1)).join(', ')} is hurting you with ${w.blocName} — a swing bloc.</div>`
            ).join('');
        }

        perfCreditHtml = `
            <div class="perf-panel perf-panel-active">
                <div class="perf-header">Performance Credit</div>
                <div class="perf-ministries">${titleLine}</div>
                <div class="perf-trends">${trendsHtml}</div>
                ${warningsHtml ? `<div class="perf-warnings">${warningsHtml}</div>` : ''}
            </div>`;
    }

    // === Action Points Panel ===
    const currentAP = Math.min(f.action_points || 0, GAME_CONFIG.MAX_AP);
    const maxAP = GAME_CONFIG.MAX_AP;
    const apPct = Math.round((currentAP / maxAP) * 100);
    const currentTick = currentShard?.current_tick || 0;
    const ticksUntilElection = nextElection ? nextElection.election_tick - currentTick : null;

    let apTip = '';
    if (ticksUntilElection !== null && ticksUntilElection <= 6) {
        apTip = `Election in ${ticksUntilElection} tick${ticksUntilElection !== 1 ? 's' : ''} — bank AP or campaign now.`;
    } else if (currentAP >= maxAP) {
        apTip = 'AP is full — spend it before it goes to waste.';
    } else if (currentAP <= 2) {
        apTip = 'AP is low. Choose your next move carefully.';
    } else {
        apTip = 'Spend AP on bills, campaigns, and ministry actions.';
    }

    // === Voter Bloc Approval Cards (build HTML) ===
    const totalEligible = n.eligible_voters || 0;

    // Categorize momentum_log sources into modifier types
    function classifySource(source) {
        if (!source) return { type: 'action', label: source || 'Unknown' };
        const s = source.toLowerCase();
        if (s.startsWith('bill:') || s.startsWith('penalty:no_vote')) return { type: 'legislation', label: formatSourceLabel(source) };
        if (s.startsWith('promise:')) return { type: 'legacy', label: formatSourceLabel(source) };
        if (s.startsWith('campaign:') || s.startsWith('rally')) return { type: 'action', label: formatSourceLabel(source) };
        if (s.startsWith('crisis:') || s.startsWith('event:')) return { type: 'performance', label: formatSourceLabel(source) };
        if (s.startsWith('election:') || s.startsWith('no_confidence') || s.startsWith('formation_failure') || s.startsWith('government_vacancy') || s.startsWith('early_election')) return { type: 'action', label: formatSourceLabel(source) };
        if (s.startsWith('pm_trait:') || s.startsWith('pm:')) return { type: 'performance', label: formatSourceLabel(source) };
        return { type: 'action', label: formatSourceLabel(source) };
    }
    function formatSourceLabel(source) {
        return source.replace(/[_:]/g, ' ').replace(/\b\w/g, c => c.toUpperCase()).trim();
    }

    // Build per-bloc modifier lists from momentum_log
    const blocModifiers = {}; // { blocId: [ { type, label, value, date } ] }
    for (const entry of (momentumLog || [])) {
        const targetBlocIds = entry.bloc_id ? [entry.bloc_id] : blocRows.map(r => r.blocId);
        const classified = classifySource(entry.source);
        const dateStr = tickToDate(entry.tick);
        for (const bid of targetBlocIds) {
            if (!blocModifiers[bid]) blocModifiers[bid] = [];
            blocModifiers[bid].push({
                type: classified.type,
                label: classified.label,
                value: Math.round(entry.amount * 10) / 10,
                date: dateStr
            });
        }
    }

    // Compute axis labels for each bloc
    function getBlocAxisLabels(axes) {
        const labels = [];
        for (const ax of IDEOLOGY_AXES) {
            const v = axes[ax.key] ?? 50;
            if (v < 40) labels.push(ax.leftLabel);
            else if (v > 60) labels.push(ax.rightLabel);
        }
        return labels;
    }

    // Approval color thresholds
    function vbaApprovalColor(val) {
        if (val >= 65) return '#4ade80';
        if (val >= 45) return '#facc15';
        if (val >= 30) return '#f97316';
        return '#ef4444';
    }
    function vbaModColor(val) {
        if (val > 0) return '#4ade80';
        if (val < 0) return '#ef4444';
        return '#6b6a5e';
    }
    function vbaFormatMod(val) { return val > 0 ? `+${val}` : `${val}`; }

    const modIcons = { ideology: '◆', performance: '▲', legislation: '§', action: '●', legacy: '★' };
    const modColors = { ideology: '#22d3ee', performance: '#60a5fa', legislation: '#facc15', action: '#8a8778', legacy: '#f97316' };

    // Build card HTML for each bloc
    let blocCardsHtml = '';
    for (const r of blocRows) {
        const approvalColor = vbaApprovalColor(r.myApproval);
        const barWidth = Math.max(2, r.myApproval);
        const axisLabels = getBlocAxisLabels(r.axes);
        const p = r.pillars;

        // Build modifier list: ideology (permanent) + drift + performance + momentum_log entries
        const mods = [];
        mods.push({ type: 'ideology', label: 'Ideological Alignment', value: p.ideo, permanent: true });

        // Ideological Decay: opposed/neutral blocs erode preference over time
        if (p.drift && p.drift !== 0) {
            const driftFloor = p.ideo < 35 ? 20 : 40;
            mods.push({ type: 'legacy', label: `Ideological Decay (floor ${driftFloor})`, value: p.drift, permanent: true });
        } else if (p.ideo < 35) {
            mods.push({ type: 'legacy', label: 'Ideological Decay (floor 20)', value: -1, permanent: true });
        } else if (p.ideo < 50) {
            mods.push({ type: 'legacy', label: 'Ideological Decay (floor 40)', value: -0.5, permanent: true });
        }

        if (p.perf !== 50) {
            mods.push({ type: 'performance', label: 'Performance Perception', value: p.perf - 50 });
        }
        // Add momentum log entries for this bloc
        const logMods = blocModifiers[r.blocId] || [];
        for (const m of logMods) {
            mods.push(m);
        }

        const delta = p.mom;
        const modifierCount = mods.length;

        // Modifier rows HTML (for expandable section)
        let modRowsHtml = '';
        for (const mod of mods) {
            const iconColor = modColors[mod.type] || '#6b6a5e';
            const icon = modIcons[mod.type] || '·';
            const dateHtml = mod.date ? `<span class="vba-mod-date">${escapeHtml(mod.date)}</span>` : '';
            const permHtml = mod.permanent ? `<span class="vba-mod-perm">PERM</span>` : '';
            modRowsHtml += `
                <div class="vba-mod-row">
                    <span class="vba-mod-icon" style="color:${iconColor}">${icon}</span>
                    <span class="vba-mod-label">${escapeHtml(mod.label)}</span>
                    ${dateHtml}${permHtml}
                    <span class="vba-mod-val" style="color:${vbaModColor(mod.value)}">${vbaFormatMod(mod.value)}</span>
                </div>`;
        }

        // Breakdown summary bar data
        const ideoVal = Math.abs(mods.find(m => m.type === 'ideology')?.value || 0);
        const positives = mods.filter(m => m.type !== 'ideology' && m.value > 0).reduce((s, m) => s + m.value, 0);
        const negatives = Math.abs(mods.filter(m => m.type !== 'ideology' && m.value < 0).reduce((s, m) => s + m.value, 0));
        const breakdownTotal = ideoVal + positives + negatives;
        let breakdownBarHtml = '';
        if (breakdownTotal > 0) {
            breakdownBarHtml = `
                <div class="vba-breakdown-bar">
                    <div style="width:${(ideoVal / breakdownTotal) * 100}%;background:#22d3ee;opacity:0.5;border-radius:2px 0 0 2px"></div>
                    <div style="width:${(positives / breakdownTotal) * 100}%;background:#4ade80;opacity:0.5"></div>
                    <div style="width:${(negatives / breakdownTotal) * 100}%;background:#ef4444;opacity:0.5;border-radius:0 2px 2px 0"></div>
                </div>
                <div class="vba-breakdown-legend">
                    <span style="color:#22d3ee">◆ Ideology ${ideoVal}</span>
                    <span style="color:#4ade80">+ Gains ${Math.round(positives)}</span>
                    <span style="color:#ef4444">− Losses ${Math.round(negatives)}</span>
                </div>`;
        }

        blocCardsHtml += `
            <div class="vba-card" data-bloc-id="${r.blocId}">
                <div class="vba-card-header">
                    <div class="vba-card-header-top">
                        <div class="vba-card-left">
                            <div class="vba-card-name-row">
                                <span class="vba-card-name">${escapeHtml(r.blocName)}</span>
                                <span class="vba-card-pop">${r.popWeight}% of electorate</span>
                            </div>
                            <div class="vba-card-pills">
                                ${axisLabels.map(a => `<span class="vba-axis-pill">${escapeHtml(a)}</span>`).join('')}
                                ${axisLabels.length > 0 && r.priorityIssues.length > 0 ? '<span class="vba-pill-sep">·</span>' : ''}
                                ${(r.priorityIssues || []).map(p => `<span class="vba-priority-pill">${escapeHtml(p)}</span>`).join('')}
                            </div>
                        </div>
                        <div class="vba-card-right">
                            <div class="vba-card-score">
                                <span class="vba-card-score-num" style="color:${approvalColor}">${r.myApproval}</span>
                                <span class="vba-card-score-denom">/ 100</span>
                            </div>
                            ${delta !== 0
                                ? `<span class="vba-card-delta" style="color:${delta > 0 ? '#4ade80' : '#ef4444'}">${delta > 0 ? `▲ +${delta}` : `▼ ${delta}`}</span>`
                                : `<span class="vba-card-delta" style="color:#6b6a5e">— no change</span>`}
                        </div>
                    </div>
                    <div class="vba-card-bar-track"><div class="vba-card-bar-fill" style="width:${barWidth}%;background:${approvalColor}"></div></div>
                </div>
                <div class="vba-card-expanded" style="display:none">
                    <div class="vba-expanded-header">
                        <span class="vba-expanded-title">Approval Breakdown</span>
                        <span class="vba-expanded-count">${modifierCount} factor${modifierCount !== 1 ? 's' : ''}</span>
                    </div>
                    <div class="vba-mod-list">${modRowsHtml}</div>
                    <div class="vba-breakdown-section">${breakdownBarHtml}</div>
                </div>
            </div>`;
    }

    // Summary: strongest, weakest, biggest shift
    const sorted = [...blocRows].sort((a, b) => b.myApproval - a.myApproval);
    const strongest = sorted[0];
    const weakest = sorted[sorted.length - 1];
    const biggestShift = [...blocRows].sort((a, b) => Math.abs(b.pillars.mom) - Math.abs(a.pillars.mom))[0];
    const currentTickDate = tickToDate(currentShard?.current_tick || 0);

    // === Build Other Parties Cards (segmented by Governing / Opposition) ===
    const otherParties = (allParties || []).filter(p => p.id !== f.id);
    let otherPartiesHtml = '';
    if (otherParties.length > 0) {
        const govParties = [];
        const oppParties = [];
        for (const op of otherParties) {
            const opSeats = seatData.allPartySeats[op.id] || 0;
            const opRole = getPartyRole(op.id, opSeats, coalition);
            if (opRole.includes('Governing')) {
                govParties.push({ ...op, _seats: opSeats, _role: opRole });
            } else {
                oppParties.push({ ...op, _seats: opSeats, _role: opRole });
            }
        }

        function buildOtherPartyCards(list) {
            let html = '';
            for (const op of list) {
                const opColor = op.party_color || '#666';
                const opLogo = getPartyIconSVG(op.party_logo, 36, opColor);
                const opBadgeClass = getRoleBadgeClass(op._role);
                const opLeader = op.leader_first_name && op.leader_last_name
                    ? op.leader_first_name + ' ' + op.leader_last_name + (op.leader_age ? ', ' + op.leader_age : '')
                    : '\u2014';
                const opFounded = tickToDate(op.founded_tick);
                const opIdeology = buildIdeologyTags(op);
                const opAbbr = op.abbreviation
                    ? `<span class="other-party-abbr">(${op.abbreviation})</span>` : '';

                html += `
                <div class="other-party-card" style="border-left-color:${opColor}">
                    <div class="other-party-top-row">
                        <div class="other-party-logo" style="color:${opColor}">${opLogo}</div>
                        <div class="other-party-identity">
                            <div class="other-party-name-row">
                                <span class="other-party-name" style="color:${opColor}">${op.faction_name}</span>
                                ${opAbbr}
                            </div>
                            <div class="other-party-role-row">
                                <span class="role-badge ${opBadgeClass}">${op._role}</span>
                            </div>
                            <div class="other-party-ideology-row">${opIdeology}</div>
                        </div>
                    </div>
                    ${op.party_description ? `<div class="other-party-desc">${escapeHtml(op.party_description)}</div>` : ''}
                    <div class="other-party-stats">
                        <div class="other-party-stat">
                            <div class="stat-label">Party Leader</div>
                            <div class="stat-val">${opLeader}</div>
                        </div>
                        <div class="other-party-stat">
                            <div class="stat-label">Seats</div>
                            <div class="stat-val">${op._seats} / ${GAME_CONFIG.TOTAL_SEATS}</div>
                        </div>
                        <div class="other-party-stat">
                            <div class="stat-label">Founded</div>
                            <div class="stat-val">${opFounded}</div>
                        </div>
                    </div>
                </div>`;
            }
            return html;
        }

        const govHtml = govParties.length > 0 ? `
            <div class="other-parties-group">
                <div class="other-parties-group-label other-parties-group-gov">Governing</div>
                <div class="other-parties-grid">${buildOtherPartyCards(govParties)}</div>
            </div>` : '';

        const oppHtml = oppParties.length > 0 ? `
            <div class="other-parties-group">
                <div class="other-parties-group-label other-parties-group-opp">Opposition</div>
                <div class="other-parties-grid">${buildOtherPartyCards(oppParties)}</div>
            </div>` : '';

        otherPartiesHtml = `
        <div class="other-parties-section">
            <div class="other-parties-header">Other Parties</div>
            ${govHtml}
            ${oppHtml}
        </div>`;
    }

    // === Build Ideology Comparison Section ===
    let ideologyComparisonHtml = '';
    if (allParties && allParties.length > 0) {
        let chipHtml = '';
        for (const p of (allParties || [])) {
            const isMe = p.id === f.id;
            const color = p.party_color || '#666';
            const chipClass = isMe ? 'ideology-party-chip your-chip selected' : 'ideology-party-chip';
            chipHtml += `<div class="${chipClass}" style="--chip-color:${color}" data-faction-id="${p.id}">${p.faction_name}</div>`;
        }

        const myIdeo = ideoByFaction[f.id];
        let axesHtml = '';
        let leaningSummaryHtml = '';

        if (myIdeo) {
            for (const axis of IDEOLOGY_AXES) {
                const score = myIdeo[axis.key] || 0;
                const position = 50 + (score / 2);
                axesHtml += `
                <div class="ideo-axis">
                    <div class="ideo-axis-label left">${axis.leftLabel}</div>
                    <div class="ideo-axis-track" data-axis-key="${axis.key}">
                        <div class="ideo-axis-center"></div>
                        <div class="ideo-dot" style="left:${position}%;background:${partyColor}" data-faction-id="${f.id}">
                            <div class="ideo-dot-tooltip">${f.faction_name}: ${score > 0 ? '+' : ''}${score}</div>
                        </div>
                    </div>
                    <div class="ideo-axis-label right">${axis.rightLabel}</div>
                </div>`;
            }

            const profile = getFullIdeologyProfile(myIdeo);
            const nonCentrist = profile.filter(p => p.label !== 'Centrist');
            if (nonCentrist.length > 0) {
                leaningSummaryHtml = `
                <div class="ideology-label-summary" id="ideology-label-summary">
                    <div class="ideology-label-row">
                        <div class="ideology-label-swatch" style="background:${partyColor}"></div>
                        <span class="ideology-label-name">${f.faction_name}</span>
                        <span class="ideology-label-text">${nonCentrist.map(p => p.label).join(', ')}</span>
                    </div>
                </div>`;
            }
        } else {
            axesHtml = '<div class="ideology-chart-empty">No ideology data available.</div>';
        }

        ideologyComparisonHtml = `
        <div class="ideology-section" id="ideology-section">
            <div class="ideology-section-header">Ideology Comparison</div>
            <div class="ideology-party-selector" id="ideology-party-selector">
                ${chipHtml}
            </div>
            <div class="ideology-chart" id="ideology-chart">
                ${axesHtml}
                ${leaningSummaryHtml}
            </div>
        </div>`;
    }

    el.innerHTML = `
        <div class="parties-page">
        <div class="parties-top-panels">

        <div class="my-party-card" style="border-left-color:${partyColor}">
            <div class="my-party-top-row">
                <div class="my-party-logo" style="color:${partyColor}">
                    ${logoSvg}
                </div>
                <div class="my-party-identity">
                    <div class="my-party-name-row">
                        <span class="my-party-name" style="color:${partyColor}">${f.faction_name}</span>
                        ${abbr}
                    </div>
                    <div class="my-party-role-row">
                        <span class="role-badge ${badgeClass}">${role}</span>
                    </div>
                    <div class="my-party-ideology-row">
                        ${ideologyTags}
                    </div>
                </div>
            </div>

            ${f.party_description ? `<div class="my-party-desc">${escapeHtml(f.party_description)}</div>` : ''}

            <div class="my-party-stats">
                <div class="my-party-stat">
                    <div class="stat-label">Party Leader</div>
                    <div class="stat-val">${leaderName}</div>
                </div>
                <div class="my-party-stat">
                    <div class="stat-label">Seats</div>
                    <div class="stat-val">${mySeats} / ${GAME_CONFIG.TOTAL_SEATS}</div>
                </div>
                <div class="my-party-stat">
                    <div class="stat-label">Founded</div>
                    <div class="stat-val">${founded}</div>
                </div>
                <div class="my-party-stat">
                    <div class="stat-label">Treasury</div>
                    <div class="stat-val stat-money">${treasury}</div>
                </div>
            </div>
        </div>

        <div class="vote-share-panel">
            <div class="vote-share-header">Projected Vote Share</div>
            <div class="vote-bars">
                ${voteBarsHtml}
            </div>

        </div>

        <div class="momentum-panel">
            <div class="momentum-header">Momentum</div>
            <div class="momentum-score-row">
                <span class="momentum-value">${momentumScore}</span>
                <span class="momentum-max">/ 100</span>
            </div>
            <div class="momentum-bar-track">
                <div class="momentum-bar-fill" style="width:${momentumScore}%;background:${partyColor}"></div>
            </div>
            <div class="momentum-decay">${decayPerTick > 0 ? `${rawMomentum > 0 ? '−' : '+'}${decayPerTick} / tick` : 'Stable'}</div>
            <div class="momentum-rank">You are ${ordinal(momentumRank)} of ${totalParties} in Momentum right now.</div>
            <div class="momentum-desc">How loud you are in the national conversation right now.</div>
            ${(() => {
                if (!momentumLog || momentumLog.length === 0) return '';
                const SOURCE_LABELS = {
                    'crisis:government_shutdown': 'Government shutdown',
                    'penalty:no_vote': 'Didn\'t vote on bill',
                    'campaign:press_conference': 'Press conference',
                    'campaign:press_conference_target': 'Targeted by press conference',
                    'campaign:make_promise': 'Made promise',
                    'promise:kept': 'Promise kept',
                    'promise:broken': 'Promise broken',
                    'bill:enactment': 'Bill enacted',
                    'bill:enactment:sponsor': 'Sponsored enacted bill',
                    'bill:enactment:supporter': 'Supported enacted bill',
                    'bill:enactment:opposer': 'Opposed enacted bill',
                    'bill:veto': 'Bill vetoed',
                    'bill:withdraw': 'Withdrew bill',
                    'crisis:scandal': 'Scandal',
                    'crisis:natural_disaster': 'Natural disaster',
                    'gov_approval_shift': 'Gov approval shift',
                    'tax:corporate_tax': 'Corporate tax change',
                    'election:winner': 'Election winner',
                    'election:loser': 'Election loss',
                    'minister:fired': 'Minister fired',
                    'campaign:rally': 'Campaign rally'
                };
                const rows = momentumLog.map(e => {
                    const label = SOURCE_LABELS[e.source] || e.source.replace(/[_:]/g, ' ');
                    const sign = e.amount > 0 ? '+' : '';
                    const color = e.amount > 0 ? '#4CAF50' : e.amount < 0 ? '#ff4444' : 'var(--text-muted)';
                    return `<div class="mom-log-row"><span class="mom-log-src">${label}</span><span class="mom-log-amt" style="color:${color}">${sign}${Math.round(e.amount * 10) / 10}</span></div>`;
                }).join('');
                return `<div class="mom-log-panel"><div class="mom-log-title">Recent Changes</div>${rows}</div>`;
            })()}
        </div>

        ${perfCreditHtml}

        <div class="ap-panel">
            <div class="ap-header">Action Points</div>
            <div class="ap-score-row">
                <span class="ap-value">${currentAP}</span>
                <span class="ap-max">/ ${maxAP}</span>
            </div>
            <div class="ap-bar-track">
                <div class="ap-bar-fill" style="width:${apPct}%;background:${partyColor}"></div>
            </div>
            <div class="ap-tip">${apTip}</div>
        </div>

        </div>

        ${isPresidential && presNomineeState !== 'hidden' ? `
        <div class="pres-nominee-section" id="pres-nominee-section">
            <div class="pres-nominee-header">
                <span class="pres-nominee-icon">🏛</span>
                <span class="pres-nominee-title">Presidential Nominee</span>
                ${presTicksUntil !== null ? `<span class="pres-nominee-countdown">${presTicksUntil} month${presTicksUntil !== 1 ? 's' : ''} to election</span>` : ''}
            </div>
            ${presNomineeState === 'greyed' ? `
                <div class="pres-nominee-greyed">
                    <button class="pres-nominee-btn pres-nominee-btn-disabled" disabled>Select Presidential Nominee</button>
                    <div class="pres-nominee-note">Available ${GAME_CONFIG.PRESIDENTIAL_CANDIDATE_LEAD_TICKS} months before the next presidential election${presTicksUntil !== null ? ` (${presTicksUntil} months away)` : ''}.</div>

    // ── Voter Bloc card expand/collapse ──
    (function initVbaCards() {
        let expandedId = null;
        el.querySelectorAll('.vba-card').forEach(card => {
            const header = card.querySelector('.vba-card-header');
            const expanded = card.querySelector('.vba-card-expanded');
            if (!header || !expanded) return;
            header.style.cursor = 'pointer';
            header.addEventListener('click', () => {
                const blocId = card.dataset.blocId;
                if (expandedId === blocId) {
                    expanded.style.display = 'none';
                    card.style.borderColor = 'rgba(255,255,255,0.06)';
                    expandedId = null;
                } else {
                    // Collapse previously expanded
                    el.querySelectorAll('.vba-card').forEach(c => {
                        const exp = c.querySelector('.vba-card-expanded');
                        if (exp) exp.style.display = 'none';
                        c.style.borderColor = 'rgba(255,255,255,0.06)';
                    });
                    expanded.style.display = 'block';
                    card.style.borderColor = 'rgba(255,255,255,0.1)';
                    expandedId = blocId;
                }
            });
        });
    })();

    // ── Presidential Nominee Selector ──
    (function initPresNomineeSelector() {
        const section = document.getElementById('pres-nominee-section');
        if (!section) return;

        let selectedId = null;
        const cards = section.querySelectorAll('.pres-nom-card');
        const confirmBtn = document.getElementById('pres-nominee-confirm-btn');
        const confirmSummary = document.getElementById('pres-nominee-confirm-summary');

        // Toggle selector visibility
        window.toggleNomineeSelector = function() {
            const sel = document.getElementById('pres-nominee-selector');
            if (!sel) return;
            sel.style.display = sel.style.display === 'none' ? 'block' : 'none';
        };

        // Card selection
        cards.forEach(card => {
            card.addEventListener('click', () => {
                selectedId = card.dataset.candidateId;
                cards.forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                const nameEl = card.querySelector('.pm-card-name');
                const traitEl = card.querySelector('.pm-trait-name');
                const ideoEl = card.querySelector('.pm-ideology-tag');
                if (confirmSummary) {
                    confirmSummary.innerHTML =
                        `Nominate <strong>${nameEl?.textContent || ''}</strong> — ` +
                        `<span style="color:var(--accent)">${traitEl?.textContent || ''}</span> · ` +
                        `${ideoEl?.textContent || ''}`;
                }
                if (confirmBtn) confirmBtn.disabled = false;
            });
        });

        // Confirm nomination
        window.confirmPresNominee = async function() {
            if (!selectedId) return;
            const card = document.getElementById('pres-card-' + selectedId);
            const nameEl = card?.querySelector('.pm-card-name');
            const name = nameEl?.textContent || 'this candidate';

            if (!confirm(
                `Nominate ${name} as your presidential candidate?\n\n` +
                `This choice is permanent. They will also become your Party Leader.\n` +
                `If your party wins the election, they become President.`
            )) return;

            if (confirmBtn) {
                confirmBtn.disabled = true;
                confirmBtn.textContent = 'Nominating...';
            }

            try {
                const { data: shard } = await _supabase
                    .from('shard')
                    .select('current_tick')
                    .eq('name', 'Alpha Shard')
                    .single();

                const candidate = await selectPresidentCandidate(
                    _supabase,
                    selectedId,
                    currentNation.id,
                    currentFaction.id,
                    shard?.current_tick || 0
                );

                // Also update party leader to the nominee
                if (candidate) {
                    await _supabase.from('factions').update({
                        leader_first_name: candidate.first_name,
                        leader_last_name: candidate.last_name,
                        leader_age: candidate.age
                    }).eq('id', currentFaction.id);
                }

                alert(`${name} has been nominated as your presidential candidate and is now your Party Leader!`);
                await renderParties();
            } catch (e) {
                console.error('Error nominating candidate:', e);
                alert('Error: ' + e.message);
                if (confirmBtn) {
                    confirmBtn.disabled = false;
                    confirmBtn.textContent = 'Nominate Candidate';
                }
            }
        };
    })();

    (function initEditIdentity() {
        const section = document.getElementById('edit-identity-section');

        let editLogo = f.party_logo || 'flag';

            paletteHtml += '<div class="edit-color-swatch' + (isActive ? ' active' : '') + '" data-hex="' + c.hex + '" style="background:' + c.hex + '" title="' + c.label + '"></div>';
        }
        paletteEl.innerHTML = paletteHtml;

        const hexInput = document.getElementById('edit-color-hex');
        const colorPreview = document.getElementById('edit-color-preview');
        const colorWarning = document.getElementById('edit-color-warning');

        function selectColor(hex) {
            editColor = hex;
            hexInput.value = hex;
            colorPreview.style.background = hex;
            paletteEl.querySelectorAll('.edit-color-swatch').forEach(sw => {
                sw.classList.toggle('active', sw.dataset.hex.toUpperCase() === hex.toUpperCase());
            });
            checkColorSimilarity(hex);
        }

        function checkColorSimilarity(hex) {
            const otherColors = (allParties || [])
                .filter(p => p.id !== f.id && p.party_color)
                .map(p => ({ name: p.faction_name, color: p.party_color }));
            let warning = '';
            for (const other of otherColors) {
                if (colorDistance(hex, other.color) < 30) {
                    warning = 'Another party (' + other.name + ') is already using a very similar color. This may cause confusion in charts and maps.';
                    break;
                }
            }
            colorWarning.style.display = warning ? 'block' : 'none';
            colorWarning.textContent = warning;
        }

        paletteEl.addEventListener('click', (e) => {
            const sw = e.target.closest('.edit-color-swatch');
            if (sw) selectColor(sw.dataset.hex);
        });

        hexInput.addEventListener('input', () => {
            const val = hexInput.value.trim();
            if (/^#[0-9a-fA-F]{6}$/.test(val)) {
                selectColor(val);
            }
        });

        checkColorSimilarity(editColor);

        // Logo grid
        const logoGrid = document.getElementById('edit-logo-grid');
        let logoHtml = '';
        const categories = {};
        for (const [key, icon] of Object.entries(PARTY_ICONS)) {
            if (!categories[icon.category]) categories[icon.category] = [];
            categories[icon.category].push({ key, label: icon.label });
        }
        for (const [cat, icons] of Object.entries(categories)) {
            logoHtml += '<div class="edit-logo-category">' + cat + '</div>';
            for (const icon of icons) {
                const isActive = icon.key === editLogo;
                logoHtml += '<div class="edit-logo-option' + (isActive ? ' active' : '') + '" data-key="' + icon.key + '" title="' + icon.label + '">' + getPartyIconSVG(icon.key, 28, isActive ? editColor : '#888') + '</div>';
            }
        }
        logoGrid.innerHTML = logoHtml;

        logoGrid.addEventListener('click', (e) => {
            const opt = e.target.closest('.edit-logo-option');
            if (!opt) return;
            editLogo = opt.dataset.key;
            logoGrid.querySelectorAll('.edit-logo-option').forEach(o => {
                const isActive = o.dataset.key === editLogo;
                o.classList.toggle('active', isActive);
                o.innerHTML = getPartyIconSVG(o.dataset.key, 28, isActive ? editColor : '#888');
            });
        });

        // Save
        const saveBtn = document.getElementById('edit-identity-save');
        const statusEl = document.getElementById('edit-identity-status');
        saveBtn.addEventListener('click', async () => {
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';
            statusEl.textContent = '';

            const newDesc = (descInput.value || '').trim().slice(0, 200);
            const { error } = await _supabase.from('factions').update({
                party_description: newDesc || null,
                party_color: editColor,
                party_logo: editLogo,
            }).eq('id', f.id);

            if (error) {
                statusEl.textContent = 'Error: ' + error.message;
                statusEl.style.color = '#ff4444';
            } else {
                statusEl.textContent = 'Saved!';
                statusEl.style.color = '#4CAF50';
                f.party_description = newDesc || null;
                f.party_color = editColor;
                f.party_logo = editLogo;
                currentFaction.party_description = f.party_description;
                currentFaction.party_color = f.party_color;
                currentFaction.party_logo = f.party_logo;
                setTimeout(() => renderParties(), 800);
            }
            saveBtn.disabled = false;
            saveBtn.textContent = 'Save Changes';
        });
    })();

    // ── Ideology Comparison: chip toggle logic ──
    const ideoSection = document.getElementById('ideology-section');
    if (ideoSection) {
        const selector = document.getElementById('ideology-party-selector');
        const chartEl = document.getElementById('ideology-chart');

        function rebuildIdeologyChart() {
            const selectedChips = selector.querySelectorAll('.ideology-party-chip.selected');
            const selectedIds = [...selectedChips].map(c => c.dataset.factionId);

            let axesHtml = '';
            for (const axis of IDEOLOGY_AXES) {
                let dotsHtml = '<div class="ideo-axis-center"></div>';

                for (const fid of selectedIds) {
                    const ideo = ideoByFaction[fid];
                    if (!ideo) continue;
                    const party = (allParties || []).find(p => p.id === fid);
                    if (!party) continue;
                    const score = ideo[axis.key] || 0;
                    const position = 50 + (score / 2);
                    const color = party.party_color || '#666';
                    const isMe = fid === f.id;

                    dotsHtml += `
                        <div class="ideo-dot" style="left:${position}%;background:${color};${isMe ? 'z-index:5;' : ''}" data-faction-id="${fid}">
                            <div class="ideo-dot-tooltip">${party.faction_name}: ${score > 0 ? '+' : ''}${score}</div>
                        </div>`;
                }

                axesHtml += `
                <div class="ideo-axis">
                    <div class="ideo-axis-label left">${axis.leftLabel}</div>
                    <div class="ideo-axis-track" data-axis-key="${axis.key}">
                        ${dotsHtml}
                    </div>
                    <div class="ideo-axis-label right">${axis.rightLabel}</div>
                </div>`;
            }

            let summaryHtml = '';
            for (const fid of selectedIds) {
                const ideo = ideoByFaction[fid];
                if (!ideo) continue;
                const party = (allParties || []).find(p => p.id === fid);
                if (!party) continue;

                const profile = getFullIdeologyProfile(ideo);
                const nonCentrist = profile.filter(p => p.label !== 'Centrist');
                if (nonCentrist.length === 0) continue;

                summaryHtml += `

                    </div>`;
            }

            if (summaryHtml) {
                summaryHtml = `<div class="ideology-label-summary">${summaryHtml}</div>`;
            }

            chartEl.innerHTML = axesHtml + summaryHtml;
        }

            if (!chip) return;
            if (chip.dataset.factionId === f.id) return;
            chip.classList.toggle('selected');
            rebuildIdeologyChart();
        });
