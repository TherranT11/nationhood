    if (statusEl) {
        statusEl.textContent = statusText;
        statusEl.style.color = loyaltyColor;
    }
}

// ---- RALLY SUPPORT ----
async function doRallySupport() {
    if (!currentFaction || !currentNation) return;
    if ((currentFaction.action_points || 0) < 2) { alert('Not enough AP (need 2).'); return; }

    const apResult = await deductAP(_supabase, currentFaction.id, 2);
    if (!apResult.success) { alert('Not enough AP (need 2).'); return; }
    currentFaction.action_points = apResult.newAp;

    const isRuling = currentFaction.id === currentNation.ruling_faction_id;

    try {
        const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const tick = shard?.current_tick || 0;

        if (isRuling) {
            const mode = document.getElementById('rally-mode')?.value || 'celebrate';

            if (mode === 'celebrate') {
                const approvalGain = Math.floor(Math.random() * 2) + 1; // 1D2
                await adjustBlocApproval(_supabase, currentFaction.id, approvalGain);

                // +1 loyalty to ALL factions in nation
                const { data: allFactions } = await _supabase.from('factions')
                    .select('id, loyalty')
                    .eq('nation_id', currentNation.id).eq('faction_type', 'party');
                for (const f of (allFactions || [])) {
                    await _supabase.from('factions')
                        .update({ loyalty: Math.min(100, (f.loyalty ?? 50) + 1) })
                        .eq('id', f.id);
                }

                // +1 corruption to nation
                const { data: nat } = await _supabase.from('nations')
                    .select('corruption').eq('id', currentNation.id).single();
                await _supabase.from('nations')
                    .update({ corruption: Math.min(100, (nat?.corruption ?? 50) + 1) })
                    .eq('id', currentNation.id);

                await _supabase.from('campaign_actions').insert({
                    party_id: currentFaction.id, nation_id: currentNation.id,
                    action_type: 'rally_celebrate', tick_performed: tick,
                    result: { approval_gain: approvalGain, loyalty_gain_all: 1, corruption_gain: 1 }
                });

                currentFaction.approval_rating = Math.min(100, (currentFaction.approval_rating ?? 50) + approvalGain);
                currentFaction.loyalty = Math.min(100, (currentFaction.loyalty ?? 50) + 1);
                alert(`Celebrated the Regime! +${approvalGain} approval, +1 loyalty to all factions, +1 corruption.`);
            } else {
                // Denounce Enemies
                const targetId = document.getElementById('denounce-target')?.value;
                if (!targetId) { alert('Select a target faction!'); return; }

                const loyaltyLoss = Math.floor(Math.random() * 2) + 1; // 1D2
                const { data: target } = await _supabase.from('factions')
                    .select('loyalty, faction_name').eq('id', targetId).single();
                const newTargetLoyalty = Math.max(0, (target?.loyalty ?? 50) - loyaltyLoss);
                await _supabase.from('factions').update({ loyalty: newTargetLoyalty }).eq('id', targetId);

                await adjustBlocApproval(_supabase, currentFaction.id, 1);

                const { data: nat } = await _supabase.from('nations')
                    .select('polarization').eq('id', currentNation.id).single();
                await _supabase.from('nations')
                    .update({ polarization: Math.min(100, (nat?.polarization ?? 50) + 1) })
                    .eq('id', currentNation.id);

                await _supabase.from('campaign_actions').insert({
                    party_id: currentFaction.id, nation_id: currentNation.id,
                    action_type: 'rally_denounce', tick_performed: tick,
                    result: { target_name: target?.faction_name, loyalty_loss: loyaltyLoss, approval_gain: 1, polarization_gain: 1 }
                });

                currentFaction.approval_rating = Math.min(100, (currentFaction.approval_rating ?? 50) + 1);
                alert(`Denounced ${target?.faction_name}! -${loyaltyLoss} loyalty to them, +1 approval, +1 polarization.`);
            }
        } else {
            // Opposition: Pledge Loyalty (+1D2 loyalty to self)
            const loyaltyGain = Math.floor(Math.random() * 2) + 1;
            const newLoyalty = Math.min(100, (currentFaction.loyalty ?? 50) + loyaltyGain);
            await _supabase.from('factions')
                .update({ loyalty: newLoyalty })
                .eq('id', currentFaction.id);

            await _supabase.from('campaign_actions').insert({
                party_id: currentFaction.id, nation_id: currentNation.id,
                action_type: 'rally_pledge', tick_performed: tick,
                result: { loyalty_gain: loyaltyGain }
            });

            currentFaction.loyalty = newLoyalty;
            alert(`Pledged Loyalty! +${loyaltyGain} loyalty.`);
        }

        updateAutocracyUI();
        await loadActionLog();
        await markFactionActive(_supabase, currentFaction.id);
        sessionStorage.removeItem('nationhood_state');
    } catch (error) {
        console.error('Rally error:', error);
        alert('Error: ' + error.message);
    }
}

// ---- UNDERMINE ----
async function doUndermine() {
    if (!currentFaction || !currentNation) return;
    if ((currentFaction.action_points || 0) < 3) { alert('Not enough AP (need 3).'); return; }

    const targetId = document.getElementById('undermine-target')?.value;
    if (!targetId) { alert('Select a target faction!'); return; }

    if (!confirm('Undermine this faction? This will reduce their loyalty and cost -1 national stability.')) return;

    const apResult = await deductAP(_supabase, currentFaction.id, 3);
    if (!apResult.success) { alert('Not enough AP (need 3).'); return; }
    currentFaction.action_points = apResult.newAp;

    try {
        const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const tick = shard?.current_tick || 0;

        const loyaltyLoss = Math.floor(Math.random() * 3) + 1; // 1D3

        const { data: target } = await _supabase.from('factions')
            .select('loyalty, faction_name').eq('id', targetId).single();
        const newTargetLoyalty = Math.max(0, (target?.loyalty ?? 50) - loyaltyLoss);
        await _supabase.from('factions').update({ loyalty: newTargetLoyalty }).eq('id', targetId);

        const { data: nat } = await _supabase.from('nations')
            .select('stability').eq('id', currentNation.id).single();
        await _supabase.from('nations')
            .update({ stability: Math.max(0, (nat?.stability ?? 50) - 1) })
            .eq('id', currentNation.id);

        const revealed = newTargetLoyalty < 20;

        await _supabase.from('campaign_actions').insert({
            party_id: currentFaction.id, nation_id: currentNation.id,
            action_type: 'undermine', tick_performed: tick,
            result: { target_name: target?.faction_name, target_id: targetId, loyalty_loss: loyaltyLoss, stability_loss: 1, revealed }
        });

        let msg = `Undermined ${target?.faction_name}! -${loyaltyLoss} loyalty, -1 national stability.`;
        if (revealed) msg += '\n\nTheir loyalty is below 20 -- they know it was you!';
        alert(msg);

        updateAutocracyUI();
        await loadActionLog();
        await markFactionActive(_supabase, currentFaction.id);
        sessionStorage.removeItem('nationhood_state');
    } catch (error) {
        console.error('Undermine error:', error);
        alert('Error: ' + error.message);
    }
}

async function doPatronageNetwork() {
    if (!currentFaction || !currentNation) return;
    if (currentFaction.id !== currentNation.ruling_faction_id) {
        alert('Only the ruling faction can use Patronage Network.');
        return;
    }
    if ((currentFaction.action_points || 0) < 2) { alert('Not enough AP (need 2).'); return; }

    const targetId = document.getElementById('patronage-target')?.value;
    if (!targetId) { alert('Select a target faction!'); return; }

    const isSelf = targetId === currentFaction.id;

    if (!confirm(
        `Distribute $50,000 from the national treasury to ${isSelf ? 'your own faction' : 'this faction'}?\n\n` +
        `Effects:\n` +
        `- Target: +$50,000 funds, +2 loyalty\n` +
        `- Nation: +1 corruption, -$50,000 treasury\n` +
        (isSelf ? '- All other factions: -1 loyalty\n' : '') +
        '\nProceed?'
    )) return;

    const apResult = await deductAP(_supabase, currentFaction.id, 2);
    if (!apResult.success) { alert('Not enough AP (need 2).'); return; }
    currentFaction.action_points = apResult.newAp;

    try {
        const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const tick = shard?.current_tick || 0;

        const { data: targetFaction } = await _supabase.from('factions')
            .select('loyalty, party_funds, faction_name').eq('id', targetId).single();

        // Target: +$50k funds, +2 loyalty
        await _supabase.from('factions').update({
            party_funds: (targetFaction?.party_funds || 0) + 50000,
            loyalty: Math.min(100, (targetFaction?.loyalty ?? 50) + 2)
        }).eq('id', targetId);

        // Nation: +1 corruption
        const { data: nat } = await _supabase.from('nations')
            .select('corruption').eq('id', currentNation.id).single();
        await _supabase.from('nations').update({
            corruption: Math.min(100, (nat?.corruption ?? 50) + 1)
        }).eq('id', currentNation.id);

        // If self: all other factions -1 loyalty
        if (isSelf) {
            const { data: otherFactions } = await _supabase.from('factions')
                .select('id, loyalty')
                .eq('nation_id', currentNation.id).eq('faction_type', 'party')
                .neq('id', currentFaction.id);
            for (const f of (otherFactions || [])) {
                await _supabase.from('factions')
                    .update({ loyalty: Math.max(0, (f.loyalty ?? 50) - 1) })
                    .eq('id', f.id);
            }
        }

        await _supabase.from('campaign_actions').insert({
            party_id: currentFaction.id, nation_id: currentNation.id,
            action_type: 'patronage_network', tick_performed: tick,
            result: {
                target_name: targetFaction?.faction_name, target_id: targetId,
                is_self: isSelf, funds_transferred: 50000, loyalty_gain: 2,
                corruption_gain: 1, others_loyalty_loss: isSelf ? 1 : 0
            }
        });

        if (isSelf) currentFaction.loyalty = Math.min(100, (currentFaction.loyalty ?? 50) + 2);
        alert(`Patronage distributed! ${targetFaction?.faction_name} received $50,000 and +2 loyalty. Nation +1 corruption.` +
            (isSelf ? '\nAll other factions: -1 loyalty.' : ''));

        updateAutocracyUI();
        await loadActionLog();
        await markFactionActive(_supabase, currentFaction.id);
        sessionStorage.removeItem('nationhood_state');
    } catch (error) {
        console.error('Patronage error:', error);
        alert('Error: ' + error.message);
    }
}

// ---- SEIZE POWER (Opposition Only) ----
async function doSeizePower() {
    if (!currentFaction || !currentNation) return;
    if (currentFaction.id === currentNation.ruling_faction_id) {
        alert('You are already the ruling faction.');
        return;
    }

    if ((currentFaction.action_points || 0) < 15) { alert('Not enough AP (need 15).'); return; }

    // Atomic AP deduction — prevents race conditions and double-spend
    const apResult = await deductAP(_supabase, currentFaction.id, 15);
    if (!apResult.success) { alert('Not enough AP (need 15).'); return; }
    currentFaction.action_points = apResult.newAp;

    const { data: allFactions } = await _supabase.from('factions')
        .select('id, faction_name, seats, loyalty')
        .eq('nation_id', currentNation.id).eq('faction_type', 'party');

    const disloyalFactions = (allFactions || []).filter(f =>
        f.id !== currentFaction.id && (f.loyalty ?? 50) < 30
    );

    if (disloyalFactions.length < 2) {
        alert('Cannot seize power. Need 2+ factions with loyalty below 30. Currently: ' + disloyalFactions.length);
        return;
    }

    // Preview the sides
    const rulingId = currentNation.ruling_faction_id;
    let previewRegime = [], previewChallenger = [];
    for (const f of (allFactions || [])) {
        if (f.id === currentFaction.id) { previewChallenger.push(f.faction_name); continue; }
        if (f.id === rulingId) { previewRegime.push(f.faction_name); continue; }
        if ((f.loyalty ?? 50) >= 30) previewRegime.push(f.faction_name);
        else previewChallenger.push(f.faction_name);
    }

    if (!confirm(
        'SEIZE POWER?\n\nCost: 15 AP\n\n' +
        'Predicted sides:\n' +
        'Regime: ' + previewRegime.join(', ') + '\n' +
        'Your side: ' + previewChallenger.join(', ') + '\n\n' +
        'Side with more total seats wins.\n\n' +
        'WIN: You become ruler. Old ruler becomes opposition at 50 loyalty.\n' +
        'FAIL: -25 seats, -20 approval, loyalty=0, purged from ministries. Seize Power blocked 6 ticks.\n\nProceed?'
    )) return;

    try {
        const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const tick = shard?.current_tick || 0;

        let regimeSeats = 0, challengerSeats = 0;
        const regimeSide = [], challengerSide = [];

        for (const f of (allFactions || [])) {
            if (f.id === currentFaction.id) {
                challengerSeats += f.seats || 0;
                challengerSide.push(f.faction_name);
                continue;
            }
            if (f.id === rulingId) {
                regimeSeats += f.seats || 0;
                regimeSide.push(f.faction_name);
                continue;
            }
            if ((f.loyalty ?? 50) >= 30) {
                regimeSeats += f.seats || 0;
                regimeSide.push(f.faction_name);
            } else {
                challengerSeats += f.seats || 0;
                challengerSide.push(f.faction_name);
            }
        }

        const challengerWins = challengerSeats > regimeSeats;

        if (challengerWins) {
            // === WIN ===
            // Old ruler: lose all ministries, become opposition at loyalty 50
            await _supabase.from('ministries')
                .update({ party_id: null, minister_first_name: null, minister_last_name: null, minister_age: null })
                .eq('nation_id', currentNation.id).eq('party_id', rulingId);

            await _supabase.from('factions').update({ loyalty: 50 }).eq('id', rulingId);

            // New ruler
            await _supabase.from('nations').update({ ruling_faction_id: currentFaction.id }).eq('id', currentNation.id);
            await _supabase.from('factions').update({ loyalty: 80 }).eq('id', currentFaction.id);

            await _supabase.from('campaign_actions').insert({
                party_id: currentFaction.id, nation_id: currentNation.id,
                action_type: 'seize_power_success', tick_performed: tick,
                result: { regime_seats: regimeSeats, challenger_seats: challengerSeats, regime_side: regimeSide, challenger_side: challengerSide, old_ruler_id: rulingId }
            });

            currentFaction.loyalty = 80;
            currentNation.ruling_faction_id = currentFaction.id;

            alert(
                'POWER SEIZED!\n\n' +
                `Your coalition: ${challengerSide.join(', ')} (${challengerSeats} seats)\n` +
                `Regime: ${regimeSide.join(', ')} (${regimeSeats} seats)\n\n` +
                'You are now the ruling faction!'
            );
        } else {
            // === FAIL ===
            const mySeats = currentFaction.seats || 0;

            await _supabase.from('factions').update({
                seats: Math.max(0, mySeats - 25),
                loyalty: 0,
                action_lockout_until_tick: tick + 6
            }).eq('id', currentFaction.id);
            await adjustBlocApproval(_supabase, currentFaction.id, -20);

            // Purge from ministries
            await _supabase.from('ministries')
                .update({ party_id: null, minister_first_name: null, minister_last_name: null, minister_age: null })
                .eq('nation_id', currentNation.id).eq('party_id', currentFaction.id);

            await _supabase.from('campaign_actions').insert({
                party_id: currentFaction.id, nation_id: currentNation.id,
                action_type: 'seize_power_failed', tick_performed: tick,
                result: { regime_seats: regimeSeats, challenger_seats: challengerSeats, regime_side: regimeSide, challenger_side: challengerSide, seats_lost: Math.min(25, mySeats), approval_lost: 20, coup_cooldown_until: tick + 6 }
            });

            currentFaction.seats = Math.max(0, mySeats - 25);
            currentFaction.approval_rating = Math.max(0, (currentFaction.approval_rating ?? 50) - 20);
            currentFaction.loyalty = 0;
            currentFaction.action_lockout_until_tick = tick + 6;

            alert(
                'COUP FAILED!\n\n' +
                `Your coalition: ${challengerSide.join(', ')} (${challengerSeats} seats)\n` +
                `Regime: ${regimeSide.join(', ')} (${regimeSeats} seats)\n\n` +
                `Consequences:\n` +
                `- Lost ${Math.min(25, mySeats)} seats\n` +
                `- Lost 20 approval\n` +
                `- Loyalty set to 0\n` +
                `- Purged from all ministries\n` +
                `- Cannot attempt Seize Power for 6 ticks`
            );
        }

        updateAutocracyUI();
        await loadActionLog();
        await markFactionActive(_supabase, currentFaction.id);
        sessionStorage.removeItem('nationhood_state');
    } catch (error) {
        console.error('Seize power error:', error);
        alert('Error: ' + error.message);
    }
}

// ---- DISBAND PARTY ----
async function doDisbandParty() {
    if (!currentFaction || !currentNation) return;

    // Block autocracy ruling faction
    if (isGovernmentAutocracy(currentNation) &&
        currentFaction.id === currentNation.ruling_faction_id) {
        alert('The ruling faction cannot disband.');
        return;
    }

    // Fetch current tick
    const { data: shard } = await _supabase
        .from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const tick = shard?.current_tick || 0;

    // Check cooldown
    if (currentFaction.disband_cooldown_until_tick &&
        currentFaction.disband_cooldown_until_tick > tick) {
        const remaining = currentFaction.disband_cooldown_until_tick - tick;
        alert(`Disband is on cooldown for ${remaining} more tick${remaining !== 1 ? 's' : ''}.`);
        return;
    }

    // Confirmation dialog
    if (!confirm(
        'DISBAND PARTY?\n\n' +
        'This will permanently remove your party from ' + currentNation.name + '.\n\n' +
        'Consequences:\n' +
        '- Your party leaves the nation immediately\n' +
        '- If you are PM, you will resign first\n' +
        '- If you are in the coalition, it may collapse\n' +
        '- Your seats remain vacant until the next election\n' +
        '- 24-tick cooldown before you can disband again\n\n' +
        'You will need to join a new nation to continue playing.\n\n' +
        'Are you sure?'
    )) return;

    try {
        await disbandParty(_supabase, currentNation.id, currentFaction.id, tick);
        sessionStorage.removeItem('nationhood_state');
        alert('Your party has been disbanded. Redirecting to nation selection...');
        window.location.href = 'world.html';
    } catch (error) {
        console.error('Disband error:', error);
        alert('Error: ' + error.message);
    }
}
</script>
