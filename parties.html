<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Parties | Nationhood Alpha</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/parties.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="top-bar"></div>
<div id="content-area">
    <div class="loading-container">
        <div class="loading-spinner"></div>
        <div>Loading parties...</div>
    </div>
</div>
<script type="module">
import { _supabase } from './js/supabase-client.js';
import { initPage, qCache, formatCurrency } from './js/common.js';
import { loadSeats, fetchActiveCoalition, isGovernmentAutocracy, initGameConfigForNation } from './js/game-common.js';
import { getPartyIconSVG } from './js/party-icons.js';

let currentFaction = null;
let currentNation = null;

function getPartyRole(factionId, seats, coalition) {
    if (!seats || seats === 0) return 'No Seats';
    if (coalition && coalition.party_ids && coalition.party_ids.includes(factionId)) {
        return coalition.lead_party_id === factionId
            ? 'Lead — Governing Coalition'
            : 'Governing Coalition';
    }
    return 'Opposition';
}

function getRoleBadgeClass(role) {
    if (role.includes('Governing')) return 'role-badge-gov';
    if (role === 'Opposition') return 'role-badge-opp';
    return 'role-badge-none';
}

function formatFounded(dateStr) {
    if (!dateStr) return '—';
    const d = new Date(dateStr);
    return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
}

function buildIdeologyTags(f) {
    let html = '';
    if (f.ideology_value_1) {
        const cls = 'tag-' + f.ideology_value_1.toLowerCase();
        html += `<span class="ideology-tag ${cls}">${f.ideology_value_1}</span>`;
    }
    if (f.ideology_value_2) {
        const cls = 'tag-' + f.ideology_value_2.toLowerCase();
        html += `<span class="ideology-tag ${cls}">${f.ideology_value_2}</span>`;
    }
    return html;
}

async function renderParties() {
    const el = document.getElementById('content-area');
    const f = currentFaction;
    const n = currentNation;

    if (!f || !n) {
        el.innerHTML = '<p style="color:var(--text-muted);text-align:center;margin-top:40px;">No party data available.</p>';
        return;
    }

    const isAutocracy = isGovernmentAutocracy(n);

    if (isAutocracy) {
        el.innerHTML = '<p style="color:var(--text-muted);text-align:center;margin-top:40px;">Autocracy view coming soon.</p>';
        return;
    }

    // Fetch all parties for seat data
    const { data: allParties } = await _supabase
        .from('factions')
        .select('id, faction_name, seats')
        .eq('nation_id', n.id)
        .eq('faction_type', 'party');

    const allPartySeats = await loadSeats(_supabase, n.id, false, allParties || [], f.id);
    const mySeats = allPartySeats[f.id] || 0;

    const coalition = await fetchActiveCoalition(_supabase, n.id);
    const role = getPartyRole(f.id, mySeats, coalition);
    const badgeClass = getRoleBadgeClass(role);

    const partyColor = f.party_color || '#ffcc00';
    const logoSvg = getPartyIconSVG(f.party_logo, 44, partyColor);
    const treasury = formatCurrency(f.party_funds || 0);
    const founded = formatFounded(f.created_at);
    const leaderName = f.leader_first_name && f.leader_last_name
        ? f.leader_first_name + ' ' + f.leader_last_name + (f.leader_age ? ', ' + f.leader_age : '')
        : '—';
    const ideologyTags = buildIdeologyTags(f);
    const abbr = f.abbreviation ? `<span class="my-party-abbr">(${f.abbreviation})</span>` : '';

    el.innerHTML = `
        <div class="my-party-card" style="border-left-color:${partyColor}">
            <div class="my-party-top-row">
                <div class="my-party-logo" style="color:${partyColor}">
                    ${logoSvg}
                </div>
                <div class="my-party-identity">
                    <div class="my-party-name-row">
                        <span class="my-party-name" style="color:${partyColor}">${f.faction_name}</span>
                        ${abbr}
                    </div>
                    <div class="my-party-role-row">
                        <span class="role-badge ${badgeClass}">${role}</span>
                        ${ideologyTags}
                    </div>
                </div>
            </div>

            <div class="my-party-stats">
                <div class="my-party-stat">
                    <div class="stat-label">Party Leader</div>
                    <div class="stat-val">${leaderName}</div>
                </div>
                <div class="my-party-stat">
                    <div class="stat-label">Founded</div>
                    <div class="stat-val">${founded}</div>
                </div>
                <div class="my-party-stat">
                    <div class="stat-label">Treasury</div>
                    <div class="stat-val stat-money">${treasury}</div>
                </div>
            </div>
        </div>
    `;
}

initPage('parties', async (state) => {
    const { nation, faction } = state;
    currentFaction = faction;
    currentNation = nation;
    initGameConfigForNation(nation);
    await renderParties();
});
</script>
</body>
</html>
