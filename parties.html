<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Parties | Nationhood Alpha</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://pbumjalxclmegzckhqqr.supabase.co" crossorigin>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .parties-section-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: bold;
            padding: 10px 0 12px;
            margin-top: 8px;
            border-bottom: 2px solid #333;
            margin-bottom: 16px;
        }
        .parties-section-label.gov { color: #4CAF50; border-bottom-color: #4CAF50; }
        .parties-section-label.opp { color: #ff4444; border-bottom-color: #ff4444; }
        .parties-section-label.regime { color: #ff9800; border-bottom-color: #ff9800; }
        .parties-section-empty {
            color: #666; font-style: italic; text-align: center; padding: 20px;
        }
        .action-grid .action-card { display: flex; flex-direction: column; }
        .action-grid .action-card .action-desc { flex: 1; }
        .action-grid .action-card .action-btn { margin-top: auto; }

        /* ===== FIX: Missing ideology tag colors ===== */
        .tag-individualism { background: #eab308; color: #121212; }
        .tag-collectivism  { background: #ec4899; color: white; }

        /* ===== IDEOLOGY COMPARISON SECTION ===== */
        .ideology-section {
            margin-top: 30px;
        }

        /* Party selector chips */
        .ideology-party-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }
        .ideology-party-chip {
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid var(--border-main);
            background: var(--bg-card);
            color: var(--text-secondary);
            transition: all 0.2s;
            user-select: none;
        }
        .ideology-party-chip:hover {
            border-color: var(--text-muted);
            color: var(--text-primary);
        }
        .ideology-party-chip.selected {
            border-color: var(--chip-color, var(--accent));
            background: var(--chip-color, var(--accent));
            color: #121212;
        }
        .ideology-party-chip.your-chip {
            border-style: dashed;
            border-color: var(--accent);
        }
        .ideology-party-chip.your-chip.selected {
            border-style: solid;
        }

        /* Spectrum chart container */
        .ideology-chart {
            background: var(--bg-panel);
            border-radius: 8px;
            padding: 24px;
            border: 1px solid var(--border-main);
        }
        .ideology-chart-empty {
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            padding: 30px;
        }

        /* Single axis row */
        .ideo-axis {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .ideo-axis:last-child { margin-bottom: 0; }

        .ideo-axis-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
            width: 90px;
            text-align: right;
            flex-shrink: 0;
            line-height: 1.2;
        }
        .ideo-axis-label.left  { color: var(--text-secondary); }
        .ideo-axis-label.right { color: var(--text-secondary); text-align: left; }

        /* The bar track */
        .ideo-axis-track {
            flex: 1;
            height: 24px;
            border-radius: 12px;
            position: relative;
            overflow: visible;
            border: 1px solid var(--border-main);
        }

        /* Center tick at 0 */
        .ideo-axis-center {
            position: absolute;
            left: 50%;
            top: -4px;
            bottom: -4px;
            width: 2px;
            background: var(--text-muted);
            transform: translateX(-1px);
            z-index: 1;
            opacity: 0.6;
        }

        /* Ghost marker (declared starting position) */
        .ideo-ghost-marker {
            position: absolute;
            top: 50%;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px dashed rgba(255,255,255,0.35);
            background: transparent;
            transform: translate(-50%, -50%);
            z-index: 2;
            pointer-events: none;
        }

        /* Active faction dot */
        .ideo-dot {
            position: absolute;
            top: 50%;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #fff;
            transform: translate(-50%, -50%);
            z-index: 3;
            cursor: pointer;
            transition: left 0.4s ease;
            box-shadow: 0 0 6px rgba(0,0,0,0.5);
        }
        .ideo-dot:hover {
            transform: translate(-50%, -50%) scale(1.3);
            z-index: 10;
        }

        /* Tooltip on hover */
        .ideo-dot-tooltip {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: #222;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.72rem;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 20;
            border: 1px solid #444;
        }
        body.light-mode .ideo-dot-tooltip {
            background: #fff;
            color: #222;
            border-color: #ccc;
        }
        .ideo-dot:hover .ideo-dot-tooltip {
            opacity: 1;
        }

        /* Label summary area */
        .ideology-label-summary {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .ideology-label-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.82rem;
        }
        .ideology-label-swatch {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .ideology-label-name {
            font-weight: bold;
            color: var(--text-primary);
            min-width: 160px;
        }
        .ideology-label-text {
            color: var(--text-secondary);
            font-style: italic;
        }

        /* ===== IDEOLOGY EVENTS FEED ===== */
        .ideology-events-section { margin-top: 30px; }
        .ideology-event-item {
            padding: 12px;
            background: var(--bg-card);
            border-radius: 4px;
            margin-bottom: 10px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .ideology-event-item:last-child { margin-bottom: 0; }
        .ideology-event-icon { font-size: 1.2rem; flex-shrink: 0; width: 28px; text-align: center; padding-top: 2px; }
        .ideology-event-content { flex: 1; }
        .ideology-event-message { font-size: 0.85rem; color: var(--text-primary); margin-bottom: 4px; }
        .ideology-event-meta { font-size: 0.7rem; color: var(--text-muted); }
        .ideology-event-item.severity-minor  { border-left: 3px solid var(--blue); }
        .ideology-event-item.severity-major  { border-left: 3px solid var(--orange); }
        .ideology-event-item.severity-extreme { border-left: 3px solid var(--red); }
        .ideology-event-item.hypocrisy {
            border-left: 3px solid #ff1744;
            background: rgba(255, 23, 68, 0.08);
        }
        body.light-mode .ideology-event-item.hypocrisy { background: rgba(255, 23, 68, 0.06); }
        .ideology-events-empty {
            text-align: center; color: var(--text-muted); font-style: italic; padding: 20px;
        }
    </style>
</head>
<body>
<div id="top-bar"></div>
<div id="content-area">
    <div class="loading-container">
        <div class="loading-spinner"></div>
        <div>Loading parties...</div>
    </div>
</div>
<script src="js/supabase-client.js"></script>
<script src="js/common.js"></script>
<script src="js/game-common.js"></script>
<script>
let currentFaction = null;
let currentNation = null;

// Ideology data caches
let ideologyDataMap = {};       // factionId -> faction_ideology row
let ideologyEventsCache = [];   // recent drift/hypocrisy events
let allPartiesCache = [];       // all parties for this nation
let selectedChipIds = new Set(); // currently selected party IDs in comparison chart

// Faction colors for chart dots
const FACTION_COLORS = [
    '#ffcc00', '#4CAF50', '#2196F3', '#ff4444', '#ff9800',
    '#9C27B0', '#00BCD4', '#E91E63', '#8BC34A', '#FF5722'
];
let factionColorMap = {};

initPage('parties', async (state) => {
    const { nation, faction } = state;
    currentFaction = faction;
    currentNation = nation;
    initGameConfigForNation(nation);

    if (!nation) {
        document.getElementById('content-area').innerHTML = `
            <div class="placeholder-panel">
                <div class="ph-icon">🏛️</div>
                <h3>No Nation Selected</h3>
                <p>Your party is not assigned to a nation yet.</p>
            </div>`;
        return;
    }
    await renderPartiesPage(nation, faction);
});


// ===================================================================
// IDEOLOGY DATA LOADING
// ===================================================================

async function loadAllIdeologyData(nationId) {
    ideologyDataMap = {};
    ideologyEventsCache = [];

    const ideologies = await loadNationIdeologies(_supabase, nationId);
    for (const row of ideologies) {
        ideologyDataMap[row.faction_id] = row;
    }

    const { data: events } = await _supabase
        .from('event_log')
        .select('*')
        .eq('nation_id', nationId)
        .in('event_name', ['IDEOLOGY_DRIFT', 'IDEOLOGY_HYPOCRISY'])
        .order('fired_at_tick', { ascending: false })
        .limit(20);

    ideologyEventsCache = events || [];
}


// ===================================================================
// DYNAMIC IDEOLOGY TAGS (strongest 2 from spectrum data)
// ===================================================================

/**
 * Get the 2 strongest ideology positions from spectrum data.
 * Falls back to declared ideology_value_1/2 if no spectrum data exists.
 */
function getStrongestIdeologyTags(party) {
    const ideoRow = ideologyDataMap[party.id];

    if (!ideoRow) {
        // No spectrum data — use declared values
        const tags = [];
        if (party.ideology_value_1) tags.push({
            label: party.ideology_value_1,
            tagClass: 'tag-' + party.ideology_value_1.toLowerCase()
        });
        if (party.ideology_value_2) tags.push({
            label: party.ideology_value_2,
            tagClass: 'tag-' + party.ideology_value_2.toLowerCase()
        });
        return tags;
    }

    // Rank axes by absolute score, pick top 2
    const ranked = IDEOLOGY_AXES.map(axis => {
        const score = ideoRow[axis.key] || 0;
        const absScore = Math.abs(score);
        const sideLabel = score < 0 ? axis.leftLabel : axis.rightLabel;
        return { absScore, sideLabel };
    }).sort((a, b) => b.absScore - a.absScore);

    const top2 = ranked.slice(0, 2).filter(r => r.absScore > 0);

    if (top2.length === 0) {
        // True centrist — fall back to declared
        const tags = [];
        if (party.ideology_value_1) tags.push({
            label: party.ideology_value_1,
            tagClass: 'tag-' + party.ideology_value_1.toLowerCase()
        });
        if (party.ideology_value_2) tags.push({
            label: party.ideology_value_2,
            tagClass: 'tag-' + party.ideology_value_2.toLowerCase()
        });
        return tags;
    }

    return top2.map(r => ({
        label: r.sideLabel.toUpperCase(),
        tagClass: 'tag-' + r.sideLabel.toLowerCase()
    }));
}


// ===================================================================
// IDEOLOGY COMPARISON CHART (Design Guide Section 8)
// ===================================================================

/**
 * Build the full ideology comparison section.
 */
function buildIdeologySection(parties, faction) {
    factionColorMap = {};
    parties.forEach((p, i) => {
        factionColorMap[p.id] = FACTION_COLORS[i % FACTION_COLORS.length];
    });

    // Pre-select the player's party
    selectedChipIds = new Set();
    if (faction) selectedChipIds.add(faction.id);

    const chipsHTML = parties.map(p => {
        const color = factionColorMap[p.id];
        const isYours = p.id === faction?.id;
        const isSelected = selectedChipIds.has(p.id);
        return `<div class="ideology-party-chip ${isSelected ? 'selected' : ''} ${isYours ? 'your-chip' : ''}"
                     style="--chip-color: ${color};"
                     data-faction-id="${p.id}"
                     onclick="toggleIdeologyChip(this, '${p.id}')">
                    ${p.faction_name}${isYours ? ' ★' : ''}
                </div>`;
    }).join('');

    return `
        <div class="ideology-section">
            <div class="section-header">Ideology</div>
            <div class="ideology-party-selector">
                ${chipsHTML}
            </div>
            <div class="ideology-chart" id="ideology-chart">
                ${buildIdeologyChart()}
            </div>
        </div>`;
}

/**
 * Render the 5-axis chart with dots for all selected factions.
 */
function buildIdeologyChart() {
    const selectedIds = [...selectedChipIds];

    if (selectedIds.length === 0) {
        return '<div class="ideology-chart-empty">Select a party above to view their ideology spectrum.</div>';
    }

    const anyHasData = selectedIds.some(id => ideologyDataMap[id]);

    if (!anyHasData) {
        return '<div class="ideology-chart-empty">No ideology data yet. Spectrum positions update as factions vote on bills.</div>';
    }

    const axesHTML = IDEOLOGY_AXES.map(axis => {
        let dotsHTML = '';
        let ghostsHTML = '';

        for (const fId of selectedIds) {
            const ideoRow = ideologyDataMap[fId];
            if (!ideoRow) continue;

            const score = ideoRow[axis.key] || 0;
            const pct = ((score + 100) / 200) * 100;
            const color = factionColorMap[fId];
            const party = allPartiesCache.find(p => p.id === fId);
            const name = party?.faction_name || 'Unknown';
            const label = getIdeologyLabel(score, axis);

            dotsHTML += `
                <div class="ideo-dot" style="left:${pct}%;background:${color};">
                    <div class="ideo-dot-tooltip">
                        <strong>${name}</strong><br>
                        ${label} · ${score > 0 ? '+' : ''}${score}
                    </div>
                </div>`;

            // Ghost marker for declared starting position (±30)
            let declaredDir = null;
            if (ideoRow.declared_axis_1 === axis.key) declaredDir = ideoRow.declared_direction_1;
            else if (ideoRow.declared_axis_2 === axis.key) declaredDir = ideoRow.declared_direction_2;

            if (declaredDir !== null && declaredDir !== undefined) {
                const ghostScore = declaredDir > 0 ? 30 : -30;
                const ghostPct = ((ghostScore + 100) / 200) * 100;
                ghostsHTML += `
                    <div class="ideo-ghost-marker" style="left:${ghostPct}%;border-color:${color};"
                         title="${name}: declared position (${ghostScore > 0 ? '+' : ''}${ghostScore})"></div>`;
            }
        }

        const gradientBg = `linear-gradient(to right, ${axis.leftColor}33, ${axis.leftColor}11 40%, ${axis.rightColor}11 60%, ${axis.rightColor}33)`;

        return `
            <div class="ideo-axis">
                <div class="ideo-axis-label left">${axis.leftLabel}</div>
                <div class="ideo-axis-track" style="background:${gradientBg};">
                    <div class="ideo-axis-center"></div>
                    ${ghostsHTML}
                    ${dotsHTML}
                </div>
                <div class="ideo-axis-label right">${axis.rightLabel}</div>
            </div>`;
    }).join('');

    // Label summaries for selected factions
    const summariesHTML = selectedIds.map(fId => {
        const ideoRow = ideologyDataMap[fId];
        if (!ideoRow) return '';

        const color = factionColorMap[fId];
        const party = allPartiesCache.find(p => p.id === fId);
        const name = party?.faction_name || 'Unknown';
        const summary = getIdeologySummary(ideoRow);

        return `
            <div class="ideology-label-row">
                <div class="ideology-label-swatch" style="background:${color};"></div>
                <div class="ideology-label-name">${name}</div>
                <div class="ideology-label-text">${summary}</div>
            </div>`;
    }).filter(Boolean).join('');

    return axesHTML + (summariesHTML ?
        `<div class="ideology-label-summary">${summariesHTML}</div>` : '');
}

/** Toggle a party chip on/off and re-render the chart */
function toggleIdeologyChip(chipEl, factionId) {
    if (selectedChipIds.has(factionId)) {
        selectedChipIds.delete(factionId);
        chipEl.classList.remove('selected');
    } else {
        selectedChipIds.add(factionId);
        chipEl.classList.add('selected');
    }
    const chartEl = document.getElementById('ideology-chart');
    if (chartEl) chartEl.innerHTML = buildIdeologyChart();
}


// ===================================================================
// IDEOLOGY EVENTS FEED
// ===================================================================

function buildEventItem(event) {
    const effects = event.effects_applied || {};
    const isHypocrisy = event.event_name === 'IDEOLOGY_HYPOCRISY' || effects.type === 'hypocrisy';
    const severity = effects.severity || 'minor';

    let icon = '🔵';
    if (isHypocrisy) icon = '⚠️';
    else if (severity === 'extreme') icon = '🔴';
    else if (severity === 'major') icon = '🟠';

    const sevClass = isHypocrisy ? 'hypocrisy' : `severity-${severity}`;

    return `
        <div class="ideology-event-item ${sevClass}">
            <div class="ideology-event-icon">${icon}</div>
            <div class="ideology-event-content">
                <div class="ideology-event-message">${event.description_used || event.event_name}</div>
                <div class="ideology-event-meta">Tick ${event.fired_at_tick}${effects.axis ? ` · ${effects.axis}` : ''}${effects.delta ? ` · Δ${effects.delta > 0 ? '+' : ''}${effects.delta}` : ''}</div>
            </div>
        </div>`;
}

function buildIdeologyEventsFeed() {
    if (ideologyEventsCache.length === 0) return '';

    const eventsHTML = ideologyEventsCache.slice(0, 15).map(e => buildEventItem(e)).join('');

    return `
        <div class="ideology-events-section">
            <div class="section-header">Ideology Events</div>
            <div style="background:var(--bg-panel); border-radius:6px; padding:16px; max-height:350px; overflow-y:auto;">
                ${eventsHTML}
            </div>
        </div>`;
}


// ===================================================================
// MAIN PAGE RENDER
// ===================================================================

async function renderPartiesPage(nation, faction) {
    const isAutocracy = nation.government_type === 'Autocracy';
    const termPlural = isAutocracy ? 'Factions' : 'Parties';
    const termSingular = isAutocracy ? 'Faction' : 'Party';
    const headerText = isAutocracy ? 'Internal Factions' : 'Political Parties';

    document.getElementById('content-area').innerHTML = `
        <div class="panel-padding">
            <div class="section-header">${headerText} in ${nation.name}</div>
            <div class="loading-container" style="height:200px;">
                <div class="loading-spinner"></div>
                <div>Loading ${termPlural.toLowerCase()}...</div>
            </div>
        </div>`;

    try {
        const { data: parties, error } = await _supabase
            .from('factions').select('*')
            .eq('nation_id', nation.id).eq('faction_type', 'party')
            .order('seats', { ascending: false });
        if (error) throw error;

        if (!parties || parties.length === 0) {
            document.getElementById('content-area').innerHTML = `
                <div class="panel-padding">
                    <div class="section-header">${headerText} in ${nation.name}</div>
                    <div style="text-align:center;color:#666;padding:40px;">No ${termPlural.toLowerCase()} in this nation yet.</div>
                </div>`;
            return;
        }

        // Load voter bloc approval data for derived approval
        const { data: voterBlocs } = await _supabase
            .from('voter_blocs').select('id, bloc_name, population_weight')
            .eq('nation_id', nation.id).eq('is_active', true);

        const { data: blocApprovals } = await _supabase
            .from('faction_bloc_approval').select('faction_id, bloc_id, approval')
            .in('faction_id', parties.map(p => p.id));

        // Derive overall approval per party from bloc-weighted average
        function getDerivedApproval(factionId) {
            if (!blocApprovals || !voterBlocs || voterBlocs.length === 0) return null;
            const fa = blocApprovals.filter(a => a.faction_id === factionId);
            if (fa.length === 0) return null;
            let weightedSum = 0;
            for (const ba of fa) {
                const bloc = voterBlocs.find(b => b.id === ba.bloc_id);
                if (bloc) weightedSum += ba.approval * (parseFloat(bloc.population_weight) || 0);
            }
            return Math.round(weightedSum / 100);
        }

        // Attach derived approval to each party for sorting/display
        parties.forEach(p => {
            p._derivedApproval = getDerivedApproval(p.id);
        });

        // Sort by derived approval (fallback to old approval_rating, then seats)
        parties.sort((a, b) => {
            const aApp = a._derivedApproval ?? a.approval_rating ?? 0;
            const bApp = b._derivedApproval ?? b.approval_rating ?? 0;
            return bApp - aApp;
        });

        allPartiesCache = parties;

        // Load all ideology data
        await loadAllIdeologyData(nation.id);

        let election = null;
        if (!isAutocracy) {
            const { data: electionData } = await _supabase
                .from('elections').select('*')
.eq('nation_id', nation.id).eq('status', 'completed')
.order('election_tick', { ascending: false }).order('created_at', { ascending: false }).limit(1).maybeSingle();
            election = electionData;
        }

        let coalition = null;
        if (!isAutocracy) {
            coalition = await fetchActiveCoalition(_supabase, nation.id);
        }

        const coalitionPartyIds = coalition?.party_ids || [];
        const leadPartyId = coalition?.lead_party_id;
        const totalSeats = GAME_CONFIG.TOTAL_SEATS;
        const majorityThreshold = GAME_CONFIG.MAJORITY_SEATS;

        const govParties = [];
        const oppParties = [];

        parties.forEach(party => {
            let seats = 0;
            if (isAutocracy) {
                seats = party.seats || 0;
            } else if (election && election.results && election.results.seats) {
                const partyResult = election.results.seats.find(s => s.party_id === party.id);
                seats = partyResult?.seats || 0;
            }

            let status = 'opposition', statusText = 'Opposition';
            if (isAutocracy) {
                status = 'government'; statusText = 'Regime';
            } else if (coalitionPartyIds.includes(party.id)) {
                if (party.id === leadPartyId) { status = 'government'; statusText = 'Lead Party'; }
                else { status = 'coalition'; statusText = 'Coalition'; }
            } else if (seats >= majorityThreshold) {
                status = 'government'; statusText = 'Government';
            }

            const entry = { party, seats, status, statusText };
            if (status === 'opposition') oppParties.push(entry);
            else govParties.push(entry);
        });

        function buildCard(entry) {
            const { party, seats, status, statusText } = entry;
            const isYourParty = party.id === faction?.id;

            let firstStatLabel, firstStatValue, firstStatClass;
            if (isAutocracy) {
                const loyalty = party.loyalty ?? 50;
                firstStatLabel = 'Faction Loyalty';
                firstStatValue = loyalty + '%';
                firstStatClass = loyalty >= 30 ? 'good' : loyalty < 15 ? 'bad' : '';
            } else {
                const approval = party._derivedApproval ?? party.approval_rating ?? 0;
                firstStatLabel = 'Approval';
                firstStatValue = approval + '%';
                firstStatClass = approval >= 50 ? 'good' : approval <= 30 ? 'bad' : '';
            }

            // Dynamic ideology tags: strongest 2 from spectrum (or declared fallback)
            const ideoTags = getStrongestIdeologyTags(party);
            const ideoTagsHTML = ideoTags.length > 0
                ? ideoTags.map(t => `<span class="ideology-tag ${t.tagClass}">${t.label}</span>`).join('')
                : (isAutocracy ? '<span style="color:#666;font-style:italic;">Regime Faction</span>' : '');

            return `
                <div class="party-display-card ${isYourParty ? 'your-party' : ''}">
                    <div class="party-card-header">
                        <div class="party-card-name">
                            <div class="party-display-name">
                                ${party.faction_name}
                                ${party.is_npc ? '<span class="party-npc-badge">AI</span>' : ''}
                                ${isYourParty ? `<span style="color:#ffcc00;font-size:0.75rem;margin-left:8px;">★ YOUR ${termSingular.toUpperCase()}</span>` : ''}
                            </div>
                            <div class="party-display-abbr">${party.abbreviation || '—'}</div>
                        </div>
                        <div class="party-status-badge status-${status}">${statusText}</div>
                    </div>
                    <div class="party-display-ideologies">

                    </div>
                    <div class="party-display-stats">

                            <div class="party-stat-label">Seats</div>

                            <div class="party-stat-label">Action Points</div>

                        </div>
                        ${!isAutocracy ? `<div class="party-stat-item">
                            <div class="party-stat-label">${termSingular} Funds</div>
                            <div class="party-stat-value">$${(party.party_funds || 0).toLocaleString()}</div>
                        </div>` : ''}
                    </div>
                    ${(() => {
                        const mods = party.ideology_modifiers || {};
                        const entries = Object.entries(mods).filter(([_, v]) => v !== 0);
                        if (entries.length === 0 || isAutocracy) return '';
                        return `<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 8px;">
                            ${entries.map(([tag, val]) => {
                                const color = val > 0 ? '#4CAF50' : '#ff4444';
                                const sign = val > 0 ? '+' : '';
                                const tagLower = tag.charAt(0) + tag.slice(1).toLowerCase();
                                return `<span class="ideology-tag tag-${tag.toLowerCase()}" style="font-size:0.65rem;padding:2px 6px;">
                                    ${tagLower} <span style="color:${color};font-weight:bold;">${sign}${val}</span>
                                </span>`;
                            }).join('')}
                        </div>`;
                    })()}
                </div>`;
        }

        const governmentCount = govParties.length;
        const oppositionCount = oppParties.length;
        const isRulingFaction = isAutocracy && nation.ruling_faction_id === faction?.id;

        // Autocracy loyalty thresholds and seize power eligibility
        let myLoyalty = faction?.loyalty ?? 50;
        let isSuppressed = isAutocracy && myLoyalty < 15;
        let isDisloyal = isAutocracy && myLoyalty >= 15 && myLoyalty < 30;
        let isCoupCooldown = false;
        let cooldownTick = faction?.action_lockout_until_tick;
        let currentTick = 0;
        if (isAutocracy && faction) {
            const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
            currentTick = shard?.current_tick || 0;
            isCoupCooldown = cooldownTick && currentTick < cooldownTick;
        }
        let canSeizePower = false;
        if (isAutocracy && !isRulingFaction && faction) {
            const disloyalCount = parties.filter(p => p.id !== faction?.id && (p.loyalty ?? 50) < 30).length;
            canSeizePower = disloyalCount >= 2 && (faction?.action_points || 0) >= 15 && !isCoupCooldown;
        }

        // Build campaign actions
        let campaignActionsHTML = '';
        if (!isAutocracy) {
            campaignActionsHTML = `
            <div class="section-header" style="margin-top: 30px;">Your Party Resources</div>
            <div class="stat-grid" style="grid-template-columns: repeat(3, 1fr); margin-bottom: 12px;">
                <div class="stat-card"><div class="stat-label">Action Points</div><div class="stat-value" id="party-ap">${faction?.action_points || 0}</div></div>
                <div class="stat-card"><div class="stat-label">Party Funds</div><div class="stat-value" id="party-funds">$${(faction?.party_funds || 0).toLocaleString()}</div></div>
                <div class="stat-card"><div class="stat-label">Approval Rating</div><div class="stat-value" id="party-approval">${faction?._derivedApproval ?? faction?.approval_rating ?? 0}%</div></div>
            </div>
            ${(() => {
                if (!blocApprovals || !voterBlocs || !faction) return '';
                const myApprovals = blocApprovals.filter(a => a.faction_id === faction.id);
                if (myApprovals.length === 0) return '';
                return `<div style="background:#1a1a2e;border:1px solid #333;border-radius:8px;padding:12px;margin-bottom:16px;">
                    <div style="font-size:0.78rem;color:#aaa;font-weight:bold;margin-bottom:8px;">Approval by Voter Bloc</div>
                    <div style="display:flex;flex-direction:column;gap:4px;">
                        ${myApprovals.map(ba => {
                            const bloc = voterBlocs.find(b => b.id === ba.bloc_id);
                            if (!bloc) return '';
                            const color = ba.approval >= 55 ? '#4CAF50' : ba.approval <= 35 ? '#ff4444' : '#ff9800';
                            const barWidth = ba.approval;
                            return `<div style="display:flex;align-items:center;gap:8px;">
                                <span style="font-size:0.75rem;color:#888;min-width:140px;text-align:right;">${bloc.bloc_name}</span>
                                <div style="flex:1;background:#222;border-radius:3px;height:12px;overflow:hidden;">
                                    <div style="width:${barWidth}%;height:100%;background:${color};border-radius:3px;transition:width 0.3s;"></div>
                                </div>
                                <span style="font-size:0.75rem;color:${color};font-weight:bold;min-width:35px;">${ba.approval}%</span>
                            </div>`;
                        }).join('')}
                    </div>
                </div>`;
            })()}
            <div class="section-header" style="margin-top: 30px;">Recent Actions</div>
            <div id="action-log" class="action-log"><div class="action-log-empty">No actions taken yet this campaign.</div></div>`;
        } else {
            const loyaltyColor = myLoyalty >= 30 ? '#4CAF50' : myLoyalty >= 15 ? '#ff9800' : '#ff4444';
            const statusText = myLoyalty >= 30 ? 'LOYAL' : myLoyalty >= 15 ? 'DISLOYAL' : 'SUPPRESSED';
            const statusColor = loyaltyColor;

            campaignActionsHTML = `
            <div class="section-header" style="margin-top: 30px;">Your Faction Resources</div>
            <div class="stat-grid" style="grid-template-columns: repeat(4, 1fr); margin-bottom: 24px;">
                <div class="stat-card"><div class="stat-label">Action Points</div><div class="stat-value" id="party-ap">${faction?.action_points || 0}</div></div>
                <div class="stat-card"><div class="stat-label">Seats</div><div class="stat-value" id="party-seats">${faction?.seats || 0} / ${totalSeats}</div></div>
                <div class="stat-card"><div class="stat-label">Faction Loyalty</div><div class="stat-value" id="party-loyalty" style="color:${loyaltyColor}">${myLoyalty}%</div></div>
                <div class="stat-card"><div class="stat-label">Status</div><div class="stat-value" id="party-status" style="color:${statusColor}">${statusText}</div></div>
            </div>

            ${isCoupCooldown ? `
            <div style="background: #3a1a1a; border: 1px solid #ff9800; border-radius: 8px; padding: 16px; text-align: center; margin-bottom: 20px;">
                <div style="color: #ff9800; font-weight: bold; font-size: 1.1rem;">COUP COOLDOWN</div>
                <div style="color: #aaa; margin-top: 8px;">Seize Power is unavailable until tick ${cooldownTick} after your failed coup attempt. Other actions still work.</div>
            </div>` : ''}

            <div class="section-header">Faction Actions</div>

            ${isSuppressed ? `
            <div style="background: #3a1a1a; border: 1px solid #ff4444; border-radius: 8px; padding: 16px; margin-bottom: 16px;">
                <div style="color: #ff4444; font-weight: bold;">SUPPRESSED</div>
                <div style="color: #aaa; margin-top: 4px; font-size: 0.85rem;">Low loyalty status only. It no longer drains AP, seats, or ministry positions.</div>
            </div>` : ''}

            ${isDisloyal ? `
            <div style="background: #3a2a1a; border: 1px solid #ff9800; border-radius: 8px; padding: 16px; margin-bottom: 16px;">
                <div style="color: #ff9800; font-weight: bold;">DISLOYAL</div>
                <div style="color: #aaa; margin-top: 4px; font-size: 0.85rem;">Low loyalty status only. It no longer drains AP, seats, or ministry positions.</div>
            </div>` : ''}

            <div style="margin-bottom:12px;color:#888;font-size:0.82rem;">
                <strong>Loyalty Thresholds:</strong> Loyal (30+) = status only | Disloyal (15-29) = status only | Suppressed (&lt;15) = status only

                    <div class="action-desc">

                            ? 'Choose: <strong>Celebrate the Regime</strong> (+1D2 approval, +1 loyalty to ALL factions, +1 corruption) or <strong>Denounce Enemies</strong> (pick target, -1D2 loyalty, +1 approval, +1 polarization).'
                            : 'Pledge loyalty to the regime. Gain <strong>+1D2 loyalty</strong> for your faction.'

                            <option value="denounce">Denounce Enemies</option>

                    <div id="denounce-target-wrap" style="margin: 10px 0; display: none;">

                        </select>

                    <button class="action-btn" onclick="doRallySupport()">

                    <div class="action-header"><div class="action-title">Undermine</div><div class="action-cost">3 AP</div></div>
                    <div class="action-desc">

                        <br><span style="color: #ff9800; font-size: 0.78rem;">If target loyalty is below 20, they learn who did it.</span>
                    </div>
                    <div style="margin: 10px 0;">
                        <select id="undermine-target" class="action-select">

                    </div>
                    <button class="action-btn action-btn-risk" onclick="doUndermine()">
                        Undermine
                    </button>
                </div>

                ${isRulingFaction ? `
                <!-- PATRONAGE NETWORK (Ruling Only) -->
                <div class="action-card">
                    <div class="action-header"><div class="action-title">Patronage Network</div><div class="action-cost">2 AP</div></div>
                    <div class="action-desc">
                        Give <strong>$50,000</strong> from the national treasury to a faction. Target gains <strong>+2 loyalty</strong>. Nation <strong>+1 corruption</strong>.
                        <br><span style="color: #ff9800; font-size: 0.78rem;">If you pick yourself, all other factions lose 1 loyalty.</span>
                    </div>
                    <div style="margin: 10px 0;">
                        <select id="patronage-target" class="action-select">
                            <option value="">Select Faction...</option>
                        </select>
                    </div>
                    <button class="action-btn" onclick="doPatronageNetwork()">
                        Distribute Patronage
                    </button>
                </div>` : ''}

                ${!isRulingFaction ? `
                <!-- SEIZE POWER (Opposition Only) -->
                <div class="action-card" style="border-left-color: #ff4444;">
                    <div class="action-header"><div class="action-title" style="color: #ff4444;">Seize Power</div><div class="action-cost">15 AP</div></div>
                    <div class="action-desc">
                        Attempt to overthrow the ruling faction. Requires <strong>2+ factions with loyalty below 30</strong>.
                        <br><br>
                        Factions pick sides based on loyalty. Side with more seats wins.
                        <br><br>
                        <strong style="color: #4CAF50;">WIN:</strong> You become ruler. Old ruler becomes opposition at 50 loyalty.
                        <br><strong style="color: #ff4444;">FAIL:</strong> -25 seats, -20 approval, loyalty=0, purged from ministries. Seize Power blocked for 6 ticks.
                    </div>
                    <button class="action-btn" style="background: ${canSeizePower ? '#ff4444' : '#555'};"
                        onclick="doSeizePower()"
                        ${(!canSeizePower || isCoupCooldown) ? 'disabled' : ''}
                        ${isCoupCooldown ? 'title="Coup cooldown active"' : !canSeizePower ? 'title="Need 2+ factions with loyalty below 30 and 15 AP"' : ''}>
                        ${isCoupCooldown ? 'Coup Cooldown' : canSeizePower ? 'Seize Power' : 'Cannot Seize (Need 2+ disloyal)'}
                    </button>
                </div>` : ''}
            </div>
            <div class="section-header" style="margin-top: 30px;">Recent Actions</div>
            <div id="action-log" class="action-log"><div class="action-log-empty">No actions taken yet.</div></div>`;
        }

        // Build the single ideology comparison section
        const ideologySectionHTML = buildIdeologySection(parties, faction);
        const ideologyEventsFeedHTML = buildIdeologyEventsFeed();

        document.getElementById('content-area').innerHTML = `
            <div class="panel-padding">
                <div class="section-header">${headerText} in ${nation.name}</div>

                <div class="stat-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:24px;">
                    <div class="stat-card"><div class="stat-label">Total ${termPlural}</div><div class="stat-value">${parties.length}</div></div>
                    <div class="stat-card"><div class="stat-label">${isAutocracy ? 'In Regime' : 'Government / Coalition'}</div><div class="stat-value" style="color:#4CAF50;">${governmentCount}</div></div>
                    <div class="stat-card"><div class="stat-label">${isAutocracy ? 'Max Factions' : 'Opposition'}</div><div class="stat-value" style="color:${isAutocracy ? '#ffcc00' : '#ff4444'};">${isAutocracy ? (nation.max_parties || 4) : oppositionCount}</div></div>
                    <div class="stat-card"><div class="stat-label">Total Seats</div><div class="stat-value">${totalSeats}</div></div>
                </div>

                ${isAutocracy ? `
                    <div class="parties-section-label regime">⚡ Regime Factions</div>
                    <div class="parties-display-grid">${govParties.map(buildCard).join('')}</div>
                ` : `
                    <div class="parties-section-label gov">🏛️ Government / Coalition</div>
                    ${govParties.length > 0
                        ? `<div class="parties-display-grid">${govParties.map(buildCard).join('')}</div>`
                        : '<div class="parties-section-empty">No coalition formed yet.</div>'}

                    <div class="parties-section-label opp">⚔️ Opposition</div>
                    ${oppParties.length > 0
                        ? `<div class="parties-display-grid">${oppParties.map(buildCard).join('')}</div>`
                        : '<div class="parties-section-empty">No opposition parties.</div>'}
                `}

                <!-- Single Ideology Comparison Section -->
                ${ideologySectionHTML}

                <!-- Ideology Events Feed -->
                ${ideologyEventsFeedHTML}

                <!-- Campaign / Faction Actions -->
                ${campaignActionsHTML}
            </div>`;

        if (!isAutocracy) await populateDropdowns();
        else await populateAutocracyDropdowns();
        await loadActionLog();

    } catch (error) {
        console.error('Error loading parties:', error);
        document.getElementById('content-area').innerHTML = `
            <div class="panel-padding">
                <div class="section-header">${headerText} in ${nation.name}</div>
                <div style="text-align:center;color:#ff4444;padding:40px;">Error loading ${termPlural.toLowerCase()}. Please refresh.</div>
            </div>`;
    }
}

async function populateDropdowns() {
    if (!currentFaction || !currentNation) return;
    const { data: parties } = await _supabase
        .from('factions').select('id, faction_name')
        .eq('nation_id', currentNation.id).eq('faction_type', 'party').neq('id', currentFaction.id);
    const attackSelect = document.getElementById('attack-target');
    if (attackSelect && parties) {
        attackSelect.innerHTML = '<option value="">Select Target Party...</option>';
        parties.forEach(p => { attackSelect.innerHTML += `<option value="${p.id}">${p.faction_name}</option>`; });
    }
}

async function loadActionLog() {
    if (!currentFaction) return;
    const { data: actions } = await _supabase
        .from('campaign_actions').select('*').eq('party_id', currentFaction.id)
        .order('created_at', { ascending: false }).limit(5);
    const logDiv = document.getElementById('action-log');
    if (!logDiv) return;
    if (!actions || actions.length === 0) {
        logDiv.innerHTML = '<div class="action-log-empty">No actions taken yet.</div>';
        return;
    }
    logDiv.innerHTML = actions.map(a => {
        const date = new Date(a.created_at).toLocaleString();
        let message = '';
        if (a.action_type === 'lobby') message = `Lobbied ${a.result?.group_name || 'Unknown'}: Received $${(a.result?.payout || 0).toLocaleString()}`;
        else if (a.action_type === 'spread_rumors') message = `Spread Rumors vs ${a.result?.target || 'Unknown'}: Stole ${a.result?.seats_stolen || 0} seats, -${a.result?.stability_loss || 0} stability`;
        else if (a.action_type === 'give_speech') message = `Gave Speech: +${a.result?.approval_gain || 0}% approval`;
        else if (a.action_type === 'rally_celebrate') message = `Celebrated the Regime: +${a.result?.approval_gain || 0} approval, +1 loyalty to all`;
        else if (a.action_type === 'rally_denounce') message = `Denounced ${a.result?.target_name || 'Unknown'}: -${a.result?.loyalty_loss || 0} loyalty, +1 polarization`;
        else if (a.action_type === 'rally_pledge') message = `Pledged Loyalty: +${a.result?.loyalty_gain || 0} loyalty`;
        else if (a.action_type === 'undermine') message = `Undermined ${a.result?.target_name || 'Unknown'}: -${a.result?.loyalty_loss || 0} loyalty, -1 stability${a.result?.revealed ? ' (REVEALED!)' : ''}`;
        else if (a.action_type === 'patronage_network') message = `Patronage to ${a.result?.target_name || 'Unknown'}: +$50k, +2 loyalty, +1 corruption${a.result?.is_self ? ' (hoarding!)' : ''}`;
        else if (a.action_type === 'seize_power_success') message = `SEIZED POWER! (${a.result?.challenger_seats || 0} vs ${a.result?.regime_seats || 0} seats)`;
        else if (a.action_type === 'seize_power_failed') message = `Failed Coup! -${a.result?.seats_lost || 0} seats, Seize Power blocked until tick ${a.result?.coup_cooldown_until || a.result?.lockout_until || '?'}`;
        return `<div class="action-log-item"><div class="action-log-time">Tick ${a.tick_performed} • ${date}</div><div class="action-log-message">${message}</div></div>`;
    }).join('');
}

async function populateAutocracyDropdowns() {
    if (!currentFaction || !currentNation) return;
    const { data: factions } = await _supabase
        .from('factions').select('id, faction_name, seats, loyalty')
        .eq('nation_id', currentNation.id).eq('faction_type', 'party').neq('id', currentFaction.id);
    if (!factions) return;

    // Undermine target dropdown
    const undermineSelect = document.getElementById('undermine-target');
    if (undermineSelect) {
        undermineSelect.innerHTML = '<option value="">Select Target Faction...</option>';
        factions.forEach(f => {
            undermineSelect.innerHTML += `<option value="${f.id}">${f.faction_name} (${f.seats} seats, ${f.loyalty ?? 50}% loyalty)</option>`;
        });
    }

    // Denounce target dropdown (ruling Rally Support)
    const denounceSelect = document.getElementById('denounce-target');
    if (denounceSelect) {
        denounceSelect.innerHTML = '<option value="">Select Target Faction...</option>';
        factions.forEach(f => {
            denounceSelect.innerHTML += `<option value="${f.id}">${f.faction_name}</option>`;
        });
    }

    // Patronage target dropdown (ruling Patronage Network)
    const patronageSelect = document.getElementById('patronage-target');
    if (patronageSelect) {
        // Keep existing "Select Faction..." option, add self + others
        patronageSelect.innerHTML = `<option value="">Select Faction...</option><option value="${currentFaction.id}">${currentFaction.faction_name} (Self)</option>`;
        factions.forEach(f => {
            patronageSelect.innerHTML += `<option value="${f.id}">${f.faction_name}</option>`;
        });
    }
}

function toggleDenounceTarget() {
    const mode = document.getElementById('rally-mode')?.value;
    const wrap = document.getElementById('denounce-target-wrap');
    if (wrap) wrap.style.display = mode === 'denounce' ? 'block' : 'none';
}

function updateAutocracyUI() {
    const apEl = document.getElementById('party-ap');
    const seatsEl = document.getElementById('party-seats');
    const loyaltyEl = document.getElementById('party-loyalty');
    const statusEl = document.getElementById('party-status');
    if (apEl) apEl.textContent = currentFaction.action_points || 0;
    if (seatsEl) seatsEl.textContent = (currentFaction.seats || 0) + ' / ' + GAME_CONFIG.TOTAL_SEATS;

    const loyalty = currentFaction.loyalty ?? 50;
    let loyaltyColor, statusText;
    if (loyalty >= 30) { loyaltyColor = '#4CAF50'; statusText = 'LOYAL'; }
    else if (loyalty >= 15) { loyaltyColor = '#ff9800'; statusText = 'DISLOYAL'; }
    else { loyaltyColor = '#ff4444'; statusText = 'SUPPRESSED'; }

    if (loyaltyEl) { loyaltyEl.textContent = loyalty + '%'; loyaltyEl.style.color = loyaltyColor; }
    if (statusEl) {
        statusEl.textContent = statusText;
        statusEl.style.color = loyaltyColor;
    }
}

// ---- RALLY SUPPORT ----
async function doRallySupport() {
    if (!currentFaction || !currentNation) return;
    if ((currentFaction.action_points || 0) < 2) { alert('Not enough AP (need 2).'); return; }

    const apResult = await deductAP(_supabase, currentFaction.id, 2);
    if (!apResult.success) { alert('Not enough AP (need 2).'); return; }
    currentFaction.action_points = apResult.newAp;

    const isRuling = currentFaction.id === currentNation.ruling_faction_id;

    try {
        const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const tick = shard?.current_tick || 0;

        if (isRuling) {
            const mode = document.getElementById('rally-mode')?.value || 'celebrate';

            if (mode === 'celebrate') {
                const approvalGain = Math.floor(Math.random() * 2) + 1; // 1D2
                await adjustBlocApproval(_supabase, currentFaction.id, approvalGain);

                // +1 loyalty to ALL factions in nation
                const { data: allFactions } = await _supabase.from('factions')
                    .select('id, loyalty')
                    .eq('nation_id', currentNation.id).eq('faction_type', 'party');
                for (const f of (allFactions || [])) {
                    await _supabase.from('factions')
                        .update({ loyalty: Math.min(100, (f.loyalty ?? 50) + 1) })
                        .eq('id', f.id);
                }

                // +1 corruption to nation
                const { data: nat } = await _supabase.from('nations')
                    .select('corruption').eq('id', currentNation.id).single();
                await _supabase.from('nations')
                    .update({ corruption: Math.min(100, (nat?.corruption ?? 50) + 1) })
                    .eq('id', currentNation.id);

                await _supabase.from('campaign_actions').insert({
                    party_id: currentFaction.id, nation_id: currentNation.id,
                    action_type: 'rally_celebrate', tick_performed: tick,
                    result: { approval_gain: approvalGain, loyalty_gain_all: 1, corruption_gain: 1 }
                });

                currentFaction.approval_rating = Math.min(100, (currentFaction.approval_rating ?? 50) + approvalGain);
                currentFaction.loyalty = Math.min(100, (currentFaction.loyalty ?? 50) + 1);
                alert(`Celebrated the Regime! +${approvalGain} approval, +1 loyalty to all factions, +1 corruption.`);
            } else {
                // Denounce Enemies
                const targetId = document.getElementById('denounce-target')?.value;
                if (!targetId) { alert('Select a target faction!'); return; }

                const loyaltyLoss = Math.floor(Math.random() * 2) + 1; // 1D2
                const { data: target } = await _supabase.from('factions')
                    .select('loyalty, faction_name').eq('id', targetId).single();
                const newTargetLoyalty = Math.max(0, (target?.loyalty ?? 50) - loyaltyLoss);
                await _supabase.from('factions').update({ loyalty: newTargetLoyalty }).eq('id', targetId);

                await adjustBlocApproval(_supabase, currentFaction.id, 1);

                const { data: nat } = await _supabase.from('nations')
                    .select('polarization').eq('id', currentNation.id).single();
                await _supabase.from('nations')
                    .update({ polarization: Math.min(100, (nat?.polarization ?? 50) + 1) })
                    .eq('id', currentNation.id);

                await _supabase.from('campaign_actions').insert({
                    party_id: currentFaction.id, nation_id: currentNation.id,
                    action_type: 'rally_denounce', tick_performed: tick,
                    result: { target_name: target?.faction_name, loyalty_loss: loyaltyLoss, approval_gain: 1, polarization_gain: 1 }
                });

                currentFaction.approval_rating = Math.min(100, (currentFaction.approval_rating ?? 50) + 1);
                alert(`Denounced ${target?.faction_name}! -${loyaltyLoss} loyalty to them, +1 approval, +1 polarization.`);
            }
        } else {
            // Opposition: Pledge Loyalty (+1D2 loyalty to self)
            const loyaltyGain = Math.floor(Math.random() * 2) + 1;
            const newLoyalty = Math.min(100, (currentFaction.loyalty ?? 50) + loyaltyGain);
            await _supabase.from('factions')
                .update({ loyalty: newLoyalty })
                .eq('id', currentFaction.id);

            await _supabase.from('campaign_actions').insert({
                party_id: currentFaction.id, nation_id: currentNation.id,
                action_type: 'rally_pledge', tick_performed: tick,
                result: { loyalty_gain: loyaltyGain }
            });

            currentFaction.loyalty = newLoyalty;
            alert(`Pledged Loyalty! +${loyaltyGain} loyalty.`);
        }

        updateAutocracyUI();
        await loadActionLog();
        await markFactionActive(_supabase, currentFaction.id);
        sessionStorage.removeItem('nationhood_state');
    } catch (error) {
        console.error('Rally error:', error);
        alert('Error: ' + error.message);
    }
}

// ---- UNDERMINE ----
async function doUndermine() {
    if (!currentFaction || !currentNation) return;
    if ((currentFaction.action_points || 0) < 3) { alert('Not enough AP (need 3).'); return; }

    const targetId = document.getElementById('undermine-target')?.value;
    if (!targetId) { alert('Select a target faction!'); return; }

    if (!confirm('Undermine this faction? This will reduce their loyalty and cost -1 national stability.')) return;

    const apResult = await deductAP(_supabase, currentFaction.id, 3);
    if (!apResult.success) { alert('Not enough AP (need 3).'); return; }
    currentFaction.action_points = apResult.newAp;

    try {
        const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const tick = shard?.current_tick || 0;

        const loyaltyLoss = Math.floor(Math.random() * 3) + 1; // 1D3

        const { data: target } = await _supabase.from('factions')
            .select('loyalty, faction_name').eq('id', targetId).single();
        const newTargetLoyalty = Math.max(0, (target?.loyalty ?? 50) - loyaltyLoss);
        await _supabase.from('factions').update({ loyalty: newTargetLoyalty }).eq('id', targetId);

        const { data: nat } = await _supabase.from('nations')
            .select('stability').eq('id', currentNation.id).single();
        await _supabase.from('nations')
            .update({ stability: Math.max(0, (nat?.stability ?? 50) - 1) })
            .eq('id', currentNation.id);

        const revealed = newTargetLoyalty < 20;

        await _supabase.from('campaign_actions').insert({
            party_id: currentFaction.id, nation_id: currentNation.id,
            action_type: 'undermine', tick_performed: tick,
            result: { target_name: target?.faction_name, target_id: targetId, loyalty_loss: loyaltyLoss, stability_loss: 1, revealed }
        });

        let msg = `Undermined ${target?.faction_name}! -${loyaltyLoss} loyalty, -1 national stability.`;
        if (revealed) msg += '\n\nTheir loyalty is below 20 -- they know it was you!';
        alert(msg);

        updateAutocracyUI();
        await loadActionLog();
        await markFactionActive(_supabase, currentFaction.id);
        sessionStorage.removeItem('nationhood_state');
    } catch (error) {
        console.error('Undermine error:', error);
        alert('Error: ' + error.message);
    }
}

// ---- PATRONAGE NETWORK (Ruling Only) ----
async function doPatronageNetwork() {
    if (!currentFaction || !currentNation) return;
    if (currentFaction.id !== currentNation.ruling_faction_id) {
        alert('Only the ruling faction can use Patronage Network.');
        return;
    }
    if ((currentFaction.action_points || 0) < 2) { alert('Not enough AP (need 2).'); return; }

    const targetId = document.getElementById('patronage-target')?.value;
    if (!targetId) { alert('Select a target faction!'); return; }

    const isSelf = targetId === currentFaction.id;

    if (!confirm(
        `Distribute $50,000 from the national treasury to ${isSelf ? 'your own faction' : 'this faction'}?\n\n` +
        `Effects:\n` +
        `- Target: +$50,000 funds, +2 loyalty\n` +
        `- Nation: +1 corruption, -$50,000 treasury\n` +
        (isSelf ? '- All other factions: -1 loyalty\n' : '') +
        '\nProceed?'
    )) return;

    const apResult = await deductAP(_supabase, currentFaction.id, 2);
    if (!apResult.success) { alert('Not enough AP (need 2).'); return; }
    currentFaction.action_points = apResult.newAp;

    try {
        const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const tick = shard?.current_tick || 0;

        const { data: targetFaction } = await _supabase.from('factions')
            .select('loyalty, party_funds, faction_name').eq('id', targetId).single();

        // Target: +$50k funds, +2 loyalty
        await _supabase.from('factions').update({
            party_funds: (targetFaction?.party_funds || 0) + 50000,
            loyalty: Math.min(100, (targetFaction?.loyalty ?? 50) + 2)
        }).eq('id', targetId);

        // Nation: +1 corruption, -$50k budget
        const { data: nat } = await _supabase.from('nations')
            .select('corruption, budget').eq('id', currentNation.id).single();
        await _supabase.from('nations').update({
            corruption: Math.min(100, (nat?.corruption ?? 50) + 1),
            budget: (nat?.budget || 0) - 50000
        }).eq('id', currentNation.id);

        // If self: all other factions -1 loyalty
        if (isSelf) {
            const { data: otherFactions } = await _supabase.from('factions')
                .select('id, loyalty')
                .eq('nation_id', currentNation.id).eq('faction_type', 'party')
                .neq('id', currentFaction.id);
            for (const f of (otherFactions || [])) {
                await _supabase.from('factions')
                    .update({ loyalty: Math.max(0, (f.loyalty ?? 50) - 1) })
                    .eq('id', f.id);
            }
        }

        await _supabase.from('campaign_actions').insert({
            party_id: currentFaction.id, nation_id: currentNation.id,
            action_type: 'patronage_network', tick_performed: tick,
            result: {
                target_name: targetFaction?.faction_name, target_id: targetId,
                is_self: isSelf, funds_transferred: 50000, loyalty_gain: 2,
                corruption_gain: 1, others_loyalty_loss: isSelf ? 1 : 0
            }
        });

        if (isSelf) currentFaction.loyalty = Math.min(100, (currentFaction.loyalty ?? 50) + 2);
        alert(`Patronage distributed! ${targetFaction?.faction_name} received $50,000 and +2 loyalty. Nation +1 corruption.` +
            (isSelf ? '\nAll other factions: -1 loyalty.' : ''));

        updateAutocracyUI();
        await loadActionLog();
        await markFactionActive(_supabase, currentFaction.id);
        sessionStorage.removeItem('nationhood_state');
    } catch (error) {
        console.error('Patronage error:', error);
        alert('Error: ' + error.message);
    }
}

// ---- SEIZE POWER (Opposition Only) ----
async function doSeizePower() {
    if (!currentFaction || !currentNation) return;
    if (currentFaction.id === currentNation.ruling_faction_id) {
        alert('You are already the ruling faction.');
        return;
    }

    if ((currentFaction.action_points || 0) < 15) { alert('Not enough AP (need 15).'); return; }

    // Atomic AP deduction — prevents race conditions and double-spend
    const apResult = await deductAP(_supabase, currentFaction.id, 15);
    if (!apResult.success) { alert('Not enough AP (need 15).'); return; }
    currentFaction.action_points = apResult.newAp;

    const { data: allFactions } = await _supabase.from('factions')
        .select('id, faction_name, seats, loyalty')
        .eq('nation_id', currentNation.id).eq('faction_type', 'party');

    const disloyalFactions = (allFactions || []).filter(f =>
        f.id !== currentFaction.id && (f.loyalty ?? 50) < 30
    );

    if (disloyalFactions.length < 2) {
        alert('Cannot seize power. Need 2+ factions with loyalty below 30. Currently: ' + disloyalFactions.length);
        return;
    }

    // Preview the sides
    const rulingId = currentNation.ruling_faction_id;
    let previewRegime = [], previewChallenger = [];
    for (const f of (allFactions || [])) {
        if (f.id === currentFaction.id) { previewChallenger.push(f.faction_name); continue; }
        if (f.id === rulingId) { previewRegime.push(f.faction_name); continue; }
        if ((f.loyalty ?? 50) >= 30) previewRegime.push(f.faction_name);
        else previewChallenger.push(f.faction_name);
    }

    if (!confirm(
        'SEIZE POWER?\n\nCost: 15 AP\n\n' +
        'Predicted sides:\n' +
        'Regime: ' + previewRegime.join(', ') + '\n' +
        'Your side: ' + previewChallenger.join(', ') + '\n\n' +
        'Side with more total seats wins.\n\n' +
        'WIN: You become ruler. Old ruler becomes opposition at 50 loyalty.\n' +
        'FAIL: -25 seats, -20 approval, loyalty=0, purged from ministries. Seize Power blocked 6 ticks.\n\nProceed?'
    )) return;

    try {
        const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const tick = shard?.current_tick || 0;

        let regimeSeats = 0, challengerSeats = 0;
        const regimeSide = [], challengerSide = [];

        for (const f of (allFactions || [])) {
            if (f.id === currentFaction.id) {
                challengerSeats += f.seats || 0;
                challengerSide.push(f.faction_name);
                continue;
            }
            if (f.id === rulingId) {
                regimeSeats += f.seats || 0;
                regimeSide.push(f.faction_name);
                continue;
            }
            if ((f.loyalty ?? 50) >= 30) {
                regimeSeats += f.seats || 0;
                regimeSide.push(f.faction_name);
            } else {
                challengerSeats += f.seats || 0;
                challengerSide.push(f.faction_name);
            }
        }

        const challengerWins = challengerSeats > regimeSeats;

        if (challengerWins) {
            // === WIN ===
            // Old ruler: lose all ministries, become opposition at loyalty 50
            await _supabase.from('ministries')
                .update({ party_id: null, minister_first_name: null, minister_last_name: null, minister_age: null })
                .eq('nation_id', currentNation.id).eq('party_id', rulingId);

            await _supabase.from('factions').update({ loyalty: 50 }).eq('id', rulingId);

            // New ruler
            await _supabase.from('nations').update({ ruling_faction_id: currentFaction.id }).eq('id', currentNation.id);
            await _supabase.from('factions').update({ loyalty: 80 }).eq('id', currentFaction.id);

            await _supabase.from('campaign_actions').insert({
                party_id: currentFaction.id, nation_id: currentNation.id,
                action_type: 'seize_power_success', tick_performed: tick,
                result: { regime_seats: regimeSeats, challenger_seats: challengerSeats, regime_side: regimeSide, challenger_side: challengerSide, old_ruler_id: rulingId }
            });

            currentFaction.loyalty = 80;
            currentNation.ruling_faction_id = currentFaction.id;

            alert(
                'POWER SEIZED!\n\n' +
                `Your coalition: ${challengerSide.join(', ')} (${challengerSeats} seats)\n` +
                `Regime: ${regimeSide.join(', ')} (${regimeSeats} seats)\n\n` +
                'You are now the ruling faction!'
            );
        } else {
            // === FAIL ===
            const mySeats = currentFaction.seats || 0;

            await _supabase.from('factions').update({
                seats: Math.max(0, mySeats - 25),
                loyalty: 0,
                action_lockout_until_tick: tick + 6
            }).eq('id', currentFaction.id);
            await adjustBlocApproval(_supabase, currentFaction.id, -20);

            // Purge from ministries
            await _supabase.from('ministries')
                .update({ party_id: null, minister_first_name: null, minister_last_name: null, minister_age: null })
                .eq('nation_id', currentNation.id).eq('party_id', currentFaction.id);

            await _supabase.from('campaign_actions').insert({
                party_id: currentFaction.id, nation_id: currentNation.id,
                action_type: 'seize_power_failed', tick_performed: tick,
                result: { regime_seats: regimeSeats, challenger_seats: challengerSeats, regime_side: regimeSide, challenger_side: challengerSide, seats_lost: Math.min(25, mySeats), approval_lost: 20, coup_cooldown_until: tick + 6 }
            });

            currentFaction.seats = Math.max(0, mySeats - 25);
            currentFaction.approval_rating = Math.max(0, (currentFaction.approval_rating ?? 50) - 20);
            currentFaction.loyalty = 0;
            currentFaction.action_lockout_until_tick = tick + 6;

            alert(
                'COUP FAILED!\n\n' +
                `Your coalition: ${challengerSide.join(', ')} (${challengerSeats} seats)\n` +
                `Regime: ${regimeSide.join(', ')} (${regimeSeats} seats)\n\n` +
                `Consequences:\n` +
                `- Lost ${Math.min(25, mySeats)} seats\n` +
                `- Lost 20 approval\n` +
                `- Loyalty set to 0\n` +
                `- Purged from all ministries\n` +
                `- Cannot attempt Seize Power for 6 ticks`
            );
        }

        updateAutocracyUI();
        await loadActionLog();
        await markFactionActive(_supabase, currentFaction.id);
        sessionStorage.removeItem('nationhood_state');
    } catch (error) {
        console.error('Seize power error:', error);
        alert('Error: ' + error.message);
    }
}
