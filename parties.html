// Poll / voter bloc data

const GRASSROOTS_YIELD = [25000, 75000];

/**
 * Compute alignment (0-100) between a faction's ideology axes and a voter bloc's axes.
 * Uses faction_ideology (-100..+100) normalized to 0-100, compared to bloc axes (0-100).
 */
function computeFactionBlocAlignment(factionIdeo, bloc) {
    let totalScore = 0;
    let count = 0;
    for (const axis of IDEOLOGY_AXES) {
        const fVal = factionIdeo[axis.key] ?? 0; // -100 to +100
        const bVal = bloc['axis_' + axis.key] ?? 50; // 0 to 100
        const fNorm = (fVal + 100) / 2; // normalize to 0-100
        totalScore += 100 - Math.abs(fNorm - bVal);
        count++;
    }
    return count > 0 ? Math.round(totalScore / count) : 50;
}

function getAlignmentMultiplier(alignment) {
    if (alignment > 70) return { mult: 2.0, label: 'Champion', cls: 'donor-align-champion' };
    if (alignment >= 50) return { mult: 1.5, label: 'Good Fit', cls: 'donor-align-good' };
    if (alignment >= 30) return { mult: 1.0, label: 'Baseline', cls: 'donor-align-baseline' };
    return { mult: 0, label: 'Blocked', cls: 'donor-align-blocked' };
}

function rollDonorYield(config, alignment) {
    const [min, max] = config.yield;
    const base = min + Math.floor(Math.random() * (max - min + 1));
    const { mult } = getAlignmentMultiplier(alignment);
    let total = Math.round(base * mult);
    if (config.bonus?.type === 'money') total += config.bonus.amount;
    return total;
}

function rollGrassrootsYield(overallApproval) {
    const [min, max] = GRASSROOTS_YIELD;
    const base = min + Math.floor(Math.random() * (max - min + 1));
    if (overallApproval < 30) return Math.round(base * 0.5);
    if (overallApproval > 50) return Math.round(base * 1.5);
    return base;
}

// ===================================================================

async function loadAllIdeologyData(nationId) {

    for (const row of ideologies) {
        ideologyDataMap[row.faction_id] = row;

}


// ===================================================================
// DYNAMIC IDEOLOGY TAGS (strongest 2 from spectrum data)
// ===================================================================

/**
 * Get the 2 strongest ideology positions from spectrum data.
 * Falls back to declared ideology_value_1/2 if no spectrum data exists.
 */
function getStrongestIdeologyTags(party) {
    const ideoRow = ideologyDataMap[party.id];

    if (!ideoRow) {
        // No spectrum data — use declared values
        const tags = [];
        if (party.ideology_value_1) tags.push({
            label: party.ideology_value_1,
            tagClass: 'tag-' + party.ideology_value_1.toLowerCase()
        });
        if (party.ideology_value_2) tags.push({
            label: party.ideology_value_2,
            tagClass: 'tag-' + party.ideology_value_2.toLowerCase()
        });
        return tags;
    }

    // Rank axes by absolute score, pick top 2
    const ranked = IDEOLOGY_AXES.map(axis => {
        const score = ideoRow[axis.key] || 0;
        const absScore = Math.abs(score);
        const sideLabel = score < 0 ? axis.leftLabel : axis.rightLabel;
        return { absScore, sideLabel };
    }).sort((a, b) => b.absScore - a.absScore);

    const top2 = ranked.slice(0, 2).filter(r => r.absScore > 0);

    if (top2.length === 0) {
        // True centrist — fall back to declared
        const tags = [];
        if (party.ideology_value_1) tags.push({
            label: party.ideology_value_1,
            tagClass: 'tag-' + party.ideology_value_1.toLowerCase()
        });
        if (party.ideology_value_2) tags.push({
            label: party.ideology_value_2,
            tagClass: 'tag-' + party.ideology_value_2.toLowerCase()
        });
        return tags;
    }

    return top2.map(r => ({
        label: r.sideLabel.toUpperCase(),
        tagClass: 'tag-' + r.sideLabel.toLowerCase()
    }));
}

/**
 * Build the full ideology comparison section.
 */
function buildIdeologySection(parties, faction) {
    factionColorMap = {};
    parties.forEach((p, i) => {
        factionColorMap[p.id] = FACTION_COLORS[i % FACTION_COLORS.length];
    });

    // Pre-select the player's party
    selectedChipIds = new Set();
    if (faction) selectedChipIds.add(faction.id);

    const chipsHTML = parties.map(p => {
        const color = factionColorMap[p.id];
        const isYours = p.id === faction?.id;
        const isSelected = selectedChipIds.has(p.id);
        return `<div class="ideology-party-chip ${isSelected ? 'selected' : ''} ${isYours ? 'your-chip' : ''}"
                     style="--chip-color: ${color};"
                     data-faction-id="${p.id}"
                     onclick="toggleIdeologyChip(this, '${p.id}')">
                    ${p.faction_name}${isYours ? ' ★' : ''}
                </div>`;
    }).join('');

    return `
        <div class="ideology-section">
            <div class="section-header">Ideology</div>
            <div class="ideology-party-selector">
                ${chipsHTML}
            </div>
            <div class="ideology-chart" id="ideology-chart">
                ${buildIdeologyChart()}
            </div>
        </div>`;
}

/**
 * Render the 5-axis chart with dots for all selected factions.
 */
function buildIdeologyChart() {
    const selectedIds = [...selectedChipIds];

    if (selectedIds.length === 0) {
        return '<div class="ideology-chart-empty">Select a party above to view their ideology spectrum.</div>';
    }

    const anyHasData = selectedIds.some(id => ideologyDataMap[id]);

    if (!anyHasData) {
        return '<div class="ideology-chart-empty">No ideology data yet. Spectrum positions update as factions vote on bills.</div>';
    }

    const axesHTML = IDEOLOGY_AXES.map(axis => {
        let dotsHTML = '';
        let ghostsHTML = '';

        for (const fId of selectedIds) {
            const ideoRow = ideologyDataMap[fId];
            if (!ideoRow) continue;

            const score = ideoRow[axis.key] || 0;
            const pct = ((score + 100) / 200) * 100;
            const color = factionColorMap[fId];
            const party = allPartiesCache.find(p => p.id === fId);
            const name = party?.faction_name || 'Unknown';
            const label = getIdeologyLabel(score, axis);

            dotsHTML += `
                <div class="ideo-dot" style="left:${pct}%;background:${color};">
                    <div class="ideo-dot-tooltip">
                        <strong>${name}</strong><br>
                        ${label} · ${score > 0 ? '+' : ''}${score}
                    </div>
                </div>`;

            // Ghost marker for declared starting position (±30)
            let declaredDir = null;
            if (ideoRow.declared_axis_1 === axis.key) declaredDir = ideoRow.declared_direction_1;
            else if (ideoRow.declared_axis_2 === axis.key) declaredDir = ideoRow.declared_direction_2;

            if (declaredDir !== null && declaredDir !== undefined) {
                const ghostScore = declaredDir > 0 ? 30 : -30;
                const ghostPct = ((ghostScore + 100) / 200) * 100;
                ghostsHTML += `
                    <div class="ideo-ghost-marker" style="left:${ghostPct}%;border-color:${color};"
                         title="${name}: declared position (${ghostScore > 0 ? '+' : ''}${ghostScore})"></div>`;
            }
        }

        const gradientBg = `linear-gradient(to right, ${axis.leftColor}33, ${axis.leftColor}11 40%, ${axis.rightColor}11 60%, ${axis.rightColor}33)`;

        return `
            <div class="ideo-axis">
                <div class="ideo-axis-label left">${axis.leftLabel}</div>
                <div class="ideo-axis-track" style="background:${gradientBg};">
                    <div class="ideo-axis-center"></div>
                    ${ghostsHTML}
                    ${dotsHTML}
                </div>
                <div class="ideo-axis-label right">${axis.rightLabel}</div>
            </div>`;
    }).join('');

    // Label summaries for selected factions
    const summariesHTML = selectedIds.map(fId => {
        const ideoRow = ideologyDataMap[fId];
        if (!ideoRow) return '';

        const color = factionColorMap[fId];
        const party = allPartiesCache.find(p => p.id === fId);
        const name = party?.faction_name || 'Unknown';
        const summary = getIdeologySummary(ideoRow);

        return `
            <div class="ideology-label-row">
                <div class="ideology-label-swatch" style="background:${color};"></div>
                <div class="ideology-label-name">${name}</div>
                <div class="ideology-label-text">${summary}</div>
            </div>`;
    }).filter(Boolean).join('');

    return axesHTML + (summariesHTML ?
        `<div class="ideology-label-summary">${summariesHTML}</div>` : '');
}

/** Toggle a party chip on/off and re-render the chart */
function toggleIdeologyChip(chipEl, factionId) {
    if (selectedChipIds.has(factionId)) {
        selectedChipIds.delete(factionId);
        chipEl.classList.remove('selected');
    } else {
        selectedChipIds.add(factionId);
        chipEl.classList.add('selected');
    }
    const chartEl = document.getElementById('ideology-chart');
    if (chartEl) chartEl.innerHTML = buildIdeologyChart();
}

async function renderPartiesPage(nation, faction) {
    const isAutocracy = isGovernmentAutocracy(nation);
    const termPlural = isAutocracy ? 'Factions' : 'Parties';
    const termSingular = isAutocracy ? 'Faction' : 'Party';
    const headerText = isAutocracy ? 'Internal Factions' : 'Political Parties';

    document.getElementById('content-area').innerHTML = `
        <div class="panel-padding">
            <div class="section-header">${headerText} in ${nation.name}</div>
            <div class="loading-container" style="height:200px;">
                <div class="loading-spinner"></div>
                <div>Loading ${termPlural.toLowerCase()}...</div>
            </div>
        </div>`;

    try {
        const { data: parties, error } = await _supabase
            .from('factions').select('*')
            .eq('nation_id', nation.id).eq('faction_type', 'party')
            .order('seats', { ascending: false });
        if (error) throw error;

        if (!parties || parties.length === 0) {
            document.getElementById('content-area').innerHTML = `
                <div class="panel-padding">
                    <div class="section-header">${headerText} in ${nation.name}</div>
                    <div style="text-align:center;color:#666;padding:40px;">No ${termPlural.toLowerCase()} in this nation yet.</div>
                </div>`;
            return;
        }

        // Load voter bloc approval data for derived approval
        const { data: voterBlocs } = await _supabase
            .from('voter_blocs').select('id, bloc_name, population_weight, axis_liberty_equality, axis_tradition_progress, axis_security_freedom, axis_globalism_nationalism, axis_individualism_collectivism')
            .eq('nation_id', nation.id).eq('is_active', true);

        const { data: blocApprovals } = await _supabase
            .from('faction_bloc_approval').select('faction_id, bloc_id, approval')
            .in('faction_id', parties.map(p => p.id));

        // Load current faction's donor cooldowns for Court Donors panel
        if (faction) {
            const { data: myBlocApprovals } = await _supabase
                .from('faction_bloc_approval')
                .select('id, bloc_id, approval, donor_cooldown_until_tick')
                .eq('faction_id', faction.id);
            _donorBlocApprovals = myBlocApprovals || [];
        }

        // Derive overall approval per party from bloc-weighted average
        function getDerivedApproval(factionId) {
            if (!blocApprovals || !voterBlocs || voterBlocs.length === 0) return null;
            const fa = blocApprovals.filter(a => a.faction_id === factionId);
            if (fa.length === 0) return null;
            let weightedSum = 0;
            for (const ba of fa) {
                const bloc = voterBlocs.find(b => b.id === ba.bloc_id);
                if (bloc) weightedSum += ba.approval * (parseFloat(bloc.population_weight) || 0);
            }
            return Math.round(weightedSum / 100);
        }

        // Attach derived approval to each party for sorting/display
        parties.forEach(p => {
            p._derivedApproval = getDerivedApproval(p.id);
        });

        // Sort by derived approval (fallback to old approval_rating, then seats)
        parties.sort((a, b) => {
            const aApp = a._derivedApproval ?? a.approval_rating ?? 0;
            const bApp = b._derivedApproval ?? b.approval_rating ?? 0;
            return bApp - aApp;
        });

        allPartiesCache = parties;
        _voterBlocs = voterBlocs || [];

        // Load shard date for poll display
        const { data: shardInfo } = await _supabase
            .from('shard').select('current_tick, current_date').eq('name', 'Alpha Shard').single();
        const currentShardTick = shardInfo?.current_tick || 0;
        const currentShardDate = shardInfo?.current_date || '';
        _currentShardTick = currentShardTick;
        _currentShardDate = currentShardDate;

        // Load latest poll data for player's party
        let lastPollData = null;
        let previousPollData = null;
        if (faction) {
            const { data: pollActions } = await _supabase
                .from('campaign_actions').select('*')
                .eq('party_id', faction.id)
                .eq('action_type', 'generate_poll')
                .order('created_at', { ascending: false })
                .limit(2);
            if (pollActions && pollActions.length > 0) {
                lastPollData = pollActions[0];
                if (pollActions.length > 1) previousPollData = pollActions[1];
            }
        }

        let lastCoalitionData = null;
        if (faction) {
            const { data: coalitionActions } = await _supabase
                .from('campaign_actions').select('tick_performed')
                .eq('party_id', faction.id)
                .eq('action_type', 'build_coalition')
                .order('created_at', { ascending: false })
                .limit(1);
            if (coalitionActions && coalitionActions.length > 0) lastCoalitionData = coalitionActions[0];
        }

        // Load all ideology data
        await loadAllIdeologyData(nation.id);

        let election = null;
        if (!isAutocracy) {
            const { data: electionData } = await _supabase
                .from('elections').select('*')
.eq('nation_id', nation.id).eq('status', 'completed')
.order('election_tick', { ascending: false }).order('created_at', { ascending: false }).limit(1).maybeSingle();
            election = electionData;
        }

        let coalition = null;
        if (!isAutocracy) {
            coalition = await fetchActiveCoalition(_supabase, nation.id);
        }

        const coalitionPartyIds = coalition?.party_ids || [];
        const leadPartyId = coalition?.lead_party_id;
        const totalSeats = GAME_CONFIG.TOTAL_SEATS;
        const majorityThreshold = GAME_CONFIG.MAJORITY_SEATS;

        const govParties = [];
        const oppParties = [];

        parties.forEach(party => {
            let seats = 0;
            if (isAutocracy) {
                seats = party.seats || 0;
            } else if (election && election.results && election.results.seats) {
                const partyResult = election.results.seats.find(s => s.party_id === party.id);
                seats = partyResult?.seats || 0;
            }

            let status = 'opposition', statusText = 'Opposition';
            if (isAutocracy) {
                status = 'government'; statusText = 'Regime';
            } else if (coalitionPartyIds.includes(party.id)) {
                if (party.id === leadPartyId) { status = 'government'; statusText = 'Lead Party'; }
                else { status = 'coalition'; statusText = 'Coalition'; }
            } else if (seats >= majorityThreshold) {
                status = 'government'; statusText = 'Government';
            }

            const entry = { party, seats, status, statusText };
            if (status === 'opposition') oppParties.push(entry);
            else govParties.push(entry);
        });

        function buildCard(entry) {
            const { party, seats, status, statusText } = entry;
            const isYourParty = party.id === faction?.id;

            // Dynamic ideology tags: strongest 2 from spectrum (or declared fallback)
            const ideoTags = getStrongestIdeologyTags(party);
            const ideoTagsHTML = ideoTags.length > 0
                ? ideoTags.map(t => `<span class="ideology-tag ${t.tagClass}">${t.label}</span>`).join('')
                : (isAutocracy ? '<span style="color:#666;font-style:italic;">Regime Faction</span>' : '');

            return `
                <div class="party-display-card ${isYourParty ? 'your-party' : ''}">
                    <div class="party-card-header">
                        <div class="party-card-name">
                            <div class="party-display-name">
                                ${party.faction_name}
                                ${party.is_npc ? '<span class="party-npc-badge">AI</span>' : ''}
                                ${isYourParty ? `<span style="color:#ffcc00;font-size:0.75rem;margin-left:8px;">★ YOUR ${termSingular.toUpperCase()}</span>` : ''}
                            </div>
                            <div class="party-display-abbr">${party.abbreviation || '—'}</div>
                        </div>
                        <div class="party-status-badge status-${status}">${statusText}</div>
                    </div>
                    <div class="party-display-ideologies">
                        ${ideoTagsHTML}

                    <div class="party-display-stats-compact">
                        <span class="party-compact-stat"><span class="party-compact-label">Seats</span> ${seats} / ${totalSeats}</span>
                        <span class="party-compact-stat"><span class="party-compact-label">AP</span> ${party.action_points || 0}</span>
                        ${isAutocracy ? (() => {
                            const loyalty = party.loyalty ?? 50;

                        })() : ''}
                    </div>
                </div>`;
        }

        const governmentCount = govParties.length;
        const oppositionCount = oppParties.length;
        const isRulingFaction = isAutocracy && nation.ruling_faction_id === faction?.id;

        // Autocracy loyalty thresholds and seize power eligibility
        let myLoyalty = faction?.loyalty ?? 50;

        let isCoupCooldown = false;
        let cooldownTick = faction?.action_lockout_until_tick;
        let currentTick = 0;
        if (isAutocracy && faction) {
            const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
            currentTick = shard?.current_tick || 0;
            isCoupCooldown = cooldownTick && currentTick < cooldownTick;

        let canSeizePower = false;
        if (isAutocracy && !isRulingFaction && faction) {

            canSeizePower = disloyalCount >= 2 && (faction?.action_points || 0) >= 15 && !isCoupCooldown;

        // Build campaign actions

        if (!isAutocracy) {
            campaignActionsHTML = `
            <div class="section-header" style="margin-top: 30px;">Your Party Resources</div>
            <div class="stat-grid" style="grid-template-columns: repeat(3, 1fr); margin-bottom: 12px;">

                    <div class="action-header"><div class="action-title">Undermine</div><div class="action-cost">3 AP</div></div>
                    <div class="action-desc">
                        Target a rival faction: <strong>-1D3 loyalty</strong>, nation <strong>-1 stability</strong>.
                        <br><span style="color: #ff9800; font-size: 0.78rem;">If target loyalty is below 20, they learn who did it.</span>
                    </div>
                    <div style="margin: 10px 0;">
                        <select id="undermine-target" class="action-select">
                            <option value="">Select Target Faction...</option>
                        </select>
                    </div>
                    <button class="action-btn action-btn-risk" onclick="doUndermine()">
                        Undermine
                    </button>
                </div>

                ${isRulingFaction ? `
                <!-- PATRONAGE NETWORK (Ruling Only) -->
                <div class="action-card">
                    <div class="action-header"><div class="action-title">Patronage Network</div><div class="action-cost">2 AP</div></div>
                    <div class="action-desc">
                        Give <strong>$50,000</strong> from the national treasury to a faction. Target gains <strong>+2 loyalty</strong>. Nation <strong>+1 corruption</strong>.
                        <br><span style="color: #ff9800; font-size: 0.78rem;">If you pick yourself, all other factions lose 1 loyalty.</span>
                    </div>
                    <div style="margin: 10px 0;">
                        <select id="patronage-target" class="action-select">
                            <option value="">Select Faction...</option>
                        </select>
                    </div>
                    <button class="action-btn" onclick="doPatronageNetwork()">
                        Distribute Patronage
                    </button>
                </div>` : ''}

                ${!isRulingFaction ? `
                <!-- SEIZE POWER (Opposition Only) -->
                <div class="action-card" style="border-left-color: #ff4444;">
                    <div class="action-header"><div class="action-title" style="color: #ff4444;">Seize Power</div><div class="action-cost">15 AP</div></div>
                    <div class="action-desc">
                        Attempt to overthrow the ruling faction. Requires <strong>2+ factions with loyalty below 30</strong>.
                        <br><br>
                        Factions pick sides based on loyalty. Side with more seats wins.
                        <br><br>
                        <strong style="color: #4CAF50;">WIN:</strong> You become ruler. Old ruler becomes opposition at 50 loyalty.
                        <br><strong style="color: #ff4444;">FAIL:</strong> -25 seats, -20 approval, loyalty=0, purged from ministries. Seize Power blocked for 6 ticks.
                    </div>
                    <button class="action-btn" style="background: ${canSeizePower ? '#ff4444' : '#555'};"
                        onclick="doSeizePower()"
                        ${(!canSeizePower || isCoupCooldown) ? 'disabled' : ''}
                        ${isCoupCooldown ? 'title="Coup cooldown active"' : !canSeizePower ? 'title="Need 2+ factions with loyalty below 30 and 15 AP"' : ''}>
                        ${isCoupCooldown ? 'Coup Cooldown' : canSeizePower ? 'Seize Power' : 'Cannot Seize (Need 2+ disloyal)'}
                    </button>
                </div>` : ''}
            </div>
            <div class="section-header" style="margin-top: 30px;">Recent Actions</div>
            <div id="action-log" class="action-log"><div class="action-log-empty">No actions taken yet.</div></div>`;
        }

        // Build the single ideology comparison section
        const ideologySectionHTML = buildIdeologySection(parties, faction);

        // Build Party Standings section (weighted amalgamation of all voter blocs)
        const standingsHTML = (() => {
            if (isAutocracy) return '';
            const sorted = [...parties].sort((a, b) => {
                const aApp = a._derivedApproval ?? a.approval_rating ?? 0;
                const bApp = b._derivedApproval ?? b.approval_rating ?? 0;
                return bApp - aApp;
            });
            const rows = sorted.map((p, i) => {
                const approval = p._derivedApproval ?? p.approval_rating ?? 0;
                const isYours = p.id === faction?.id;
                const origIdx = parties.indexOf(p);
                const color = FACTION_COLORS[origIdx % FACTION_COLORS.length];
                const barColor = approval >= 50 ? '#4CAF50' : approval >= 35 ? '#ff9800' : '#ff4444';
                return `<div class="standings-row${isYours ? ' standings-yours' : ''}">
                    <span class="standings-rank">${i + 1}</span>
                    <span class="standings-name" style="border-left: 3px solid ${color}; padding-left: 8px;">${p.abbreviation || p.faction_name}${isYours ? ' ★' : ''}</span>
                    <div class="standings-bar"><div class="standings-bar-fill" style="width:${approval}%;background:${barColor};"></div></div>
                    <span class="standings-value" style="color:${barColor};">${approval}%</span>
                </div>`;
            }).join('');
            return `<div class="standings-section">
                <div class="section-header">Party Standings</div>
                <div class="standings-container">
                    ${rows}
                    <div class="standings-note">Weighted by voter bloc size</div>
                </div>
            </div>`;
        })();

        document.getElementById('content-area').innerHTML = `
            <div class="panel-padding">
                <div class="section-header">${headerText} in ${nation.name}</div>

                <div class="stat-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:24px;">
                    <div class="stat-card"><div class="stat-label">Total ${termPlural}</div><div class="stat-value">${parties.length}</div></div>
                    <div class="stat-card"><div class="stat-label">${isAutocracy ? 'In Regime' : 'Government / Coalition'}</div><div class="stat-value" style="color:#4CAF50;">${governmentCount}</div></div>
                    <div class="stat-card"><div class="stat-label">${isAutocracy ? 'Max Factions' : 'Opposition'}</div><div class="stat-value" style="color:${isAutocracy ? '#ffcc00' : '#ff4444'};">${isAutocracy ? (nation.max_parties || 4) : oppositionCount}</div></div>
                    <div class="stat-card"><div class="stat-label">Total Seats</div><div class="stat-value">${totalSeats}</div></div>
                </div>

                ${standingsHTML}

                ${isAutocracy ? `
                    <div class="parties-section-label regime">⚡ Regime Factions</div>
                    <div class="parties-display-grid">${govParties.map(buildCard).join('')}</div>
                ` : `
                    <div class="parties-section-label gov">🏛️ Government / Coalition</div>
                    ${govParties.length > 0
                        ? `<div class="parties-display-grid">${govParties.map(buildCard).join('')}</div>`
                        : '<div class="parties-section-empty">No coalition formed yet.</div>'}

                    <div class="parties-section-label opp">⚔️ Opposition</div>
                    ${oppParties.length > 0
                        ? `<div class="parties-display-grid">${oppParties.map(buildCard).join('')}</div>`
                        : '<div class="parties-section-empty">No opposition parties.</div>'}
                `}

                <!-- Single Ideology Comparison Section -->
                ${ideologySectionHTML}

                <!-- Campaign / Faction Actions -->
                ${campaignActionsHTML}

                <!-- Disband Party (always at bottom) -->
                ${(() => {
                    if (!faction || faction.is_npc) return '';
                    const isRulingInAutocracy = isAutocracy && nation.ruling_faction_id === faction.id;
                    let disbandDisabled = false;
                    let disbandReason = '';
                    if (isRulingInAutocracy) {
                        disbandDisabled = true;
                        disbandReason = 'Ruling faction cannot disband';
                    } else if (faction.disband_cooldown_until_tick && faction.disband_cooldown_until_tick > currentShardTick) {
                        disbandDisabled = true;
                        const remaining = faction.disband_cooldown_until_tick - currentShardTick;
                        disbandReason = 'Cooldown (' + remaining + ' tick' + (remaining !== 1 ? 's' : '') + ')';
                    }
                    return '<div style="margin-top: 60px; padding-top: 30px; border-top: 1px solid #333;">' +
                        '<div class="action-card" style="border-left-color: #ff4444;">' +
                            '<div class="action-header">' +
                                '<div class="action-title" style="color: #ff4444;">Disband Party</div>' +
                            '</div>' +
                            '<div class="action-desc">' +
                                'Permanently leave ' + nation.name + '. Your seats remain vacant until the next election. ' +
                                'If you are PM or in the coalition, those roles are vacated. ' +
                                'You will need to join a new nation to continue playing.' +
                                '<br><span style="color: #888; font-size: 0.78rem;">Cooldown: 24 ticks after disbanding.</span>' +
                            '</div>' +
                            '<button class="action-btn" style="background: ' + (disbandDisabled ? '#555' : '#ff4444') + ';"' +
                                ' onclick="doDisbandParty()"' +
                                (disbandDisabled ? ' disabled' : '') +
                                (disbandDisabled ? ' title="' + disbandReason + '"' : '') + '>' +
                                (disbandDisabled ? disbandReason : 'Disband Party') +
                            '</button>' +
                        '</div>' +
                    '</div>';
                })()}
            </div>`;

        if (!isAutocracy) {
            await populateDropdowns();
            // Update poll button cooldown state
            if (faction && lastPollData) {
                const ticksSince = currentShardTick - (lastPollData.tick_performed || 0);
                if (ticksSince < POLL_COOLDOWN_TICKS) {
                    const btn = document.getElementById('btn-generate-poll');
                    if (btn) {
                        const ticksLeft = POLL_COOLDOWN_TICKS - ticksSince;
                        btn.disabled = true;
                        btn.textContent = `Cooldown (${ticksLeft} tick${ticksLeft !== 1 ? 's' : ''})`;
                        btn.style.background = '#555';
                    }
                }
            }
            // Update build coalition button cooldown state
            if (faction && lastCoalitionData) {
                const ticksSince = currentShardTick - (lastCoalitionData.tick_performed || 0);
                if (ticksSince < BUILD_COALITION_COOLDOWN_TICKS) {
                    const btn = document.getElementById('btn-build-coalition');
                    if (btn) {
                        const ticksLeft = BUILD_COALITION_COOLDOWN_TICKS - ticksSince;
                        btn.disabled = true;
                        btn.dataset.cooldown = 'true';
                        btn.textContent = `Cooldown (${ticksLeft} tick${ticksLeft !== 1 ? 's' : ''})`;
                        btn.style.background = '#555';
                    }
                }
            }
        } else {
            await populateAutocracyDropdowns();
        }
        await loadActionLog();

    } catch (error) {
        console.error('Error loading parties:', error);
        document.getElementById('content-area').innerHTML = `
            <div class="panel-padding">
                <div class="section-header">${headerText} in ${nation.name}</div>
                <div style="text-align:center;color:#ff4444;padding:40px;">Error loading ${termPlural.toLowerCase()}. Please refresh.</div>
            </div>`;
    }
}

async function populateDropdowns() {
    if (!currentFaction || !currentNation) return;
    const { data: parties } = await _supabase
        .from('factions').select('id, faction_name')
        .eq('nation_id', currentNation.id).eq('faction_type', 'party').neq('id', currentFaction.id);
    const attackSelect = document.getElementById('attack-target');
    if (attackSelect && parties) {
        attackSelect.innerHTML = '<option value="">Select Target Party...</option>';
        parties.forEach(p => { attackSelect.innerHTML += `<option value="${p.id}">${p.faction_name}</option>`; });
    }
}

async function loadActionLog() {
    if (!currentFaction) return;
    const { data: actions } = await _supabase
        .from('campaign_actions').select('*').eq('party_id', currentFaction.id)
        .order('created_at', { ascending: false }).limit(5);
    const logDiv = document.getElementById('action-log');
    if (!logDiv) return;
    if (!actions || actions.length === 0) {
        logDiv.innerHTML = '<div class="action-log-empty">No actions taken yet.</div>';
        return;
    }
    logDiv.innerHTML = actions.map(a => {
        const date = new Date(a.created_at).toLocaleString();
        let message = '';
        if (a.action_type === 'lobby') message = `Lobbied ${a.result?.group_name || 'Unknown'}: Received $${(a.result?.payout || 0).toLocaleString()}`;
        else if (a.action_type === 'spread_rumors') message = `Spread Rumors vs ${a.result?.target || 'Unknown'}: Stole ${a.result?.seats_stolen || 0} seats, -${a.result?.stability_loss || 0} stability`;
        else if (a.action_type === 'give_speech') message = `Gave Speech: +${a.result?.approval_gain || 0}% approval`;
        else if (a.action_type === 'rally_celebrate') message = `Celebrated the Regime: +${a.result?.approval_gain || 0} approval, +1 loyalty to all`;
        else if (a.action_type === 'rally_denounce') message = `Denounced ${a.result?.target_name || 'Unknown'}: -${a.result?.loyalty_loss || 0} loyalty, +1 polarization`;
        else if (a.action_type === 'rally_pledge') message = `Pledged Loyalty: +${a.result?.loyalty_gain || 0} loyalty`;
        else if (a.action_type === 'undermine') message = `Undermined ${a.result?.target_name || 'Unknown'}: -${a.result?.loyalty_loss || 0} loyalty, -1 stability${a.result?.revealed ? ' (REVEALED!)' : ''}`;
        else if (a.action_type === 'patronage_network') message = `Patronage to ${a.result?.target_name || 'Unknown'}: +$50k, +2 loyalty, +1 corruption${a.result?.is_self ? ' (hoarding!)' : ''}`;
        else if (a.action_type === 'claim_power') message = `CLAIMED POWER! Established government with ${a.result?.ministries_assigned || 0} ministers.`;
        else if (a.action_type === 'seize_power_success') message = `SEIZED POWER! (${a.result?.challenger_seats || 0} vs ${a.result?.regime_seats || 0} seats)`;
        else if (a.action_type === 'seize_power_failed') message = `Failed Coup! -${a.result?.seats_lost || 0} seats, Seize Power blocked until tick ${a.result?.coup_cooldown_until || a.result?.lockout_until || '?'}`;
        else if (a.action_type === 'generate_poll') {
            const blocCount = a.result?.blocs_polled || 0;
            const cost = a.result?.cost || 0;
            message = `Conducted Poll: ${blocCount} bloc${blocCount !== 1 ? 's' : ''} surveyed ($${cost.toLocaleString()})`;
        }
        else if (a.action_type === 'build_coalition') {
            const target = a.result?.target_bloc_name || 'Unknown';
            const attempt = a.result?.attempt_number || 1;
            const effectLabel = attempt === 1 ? 'full' : attempt === 2 ? 'half' : 'quarter';
            message = `Build Coalition: Pandered to ${target} (${effectLabel} effect) — net ${a.result?.net_weighted?.toFixed(2) ?? '?'} weighted approval`;
        }
        else if (a.action_type === 'court_donors') {
            const y = a.result?.yield || 0;
            const bn = a.result?.bloc_name || 'Unknown';
            const mult = a.result?.multiplier || 1;
            const bonus = a.result?.bonus ? ` + ${a.result.bonus}` : '';
            message = `Courted ${bn}: +$${y.toLocaleString()} (x${mult})${bonus}`;
        }
        else if (a.action_type === 'court_grassroots') {
            const y = a.result?.yield || 0;
            message = `Grassroots Fundraising: +$${y.toLocaleString()}`;
        }
        return `<div class="action-log-item"><div class="action-log-time">Tick ${a.tick_performed} • ${date}</div><div class="action-log-message">${message}</div></div>`;
    }).join('');
}

let _coalitionBlocApprovals = [];

async function openCoalitionPanel() {
    const container = document.getElementById('coalition-panel');
    if (!container) return;
    if (!currentFaction) { alert('No faction loaded.'); return; }
    if (_voterBlocs.length === 0) { alert('No voter blocs found.'); return; }

    if (container.classList.contains('open')) { closeCoalitionPanel(); return; }

    const tick = _currentShardTick;

    const { data: blocApprovals } = await _supabase
        .from('faction_bloc_approval').select('id, bloc_id, approval')
        .eq('faction_id', currentFaction.id);
    _coalitionBlocApprovals = blocApprovals || [];

    // Load recent pander history for diminishing returns
    const { data: recentPanders } = await _supabase
        .from('campaign_actions').select('result, tick_performed')
        .eq('party_id', currentFaction.id).eq('action_type', 'build_coalition')
        .gte('tick_performed', tick - BUILD_COALITION_PANDER_HISTORY_TICKS);
    const panderHistory = recentPanders || [];

    const panderCounts = {};
    for (const action of panderHistory) {
        const bid = action.result?.target_bloc_id;
        if (bid) panderCounts[bid] = (panderCounts[bid] || 0) + 1;
    }

    let blocsHTML = '';
    for (const bloc of _voterBlocs) {
        const opposition = PANDER_OPPOSITION_MAP[bloc.bloc_name];
        if (!opposition) continue;

        const popWeight = parseFloat(bloc.population_weight) || 0;
        const panderCount = panderCounts[bloc.id] || 0;

        let factor = 1.0;
        let dimLabel = '';
        if (panderCount === 1) { factor = 0.5; dimLabel = 'HALF effect (pandered 1x in last 10 ticks)'; }
        else if (panderCount >= 2) { factor = 0.25; dimLabel = 'QUARTER effect + \u22121 ALL blocs (pandered 2x+)'; }

        const gainRaw = 2 * factor;
        const gainWeighted = gainRaw * (popWeight / 100);

        let penaltyWeightedTotal = 0;
        const penaltyItemsHTML = opposition.map(opp => {
            const oppBloc = _voterBlocs.find(b => b.bloc_name === opp.bloc);
            const oppWeight = oppBloc ? (parseFloat(oppBloc.population_weight) || 0) : 0;
            const oppDeltaRaw = opp.delta * factor;
            const oppWeighted = oppDeltaRaw * (oppWeight / 100);
            penaltyWeightedTotal += oppWeighted;
            return `<div style="color:#ff9966;padding-left:8px;">${oppDeltaRaw % 1 === 0 ? oppDeltaRaw : oppDeltaRaw.toFixed(1)} ${opp.bloc} <span style="color:#777;">(${oppWeighted.toFixed(2)} wtd)</span></div>`;
        }).join('');

        let extraPenaltyWeighted = 0;
        let extraPenaltyHTML = '';
        if (panderCount >= 2) {
            const totalWeight = _voterBlocs.reduce((s, b) => s + (parseFloat(b.population_weight) || 0), 0);
            extraPenaltyWeighted = -1 * (totalWeight / 100);
            extraPenaltyHTML = `<div style="color:#ff6666;font-size:0.75rem;margin-top:4px;">\u22121 ALL blocs (empty pandering): ${extraPenaltyWeighted.toFixed(2)} wtd</div>`;
        }

        const netWeighted = gainWeighted + penaltyWeightedTotal + extraPenaltyWeighted;
        const netColor = netWeighted >= 0 ? '#4CAF50' : '#ff6666';

        blocsHTML += `
        <div class="donor-bloc-card" style="${panderCount > 0 ? 'border-color:#ff9800;' : ''}">
            <div class="donor-bloc-header">
                <div>
                    <div class="donor-bloc-name">${bloc.bloc_name}</div>
                    <div style="color:#888;font-size:0.78rem;">${popWeight}% of electorate</div>
                </div>
                <button class="action-btn" style="padding:6px 14px;font-size:0.82rem;" onclick="doBuildCoalition('${bloc.id}')">Pander</button>
            </div>
            <div style="margin-top:8px;font-size:0.82rem;">
                <div style="color:#4CAF50;">Gain: +${gainRaw % 1 === 0 ? gainRaw : gainRaw.toFixed(1)} ${bloc.bloc_name} <span style="color:#777;">(+${gainWeighted.toFixed(2)} wtd)</span></div>
                <div style="color:#ff9966;margin-top:2px;">Penalties:</div>
                ${penaltyItemsHTML}
                ${extraPenaltyHTML}
                <div style="margin-top:6px;border-top:1px solid #333;padding-top:4px;">
                    Net weighted: <span style="color:${netColor};font-weight:bold;">${netWeighted >= 0 ? '+' : ''}${netWeighted.toFixed(2)}</span>
                </div>
            </div>
            ${dimLabel ? `<div style="color:#ff9800;font-size:0.75rem;margin-top:6px;">\u26a0 Diminishing: ${dimLabel}</div>` : ''}
        </div>`;
    }

    container.innerHTML = `
        <div class="donor-panel-header">
            <div style="font-weight:bold;font-size:1rem;">Build Coalition — Select a Bloc to Pander To</div>
            <div style="color:#aaa;font-size:0.8rem;margin-top:4px;">Cost: ${BUILD_COALITION_AP_COST} AP + $${(BUILD_COALITION_MONEY_COST / 1000).toFixed(0)}k &nbsp;|&nbsp; Cooldown: ${BUILD_COALITION_COOLDOWN_TICKS} ticks (global)</div>
            <div style="color:#ff9966;font-size:0.78rem;margin-top:2px;">Net is always negative — pandering sharpens your base, it doesn't grow it.</div>
            <button onclick="closeCoalitionPanel()" style="margin-top:8px;background:#333;border:1px solid #555;color:#ccc;padding:4px 12px;border-radius:4px;cursor:pointer;">Close</button>
        </div>
        <div class="donor-blocs-list">${blocsHTML || '<div style="color:#888;padding:16px;">No blocs available.</div>'}</div>
    `;
    container.classList.add('open');
}

function closeCoalitionPanel() {
    const container = document.getElementById('coalition-panel');
    if (container) { container.classList.remove('open'); container.innerHTML = ''; }
}

async function doBuildCoalition(blocId) {
    if (!currentFaction || !currentNation) return;

    const bloc = _voterBlocs.find(b => b.id === blocId);
    if (!bloc) { alert('Voter bloc not found.'); return; }

    const opposition = PANDER_OPPOSITION_MAP[bloc.bloc_name];
    if (!opposition) { alert('No opposition map for this bloc.'); return; }

    if ((currentFaction.action_points || 0) < BUILD_COALITION_AP_COST) {
        alert(`Not enough AP (need ${BUILD_COALITION_AP_COST}).`);
        return;
    }
    if ((currentFaction.party_funds || 0) < BUILD_COALITION_MONEY_COST) {
        alert(`Not enough Party Funds (need $${(BUILD_COALITION_MONEY_COST / 1000).toFixed(0)}k, have $${((currentFaction.party_funds || 0) / 1000).toFixed(0)}k).`);
        return;
    }

    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const tick = shard?.current_tick || 0;

    // Check global cooldown
    const { data: lastCoalition } = await _supabase
        .from('campaign_actions').select('tick_performed')
        .eq('party_id', currentFaction.id).eq('action_type', 'build_coalition')
        .order('created_at', { ascending: false }).limit(1).maybeSingle();
    if (lastCoalition && (tick - lastCoalition.tick_performed) < BUILD_COALITION_COOLDOWN_TICKS) {
        const ticksLeft = BUILD_COALITION_COOLDOWN_TICKS - (tick - lastCoalition.tick_performed);
        alert(`Build Coalition cooldown: ${ticksLeft} tick${ticksLeft !== 1 ? 's' : ''} remaining.`);
        return;
    }

    // Count panders to this bloc within last 10 ticks (diminishing returns)
    const { data: recentBlocPanders } = await _supabase
        .from('campaign_actions').select('tick_performed')
        .eq('party_id', currentFaction.id).eq('action_type', 'build_coalition')
        .gte('tick_performed', tick - BUILD_COALITION_PANDER_HISTORY_TICKS)
        .filter('result->>target_bloc_id', 'eq', blocId);
    const panderCount = recentBlocPanders?.length || 0;

    let factor = 1.0;
    let attemptNumber = panderCount + 1;
    if (panderCount === 1) factor = 0.5;
    else if (panderCount >= 2) factor = 0.25;

    const gainRaw = Math.round(2 * factor);

    const effectLabel = panderCount === 0 ? 'full' : panderCount === 1 ? 'HALF' : 'QUARTER';
    const dimWarning = panderCount >= 2
        ? '\n\u26a0 QUARTER effect + extra \u22121 ALL blocs (empty pandering!)'
        : panderCount === 1 ? '\n\u26a0 HALF effect (pandered to them recently)' : '';
    const penaltyDesc = opposition.map(o => `${Math.round(o.delta * factor)} ${o.bloc}`).join(', ');
    const ordinal = ['st','nd','rd'][attemptNumber - 1] || 'th';
    const confirmMsg = `Pander to ${bloc.bloc_name}?\n\n` +
        `Effect: ${effectLabel} (${attemptNumber}${ordinal} pander within 10 ticks)\n` +
        `Gain: +${gainRaw} ${bloc.bloc_name}\n` +
        `Penalties: ${penaltyDesc}${dimWarning}\n\n` +
        `Cost: ${BUILD_COALITION_AP_COST} AP + $${(BUILD_COALITION_MONEY_COST / 1000).toFixed(0)}k\n` +
        `Cooldown: ${BUILD_COALITION_COOLDOWN_TICKS} ticks (global)`;
    if (!confirm(confirmMsg)) return;

    // Deduct AP
    const apResult = await deductAP(_supabase, currentFaction.id, BUILD_COALITION_AP_COST);
    if (!apResult.success) { alert('Not enough AP.'); return; }
    currentFaction.action_points = apResult.newAp;

    // Deduct funds
    const newFunds = (currentFaction.party_funds || 0) - BUILD_COALITION_MONEY_COST;
    await _supabase.from('factions').update({ party_funds: newFunds }).eq('id', currentFaction.id);
    currentFaction.party_funds = newFunds;

    try {
        let { data: allBlocApprovals, error: blocErr } = await _supabase
            .from('faction_bloc_approval').select('id, bloc_id, approval')
            .eq('faction_id', currentFaction.id);
        if (blocErr) throw new Error('Failed to load bloc approvals: ' + blocErr.message);

        if (!allBlocApprovals || allBlocApprovals.length === 0) {
            allBlocApprovals = await ensureBlocApprovals(_supabase, currentFaction.id, currentNation.id);
            if (!allBlocApprovals || allBlocApprovals.length === 0) {
                alert('No voter bloc data found.');
                return;
            }
        }

        const blocChanges = {};

        // Apply gain to target bloc
        const targetRow = allBlocApprovals.find(r => r.bloc_id === blocId);
        if (targetRow && gainRaw > 0) {
            const newApproval = Math.max(0, Math.min(100, targetRow.approval + gainRaw));
            await _supabase.from('faction_bloc_approval').update({ approval: newApproval }).eq('id', targetRow.id);
            blocChanges[blocId] = { delta: gainRaw, bloc_name: bloc.bloc_name };
            targetRow.approval = newApproval;
        }

        // Apply penalties to opposed blocs
        for (const opp of opposition) {
            const oppBloc = _voterBlocs.find(b => b.bloc_name === opp.bloc);
            if (!oppBloc) continue;
            const oppRow = allBlocApprovals.find(r => r.bloc_id === oppBloc.id);
            if (!oppRow) continue;
            const oppDelta = Math.round(opp.delta * factor);
            if (oppDelta === 0) continue;
            const newApproval = Math.max(0, Math.min(100, oppRow.approval + oppDelta));
            await _supabase.from('faction_bloc_approval').update({ approval: newApproval }).eq('id', oppRow.id);
            blocChanges[oppBloc.id] = { delta: oppDelta, bloc_name: opp.bloc };
            oppRow.approval = newApproval;
        }

        // Extra -1 all blocs for 3rd+ pander (empty pandering)
        if (panderCount >= 2) {
            for (const row of allBlocApprovals) {
                const newApproval = Math.max(0, Math.min(100, row.approval - 1));
                await _supabase.from('faction_bloc_approval').update({ approval: newApproval }).eq('id', row.id);
                if (blocChanges[row.bloc_id]) blocChanges[row.bloc_id].delta -= 1;
                else {
                    const bl = _voterBlocs.find(b => b.id === row.bloc_id);
                    blocChanges[row.bloc_id] = { delta: -1, bloc_name: bl?.bloc_name || row.bloc_id };
                }
                row.approval = newApproval;
            }
        }

        // Recalculate derived overall approval
        const newDerived = await recalcDerivedApproval(_supabase, currentFaction.id, allBlocApprovals);
        currentFaction._derivedApproval = newDerived;
        currentFaction.approval_rating = newDerived;

        // Compute net weighted for logging
        const popWeight = parseFloat(bloc.population_weight) || 0;
        let netWeighted = gainRaw * (popWeight / 100);
        for (const opp of opposition) {
            const oppBloc = _voterBlocs.find(b => b.bloc_name === opp.bloc);
            const oppWeight = oppBloc ? (parseFloat(oppBloc.population_weight) || 0) : 0;
            netWeighted += Math.round(opp.delta * factor) * (oppWeight / 100);
        }
        if (panderCount >= 2) {
            const totalWeight = _voterBlocs.reduce((s, b) => s + (parseFloat(b.population_weight) || 0), 0);
            netWeighted -= totalWeight / 100;
        }

        await _supabase.from('campaign_actions').insert({
            party_id: currentFaction.id,
            nation_id: currentNation.id,
            action_type: 'build_coalition',
            ap_cost: BUILD_COALITION_AP_COST,
            money_cost: BUILD_COALITION_MONEY_COST,
            tick_performed: tick,
            result: {
                target_bloc_id: blocId,
                target_bloc_name: bloc.bloc_name,
                attempt_number: attemptNumber,
                factor,
                gain: gainRaw,
                bloc_changes: blocChanges,
                net_weighted: Math.round(netWeighted * 100) / 100,
                new_derived_approval: newDerived,
                empty_pandering_penalty: panderCount >= 2
            }
        });

        const apEl = document.getElementById('party-ap');
        if (apEl) apEl.textContent = currentFaction.action_points || 0;
        const fundsEl = document.getElementById('party-funds');
        if (fundsEl) fundsEl.textContent = '$' + (currentFaction.party_funds || 0).toLocaleString();
        const approvalEl = document.getElementById('party-approval');
        if (approvalEl) approvalEl.textContent = (newDerived ?? currentFaction.approval_rating ?? 0) + '%';

        const penSummary = Object.values(blocChanges)
            .filter(c => c.delta < 0)
            .map(c => `${c.delta} ${c.bloc_name}`)
            .join(', ');
        alert(`Pandered to ${bloc.bloc_name}!\n\n+${gainRaw} approval with ${bloc.bloc_name}.\nPenalties: ${penSummary || 'none'}\nNet weighted: ${netWeighted >= 0 ? '+' : ''}${netWeighted.toFixed(2)}`);

        closeCoalitionPanel();
        await loadActionLog();
        await markFactionActive(_supabase, currentFaction.id);
        sessionStorage.removeItem('nationhood_state');

        const btn = document.getElementById('btn-build-coalition');
        if (btn) {
            btn.disabled = true;
            btn.dataset.cooldown = 'true';
            btn.textContent = `Cooldown (${BUILD_COALITION_COOLDOWN_TICKS} tick${BUILD_COALITION_COOLDOWN_TICKS !== 1 ? 's' : ''})`;
            btn.style.background = '#555';
        }

    } catch (error) {
        console.error('[BuildCoalition] Error:', error);
        alert('Build Coalition error: ' + error.message);
    }
}

let _donorBlocApprovals = []; // faction_bloc_approval rows with donor_cooldown_until_tick

function openDonorPanel() {
    const container = document.getElementById('donor-panel');
    if (!container) return;
    if (!currentFaction) { alert('No faction loaded.'); return; }
    if (_voterBlocs.length === 0) { alert('No voter blocs found.'); return; }

    // Toggle if already open
    if (container.classList.contains('open')) { closeDonorPanel(); return; }

    const factionIdeo = ideologyDataMap[currentFaction.id];
    const overallApproval = currentFaction._derivedApproval ?? currentFaction.approval_rating ?? 0;
    const tick = _currentShardTick;

    let blocsHTML = '';

    for (const bloc of _voterBlocs) {
        const config = DONOR_BLOC_CONFIG[bloc.bloc_name];
        if (!config) continue; // skip blocs not in the config

        const fba = _donorBlocApprovals.find(r => r.bloc_id === bloc.id);
        const approval = fba?.approval ?? 40;
        const cooldownTick = fba?.donor_cooldown_until_tick || 0;
        const alignment = factionIdeo ? computeFactionBlocAlignment(factionIdeo, bloc) : 50;
        const alignInfo = getAlignmentMultiplier(alignment);
        const onCooldown = cooldownTick > tick;
        const cooldownLeft = onCooldown ? cooldownTick - tick : 0;

        // Gate checks
        const approvalGateOk = approval > 30;
        const alignmentGateOk = alignment >= 30;
        const blocked = !approvalGateOk || !alignmentGateOk || onCooldown;

        let blockedReason = '';
        if (onCooldown) blockedReason = `Cooldown: ${cooldownLeft} tick${cooldownLeft !== 1 ? 's' : ''}`;
        else if (!approvalGateOk) blockedReason = 'Approval too low (need > 30)';
        else if (!alignmentGateOk) blockedReason = 'Platform too misaligned (need \u2265 30)';

        // Yield range display with multiplier
        const [minY, maxY] = config.yield;
        const displayMin = Math.round(minY * alignInfo.mult / 1000);
        const displayMax = Math.round(maxY * alignInfo.mult / 1000);
        const yieldText = alignInfo.mult > 0 ? `$${displayMin}k\u2013$${displayMax}k` : '\u2014';
        const multText = alignInfo.mult > 1 ? ` (x${alignInfo.mult})` : '';

        // Approval cost text
        const costParts = config.approvalCosts.map(c => `<span class="donor-cost-negative">${c.delta} ${c.blocName}</span>`).join(', ');
        // Bonus text
        let bonusText = '';
        if (config.bonus) {
            if (config.bonus.type === 'approval') bonusText = `<span class="donor-cost-positive">+${config.bonus.delta} approval (${config.bonus.label})</span>`;
            else if (config.bonus.type === 'money') bonusText = `<span class="donor-cost-positive">+$${(config.bonus.amount / 1000)}k (${config.bonus.label})</span>`;
        }

        const approvalColor = approval > 50 ? '#4CAF50' : approval > 30 ? '#ff9800' : '#ff4444';

        blocsHTML += `
        <div class="donor-bloc-row ${blocked ? 'disabled' : ''}">
            <div class="donor-bloc-name">${bloc.bloc_name}</div>
            <div class="donor-bloc-stats">
                <span class="stat-pill">Approval: <span style="color:${approvalColor}">${approval}%</span></span>
                <span class="stat-pill">Alignment: <span class="${alignInfo.cls}">${alignment}% ${alignInfo.label}</span></span>
                <span class="stat-pill donor-yield">${yieldText}${multText}</span>
            </div>
            ${blocked
                ? `<span class="donor-blocked-reason">${blockedReason}</span>`
                : `<button class="donor-court-btn" onclick="doCourtDonors('${bloc.id}')">Court</button>`
            }
            <div class="donor-cost-row">
                Costs: ${costParts}${bonusText ? ' | Bonus: ' + bonusText : ''}
            </div>
        </div>`;
    }

    // Grassroots Small Donors (always available)
    const grassMin = Math.round(GRASSROOTS_YIELD[0] / 1000);
    const grassMax = Math.round(GRASSROOTS_YIELD[1] / 1000);
    let grassMult = '';
    if (overallApproval < 30) grassMult = ' (x0.5)';
    else if (overallApproval > 50) grassMult = ' (x1.5)';

    blocsHTML += `
    <div class="donor-bloc-row donor-grassroots-row">
        <div class="donor-bloc-name" style="color: #4CAF50;">Grassroots Small Donors</div>
        <div class="donor-bloc-stats">
            <span class="stat-pill" style="color: #4CAF50;">Always Available</span>
            <span class="stat-pill">Overall Approval: ${overallApproval}%</span>
            <span class="stat-pill donor-yield">$${grassMin}k\u2013$${grassMax}k${grassMult}</span>
        </div>
        <button class="donor-court-btn" onclick="doCourtGrassroots()">Court</button>
        <div class="donor-cost-row" style="color: #4CAF50;">No approval cost. No cooldown. Yield scales with overall approval.</div>
    </div>`;

    container.innerHTML = `
        <div class="donor-panel-title">Court Donors \u2014 Select a Voter Bloc</div>
        ${blocsHTML}
        <div class="donor-panel-footer">
            <span style="font-size: 0.75rem; color: #888;">Gates: Approval > 30% AND Alignment \u2265 30%</span>
            <button onclick="closeDonorPanel()">Close</button>
        </div>
    `;
    container.classList.add('open');
}

function closeDonorPanel() {
    const container = document.getElementById('donor-panel');
    if (container) { container.classList.remove('open'); container.innerHTML = ''; }
}

async function doCourtDonors(blocId) {
    if (!currentFaction || !currentNation) return;

    const bloc = _voterBlocs.find(b => b.id === blocId);
    if (!bloc) { alert('Voter bloc not found.'); return; }

    const config = DONOR_BLOC_CONFIG[bloc.bloc_name];
    if (!config) { alert('No donor config for this bloc.'); return; }

    // Check AP
    if ((currentFaction.action_points || 0) < COURT_DONORS_AP_COST) {
        alert(`Not enough AP (need ${COURT_DONORS_AP_COST}).`);
        return;
    }

    // Fetch fresh tick
    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const tick = shard?.current_tick || 0;

    // Re-fetch bloc approval to check cooldown and approval freshly
    const { data: fbaRow } = await _supabase.from('faction_bloc_approval')
        .select('id, bloc_id, approval, donor_cooldown_until_tick')
        .eq('faction_id', currentFaction.id).eq('bloc_id', blocId).single();
    if (!fbaRow) { alert('No approval data found for this bloc.'); return; }

    const approval = fbaRow.approval ?? 40;
    const cooldownTick = fbaRow.donor_cooldown_until_tick || 0;

    if (cooldownTick > tick) {
        alert(`Cooldown: ${cooldownTick - tick} tick(s) remaining for ${bloc.bloc_name}.`);
        return;
    }
    if (approval <= 30) { alert(`Approval too low with ${bloc.bloc_name} (${approval}%, need > 30).`); return; }

    const factionIdeo = ideologyDataMap[currentFaction.id];
    const alignment = factionIdeo ? computeFactionBlocAlignment(factionIdeo, bloc) : 50;
    if (alignment < 30) { alert(`Platform too misaligned with ${bloc.bloc_name} (${alignment}%, need >= 30).`); return; }

    const alignInfo = getAlignmentMultiplier(alignment);

    // Confirm
    const [minY, maxY] = config.yield;
    const displayMin = Math.round(minY * alignInfo.mult / 1000);
    const displayMax = Math.round(maxY * alignInfo.mult / 1000);
    const costDesc = config.approvalCosts.map(c => `${c.delta} ${c.blocName}`).join(', ');
    let confirmMsg = `Court ${bloc.bloc_name} donors?\n\n`;
    confirmMsg += `Yield: $${displayMin}k\u2013$${displayMax}k (${alignInfo.label} x${alignInfo.mult})\n`;
    confirmMsg += `Approval costs: ${costDesc}\n`;
    if (config.bonus) confirmMsg += `Bonus: ${config.bonus.label}\n`;
    confirmMsg += `AP cost: ${COURT_DONORS_AP_COST}\n`;
    confirmMsg += `Cooldown: ${COURT_DONORS_COOLDOWN_TICKS} ticks`;
    if (!confirm(confirmMsg)) return;

    // Deduct AP
    const apResult = await deductAP(_supabase, currentFaction.id, COURT_DONORS_AP_COST);
    if (!apResult.success) { alert('Not enough AP.'); return; }
    currentFaction.action_points = apResult.newAp;

    try {
        // Roll yield
        const yield$ = rollDonorYield(config, alignment);

        // Add to party_funds
        const newFunds = (currentFaction.party_funds || 0) + yield$;
        await _supabase.from('factions').update({ party_funds: newFunds }).eq('id', currentFaction.id);
        currentFaction.party_funds = newFunds;

        // Apply approval bonus to the courted bloc only
        const { data: allBlocApprovals } = await _supabase.from('faction_bloc_approval')
            .select('id, bloc_id, approval').eq('faction_id', currentFaction.id);

        if (config.bonus?.type === 'approval') {
            const donorRow = allBlocApprovals?.find(r => r.bloc_id === blocId);
            if (donorRow) {
                donorRow.approval = Math.round(Math.max(0, Math.min(100, donorRow.approval + config.bonus.delta)));
                await _supabase.from('faction_bloc_approval')
                    .update({ approval: donorRow.approval }).eq('id', donorRow.id);
            }
        }

        const blocChanges = {};
        for (const cost of config.approvalCosts) {
            const targetBloc = _voterBlocs.find(b => b.bloc_name === cost.blocName);
            if (!targetBloc) continue;
            const targetRow = allBlocApprovals?.find(r => r.bloc_id === targetBloc.id);
            if (!targetRow) continue;
            const newApproval = Math.round(Math.max(0, Math.min(100, targetRow.approval + cost.delta)));
            await _supabase.from('faction_bloc_approval')
                .update({ approval: newApproval }).eq('id', targetRow.id);
            targetRow.approval = newApproval;
            blocChanges[targetBloc.id] = { delta: cost.delta, bloc_name: cost.blocName };
        }

        // Recalculate derived overall approval
        const newDerived = await recalcDerivedApproval(_supabase, currentFaction.id, allBlocApprovals);
        currentFaction._derivedApproval = newDerived;
        currentFaction.approval_rating = newDerived;

        // Set cooldown on the courted bloc
        await _supabase.from('faction_bloc_approval')
            .update({ donor_cooldown_until_tick: tick + COURT_DONORS_COOLDOWN_TICKS })
            .eq('id', fbaRow.id);

        // Log the campaign action
        await _supabase.from('campaign_actions').insert({
            party_id: currentFaction.id,
            nation_id: currentNation.id,
            action_type: 'court_donors',
            ap_cost: COURT_DONORS_AP_COST,
            tick_performed: tick,
            result: {
                bloc_name: bloc.bloc_name,
                bloc_id: blocId,
                yield: yield$,
                alignment,
                multiplier: alignInfo.mult,
                bonus: config.bonus?.label || null,
                approval_costs: blocChanges,
                new_derived_approval: newDerived
            }
        });

        // Update UI
        const apEl = document.getElementById('party-ap');
        if (apEl) apEl.textContent = currentFaction.action_points || 0;
        const fundsEl = document.getElementById('party-funds');
        if (fundsEl) fundsEl.textContent = '$' + (currentFaction.party_funds || 0).toLocaleString();
        const approvalEl = document.getElementById('party-approval');
        if (approvalEl) approvalEl.textContent = (newDerived ?? currentFaction.approval_rating ?? 0) + '%';

        let msg = `Courted ${bloc.bloc_name} donors!\n\n`;
        msg += `Received: $${yield$.toLocaleString()}\n`;
        msg += `Alignment: ${alignment}% (${alignInfo.label} x${alignInfo.mult})`;
        if (config.bonus) msg += `\nBonus: ${config.bonus.label}`;
        const costSummary = config.approvalCosts.map(c => `${c.delta} ${c.blocName}`).join(', ');
        msg += `\nApproval costs: ${costSummary}`;
        alert(msg);

        // Refresh donor panel and action log
        closeDonorPanel();
        // Reload donor cooldowns
        const { data: freshBlocApprovals } = await _supabase.from('faction_bloc_approval')
            .select('id, bloc_id, approval, donor_cooldown_until_tick')
            .eq('faction_id', currentFaction.id);
        _donorBlocApprovals = freshBlocApprovals || [];
        await loadActionLog();
        await markFactionActive(_supabase, currentFaction.id);
        sessionStorage.removeItem('nationhood_state');

    } catch (error) {
        console.error('[CourtDonors] Error:', error);
        alert('Court Donors error: ' + error.message);
    }
}

async function doCourtGrassroots() {
    if (!currentFaction || !currentNation) return;

    if ((currentFaction.action_points || 0) < COURT_DONORS_AP_COST) {
        alert(`Not enough AP (need ${COURT_DONORS_AP_COST}).`);
        return;
    }

    const overallApproval = currentFaction._derivedApproval ?? currentFaction.approval_rating ?? 0;
    const yield$ = rollGrassrootsYield(overallApproval);

    let msg = `Court Grassroots Small Donors?\n\n`;
    msg += `Estimated yield: $${GRASSROOTS_YIELD[0].toLocaleString()}\u2013$${GRASSROOTS_YIELD[1].toLocaleString()}`;
    if (overallApproval < 30) msg += ' (x0.5 — low approval)';
    else if (overallApproval > 50) msg += ' (x1.5 — high approval)';
    msg += `\nNo approval costs. AP cost: ${COURT_DONORS_AP_COST}`;
    if (!confirm(msg)) return;

    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const tick = shard?.current_tick || 0;

    const apResult = await deductAP(_supabase, currentFaction.id, COURT_DONORS_AP_COST);
    if (!apResult.success) { alert('Not enough AP.'); return; }
    currentFaction.action_points = apResult.newAp;

    try {
        const newFunds = (currentFaction.party_funds || 0) + yield$;
        await _supabase.from('factions').update({ party_funds: newFunds }).eq('id', currentFaction.id);
        currentFaction.party_funds = newFunds;

        await _supabase.from('campaign_actions').insert({
            party_id: currentFaction.id,
            nation_id: currentNation.id,
            action_type: 'court_grassroots',
            ap_cost: COURT_DONORS_AP_COST,
            tick_performed: tick,
            result: {
                yield: yield$,
                overall_approval: overallApproval
            }
        });

        const apEl = document.getElementById('party-ap');
        if (apEl) apEl.textContent = currentFaction.action_points || 0;
        const fundsEl = document.getElementById('party-funds');
        if (fundsEl) fundsEl.textContent = '$' + (currentFaction.party_funds || 0).toLocaleString();

        alert(`Grassroots fundraising: Received $${yield$.toLocaleString()}`);

        closeDonorPanel();
        await loadActionLog();
        await markFactionActive(_supabase, currentFaction.id);
        sessionStorage.removeItem('nationhood_state');

    } catch (error) {
        console.error('[CourtGrassroots] Error:', error);
        alert('Grassroots fundraising error: ' + error.message);
    }
}

function openPollSelector() {
    const container = document.getElementById('poll-selector');
    if (!container) { console.error('[Poll] No poll-selector container found'); return; }
    if (!currentFaction) { alert('No faction loaded.'); return; }
    if (_voterBlocs.length === 0) {
        alert('No voter blocs found for this nation. Cannot generate poll.');
        console.error('[Poll] _voterBlocs is empty');
        return;
    }

    // Check cooldown
    const btn = document.getElementById('btn-generate-poll');

    const blocsHTML = _voterBlocs.map(bloc => {
        // Derive ideology tags from axis values (< 35 → left, > 65 → right)
        const ideoTags = IDEOLOGY_AXES.map(axis => {
            const val = bloc['axis_' + axis.key];
            if (val != null && val < 35) return `<span class="ideology-tag tag-${axis.leftLabel.toLowerCase()}" style="font-size:0.6rem;padding:1px 5px;margin:1px;">${axis.leftLabel}</span>`;
            if (val != null && val > 65) return `<span class="ideology-tag tag-${axis.rightLabel.toLowerCase()}" style="font-size:0.6rem;padding:1px 5px;margin:1px;">${axis.rightLabel}</span>`;
            return '';
        }).filter(Boolean).join('');
        return `
        <label class="poll-bloc-check" style="flex-wrap:wrap;">
            <input type="checkbox" value="${bloc.id}" onchange="updatePollCost()">
            ${bloc.bloc_name}
            <span style="color:#666;font-size:0.72rem;margin-left:auto;">${parseFloat(bloc.population_weight) || 0}% pop</span>
            ${ideoTags ? `<div style="width:100%;padding-left:22px;margin-top:2px;">${ideoTags}</div>` : ''}
        </label>`;
    }).join('');

    container.innerHTML = `
        <div class="poll-selector-title">Select Voter Blocs to Poll</div>
        ${blocsHTML}
        <div style="margin-top:8px;">
            <label class="poll-bloc-check" style="color:#ffcc00;font-weight:bold;">
                <input type="checkbox" id="poll-select-all" onchange="togglePollSelectAll()">
                Select All ($${(_voterBlocs.length * POLL_COST_PER_BLOC).toLocaleString()})
            </label>
        </div>
        <div class="poll-selector-cost">
            <span class="cost-label">Cost: <span id="poll-cost-display">2 AP + $0</span></span>
            <span class="cost-label">Funds: $${(currentFaction.party_funds || 0).toLocaleString()}</span>
        </div>
        <div class="poll-submit-row">
            <button class="poll-cancel-btn" onclick="closePollSelector()">Cancel</button>
            <button class="poll-submit-btn" id="poll-submit-btn" onclick="doGeneratePoll()" disabled>Submit Poll</button>
        </div>
    `;
    container.classList.add('open');
}

function closePollSelector() {
    const container = document.getElementById('poll-selector');
    if (container) {
        container.classList.remove('open');
        container.innerHTML = '';
    }
}

function togglePollSelectAll() {
    const selectAll = document.getElementById('poll-select-all');
    if (!selectAll) return;
    const checks = document.querySelectorAll('#poll-selector input[type=checkbox]:not(#poll-select-all)');
    checks.forEach(cb => cb.checked = selectAll.checked);
    updatePollCost();
}

function updatePollCost() {
    const checks = document.querySelectorAll('#poll-selector input[type=checkbox]:not(#poll-select-all)');
    const count = [...checks].filter(cb => cb.checked).length;
    const cost = count * POLL_COST_PER_BLOC;
    const costDisplay = document.getElementById('poll-cost-display');
    if (costDisplay) costDisplay.textContent = `${POLL_AP_COST} AP + $${cost.toLocaleString()}`;
    const submitBtn = document.getElementById('poll-submit-btn');
    if (submitBtn) submitBtn.disabled = count === 0;
}

async function doGeneratePoll() {
    if (!currentFaction || !currentNation) return;

    // Gather selected blocs
    const checks = document.querySelectorAll('#poll-selector input[type=checkbox]:not(#poll-select-all)');
    const selectedBlocIds = [...checks].filter(cb => cb.checked).map(cb => cb.value);
    if (selectedBlocIds.length === 0) { alert('Select at least one voter bloc to poll.'); return; }

    // Check AP
    if ((currentFaction.action_points || 0) < POLL_AP_COST) {
        alert(`Not enough AP (need ${POLL_AP_COST}).`);
        return;
    }

    // Check funds
    const totalCost = selectedBlocIds.length * POLL_COST_PER_BLOC;
    if ((currentFaction.party_funds || 0) < totalCost) {
        alert(`Not enough Party Funds. Need $${totalCost.toLocaleString()}, have $${(currentFaction.party_funds || 0).toLocaleString()}.`);
        return;
    }

    // Fetch fresh tick for cooldown + insert
    const { data: shard } = await _supabase.from('shard').select('current_tick, current_date').eq('name', 'Alpha Shard').single();
    const tick = shard?.current_tick || 0;
    const shardDate = shard?.current_date || '';

    // Check cooldown (3 ticks since last poll)
    const { data: lastPoll, error: cooldownErr } = await _supabase
        .from('campaign_actions').select('tick_performed')
        .eq('party_id', currentFaction.id)
        .eq('action_type', 'generate_poll')
        .order('created_at', { ascending: false })
        .limit(1)
        .maybeSingle();

    if (cooldownErr) console.error('[Poll] Cooldown check error:', cooldownErr.message);

    if (lastPoll && (tick - lastPoll.tick_performed) < POLL_COOLDOWN_TICKS) {
        const ticksLeft = POLL_COOLDOWN_TICKS - (tick - lastPoll.tick_performed);
        alert(`Poll cooldown: ${ticksLeft} tick${ticksLeft !== 1 ? 's' : ''} remaining.`);
        return;
    }

    // Deduct AP
    const apResult = await deductAP(_supabase, currentFaction.id, POLL_AP_COST);
    if (!apResult.success) { alert('Not enough AP.'); return; }
    currentFaction.action_points = apResult.newAp;

    try {
        // Deduct party funds
        const newFunds = (currentFaction.party_funds || 0) - totalCost;
        const { error: fundsErr } = await _supabase.from('factions')
            .update({ party_funds: newFunds })
            .eq('id', currentFaction.id);
        if (fundsErr) throw new Error('Failed to deduct funds: ' + fundsErr.message);
        currentFaction.party_funds = newFunds;

        // Load actual bloc approval data
        const { data: actualApprovals, error: approvalErr } = await _supabase
            .from('faction_bloc_approval')
            .select('bloc_id, approval')
            .eq('faction_id', currentFaction.id)
            .in('bloc_id', selectedBlocIds);
        if (approvalErr) console.error('[Poll] Approval fetch error:', approvalErr.message);

        // Build poll results with margin of error
        const blocResults = {};
        for (const blocId of selectedBlocIds) {
            const actual = actualApprovals?.find(a => a.bloc_id === blocId);
            const realApproval = actual?.approval ?? 40;
            // 1D3 margin of error, randomly + or -
            const margin = Math.floor(Math.random() * 3) + 1;
            const direction = Math.random() < 0.5 ? 1 : -1;
            const shown = Math.max(0, Math.min(100, realApproval + (margin * direction)));
            blocResults[blocId] = { shown, margin };
        }

        // Calculate shown overall approval with 1D3 margin
        const derivedApproval = currentFaction._derivedApproval ?? currentFaction.approval_rating ?? 50;
        const overallMargin = Math.floor(Math.random() * 3) + 1;
        const overallDir = Math.random() < 0.5 ? 1 : -1;
        const shownOverall = Math.max(0, Math.min(100, derivedApproval + (overallMargin * overallDir)));

        // Save campaign action
        const { error: insertErr } = await _supabase.from('campaign_actions').insert({
            party_id: currentFaction.id,
            action_type: 'generate_poll',
            ap_cost: POLL_AP_COST,
            money_cost: totalCost,
            tick_performed: tick,
            result: {
                bloc_results: blocResults,
                blocs_polled: selectedBlocIds.length,
                cost: totalCost,
                shown_overall: shownOverall,
                poll_date: shardDate
            }
        });
        if (insertErr) throw new Error('Failed to save poll: ' + insertErr.message);

        // Update UI
        const fundsEl = document.getElementById('party-funds');
        if (fundsEl) fundsEl.textContent = '$' + newFunds.toLocaleString();
        const apEl = document.getElementById('party-ap');
        if (apEl) apEl.textContent = currentFaction.action_points || 0;

        closePollSelector();
        alert(`Poll complete! Surveyed ${selectedBlocIds.length} bloc${selectedBlocIds.length !== 1 ? 's' : ''} for $${totalCost.toLocaleString()}.`);

        // Reload to show new poll results
        await renderPartiesPage(currentNation, currentFaction);
    } catch (error) {
        console.error('[Poll] Error:', error);
        alert('Poll error: ' + error.message);
    }
}

function updateAutocracyUI() {
    const apEl = document.getElementById('party-ap');
    const seatsEl = document.getElementById('party-seats');
    const loyaltyEl = document.getElementById('party-loyalty');
    const statusEl = document.getElementById('party-status');
