            const coalitionId = btn.dataset.coalitionId;
            btn.disabled = true;
            btn.textContent = 'WITHDRAWING...';

            await _supabase.from('faction_coalitions').update({
                status: 'declined', resolved_at_tick: currentTick
            }).eq('id', coalitionId);

            await renderAutocracyParties(el, f, n);
        });
    });

    // Coalition messaging
    el.querySelectorAll('.reg-coalition-msg-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
            const coalitionId = btn.dataset.coalitionId;
            const partnerName = btn.dataset.partnerName;
            const overlay = document.getElementById('coalition-msg-overlay');
            const titleEl = document.getElementById('coalition-msg-title');
            const listEl = document.getElementById('coalition-msg-list');
            const inputEl = document.getElementById('coalition-msg-input');
            const sendBtn = document.getElementById('coalition-msg-send');
            const closeBtn = document.getElementById('coalition-msg-close');
            if (!overlay || !listEl) return;

            titleEl.textContent = `Messages \u2014 ${partnerName}`;
            overlay.style.display = 'flex';

            async function loadMessages() {
                const { data: msgs } = await _supabase
                    .from('coalition_messages')
                    .select('faction_id, message, tick_posted')
                    .eq('coalition_id', coalitionId)
                    .order('created_at', { ascending: true })
                    .limit(50);

                listEl.innerHTML = (msgs || []).map(m => {
                    const isMine = m.faction_id === f.id;
                    const senderName = isMine ? f.faction_name : partnerName;
                    return `<div class="reg-coalition-msg ${isMine ? 'mine' : 'theirs'}">
                        <span class="reg-coalition-msg-sender">${escapeHtml(senderName)}</span>
                        <span class="reg-coalition-msg-text">${escapeHtml(m.message)}</span>
                        <span class="reg-coalition-msg-tick">Tick ${m.tick_posted}</span>
                    </div>`;
                }).join('') || '<div class="reg-coalition-msg-empty">No messages yet.</div>';

                listEl.scrollTop = listEl.scrollHeight;
            }

            await loadMessages();

            // Clone buttons and input to remove old listeners
            const newSend = sendBtn.cloneNode(true);
            const newClose = closeBtn.cloneNode(true);
            const newInput = inputEl.cloneNode(true);
            sendBtn.replaceWith(newSend);
            closeBtn.replaceWith(newClose);
            inputEl.replaceWith(newInput);

            newClose.addEventListener('click', () => { overlay.style.display = 'none'; });

            newSend.addEventListener('click', async () => {
                const text = newInput.value.trim();
                if (!text) return;
                newSend.disabled = true;

                await _supabase.from('coalition_messages').insert({
                    coalition_id: coalitionId,
                    faction_id: f.id,
                    message: text,
                    tick_posted: currentTick
                });

                newInput.value = '';
                newSend.disabled = false;
                await loadMessages();
            });

            // Allow enter key to send
            newInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); newSend.click(); }
            });
        });
    });

    // ── TAB BADGE for pending demand or coalition request ──
    const partiesTab = document.querySelector('.nav-tab[data-tab="parties"]');
    if (partiesTab) {
        const existingBadge = partiesTab.querySelector('.reg-tab-badge');
        const hasPending = myPendingDemand || myPendingCoalitionRequests.length > 0;
        if (hasPending) {
            if (!existingBadge) {
                const badge = document.createElement('span');
                badge.className = 'reg-tab-badge';
                badge.textContent = '!';
                partiesTab.style.position = 'relative';
                partiesTab.appendChild(badge);
            }
        } else if (existingBadge) {
            existingBadge.remove();
        }
    }

    // ── DISBAND PARTY handler ──
    const disbandBtn = document.getElementById('disband-party-btn');
    if (disbandBtn) {
        disbandBtn.addEventListener('click', async () => {
            if (!confirm('Are you sure you want to disband your party? This is permanent — your party will be removed from the game after the next tick.')) return;
            if (!confirm('This cannot be undone. Disband your party?')) return;
            disbandBtn.disabled = true;
            disbandBtn.textContent = 'Disbanding...';
            try {
                await disbandParty(_supabase, n.id, f.id, currentTick);
                sessionStorage.removeItem('nationhood_state');
                await _supabase.auth.signOut();
                window.location.href = 'index.html';
            } catch (err) {
                alert(err.message || 'Failed to disband party.');
                disbandBtn.disabled = false;
                disbandBtn.textContent = 'Disband Party';
            }
        });
    }
}

async function renderParties() {
    const el = document.getElementById('content-area');
    const n = currentNation;

    if (!currentFaction || !n) {
        console.warn('[parties] Missing faction or nation:', { faction: currentFaction, nation: n });
        el.innerHTML = '<p style="color:var(--text-muted);text-align:center;margin-top:40px;">No party data available.</p>';
        return;
    }

    // Refresh faction data so AP and funds are up to date
    const { data: freshFaction } = await _supabase.from('factions')
        .select('action_points, party_funds, approval_rating, loyalty, seats')
        .eq('id', currentFaction.id).single();
    if (freshFaction) {
        currentFaction.action_points = freshFaction.action_points;
        currentFaction.party_funds = freshFaction.party_funds;
        currentFaction.approval_rating = freshFaction.approval_rating;
        currentFaction.loyalty = freshFaction.loyalty;
        currentFaction.seats = freshFaction.seats;
    }
    const f = currentFaction;

    const isAutocracy = isGovernmentAutocracy(n);

    if (isAutocracy) {
        await renderAutocracyParties(el, f, n);
        return;
    }

    // Fetch all parties for seat + vote share data
    const { data: allParties } = await _supabase
        .from('factions')
        .select('id, faction_name, abbreviation, seats, national_vote_share, party_color, party_logo, party_description, leader_first_name, leader_last_name, leader_age, founded_tick, ideology_value_1, ideology_value_2')
        .eq('nation_id', n.id)
        .eq('faction_type', 'party');

    // Load ideology data for all parties
    const nationIdeologies = await loadNationIdeologies(_supabase, n.id);
    const ideoByFaction = {};
    for (const row of (nationIdeologies || [])) {
        ideoByFaction[row.faction_id] = row;
    }

    const seatData = await loadSeats(_supabase, n.id, false, allParties || [], f.id);
    const mySeats = seatData.currentSeats || 0;

    const coalition = await fetchActiveCoalition(_supabase, n.id);

    // Fetch next scheduled election
    const { data: nextElection } = await _supabase
        .from('elections').select('election_tick')
        .eq('nation_id', n.id).eq('status', 'scheduled')
        .gt('election_tick', currentShard?.current_tick || 0)
        .order('election_tick', { ascending: true }).limit(1).maybeSingle();

    // Fetch momentum data for all parties
    const allPartyIds = (allParties || []).map(p => p.id);
    const { data: allBlocApprovals } = await _supabase
        .from('faction_bloc_approval')
        .select('faction_id, momentum, bloc_id, preference_score, ideology_alignment, performance_perception')
        .in('faction_id', allPartyIds);

    const { data: blocs } = await _supabase
        .from('voter_blocs')
        .select('id, bloc_name, population_weight, priority_issues, axis_liberty_equality, axis_tradition_progress, axis_security_freedom, axis_globalism_nationalism, axis_individualism_collectivism')
        .eq('nation_id', n.id)
        .eq('is_active', true);

    // Fetch recent momentum log for this party (last 10 entries)
    const { data: momentumLog } = await _supabase
        .from('momentum_log')
        .select('amount, source, tick')
        .eq('nation_id', n.id)
        .eq('faction_id', f.id)
        .order('tick', { ascending: false })
        .limit(10);

    const blocWeights = {};
    for (const b of (blocs || [])) blocWeights[b.id] = b.population_weight || 1;

    // Compute weighted-average momentum per party
    const partyMomentum = {};
    for (const row of (allBlocApprovals || [])) {
        if (!partyMomentum[row.faction_id]) partyMomentum[row.faction_id] = { wSum: 0, wTotal: 0 };
        const w = blocWeights[row.bloc_id] || 1;
        partyMomentum[row.faction_id].wSum += (row.momentum || 0) * w;
        partyMomentum[row.faction_id].wTotal += w;
    }
    const partyScores = allPartyIds.map(id => {
        const m = partyMomentum[id];
        const raw = m && m.wTotal > 0 ? m.wSum / m.wTotal : 0;
        return { id, score: Math.round(Math.max(0, Math.min(100, 50 + raw))) };
    }).sort((a, b) => b.score - a.score);

    const myEntry = partyMomentum[f.id];
    const rawMomentum = myEntry && myEntry.wTotal > 0 ? myEntry.wSum / myEntry.wTotal : 0;
    const momentumScore = Math.round(Math.max(0, Math.min(100, 50 + rawMomentum)));
    const decayPerTick = Math.round(Math.abs(rawMomentum) * 0.15 * 10) / 10;
    const momentumRank = partyScores.findIndex(p => p.id === f.id) + 1;
    const totalParties = partyScores.length;
    const role = getPartyRole(f.id, mySeats, coalition);
    const badgeClass = getRoleBadgeClass(role);

    const partyColor = f.party_color || '#ffcc00';
    const logoSvg = getPartyIconSVG(f.party_logo, 44, partyColor);
    const treasury = formatCurrency(f.party_funds || 0);
    const founded = tickToDate(f.founded_tick);
    const leaderName = f.leader_first_name && f.leader_last_name
        ? f.leader_first_name + ' ' + f.leader_last_name + (f.leader_age ? ', ' + f.leader_age : '')
        : '—';
    const ideologyTags = buildIdeologyTags(f);
    const abbr = f.abbreviation ? `<span class="my-party-abbr">(${f.abbreviation})</span>` : '';

    // Build projected vote share bars via election simulation
    const partyLookup = {};
    for (const p of (allParties || [])) partyLookup[p.id] = p;

    let parties = [];
    try {
        const preview = await runElectionPreview(_supabase, n.id);
        parties = (preview.results || []).map(r => ({
            id: r.party_id,
            share: r.vote_percentage || 0,
            abbreviation: partyLookup[r.party_id]?.abbreviation || null,
            party_color: partyLookup[r.party_id]?.party_color || '#666',
            faction_name: r.party_name
        }));
    } catch (e) {
        console.warn('Election preview unavailable:', e.message);
        parties = (allParties || []).map(p => ({
            ...p, share: p.national_vote_share || 0
        }));
    }
    parties.sort((a, b) => b.share - a.share);
    const maxShare = Math.max(...parties.map(p => p.share), 1);

    let voteBarsHtml = '';
    for (const p of parties) {
        const pct = p.share.toFixed(1);
        const barW = (p.share / maxShare) * 100;
        const color = p.party_color || '#666';
        const isMe = p.id === f.id;
        const label = p.abbreviation || p.faction_name;
        voteBarsHtml += `
            <div class="vote-bar-row${isMe ? ' vote-bar-mine' : ''}">
                <span class="vote-bar-label">${label}</span>
                <div class="vote-bar-track">
                    <div class="vote-bar-fill" style="width:${barW}%;background:${color}"></div>
                </div>
                <span class="vote-bar-pct">${pct}%</span>
            </div>`;
    }


    // === Approval by Voter Bloc (compute data) ===
    const blocLookup = {};
    for (const b of (blocs || [])) blocLookup[b.id] = b;

    const approvalByBloc = {};
    const pillarByBloc = {};  // { blocId: { factionId: { ideo, perf, mom } } }
    for (const row of (allBlocApprovals || [])) {
        if (!approvalByBloc[row.bloc_id]) approvalByBloc[row.bloc_id] = {};
        approvalByBloc[row.bloc_id][row.faction_id] = row.preference_score ?? 0;
        if (!pillarByBloc[row.bloc_id]) pillarByBloc[row.bloc_id] = {};
        pillarByBloc[row.bloc_id][row.faction_id] = {
            ideo: Math.round(row.ideology_alignment ?? 50),
            perf: Math.round(row.performance_perception ?? 50),
            mom: Math.round(row.momentum ?? 0)
        };
    }

    const blocRows = (blocs || []).map(b => {
        const myApproval = approvalByBloc[b.id]?.[f.id] ?? 0;
        let leaderId = null;
        let leaderApproval = -1;
        for (const pid of allPartyIds) {
            const a = approvalByBloc[b.id]?.[pid] ?? 0;
            if (a > leaderApproval) { leaderApproval = a; leaderId = pid; }
        }
        const leaderParty = partyLookup[leaderId];
        const isLeading = leaderId === f.id;
        const margin = leaderApproval - myApproval;
        const pillars = pillarByBloc[b.id]?.[f.id] || { ideo: 50, perf: 50, mom: 0 };
        return {
            blocId: b.id,
            blocName: b.bloc_name,
            popWeight: b.population_weight || 0,
            myApproval,
            leaderId,
            leaderAbbr: leaderParty?.abbreviation || '?',
            leaderColor: leaderParty?.party_color || '#666',
            isLeading,
            margin,
            pillars,
            axes: {
                liberty_equality: b.axis_liberty_equality ?? 50,
                tradition_progress: b.axis_tradition_progress ?? 50,
                security_freedom: b.axis_security_freedom ?? 50,
                globalism_nationalism: b.axis_globalism_nationalism ?? 50,
                individualism_collectivism: b.axis_individualism_collectivism ?? 50
            },
            priorityIssues: b.priority_issues || []
        };
    }).sort((a, b) => b.myApproval - a.myApproval);

    const blocsLeading = blocRows.filter(r => r.isLeading);
    const leadingCount = blocsLeading.length;
    const leadingPopPct = Math.round(blocsLeading.reduce((s, r) => s + r.popWeight, 0));
    const swingBlocs = blocRows.filter(r => !r.isLeading && r.margin <= 3);

    // === Performance Credit ===
    const MINISTRY_NAMES = {
        prime_minister: 'Prime Minister', interior: 'Interior', foreign: 'Foreign',
        defense: 'Defense', finance: 'Finance', education: 'Education',
        healthcare: 'Healthcare', labor: 'Labor', justice: 'Justice',
        transportation: 'Transportation', security: 'Security'
    };

    // Fetch ministries held by our party
    const { data: myMinistries } = await _supabase
        .from('ministries')
        .select('ministry_key')
        .eq('nation_id', n.id)
        .eq('party_id', f.id)
        .eq('is_active', true);

    // Check if we're PM
    const isPM = coalition && coalition.lead_party_id === f.id;

    const heldKeys = new Set((myMinistries || []).map(m => m.ministry_key));
    if (isPM) heldKeys.add('prime_minister');
    const heldMinistryCount = heldKeys.size;

    // Build stat-to-trend data if we hold ministries
    let trendingWell = [];
    let trendingBadly = [];
    let trendingFlat = [];
    let swingWarnings = [];

    if (heldMinistryCount > 0) {
        // Fetch previous tick stats
        const currentTick = currentShard?.current_tick || 0;
        let prevStats = null;
        if (currentTick > 0) {
            const { data: histRow } = await _supabase
                .from('nations_history')
                .select('*')
                .eq('nation_id', n.id)
                .eq('tick', currentTick - 1)
                .single();
            prevStats = histRow;
        }

        // Find all stats we're responsible for
        const myStats = [];
        for (const [statKey, ministryKey] of Object.entries(STAT_TO_MINISTRY)) {
            if (heldKeys.has(ministryKey)) myStats.push(statKey);
        }

        // Compute trends
        const FLAT_THRESHOLD = 0.15;
        for (const statKey of myStats) {
            const current = n[statKey];
            const prev = prevStats ? prevStats[statKey] : null;
            if (current == null) continue;

            const sign = statDirectionSign(statKey);
            if (sign === 0) continue;

            const rawDelta = (prev != null) ? current - prev : 0;
            const improvement = rawDelta * sign; // positive = getting better

            const label = statKey.replace(/_/g, ' ');
            if (Math.abs(rawDelta) < FLAT_THRESHOLD) {
                trendingFlat.push({ statKey, label });
            } else if (improvement > 0) {
                trendingWell.push({ statKey, label, arrow: sign > 0 ? '▲' : '▼' });
            } else {
                trendingBadly.push({ statKey, label, arrow: sign > 0 ? '▼' : '▲' });
            }
        }

        // Build campaign actions
        let campaignActionsHTML = '';
        const lastPollData = null;   // TODO: fetch from campaign_actions when poll feature is implemented
        const previousPollData = null;
        campaignActionsHTML = `
            <div class="section-header" style="margin-top: 30px;">Your Party Resources</div>
            <div class="stat-grid stat-grid-3col" style="margin-bottom: 12px;">
                <div class="stat-card"><div class="stat-label">Action Points</div><div class="stat-value" id="party-ap">${f?.action_points || 0}</div></div>
                <div class="stat-card"><div class="stat-label">Party Funds</div><div class="stat-value" id="party-funds">$${(f?.party_funds || 0).toLocaleString()}</div></div>
                <div class="stat-card"><div class="stat-label" title="Weighted average approval across all voter blocs">Approval Rating</div><div class="stat-value" id="party-approval">${f?._derivedApproval ?? f?.approval_rating ?? 0}%</div></div>
            </div>
            ${(() => {
                if (!blocs || blocs.length === 0 || !f) return '';
                const pollResult = lastPollData?.result;
                const prevResult = previousPollData?.result;
                const pollDate = lastPollData?.result?.poll_date || null;
                const polledBlocIds = pollResult?.bloc_results ? Object.keys(pollResult.bloc_results) : [];

                if (!pollResult) {
                    return `<div class="poll-panel">
                        <div class="poll-panel-header">
                            <div class="poll-panel-title">Poll for ${f.faction_name}</div>
                        </div>
                        <div class="poll-no-data">No polls conducted yet. Use <strong>Generate Poll</strong> to survey voter blocs.</div>
                    </div>`;
                }

                const blocRows = blocs.map(bloc => {
                    const polled = pollResult.bloc_results?.[bloc.id];
                    if (!polled) return `<div class="poll-bloc-unpolled">${bloc.bloc_name} — not polled</div>`;
                    const prev = prevResult?.bloc_results?.[bloc.id];
                    const color = polled.shown >= 55 ? '#4CAF50' : polled.shown <= 35 ? '#ff4444' : '#ff9800';
                    let deltaHTML = '';
                    if (prev) {
                        const diff = polled.shown - prev.shown;
                        if (diff > 0) deltaHTML = `<span class="poll-bloc-delta up">+${diff}</span>`;
                        else if (diff < 0) deltaHTML = `<span class="poll-bloc-delta down">${diff}</span>`;
                        else deltaHTML = `<span class="poll-bloc-delta flat">—</span>`;
                    }
                    return `<div class="poll-bloc-row">
                        <span class="poll-bloc-name">${bloc.bloc_name}</span>
                        <div class="poll-bloc-bar"><div class="poll-bloc-bar-fill" style="width:${polled.shown}%;background:${color};"></div></div>
                        <span class="poll-bloc-value" style="color:${color};">${polled.shown}%</span>
                        ${deltaHTML}
                    </div>`;
                }).join('');

                return `<div class="poll-panel">
                    <div class="poll-panel-header">
                        <div class="poll-panel-title">Poll for ${f.faction_name}</div>
                        <div class="poll-panel-date">${pollDate ? 'Conducted: ' + pollDate : ''}</div>
                    </div>
                    <div>${blocRows}</div>
                    <div class="poll-margin-note">± margin of error</div>
                </div>`;
            })()}
            <div id="poll-selector" class="poll-selector"></div>

            <div class="section-header" style="margin-top: 20px;">Party Actions</div>
            <div class="action-grid" style="grid-template-columns: repeat(2, 1fr); margin-bottom: 16px;">
                <div class="action-card">
                    <div class="action-header">
                        <div class="action-title">Generate Poll</div>
                        <div class="action-cost">2 AP + $25k/bloc</div>
                    </div>
                    <div class="action-desc">
                        Commission a poll to reveal your approval with selected voter blocs.
                        Results have a <strong>margin of error</strong>.
                        <br><span style="color: #888; font-size: 0.78rem;">Cooldown: 1 per 3 ticks.</span>
                    </div>
                    <button class="action-btn" id="btn-generate-poll" onclick="openPollSelector()">
                        Generate Poll
                    </button>
                </div>
                <div class="action-card">
                    <div class="action-header">
                        <div class="action-title">Build Coalition</div>
                        <div class="action-cost">3 AP + $200k</div>
                    </div>
                    <div class="action-desc">
                        Publicly align with a voter bloc's interests. Concentrates support with the target at the cost of alienating rival blocs.
                        <strong>Always a net negative overall</strong> — pandering sharpens your base, it doesn't grow it.
                        <br><span style="color: #888; font-size: 0.78rem;">Cooldown: 2 ticks (global). Diminishing returns per bloc within 10 ticks.</span>
                    </div>
                    <button class="action-btn" id="btn-build-coalition" onclick="openCoalitionPanel()">
                        Build Coalition
                    </button>
                </div>
            </div>
            <div id="coalition-panel" class="donor-panel"></div>

            <div class="section-header" style="margin-top: 20px;">Recent Actions</div>
            <div id="action-log" class="action-log"><div class="action-log-empty">No actions taken yet this campaign.</div></div>`;
    }

    // Build Performance Credit HTML
    let perfCreditHtml = '';
    if (heldMinistryCount === 0) {
        perfCreditHtml = `
            <div class="perf-panel">
                <div class="perf-header">Performance Credit</div>
                <div class="perf-empty">
                    <div class="perf-empty-label">Ministries: None</div>
                    <div class="perf-empty-msg">You earn no credit for stat improvements. Attack rivals who do, or negotiate your way into a coalition.</div>
                </div>
            </div>`;
    } else {
        const ministryList = [...heldKeys].map(k => MINISTRY_NAMES[k] || k).join(', ');
        let titleParts = [];
        if (isPM) titleParts.push('Prime Minister');
        const nonPM = [...heldKeys].filter(k => k !== 'prime_minister');
        if (nonPM.length > 0) titleParts.push(nonPM.map(k => MINISTRY_NAMES[k] || k).join(', '));
        const titleLine = titleParts.join(' + ');

        const MAX_TREND_ITEMS = 5;
        let trendsHtml = '';
        if (trendingWell.length > 0) {
            const shown = trendingWell.slice(0, MAX_TREND_ITEMS);
            const extra = trendingWell.length - shown.length;
            trendsHtml += `<div class="perf-trend-section">
                <div class="perf-trend-label perf-trend-good">Trending well:</div>
                ${shown.map(t => `<div class="perf-trend-item perf-trend-good">${t.arrow} ${t.label}</div>`).join('')}
                ${extra > 0 ? `<div class="perf-trend-item perf-trend-good">+ ${extra} more</div>` : ''}
            </div>`;
        }
        if (trendingBadly.length > 0) {
            const shown = trendingBadly.slice(0, MAX_TREND_ITEMS);
            const extra = trendingBadly.length - shown.length;
            trendsHtml += `<div class="perf-trend-section">
                <div class="perf-trend-label perf-trend-bad">Trending badly:</div>
                ${shown.map(t => `<div class="perf-trend-item perf-trend-bad">${t.arrow} ${t.label}</div>`).join('')}
                ${extra > 0 ? `<div class="perf-trend-item perf-trend-bad">+ ${extra} more</div>` : ''}
            </div>`;
        }
        if (trendingFlat.length > 0) {
            trendsHtml += `<div class="perf-trend-section">
                <div class="perf-trend-item perf-trend-flat">── ${trendingFlat.length} stat${trendingFlat.length !== 1 ? 's' : ''} flat</div>
            </div>`;
        }
        if (trendingWell.length === 0 && trendingBadly.length === 0 && trendingFlat.length === 0) {
            trendsHtml = '<div class="perf-trend-none">No trend data yet.</div>';
        }

        let warningsHtml = '';
        if (swingWarnings.length > 0) {
            warningsHtml = swingWarnings.map(w =>
                `<div class="perf-warning">⚠ ${w.stats.map(s => s.charAt(0).toUpperCase() + s.slice(1)).join(', ')} is hurting you with ${w.blocName} — a swing bloc.</div>`
            ).join('');
        }

        perfCreditHtml = `
            <div class="perf-panel perf-panel-active">
                <div class="perf-header">Performance Credit</div>

    // ── Edit Party Identity logic ──
    (function initEditIdentity() {
        const section = document.getElementById('edit-identity-section');
        if (!section) return;

        let editColor = f.party_color || partyColor;
        let editLogo = f.party_logo || 'flag';

        // Description char count
        const descInput = document.getElementById('edit-party-desc');
        const charCount = document.getElementById('edit-desc-charcount');
        function updateCharCount() {
            charCount.textContent = (descInput.value || '').length + ' / 200';
        }
        updateCharCount();
        descInput.addEventListener('input', updateCharCount);

        // Color palette
        const paletteEl = document.getElementById('edit-color-palette');
        let paletteHtml = '';
        for (const c of PARTY_COLOR_PALETTE) {
            const isActive = c.hex.toUpperCase() === editColor.toUpperCase();
            paletteHtml += '<div class="edit-color-swatch' + (isActive ? ' active' : '') + '" data-hex="' + c.hex + '" style="background:' + c.hex + '" title="' + c.label + '"></div>';
        }
        paletteEl.innerHTML = paletteHtml;

        const hexInput = document.getElementById('edit-color-hex');
        const colorPreview = document.getElementById('edit-color-preview');
        const colorWarning = document.getElementById('edit-color-warning');

        function selectColor(hex) {
            editColor = hex;
            hexInput.value = hex;
            colorPreview.style.background = hex;
            paletteEl.querySelectorAll('.edit-color-swatch').forEach(sw => {
                sw.classList.toggle('active', sw.dataset.hex.toUpperCase() === hex.toUpperCase());
            });
            checkColorSimilarity(hex);
        }

        function checkColorSimilarity(hex) {
            const otherColors = (allParties || [])
                .filter(p => p.id !== f.id && p.party_color)
                .map(p => ({ name: p.faction_name, color: p.party_color }));
            let warning = '';
            for (const other of otherColors) {
                if (colorDistance(hex, other.color) < 30) {
                    warning = 'Another party (' + other.name + ') is already using a very similar color. This may cause confusion in charts and maps.';
                    break;
                }
            }
            colorWarning.style.display = warning ? 'block' : 'none';
            colorWarning.textContent = warning;
        }

        paletteEl.addEventListener('click', (e) => {
            const sw = e.target.closest('.edit-color-swatch');
            if (sw) selectColor(sw.dataset.hex);
        });

        hexInput.addEventListener('input', () => {
            const val = hexInput.value.trim();
            if (/^#[0-9a-fA-F]{6}$/.test(val)) {
                selectColor(val);
            }
        });

        checkColorSimilarity(editColor);

        // Logo grid
        const logoGrid = document.getElementById('edit-logo-grid');
        let logoHtml = '';
        const categories = {};
        for (const [key, icon] of Object.entries(PARTY_ICONS)) {
            if (!categories[icon.category]) categories[icon.category] = [];
            categories[icon.category].push({ key, label: icon.label });
        }
        for (const [cat, icons] of Object.entries(categories)) {
            logoHtml += '<div class="edit-logo-category">' + cat + '</div>';
            for (const icon of icons) {
                const isActive = icon.key === editLogo;
                logoHtml += '<div class="edit-logo-option' + (isActive ? ' active' : '') + '" data-key="' + icon.key + '" title="' + icon.label + '">' + getPartyIconSVG(icon.key, 28, isActive ? editColor : '#888') + '</div>';
            }
        }
        logoGrid.innerHTML = logoHtml;

        logoGrid.addEventListener('click', (e) => {
            const opt = e.target.closest('.edit-logo-option');
            if (!opt) return;
            editLogo = opt.dataset.key;
            logoGrid.querySelectorAll('.edit-logo-option').forEach(o => {
                const isActive = o.dataset.key === editLogo;
                o.classList.toggle('active', isActive);
                o.innerHTML = getPartyIconSVG(o.dataset.key, 28, isActive ? editColor : '#888');
            });
        });

        // Save
        const saveBtn = document.getElementById('edit-identity-save');
        const statusEl = document.getElementById('edit-identity-status');
        saveBtn.addEventListener('click', async () => {
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';
            statusEl.textContent = '';

            const newDesc = (descInput.value || '').trim().slice(0, 200);
            const { error } = await _supabase.from('factions').update({
                party_description: newDesc || null,
                party_color: editColor,
                party_logo: editLogo,
            }).eq('id', f.id);

            if (error) {
                statusEl.textContent = 'Error: ' + error.message;
                statusEl.style.color = '#ff4444';
            } else {
                statusEl.textContent = 'Saved!';
                statusEl.style.color = '#4CAF50';
                f.party_description = newDesc || null;
                f.party_color = editColor;
                f.party_logo = editLogo;
                currentFaction.party_description = f.party_description;
                currentFaction.party_color = f.party_color;
                currentFaction.party_logo = f.party_logo;
                setTimeout(() => renderParties(), 800);
            }
            saveBtn.disabled = false;
            saveBtn.textContent = 'Save Changes';
        });
    })();
