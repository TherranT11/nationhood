<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parties | Nationhood Alpha</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/parties.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="top-bar"></div>
<div id="content-area">
    <div class="loading-container">
        <div class="loading-spinner"></div>
        <div>Loading parties...</div>
    </div>
</div>
<script type="module">
import { _supabase } from './js/supabase-client.js';
import { initPage, qCache, formatCurrency } from './js/common.js';
import { tickToDate, escapeHtml, getIdeologyClass } from './js/utils.js';
import { loadSeats, fetchActiveCoalition, isGovernmentAutocracy, isPresidentialRepublic, initGameConfigForNation, GAME_CONFIG, runElectionPreview, STAT_TO_MINISTRY, statDirectionSign, ISSUE_CATEGORY_STATS, RALLY_CONFIG, RALLY_OUTCOMES, getRallyOutcomeWeights, getRallyRiskLevel, executeRally, IDEOLOGY_OPPOSITES, IDEOLOGY_TO_AXIS, IDEOLOGY_AXES, MAKE_PROMISE_CONFIG, executeMakePromise, getPromiseableStats, getFullIdeologyProfile, loadNationIdeologies, getIdeologyLabel, PM_FIRST_NAMES, PM_LAST_NAMES, PILLAR_TO_STEWARD_TYPE, STEWARD_TYPE_LABELS, STEWARD_TYPE_DESCRIPTIONS, deductAP, disbandParty, MOBILIZE_CONFIG, executeMobilize, ensureBlocApprovals, selectPresidentCandidate } from './js/game-common.js';
import { getPartyIconSVG, PARTY_ICONS, PARTY_COLOR_PALETTE, colorDistance } from './js/party-icons.js';

let currentFaction = null;
let currentNation = null;
let currentShard = null;
let selectedIdeologyFactionId = null;
let ideologyAllParties = null;

function ordinal(n) {
    const s = ['th','st','nd','rd'];
    const v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function getPartyRole(factionId, seats, coalition) {
    if (!seats || seats === 0) return 'No Seats';
    if (coalition && coalition.party_ids && coalition.party_ids.includes(factionId)) {
        return coalition.lead_party_id === factionId
            ? 'Lead — Governing Coalition'
            : 'Governing Coalition';
    }
    return 'Opposition';
}

function getRoleBadgeClass(role) {
    if (role.includes('Governing')) return 'role-badge-gov';
    if (role === 'Opposition') return 'role-badge-opp';
    return 'role-badge-none';
}

function buildIdeologyTags(f) {
    let html = '';
    if (f.ideology_value_1) {
        const cls = 'tag-' + f.ideology_value_1.toLowerCase();
        html += `<span class="ideology-tag ${cls}">${f.ideology_value_1}</span>`;
    }
    if (f.ideology_value_2) {
        const cls = 'tag-' + f.ideology_value_2.toLowerCase();
        html += `<span class="ideology-tag ${cls}">${f.ideology_value_2}</span>`;
    }
    return html;
}

async function renderAutocracyParties(el, f, n) {
    // Fetch all factions for this nation
    const { data: allFactions } = await _supabase
        .from('factions')
        .select('id, faction_name, abbreviation, party_color, party_logo, action_points, loyalty, seats')
        .eq('nation_id', n.id)
        .eq('faction_type', 'party')
        .order('seats', { ascending: false });

    // Fetch ministries for faction intelligence
    const { data: ministries } = await _supabase
        .from('ministries')
        .select('ministry_key, party_id')
        .eq('nation_id', n.id)
        .not('party_id', 'is', null);

    const ministryCounts = {};
    const ministryByParty = {};
    for (const m of (ministries || [])) {
        ministryCounts[m.party_id] = (ministryCounts[m.party_id] || 0) + 1;
        if (!ministryByParty[m.party_id]) ministryByParty[m.party_id] = [];
        ministryByParty[m.party_id].push(m.ministry_key);
    }

    const MINISTRY_SHORT = {
        prime_minister: 'PM', interior: 'Interior', foreign: 'Foreign',
        defense: 'Defense', finance: 'Finance', education: 'Education',
        healthcare: 'Health', labor: 'Labor', justice: 'Justice',
        transportation: 'Transport', security: 'Security'
    };

    const MINISTRY_FISCAL_MAP = {
        prime_minister: 'Interior', interior: 'Interior', foreign: 'Foreign Ministry',
        defense: 'Defense', finance: 'Finance', education: 'Education',
        healthcare: 'Healthcare', labor: 'Labor', justice: 'Justice',
        trade: 'Interior', energy: 'Energy', transportation: 'Transportation'
    };

    // Fetch regime pillars (including steward)
    const { data: regimePillars } = await _supabase
        .from('regime_pillars')
        .select('id, pillar_key, pillar_name, support, steward_faction_id')
        .eq('nation_id', n.id)
        .order('pillar_key');

    // Fetch stewards for this nation (all rows — alive and dead — for pillar claim display)
    const { data: stewardRows } = await _supabase
        .from('stewards')
        .select('id, faction_id, pillar_key, steward_type, first_name, last_name, age, standing, power_base, true_loyalty, estimated_loyalty, personal_wealth, exit_readiness, coup_readiness, is_alive')
        .eq('nation_id', n.id);

    // Fetch regime log — all player actions for this nation (most recent first)
    const { data: regimeLogData } = await _supabase
        .from('campaign_actions')
        .select('action_type, party_id, tick_performed, result, factions(faction_name, abbreviation)')
        .eq('nation_id', n.id)
        .order('tick_performed', { ascending: false })
        .limit(30);

    // Build lookup: faction → living steward only
    const stewardByFaction = {};
    for (const s of (stewardRows || [])) {
        if (s.is_alive !== false) stewardByFaction[s.faction_id] = s;
    }
    // Build lookup: pillar_key → living steward (for pillar claim display)
    const stewardByPillar = {};
    for (const s of (stewardRows || [])) {
        if (s.is_alive !== false) stewardByPillar[s.pillar_key] = s;
    }

    const rulingId = n.ruling_faction_id;
    const isStrongman = f.id === rulingId;
    const rulingFaction = (allFactions || []).find(p => p.id === rulingId);
    const currentTick = currentShard?.current_tick || 0;
    const nonRuling = (allFactions || []).filter(p => p.id !== rulingId);

    // ── LOYALTY DEMANDS ──
    const { data: loyaltyDemands } = await _supabase
        .from('loyalty_demands')
        .select('id, strongman_faction_id, target_faction_id, demanded_at_tick, deadline_tick, status')
        .eq('nation_id', n.id)
        .order('demanded_at_tick', { ascending: false });

    // Auto-expire pending demands past deadline (treat as Refuse)
    for (const d of (loyaltyDemands || [])) {
        if (d.status === 'pending' && currentTick >= d.deadline_tick) {
            const targetSteward = stewardByFaction[d.target_faction_id];
            if (targetSteward) {
                await _supabase.from('stewards').update({
                    estimated_loyalty: targetSteward.true_loyalty,
                    standing: Math.max(0, (targetSteward.standing ?? 50) - 10)
                }).eq('id', targetSteward.id);
            }
            await _supabase.from('loyalty_demands').update({
                status: 'expired', resolved_at_tick: currentTick
            }).eq('id', d.id);
            d.status = 'expired';
            const targetName = (allFactions || []).find(p => p.id === d.target_faction_id)?.faction_name || 'Unknown';
            await _supabase.from('campaign_actions').insert({
                party_id: d.target_faction_id, nation_id: n.id,
                action_type: 'loyalty_demand_expired',
                tick_performed: currentTick,
                result: { target_faction: targetName }
            });
        }
    }

    const myPendingDemand = (loyaltyDemands || []).find(
        d => d.target_faction_id === f.id && d.status === 'pending'
    );
    const demandedThisTick = new Set(
        (loyaltyDemands || []).filter(d => d.demanded_at_tick === currentTick)
            .map(d => d.target_faction_id)
    );

    // ── FACTION COALITIONS ──
    // Fetch active + recently resolved (for cooldown enforcement)
    const COALITION_REPROPOSE_COOLDOWN = 3;
    const { data: coalitionRows } = await _supabase
        .from('faction_coalitions')
        .select('id, faction_a_id, faction_b_id, coalition_type, status, proposed_by_faction_id, proposed_at_tick, resolved_at_tick, detected_at_tick')
        .eq('nation_id', n.id)
        .order('proposed_at_tick', { ascending: false });

    // Auto-expire pending coalition proposals after 3 ticks
    const COALITION_PROPOSAL_EXPIRY = 3;
    const COALITION_ACTIVE_EXPIRY = 12;
    for (const c of (coalitionRows || [])) {
        if (c.status === 'pending' && currentTick >= c.proposed_at_tick + COALITION_PROPOSAL_EXPIRY) {
            await _supabase.from('faction_coalitions').update({
                status: 'declined', resolved_at_tick: currentTick
            }).eq('id', c.id);
            c.status = 'declined';
        }
        // Auto-expire active/detected coalitions after 12 ticks
        if (['active', 'detected'].includes(c.status) && c.resolved_at_tick && currentTick >= c.resolved_at_tick + COALITION_ACTIVE_EXPIRY) {
            await _supabase.from('faction_coalitions').update({
                status: 'dissolved', resolved_at_tick: currentTick
            }).eq('id', c.id);
            c.status = 'dissolved';
        }
    }

    // Auto-dissolve coalitions where the partner's steward is dead (Bug #8)
    for (const c of (coalitionRows || [])) {
        if (!['active', 'detected'].includes(c.status)) continue;
        const stewardA = stewardByFaction[c.faction_a_id];
        const stewardB = stewardByFaction[c.faction_b_id];
        if (!stewardA || !stewardB) {
            await _supabase.from('faction_coalitions').update({
                status: 'dissolved', resolved_at_tick: currentTick
            }).eq('id', c.id);
            c.status = 'dissolved';
        }
    }

    // My active coalitions (I am a member and it is active/detected)
    const myActiveCoalitions = (coalitionRows || []).filter(c =>
        (c.faction_a_id === f.id || c.faction_b_id === f.id) &&
        ['active', 'detected'].includes(c.status)
    );
    // Pending requests targeted at me (I did NOT propose it)
    const myPendingCoalitionRequests = (coalitionRows || []).filter(c =>
        (c.faction_a_id === f.id || c.faction_b_id === f.id) &&
        c.status === 'pending' &&
        c.proposed_by_faction_id !== f.id
    );
    // Pending requests I proposed (outgoing, awaiting response)
    const myPendingOutgoing = (coalitionRows || []).filter(c =>
        (c.faction_a_id === f.id || c.faction_b_id === f.id) &&
        c.status === 'pending' &&
        c.proposed_by_faction_id === f.id
    );
    // All public coalitions (visible to everyone)
    const publicCoalitions = (coalitionRows || []).filter(c =>
        c.coalition_type === 'public' && ['active', 'detected'].includes(c.status)
    );
    // Detected secret coalitions (visible to strongman)
    const detectedSecretCoalitions = (coalitionRows || []).filter(c =>
        c.coalition_type === 'secret' && c.status === 'detected'
    );
    // Factions I already have an active/pending coalition with, or recently resolved (cooldown)
    const existingCoalitionPartners = new Set();
    for (const c of (coalitionRows || [])) {
        if (c.faction_a_id === f.id || c.faction_b_id === f.id) {
            const partnerId = c.faction_a_id === f.id ? c.faction_b_id : c.faction_a_id;
            if (['pending', 'active', 'detected'].includes(c.status)) {
                existingCoalitionPartners.add(partnerId);
            } else if (c.resolved_at_tick && currentTick < c.resolved_at_tick + COALITION_REPROPOSE_COOLDOWN) {
                // Cooldown: can't re-propose for 3 ticks after decline/dissolve/betray
                existingCoalitionPartners.add(partnerId);
            }
        }
    }

    // ── REGIME PANEL (visible to all — Grip numbers only for Strongman) ──
    const hosFirst = n.head_of_state_first_name || 'Unknown';
    const hosLast = n.head_of_state_last_name || 'Unknown';
    const hosAge = n.head_of_state_age || '—';
    const govType = (n.government_type || 'Autocracy');
    const nationName = n.name || 'Unknown';

    // Compute Grip on Power from pillar averages
    const stability = Number(n.stability ?? 50);
    const legitimacy = Number(n.legitimacy ?? 50);
    const civilUnrest = Number(n.civil_unrest ?? 30);

    let gripClamped;
    if (regimePillars && regimePillars.length > 0) {
        const pillarSum = regimePillars.reduce((s, p) => s + (p.support ?? 0), 0);
        gripClamped = Math.max(0, Math.min(100, Math.round(pillarSum / regimePillars.length)));
    } else {
        // Fallback if no pillars exist yet
        const avgLoyalty = nonRuling.length > 0
            ? nonRuling.reduce((s, p) => s + (p.loyalty ?? 50), 0) / nonRuling.length
            : 50;
        gripClamped = Math.max(0, Math.min(100, Math.round(
            stability * 0.30 + avgLoyalty * 0.25 +
            (100 - civilUnrest) * 0.25 + legitimacy * 0.20
        )));
    }

        let gripLabel, gripColor;
        if (gripClamped >= 85) { gripLabel = 'IRON GRIP'; gripColor = '#4CAF50'; }
        else if (gripClamped >= 70) { gripLabel = 'FIRM'; gripColor = '#8BC34A'; }
        else if (gripClamped >= 50) { gripLabel = 'STABLE'; gripColor = '#ff9800'; }
        else if (gripClamped >= 30) { gripLabel = 'TENUOUS'; gripColor = '#ff5722'; }
        else { gripLabel = 'CRUMBLING'; gripColor = '#ff1744'; }

        // Revolution status
        const revActive = n.revolution_started_tick != null && n.revolution_duration != null;
        const revRemaining = revActive ? Math.max(0, n.revolution_duration - (currentTick - n.revolution_started_tick)) : 0;

        // Succession — derived: if no other factions have >60 loyalty, undesignated
        const potentialSuccessor = nonRuling.find(p => (p.loyalty ?? 0) >= 60);
        const successionLabel = potentialSuccessor ? potentialSuccessor.faction_name : 'UNDESIGNATED';
        const successionColor = potentialSuccessor ? '#8a8778' : '#ff5722';

        // Regime vitals
        const pressF = Math.round(Number(n.press_freedom ?? 50));
        const judicialI = Math.round(Number(n.judicial_independence ?? 50));
        const corruption = Math.round(Number(n.corruption ?? 50));
        const freedomIdx = Math.round(Number(n.freedom_index ?? 50));

        function vitalColor(val, invertedIsBetter) {
            const v = invertedIsBetter ? (100 - val) : val;
            if (v >= 70) return '#4CAF50';
            if (v >= 45) return '#ff9800';
            return '#ff4444';
        }

        function vitalLabel(val, invertedIsBetter) {
            const v = invertedIsBetter ? (100 - val) : val;
            if (v >= 70) return 'HIGH';
            if (v >= 45) return 'MODERATE';
            return 'LOW';
        }

        function loyaltyColor(val) {
            if (val >= 70) return '#4CAF50';
            if (val >= 50) return '#8BC34A';
            if (val >= 30) return '#ff9800';
            return '#ff4444';
        }

        function loyaltyLabel(val) {
            if (val >= 70) return 'LOYAL';
            if (val >= 50) return 'COMPLIANT';
            if (val >= 30) return 'WAVERING';
            return 'DISLOYAL';
        }

        // Build a faction name lookup (needed by steward display in faction intel)
        const factionNameMap = {};
        for (const fac of (allFactions || [])) factionNameMap[fac.id] = fac.faction_name;

        // Build faction intelligence rows — ruling party first with [Your Party] tag
        let factionIntelRows = '';
        const sortedFactions = [...(allFactions || [])].sort((a, b) => {
            if (a.id === rulingId) return -1;
            if (b.id === rulingId) return 1;
            return 0;
        });
        for (const faction of sortedFactions) {
            const isYourParty = faction.id === rulingId;
            const loy = Math.round(faction.loyalty ?? 50);
            const loyPct = Math.max(0, Math.min(100, loy));
            const lColor = loyaltyColor(loy);
            const lLabel = loyaltyLabel(loy);
            const mCount = ministryCounts[faction.id] || 0;
            const seats = faction.seats || 0;
            const fColor = faction.party_color || '#666';

            // Steward info — visible to all players; EST. LOYALTY only for Strongman
            const factionSteward = stewardByFaction[faction.id];
            let stewardIntelHtml = '';
            if (factionSteward) {
                const sTypeLabel = STEWARD_TYPE_LABELS[factionSteward.steward_type] || '';
                const claimedFactionName = factionNameMap[factionSteward.faction_id] || faction.faction_name;
                stewardIntelHtml = `
                    <div class="reg-intel-steward">
                        <span class="reg-intel-steward-name">${escapeHtml(factionSteward.first_name)} ${escapeHtml(factionSteward.last_name)}</span>
                        <span class="reg-intel-steward-type">${escapeHtml(sTypeLabel)}</span>
                        <span class="reg-intel-steward-faction">${escapeHtml(claimedFactionName)}</span>
                        ${isStrongman ? `<span class="reg-intel-stat">
                            <span class="reg-intel-label">EST. LOYALTY</span>
                            <span class="reg-intel-val" style="color:${loyaltyColor(factionSteward.estimated_loyalty ?? 55)}">${factionSteward.estimated_loyalty ?? 55}</span>
                        </span>` : ''}
                    </div>`;
            }

            // Build ministry name badges
            const factionMinistryKeys = ministryByParty[faction.id] || [];
            const ministryBadgesHtml = factionMinistryKeys.length === 0
                ? '<span class="reg-intel-ministry-none">None</span>'
                : factionMinistryKeys.map(k => `<span class="reg-intel-ministry-tag">${MINISTRY_SHORT[k] || k}</span>`).join('');

            factionIntelRows += `
                <div class="reg-intel-row" style="border-left: 3px solid ${fColor}">
                    <div class="reg-intel-name">${escapeHtml(faction.faction_name)}${isYourParty ? ' <span class="reg-intel-your-party">[Your Party]</span>' : ''}</div>
                    <div class="reg-intel-stats">
                        <span class="reg-intel-stat">
                            <span class="reg-intel-label">LOYALTY</span>
                            ${isStrongman ? `<span class="reg-intel-val" style="color:${lColor}">${loy}</span>` : ''}
                            <span class="reg-intel-tag" style="color:${lColor}">${lLabel}</span>
                        </span>
                        <span class="reg-intel-stat">
                            <span class="reg-intel-label">SEATS</span>
                            <span class="reg-intel-val">${seats}</span>
                        </span>
                    </div>
                    <div class="reg-intel-ministries">
                        <span class="reg-intel-label">MINISTRIES</span>
                        ${ministryBadgesHtml}
                    </div>
                    ${stewardIntelHtml}
                    ${isStrongman ? `<div class="reg-intel-bar-track">
                        <div class="reg-intel-bar-fill" style="width:${loyPct}%;background:${lColor}"></div>
                    </div>` : ''}
                </div>`;
        }

        // Revolution threat assessment
        let threatHtml = '';
        if (revActive) {
            threatHtml = `
                <div class="reg-threat reg-threat-active">
                    <span class="reg-threat-icon">&#9888;</span>
                    <span class="reg-threat-text">DEMOCRATIC REVOLUTION IN PROGRESS</span>
                    <span class="reg-threat-timer">${revRemaining} TICK${revRemaining !== 1 ? 'S' : ''} REMAINING</span>
                </div>`;
        } else {
            // Check proximity to trigger (stability < 15, freedom_index > 50, civil_unrest > 70)
            const triggers = [];
            if (stability < 25) triggers.push(isStrongman ? `Stability critical (${stability})` : 'Stability critical');
            if (freedomIdx > 40) triggers.push(isStrongman ? `Freedom Index rising (${freedomIdx})` : 'Freedom Index rising');
            if (civilUnrest > 55) triggers.push(isStrongman ? `Civil Unrest elevated (${civilUnrest})` : 'Civil Unrest elevated');
            if (triggers.length > 0) {
                threatHtml = `
                    <div class="reg-threat reg-threat-warning">
                        <span class="reg-threat-icon">&#9888;</span>
                        <span class="reg-threat-text">REVOLUTION RISK FACTORS</span>
                        <div class="reg-threat-factors">${triggers.map(t => `<span class="reg-threat-factor">${t}</span>`).join('')}</div>
                    </div>`;
            } else {
                threatHtml = `
                    <div class="reg-threat reg-threat-clear">
                        <span class="reg-threat-icon">&#10003;</span>
                        <span class="reg-threat-text">NO ACTIVE THREAT</span>
                    </div>`;
            }
        }

        // ── PILLAR CARDS + STEWARD SECTION ──
        const PILLAR_ICONS = {
            military: '&#9876;',           // crossed swords
            security: '&#128065;',         // eye
            party: '&#9733;',              // star
            oligarchs: '&#9830;',          // diamond
            bureaucracy: '&#9881;',        // gear
            media: '&#9000;',              // antenna
            foreign_patrons: '&#127758;',  // globe
            religious: '&#9766;',          // ankh/religion
        };
        const PILLAR_ORDER = ['military', 'security', 'party', 'oligarchs', 'bureaucracy', 'media', 'foreign_patrons', 'religious'];

        function pillarColor(val) {
            if (val >= 70) return '#4CAF50';
            if (val >= 50) return '#8BC34A';
            if (val >= 35) return '#ff9800';
            if (val >= 20) return '#ff5722';
            return '#ff1744';
        }
        function pillarLabel(val) {
            if (val >= 70) return 'LOYAL';
            if (val >= 50) return 'CONTENT';
            if (val >= 35) return 'RESTLESS';
            if (val >= 20) return 'HOSTILE';
            return 'MUTINOUS';
        }

        const pillarMap = {};
        for (const p of (regimePillars || [])) pillarMap[p.pillar_key] = p;

        // Determine the pillar name map for description display
        const pillarNameMap = {};
        for (const p of (regimePillars || [])) pillarNameMap[p.pillar_key] = p.pillar_name;

        function stewardStatColor(val) {
            if (val >= 70) return '#4CAF50';
            if (val >= 50) return '#8BC34A';
            if (val >= 30) return '#ff9800';
            return '#ff4444';
        }
        function coupColor(val) {
            if (val >= 60) return '#ff1744';
            if (val >= 30) return '#ff9800';
            if (val >= 10) return '#8BC34A';
            return '#555';
        }

        // Build steward section for non-strongman factions
        let stewardSectionHtml = '';
        const mySteward = stewardByFaction[f.id];

        if (!isStrongman) {
            if (mySteward) {
                // ── STATE 2: Has living steward — steward info shown in left-column status panel only ──
                stewardSectionHtml = '';
            } else if (regimePillars && regimePillars.length > 0) {
                // ── STATE 1 / STATE 3: No living steward — show pillar selection grid ──
                const unclaimedCount = PILLAR_ORDER.filter(key => {
                    const p = pillarMap[key];
                    return p && !stewardByPillar[key];
                }).length;

                if (unclaimedCount === 0) {
                    // All pillars claimed
                    stewardSectionHtml = `
                        <div class="reg-section">
                            <div class="reg-section-title reg-steward-title-pulse">BECOME A STEWARD</div>
                            <div class="reg-steward-all-claimed">All pillars are currently claimed. A pillar becomes available when its steward is removed from power.</div>
                        </div>`;
                } else {
                    const cards = PILLAR_ORDER.map(key => {
                        const p = pillarMap[key];
                        if (!p) return '';
                        const val = Math.max(0, Math.min(100, p.support));
                        const pColor = pillarColor(val);
                        const pLabel = pillarLabel(val);
                        const icon = PILLAR_ICONS[key] || '';
                        const claimedSteward = stewardByPillar[key];

                        let stewardHtml;
                        if (claimedSteward) {
                            const claimedFactionName = factionNameMap[claimedSteward.faction_id] || 'Unknown';
                            stewardHtml = `<div class="reg-pillar-steward">STEWARD: ${escapeHtml(claimedSteward.first_name)} ${escapeHtml(claimedSteward.last_name)} \u2014 ${escapeHtml(claimedFactionName)}</div>`;
                        } else {
                            stewardHtml = `<button class="reg-pillar-claim-btn" data-pillar-id="${p.id}" data-pillar-key="${key}" data-pillar-name="${escapeHtml(p.pillar_name)}">BECOME STEWARD</button>`;
                        }

                        return `
                            <div class="reg-pillar-card${claimedSteward ? ' reg-pillar-card-claimed' : ''}">
                                <div class="reg-pillar-icon">${icon}</div>
                                <div class="reg-pillar-name">${escapeHtml(p.pillar_name)}</div>
                                <div class="reg-pillar-bar-track">
                                    <div class="reg-pillar-bar-fill" style="width:${val}%;background:${pColor}"></div>
                                </div>
                                <div class="reg-pillar-label" style="color:${pColor}">${pLabel}</div>
                                ${stewardHtml}
                            </div>`;
                    }).join('');

                    stewardSectionHtml = `
                        <div class="reg-section">
                            <div class="reg-section-title reg-steward-title-pulse">BECOME A STEWARD</div>
                            <div class="reg-pillar-grid">${cards}</div>
                        </div>`;
                }
            }
        }

        // Build compact steward status panel for left column (above Regime Vitals)
        let stewardStatusHtml = '';
        if (!isStrongman) {
            if (mySteward) {
                const stTypeLabel = STEWARD_TYPE_LABELS[mySteward.steward_type] || mySteward.steward_type;
                const stTypeDesc = STEWARD_TYPE_DESCRIPTIONS[mySteward.steward_type] || '';
                const stTrueLoyalty = mySteward.true_loyalty ?? 50;
                const stEstimatedLoyalty = mySteward.estimated_loyalty ?? 55;
                const stPersonalWealth = Math.round(Number(mySteward.personal_wealth) || 0);
                const stExitReadiness = mySteward.exit_readiness ?? 0;
                const stCoupReadiness = mySteward.coup_readiness ?? 0;
                const stAP = f.action_points ?? 0;

                // Coup readiness sub-label
                const coupSub = stCoupReadiness >= 60
                    ? 'READY TO STRIKE'
                    : `NEED 60 \u2014 ${60 - stCoupReadiness} MORE`;

                // Exit readiness sub-label
                const exitSub = stExitReadiness >= 50
                    ? 'ESCAPE PLAN READY'
                    : stExitReadiness >= 25
                        ? 'PLANNING ESCAPE'
                        : 'NO ESCAPE PLAN';

                // Loyalty gap advice
                const stGapAdvice = stEstimatedLoyalty > stTrueLoyalty + 10
                    ? 'He overestimates you. Use this.'
                    : stEstimatedLoyalty < stTrueLoyalty - 10
                        ? 'He underestimates you. Tread carefully.'
                        : 'His read is close. Stay alert.';

                stewardStatusHtml = `
                    <div class="reg-section">
                        <div class="reg-section-title">STEWARD STATUS</div>
                        <div class="reg-steward-status">
                            <div class="reg-steward-status-header">
                                <div class="reg-steward-status-identity">
                                    <div class="reg-steward-status-name">${escapeHtml(mySteward.first_name)} ${escapeHtml(mySteward.last_name)}, Age ${mySteward.age} <span class="reg-steward-status-badge">${escapeHtml(stTypeLabel)}</span></div>
                                    <div class="reg-steward-status-desc">${escapeHtml(stTypeDesc)}</div>
                                </div>
                                <div class="reg-steward-status-ap">
                                    <span class="reg-steward-status-ap-val">${stAP}</span>
                                    <span class="reg-steward-status-ap-label">AP</span>
                                </div>
                            </div>

                            <div class="reg-steward-status-grid">
                                <div class="reg-steward-status-stat">
                                    <span class="reg-steward-status-stat-label">TRUE LOYALTY</span>
                                    <span class="reg-steward-status-stat-val" style="color:${stewardStatColor(stTrueLoyalty)}">${stTrueLoyalty}</span>
                                    <span class="reg-steward-status-stat-sub">-2/tick natural decay</span>
                                </div>
                                <div class="reg-steward-status-stat">
                                    <span class="reg-steward-status-stat-label">COUP READINESS</span>
                                    <span class="reg-steward-status-stat-val" style="color:${coupColor(stCoupReadiness)}">${stCoupReadiness}</span>
                                    <span class="reg-steward-status-stat-sub">${coupSub}</span>
                                </div>
                                <div class="reg-steward-status-stat">
                                    <span class="reg-steward-status-stat-label">PERSONAL WEALTH</span>
                                    <span class="reg-steward-status-stat-val reg-steward-wealth">$${stPersonalWealth}M</span>
                                    <span class="reg-steward-status-stat-sub">Embezzled funds</span>
                                </div>
                                <div class="reg-steward-status-stat">
                                    <span class="reg-steward-status-stat-label">EXIT READINESS</span>
                                    <span class="reg-steward-status-stat-val" style="color:${coupColor(stExitReadiness)}">${stExitReadiness}</span>
                                    <span class="reg-steward-status-stat-sub">${exitSub}</span>
                                </div>
                            </div>

                            <div class="reg-steward-status-gap">
                                <span class="reg-steward-status-gap-label">LOYALTY GAP:</span>
                                Strongman believes you are at <strong>${stEstimatedLoyalty}</strong> loyalty. Your true loyalty is <strong>${stTrueLoyalty}</strong>. ${stGapAdvice}
                            </div>
                        </div>
                    </div>`;
            } else {
                stewardStatusHtml = `
                    <div class="reg-section">
                        <div class="reg-section-title reg-steward-title-pulse">CHOOSE STEWARD</div>
                        <div class="reg-steward-status-empty">Select a pillar of the regime to serve as its steward.</div>
                    </div>`;
            }
        }

        // ── STEWARD ACTIONS (non-strongman only) ──
        let stewardActionsHtml = '';
        if (!isStrongman && mySteward) {
            const stAP = f.action_points ?? 0;
            const stCoupReadiness = mySteward.coup_readiness ?? 0;
            const stTrueLoyalty = mySteward.true_loyalty ?? 100;
            const canSeize = stCoupReadiness >= 50 && stTrueLoyalty < 30;
            const hasMinistry = (ministryByParty[f.id] || []).length > 0;

            // Calculate coalition coup bonus for display
            let displayCoupBonus = 0;
            for (const c of myActiveCoalitions) {
                const pid = c.faction_a_id === f.id ? c.faction_b_id : c.faction_a_id;
                const ps = stewardByFaction[pid];
                if (ps) {
                    const mod = c.coalition_type === 'secret' ? 0.30 : 0.15;
                    displayCoupBonus += Math.round((ps.power_base ?? 30) * mod);
                }
            }
            const effectiveReadiness = Math.min(95, stCoupReadiness + displayCoupBonus);
            const coupDisplayStr = displayCoupBonus > 0
                ? `${effectiveReadiness}% (${stCoupReadiness}% + ${displayCoupBonus}% allies)`
                : `${stCoupReadiness}%`;

            const isGeneral = mySteward.steward_type === 'general';
            const isSecurityChief = mySteward.steward_type === 'security_chief';
            const isPartyChairman = mySteward.steward_type === 'party_chairman' && !isStrongman;

            // Build surveillance target buttons (other factions with living stewards, excluding self and strongman)
            let surveillanceTargetsHtml = '';
            if (isSecurityChief) {
                const survTargets = (allFactions || []).filter(p => p.id !== f.id && stewardByFaction[p.id]);
                const survBtns = survTargets.map(p => {
                    const pColor = p.party_color || '#666';
                    const sSteward = stewardByFaction[p.id];
                    const sLabel = STEWARD_TYPE_LABELS[sSteward?.steward_type] || '';
                    return `<button class="reg-surv-target-btn" data-faction-id="${p.id}" data-faction-name="${escapeHtml(p.faction_name)}" style="border-left-color:${pColor}">${escapeHtml(p.faction_name)} <span style="opacity:0.5;font-size:0.65rem">${escapeHtml(sLabel)}</span></button>`;
                }).join('');
                surveillanceTargetsHtml = survTargets.length > 0
                    ? `<div class="reg-surv-targets">${survBtns}</div><button class="reg-surv-submit" id="steward-surveillance-submit" disabled>INVESTIGATE</button>`
                    : `<div class="reg-steward-action-req">No targets available</div>`;
            }

            stewardActionsHtml = `
                <div class="reg-section">
                    <div class="reg-section-title">STEWARD ACTIONS</div>
                    <div class="reg-steward-actions">
                        ${isGeneral ? `<button class="reg-steward-action-btn reg-steward-action-general" id="steward-showofforce-btn" ${stAP < 3 ? 'disabled' : ''}>
                            <div class="reg-steward-action-header">
                                <span class="reg-steward-action-name">SHOW OF FORCE</span>
                                <span class="reg-steward-action-cost">3 AP</span>
                            </div>
                            <div class="reg-steward-action-desc">Troops in the capital. Military checkpoints. Armored vehicles at government buildings.</div>
                            <div class="reg-steward-action-effects">All rivals: <strong>-5</strong> Coup Readiness · Unrest <strong>-2</strong> · Happiness <strong>-3</strong></div>
                        </button>` : ''}
                        ${isSecurityChief ? `<div class="reg-steward-action-btn reg-steward-action-security" id="steward-surveillance-panel">
                            <div class="reg-steward-action-header">
                                <span class="reg-steward-action-name">SURVEILLANCE</span>
                                <span class="reg-steward-action-cost">1 AP</span>
                            </div>
                            <div class="reg-steward-action-desc">Investigate a target. Tap communications. Follow movements. Review financial records.</div>
                            <div class="reg-steward-action-effects">Reveals: <strong>True Loyalty</strong> (exact) &middot; <strong>Secret Coalitions</strong></div>
                            ${stAP >= 1 ? surveillanceTargetsHtml : '<div class="reg-steward-action-req">Not enough AP</div>'}
                        </div>` : ''}
                        ${isPartyChairman ? `<div class="reg-steward-action-btn reg-steward-action-party" id="steward-mobilize-panel">
                            <div class="reg-steward-action-header">
                                <span class="reg-steward-action-name">MOBILIZE</span>
                                <span class="reg-steward-action-cost">${MOBILIZE_CONFIG.AP_COST} AP</span>
                            </div>
                            <div class="reg-steward-action-desc">Organize crowds and demonstrations. Choose your purpose.</div>
                            ${stAP >= MOBILIZE_CONFIG.AP_COST ? `
                            <div class="reg-mobilize-modes">
                                <button class="reg-mobilize-mode-btn" data-mode="rally_regime">
                                    <div class="reg-mobilize-mode-name">Rally for the Regime</div>
                                    <div class="reg-mobilize-mode-desc">Flags, banners, crowds chanting the Strongman's name.</div>
                                    <div class="reg-steward-action-effects">Legitimacy: <strong>+3</strong> · Standing: <strong>+3</strong></div>
                                </button>
                                <button class="reg-mobilize-mode-btn" data-mode="rally_self">
                                    <div class="reg-mobilize-mode-name">Rally for Yourself</div>
                                    <div class="reg-mobilize-mode-desc">Your portrait is getting bigger. Your speeches are about YOUR vision.</div>
                                    <div class="reg-steward-action-effects">Coup Readiness: <strong>+5</strong> · Grip on Power: <strong>-2</strong></div>
                                    <div class="reg-steward-action-risk">Detection Risk: <span class="reg-steward-action-risk-val">15%</span> · If caught: Standing <strong>-10</strong></div>
                                </button>
                            </div>` : '<div class="reg-steward-action-req">Not enough AP</div>'}
                        </div>` : ''}
                        <button class="reg-steward-action-btn" id="steward-embezzle-btn" ${(stAP < 1 || !hasMinistry) ? 'disabled' : ''}>
                            <div class="reg-steward-action-header">
                                <span class="reg-steward-action-name">EMBEZZLE</span>
                                <span class="reg-steward-action-cost">1 AP</span>
                            </div>
                            <div class="reg-steward-action-desc">Skim funds from a ministry you control. <strong>+1D6M</strong> Personal Wealth.</div>
                            <div class="reg-steward-action-risk">Detection Risk: <span class="reg-steward-action-risk-val">10%</span></div>
                            ${!hasMinistry ? '<div class="reg-steward-action-req">Requires: Hold a ministry</div>' : ''}
                        </button>
                        <button class="reg-steward-action-btn" id="steward-conspire-btn" ${stAP < 2 ? 'disabled' : ''}>
                            <div class="reg-steward-action-header">
                                <span class="reg-steward-action-name">CONSPIRE</span>
                                <span class="reg-steward-action-cost">2 AP</span>
                            </div>
                            <div class="reg-steward-action-desc">Build secret alliances. <strong>+10</strong> Coup Readiness.</div>
                            <div class="reg-steward-action-risk">Detection Risk: <span class="reg-steward-action-risk-val">20%</span></div>
                        </button>
                        <button class="reg-steward-action-btn reg-steward-action-seize" id="steward-seize-btn" ${!canSeize ? 'disabled' : ''}>
                            <div class="reg-steward-action-header">
                                <span class="reg-steward-action-name">SEIZE POWER</span>
                            </div>
                            <div class="reg-steward-action-desc">Launch a coup. <strong>Success: ${coupDisplayStr}</strong></div>
                            <div class="reg-steward-action-req">${canSeize ? 'READY TO STRIKE' : `Requires: Loyalty < 30 (${stTrueLoyalty}) & Readiness \u2265 50 (${stCoupReadiness})`}</div>
                        </button>
                    </div>
                </div>`;
        }

        // Build pillar cards for Strongman view (support values, no claim buttons)
        let pillarCardsHtml = '';
        if (isStrongman && regimePillars && regimePillars.length > 0) {
            const cards = PILLAR_ORDER.map(key => {
                const p = pillarMap[key];
                if (!p) return '';
                const val = Math.max(0, Math.min(100, p.support));
                const pColor = pillarColor(val);
                const pLabel = pillarLabel(val);
                const icon = PILLAR_ICONS[key] || '';
                const claimedSteward = stewardByPillar[key];

                let stewardHtml = '';
                if (claimedSteward) {
                    const claimedFactionName = factionNameMap[claimedSteward.faction_id] || 'Unknown';
                    stewardHtml = `<div class="reg-pillar-steward">${escapeHtml(claimedSteward.first_name)} ${escapeHtml(claimedSteward.last_name)} \u2014 ${escapeHtml(claimedFactionName)}</div>`;
                }

                return `
                    <div class="reg-pillar-card">
                        <div class="reg-pillar-icon">${icon}</div>
                        <div class="reg-pillar-name">${escapeHtml(p.pillar_name)}</div>
                        <div class="reg-pillar-bar-track">
                            <div class="reg-pillar-bar-fill" style="width:${val}%;background:${pColor}"></div>
                        </div>
                        <div class="reg-pillar-label" style="color:${pColor}">${pLabel}</div>
                        ${stewardHtml}
                    </div>`;
            }).join('');

            pillarCardsHtml = `
                <div class="reg-section">
                    <div class="reg-section-title">PILLARS OF THE REGIME</div>
                    <div class="reg-pillar-grid">${cards}</div>
                </div>`;
        }

        // ── REGIME LOG ──
        const ACTION_LABELS = {
            rally: 'RALLY',
            make_promise: 'PROMISE MADE',
            press_conference: 'PRESS CONFERENCE',
            purge_minister: 'PURGE',
            claim_power: 'SEIZED POWER',
            no_confidence_failed: 'NO CONFIDENCE FAILED',
            assign_minister: 'MINISTER APPOINTED',
            fire_minister: 'MINISTER DISMISSED',
            steward_claim: 'STEWARD CLAIMED',
            demand_loyalty: 'DEMAND LOYALTY',
            loyalty_demand_complied: 'COMPLIED',
            loyalty_demand_refused: 'REFUSED',
            loyalty_demand_expired: 'DEMAND EXPIRED',
            steward_show_of_force: 'SHOW OF FORCE',
            steward_surveillance: 'SURVEILLANCE',
            steward_embezzle: 'EMBEZZLED',
            steward_conspire: 'CONSPIRED',
            steward_detected_embezzle: 'EMBEZZLE DETECTED',
            steward_detected_conspire: 'CONSPIRE DETECTED',
            coup_success: 'COUP \u2014 SUCCESS',
            coup_failed: 'COUP \u2014 FAILED',
            coalition_proposed: 'COALITION PROPOSED',
            coalition_accepted: 'COALITION FORMED',
            coalition_betrayed: 'BETRAYAL',
            coalition_detected: 'COALITION DETECTED',
            coalition_dissolved: 'COALITION DISSOLVED'
        };

        let regimeLogHtml = '';
        if (regimeLogData && regimeLogData.length > 0) {
            const logRows = regimeLogData.map(entry => {
                const dateStr = tickToDate(entry.tick_performed);
                const factionName = entry.factions?.abbreviation || entry.factions?.faction_name || '???';
                const label = ACTION_LABELS[entry.action_type] || entry.action_type.replace(/_/g, ' ').toUpperCase();
                const r = entry.result || {};

                let detail = '';
                if (entry.action_type === 'purge_minister') {
                    detail = `${r.minister_name || 'Unknown'} purged from ${MINISTRY_SHORT[r.ministry_key] || r.target_party || 'ministry'}`;
                } else if (entry.action_type === 'assign_minister') {
                    detail = `${r.minister_name || 'Unknown'} appointed as ${MINISTRY_SHORT[r.ministry_key] || 'minister'}` + (r.party_name ? ` (${r.party_name})` : '');
                } else if (entry.action_type === 'fire_minister') {
                    detail = `${r.minister_name || 'Unknown'} dismissed from ${MINISTRY_SHORT[r.ministry_key] || 'ministry'}`;
                } else if (entry.action_type === 'make_promise') {
                    detail = r.headline || r.demandText || '';
                } else if (entry.action_type === 'press_conference') {
                    detail = r.headline || r.stat || '';
                } else if (entry.action_type === 'rally') {
                    detail = r.headline || '';
                } else if (entry.action_type === 'steward_claim') {
                    detail = r.pillar_name ? `Claimed ${r.pillar_name}` : '';
                } else if (entry.action_type === 'demand_loyalty') {
                    detail = r.target_faction ? `Demanded loyalty from ${r.target_faction}` : '';
                } else if (entry.action_type === 'loyalty_demand_complied') {
                    detail = r.faction_name ? `${r.faction_name} complied` : 'Complied with demand';
                } else if (entry.action_type === 'loyalty_demand_refused') {
                    detail = r.faction_name ? `${r.faction_name} refused` : 'Refused demand';
                } else if (entry.action_type === 'loyalty_demand_expired') {
                    detail = r.target_faction ? `${r.target_faction} ignored demand` : 'Demand expired';
                } else if (entry.action_type === 'claim_power') {
                    detail = r.method || '';
                } else if (entry.action_type === 'steward_show_of_force') {
                    detail = `${r.steward_name} deployed troops. Rivals: coup readiness ${r.rivals_coup_readiness}, unrest ${r.civil_unrest}, happiness ${r.happiness}`;
                } else if (entry.action_type === 'steward_surveillance') {
                    // Only visible to the player who performed it
                    if (entry.party_id !== f.id) return '';
                    detail = `Investigated ${r.target_faction}: Loyalty ${r.true_loyalty}, ${r.secret_coalitions}`;
                } else if (entry.action_type === 'steward_embezzle') {
                    detail = `Embezzled $${r.embezzled}M from ${MINISTRY_SHORT[r.ministry] || r.ministry}${r.detected ? ' \u2014 DETECTED' : ''}`;
                } else if (entry.action_type === 'steward_conspire') {
                    detail = `Conspiracy advanced (readiness: ${r.new_coup_readiness}, loyalty -${r.loyalty_drop})${r.detected ? ' \u2014 DETECTED' : ''}`;
                } else if (['steward_detected_embezzle', 'steward_detected_conspire'].includes(entry.action_type)) {
                    detail = `${r.steward_name} (${r.faction_name}) caught! Standing -15`;
                } else if (entry.action_type === 'coup_success') {
                    detail = `${r.steward_name} (${r.faction_name}) seized power!`;
                } else if (entry.action_type === 'coup_failed') {
                    detail = `${r.steward_name} (${r.faction_name}) failed \u2014 executed`;
                } else if (entry.action_type === 'coalition_proposed') {
                    if (r.coalition_type === 'secret' && isStrongman) { detail = ''; label = ''; }
                    else detail = `${r.coalition_type === 'public' ? 'Public' : 'Secret'} coalition proposed to ${r.target_faction}`;
                } else if (entry.action_type === 'coalition_accepted') {
                    if (r.coalition_type === 'secret' && isStrongman) { detail = ''; label = ''; }
                    else detail = `${r.coalition_type === 'public' ? 'Public' : 'Secret'} coalition formed with ${r.partner_faction}`;
                } else if (entry.action_type === 'coalition_betrayed') {
                    // Only visible to the Strongman and the reporter — never the betrayed faction
                    if (!isStrongman && r.reporter_faction_id !== f.id) return '';
                    detail = isStrongman
                        ? `${factionName} reported ${r.betrayed_faction} for secret dealings`
                        : `You reported ${r.betrayed_faction} to the Strongman`;
                } else if (entry.action_type === 'coalition_detected') {
                    // Only the Strongman should know a coalition was detected
                    if (!isStrongman) return '';
                    detail = `Secret coalition: ${r.faction_a_name} + ${r.faction_b_name} discovered`;
                } else if (entry.action_type === 'coalition_dissolved') {
                    detail = r.partner_faction ? `Coalition with ${r.partner_faction} dissolved` : 'Coalition dissolved';
                }

                if (!label) return ''; // Hidden entry (e.g. secret coalition not visible to strongman)
                return `<div class="reg-log-row">
                    <span class="reg-log-date">${escapeHtml(dateStr)}</span>
                    <span class="reg-log-faction">${escapeHtml(factionName)}</span>
                    <span class="reg-log-label">${escapeHtml(label)}</span>
                    ${detail ? `<span class="reg-log-detail">${escapeHtml(detail)}</span>` : ''}
                </div>`;
            }).join('');

            regimeLogHtml = `
                <div class="reg-section">
                    <div class="reg-section-title">REGIME LOG</div>
                    <div class="reg-log-list">${logRows}</div>
                </div>`;
        } else {
            regimeLogHtml = `
                <div class="reg-section">
                    <div class="reg-section-title">REGIME LOG</div>
                    <div class="reg-log-empty">No actions recorded yet.</div>
                </div>`;
        }

        // ── DEMAND LOYALTY PANEL (Strongman only) ──
        let demandLoyaltyHtml = '';
        if (isStrongman) {
            const availableTargets = nonRuling.filter(p => !demandedThisTick.has(p.id));
            const targetBtns = availableTargets.map(p => {
                const pColor = p.party_color || '#666';
                return `<button class="reg-demand-target-btn" data-faction-id="${p.id}" data-faction-name="${escapeHtml(p.faction_name)}" style="border-left-color:${pColor}">${escapeHtml(p.faction_name)}</button>`;
            }).join('');

            demandLoyaltyHtml = `
                <div class="reg-section">
                    <div class="reg-section-title">DEMAND LOYALTY</div>
                    <div class="reg-demand-panel">
                        <div class="reg-demand-cost">2 AP &middot; Target one player</div>
                        <div class="reg-demand-desc">
                            <strong>Comply:</strong> Loyalty +8. They submitted.<br>
                            <strong>Refuse:</strong> True loyalty revealed. Standing &minus;10.
                        </div>
                        ${availableTargets.length > 0 ? `
                            <div class="reg-demand-targets">${targetBtns}</div>
                            <button class="reg-demand-submit" id="demand-loyalty-btn" disabled>DEMAND</button>
                        ` : `<div class="reg-demand-exhausted">All factions have been demanded this tick.</div>`}
                    </div>
                </div>`;
        }

        // ── DEMAND BANNER (non-strongman with pending demand) ──
        let demandBannerHtml = '';
        if (!isStrongman && myPendingDemand) {
            const ticksLeft = Math.max(0, myPendingDemand.deadline_tick - currentTick);
            demandBannerHtml = `
                <div class="reg-demand-banner">
                    <div class="reg-demand-banner-title">&#9888; THE STRONGMAN DEMANDS YOUR LOYALTY</div>
                    <div class="reg-demand-banner-text">You must Comply or Refuse. Silence will be treated as Refusal.</div>
                    <div class="reg-demand-banner-deadline">${ticksLeft} tick${ticksLeft !== 1 ? 's' : ''} remaining</div>
                    <div class="reg-demand-banner-btns">
                        <button class="reg-demand-comply-btn" id="demand-comply-btn" data-demand-id="${myPendingDemand.id}">COMPLY</button>
                        <button class="reg-demand-refuse-btn" id="demand-refuse-btn" data-demand-id="${myPendingDemand.id}">REFUSE</button>
                    </div>
                </div>`;
        }

        // ── COALITION REQUEST BANNER (non-strongman with pending request) ──

    // ── Steward claim handlers (with confirmation dialog) ──
    el.querySelectorAll('.reg-pillar-claim-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const pillarId = btn.dataset.pillarId;
            const pillarKey = btn.dataset.pillarKey;
            const pillarName = btn.dataset.pillarName;
            const stewardType = PILLAR_TO_STEWARD_TYPE[pillarKey] || 'technocrat';
            const typeLabel = STEWARD_TYPE_LABELS[stewardType] || stewardType;

            // Show confirmation overlay
            const overlay = document.getElementById('steward-confirm-overlay');
            const titleEl = document.getElementById('steward-confirm-title');
            const textEl = document.getElementById('steward-confirm-text');
            const yesBtn = document.getElementById('steward-confirm-yes');
            const noBtn = document.getElementById('steward-confirm-no');
            if (!overlay) return;

            titleEl.textContent = `Become ${typeLabel}`;
            textEl.textContent = `You will become the ${typeLabel} \u2014 Steward of ${pillarName}. This choice is permanent. Proceed?`;
            overlay.style.display = 'flex';

            // Remove old listeners by cloning
            const newYes = yesBtn.cloneNode(true);
            const newNo = noBtn.cloneNode(true);
            yesBtn.replaceWith(newYes);
            noBtn.replaceWith(newNo);

            newNo.addEventListener('click', () => { overlay.style.display = 'none'; });

            newYes.addEventListener('click', async () => {
                overlay.style.display = 'none';
                btn.disabled = true;
                btn.textContent = 'Claiming...';

                // Claim the pillar (only if unclaimed — permanent, no switching)
                const { error } = await _supabase
                    .from('regime_pillars')
                    .update({ steward_faction_id: f.id })
                    .eq('id', pillarId)
                    .is('steward_faction_id', null);

                if (error) {
                    console.error('[pillar-claim]', error);
                    btn.textContent = 'Failed';
                    setTimeout(() => { btn.textContent = 'BECOME STEWARD'; btn.disabled = false; }, 2000);
                    return;
                }

                // Generate steward identity
                const firstName = PM_FIRST_NAMES[Math.floor(Math.random() * PM_FIRST_NAMES.length)];

                // Avoid duplicating last names of existing living stewards
                const existingLastNames = new Set(
                    (stewardRows || []).filter(s => s.is_alive !== false).map(s => s.last_name)
                );
                let lastName;
                do { lastName = PM_LAST_NAMES[Math.floor(Math.random() * PM_LAST_NAMES.length)]; }
                while (existingLastNames.has(lastName) && existingLastNames.size < PM_LAST_NAMES.length);

                // Age: 38-72 (uniform)
                const age = 38 + Math.floor(Math.random() * 35);

                // Archetype-specific initialization
                const trueLoyalty = 40 + Math.floor(Math.random() * 31); // 40-70
                let personalWealth = 0;
                let exitReadiness = 0;
                if (stewardType === 'oligarch') personalWealth = 200 + Math.floor(Math.random() * 601); // $200M-800M
                if (stewardType === 'intelligence_director') exitReadiness = 15;

                    .from('stewards')
                    .upsert({
                        nation_id: n.id,
                        faction_id: f.id,
                        pillar_key: pillarKey,
                        steward_type: stewardType,
                        first_name: firstName,
                        last_name: lastName,

                        standing: 50,
                        power_base: 20,
                        true_loyalty: trueLoyalty,
                        estimated_loyalty: 55,
                        personal_wealth: personalWealth,
                        exit_readiness: exitReadiness,
                        coup_readiness: 0,
                        is_alive: true,
                        created_at_tick: currentTick,
                    }, { onConflict: 'nation_id,faction_id' });

                if (stewardErr) {
                    console.error('[steward-insert]', stewardErr);
                } else {

                        party_id: f.id,
                        nation_id: n.id,
                        action_type: 'steward_claim',
                        tick_performed: currentTick,
                        result: { pillar_key: pillarKey, pillar_name: pillarName, steward_type: stewardType, steward_name: `${firstName} ${lastName}` }

    // Coalition messaging
    el.querySelectorAll('.reg-coalition-msg-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
            const coalitionId = btn.dataset.coalitionId;
            const partnerName = btn.dataset.partnerName;
            const overlay = document.getElementById('coalition-msg-overlay');
            const titleEl = document.getElementById('coalition-msg-title');
            const listEl = document.getElementById('coalition-msg-list');
            const inputEl = document.getElementById('coalition-msg-input');
            const sendBtn = document.getElementById('coalition-msg-send');
            const closeBtn = document.getElementById('coalition-msg-close');
            if (!overlay || !listEl) return;

            titleEl.textContent = `Messages \u2014 ${partnerName}`;
            overlay.style.display = 'flex';

            async function loadMessages() {
                const { data: msgs } = await _supabase
                    .from('coalition_messages')
                    .select('faction_id, message, tick_posted')
                    .eq('coalition_id', coalitionId)
                    .order('created_at', { ascending: true })
                    .limit(50);

                listEl.innerHTML = (msgs || []).map(m => {
                    const isMine = m.faction_id === f.id;
                    const senderName = isMine ? f.faction_name : partnerName;
                    return `<div class="reg-coalition-msg ${isMine ? 'mine' : 'theirs'}">
                        <span class="reg-coalition-msg-sender">${escapeHtml(senderName)}</span>
                        <span class="reg-coalition-msg-text">${escapeHtml(m.message)}</span>
                        <span class="reg-coalition-msg-tick">Tick ${m.tick_posted}</span>
                    </div>`;
                }).join('') || '<div class="reg-coalition-msg-empty">No messages yet.</div>';

                listEl.scrollTop = listEl.scrollHeight;
            }

            await loadMessages();

            // Clone buttons and input to remove old listeners
            const newSend = sendBtn.cloneNode(true);
            const newClose = closeBtn.cloneNode(true);
            const newInput = inputEl.cloneNode(true);
            sendBtn.replaceWith(newSend);
            closeBtn.replaceWith(newClose);
            inputEl.replaceWith(newInput);

            newClose.addEventListener('click', () => { overlay.style.display = 'none'; });

            newSend.addEventListener('click', async () => {
                const text = newInput.value.trim();
                if (!text) return;
                newSend.disabled = true;

                await _supabase.from('coalition_messages').insert({
                    coalition_id: coalitionId,
                    faction_id: f.id,
                    message: text,
                    tick_posted: currentTick
                });

                newInput.value = '';
                newSend.disabled = false;
                await loadMessages();
            });

            // Allow enter key to send
            newInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); newSend.click(); }
            });
        });
    });

    // ── TAB BADGE for pending demand or coalition request ──
    const partiesTab = document.querySelector('.nav-tab[data-tab="parties"]');
    if (partiesTab) {
        const existingBadge = partiesTab.querySelector('.reg-tab-badge');
        const hasPending = myPendingDemand || myPendingCoalitionRequests.length > 0;
        if (hasPending) {
            if (!existingBadge) {
                const badge = document.createElement('span');
                badge.className = 'reg-tab-badge';
                badge.textContent = '!';
                partiesTab.style.position = 'relative';
                partiesTab.appendChild(badge);
            }
        } else if (existingBadge) {
            existingBadge.remove();
        }
    }

    // ── DISBAND PARTY handler ──
    const disbandBtn = document.getElementById('disband-party-btn');
    if (disbandBtn) {
        disbandBtn.addEventListener('click', async () => {
            if (!confirm('Are you sure you want to disband your party? This is permanent — your party will be removed from the game after the next tick.')) return;
            if (!confirm('This cannot be undone. Disband your party?')) return;
            disbandBtn.disabled = true;
            disbandBtn.textContent = 'Disbanding...';
            try {
                await disbandParty(_supabase, n.id, f.id, currentTick);
                sessionStorage.removeItem('nationhood_state');
                await _supabase.auth.signOut();
                window.location.href = 'index.html';
            } catch (err) {
                alert(err.message || 'Failed to disband party.');
                disbandBtn.disabled = false;
                disbandBtn.textContent = 'Disband Party';
            }
        });
    }
}

async function renderParties() {
    const el = document.getElementById('content-area');
    const n = currentNation;

    if (!currentFaction || !n) {
        console.warn('[parties] Missing faction or nation:', { faction: currentFaction, nation: n });
        el.innerHTML = '<p style="color:var(--text-muted);text-align:center;margin-top:40px;">No party data available.</p>';
        return;
    }

    // Refresh faction data so AP and funds are up to date
    const { data: freshFaction } = await _supabase.from('factions')
        .select('action_points, party_funds, approval_rating, loyalty, seats')
        .eq('id', currentFaction.id).single();
    if (freshFaction) {
        currentFaction.action_points = freshFaction.action_points;
        currentFaction.party_funds = freshFaction.party_funds;
        currentFaction.approval_rating = freshFaction.approval_rating;
        currentFaction.loyalty = freshFaction.loyalty;
        currentFaction.seats = freshFaction.seats;
    }
    const f = currentFaction;

    const isAutocracy = isGovernmentAutocracy(n);

    if (isAutocracy) {
        await renderAutocracyParties(el, f, n);
        return;
    }

    // Fetch all parties for seat + vote share data
    const { data: allParties } = await _supabase
        .from('factions')
        .select('id, faction_name, abbreviation, seats, national_vote_share, party_color, party_logo, party_description, leader_first_name, leader_last_name, leader_age, founded_tick, ideology_value_1, ideology_value_2')
        .eq('nation_id', n.id)
        .eq('faction_type', 'party');

    // Load ideology data for all parties
    const nationIdeologies = await loadNationIdeologies(_supabase, n.id);
    const ideoByFaction = {};
    for (const row of (nationIdeologies || [])) {
        ideoByFaction[row.faction_id] = row;
    }

    const seatData = await loadSeats(_supabase, n.id, false, allParties || [], f.id);
    const mySeats = seatData.currentSeats || 0;

    const coalition = await fetchActiveCoalition(_supabase, n.id);

    // Fetch next scheduled election
    const { data: nextElection } = await _supabase
        .from('elections').select('election_tick')
        .eq('nation_id', n.id).eq('status', 'scheduled')
        .gt('election_tick', currentShard?.current_tick || 0)
        .order('election_tick', { ascending: true }).limit(1).maybeSingle();

    // === Presidential Nominee Selection ===
    const isPresidential = isPresidentialRepublic(n);
    let presNomineeState = 'hidden'; // hidden | greyed | active | locked
    let presNomineeCandidates = [];
    let presNomineeSelected = null;
    let presNomineeTraits = {};
    let presNextElectionTick = null;
    let presTicksUntil = null;

    if (isPresidential) {
        const currentTick = currentShard?.current_tick || 0;
        // Fetch next presidential election
        const { data: nextPresElection } = await _supabase
            .from('elections').select('election_tick')
            .eq('nation_id', n.id).eq('status', 'scheduled')
            .eq('election_type', 'presidential')
            .gt('election_tick', currentTick)
            .order('election_tick', { ascending: true }).limit(1).maybeSingle();

        presNextElectionTick = nextPresElection?.election_tick || null;
        presTicksUntil = presNextElectionTick ? presNextElectionTick - currentTick : null;

        // Check if already selected a nominee for this election
        const { data: selectedNominee } = await _supabase
            .from('pm_candidates')
            .select('*')
            .eq('nation_id', n.id)
            .eq('faction_id', f.id)
            .eq('candidate_type', 'presidential')
            .eq('selected', true)
            .limit(1)
            .maybeSingle();

        if (selectedNominee) {
            presNomineeState = 'locked';
            presNomineeSelected = selectedNominee;
        } else {
            // Check for unselected candidates (generated by tick processor)
            const { data: unselectedCandidates } = await _supabase
                .from('pm_candidates')
                .select('*')
                .eq('nation_id', n.id)
                .eq('faction_id', f.id)
                .eq('candidate_type', 'presidential')
                .eq('selected', false)
                .order('created_at', { ascending: true });

            if (unselectedCandidates && unselectedCandidates.length > 0) {
                presNomineeState = 'active';
                presNomineeCandidates = unselectedCandidates;
            } else if (presTicksUntil !== null && presTicksUntil <= GAME_CONFIG.PRESIDENTIAL_CANDIDATE_LEAD_TICKS) {
                presNomineeState = 'active'; // should have candidates but may not yet
            } else {
                presNomineeState = 'greyed';
            }
        }

        // Load leader traits for candidate cards
        if (presNomineeState === 'active' || presNomineeState === 'locked') {
            const { data: traitRows } = await _supabase.from('leader_traits').select('*');
            (traitRows || []).forEach(t => { presNomineeTraits[t.trait_key] = t; });
        }

        // Update the Parties nav badge if nominee selection is available
        if (presNomineeState === 'active' && presNomineeCandidates.length > 0) {
            setTimeout(() => {
                const badge = document.getElementById('parties-nominee-badge');
                if (badge) { badge.style.display = ''; badge.textContent = '!'; }
            }, 100);
        }
    }

    // Fetch momentum data for all parties
    const allPartyIds = (allParties || []).map(p => p.id);

    // Self-heal: ensure current faction has bloc approval rows (may be missing after failed disband)
    await ensureBlocApprovals(_supabase, f.id, n.id);

    const { data: allBlocApprovals } = await _supabase
        .from('faction_bloc_approval')
        .select('faction_id, momentum, bloc_id, preference_score, ideology_alignment, performance_perception')
        .in('faction_id', allPartyIds);

    const { data: blocs } = await _supabase
        .from('voter_blocs')
        .select('id, bloc_name, population_weight, priority_issues, axis_liberty_equality, axis_tradition_progress, axis_security_freedom, axis_globalism_nationalism, axis_individualism_collectivism')
        .eq('nation_id', n.id)
        .eq('is_active', true);

    // Fetch recent momentum log for this party (per-bloc + global, last 30 entries)
    const { data: momentumLog } = await _supabase
        .from('momentum_log')
        .select('amount, source, tick, bloc_id')
        .eq('nation_id', n.id)
        .eq('faction_id', f.id)
        .order('tick', { ascending: false })
        .limit(30);

    const blocWeights = {};
    for (const b of (blocs || [])) blocWeights[b.id] = b.population_weight || 1;

    // Compute weighted-average momentum per party
    const partyMomentum = {};
    for (const row of (allBlocApprovals || [])) {
        if (!partyMomentum[row.faction_id]) partyMomentum[row.faction_id] = { wSum: 0, wTotal: 0 };
        const w = blocWeights[row.bloc_id] || 1;
        partyMomentum[row.faction_id].wSum += (row.momentum || 0) * w;
        partyMomentum[row.faction_id].wTotal += w;
    }
    const partyScores = allPartyIds.map(id => {
        const m = partyMomentum[id];
        const raw = m && m.wTotal > 0 ? m.wSum / m.wTotal : 0;
        return { id, score: Math.round(Math.max(0, Math.min(100, 50 + raw))) };
    }).sort((a, b) => b.score - a.score);

    const myEntry = partyMomentum[f.id];
    const rawMomentum = myEntry && myEntry.wTotal > 0 ? myEntry.wSum / myEntry.wTotal : 0;
    const momentumScore = Math.round(Math.max(0, Math.min(100, 50 + rawMomentum)));
    const decayPerTick = Math.round(Math.abs(rawMomentum) * 0.15 * 10) / 10;
    const momentumRank = partyScores.findIndex(p => p.id === f.id) + 1;
    const totalParties = partyScores.length;
    const role = getPartyRole(f.id, mySeats, coalition);
    const badgeClass = getRoleBadgeClass(role);

    const partyColor = f.party_color || '#ffcc00';
    const logoSvg = getPartyIconSVG(f.party_logo, 44, partyColor);
    const treasury = formatCurrency(f.party_funds || 0);
    const founded = tickToDate(f.founded_tick);
    const leaderName = f.leader_first_name && f.leader_last_name
        ? f.leader_first_name + ' ' + f.leader_last_name + (f.leader_age ? ', ' + f.leader_age : '')
        : '—';
    const ideologyTags = buildIdeologyTags(f);
    const abbr = f.abbreviation ? `<span class="my-party-abbr">(${f.abbreviation})</span>` : '';

    // Build projected vote share bars via election simulation
    const partyLookup = {};
    for (const p of (allParties || [])) partyLookup[p.id] = p;

    let parties = [];
    try {
        const preview = await runElectionPreview(_supabase, n.id);
        parties = (preview.results || []).map(r => ({
            id: r.party_id,
            share: r.vote_percentage || 0,
            abbreviation: partyLookup[r.party_id]?.abbreviation || null,
            party_color: partyLookup[r.party_id]?.party_color || '#666',
            faction_name: r.party_name
        }));
    } catch (e) {
        console.warn('Election preview unavailable:', e.message);
        parties = (allParties || []).map(p => ({
            ...p, share: p.national_vote_share || 0
        }));
    }
    parties.sort((a, b) => b.share - a.share);
    const maxShare = Math.max(...parties.map(p => p.share), 1);

    let voteBarsHtml = '';
    for (const p of parties) {
        const pct = p.share.toFixed(1);
        const barW = (p.share / maxShare) * 100;
        const color = p.party_color || '#666';
        const isMe = p.id === f.id;
        const label = p.abbreviation || p.faction_name;
        voteBarsHtml += `
            <div class="vote-bar-row${isMe ? ' vote-bar-mine' : ''}">
                <span class="vote-bar-label">${label}</span>
                <div class="vote-bar-track">
                    <div class="vote-bar-fill" style="width:${barW}%;background:${color}"></div>
                </div>
                <span class="vote-bar-pct">${pct}%</span>
            </div>`;
    }


    // === Approval by Voter Bloc (compute data) ===
    const blocLookup = {};
    for (const b of (blocs || [])) blocLookup[b.id] = b;

    const approvalByBloc = {};
    const pillarByBloc = {};  // { blocId: { factionId: { ideo, perf, mom } } }
    for (const row of (allBlocApprovals || [])) {
        if (!approvalByBloc[row.bloc_id]) approvalByBloc[row.bloc_id] = {};
        approvalByBloc[row.bloc_id][row.faction_id] = row.preference_score ?? 0;
        if (!pillarByBloc[row.bloc_id]) pillarByBloc[row.bloc_id] = {};
        pillarByBloc[row.bloc_id][row.faction_id] = {
            ideo: Math.round(row.ideology_alignment ?? 50),
            perf: Math.round(row.performance_perception ?? 50),
            mom: Math.round(row.momentum ?? 0),
            drift: row.ideology_drift ?? 0
        };
    }

    const blocRows = (blocs || []).map(b => {
        const myApproval = approvalByBloc[b.id]?.[f.id] ?? 0;
        let leaderId = null;
        let leaderApproval = -1;
        for (const pid of allPartyIds) {
            const a = approvalByBloc[b.id]?.[pid] ?? 0;
            if (a > leaderApproval) { leaderApproval = a; leaderId = pid; }
        }
        const leaderParty = partyLookup[leaderId];
        const isLeading = leaderId === f.id;
        const margin = leaderApproval - myApproval;
        const pillars = pillarByBloc[b.id]?.[f.id] || { ideo: 50, perf: 50, mom: 0 };
        return {
            blocId: b.id,
            blocName: b.bloc_name,
            popWeight: b.population_weight || 0,
            myApproval,
            leaderId,
            leaderAbbr: leaderParty?.abbreviation || '?',
            leaderColor: leaderParty?.party_color || '#666',
            isLeading,
            margin,
            pillars,
            axes: {
                liberty_equality: b.axis_liberty_equality ?? 50,
                tradition_progress: b.axis_tradition_progress ?? 50,
                security_freedom: b.axis_security_freedom ?? 50,
                globalism_nationalism: b.axis_globalism_nationalism ?? 50,
                individualism_collectivism: b.axis_individualism_collectivism ?? 50
            },
            priorityIssues: b.priority_issues || []
        };
    }).sort((a, b) => b.myApproval - a.myApproval);


    // === Performance Credit ===
    const MINISTRY_NAMES = {
        prime_minister: 'Prime Minister', interior: 'Interior', foreign: 'Foreign',
        defense: 'Defense', finance: 'Finance', education: 'Education',
        healthcare: 'Healthcare', labor: 'Labor', justice: 'Justice',
        transportation: 'Transportation', security: 'Security'
    };

    // Fetch ministries held by our party
    const { data: myMinistries } = await _supabase
        .from('ministries')
        .select('ministry_key')
        .eq('nation_id', n.id)
        .eq('party_id', f.id)
        .eq('is_active', true);

    // Check if we're PM
    const isPM = coalition && coalition.lead_party_id === f.id;

    const heldKeys = new Set((myMinistries || []).map(m => m.ministry_key));
    if (isPM) heldKeys.add('prime_minister');
    const heldMinistryCount = heldKeys.size;

    // Build stat-to-trend data if we hold ministries
    let trendingWell = [];
    let trendingBadly = [];
    let trendingFlat = [];
    let swingWarnings = [];

    if (heldMinistryCount > 0) {
        // Fetch previous tick stats
        const currentTick = currentShard?.current_tick || 0;
        let prevStats = null;
        if (currentTick > 0) {
            const { data: histRow } = await _supabase
                .from('nations_history')
                .select('*')
                .eq('nation_id', n.id)
                .eq('tick', currentTick - 1)
                .single();
            prevStats = histRow;
        }

        // Find all stats we're responsible for
        const myStats = [];
        for (const [statKey, ministryKey] of Object.entries(STAT_TO_MINISTRY)) {
            if (heldKeys.has(ministryKey)) myStats.push(statKey);
        }

        // Compute trends
        const FLAT_THRESHOLD = 0.15;
        for (const statKey of myStats) {
            const current = n[statKey];
            const prev = prevStats ? prevStats[statKey] : null;
            if (current == null) continue;

            const sign = statDirectionSign(statKey);
            if (sign === 0) continue;

            const rawDelta = (prev != null) ? current - prev : 0;
            const improvement = rawDelta * sign; // positive = getting better

            const label = statKey.replace(/_/g, ' ');
            if (Math.abs(rawDelta) < FLAT_THRESHOLD) {
                trendingFlat.push({ statKey, label });
            } else if (improvement > 0) {
                trendingWell.push({ statKey, label, arrow: sign > 0 ? '▲' : '▼' });
            } else {
                trendingBadly.push({ statKey, label, arrow: sign > 0 ? '▼' : '▲' });
            }

        // Build campaign actions
        let campaignActionsHTML = '';
        const lastPollData = null;   // TODO: fetch from campaign_actions when poll feature is implemented
        const previousPollData = null;
        campaignActionsHTML = `

            <div class="stat-grid stat-grid-3col" style="margin-bottom: 12px;">
