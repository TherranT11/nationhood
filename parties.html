<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Parties | Nationhood Alpha</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/parties.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="top-bar"></div>
<div id="content-area">
    <div class="loading-container">
        <div class="loading-spinner"></div>
        <div>Loading parties...</div>
    </div>
</div>
<script type="module">
import { _supabase } from './js/supabase-client.js';
import { initPage, qCache, formatCurrency } from './js/common.js';
import { loadSeats, fetchActiveCoalition, isGovernmentAutocracy, initGameConfigForNation, GAME_CONFIG, runElectionPreview, STAT_TO_MINISTRY, statDirectionSign, ISSUE_CATEGORY_STATS, RALLY_SUBJECTS, RALLY_CONFIG, IDEOLOGY_OPPOSITES, IDEOLOGY_TO_AXIS, IDEOLOGY_AXES, classifyRallyBlocs, executeRally } from './js/game-common.js';
import { getPartyIconSVG } from './js/party-icons.js';

let currentFaction = null;
let currentNation = null;
let currentShard = null;

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function tickToDate(tick) {
    if (tick == null) return '—';
    const y = 2000 + Math.floor(tick / 12);
    return `${MONTHS[tick % 12]}, ${y}`;
}

function ordinal(n) {
    const s = ['th','st','nd','rd'];
    const v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function getPartyRole(factionId, seats, coalition) {
    if (!seats || seats === 0) return 'No Seats';
    if (coalition && coalition.party_ids && coalition.party_ids.includes(factionId)) {
        return coalition.lead_party_id === factionId
            ? 'Lead — Governing Coalition'
            : 'Governing Coalition';
    }
    return 'Opposition';
}

function getRoleBadgeClass(role) {
    if (role.includes('Governing')) return 'role-badge-gov';
    if (role === 'Opposition') return 'role-badge-opp';
    return 'role-badge-none';
}

function buildIdeologyTags(f) {
    let html = '';
    if (f.ideology_value_1) {
        const cls = 'tag-' + f.ideology_value_1.toLowerCase();
        html += `<span class="ideology-tag ${cls}">${f.ideology_value_1}</span>`;
    }
    if (f.ideology_value_2) {
        const cls = 'tag-' + f.ideology_value_2.toLowerCase();
        html += `<span class="ideology-tag ${cls}">${f.ideology_value_2}</span>`;
    }
    return html;
}

async function renderParties() {
    const el = document.getElementById('content-area');
    const f = currentFaction;
    const n = currentNation;

    if (!f || !n) {
        el.innerHTML = '<p style="color:var(--text-muted);text-align:center;margin-top:40px;">No party data available.</p>';
        return;
    }

    const isAutocracy = isGovernmentAutocracy(n);

    if (isAutocracy) {
        el.innerHTML = '<p style="color:var(--text-muted);text-align:center;margin-top:40px;">Autocracy view coming soon.</p>';
        return;
    }

    // Fetch all parties for seat + vote share data
    const { data: allParties } = await _supabase
        .from('factions')
        .select('id, faction_name, abbreviation, seats, national_vote_share, party_color')
        .eq('nation_id', n.id)
        .eq('faction_type', 'party');

    const seatData = await loadSeats(_supabase, n.id, false, allParties || [], f.id);
    const mySeats = seatData.currentSeats || 0;

    const coalition = await fetchActiveCoalition(_supabase, n.id);

    // Fetch next scheduled election
    const { data: nextElection } = await _supabase
        .from('elections').select('election_tick')
        .eq('nation_id', n.id).eq('status', 'scheduled')
        .gt('election_tick', currentShard?.current_tick || 0)
        .order('election_tick', { ascending: true }).limit(1).maybeSingle();

    // Fetch momentum data for all parties
    const allPartyIds = (allParties || []).map(p => p.id);
    const { data: allBlocApprovals } = await _supabase
        .from('faction_bloc_approval')
        .select('faction_id, momentum, bloc_id, approval, preference_score')
        .in('faction_id', allPartyIds);

    const { data: blocs } = await _supabase
        .from('voter_blocs')
        .select('id, bloc_name, population_weight, priority_issues, axis_liberty_equality, axis_tradition_progress, axis_security_freedom, axis_globalism_nationalism, axis_individualism_collectivism')
        .eq('nation_id', n.id)
        .eq('is_active', true);

    const blocWeights = {};
    for (const b of (blocs || [])) blocWeights[b.id] = b.population_weight || 1;

    // Compute weighted-average momentum per party
    const partyMomentum = {};
    for (const row of (allBlocApprovals || [])) {
        if (!partyMomentum[row.faction_id]) partyMomentum[row.faction_id] = { wSum: 0, wTotal: 0 };
        const w = blocWeights[row.bloc_id] || 1;
        partyMomentum[row.faction_id].wSum += (row.momentum || 0) * w;
        partyMomentum[row.faction_id].wTotal += w;
    }
    const partyScores = allPartyIds.map(id => {
        const m = partyMomentum[id];
        const raw = m && m.wTotal > 0 ? m.wSum / m.wTotal : 0;
        return { id, score: Math.round(Math.max(0, Math.min(100, 50 + raw))) };
    }).sort((a, b) => b.score - a.score);

    const myEntry = partyMomentum[f.id];
    const rawMomentum = myEntry && myEntry.wTotal > 0 ? myEntry.wSum / myEntry.wTotal : 0;
    const momentumScore = Math.round(Math.max(0, Math.min(100, 50 + rawMomentum)));
    const decayPerTick = Math.round(Math.abs(rawMomentum) * 0.20 * 10) / 10;
    const momentumRank = partyScores.findIndex(p => p.id === f.id) + 1;
    const totalParties = partyScores.length;
    const role = getPartyRole(f.id, mySeats, coalition);
    const badgeClass = getRoleBadgeClass(role);

    const partyColor = f.party_color || '#ffcc00';
    const logoSvg = getPartyIconSVG(f.party_logo, 44, partyColor);
    const treasury = formatCurrency(f.party_funds || 0);
    const founded = tickToDate(f.founded_tick);
    const leaderName = f.leader_first_name && f.leader_last_name
        ? f.leader_first_name + ' ' + f.leader_last_name + (f.leader_age ? ', ' + f.leader_age : '')
        : '—';
    const ideologyTags = buildIdeologyTags(f);
    const abbr = f.abbreviation ? `<span class="my-party-abbr">(${f.abbreviation})</span>` : '';

    // Build projected vote share bars via election simulation
    const partyLookup = {};
    for (const p of (allParties || [])) partyLookup[p.id] = p;

    let parties = [];
    try {
        const preview = await runElectionPreview(_supabase, n.id);
        parties = (preview.results || []).map(r => ({
            id: r.party_id,
            share: r.vote_percentage || 0,
            abbreviation: partyLookup[r.party_id]?.abbreviation || null,
            party_color: partyLookup[r.party_id]?.party_color || '#666',
            faction_name: r.party_name
        }));
    } catch (e) {
        console.warn('Election preview unavailable:', e.message);
        parties = (allParties || []).map(p => ({
            ...p, share: p.national_vote_share || 0
        }));
    }
    parties.sort((a, b) => b.share - a.share);
    const maxShare = Math.max(...parties.map(p => p.share), 1);

    let voteBarsHtml = '';
    for (const p of parties) {
        const pct = p.share.toFixed(1);
        const barW = (p.share / maxShare) * 100;
        const color = p.party_color || '#666';
        const isMe = p.id === f.id;
        const label = p.abbreviation || p.faction_name;
        voteBarsHtml += `
            <div class="vote-bar-row${isMe ? ' vote-bar-mine' : ''}">
                <span class="vote-bar-label">${label}</span>
                <div class="vote-bar-track">
                    <div class="vote-bar-fill" style="width:${barW}%;background:${color}"></div>
                </div>
                <span class="vote-bar-pct">${pct}%</span>
            </div>`;
    }

    const nextElectionDate = nextElection ? tickToDate(nextElection.election_tick) : '—';

    // === Approval by Voter Bloc (compute data) ===
    const blocLookup = {};
    for (const b of (blocs || [])) blocLookup[b.id] = b;

    const approvalByBloc = {};
    for (const row of (allBlocApprovals || [])) {
        if (!approvalByBloc[row.bloc_id]) approvalByBloc[row.bloc_id] = {};
        approvalByBloc[row.bloc_id][row.faction_id] = row.approval ?? 0;
    }

    const blocRows = (blocs || []).map(b => {
        const myApproval = approvalByBloc[b.id]?.[f.id] ?? 0;
        let leaderId = null;
        let leaderApproval = -1;
        for (const pid of allPartyIds) {
            const a = approvalByBloc[b.id]?.[pid] ?? 0;
            if (a > leaderApproval) { leaderApproval = a; leaderId = pid; }
        }
        const leaderParty = partyLookup[leaderId];
        const isLeading = leaderId === f.id;
        const margin = leaderApproval - myApproval;
        return {
            blocId: b.id,
            blocName: b.bloc_name,
            popWeight: b.population_weight || 0,
            myApproval,
            leaderId,
            leaderAbbr: leaderParty?.abbreviation || '?',
            leaderColor: leaderParty?.party_color || '#666',
            isLeading,
            margin
        };
    }).sort((a, b) => b.myApproval - a.myApproval);

    const blocsLeading = blocRows.filter(r => r.isLeading);
    const leadingCount = blocsLeading.length;
    const leadingPopPct = Math.round(blocsLeading.reduce((s, r) => s + r.popWeight, 0));
    const swingBlocs = blocRows.filter(r => !r.isLeading && r.margin <= 3);

    // === Performance Credit ===
    const MINISTRY_NAMES = {
        prime_minister: 'Prime Minister', interior: 'Interior', foreign: 'Foreign',
        defense: 'Defense', finance: 'Finance', education: 'Education',
        healthcare: 'Healthcare', labor: 'Labor', justice: 'Justice',
        transportation: 'Transportation', security: 'Security'
    };

    // Fetch ministries held by our party
    const { data: myMinistries } = await _supabase
        .from('ministries')
        .select('ministry_key')
        .eq('nation_id', n.id)
        .eq('party_id', f.id)
        .eq('is_active', true);

    // Check if we're PM
    const isPM = coalition && coalition.lead_party_id === f.id;

    const heldKeys = new Set((myMinistries || []).map(m => m.ministry_key));
    if (isPM) heldKeys.add('prime_minister');
    const heldMinistryCount = heldKeys.size;

    // Build stat-to-trend data if we hold ministries
    let trendingWell = [];
    let trendingBadly = [];
    let trendingFlat = [];
    let swingWarnings = [];

    if (heldMinistryCount > 0) {
        // Fetch previous tick stats
        const currentTick = currentShard?.current_tick || 0;
        let prevStats = null;
        if (currentTick > 0) {
            const { data: histRow } = await _supabase
                .from('nations_history')
                .select('*')
                .eq('nation_id', n.id)
                .eq('tick', currentTick - 1)
                .single();
            prevStats = histRow;
        }

        // Find all stats we're responsible for
        const myStats = [];
        for (const [statKey, ministryKey] of Object.entries(STAT_TO_MINISTRY)) {
            if (heldKeys.has(ministryKey)) myStats.push(statKey);
        }

        // Compute trends
        const FLAT_THRESHOLD = 0.15;
        for (const statKey of myStats) {
            const current = n[statKey];
            const prev = prevStats ? prevStats[statKey] : null;
            if (current == null) continue;

            const sign = statDirectionSign(statKey);
            if (sign === 0) continue;

            const rawDelta = (prev != null) ? current - prev : 0;
            const improvement = rawDelta * sign; // positive = getting better

            const label = statKey.replace(/_/g, ' ');
            if (Math.abs(rawDelta) < FLAT_THRESHOLD) {
                trendingFlat.push({ statKey, label });
            } else if (improvement > 0) {
                trendingWell.push({ statKey, label, arrow: sign > 0 ? '▲' : '▼' });
            } else {
                trendingBadly.push({ statKey, label, arrow: sign > 0 ? '▼' : '▲' });
            }
        }

        // Check if badly-trending stats hurt us with swing blocs
        if (trendingBadly.length > 0) {
            const badStatKeys = new Set(trendingBadly.map(t => t.statKey));
            for (const b of (blocs || [])) {
                const isSwing = swingBlocs.some(sb => sb.blocId === b.id);
                if (!isSwing) continue;
                const issues = b.priority_issues || [];
                for (const issue of issues) {
                    const catStats = ISSUE_CATEGORY_STATS[issue] || [];
                    const hits = catStats.filter(s => badStatKeys.has(s));
                    if (hits.length > 0) {
                        swingWarnings.push({ blocName: b.bloc_name, stats: hits.map(s => s.replace(/_/g, ' ')) });
                    }
                }
            }
        }
    }

    // Build Performance Credit HTML
    let perfCreditHtml = '';
    if (heldMinistryCount === 0) {
        perfCreditHtml = `
            <div class="perf-panel">
                <div class="perf-header">Performance Credit</div>
                <div class="perf-empty">
                    <div class="perf-empty-label">Ministries: None</div>
                    <div class="perf-empty-msg">You earn no credit for stat improvements. Attack rivals who do, or negotiate your way into a coalition.</div>
                </div>
            </div>`;
    } else {
        const ministryList = [...heldKeys].map(k => MINISTRY_NAMES[k] || k).join(', ');
        let titleParts = [];
        if (isPM) titleParts.push('Prime Minister');
        const nonPM = [...heldKeys].filter(k => k !== 'prime_minister');
        if (nonPM.length > 0) titleParts.push(nonPM.map(k => MINISTRY_NAMES[k] || k).join(', '));
        const titleLine = titleParts.join(' + ');

        const MAX_TREND_ITEMS = 5;
        let trendsHtml = '';
        if (trendingWell.length > 0) {
            const shown = trendingWell.slice(0, MAX_TREND_ITEMS);
            const extra = trendingWell.length - shown.length;
            trendsHtml += `<div class="perf-trend-section">
                <div class="perf-trend-label perf-trend-good">Trending well:</div>
                ${shown.map(t => `<div class="perf-trend-item perf-trend-good">${t.arrow} ${t.label}</div>`).join('')}
                ${extra > 0 ? `<div class="perf-trend-item perf-trend-good">+ ${extra} more</div>` : ''}
            </div>`;
        }
        if (trendingBadly.length > 0) {
            const shown = trendingBadly.slice(0, MAX_TREND_ITEMS);
            const extra = trendingBadly.length - shown.length;
            trendsHtml += `<div class="perf-trend-section">
                <div class="perf-trend-label perf-trend-bad">Trending badly:</div>
                ${shown.map(t => `<div class="perf-trend-item perf-trend-bad">${t.arrow} ${t.label}</div>`).join('')}
                ${extra > 0 ? `<div class="perf-trend-item perf-trend-bad">+ ${extra} more</div>` : ''}
            </div>`;
        }
        if (trendingFlat.length > 0) {
            trendsHtml += `<div class="perf-trend-section">
                <div class="perf-trend-item perf-trend-flat">── ${trendingFlat.length} stat${trendingFlat.length !== 1 ? 's' : ''} flat</div>
            </div>`;
        }
        if (trendingWell.length === 0 && trendingBadly.length === 0 && trendingFlat.length === 0) {
            trendsHtml = '<div class="perf-trend-none">No trend data yet.</div>';
        }

        let warningsHtml = '';
        if (swingWarnings.length > 0) {
            warningsHtml = swingWarnings.map(w =>
                `<div class="perf-warning">⚠ ${w.stats.map(s => s.charAt(0).toUpperCase() + s.slice(1)).join(', ')} is hurting you with ${w.blocName} — a swing bloc.</div>`
            ).join('');
        }

        perfCreditHtml = `
            <div class="perf-panel perf-panel-active">
                <div class="perf-header">Performance Credit</div>
                <div class="perf-ministries">${titleLine}</div>
                <div class="perf-trends">${trendsHtml}</div>
                ${warningsHtml ? `<div class="perf-warnings">${warningsHtml}</div>` : ''}
            </div>`;
    }

    // === Action Points Panel ===
    const currentAP = Math.min(f.action_points || 0, GAME_CONFIG.MAX_AP);
    const maxAP = GAME_CONFIG.MAX_AP;
    const apPct = Math.round((currentAP / maxAP) * 100);
    const currentTick = currentShard?.current_tick || 0;
    const ticksUntilElection = nextElection ? nextElection.election_tick - currentTick : null;

    let apTip = '';
    if (ticksUntilElection !== null && ticksUntilElection <= 6) {
        apTip = `Election in ${ticksUntilElection} tick${ticksUntilElection !== 1 ? 's' : ''} — bank AP or campaign now.`;
    } else if (currentAP >= maxAP) {
        apTip = 'AP is full — spend it before it goes to waste.';
    } else if (currentAP <= 2) {
        apTip = 'AP is low. Choose your next move carefully.';
    } else {
        apTip = 'Spend AP on bills, campaigns, and ministry actions.';
    }

    // === Approval by Voter Bloc (build HTML) ===
    const totalEligible = n.eligible_voters || 0;
    function compactNum(v) {
        if (v >= 1_000_000) return (v / 1_000_000).toFixed(1).replace(/\.0$/, '') + 'M';
        if (v >= 1_000) return (v / 1_000).toFixed(v >= 100_000 ? 0 : 1).replace(/\.0$/, '') + 'K';
        return String(Math.round(v));
    }

    let blocTableHtml = '';
    for (const r of blocRows) {
        const barColor = r.isLeading ? partyColor : 'var(--text-muted, #555)';
        const voters = compactNum(totalEligible * (r.popWeight / 100));
        blocTableHtml += `
            <div class="bloc-row${r.isLeading ? ' bloc-row-leading' : ''}">
                <span class="bloc-name">${r.blocName}</span>
                <span class="bloc-voters">${voters}</span>
                <div class="bloc-bar-track">
                    <div class="bloc-bar-fill" style="width:${r.myApproval}%;background:${barColor}"></div>
                </div>
                <span class="bloc-approval">${r.myApproval}%</span>
                <span class="bloc-change">—</span>
                <span class="bloc-leader" style="color:${r.leaderColor}">${r.isLeading ? 'YOU' : r.leaderAbbr}</span>
            </div>`;
    }

    const swingText = swingBlocs.length > 0
        ? `Swing Blocs (within 3%): ${swingBlocs.map(r => r.blocName).join(', ')}`
        : 'No swing blocs';

    el.innerHTML = `
        <div class="parties-page">
        <div class="parties-top-panels">

        <div class="my-party-card" style="border-left-color:${partyColor}">
            <div class="my-party-top-row">
                <div class="my-party-logo" style="color:${partyColor}">
                    ${logoSvg}
                </div>
                <div class="my-party-identity">
                    <div class="my-party-name-row">
                        <span class="my-party-name" style="color:${partyColor}">${f.faction_name}</span>
                        ${abbr}
                    </div>
                    <div class="my-party-role-row">
                        <span class="role-badge ${badgeClass}">${role}</span>
                    </div>
                    <div class="my-party-ideology-row">
                        ${ideologyTags}
                    </div>
                </div>
            </div>

            <div class="my-party-stats">
                <div class="my-party-stat">
                    <div class="stat-label">Party Leader</div>
                    <div class="stat-val">${leaderName}</div>
                </div>
                <div class="my-party-stat">
                    <div class="stat-label">Seats</div>
                    <div class="stat-val">${mySeats} / ${GAME_CONFIG.TOTAL_SEATS}</div>
                </div>
                <div class="my-party-stat">
                    <div class="stat-label">Founded</div>
                    <div class="stat-val">${founded}</div>
                </div>
                <div class="my-party-stat">
                    <div class="stat-label">Treasury</div>
                    <div class="stat-val stat-money">${treasury}</div>
                </div>
            </div>
        </div>

        <div class="vote-share-panel">
            <div class="vote-share-header">Projected Vote Share</div>
            <div class="vote-bars">
                ${voteBarsHtml}
            </div>
            <div class="vote-share-footer">Next election: ${nextElectionDate}</div>
        </div>

        <div class="momentum-panel">
            <div class="momentum-header">Momentum</div>
            <div class="momentum-score-row">
                <span class="momentum-value">${momentumScore}</span>
                <span class="momentum-max">/ 100</span>
            </div>
            <div class="momentum-bar-track">
                <div class="momentum-bar-fill" style="width:${momentumScore}%;background:${partyColor}"></div>
            </div>
            <div class="momentum-decay">${decayPerTick > 0 ? `${rawMomentum > 0 ? '−' : '+'}${decayPerTick} / tick` : 'Stable'}</div>
            <div class="momentum-rank">You are ${ordinal(momentumRank)} of ${totalParties} in Momentum right now.</div>
            <div class="momentum-desc">How loud you are in the national conversation right now.</div>
        </div>

        ${perfCreditHtml}

        <div class="ap-panel">
            <div class="ap-header">Action Points</div>
            <div class="ap-score-row">
                <span class="ap-value">${currentAP}</span>
                <span class="ap-max">/ ${maxAP}</span>
            </div>
            <div class="ap-bar-track">
                <div class="ap-bar-fill" style="width:${apPct}%;background:${partyColor}"></div>
            </div>
            <div class="ap-tip">${apTip}</div>
        </div>

        </div>

        <div class="bloc-approval-panel">
            <div class="bloc-approval-header-row">
                <span class="bloc-approval-title">Approval by Voter Bloc</span>
                <span class="bloc-approval-note">&plusmn; margin of error</span>
            </div>
            <div class="bloc-table-header">
                <span class="bloc-name">Bloc</span>
                <span class="bloc-voters">Voters</span>
                <span class="bloc-bar-track-header"></span>
                <span class="bloc-approval">Your Approval</span>
                <span class="bloc-change">Change</span>
                <span class="bloc-leader">Leader</span>
            </div>
            <div class="bloc-table-body">
                ${blocTableHtml}
            </div>
            <div class="bloc-approval-footer">
                <span>Leading: ${leadingCount} of ${blocRows.length}${leadingPopPct > 0 ? ` (${leadingPopPct}% of pop)` : ''}</span>
                <span>${swingText}</span>
            </div>
        </div>

        <div id="rally-container"></div>

        </div>
    `;

    // ── Rally UI ──
    let rallyScreen = 'select'; // 'select' | 'preview' | 'results'
    let rallySelectedIdx = null;
    let rallyResults = null;
    let rallyFilter = 'All';
    let rallyShowAll = false;

    // Fetch recent rallies for cooldown/diminish info
    const { data: recentRallies } = await _supabase
        .from('campaign_actions')
        .select('tick_performed, result')
        .eq('party_id', f.id)
        .eq('action_type', 'rally')
        .gte('tick_performed', (currentShard?.current_tick || 0) - RALLY_CONFIG.DIMINISH_WINDOW)
        .order('tick_performed', { ascending: false });

    const ralliedThisTick = (recentRallies || []).some(r => r.tick_performed === (currentShard?.current_tick || 0));

    // Get tag use counts for diminishing returns display
    function getTagUseCounts(tags) {
        const counts = {};
        for (const tag of tags) counts[tag] = 0;
        for (const r of (recentRallies || [])) {
            for (const t of (r.result?.tags || [])) {
                if (counts[t] !== undefined) counts[t]++;
            }
        }
        return counts;
    }

    // Ideology tag colors from IDEOLOGY_AXES
    const IDEO_COLORS = {};
    for (const ax of IDEOLOGY_AXES) {
        IDEO_COLORS[ax.left] = ax.leftColor;
        IDEO_COLORS[ax.right] = ax.rightColor;
    }
    function colorTag(tag) {
        const upper = tag.toUpperCase();
        const color = IDEO_COLORS[upper] || 'var(--text-muted, #888)';
        const label = tag.charAt(0).toUpperCase() + tag.slice(1).toLowerCase();
        return `<span style="color:${color};font-weight:700">${label}</span>`;
    }
    function colorTagUpper(tag) {
        const upper = tag.toUpperCase();
        const color = IDEO_COLORS[upper] || 'var(--text-muted, #888)';
        return `<span style="color:${color};font-weight:700">${upper}</span>`;
    }

    function renderRally() {
        const container = document.getElementById('rally-container');
        if (!container) return;

        if (rallyScreen === 'select') {
            const costOk = currentAP >= RALLY_CONFIG.AP_COST && (f.party_funds || 0) >= RALLY_CONFIG.MONEY_COST;
            const allTags = ['All', 'Tradition', 'Progress', 'Liberty', 'Equality', 'Security', 'Freedom', 'Nationalism', 'Globalism', 'Collectivism', 'Individualism'];
            const filterBtns = allTags.map(t => {
                const color = t === 'All' ? '' : IDEO_COLORS[t.toUpperCase()] || '';
                const style = color && rallyFilter === t ? ` style="border-color:${color};color:${color}"` : color ? ` style="color:${color}"` : '';
                return `<button class="rally-filter-btn${rallyFilter === t ? ' active' : ''}" data-filter="${t}"${style}>${t}</button>`;
            }).join('');

            let filtered = RALLY_SUBJECTS.map((s, i) => ({ ...s, idx: i }));
            if (rallyFilter !== 'All') {
                filtered = filtered.filter(s => s.tags.includes(rallyFilter.toUpperCase()));
            }
            const shown = rallyShowAll ? filtered : filtered.slice(0, 15);
            const hasMore = filtered.length > 15 && !rallyShowAll;

            let rows = shown.map(s =>
                `<div class="rally-subject-row${!costOk || ralliedThisTick ? ' disabled' : ''}" data-idx="${s.idx}">
                    <span class="rally-subject-name">${s.name}</span>
                    <span class="rally-subject-tags">${s.tags.map(t => colorTagUpper(t)).join('&nbsp; ')}</span>
                </div>`
            ).join('');

            container.innerHTML = `
                <div class="rally-panel">
                    <div class="rally-header-row">
                        <span class="rally-title">Hold a Rally</span>
                        <span class="rally-cost">Cost: ${RALLY_CONFIG.AP_COST} AP + $${(RALLY_CONFIG.MONEY_COST).toLocaleString()}</span>
                    </div>
                    <div class="rally-desc">Choose a subject for your rally. Each subject has ideology tags that determine which voter blocs are energized and which are alienated.</div>
                    ${ralliedThisTick ? '<div class="rally-cooldown">You have already held a rally this tick.</div>' : ''}
                    ${!costOk && !ralliedThisTick ? '<div class="rally-cooldown">Not enough AP or funds.</div>' : ''}
                    <div class="rally-divider"></div>
                    <div class="rally-filters">${filterBtns}</div>
                    <div class="rally-divider"></div>
                    <div class="rally-subject-header">
                        <span class="rally-subject-name">Subject</span>
                        <span class="rally-subject-tags">Tags</span>
                    </div>
                    <div class="rally-subject-list">${rows}</div>
                    ${hasMore ? `<div class="rally-show-all">Showing 15 of ${filtered.length} subjects <button class="rally-show-all-btn">[Show All]</button></div>` : ''}
                </div>`;

            // Event listeners
            container.querySelectorAll('.rally-filter-btn').forEach(btn => {
                btn.addEventListener('click', () => { rallyFilter = btn.dataset.filter; rallyShowAll = false; renderRally(); });
            });
            container.querySelectorAll('.rally-subject-row:not(.disabled)').forEach(row => {
                row.addEventListener('click', () => { rallySelectedIdx = parseInt(row.dataset.idx); rallyScreen = 'preview'; renderRally(); });
            });
            const showAllBtn = container.querySelector('.rally-show-all-btn');
            if (showAllBtn) showAllBtn.addEventListener('click', () => { rallyShowAll = true; renderRally(); });

        } else if (rallyScreen === 'preview') {
            const subject = RALLY_SUBJECTS[rallySelectedIdx];
            const classified = classifyRallyBlocs(subject, blocs || []);
            const energized = classified.filter(c => c.classification === 'energized');
            const alienated = classified.filter(c => c.classification === 'alienated');
            const unaffected = classified.filter(c => c.classification === 'unaffected');

            const tagCounts = getTagUseCounts(subject.tags);
            const diminished = subject.tags.filter(t => tagCounts[t] > 0);

            const tagLabels = subject.tags.map(t => t.charAt(0) + t.slice(1).toLowerCase());
            const tagColored = subject.tags.map(t => colorTagUpper(t)).join('&nbsp; ');
            const tagColoredMixed = subject.tags.map(t => colorTag(t)).join(' or ');

            function blocPctLabel(c) { return `(${Math.round(c.popWeight)}%)`; }
            function matchLabel(c) { return c.matchTag ? colorTagUpper(c.matchTag) : ''; }
            function opposeLabel(c) {
                if (!c.opposeTag) return '';
                const opp = IDEOLOGY_OPPOSITES[c.opposeTag];
                return opp ? '\u2190 ' + colorTag(opp) : '';
            }

            const enPop = energized.reduce((s, c) => s + c.popWeight, 0);
            const alPop = alienated.reduce((s, c) => s + c.popWeight, 0);
            const unPop = unaffected.reduce((s, c) => s + c.popWeight, 0);

            let diminishHtml = '';
            if (diminished.length > 0) {
                diminishHtml = diminished.map(t => {
                    const uses = tagCounts[t];
                    const label = t.charAt(0) + t.slice(1).toLowerCase();
                    const last = (recentRallies || []).find(r => (r.result?.tags || []).includes(t));
                    const ago = last ? (currentShard?.current_tick || 0) - last.tick_performed : '?';
                    const effect = uses === 1 ? 'halved' : 'quartered';
                    return `<div class="rally-diminish-warn">Diminished effect: You rallied on ${label.toUpperCase()} ${ago} tick${ago !== 1 ? 's' : ''} ago. Energize effect ${effect} for ${label}-aligned blocs.</div>`;
                }).join('');
            }

            container.innerHTML = `
                <div class="rally-panel">
                    <div class="rally-header-row">
                        <span class="rally-title">Hold a Rally</span>
                        <span class="rally-cost">Cost: ${RALLY_CONFIG.AP_COST} AP + $${(RALLY_CONFIG.MONEY_COST).toLocaleString()}</span>
                    </div>
                    <div class="rally-selected">
                        <div class="rally-selected-label">SELECTED: "${subject.name}"</div>
                        <div class="rally-selected-tags">Tags: ${tagColored}</div>
                    </div>
                    <div class="rally-divider rally-divider-accent"></div>

                    <div class="rally-section-title">PROJECTED EFFECTS</div>

                    <div class="rally-group-label rally-energized">ENERGIZED <span class="rally-group-note">(share ${tagColoredMixed})</span></div>
                    <div class="rally-group-box">
                        ${energized.length === 0 ? '<div class="rally-group-empty">None</div>' :
                            energized.map(c => `<div class="rally-bloc-row rally-energized">▲ ${c.blocName} ${blocPctLabel(c)} <span class="rally-bloc-tag">${matchLabel(c).toUpperCase()}</span> <span class="rally-bloc-est">est. +1 to +2</span></div>`).join('')}
                    </div>

                    <div class="rally-group-label rally-alienated">ALIENATED <span class="rally-group-note">(oppose ${tagColoredMixed})</span></div>
                    <div class="rally-group-box">
                        ${alienated.length === 0 ? '<div class="rally-group-empty">None</div>' :
                            alienated.map(c => `<div class="rally-bloc-row rally-alienated">▼ ${c.blocName} ${blocPctLabel(c)} <span class="rally-bloc-tag">${opposeLabel(c)}</span> <span class="rally-bloc-est">est. 0 to -2</span></div>`).join('')}
                    </div>

                    <div class="rally-group-label rally-unaffected">UNAFFECTED</div>
                    <div class="rally-group-box">
                        ${unaffected.length === 0 ? '<div class="rally-group-empty">None</div>' :
                            unaffected.map(c => `<div class="rally-bloc-row rally-unaffected">\u2014 ${c.blocName} ${blocPctLabel(c)} <span class="rally-bloc-tag">no match or opposition</span></div>`).join('')}
                    </div>

                    <div class="rally-divider"></div>
                    <div class="rally-momentum-est">MOMENTUM: +${RALLY_CONFIG.GLOBAL_MOMENTUM_MIN} to +${RALLY_CONFIG.GLOBAL_MOMENTUM_MAX} (global)</div>
                    <div class="rally-divider"></div>

                    ${diminishHtml ? `<div class="rally-diminish-section">${diminishHtml}</div><div class="rally-divider"></div>` : ''}

                    <div class="rally-net-est">
                        <div class="rally-net-title">NET ESTIMATE</div>
                        <div>Energized: ${energized.length} bloc${energized.length !== 1 ? 's' : ''} (${Math.round(enPop)}% of electorate)</div>
                        <div>Alienated: ${alienated.length} bloc${alienated.length !== 1 ? 's' : ''} (${Math.round(alPop)}% of electorate)</div>
                        <div>Unaffected: ${unaffected.length} bloc${unaffected.length !== 1 ? 's' : ''} (${Math.round(unPop)}% of electorate)</div>
                    </div>

                    <div class="rally-actions">
                        <button class="rally-btn rally-btn-confirm" id="rally-confirm">CONFIRM RALLY</button>
                        <button class="rally-btn rally-btn-cancel" id="rally-cancel">CANCEL</button>
                    </div>
                </div>`;

            document.getElementById('rally-confirm').addEventListener('click', async () => {
                const btn = document.getElementById('rally-confirm');
                btn.disabled = true;
                btn.textContent = 'Executing...';
                const tick = currentShard?.current_tick || 0;
                const result = await executeRally(_supabase, f.id, n.id, rallySelectedIdx, tick);
                if (result.success) {
                    rallyResults = result;
                    rallyScreen = 'results';
                    renderRally();
                } else {
                    alert(result.error);
                    btn.disabled = false;
                    btn.textContent = 'CONFIRM RALLY';
                }
            });
            document.getElementById('rally-cancel').addEventListener('click', () => { rallyScreen = 'select'; rallySelectedIdx = null; renderRally(); });

        } else if (rallyScreen === 'results') {
            const r = rallyResults;
            const subject = r.subject;
            const tagColored2 = subject.tags.map(t => colorTagUpper(t)).join('&nbsp; ');
            const energized = r.blocResults.filter(c => c.classification === 'energized');
            const alienated = r.blocResults.filter(c => c.classification === 'alienated');
            const unaffected = r.blocResults.filter(c => c.classification === 'unaffected');

            function resultRow(c, symbol) {
                const sign = c.prefDelta > 0 ? '+' : '';
                return `<div class="rally-bloc-row ${c.classification === 'energized' ? 'rally-energized' : c.classification === 'alienated' ? 'rally-alienated' : 'rally-unaffected'}">${symbol} ${c.blocName} <span class="rally-result-delta">${c.prefDelta === 0 ? 'no change' : sign + c.prefDelta + ' preference'}</span> <span class="rally-result-pref">(${c.oldPref}% \u2192 ${c.newPref}%)</span></div>`;
            }

            container.innerHTML = `
                <div class="rally-panel rally-panel-results">
                    <div class="rally-title">Rally Results</div>
                    <div class="rally-selected">
                        <div>"${subject.name}"</div>
                        <div class="rally-selected-tags">${tagColored2}</div>
                    </div>
                    <div class="rally-divider rally-divider-accent"></div>

                    <div class="rally-group-label rally-energized">ENERGIZED</div>
                    <div class="rally-group-box">
                        ${energized.length === 0 ? '<div class="rally-group-empty">None</div>' :
                            energized.map(c => resultRow(c, '▲')).join('')}
                    </div>

                    <div class="rally-group-label rally-alienated">ALIENATED</div>
                    <div class="rally-group-box">
                        ${alienated.length === 0 ? '<div class="rally-group-empty">None</div>' :
                            alienated.map(c => resultRow(c, '▼')).join('')}
                    </div>

                    <div class="rally-group-label rally-unaffected">UNAFFECTED</div>
                    <div class="rally-group-box">
                        ${unaffected.length === 0 ? '<div class="rally-group-empty">None</div>' :
                            unaffected.map(c => resultRow(c, '\u2014')).join('')}
                    </div>

                    <div class="rally-divider"></div>
                    <div class="rally-results-summary">
                        <div>Momentum: +${r.globalMomentum} (global)</div>
                        <div>Cost: $${RALLY_CONFIG.MONEY_COST.toLocaleString()} deducted \u2014 Treasury: $${r.oldTreasury.toLocaleString()} \u2192 $${r.newTreasury.toLocaleString()}</div>
                        <div>AP: ${r.newAp + RALLY_CONFIG.AP_COST} \u2192 ${r.newAp}</div>
                    </div>

                    <div class="rally-actions">
                        <button class="rally-btn rally-btn-cancel" id="rally-dismiss">DISMISS</button>
                    </div>
                </div>`;

            document.getElementById('rally-dismiss').addEventListener('click', () => {
                rallyScreen = 'select';
                rallySelectedIdx = null;
                rallyResults = null;
                renderParties(); // full refresh to update AP, treasury, etc.
            });
        }
    }

    renderRally();
}

initPage('parties', async (state) => {
    const { nation, faction, shard } = state;
    currentFaction = faction;
    currentNation = nation;
    currentShard = shard;
    initGameConfigForNation(nation);
    await renderParties();
});
</script>
</body>
</html>
