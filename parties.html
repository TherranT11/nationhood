<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Parties | Nationhood Alpha</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .parties-section-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: bold;
            padding: 10px 0 12px;
            margin-top: 8px;
            border-bottom: 2px solid #333;
            margin-bottom: 16px;
        }
        .parties-section-label.gov { color: #4CAF50; border-bottom-color: #4CAF50; }
        .parties-section-label.opp { color: #ff4444; border-bottom-color: #ff4444; }
        .parties-section-label.regime { color: #ff9800; border-bottom-color: #ff9800; }
        .parties-section-empty {
            color: #666; font-style: italic; text-align: center; padding: 20px;
        }
        /* Action cards: flex column with buttons pinned to bottom */
        .action-grid .action-card {
            display: flex;
            flex-direction: column;
        }
        .action-grid .action-card .action-desc {
            flex: 1;
        }
        .action-grid .action-card .action-btn {
            margin-top: auto;
        }
    </style>
</head>
<body>
<div id="top-bar"></div>
<div id="content-area">
    <div class="loading-container">
        <div class="loading-spinner"></div>
        <div>Loading parties...</div>
    </div>
</div>
<script src="js/supabase-client.js"></script>
<script src="js/common.js"></script>
<script src="js/game-common.js"></script>
<script>
let currentFaction = null;
let currentNation = null;

initPage('parties', async (state) => {
    const { nation, faction } = state;
    currentFaction = faction;
    currentNation = nation;

    if (!nation) {
        document.getElementById('content-area').innerHTML = `
            <div class="placeholder-panel">
                <div class="ph-icon">🏛️</div>
                <h3>No Nation Selected</h3>
                <p>Your party is not assigned to a nation yet.</p>
            </div>`;
        return;
    }
    await renderPartiesPage(nation, faction);
});

async function renderPartiesPage(nation, faction) {
    const isAutocracy = nation.government_type === 'Autocracy';
    const termPlural = isAutocracy ? 'Factions' : 'Parties';
    const termSingular = isAutocracy ? 'Faction' : 'Party';
    const headerText = isAutocracy ? 'Internal Factions' : 'Political Parties';

    document.getElementById('content-area').innerHTML = `
        <div class="panel-padding">
            <div class="section-header">${headerText} in ${nation.name}</div>
            <div class="loading-container" style="height:200px;">
                <div class="loading-spinner"></div>
                <div>Loading ${termPlural.toLowerCase()}...</div>
            </div>
        </div>`;

    try {
        const { data: parties, error } = await _supabase
            .from('factions').select('*')
            .eq('nation_id', nation.id).eq('faction_type', 'party')
            .order('approval_rating', { ascending: false });
        if (error) throw error;

        if (!parties || parties.length === 0) {
            document.getElementById('content-area').innerHTML = `
                <div class="panel-padding">
                    <div class="section-header">${headerText} in ${nation.name}</div>
                    <div style="text-align:center;color:#666;padding:40px;">No ${termPlural.toLowerCase()} in this nation yet.</div>
                </div>`;
            return;
        }

        let election = null;
        if (!isAutocracy) {
            const { data: electionData } = await _supabase
                .from('elections').select('*')
                .eq('nation_id', nation.id).eq('status', 'completed')
                .order('election_tick', { ascending: false }).limit(1).maybeSingle();
            election = electionData;
        }

        let coalition = null;
        if (!isAutocracy) {
            coalition = await fetchActiveCoalition(_supabase, nation.id);
        }

        const coalitionPartyIds = coalition?.party_ids || [];
        const leadPartyId = coalition?.lead_party_id;
        const totalSeats = GAME_CONFIG.TOTAL_SEATS;
        const majorityThreshold = GAME_CONFIG.MAJORITY_SEATS;

        // Classify each party
        const govParties = [];
        const oppParties = [];

        parties.forEach(party => {
            let seats = 0;
            if (isAutocracy) {
                seats = party.seats || 0;
            } else if (election && election.results && election.results.seats) {
                const partyResult = election.results.seats.find(s => s.party_id === party.id);
                seats = partyResult?.seats || 0;
            }

            let status = 'opposition', statusText = 'Opposition';
            if (isAutocracy) {
                status = 'government'; statusText = 'Regime';
            } else if (coalitionPartyIds.includes(party.id)) {
                if (party.id === leadPartyId) { status = 'government'; statusText = 'Lead Party'; }
                else { status = 'coalition'; statusText = 'Coalition'; }
            } else if (seats >= majorityThreshold) {
                status = 'government'; statusText = 'Government';
            }

            const entry = { party, seats, status, statusText };
            if (status === 'opposition') oppParties.push(entry);
            else govParties.push(entry);
        });

        function buildCard(entry) {
            const { party, seats, status, statusText } = entry;
            const isYourParty = party.id === faction?.id;

            // First stat: Loyalty for autocracy, Approval for democracy
            let firstStatLabel, firstStatValue, firstStatClass;
            if (isAutocracy) {
                const loyalty = party.loyalty ?? 50;
                firstStatLabel = 'Faction Loyalty';
                firstStatValue = loyalty + '%';
                firstStatClass = loyalty >= 50 ? 'good' : loyalty <= 30 ? 'bad' : '';
            } else {
                const approval = party.approval_rating || 0;
                firstStatLabel = 'Approval';
                firstStatValue = approval + '%';
                firstStatClass = approval >= 50 ? 'good' : approval <= 30 ? 'bad' : '';
            }

            return `
                <div class="party-display-card ${isYourParty ? 'your-party' : ''}">
                    <div class="party-card-header">
                        <div class="party-card-name">
                            <div class="party-display-name">
                                ${party.faction_name}
                                ${party.is_npc ? '<span class="party-npc-badge">AI</span>' : ''}
                                ${isYourParty ? `<span style="color:#ffcc00;font-size:0.75rem;margin-left:8px;">★ YOUR ${termSingular.toUpperCase()}</span>` : ''}
                            </div>
                            <div class="party-display-abbr">${party.abbreviation || '—'}</div>
                        </div>
                        <div class="party-status-badge status-${status}">${statusText}</div>
                    </div>
                    <div class="party-display-ideologies">
                        ${party.ideology_value_1 ? `<span class="ideology-tag tag-${party.ideology_value_1.toLowerCase()}">${party.ideology_value_1}</span>` : ''}
                        ${party.ideology_value_2 ? `<span class="ideology-tag tag-${party.ideology_value_2.toLowerCase()}">${party.ideology_value_2}</span>` : ''}
                        ${isAutocracy && !party.ideology_value_1 ? '<span style="color:#666;font-style:italic;">Regime Faction</span>' : ''}
                    </div>
                    <div class="party-display-stats">
                        <div class="party-stat-item">
                            <div class="party-stat-label">${firstStatLabel}</div>
                            <div class="party-stat-value ${firstStatClass}">${firstStatValue}</div>
                        </div>
                        <div class="party-stat-item">
                            <div class="party-stat-label">Seats</div>
                            <div class="party-stat-value">${seats} / ${totalSeats}</div>
                        </div>
                        <div class="party-stat-item">
                            <div class="party-stat-label">Action Points</div>
                            <div class="party-stat-value">${party.action_points || 0}</div>
                        </div>
                        <div class="party-stat-item">
                            <div class="party-stat-label">${termSingular} Funds</div>
                            <div class="party-stat-value">$${(party.party_funds || 0).toLocaleString()}</div>
                        </div>
                    </div>
                </div>`;
        }

        const governmentCount = govParties.length;
        const oppositionCount = oppParties.length;

        // Determine ruling faction for autocracy
        const isRulingFaction = isAutocracy && nation.ruling_faction_id === faction?.id;

        // Calculate dynamic Seize Power cost (15 base + 1 per 10-seat deficit, loyalty modifier)
        let seizeCost = 15;
        let seatDeficit = 0;
        let loyaltyModifier = 0;
        if (isAutocracy && !isRulingFaction && faction) {
            const rulingParty = parties.find(p => p.id === nation.ruling_faction_id);
            const rulingSeats = rulingParty?.seats || 0;
            const mySeats = faction.seats || 0;
            const myLoyalty = faction.loyalty ?? 50;
            seatDeficit = Math.max(0, rulingSeats - mySeats);
            seizeCost = 15 + Math.floor(seatDeficit / 10);
            // Loyalty modifier
            if (myLoyalty < 15) {
                loyaltyModifier = -Math.round(seizeCost * 0.2);  // -20%
            } else if (myLoyalty > 75) {
                loyaltyModifier = Math.round(seizeCost * 0.1);   // +10%
            }
            seizeCost = Math.max(1, seizeCost + loyaltyModifier);
        }

        // Build campaign actions HTML (different for democracy vs autocracy)
        let campaignActionsHTML = '';

        if (!isAutocracy) {
            // === DEMOCRACY ACTIONS ===
            campaignActionsHTML = `
            <div class="section-header" style="margin-top: 30px;">Your Party Resources</div>
            <div class="stat-grid" style="grid-template-columns: repeat(3, 1fr); margin-bottom: 24px;">
                <div class="stat-card">
                    <div class="stat-label">Action Points</div>
                    <div class="stat-value" id="party-ap">${faction?.action_points || 0}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Party Funds</div>
                    <div class="stat-value" id="party-funds">$${(faction?.party_funds || 0).toLocaleString()}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Approval Rating</div>
                    <div class="stat-value" id="party-approval">${faction?.approval_rating || 0}%</div>
                </div>
            </div>

            <div class="section-header">Campaign Actions</div>
            <div class="action-grid" style="grid-template-columns: repeat(3, 1fr);">
                <div class="action-card">
                    <div class="action-header">
                        <div class="action-title">Grassroots Rally</div>
                        <div class="action-cost">2 AP · $50,000</div>
                    </div>
                    <div class="action-desc">Hold a rally to boost your party's approval rating. Roll 1D3 for approval gain.</div>
                    <button class="action-btn" onclick="performAction('rally')">Organize Rally</button>
                </div>
                <div class="action-card">
                    <div class="action-header">
                        <div class="action-title">Attack Ad</div>
                        <div class="action-cost">3 AP · $150,000</div>
                    </div>
                    <div class="action-desc">Run attack ads against a rival party. Roll 1D3 to reduce their approval.</div>
                    <div style="margin: 10px 0;">
                        <select id="attack-target" class="action-select">
                            <option value="">Select Target Party...</option>
                        </select>
                    </div>
                    <button class="action-btn" onclick="performAction('attack')">Launch Attack Ad</button>
                </div>
                <div class="action-card">
                    <div class="action-header">
                        <div class="action-title">Fundraiser</div>
                        <div class="action-cost">4 AP · Free</div>
                    </div>
                    <div class="action-desc">Host a fundraising event. Roll 1D2: 1 = $50k, 2 = $100k raised.</div>
                    <button class="action-btn" onclick="performAction('fundraiser')">Host Fundraiser</button>
                </div>
            </div>

            <div class="section-header" style="margin-top: 30px;">Recent Actions</div>
            <div id="action-log" class="action-log">
                <div class="action-log-empty">No actions taken yet this campaign.</div>
            </div>
        `;
        } else {
            // === AUTOCRACY ACTIONS ===
            campaignActionsHTML = `
            <div class="section-header" style="margin-top: 30px;">Your Faction Resources</div>
            <div class="stat-grid" style="grid-template-columns: repeat(3, 1fr); margin-bottom: 24px;">
                <div class="stat-card">
                    <div class="stat-label">Action Points</div>
                    <div class="stat-value" id="party-ap">${faction?.action_points || 0}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Seats</div>
                    <div class="stat-value" id="party-seats">${faction?.seats || 0} / ${totalSeats}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Faction Loyalty</div>
                    <div class="stat-value" id="party-loyalty">${faction?.loyalty ?? 50}%</div>
                </div>
            </div>

            <div class="section-header">Faction Actions</div>
            <div class="action-grid" style="grid-template-columns: repeat(3, 1fr);">
                <div class="action-card">
                    <div class="action-header">
                        <div class="action-title">Give Speech</div>
                        <div class="action-cost">2 AP</div>
                    </div>
                    <div class="action-desc">Rally your faction to strengthen loyalty to the regime. Roll 1D3 for loyalty gain.</div>
                    <button class="action-btn" onclick="doGiveSpeech()">Give Speech</button>
                </div>
                <div class="action-card">
                    <div class="action-header">
                        <div class="action-title">Spread Rumors</div>
                        <div class="action-cost">3 AP</div>
                    </div>
                    <div class="action-desc">Target a rival faction: steal 1D3 seats and reduce their loyalty by 1D2. Costs 1D3 national stability.</div>
                    <div style="margin: 10px 0;">
                        <select id="rumor-target" class="action-select">
                            <option value="">Select Target Faction...</option>
                        </select>
                    </div>
                    <button class="action-btn action-btn-risk" onclick="doSpreadRumors()">Spread Rumors</button>
                </div>
                <div class="action-card" style="border-left-color: #ff4444;">
                    <div class="action-header">
                        <div class="action-title" style="color: #ff4444;">Seize Power</div>
                        <div class="action-cost">${isRulingFaction ? '—' : seizeCost + ' AP'}</div>
                    </div>
                    <div class="action-desc">
                        Attempt to overthrow the ruling faction. Triggers a Shakeup where all factions must choose sides. Seats are redistributed from losers to winners.
                        ${seatDeficit > 0 ? `<br><br><span style="color: #ff9800; font-size: 0.8rem;">⚠️ Seat deficit: ${seatDeficit} → +${Math.floor(seatDeficit / 10)} AP</span>` : ''}
                        ${loyaltyModifier < 0 ? `<br><span style="color: #4CAF50; font-size: 0.8rem;">🔥 Low loyalty discount: ${loyaltyModifier} AP</span>` : ''}
                        ${loyaltyModifier > 0 ? `<br><span style="color: #ff9800; font-size: 0.8rem;">👑 High loyalty penalty: +${loyaltyModifier} AP</span>` : ''}
                    </div>
                    <button class="action-btn" style="background: ${isRulingFaction ? '#555' : '#ff4444'};" onclick="doSeizePower(${seizeCost})" ${isRulingFaction ? 'disabled title="You are the ruling faction"' : ''}>
                        ${isRulingFaction ? '👑 You Rule' : '⚔️ Seize Power'}
                    </button>
                </div>
            </div>

            <div class="section-header" style="margin-top: 30px;">Recent Actions</div>
            <div id="action-log" class="action-log">
                <div class="action-log-empty">No actions taken yet.</div>
            </div>
        `;
        }

        document.getElementById('content-area').innerHTML = `
            <div class="panel-padding">
                <div class="section-header">${headerText} in ${nation.name}</div>

                <!-- Summary Stats -->
                <div class="stat-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:24px;">
                    <div class="stat-card">
                        <div class="stat-label">Total ${termPlural}</div>
                        <div class="stat-value">${parties.length}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">${isAutocracy ? 'In Regime' : 'Government / Coalition'}</div>
                        <div class="stat-value" style="color:#4CAF50;">${governmentCount}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">${isAutocracy ? 'Max Factions' : 'Opposition'}</div>
                        <div class="stat-value" style="color:${isAutocracy ? '#ffcc00' : '#ff4444'};">${isAutocracy ? (nation.max_parties || 4) : oppositionCount}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Total Seats</div>
                        <div class="stat-value">${totalSeats}</div>
                    </div>
                </div>

                ${isAutocracy ? `
                    <!-- Autocracy: single section -->
                    <div class="parties-section-label regime">⚡ Regime Factions</div>
                    <div class="parties-display-grid">
                        ${govParties.map(buildCard).join('')}
                    </div>
                ` : `
                    <!-- Government / Coalition -->
                    <div class="parties-section-label gov">🏛️ Government / Coalition</div>
                    ${govParties.length > 0
                        ? `<div class="parties-display-grid">${govParties.map(buildCard).join('')}</div>`
                        : '<div class="parties-section-empty">No coalition formed yet.</div>'
                    }

                    <!-- Opposition -->
                    <div class="parties-section-label opp">⚔️ Opposition</div>
                    ${oppParties.length > 0
                        ? `<div class="parties-display-grid">${oppParties.map(buildCard).join('')}</div>`
                        : '<div class="parties-section-empty">No opposition parties.</div>'
                    }
                `}

                ${campaignActionsHTML}
            </div>`;

        // Populate dropdowns and load action log
        if (!isAutocracy) {
            await populateDropdowns();
        } else {
            await populateAutocracyDropdowns();
        }
        await loadActionLog();

    } catch (error) {
        console.error('Error loading parties:', error);
        document.getElementById('content-area').innerHTML = `
            <div class="panel-padding">
                <div class="section-header">${headerText} in ${nation.name}</div>
                <div style="text-align:center;color:#ff4444;padding:40px;">
                    Error loading ${termPlural.toLowerCase()}. Please refresh.
                </div>
            </div>`;
    }
}


// ===================================================================
// CAMPAIGN ACTIONS (Democracy only)
// ===================================================================

async function populateDropdowns() {
    if (!currentFaction || !currentNation) return;

    const { data: parties } = await _supabase
        .from('factions')
        .select('id, faction_name')
        .eq('nation_id', currentNation.id)
        .eq('faction_type', 'party')
        .neq('id', currentFaction.id);

    const attackSelect = document.getElementById('attack-target');
    if (attackSelect && parties) {
        attackSelect.innerHTML = '<option value="">Select Target Party...</option>';
        parties.forEach(p => { attackSelect.innerHTML += `<option value="${p.id}">${p.faction_name}</option>`; });
    }
}

async function loadActionLog() {
    if (!currentFaction) return;
    const { data: actions } = await _supabase
        .from('campaign_actions')
        .select('*')
        .eq('party_id', currentFaction.id)
        .order('created_at', { ascending: false })
        .limit(5);

    const logDiv = document.getElementById('action-log');
    if (!logDiv) return;

    if (!actions || actions.length === 0) {
        logDiv.innerHTML = '<div class="action-log-empty">No actions taken yet.</div>';
        return;
    }

    logDiv.innerHTML = actions.map(a => {
        const date = new Date(a.created_at).toLocaleString();
        let message = '';
        if (a.action_type === 'rally') message = `Grassroots Rally: Gained ${a.result?.approval_gain || 0}% approval`;
        else if (a.action_type === 'attack_ad') message = `Attack Ad vs ${a.result?.target || 'Unknown'}: -${a.result?.approval_loss || 0}% to their approval`;
        else if (a.action_type === 'fundraiser') message = `Fundraiser: Raised $${(a.result?.money_raised || 0).toLocaleString()}`;
        else if (a.action_type === 'lobby') message = `Lobbied ${a.result?.group_name || 'Unknown'}: Received $${(a.result?.payout || 0).toLocaleString()}`;
        else if (a.action_type === 'spread_rumors') message = `Spread Rumors vs ${a.result?.target || 'Unknown'}: Stole ${a.result?.seats_stolen || 0} seats, -${a.result?.stability_loss || 0} stability`;
        else if (a.action_type === 'give_speech') message = `Gave Speech: +${a.result?.approval_gain || 0}% approval`;

        return `<div class="action-log-item">
            <div class="action-log-time">Tick ${a.tick_performed} • ${date}</div>
            <div class="action-log-message">${message}</div>
        </div>`;
    }).join('');
}

async function performAction(actionType) {
    if (!currentFaction) return;
    let result;
    try {
        if (actionType === 'rally') {
            const { data, error } = await _supabase.rpc('action_grassroots_rally', { player_party_id: currentFaction.id });
            if (error) throw error; result = data[0];
        } else if (actionType === 'attack') {
            const targetId = document.getElementById('attack-target').value;
            if (!targetId) { alert('Please select a target party!'); return; }
            const { data, error } = await _supabase.rpc('action_attack_ad', { player_party_id: currentFaction.id, target_party_id: targetId });
            if (error) throw error; result = data[0];
        } else if (actionType === 'fundraiser') {
            const { data, error } = await _supabase.rpc('action_fundraiser', { player_party_id: currentFaction.id });
            if (error) throw error; result = data[0];
        }
        if (result && result.success) {
            alert('✅ ' + result.message);
            currentFaction.action_points = result.new_ap;
            currentFaction.party_funds = result.new_funds;
            if (result.new_approval) currentFaction.approval_rating = result.new_approval;
            document.getElementById('party-ap').textContent = currentFaction.action_points || 0;
            document.getElementById('party-funds').textContent = '$' + (currentFaction.party_funds || 0).toLocaleString();
            document.getElementById('party-approval').textContent = (currentFaction.approval_rating || 0) + '%';
            await loadActionLog();
            await markFactionActive(_supabase, currentFaction.id);
            sessionStorage.removeItem('nationhood_state');
        } else {
            alert('❌ ' + (result ? result.message : 'Action failed'));
        }
    } catch (error) { console.error('Action error:', error); alert('❌ Error: ' + error.message); }
}


// ===================================================================
// AUTOCRACY ACTIONS (Give Speech, Spread Rumors, Seize Power)
// ===================================================================

async function populateAutocracyDropdowns() {
    if (!currentFaction || !currentNation) return;

    const { data: factions } = await _supabase
        .from('factions')
        .select('id, faction_name, seats')
        .eq('nation_id', currentNation.id)
        .eq('faction_type', 'party')
        .neq('id', currentFaction.id);

    const rumorSelect = document.getElementById('rumor-target');
    if (rumorSelect && factions) {
        rumorSelect.innerHTML = '<option value="">Select Target Faction...</option>';
        factions.forEach(f => { rumorSelect.innerHTML += `<option value="${f.id}">${f.faction_name} (${f.seats} seats)</option>`; });
    }
}

function updateAutocracyUI() {
    const apEl = document.getElementById('party-ap');
    const seatsEl = document.getElementById('party-seats');
    const loyaltyEl = document.getElementById('party-loyalty');
    if (apEl) apEl.textContent = currentFaction.action_points || 0;
    if (seatsEl) seatsEl.textContent = (currentFaction.seats || 0) + ' / ' + GAME_CONFIG.TOTAL_SEATS;
    if (loyaltyEl) loyaltyEl.textContent = (currentFaction.loyalty ?? 50) + '%';
}

async function doGiveSpeech() {
    try {
        const { data, error } = await _supabase.rpc('action_give_speech', { p_faction_id: currentFaction.id });
        if (error) throw error;
        if (data.success) {
            alert('✅ ' + data.message);
            currentFaction.action_points = data.new_ap;
            if (data.new_loyalty !== undefined) currentFaction.loyalty = data.new_loyalty;
            updateAutocracyUI();
            await loadActionLog();
            await markFactionActive(_supabase, currentFaction.id);
            sessionStorage.removeItem('nationhood_state');
        } else { alert('❌ ' + data.message); }
    } catch (error) { alert('❌ Error: ' + error.message); }
}

async function doSpreadRumors() {
    const targetId = document.getElementById('rumor-target')?.value;
    if (!targetId) { alert('Select a target faction!'); return; }
    try {
        const { data, error } = await _supabase.rpc('action_spread_rumors', { p_faction_id: currentFaction.id, p_target_id: targetId });
        if (error) throw error;
        if (data.success) {
            alert('✅ ' + data.message);
            currentFaction.action_points = data.new_ap;
            if (data.new_seats !== undefined) currentFaction.seats = data.new_seats;
            updateAutocracyUI();
            await loadActionLog();
            await markFactionActive(_supabase, currentFaction.id);
            sessionStorage.removeItem('nationhood_state');
        } else { alert('❌ ' + data.message); }
    } catch (error) { alert('❌ Error: ' + error.message); }
}

async function doSeizePower(apCost) {
    apCost = apCost || 15;
    if (!confirm(
        '⚔️ SEIZE POWER?\n\n' +
        'Cost: ' + apCost + ' AP\n\n' +
        'This triggers a Shakeup — all factions must choose sides.\n\n' +
        'If you WIN:\n' +
        '• You become the Ruling Faction\n' +
        '• Old strongman deposed, new leader installed\n' +
        '• Ruling faction loses 20 seats, their supporters lose 10 each\n' +
        '• Your coalition gains those seats + 20 Loyalty\n\n' +
        'If you LOSE:\n' +
        '• Your side loses 10 seats each, redistributed to winners\n' +
        '• 6-tick cooldown before you can try again\n\n' +
        'Proceed?'
    )) return;
    try {
        const { data, error } = await _supabase.rpc('action_seize_power', { p_faction_id: currentFaction.id });
        if (error) throw error;
        if (data.success) {
            alert('⚔️ ' + data.message);
            currentFaction.action_points = data.new_ap;
            updateAutocracyUI();
            await loadActionLog();
            await markFactionActive(_supabase, currentFaction.id);
            sessionStorage.removeItem('nationhood_state');
        } else { alert('❌ ' + data.message); }
    } catch (error) { alert('❌ Error: ' + error.message); }
}
