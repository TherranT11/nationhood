<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>City — Nationhood</title>
<style>
/* Topbar / nav / body base live in js/politician-topbar.js. Page-local
   styles mirror politician-nation.html's Geography card vocabulary so
   the per-city URL reads as the same surface, just larger. Sizing
   choices: COA 56×56 (same as the card), meta as a single inline row
   (no dark band — matches the Geography card and avoids the heavy
   visual break the user flagged), stat values bumped to weight 700
   on a slightly brighter color so the serif copy doesn't read as
   ghosted at 13px. */
* { box-sizing:border-box; margin:0; padding:0; }
.content { padding:28px 24px 40px; max-width:960px; margin:0 auto; }

.city-back { display:inline-flex; align-items:center; gap:6px;
  font-family:monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
  color:#888; text-decoration:none; margin-bottom:18px;
  padding:6px 10px; border:0.5px solid rgba(255,255,255,0.08); border-radius:3px; }
.city-back:hover { color:#d4d4d4; border-color:rgba(255,255,255,0.2); }

.city-detail { background:#0a0807; border:0.5px solid rgba(200,166,78,0.18);
  border-radius:6px; padding:22px; }

.city-detail-head { display:flex; gap:16px; align-items:flex-start; margin-bottom:18px; }
.city-detail-coa { width:56px; height:56px; flex-shrink:0; background:#1a1612;
  border:0.5px solid rgba(200,166,78,0.25); border-radius:4px;
  color:#555; font-size:9px; letter-spacing:0.12em; font-weight:700;
  display:flex; align-items:center; justify-content:center; cursor:help; }
.city-detail-head-text { flex:1; min-width:0; }
.city-detail-eyebrow { font-size:9px; color:#888; letter-spacing:0.14em;
  text-transform:uppercase; margin-bottom:4px; font-family:monospace; font-weight:600; }
.city-detail-name { font-size:22px; font-weight:600; color:#c8a64e;
  letter-spacing:0.005em; line-height:1.2; }
.city-detail-capital-tag { font-size:13px; color:#888; font-weight:400;
  letter-spacing:0.04em; font-style:italic; margin-left:5px; }
.city-detail-blurb { font-size:12px; color:#a0a0a0; line-height:1.6;
  font-style:italic; margin-top:6px; }

/* Meta is a 3-column inline row inside the card body — same shape as
   the Geography card so the surfaces read as the same vocabulary
   (no dark band that looks pasted on). */
.city-detail-meta { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px;
  padding-bottom:14px; margin-bottom:18px;
  border-bottom:0.5px solid rgba(255,255,255,0.06); }
.city-detail-meta > div { display:flex; flex-direction:column; gap:3px;
  min-width:0; }
.city-detail-meta-key { font-size:9px; color:#666; letter-spacing:0.12em;
  text-transform:uppercase; font-weight:600; font-family:monospace; }
.city-detail-meta-val { font-size:14px; color:#e0e0e0; font-weight:600;
  font-family:Georgia,serif; line-height:1.3; }
.city-detail-meta-sub { font-size:10px; color:#888; letter-spacing:0.04em;
  font-family:monospace; font-style:italic; margin-top:3px; }
.city-detail-mayor-party { display:inline-block; font-size:9px; color:#dcb88a;
  background:rgba(200,166,78,0.08); border:0.5px solid rgba(200,166,78,0.25);
  padding:2px 6px; border-radius:3px; letter-spacing:0.08em;
  font-weight:700; font-family:monospace; margin-left:5px; vertical-align:1px; }

.city-detail-section { margin-top:18px; }
.city-detail-section-head { font-size:10px; letter-spacing:0.14em;
  text-transform:uppercase; color:#c8a64e; font-weight:700; font-family:monospace;
  margin-bottom:10px; padding-bottom:6px;
  border-bottom:0.5px solid rgba(200,166,78,0.15); }

.city-detail-stats { display:grid; grid-template-columns:repeat(2, 1fr); gap:6px 20px; }
.city-detail-stat-row { display:flex; justify-content:space-between; align-items:baseline;
  padding:6px 0; border-bottom:0.5px solid rgba(255,255,255,0.04); }
.city-detail-stat-key { font-size:10px; color:#888; letter-spacing:0.08em;
  text-transform:uppercase; }
.city-detail-stat-val { font-size:12px; color:#e6e6e6; font-weight:700;
  font-family:Georgia,serif; }

/* Council seats — president + 3 members. President spans the full
   row at the top so it reads as the chair; the three member seats
   share a 3-column grid below it. Each row carries a role label,
   the seated name, an optional party chip + archetype line, and
   age. Player-held seats get a gold accent on the role label so
   they're visually distinct from NPC seats. */
.city-detail-council { display:flex; flex-direction:column; gap:8px; }
.city-detail-council-row { display:flex; align-items:flex-start; gap:14px;
  padding:11px 14px; background:#0d0a08;
  border:0.5px solid rgba(255,255,255,0.05); border-radius:4px;
  min-width:0; }
.city-detail-council-row.is-player { border-color:rgba(200,166,78,0.35); }
.city-detail-council-role { font-size:9px; color:#888; letter-spacing:0.1em;
  text-transform:uppercase; font-weight:600; font-family:monospace;
  flex-shrink:0; padding-top:2px; width:110px; }
.city-detail-council-row.is-player .city-detail-council-role { color:#c8a64e; }
.city-detail-council-body { flex:1; min-width:0; display:flex;
  flex-direction:column; gap:3px; }
.city-detail-council-name { font-size:13px; color:#d4d4d4; font-weight:600;
  font-family:Georgia,serif; }
.city-detail-council-meta { font-size:9px; color:#888; letter-spacing:0.04em;
  font-family:monospace; }
.city-detail-council-meta .party { display:inline-block; font-size:9px;
  color:#dcb88a; background:rgba(200,166,78,0.08);
  border:0.5px solid rgba(200,166,78,0.25); padding:1px 5px; border-radius:3px;
  letter-spacing:0.08em; font-weight:700; margin-right:5px; }
.city-detail-council-members { display:grid; grid-template-columns:repeat(3, 1fr);
  gap:8px; }
@media (max-width: 720px) {
  .city-detail-council-members { grid-template-columns:1fr; }
  .city-detail-council-role { width:90px; }
}

.city-detail-error { padding:48px 24px; text-align:center; color:#c87a7a;
  font-family:monospace; font-size:12px; letter-spacing:0.08em; }

@media (max-width: 720px) {
  .city-detail-stats   { grid-template-columns:1fr; }
  .city-detail-meta    { grid-template-columns:1fr; }
  .city-detail-council { grid-template-columns:1fr; }
  .city-detail-name    { font-size:19px; }
}
</style>
</head>
<body>

<!-- Topbar mount slot. bootstrapPolitician('nation') injects the
     politician topbar + nav into this div + the body background style
     into <head>. Without this slot the topbar silently no-ops AND the
     body background never gets the dark color the rest of the
     politician pages share. -->
<div id="pol-topbar-container"></div>

<div class="content" id="content" style="display:none;">
  <a class="city-back" href="politician-nation.html#sec-geography">&larr; Back to Geography</a>
  <div id="city-detail"></div>
</div>

<div id="loading" class="loading">LOADING...</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { bootstrapPolitician } from './js/politician-topbar.js';
import { tickToDate } from './js/utils.js';
import { cityStatLabel, CITY_STATS, cityDisplayData } from './js/game/city-labels.js';

function escHtml(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

// 20270722: council seats now ship populated. The cities.council
// jsonb column carries a 4-element array (president + 3 members)
// with NPC seeds + denormalized party info. Player CCM/CCP wins
// stamp into the array; reads here just render whatever's there.
const COUNCIL_ROLE_LABEL = {
  president: 'City Council President',
  member_1:  'CC Member · Seat 1',
  member_2:  'CC Member · Seat 2',
  member_3:  'CC Member · Seat 3',
};

async function init() {
  const params = new URLSearchParams(location.search);
  const cityId = params.get('id');
  if (!cityId) {
    showError('No city specified.');
    return;
  }

  let ctx = null;
  try { ctx = await bootstrapPolitician('nation'); }
  catch (err) {
    console.error('city: bootstrap failed', err);
    document.getElementById('loading').textContent = 'Failed to load. Please reload the page.';
    return;
  }
  if (!ctx) return;
  const currentTick = Number(ctx?.shard?.current_tick) || 0;

  // City fetch — same shape as politician-nation.html's Geography card
  // (one source for the embedded mayor_party FK + all 8 stat columns).
  // 20270719: mayor_term_end_tick joins the SELECT so the meta row
  // can render the term countdown / end-date under the Mayor.
  let city = null, nation = null;
  try {
    const { data, error } = await _supabase.from('cities')
      .select(`
        id, nation_id, city_type, city_name, description, population_pct,
        mayor_first_name, mayor_last_name, mayor_age, mayor_archetype,
        mayor_party:factions!cities_mayor_party_id_fkey(faction_name, abbreviation, archetype),
        budget, infrastructure, pollution, crime, appeal, growth, jobs, services, affordability,
        mayor_term_end_tick, council
      `)
      .eq('id', cityId)
      .maybeSingle();
    if (error) throw error;
    if (!data) { showError('City not found.'); return; }
    city = data;
  } catch (err) {
    console.error('city: city fetch failed', err);
    showError('Could not load this city. Try again.');
    return;
  }

  try {
    const { data, error } = await _supabase.from('nations')
      .select('id, name, population')
      .eq('id', city.nation_id)
      .maybeSingle();
    if (error) throw error;
    nation = data;
  } catch (err) {
    // Soft-fail: population falls back to the 11% blanket on null.
    console.warn('city: nation fetch failed', err);
  }

  renderCityDetail(city, nation, currentTick);
  document.title = `${city.city_name || 'City'} — Nationhood`;
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}

// 20270719 helper: turn mayor_term_end_tick into a sub-row under the
// Mayor name. NULL = NPC mayor → no term sub-row. A future tick →
// "Term ends Month Year". Past tick → "Term ended Month Year — re
// -election pending" (the resolve_expired_mayor_term RPC fires on
// the next page load by the politician owner — viewers of this page
// don't trigger it).
function mayorTermLine(termEndTick, currentTick) {
  if (termEndTick == null) return '';
  const endDate = tickToDate(termEndTick);
  if (termEndTick > currentTick) {
    const ticks = termEndTick - currentTick;
    return `<div class="city-detail-meta-sub">Term ends ${escHtml(endDate)} · ${ticks} month${ticks === 1 ? '' : 's'} remaining</div>`;
  }
  return `<div class="city-detail-meta-sub">Term ended ${escHtml(endDate)} · re-election pending</div>`;
}

function renderCityDetail(c, nation, currentTick) {
  const nationPop = Number(nation?.population) || 0;
  const { population, mayorName, partyAbbr, archetype, budgetStr } = cityDisplayData(c, nationPop);
  const isCapital = c.city_type === 'capital';
  const eyebrow = nation?.name
    ? `${nation.name} · ${isCapital ? 'CAPITAL' : 'MAJOR CITY'}`
    : (isCapital ? 'CAPITAL' : 'MAJOR CITY');
  const partyChip = partyAbbr
    ? `<span class="city-detail-mayor-party">${escHtml(partyAbbr)}</span>` : '';
  const mayorAge = Number.isFinite(Number(c.mayor_age)) ? Number(c.mayor_age) : null;
  const mayorTermHtml = mayorTermLine(c.mayor_term_end_tick, currentTick);
  // Archetype sits below the name as a small italic sub when set.
  const archetypeSub = (archetype && mayorName !== '—')
    ? `<div class="city-detail-meta-sub">${escHtml(archetype)}</div>` : '';

  const statRows = CITY_STATS.map(({ key, name }) => `
    <div class="city-detail-stat-row">
      <span class="city-detail-stat-key">${escHtml(name)}</span>
      <span class="city-detail-stat-val">${escHtml(cityStatLabel(key, c[key]))}</span>
    </div>`).join('');

  const councilHtml = renderCouncil(c.council, currentTick);

  document.getElementById('city-detail').innerHTML = `
    <div class="city-detail-head">
      <div class="city-detail-coa" title="Coat of Arms · Coming Soon">COA</div>
      <div class="city-detail-head-text">
        <div class="city-detail-eyebrow">${escHtml(eyebrow)}</div>
        <div class="city-detail-name">${escHtml(c.city_name || 'Unnamed City')}${isCapital ? '<span class="city-detail-capital-tag">(Capital)</span>' : ''}</div>
        <div class="city-detail-blurb">${escHtml(c.description || '')}</div>
      </div>
    </div>

    <div class="city-detail-meta">
      <div>
        <span class="city-detail-meta-key">Population</span>
        <span class="city-detail-meta-val">${escHtml(population.toLocaleString())}</span>
      </div>
      <div>
        <span class="city-detail-meta-key">Mayor of ${escHtml(c.city_name || 'this city')}${mayorAge != null ? ` · Age ${mayorAge}` : ''}</span>
        <span class="city-detail-meta-val">${escHtml(mayorName)}${partyChip}</span>
        ${archetypeSub}
        ${mayorTermHtml}
      </div>
      <div>
        <span class="city-detail-meta-key">Budget</span>
        <span class="city-detail-meta-val">${escHtml(budgetStr)}</span>
      </div>
    </div>

    <div class="city-detail-section">
      <div class="city-detail-section-head">City Stats</div>
      <div class="city-detail-stats">${statRows}</div>
    </div>

    <div class="city-detail-section">
      <div class="city-detail-section-head">City Council</div>
      ${councilHtml}
    </div>`;
}

// 20270722: render the 4-seat council. Presidency stretches across
// the row above the 3 member seats. Each seat either reads as the
// seeded NPC or — when a player has won the seat — flips a gold
// accent on the role label + a "Term ends Month Year" sub-line.
// Empty / malformed council gets a graceful "Records unavailable"
// fallback so a not-yet-seeded city doesn't render as nothing.
function renderCouncil(council, currentTick) {
  if (!Array.isArray(council) || council.length === 0) {
    return `<div class="city-detail-council-note">Council records are still being compiled.</div>`;
  }
  const president = council.find(s => s?.seat === 'president');
  const members   = council.filter(s => s?.seat && s.seat.startsWith('member_'));
  const presHtml = president ? councilSeatRow(president, currentTick) : '';
  const memberHtml = members.length
    ? `<div class="city-detail-council-members">${members.map(s => councilSeatRow(s, currentTick)).join('')}</div>`
    : '';
  return `<div class="city-detail-council">${presHtml}${memberHtml}</div>`;
}

function councilSeatRow(seat, currentTick) {
  const role     = COUNCIL_ROLE_LABEL[seat.seat] || seat.seat || 'Council';
  const first    = seat.first_name || '';
  const last     = seat.last_name  || '';
  const name     = `${first} ${last}`.trim() || '—';
  const age      = Number.isFinite(Number(seat.age)) ? Number(seat.age) : null;
  const partyAbbr = seat.party_abbr || seat.party_name || '';
  const partyChip = partyAbbr
    ? `<span class="party">${escHtml(partyAbbr)}</span>` : '';
  const archetype = seat.archetype || '';
  const isPlayer  = !!seat.holder_faction_id;
  // NPC seats persist with term_end_tick = null. Explicit null/undefined
  // check before Number() — Number(null) coerces to 0 and would otherwise
  // render every NPC as "Term ended January, 2000."
  const rawTet = seat.term_end_tick;
  const termEndTick = (rawTet == null || rawTet === '') ? null : Number(rawTet);
  let termLine = '';
  if (termEndTick != null && Number.isFinite(termEndTick)) {
    const ticks = termEndTick - currentTick;
    if (ticks > 0) {
      termLine = ` · Term ends ${escHtml(tickToDate(termEndTick))} · ${ticks} month${ticks === 1 ? '' : 's'} left`;
    } else {
      termLine = ` · Term ended ${escHtml(tickToDate(termEndTick))}`;
    }
  }
  const metaBits = [];
  if (age != null) metaBits.push(`Age ${age}`);
  if (archetype)   metaBits.push(escHtml(archetype));
  const metaLine = (metaBits.length || termLine)
    ? `<div class="city-detail-council-meta">${partyChip}${metaBits.join(' · ')}${termLine}</div>`
    : '';
  return `
    <div class="city-detail-council-row${isPlayer ? ' is-player' : ''}">
      <span class="city-detail-council-role">${escHtml(role)}</span>
      <div class="city-detail-council-body">
        <div class="city-detail-council-name">${escHtml(name)}</div>
        ${metaLine}
      </div>
    </div>`;
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
  document.getElementById('city-detail').innerHTML =
    `<div class="city-detail-error">${escHtml(msg)}</div>`;
}

init();
</script>
</body>
</html>
