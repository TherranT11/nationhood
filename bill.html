<script src="js/supabase-client.js"></script>
<script src="js/common.js"></script>
<script>
/**
 * Bill Detail Page
 * FIXES: autocracy seats, ideology filter, head faction enact
 */
let currentBill = null, currentFaction = null, currentNation = null, currentSeats = 0;
let myVote = null, allPartySeats = {}, allParties = [], allPolicies = [], amendmentRequests = [];
let selectedAmendmentPolicy = null, isAutocracy = false, isHeadFaction = false, headFactionId = null;

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const urlParams = new URLSearchParams(window.location.search);
const billId = urlParams.get('id');
const MAJOR_SECTORS = [
    {key:'ECONOMICS',label:'Economics'},{key:'LABOR',label:'Labor'},{key:'EDUCATION',label:'Education'},
    {key:'ENERGY',label:'Energy'},{key:'SOCIAL',label:'Social'},{key:'MILITARY',label:'Military & Security'},
    {key:'GOVERNANCE',label:'Governance'},{key:'IMMIGRATION',label:'Immigration'},{key:'INTERNATIONAL',label:'International'}
];

initPage('laws', async (state) => {
    const { nation, faction } = state;
    currentNation = nation;
    currentFaction = faction;
    isAutocracy = (nation?.government_type === 'Autocracy');
    if (!billId) {
        document.getElementById('loading-state').innerHTML = '<div style="text-align:center;color:#ff4444;"><h2>No Bill Selected</h2><p>Please select a bill from the <a href="laws.html" style="color:#ffcc00;">Laws</a> page.</p></div>';
        return;
    }
    await loadBillData();
    await loadComments();
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('bill-page').style.display = 'grid';
    setupRealtimeComments();
});

function tickToDate(tick) {
    const y = 2000 + Math.floor(tick / 12);
    return `${MONTHS[tick % 12]}, ${y}`;
}

async function loadBillData() {
    try {
        const { data: bill, error } = await _supabase
            .from('bills')
            .select('*, factions(faction_name), bill_articles(*, policies(*), factions(faction_name)), bill_support(*, factions(faction_name))')
            .eq('id', billId).single();
        if (error) throw error;
        currentBill = bill;

        const { data: parties } = await _supabase
            .from('factions')
            .select('id, faction_name, is_npc, seats')
            .eq('nation_id', bill.nation_id).eq('faction_type', 'party');
        allParties = parties || [];

        // FIX 1: Seat loading — autocracies use factions.seats, democracies try election then fallback
        if (isAutocracy) {
            allParties.forEach(p => { allPartySeats[p.id] = p.seats || 0; });
            currentSeats = currentFaction?.seats || allPartySeats[currentFaction?.id] || 0;
        } else {
            const { data: election } = await _supabase
                .from('elections').select('results')
                .eq('nation_id', bill.nation_id).eq('status', 'completed')
                .order('election_tick', { ascending: false }).limit(1).maybeSingle();
            if (election?.results?.votes) {
                election.results.votes.forEach(s => { allPartySeats[s.party_id] = s.seats; });
            } else if (election?.results?.seats) {
                election.results.seats.forEach(s => { allPartySeats[s.party_id] = s.seats; });
            }
            allParties.forEach(p => { if (!allPartySeats[p.id]) allPartySeats[p.id] = p.seats || 0; });
            currentSeats = allPartySeats[currentFaction?.id] || currentFaction?.seats || 0;
        }

        // Determine head faction for autocracy
        if (isAutocracy) {
            const top = allParties.slice().sort((a,b) => (allPartySeats[b.id]||0) - (allPartySeats[a.id]||0))[0];
            if (top) { headFactionId = top.id; isHeadFaction = (currentFaction?.id === headFactionId); }
        }

        const { data: policies } = await _supabase.from('policies').select('*').eq('is_active', true);
        allPolicies = policies || [];

        if (bill.status === 'committee') {
            const { data: amendments } = await _supabase
                .from('bill_amendment_requests')
                .select('*, factions(faction_name), policies(policy_name)')
                .eq('bill_id', billId).eq('status', 'pending');
            amendmentRequests = amendments || [];
        }

        const mySupport = bill.bill_support?.find(s => s.faction_id === currentFaction?.id);
        if (mySupport) myVote = mySupport.stance;

        renderBill();
    } catch (error) {
        console.error('Error loading bill:', error);
        document.getElementById('loading-state').innerHTML = `<div style="text-align:center;color:#ff4444;"><h2>Error Loading Bill</h2><p>${error.message}</p></div>`;
    }
}

function renderBill() {
    const bill = currentBill;
    const isSponsor = bill.proposed_by === currentFaction?.id;
    const isCommittee = bill.status === 'committee';
    const isFloor = bill.status === 'floor';

    document.getElementById('bill-header').className = `bill-header ${bill.status}`;
    const statusEl = document.getElementById('bill-status');
    statusEl.textContent = bill.status.toUpperCase();
    statusEl.className = `bill-status ${bill.status}`;
    document.getElementById('bill-title').textContent = bill.bill_name || 'Unnamed Bill';
    document.getElementById('bill-sponsor').textContent = `Proposed by ${bill.factions?.faction_name || 'Unknown'}`;

    if (isFloor && bill.voting_ends_tick) {
        document.getElementById('bill-voting-ends').style.display = 'block';
        document.getElementById('voting-ends-date').textContent = tickToDate(bill.voting_ends_tick);
    }

    renderArticles();
    renderSidebar();

    // FIX 3: Sponsor actions — autocracy head faction can enact
    if (isFloor) {
        document.getElementById('voting-section').style.display = 'block';
        renderCurrentVote();
    } else if (isCommittee) {
        const el = document.getElementById('sponsor-actions');
        if (isAutocracy) {
            const canEnact = isHeadFaction, canRetract = isSponsor;
            if (canEnact || canRetract) {
                el.style.display = 'flex';
                el.innerHTML = `${canEnact ? '<button class="sponsor-btn enact-decree" onclick="enactDecree()">⚡ Enact Decree</button>' : ''}${canRetract ? '<button class="sponsor-btn retract" onclick="retractBill()">Retract Decree</button>' : ''}`;
            }
        } else if (isSponsor) {
            const support = calculateSupport();
            el.style.display = 'flex';
            el.innerHTML = `<button class="sponsor-btn send-floor" onclick="sendToFloor()" ${support.percent < 51 ? 'disabled' : ''}>Send to Floor</button><button class="sponsor-btn retract" onclick="retractBill()">Retract Bill</button>`;
        }
    }
}

function renderArticles() {
    const bill = currentBill;
    const articles = (bill.bill_articles || []).sort((a,b) => a.article_number - b.article_number);
    let totalUpfront = 0, totalOngoing = 0;
    const html = `
        <div class="article preamble">
            <div class="article-number">Article I</div>
            <div class="article-title">Preamble</div>
            <div class="article-description">${bill.preamble || 'This bill seeks to enact the following provisions.'}</div>
        </div>
        ${articles.map(art => {
            const p = art.policies;
            if (!p) return '';
            totalUpfront += p.upfront_cost || 0;
            totalOngoing += p.ongoing_cost || 0;
            const dir = p.stat_direction === 'UP' ? '↑' : '↓';
            const cls = p.stat_direction === 'UP' ? 'stat-up' : 'stat-down';
            return `<div class="article">
                <div class="article-number">Article ${art.article_number}</div>
                <div class="article-title">${p.policy_name}<span class="article-ideology">${p.ideology}</span></div>
                <div class="article-description">${p.description}</div>
                <div class="article-stat-effect">Effect: <span class="${cls}">${dir} ${p.target_stat}</span></div>
                <div class="article-costs">
                    <div class="cost-item"><span class="cost-label">Upfront:</span><span class="cost-value ${p.upfront_cost < 0 ? 'negative' : ''}">${formatCurrency(p.upfront_cost)}</span></div>
                    <div class="cost-item"><span class="cost-label">Ongoing:</span><span class="cost-value ${p.ongoing_cost < 0 ? 'negative' : ''}">${formatCurrency(p.ongoing_cost)}/mo</span></div>
                </div>
                <div class="article-author">Added by ${art.factions?.faction_name || 'Unknown'}</div>
            </div>`;
        }).join('')}`;
    document.getElementById('bill-articles').innerHTML = html;
    document.getElementById('total-upfront').textContent = formatCurrency(totalUpfront);
    document.getElementById('total-upfront').className = `total-value ${totalUpfront < 0 ? 'revenue' : ''}`;
    document.getElementById('total-ongoing').textContent = `${formatCurrency(totalOngoing)}/mo`;
    document.getElementById('total-ongoing').className = `total-value ${totalOngoing < 0 ? 'revenue' : ''}`;
}

function calculateSupport() {
    const support = currentBill.bill_support || [];
    const sponsorSeats = allPartySeats[currentBill.proposed_by] || 0;
    const acceptedSeats = support.filter(s => s.stance === 'accept').reduce((sum, s) => sum + s.seat_count, 0);
    const totalSupport = sponsorSeats + acceptedSeats;
    return { sponsorSeats, acceptedSeats, totalSupport, percent: Math.round((totalSupport / 120) * 100) };
}

function renderSidebar() {
    const bill = currentBill, isCommittee = bill.status === 'committee', isFloor = bill.status === 'floor';
    const isSponsor = bill.proposed_by === currentFaction?.id;
    let html = '';
    if (isCommittee) {
        const support = calculateSupport();
        const billSupport = bill.bill_support || [];
        html = `<div class="support-box">
            <div class="support-box-header"><div class="support-box-title">Support (${support.percent}%)</div></div>
            <div class="support-box-content">
                ${allParties.map(party => {
                    const seats = allPartySeats[party.id] || 0;
                    const isSp = party.id === bill.proposed_by;
                    const stance = billSupport.find(s => s.faction_id === party.id);
                    let sc = 'pending', st = 'PENDING';
                    if (isSp) { sc = 'sponsor'; st = 'SPONSOR'; }
                    else if (stance?.stance === 'accept') { sc = 'accept'; st = 'ACCEPT'; }
                    else if (stance?.stance === 'reject') { sc = 'reject'; st = 'REJECT'; }
                    return `<div class="support-item"><div><div class="support-party">${party.faction_name}</div><div class="support-seats">${seats} seats</div></div><span class="support-status ${sc}">${st}</span></div>`;
                }).join('')}
            </div>
            ${amendmentRequests.length > 0 ? `
                <div class="support-box-header" style="border-top:1px solid #333;"><div class="support-box-title">Amendment Requests</div></div>
                <div class="support-box-content">
                    ${amendmentRequests.map(req => `<div class="amendment-request">
                        <div class="amendment-header"><div><div class="amendment-party">${req.factions?.faction_name || 'Unknown'}</div><div class="amendment-seats">${allPartySeats[req.faction_id] || 0} seats</div></div></div>
                        <div class="amendment-policy">+ Add: ${req.policies?.policy_name || 'Unknown'}</div>
                        ${isSponsor ? `<div class="amendment-actions"><button class="amendment-btn accept" onclick="respondToAmendment('${req.id}','accepted')">Accept</button><button class="amendment-btn reject" onclick="respondToAmendment('${req.id}','rejected')">Reject</button></div>` : ''}
                    </div>`).join('')}
                </div>` : (!isSponsor ? `<div class="support-box-header" style="border-top:1px solid #333;"><div class="support-box-title">Amendment Requests</div></div><div class="no-amendments">No pending amendments</div>` : '')}
            ${!isSponsor ? `<div class="add-amendment-section"><button class="add-amendment-btn" onclick="openAmendmentModal()">+ Propose Amendment</button></div>` : ''}
        </div>`;
    } else if (isFloor) {
        const support = bill.bill_support || [];
        let f=0,a=0,ab=0;
        support.forEach(s => { if(s.stance==='yes')f+=s.seat_count; else if(s.stance==='no')a+=s.seat_count; else if(s.stance==='abstain')ab+=s.seat_count; });
        html = `<div class="vote-tally"><div class="vote-tally-header"><div class="vote-tally-title">Current Tally</div></div><div class="vote-tally-content">
            <div class="vote-tally-row"><span class="vote-tally-label">For</span><span class="vote-tally-value for">${f} seats</span></div>
            <div class="vote-tally-row"><span class="vote-tally-label">Against</span><span class="vote-tally-value against">${a} seats</span></div>
            <div class="vote-tally-row"><span class="vote-tally-label">Abstain</span><span class="vote-tally-value abstain">${ab} seats</span></div>
        </div></div>`;
    }
    document.getElementById('sidebar-top').innerHTML = html;
}

function renderCurrentVote() {
    if (myVote) {
        document.getElementById('current-vote').style.display = 'block';
        const el = document.getElementById('current-vote-value');
        el.textContent = myVote.toUpperCase();
        el.className = `current-vote-value ${myVote}`;
        document.querySelectorAll('.vote-btn').forEach(b => b.classList.remove('selected'));
        document.querySelector(`.vote-btn.${myVote}`)?.classList.add('selected');
    }
}

async function castVote(vote) {
    if (!currentFaction || currentBill.status !== 'floor') return;
    try {
        const { error } = await _supabase.from('bill_support').upsert({ bill_id: billId, faction_id: currentFaction.id, stance: vote, seat_count: currentSeats }, { onConflict: 'bill_id,faction_id' });
        if (error) throw error;
        myVote = vote;
        await loadBillData();
    } catch (e) { console.error(e); alert('Error: ' + e.message); }
}

async function enactDecree() {
    if (!isAutocracy || !isHeadFaction) return;
    if (!confirm('⚡ ENACT this decree?\n\nThis will send it directly to the floor for a vote.\n\nProceed?')) return;
    try {
        const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const { error } = await _supabase.from('bills').update({ status: 'floor', voting_ends_tick: (shard?.current_tick || 0) + 3 }).eq('id', billId);
        if (error) throw error;
        alert('⚡ Decree sent to the floor!');
        window.location.reload();
    } catch (e) { console.error(e); alert('Error: ' + e.message); }
}

async function sendToFloor() {
    if (!currentFaction || currentBill.proposed_by !== currentFaction.id) return;
    try {
        const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const { error } = await _supabase.from('bills').update({ status: 'floor', voting_ends_tick: (shard?.current_tick || 0) + 3 }).eq('id', billId);
        if (error) throw error;
        alert('Bill sent to the floor!');
        window.location.reload();
    } catch (e) { console.error(e); alert('Error: ' + e.message); }
}

async function retractBill() {
    if (!confirm('Retract this? This cannot be undone.')) return;
    try {
        await _supabase.from('bill_comments').delete().eq('bill_id', billId);
        await _supabase.from('bill_amendment_requests').delete().eq('bill_id', billId);
        await _supabase.from('bill_support').delete().eq('bill_id', billId);
        await _supabase.from('bill_articles').delete().eq('bill_id', billId);
        await _supabase.from('bills').delete().eq('id', billId);
        alert('Retracted.');
        window.location.href = 'laws.html';
    } catch (e) { console.error(e); alert('Error: ' + e.message); }
}

function openAmendmentModal() {
    selectedAmendmentPolicy = null;
    document.getElementById('submit-amendment-btn').disabled = true;
    document.getElementById('amendment-sector').value = '';
    document.getElementById('amendment-policy-group').style.display = 'none';
    const sel = document.getElementById('amendment-sector');
    sel.innerHTML = '<option value="">-- Choose a sector --</option>';
    MAJOR_SECTORS.forEach(s => { if (getCompatiblePolicies(s.key).length > 0) sel.innerHTML += `<option value="${s.key}">${s.label}</option>`; });
    document.getElementById('amendment-modal').classList.add('active');
}
function closeAmendmentModal() { document.getElementById('amendment-modal').classList.remove('active'); }

// FIX 2: Autocracy with no ideology can propose any policy
function getCompatiblePolicies(sector) {
    const i1 = (currentFaction?.ideology_value_1 || '').toUpperCase();
    const i2 = (currentFaction?.ideology_value_2 || '').toUpperCase();
    const billPolicyIds = (currentBill.bill_articles || []).map(a => a.policy_id);
    if (isAutocracy && !i1 && !i2) {
        return allPolicies.filter(p => p.major_sector === sector && !billPolicyIds.includes(p.id));
    }
    return allPolicies.filter(p => p.major_sector === sector && (p.ideology.toUpperCase() === i1 || p.ideology.toUpperCase() === i2) && !billPolicyIds.includes(p.id));
}

function onAmendmentSectorChange() {
    const sector = document.getElementById('amendment-sector').value;
    if (!sector) { document.getElementById('amendment-policy-group').style.display = 'none'; return; }
    const policies = getCompatiblePolicies(sector);
    document.getElementById('amendment-policies').innerHTML = policies.map(p => `<div class="policy-option" data-policy-id="${p.id}" onclick="selectAmendmentPolicy('${p.id}')"><div class="policy-option-name">${p.policy_name}</div><div class="policy-option-desc">${p.description}</div></div>`).join('');
    document.getElementById('amendment-policy-group').style.display = 'block';
}

function selectAmendmentPolicy(id) {
    selectedAmendmentPolicy = allPolicies.find(p => p.id === id);
    document.querySelectorAll('#amendment-policies .policy-option').forEach(e => e.classList.remove('selected'));
    document.querySelector(`[data-policy-id="${id}"]`)?.classList.add('selected');
    document.getElementById('submit-amendment-btn').disabled = false;
}

async function submitAmendment() {
    if (!selectedAmendmentPolicy || !currentFaction) return;
    try {
        const { error } = await _supabase.from('bill_amendment_requests').insert({ bill_id: billId, faction_id: currentFaction.id, policy_id: selectedAmendmentPolicy.id, request_type: 'add', status: 'pending' });
        if (error) throw error;
        closeAmendmentModal();
        await loadBillData();
        alert('Amendment proposed!');
    } catch (e) { console.error(e); alert('Error: ' + e.message); }
}

async function respondToAmendment(reqId, response) {
    if (!currentFaction || currentBill.proposed_by !== currentFaction.id) return;
    try {
        await _supabase.from('bill_amendment_requests').update({ status: response }).eq('id', reqId);
        if (response === 'accepted') {
            const req = amendmentRequests.find(r => r.id === reqId);
            const maxArt = Math.max(...(currentBill.bill_articles || []).map(a => a.article_number), 1);
            await _supabase.from('bill_articles').insert({ bill_id: billId, policy_id: req.policy_id, article_number: maxArt + 1, added_by: req.faction_id });
            await _supabase.from('bill_support').upsert({ bill_id: billId, faction_id: req.faction_id, stance: 'accept', seat_count: allPartySeats[req.faction_id] || 0 }, { onConflict: 'bill_id,faction_id' });
        }
        await loadBillData();
    } catch (e) { console.error(e); alert('Error: ' + e.message); }
}

async function loadComments() {
    try {
        const { data, error } = await _supabase.from('bill_comments').select('*, factions(faction_name)').eq('bill_id', billId).order('created_at', { ascending: true });
        if (error) throw error;
        renderComments(data || []);
    } catch (e) { console.error(e); }
}

function renderComments(comments) {
    const c = document.getElementById('chat-messages');
    if (comments.length === 0) { c.innerHTML = '<div class="chat-empty">No comments yet. Be the first to speak!</div>'; return; }
    c.innerHTML = comments.map(m => `<div class="chat-message"><div class="chat-message-header"><span class="chat-message-author">${m.factions?.faction_name || 'Unknown'}</span><span class="chat-message-time">${formatTime(m.created_at)}</span></div><div class="chat-message-text">${escapeHtml(m.comment_text)}</div></div>`).join('');
    c.scrollTop = c.scrollHeight;
}

async function sendComment() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text || !currentFaction) return;
    try {
        const { error } = await _supabase.from('bill_comments').insert({ bill_id: billId, faction_id: currentFaction.id, comment_text: text });
        if (error) throw error;
        input.value = '';
        await loadComments();
    } catch (e) { console.error(e); alert('Error: ' + e.message); }
}

function setupRealtimeComments() {
    _supabase.channel('bill-comments').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'bill_comments', filter: `bill_id=eq.${billId}` }, () => loadComments()).subscribe();
}

function formatCurrency(amt) {
    if (amt === 0) return '$0';
    const abs = Math.abs(amt), sign = amt < 0 ? '+' : '-';
    if (abs >= 1e9) return `${sign}$${(abs/1e9).toFixed(1)}B`;
    if (abs >= 1e6) return `${sign}$${(abs/1e6).toFixed(0)}M`;
    if (abs >= 1e3) return `${sign}$${(abs/1e3).toFixed(0)}K`;
    return `${sign}$${abs}`;
}

function formatTime(ts) {
    const d = new Date(ts), diff = Date.now() - d;
    if (diff < 60000) return 'Just now';
    if (diff < 3600000) return `${Math.floor(diff/60000)}m ago`;
    if (diff < 86400000) return `${Math.floor(diff/3600000)}h ago`;
    return d.toLocaleDateString();
}

function escapeHtml(text) { const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }

document.getElementById('chat-input')?.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendComment(); }
});
</script>
