<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose Your Ideology | Nationhood Alpha</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #0e0e0c;
  --bg-1: #141412;
  --bg-2: #1a1a17;
  --bg-3: #1e1e1a;
  --bg-4: #24241f;
  --bg-5: #2c2c26;
  --bg-hover: #282822;
  --text-bright: #e2e0d6;
  --text-primary: #c4c2b8;
  --text-secondary: #8a8778;
  --text-muted: #6b6a5e;
  --text-dim: #4a4940;
  --text-ghost: #333229;
  --border-hair: rgba(255,255,255,0.04);
  --border-0: rgba(255,255,255,0.06);
  --border-1: rgba(255,255,255,0.08);
  --border-2: rgba(255,255,255,0.12);
  --green: #5cb85c;
  --green-faint: rgba(92,184,92,0.08);
  --green-border: rgba(92,184,92,0.18);
  --red: #d9534f;
  --red-faint: rgba(217,83,79,0.08);
  --red-border: rgba(217,83,79,0.18);
  --amber: #c8a64e;
  --amber-faint: rgba(200,166,78,0.08);
  --amber-border: rgba(200,166,78,0.18);
  --blue: #5b9bd5;
  --blue-faint: rgba(91,155,213,0.08);
  --blue-border: rgba(91,155,213,0.18);
  --purple: #8b7ec8;
  --purple-faint: rgba(139,126,200,0.08);
  --purple-border: rgba(139,126,200,0.18);
  --teal: #5aafa5;
  --teal-faint: rgba(90,175,165,0.08);
  --teal-border: rgba(90,175,165,0.18);
  --orange: #d48a3c;
  --orange-faint: rgba(212,138,60,0.08);
  --orange-border: rgba(212,138,60,0.18);
  --font-mono: 'JetBrains Mono', monospace;
  --font-ui: 'IBM Plex Sans', -apple-system, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg-0);
  color: var(--text-primary);
  font-family: var(--font-ui);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.page-header {
  text-align: center;
  padding: 48px 20px 12px;
  max-width: 640px;
}
.page-header h1 {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.page-header .title {
  font-family: var(--font-ui);
  font-size: 18px;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 6px;
}
.page-header .subtitle {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  line-height: 1.5;
}

.axes-container {
  width: 100%;
  max-width: 640px;
  padding: 0 16px 24px;
}

.axis-block {
  background: var(--bg-2);
  border: 1px solid var(--border-0);
  margin-bottom: 8px;
}
.axis-header {
  background: var(--bg-3);
  border-bottom: 1px solid var(--border-hair);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.axis-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--purple);
}
.axis-label {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.axis-body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  padding: 10px;
}
.ideo-card {
  background: var(--bg-3);
  border: 1px solid var(--border-0);
  padding: 10px 12px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.ideo-card:hover {
  background: var(--bg-hover);
  border-color: var(--border-1);
}
.ideo-card.selected {
  background: var(--blue-faint);
  border-color: var(--blue-border);
}
.ideo-card.disabled {
  opacity: 0.25;
  cursor: not-allowed;
  pointer-events: none;
}
.ideo-name {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.ideo-card.selected .ideo-name {
  /* color inherited from inline style per ideology */
}
.ideo-desc {
  font-family: var(--font-ui);
  font-size: 10px;
  color: var(--text-muted);
  line-height: 1.4;
}

.selection-bar {
  width: 100%;
  max-width: 640px;
  padding: 0 16px;
  margin-bottom: 16px;
}
.selection-inner {
  background: var(--bg-2);
  border: 1px solid var(--border-0);
  padding: 10px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sel-label {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.sel-tags {
  display: flex;
  gap: 6px;
}
.sel-tag {
  font-family: var(--font-mono);
  font-size: 8.5px;
  font-weight: 700;
  padding: 2px 8px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  background: var(--blue-faint);
  color: var(--blue);
  border: 1px solid var(--blue-border);
}
.sel-placeholder {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-dim);
}

.action-bar {
  width: 100%;
  max-width: 640px;
  padding: 0 16px 48px;
  display: flex;
  justify-content: flex-end;
}
.btn-next {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  padding: 7px 14px;
  background: var(--bg-3);
  border: 1px solid var(--border-0);
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.btn-next:hover:not(:disabled) {
  background: var(--bg-4);
  color: var(--text-secondary);
  border-color: var(--border-1);
}
.btn-next:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}
.btn-next.ready {
  background: var(--green-faint);
  color: var(--green);
  border-color: var(--green-border);
}
.btn-next.ready:hover {
  background: rgba(92,184,92,0.14);
}

.loading-msg {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  text-align: center;
  padding: 80px 20px;
}
</style>
</head>
<body>

<div id="loading" class="loading-msg">AUTHENTICATING...</div>

<div id="page-content" style="display:none; width:100%; display:none; flex-direction:column; align-items:center;">
  <div class="page-header">
    <h1>Step 2 of 3</h1>
    <div class="title">Define Your Political Identity</div>
    <div class="subtitle">Select exactly 2 ideologies from different axes. Each choice locks out its opposite. These will shape your party's platform and voter appeal.</div>
  </div>

  <div class="axes-container" id="axes-container"></div>

  <div class="selection-bar">
    <div class="selection-inner">
      <span class="sel-label">Selected</span>
      <div id="sel-tags" class="sel-tags">
        <span class="sel-placeholder">Pick 2 ideologies</span>
      </div>
    </div>
  </div>

  <div class="action-bar" style="display:flex;justify-content:space-between;">
    <button class="btn-next" style="background:var(--bg-3);color:var(--text-muted);" onclick="goBack()">&#x25C0; BACK</button>
    <button class="btn-next" id="btn-next" disabled onclick="proceed()">CONTINUE &#x25B6;</button>
  </div>
</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';

const AXES = [
  {
    key: 'liberty_equality',
    label: 'Liberty vs Equality',
    left: { name: 'Liberty', desc: 'Individual rights and minimal state interference. The state protects freedoms, not outcomes.' },
    right: { name: 'Equality', desc: 'Collective fairness through redistribution. The state ensures equal access to opportunity and resources.' }
  },
  {
    key: 'security_freedom',
    label: 'Security vs Freedom',
    left: { name: 'Security', desc: 'State protection through law enforcement, surveillance, and strong institutions. Safety over autonomy.' },
    right: { name: 'Freedom', desc: 'Personal autonomy and privacy. Minimal government intrusion into daily life.' }
  },
  {
    key: 'individualism_collectivism',
    label: 'Individualism vs Collectivism',
    left: { name: 'Individualism', desc: 'Self-reliance and private enterprise. Personal responsibility over collective obligation.' },
    right: { name: 'Collectivism', desc: 'Communal structures and shared institutions. Cooperative ownership and collective decision-making.' }
  },
  {
    key: 'tradition_progress',
    label: 'Tradition vs Progress',
    left: { name: 'Tradition', desc: 'Cultural continuity, religious values, and inherited social structures. Stability through preservation.' },
    right: { name: 'Progress', desc: 'Social reform, scientific advancement, and challenging outdated norms. Growth through change.' }
  },
  {
    key: 'globalism_nationalism',
    label: 'Globalism vs Nationalism',
    left: { name: 'Globalism', desc: 'International cooperation, open borders, and multilateral governance. Nations acting together.' },
    right: { name: 'Nationalism', desc: 'National sovereignty, cultural identity, and self-determination. The nation\'s interests first.' }
  }
];

const IDEOLOGY_COLORS = {
  'Liberty': '#3b82f6', 'Equality': '#ef4444',
  'Tradition': '#a855f7', 'Progress': '#22c55e',
  'Security': '#f59e0b', 'Freedom': '#06b6d4',
  'Globalism': '#14b8a6', 'Nationalism': '#f97316',
  'Individualism': '#eab308', 'Collectivism': '#ec4899'
};

let selected = []; // array of {name, axisKey}
let nationData = null;

async function init() {
  const { data: { user } } = await _supabase.auth.getUser();
  if (!user) { window.location.href = 'login.html'; return; }

  // Check if user already has a party
  const { data: faction } = await _supabase
    .from('factions').select('id, nation_id').eq('id', user.id).eq('faction_type', 'party').maybeSingle();
  if (faction && faction.nation_id) {
    window.location.href = 'dashboard.html';
    return;
  }

  // Load pending nation from sessionStorage (set by select-nation.html)
  const raw = sessionStorage.getItem('nationhood_pending_nation');
  if (!raw) {
    window.location.href = 'select-nation.html';
    return;
  }
  nationData = JSON.parse(raw);
  if (!nationData.id) {
    window.location.href = 'select-nation.html';
    return;
  }

  renderAxes();
  document.getElementById('loading').style.display = 'none';
  const content = document.getElementById('page-content');
  content.style.display = 'flex';
}

function renderAxes() {
  const container = document.getElementById('axes-container');
  container.innerHTML = AXES.map(axis => {
    const lColor = IDEOLOGY_COLORS[axis.left.name] || 'var(--text-bright)';
    const rColor = IDEOLOGY_COLORS[axis.right.name] || 'var(--text-bright)';
    return `
    <div class="axis-block">
      <div class="axis-header">
        <div class="axis-dot"></div>
        <span class="axis-label">${axis.label}</span>
      </div>
      <div class="axis-body">
        <div class="ideo-card" data-ideology="${axis.left.name}" data-opposite="${axis.right.name}" data-axis="${axis.key}" onclick="toggleIdeo(this)">
          <div class="ideo-name" style="color:${lColor}">${axis.left.name}</div>
          <div class="ideo-desc">${axis.left.desc}</div>
        </div>
        <div class="ideo-card" data-ideology="${axis.right.name}" data-opposite="${axis.left.name}" data-axis="${axis.key}" onclick="toggleIdeo(this)">
          <div class="ideo-name" style="color:${rColor}">${axis.right.name}</div>
          <div class="ideo-desc">${axis.right.desc}</div>
        </div>
      </div>
    </div>
  `}).join('');
}

function toggleIdeo(el) {
  if (el.classList.contains('disabled')) return;

  const ideology = el.dataset.ideology;
  const opposite = el.dataset.opposite;
  const axisKey = el.dataset.axis;

  if (el.classList.contains('selected')) {
    // Deselect
    el.classList.remove('selected');
    selected = selected.filter(s => s.name !== ideology);
    const opp = document.querySelector(`.ideo-card[data-ideology="${opposite}"]`);
    if (opp) opp.classList.remove('disabled');
  } else {
    if (selected.length >= 2) return;
    el.classList.add('selected');
    selected.push({ name: ideology, axisKey });
    const opp = document.querySelector(`.ideo-card[data-ideology="${opposite}"]`);
    if (opp) opp.classList.add('disabled');
  }

  updateUI();
}

function updateUI() {
  const tags = document.getElementById('sel-tags');
  if (selected.length === 0) {
    tags.innerHTML = '<span class="sel-placeholder">Pick 2 ideologies</span>';
  } else {
    tags.innerHTML = selected.map(s => {
      const c = IDEOLOGY_COLORS[s.name] || 'var(--blue)';
      return `<span class="sel-tag" style="color:${c};border-color:${c};background:${c}18">${s.name}</span>`;
    }).join('');
  }

  const btn = document.getElementById('btn-next');
  btn.disabled = selected.length !== 2;
  btn.classList.toggle('ready', selected.length === 2);
}

function proceed() {
  if (selected.length !== 2) return;
  const params = new URLSearchParams();
  params.set('ideology1', selected[0].name);
  params.set('ideology2', selected[1].name);
  window.location.href = 'createparty.html?' + params.toString();
}

function goBack() {
  window.location.href = 'select-nation.html';
}

init();

window.toggleIdeo = toggleIdeo;
window.proceed = proceed;
window.goBack = goBack;
</script>
</body>
</html>
