<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modifier Admin | Nationhood Alpha</title>
<style>
  :root {
    --bg:        #0d0d0d;
    --panel:    #141414;
    --panel-2:  #1a1a1a;
    --panel-3:  #252525;
    --border:   #333;
    --border-2: #444;
    --text:     #e0e0e0;
    --muted:    #888;
    --dim:      #666;

    /* Severity palette (matches the user-facing modifier page) */
    --sev-green:  #4ec98a;
    --sev-yellow: #c8a64e;
    --sev-red:    #d97070;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; }

  .admin-container { max-width: 1200px; margin: 0 auto; padding: 24px; }
  .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;
    border-bottom: 2px solid var(--sev-green); padding-bottom: 16px; }
  .admin-title { font-size: 1.6rem; color: var(--sev-green); font-weight: bold;
    text-transform: uppercase; letter-spacing: 2px; }
  .admin-subtitle { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
  .admin-actions { display: flex; gap: 10px; }

  .btn { padding: 10px 18px; border: none; border-radius: 6px; font-weight: bold; font-size: 0.82rem;
    cursor: pointer; transition: all 0.15s; text-transform: uppercase; letter-spacing: 0.5px; }
  .btn:hover { transform: translateY(-1px); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-primary { background: linear-gradient(135deg, var(--sev-green), #3a9468); color: #07140d; }
  .btn-primary:hover { box-shadow: 0 4px 12px rgba(78, 201, 138, 0.25); }
  .btn-danger { background: var(--sev-red); color: #fff; }
  .btn-ghost { background: var(--panel-3); color: #aaa; border: 1px solid var(--border-2); }
  .btn-ghost:hover { color: #fff; border-color: var(--dim); }
  .btn-small { padding: 6px 12px; font-size: 0.72rem; }
  .btn-icon { padding: 6px 10px; font-size: 0.85rem; background: none; border: 1px solid var(--border-2);
    color: var(--muted); border-radius: 4px; cursor: pointer; }
  .btn-icon:hover { color: var(--sev-red); border-color: var(--sev-red); }
  .btn-back { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.9rem;
    display: inline-flex; align-items: center; gap: 6px; margin-bottom: 16px; padding: 0; }
  .btn-back:hover { color: var(--sev-green); }

  .filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
  .filters input, .filters select { padding: 9px 12px; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 5px; color: var(--text); font-size: 0.85rem; }
  .filters input { flex: 1; min-width: 200px; }
  .filters input:focus, .filters select:focus { outline: none; border-color: var(--sev-green); }
  .mod-count { color: var(--muted); font-size: 0.82rem; margin-left: auto; }

  .mod-card { background: var(--panel-2); border-radius: 8px; padding: 14px 20px; margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center; cursor: pointer;
    transition: all 0.15s; border-left: 4px solid var(--border); }
  .mod-card:hover { background: #1f1f1f; transform: translateX(4px); }
  .mod-card[data-sev="green"]  { border-left-color: var(--sev-green); }
  .mod-card[data-sev="yellow"] { border-left-color: var(--sev-yellow); }
  .mod-card[data-sev="red"]    { border-left-color: var(--sev-red); }
  .mod-card.inactive { opacity: 0.45; }
  .mod-card-left { flex: 1; min-width: 0; }
  .mod-card-name { font-weight: bold; font-size: 0.98rem; margin-bottom: 4px; color: #fff; }
  .mod-card-meta { display: flex; gap: 10px; flex-wrap: wrap; font-size: 0.74rem;
    color: var(--muted); align-items: center; }

  .tag { display: inline-block; padding: 3px 9px; border-radius: 3px; font-size: 0.66rem;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .tag-cat     { background: #1a2030; color: #88a0c8; border: 1px solid #3a4868; }
  .tag-trig    { background: #2a1f1a; color: #d49a7a; border: 1px solid #6d4a30; }
  .tag-end     { background: #1a2a1a; color: var(--sev-green); border: 1px solid #3a6a4a; }
  .tag-fx      { background: #2a1a2a; color: #c87adc; border: 1px solid #6a3a6e; }
  .tag-sev-green   { background: rgba(78,201,138,0.12); color: var(--sev-green); }
  .tag-sev-yellow  { background: rgba(200,166,78,0.12); color: var(--sev-yellow); }
  .tag-sev-red     { background: rgba(217,112,112,0.12); color: var(--sev-red); }
  .tag-inactive    { background: var(--panel-2); color: var(--dim); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--dim); font-size: 0.9rem; }
  .empty-state-icon { font-size: 2rem; margin-bottom: 12px; opacity: 0.5; }

  .editor { background: var(--panel); border: 2px solid var(--border); border-radius: 12px; overflow: hidden; }
  .editor-header { background: var(--panel-2); padding: 18px 22px;
    border-bottom: 2px solid var(--sev-green); display: flex; justify-content: space-between; align-items: center; }
  .editor-title { font-size: 1.15rem; color: var(--sev-green); font-weight: bold;
    text-transform: uppercase; letter-spacing: 1px; }
  .editor-body { padding: 22px; }
  .editor-footer { padding: 16px 22px; background: var(--panel-2); border-top: 1px solid var(--border);
    display: flex; justify-content: flex-end; gap: 10px; }

  .form-row { display: grid; gap: 14px; margin-bottom: 14px; }
  .form-row.cols-2 { grid-template-columns: 1fr 1fr; }
  .form-row.cols-3 { grid-template-columns: 2fr 1fr 1fr; }
  .form-group { margin-bottom: 14px; }
  .form-label { display: block; font-size: 0.72rem; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; font-weight: bold; }
  .form-input, .form-select, .form-textarea { width: 100%; padding: 10px 12px; background: var(--panel-3);
    border: 1px solid var(--border-2); border-radius: 6px; color: var(--text); font-size: 0.88rem;
    font-family: inherit; }
  .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--sev-green); }
  .form-textarea { min-height: 70px; resize: vertical; }
  .form-hint { font-size: 0.72rem; color: var(--dim); margin-top: 4px; }

  .editor-section { background: var(--panel-2); border-radius: 8px; padding: 14px 18px;
    margin-bottom: 14px; border: 1px solid var(--border); }
  .editor-section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .editor-section-title { font-size: 0.84rem; font-weight: bold; text-transform: uppercase;
    letter-spacing: 1px; color: #cfcabf; }
  .editor-section-title.end { color: var(--sev-green); }

  .trigger-item, .end-trigger-item {
    display: grid; grid-template-columns: 1.6fr 1fr 1fr auto;
    gap: 8px; align-items: center; margin-bottom: 8px;
  }
  .effect-item { display: grid; grid-template-columns: 1fr auto; gap: 8px;
    align-items: center; margin-bottom: 8px; }

  .section-divider { text-align: center; color: var(--dim); font-size: 0.72rem;
    text-transform: uppercase; letter-spacing: 2px; margin: 14px 0; }
  .section-divider::before, .section-divider::after { content: ''; display: inline-block;
    width: 60px; height: 1px; background: var(--border); vertical-align: middle; margin: 0 12px; }

  /* Severity radio group */
  .sev-radio { display: flex; gap: 8px; }
  .sev-radio label { flex: 1; padding: 10px; text-align: center; background: var(--panel-3);
    border: 1px solid var(--border-2); border-radius: 6px; cursor: pointer; font-size: 0.78rem;
    text-transform: uppercase; letter-spacing: 1px; font-weight: bold; transition: all 0.15s; }
  .sev-radio input { display: none; }
  .sev-radio input + span { display: block; }
  .sev-radio label[data-sev="green"]:hover  { border-color: var(--sev-green); color: var(--sev-green); }
  .sev-radio label[data-sev="yellow"]:hover { border-color: var(--sev-yellow); color: var(--sev-yellow); }
  .sev-radio label[data-sev="red"]:hover    { border-color: var(--sev-red); color: var(--sev-red); }
  .sev-radio label.selected[data-sev="green"]  { background: rgba(78,201,138,0.14);
    border-color: var(--sev-green); color: var(--sev-green); }
  .sev-radio label.selected[data-sev="yellow"] { background: rgba(200,166,78,0.14);
    border-color: var(--sev-yellow); color: var(--sev-yellow); }
  .sev-radio label.selected[data-sev="red"]    { background: rgba(217,112,112,0.14);
    border-color: var(--sev-red); color: var(--sev-red); }

  /* Active toggle */
  .toggle-wrap { display: flex; gap: 12px; align-items: center; margin-top: 6px; }
  .toggle { position: relative; display: inline-block; width: 44px; height: 22px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider { position: absolute; cursor: pointer; inset: 0; background: var(--panel-3);
    border: 1px solid var(--border-2); border-radius: 22px; transition: 0.2s; }
  .toggle-slider::before { position: absolute; content: ""; height: 16px; width: 16px;
    left: 2px; top: 2px; background: var(--muted); border-radius: 50%; transition: 0.2s; }
  .toggle input:checked + .toggle-slider { background: rgba(78,201,138,0.2); border-color: var(--sev-green); }
  .toggle input:checked + .toggle-slider::before { transform: translateX(22px); background: var(--sev-green); }
  .toggle-label { font-size: 0.82rem; color: var(--muted); }

  .loading-container { display: flex; flex-direction: column; align-items: center; padding: 80px 20px;
    color: var(--muted); }
  .loading-spinner { width: 32px; height: 32px; border: 3px solid var(--border);
    border-top-color: var(--sev-green); border-radius: 50%; animation: spin 0.8s linear infinite;
    margin-bottom: 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 700px) {
    .admin-container { padding: 14px; }
    .admin-header { flex-direction: column; align-items: flex-start; gap: 12px; }
    .form-row.cols-2, .form-row.cols-3 { grid-template-columns: 1fr; }
    .trigger-item, .end-trigger-item { grid-template-columns: 1fr; }
    .mod-card { flex-direction: column; align-items: flex-start; gap: 10px; }
  }
</style>
</head>
<body>
<div class="admin-container" id="content-area">
  <div class="loading-container"><div class="loading-spinner"></div><div>Loading modifiers...</div></div>
</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { escapeHtml, escapeAttr } from './js/utils.js';

// ════════════════════════════════════════════════════════════════════
// State
// ════════════════════════════════════════════════════════════════════
let allModifiers = [];
let current = null;
let isNew = false;
let editorTriggers = [];
let editorEndTriggers = [];
let editorEffects = [];        // free-text label strings (TEXT[] column)
let deletedTriggerIds = [];
let deletedEndTriggerIds = [];

// ════════════════════════════════════════════════════════════════════
// Constants
// ════════════════════════════════════════════════════════════════════
// Must match the CHECK constraint on modifier_templates.category
// (sql/migrations/20270384_modifier_tables.sql).
const CATEGORIES = [
  'Economy', 'Standard of Living', 'Public Order', 'Industry & Resources',
  'Workforce', 'Military', 'Politics', 'Diplomacy',
];

const SEVERITIES = [
  { key: 'green',  label: 'Green'  },
  { key: 'yellow', label: 'Yellow' },
  { key: 'red',    label: 'Red'    },
];

// Triggerable nation stats. Politician-system stats come first — every
// stat in the canonical politician list (politician_stability /
// politician_gdp / politician_gdp_growth / politician_budget /
// politician_debt / politician_civil_freedoms) is exposed under its
// canonical politician label, plus the legacy 0-100 columns the
// politician system inherits unchanged (health / education /
// infrastructure / industry as Manufacturing Sector / skilled_workers /
// service_sector / income_tax / corporate_tax / wages / crime /
// corruption / energy / minerals / standard_of_living / cost_of_living).
//
// Legacy section below carries the parties-side stats that aren't in
// the politician canonical list (unrest, public_approval, crown_authority,
// state_apparatus, immigration, farmland, unskilled_workers, inequality,
// global_image) so any modifier_templates created before the politician
// fork still edit cleanly. They can be pruned once the parties surface
// is fully retired.
//
// Not yet exposed (the canonical list calls them out but no backing
// column / tick math exists yet): Energy Generation, Food (on hand),
// Food Generation, Mineral Generation, Consumer Goods, Goods Generation,
// Luxury Goods, Luxury Generation, Population Growth. Adding them as
// inert dropdown entries would silently produce never-firing triggers,
// so they're held back until the schema + tick processor catch up.
const NATION_STATS = [
  // ── Politician headline (politician_* columns) ─────────────────────
  { key: 'politician_stability',      label: 'Stability' },
  { key: 'politician_gdp',            label: 'GDP' },
  { key: 'politician_gdp_growth',     label: 'GDP Growth' },
  { key: 'politician_budget',         label: 'Budget' },
  { key: 'politician_debt',           label: 'Debt' },
  { key: 'politician_civil_freedoms', label: 'Civil Liberties' },
  // ── Wellbeing & services ───────────────────────────────────────────
  { key: 'health',             label: 'Health' },
  { key: 'education',          label: 'Education' },
  { key: 'standard_of_living', label: 'Standard of Living' },
  { key: 'cost_of_living',     label: 'Cost of Living' },
  // ── Economy (labels follow the politician canonical list) ──────────
  { key: 'infrastructure',  label: 'Infrastructure' },
  { key: 'industry',        label: 'Manufacturing Sector' },
  { key: 'skilled_workers', label: 'Skilled Workers' },
  { key: 'service_sector',  label: 'Service Sector' },
  { key: 'wages',           label: 'Wages' },
  { key: 'energy',          label: 'Energy (on hand)' },
  { key: 'minerals',        label: 'Minerals (on hand)' },
  // ── Fiscal ─────────────────────────────────────────────────────────
  { key: 'income_tax',    label: 'Income Tax' },
  { key: 'corporate_tax', label: 'Corporate Tax' },
  // ── Society ────────────────────────────────────────────────────────
  { key: 'crime',      label: 'Crime' },
  { key: 'corruption', label: 'Corruption' },
  // ── Legacy parties-side columns (kept so older modifier_templates
  //    that reference them still edit; prune after parties is retired)
  { key: 'budget',            label: 'Budget (legacy)' },
  { key: 'debt',              label: 'Debt (legacy)' },
  { key: 'gdp',               label: 'GDP (legacy)' },
  { key: 'gdp_growth',        label: 'GDP Growth (legacy)' },
  { key: 'unrest',            label: 'Unrest (legacy)' },
  { key: 'public_approval',   label: 'Public Approval (legacy)' },
  { key: 'crown_authority',   label: 'Crown Authority (legacy)' },
  { key: 'state_apparatus',   label: 'State Apparatus (legacy)' },
  { key: 'immigration',       label: 'Immigration (legacy)' },
  { key: 'farmland',          label: 'Farmland (legacy)' },
  { key: 'unskilled_workers', label: 'Unskilled Workers (legacy)' },
  { key: 'inequality',        label: 'Inequality (legacy)' },
  { key: 'global_image',      label: 'Global Image (legacy)' },
];

const TRIGGER_OPERATORS = [
  { key: 'gte', label: '>= (at or above)' },
  { key: 'lte', label: '<= (at or below)' },
];

// ════════════════════════════════════════════════════════════════════
// Bootstrap
// ════════════════════════════════════════════════════════════════════
(async function init() {
  await loadAll();
  renderListView();
})();

async function loadAll() {
  const r = await _supabase
    .from('modifier_templates')
    .select('*, modifier_triggers(*), modifier_end_triggers(*)')
    .order('category', { ascending: true })
    .order('name',     { ascending: true });
  if (r.error) {
    console.error('loadAll error:', r.error);
    allModifiers = [];
    return;
  }
  allModifiers = r.data || [];
}

// ════════════════════════════════════════════════════════════════════
// List view
// ════════════════════════════════════════════════════════════════════
function renderListView() {
  current = null;
  const c = document.getElementById('content-area');
  c.innerHTML =
    `<div class="admin-header"><div>` +
      `<div class="admin-title">National Modifiers</div>` +
      `<div class="admin-subtitle">Characterizing situations a nation can be in — Green / Yellow / Red, surfaced when triggers match.</div>` +
    `</div><div class="admin-actions">` +
      `<button class="btn btn-primary" id="btn-new">+ New Modifier</button>` +
    `</div></div>` +
    `<div class="filters">` +
      `<input type="text" id="f-search" placeholder="Search by name or description...">` +
      `<select id="f-category"><option value="">All Categories</option>` +
        CATEGORIES.map(cat => `<option value="${escapeAttr(cat)}">${escapeHtml(cat)}</option>`).join('') +
      `</select>` +
      `<select id="f-severity"><option value="">All Severity</option>` +
        SEVERITIES.map(s => `<option value="${s.key}">${s.label}</option>`).join('') +
      `</select>` +
      `<span class="mod-count" id="mod-count">${allModifiers.length} modifier${allModifiers.length === 1 ? '' : 's'}</span>` +
    `</div>` +
    `<div id="mod-list"></div>`;

  document.getElementById('btn-new').onclick = createNew;
  ['f-search', 'f-category', 'f-severity'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener(id === 'f-search' ? 'input' : 'change', applyFilters);
  });
  renderModList(allModifiers);
}

function renderModList(mods) {
  const c = document.getElementById('mod-list');
  if (!mods.length) {
    c.innerHTML =
      `<div class="empty-state">` +
        `<div class="empty-state-icon">○</div>` +
        `No modifiers yet. Click <strong>+ New Modifier</strong> to build one.` +
      `</div>`;
    return;
  }
  c.innerHTML = mods.map(m => {
    const trigN = (m.modifier_triggers || []).length;
    const endN  = (m.modifier_end_triggers || []).length;
    const fxN   = (m.effects || []).length;
    const sev   = m.severity || 'green';
    const desc  = (m.description || '').slice(0, 90);
    return (
      `<div class="mod-card ${m.is_active ? '' : 'inactive'}" data-sev="${sev}" data-id="${escapeAttr(m.id)}">` +
        `<div class="mod-card-left">` +
          `<div class="mod-card-name">${escapeHtml(m.name)}</div>` +
          `<div class="mod-card-meta">` +
            `<span class="tag tag-sev-${sev}">${sev.toUpperCase()}</span>` +
            `<span class="tag tag-cat">${escapeHtml(m.category)}</span>` +
            `<span class="tag tag-trig">${trigN} trigger${trigN === 1 ? '' : 's'}</span>` +
            `<span class="tag tag-end">${endN} end</span>` +
            `<span class="tag tag-fx">${fxN} effect${fxN === 1 ? '' : 's'}</span>` +
            (m.is_active ? '' : `<span class="tag tag-inactive">INACTIVE</span>`) +
            (desc ? `<span style="color:var(--dim);">${escapeHtml(desc)}${(m.description || '').length > 90 ? '…' : ''}</span>` : '') +
          `</div>` +
        `</div>` +
      `</div>`
    );
  }).join('');
  c.querySelectorAll('.mod-card').forEach(card => {
    card.addEventListener('click', () => editModifier(card.dataset.id));
  });
}

function applyFilters() {
  const q   = (document.getElementById('f-search').value || '').toLowerCase();
  const cat = document.getElementById('f-category').value;
  const sev = document.getElementById('f-severity').value;
  const filtered = allModifiers.filter(m => {
    if (q   && m.name.toLowerCase().indexOf(q) === -1 &&
              (m.description || '').toLowerCase().indexOf(q) === -1) return false;
    if (cat && m.category !== cat) return false;
    if (sev && m.severity !== sev) return false;
    return true;
  });
  document.getElementById('mod-count').textContent =
    `${filtered.length} modifier${filtered.length === 1 ? '' : 's'}`;
  renderModList(filtered);
}

// ════════════════════════════════════════════════════════════════════
// Create / edit
// ════════════════════════════════════════════════════════════════════
function createNew() {
  isNew = true;
  current = { name: '', category: CATEGORIES[0], severity: 'green',
              description: '', is_active: true };
  editorTriggers = [];
  editorEndTriggers = [];
  editorEffects = [];
  deletedTriggerIds = [];
  deletedEndTriggerIds = [];
  renderEditor();
}

function editModifier(id) {
  const m = allModifiers.find(x => x.id === id);
  if (!m) return;
  isNew = false;
  current = { ...m };
  editorTriggers    = (m.modifier_triggers || [])
    .map(t => ({ ...t, isNew: false }));
  editorEndTriggers = (m.modifier_end_triggers || [])
    .map(t => ({ ...t, isNew: false }));
  editorEffects     = [...(m.effects || [])];
  deletedTriggerIds = [];
  deletedEndTriggerIds = [];
  renderEditor();
}

// ════════════════════════════════════════════════════════════════════
// Editor
// ════════════════════════════════════════════════════════════════════
function renderEditor() {
  const title = isNew ? 'Create New Modifier' : 'Edit Modifier';
  const c = document.getElementById('content-area');
  c.innerHTML =
    `<button class="btn-back" id="btn-back">&larr; Back to Modifiers</button>` +
    `<div class="editor">` +
      `<div class="editor-header"><div class="editor-title">${title}</div>` +
        (!isNew
          ? `<button class="btn btn-danger btn-small" id="btn-delete">Delete</button>`
          : ''
        ) +
      `</div>` +
      `<div class="editor-body">` +
        // Name + Active
        `<div class="form-row cols-2">` +
          `<div class="form-group"><label class="form-label">Name</label>` +
            `<input type="text" class="form-input" id="m-name" ` +
              `value="${escapeAttr(current.name || '')}" ` +
              `placeholder="e.g., Booming Economy">` +
          `</div>` +
          `<div class="form-group"><label class="form-label">Status</label>` +
            `<div class="toggle-wrap">` +
              `<label class="toggle"><input type="checkbox" id="m-active" ` +
                `${current.is_active ? 'checked' : ''}>` +
                `<span class="toggle-slider"></span></label>` +
              `<span class="toggle-label" id="m-active-label">` +
                `${current.is_active ? 'Active' : 'Inactive'}</span>` +
            `</div>` +
            `<div class="form-hint">Inactive modifiers stay on file but won't surface on nation pages.</div>` +
          `</div>` +
        `</div>` +

        // Category + Severity
        `<div class="form-row cols-2">` +
          `<div class="form-group"><label class="form-label">Category</label>` +
            `<select class="form-select" id="m-category">` +
              CATEGORIES.map(cat =>
                `<option value="${escapeAttr(cat)}"${current.category === cat ? ' selected' : ''}>` +
                `${escapeHtml(cat)}</option>`
              ).join('') +
            `</select>` +
          `</div>` +
          `<div class="form-group"><label class="form-label">Severity</label>` +
            `<div class="sev-radio" id="m-severity">` +
              SEVERITIES.map(s =>
                `<label data-sev="${s.key}" class="${current.severity === s.key ? 'selected' : ''}">` +
                  `<input type="radio" name="sev" value="${s.key}" ` +
                    `${current.severity === s.key ? 'checked' : ''}>` +
                  `<span>${s.label}</span>` +
                `</label>`
              ).join('') +
            `</div>` +
          `</div>` +
        `</div>` +

        // Description
        `<div class="form-group"><label class="form-label">Description</label>` +
          `<textarea class="form-textarea" id="m-description" ` +
            `placeholder="What is true about a nation under this modifier? Italic flavor prose shown on the modifier card.">` +
            `${escapeHtml(current.description || '')}</textarea>` +
        `</div>` +

        // Effects (free-text label chips)
        `<div class="editor-section">` +
          `<div class="editor-section-header">` +
            `<div class="editor-section-title">Current Effects (Labels)</div>` +
            `<button class="btn btn-ghost btn-small" id="btn-add-effect">+ Add Effect</button>` +
          `</div>` +
          `<div class="form-hint" style="margin-bottom:12px;">Free-text descriptive chips. ` +
            `These are flavor labels only — they don't apply per-tick stat changes.</div>` +
          `<div id="effects-list">${renderEffects()}</div>` +
        `</div>` +

        // Activation triggers
        `<div class="editor-section">` +
          `<div class="editor-section-header">` +
            `<div class="editor-section-title">Activation Triggers</div>` +
            `<button class="btn btn-ghost btn-small" id="btn-add-trigger">+ Add Trigger</button>` +
          `</div>` +
          `<div class="form-hint" style="margin-bottom:12px;">ALL conditions must be met for the modifier to surface on a nation.</div>` +
          `<div id="triggers-list">${renderTriggers()}</div>` +
        `</div>` +

        `<div class="section-divider">modifier ends when</div>` +

        // End triggers
        `<div class="editor-section">` +
          `<div class="editor-section-header">` +
            `<div class="editor-section-title end">End Conditions</div>` +
            `<button class="btn btn-ghost btn-small" id="btn-add-end">+ Add Condition</button>` +
          `</div>` +
          `<div class="form-hint" style="margin-bottom:12px;">Conditions that take the modifier off. ` +
            `Use hysteresis (e.g. trigger at GDP &gt;= 6, end at GDP &lt;= 3) so it doesn't flicker.</div>` +
          `<div id="end-triggers-list">${renderEndTriggers()}</div>` +
        `</div>` +

      `</div>` +
      `<div class="editor-footer">` +
        `<button class="btn btn-ghost" id="btn-cancel">Cancel</button>` +
        `<button class="btn btn-primary" id="btn-save">Save Modifier</button>` +
      `</div>` +
    `</div>`;

  // Wire static buttons
  document.getElementById('btn-back').onclick   = renderListView;
  document.getElementById('btn-cancel').onclick = renderListView;
  document.getElementById('btn-save').onclick   = saveModifier;
  document.getElementById('btn-add-trigger').onclick = addTrigger;
  document.getElementById('btn-add-end').onclick     = addEndTrigger;
  document.getElementById('btn-add-effect').onclick  = addEffect;
  if (!isNew) {
    document.getElementById('btn-delete').onclick = () => deleteModifier(current.id);
  }

  // Active toggle label
  const a = document.getElementById('m-active');
  a.onchange = () => {
    document.getElementById('m-active-label').textContent = a.checked ? 'Active' : 'Inactive';
  };

  // Severity radio selection styling
  document.getElementById('m-severity')
    .querySelectorAll('label')
    .forEach(lab => {
      lab.onclick = () => {
        document.getElementById('m-severity').querySelectorAll('label')
          .forEach(l => l.classList.remove('selected'));
        lab.classList.add('selected');
      };
    });

  bindDynamicLists();
}

function bindDynamicLists() {
  // Triggers
  document.querySelectorAll('#triggers-list [data-i]').forEach(row => {
    const i = Number(row.dataset.i);
    const sel = row.querySelector('.sel-stat');
    const op  = row.querySelector('.sel-op');
    const th  = row.querySelector('.in-th');
    const rm  = row.querySelector('.btn-rm');
    if (sel) sel.onchange = () => { editorTriggers[i].stat_key = sel.value; };
    if (op)  op.onchange  = () => { editorTriggers[i].operator = op.value;  };
    if (th)  th.onchange  = () => { editorTriggers[i].threshold = Number(th.value); };
    if (rm)  rm.onclick   = () => removeTrigger(i);
  });
  // End triggers
  document.querySelectorAll('#end-triggers-list [data-i]').forEach(row => {
    const i = Number(row.dataset.i);
    const sel = row.querySelector('.sel-stat');
    const op  = row.querySelector('.sel-op');
    const th  = row.querySelector('.in-th');
    const rm  = row.querySelector('.btn-rm');
    if (sel) sel.onchange = () => { editorEndTriggers[i].stat_key = sel.value; };
    if (op)  op.onchange  = () => { editorEndTriggers[i].operator = op.value;  };
    if (th)  th.onchange  = () => { editorEndTriggers[i].threshold = Number(th.value); };
    if (rm)  rm.onclick   = () => removeEndTrigger(i);
  });
  // Effects (single text input per row)
  document.querySelectorAll('#effects-list [data-i]').forEach(row => {
    const i = Number(row.dataset.i);
    const txt = row.querySelector('.in-fx');
    const rm  = row.querySelector('.btn-rm');
    if (txt) txt.oninput = () => { editorEffects[i] = txt.value; };
    if (rm)  rm.onclick  = () => removeEffect(i);
  });
}

// ════════════════════════════════════════════════════════════════════
// Trigger rendering
// ════════════════════════════════════════════════════════════════════
function renderTriggers() {
  if (!editorTriggers.length) {
    return `<div class="empty-state" style="padding:12px;">No activation triggers. Add at least one.</div>`;
  }
  return editorTriggers.map((t, i) => triggerRow(t, i, 'gte')).join('');
}

function renderEndTriggers() {
  if (!editorEndTriggers.length) {
    return `<div class="empty-state" style="padding:12px;">No end conditions yet.</div>`;
  }
  return editorEndTriggers.map((t, i) => triggerRow(t, i, 'lte')).join('');
}

function triggerRow(t, i, defaultOp) {
  const op = t.operator || defaultOp;
  const th = (t.threshold != null) ? t.threshold : 0;
  return (
    `<div class="trigger-item" data-i="${i}">` +
      `<select class="form-select sel-stat"><option value="">-- Select Stat --</option>` +
        NATION_STATS.map(s =>
          `<option value="${s.key}"${t.stat_key === s.key ? ' selected' : ''}>${s.label}</option>`
        ).join('') +
      `</select>` +
      `<select class="form-select sel-op">` +
        TRIGGER_OPERATORS.map(o =>
          `<option value="${o.key}"${op === o.key ? ' selected' : ''}>${o.label}</option>`
        ).join('') +
      `</select>` +
      `<input type="number" class="form-input in-th" value="${th}" step="0.1" placeholder="Threshold">` +
      `<button class="btn-icon btn-rm" title="Remove">&times;</button>` +
    `</div>`
  );
}

function addTrigger() {
  editorTriggers.push({ id: null, stat_key: '', operator: 'gte', threshold: 0, isNew: true });
  document.getElementById('triggers-list').innerHTML = renderTriggers();
  bindDynamicLists();
}

function removeTrigger(i) {
  const t = editorTriggers[i];
  if (t && t.id && !t.isNew) deletedTriggerIds.push(t.id);
  editorTriggers.splice(i, 1);
  document.getElementById('triggers-list').innerHTML = renderTriggers();
  bindDynamicLists();
}

function addEndTrigger() {
  editorEndTriggers.push({ id: null, stat_key: '', operator: 'lte', threshold: 0, isNew: true });
  document.getElementById('end-triggers-list').innerHTML = renderEndTriggers();
  bindDynamicLists();
}

function removeEndTrigger(i) {
  const t = editorEndTriggers[i];
  if (t && t.id && !t.isNew) deletedEndTriggerIds.push(t.id);
  editorEndTriggers.splice(i, 1);
  document.getElementById('end-triggers-list').innerHTML = renderEndTriggers();
  bindDynamicLists();
}

// ════════════════════════════════════════════════════════════════════
// Effects rendering (free-text label chips)
// ════════════════════════════════════════════════════════════════════
function renderEffects() {
  if (!editorEffects.length) {
    return `<div class="empty-state" style="padding:12px;">No effect labels yet.</div>`;
  }
  return editorEffects.map((label, i) =>
    `<div class="effect-item" data-i="${i}">` +
      `<input type="text" class="form-input in-fx" value="${escapeAttr(label || '')}" ` +
        `placeholder="e.g., + foreign investment from non-democracies">` +
      `<button class="btn-icon btn-rm" title="Remove">&times;</button>` +
    `</div>`
  ).join('');
}

function addEffect() {
  editorEffects.push('');
  document.getElementById('effects-list').innerHTML = renderEffects();
  bindDynamicLists();
}

function removeEffect(i) {
  editorEffects.splice(i, 1);
  document.getElementById('effects-list').innerHTML = renderEffects();
  bindDynamicLists();
}

// ════════════════════════════════════════════════════════════════════
// Sync form → state
// ════════════════════════════════════════════════════════════════════
function syncForm() {
  current.name        = (document.getElementById('m-name').value || '').trim();
  current.description = document.getElementById('m-description').value || '';
  current.is_active   = document.getElementById('m-active').checked;
  current.category    = document.getElementById('m-category').value;
  const sev = document.querySelector('#m-severity input:checked');
  current.severity    = sev ? sev.value : 'green';
}

// ════════════════════════════════════════════════════════════════════
// Save
// ════════════════════════════════════════════════════════════════════
async function saveModifier() {
  syncForm();

  if (!current.name) { alert('Name is required.'); return; }
  if (!CATEGORIES.includes(current.category)) { alert('Pick a category.'); return; }
  if (!['green', 'yellow', 'red'].includes(current.severity)) { alert('Pick a severity.'); return; }

  const validTriggers    = editorTriggers.filter(t => t.stat_key);
  const validEndTriggers = editorEndTriggers.filter(t => t.stat_key);
  const validEffects     = editorEffects.map(s => (s || '').trim()).filter(s => s);

  if (!validTriggers.length) { alert('Add at least one activation trigger.'); return; }

  const payload = {
    name:        current.name,
    category:    current.category,
    severity:    current.severity,
    description: current.description.trim(),
    effects:     validEffects,
    is_active:   current.is_active,
  };

  try {
    let modifierId;
    if (isNew) {
      const r = await _supabase.from('modifier_templates').insert(payload).select().single();
      if (r.error) throw r.error;
      modifierId = r.data.id;
    } else {
      modifierId = current.id;
      const r = await _supabase.from('modifier_templates')
        .update(payload).eq('id', modifierId).select().single();
      if (r.error) throw r.error;
      if (!r.data) {
        throw new Error('Update returned no rows. The modifier may have been deleted, ' +
                        'or RLS is blocking the update.');
      }
    }

    if (deletedTriggerIds.length) {
      await _supabase.from('modifier_triggers').delete().in('id', deletedTriggerIds);
    }
    if (deletedEndTriggerIds.length) {
      await _supabase.from('modifier_end_triggers').delete().in('id', deletedEndTriggerIds);
    }

    for (const t of validTriggers) {
      const tp = { modifier_id: modifierId, stat_key: t.stat_key,
                   operator: t.operator, threshold: t.threshold };
      if (t.isNew || !t.id) await _supabase.from('modifier_triggers').insert(tp);
      else                  await _supabase.from('modifier_triggers').update(tp).eq('id', t.id);
    }
    for (const t of validEndTriggers) {
      const tp = { modifier_id: modifierId, stat_key: t.stat_key,
                   operator: t.operator, threshold: t.threshold };
      if (t.isNew || !t.id) await _supabase.from('modifier_end_triggers').insert(tp);
      else                  await _supabase.from('modifier_end_triggers').update(tp).eq('id', t.id);
    }

    alert(isNew ? 'Modifier created.' : 'Modifier saved.');
    await loadAll();
    renderListView();
  } catch (err) {
    console.error('Save error:', err);
    alert('Error: ' + err.message);
  }
}

// ════════════════════════════════════════════════════════════════════
// Delete
// ════════════════════════════════════════════════════════════════════
async function deleteModifier(id) {
  if (!confirm('Delete this modifier and all its triggers? This cannot be undone.')) return;
  try {
    const r = await _supabase.from('modifier_templates').delete().eq('id', id).select();
    if (r.error) throw r.error;
    if (!r.data || r.data.length === 0) {
      throw new Error('No rows deleted — likely a missing DELETE policy on modifier_templates.');
    }
    alert('Modifier deleted.');
    await loadAll();
    renderListView();
  } catch (err) {
    console.error('Delete error:', err);
    alert('Error: ' + err.message);
  }
}
</script>
