<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Army Procurement | Nationhood Alpha</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #0e0e0c; --bg-2: #1a1a17; --bg-card: #1a1a17;
  --text-bright: #f0efe6; --text-primary: #c4c2b8; --text-secondary: #888;
  --text-dim: #4a4940; --border-0: rgba(255,255,255,0.06);
  --border-1: rgba(255,255,255,0.08); --army: #b6533f;
  --font-mono: 'JetBrains Mono', monospace; --font-sans: 'IBM Plex Sans', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg-0); color: var(--text-primary); font-family: var(--font-sans); }
.ap-wrap { max-width: 1160px; margin: 0 auto; padding: 22px 24px 60px; }
.ap-head { padding-bottom: 14px; border-bottom: 1px solid var(--border-1); margin-bottom: 22px; }
.ap-head__eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.22em;
  color: var(--army); font-weight: 700; text-transform: uppercase; }
.ap-head__title { font-size: 24px; font-weight: 700; color: var(--text-bright); margin-top: 6px; }
.ap-head__faction { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); margin-top: 6px; }
.ap-section { margin-bottom: 30px; }
.ap-section__head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  padding-bottom: 10px; border-bottom: 1px solid var(--border-0); margin-bottom: 14px; }
.ap-section__num { font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--army); }
.ap-section__title { font-size: 15px; font-weight: 600; color: var(--text-bright);
  text-transform: uppercase; letter-spacing: 0.04em; }
.ap-section__meta { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em;
  color: var(--text-dim); text-transform: uppercase; margin-left: auto; }
.ap-cat { background: var(--bg-card); border: 1px solid var(--border-0); }
.ap-cat__row { display: grid; grid-template-columns: 1fr 120px 150px 110px 120px;
  align-items: center; gap: 14px; padding: 16px 18px; width: 100%; text-align: left;
  background: none; border: 0; color: inherit; font: inherit; cursor: pointer;
  transition: background .12s; }
.ap-cat__row:hover { background: rgba(255,255,255,0.02); }
.ap-cat__name { font-size: 15px; font-weight: 700; color: var(--text-bright);
  letter-spacing: 0.02em; }
.ap-cat__sub { font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary);
  margin-top: 3px; text-transform: uppercase; letter-spacing: 0.08em; }
.ap-stat__label { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.12em;
  color: var(--text-dim); text-transform: uppercase; }
.ap-stat__value { font-size: 16px; font-weight: 600; color: var(--text-primary); margin-top: 3px; }
.ap-stat__value.is-dim { color: var(--text-dim); }
.ap-pill { justify-self: end; font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase; padding: 5px 10px; border: 1px solid;
  border-radius: 2px; }
.ap-pill--none { color: var(--text-dim); border-color: var(--border-1); }
.ap-cat__chev { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim);
  transition: transform .15s; }
.ap-cat.is-open .ap-cat__chev { transform: rotate(90deg); }
.ap-cat__body { display: none; border-top: 1px solid var(--border-0);
  padding: 16px 18px; }
.ap-cat.is-open .ap-cat__body { display: block; }
.ap-variant { display: grid; grid-template-columns: 1fr 120px 1fr;
  align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--border-0); }
.ap-variant:last-child { border-bottom: 0; }
.ap-variant__name { font-size: 13px; font-weight: 600; color: var(--text-bright); }
.ap-variant__tag { font-family: var(--font-mono); font-size: 9px; color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }
.ap-variant__qty { font-family: var(--font-mono); font-size: 13px; color: var(--text-primary); }
.ap-variant__cap { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.08em;
  color: var(--text-dim); text-transform: uppercase; margin-top: 4px; }
.ap-qbar { height: 6px; background: rgba(255,255,255,0.05); position: relative; }
.ap-qbar__fill { position: absolute; inset: 0 auto 0 0; background: var(--army); }
.ap-empty { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim);
  padding: 22px; text-align: center; background: var(--bg-card);
  border: 1px solid var(--border-0); }
.ap-loading { padding: 60px; text-align: center; font-family: var(--font-mono);
  font-size: 12px; color: var(--text-dim); }

/* — World Market — */
.wm-offer { display: grid; grid-template-columns: 1fr 64px 96px 120px 96px 92px;
  align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border-0); }
.wm-offer:last-child { border-bottom: 0; }
.wm-flag { width: 30px; height: 20px; object-fit: cover; border-radius: 2px;
  border: 0.5px solid var(--border-1); margin-top: 4px; display: block; }
.wm-flag--fallback { background: #1a1a17; }
.wm-offer__name { font-size: 13px; font-weight: 600; color: var(--text-bright); }
.wm-offer__tag { font-family: var(--font-mono); font-size: 9px; color: var(--text-secondary);
  text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }
.wm-col__l { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.12em;
  color: var(--text-dim); text-transform: uppercase; }
.wm-col__v { font-size: 14px; color: var(--text-primary); margin-top: 3px; }
.wm-col__v.is-dim { color: var(--text-dim); }
.wm-buy { justify-self: end; font-family: var(--font-mono); font-size: 11px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase; padding: 8px 16px; border: 1px solid var(--army);
  border-radius: 2px; background: rgba(182,83,63,0.12); color: #e0a090; cursor: pointer; transition: background .12s; }
.wm-buy:hover { background: rgba(182,83,63,0.25); }
.wm-buy:disabled { color: var(--text-dim); border-color: var(--border-1); background: none; cursor: default; }

/* Buy modal */
.wm-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.66);
  align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
.wm-modal { width: 100%; max-width: 440px; background: var(--bg-2); border: 1px solid var(--border-1);
  border-radius: 6px; overflow: hidden; }
.wm-modal__head { display: flex; align-items: flex-start; justify-content: space-between;
  padding: 18px 20px; border-bottom: 1px solid var(--border-0); }
.wm-modal__eyebrow { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em;
  color: var(--army); font-weight: 700; text-transform: uppercase; }
.wm-modal__title { font-size: 18px; font-weight: 700; color: var(--text-bright); margin-top: 4px; }
.wm-modal__sub { font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); margin-top: 4px; }
.wm-x { font-size: 22px; color: var(--text-dim); cursor: pointer; line-height: 1; padding: 2px 6px; }
.wm-x:hover { color: var(--text-bright); }
.wm-modal__body { padding: 18px 20px; }
.wm-qty { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
.wm-qty__l { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em;
  color: var(--text-secondary); text-transform: uppercase; }
.wm-qty input { width: 120px; background: var(--bg-0); border: 1px solid var(--border-1); border-radius: 3px;
  color: var(--text-bright); font-family: var(--font-mono); font-size: 15px; padding: 8px 10px; text-align: right; }
.wm-sum { display: grid; grid-template-columns: repeat(2,1fr); gap: 14px; background: var(--bg-0);
  border: 1px solid var(--border-0); border-radius: 4px; padding: 14px 16px; }
.wm-sum__l { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.12em;
  color: var(--text-dim); text-transform: uppercase; }
.wm-sum__v { font-size: 17px; font-weight: 600; color: var(--text-primary); margin-top: 4px; }
.wm-sum__v.gold { color: #d4b87a; }
.wm-sum__v.warn { color: #c47a7a; }
.wm-err { margin-top: 14px; font-family: var(--font-mono); font-size: 11px; color: #c47a7a;
  background: rgba(196,122,122,0.1); border: 1px solid rgba(196,122,122,0.3); border-radius: 3px; padding: 9px 12px; }
.wm-modal__foot { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 20px;
  border-top: 1px solid var(--border-0); background: var(--bg-0); }
.wm-btn { font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: 0.06em;
  padding: 9px 18px; border-radius: 3px; cursor: pointer; border: 1px solid; }
.wm-btn.ghost { background: none; border-color: var(--border-1); color: var(--text-secondary); }
.wm-btn.ghost:hover { color: var(--text-bright); }
.wm-btn.buy { background: var(--army); border-color: var(--army); color: #fff; }
.wm-btn.buy:hover { filter: brightness(1.1); }
.wm-btn.buy:disabled { background: none; border-color: var(--border-1); color: var(--text-dim); cursor: default; }
</style>
</head>
<body>
  <div id="mil-topbar-host"></div>
  <div class="ap-wrap" id="ap-root">
    <div class="ap-loading">Loading procurement…</div>
  </div>

<script type="module">
import { bootstrapArmyPage } from './js/army-page.js';
import { _supabase } from './js/supabase-client.js';
import { auMoney } from './js/create-unit.js'; // shared army money formatter ($1 = $1M)

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// Inventory categories. Rifles is the only unit at launch; its `variants` are
// the army's ON-HAND rifle holdings, loaded from army_rifle_inventory. With no
// procurement flow yet, on-hand is 0 for every faction, so the card shows its
// zero-state until a buying pass lands. Active Orders / RFPs stay empty.
const CATEGORIES = [
  { key: 'rifles', name: 'Rifles', sub: 'Infantry Small Arms', variants: [] },
];

// Rifle quality is a 0–10 score (the mean of Reliability/Lethality/Complexity).
function catTotals(cat) {
  const qty = cat.variants.reduce((s, v) => s + (v.qty || 0), 0);
  const qualities = cat.variants.filter(v => v.qty > 0).map(v => v.quality).sort((a, b) => a - b);
  const median = qualities.length
    ? qualities[Math.floor((qualities.length - 1) / 2)]
    : null;
  return { qty, median, variantCount: cat.variants.length };
}

// This army's on-hand rifles, joined to their catalog model. Each row becomes a
// variant {name, tag(origin), qty, quality, soldiers(=qty × soldiers_per_rifle)}.
async function loadRifleVariants(factionId) {
  if (!factionId) return [];
  const { data, error } = await _supabase
    .from('army_rifle_inventory')
    .select('quantity, rifle_models(name, origin, quality, soldiers_per_rifle)')
    .eq('faction_id', factionId)
    .gt('quantity', 0);
  if (error) { console.warn('[army-procurement] rifle load failed:', error.message); return []; }
  return (data || []).map(r => {
    const m = r.rifle_models || {};
    const qty = Number(r.quantity) || 0;
    return {
      name: m.name || 'Unknown rifle',
      tag: m.origin || '—',
      qty,
      quality: Number(m.quality) || 0,
      soldiers: qty * (Number(m.soldiers_per_rifle) || 0),
    };
  });
}

// World market: the buyable rifle catalog (rifle_models), cheapest first.
let MARKET = [];
// Origin → flag URL, resolved the same way the rest of the app does
// (profile flag → nation flag → asset path). Flags never change mid-session, so
// this is fetched once and reused across refreshes (stock/price still re-fetch).
let _flagCache = null;
async function originFlags(origins) {
  if (_flagCache) return _flagCache;
  _flagCache = {};
  if (origins.length) {
    const { data: nats, error } = await _supabase
      .from('nations')
      .select('name, flag_url, nation_profiles(flag_url)')
      .in('name', origins);
    if (error) console.warn('[army-procurement] origin flags load failed:', error.message);
    for (const n of (nats || [])) {
      const pf = Array.isArray(n.nation_profiles) ? n.nation_profiles[0]?.flag_url : n.nation_profiles?.flag_url;
      _flagCache[n.name] = pf || n.flag_url || `assets/flags/${n.name}.png`;
    }
  }
  return _flagCache;
}

async function loadWorldMarket() {
  const { data, error } = await _supabase
    .from('rifle_models')
    .select('id, name, origin, quality, cost_raw, world_stock')
    .order('cost_raw', { ascending: true });
  if (error) { console.warn('[army-procurement] market load failed:', error.message); return []; }
  const models = data || [];
  const flags = await originFlags([...new Set(models.map(m => m.origin).filter(Boolean))]);
  return models.map(m => ({ ...m, flagUrl: flags[m.origin] || '' }));
}

function inventorySectionHtml() {
  const cards = CATEGORIES.map(cat => {
    const { qty, median, variantCount } = catTotals(cat);
    const variantsHtml = cat.variants.length
      ? cat.variants.map(v => `
          <div class="ap-variant">
            <div>
              <div class="ap-variant__name">${esc(v.name)}</div>
              <div class="ap-variant__tag">${esc(v.tag)} · Quality ${v.quality.toFixed(1)}/10</div>
            </div>
            <div class="ap-variant__qty">QTY ${v.qty.toLocaleString()}</div>
            <div>
              <div class="ap-qbar"><div class="ap-qbar__fill" style="width:${Math.max(0, Math.min(100, v.quality * 10))}%"></div></div>
              <div class="ap-variant__cap">Equips ${v.soldiers.toLocaleString()} soldiers</div>
            </div>
          </div>`).join('')
      : `<div class="ap-empty">This army holds no ${esc(cat.name.toLowerCase())}. Procurement orders will populate this category.</div>`;
    return `
      <div class="ap-cat" data-cat="${esc(cat.key)}">
        <button class="ap-cat__row" data-cat-toggle="${esc(cat.key)}">
          <div>
            <div class="ap-cat__name">${esc(cat.name.toUpperCase())}</div>
            <div class="ap-cat__sub">${esc(cat.sub)}</div>
          </div>
          <div>
            <div class="ap-stat__label">Quantity</div>
            <div class="ap-stat__value${qty ? '' : ' is-dim'}">${qty.toLocaleString()}</div>
          </div>
          <div>
            <div class="ap-stat__label">Median Quality</div>
            <div class="ap-stat__value${median == null ? ' is-dim' : ''}">${median == null ? '—' : median.toFixed(1) + '/10'}</div>
          </div>
          <div>
            <div class="ap-stat__label">Variants</div>
            <div class="ap-stat__value${variantCount ? '' : ' is-dim'}">${variantCount}</div>
          </div>
          ${qty ? '' : '<span class="ap-pill ap-pill--none">None</span>'}
        </button>
        <div class="ap-cat__body">${variantsHtml}</div>
      </div>`;
  }).join('');

  const n = CATEGORIES.length;
  return `
    <div class="ap-section">
      <div class="ap-section__head">
        <span class="ap-section__num">I.</span>
        <span class="ap-section__title">Current Inventory</span>
        <span class="ap-section__meta">${n} ${n === 1 ? 'Category' : 'Categories'} · Click to expand</span>
      </div>
      ${cards}
    </div>`;
}

// World Market: a collapsible Rifles category whose body lists each buyable
// model (name · origin · seller · price/unit · stock) with a Buy button.
function worldMarketSectionHtml() {
  const totalStock = MARKET.reduce((s, m) => s + (Number(m.world_stock) || 0), 0);
  const minPrice = MARKET.length ? Math.min(...MARKET.map(m => Number(m.cost_raw) || 0)) : null;
  const offers = MARKET.length
    ? MARKET.map(m => {
        const stock = Number(m.world_stock) || 0;
        const sold = stock < 1;
        return `
          <div class="wm-offer">
            <div>
              <div class="wm-offer__name">${esc(m.name)}</div>
              <div class="wm-offer__tag">${esc(m.origin)} · Quality ${(Number(m.quality) || 0).toFixed(1)}/10</div>
            </div>
            <div>
              <div class="wm-col__l">Origin</div>
              ${m.flagUrl
                ? `<img class="wm-flag" src="${esc(m.flagUrl)}" alt="${esc(m.origin)}" title="${esc(m.origin)}" onerror="this.outerHTML='<div class=&quot;wm-flag wm-flag--fallback&quot;></div>'">`
                : `<div class="wm-flag wm-flag--fallback" title="${esc(m.origin)}"></div>`}
            </div>
            <div><div class="wm-col__l">Seller</div><div class="wm-col__v is-dim">—</div></div>
            <div><div class="wm-col__l">Price / Unit</div><div class="wm-col__v">${auMoney(m.cost_raw)}</div></div>
            <div><div class="wm-col__l">World Stock</div><div class="wm-col__v${sold ? ' is-dim' : ''}">${stock.toLocaleString()}</div></div>
            <button class="wm-buy" data-buy="${esc(m.id)}"${sold ? ' disabled' : ''}>${sold ? 'Sold Out' : 'Buy'}</button>
          </div>`;
      }).join('')
    : '<div class="ap-empty">No rifles are offered on the world market.</div>';

  return `
    <div class="ap-section">
      <div class="ap-section__head">
        <span class="ap-section__num">II.</span>
        <span class="ap-section__title">World Market</span>
        <span class="ap-section__meta">Buy from global stock · Click to expand</span>
      </div>
      <div class="ap-cat" data-cat="market-rifles">
        <button class="ap-cat__row" data-cat-toggle="market-rifles">
          <div>
            <div class="ap-cat__name">RIFLES</div>
            <div class="ap-cat__sub">Infantry Small Arms</div>
          </div>
          <div>
            <div class="ap-stat__label">Offers</div>
            <div class="ap-stat__value${MARKET.length ? '' : ' is-dim'}">${MARKET.length}</div>
          </div>
          <div>
            <div class="ap-stat__label">From</div>
            <div class="ap-stat__value${minPrice == null ? ' is-dim' : ''}">${minPrice == null ? '—' : auMoney(minPrice)}</div>
          </div>
          <div>
            <div class="ap-stat__label">World Stock</div>
            <div class="ap-stat__value${totalStock ? '' : ' is-dim'}">${totalStock.toLocaleString()}</div>
          </div>
          <span class="ap-cat__chev">▸</span>
        </button>
        <div class="ap-cat__body">${offers}</div>
      </div>
    </div>`;
}

function render() {
  const root = document.getElementById('ap-root');
  if (!root) return;
  const nationName = _faction.__nation_name || '';

  root.innerHTML = `
    <div class="ap-head">
      <div class="ap-head__eyebrow">— Equipment —</div>
      <div class="ap-head__title">Procurement &amp; Inventory</div>
      <div class="ap-head__faction">${esc(_faction.faction_name || 'Army')}${nationName ? ' · ' + esc(nationName) : ''}</div>
    </div>
    ${inventorySectionHtml()}
    ${worldMarketSectionHtml()}
    <div class="ap-section">
      <div class="ap-section__head">
        <span class="ap-section__num">III.</span>
        <span class="ap-section__title">Active Orders</span>
      </div>
      <div class="ap-empty">No active procurement orders.</div>
    </div>
    <div class="ap-section">
      <div class="ap-section__head">
        <span class="ap-section__num">IV.</span>
        <span class="ap-section__title">RFPs</span>
      </div>
      <div class="ap-empty">No open requests for proposals.</div>
    </div>`;

  root.querySelectorAll('[data-cat-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const card = btn.closest('.ap-cat');
      if (card) card.classList.toggle('is-open');
    });
  });
  root.querySelectorAll('[data-buy]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const model = MARKET.find(m => m.id === btn.getAttribute('data-buy'));
      if (model) openBuyModal(model);
    });
  });
}

let _faction = null;
let _busy = false; // purchase in flight — guards the Buy button against double-fire

// Quick buy modal: pick quantity, see the full price, purchase. The buy_rifles
// RPC is the authority on funds/stock; this just collects the quantity and shows
// the running total. Listeners are assigned (not addEventListener) so reopening
// for a different rifle can't stack duplicate handlers.
function openBuyModal(model) {
  if (!model) return;
  let overlay = document.getElementById('wm-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'wm-overlay';
    overlay.className = 'wm-overlay';
    document.body.appendChild(overlay);
  }
  const stock = Number(model.world_stock) || 0;
  const unit = Number(model.cost_raw) || 0;
  const funds = Number(_faction.party_funds) || 0;
  let qty = 1;

  const close = () => { overlay.style.display = 'none'; overlay.innerHTML = ''; overlay.onclick = null; overlay.oninput = null; };
  const buyLabel = () => `Buy ${qty.toLocaleString()} · ${auMoney(unit * qty)}`;

  overlay.innerHTML = `
    <div class="wm-modal">
      <div class="wm-modal__head">
        <div>
          <div class="wm-modal__eyebrow">— Purchase —</div>
          <div class="wm-modal__title">${esc(model.name)}</div>
          <div class="wm-modal__sub">${esc(model.origin)} · ${auMoney(unit)} / unit · ${stock.toLocaleString()} in stock</div>
        </div>
        <div class="wm-x" data-wm="close">×</div>
      </div>
      <div class="wm-modal__body">
        <label class="wm-qty">
          <span class="wm-qty__l">Quantity</span>
          <input type="number" id="wm-qty-input" min="1" max="${stock}" step="1" value="1" />
        </label>
        <div class="wm-sum">
          <div><div class="wm-sum__l">Army Funds</div><div class="wm-sum__v">${auMoney(funds)}</div></div>
          <div><div class="wm-sum__l">Total Price</div><div class="wm-sum__v ${unit <= funds ? 'gold' : 'warn'}" id="wm-total">${auMoney(unit)}</div></div>
        </div>
        <div class="wm-err" id="wm-err" hidden></div>
      </div>
      <div class="wm-modal__foot">
        <button class="wm-btn ghost" data-wm="close">Cancel</button>
        <button class="wm-btn buy" id="wm-confirm"${unit <= funds && stock >= 1 ? '' : ' disabled'}>${buyLabel()}</button>
      </div>
    </div>`;
  overlay.style.display = 'flex';

  overlay.oninput = (e) => {
    if (e.target.id !== 'wm-qty-input') return;
    let v = Math.floor(Number(e.target.value));
    if (!Number.isFinite(v) || v < 1) v = 1;
    if (v > stock) v = stock;
    qty = v;
    if (String(v) !== e.target.value) e.target.value = String(v);
    const total = unit * qty;
    const affordable = total <= funds;
    const totalEl = document.getElementById('wm-total');
    totalEl.textContent = auMoney(total);
    totalEl.className = 'wm-sum__v ' + (affordable ? 'gold' : 'warn');
    const confirm = document.getElementById('wm-confirm');
    confirm.textContent = buyLabel();
    confirm.disabled = !(affordable && stock >= 1);
  };

  overlay.onclick = async (e) => {
    if (e.target === overlay || e.target.closest('[data-wm="close"]')) { if (!_busy) close(); return; }
    const confirm = e.target.closest('#wm-confirm');
    if (!confirm || _busy) return;
    const err = document.getElementById('wm-err');
    _busy = true; confirm.disabled = true; confirm.textContent = 'Purchasing…';
    if (err) { err.hidden = true; err.textContent = ''; }
    try {
      const { data, error } = await _supabase.rpc('buy_rifles', {
        p_faction_id: _faction.id, p_rifle_model_id: model.id, p_quantity: qty,
      });
      if (error || (data && data.ok === false)) {
        if (err) { err.textContent = (data && data.error) || error?.message || 'Purchase failed.'; err.hidden = false; }
        _busy = false; confirm.disabled = false; confirm.textContent = buyLabel();
      } else {
        _busy = false; close(); await refresh();
      }
    } catch (ex) {
      if (err) { err.textContent = ex?.message || 'Purchase failed.'; err.hidden = false; }
      _busy = false; confirm.disabled = false; confirm.textContent = buyLabel();
    }
  };
}

// Reload everything the page renders from, then redraw. Used on init and after a
// purchase so inventory, market stock and army funds all reflect the new state.
async function refresh() {
  CATEGORIES[0].variants = await loadRifleVariants(_faction.id);
  MARKET = await loadWorldMarket();
  const { data, error } = await _supabase
    .from('factions').select('party_funds').eq('id', _faction.id).maybeSingle();
  if (!error && data) _faction.party_funds = Number(data.party_funds) || 0;
  render();
}

async function init() {
  const ctx = await bootstrapArmyPage({ activeTab: 'procurement' });
  if (!ctx) return; // bootstrap already redirected
  _faction = ctx.faction;
  await refresh();
}

init().catch(err => {
  console.error('army-procurement init failed:', err);
  const root = document.getElementById('ap-root');
  if (root) root.innerHTML = '<div class="ap-loading">Failed to load procurement.</div>';
});
</script>
