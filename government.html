// renderSemiPresNoConfidenceButton removed in 20270748 — semi-pres cull.

function renderNoConfidenceButton(coalition) {
    // Absolute monarchy: PM is appointed/dismissed by the Monarch only.
    // Parliament has no no-confidence authority. The Monarch replaces the
    // PM via the Appoint Prime Minister royal action on politics.html.
    if (!currentFaction || isPresidential || isAbsoluteMonarchy(currentNation)) return '';

    // Only opposition parties can file (not in coalition)
    const isInCoalition = coalition.party_ids.includes(currentFaction.id);
    if (isInCoalition) return '';

    // Parties with no seats cannot file no-confidence
    const mySeats = allPartySeats[currentFaction.id] || currentFaction.seats || 0;
    if (mySeats < 1) {
        return `
            <div id="no-confidence" style="text-align:center;margin-top:16px;padding-top:16px;border-top:1px solid var(--border-main);">
                <button class="ministry-btn purge" style="padding:10px 24px;font-size:0.8rem;" disabled>
                    ⚡ Vote of No Confidence
                </button>
                <div style="font-size:0.7rem;color:var(--text-secondary);margin-top:6px;">Need at least 1 seat in the legislature.</div>
            </div>`;
    }

    return `
        <div id="no-confidence" style="text-align:center;margin-top:16px;padding-top:16px;border-top:1px solid var(--border-main);">
            <button class="ministry-btn purge" style="padding:10px 24px;font-size:0.8rem;" onclick="fileNoConfidence()" id="no-confidence-btn">
                ⚡ Vote of No Confidence 
            </button>
            <div style="font-size:0.7rem;color:var(--text-secondary);margin-top:6px;">Opposition only — topple the government</div>
        </div>`;
}

async function fileNoConfidence() {
    if (_govActionLock || !currentFaction || !currentNation) return;
    if (!coalitionData) return;

    // Must have at least 1 seat
    const mySeatsCheck = allPartySeats[currentFaction.id] || currentFaction.seats || 0;
    if (mySeatsCheck < 1) {
        alert('Need at least 1 seat in the legislature to file a vote of no confidence.');
        return;
    }

    // Cannot file no-confidence against a caretaker government
    if (coalitionData?.status === 'caretaker') {
        alert('Cannot file a vote of no confidence against a caretaker government. Elections are already scheduled.');
        return;
    }

    // Check: must not be in coalition (parliamentary only)
    if (coalitionData?.party_ids?.includes(currentFaction.id)) {
        alert('Only opposition parties can file a vote of no confidence.');
        return;
    }

    // Check: no existing pending/floor no-confidence bill for this nation
    const { data: existingMotion } = await _supabase
        .from('bills')
        .select('id')
        .eq('nation_id', currentNation.id)
        .eq('bill_type', 'no_confidence')
        .in('status', ['committee', 'floor'])
        .limit(1)
        .maybeSingle();

    if (existingMotion) {
        alert('A motion of no confidence is already pending.');
        return;
    }

    // Resolve the PM's faction id once — needed for the cooldown check (per
    // targeted PM party) and for the motion title.
    const { data: hog } = await _supabase
        .from('head_of_government')
        .select('last_name, faction_id')
        .eq('nation_id', currentNation.id)
        .eq('active', true)
        .maybeSingle();

    const pmLastName  = hog?.last_name || null;
    const pmFactionId = hog?.faction_id || currentNation.ruling_faction_id || null;

    // Cooldown is per TARGETED PM party (was: per FILER, only after a failed motion).
    // 12 ticks since the last filing against this PM party regardless of outcome.
    if (pmFactionId) {
        const { data: lastFiled } = await _supabase
            .from('campaign_actions')
            .select('tick_performed')
            .eq('nation_id', currentNation.id)
            .eq('action_type', 'no_confidence_filed')
            .eq('target_id', pmFactionId)
            .order('tick_performed', { ascending: false })
            .limit(1)
            .maybeSingle();
        if (lastFiled) {
            const ticksSince = currentTick - lastFiled.tick_performed;
            if (ticksSince < GAME_CONFIG.NO_CONFIDENCE_COOLDOWN_TICKS) {
                const remaining = GAME_CONFIG.NO_CONFIDENCE_COOLDOWN_TICKS - ticksSince;
                alert(`Cooldown: ${remaining} tick${remaining !== 1 ? 's' : ''} remaining before another no-confidence vote can be filed against this PM party.`);
                return;
            }
        }
    }

    const motionName = pmLastName
        ? `Motion of No Confidence in the ${pmLastName} Government`
        : `Motion of No Confidence in the Government`;

    const passConsequences = `IF IT PASSES:\n• Coalition dissolved, PM removed, all ministries vacated\n• Snap elections scheduled\n• Your party: +15 Momentum\n• PM's party: -10 Momentum, -10 Governance`;

    if (!confirm(
        `⚡ FILE VOTE OF NO CONFIDENCE?\n\n` +
        `"${motionName}"\n\n` +
        `Cost: $0 — free to file\n` +
        `Voting period: ${GAME_CONFIG.NO_CONFIDENCE_VOTING_TICKS} ticks\n` +
        `Needs simple majority (YES > NO) to pass.\n\n` +
        `${passConsequences}\n\n` +
        `IF IT FAILS:\n` +
        `• Your party: -10 Momentum\n` +
        `• ${GAME_CONFIG.NO_CONFIDENCE_COOLDOWN_TICKS}-tick cooldown on this PM party\n\n` +
        `Proceed?`
    )) return;
    _govActionLock = true;

    try {
        const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const tick = shard?.current_tick || 0;

        const seatData = await loadSeats(_supabase, currentNation.id, allParties, currentFaction.id);
        const mySeats = seatData.allPartySeats[currentFaction.id] || 0;

        const result = await fileNoConfidenceMotion(_supabase, {
            faction: currentFaction,
            nation: currentNation,
            pmFactionId,
            pmLastName,
            tick,
            mySeats,
        });
        if (!result.ok) {
            alert('Error: ' + result.error);
            return;
        }

        alert(`⚡ "${result.motionName}" has been filed!\n\nVoting is now open for ${GAME_CONFIG.NO_CONFIDENCE_VOTING_TICKS} ticks. All parties will vote.`);
        window.location.href = `bill.html?id=${result.billId}`;
    } catch (e) {
        console.error('No confidence error:', e);
        alert('Error: ' + e.message);
    } finally { _govActionLock = false; }
}

const STIMULUS_IDEOLOGY_AXES = [
    { label: 'Individualism vs Collectivism', ideologies: ['INDIVIDUALISM', 'COLLECTIVISM'] },
    { label: 'Nationalism vs Globalism', ideologies: ['NATIONALISM', 'GLOBALISM'] },
    { label: 'Equality vs Liberty', ideologies: ['EQUALITY', 'LIBERTY'] },
    { label: 'Progress vs Tradition', ideologies: ['PROGRESS', 'TRADITION'] },
    { label: 'Security vs Freedom', ideologies: ['SECURITY', 'FREEDOM'] },
];

// Stats where HIGHER = WORSE (increasing these is bad, decreasing is good)
const _EO_BAD_STATS = new Set([
    'unrest', 'cost_of_living', 'debt'
]);

function _eoStatBadge(statKey, magnitude, direction) {
    // direction: 'up' = stat value increases, 'down' = stat value decreases
    const isBadStat = _EO_BAD_STATS.has(statKey);
    // An increase in a bad stat is negative; a decrease in a bad stat is positive
    const isPositive = direction === 'up' ? !isBadStat : isBadStat;
    const sign = direction === 'up' ? '+' : '−';
    const cls = isPositive ? 'eo-stimulus-up' : 'eo-stimulus-down';
    return `<span class="${cls}">${sign}${magnitude} ${formatStatName(statKey)}</span>`;
}

function renderStimulusPanel(panel) {
    const stimData = eoAvailability?.stimulate_economy;
    if (!stimData) {
        panel.innerHTML = '<div class="eo-confirm-desc">Stimulus data unavailable.</div>';
        return;
    }

    const allOrders = stimData.orders || {};
    const confirmBtn = document.getElementById('eo-confirm-btn');
    confirmBtn.style.display = 'none';

    let html = `
        <div class="eo-confirm-title">Stimulate the Economy</div>
        <div class="eo-confirm-desc">
            Issue ideology-flavored economic stimulus orders. Each .
            Once used, an order cannot be reissued during the same presidential term.
        </div>
        <div class="eo-stimulus-back" onclick="backToEOList()">&#8592; Back to Executive Orders</div>
        <div class="eo-stimulus-grid">`;

    for (const axis of STIMULUS_IDEOLOGY_AXES) {
        const axisOrders = Object.values(allOrders).filter(o => axis.ideologies.includes(o.ideology));
        if (axisOrders.length === 0) continue;

        html += `<div class="eo-stimulus-axis">
            <div class="eo-stimulus-axis-label">${escapeHtml(axis.label)}</div>
            <div class="eo-stimulus-axis-orders">`;

        for (const o of axisOrders) {
            const avail = o.available;
            const used = o.used;
            const statusLabel = used ? 'USED' : (avail ? 'AVAILABLE' : (o.reason || 'LOCKED'));
            const statusClass = used ? 'cooldown' : (avail ? 'available' : 'locked');

            const increases = o.stat_increases ? Object.entries(o.stat_increases).map(([k, v]) => `${_eoStatBadge(k, v, 'up')}`).join(', ') : '';
            const decreases = o.stat_decreases ? Object.entries(o.stat_decreases).map(([k, v]) => `${_eoStatBadge(k, v, 'down')}`).join(', ') : '';

            html += `
                <div class="eo-stimulus-card ${avail ? '' : 'unavailable'}" onclick="${avail ? `selectStimulusOrder('${o.key}')` : ''}">
                    <div class="eo-stimulus-card-header">
                        <span class="eo-stimulus-ideology">${escapeHtml(o.ideology)}</span>
                        <span class="eo-card-status ${statusClass}">${escapeHtml(statusLabel)}</span>
                    </div>
                    <div class="eo-card-name">${escapeHtml(o.name)}</div>
                    <div class="eo-card-desc">${escapeHtml(o.description)}</div>
                    <div class="eo-stimulus-effects">
                        ${increases ? `<div class="eo-stimulus-up">&#9650; ${escapeHtml(increases)}</div>` : ''}
                        ${decreases ? `<div class="eo-stimulus-down">&#9660; ${escapeHtml(decreases)}</div>` : ''}
                    </div>
                </div>`;
        }

        html += `</div></div>`;
    }

    html += '</div>';
    panel.innerHTML = html;
}

function renderEarlyElectionsButton(coalition) {
    // Absolute monarchy: parliament does not run elections — the Monarch
    // controls government composition via the Appoint PM royal action.
    if (!currentFaction || isPresidential || isAbsoluteMonarchy(currentNation)) return '';

    // Only the PM's party can call early elections
    const isPMParty = currentFaction.id === coalition.lead_party_id;
    if (!isPMParty) return '';

    // Cooldown: can't call within 6 ticks of the last election
    const ticksSinceLast = lastElectionTick != null ? (currentTick - lastElectionTick) : 999;
    if (ticksSinceLast < 6) {
        const remaining = 6 - ticksSinceLast;
        return `
            <div id="early-elections" style="text-align:center;margin-top:12px;">
                <button class="ministry-btn purge" style="padding:10px 24px;font-size:0.8rem;opacity:0.4;cursor:not-allowed;" disabled>
                    ⚡ Call Early Elections
                </button>
                <div style="font-size:0.7rem;color:var(--text-muted);margin-top:6px;">Cooldown: ${remaining} tick${remaining !== 1 ? 's' : ''} until available</div>
            </div>`;
    }

    // Cooldown: can't call within 2 ticks of the next scheduled election
    const nextElTick = coalitionData?._earlyElectionTick || null;
    if (nextElTick && (nextElTick - currentTick) <= 2) {
        return `
            <div id="early-elections" style="text-align:center;margin-top:12px;">
                <button class="ministry-btn purge" style="padding:10px 24px;font-size:0.8rem;opacity:0.4;cursor:not-allowed;" disabled>
                    ⚡ Call Early Elections
                </button>
                <div style="font-size:0.7rem;color:var(--text-muted);margin-top:6px;">Elections already imminent</div>
            </div>`;
    }

    const govApproval = Number(currentNation?.gov_approval ?? 50);
    const tierHint = govApproval > 50
        ? `<span style="color:var(--green);">+10 Momentum (strength)</span>`
        : govApproval < 35
            ? `<span style="color:var(--red);">Opposition +5 Mom · +3 Stability</span>`
            : `<span style="color:var(--text-muted);">No bonus (neutral)</span>`;

        <div id="early-elections" style="text-align:center;margin-top:12px;">
            <button class="ministry-btn purge" style="padding:10px 24px;font-size:0.8rem;" onclick="callEarlyElections()" id="early-elections-btn">

            </button>
            <div style="font-size:0.7rem;color:var(--text-secondary);margin-top:6px;">PM only — dissolve the legislature · ${tierHint}</div>

async function callEarlyElections() {
    if (!currentFaction || !currentNation || !coalitionData) return;

    // Validate: must be PM party
    if (currentFaction.id !== coalitionData.lead_party_id) {
        alert('Only the Prime Minister\'s party can call early elections.');
        return;
    }

    // Validate: government must be in 'formed' status (not already caretaker)
    if (coalitionData.status === 'caretaker') {
        alert('The government is already in caretaker mode.');
        return;
    }

    const govApproval = Number(currentNation?.gov_approval ?? 50);

    // Build tier-specific effects text
    let tierEffects = '';
    if (govApproval > 50) {
        tierEffects = `• Your party gains +3 Momentum (calling from strength)\n`;
    } else if (govApproval < 35) {
        tierEffects = `• Opposition parties each gain +5 Momentum\n• Nation gains +3 State Apparatus (orderly transition)\n`;
    } else {
        tierEffects = `• No momentum or state apparatus changes (neutral call)\n`;
    }

    const confirmMsg =
        `⚡ CALL EARLY ELECTIONS?\n\n` +
        `Gov Approval: ${Math.round(govApproval)}%\n\n` +
        `This will:\n` +
        tierEffects +
        `• Freeze all pending legislation\n` +
        `• Dissolve the legislature\n` +
        `• Trigger elections on the next tick (${GAME_CONFIG.EARLY_ELECTION_TICKS} month)\n\n` +
        `The government will remain as caretaker until then.\n` +
        `After the election: coalition dissolves, PM removed, ministries vacated.\n\n` +
        `Proceed?`;

    if (!confirm(confirmMsg)) return;

    // Disable button immediately to prevent double-clicks
    const btn = document.getElementById('early-elections-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Dissolving...'; }

    try {
        const result = await callEarlyElectionsAction(
            _supabase,
            currentNation.id,
            currentFaction.id,
            coalitionData.party_ids
        );



        // Bust coalition cache so re-render picks up caretaker status
        qCacheBust('coalition_');

        alert(`⚡ The legislature has been dissolved.\n\nCaretaker government in place. Elections scheduled for tick ${result.electionTick}.`);
        await refreshGovernmentUI();
    } catch (e) {
        console.error('Early elections error:', e);
        alert('Error: ' + e.message);
        // Re-enable button on failure
        const retryBtn = document.getElementById('early-elections-btn');
        if (retryBtn) { retryBtn.disabled = false; retryBtn.textContent = '⚡ Call Early Elections'; }
    }
}

// ==================== PARLIAMENT VISUALIZATION ====================

function drawParliament(parties, options = {}) {
    const { showLegend = true, showMajorityLine = true, majoritySeats = GAME_CONFIG.MAJORITY_SEATS } = options;
    const PALETTE = ['#E91E63','#5b9bd5','#5cb85c','#d48a3c','#9C27B0','#00BCD4','#d9534f','#8BC34A','#FFC107','#673AB7'];
    const fmt = parties.map((p, i) => ({ name: p.party_name, seats: p.seats, color: p.color || PALETTE[i % PALETTE.length] }));
    const total = fmt.reduce((s, p) => s + p.seats, 0);
    if (total === 0) return;

    const svg = document.getElementById('parliament-svg');
    if (!svg) return;

    const cx = 260, cy = 265, outerR = 230, minInnerR = 80;
    const rows = _calcParliamentRows(total, outerR, minInnerR);
    const dots = _genParliamentDots(rows, cx, cy);

    // Sort dots by angle (left-to-right), then inner-to-outer within same angle.
    // This makes party colors fill as radial wedges from center outward.
    dots.forEach(d => { d.angle = Math.atan2(cy - d.y, d.x - cx); d.radius = Math.hypot(d.x - cx, cy - d.y); });
    dots.sort((a, b) => b.angle - a.angle || a.radius - b.radius);

    // Build seat color + name arrays (party order)
    const seatColors = [], seatNames = [];
    fmt.forEach(p => { for (let i = 0; i < p.seats; i++) { seatColors.push(p.color); seatNames.push(p.name); } });

    // Dynamic dot radius: fit within rows without overlap, capped [2.5, 6]
    const maxDotR = Math.min(6, ...rows.map(r => r.seats > 1 ? (Math.PI * r.radius) / (r.seats * 2.8) : 6));
    const dotR = Math.max(2.5, maxDotR);

    let c = '';

    // Draw seat dots
    dots.forEach((d, i) => {
        if (i < seatColors.length) {
            c += `<circle cx="${d.x.toFixed(1)}" cy="${d.y.toFixed(1)}" r="${dotR.toFixed(1)}" fill="${seatColors[i]}" stroke="var(--bg-panel)" stroke-width="0.8"><title>${seatNames[i]}</title></circle>`;
        }
    });

    // Majority threshold line
    if (showMajorityLine && majoritySeats && majoritySeats < total) {
        const fraction = majoritySeats / total;
        const majAngle = Math.PI * (1 - fraction);
        const innerR = rows[0].radius;
        const outerRActual = rows[rows.length - 1].radius;

        const x1 = cx + (innerR - 12) * Math.cos(majAngle);
        const y1 = cy - (innerR - 12) * Math.sin(majAngle);
        const x2 = cx + (outerRActual + 12) * Math.cos(majAngle);
        const y2 = cy - (outerRActual + 12) * Math.sin(majAngle);

        c += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>`;

        // Label at outer tip
        const lblX = cx + (outerRActual + 22) * Math.cos(majAngle);
        const lblY = cy - (outerRActual + 22) * Math.sin(majAngle);
        c += `<text x="${lblX.toFixed(1)}" y="${lblY.toFixed(1)}" text-anchor="middle" fill="var(--text-muted)" font-size="8" font-weight="600">${majoritySeats}</text>`;
    }

    // Center text
    c += `<text x="${cx}" y="${cy - 14}" text-anchor="middle" fill="var(--accent)" font-size="26" font-weight="bold">${total}</text>`;
    c += `<text x="${cx}" y="${cy + 4}" text-anchor="middle" fill="var(--text-muted)" font-size="10" letter-spacing="1.5">TOTAL SEATS</text>`;

    svg.innerHTML = c;

    // Legend
    if (showLegend) {
        const legendEl = document.getElementById('parliament-legend');
        if (legendEl) {
            legendEl.innerHTML = fmt.map(p => {
                const legParty = allParties.find(x => x.faction_name === p.name);
                const legLogo = legParty?.party_logo;
                const legCustomLogo = legParty?.custom_logo_url;
                const legLogoHtml = legLogo || legCustomLogo ? `<span style="display:inline-flex;vertical-align:middle;margin-right:4px;">${getPartyLogoHTML({ customLogoUrl: legCustomLogo, iconKey: legLogo, size: 14, color: p.color })}</span>` : '';
                return `<div class="legend-item"><span class="legend-swatch" style="background:${p.color};"></span><span class="legend-name">${legLogoHtml}${escapeHtml(p.name)}</span><span class="legend-seats">${p.seats}</span></div>`;
            }).join('');
        }
    }
}

function _calcParliamentRows(totalSeats, outerR, minInnerR) {
    let numRows = Math.round(Math.sqrt(totalSeats / 3));
    numRows = Math.max(3, Math.min(10, numRows));

    const innerR = Math.max(minInnerR, outerR - numRows * 30);
    const rowSpacing = numRows > 1 ? (outerR - innerR) / (numRows - 1) : 0;

    const radii = [];
    for (let i = 0; i < numRows; i++) radii.push(innerR + i * rowSpacing);

    // Distribute seats proportionally by arc circumference
    const totalArc = radii.reduce((sum, r) => sum + Math.PI * r, 0);
    const rows = [];
    let allocated = 0;

    for (let i = 0; i < numRows; i++) {
        const seatsInRow = Math.round(totalSeats * (Math.PI * radii[i]) / totalArc);
        rows.push({ radius: radii[i], seats: seatsInRow });
        allocated += seatsInRow;
    }

    // Correct rounding on outermost row
    rows[rows.length - 1].seats += (totalSeats - allocated);
    return rows;
}

function _genParliamentDots(rows, cx, cy) {
    const positions = [];
    const padAngle = 0.08;

    for (const row of rows) {
        const n = row.seats;
        const r = row.radius;
        if (n <= 0) continue;

        if (n === 1) {
            positions.push({ x: cx + r * Math.cos(Math.PI / 2), y: cy - r * Math.sin(Math.PI / 2) });
            continue;
        }

        const startAngle = Math.PI - padAngle;
        const endAngle = padAngle;
        const step = (startAngle - endAngle) / (n - 1);

        for (let i = 0; i < n; i++) {
            const angle = startAngle - i * step;
            positions.push({ x: cx + r * Math.cos(angle), y: cy - r * Math.sin(angle) });
        }
    }

    return positions;
}

    async function fireMinister(ministryKey) {
    if (_govActionLock || !currentFaction) return;

    const ministry = ministryData.find(m => m.ministry_key === ministryKey);
    if (!ministry || !ministry.minister_first_name) { alert('No minister to dismiss.'); return; }
    if (ministryKey === 'prime_minister') { alert('Cannot dismiss the Prime Minister this way.'); return; }
    if (ministryKey === 'defense' && await isMilitaryLoyaltyActive(_supabase, currentNation?.id)) {
        alert('The Defense Minister cannot be dismissed while the Military Loyalty Act is in force.');
        return;
    }

    // Permission check via the shared helper. `withFallback` mirrors
    // the render-time DISMISS-button gate so if the button appeared,
    // the click is honored. See getCurrentFactionPMState comment for
    // the rationale on the module-level isPMParty fallback.
    const pmState = getCurrentFactionPMState(coalitionData, ministryData, _govData?.hog);
    //   parliamentary  → PM party can dismiss
    //   presidential   → president's party can dismiss
    const canFire = isPresidential ? isPresidentParty : pmState.withFallback;
    if (!canFire) {
        // Diagnostic surface — if a player ever sees this denial with
        // the fallback in place, the actual values are visible without
        // needing console access.
        console.warn('[fireMinister] permission denied', {
            currentFactionId: currentFaction?.id,
            pmFactionId:      pmState.pmFactionId,
            isPMPartyStrict:  pmState.strict,
            isPMPartyModule:  isPMParty,
            hogFactionId:     _govData?.hog?.faction_id,
        });
        alert('Only the head of government can dismiss ministers.\n\n' +
              '(currentFaction=' + (currentFaction?.id || 'null') +
              ', resolved PM=' + (pmState.pmFactionId || 'null') + ')');
        return;
    }

    const ministerName = ministry.minister_first_name + ' ' + ministry.minister_last_name;
    const ministryName = MINISTRY_NAMES[ministryKey] || ministry.ministry_name || ministryKey;
    if (!confirm('Dismiss ' + ministerName + ' from ' + ministryName + '?\n\nA replacement will need to be appointed.\nThe new minister starts at 50% approval.\nNote: The underlying national stats will not change.')) return;
    _govActionLock = true;

    try {
        // Deduct AP
        const apResult = await deductAP(_supabase, currentFaction.id, 0);
        if (!apResult.success) {
            if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
            alert('Unexpected error.');
            return;
        }
        currentFaction.action_points = apResult.newAp;

        // Clear minister and reset approval
        await _supabase.from('ministries').update({
            minister_first_name: null,
            minister_last_name: null,
            minister_age: null,
            party_id: null,
            minister_approval: NEW_MINISTER_APPROVAL,
            stat_baselines: null
        }).eq('id', ministry.id);

        // Log minister dismissal for Regime Log
        await _supabase.from('campaign_actions').insert({
            party_id: currentFaction.id,
            nation_id: currentNation.id,
            action_type: 'fire_minister',
            tick_performed: currentTick,
            result: { minister_name: ministerName, ministry_key: ministryKey }
        });

        // Apply +3 government approval event (processed next tick)
        await adjustGovernmentApprovalEvent(_supabase, currentNation.id, 3, 'minister:fired');

        alert(ministerName + ' has been dismissed from ' + ministryName + '.\n+3 government approval event applied.');
        await refreshGovernmentUI();
    } catch (e) {
        console.error('Fire minister error:', e);
        alert('Error: ' + e.message);
    } finally { _govActionLock = false; }
}

    async function resignMinistry(ministryKey) {
    const ministry = ministryData.find(m => m.ministry_key === ministryKey);
    if (!ministry) return;

    // Cannot resign ministry during caretaker government
    if (!isPresidential && coalitionData?.status === 'caretaker') {
        alert('Cannot resign ministries during a caretaker government.');
        return;
    }

    const ministerName = ministry.minister_first_name + ' ' + ministry.minister_last_name;
    const confirmMsg = isPresidential
        ? 'Resign ' + ministerName + ' from ' + (ministry.ministry_name || ministryKey) + '?\n\nThis vacates the position. The President will need to nominate a replacement.'
        : 'Resign ' + ministerName + ' from ' + (ministry.ministry_name || ministryKey) + '?\n\nThis vacates the position. Your coalition leader may reassign it.';
    if (!confirm(confirmMsg)) return;

    try {
        const updateData = {
            minister_first_name: null,
            minister_last_name: null,
            minister_age: null,
            party_id: null,
            minister_approval: NEW_MINISTER_APPROVAL,
            stat_baselines: null
        };
        // In presidential systems, reset confirmation_status so President can re-nominate
        if (isPresidential) {
            updateData.confirmation_status = null;
            updateData.pending_minister = null;
        }

        await _supabase.from('ministries').update(updateData).eq('id', ministry.id);

        // Fire nation event (not world — internal cabinet matter)
        try {
            const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
            const tick = shard?.current_tick || 0;
            await _supabase.from('event_log').insert({
                nation_id: currentNation.id,
                event_name: 'Minister Resigned',
                category: 'government',
                description_chosen: ministerName + ' has resigned from ' + (MINISTRY_NAMES[ministryKey] || ministryKey) + '. The position is now vacant.',
                fired_at_tick: tick
            });
        } catch (_) { /* non-blocking */ }

        alert(ministerName + ' has resigned from ' + (ministry.ministry_name || ministryKey) + '.');
        await refreshGovernmentUI();
    } catch (e) {
        console.error('Resign ministry error:', e);
        alert('Error: ' + e.message);
    }
}

const END_REASON_LABELS = {
    election_loss: 'Election Loss',
    new_coalition: 'New Coalition',
    coalition_collapse: 'Coalition Collapsed',
    collapsed: 'Government Collapsed',
    coup: 'Coup',
    dissolved: 'Dissolved',
    pm_replaced: 'PM Replaced',
    pm_resignation: 'PM Resignation',
    constitutional_transition: 'Constitutional Transition',
    regime_collapse: 'Regime Collapsed',
    revolution: 'Revolution',
    power_vacuum: 'Power Vacuum',
    impeachment: 'Impeachment'
};

/**
 * Compute stat achievements and challenges from start/end snapshots.
 */
function computeAdminChanges(statsStart, statsEnd) {
    if (!statsStart || !statsEnd) return { achievements: [], challenges: [], allChanges: [] };

    const changes = [];
    for (const key of Object.keys(statsEnd)) {
        const start = statsStart[key] ?? 0;
        const end = statsEnd[key] ?? 0;
        const raw = end - start;
        if (Math.abs(raw) < 0.01) continue;

        let improvement;
        if (STATS_HIGHER_IS_BETTER.includes(key)) {
            improvement = raw;
        } else if (STATS_LOWER_IS_BETTER.includes(key)) {
            improvement = -raw;
        } else {
            continue; // neutral stats excluded from ranking
        }

        changes.push({ key, start, end, raw, improvement });
    }

    const sortedByBest = [...changes].sort((a, b) => b.improvement - a.improvement);
    const achievements = sortedByBest.filter(c => c.improvement > 0).slice(0, 3);
    const sortedByWorst = [...changes].sort((a, b) => a.improvement - b.improvement);
    const challenges = sortedByWorst.filter(c => c.improvement < 0).slice(0, 3);

    return { achievements, challenges, allChanges: sortedByBest };
}

/**
 * Format a stat key into a human-readable name.
 */
function formatAdminStatName(key) {
    const overrides = {
        'gdp_growth': 'GDP Growth',
        'cost_of_living': 'Cost of Living',
        'standard_of_living': 'Standard of Living',
        'crown_authority': 'Crown Authority'
    };
    if (overrides[key]) return overrides[key];
    return key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
}

/**
 * Format a raw stat value for display (no sign prefix).
 */
function formatStatValue(val, key) {
    if (['budget', 'debt'].includes(key)) return (val / 1e9).toFixed(1) + 'B';
    if (key === 'population') return (val / 1e6).toFixed(2) + 'M';
    if (key === 'gdp_growth') { var p = ((val - 50) / 50) * 1; return (p >= 0 ? '+' : '') + p.toFixed(2) + '%'; }
    if (Math.abs(val) < 1 && val !== 0) return val.toFixed(2);
    return String(Math.round(val * 10) / 10);
}

/**
 * Format a stat change (delta) with +/- sign.
 */
function formatChange(raw, key) {
    const sign = raw > 0 ? '+' : '';
    if (['budget', 'debt'].includes(key)) return sign + (raw / 1e9).toFixed(1) + 'B';
    if (key === 'population') return sign + (raw / 1e6).toFixed(2) + 'M';
    if (Math.abs(raw) < 1 && raw !== 0) return sign + raw.toFixed(2);
    return sign + Math.round(raw * 10) / 10;
}

/**
 * Determine if a change is good (improvement) based on stat direction.
 */
function isImprovement(key, raw) {
    if (STATS_HIGHER_IS_BETTER.includes(key)) return raw > 0;
    if (STATS_LOWER_IS_BETTER.includes(key)) return raw < 0;
    return null; // neutral
}

/**
 * Calculate duration in months from tick range.
 */
function ticksToMonths(startTick, endTick) {
    if (endTick == null) return null;
    return endTick - startTick; // 1 tick = 1 month
}

function ticksToDuration(months) {
    if (months == null) return '';
    const years = Math.floor(months / 12);
    const mo = months % 12;
    if (years > 0 && mo > 0) return `${years} year${years !== 1 ? 's' : ''} and ${mo} month${mo !== 1 ? 's' : ''}`;
    if (years > 0) return `${years} year${years !== 1 ? 's' : ''}`;
    return `${mo} month${mo !== 1 ? 's' : ''}`;
}

/**
 * Reconstruct the approval arc for a single administration from the
 * gov_approval_log audit trail (one source of truth). Starts from the
 * admin's recorded approval_at_start baseline and applies every logged
 * delta in tick order, clamped to [0, 100]. Returns peak + trough with
 * the source string that caused each extreme.
 *
 * Logs outside the tenure window (startTick..endTick) are ignored.
 * Returns null when there are no logged events during the tenure — the
 * approval never changed, so there's no arc to report.
 */
function computeApprovalArc(logs, startTick, endTick, approvalAtStart) {
    if (!Array.isArray(logs) || logs.length === 0) return null;
    const window = logs.filter(l => l.tick >= startTick && l.tick <= endTick);
    if (window.length === 0) return null;

    let running = Number(approvalAtStart ?? 50);
    let peak = { value: running, tick: startTick, source: null };
    let trough = { value: running, tick: startTick, source: null };
    for (const entry of window) {
        running = Math.max(0, Math.min(100, running + Number(entry.amount || 0)));
        if (running > peak.value) peak = { value: Math.round(running), tick: entry.tick, source: entry.source };
        if (running < trough.value) trough = { value: Math.round(running), tick: entry.tick, source: entry.source };
    }
    // Round the baseline values too for consistent display
    peak.value = Math.round(peak.value);
    trough.value = Math.round(trough.value);
    return { peak, trough };
}

/**
 * Prettify a gov_approval_log.source key for prose display.
 *   "bill_passage"            → "Bill Passage"
 *   "tax:income"              → "Tax — Income"
 *   "crisis:port_strike"      → "Crisis — Port Strike"
 */
function formatApprovalSource(source) {
    if (!source) return '';
    const parts = source.split(':');
    const titleCase = (s) => s.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    const main = titleCase(parts[0]);
    if (parts.length === 1) return main;
    return `${main} — ${titleCase(parts.slice(1).join(':'))}`;
}

/**
 * Auto-generate a prose summary of an administration based on its data.
 */
function generateAdminSummary(admin) {
    const pmName = admin.prime_minister || admin.president_name || 'Unknown';
    const partyName = admin.pm_party_name || admin.president_party_name || '';
    const durationMonths = admin.ended_at_tick != null ? admin.ended_at_tick - admin.started_at_tick : null;
    const durationStr = durationMonths != null ? ticksToDuration(durationMonths) : 'an ongoing period';
    const startDate = tickToDate(admin.started_at_tick);
    const endDate = admin.ended_at_tick != null ? tickToDate(admin.ended_at_tick) : 'present';

    let summary = `The ${escapeHtml(admin.admin_name || pmName + ' Administration')} governed for ${durationStr} (${startDate} to ${endDate})`;
    if (partyName) summary += `, led by ${escapeHtml(pmName)} of the ${escapeHtml(partyName)}`;
    summary += '. ';

    // Bills
    const billsPassed = admin.bills_passed || [];
    if (billsPassed.length > 0) {
        summary += `During this period, ${billsPassed.length} bill${billsPassed.length !== 1 ? 's were' : ' was'} passed`;
        if (billsPassed.length <= 2) {
            summary += ` including ${billsPassed.map(b => escapeHtml(b.bill_name || b.name || 'an unnamed bill')).join(' and ')}`;
        }
        summary += '. ';
    }

    // Crises
    const crises = admin.crises_started || [];
    const crisesSolved = admin.crises_solved || [];
    if (crises.length > 0) {
        summary += `The administration faced ${crises.length} crisis${crises.length !== 1 ? 'es' : ''}`;
        if (crisesSolved.length > 0) summary += ` and resolved ${crisesSolved.length}`;
        summary += '. ';
    }

    // Stat changes
    const { achievements, challenges } = computeAdminChanges(admin.stats_at_start, admin.stats_at_end);
    if (achievements.length > 0) {
        const topAch = achievements[0];
        summary += `The biggest achievement was improving ${formatAdminStatName(topAch.key)} by ${formatChange(topAch.raw, topAch.key)}. `;
    }
    if (challenges.length > 0) {
        const topCh = challenges[0];
        summary += `The biggest challenge was ${formatAdminStatName(topCh.key)}, which changed by ${formatChange(topCh.raw, topCh.key)}. `;
    }

    // Approval: start→end summary + peak/trough arc from gov_approval_log.
    if (admin.approval_at_start != null && admin.approval_at_end != null) {
        const diff = admin.approval_at_end - admin.approval_at_start;
        summary += `Government approval ${diff >= 0 ? 'rose' : 'fell'} from ${admin.approval_at_start}% to ${admin.approval_at_end}%. `;
    }
    // The approval arc is attached by renderPastAdministrationsTab from the
    // gov_approval_log source of truth. Only surface when peak ≠ trough —
    // a flat line isn't narrative.
    if (admin._approvalArc && admin._approvalArc.peak.value !== admin._approvalArc.trough.value) {
        const { peak, trough } = admin._approvalArc;
        const peakCtx = peak.source ? ` after ${escapeHtml(formatApprovalSource(peak.source))}` : '';
        const troughCtx = trough.source ? ` during ${escapeHtml(formatApprovalSource(trough.source))}` : '';
        summary += `Approval peaked at ${peak.value}% in ${escapeHtml(tickToDate(peak.tick))}${peakCtx}; bottomed at ${trough.value}% in ${escapeHtml(tickToDate(trough.tick))}${troughCtx}. `;
    }

    // End reason
    if (admin.end_reason) {
        const label = END_REASON_LABELS[admin.end_reason] || admin.end_reason;
        summary += `The administration ended due to ${label.toLowerCase()}.`;
    }

    return summary;
}

/**

// ──────────────────────────────────────────────────────────────────
// JUDICIAL subtab — Phase 1: lawsuit list + Pending Cases queue
//
// Public record per migration 20260730 (RLS = read-all). Renders all
// commercial_lawsuits for the current nation grouped by lifecycle:
//   • Pending Cases   — status='pending' (awaiting MoJ review)
//   • Closed Cases    — status in upheld/dismissed/settled/withdrawn
//
// "REVIEW" affordance is gated to the party holding the Justice
// ministry (read from active government_formations.ministry_assignments)
// MoJ ruling button enabled for awaiting_trial cases (Phase 3).
// ──────────────────────────────────────────────────────────────────
async function renderJudicialTab(container) {
    if (!container) return;
    if (!currentNation?.id) {
        container.innerHTML = `<div style="padding:16px;color:var(--text-dim);font-family:var(--font-mono);font-size:12px;">No nation selected.</div>`;
        return;
    }

    container.innerHTML = `<div style="padding:16px;color:var(--text-dim);font-family:var(--font-mono);font-size:12px;">Loading lawsuits…</div>`;

    // Pull lawsuits + the active Justice ministry row in parallel.
    // Source of truth is the `ministries` table — `government_formations` only
    // holds proposal-stage ministry_assignments, so the old query reported
    // every cabinet as vacant outside of an active formation flow.
    const [suitsRes, justiceRes] = await Promise.all([
        _supabase.from('commercial_lawsuits')
            .select(`
                id, status, grievance_type, relief_sought,
                filed_at_tick, responded_at_tick,
                response_deadline_tick, closed_at_tick,
                defense_text, relationship_ref, chat_id,
                plaintiff:entrepreneur_corps!plaintiff_corp_id(name, ticker),
                defendant:entrepreneur_corps!defendant_corp_id(name, ticker)
            `)
            .eq('nation_id', currentNation.id)
            .order('filed_at_tick', { ascending: false }),
        _supabase.from('ministries')
            .select('party_id, minister_first_name, minister_last_name, factions(id, faction_name, abbreviation, party_color)')
            .eq('nation_id', currentNation.id)
            .eq('ministry_key', 'justice')
            .eq('is_active', true)
            .maybeSingle(),
    ]);

    if (suitsRes.error) {
        console.warn('[judicial] lawsuit fetch failed:', suitsRes.error.message);
        container.innerHTML = `<div style="padding:16px;color:#c55;font-family:var(--font-mono);font-size:12px;">Failed to load lawsuits: ${escapeHtml(suitsRes.error.message)}</div>`;
        return;
    }
    // Non-fatal — fall through to "Vacant" rather than blocking the docket.
    if (justiceRes?.error) {
        console.warn('[judicial] justice ministry fetch failed:', justiceRes.error.message);
    }

    const lawsuits = suitsRes.data || [];
    const justiceMinistry = justiceRes?.data || null;
    const justicePartyId = justiceMinistry?.party_id || null;
    const justiceMinisterName = justiceMinistry
        ? `${justiceMinistry.minister_first_name || ''} ${justiceMinistry.minister_last_name || ''}`.trim()
        : '';
    const justicePartyName = justiceMinistry?.factions?.faction_name || '';
    const justicePartyColor = justiceMinistry?.factions?.party_color || '#c8a832';
    const viewerHoldsJustice = !!(currentFaction && justicePartyId && currentFaction.id === justicePartyId);
    // Vacant when no party holds the ministry. Party-held but unappointed
    // is a separate state — banner reports "Unappointed [Party]" so players
    // can see who's responsible for naming a minister.
    const justiceVacant = !justicePartyId;
    const justiceUnappointed = !!justicePartyId && !justiceMinisterName;

    const pending = lawsuits.filter(l => ['pending','reviewing','awaiting_trial','settle_offered'].includes(l.status));
    const closed  = lawsuits.filter(l => ['upheld','dismissed','settled','withdrawn'].includes(l.status));

    const statusColor = {
        pending:        '#c8a832',
        reviewing:      '#5a8aaa',
        awaiting_trial: '#c55',
        settle_offered: '#a0633a',
        upheld:         '#5cb85c',
        dismissed:      '#9e9a92',
        settled:        '#a0633a',
        withdrawn:      '#6a6660',
    };

    function lawsuitRow(l) {
        const plName  = l.plaintiff?.name || 'Unknown';
        const plTick  = l.plaintiff?.ticker || '';
        const defName = l.defendant?.name || 'Unknown';
        const defTick = l.defendant?.ticker || '';
        const sc      = statusColor[l.status] || '#9e9a92';
        const ticksLeft = Math.max(0, Number(l.response_deadline_tick || 0) - Number(currentTick || 0));
        // Overdue & unanswered → the MoJ can rule it as a default judgment.
        const isOverdue = l.status === 'pending' && Number(currentTick || 0) > Number(l.response_deadline_tick || 0);

        // Phase-stage hint reflects where the case actually is in its
        // lifecycle. The Rule on Case button (further down) is the
        // MoJ-holder's active control on awaiting_trial cases.
        let hintText = '';
        if (l.status === 'pending') {
            hintText = isOverdue
                ? (justiceVacant ? 'Defendant Did Not Respond · Justice Vacant' : 'Defendant Did Not Respond · Default Judgment')
                : `Waiting for Defendant to Respond · ${ticksLeft} tick${ticksLeft === 1 ? '' : 's'}`;
        } else if (l.status === 'awaiting_trial') {
            hintText = justiceVacant ? 'Justice Vacant · Awaiting Appointment' : 'Awaiting MoJ Ruling';
        } else if (l.status === 'settle_offered') {
            hintText = 'Settlement Offered · Awaiting Plaintiff';
        } else if (l.status === 'reviewing') {
            hintText = 'Under MoJ Review';
        }
        const hintColor = l.status === 'pending' ? '#c8a832'

        const hint = hintText
            ? `<span style="font-family:var(--font-mono);font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:${hintColor};">${escapeHtml(hintText)}</span>`
            : '';

        // MoJ ruling button — shown only when case is awaiting_trial
        // AND viewer's party holds Justice in this nation. data-lawsuit-id
        // wires to the click handler that mounts the rule modal.
        const ruleBtn = ((l.status === 'awaiting_trial' || isOverdue) && viewerHoldsJustice)
            ? `<button class="judicial-rule-btn" data-lawsuit-id="${escapeHtml(l.id)}" style="font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;padding:6px 12px;color:#000;background:#c8a832;border:1px solid #c8a832;cursor:pointer;">${isOverdue ? 'Default Judgment ▸' : 'Rule on Case ▸'}</button>`
            : '';

        return `<div style="padding:12px 16px;border-bottom:1px solid var(--border-main);background:var(--bg-panel);display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;">
            <div style="min-width:0;">
                <div style="font-size:14px;font-weight:600;color:var(--text-bright);">
                    <span style="font-family:var(--font-mono);font-size:10px;color:#c8a832;letter-spacing:0.1em;margin-right:6px;">${escapeHtml(plTick)}</span>${escapeHtml(plName)}
                    <span style="color:#6a6660;font-weight:400;margin:0 8px;">vs</span>
                    <span style="font-family:var(--font-mono);font-size:10px;color:#c8a832;letter-spacing:0.1em;margin-right:6px;">${escapeHtml(defTick)}</span>${escapeHtml(defName)}
                </div>
                <div style="font-family:var(--font-mono);font-size:10px;color:#9e9a92;margin-top:4px;letter-spacing:0.06em;">
                    ${escapeHtml(GRIEVANCE_LABEL[l.grievance_type] || l.grievance_type)} ·
                    Relief: ${escapeHtml(RELIEF_LABEL[l.relief_sought] || l.relief_sought)} ·
                    Filed tick ${l.filed_at_tick}${l.closed_at_tick ? ' · Closed tick ' + l.closed_at_tick : ''}
                </div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
                <span style="font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;padding:3px 9px;color:${sc};border:1px solid ${sc}66;background:${sc}14;">${escapeHtml(l.status.replace('_',' '))}</span>
                ${hint}
                ${ruleBtn}
            </div>
        </div>`;
    }

    let html = '';

    // Header strip — Justice Minister identity + viewer role hint.
    let ministerLine;
    if (justiceVacant) {
        ministerLine = `<div style="font-family:var(--font-mono);font-size:11px;color:#c84;letter-spacing:0.06em;">Justice Minister: <span style="color:#c84;">Vacant</span></div>`;
    } else {
        const partyChip = justicePartyName
            ? ` <span style="color:${justicePartyColor};">[${escapeHtml(justicePartyName)}]</span>`
            : '';
        const nameDisplay = justiceUnappointed
            ? `<span style="color:#c84;">Unappointed</span>`
            : `<span style="color:var(--text-bright);">${escapeHtml(justiceMinisterName)}</span>`;
        ministerLine = `<div style="font-family:var(--font-mono);font-size:11px;color:#9e9a92;letter-spacing:0.06em;">Justice Minister: ${nameDisplay}${partyChip}</div>`;
    }

    const roleHint = justiceVacant
        ? `<div style="font-family:var(--font-mono);font-size:11px;color:#c84;letter-spacing:0.06em;margin-top:2px;">Pending cases remain on the docket until a Minister of Justice is appointed.</div>`
        : viewerHoldsJustice
            ? `<div style="font-family:var(--font-mono);font-size:11px;color:#5cb85c;letter-spacing:0.06em;margin-top:2px;">Your party holds the Ministry of Justice. Cases awaiting trial show a Rule on Case control.</div>`
            : `<div style="font-family:var(--font-mono);font-size:11px;color:#9e9a92;letter-spacing:0.06em;margin-top:2px;">Cases are reviewed by the Ministry of Justice.</div>`;

    const banner = `${ministerLine}${roleHint}`;

    html += `<div style="padding:16px 20px;border-bottom:1px solid var(--border-main);background:var(--bg-2,#1a1a17);">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">
            <div style="font-size:18px;font-weight:600;color:var(--text-bright);letter-spacing:-0.01em;">Judicial Docket</div>
            <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#9e9a92;">${pending.length} pending · ${closed.length} closed</div>
        </div>
        ${banner}
    </div>`;

    // Pending section
    html += `<div style="padding:14px 20px 6px;font-family:var(--font-mono);font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#c8a832;font-weight:700;">Pending Cases (${pending.length})</div>`;
    if (pending.length === 0) {
        html += `<div style="padding:18px 20px;font-family:var(--font-mono);font-size:11px;color:#6a6660;">No pending cases.</div>`;
    } else {
        for (const l of pending) html += lawsuitRow(l);
    }

    // Closed section
    html += `<div style="padding:14px 20px 6px;margin-top:8px;font-family:var(--font-mono);font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#9e9a92;font-weight:700;">Closed Cases (${closed.length})</div>`;
    if (closed.length === 0) {
        html += `<div style="padding:18px 20px;font-family:var(--font-mono);font-size:11px;color:#6a6660;">No closed cases.</div>`;
    } else {
        for (const l of closed) html += lawsuitRow(l);
    }

    container.innerHTML = html;

    // Wire the Rule on Case buttons (delegated). Clicking mounts the
    // Phase 3 rule modal with the lawsuit row from the rendered list.
    container.querySelectorAll('.judicial-rule-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const id = btn.getAttribute('data-lawsuit-id');
            const lawsuit = (suitsRes.data || []).find(x => x.id === id);
            if (!lawsuit) return;
            try {
                openLawsuitRuleModal(lawsuit, currentFaction);
            } catch (err) {
                console.warn('[judicial] rule modal mount failed:', err?.message || err);
            }
        });
    });
}

// Refresh the Judicial subtab when a ruling is issued elsewhere on
// this client (modal closes via lawsuit:ruled event).
window.addEventListener('lawsuit:ruled', () => {
    if (_govActiveSubtab === 'judicial') {
        const container = document.getElementById('gov-content');
        if (container) renderJudicialTab(container);
    }
});

async function renderPastAdministrationsTab(container, nationIdOverride) {
    if (!container) return;

    const selectedNationId = nationIdOverride || currentNation?.id;
    if (!selectedNationId) {
        container.innerHTML = `<div style="padding:16px;color:var(--text-dim);font-family:var(--font-mono);font-size:12px;">No nation selected.</div>`;
        return;
    }

    container.innerHTML = `<div style="padding:16px;color:var(--text-dim);font-family:var(--font-mono);font-size:12px;">Loading…</div>`;

    try {
        // Parallel fetch: admins + the nation's gov_approval_log + ALL nations
        // (for the selector dropdown). nations is the single source of truth
        // for name / flag / total_seats — no hardcoded maps. Including
        // total_seats here so the renderer can use the SELECTED nation's
        // seat denominator instead of the player's own.
        const [adminsRes, logRes, nationsRes] = await Promise.all([
            _supabase.from('administrations')
                .select('*')
                .eq('nation_id', selectedNationId)
                .order('started_at_tick', { ascending: false }),
            _supabase.from('gov_approval_log')
                .select('amount, source, tick')
                .eq('nation_id', selectedNationId)
                .order('tick', { ascending: true }),
            _supabase.from('nations')
                .select('id, name, flag_url, total_seats')
                .order('name', { ascending: true }),
        ]);

        if (adminsRes.error) {
            console.error('[PastAdministrations] administrations query failed:', adminsRes.error);
            throw adminsRes.error;
        }
        // Both auxiliary queries are best-effort. If nations or gov_approval_log
        // errors out we still render the core admin list — but log the error so
        // we can spot RLS / schema regressions instead of silently rendering an
        // empty page.
        if (logRes?.error) console.warn('[PastAdministrations] gov_approval_log query failed:', logRes.error);
        if (nationsRes?.error) console.warn('[PastAdministrations] nations query failed:', nationsRes.error);
        const logs = (logRes && !logRes.error) ? (logRes.data || []) : [];
        const nations = (nationsRes && !nationsRes.error) ? (nationsRes.data || []) : [];
        const selectedNation = nations.find(n => n.id === selectedNationId)
            || {
                id: selectedNationId,
                name: currentNation?.name || 'Unknown',
                flag_url: currentNation?.flag_url,
                total_seats: currentNation?.total_seats,
            };

        const list = adminsRes.data || [];
        const pastAdmins = list.filter(a => a.ended_at_tick != null);
        const currentAdmin = list.find(a => a.ended_at_tick == null);
        const totalCount = pastAdmins.length + (currentAdmin ? 1 : 0);

        // Open admins (ended_at_tick null) need an upper bound for the approval
        // arc — clamp to the live current tick. The previous code reached for
        // _govData.shard.current_tick which never existed on the _govData
        // shape, silently defaulting to Infinity.
        const openEndTick = (typeof currentTick === 'number') ? currentTick : Number.POSITIVE_INFINITY;
        for (const a of list) {
            const end = a.ended_at_tick ?? openEndTick;
            a._approvalArc = computeApprovalArc(logs, a.started_at_tick, end, a.approval_at_start);
        }

        const selector = buildPastAdminNationSelector(nations, selectedNation);

        if (totalCount === 0) {
            container.innerHTML = `
                ${selector}
                <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:260px;text-align:center;color:var(--text-dim);">
                    <div style="font-family:var(--font-mono);font-size:0.9rem;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;">PAST ADMINISTRATIONS</div>
                    <div style="font-size:0.85rem;color:var(--text-dim);">No administrations recorded for ${escapeHtml(selectedNation.name)} yet.</div>
                </div>
            `;
            return;
        }

        // Total-seats denominator. Falls back to the GAME_CONFIG default
        // only if a nation truly has no per-nation override (legacy data).
        const denomSeats = selectedNation.total_seats || GAME_CONFIG.TOTAL_SEATS;

        container.innerHTML = `
            ${selector}
            <div class="past-admins-list" style="padding:8px 12px;">
                ${currentAdmin ? renderAdminCard(currentAdmin, true, denomSeats) : ''}
                ${pastAdmins.map(a => renderAdminCard(a, false, denomSeats)).join('')}
            </div>
        `;
    } catch (err) {
        console.error('[renderPastAdministrationsTab] load failed:', err);
        container.innerHTML = `<div style="padding:16px;color:var(--red);font-family:var(--font-mono);font-size:12px;">Failed to load administrations: ${escapeHtml(err.message || String(err))}</div>`;
    }
}

/**
 * Build the nation selector dropdown shown at the top of the subtab.
 * Uses a native <select> for the options (simplest) with the selected
 * nation's flag rendered alongside as a visual cue. Change handler
 * re-invokes renderPastAdministrationsTab with the new nationId.
 */
function buildPastAdminNationSelector(nations, selectedNation) {
    if (!Array.isArray(nations) || nations.length === 0) return '';
    const flagSrc = selectedNation.flag_url || `assets/flags/${selectedNation.name}.png`;
    const options = nations.map(n =>
        `<option value="${escapeHtml(n.id)}"${n.id === selectedNation.id ? ' selected' : ''}>${escapeHtml(n.name)}</option>`
    ).join('');
    return `<div class="past-admin-selector">
        <img class="past-admin-flag" src="${escapeHtml(flagSrc)}" alt="${escapeHtml(selectedNation.name)} flag" onerror="this.style.display='none'">
        <select class="past-admin-select" onchange="switchPastAdminNation(this.value)">
            ${options}
        </select>
    </div>`;
}

/**
 * Re-render the PAST ADMINISTRATIONS subtab for a different nation.
 * Exposed on window for the inline onchange handler.
 */
function switchPastAdminNation(nationId) {
    const content = document.getElementById('gov-content');
    if (content) renderPastAdministrationsTab(content, nationId);
}

function toggleAdminCard(id) {
    const card = document.getElementById('admin-card-' + id);
    if (card) card.classList.toggle('open');
}

function toggleStatTable(id, event) {
    const table = document.getElementById('stat-table-' + id);
    if (table) {
        table.classList.toggle('open');
        // Prevent the click from bubbling to the card-toggle handler. Caller
        // passes the event explicitly via the inline onclick; the previous
        // version relied on the deprecated implicit window.event global which
        // breaks under strict mode + non-Chromium browsers.
        if (event && typeof event.stopPropagation === 'function') {
            event.stopPropagation();
        }
    }
}

function renderAdminCard(admin, isCurrent, denomSeats) {
    // denomSeats falls back if the caller (e.g. an upgraded path) doesn't pass it.
    const totalSeatsDenom = denomSeats || currentNation?.total_seats || GAME_CONFIG.TOTAL_SEATS;
    const endClass = isCurrent ? 'current-admin' : ('end-' + (admin.end_reason || 'dissolved'));

    // Summary info (use in-game tick dates, not real-world timestamps)
    const dateRange = isCurrent
        ? `${tickToDate(admin.started_at_tick)} — Present`
        : `${tickToDate(admin.started_at_tick)} — ${tickToDate(admin.ended_at_tick)}`;

    const coalitionParties = (() => {
        const fromAdmin = admin.coalition_parties || [];
        if (fromAdmin.length > 0) return fromAdmin;
        // Fallback for the CURRENT admin only — for newly-created rows that
        // haven't had coalition_parties populated yet, rebuild from
        // _govData.coalition + _govData.parties so the player's own card
        // shows up correctly mid-session.
        if (!isCurrent) return [];
        const coalitionPartyIds = _govData?.coalition?.party_ids || [];
        const livePartyMap = new Map((_govData?.parties || []).map(p => [p.id, p]));
        return coalitionPartyIds
            .map(id => {
                const p = livePartyMap.get(id);
                return p ? { party_id: p.id, party_name: p.faction_name, seats: p.seats || 0 } : null;
            })
            .filter(Boolean);
    })();
    const partyList = coalitionParties.map(p => p.party_name).join(' + ');
    const seatCount = admin.total_seats || coalitionParties.reduce((s, p) => s + (Number(p.seats) || 0), 0);

    // Approval trajectory
    const approvalStart = admin.approval_at_start;
    const approvalEnd = isCurrent ? null : admin.approval_at_end;
    let approvalHTML = '';
    if (isCurrent) {
        // Show live government approval for the current administration
        const liveApproval = currentNation?.gov_approval;
        if (liveApproval != null) {
            approvalHTML = `<span>${liveApproval}%</span>`;
        } else if (approvalStart != null) {
            approvalHTML = `<span>${approvalStart}%</span>`;
        }
    } else if (approvalStart != null) {
        if (approvalEnd != null) {
            const color = approvalEnd >= approvalStart ? 'var(--green)' : 'var(--red)';
            approvalHTML = `<span style="color:${color}">${approvalStart}% &rarr; ${approvalEnd}%</span>`;
        } else {
            approvalHTML = `<span>${approvalStart}%</span>`;
        }
    }

    // Duration in years and months
    const durationMonths = isCurrent ? null : ticksToMonths(admin.started_at_tick, admin.ended_at_tick);
    const durationText = durationMonths != null ? ticksToDuration(durationMonths) + ' in power' : '';

    // End reason badge
    let reasonBadge = '';
    if (isCurrent) {
        reasonBadge = '<span class="pad-current-badge">CURRENT</span>';
    } else if (admin.end_reason) {
        reasonBadge = `<span class="pad-end-reason ${admin.end_reason}">${END_REASON_LABELS[admin.end_reason] || admin.end_reason}</span>`;
    }

    // Compute achievements/challenges
    const { achievements, challenges, allChanges } = computeAdminChanges(admin.stats_at_start, admin.stats_at_end);

    // Legislation
    const billsPassed = admin.bills_passed || [];
    const billsFailed = admin.bills_failed || [];
    const lawsRepealed = admin.laws_repealed || [];
    const crisesStarted = admin.crises_started || [];
    const crisesSolved = admin.crises_solved || [];
    const noConfidenceVotes = admin.no_confidence_votes || [];
    const impeachments = admin.impeachments || [];
    const executiveOrders = admin.executive_orders || [];
    const snapElections = admin.snap_elections || [];
    const minorityGovernments = admin.minority_governments || [];
    const leaderChanges = admin.leader_changes || [];
    const ministerActions = admin.minister_actions || [];
    const diplomaticActions = admin.diplomatic_actions || [];

    // Detail sections
    let detailHTML = '';

    // Auto-generated summary paragraph
    if (!isCurrent) {
        const summaryText = generateAdminSummary(admin);
        detailHTML += `<div style="padding:10px 14px;margin-bottom:12px;background:var(--bg-card);border:1px solid var(--border-main);border-left:3px solid var(--accent);">
            <div style="font-family:var(--font-mono);font-size:8px;font-weight:700;color:var(--accent);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:4px;">ADMINISTRATION SUMMARY</div>
            <div style="font-size:12px;color:var(--text-secondary);line-height:1.6;">${summaryText}</div>
        </div>`;
    }

    // Info grid — adapt labels for presidential vs parliamentary
    const isPres = hasElectedPresident(admin);

    let hogLabel, hogName, hogParty;
    let govLeaderLabel, govLeaderName, govLeaderSub;

    if (isPres) {
        hogLabel = 'President';
        hogName = admin.president_name || admin.head_of_state || 'Unknown';
        hogParty = admin.president_party_name || admin.pm_party_name || '';
        govLeaderLabel = 'Governing Party';
        govLeaderName = admin.president_party_name || admin.pm_party_name || '—';
        govLeaderSub = '';
    } else {
        // For non-presidential systems the player's own current admin can
        // legitimately fall back to live nation fields (head_of_state title,
        // names, hos_election_method) for display continuity. For OTHER
        // nations we only show what's recorded on the admin row.
        hogLabel = escapeHtml(admin.head_of_state_title || (isCurrent ? (currentNation.head_of_state_title || 'Head of State') : 'Head of State'));
        const liveHos = isCurrent
            ? [currentNation.head_of_state_first_name, currentNation.head_of_state_last_name].filter(Boolean).join(' ').trim()
            : '';
        hogName = admin.head_of_state || liveHos || 'Unknown';
        const hosMethod = admin.hos_election_method || (isCurrent ? currentNation.hos_election_method : null);
        hogParty = hosMethod === 'hereditary'
            ? (currentNation.dynasty_name ? currentNation.dynasty_name + ' dynasty' : '')
            : '';
        govLeaderLabel = 'Prime Minister';
        govLeaderName = admin.prime_minister || 'Not yet selected';
        const livePmPartyName = isCurrent
            ? (_govData?.parties || []).find(p => p.id === _govData?.hog?.faction_id)?.faction_name || ''
            : '';
        govLeaderSub = escapeHtml(admin.pm_party_name || livePmPartyName);
    }

    detailHTML += `<div class="past-admin-detail-grid">
        <div class="pad-info-box">
            <div class="pad-info-label">${hogLabel}</div>
            <div class="pad-info-value">${escapeHtml(hogName)}</div>
            ${hogParty ? `<div class="pad-info-sub">${escapeHtml(hogParty)}</div>` : ''}
        </div>
        <div class="pad-info-box">
            <div class="pad-info-label">${govLeaderLabel}</div>
            <div class="pad-info-value">${escapeHtml(govLeaderName)}</div>
            ${govLeaderSub ? `<div class="pad-info-sub">${govLeaderSub}</div>` : ''}
        </div>
        <div class="pad-info-box">
            <div class="pad-info-label">${isPres ? 'Party Seats' : 'Coalition'}</div>
            <div class="pad-info-value">${seatCount} / ${totalSeatsDenom} seats</div>
            <div class="pad-info-sub">${durationText}${admin.end_reason ? ' &middot; Ended: ' + (END_REASON_LABELS[admin.end_reason] || admin.end_reason) : ''}</div>
        </div>
    </div>`;

    // Coalition parties
    if (coalitionParties.length > 0) {
        detailHTML += `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">
            ${coalitionParties.map(p => `<span class="coalition-party-tag">${p.party_name}${p.seats ? '<span class="seats">' + p.seats + '</span>' : ''}</span>`).join('<span class="coalition-divider">+</span>')}
        </div>`;
    }

    // Achievements
    if (!isCurrent && achievements.length > 0) {
        detailHTML += `<div class="pad-section-title">Top Achievements</div>`;
        detailHTML += achievements.map(a => {
            const isLowerBetter = STATS_LOWER_IS_BETTER.includes(a.key);
            const arrow = isLowerBetter ? ' &darr; improved' : '';
            return `<div class="pad-achievement">
                <span class="pad-stat-name">${formatAdminStatName(a.key)}</span>
                <span class="pad-stat-change positive">${formatStatValue(a.start, a.key)} &rarr; ${formatStatValue(a.end, a.key)} (${formatChange(a.raw, a.key)})${arrow}</span>
            </div>`;
        }).join('');
    }

    // Challenges
    if (!isCurrent && challenges.length > 0) {
        detailHTML += `<div class="pad-section-title">Biggest Challenges</div>`;
        detailHTML += challenges.map(c => {
            const isHigherBetter = STATS_HIGHER_IS_BETTER.includes(c.key);
            const arrow = isHigherBetter ? '' : ' &uarr; worsened';
            return `<div class="pad-challenge">
                <span class="pad-stat-name">${formatAdminStatName(c.key)}</span>
                <span class="pad-stat-change negative">${formatStatValue(c.start, c.key)} &rarr; ${formatStatValue(c.end, c.key)} (${formatChange(c.raw, c.key)})${arrow}</span>
            </div>`;
        }).join('');
    }

    if (!isCurrent && achievements.length === 0 && challenges.length === 0 && admin.stats_at_end) {
        detailHTML += `<div class="pad-no-data">No significant stat changes during this administration.</div>`;
    }

    if (isCurrent && !admin.stats_at_end) {
        detailHTML += `<div class="pad-no-data">Stats will be compared when this administration ends.</div>`;
    }

    // Crises
    if (crisesStarted.length > 0 || crisesSolved.length > 0) {
        detailHTML += `<div class="pad-section-title">Crises</div>`;
        if (crisesStarted.length > 0) {
            detailHTML += `<div style="font-size:0.72rem;color:var(--red);font-weight:bold;margin-bottom:4px;">Started (${crisesStarted.length})</div>`;
            detailHTML += crisesStarted.map(c => `<div class="pad-crisis-item"><span>${c.title}</span><span class="crisis-date">${c.date || (c.started_tick != null ? tickToDate(c.started_tick) : '')}</span></div>`).join('');
        }
        if (crisesSolved.length > 0) {
            detailHTML += `<div style="font-size:0.72rem;color:var(--green);font-weight:bold;margin:6px 0 4px;">Solved (${crisesSolved.length})</div>`;
            detailHTML += crisesSolved.map(c => `<div class="pad-crisis-item"><span>${c.title}</span><span class="crisis-date">${c.date || (c.solved_tick != null ? tickToDate(c.solved_tick) : '')}</span></div>`).join('');
        }
    }

    // Legislation
    if (billsPassed.length > 0 || billsFailed.length > 0 || lawsRepealed.length > 0) {
        detailHTML += `<div class="pad-section-title">Legislation</div>`;
        if (billsPassed.length > 0) {
            detailHTML += `<div style="font-size:0.72rem;color:var(--green);font-weight:bold;margin-bottom:4px;">Bills Passed (${billsPassed.length})</div>`;
            detailHTML += billsPassed.map(b => {
                const tag = b.bill_type === 'foundational' ? ' <span style="font-size:0.65rem;color:var(--amber);font-weight:600;text-transform:uppercase;">Foundational</span>' : '';
                return `<div class="pad-legislation-item"><span class="bill-name">${escapeHtml(b.bill_name || 'Unnamed')}${tag}</span><span class="bill-date">${b.date || tickToDate(b.passed_tick)}</span></div>`;
            }).join('');
        }
        if (billsFailed.length > 0) {
            detailHTML += `<div style="font-size:0.72rem;color:var(--red);font-weight:bold;margin:6px 0 4px;">Bills Failed (${billsFailed.length})</div>`;
            detailHTML += billsFailed.map(b => {
                const tag = b.bill_type === 'foundational' ? ' <span style="font-size:0.65rem;color:var(--amber);font-weight:600;text-transform:uppercase;">Foundational</span>' : '';
                return `<div class="pad-legislation-item"><span class="bill-name" style="color:var(--text-muted);">${escapeHtml(b.bill_name || 'Unnamed')}${tag}</span>${b.date ? `<span class="bill-date">${b.date}</span>` : ''}</div>`;
            }).join('');
        }
        if (lawsRepealed.length > 0) {
            detailHTML += `<div style="font-size:0.72rem;color:var(--orange);font-weight:bold;margin:6px 0 4px;">Laws Repealed (${lawsRepealed.length})</div>`;
            detailHTML += lawsRepealed.map(b => `<div class="pad-legislation-item"><span class="bill-name">${escapeHtml(b.bill_name || 'Unnamed')}</span><span class="bill-date">${b.date || (b.repealed_tick != null ? tickToDate(b.repealed_tick) : '')}</span></div>`).join('');
        }
    }

    if (!isCurrent && billsPassed.length === 0 && billsFailed.length === 0 && lawsRepealed.length === 0) {
        detailHTML += `<div class="pad-section-title">Legislation</div><div class="pad-no-data">No legislative activity during this administration.</div>`;
    }

    // Political Events
    const hasPolEvents = noConfidenceVotes.length > 0 || impeachments.length > 0 || executiveOrders.length > 0 || snapElections.length > 0 || minorityGovernments.length > 0;
    if (hasPolEvents) {
        detailHTML += `<div class="pad-section-title">Political Events</div>`;
        if (noConfidenceVotes.length > 0) {
            detailHTML += noConfidenceVotes.map(v => {
                const passed = v.result === 'passed';
                const color = passed ? 'var(--red)' : 'var(--green)';
                const label = passed ? 'PASSED' : 'FAILED';
                return `<div class="pad-legislation-item"><span class="bill-name">Vote of No Confidence</span><span class="bill-date" style="color:${color};">${label} &middot; ${v.date || tickToDate(v.tick)}</span></div>`;
            }).join('');
        }
        if (impeachments.length > 0) {
            detailHTML += impeachments.map(v => {
                const passed = v.result === 'passed';
                const color = passed ? 'var(--red)' : 'var(--green)';
                const label = passed ? 'PASSED' : 'FAILED';
                const typeLabel = v.type === 'impeachment_conviction' ? 'Impeachment Conviction' : 'Impeachment Motion';
                return `<div class="pad-legislation-item"><span class="bill-name">${typeLabel}</span><span class="bill-date" style="color:${color};">${label} &middot; ${v.date || tickToDate(v.tick)}</span></div>`;
            }).join('');
        }
        if (snapElections.length > 0) {
            detailHTML += snapElections.map(e => `<div class="pad-legislation-item"><span class="bill-name">Snap Election</span><span class="bill-date">${e.date || tickToDate(e.tick)}</span></div>`).join('');
        }
        if (minorityGovernments.length > 0) {
            detailHTML += minorityGovernments.map(e => `<div class="pad-legislation-item"><span class="bill-name" style="color:var(--orange);">Minority Government Formed</span><span class="bill-date">${e.date || tickToDate(e.tick)}</span></div>`).join('');
        }
        if (leaderChanges.length > 0) {
            detailHTML += `<div style="font-size:0.72rem;color:var(--teal, #5aafa5);font-weight:bold;margin:6px 0 4px;">Leadership Changes (${leaderChanges.length})</div>`;
            detailHTML += leaderChanges.map(lc => `<div class="pad-legislation-item"><span class="bill-name">${escapeHtml(lc.role)}</span><span class="bill-date" style="color:var(--text-dim);">${escapeHtml(lc.description)} &middot; ${lc.date || tickToDate(lc.tick)}</span></div>`).join('');
        }
        if (executiveOrders.length > 0) {
            const eoLabels = { acting_minister: 'Acting Minister', emergency_session: 'Emergency Session', executive_decree: 'Executive Decree', emergency_powers: 'Emergency Powers', media_address: 'Media Address' };
            detailHTML += `<div style="font-size:0.72rem;color:var(--amber);font-weight:bold;margin:6px 0 4px;">Executive Orders (${executiveOrders.length})</div>`;
            detailHTML += executiveOrders.map(eo => `<div class="pad-legislation-item"><span class="bill-name">${escapeHtml(eoLabels[eo.order_type] || eo.order_type)}</span><span class="bill-date">${eo.date || tickToDate(eo.tick)}</span></div>`).join('');
        }
    }

    // Trade Agreements
    const tradeAgreements = admin.trade_agreements || [];
    if (tradeAgreements.length > 0) {
        const taTypeLabels = { fta: 'Free Trade Agreement', pta: 'Preferential Trade Agreement', resource_supply: 'Resource Supply', export_subsidy: 'Export Subsidy', impose_embargo: 'Embargo', retaliatory_tariff: 'Retaliatory Tariff', unilateral_tariff_reduction: 'Tariff Reduction (Unilateral)', free_trade: 'Free Trade Agreement' };
        detailHTML += `<div class="pad-section-title">Trade Agreements (${tradeAgreements.length})</div>`;
        detailHTML += tradeAgreements.map(ta => `<div class="pad-legislation-item"><span class="bill-name">${escapeHtml(ta.agreement_name || 'Unnamed')}</span><span class="bill-date" style="color:var(--text-dim);">${taTypeLabels[ta.agreement_type] || ta.agreement_type} &middot; ${ta.date || tickToDate(ta.enacted_at_tick)}</span></div>`).join('');
    }

    // Minister Actions
    if (ministerActions.length > 0) {
        const maLabels = { assign_minister: 'Appointed', purge_minister: 'Purged', fire_minister: 'Fired' };
        const maColors = { assign_minister: 'var(--green)', purge_minister: 'var(--red)', fire_minister: 'var(--orange)' };
        detailHTML += `<div class="pad-section-title">Cabinet Changes (${ministerActions.length})</div>`;
        detailHTML += ministerActions.map(ma => {
            const label = maLabels[ma.action_type] || ma.action_type;
            const color = maColors[ma.action_type] || 'var(--text-dim)';
            const name = ma.minister_name ? escapeHtml(ma.minister_name) : 'Unknown';
            const ministry = ma.ministry ? ` — ${escapeHtml(ma.ministry)}` : '';
            return `<div class="pad-legislation-item"><span class="bill-name">${name}${ministry}</span><span class="bill-date" style="color:${color};">${label} &middot; ${ma.date || tickToDate(ma.tick)}</span></div>`;
        }).join('');
    }

    // Diplomatic Actions
    if (diplomaticActions.length > 0) {
        const daLabels = { formal_protest: 'Formal Protest', recall_ambassador: 'Recall Ambassador', impose_embargo: 'Embargo', offer_foreign_aid: 'Foreign Aid', issue_ultimatum: 'Ultimatum', state_visit: 'State Visit', covert_gather_intel: 'Intelligence Gathering', covert_propaganda: 'Propaganda Campaign', covert_bribe: 'Bribe Officials', declare_war: 'Declaration of War', sue_for_peace: 'Peace Offer' };
        detailHTML += `<div class="pad-section-title">Diplomatic Actions (${diplomaticActions.length})</div>`;
        detailHTML += diplomaticActions.map(da => {
            const label = daLabels[da.action_type] || da.action_type;
            const target = da.target_nation ? ` — ${escapeHtml(da.target_nation)}` : '';
            return `<div class="pad-legislation-item"><span class="bill-name">${escapeHtml(label)}${target}</span><span class="bill-date">${da.date || tickToDate(da.tick)}</span></div>`;
        }).join('');
    }

    // All stat changes table (expandable)
    if (!isCurrent && allChanges.length > 0) {
        detailHTML += `
            <div class="pad-stat-table-toggle" onclick="toggleStatTable('${admin.id}', event)">
                <span>All Stat Changes (${allChanges.length})</span>
                <span class="chevron">&#9660;</span>
            </div>
            <div class="pad-stat-table" id="stat-table-${admin.id}">
                <table>
                    <thead><tr><th>Stat</th><th>Start</th><th>End</th><th>Change</th></tr></thead>
                    <tbody>
                        ${allChanges.map(c => {
                            const good = isImprovement(c.key, c.raw);
                            const indicator = good === true ? ' style="color:var(--green)"' : (good === false ? ' style="color:var(--red)"' : '');
                            return `<tr>
                                <td>${formatAdminStatName(c.key)}</td>
                                <td>${formatStatValue(c.start, c.key)}</td>
                                <td>${formatStatValue(c.end, c.key)}</td>
                                <td${indicator}>${formatChange(c.raw, c.key)}</td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>
            </div>`;
    }

    // Build the meta line incrementally so we don't end up with stray
    // " · · " sequences when one of the segments is empty.
    const metaParts = [];
    if (isPres) {
        const presName = escapeHtml(admin.president_name || admin.head_of_state || 'TBD');
        metaParts.push(`<span class="pm-name">${presName}</span>`);
        const presParty = escapeHtml(admin.president_party_name || admin.pm_party_name || '');
        if (presParty) metaParts.push(presParty);
    } else {
        const pmName = admin.prime_minister || 'TBD';
        metaParts.push(`PM: <span class="pm-name">${escapeHtml(pmName)}</span>`);
        if (admin.pm_party_name) metaParts.push(escapeHtml(admin.pm_party_name));
    }
    if (partyList) metaParts.push(escapeHtml(partyList));
    if (seatCount) metaParts.push(`${seatCount}/${totalSeatsDenom} seats`);
    const metaHtml = metaParts.join(' &middot; ');

    return `
        <div class="past-admin-card ${endClass}" id="admin-card-${admin.id}">
            <div class="past-admin-summary" onclick="toggleAdminCard('${admin.id}')">
                <div class="past-admin-summary-left">
                    <div class="past-admin-name">
                        ${escapeHtml(admin.admin_name || 'Unknown Administration')}
                        ${reasonBadge}
                        <span class="past-admin-date">${dateRange}</span>
                    </div>
                    <div class="past-admin-meta">${metaHtml}</div>
                </div>
                <div class="past-admin-approval">
                    <div class="past-admin-approval-label">Approval</div>
                    <div class="past-admin-approval-value">${approvalHTML || '—'}</div>
                </div>
                <span class="past-admin-chevron">&#9660;</span>
            </div>
            <div class="past-admin-detail">
                ${detailHTML}
            </div>
        </div>`;
}
