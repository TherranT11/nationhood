async function saveCoalitionEdit(formationId) {
    if (!editSelectedParties.includes(currentFaction.id)) {
        alert('Your party must remain in the coalition.');
        return;
    }
    const editSeats = getCoalitionSeats(editSelectedParties);
    if (editSeats < GAME_CONFIG.MAJORITY_SEATS) {
        alert(`Your coalition does not meet the ${GAME_CONFIG.MAJORITY_SEATS}-seat threshold. Add more parties.`);
        return;
    }

    const removedParties = activeFormationPartyIds.filter(pid => !editSelectedParties.includes(pid));

    try {
        for (const pid of removedParties) {
            await _supabase.from('government_formation_support')
                .delete().eq('formation_id', formationId).eq('faction_id', pid);
        }

        const { data: formation } = await _supabase
            .from('government_formations').select('ministry_assignments, minister_names').eq('id', formationId).single();
        const assignments = formation?.ministry_assignments || {};
        const ministerNames = formation?.minister_names || {};
        let changed = false;
        for (const [key, val] of Object.entries(assignments)) {
            if (removedParties.includes(val)) {
                assignments[key] = null;
                delete ministerNames[key];
                changed = true;
            }
        }

        const updatePayload = { party_ids: editSelectedParties };
        if (changed) {
            updatePayload.ministry_assignments = assignments;
            updatePayload.minister_names = ministerNames;
        }

        const { error } = await _supabase.from('government_formations')
            .update(updatePayload).eq('id', formationId);
        if (error) throw error;

        activeFormationPartyIds = [...editSelectedParties];
        await openFormation(formationId);
    } catch (err) { alert('Error updating coalition: ' + err.message); }
}

async function retractProposal(formationId) {
    if (!confirm('Are you sure you want to retract this coalition proposal? This will remove it for all parties.')) return;
    try {
        await _supabase.from('government_formation_support').delete().eq('formation_id', formationId);
        await _supabase.from('government_formation_chat').delete().eq('formation_id', formationId);
        const { error } = await _supabase.from('government_formations').delete().eq('id', formationId).eq('proposed_by', currentFaction.id);
        if (error) throw error;

        if (formationRealtimeChannel) { _supabase.removeChannel(formationRealtimeChannel); formationRealtimeChannel = null; }
        activeFormationId = null;
        activeFormationPartyIds = [];
        await loadFormationsList();
    } catch (err) { alert('Error retracting proposal: ' + err.message); }
}

// ===== Form Government =====

async function formGovernment() {
    if (_formingInProgress) return;
    if (!activeFormationId) return;

    // Only the PM's party can form government
    const _fData = await _supabase.from('government_formations')
        .select('ministry_assignments').eq('id', activeFormationId).single();
    const _pmId = _fData.data?.ministry_assignments?.prime_minister;
    if (_pmId && _pmId !== currentFaction.id) {
        alert('Only the Prime Minister candidate can form the government.');
        return;
    }

    if (!confirm('Form this government? This will finalize all ministry assignments.')) return;
    _formingInProgress = true;
    try {
        const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const authoritativeTick = shard?.current_tick || currentTick || 0;

        // If HoS method is 'appointed', clear the HoS so formation auto-generates a new one.
        // 'hereditary' skipped — monarch is permanent.
        const { data: preNation } = await _supabase.from('nations').select('hos_election_method').eq('id', currentNation.id).single();
        if (preNation?.hos_election_method === 'appointed') {
            await _supabase.from('nations').update({
                head_of_state_first_name: null,
                head_of_state_last_name: null,
                head_of_state_age: null
            }).eq('id', currentNation.id);
        }

        // Read the assignments out of the formation row (the in-page
        // coalition flow saves them there) so we can pass them to the
        // shared wrapper. The wrapper handles minister_names generation,
        // baselines, and the atomic RPC call.
        const { data: freshNation } = await _supabase.from('nations').select('*').eq('id', currentNation.id).single();
        const { data: formationRow } = await _supabase
            .from('government_formations')
            .select('ministry_assignments, minister_names')
            .eq('id', activeFormationId)
            .maybeSingle();
        const ministryAssignments = formationRow?.ministry_assignments || {};
        const ministerNames       = formationRow?.minister_names || null;

        const finalizeResult = await formGovernmentShared({
            supabase:            _supabase,
            formationId:         activeFormationId,
            callerFactionId:     currentFaction.id,
            nation:              freshNation || currentNation,
            ministryAssignments,
            ministerNames,
        });

        const { data: formedFormation } = await _supabase.from('government_formations')
            .select('party_ids, ministry_assignments')
            .eq('id', activeFormationId)
            .maybeSingle();
        const relevantFactionIds = Array.from(new Set([
            ...(formedFormation?.party_ids || []),
            ...Object.values(formedFormation?.ministry_assignments || {}).filter(Boolean),
            currentFaction?.id
        ].filter(Boolean)));
        if (relevantFactionIds.length) {
            // Prevents false inactivity disband for active governing parties.
            await _supabase.from('factions').update({ last_seen_tick: authoritativeTick }).in('id', relevantFactionIds);
        }

        alert(finalizeResult?.pm_appointed
            ? `Government formed. ${finalizeResult.pm_appointed} (${finalizeResult.pm_party}) appointed PM.`
            : 'Government formed.');
        if (formationRealtimeChannel) { _supabase.removeChannel(formationRealtimeChannel); formationRealtimeChannel = null; }
        sessionStorage.removeItem('nationhood_state');
        location.reload();
    } catch (err) { alert('Error: ' + err.message); }
    finally { _formingInProgress = false; }
}

// Phase C: formGovernmentFallback removed. The
// finalize_government_formation RPC is now the single source of truth
// for the formation transition (see migration 20260906) — every write
// is atomic inside one SQL transaction. The 170-line JS fallback that
// used to mirror those writes piecemeal is gone, and so are its
// failure modes (half-state when one of the steps errored mid-way).
// If the RPC fails, the operator sees the error, fixes it, and the
// player retries. No silent partial writes.

// ==================== MINISTRY STAT BREAKDOWN ====================

/**
 * Build a collapsible stat breakdown panel for a ministry card.
 * Shows each stat's current value, delta since appointment, and a colored
 * indicator showing whether the stat moved in a good or bad direction.
 *
 * @param {string} ministryKey - e.g. 'finance', 'healthcare'
 * @param {object} [ministry] - ministry row (with stat_baselines) for delta display
 * @returns {string} HTML string (empty if no stats mapped)
 */
function renderMinistryStatBreakdown(ministryKey, ministry) {
    const stats = MINISTRY_TO_STATS[ministryKey];
    if (!stats || stats.length === 0 || !currentNation) return '';

    const DELTA_SENSITIVITY = 0.4; // must match MINISTER_APPROVAL_CONFIG.DELTA_SENSITIVITY
    const BASELINE_DECAY = -0.5;   // must match MINISTER_APPROVAL_CONFIG.BASELINE_DECAY

    const panelId = 'mstat-' + ministryKey;
    const baselines = ministry?.stat_baselines || {};
    let rows = '';
    let deltaSum = 0;
    let deltaCount = 0;

    // First pass: count stats so we can compute per-stat effect share
    let statCount = 0;
    for (const statKey of stats) {
        if (statDirectionSign(statKey) !== 0) statCount++;
    }

    for (const statKey of stats) {
        const value = Number(currentNation[statKey] ?? 50);
        const rounded = Math.round(value * 10) / 10;
        const sign = statDirectionSign(statKey);

        if (sign === 0) continue; // skip neutral stats

        const baseline = baselines[statKey] != null ? Number(baselines[statKey]) : null;
        const hasDelta = baseline !== null;
        const baselineRounded = hasDelta ? Math.round(baseline * 10) / 10 : '—';

        // Delta in the "good" direction: positive = improvement, negative = worsening
        const rawDelta = hasDelta ? value - baseline : 0;
        const goodDelta = rawDelta * sign; // normalized: positive = good
        const absDelta = Math.abs(rawDelta);
        const deltaRounded = Math.round(absDelta * 10) / 10;

        if (hasDelta) {
            deltaSum += goodDelta;
            deltaCount++;
        }

        // Per-stat effect on approval: (goodDelta / statCount) * DELTA_SENSITIVITY
        const effectVal = hasDelta && statCount > 0 ? (goodDelta / statCount) * DELTA_SENSITIVITY : 0;
        const absEffect = Math.abs(effectVal);
        let effectStr = '—';
        let effectCls = 'flat';
        if (hasDelta && absEffect >= 0.01) {
            effectStr = (effectVal > 0 ? '+' : '-') + (Math.round(absEffect * 100) / 100).toFixed(2);
            effectCls = effectVal > 0 ? 'good' : 'bad';
        }

        // Delta display: ↑3.2 or ↓1.5 or —
        let deltaStr = '—';
        let deltaCls = 'flat';
        if (hasDelta && absDelta >= 0.1) {
            const arrow = goodDelta > 0 ? '↑' : '↓';
            deltaStr = arrow + deltaRounded;
            deltaCls = goodDelta > 0 ? 'good' : 'bad';
        } else if (hasDelta) {
            deltaStr = '—';
            deltaCls = 'flat';
        }

        // Colored dot: green = improving, red = worsening, muted = flat
        const dotCls = !hasDelta || absDelta < 0.1 ? 'flat' : goodDelta > 0 ? 'good' : 'bad';

        const label = formatStatName(statKey);
        const directionWord = sign === 1 ? 'Higher is better' : 'Lower is better';
        const tooltip = hasDelta
            ? 'Appointed: ' + baselineRounded + '%. Now: ' + rounded + '%. ' + directionWord + '.'
            : 'No baseline recorded. ' + directionWord + '.';

        rows += '<div class="ministry-stat-row" title="' + escapeHtml(tooltip) + '">'
            + '<span class="stat-name">' + escapeHtml(label) + '</span>'
            + '<span class="stat-appointed">' + (hasDelta ? baselineRounded + '%' : '—') + '</span>'
            + '<span class="stat-val">' + rounded + '%</span>'
            + '<span class="stat-delta ' + deltaCls + '">' + deltaStr + '</span>'
            + '<span class="stat-effect ' + effectCls + '">' + effectStr + '</span>'
            + '<span class="stat-dot ' + dotCls + '">●</span>'
            + '</div>';
    }

    // Overall trend line with total per-tick effect
    let trendText = 'No data';
    let trendCls = 'flat';
    if (deltaCount > 0) {
        const avgDelta = deltaSum / deltaCount;
        // Match server logic: baseline decay always applies, delta only when |clampedDelta| >= 0.5
        // Baselines are permanent (appointment snapshot), so cap cumulative delta to ±5
        const clampedDelta = Math.max(-5, Math.min(5, avgDelta));
        const deltaEffect = Math.abs(clampedDelta) >= 0.5 ? clampedDelta * DELTA_SENSITIVITY : 0;
        const totalEffect = BASELINE_DECAY + deltaEffect;
        const absTotal = Math.abs(totalEffect);
        const effectLabel = absTotal >= 0.01
            ? ' (' + (totalEffect > 0 ? '+' : '-') + (Math.round(absTotal * 100) / 100).toFixed(2) + '/tick)'
            : '';
        if (Math.abs(avgDelta) < 0.5) {
            trendText = 'Approval holding steady' + effectLabel;
            trendCls = 'flat';
        } else if (avgDelta > 0) {
            trendText = 'Approval trending upward' + effectLabel;
            trendCls = 'good';
        } else {
            trendText = 'Approval trending downward' + effectLabel;
            trendCls = 'bad';
        }
    }

    return '<button class="ministry-stats-toggle" onclick="event.stopPropagation();this.classList.toggle(\'open\');document.getElementById(\'' + panelId + '\').classList.toggle(\'open\')">'
        + '<span class="chevron">▶</span> Performance Since Appointed'
        + '</button>'
        + '<div class="ministry-stats-panel" id="' + panelId + '">'
        + '<div class="ministry-stat-row ministry-stat-header">'
        + '<span class="stat-name">Stat</span><span class="stat-appointed">Appointed</span><span class="stat-val">Now</span><span class="stat-delta">Change</span><span class="stat-effect">Effect</span><span class="stat-dot"></span></div>'
        + rows
        + '<div class="ministry-stats-footer ' + trendCls + '">Overall: ' + trendText + '</div>'
        + '</div>';
}

function buildMinisterIdentity(ministry) {

    const partyName = ministry.factions?.faction_name || 'Unknown';

    const mCustomLogo = getPartyCustomLogoById(ministry.party_id);
    const mLogoHtml = (mLogo || mCustomLogo)
        ? `<span style="display:inline-flex;vertical-align:middle;margin-right:4px;">${getPartyLogoHTML({ customLogoUrl: mCustomLogo, iconKey: mLogo, size: 13, color: mColor })}</span>`
        : '';
    const appr = ministry.minister_approval ?? NEW_MINISTER_APPROVAL;
    const apprCls = appr >= 50 ? 'approval-good' : appr >= 35 ? 'approval-warn' : 'approval-bad';
    return `<div class="ministry-card__minister">
        <div class="ministry-card__minister-name">${escapeHtml(firstName)} ${escapeHtml(lastName)}</div>
        <div class="ministry-card__minister-meta">
            Age ${ministry.minister_age ?? '?'} · ${mLogoHtml}<span class="party" style="color:${mColor};">${escapeHtml(partyName)}</span>
        </div>
        <div class="ministry-card__minister-meta" style="margin-top:1px;">
            Approval: <span class="${apprCls}">${Math.round(appr)}%</span>
        </div>
    </div>`;
}

function buildMgmtButtons(key, ministry, govContext) {
    const ap = currentFaction?.action_points || 0;
    const isFilled = ministry && ministry.minister_first_name;
    const noAP = ap < 1;
    const disabledStyle = 'style="opacity:0.4;cursor:not-allowed;"';
    let btns = '';

    if (govContext.type === 'parliamentary') {
        if (govContext.isMyMinistry && !govContext.isCaretaker) {
            btns += `<div class="ministry-card__mgmt-btn ministry-card__mgmt-btn--resign" onclick="event.stopPropagation();resignMinistry('${key}')">RESIGN</div>`;
        }
        if (govContext.isPMParty && !govContext.isCaretaker && !govContext.isMyMinistry && isFilled) {
            if (noAP) {
                btns += `<div class="ministry-card__mgmt-btn ministry-card__mgmt-btn--dismiss" ${disabledStyle}>DISMISS</div>`;
            } else {
                btns += `<div class="ministry-card__mgmt-btn ministry-card__mgmt-btn--dismiss" onclick="event.stopPropagation();fireMinister('${key}')">DISMISS</div>`;
            }
        }
        if (!isFilled && govContext.canAppoint) {
            btns += `<div class="ministry-card__mgmt-btn ministry-card__mgmt-btn--appoint" onclick="event.stopPropagation();openAssignModal('${key}')">APPOINT</div>`;
        }
    } else if (govContext.type === 'presidential') {
        if (govContext.isMyMinistry && !govContext.isPresidentParty) {
            btns += `<div class="ministry-card__mgmt-btn ministry-card__mgmt-btn--resign" onclick="event.stopPropagation();resignMinistry('${key}')">RESIGN</div>`;
        }
        if (govContext.isPresidentParty && isFilled) {
            if (noAP) {
                btns += `<div class="ministry-card__mgmt-btn ministry-card__mgmt-btn--dismiss" ${disabledStyle}>DISMISS</div>`;
            } else {
                btns += `<div class="ministry-card__mgmt-btn ministry-card__mgmt-btn--dismiss" onclick="event.stopPropagation();fireMinister('${key}')">DISMISS</div>`;
            }
        }
        if (!isFilled && govContext.isPresidentParty) {
            btns += `<div class="ministry-card__mgmt-btn ministry-card__mgmt-btn--nominate" onclick="event.stopPropagation();openNominateModal('${key}')">NOMINATE</div>`;
        }
    }

    if (!btns) return '';
    return `<div class="ministry-card__mgmt">${btns}</div>`;
}

function buildRequestList(requests) {
    if (!requests || requests.length === 0) return '';
    let html = '';
    requests.forEach(r => {
        html += `<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 14px;font-family:var(--font-mono);font-size:8px;border-bottom:1px solid rgba(255,255,255,0.04);">
            <span style="color:#5b9bd5;">${escapeHtml(r.factions?.faction_name || 'Unknown')} requests</span>
            <div class="ministry-card__mgmt-btn ministry-card__mgmt-btn--deny" onclick="event.stopPropagation();denyRequest('${r.id}')" style="font-size:7px;padding:2px 6px;">DENY</div>
        </div>`;
    });
    return html;
}

function isMyMinistryByKey(ministryKey) {
    if (!currentFaction) return false;
    const m = ministryData.find(md => md.ministry_key === ministryKey);
    return !!(m && m.party_id === currentFaction.id);
}

function buildMinistryActionRows(ministryKey, isMyMinistry) {
    // Defense ministry has a custom action layout
    if (ministryKey === 'defense') return buildDefenseActionRows(isMyMinistry);
    // Healthcare ministry has a custom action layout (pharmaceutical direction selector)
    if (ministryKey === 'healthcare') return buildHealthcareActionRows(isMyMinistry);
    // Labor ministry has a custom action layout (labor policy direction selector)
    if (ministryKey === 'labor') return buildLaborActionRows(isMyMinistry);
    // Education ministry has a custom action layout
    if (ministryKey === 'education') return buildEducationActionRows(isMyMinistry);
    // Energy ministry has a custom action layout (oil reserves system)
    if (ministryKey === 'energy') return buildEnergyActionRows(isMyMinistry);

    // Foreign ministry actions live on the Diplomacy page
    if (ministryKey === 'foreign') {
        return `<div class="ministry-card__actions-label">ACTIONS</div>
            <div style="padding:10px 12px;font-size:11px;color:var(--text-secondary);">
                Foreign Ministry actions are conducted in the <a href="diplomacy.html" style="color:var(--accent);text-decoration:underline;">Diplomacy panel</a>.
            </div>`;
    }

    const config = MINISTRY_ACTIONS[ministryKey];
    if (!config || !config.actions || config.actions.length === 0) return '';
    const pop = currentNation?.population || 20000000;
    const ap = currentFaction?.action_points || 0;
    const canUse = isMyMinistry === true;

    // Discretionary balance for this ministry
    const ministry = ministryData.find(m => m.ministry_key === ministryKey);
    const discretionaryBalance = Number(ministry?.discretionary_balance || 0);
    const balFmt = discretionaryBalance >= 1000000000
        ? '$' + (discretionaryBalance / 1000000000).toFixed(1) + 'B'
        : discretionaryBalance >= 1000000
        ? '$' + (discretionaryBalance / 1000000).toFixed(1) + 'M'
        : discretionaryBalance > 0 ? '$' + Math.round(discretionaryBalance).toLocaleString('en-US') : '$0';
    const balCls = discretionaryBalance > 0 ? 'color:var(--green)' : 'color:var(--red)';

    let html = `<div class="ministry-card__actions-label" style="display:flex;justify-content:space-between;align-items:center;">
        <span>ACTIONS</span>
        <span style="font-size:8px;font-weight:600;${balCls};letter-spacing:0.03em;">Discretionary Funds: ${balFmt}</span>
    </div>`;
    config.actions.forEach(action => {
        // Coming Soon actions render as disabled placeholder via the
        // shared helper. `costLabel` (optional) overrides the default
        // "COMING SOON" pill so a pre-priced placeholder can show its
        // eventual cost while still being inert (e.g. SOE · $100K).
        if (action.comingSoon) {
            html += renderDisabledActionCard(action.name, action.desc, action.costLabel);
            return;
        }

        // Contract-creating actions render their own card and open a
        // tier-picker modal instead of going through the standard
        // stat-tweak flow (apCosts / budgetPerCapita / decay / etc.).
        if (action.contractAction === 'interior_infrastructure') {
            html += renderInteriorInfrastructureCard(action, canUse);
            return;
        }

        const countKey = ministryKey + ':' + action.id;
        const useCount = ministryActionUseCounts[countKey] || 0;
        const apCost = action.apCosts[Math.min(useCount, 3)];
        const tagsHtml = (action.tags || []).map(t => `<span class="tag tag--${t.cls}">${t.label}</span>`).join('');
        const actionId = ministryKey + '-' + action.id;
        const isActive = activeMinistryActions[actionId] || false;

        // Budget tag: one-time cost, saves (green), no cost, or standard draw
        let budgetTagHtml = '';
        if (action.oneTimeCostPerMillion && !action.budgetPerCapita) {
            const otCost = calculateOneTimeCost(action, pop);
            const otFmt = otCost >= 1e9 ? '$' + (otCost / 1e9).toFixed(1) + 'B' : otCost >= 1e6 ? '$' + (otCost / 1e6).toFixed(0) + 'M' : '$' + Math.round(otCost).toLocaleString('en-US');
            budgetTagHtml = `<span class="tag tag--budget">${otFmt} UPFRONT</span>`;
        } else if (action.budgetSavesPerCapita) {
            const saves = formatBudgetDraw(action.budgetSavesPerCapita, pop);
            budgetTagHtml = `<span class="tag tag--positive">SAVES ${saves}/TICK</span>`;
        } else if (action.budgetPerCapita === 0 && !action.oneTimeCostPerMillion) {
            budgetTagHtml = `<span class="tag tag--neutral">NO TICK COST</span>`;
        } else if (action.budgetPerCapita) {
            const budgetDraw = formatBudgetDraw(action.budgetPerCapita, pop);
            budgetTagHtml = `<span class="tag tag--budget">${budgetDraw}/TICK</span>`;
        }

        // Check blocking conditions
        let blockReason = '';
        if (action.id === 'debtRestructuring' && canUse && !isActive) {
            blockReason = getDebtRestructuringBlock();
        }
        // Block money-drawing actions when ministry has no discretionary funds
        if (!blockReason && action.budgetPerCapita > 0 && discretionaryBalance <= 0 && canUse && !isActive) {
            blockReason = 'No Discretionary Funds available.';
        }
        // Block one-time cost actions when fund can't cover it
        if (!blockReason && action.oneTimeCostPerMillion && !action.budgetPerCapita && canUse && !isActive) {
            const otCost = calculateOneTimeCost(action, pop);
            if (otCost > discretionaryBalance) {
                blockReason = 'Insufficient discretionary funds.';
            }
        }

        const isBlocked = !!blockReason;
        const isDisabled = !canUse || (ap < apCost && !isActive) || isBlocked;

        let stateClass = '';
        let btnHtml = '';
        if (isActive) {
            stateClass = ' active';
            if (action.isResolution) {
                btnHtml = '<div class="ministry-action__active-indicator">● NEGOTIATING</div>';
            } else if (action.cancellable !== false) {
                btnHtml = '<div style="display:flex;align-items:center;gap:6px;">'
                    + '<div class="ministry-action__active-indicator">● ACTIVE</div>'
                    + `<div class="ministry-action__btn-cancel" onclick="event.stopPropagation();cancelMinistryAction('${actionId}','${escapeHtml(action.name)}')" title="Cancel this action early">✕</div>`
                    + '</div>';
            } else {
                btnHtml = '<div class="ministry-action__active-indicator">● ACTIVE</div>';
            }
        } else if (!canUse) {
            stateClass = ' disabled';
            btnHtml = '';
        } else if (isBlocked) {
            stateClass = ' disabled';
            btnHtml = `<div class="ministry-action__btn-execute" style="opacity:0.4;cursor:not-allowed;" title="${escapeHtml(blockReason)}">🔒</div>`;
        } else if (isDisabled) {
            stateClass = ' disabled';
            btnHtml = `<div class="ministry-action__btn-execute" style="opacity:0.4;cursor:not-allowed;">▶ FREE</div>`;
        } else {
            btnHtml = `<div class="ministry-action__btn-execute" onclick="event.stopPropagation();ministryActionSelect('${actionId}')">▶ FREE</div>`;
        }

        // For Debt Restructuring, show base chance when not blocked (credit removed in 19-col schema)
        let extraInfoHtml = '';
        if (action.id === 'debtRestructuring' && !isActive && !isBlocked) {
            extraInfoHtml = `<div style="font-family:var(--font-mono);font-size:7px;color:var(--text-muted);margin-top:2px;">Success chance: 50%</div>`;
        }
        if (isBlocked) {
            extraInfoHtml = `<div style="font-family:var(--font-mono);font-size:7px;color:var(--red);margin-top:2px;">${escapeHtml(blockReason)}</div>`;
        }

        html += `<div class="ministry-action${stateClass}" id="${actionId}" ${canUse && !isActive && !isDisabled ? `onclick="ministryActionSelect('${actionId}')"` : ''}>
            <div class="ministry-action__top">
                <span class="ministry-action__name">${escapeHtml(action.name)}</span>
                <span class="ministry-action__ap-cost">FREE${useCount > 0 ? ' (use ' + (useCount + 1) + ')' : ''}</span>
            </div>
            <div class="ministry-action__desc">${escapeHtml(action.desc)}${extraInfoHtml}</div>
            <div class="ministry-action__bottom">
                <div class="ministry-action__tags">${tagsHtml}${budgetTagHtml}</div>
                <div id="${actionId}-btns">${btnHtml}</div>
            </div>
        </div>`;
    });
    return html;
}

function buildExpandInfrastructureActionRow({ ministryKey, action, canUse, ap, pop, discretionaryBalance }) {
    if (!action) return '';
    const actionId = `${ministryKey}-expandInfrastructure`;
    const isActive = activeMinistryActions[actionId] || false;
    const countKey = `${ministryKey}:expandInfrastructure`;
    const useCount = ministryActionUseCounts[countKey] || 0;
    const apCosts = Array.isArray(action.apCosts) && action.apCosts.length ? action.apCosts : [0, 0, 0, 0];
    const apCost = apCosts[Math.min(useCount, apCosts.length - 1)];
    const tagsHtml = (action.tags || []).map(t => `<span class="tag tag--${t.cls}">${t.label}</span>`).join('');

    const oneTimeCost = action.oneTimeCostPerMillion && !action.budgetPerCapita
        ? calculateOneTimeCost(action, pop)
        : 0;
    const hasPerTickCost = Number(action.budgetPerCapita || 0) > 0;
    const hasOneTimeCost = oneTimeCost > 0;
    const canCoverPerTick = !hasPerTickCost || discretionaryBalance > 0;
    const canCoverOneTime = !hasOneTimeCost || discretionaryBalance >= oneTimeCost;
    const isBudgetBlocked = !canCoverPerTick || !canCoverOneTime;
    const isDisabled = !isActive && (!canUse || ap < apCost || isBudgetBlocked);

    let budgetTagHtml = '';
    if (hasOneTimeCost) {
        budgetTagHtml = `<span class="tag tag--budget">${formatUpfrontCost(oneTimeCost)} UPFRONT</span>`;
    } else if (hasPerTickCost) {
        budgetTagHtml = `<span class="tag tag--budget">${formatBudgetDraw(action.budgetPerCapita, pop)}/TICK</span>`;
    } else if (action.budgetSavesPerCapita) {
        budgetTagHtml = `<span class="tag tag--positive">SAVES ${formatBudgetDraw(action.budgetSavesPerCapita, pop)}/TICK</span>`;
    } else {
        budgetTagHtml = `<span class="tag tag--neutral">NO TICK COST</span>`;
    }

    let extraInfoHtml = '';
    if (!isActive && !canCoverPerTick) {
        extraInfoHtml = `<div style="font-family:var(--font-mono);font-size:7px;color:var(--red);margin-top:2px;">No discretionary funds available.</div>`;
    } else if (!isActive && !canCoverOneTime) {
        extraInfoHtml = `<div style="font-family:var(--font-mono);font-size:7px;color:var(--red);margin-top:2px;">Insufficient discretionary funds.</div>`;
    }

    let stateClass = '';
    let btnHtml = '';
    if (isActive) {
        stateClass = ' active';
        btnHtml = '<div class="ministry-action__active-indicator">● ACTIVE</div>';
    } else if (!canUse) {
        stateClass = ' disabled';
    } else if (isBudgetBlocked) {
        stateClass = ' disabled';
        btnHtml = `<div class="ministry-action__btn-execute" style="opacity:0.4;cursor:not-allowed;" title="Insufficient discretionary funds">🔒</div>`;
    } else if (ap < apCost) {
        stateClass = ' disabled';
        btnHtml = `<div class="ministry-action__btn-execute" style="opacity:0.4;cursor:not-allowed;">▶ FREE</div>`;
    } else {
        btnHtml = `<div class="ministry-action__btn-execute" onclick="event.stopPropagation();ministryActionSelect('${actionId}')">▶ FREE</div>`;
    }

    return `<div class="ministry-action${stateClass}" id="${actionId}" ${!isDisabled ? `onclick="ministryActionSelect('${actionId}')"` : ''}>
        <div class="ministry-action__top">
            <span class="ministry-action__name">${escapeHtml(action.name)}</span>
            <span class="ministry-action__ap-cost">FREE${useCount > 0 ? ' (use ' + (useCount + 1) + ')' : ''}</span>
        </div>
        <div class="ministry-action__desc">${escapeHtml(action.desc)}${extraInfoHtml}</div>
        <div class="ministry-action__bottom">
            <div class="ministry-action__tags">${tagsHtml}${budgetTagHtml}</div>
            <div id="${actionId}-btns">${btnHtml}</div>
        </div>
    </div>`;
}

const CURRICULUM_AXES = [
    { id: 'individualism_collectivism', left: 'Individualism', right: 'Collectivism',
      tip: 'The degree to which citizens believe in personal agency and private responsibility versus shared social obligation and collective action.' },
    { id: 'tradition_progress', left: 'Tradition', right: 'Progress',
      tip: 'The degree to which citizens value established cultural norms, institutions, and ways of life versus openness to social change and reform.' },
    { id: 'liberty_equality', left: 'Liberty', right: 'Equality',
      tip: 'The degree to which citizens prioritise individual freedoms and rights versus equality of outcome and redistribution of opportunity.' },
    { id: 'freedom_security', left: 'Freedom', right: 'Security',
      tip: 'The degree to which citizens accept restrictions on civil liberties and personal autonomy in exchange for safety, order, and control.' },
    { id: 'globalism_nationalism', left: 'Globalism', right: 'Nationalism',
      tip: 'The degree to which citizens identify with and support international engagement versus national sovereignty and domestic priority.' }
];

let _curriculumSelections = []; // array of { axisId, direction: +1/-1, label } — max 2
let _curriculumCooldownUntil = 0; // tick when cooldown expires
let _activeCurriculumDrift = null; // loaded from DB

function buildEducationActionRows(isMyMinistry) {
    const config = MINISTRY_ACTIONS.education;
    if (!config?.actions) return '';
    const pop = currentNation?.population || 20000000;
    const ap = currentFaction?.action_points || 0;
    const canUse = isMyMinistry === true;

    // Discretionary balance
    const ministry = ministryData.find(m => m.ministry_key === 'education');
    const discretionaryBalance = Number(ministry?.discretionary_balance || 0);
    const balFmt = discretionaryBalance >= 1000000000
        ? '$' + (discretionaryBalance / 1000000000).toFixed(1) + 'B'
        : discretionaryBalance >= 1000000
        ? '$' + (discretionaryBalance / 1000000).toFixed(1) + 'M'
        : discretionaryBalance > 0 ? '$' + Math.round(discretionaryBalance).toLocaleString('en-US') : '$0';
    const balCls = discretionaryBalance > 0 ? 'color:var(--green)' : 'color:var(--red)';

    let html = `<div class="ministry-card__actions-label" style="display:flex;justify-content:space-between;align-items:center;">
        <span>ACTIONS</span>
        <span style="font-size:8px;font-weight:600;${balCls};letter-spacing:0.03em;">Discretionary Funds: ${balFmt}</span>
    </div>`;

    // Action 1 — Expand Infrastructure (shared execute flow)
    const expandAction = config.actions.find(a => a.id === 'expandInfrastructure');
    html += buildExpandInfrastructureActionRow({
        ministryKey: 'education',
        action: expandAction,
        canUse,
        ap,
        pop,
        discretionaryBalance
    });

    // Action 2 — Standardised Curriculum
    const currAction = config.actions.find(a => a.id === 'standardisedCurriculum');
    const currActionId = 'education-standardisedCurriculum';
    const currActive = activeMinistryActions[currActionId] || false;
    const currApCost = 6;
    const currTagsHtml = currAction.tags.map(t => `<span class="tag tag--${t.cls}">${t.label}</span>`).join('');
    // Budget cost: ~$1M per million pop per year, ÷12 for per-tick
    const currBudgetPerTick = Math.round((pop / 1_000_000) * 1_000_000 / 12);
    const currBudgetFmt = currBudgetPerTick >= 1_000_000 ? '$' + (currBudgetPerTick / 1_000_000).toFixed(1) + 'M' : currBudgetPerTick >= 1000 ? '$' + (currBudgetPerTick / 1000).toFixed(0) + 'K' : '$' + currBudgetPerTick;
    const currBudgetTag = `<span class="tag tag--negative">${currBudgetFmt}/TICK</span>`;
    // Check cooldown
    const inCooldown = currentTick < _curriculumCooldownUntil;
    const cooldownRemaining = inCooldown ? _curriculumCooldownUntil - currentTick : 0;

    let currBtnHtml = '';
    let currDescExtra = '';
    if (currActive || _activeCurriculumDrift) {
        const drift = _activeCurriculumDrift;
        if (drift) {
            const axis1Desc = `${escapeHtml(drift.direction_label)} on ${escapeHtml(_curriculumAxisLabel(drift.axis))}`;
            const axis2Desc = drift.axis2 && drift.direction_label2
                ? ` & ${escapeHtml(drift.direction_label2)} on ${escapeHtml(_curriculumAxisLabel(drift.axis2))}`
                : '';
            if (drift.drift_ticks_remaining > 0) {
                currDescExtra = `<div style="font-family:var(--font-mono);font-size:7px;color:var(--amber);margin-top:3px;">Drifting ${axis1Desc}${axis2Desc}. ${drift.drift_ticks_remaining} ticks remaining.</div>`;
            }
        }
        currBtnHtml = '<div class="ministry-action__active-indicator">● ACTIVE</div>';
    } else if (inCooldown) {
        currBtnHtml = `<div style="font-family:var(--font-mono);font-size:8px;color:#4a4840;">COOLDOWN ${cooldownRemaining}</div>`;
    } else if (!canUse) {
        currBtnHtml = '';
    } else if (ap < currApCost) {
        currBtnHtml = `<div class="ministry-action__btn-execute" style="opacity:0.4;cursor:not-allowed;">▶ FREE</div>`;
    } else {
        currBtnHtml = `<div class="ministry-action__btn-execute" onclick="event.stopPropagation();openCurriculumModal()">▶ FREE</div>`;
    }

    const currStateClass = (currActive || _activeCurriculumDrift) ? ' active' : (inCooldown || !canUse || ap < currApCost) ? ' disabled' : '';

    html += `<div class="ministry-action${currStateClass}" id="${currActionId}">
        <div class="ministry-action__top">
            <span class="ministry-action__name">Standardised Curriculum</span>
            <span class="ministry-action__ap-cost">FREE</span>

// Open the pharmaceutical direction selector inline
function openPharmaceuticalSelector() {
    if (!isMyMinistryByKey('healthcare')) return;

    const container = document.getElementById('pharma-direction-selector');
    if (!container) return;
    renderPharmaSelectorUI(container);
}

function renderPharmaSelectorUI(container) {
    const config = MINISTRY_ACTIONS.healthcare.actions.find(a => a.id === 'pharmaceuticalRegulation');
    const pop = currentNation?.population || 20000000;
    const pharmaCountKey = 'healthcare:pharmaceuticalRegulation';
    const pharmaUseCount = ministryActionUseCounts[pharmaCountKey] || 0;
    const pharmaApCost = config.apCosts[Math.min(pharmaUseCount, 3)];
    const ministry = ministryData.find(m => m.ministry_key === 'healthcare');
    const discretionaryBalance = Number(ministry?.discretionary_balance || 0);

    const incCost = calculateHealthActionCost(config.directions.increase, pop);
    const decCost = calculateHealthActionCost(config.directions.decrease, pop);
    const selDir = _pharmaSelectedDirection;

    const incSelected = selDir === 'increase';
    const decSelected = selDir === 'decrease';
    const incStyle = incSelected
        ? 'background:var(--blue-faint);border:1px solid var(--blue-border);color:var(--blue);'
        : 'background:transparent;border:1px solid var(--border-0);color:var(--text-muted);';
    const decStyle = decSelected
        ? 'background:var(--blue-faint);border:1px solid var(--blue-border);color:var(--blue);'
        : 'background:transparent;border:1px solid var(--border-0);color:var(--text-muted);';

    // Confirm button
    let confirmHtml = '';
    if (selDir) {
        const cost = selDir === 'increase' ? incCost : decCost;
        const canAfford = cost <= 0 || discretionaryBalance >= cost;
        const costLabel = cost > 0 ? formatUpfrontCost(cost) : 'No Fund Draw';
        if (!canAfford) {
            confirmHtml = `<div class="ministry-action__btn-confirm" style="opacity:0.4;cursor:not-allowed;margin-top:6px;">Confirm — Insufficient funds</div>`;
        } else {
            confirmHtml = `<div class="ministry-action__btn-confirm" onclick="event.stopPropagation();confirmPharmaceuticalAction('${selDir}')" style="margin-top:6px;">Confirm — ${costLabel}</div>`;
        }
    }

    container.innerHTML = `<div style="background:var(--bg-card);border:1px solid var(--border-0);padding:8px 12px;margin-top:6px;">
        <div style="font-family:var(--font-mono);font-size:8px;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;">Select direction:</div>
        <div style="display:flex;flex-direction:column;gap:4px;">
            <div style="${incStyle}padding:6px 10px;cursor:pointer;font-family:var(--font-mono);font-size:8px;text-transform:uppercase;font-weight:700;letter-spacing:0.04em;" onclick="event.stopPropagation();selectPharmaDirection('increase')">INCREASE REGULATIONS</div>
            <div style="${decStyle}padding:6px 10px;cursor:pointer;font-family:var(--font-mono);font-size:8px;text-transform:uppercase;font-weight:700;letter-spacing:0.04em;" onclick="event.stopPropagation();selectPharmaDirection('decrease')">DECREASE REGULATIONS</div>
        </div>
        <div style="display:flex;gap:4px;margin-top:6px;align-items:center;">
            ${confirmHtml}
            <div class="ministry-action__btn-cancel" onclick="event.stopPropagation();closePharmaceuticalSelector()" style="margin-top:${selDir ? '6px' : '0'};">✕</div>
        </div>
    </div>`;

    // Update the tags display based on selected direction
    if (selDir) {
        const dirConfig = config.directions[selDir];
        const tagsContainer = document.querySelector('#healthcare-pharmaceuticalRegulation .ministry-action__tags');
        if (tagsContainer && dirConfig) {
            const cost = selDir === 'increase' ? incCost : decCost;
            const budgetTag = cost > 0
                ? `<span class="tag tag--budget">${formatUpfrontCost(cost)} UPFRONT</span>`
                : `<span class="tag tag--neutral">NO FUND DRAW</span>`;
            tagsContainer.innerHTML = dirConfig.tags.map(t => `<span class="tag tag--${t.cls}">${t.label}</span>`).join('') + budgetTag;
        }
    }
}

function selectPharmaDirection(direction) {
    _pharmaSelectedDirection = direction;
    const container = document.getElementById('pharma-direction-selector');
    if (container) renderPharmaSelectorUI(container);
}

function closePharmaceuticalSelector() {
    _pharmaSelectedDirection = null;
    const container = document.getElementById('pharma-direction-selector');
    if (container) container.innerHTML = '';
    // Reset tags to default
    const tagsContainer = document.querySelector('#healthcare-pharmaceuticalRegulation .ministry-action__tags');

async function confirmPharmaceuticalAction(direction) {
    if (_ministryActionConfirming) return;
    _ministryActionConfirming = true;

    const actionId = 'healthcare-pharmaceuticalRegulation';
    const row = document.getElementById(actionId);
    if (!row || !currentFaction || !currentNation) { _ministryActionConfirming = false; return; }
    if (!isMyMinistryByKey('healthcare')) { _ministryActionConfirming = false; return; }

    const config = MINISTRY_ACTIONS.healthcare.actions.find(a => a.id === 'pharmaceuticalRegulation');
    const dirConfig = config.directions[direction];
    if (!dirConfig) { _ministryActionConfirming = false; return; }

    const countKey = 'healthcare:pharmaceuticalRegulation';
    const useCount = ministryActionUseCounts[countKey] || 0;
    const apCost = config.apCosts[Math.min(useCount, 3)];
    const pop = currentNation.population || 20000000;
    const oneTimeCost = calculateHealthActionCost(dirConfig, pop);

    // Check discretionary funds
    const mData = ministryData.find(m => m.ministry_key === 'healthcare');
    const balance = Number(mData?.discretionary_balance || 0);
    if (oneTimeCost > 0 && balance < oneTimeCost) {
        _ministryActionConfirming = false;
        alert('Insufficient discretionary funds.');
        return;
    }

    // Check if opposing direction is active — confirm cancellation
    const existingActive = activeMinistryActions[actionId];
    if (existingActive) {
        const existingDir = typeof existingActive === 'string' ? existingActive : null;
        if (existingDir === direction) {
            // Same direction already active — cannot double-activate
            _ministryActionConfirming = false;
            alert('This direction is already active.');
            return;
        }
        const opposingLabel = existingDir === 'increase' ? 'Increase Regulations'
            : existingDir === 'decrease' ? 'Decrease Regulations' : 'current pharmaceutical policy';
        if (!confirm(`This will immediately cancel your active ${opposingLabel} with no fund refund. Continue?`)) {
            _ministryActionConfirming = false;
            return;
        }
        await handlePharmaceuticalConflict(direction);
    }

    // Build stat effects from the direction's baseEffects
    const scale = getUseCountScale(useCount);
    const statEffects = dirConfig.baseEffects.map(eff => ({
        stat_key: eff.stat_key,
        direction: eff.direction,
        rate: Math.round((eff.scalable ? eff.rate * scale : eff.rate) * 100) / 100,
        delay_ticks: config.delay,
        duration_ticks: config.duration,
        target: eff.target || 'nation'
    }));

    // Optimistic UI
    row.classList.remove('selected');
    row.classList.add('active');
    const btns = document.getElementById(actionId + '-btns');
    const dirLabel = direction === 'increase' ? 'INCREASE' : 'DECREASE';
    if (btns) btns.innerHTML = `<div class="ministry-action__active-indicator" style="color:#5cb85c;">● ACTIVE — ${dirLabel}</div>`;
    const selectorEl = document.getElementById('pharma-direction-selector');
    if (selectorEl) selectorEl.innerHTML = '';

    const actionData = {
        use_count: useCount,
        scale: scale,
        direction: direction,
        one_time_cost: oneTimeCost,
        budget_per_tick: 0
    };

    try {
        const { data: actionLogId, error } = await _supabase.rpc('execute_ministry_action', {
            p_nation_id: currentNation.id,
            p_faction_id: currentFaction.id,
            p_ministry_key: 'healthcare',
            p_action_key: 'pharmaceuticalRegulation',
            p_ap_cost: apCost,
            p_applied_at_tick: currentTick,
            p_stat_effects: statEffects,
            p_action_data: actionData
        });

        if (error) throw error;

        // === RPC succeeded — action is committed. Everything below is best-effort. ===

        // Deduct one-time cost from discretionary fund (best-effort — action already committed)
        try { await deductDiscretionaryFund('healthcare', mData, balance, oneTimeCost); }
        catch (_) { /* fund deduction failed — will be stale until page reload */ }

        // Update local state
        const prevAP = currentFaction.action_points || 0;
        currentFaction.action_points = Math.max(0, prevAP - apCost);
        ministryActionUseCounts[countKey] = useCount + 1;
        activeMinistryActions[actionId] = direction; // store direction as value
        _pharmaSelectedDirection = null;
        sessionStorage.removeItem('nationhood_state');

        // Fire event (non-blocking)
        try {
            const { ministerName, partyName } = await fetchMinisterInfo('healthcare');
            await _supabase.rpc('fire_system_event', {
                p_trigger_key: dirConfig.triggerKey,
                p_nation_id: currentNation.id,
                p_tick: currentTick,
                p_placeholders: {
                    minister_name: ministerName,
                    party: partyName,
                    nation: currentNation.name || 'Unknown',
                    direction: direction,
                    cost: formatUpfrontCost(oneTimeCost)
                }
            });
        } catch (_) { /* best-effort */ }
        await insertMinisterActionTimelineEvent(
            'healthcare',
            `${config.name} (${direction === 'increase' ? 'Increase Regulations' : 'Decrease Regulations'})`
        );

    } catch (e) {
        // Revert optimistic UI — only reached if RPC itself failed
        row.classList.remove('active');
        if (btns) btns.innerHTML = `<div class="ministry-action__btn-execute" onclick="event.stopPropagation();openPharmaceuticalSelector()">▶ FREE</div>`;
        alert('Action failed: ' + (e.message || 'Unknown error'));
    } finally {
        _ministryActionConfirming = false;
    }
}

    } finally {

}

function buildLaborActionRows(isMyMinistry) {
    const config = MINISTRY_ACTIONS.labor;
    if (!config?.actions) return '';
    const pop = currentNation?.population || 20000000;
    const ap = currentFaction?.action_points || 0;
    const canUse = isMyMinistry === true;

    // Discretionary balance
    const ministry = ministryData.find(m => m.ministry_key === 'labor');
    const { balance: discretionaryBalance, fmt: balFmt, cls: balCls } = formatDiscretionaryBalance(ministry?.discretionary_balance);

    let html = `<div class="ministry-card__actions-label" style="display:flex;justify-content:space-between;align-items:center;">
        <span>Ministry Actions</span>
        <span style="font-size:8px;font-weight:600;${balCls};letter-spacing:0.03em;">Discretionary Funds: ${balFmt}</span>
    </div>`;

    // Action 1 — Expand Infrastructure (shared execute flow)
    const expandAction = config.actions.find(a => a.id === 'expandInfrastructure');
    html += buildExpandInfrastructureActionRow({
        ministryKey: 'labor',
        action: expandAction,
        canUse,
        ap,
        pop,
        discretionaryBalance
    });

    // Action 2 — Labor Policy (with direction selector)
    const laborAction = config.actions.find(a => a.id === 'laborPolicy');
    const laborActionId = 'labor-laborPolicy';
    const laborActiveRaw = activeMinistryActions[laborActionId];
    const laborActive = !!laborActiveRaw;
    const laborActiveDir = typeof laborActiveRaw === 'string' ? laborActiveRaw : null;
    const laborCountKey = 'labor:laborPolicy';
    const laborUseCount = ministryActionUseCounts[laborCountKey] || 0;
    const laborApCost = laborAction.apCosts[Math.min(laborUseCount, 3)];

    // Show direction-specific tags if a direction is selected or active
    const displayDir = laborActiveDir || _laborSelectedDirection;
    const dirConfig = displayDir ? laborAction.directions[displayDir] : null;
    const laborTags = dirConfig ? dirConfig.tags : [
        { label: 'SELECT DIRECTION', cls: 'neutral' }
    ];
    const laborTagsHtml = laborTags.map(t => `<span class="tag tag--${t.cls}">${t.label}</span>`).join('');

    // Budget tag based on direction
    let laborBudgetTag = '';
    if (dirConfig) {
        const laborCost = calculateLaborActionCost(dirConfig, pop);
        laborBudgetTag = laborCost > 0
            ? `<span class="tag tag--budget">${formatUpfrontCost(laborCost)} UPFRONT</span>`
            : `<span class="tag tag--neutral">NO FUND DRAW</span>`;
    }

    let laborBtnHtml = '';
    let laborStateClass = '';
    if (laborActive) {
        laborStateClass = ' active';
        const dirLabel = laborActiveDir === 'strengthen' ? 'STRENGTHEN UNIONS' : laborActiveDir === 'deregulate' ? 'DEREGULATE LABOR' : 'ACTIVE';
        laborBtnHtml = `<div class="ministry-action__active-indicator" style="color:#5cb85c;">● ACTIVE — ${dirLabel}</div>`;
    } else if (!canUse) {
        laborStateClass = ' disabled';
    } else if (ap < laborApCost) {
        laborStateClass = ' disabled';
        laborBtnHtml = `<div class="ministry-action__btn-execute" style="opacity:0.4;cursor:not-allowed;">▶ FREE</div>`;
    } else {
        laborBtnHtml = `<div class="ministry-action__btn-execute" onclick="event.stopPropagation();openLaborPolicySelector()">▶ FREE</div>`;
    }

    html += `<div class="ministry-action${laborStateClass}" id="${laborActionId}">
        <div class="ministry-action__top">
            <span class="ministry-action__name">Labor Policy</span>
            <span class="ministry-action__ap-cost">FREE${laborUseCount > 0 ? ' (use ' + (laborUseCount + 1) + ')' : ''}</span>
        </div>
        <div class="ministry-action__desc">${escapeHtml(laborAction.desc)}</div>
        <div class="ministry-action__bottom">
            <div class="ministry-action__tags">${laborTagsHtml}${laborBudgetTag}</div>
            <div id="${laborActionId}-btns">${laborBtnHtml}</div>
        </div>
        <div id="labor-direction-selector"></div>
    </div>`;

    // Action 3 — Workforce Development Programme (standard flow with one-time cost)
    const wfAction = config.actions.find(a => a.id === 'workforceDevelopment');
    const wfActionId = 'labor-workforceDevelopment';
    const wfActive = activeMinistryActions[wfActionId] || false;
    const wfCountKey = 'labor:workforceDevelopment';
    const wfUseCount = ministryActionUseCounts[wfCountKey] || 0;
    const wfApCost = wfAction.apCosts[Math.min(wfUseCount, 3)];
    const wfOneTimeCost = calculateLaborActionCost(wfAction, pop);
    const wfCostLabel = formatUpfrontCost(wfOneTimeCost);
    const wfTagsHtml = wfAction.tags.map(t => `<span class="tag tag--${t.cls}">${t.label}</span>`).join('');
    const wfBudgetTag = `<span class="tag tag--budget">${wfCostLabel} UPFRONT</span>`;
    const wfCanAfford = discretionaryBalance >= wfOneTimeCost;

    let wfBtnHtml = '';
    let wfStateClass = '';
    let wfExtraHtml = '';
    if (wfActive) {
        wfStateClass = ' active';
        wfBtnHtml = '<div class="ministry-action__active-indicator">● ACTIVE</div>';
    } else if (!canUse) {
        wfStateClass = ' disabled';
    } else if (!wfCanAfford) {
        wfStateClass = ' disabled';
        wfBtnHtml = `<div class="ministry-action__btn-execute" style="opacity:0.4;cursor:not-allowed;" title="Insufficient discretionary funds">🔒</div>`;
        wfExtraHtml = `<div style="font-family:var(--font-mono);font-size:7px;color:var(--red);margin-top:2px;">Insufficient discretionary funds.</div>`;
    } else if (ap < wfApCost) {
        wfStateClass = ' disabled';
        wfBtnHtml = `<div class="ministry-action__btn-execute" style="opacity:0.4;cursor:not-allowed;">▶ FREE</div>`;
    } else {
        wfBtnHtml = `<div class="ministry-action__btn-execute" onclick="event.stopPropagation();laborActionSelect('${wfActionId}')">▶ FREE</div>`;
    }

    html += `<div class="ministry-action${wfStateClass}" id="${wfActionId}" ${!wfActive && canUse && wfCanAfford && ap >= wfApCost ? `onclick="laborActionSelect('${wfActionId}')"` : ''}>
        <div class="ministry-action__top">
            <span class="ministry-action__name">Workforce Development Programme</span>
            <span class="ministry-action__ap-cost">FREE${wfUseCount > 0 ? ' (use ' + (wfUseCount + 1) + ')' : ''}</span>
        </div>
        <div class="ministry-action__desc">${escapeHtml(wfAction.desc)}${wfExtraHtml}</div>
        <div class="ministry-action__bottom">
            <div class="ministry-action__tags">${wfTagsHtml}${wfBudgetTag}</div>
            <div id="${wfActionId}-btns">${wfBtnHtml}</div>
        </div>
    </div>`;

    return html;
}

function renderLaborSelectorUI(container) {
    const config = MINISTRY_ACTIONS.labor.actions.find(a => a.id === 'laborPolicy');

    const laborCountKey = 'labor:laborPolicy';

    const strCost = calculateLaborActionCost(config.directions.strengthen, pop);
    const deregCost = calculateLaborActionCost(config.directions.deregulate, pop);
    const selDir = _laborSelectedDirection;

    const strSelected = selDir === 'strengthen';
    const deregSelected = selDir === 'deregulate';
    const strStyle = strSelected
        ? 'background:var(--blue-faint);border:1px solid var(--blue-border);color:var(--blue);'
        : 'background:transparent;border:1px solid var(--border-0);color:var(--text-muted);';

        }

    container.innerHTML = `<div style="background:var(--bg-card);border:1px solid var(--border-0);padding:8px 12px;margin-top:6px;">
        <div style="font-family:var(--font-mono);font-size:8px;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px;">Select direction:</div>

            <div style="${deregStyle}padding:6px 10px;cursor:pointer;font-family:var(--font-mono);font-size:8px;text-transform:uppercase;font-weight:700;letter-spacing:0.04em;" onclick="event.stopPropagation();selectLaborDirection('deregulate')">DEREGULATE LABOR</div>

    if (selDir) {

        if (tagsContainer && dirConfig) {

async function confirmLaborPolicyAction(direction) {
    if (_ministryActionConfirming) return;
    _ministryActionConfirming = true;

    const actionId = 'labor-laborPolicy';
    const row = document.getElementById(actionId);
    if (!row || !currentFaction || !currentNation) { _ministryActionConfirming = false; return; }
    if (!isMyMinistryByKey('labor')) { _ministryActionConfirming = false; return; }

    const config = MINISTRY_ACTIONS.labor.actions.find(a => a.id === 'laborPolicy');
    const dirConfig = config.directions[direction];
    if (!dirConfig) { _ministryActionConfirming = false; return; }

    const countKey = 'labor:laborPolicy';
    const useCount = ministryActionUseCounts[countKey] || 0;
    const apCost = config.apCosts[Math.min(useCount, 3)];
    const pop = currentNation.population || 20000000;
    const oneTimeCost = calculateLaborActionCost(dirConfig, pop);

    // Check discretionary funds
    const mData = ministryData.find(m => m.ministry_key === 'labor');
    const balance = Number(mData?.discretionary_balance || 0);
    if (oneTimeCost > 0 && balance < oneTimeCost) {
        _ministryActionConfirming = false;
        alert('Insufficient discretionary funds.');
        return;
    }

    // Check if opposing direction is active — confirm cancellation
    const existingActive = activeMinistryActions[actionId];
    if (existingActive) {
        const existingDir = typeof existingActive === 'string' ? existingActive : null;
        if (existingDir === direction) {
            _ministryActionConfirming = false;
            alert('This direction is already active.');
            return;
        }
        const opposingLabel = existingDir === 'strengthen' ? 'Strengthen Unions'
            : existingDir === 'deregulate' ? 'Deregulate Labor' : 'current labor policy';
        if (!confirm(`This will immediately cancel your active ${opposingLabel} with no fund refund. Continue?`)) {
            _ministryActionConfirming = false;
            return;
        }
        await handleLaborPolicyConflict(direction);
    }

    // Build stat effects from the direction's baseEffects
    const scale = getUseCountScale(useCount);
    const statEffects = dirConfig.baseEffects.map(eff => ({
        stat_key: eff.stat_key,
        direction: eff.direction,
        rate: Math.round((eff.scalable ? eff.rate * scale : eff.rate) * 100) / 100,
        delay_ticks: eff.delayOverride !== undefined ? eff.delayOverride : config.delay,
        duration_ticks: eff.durationOverride !== undefined ? eff.durationOverride : config.duration,
        target: eff.target || 'nation'
    }));

    // Optimistic UI
    row.classList.remove('selected');
    row.classList.add('active');
    const btns = document.getElementById(actionId + '-btns');
    const dirLabel = direction === 'strengthen' ? 'STRENGTHEN UNIONS' : 'DEREGULATE LABOR';
    if (btns) btns.innerHTML = `<div class="ministry-action__active-indicator" style="color:#5cb85c;">● ACTIVE — ${dirLabel}</div>`;
    const selectorEl = document.getElementById('labor-direction-selector');
    if (selectorEl) selectorEl.innerHTML = '';

    const actionData = {
        use_count: useCount,
        scale: scale,
        direction: direction,
        one_time_cost: oneTimeCost,
        budget_per_tick: 0
    };

    try {
        const { data: actionLogId, error } = await _supabase.rpc('execute_ministry_action', {
            p_nation_id: currentNation.id,
            p_faction_id: currentFaction.id,
            p_ministry_key: 'labor',
            p_action_key: 'laborPolicy',
            p_ap_cost: apCost,
            p_applied_at_tick: currentTick,
            p_stat_effects: statEffects,
            p_action_data: actionData
        });

        if (error) throw error;

        // === RPC succeeded — action is committed. Everything below is best-effort. ===

        // Deduct one-time cost from discretionary fund (best-effort — action already committed)
        try { await deductDiscretionaryFund('labor', mData, balance, oneTimeCost); }
        catch (_) { /* fund deduction failed — will be stale until page reload */ }

        // Update local state
        const prevAP = currentFaction.action_points || 0;
        currentFaction.action_points = Math.max(0, prevAP - apCost);
        ministryActionUseCounts[countKey] = useCount + 1;
        activeMinistryActions[actionId] = direction; // store direction as value
        _laborSelectedDirection = null;
        sessionStorage.removeItem('nationhood_state');

        // Fire event (non-blocking)
        try {
            const { ministerName, partyName } = await fetchMinisterInfo('labor');
            await _supabase.rpc('fire_system_event', {
                p_trigger_key: dirConfig.triggerKey,
                p_nation_id: currentNation.id,
                p_tick: currentTick,
                p_placeholders: {
                    minister_name: ministerName,
                    party: partyName,
                    nation: currentNation.name || 'Unknown',
                    direction: direction,
                    cost: formatUpfrontCost(oneTimeCost)
                }
            });
        } catch (_) { /* best-effort */ }
        await insertMinisterActionTimelineEvent(
            'labor',
            `${config.name} (${direction === 'strengthen' ? 'Strengthen Unions' : 'Deregulate Labor'})`
        );

    } catch (e) {
        // Revert optimistic UI — only reached if RPC itself failed
        row.classList.remove('active');
        if (btns) btns.innerHTML = `<div class="ministry-action__btn-execute" onclick="event.stopPropagation();openLaborPolicySelector()">▶ FREE</div>`;
        alert('Action failed: ' + (e.message || 'Unknown error'));
    } finally {
        _ministryActionConfirming = false;
    }
}

function buildEnergyActionRows(isMyMinistry) {
    const config = MINISTRY_ACTIONS.energy;
    const reserveMb = Number(currentNation?.strategic_oil_reserve_mb ?? 0);
    const pop = currentNation?.population ?? 20000000;
    const reserveCap = Math.round((pop / 1000000) * 20);
    const ap = currentFaction?.action_points ?? 0;

    const ministry = ministryData.find(m => m.ministry_key === 'energy');
    const discretionaryBalance = Number(ministry?.discretionary_balance || 0);

    let html = `<div class="ministry-card__actions-label" style="display:flex;justify-content:space-between;align-items:center;">
        <span>ACTIONS</span>
        <span style="font-family:var(--font-mono);font-size:8px;font-weight:600;color:var(--text-muted);letter-spacing:0.03em;">Strategic Oil Reserve: <span style="color:${reserveMb > 0 ? '#c8a64e' : 'var(--text-dim)'}">${reserveMb} Mb</span> / ${reserveCap} Mb</span>
    </div>`;

    // Action 1: Expand Infrastructure (shared execute flow)
    const expandAction = config?.actions?.find(a => a.id === 'expandInfrastructure');
    html += buildExpandInfrastructureActionRow({
        ministryKey: 'energy',
        action: expandAction,
        canUse,
        ap,
        pop,
        discretionaryBalance
    });

    // Action 2: Build Oil Reserves
    const buildApCosts = [2, 3, 5, 7];
    const buildUseCount = _energyBuildUseCount ?? 0;
    const buildApCost = buildApCosts[Math.min(buildUseCount, 3)];
    const activeCycles = _energyBuildCycles.length;

    // Calculate accumulation rate from energy + industry stats (19-col schema)
    const energyStat = Number(currentNation?.energy ?? 50);
    const industryStat = Number(currentNation?.industry ?? 50);
    const buildRate = Math.round((energyStat + industryStat) * 0.5);

    // Cap check
    const atCap = reserveMb >= reserveCap;
    const nearCap = reserveMb >= reserveCap * 0.8;
    const capRemaining = Math.max(0, reserveCap - reserveMb);

    let buildDesc = 'Divert domestic oil supply into strategic government reserves. Reduces export supply by 3% for 6 ticks.';
    let buildApLabel = `FREE${buildUseCount > 0 ? ' (use ' + (buildUseCount + 1) + ')' : ''}`;
    let buildStateClass = '';
    let buildBtnHtml = '';

    if (atCap) {
        buildStateClass = ' disabled';
        buildDesc = 'Reserve at maximum capacity. Release reserves before building further.';
        buildApLabel = '<span style="color:#3a3a2e;">AT CAPACITY</span>';
        buildBtnHtml = `<div style="font-family:var(--font-mono);font-size:7.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;background:#1e1e1a;border:1px solid rgba(255,255,255,0.07);color:#3a3a2e;padding:4px 9px;cursor:not-allowed;white-space:nowrap;">LOCKED</div>`;
    } else if (activeCycles > 0) {
        // Show active state with cycle count
        const maxTicks = Math.max(..._energyBuildCycles.map(c => c.ticks_remaining));
        buildDesc = `Accumulating reserves. ${activeCycles} cycle${activeCycles > 1 ? 's' : ''} active. ${maxTicks} tick${maxTicks !== 1 ? 's' : ''} remaining. Reserve: ${reserveMb} Mb.`;
        buildApLabel = `<span style="color:#5cb85c;">BUILDING</span>`;
        // Can still stack another cycle
        if (canUse && ap >= buildApCost) {
            buildBtnHtml = `<div class="ministry-action__btn-execute" onclick="event.stopPropagation();openBuildOilReserves()">▶ FREE</div>`;
        } else if (!canUse) {
            buildBtnHtml = '';
        } else {
            buildBtnHtml = `<div class="ministry-action__btn-execute" style="opacity:0.4;cursor:not-allowed;">▶ FREE</div>`;
        }
    } else if (!canUse) {
        buildStateClass = ' disabled';
        buildBtnHtml = '';
    } else if (ap < buildApCost) {
        buildStateClass = ' disabled';
        buildBtnHtml = `<div class="ministry-action__btn-execute" style="opacity:0.4;cursor:not-allowed;">▶ FREE</div>`;
    } else {
        buildBtnHtml = `<div class="ministry-action__btn-execute" onclick="event.stopPropagation();openBuildOilReserves()">▶ FREE</div>`;
    }

    const buildTagsHtml = `<span class="tag tag--positive" style="color:#c8a64e;border-color:#c8a64e44;">RESERVE +${buildRate} Mb/TICK</span>`
        + `<span class="tag tag--negative">COST OF LIVING ↑</span>`
        + `<span class="tag tag--negative">ENERGY ↓</span>`
        + `<span class="tag tag--neutral">NO TICK COST</span>`;

    let buildExtraHtml = '';
    if (nearCap && !atCap) {
        buildExtraHtml = `<div style="font-family:var(--font-mono);font-size:7px;color:#c8a64e;margin-top:2px;">Reserve approaching capacity — ${capRemaining} Mb remaining.</div>`;
    }

    html += `<div class="ministry-action${buildStateClass}" id="energy-buildOilReserves">
        <div class="ministry-action__top">
            <span class="ministry-action__name">Build Oil Reserves</span>
            <span class="ministry-action__ap-cost">${buildApLabel}</span>
        </div>
        <div class="ministry-action__desc">${escapeHtml(buildDesc)}${buildExtraHtml}</div>
        <div class="ministry-action__bottom">
            <div class="ministry-action__tags">${buildTagsHtml}</div>
            <div id="energy-buildOilReserves-btns">${buildBtnHtml}</div>
        </div>
        <div id="energy-build-confirm" style="display:none;"></div>
    </div>`;

    // Action 3: Release Oil Reserves
    const releaseApCost = 2; // flat cost
    const noReserves = reserveMb <= 0;
    const tooLow = reserveMb < 10;
    const releaseActive = activeMinistryActions?.['energy-releaseOilReserves'] || false;

    let releaseDesc = 'Deploy strategic oil reserves into the domestic market to stabilise fuel prices and ease energy costs.';
    let releaseApLabelText = `FREE`;
    let releaseStateClass = '';
    let releaseBtnHtml = '';

    if (releaseActive) {
        releaseStateClass = ' active';
        releaseDesc = 'Oil reserves deployed — effects active. Cost of living, standard of living, GDP, and energy adjusting over 4 ticks.';
        releaseApLabelText = `<span style="color:#5cb85c;">● ACTIVE</span>`;
        releaseBtnHtml = '<div class="ministry-action__active-indicator">● ACTIVE</div>';
    } else if (noReserves) {
        releaseStateClass = ' disabled';
        releaseDesc = 'No oil reserves held. Use Build Oil Reserves to accumulate.';
        releaseApLabelText = '<span style="color:#3a3a2e;">NO RESERVES</span>';
        releaseBtnHtml = `<div style="font-family:var(--font-mono);font-size:7.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;background:#1e1e1a;border:1px solid rgba(255,255,255,0.07);color:#3a3a2e;padding:4px 9px;cursor:not-allowed;white-space:nowrap;">LOCKED</div>`;
    } else if (tooLow) {
        releaseStateClass = ' disabled';
        releaseDesc = `Reserve too low for release. Minimum 10 Mb required. Current: ${reserveMb} Mb.`;
        releaseBtnHtml = `<div class="ministry-action__btn-execute" style="opacity:0.4;cursor:not-allowed;" title="Minimum release is 10 Mb">▶ FREE</div>`;
    } else if (!canUse) {
        releaseStateClass = ' disabled';
        releaseBtnHtml = '';
    } else if (ap < releaseApCost) {
        releaseStateClass = ' disabled';
        releaseBtnHtml = `<div class="ministry-action__btn-execute" style="opacity:0.4;cursor:not-allowed;">▶ FREE</div>`;
    } else {
        releaseBtnHtml = `<div class="ministry-action__btn-execute" onclick="event.stopPropagation();openReleaseOilReserves()">▶ FREE</div>`;
    }

    const releaseTagsHtml = `<span class="tag tag--positive">COST OF LIVING ↓</span>`
        + `<span class="tag tag--positive">STD LIVING ↑</span>`
        + `<span class="tag tag--positive">GDP ↑</span>`
        + `<span class="tag tag--positive">ENERGY ↑</span>`;

    html += `<div class="ministry-action${releaseStateClass}" id="energy-releaseOilReserves">
        <div class="ministry-action__top">
            <span class="ministry-action__name">Release Oil Reserves</span>
            <span class="ministry-action__ap-cost">${releaseApLabelText}</span>
        </div>
        <div class="ministry-action__desc">${escapeHtml(releaseDesc)}</div>
        <div class="ministry-action__bottom">
            <div class="ministry-action__tags">${releaseTagsHtml}</div>
            <div id="energy-releaseOilReserves-btns">${releaseBtnHtml}</div>
        </div>
    </div>`;

    // Release confirm panel (hidden by default, shown when player clicks release)
    html += `<div id="energy-release-confirm" style="display:none;"></div>`;

    // SOE placeholder — shared with the other 6 SOE-eligible ministries.
    html += renderSoeActionCard();

    return html;
}

// Confirm and execute Build Oil Reserves
async function confirmBuildOilReserves() {
    if (_energyBuildConfirming) return;
    if (!currentFaction || !currentNation) return;
    if (!isMyMinistryByKey('energy')) return;

    const buildApCosts = [2, 3, 5, 7];
    const useCount = _energyBuildUseCount ?? 0;
    const apCost = buildApCosts[Math.min(useCount, 3)];
    const ap = currentFaction?.action_points ?? 0;
    if (ap < apCost) { alert('Unexpected error.'); return; }

    const reserveMb = Number(currentNation?.strategic_oil_reserve_mb ?? 0);
    const pop = currentNation?.population ?? 20000000;
    const reserveCap = Math.round((pop / 1000000) * 20);
    if (reserveMb >= reserveCap) { alert('Reserve at maximum capacity. Release reserves before building further.'); return; }

    // Calculate rate from energy + industry stats (19-col schema)
    const energyStat = Number(currentNation?.energy ?? 50);
    const industryStat = Number(currentNation?.industry ?? 50);
    const buildRate = Math.round((energyStat + industryStat) * 0.5);

    _energyBuildConfirming = true;
    try {
        // Deduct AP
        const newAP = Math.max(0, ap - apCost);
        const { error: apErr } = await _supabase
            .from('factions')
            .update({ action_points: newAP })
            .eq('id', currentFaction.id);
        if (apErr) throw apErr;

        // Insert build cycle
        const { error: cycleErr } = await _supabase
            .from('energy_oil_build_cycles')
            .insert({
                nation_id: currentNation.id,
                faction_id: currentFaction.id,
                activated_on_tick: currentTick,
                ticks_remaining: 6,
                rate_per_tick: buildRate,
                is_active: true
            });
        if (cycleErr) {
            // Refund AP on failure
            await _supabase.from('factions').update({ action_points: ap }).eq('id', currentFaction.id);
            throw cycleErr;
        }

        // Fire event (best-effort)
        const { error: buildEvtErr } = await _supabase.rpc('fire_system_event', {
            p_nation_id: currentNation.id,
            p_trigger_key: 'energy_build_oil_reserves',
            p_tick: currentTick,
            p_placeholders: { rate_per_tick: buildRate, ap_cost: apCost, active_cycles: (_energyBuildCycles.length + 1) }
        });
        if (buildEvtErr) console.warn('[Energy] Build event failed:', buildEvtErr.message);

        // Update local state
        currentFaction.action_points = newAP;
        _energyBuildUseCount = useCount + 1;
        _energyBuildCycles.push({
            activated_on_tick: currentTick,
            ticks_remaining: 6,
            rate_per_tick: buildRate,
            is_active: true
        });

        // Close confirm panel and re-render
        closeBuildOilReserves();
        await refreshGovernmentUI();

    } catch (err) {
        alert('Build Oil Reserves failed: ' + (err.message || 'Unknown error'));
    } finally {
        _energyBuildConfirming = false;
    }
}

// Execute Release Oil Reserves
async function confirmReleaseOilReserves() {
    if (_energyReleaseConfirming) return;
    if (!currentFaction || !currentNation) return;
    if (!isMyMinistryByKey('energy')) return;

    const releaseApCost = 2;
    const ap = currentFaction?.action_points ?? 0;
    if (ap < releaseApCost) { alert('Unexpected error.'); return; }

    const reserveMb = Number(currentNation?.strategic_oil_reserve_mb ?? 0);
    const amount = _energyReleaseAmount;
    if (amount < 10) { alert('Minimum release is 10 Mb.'); return; }
    if (amount > reserveMb) { alert(`Insufficient reserves. Current reserve: ${reserveMb} Mb.`); return; }

    _energyReleaseConfirming = true;
    try {
        // Calculate scaled effects (baseline = 72 Mb)
        const baseline = 72;
        const scale = amount / baseline;
        const statEffects = [
            { stat_key: 'cost_of_living',    direction: 'down', rate: Math.round(0.3 * scale * 100) / 100, delay_ticks: 0, duration_ticks: 4, target: 'nation' },
            { stat_key: 'standard_of_living', direction: 'up',  rate: Math.round(0.1 * scale * 100) / 100, delay_ticks: 0, duration_ticks: 4, target: 'nation' },
            { stat_key: 'gdp_growth',        direction: 'up',   rate: Math.round(0.1 * scale * 100) / 100, delay_ticks: 0, duration_ticks: 4, target: 'nation' },
            { stat_key: 'energy',            direction: 'up',   rate: Math.round(0.1 * scale * 100) / 100, delay_ticks: 0, duration_ticks: 4, target: 'nation' }
        ];

        // Minister approval +1 if cost of living was high before release
        const colBefore = Number(currentNation?.cost_of_living ?? 50);
        if (colBefore > 60) {
            statEffects.push({ stat_key: 'minister_approval', direction: 'up', rate: 1, delay_ticks: 0, duration_ticks: 1, target: 'minister' });
        }

        const actionData = {
            use_count: 0,
            scale: 1.0,
            budget_per_tick: 0,
            one_time_cost: 0,
            minister_approval: colBefore > 60 ? 1 : 0,
            release_amount: amount,
            reserve_remaining: reserveMb - amount
        };

        // Execute via RPC — atomically deducts AP, inserts action log, and deducts reserve
        const newReserve = Math.max(0, reserveMb - amount);
        const { error: rpcErr } = await _supabase.rpc('execute_ministry_action', {
            p_nation_id: currentNation.id,
            p_faction_id: currentFaction.id,
            p_ministry_key: 'energy',
            p_action_key: 'releaseOilReserves',
            p_ap_cost: releaseApCost,
            p_applied_at_tick: currentTick,
            p_stat_effects: statEffects,
            p_action_data: actionData,
            p_nation_stat_updates: { strategic_oil_reserve_mb: newReserve }
        });
        if (rpcErr) throw rpcErr;

        // Update local state
        currentFaction.action_points = Math.max(0, ap - releaseApCost);
        currentNation.strategic_oil_reserve_mb = newReserve;

        // Fire event (best-effort)
        const { error: releaseEvtErr } = await _supabase.rpc('fire_system_event', {
            p_nation_id: currentNation.id,
            p_trigger_key: 'energy_release_oil_reserves',
            p_tick: currentTick,
            p_placeholders: { release_mb: amount, reserve_remaining_mb: newReserve }
        });
        if (releaseEvtErr) console.warn('[Energy] Release event failed:', releaseEvtErr.message);

        closeReleaseOilReserves();
        await refreshGovernmentUI();

    } catch (err) {
        alert('Release failed: ' + (err.message || 'Unknown error'));
    } finally {
        _energyReleaseConfirming = false;
    }
}

function _curriculumAxisLabel(axisId) {
    const a = CURRICULUM_AXES.find(x => x.id === axisId);
    return a ? `${a.left} / ${a.right}` : axisId;
}

// ==================== CURRICULUM MODAL ====================

let _curriculumModalOpen = false;

function openCurriculumModal() {
    if (_curriculumModalOpen) return;
    if (!isMyMinistryByKey('education')) return;
    _curriculumSelections = [];
    _curriculumModalOpen = true;
    renderCurriculumModal();
}

function closeCurriculumModal() {
    _curriculumModalOpen = false;
    const overlay = document.getElementById('curriculum-modal-overlay');
    if (overlay) overlay.remove();
}

function selectCurriculumDirection(axisId, direction, label) {
    // Toggle: if already selected with same axis+direction, remove it
    const existingIdx = _curriculumSelections.findIndex(s => s.axisId === axisId && s.direction === direction);
    if (existingIdx !== -1) {
        _curriculumSelections.splice(existingIdx, 1);
        renderCurriculumModal();
        return;
    }
    // If same axis but different direction, replace it
    const sameAxisIdx = _curriculumSelections.findIndex(s => s.axisId === axisId);
    if (sameAxisIdx !== -1) {
        _curriculumSelections[sameAxisIdx] = { axisId, direction, label };
        renderCurriculumModal();
        return;
    }
    // If already have 2 selections, replace the oldest
    if (_curriculumSelections.length >= 2) {
        _curriculumSelections.shift();
    }
    _curriculumSelections.push({ axisId, direction, label });
    renderCurriculumModal();
}

function renderCurriculumModal() {
    let overlay = document.getElementById('curriculum-modal-overlay');
    if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'curriculum-modal-overlay';
        overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center;';
        overlay.addEventListener('click', (e) => { if (e.target === overlay) closeCurriculumModal(); });
        document.body.appendChild(overlay);
    }

    const sels = _curriculumSelections;
    const pop = currentNation?.population || 20_000_000;
    const budgetPerTick = Math.round((pop / 1_000_000) * 1_000_000 / 12);
    const budgetFmt = budgetPerTick >= 1_000_000 ? '$' + (budgetPerTick / 1_000_000).toFixed(1) + 'M' : budgetPerTick >= 1000 ? '$' + (budgetPerTick / 1000).toFixed(0) + 'K' : '$' + budgetPerTick;

    let axisRowsHtml = '';
    CURRICULUM_AXES.forEach(axis => {
        const leftSelected = sels.some(s => s.axisId === axis.id && s.direction === -1);
        const rightSelected = sels.some(s => s.axisId === axis.id && s.direction === 1);

        const leftStyle = leftSelected
            ? 'background:var(--amber-faint);border:1px solid var(--amber-border);color:var(--accent);'
            : 'background:transparent;border:1px solid var(--border-0);color:var(--text-muted);';
        const rightStyle = rightSelected
            ? 'background:var(--amber-faint);border:1px solid var(--amber-border);color:var(--accent);'
            : 'background:transparent;border:1px solid var(--border-0);color:var(--text-muted);';

        axisRowsHtml += `
            <div style="margin-bottom:8px;">
                <div style="font-family:'JetBrains Mono',monospace;font-size:8px;text-transform:uppercase;color:var(--text-muted);letter-spacing:0.06em;margin-bottom:4px;">${axis.left} / ${axis.right}</div>
                <div style="display:flex;gap:6px;">
                    <div onclick="selectCurriculumDirection('${axis.id}', -1, '${axis.left}')" style="flex:1;padding:6px 8px;text-align:center;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:600;letter-spacing:0.04em;${leftStyle}" title="${escapeHtml(axis.tip)}">${axis.left.toUpperCase()}</div>
                    <div onclick="selectCurriculumDirection('${axis.id}', 1, '${axis.right}')" style="flex:1;padding:6px 8px;text-align:center;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:600;letter-spacing:0.04em;${rightStyle}" title="${escapeHtml(axis.tip)}">${axis.right.toUpperCase()}</div>
                </div>
            </div>`;
    });

    const selCount = sels.length;
    let confirmHtml;
    if (selCount === 0) {
        confirmHtml = `
