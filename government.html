<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Government | Nationhood Alpha</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .administration-box {
            background: linear-gradient(135deg, var(--bg-panel) 0%, var(--bg-card) 100%);
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .administration-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-main);
        }
        .administration-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .administration-subtitle { font-size: 0.85rem; color: var(--text-secondary); }
        .administration-content {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }
        .admin-section { background: var(--bg-panel); border-radius: 8px; padding: 16px; }
        .admin-section-title { font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        .admin-person-name { font-size: 1.1rem; color: var(--text-primary); font-weight: bold; margin-bottom: 4px; }
        .admin-person-details { font-size: 0.8rem; color: var(--text-secondary); }
        .admin-person-party { color: var(--accent); font-weight: bold; }
        .admin-approval { text-align: center; }
        .admin-approval-value { font-size: 2rem; font-weight: bold; color: var(--green); }
        .admin-approval-value.medium { color: var(--orange); }
        .admin-approval-value.low { color: var(--red); }
        .admin-approval-label { font-size: 0.75rem; color: var(--text-secondary); margin-top: 4px; }
        .coalition-parties { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
        .coalition-party-tag { background: var(--bg-card); padding: 8px 16px; border-radius: 6px; font-size: 0.9rem; color: var(--text-primary); border: 1px solid var(--border-main); }
        .coalition-party-tag .seats { color: var(--green); font-weight: bold; margin-left: 6px; }
        .coalition-divider { color: var(--text-dim); font-size: 1.2rem; padding: 0 4px; display: flex; align-items: center; }
        .ministry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .ministry-card {
            background: var(--bg-panel);
            border-radius: 8px;
            padding: 16px;
            border-left: 4px solid var(--accent);
            position: relative;
        }
        .ministry-card.vacant { border-left-color: var(--text-dim); }
        .ministry-title { font-size: 0.8rem; font-weight: bold; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
        .minister-name { font-size: 1rem; color: var(--text-primary); font-weight: bold; margin-bottom: 4px; }
        .minister-details { font-size: 0.8rem; color: var(--text-secondary); }
        .minister-party { color: var(--green); }
        .no-government { background: var(--bg-panel); border-left: 4px solid var(--orange); border-radius: 8px; padding: 20px; text-align: center; }
        .no-government-title { color: var(--orange); font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; }
        .no-government-desc { color: var(--text-secondary); font-size: 0.85rem; }

        /* Ministry action buttons */
        .ministry-actions {
            display: flex; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border-main);
            flex-wrap: wrap; align-items: center;
        }
        .ministry-btn {
            padding: 6px 14px; border: none; border-radius: 4px; font-size: 0.75rem;
            font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px;
            transition: all 0.2s; display: inline-flex; align-items: center; gap: 4px;
        }
        .ministry-btn:hover { opacity: 0.85; transform: translateY(-1px); }
        .ministry-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .ministry-btn.assign { background: var(--green); color: white; }
        .ministry-btn.purge { background: var(--red); color: white; }
        .ministry-btn.request { background: var(--blue); color: white; }
        .ministry-btn.unrequest { background: var(--text-muted); color: white; }
        .ap-cost { opacity: 0.7; font-size: 0.65rem; }

        /* Request badges & list */
        .request-badge {
            position: absolute; top: 8px; right: 8px;
            background: var(--blue); color: white; font-size: 0.65rem;
            padding: 2px 8px; border-radius: 10px; font-weight: bold;
        }
        .request-list { margin-top: 8px; }
        .request-item {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--bg-card); border-radius: 4px; padding: 6px 10px; margin-bottom: 4px;
            font-size: 0.8rem; border-left: 3px solid var(--blue);
        }
        .request-item-party { color: var(--blue); font-weight: bold; }
        .request-item-actions { display: flex; gap: 4px; }
        .req-btn {
            padding: 3px 8px; border: none; border-radius: 3px;
            font-size: 0.7rem; font-weight: bold; cursor: pointer;
        }
        .req-btn.deny { background: var(--red); color: white; }
        .max-requests-note { font-size: 0.7rem; color: var(--text-secondary); margin-left: 4px; }

        /* Assign Minister Modal */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--bg-panel); border: 2px solid var(--accent); border-radius: 12px;
            padding: 24px; max-width: 650px; width: 90%; max-height: 85vh; overflow-y: auto;
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border-main);
        }
        .modal-title { font-size: 1.1rem; color: var(--accent); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .modal-close { background: none; border: none; color: var(--text-secondary); font-size: 1.5rem; cursor: pointer; }
        .modal-close:hover { color: var(--text-primary); }
        .modal-subtitle { color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 16px; }
        .candidate-card {
            background: var(--bg-card); border: 2px solid var(--border-main); border-radius: 8px; padding: 16px;
            margin-bottom: 10px; cursor: pointer; transition: all 0.2s;
            display: flex; justify-content: space-between; align-items: center;
        }
        .candidate-card:hover { border-color: var(--accent); background: var(--bg-hover); }
        .candidate-card.selected { border-color: var(--accent); box-shadow: 0 0 12px var(--shadow-accent); }
        .candidate-name { font-size: 1rem; font-weight: bold; color: var(--text-primary); }
        .candidate-details { font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px; }
        .candidate-party-tag { font-weight: bold; }
        .candidate-party-tag.ruling { color: var(--red); }
        .candidate-party-tag.other { color: var(--green); }
        .ruling-label { font-size: 0.7rem; color: var(--red); font-weight: bold; }
        .modal-footer {
            display: flex; justify-content: flex-end; gap: 12px;
            margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border-main);
        }
        .btn-cancel { padding: 12px 24px; background: var(--bg-card); border: none; border-radius: 6px; color: var(--text-secondary); cursor: pointer; }
        .btn-cancel:hover { background: var(--bg-hover); color: var(--text-primary); }
        .btn-submit {
            padding: 12px 24px; background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            border: none; border-radius: 6px; color: var(--bg-body); font-weight: bold; cursor: pointer;
        }
        .btn-submit:disabled { background: var(--border-main); color: var(--text-muted); cursor: not-allowed; }

        /* ===== NO GOVERNMENT — FORMATION IN PROGRESS ===== */
        .formation-box {
            background: linear-gradient(135deg, #1a1000 0%, #1a0800 100%);
            border: 2px solid var(--red);
            border-radius: 12px;
            padding: 0;
            margin-bottom: 24px;
            overflow: hidden;
        }
        .formation-header {
            background: linear-gradient(90deg, #2a0a0a 0%, #1a0000 100%);
            padding: 24px 28px 20px;
            text-align: center;
            border-bottom: 1px solid #3a1a1a;
        }
        .formation-icon { font-size: 2.8rem; margin-bottom: 8px; }
        .formation-title {
            font-size: 1.4rem; font-weight: bold; color: var(--red);
            text-transform: uppercase; letter-spacing: 3px; margin-bottom: 6px;
        }
        .formation-subtitle { font-size: 0.85rem; color: #aa8866; }

        .formation-body { padding: 24px 28px; }

        /* Countdown bar */
        .formation-countdown {
            background: #111; border: 1px solid #2a2a2a; border-radius: 10px;
            padding: 18px 20px; margin-bottom: 20px; text-align: center;
        }
        .countdown-label {
            font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px;
            color: #888; font-weight: 600; margin-bottom: 10px;
        }
        .countdown-track {
            width: 100%; height: 10px; background: #222; border-radius: 5px;
            overflow: hidden; margin-bottom: 10px;
        }
        .countdown-fill {
            height: 100%; border-radius: 5px;
            transition: width 0.5s ease;
        }
        .countdown-fill.safe { background: linear-gradient(90deg, #4CAF50, #66BB6A); }
        .countdown-fill.warning { background: linear-gradient(90deg, #FF9800, #FFB74D); }
        .countdown-fill.critical { background: linear-gradient(90deg, #f44336, #FF5252); animation: pulse-bar 1.5s infinite; }
        @keyframes pulse-bar { 0%,100% { opacity:1; } 50% { opacity:0.6; } }
        .countdown-text {
            font-family: monospace; font-size: 1.3rem; font-weight: 700;
        }
        .countdown-text.safe { color: #4CAF50; }
        .countdown-text.warning { color: #FF9800; }
        .countdown-text.critical { color: #f44336; }
        .countdown-detail { font-size: 0.75rem; color: #666; margin-top: 4px; }

        /* Penalty cards */
        .formation-penalties {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;
            margin-bottom: 20px;
        }
        .penalty-card {
            background: #111; border: 1px solid #2a1a1a; border-radius: 8px;
            padding: 14px; text-align: center;
        }
        .penalty-card.active-penalty { border-color: var(--red); }
        .penalty-card.accrued { border-color: #ff9800; }
        .penalty-card.snap { border-color: #f44336; background: #1a0a0a; }
        .penalty-value { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
        .penalty-value.red { color: var(--red); }
        .penalty-value.orange { color: #ff9800; }
        .penalty-label { font-size: 0.68rem; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .penalty-detail { font-size: 0.72rem; color: #666; margin-top: 6px; }

        /* Snap election warning */
        .snap-warning {
            background: linear-gradient(135deg, #1a0808, #2a0a0a);
            border: 1px solid #f44336; border-radius: 8px;
            padding: 16px 20px; margin-bottom: 20px;
            display: flex; align-items: center; gap: 16px;
        }
        .snap-warning.imminent {
            animation: pulse-border 1.5s infinite;
        }
        @keyframes pulse-border {
            0%,100% { border-color: #f44336; box-shadow: 0 0 0 rgba(244,67,54,0); }
            50% { border-color: #ff8a80; box-shadow: 0 0 20px rgba(244,67,54,0.3); }
        }
        .snap-warning-icon { font-size: 1.8rem; flex-shrink: 0; }
        .snap-warning-content { flex: 1; }
        .snap-warning-title { font-size: 0.9rem; font-weight: 700; color: #f44336; margin-bottom: 4px; }
        .snap-warning-desc { font-size: 0.8rem; color: #cc8888; line-height: 1.4; }
        .snap-penalty-tags { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
        .snap-penalty-tag {
            font-family: monospace; font-size: 0.7rem; font-weight: 700;
            padding: 3px 10px; border-radius: 4px;
        }
        .snap-penalty-tag.first { background: #2a0a0a; color: #f44336; border: 1px solid #f44336; }
        .snap-penalty-tag.second { background: #2a1a0a; color: #ff9800; border: 1px solid #ff9800; }

        /* CTA */
        .formation-cta { text-align: center; padding-top: 4px; }
        .formation-cta-btn {
            display: inline-block; padding: 12px 32px;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: #121212; border-radius: 8px; font-weight: bold;
            font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1.5px;
            cursor: pointer; transition: all 0.2s; border: none;
            font-family: inherit;
        }
        .formation-cta-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(200,170,110,0.3); }
        .formation-cta-sub { font-size: 0.75rem; color: #666; margin-top: 8px; }

        @media (max-width: 768px) {
            .formation-penalties { grid-template-columns: 1fr; }
            .snap-warning { flex-direction: column; text-align: center; }
            .formation-header { padding: 18px 16px 14px; }
            .formation-body { padding: 16px; }
        }
    </style>
</head>
<body>

<div id="top-bar"></div>

<div id="content-area">
    <div class="loading-container">
        <div class="loading-spinner"></div>
        <div>Loading government data...</div>
    </div>
</div>

<!-- Assign Minister Modal -->
<div class="modal-overlay" id="assign-modal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title" id="assign-modal-title">Assign Minister</div>
            <button class="modal-close" onclick="closeAssignModal()">&times;</button>
        </div>
        <div class="modal-subtitle">Select a candidate to appoint to this ministry.</div>
        <div id="assign-candidates"></div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeAssignModal()">Cancel</button>
            <button class="btn-submit" id="assign-confirm-btn" disabled onclick="confirmAssign()">Appoint Minister</button>
        </div>
    </div>
</div>

<script src="js/supabase-client.js"></script>
<script src="js/common.js"></script>
<script src="js/game-common.js"></script>
<script>
/**
 * Government Page
 * Displays government structure, administration, cabinet, and parliament.
 * Autocracy: ruling faction can ASSIGN/PURGE ministers; others can REQUEST.
 */

const MINISTRY_NAMES = {
    prime_minister: 'Prime Minister',
    interior: 'Ministry of the Interior',
    foreign: 'Foreign Ministry',
    defense: 'Ministry of Defense',
    finance: 'Ministry of Finance',
    education: 'Ministry of Education',
    healthcare: 'Ministry of Healthcare',
    labor: 'Ministry of Labor',
    justice: 'Ministry of Justice',
    transportation: 'Ministry of Transportation',
    security: 'Ministry of Security'
};

const MINISTRY_KEYS_CABINET = [
    'prime_minister',
    'interior','foreign','defense','finance',
    'education','healthcare','labor','justice','transportation'
];

const FIRST_NAMES_POOL = [
    'Carlos','Diego','Fernando','Héctor','Marcos','Ramón','José','Luis','Miguel',
    'Antonio','Roberto','Francisco','Eduardo','Pablo','Alejandro','Rafael','Gabriel',
    'Santiago','Andrés','Javier','Ricardo','Tomás','Emilio','Sergio','Nicolás',
    'Arturo','Enrique','Oscar','Felipe','Gonzalo','Ignacio','Mateo','Dante'
];
const LAST_NAMES_POOL = [
    'Velasco','Salazar','Guerrero','Ríos','Morales','Torres','Mendoza','Castillo',
    'Herrera','Vargas','Reyes','Cruz','Navarro','Delgado','Ortiz','Romero','Flores',
    'Ramírez','Guzmán','Medina','Soto','Pacheco','Ibarra','Carrasco','Espinoza',
    'Montenegro','Echeverría','Valdez','Córdoba','Aguilar','Paredes','Lara'
];

let currentNation = null;
let currentFaction = null;
let partyData = [];
let coalitionData = null;
let ministryData = [];
let allParties = [];
let allPartySeats = {};
let isAutocracy = false;
let isRulingFaction = false;
let rulingFactionId = null;
let ministryRequests = [];
let currentTick = 0;
let lastElectionTick = null;

// Assign modal state
let assignMinistryKey = null;
let selectedCandidate = null;
let generatedCandidates = [];

initPage('government', async (state) => {
    const { nation, faction } = state;
    currentNation = nation;
    currentFaction = faction;

    if (!nation) {
        document.getElementById('content-area').innerHTML = '<div class="placeholder-panel"><div class="ph-icon">🏛️</div><h3>No Nation Selected</h3><p>Your party is not assigned to a nation yet.</p></div>';
        return;
    }

    isAutocracy = (nation.government_type === 'Autocracy');

    // Load current tick
    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    currentTick = shard?.current_tick || 0;

    await renderGovernmentPage();
});

async function renderGovernmentPage() {
    document.getElementById('content-area').innerHTML = '<div class="panel-padding"><div class="loading-container" style="height:200px;"><div class="loading-spinner"></div><div>Loading government data...</div></div></div>';

    try {
        const [electionData, coalition, ministries, partiesRes] = await Promise.all([
            fetchLatestElection(),
            fetchActiveCoalition(_supabase, currentNation.id),
            fetchMinistries(),
            _supabase.from('factions')
                .select('id, faction_name, is_npc, seats, approval_rating, loyalty, action_points')
                .eq('nation_id', currentNation.id).eq('faction_type', 'party')
        ]);

        // Fetch active Head of Government with trait
        const { data: activeHOG } = await _supabase
            .from('head_of_government')
            .select('*, leader_traits(*)')
            .eq('nation_id', currentNation.id)
            .eq('active', true)
            .maybeSingle();

        coalitionData = coalition;
        ministryData = ministries;
        partyData = electionData?.results?.votes || [];
        allParties = partiesRes.data || [];
        lastElectionTick = electionData?.election_tick || null;

        // Refresh current faction AP
        const freshFaction = allParties.find(p => p.id === currentFaction?.id);
        if (freshFaction && currentFaction) {
            currentFaction.action_points = freshFaction.action_points;
        }

        // Seat loading via game-common.js
        const seatData = await loadSeats(_supabase, currentNation.id, isAutocracy, allParties, currentFaction?.id);
        allPartySeats = seatData.allPartySeats;

        // Detect ruling faction for autocracy
        if (isAutocracy) {
            const hf = await detectHeadFaction(_supabase, currentNation.id, allParties, allPartySeats, currentFaction?.id);
            rulingFactionId = hf.headFactionId;
            isRulingFaction = hf.isHeadFaction;

            const { data: requests } = await _supabase
                .from('ministry_requests')
                .select('*, factions(faction_name)')
                .eq('nation_id', currentNation.id);
            ministryRequests = requests || [];
        }

        // Government approval
        let governmentApproval = null;
        if (coalition && coalition.party_ids) {
            governmentApproval = await calculateGovernmentApproval(coalition.party_ids);
        } else if (ministries && ministries.length > 0) {
            const uniquePartyIds = [...new Set(ministries.map(m => m.party_id).filter(Boolean))];
            if (uniquePartyIds.length > 0) governmentApproval = await calculateGovernmentApproval(uniquePartyIds);
        }

        // Check for pending PM candidates (player needs to select)
        const primeMinister = ministries?.find(m => m.ministry_key === 'prime_minister');
        let hasPendingPMSelection = false;
        if (currentFaction) {
            const { count } = await _supabase
                .from('pm_candidates')
                .select('*', { count: 'exact', head: true })
                .eq('nation_id', currentNation.id)
                .eq('faction_id', currentFaction.id)
                .eq('selected', false);
            hasPendingPMSelection = (count || 0) > 0;
        }

        document.getElementById('content-area').innerHTML = `
            <div class="panel-padding">
                ${hasPendingPMSelection ? `
    <div style="background:linear-gradient(135deg,#2a2200,#1a1a00);border:2px solid var(--accent);border-radius:12px;padding:20px;margin-bottom:24px;text-align:center;cursor:pointer;" onclick="window.location.href='select-pm.html'">
        <div style="font-size:1.8rem;margin-bottom:8px;">👑</div>
        <div style="font-size:1.1rem;color:var(--accent);font-weight:bold;text-transform:uppercase;letter-spacing:2px;margin-bottom:6px;">Select Your Prime Minister</div>
        <div style="font-size:0.85rem;color:var(--text-secondary);">Your coalition has formed. Choose who will lead the nation.</div>
        <div style="margin-top:12px;display:inline-block;padding:8px 24px;background:var(--accent);color:#121212;border-radius:6px;font-weight:bold;font-size:0.85rem;text-transform:uppercase;letter-spacing:1px;">Choose Now →</div>
    </div>
` : ''}
                ${renderAdministrationBox(coalition, partyData, primeMinister, governmentApproval, activeHOG)}

                <div class="section-header">Government Structure</div>
                <div class="info-block">
                    <div class="info-row"><span class="info-label">Government Type</span><span class="info-value">${currentNation.government_type || 'Parliamentary Democracy'}</span></div>
                    <div class="info-row"><span class="info-label">Legislative Branch</span><span class="info-value">Unicameral (${GAME_CONFIG.TOTAL_SEATS} Seats)</span></div>
                    <div class="info-row"><span class="info-label">Majority Threshold</span><span class="info-value">${GAME_CONFIG.MAJORITY_SEATS} Seats</span></div>
                </div>

                <div class="section-header">Cabinet</div>
                ${renderCabinet(ministries, coalition)}

                <div class="section-header">Current Parliamentary Makeup</div>
                <div class="parliament-wrap">
                    <svg id="parliament-svg" width="520" height="280" viewBox="0 0 520 280"></svg>
                </div>
                <div class="parliament-legend" id="parliament-legend"></div>
            </div>
        `;

        if (partyData.length > 0) drawParliament(partyData);

    } catch (error) {
        console.error('Error loading government data:', error);
        document.getElementById('content-area').innerHTML = '<div class="panel-padding"><div class="placeholder-panel"><div class="ph-icon">⚠️</div><h3>Error Loading Data</h3><p>Could not load government information. Please refresh.</p></div></div>';
    }
}

// ==================== DATA FETCHING ====================

async function fetchLatestElection() {
    const { data } = await _supabase.from('elections').select('*')
        .eq('nation_id', currentNation.id).eq('status', 'completed')
        .order('election_tick', { ascending: false }).order('created_at', { ascending: false }).limit(1).maybeSingle();
    return data;
}

async function fetchMinistries() {
    const { data } = await _supabase.from('ministries').select('*, factions(faction_name)')
        .eq('nation_id', currentNation.id).eq('is_active', true);
    return data || [];
}

async function calculateGovernmentApproval(partyIds) {
    const { data: parties } = await _supabase.from('factions').select('approval_rating').in('id', partyIds);
    if (!parties || parties.length === 0) return null;
    const approvals = parties.map(p => p.approval_rating || 0).sort((a, b) => a - b);
    const mid = Math.floor(approvals.length / 2);
    return approvals.length % 2 === 0 ? Math.round((approvals[mid - 1] + approvals[mid]) / 2) : approvals[mid];
}

function getPartyNameById(partyId) {
    const p = partyData.find(p => p.party_id === partyId);
    return p ? p.party_name : (allParties.find(f => f.id === partyId)?.faction_name || 'Unknown');
}

// ==================== FORMATION IN PROGRESS ====================

function renderFormationInProgress(parties) {
    const ticksElapsed = (lastElectionTick !== null) ? Math.max(0, currentTick - lastElectionTick) : 0;
    const ticksRemaining = Math.max(0, FORMATION_DEADLINE_TICKS - ticksElapsed);
    const progressPct = Math.min(100, (ticksElapsed / FORMATION_DEADLINE_TICKS) * 100);

    // Determine urgency level
    let urgency = 'safe';
    if (ticksRemaining <= 1) urgency = 'critical';
    else if (ticksRemaining <= 2) urgency = 'warning';

    // Calculate accrued penalties
    const accruedApproval = ticksElapsed * 2;
    const accruedStability = ticksElapsed * 1;

    // Find largest and second largest parties for snap penalty display
    const sorted = [...parties].sort((a, b) => b.seats - a.seats);
    const largestParty = sorted[0];
    const secondParty = sorted[1];

    return `
        <div class="formation-box">
            <div class="formation-header">
                <div class="formation-icon">⚠️</div>
                <div class="formation-title">No Government</div>
                <div class="formation-subtitle">Government formation is in progress — all parties may propose a coalition</div>
            </div>
            <div class="formation-body">
                <!-- Countdown -->
                <div class="formation-countdown">
                    <div class="countdown-label">Time Remaining Before Snap Election</div>
                    <div class="countdown-track">
                        <div class="countdown-fill ${urgency}" style="width: ${progressPct}%"></div>
                    </div>
                    <div class="countdown-text ${urgency}">
                        ${ticksRemaining > 0
                            ? ticksRemaining + ' tick' + (ticksRemaining !== 1 ? 's' : '') + ' remaining'
                            : '⚡ SNAP ELECTION IMMINENT'}
                    </div>
                    <div class="countdown-detail">
                        ${ticksElapsed > 0
                            ? ticksElapsed + ' tick' + (ticksElapsed !== 1 ? 's' : '') + ' without a government (of ${FORMATION_DEADLINE_TICKS} allowed)'
                            : 'Election just concluded — form a coalition to avoid penalties'}
                    </div>
                </div>

                <!-- Penalty Cards -->
                <div class="formation-penalties">
                    <div class="penalty-card active-penalty">
                        <div class="penalty-value red">-2%</div>
                        <div class="penalty-label">Party Approval / Tick</div>
                        <div class="penalty-detail">All parties lose approval each tick</div>
                    </div>
                    <div class="penalty-card active-penalty">
                        <div class="penalty-value red">-1</div>
                        <div class="penalty-label">Stability / Tick</div>
                        <div class="penalty-detail">National stability erodes</div>
                    </div>
                    <div class="penalty-card accrued">
                        <div class="penalty-value orange">${ticksElapsed > 0 ? ticksElapsed : '0'}</div>
                        <div class="penalty-label">Ticks Elapsed</div>
                        <div class="penalty-detail">${accruedApproval > 0 ? '-' + accruedApproval + '% approval, -' + accruedStability + ' stability lost' : 'No penalties accrued yet'}</div>
                    </div>
                </div>

                <!-- Snap Election Warning -->
                <div class="snap-warning ${urgency === 'critical' ? 'imminent' : ''}">
                    <div class="snap-warning-icon">🗳️</div>
                    <div class="snap-warning-content">
                        <div class="snap-warning-title">
                            ${ticksRemaining <= 0
                                ? 'Snap Election Will Trigger Next Tick!'
                                : 'Snap Election in ' + ticksRemaining + ' Tick' + (ticksRemaining !== 1 ? 's' : '')}
                        </div>
                        <div class="snap-warning-desc">
                            If no government is formed within ${FORMATION_DEADLINE_TICKS} ticks, a snap election is called with approval penalties applied before voting.
                        </div>
                        <div class="snap-penalty-tags">
                            <span class="snap-penalty-tag first">${largestParty ? largestParty.party_name : 'Largest'}: -10% Approval</span>
                            ${secondParty ? `<span class="snap-penalty-tag second">${secondParty.party_name}: -5% Approval</span>` : ''}
                        </div>
                    </div>
                </div>

                <!-- CTA -->
                <div class="formation-cta">
                    <button class="formation-cta-btn" onclick="window.location.href='elections.html'">
                        🤝 Propose Coalition →
                    </button>
                    <div class="formation-cta-sub">Any party may propose a coalition on the Elections page</div>
                </div>
            </div>
        </div>`;
}

// ==================== CABINET ====================

function renderCabinet(ministries, coalition) {
    if (!ministries || ministries.length === 0) {
        if (coalition && coalition.ministry_allocations) {
            const cards = Object.entries(coalition.ministry_allocations)
                .filter(([key]) => key !== 'prime_minister')
                .map(([key, partyId]) => {
                    const party = partyData.find(p => p.party_id === partyId);
                    return `<div class="ministry-card vacant"><div class="ministry-title">${MINISTRY_NAMES[key] || key}</div><div class="minister-name" style="color:var(--text-muted);">To be appointed</div><div class="minister-details"><span class="minister-party">${party?.party_name || 'Unknown'}</span></div></div>`;
                }).join('');
            return `<div class="ministry-grid">${cards}</div>`;
        }
        if (isAutocracy) {
            const cards = MINISTRY_KEYS_CABINET.map(key => {
                const requests = ministryRequests.filter(r => r.ministry_key === key);
                return `<div class="ministry-card vacant"><div class="ministry-title">${MINISTRY_NAMES[key]}</div><div class="minister-name" style="color:var(--text-muted);">Vacant</div>${requests.length > 0 ? `<span class="request-badge">${requests.length}</span>` : ''}${renderMinistryActions(key, false, requests)}</div>`;
            }).join('');
            return `<div class="ministry-grid">${cards}</div>`;
        }
        return '<div class="info-block" style="text-align:center;color:var(--text-secondary);padding:30px;">No cabinet has been formed yet.</div>';
    }

    const ministryMap = {};
    ministries.forEach(m => { ministryMap[m.ministry_key] = m; });

    if (isAutocracy) {
        const cards = MINISTRY_KEYS_CABINET.map(key => {
            const m = ministryMap[key];
            const isFilled = m && m.minister_first_name;
            const requests = ministryRequests.filter(r => r.ministry_key === key);

            if (isFilled) {
                const partyName = m.factions?.faction_name || 'Unknown';
                return `<div class="ministry-card"><div class="ministry-title">${m.ministry_name || MINISTRY_NAMES[key]}</div><div class="minister-name">${m.minister_first_name} ${m.minister_last_name}</div><div class="minister-details">Age ${m.minister_age || '?'} • <span class="minister-party">${partyName}</span></div>${requests.length > 0 ? `<span class="request-badge">${requests.length}</span>` : ''}${renderMinistryActions(key, true, requests)}</div>`;
            } else {
                return `<div class="ministry-card vacant"><div class="ministry-title">${MINISTRY_NAMES[key]}</div><div class="minister-name" style="color:var(--text-muted);">Vacant</div>${requests.length > 0 ? `<span class="request-badge">${requests.length}</span>` : ''}${renderMinistryActions(key, false, requests)}</div>`;
            }
        }).join('');
        return `<div class="ministry-grid">${cards}</div>`;
    }

    const cards = ministries.filter(m => m.ministry_key !== 'prime_minister').map(m => {
        const partyName = m.factions?.faction_name || 'Unknown';
        const name = m.minister_first_name && m.minister_last_name ? `${m.minister_first_name} ${m.minister_last_name}` : 'Vacant';
        const isMyMinistry = currentFaction && m.party_id === currentFaction.id;
        const resignBtn = isMyMinistry ? `<div class="ministry-actions"><button class="ministry-btn purge" onclick="resignMinistry('${m.ministry_key}')">📋 Resign Ministry</button></div>` : '';
        return `<div class="ministry-card"><div class="ministry-title">${m.ministry_name}</div><div class="minister-name">${name}</div><div class="minister-details">${m.minister_age ? `Age ${m.minister_age} • ` : ''}<span class="minister-party">${partyName}</span></div>${resignBtn}</div>`;
    }).join('');
    return `<div class="ministry-grid">${cards}</div>`;
}

function renderMinistryActions(key, isFilled, requests) {
    if (!isAutocracy) return '';
    const ap = currentFaction?.action_points || 0;
    const myRequest = requests.find(r => r.faction_id === currentFaction?.id);
    let html = '<div class="ministry-actions">';

    if (isRulingFaction) {
        if (isFilled) {
            html += `<button class="ministry-btn purge" onclick="purgeMinister('${key}')" ${ap < 1 ? 'disabled title="Need 1 AP"' : ''}>⛔ Purge <span class="ap-cost">1 AP</span></button>`;
        } else {
            html += `<button class="ministry-btn assign" onclick="openAssignModal('${key}')">✦ Assign <span class="ap-cost">0 AP</span></button>`;
        }
        html += '</div>';
        if (requests.length > 0) {
            html += '<div class="request-list">';
            requests.forEach(r => {
                html += `<div class="request-item"><span class="request-item-party">${r.factions?.faction_name || 'Unknown'} requests this</span><div class="request-item-actions"><button class="req-btn deny" onclick="denyRequest('${r.id}')">✕ Deny</button></div></div>`;
            });
            html += '</div>';
        }
    } else {
        const totalMyRequests = ministryRequests.filter(r => r.faction_id === currentFaction?.id).length;
        if (myRequest) {
            html += `<button class="ministry-btn unrequest" onclick="unrequestMinistry('${myRequest.id}')">↩ Unrequest <span class="ap-cost">0 AP</span></button>`;
        } else {
            const canRequest = totalMyRequests < 2 && ap >= 1;
            html += `<button class="ministry-btn request" onclick="requestMinistry('${key}')" ${canRequest ? '' : 'disabled'}>📋 Request <span class="ap-cost">1 AP</span></button>`;
            if (totalMyRequests >= 2) html += '<span class="max-requests-note">Max 2 requests</span>';
            else if (ap < 1) html += '<span class="max-requests-note">Need 1 AP</span>';
        }
        html += '</div>';
    }

    return html;
}

// ==================== ASSIGN MINISTER (Modal) ====================

function openAssignModal(ministryKey) {
    assignMinistryKey = ministryKey;
    selectedCandidate = null;
    document.getElementById('assign-confirm-btn').disabled = true;
    document.getElementById('assign-modal-title').textContent = 'Assign — ' + (MINISTRY_NAMES[ministryKey] || ministryKey);

    generatedCandidates = allParties.map(party => ({
        partyId: party.id,
        partyName: party.faction_name,
        firstName: FIRST_NAMES_POOL[Math.floor(Math.random() * FIRST_NAMES_POOL.length)],
        lastName: LAST_NAMES_POOL[Math.floor(Math.random() * LAST_NAMES_POOL.length)],
        age: 35 + Math.floor(Math.random() * 31)
    }));

    document.getElementById('assign-candidates').innerHTML = generatedCandidates.map((c, i) => {
        const isRuling = c.partyId === rulingFactionId;
        return `<div class="candidate-card" id="cand-${i}" onclick="selectCandidate(${i})"><div><div class="candidate-name">${c.firstName} ${c.lastName}</div><div class="candidate-details">Age ${c.age} • <span class="candidate-party-tag ${isRuling ? 'ruling' : 'other'}">${c.partyName}</span></div></div>${isRuling ? '<span class="ruling-label">RULING</span>' : ''}</div>`;
    }).join('');

    document.getElementById('assign-modal').classList.add('active');
}

function closeAssignModal() {
    document.getElementById('assign-modal').classList.remove('active');
}

function selectCandidate(index) {
    selectedCandidate = generatedCandidates[index];
    document.querySelectorAll('.candidate-card').forEach(el => el.classList.remove('selected'));
    document.getElementById('cand-' + index).classList.add('selected');
    document.getElementById('assign-confirm-btn').disabled = false;
}

async function confirmAssign() {
    if (!selectedCandidate || !assignMinistryKey) return;
    try {
        const existing = ministryData.find(m => m.ministry_key === assignMinistryKey);

        if (existing) {
            const { error } = await _supabase.from('ministries').update({
                party_id: selectedCandidate.partyId,
                minister_first_name: selectedCandidate.firstName,
                minister_last_name: selectedCandidate.lastName,
                minister_age: selectedCandidate.age,
                is_active: true
            }).eq('id', existing.id);
            if (error) throw error;
        } else {
            const { error } = await _supabase.from('ministries').insert({
                nation_id: currentNation.id,
                ministry_key: assignMinistryKey,
                ministry_name: MINISTRY_NAMES[assignMinistryKey] || assignMinistryKey,
                party_id: selectedCandidate.partyId,
                minister_first_name: selectedCandidate.firstName,
                minister_last_name: selectedCandidate.lastName,
                minister_age: selectedCandidate.age,
                is_active: true
            });
            if (error) throw error;
        }

        await _supabase.from('ministry_requests').delete()
            .eq('nation_id', currentNation.id).eq('ministry_key', assignMinistryKey);

        closeAssignModal();
        alert('✦ ' + selectedCandidate.firstName + ' ' + selectedCandidate.lastName + ' appointed to ' + (MINISTRY_NAMES[assignMinistryKey] || assignMinistryKey) + '!');
        await renderGovernmentPage();
    } catch (e) {
        console.error('Assign error:', e);
        alert('Error: ' + e.message);
    }
}

// ==================== PURGE MINISTER ====================

async function purgeMinister(ministryKey) {
    const ministry = ministryData.find(m => m.ministry_key === ministryKey);
    if (!ministry) return;

    const ap = currentFaction?.action_points || 0;
    if (ap < 1) { alert('Not enough AP (need 1).'); return; }

    const partyName = ministry.factions?.faction_name || 'Unknown';
    const ministerName = ministry.minister_first_name + ' ' + ministry.minister_last_name;

    if (!confirm(
        '⛔ PURGE ' + ministerName + ' from ' + (MINISTRY_NAMES[ministryKey] || ministryKey) + '?\n\n' +
        'Cost: 1 AP\n\n' +
        'Scapegoat Effects:\n' +
        '• ' + partyName + ' loses 2–4 Loyalty and 1–2 Approval\n' +
        '• Your faction gains +4–5 Approval (decays over time)\n' +
        '• Nation: +1 Corruption, Stability shifts ±1–2\n\n' +
        'Proceed?'
    )) return;

    try {
        const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const tick = shard?.current_tick || 0;

        const { data: recentPurges } = await _supabase
            .from('campaign_actions')
            .select('tick_performed')
            .eq('party_id', currentFaction.id)
            .eq('action_type', 'purge_minister')
            .gte('tick_performed', tick - 6);
        const purgeCount = (recentPurges || []).length;

        const loyaltyLoss = 2 + Math.floor(Math.random() * 3);
        const approvalLossPurged = 1 + Math.floor(Math.random() * 2);
        const stabilityRoll = 1 + Math.floor(Math.random() * 2);
        let approvalBoost = 4 + Math.floor(Math.random() * 2);
        let corruptionGain = 1;

        if (purgeCount === 1) {
            approvalBoost = Math.floor(approvalBoost / 2);
        } else if (purgeCount >= 2) {
            approvalBoost = 0;
            corruptionGain = 2;
        }

        const decayTicks = approvalBoost > 0 ? approvalBoost + 1 : 0;

        const { error: clearErr } = await _supabase.from('ministries').update({
            minister_first_name: null, minister_last_name: null, minister_age: null, party_id: null
        }).eq('id', ministry.id);
        if (clearErr) throw clearErr;

        const rulerApproval = currentFaction.approval_rating ?? 50;
        const newRulerApproval = Math.min(100, rulerApproval + approvalBoost);
        await _supabase.from('factions').update({
            action_points: Math.max(0, ap - 1),
            approval_rating: newRulerApproval
        }).eq('id', currentFaction.id);
        currentFaction.action_points = Math.max(0, ap - 1);
        currentFaction.approval_rating = newRulerApproval;

        if (ministry.party_id && ministry.party_id !== rulingFactionId) {
            const target = allParties.find(p => p.id === ministry.party_id);
            const currentLoyalty = target?.loyalty ?? 50;
            const currentApproval = target?.approval_rating ?? 50;
            await _supabase.from('factions').update({
                loyalty: Math.max(0, currentLoyalty - loyaltyLoss),
                approval_rating: Math.max(0, currentApproval - approvalLossPurged)
            }).eq('id', ministry.party_id);
        }

        const { data: nation } = await _supabase.from('nations').select('stability, corruption').eq('id', currentNation.id).single();
        const stability = nation?.stability ?? 50;
        const corruption = nation?.corruption ?? 50;

        let stabilityChange;
        if (purgeCount >= 2) {
            stabilityChange = -stabilityRoll;
        } else if (stability >= 50) {
            stabilityChange = -stabilityRoll;
        } else {
            stabilityChange = stabilityRoll;
        }

        await _supabase.from('nations').update({
            stability: Math.max(0, Math.min(100, stability + stabilityChange)),
            corruption: Math.min(100, corruption + corruptionGain)
        }).eq('id', currentNation.id);

        await _supabase.from('campaign_actions').insert({
            party_id: currentFaction.id,
            nation_id: currentNation.id,
            action_type: 'purge_minister',
            tick_performed: tick,
            result: {
                minister_name: ministerName,
                target_party: partyName,
                target_party_id: ministry.party_id,
                loyalty_loss: loyaltyLoss,
                approval_loss_target: approvalLossPurged,
                approval_boost: approvalBoost,
                decay_ticks_remaining: decayTicks,
                decay_rate: 1,
                stability_change: stabilityChange,
                corruption_gain: corruptionGain,
                purge_number: purgeCount + 1
            }
        });

        let resultMsg = '⛔ ' + ministerName + ' purged!\n\n';
        resultMsg += partyName + ': -' + loyaltyLoss + ' Loyalty, -' + approvalLossPurged + ' Approval\n';
        if (approvalBoost > 0) {
            resultMsg += 'Your Approval: +' + approvalBoost + ' (will decay over ' + decayTicks + ' ticks)\n';
        } else {
            resultMsg += 'Your Approval: No boost (too many recent purges)\n';
        }
        resultMsg += 'Nation: ' + (stabilityChange >= 0 ? '+' : '') + stabilityChange + ' Stability, +' + corruptionGain + ' Corruption';
        if (purgeCount === 1) resultMsg += '\n\n⚠️ Diminishing returns: 2nd purge in 6 ticks — boost halved.';
        if (purgeCount >= 2) resultMsg += '\n\n🚨 Regime fatigue: 3rd+ purge in 6 ticks — no boost, double corruption.';

        alert(resultMsg);
        await markFactionActive(_supabase, currentFaction.id);
        await renderGovernmentPage();
    } catch (e) {
        console.error('Purge error:', e);
        alert('Error: ' + e.message);
    }
}

// ==================== REQUEST / UNREQUEST MINISTRY ====================

async function requestMinistry(ministryKey) {
    if (!currentFaction) return;
    const myCount = ministryRequests.filter(r => r.faction_id === currentFaction.id).length;
    if (myCount >= 2) { alert('You can only have 2 active ministry requests.'); return; }
    if ((currentFaction.action_points || 0) < 1) { alert('Not enough AP (need 1).'); return; }

    try {
        const { error } = await _supabase.from('ministry_requests').insert({
            nation_id: currentNation.id,
            faction_id: currentFaction.id,
            ministry_key: ministryKey
        });
        if (error) throw error;

        await _supabase.from('factions').update({
            action_points: Math.max(0, currentFaction.action_points - 1)
        }).eq('id', currentFaction.id);
        currentFaction.action_points = Math.max(0, currentFaction.action_points - 1);

        await markFactionActive(_supabase, currentFaction.id);
        await renderGovernmentPage();
    } catch (e) {
        console.error('Request error:', e);
        alert('Error: ' + e.message);
    }
}

async function unrequestMinistry(requestId) {
    try {
        await _supabase.from('ministry_requests').delete().eq('id', requestId);
        await renderGovernmentPage();
    } catch (e) { console.error(e); alert('Error: ' + e.message); }
}

async function denyRequest(requestId) {
    try {
        await _supabase.from('ministry_requests').delete().eq('id', requestId);
        await renderGovernmentPage();
    } catch (e) { console.error(e); alert('Error: ' + e.message); }
}

// ==================== PARLIAMENT VISUALIZATION ====================

function drawParliament(parties) {
    const colors = ['#E91E63','#2196F3','#4CAF50','#FF9800','#9C27B0','#00BCD4','#F44336','#8BC34A','#FFC107','#673AB7'];
    const fmt = parties.map((p, i) => ({ name: p.party_name, seats: p.seats, color: colors[i % colors.length] }));
    const total = fmt.reduce((s, p) => s + p.seats, 0);
    const svg = document.getElementById('parliament-svg');
    if (!svg) return;
    const w = 520, h = 280, cx = w/2, cy = h-20, sp = 7;
    const rows = calcRows(total, cy, sp);
    const seats = [];
    fmt.forEach(p => { for (let i = 0; i < p.seats; i++) seats.push(p.color); });
    const dots = genDots(seats.length, rows, cx, cy);
    let c = '';
    dots.forEach((d, i) => { if (i < seats.length) c += `<circle cx="${d.x}" cy="${d.y}" r="2.5" fill="${seats[i]}" stroke="var(--bg-body)" stroke-width="0.5"/>`; });
    c += `<text x="${cx}" y="${cy-12}" text-anchor="middle" fill="var(--accent)" font-size="24" font-weight="bold">${total}</text>`;
    c += `<text x="${cx}" y="${cy+6}" text-anchor="middle" fill="var(--text-muted)" font-size="11">TOTAL SEATS</text>`;
    svg.innerHTML = c;
    document.getElementById('parliament-legend').innerHTML = fmt.map(p => `<div class="legend-item"><div class="legend-swatch" style="background:${p.color};"></div>${p.name} (${p.seats})</div>`).join('');
}

function calcRows(total, maxR, sp) {
    const rows = []; let r = maxR - 60, placed = 0;
    while (placed < total && r > 40) { const n = Math.floor(Math.PI * r / sp); rows.push({ radius: r, dots: Math.min(n, total - placed) }); placed += n; r -= sp; }
    return rows;
}

function genDots(total, rows, cx, cy) {
    const pos = []; let idx = 0;
    for (const row of rows) { const n = Math.min(row.dots, total - idx); const step = Math.PI / (n - 1); for (let i = 0; i < n; i++) { const a = Math.PI - i * step; pos.push({ x: cx + row.radius * Math.cos(a), y: cy - row.radius * Math.sin(a) }); idx++; if (idx >= total) return pos; } }
    return pos;
}

// ==================== RESIGN PM ====================

async function resignPMAction() {
    if (!currentFaction || !currentNation) return;

    const { data: hog } = await _supabase
        .from('head_of_government')
        .select('trait_key')
        .eq('nation_id', currentNation.id)
        .eq('faction_id', currentFaction.id)
        .eq('active', true)
        .maybeSingle();

    if (hog?.trait_key === 'survivor') {
        alert('❌ A Survivor cannot resign. They cling to power.');
        return;
    }

    if (!confirm(
        '📋 RESIGN as Prime Minister?\n\n' +
        'Effects:\n' +
        '• Your party: -5 Approval\n' +
        '• Nation: -3 Stability\n' +
        '• Your party cannot hold PM for 12 ticks (1 year)\n' +
        '• Coalition partner may take over, or coalition collapses\n\n' +
        'This cannot be undone. Proceed?'
    )) return;

    try {
        const { data: shard } = await _supabase
            .from('shard')
            .select('current_tick')
            .eq('name', 'Alpha Shard')
            .single();

        const result = await resignPM(
            _supabase,
            currentNation.id,
            currentFaction.id,
            shard?.current_tick || 0
        );

        if (result.result === 'pm_offered') {
            alert(`📋 You have resigned as Prime Minister.\n\n${result.newPmPartyName} has been offered the position.`);
        } else if (result.result === 'coalition_collapsed') {
            alert(`📋 You have resigned as Prime Minister.\n\nNo eligible partner — the coalition has collapsed. The nation has no government.`);
        }

        await renderGovernmentPage();
    } catch (e) {
        console.error('Resign error:', e);
        alert('Error: ' + e.message);
    }
}
