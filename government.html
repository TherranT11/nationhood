<script type="module">

import { getPartyIconSVG, getPartyLogoHTML } from './js/party-icons.js';
(function () {
    'use strict';

const IDEOLOGY_COLORS = {
    liberty: '#9C27B0', equality: '#E91E63', freedom: '#2196F3', security: '#FF9800',
    individualism: '#eab308', collectivism: '#ec4899', tradition: '#795548',
    progress: '#00BCD4', nationalism: '#FF5722', globalism: '#3F51B5'
};
function ideologyBg(name) { return IDEOLOGY_COLORS[(name || '').toLowerCase()] || '#9C27B0'; }

/**
 * Government Page
 * Displays government structure, administration, cabinet, and parliament.
 * Autocracy: ruling faction can ASSIGN/PURGE ministers; others can REQUEST.
 */

const MINISTRY_NAMES = {
    prime_minister: 'Prime Minister',
    interior: 'Ministry of the Interior',
    foreign: 'Foreign Ministry',
    defense: 'Ministry of Defense',
    finance: 'Ministry of Finance',
    education: 'Ministry of Education',
    healthcare: 'Ministry of Healthcare',
    labor: 'Ministry of Labor',
    justice: 'Ministry of Justice',
    trade: 'Ministry of Trade',
    energy: 'Ministry of Energy',
    transportation: 'Ministry of Transportation',
    security: 'Ministry of Security'
};

const MINISTRY_KEYS_CABINET = [
    'prime_minister',
    'interior','foreign','defense','finance',
    'education','healthcare','labor','justice','trade','energy','transportation'
];

const FIRST_NAMES_POOL = [
    'Carlos','Diego','Fernando','Héctor','Marcos','Ramón','José','Luis','Miguel',
    'Antonio','Roberto','Francisco','Eduardo','Pablo','Alejandro','Rafael','Gabriel',
    'Santiago','Andrés','Javier','Ricardo','Tomás','Emilio','Sergio','Nicolás',
    'Arturo','Enrique','Oscar','Felipe','Gonzalo','Ignacio','Mateo','Dante'
];
const LAST_NAMES_POOL = [
    'Velasco','Salazar','Guerrero','Ríos','Morales','Torres','Mendoza','Castillo',
    'Herrera','Vargas','Reyes','Cruz','Navarro','Delgado','Ortiz','Romero','Flores',
    'Ramírez','Guzmán','Medina','Soto','Pacheco','Ibarra','Carrasco','Espinoza',
    'Montenegro','Echeverría','Valdez','Córdoba','Aguilar','Paredes','Lara'
];

let currentNation = null;
let currentFaction = null;
let partyData = [];
let coalitionData = null;
let ministryData = [];
let allParties = [];
let allPartySeats = {};
let isAutocracy = false;
let isPresidential = false;
let isPresidentParty = false;
let presidentFactionId = null;
let presidentData = null;
let isRulingFaction = false;
let rulingFactionId = null;
let ministryRequests = [];
let currentTick = 0;
let lastElectionTick = null;

// Assign modal state
let assignMinistryKey = null;
let selectedCandidate = null;
let generatedCandidates = [];
let _coalitionAppointMode = false;

// Formation state
let currentElectionId = null;
let electionResults = [];
let totalLegislatureSeats = 0;
let activeFormationId = null;
let activeFormationPartyIds = [];
let formationRealtimeChannel = null;
let formationChatMessages = [];
let formationSupportMap = {};
let proposalSelectedParties = [];
let editSelectedParties = [];
let _proposalSubmitting = false;
let _formingInProgress = false;

const FORMATION_MINISTRIES = [
    { key: 'prime_minister', name: 'Prime Minister', description: 'Head of government, sets national agenda and policy priorities.', locked: true },
    { key: 'interior', name: 'Ministry of the Interior', description: 'Oversees domestic affairs, local governments, and civil administration.' },
    { key: 'foreign', name: 'Foreign Ministry', description: 'Manages diplomatic relations and international treaties.' },
    { key: 'defense', name: 'Ministry of Defense', description: 'Controls military forces and national defense strategy.' },
    { key: 'finance', name: 'Ministry of Finance', description: 'Manages national budget, taxation, and economic policy.' },
    { key: 'education', name: 'Ministry of Education', description: 'Oversees schools, universities, and educational standards.' },
    { key: 'healthcare', name: 'Ministry of Healthcare', description: 'Manages hospitals, public health, and medical policy.' },
    { key: 'labor', name: 'Ministry of Labor', description: 'Handles employment law, workers\' rights, and job programs.' },
    { key: 'justice', name: 'Ministry of Justice', description: 'Oversees courts, law enforcement, and legal reform.' },
    { key: 'trade', name: 'Ministry of Trade', description: 'Oversees trade policy, negotiations, tariffs, and international commerce.' },
    { key: 'energy', name: 'Ministry of Energy', description: 'Manages energy generation, renewable energy policy, emissions, and environmental regulation.' },
    { key: 'transportation', name: 'Ministry of Transportation', description: 'Manages roads, railways, airports, and transit systems.' },
    { key: 'security', name: 'Ministry of Security', description: 'Handles intelligence and counter-terrorism operations.', inactive: true }
];

initPage('government', async (state) => {
    const { nation, faction } = state;
    currentNation = nation;
    currentFaction = faction;
    initGameConfigForNation(nation);

    if (!nation) {
        document.getElementById('content-area').innerHTML = '<div class="placeholder-panel"><div class="ph-icon">🏛️</div><h3>No Nation Selected</h3><p>Your party is not assigned to a nation yet.</p></div>';
        return;
    }

    isAutocracy = isGovernmentAutocracy(nation);
    isPresidential = isGovernmentPresidential(nation);

    // Backfill head of state if missing/incomplete
    const hasValidHosAge = Number.isFinite(Number(nation.head_of_state_age)) && Number(nation.head_of_state_age) > 0;
    if (!nation.head_of_state_first_name || !nation.head_of_state_last_name || !hasValidHosAge) {
        const HOS_FIRST = FIRST_NAMES_POOL;
        const HOS_LAST = LAST_NAMES_POOL;
        const hosFirst = nation.head_of_state_first_name || HOS_FIRST[Math.floor(Math.random() * HOS_FIRST.length)];
        const hosLast = nation.head_of_state_last_name || HOS_LAST[Math.floor(Math.random() * HOS_LAST.length)];
        const hosAge = hasValidHosAge ? Number(nation.head_of_state_age) : (45 + Math.floor(Math.random() * 25));
        const { error } = await _supabase.from('nations').update({
            head_of_state_first_name: hosFirst,
            head_of_state_last_name: hosLast,
            head_of_state_age: hosAge
        }).eq('id', nation.id);
        if (!error) {
            currentNation.head_of_state_first_name = hosFirst;
            currentNation.head_of_state_last_name = hosLast;
            currentNation.head_of_state_age = hosAge;
        }
    }

    // Load current tick
    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    currentTick = shard?.current_tick || 0;

    await renderGovernmentPage();
});

async function renderRevolutionBannerGov() {
    var nation = currentNation;
    if (!nation) return '';

    // Get current tick
    var shardRes = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    var currentTick = shardRes.data?.current_tick || 0;

    // Check for post-revolution celebration banner
    var revRes = await _supabase.from('event_log')
        .select('fired_at_tick, description_used')
        .eq('nation_id', nation.id).eq('event_name', 'DEMOCRATIC_REVOLUTION')
        .order('fired_at_tick', { ascending: false }).limit(1).maybeSingle();
    if (revRes.data && (currentTick - revRes.data.fired_at_tick) <= 5) {
        var electionTick = revRes.data.fired_at_tick + 3;
        var ticksUntilElection = Math.max(0, electionTick - currentTick);
        var h = '<div class="revolution-complete-banner">';
        h += '<div class="revolution-icon">&#x1F3DB;</div>';
        h += '<div class="revolution-title">Revolution in the Streets!</div>';
        h += '<div class="revolution-subtitle">' + revRes.data.description_used + '</div>';
        if (ticksUntilElection > 0) {
            h += '<div><span class="revolution-tag">Emergency Elections in ' + ticksUntilElection + ' tick' + (ticksUntilElection !== 1 ? 's' : '') + '</span><span class="revolution-tag">Democracy Established</span></div>';
        } else {
            h += '<div><span class="revolution-tag">Democracy Established</span><span class="revolution-tag">Elections Complete</span></div>';
        }
        h += '</div>';
        return h;
    }

    // Active countdown (Autocracy only)
    if (isGovernmentAutocracy(nation) && nation.revolution_started_tick != null && nation.revolution_duration != null) {
        var elapsed = currentTick - nation.revolution_started_tick;
        var remaining = Math.max(0, nation.revolution_duration - elapsed);
        var h = '<div class="revolution-banner">';
        h += '<div class="revolution-icon">&#x1F525;</div>';
        h += '<div class="revolution-title">Democratic Revolution</div>';
        h += '<div class="revolution-subtitle">The people demand democracy. Pro-democracy protests grow stronger each day.</div>';
        h += '<div class="revolution-countdown">' + remaining + ' tick' + (remaining !== 1 ? 's' : '') + ' until revolution</div>';
        h += '</div>';
        return h;
    }

    return '';
}

async function renderGovernmentPage() {
    document.getElementById('content-area').innerHTML = '<div class="panel-padding"><div class="loading-container" style="height:200px;"><div class="loading-spinner"></div><div>Loading government data...</div></div></div>';

    // Always fetch fresh coalition data — status changes (caretaker, dissolved)
    // must never be masked by stale cache entries
    qCacheBust('coalition_');

    try {
        const [electionData, coalition, ministries, partiesRes] = await Promise.all([
            fetchLatestElection(),
            fetchActiveCoalition(_supabase, currentNation.id),
            fetchMinistries(),
            _supabase.from('factions')
                .select('id, faction_name, abbreviation, seats, approval_rating, loyalty, action_points, party_color, party_logo, custom_logo_url')
                .eq('nation_id', currentNation.id).eq('faction_type', 'party')
        ]);

        // Fetch active Head of Government with trait and party name
        const { data: activeHOG } = await _supabase
            .from('head_of_government')
            .select('*, factions(id, faction_name, abbreviation), leader_traits(*)')
            .eq('nation_id', currentNation.id)
            .eq('active', true)
            .maybeSingle();

        coalitionData = coalition;
        ministryData = ministries;
        partyData = electionData?.results?.votes || [];
        allParties = partiesRes.data || [];
        lastElectionTick = electionData?.election_tick || null;

        // Detect caretaker: if coalition exists but status isn't caretaker,
        // check for frozen bills as ground truth (handles legacy tables + failed status updates)
        if (coalition && coalition.status !== 'caretaker') {
            const { count: frozenCount } = await _supabase
                .from('bills')
                .select('*', { count: 'exact', head: true })
                .eq('nation_id', currentNation.id)
                .eq('status', 'frozen');
            if (frozenCount && frozenCount > 0) {
                coalition.status = 'caretaker';
            }
        }

        // If caretaker, fetch the scheduled election tick for the banner
        if (coalition && coalition.status === 'caretaker') {
            const { data: scheduledElection } = await _supabase
                .from('elections')
                .select('election_tick')
                .eq('nation_id', currentNation.id)
                .eq('status', 'scheduled')
                .order('election_tick', { ascending: true })
                .limit(1)
                .maybeSingle();
            if (scheduledElection) {
                coalitionData._earlyElectionTick = scheduledElection.election_tick;
            }
        }

        // Check if coalition formation is in progress for the latest election
        let coalitionFormationInProgress = false;
        if (!isAutocracy && !isPresidential && electionData?.id && !coalition) {
            const { data: formedGov } = await _supabase
                .from('government_formations')
                .select('id')
                .eq('election_id', electionData.id)
                .eq('status', 'formed')
                .limit(1)
                .maybeSingle();
            if (!formedGov) {
                const { data: legacyCoal } = await _supabase
                    .from('active_coalitions')
                    .select('id')
                    .eq('election_id', electionData.id)
                    .limit(1)
                    .maybeSingle();
                coalitionFormationInProgress = !legacyCoal;
            }
        }

        // Populate formation state when election data is available
        // (needed for both explicit formation-in-progress and fallback "no majority, no coalition")
        if (!isAutocracy && !isPresidential && electionData) {
            currentElectionId = electionData.id;
            electionResults = electionData.results?.votes || [];
            totalLegislatureSeats = electionResults.reduce((sum, r) => sum + (r.seats || 0), 0);
            if (totalLegislatureSeats === 0) {
                totalLegislatureSeats = allParties.reduce((sum, p) => sum + (p.seats || 0), 0);
            }
        }

        // Refresh current faction AP
        const freshFaction = allParties.find(p => p.id === currentFaction?.id);
        if (freshFaction && currentFaction) {
            currentFaction.action_points = freshFaction.action_points;
        }

        // Seat loading via game-common.js
        const seatData = await loadSeats(_supabase, currentNation.id, isAutocracy, allParties, currentFaction?.id);
        allPartySeats = seatData.allPartySeats;

        // Detect ruling faction for autocracy
        if (isAutocracy) {
            const hf = await detectHeadFaction(_supabase, currentNation.id, allParties, allPartySeats, currentFaction?.id);
            rulingFactionId = hf.headFactionId;
            isRulingFaction = hf.isHeadFaction;

            const { data: requests } = await _supabase
                .from('ministry_requests')
                .select('*, factions(faction_name)')
                .eq('nation_id', currentNation.id);
            ministryRequests = requests || [];
        }

        // Detect president's party for Presidential systems
        if (isPresidential) {
            const { data: activePresident } = await _supabase
                .from('presidents')
                .select('id, faction_id, first_name, last_name, age, ideology, trait, elected_tick, term_ends_tick, terms_served')
                .eq('nation_id', currentNation.id).eq('is_active', true)
                .order('elected_tick', { ascending: false })
                .limit(1).maybeSingle();
            presidentData = activePresident || null;
            presidentFactionId = activePresident?.faction_id || null;
            isPresidentParty = (presidentFactionId && currentFaction?.id === presidentFactionId);
            // Fetch trait data for the president
            if (presidentData?.trait) {
                const { data: traitData } = await _supabase.from('leader_traits').select('trait_name, upside, downside').eq('trait_key', presidentData.trait).single();
                if (traitData) presidentData._traitData = traitData;
            }
        }

        // Government approval
        let governmentApproval = await calculateGovernmentApproval();

        // Fetch recent gov approval events for display
        const { data: govApprovalEvents } = await _supabase
            .from('gov_approval_log')
            .select('amount, source, tick')
            .eq('nation_id', currentNation.id)
            .order('tick', { ascending: false })
            .limit(8);
        currentNation._govApprovalEvents = govApprovalEvents || [];

        // Check for pending PM or President candidates (player needs to select)
        const primeMinister = ministries?.find(m => m.ministry_key === 'prime_minister');

        // Auto-recover orphaned PM state: coalition exists, no HOG, current faction is PM party
        if (!isPresidential && coalition && !activeHOG) {
            const pmPartyId = coalition.ministry_assignments?.prime_minister || coalition.lead_party_id;
            if (pmPartyId && currentFaction?.id === pmPartyId) {
                try {
                    const { data: shard } = await _supabase.from('shard')
                        .select('current_tick').eq('name', 'Alpha Shard').single();
                    await autoAppointPartyLeaderAsPM(_supabase, currentNation.id, pmPartyId, shard?.current_tick || 0);
                    console.log('Auto-recovered orphaned PM state: appointed party leader as PM');
                    location.reload();
                    return;
                } catch (recoverErr) {
                    console.error('PM auto-recovery failed:', recoverErr);
                }
            }
        }

        // Preload executive order data for overreach bar & emergency banner
        if (isPresidential && currentNation) {
            try { eoOrderData = await fetchActiveOrders(_supabase, currentNation.id); } catch (e) { console.error('[EO] preload failed:', e); }
        }

        const revolutionBannerHtml = await renderRevolutionBannerGov();
        const administrationBoxHtml = await renderAdministrationBox(coalition, partyData, primeMinister, governmentApproval, activeHOG, coalitionFormationInProgress, allPartySeats);

        document.getElementById('content-area').innerHTML = `
            <div class="panel-padding">
                ${revolutionBannerHtml}
                ${administrationBoxHtml}

                <div class="section-header">Government Structure</div>
                <div class="info-block">
                    <div class="info-row"><span class="info-label">Government Type</span><span class="info-value">${currentNation.government_type || 'Parliamentary Democracy'}</span></div>
                    <div class="info-row"><span class="info-label">Legislative Branch</span><span class="info-value">Unicameral (${GAME_CONFIG.TOTAL_SEATS} Seats)</span></div>
                    <div class="info-row"><span class="info-label">Majority Threshold</span><span class="info-value">${GAME_CONFIG.MAJORITY_SEATS} Seats</span></div>
                </div>

                <div class="section-header" id="cabinet-section">Cabinet</div>
                ${renderCabinet(ministries, coalition)}

                <div class="section-header">Current Parliamentary Makeup</div>
                <div class="parliament-wrap">
                    <svg id="parliament-svg" viewBox="0 0 520 280"></svg>
                </div>
                <div class="parliament-legend" id="parliament-legend"></div>

                <div id="past-administrations-container"></div>
            </div>
        `;

        if (partyData.length > 0) {
            // Enrich partyData with DB colors for parliament visualization
            const enrichedPartyData = partyData.map((p, i) => {
                const dbParty = allParties.find(x => x.id === p.party_id);
                return { ...p, color: dbParty?.party_color || FALLBACK_COLORS[i % FALLBACK_COLORS.length] };
            });
            drawParliament(enrichedPartyData);
        }

        // Load and render past administrations
        loadPastAdministrations();

        // Load admin chat messages
        loadAdminChat();

        // Load formation proposals when formation UI is present
        // (covers both explicit coalitionFormationInProgress and the fallback "no majority, no coalition" path)
        if (document.getElementById('gov-formation-content') && currentElectionId) {
            await loadFormationsList();
        }

        // Scroll to the section specified in the URL hash (from dashboard quick actions)
        if (window.location.hash) {
            const target = document.getElementById(window.location.hash.substring(1));
            if (target) {
                setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
            }
        }

    } catch (error) {
        console.error('Error loading government data:', error);
        document.getElementById('content-area').innerHTML = '<div class="panel-padding"><div class="placeholder-panel"><div class="ph-icon">⚠️</div><h3>Error Loading Data</h3><p>Could not load government information. Please refresh.</p></div></div>';
    }
}

// ==================== DATA FETCHING ====================

async function fetchLatestElection() {
    const { data } = await _supabase.from('elections').select('*')
        .eq('nation_id', currentNation.id).eq('status', 'completed')
        .eq('election_type', 'parliamentary')
        .order('election_tick', { ascending: false }).order('created_at', { ascending: false }).limit(1).maybeSingle();
    return data;
}

async function fetchMinistries() {
    const { data } = await _supabase.from('ministries').select('*, factions(faction_name)')
        .eq('nation_id', currentNation.id).eq('is_active', true);
    return data || [];
}

async function calculateGovernmentApproval() {
    const { data: nation } = await _supabase
        .from('nations')
        .select('gov_approval')
        .eq('id', currentNation.id)
        .single();
    return nation?.gov_approval ?? 50;
}

function getPartyNameById(partyId) {
    const p = partyData.find(p => p.party_id === partyId);
    return p ? p.party_name : (allParties.find(f => f.id === partyId)?.faction_name || 'Unknown');
}

const FALLBACK_COLORS = ['#E91E63','#2196F3','#4CAF50','#FF9800','#9C27B0','#00BCD4','#F44336','#8BC34A','#FFC107','#673AB7'];

function getPartyColorById(partyId) {
    const idx = allParties.findIndex(p => p.id === partyId);
    const p = idx >= 0 ? allParties[idx] : null;
    return p?.party_color || FALLBACK_COLORS[(idx >= 0 ? idx : 0) % FALLBACK_COLORS.length];
}
function getPartyLogoById(partyId) {
    const p = allParties.find(x => x.id === partyId);
    return p?.party_logo || null;
}
function getPartyCustomLogoById(partyId) {
    const p = allParties.find(x => x.id === partyId);
    return p?.custom_logo_url || null;
}

// ==================== ADMINISTRATION BOX ====================

async function renderAdministrationBox(coalition, parties, primeMinister, governmentApproval, activeHOG, coalitionFormationInProgress, allPartySeats) {
    allPartySeats = allPartySeats || {};
    const hosFirst = currentNation.head_of_state_first_name || 'Unknown';
    const hosLast = currentNation.head_of_state_last_name || 'Unknown';
    const hosAge = currentNation.head_of_state_age || '—';
    const approvalColor = governmentApproval >= 60 ? 'var(--green)' : governmentApproval >= 40 ? 'var(--amber)' : 'var(--red)';
    // Compute tooltip breakdown from ministry data
    const filledMinisters = ministryData.filter(m => m.minister_first_name);
    const vacantCount = ministryData.length - filledMinisters.length;
    const ministerAvg = filledMinisters.length > 0
        ? Math.round(filledMinisters.reduce((sum, m) => sum + (m.minister_approval ?? 50), 0) / filledMinisters.length)
        : 50;
    const vacancyPenalty = vacantCount * -3;
    const evMod = Math.round((currentNation.gov_approval_events ?? 0) * 10) / 10;
    const approvalHTML = `<div style="text-align:right;position:relative;" class="gov-approval-hover">
        <div style="font-size:0.7rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px;">Government Approval</div>
        <div style="font-size:1.4rem;font-weight:bold;color:${approvalColor};">${governmentApproval}%</div>
        <div class="gov-approval-tooltip">
            <div class="gov-tip-title">Approval Breakdown</div>
            <div class="gov-tip-row">
                <span class="gov-tip-label">Minister Avg</span>
                <div class="gov-tip-bar"><div class="gov-tip-bar-fill" style="width:${ministerAvg}%;background:var(--green)"></div></div>
                <span class="gov-tip-val">${ministerAvg}</span>
            </div>
            <div class="gov-tip-desc">Average approval of filled cabinet ministers</div>
            <div class="gov-tip-row">
                <span class="gov-tip-label">Vacancies</span>
                <span class="gov-tip-val" style="color:${vacancyPenalty < 0 ? 'var(--red)' : 'var(--green)'}">${vacancyPenalty === 0 ? '0' : vacancyPenalty}</span>
            </div>
            <div class="gov-tip-desc">${vacantCount} vacant seat${vacantCount !== 1 ? 's' : ''} (-3 each)</div>
            <div class="gov-tip-row">
                <span class="gov-tip-label">Events</span>
                <span class="gov-tip-val" style="color:${evMod > 0 ? 'var(--green)' : evMod < 0 ? 'var(--red)' : 'var(--text-secondary)'}">${evMod > 0 ? '+' : ''}${evMod}</span>
            </div>
            <div class="gov-tip-desc">Crises & events (decays over time)</div>
            ${(() => {
                const events = currentNation._govApprovalEvents || [];
                if (events.length === 0) return '';
                const GOV_SOURCE_LABELS = {
                    'crisis:scandal': 'Scandal',
                    'crisis:natural_disaster': 'Natural disaster',
                    'minister:fired': 'Minister fired',
                    'bill:enactment': 'Bill enacted',
                    'bill:veto': 'Bill vetoed',
                    'election:result': 'Election result'
                };
                const rows = events.map(e => {
                    const label = GOV_SOURCE_LABELS[e.source] || e.source.replace(/[_:]/g, ' ');
                    const sign = e.amount > 0 ? '+' : '';
                    const color = e.amount > 0 ? 'var(--green)' : 'var(--red)';
                    return '<div class="gov-tip-evt"><span>' + label + '</span><span style="color:' + color + '">' + sign + Math.round(e.amount * 10) / 10 + '</span></div>';
                }).join('');
                return '<div class="gov-tip-events-title">Recent Events</div>' + rows;
            })()}
        </div>
    </div>`;

    // Safe PM name: prevents "null null" when ministry row exists but names are SQL NULL
    function safePmName(pm) {
        if (!pm || !pm.minister_first_name || !pm.minister_last_name) return '—';
        return `${pm.minister_first_name} ${pm.minister_last_name}`;
    }

    // Administration name uses Head of Government (PM), falling back to Head of State
    const adminLast = activeHOG?.last_name || primeMinister?.minister_last_name || hosLast;

    // Coalition formation in progress — show countdown with snap election warning
    if (coalitionFormationInProgress) {
        return renderFormationInProgress(parties);
    }

    // === AUTOCRACY: No ruling faction yet — show Seize Power prompt ===
    if (isAutocracy && !rulingFactionId) {
        return `
            <div class="administration-box" style="border-color: var(--red);">
                <div class="administration-header" style="border-bottom-color: var(--border-hair);">
                    <div style="font-size: 2.5rem; margin-bottom: 8px;">&#9876;</div>
                    <div class="administration-title" style="color: var(--red);">Power Vacuum</div>
                    <div class="administration-subtitle">No faction controls the government</div>
                </div>
                <div class="administration-content" style="display:block; text-align:center; padding: 24px;">
                    <div style="font-size:0.9rem; color:var(--text-secondary); margin-bottom: 20px;">
                        The nation has no ruling faction. The Head of State, <strong style="color:var(--text-primary);">${escapeHtml(hosFirst)} ${escapeHtml(hosLast)}</strong>, awaits a faction bold enough to seize the reins of government.
                    </div>
                    <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom: 20px;">
                        Claiming power will make your faction the ruling faction, granting control over all ministries and the Prime Minister's office.
                    </div>
                    <button id="claim-power-btn"
                        style="padding: 14px 36px; background: var(--red); color: white; border: none; border-radius: 3px; font-family: var(--font-mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; transition: all 0.2s;"
                        onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 4px 20px rgba(255,68,68,0.4)';"
                        onmouseout="this.style.transform='none'; this.style.boxShadow='none';"
                        onclick="claimPower()">
                        Seize Power
                    </button>
                    <div style="font-size: 0.7rem; color: var(--text-muted); margin-top: 10px;">Cost: 0 AP &mdash; Uncontested</div>
                </div>
            </div>`;
    }

    if (isAutocracy) {
        const rulingParty = allParties.find(p => p.id === rulingFactionId);
        const rulingPartyName = rulingParty?.faction_name || '—';
        const pmName = safePmName(primeMinister);
        const pmAge = primeMinister?.minister_age || '—';
        const pmPartyName = primeMinister?.factions?.faction_name || '—';
        return `
            <div class="administration-box">
                <div class="administration-header">
                    <div class="administration-title">${escapeHtml(adminLast)} Administration</div>
                    <div class="administration-subtitle">National Government</div>
                </div>
                <div class="administration-content">
                    <div class="admin-leaders-column">
                        <div class="admin-section">
                            <div class="admin-section-title">Prime Minister</div>
                            <div class="admin-person-name">${activeHOG ? `${escapeHtml(activeHOG.first_name)} ${escapeHtml(activeHOG.last_name)}` : escapeHtml(pmName)}</div>
                            <div class="admin-person-details">${activeHOG ? `Age ${activeHOG.age} • ` : (pmAge !== '—' ? `Age ${pmAge} • ` : '')}<span class="admin-person-party">${activeHOG ? (activeHOG.factions?.faction_name || allParties.find(p => p.id === activeHOG.faction_id)?.faction_name || pmPartyName) : pmPartyName}</span></div>
                            ${primeMinister?.minister_approval != null ? `<div class="minister-approval" style="margin-top:6px;">Approval: <span class="${primeMinister.minister_approval < 35 ? 'low' : primeMinister.minister_approval < 50 ? 'mid' : 'high'}">${Math.round(primeMinister.minister_approval)}%</span></div>` : ''}
                            ${activeHOG ? `
                                <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border-main);">
                                    <div style="display:inline-block;padding:3px 8px;border-radius:4px;font-size:0.7rem;font-weight:bold;text-transform:uppercase;background:${ideologyBg(activeHOG.ideology)};color:white;margin-bottom:6px;">${activeHOG.ideology}</div>
                                    <div style="font-size:0.85rem;color:var(--accent);font-weight:bold;margin-bottom:4px;">🏷️ ${activeHOG.leader_traits?.trait_name || activeHOG.trait_key}</div>
                                    <div style="font-size:0.75rem;color:var(--green);margin-bottom:2px;">▲ ${activeHOG.leader_traits?.upside || ''}</div>
                                    <div style="font-size:0.75rem;color:var(--red);">▼ ${activeHOG.leader_traits?.downside || ''}</div>
                                </div>
                            ` : ''}
                        </div>
                        <div class="admin-section">
                            <div class="admin-section-title">Head of State</div>
                            <div class="admin-person-name">${escapeHtml(hosFirst)} ${escapeHtml(hosLast)}</div>
                            <div class="admin-person-details">Age ${hosAge} · <span class="admin-person-party">${escapeHtml(rulingPartyName)}</span></div>
                            <div style="color: var(--red); font-size: 0.75rem; margin-top: 6px; font-weight: bold;">Rules until dead or deposed</div>
                        </div>
                    </div>
                    ${renderAdminChat()}
                </div>
            </div>`;
    }

    // ==================== PRESIDENTIAL SYSTEM ====================
    if (isPresidential) {
        if (!presidentData) {
            return `
                <div class="administration-box">
                    <div class="administration-header">
                        <div class="administration-title">Presidential Government</div>
                        <div class="administration-subtitle">No President — Awaiting Election</div>
                    </div>
                    <div class="administration-content" style="text-align:center;padding:24px;">
                        <div style="font-size:0.9rem;color:var(--text-secondary);">A presidential election must be held before the government can be formed.</div>
                    </div>
                </div>`;
        }

        const presParty = allParties.find(p => p.id === presidentFactionId);
        const presPartyName = presParty?.faction_name || '—';
        const presPartySeats = allPartySeats[presidentFactionId] || presParty?.seats || 0;
        const majoritySeats = GAME_CONFIG.MAJORITY_SEATS || 61;
        const hasMajority = presPartySeats >= majoritySeats;
        const govStatus = hasMajority ? 'Unified Government' : 'Divided Government';
        const govStatusColor = hasMajority ? 'var(--green)' : 'var(--amber)';

        // Fetch fresh tick to avoid stale-tick issues
        const { data: freshShard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const freshTick = freshShard?.current_tick || currentTick;
        const termRemaining = presidentData.term_ends_tick - freshTick;
        const termTotal = GAME_CONFIG.PRESIDENTIAL_TERM_TICKS || 48;
        const termPct = Math.max(0, Math.min(100, Math.round((termRemaining / termTotal) * 100)));

        // Convert remaining ticks to human-readable format (TICKS_PER_YEAR = 12, so 1 tick = 1 month)
        let termRemainingDisplay;
        if (termRemaining <= 0) {
            termRemainingDisplay = 'Term Ended — Election Pending';
        } else {
            const totalMonths = termRemaining; // 1 tick = 1 month
            const years = Math.floor(totalMonths / 12);
            const months = Math.round(totalMonths % 12);
            if (years > 0) {
                termRemainingDisplay = `${years} Year${years !== 1 ? 's' : ''}, ${months} Month${months !== 1 ? 's' : ''}`;
            } else if (months > 0) {
                termRemainingDisplay = `${months} Month${months !== 1 ? 's' : ''}`;
            } else {
                termRemainingDisplay = '< 1 Month';
            }
        }

        // Fetch president's trait info (already cached or inline)
        let traitHTML = '';
        if (presidentData._traitData) {
            const t = presidentData._traitData;
            traitHTML = `
                <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border-main);">
                    ${presidentData.ideology ? `<div class="pres-ideology-bar" style="background:${ideologyBg(presidentData.ideology)};">${escapeHtml(presidentData.ideology)}</div>` : ''}
                    <div class="pres-trait-name">&#x1F3F7; ${escapeHtml(t.trait_name || presidentData.trait)}</div>
                    <ul class="pres-trait-effects">
                        ${t.upside ? `<li class="pres-trait-up">${escapeHtml(t.upside)}</li>` : ''}
                        ${t.downside ? `<li class="pres-trait-down">${escapeHtml(t.downside)}</li>` : ''}
                    </ul>
                </div>`;
        }

        return `
            <div class="administration-box">
                <div class="administration-header">
                    <div>
                        <div class="administration-title">${escapeHtml(presidentData.last_name)} Administration</div>
                        <div class="administration-subtitle">Presidential Government · <span style="color:${govStatusColor};font-weight:bold;">${govStatus}</span></div>
                    </div>
                    ${approvalHTML}
                </div>
                <div class="administration-content">
                    <div class="admin-leaders-column">
                        <div class="admin-section">
                            <div class="admin-section-title">President${presidentData.terms_served ? ` — ${presidentData.terms_served === 1 ? '1st' : '2nd'} Term` : ''}</div>
                            <div class="admin-person-name">${escapeHtml(presidentData.first_name)} ${escapeHtml(presidentData.last_name)}</div>
                            <div class="admin-person-details">Age ${presidentData.age} · <span class="admin-person-party">${escapeHtml(presPartyName)}</span></div>
                            ${primeMinister?.minister_approval != null ? `<div class="minister-approval" style="margin-top:6px;">Approval: <span class="${primeMinister.minister_approval < 35 ? 'low' : primeMinister.minister_approval < 50 ? 'mid' : 'high'}">${Math.round(primeMinister.minister_approval)}%</span></div>` : ''}
                            <div style="margin-top:8px;">
                                <div style="font-size:0.72rem;color:var(--text-secondary);margin-bottom:4px;">${termRemaining <= 0 ? termRemainingDisplay : `Term Remaining: ${termRemainingDisplay}`}</div>
                                <div style="height:4px;background:var(--bg-card);border-radius:0;overflow:hidden;">
                                    <div style="height:100%;width:${termPct}%;background:${termPct > 25 ? 'var(--teal)' : 'var(--red)'};border-radius:0;transition:width 0.3s;"></div>
                                </div>
                            </div>
                            ${traitHTML}
                            ${renderExecutiveOrderButton()}
                            ${renderOverreachBar()}
                        </div>
                        <div class="admin-section">
                            <div class="admin-section-title">Vice President</div>
                            <div class="admin-person-name">${escapeHtml(hosFirst)} ${escapeHtml(hosLast)}</div>
                            <div class="admin-person-details">Age ${hosAge}</div>
                        </div>
                    </div>
                    ${renderAdminChat()}
                </div>
                <div class="coalition-parties">
                    <div class="coalition-party-tag" style="border-left:3px solid ${getPartyColorById(presidentFactionId)};padding-left:8px;">${getPartyLogoById(presidentFactionId) || getPartyCustomLogoById(presidentFactionId) ? `<span style="display:inline-flex;vertical-align:middle;margin-right:5px;">${getPartyLogoHTML({ customLogoUrl: getPartyCustomLogoById(presidentFactionId), iconKey: getPartyLogoById(presidentFactionId), size: 16, color: getPartyColorById(presidentFactionId) })}</span>` : ''}${escapeHtml(presPartyName)}<span class="seats">${presPartySeats} Seats</span></div>
                </div>
                ${renderImpeachmentButton()}
            </div>`;
    }

    // ==================== DEMOCRACY: NO COALITION ====================
    if (!coalition && parties.length > 0) {
        const majorityParty = parties.find(p => p.seats >= GAME_CONFIG.MAJORITY_SEATS);
        if (majorityParty) {
            return `
                <div class="administration-box">
                    <div class="administration-header"><div><div class="administration-title">${escapeHtml(adminLast)} Administration</div><div class="administration-subtitle">Single Party Government</div></div>${approvalHTML}</div>
                    <div class="administration-content">
                        <div class="admin-leaders-column">
                            <div class="admin-section"><div class="admin-section-title">Prime Minister</div><div class="admin-person-name">${escapeHtml(safePmName(primeMinister))}</div><div class="admin-person-details">${primeMinister?.minister_age ? `Age ${primeMinister.minister_age} • ` : ''}<span class="admin-person-party">${escapeHtml(majorityParty.party_name)}</span></div>${primeMinister?.minister_approval != null ? `<div class="minister-approval" style="margin-top:6px;">Approval: <span class="${primeMinister.minister_approval < 35 ? 'low' : primeMinister.minister_approval < 50 ? 'mid' : 'high'}">${Math.round(primeMinister.minister_approval)}%</span></div>` : ''}</div>
                            <div class="admin-section"><div class="admin-section-title">Head of State</div><div class="admin-person-name">${escapeHtml(hosFirst)} ${escapeHtml(hosLast)}</div><div class="admin-person-details">Age ${hosAge} • <span class="admin-person-party">${escapeHtml(majorityParty.party_name)}</span></div></div>
                        </div>
                        ${renderAdminChat()}
                    </div>
                    <div class="coalition-parties"><div class="coalition-party-tag">${majorityParty.party_name}<span class="seats">${majorityParty.seats} Seats</span></div></div>
                </div>`;
        }

        // ==============================
        // NO MAJORITY, NO COALITION
        // GOVERNMENT FORMATION IN PROGRESS
        // ==============================
        return renderFormationInProgress(parties);
    }

    // ==================== DEMOCRACY: ACTIVE COALITION ====================
    if (coalition) {
        const leadParty = parties.find(p => p.party_id === coalition.lead_party_id);
        const leadPartyName = leadParty ? leadParty.party_name : 'Unknown';
        const pmName = safePmName(primeMinister);
        const pmAge = primeMinister?.minister_age || '—';
        const pmParty = activeHOG?.factions?.faction_name || (primeMinister ? (primeMinister.factions?.faction_name || getPartyNameById(primeMinister.party_id)) : '—');
        const pmAppr = primeMinister?.minister_approval ?? null;
        const pmApprHtml = pmAppr !== null ? (() => {
            const cls = pmAppr < 35 ? 'low' : pmAppr < 50 ? 'mid' : 'high';
            return `<div class="minister-approval" style="margin-top:6px;">Approval: <span class="${cls}">${Math.round(pmAppr)}%</span></div>`;
        })() : '';
        // Fetch any coalition parties missing from allParties (handles presidential virtual coalitions)
        const missingGovIds = coalition.party_ids.filter(id => !allParties.find(x => x.id === id));
        if (missingGovIds.length > 0) {
            const { data: missingGovParties } = await _supabase
                .from('factions')
                .select('id, faction_name, abbreviation, seats, party_color, party_logo, custom_logo_url')
                .in('id', missingGovIds);
            if (missingGovParties) allParties.push(...missingGovParties);
        }
        const coalitionParties = coalition.party_ids.map(id => { const p = parties.find(x => x.party_id === id); const fallback = allParties.find(f => f.id === id); const fallbackName = fallback?.faction_name || 'Unknown'; return p ? { ...p, seats: allPartySeats[id] || p.seats || 0 } : { party_name: fallbackName, seats: allPartySeats[id] || 0, party_id: id }; }).sort((a,b) => b.seats - a.seats);
        return `
            <div class="administration-box">
                <div class="administration-header"><div><div class="administration-title">${escapeHtml(adminLast)} Administration</div><div class="administration-subtitle">${(() => { if (coalition.status === 'caretaker') return 'Caretaker Government'; if (coalition.formation_type === 'emergency_minority') return 'Emergency Minority Government'; const govSeats = coalition.party_ids.reduce((s, id) => s + (allPartySeats[id] || 0), 0); const totalSeats = Object.values(allPartySeats).reduce((s, v) => s + v, 0); const isMajority = totalSeats > 0 && govSeats >= Math.ceil(totalSeats / 2); const isCoalition = coalition.party_ids.length > 1; if (isCoalition) return isMajority ? 'Majority Coalition Government' : 'Minority Coalition Government'; return isMajority ? 'Majority Government' : 'Minority Government'; })()}</div></div>${approvalHTML}</div>
                <div class="administration-content">
                    <div class="admin-leaders-column">
                        <div class="admin-section">
                            <div class="admin-section-title">Prime Minister</div>
                            <div class="admin-person-name">${activeHOG ? `${escapeHtml(activeHOG.first_name)} ${escapeHtml(activeHOG.last_name)}` : escapeHtml(pmName)}</div>
                            <div class="admin-person-details">${activeHOG ? `Age ${activeHOG.age} • ` : (pmAge !== '—' ? `Age ${pmAge} • ` : '')}<span class="admin-person-party">${escapeHtml(pmParty)}</span></div>
                            ${pmApprHtml}
                            ${activeHOG ? `
                                <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border-main);">
                                    <div style="display:inline-block;padding:3px 8px;border-radius:4px;font-size:0.7rem;font-weight:bold;text-transform:uppercase;background:${ideologyBg(activeHOG.ideology)};color:white;margin-bottom:6px;">${activeHOG.ideology}</div>
                                    <div style="font-size:0.85rem;color:var(--accent);font-weight:bold;margin-bottom:4px;">🏷️ ${activeHOG.leader_traits?.trait_name || activeHOG.trait_key}</div>
                                    <div style="font-size:0.75rem;color:var(--green);margin-bottom:2px;">▲ ${activeHOG.leader_traits?.upside || ''}</div>
                                    <div style="font-size:0.75rem;color:var(--red);">▼ ${activeHOG.leader_traits?.downside || ''}</div>
                                </div>
                                ${activeHOG.faction_id === currentFaction?.id && coalition.status !== 'caretaker' ? `
                                    <button class="ministry-btn purge" style="margin-top:10px;" onclick="resignPMAction()">📋 Resign as PM</button>
                                ` : ''}
                            ` : ''}
                        </div>
                        <div class="admin-section"><div class="admin-section-title">Head of State</div><div class="admin-person-name">${escapeHtml(hosFirst)} ${escapeHtml(hosLast)}</div><div class="admin-person-details">Age ${hosAge} • <span class="admin-person-party">${escapeHtml(leadPartyName)}</span></div></div>
                    </div>
                    ${renderAdminChat()}
                </div>
                <div class="coalition-parties">
                    ${coalitionParties.map((p, i) => {
                        const cpColor = getPartyColorById(p.party_id || allParties.find(x => x.faction_name === p.party_name)?.id);
                        const cpPartyId = p.party_id || allParties.find(x => x.faction_name === p.party_name)?.id;
                        const cpLogo = getPartyLogoById(cpPartyId);
                        const cpCustomLogo = getPartyCustomLogoById(cpPartyId);
                        const cpLogoHtml = cpLogo || cpCustomLogo ? `<span style="display:inline-flex;vertical-align:middle;margin-right:5px;">${getPartyLogoHTML({ customLogoUrl: cpCustomLogo, iconKey: cpLogo, size: 16, color: cpColor })}</span>` : '';
                        return `${i > 0 ? '<span class="coalition-divider">|</span>' : ''}<div class="coalition-party-tag" style="border-left:3px solid ${cpColor};padding-left:8px;">${cpLogoHtml}${escapeHtml(p.party_name)}<span class="seats">${p.seats} Seats</span></div>`;
                    }).join('')}
                </div>
                ${coalition.status === 'caretaker' ? renderCaretakerBanner() : `
                    ${renderNoConfidenceButton(coalition)}
                    ${renderEarlyElectionsButton(coalition)}
                `}
            </div>`;
    }

    return `<div class="administration-box">
        <div class="administration-header"><div class="administration-title">${escapeHtml(adminLast)} Administration</div><div class="administration-subtitle">Caretaker Government</div></div>
        <div class="coalition-parties"><div class="coalition-party-tag" style="background:var(--bg-hover);color:var(--text-secondary);">Awaiting Election Results</div></div>
        ${renderCaretakerBanner()}
    </div>`;
}

// ==================== ADMINISTRATIVE COMMUNICATIONS ====================

let adminChatMessages = [];
let adminChatLoaded = false;
let adminChatSubscription = null;

function renderAdminChat() {
    return `
        <div class="admin-chat-section" id="admin-chat-box">
            <div class="admin-chat-header">Administrative Communications</div>
            <div class="admin-chat-messages" id="admin-chat-messages">
                <div class="admin-chat-empty">Loading messages...</div>
            </div>
            ${currentFaction ? `
            <div class="admin-chat-input-row">
                <input type="text" class="admin-chat-input" id="admin-chat-input" placeholder="Type a message..." maxlength="300" onkeydown="if(event.key==='Enter')sendAdminChat()">
                <button class="admin-chat-send" id="admin-chat-send-btn" onclick="sendAdminChat()">Send</button>
            </div>` : ''}
        </div>`;
}

async function loadAdminChat() {
    if (!currentNation) return;
    const { data, error } = await _supabase
        .from('admin_chat')
        .select('id, faction_id, message, tick_posted, created_at')
        .eq('nation_id', currentNation.id)
        .order('created_at', { ascending: true })
        .limit(50);
    if (error) { console.error('Failed to load admin chat:', error); return; }
    adminChatMessages = data || [];
    adminChatLoaded = true;
    renderChatMessages();
    subscribeAdminChat();
}

function subscribeAdminChat() {
    if (adminChatSubscription || !currentNation) return;
    adminChatSubscription = _supabase
        .channel('admin_chat_' + currentNation.id)
        .on('postgres_changes', {
            event: 'INSERT',
            schema: 'public',
            table: 'admin_chat',
            filter: 'nation_id=eq.' + currentNation.id
        }, (payload) => {
            const msg = payload.new;
            if (!adminChatMessages.find(m => m.id === msg.id)) {
                adminChatMessages.push(msg);
                renderChatMessages();
            }
        })
        .subscribe();
}

function renderChatMessages() {
    const container = document.getElementById('admin-chat-messages');
    if (!container) return;
    if (adminChatMessages.length === 0) {
        container.innerHTML = '<div class="admin-chat-empty">No messages yet. Start the conversation.</div>';
        return;
    }
    container.innerHTML = adminChatMessages.map(m => {
        const party = allParties.find(p => p.id === m.faction_id);
        const partyName = party?.faction_name || 'Unknown';
        const partyColor = party?.party_color || '#888';
        const partyLogo = party?.party_logo;
        const partyCustomLogo = party?.custom_logo_url;
        const logoHtml = partyLogo || partyCustomLogo ? `<span style="display:inline-flex;vertical-align:middle;">${getPartyLogoHTML({ customLogoUrl: partyCustomLogo, iconKey: partyLogo, size: 14, color: partyColor })}</span>` : '';
        const timeAgo = formatChatTime(m.created_at);
        const escapedMsg = escapeHtml(m.message);
        return `<div class="admin-chat-msg" style="border-left-color:${partyColor};">
            <div class="admin-chat-msg-header">
                ${logoHtml}
                <span class="admin-chat-msg-party" style="color:${partyColor};">${escapeHtml(partyName)}</span>
                <span class="admin-chat-msg-time">${timeAgo}</span>
            </div>
            <div class="admin-chat-msg-body">${escapedMsg}</div>
        </div>`;
    }).join('');
    container.scrollTop = container.scrollHeight;
}

// escapeHtml imported from utils.js

function formatChatTime(isoStr) {
    if (!isoStr) return '';
    const d = new Date(isoStr);
    const now = new Date();
    const diffMs = now - d;
    const diffMin = Math.floor(diffMs / 60000);
    if (diffMin < 1) return 'just now';
    if (diffMin < 60) return diffMin + 'm ago';
    const diffH = Math.floor(diffMin / 60);
    if (diffH < 24) return diffH + 'h ago';
    const diffD = Math.floor(diffH / 24);
    return diffD + 'd ago';
}

window.sendAdminChat = async function() {
    const input = document.getElementById('admin-chat-input');
    const btn = document.getElementById('admin-chat-send-btn');
    if (!input || !currentFaction || !currentNation) return;
    const message = input.value.trim();
    if (!message) return;
    btn.disabled = true;
    input.disabled = true;
    const { error } = await _supabase.from('admin_chat').insert({
        nation_id: currentNation.id,
        faction_id: currentFaction.id,
        message: message,
        tick_posted: currentTick
    });
    if (error) {
        console.error('Failed to send message:', error);
        alert('Failed to send message.');
    } else {
        input.value = '';
        // If realtime isn't working, manually add
        if (!adminChatSubscription) {
            adminChatMessages.push({
                id: crypto.randomUUID(),
                faction_id: currentFaction.id,
                message: message,
                tick_posted: currentTick,
                created_at: new Date().toISOString()
            });
            renderChatMessages();
        }
    }
    btn.disabled = false;
    input.disabled = false;
    input.focus();
};

// ==================== FORMATION IN PROGRESS ====================

function renderFormationInProgress(parties) {
    const ticksElapsed = (lastElectionTick !== null) ? Math.max(0, currentTick - lastElectionTick) : 0;
    const ticksRemaining = Math.max(0, FORMATION_DEADLINE_TICKS - ticksElapsed);
    const progressPct = Math.min(100, (ticksElapsed / FORMATION_DEADLINE_TICKS) * 100);

    // Determine urgency level
    let urgency = 'safe';
    if (ticksRemaining <= 1) urgency = 'critical';
    else if (ticksRemaining <= 2) urgency = 'warning';

    // Calculate accrued penalties
    const accruedApproval = ticksElapsed * 2;
    const accruedStability = ticksElapsed * 1;

    // Find largest and second largest parties for snap penalty display
    const sorted = [...parties].sort((a, b) => b.seats - a.seats);
    const largestParty = sorted[0];
    const secondParty = sorted[1];

    // Tone: calm at start, escalates with urgency
    const icon = urgency === 'critical' ? '⚠️' : urgency === 'warning' ? '⏳' : '🤝';
    const title = urgency === 'critical' ? 'No Government — Snap Election Imminent'
                : urgency === 'warning' ? 'Coalition Formation — Time Running Out'
                : 'Coalition Formation In Progress';
    const subtitle = urgency === 'critical' ? 'Form a government immediately or face snap elections'
                   : urgency === 'warning' ? 'Parties are negotiating — the deadline is approaching'
                   : 'Parties are negotiating a coalition — propose or join one below';

    return `
        <div class="formation-box ${urgency}">
            <div class="formation-header ${urgency}">
                <div class="formation-icon">${icon}</div>
                <div class="formation-title ${urgency}">${title}</div>
                <div class="formation-subtitle">${subtitle}</div>
            </div>
            <div class="formation-body">
                <!-- Countdown -->
                <div class="formation-countdown">
                    <div class="countdown-label">${urgency === 'safe' ? 'Formation Deadline' : 'Time Remaining Before Snap Election'}</div>
                    <div class="countdown-track">
                        <div class="countdown-fill ${urgency}" style="width: ${progressPct}%"></div>
                    </div>
                    <div class="countdown-text ${urgency}">
                        ${ticksRemaining > 0
                            ? ticksRemaining + ' tick' + (ticksRemaining !== 1 ? 's' : '') + ' remaining'
                            : '⚡ SNAP ELECTION IMMINENT'}
                    </div>
                    <div class="countdown-detail">
                        ${ticksElapsed > 0
                            ? ticksElapsed + ' tick' + (ticksElapsed !== 1 ? 's' : '') + ' without a government (of ${FORMATION_DEADLINE_TICKS} allowed)'
                            : 'Election just concluded — form a coalition to avoid penalties'}
                    </div>
                </div>

                <!-- Penalty Cards -->
                <div class="formation-penalties">
                    <div class="penalty-card ${urgency === 'safe' ? 'muted' : 'active-penalty'}">
                        <div class="penalty-value ${urgency === 'safe' ? 'dimmed' : 'red'}">-2%</div>
                        <div class="penalty-label">Party Approval / Tick</div>
                        <div class="penalty-detail">All parties lose approval each tick</div>
                    </div>
                    <div class="penalty-card ${urgency === 'safe' ? 'muted' : 'active-penalty'}">
                        <div class="penalty-value ${urgency === 'safe' ? 'dimmed' : 'red'}">-1</div>
                        <div class="penalty-label">Stability / Tick</div>
                        <div class="penalty-detail">National stability erodes</div>
                    </div>
                    <div class="penalty-card accrued">
                        <div class="penalty-value orange">${ticksElapsed > 0 ? ticksElapsed : '0'}</div>
                        <div class="penalty-label">Ticks Elapsed</div>
                        <div class="penalty-detail">${accruedApproval > 0 ? '-' + accruedApproval + '% approval, -' + accruedStability + ' stability lost' : 'No penalties accrued yet'}</div>
                    </div>
                </div>

                ${urgency !== 'safe' ? `
                <!-- Snap Election Warning (only show when time is running out) -->
                <div class="snap-warning ${urgency === 'critical' ? 'imminent' : ''}">
                    <div class="snap-warning-icon">🗳️</div>
                    <div class="snap-warning-content">
                        <div class="snap-warning-title">

                                : 'Snap Election in ' + ticksRemaining + ' Tick' + (ticksRemaining !== 1 ? 's' : '')}

function getFormationPartySeats(partyId) {
    const fromElection = electionResults.find(r => r.party_id === partyId);
    if (fromElection) return fromElection.seats || 0;
    const fromParty = allParties.find(p => p.id === partyId);
    return fromParty?.seats || 0;
}

function getCoalitionSeats(partyIds) {
    return partyIds.reduce((sum, pid) => sum + getFormationPartySeats(pid), 0);
}

function getCoalitionSeatPct(partyIds) {
    if (totalLegislatureSeats === 0) return 0;
    return Math.round((getCoalitionSeats(partyIds) / totalLegislatureSeats) * 100);
}

function getCoalitionIdeologies(partyIds) {
    const ideologies = new Set();
    partyIds.forEach(pid => {
        const p = allParties.find(x => x.id === pid);
        if (p?.ideology_value_1) ideologies.add(p.ideology_value_1);
        if (p?.ideology_value_2) ideologies.add(p.ideology_value_2);
    });
    return [...ideologies];
}

function renderIdeologyChips(ideologies) {
    return ideologies.map(i =>
        `<span class="ideology-chip ${i.toLowerCase()}">${i}</span>`
    ).join('');
}

function toggleProposalParty(el, partyId) {
    const idx = proposalSelectedParties.indexOf(partyId);
    if (idx > -1) {
        proposalSelectedParties.splice(idx, 1);
        el.classList.remove('checked');
        el.querySelector('.party-check-box').textContent = '';
    } else {
        proposalSelectedParties.push(partyId);
        el.classList.add('checked');
        el.querySelector('.party-check-box').textContent = '✓';
    }
    updateSeatPreview();
}

function updateSeatPreview() {
    const previewSeats = document.getElementById('preview-seats');
    const previewPct = document.getElementById('preview-pct');
    const previewThreshold = document.getElementById('preview-threshold');
    if (!previewSeats) return;

    const allIds = [currentFaction.id, ...proposalSelectedParties.filter(p => p !== currentFaction.id)];
    const seats = getCoalitionSeats(allIds);
    const pct = totalLegislatureSeats ? Math.round((seats / totalLegislatureSeats) * 100) : 0;
    const meets = seats >= GAME_CONFIG.MAJORITY_SEATS;

    previewSeats.textContent = seats;
    previewSeats.className = 'preview-seats ' + (meets ? 'meets' : 'below');
    previewPct.textContent = pct;
    previewThreshold.textContent = meets ? `✓ Meets ${GAME_CONFIG.MAJORITY_SEATS}-seat threshold` : `— needs ${GAME_CONFIG.MAJORITY_SEATS} seats`;
    previewThreshold.style.color = meets ? 'var(--green)' : 'var(--text-secondary)';
}

async function createProposal() {
    if (_proposalSubmitting) return;
    if (getFormationPartySeats(currentFaction.id) === 0) {
        alert('Your party has no seats — you cannot propose a coalition.');
        return;
    }

    const partyIds = [currentFaction.id, ...proposalSelectedParties.filter(p => p !== currentFaction.id)];
    const coalitionSeats = getCoalitionSeats(partyIds);
    if (coalitionSeats < GAME_CONFIG.MAJORITY_SEATS) {
        alert(`Your coalition does not meet the ${GAME_CONFIG.MAJORITY_SEATS}-seat threshold. Add more parties.`);
        return;
    }

    // Client-side duplicate check (DB unique index is the real guard)
    const { data: existing } = await _supabase
        .from('government_formations')
        .select('id')
        .eq('election_id', currentElectionId)
        .eq('proposed_by', currentFaction.id)
        .eq('status', 'active')
        .limit(1);
    if (existing && existing.length > 0) {
        alert('You already have an active proposal for this election.');
        return;
    }

    _proposalSubmitting = true;
    const btn = document.querySelector('#create-proposal-section .action-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Submitting...'; }

    try {
        const { data: shard } = await _supabase.from('shard').select('current_date').eq('name', 'Alpha Shard').single();
        const gameYear = shard?.current_date || '';

        const { data, error } = await _supabase
            .from('government_formations')
            .insert({
                nation_id: currentNation.id,
                election_id: currentElectionId,
                proposed_by: currentFaction.id,
                party_ids: partyIds,
                status: 'active',
                game_year: gameYear
            })
            .select()
            .single();

        if (error) { alert('Error creating proposal: ' + error.message); return; }

        const { error: supportError } = await _supabase.rpc('toggle_formation_support', {
            p_formation_id: data.id,
            p_faction_id: currentFaction.id,
            p_supports: true
        });
        if (supportError) console.warn('Auto-support failed (non-blocking):', supportError);

        proposalSelectedParties = [];
        openFormation(data.id);
    } finally {
        _proposalSubmitting = false;
        if (btn) { btn.disabled = false; btn.textContent = 'Submit Proposal'; }
    }
}

async function openFormation(formationId) {
    if (formationRealtimeChannel) { _supabase.removeChannel(formationRealtimeChannel); formationRealtimeChannel = null; }

    activeFormationId = formationId;

    const { data: formation, error } = await _supabase
        .from('government_formations').select('*').eq('id', formationId).single();

    if (error || !formation) { alert('Could not load this proposal.'); return; }

    activeFormationPartyIds = formation.party_ids || [];

    if (!activeFormationPartyIds.includes(currentFaction.id)) {
        alert('You are not invited to this coalition.');
        activeFormationId = null;
        activeFormationPartyIds = [];
        return;
    }

    const { data: supports } = await _supabase
        .from('government_formation_support').select('faction_id, supports').eq('formation_id', formationId);

    formationSupportMap = {};
    (supports || []).forEach(s => {
        if (activeFormationPartyIds.includes(s.faction_id)) formationSupportMap[s.faction_id] = s.supports;
    });

    const { data: msgs } = await _supabase
        .from('government_formation_chat').select('*').eq('formation_id', formationId)
        .order('created_at', { ascending: true }).limit(200);
    formationChatMessages = msgs || [];

    renderFormationDetail(formation);
    setupFormationRealtimeSubscriptions(formationId);
}

    const allCoalitionSupport = coalitionParties.every(p => formationSupportMap[p.id] === true);
    const allAssigned = FORMATION_MINISTRIES.filter(m => !m.inactive).every(m => assignments[m.key]);
    const canForm = isPMParty && allCoalitionSupport && allAssigned && meetsThreshold;

    const blockers = [];
    if (!allAssigned) blockers.push('All ministries must be assigned.');
    if (!allCoalitionSupport) {
        const supportCount = coalitionParties.filter(p => formationSupportMap[p.id] === true).length;
        blockers.push(`${supportCount}/${coalitionParties.length} coalition members supporting.`);
    }
    if (!meetsThreshold) blockers.push(`Coalition has ${coalitionSeats} seats (need ${GAME_CONFIG.MAJORITY_SEATS}).`);

    const chatMsgsHTML = formationChatMessages.length > 0
        ? formationChatMessages.map(msg => renderFormationChatMessage(msg)).join('')
        : '<div class="chat-empty">No messages yet. Start negotiating!</div>';

    const isProposer = formation.proposed_by === currentFaction.id;

    const editPartiesHTML = isProposer ? allParties.map((p, pIdx) => {
        const isYou = p.id === currentFaction.id;

            <div class="party-checkbox-item ${inCoalition ? 'checked' : ''} ${isYou ? 'disabled' : ''}"
                 data-party-id="${p.id}" data-seats="${seats}"
                 style="border-left:3px solid ${epColor};"
                 onclick="${isYou ? '' : `toggleEditParty(this, '${p.id}')`}">
                <div class="party-check-box">${inCoalition ? '✓' : ''}</div>
                <span class="party-check-label">${p.faction_name}</span>
                <span class="party-check-seats">${seats} seats</span>

    }).join('') : '';

    container.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <div class="back-link" onclick="loadFormationsList()" style="margin-bottom: 0;">← Back to Proposals</div>
            <div style="display: flex; gap: 8px;">
                ${isProposer ? `<button onclick="toggleEditCoalition()" id="edit-coalition-btn" style="padding: 8px 16px; background: var(--bg-card); border: 1px solid var(--border-0); color: var(--text-secondary); border-radius: 3px; font-family: var(--font-mono); font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer; transition: 0.2s;" onmouseover="this.style.borderColor='var(--text-dim)'" onmouseout="this.style.borderColor='var(--border-0)'">Edit Coalition</button>` : ''}
                ${isProposer ? `<button onclick="retractProposal('${formation.id}')" style="padding: 8px 16px; background: var(--red-faint); border: 1px solid var(--red-border); color: var(--red); border-radius: 3px; font-family: var(--font-mono); font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; cursor: pointer; transition: 0.2s;">Retract Proposal</button>` : ''}
            </div>
        </div>

        <div class="formation-header-box">
            <div class="formation-title">${proposer?.faction_name || 'Unknown'} Coalition</div>
            <div class="formation-proposer">Proposed by ${proposer?.faction_name || 'Unknown'} · ${formation.game_year || 'Unknown'}</div>
            <div class="formation-parties-row" id="formation-parties-row">${partyChipsHTML}</div>
            <div class="formation-stats">
                <span class="formation-stat">Seats: <span class="stat-highlight ${meetsThreshold ? '' : 'below-threshold'}">${coalitionSeats} (${coalitionPct}%)</span></span>
                <span class="formation-stat">Threshold: <span class="stat-highlight">${meetsThreshold ? `✓ Meets ${GAME_CONFIG.MAJORITY_SEATS} seats` : `✗ Below ${GAME_CONFIG.MAJORITY_SEATS} seats`}</span></span>
            </div>
            ${ideologies.length > 0 ? `<div class="formation-ideologies">${renderIdeologyChips(ideologies)}</div>` : ''}
            ${isProposer ? `
            <div id="edit-coalition-panel" style="display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid #333;">
                <div style="font-size: 0.82rem; color: #888; margin-bottom: 10px;">Add or remove parties from this coalition:</div>
                <div class="party-checkbox-grid" id="edit-party-grid">${editPartiesHTML}</div>
                <div class="proposal-seat-preview" id="edit-seat-preview">
                    Coalition seats: <span class="preview-seats" id="edit-preview-seats">${coalitionSeats}</span> / ${totalLegislatureSeats}
                    (<span id="edit-preview-pct">${coalitionPct}</span>%)
                    <span id="edit-preview-threshold" style="margin-left: 8px; font-size: 0.8rem; color: ${meetsThreshold ? 'var(--green)' : 'var(--text-secondary)'};">${meetsThreshold ? `✓ Meets ${GAME_CONFIG.MAJORITY_SEATS}-seat threshold` : `— needs ${GAME_CONFIG.MAJORITY_SEATS} seats`}</span>
                </div>
                <button class="action-btn" style="max-width: 300px; margin: 8px auto 0; display: block;" onclick="saveCoalitionEdit('${formation.id}')">Save Changes</button>
            </div>
            ` : ''}
        </div>

        <div class="support-bar" id="support-bar">
            <div class="support-bar-title">Coalition Support</div>
            ${supportHTML}
            ${iAmInCoalition ? '<div class="support-exclusive-note">You may only support one coalition at a time. Supporting this one will withdraw support from any other.</div>' : ''}
        </div>

        <div class="formation-layout">
            <div class="ministry-list" id="ministry-list">${ministryHTML}</div>
            <div class="chat-panel">
                <div class="chat-header">Negotiation Chat</div>
                <div class="chat-messages" id="formation-chat-messages">${chatMsgsHTML}</div>
                <div class="chat-input-row">
                    <input type="text" id="formation-chat-input" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendFormationChatMessage()">
