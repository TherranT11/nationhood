<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Government | Nationhood Alpha</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/government.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="top-bar"></div>

<div id="content-area">
    <div class="loading-container">
        <div class="loading-spinner"></div>
        <div>Loading government data...</div>
    </div>
</div>

<!-- Assign Minister Modal -->
<div class="modal-overlay" id="assign-modal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title" id="assign-modal-title">Assign Minister</div>
            <button class="modal-close" onclick="closeAssignModal()">&times;</button>
        </div>
        <div class="modal-subtitle">Select a candidate to appoint to this ministry.</div>
        <div id="assign-candidates"></div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeAssignModal()">Cancel</button>
            <button class="btn-submit" id="assign-confirm-btn" disabled onclick="handleConfirmMinister()">Appoint Minister</button>
        </div>
    </div>
</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { initPage, qCacheBust } from './js/common.js';
import { escapeHtml, tickToDate } from './js/utils.js';
import { GAME_CONFIG, initGameConfigForNation, isGovernmentAutocracy, isGovernmentPresidential, loadSeats, detectHeadFaction, fetchActiveCoalition, generatePMCandidates, deductAP, CANONICAL_GOVERNMENT_TYPES, FORMATION_DEADLINE_TICKS, STATS_HIGHER_IS_BETTER, STATS_LOWER_IS_BETTER, adjustMomentumAll, adjustGovernmentApprovalEvent, callEarlyElectionsAction, closeAdministration, nominateMinister, resignPM, rolloverAdministration } from './js/game-common.js';
import { getPartyIconSVG } from './js/party-icons.js';
(function () {
    'use strict';
/**
 * Government Page
 * Displays government structure, administration, cabinet, and parliament.
 * Autocracy: ruling faction can ASSIGN/PURGE ministers; others can REQUEST.
 */

const MINISTRY_NAMES = {
    prime_minister: 'Prime Minister',
    interior: 'Ministry of the Interior',
    foreign: 'Foreign Ministry',
    defense: 'Ministry of Defense',
    finance: 'Ministry of Finance',
    education: 'Ministry of Education',
    healthcare: 'Ministry of Healthcare',
    labor: 'Ministry of Labor',
    justice: 'Ministry of Justice',
    trade: 'Ministry of Trade',
    energy: 'Ministry of Energy',
    transportation: 'Ministry of Transportation',
    security: 'Ministry of Security'
};

const MINISTRY_KEYS_CABINET = [
    'prime_minister',
    'interior','foreign','defense','finance',
    'education','healthcare','labor','justice','trade','energy','transportation'
];

const FIRST_NAMES_POOL = [
    'Carlos','Diego','Fernando','Héctor','Marcos','Ramón','José','Luis','Miguel',
    'Antonio','Roberto','Francisco','Eduardo','Pablo','Alejandro','Rafael','Gabriel',
    'Santiago','Andrés','Javier','Ricardo','Tomás','Emilio','Sergio','Nicolás',
    'Arturo','Enrique','Oscar','Felipe','Gonzalo','Ignacio','Mateo','Dante'
];
const LAST_NAMES_POOL = [
    'Velasco','Salazar','Guerrero','Ríos','Morales','Torres','Mendoza','Castillo',
    'Herrera','Vargas','Reyes','Cruz','Navarro','Delgado','Ortiz','Romero','Flores',
    'Ramírez','Guzmán','Medina','Soto','Pacheco','Ibarra','Carrasco','Espinoza',
    'Montenegro','Echeverría','Valdez','Córdoba','Aguilar','Paredes','Lara'
];

let currentNation = null;
let currentFaction = null;
let partyData = [];
let coalitionData = null;
let ministryData = [];
let allParties = [];
let allPartySeats = {};
let isAutocracy = false;
let isPresidential = false;
let isPresidentParty = false;
let presidentFactionId = null;
let presidentData = null;
let isRulingFaction = false;
let rulingFactionId = null;
let ministryRequests = [];
let currentTick = 0;
let lastElectionTick = null;

// Assign modal state
let assignMinistryKey = null;
let selectedCandidate = null;
let generatedCandidates = [];
let _coalitionAppointMode = false;

initPage('government', async (state) => {
    const { nation, faction } = state;
    currentNation = nation;
    currentFaction = faction;
    initGameConfigForNation(nation);

    if (!nation) {
        document.getElementById('content-area').innerHTML = '<div class="placeholder-panel"><div class="ph-icon">🏛️</div><h3>No Nation Selected</h3><p>Your party is not assigned to a nation yet.</p></div>';
        return;
    }

    isAutocracy = isGovernmentAutocracy(nation);
    isPresidential = isGovernmentPresidential(nation);

    // Backfill head of state if missing/incomplete
    const hasValidHosAge = Number.isFinite(Number(nation.head_of_state_age)) && Number(nation.head_of_state_age) > 0;
    if (!nation.head_of_state_first_name || !nation.head_of_state_last_name || !hasValidHosAge) {
        const HOS_FIRST = FIRST_NAMES_POOL;
        const HOS_LAST = LAST_NAMES_POOL;
        const hosFirst = nation.head_of_state_first_name || HOS_FIRST[Math.floor(Math.random() * HOS_FIRST.length)];
        const hosLast = nation.head_of_state_last_name || HOS_LAST[Math.floor(Math.random() * HOS_LAST.length)];
        const hosAge = hasValidHosAge ? Number(nation.head_of_state_age) : (45 + Math.floor(Math.random() * 25));
        const { error } = await _supabase.from('nations').update({
            head_of_state_first_name: hosFirst,
            head_of_state_last_name: hosLast,
            head_of_state_age: hosAge
        }).eq('id', nation.id);
        if (!error) {
            currentNation.head_of_state_first_name = hosFirst;
            currentNation.head_of_state_last_name = hosLast;
            currentNation.head_of_state_age = hosAge;
        }
    }

    // Load current tick
    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    currentTick = shard?.current_tick || 0;

    await renderGovernmentPage();
});

async function renderRevolutionBannerGov() {
    var nation = currentNation;
    if (!nation) return '';

    // Get current tick
    var shardRes = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    var currentTick = shardRes.data?.current_tick || 0;

    // Check for post-revolution celebration banner
    var revRes = await _supabase.from('event_log')
        .select('fired_at_tick, description_used')
        .eq('nation_id', nation.id).eq('event_name', 'DEMOCRATIC_REVOLUTION')
        .order('fired_at_tick', { ascending: false }).limit(1).maybeSingle();
    if (revRes.data && (currentTick - revRes.data.fired_at_tick) <= 5) {
        var electionTick = revRes.data.fired_at_tick + 3;
        var ticksUntilElection = Math.max(0, electionTick - currentTick);
        var h = '<div class="revolution-complete-banner">';
        h += '<div class="revolution-icon">&#x1F3DB;</div>';
        h += '<div class="revolution-title">Revolution in the Streets!</div>';
        h += '<div class="revolution-subtitle">' + revRes.data.description_used + '</div>';
        if (ticksUntilElection > 0) {
            h += '<div><span class="revolution-tag">Emergency Elections in ' + ticksUntilElection + ' tick' + (ticksUntilElection !== 1 ? 's' : '') + '</span><span class="revolution-tag">Democracy Established</span></div>';
        } else {
            h += '<div><span class="revolution-tag">Democracy Established</span><span class="revolution-tag">Elections Complete</span></div>';
        }
        h += '</div>';
        return h;
    }

    // Active countdown (Autocracy only)
    if (isGovernmentAutocracy(nation) && nation.revolution_started_tick != null && nation.revolution_duration != null) {
        var elapsed = currentTick - nation.revolution_started_tick;
        var remaining = Math.max(0, nation.revolution_duration - elapsed);
        var h = '<div class="revolution-banner">';
        h += '<div class="revolution-icon">&#x1F525;</div>';
        h += '<div class="revolution-title">Democratic Revolution</div>';
        h += '<div class="revolution-subtitle">The people demand democracy. Pro-democracy protests grow stronger each day.</div>';
        h += '<div class="revolution-countdown">' + remaining + ' tick' + (remaining !== 1 ? 's' : '') + ' until revolution</div>';
        h += '</div>';
        return h;
    }

    return '';
}

async function renderGovernmentPage() {
    document.getElementById('content-area').innerHTML = '<div class="panel-padding"><div class="loading-container" style="height:200px;"><div class="loading-spinner"></div><div>Loading government data...</div></div></div>';

    // Always fetch fresh coalition data — status changes (caretaker, dissolved)
    // must never be masked by stale cache entries
    qCacheBust('coalition_');

    try {
        const [electionData, coalition, ministries, partiesRes] = await Promise.all([
            fetchLatestElection(),
            fetchActiveCoalition(_supabase, currentNation.id),
            fetchMinistries(),
            _supabase.from('factions')
                .select('id, faction_name, is_npc, seats, approval_rating, loyalty, action_points, party_color, party_logo')
                .eq('nation_id', currentNation.id).eq('faction_type', 'party')
        ]);

        // Fetch active Head of Government with trait
        const { data: activeHOG } = await _supabase
            .from('head_of_government')
            .select('*, leader_traits(*)')
            .eq('nation_id', currentNation.id)
            .eq('active', true)
            .maybeSingle();

        coalitionData = coalition;
        ministryData = ministries;
        partyData = electionData?.results?.votes || [];
        allParties = partiesRes.data || [];
        lastElectionTick = electionData?.election_tick || null;

        // Detect caretaker: if coalition exists but status isn't caretaker,
        // check for frozen bills as ground truth (handles legacy tables + failed status updates)
        if (coalition && coalition.status !== 'caretaker') {
            const { count: frozenCount } = await _supabase
                .from('bills')
                .select('*', { count: 'exact', head: true })
                .eq('nation_id', currentNation.id)
                .eq('status', 'frozen');
            if (frozenCount && frozenCount > 0) {
                coalition.status = 'caretaker';
            }
        }

        // If caretaker, fetch the scheduled election tick for the banner
        if (coalition && coalition.status === 'caretaker') {
            const { data: scheduledElection } = await _supabase
                .from('elections')
                .select('election_tick')
                .eq('nation_id', currentNation.id)
                .eq('status', 'scheduled')
                .order('election_tick', { ascending: true })
                .limit(1)
                .maybeSingle();
            if (scheduledElection) {
                coalitionData._earlyElectionTick = scheduledElection.election_tick;
            }
        }

        // Check if coalition formation is in progress for the latest election
        let coalitionFormationInProgress = false;
        if (!isAutocracy && !isPresidential && electionData?.id && !coalition) {
            const { data: formedGov } = await _supabase
                .from('government_formations')
                .select('id')
                .eq('election_id', electionData.id)
                .eq('status', 'formed')
                .limit(1)
                .maybeSingle();
            if (!formedGov) {
                const { data: legacyCoal } = await _supabase
                    .from('active_coalitions')
                    .select('id')
                    .eq('election_id', electionData.id)
                    .limit(1)
                    .maybeSingle();
                coalitionFormationInProgress = !legacyCoal;
            }
        }

        // Refresh current faction AP
        const freshFaction = allParties.find(p => p.id === currentFaction?.id);
        if (freshFaction && currentFaction) {
            currentFaction.action_points = freshFaction.action_points;
        }

        // Seat loading via game-common.js
        const seatData = await loadSeats(_supabase, currentNation.id, isAutocracy, allParties, currentFaction?.id);
        allPartySeats = seatData.allPartySeats;

        // Detect ruling faction for autocracy
        if (isAutocracy) {
            const hf = await detectHeadFaction(_supabase, currentNation.id, allParties, allPartySeats, currentFaction?.id);
            rulingFactionId = hf.headFactionId;
            isRulingFaction = hf.isHeadFaction;

            const { data: requests } = await _supabase
                .from('ministry_requests')
                .select('*, factions(faction_name)')
                .eq('nation_id', currentNation.id);
            ministryRequests = requests || [];
        }

        // Detect president's party for Presidential systems
        if (isPresidential) {
            const { data: activePresident } = await _supabase
                .from('presidents')
                .select('id, faction_id, first_name, last_name, age, ideology, trait, elected_tick, term_ends_tick, terms_served')
                .eq('nation_id', currentNation.id).eq('is_active', true)
                .order('elected_tick', { ascending: false })
                .limit(1).maybeSingle();
            presidentData = activePresident || null;
            presidentFactionId = activePresident?.faction_id || null;
            isPresidentParty = (presidentFactionId && currentFaction?.id === presidentFactionId);
            // Fetch trait data for the president
            if (presidentData?.trait) {
                const { data: traitData } = await _supabase.from('leader_traits').select('trait_name, upside, downside').eq('trait_key', presidentData.trait).single();
                if (traitData) presidentData._traitData = traitData;
            }
        }

        // Government approval
        let governmentApproval = await calculateGovernmentApproval();

        // Fetch recent gov approval events for display
        const { data: govApprovalEvents } = await _supabase
            .from('gov_approval_log')
            .select('amount, source, tick')
            .eq('nation_id', currentNation.id)
            .order('tick', { ascending: false })
            .limit(8);
        currentNation._govApprovalEvents = govApprovalEvents || [];

        // Check for pending PM or President candidates (player needs to select)
        const primeMinister = ministries?.find(m => m.ministry_key === 'prime_minister');
        let hasPendingPMSelection = false;
        let hasPendingPresidentSelection = false;
        if (currentFaction && !isPresidential) {
            const { count } = await _supabase
                .from('pm_candidates')
                .select('*', { count: 'exact', head: true })
                .eq('nation_id', currentNation.id)
                .eq('faction_id', currentFaction.id)
                .eq('selected', false);
            hasPendingPMSelection = (count || 0) > 0;
        }

        // Auto-recover orphaned PM state: coalition exists, PM has null names, no candidates
        if (!hasPendingPMSelection && !isPresidential && coalition && !activeHOG) {
            const pmPartyId = coalition.ministry_assignments?.prime_minister || coalition.lead_party_id;
            const pmHasNullNames = primeMinister && (!primeMinister.minister_first_name || !primeMinister.minister_last_name);
            if (pmPartyId && pmHasNullNames && currentFaction?.id === pmPartyId) {
                try {
                    const { data: shard } = await _supabase.from('shard')
                        .select('current_tick').eq('name', 'Alpha Shard').single();
                    await generatePMCandidates(_supabase, currentNation.id, pmPartyId, shard?.current_tick || 0);
                    hasPendingPMSelection = true;
                    console.log('Auto-recovered orphaned PM state: generated PM candidates');
                } catch (recoverErr) {
                    console.error('PM auto-recovery failed:', recoverErr);
                }
            }
        }

        if (currentFaction && isPresidential) {
            const { count } = await _supabase
                .from('pm_candidates')
                .select('*', { count: 'exact', head: true })
                .eq('nation_id', currentNation.id)
                .eq('faction_id', currentFaction.id)
                .eq('candidate_type', 'presidential')
                .eq('selected', false);
            hasPendingPresidentSelection = (count || 0) > 0;
        }

        const revolutionBannerHtml = await renderRevolutionBannerGov();
        const administrationBoxHtml = await renderAdministrationBox(coalition, partyData, primeMinister, governmentApproval, activeHOG, coalitionFormationInProgress, allPartySeats);

        document.getElementById('content-area').innerHTML = `
            <div class="panel-padding">
                ${revolutionBannerHtml}
                ${hasPendingPMSelection ? `
    <div style="background:linear-gradient(135deg,#2a2200,#1a1a00);border:2px solid var(--accent);border-radius:12px;padding:20px;margin-bottom:24px;text-align:center;cursor:pointer;" onclick="window.location.href='select-pm.html'">
        <div style="font-size:1.8rem;margin-bottom:8px;">👑</div>
        <div style="font-size:1.1rem;color:var(--accent);font-weight:bold;text-transform:uppercase;letter-spacing:2px;margin-bottom:6px;">Select Your Prime Minister</div>
        <div style="font-size:0.85rem;color:var(--text-secondary);">Your coalition has formed. Choose who will lead the nation.</div>
        <div style="margin-top:12px;display:inline-block;padding:8px 24px;background:var(--accent);color:#121212;border-radius:6px;font-weight:bold;font-size:0.85rem;text-transform:uppercase;letter-spacing:1px;">Choose Now →</div>
    </div>
` : ''}
                ${hasPendingPresidentSelection ? `
    <div style="background:linear-gradient(135deg,#2a2200,#1a1a00);border:2px solid var(--accent);border-radius:12px;padding:20px;margin-bottom:24px;text-align:center;cursor:pointer;" onclick="window.location.href='select-president.html'">
        <div style="font-size:1.8rem;margin-bottom:8px;">🏛️</div>
        <div style="font-size:1.1rem;color:var(--accent);font-weight:bold;text-transform:uppercase;letter-spacing:2px;margin-bottom:6px;">Select Your Candidate</div>
        <div style="font-size:0.85rem;color:var(--text-secondary);">A presidential election is approaching. Nominate your party's candidate.</div>
        <div style="margin-top:12px;display:inline-block;padding:8px 24px;background:var(--accent);color:#121212;border-radius:6px;font-weight:bold;font-size:0.85rem;text-transform:uppercase;letter-spacing:1px;">Nominate Now →</div>
    </div>
` : ''}
                ${administrationBoxHtml}

                <div class="section-header">Government Structure</div>
                <div class="info-block">
                    <div class="info-row"><span class="info-label">Government Type</span><span class="info-value">${currentNation.government_type || 'Parliamentary Democracy'}</span></div>
                    <div class="info-row"><span class="info-label">Legislative Branch</span><span class="info-value">Unicameral (${GAME_CONFIG.TOTAL_SEATS} Seats)</span></div>
                    <div class="info-row"><span class="info-label">Majority Threshold</span><span class="info-value">${GAME_CONFIG.MAJORITY_SEATS} Seats</span></div>
                </div>

                <div class="section-header">Cabinet</div>
                ${renderCabinet(ministries, coalition)}

                <div class="section-header">Current Parliamentary Makeup</div>
                <div class="parliament-wrap">
                    <svg id="parliament-svg" viewBox="0 0 520 280"></svg>
                </div>
                <div class="parliament-legend" id="parliament-legend"></div>

                <div id="past-administrations-container"></div>
            </div>
        `;

        if (partyData.length > 0) {
            // Enrich partyData with DB colors for parliament visualization
            const enrichedPartyData = partyData.map((p, i) => {
                const dbParty = allParties.find(x => x.id === p.party_id);
                return { ...p, color: dbParty?.party_color || FALLBACK_COLORS[i % FALLBACK_COLORS.length] };
            });
            drawParliament(enrichedPartyData);
        }

        // Load and render past administrations
        loadPastAdministrations();

        // Load admin chat messages
        loadAdminChat();

    } catch (error) {
        console.error('Error loading government data:', error);
        document.getElementById('content-area').innerHTML = '<div class="panel-padding"><div class="placeholder-panel"><div class="ph-icon">⚠️</div><h3>Error Loading Data</h3><p>Could not load government information. Please refresh.</p></div></div>';
    }
}

// ==================== DATA FETCHING ====================

async function fetchLatestElection() {
    const { data } = await _supabase.from('elections').select('*')
        .eq('nation_id', currentNation.id).eq('status', 'completed')
        .eq('election_type', 'parliamentary')
        .order('election_tick', { ascending: false }).order('created_at', { ascending: false }).limit(1).maybeSingle();
    return data;
}

async function fetchMinistries() {
    const { data } = await _supabase.from('ministries').select('*, factions(faction_name)')
        .eq('nation_id', currentNation.id).eq('is_active', true);
    return data || [];
}

async function calculateGovernmentApproval() {
    const { data: nation } = await _supabase
        .from('nations')
        .select('gov_approval')
        .eq('id', currentNation.id)
        .single();
    return nation?.gov_approval ?? 50;
}

function getPartyNameById(partyId) {
    const p = partyData.find(p => p.party_id === partyId);
    return p ? p.party_name : (allParties.find(f => f.id === partyId)?.faction_name || 'Unknown');
}

const FALLBACK_COLORS = ['#E91E63','#2196F3','#4CAF50','#FF9800','#9C27B0','#00BCD4','#F44336','#8BC34A','#FFC107','#673AB7'];

function getPartyColorById(partyId) {
    const idx = allParties.findIndex(p => p.id === partyId);
    const p = idx >= 0 ? allParties[idx] : null;
    return p?.party_color || FALLBACK_COLORS[(idx >= 0 ? idx : 0) % FALLBACK_COLORS.length];
}
function getPartyLogoById(partyId) {
    const p = allParties.find(x => x.id === partyId);
    return p?.party_logo || null;
}

// ==================== ADMINISTRATION BOX ====================

async function renderAdministrationBox(coalition, parties, primeMinister, governmentApproval, activeHOG, coalitionFormationInProgress, allPartySeats) {
    allPartySeats = allPartySeats || {};
    const hosFirst = currentNation.head_of_state_first_name || 'Unknown';
    const hosLast = currentNation.head_of_state_last_name || 'Unknown';
    const hosAge = currentNation.head_of_state_age || '—';
    const approvalColor = governmentApproval >= 60 ? '#4CAF50' : governmentApproval >= 40 ? 'var(--accent)' : '#ff4444';
    const inst = Math.round(currentNation.gov_approval_institutional ?? 50);
    const outc = Math.round(currentNation.gov_approval_outcomes ?? 50);
    const evRaw = currentNation.gov_approval_events ?? 0;
    const ev = Math.round(Math.max(0, Math.min(100, 50 + evRaw)));
    const approvalHTML = `<div style="text-align:right;position:relative;" class="gov-approval-hover">
        <div style="font-size:0.7rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px;">Government Approval</div>
        <div style="font-size:1.4rem;font-weight:bold;color:${approvalColor};">${governmentApproval}%</div>
        <div class="gov-approval-tooltip">
            <div class="gov-tip-title">Approval Breakdown</div>
            <div class="gov-tip-row">
                <span class="gov-tip-label">Institutional (45%)</span>
                <div class="gov-tip-bar"><div class="gov-tip-bar-fill" style="width:${inst}%;background:#4CAF50"></div></div>
                <span class="gov-tip-val">${inst}</span>
            </div>
            <div class="gov-tip-desc">Minister performance, vacancies & crises</div>
            <div class="gov-tip-row">
                <span class="gov-tip-label">Outcomes (35%)</span>
                <div class="gov-tip-bar"><div class="gov-tip-bar-fill" style="width:${outc}%;background:#2196F3"></div></div>
                <span class="gov-tip-val">${outc}</span>
            </div>
            <div class="gov-tip-desc">Economic & social stat trends</div>
            <div class="gov-tip-row">
                <span class="gov-tip-label">Events (20%)</span>
                <div class="gov-tip-bar"><div class="gov-tip-bar-fill" style="width:${ev}%;background:#ff9800"></div></div>
                <span class="gov-tip-val">${ev}</span>
            </div>
            <div class="gov-tip-desc">Recent crises & events (decays over time)</div>
            ${(() => {
                const events = currentNation._govApprovalEvents || [];
                if (events.length === 0) return '';
                const GOV_SOURCE_LABELS = {
                    'crisis:government_shutdown': 'Gov shutdown',
                    'crisis:scandal': 'Scandal',
                    'crisis:natural_disaster': 'Natural disaster',
                    'minister:fired': 'Minister fired',
                    'bill:enactment': 'Bill enacted',
                    'bill:veto': 'Bill vetoed',
                    'election:result': 'Election result'
                };
                const rows = events.map(e => {
                    const label = GOV_SOURCE_LABELS[e.source] || e.source.replace(/[_:]/g, ' ');
                    const sign = e.amount > 0 ? '+' : '';
                    const color = e.amount > 0 ? '#4CAF50' : '#ff4444';
                    return '<div class="gov-tip-evt"><span>' + label + '</span><span style="color:' + color + '">' + sign + Math.round(e.amount * 10) / 10 + '</span></div>';
                }).join('');
                return '<div class="gov-tip-events-title">Recent Events</div>' + rows;
            })()}
        </div>
    </div>`;

    // Safe PM name: prevents "null null" when ministry row exists but names are SQL NULL
    function safePmName(pm) {
        if (!pm || !pm.minister_first_name || !pm.minister_last_name) return '—';
        return `${pm.minister_first_name} ${pm.minister_last_name}`;
    }

    // Administration name uses Head of Government (PM), falling back to Head of State
    const adminLast = activeHOG?.last_name || primeMinister?.minister_last_name || hosLast;

    // Coalition formation in progress — show placeholder instead of stale admin data
    if (coalitionFormationInProgress) {
        return `
            <div class="administration-box">
                <div class="administration-header">

                    <div class="administration-subtitle">Coalition negotiations are in progress</div>

    // === AUTOCRACY: No ruling faction yet — show Seize Power prompt ===

                <div class="administration-header">

                                <div style="font-size:0.72rem;color:var(--text-secondary);margin-bottom:4px;">${termRemaining <= 0 ? termRemainingDisplay : `Term Remaining: ${termRemainingDisplay}`}</div>

                            <div class="admin-section-title">Vice President</div>
                            <div class="admin-person-name">${escapeHtml(hosFirst)} ${escapeHtml(hosLast)}</div>

                            <div class="admin-section"><div class="admin-section-title">Head of State</div><div class="admin-person-name">${escapeHtml(hosFirst)} ${escapeHtml(hosLast)}</div><div class="admin-person-details">Age ${hosAge} • <span class="admin-person-party">${escapeHtml(majorityParty.party_name)}</span></div></div>

        // ==============================

        // ==============================
        return renderFormationInProgress(parties);
    }

    // ==================== DEMOCRACY: ACTIVE COALITION ====================
    if (coalition) {
        const leadParty = parties.find(p => p.party_id === coalition.lead_party_id);
        const leadPartyName = leadParty ? leadParty.party_name : 'Unknown';
        const pmName = safePmName(primeMinister);
        const pmAge = primeMinister?.minister_age || '—';
        const pmParty = primeMinister ? (primeMinister.factions?.faction_name || getPartyNameById(primeMinister.party_id)) : '—';
        const coalitionParties = coalition.party_ids.map(id => { const p = parties.find(x => x.party_id === id); const fallbackName = allParties.find(f => f.id === id)?.faction_name || 'Unknown'; return p ? { ...p, seats: allPartySeats[id] || p.seats || 0 } : { party_name: fallbackName, seats: allPartySeats[id] || 0 }; }).sort((a,b) => b.seats - a.seats);

            <div class="administration-box">

                                ` : ''}

                        const cpLogo = getPartyLogoById(p.party_id || allParties.find(x => x.faction_name === p.party_name)?.id);
                        const cpLogoHtml = cpLogo ? `<span style="display:inline-flex;vertical-align:middle;margin-right:5px;">${getPartyIconSVG(cpLogo, 16, cpColor)}</span>` : '';
                        return `${i > 0 ? '<span class="coalition-divider">|</span>' : ''}<div class="coalition-party-tag" style="border-left:3px solid ${cpColor};padding-left:8px;">${cpLogoHtml}${escapeHtml(p.party_name)}<span class="seats">${p.seats} Seats</span></div>`;

// ==================== ADMINISTRATIVE COMMUNICATIONS ====================

let adminChatMessages = [];
let adminChatLoaded = false;
let adminChatSubscription = null;

function renderAdminChat() {
    return `
        <div class="admin-chat-section" id="admin-chat-box">
            <div class="admin-chat-header">Administrative Communications</div>
            <div class="admin-chat-messages" id="admin-chat-messages">
                <div class="admin-chat-empty">Loading messages...</div>
            </div>
            ${currentFaction ? `
            <div class="admin-chat-input-row">
                <input type="text" class="admin-chat-input" id="admin-chat-input" placeholder="Type a message..." maxlength="300" onkeydown="if(event.key==='Enter')sendAdminChat()">
                <button class="admin-chat-send" id="admin-chat-send-btn" onclick="sendAdminChat()">Send</button>
            </div>` : ''}
        </div>`;
}

async function loadAdminChat() {
    if (!currentNation) return;
    const { data, error } = await _supabase
        .from('admin_chat')
        .select('id, faction_id, message, tick_posted, created_at')
        .eq('nation_id', currentNation.id)
        .order('created_at', { ascending: true })
        .limit(50);
    if (error) { console.error('Failed to load admin chat:', error); return; }
    adminChatMessages = data || [];
    adminChatLoaded = true;
    renderChatMessages();
    subscribeAdminChat();
}

function subscribeAdminChat() {
    if (adminChatSubscription || !currentNation) return;
    adminChatSubscription = _supabase
        .channel('admin_chat_' + currentNation.id)
        .on('postgres_changes', {
            event: 'INSERT',
            schema: 'public',
            table: 'admin_chat',
            filter: 'nation_id=eq.' + currentNation.id
        }, (payload) => {
            const msg = payload.new;
            if (!adminChatMessages.find(m => m.id === msg.id)) {
                adminChatMessages.push(msg);
                renderChatMessages();
            }
        })
        .subscribe();
}

function renderChatMessages() {
    const container = document.getElementById('admin-chat-messages');
    if (!container) return;
    if (adminChatMessages.length === 0) {
        container.innerHTML = '<div class="admin-chat-empty">No messages yet. Start the conversation.</div>';
        return;
    }
    container.innerHTML = adminChatMessages.map(m => {
        const party = allParties.find(p => p.id === m.faction_id);
        const partyName = party?.faction_name || 'Unknown';
        const partyColor = party?.party_color || '#888';
        const partyLogo = party?.party_logo;
        const logoHtml = partyLogo ? `<span style="display:inline-flex;vertical-align:middle;">${getPartyIconSVG(partyLogo, 14, partyColor)}</span>` : '';
        const timeAgo = formatChatTime(m.created_at);
        const escapedMsg = escapeHtml(m.message);
        return `<div class="admin-chat-msg" style="border-left-color:${partyColor};">
            <div class="admin-chat-msg-header">
                ${logoHtml}
                <span class="admin-chat-msg-party" style="color:${partyColor};">${escapeHtml(partyName)}</span>
                <span class="admin-chat-msg-time">${timeAgo}</span>
            </div>
            <div class="admin-chat-msg-body">${escapedMsg}</div>
        </div>`;
    }).join('');
    container.scrollTop = container.scrollHeight;
}

// escapeHtml imported from utils.js

function formatChatTime(isoStr) {
    if (!isoStr) return '';
    const d = new Date(isoStr);
    const now = new Date();
    const diffMs = now - d;
    const diffMin = Math.floor(diffMs / 60000);
    if (diffMin < 1) return 'just now';
    if (diffMin < 60) return diffMin + 'm ago';
    const diffH = Math.floor(diffMin / 60);
    if (diffH < 24) return diffH + 'h ago';
    const diffD = Math.floor(diffH / 24);
    return diffD + 'd ago';
}

window.sendAdminChat = async function() {
    const input = document.getElementById('admin-chat-input');
    const btn = document.getElementById('admin-chat-send-btn');
    if (!input || !currentFaction || !currentNation) return;
    const message = input.value.trim();
    if (!message) return;
    btn.disabled = true;
    input.disabled = true;
    const { error } = await _supabase.from('admin_chat').insert({
        nation_id: currentNation.id,
        faction_id: currentFaction.id,
        message: message,
        tick_posted: currentTick
    });
    if (error) {
        console.error('Failed to send message:', error);
        alert('Failed to send message.');
    } else {
        input.value = '';
        // If realtime isn't working, manually add
        if (!adminChatSubscription) {
            adminChatMessages.push({
                id: crypto.randomUUID(),
                faction_id: currentFaction.id,
                message: message,
                tick_posted: currentTick,
                created_at: new Date().toISOString()
            });
            renderChatMessages();
        }
    }
    btn.disabled = false;
    input.disabled = false;
    input.focus();
};

// ==================== FORMATION IN PROGRESS ====================

function renderFormationInProgress(parties) {
    const ticksElapsed = (lastElectionTick !== null) ? Math.max(0, currentTick - lastElectionTick) : 0;
    const ticksRemaining = Math.max(0, FORMATION_DEADLINE_TICKS - ticksElapsed);
    const progressPct = Math.min(100, (ticksElapsed / FORMATION_DEADLINE_TICKS) * 100);

    // Determine urgency level
    let urgency = 'safe';
    if (ticksRemaining <= 1) urgency = 'critical';
    else if (ticksRemaining <= 2) urgency = 'warning';

    // Calculate accrued penalties
    const accruedApproval = ticksElapsed * 2;
    const accruedStability = ticksElapsed * 1;

    // Find largest and second largest parties for snap penalty display
    const sorted = [...parties].sort((a, b) => b.seats - a.seats);
    const largestParty = sorted[0];
    const secondParty = sorted[1];

    return `
        <div class="formation-box">
            <div class="formation-header">
                <div class="formation-icon">⚠️</div>
                <div class="formation-title">No Government</div>
                <div class="formation-subtitle">Government formation is in progress — all parties may propose a coalition</div>
            </div>
            <div class="formation-body">
                <!-- Countdown -->
                <div class="formation-countdown">
                    <div class="countdown-label">Time Remaining Before Snap Election</div>
                    <div class="countdown-track">
                        <div class="countdown-fill ${urgency}" style="width: ${progressPct}%"></div>
                    </div>
                    <div class="countdown-text ${urgency}">
                        ${ticksRemaining > 0
                            ? ticksRemaining + ' tick' + (ticksRemaining !== 1 ? 's' : '') + ' remaining'
                            : '⚡ SNAP ELECTION IMMINENT'}
                    </div>
                    <div class="countdown-detail">
                        ${ticksElapsed > 0
                            ? ticksElapsed + ' tick' + (ticksElapsed !== 1 ? 's' : '') + ' without a government (of ${FORMATION_DEADLINE_TICKS} allowed)'
                            : 'Election just concluded — form a coalition to avoid penalties'}
                    </div>
                </div>

                <!-- Penalty Cards -->
                <div class="formation-penalties">
                    <div class="penalty-card active-penalty">
                        <div class="penalty-value red">-2%</div>
                        <div class="penalty-label">Party Approval / Tick</div>
                        <div class="penalty-detail">All parties lose approval each tick</div>
                    </div>
                    <div class="penalty-card active-penalty">
                        <div class="penalty-value red">-1</div>
                        <div class="penalty-label">Stability / Tick</div>
                        <div class="penalty-detail">National stability erodes</div>
                    </div>
                    <div class="penalty-card accrued">
                        <div class="penalty-value orange">${ticksElapsed > 0 ? ticksElapsed : '0'}</div>
                        <div class="penalty-label">Ticks Elapsed</div>
                        <div class="penalty-detail">${accruedApproval > 0 ? '-' + accruedApproval + '% approval, -' + accruedStability + ' stability lost' : 'No penalties accrued yet'}</div>
                    </div>
                </div>

                <!-- Snap Election Warning -->
                <div class="snap-warning ${urgency === 'critical' ? 'imminent' : ''}">
                    <div class="snap-warning-icon">🗳️</div>
                    <div class="snap-warning-content">
                        <div class="snap-warning-title">
                            ${ticksRemaining <= 0
                                ? 'Snap Election Will Trigger Next Tick!'
                                : 'Snap Election in ' + ticksRemaining + ' Tick' + (ticksRemaining !== 1 ? 's' : '')}
                        </div>
                        <div class="snap-warning-desc">
                            If no government is formed within ${FORMATION_DEADLINE_TICKS} ticks, a snap election is called with approval penalties applied before voting.
                        </div>
                        <div class="snap-penalty-tags">
                            <span class="snap-penalty-tag first">${largestParty ? largestParty.party_name : 'Largest'}: -10% Approval</span>
                            ${secondParty ? `<span class="snap-penalty-tag second">${secondParty.party_name}: -5% Approval</span>` : ''}
                        </div>
                    </div>
                </div>

                <!-- CTA -->
                <div class="formation-cta">
                    <button class="formation-cta-btn" onclick="window.location.href='elections.html'">
                        🤝 Propose Coalition →
                    </button>
                    <div class="formation-cta-sub">Any party may propose a coalition on the Elections page</div>
                </div>
            </div>
        </div>`;
}

// ==================== CABINET ====================

function renderCabinet(ministries, coalition) {
    if (!ministries || ministries.length === 0) {
        // Presidential systems always use their own rendering (with Nominate buttons)
        if (isPresidential) {
            const presKeys = MINISTRY_KEYS_CABINET.filter(k => k !== 'prime_minister');
            const cards = presKeys.map(key => renderPresidentialMinistryCard(key, null)).join('');
            return `<div class="ministry-grid">${cards}</div>`;
        }
        if (coalition && coalition.ministry_allocations) {
            const cards = Object.entries(coalition.ministry_allocations)
                .filter(([key]) => key !== 'prime_minister')
                .map(([key, partyId]) => {
                    const party = partyData.find(p => p.party_id === partyId);
                    return `<div class="ministry-card vacant" style="padding:10px 12px;"><div class="ministry-title">${MINISTRY_NAMES[key] || key}</div><div class="minister-name" style="color:var(--text-muted);">To be appointed</div><div class="minister-details"><span class="minister-party">${party?.party_name || 'Unknown'}</span></div></div>`;
                }).join('');
            return `<div class="ministry-grid">${cards}</div>`;
        }
        if (isAutocracy) {
            const cards = MINISTRY_KEYS_CABINET.map(key => {
                const requests = ministryRequests.filter(r => r.ministry_key === key);
                return `<div class="ministry-card vacant" style="padding:10px 12px;"><div class="ministry-title">${MINISTRY_NAMES[key]}</div><div class="minister-name" style="color:var(--text-muted);">Vacant</div>${requests.length > 0 ? `<span class="request-badge">${requests.length}</span>` : ''}${renderMinistryActions(key, false, requests, null)}</div>`;
            }).join('');
            return `<div class="ministry-grid">${cards}</div>`;
        }
        return '<div class="info-block" style="text-align:center;color:var(--text-secondary);padding:30px;">No cabinet has been formed yet.</div>';
    }

    const ministryMap = {};
    ministries.forEach(m => { ministryMap[m.ministry_key] = m; });

    if (isAutocracy) {
        const cards = MINISTRY_KEYS_CABINET.map(key => {
            const m = ministryMap[key];
            const isFilled = m && m.minister_first_name;
            const requests = ministryRequests.filter(r => r.ministry_key === key);

            if (isFilled) {
                const partyName = m.factions?.faction_name || 'Unknown';
                const mColor = getPartyColorById(m.party_id);
                const mLogo = getPartyLogoById(m.party_id);
                const mLogoHtml = mLogo ? `<span style="display:inline-flex;vertical-align:middle;margin-right:5px;">${getPartyIconSVG(mLogo, 16, mColor)}</span>` : '';
                const appr = m.minister_approval ?? 50;
                const apprCls = appr < 35 ? 'low' : appr < 50 ? 'mid' : 'high';
                return `<div class="ministry-card" style="border-top:3px solid ${mColor};padding:10px 12px;"><div class="ministry-title">${m.ministry_name || MINISTRY_NAMES[key]}</div><div class="minister-name">${escapeHtml(m.minister_first_name)} ${escapeHtml(m.minister_last_name)}</div><div class="minister-details">Age ${m.minister_age || '?'} • <span class="minister-party" style="color:${mColor};">${mLogoHtml}${escapeHtml(partyName)}</span></div><div class="minister-approval">Approval: <span class="${apprCls}">${Math.round(appr)}%</span></div>${requests.length > 0 ? `<span class="request-badge">${requests.length}</span>` : ''}${renderMinistryActions(key, true, requests, m)}</div>`;
            } else {
                return `<div class="ministry-card vacant" style="padding:10px 12px;"><div class="ministry-title">${MINISTRY_NAMES[key]}</div><div class="minister-name" style="color:var(--text-muted);">Vacant</div>${requests.length > 0 ? `<span class="request-badge">${requests.length}</span>` : ''}${renderMinistryActions(key, false, requests, null)}</div>`;
            }
        }).join('');
        return `<div class="ministry-grid">${cards}</div>`;
    }

    // === PRESIDENTIAL SYSTEM ===
    if (isPresidential) {
        const presKeys = MINISTRY_KEYS_CABINET.filter(k => k !== 'prime_minister');
        const cards = presKeys.map(key => renderPresidentialMinistryCard(key, ministryMap[key])).join('');
        return `<div class="ministry-grid">${cards}</div>`;
    }

    const isCaretaker = coalition && coalition.status === 'caretaker';
    const pmMinistry = ministries.find(m => m.ministry_key === 'prime_minister');
    const pmFilled = pmMinistry && pmMinistry.minister_first_name && pmMinistry.minister_last_name;
    const isPMParty = currentFaction && coalition && currentFaction.id === coalition.lead_party_id;
    const canAppoint = isPMParty && pmFilled && !isCaretaker;

    const demKeys = MINISTRY_KEYS_CABINET.filter(function(k) { return k !== 'prime_minister'; });
    const demCards = demKeys.map(function(key) {
        var m = ministryMap[key];
        var vacant = !m || !m.minister_first_name || !m.minister_last_name;
        var title = MINISTRY_NAMES[key] || key;

        if (vacant) {
            var appointBtn = canAppoint ? '<div class="ministry-actions"><button class="ministry-btn assign" onclick="openAssignModal(\'' + key + '\')">✦ Appoint</button></div>' : '';
            return '<div class="ministry-card vacant">'
                + '<div class="ministry-header"><div class="ministry-title">' + title + '</div></div>'
                + '<div class="ministry-body"><div class="minister-name" style="color:var(--text-muted);">Vacant</div>' + appointBtn + '</div></div>';
        }

        var partyName = m.factions?.faction_name || 'Unknown';
        var mColor = getPartyColorById(m.party_id);
        var mLogo = getPartyLogoById(m.party_id);
        var mLogoHtml = mLogo ? '<span style="display:inline-flex;vertical-align:middle;margin-right:5px;">' + getPartyIconSVG(mLogo, 16, mColor) + '</span>' : '';
        var name = m.minister_first_name + ' ' + m.minister_last_name;
        var isMyMinistry = currentFaction && m.party_id === currentFaction.id;
        var resignBtn = (isMyMinistry && !isCaretaker) ? '<div class="ministry-actions"><button class="ministry-btn purge" onclick="event.stopPropagation();resignMinistry(\'' + m.ministry_key + '\')">Resign Ministry</button></div>' : '';
        var appr = m.minister_approval ?? 50;
        var apprCls = appr < 35 ? 'low' : appr < 50 ? 'mid' : 'high';

        // Embattled / Crisis badges
        var statusBadge = '';
        if (m.embattled_since_tick != null && (currentTick - m.embattled_since_tick) >= 5) {
            if (appr < 20) {
                statusBadge = '<span class="minister-badge crisis">CRISIS</span>';
            } else {
                statusBadge = '<span class="minister-badge embattled">EMBATTLED</span>';
            }
        }

        // Fire button: visible to PM party (parliamentary) — not for own party resignations
        var fireBtn = '';
        if (isPMParty && !isCaretaker && !isMyMinistry) {
            var apCost = (currentFaction?.action_points || 0) < 1;
            fireBtn = '<div class="ministry-actions"><button class="ministry-btn dismiss" onclick="event.stopPropagation();fireMinister(\'' + m.ministry_key + '\')"' + (apCost ? ' disabled title="Need 1 AP"' : '') + '>Dismiss Minister <span class="ap-cost">1 AP</span></button></div>';
        }

        return '<div class="ministry-card" style="border-top-color:' + mColor + ';">'
            + '<div class="ministry-header"><div class="ministry-title">' + (m.ministry_name || title) + '</div>' + statusBadge + '</div>'
            + '<div class="ministry-body">'
            + '<div class="minister-name">' + escapeHtml(name) + '</div>'
            + '<div class="minister-details">' + (m.minister_age ? 'Age ' + m.minister_age + ' &bull; ' : '') + '<span class="minister-party" style="color:' + mColor + ';">' + mLogoHtml + escapeHtml(partyName) + '</span></div>'
            + '<div class="minister-approval">Approval: <span class="' + apprCls + '">' + Math.round(appr) + '%</span></div>'
            + resignBtn + fireBtn + '</div></div>';
    }).join('');
    return '<div class="ministry-grid">' + demCards + '</div>';
}

function renderMinistryActions(key, isFilled, requests, ministry) {
    if (!isAutocracy) return '';
    const ap = currentFaction?.action_points || 0;
    const myRequest = requests.find(r => r.faction_id === currentFaction?.id);
    const isMyMinistry = isFilled && ministry && currentFaction && ministry.party_id === currentFaction.id;
    let html = '<div class="ministry-actions">';

    if (isRulingFaction) {
        if (isFilled) {
            html += `<button class="ministry-btn purge" onclick="purgeMinister('${key}')" ${ap < 1 ? 'disabled title="Need 1 AP"' : ''}>⛔ Purge <span class="ap-cost">1 AP</span></button>`;
        } else {
            html += `<button class="ministry-btn assign" onclick="openAssignModal('${key}')">✦ Assign <span class="ap-cost">0 AP</span></button>`;
        }
        html += '</div>';
        if (requests.length > 0) {
            html += '<div class="request-list">';
            requests.forEach(r => {
                html += `<div class="request-item"><span class="request-item-party">${r.factions?.faction_name || 'Unknown'} requests this</span><div class="request-item-actions"><button class="req-btn deny" onclick="denyRequest('${r.id}')">✕ Deny</button></div></div>`;
            });
            html += '</div>';
        }
    } else if (isMyMinistry) {
        html += `<button class="ministry-btn purge" onclick="resignMinistry('${key}')">📋 Resign Ministry</button>`;
        html += '</div>';
    } else {
        const totalMyRequests = ministryRequests.filter(r => r.faction_id === currentFaction?.id).length;
        if (myRequest) {
            html += `<button class="ministry-btn unrequest" onclick="unrequestMinistry('${myRequest.id}')">↩ Unrequest <span class="ap-cost">0 AP</span></button>`;
        } else {
            const canRequest = totalMyRequests < 2 && ap >= 1;
            html += `<button class="ministry-btn request" onclick="requestMinistry('${key}')" ${canRequest ? '' : 'disabled'}>📋 Request <span class="ap-cost">1 AP</span></button>`;
            if (totalMyRequests >= 2) html += '<span class="max-requests-note">Max 2 requests</span>';
            else if (ap < 1) html += '<span class="max-requests-note">Need 1 AP</span>';
        }
        html += '</div>';
    }

    return html;
}

// ==================== PRESIDENTIAL MINISTRY CARDS ====================

function renderPresidentialMinistryCard(key, ministry) {
    const isFilled = ministry && ministry.minister_first_name && ministry.confirmation_status === 'confirmed';
    const isPending = ministry && ministry.confirmation_status === 'pending' && ministry.pending_minister;
    const wasRejected = ministry && ministry.confirmation_status === 'rejected';
    const rejectedParties = ministry?.rejected_parties || [];

    if (isFilled) {
        const partyName = ministry.factions?.faction_name || 'Unknown';
        const pmColor = getPartyColorById(ministry.party_id);
        const pmLogo = getPartyLogoById(ministry.party_id);
        const pmLogoHtml = pmLogo ? `<span style="display:inline-flex;vertical-align:middle;margin-right:5px;">${getPartyIconSVG(pmLogo, 16, pmColor)}</span>` : '';
        const appr = ministry.minister_approval ?? 50;
        const apprCls = appr < 35 ? 'low' : appr < 50 ? 'mid' : 'high';

        // Embattled / Crisis badges
        let statusBadge = '';
        if (ministry.embattled_since_tick != null && (currentTick - ministry.embattled_since_tick) >= 5) {
            if (appr < 20) {
                statusBadge = '<span class="minister-badge crisis">CRISIS</span>';
            } else {
                statusBadge = '<span class="minister-badge embattled">EMBATTLED</span>';
            }
        }

        // Fire button for President's party
        let fireBtn = '';
        if (isPresidentParty) {
            const apCost = (currentFaction?.action_points || 0) < 1;
            fireBtn = `<div class="ministry-actions"><button class="ministry-btn dismiss" onclick="event.stopPropagation();fireMinister('${key}')"${apCost ? ' disabled title="Need 1 AP"' : ''}>Dismiss Minister <span class="ap-cost">1 AP</span></button></div>`;
        }

        return `<div class="ministry-card" style="border-top:3px solid ${pmColor};padding:10px 12px;">
            <div class="ministry-header"><div class="ministry-title">${ministry.ministry_name || MINISTRY_NAMES[key]}</div>${statusBadge}</div>
            <div class="minister-name">${ministry.minister_first_name} ${ministry.minister_last_name}</div>
            <div class="minister-details">Age ${ministry.minister_age || '?'} • <span class="minister-party" style="color:${pmColor};">${pmLogoHtml}${partyName}</span></div>
            <div class="minister-approval">Approval: <span class="${apprCls}">${Math.round(appr)}%</span></div>
            ${fireBtn}
        </div>`;
    }

    if (isPending) {
        const pm = ministry.pending_minister;
        const nomineeParty = allParties.find(p => p.id === pm.party_id);
        return `<div class="ministry-card" style="border-top-color:#FF9800;padding:10px 12px;">
            <div class="ministry-title">${MINISTRY_NAMES[key]}</div>
            <div class="minister-name" style="color:#FF9800;">${pm.first_name} ${pm.last_name}</div>
            <div class="minister-details">Age ${pm.age || '?'} • <span class="minister-party">${nomineeParty?.faction_name || 'Unknown'}</span></div>
            <div style="margin-top:8px;padding:4px 10px;background:#332200;border:1px solid #FF9800;border-radius:6px;font-size:0.68rem;color:#FF9800;text-align:center;">Awaiting Senate Confirmation</div>
        </div>`;
    }

    // Vacant or rejected — president can nominate
    let actionHtml = '';
    if (isPresidentParty) {
        const rejectedNote = rejectedParties.length > 0
            ? `<div style="font-size:0.7rem;color:#ff4444;margin-top:4px;">${rejectedParties.length} party nominee${rejectedParties.length > 1 ? 's' : ''} rejected</div>`
            : '';
        actionHtml = `<div class="ministry-actions">
            <button class="ministry-btn assign" onclick="openNominateModal('${key}')">Nominate</button>
            ${rejectedNote}
        </div>`;
    } else if (wasRejected) {
        actionHtml = `<div style="font-size:0.75rem;color:#ff4444;margin-top:6px;">Last nominee rejected</div>`;
    }

    return `<div class="ministry-card vacant" style="padding:10px 12px;">
        <div class="ministry-title">${MINISTRY_NAMES[key]}</div>
        <div class="minister-name" style="color:var(--text-muted);">Vacant</div>
        ${actionHtml}
    </div>`;
}

// ==================== PRESIDENTIAL NOMINATION (Modal) ====================

function openNominateModal(ministryKey) {
    assignMinistryKey = ministryKey;
    selectedCandidate = null;
    document.getElementById('assign-confirm-btn').disabled = true;
    document.getElementById('assign-confirm-btn').textContent = 'Nominate for Confirmation';
    document.getElementById('assign-modal-title').textContent = 'Nominate — ' + (MINISTRY_NAMES[ministryKey] || ministryKey);

    // Find which parties are blocked for this slot
    const ministry = ministryData.find(m => m.ministry_key === ministryKey);
    const rejectedParties = ministry?.rejected_parties || [];

    // Generate one candidate per eligible party
    generatedCandidates = allParties
        .filter(p => !rejectedParties.includes(p.id))
        .map(party => ({
            partyId: party.id,
            partyName: party.faction_name,
            firstName: FIRST_NAMES_POOL[Math.floor(Math.random() * FIRST_NAMES_POOL.length)],
            lastName: LAST_NAMES_POOL[Math.floor(Math.random() * LAST_NAMES_POOL.length)],
            age: 35 + Math.floor(Math.random() * 31)
        }));

    if (generatedCandidates.length === 0) {
        alert('No eligible parties remaining — all have been rejected for this slot.');
        return;
    }

    document.getElementById('assign-candidates').innerHTML = generatedCandidates.map((c, i) => {
        const isPres = c.partyId === presidentFactionId;
        const candColor = getPartyColorById(c.partyId);
        const candLogo = getPartyLogoById(c.partyId);
        const candLogoHtml = candLogo ? `<span style="display:inline-flex;vertical-align:middle;margin-right:4px;">${getPartyIconSVG(candLogo, 14, candColor)}</span>` : '';
        return `<div class="candidate-card" id="cand-${i}" onclick="selectCandidate(${i})" style="border-left:3px solid ${candColor};"><div><div class="candidate-name">${escapeHtml(c.firstName)} ${escapeHtml(c.lastName)}</div><div class="candidate-details">Age ${c.age} • <span class="candidate-party-tag ${isPres ? 'ruling' : 'other'}">${candLogoHtml}${escapeHtml(c.partyName)}</span></div></div>${isPres ? '<span class="ruling-label">PRESIDENT</span>' : ''}</div>`;
    }).join('');

    document.getElementById('assign-modal').classList.add('active');
}

async function confirmPresidentialNomination() {
    if (!selectedCandidate || !assignMinistryKey) return;
    try {
        await nominateMinister(_supabase, currentNation.id, currentFaction.id, assignMinistryKey, selectedCandidate);
        closeAssignModal();
        alert('Nomination submitted — parliament will vote on confirmation.');
        await renderGovernmentPage();
    } catch (e) {
        console.error('Nomination error:', e);
        alert('Error: ' + e.message);
    }
}

function handleConfirmMinister() {
    if (_coalitionAppointMode) {
        confirmAppointment();
    } else if (isPresidential) {
        confirmPresidentialNomination();
    } else {
        confirmAssign();
    }
}

        age: 35 + Math.floor(Math.random() * 31)
    }));

    document.getElementById('assign-candidates').innerHTML = generatedCandidates.map((c, i) => {
        const isRuling = c.partyId === rulingFactionId;
        const candColor = getPartyColorById(c.partyId);
        const candLogo = getPartyLogoById(c.partyId);
        const candLogoHtml = candLogo ? `<span style="display:inline-flex;vertical-align:middle;margin-right:4px;">${getPartyIconSVG(candLogo, 14, candColor)}</span>` : '';

function closeAssignModal() {
    _coalitionAppointMode = false;
    document.getElementById('assign-modal').classList.remove('active');
}

function openAppointModal(ministryKey) {
    _coalitionAppointMode = true;
    assignMinistryKey = ministryKey;

    document.getElementById('assign-confirm-btn').disabled = true;

    }));

        return `<div class="candidate-card" id="cand-${i}" onclick="selectCandidate(${i})" style="border-left:3px solid ${candColor};">` +
        `<div><div class="candidate-name">${escapeHtml(c.firstName)} ${escapeHtml(c.lastName)}</div>` +

function selectCandidate(index) {
    selectedCandidate = generatedCandidates[index];
    document.querySelectorAll('.candidate-card').forEach(el => el.classList.remove('selected'));
    document.getElementById('cand-' + index).classList.add('selected');
    document.getElementById('assign-confirm-btn').disabled = false;
}

async function confirmAssign() {
    if (!selectedCandidate || !assignMinistryKey) return;
    try {
        // Validate vacancy before executing (prevents double-click / race condition)
        const { data: freshMinistry } = await _supabase.from('ministries')
            .select('minister_first_name')
            .eq('nation_id', currentNation.id).eq('ministry_key', assignMinistryKey)
            .maybeSingle();
        if (freshMinistry && freshMinistry.minister_first_name) {
            alert('This ministry has already been filled.');
            closeAssignModal();
            await renderGovernmentPage();
            return;
        }

        const existing = ministryData.find(m => m.ministry_key === assignMinistryKey);

        if (existing) {
            const { error } = await _supabase.from('ministries').update({
                party_id: selectedCandidate.partyId,
                minister_first_name: selectedCandidate.firstName,
                minister_last_name: selectedCandidate.lastName,
                minister_age: selectedCandidate.age,
                minister_approval: 45,
                is_active: true
            }).eq('id', existing.id);
            if (error) throw error;
        } else {
            const { error } = await _supabase.from('ministries').insert({
                nation_id: currentNation.id,
                ministry_key: assignMinistryKey,
                ministry_name: MINISTRY_NAMES[assignMinistryKey] || assignMinistryKey,
                party_id: selectedCandidate.partyId,
                minister_first_name: selectedCandidate.firstName,
                minister_last_name: selectedCandidate.lastName,
                minister_age: selectedCandidate.age,
                minister_approval: 45,
                is_active: true
            });
            if (error) throw error;
        }

        // +3% approval to the receiving party
        const receivingParty = allParties.find(p => p.id === selectedCandidate.partyId);
        if (receivingParty) {
            const newApproval = Math.min(100, (receivingParty.approval_rating || 50) + 3);
            await _supabase.from('factions').update({ approval_rating: newApproval })
                .eq('id', selectedCandidate.partyId);
        }

        await _supabase.from('ministry_requests').delete()
            .eq('nation_id', currentNation.id).eq('ministry_key', assignMinistryKey);

        // Log minister appointment for Regime Log
        await _supabase.from('campaign_actions').insert({
            party_id: currentFaction.id,
            nation_id: currentNation.id,
            action_type: 'assign_minister',
            tick_performed: currentTick,
            result: {
                minister_name: `${selectedCandidate.firstName} ${selectedCandidate.lastName}`,
                ministry_key: assignMinistryKey,
                party_name: selectedCandidate.partyName
            }
        });

        // If assigning PM, also update head_of_government and roll over administration
        if (assignMinistryKey === 'prime_minister') {
            // Deactivate any current PM
            await _supabase.from('head_of_government')
                .update({ active: false })
                .eq('nation_id', currentNation.id)
                .eq('active', true);

            // Upsert new PM record (nation_id has unique constraint)
            await _supabase.from('head_of_government').upsert({
                nation_id: currentNation.id,
                faction_id: selectedCandidate.partyId,
                first_name: selectedCandidate.firstName,
                last_name: selectedCandidate.lastName,
                age: selectedCandidate.age,
                active: true
            }, { onConflict: 'nation_id' });

            const { data: freshNation } = await _supabase.from('nations').select('*').eq('id', currentNation.id).single();
            const coalition = await fetchActiveCoalition(_supabase, currentNation.id);
            if (freshNation && coalition) {
                try {
                    await rolloverAdministration(
                        _supabase,
                        currentNation.id,
                        freshNation,
                        'pm_replaced',
                        coalition,
                        allParties,
                        currentTick,
                        '',
                        null
                    );
                } catch (adminErr) {
                    throw new Error(`Administration lifecycle failed on PM assign: ${adminErr.message || adminErr}`);
                }
            }
        }


        closeAssignModal();
        alert('✦ ' + selectedCandidate.firstName + ' ' + selectedCandidate.lastName + ' appointed to ' + (MINISTRY_NAMES[assignMinistryKey] || assignMinistryKey) + '!');
        await renderGovernmentPage();
    } catch (e) {
        console.error('Assign error:', e);
        alert('Error: ' + e.message);
    }
}

// ==================== CLAIM POWER (Autocracy — No Ruler) ====================

async function claimPower() {
    if (!currentFaction || !currentNation) return;
    if (!isAutocracy) return;

    // Race condition guard: re-check that no one claimed power in the meantime
    const { data: freshNation } = await _supabase
        .from('nations')
        .select('ruling_faction_id')
        .eq('id', currentNation.id)
        .single();

    if (freshNation?.ruling_faction_id) {
        alert('Another faction has already claimed power. Refreshing...');
        await renderGovernmentPage();
        return;
    }

    if (!confirm(
        'SEIZE POWER?\n\n' +
        'As the first faction to act, you will claim uncontested control of the government.\n\n' +
        'You will become the Ruling Faction and receive:\n' +
        '- Control of the Head of State\n' +
        '- A Prime Minister from your faction\n' +
        '- All cabinet ministries staffed with your appointees\n' +
        '- Loyalty set to 80\n\n' +
        'Cost: 0 AP\n\nProceed?'
    )) return;

    const btn = document.getElementById('claim-power-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'SEIZING POWER...'; }

    try {
        const { data: shard } = await _supabase
            .from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const tick = shard?.current_tick || 0;

        // 1. Set this faction as the ruling faction
        await _supabase.from('nations')
            .update({ ruling_faction_id: currentFaction.id })
            .eq('id', currentNation.id);

        // 2. Set faction loyalty to 80
        await _supabase.from('factions')
            .update({ loyalty: 80 })
            .eq('id', currentFaction.id);

        // 3. Generate and insert ministry rows for all positions
        const ministryInserts = MINISTRY_KEYS_CABINET.map(key => ({
            nation_id: currentNation.id,
            ministry_key: key,
            ministry_name: MINISTRY_NAMES[key] || key,
            party_id: currentFaction.id,
            minister_first_name: FIRST_NAMES_POOL[Math.floor(Math.random() * FIRST_NAMES_POOL.length)],
            minister_last_name: LAST_NAMES_POOL[Math.floor(Math.random() * LAST_NAMES_POOL.length)],
            minister_age: 35 + Math.floor(Math.random() * 31),
            is_active: true
        }));

        const { error: ministryError } = await _supabase
            .from('ministries').insert(ministryInserts);
        if (ministryError) throw ministryError;

        // 4. Create head_of_government record for the PM
        const pmInsert = ministryInserts.find(m => m.ministry_key === 'prime_minister');
        if (pmInsert) {
            await _supabase.from('head_of_government')
                .update({ active: false })
                .eq('nation_id', currentNation.id)
                .eq('active', true);

            await _supabase.from('head_of_government').upsert({
                nation_id: currentNation.id,
                faction_id: currentFaction.id,
                first_name: pmInsert.minister_first_name,
                last_name: pmInsert.minister_last_name,
                age: pmInsert.minister_age,
                active: true
            }, { onConflict: 'nation_id' });
        }

        // 5. Log to campaign_actions
        await _supabase.from('campaign_actions').insert({
            party_id: currentFaction.id,
            nation_id: currentNation.id,
            action_type: 'claim_power',
            tick_performed: tick,
            result: {
                faction_name: currentFaction.faction_name,
                ministries_assigned: MINISTRY_KEYS_CABINET.length,
                pm_name: pmInsert ? `${pmInsert.minister_first_name} ${pmInsert.minister_last_name}` : null
            }
        });

        // 6. Create initial administration record (non-blocking)
        try {
            const hosName = (currentNation.head_of_state_first_name && currentNation.head_of_state_last_name)
                ? `${currentNation.head_of_state_first_name} ${currentNation.head_of_state_last_name}`
                : null;
            const adminName = pmInsert
                ? `${pmInsert.minister_last_name} Administration`
                : `${currentNation.head_of_state_last_name || currentFaction.faction_name} Administration`;

            await _supabase.from('administrations').insert({
                nation_id: currentNation.id,
                admin_name: adminName,
                head_of_state: hosName,
                prime_minister: pmInsert ? `${pmInsert.minister_first_name} ${pmInsert.minister_last_name}` : null,
                pm_party_name: currentFaction.faction_name,
                pm_party_id: currentFaction.id,
                coalition_parties: [{ party_id: currentFaction.id, party_name: currentFaction.faction_name, seats: currentFaction.seats || 0 }],
                total_seats: currentFaction.seats || 0,
                government_type: CANONICAL_GOVERNMENT_TYPES.AUTOCRACY,
                started_at_tick: tick,
                started_at_date: tickToDate(tick)
            });
        } catch (adminErr) {
            console.warn('Administration record creation failed (non-blocking):', adminErr);
        }

        // 7. Update local state
        currentFaction.loyalty = 80;
        currentNation.ruling_faction_id = currentFaction.id;
        rulingFactionId = currentFaction.id;
        isRulingFaction = true;

        // 8. Clear cache and re-render
        sessionStorage.removeItem('nationhood_state');
        qCacheBust('coalition_');

        alert(
            'POWER SEIZED!\n\n' +
            `${currentFaction.faction_name} now controls the government.\n\n` +
            `Prime Minister: ${pmInsert?.minister_first_name} ${pmInsert?.minister_last_name}\n` +
            `All ${MINISTRY_KEYS_CABINET.length} cabinet positions filled.`
        );

        await renderGovernmentPage();

    } catch (error) {
        console.error('Claim power error:', error);
        alert('Error claiming power: ' + error.message);
        if (btn) { btn.disabled = false; btn.textContent = 'Seize Power'; }
    }
}

// ==================== PURGE MINISTER ====================

async function purgeMinister(ministryKey) {
    const ministry = ministryData.find(m => m.ministry_key === ministryKey);
    if (!ministry) return;

    if ((currentFaction?.action_points || 0) < 1) { alert('Not enough AP (need 1).'); return; }

    const partyName = ministry.factions?.faction_name || 'Unknown';
    const ministerName = ministry.minister_first_name + ' ' + ministry.minister_last_name;

    if (!confirm(
        '⛔ PURGE ' + ministerName + ' from ' + (MINISTRY_NAMES[ministryKey] || ministryKey) + '?\n\n' +
        'Cost: 1 AP\n\n' +
        'Scapegoat Effects:\n' +
        '• ' + partyName + ' loses 2–4 Loyalty and 1–2 Approval\n' +
        '• Your faction gains +4–5 Approval (decays over time)\n' +
        '• Nation: +1 Corruption, Stability shifts ±1–2\n\n' +
        'Proceed?'
    )) return;

    const apResult = await deductAP(_supabase, currentFaction.id, 1);
    if (!apResult.success) { alert('Not enough AP (need 1).'); return; }
    currentFaction.action_points = apResult.newAp;
    sessionStorage.removeItem('nationhood_state');

    try {
        const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const tick = shard?.current_tick || 0;

        const { data: recentPurges } = await _supabase
            .from('campaign_actions')
            .select('tick_performed')
            .eq('party_id', currentFaction.id)
            .eq('action_type', 'purge_minister')
            .gte('tick_performed', tick - 6);
        const purgeCount = (recentPurges || []).length;

        const loyaltyLoss = 2 + Math.floor(Math.random() * 3);
        const approvalLossPurged = 1 + Math.floor(Math.random() * 2);
        const stabilityRoll = 1 + Math.floor(Math.random() * 2);
        let approvalBoost = 4 + Math.floor(Math.random() * 2);
        let corruptionGain = 1;

        if (purgeCount === 1) {
            approvalBoost = Math.floor(approvalBoost / 2);
        } else if (purgeCount >= 2) {
            approvalBoost = 0;
            corruptionGain = 2;
        }

        const decayTicks = approvalBoost > 0 ? approvalBoost + 1 : 0;

        const { error: clearErr } = await _supabase.from('ministries').update({
            minister_first_name: null, minister_last_name: null, minister_age: null, party_id: null
        }).eq('id', ministry.id);
        if (clearErr) throw clearErr;

        // If purging the PM, also deactivate the head_of_government record
        // and close the current administration
        if (ministryKey === 'prime_minister') {
            await _supabase.from('head_of_government')
                .update({ active: false })
                .eq('nation_id', currentNation.id)
                .eq('active', true);

            const { data: fullNation } = await _supabase.from('nations').select('*').eq('id', currentNation.id).single();
            if (fullNation) {
                try {
                    await closeAdministration(_supabase, currentNation.id, fullNation, 'pm_replaced', tick, '', null);
                } catch (adminErr) {
                    throw new Error(`Administration lifecycle failed on PM purge: ${adminErr.message || adminErr}`);
                }
            }
        }

        const rulerApproval = currentFaction.approval_rating ?? 50;
        const newRulerApproval = Math.min(100, rulerApproval + approvalBoost);
        await _supabase.from('factions').update({
            approval_rating: newRulerApproval
        }).eq('id', currentFaction.id);
        currentFaction.approval_rating = newRulerApproval;

        if (ministry.party_id && ministry.party_id !== rulingFactionId) {
            const target = allParties.find(p => p.id === ministry.party_id);
            const currentLoyalty = target?.loyalty ?? 50;
            const currentApproval = target?.approval_rating ?? 50;
            await _supabase.from('factions').update({
                loyalty: Math.max(0, currentLoyalty - loyaltyLoss),
                approval_rating: Math.max(0, currentApproval - approvalLossPurged)
            }).eq('id', ministry.party_id);
        }

        const { data: nation } = await _supabase.from('nations').select('stability, corruption').eq('id', currentNation.id).single();
        const stability = nation?.stability ?? 50;
        const corruption = nation?.corruption ?? 50;

        let stabilityChange;
        if (purgeCount >= 2) {
            stabilityChange = -stabilityRoll;
        } else if (stability >= 50) {
            stabilityChange = -stabilityRoll;
        } else {
            stabilityChange = stabilityRoll;
        }

        await _supabase.from('nations').update({
            stability: Math.max(0, Math.min(100, stability + stabilityChange)),
            corruption: Math.min(100, corruption + corruptionGain)
        }).eq('id', currentNation.id);

        await _supabase.from('campaign_actions').insert({
            party_id: currentFaction.id,
            nation_id: currentNation.id,
            action_type: 'purge_minister',
            tick_performed: tick,
            result: {
                minister_name: ministerName,
                ministry_key: ministryKey,
                target_party: partyName,
                target_party_id: ministry.party_id,
                loyalty_loss: loyaltyLoss,
                approval_loss_target: approvalLossPurged,
                approval_boost: approvalBoost,
                decay_ticks_remaining: decayTicks,
                decay_rate: 1,
                stability_change: stabilityChange,
                corruption_gain: corruptionGain,
                purge_number: purgeCount + 1
            }
        });

        let resultMsg = '⛔ ' + ministerName + ' purged!\n\n';
        resultMsg += partyName + ': -' + loyaltyLoss + ' Loyalty, -' + approvalLossPurged + ' Approval\n';
        if (approvalBoost > 0) {
            resultMsg += 'Your Approval: +' + approvalBoost + ' (will decay over ' + decayTicks + ' ticks)\n';
        } else {
            resultMsg += 'Your Approval: No boost (too many recent purges)\n';
        }
        resultMsg += 'Nation: ' + (stabilityChange >= 0 ? '+' : '') + stabilityChange + ' Stability, +' + corruptionGain + ' Corruption';
        if (purgeCount === 1) resultMsg += '\n\n⚠️ Diminishing returns: 2nd purge in 6 ticks — boost halved.';
        if (purgeCount >= 2) resultMsg += '\n\n🚨 Regime fatigue: 3rd+ purge in 6 ticks — no boost, double corruption.';

        alert(resultMsg);

        await renderGovernmentPage();
    } catch (e) {
        console.error('Purge error:', e);
        alert('Error: ' + e.message);
    }
}
