async function openEOModal() {
    if (!currentFaction || !currentNation) return;
    const modal = document.getElementById('eo-modal');
    const listEl = document.getElementById('eo-order-list');
    const confirmPanel = document.getElementById('eo-confirm-panel');
    const confirmBtn = document.getElementById('eo-confirm-btn');

    eoSelectedType = null;
    eoSelectedParams = {};
    confirmPanel.className = 'eo-confirm-panel';
    confirmPanel.innerHTML = '';
    confirmBtn.style.display = 'none';
    confirmBtn.disabled = true;

    listEl.innerHTML = '<div style="color:var(--text-secondary);font-size:0.85rem;">Loading...</div>';
    modal.classList.add('active');

    try {
        eoOrderData = await fetchActiveOrders(_supabase, currentNation.id);
        eoAvailability = await checkOrderAvailability(_supabase, currentNation.id, currentFaction.id, currentFaction.action_points || 0);
    } catch (e) {
        listEl.innerHTML = `<div style="color:var(--red);font-size:0.85rem;">Error: ${e.message}</div>`;
        return;
    }

    const orders = [
        {
            type: 'acting_minister', name: 'Acting Minister',
            desc: `Appoint an acting minister, bypassing confirmation. Max ${EO_CONFIG.ACTING_MINISTER_MAX}.`,
            info: eoAvailability.acting_minister
        },
        {
            type: 'tax_adjustment', name: 'Tax Adjustment',
            desc: 'Adjust income, corporate, or sales tax by \u00B13%.',
            info: eoAvailability.tax_adjustment
        },
        {
            type: 'price_controls', name: 'Price Controls',
            desc: `Freeze fuel prices or food security for ${EO_CONFIG.PRICE_CONTROLS_DURATION} ticks.`,
            info: eoAvailability.price_controls
        },
        {
            type: 'national_emergency', name: 'National Emergency',
            desc: 'Declare emergency powers. +1 AP/tick, advance bills. Lasts until ended.',
            info: eoAvailability.national_emergency
        },
        {
            type: 'censure', name: 'Censure',
            desc: 'Censure a rival faction. -4 momentum to target (but they gain sympathy).',
            info: eoAvailability.censure
        },
        {
            type: 'stimulate_economy', name: 'Stimulate the Economy',
            desc: 'Issue ideology-flavored economic stimulus orders. Once per order per term.',
            info: eoAvailability.stimulate_economy
        }
    ];

    let html = '<div class="modal-subtitle">Select an executive order to issue.</div>';
    for (const o of orders) {
        const avail = o.info.available;
        const statusLabel = avail ? 'AVAILABLE' : (o.info.reason || 'LOCKED');
        const statusClass = avail ? 'available' : (o.info.reason?.includes('ooldown') ? 'cooldown' : 'locked');
        html += `
            <div class="eo-card ${avail ? '' : 'unavailable'}" onclick="${avail ? `selectEOType('${o.type}')` : ''}">
                <div class="eo-card-left">
                    <div class="eo-card-name">${escapeHtml(o.name)}</div>
                    <div class="eo-card-desc">${escapeHtml(o.desc)}</div>
                </div>
                <div class="eo-card-right">
                    <div class="eo-card-cost">${o.info.apCost} AP</div>
                    <div class="eo-card-status ${statusClass}">${escapeHtml(statusLabel)}</div>
                </div>
            </div>`;
    }
    listEl.innerHTML = html;
}

function selectEOType(type) {
    eoSelectedType = type;
    eoSelectedParams = {};
    const listEl = document.getElementById('eo-order-list');
    const confirmPanel = document.getElementById('eo-confirm-panel');
    const confirmBtn = document.getElementById('eo-confirm-btn');

    listEl.style.display = 'none';
    confirmPanel.className = 'eo-confirm-panel active';
    confirmBtn.style.display = 'inline-block';
    confirmBtn.disabled = true;

    if (type === 'acting_minister') {
        renderActingMinisterConfirm(confirmPanel);
    } else if (type === 'tax_adjustment') {
        renderTaxAdjustmentConfirm(confirmPanel);
    } else if (type === 'price_controls') {
        renderPriceControlsConfirm(confirmPanel);
    } else if (type === 'national_emergency') {
        renderEmergencyConfirm(confirmPanel);
    } else if (type === 'censure') {
        renderCensureConfirm(confirmPanel);
    } else if (type === 'stimulate_economy') {
        renderStimulusPanel(confirmPanel);
    }
}

function renderActingMinisterConfirm(panel) {
    // Find vacant ministries
    const vacantMinistries = (ministryData || []).filter(m =>
        !m.minister_first_name || m.confirmation_status === 'pending' || m.confirmation_status === 'rejected'
    ).filter(m => m.ministry_key !== 'prime_minister');

    if (vacantMinistries.length === 0) {
        panel.innerHTML = `
            <div class="eo-confirm-title">Acting Minister</div>
            <div class="eo-confirm-desc">No vacant ministries available for acting appointment.</div>`;
        return;
    }

    const MINISTRY_LABELS = {
        interior: 'Interior', foreign: 'Foreign Affairs', defense: 'Defense',
        finance: 'Finance', education: 'Education', health: 'Health'
    };

    let options = '';
    for (const m of vacantMinistries) {
        const label = MINISTRY_LABELS[m.ministry_key] || m.ministry_key;
        options += `<option value="${m.ministry_key}">${escapeHtml(label)}</option>`;
    }

    panel.innerHTML = `
        <div class="eo-confirm-title">Appoint Acting Minister</div>
        <div class="eo-confirm-desc">
            Select a ministry to fill with an acting appointment. This bypasses legislative confirmation
            but costs ${EO_CONFIG.ACTING_MINISTER_AP} AP and -4 government approval.
        </div>
        <select class="eo-select" id="eo-acting-ministry" onchange="eoParamChanged()">
            <option value="">-- Select Ministry --</option>
            ${options}
        </select>
        <div class="eo-preview" id="eo-acting-preview" style="display:none;"></div>`;
}

function renderTaxAdjustmentConfirm(panel) {
    const taxes = [
        { key: 'income_tax', label: 'Income Tax' },
        { key: 'corporate_tax', label: 'Corporate Tax' },
        { key: 'sales_tax', label: 'Sales Tax' }
    ];
    const cooldowns = eoAvailability?.taxCooldowns || {};

    let taxBtns = '';
    for (const t of taxes) {
        const onCD = cooldowns[t.key];
        taxBtns += `<button class="eo-option-btn" data-tax="${t.key}" onclick="eoSelectTax('${t.key}')" ${onCD ? 'disabled title="On cooldown"' : ''}>${escapeHtml(t.label)}${onCD ? ' (CD)' : ''}</button>`;
    }

    panel.innerHTML = `
        <div class="eo-confirm-title">Tax Adjustment</div>
        <div class="eo-confirm-desc">
            Adjust a tax rate by \u00B1${EO_CONFIG.TAX_ADJUSTMENT_DELTA}%. Costs ${EO_CONFIG.TAX_ADJUSTMENT_BASE_AP}+ AP.
            Tax increases cost -3 approval; decreases cost -5 approval.
        </div>
        <div class="eo-option-group" id="eo-tax-types">${taxBtns}</div>
        <div class="eo-option-group" id="eo-tax-direction" style="display:none;">
            <button class="eo-option-btn" onclick="eoSelectDirection('increase')">Increase +${EO_CONFIG.TAX_ADJUSTMENT_DELTA}%</button>
            <button class="eo-option-btn" onclick="eoSelectDirection('decrease')">Decrease -${EO_CONFIG.TAX_ADJUSTMENT_DELTA}%</button>
        </div>
        <div class="eo-preview" id="eo-tax-preview" style="display:none;"></div>`;
}

function renderPriceControlsConfirm(panel) {
    const stats = [
        { key: 'fuel_prices', label: 'Fuel Prices' },
        { key: 'food_security', label: 'Food Security' }
    ];
    const cooldowns = eoAvailability?.pcCooldowns || {};

    let statBtns = '';
    for (const s of stats) {
        const onCD = cooldowns[s.key];
        statBtns += `<button class="eo-option-btn" data-stat="${s.key}" onclick="eoSelectPCStat('${s.key}')" ${onCD ? 'disabled title="On cooldown"' : ''}>${escapeHtml(s.label)}${onCD ? ' (CD)' : ''}</button>`;
    }

    panel.innerHTML = `
        <div class="eo-confirm-title">Price Controls</div>
        <div class="eo-confirm-desc">
            Freeze a stat at its current value for ${EO_CONFIG.PRICE_CONTROLS_DURATION} ticks.
            When controls expire, suppressed pressure releases at 2x magnitude.
            Costs ${EO_CONFIG.PRICE_CONTROLS_AP} AP and -3 approval.
        </div>
        <div class="eo-option-group">${statBtns}</div>
        <div class="eo-preview" id="eo-pc-preview" style="display:none;"></div>`;
}

function renderEmergencyConfirm(panel) {

        <div class="eo-confirm-title">Declare National Emergency</div>
        <div class="eo-warning">
            <strong>Warning:</strong> Emergency powers are significant.
            <br>• +1 AP per tick to presidential faction
            <br>• Can advance bills without votes
            <br>• +8 initial approval boost (crisis rally)
            <br>• -4 approval per tick after first tick

function renderCensureConfirm(panel) {
    const otherFactions = (allParties || []).filter(p => p.id !== currentFaction?.id && p.seats > 0);
    if (otherFactions.length === 0) {
        panel.innerHTML = `
            <div class="eo-confirm-title">Censure</div>
            <div class="eo-confirm-desc">No other factions to censure.</div>`;
        return;
    }

    let options = '';
    for (const f of otherFactions) {
        options += `<option value="${f.id}">${escapeHtml(f.faction_name)} (${f.seats} seats)</option>`;
    }

    panel.innerHTML = `
        <div class="eo-confirm-title">Censure a Rival Faction</div>
        <div class="eo-confirm-desc">
            Censure costs ${EO_CONFIG.CENSURE_AP} AP and -3 approval.
            Target loses -4 momentum but gains sympathy (+${EO_CONFIG.CENSURE_BASE_MOMENTUM} momentum).
            Repeat censures within ${EO_CONFIG.CENSURE_REPEAT_WINDOW} ticks give +${EO_CONFIG.CENSURE_REPEAT_MOMENTUM} sympathy.

// ─── Stimulate the Economy Sub-Panel ───

const STIMULUS_IDEOLOGY_AXES = [
    { label: 'Individualism vs Collectivism', ideologies: ['INDIVIDUALISM', 'COLLECTIVISM'] },
    { label: 'Nationalism vs Globalism', ideologies: ['NATIONALISM', 'GLOBALISM'] },
    { label: 'Equality vs Liberty', ideologies: ['EQUALITY', 'LIBERTY'] },
    { label: 'Progress vs Tradition', ideologies: ['PROGRESS', 'TRADITION'] },
    { label: 'Security vs Freedom', ideologies: ['SECURITY', 'FREEDOM'] },
];

function renderStimulusPanel(panel) {
    const stimData = eoAvailability?.stimulate_economy;
    if (!stimData) {
        panel.innerHTML = '<div class="eo-confirm-desc">Stimulus data unavailable.</div>';
        return;
    }

    const allOrders = stimData.orders || {};
    const confirmBtn = document.getElementById('eo-confirm-btn');
    confirmBtn.style.display = 'none';

    let html = `
        <div class="eo-confirm-title">Stimulate the Economy</div>
        <div class="eo-confirm-desc">
            Issue ideology-flavored economic stimulus orders. Each costs ${EO_CONFIG.STIMULATE_ECONOMY_AP} AP.
            Once used, an order cannot be reissued during the same presidential term.
        </div>
        <div class="eo-stimulus-back" onclick="backToEOList()">&#8592; Back to Executive Orders</div>
        <div class="eo-stimulus-grid">`;

    for (const axis of STIMULUS_IDEOLOGY_AXES) {
        const axisOrders = Object.values(allOrders).filter(o => axis.ideologies.includes(o.ideology));
        if (axisOrders.length === 0) continue;

        html += `<div class="eo-stimulus-axis">
            <div class="eo-stimulus-axis-label">${escapeHtml(axis.label)}</div>
            <div class="eo-stimulus-axis-orders">`;

        for (const o of axisOrders) {
            const avail = o.available;
            const used = o.used;
            const statusLabel = used ? 'USED' : (avail ? 'AVAILABLE' : (o.reason || 'LOCKED'));
            const statusClass = used ? 'cooldown' : (avail ? 'available' : 'locked');

            const increases = o.stat_increases ? Object.entries(o.stat_increases).map(([k, v]) => `+${v} ${formatStatName(k)}`).join(', ') : '';
            const decreases = o.stat_decreases ? Object.entries(o.stat_decreases).map(([k, v]) => `−${v} ${formatStatName(k)}`).join(', ') : '';

            html += `
                <div class="eo-stimulus-card ${avail ? '' : 'unavailable'}" onclick="${avail ? `selectStimulusOrder('${o.key}')` : ''}">
                    <div class="eo-stimulus-card-header">
                        <span class="eo-stimulus-ideology">${escapeHtml(o.ideology)}</span>
                        <span class="eo-card-status ${statusClass}">${escapeHtml(statusLabel)}</span>
                    </div>
                    <div class="eo-card-name">${escapeHtml(o.name)}</div>
                    <div class="eo-card-desc">${escapeHtml(o.description)}</div>
                    <div class="eo-stimulus-effects">
                        ${increases ? `<div class="eo-stimulus-up">&#9650; ${escapeHtml(increases)}</div>` : ''}
                        ${decreases ? `<div class="eo-stimulus-down">&#9660; ${escapeHtml(decreases)}</div>` : ''}
                    </div>
                </div>`;
        }

        html += `</div></div>`;
    }

    html += '</div>';
    panel.innerHTML = html;
}

function backToEOList() {
    const listEl = document.getElementById('eo-order-list');
    const confirmPanel = document.getElementById('eo-confirm-panel');
    const confirmBtn = document.getElementById('eo-confirm-btn');
    listEl.style.display = 'block';
    confirmPanel.className = 'eo-confirm-panel';
    confirmPanel.innerHTML = '';
    confirmBtn.style.display = 'none';
    confirmBtn.disabled = true;
    eoSelectedType = null;
    eoSelectedParams = {};
}
window.backToEOList = backToEOList;

function selectStimulusOrder(stimulusKey) {
    const orderDef = STIMULATE_ECONOMY_ORDERS[stimulusKey];
    if (!orderDef) return;

    eoSelectedType = 'stimulate_economy';
    eoSelectedParams = { stimulusKey };

    const confirmPanel = document.getElementById('eo-confirm-panel');
    const confirmBtn = document.getElementById('eo-confirm-btn');

    const increases = orderDef.stat_increases ? Object.entries(orderDef.stat_increases).map(([k, v]) => `<span class="eo-stimulus-up">+${v} ${formatStatName(k)}</span>`).join(', ') : '';
    const decreases = orderDef.stat_decreases ? Object.entries(orderDef.stat_decreases).map(([k, v]) => `<span class="eo-stimulus-down">−${v} ${formatStatName(k)}</span>`).join(', ') : '';

    confirmPanel.innerHTML = `
        <div class="eo-stimulus-back" onclick="renderStimulusPanel(document.getElementById('eo-confirm-panel'))">&#8592; Back to Stimulus Orders</div>
        <div class="eo-confirm-title">${escapeHtml(orderDef.name)}</div>
        <div class="eo-confirm-desc">${escapeHtml(orderDef.description)}</div>
        <div class="eo-preview">
            <div style="margin-bottom:6px;"><strong>Effects:</strong></div>
            ${increases ? `<div style="margin-bottom:4px;">Increases: ${increases}</div>` : ''}
            ${decreases ? `<div>Decreases: ${decreases}</div>` : ''}
        </div>
        <div class="eo-confirm-desc" style="font-size:0.8rem;">
            Cost: ${EO_CONFIG.STIMULATE_ECONOMY_AP} AP. This order cannot be reissued this term.
        </div>`;
    confirmBtn.style.display = 'inline-block';
    confirmBtn.disabled = false;
}
window.selectStimulusOrder = selectStimulusOrder;
window.renderStimulusPanel = renderStimulusPanel;

// Parameter selection handlers
function eoParamChanged() {
    const confirmBtn = document.getElementById('eo-confirm-btn');
    if (eoSelectedType === 'acting_minister') {
        const sel = document.getElementById('eo-acting-ministry');
        eoSelectedParams.ministryKey = sel?.value || '';
        confirmBtn.disabled = !eoSelectedParams.ministryKey;
        if (eoSelectedParams.ministryKey) {
            document.getElementById('eo-acting-preview').style.display = 'block';
            document.getElementById('eo-acting-preview').textContent = `Appoint acting minister to ${eoSelectedParams.ministryKey.replace('_', ' ')}`;
        }
    } else if (eoSelectedType === 'censure') {
        const sel = document.getElementById('eo-censure-target');
        eoSelectedParams.targetFactionId = sel?.value || '';
        confirmBtn.disabled = !eoSelectedParams.targetFactionId;
    }
}
window.eoParamChanged = eoParamChanged;

function eoSelectTax(taxKey) {
    eoSelectedParams.taxType = taxKey;
    document.querySelectorAll('#eo-tax-types .eo-option-btn').forEach(b => b.classList.remove('selected'));
    document.querySelector(`#eo-tax-types [data-tax="${taxKey}"]`)?.classList.add('selected');
    document.getElementById('eo-tax-direction').style.display = 'flex';
    eoSelectedParams.direction = null;
    document.getElementById('eo-confirm-btn').disabled = true;
    document.getElementById('eo-tax-preview').style.display = 'none';
}
window.eoSelectTax = eoSelectTax;

function eoSelectDirection(dir) {
    eoSelectedParams.direction = dir;
    document.querySelectorAll('#eo-tax-direction .eo-option-btn').forEach(b => {
        b.classList.toggle('selected', b.textContent.toLowerCase().includes(dir));
    });
    const rate = currentNation?.[eoSelectedParams.taxType] ?? 20;
    const delta = dir === 'increase' ? EO_CONFIG.TAX_ADJUSTMENT_DELTA : -EO_CONFIG.TAX_ADJUSTMENT_DELTA;
    const newRate = Math.max(0, Math.min(50, rate + delta));
    const preview = document.getElementById('eo-tax-preview');
    preview.style.display = 'block';
    preview.textContent = `${eoSelectedParams.taxType.replace(/_/g, ' ')}: ${rate}% \u2192 ${newRate}%`;
    document.getElementById('eo-confirm-btn').disabled = false;
}
window.eoSelectDirection = eoSelectDirection;

function eoSelectPCStat(stat) {
    eoSelectedParams.stat = stat;
    document.querySelectorAll('#eo-confirm-panel .eo-option-btn[data-stat]').forEach(b => {
        b.classList.toggle('selected', b.getAttribute('data-stat') === stat);
    });
    const val = currentNation?.[stat] ?? 50;
    const preview = document.getElementById('eo-pc-preview');
    preview.style.display = 'block';
    preview.textContent = `Freeze ${stat.replace(/_/g, ' ')} at ${Number(val).toFixed(1)} for ${EO_CONFIG.PRICE_CONTROLS_DURATION} ticks`;
    document.getElementById('eo-confirm-btn').disabled = false;
}
window.eoSelectPCStat = eoSelectPCStat;

async function confirmExecutiveOrder() {
    const confirmBtn = document.getElementById('eo-confirm-btn');
    confirmBtn.disabled = true;
    confirmBtn.textContent = 'Issuing...';

    let result;
    try {
        if (eoSelectedType === 'acting_minister') {
            result = await issueActingMinister(_supabase, currentNation.id, currentFaction.id, eoSelectedParams.ministryKey, currentNation.name);
        } else if (eoSelectedType === 'tax_adjustment') {
            result = await issueTaxAdjustment(_supabase, currentNation.id, currentFaction.id, eoSelectedParams.taxType, eoSelectedParams.direction);
        } else if (eoSelectedType === 'price_controls') {
            result = await issuePriceControls(_supabase, currentNation.id, currentFaction.id, eoSelectedParams.stat);
        } else if (eoSelectedType === 'national_emergency') {
            result = await issueNationalEmergency(_supabase, currentNation.id, currentFaction.id);
        } else if (eoSelectedType === 'censure') {
            result = await issueCensure(_supabase, currentNation.id, currentFaction.id, eoSelectedParams.targetFactionId);
        } else if (eoSelectedType === 'stimulate_economy') {
            result = await issueStimulusOrder(_supabase, currentNation.id, currentFaction.id, eoSelectedParams.stimulusKey);
        }
    } catch (e) {
        alert('Error: ' + e.message);
        confirmBtn.disabled = false;
        confirmBtn.textContent = 'Issue Order';
        return;
    }

    if (!result?.success) {
        alert(result?.error || 'Failed to issue executive order.');
        confirmBtn.disabled = false;
        confirmBtn.textContent = 'Issue Order';
        return;
    }

    closeEOModal();
    window.location.reload();
}
window.confirmExecutiveOrder = confirmExecutiveOrder;

function closeEOModal() {
    document.getElementById('eo-modal').classList.remove('active');
    document.getElementById('eo-order-list').style.display = 'block';
    const confirmPanel = document.getElementById('eo-confirm-panel');
    confirmPanel.className = 'eo-confirm-panel';
    confirmPanel.innerHTML = '';
    const confirmBtn = document.getElementById('eo-confirm-btn');
    confirmBtn.style.display = 'none';
    confirmBtn.disabled = true;
    confirmBtn.textContent = 'Issue Order';
    eoSelectedType = null;
    eoSelectedParams = {};
}
window.closeEOModal = closeEOModal;
window.openEOModal = openEOModal;
window.selectEOType = selectEOType;

async function handleEndEmergency() {
    if (!confirm('End the national emergency? This will cause +8 civil unrest and start an 8-tick cooldown.')) return;
    try {
        const result = await endNationalEmergency(_supabase, currentNation.id, currentFaction.id);
        if (!result.success) {
            alert(result.error || 'Failed to end emergency.');
            return;
        }
        window.location.reload();
    } catch (e) {
        alert('Error: ' + e.message);
    }
}
window.handleEndEmergency = handleEndEmergency;

async function fileImpeachment() {
    if (_govActionLock || !currentFaction || !currentNation || !presidentData) return;

    // Must have at least 1 seat
    const mySeatsCheck = allPartySeats[currentFaction.id] || currentFaction.seats || 0;
    if (mySeatsCheck < 1) {
        alert('Need at least 1 seat in the legislature to file impeachment.');
        return;
    }

    // Cannot impeach if you are the president's party
    if (isPresidentParty) {
        alert('The president\'s own party cannot file impeachment.');
        return;
    }

    // Check: no existing active impeachment proceeding
    const { data: existingProceeding } = await _supabase
        .from('impeachment_proceedings')
        .select('id')
        .eq('nation_id', currentNation.id)
        .neq('phase', 'resolved')
        .limit(1)
        .maybeSingle();

    if (existingProceeding) {
        alert('An impeachment proceeding is already active.');
        return;
    }

    // Check: nation-level cooldown
    if (currentNation.impeachment_cooldown_until_tick && currentTick < currentNation.impeachment_cooldown_until_tick) {
        const remaining = currentNation.impeachment_cooldown_until_tick - currentTick;
        alert(`Impeachment cooldown: ${remaining} tick${remaining !== 1 ? 's' : ''} remaining.`);
        return;
    }

    // Build charge options with precondition checks
    const charges = [];

    // 1. Abuse of Power — always available
    charges.push({ type: 'abuse_of_power', label: 'Abuse of Power', available: true, reason: '' });

    // 2. Corruption — requires corruption stat >= threshold
    const corruptionStat = currentNation.corruption ?? 0;
    const corruptionAvail = corruptionStat >= GAME_CONFIG.IMPEACHMENT_CORRUPTION_THRESHOLD;
    charges.push({
        type: 'corruption',
        label: 'Corruption',
        available: corruptionAvail,
        reason: corruptionAvail ? '' : `Requires corruption ≥ ${GAME_CONFIG.IMPEACHMENT_CORRUPTION_THRESHOLD} (currently ${corruptionStat})`
    });

    // 3. Incompetence — requires gov_approval <= threshold for consecutive ticks
    // Simplified: check current approval as proxy
    const govApproval = currentNation.gov_approval ?? 40;
    const incompAvail = govApproval <= GAME_CONFIG.IMPEACHMENT_INCOMPETENCE_THRESHOLD;
    charges.push({
        type: 'incompetence',
        label: 'Gross Incompetence',
        available: incompAvail,
        reason: incompAvail ? '' : `Requires gov approval ≤ ${GAME_CONFIG.IMPEACHMENT_INCOMPETENCE_THRESHOLD} (currently ${Math.round(govApproval)})`
    });

    // 4. Constitutional Violation — always available
    charges.push({ type: 'constitutional_violation', label: 'Constitutional Violation', available: true, reason: '' });

    // 5. Criminal Conduct — always available
    charges.push({ type: 'criminal_conduct', label: 'Criminal Conduct', available: true, reason: '' });

    // Build charge selection HTML
    const chargeCheckboxes = charges.map((c, i) => {
        const disabled = !c.available ? 'disabled' : '';
        const opacity = !c.available ? 'opacity:0.4;' : '';
        const tooltip = c.reason ? ` title="${c.reason}"` : '';
        return `<label style="display:block;margin:8px 0;${opacity}"${tooltip}>
            <input type="checkbox" name="impeach-charge" value="${c.type}" ${disabled} style="margin-right:8px;">
            <strong>${c.label}</strong>${c.reason ? ` <span style="font-size:0.7rem;color:var(--text-secondary);">(${c.reason})</span>` : ''}
        </label>`;
    }).join('');

    // Show charge selection modal via a custom confirm-like approach
    // Create a modal overlay
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:10000;display:flex;align-items:center;justify-content:center;';
    overlay.innerHTML = `
        <div style="background:var(--bg-panel);border:1px solid var(--border-0);border-radius:3px;padding:24px;max-width:440px;width:90%;max-height:80vh;overflow-y:auto;">
            <div style="font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--red);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.1em;">⚖ IMPEACH PRESIDENT</div>
            <div style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:16px;">
                President ${escapeHtml(presidentData.first_name)} ${escapeHtml(presidentData.last_name)}
            </div>
            <div style="font-size:0.8rem;color:var(--text-primary);margin-bottom:12px;">Select at least one charge:</div>
            <div id="impeach-charges-list">${chargeCheckboxes}</div>
            <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border-hair);font-size:0.75rem;color:var(--text-secondary);line-height:1.5;">
                <div>Cost: <strong style="color:var(--amber);">${GAME_CONFIG.IMPEACHMENT_AP_COST} AP</strong></div>
                <div>Committee debate: ${GAME_CONFIG.IMPEACHMENT_COMMITTEE_TICKS} ticks → Floor vote: ${GAME_CONFIG.IMPEACHMENT_MOTION_VOTING_TICKS} ticks</div>
                <div>Requires <strong style="color:var(--green);">simple majority</strong> (50%+1 of all seats) to impeach</div>
                <div style="margin-top:6px;">If impeached → Trial: ${GAME_CONFIG.IMPEACHMENT_TRIAL_TICKS}-tick conviction vote (⅔ supermajority)</div>
            </div>
            <div style="display:flex;gap:12px;margin-top:20px;">
                <button id="impeach-cancel-btn" style="flex:1;padding:10px;background:var(--bg-card);color:var(--text-secondary);border:1px solid var(--border-0);border-radius:3px;cursor:pointer;font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;">Cancel</button>
                <button id="impeach-confirm-btn" style="flex:1;padding:10px;background:var(--red);color:#fff;border:none;border-radius:3px;cursor:pointer;font-family:var(--font-mono);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;">File Impeachment</button>
            </div>
        </div>`;
    document.body.appendChild(overlay);

    // Wait for user decision
    const result = await new Promise(resolve => {
        overlay.querySelector('#impeach-cancel-btn').addEventListener('click', () => resolve(null));
        overlay.addEventListener('click', (e) => { if (e.target === overlay) resolve(null); });
        overlay.querySelector('#impeach-confirm-btn').addEventListener('click', () => {
            const checked = [...overlay.querySelectorAll('input[name="impeach-charge"]:checked')].map(cb => cb.value);
            if (checked.length === 0) { alert('Select at least one charge.'); return; }
            resolve(checked);
        });
    });

    overlay.remove();
    if (!result) return;
    _govActionLock = true;

    // Build charges array
    const selectedCharges = result.map(type => {
        const c = charges.find(ch => ch.type === type);
        return { type, label: c.label };
    });

    const presName = `${presidentData.first_name} ${presidentData.last_name}`;
    const motionName = `Articles of Impeachment Against President ${presName}`;

    try {
        const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const tick = shard?.current_tick || 0;

        // Create the impeachment proceeding record
        const { data: proceeding, error: procError } = await _supabase.from('impeachment_proceedings').insert({
            nation_id: currentNation.id,
            president_id: presidentData.id,
            initiated_by_faction_id: currentFaction.id,
            charges: selectedCharges,
            phase: 'motion_committee',
            created_at_tick: tick
        }).select().single();

        if (procError) throw procError;

        // Create the impeachment motion bill — goes to committee first
        const chargesList = selectedCharges.map(c => c.label).join(', ');
        const { data: bill, error: billError } = await _supabase.from('bills').insert({
            nation_id: currentNation.id,
            proposed_by: currentFaction.id,
            proposed_tick: tick,
            bill_name: motionName,
            bill_type: 'impeachment_motion',
            status: 'committee',
            impeachment_id: proceeding.id,
            proposer_name: currentFaction.faction_name,
            proposer_color: currentFaction.party_color,
            preamble: `This motion, filed by the ${currentFaction.faction_name}, calls for the impeachment of President ${presName} on the following charges: ${chargesList}. After ${GAME_CONFIG.IMPEACHMENT_COMMITTEE_TICKS} ticks of committee debate, the motion will proceed to a floor vote requiring an absolute majority (${GAME_CONFIG.MAJORITY_SEATS} of ${GAME_CONFIG.TOTAL_SEATS} seats) to pass.`
        }).select().single();

        if (billError) throw billError;

        // Link the bill back to the proceeding
        await _supabase.from('impeachment_proceedings')
            .update({ motion_bill_id: bill.id })
            .eq('id', proceeding.id);

        // Race-condition guard: check for concurrent impeachment proceedings
        const { count: procCount } = await _supabase.from('impeachment_proceedings')
            .select('id', { count: 'exact', head: true })
            .eq('nation_id', currentNation.id)
            .neq('phase', 'resolved');
        if (procCount > 1) {
            // Another proceeding was created concurrently — delete ours
            await _supabase.from('bills').delete().eq('id', bill.id);
            await _supabase.from('impeachment_proceedings').delete().eq('id', proceeding.id);
            alert('Another impeachment proceeding was just filed. Please refresh.');
            return;
        }

        // Deduct AP after bill creation succeeds
        const apResult = await deductAP(_supabase, currentFaction.id, GAME_CONFIG.IMPEACHMENT_AP_COST);
        if (!apResult.success) {
            if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
            alert('Not enough AP. Need ' + GAME_CONFIG.IMPEACHMENT_AP_COST + ' AP, have ' + (apResult.currentAp ?? '?') + '.');
            return;
        }
        currentFaction.action_points = apResult.newAp;

        // Auto-cast the filer's own vote as YES
        const seatData = await loadSeats(_supabase, currentNation.id, false, allParties, currentFaction.id);
        const mySeats = seatData.allPartySeats[currentFaction.id] || 0;
        await _supabase.from('bill_support').upsert({
            bill_id: bill.id,
            faction_id: currentFaction.id,
            stance: 'yes',
            seat_count: mySeats
        }, { onConflict: 'bill_id,faction_id' });

        // Fire event for news
        await _supabase.from('event_log').insert({
            nation_id: currentNation.id,
            event_type: 'impeachment',
            headline: `Impeachment Motion Filed Against President ${presName}`,
            body: `The ${currentFaction.faction_name} has filed articles of impeachment against President ${presName}. Charges: ${chargesList}. A ${GAME_CONFIG.IMPEACHMENT_COMMITTEE_TICKS}-tick committee debate will precede the floor vote.`,
            metadata: { status: 'filed', president_name: presName, charges: chargesList, filer: currentFaction.faction_name },
            tick: tick
        });

        alert(`⚖ "${motionName}" has been filed!\n\n${GAME_CONFIG.IMPEACHMENT_COMMITTEE_TICKS}-tick committee debate begins now. The motion will then proceed to a floor vote.`);
        window.location.href = `bill.html?id=${bill.id}`;
    } catch (e) {
        console.error('Impeachment error:', e);
        alert('Error: ' + e.message);
    } finally { _govActionLock = false; }
}

        (coalitionPartyNames.length > 0 ? `• Cost coalition partners (${coalitionPartyNames.join(', ')}) ${GAME_CONFIG.EARLY_ELECTION_COALITION_APPROVAL_COST} Approval each\n` : '') +

        `The government will remain as caretaker until then.\n` +
        `After the election: coalition dissolves, PM removed, ministries vacated.\n\n` +

            _supabase,

            currentFaction.id,
            coalitionData.party_ids
        );



        // Bust coalition cache so re-render picks up caretaker status

// ==================== PARLIAMENT VISUALIZATION ====================

function drawParliament(parties, options = {}) {
    const { showLegend = true, showMajorityLine = true, majoritySeats = GAME_CONFIG.MAJORITY_SEATS } = options;
    const PALETTE = ['#E91E63','#5b9bd5','#5cb85c','#d48a3c','#9C27B0','#00BCD4','#d9534f','#8BC34A','#FFC107','#673AB7'];
    const fmt = parties.map((p, i) => ({ name: p.party_name, seats: p.seats, color: p.color || PALETTE[i % PALETTE.length] }));
    const total = fmt.reduce((s, p) => s + p.seats, 0);
    if (total === 0) return;

    const svg = document.getElementById('parliament-svg');
    if (!svg) return;

    const cx = 260, cy = 265, outerR = 230, minInnerR = 80;
    const rows = _calcParliamentRows(total, outerR, minInnerR);
    const dots = _genParliamentDots(rows, cx, cy);

    // Sort dots by angle (left-to-right), then inner-to-outer within same angle.
    // This makes party colors fill as radial wedges from center outward.
    dots.forEach(d => { d.angle = Math.atan2(cy - d.y, d.x - cx); d.radius = Math.hypot(d.x - cx, cy - d.y); });
    dots.sort((a, b) => b.angle - a.angle || a.radius - b.radius);

    // Build seat color + name arrays (party order)
    const seatColors = [], seatNames = [];
    fmt.forEach(p => { for (let i = 0; i < p.seats; i++) { seatColors.push(p.color); seatNames.push(p.name); } });

    // Dynamic dot radius: fit within rows without overlap, capped [2.5, 6]
    const maxDotR = Math.min(6, ...rows.map(r => r.seats > 1 ? (Math.PI * r.radius) / (r.seats * 2.8) : 6));
    const dotR = Math.max(2.5, maxDotR);

    let c = '';

    // Draw seat dots
    dots.forEach((d, i) => {
        if (i < seatColors.length) {
            c += `<circle cx="${d.x.toFixed(1)}" cy="${d.y.toFixed(1)}" r="${dotR.toFixed(1)}" fill="${seatColors[i]}" stroke="var(--bg-panel)" stroke-width="0.8"><title>${seatNames[i]}</title></circle>`;
        }
    });

    // Majority threshold line
    if (showMajorityLine && majoritySeats && majoritySeats < total) {
        const fraction = majoritySeats / total;
        const majAngle = Math.PI * (1 - fraction);
        const innerR = rows[0].radius;
        const outerRActual = rows[rows.length - 1].radius;

        const x1 = cx + (innerR - 12) * Math.cos(majAngle);
        const y1 = cy - (innerR - 12) * Math.sin(majAngle);
        const x2 = cx + (outerRActual + 12) * Math.cos(majAngle);
        const y2 = cy - (outerRActual + 12) * Math.sin(majAngle);

        c += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>`;

        // Label at outer tip
        const lblX = cx + (outerRActual + 22) * Math.cos(majAngle);
        const lblY = cy - (outerRActual + 22) * Math.sin(majAngle);
        c += `<text x="${lblX.toFixed(1)}" y="${lblY.toFixed(1)}" text-anchor="middle" fill="var(--text-muted)" font-size="8" font-weight="600">${majoritySeats}</text>`;
    }

    // Center text
    c += `<text x="${cx}" y="${cy - 14}" text-anchor="middle" fill="var(--accent)" font-size="26" font-weight="bold">${total}</text>`;
    c += `<text x="${cx}" y="${cy + 4}" text-anchor="middle" fill="var(--text-muted)" font-size="10" letter-spacing="1.5">TOTAL SEATS</text>`;

    svg.innerHTML = c;

    // Legend
    if (showLegend) {
        const legendEl = document.getElementById('parliament-legend');
        if (legendEl) {
            legendEl.innerHTML = fmt.map(p => {
                const legParty = allParties.find(x => x.faction_name === p.name);
                const legLogo = legParty?.party_logo;
                const legCustomLogo = legParty?.custom_logo_url;
                const legLogoHtml = legLogo || legCustomLogo ? `<span style="display:inline-flex;vertical-align:middle;margin-right:4px;">${getPartyLogoHTML({ customLogoUrl: legCustomLogo, iconKey: legLogo, size: 14, color: p.color })}</span>` : '';
                return `<div class="legend-item"><span class="legend-swatch" style="background:${p.color};"></span><span class="legend-name">${legLogoHtml}${escapeHtml(p.name)}</span><span class="legend-seats">${p.seats}</span></div>`;
            }).join('');
        }
    }
}

function _calcParliamentRows(totalSeats, outerR, minInnerR) {
    let numRows = Math.round(Math.sqrt(totalSeats / 3));
    numRows = Math.max(3, Math.min(10, numRows));

    const innerR = Math.max(minInnerR, outerR - numRows * 30);
    const rowSpacing = numRows > 1 ? (outerR - innerR) / (numRows - 1) : 0;

    const radii = [];
    for (let i = 0; i < numRows; i++) radii.push(innerR + i * rowSpacing);

    // Distribute seats proportionally by arc circumference
    const totalArc = radii.reduce((sum, r) => sum + Math.PI * r, 0);
    const rows = [];
    let allocated = 0;

    for (let i = 0; i < numRows; i++) {
        const seatsInRow = Math.round(totalSeats * (Math.PI * radii[i]) / totalArc);
        rows.push({ radius: radii[i], seats: seatsInRow });
        allocated += seatsInRow;
    }

    // Correct rounding on outermost row
    rows[rows.length - 1].seats += (totalSeats - allocated);
    return rows;
}

function _genParliamentDots(rows, cx, cy) {
    const positions = [];
    const padAngle = 0.08;

    for (const row of rows) {
        const n = row.seats;
        const r = row.radius;
        if (n <= 0) continue;

        if (n === 1) {
            positions.push({ x: cx + r * Math.cos(Math.PI / 2), y: cy - r * Math.sin(Math.PI / 2) });
            continue;
        }

        const startAngle = Math.PI - padAngle;
        const endAngle = padAngle;
        const step = (startAngle - endAngle) / (n - 1);

        for (let i = 0; i < n; i++) {
            const angle = startAngle - i * step;
            positions.push({ x: cx + r * Math.cos(angle), y: cy - r * Math.sin(angle) });
        }
    }

    return positions;
}

async function resignPMAction() {
    if (_govActionLock || !currentFaction || !currentNation) return;

    const { data: hog } = await _supabase
        .from('head_of_government')
        .select('trait_key')
        .eq('nation_id', currentNation.id)
        .eq('faction_id', currentFaction.id)
        .eq('active', true)
        .maybeSingle();

    if (hog?.trait_key === 'survivor') {
        alert('❌ A Survivor cannot resign. They cling to power.');
        return;
    }

    if (!confirm(
        '📋 RESIGN as Prime Minister?\n\n' +
        'Effects:\n' +
        '• Your party: -5 Approval\n' +
        '• Nation: -3 Stability\n' +
        '• Your party cannot hold PM for 12 ticks (1 year)\n' +
        '• Coalition dissolves — emergency elections held immediately\n' +
        '• All active bills are frozen\n\n' +
        'This cannot be undone. Proceed?'
    )) return;
    _govActionLock = true;

    try {
        const { data: shard } = await _supabase
            .from('shard')
            .select('current_tick')
            .eq('name', 'Alpha Shard')
            .single();

        const result = await resignPM(
            _supabase,
            currentNation.id,
            currentFaction.id,
            shard?.current_tick || 0
        );

        // Bust coalition cache so re-render picks up changed state
        qCacheBust('coalition_');

        alert(
            '📋 You have resigned as Prime Minister.\n\n' +
            'The coalition has been dissolved and emergency elections have been called.\n' +
            'Elections will be held on the next tick. All active bills have been frozen.\n' +
            'Your party cannot hold the PM seat for 12 ticks.'
        );

        await renderGovernmentPage();
    } catch (e) {
        console.error('Resign error:', e);
        alert('Error: ' + e.message);
    } finally { _govActionLock = false; }
}

    async function fireMinister(ministryKey) {
    if (_govActionLock || !currentFaction) return;

    const ministry = ministryData.find(m => m.ministry_key === ministryKey);
    if (!ministry || !ministry.minister_first_name) { alert('No minister to dismiss.'); return; }
    if (ministryKey === 'prime_minister') { alert('Cannot dismiss the Prime Minister this way.'); return; }

    // Permission check: PM party (parliamentary) or President party (presidential)
    const canFire = isPresidential ? isPresidentParty : (currentFaction.id === coalitionData?.lead_party_id);
    if (!canFire) { alert('Only the head of government can dismiss ministers.'); return; }

    const ministerName = ministry.minister_first_name + ' ' + ministry.minister_last_name;
    const ministryName = ministry.ministry_name || MINISTRY_NAMES[ministryKey] || ministryKey;
    if (!confirm('Dismiss ' + ministerName + ' from ' + ministryName + '?\n\nCosts 1 AP. A replacement will need to be appointed.\nThe new minister starts at 50% approval.\nNote: The underlying national stats will not change.')) return;
    _govActionLock = true;

    try {
        // Deduct AP
        const apResult = await deductAP(_supabase, currentFaction.id, 1);
        if (!apResult.success) {
            if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
            alert('Not enough AP (need 1). Current AP: ' + (apResult.currentAp ?? '?'));
            return;
        }
        currentFaction.action_points = apResult.newAp;

        // Clear minister and reset approval
        await _supabase.from('ministries').update({
            minister_first_name: null,
            minister_last_name: null,
            minister_age: null,
            party_id: null,
            minister_approval: NEW_MINISTER_APPROVAL,
            stat_baselines: null
        }).eq('id', ministry.id);

        // Log minister dismissal for Regime Log
        await _supabase.from('campaign_actions').insert({
            party_id: currentFaction.id,
            nation_id: currentNation.id,
            action_type: 'fire_minister',
            tick_performed: currentTick,
            result: { minister_name: ministerName, ministry_key: ministryKey }
        });

        // Apply +3 government approval event (processed next tick)
        await adjustGovernmentApprovalEvent(_supabase, currentNation.id, 3, 'minister:fired');

        alert(ministerName + ' has been dismissed from ' + ministryName + '.\n+3 government approval event applied.');
        await renderGovernmentPage();
    } catch (e) {
        console.error('Fire minister error:', e);
        alert('Error: ' + e.message);
    } finally { _govActionLock = false; }
}

    async function resignMinistry(ministryKey) {
    const ministry = ministryData.find(m => m.ministry_key === ministryKey);
    if (!ministry) return;

    // Cannot resign ministry during caretaker government
    if (!isPresidential && coalitionData?.status === 'caretaker') {
        alert('Cannot resign ministries during a caretaker government.');
        return;
    }

    const ministerName = ministry.minister_first_name + ' ' + ministry.minister_last_name;
    const confirmMsg = isPresidential
        ? 'Resign ' + ministerName + ' from ' + (ministry.ministry_name || ministryKey) + '?\n\nThis vacates the position. The President will need to nominate a replacement.'
        : 'Resign ' + ministerName + ' from ' + (ministry.ministry_name || ministryKey) + '?\n\nThis vacates the position. Your coalition leader may reassign it.';
    if (!confirm(confirmMsg)) return;

    try {
        const updateData = {
            minister_first_name: null,
            minister_last_name: null,
            minister_age: null,
            party_id: null,
            minister_approval: NEW_MINISTER_APPROVAL,
            stat_baselines: null
        };
        // In presidential systems, reset confirmation_status so President can re-nominate
        if (isPresidential) {
            updateData.confirmation_status = null;
            updateData.pending_minister = null;
        }

        await _supabase.from('ministries').update(updateData).eq('id', ministry.id);

        alert(ministerName + ' has resigned from ' + (ministry.ministry_name || ministryKey) + '.');
        await renderGovernmentPage();
    } catch (e) {
        console.error('Resign ministry error:', e);
        alert('Error: ' + e.message);
    }
}


// ==================== PAST ADMINISTRATIONS ====================

const END_REASON_LABELS = {
    election_loss: 'Election Loss',
    new_coalition: 'New Coalition',
    coalition_collapse: 'Collapsed',
    coup: 'Coup',
    dissolved: 'Dissolved',
    pm_replaced: 'PM Replaced',
    regime_collapse: 'Regime Collapsed',
    revolution: 'Revolution',
    power_vacuum: 'Power Vacuum',
    impeachment: 'Impeachment'
};

/**
 * Compute stat achievements and challenges from start/end snapshots.
 */
function computeAdminChanges(statsStart, statsEnd) {
    if (!statsStart || !statsEnd) return { achievements: [], challenges: [], allChanges: [] };

    const changes = [];
    for (const key of Object.keys(statsEnd)) {
        const start = statsStart[key] ?? 0;
        const end = statsEnd[key] ?? 0;
        const raw = end - start;
        if (Math.abs(raw) < 0.01) continue;

        let improvement;
        if (STATS_HIGHER_IS_BETTER.includes(key)) {
            improvement = raw;
        } else if (STATS_LOWER_IS_BETTER.includes(key)) {
            improvement = -raw;
        } else {
            continue; // neutral stats excluded from ranking
        }

        changes.push({ key, start, end, raw, improvement });
    }

    const sortedByBest = [...changes].sort((a, b) => b.improvement - a.improvement);
    const achievements = sortedByBest.filter(c => c.improvement > 0).slice(0, 3);
    const sortedByWorst = [...changes].sort((a, b) => a.improvement - b.improvement);
    const challenges = sortedByWorst.filter(c => c.improvement < 0).slice(0, 3);

    return { achievements, challenges, allChanges: sortedByBest };
}

/**
 * Format a stat key into a human-readable name.
 */
function formatAdminStatName(key) {
    const overrides = {
        'gdp': 'GDP', 'gdp_growth': 'GDP Growth', 'oil_and_gas': 'Oil & Gas',
        'beds_per_100k': 'Hospital Beds', 'lifespan': 'Life Expectancy',
        'literacy': 'Literacy Rate', 'credit': 'Credit Rating',
        'labor_force_participation': 'Labor Participation',
        'renewable_energy_percentage': 'Renewable Energy',
        'debt_growth': 'Debt Growth'
    };
    if (overrides[key]) return overrides[key];
    return key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
}

/**
 * Format a raw stat value for display (no sign prefix).
 */
function formatStatValue(val, key) {
    if (['gdp', 'debt'].includes(key)) return (val / 1e9).toFixed(1) + 'B';
    if (key === 'population') return (val / 1e6).toFixed(2) + 'M';
    if (key === 'gdp_growth') { var p = ((val - 50) / 50) * 1; return (p >= 0 ? '+' : '') + p.toFixed(2) + '%'; }
    if (key === 'trade_balance') { var v = Math.round(val); return v === 50 ? 'Balanced' : v + '% Exp / ' + (100-v) + '% Imp'; }
    if (Math.abs(val) < 1 && val !== 0) return val.toFixed(2);
    return String(Math.round(val * 10) / 10);
}

/**
 * Format a stat change (delta) with +/- sign.
 */
function formatChange(raw, key) {
    const sign = raw > 0 ? '+' : '';
    if (['gdp', 'debt'].includes(key)) return sign + (raw / 1e9).toFixed(1) + 'B';
    if (key === 'population') return sign + (raw / 1e6).toFixed(2) + 'M';
    if (Math.abs(raw) < 1 && raw !== 0) return sign + raw.toFixed(2);
    return sign + Math.round(raw * 10) / 10;
}

/**
 * Determine if a change is good (improvement) based on stat direction.
 */
function isImprovement(key, raw) {
    if (STATS_HIGHER_IS_BETTER.includes(key)) return raw > 0;
    if (STATS_LOWER_IS_BETTER.includes(key)) return raw < 0;
    return null; // neutral
}

/**
 * Calculate duration in months from tick range.
 */
function ticksToMonths(startTick, endTick) {
    if (endTick == null) return null;
    return endTick - startTick; // 1 tick = 1 month
}

/**
 * Load and render past administrations.
 */
async function loadPastAdministrations() {
    const container = document.getElementById('past-administrations-container');
    if (!container) return;

    try {
        // Fetch all administrations (both past and current)
        const { data: admins, error } = await _supabase
            .from('administrations')
            .select('*')
            .eq('nation_id', currentNation.id)
            .order('started_at_tick', { ascending: false });

        if (error) throw error;
        if (!admins || admins.length === 0) {
            container.innerHTML = `
                <div class="past-admins-toggle" style="cursor: default;">
                    <span class="past-admins-toggle-text">Past Administrations (0)</span>
                </div>
                <div class="info-block" style="margin-top: 8px;">
                    <div class="info-row">
                        <span class="info-label">History</span>
                        <span class="info-value" style="color: var(--text-muted);">No administrations recorded yet.</span>
                    </div>
                </div>
            `;
            return;
        }

        const pastAdmins = admins.filter(a => a.ended_at_tick != null);
        const currentAdmin = admins.find(a => a.ended_at_tick == null);
        const totalCount = pastAdmins.length + (currentAdmin ? 1 : 0);

        container.innerHTML = `
            <div class="past-admins-toggle" onclick="togglePastAdmins()">
                <span class="past-admins-toggle-text">Past Administrations (${pastAdmins.length})</span>
                <span class="chevron">&#9660;</span>
            </div>
            <div class="past-admins-list hidden" id="past-admins-list">
                ${currentAdmin ? renderAdminCard(currentAdmin, true) : ''}
                ${pastAdmins.map(a => renderAdminCard(a, false)).join('')}
            </div>
        `;
    } catch (err) {
        console.error('Error loading past administrations:', err);
    }
}

function togglePastAdmins() {
    const toggle = document.querySelector('.past-admins-toggle');
    const list = document.getElementById('past-admins-list');
    if (!toggle || !list) return;
    toggle.classList.toggle('open');
    list.classList.toggle('hidden');
}

function toggleAdminCard(id) {
    const card = document.getElementById('admin-card-' + id);
    if (card) card.classList.toggle('open');
}

function toggleStatTable(id) {
    const table = document.getElementById('stat-table-' + id);
    if (table) {
        table.classList.toggle('open');
        event.stopPropagation();
    }
}

function renderAdminCard(admin, isCurrent) {
    const endClass = isCurrent ? 'current-admin' : ('end-' + (admin.end_reason || 'dissolved'));

    // Summary info (use in-game tick dates, not real-world timestamps)
    const dateRange = isCurrent
        ? `${tickToDate(admin.started_at_tick)} — Present`
        : `${tickToDate(admin.started_at_tick)} — ${tickToDate(admin.ended_at_tick)}`;

    const coalitionParties = admin.coalition_parties || [];
    const partyList = coalitionParties.map(p => p.party_name).join(' + ');
    const seatCount = admin.total_seats || 0;

    // Approval trajectory
    const approvalStart = admin.approval_at_start;
    const approvalEnd = isCurrent ? null : admin.approval_at_end;
    let approvalHTML = '';
    if (isCurrent) {
        // Show live government approval for the current administration
        const liveApproval = currentNation?.gov_approval;
        if (liveApproval != null) {
            approvalHTML = `<span>${liveApproval}%</span>`;
        } else if (approvalStart != null) {
            approvalHTML = `<span>${approvalStart}%</span>`;
        }
    } else if (approvalStart != null) {
        if (approvalEnd != null) {
            const color = approvalEnd >= approvalStart ? 'var(--green)' : 'var(--red)';
            approvalHTML = `<span style="color:${color}">${approvalStart}% &rarr; ${approvalEnd}%</span>`;
        } else {
            approvalHTML = `<span>${approvalStart}%</span>`;
        }
    }

    // Duration
    const durationMonths = isCurrent ? null : ticksToMonths(admin.started_at_tick, admin.ended_at_tick);
    const durationText = durationMonths != null ? `${durationMonths} month${durationMonths !== 1 ? 's' : ''} in power` : '';

    // End reason badge
    let reasonBadge = '';
    if (isCurrent) {
        reasonBadge = '<span class="pad-current-badge">CURRENT</span>';
    } else if (admin.end_reason) {
        reasonBadge = `<span class="pad-end-reason ${admin.end_reason}">${END_REASON_LABELS[admin.end_reason] || admin.end_reason}</span>`;
    }

    // Compute achievements/challenges
    const { achievements, challenges, allChanges } = computeAdminChanges(admin.stats_at_start, admin.stats_at_end);

    // Legislation
    const billsPassed = admin.bills_passed || [];
    const billsFailed = admin.bills_failed || [];
    const lawsRepealed = admin.laws_repealed || [];
    const crisesStarted = admin.crises_started || [];
    const crisesSolved = admin.crises_solved || [];
    const noConfidenceVotes = admin.no_confidence_votes || [];
    const impeachments = admin.impeachments || [];
    const executiveOrders = admin.executive_orders || [];
    const snapElections = admin.snap_elections || [];
    const minorityGovernments = admin.minority_governments || [];
    const leaderChanges = admin.leader_changes || [];

    // Detail sections
    let detailHTML = '';

    // Info grid — adapt labels for presidential vs parliamentary vs autocracy
    const isPres = admin.government_type === 'Presidential';
    const isAutoc = admin.government_type === 'Autocracy';

    let hogLabel, hogName, hogParty;
    let govLeaderLabel, govLeaderName, govLeaderSub;

    if (isAutoc) {
        hogLabel = escapeHtml(admin.head_of_state_title || 'Ruler');
        hogName = admin.head_of_state || admin.prime_minister || 'Unknown';
        hogParty = admin.pm_party_name || '';
        govLeaderLabel = 'Ruling Faction';
        govLeaderName = admin.pm_party_name || '—';
        govLeaderSub = '';
    } else if (isPres) {
        hogLabel = 'President';
        hogName = admin.president_name || admin.head_of_state || 'Unknown';
        hogParty = admin.president_party_name || admin.pm_party_name || '';
        govLeaderLabel = 'Governing Party';
        govLeaderName = admin.president_party_name || admin.pm_party_name || '—';
        govLeaderSub = '';
    } else {
        hogLabel = escapeHtml(admin.head_of_state_title || 'Head of State');
        hogName = admin.head_of_state || 'Unknown';
        hogParty = admin.hos_election_method === 'hereditary'
            ? (currentNation.dynasty_name ? currentNation.dynasty_name + ' dynasty' : '')
            : '';
        govLeaderLabel = 'Prime Minister';
        govLeaderName = admin.prime_minister || 'Not yet selected';
        govLeaderSub = escapeHtml(admin.pm_party_name || '');
    }

    detailHTML += `<div class="past-admin-detail-grid">
        <div class="pad-info-box">
            <div class="pad-info-label">${hogLabel}</div>
            <div class="pad-info-value">${escapeHtml(hogName)}</div>
            ${hogParty ? `<div class="pad-info-sub">${escapeHtml(hogParty)}</div>` : ''}
        </div>
        <div class="pad-info-box">
            <div class="pad-info-label">${govLeaderLabel}</div>
            <div class="pad-info-value">${escapeHtml(govLeaderName)}</div>
            ${govLeaderSub ? `<div class="pad-info-sub">${govLeaderSub}</div>` : ''}
        </div>
        <div class="pad-info-box">
            <div class="pad-info-label">${isAutoc ? 'Faction Seats' : (isPres ? 'Party Seats' : 'Coalition')}</div>
            <div class="pad-info-value">${seatCount} / ${GAME_CONFIG.TOTAL_SEATS} seats</div>
            <div class="pad-info-sub">${durationText}${admin.end_reason ? ' &middot; Ended: ' + (END_REASON_LABELS[admin.end_reason] || admin.end_reason) : ''}</div>
        </div>
    </div>`;

    // Coalition parties
    if (coalitionParties.length > 0) {
        detailHTML += `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">
            ${coalitionParties.map(p => `<span class="coalition-party-tag">${p.party_name}${p.seats ? '<span class="seats">' + p.seats + '</span>' : ''}</span>`).join('<span class="coalition-divider">+</span>')}
        </div>`;
    }

    // Achievements
    if (!isCurrent && achievements.length > 0) {
        detailHTML += `<div class="pad-section-title">Top Achievements</div>`;
        detailHTML += achievements.map(a => {
            const isLowerBetter = STATS_LOWER_IS_BETTER.includes(a.key);
            const arrow = isLowerBetter ? ' &darr; improved' : '';
            return `<div class="pad-achievement">
                <span class="pad-stat-name">${formatAdminStatName(a.key)}</span>
                <span class="pad-stat-change positive">${formatStatValue(a.start, a.key)} &rarr; ${formatStatValue(a.end, a.key)} (${formatChange(a.raw, a.key)})${arrow}</span>
            </div>`;
        }).join('');
    }

    // Challenges
    if (!isCurrent && challenges.length > 0) {
        detailHTML += `<div class="pad-section-title">Biggest Challenges</div>`;
        detailHTML += challenges.map(c => {
            const isHigherBetter = STATS_HIGHER_IS_BETTER.includes(c.key);
            const arrow = isHigherBetter ? '' : ' &uarr; worsened';
            return `<div class="pad-challenge">
                <span class="pad-stat-name">${formatAdminStatName(c.key)}</span>
                <span class="pad-stat-change negative">${formatStatValue(c.start, c.key)} &rarr; ${formatStatValue(c.end, c.key)} (${formatChange(c.raw, c.key)})${arrow}</span>
            </div>`;
        }).join('');
    }

    if (!isCurrent && achievements.length === 0 && challenges.length === 0 && admin.stats_at_end) {
        detailHTML += `<div class="pad-no-data">No significant stat changes during this administration.</div>`;
    }

    if (isCurrent && !admin.stats_at_end) {
        detailHTML += `<div class="pad-no-data">Stats will be compared when this administration ends.</div>`;
    }

    // Crises
    if (crisesStarted.length > 0 || crisesSolved.length > 0) {
        detailHTML += `<div class="pad-section-title">Crises</div>`;
        if (crisesStarted.length > 0) {
            detailHTML += `<div style="font-size:0.72rem;color:var(--red);font-weight:bold;margin-bottom:4px;">Started (${crisesStarted.length})</div>`;
            detailHTML += crisesStarted.map(c => `<div class="pad-crisis-item"><span>${c.title}</span><span class="crisis-date">${c.started_tick != null ? tickToDate(c.started_tick) : (c.started_date || '')}</span></div>`).join('');
        }
        if (crisesSolved.length > 0) {
            detailHTML += `<div style="font-size:0.72rem;color:var(--green);font-weight:bold;margin:6px 0 4px;">Solved (${crisesSolved.length})</div>`;
            detailHTML += crisesSolved.map(c => `<div class="pad-crisis-item"><span>${c.title}</span><span class="crisis-date">${c.solved_tick != null ? tickToDate(c.solved_tick) : (c.solved_date || '')}</span></div>`).join('');
        }
    }

    // Legislation
    if (billsPassed.length > 0 || billsFailed.length > 0 || lawsRepealed.length > 0) {
        detailHTML += `<div class="pad-section-title">Legislation</div>`;
        if (billsPassed.length > 0) {
            detailHTML += `<div style="font-size:0.72rem;color:var(--green);font-weight:bold;margin-bottom:4px;">Bills Passed (${billsPassed.length})</div>`;
            detailHTML += billsPassed.map(b => `<div class="pad-legislation-item"><span class="bill-name">${escapeHtml(b.bill_name || 'Unnamed')}</span><span class="bill-date">${tickToDate(b.passed_tick)}</span></div>`).join('');
        }
        if (billsFailed.length > 0) {
            detailHTML += `<div style="font-size:0.72rem;color:var(--red);font-weight:bold;margin:6px 0 4px;">Bills Failed (${billsFailed.length})</div>`;
            detailHTML += billsFailed.map(b => `<div class="pad-legislation-item"><span class="bill-name" style="color:var(--text-muted);">${escapeHtml(b.bill_name || 'Unnamed')}</span></div>`).join('');
        }
        if (lawsRepealed.length > 0) {
            detailHTML += `<div style="font-size:0.72rem;color:var(--orange);font-weight:bold;margin:6px 0 4px;">Laws Repealed (${lawsRepealed.length})</div>`;
            detailHTML += lawsRepealed.map(b => `<div class="pad-legislation-item"><span class="bill-name">${escapeHtml(b.bill_name || 'Unnamed')}</span><span class="bill-date">${b.repealed_tick != null ? tickToDate(b.repealed_tick) : (b.repealed_date || '')}</span></div>`).join('');
        }
    }

    if (!isCurrent && billsPassed.length === 0 && billsFailed.length === 0 && lawsRepealed.length === 0) {
        detailHTML += `<div class="pad-section-title">Legislation</div><div class="pad-no-data">No legislative activity during this administration.</div>`;
    }

    // Political Events
    const hasPolEvents = noConfidenceVotes.length > 0 || impeachments.length > 0 || executiveOrders.length > 0 || snapElections.length > 0 || minorityGovernments.length > 0;
    if (hasPolEvents) {
        detailHTML += `<div class="pad-section-title">Political Events</div>`;
        if (noConfidenceVotes.length > 0) {
            detailHTML += noConfidenceVotes.map(v => {
                const passed = v.result === 'passed';
                const color = passed ? 'var(--red)' : 'var(--green)';
                const label = passed ? 'PASSED' : 'FAILED';
                return `<div class="pad-legislation-item"><span class="bill-name">Vote of No Confidence</span><span class="bill-date" style="color:${color};">${label} &middot; ${tickToDate(v.tick)}</span></div>`;
            }).join('');
        }
        if (impeachments.length > 0) {
            detailHTML += impeachments.map(v => {
                const passed = v.result === 'passed';
                const color = passed ? 'var(--red)' : 'var(--green)';
                const label = passed ? 'PASSED' : 'FAILED';
                const typeLabel = v.type === 'impeachment_conviction' ? 'Impeachment Conviction' : 'Impeachment Motion';
                return `<div class="pad-legislation-item"><span class="bill-name">${typeLabel}</span><span class="bill-date" style="color:${color};">${label} &middot; ${tickToDate(v.tick)}</span></div>`;
            }).join('');
        }
        if (snapElections.length > 0) {
            detailHTML += snapElections.map(e => `<div class="pad-legislation-item"><span class="bill-name">Snap Election</span><span class="bill-date">${tickToDate(e.tick)}</span></div>`).join('');
        }
        if (minorityGovernments.length > 0) {
            detailHTML += minorityGovernments.map(e => `<div class="pad-legislation-item"><span class="bill-name" style="color:var(--orange);">Minority Government Formed</span><span class="bill-date">${tickToDate(e.tick)}</span></div>`).join('');
        }
        if (leaderChanges.length > 0) {
            detailHTML += `<div style="font-size:0.72rem;color:var(--teal, #5aafa5);font-weight:bold;margin:6px 0 4px;">Leadership Changes (${leaderChanges.length})</div>`;
            detailHTML += leaderChanges.map(lc => `<div class="pad-legislation-item"><span class="bill-name">${escapeHtml(lc.role)}</span><span class="bill-date" style="color:var(--text-dim);">${escapeHtml(lc.description)} &middot; ${tickToDate(lc.tick)}</span></div>`).join('');
        }
        if (executiveOrders.length > 0) {
            const eoLabels = { acting_minister: 'Acting Minister', emergency_session: 'Emergency Session', executive_decree: 'Executive Decree', emergency_powers: 'Emergency Powers', media_address: 'Media Address' };
            detailHTML += `<div style="font-size:0.72rem;color:var(--amber);font-weight:bold;margin:6px 0 4px;">Executive Orders (${executiveOrders.length})</div>`;
            detailHTML += executiveOrders.map(eo => `<div class="pad-legislation-item"><span class="bill-name">${escapeHtml(eoLabels[eo.order_type] || eo.order_type)}</span><span class="bill-date">${tickToDate(eo.tick)}</span></div>`).join('');
        }
    }

    // Trade Agreements
    const tradeAgreements = admin.trade_agreements || [];
    if (tradeAgreements.length > 0) {
        const taTypeLabels = { fta: 'Free Trade Agreement', pta: 'Preferential Trade Agreement', resource_supply: 'Resource Supply', export_subsidy: 'Export Subsidy', impose_embargo: 'Embargo', retaliatory_tariff: 'Retaliatory Tariff' };
        detailHTML += `<div class="pad-section-title">Trade Agreements (${tradeAgreements.length})</div>`;
        detailHTML += tradeAgreements.map(ta => `<div class="pad-legislation-item"><span class="bill-name">${escapeHtml(ta.agreement_name || 'Unnamed')}</span><span class="bill-date" style="color:var(--text-dim);">${taTypeLabels[ta.agreement_type] || ta.agreement_type} &middot; ${tickToDate(ta.enacted_at_tick)}</span></div>`).join('');
    }

    // All stat changes table (expandable)
    if (!isCurrent && allChanges.length > 0) {
        detailHTML += `
            <div class="pad-stat-table-toggle" onclick="toggleStatTable('${admin.id}')">
                <span>All Stat Changes (${allChanges.length})</span>
                <span class="chevron">&#9660;</span>
            </div>
            <div class="pad-stat-table" id="stat-table-${admin.id}">
                <table>
                    <thead><tr><th>Stat</th><th>Start</th><th>End</th><th>Change</th></tr></thead>
                    <tbody>
                        ${allChanges.map(c => {
                            const good = isImprovement(c.key, c.raw);
                            const indicator = good === true ? ' style="color:var(--green)"' : (good === false ? ' style="color:var(--red)"' : '');
                            return `<tr>
                                <td>${formatAdminStatName(c.key)}</td>
                                <td>${formatStatValue(c.start, c.key)}</td>
                                <td>${formatStatValue(c.end, c.key)}</td>
                                <td${indicator}>${formatChange(c.raw, c.key)}</td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>
            </div>`;
    }

    return `
        <div class="past-admin-card ${endClass}" id="admin-card-${admin.id}">
            <div class="past-admin-summary" onclick="toggleAdminCard('${admin.id}')">
                <div class="past-admin-summary-left">
                    <div class="past-admin-name">
                        ${admin.admin_name || 'Unknown Administration'}
                        ${reasonBadge}
                        <span class="past-admin-date">${dateRange}</span>
                    </div>
                    <div class="past-admin-meta">
                        ${isAutoc
                            ? `<span class="pm-name">${escapeHtml(admin.head_of_state || admin.prime_minister || 'TBD')}</span> &middot; ${escapeHtml(admin.pm_party_name || '')}`
                            : (isPres
                                ? `<span class="pm-name">${escapeHtml(admin.president_name || admin.head_of_state || 'TBD')}</span> &middot; ${escapeHtml(admin.president_party_name || admin.pm_party_name || '')}`
                                : `PM: <span class="pm-name">${admin.prime_minister || 'TBD'}</span> &middot; ${admin.pm_party_name || ''}`)}
                        ${partyList ? ` &middot; ${partyList}` : ''}
                        ${seatCount ? ` &middot; ${seatCount}/${GAME_CONFIG.TOTAL_SEATS} seats` : ''}
                    </div>
                </div>
                <div class="past-admin-approval">
                    <div class="past-admin-approval-label">Approval</div>
                    <div class="past-admin-approval-value">${approvalHTML || '—'}</div>
                </div>
                <span class="past-admin-chevron">&#9660;</span>
            </div>
            <div class="past-admin-detail">
                ${detailHTML}
            </div>
        </div>`;
}
