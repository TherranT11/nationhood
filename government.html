            <span style="font-family:var(--font-mono);font-size:16px;font-weight:700;color:${seatColor};">${p.seats}</span>
        </div>`;
    };
    for (const p of govParties) html += renderPartyRow(p);

    // Opposition
    html += `<div style="font-family:var(--font-mono);font-size:7px;font-weight:700;letter-spacing:1px;color:var(--text-dim);margin-top:10px;margin-bottom:4px;display:flex;justify-content:space-between;">
        <span>OPPOSITION</span>
        <span style="color:var(--text-dim);">${oppSeats} seats</span>
    </div>`;
    for (const p of oppParties) html += renderPartyRow(p, { opposition: true });

    // Majority indicator
    html += `<div style="margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px;">
        <span style="width:8px;height:8px;border-radius:50%;background:${aboveMajority >= 0 ? 'var(--green)' : 'var(--red)'};"></span>
        <span style="font-family:var(--font-mono);font-size:12px;font-weight:700;color:${aboveMajority >= 0 ? 'var(--green)' : 'var(--red)'};">
            ${aboveMajority >= 0 ? '+' + aboveMajority + ' above majority' : Math.abs(aboveMajority) + ' below majority'}
        </span>
    </div>`;

    html += `</div>`;

    el.innerHTML = html;
}

function getBillSupportPercent(bill) {
    const { totalSeats, majority, parties } = _legData;
    // Floor bills: use votes_for (recomputed live from bill_support in
    // loadLegislatureData so it reflects votes cast since the last tick,
    // not the stale cached column).
    if (bill.status === 'floor' || bill.status === 'voting' || bill.status === 'vetoed') {
        const yesVotes = bill.votes_for || 0;
        return Math.round((yesVotes / totalSeats) * 100);
    }
    // Committee bills: use calculateBillSupport (sponsor + accepted supporters).
    const seatMap = {};
    for (const p of parties) seatMap[p.id] = p.seats || 0;
    const support = calculateBillSupport(bill.bill_support, bill.proposed_by, seatMap);
    return support.percent;
}

// Effects come from the selected_option when a multi-option policy has one
// chosen, otherwise from the base policy row. Mirrors the SSoT used by
// bills.js (sector effects on the option row when present).
function _articleStatEffects(art) {
    const opt = art.selected_option;
    const optEff = Array.isArray(opt?.stat_effects) ? opt.stat_effects : null;
    if (optEff && optEff.length > 0) return optEff;
    // Target-based options carry no stat_effects — derive the same
    // up/down chip shape from stat_targets so the renderer is
    // unchanged (target ≥ 50 reads as "up", < 50 as "down"; an exact
    // 50 is neutral and contributes no chip).
    const targets = Array.isArray(opt?.stat_targets) ? opt.stat_targets : null;
    if (targets && targets.length > 0) {
        return targets
            .filter(t => t && t.stat_key && Number.isFinite(Number(t.target)) && Number(t.target) !== 50)
            .map(t => ({ stat_key: t.stat_key, direction: Number(t.target) >= 50 ? 'up' : 'down' }));
    }
    const p = art.policies || {};
    if (Array.isArray(p.stat_effects) && p.stat_effects.length > 0) return p.stat_effects;
    if (p.target_stat) {
        const dir = (p.stat_direction || 'UP').toLowerCase() === 'down' ? 'down' : 'up';
        return [{ stat_key: p.target_stat, direction: dir }];
    }
    return [];
}

// Renders a single bill article block: policy header (with the picked
// option if multi-option), description, fiscal summary, and stat /
// sector effect chips. Reads from selected_option first when an option
// is locked in, otherwise falls back to the policy row.
function _renderBillArticleRow(art, articleOrdinal) {
    const policy = art.policies || {};
    const opt    = art.selected_option || null;

    const policyName = policy.name || policy.policy_name || art.article_title || 'Article ' + (art.article_number || '?');
    const ideologyList = Array.isArray(policy.ideologies)
        ? policy.ideologies
        : (policy.ideology ? [policy.ideology] : []);
    const ideologyLabels = ideologyList
        .filter(Boolean)
        .map((ideology) => ` (${escapeHtml(String(ideology))})`)
        .join('');

    const optionName = opt?.option_name || '';
    const descriptionText = (opt?.option_description) || policy.description || art.article_text || '';

    const hasBudget = art.funding_data || art.effect_data?.funding_data;
    const badge = hasBudget ? 'BUDGET' : (opt ? 'OPTION' : 'TEXT');
    const badgeColor = hasBudget ? 'var(--gold, #c8a832)' : (opt ? 'var(--purple, #a06ade)' : 'var(--blue)');

    // Title row: policy name, plus the picked option when present.
    let html = `<div style="padding:6px 10px;margin-bottom:3px;border-left:2px solid var(--border-main);">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <span style="font-size:calc(10px * var(--leg-scale, 1.755));font-weight:700;color:var(--text-bright);">Article ${articleOrdinal}.: ${escapeHtml(policyName)}${ideologyLabels}</span>
            <span class="leg-article-badge" style="color:${badgeColor};background:${badgeColor}10;border-color:${badgeColor}33;">${badge}</span>
        </div>`;
    if (optionName) {
        html += `<div style="font-family:var(--font-mono);font-size:calc(8px * var(--leg-scale, 1.755));color:var(--text-dim);margin-top:2px;letter-spacing:0.5px;">
            CHANGED TO &#9656; <span style="color:var(--text-bright);">${escapeHtml(optionName)}</span>
        </div>`;
    }
    if (descriptionText) {
        html += `<p style="font-size:calc(9px * var(--leg-scale, 1.755));color:var(--text-dim);margin:3px 0 0;">${escapeHtml(descriptionText)}</p>`;
    }

    // Per-article fiscal chips. Cost comes from the selected option (policy
    // cost cols were dropped); scaled by the nation stat so it matches the
    // budget. Repeal articles surface as "saves $X/yr".
    const fiscalSrc = opt || policy;
    const upfrontRaw = scalePolicyOngoingCost(fiscalSrc?.upfront_cost || 0, fiscalSrc?.upfront_scaling_stat, currentNation);
    const ongoingMonthlyRaw = scalePolicyOngoingCost(fiscalSrc?.ongoing_base_cost || 0, fiscalSrc?.ongoing_scaling_stat, currentNation);
    const ongoingYearlyRaw = ongoingMonthlyRaw * 12;
    const isRepeal = !!art.repeal_active_law_id;
    const fiscalChips = [];
    if (upfrontRaw > 0 && !isRepeal) {
        fiscalChips.push(`<span class="leg-article-fiscal-chip" style="color:var(--amber);border-color:var(--amber)40;">UPFRONT ${formatCostCompact(upfrontRaw)}</span>`);
    }
    if (ongoingYearlyRaw > 0) {
        const onLabel = isRepeal ? `SAVES ${formatCostCompact(ongoingYearlyRaw)}/YR` : `ONGOING ${formatCostCompact(ongoingYearlyRaw)}/YR`;
        const onColor = isRepeal ? 'var(--green)' : 'var(--text-dim)';
        fiscalChips.push(`<span class="leg-article-fiscal-chip" style="color:${onColor};border-color:${onColor}40;">${onLabel}</span>`);
    }

    // Per-article stat effect chips. Same green-good / red-bad coloring
    // as the bill-level chips for visual continuity.
    const statEffects = _articleStatEffects(art);
    const statChips = [];
    const seen = new Set();
    for (const e of statEffects) {
        const stat = e?.stat_key;
        const dir = (e?.direction || '').toLowerCase();
        if (!stat || (dir !== 'up' && dir !== 'down')) continue;
        const key = `${stat}:${dir}`;
        if (seen.has(key)) continue;
        seen.add(key);
        const isGood = (dir === 'up' && !STATS_LOWER_IS_BETTER.includes(stat))
            || (dir === 'down' && STATS_LOWER_IS_BETTER.includes(stat));
        const arrow = dir === 'up' ? '▲' : '▼';
        const color = isGood ? 'var(--green)' : 'var(--red)';
        statChips.push(`<span class="ga-effect-tag" style="color:${color};border-color:${color}30;">${formatStatName(stat)} ${arrow}</span>`);
    }

    // Per-article sector effect chips. sector_effects is an array of
    // {sector, direction, magnitude?} entries. Direction maps the same
    // way as stats, and we tag the sector name for context.
    const sectorEff = Array.isArray(opt?.sector_effects) && opt.sector_effects.length > 0
        ? opt.sector_effects
        : (Array.isArray(policy.sector_effects) ? policy.sector_effects : []);
    const sectorChips = [];
    const seenSec = new Set();
    for (const s of sectorEff) {
        const sector = s?.sector || s?.sector_key || s?.major_sector;
        const dir = (s?.direction || '').toLowerCase();
        if (!sector || (dir !== 'up' && dir !== 'down')) continue;
        const key = `${sector}:${dir}`;
        if (seenSec.has(key)) continue;
        seenSec.add(key);
        const arrow = dir === 'up' ? '▲' : '▼';
        const color = dir === 'up' ? 'var(--green)' : 'var(--red)';
        sectorChips.push(`<span class="ga-effect-tag" style="color:${color};border-color:${color}30;">${escapeHtml(String(sector))} ${arrow}</span>`);
    }

    if (fiscalChips.length || statChips.length || sectorChips.length) {
        html += `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;">${fiscalChips.join('')}${statChips.join('')}${sectorChips.join('')}</div>`;
    }

    html += `</div>`;
    return html;
}

function getBillEffects(bill) {
    const articles = (bill.bill_articles || []).sort((a, b) => (a.article_number || 0) - (b.article_number || 0));
    const effects = [];
    const seen = new Set();
    for (const art of articles) {
        for (const e of _articleStatEffects(art)) {
            const stat = e?.stat_key;
            const dir = (e?.direction || '').toLowerCase();
            if (!stat || (dir !== 'up' && dir !== 'down')) continue;
            const key = `${stat}:${dir}`;
            if (seen.has(key)) continue;
            seen.add(key);
            effects.push({ stat, dir });
        }
    }
    return effects;
}

function renderBillEffectChips(bill, withLabel = true) {
    const effects = getBillEffects(bill);
    if (effects.length === 0) return '';
    let html = '';
    if (withLabel) {
        html += `<div style="font-family:var(--font-mono);font-size:7px;font-weight:700;color:var(--text-dim);letter-spacing:0.8px;margin-bottom:4px;">PROJECTED EFFECTS IF PASSED</div>`;
    }
    html += `<div style="display:flex;flex-wrap:wrap;gap:4px;">`;
    for (const e of effects) {
        const isGood = (e.dir === 'up' && !STATS_LOWER_IS_BETTER.includes(e.stat))
            || (e.dir === 'down' && STATS_LOWER_IS_BETTER.includes(e.stat));
        const arrow = e.dir === 'up' ? '\u25B2' : '\u25BC';
        const color = isGood ? 'var(--green)' : 'var(--red)';
        html += `<span class="ga-effect-tag" style="color:${color};border-color:${color}30;">${formatStatName(e.stat)} ${arrow}</span>`;
    }
    html += `</div>`;
    return html;
}

function formatCostCompact(n) {
    if (!n || n <= 0) return '$0';
    if (n >= 1_000_000_000) return '$' + (n / 1_000_000_000).toFixed(1) + 'B';
    if (n >= 1_000_000) return '$' + Math.round(n / 1_000_000).toLocaleString('en-US') + 'M';
    return '$' + Math.round(n).toLocaleString('en-US');
}

function renderBillVoteButtons(bill) {
    const isFloor = bill.status === 'floor' || bill.status === 'voting';
    const isCommittee = bill.status === 'committee';
    if (!isFloor && !isCommittee) return '';

    const myVote = (bill.bill_support || []).find(s => s.faction_id === currentFaction?.id);
    const myStance = myVote?.stance;
    let html = `<div style="display:flex;gap:4px;flex-wrap:wrap;">`;

    if (isFloor) {
        if (myStance === 'yes' || myStance === 'accept') {
            html += `<div class="leg-vote-btn leg-vote-btn--yes leg-vote-btn--active">VOTED YES</div>`;
        } else {
            html += `<div class="leg-vote-btn leg-vote-btn--yes" onclick="event.stopPropagation();legCastVote('${bill.id}','yes')">VOTE YES</div>`;
        }
        if (myStance === 'no' || myStance === 'reject') {
            html += `<div class="leg-vote-btn leg-vote-btn--no leg-vote-btn--active">VOTED NO</div>`;
        } else {
            html += `<div class="leg-vote-btn leg-vote-btn--no" onclick="event.stopPropagation();legCastVote('${bill.id}','no')">VOTE NO</div>`;
        }
        if (myStance === 'abstain') {
            html += `<div class="leg-vote-btn leg-vote-btn--abstain leg-vote-btn--active">ABSTAINED</div>`;
        } else {
            html += `<div class="leg-vote-btn leg-vote-btn--abstain" onclick="event.stopPropagation();legCastVote('${bill.id}','abstain')">ABSTAIN</div>`;
        }
    } else if (isCommittee) {
        if (myStance === 'accept') {
            html += `<div class="leg-vote-btn leg-vote-btn--yes leg-vote-btn--active">SUPPORTING</div>`;
        } else {
            html += `<div class="leg-vote-btn leg-vote-btn--yes" onclick="event.stopPropagation();legCastVote('${bill.id}','accept')">SUPPORT</div>`;
        }
        if (myStance === 'reject') {
            html += `<div class="leg-vote-btn leg-vote-btn--no leg-vote-btn--active">OPPOSING</div>`;
        } else {
            html += `<div class="leg-vote-btn leg-vote-btn--no" onclick="event.stopPropagation();legCastVote('${bill.id}','reject')">OPPOSE</div>`;
        }
    }

    html += `</div>`;
    return html;
}

function renderBillCard(bill, stageColor) {
    const { totalSeats, majority } = _legData;
    const isExp = _legExpandedBill === bill.id;
    const party = bill.factions || {};
    const partyName = party.faction_name || 'Unknown';
    const partyColor = party.party_color || 'var(--text-dim)';
    const support = getBillSupportPercent(bill);
    const passing = support >= Math.round((majority / totalSeats) * 100);
    const articles = (bill.bill_articles || []).sort((a, b) => (a.article_number || 0) - (b.article_number || 0));

    // Live quorum/threshold evaluation for floor bills (mirrors laws.html)
    const isFloorOrVoting = bill.status === 'floor' || bill.status === 'voting';
    let voteEval = null;
    if (isFloorOrVoting) {
        try {
            voteEval = evaluateBillVote({
                votes_for: bill.votes_for || 0,
                votes_against: bill.votes_against || 0,
                votes_abstain: bill.votes_abstain || 0,
                bill_type: bill.bill_type,
                entrenchment_tier: bill.entrenchment_tier,
            }, totalSeats, currentNation || {});
        } catch (_) { voteEval = null; }
    }
    const yesVotes = bill.votes_for || 0;
    const noVotes = bill.votes_against || 0;
    const abstainVotes = bill.votes_abstain || 0;
    const undeclared = Math.max(0, totalSeats - yesVotes - noVotes - abstainVotes);

    // Committee bills that haven't been sent to the floor expire after
    // COMMITTEE_EXPIRY_TICKS. On the final tick before expiry, dim the card
    // and post a warning so the sponsor sees what's about to happen.
    const committeeAge = bill.status === 'committee' && bill.proposed_tick != null
        ? Math.max(0, currentTick - Number(bill.proposed_tick))
        : 0;
    const expiringNextTick = bill.status === 'committee'
        && committeeAge >= GAME_CONFIG.COMMITTEE_EXPIRY_TICKS - 1;

    const cardStyle = expiringNextTick
        ? `border-left:3px solid var(--text-dim);opacity:0.55;`
        : `border-left:3px solid ${stageColor};`;
    let html = `<div class="leg-bill-card" data-bill-id="${bill.id}" style="${cardStyle}">
        <div class="leg-bill-header">
            <div>
                <div style="display:flex;align-items:center;gap:6px;">
                    <span class="leg-bill-title" style="color:${expiringNextTick ? 'var(--text-dim)' : stageColor};">${escapeHtml(bill.bill_name || 'Untitled Bill')}</span>`;
    if (expiringNextTick) {
        html += `<span class="ga-badge ga-badge--red">LOST SUPPORT · DISAPPEARS NEXT TICK</span>`;
    } else if (isFloorOrVoting && voteEval) {
        const ev = voteEval;
        let badgeText = '', badgeCls = 'ga-badge--red';
        if (ev.status === 'will_pass')           { badgeText = 'WILL PASS — RESOLVES NEXT TICK'; badgeCls = 'ga-badge--green'; }
        else if (ev.status === 'will_fail')      { badgeText = 'WILL FAIL — RESOLVES NEXT TICK'; badgeCls = 'ga-badge--red'; }
        else if (ev.status === 'passing')        { badgeText = `PASSING — ${ev.quorumCurrent}/${ev.quorumThreshold} QUORUM`; badgeCls = 'ga-badge--green'; }
        else if (ev.status === 'failing')        { badgeText = `FAILING — ${ev.quorumCurrent}/${ev.quorumThreshold} QUORUM`; badgeCls = 'ga-badge--red'; }
        else if (ev.status === 'tied')           { badgeText = 'TIED'; badgeCls = 'ga-badge--red'; }
        else if (ev.status === 'quorum_not_met') { badgeText = `QUORUM NOT MET — ${ev.quorumCurrent}/${ev.quorumThreshold}`; badgeCls = 'ga-badge--red'; }
        else if (ev.status === 'pending')        { badgeText = passing ? 'LIKELY TO PASS' : 'AT RISK'; badgeCls = passing ? 'ga-badge--green' : 'ga-badge--red'; }
        if (badgeText) html += `<span class="ga-badge ${badgeCls}">${badgeText}</span>`;
    } else if (isFloorOrVoting) {
        html += passing
            ? `<span class="ga-badge ga-badge--green">LIKELY TO PASS</span>`
            : `<span class="ga-badge ga-badge--red">AT RISK</span>`;
    }
    html += `</div>
                <div class="leg-bill-meta">
                    Proposed by <span style="color:${partyColor};">${escapeHtml(partyName)}</span>${articles.length > 0 ? ' \u00B7 ' + articles.length + ' articles' : ''}
                </div>
            </div>
            <div style="text-align:right;">
                <div class="leg-bill-support-value" style="color:${passing ? 'var(--green)' : support >= 45 ? 'var(--amber)' : 'var(--red)'};">${support}%</div>
                <div class="leg-bill-support-label">SUPPORT</div>
            </div>
        </div>`;

    // Support bar with majority marker
    const majorityPct = Math.round((majority / totalSeats) * 100);
    html += `<div class="leg-support-bar-wrap">
        <div class="leg-support-bar-track">
            <div style="width:${support}%;background:${passing ? 'var(--green)' : 'var(--amber)'};height:100%;"></div>
            <div style="flex:1;background:var(--border-main);height:100%;"></div>
        </div>
        <div class="leg-support-marker" style="left:${majorityPct}%;"></div>
    </div>`;

    // Concrete vote totals + resolution date (floor/voting bills only)
    if (isFloorOrVoting) {
        const tallyParts = [
            `<span style="color:var(--green);">${yesVotes} For</span>`,
            `<span style="color:var(--red);">${noVotes} Against</span>`,
        ];
        if (abstainVotes > 0) tallyParts.push(`<span style="color:var(--text-dim);">${abstainVotes} Abstain</span>`);
        tallyParts.push(`<span style="color:var(--text-dim);">${undeclared} undeclared</span>`);
        html += `<div style="padding:0 14px 4px;font-family:var(--font-mono);font-size:calc(8px * var(--leg-scale, 1.755));display:flex;gap:10px;flex-wrap:wrap;">${tallyParts.join(' · ')}</div>`;
        if (bill.voting_ends_tick) {
            html += `<div style="padding:0 14px 6px;font-family:var(--font-mono);font-size:calc(7px * var(--leg-scale, 1.755));color:var(--text-dim);">Resolves ${escapeHtml(tickToDate(bill.voting_ends_tick))}</div>`;
        }
    }

    // Always-visible effect chips, cost summary, and vote actions
    const totals = computeBillCostTotals(bill, currentNation);
    const ongoingMonthly = totals.ongoingMonthly;
    const effectChips = renderBillEffectChips(bill, false);
    const inlineVotes = renderBillVoteButtons(bill);
    html += `<div style="padding:0 14px 8px;">`;
    if (effectChips) {
        html += `<div style="margin-bottom:6px;">${effectChips}</div>`;
    }
    // Clamp repeal-heavy negatives to 0 on the summary card so a small
    // save-only bill doesn't read as a confusing "−$Xm/yr"; the detail view
    // still shows the signed savings line.
    const upfrontDisplay = formatCostCompact(Math.max(0, totals.upfront));
    const ongoingYearlyDisplay = formatCostCompact(Math.max(0, totals.ongoingYearly));
    const ongoingMonthlyDisplay = formatCostCompact(Math.max(0, ongoingMonthly));
    html += `<div style="font-family:var(--font-mono);font-size:calc(8px * var(--leg-scale, 1.755));color:var(--text-dim);margin-bottom:${inlineVotes ? '6px' : '0'};">
        UPFRONT COST: ${upfrontDisplay} | ONGOING COST: ${ongoingYearlyDisplay} / YEAR (${ongoingMonthlyDisplay} / MONTH)
    </div>`;
    if (inlineVotes) {
        html += inlineVotes;
    }
    html += `</div>`;

    // Articles (always visible for committee + floor; expand toggles full detail)
    if (bill.status === 'committee' || isFloorOrVoting || isExp) {
        html += `<div style="padding:0 14px 8px;">`;
        const toRoman = (n) => {
            if (!n || n < 1) return '?';
            const romanMap = [
                [1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'],
                [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'],
                [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']
            ];
            let num = n;
            let out = '';
            for (const [value, numeral] of romanMap) {
                while (num >= value) {
                    out += numeral;
                    num -= value;
                }
            }
            return out || '?';
        };

        for (const art of articles) {
            html += _renderBillArticleRow(art, toRoman(art.article_number));
        }
        html += `</div>`;
    }

    // Expanded: effects + vote actions
    if (isExp) {
        html += renderBillExpandedContent(bill);
    }

    // Expand hint for floor bills \u2014 articles are visible; offer detail toggle
    if (!isExp && isFloorOrVoting && articles.length > 0) {
        html += `<div style="padding:0 14px 8px;font-family:var(--font-mono);font-size:calc(7px * var(--leg-scale, 1.755));color:var(--text-dim);">&#9656; click to expand effects &amp; vote actions</div>`;
    }

    // President's Desk: sign/veto controls inline so the president doesn't
    // have to detour to laws.html to act on a bill that passed the floor.
    if (bill.status === 'president_desk') {
        const deadlineTick = bill.president_desk_deadline || '?';
        if (isPresidentParty) {
            html += `<div class="leg-vote-row" style="border-top:1px solid var(--border-main);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
                <div style="font-family:var(--font-mono);font-size:10px;color:var(--blue);">
                    The President must sign or veto this bill
                    <span style="color:var(--text-dim);margin-left:6px;">Auto-signs at tick ${deadlineTick} if no action taken</span>
                </div>
                <div style="display:flex;gap:6px;flex-wrap:wrap;">
                    <div class="leg-vote-btn leg-vote-btn--yes" onclick="event.stopPropagation();signBillFromLegislature('${bill.id}')">SIGN INTO LAW</div>
                    <div class="leg-vote-btn leg-vote-btn--no" onclick="event.stopPropagation();vetoBillFromLegislature('${bill.id}')">VETO</div>
                </div>
            </div>`;
        } else {
            html += `<div style="padding:8px 14px;font-family:var(--font-mono);font-size:10px;color:var(--blue);">Awaiting presidential action \u2014 auto-signs at tick ${deadlineTick}</div>`;
        }
    }

    html += `</div>`;
    return html;
}

let _presidentialActionLock = false;

// Shared runner for Sign / Veto — splits "action failed" from "refresh
// failed" so a successful DB write never shows an error toast just because
// the re-render hit a transient issue.
async function _runPresidentialAction(actionName, actionFn) {
    if (_presidentialActionLock || !isPresidentParty || !currentFaction) return;
    _presidentialActionLock = true;
    try {
        try {
            await actionFn();
        } catch (err) {
            console.error(`[Legislature] ${actionName} failed:`, err);
            alert(`Error ${actionName.toLowerCase()}: ` + (err?.message || 'Unknown error'));
            return;
        }
        try {
            await loadLegislatureData();
            const content = document.getElementById('gov-content');
            if (content) renderLegislatureTab(content);
        } catch (refreshErr) {
            // Action committed server-side; refresh stumbled. Log, don't
            // mislead the user — they can refresh manually if needed.
            console.warn(`[Legislature] ${actionName} succeeded but refresh failed:`, refreshErr);
        }
    } finally {
        _presidentialActionLock = false;
    }
}

async function signBillFromLegislature(billId) {
    if (!confirm('Sign this bill into law?')) return;
    return _runPresidentialAction('Sign', () => signPresidentialBill(_supabase, billId, currentFaction.id));
}
window.signBillFromLegislature = signBillFromLegislature;

async function vetoBillFromLegislature(billId) {
    const overrideSeats = Math.ceil((currentNation?.total_seats || GAME_CONFIG.TOTAL_SEATS) * GAME_CONFIG.VETO_OVERRIDE_THRESHOLD);
    if (!confirm(`VETO this bill?\n\nA veto override bill will be automatically created requiring ${overrideSeats} seats (\u2154 supermajority).\n\nProceed?`)) return;
    return _runPresidentialAction('Veto', () => vetoPresidentialBill(_supabase, billId, currentFaction.id));
}
window.vetoBillFromLegislature = vetoBillFromLegislature;

function renderBillExpandedContent(bill) {
    const articles = (bill.bill_articles || []).sort((a, b) => (a.article_number || 0) - (b.article_number || 0));

    }

    if (isFloor) {

        const myStance = myVote?.stance;

        html += `<div class="leg-vote-row">
            <div class="leg-vote-note">
                Bill passes: YES voters +2 momentum per article \u00B7 Bill fails: YES voters -2, NO voters +2
            </div>
            <div style="display:flex;gap:4px;flex-wrap:wrap;">`;

        if (myStance === 'yes' || myStance === 'accept') {

        } else {

        if (myStance === 'no' || myStance === 'reject') {
            html += `<div class="leg-vote-btn leg-vote-btn--no leg-vote-btn--active">VOTED NO</div>`;
        } else {
            html += `<div class="leg-vote-btn leg-vote-btn--no" onclick="event.stopPropagation();legCastVote('${bill.id}','no')">VOTE NO</div>`;
        }
        if (myStance === 'abstain') {
            html += `<div class="leg-vote-btn leg-vote-btn--abstain leg-vote-btn--active">ABSTAINED</div>`;
        } else {
            html += `<div class="leg-vote-btn leg-vote-btn--abstain" onclick="event.stopPropagation();legCastVote('${bill.id}','abstain')">ABSTAIN</div>`;
        }

        html += `</div></div>`;
    }

    // Committee stance (accept/reject for committee bills)
    if (isCommittee) {
        const myVote = (bill.bill_support || []).find(s => s.faction_id === currentFaction?.id);
        const myStance = myVote?.stance;

        html += `<div class="leg-vote-row">
            <div class="leg-vote-note">
                Support adds your seats to the bill's backing \u00B7 Moves to floor when majority support reached
            </div>
            <div style="display:flex;gap:4px;flex-wrap:wrap;">`;
        if (myStance === 'accept') {
            html += `<div class="leg-vote-btn leg-vote-btn--yes leg-vote-btn--active">SUPPORTING</div>`;
        } else {
            html += `<div class="leg-vote-btn leg-vote-btn--yes" onclick="event.stopPropagation();legCastVote('${bill.id}','accept')">SUPPORT</div>`;
        }
        if (myStance === 'reject') {
            html += `<div class="leg-vote-btn leg-vote-btn--no leg-vote-btn--active">OPPOSING</div>`;
        } else {
            html += `<div class="leg-vote-btn leg-vote-btn--no" onclick="event.stopPropagation();legCastVote('${bill.id}','reject')">OPPOSE</div>`;
        }
        html += `</div></div>`;
    }

    // Link to full bill page
    html += `<div style="margin-top:8px;text-align:right;">
        <span class="leg-bill-link" onclick="event.stopPropagation();window.location.href='bill.html?id=${bill.id}'">
            View full bill &amp; negotiate \u2192
        </span>
    </div>`;

    html += `</div>`;
    return html;
}

let _legVoteLock = false;

async function legCastVote(billId, stance) {
    if (_legVoteLock || !currentFaction) return;
    _legVoteLock = true;
    try {
        const mySeats = currentFaction.seats || 0;
        const { error } = await _supabase.from('bill_support').upsert({
            bill_id: billId,
            faction_id: currentFaction.id,
            stance: stance,
            seat_count: mySeats
        }, { onConflict: 'bill_id,faction_id' });
        if (error) throw error;

        // Refresh data and re-render
        await loadLegislatureData();
        const content = document.getElementById('gov-content');
        if (content) renderLegislatureTab(content);
    } catch (err) {
        console.error('[Legislature] Vote failed:', err);
        alert('Vote failed: ' + (err.message || 'Unknown error'));
    } finally {
        _legVoteLock = false;
    }
}

function renderBillsList() {
    const el = document.getElementById('leg-right');
    if (!el || !_legData) return;
    const { committee, floor, frozen, presidentDesk = [], resolved, activeLaws, totalSeats, majority } = _legData;
    const totalActive = committee.length + floor.length + frozen.length + presidentDesk.length;
    const nationName = currentNation?.name || 'Nation';

    let html = '';

    // Filter bar
    html += `<div class="ga-panel leg-bills-toolbar">
        <span class="ga-panel-title">BILLS & LAWS OF ${escapeHtml(nationName.toUpperCase())}</span>
        <div class="leg-bills-toolbar__filters">`;
    const filters = [
        { id: 'active', label: 'ACTIVE BILLS', color: 'var(--orange)', count: totalActive },
        { id: 'resolved', label: 'RESOLVED', color: 'var(--green)', count: resolved.length },
        { id: 'laws', label: 'ALL LAWS', color: 'var(--blue)', count: activeLaws.length },
    ];
    for (const f of filters) {
        const isActive = _legFilter === f.id;
        html += `<div class="leg-filter-btn${isActive ? ' active' : ''}" data-filter="${f.id}" style="--filter-color:${f.color};">
            <span style="width:5px;height:5px;background:${isActive ? '#000' : f.color};display:inline-block;"></span>
            ${f.label}
        </div>`;
    }
    html += `<div style="width:1px;height:20px;background:var(--border-main);margin:0 4px;"></div>
        <div class="leg-propose-btn" onclick="window.location.href='laws.html?propose=1'" title="$50k base + $20k per article">
            PROPOSE BILL <span class="ga-ap-badge" style="background:var(--amber-faint);color:var(--accent);border-color:var(--amber-border);">$50k + $20k/art</span>
        </div>
    </div></div>`;

    if (_legFilter === 'active') {
        // PRESIDENT'S DESK (presidential systems only) — surface at the top so
        // the president sees what's waiting for their signature without leaving
        // this page.
        if (presidentDesk.length > 0) {
            html += `<div style="font-family:var(--font-mono);font-size:8px;font-weight:700;letter-spacing:1.5px;color:var(--blue);padding:4px 0;">PRESIDENT'S DESK</div>`;
            for (const bill of presidentDesk) html += renderBillCard(bill, 'var(--blue)');
        }

        // IN COMMITTEE
        if (committee.length > 0) {
            html += `<div style="font-family:var(--font-mono);font-size:8px;font-weight:700;letter-spacing:1.5px;color:var(--orange);padding:4px 0;">IN COMMITTEE</div>`;
            for (const bill of committee) html += renderBillCard(bill, 'var(--orange)');
        }

        // ON THE FLOOR
        if (floor.length > 0) {
            html += `<div style="font-family:var(--font-mono);font-size:8px;font-weight:700;letter-spacing:1.5px;color:var(--green);padding:4px 0;">ON THE FLOOR</div>`;
            for (const bill of floor) html += renderBillCard(bill, 'var(--green)');
        }

        // FROZEN
        if (frozen.length > 0) {
            html += `<div style="font-family:var(--font-mono);font-size:8px;font-weight:700;letter-spacing:1.5px;color:var(--blue);padding:4px 0;">FROZEN (CARETAKER)</div>`;
            for (const bill of frozen) html += renderBillCard(bill, 'var(--blue)');
        }

        if (totalActive === 0) {
            html += `<div class="ga-panel" style="padding:40px 20px;text-align:center;">
                <div style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);">No active bills. Use PROPOSE BILL to introduce legislation.</div>
            </div>`;
        }
    } else if (_legFilter === 'resolved') {
        // Resolved bills
        if (resolved.length === 0) {
            html += `<div class="ga-panel" style="padding:40px 20px;text-align:center;">
                <div style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);font-style:italic;">No resolved bills yet.</div>
            </div>`;
        } else {
            for (const bill of resolved) {
                const party = bill.factions || {};
                const passed = bill.status === 'enacted' || bill.status === 'passed';
                const statusLabel = passed ? 'ENACTED' : bill.status === 'failed' ? 'FAILED' : bill.status.toUpperCase();
                const statusColor = passed ? 'var(--green)' : 'var(--red)';
                const yesVotes = bill.votes_for || 0;
                const noVotes = bill.votes_against || 0;
                const totalVotes = yesVotes + noVotes;
                const yesPct = totalVotes > 0 ? Math.round((yesVotes / totalSeats) * 100) : 0;

                html += `<div class="leg-bill-card" style="border-left:3px solid ${statusColor};cursor:pointer;" onclick="window.location.href='bill.html?id=${bill.id}'">
                    <div class="leg-bill-header">
                        <div>
                            <div style="display:flex;align-items:center;gap:6px;">
                                <span style="font-size:12px;font-weight:700;color:var(--text-bright);">${escapeHtml(bill.bill_name || 'Untitled')}</span>
                                <span class="ga-badge" style="color:${statusColor};background:${statusColor}0a;border:1px solid ${statusColor}25;">${statusLabel}</span>
                            </div>
                            <div style="font-family:var(--font-mono);font-size:8px;color:var(--text-dim);margin-top:1px;">
                                ${escapeHtml(party.faction_name || 'Unknown')} \u00B7 ${passed ? 'Passed' : 'Failed'} tick ${bill.passed_tick || '?'} \u00B7 ${yesVotes} YES / ${noVotes} NO
                            </div>
                        </div>
                        <div style="font-family:var(--font-mono);font-size:14px;font-weight:700;color:${statusColor};">${yesPct}%</div>
                    </div>
                </div>`;
            }
        }
    } else if (_legFilter === 'laws') {
        // Active laws
        if (activeLaws.length === 0) {
            html += `<div class="ga-panel" style="padding:40px 20px;text-align:center;">
                <div style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);font-style:italic;">No active laws.</div>
            </div>`;
        } else {
            for (const law of activeLaws) {
                const policy = law.policies || {};
                const policyName = policy.policy_name || policy.name || 'Unknown Law';

                // Extract effects
                let effectTags = '';
                const statEffects = policy.stat_effects || [];
                if (statEffects.length > 0) {
                    effectTags = statEffects.map(e => {
                        const isGood = (e.direction === 'up' && !STATS_LOWER_IS_BETTER.includes(e.stat_key))
                            || (e.direction === 'down' && STATS_LOWER_IS_BETTER.includes(e.stat_key));
                        const arrow = e.direction === 'up' ? '\u25B2' : '\u25BC';
                        const color = isGood ? 'var(--green)' : 'var(--red)';
                        return `<span class="ga-effect-tag" style="color:${color};border-color:${color}30;">${formatStatName(e.stat_key)} ${arrow}</span>`;
                    }).join('');
                } else if (policy.target_stat) {
                    const dir = (policy.stat_direction || 'UP').toLowerCase();
                    const isGood = (dir === 'up' && !STATS_LOWER_IS_BETTER.includes(policy.target_stat))
                        || (dir === 'down' && STATS_LOWER_IS_BETTER.includes(policy.target_stat));
                    const arrow = dir === 'up' ? '\u25B2' : '\u25BC';
                    const color = isGood ? 'var(--green)' : 'var(--red)';
                    effectTags = `<span class="ga-effect-tag" style="color:${color};border-color:${color}30;">${formatStatName(policy.target_stat)} ${arrow}</span>`;
                }

                html += `<div class="leg-law-card">
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <div>
                            <div style="font-size:11px;font-weight:700;color:var(--text-bright);">${escapeHtml(policyName)}</div>
                            ${policy.description ? `<div style="font-size:8px;color:var(--text-dim);margin-top:1px;">${escapeHtml(policy.description)}</div>` : ''}
                        </div>
                        <div style="font-family:var(--font-mono);font-size:7px;color:var(--text-dim);">Tick ${law.passed_tick || '?'}</div>
                    </div>
                    ${effectTags ? `<div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;">${effectTags}</div>` : ''}
                </div>`;
            }
        }
    }

    el.innerHTML = html;

    // Click handlers
    el.onclick = (e) => {
        const filterBtn = e.target.closest('.leg-filter-btn');
        if (filterBtn) {
            _legFilter = filterBtn.dataset.filter;
            renderBillsList();
            return;
        }
        const billCard = e.target.closest('.leg-bill-card');
        if (billCard && !e.target.closest('.leg-propose-btn')) {
            const billId = billCard.dataset.billId;
            _legExpandedBill = _legExpandedBill === billId ? null : billId;
            renderBillsList();
        }
    };
}

async function loadGovData() {
    try {
        // Refresh nation + tick
        const [freshNationRes, shardRes] = await Promise.all([
            _supabase.from('nations').select('*').eq('id', currentNation.id).single(),
            _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single(),
        ]);
        if (freshNationRes.data) currentNation = freshNationRes.data;
        if (shardRes.data?.current_tick) currentTick = shardRes.data.current_tick;

        // Invalidate subtab-local caches so a fresh gov load re-computes them.
        _budgetData = null;

        // Bust coalition cache to get fresh status
        qCacheBust('coalition_');

        // Parallel data fetch
        const [coalitionRes, ministriesRes, partiesRes, hogRes, adminRes] = await Promise.all([
            fetchActiveCoalition(_supabase, currentNation.id),
            _supabase.from('ministries').select('*, factions(id, faction_name, abbreviation, party_color)').eq('nation_id', currentNation.id).eq('is_active', true),
            _supabase.from('factions').select('id, faction_name, abbreviation, seats, party_color, party_logo, custom_logo_url, leader_first_name, leader_last_name, leader_age, leader_positive_traits, leader_negative_traits').eq('nation_id', currentNation.id).eq('faction_type', 'party'),
            _supabase.from('head_of_government').select('*, factions(id, faction_name, abbreviation, party_color)').eq('nation_id', currentNation.id).eq('active', true).maybeSingle(),
            _supabase.from('administrations').select('*').eq('nation_id', currentNation.id).is('ended_at_tick', null).order('created_at', { ascending: false }).limit(1).maybeSingle(),
        ]);

        // Presidential: fetch active president
        let president = null;
        if (isPresidential) {
            const { data } = await _supabase.from('presidents').select('*, factions(id, faction_name, abbreviation, party_color)').eq('nation_id', currentNation.id).eq('is_active', true).maybeSingle();
            president = data;
        }

        // Bug fix: the new UI path (renderGovSubtabs/renderGovContent/loadGovData)
        // never reaches refreshGovernmentUI, which is where presidentFactionId and
        // isPresidentParty used to be assigned. Without these, renderAdminCabinet's
        // NOMINATE branch (which gates on isPresidentParty) never fires and
        // presidents can't nominate from the new cabinet grid. Set them here so
        // every renderer that runs after loadGovData sees the right values.
        presidentFactionId = president?.faction_id || null;
        isPresidentParty = !!(presidentFactionId && currentFaction?.id === presidentFactionId);
        presidentData = president || null;

        const coalition = coalitionRes;
        const hog = hogRes.data;
        const loadedParties = partiesRes.data || [];

        // Detect PM party (robust: HOG → coalition lead → PM ministry → allocations)
        pmFactionId = getPMFactionIdFromContext(coalition, ministriesRes.data || [], hog);
        isPMParty = !!(currentFaction && pmFactionId && currentFaction.id === pmFactionId);

        // Load ministry action logs for active action detection + use counts
        activeMinistryActions = {};
        ministryActionUseCounts = {};
        try {
            const { data: actionLogs } = await _supabase.from('ministry_action_log')
                .select('ministry_key, action_key, processed, applied_at_tick, action_data')
                .eq('nation_id', currentNation.id);
            if (actionLogs) {
                for (const log of actionLogs) {
                    const countKey = log.ministry_key + ':' + log.action_key;
                    ministryActionUseCounts[countKey] = (ministryActionUseCounts[countKey] || 0) + 1;
                    if (!log.processed) {
                        const actionId = log.ministry_key + '-' + log.action_key;
                        if (log.action_data?.direction) {
                            activeMinistryActions[actionId] = log.action_data.direction;
                        } else {
                            activeMinistryActions[actionId] = true;
                        }
                    }
                }
            }
        } catch (_) { /* non-fatal — actions just won't show active state */ }

        // Auto-seed ministries only when the cabinet is genuinely empty.
        //
        // Prior bug: this block fired when `ministriesRes.data` was [], which is
        // also what supabase-js returns on a failed fetch (error set, data null,
        // `|| []` swallows it) or when every row sits with is_active=false from
        // a dissolved administration. Because `ministries` has no UNIQUE
        // constraint on (nation_id, ministry_key), the follow-up INSERT created
        // duplicate rows. Subsequent renders ran `.find(m => m.ministry_key === k)`
        // and often hit the empty ghost before the real appointment, so the
        // player saw the cabinet vacate itself after every appointment.
        let ministries = ministriesRes.data || [];
        if (!ministriesRes.error && ministries.length === 0 && coalition) {
            try {
                // Gate seeding behind a no-filter count — if any ministry row
                // exists for this nation (active or not), skip the seed and
                // surface the condition instead of creating duplicates.
                const { count: totalMinistryCount, error: countErr } = await _supabase.from('ministries')
                    .select('id', { count: 'exact', head: true })
                    .eq('nation_id', currentNation.id);
                // Strict equality with 0 (not falsy) so an errored count — which
                // returns null/undefined — does NOT slip past the guard and
                // trigger the very duplicate-row bug we're trying to avoid.
                if (!countErr && totalMinistryCount === 0) {
                    const leadPartyId = coalition.lead_party_id || (coalition.party_ids || [])[0];
                    if (leadPartyId) {
                        const SEED_KEYS = [
                            ['interior', 'Minister of the Interior'], ['foreign', 'Minister of Foreign Affairs'],
                            ['defense', 'Minister of Defense'], ['finance', 'Minister of Finance'],
                            ['education', 'Minister of Education'], ['healthcare', 'Minister of Health'],
                            ['labor', 'Minister of Labor'], ['justice', 'Minister of Justice'],
                            ['trade', 'Minister of Trade'], ['energy', 'Minister of Energy'],
                            ['transportation', 'Minister of Transportation'],
                        ];
                        if (!isPresidential) {
                            SEED_KEYS.unshift(['prime_minister', 'Prime Minister']);
                        }
                        const rows = SEED_KEYS.map(([key, name]) => ({
                            nation_id: currentNation.id, ministry_key: key, ministry_name: name,
                            party_id: leadPartyId, is_active: true,
                        }));
                        const { data: seeded } = await _supabase.from('ministries').insert(rows).select();
                        if (seeded) ministries = seeded;
                    }
                }
            } catch (seedErr) { console.warn('[Gov] Ministry auto-seed failed:', seedErr.message); }
        }

        // Set legacy globals so existing window.fireMinister etc. still work
        ministryData = ministries;
        coalitionData = coalition;
        allParties = loadedParties;

        // Attach the next scheduled election tick to the coalition object
        // whenever we're in caretaker mode, so renderAdminActions can show
        // the correct countdown. The alternate render path in
        // renderGovernmentPage does the same on its own fetched copy —
        // both paths mutate the object that _govData.coalition points to.
        if (coalition && coalition.status === 'caretaker') {
            const { data: nextEl } = await _supabase
                .from('elections')
                .select('election_tick')
                .eq('nation_id', currentNation.id)
                .eq('status', 'scheduled')
                .order('election_tick', { ascending: true })
                .limit(1)
                .maybeSingle();
            if (nextEl) coalition._earlyElectionTick = nextEl.election_tick;
        }

        // Reconcile the admin row's identity fields with primary tables.
        // president_name / president_party_id / president_party_name on
        // administrations are historical snapshots that can drift —
        // override with live values from `presidents` and `head_of_government`
        // before exposing to render code so the Administrative subtab
        // never displays stale leadership.
        const reconciledAdmin = adminRes.data ? { ...adminRes.data } : null;
        if (reconciledAdmin) {
            if (hog) {
                reconciledAdmin.pm_party_id = hog.faction_id;
                reconciledAdmin.pm_party_name = hog.factions?.faction_name || reconciledAdmin.pm_party_name;
                const livePmName = [hog.first_name, hog.last_name].filter(Boolean).join(' ').trim();
                if (livePmName) reconciledAdmin.prime_minister = livePmName;
            }
            if (president) {
                reconciledAdmin.president_party_id = president.faction_id;
                reconciledAdmin.president_party_name = president.factions?.faction_name || reconciledAdmin.president_party_name;
                const livePresName = [president.first_name, president.last_name].filter(Boolean).join(' ').trim();
                if (livePresName) reconciledAdmin.president_name = livePresName;
            }
        }

        _govData = {
            coalition,
            ministries: ministryData,
            parties: loadedParties,
            hog,
            president,
            admin: reconciledAdmin,
        };
    } catch (err) {
        console.error('[Government] loadGovData failed:', err);
        _govData = { coalition: null, ministries: [], parties: [], hog: null, president: null, admin: null };
    }
}

initPage('government', async (state) => {
    const { nation, faction } = state;
    currentNation = nation;
    currentFaction = faction;
    initGameConfigForNation(nation);

    if (nation?.name) {
        const { firstNames, lastNames } = getNationNames(nation.name);
        FIRST_NAMES_POOL = firstNames;
        LAST_NAMES_POOL = lastNames;
    }

    if (!nation) {
        document.getElementById('gov-content').innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-dim);font-family:var(--font-mono);font-size:10px;">No nation selected.</div>';
        return;
    }

    isPresidential = isGovernmentPresidential(nation);

    // Backfill head of state if missing — but ONLY for nations that
    // have never held a presidential election. Once a nation has any
    // row in `presidents`, the head_of_state_* columns are owned by
    // sync_nation_head_of_state (Fix B): NULL there means "vacant"
    // (post-impeachment, between elections), not "needs a random
    // placeholder". Without this gate we'd fabricate a fake president
    // every page load after an impeachment.
    const { count: presCount } = await _supabase.from('presidents')
        .select('id', { count: 'exact', head: true })
        .eq('nation_id', nation.id);
    const hasPresHistory = (presCount || 0) > 0;
    const hasValidHosAge = Number.isFinite(Number(nation.head_of_state_age)) && Number(nation.head_of_state_age) > 0;
    if (!hasPresHistory && (!nation.head_of_state_first_name || !nation.head_of_state_last_name || !hasValidHosAge)) {
        const { firstNames: hosFirstPool, lastNames: hosLastPool } = getNationNames(nation.name);
        const hosFirst = nation.head_of_state_first_name || hosFirstPool[Math.floor(Math.random() * hosFirstPool.length)];
        const hosLast = nation.head_of_state_last_name || hosLastPool[Math.floor(Math.random() * hosLastPool.length)];
        const hosAge = hasValidHosAge ? Number(nation.head_of_state_age) : (45 + Math.floor(Math.random() * 25));
        const { error } = await _supabase.from('nations').update({
            head_of_state_first_name: hosFirst, head_of_state_last_name: hosLast, head_of_state_age: hosAge
        }).eq('id', nation.id);
        if (!error) {
            currentNation.head_of_state_first_name = hosFirst;
            currentNation.head_of_state_last_name = hosLast;
            currentNation.head_of_state_age = hosAge;
        }
    }

    // Load current tick
    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    currentTick = shard?.current_tick || 0;

    // Render subtabs immediately, then load data and re-render
    renderGovSubtabs();
    renderGovContent(); // shows loading state

    await loadGovData();
    renderGovContent(); // re-renders with real data

    // Original government page code follows (preserved, disabled by the new UI above)
    return;
    await refreshGovernmentUI();
});


async function renderRevolutionBannerGov() {
    var nation = currentNation;
    if (!nation) return '';

    // Get current tick
    var shardRes = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    var currentTick = shardRes.data?.current_tick || 0;

    // Check for post-revolution celebration banner
    var revRes = await _supabase.from('event_log')
        .select('fired_at_tick, description_used')
        .eq('nation_id', nation.id).eq('event_name', 'DEMOCRATIC_REVOLUTION')
        .order('fired_at_tick', { ascending: false }).limit(1).maybeSingle();
    if (revRes.data && (currentTick - revRes.data.fired_at_tick) <= 5) {
        var electionTick = revRes.data.fired_at_tick + 3;
        var ticksUntilElection = Math.max(0, electionTick - currentTick);
        var h = '<div class="revolution-complete-banner">';
        h += '<div class="revolution-icon">&#x1F3DB;</div>';
        h += '<div class="revolution-title">Revolution in the Streets!</div>';
        h += '<div class="revolution-subtitle">' + revRes.data.description_used + '</div>';
        if (ticksUntilElection > 0) {
            h += '<div><span class="revolution-tag">Emergency Elections in ' + ticksUntilElection + ' tick' + (ticksUntilElection !== 1 ? 's' : '') + '</span><span class="revolution-tag">Democracy Established</span></div>';
        } else {
            h += '<div><span class="revolution-tag">Democracy Established</span><span class="revolution-tag">Elections Complete</span></div>';
        }
        h += '</div>';
        return h;
    }

    return '';
}

// ==================== PARLIAMENTARY EMERGENCY (requires Emergency Powers Act) ====================

function renderParliamentaryEmergency(activeHOG) {
    if (!currentNation || isPresidential) return '';
    if (!currentNation.emergency_powers_act) return '';
    // Only the ruling faction (PM's party) can declare
    const isRuling = currentFaction && (
        (currentNation.ruling_faction_id && currentFaction.id === currentNation.ruling_faction_id) ||
        (activeHOG?.factions?.id === currentFaction.id) ||
        (activeHOG?.faction_id === currentFaction.id)
    );
    if (!isRuling) return '';

    // Check if emergency is already active
    const hasActiveEmergency = currentNation._activeParliamentaryEmergency;

    if (hasActiveEmergency) {
        return `
            <div class="info-block" style="border-left: 3px solid var(--red); margin-bottom: 16px;">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
                    <span style="font-size:1.2rem;">⚠️</span>
                    <strong style="color:var(--red);">NATIONAL EMERGENCY IN EFFECT</strong>
                </div>
                <div style="font-size:0.75rem;color:var(--text-secondary);margin-bottom:10px;">
                    Bills can bypass legislative votes. Stability, freedom index, and judicial independence are eroding each tick.
                </div>
                <button class="ministry-btn purge" style="padding:8px 20px;font-size:0.75rem;" onclick="endParliamentaryEmergency()" id="end-emergency-btn">
                    End Emergency
                </button>
            </div>
        `;
    }

    const ap = currentFaction?.action_points || 0;
    const cost = EO_CONFIG.NATIONAL_EMERGENCY_AP || 4;
    const canDeclare = ap >= cost;

    return `
        <div class="info-block" style="border-left: 3px solid var(--amber); margin-bottom: 16px;">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
                <span style="font-size:1.2rem;">🏛️</span>
                <strong>Emergency Powers Available</strong>
                <span style="font-size:0.65rem;color:var(--text-muted);margin-left:auto;">via Emergency Powers Act</span>
            </div>
            <div style="font-size:0.75rem;color:var(--text-secondary);margin-bottom:10px;">
                Declare a national emergency to bypass legislative votes on bills. While active: state apparatus -1/tick, public_approval -0.5/tick, unrest +0.5/tick.
            </div>
            <button class="ministry-btn${canDeclare ? '' : ' disabled'}" style="padding:8px 20px;font-size:0.75rem;" onclick="${canDeclare ? 'declareParliamentaryEmergency()' : ''}" id="declare-emergency-btn" ${canDeclare ? '' : 'disabled'}>
                Declare Emergency 
            </button>
        </div>
    `;
}

window.declareParliamentaryEmergency = async function() {
    if (!confirm(`Declare a National Emergency?\n\nWhile active:\n• Bills bypass legislative votes\n• State Apparatus -1/tick\n• Public Approval -0.5/tick\n• Unrest +0.5/tick\n\n`)) return;

    const btn = document.getElementById('declare-emergency-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Declaring...'; }

    try {
        const result = await issueNationalEmergency(_supabase, currentNation.id, currentFaction.id);
        if (result?.success) {
            location.reload();
        } else {
            alert(result?.error || 'Failed to declare emergency.');
            if (btn) { btn.disabled = false; btn.innerHTML = `Declare Emergency `; }
        }
    } catch (err) {
        alert('Error: ' + (err.message || err));
        if (btn) { btn.disabled = false; btn.innerHTML = `Declare Emergency `; }
    }
};

window.endParliamentaryEmergency = async function() {
