            ` : pmPartyId ? `
                <div style="font-size: 0.85rem; color: #888;">Waiting for ${allParties.find(p => p.id === pmPartyId)?.faction_name || 'the PM\'s party'} to form the government.</div>
            ` : `
                <div style="font-size: 0.85rem; color: #888;">Assign a Prime Minister to enable government formation.</div>
            `}
        </div>
    `;

    const chatEl = document.getElementById('formation-chat-messages');
    if (chatEl) chatEl.scrollTop = chatEl.scrollHeight;
}

function renderFormationChatMessage(msg) {
    const isMine = msg.faction_id === currentFaction.id;
    const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return `
        <div class="chat-msg ${isMine ? 'mine' : ''}">
            <div class="chat-msg-author">${msg.faction_name}</div>
            <div class="chat-msg-bubble">${escapeHtml(msg.message)}</div>
            <div class="chat-msg-time">${time}</div>
        </div>`;
}

// ===== Realtime Subscriptions =====

function setupFormationRealtimeSubscriptions(formationId) {
    formationRealtimeChannel = _supabase.channel('formation-' + formationId)
        .on('postgres_changes', {
            event: 'UPDATE', schema: 'public', table: 'government_formations',
            filter: `id=eq.${formationId}`
        }, (payload) => {
            const f = payload.new;
            updateMinistriesFromRealtime(f.ministry_assignments || {}, f.minister_names || {});
            refreshFormButton(f.ministry_assignments || {});
        })
        .on('postgres_changes', {
            event: '*', schema: 'public', table: 'government_formation_support',
            filter: `formation_id=eq.${formationId}`
        }, async () => {
            const { data: supports } = await _supabase
                .from('government_formation_support').select('faction_id, supports').eq('formation_id', formationId);
            formationSupportMap = {};
            (supports || []).forEach(s => {
                if (activeFormationPartyIds.includes(s.faction_id)) formationSupportMap[s.faction_id] = s.supports;
            });
            refreshSupportBar();
            refreshFormButton();
        })
        .on('postgres_changes', {
            event: 'INSERT', schema: 'public', table: 'government_formation_chat',
            filter: `formation_id=eq.${formationId}`
        }, (payload) => {
            const msg = payload.new;
            if (formationChatMessages.find(m => m.id === msg.id)) return;
            formationChatMessages.push(msg);
            const chatEl = document.getElementById('formation-chat-messages');
            if (chatEl) {
                const empty = chatEl.querySelector('.chat-empty');
                if (empty) empty.remove();
                chatEl.insertAdjacentHTML('beforeend', renderFormationChatMessage(msg));
                chatEl.scrollTop = chatEl.scrollHeight;
            }
        })
        .subscribe();
}

function updateMinistriesFromRealtime(assignments, ministerNames) {
    FORMATION_MINISTRIES.forEach(m => {
        if (m.inactive) return;
        const sel = document.getElementById(`ministry-select-${m.key}`);
        if (sel && sel !== document.activeElement) sel.value = assignments[m.key] || '';

        const row = document.getElementById(`ministry-row-${m.key}`);
        if (row) {
            let nameEl = row.querySelector('.ministry-minister-name');
            const minister = ministerNames[m.key];
            if (minister) {
                const nameStr = `${minister.first_name} ${minister.last_name}, Age ${minister.age}`;
                if (nameEl) nameEl.textContent = nameStr;
                else row.querySelector('.ministry-info').insertAdjacentHTML('beforeend', `<div class="ministry-minister-name">${nameStr}</div>`);
            } else if (nameEl) { nameEl.remove(); }
        }
    });
}

function refreshSupportBar() {
    const bar = document.getElementById('support-bar');
    if (!bar) return;

    const coalitionParties = allParties.filter(p => activeFormationPartyIds.includes(p.id));
    const iAmInCoalition = activeFormationPartyIds.includes(currentFaction.id);

    const supportHTML = coalitionParties.map(p => {
        const s = formationSupportMap[p.id];
        const isYou = p.id === currentFaction.id;
        let statusHTML = s === true
            ? `<span class="support-status yes">✓ SUPPORTING</span>`
            : `<span class="support-status pending">— NON-SUPPORTING</span>`;

        let toggleHTML = '';
        if (isYou) {
            const currentlySupports = formationSupportMap[currentFaction.id] === true;
            toggleHTML = currentlySupports
                ? `<button class="support-toggle-btn btn-withdraw" onclick="toggleFormationSupport(false)">Withdraw Support</button>`
                : `<button class="support-toggle-btn btn-support" onclick="toggleFormationSupport(true)">Support</button>`;
        }

        return `
            <div class="support-row">
                <span class="support-party-name">${p.faction_name}${isYou ? '<span class="you-tag">(You)</span>' : ''}</span>
                <div style="display:flex; align-items:center; gap:12px;">${statusHTML}${toggleHTML}</div>
            </div>`;
    }).join('');

    bar.innerHTML = `
        <div class="support-bar-title">Coalition Support</div>
        ${supportHTML}
        ${iAmInCoalition ? '<div class="support-exclusive-note">You may only support one coalition at a time. Supporting this one will withdraw support from any other.</div>' : ''}
    `;
}

async function refreshFormButton(assignments) {
    if (!assignments) {
        const { data: f } = await _supabase.from('government_formations').select('ministry_assignments').eq('id', activeFormationId).single();
        assignments = f?.ministry_assignments || {};
    }

    const coalitionParties = allParties.filter(p => activeFormationPartyIds.includes(p.id));
    const coalitionSeats = getCoalitionSeats(activeFormationPartyIds);
    const meetsThreshold = coalitionSeats >= GAME_CONFIG.MAJORITY_SEATS;

    const pmPartyId = assignments.prime_minister || null;
    const isPMParty = pmPartyId === currentFaction.id;
    const allCoalitionSupport = coalitionParties.every(p => formationSupportMap[p.id] === true);
    const allAssigned = FORMATION_MINISTRIES.filter(m => !m.inactive).every(m => assignments[m.key]);
    const canForm = isPMParty && allCoalitionSupport && allAssigned && meetsThreshold;

    const blockers = [];
    if (!allAssigned) blockers.push('All ministries must be assigned.');
    if (!allCoalitionSupport) {
        const supportCount = coalitionParties.filter(p => formationSupportMap[p.id] === true).length;
        blockers.push(`${supportCount}/${coalitionParties.length} coalition members supporting.`);
    }
    if (!meetsThreshold) blockers.push(`Coalition has ${coalitionSeats} seats (need ${GAME_CONFIG.MAJORITY_SEATS}).`);

    const section = document.getElementById('form-gov-section');
    if (!section) return;

    if (isPMParty) {
        section.innerHTML = `
            <button class="form-gov-btn" id="form-gov-btn" onclick="formGovernment()" ${canForm ? '' : 'disabled'}>Form Government</button>
            ${!canForm ? `<div style="font-size: 0.8rem; color: #888; margin-top: 8px;">${blockers.join(' ')}</div>` : ''}`;
    } else if (pmPartyId) {
        section.innerHTML = `<div style="font-size: 0.85rem; color: #888;">Waiting for ${allParties.find(p => p.id === pmPartyId)?.faction_name || 'the PM\'s party'} to form the government.</div>`;
    } else {
        section.innerHTML = `<div style="font-size: 0.85rem; color: #888;">Assign a Prime Minister to enable government formation.</div>`;
    }
}

// ===== Actions: Ministry change, Support, Chat, Form =====

async function onMinistryChange(ministryKey, partyId) {
    if (!activeFormationId) return;
    try {
        if (ministryKey === 'prime_minister') {
            const { data: formation } = await _supabase.from('government_formations')
                .select('ministry_assignments, minister_names')
                .eq('id', activeFormationId).single();
            const assignments = formation?.ministry_assignments || {};
            const ministerNames = formation?.minister_names || {};

            if (partyId) {
                assignments.prime_minister = partyId;
                const { data: party } = await _supabase.from('factions')
                    .select('leader_first_name, leader_last_name, leader_age')
                    .eq('id', partyId).single();
                if (party?.leader_first_name) {
                    ministerNames.prime_minister = {
                        first_name: party.leader_first_name,
                        last_name: party.leader_last_name,
                        age: party.leader_age
                    };
                } else {
                    delete ministerNames.prime_minister;
                }
            } else {
                delete assignments.prime_minister;
                delete ministerNames.prime_minister;
            }

            const { error } = await _supabase.from('government_formations')
                .update({ ministry_assignments: assignments, minister_names: ministerNames })
                .eq('id', activeFormationId);
            if (error) throw error;
            refreshFormButton(assignments);
        } else {
            const { data, error } = await _supabase.rpc('assign_ministry', {
                p_formation_id: activeFormationId, p_ministry_key: ministryKey, p_party_id: partyId || ''
            });
            if (error) throw error;
            if (!data.success) alert(data.message);
        }
    } catch (err) { alert('Error: ' + err.message); }
}

async function toggleFormationSupport(supports) {
    if (!activeFormationId) return;

    // DB trigger now handles exclusive support automatically —
    // no need for client-side loop to withdraw from other coalitions

    try {
        const { data, error } = await _supabase.rpc('toggle_formation_support', {
            p_formation_id: activeFormationId, p_faction_id: currentFaction.id, p_supports: supports
        });
        if (error) throw error;
        if (!data.success) alert(data.message);
    } catch (err) { alert('Error: ' + err.message); }
}

async function sendFormationChatMessage() {
    const input = document.getElementById('formation-chat-input');
    if (!input) return;
    const message = input.value.trim();
    if (!message || !activeFormationId) return;

    input.value = '';
    input.disabled = true;
    try {
        const { error } = await _supabase.from('government_formation_chat').insert({
            formation_id: activeFormationId, faction_id: currentFaction.id,
            faction_name: currentFaction.faction_name, message: message
        });
        if (error) throw error;
    } catch (err) { alert('Error sending message: ' + err.message); input.value = message; }
    input.disabled = false;
    input.focus();
}

// ===== Edit Coalition Composition =====

function toggleEditCoalition() {
    const panel = document.getElementById('edit-coalition-panel');
    if (!panel) return;
    const showing = panel.style.display !== 'none';
    panel.style.display = showing ? 'none' : 'block';
    if (!showing) {
        editSelectedParties = [...activeFormationPartyIds];
        document.querySelectorAll('#edit-party-grid .party-checkbox-item').forEach(el => {
            const pid = el.getAttribute('data-party-id');
            const inCoalition = editSelectedParties.includes(pid);
            el.classList.toggle('checked', inCoalition);
            el.querySelector('.party-check-box').textContent = inCoalition ? '✓' : '';
        });
        updateEditSeatPreview();
    }
    document.getElementById('edit-coalition-btn').textContent = showing ? 'Edit Coalition' : 'Cancel Edit';
}

function toggleEditParty(el, partyId) {
    const idx = editSelectedParties.indexOf(partyId);
    if (idx > -1) {
        editSelectedParties.splice(idx, 1);
        el.classList.remove('checked');
        el.querySelector('.party-check-box').textContent = '';
    } else {
        editSelectedParties.push(partyId);
        el.classList.add('checked');
        el.querySelector('.party-check-box').textContent = '✓';
    }
    updateEditSeatPreview();
}

function updateEditSeatPreview() {
    const previewSeats = document.getElementById('edit-preview-seats');
    const previewPct = document.getElementById('edit-preview-pct');
    const previewThreshold = document.getElementById('edit-preview-threshold');
    if (!previewSeats) return;

    const seats = getCoalitionSeats(editSelectedParties);
    const pct = totalLegislatureSeats ? Math.round((seats / totalLegislatureSeats) * 100) : 0;
    const meets = seats >= GAME_CONFIG.MAJORITY_SEATS;

    previewSeats.textContent = seats;
    previewSeats.className = 'preview-seats ' + (meets ? 'meets' : 'below');
    previewPct.textContent = pct;
    previewThreshold.textContent = meets ? `✓ Meets ${GAME_CONFIG.MAJORITY_SEATS}-seat threshold` : `— needs ${GAME_CONFIG.MAJORITY_SEATS} seats`;
    previewThreshold.style.color = meets ? 'var(--green)' : 'var(--text-secondary)';
}

async function saveCoalitionEdit(formationId) {
    if (!editSelectedParties.includes(currentFaction.id)) {
        alert('Your party must remain in the coalition.');
        return;
    }
    const editSeats = getCoalitionSeats(editSelectedParties);
    if (editSeats < GAME_CONFIG.MAJORITY_SEATS) {
        alert(`Your coalition does not meet the ${GAME_CONFIG.MAJORITY_SEATS}-seat threshold. Add more parties.`);
        return;
    }

    const removedParties = activeFormationPartyIds.filter(pid => !editSelectedParties.includes(pid));

    try {
        for (const pid of removedParties) {
            await _supabase.from('government_formation_support')
                .delete().eq('formation_id', formationId).eq('faction_id', pid);
        }

        const { data: formation } = await _supabase
            .from('government_formations').select('ministry_assignments, minister_names').eq('id', formationId).single();
        const assignments = formation?.ministry_assignments || {};
        const ministerNames = formation?.minister_names || {};
        let changed = false;
        for (const [key, val] of Object.entries(assignments)) {
            if (removedParties.includes(val)) {
                assignments[key] = null;
                delete ministerNames[key];
                changed = true;
            }
        }

        const updatePayload = { party_ids: editSelectedParties };
        if (changed) {
            updatePayload.ministry_assignments = assignments;
            updatePayload.minister_names = ministerNames;
        }

        const { error } = await _supabase.from('government_formations')
            .update(updatePayload).eq('id', formationId);
        if (error) throw error;

        activeFormationPartyIds = [...editSelectedParties];
        await openFormation(formationId);
    } catch (err) { alert('Error updating coalition: ' + err.message); }
}

async function retractProposal(formationId) {
    if (!confirm('Are you sure you want to retract this coalition proposal? This will remove it for all parties.')) return;
    try {
        await _supabase.from('government_formation_support').delete().eq('formation_id', formationId);
        await _supabase.from('government_formation_chat').delete().eq('formation_id', formationId);
        const { error } = await _supabase.from('government_formations').delete().eq('id', formationId).eq('proposed_by', currentFaction.id);
        if (error) throw error;

        if (formationRealtimeChannel) { _supabase.removeChannel(formationRealtimeChannel); formationRealtimeChannel = null; }
        activeFormationId = null;
        activeFormationPartyIds = [];
        await loadFormationsList();
    } catch (err) { alert('Error retracting proposal: ' + err.message); }
}

// ===== Form Government =====

async function formGovernment() {
    if (_formingInProgress) return;
    if (!activeFormationId) return;
    if (!confirm('Form this government? This will finalize all ministry assignments.')) return;
    _formingInProgress = true;
    try {
        // First call the existing form_government RPC to validate and set status
        const { data: formResult, error: formError } = await _supabase.rpc('form_government', {
            p_formation_id: activeFormationId, p_caller_faction_id: currentFaction.id
        });
        if (formError) throw formError;
        if (!formResult.success) { alert(formResult.message); return; }

        // Compute ministry baselines from current nation state
        const { data: freshNation } = await _supabase.from('nations').select('*').eq('id', currentNation.id).single();
        const ministryBaselines = {};
        FORMATION_MINISTRIES.forEach(m => {
            if (!m.inactive) {
                ministryBaselines[m.key] = buildMinistryBaselines(m.key, freshNation || currentNation);
            }
        });

        // Try the new atomic RPC
        const { data: finalizeResult, error: finalizeError } = await _supabase.rpc('finalize_government_formation', {
            p_formation_id: activeFormationId,
            p_caller_faction_id: currentFaction.id,
            p_ministry_baselines: ministryBaselines
        });

        if (finalizeError) {
            // RPC might not be deployed yet — fall back to sequential client-side operations
            const rpcUnavailable = /finalize_government_formation/i.test(finalizeError.message || '') || finalizeError.code === 'PGRST202';
            if (!rpcUnavailable) throw finalizeError;

            console.warn('finalize_government_formation RPC unavailable; falling back to sequential operations');
            await formGovernmentFallback(ministryBaselines);
        } else if (finalizeResult && !finalizeResult.success) {
            alert(finalizeResult.message);
            return;
        }

        alert(finalizeResult?.message || formResult.message);
        if (formationRealtimeChannel) { _supabase.removeChannel(formationRealtimeChannel); formationRealtimeChannel = null; }
        sessionStorage.removeItem('nationhood_state');
        location.reload();
    } catch (err) { alert('Error: ' + err.message); }
    finally { _formingInProgress = false; }
}

// Fallback for when finalize_government_formation RPC is not deployed
async function formGovernmentFallback(ministryBaselines) {
    await dissolveCoalition(_supabase, currentNation.id, activeFormationId);

    await _supabase.from('nations')
        .update({ failed_formation_attempts: 0 })
        .eq('id', currentNation.id);

    await _supabase.from('government_formations')
        .update({ status: 'cancelled' })
        .eq('nation_id', currentNation.id)
        .eq('status', 'active')
        .neq('id', activeFormationId);

    await _supabase.from('bills')
        .update({ status: 'failed' })
        .eq('nation_id', currentNation.id)
        .eq('status', 'frozen');

    const { data: formation } = await _supabase
        .from('government_formations')
        .select('ministry_assignments, minister_names')
        .eq('id', activeFormationId)
        .single();

    const assignments = formation?.ministry_assignments || {};
    const ministerNames = formation?.minister_names || {};
    const pmPartyId = assignments.prime_minister;

    for (const [ministryKey, partyId] of Object.entries(assignments)) {
        if (!partyId || ministryKey === 'prime_minister') continue;
        const minister = ministerNames[ministryKey];
        if (!minister) continue;

        const ministryPayload = {
            party_id: partyId,
            minister_first_name: minister.first_name,
            minister_last_name: minister.last_name,
            minister_age: minister.age,
            minister_approval: 50,
            stat_baselines: ministryBaselines[ministryKey] || {}
        };

        const { data: existing } = await _supabase.from('ministries')
            .select('id').eq('nation_id', currentNation.id)
            .eq('ministry_key', ministryKey).eq('is_active', true)
            .maybeSingle();

        if (existing) {
            await _supabase.from('ministries').update(ministryPayload).eq('id', existing.id);
        } else {
            await _supabase.from('ministries').insert({
                nation_id: currentNation.id,
                ministry_key: ministryKey,
                ministry_name: FORMATION_MINISTRIES.find(m => m.key === ministryKey)?.name || ministryKey,
                is_active: true,
                ...ministryPayload
            });
        }
    }

    // Auto-generate Head of State if missing
    const hasValidHosAge = Number.isFinite(Number(currentNation.head_of_state_age)) && Number(currentNation.head_of_state_age) > 0;
    if (!currentNation.head_of_state_first_name || !currentNation.head_of_state_last_name || !hasValidHosAge) {
        const HOS_FIRST = ['Alejandro','Camila','Diego','Valentina','Mateo','Isabela','Sebastián','Luca','Andrés','Gabriel','Joaquín','Mariana','Carlos','Tomas','Rafael','Edwin','Emilio','Catalina','Fernando','Renata'];
        const HOS_LAST = ['Velasco','Mendoza','Guerrero','Salazar','Castillo','Herrera','Morales','Ríos','Delgado','Espinoza','Guzmán','Navarro','Córdoba','Echeverría','Pacheco','Montero','Aguilar','Valenzuela','Carrasco','Ibarra'];
        const hosFirst = currentNation.head_of_state_first_name || HOS_FIRST[Math.floor(Math.random() * HOS_FIRST.length)];
        const hosLast = currentNation.head_of_state_last_name || HOS_LAST[Math.floor(Math.random() * HOS_LAST.length)];
        const hosAge = hasValidHosAge ? Number(currentNation.head_of_state_age) : (45 + Math.floor(Math.random() * 25));
        try {
            await _supabase.from('nations').update({
                head_of_state_first_name: hosFirst, head_of_state_last_name: hosLast, head_of_state_age: hosAge
            }).eq('id', currentNation.id);
        } catch (hosErr) { console.warn('Could not set head of state:', hosErr); }
    }

    if (pmPartyId) {
        const { data: shard } = await _supabase.from('shard')
            .select('current_tick, current_date').eq('name', 'Alpha Shard').single();

        const { data: fullNation } = await _supabase.from('nations').select('*').eq('id', currentNation.id).single();
        const { data: allFactions } = await _supabase.from('factions')
            .select('id, faction_name, seats, approval_rating')
            .eq('nation_id', currentNation.id).eq('faction_type', 'party');
        const { data: newFormation } = await _supabase.from('government_formations')
            .select('party_ids, ministry_assignments, proposed_by')
            .eq('id', activeFormationId).single();
        if (newFormation) {
            newFormation.lead_party_id = newFormation.ministry_assignments?.prime_minister || newFormation.proposed_by;
        }
        if (fullNation && newFormation) {
            const { data: recentElection } = await _supabase.from('elections')
                .select('election_tick').eq('nation_id', currentNation.id)
                .eq('status', 'completed').order('election_tick', { ascending: false }).limit(1).maybeSingle();
            const endReason = (recentElection && (shard?.current_tick - recentElection.election_tick) <= 8)
                ? 'election_loss' : 'new_coalition';

            const coalitionFactions = (allFactions || []).filter(f =>
                (newFormation.party_ids || []).includes(f.id));
            const govApproval = coalitionFactions.length > 0
                ? Math.round(coalitionFactions.reduce((sum, f) => sum + (f.approval_rating ?? 40), 0) / coalitionFactions.length)
                : null;

            try {
                await rolloverAdministration(_supabase, currentNation.id, fullNation, endReason, newFormation, allFactions || [], shard?.current_tick || 0, shard?.current_date || '', govApproval);
            } catch (adminErr) { console.error('Administration lifecycle error (non-fatal):', adminErr); }
        }

        try {
            await autoAppointPartyLeaderAsPM(_supabase, currentNation.id, pmPartyId, shard?.current_tick || 0);
        } catch (pmErr) { console.error('Auto-appoint PM failed:', pmErr); }
    }
}

// ==================== MINISTRY STAT BREAKDOWN ====================

/**
 * Build a collapsible stat breakdown panel for a ministry card.
 * Shows each stat's current value, delta since appointment, and a colored
 * indicator showing whether the stat moved in a good or bad direction.
 *
 * @param {string} ministryKey - e.g. 'finance', 'healthcare'
 * @param {object} [ministry] - ministry row (with stat_baselines) for delta display
 * @returns {string} HTML string (empty if no stats mapped)
 */
function renderMinistryStatBreakdown(ministryKey, ministry) {
    const stats = MINISTRY_TO_STATS[ministryKey];
    if (!stats || stats.length === 0 || !currentNation) return '';

    const panelId = 'mstat-' + ministryKey;
    const baselines = ministry?.stat_baselines || {};
    let rows = '';
    let deltaSum = 0;
    let deltaCount = 0;

    for (const statKey of stats) {
        const value = Number(currentNation[statKey] ?? 50);
        const rounded = Math.round(value * 10) / 10;
        const sign = statDirectionSign(statKey);

        if (sign === 0) continue; // skip neutral stats

        const baseline = baselines[statKey] != null ? Number(baselines[statKey]) : null;
        const hasDelta = baseline !== null;

        // Delta in the "good" direction: positive = improvement, negative = worsening
        const rawDelta = hasDelta ? value - baseline : 0;
        const goodDelta = rawDelta * sign; // normalized: positive = good
        const absDelta = Math.abs(rawDelta);
        const deltaRounded = Math.round(absDelta * 10) / 10;

        if (hasDelta) {
            deltaSum += goodDelta;
            deltaCount++;
        }

        // Delta display: ↑3.2 or ↓1.5 or —
        let deltaStr = '—';
        let deltaCls = 'flat';
        if (hasDelta && absDelta >= 0.1) {
            const arrow = goodDelta > 0 ? '↑' : '↓';
            deltaStr = arrow + deltaRounded;
            deltaCls = goodDelta > 0 ? 'good' : 'bad';
        } else if (hasDelta) {
            deltaStr = '—';
            deltaCls = 'flat';
        }

        // Colored dot: green = improving, red = worsening, muted = flat
        const dotCls = !hasDelta || absDelta < 0.1 ? 'flat' : goodDelta > 0 ? 'good' : 'bad';

        const label = formatStatName(statKey);
        const baselineRounded = hasDelta ? Math.round(baseline * 10) / 10 : '?';
        const directionWord = sign === 1 ? 'Higher is better' : 'Lower is better';
        const tooltip = hasDelta
            ? 'Was ' + baselineRounded + '% when appointed. Now ' + rounded + '%. ' + directionWord + '.'
            : 'No baseline recorded. ' + directionWord + '.';

        rows += '<div class="ministry-stat-row" title="' + escapeHtml(tooltip) + '">'
            + '<span class="stat-name">' + escapeHtml(label) + '</span>'
            + '<span class="stat-val">' + rounded + '%</span>'
            + '<span class="stat-delta ' + deltaCls + '">' + deltaStr + '</span>'
            + '<span class="stat-dot ' + dotCls + '">●</span>'
            + '</div>';
    }

    // Overall trend line
    let trendText = 'No data';
    let trendCls = 'flat';
    if (deltaCount > 0) {
        const avgDelta = deltaSum / deltaCount;
        if (Math.abs(avgDelta) < 0.5) {
            trendText = 'Approval holding steady';
            trendCls = 'flat';
        } else if (avgDelta > 0) {
            trendText = 'Approval trending upward';
            trendCls = 'good';
        } else {
            trendText = 'Approval trending downward';
            trendCls = 'bad';
        }
    }

    return '<button class="ministry-stats-toggle" onclick="event.stopPropagation();this.classList.toggle(\'open\');document.getElementById(\'' + panelId + '\').classList.toggle(\'open\')">'
        + '<span class="chevron">▶</span> Performance Since Appointed'
        + '</button>'
        + '<div class="ministry-stats-panel" id="' + panelId + '">'
        + '<div class="ministry-stat-row ministry-stat-header">'
        + '<span class="stat-name">Stat</span><span class="stat-val">Now</span><span class="stat-delta">Change</span><span class="stat-dot"></span></div>'
        + rows
        + '<div class="ministry-stats-footer ' + trendCls + '">Overall: ' + trendText + '</div>'
        + '</div>';
}

// ==================== CABINET ====================

function renderCabinet(ministries, coalition) {
    if (!ministries || ministries.length === 0) {
        // Presidential systems always use their own rendering (with Nominate buttons)
        if (isPresidential) {
            const presKeys = MINISTRY_KEYS_CABINET.filter(k => k !== 'prime_minister');
            const cards = presKeys.map(key => renderPresidentialMinistryCard(key, null)).join('');
            return `<div class="ministry-grid">${cards}</div>`;
        }
        if (coalition && coalition.ministry_allocations) {
            const cards = Object.entries(coalition.ministry_allocations)
                .filter(([key]) => key !== 'prime_minister')
                .map(([key, partyId]) => {
                    const party = partyData.find(p => p.party_id === partyId);
                    return `<div class="ministry-card vacant" style="padding:10px 12px;"><div class="ministry-title">${MINISTRY_NAMES[key] || key}</div><div class="minister-name" style="color:var(--text-muted);">To be appointed</div><div class="minister-details"><span class="minister-party">${party?.party_name || 'Unknown'}</span></div></div>`;
                }).join('');
            return `<div class="ministry-grid">${cards}</div>`;
        }
        if (isAutocracy) {
            const cards = MINISTRY_KEYS_CABINET.map(key => {
                const requests = ministryRequests.filter(r => r.ministry_key === key);
                return `<div class="ministry-card vacant" style="padding:10px 12px;"><div class="ministry-title">${MINISTRY_NAMES[key]}</div><div class="minister-name" style="color:var(--text-muted);">Vacant</div>${requests.length > 0 ? `<span class="request-badge">${requests.length}</span>` : ''}${renderMinistryActions(key, false, requests, null)}</div>`;
            }).join('');
            return `<div class="ministry-grid">${cards}</div>`;
        }
        return '<div class="info-block" style="text-align:center;color:var(--text-secondary);padding:30px;">No cabinet has been formed yet.</div>';
    }

    const ministryMap = {};
    ministries.forEach(m => { ministryMap[m.ministry_key] = m; });

    if (isAutocracy) {
        const cards = MINISTRY_KEYS_CABINET.map(key => {
            const m = ministryMap[key];
            const isFilled = m && m.minister_first_name;
            const requests = ministryRequests.filter(r => r.ministry_key === key);

            if (isFilled) {
                const partyName = m.factions?.faction_name || 'Unknown';
                const mColor = getPartyColorById(m.party_id);
                const mLogo = getPartyLogoById(m.party_id);
                const mCustomLogo = getPartyCustomLogoById(m.party_id);
                const mLogoHtml = mLogo || mCustomLogo ? `<span style="display:inline-flex;vertical-align:middle;margin-right:5px;">${getPartyLogoHTML({ customLogoUrl: mCustomLogo, iconKey: mLogo, size: 16, color: mColor })}</span>` : '';
                const appr = m.minister_approval ?? 50;
                const apprCls = appr < 35 ? 'low' : appr < 50 ? 'mid' : 'high';
                return `<div class="ministry-card" style="border-top:3px solid ${mColor};padding:10px 12px;"><div class="ministry-title">${m.ministry_name || MINISTRY_NAMES[key]}</div><div class="minister-name">${escapeHtml(m.minister_first_name)} ${escapeHtml(m.minister_last_name)}</div><div class="minister-details">Age ${m.minister_age || '?'} • <span class="minister-party" style="color:${mColor};">${mLogoHtml}${escapeHtml(partyName)}</span></div><div class="minister-approval">Approval: <span class="${apprCls}">${Math.round(appr)}%</span></div>${renderMinistryStatBreakdown(key, m)}${requests.length > 0 ? `<span class="request-badge">${requests.length}</span>` : ''}${renderMinistryActions(key, true, requests, m)}</div>`;
            } else {
                return `<div class="ministry-card vacant" style="padding:10px 12px;"><div class="ministry-title">${MINISTRY_NAMES[key]}</div><div class="minister-name" style="color:var(--text-muted);">Vacant</div>${requests.length > 0 ? `<span class="request-badge">${requests.length}</span>` : ''}${renderMinistryActions(key, false, requests, null)}</div>`;
            }
        }).join('');
        return `<div class="ministry-grid">${cards}</div>`;
    }

    // === PRESIDENTIAL SYSTEM ===
    if (isPresidential) {
        const presKeys = MINISTRY_KEYS_CABINET.filter(k => k !== 'prime_minister');
        const cards = presKeys.map(key => renderPresidentialMinistryCard(key, ministryMap[key])).join('');
        return `<div class="ministry-grid">${cards}</div>`;
    }

    const isCaretaker = coalition && coalition.status === 'caretaker';
    const pmMinistry = ministries.find(m => m.ministry_key === 'prime_minister');
    const pmFilled = pmMinistry && pmMinistry.minister_first_name && pmMinistry.minister_last_name;
    const isPMParty = currentFaction && coalition && currentFaction.id === coalition.lead_party_id;
    const canAppoint = isPMParty && pmFilled && !isCaretaker;

    const demKeys = MINISTRY_KEYS_CABINET.filter(function(k) { return k !== 'prime_minister'; });
    const demCards = demKeys.map(function(key) {
        var m = ministryMap[key];
        var vacant = !m || !m.minister_first_name || !m.minister_last_name;
        var title = MINISTRY_NAMES[key] || key;

        if (vacant) {
            var appointBtn = canAppoint ? '<div class="ministry-actions"><button class="ministry-btn assign" onclick="openAssignModal(\'' + key + '\')">✦ Appoint</button></div>' : '';
            return '<div class="ministry-card vacant">'
                + '<div class="ministry-header"><div class="ministry-title">' + title + '</div></div>'
                + '<div class="ministry-body"><div class="minister-name" style="color:var(--text-muted);">Vacant</div>' + appointBtn + '</div></div>';
        }

        var partyName = m.factions?.faction_name || 'Unknown';
        var mColor = getPartyColorById(m.party_id);
        var mLogo = getPartyLogoById(m.party_id);
        var mCustomLogo = getPartyCustomLogoById(m.party_id);
        var mLogoHtml = (mLogo || mCustomLogo) ? '<span style="display:inline-flex;vertical-align:middle;margin-right:5px;">' + getPartyLogoHTML({ customLogoUrl: mCustomLogo, iconKey: mLogo, size: 16, color: mColor }) + '</span>' : '';
        var name = m.minister_first_name + ' ' + m.minister_last_name;
        var isMyMinistry = currentFaction && m.party_id === currentFaction.id;
        var resignBtn = (isMyMinistry && !isCaretaker) ? '<div class="ministry-actions"><button class="ministry-btn purge" onclick="event.stopPropagation();resignMinistry(\'' + m.ministry_key + '\')">Resign Ministry</button></div>' : '';
        var appr = m.minister_approval ?? 50;
        var apprCls = appr < 35 ? 'low' : appr < 50 ? 'mid' : 'high';

        // Fire button: visible to PM party (parliamentary) — not for own party resignations
        var fireBtn = '';
        if (isPMParty && !isCaretaker && !isMyMinistry) {
            var apCost = (currentFaction?.action_points || 0) < 1;
            fireBtn = '<div class="ministry-actions"><button class="ministry-btn dismiss" onclick="event.stopPropagation();fireMinister(\'' + m.ministry_key + '\')"' + (apCost ? ' disabled title="Need 1 AP"' : '') + '>Dismiss Minister <span class="ap-cost">1 AP</span></button></div>';
        }

        return '<div class="ministry-card" style="border-top-color:' + mColor + ';">'
            + '<div class="ministry-header"><div class="ministry-title">' + (m.ministry_name || title) + '</div></div>'
            + '<div class="ministry-body">'
            + '<div class="minister-name">' + escapeHtml(name) + '</div>'
            + '<div class="minister-details">' + (m.minister_age ? 'Age ' + m.minister_age + ' &bull; ' : '') + '<span class="minister-party" style="color:' + mColor + ';">' + mLogoHtml + escapeHtml(partyName) + '</span></div>'
            + '<div class="minister-approval">Approval: <span class="' + apprCls + '">' + Math.round(appr) + '%</span></div>'
            + renderMinistryStatBreakdown(key, m)
            + resignBtn + fireBtn + '</div></div>';
    }).join('');
    return '<div class="ministry-grid">' + demCards + '</div>';
}

function renderMinistryActions(key, isFilled, requests, ministry) {
    if (!isAutocracy) return '';
    const ap = currentFaction?.action_points || 0;
    const myRequest = requests.find(r => r.faction_id === currentFaction?.id);
    const isMyMinistry = isFilled && ministry && currentFaction && ministry.party_id === currentFaction.id;
    let html = '<div class="ministry-actions">';

    if (isRulingFaction) {
        if (isFilled) {
            html += `<button class="ministry-btn purge" onclick="purgeMinister('${key}')" ${ap < 1 ? 'disabled title="Need 1 AP"' : ''}>⛔ Purge <span class="ap-cost">1 AP</span></button>`;
        } else {
            html += `<button class="ministry-btn assign" onclick="openAssignModal('${key}')">✦ Assign</button>`;
        }
        html += '</div>';
        if (requests.length > 0) {
            html += '<div class="request-list">';
            requests.forEach(r => {
                html += `<div class="request-item"><span class="request-item-party">${r.factions?.faction_name || 'Unknown'} requests this</span><div class="request-item-actions"><button class="req-btn deny" onclick="denyRequest('${r.id}')">✕ Deny</button></div></div>`;
            });
            html += '</div>';
        }
    } else if (isMyMinistry) {
        html += `<button class="ministry-btn purge" onclick="resignMinistry('${key}')">📋 Resign Ministry</button>`;
        html += '</div>';
    } else {
        const totalMyRequests = ministryRequests.filter(r => r.faction_id === currentFaction?.id).length;
        if (myRequest) {
            html += `<button class="ministry-btn unrequest" onclick="unrequestMinistry('${myRequest.id}')">↩ Unrequest <span class="ap-cost">0 AP</span></button>`;
        } else {
            const canRequest = totalMyRequests < 2 && ap >= 1;
            html += `<button class="ministry-btn request" onclick="requestMinistry('${key}')" ${canRequest ? '' : 'disabled'}>📋 Request <span class="ap-cost">1 AP</span></button>`;
            if (totalMyRequests >= 2) html += '<span class="max-requests-note">Max 2 requests</span>';
            else if (ap < 1) html += '<span class="max-requests-note">Need 1 AP</span>';
        }
        html += '</div>';
    }

    return html;
}

function renderPresidentialMinistryCard(key, ministry) {

    const isPending = ministry && ministry.confirmation_status === 'pending' && ministry.pending_minister;

    if (isFilled) {
        const partyName = ministry.factions?.faction_name || 'Unknown';
        const pmColor = getPartyColorById(ministry.party_id);
        const pmLogo = getPartyLogoById(ministry.party_id);
        const pmCustomLogo = getPartyCustomLogoById(ministry.party_id);
        const pmLogoHtml = pmLogo || pmCustomLogo ? `<span style="display:inline-flex;vertical-align:middle;margin-right:5px;">${getPartyLogoHTML({ customLogoUrl: pmCustomLogo, iconKey: pmLogo, size: 16, color: pmColor })}</span>` : '';
        const appr = ministry.minister_approval ?? 50;
        const apprCls = appr < 35 ? 'low' : appr < 50 ? 'mid' : 'high';

        // Fire button for President's party
        let fireBtn = '';
        if (isPresidentParty) {
            const apCost = (currentFaction?.action_points || 0) < 1;
            fireBtn = `<div class="ministry-actions"><button class="ministry-btn dismiss" onclick="event.stopPropagation();fireMinister('${key}')"${apCost ? ' disabled title="Need 1 AP"' : ''}>Dismiss Minister <span class="ap-cost">1 AP</span></button></div>`;
        }

        // Resign button for the minister's own party (not the president's party — they use Dismiss)
        let resignBtn = '';
        const isMyMinistry = currentFaction && ministry.party_id === currentFaction.id && !isPresidentParty;
        if (isMyMinistry) {
            resignBtn = `<div class="ministry-actions"><button class="ministry-btn purge" onclick="event.stopPropagation();resignMinistry('${key}')">Resign Ministry</button></div>`;
        }

        return `<div class="ministry-card" style="border-top:3px solid ${pmColor};padding:10px 12px;">
            <div class="ministry-header"><div class="ministry-title">${ministry.ministry_name || MINISTRY_NAMES[key]}</div></div>
            <div class="minister-name">${ministry.minister_first_name} ${ministry.minister_last_name}</div>
            <div class="minister-details">Age ${ministry.minister_age || '?'} • <span class="minister-party" style="color:${pmColor};">${pmLogoHtml}${partyName}</span></div>
            <div class="minister-approval">Approval: <span class="${apprCls}">${Math.round(appr)}%</span></div>
            ${renderMinistryStatBreakdown(key, ministry)}
            ${resignBtn}${fireBtn}
        </div>`;
    }

    if (isPending) {
        const pm = ministry.pending_minister;
        const nomineeParty = allParties.find(p => p.id === pm.party_id);
        return `<div class="ministry-card" style="border-top-color:var(--amber);padding:10px 12px;">
            <div class="ministry-title">${MINISTRY_NAMES[key]}</div>
            <div class="minister-name" style="color:var(--amber);">${pm.first_name} ${pm.last_name}</div>
            <div class="minister-details">Age ${pm.age || '?'} • <span class="minister-party">${nomineeParty?.faction_name || 'Unknown'}</span></div>
            <div style="margin-top:8px;padding:4px 10px;background:var(--amber-faint);border:1px solid var(--amber-border);border-radius:3px;font-family:var(--font-mono);font-size:8.5px;font-weight:600;color:var(--amber);text-align:center;text-transform:uppercase;letter-spacing:0.06em;">Awaiting Senate Confirmation</div>
        </div>`;
    }

    // Vacant slot — president can nominate
    let actionHtml = '';
    if (isPresidentParty) {
        actionHtml = `<div class="ministry-actions">
            <button class="ministry-btn assign" onclick="openNominateModal('${key}')">Nominate</button>
        </div>`;
    }

    return `<div class="ministry-card vacant" style="padding:10px 12px;">
        <div class="ministry-title">${MINISTRY_NAMES[key]}</div>
        <div class="minister-name" style="color:var(--text-muted);">Vacant</div>
        ${actionHtml}
    </div>`;
}

// ==================== PRESIDENTIAL NOMINATION (Modal) ====================

function openNominateModal(ministryKey) {
    assignMinistryKey = ministryKey;
    selectedCandidate = null;
    document.getElementById('assign-confirm-btn').disabled = true;
    document.getElementById('assign-confirm-btn').textContent = 'Nominate for Confirmation';
    document.getElementById('assign-modal-title').textContent = 'Nominate — ' + (MINISTRY_NAMES[ministryKey] || ministryKey);

    // Generate one candidate per party
    generatedCandidates = allParties
        .map(party => ({
            partyId: party.id,
            partyName: party.faction_name,
            firstName: FIRST_NAMES_POOL[Math.floor(Math.random() * FIRST_NAMES_POOL.length)],
            lastName: LAST_NAMES_POOL[Math.floor(Math.random() * LAST_NAMES_POOL.length)],
            age: 35 + Math.floor(Math.random() * 31)
        }));

    document.getElementById('assign-candidates').innerHTML = generatedCandidates.map((c, i) => {
        const isPres = c.partyId === presidentFactionId;
        const candColor = getPartyColorById(c.partyId);
        const candLogo = getPartyLogoById(c.partyId);
        const candCustomLogo = getPartyCustomLogoById(c.partyId);
        const candLogoHtml = candLogo || candCustomLogo ? `<span style="display:inline-flex;vertical-align:middle;margin-right:4px;">${getPartyLogoHTML({ customLogoUrl: candCustomLogo, iconKey: candLogo, size: 14, color: candColor })}</span>` : '';
        return `<div class="candidate-card" id="cand-${i}" onclick="selectCandidate(${i})" style="border-left:3px solid ${candColor};"><div><div class="candidate-name">${escapeHtml(c.firstName)} ${escapeHtml(c.lastName)}</div><div class="candidate-details">Age ${c.age} • <span class="candidate-party-tag ${isPres ? 'ruling' : 'other'}">${candLogoHtml}${escapeHtml(c.partyName)}</span></div></div>${isPres ? '<span class="ruling-label">PRESIDENT</span>' : ''}</div>`;
    }).join('');

    document.getElementById('assign-modal').classList.add('active');
}

async function confirmPresidentialNomination() {
    if (!selectedCandidate || !assignMinistryKey) return;
    try {
        await nominateMinister(_supabase, currentNation.id, currentFaction.id, assignMinistryKey, selectedCandidate);
        closeAssignModal();
        alert('Nomination submitted — parliament will vote on confirmation.');
        await renderGovernmentPage();
    } catch (e) {
        console.error('Nomination error:', e);
        alert('Error: ' + e.message);
    }
}

// ==================== CONFIRM DISPATCHER ====================

function handleConfirmMinister() {
    if (_coalitionAppointMode) {
        confirmAppointment();
    } else if (isPresidential) {
        confirmPresidentialNomination();
    } else {
        confirmAssign();
    }
}

async function confirmAssign() {
    if (!selectedCandidate || !assignMinistryKey) return;
    try {
        // Validate vacancy before executing (prevents double-click / race condition)
        const { data: freshMinistry } = await _supabase.from('ministries')
            .select('minister_first_name')
            .eq('nation_id', currentNation.id).eq('ministry_key', assignMinistryKey)
            .maybeSingle();
        if (freshMinistry && freshMinistry.minister_first_name) {
            alert('This ministry has already been filled.');
            closeAssignModal();
            await renderGovernmentPage();
            return;
        }

        const existing = ministryData.find(m => m.ministry_key === assignMinistryKey);

        if (existing) {
            const { error } = await _supabase.from('ministries').update({
                party_id: selectedCandidate.partyId,
                minister_first_name: selectedCandidate.firstName,
                minister_last_name: selectedCandidate.lastName,
                minister_age: selectedCandidate.age,
                minister_approval: 50,
                stat_baselines: buildMinistryBaselines(assignMinistryKey, currentNation),
                is_active: true
            }).eq('id', existing.id);
            if (error) throw error;
        } else {
            const { error } = await _supabase.from('ministries').insert({
                nation_id: currentNation.id,
                ministry_key: assignMinistryKey,
                ministry_name: MINISTRY_NAMES[assignMinistryKey] || assignMinistryKey,
                party_id: selectedCandidate.partyId,
                minister_first_name: selectedCandidate.firstName,
                minister_last_name: selectedCandidate.lastName,
                minister_age: selectedCandidate.age,
                minister_approval: 50,
                stat_baselines: buildMinistryBaselines(assignMinistryKey, currentNation),
                is_active: true
            });
            if (error) throw error;
        }

        // +3% approval to the receiving party
        const receivingParty = allParties.find(p => p.id === selectedCandidate.partyId);
        if (receivingParty) {
            const newApproval = Math.min(100, (receivingParty.approval_rating || 40) + 3);
            await _supabase.from('factions').update({ approval_rating: newApproval })
                .eq('id', selectedCandidate.partyId);
        }

        await _supabase.from('ministry_requests').delete()
            .eq('nation_id', currentNation.id).eq('ministry_key', assignMinistryKey);

        // Log minister appointment for Regime Log
        await _supabase.from('campaign_actions').insert({
            party_id: currentFaction.id,
            nation_id: currentNation.id,
            action_type: 'assign_minister',
            tick_performed: currentTick,
            result: {
                minister_name: `${selectedCandidate.firstName} ${selectedCandidate.lastName}`,
                ministry_key: assignMinistryKey,
                party_name: selectedCandidate.partyName
            }
        });

        // If assigning PM, also update head_of_government, government_formations, and roll over administration
        if (assignMinistryKey === 'prime_minister') {
            // Deactivate any current PM
            await _supabase.from('head_of_government')
                .update({ active: false })
                .eq('nation_id', currentNation.id)
                .eq('active', true);

            // Upsert new PM record (nation_id has unique constraint)
            await _supabase.from('head_of_government').upsert({
                nation_id: currentNation.id,
                faction_id: selectedCandidate.partyId,
                first_name: selectedCandidate.firstName,
                last_name: selectedCandidate.lastName,
                age: selectedCandidate.age,
                active: true
            }, { onConflict: 'nation_id' });

            // Update government_formations.ministry_assignments.prime_minister so
            // coalition.lead_party_id correctly reflects the new PM's party
            try {
                const { data: activeGovFormation } = await _supabase.from('government_formations')
                    .select('id, ministry_assignments')
                    .eq('nation_id', currentNation.id)
                    .in('status', ['formed', 'caretaker'])
                    .order('formed_at', { ascending: false })
                    .limit(1)
                    .maybeSingle();
                if (activeGovFormation) {
                    const updatedAssignments = { ...(activeGovFormation.ministry_assignments || {}), prime_minister: selectedCandidate.partyId };
                    await _supabase.from('government_formations')
                        .update({ ministry_assignments: updatedAssignments })
                        .eq('id', activeGovFormation.id);
                }
            } catch (gfErr) { console.warn('Failed to update government_formations PM assignment:', gfErr); }

            const { data: freshNation } = await _supabase.from('nations').select('*').eq('id', currentNation.id).single();
            const coalition = await fetchActiveCoalition(_supabase, currentNation.id);
            if (freshNation && coalition) {
                try {
                    await rolloverAdministration(
                        _supabase,
                        currentNation.id,
                        freshNation,
                        'pm_replaced',
                        coalition,
                        allParties,
                        currentTick,
                        '',
                        null
                    );
                } catch (adminErr) {
                    throw new Error(`Administration lifecycle failed on PM assign: ${adminErr.message || adminErr}`);
                }
            }
        }


        closeAssignModal();
        alert('✦ ' + selectedCandidate.firstName + ' ' + selectedCandidate.lastName + ' appointed to ' + (MINISTRY_NAMES[assignMinistryKey] || assignMinistryKey) + '!');
        await renderGovernmentPage();
    } catch (e) {
        console.error('Assign error:', e);
        alert('Error: ' + e.message);
    }
}

// ==================== CLAIM POWER (Autocracy — No Ruler) ====================

async function claimPower() {
    if (!currentFaction || !currentNation) return;
    if (!isAutocracy) return;

    // Race condition guard: re-check that no one claimed power in the meantime
    const { data: freshNation } = await _supabase
        .from('nations')
        .select('ruling_faction_id')
        .eq('id', currentNation.id)
        .single();

    if (freshNation?.ruling_faction_id) {
        alert('Another faction has already claimed power. Refreshing...');
        await renderGovernmentPage();
        return;
    }

    if (!confirm(
        'SEIZE POWER?\n\n' +
        'As the first faction to act, you will claim uncontested control of the government.\n\n' +
        'You will become the Ruling Faction and receive:\n' +
        '- Control of the Head of State\n' +
        '- A Prime Minister from your faction\n' +
        '- All cabinet ministries staffed with your appointees\n' +
        '- Loyalty set to 80\n\n' +
        'Cost: 0 AP\n\nProceed?'
    )) return;

    const btn = document.getElementById('claim-power-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'SEIZING POWER...'; }

    try {
        const { data: shard } = await _supabase
            .from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const tick = shard?.current_tick || 0;

        // 1. Set this faction as the ruling faction
        await _supabase.from('nations')
            .update({ ruling_faction_id: currentFaction.id })
            .eq('id', currentNation.id);

        // 2. Set faction loyalty to 80
        await _supabase.from('factions')
            .update({ loyalty: 80 })
            .eq('id', currentFaction.id);

        // 3. Generate and insert ministry rows for all positions
        const ministryInserts = MINISTRY_KEYS_CABINET.map(key => ({
            nation_id: currentNation.id,
            ministry_key: key,
            ministry_name: MINISTRY_NAMES[key] || key,
            party_id: currentFaction.id,
            minister_first_name: FIRST_NAMES_POOL[Math.floor(Math.random() * FIRST_NAMES_POOL.length)],
            minister_last_name: LAST_NAMES_POOL[Math.floor(Math.random() * LAST_NAMES_POOL.length)],
            minister_age: 35 + Math.floor(Math.random() * 31),
            is_active: true
        }));

        const { error: ministryError } = await _supabase
            .from('ministries').insert(ministryInserts);
        if (ministryError) throw ministryError;

        // 4. Create head_of_government record for the PM
        const pmInsert = ministryInserts.find(m => m.ministry_key === 'prime_minister');
        if (pmInsert) {
            await _supabase.from('head_of_government')
                .update({ active: false })
                .eq('nation_id', currentNation.id)
                .eq('active', true);

            await _supabase.from('head_of_government').upsert({
                nation_id: currentNation.id,
                faction_id: currentFaction.id,
                first_name: pmInsert.minister_first_name,
                last_name: pmInsert.minister_last_name,
                age: pmInsert.minister_age,
                active: true
            }, { onConflict: 'nation_id' });
        }

        // 5. Log to campaign_actions
        await _supabase.from('campaign_actions').insert({
            party_id: currentFaction.id,
            nation_id: currentNation.id,
            action_type: 'claim_power',
            tick_performed: tick,
            result: {
                faction_name: currentFaction.faction_name,
                ministries_assigned: MINISTRY_KEYS_CABINET.length,
                pm_name: pmInsert ? `${pmInsert.minister_first_name} ${pmInsert.minister_last_name}` : null
            }
        });

        // 6. Create initial administration record (non-blocking)
        try {
            const hosName = (currentNation.head_of_state_first_name && currentNation.head_of_state_last_name)
                ? `${currentNation.head_of_state_first_name} ${currentNation.head_of_state_last_name}`
                : null;
            const adminName = pmInsert
                ? `${pmInsert.minister_last_name} Administration`
                : `${currentNation.head_of_state_last_name || currentFaction.faction_name} Administration`;

            await _supabase.from('administrations').insert({
                nation_id: currentNation.id,
                admin_name: adminName,
                head_of_state: hosName,
                prime_minister: pmInsert ? `${pmInsert.minister_first_name} ${pmInsert.minister_last_name}` : null,
                pm_party_name: currentFaction.faction_name,
                pm_party_id: currentFaction.id,
                coalition_parties: [{ party_id: currentFaction.id, party_name: currentFaction.faction_name, seats: currentFaction.seats || 0 }],
                total_seats: currentFaction.seats || 0,
                government_type: CANONICAL_GOVERNMENT_TYPES.AUTOCRACY,
                started_at_tick: tick,
                started_at_date: tickToDate(tick)
            });
        } catch (adminErr) {
            console.warn('Administration record creation failed (non-blocking):', adminErr);
        }

        // 7. Update local state
        currentFaction.loyalty = 80;
        currentNation.ruling_faction_id = currentFaction.id;
        rulingFactionId = currentFaction.id;
        isRulingFaction = true;

        // 8. Clear cache and re-render
        sessionStorage.removeItem('nationhood_state');
        qCacheBust('coalition_');

        alert(
            'POWER SEIZED!\n\n' +
            `${currentFaction.faction_name} now controls the government.\n\n` +
            `Prime Minister: ${pmInsert?.minister_first_name} ${pmInsert?.minister_last_name}\n` +
            `All ${MINISTRY_KEYS_CABINET.length} cabinet positions filled.`
        );

        await renderGovernmentPage();

    } catch (error) {
        console.error('Claim power error:', error);
        alert('Error claiming power: ' + error.message);
        if (btn) { btn.disabled = false; btn.textContent = 'Seize Power'; }
    }
}

// ==================== PURGE MINISTER ====================

async function purgeMinister(ministryKey) {
    const ministry = ministryData.find(m => m.ministry_key === ministryKey);
    if (!ministry) return;

    if ((currentFaction?.action_points || 0) < 1) { alert('Not enough AP (need 1).'); return; }

    const partyName = ministry.factions?.faction_name || 'Unknown';
    const ministerName = ministry.minister_first_name + ' ' + ministry.minister_last_name;

    if (!confirm(
        '⛔ PURGE ' + ministerName + ' from ' + (MINISTRY_NAMES[ministryKey] || ministryKey) + '?\n\n' +
        'Cost: 1 AP\n\n' +
        'Scapegoat Effects:\n' +
        '• ' + partyName + ' loses 2–4 Loyalty and 1–2 Approval\n' +
        '• Your faction gains +4–5 Approval (decays over time)\n' +
        '• Nation: +1 Corruption, Stability shifts ±1–2\n\n' +
        'Proceed?'
    )) return;

    const apResult = await deductAP(_supabase, currentFaction.id, 1);
    if (!apResult.success) { alert('Not enough AP (need 1).'); return; }
    currentFaction.action_points = apResult.newAp;
    sessionStorage.removeItem('nationhood_state');

    try {
        const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const tick = shard?.current_tick || 0;

        const { data: recentPurges } = await _supabase
            .from('campaign_actions')
            .select('tick_performed')
            .eq('party_id', currentFaction.id)
            .eq('action_type', 'purge_minister')
            .gte('tick_performed', tick - 5);
        const purgeCount = (recentPurges || []).length;

        const loyaltyLoss = 2 + Math.floor(Math.random() * 3);
        const approvalLossPurged = 1 + Math.floor(Math.random() * 2);
        const stabilityRoll = 1 + Math.floor(Math.random() * 2);
        let approvalBoost = 4 + Math.floor(Math.random() * 2);
        let corruptionGain = 1;

        if (purgeCount === 1) {
            approvalBoost = Math.floor(approvalBoost / 2);
        } else if (purgeCount >= 2) {
            approvalBoost = 0;
            corruptionGain = 2;
        }

        const decayTicks = approvalBoost > 0 ? approvalBoost + 1 : 0;

        const { error: clearErr } = await _supabase.from('ministries').update({
            minister_first_name: null, minister_last_name: null, minister_age: null, party_id: null, minister_approval: 50, stat_baselines: null
        }).eq('id', ministry.id);
        if (clearErr) throw clearErr;

        // If purging the PM, also deactivate the head_of_government record
        // and close the current administration
        if (ministryKey === 'prime_minister') {
            await _supabase.from('head_of_government')
                .update({ active: false })
                .eq('nation_id', currentNation.id)
                .eq('active', true);

            const { data: fullNation } = await _supabase.from('nations').select('*').eq('id', currentNation.id).single();
            if (fullNation) {
                try {
                    await closeAdministration(_supabase, currentNation.id, fullNation, 'pm_replaced', tick, '', null);
                } catch (adminErr) {
                    throw new Error(`Administration lifecycle failed on PM purge: ${adminErr.message || adminErr}`);
                }
            }
        }

        const rulerApproval = currentFaction.approval_rating ?? 40;
        const newRulerApproval = Math.min(100, rulerApproval + approvalBoost);
        await _supabase.from('factions').update({
            approval_rating: newRulerApproval
        }).eq('id', currentFaction.id);
        currentFaction.approval_rating = newRulerApproval;

        if (ministry.party_id && ministry.party_id !== rulingFactionId) {
            const target = allParties.find(p => p.id === ministry.party_id);
            const currentLoyalty = target?.loyalty ?? 50;
            const currentApproval = target?.approval_rating ?? 50;
            await _supabase.from('factions').update({
                loyalty: Math.max(0, currentLoyalty - loyaltyLoss),
                approval_rating: Math.max(0, currentApproval - approvalLossPurged)
            }).eq('id', ministry.party_id);
        }

        const { data: nation } = await _supabase.from('nations').select('stability, corruption').eq('id', currentNation.id).single();
        const stability = nation?.stability ?? 50;
        const corruption = nation?.corruption ?? 50;

        let stabilityChange;
        if (purgeCount >= 2) {
            stabilityChange = -stabilityRoll;
        } else if (stability >= 50) {
            stabilityChange = -stabilityRoll;
        } else {
            stabilityChange = stabilityRoll;
        }

        await _supabase.from('nations').update({
            stability: Math.max(0, Math.min(100, stability + stabilityChange)),
            corruption: Math.min(100, corruption + corruptionGain)
        }).eq('id', currentNation.id);

        await _supabase.from('campaign_actions').insert({
            party_id: currentFaction.id,
            nation_id: currentNation.id,
            action_type: 'purge_minister',
            tick_performed: tick,
            result: {
                minister_name: ministerName,
                ministry_key: ministryKey,
                target_party: partyName,
                target_party_id: ministry.party_id,
                loyalty_loss: loyaltyLoss,
                approval_loss_target: approvalLossPurged,
                approval_boost: approvalBoost,
                decay_ticks_remaining: decayTicks,
                decay_rate: 1,
                stability_change: stabilityChange,
                corruption_gain: corruptionGain,
                purge_number: purgeCount + 1
            }
        });

        let resultMsg = '⛔ ' + ministerName + ' purged!\n\n';
        resultMsg += partyName + ': -' + loyaltyLoss + ' Loyalty, -' + approvalLossPurged + ' Approval\n';
        if (approvalBoost > 0) {
            resultMsg += 'Your Approval: +' + approvalBoost + ' (will decay over ' + decayTicks + ' ticks)\n';
        } else {
            resultMsg += 'Your Approval: No boost (too many recent purges)\n';
        }
        resultMsg += 'Nation: ' + (stabilityChange >= 0 ? '+' : '') + stabilityChange + ' Stability, +' + corruptionGain + ' Corruption';
        if (purgeCount === 1) resultMsg += '\n\n⚠️ Diminishing returns: 2nd purge in 6 ticks — boost halved.';
        if (purgeCount >= 2) resultMsg += '\n\n🚨 Regime fatigue: 3rd+ purge in 6 ticks — no boost, double corruption.';

        alert(resultMsg);

        await renderGovernmentPage();
    } catch (e) {
        console.error('Purge error:', e);
        alert('Error: ' + e.message);
    }
}

                ⚡ Vote of No Confidence <span class="ap-cost">${GAME_CONFIG.NO_CONFIDENCE_AP_COST} AP</span>
            </button>

        </div>`;
}

async function fileNoConfidence() {
    if (!currentFaction || !currentNation || !coalitionData) return;

    // Must have at least 1 seat
    const mySeatsCheck = allPartySeats[currentFaction.id] || currentFaction.seats || 0;
    if (mySeatsCheck < 1) {
        alert('Need at least 1 seat in the legislature to file a vote of no confidence.');
        return;
    }

    // Cannot file no-confidence against a caretaker government
    if (coalitionData.status === 'caretaker') {
        alert('Cannot file a vote of no confidence against a caretaker government. Elections are already scheduled.');
        return;
    }

    if ((currentFaction.action_points || 0) < GAME_CONFIG.NO_CONFIDENCE_AP_COST) {
        alert(`Not enough AP. You need ${GAME_CONFIG.NO_CONFIDENCE_AP_COST} AP (you have ${currentFaction.action_points || 0}).`);
        return;
    }

    // Check: must not be in coalition
    if (coalitionData.party_ids.includes(currentFaction.id)) {
        alert('Only opposition parties can file a vote of no confidence.');
        return;
    }

    // Check: no existing pending/floor no-confidence bill for this nation
    const { data: existingMotion } = await _supabase
        .from('bills')
        .select('id')
        .eq('nation_id', currentNation.id)
        .eq('bill_type', 'no_confidence')
        .in('status', ['committee', 'floor'])
        .limit(1)
        .maybeSingle();

    if (existingMotion) {
        alert('A motion of no confidence is already pending.');
        return;
    }

    // Check: 6-tick cooldown since last failed no-confidence (per-party)
    const { data: lastFailed } = await _supabase
        .from('campaign_actions')
        .select('tick_performed')
        .eq('nation_id', currentNation.id)
        .eq('party_id', currentFaction.id)
        .eq('action_type', 'no_confidence_failed')
        .order('tick_performed', { ascending: false })
        .limit(1)
        .maybeSingle();

    if (lastFailed) {
        const ticksSince = currentTick - lastFailed.tick_performed;
        if (ticksSince < GAME_CONFIG.NO_CONFIDENCE_COOLDOWN_TICKS) {
            const remaining = GAME_CONFIG.NO_CONFIDENCE_COOLDOWN_TICKS - ticksSince;
            alert(`Cooldown: ${remaining} tick${remaining !== 1 ? 's' : ''} remaining before another no-confidence vote can be filed.`);
            return;
        }
    }

    // Get PM's last name for the motion title
    const { data: hog } = await _supabase
        .from('head_of_government')
        .select('last_name')
        .eq('nation_id', currentNation.id)
        .eq('active', true)
        .maybeSingle();

    const pmLastName = hog?.last_name || null;
    const motionName = pmLastName
        ? `Motion of No Confidence in the ${pmLastName} Government`
        : `Motion of No Confidence in the Government`;

    if (!confirm(
        `⚡ FILE VOTE OF NO CONFIDENCE?\n\n` +
        `"${motionName}"\n\n` +
        `Cost: ${GAME_CONFIG.NO_CONFIDENCE_AP_COST} AP\n` +
        `Voting period: ${GAME_CONFIG.NO_CONFIDENCE_VOTING_TICKS} ticks\n` +
        `Needs simple majority (YES > NO) to pass.\n\n` +
        `IF IT PASSES:\n` +
        `• Coalition dissolved, PM removed, all ministries vacated\n` +
        `• Your party: +3 Approval\n` +
        `• Coalition parties: -5 Approval each\n\n` +
        `IF IT FAILS:\n` +
        `• Your party: -5 Approval\n` +
        `• PM's party: +3 Approval\n` +
        `• ${GAME_CONFIG.NO_CONFIDENCE_COOLDOWN_TICKS}-tick cooldown\n\n` +
        `Proceed?`
    )) return;

    try {
        const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const tick = shard?.current_tick || 0;

        // Create the no-confidence bill — goes directly to floor vote (no committee)
        const { data: bill, error: billError } = await _supabase.from('bills').insert({
            nation_id: currentNation.id,
            proposed_by: currentFaction.id,
            proposed_tick: tick,
            bill_name: motionName,
            bill_type: 'no_confidence',
            status: 'floor',
            floor_tick: tick,
            voting_ends_tick: tick + GAME_CONFIG.NO_CONFIDENCE_VOTING_TICKS,
            preamble: `This motion, filed by the ${currentFaction.faction_name}, calls for a vote of no confidence in the current government. If passed by simple majority, the coalition will be immediately dissolved.`
        }).select().single();

        if (billError) throw billError;

        // Post-insert guard: verify no duplicate no-confidence motions were created concurrently
        const { count: ncCount } = await _supabase.from('bills')
            .select('id', { count: 'exact', head: true })
            .eq('nation_id', currentNation.id)
            .eq('bill_type', 'no_confidence')
            .in('status', ['committee', 'floor']);
        if (ncCount > 1) {
            // Another motion was filed at the same time — delete ours
            await _supabase.from('bills').delete().eq('id', bill.id);
            alert('Another motion of no confidence was just filed. Please refresh.');
            return;
        }

        // Deduct AP only after bill creation succeeds
        const apResult = await deductAP(_supabase, currentFaction.id, GAME_CONFIG.NO_CONFIDENCE_AP_COST);
        if (!apResult.success) { alert(`Not enough AP. You need ${GAME_CONFIG.NO_CONFIDENCE_AP_COST} AP.`); return; }
        currentFaction.action_points = apResult.newAp;

        // Auto-cast the filer's own vote as YES
        const seatData = await loadSeats(_supabase, currentNation.id, false, allParties, currentFaction.id);
        const mySeats = seatData.allPartySeats[currentFaction.id] || 0;
        await _supabase.from('bill_support').upsert({
            bill_id: bill.id,
            faction_id: currentFaction.id,
            stance: 'yes',
            seat_count: mySeats
        }, { onConflict: 'bill_id,faction_id' });



        alert(`⚡ "${motionName}" has been filed!\n\nVoting is now open for ${GAME_CONFIG.NO_CONFIDENCE_VOTING_TICKS} ticks. All parties will vote.`);
        window.location.href = `bill.html?id=${bill.id}`;
    } catch (e) {
        console.error('No confidence error:', e);
        alert('Error: ' + e.message);
    }
}
