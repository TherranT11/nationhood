        if (crisesStarted.length > 0) {
            detailHTML += `<div style="font-size:0.72rem;color:var(--red);font-weight:bold;margin-bottom:4px;">Started (${crisesStarted.length})</div>`;
            detailHTML += crisesStarted.map(c => `<div class="pad-crisis-item"><span>${c.title}</span><span class="crisis-date">${c.started_tick != null ? tickToDate(c.started_tick) : (c.started_date || '')}</span></div>`).join('');
        }
        if (crisesSolved.length > 0) {
            detailHTML += `<div style="font-size:0.72rem;color:var(--green);font-weight:bold;margin:6px 0 4px;">Solved (${crisesSolved.length})</div>`;
            detailHTML += crisesSolved.map(c => `<div class="pad-crisis-item"><span>${c.title}</span><span class="crisis-date">${c.solved_tick != null ? tickToDate(c.solved_tick) : (c.solved_date || '')}</span></div>`).join('');
        }
    }

    // Legislation
    if (billsPassed.length > 0 || lawsRepealed.length > 0) {
        detailHTML += `<div class="pad-section-title">Flagship Legislation</div>`;
        if (billsPassed.length > 0) {
            detailHTML += `<div style="font-size:0.72rem;color:var(--text-secondary);font-weight:bold;margin-bottom:4px;">Bills Passed (${billsPassed.length})</div>`;
            detailHTML += billsPassed.map(b => `<div class="pad-legislation-item"><span class="bill-name">${b.bill_name || 'Unnamed'}</span><span class="bill-date">${tickToDate(b.passed_tick)}</span></div>`).join('');
        }
        if (lawsRepealed.length > 0) {
            detailHTML += `<div style="font-size:0.72rem;color:var(--red);font-weight:bold;margin:6px 0 4px;">Laws Repealed (${lawsRepealed.length})</div>`;
            detailHTML += lawsRepealed.map(b => `<div class="pad-legislation-item"><span class="bill-name">${b.bill_name || 'Unnamed'}</span><span class="bill-date">${b.repealed_tick != null ? tickToDate(b.repealed_tick) : (b.repealed_date || '')}</span></div>`).join('');
        }
    }

    if (!isCurrent && billsPassed.length === 0 && lawsRepealed.length === 0) {
        detailHTML += `<div class="pad-section-title">Legislation</div><div class="pad-no-data">No bills passed during this administration.</div>`;
    }

    // All stat changes table (expandable)
    if (!isCurrent && allChanges.length > 0) {
        detailHTML += `
            <div class="pad-stat-table-toggle" onclick="toggleStatTable('${admin.id}')">
                <span>All Stat Changes (${allChanges.length})</span>
                <span class="chevron">&#9660;</span>
            </div>
            <div class="pad-stat-table" id="stat-table-${admin.id}">
                <table>
                    <thead><tr><th>Stat</th><th>Start</th><th>End</th><th>Change</th></tr></thead>
                    <tbody>
                        ${allChanges.map(c => {
                            const good = isImprovement(c.key, c.raw);
                            const indicator = good === true ? ' style="color:var(--green)"' : (good === false ? ' style="color:var(--red)"' : '');
                            return `<tr>
                                <td>${formatAdminStatName(c.key)}</td>
                                <td>${formatStatValue(c.start, c.key)}</td>
                                <td>${formatStatValue(c.end, c.key)}</td>
                                <td${indicator}>${formatChange(c.raw, c.key)}</td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>
            </div>`;
    }

    return `
        <div class="past-admin-card ${endClass}" id="admin-card-${admin.id}">
            <div class="past-admin-summary" onclick="toggleAdminCard('${admin.id}')">
                <div class="past-admin-summary-left">
                    <div class="past-admin-name">
                        ${admin.admin_name || 'Unknown Administration'}
                        ${reasonBadge}
                        <span class="past-admin-date">${dateRange}</span>
                    </div>
                    <div class="past-admin-meta">
                        PM: <span class="pm-name">${admin.prime_minister || 'TBD'}</span> &middot; ${admin.pm_party_name || ''}
                        ${partyList ? ` &middot; ${partyList}` : ''}
                        ${seatCount ? ` &middot; ${seatCount}/${GAME_CONFIG.TOTAL_SEATS} seats` : ''}
                    </div>
                </div>
                <div class="past-admin-approval">
                    <div class="past-admin-approval-label">Approval</div>
                    <div class="past-admin-approval-value">${approvalHTML || '—'}</div>
                </div>
                <span class="past-admin-chevron">&#9660;</span>
            </div>
            <div class="past-admin-detail">
                ${detailHTML}
            </div>
        </div>`;
}

</script>
</body>
</html>
