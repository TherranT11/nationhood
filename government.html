let _confirmCurriculumLock = false;

async function confirmCurriculum() {
    if (_confirmCurriculumLock) return;
    _confirmCurriculumLock = true;
    if (!_curriculumSelection) { _confirmCurriculumLock = false; return; }
    if (!isMyMinistryByKey('education')) { _confirmCurriculumLock = false; return; }
    const sel = _curriculumSelection;
    const apCost = 6;

    if ((currentFaction?.action_points || 0) < apCost) {
        alert('Not enough AP.');
        return;
    }

    closeCurriculumModal();

    // Optimistic UI
    const actionId = 'education-standardisedCurriculum';
    const row = document.getElementById(actionId);
    if (row) { row.classList.add('active'); }
    const btns = document.getElementById(actionId + '-btns');
    if (btns) btns.innerHTML = '<div class="ministry-action__active-indicator">● ACTIVE</div>';

    const activationTick = (currentTick || 0) + 160;

    try {
        // 1. Insert curriculum drift record
        const { error: driftErr } = await _supabase.from('curriculum_drift').insert({
            nation_id: currentNation.id,
            faction_id: currentFaction.id,
            axis: sel.axisId,
            direction: sel.direction,
            direction_label: sel.label,
            set_at_tick: currentTick,
            activates_at_tick: activationTick,
            drift_ticks_remaining: 12,
            drift_per_tick: 0.2
        });
        if (driftErr) throw driftErr;

        // 2. Execute as ministry action (AP deduction + action log)
        const { error: rpcErr } = await _supabase.rpc('execute_ministry_action', {
            p_nation_id: currentNation.id,
            p_faction_id: currentFaction.id,
            p_ministry_key: 'education',
            p_action_key: 'standardisedCurriculum',
            p_ap_cost: apCost,
            p_applied_at_tick: currentTick,
            p_stat_effects: [], // drift handled separately
            p_action_data: {
                axis: sel.axisId,
                direction: sel.direction,
                direction_label: sel.label,
                activates_at_tick: activationTick,
                use_count: ministryActionUseCounts['education:standardisedCurriculum'] || 0,
                scale: 1.0,
                budget_per_tick: 0
            }
        });
        if (rpcErr) throw rpcErr;

        // Update local state
        currentFaction.action_points = Math.max(0, (currentFaction.action_points || 0) - apCost);
        ministryActionUseCounts['education:standardisedCurriculum'] = (ministryActionUseCounts['education:standardisedCurriculum'] || 0) + 1;
        activeMinistryActions[actionId] = true;
        _activeCurriculumDrift = {
            axis: sel.axisId,
            direction: sel.direction,
            direction_label: sel.label,
            activates_at_tick: activationTick,
            drift_ticks_remaining: 12
        };
        _curriculumCooldownUntil = currentTick + 12;
        sessionStorage.removeItem('nationhood_state');

        // Fire CIVIC event
        try {
            const { data: ministry } = await _supabase
                .from('ministries')
                .select('minister_first_name, minister_last_name, factions(faction_name)')
                .eq('nation_id', currentNation.id)
                .eq('ministry_key', 'education')
                .single();

            const ministerName = ministry ? `${ministry.minister_first_name} ${ministry.minister_last_name}` : 'Education Minister';
            const partyName = ministry?.factions?.faction_name || currentFaction?.faction_name || 'Government';
            const axisLabel = _curriculumAxisLabel(sel.axisId);

            const templates = [
                `${ministerName} sets national curriculum toward ${sel.label} on the ${axisLabel} axis.`,
                `Education Ministry confirms new curriculum orientation: ${sel.label}.`,
                `${currentNation.name} curriculum standardised. Electorate drift begins Tick ${activationTick}.`,
                `${partyName} government locks in curriculum direction. Effects arrive in 160 ticks.`
            ];
            const headline = templates[Math.floor(Math.random() * templates.length)];

            await _supabase.from('event_log').insert({
                nation_id: currentNation.id,
                tick: currentTick,
                event_type: 'ministry_standardised_curriculum',
                category: 'education',
                headline,
                details: { axis: sel.axisId, direction: sel.direction, direction_label: sel.label, activates_at_tick: activationTick },
                severity: 'info'
            });
        } catch (e) { console.warn('[Education] Event log failed:', e); }

        // Refresh education action states
        refreshMinistryActionStates('education');
    } catch (err) {
        console.error('[Education] Curriculum confirm failed:', err);
        alert('Failed to set curriculum: ' + (err.message || err));
        if (row) { row.classList.remove('active'); }
    } finally {
        _confirmCurriculumLock = false;
    }
}

// Load active curriculum drift for card display
async function loadCurriculumDriftState() {
    if (!currentNation) return;
    try {
        const { data } = await _supabase
            .from('curriculum_drift')
            .select('*')
            .eq('nation_id', currentNation.id)
            .eq('completed', false)
            .order('set_at_tick', { ascending: false })
            .limit(1)
            .maybeSingle();
        _activeCurriculumDrift = data || null;

        // Set cooldown from most recent curriculum action
        const { data: recentAction } = await _supabase
            .from('ministry_action_log')
            .select('applied_at_tick')
            .eq('nation_id', currentNation.id)
            .eq('ministry_key', 'education')
            .eq('action_key', 'standardisedCurriculum')
            .order('applied_at_tick', { ascending: false })
            .limit(1)
            .maybeSingle();
        if (recentAction) {
            _curriculumCooldownUntil = recentAction.applied_at_tick + 12;
        }
    } catch (e) {
        console.warn('[Education] Failed to load curriculum drift:', e);
    }
}

// ==================== DOCTRINE PANEL — FULL-SCREEN OVERLAY ====================

let _doctrineActiveTab = 'army';
let _nationDoctrines = []; // loaded from DB on panel open
let _doctrineConfirmingId = null; // lock during announce/renounce

function isDefenseMinister() {
    return isMyMinistryByKey('defense');
}

let _doctrinePanelLoading = false;

async function openDoctrinePanel() {
    if (_doctrinePanelLoading) return;
    _doctrinePanelLoading = true;
    _doctrineActiveTab = 'army';
    _doctrineConfirmingId = null;

    // Load nation doctrines from DB
    try {
        await loadNationDoctrines();
    } finally {
        _doctrinePanelLoading = false;
    }

    // Render panel
    renderDoctrinePanel();
}

function closeDoctrinePanel() {
    const panel = document.getElementById('doctrine-panel-overlay');
    if (panel) panel.remove();
}

async function loadNationDoctrines() {
    if (!currentNation) { _nationDoctrines = []; return; }
    const { data, error } = await _supabase
        .from('military_doctrines')
        .select('*')
        .eq('nation_id', currentNation.id);
    if (error) {
        console.error('[loadNationDoctrines]', error.message);
        _nationDoctrines = [];
        return;
    }
    _nationDoctrines = data || [];
}

function getDoctrineState(doctrineId) {
    return _nationDoctrines.find(d => d.doctrine_id === doctrineId);
}

function renderDoctrinePanel() {
    // Remove existing if any
    let overlay = document.getElementById('doctrine-panel-overlay');
    if (overlay) overlay.remove();

    overlay = document.createElement('div');
    overlay.id = 'doctrine-panel-overlay';
    overlay.className = 'doctrine-overlay';

    const isMine = isDefenseMinister();

    // Landlocked nations cannot adopt Navy doctrines — hide the tab entirely
    const isLandlocked = currentNation?.is_landlocked === true;
    const visibleSectors = isLandlocked
        ? DOCTRINE_SECTORS.filter(s => s !== 'navy')
        : DOCTRINE_SECTORS;

    // If active tab was navy but nation is landlocked, reset to army
    if (isLandlocked && _doctrineActiveTab === 'navy') {
        _doctrineActiveTab = 'army';
    }

    // Build tab bar
    let tabsHtml = '';
    visibleSectors.forEach(sector => {
        const label = DOCTRINE_SECTOR_LABELS[sector];
        const isActive = sector === _doctrineActiveTab;
        const activeCount = _nationDoctrines.filter(d => d.sector === sector && d.active && !DOCTRINES[d.doctrine_id]?.hidden).length;
        const pendingNuclear = sector === NUCLEAR_SECTOR && _nationDoctrines.some(d => d.sector === NUCLEAR_SECTOR && d.pending_doctrine_id);

        let badgeHtml = '';
        if (sector === NUCLEAR_SECTOR && activeCount > 0) {
            const activeDoctrine = _nationDoctrines.find(d => d.sector === NUCLEAR_SECTOR && d.active && !d.renouncing);
            if (activeDoctrine) {
                const def = DOCTRINES[activeDoctrine.doctrine_id];
                const abbr = def ? def.name.substring(0, 3).toUpperCase() : '';
                badgeHtml = `<span class="doctrine-tab__badge">${abbr}</span>`;
            }
            if (pendingNuclear) {
                badgeHtml += `<span class="doctrine-tab__badge doctrine-tab__badge--pending">PENDING</span>`;
            }
        } else if (activeCount > 0) {
            badgeHtml = `<span class="doctrine-tab__badge">${activeCount}</span>`;
        }

        tabsHtml += `<div class="doctrine-tab${isActive ? ' active' : ''}" onclick="switchDoctrineTab('${sector}')">
            <span class="doctrine-tab__label${activeCount > 0 ? ' doctrine-tab__label--active' : ''}">${label}</span>
            ${badgeHtml}
        </div>`;
    });

    // Build doctrine cards for active tab
    const sectorDoctrines = getDoctrinesBySector(_doctrineActiveTab);
    let cardsHtml = '';
    sectorDoctrines.forEach(def => {
        // Praetorian: hide from democratic governments
        if (def.autocracyOnly && !isAutocracy) return;

        cardsHtml += renderDoctrineCard(def, getDoctrineState(def.id), isMine);
    });

    if (!cardsHtml) {
        cardsHtml = '<div style="padding:20px;color:#4a4840;font-family:var(--font-mono);font-size:9px;">No doctrines available for this sector.</div>';
    }

    overlay.innerHTML = `
        <div class="doctrine-panel">
            <div class="doctrine-panel__header">
                <div class="doctrine-panel__title">MINISTRY OF DEFENSE — MILITARY DOCTRINE</div>
                <div class="doctrine-panel__close" onclick="closeDoctrinePanel()">✕</div>
            </div>
            <div class="doctrine-panel__tabs">${tabsHtml}</div>
            <div class="doctrine-panel__cards" id="doctrine-cards-container">${cardsHtml}</div>
        </div>
    `;

    // Close on backdrop click (outside the panel)
    overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeDoctrinePanel();
    });

    document.body.appendChild(overlay);
}

function renderDoctrineCard(def, state, isMine) {
    const isActiveDoc = state && state.active && !state.renouncing;
    const isRenouncing = state && state.renouncing;
    const isPermanent = def.permanent;
    const isNuclearLocked = def.id === 'non_nuclear_power' && state && state.active && !(currentNation?.hasNuclearCapability);

    // Determine card visual state
    let cardClass = 'doctrine-card';
    let stateTagHtml = '';
    let barHtml = '';
    let buttonHtml = '';

    if (isPermanent && isActiveDoc) {
        // Praetorian Doctrine — permanent autocracy card
        cardClass += ' doctrine-card--praetorian';
        stateTagHtml = `<span class="doctrine-card__tag doctrine-card__tag--permanent">PERMANENT</span>`;
        barHtml = renderCohesionBar(state);
        buttonHtml = `<div class="doctrine-card__btn doctrine-card__btn--disabled">AUTOCRACY — CANNOT BE RENOUNCED</div>`;
    } else if (isRenouncing) {
        // Renouncing state — cooldown in progress
        cardClass += ' doctrine-card--renouncing';
        stateTagHtml = `<span class="doctrine-card__tag doctrine-card__tag--renouncing">RENOUNCING</span>`;
        barHtml = renderCooldownBar(state);
        buttonHtml = `<div style="font-family:var(--font-mono);font-size:7px;color:#4a4840;margin-top:4px;">Cannot announce while cooldown is active.</div>`;
    } else if (isActiveDoc) {
        // Active state
        cardClass += ' doctrine-card--active';
        stateTagHtml = `<span class="doctrine-card__tag doctrine-card__tag--active">ACTIVE</span>`;
        barHtml = renderCohesionBar(state);

        if (isNuclearLocked) {
            buttonHtml = `<div class="doctrine-card__btn doctrine-card__btn--disabled">REQUIRES NUCLEAR CAPABILITY TO CHANGE</div>`;
        } else if (isMine && !isPermanent) {
            buttonHtml = `<div class="doctrine-card__btn doctrine-card__btn--renounce" onclick="event.stopPropagation();beginDoctrineRenounce('${def.id}')">RENOUNCE — ${DOCTRINE_RENOUNCE_COOLDOWN} TICK COOLDOWN</div>`;
        }
    } else {
        // Inactive state
        cardClass += ' doctrine-card--inactive';
        if (isMine) {
            buttonHtml = `<div class="doctrine-card__btn doctrine-card__btn--announce" onclick="event.stopPropagation();beginDoctrineAnnounce('${def.id}')">ANNOUNCE</div>`;
        }
    }

    // Nuclear pending state
    if (state && state.pending_doctrine_id === def.id && !isActiveDoc) {
        cardClass = 'doctrine-card doctrine-card--pending';
        const activatesTick = state.pending_activates_tick || '?';
        stateTagHtml = `<span class="doctrine-card__tag doctrine-card__tag--pending">PENDING — ACTIVATES TICK ${activatesTick}</span>`;
        barHtml = '';
        buttonHtml = '';
    }

    const apText = def.apCost > 0 ? `${def.apCost} AP` : (def.startingDoctrine ? 'DEFAULT' : 'NO COST');

    return `<div class="${cardClass}" id="doctrine-card-${def.id}">
        <div class="doctrine-card__top">
            <span class="doctrine-card__name">${escapeHtml(def.name)}</span>
            ${stateTagHtml}
        </div>
        <div class="doctrine-card__ap">${apText}</div>
        <div class="doctrine-card__desc">${escapeHtml(def.desc)}</div>
        ${barHtml}
        <div class="doctrine-card__actions" id="doctrine-actions-${def.id}">
            ${buttonHtml}
        </div>
    </div>`;
}

function renderCohesionBar(state) {
    if (!state) return '';
    const cohesion = state.cohesion || 0;
    const max = DOCTRINE_COHESION_MAX;
    const pct = Math.min(100, (cohesion / max) * 100);
    return `<div class="doctrine-bar">
        <span class="doctrine-bar__label">COHESION</span>
        <div class="doctrine-bar__track"><div class="doctrine-bar__fill doctrine-bar__fill--cohesion" style="width:${pct}%"></div></div>
        <span class="doctrine-bar__value doctrine-bar__value--cohesion">${cohesion} / ${max}</span>
    </div>`;
}

function renderCooldownBar(state) {
    if (!state) return '';
    const remaining = state.renounce_cooldown_remaining || 0;
    const total = DOCTRINE_RENOUNCE_COOLDOWN;
    const pct = Math.min(100, (remaining / total) * 100);
    return `<div class="doctrine-bar">
        <span class="doctrine-bar__label">COOLDOWN</span>
        <div class="doctrine-bar__track"><div class="doctrine-bar__fill doctrine-bar__fill--cooldown" style="width:${pct}%"></div></div>
        <span class="doctrine-bar__value doctrine-bar__value--cooldown">${remaining} / ${total}</span>
    </div>`;
}

function doctrineEventVars(def, extra = {}) {
    return {
        nation_name: currentNation?.name || 'Unknown',
        doctrine_name: def.name,
        sector: DOCTRINE_SECTOR_LABELS[def.sector],
        ...extra
    };
}

// ── Announce flow ──

function beginDoctrineAnnounce(doctrineId) {
    const def = DOCTRINES[doctrineId];
    if (!def) return;

    // Landlocked nations cannot announce navy doctrines
    if (def.sector === 'navy' && currentNation?.is_landlocked) {
        showDoctrineAlert(doctrineId, 'Landlocked nations cannot adopt naval doctrines.');
        return;
    }

    // Nuclear capability check
    if (def.sector === NUCLEAR_SECTOR) {
        const check = canAnnounceNuclearDoctrine(def, { nation: currentNation || {} });
        if (!check.allowed) {
            showDoctrineAlert(doctrineId, check.message);
            return;
        }
    }

    // AP check
    const ap = currentFaction?.action_points || 0;
    if (def.apCost > 0 && ap < def.apCost) {
        showDoctrineAlert(doctrineId, `Insufficient AP. Need ${def.apCost}, have ${ap}.`);
        return;
    }

    // Show inline confirmation
    const actionsEl = document.getElementById('doctrine-actions-' + doctrineId);
    if (!actionsEl) return;

    actionsEl.innerHTML = `
        <div class="doctrine-confirm doctrine-confirm--announce">
            <div class="doctrine-confirm__text">Announce ${escapeHtml(def.name)}? This declaration is public.</div>
            <div class="doctrine-confirm__btns">
                <div class="doctrine-card__btn doctrine-card__btn--announce" onclick="event.stopPropagation();confirmDoctrineAnnounce('${doctrineId}')">Confirm — ${def.apCost} AP</div>
                <div class="doctrine-card__btn doctrine-card__btn--cancel" onclick="event.stopPropagation();cancelDoctrineAction('${doctrineId}')">Cancel</div>
            </div>
        </div>`;
}

function showDoctrineAlert(doctrineId, message) {
    const actionsEl = document.getElementById('doctrine-actions-' + doctrineId);
    if (!actionsEl) return;
    const existingAlert = actionsEl.querySelector('.doctrine-alert');
    if (existingAlert) existingAlert.remove();

    const alert = document.createElement('div');
    alert.className = 'doctrine-alert';
    alert.textContent = message;
    actionsEl.prepend(alert);

    // Auto-dismiss after 5s
    setTimeout(() => { if (alert.parentNode) alert.remove(); }, 5000);
}

async function confirmDoctrineAnnounce(doctrineId) {
    if (_doctrineConfirmingId) return;
    _doctrineConfirmingId = doctrineId;

    const def = DOCTRINES[doctrineId];
    if (!def) { _doctrineConfirmingId = null; return; }

    try {
        // Guard: prevent re-announcing an already active doctrine
        const existing = getDoctrineState(doctrineId);
        if (existing && existing.active && !existing.renouncing) {
            showDoctrineAlert(doctrineId, `${def.name} is already active.`);
            _doctrineConfirmingId = null;
            return;
        }

        // Nuclear single-select: if announcing a different nuclear doctrine, begin renounce of current
        let oldNuclearDoctrine = null;
        if (def.sector === NUCLEAR_SECTOR) {
            const currentNuclear = _nationDoctrines.find(d => d.sector === NUCLEAR_SECTOR && d.active && !d.renouncing);
            if (currentNuclear && currentNuclear.doctrine_id !== doctrineId) {
                oldNuclearDoctrine = currentNuclear;
            }
        }

        // Deduct AP
        if (def.apCost > 0) {
            const apResult = await deductAP(_supabase, currentFaction.id, def.apCost);
            if (!apResult.success) {
                showDoctrineAlert(doctrineId, apResult.error || 'Failed to deduct AP.');
                _doctrineConfirmingId = null;
                return;
            }
            currentFaction.action_points = Math.max(0, (currentFaction.action_points || 0) - def.apCost);
            sessionStorage.removeItem('nationhood_state');
        }

        if (def.sector === NUCLEAR_SECTOR && oldNuclearDoctrine) {
            // Nuclear transition: begin renounce of old, set pending for new
            const { error: nucErr } = await _supabase.from('military_doctrines')
                .update({
                    renouncing: true,
                    renounce_cooldown_remaining: DOCTRINE_RENOUNCE_COOLDOWN,
                    pending_doctrine_id: doctrineId,
                    pending_activates_tick: (currentTick || 0) + DOCTRINE_RENOUNCE_COOLDOWN
                })
                .eq('nation_id', currentNation.id)
                .eq('doctrine_id', oldNuclearDoctrine.doctrine_id);
            if (nucErr) throw nucErr;

            // Fire nuclear transition world event
            const oldDef = DOCTRINES[oldNuclearDoctrine.doctrine_id];
            if (oldDef && def.id !== 'non_nuclear_power') {
                fireDoctrineEvent('nuclear_transition_world', doctrineEventVars(def, {
                    old_doctrine: oldDef.name,
                    new_doctrine: def.name
                }));
            }
        } else {
            // Standard announce: insert new active doctrine
            const { error: insErr } = await _supabase.from('military_doctrines').insert({
                nation_id: currentNation.id,
                doctrine_id: doctrineId,
                sector: def.sector,
                active: true,
                cohesion: 0,
                activated_on_tick: currentTick || 0,
                renouncing: false,
                renounce_cooldown_remaining: null,
                permanent: def.permanent || false,
                autocracy_only: def.autocracyOnly || false,
                hidden: def.hidden || false
            });
            if (insErr) throw insErr;
        }

        // Fire events (non-hidden doctrines only)
        if (!def.hidden) {
            const vars = doctrineEventVars(def);
            fireDoctrineEvent('announced_nation', vars);
            fireDoctrineEvent('announced_world', vars);
        }

        // Log activity
        await _supabase.from('activity_log').insert({
            faction_id: currentFaction.id,
            nation_id: currentNation.id,
            action_type: 'declare_doctrine',
            action_label: 'Declare Doctrine',
            description: `Announced ${def.name} (${DOCTRINE_SECTOR_LABELS[def.sector]}).`,
            outcome: 'success',
            ap_spent: def.apCost,
            tick: currentTick
        });

        // Refresh panel
        await loadNationDoctrines();
        renderDoctrinePanel();

    } catch (e) {
        console.error('[confirmDoctrineAnnounce]', e);
        showDoctrineAlert(doctrineId, 'Failed: ' + (e.message || 'Unknown error'));
    } finally {
        _doctrineConfirmingId = null;
    }
}

// ── Renounce flow ──

function beginDoctrineRenounce(doctrineId) {
    const def = DOCTRINES[doctrineId];
    if (!def) return;

    const actionsEl = document.getElementById('doctrine-actions-' + doctrineId);
    if (!actionsEl) return;

    actionsEl.innerHTML = `
        <div class="doctrine-confirm doctrine-confirm--renounce">
            <div class="doctrine-confirm__text">Renounce ${escapeHtml(def.name)}? ${DOCTRINE_RENOUNCE_COOLDOWN}-tick cooldown applies. Doctrine remains public until cooldown expires.</div>
            <div class="doctrine-confirm__btns">
                <div class="doctrine-card__btn doctrine-card__btn--renounce" onclick="event.stopPropagation();confirmDoctrineRenounce('${doctrineId}')">Confirm Renunciation</div>
                <div class="doctrine-card__btn doctrine-card__btn--cancel" onclick="event.stopPropagation();cancelDoctrineAction('${doctrineId}')">Cancel</div>
            </div>
        </div>`;
}

async function confirmDoctrineRenounce(doctrineId) {
    if (_doctrineConfirmingId) return;
    _doctrineConfirmingId = doctrineId;

    const def = DOCTRINES[doctrineId];
    if (!def) { _doctrineConfirmingId = null; return; }

    try {
        const { error: renErr } = await _supabase.from('military_doctrines')
            .update({
                renouncing: true,
                renounce_cooldown_remaining: DOCTRINE_RENOUNCE_COOLDOWN
            })
            .eq('nation_id', currentNation.id)
            .eq('doctrine_id', doctrineId);
        if (renErr) throw renErr;

        // Fire nation event
        if (!def.hidden) {
            fireDoctrineEvent('renounced_nation_start', doctrineEventVars(def));
        }

        // Log activity
        await _supabase.from('activity_log').insert({
            faction_id: currentFaction.id,
            nation_id: currentNation.id,
            action_type: 'renounce_doctrine',
            action_label: 'Renounce Doctrine',
            description: `Initiated renunciation of ${def.name} (${DOCTRINE_SECTOR_LABELS[def.sector]}). Cooldown: ${DOCTRINE_RENOUNCE_COOLDOWN} ticks.`,
            outcome: 'success',
            ap_spent: 0,
            tick: currentTick
        });

        // Refresh panel
        await loadNationDoctrines();
        renderDoctrinePanel();

    } catch (e) {
        console.error('[confirmDoctrineRenounce]', e);
        showDoctrineAlert(doctrineId, 'Failed: ' + (e.message || 'Unknown error'));
    } finally {
        _doctrineConfirmingId = null;
    }
}

function cancelDoctrineAction(doctrineId) {
    // Re-render the panel to reset the card
    renderDoctrinePanel();
}

function switchDoctrineTab(sector) {
    _doctrineActiveTab = sector;
    renderDoctrinePanel();
}

async function fireDoctrineEvent(poolKey, vars) {
    try {
        const pool = DOCTRINE_EVENTS[poolKey];
        if (!pool) return;
        const text = buildDoctrineEventText(pool, vars);

        // Insert directly into event_log (fire_system_event RPC has auth
        // guard issues for client-side calls; direct insert matches the
        // pattern used by autocracy-coups.js, bills.js, etc.)
        const { error } = await _supabase.from('event_log').insert({
            nation_id: currentNation.id,
            event_name: 'Military Doctrine',
            trigger_key: 'military_doctrine_' + poolKey,
            description_chosen: text,
            category: 'MILITARY',
            fired_at_tick: currentTick
        });
        if (error) console.error('[fireDoctrineEvent] insert failed:', error.message);
    } catch (e) {
        console.error('[fireDoctrineEvent]', e);
    }
}

// --- Ministry action interaction state machine ---
let selectedMinistryAction = null;

function ministryActionSelect(actionId) {
    const row = document.getElementById(actionId);
    if (!row || row.classList.contains('active') || row.classList.contains('disabled')) return;

    // Ownership guard: only the party that owns this ministry can use actions
    const ministryKey = actionId.split('-')[0];
    if (!isMyMinistryByKey(ministryKey)) return;

    // Deselect previous
    if (selectedMinistryAction && selectedMinistryAction !== actionId) {
        ministryActionDeselect(selectedMinistryAction);
    }

    if (row.classList.contains('selected')) return;

    row.classList.add('selected');
    selectedMinistryAction = actionId;

    const btns = document.getElementById(actionId + '-btns');
    if (btns) {
        btns.innerHTML = `<div style="display:flex;gap:4px;">
            <div class="ministry-action__btn-confirm" onclick="event.stopPropagation();ministryActionConfirm('${actionId}')">✓ CONFIRM</div>
            <div class="ministry-action__btn-cancel" onclick="event.stopPropagation();ministryActionDeselect('${actionId}')">✕</div>
        </div>`;
    }
}

function ministryActionDeselect(actionId) {
    const row = document.getElementById(actionId);
    if (!row) return;
    row.classList.remove('selected');
    if (selectedMinistryAction === actionId) selectedMinistryAction = null;

    // Parse ministry key and action ID to restore AP cost
    const parts = actionId.split('-');
    const ministryKey = parts[0];
    const actId = parts.slice(1).join('');
    const config = MINISTRY_ACTIONS[ministryKey];
    let apCost = 1;
    if (config) {
        const action = config.actions.find(a => a.id === actId);
        if (action) {
            const countKey = ministryKey + ':' + actId;
            const useCount = ministryActionUseCounts[countKey] || 0;
            apCost = action.apCosts[Math.min(useCount, 3)];
        }
    }

    const btns = document.getElementById(actionId + '-btns');
    if (btns) {
        btns.innerHTML = `<div class="ministry-action__btn-execute" onclick="event.stopPropagation();ministryActionSelect('${actionId}')">▶ ${apCost} AP</div>`;
    }
}

// Refresh button states and disabled classes for all actions in a ministry
// after AP changes (avoids full page re-render)
function refreshMinistryActionStates(ministryKey) {
    // Custom-layout ministries manage their own state
    if (ministryKey === 'defense' || ministryKey === 'healthcare') return;
    const config = MINISTRY_ACTIONS[ministryKey];
    if (!config?.actions) return;
    const ap = currentFaction?.action_points || 0;
    const canUse = isMyMinistryByKey(ministryKey);
    const ministry = ministryData.find(m => m.ministry_key === ministryKey);
    const discretionaryBalance = Number(ministry?.discretionary_balance || 0);
    config.actions.forEach(action => {
        const countKey = ministryKey + ':' + action.id;
        const useCount = ministryActionUseCounts[countKey] || 0;
        const apCost = action.apCosts[Math.min(useCount, 3)];
        const actionId = ministryKey + '-' + action.id;
        const row = document.getElementById(actionId);
        if (!row || row.classList.contains('active')) return;

        // Check blocking conditions
        let blockReason = '';
        if (action.id === 'debtRestructuring' && canUse) {
            blockReason = getDebtRestructuringBlock();
        }
        if (!blockReason && action.budgetPerCapita > 0 && discretionaryBalance <= 0 && canUse) {
            blockReason = 'No Discretionary Funds available.';
        }
        const isBlocked = !!blockReason;
        const isDisabled = !canUse || ap < apCost || isBlocked;
        const btns = document.getElementById(actionId + '-btns');
        const apLabel = row.querySelector('.ministry-action__ap-cost');
        if (apLabel) apLabel.textContent = apCost + ' AP' + (useCount > 0 ? ' (use ' + (useCount + 1) + ')' : '');

        if (!canUse) {
            row.classList.add('disabled');
            row.classList.remove('selected');
            row.removeAttribute('onclick');
            if (btns) btns.innerHTML = '';
        } else if (isBlocked) {
            row.classList.add('disabled');
            row.classList.remove('selected');
            row.removeAttribute('onclick');
            if (btns) btns.innerHTML = `<div class="ministry-action__btn-execute" style="opacity:0.4;cursor:not-allowed;" title="${escapeHtml(blockReason)}">🔒</div>`;
        } else if (isDisabled) {
            row.classList.add('disabled');
            row.classList.remove('selected');
            row.removeAttribute('onclick');
            if (btns) btns.innerHTML = `<div class="ministry-action__btn-execute" style="opacity:0.4;cursor:not-allowed;" title="Need ${apCost} AP">▶ ${apCost} AP</div>`;
        } else {
            row.classList.remove('disabled');
            row.setAttribute('onclick', `ministryActionSelect('${actionId}')`);
            if (btns) btns.innerHTML = `<div class="ministry-action__btn-execute" onclick="event.stopPropagation();ministryActionSelect('${actionId}')">▶ ${apCost} AP</div>`;
        }
    });
}

let _ministryActionConfirming = false; // debounce lock

async function ministryActionConfirm(actionId) {
    if (_ministryActionConfirming) return;
    _ministryActionConfirming = true;

    const row = document.getElementById(actionId);
    if (!row || !currentFaction || !currentNation) { _ministryActionConfirming = false; return; }

    // Parse IDs
    const parts = actionId.split('-');
    const ministryKey = parts[0];

    // Ownership guard: only the party that owns this ministry can execute actions
    if (!isMyMinistryByKey(ministryKey)) {
        _ministryActionConfirming = false;
        alert('Your party does not control this ministry.');
        return;
    }
    const actId = parts.slice(1).join('');
    const config = MINISTRY_ACTIONS[ministryKey];
    if (!config) { _ministryActionConfirming = false; return; }
    const action = config.actions.find(a => a.id === actId);
    if (!action) { _ministryActionConfirming = false; return; }

    const countKey = ministryKey + ':' + actId;
    const useCount = ministryActionUseCounts[countKey] || 0;
    const apCost = action.apCosts[Math.min(useCount, 3)];
    const statEffects = buildStatEffects(action, useCount);

    // Discretionary funds check for money-drawing actions
    if (action.budgetPerCapita > 0) {
        const mData = ministryData.find(m => m.ministry_key === ministryKey);
        if (Number(mData?.discretionary_balance || 0) <= 0) {
            _ministryActionConfirming = false;
            alert('No Discretionary Funds available. Parliament must allocate funds via a funding bill.');
            ministryActionDeselect(actionId);
            return;
        }
    }

    // Debt Restructuring: final block check before confirm
    if (action.id === 'debtRestructuring') {
        const blockMsg = getDebtRestructuringBlock();
        if (blockMsg) {
            _ministryActionConfirming = false;
            alert(blockMsg);
            ministryActionDeselect(actionId);
            return;
        }
    }

    // Finance conflict: warn player and cancel opposing action before activating
    if (action.conflictsWith && activeMinistryActions[ministryKey + '-' + action.conflictsWith]) {
        const opposingName = action.conflictsWith === 'stimulusPackage' ? 'Stimulus Package' : 'Austerity Measures';
        if (!confirm(`This will immediately cancel your active ${opposingName} with no AP refund. Continue?`)) {
            _ministryActionConfirming = false;
            ministryActionDeselect(actionId);
            return;
        }
        await handleFinanceConflict(action, ministryKey);
    }

    // Optimistic UI update
    row.classList.remove('selected');
    row.classList.add('active');
    selectedMinistryAction = null;
    const btns = document.getElementById(actionId + '-btns');
    if (btns) {
        btns.innerHTML = action.isResolution
            ? '<div class="ministry-action__active-indicator">● NEGOTIATING</div>'
            : '<div class="ministry-action__active-indicator">● ACTIVE</div>';
    }

    // Build action_data with finance-specific fields
    const pop = currentNation.population || 20000000;
    const actionData = {
        use_count: useCount,
        scale: getUseCountScale(useCount),
        budget_per_tick: Math.round((action.budgetPerCapita || 0) * pop)
    };
    if (action.budgetSavesPerCapita) {
        actionData.budget_saves_per_tick = Math.round(action.budgetSavesPerCapita * pop);
    }
    if (action.isResolution) {
        actionData.is_resolution = true;
        actionData.credit_at_action = Number(currentNation?.credit ?? 50);
    }

    try {
        const { data: actionLogId, error } = await _supabase.rpc('execute_ministry_action', {
            p_nation_id: currentNation.id,
            p_faction_id: currentFaction.id,
            p_ministry_key: ministryKey,
            p_action_key: actId,
            p_ap_cost: apCost,
            p_applied_at_tick: currentTick,
            p_stat_effects: statEffects,
            p_action_data: actionData
        });

        if (error) throw error;

        // Update local state
        const prevAP = currentFaction.action_points || 0;
        currentFaction.action_points = Math.max(0, prevAP - apCost);
        ministryActionUseCounts[countKey] = useCount + 1;
        activeMinistryActions[actionId] = true;
        sessionStorage.removeItem('nationhood_state');

        // Refresh sibling action rows to reflect new AP balance
        refreshMinistryActionStates(ministryKey);

        // Fire CIVIC event (non-blocking)
        try {
            const effectiveTriggerKey = action.triggerKey || 'ministry_ability_used';
            const { data: ministry } = await _supabase
                .from('ministries')
                .select('minister_first_name, minister_last_name, factions(faction_name)')
                .eq('nation_id', currentNation.id)
                .eq('ministry_key', ministryKey)
                .single();
            const ministerName = ministry
                ? (ministry.minister_first_name + ' ' + (ministry.minister_last_name || '')).trim()
                : 'Unknown';
            const partyName = ministry?.factions?.faction_name || currentFaction?.faction_name || 'Unknown';
            const placeholders = {
                    minister_name: ministerName,
                    party: partyName,
                    ministry: MINISTRY_NAMES[ministryKey] || ministryKey,
                    nation: currentNation.name || 'Unknown'
                };
            if (action.isResolution) {
                placeholders.credit_chance = String(Math.min(100, Math.max(0, Math.round(Number(currentNation?.credit ?? 50)))));
            }
            await _supabase.rpc('fire_system_event', {
                p_trigger_key: effectiveTriggerKey,
                p_nation_id: currentNation.id,
                p_tick: currentTick,
                p_placeholders: placeholders
            });
        } catch (evtErr) { /* non-blocking — event display is best-effort */ }

    } catch (e) {
        // Revert optimistic UI
        row.classList.remove('active');
        if (btns) {
            btns.innerHTML = `<div class="ministry-action__btn-execute" onclick="event.stopPropagation();ministryActionSelect('${actionId}')">▶ ${apCost} AP</div>`;
        }
        alert('Action failed: ' + (e.message || 'Unknown error'));
    } finally {
        _ministryActionConfirming = false;
    }
}

// ==================== PROTEST CRISIS CARD ====================

function renderProtestCrisisCard() {
    if (!_protestCrisisData) return '';
    const p = _protestCrisisData;
    const isTier7 = p.tier === 7;
    const tierLabel = isTier7 ? 'NATIONWIDE PROTEST' : 'HISTORIC PROTEST';
    const ticksElapsed = currentTick - (p.crisis_started_tick || currentTick);
    const duration = p.crisis_duration || (isTier7 ? PROTEST_CONFIG.TIER7_DURATION : PROTEST_CONFIG.TIER6_DURATION);
    const ticksRemaining = Math.max(0, duration - ticksElapsed);

    // Per-tick effects display
    let effectsHtml = '';
    if (isTier7) {
        effectsHtml = '<span style="color:#d9534f;">GOV −3</span><span style="color:#d9534f;">UNREST +3</span><span style="color:#d9534f;">GDP −0.2</span><span style="color:#d9534f;">INVEST −2</span><span style="color:#d9534f;">VIOLENCE +1</span>';
    } else {
        effectsHtml = '<span style="color:#d9534f;">GOV −2</span><span style="color:#d9534f;">UNREST +2</span><span style="color:#d9534f;">HAPPY −1</span>';
        if (ticksElapsed > 3) {
            effectsHtml += '<span style="color:#d9534f;">VIOLENCE +1</span>';
        }
    }

    // Demand text for T7
    let demandHtml = '';
    if (isTier7 && p.tier7_demand) {
        const metClass = p.tier7_demand_met ? 'style="color:#5cb85c;text-decoration:line-through;"' : '';
        demandHtml = `<div class="protest-crisis-card__demand" ${metClass}>DEMAND: ${escapeHtml(p.tier7_demand.label || 'Unknown')}</div>`;
    }

    // Determine which buttons to show
    const isGoverning = coalitionData && (
        coalitionData.party_ids?.includes(currentFaction?.id) ||
        currentNation?.ruling_faction_id === currentFaction?.id
    );
    const isLeadParty = coalitionData?.lead_party_id === currentFaction?.id ||
                        currentNation?.ruling_faction_id === currentFaction?.id;
    const ownsInterior = ministryData.some(m => m.ministry_key === 'interior' && m.party_id === currentFaction?.id);
    const ap = currentFaction?.action_points || 0;

    // Public Address cooldown check
    const paCooldownRemaining = p.public_address_last_tick != null
        ? Math.max(0, PROTEST_CONFIG.PUBLIC_ADDRESS_COOLDOWN - (currentTick - p.public_address_last_tick))
        : 0;
    const paDisabled = !isGoverning || ap < PROTEST_CONFIG.PUBLIC_ADDRESS_AP || paCooldownRemaining > 0;
    const paLabel = paCooldownRemaining > 0
        ? `PUBLIC ADDRESS (${paCooldownRemaining} TICK CD)`
        : 'PUBLIC ADDRESS';
    const paCostLabel = `${PROTEST_CONFIG.PUBLIC_ADDRESS_AP} AP`;

    // EPO: only on T6, only Interior owner
    const epoDisabled = !ownsInterior || ap < 2 || isTier7;
    const epoNote = isTier7 ? 'T6 only' : '33% resolve / 66% escalate to T7';

    // National Emergency: only lead party, 5 AP
    const neDisabled = !isLeadParty || ap < 5;

    let actionsHtml = `<div class="protest-crisis-card__actions">`;

    // Public Address button
    actionsHtml += `<div class="protest-crisis-btn${paDisabled ? ' disabled' : ''}" onclick="${paDisabled ? '' : `protestCrisisAction('public_address')`}">
        <span>${paLabel}</span>
        <span>${paCostLabel}</span>
    </div>`;

    // EPO button

let _protestCrisisActionLock = false;

async function protestCrisisAction(actionType) {
    if (_protestCrisisActionLock || !_protestCrisisData || !currentFaction || !currentNation) return;
    _protestCrisisActionLock = true;

    const protestId = _protestCrisisData.id;
    let result;

    try {
        if (actionType === 'public_address') {
            result = await executePublicAddress(_supabase, currentFaction.id, currentNation.id, protestId, currentTick);
        } else if (actionType === 'epo') {
            if (!confirm('Enforce Public Order on the protest?\n\n33% chance the crisis ends. 66% chance it escalates to The Big One (Tier 7).\n\nProceed?')) {
                _protestCrisisActionLock = false;
                return;
            }
            result = await executeEPOOnCrisis(_supabase, currentFaction.id, currentNation.id, protestId, currentTick);
        } else if (actionType === 'national_emergency') {
            if (!confirm('Declare a National Emergency to end the protest crisis?\n\nThis will cause:\n• Civil Unrest +15\n• Political Violence +10\n• Happiness −10\n• Government Approval −10\n\nAre you sure?')) {
                _protestCrisisActionLock = false;
                return;
            }
            result = await executeNationalEmergencyOnProtest(_supabase, currentFaction.id, currentNation.id, protestId, currentTick);
        }

        if (result && result.success) {
            // Update local AP
            if (result.newAp != null) currentFaction.action_points = result.newAp;
            sessionStorage.removeItem('nationhood_state');

            if (actionType === 'epo' && result.outcome === 'escalated') {
                alert('The crackdown backfired! The protest has escalated to The Big One (Tier 7).');
            } else if (actionType === 'epo' && result.outcome === 'resolved') {
                alert('The crackdown succeeded. The protest crisis has been resolved.');
            } else if (actionType === 'national_emergency') {
                alert('National Emergency declared. The crisis has ended, but at a severe cost to stability.');
            } else if (actionType === 'public_address') {
                // Subtle feedback — no alert, just re-render
            }

            await renderGovernmentPage();
        } else if (result) {
            alert(result.error || 'Action failed.');
        }
    } catch (e) {
        alert('Error: ' + (e.message || 'Unknown error'));
    } finally {
        _protestCrisisActionLock = false;
    }
}

// --- Main render ---

function renderCabinet(ministries, coalition) {
    const ministryMap = {};
    if (ministries) ministries.forEach(m => { ministryMap[m.ministry_key] = m; });

    const isCaretaker = coalition && coalition.status === 'caretaker';
    const pmMinistry = ministries?.find(m => m.ministry_key === 'prime_minister');
    const pmFilled = pmMinistry && pmMinistry.minister_first_name && pmMinistry.minister_last_name;
    const isPMParty = currentFaction && coalition && currentFaction.id === coalition.lead_party_id;
    const canAppoint = isPMParty && pmFilled && !isCaretaker;

    let govType = 'parliamentary';
    if (isAutocracy) govType = 'autocracy';
    else if (isPresidential) govType = 'presidential';

    // Determine which keys to show (presidential/parliamentary skip PM)
    const keys = isAutocracy
        ? MINISTRY_KEYS_CABINET
        : MINISTRY_KEYS_CABINET.filter(k => k !== 'prime_minister');

    if ((!ministries || ministries.length === 0) && !isAutocracy && !isPresidential) {
        // Parliamentary with coalition allocations but no ministers yet
        if (coalition && coalition.ministry_allocations) {
            const cards = Object.entries(coalition.ministry_allocations)
                .filter(([key]) => key !== 'prime_minister')
                .map(([key, partyId]) => {
                    const party = partyData.find(p => p.party_id === partyId);
                    const title = MINISTRY_NAMES[key] || key;
                    return `<div class="ministry-card vacant">${buildCardHeader(title, '', 0)}
                        <div class="ministry-card__minister">
                            <div class="ministry-card__minister-name" style="color:#3a3a2e;">To be appointed</div>
                            <div class="ministry-card__minister-meta"><span class="party">${escapeHtml(party?.party_name || 'Unknown')}</span></div>
                        </div>
                    </div>`;
                }).join('');
            return `<div class="ministry-grid">${cards}</div>`;
        }
        return '<div class="info-block" style="text-align:center;color:var(--text-secondary);padding:30px;">No cabinet has been formed yet.</div>';
    }

    const cards = keys.map(key => {
        const m = ministryMap[key];
        const title = m?.ministry_name || MINISTRY_NAMES[key] || key;
        const isFilled = m && m.minister_first_name;
        const requests = isAutocracy ? ministryRequests.filter(r => r.ministry_key === key) : [];
        const myRequest = requests.find(r => r.faction_id === currentFaction?.id);
        const isMyMinistry = isFilled && m && currentFaction && m.party_id === currentFaction.id;

        const govContext = {
            type: govType,
            isRuling: isRulingFaction,
            isMyMinistry,
            canAppoint,
            isPMParty,
            isPresidentParty: typeof isPresidentParty !== 'undefined' ? isPresidentParty : false,
            isCaretaker,
            requests,
            myRequest
        };

        // Presidential pending nomination
        if (isPresidential && m && m.confirmation_status === 'pending' && m.pending_minister) {
            const pm = m.pending_minister;
            const nomineeParty = allParties.find(p => p.id === pm.party_id);
            return `<div class="ministry-card">${buildCardHeader(title, '', 0)}
                <div class="ministry-card__minister">
                    <div class="ministry-card__minister-name" style="color:var(--amber);">${escapeHtml(pm.first_name)} ${escapeHtml(pm.last_name)}</div>
                    <div class="ministry-card__minister-meta">Age ${pm.age || '?'} · <span class="party">${escapeHtml(nomineeParty?.faction_name || 'Unknown')}</span></div>
                </div>
                <div class="ministry-card__pending">
                    <div class="ministry-card__pending-label">AWAITING SENATE CONFIRMATION</div>
                </div>
            </div>`;
        }

        // Presidential acting minister (appointed by executive order)
        if (isPresidential && isFilled && m.confirmation_status === 'acting') {
            const actingParty = allParties.find(p => p.id === m.party_id);
            const headerHtml = buildCardHeader(title, '', requests.length);
            const mgmtHtml = buildMgmtButtons(key, m, govContext);
            const requestListHtml = (govContext.isRuling && requests.length > 0) ? buildRequestList(requests) : '';
            const statsHtml = renderMinistryStatBreakdown(key, m);
            return `<div class="ministry-card">${headerHtml}
                <div class="ministry-card__minister">
                    <div class="ministry-card__minister-name">${escapeHtml(m.minister_first_name || 'Unknown')} ${escapeHtml(m.minister_last_name || '')}</div>
                    <div class="ministry-card__minister-meta">Age ${m.minister_age ?? '?'} · <span class="party">${escapeHtml(actingParty?.faction_name || 'Unknown')}</span></div>
                </div>
                <div class="ministry-card__pending">
                    <div class="ministry-card__pending-label" style="color:var(--amber);">ACTING MINISTER</div>
                </div>
                ${mgmtHtml}${statsHtml}${requestListHtml}
            </div>`;
        }

        // Presidential: skip non-confirmed
        if (isPresidential && isFilled && m.confirmation_status !== 'confirmed') {
            return renderVacantCard(key, title, govContext, requests);
        }

        if (!isFilled) {
            return renderVacantCard(key, title, govContext, requests);
        }

        // Filled card
        const headerHtml = buildCardHeader(title, '', requests.length);
        const identityHtml = buildMinisterIdentity(m);
        const mgmtHtml = buildMgmtButtons(key, m, govContext);
        const requestListHtml = (govContext.isRuling && requests.length > 0) ? buildRequestList(requests) : '';
        const statsHtml = renderMinistryStatBreakdown(key, m);
        const actionsHtml = buildMinistryActionRows(key, isMyMinistry);

        return `<div class="ministry-card">${headerHtml}${identityHtml}${mgmtHtml}${requestListHtml}${statsHtml}${actionsHtml}</div>`;
    }).join('');

    return `<div class="ministry-grid">${cards}</div>`;
}

function renderVacantCard(key, title, govContext, requests) {
    const headerHtml = buildCardHeader(title, '', requests.length);
    const mgmtHtml = buildMgmtButtons(key, null, govContext);
    const requestListHtml = (govContext.isRuling && requests.length > 0) ? buildRequestList(requests) : '';
    return `<div class="ministry-card vacant">${headerHtml}
        <div class="ministry-card__vacant-label">VACANT</div>
        ${mgmtHtml}${requestListHtml}
    </div>`;
}

async function confirmAssign() {
    if (!selectedCandidate || !assignMinistryKey) return;
    try {
        // Validate vacancy before executing (prevents double-click / race condition)
        const { data: freshMinistry } = await _supabase.from('ministries')
            .select('minister_first_name')
            .eq('nation_id', currentNation.id).eq('ministry_key', assignMinistryKey)
            .maybeSingle();
        if (freshMinistry && freshMinistry.minister_first_name) {
            alert('This ministry has already been filled.');
            closeAssignModal();
            await renderGovernmentPage();
            return;
        }

        const existing = ministryData.find(m => m.ministry_key === assignMinistryKey);

        if (existing) {
            const { error } = await _supabase.from('ministries').update({
                party_id: selectedCandidate.partyId,
                minister_first_name: selectedCandidate.firstName,
                minister_last_name: selectedCandidate.lastName,
                minister_age: selectedCandidate.age,
                minister_approval: NEW_MINISTER_APPROVAL,
                stat_baselines: buildMinistryBaselines(assignMinistryKey, currentNation),
                is_active: true
            }).eq('id', existing.id);
            if (error) throw error;
        } else {
            const { error } = await _supabase.from('ministries').insert({
                nation_id: currentNation.id,
                ministry_key: assignMinistryKey,
                ministry_name: MINISTRY_NAMES[assignMinistryKey] || assignMinistryKey,
                party_id: selectedCandidate.partyId,
                minister_first_name: selectedCandidate.firstName,
                minister_last_name: selectedCandidate.lastName,
                minister_age: selectedCandidate.age,
                minister_approval: NEW_MINISTER_APPROVAL,
                stat_baselines: buildMinistryBaselines(assignMinistryKey, currentNation),
                is_active: true
            });
            if (error) throw error;
        }

        // +3% approval to the receiving party
        const receivingParty = allParties.find(p => p.id === selectedCandidate.partyId);
        if (receivingParty) {
            const newApproval = Math.min(100, (receivingParty.approval_rating || 40) + 3);
            await _supabase.from('factions').update({ approval_rating: newApproval })
                .eq('id', selectedCandidate.partyId);
        }

        await _supabase.from('ministry_requests').delete()
            .eq('nation_id', currentNation.id).eq('ministry_key', assignMinistryKey);

        // Log minister appointment for Regime Log
        await _supabase.from('campaign_actions').insert({
            party_id: currentFaction.id,
            nation_id: currentNation.id,
            action_type: 'assign_minister',
            tick_performed: currentTick,
            result: {
                minister_name: `${selectedCandidate.firstName} ${selectedCandidate.lastName}`,
                ministry_key: assignMinistryKey,
                party_name: selectedCandidate.partyName
            }
        });

        // If assigning PM, also update head_of_government, government_formations, and roll over administration
        if (assignMinistryKey === 'prime_minister') {
            // Deactivate any current PM
            await _supabase.from('head_of_government')
                .update({ active: false })
                .eq('nation_id', currentNation.id)
                .eq('active', true);

            // Upsert new PM record (nation_id has unique constraint)
            await _supabase.from('head_of_government').upsert({
                nation_id: currentNation.id,
                faction_id: selectedCandidate.partyId,
                first_name: selectedCandidate.firstName,
                last_name: selectedCandidate.lastName,
                age: selectedCandidate.age,
                active: true
            }, { onConflict: 'nation_id' });

            // Update government_formations.ministry_assignments.prime_minister so
            // coalition.lead_party_id correctly reflects the new PM's party
            try {
                const { data: activeGovFormation } = await _supabase.from('government_formations')
                    .select('id, ministry_assignments')
                    .eq('nation_id', currentNation.id)
                    .in('status', ['formed', 'caretaker'])
                    .order('formed_at', { ascending: false })
                    .limit(1)
                    .maybeSingle();
                if (activeGovFormation) {
                    const updatedAssignments = { ...(activeGovFormation.ministry_assignments || {}), prime_minister: selectedCandidate.partyId };
                    await _supabase.from('government_formations')
                        .update({ ministry_assignments: updatedAssignments })
                        .eq('id', activeGovFormation.id);
                }
            } catch (gfErr) { console.warn('Failed to update government_formations PM assignment:', gfErr); }

            const { data: freshNation } = await _supabase.from('nations').select('*').eq('id', currentNation.id).single();
            const coalition = await fetchActiveCoalition(_supabase, currentNation.id);
            if (freshNation && coalition) {
                try {
                    await rolloverAdministration(
                        _supabase,
                        currentNation.id,
                        freshNation,
                        'pm_replaced',
                        coalition,
                        allParties,
                        currentTick,
                        '',
                        null
                    );
                } catch (adminErr) {
                    throw new Error(`Administration lifecycle failed on PM assign: ${adminErr.message || adminErr}`);
                }
            }
        }


        closeAssignModal();
        alert('✦ ' + selectedCandidate.firstName + ' ' + selectedCandidate.lastName + ' appointed to ' + (MINISTRY_NAMES[assignMinistryKey] || assignMinistryKey) + '!');
        await renderGovernmentPage();
    } catch (e) {
        console.error('Assign error:', e);
        alert('Error: ' + e.message);
    }
}

async function confirmAppointment() {
    if (!selectedCandidate || !assignMinistryKey) return;
    try {
        const { data: fresh } = await _supabase.from('ministries')
            .select('id, minister_first_name')
            .eq('nation_id', currentNation.id)
            .eq('ministry_key', assignMinistryKey)
            .eq('is_active', true)
            .maybeSingle();
        if (!fresh) { alert('Ministry slot not found.'); closeAssignModal(); return; }
        if (fresh.minister_first_name) { alert('This ministry has already been filled.'); closeAssignModal(); await renderGovernmentPage(); return; }

        const { error } = await _supabase.from('ministries').update({
            party_id: selectedCandidate.partyId,
            minister_first_name: selectedCandidate.firstName,
            minister_last_name: selectedCandidate.lastName,
            minister_age: selectedCandidate.age,
            minister_approval: NEW_MINISTER_APPROVAL,
            stat_baselines: buildMinistryBaselines('prime_minister', currentNation)
        }).eq('id', fresh.id);
        if (error) throw error;

        await adjustMomentumAll(_supabase, currentNation.id, selectedCandidate.partyId, 3, 'government:pm_selected');

        // Log minister appointment for Regime Log
        await _supabase.from('campaign_actions').insert({
            party_id: currentFaction.id,
            nation_id: currentNation.id,
            action_type: 'assign_minister',
            tick_performed: currentTick,
            result: {
                minister_name: `${selectedCandidate.firstName} ${selectedCandidate.lastName}`,
                ministry_key: assignMinistryKey,
                party_name: selectedCandidate.partyName
            }
        });

        closeAssignModal();
        await renderGovernmentPage();
    } catch (e) {
        console.error('Appoint minister error:', e);
        alert('Error appointing minister: ' + e.message);
    }
}

// ==================== CLAIM POWER (Autocracy — No Ruler) ====================

async function claimPower() {
    if (!currentFaction || !currentNation) return;
    if (!isAutocracy) return;

    // Race condition guard: re-check that no one claimed power in the meantime
    const { data: freshNation } = await _supabase
        .from('nations')
        .select('ruling_faction_id')
        .eq('id', currentNation.id)
        .single();

    if (freshNation?.ruling_faction_id) {
        alert('Another faction has already claimed power. Refreshing...');
        await renderGovernmentPage();
        return;
    }

    if (!confirm(
        'SEIZE POWER?\n\n' +
        'As the first faction to act, you will claim uncontested control of the government.\n\n' +
        'You will become the Ruling Faction and receive:\n' +
        '- Control of the Head of State\n' +
        '- A Prime Minister from your faction\n' +
        '- All cabinet ministries staffed with your appointees\n' +
        '- Loyalty set to 80\n\n' +
        'Cost: 0 AP\n\nProceed?'
    )) return;

    const btn = document.getElementById('claim-power-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'SEIZING POWER...'; }

    try {
        const { data: shard } = await _supabase
            .from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const tick = shard?.current_tick || 0;

        // 1. Set this faction as the ruling faction
        await _supabase.from('nations')
            .update({ ruling_faction_id: currentFaction.id })
            .eq('id', currentNation.id);

        // 2. Set faction loyalty to 80
        await _supabase.from('factions')
            .update({ loyalty: 80 })
            .eq('id', currentFaction.id);

        // 3. Generate and insert ministry rows for all positions
        const ministryInserts = MINISTRY_KEYS_CABINET.map(key => ({
            nation_id: currentNation.id,
            ministry_key: key,
            ministry_name: MINISTRY_NAMES[key] || key,
            party_id: currentFaction.id,
            minister_first_name: FIRST_NAMES_POOL[Math.floor(Math.random() * FIRST_NAMES_POOL.length)],
            minister_last_name: LAST_NAMES_POOL[Math.floor(Math.random() * LAST_NAMES_POOL.length)],
            minister_age: 35 + Math.floor(Math.random() * 31),
            is_active: true
        }));

        const { error: ministryError } = await _supabase
            .from('ministries').insert(ministryInserts);
        if (ministryError) throw ministryError;

        // 4. Create head_of_government record for the PM
        const pmInsert = ministryInserts.find(m => m.ministry_key === 'prime_minister');
        if (pmInsert) {
            await _supabase.from('head_of_government')
                .update({ active: false })
                .eq('nation_id', currentNation.id)
                .eq('active', true);

            await _supabase.from('head_of_government').upsert({
                nation_id: currentNation.id,
                faction_id: currentFaction.id,
                first_name: pmInsert.minister_first_name,
                last_name: pmInsert.minister_last_name,
                age: pmInsert.minister_age,
                active: true
            }, { onConflict: 'nation_id' });
        }

        // 5. Log to campaign_actions
        await _supabase.from('campaign_actions').insert({
            party_id: currentFaction.id,
            nation_id: currentNation.id,
            action_type: 'claim_power',
            tick_performed: tick,
            result: {
                faction_name: currentFaction.faction_name,
                ministries_assigned: MINISTRY_KEYS_CABINET.length,
                pm_name: pmInsert ? `${pmInsert.minister_first_name} ${pmInsert.minister_last_name}` : null
            }
        });

        // 6. Create initial administration record (non-blocking)
        try {
            const hosName = (currentNation.head_of_state_first_name && currentNation.head_of_state_last_name)
                ? `${currentNation.head_of_state_first_name} ${currentNation.head_of_state_last_name}`
                : null;
            const adminName = pmInsert
                ? `${pmInsert.minister_last_name} Administration`
                : `${currentNation.head_of_state_last_name || currentFaction.faction_name} Administration`;

            await _supabase.from('administrations').insert({
                nation_id: currentNation.id,
                admin_name: adminName,
                head_of_state: hosName,
                prime_minister: pmInsert ? `${pmInsert.minister_first_name} ${pmInsert.minister_last_name}` : null,
                pm_party_name: currentFaction.faction_name,
                pm_party_id: currentFaction.id,
                coalition_parties: [{ party_id: currentFaction.id, party_name: currentFaction.faction_name, seats: currentFaction.seats || 0 }],
                total_seats: currentFaction.seats || 0,
                government_type: CANONICAL_GOVERNMENT_TYPES.AUTOCRACY,
                started_at_tick: tick,
                started_at_date: tickToDate(tick),
                approval_at_start: 50,
                head_of_state_title: currentNation.head_of_state_title || null
            });
        } catch (adminErr) {
            console.warn('Administration record creation failed (non-blocking):', adminErr);
        }

        // 7. Update local state
        currentFaction.loyalty = 80;
        currentNation.ruling_faction_id = currentFaction.id;
        rulingFactionId = currentFaction.id;
        isRulingFaction = true;

        // 8. Clear cache and re-render
        sessionStorage.removeItem('nationhood_state');
        qCacheBust('coalition_');

        alert(
            'POWER SEIZED!\n\n' +
            `${currentFaction.faction_name} now controls the government.\n\n` +
            `Prime Minister: ${pmInsert?.minister_first_name} ${pmInsert?.minister_last_name}\n` +
            `All ${MINISTRY_KEYS_CABINET.length} cabinet positions filled.`
        );

        await renderGovernmentPage();

    } catch (error) {
        console.error('Claim power error:', error);
        alert('Error claiming power: ' + error.message);
        if (btn) { btn.disabled = false; btn.textContent = 'Seize Power'; }
    }
}

// ==================== PURGE MINISTER ====================

async function purgeMinister(ministryKey) {
    if (_govActionLock) return;
    const ministry = ministryData.find(m => m.ministry_key === ministryKey);
    if (!ministry) return;

    const partyName = ministry.factions?.faction_name || 'Unknown';
    const ministerName = ministry.minister_first_name + ' ' + ministry.minister_last_name;

    if (!confirm(
        '⛔ PURGE ' + ministerName + ' from ' + (MINISTRY_NAMES[ministryKey] || ministryKey) + '?\n\n' +
        'Cost: 1 AP\n\n' +
        'Scapegoat Effects:\n' +
        '• ' + partyName + ' loses 2–4 Loyalty and 1–2 Approval\n' +
        '• Your faction gains +4–5 Approval (decays over time)\n' +
        '• Nation: +1 Corruption, Stability shifts ±1–2\n\n' +
        'Proceed?'
    )) return;
    _govActionLock = true;

    const apResult = await deductAP(_supabase, currentFaction.id, 1);
    if (!apResult.success) {
        if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
        alert('Not enough AP (need 1). Current AP: ' + (apResult.currentAp ?? '?'));
        return;
    }
    currentFaction.action_points = apResult.newAp;
    sessionStorage.removeItem('nationhood_state');

    try {
        const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const tick = shard?.current_tick || 0;

        const { data: recentPurges } = await _supabase
            .from('campaign_actions')
            .select('tick_performed')
            .eq('party_id', currentFaction.id)
            .eq('action_type', 'purge_minister')
            .gte('tick_performed', tick - 5);
        const purgeCount = (recentPurges || []).length;

        const loyaltyLoss = 2 + Math.floor(Math.random() * 3);
        const approvalLossPurged = 1 + Math.floor(Math.random() * 2);
        const stabilityRoll = 1 + Math.floor(Math.random() * 2);
        let approvalBoost = 4 + Math.floor(Math.random() * 2);
        let corruptionGain = 1;

        if (purgeCount === 1) {
            approvalBoost = Math.floor(approvalBoost / 2);
        } else if (purgeCount >= 2) {
            approvalBoost = 0;
            corruptionGain = 2;
        }

        const decayTicks = approvalBoost > 0 ? approvalBoost + 1 : 0;

        const { error: clearErr } = await _supabase.from('ministries').update({
            minister_first_name: null, minister_last_name: null, minister_age: null, party_id: null, minister_approval: NEW_MINISTER_APPROVAL, stat_baselines: null
        }).eq('id', ministry.id);
        if (clearErr) throw clearErr;

        // If purging the PM, also deactivate the head_of_government record
        // and close the current administration
        if (ministryKey === 'prime_minister') {
            await _supabase.from('head_of_government')
                .update({ active: false })
                .eq('nation_id', currentNation.id)
                .eq('active', true);

            const { data: fullNation } = await _supabase.from('nations').select('*').eq('id', currentNation.id).single();
            if (fullNation) {
                try {
                    await closeAdministration(_supabase, currentNation.id, fullNation, 'pm_replaced', tick, '', null);
                } catch (adminErr) {
                    throw new Error(`Administration lifecycle failed on PM purge: ${adminErr.message || adminErr}`);
                }
            }
        }

        const rulerApproval = currentFaction.approval_rating ?? 40;
        const newRulerApproval = Math.min(100, rulerApproval + approvalBoost);
        await _supabase.from('factions').update({
            approval_rating: newRulerApproval
        }).eq('id', currentFaction.id);
        currentFaction.approval_rating = newRulerApproval;

        if (ministry.party_id && ministry.party_id !== rulingFactionId) {
            const target = allParties.find(p => p.id === ministry.party_id);
            const currentLoyalty = target?.loyalty ?? 50;
            const currentApproval = target?.approval_rating ?? 50;
            await _supabase.from('factions').update({
                loyalty: Math.max(0, currentLoyalty - loyaltyLoss),
                approval_rating: Math.max(0, currentApproval - approvalLossPurged)
            }).eq('id', ministry.party_id);
        }

        const { data: nation } = await _supabase.from('nations').select('stability, corruption').eq('id', currentNation.id).single();
        const stability = nation?.stability ?? 50;
        const corruption = nation?.corruption ?? 50;

        let stabilityChange;
        if (purgeCount >= 2) {
            stabilityChange = -stabilityRoll;
        } else if (stability >= 50) {
            stabilityChange = -stabilityRoll;
        } else {
            stabilityChange = stabilityRoll;
        }

        await _supabase.from('nations').update({
            stability: Math.max(0, Math.min(100, stability + stabilityChange)),
            corruption: Math.min(100, corruption + corruptionGain)
        }).eq('id', currentNation.id);

        await _supabase.from('campaign_actions').insert({
            party_id: currentFaction.id,
            nation_id: currentNation.id,
            action_type: 'purge_minister',
            tick_performed: tick,
            result: {
                minister_name: ministerName,
                ministry_key: ministryKey,
                target_party: partyName,
                target_party_id: ministry.party_id,
                loyalty_loss: loyaltyLoss,
                approval_loss_target: approvalLossPurged,
                approval_boost: approvalBoost,
                decay_ticks_remaining: decayTicks,
                decay_rate: 1,
                stability_change: stabilityChange,
                corruption_gain: corruptionGain,
                purge_number: purgeCount + 1
            }
        });

        let resultMsg = '⛔ ' + ministerName + ' purged!\n\n';
        resultMsg += partyName + ': -' + loyaltyLoss + ' Loyalty, -' + approvalLossPurged + ' Approval\n';
        if (approvalBoost > 0) {
            resultMsg += 'Your Approval: +' + approvalBoost + ' (will decay over ' + decayTicks + ' ticks)\n';
        } else {
            resultMsg += 'Your Approval: No boost (too many recent purges)\n';
        }
        resultMsg += 'Nation: ' + (stabilityChange >= 0 ? '+' : '') + stabilityChange + ' Stability, +' + corruptionGain + ' Corruption';
        if (purgeCount === 1) resultMsg += '\n\n⚠️ Diminishing returns: 2nd purge in 6 ticks — boost halved.';
        if (purgeCount >= 2) resultMsg += '\n\n🚨 Regime fatigue: 3rd+ purge in 6 ticks — no boost, double corruption.';

        alert(resultMsg);

        await renderGovernmentPage();
    } catch (e) {
        console.error('Purge error:', e);
        alert('Error: ' + e.message);
    } finally { _govActionLock = false; }
}

function renderNoConfidenceButton(coalition) {
    if (!currentFaction || isAutocracy || isPresidential) return '';

    // Only opposition parties can file (not in coalition)
    const isInCoalition = coalition.party_ids.includes(currentFaction.id);
    if (isInCoalition) return '';

    // Parties with no seats cannot file no-confidence
    const mySeats = allPartySeats[currentFaction.id] || currentFaction.seats || 0;
    if (mySeats < 1) {
        return `
            <div id="no-confidence" style="text-align:center;margin-top:16px;padding-top:16px;border-top:1px solid var(--border-main);">
                <button class="ministry-btn purge" style="padding:10px 24px;font-size:0.8rem;" disabled>
                    ⚡ Vote of No Confidence
                </button>
                <div style="font-size:0.7rem;color:var(--text-secondary);margin-top:6px;">Need at least 1 seat in the legislature.</div>
            </div>`;
    }

    return `
        <div id="no-confidence" style="text-align:center;margin-top:16px;padding-top:16px;border-top:1px solid var(--border-main);">
            <button class="ministry-btn purge" style="padding:10px 24px;font-size:0.8rem;" onclick="fileNoConfidence()" id="no-confidence-btn">
                ⚡ Vote of No Confidence <span class="ap-cost">${GAME_CONFIG.NO_CONFIDENCE_AP_COST} AP</span>
            </button>
            <div style="font-size:0.7rem;color:var(--text-secondary);margin-top:6px;">Opposition only — topple the government</div>
        </div>`;
}

async function fileNoConfidence() {
    if (_govActionLock || !currentFaction || !currentNation || !coalitionData) return;

    // Must have at least 1 seat
    const mySeatsCheck = allPartySeats[currentFaction.id] || currentFaction.seats || 0;
    if (mySeatsCheck < 1) {
        alert('Need at least 1 seat in the legislature to file a vote of no confidence.');
        return;
    }

    // Cannot file no-confidence against a caretaker government
    if (coalitionData.status === 'caretaker') {
        alert('Cannot file a vote of no confidence against a caretaker government. Elections are already scheduled.');
        return;
    }

    // Check: must not be in coalition
    if (coalitionData.party_ids.includes(currentFaction.id)) {
        alert('Only opposition parties can file a vote of no confidence.');
        return;
    }

    // Check: no existing pending/floor no-confidence bill for this nation
    const { data: existingMotion } = await _supabase
        .from('bills')
        .select('id')
        .eq('nation_id', currentNation.id)
        .eq('bill_type', 'no_confidence')
        .in('status', ['committee', 'floor'])
        .limit(1)
        .maybeSingle();

    if (existingMotion) {
        alert('A motion of no confidence is already pending.');
        return;
    }

    // Check: 6-tick cooldown since last failed no-confidence (per-party)
    const { data: lastFailed } = await _supabase
        .from('campaign_actions')
        .select('tick_performed')
        .eq('nation_id', currentNation.id)
        .eq('party_id', currentFaction.id)
        .eq('action_type', 'no_confidence_failed')
        .order('tick_performed', { ascending: false })
        .limit(1)
        .maybeSingle();

    if (lastFailed) {
        const ticksSince = currentTick - lastFailed.tick_performed;
        if (ticksSince < GAME_CONFIG.NO_CONFIDENCE_COOLDOWN_TICKS) {
            const remaining = GAME_CONFIG.NO_CONFIDENCE_COOLDOWN_TICKS - ticksSince;
            alert(`Cooldown: ${remaining} tick${remaining !== 1 ? 's' : ''} remaining before another no-confidence vote can be filed.`);
            return;
        }
    }

    // Get PM's last name for the motion title
    const { data: hog } = await _supabase
        .from('head_of_government')
        .select('last_name')
        .eq('nation_id', currentNation.id)
        .eq('active', true)
        .maybeSingle();

    const pmLastName = hog?.last_name || null;
    const motionName = pmLastName
        ? `Motion of No Confidence in the ${pmLastName} Government`
        : `Motion of No Confidence in the Government`;

    if (!confirm(
        `⚡ FILE VOTE OF NO CONFIDENCE?\n\n` +
        `"${motionName}"\n\n` +
        `Cost: ${GAME_CONFIG.NO_CONFIDENCE_AP_COST} AP\n` +
        `Voting period: ${GAME_CONFIG.NO_CONFIDENCE_VOTING_TICKS} ticks\n` +
        `Needs simple majority (YES > NO) to pass.\n\n` +
        `IF IT PASSES:\n` +
        `• Coalition dissolved, PM removed, all ministries vacated\n` +
        `• Your party: +3 Approval\n` +
        `• Coalition parties: -5 Approval each\n\n` +
        `IF IT FAILS:\n` +
        `• Your party: -5 Approval\n` +
        `• PM's party: +3 Approval\n` +
        `• ${GAME_CONFIG.NO_CONFIDENCE_COOLDOWN_TICKS}-tick cooldown\n\n` +
        `Proceed?`
    )) return;
    _govActionLock = true;

    try {
        const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const tick = shard?.current_tick || 0;

        // Create the no-confidence bill — goes directly to floor vote (no committee)
        const { data: bill, error: billError } = await _supabase.from('bills').insert({
            nation_id: currentNation.id,
            proposed_by: currentFaction.id,
            proposed_tick: tick,
            bill_name: motionName,
            bill_type: 'no_confidence',
            status: 'floor',
            floor_tick: tick,
            voting_ends_tick: tick + GAME_CONFIG.NO_CONFIDENCE_VOTING_TICKS,
            proposer_name: currentFaction.faction_name,
            proposer_color: currentFaction.party_color,
            preamble: `This motion, filed by the ${currentFaction.faction_name}, calls for a vote of no confidence in the current government. If passed by simple majority, the coalition will be immediately dissolved.`
        }).select().single();

        if (billError) throw billError;

        // Post-insert guard: verify no duplicate no-confidence motions were created concurrently
        const { count: ncCount } = await _supabase.from('bills')
            .select('id', { count: 'exact', head: true })
            .eq('nation_id', currentNation.id)
            .eq('bill_type', 'no_confidence')
            .in('status', ['committee', 'floor']);
        if (ncCount > 1) {
            // Another motion was filed at the same time — delete ours
            await _supabase.from('bills').delete().eq('id', bill.id);
            alert('Another motion of no confidence was just filed. Please refresh.');
            return;
        }

        // Deduct AP only after bill creation succeeds
        const apResult = await deductAP(_supabase, currentFaction.id, GAME_CONFIG.NO_CONFIDENCE_AP_COST);
        if (!apResult.success) {
            if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
            alert('Not enough AP. Need ' + GAME_CONFIG.NO_CONFIDENCE_AP_COST + ' AP, have ' + (apResult.currentAp ?? '?') + '.');
            return;
        }
        currentFaction.action_points = apResult.newAp;

        // Auto-cast the filer's own vote as YES
        const seatData = await loadSeats(_supabase, currentNation.id, false, allParties, currentFaction.id);
        const mySeats = seatData.allPartySeats[currentFaction.id] || 0;
        await _supabase.from('bill_support').upsert({
            bill_id: bill.id,
            faction_id: currentFaction.id,
            stance: 'yes',
            seat_count: mySeats
        }, { onConflict: 'bill_id,faction_id' });



        alert(`⚡ "${motionName}" has been filed!\n\nVoting is now open for ${GAME_CONFIG.NO_CONFIDENCE_VOTING_TICKS} ticks. All parties will vote.`);
        window.location.href = `bill.html?id=${bill.id}`;
    } catch (e) {
        console.error('No confidence error:', e);
        alert('Error: ' + e.message);
    } finally { _govActionLock = false; }
}
