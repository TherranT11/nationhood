                <div style="font-size: 0.85rem; color: #888;">Waiting for ${allParties.find(p => p.id === pmPartyId)?.faction_name || 'the PM\'s party'} to form the government.</div>
            ` : `
                <div style="font-size: 0.85rem; color: #888;">Assign a Prime Minister to enable government formation.</div>
            `}
        </div>
    `;

    const chatEl = document.getElementById('formation-chat-messages');
    if (chatEl) chatEl.scrollTop = chatEl.scrollHeight;
}

function renderFormationChatMessage(msg) {
    const isMine = msg.faction_id === currentFaction.id;
    const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return `
        <div class="chat-msg ${isMine ? 'mine' : ''}">
            <div class="chat-msg-author">${msg.faction_name}</div>
            <div class="chat-msg-bubble">${escapeHtml(msg.message)}</div>
            <div class="chat-msg-time">${time}</div>
        </div>`;
}

// ===== Realtime Subscriptions =====

function setupFormationRealtimeSubscriptions(formationId) {
    formationRealtimeChannel = _supabase.channel('formation-' + formationId)
        .on('postgres_changes', {
            event: 'UPDATE', schema: 'public', table: 'government_formations',
            filter: `id=eq.${formationId}`
        }, (payload) => {
            const f = payload.new;
            updateMinistriesFromRealtime(f.ministry_assignments || {}, f.minister_names || {});
            refreshFormButton(f.ministry_assignments || {});
        })
        .on('postgres_changes', {
            event: '*', schema: 'public', table: 'government_formation_support',
            filter: `formation_id=eq.${formationId}`
        }, async () => {
            const { data: supports } = await _supabase
                .from('government_formation_support').select('faction_id, supports').eq('formation_id', formationId);
            formationSupportMap = {};
            (supports || []).forEach(s => {
                if (activeFormationPartyIds.includes(s.faction_id)) formationSupportMap[s.faction_id] = s.supports;
            });
            refreshSupportBar();
            refreshFormButton();
        })
        .on('postgres_changes', {
            event: 'INSERT', schema: 'public', table: 'government_formation_chat',
            filter: `formation_id=eq.${formationId}`
        }, (payload) => {
            const msg = payload.new;
            if (formationChatMessages.find(m => m.id === msg.id)) return;
            formationChatMessages.push(msg);
            const chatEl = document.getElementById('formation-chat-messages');
            if (chatEl) {
                const empty = chatEl.querySelector('.chat-empty');
                if (empty) empty.remove();
                chatEl.insertAdjacentHTML('beforeend', renderFormationChatMessage(msg));
                chatEl.scrollTop = chatEl.scrollHeight;
            }
        })
        .subscribe();
}

function updateMinistriesFromRealtime(assignments, ministerNames) {
    FORMATION_MINISTRIES.forEach(m => {
        if (m.inactive) return;
        const sel = document.getElementById(`ministry-select-${m.key}`);
        if (sel && sel !== document.activeElement) sel.value = assignments[m.key] || '';

        const row = document.getElementById(`ministry-row-${m.key}`);
        if (row) {
            let nameEl = row.querySelector('.ministry-minister-name');
            const minister = ministerNames[m.key];
            if (minister) {
                const nameStr = `${minister.first_name} ${minister.last_name}, Age ${minister.age}`;
                if (nameEl) nameEl.textContent = nameStr;
                else row.querySelector('.ministry-info').insertAdjacentHTML('beforeend', `<div class="ministry-minister-name">${nameStr}</div>`);
            } else if (nameEl) { nameEl.remove(); }
        }
    });
}

function refreshSupportBar() {
    const bar = document.getElementById('support-bar');
    if (!bar) return;

    const coalitionParties = allParties.filter(p => activeFormationPartyIds.includes(p.id));
    const iAmInCoalition = activeFormationPartyIds.includes(currentFaction.id);

    const supportHTML = coalitionParties.map(p => {
        const s = formationSupportMap[p.id];
        const isYou = p.id === currentFaction.id;
        let statusHTML = s === true
            ? `<span class="support-status yes">✓ SUPPORTING</span>`
            : `<span class="support-status pending">— NON-SUPPORTING</span>`;

        let toggleHTML = '';
        if (isYou) {
            const currentlySupports = formationSupportMap[currentFaction.id] === true;
            toggleHTML = currentlySupports
                ? `<button class="support-toggle-btn btn-withdraw" onclick="toggleFormationSupport(false)">Withdraw Support</button>`
                : `<button class="support-toggle-btn btn-support" onclick="toggleFormationSupport(true)">Support</button>`;
        }

        return `
            <div class="support-row">
                <span class="support-party-name">${p.faction_name}${isYou ? '<span class="you-tag">(You)</span>' : ''}</span>
                <div style="display:flex; align-items:center; gap:12px;">${statusHTML}${toggleHTML}</div>
            </div>`;
    }).join('');

    bar.innerHTML = `
        <div class="support-bar-title">Coalition Support</div>
        ${supportHTML}
        ${iAmInCoalition ? '<div class="support-exclusive-note">You may only support one coalition at a time. Supporting this one will withdraw support from any other.</div>' : ''}
    `;
}

async function refreshFormButton(assignments) {
    if (!assignments) {
        const { data: f } = await _supabase.from('government_formations').select('ministry_assignments').eq('id', activeFormationId).single();
        assignments = f?.ministry_assignments || {};
    }

    const coalitionParties = allParties.filter(p => activeFormationPartyIds.includes(p.id));
    const coalitionSeats = getCoalitionSeats(activeFormationPartyIds);
    const meetsThreshold = coalitionSeats >= GAME_CONFIG.MAJORITY_SEATS;

    const pmPartyId = assignments.prime_minister || null;
    const isPMParty = pmPartyId === currentFaction.id;
    const allCoalitionSupport = coalitionParties.every(p => formationSupportMap[p.id] === true);
    const allAssigned = FORMATION_MINISTRIES.filter(m => !m.inactive).every(m => assignments[m.key]);
    const canForm = isPMParty && allCoalitionSupport && allAssigned && meetsThreshold;

    const blockers = [];
    if (!allAssigned) blockers.push('All ministries must be assigned.');
    if (!allCoalitionSupport) {
        const supportCount = coalitionParties.filter(p => formationSupportMap[p.id] === true).length;
        blockers.push(`${supportCount}/${coalitionParties.length} coalition members supporting.`);
    }
    if (!meetsThreshold) blockers.push(`Coalition has ${coalitionSeats} seats (need ${GAME_CONFIG.MAJORITY_SEATS}).`);

    const section = document.getElementById('form-gov-section');
    if (!section) return;

    if (isPMParty) {
        section.innerHTML = `
            <button class="form-gov-btn" id="form-gov-btn" onclick="formGovernment()" ${canForm ? '' : 'disabled'}>Form Government</button>
            ${!canForm ? `<div style="font-size: 0.8rem; color: #888; margin-top: 8px;">${blockers.join(' ')}</div>` : ''}`;
    } else if (pmPartyId) {
        section.innerHTML = `<div style="font-size: 0.85rem; color: #888;">Waiting for ${allParties.find(p => p.id === pmPartyId)?.faction_name || 'the PM\'s party'} to form the government.</div>`;
    } else {
        section.innerHTML = `<div style="font-size: 0.85rem; color: #888;">Assign a Prime Minister to enable government formation.</div>`;
    }
}

// ===== Actions: Ministry change, Support, Chat, Form =====

async function onMinistryChange(ministryKey, partyId) {
    if (!activeFormationId) return;
    try {
        if (ministryKey === 'prime_minister') {
            const { data: formation } = await _supabase.from('government_formations')
                .select('ministry_assignments, minister_names')
                .eq('id', activeFormationId).single();
            const assignments = formation?.ministry_assignments || {};
            const ministerNames = formation?.minister_names || {};

            if (partyId) {
                assignments.prime_minister = partyId;
                const { data: party } = await _supabase.from('factions')
                    .select('leader_first_name, leader_last_name, leader_age')
                    .eq('id', partyId).single();
                if (party?.leader_first_name) {
                    ministerNames.prime_minister = {
                        first_name: party.leader_first_name,
                        last_name: party.leader_last_name,
                        age: party.leader_age
                    };
                } else {
                    delete ministerNames.prime_minister;
                }
            } else {
                delete assignments.prime_minister;
                delete ministerNames.prime_minister;
            }

            const { error } = await _supabase.from('government_formations')
                .update({ ministry_assignments: assignments, minister_names: ministerNames })
                .eq('id', activeFormationId);
            if (error) throw error;
            refreshFormButton(assignments);
        } else {
            const { data, error } = await _supabase.rpc('assign_ministry', {
                p_formation_id: activeFormationId, p_ministry_key: ministryKey, p_party_id: partyId || ''
            });
            if (error) throw error;
            if (!data.success) alert(data.message);
        }
    } catch (err) { alert('Error: ' + err.message); }
}

async function toggleFormationSupport(supports) {
    if (!activeFormationId) return;

    // DB trigger now handles exclusive support automatically —
    // no need for client-side loop to withdraw from other coalitions

    try {
        const { data, error } = await _supabase.rpc('toggle_formation_support', {
            p_formation_id: activeFormationId, p_faction_id: currentFaction.id, p_supports: supports
        });
        if (error) throw error;
        if (!data.success) alert(data.message);
    } catch (err) { alert('Error: ' + err.message); }
}

async function sendFormationChatMessage() {
    const input = document.getElementById('formation-chat-input');
    if (!input) return;
    const message = input.value.trim();
    if (!message || !activeFormationId) return;

    input.value = '';
    input.disabled = true;
    try {
        const { error } = await _supabase.from('government_formation_chat').insert({
            formation_id: activeFormationId, faction_id: currentFaction.id,
            faction_name: currentFaction.faction_name, message: message
        });
        if (error) throw error;
    } catch (err) { alert('Error sending message: ' + err.message); input.value = message; }
    input.disabled = false;
    input.focus();
}

// ===== Edit Coalition Composition =====

function toggleEditCoalition() {
    const panel = document.getElementById('edit-coalition-panel');
    if (!panel) return;
    const showing = panel.style.display !== 'none';
    panel.style.display = showing ? 'none' : 'block';
    if (!showing) {
        editSelectedParties = [...activeFormationPartyIds];
        document.querySelectorAll('#edit-party-grid .party-checkbox-item').forEach(el => {
            const pid = el.getAttribute('data-party-id');
            const inCoalition = editSelectedParties.includes(pid);
            el.classList.toggle('checked', inCoalition);
            el.querySelector('.party-check-box').textContent = inCoalition ? '✓' : '';
        });
        updateEditSeatPreview();
    }
    document.getElementById('edit-coalition-btn').textContent = showing ? 'Edit Coalition' : 'Cancel Edit';
}

function toggleEditParty(el, partyId) {
    const idx = editSelectedParties.indexOf(partyId);
    if (idx > -1) {
        editSelectedParties.splice(idx, 1);
        el.classList.remove('checked');
        el.querySelector('.party-check-box').textContent = '';
    } else {
        editSelectedParties.push(partyId);
        el.classList.add('checked');
        el.querySelector('.party-check-box').textContent = '✓';
    }
    updateEditSeatPreview();
}

function updateEditSeatPreview() {
    const previewSeats = document.getElementById('edit-preview-seats');
    const previewPct = document.getElementById('edit-preview-pct');
    const previewThreshold = document.getElementById('edit-preview-threshold');
    if (!previewSeats) return;

    const seats = getCoalitionSeats(editSelectedParties);
    const pct = totalLegislatureSeats ? Math.round((seats / totalLegislatureSeats) * 100) : 0;
    const meets = seats >= GAME_CONFIG.MAJORITY_SEATS;

    previewSeats.textContent = seats;
    previewSeats.className = 'preview-seats ' + (meets ? 'meets' : 'below');
    previewPct.textContent = pct;
    previewThreshold.textContent = meets ? `✓ Meets ${GAME_CONFIG.MAJORITY_SEATS}-seat threshold` : `— needs ${GAME_CONFIG.MAJORITY_SEATS} seats`;
    previewThreshold.style.color = meets ? 'var(--green)' : 'var(--text-secondary)';
}

async function saveCoalitionEdit(formationId) {
    if (!editSelectedParties.includes(currentFaction.id)) {
        alert('Your party must remain in the coalition.');
        return;
    }
    const editSeats = getCoalitionSeats(editSelectedParties);
    if (editSeats < GAME_CONFIG.MAJORITY_SEATS) {
        alert(`Your coalition does not meet the ${GAME_CONFIG.MAJORITY_SEATS}-seat threshold. Add more parties.`);
        return;
    }

    const removedParties = activeFormationPartyIds.filter(pid => !editSelectedParties.includes(pid));

    try {
        for (const pid of removedParties) {
            await _supabase.from('government_formation_support')
                .delete().eq('formation_id', formationId).eq('faction_id', pid);
        }

        const { data: formation } = await _supabase
            .from('government_formations').select('ministry_assignments, minister_names').eq('id', formationId).single();
        const assignments = formation?.ministry_assignments || {};
        const ministerNames = formation?.minister_names || {};
        let changed = false;
        for (const [key, val] of Object.entries(assignments)) {
            if (removedParties.includes(val)) {
                assignments[key] = null;
                delete ministerNames[key];
                changed = true;
            }
        }

        const updatePayload = { party_ids: editSelectedParties };
        if (changed) {
            updatePayload.ministry_assignments = assignments;
            updatePayload.minister_names = ministerNames;
        }

        const { error } = await _supabase.from('government_formations')
            .update(updatePayload).eq('id', formationId);
        if (error) throw error;

        activeFormationPartyIds = [...editSelectedParties];
        await openFormation(formationId);
    } catch (err) { alert('Error updating coalition: ' + err.message); }
}

async function retractProposal(formationId) {
    if (!confirm('Are you sure you want to retract this coalition proposal? This will remove it for all parties.')) return;
    try {
        await _supabase.from('government_formation_support').delete().eq('formation_id', formationId);
        await _supabase.from('government_formation_chat').delete().eq('formation_id', formationId);
        const { error } = await _supabase.from('government_formations').delete().eq('id', formationId).eq('proposed_by', currentFaction.id);
        if (error) throw error;

        if (formationRealtimeChannel) { _supabase.removeChannel(formationRealtimeChannel); formationRealtimeChannel = null; }
        activeFormationId = null;
        activeFormationPartyIds = [];
        await loadFormationsList();
    } catch (err) { alert('Error retracting proposal: ' + err.message); }
}

// ===== Form Government =====

async function formGovernment() {
    if (_formingInProgress) return;
    if (!activeFormationId) return;
    if (!confirm('Form this government? This will finalize all ministry assignments.')) return;
    _formingInProgress = true;
    try {
        // First call the existing form_government RPC to validate and set status
        const { data: formResult, error: formError } = await _supabase.rpc('form_government', {
            p_formation_id: activeFormationId, p_caller_faction_id: currentFaction.id
        });
        if (formError) throw formError;
        if (!formResult.success) { alert(formResult.message); return; }

        // If HoS method is 'appointed', clear the HoS so formation auto-generates a new one
        // If 'hereditary', skip — monarch is permanent
        const { data: preNation } = await _supabase.from('nations').select('hos_election_method').eq('id', currentNation.id).single();
        if (preNation?.hos_election_method === 'appointed') {
            await _supabase.from('nations').update({
                head_of_state_first_name: null,
                head_of_state_last_name: null,
                head_of_state_age: null
            }).eq('id', currentNation.id);
        }

        // Compute ministry baselines from current nation state
        const { data: freshNation } = await _supabase.from('nations').select('*').eq('id', currentNation.id).single();
        const ministryBaselines = {};
        FORMATION_MINISTRIES.forEach(m => {
            if (!m.inactive) {
                ministryBaselines[m.key] = buildMinistryBaselines(m.key, freshNation || currentNation);
            }
        });

        // Try the new atomic RPC
        const { data: finalizeResult, error: finalizeError } = await _supabase.rpc('finalize_government_formation', {
            p_formation_id: activeFormationId,
            p_caller_faction_id: currentFaction.id,
            p_ministry_baselines: ministryBaselines
        });

        if (finalizeError) {
            // RPC might not be deployed yet — fall back to sequential client-side operations
            const rpcUnavailable = /finalize_government_formation/i.test(finalizeError.message || '') || finalizeError.code === 'PGRST202';
            if (!rpcUnavailable) throw finalizeError;

            console.warn('finalize_government_formation RPC unavailable; falling back to sequential operations');
            await formGovernmentFallback(ministryBaselines);
        } else if (finalizeResult && !finalizeResult.success) {
            alert(finalizeResult.message);
            return;
        }

        alert(finalizeResult?.message || formResult.message);
        if (formationRealtimeChannel) { _supabase.removeChannel(formationRealtimeChannel); formationRealtimeChannel = null; }
        sessionStorage.removeItem('nationhood_state');
        location.reload();
    } catch (err) { alert('Error: ' + err.message); }
    finally { _formingInProgress = false; }
}

// Fallback for when finalize_government_formation RPC is not deployed
async function formGovernmentFallback(ministryBaselines) {
    await dissolveCoalition(_supabase, currentNation.id, activeFormationId);

    await _supabase.from('nations')
        .update({ failed_formation_attempts: 0 })
        .eq('id', currentNation.id);

    // Cancel any pending snap elections — government formed, no longer needed
    const { data: shardForSnap } = await _supabase.from('shard')
        .select('current_tick').eq('name', 'Alpha Shard').single();
    if (shardForSnap) {
        await _supabase.from('elections')
            .update({ status: 'cancelled' })
            .eq('nation_id', currentNation.id)
            .eq('status', 'scheduled')
            .is('election_type', null)
            .lte('election_tick', shardForSnap.current_tick + 5);
        // Also cancel parliamentary-typed snap elections
        await _supabase.from('elections')
            .update({ status: 'cancelled' })
            .eq('nation_id', currentNation.id)
            .eq('status', 'scheduled')
            .eq('election_type', 'parliamentary')
            .lte('election_tick', shardForSnap.current_tick + 5);
    }

    await _supabase.from('government_formations')
        .update({ status: 'cancelled' })
        .eq('nation_id', currentNation.id)
        .eq('status', 'active')
        .neq('id', activeFormationId);

    await _supabase.from('bills')
        .update({ status: 'failed' })
        .eq('nation_id', currentNation.id)
        .eq('status', 'frozen');

    const { data: formation } = await _supabase
        .from('government_formations')
        .select('ministry_assignments, minister_names')
        .eq('id', activeFormationId)
        .single();

    const assignments = formation?.ministry_assignments || {};
    const ministerNames = formation?.minister_names || {};
    const pmPartyId = assignments.prime_minister;

    for (const [ministryKey, partyId] of Object.entries(assignments)) {
        if (!partyId || ministryKey === 'prime_minister') continue;
        const minister = ministerNames[ministryKey];
        if (!minister) continue;

        const ministryPayload = {
            party_id: partyId,
            minister_first_name: minister.first_name,
            minister_last_name: minister.last_name,
            minister_age: minister.age,
            minister_approval: NEW_MINISTER_APPROVAL,
            stat_baselines: ministryBaselines[ministryKey] || {}
        };

        const { data: existing } = await _supabase.from('ministries')
            .select('id').eq('nation_id', currentNation.id)
            .eq('ministry_key', ministryKey).eq('is_active', true)
            .maybeSingle();

        if (existing) {
            await _supabase.from('ministries').update(ministryPayload).eq('id', existing.id);
        } else {
            await _supabase.from('ministries').insert({
                nation_id: currentNation.id,
                ministry_key: ministryKey,
                ministry_name: FORMATION_MINISTRIES.find(m => m.key === ministryKey)?.name || ministryKey,
                is_active: true,
                ...ministryPayload
            });
        }
    }

    // If HoS method is 'appointed', always generate a new HoS; if 'hereditary', keep existing monarch
    const fallbackHosMethod = currentNation.hos_election_method || null;
    const forceNewHos = fallbackHosMethod === 'appointed';
    // Auto-generate Head of State if missing (or forced by appointed method)
    const hasValidHosAge = Number.isFinite(Number(currentNation.head_of_state_age)) && Number(currentNation.head_of_state_age) > 0;
    if (fallbackHosMethod !== 'hereditary' && (forceNewHos || !currentNation.head_of_state_first_name || !currentNation.head_of_state_last_name || !hasValidHosAge)) {
        const HOS_FIRST = ['Alejandro','Camila','Diego','Valentina','Mateo','Isabela','Sebastián','Luca','Andrés','Gabriel','Joaquín','Mariana','Carlos','Tomas','Rafael','Edwin','Emilio','Catalina','Fernando','Renata'];
        const HOS_LAST = ['Velasco','Mendoza','Guerrero','Salazar','Castillo','Herrera','Morales','Ríos','Delgado','Espinoza','Guzmán','Navarro','Córdoba','Echeverría','Pacheco','Montero','Aguilar','Valenzuela','Carrasco','Ibarra'];
        const hosFirst = forceNewHos ? HOS_FIRST[Math.floor(Math.random() * HOS_FIRST.length)] : (currentNation.head_of_state_first_name || HOS_FIRST[Math.floor(Math.random() * HOS_FIRST.length)]);
        const hosLast = forceNewHos ? HOS_LAST[Math.floor(Math.random() * HOS_LAST.length)] : (currentNation.head_of_state_last_name || HOS_LAST[Math.floor(Math.random() * HOS_LAST.length)]);
        const hosAge = forceNewHos ? (45 + Math.floor(Math.random() * 25)) : (hasValidHosAge ? Number(currentNation.head_of_state_age) : (45 + Math.floor(Math.random() * 25)));
        try {
            await _supabase.from('nations').update({
                head_of_state_first_name: hosFirst, head_of_state_last_name: hosLast, head_of_state_age: hosAge
            }).eq('id', currentNation.id);
        } catch (hosErr) { console.warn('Could not set head of state:', hosErr); }
    }

    if (pmPartyId) {
        const { data: shard } = await _supabase.from('shard')
            .select('current_tick, current_date').eq('name', 'Alpha Shard').single();

        const { data: fullNation } = await _supabase.from('nations').select('*').eq('id', currentNation.id).single();
        const { data: allFactions } = await _supabase.from('factions')
            .select('id, faction_name, seats, approval_rating')
            .eq('nation_id', currentNation.id).eq('faction_type', 'party');
        const { data: newFormation } = await _supabase.from('government_formations')
            .select('party_ids, ministry_assignments, proposed_by')
            .eq('id', activeFormationId).single();
        if (newFormation) {
            newFormation.lead_party_id = newFormation.ministry_assignments?.prime_minister || newFormation.proposed_by;
        }
        if (fullNation && newFormation) {
            const { data: recentElection } = await _supabase.from('elections')
                .select('election_tick').eq('nation_id', currentNation.id)
                .eq('status', 'completed').order('election_tick', { ascending: false }).limit(1).maybeSingle();
            const endReason = (recentElection && (shard?.current_tick - recentElection.election_tick) <= 8)
                ? 'election_loss' : 'new_coalition';

            const coalitionFactions = (allFactions || []).filter(f =>
                (newFormation.party_ids || []).includes(f.id));
            const govApproval = coalitionFactions.length > 0
                ? Math.round(coalitionFactions.reduce((sum, f) => sum + (f.approval_rating ?? 40), 0) / coalitionFactions.length)
                : null;

            try {
                await rolloverAdministration(_supabase, currentNation.id, fullNation, endReason, newFormation, allFactions || [], shard?.current_tick || 0, shard?.current_date || '', govApproval);
            } catch (adminErr) { console.error('Administration lifecycle error (non-fatal):', adminErr); }
        }

        try {
            await autoAppointPartyLeaderAsPM(_supabase, currentNation.id, pmPartyId, shard?.current_tick || 0);
        } catch (pmErr) { console.error('Auto-appoint PM failed:', pmErr); }
    }
}

// ==================== MINISTRY STAT BREAKDOWN ====================

/**
 * Build a collapsible stat breakdown panel for a ministry card.
 * Shows each stat's current value, delta since appointment, and a colored
 * indicator showing whether the stat moved in a good or bad direction.
 *
 * @param {string} ministryKey - e.g. 'finance', 'healthcare'
 * @param {object} [ministry] - ministry row (with stat_baselines) for delta display
 * @returns {string} HTML string (empty if no stats mapped)
 */
function renderMinistryStatBreakdown(ministryKey, ministry) {
    const stats = MINISTRY_TO_STATS[ministryKey];
    if (!stats || stats.length === 0 || !currentNation) return '';

    const DELTA_SENSITIVITY = 0.6; // must match MINISTER_APPROVAL_CONFIG.DELTA_SENSITIVITY
    const BASELINE_DECAY = -0.5;   // must match MINISTER_APPROVAL_CONFIG.BASELINE_DECAY

    const panelId = 'mstat-' + ministryKey;
    const baselines = ministry?.stat_baselines || {};
    let rows = '';
    let deltaSum = 0;
    let deltaCount = 0;

    // First pass: count stats so we can compute per-stat effect share
    let statCount = 0;
    for (const statKey of stats) {
        if (statDirectionSign(statKey) !== 0) statCount++;
    }

    for (const statKey of stats) {
        const value = Number(currentNation[statKey] ?? 50);
        const rounded = Math.round(value * 10) / 10;
        const sign = statDirectionSign(statKey);

        if (sign === 0) continue; // skip neutral stats

        const baseline = baselines[statKey] != null ? Number(baselines[statKey]) : null;
        const hasDelta = baseline !== null;
        const baselineRounded = hasDelta ? Math.round(baseline * 10) / 10 : '—';

        // Delta in the "good" direction: positive = improvement, negative = worsening
        const rawDelta = hasDelta ? value - baseline : 0;
        const goodDelta = rawDelta * sign; // normalized: positive = good
        const absDelta = Math.abs(rawDelta);
        const deltaRounded = Math.round(absDelta * 10) / 10;

        if (hasDelta) {
            deltaSum += goodDelta;
            deltaCount++;
        }

        // Per-stat effect on approval: (goodDelta / statCount) * DELTA_SENSITIVITY
        const effectVal = hasDelta && statCount > 0 ? (goodDelta / statCount) * DELTA_SENSITIVITY : 0;
        const absEffect = Math.abs(effectVal);
        let effectStr = '—';
        let effectCls = 'flat';
        if (hasDelta && absEffect >= 0.01) {
            effectStr = (effectVal > 0 ? '+' : '-') + (Math.round(absEffect * 100) / 100).toFixed(2);
            effectCls = effectVal > 0 ? 'good' : 'bad';
        }

        // Delta display: ↑3.2 or ↓1.5 or —
        let deltaStr = '—';
        let deltaCls = 'flat';
        if (hasDelta && absDelta >= 0.1) {
            const arrow = goodDelta > 0 ? '↑' : '↓';
            deltaStr = arrow + deltaRounded;
            deltaCls = goodDelta > 0 ? 'good' : 'bad';
        } else if (hasDelta) {
            deltaStr = '—';
            deltaCls = 'flat';
        }

        // Colored dot: green = improving, red = worsening, muted = flat
        const dotCls = !hasDelta || absDelta < 0.1 ? 'flat' : goodDelta > 0 ? 'good' : 'bad';

        const label = formatStatName(statKey);
        const directionWord = sign === 1 ? 'Higher is better' : 'Lower is better';
        const tooltip = hasDelta
            ? 'Appointed: ' + baselineRounded + '%. Now: ' + rounded + '%. ' + directionWord + '.'
            : 'No baseline recorded. ' + directionWord + '.';

        rows += '<div class="ministry-stat-row" title="' + escapeHtml(tooltip) + '">'
            + '<span class="stat-name">' + escapeHtml(label) + '</span>'
            + '<span class="stat-appointed">' + (hasDelta ? baselineRounded + '%' : '—') + '</span>'
            + '<span class="stat-val">' + rounded + '%</span>'
            + '<span class="stat-delta ' + deltaCls + '">' + deltaStr + '</span>'
            + '<span class="stat-effect ' + effectCls + '">' + effectStr + '</span>'
            + '<span class="stat-dot ' + dotCls + '">●</span>'
            + '</div>';
    }

    // Foreign Minister: show missing ambassador penalty
    let ambassadorPenalty = 0;
    if (ministryKey === 'foreign' && missingAmbassadorCount > 0) {
        ambassadorPenalty = missingAmbassadorCount * -0.25;
        const penaltyStr = ambassadorPenalty.toFixed(2);
        rows += '<div class="ministry-stat-row" title="' + missingAmbassadorCount + ' nation(s) without an ambassador appointed from your side">'
            + '<span class="stat-name">Missing ambassadors</span>'
            + '<span class="stat-appointed">—</span>'
            + '<span class="stat-val">' + missingAmbassadorCount + '</span>'
            + '<span class="stat-delta bad">↓' + missingAmbassadorCount + '</span>'
            + '<span class="stat-effect bad">' + penaltyStr + '</span>'
            + '<span class="stat-dot bad">●</span>'
            + '</div>';
    }

    // Overall trend line with total per-tick effect
    let trendText = 'No data';
    let trendCls = 'flat';
    if (deltaCount > 0) {
        const avgDelta = deltaSum / deltaCount;
        // Match server logic: baseline decay always applies, delta only when |avgDelta| >= 0.5
        const deltaEffect = Math.abs(avgDelta) >= 0.5 ? avgDelta * DELTA_SENSITIVITY : 0;
        const totalEffect = BASELINE_DECAY + deltaEffect + ambassadorPenalty;
        const absTotal = Math.abs(totalEffect);
        const effectLabel = absTotal >= 0.01
            ? ' (' + (totalEffect > 0 ? '+' : '-') + (Math.round(absTotal * 100) / 100).toFixed(2) + '/tick)'
            : '';
        if (Math.abs(avgDelta) < 0.5) {
            trendText = 'Approval holding steady' + effectLabel;
            trendCls = 'flat';
        } else if (avgDelta > 0) {
            trendText = 'Approval trending upward' + effectLabel;
            trendCls = 'good';
        } else {
            trendText = 'Approval trending downward' + effectLabel;
            trendCls = 'bad';
        }
    }

    return '<button class="ministry-stats-toggle" onclick="event.stopPropagation();this.classList.toggle(\'open\');document.getElementById(\'' + panelId + '\').classList.toggle(\'open\')">'
        + '<span class="chevron">▶</span> Performance Since Appointed'
        + '</button>'
        + '<div class="ministry-stats-panel" id="' + panelId + '">'
        + '<div class="ministry-stat-row ministry-stat-header">'
        + '<span class="stat-name">Stat</span><span class="stat-appointed">Appointed</span><span class="stat-val">Now</span><span class="stat-delta">Change</span><span class="stat-effect">Effect</span><span class="stat-dot"></span></div>'
        + rows
        + '<div class="ministry-stats-footer ' + trendCls + '">Overall: ' + trendText + '</div>'
        + '</div>';
}

function buildMgmtButtons(key, ministry, govContext) {
    const ap = currentFaction?.action_points || 0;
    const isFilled = ministry && ministry.minister_first_name;
    const noAP = ap < 1;
    const disabledStyle = 'style="opacity:0.4;cursor:not-allowed;"';
    let btns = '';

    if (govContext.type === 'autocracy') {
        if (govContext.isRuling) {
            if (isFilled) {
                if (noAP) {
                    btns += `<div class="ministry-card__mgmt-btn ministry-card__mgmt-btn--purge" ${disabledStyle} title="Need 1 AP">PURGE<span class="ministry-card__mgmt-ap">1 AP</span></div>`;
                } else {
                    btns += `<div class="ministry-card__mgmt-btn ministry-card__mgmt-btn--purge" onclick="event.stopPropagation();purgeMinister('${key}')">PURGE<span class="ministry-card__mgmt-ap">1 AP</span></div>`;
                }
            } else {
                btns += `<div class="ministry-card__mgmt-btn ministry-card__mgmt-btn--assign" onclick="event.stopPropagation();openAssignModal('${key}')">ASSIGN</div>`;
            }
        } else if (govContext.isMyMinistry) {
            btns += `<div class="ministry-card__mgmt-btn ministry-card__mgmt-btn--resign" onclick="event.stopPropagation();resignMinistry('${key}')">RESIGN MINISTRY</div>`;
        } else {
            const totalMyRequests = ministryRequests.filter(r => r.faction_id === currentFaction?.id).length;
            if (govContext.myRequest) {
                btns += `<div class="ministry-card__mgmt-btn ministry-card__mgmt-btn--unrequest" onclick="event.stopPropagation();unrequestMinistry('${govContext.myRequest.id}')">UNREQUEST<span class="ministry-card__mgmt-ap">0 AP</span></div>`;
            } else {
                const canRequest = totalMyRequests < 2 && ap >= 1;
                if (canRequest) {
                    btns += `<div class="ministry-card__mgmt-btn ministry-card__mgmt-btn--request" onclick="event.stopPropagation();requestMinistry('${key}')">REQUEST<span class="ministry-card__mgmt-ap">1 AP</span></div>`;
                } else {
                    btns += `<div class="ministry-card__mgmt-btn ministry-card__mgmt-btn--request" ${disabledStyle} title="${totalMyRequests >= 2 ? 'Max 2 requests' : 'Need 1 AP'}">REQUEST<span class="ministry-card__mgmt-ap">1 AP</span></div>`;
                }
            }
        }
    } else if (govContext.type === 'parliamentary') {
        if (govContext.isMyMinistry && !govContext.isCaretaker) {
            btns += `<div class="ministry-card__mgmt-btn ministry-card__mgmt-btn--resign" onclick="event.stopPropagation();resignMinistry('${key}')">RESIGN</div>`;
        }
        if (govContext.isPMParty && !govContext.isCaretaker && !govContext.isMyMinistry && isFilled) {
            if (noAP) {
                btns += `<div class="ministry-card__mgmt-btn ministry-card__mgmt-btn--dismiss" ${disabledStyle} title="Need 1 AP">DISMISS<span class="ministry-card__mgmt-ap">1 AP</span></div>`;
            } else {
                btns += `<div class="ministry-card__mgmt-btn ministry-card__mgmt-btn--dismiss" onclick="event.stopPropagation();fireMinister('${key}')">DISMISS<span class="ministry-card__mgmt-ap">1 AP</span></div>`;
            }
        }
        if (!isFilled && govContext.canAppoint) {
            btns += `<div class="ministry-card__mgmt-btn ministry-card__mgmt-btn--appoint" onclick="event.stopPropagation();openAssignModal('${key}')">APPOINT</div>`;
        }
    } else if (govContext.type === 'presidential') {
        if (govContext.isMyMinistry && !govContext.isPresidentParty) {
            btns += `<div class="ministry-card__mgmt-btn ministry-card__mgmt-btn--resign" onclick="event.stopPropagation();resignMinistry('${key}')">RESIGN</div>`;
        }
        if (govContext.isPresidentParty && isFilled) {
            if (noAP) {
                btns += `<div class="ministry-card__mgmt-btn ministry-card__mgmt-btn--dismiss" ${disabledStyle} title="Need 1 AP">DISMISS<span class="ministry-card__mgmt-ap">1 AP</span></div>`;
            } else {
                btns += `<div class="ministry-card__mgmt-btn ministry-card__mgmt-btn--dismiss" onclick="event.stopPropagation();fireMinister('${key}')">DISMISS<span class="ministry-card__mgmt-ap">1 AP</span></div>`;
            }
        }
        if (!isFilled && govContext.isPresidentParty) {
            btns += `<div class="ministry-card__mgmt-btn ministry-card__mgmt-btn--nominate" onclick="event.stopPropagation();openNominateModal('${key}')">NOMINATE</div>`;
        }
    }

    if (!btns) return '';
    return `<div class="ministry-card__mgmt">${btns}</div>`;
}

function isMyMinistryByKey(ministryKey) {
    if (!currentFaction) return false;
    const m = ministryData.find(md => md.ministry_key === ministryKey);
    return !!(m && m.party_id === currentFaction.id);

function buildMinistryActionRows(ministryKey, isMyMinistry) {
    // Defense ministry has a custom action layout
    if (ministryKey === 'defense') return buildDefenseActionRows(isMyMinistry);
    // Healthcare ministry has a custom action layout (pharmaceutical direction selector)
    if (ministryKey === 'healthcare') return buildHealthcareActionRows(isMyMinistry);
    // Education ministry has a custom action layout
    if (ministryKey === 'education') return buildEducationActionRows(isMyMinistry);

    // Foreign ministry actions live on the Diplomacy page
    if (ministryKey === 'foreign') {
        return `<div class="ministry-card__actions-label">ACTIONS</div>
            <div style="padding:10px 12px;font-size:11px;color:var(--text-secondary);">
                Foreign Ministry actions are conducted in the <a href="diplomacy.html" style="color:var(--accent);text-decoration:underline;">Diplomacy panel</a>.
            </div>`;
    }

    const config = MINISTRY_ACTIONS[ministryKey];
    if (!config || !config.actions || config.actions.length === 0) return '';
    const pop = currentNation?.population || 20000000;
    const ap = currentFaction?.action_points || 0;
    const canUse = isMyMinistry === true;

    // Discretionary balance for this ministry
    const ministry = ministryData.find(m => m.ministry_key === ministryKey);
    const discretionaryBalance = Number(ministry?.discretionary_balance || 0);
    const balFmt = discretionaryBalance >= 1000000000
        ? '$' + (discretionaryBalance / 1000000000).toFixed(1) + 'B'
        : discretionaryBalance >= 1000000
        ? '$' + (discretionaryBalance / 1000000).toFixed(1) + 'M'
        : discretionaryBalance > 0 ? '$' + Math.round(discretionaryBalance).toLocaleString() : '$0';
    const balCls = discretionaryBalance > 0 ? 'color:var(--green)' : 'color:var(--red)';

    let html = `<div class="ministry-card__actions-label" style="display:flex;justify-content:space-between;align-items:center;">
        <span>ACTIONS</span>
        <span style="font-size:8px;font-weight:600;${balCls};letter-spacing:0.03em;">Discretionary Funds: ${balFmt}</span>
    </div>`;
    config.actions.forEach(action => {
        const countKey = ministryKey + ':' + action.id;
        const useCount = ministryActionUseCounts[countKey] || 0;
        const apCost = action.apCosts[Math.min(useCount, 3)];
        const tagsHtml = action.tags.map(t => `<span class="tag tag--${t.cls}">${t.label}</span>`).join('');
        const actionId = ministryKey + '-' + action.id;
        const isActive = activeMinistryActions[actionId] || false;

        // Budget tag: saves (green), no cost, or standard draw
        let budgetTagHtml = '';
        if (action.budgetSavesPerCapita) {
            const saves = formatBudgetDraw(action.budgetSavesPerCapita, pop);
            budgetTagHtml = `<span class="tag tag--positive">SAVES ${saves}/TICK</span>`;
        } else if (action.budgetPerCapita === 0) {
            budgetTagHtml = `<span class="tag tag--neutral">NO TICK COST</span>`;
        } else {
            const budgetDraw = formatBudgetDraw(action.budgetPerCapita, pop);
            budgetTagHtml = `<span class="tag tag--budget">${budgetDraw}/TICK</span>`;
        }

        // Check blocking conditions
        let blockReason = '';
        if (action.id === 'debtRestructuring' && canUse && !isActive) {
            blockReason = getDebtRestructuringBlock();
        }
        // Block money-drawing actions when ministry has no discretionary funds
        if (!blockReason && action.budgetPerCapita > 0 && discretionaryBalance <= 0 && canUse && !isActive) {
            blockReason = 'No Discretionary Funds available.';
        }

        const isBlocked = !!blockReason;
        const isDisabled = !canUse || (ap < apCost && !isActive) || isBlocked;

        let stateClass = '';
        let btnHtml = '';
        if (isActive) {
            stateClass = ' active';
            btnHtml = action.isResolution
                ? '<div class="ministry-action__active-indicator">● NEGOTIATING</div>'
                : '<div class="ministry-action__active-indicator">● ACTIVE</div>';
        } else if (!canUse) {
            stateClass = ' disabled';
            btnHtml = '';
        } else if (isBlocked) {
            stateClass = ' disabled';
            btnHtml = `<div class="ministry-action__btn-execute" style="opacity:0.4;cursor:not-allowed;" title="${escapeHtml(blockReason)}">🔒</div>`;
        } else if (isDisabled) {
            stateClass = ' disabled';
            btnHtml = `<div class="ministry-action__btn-execute" style="opacity:0.4;cursor:not-allowed;" title="Need ${apCost} AP">▶ ${apCost} AP</div>`;
        } else {
            btnHtml = `<div class="ministry-action__btn-execute" onclick="event.stopPropagation();ministryActionSelect('${actionId}')">▶ ${apCost} AP</div>`;
        }

        // For Debt Restructuring, show credit-based chance when not blocked
        let extraInfoHtml = '';
        if (action.id === 'debtRestructuring' && !isActive && !isBlocked) {
            const credit = Number(currentNation?.credit ?? 50);
            const chance = Math.min(100, Math.max(0, Math.round(credit)));
            extraInfoHtml = `<div style="font-family:var(--font-mono);font-size:7px;color:var(--text-muted);margin-top:2px;">Success chance: ${chance}% (Credit: ${credit})</div>`;
        }
        if (isBlocked) {
            extraInfoHtml = `<div style="font-family:var(--font-mono);font-size:7px;color:var(--red);margin-top:2px;">${escapeHtml(blockReason)}</div>`;
        }

        html += `<div class="ministry-action${stateClass}" id="${actionId}" ${canUse && !isActive && !isDisabled ? `onclick="ministryActionSelect('${actionId}')"` : ''}>
            <div class="ministry-action__top">
                <span class="ministry-action__name">${escapeHtml(action.name)}</span>
                <span class="ministry-action__ap-cost">${apCost} AP${useCount > 0 ? ' (use ' + (useCount + 1) + ')' : ''}</span>
            </div>
            <div class="ministry-action__desc">${escapeHtml(action.desc)}${extraInfoHtml}</div>
            <div class="ministry-action__bottom">
                <div class="ministry-action__tags">${tagsHtml}${budgetTagHtml}</div>
                <div id="${actionId}-btns">${btnHtml}</div>
            </div>
        </div>`;
    });
    return html;
}

    const incCost = calculateHealthActionCost(config.directions.increase, pop);
    const decCost = calculateHealthActionCost(config.directions.decrease, pop);

    const incSelected = selDir === 'increase';

    const incStyle = incSelected
        ? 'background:rgba(91,155,213,0.12);border:1px solid rgba(91,155,213,0.3);color:#5b9bd5;'

        ? 'background:rgba(91,155,213,0.12);border:1px solid rgba(91,155,213,0.3);color:#5b9bd5;'

        const cost = selDir === 'increase' ? incCost : decCost;

            <div style="${decStyle}padding:6px 10px;cursor:pointer;font-family:var(--font-mono);font-size:8px;text-transform:uppercase;font-weight:700;letter-spacing:0.04em;" onclick="event.stopPropagation();selectPharmaDirection('decrease')">DECREASE REGULATIONS</div>

async function confirmPharmaceuticalAction(direction) {
    if (_ministryActionConfirming) return;
    _ministryActionConfirming = true;

    const actionId = 'healthcare-pharmaceuticalRegulation';
    const row = document.getElementById(actionId);
    if (!row || !currentFaction || !currentNation) { _ministryActionConfirming = false; return; }
    if (!isMyMinistryByKey('healthcare')) { _ministryActionConfirming = false; return; }

    const config = MINISTRY_ACTIONS.healthcare.actions.find(a => a.id === 'pharmaceuticalRegulation');
    const dirConfig = config.directions[direction];
    if (!dirConfig) { _ministryActionConfirming = false; return; }

    const countKey = 'healthcare:pharmaceuticalRegulation';
    const useCount = ministryActionUseCounts[countKey] || 0;
    const apCost = config.apCosts[Math.min(useCount, 3)];
    const pop = currentNation.population || 20000000;
    const oneTimeCost = calculateHealthActionCost(dirConfig, pop);

    // Check discretionary funds
    const mData = ministryData.find(m => m.ministry_key === 'healthcare');
    const balance = Number(mData?.discretionary_balance || 0);
    if (oneTimeCost > 0 && balance < oneTimeCost) {
        _ministryActionConfirming = false;
        alert('Insufficient discretionary funds.');
        return;
    }

    // Check if opposing direction is active — confirm cancellation
    const existingActive = activeMinistryActions[actionId];
    if (existingActive) {
        const existingDir = typeof existingActive === 'string' ? existingActive : null;
        if (existingDir === direction) {
            // Same direction already active — cannot double-activate
            _ministryActionConfirming = false;
            alert('This direction is already active.');
            return;
        }
        const opposingLabel = existingDir === 'increase' ? 'Increase Regulations'
            : existingDir === 'decrease' ? 'Decrease Regulations' : 'current pharmaceutical policy';
        if (!confirm(`This will immediately cancel your active ${opposingLabel} with no fund refund. Continue?`)) {
            _ministryActionConfirming = false;
            return;
        }
        await handlePharmaceuticalConflict(direction);
    }

    // Build stat effects from the direction's baseEffects
    const scale = getUseCountScale(useCount);
    const statEffects = dirConfig.baseEffects.map(eff => ({
        stat_key: eff.stat_key,
        direction: eff.direction,
        rate: Math.round((eff.scalable ? eff.rate * scale : eff.rate) * 100) / 100,
        delay_ticks: config.delay,
        duration_ticks: config.duration,
        target: eff.target || 'nation'
    }));

    // Optimistic UI
    row.classList.remove('selected');
    row.classList.add('active');
    const btns = document.getElementById(actionId + '-btns');
    const dirLabel = direction === 'increase' ? 'INCREASE' : 'DECREASE';
    if (btns) btns.innerHTML = `<div class="ministry-action__active-indicator" style="color:#5cb85c;">● ACTIVE — ${dirLabel}</div>`;
    const selectorEl = document.getElementById('pharma-direction-selector');
    if (selectorEl) selectorEl.innerHTML = '';

    const actionData = {
        use_count: useCount,
        scale: scale,
        direction: direction,
        one_time_cost: oneTimeCost,
        budget_per_tick: 0
    };

    try {
        const { data: actionLogId, error } = await _supabase.rpc('execute_ministry_action', {
            p_nation_id: currentNation.id,
            p_faction_id: currentFaction.id,
            p_ministry_key: 'healthcare',
            p_action_key: 'pharmaceuticalRegulation',
            p_ap_cost: apCost,
            p_applied_at_tick: currentTick,
            p_stat_effects: statEffects,
            p_action_data: actionData
        });

        if (error) throw error;

        // === RPC succeeded — action is committed. Everything below is best-effort. ===

        // Deduct one-time cost from discretionary fund (best-effort — action already committed)
        try { await deductDiscretionaryFund('healthcare', mData, balance, oneTimeCost); }
        catch (_) { /* fund deduction failed — will be stale until page reload */ }

        // Update local state
        const prevAP = currentFaction.action_points || 0;
        currentFaction.action_points = Math.max(0, prevAP - apCost);
        ministryActionUseCounts[countKey] = useCount + 1;
        activeMinistryActions[actionId] = direction; // store direction as value
        _pharmaSelectedDirection = null;
        sessionStorage.removeItem('nationhood_state');

        // Fire event (non-blocking)
        try {
            const { ministerName, partyName } = await fetchMinisterInfo('healthcare');
            await _supabase.rpc('fire_system_event', {
                p_trigger_key: dirConfig.triggerKey,
                p_nation_id: currentNation.id,
                p_tick: currentTick,
                p_placeholders: {
                    minister_name: ministerName,
                    party: partyName,
                    nation: currentNation.name || 'Unknown',
                    direction: direction,
                    cost: formatUpfrontCost(oneTimeCost)
                }
            });
        } catch (_) { /* best-effort */ }

    } catch (e) {
        // Revert optimistic UI — only reached if RPC itself failed
        row.classList.remove('active');
        if (btns) btns.innerHTML = `<div class="ministry-action__btn-execute" onclick="event.stopPropagation();openPharmaceuticalSelector()">▶ ${apCost} AP</div>`;
        alert('Action failed: ' + (e.message || 'Unknown error'));
    } finally {
        _ministryActionConfirming = false;
    }
}

// Healthcare action select (for Preventative Care — standard flow with one-time cost)
function healthcareActionSelect(actionId) {
    const row = document.getElementById(actionId);
    if (!row || row.classList.contains('active') || row.classList.contains('disabled')) return;
    if (!isMyMinistryByKey('healthcare')) return;

    // Deselect previous
    if (selectedMinistryAction && selectedMinistryAction !== actionId) {
        ministryActionDeselect(selectedMinistryAction);
    }
    if (row.classList.contains('selected')) return;

    row.classList.add('selected');
    selectedMinistryAction = actionId;

    const config = MINISTRY_ACTIONS.healthcare.actions.find(a => a.id === 'preventativeCare');
    const countKey = 'healthcare:preventativeCare';
    const useCount = ministryActionUseCounts[countKey] || 0;
    const apCost = config.apCosts[Math.min(useCount, 3)];
    const pop = currentNation?.population || 20000000;
    const oneTimeCost = calculateHealthActionCost(config, pop);
    const costLabel = formatUpfrontCost(oneTimeCost);

    const btns = document.getElementById(actionId + '-btns');
    if (btns) {
        btns.innerHTML = `<div style="display:flex;gap:4px;">
            <div class="ministry-action__btn-confirm" onclick="event.stopPropagation();confirmHealthcareAction('${actionId}')">Confirm — ${apCost} AP · ${costLabel}</div>
            <div class="ministry-action__btn-cancel" onclick="event.stopPropagation();healthcareActionDeselect('${actionId}')">✕</div>
        </div>`;
    }
}

function healthcareActionDeselect(actionId) {
    const row = document.getElementById(actionId);
    if (!row) return;
    row.classList.remove('selected');
    if (selectedMinistryAction === actionId) selectedMinistryAction = null;

    const config = MINISTRY_ACTIONS.healthcare.actions.find(a => a.id === 'preventativeCare');
    const countKey = 'healthcare:preventativeCare';
    const useCount = ministryActionUseCounts[countKey] || 0;
    const apCost = config.apCosts[Math.min(useCount, 3)];

    const btns = document.getElementById(actionId + '-btns');
    if (btns) {
        btns.innerHTML = `<div class="ministry-action__btn-execute" onclick="event.stopPropagation();healthcareActionSelect('${actionId}')">▶ ${apCost} AP</div>`;
    }
}

async function confirmHealthcareAction(actionId) {
    if (_ministryActionConfirming) return;
    _ministryActionConfirming = true;

    const row = document.getElementById(actionId);
    if (!row || !currentFaction || !currentNation) { _ministryActionConfirming = false; return; }
    if (!isMyMinistryByKey('healthcare')) { _ministryActionConfirming = false; return; }

    const config = MINISTRY_ACTIONS.healthcare.actions.find(a => a.id === 'preventativeCare');
    const countKey = 'healthcare:preventativeCare';
    const useCount = ministryActionUseCounts[countKey] || 0;
    const apCost = config.apCosts[Math.min(useCount, 3)];
    const pop = currentNation.population || 20000000;
    const oneTimeCost = calculateHealthActionCost(config, pop);
    const statEffects = buildStatEffects(config, useCount);

    // Check discretionary funds
    const mData = ministryData.find(m => m.ministry_key === 'healthcare');
    const balance = Number(mData?.discretionary_balance || 0);
    if (oneTimeCost > 0 && balance < oneTimeCost) {
        _ministryActionConfirming = false;
        alert('Insufficient discretionary funds.');
        healthcareActionDeselect(actionId);
        return;
    }

    // Optimistic UI
    row.classList.remove('selected');
    row.classList.add('active');
    selectedMinistryAction = null;
    const btns = document.getElementById(actionId + '-btns');
    if (btns) btns.innerHTML = '<div class="ministry-action__active-indicator">● ACTIVE</div>';

    const actionData = {
        use_count: useCount,
        scale: getUseCountScale(useCount),
        one_time_cost: oneTimeCost,
        budget_per_tick: 0
    };

    try {
        const { data: actionLogId, error } = await _supabase.rpc('execute_ministry_action', {
            p_nation_id: currentNation.id,
            p_faction_id: currentFaction.id,
            p_ministry_key: 'healthcare',
            p_action_key: 'preventativeCare',
            p_ap_cost: apCost,
            p_applied_at_tick: currentTick,
            p_stat_effects: statEffects,
            p_action_data: actionData
        });

        if (error) throw error;

        // === RPC succeeded — action is committed. Everything below is best-effort. ===

        // Deduct one-time cost from discretionary fund (best-effort — action already committed)
        try { await deductDiscretionaryFund('healthcare', mData, balance, oneTimeCost); }
        catch (_) { /* fund deduction failed — will be stale until page reload */ }

        // Update local state
        const prevAP = currentFaction.action_points || 0;
        currentFaction.action_points = Math.max(0, prevAP - apCost);
        ministryActionUseCounts[countKey] = useCount + 1;
        activeMinistryActions[actionId] = true;
        sessionStorage.removeItem('nationhood_state');

        // Fire event (non-blocking)
        try {
            const { ministerName, partyName } = await fetchMinisterInfo('healthcare');
            await _supabase.rpc('fire_system_event', {
                p_trigger_key: config.triggerKey,
                p_nation_id: currentNation.id,
                p_tick: currentTick,
                p_placeholders: {
                    minister_name: ministerName,
                    party: partyName,
                    nation: currentNation.name || 'Unknown',
                    cost: formatUpfrontCost(oneTimeCost)
                }
            });
        } catch (_) { /* best-effort */ }

    } catch (e) {
        // Revert optimistic UI
        row.classList.remove('active');
        if (btns) {
            btns.innerHTML = `<div class="ministry-action__btn-execute" onclick="event.stopPropagation();healthcareActionSelect('${actionId}')">▶ ${apCost} AP</div>`;
        }
        alert('Action failed: ' + (e.message || 'Unknown error'));
    } finally {
        _ministryActionConfirming = false;
    }
}

function _curriculumAxisLabel(axisId) {
    const a = CURRICULUM_AXES.find(x => x.id === axisId);
    return a ? `${a.left} / ${a.right}` : axisId;
}

                    <div onclick="selectCurriculumDirection('${axis.id}', 1, '${axis.right}')" style="flex:1;padding:6px 8px;text-align:center;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:600;letter-spacing:0.04em;${rightStyle}" title="${escapeHtml(axis.tip)}">${axis.right.toUpperCase()}</div>

            <div style="padding:8px 12px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;background:#1e1e1a;border:1px solid rgba(255,255,255,0.07);color:#3a3a2e;cursor:not-allowed;">CONFIRM — 6 AP</div>`;
    } else {
        const axisLabel = _curriculumAxisLabel(sel.axisId);
        confirmHtml = `
            <div style="font-family:'IBM Plex Sans',sans-serif;font-size:10px;color:#4e4d42;margin-bottom:8px;">Curriculum will drift toward <span style="color:#c8b45a;">${escapeHtml(sel.label)}</span> on ${escapeHtml(axisLabel)} axis.<br>Drift begins Tick ${activationTick}.</div>
            <div onclick="confirmCurriculum()" style="padding:8px 12px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:8px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;background:#c8a64e;border:1px solid rgba(200,166,78,0.5);color:#1a0808;cursor:pointer;">CONFIRM — 6 AP</div>`;
    }

    overlay.innerHTML = `
        <div style="background:#1e1e1a;border:1px solid rgba(200,166,78,0.3);width:360px;padding:16px;max-height:80vh;overflow-y:auto;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                <div style="font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;color:#c8b45a;letter-spacing:0.06em;">SET CURRICULUM ORIENTATION</div>
