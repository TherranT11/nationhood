const NEW_MINISTER_APPROVAL = 50;

const MINISTRY_NAMES = {
    prime_minister: 'Prime Minister',
    interior: 'Ministry of the Interior',
    foreign: 'Foreign Ministry',
    defense: 'Ministry of Defense',
    finance: 'Ministry of Finance',
    education: 'Ministry of Education',
    healthcare: 'Ministry of Healthcare',
    labor: 'Ministry of Labor',
    justice: 'Ministry of Justice',
    trade: 'Ministry of Trade',
    energy: 'Ministry of Energy',
    transportation: 'Ministry of Transportation',
    security: 'Ministry of Security'
};

const MINISTRY_KEYS_CABINET = [
    'prime_minister',
    'interior','foreign','defense','finance',
    'education','healthcare','labor','justice','trade','energy','transportation','sports'
];

// ==================== MINISTRY ACTIONS DATA ====================
// Use-count scaling: positive effects collapse, negative effects stay at 100%
const USE_COUNT_SCALE = [1.0, 0.70, 0.40, 0.15];
function getUseCountScale(useCount) { return USE_COUNT_SCALE[Math.min(useCount, 3)]; }

function isImplementedMinistryAction(action) {
    if (!action) return false;
    const hasApConfig = Array.isArray(action.apCosts) && action.apCosts.length > 0;
    const hasCustomHandlerMarker = !!(action.customFlow || action.directions || action.isSpecialAction || action.isResolution);
    return hasApConfig || hasCustomHandlerMarker;
}

// State Owned Enterprise — placeholder action mounted under multiple
// ministries. Greyed out / non-clickable for now (comingSoon=true);
// `costLabel` overrides the default "COMING SOON" pill so players see
// the eventual $100K price tag while the action is inert.
const SOE_ACTION = {
    id: 'stateOwnedEnterprise',
    name: 'State Owned Enterprise',
    desc: 'Advocate for the creation of a State Owned Enterprise in this ministry.',
    comingSoon: true,
    costLabel: '$100K'
};

// Single source of truth for "disabled placeholder action" card HTML.
// Used by the generic comingSoon branch in buildMinistryActionRows AND
// by the custom-builder ministries (defense / healthcare / education /
// energy) that bypass MINISTRY_ACTIONS entirely. `label` defaults to
// "COMING SOON" when omitted.
function renderDisabledActionCard(name, desc, label) {
    const lbl = escapeHtml(label || 'COMING SOON');
    return `<div class="ministry-action disabled" style="opacity:0.6;cursor:not-allowed;">
        <div class="ministry-action__top">
            <span class="ministry-action__name">${escapeHtml(name)}</span>
            <span class="ministry-action__ap-cost" style="color:#3a3a2e;">${lbl}</span>
        </div>
        <div class="ministry-action__desc">${escapeHtml(desc)}</div>
        <div class="ministry-action__bottom">
            <div class="ministry-action__tags"></div>
            <div><div style="font-family:var(--font-mono);font-size:7.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;background:#1e1e1a;border:1px solid rgba(255,255,255,0.07);color:#3a3a2e;padding:4px 9px;cursor:not-allowed;white-space:nowrap;">${lbl}</div></div>
        </div>
    </div>`;
}

// SOE card — used from each custom-builder ministry that needs it.
// finance / justice / transportation get it via MINISTRY_ACTIONS +
// the generic renderer; this helper covers the four custom ones.
function renderSoeActionCard() {
    return renderDisabledActionCard(SOE_ACTION.name, SOE_ACTION.desc, SOE_ACTION.costLabel);
}

// ── Interior · Expand Infrastructure ───────────────────────────
// Card opens openExpandInfrastructureModal which fetches tier
// specs from interior_infrastructure_tiers() and posts via
// post_interior_infrastructure(p_size).
function renderInteriorInfrastructureCard(action, canUse) {
    const btnLabel = canUse ? 'CHOOSE TIER' : 'NOT MINISTER';
    const btnStyle = canUse
        ? 'background:#5aafa5;border-color:#5aafa5;color:#0f0f0d;cursor:pointer;'
        : 'background:#1e1e1a;border-color:rgba(255,255,255,0.07);color:#3a3a2e;cursor:not-allowed;';
    const onclick = canUse
        ? 'onclick="event.stopPropagation();openExpandInfrastructureModal()"'
        : '';
    return `<div class="ministry-action" style="cursor:default;">
        <div class="ministry-action__top">
            <span class="ministry-action__name">${escapeHtml(action.name)}</span>
            <span class="ministry-action__ap-cost">3 TIERS</span>
        </div>
        <div class="ministry-action__desc">${escapeHtml(action.desc)}</div>
        <div class="ministry-action__bottom">
            <div class="ministry-action__tags">
                <span class="tag tag--positive">+ STD OF LIVING</span>
                <span class="tag tag--positive">+ GDP GROWTH</span>
                <span class="tag tag--positive">+ PUBLIC APPROVAL</span>
            </div>
            <div><div ${onclick} style="font-family:var(--font-mono);font-size:7.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;${btnStyle}padding:4px 9px;white-space:nowrap;">${btnLabel}</div></div>
        </div>
    </div>`;
}

let _interiorInfrastructureTiers = null;
let _interiorInfrastructureInflight = false;

async function openExpandInfrastructureModal() {
    if (_interiorInfrastructureInflight) return;
    // Guard against double-open: rapid double-click on the action
    // card would otherwise append a second overlay with the same
    // id (only the first reachable via getElementById).
    if (document.getElementById('expand-infra-overlay')) return;
    if (!_interiorInfrastructureTiers) {
        const { data, error } = await _supabase.rpc('interior_infrastructure_tiers');
        if (error) {
            alert('Failed to load tiers: ' + error.message);
            return;
        }
        _interiorInfrastructureTiers = data || {};
    }

    const overlay = document.createElement('div');
    overlay.id = 'expand-infra-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;';
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeExpandInfrastructureModal(); });

    const order = ['small', 'modest', 'extravagant'];
    const tierLabel = { small: 'SMALL', modest: 'MODEST', extravagant: 'EXTRAVAGANT' };

    // Current Interior ministry discretionary balance — used to
    // disable cards the player can't afford to post.
    const interiorMin = (typeof ministryData !== 'undefined' && Array.isArray(ministryData))
        ? ministryData.find(m => m.ministry_key === 'interior')
        : null;
    const discretionary = Number(interiorMin?.discretionary_balance || 0);
    const fmtM = (n) => '$' + (Number(n) / 1_000_000).toFixed(Number(n) % 1_000_000 === 0 ? 0 : 1) + 'M';

    const cards = order.map(k => {
        const t = _interiorInfrastructureTiers[k];
        if (!t) return '';
        const postFmt   = fmtM(t.post_cost);
        const budgetFmt = fmtM(t.budget);
        const affordable = discretionary >= Number(t.post_cost);
        const effects = (t.stat_effects || []).map(e => {
            const sign = Number(e.delta) >= 0 ? '+' : '';
            const stat = e.stat.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
            return `<div style="font-family:var(--font-mono);font-size:11px;color:var(--green);letter-spacing:0.04em;">${sign}${e.delta} ${stat}</div>`;
        }).join('');
        const cardStyle = affordable
            ? 'flex:1;border:1px solid rgba(255,255,255,0.1);background:#1a1a17;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:border-color 0.15s,background 0.15s;'
            : 'flex:1;border:1px solid rgba(255,255,255,0.06);background:#15140f;padding:18px;cursor:not-allowed;display:flex;flex-direction:column;gap:10px;opacity:0.5;';
        const dataAttr = affordable ? `data-tier="${k}"` : '';
        const unaffordableNote = affordable ? '' : `<div style="font-family:var(--font-mono);font-size:10px;color:var(--accent-red,#d9534f);letter-spacing:0.04em;">Insufficient discretionary funds</div>`;
        return `<div class="expand-infra-tier" ${dataAttr} style="${cardStyle}">
            <div style="font-family:var(--font-mono);font-size:9px;letter-spacing:0.16em;color:#9e9a92;">${tierLabel[k]}</div>
            <div style="font-family:var(--font-serif,Georgia,serif);font-size:18px;font-weight:600;color:#f0efe6;line-height:1.15;">${escapeHtml(t.name)}</div>
            <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.04em;color:#9e9a92;">Post fee: <span style="color:var(--accent-rust,#a0633a);font-weight:600;">${postFmt}</span></div>
            <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.04em;color:#9e9a92;">Contract: <span style="color:var(--gold,#c8a832);font-weight:600;">${budgetFmt}</span> · ${t.timeline} ticks</div>
            <div style="display:flex;flex-direction:column;gap:4px;margin-top:4px;">${effects}</div>
            ${unaffordableNote}
        </div>`;
    }).join('');

    const balLine = `<div style="font-family:var(--font-mono);font-size:11px;letter-spacing:0.04em;color:#9e9a92;">Ministry discretionary balance: <span style="color:${discretionary > 0 ? 'var(--green)' : 'var(--accent-red,#d9534f)'};font-weight:600;">${fmtM(discretionary)}</span></div>`;

    overlay.innerHTML = `<div style="background:#0f0f0d;border:1px solid rgba(255,255,255,0.1);max-width:880px;width:100%;padding:24px;display:flex;flex-direction:column;gap:18px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <div style="font-family:var(--font-serif,Georgia,serif);font-size:22px;font-weight:600;color:#f0efe6;">Expand Infrastructure</div>
            <button id="expand-infra-close" style="background:transparent;border:1px solid rgba(255,255,255,0.15);color:#9e9a92;font-family:var(--font-mono);font-size:14px;width:30px;height:30px;cursor:pointer;">×</button>
        </div>
        <div style="font-family:var(--font-sans,sans-serif);font-size:13px;color:#9e9a92;line-height:1.5;">
            Select a tier. The post fee is debited from the ministry's discretionary balance; the contract opens for bidding by construction corporations. The winning corp builds the project; on completion, your nation gains the listed stat boosts. One Interior Infrastructure contract open or active per nation.
        </div>
        ${balLine}
        <div style="display:flex;gap:12px;">${cards}</div>
        <div id="expand-infra-error" style="display:none;font-family:var(--font-mono);font-size:11px;color:#d9534f;padding:8px 12px;border:1px solid rgba(217,83,79,0.4);background:rgba(217,83,79,0.06);"></div>
    </div>`;

    document.body.appendChild(overlay);

    overlay.querySelector('#expand-infra-close').addEventListener('click', closeExpandInfrastructureModal);
    overlay.querySelectorAll('.expand-infra-tier').forEach(card => {
        card.addEventListener('mouseenter', () => {
            card.style.borderColor = 'var(--gold, #c8a832)';
            card.style.background = '#1f1f1a';
        });
        card.addEventListener('mouseleave', () => {
            card.style.borderColor = 'rgba(255,255,255,0.1)';
            card.style.background = '#1a1a17';
        });
        card.addEventListener('click', () => submitExpandInfrastructure(card.dataset.tier));
    });
}

function closeExpandInfrastructureModal() {
    const overlay = document.getElementById('expand-infra-overlay');
    if (overlay) overlay.remove();
}

async function submitExpandInfrastructure(size) {
    if (_interiorInfrastructureInflight) return;
    _interiorInfrastructureInflight = true;
    const errEl = document.getElementById('expand-infra-error');
    if (errEl) errEl.style.display = 'none';
    document.querySelectorAll('.expand-infra-tier').forEach(c => { c.style.opacity = '0.5'; c.style.pointerEvents = 'none'; });

    try {
        const { data, error } = await _supabase.rpc('post_interior_infrastructure', { p_size: size });
        if (error) {
            if (errEl) { errEl.textContent = error.message; errEl.style.display = 'block'; }
            return;
        }
        if (!data?.success) {
            if (errEl) { errEl.textContent = data?.error || 'Failed to post contract'; errEl.style.display = 'block'; }
            return;
        }
        closeExpandInfrastructureModal();
        const postM = (Number(data.post_cost) / 1_000_000).toFixed(0);
        const budgetM = (Number(data.budget) / 1_000_000).toFixed(0);
        alert(`${data.name} posted. $${postM}M debited from discretionary. Contract budget $${budgetM}M, ${data.timeline} ticks, 6-tick bid window for corps.`);
        // Refresh ministry data so the page reflects any state changes.
        if (typeof loadGovData === 'function') loadGovData();
    } catch (err) {
        if (errEl) { errEl.textContent = err?.message || 'Unknown error'; errEl.style.display = 'block'; }
    } finally {
        _interiorInfrastructureInflight = false;
        document.querySelectorAll('.expand-infra-tier').forEach(c => { c.style.opacity = '1'; c.style.pointerEvents = 'auto'; });
    }
}
window.openExpandInfrastructureModal = openExpandInfrastructureModal;
window.closeExpandInfrastructureModal = closeExpandInfrastructureModal;

// ── Appoint / Nominate Central Bank Governor ────────────────────────
// Opened from the Governor container's drawer on the Administrative
// cabinet. Picks a party; parliamentary nominations route to a
// confirmation vote, presidential / monarchy appoint directly. Backed
// by the appoint_central_bank_governor RPC.

// Whether this nation's head of government appoints the Governor directly
// (presidential / monarchy) vs. via a confirmation vote (parliamentary).
// Mirrors the routing in appoint_central_bank_governor.
function cbGovDirectAppoint(nation) {
    const gt = String(nation?.government_type || '').toLowerCase();
    return gt.includes('president') || gt.includes('monarch');
}

let _governorAppointInflight = false;
function openGovernorAppointModal() {
    if (document.getElementById('gov-appoint-overlay')) return;
    const parties = (_govData?.parties || []);
    const direct = cbGovDirectAppoint(currentNation);
    const overlay = document.createElement('div');
    overlay.id = 'gov-appoint-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;';
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeGovernorAppointModal(); });
    const opts = parties.map(p => `<option value="${p.id}">${escapeHtml(p.faction_name)}</option>`).join('');
    const routeNote = direct
        ? 'You appoint the Governor directly — they take the seat immediately for an 8-year (96-tick) term.'
        : 'Your nominee goes to a parliamentary confirmation vote (6 ticks). On a pass they serve an 8-year (96-tick) term.';
    overlay.innerHTML = `<div style="background:#0f0f0d;border:1px solid rgba(255,255,255,0.1);max-width:460px;width:100%;padding:24px;display:flex;flex-direction:column;gap:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <div style="font-family:var(--font-serif,Georgia,serif);font-size:20px;font-weight:600;color:#f0efe6;">${direct ? 'Appoint' : 'Nominate'} Central Bank Governor</div>
            <button id="gov-appoint-close" style="background:transparent;border:1px solid rgba(255,255,255,0.15);color:#9e9a92;font-family:var(--font-mono);font-size:14px;width:30px;height:30px;cursor:pointer;">×</button>
        </div>
        <div style="font-family:var(--font-sans,sans-serif);font-size:13px;color:#9e9a92;line-height:1.5;">${routeNote} The Governor cannot be dismissed.</div>
        <select id="gov-appoint-select" style="background:#1a1a17;color:#f0efe6;border:1px solid rgba(255,255,255,0.15);border-radius:4px;padding:9px 12px;font-size:14px;">${opts}</select>
        <div id="gov-appoint-error" style="display:none;font-family:var(--font-mono);font-size:11px;color:#d9534f;padding:8px 12px;border:1px solid rgba(217,83,79,0.4);background:rgba(217,83,79,0.06);"></div>
        <div style="display:flex;justify-content:flex-end;gap:10px;">
            <button id="gov-appoint-cancel" style="background:transparent;border:1px solid rgba(255,255,255,0.15);color:#9e9a92;font-family:var(--font-mono);font-size:12px;padding:8px 16px;cursor:pointer;">Cancel</button>
            <button id="gov-appoint-submit" style="background:var(--gold,#c8a832);border:none;color:#1a1a1a;font-family:var(--font-mono);font-size:12px;font-weight:700;padding:8px 18px;cursor:pointer;">${direct ? 'Appoint' : 'Nominate'}</button>
        </div>
    </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#gov-appoint-close').addEventListener('click', closeGovernorAppointModal);
    overlay.querySelector('#gov-appoint-cancel').addEventListener('click', closeGovernorAppointModal);
    overlay.querySelector('#gov-appoint-submit').addEventListener('click', submitGovernorAppoint);
}

function closeGovernorAppointModal() {
    const o = document.getElementById('gov-appoint-overlay');
    if (o) o.remove();
}

async function submitGovernorAppoint() {
    if (_governorAppointInflight) return;
    const partyId = document.getElementById('gov-appoint-select')?.value;
    const errEl = document.getElementById('gov-appoint-error');
    if (!partyId) return;
    _governorAppointInflight = true;
    if (errEl) errEl.style.display = 'none';
    try {
        const { data, error } = await _supabase.rpc('appoint_central_bank_governor', { p_party_id: partyId });
        if (error) { if (errEl) { errEl.textContent = error.message; errEl.style.display = 'block'; } return; }
        if (!data?.success) {
            const msg = {
                not_head_of_government: 'Only the head of government can appoint the Governor.',
                governor_seated: 'A Governor is already serving — the seat reopens when their term ends.',
                confirmation_pending: 'A confirmation vote is already on the floor.',
                nominee_not_party: 'The nominee must be a party.',
            }[data?.reason] || ('Appointment failed: ' + (data?.reason || 'unknown'));
            if (errEl) { errEl.textContent = msg; errEl.style.display = 'block'; }
            return;
        }
        closeGovernorAppointModal();
        alert(data.status === 'appointed' ? 'Governor appointed.' : 'Nominee sent to a confirmation vote.');
        if (typeof loadGovData === 'function') { await loadGovData(); renderGovContent(); }
    } catch (e) {
        if (errEl) { errEl.textContent = e?.message || 'Unknown error'; errEl.style.display = 'block'; }
    } finally {
        _governorAppointInflight = false;
    }
}

// Build the stat_effects array for the tick processor, applying use-count scaling
function buildStatEffects(action, useCount) {
    if (!action?.baseEffects) return [];
    const scale = getUseCountScale(useCount);
    return action.baseEffects.map(eff => ({
        stat_key: eff.stat_key,
        direction: eff.direction,
        rate: Math.round((eff.scalable ? eff.rate * scale : eff.rate) * 100) / 100,
        delay_ticks: eff.delayOverride !== undefined ? eff.delayOverride : action.delay,
        duration_ticks: eff.durationOverride !== undefined ? eff.durationOverride : action.duration,
        target: eff.target || 'nation'
    }));
}

// Finance ministry: check Debt Restructuring blocking conditions
function getDebtRestructuringBlock() {
    if (activeMinistryActions['finance-austerityMeasures']) return 'Austerity Measures active. Resolve before attempting restructuring.';
    // Check for recent failed restructuring (stored in action_data)
    const failKey = 'finance:debtRestructuring:lastFailTick';
    const lastFailTick = Number(sessionStorage.getItem(failKey) || 0);
    if (lastFailTick > 0 && currentTick - lastFailTick < 15) {
        return `Creditors unavailable. Previous negotiation failed ${currentTick - lastFailTick} ticks ago.`;
    }
    return '';
}

// Handle mutual-exclusive ministry action conflict (Finance: Stimulus/Austerity, Energy: Green/Fossil, etc.)
async function handleMinistryConflict(action, ministryKey) {
    if (!action.conflictsWith) return;
    const conflictActionId = ministryKey + '-' + action.conflictsWith;
    if (!activeMinistryActions[conflictActionId]) return;

    const conflictActId = action.conflictsWith;

    // Cancel the conflicting action in DB (best-effort — don't block the new action)
    try {
        const { data: conflictLogs } = await _supabase
            .from('ministry_action_log')
            .select('id')
            .eq('nation_id', currentNation.id)
            .eq('ministry_key', ministryKey)
            .eq('action_key', conflictActId)
            .eq('processed', false);

        if (conflictLogs?.length) {
            for (const log of conflictLogs) {
                await _supabase.from('ministry_action_log')
                    .update({ processed: true })
                    .eq('id', log.id);
            }
        }
    } catch (_) { /* best-effort — conflict may linger until next tick cleanup */ }

    // Update local UI state regardless of DB result
    delete activeMinistryActions[conflictActionId];
    const conflictRow = document.getElementById(conflictActionId);
    if (conflictRow) {
        conflictRow.classList.remove('active');
        const conflictBtns = document.getElementById(conflictActionId + '-btns');
        if (conflictBtns) {
            conflictBtns.innerHTML = `<div class="ministry-action__btn-execute" onclick="event.stopPropagation();ministryActionSelect('${conflictActionId}')">▶ FREE</div>`;
        }
    }

    // Fire cancellation event (best-effort)
    try {
        const cancelledConfig = MINISTRY_ACTIONS[ministryKey]?.actions.find(a => a.id === conflictActId);
        const cancelledName = cancelledConfig?.name || conflictActId;
        await _supabase.rpc('fire_system_event', {
            p_trigger_key: 'ministry_action_cancelled_by_conflict',
            p_nation_id: currentNation.id,
            p_tick: currentTick,
            p_placeholders: {
                nation: currentNation.name || 'Unknown',
                cancelled_action: cancelledName,
                new_action: action.name
            }
        });
    } catch (_) { /* best-effort */ }
}

// Fetch minister name + party for any ministry (used by event firing)
async function fetchMinisterInfo(ministryKey) {
    try {
        const { data: ministry } = await _supabase
            .from('ministries')
            .select('minister_first_name, minister_last_name, factions(faction_name)')
            .eq('nation_id', currentNation.id)
            .eq('ministry_key', ministryKey)
            .single();
        const ministerName = ministry
            ? (ministry.minister_first_name + ' ' + (ministry.minister_last_name || '')).trim()
            : 'Unknown';
        const partyName = ministry?.factions?.faction_name || currentFaction?.faction_name || 'Unknown';
        return { ministerName, partyName };
    } catch (_) {
        return { ministerName: 'Unknown', partyName: currentFaction?.faction_name || 'Unknown' };
    }
}

function getCachedMinisterInfo(ministryKey) {
    const ministry = Array.isArray(ministryData)
        ? ministryData.find(m => m.ministry_key === ministryKey)
        : null;
    if (!ministry) return { ministerName: '', partyName: '' };
    return {
        ministerName: ministry.minister_first_name
            ? `${ministry.minister_first_name} ${ministry.minister_last_name || ''}`.trim()
            : '',
        partyName: ministry?.factions?.faction_name || ''
    };
}

async function insertMinisterActionTimelineEvent(ministryKey, actionName, tickOverride) {
    if (!currentNation?.id || !ministryKey || !actionName) return;
    try {
        const cached = getCachedMinisterInfo(ministryKey);
        const fetched = (!cached.ministerName || !cached.partyName)
            ? await fetchMinisterInfo(ministryKey)
            : { ministerName: '', partyName: '' };
        const ministerName = cached.ministerName || fetched.ministerName || 'Unknown Minister';
        const ministryName = MINISTRY_NAMES[ministryKey] || ministryKey;
        const firedAtTick = Number.isFinite(tickOverride) ? tickOverride : currentTick;
        await _supabase.from('event_log').insert({
            nation_id: currentNation.id,
            event_name: 'Minister Action',
            category: 'POLITICS',
            fired_at_tick: firedAtTick,
            trigger_key: 'minister_action_used',
            description_chosen: `${ministerName} (${ministryName}) used ${actionName}.`
        });
    } catch (timelineErr) {
        console.warn('[Timeline] minister action event insert failed:', timelineErr);
    }
}

// Format discretionary balance for display (shared across ministry card renderers).
// Nation/ministry budgets are integer-millions per spec — raw dollars
// in, "$33" / "$2" / "$0" out. GDP / debt headlines + corp cash keep
// their own M / B formatters (formatCurrencyShort, etc.); this is
// the nation/ministry-only formatter.
function formatDiscretionaryBalance(rawBalance) {
    const balance = Number(rawBalance || 0);
    const fmt = balance > 0 ? '$' + Math.round(balance / 1_000_000) : '$0';
    const cls = balance > 0 ? 'color:var(--green)' : 'color:var(--red)';
    return { balance, fmt, cls };
}

// Deduct a one-time cost from a ministry's discretionary fund
async function deductDiscretionaryFund(ministryKey, localMData, currentBalance, cost) {
    if (cost <= 0) return;
    const newBalance = Math.max(0, currentBalance - cost);
    const { error } = await _supabase.from('ministries')
        .update({ discretionary_balance: newBalance })
        .eq('nation_id', currentNation.id)
        .eq('ministry_key', ministryKey)
        .eq('is_active', true);
    if (error) {
        console.error('[Ministry] Discretionary fund deduction failed:', error.message);
        throw new Error('Fund deduction failed: ' + error.message);
    }
    if (localMData) localMData.discretionary_balance = newBalance;
}

// ==================== CANCEL ACTIVE MINISTRY ACTION ====================
async function cancelMinistryAction(actionId, actionName) {
    if (!confirm('Cancel ' + actionName + '? Remaining effects will stop.')) return;

    const [ministryKey, actId] = actionId.split('-');

    try {
        // Mark all unprocessed logs for this action as processed
        const { data: logs } = await _supabase
            .from('ministry_action_log')
            .select('id')
            .eq('nation_id', currentNation.id)
            .eq('ministry_key', ministryKey)
            .eq('action_key', actId)
            .eq('processed', false);

        if (logs?.length) {
            for (const log of logs) {
                await _supabase.from('ministry_action_log')
                    .update({ processed: true })
                    .eq('id', log.id);
            }
        }

        // Clear local active state
        delete activeMinistryActions[actionId];

        // Refresh the full government page UI
        await refreshGovernmentUI();
    } catch (e) {
        alert('Failed to cancel: ' + (e.message || 'Unknown error'));
    }
}

// One-time cost calculation for any ministry action or direction.
// Uses dynamicCostFn if defined (e.g. Road Maintenance scales with the infrastructure stat).
function calculateOneTimeCost(actionOrDirection, population) {
    if (actionOrDirection.dynamicCostFn) return actionOrDirection.dynamicCostFn(population);
    const costPerMillion = actionOrDirection.oneTimeCostPerMillion || 0;
    return Math.round((population / 1_000_000) * costPerMillion);
}

// Pressing Issues coordinator. Two independent renderers each own a
// dedicated sub-host (the petition writes host.innerHTML, so they
// MUST NOT share a host); each calls syncEmpty after rendering, which
// shows the shared "No pressing issues" placeholder only when BOTH
// are empty. Petition gets emptyMessage:'' so it clears its sub-host
// (its docstring's "sibling owns the empty UI" path). Re-mounting on
// every admin render is cheap (one select / one RPC each).
function adm2MountPetitionPressingIssue() {
    const body = document.querySelector('.adm2-pressing-body');
    if (!body) return;
    body.innerHTML =
        '<div id="pp-pet"></div><div id="pp-cos"></div>'
      + '<div class="adm2-pressing-empty" id="pp-empty">No pressing issues right now. '
      + 'Time-sensitive decisions will appear here when triggered.</div>';
    const pet = document.getElementById('pp-pet');
    const cos = document.getElementById('pp-cos');
    const empty = document.getElementById('pp-empty');
    function syncEmpty() {
        const has = (pet?.children.length || 0) + (cos?.children.length || 0) > 0;
        if (empty) empty.style.display = has ? 'none' : 'block';
    }
    mountPetitionPressingIssues({
        supabase: _supabase,
        faction:  currentFaction,
        nation:   currentNation,
        host:     pet,
        currentTick: () => Number(currentTick) || 0,
        emptyMessage: '',          // coordinator owns the combined empty UI
        onChange: syncEmpty,
    });
    mountCosReportPressingIssues({
        supabase: _supabase,
        faction:  currentFaction,
        nation:   currentNation,
        host:     cos,
        currentTick: () => Number(currentTick) || 0,
        onChange: syncEmpty,
    });
    syncEmpty();
}

function adm2RenderAdminCard() {
    const el = document.getElementById('adm2-admin-card');
    if (!el || !_govData) return;
    const { coalition, hog, admin, parties, president } = _govData;
    const nation = currentNation;

    // Headline approval is the nation's public_approval stat, rendered
    // as a percentage. Replaces the previous coalition-average display
    // — they read the same conceptual value (how the population feels
    // about the government) so showing both was redundant. The
    // sector-popularity / party-approval chain still drives
    // public_approval upstream; this is just the single canonical
    // surface for it on the admin card.
    const publicApprovalRaw = nation?.public_approval;
    const publicApprovalKnown = publicApprovalRaw != null && Number.isFinite(Number(publicApprovalRaw));
    const publicApprovalNum = publicApprovalKnown ? Number(publicApprovalRaw) : null;
    const approvalText = publicApprovalKnown ? `${Math.round(publicApprovalNum)}%` : '—';
    const approvalColor = !publicApprovalKnown ? 'var(--text-muted)'
        : publicApprovalNum >= 55 ? 'var(--green)'
        : publicApprovalNum >= 40 ? 'var(--amber)'
        : 'var(--red)';

    const adminName = admin?.admin_name || (hog ? (hog.last_name || 'Interim') + ' Administration' : 'No Government');
    const startDate = admin?.started_at_date || tickToDate(admin?.started_at_tick);
    const isCurrent = admin && !admin.ended_at_tick;

    // Duration anchors to the MOST RECENT leader change rather than the
    // admin row's started_at_tick. Legacy rows can miss a rotation
    // entirely, leaving raw started_at_tick reading from game start.
    // Falling back to hog.appointed_tick / president.elected_tick makes
    // the term counter reset whenever the player actually sees a new PM or
    // President take office.
    const startTickCandidates = [
        admin?.started_at_tick,
        hog?.appointed_tick,
        president?.elected_tick,
    ].filter(t => typeof t === 'number');
    const startTick = startTickCandidates.length ? Math.max(...startTickCandidates) : null;
    let durationLabel = '';
    if (typeof startTick === 'number' && typeof currentTick === 'number' && currentTick >= startTick) {
        const months = Math.max(0, currentTick - startTick);
        durationLabel = months === 1 ? '1 Month' : `${months} Months`;
    }

    // Coalition rows — uniform colored chips so the parties line up
    // visually instead of running together as a comma-separated string.
    const coalitionPartyIds = coalition?.party_ids || [];
    const coalitionParties = coalitionPartyIds
        .map(id => parties.find(p => p.id === id))
        .filter(Boolean);
    let coalitionHtml;
    if (coalitionParties.length === 0) {
        coalitionHtml = '<span class="v" style="color:var(--text-faint);">None</span>';
    } else {
        coalitionHtml = `<div class="adm2-coal-list">${coalitionParties.map(p => {
            const color = p.party_color || 'var(--text-muted)';
            const abbr = p.abbreviation || '—';
            return `<div class="adm2-coal-row" style="border-left-color:${color};">
                <span class="adm2-coal-abbr" style="color:${color};">${escapeHtml(abbr)}</span>
                <span class="adm2-coal-name">${escapeHtml(p.faction_name || '')}</span>
            </div>`;
        }).join('')}</div>`;
    }

    const statusPill = isCurrent
        ? '<span class="adm2-pill">Current</span>'
        : (admin?.end_reason ? `<span class="adm2-pill" style="color:var(--red);border-color:var(--red);background:var(--red-faint);">${escapeHtml(admin.end_reason.replace(/_/g,' ').toUpperCase())}</span>` : '');

    // "Term" now reflects the elapsed duration (e.g. "1 Month") rather than
    // the start date — the start date is implicit from "Current" and the
    // duration is the metric players actually want at a glance.
    const termValue = durationLabel || (startDate ? escapeHtml(startDate) : '—');

    // Regime stat strip: state_apparatus + (optional) crown_authority.
    // public_approval moved up to the headline approval strip; showing

    const crownAuthVal = nation?.crown_authority;
    const fmtRegimeStat = (v) => (v == null ? '—' : Math.round(Number(v)) + '/100');
    const regimeStatColor = (v) => {
        if (v == null) return 'var(--text-muted)';
        const n = Number(v);
        return n >= 60 ? 'var(--green)' : n >= 35 ? 'var(--amber)' : 'var(--red)';
    };
    let regimeStatsHtml = `<div style="display:flex;flex-direction:column;"><span style="font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;">State Apparatus</span><span style="color:${regimeStatColor(controlVal)};font-weight:700;">${fmtRegimeStat(controlVal)}</span></div>`;
    if (crownAuthVal != null) {
        regimeStatsHtml += `<div style="display:flex;flex-direction:column;"><span style="font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;">Crown Auth.</span><span style="color:${regimeStatColor(crownAuthVal)};font-weight:700;">${fmtRegimeStat(crownAuthVal)}</span></div>`;
    }

        <div class="adm2-meta">

            <div class="row"><span class="k">Coalition</span><span class="v">${coalitionHtml}</span></div>
        </div>
        <div class="adm2-approval-strip">
            <span class="lbl">Public Approval</span>
            <span class="val" style="color:${approvalColor};">${approvalText}</span>
        </div>
        <div class="adm2-regime-strip" style="display:flex;gap:18px;margin-top:8px;padding-top:8px;border-top:1px solid var(--border-hair);font-family:var(--font-mono);">
            ${regimeStatsHtml}
        </div>
    </div>`;
}

// ── Executive card — PM + Head of State ─────────────────────────────
// ── Head of State card (above Head of Government) ──────────────────
// Visible for monarchies (Constitutional + Absolute). For pure
// presidential and parliamentary-republic nations the HoS is also
// the HoG, so the dedicated card is hidden and the single Head of
// Government card carries all the info.
function adm2RenderHosCard() {
    const el = document.getElementById('adm2-hos-card');
    if (!el || !_govData) return;
    const nation = currentNation;
    const isHereditaryHos = (nation?.hos_election_method === 'hereditary');

    let body = '';

    if (isHereditaryHos && nation?.head_of_state_first_name) {
        // Monarch (Constitutional or Absolute).
        const name = `${nation.head_of_state_first_name || ''} ${nation.head_of_state_last_name || ''}`.trim();
        const title = nation.head_of_state_title || 'King';
        const initials = name.split(' ').map(s => s[0] || '').join('').slice(0, 2).toUpperCase();
        const ageLine = `<div class="party">Age ${escapeHtml(String(nation.head_of_state_age || '—'))}</div>`;
        const dynastyLine = nation.dynasty_name
            ? `<div class="party" style="font-style:italic;">House of ${escapeHtml(nation.dynasty_name)}</div>`
            : '';
        body = `<div class="adm2-exec-person">
            <div class="adm2-avatar" style="color:var(--amber);border-color:rgba(200,168,50,0.4);background:rgba(200,168,50,0.1);">${escapeHtml(initials)}</div>
            <div class="adm2-exec-body">
                <div class="role">${escapeHtml(title)}</div>
                <div class="name">${escapeHtml(name)}</div>
                ${ageLine}
                ${dynastyLine}
            </div>
        </div>`;
    } else {
        // No separate HoS — PM/President is also HoS. Hide the card.
        el.innerHTML = '';
        return;
    }

    el.innerHTML = `<div class="adm2-panel">
        <div class="adm2-panel-head"><span class="sq" style="background:var(--amber);"></span>Head of State</div>
        ${body}
    </div>`;
}

// ── Head of Government card ────────────────────────────────────────
// Renamed from "Executive". Shows the actual head of government:
//   Parliamentary / Constitutional Monarchy → Prime Minister
//   Pure Presidential                       → President
//   Absolute Monarchy                       → Monarch (or appointed HoG)
function adm2RenderExecCard() {
    const el = document.getElementById('adm2-exec-card');
    if (!el || !_govData) return;
    const { hog, president, parties } = _govData;
    const nation = currentNation;
    const isPurePres = isPresidential;

    let body = '';

    if (isPurePres) {
        // Pure presidential — President is HoG (and HoS).
        const name = president
            ? `${president.first_name || ''} ${president.last_name || ''}`.trim()
            : [nation?.head_of_state_first_name, nation?.head_of_state_last_name].filter(Boolean).join(' ') || 'Vacant';
        const party = president?.factions?.faction_name || '';
        const color = president?.factions?.party_color || 'var(--text-muted)';
        const initials = name === 'Vacant' ? '—' : name.split(' ').map(s => s[0] || '').join('').slice(0, 2).toUpperCase();
        body = `<div class="adm2-exec-person">
            <div class="adm2-avatar" style="color:${color};border-color:${color}44;background:${color}15;">${escapeHtml(initials)}</div>
            <div class="adm2-exec-body">
                <div class="role">President</div>
                <div class="name">${escapeHtml(name)}</div>
                ${party ? `<div class="party"><span class="dot" style="background:${color};"></span>${escapeHtml(party)}</div>` : ''}
            </div>
        </div>`;
    } else if (hog) {
        // Parliamentary / Constitutional Monarchy / Absolute Monarchy with
        // an appointed HoG — show the PM/Vizier from the head_of_government
        // row.
        const name = `${hog.first_name || ''} ${hog.last_name || ''}`.trim();
        const pmParty = parties.find(p => p.id === hog.faction_id);
        const party = pmParty?.faction_name || '';
        const color = pmParty?.party_color || 'var(--text-muted)';
        const initials = name.split(' ').map(s => s[0] || '').join('').slice(0, 2).toUpperCase();
        body = `<div class="adm2-exec-person">
            <div class="adm2-avatar" style="color:${color};border-color:${color}44;background:${color}15;">${escapeHtml(initials)}</div>
            <div class="adm2-exec-body">
                <div class="role">Prime Minister</div>
                <div class="name">${escapeHtml(name)}</div>
                ${party ? `<div class="party"><span class="dot" style="background:${color};"></span>${escapeHtml(party)}</div>` : ''}
            </div>
        </div>`;
    } else {
        // Vacant HoG (parliamentary system with formed coalition but no
        // installed PM yet — Leadership Challenge is the canonical
        // resolution path).
        body = `<div class="adm2-exec-person">
            <div class="adm2-avatar" style="color:var(--text-muted);border-color:rgba(255,255,255,0.12);background:rgba(255,255,255,0.04);">—</div>
            <div class="adm2-exec-body">
                <div class="role">Prime Minister</div>
                <div class="name" style="color:var(--text-dim);font-style:italic;">Vacant</div>
                <div class="party" style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);font-style:italic;">No sitting PM. Coalition members can use Leadership Challenge under Actions.</div>
            </div>
        </div>`;
    }

    el.innerHTML = `<div class="adm2-panel">
        <div class="adm2-panel-head"><span class="sq" style="background:var(--green);"></span>Head of Government</div>
        ${body}
    </div>`;
}

// ── Administrative timeline state ────────────────────────────────────
// Module-level state for the administration event timeline. Must be
// declared with `let` — under the Vite bundler, assigning to an
// undeclared identifier throws ReferenceError under module strict mode
// (works only when this file is loaded as a raw <script>).
const TIMELINE_CACHE_MAX = 8;
// The timeline shows the nation's recent history over a fixed lookback window
// (not scoped to the current administration). 1 tick ≈ 1 month, so 60 ≈ 5 years.
const TIMELINE_LOOKBACK_TICKS = 60;
let _timelineContextKey = null;        // stable key (nation + tick) for cache + in-flight gate
let _timelineFilter = 'all';           // active filter chip
let _timelineEvents = [];              // currently-rendered events
let _timelineEmptyReason = '';         // text shown when the list is empty
let _timelineCache = new Map();        // contextKey -> { events }

// Crisis sunset (Phase 3): adm2LoadCrises + adm2RenderNationCard
// removed. The Administration Nation panel was crisis-only; with the
// active_crises read gone there's nothing left to render.

// ── Timeline ────────────────────────────────────────────────────────
function adm2RenderTimeline() {
    const filterEl = document.getElementById('adm2-tl-filters');
    const listEl = document.getElementById('adm2-tl-list');
    if (!filterEl || !listEl) return;

    filterEl.innerHTML = TIMELINE_FILTERS.map(f =>
        `<button class="${_timelineFilter === f.id ? 'active' : ''}" data-f="${f.id}">${f.label}</button>`
    ).join('');
    filterEl.onclick = (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        _timelineFilter = btn.dataset.f;
        adm2RenderTimeline();
    };

    const filtered = _timelineFilter === 'all'
        ? _timelineEvents
        : _timelineEvents.filter(ev => ev.type === _timelineFilter);

    if (!filtered.length) {
        const reason = _timelineEmptyReason || 'No events recorded yet.';
        listEl.innerHTML = `<div class="adm2-tl-empty">${escapeHtml(reason)}</div>`;
        return;
    }

    listEl.innerHTML = filtered.map(ev => {
        const cfg = TIMELINE_TYPE_CONFIG[ev.type] || TIMELINE_TYPE_CONFIG.event;
        return `<div class="adm2-tl-item type-${escapeHtml(ev.type || 'event')}">
            <div class="adm2-tl-dot"></div>
            <div class="adm2-tl-body">
                <div class="head"><span class="icon">${cfg.icon}</span><span class="ttl">${escapeHtml(ev.title || 'Event')}</span></div>
                <div class="desc">${formatTimelineDesc(ev)}</div>
            </div>
            <div class="adm2-tl-date">${escapeHtml(tickToDate(ev.tick) || '')}<span class="d">T${ev.tick || '?'}</span></div>
        </div>`;
    }).join('');
}

// ── Cabinet dense list ──────────────────────────────────────────────
function adm2RenderCabinet() {
    const listEl = document.getElementById('adm2-cab-list');
    const titleEl = document.getElementById('adm2-cab-title');
    if (!listEl || !_govData) return;
    const { coalition, ministries, parties, hog } = _govData;
    const coalitionIds = new Set(coalition?.party_ids || []);

    // Project the full cabinet from MINISTRY_KEYS_CABINET so newly-added
    // seats (Sports, future positions) render as vacant placeholders even
    // before a row exists in the ministries table. The appoint flow handles
    // the no-existing-row case by INSERT (see confirmAssign at line ~10589),
    // so synthetic vacant entries work end-to-end.
    const existingByKey = new Map();
    (ministries || []).forEach(m => existingByKey.set(m.ministry_key, m));
    const filledKeys = MINISTRY_KEYS_CABINET.filter(k =>
        k !== 'prime_minister' && existingByKey.has(k)
    );
    // Empty-state guard. Original gate ("no non-PM rows → show empty
    // state") silently broke minority gov: form_minority_government
    // doesn't seed non-PM ministry rows, so an emergency_minority with
    // only the PM row hit this and rendered "No cabinet assembled"
    // instead of the projected 13 vacant slots the player needs to
    // fill. Add an explicit unlock when a government is actually
    // formed (any status flow that finalize seats); otherwise keep
    // the original "PM-only or empty → no cabinet" behavior so legacy
    // states with a stray PM row but no coalition row still render
    // the legacy empty state.
    const hasFormedGov = !!coalition
        && (coalition.status === 'formed' || coalition.status === 'caretaker');
    if (!hasFormedGov && filledKeys.length === 0) {
        if (titleEl) titleEl.textContent = 'Cabinet · 0';
        listEl.innerHTML = '<div style="padding:20px 14px;text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--text-dim);font-style:italic;">No cabinet assembled.</div>';
        return;
    }
    const cabinet = MINISTRY_KEYS_CABINET
        .filter(k => k !== 'prime_minister')
        .map(k => existingByKey.get(k) || {
            ministry_key: k,
            nation_id: currentNation?.id,
            is_active: true,
        });
    // Title shows count of filled seats (matches the player's mental model
    // of "how many ministers do we have"), not slot count.
    const filledCount = cabinet.filter(m => m.minister_first_name).length;
    if (titleEl) titleEl.textContent = `Cabinet · ${filledCount}`;

    // Precompute static govContext fields shared by every minister row.
    // Per-row isMyMinistry is spread-in inside the .map() below.
    const isCaretaker = !!(coalition && coalition.status === 'caretaker');
    const pmMinistry = (ministries || []).find(mm => mm.ministry_key === 'prime_minister');
    // "PM filled" gates the APPOINT/DISMISS buttons. Absolute monarchies and a
    // few other paths track the PM via head_of_government only — they never
    // materialize a ministries.prime_minister row — so requiring pmMinistry
    // here silently disabled appoint/dismiss for any AM nation whose PM is
    // only in the hog table. Accept either source as proof of an active PM.
    const pmFilled = !!hog
        || !!(pmMinistry && pmMinistry.minister_first_name && pmMinistry.minister_last_name);
    // Single-source PM check (was a 2-source variant inline; now the
    // canonical 4-source resolver via the shared helper).
    const pmState = getCurrentFactionPMState(coalition, ministries, hog);
    let govType = 'parliamentary';
    if (isPresidential) govType = 'presidential';
    const baseCtx = {
        type: govType,
        isRuling: isRulingFaction,
        canAppoint: pmState.strict && pmFilled && !isCaretaker,
        isPMParty: pmState.withFallback,
        isPresidentParty,
        isCaretaker,
        requests: [],
        myRequest: null,
    };

    const rows = cabinet.map((m, idx) => {
        const deptLabel = (MINISTRY_NAMES[m.ministry_key] || m.ministry_key).replace(/^Ministry of\s+/i, '').replace(/^Ministry\s+/i, '');
        const name = [m.minister_first_name, m.minister_last_name].filter(Boolean).join(' ');
        const isEmpty = !name;
        const party = parties.find(p => p.id === m.party_id);
        const partyName = party?.faction_name || (isEmpty ? '' : 'Independent');
        const partyColor = party?.party_color || 'var(--text-muted)';
        const isAligned = party && coalitionIds.has(party.id);
        const cls = isEmpty ? 'vacant' : (isAligned ? 'aligned' : 'opp');
        const initials = name ? name.split(' ').map(s => s[0] || '').join('').slice(0, 2).toUpperCase() : '—';
        const approval = isEmpty ? 0 : Math.max(0, Math.min(100, Math.round(Number(m.minister_approval ?? 50))));
        const funds = formatDiscretionaryBalance(m.discretionary_balance);
        const fundsLabel = isEmpty ? '—' : `<span style="${funds.cls};">${funds.fmt}</span>`;

        // Action buttons — reuse the existing buildMgmtButtons so the
        // Appoint/Nominate/Resign/Dismiss rules + AP gating + caretaker
        // gate live in ONE place (shared with the legacy ministry card
        // renderer elsewhere in this file). isMyMinistry is per-row.
        const isMyMinistry = !isEmpty && !!currentFaction && m.party_id === currentFaction.id;
        const rowCtx = Object.assign({}, baseCtx, { isMyMinistry });
        const actionBtns = buildMgmtButtons(m.ministry_key, m, rowCtx);

        return `<div class="adm2-min-row ${cls}" data-idx="${idx}">
            <div class="ava">${escapeHtml(initials)}</div>
            <div class="mid">
                <span class="dept">${escapeHtml(deptLabel)}</span>
                <span class="nm">${escapeHtml(name || 'Vacant')}</span>
            </div>
            <div class="right">
                ${isEmpty ? '' : `<div class="adm2-ap-bar"><div class="fill" style="width:${approval}%;"></div></div><span class="adm2-ap-val">${approval}%</span>`}
                <span class="caret">›</span>
            </div>
        </div>
        <div class="adm2-min-drawer ${cls}" data-drawer="${idx}">
            <div class="adm2-drawer-party ${cls}"><span class="pdot" style="background:${partyColor};"></span>${escapeHtml(partyName || 'No party assigned')}</div>
            <div class="adm2-drawer-stats">
                <div class="s"><span class="k">Approval</span><span class="v">${isEmpty ? '—' : approval + '%'}</span></div>
                <div class="s"><span class="k">Funds</span><span class="v">${fundsLabel}</span></div>
                <div class="s"><span class="k">Party</span><span class="v" style="font-family:var(--font-ui);font-size:11px;">${escapeHtml(partyName || '—')}</span></div>
            </div>
            ${actionBtns ? `<div class="adm2-drawer-actions">${actionBtns}</div>` : ''}
        </div>`;
    }).join('');

    // ── Governor of the Central Bank ── a ministry-level seat backed by
    // nations.central_bank_governor_* (not a ministries row). Appoint /
    // nominate lives in this drawer; the 96-tick term can't be dismissed.
    const govPartyId  = currentNation?.central_bank_governor_party_id || null;
    const govTermEnd  = Number(currentNation?.central_bank_governor_term_end_tick ?? 0);
    const govSeated   = !!govPartyId && govTermEnd > (currentTick || 0);
    const govParty    = govPartyId ? parties.find(p => p.id === govPartyId) : null;
    const govLeader   = govParty ? [govParty.leader_first_name, govParty.leader_last_name].filter(Boolean).join(' ') : '';
    const govName     = govSeated ? (govLeader || govParty?.faction_name || 'Governor') : '';
    const govEmpty    = !govName;
    const govPartyNm  = govParty?.faction_name || (govEmpty ? '' : 'Independent');
    const govColor    = govParty?.party_color || 'var(--text-muted)';
    const govAligned  = govParty && coalitionIds.has(govParty.id);
    const govRowCls   = govEmpty ? 'vacant' : (govAligned ? 'aligned' : 'opp');
    const govInitials = govName ? govName.split(' ').map(s => s[0] || '').join('').slice(0, 2).toUpperCase() : '—';
    const govTicksLeft = govSeated ? Math.max(0, govTermEnd - (currentTick || 0)) : 0;
    const govRate     = Number(currentNation?.central_bank_interest_rate ?? 5).toFixed(2);

    const govDirect    = cbGovDirectAppoint(currentNation);
    const govIsMonarch = String(currentNation?.government_type || '').toLowerCase().includes('monarch')
        && currentFaction?.id && currentNation?.monarch_faction_id === currentFaction.id;
    const canAppointGov = !govSeated && !isCaretaker && (
        govDirect ? (isPresidentParty || govIsMonarch) : !!baseCtx.isPMParty
    );

    let govActionHtml;
    if (govSeated) {
        govActionHtml = `<div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);font-style:italic;padding:2px 0;">8-year term · ${govTicksLeft} ticks left (ends tick ${govTermEnd}). The Governor cannot be dismissed.</div>`;
    } else if (canAppointGov) {
        const lbl = govDirect ? 'APPOINT' : 'NOMINATE';
        govActionHtml = `<div class="ministry-card__mgmt"><div class="ministry-card__mgmt-btn ministry-card__mgmt-btn--appoint" onclick="event.stopPropagation();openGovernorAppointModal()">${lbl}</div></div>`;
    } else {
        govActionHtml = `<div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);font-style:italic;padding:2px 0;">Only the head of government can appoint the Governor.</div>`;
    }

    const governorRowHtml = `<div class="adm2-min-row ${govRowCls}" data-idx="gov">
            <div class="ava">${escapeHtml(govInitials)}</div>
            <div class="mid">
                <span class="dept">Central Bank Governor</span>
                <span class="nm">${escapeHtml(govName || 'Vacant')}</span>
            </div>
            <div class="right">
                <span class="adm2-ap-val" style="color:var(--gold,#c8a832);">${govRate}%</span>
                <span class="caret">›</span>
            </div>
        </div>
        <div class="adm2-min-drawer ${govRowCls}" data-drawer="gov">
            <div class="adm2-drawer-party ${govRowCls}"><span class="pdot" style="background:${govColor};"></span>${escapeHtml(govPartyNm || 'No Governor seated')}</div>
            <div class="adm2-drawer-stats">
                <div class="s"><span class="k">Policy Rate</span><span class="v">${govRate}%</span></div>
                <div class="s"><span class="k">Term</span><span class="v">${govSeated ? govTicksLeft + ' ticks' : '—'}</span></div>
                <div class="s"><span class="k">Party</span><span class="v" style="font-family:var(--font-ui);font-size:11px;">${escapeHtml(govPartyNm || '—')}</span></div>
            </div>
            <div class="adm2-drawer-actions">${govActionHtml}</div>
        </div>`;

    listEl.innerHTML = rows + governorRowHtml;

    // Click-to-expand: only one drawer open at a time
    listEl.onclick = (e) => {
        const row = e.target.closest('.adm2-min-row');
        if (!row) return;
        const wasExpanded = row.classList.contains('expanded');
        listEl.querySelectorAll('.adm2-min-row.expanded').forEach(r => r.classList.remove('expanded'));
        if (!wasExpanded) row.classList.add('expanded');
    };
}

function setTimelineCache(contextKey, events) {
    if (!contextKey) return;
    if (_timelineCache.has(contextKey)) _timelineCache.delete(contextKey);
    _timelineCache.set(contextKey, { events: Array.isArray(events) ? events : [] });
    while (_timelineCache.size > TIMELINE_CACHE_MAX) {
        const oldestKey = _timelineCache.keys().next().value;
        _timelineCache.delete(oldestKey);
    }
}

function getTimelineContextKey() {
    const nationId = currentNation?.id;
    const admin = _govData?.admin;
    if (!nationId || !admin?.id) return null;
    // Keyed on the current tick so the moving lookback window refetches as time
    // advances (still gated on an active administration existing).
    return `${nationId}:${currentTick}`;
}

async function loadTimelineData() {
    const contextKey = getTimelineContextKey();
    if (!contextKey || !_govData?.admin || !currentNation) {
        _timelineEvents = [];
        _timelineEmptyReason = _govData?.admin
            ? 'Timeline unavailable for current context.'
            : 'No active administration record — timeline unavailable.';
        return;
    }
    const cacheHit = _timelineCache.get(contextKey);
    if (cacheHit) {
        _timelineEvents = cacheHit.events || [];
        _timelineEmptyReason = _timelineEvents.length === 0
            ? 'No events recorded yet.'
            : '';
        return;
    }
    // Fixed lookback window (not the admin's term) — recent history across
    // administrations. Falls back to 0 (all history, up to row caps) if the
    // current tick isn't known yet.
    const startTick = Math.max(0, (Number(currentTick) || 0) - TIMELINE_LOOKBACK_TICKS);
    const nationId = currentNation.id;

    try {
        const [eventsRes, actionsRes, billsRes] = await Promise.all([
            _supabase.from('event_log')
                .select('id, event_name, trigger_key, category, fired_at_tick, description_used, description_chosen')
                .eq('nation_id', nationId)
                .gte('fired_at_tick', startTick)
                .order('fired_at_tick', { ascending: false })
                .limit(80),
            _supabase.from('campaign_actions')
                .select('id, action_type, tick_performed, result')
                .eq('nation_id', nationId)
                .gte('tick_performed', startTick)
                .order('tick_performed', { ascending: false })
                .limit(50),
            _supabase.from('bills')
                .select('id, bill_name, status, passed_tick, proposed_tick, bill_type')
                .eq('nation_id', nationId)
                .gte('proposed_tick', startTick)
                .order('proposed_tick', { ascending: false })
                .limit(50),
        ]);

        const merged = [];

        // Cabinet-related event_log trigger keys (minister appointments, dismissals,
        // resignations, PM appointments) — all route to CABINET regardless of what
        // server-side category they were stamped with. Party-level events
        // (rebrand, fundraise, rally, etc.) are NOT included anywhere in the
        // executive timeline — this panel covers executive / cabinet / policy /
        // crisis / legislation, not party organizational work.
        const CABINET_TRIGGERS = new Set([
            'minister_resigned', 'minister_purged', 'pm_appointed',
        ]);

        // Events
        for (const ev of (eventsRes.data || [])) {
            const cat = (ev.category || '').toLowerCase();
            const trigger = ev.trigger_key || '';
            let type;
            if (CABINET_TRIGGERS.has(trigger)) type = 'appointment';
            else if (cat.includes('crisis') || cat.includes('disaster')) type = 'crisis';
            else if (cat.includes('politic') || cat.includes('government')) type = 'policy';
            else if (cat.includes('trade') || cat.includes('econom')) type = 'economy';
            else if (cat.includes('military') || cat.includes('security')) type = 'military';
            else type = 'event';
            merged.push({
                tick: ev.fired_at_tick,
                type,
                title: ev.event_name || 'Event',
                desc: ev.description_chosen || ev.description_used || '',
                source: 'event',
            });
        }

        // Campaign actions — explicit allowlist. Only executive-level actions
        // (minister appointments/dismissals, platform changes, statements,
        // strongman succession) reach the timeline. Party-level actions
        // (rebrand, fundraise, rally) are excluded entirely.
        for (const ca of (actionsRes.data || [])) {
            const aType = ca.action_type || '';
            let type;
            let title;
            let desc = '';
            if (aType === 'assign_minister') {
                type = 'appointment';
                title = 'Minister Appointed';
                desc = ca.result?.minister_name ? `${ca.result.minister_name} appointed to ${ca.result.ministry_key || 'ministry'}.` : '';
            } else if (aType === 'fire_minister' || aType === 'purge_minister') {
                type = 'appointment';
                title = aType === 'purge_minister' ? 'Minister Purged' : 'Minister Dismissed';
                desc = ca.result?.minister_name ? `${ca.result.minister_name} removed from ${ca.result.ministry_key || 'ministry'}.` : '';
            } else if (aType === 'set_platform' || aType === 'adopt_platform') {
                type = 'policy';
                title = 'Platform Set';
                desc = ca.result?.platform_name ? `Administration commits to ${ca.result.platform_name}.` : 'Policy platform adopted.';
            } else if (aType === 'issue_statement') {
                type = 'policy';
                title = 'Statement Issued';
                desc = ca.result?.statement || '';
            } else if (aType === 'strongman_death') {
                type = 'crisis';
                title = 'Leader Succession';
                desc = ca.result?.deceased_name ? `${ca.result.deceased_name} has died. ${ca.result.successor_name} succeeds.` : '';
            } else {
                // Party-level action (rebrand / fundraise / rally / etc.) — skip.
                continue;
            }
            merged.push({
                tick: ca.tick_performed,
                type,
                title,
                desc: desc.length > 150 ? desc.slice(0, 147) + '...' : desc,
                source: 'action',
            });
        }

        // Bills
        for (const bill of (billsRes.data || [])) {
            const status = bill.status || '';
            let type = 'legislation';
            let title = bill.bill_name || 'Untitled Bill';
            let desc = '';
            if (status === 'enacted' || status === 'passed') {
                desc = `${title} enacted into law.`;
                title = 'Bill Passed';
            } else if (status === 'failed' || status === 'rejected') {
                desc = `${title} failed to pass.`;
                title = 'Bill Failed';
                type = 'crisis';
            } else if (status === 'voting' || status === 'floor') {
                desc = `${title} is on the floor for debate.`;
                title = 'Bill Introduced';
            } else if (status === 'frozen') {
                desc = `${title} frozen (caretaker government).`;
                title = 'Bill Frozen';
            } else {
                desc = `${title} — ${status}.`;
            }
            merged.push({
                tick: bill.passed_tick || bill.proposed_tick,
                type,
                title,
                desc,
                source: 'bill',
            });
        }

        // Sort by tick descending (most recent first)
        merged.sort((a, b) => (b.tick || 0) - (a.tick || 0));
        if (_timelineContextKey !== contextKey) return;
        _timelineEvents = merged;
        setTimelineCache(contextKey, merged);
        _timelineEmptyReason = _timelineEvents.length === 0
            ? 'No events recorded yet.'
            : '';
    } catch (err) {
        console.error('[Timeline] Load failed:', err);
        if (_timelineContextKey !== contextKey) return;
        _timelineEvents = [];
        _timelineEmptyReason = 'Timeline data failed to load.';
    }
}

function formatTimelineDesc(ev) {
    const desc = ev.desc || '';
    // Detect election results: "Parliamentary election held. Results: Party1: 30, Party2: 26, ..."
    if (desc.includes('Results:') && (desc.includes('election held') || ev.title === 'Election Held')) {
        const parts = desc.split('Results:');
        const prefix = escapeHtml(parts[0].trim()) + ' Results: ';
        const resultsPart = parts[1] || '';
        // Parse "PartyName: 30, PartyName2: 26, ..."
        const partyResults = resultsPart.split(',').map(s => s.trim()).filter(Boolean);
        const colorized = partyResults.map(pr => {
            const match = pr.match(/^(.+?):\s*(\d+)$/);
            if (!match) return escapeHtml(pr);
            const partyName = match[1].trim();
            const seats = match[2];
            // Find party color from allParties
            const party = (allParties || []).find(p =>
                p.faction_name === partyName || p.abbreviation === partyName
            );
            const color = party?.party_color || 'var(--text-secondary)';
            return `<span style="color:${color};font-weight:600;">${escapeHtml(partyName)}: <strong style="font-size:15px;">${seats}</strong></span>`;
        }).join(', ');
        return prefix + colorized;
    }
    return escapeHtml(desc);
}

let _govChatMessages = [];            // admin_chat rows (appended to on realtime insert)
let _govChatSubscription = null;      // Supabase realtime channel handle

async function loadGovChat() {
    if (!currentNation) return;
    try {
        const { data, error } = await _supabase
            .from('admin_chat')
            .select('id, faction_id, message, tick_posted, created_at')
            .eq('nation_id', currentNation.id)
            .order('created_at', { ascending: true })
            .limit(50);
        if (error) throw error;
        _govChatMessages = data || [];
    } catch (err) {
        console.error('[GovChat] Load failed:', err);
        _govChatMessages = [];
    }
    renderGovChatMessages();
    subscribeGovChat();
}

function subscribeGovChat() {
    if (_govChatSubscription || !currentNation) return;
    _govChatSubscription = _supabase
        .channel('gov_admin_chat_' + currentNation.id)
        .on('postgres_changes', {
            event: 'INSERT', schema: 'public', table: 'admin_chat',
            filter: 'nation_id=eq.' + currentNation.id
        }, (payload) => {
            const msg = payload.new;
            if (!_govChatMessages.find(m => m.id === msg.id)) {
                _govChatMessages.push(msg);
                renderGovChatMessages();
            }
        })
        .subscribe();
}

function renderGovChatMessages() {
    const container = document.getElementById('ga-chat-messages');
    if (!container) return;
    const parties = _govData?.parties || [];

    if (_govChatMessages.length === 0) {
        container.innerHTML = '<div style="padding:16px;text-align:center;font-family:var(--font-mono);font-size:9px;color:var(--text-dim);font-style:italic;">No messages yet.</div>';
        return;
    }

    container.innerHTML = _govChatMessages.map(m => {
        const party = parties.find(p => p.id === m.faction_id);
        const partyName = party?.faction_name || 'Unknown';
        const partyColor = party?.party_color || '#888';
        const timeAgo = formatGovChatTime(m.created_at);
        return `<div class="ga-chat-msg" style="border-left:2px solid ${partyColor};">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;">
                <span style="font-family:var(--font-mono);font-size:8px;font-weight:700;color:${partyColor};">${escapeHtml(partyName)}</span>
                <span style="font-family:var(--font-mono);font-size:7px;color:var(--text-dim);">${timeAgo}</span>
            </div>
            <div style="font-size:9px;color:var(--text-dim);line-height:1.4;">${escapeHtml(m.message)}</div>
        </div>`;
    }).join('');
    container.scrollTop = container.scrollHeight;
}

function formatGovChatTime(isoStr) {
    if (!isoStr) return '';
    const diffMs = Date.now() - new Date(isoStr).getTime();
    const diffMin = Math.floor(diffMs / 60000);
    if (diffMin < 1) return 'just now';
    if (diffMin < 60) return diffMin + 'm ago';
    const diffH = Math.floor(diffMin / 60);
    if (diffH < 24) return diffH + 'h ago';
    return Math.floor(diffH / 24) + 'd ago';
}

async function sendGovChat() {
    const input = document.getElementById('ga-chat-input');
    const btn = document.getElementById('ga-chat-send');
    if (!input || !currentFaction || !currentNation) return;
    const message = input.value.trim();
    if (!message) return;
    btn.disabled = true;
    input.disabled = true;
    try {
        const { error } = await _supabase.from('admin_chat').insert({
            nation_id: currentNation.id,
            faction_id: currentFaction.id,
            message: message,
            tick_posted: currentTick
        });
        if (error) throw error;
        input.value = '';
        // Manual add if realtime isn't working
        if (!_govChatSubscription) {
            _govChatMessages.push({ id: crypto.randomUUID(), faction_id: currentFaction.id, message, tick_posted: currentTick, created_at: new Date().toISOString() });
            renderGovChatMessages();
        }
    } catch (err) {
        console.error('[GovChat] Send failed:', err);
    } finally {
        btn.disabled = false;
        input.disabled = false;
        input.focus();
    }
}

async function loadLawsData() {
    if (!currentNation) return;
    try {
        // Load ALL policies (not just active laws) so players can browse everything.
        // Phase 5-fix: trimmed SELECT drops columns that were removed from
        // the live schema (ideology/ideologies/target_stat/stat_direction)
        // — PostgREST rejects the whole query when any column is missing,
        // and the catch below was silently emptying _lawsData. Also embeds
        // policy_options so multi-option policies surface their effects on
        // this tab (Phase 2.5 onward stops writing stat_effects on the
        // policies row).
        // We treat a policy as "in force" if EITHER active_laws OR
        // nation_policies has an option selected. active_laws is the
        // legislative-history source of truth (what bill enacted what,
        // when), but nation_policies is the per-nation default the
        // policyadmin Starting Status grid writes to. If they disagree,
        // active_laws wins (it reflects the most recent legislative
        // action). Falling back to nation_policies prevents the Laws
        // subtab from going blank when the backfill of active_laws
        // hasn't happened yet.
        const [policiesRes, activeLawsRes, nationPoliciesRes] = await Promise.all([
            _supabase
                .from('policies')
                .select('id, policy_name, description, major_sector, minor_sector, law_category, policy_options(id, option_name, option_description, option_order, stat_effects, sector_effects)')
                .eq('is_active', true),
            _supabase
                .from('active_laws')
                .select('policy_id, selected_option_id')
                .eq('nation_id', currentNation.id),
            _supabase
                .from('nation_policies')
                .select('policy_id, selected_option_id, status')
                .eq('nation_id', currentNation.id)
                .eq('status', 'active'),
        ]);
        if (policiesRes.error) console.error('[Laws] policies query failed:', policiesRes.error);
        if (activeLawsRes.error) console.error('[Laws] active_laws query failed:', activeLawsRes.error);
        if (nationPoliciesRes?.error) console.warn('[Laws] nation_policies query failed:', nationPoliciesRes.error);
        const enactedByPolicy = new Map();
        // First seed from nation_policies (lowest priority — overwritten by active_laws below).
        for (const row of (nationPoliciesRes?.data || [])) {
            if (row.selected_option_id) enactedByPolicy.set(row.policy_id, row.selected_option_id);
        }
        // active_laws wins when present.
        for (const row of (activeLawsRes.data || [])) {
            enactedByPolicy.set(row.policy_id, row.selected_option_id || null);
        }
        _lawsData = (policiesRes.data || []).map(p => {
            const opts = Array.isArray(p.policy_options)
                ? [...p.policy_options].sort((a, b) => (a.option_order || 0) - (b.option_order || 0))
                : [];
            const isEnacted = enactedByPolicy.has(p.id);
            const selectedId = isEnacted ? enactedByPolicy.get(p.id) : null;
            // For enacted laws, surface the actually-selected option's
            // effects/name so the card reflects the active legal regime.
            // For browse-only (non-enacted) policies, fall back to the first
            // option as a representative preview.
            const selectedOpt = selectedId
                ? opts.find(o => o.id === selectedId) || null
                : null;
            const previewOpt = selectedOpt || opts[0] || null;
            const effective = (previewOpt?.stat_effects && Array.isArray(previewOpt.stat_effects) && previewOpt.stat_effects.length > 0)
                ? previewOpt.stat_effects
                : null;
            return {
                policies: { ...p, stat_effects: effective },
                _isEnacted: isEnacted,
                _optionCount: opts.length,
                _selectedOption: selectedOpt,
                _selectedOptionName: selectedOpt?.option_name || null,
                _selectedOptionDescription: selectedOpt?.option_description || null,
                _firstOptionName: opts[0]?.option_name || null,
            };
        });
    } catch (err) {
        console.error('[Laws] Load failed:', err);
        _lawsData = [];
    }
}
