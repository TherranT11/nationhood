<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Government | Nationhood Alpha</title>
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Shared Styles -->
    <link rel="stylesheet" href="css/dashboard.css">
    
    <!-- Page-specific styles -->
    <style>
        .administration-box {
            background: linear-gradient(135deg, #1a1a1a 0%, #252525 100%);
            border: 2px solid #ffcc00;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .administration-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #333;
        }
        .administration-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffcc00;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .administration-subtitle {
            font-size: 0.85rem;
            color: #888;
        }
        .administration-content {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }
        .admin-section {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 16px;
        }
        .admin-section-title {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .admin-person-name {
            font-size: 1.1rem;
            color: #e0e0e0;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .admin-person-details {
            font-size: 0.8rem;
            color: #aaa;
        }
        .admin-person-party {
            color: #ffcc00;
            font-weight: bold;
        }
        .admin-approval {
            text-align: center;
        }
        .admin-approval-value {
            font-size: 2rem;
            font-weight: bold;
            color: #4CAF50;
        }
        .admin-approval-value.medium {
            color: #ff9800;
        }
        .admin-approval-value.low {
            color: #ff4444;
        }
        .admin-approval-label {
            font-size: 0.75rem;
            color: #888;
            margin-top: 4px;
        }
        .coalition-parties {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 16px;
        }
        .coalition-party-tag {
            background: #333;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            color: #e0e0e0;
        }
        .coalition-party-tag .seats {
            color: #4CAF50;
            font-weight: bold;
            margin-left: 6px;
        }
        .coalition-divider {
            color: #555;
            font-size: 1.2rem;
            padding: 0 4px;
            display: flex;
            align-items: center;
        }
        .ministry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .ministry-card {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 16px;
            border-left: 4px solid #ffcc00;
        }
        .ministry-title {
            font-size: 0.8rem;
            font-weight: bold;
            color: #ffcc00;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }
        .minister-name {
            font-size: 1rem;
            color: #e0e0e0;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .minister-details {
            font-size: 0.8rem;
            color: #aaa;
        }
        .minister-party {
            color: #4CAF50;
        }
        .no-government {
            background: #1a1a1a;
            border-left: 4px solid #ff9800;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        .no-government-title {
            color: #ff9800;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .no-government-desc {
            color: #888;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<!-- ===== TOP BAR (rendered by common.js) ===== -->
<div id="top-bar"></div>

<!-- ===== CONTENT AREA ===== -->
<div id="content-area">
    <!-- Loading state shown initially -->
    <div class="loading-container">
        <div class="loading-spinner"></div>
        <div>Loading government data...</div>
    </div>
</div>

<!-- Shared Scripts -->
<script src="js/supabase-client.js"></script>
<script src="js/common.js"></script>

<!-- Page-Specific Script -->
<script>
/**
 * Government Page
 * Displays government structure, administration, cabinet, and parliament
 */

// Ministry definitions for display
const MINISTRY_NAMES = {
    prime_minister: 'Prime Minister',
    interior: 'Ministry of the Interior',
    foreign: 'Foreign Ministry',
    defense: 'Ministry of Defense',
    finance: 'Ministry of Finance',
    education: 'Ministry of Education',
    healthcare: 'Ministry of Healthcare',
    labor: 'Ministry of Labor',
    justice: 'Ministry of Justice',
    transportation: 'Ministry of Transportation',
    security: 'Ministry of Security'
};

// Page state
let currentNation = null;
let currentFaction = null;
let partyData = [];
let coalitionData = null;
let ministryData = [];

// Initialize page
initPage('government', async (state) => {
    const { nation, faction } = state;
    
    currentNation = nation;
    currentFaction = faction;
    
    if (!nation) {
        document.getElementById('content-area').innerHTML = `
            <div class="placeholder-panel">
                <div class="ph-icon">🏛️</div>
                <h3>No Nation Selected</h3>
                <p>Your party is not assigned to a nation yet.</p>
            </div>
        `;
        return;
    }
    
    await renderGovernmentPage();
});

/**
 * Render the government page content
 */
async function renderGovernmentPage() {
    // Show loading
    document.getElementById('content-area').innerHTML = `
        <div class="panel-padding">
            <div class="loading-container" style="height: 200px;">
                <div class="loading-spinner"></div>
                <div>Loading government data...</div>
            </div>
        </div>
    `;
    
    try {
        // Fetch all required data
        const [electionData, coalition, ministries] = await Promise.all([
            fetchLatestElection(),
            fetchActiveCoalition(),
            fetchMinistries()
        ]);
        
        coalitionData = coalition;
        ministryData = ministries;
        
        // Get party seat data from election results
        partyData = electionData?.results?.votes || [];
        
        // Calculate government approval if coalition exists
        let governmentApproval = null;
        if (coalition) {
            governmentApproval = await calculateGovernmentApproval(coalition.party_ids);
        }
        
        // Get Prime Minister from ministries
        const primeMinister = ministries?.find(m => m.ministry_key === 'prime_minister');
        
        // Build the page
        const html = `
            <div class="panel-padding">
                <!-- Administration Box -->
                ${renderAdministrationBox(coalition, partyData, primeMinister, governmentApproval)}
                
                <!-- Government Structure -->
                <div class="section-header">Government Structure</div>
                <div class="info-block">
                    <div class="info-row">
                        <span class="info-label">Government Type</span>
                        <span class="info-value">${currentNation.government_type || 'Parliamentary Democracy'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Legislative Branch</span>
                        <span class="info-value">Unicameral (120 Seats)</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Majority Threshold</span>
                        <span class="info-value">61 Seats</span>
                    </div>
                </div>
                
                <!-- Cabinet / Ministries -->
                <div class="section-header">Cabinet</div>
                ${renderCabinet(ministries, coalition)}
                
                <!-- Parliament -->
                <div class="section-header">Current Parliamentary Makeup</div>
                <div class="parliament-wrap">
                    <svg id="parliament-svg" width="520" height="280" viewBox="0 0 520 280"></svg>
                </div>
                <div class="parliament-legend" id="parliament-legend"></div>
            </div>
        `;
        
        document.getElementById('content-area').innerHTML = html;
        
        // Draw parliament after DOM is ready
        if (partyData.length > 0) {
            drawParliament(partyData);
        }
        
    } catch (error) {
        console.error('Error loading government data:', error);
        document.getElementById('content-area').innerHTML = `
            <div class="panel-padding">
                <div class="placeholder-panel">
                    <div class="ph-icon">⚠️</div>
                    <h3>Error Loading Data</h3>
                    <p>Could not load government information. Please refresh.</p>
                </div>
            </div>
        `;
    }
}

/**
 * Fetch the latest completed election
 */
async function fetchLatestElection() {
    const { data, error } = await _supabase
        .from('elections')
        .select('*')
        .eq('nation_id', currentNation.id)
        .eq('status', 'completed')
        .order('election_tick', { ascending: false })
        .limit(1)
        .maybeSingle();
    
    if (error) console.error('Error fetching election:', error);
    return data;
}

/**
 * Fetch active coalition for this nation
 */
async function fetchActiveCoalition() {
    const { data, error } = await _supabase
        .from('active_coalitions')
        .select('*')
        .eq('nation_id', currentNation.id)
        .order('formed_at', { ascending: false })
        .limit(1)
        .maybeSingle();
    
    if (error) console.error('Error fetching coalition:', error);
    return data;
}

/**
 * Fetch ministries for this nation
 */
async function fetchMinistries() {
    const { data, error } = await _supabase
        .from('ministries')
        .select('*, factions(faction_name)')
        .eq('nation_id', currentNation.id)
        .eq('is_active', true);
    
    if (error) console.error('Error fetching ministries:', error);
    return data || [];
}

/**
 * Calculate government approval (median of coalition party approvals)
 */
async function calculateGovernmentApproval(partyIds) {
    const { data: parties, error } = await _supabase
        .from('factions')
        .select('approval_rating')
        .in('id', partyIds);
    
    if (error || !parties || parties.length === 0) return null;
    
    // Get approval ratings and sort
    const approvals = parties.map(p => p.approval_rating || 0).sort((a, b) => a - b);
    
    // Calculate median
    const mid = Math.floor(approvals.length / 2);
    if (approvals.length % 2 === 0) {
        return Math.round((approvals[mid - 1] + approvals[mid]) / 2);
    } else {
        return approvals[mid];
    }
}

/**
 * Get party name by ID
 */
function getPartyNameById(partyId) {
    const party = partyData.find(p => p.party_id === partyId);
    return party ? party.party_name : 'Unknown';
}

/**
 * Render the Administration box
 */
function renderAdministrationBox(coalition, parties, primeMinister, governmentApproval) {
    const headOfStateFirst = currentNation.head_of_state_first_name || 'Unknown';
    const headOfStateLast = currentNation.head_of_state_last_name || 'Unknown';
    const headOfStateAge = currentNation.head_of_state_age || '—';
    
    // Check if we have a formed government
    if (!coalition && parties.length > 0) {
        // Check if any party has majority
        const majorityParty = parties.find(p => p.seats >= 61);
        
        if (majorityParty) {
            // Single party government
            return `
                <div class="administration-box">
                    <div class="administration-header">
                        <div class="administration-title">${headOfStateLast} Administration</div>
                        <div class="administration-subtitle">Single Party Government</div>
                    </div>
                    <div class="administration-content">
                        <div class="admin-section">
                            <div class="admin-section-title">Head of State</div>
                            <div class="admin-person-name">${headOfStateFirst} ${headOfStateLast}</div>
                            <div class="admin-person-details">
                                Age ${headOfStateAge} • <span class="admin-person-party">${majorityParty.party_name}</span>
                            </div>
                        </div>
                        <div class="admin-section">
                            <div class="admin-section-title">Prime Minister</div>
                            <div class="admin-person-name">—</div>
                            <div class="admin-person-details">To be appointed</div>
                        </div>
                        <div class="admin-section admin-approval">
                            <div class="admin-section-title">Government Approval</div>
                            <div class="admin-approval-value">—</div>
                        </div>
                    </div>
                    <div class="coalition-parties">
                        <div class="coalition-party-tag">
                            ${majorityParty.party_name}<span class="seats">${majorityParty.seats} Seats</span>
                        </div>
                    </div>
                </div>
            `;
        } else {
            // No government formed yet
            return `
                <div class="no-government">
                    <div class="no-government-title">⚠️ No Government Formed</div>
                    <div class="no-government-desc">
                        No party achieved a majority. A coalition must be formed to establish a government.
                    </div>
                </div>
            `;
        }
    }
    
    if (coalition) {
        // Get lead party (for head of state affiliation)
        const leadParty = parties.find(p => p.party_id === coalition.lead_party_id);
        const leadPartyName = leadParty ? leadParty.party_name : 'Unknown';
        
        // Prime Minister details
        const pmName = primeMinister 
            ? `${primeMinister.minister_first_name} ${primeMinister.minister_last_name}`
            : '—';
        const pmAge = primeMinister?.minister_age || '—';
        const pmParty = primeMinister 
            ? getPartyNameById(primeMinister.party_id) 
            : '—';
        
        // Approval styling
        let approvalClass = '';
        if (governmentApproval !== null) {
            if (governmentApproval < 35) approvalClass = 'low';
            else if (governmentApproval < 50) approvalClass = 'medium';
        }
        
        // Coalition parties
        const coalitionParties = coalition.party_ids.map(partyId => {
            const party = parties.find(p => p.party_id === partyId);
            return party || { party_name: 'Unknown', seats: 0 };
        }).sort((a, b) => b.seats - a.seats);
        
        return `
            <div class="administration-box">
                <div class="administration-header">
                    <div class="administration-title">${headOfStateLast} Administration</div>
                    <div class="administration-subtitle">Coalition Government</div>
                </div>
                <div class="administration-content">
                    <div class="admin-section">
                        <div class="admin-section-title">Head of State</div>
                        <div class="admin-person-name">${headOfStateFirst} ${headOfStateLast}</div>
                        <div class="admin-person-details">
                            Age ${headOfStateAge} • <span class="admin-person-party">${leadPartyName}</span>
                        </div>
                    </div>
                    <div class="admin-section">
                        <div class="admin-section-title">Prime Minister</div>
                        <div class="admin-person-name">${pmName}</div>
                        <div class="admin-person-details">
                            ${pmAge !== '—' ? `Age ${pmAge} • ` : ''}<span class="admin-person-party">${pmParty}</span>
                        </div>
                    </div>
                    <div class="admin-section admin-approval">
                        <div class="admin-section-title">Government Approval</div>
                        <div class="admin-approval-value ${approvalClass}">${governmentApproval !== null ? governmentApproval + '%' : '—'}</div>
                        <div class="admin-approval-label">Coalition Median</div>
                    </div>
                </div>
                <div class="coalition-parties">
                    ${coalitionParties.map((party, index) => `
                        ${index > 0 ? '<span class="coalition-divider">|</span>' : ''}
                        <div class="coalition-party-tag">
                            ${party.party_name}<span class="seats">${party.seats} Seats</span>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }
    
 // Fallback - no election data
    const isAutocracy = currentNation.government_type === 'Autocracy';
    
    return `
        <div class="administration-box">
            <div class="administration-header">
                <div class="administration-title">${headOfStateLast} Administration</div>
                <div class="administration-subtitle">${isAutocracy ? 'National Government' : 'Caretaker Government'}</div>
            </div>
            <div class="coalition-parties">
                <div class="coalition-party-tag" style="background: #444; color: #888;">
                    ${isAutocracy ? 'No Elections Held' : 'Awaiting Election Results'}
                </div>
            </div>
        </div>
    `;
}

/**
 * Render the Cabinet section
 */
function renderCabinet(ministries, coalition) {
    if (!ministries || ministries.length === 0) {
        // No ministries in database - check coalition for fallback
        if (coalition && coalition.ministry_allocations) {
            const allocations = coalition.ministry_allocations;
            
            const cards = Object.entries(allocations)
                .filter(([key]) => key !== 'prime_minister') // PM shown in admin box
                .map(([key, partyId]) => {
                    const party = partyData.find(p => p.party_id === partyId);
                    const ministryName = MINISTRY_NAMES[key] || key;
                    
                    return `
                        <div class="ministry-card">
                            <div class="ministry-title">${ministryName}</div>
                            <div class="minister-name">To be appointed</div>
                            <div class="minister-details">
                                <span class="minister-party">${party?.party_name || 'Unknown'}</span>
                            </div>
                        </div>
                    `;
                }).join('');
            
            return `<div class="ministry-grid">${cards}</div>`;
        }
        
        return `
            <div class="info-block" style="text-align: center; color: #888; padding: 30px;">
                No cabinet has been formed yet. Ministries will be assigned when a government is established.
            </div>
        `;
    }
    
    // Render from ministries table (excluding PM which is in admin box)
    const cards = ministries
        .filter(m => m.ministry_key !== 'prime_minister')
        .map(m => {
            const partyName = m.factions?.faction_name || 'Unknown';
            const ministerName = m.minister_first_name && m.minister_last_name
                ? `${m.minister_first_name} ${m.minister_last_name}`
                : 'Vacant';
            const ministerAge = m.minister_age || null;
            
            return `
                <div class="ministry-card">
                    <div class="ministry-title">${m.ministry_name}</div>
                    <div class="minister-name">${ministerName}</div>
                    <div class="minister-details">
                        ${ministerAge ? `Age ${ministerAge} • ` : ''}<span class="minister-party">${partyName}</span>
                    </div>
                </div>
            `;
        }).join('');
    
    return `<div class="ministry-grid">${cards}</div>`;
}

/**
 * Draw the parliament half-circle visualization
 */
function drawParliament(parties) {
    // Convert to format needed for visualization
    const partyColors = [
        '#E91E63', '#2196F3', '#4CAF50', '#FF9800', '#9C27B0', 
        '#00BCD4', '#F44336', '#8BC34A', '#FFC107', '#673AB7'
    ];
    
    const formattedParties = parties.map((p, index) => ({
        name: p.party_name,
        seats: p.seats,
        color: partyColors[index % partyColors.length]
    }));
    
    const total = formattedParties.reduce((s, p) => s + p.seats, 0);
    const svg = document.getElementById('parliament-svg');
    
    if (!svg) return;
    
    const width = 520;
    const height = 280;
    const centerX = width / 2;
    const centerY = height - 20;
    
    const dotRadius = 2.5;
    const dotSpacing = 7;
    
    const rows = calculateRows(total, centerY, dotSpacing);
    
    // Create seats array with party colors
    const seats = [];
    formattedParties.forEach(party => {
        for (let i = 0; i < party.seats; i++) {
            seats.push({
                color: party.color,
                party: party.name
            });
        }
    });
    
    const dots = generateDotPositions(seats.length, rows, centerX, centerY, dotSpacing);
    
    let circles = '';
    dots.forEach((dot, index) => {
        if (index < seats.length) {
            circles += `<circle cx="${dot.x}" cy="${dot.y}" r="${dotRadius}" fill="${seats[index].color}" stroke="#0a0a0a" stroke-width="0.5"/>`;
        }
    });
    
    // Add total seats text in center
    circles += `<text x="${centerX}" y="${centerY - 12}" text-anchor="middle" fill="#ffcc00" font-size="24" font-weight="bold">${total}</text>`;
    circles += `<text x="${centerX}" y="${centerY + 6}" text-anchor="middle" fill="#666" font-size="11">TOTAL SEATS</text>`;
    
    svg.innerHTML = circles;
    
    // Render legend
    document.getElementById('parliament-legend').innerHTML = formattedParties.map(p =>
        `<div class="legend-item">
            <div class="legend-swatch" style="background:${p.color};"></div>
            ${p.name} (${p.seats})
        </div>`
    ).join('');
}

/**
 * Calculate parliament rows based on total seats
 */
function calculateRows(totalSeats, maxRadius, spacing) {
    const rows = [];
    let currentRadius = maxRadius - 60;
    let seatsPlaced = 0;
    
    while (seatsPlaced < totalSeats && currentRadius > 40) {
        const circumference = Math.PI * currentRadius;
        const dotsInRow = Math.floor(circumference / spacing);
        
        rows.push({
            radius: currentRadius,
            dots: Math.min(dotsInRow, totalSeats - seatsPlaced)
        });
        
        seatsPlaced += dotsInRow;
        currentRadius -= spacing;
    }
    
    return rows;
}

/**
 * Generate dot positions for parliament visualization
 */
function generateDotPositions(totalSeats, rows, centerX, centerY, spacing) {
    const positions = [];
    let seatIndex = 0;
    
    for (let rowIndex = 0; rowIndex < rows.length; rowIndex++) {
        const row = rows[rowIndex];
        const dotsInThisRow = Math.min(row.dots, totalSeats - seatIndex);
        
        const angleStep = Math.PI / (dotsInThisRow - 1);
        
        for (let i = 0; i < dotsInThisRow; i++) {
            const angle = Math.PI - (i * angleStep);
            const x = centerX + row.radius * Math.cos(angle);
            const y = centerY - row.radius * Math.sin(angle);
            
            positions.push({ x, y });
            seatIndex++;
            
            if (seatIndex >= totalSeats) break;
        }
        
        if (seatIndex >= totalSeats) break;
    }
    
    return positions;
}
</script>
