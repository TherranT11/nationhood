// BUDGET SUBTAB
// ═══════════════════════════════════════════════════════════════
//
// Headline stat cards (GDP / Budget / Revenue / Expenditures /
// Balance / Debt-or-Surplus), an Income panel + Costs panel stacked
// on the left, and a sticky Deep Dive panel on the right that
// populates inline when the user clicks a row.
//
// Revenue breakdown comes from calculateNationalBudget() in
// budget.js (same source the Economy page uses). Expenditure
// breakdown is hand-built in _gbBuildCostRows below — most rows are
// $0 placeholders until the spending-allocation rebuild lands. The
// live ones today are Pension, National Infrastructure (monarchy
// Royal Holdings), Sports & Culture (Vola stadium upkeep), Trade
// Agreement Obligations (recurring transfers), and Interest on Debt.

let _budgetData = null;         // { budget, aidReceived, recurringReceivedAnnual, recurringSentAnnual, debtService, debt, nationId, isMonarchy, activeLaws }
let _budgetLoading = false;
let _budgetSelectedKey = null;  // selected income/cost row key
let _budgetSelectGen = 0;       // monotonic counter — prevents an earlier
                                // deep-dive fetch from clobbering a later
                                // selection if the user clicks quickly.

// Abstract budget formatter — no K/M/B/T suffix soup. The page renders
// every figure on the same small-digit scale so a player doesn't have
// to mentally translate between $254 (treasury) and $145.1B (raw
// expenditure dollars). All raw-dollar values are pre-divided by 1e9
// at their call sites before reaching this formatter, so the
// formatter itself is unit-agnostic — just rounded integer with
// thousands-comma. "Is it billions? Who knows" was the explicit
// design directive.
function _gbFmtCurrency(val) {
    if (val == null || !isFinite(val)) return '$0';
    const v = Math.round(Number(val));
    if (v < 0) return '-$' + (-v).toLocaleString('en-US');
    return '$' + v.toLocaleString('en-US');
}

// GDP-specific formatter. nation.gdp is stored in $B abstract units
// (e.g. 358.6 = $358.6B). Renders with B/M/T suffix and 1 decimal so
// the seeded values appear as written. Used only by the GDP card —
// other cards (Budget, Revenue, etc.) keep _gbFmtCurrency's bare-number
// look so they don't all sprout B suffixes.
function _gbFmtGdpCurrency(val) {
    if (val == null || !isFinite(val)) return '$0';
    const v = Number(val);
    const abs = Math.abs(v);
    const sign = v < 0 ? '-' : '';
    if (abs >= 1000) return sign + '$' + (abs / 1000).toFixed(2).replace(/\.?0+$/, '') + 'T';
    if (abs >= 1)    return sign + '$' + abs.toFixed(1).replace(/\.0$/, '') + 'B';
    if (abs > 0)     return sign + '$' + (abs * 1000).toFixed(0) + 'M';
    return '$0';
}

// Raw dollars (e.g. nation.debt, debtService from calculateNationalBudget)
// → abstract scale (divided by 1e9). Identity for already-abstract values
// would be wrong; the caller is responsible for choosing which path each
// figure goes through. Centralising here so the divisor is one place.
const _GB_RAW_TO_ABSTRACT = 1e9;
function _gbToAbstract(rawDollars) {
    return (Number(rawDollars) || 0) / _GB_RAW_TO_ABSTRACT;
}

async function loadBudgetData() {
    if (!currentNation) { _budgetData = null; return; }
    const nation = currentNation;

    // Active entrepreneur-corp count for the per-corp footprint adder in
    // computeCorporateTaxRevenue — every corp HQ'd here (a corp is active
    // by having a row; bankruptcy/acquisition delete it). Mirrors the same
    // fetch in advance-tick/handler-template.ts so panel + tick agree.
    let activeCorpCount = 0;
    try {
        const { count } = await _supabase.from('entrepreneur_corps')
            .select('id', { count: 'exact', head: true })
            .eq('hq_nation_id', nation.id);
        activeCorpCount = count || 0;
    } catch (_) { /* fall back to 0 */ }

    // Interior Infrastructure upkeep — completed contracts grouped by
    // tier × tier.upkeep_per_year. Same SoT helper computePanelAnnualExpenditures
    // calls so the row total here matches what processNationDebtTick charges.
    const interiorInfra = await computeInteriorInfraAnnualCost(_supabase, nation);

    // 1. Revenue — the calculator does the heavy lifting. Apply the real
    //    capped tariff override if a trade_summary row exists (same rule
    //    the Economy page uses so the two pages can't disagree).
    const budget = calculateNationalBudget(nation, { activeCorpCount });

    // Phase 10A: trade_summary table dropped with the goods-trade
    // engine. Tariff revenue feed stays at 0 until the rebuild lands.

    // 2. Aid flows — recipient-side only. The Costs panel is being
    //    rebuilt from scratch (see _gbBuildCostRows), so the donor
    //    accumulator that used to feed a "Foreign Aid (Given)" row
    //    is gone. current_annual_amount is already annualized.
    let aidReceived = 0;
    try {
        const { data: aidStates } = await _supabase.from('aid_agreement_state')
            .select('recipient_nation_id, current_annual_amount, trade_agreements!inner(status, agreement_type)')
            .eq('recipient_nation_id', nation.id)
            .eq('trade_agreements.status', 'active')
            .eq('trade_agreements.agreement_type', 'economic_aid')
            .eq('is_suspended', false);
        for (const row of (aidStates || [])) {
            aidReceived += Number(row.current_annual_amount) || 0;
        }
    } catch (_) { /* aid stays 0 */ }

    // 2b. Recurring transfer flows — both sides. The receiving leg
    //     credits the income panel ("Trade Agreements"); the sending
    //     leg debits the cost panel ("Trade Obligations"). Until this
    //     row landed on the cost side, recurring outflows hit
    //     nation.debt off-panel and the displayed Balance silently
    //     diverged from reality. Annualized via TICKS_PER_YEAR.
    //     One-time transfers excluded — they fire once at ratification.
    let recurringReceivedAnnual = 0;
    let recurringSentAnnual = 0;
    try {
        const { data: gtas } = await _supabase.from('trade_agreements')
            .select('nation_a_id, nation_b_id, articles')
            .eq('status', 'active')
            .or(`nation_a_id.eq.${nation.id},nation_b_id.eq.${nation.id}`);
        for (const a of (gtas || [])) {
            for (const art of (a.articles || [])) {
                if (art?.data?.transfer_type !== 'recurring') continue;
                const endpoints = resolveTransferEndpoints(art, a);
                if (!endpoints) continue;
                const annual = endpoints.amount * GAME_CONFIG.TICKS_PER_YEAR;
                if (endpoints.toNation === nation.id)   recurringReceivedAnnual += annual;
                if (endpoints.fromNation === nation.id) recurringSentAnnual     += annual;
            }
        }
    } catch (_) { /* recurring stays 0 on both sides */ }

    // 3. Expenditures: per-ministry institution costs and policy
    //    fiscal-category costs were both wiped when the Costs panel
    //    collapsed to "Interest on Debt" only. See _gbBuildCostRows —
    //    when the budget rebuild lands these will be re-derived from
    //    a different source, not the legacy ministry_institution_config /
    //    active_laws fiscal_category fan-out.

    // Pre-fetch every active law + chosen option for this nation. The
    // Costs panel uses this to surface ongoing per-tick costs under the
    // appropriate spending category (e.g. Industrial Policy laws roll
    // up into Subsidies & Industry Support, Pension Policy laws roll
    // up into Pension). One fetch, two consumers (_gbBuildCostRows for
    // the panel row totals + _gbSelectCategory for the deep-dive
    // sub-rows) — single source of truth for active-law spending.
    let activeLaws = [];
    try {
        // Cost storage: policy_options.ongoing_base_cost is the only
        // live cost column. Both policies.ongoing_base_cost and
        // policies.ongoing_cost_per_tick that earlier code referenced
        // have been dropped from the schema — PostgREST silently
        // null-coalesced those reads instead of erroring, which is
        // why the budget panel showed $0 with no obvious failure.
        const { data: lawsData, error: lawsErr } = await _supabase
            .from('active_laws')
            .select('id, policies(policy_name, law_category, budget_category), selected_option:policy_options!selected_option_id(option_name, ongoing_base_cost, ongoing_scaling_stat)')
            .eq('nation_id', nation.id);
        if (lawsErr) {
            console.warn('[Budget] active_laws fetch failed:', lawsErr.message);
        } else {
            activeLaws = lawsData || [];
        }
    } catch (err) {
        console.warn('[Budget] active_laws fetch threw:', err.message);
    }

    // Military unit maintenance — per-unit upkeep via the shared
    // unitUpkeepPerTick() (the same fn budget.js / advance-tick use),
    // summed over non-Decommissioned units, ×12. Single source of
    // truth, so this panel can't drift from the real treasury drain.
    let unitMaintenance = { armyCount: 0, armyAnnual: 0, totalAnnual: 0 };
    try {
        const { data: units, error: uErr } = await _supabase
            .from('army_units')
            .select('construction_cost, army:armies(army_type)')
            .eq('nation_id', nation.id)
            .neq('status', 'Decommissioned');
        if (uErr) {
            console.warn('[Budget] army_units fetch failed:', uErr.message);
        } else {
            let perTick = 0;
            for (const u of (units || [])) {
                perTick += unitUpkeepPerTick(u?.construction_cost, u?.army?.army_type);
            }
            const armyAnnual = perTick * GAME_CONFIG.TICKS_PER_YEAR;
            unitMaintenance = { armyCount: (units || []).length, armyAnnual, totalAnnual: armyAnnual };
        }
    } catch (err) {
        console.warn('[Budget] army_units fetch threw:', err.message);
    }

    // Combined Arms School upkeep — MUST match
    // computeCombinedArmsSchoolUpkeepAnnual in budget.js exactly
    // (#completed schools × spec.upkeep_per_tick × 12, under
    // National Infrastructure). Drift = the panel Balance lying vs
    // the real per-tick nation drain.
    let combinedArmsSchool = { count: 0, totalAnnual: 0 };
    try {
        const { data: casSpec } = await _supabase.rpc('combined_arms_school_spec');
        const perTick = Number(casSpec?.upkeep_per_tick) || 0;
        if (perTick > 0) {
            const { count: casN, error: casErr } = await _supabase
                .from('corp_contracts')
                .select('id', { count: 'exact', head: true })
                .eq('issuer_nation_id', nation.id)
                .eq('project_subtype', 'Combined Arms School')
                .eq('status', 'completed');
            if (casErr) {
                console.warn('[Budget] combined arms school count failed:', casErr.message);
            } else {
                const c = casN || 0;
                combinedArmsSchool = { count: c, totalAnnual: c * perTick * GAME_CONFIG.TICKS_PER_YEAR };
            }
        }
    } catch (err) {
        console.warn('[Budget] combined arms school fetch threw:', err.message);
    }

    _budgetData = {
        budget,
        aidReceived,
        recurringReceivedAnnual,
        recurringSentAnnual,
        debtService: Number(budget.debtService || 0),
        debt: Number(nation.debt || 0),
        // Capture the nation's government type so _gbBuildCostRows can
        // light up the monarchy-only Royal Holdings sub-line on
        // National Infrastructure without re-querying.
        nationId: nation.id,
        isMonarchy: isAbsoluteMonarchy(nation),
        activeLaws,
        activeCorpCount,
        interiorInfra,
        unitMaintenance,
        combinedArmsSchool,
    };
}

// Build the Income line items. Income Tax is computed directly from
// computeIncomeTaxRevenue — single source of truth shared with the
// per-tick revenue add in advance-tick. Corporate Tax annualises the
// per-tick figure calculateNationalBudget returns. Trade Agreements is
// the aid + recurring transfer total. Both /mo (÷12) and /yr surface
// in the UI.
function _gbBuildIncomeRows(d) {
    const b = d.budget;
    const incomeTaxAnnual    = computeIncomeTaxRevenue(currentNation || {}) * GAME_CONFIG.TICKS_PER_YEAR;
    const corporateTaxAnnual = (Number(b.corpRevenue) || 0) * GAME_CONFIG.TICKS_PER_YEAR;
    const rows = [
        { key: 'income_tax',    name: 'Income Tax',       yr: incomeTaxAnnual,    descKey: 'incomeTax'     },
        { key: 'corporate_tax', name: 'Corporate Tax',    yr: corporateTaxAnnual, descKey: 'corporateTax'  },
        { key: 'trade_agrs',    name: 'Trade Agreements', yr: Number(d.aidReceived || 0) + Number(d.recurringReceivedAnnual || 0), descKey: 'tradeAgr' },
    ];
    return rows;
}

// Cost line items. The nine spending categories are placeholders —
// every yr is 0 except National Infrastructure in monarchies (which
// carries a flat $3/mo Royal Holdings & Estates line) and Pension
// (whose deep-dive surfaces the active multi-option pension policy's
// ongoing cost lazily on click). Interest on Debt sits at the bottom
// as the one wired-up financing cost. Real allocation logic ships
// when the budget system rebuild lands.
//
// Royal Holdings & Estates: monarchy-only, flat $3/mo → $36/yr,
// rolled into the National Infrastructure row total. The deep-dive
// breaks it out as a sub-allocation so the line item is auditable.
const _GB_ROYAL_HOLDINGS_MONTHLY = 3;

// Where an active law's ongoing cost rolls up. SINGLE SOURCE for both
// the row totals (_gbBuildCostRows) and the deep-dive list
// (_gbSelectCategory) — they both call _gbCostRowForLaw so a row's
// breakdown always matches its total.
//
// Resolution order:
//   1. policies.budget_category (explicit pick in policyadmin) wins.
//   2. else regex fallback on the freeform law_category text below.
//   3. else "other_programs" catch-all.
// Income-side tax policies are excluded (own Income panel) → null.
//
// Fallback regexes map law_category → a COSTS-panel row KEY. The
// 'industr' pattern matches "Industrial Policy" + "Industry"; the
// defense pattern is word-bound so unrelated names containing a
// substring don't get swept in.
const _GB_LAW_CATEGORY_FALLBACK = [
    [/pension/i,                                     'pension'],
    [/industr/i,                                     'subsidies_industry'],
    [/\b(prison|military|defense|intelligence)\b/i,  'defense_security'],
];

function _gbCostRowForLaw(law) {
    const cat = law?.policies?.law_category || '';
    // Income-side tax policies are revenue levers (own Income panel) and
    // must NEVER appear as a cost — this exclusion outranks an explicit
    // budget_category, so mis-tagging a tax policy can't surface it as
    // spending.
    if (_GB_INCOME_SIDE_LAW_CATEGORY.test(cat)) return null;
    const explicit = law?.policies?.budget_category;
    if (explicit) return explicit;
    for (const [re, key] of _GB_LAW_CATEGORY_FALLBACK) {
        if (re.test(cat)) return key;
    }
    return 'other_programs';
}

// Annualized policy ongoing cost summed per COSTS-panel row key.
function _gbPolicyCostByRow(activeLaws) {
    const sums = {};
    for (const law of (activeLaws || [])) {
        const key = _gbCostRowForLaw(law);
        if (!key) continue;
        sums[key] = (sums[key] || 0) + _gbAnnualLawCost(law);
    }
    return sums;
}

// Active laws routed to a given COSTS-panel row key (deep-dive list).
function _gbLawsForRow(activeLaws, rowKey) {
    return (activeLaws || []).filter(l => _gbCostRowForLaw(l) === rowKey);
}

// Income-side policies (income/corporate/sales tax) have their own
// Income-panel rows; listing them under the cost-side "Other Programs"
// catch-all would read as bogus spending programs. _gbCostRowForLaw
// returns null for these so they're excluded from every cost row.
//
// INVARIANT (flagged, not a silent landmine): tax policy_options are
// revenue levers and are expected to carry $0 ongoing_base_cost — every
// one currently does. The server (computePanelAnnualExpenditures) sums
// ongoing cost over ALL active_laws regardless of category, so if a tax
// option were ever authored with a nonzero ongoing cost it would be
// deducted server-side but NOT shown in this cost panel (the displayed
// Balance would over-state by that amount). Keep tax options at $0
// ongoing, or revisit this exclusion.
//
// Word-boundary match (not a bare substring) so a program category that
// merely contains the letters "tax" (e.g. "Syntax") isn't silently
// dropped from the cost panel. Matches Tax / Taxes / Taxation.
const _GB_INCOME_SIDE_LAW_CATEGORY = /\btax(es|ation)?\b/i;

// Annualize an active law's per-tick ongoing cost, scaled by its nation
// stat (e.g. population) via the shared budget.js helper — the same
// scaling computeMinistryPolicyCost and the Economy page apply, so the
// GOV breakdown no longer shows nation-size-independent flat costs.
// Cost + scaling stat live on policy_options only (the policies-table
// cost columns were dropped — selecting them errors the whole fetch).
// Value stays in abstract scale, same as every other Costs panel row.
function _gbAnnualLawCost(law) {
    const base = Number(law?.selected_option?.ongoing_base_cost) || 0;
    const scalingStat = law?.selected_option?.ongoing_scaling_stat;
    return scalePolicyOngoingCost(base, scalingStat, currentNation) * GAME_CONFIG.TICKS_PER_YEAR;
}

function _gbBuildCostRows(d) {
    const royalHoldingsAnnual = d.isMonarchy ? _GB_ROYAL_HOLDINGS_MONTHLY * GAME_CONFIG.TICKS_PER_YEAR : 0;
    // Aggregated active-law costs per spending row, via the single
    // _gbCostRowForLaw resolver (explicit budget_category → regex
    // fallback → other_programs). _gbSelectCategory re-reads the same
    // resolver for the deep-dive, so every row total matches its
    // breakdown. Each row below adds its policy sum on top of any
    // non-policy base it already carries.
    const polByRow = _gbPolicyCostByRow(d.activeLaws);
    const pensionAnnual           = polByRow.pension || 0;
    const subsidiesIndustryAnnual = polByRow.subsidies_industry || 0;
    // Defense & Security + military unit maintenance, so the total
    // matches the real per-tick drain in advance-tick
    // (computePanelAnnualExpenditures) — else Balance lies.
    const defenseSecurityAnnual = (polByRow.defense_security || 0)
        + (d.unitMaintenance?.totalAnnual || 0);
    // "Other Programs" catch-all (laws with no explicit category and no
    // regex match). Closes the UI/server gap — these costs drain
    // server-side regardless of category, so they must show somewhere.
    const otherProgramsAnnual = polByRow.other_programs || 0;
    // Sports & Culture: today the only sub-line is Sport Stadiums &
    // Infrastructure (every completed Vola stadium adds its tier's
    // annual cost — small $0.5 / modest $1 / extravagant $2). Future
    // sports-related ongoing costs (team salaries, training programs,
    // etc.) will roll up under the same descKey.
    const sportsCultureAnnual = Number(currentNation?.vola_stadium_annual_cost) || 0;
    // Trade-agreement recurring transfers — the SENDING leg is a real
    // per-tick outflow that hits nation.budget every tick. Surfacing
    // it here so the displayed Balance accurately reflects what the
    // tick processor is actually doing; before this row landed,
    // recurring transfer obligations were drained off-panel and the
    // headline Balance would over-state by the transfer amount. Stored
    // raw → /1e9 to abstract for display alongside the other rows.
    const tradeObligationsAnnual = _gbToAbstract(d.recurringSentAnnual || 0);
    const publicSectorWagesAnnual = computePublicSectorWagesAnnual(currentNation);
    return [
        { key: 'public_sector_wages',  name: 'Public Sector Wages',     yr: publicSectorWagesAnnual,    descKey: 'publicSectorWages'    },
        { key: 'welfare_benefits',     name: 'Welfare Benefits',        yr: (polByRow.welfare_benefits || 0),  descKey: 'welfareBenefits'      },
        { key: 'pension',              name: 'Pension',                 yr: pensionAnnual,              descKey: 'pension'              },
        { key: 'procurement_capital',  name: 'Procurement & Capital',   yr: (polByRow.procurement_capital || 0), descKey: 'procurementCapital'   },
        { key: 'subsidies_industry',   name: 'Subsidies & Industry Support', yr: subsidiesIndustryAnnual, descKey: 'subsidiesIndustry'   },
        { key: 'defense_security',     name: 'Defense & Security',      yr: defenseSecurityAnnual,      descKey: 'defenseSecurity'      },
        { key: 'national_infra',       name: 'National Infrastructure', yr: royalHoldingsAnnual + Number(d.interiorInfra?.totalAnnual || 0) + Number(d.combinedArmsSchool?.totalAnnual || 0) + (polByRow.national_infra || 0), descKey: 'nationalInfrastructure' },
        { key: 'sports_culture',       name: 'Sports & Culture',        yr: sportsCultureAnnual + (polByRow.sports_culture || 0),        descKey: 'sportsAndCulture'     },
        { key: 'foreign_aid',          name: 'Foreign Aid & Diplomacy', yr: (polByRow.foreign_aid || 0),       descKey: 'foreignAid'           },
        { key: 'discretionary',        name: 'Discretionary Programs',  yr: (polByRow.discretionary || 0),     descKey: 'discretionary'        },
        { key: 'regulatory_agencies',  name: 'Regulatory Agencies',     yr: (polByRow.regulatory_agencies || 0), descKey: 'regulatoryAgencies'   },
        { key: 'other_programs',       name: 'Other Programs',          yr: otherProgramsAnnual,        descKey: 'otherPrograms'        },
        { key: 'trade_obligations',    name: 'Trade Agreement Obligations', yr: tradeObligationsAnnual, descKey: 'tradeObligations'     },
        { key: 'debt_interest',        name: 'Interest on Debt',        yr: Number(d.debtService) || 0, descKey: 'debtInterest'   },
    ];
}

function renderBudgetTab(container) {
    if (!container) return;
    if (!_budgetData && !_budgetLoading) {
        _budgetLoading = true;
        container.innerHTML = '<div class="gb-loading">Loading budget…</div>';
        loadBudgetData().then(() => {
            _budgetLoading = false;
            renderBudgetTab(container);
        }).catch(err => {
            _budgetLoading = false;
            console.error('[Budget] Load failed:', err);
            container.innerHTML = `<div class="gb-error">Budget failed to load: ${escapeHtml(err.message || String(err))}</div>`;
        });
        return;
    }
    if (_budgetLoading) {
        container.innerHTML = '<div class="gb-loading">Loading budget…</div>';
        return;
    }
    if (!_budgetData) {
        container.innerHTML = '<div class="gb-error">Budget data unavailable.</div>';
        return;
    }

    const d = _budgetData;
    const incomeRows = _gbBuildIncomeRows(d);
    const costRows = _gbBuildCostRows(d);
    const revenueYr = incomeRows.reduce((s, r) => s + r.yr, 0);
    const expenditureYr = costRows.reduce((s, r) => s + r.yr, 0);
    const balanceYr = revenueYr - expenditureYr;
    // 4th stat card flips on the sign of nation.debt. Net-debt nations
    // see "Debt $X" as the primary figure (no redundant "Net Debt: $X"
    // hint underneath). Net-surplus nations see "Surplus $X" with the
    // "Accumulated Reserves" kicker.
    const debtAmount = Number(d.debt) || 0;
    const isDebt = debtAmount > 0;
    const surplusReserves = isDebt ? 0 : Math.max(0, -debtAmount);

    const nationName = escapeHtml(currentNation?.name || 'Nation');
    const year = (() => {
        // tickToDate returns a "Month YYYY" string; pluck the year if present
        try {
            const dateStr = tickToDate(currentTick);
            const m = /\b(\d{4})\b/.exec(String(dateStr || ''));
            return m ? m[1] : '';
        } catch (_) { return ''; }
    })();

    const balNeg = balanceYr < 0;
    const balSign = balanceYr >= 0 ? '+' : '-';

    // GDP card values. nation.gdp_growth is a 0-100 stat that maps
    // linearly to ±1% per month at the extremes (stat 50 = 0%, stat
    // 100 = +1%/mo, stat 0 = −1%/mo) — same formula budget.js uses to
    // drift each tick. Expected yearly growth compounds monthly
    // so 12 months at +0.5%/mo ≈ +6.17%/yr.
    const gdpNow = Number(currentNation?.gdp) || 0;
    const budgetCash = Number(currentNation?.budget) || 0;
    const gdpGrowthStat = Number(currentNation?.gdp_growth ?? 50);
    const gdpMonthlyPct = ((gdpGrowthStat - 50) / 50) * 1.0;   // signed %
    const gdpYearlyPct  = (Math.pow(1 + gdpMonthlyPct / 100, 12) - 1) * 100;
    const gdpMonthlySign = gdpMonthlyPct >= 0 ? '+' : '';
    const gdpYearlySign  = gdpYearlyPct  >= 0 ? '+' : '';
    const gdpGrowthColor = gdpMonthlyPct >= 0 ? '#9ac89e' : '#d88d82';

    // nation.debt is now stored as abstract integers (migration 20261207),
    // matching nation.budget. Pass through directly — no /1e9 conversion.
    const debtAbstract = debtAmount;
    const surplusAbstract = surplusReserves;

    container.innerHTML = `
        <div class="gb-page">
            <div class="gb-head">
                <div class="gb-kicker">— Ministry of Finance —</div>
                <h1>Government Budget<span class="gb-year">${escapeHtml(year)}</span></h1>
                <div class="gb-sub">Fiscal Year Overview · ${nationName}</div>
            </div>
            <div class="gb-stats">
                <div class="gb-stat is-gdp">
                    <div class="gb-stat__label"><span class="gb-stat__dot"></span>GDP</div>
                    <div class="gb-stat__primary">${_gbFmtGdpCurrency(gdpNow)}</div>
                    <div class="gb-stat__secondary">
                        <span class="gb-stat__secondary-k">Monthly</span>
                        <span style="color:${gdpGrowthColor};">${gdpMonthlySign}${gdpMonthlyPct.toFixed(2)}%</span>
                    </div>
                    <div class="gb-stat__secondary" style="border-top:none;padding-top:0;">
                        <span class="gb-stat__secondary-k">Yearly (est.)</span>
                        <span style="color:${gdpGrowthColor};">${gdpYearlySign}${gdpYearlyPct.toFixed(1)}%</span>
                    </div>
                </div>
                <div class="gb-stat is-budget">
                    <div class="gb-stat__label"><span class="gb-stat__dot"></span>Budget</div>
                    <div class="gb-stat__primary">${_gbFmtCurrency(budgetCash)}</div>
                    <div class="gb-stat__secondary"><span class="gb-stat__secondary-hint">Treasury Cash Balance</span></div>
                </div>
                <div class="gb-stat is-rev">
                    <div class="gb-stat__label"><span class="gb-stat__dot"></span>Revenue</div>
                    <div class="gb-stat__primary">${_gbFmtCurrency(revenueYr / 12)}<span class="gb-stat__per"> / month</span></div>
                    <div class="gb-stat__secondary"><span class="gb-stat__secondary-k">Annualized</span><span>${_gbFmtCurrency(revenueYr)} / year</span></div>
                </div>
                <div class="gb-stat is-exp">
                    <div class="gb-stat__label"><span class="gb-stat__dot"></span>Expenditures</div>
                    <div class="gb-stat__primary">${_gbFmtCurrency(expenditureYr / 12)}<span class="gb-stat__per"> / month</span></div>
                    <div class="gb-stat__secondary"><span class="gb-stat__secondary-k">Annualized</span><span>${_gbFmtCurrency(expenditureYr)} / year</span></div>
                </div>
                <div class="gb-stat is-bal${balNeg ? ' is-negative' : ''}">
                    <div class="gb-stat__label"><span class="gb-stat__dot"></span>Balance</div>
                    <div class="gb-stat__primary">${balSign}${_gbFmtCurrency(Math.abs(balanceYr / 12))}<span class="gb-stat__per"> / month</span></div>
                    <div class="gb-stat__secondary"><span class="gb-stat__secondary-k">Annualized</span><span>${balSign}${_gbFmtCurrency(Math.abs(balanceYr))} / year</span></div>
                </div>
                <div class="gb-stat ${isDebt ? 'is-debt' : 'is-sur'}">
                    <div class="gb-stat__label"><span class="gb-stat__dot"></span>${isDebt ? 'Debt' : 'Surplus'}</div>
                    <div class="gb-stat__primary">${_gbFmtCurrency(isDebt ? debtAbstract : surplusAbstract)}</div>
                    ${isDebt
                        ? ''
                        : `<div class="gb-stat__secondary"><span class="gb-stat__secondary-hint">Accumulated Reserves</span></div>`
                    }
                </div>
            </div>
            <div class="gb-wrap">
                <div class="gb-breakdown">
                    ${_gbRenderPanel('income', 'Income', incomeRows, revenueYr)}
                    ${_gbRenderPanel('costs',  'Costs',  costRows,  expenditureYr)}
                </div>
                <aside class="gb-deep" id="gb-deep">
                    <div class="gb-deep__head">
                        <div class="gb-deep__title"><span class="gb-deep__title-dot"></span>Deep Dive</div>
                        <span class="gb-deep__status" id="gb-deep-status">Awaiting selection</span>
                    </div>
                    <div class="gb-deep__empty" id="gb-deep-empty">
                        <div class="gb-deep__empty-icon">◎</div>
                        <div class="gb-deep__empty-line1">Select a Category</div>
                        <div class="gb-deep__empty-line2">Click any income or cost line to see its composition, sub-allocations, and annualized flow.</div>
                    </div>
                    <div class="gb-deep__body" id="gb-deep-body" style="display:none;"></div>
                </aside>
            </div>
        </div>
    `;

    _gbWireRows(container, incomeRows, costRows);
    // Re-open the previously selected row after a re-render so the Deep
    // Dive doesn't blank out when the subtab refreshes.
    if (_budgetSelectedKey) {
        const all = [...incomeRows.map(r => ({...r, kind:'income'})), ...costRows.map(r => ({...r, kind:'cost'}))];
        const hit = all.find(r => r.key === _budgetSelectedKey);
        if (hit) _gbSelectCategory(container, hit, hit.kind);
    }
}

function _gbRenderPanel(kind, title, rows, totalYr) {
    const esc = escapeHtml;
    const rowsHtml = rows.map(r => {
        const mo = r.yr / 12;
        const zeroCls = r.yr <= 0 ? ' is-zero' : '';
        return `
            <div class="gb-panel__row" data-key="${esc(r.key)}" data-kind="${esc(kind)}">
                <div class="gb-panel__row-name"><span class="gb-panel__row-dash">—</span><span class="gb-panel__row-lbl">${esc(r.name)}</span></div>
                <span class="gb-panel__row-num${zeroCls}">${_gbFmtCurrency(mo)}</span>
                <span class="gb-panel__row-num is-yr${zeroCls}">${_gbFmtCurrency(r.yr)}</span>
            </div>
        `;
    }).join('');
    return `
        <div class="gb-panel is-${kind}">
            <div class="gb-panel__head">
                <div class="gb-panel__title"><span class="gb-panel__title-dot"></span>${esc(title)}</div>
                <span class="gb-panel__col">Monthly</span>
                <span class="gb-panel__col">Yearly</span>
            </div>
            <div class="gb-panel__list">${rowsHtml}</div>
            <div class="gb-panel__footer">
                <span class="gb-panel__footer-k">Total ${esc(title)}</span>
                <span class="gb-panel__footer-v">${_gbFmtCurrency(totalYr / 12)}</span>
                <span class="gb-panel__footer-v">${_gbFmtCurrency(totalYr)}</span>
            </div>
        </div>
    `;
}

function _gbWireRows(container, incomeRows, costRows) {
    const rowsByKey = {};
    for (const r of incomeRows) rowsByKey['income:' + r.key] = { row: r, kind: 'income' };
    for (const r of costRows)   rowsByKey['cost:' + r.key]   = { row: r, kind: 'cost'   };
    container.querySelectorAll('.gb-panel__row').forEach(el => {
        el.addEventListener('click', () => {
            const key = el.dataset.key;
            const kind = el.dataset.kind === 'income' ? 'income' : 'cost';
            const entry = rowsByKey[kind + ':' + key];
            if (!entry) return;
            _gbSelectCategory(container, entry.row, entry.kind);
        });
    });
}

// Sub-allocation + description lookup for the Deep Dive. Keyed by the
// same `descKey` set on each row. Data here is descriptive (pulled from
// what the game already models); sub-allocations for ministries fall

const _GB_DEEP_COPY = {

    // Spending categories — descriptions in place, allocation engines
    // not yet wired (every placeholder row reads $0 until the rebuild

    publicSectorWages:      { desc: 'Salaries for civil servants, public-sector employees, and state-owned enterprise staff. Scales with the size of the state apparatus and prevailing wages.' },

async function _gbSelectCategory(container, row, kind) {
    _budgetSelectedKey = row.key;
    const gen = ++_budgetSelectGen;

    container.querySelectorAll('.gb-panel__row').forEach(el => el.classList.remove('is-selected'));
    const el = container.querySelector(`.gb-panel__row[data-key="${CSS.escape(row.key)}"][data-kind="${kind}"]`);
    if (el) el.classList.add('is-selected');

    const empty = container.querySelector('#gb-deep-empty');
    const body = container.querySelector('#gb-deep-body');
    const status = container.querySelector('#gb-deep-status');
    if (!empty || !body || !status) return;
    empty.style.display = 'none';
    body.style.display = 'flex';
    status.textContent = 'Generated';
    status.classList.add('is-live');

    const kicker = kind === 'income' ? 'Income Category' : 'Cost Category';
    const mo = row.yr / 12;
    let desc = (_GB_DEEP_COPY[row.descKey] || {}).desc
        || 'Detailed breakdown not yet modeled for this line item.';
    let subRows = [];

    // (Ministry-level deep-dive branch retired — no row in
    // _gbBuildCostRows uses a 'ministry_*' descKey, and the rebuild
    // that would re-introduce them will own its own data path. The
    // dead branch was importing FISCAL_TO_MINISTRY_KEY +
    // buildFundingPctMap + getInstFundingPct just to keep the
    // unreachable code compiling.)

    // Active-law roll-up: list every active law routed to this cost row
    // by _gbCostRowForLaw (the same resolver _gbBuildCostRows summed), so
    // a row's breakdown always matches its total. Other Programs lists
    // $0 framework laws too (so every active law is visible); the costed
    // rows skip $0 sub-lines. Returns [] for income/non-policy rows,
    // which the tax branches below handle on their own.
    if (row.key && _budgetData?.activeLaws) {
        for (const law of _gbLawsForRow(_budgetData.activeLaws, row.key)) {
            const annual = _gbAnnualLawCost(law);
            if (annual <= 0 && row.key !== 'other_programs') continue;
            const policyName = law.policies?.policy_name || 'Active law';
            const optionName = law.selected_option?.option_name;
            const label = optionName ? `${policyName} — ${optionName}` : policyName;
            subRows.push({ k: label, v: annual });
        }
    }

    // Income Tax: surface the active Income Tax policy + option + the
    // literal rate from nation.income_tax. Same shape as the Corporate
    // Tax block below — reads _budgetData.activeLaws and falls back to
    // a generic line when no matching law is active.
    if (row.descKey === 'incomeTax' && currentNation) {
        const rate = Number(currentNation.income_tax || 0);
        const incomeLaw = (_budgetData?.activeLaws || []).find(al =>
            /income\s*tax/i.test(al?.policies?.policy_name || '')
        );
        if (incomeLaw) {
            const policyName = incomeLaw.policies?.policy_name || 'Income Tax';
            const optionName = incomeLaw.selected_option?.option_name || 'Active option';
            subRows.push({ k: `${policyName} — ${optionName} (${rate}%)`, v: row.yr });
        } else {
            subRows.push({ k: `Active rate: ${rate}%`, v: row.yr });
        }
    }

    // Corporate Tax: surface the active Corporate Taxation policy +
    // option + the literal rate from nation.corporate_tax. Reads
    // _budgetData.activeLaws (already loaded) for the policy / option
    // labels; falls back to a generic line when no matching law is
    // active. The dollar value is the annualized revenue this rate
    // produces under the current formula.
    if (row.descKey === 'corporateTax' && currentNation) {
        const rate = Number(currentNation.corporate_tax || 0);
        const corpCount = Number(_budgetData?.activeCorpCount || 0);
        const perCorpAnnual = computeCorporateTaxPerCorp(corpCount) * GAME_CONFIG.TICKS_PER_YEAR;
        const rateAnnual = Math.max(0, row.yr - perCorpAnnual);
        const corpLaw = (_budgetData?.activeLaws || []).find(al =>
            /corporat.*tax/i.test(al?.policies?.policy_name || '')
        );
        if (corpLaw) {
            const policyName = corpLaw.policies?.policy_name || 'Corporate Taxation';
            const optionName = corpLaw.selected_option?.option_name || 'Active option';
            subRows.push({ k: `${policyName} — ${optionName} (${rate}%)`, v: rateAnnual });
        } else {
            subRows.push({ k: `Active rate: ${rate}%`, v: rateAnnual });
        }
        if (corpCount > 0) {
            subRows.push({
                k: `Active corp footprint (${corpCount} HQ${corpCount === 1 ? '' : 's'} × $${computeCorporateTaxPerCorp(1) * GAME_CONFIG.TICKS_PER_YEAR}/yr)`,
                v: perCorpAnnual,
            });
        }
    }

    // Regulatory Agencies: scaffolded sub-sectors at $0 until the
    // per-agency cost wiring lands. Pushed unconditionally (no
    // value > 0 filter) so the player sees the structure even
    // before any sector is funded.
    if (row.descKey === 'regulatoryAgencies') {
        subRows.push({ k: 'Wage and Labor Enforcement', v: 0 });
        subRows.push({ k: 'Banking Enforcement',        v: 0 });
        subRows.push({ k: 'Shipping Enforcement',       v: 0 });
        subRows.push({ k: 'Construction Enforcement',   v: 0 });
        subRows.push({ k: 'Airlines Enforcement',       v: 0 });
        subRows.push({ k: 'Industry Enforcement',       v: 0 });
    }

    // Procurement & Capital: scaffolded $0 placeholders.
    if (row.descKey === 'procurementCapital') {
        subRows.push({ k: 'State Owned Enterprises', v: 0 });
        subRows.push({ k: 'Defense Spending',        v: 0 });
        subRows.push({ k: 'Infrastructure',          v: 0 });
        subRows.push({ k: 'Investment',              v: 0 });
    }

    // Defense & Security: Manpower / Operations / Border / Internal are
    // still $0 scaffolds. "Military Budget" (was "Military Training") is
    // live — its 3 subsectors carry real per-unit maintenance. Only Army
    // has a units feature today; Air Force / Navy are $0 "0 Units"
    // scaffolds. Values come straight from _budgetData.unitMaintenance
    // (the SAME figure folded into the category total) — not recomputed,
    // so the sub-rows always sum to row.yr and percentages stay honest.
    if (row.descKey === 'defenseSecurity') {
        const um = _budgetData?.unitMaintenance || { armyCount: 0, armyAnnual: 0 };
        subRows.push({ k: 'Manpower',            v: 0 });
        subRows.push({ k: 'Military Operations', v: 0 });
        subRows.push({ k: `Military Budget · Army — ${um.armyCount} Unit${um.armyCount === 1 ? '' : 's'}`, v: um.armyAnnual });
        subRows.push({ k: 'Military Budget · Air Force — 0 Units', v: 0 });
        subRows.push({ k: 'Military Budget · Navy — 0 Units', v: 0 });
        subRows.push({ k: 'Border Security',     v: 0 });
        subRows.push({ k: 'Internal Security',   v: 0 });
    }

    // Foreign Aid & Diplomacy: scaffolded $0 placeholders.
    if (row.descKey === 'foreignAid') {
        subRows.push({ k: 'Embassies',        v: 0 });
        subRows.push({ k: 'Humanitarian Aid', v: 0 });
    }

    // Discretionary Programs: scaffolded $0 placeholders.
    if (row.descKey === 'discretionary') {
        subRows.push({ k: 'Conservation Programs',             v: 0 });
        subRows.push({ k: 'Protected Infrastructure',          v: 0 });
        subRows.push({ k: 'Environmental Protection Programs', v: 0 });
    }

    // National Infrastructure: scaffolded sub-sectors. Crown Holdings
    // carries the existing Royal Holdings & Estates value for
    // monarchies (flat $3/mo, included in _gbBuildCostRows row total)
    // and reads $0 for non-monarchy systems. The other seven sub-rows
    // are scaffolding placeholders at $0 until per-sector cost wiring
    // lands.
    if (row.descKey === 'nationalInfrastructure') {
        subRows.push({ k: 'Government Administration [Control]', v: 0 });
        subRows.push({
            k: 'Crown Holdings',
            v: _budgetData?.isMonarchy ? _GB_ROYAL_HOLDINGS_MONTHLY * GAME_CONFIG.TICKS_PER_YEAR : 0,
        });
        subRows.push({ k: 'State Owned Enterprises',             v: 0 });
        subRows.push({ k: 'Healthcare Facilities',               v: 0 });
        subRows.push({ k: 'Education Campuses',                  v: 0 });
        subRows.push({ k: 'Military Bases',                      v: 0 });
        subRows.push({ k: 'Transportation',                      v: 0 });
        subRows.push({ k: 'Nuclear Arsenal',                     v: 0 });
        // Interior Infrastructure upkeep — one row per tier with at
        // least one completed build. Source: _budgetData.interiorInfra
        // populated by computeInteriorInfraAnnualCost in budget.js.
        for (const t of (_budgetData?.interiorInfra?.byTier || [])) {
            subRows.push({
                k: `${t.name} × ${t.count} [Interior Ministry]`,
                v: t.annual,
            });
        }
        // Combined Arms School perpetual upkeep ($2/tick each). Source:
        // _budgetData.combinedArmsSchool (mirrors
        // computeCombinedArmsSchoolUpkeepAnnual in budget.js).
        const _cas = _budgetData?.combinedArmsSchool;
        if (_cas && _cas.count > 0) {
            subRows.push({
                k: `Combined Arms School × ${_cas.count} [Quartermaster]`,
                v: _cas.totalAnnual,
            });
        }
    }

    // Sports & Culture: today the only sub-line is Sport Stadiums &
    // Infrastructure. Reads from nations.vola_stadium_annual_cost (sum
    // maintained by processVolaStadiumCompletions). Skipped silently
    // when no stadiums are built.
    if (row.descKey === 'sportsAndCulture') {
        const stadiumCost = Number(currentNation?.vola_stadium_annual_cost) || 0;
        if (stadiumCost > 0) {
            subRows.push({
                k: 'Sport Stadiums & Infrastructure',
                v: stadiumCost,
            });
        }
    }

    // Public Sector Wages: not an aggregation of sub-costs — it's a
    // formula on two stats (monthly = state_apparatus × wages ÷ 200). The
    // enacted State Apparatus policy shapes the state_apparatus stat that
    // drives this line, so surface it as the composition line (at 100%) —
    // its own colour + bar, like the other categories.
    if (row.descKey === 'publicSectorWages' && currentNation) {
        const sa = Math.round(Number(currentNation.state_apparatus) || 0);
        const wg = Math.round(Number(currentNation.wages) || 0);
        desc += ` Formula: State Apparatus ${sa} × Wages ${wg} ÷ 200 = ${_gbFmtCurrency(mo)} / mo · ${_gbFmtCurrency(row.yr)} / yr. The enacted State Apparatus policy (below) shapes the State Apparatus stat that sets this cost.`;
        const saLaw = (_budgetData?.activeLaws || []).find(al =>
            /state\s*apparatus/i.test(al?.policies?.law_category || '')
            || /state\s*apparatus/i.test(al?.policies?.policy_name || '')
        );
        if (saLaw) {
            const policyName = saLaw.policies?.policy_name || 'State Apparatus Policy';
            const optionName = saLaw.selected_option?.option_name;
            subRows.push({ k: optionName ? `${policyName} — ${optionName}` : policyName, v: row.yr });
        } else {
            subRows.push({ k: `State Apparatus ${sa} (no active policy)`, v: row.yr });
        }
    }

    // A later click superseded this selection — bail before we write into
    // the DOM and clobber the newer row's deep-dive payload.
    if (gen !== _budgetSelectGen) return;

    const colors = ['#7a9a5b', '#b09a5b', '#6b8cae', '#a65d5d', '#9a8fb0', '#7aa29c', '#d48a3c', '#5bc0de'];
    const subTotal = subRows.reduce((s, r) => s + r.v, 0) || row.yr;
    const barSegs = subRows.map((s, i) => `<div class="gb-deep__bar-seg" style="width:${subTotal > 0 ? (s.v / subTotal * 100).toFixed(2) : 0}%;background:${colors[i % colors.length]}"></div>`).join('');
    const legend = subRows.map((s, i) => `<span class="gb-deep__legend-item"><span class="gb-deep__legend-dot" style="background:${colors[i % colors.length]}"></span>${escapeHtml(s.k)}</span>`).join('');
    const lines = subRows.map(s => `
        <div class="gb-deep__line">
            <span class="gb-deep__line-k">${escapeHtml(s.k)}</span>
            <span class="gb-deep__line-v">${_gbFmtCurrency(s.v)}<span class="gb-deep__line-pct">${subTotal > 0 ? ((s.v / subTotal) * 100).toFixed(1) : '0.0'}%</span></span>
        </div>
    `).join('');

    body.innerHTML = `
        <div>
            <div class="gb-deep__kicker">${escapeHtml(kicker)}</div>
            <h2 class="gb-deep__title-big">${escapeHtml(row.name)}</h2>
        </div>
        <div class="gb-deep__stats">
            <div><span class="gb-deep__stat-k">Monthly</span><span class="gb-deep__stat-v">${_gbFmtCurrency(mo)}</span></div>
            <div><span class="gb-deep__stat-k">Yearly</span><span class="gb-deep__stat-v">${_gbFmtCurrency(row.yr)}</span></div>
        </div>
        <p class="gb-deep__desc">${escapeHtml(desc)}</p>
        ${subRows.length ? `
        <div class="gb-deep__bar-wrap">
            <div class="gb-deep__bar-lbl">Composition · Annual</div>
            <div class="gb-deep__bar">${barSegs}</div>
            <div class="gb-deep__legend">${legend}</div>
        </div>
        <div class="gb-deep__lines">${lines}</div>
        ` : ''}
    `;
}

function renderLawsTab(container) {
    if (!_lawsData) {
        container.innerHTML = '<div style="padding:40px;text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--text-dim);">Loading laws...</div>';
        if (!_lawsLoaded) {
            _lawsLoaded = true;
            loadLawsData().then(() => renderLawsTab(container));
        }
        return;
    }

    // Extract unique sectors from all laws
    const sectorSet = new Set();
    for (const law of _lawsData) {
        const sector = law.policies?.major_sector || law.policies?.law_category;
        if (sector) sectorSet.add(sector);
    }
    const sectors = [...sectorSet].sort();

    // Filter laws
    let filtered = [..._lawsData];
    if (_lawsFilter !== 'ALL') {
        filtered = filtered.filter(l => (l.policies?.major_sector || l.policies?.law_category) === _lawsFilter);
    }
    if (_lawsSearch.trim()) {
        const q = _lawsSearch.trim().toLowerCase();
        filtered = filtered.filter(l => {
            const name = (l.policies?.policy_name || '').toLowerCase();
            const desc = (l.policies?.description || '').toLowerCase();
            const sector = (l.policies?.major_sector || '').toLowerCase();
            const minor = (l.policies?.minor_sector || '').toLowerCase();
            return name.includes(q) || desc.includes(q) || sector.includes(q) || minor.includes(q);
        });
    }

    // Sort by sector then name
    filtered.sort((a, b) => {
        const sa = a.policies?.major_sector || '';
        const sb = b.policies?.major_sector || '';
        if (sa !== sb) return sa.localeCompare(sb);
        return (a.policies?.policy_name || '').localeCompare(b.policies?.policy_name || '');
    });

    // Sector filter pills
    const pillsHtml = `
        <span class="leg-filter-btn laws-filter-btn ${_lawsFilter === 'ALL' ? 'active' : ''}" data-laws-filter="ALL">ALL</span>
        ${sectors.map(s => `<span class="leg-filter-btn laws-filter-btn ${_lawsFilter === s ? 'active' : ''}" data-laws-filter="${escapeHtml(s)}">${escapeHtml(s)}</span>`).join('')}
    `;

    // Law cards grouped by sector
    let lawsHtml = '';
    if (filtered.length === 0) {
        lawsHtml = `<div style="padding:40px 20px;text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--text-dim);font-style:italic;">${_lawsSearch ? 'No laws match your search.' : 'No active laws.'}</div>`;
    } else {
        let currentSector = '';
        for (const law of filtered) {
            const policy = law.policies || {};
            const sector = policy.major_sector || policy.law_category || 'Other';
            const minor = policy.minor_sector || '';

            // Section header when sector changes
            if (_lawsFilter === 'ALL' && sector !== currentSector) {
                currentSector = sector;
                const count = filtered.filter(l => (l.policies?.major_sector || l.policies?.law_category || 'Other') === sector).length;
                lawsHtml += `<div class="laws-category-header">
                    <span class="laws-category-title">${escapeHtml(sector)}</span>
                    <span class="laws-category-count">${count} law${count !== 1 ? 's' : ''}</span>
                </div>`;
            }

            // Effect tags
            let effectTags = '';
            const statEffects = policy.stat_effects || [];
            if (statEffects.length > 0) {
                effectTags = statEffects.map(e => {
                    const isGood = (e.direction === 'up' && !STATS_LOWER_IS_BETTER.includes(e.stat_key))
                        || (e.direction === 'down' && STATS_LOWER_IS_BETTER.includes(e.stat_key));
                    const arrow = e.direction === 'up' ? '\u25B2' : '\u25BC';
                    const color = isGood ? 'var(--green)' : 'var(--red)';
                    return `<span class="laws-effect-tag" style="color:${color};border-color:${color}30;">${formatStatName(e.stat_key)} ${arrow}${e.rate ? ' ' + e.rate : ''}</span>`;
                }).join('');
            } else if (policy.target_stat) {
                const dir = (policy.stat_direction || 'UP').toLowerCase();
                const isGood = (dir === 'up' && !STATS_LOWER_IS_BETTER.includes(policy.target_stat))
                    || (dir === 'down' && STATS_LOWER_IS_BETTER.includes(policy.target_stat));
                const arrow = dir === 'up' ? '\u25B2' : '\u25BC';
                const color = isGood ? 'var(--green)' : 'var(--red)';
                effectTags = `<span class="laws-effect-tag" style="color:${color};border-color:${color}30;">${formatStatName(policy.target_stat)} ${arrow}</span>`;
            }

            // Ideology badges
            const ideologies = policy.ideologies || (policy.ideology ? [policy.ideology] : []);
            const ideoBadges = ideologies.map(i => {
                const color = ideologyBg(i);
                return `<span class="laws-ideo-badge" style="color:${color};background:${color}12;border-color:${color}30;">${escapeHtml(i).toUpperCase()}</span>`;
            }).join('');

            const isEnacted = law._isEnacted;
            const optionName = law._selectedOptionName;
            const optionDesc = law._selectedOptionDescription;
            // When a specific option is in force, lead with the option's
            // name+description (the actual legal regime) and demote the
            // policy name to a small subtitle for context. Falls back to
            // the policy itself when no option is selected (or when the
            // law isn't enacted yet — catalog browse view).
            const showOption = isEnacted && optionName;
            const titleText = showOption ? optionName : (policy.policy_name || 'Unknown');
            const subtitleText = showOption ? policy.policy_name : '';
            const descText = showOption
                ? (optionDesc || policy.description || '')
                : (policy.description || '');
            lawsHtml += `<div class="laws-row${isEnacted ? ' enacted' : ''}">
                <div class="laws-row-main">
                    <div class="laws-row-title">
                        <span class="laws-row-name">${escapeHtml(titleText)}</span>
                        ${subtitleText ? `<span class="laws-row-policy">${escapeHtml(subtitleText)}</span>` : ''}
                        ${isEnacted ? '<span class="laws-enacted-badge">ENACTED</span>' : ''}
                        ${minor ? `<span class="laws-minor">${escapeHtml(minor)}</span>` : ''}
                        ${ideoBadges}
                    </div>
                    ${descText ? `<div class="laws-row-desc">${escapeHtml(descText)}</div>` : ''}
                </div>
                ${effectTags ? `<div class="laws-row-effects">${effectTags}</div>` : ''}
            </div>`;
        }
    }

    // Only do full render on first load; subsequent calls just update the list
    const existingList = document.getElementById('laws-list');
    if (!existingList) {
        const enactedCount = _lawsData.filter(l => l._isEnacted).length;
        container.innerHTML = `
            <div style="display:flex;flex-direction:column;height:100%;">
                <div class="ga-panel" style="margin-bottom:0;">
                    <div class="ga-panel-header">
                        <div style="display:flex;align-items:center;gap:11px;">
                            <span class="ga-panel-title">ALL LAWS</span>
                            <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);">${_lawsData.length} total &middot; ${enactedCount} enacted</span>
                        </div>
                        <input type="text" id="laws-search-input" placeholder="Search laws..." value="${escapeHtml(_lawsSearch)}" style="padding:4px 11px;font-family:var(--font-mono);font-size:12px;color:var(--text-bright);background:var(--bg-card);border:1px solid var(--border-main);outline:none;width:240px;">
                    </div>
                    <div style="padding:6px 19px;border-bottom:1px solid var(--border-main);display:flex;gap:4px;flex-wrap:wrap;" id="laws-pills">
                        ${pillsHtml}
                    </div>
                </div>
                <div style="flex:1;overflow-y:auto;" id="laws-list">
                    ${lawsHtml}
                </div>
            </div>
        `;

        // Event handlers — bound once, never destroyed
        container.onclick = (e) => {
            const filterBtn = e.target.closest('.laws-filter-btn');
            if (filterBtn) {
                _lawsFilter = filterBtn.dataset.lawsFilter;
                _updateLawsList();
            }
        };
        document.getElementById('laws-search-input')?.addEventListener('input', (e) => {
            _lawsSearch = e.target.value;
            _updateLawsList();
        });
    } else {
        // Just update the list content without touching the header/search
        existingList.innerHTML = lawsHtml;
    }

    function _updateLawsList() {
        // Re-render pills
        const pillsEl = document.getElementById('laws-pills');
        if (pillsEl) {
            const updatedSectors = [...new Set(_lawsData.map(l => l.policies?.major_sector || l.policies?.law_category).filter(Boolean))].sort();
            pillsEl.innerHTML = `
                <span class="leg-filter-btn laws-filter-btn ${_lawsFilter === 'ALL' ? 'active' : ''}" data-laws-filter="ALL">ALL</span>
                ${updatedSectors.map(s => `<span class="leg-filter-btn laws-filter-btn ${_lawsFilter === s ? 'active' : ''}" data-laws-filter="${escapeHtml(s)}">${escapeHtml(s)}</span>`).join('')}
            `;
        }
        // Re-filter and render just the list
        renderLawsTab(container);
    }
}

// ==================== ROYAL ASSENT (Absolute Monarchy) ====================

function renderRoyalAssentPanel() {
    if (!isAbsoluteMonarchy(currentNation) || !_legData) return;

    const assentBills = (_legData.floor || []).filter(b => b.status === 'awaiting_royal_assent');
    if (assentBills.length === 0) return;

    const isMonarch = currentNation?.monarch_faction_id === currentFaction?.id;
    const monarchTitle = currentNation?.monarch_title || 'King';
    const totalSeats = _legData.totalSeats || 100;
    const majority = Math.floor(totalSeats / 2) + 1;

    const rightEl = document.getElementById('leg-right');
    if (!rightEl) return;

    let html = `<div class="ga-panel" style="border-left:3px solid #c8a832;">
        <div class="ga-panel-header" style="background:rgba(200,168,50,0.06);">
            <span class="ga-panel-title" style="color:#c8a832;">&#128081; ROYAL ASSENT</span>
            <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);">${assentBills.length} bill${assentBills.length !== 1 ? 's' : ''} awaiting</span>
        </div>`;

    for (const bill of assentBills) {
        const proposer = bill.factions?.faction_name || 'Unknown';
        const proposerColor = bill.factions?.party_color || '#888';
        const forSeats = bill.votes_for || 0;
        const againstSeats = bill.votes_against || 0;
        const hasMajority = forSeats >= majority;
        const supportPct = totalSeats > 0 ? Math.round((forSeats / totalSeats) * 100) : 0;

        html += `<div style="padding:12px 16px;border-bottom:1px solid var(--border-main);">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                <div>
                    <div style="font-size:15px;font-weight:700;color:var(--text-bright);">${escapeHtml(bill.bill_name)}</div>
                    <div style="font-family:var(--font-mono);font-size:10px;color:${proposerColor};margin-top:2px;">Proposed by ${escapeHtml(proposer)}</div>
                </div>
                <div style="text-align:right;">
                    <div style="font-family:var(--font-mono);font-size:12px;font-weight:700;color:${hasMajority ? 'var(--green)' : 'var(--red)'};">${forSeats} YES / ${againstSeats} NO</div>
                    <div style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);">${supportPct}% support ${hasMajority ? '(majority)' : ''}</div>
                </div>
            </div>
            ${isMonarch ? `
                <div style="display:flex;gap:8px;margin-top:8px;">
                    <button onclick="royalAssent('${bill.id}', true)" style="flex:1;padding:8px;font-family:var(--font-mono);font-size:11px;font-weight:700;color:#000;background:#c8a832;border:none;cursor:pointer;letter-spacing:0.06em;">&#128081; ENACT (+1 Crown Authority)</button>
                    <button onclick="royalAssent('${bill.id}', false)" style="flex:1;padding:8px;font-family:var(--font-mono);font-size:11px;font-weight:700;color:#d44a4a;background:transparent;border:1px solid #d44a4a44;cursor:pointer;letter-spacing:0.06em;">&#10006; VETO ${hasMajority ? '(-3 Crown Authority)' : '(-1 Crown Authority)'}</button>
                </div>
            ` : `
                <div style="font-family:var(--font-mono);font-size:10px;color:#c8a832;margin-top:6px;font-style:italic;">Awaiting the ${escapeHtml(monarchTitle)}'s decision...</div>
            `}
        </div>`;
    }

    html += `</div>`;
    rightEl.insertAdjacentHTML('afterbegin', html);
}

window.royalAssent = async function(billId, enact) {
    if (_govActionLock) return;
    const isMonarch = currentNation?.monarch_faction_id === currentFaction?.id;
    if (!isMonarch) { alert('Only the Monarch can grant royal assent.'); return; }

    const bill = (_legData?.floor || []).find(b => b.id === billId);
    if (!bill) return;

    _govActionLock = true;

    const totalSeats = _legData?.totalSeats || 100;
    const majority = Math.floor(totalSeats / 2) + 1;
    const hasMajority = (bill.votes_for || 0) >= majority;

    try {
        const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const currentTick = shard?.current_tick || 0;

        if (enact) {
            // Re-fetch the bill with its articles + selected_option so enactBill
            // can apply policy effects. Only updating status='passed' (the
            // prior behavior) marked the bill resolved without ever writing
            // to active_laws / running stat effects — every monarchy enactment
            // was silently a no-op on the policy side.
            const { data: fullBill, error: billErr } = await _supabase.from('bills')
                .select('*, factions(faction_name), bill_articles(*, policies(*), selected_option:policy_options!selected_option_id(*)), bill_support(faction_id, stance, seat_count)')
                .eq('id', billId).single();
            if (billErr || !fullBill) {
                alert('Failed to load bill for enactment: ' + (billErr?.message || 'not found'));
                return;
            }
            const enactment = await enactBill(_supabase, fullBill, currentTick);
            if (!enactment?.success) {
                alert('Enactment failed: ' + (enactment?.error || 'unknown error'));
                return;
            }
            // +1 crown authority for active engagement (no delta on auto-enact via
            // processRoyalAssent — that path rewards absentee monarchs).
            const newCA = Math.min(100, (currentNation.crown_authority || 50) + 1);
            await _supabase.from('nations').update({ crown_authority: newCA }).eq('id', currentNation.id);
            currentNation.crown_authority = newCA;
        } else {
            // Veto: bill is dead, no policy effects to apply. Direct status
            // flip is correct here.
            await _supabase.from('bills').update({ status: 'vetoed' }).eq('id', billId);
            // -3 crown authority if majority supported, -1 otherwise
            const caCost = hasMajority ? -3 : -1;
            const newCA = Math.max(0, (currentNation.crown_authority || 50) + caCost);
            await _supabase.from('nations').update({ crown_authority: newCA }).eq('id', currentNation.id);
            currentNation.crown_authority = newCA;
        }

        // Reload legislature
        await loadLegislatureData();
        const content = document.getElementById('gov-content');
        if (content) renderLegislatureTab(content);
    } catch (err) {
        console.error('[RoyalAssent] Error:', err);
        alert('Failed to process royal assent: ' + (err?.message || err));
    } finally {
        _govActionLock = false;
    }
};

async function loadLegislatureData() {
    if (!currentNation) return;
    const nid = currentNation.id;

    try {
        const [committeeRes, floorRes, frozenRes, deskRes, resolvedRes, lawsRes, partiesRes, blocMap] = await Promise.all([
            _supabase.from('bills')
                .select('*, factions(faction_name, party_color, abbreviation), bill_articles(*, policies(*), selected_option:policy_options!selected_option_id(*)), bill_support(faction_id, stance, seat_count)')
                .eq('nation_id', nid).eq('status', 'committee'),
            _supabase.from('bills')
                .select('*, factions(faction_name, party_color, abbreviation), bill_articles(*, policies(*), selected_option:policy_options!selected_option_id(*)), bill_support(faction_id, stance, seat_count)')
                .eq('nation_id', nid).in('status', ['floor', 'voting', 'vetoed', 'referendum_pending', 'referendum_approved', 'awaiting_royal_assent']),
            _supabase.from('bills')
                .select('*, factions(faction_name, party_color, abbreviation), bill_articles(*, policies(*), selected_option:policy_options!selected_option_id(*))')
                .eq('nation_id', nid).eq('status', 'frozen'),
            // Presidential systems only: bills that passed the floor and are
            // waiting for the president to sign or veto. Without this, presidents
            // were being routed to laws.html just to find the sign/veto UI.
            isPresidential
                ? _supabase.from('bills')
                    .select('*, factions(faction_name, party_color, abbreviation), bill_articles(*, policies(*), selected_option:policy_options!selected_option_id(*))')
                    .eq('nation_id', nid).eq('status', 'president_desk')
                : Promise.resolve({ data: [] }),
            _supabase.from('bills')
                .select('*, factions(faction_name, party_color, abbreviation)')
                .eq('nation_id', nid).in('status', ['enacted', 'passed', 'failed', 'rejected'])
                .order('passed_tick', { ascending: false }).limit(20),
            _supabase.from('active_laws')
                .select('*, policies(*)')
                .eq('nation_id', nid),
            _supabase.from('factions')
                .select('id, faction_name, abbreviation, seats, party_color, bloc_id')
                .eq('nation_id', nid).eq('faction_type', 'party')
                .order('seats', { ascending: false }),
            loadBlocMap(nid),
        ]);

        const committee = committeeRes.data || [];
        const floor = floorRes.data || [];
        const frozen = frozenRes.data || [];
        const presidentDesk = deskRes.data || [];
        const resolved = resolvedRes.data || [];
        const activeLaws = lawsRes.data || [];
        const parties = partiesRes.data || [];

        // Recalculate vote tallies live from bill_support. The bills.votes_for /
        // votes_against / votes_abstain columns are a cache only written by the
        // tick processor's syncVoteTallies pass, so between votes and the next
        // tick they are stale — typically 0 for newly-on-the-floor bills. The
        // Legislative tab then shows "0% SUPPORT" even when votes have been
        // cast. Recomputing from the bill_support join here keeps the display
        // in sync with what Laws / bill.html already show.
        const recalcTallies = (b) => {
            let f = 0, a = 0, ab = 0;
            (b.bill_support || []).forEach(s => {
                const st = s.stance === 'accept' ? 'yes' : s.stance === 'reject' ? 'no' : s.stance;
                if (st === 'yes')          f  += (s.seat_count || 0);
                else if (st === 'no')      a  += (s.seat_count || 0);
                else if (st === 'abstain') ab += (s.seat_count || 0);
            });
            b.votes_for     = f;
            b.votes_against = a;
            b.votes_abstain = ab;
        };
        floor.forEach(recalcTallies);

        _legData = {
            committee,
            floor,
            frozen,
            presidentDesk,
            resolved,
            activeLaws,
            parties,
            blocMap: blocMap || {},
            totalSeats: currentNation.total_seats || GAME_CONFIG.TOTAL_SEATS,
            majority: Math.floor((currentNation.total_seats || GAME_CONFIG.TOTAL_SEATS) / 2) + 1,
        };
    } catch (err) {
        console.error('[Legislature] loadLegislatureData failed:', err);
        _legData = { committee: [], floor: [], frozen: [], presidentDesk: [], resolved: [], activeLaws: [], parties: [], blocMap: {}, totalSeats: 120, majority: 61 };
    }
}

function generateSemiCircleSeats(total, rows) {
    const seats = [];
    if (total <= 0) return seats;
    rows = rows || Math.max(3, Math.min(7, Math.ceil(total / 15)));
    const cx = 250, cy = 165;
    const rMin = 45, rMax = 150;
    const rowGap = rows > 1 ? (rMax - rMin) / (rows - 1) : 0;

    // Distribute seats proportional to arc length (π * radius)
    const radii = [];
    for (let r = 0; r < rows; r++) radii.push(rMin + r * rowGap);
    const totalArc = radii.reduce((sum, rad) => sum + rad, 0);
    const rawCounts = radii.map(rad => (rad / totalArc) * total);

    // Round while preserving total
    const counts = rawCounts.map(c => Math.floor(c));
    let remainder = total - counts.reduce((s, c) => s + c, 0);
    const fracs = rawCounts.map((c, i) => ({ i, frac: c - Math.floor(c) }));
    fracs.sort((a, b) => b.frac - a.frac);
    for (let k = 0; k < remainder; k++) counts[fracs[k].i]++;

    let idx = 0;
    const padAngle = 0.08; // padding from 0 and π
    for (let r = 0; r < rows && idx < total; r++) {
        const radius = radii[r];
        const n = Math.min(counts[r], total - idx);
        for (let s = 0; s < n; s++) {
            const angle = Math.PI * (padAngle + (s / Math.max(n - 1, 1)) * (1 - 2 * padAngle));
            seats.push({
                x: cx - Math.cos(angle) * radius * 1.55,
                y: cy - Math.sin(angle) * radius,
                idx: idx++,
            });
        }
    }
    return seats;
}

function renderParliamentPanel() {
    const el = document.getElementById('leg-left');
    if (!el || !_legData) return;
    const { parties, totalSeats, majority, blocMap } = _legData;
    const govPartyIds = _govData?.coalition?.party_ids || [];
    const govParties = parties.filter(p => govPartyIds.includes(p.id));
    const oppParties = parties.filter(p => !govPartyIds.includes(p.id));
    const govSeats = govParties.reduce((s, p) => s + (p.seats || 0), 0);
    const oppSeats = oppParties.reduce((s, p) => s + (p.seats || 0), 0);
    const aboveMajority = govSeats - majority;

    // Build seat color array: parties form contiguous wedge-shaped blocks
    // Gov parties on the left, opposition on the right — each party is a solid wedge
    const partyColorList = [];
    for (const p of govParties) {
        for (let i = 0; i < (p.seats || 0); i++) partyColorList.push(p.party_color || '#888');
    }
    for (const p of oppParties) {
        for (let i = 0; i < (p.seats || 0); i++) partyColorList.push(p.party_color || '#888');
    }
    // Vacant / unaligned seats render as white = "Independent" — universal
    // convention for "no party holds this seat" (covers pre-first-election
    // chambers, autocracy unaligned_seats pool, post-election gaps).
    while (partyColorList.length < totalSeats) partyColorList.push('#fff');

    const seatPositions = generateSemiCircleSeats(totalSeats);

    // Sort all seats by angle (left-to-right across the semicircle)
    // so party colors form contiguous wedges instead of scattering by row
    const sortedByAngle = [...seatPositions].sort((a, b) => {
        const angleA = Math.atan2(165 - a.y, a.x - 250);
        const angleB = Math.atan2(165 - b.y, b.x - 250);
        return angleB - angleA; // descending = left to right (π → 0)
    });

    // Map: sorted position index → party color
    const seatColorMap = {};
    for (let i = 0; i < sortedByAngle.length; i++) {
        seatColorMap[sortedByAngle[i].idx] = partyColorList[i] || '#fff';
    }

    // Scale dot radius: larger dots for small parliaments, smaller for large
    const dotR = totalSeats <= 30 ? 7 : totalSeats <= 60 ? 5.5 : totalSeats <= 120 ? 4.5 : 3.5;

    let html = '';

    // ── Semicircle SVG ──
    html += `<div class="ga-panel" style="padding:12px 8px 8px;">
        <div style="font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--text-dim);margin-bottom:6px;padding:0 8px;">CURRENT PARLIAMENTARY MAKEUP</div>
        <div style="position:relative;width:100%;max-width:520px;margin:0 auto;">
            <svg width="100%" viewBox="0 0 500 180" style="display:block;">
                <line x1="250" y1="8" x2="250" y2="170" stroke="var(--text-dim)" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.4" />
                <text x="250" y="7" text-anchor="middle" fill="var(--text-dim)" font-family="var(--font-mono)" font-size="7">${majority}</text>`;

    for (const s of seatPositions) {
        const color = seatColorMap[s.idx] || '#fff';
        // White (vacant/Independent) dots get a faint dim stroke instead of
        // the usual bg-body stroke — keeps them legible without glaring.
        const isVacant = color === '#fff';
        const stroke = isVacant ? 'var(--text-dim)' : 'var(--bg-body)';
        html += `<circle cx="${s.x.toFixed(1)}" cy="${s.y.toFixed(1)}" r="${dotR}" fill="${color}" opacity="0.9" stroke="${stroke}" stroke-width="0.8"/>`;
    }

    html += `<text x="250" y="158" text-anchor="middle" fill="var(--text-bright)" font-family="var(--font-mono)" font-size="20" font-weight="700">${totalSeats}</text>
                <text x="250" y="172" text-anchor="middle" fill="var(--text-dim)" font-family="var(--font-mono)" font-size="8" letter-spacing="1.5">TOTAL SEATS</text>
            </svg>
        </div>`;

    // Legend (parties with seats + Independent chip for vacant seats)
    const seatedParties = parties.filter(p => p.seats > 0);
    const seatedTotal = seatedParties.reduce((s, p) => s + (p.seats || 0), 0);
    const vacantSeats = Math.max(0, totalSeats - seatedTotal);
    if (seatedParties.length > 0 || vacantSeats > 0) {
        html += `<div style="display:flex;justify-content:center;gap:16px;padding:4px 0;flex-wrap:wrap;">`;
        for (const p of seatedParties) {
            html += `<div style="display:flex;align-items:center;gap:6px;">
                <div style="width:10px;height:10px;border-radius:50%;background:${p.party_color || '#888'};"></div>
                <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);">${escapeHtml(p.faction_name)}</span>
                <span style="font-family:var(--font-mono);font-size:12px;font-weight:700;color:${p.party_color || '#888'};">${p.seats}</span>
            </div>`;
        }
        if (vacantSeats > 0) {
            html += `<div style="display:flex;align-items:center;gap:6px;">
                <div style="width:10px;height:10px;border-radius:50%;background:#fff;border:1px solid var(--text-dim);"></div>
                <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);">Independent</span>
                <span style="font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--text-bright);">${vacantSeats}</span>
            </div>`;
        }
        html += `</div>`;
    }
    html += `</div>`;

    // ── Seat bar + Party breakdown ──
    html += `<div class="ga-panel" style="padding:8px 12px;">`;

    // Seat bar header
    html += `<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
        <span style="width:6px;height:6px;border-radius:50%;background:var(--green);"></span>
        <span style="font-family:var(--font-mono);font-size:13px;font-weight:700;letter-spacing:1.5px;color:var(--text-bright);">PARLIAMENT</span>
        <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-left:auto;">${totalSeats} seats</span>
    </div>`;

    // Stacked bar
    html += `<div style="display:flex;height:10px;margin-bottom:8px;gap:1px;">`;
    for (const p of parties.filter(pp => pp.seats > 0)) {
        html += `<div style="width:${(p.seats / totalSeats * 100).toFixed(1)}%;background:${p.party_color || '#888'};height:100%;"></div>`;
    }
    html += `</div>`;

    // Governing coalition
    html += `<div style="font-family:var(--font-mono);font-size:7px;font-weight:700;letter-spacing:1px;color:var(--text-dim);margin-bottom:4px;display:flex;justify-content:space-between;">
        <span>GOVERNING COALITION</span>
        <span style="color:var(--text-bright);">${govSeats} seats</span>
    </div>`;
    // Party-row renderer — single source of truth for both Governing and
    // Opposition lists. Dot shows the party logo via getPartyLogoHTML
    // (shared with the Cabinet avatar and every other party-icon site in
    // the app); the prior inline custom_logo_url / party_logo /
    // abbreviation ternary was a drifted duplicate that rendered emojis
    // as text instead of using the SVG icon set.
    const renderPartyRow = (p, { opposition = false } = {}) => {
        const isYou = !opposition && currentFaction && p.id === currentFaction.id;
        const color = p.party_color || '#888';
        const logoHtml = getPartyLogoHTML({
            customLogoUrl: p.custom_logo_url, iconKey: p.party_logo,
            size: 18, color,
        });
        const nameColor = opposition ? 'var(--text-dim)' : 'var(--text-bright)';
        const seatColor = opposition && p.seats === 0 ? 'var(--text-dim)' : 'var(--text-bright)';
        const rowOpacity = opposition && p.seats === 0 ? '0.5' : '1';
        const blocTag = blocTagHtml(p.bloc_id, blocMap);
        return `<div class="leg-party-row" style="opacity:${rowOpacity};">
            <div style="display:flex;align-items:center;gap:10px;">
                <div class="leg-party-dot" style="background:${color}20;border-color:${color};color:${color};display:flex;align-items:center;justify-content:center;">${logoHtml}</div>
                <div style="display:flex;flex-direction:column;gap:3px;min-width:0;">
                    <div style="display:flex;align-items:center;gap:6px;">
                        <span style="font-size:14px;${opposition ? '' : 'font-weight:600;'}color:${nameColor};">${escapeHtml(p.faction_name)}</span>
                        ${isYou ? '<span class="ga-badge ga-badge--green">YOU</span>' : ''}
                    </div>
                    ${blocTag}
