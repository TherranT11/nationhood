<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Your Party · Nationhood Game</title>
<link rel="stylesheet" href="/site.css">
<style>
  body {
    margin: 0; background: #fff; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .create { max-width: 760px; margin: 0 auto; padding: 44px 24px 120px; }
  .create h1 { font-size: clamp(26px, 4.5vw, 36px); letter-spacing: -0.03em; font-weight: 800; margin: 0 0 6px; }
  .create .sub { color: var(--muted); font-size: 15px; margin: 0 0 28px; }
  /* One-party-state explainer (shown only when the nation has a ruling party). */
  .banner { background: #ECE9FD; border: 1px solid #c7c0f5; border-radius: 12px; padding: 14px 16px; font-size: 14px; line-height: 1.55; color: var(--ink); margin: 0 0 26px; }
  .banner[hidden] { display: none; }
  .banner b { font-weight: 700; }

  .lbl { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 10px; }
  input.pname {
    width: 100%; font-size: 17px; font-weight: 600; padding: 14px 16px; border: 1px solid var(--line);
    border-radius: 12px; background: #fff; color: var(--ink); outline: none; transition: border-color .15s;
  }
  input.pname:focus { border-color: #b9b9b9; }
  input.pname.abbr { max-width: 220px; text-transform: uppercase; letter-spacing: 0.18em; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 700; }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 8px; }

  .arch-h { margin: 30px 0 12px; }
  .archs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 620px) { .archs { grid-template-columns: 1fr; } }
  .arch {
    --c: #5546E8;
    display: flex; gap: 14px; align-items: flex-start; text-align: left; background: #fff;
    border: 1.5px solid var(--line); border-radius: 14px; padding: 16px; cursor: pointer; color: var(--ink);
    font-family: inherit; transition: border-color .15s, background .15s, box-shadow .2s;
  }
  .arch:hover { border-color: var(--c); }
  .arch.sel { border-color: var(--c); background: color-mix(in srgb, var(--c) 6%, #fff); box-shadow: 0 10px 28px -18px var(--c); }
  .arch__ico { flex: none; width: 42px; height: 42px; border-radius: 11px; background: color-mix(in srgb, var(--c) 14%, #fff); color: var(--c); display: flex; align-items: center; justify-content: center; }
  .arch__ico svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .arch__b { flex: 1; min-width: 0; }
  .arch__n { display: block; font-weight: 800; font-size: 15.5px; letter-spacing: -0.01em; color: var(--c); }
  .arch__d { display: block; color: var(--muted); font-size: 13px; line-height: 1.45; margin-top: 4px; }

  /* sticky action bar */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.94); backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
  .bar__in { max-width: 760px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .bar .picked { font-size: 13px; color: var(--muted); }
  .bar .picked b { color: var(--ink); }
  .bar .btns { display: flex; gap: 10px; }
  .bar .btn { padding: 12px 22px; font-size: 15px; }
  .btn-solid[disabled] { opacity: .45; cursor: not-allowed; }
  .msg.error { color: var(--err); }
  @media (max-width: 560px) { .create { padding: 28px 16px 116px; } .create h1 { font-size: 25px; } .arch { padding: 14px; gap: 12px; } .bar__in { padding: 12px 16px; } .bar .picked { flex-basis: 100%; } .bar .btns { flex: 1; } .bar .btn { flex: 1; } }
</style>
</head>
<body>
  <header>
    <div class="wrap nav">
      <div class="brand">Nationhood</div>
      <nav class="nav-actions">
        <a class="btn btn-discord" href="https://discord.gg/HBvWxJUm8" target="_blank" rel="noopener" aria-label="Join the Discord">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.369A19.79 19.79 0 0 0 16.558 3a13.6 13.6 0 0 0-.6 1.23 18.27 18.27 0 0 0-5.487 0A13.6 13.6 0 0 0 9.87 3a19.79 19.79 0 0 0-3.76 1.369C2.72 9.046 1.79 13.605 2.255 18.1a19.9 19.9 0 0 0 6.073 3.058c.49-.668.926-1.377 1.302-2.122a12.93 12.93 0 0 1-2.05-.978c.172-.126.34-.257.502-.392a14.2 14.2 0 0 0 12.036 0c.164.135.332.266.502.392-.654.386-1.343.714-2.052.98.376.743.812 1.452 1.302 2.12a19.86 19.86 0 0 0 6.075-3.058c.546-5.21-.93-9.728-3.93-13.73ZM9.682 15.33c-1.182 0-2.157-1.086-2.157-2.42 0-1.333.955-2.42 2.157-2.42 1.21 0 2.176 1.097 2.157 2.42 0 1.334-.955 2.42-2.157 2.42Zm4.636 0c-1.182 0-2.157-1.086-2.157-2.42 0-1.333.955-2.42 2.157-2.42 1.21 0 2.176 1.097 2.157 2.42 0 1.334-.946 2.42-2.157 2.42Z"/></svg>
          <span class="btn-label">Discord</span>
        </a>
        <button class="btn btn-ghost" id="logout" type="button">Log out</button>
        <span class="gamedate">January, 1980</span>
      </nav>
    </div>
  </header>

  <main class="create">
    <h1 id="h1">Create your party</h1>
    <p class="sub" id="sub">Name your party and choose what it stands for.</p>
    <div class="banner" id="onepartyBanner" hidden></div>

    <div class="lbl" id="nameLbl">Party name</div>
    <input class="pname" id="pname" type="text" maxlength="48" placeholder="e.g. The People's Front" autocomplete="off">

    <div class="lbl arch-h">Party abbreviation</div>
    <input class="pname abbr" id="pabbr" type="text" maxlength="4" placeholder="e.g. PFP" autocomplete="off" spellcheck="false">
    <div class="hint">2–4 capital letters. Must be unique within the nation.</div>

    <div class="lbl arch-h">Choose an archetype</div>
    <div class="archs" id="archs"></div>
  </main>

  <div class="bar">
    <div class="bar__in">
      <span class="picked" id="picked">Pick a name and an archetype to continue.</span>
      <div class="btns">
        <a class="btn btn-ghost" href="/nation-select/" role="button">Go Back</a>
        <button class="btn btn-solid" id="join" type="button" disabled>Join Nation</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase, isConfigured, requireUser, logout, currentParty } from '/supabase.js';
    import { esc, MAX_PARTIES_PER_NATION as MAX_PARTIES, COMPETENCIES } from '/util.js';

    // Guard: if you already have a party, you can't found another — go to your
    // instance instead of overwriting it.
    (async () => { if (await currentParty()) window.location.replace('/play/'); })();
    import { ARCHETYPES } from '/archetypes.js';

    document.getElementById('logout').addEventListener('click', logout);

    // Which nation are we founding a party in? (?nation=<id>, default sessau.)
    var nationId = new URLSearchParams(location.search).get('nation') || 'sessau';
    // One-party state: set when the nation has a ruling party (you join as a faction).
    var rulingName = '', noun = 'party';

    var selected = null;
    var pname = document.getElementById('pname');
    var pabbr = document.getElementById('pabbr');
    var join = document.getElementById('join');
    var picked = document.getElementById('picked');

    document.getElementById('archs').innerHTML = ARCHETYPES.map(function (a) {
      return '<button class="arch" type="button" data-id="' + a.id + '" style="--c:' + a.color + '">' +
        '<span class="arch__ico"><svg viewBox="0 0 24 24">' + a.icon + '</svg></span>' +
        '<span class="arch__b"><span class="arch__n">' + a.name + '</span><span class="arch__d">' + a.desc + '</span></span></button>';
    }).join('');

    document.querySelectorAll('.arch').forEach(function (el) {
      el.addEventListener('click', function () {
        document.querySelectorAll('.arch').forEach(function (x) { x.classList.remove('sel'); });
        el.classList.add('sel');
        selected = el.dataset.id;
        refresh();
      });
    });
    pname.addEventListener('input', refresh);
    // Abbreviation: force to 2–4 capital letters as the player types.
    pabbr.addEventListener('input', function () {
      pabbr.value = pabbr.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
      refresh();
    });

    function archName(id) { var a = ARCHETYPES.filter(function (x) { return x.id === id; })[0]; return a ? a.name : ''; }
    function abbrOk() { return /^[A-Z]{2,4}$/.test(pabbr.value.trim()); }
    function refresh() {
      var name = pname.value.trim();
      var ready = name.length > 0 && abbrOk() && selected && !saving;
      join.disabled = !ready;
      if (name && abbrOk() && selected) { picked.className = 'picked'; picked.innerHTML = '<b>' + esc(name) + '</b> (' + esc(pabbr.value.trim()) + ') · ' + esc(archName(selected)); }
      else { picked.className = 'picked'; picked.textContent = 'Add a name, a 2–4 letter abbreviation, and an archetype to continue.'; }
    }

    // One-party state: if the admin named a ruling party for this nation, you join
    // as a FACTION of it. Fetch the nation, then relabel the page — the form,
    // validation and seeding logic are otherwise identical (a faction is a party row).
    (async () => {
      if (!isConfigured) return;
      try {
        const { data } = await supabase.from('nations').select('name, ruling_party').eq('id', nationId).maybeSingle();
        if (!data || !data.ruling_party) return;
        rulingName = data.ruling_party; noun = 'faction';
        var b = document.getElementById('onepartyBanner');
        b.innerHTML = 'The nation of <b>' + esc(data.name || 'this nation') + '</b> is a one-party state. New political parties are not legally viable — if you join, you do so as a <b>caucus / faction of ' + esc(rulingName) + '</b>. Name your faction and choose an archetype; its members are those who support that line.';
        b.hidden = false;
        document.getElementById('h1').textContent = 'Create your faction';
        document.getElementById('sub').textContent = 'Form a faction within ' + rulingName + ' and choose what it stands for.';
        document.getElementById('nameLbl').textContent = 'Faction name';
        pname.setAttribute('placeholder', 'e.g. The Reformist Bloc');
        join.textContent = 'Join ' + rulingName;
      } catch (e) { /* leave the default multiparty copy */ }
    })();

    // A brand-new party starts with one prominent politician — its Party Leader.
    // Names come from this nation's nation_names pool; age 25–55; experience =
    // age/10 (floor), which is the number of stat points spread randomly across
    // the five competencies. Skips if the party already has politicians (so a
    // re-founding upsert doesn't mint a second leader), and if the nation has no
    // name pool the roster just starts empty. Non-fatal: a failure here never
    // blocks party creation.
    async function seedLeader(partyId) {
      try {
        const { count } = await supabase.from('politicians')
          .select('id', { count: 'exact', head: true }).eq('party_id', partyId);
        if (count) return;
        const { data: names, error } = await supabase.from('nation_names').select('name, kind').eq('nation_id', nationId);
        if (error || !names) return;
        var firsts = names.filter(function (n) { return n.kind === 'male' || n.kind === 'female'; });
        var surs = names.filter(function (n) { return n.kind === 'surname'; });
        if (!firsts.length || !surs.length) return;
        var pick = function (a) { return a[Math.floor(Math.random() * a.length)].name; };

        var age = 25 + Math.floor(Math.random() * 31);  // 25–55 inclusive
        var exp = Math.floor(age / 10);                  // experience = stat points to spend
        var stats = { cha: 0, acu: 0, gui: 0, res: 0, com: 0 };
        var keys = COMPETENCIES.map(function (c) { return c.key; });
        for (var i = 0; i < exp; i++) { stats[keys[Math.floor(Math.random() * keys.length)]]++; }

        await supabase.from('politicians').insert({
          party_id: partyId, first_name: pick(firsts), last_name: pick(surs),
          age: age, experience: exp, status: 'Party Leader',
          cha: stats.cha, acu: stats.acu, gui: stats.gui, res: stats.res, com: stats.com
        });
      } catch (e) { /* non-fatal: party still exists, roster just starts empty */ }
    }

    var saving = false;
    function fail(text) { picked.className = 'picked msg error'; picked.textContent = text; saving = false; join.disabled = false; }
    join.addEventListener('click', async function () {
      var name = pname.value.trim();
      var abbr = pabbr.value.trim().toUpperCase();
      if (saving || !name || !selected || !abbrOk()) return;
      if (!isConfigured) { fail('Not connected yet.'); return; }
      var user = await requireUser();
      if (!user) return; // redirected to login
      // Name the archetype in the confirmation so what's being saved is visible.
      saving = true; join.disabled = true; picked.className = 'picked'; picked.textContent = 'Founding ' + name + ' (' + archName(selected) + ')…';
      try {
        // No two parties in a nation may share a name (case-insensitive) or
        // abbreviation. Pre-check for a clear message; the DB unique indexes are
        // the real guard (a race still can't create a duplicate). Exclude the
        // player's own party server-side so re-creating doesn't clash with itself.
        const { data: others, error: qerr } = await supabase.from('parties')
          .select('name, abbreviation').eq('nation_id', nationId).neq('user_id', user.id);
        if (qerr) throw qerr;

        // Hard cap: a nation holds at most MAX_PARTIES. `others` excludes this
        // player, so if they don't already hold a slot here, theirs would be the
        // (others.length + 1)th — reject once the other parties already fill it.
        // (Client-side guard; a race-proof cap needs a server-side check — see
        // the parties table comment in schema/20_parties.sql.)
        if ((others || []).length >= MAX_PARTIES) {
          fail('This nation is full — it already has its ' + MAX_PARTIES + ' ' + noun + 's.'); return;
        }

        var lname = name.toLowerCase();
        var clash = (others || []).some(function (p) {
          return ((p.name || '').toLowerCase() === lname) || ((p.abbreviation || '').toUpperCase() === abbr);
        });
        if (clash) { fail('A ' + noun + ' with that name or abbreviation already exists in this nation.'); return; }

        // One party per player: upsert on the user so re-creating replaces.
        const { data: created, error } = await supabase.from('parties')
          .upsert({ user_id: user.id, nation_id: nationId, name: name, abbreviation: abbr, archetype: archName(selected) }, { onConflict: 'user_id' })
          .select('id').single();
        if (error || !created) { fail('That name or abbreviation is already taken in this nation.'); return; }
        await seedLeader(created.id);  // give a brand-new party its Party Leader
        window.location.href = '/play/';
      } catch (e) {
        fail('Something went wrong. Try again.');
      }
    });
  </script>
</body>
</html>
