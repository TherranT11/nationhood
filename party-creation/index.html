<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Your Party · Nationhood Game</title>
<link rel="stylesheet" href="/site.css">
<style>
  body {
    margin: 0; background: #fff; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .gamedate { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: #5546E8; background: #ECE9FD; border-radius: 999px; padding: 8px 13px; white-space: nowrap; }

  .create { max-width: 760px; margin: 0 auto; padding: 44px 24px 120px; }
  .create h1 { font-size: clamp(26px, 4.5vw, 36px); letter-spacing: -0.03em; font-weight: 800; margin: 0 0 6px; }
  .create .sub { color: var(--muted); font-size: 15px; margin: 0 0 28px; }

  .lbl { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 10px; }
  input.pname {
    width: 100%; font-size: 17px; font-weight: 600; padding: 14px 16px; border: 1px solid var(--line);
    border-radius: 12px; background: #fff; color: var(--ink); outline: none; transition: border-color .15s;
  }
  input.pname:focus { border-color: #b9b9b9; }

  .arch-h { margin: 30px 0 12px; }
  .archs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 620px) { .archs { grid-template-columns: 1fr; } }
  .arch {
    display: flex; gap: 14px; align-items: flex-start; text-align: left; background: #fff;
    border: 1.5px solid var(--line); border-radius: 14px; padding: 16px; cursor: pointer; color: var(--ink);
    font-family: inherit; transition: border-color .15s, background .15s, box-shadow .2s;
  }
  .arch:hover { border-color: #5546E8; }
  .arch.sel { border-color: #5546E8; background: #F6F5FE; box-shadow: 0 10px 28px -18px rgba(85,70,232,.6); }
  .arch__ico { flex: none; width: 42px; height: 42px; border-radius: 11px; background: #ECE9FD; color: #5546E8; display: flex; align-items: center; justify-content: center; }
  .arch__ico svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .arch__b { flex: 1; min-width: 0; }
  .arch__n { font-weight: 800; font-size: 15.5px; letter-spacing: -0.01em; }
  .arch__d { color: var(--muted); font-size: 13px; line-height: 1.45; margin-top: 4px; }

  /* sticky action bar */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.94); backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
  .bar__in { max-width: 760px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .bar .picked { font-size: 13px; color: var(--muted); }
  .bar .picked b { color: var(--ink); }
  .bar .btns { display: flex; gap: 10px; }
  .bar .btn { padding: 12px 22px; font-size: 15px; }
  .btn-solid[disabled] { opacity: .45; cursor: not-allowed; }
  .msg.error { color: var(--err); }
  @media (max-width: 560px) { .gamedate { display: none; } .bar__in { padding: 12px 16px; } .bar .picked { flex-basis: 100%; } .bar .btns { flex: 1; } .bar .btn { flex: 1; } }
</style>
</head>
<body>
  <header>
    <div class="wrap nav">
      <div class="brand">Nationhood</div>
      <nav class="nav-actions">
        <a class="btn btn-discord" href="https://discord.gg/HBvWxJUm8" target="_blank" rel="noopener" aria-label="Join the Discord">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.369A19.79 19.79 0 0 0 16.558 3a13.6 13.6 0 0 0-.6 1.23 18.27 18.27 0 0 0-5.487 0A13.6 13.6 0 0 0 9.87 3a19.79 19.79 0 0 0-3.76 1.369C2.72 9.046 1.79 13.605 2.255 18.1a19.9 19.9 0 0 0 6.073 3.058c.49-.668.926-1.377 1.302-2.122a12.93 12.93 0 0 1-2.05-.978c.172-.126.34-.257.502-.392a14.2 14.2 0 0 0 12.036 0c.164.135.332.266.502.392-.654.386-1.343.714-2.052.98.376.743.812 1.452 1.302 2.12a19.86 19.86 0 0 0 6.075-3.058c.546-5.21-.93-9.728-3.93-13.73ZM9.682 15.33c-1.182 0-2.157-1.086-2.157-2.42 0-1.333.955-2.42 2.157-2.42 1.21 0 2.176 1.097 2.157 2.42 0 1.334-.955 2.42-2.157 2.42Zm4.636 0c-1.182 0-2.157-1.086-2.157-2.42 0-1.333.955-2.42 2.157-2.42 1.21 0 2.176 1.097 2.157 2.42 0 1.334-.946 2.42-2.157 2.42Z"/></svg>
          <span class="btn-label">Discord</span>
        </a>
        <button class="btn btn-ghost" id="logout" type="button">Log out</button>
        <span class="gamedate">January, 1980</span>
      </nav>
    </div>
  </header>

  <main class="create">
    <h1>Create your party</h1>
    <p class="sub" id="sub">Name your party and choose what it stands for.</p>

    <div class="lbl">Party name</div>
    <input class="pname" id="pname" type="text" maxlength="48" placeholder="e.g. The People's Front" autocomplete="off">

    <div class="lbl arch-h">Choose an archetype</div>
    <div class="archs" id="archs"></div>
  </main>

  <div class="bar">
    <div class="bar__in">
      <span class="picked" id="picked">Pick a name and an archetype to continue.</span>
      <div class="btns">
        <a class="btn btn-ghost" href="/nation-select/" role="button">Go Back</a>
        <button class="btn btn-solid" id="join" type="button" disabled>Join Nation</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase, isConfigured, requireUser, logout } from '/supabase.js';

    document.getElementById('logout').addEventListener('click', logout);

    // Which nation are we founding a party in? (?nation=<id>, default sessau.)
    var nationId = new URLSearchParams(location.search).get('nation') || 'sessau';

    var ARCHETYPES = [
      { id: 'centrist',     name: 'Centrist',         desc: 'Pragmatic middle ground — balance the market and the state, govern by consensus.', icon: '<path d="M12 3v18"/><path d="M5 20h14"/><path d="M4 7h16"/><path d="M4 7l-2 5a3 3 0 006 0z"/><path d="M20 7l-2 5a3 3 0 006 0z"/>' },
      { id: 'conservative', name: 'Conservative',     desc: 'Tradition, order, and a steady hand — protect institutions and the established way.', icon: '<path d="M3 9l9-5 9 5"/><path d="M3 20h18"/><path d="M6 9v11M10 9v11M14 9v11M18 9v11"/>' },
      { id: 'nationalist',  name: 'Nationalist',      desc: 'Nation first — sovereignty, heritage, and strong borders.', icon: '<path d="M5 3v18"/><path d="M5 4h13l-3 5 3 5H5"/>' },
      { id: 'liberal',      name: 'Liberal',          desc: 'Civic freedoms and open markets — individual rights and a pro-business state.', icon: '<circle cx="12" cy="7" r="3"/><path d="M5 21v-1a7 7 0 0114 0v1"/>' },
      { id: 'libertarian',  name: 'Libertarian',      desc: 'Minimal government — maximum personal and economic liberty.', icon: '<circle cx="9" cy="9" r="4"/><path d="M12 12l8 8M16 16l2-2M19 19l2-2"/>' },
      { id: 'green',        name: 'Green',            desc: 'The environment above all — sustainability, conservation, and climate action.', icon: '<path d="M5 21c0-9 6-15 16-16-1 11-7 16-16 16z"/><path d="M9 17c1-5 4-8 8-10"/>' },
      { id: 'progressive',  name: 'Progressive',      desc: 'Reform and social justice — expand rights and remake the system.', icon: '<path d="M3 17l6-6 4 4 8-8"/><path d="M16 7h5v5"/>' },
      { id: 'agrarian',     name: 'Agrarian',         desc: 'The land and its people — farmers, rural life, and food sovereignty.', icon: '<path d="M12 22v-9"/><path d="M12 13c0-3-2-6-6-6 0 4 3 6 6 6z"/><path d="M12 14c0-3 2-5 5-5 0 3-2 5-5 5z"/>' },
      { id: 'faith',        name: 'Faith / Religious', desc: 'Faith at the centre — a moral order rooted in religious tradition.', icon: '<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>' },
      { id: 'communist',    name: 'Communist',        desc: 'Workers own the means — collective ownership and a planned economy.', icon: '<path d="M12 3l2.6 5.9 6.4.6-4.8 4.3 1.4 6.3L12 17l-5.6 3.4 1.4-6.3L3 9.5l6.4-.6z"/>' },
    ];

    var selected = null;
    var pname = document.getElementById('pname');
    var join = document.getElementById('join');
    var picked = document.getElementById('picked');

    document.getElementById('archs').innerHTML = ARCHETYPES.map(function (a) {
      return '<button class="arch" type="button" data-id="' + a.id + '">' +
        '<span class="arch__ico"><svg viewBox="0 0 24 24">' + a.icon + '</svg></span>' +
        '<span class="arch__b"><span class="arch__n">' + a.name + '</span><span class="arch__d">' + a.desc + '</span></span></button>';
    }).join('');

    document.querySelectorAll('.arch').forEach(function (el) {
      el.addEventListener('click', function () {
        document.querySelectorAll('.arch').forEach(function (x) { x.classList.remove('sel'); });
        el.classList.add('sel');
        selected = el.dataset.id;
        refresh();
      });
    });
    pname.addEventListener('input', refresh);

    function archName(id) { var a = ARCHETYPES.filter(function (x) { return x.id === id; })[0]; return a ? a.name : ''; }
    function refresh() {
      var name = pname.value.trim();
      var ready = name.length > 0 && selected && !saving;
      join.disabled = !ready;
      if (name && selected) { picked.className = 'picked'; picked.innerHTML = '<b>' + esc(name) + '</b> · ' + esc(archName(selected)); }
      else { picked.className = 'picked'; picked.textContent = 'Pick a name and an archetype to continue.'; }
    }
    function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }

    var saving = false;
    join.addEventListener('click', async function () {
      var name = pname.value.trim();
      if (saving || !name || !selected) return;
      if (!isConfigured) { picked.className = 'picked msg error'; picked.textContent = 'Not connected yet.'; return; }
      var user = await requireUser();
      if (!user) return; // redirected to login
      saving = true; join.disabled = true; picked.className = 'picked'; picked.textContent = 'Founding your party…';
      try {
        // One party per player: upsert on the user so re-creating replaces.
        const { error } = await supabase.from('parties')
          .upsert({ user_id: user.id, nation_id: nationId, name: name, archetype: archName(selected) }, { onConflict: 'user_id' });
        if (error) { picked.className = 'picked msg error'; picked.textContent = 'Could not create your party. Try again.'; saving = false; join.disabled = false; return; }
        window.location.href = '/play/';
      } catch (e) {
        picked.className = 'picked msg error'; picked.textContent = 'Something went wrong. Try again.'; saving = false; join.disabled = false;
      }
    });
  </script>
</body>
</html>
