<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROME — Senate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --stone:#14110d; --stone-lit:#1e1a13; --edge:#322a1e;
    --marble:#e8e0cf; --marble-dim:#9a8f78; --faint:#5f5643;
    --gold:#c8a24a;
    --patrician:#9c3a34; --patrician-lit:#b8524b;
    --plebeian:#3f6d8c; --plebeian-lit:#5688a8;
    --blood:#7a2f26;
    --display:'Cinzel',serif; --body:'EB Garamond',serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--stone); color:var(--marble); font-family:var(--body);
    font-size:18px; line-height:1.6; min-height:100vh; display:flex; flex-direction:column; }

  /* ---- top bar ---- */
  .topbar { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:1rem;
    padding:0.85rem 1.5rem; background:var(--stone-lit); border-bottom:1px solid var(--edge); }
  .time { display:flex; align-items:center; flex-wrap:wrap; }
  .time .cell { display:flex; align-items:baseline; gap:0.5rem; padding:0 1.15rem; border-right:1px solid var(--edge); }
  .time .cell:first-child { padding-left:0; }
  .time .cell:last-child { border-right:none; }
  .time .lbl { font-family:var(--display); font-size:0.6rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--marble-dim); }
  .time .val { font-family:var(--display); font-weight:600; font-size:0.9rem; color:var(--marble); }
  .time .val.gold { color:var(--gold); }
  .time .val.pending { color:var(--faint); }
  .family-head { text-align:center; }
  .family-head .name { font-family:var(--display); font-weight:700; font-size:1.05rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--gold); }
  .family-head .rank { font-family:var(--display); font-size:0.58rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--marble-dim); margin-top:1px; }
  .top-right { display:flex; justify-content:flex-end; }
  .logout { font-family:var(--display); font-size:0.62rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--marble-dim); background:none; border:1px solid var(--edge); padding:0.5rem 1rem; cursor:pointer; transition:border-color 0.2s, color 0.2s; }
  .logout:hover { border-color:var(--blood); color:var(--marble); }

  /* ---- frame ---- */
  .frame { flex:1; display:flex; min-height:0; }
  .sidebar { width:190px; min-width:190px; background:var(--stone-lit); border-right:1px solid var(--edge); padding-top:0.5rem; display:flex; flex-direction:column; }
  .nav-item { display:flex; align-items:center; gap:0.75rem; width:100%; text-align:left; font-family:var(--display); font-weight:600; font-size:0.72rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--marble-dim); background:none; border:none; border-left:3px solid transparent; padding:0.9rem 1.4rem; cursor:pointer; transition:color 0.15s, background 0.15s; }
  .nav-item:hover { color:var(--marble); }
  .nav-item.on { color:var(--gold); background:#1a1509; border-left-color:var(--gold); }
  .nav-item .glyph { width:6px; height:6px; transform:rotate(45deg); background:currentColor; opacity:0.7; flex:none; }
  .sidebar-foot { margin-top:auto; padding:1rem 1.4rem; font-family:var(--display); font-size:0.55rem; letter-spacing:0.24em; text-transform:uppercase; color:var(--faint); }
  .content { flex:1; padding:2rem 1.75rem 3rem; overflow:auto; }

  .page-title { font-family:var(--display); font-weight:600; font-size:0.72rem; letter-spacing:0.26em; text-transform:uppercase; color:var(--marble-dim); text-align:center; margin-bottom:1.75rem; }

  /* ---- layout: left column (senators + floor) + hemicycle ---- */
  .senate-grid { display:grid; grid-template-columns:290px 1fr; gap:1.5rem; align-items:start; }
  @media (max-width:900px){ .senate-grid{ grid-template-columns:1fr; } }

  .panel { background:var(--stone-lit); border:1px solid var(--edge); position:relative; }
  .panel + .panel { margin-top:1.25rem; }
  .panel::before, .panel::after { content:""; position:absolute; width:11px; height:11px; border:1px solid var(--gold); opacity:0.4; }
  .panel::before { top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .panel::after { bottom:-1px; right:-1px; border-left:none; border-top:none; }
  .panel-head { font-family:var(--display); font-weight:600; font-size:0.7rem; letter-spacing:0.22em; text-transform:uppercase; color:var(--marble); padding:1rem 1.3rem; border-bottom:1px solid var(--edge); }
  .panel-body { padding:1.3rem 1.4rem; min-height:120px; display:flex; align-items:center; justify-content:center; }
  .empty-line { color:var(--faint); font-style:italic; font-size:0.9rem; text-align:center; }

  /* ---- hemicycle ---- */
  .chamber { background:var(--stone-lit); border:1px solid var(--edge); padding:1.5rem 1.5rem 1.25rem; position:relative; }
  .chamber::before, .chamber::after { content:""; position:absolute; width:12px; height:12px; border:1px solid var(--gold); opacity:0.4; }
  .chamber::before { top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .chamber::after { bottom:-1px; right:-1px; border-left:none; border-top:none; }
  .chamber-title { font-family:var(--display); font-weight:600; font-size:0.7rem; letter-spacing:0.22em; text-transform:uppercase; color:var(--marble); text-align:center; margin-bottom:0.5rem; }
  .chamber-sub { text-align:center; font-style:italic; color:var(--marble-dim); font-size:0.9rem; margin-bottom:1rem; }
  .hemicycle { width:50%; max-width:100%; display:block; margin:0 auto; }
  /* seat colours live in CSS (var() does not resolve as an SVG presentation attribute) */
  .seat { stroke-width:0.6; }
  .seat.pat  { fill:var(--patrician); stroke:var(--patrician-lit); }
  .seat.pleb { fill:var(--plebeian);  stroke:var(--plebeian-lit); }
  .dais { fill:var(--gold); opacity:0.8; }

  /* legend */
  .legend { display:flex; justify-content:center; gap:2rem; margin-top:0.75rem; padding-top:1rem; border-top:1px solid var(--edge); flex-wrap:wrap; }
  .leg { display:flex; align-items:center; gap:0.6rem; }
  .leg .dot { width:13px; height:13px; border-radius:50%; flex:none; }
  .leg .dot.pat { background:var(--patrician); }
  .leg .dot.pleb { background:var(--plebeian); }
  .leg .txt { font-family:var(--display); font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--marble); }
  .leg .num { color:var(--marble-dim); }
</style>
</head>
<body>

<header class="topbar">
  <div class="time">
    <span class="cell"><span class="lbl">Year</span><span class="val gold">300 BC</span></span>
    <span class="cell"><span class="lbl">Season</span><span class="val">Spring</span></span>
    <span class="cell"><span class="lbl">Countdown</span><span class="val pending">&mdash;</span></span>
  </div>
  <div class="family-head">
    <div class="name">&nbsp;</div>
    <div class="rank">&nbsp;</div>
  </div>
  <div class="top-right"><button class="logout" id="logout">Log Out</button></div>
</header>

<div class="frame">
  <nav class="sidebar" aria-label="Main navigation">
    <button class="nav-item" onclick="location.href='/home/'"><span class="glyph" aria-hidden="true"></span>Home</button>
    <button class="nav-item" onclick="location.href='/family/'"><span class="glyph" aria-hidden="true"></span>Family</button>
    <button class="nav-item on"><span class="glyph" aria-hidden="true"></span>Senate</button>
    <div class="sidebar-foot">S &middot; P &middot; Q &middot; R</div>
  </nav>

  <main class="content">
    <h1 class="page-title">The Senate of Rome</h1>

    <div class="senate-grid">
      <!-- LEFT COLUMN -->
      <div>
        <section class="panel">
          <div class="panel-head">Prominent Senators</div>
          <div class="panel-body">
            <p class="empty-line">No senators have risen to prominence yet.</p>
          </div>
        </section>
        <section class="panel">
          <div class="panel-head">Senate Floor</div>
          <div class="panel-body">
            <p class="empty-line">No motion is before the house.</p>
          </div>
        </section>
      </div>

      <!-- HEMICYCLE -->
      <section class="chamber">
        <h2 class="chamber-title" id="curia-title">The Curia</h2>
        <p class="chamber-sub" id="curia-sub">The house is seated.</p>
        <svg class="hemicycle" id="hemicycle" viewBox="0 0 600 340" role="img"
          aria-label="Hemicycle of the Roman Senate"></svg>

        <div class="legend">
          <span class="leg"><span class="dot pat"></span><span class="txt">Patricians <span class="num">&mdash; <span id="leg-pat">&mdash;</span></span></span></span>
          <span class="leg"><span class="dot pleb"></span><span class="txt">Plebeians <span class="num">&mdash; <span id="leg-pleb">&mdash;</span></span></span></span>
        </div>
      </section>
    </div>
  </main>
</div>

<script type="module">
  import { signOut, currentCharacter, romeStats } from '../supabase.js';
  import { gensName, BIRTHPLACES } from '../names.js';

  const $ = (id) => document.getElementById(id);
  const svgns = 'http://www.w3.org/2000/svg';

  // Build the hemicycle: `total` seats over 10 rows, the first `patricians`
  // (seated left→right) coloured Patrician, the rest Plebeian.
  function buildHemicycle(total, patricians) {
    const rows = 10, innerR = 70, rowGap = 15, cx = 300, cy = 300;
    const svg = $('hemicycle');

    const radii = [], weights = [];
    for (let i = 0; i < rows; i++) { radii.push(innerR + i * rowGap); weights.push(innerR + i * rowGap); }
    const totW = weights.reduce((a, b) => a + b, 0);
    const counts = weights.map((w) => Math.max(6, Math.round(total * w / totW)));
    const sum = () => counts.reduce((a, b) => a + b, 0);
    while (sum() > total) counts[counts.indexOf(Math.max(...counts))]--;
    while (sum() < total) counts[counts.indexOf(Math.min(...counts))]++;

    const seats = [];
    for (let ri = 0; ri < rows; ri++) {
      const r = radii[ri], n = counts[ri];
      for (let si = 0; si < n; si++) {
        const ang = n === 1 ? Math.PI / 2 : Math.PI - (si / (n - 1)) * Math.PI;
        seats.push({ x: cx + r * Math.cos(ang), y: cy - r * Math.sin(ang), ang });
      }
    }
    seats.sort((a, b) => b.ang - a.ang);   // left(π) → right(0)
    seats.forEach((s, i) => {
      const el = document.createElementNS(svgns, 'circle');
      el.setAttribute('cx', s.x.toFixed(1));
      el.setAttribute('cy', s.y.toFixed(1));
      el.setAttribute('r', '5.2');
      el.setAttribute('class', 'seat ' + (i < patricians ? 'pat' : 'pleb'));
      svg.appendChild(el);
    });

    const dais = document.createElementNS(svgns, 'rect');
    dais.setAttribute('x', cx - 22); dais.setAttribute('y', cy - 4);
    dais.setAttribute('width', 44); dais.setAttribute('height', 5);
    dais.setAttribute('class', 'dais');
    svg.appendChild(dais);
  }

  // Gate + populate. Only a signed-in player with a founded gens belongs here.
  (async () => {
    const { data: c } = await currentCharacter();
    if (!c) { window.location.href = '/'; return; }

    const gens = gensName(c.nomen);
    const region = BIRTHPLACES.find((b) => b.key === c.birthplace);
    document.querySelector('.family-head .name').textContent = 'Gens ' + gens;
    document.querySelector('.family-head .rank').textContent = 'Plebeian House · ' + (region ? region.name : '—');

    // Senate composition from shared world state (fall back to the starting split).
    const { data: rome } = await romeStats();
    const pat = rome ? rome.senate_patricians : 195;
    const pleb = rome ? rome.senate_plebeians : 105;
    const total = pat + pleb;

    $('curia-title').textContent = 'The Curia — ' + total + ' Senators';
    $('curia-sub').textContent = 'The house is seated. The ' +
      (pat >= pleb ? 'Patricians' : 'Plebeians') + ' hold the majority.';
    $('leg-pat').textContent = pat;
    $('leg-pleb').textContent = pleb;
    $('hemicycle').setAttribute('aria-label',
      'Hemicycle of ' + total + ' senators, ' + pat + ' Patrician and ' + pleb + ' Plebeian');
    buildHemicycle(total, pat);
  })();

  // Log Out → shared signOut, then back to the front door. Guarded.
  const logoutBtn = $('logout');
  logoutBtn.addEventListener('click', async () => {
    if (logoutBtn.disabled) return;
    logoutBtn.disabled = true; logoutBtn.textContent = 'Departing…';
    try { await signOut(); } catch (err) { /* redirect regardless so no stuck session traps the player */ }
    window.location.href = '/';
  });
</script>
</body>
</html>
