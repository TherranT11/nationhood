<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actions | Nationhood Alpha</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/corp-topbar.css">
<link rel="stylesheet" href="css/corp-light-theme.css">
<link rel="stylesheet" href="css/party-actions.css">
<style>
:root {
  --bg-0: #0e0e0c;
  --bg-1: #1a1a1a;
  --bg-2: #1a1a17;
  --bg-3: #252525;
  --bg-4: #24241f;
  --bg-5: #2c2c26;
  --bg-hover: #282822;
  --text-bright: #f0efe6;
  --text-primary: #c4c2b8;
  --text-secondary: #888;
  --text-muted: #666;
  --text-dim: #4a4940;
  --text-ghost: #333229;
  --border-hair: rgba(255,255,255,0.04);
  --border-0: rgba(255,255,255,0.06);
  --border-1: rgba(255,255,255,0.08);
  --border-2: rgba(255,255,255,0.12);
  --green: #5cb85c;
  --green-faint: rgba(92,184,92,0.08);
  --green-border: rgba(92,184,92,0.18);
  --red: #d9534f;
  --red-faint: rgba(217,83,79,0.08);
  --red-border: rgba(217,83,79,0.18);
  --amber: #c8a64e;
  --amber-faint: rgba(200,166,78,0.08);
  --amber-border: rgba(200,166,78,0.18);
  --blue: #5b9bd5;
  --blue-faint: rgba(91,155,213,0.08);
  --blue-border: rgba(91,155,213,0.18);
  --teal: #5aafa5;
  --teal-faint: rgba(90,175,165,0.08);
  --teal-border: rgba(90,175,165,0.18);
  --gold: #c8a832;
  --gold-faint: rgba(200,168,50,0.08);
  --gold-border: rgba(200,168,50,0.20);
  --orange: #c88444;
  --orange-faint: rgba(200,132,68,0.08);
  --orange-border: rgba(200,132,68,0.18);
  --font-mono: 'JetBrains Mono', monospace;
  --font-ui: 'IBM Plex Sans', -apple-system, sans-serif;
  --font-serif: 'IBM Plex Serif', Georgia, serif;
  /* Panel palette — flips under body.light-mode. */
  --bg-card: #1a1a17;
  --bg-panel: #252525;
  --panel-main: #1f1f1a;
  --panel-border: rgba(255,255,255,0.08);
  --panel-text: #c4c2b8;
  --panel-muted: #888;
  --border-main: rgba(255,255,255,0.12);
}
body.light-mode {
  --bg-card: #ffffff;
  --bg-panel: #faf9f5;
  --panel-main: #f8f7f2;
  --panel-border: #e8e7e0;
  --panel-text: #e8e4dc;
  --panel-muted: #6a6660;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg-0);
  color: var(--text-primary);
  font-family: var(--font-ui);
  min-height: 100vh;
}

.loading-msg {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh;
  font-family: var(--font-mono); font-size: 11px; font-weight: 500;
  letter-spacing: 2px; color: var(--text-dim);
}

/* Mobile-responsive for exec-search + loan-request modals. */
@media (max-width: 820px) {
  #exec-search-overlay > div {
    width: 95vw !important;
    max-width: 95vw !important;
  }
  #exec-search-content > div:nth-child(2) {
    flex-direction: column !important;
  }
  #exec-search-content > div:nth-child(2) > div:first-child {
    width: 100% !important;
    max-height: 200px !important;
    border-right: none !important;
    border-bottom: 1px solid var(--panel-border) !important;
  }
  #lr-overlay > div {
    width: 95vw !important;
    max-width: 95vw !important;
  }
}
</style>
</head>
<body>
<script src="js/corp-theme-init.js"></script>
<div id="corp-topbar-container"></div>

<div id="loading" class="loading-msg">LOADING…</div>

<div id="page-content" style="display:none;padding:0;width:100%;">
  <div id="actions-container"></div>
</div>

<!-- Loan Request Modal -->
<div id="lr-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:500;align-items:center;justify-content:center;">
  <div style="width:520px;max-height:94vh;background:var(--panel-main);border:1px solid var(--panel-border);display:flex;flex-direction:column;overflow:hidden;">
    <div id="lr-modal-content" style="display:flex;flex-direction:column;overflow:hidden;max-height:94vh;"></div>
  </div>
</div>

<!-- Executive Search Modal -->
<div id="exec-search-overlay" onclick="closeExecSearch()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:500;align-items:center;justify-content:center;">
  <div onclick="event.stopPropagation()" style="width:850px;max-height:94vh;background:var(--panel-main);border:1px solid var(--panel-border);display:flex;flex-direction:column;overflow:hidden;">
    <div id="exec-search-content" style="display:flex;flex-direction:column;overflow:hidden;max-height:94vh;"></div>
  </div>
</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { escapeHtml, hfFmtBig } from './js/utils.js';
import { renderCorpTopBar } from './js/corp-topbar.js';
import { renderCorpActions } from './js/corp-actions.js';
import { EXEC_ROLES, EXEC_ROLE_META, createInitialExecutiveRoster, generateExecutivePool } from './js/game/corp-executives.js';
import { applyForEquity } from './js/equity-apply.js';
import { declareBankruptcy } from './js/corp-bankruptcy.js';

// ── Core corp-page state (mirrors corp-operations.html) ──
let allUserFactions = [];
let faction = null;
let nationStats = null;
let shard = null;

// Actions tab state (was module-top in corp-operations.html before
// Alpha 2.2.2.2 moved Actions to this standalone page).
let _executives = [];
let _execPool = [];
let _selectedExecIdx = 0;
let _execSearchRole = null;
let _execSearchSelected = -1;

// Owned properties — loaded at init so renderCorpActions can compute a
// correct valuation (cash + property + vessels − loans) for the stat pill.
let _ownedProperties = [];
async function loadOwnedProperties() {
    if (!faction?.id) return;
    const { data } = await _supabase
        .from('corp_properties')
        .select('*')
        .eq('faction_id', faction.id)
        .eq('is_active', true);
    _ownedProperties = data || [];
}

async function loadExecutives() {
    if (!faction) return;
    const [execRes, poolRes] = await Promise.all([
        _supabase.from('corp_executives').select('*').eq('faction_id', faction.id).eq('status', 'active'),
        _supabase.from('executive_pool').select('*').eq('nation_id', faction.nation_id).eq('status', 'available').order('skill', { ascending: false }),
    ]);
    if (execRes.error) console.warn('Failed to load executives:', execRes.error.message);
    if (poolRes.error) console.warn('Failed to load executive pool:', poolRes.error.message);
    _executives = execRes.data || [];
    _execPool = poolRes.data || [];
    const seedResult = await createInitialExecutiveRoster({
        supabase: _supabase,
        faction: faction,
        currentTick: shard?.current_tick || 0,
        poolCandidates: _execPool,
    });
    if (seedResult?.error) {
        console.warn('Failed to seed initial executive roster:', seedResult.error.message || seedResult.error);
    }
    if (seedResult?.executives) {
        _executives = seedResult.executives;
    }
}

// ═══════════════════════════════════════════════════
// ACTIONS TAB — RENDERING
// ═══════════════════════════════════════════════════

function actFmtSalary(n) {
    if (n >= 1e6) return '$' + (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return '$' + (n / 1e3).toFixed(0) + 'k';
    return '$' + n;
}

function getExecForRole(role) {
    return _executives.find(e => e.role === role) || null;
}

function getInitials(first, last) {
    return (first || '?')[0] + (last || '?')[0];
}

function skillColor(s) {
    if (s >= 70) return '#5cb85c';
    if (s >= 50) return '#ca5';
    return '#c84';
}

function renderActionsTab() {
    const container = document.getElementById('actions-container');
    if (!container) return;
    // Shared renderer in js/corp-actions.js builds the shell chrome
    // (stat pills + status bar) and the exec-card list. We still keep
    // per-page state (_selectedExecIdx) and call renderActionsRightPanel
    // after — it reads the page-local action handlers.
    // Construction corps have no vessels — shipping passes its fleet.
    renderCorpActions(container, {
        faction,
        shard,
        ownedProperties: _ownedProperties,
        vessels: [],
        executives: _executives,
        selectedExecIdx: _selectedExecIdx,
    });
    renderActionsRightPanel();
}

// ─── Action definitions per role ────────────────────────────────────────────

const EXEC_ACTIONS = {
    CEO: [
        { id: 'statement', name: 'Issue Statement', desc: 'Issue a press release to the public events feed. Other players and media corps see it. Cost scales with CEO skill.', cost: '~$20k', costColor: '#5cb85c', tags: ['REPUTATION'], cooldown: 'once/tick' },
        { id: 'ipo', name: 'IPO', desc: 'Take the corporation public. Sell ~30% of shares for a massive cash injection. Permanent loss of full control.', cost: 'COMING SOON', costColor: 'var(--text-dim)', tags: ['STRUCTURAL'], locked: true, lockReason: 'Coming soon' },
        { id: 'bankruptcy', name: 'Declare Bankruptcy', desc: 'The CEO officially files for bankruptcy, ceasing all operations. Outstanding loans will be repaid up to 50% of the corporation\'s market valuation.', descRed: 'This will dissolve your corporation. Loans will be paid back, and you will need to found a new corporation. There is a 24 tick cooldown on declaring bankruptcy.', cost: 'IRREVERSIBLE', costColor: '#c55', tags: ['IRREVERSIBLE'] },
    ],
    CFO: [
        { id: 'loan', name: 'Request Loan', desc: 'Submit a loan application to all finance corporations. Set amount, purpose, term, and collateral. Receive competing offers.', cost: 'FREE', costColor: '#5cb85c', tags: ['FINANCIAL'] },
        { id: 'equity', name: 'Apply for Equity', desc: 'Raise capital by offering Investment corps a stake in your monthly profits. Series (A/B/C…) is auto-assigned by your prior funded raise count. No repayment — investors get a percentage of profit each tick going forward.', cost: 'FREE', costColor: '#c89a4a', tags: ['FINANCIAL', 'STRUCTURAL'], hideForSector: 'Finance' },
    ],
    COO: [
        { id: 'restructure', name: 'Restructure Operations', desc: 'Lay off 10-20% of workforce, cut ~7% of debt. Reputation hit scales with COO skill — high skill minimizes damage.', cost: 'FREE', costColor: '#5cb85c', tags: ['OPERATIONAL'], cooldown: 'once/tick' },
    ],
    CTO: [
        { id: 'research', name: 'Begin Research', desc: 'Start researching a tech tree node. Opens the tech tree interface.', cost: 'COMING SOON', costColor: 'var(--text-dim)', tags: ['INNOVATION'], locked: true, lockReason: 'Coming soon' },
    ],
    CMO: [
        { id: 'rebrand', name: 'Rebrand Corporation', desc: 'Change name and abbreviation. Cost and reputation hit scale with CMO skill — high skill reduces both.', cost: '~$2M', costColor: '#ca5', tags: ['STRUCTURAL'], cooldown: 'once/tick' },
        { id: 'branding', name: 'Branding', desc: 'Upload a custom corporate logo. Replaces the default monogram on the dashboard, nation roster, and shipping vessels.', cost: '$1M', costColor: '#ca5', tags: ['IDENTITY'], cooldownTicks: 12 },
    ],
    CLO: [
        { id: 'sue_corp', name: 'Sue Corporation', desc: 'File a lawsuit against another corporation for patent infringement, contract breach, or predatory practices.', cost: 'COMING SOON', costColor: 'var(--text-dim)', tags: ['LEGAL'], locked: true, lockReason: 'Coming soon' },
    ],
    Lobbyist: [
        { id: 'donate', name: 'Political Donation', desc: 'Donate $1M to a political party in the nation where your National HQ is located. The target party receives $100k in party funds. You cannot donate to your own party.', cost: '$1M', costColor: '#ca5', tags: ['POLITICAL'], cooldown: 'once/tick' },
    ],
};

// ─── Skill modifier: >50 = cheaper/less damage, <50 = more expensive/more damage ──
// Returns a multiplier: skill 0 → 1.5, skill 50 → 1.0, skill 100 → 0.5
function skillCostMod(skill) {
    return 1.5 - (skill / 100);
}

// ─── Cooldown tracking: actions limited to once per tick ──
let _actionCooldowns = {}; // { actionId: lastTickUsed }

function isActionOnCooldown(actionId) {
    const currentTick = shard?.current_tick || 0;
    return _actionCooldowns[actionId] === currentTick;
}

function markActionUsed(actionId) {
    const currentTick = shard?.current_tick || 0;
    _actionCooldowns[actionId] = currentTick;
}

function renderActionsRightPanel() {
    const panel = document.getElementById('actions-right-panel');
    if (!panel) return;
    const role = EXEC_ROLES[_selectedExecIdx];
    const meta = EXEC_ROLE_META[role];
    const exec = getExecForRole(role);
    const actions = (EXEC_ACTIONS[role] || []).filter(a =>
        !a.hideForSector || (faction?.corp_sector || '') !== a.hideForSector
    );

    // ── Vacant state ──
    if (!exec) {
        panel.innerHTML = `<div style="padding:48px;text-align:center;background:var(--bg-2,#1a1a17);border:1px solid var(--border-0,rgba(255,255,255,0.06));">
            <div style="font-family:var(--font-mono);font-size:18px;font-weight:700;color:${meta.color};margin-bottom:6px;">${escapeHtml(role)}</div>
            <div style="font-family:var(--font-mono);font-size:13px;color:var(--text-dim);margin-bottom:14px;">${escapeHtml(meta.fullTitle)}</div>
            <div style="font-size:16px;color:var(--text-muted);margin-bottom:20px;">This position is vacant. Hire an executive to unlock actions.</div>
            <div onclick="openExecSearch('${role}')" style="display:inline-block;padding:8px 24px;font-family:var(--font-mono);font-size:13px;font-weight:700;letter-spacing:1px;color:#000;background:#5a8aaa;cursor:pointer;">EXECUTIVE SEARCH</div>
        </div>`;
        return;
    }

    let html = '';

    // ── Executive detail header ──
    html += `<div style="padding:14px 20px;background:var(--bg-2,#1a1a17);border:1px solid var(--border-0,rgba(255,255,255,0.06));border-bottom:none;display:flex;justify-content:space-between;align-items:center;">
        <div style="display:flex;align-items:center;gap:12px;">
            <div style="width:56px;height:56px;background:${meta.color}15;border:1px solid ${meta.color}33;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:18px;font-weight:700;color:${meta.color};">${escapeHtml(getInitials(exec.first_name, exec.last_name))}</div>
            <div>
                <div style="display:flex;align-items:baseline;gap:8px;">
                    <span style="font-family:var(--font-mono);font-size:22px;font-weight:700;color:${meta.color};">${escapeHtml(role)}</span>
                    <span style="font-size:19px;font-weight:700;color:var(--text-bright,#f0efe6);">${escapeHtml(exec.first_name)} ${escapeHtml(exec.last_name)}</span>
                </div>
                <div style="font-family:var(--font-mono);font-size:13px;color:var(--text-dim);margin-top:2px;">${escapeHtml(meta.fullTitle)}</div>
            </div>
        </div>
        <div style="display:flex;gap:16px;align-items:center;">
            <div style="text-align:right;">
                <div style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);letter-spacing:0.8px;">SKILL</div>
                <div style="display:flex;align-items:center;gap:5px;margin-top:2px;">
                    <div style="width:50px;height:4px;background:var(--border-0,rgba(255,255,255,0.06));">
                        <div style="width:${exec.skill}%;height:100%;background:${skillColor(exec.skill)};"></div>
                    </div>
                    <span style="font-family:var(--font-mono);font-size:16px;font-weight:700;color:${skillColor(exec.skill)};">${exec.skill}</span>
                </div>
            </div>
            <div style="text-align:right;">
                <div style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);letter-spacing:0.8px;">SALARY</div>
                <div style="font-family:var(--font-mono);font-size:16px;font-weight:700;color:var(--text-muted);margin-top:2px;">${actFmtSalary(exec.salary_per_year)}/yr</div>
            </div>
            <div style="text-align:right;">
                <div style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);letter-spacing:0.8px;">CONTRACT</div>
                <div style="font-family:var(--font-mono);font-size:16px;font-weight:700;color:var(--text-muted);margin-top:2px;">${exec.contract_years}yr</div>
            </div>
            ${role !== 'CEO' ? `<div style="text-align:right;">
                <span onclick="event.stopPropagation();confirmFireExec('${exec.id}','${escapeHtml(role)}','${escapeHtml(exec.first_name + ' ' + exec.last_name)}',${exec.salary_per_year},${exec.contract_end_tick || 0})" style="font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:0.5px;padding:5px 12px;color:#d9534f;border:1px solid rgba(217,83,79,0.25);background:rgba(217,83,79,0.06);cursor:pointer;">FIRE</span>
            </div>` : ''}
        </div>
    </div>`;

    // ── Actions list ──
    html += `<div style="background:var(--bg-2,#1a1a17);border:1px solid var(--border-0,rgba(255,255,255,0.06));border-top:1px solid var(--border-0,rgba(255,255,255,0.06));flex:1;">`;

    for (let ai = 0; ai < actions.length; ai++) {
        const action = actions[ai];
        const isLocked = !!action.locked;

        html += `<div onmouseenter="this.dataset.hover='1';this.style.background='${!isLocked ? meta.color + '06' : 'transparent'}'" onmouseleave="this.dataset.hover='';this.style.background='transparent';var eb=this.querySelector('.act-exec-btn');if(eb)eb.style.display='none'" style="
            padding:16px 20px;
            ${ai < actions.length - 1 ? 'border-bottom:1px solid var(--border-0,rgba(255,255,255,0.06));' : ''}
            opacity:${isLocked ? '0.4' : '1'};
            cursor:${isLocked ? 'not-allowed' : 'pointer'};
        ">`;

        // Row 1: Action name + tags + cost
        html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <div style="display:flex;align-items:center;gap:10px;">
                <span style="font-size:18px;font-weight:700;color:${isLocked ? 'var(--text-dim)' : 'var(--text-bright,#f0efe6)'};">${escapeHtml(action.name)}</span>`;

        for (const tag of action.tags) {
            const tagColor = tag === 'IRREVERSIBLE' ? '#c55' : tag === 'OFFENSIVE' ? '#c84' : tag === 'STRUCTURAL' ? '#ca5' : tag === 'POLITICAL' ? '#8a6aaa' : 'var(--text-dim)';
            html += `<span style="font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:0.3px;padding:2px 6px;line-height:14px;color:${tagColor};background:var(--bg-3,#252525);border:1px solid var(--border-0,rgba(255,255,255,0.06));">${escapeHtml(tag)}</span>`;
        }

        html += `</div>
            <div style="display:flex;align-items:center;gap:8px;">
                <span style="font-family:var(--font-mono);font-size:14px;font-weight:700;color:${action.costColor};">${escapeHtml(action.cost)}</span>
            </div>
        </div>`;

        // Row 2: Description
        html += `<div style="font-size:14px;color:${isLocked ? 'var(--text-dim)' : 'var(--text-muted,#666)'};line-height:1.6;">${escapeHtml(action.desc)}</div>`;

        // Red warning text (e.g. bankruptcy)
        if (action.descRed) {
            html += `<div style="font-size:13px;color:#c55;line-height:1.6;margin-top:4px;">${escapeHtml(action.descRed)}</div>`;
        }

        // Lock reason
        if (isLocked && action.lockReason) {
            html += `<div style="margin-top:6px;font-family:var(--font-mono);font-size:11px;color:#c84;display:flex;align-items:center;gap:4px;">
                <span>&#8856;</span><span>${escapeHtml(action.lockReason)}</span>
            </div>`;
        }

        // Execute button (shown on hover via JS)
        if (!isLocked) {
            html += `<div class="act-exec-btn" style="display:none;margin-top:10px;text-align:right;">
                <span onclick="event.stopPropagation();actExecute('${action.id}','${role}')" style="display:inline-block;padding:6px 24px;font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:1px;color:#000;background:${meta.color};cursor:pointer;">EXECUTE</span>
            </div>`;
        }

        html += '</div>';
    }

    html += '</div>'; // close actions list

    // ── Skill effect note ──
    html += `<div style="padding:8px 20px;background:var(--bg-3,#252525);border:1px solid var(--border-0,rgba(255,255,255,0.06));border-top:none;">
        <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);">
            <span style="color:${meta.color};font-weight:700;">${escapeHtml(role)}</span> skill (${exec.skill}/100) affects action outcomes.
            ${exec.skill >= 70
                ? ' High skill increases success probability and reduces costs.'
                : exec.skill >= 50
                    ? ' Moderate skill — outcomes are average. Consider recruiting a stronger executive.'
                    : ' Low skill — actions are less effective and more expensive. Replacement recommended.'
            }
        </div>
    </div>`;

    panel.innerHTML = html;

    // Wire hover show/hide for execute buttons
    panel.querySelectorAll('[onmouseenter]').forEach(el => {
        el.addEventListener('mouseenter', function() {
            const btn = this.querySelector('.act-exec-btn');
            if (btn) btn.style.display = 'block';
        });
        el.addEventListener('mouseleave', function() {
            const btn = this.querySelector('.act-exec-btn');
            if (btn) btn.style.display = 'none';
        });
    });
}

// ─── Fire Executive ────────────────────────────────────────────
function confirmFireExec(execId, role, name, salaryPerYear, contractEndTick) {
    const currentTick = shard?.current_tick || 0;
    const ticksRemaining = Math.max(0, contractEndTick - currentTick);
    const proratedPayout = Math.round(salaryPerYear * (ticksRemaining / 12));

    const msg = `FIRE ${role}: ${name}\n\n` +
        `Contract remaining: ${ticksRemaining} ticks\n` +
        `Payout (prorated): $${(proratedPayout / 1e6).toFixed(2)}M\n\n` +
        `This amount will be deducted from your cash reserves immediately.\n\n` +
        `Are you sure?`;

    if (!confirm(msg)) return;
    executeFireExec(execId, role, proratedPayout);
}

async function executeFireExec(execId, role, payout) {
    try {
        // Check cash
        const currentCash = Number(faction?.corp_cash_reserves ?? 0);
        if (currentCash < payout) {
            alert(`Insufficient funds. You need $${(payout / 1e6).toFixed(2)}M but only have $${(currentCash / 1e6).toFixed(2)}M.`);
            return;
        }

        // Deduct payout from corp cash
        const newCash = currentCash - payout;
        const { error: cashErr } = await _supabase
            .from('factions')
            .update({ corp_cash_reserves: newCash })
            .eq('id', faction.id);

        if (cashErr) {
            alert('Failed to process payout: ' + cashErr.message);
            return;
        }

        // Mark executive as fired
        const { error: fireErr } = await _supabase
            .from('corp_executives')
            .update({ status: 'fired', updated_at: new Date().toISOString() })
            .eq('id', execId);

        if (fireErr) {
            // Rollback cash
            await _supabase.from('factions').update({ corp_cash_reserves: currentCash }).eq('id', faction.id);
            alert('Failed to fire executive: ' + fireErr.message);
            return;
        }

        // Update local state
        faction.corp_cash_reserves = newCash;
        _executives = _executives.filter(e => e.id !== execId);

        // Re-render
        renderActionsTab();
    } catch (err) {
        console.error('[CorpOps] Fire executive error:', err);
        alert('An error occurred.');
    }
}

function actExecute(actionId, role) {
    // Check once-per-tick cooldown
    const actionDef = (EXEC_ACTIONS[role] || []).find(a => a.id === actionId);
    if (actionDef?.cooldown === 'once/tick' && isActionOnCooldown(actionId)) {
        alert('This action can only be used once per tick. Wait for the next tick.');
        return;
    }
    // Multi-tick persistent cooldowns (read from faction columns)
    if (actionDef?.cooldownTicks) {
        const remaining = brandingCooldownRemaining(actionId);
        if (remaining > 0) {
            alert(`On cooldown — ${remaining} tick${remaining === 1 ? '' : 's'} remaining.`);
            return;
        }
    }
    switch (actionId) {
        case 'statement': return actOpenStatement();
        case 'loan': return lrOpen();
        case 'equity': return applyForEquity(faction, shard, _supabase);
        case 'restructure': return actOpenRestructure();
        case 'rebrand': return actOpenRebrand();
        case 'branding': return actOpenBranding();
        case 'donate': return actOpenDonation();
        case 'bankruptcy': return declareBankruptcy();
        default: break;
    }
}

// Returns ticks-remaining for any persistent-column cooldown action, or
// 0 if the action is ready. Reads from the in-memory faction row, which
// the page refreshes after each action submit.
function brandingCooldownRemaining(actionId) {
    if (actionId !== 'branding') return 0;
    const def = (EXEC_ACTIONS.CMO || []).find(a => a.id === actionId);
    const max = def?.cooldownTicks || 0;
    const last = Number(faction?.last_branding_tick);
    if (!Number.isFinite(last) || last <= 0) return 0;
    const cur = Number(shard?.current_tick) || 0;
    const elapsed = cur - last;
    return elapsed >= max ? 0 : (max - elapsed);
}

let _stmtSubmitting = false;
async function actSubmitStatement() {
    if (!faction || !shard || _stmtSubmitting) return;
    const ta = document.getElementById('stmt-text');
    const errEl = document.getElementById('stmt-error');
    const text = (ta?.value || '').trim();

    if (!text) {
        if (errEl) { errEl.textContent = 'Statement cannot be empty.'; errEl.style.display = 'block'; }
        return;
    }
    if (text.length > 500) {
        if (errEl) { errEl.textContent = 'Statement too long (max 500 chars).'; errEl.style.display = 'block'; }
        return;
    }

    const ceo = getExecForRole('CEO');
    const ceoSkill = ceo ? ceo.skill : 50;
    const stmtCost = Math.round(20000 * skillCostMod(ceoSkill));
    const cash = Number(faction.corp_cash_reserves ?? 0);
    if (cash < stmtCost) {
        if (errEl) { errEl.textContent = 'Insufficient cash. Need ' + hfFmtBig(stmtCost) + '.'; errEl.style.display = 'block'; }
        return;
    }

    _stmtSubmitting = true;
    const btn = document.getElementById('stmt-submit-btn');
    if (btn) { btn.style.opacity = '0.4'; btn.style.pointerEvents = 'none'; }

    const corpName = faction.faction_name || 'Corporation';
    const ceoName = ceo ? `${ceo.first_name} ${ceo.last_name}` : 'CEO';
    const currentTick = shard.current_tick || 0;

    // Deduct cost (skill-scaled)
    const { error: cashErr } = await _supabase.from('factions').update({
        corp_cash_reserves: cash - stmtCost,
    }).eq('id', faction.id);

    if (cashErr) {
        _stmtSubmitting = false;
        if (errEl) { errEl.textContent = 'Failed to deduct cost: ' + cashErr.message; errEl.style.display = 'block'; }
        if (btn) { btn.style.opacity = '1'; btn.style.pointerEvents = 'auto'; }
        return;
    }

    // Insert event
    const { error: eventErr } = await _supabase.from('event_log').insert({
        nation_id: faction.nation_id,
        faction_id: faction.id,
        event_name: corpName + ' — Press Release',
        description_used: ceoName + ', CEO of ' + corpName + ': "' + text.replace(/[<>"]/g, '') + '"',
        category: 'business',
        trigger_key: 'ceo_statement',
        effects_applied: { cost: stmtCost, ceo: ceoName, skill: ceoSkill },
        fired_at_tick: currentTick,
    });

    if (eventErr) {
        // Refund on failure
        await _supabase.from('factions').update({ corp_cash_reserves: cash }).eq('id', faction.id);
        _stmtSubmitting = false;
        if (errEl) { errEl.textContent = 'Failed to publish: ' + eventErr.message; errEl.style.display = 'block'; }
        if (btn) { btn.style.opacity = '1'; btn.style.pointerEvents = 'auto'; }
        return;
    }

    // Update local state
    faction.corp_cash_reserves = cash - stmtCost;
    _stmtSubmitting = false;
    markActionUsed('statement');
    actCloseStatement();
}

let _lrSubmitting = false;
async function lrSubmit() {
    if (!faction || !shard || _lrSubmitting) return;
    const errEl = document.getElementById('lr-error');

    if (lrAmount < 1000000) { errEl.textContent = 'Minimum loan amount is $1M.'; errEl.style.display = 'block'; return; }
    if (lrAmount > 5000000000) { errEl.textContent = 'Maximum loan amount is $5B.'; errEl.style.display = 'block'; return; }

    const purposeLabel = (LR_PURPOSES.find(p => p.id === lrPurpose) || {}).label || lrPurpose;
    const fullPurpose = purposeLabel + (lrNote ? ' \u2014 ' + lrNote : '');

    const btn = document.getElementById('lr-submit-btn');
    _lrSubmitting = true;
    btn.style.opacity = '0.5';
    btn.style.pointerEvents = 'none';

    const currentTick = shard.current_tick || 0;
    const { error } = await _supabase.from('finance_loan_requests').insert({
        requesting_faction_id: faction.id,
        nation_id: faction.nation_id,
        amount: lrAmount,
        term_months: lrTerm,
        purpose: fullPurpose,
        created_tick: currentTick,
        expires_tick: currentTick + 5,
    });

    btn.style.opacity = '1';
    btn.style.pointerEvents = 'auto';

    if (error) {
        _lrSubmitting = false;
        errEl.textContent = 'Failed to submit: ' + error.message;
        errEl.style.display = 'block';
        btn.style.opacity = '1';
        btn.style.pointerEvents = 'auto';
        return;
    }

    _lrSubmitting = false;
    lrClose();
}

// COO: Restructure Operations
// ═══════════════════════════════════════════════════
// Lay off 10-20% of workforce, cuts ~7% of debt, reputation -1d10-3

function actOpenRestructure() {
    if (!faction) return;
    const debt = Number(faction.corp_loans ?? 0);
    const rep = Number(faction.corp_reputation ?? 50);
    const gen = Number(faction.corp_general_workforce ?? 0);
    const skl = Number(faction.corp_skilled_workforce ?? 0);
    const inn = Number(faction.corp_innovative_workforce ?? 0);
    const totalWf = gen + skl + inn;

    if (totalWf === 0) {
        alert('Cannot restructure — no employees to lay off.');
        return;
    }

    // Skill-scaled effects: high COO skill → less rep damage, more debt cut
    const coo = getExecForRole('COO');
    const cooSkill = coo ? coo.skill : 50;
    const cooMod = skillCostMod(cooSkill); // >50 = <1.0, <50 = >1.0

    // Calculate layoff range (10-20%)
    const layoffPct = 10 + Math.floor(Math.random() * 11); // 10-20
    const layoffCount = Math.round(totalWf * layoffPct / 100);
    const baseDebtCut = Math.round(debt * 0.07);
    const debtCut = Math.round(baseDebtCut * (2 - cooMod)); // high skill = MORE debt cut
    const baseRepLoss = 3 + Math.floor(Math.random() * 10); // 1d10 + 3
    const repLoss = Math.max(1, Math.round(baseRepLoss * cooMod)); // high skill = LESS rep loss

    // Distribute layoffs proportionally
    const genCut = Math.round(gen / totalWf * layoffCount);
    const sklCut = Math.round(skl / totalWf * layoffCount);
    const innCut = Math.max(0, Math.min(inn, layoffCount - genCut - sklCut));

    const overlay = document.createElement('div');
    overlay.id = 'restr-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:600;display:flex;align-items:center;justify-content:center;';
    overlay.onclick = function(e) { if (e.target === overlay) actCloseRestructure(); };

    overlay.innerHTML = `<div onclick="event.stopPropagation()" style="width:440px;background:var(--panel-main);border:1px solid var(--panel-border);display:flex;flex-direction:column;overflow:hidden;">
        <div style="padding:10px 16px;border-bottom:1px solid var(--panel-border);background:var(--bg-panel);">
            <div style="display:flex;justify-content:space-between;align-items:center;">
                <div style="display:flex;align-items:center;gap:8px;">
                    <span style="font-size:8px;color:#8b9a6b;">&#9679;</span>
                    <span style="font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:2px;color:#9e9a92;text-transform:uppercase;">Restructure Operations</span>
                </div>
                <span onclick="actCloseRestructure()" style="font-family:var(--font-mono);font-size:14px;color:#6a6660;cursor:pointer;">&#215;</span>
            </div>
        </div>
        <div style="padding:12px 16px;">
            <div style="font-family:var(--font-mono);font-size:8px;letter-spacing:1.5px;color:#6a6660;text-transform:uppercase;margin-bottom:8px;">Impact Preview</div>
            <div style="background:var(--bg-panel);border:1px solid var(--panel-border);padding:8px 12px;">
                <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--panel-border);">
                    <span style="font-family:var(--font-mono);font-size:8px;color:#6a6660;">WORKFORCE REDUCTION</span>
                    <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:#c55;">-${layoffCount} employees (${layoffPct}%)</span>
                </div>
                <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--panel-border);">
                    <span style="font-family:var(--font-mono);font-size:8px;color:#6a6660;">General: ${gen} &rarr; ${gen - genCut}</span>
                    <span style="font-family:var(--font-mono);font-size:8px;color:#c84;">-${genCut}</span>
                </div>
                <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--panel-border);">
                    <span style="font-family:var(--font-mono);font-size:8px;color:#6a6660;">Skilled: ${skl} &rarr; ${skl - sklCut}</span>
                    <span style="font-family:var(--font-mono);font-size:8px;color:#c84;">-${sklCut}</span>
                </div>
                <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--panel-border);">
                    <span style="font-family:var(--font-mono);font-size:8px;color:#6a6660;">Innovative: ${inn} &rarr; ${inn - innCut}</span>
                    <span style="font-family:var(--font-mono);font-size:8px;color:#c84;">-${innCut}</span>
                </div>
                <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--panel-border);">
                    <span style="font-family:var(--font-mono);font-size:8px;color:#6a6660;">DEBT REDUCTION (~7%)</span>
                    <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:#5cb85c;">-${hfFmtBig(debtCut)}</span>
                </div>
                <div style="display:flex;justify-content:space-between;padding:4px 0;">
                    <span style="font-family:var(--font-mono);font-size:8px;color:#6a6660;">REPUTATION HIT</span>
                    <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:#c55;">-${repLoss} (${rep} &rarr; ${Math.max(0, rep - repLoss)})</span>
                </div>
            </div>
            <div style="font-family:var(--font-mono);font-size:7px;color:#c84;margin-top:6px;">&#9888; This action cannot be undone. Laid-off workers must be re-hired.</div>
        </div>
        <div style="padding:8px 16px;border-top:1px solid var(--panel-border);display:flex;justify-content:flex-end;gap:6px;">
            <div onclick="actCloseRestructure()" style="padding:6px 16px;font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:1px;color:#6a6660;border:1px solid var(--panel-border);cursor:pointer;">CANCEL</div>
            <div id="restr-btn" onclick="actSubmitRestructure(${layoffPct},${debtCut},${repLoss},${genCut},${sklCut},${innCut})" style="padding:6px 20px;font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:1px;color:#000;background:#8b9a6b;cursor:pointer;">RESTRUCTURE</div>
        </div>
        <div id="restr-error" style="padding:4px 16px;font-family:var(--font-mono);font-size:8px;color:#c55;display:none;"></div>
    </div>`;

    document.body.appendChild(overlay);
}

function actCloseRestructure() {
    const o = document.getElementById('restr-overlay');
    if (o) o.remove();
}

let _restrSubmitting = false;
async function actSubmitRestructure(layoffPct, debtCut, repLoss, genCut, sklCut, innCut) {
    if (!faction || !shard || _restrSubmitting) return;
    _restrSubmitting = true;
    const btn = document.getElementById('restr-btn');
    if (btn) { btn.style.opacity = '0.4'; btn.style.pointerEvents = 'none'; }

    const gen = Number(faction.corp_general_workforce ?? 0);
    const skl = Number(faction.corp_skilled_workforce ?? 0);
    const inn = Number(faction.corp_innovative_workforce ?? 0);
    const debt = Number(faction.corp_loans ?? 0);
    const rep = Number(faction.corp_reputation ?? 50);

    const updates = {
        corp_general_workforce: Math.max(0, gen - genCut),
        corp_skilled_workforce: Math.max(0, skl - sklCut),
        corp_innovative_workforce: Math.max(0, inn - innCut),
        corp_loans: Math.max(0, debt - debtCut),
        corp_reputation: Math.max(0, rep - repLoss),
    };

    const { error } = await _supabase.from('factions').update(updates).eq('id', faction.id);
    if (error) {
        _restrSubmitting = false;
        const errEl = document.getElementById('restr-error');
        if (errEl) { errEl.textContent = 'Failed: ' + error.message; errEl.style.display = 'block'; }
        if (btn) { btn.style.opacity = '1'; btn.style.pointerEvents = 'auto'; }
        return;
    }

    // Update local state
    Object.assign(faction, updates);

    // Log event
    const currentTick = shard.current_tick || 0;
    const { error: restrLogErr } = await _supabase.from('event_log').insert({
        nation_id: faction.nation_id,
        faction_id: faction.id,
        event_name: (faction.faction_name || 'Corporation') + ' — Restructuring',
        description_used: (faction.faction_name || 'A corporation') + ' has announced a restructuring, laying off ' + layoffPct + '% of its workforce.',
        category: 'business',
        trigger_key: 'corp_restructure',
        effects_applied: { layoff_pct: layoffPct, debt_cut: debtCut, rep_loss: repLoss },
        fired_at_tick: currentTick,
    });
    if (restrLogErr) console.warn('Failed to log restructure event:', restrLogErr.message);

    _restrSubmitting = false;
    markActionUsed('restructure');
    actCloseRestructure();
    renderActionsTab();
}

    const rebrandCost = costOverride || 2000000;
    const rebrandRepLoss = repLossOverride || 5;
    const errEl = document.getElementById('rebrand-error');
    const newName = (document.getElementById('rebrand-name')?.value || '').trim().replace(/[<>"]/g, '');
    const newAbbr = (document.getElementById('rebrand-abbr')?.value || '').trim().toUpperCase().replace(/[<>"]/g, '');

    if (!newName || newName.length < 2) {
        if (errEl) { errEl.textContent = 'Name must be at least 2 characters.'; errEl.style.display = 'block'; }
        return;
    }
    if (!newAbbr || newAbbr.length < 2 || newAbbr.length > 5) {
        if (errEl) { errEl.textContent = 'Abbreviation must be 2-5 characters.'; errEl.style.display = 'block'; }
        return;
    }

    const cash = Number(faction.corp_cash_reserves ?? 0);
    if (cash < rebrandCost) {
        if (errEl) { errEl.textContent = 'Insufficient cash. Need ' + hfFmtBig(rebrandCost) + '.'; errEl.style.display = 'block'; }
        return;
    }

    _rebrandSubmitting = true;
    const btn = document.getElementById('rebrand-btn');
    if (btn) { btn.style.opacity = '0.4'; btn.style.pointerEvents = 'none'; }

    const rep = Number(faction.corp_reputation ?? 50);
    const oldName = faction.faction_name || 'Corporation';

    const { error } = await _supabase.from('factions').update({
        faction_name: newName,
        abbreviation: newAbbr,
        corp_ticker: newAbbr,
        corp_cash_reserves: cash - rebrandCost,
        corp_reputation: Math.max(0, rep - rebrandRepLoss),
    }).eq('id', faction.id);

    if (error) {
        _rebrandSubmitting = false;
        if (errEl) { errEl.textContent = 'Failed: ' + error.message; errEl.style.display = 'block'; }
        if (btn) { btn.style.opacity = '1'; btn.style.pointerEvents = 'auto'; }
        return;
    }

    // Update local state
    faction.faction_name = newName;
    faction.abbreviation = newAbbr;
    faction.corp_ticker = newAbbr;
    faction.corp_cash_reserves = cash - rebrandCost;
    faction.corp_reputation = Math.max(0, rep - rebrandRepLoss);

    // Log event
    const currentTick = shard.current_tick || 0;
    const { error: rebrandLogErr } = await _supabase.from('event_log').insert({
        nation_id: faction.nation_id,
        faction_id: faction.id,
        event_name: 'Corporation Rebranded',
        description_used: oldName + ' has rebranded to ' + newName + ' (' + newAbbr + '). The rebrand costs $20M and reputation takes a temporary hit.',
        category: 'corporate',
        trigger_key: 'corp_rebrand',
        effects_applied: { old_name: oldName, new_name: newName, new_abbr: newAbbr, rep_loss: rebrandRepLoss, cost: rebrandCost },
        fired_at_tick: currentTick,
    });
    if (rebrandLogErr) console.warn('Failed to log rebrand event:', rebrandLogErr.message);

    _rebrandSubmitting = false;
    markActionUsed('rebrand');
    actCloseRebrand();
    renderActionsTab();

    // Update top bar
    document.getElementById('corp-name-bar').textContent = newName;
    const logoEl = document.getElementById('corp-logo');
    if (logoEl) logoEl.textContent = newAbbr.slice(0, 2);
}

// ═══════════════════════════════════════════════════
// CMO: Branding ($1M → upload custom logo, 12-tick cooldown)
// ═══════════════════════════════════════════════════

const BRANDING_COST = 1000000;
const BRANDING_COOLDOWN_TICKS = 12;
let _brandingFile = null;
let _brandingSubmitting = false;

function actOpenBranding() {
    _brandingFile = null;

        : `<span style="font-family:var(--font-mono);font-size:18px;font-weight:700;color:#6a6660;">${escapeHtml((faction?.abbreviation || faction?.corp_ticker || '??').slice(0, 2))}</span>`;

    overlay.innerHTML = `<div onclick="event.stopPropagation()" style="width:460px;background:var(--panel-main);border:1px solid var(--panel-border);display:flex;flex-direction:column;overflow:hidden;">
        <div style="padding:10px 16px;border-bottom:1px solid var(--panel-border);background:var(--bg-panel);">

                <div style="display:flex;align-items:center;gap:8px;">
                    <span style="font-size:8px;color:#c84;">&#9679;</span>
                    <span style="font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:2px;color:#9e9a92;text-transform:uppercase;">Branding</span>
                </div>
                <span onclick="actCloseBranding()" style="font-family:var(--font-mono);font-size:14px;color:#6a6660;cursor:pointer;">&#215;</span>
            </div>
        </div>
        <div style="padding:14px 16px;display:flex;gap:14px;align-items:center;">
            <div id="branding-preview" style="width:84px;height:84px;background:var(--bg-panel);border:1px solid var(--panel-border);border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;">${previewSrc}</div>
            <div style="flex:1;">
                <div style="font-family:var(--font-mono);font-size:9px;color:#6a6660;letter-spacing:0.8px;margin-bottom:6px;">CORPORATE LOGO</div>
                <div style="font-size:11px;color:var(--text-muted);line-height:1.4;margin-bottom:8px;">PNG, JPG, or SVG. Max 128 KB. Square images render best — non-square will be cropped to fit.</div>
                <label for="branding-file" style="display:inline-block;padding:5px 14px;font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:1px;color:#c8a832;border:1px solid rgba(200,168,50,0.4);background:rgba(200,168,50,0.06);cursor:pointer;text-transform:uppercase;">Choose File</label>
                <input id="branding-file" type="file" accept="image/png,image/jpeg,image/svg+xml,image/webp" style="display:none;" onchange="actBrandingPickFile(event)" />
                <span id="branding-filename" style="font-family:var(--font-mono);font-size:9px;color:#6a6660;margin-left:8px;"></span>
            </div>
        </div>
        <div style="padding:8px 16px;border-top:1px solid var(--panel-border);">
            <div style="font-family:var(--font-mono);font-size:8px;letter-spacing:1.5px;color:#6a6660;text-transform:uppercase;margin-bottom:6px;">Impact</div>
            <div style="background:var(--bg-panel);border:1px solid var(--panel-border);padding:6px 10px;">
                <div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--panel-border);">
                    <span style="font-family:var(--font-mono);font-size:8px;color:#6a6660;">COST</span>
                    <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:#c84;">${hfFmtBig(BRANDING_COST)}</span>
                </div>
                <div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--panel-border);">
                    <span style="font-family:var(--font-mono);font-size:8px;color:#6a6660;">COOLDOWN</span>
                    <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--panel-text);">${BRANDING_COOLDOWN_TICKS} TICKS</span>
                </div>
                <div style="display:flex;justify-content:space-between;padding:3px 0;">
                    <span style="font-family:var(--font-mono);font-size:8px;color:#6a6660;">CASH AFTER</span>
                    <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:${cash < BRANDING_COST ? '#c55' : 'var(--panel-text)'};">${hfFmtBig(cash - BRANDING_COST)}</span>
                </div>
            </div>
        </div>
        <div style="padding:8px 16px;border-top:1px solid var(--panel-border);display:flex;justify-content:flex-end;gap:6px;">

            <div id="branding-btn" onclick="actSubmitBranding()" style="padding:6px 20px;font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:1px;color:#000;background:#c84;cursor:${cash >= BRANDING_COST ? 'pointer' : 'not-allowed'};${cash < BRANDING_COST ? 'opacity:0.4;pointer-events:none;' : ''}">UPLOAD &amp; CONFIRM</div>

function actCloseBranding() {
    const o = document.getElementById('branding-overlay');
    if (o) o.remove();
    _brandingFile = null;
}

function actBrandingPickFile(e) {
    const file = e.target.files?.[0];
    const errEl = document.getElementById('branding-error');
    const nameEl = document.getElementById('branding-filename');
    if (!file) { _brandingFile = null; if (nameEl) nameEl.textContent = ''; return; }
    if (file.size > 128 * 1024) {
        _brandingFile = null;
        if (nameEl) nameEl.textContent = '';
        if (errEl) { errEl.textContent = 'File too large — must be under 128 KB.'; errEl.style.display = 'block'; }
        return;
    }
    _brandingFile = file;
    if (errEl) errEl.style.display = 'none';
    if (nameEl) nameEl.textContent = file.name;

    // Live preview
    const preview = document.getElementById('branding-preview');
    if (preview) {
        const reader = new FileReader();
        reader.onload = ev => {
            preview.innerHTML = `<img src="${ev.target.result}" alt="" style="width:100%;height:100%;object-fit:cover;">`;
        };
        reader.readAsDataURL(file);
    }
}

async function actSubmitBranding() {
    if (!faction || !shard || _brandingSubmitting) return;
    const errEl = document.getElementById('branding-error');
    const btn = document.getElementById('branding-btn');

    if (!_brandingFile) {
        if (errEl) { errEl.textContent = 'Choose a logo file first.'; errEl.style.display = 'block'; }
        return;
    }

    const currentTick = Number(shard.current_tick) || 0;

    // Atomic cooldown + cash read
    const { data: fresh, error: freshErr } = await _supabase
        .from('factions')
        .select('corp_cash_reserves, last_branding_tick')
        .eq('id', faction.id)
        .single();
    if (freshErr || !fresh) {
        if (errEl) { errEl.textContent = 'Failed to verify cooldown: ' + (freshErr?.message || 'unknown'); errEl.style.display = 'block'; }
        return;
    }
    const prevTick = fresh.last_branding_tick == null ? null : Number(fresh.last_branding_tick);
    if (prevTick != null && currentTick - prevTick < BRANDING_COOLDOWN_TICKS) {
        const remaining = BRANDING_COOLDOWN_TICKS - (currentTick - prevTick);
        if (errEl) { errEl.textContent = `On cooldown — ${remaining} tick${remaining === 1 ? '' : 's'} remaining.`; errEl.style.display = 'block'; }
        return;
    }
    const cash = Number(fresh.corp_cash_reserves ?? 0);
    if (cash < BRANDING_COST) {
        if (errEl) { errEl.textContent = 'Insufficient cash. Need ' + hfFmtBig(BRANDING_COST) + '.'; errEl.style.display = 'block'; }
        return;
    }

    _brandingSubmitting = true;
    if (btn) { btn.style.opacity = '0.4'; btn.style.pointerEvents = 'none'; btn.textContent = 'UPLOADING...'; }

    // Upload to storage
    let logoUrl;
    try {
        const ext = (_brandingFile.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g, '') || 'png';
        const filePath = `party-logos/${faction.id}/${Date.now()}.${ext}`;
        const { error: uploadErr } = await _supabase.storage
            .from('public-assets')
            .upload(filePath, _brandingFile, { contentType: _brandingFile.type, upsert: true });
        if (uploadErr) throw uploadErr;
        const { data: urlData } = _supabase.storage.from('public-assets').getPublicUrl(filePath);
        logoUrl = urlData?.publicUrl || null;
        if (!logoUrl) throw new Error('Could not resolve public URL.');
    } catch (uploadErr) {
        _brandingSubmitting = false;
        if (errEl) { errEl.textContent = 'Upload failed: ' + (uploadErr.message || 'Unknown error'); errEl.style.display = 'block'; }
        if (btn) { btn.style.opacity = '1'; btn.style.pointerEvents = 'auto'; btn.textContent = 'UPLOAD & CONFIRM'; }
        return;
    }

    // Persist + cooldown stamp + cash deduct, with optimistic lock on
    // last_branding_tick so two concurrent submits can't both win.
    const updatePayload = {
        custom_logo_url: logoUrl,
        corp_cash_reserves: cash - BRANDING_COST,
        last_branding_tick: currentTick,
    };
    let updateQuery = _supabase.from('factions').update(updatePayload).eq('id', faction.id);
    updateQuery = prevTick == null
        ? updateQuery.is('last_branding_tick', null)
        : updateQuery.eq('last_branding_tick', prevTick);
    const { data: updated, error: updateErr } = await updateQuery.select('id');

    if (updateErr) {
        _brandingSubmitting = false;
        if (errEl) { errEl.textContent = 'Failed: ' + updateErr.message; errEl.style.display = 'block'; }
        if (btn) { btn.style.opacity = '1'; btn.style.pointerEvents = 'auto'; btn.textContent = 'UPLOAD & CONFIRM'; }
        return;
    }
    if (!updated || updated.length === 0) {
        _brandingSubmitting = false;
        if (errEl) { errEl.textContent = 'Branding is on cooldown. Refresh to see the latest state.'; errEl.style.display = 'block'; }
        if (btn) { btn.style.opacity = '1'; btn.style.pointerEvents = 'auto'; btn.textContent = 'UPLOAD & CONFIRM'; }
        return;
    }

    // Update local state
    faction.custom_logo_url = logoUrl;
    faction.corp_cash_reserves = cash - BRANDING_COST;
    faction.last_branding_tick = currentTick;

    // Log event
    const { error: logErr } = await _supabase.from('event_log').insert({
        nation_id: faction.nation_id,
        faction_id: faction.id,
        event_name: 'Corporation Rebranded (Logo)',
        description_used: `${faction.faction_name || 'Corporation'} unveiled a new corporate logo.`,
        category: 'corporate',
        trigger_key: 'corp_branding',
        effects_applied: { logo_url: logoUrl, cost: BRANDING_COST, cooldown_ticks: BRANDING_COOLDOWN_TICKS },
        fired_at_tick: currentTick,
    });
    if (logErr) console.warn('Failed to log branding event:', logErr.message);

    _brandingSubmitting = false;
    actCloseBranding();
    renderActionsTab();

    // Update top-bar logo if it's currently rendering the monogram
    const topLogo = document.getElementById('corp-logo');
    if (topLogo) topLogo.innerHTML = `<img src="${logoUrl}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:5px;">`;
}

window.actBrandingPickFile = actBrandingPickFile;
window.actSubmitBranding = actSubmitBranding;
window.actCloseBranding = actCloseBranding;

let _donateParties = [];
let _donateSelected = -1;

async function actOpenDonation() {
    const cash = Number(faction?.corp_cash_reserves ?? 0);

    // Only parties in the nation where the National HQ is located.
    // Subsidiaries / regional HQs in other nations do not unlock donations there.
    const nationIds = [faction.nation_id];

    // Get user's own faction IDs (to block self-donation)
    const ownFactionIds = new Set(allUserFactions.map(f => f.id));

    // Load all political parties in the corp's home nation
    const { data: parties } = await _supabase.from('factions')
        .select('id, faction_name, abbreviation, party_color, party_funds, seats, momentum, nation, nation_id, leader_ideology, linked_user_id')
        .eq('faction_type', 'party')
        .in('nation_id', nationIds)
        .is('abandoned_at', null)
        .order('seats', { ascending: false });

    // Filter out own parties and add nation name
    _donateParties = (parties || [])
        .filter(p => !ownFactionIds.has(p.id))
        .map(p => ({ ...p }));
    _donateSelected = -1;

    const overlay = document.createElement('div');
    overlay.id = 'donate-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:600;display:flex;align-items:center;justify-content:center;';
    overlay.onclick = function(e) { if (e.target === overlay) actCloseDonation(); };
    document.body.appendChild(overlay);

    renderDonationModal();
}

function actCloseDonation() {
    const o = document.getElementById('donate-overlay');
    if (o) o.remove();
    _donateParties = [];
    _donateSelected = -1;
}

let _donateSubmitting = false;
async function actSubmitDonation() {
    if (!faction || !shard || _donateSelected < 0 || _donateSubmitting) return;
    const party = _donateParties[_donateSelected];
    if (!party) return;
    const currentTick = Number(shard?.current_tick || 0);

    // Guard: cannot donate to own party (same linked_user_id)
    const ownFactionIds = new Set(allUserFactions.map(f => f.id));
    if (ownFactionIds.has(party.id)) {
        const errEl = document.getElementById('donate-error');
        if (errEl) { errEl.textContent = 'You cannot donate to your own party.'; errEl.style.display = 'block'; }
        return;
    }

    const lobbyist = getExecForRole('Lobbyist');
    const lobbySkill = lobbyist ? lobbyist.skill : 50;
    const donateCost = Math.round(1000000 * skillCostMod(lobbySkill));
    const partyReceives = 100000; // $100k to party coffers
    const repLoss = 2;

    // Read current faction state + cooldown atomically
    const { data: freshFaction, error: freshFactionErr } = await _supabase
        .from('factions')
        .select('corp_cash_reserves, last_donation_tick')
        .eq('id', faction.id)
        .single();
    if (freshFactionErr || !freshFaction) {
        const errEl = document.getElementById('donate-error');
        if (errEl) { errEl.textContent = 'Failed to verify cooldown: ' + (freshFactionErr?.message || 'unknown'); errEl.style.display = 'block'; }
        return;
    }

    const prevDonationTick = Number(freshFaction.last_donation_tick ?? 0);
    if (prevDonationTick === currentTick) {
        const errEl = document.getElementById('donate-error');
        if (errEl) { errEl.textContent = 'Political Donation is on cooldown until next tick.'; errEl.style.display = 'block'; }
        markActionUsed('donate');
        return;
    }

    const cash = Number(freshFaction.corp_cash_reserves ?? 0);
    if (cash < donateCost) {
        const errEl = document.getElementById('donate-error');
        if (errEl) { errEl.textContent = 'Insufficient cash. Need ' + hfFmtBig(donateCost) + ', have ' + hfFmtBig(cash) + '.'; errEl.style.display = 'block'; }
        return;
    }

    _donateSubmitting = true;
    const btn = document.getElementById('donate-btn');
    if (btn) { btn.style.opacity = '0.4'; btn.style.pointerEvents = 'none'; }

    // Deduct cash + stamp cooldown atomically. Optimistic lock on last_donation_tick:
    // if another request already updated it this tick, this UPDATE matches 0 rows.
    const currentRep = Number(faction.corp_reputation ?? 50);
    const nextRep = Math.max(0, currentRep - repLoss);
    const { data: updated, error: cashErr } = await _supabase.from('factions').update({
        corp_cash_reserves: cash - donateCost,
        corp_reputation: nextRep,
        last_donation_tick: currentTick,
    }).eq('id', faction.id)
      .eq('last_donation_tick', prevDonationTick)
      .select('id');

    if (cashErr) {
        const errEl = document.getElementById('donate-error');
        _donateSubmitting = false;
        if (errEl) { errEl.textContent = 'Failed: ' + cashErr.message; errEl.style.display = 'block'; }
        if (btn) { btn.style.opacity = '1'; btn.style.pointerEvents = 'auto'; }
        return;
    }
    if (!updated || updated.length === 0) {
        // Another request already claimed this tick — race lost, no cash deducted
        const errEl = document.getElementById('donate-error');
        _donateSubmitting = false;
        if (errEl) { errEl.textContent = 'Political Donation is on cooldown until next tick.'; errEl.style.display = 'block'; }
        if (btn) { btn.style.opacity = '1'; btn.style.pointerEvents = 'auto'; }
        markActionUsed('donate');
        return;
    }

    // Grant $100k to target party's party_funds
    const { data: freshParty } = await _supabase.from('factions').select('party_funds').eq('id', party.id).single();
    const currentFunds = Number(freshParty?.party_funds ?? 0);
    const { error: fundsErr } = await _supabase.from('factions').update({
        party_funds: currentFunds + partyReceives,
    }).eq('id', party.id);

    if (fundsErr) {
        // Refund on failure
        await _supabase.from('factions').update({ corp_cash_reserves: cash }).eq('id', faction.id);
        const errEl = document.getElementById('donate-error');
        _donateSubmitting = false;
        if (errEl) { errEl.textContent = 'Failed to transfer funds: ' + fundsErr.message; errEl.style.display = 'block'; }
        if (btn) { btn.style.opacity = '1'; btn.style.pointerEvents = 'auto'; }
        return;
    }

    // Update local state
    faction.corp_cash_reserves = cash - donateCost;
    faction.corp_reputation = nextRep;

    // Log event
    const corpName = faction.faction_name || 'Corporation';
    const { error: donateLogErr } = await _supabase.from('event_log').insert({
        nation_id: party.nation_id || faction.nation_id,
        faction_id: faction.id,
        event_name: corpName + ' — Political Donation',
        description_chosen: corpName + ' has donated ' + hfFmtBig(donateCost) + ' to ' + (party.faction_name || 'a political party') + '. The party receives ' + hfFmtBig(partyReceives) + ' in campaign funds. Corporate reputation decreases by ' + repLoss + '.',
        category: 'business',
        trigger_key: 'corp_donation',
        effects_applied: { cost: donateCost, recipient_faction_id: party.id, recipient_name: party.faction_name, funds_granted: partyReceives, reputation_loss: repLoss, skill: lobbySkill },
        fired_at_tick: currentTick,
    });
    if (donateLogErr) console.warn('Failed to log donation event:', donateLogErr.message);

    _donateSubmitting = false;
    markActionUsed('donate');
    actCloseDonation();
}

function actSelectExec(idx) {
    _selectedExecIdx = idx;

async function openExecSearch(role) {
    _execSearchRole = role;
    _execSearchSelected = -1;
    document.getElementById('exec-search-overlay').style.display = 'flex';

    // Auto-generate executive pool when no available executives remain.
    // _execPool was loaded with status='available' filter at line 173, so an
    // empty array means the pool is depleted — even if old hired/expired rows
    // still sit in the table. Previous gate also checked status-agnostic
    // existence which silently blocked regen after the first 18 were hired.
    if (_execPool.length === 0 && faction?.nation_id) {
        const nationName = faction.nation || '';
        const poolRows = generateExecutivePool(faction.nation_id, nationName);
        const { error: poolErr } = await _supabase.from('executive_pool').insert(poolRows);
        if (poolErr) console.warn('Failed to generate executive pool:', poolErr.message);

        const { data: freshPool, error: reloadErr } = await _supabase.from('executive_pool')
            .select('*').eq('nation_id', faction.nation_id).eq('status', 'available')
            .order('skill', { ascending: false });
        if (reloadErr) console.warn('Failed to reload executive pool:', reloadErr.message);
        _execPool = freshPool || [];
    }

    renderExecSearchModal();
}

function closeExecSearch() {
    document.getElementById('exec-search-overlay').style.display = 'none';
    _execSearchRole = null;
    _execSearchSelected = -1;
}

function getPoolCandidatesForRole(role) {
    return _execPool.filter(c =>
        c.status === 'available' &&
        Array.isArray(c.specializations) &&
        c.specializations.includes(role)
    ).sort((a, b) => b.skill - a.skill);
}

function esSelectCandidate(idx) {
    _execSearchSelected = idx;
    renderExecSearchModal();
}

let _esHiring = false;
async function esHireCandidate() {
    if (!faction || !shard || !_execSearchRole || _execSearchSelected < 0 || _esHiring) return;
    const candidates = getPoolCandidatesForRole(_execSearchRole);
    const cand = candidates[_execSearchSelected];
    if (!cand) return;

    _esHiring = true;
    const currentTick = shard.current_tick || 0;

    // Disable button
    const btn = document.getElementById('es-hire-btn');
    if (btn) { btn.style.opacity = '0.4'; btn.style.pointerEvents = 'none'; }

    // Insert into corp_executives
    const { error: insertErr } = await _supabase.from('corp_executives').insert({
        faction_id: faction.id,
        role: _execSearchRole,
        first_name: cand.first_name,
        last_name: cand.last_name,
        age: cand.age,
        origin_nation: cand.origin_nation,
        skill: cand.skill,
        salary_per_year: cand.required_salary,
        contract_years: cand.required_years,
        contract_start_tick: currentTick,
        contract_end_tick: currentTick + (cand.required_years * 12),
        status: 'active',
    });

    if (insertErr) {
        _esHiring = false;
        const errEl = document.getElementById('es-error');
        if (errEl) { errEl.textContent = 'Failed: ' + insertErr.message; errEl.style.display = 'block'; }
        if (btn) { btn.style.opacity = '1'; btn.style.pointerEvents = 'auto'; }
        return;
    }

    // Mark pool candidate as hired
    const { error: poolUpdErr } = await _supabase.from('executive_pool').update({
        status: 'hired',
        hired_by_faction_id: faction.id,
    }).eq('id', cand.id);
    if (poolUpdErr) console.warn('Failed to mark pool candidate as hired:', poolUpdErr.message);

    // Refresh data + close modal + re-render
    _esHiring = false;
    closeExecSearch();
    await loadExecutives();
    // Select the newly hired role
    _selectedExecIdx = EXEC_ROLES.indexOf(_execSearchRole);
    if (_selectedExecIdx < 0) _selectedExecIdx = 0;
    renderActionsTab();
}

// (Issue Statement, Restructure, Rebrand, Donation, Declare Bankruptcy,
// Request Loan, Apply for Equity, and the exec-card + hire/fire/search
// flow) are all cross-sector. Sector-specific gating happens inside
// the shared renderCorpActions(ctx) + renderActionsRightPanel().
async function init() {
    const { data: { user } } = await _supabase.auth.getUser();
    if (!user) { window.location.href = 'login.html'; return; }

    // Inspector mode: admin panel impersonation via ?faction_id=
    const urlFactionId = new URLSearchParams(location.search).get('faction_id');
    if (urlFactionId) {
        const { data: inspected, error: inspectErr } = await _supabase
            .from('factions').select('*').eq('id', urlFactionId).single();
        if (inspectErr) console.warn('[Inspector] faction fetch failed:', inspectErr.message);
        else if (inspected?.faction_type === 'corporation') faction = inspected;
    }

    if (!faction) {
        const { data: allFactions } = await _supabase.from('factions')
            .select('*').or(`id.eq.${user.id},linked_user_id.eq.${user.id}`);
        allUserFactions = (allFactions || []).filter(f => f.nation_id);

        const activeFactionId = sessionStorage.getItem('active_faction_id');
        faction = allUserFactions.find(f => f.id === activeFactionId)
            || allUserFactions.find(f => f.faction_type === 'corporation')
            || allUserFactions[0];

        if (!faction) { await _supabase.auth.signOut(); window.location.href = 'login.html'; return; }
        if (faction.faction_type !== 'corporation') { window.location.href = 'dashboard.html'; return; }
    }

    const [nationRes, shardRes] = await Promise.all([
        faction.nation_id
            ? _supabase.from('nations').select('*').eq('id', faction.nation_id).single()
            : Promise.resolve({ data: null }),
        _supabase.from('shard').select('current_tick, current_date, next_tick_at, tick_interval_hours').eq('name', 'Alpha Shard').single(),
    ]);
    if (nationRes.data) nationStats = nationRes.data;
    shard = shardRes.data;

    // Render topbar with ACTIONS marked active.
    const topBarContainer = document.getElementById('corp-topbar-container');
    if (topBarContainer) {
        renderCorpTopBar(topBarContainer, { faction, shard, activeTab: 'actions', allUserFactions });
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('page-content').style.display = 'block';

    // Load the data the Actions renderer needs, then render.
    await Promise.all([loadOwnedProperties(), loadExecutives()]);
    renderActionsTab();
}

// Expose onclick handlers to global scope. <script type="module"> scopes
// declarations to the module, but inline `onclick="foo()"` attributes
// resolve against window. Every function referenced by onclick / oninput
// in rendered card HTML needs a window binding. actOpen* / lrOpen /
// applyForEquity are not here because they're only called from
// actExecute's internal dispatch (module scope reaches them fine).
window.actExecute = actExecute;
window.actSelectExec = actSelectExec;
window.confirmFireExec = confirmFireExec;
window.actCloseStatement = actCloseStatement;
window.actSubmitStatement = actSubmitStatement;
window.actCloseRestructure = actCloseRestructure;
window.actSubmitRestructure = actSubmitRestructure;
window.actCloseRebrand = actCloseRebrand;
window.actSubmitRebrand = actSubmitRebrand;
window.actCloseDonation = actCloseDonation;
window.actSubmitDonation = actSubmitDonation;
window.donateSelectParty = donateSelectParty;
window.lrClose = lrClose;
window.lrSetAmount = lrSetAmount;
window.lrSetPurpose = lrSetPurpose;
window.lrSetTerm = lrSetTerm;
window.lrSetCollateral = lrSetCollateral;
window.lrSubmit = lrSubmit;
window.openExecSearch = openExecSearch;
window.closeExecSearch = closeExecSearch;
window.esSelectCandidate = esSelectCandidate;
window.esHireCandidate = esHireCandidate;

init();
</script>
