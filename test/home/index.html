<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home · Nationhood Game</title>
<style>
  :root { --ink:#0a0a0a; --line:#ececec; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #fff; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    height: 64px; padding: 0 24px; border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 700; font-size: 19px; letter-spacing: -0.02em; }
  .btn {
    font-size: 14px; font-weight: 600; padding: 9px 16px; border-radius: 999px;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    cursor: pointer; transition: border-color .15s ease, opacity .15s ease;
  }
  .btn:hover { border-color: #cfcfcf; }
  .btn[disabled] { opacity: .55; cursor: default; }
</style>
</head>
<body>
  <header>
    <div class="brand">Nationhood</div>
    <button class="btn" id="logout-btn" type="button">Logout</button>
  </header>
  <main></main>

  <script type="module">
    import { supabase, isConfigured } from '/test/supabase.js';

    const logoutBtn = document.getElementById('logout-btn');

    // Guard: only signed-in players can see this page.
    (async () => {
      if (!isConfigured) return; // nothing to verify until keys are set
      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) window.location.href = '/test/signup/';
      } catch (err) {
        window.location.href = '/test/signup/';
      }
    })();

    let loggingOut = false; // loading lock: blocks double-fire
    logoutBtn.addEventListener('click', async () => {
      if (loggingOut) return;
      loggingOut = true;
      logoutBtn.disabled = true;
      try {
        await supabase.auth.signOut();
      } catch (err) {
        // Sign out is best-effort; send them to the landing page regardless.
      }
      window.location.href = '/test/';
    });
  </script>
</body>
</html>
