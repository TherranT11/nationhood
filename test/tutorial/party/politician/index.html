<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Politician · Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAF8;--surface:#FFFFFF;--ink:#15151B;--muted:#5b5b63;--soft:#8d8d95;
    --line:#E7E5E0;--chip:#F4F3EF;
    --indigo:#5546E8;--indigo-soft:#ECE9FD;
    --red:#C42B2B;--red-soft:#FBEAE9;--amber:#E0820E;--amber-soft:#FBF0DD;--green:#16915a;--green-soft:#E5F4EC;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100%}
  .app{display:flex;min-height:100vh}

  /* sidebar (shared layout with the other in-game screens) */
  .side{width:236px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
  .brand__flag{width:42px;height:26px;object-fit:cover;border:1px solid var(--line);border-radius:4px;flex:none}
  .brand__txt{display:flex;flex-direction:column;line-height:1.25;overflow:hidden}
  .brand__txt b{font-weight:800;font-size:14px;letter-spacing:-.01em;white-space:nowrap}
  .brand__txt span{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);white-space:nowrap}
  .brand__txt .party{font-weight:700}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav__i{display:flex;align-items:center;gap:13px;padding:10px 12px;border-radius:9px;color:var(--muted);text-decoration:none;cursor:pointer;border:1px solid transparent;transition:background .15s,color .15s}
  .nav__i svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .nav__i .label{font-family:'Space Mono',monospace;font-size:12.5px;letter-spacing:.04em}
  .nav__i:hover{color:var(--ink);background:var(--chip)}
  .nav__i.active{color:var(--indigo);background:var(--indigo-soft);font-weight:700}
  .nav__i.active svg{color:var(--indigo)}
  .side__foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}
  .me{display:flex;align-items:center;gap:10px;padding:8px 10px;color:var(--muted);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em}
  .me__dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none}
  .me b{color:var(--ink);font-weight:700}
  .logout{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;background:none;border:none;cursor:pointer;color:var(--soft);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em;text-align:left;transition:color .15s}
  .logout:hover{color:var(--red)}
  .logout svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* main */
  .main{flex:1;padding:20px clamp(16px,3vw,40px) 56px;min-width:0;max-width:960px}
  .back{display:inline-flex;align-items:center;gap:7px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;margin-bottom:16px}
  .back:hover{color:var(--indigo)}
  .back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .kicker{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--indigo)}

  .mod{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px}
  .mod__hd{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin-bottom:16px}
  .empty{color:var(--soft);font-style:italic;font-size:13.5px}

  /* hero */
  .hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .hero__pic{width:62px;height:62px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;background:var(--indigo-soft);color:var(--indigo);font-family:'Space Mono',monospace}
  .hero__id{flex:1;min-width:220px}
  .hero__id .kicker{margin-bottom:4px}
  .hero__id h1{font-weight:900;font-size:clamp(26px,4.5vw,38px);letter-spacing:-.03em;line-height:1.02}
  .hero__id .role{font-family:'Space Mono',monospace;font-size:11.5px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin-top:6px}
  .htags{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  .tag{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:5px 11px;border-radius:20px;display:inline-flex;align-items:center;gap:6px}
  .tag.party{color:var(--indigo);background:var(--indigo-soft)}
  .tag.busy{color:var(--amber);background:var(--amber-soft)}
  .tag.free{color:var(--green);background:var(--green-soft)}
  .tag.scandal{color:var(--red);background:var(--red-soft)}

  /* stats band */
  .sgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-top:16px}
  @media(max-width:680px){.sgrid{grid-template-columns:repeat(3,1fr)}}
  .stile{border:1px solid var(--line);border-radius:12px;padding:13px 8px 14px;text-align:center;background:var(--bg)}
  .stile .l{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
  .stile .v{font-weight:900;font-size:28px;letter-spacing:-.03em;display:block;margin:4px 0 0}
  .stile .v small{font-size:.45em;color:var(--soft);font-weight:700;letter-spacing:0}
  .stile.max{border-color:var(--indigo);background:var(--indigo-soft)}
  .stile.max .v{color:var(--indigo)}
  .stile.age .v{color:var(--ink)}

  /* current task */
  .task{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .task__v{font-weight:800;font-size:18px;letter-spacing:-.01em;color:var(--soft)}
  .task__v.set{color:var(--ink)}
  .task__btn{font-family:'Space Mono',monospace;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--indigo);color:#fff;border:none;border-radius:10px;padding:11px 18px;cursor:pointer;transition:transform .12s,filter .15s}
  .task__btn:hover{transform:translateY(-1px);filter:brightness(1.07)}

  /* actions */
  .acts{display:flex;gap:12px;flex-wrap:wrap}
  .act{flex:1;min-width:200px;text-align:left;border-radius:12px;padding:15px 16px;cursor:pointer;border:1.5px solid;transition:transform .12s,box-shadow .2s,filter .15s;background:var(--surface)}
  .act:hover{transform:translateY(-1px)}
  .act__t{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px}
  .act__t svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .act__d{font-size:12.5px;margin-top:7px;line-height:1.45;color:var(--muted)}
  .act.dismiss{border-color:color-mix(in srgb,var(--red) 45%,transparent);color:var(--red)}
  .act.dismiss:hover{background:var(--red-soft)}
  .act.dismiss .act__d{color:#9a5050}
  .act.promote{border-color:var(--indigo);background:var(--indigo);color:#fff}
  .act.promote .act__d{color:rgba(255,255,255,.85)}
  .act.promote:hover{filter:brightness(1.06)}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.02em;padding:14px 18px;border-radius:11px;box-shadow:0 18px 44px -18px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:all .35s;z-index:80;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast b{color:#a99dff}

  @media(max-width:820px){.side{width:62px;padding:16px 8px}.nav__i .label,.brand__txt,.me .label,.logout .label{display:none}.logout{justify-content:center}.brand{justify-content:center;padding:6px 0 14px}.brand__flag{width:38px;height:24px}.nav__i{justify-content:center;padding:11px 0}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><img class="brand__flag" id="flag" src="/test/assets/Sessau.png" alt="Flag of the Front Sessau"><div class="brand__txt"><b>Front Sessau</b><span style="visibility:hidden"><span class="party" id="party"></span> · Sessau</span></div></div>
    <nav class="nav">
      <a class="nav__i" href="/test/tutorial/home/"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v9h14v-9"/></svg><span class="label">Home</span></a>
      <a class="nav__i active" href="/test/tutorial/party/"><svg viewBox="0 0 24 24"><path d="M5 3v18"/><path d="M5 4h12l-2 4 2 4H5"/></svg><span class="label">Party</span></a>
      <a class="nav__i" href="/test/tutorial/government/"><svg viewBox="0 0 24 24"><path d="M3 9l9-5 9 5"/><path d="M3 9h18M4 20h16"/><path d="M6 20v-9M10 20v-9M14 20v-9M18 20v-9"/></svg><span class="label">Government</span></a>
      <a class="nav__i" href="/test/tutorial/legislature/"><svg viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M5 21V10M9 21V10M15 21V10M19 21V10"/><path d="M12 3l9 5H3z"/></svg><span class="label">Legislature</span></a>
      <a class="nav__i"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4-3 7-7 8-4-1-7-4-7-8V6l7-3z"/></svg><span class="label">Nation</span></a>
      <a class="nav__i"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span class="label">World</span></a>
      <a class="nav__i"><svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M6 20v-6M10 20v-10M14 20v-7M18 20v-12"/></svg><span class="label">Market</span></a>
      <a class="nav__i"><svg viewBox="0 0 24 24"><path d="M17 4l3 3-9 9-3-3z"/><path d="M7 4L4 7l9 9 3-3"/><path d="M5 16l-1 4 4-1M19 16l1 4-4-1"/></svg><span class="label">Conflict</span></a>
      <a class="nav__i"><svg viewBox="0 0 24 24"><path d="M4 5h12v8H8l-4 3z"/><path d="M18 9h2v9l-3-2h-5"/></svg><span class="label">Forum</span></a>
      <a class="nav__i"><svg viewBox="0 0 24 24"><path d="M12 5v15"/><path d="M4 4h6a2 2 0 012 2 2 2 0 012-2h6v13h-6a2 2 0 00-2 2 2 2 0 00-2-2H4z"/></svg><span class="label">Wiki</span></a>
    </nav>
    <div class="side__foot"><div class="me"><span class="me__dot"></span><span class="label">Leader · <b>You</b></span></div><button class="logout" id="logout" type="button"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span class="label">Logout</span></button></div>
  </aside>

  <main class="main">
    <span class="back" id="back"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Your Party</span>
    <div id="content"><section class="mod"><p class="empty">Loading…</p></section></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initSidebar, logout, mountTopbar, POLITICIANS } from '/test/tutorial/shell.js';

  var SL=['Charisma','Acumen','Guile','Resolve','Command'];
  var toast=document.getElementById('toast'),tt;
  function ping(h){toast.innerHTML=h;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove('show')},3800);}
  function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  function initials(name){var p=name.trim().split(/\s+/);return ((p[0]||'')[0]+((p[1]||'')[0]||'')).toUpperCase();}

  // Which politician? ?p=<id> for the base roster, ?p=r<index> for a recruit.
  var param=new URLSearchParams(location.search).get('p')||'';
  var rendered=false;

  function render(p){
    if(!p||rendered) return;
    rendered=true;
    document.title=p.name+' · Nationhood';
    var mx=Math.max.apply(null,p.stats);
    var tags='<span class="tag party">Front Sessau</span>';
    if(p.scandal) tags+='<span class="tag scandal">⚑ Scandal</span>';
    if(p.busy) tags+='<span class="tag busy">Occupied · '+esc(p.busy)+'</span>';
    else if(p.free) tags+='<span class="tag free">Available</span>';
    var statTiles='<div class="stile age"><span class="l">Age</span><span class="v">'+p.age+'<small> yrs</small></span></div>'+
      '<div class="stile age"><span class="l">Exp</span><span class="v">'+p.exp+'</span></div>'+
      p.stats.map(function(v,i){return '<div class="stile'+(v===mx?' max':'')+'"><span class="l">'+SL[i]+'</span><span class="v">'+v+'</span></div>';}).join('');
    var taskVal=p.busy?('Occupied · '+esc(p.busy)):'None Assigned';
    document.getElementById('content').innerHTML=
      '<section class="mod"><div class="hero">'+
        '<span class="hero__pic">'+initials(p.name)+'</span>'+
        '<div class="hero__id"><div class="kicker">Prominent Politician</div><h1>'+esc(p.name)+'</h1>'+
          '<div class="role">'+esc(p.role||'Party Member')+' · Front Sessau</div>'+
          '<div class="htags">'+tags+'</div></div>'+
      '</div><div class="sgrid">'+statTiles+'</div></section>'+
      '<section class="mod"><div class="mod__hd">Current Task</div><div class="task">'+
        '<span class="task__v'+(p.busy?' set':'')+'">'+taskVal+'</span>'+
        '<button class="task__btn" id="assignBtn" type="button">Assign</button></div></section>'+
      '<section class="mod"><div class="mod__hd">Actions</div><div class="acts">'+
        '<button class="act dismiss" data-t="Dismiss '+esc(p.name)+' — remove them from the cabinet and the party."><div class="act__t"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>Dismiss</div><div class="act__d">Remove them from the cabinet and the party. May recover Party Approval — or not.</div></button>'+
        '<button class="act promote" data-t="Promote '+esc(p.name)+' — elevate them to a higher office or party rank."><div class="act__t"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>Promote</div><div class="act__d">Elevate them to a higher office or party rank.</div></button>'+
      '</div></section>';
    document.querySelectorAll('.act').forEach(function(b){b.addEventListener('click',function(){ping(b.dataset.t.replace(/^(\w+)/,'<b>$1</b>'));});});
    var ab=document.getElementById('assignBtn'); if(ab) ab.addEventListener('click',function(){ping('<b>Assign</b>: task assignment opens here. (Not available in the tutorial.)');});
  }

  function notFound(){
    if(rendered) return; rendered=true;
    document.getElementById('content').innerHTML='<section class="mod"><div class="mod__hd">Politician</div><p class="empty">No such politician.</p></section>';
  }

  // Base politician: render immediately. Recruit (r<index>): render once the saved
  // recruit list arrives from initSidebar.
  var base=POLITICIANS.filter(function(p){return p.id===param;})[0];
  var ri=/^r(\d+)$/.exec(param);
  if(base){ render(base); }
  else if(ri){
    window.addEventListener('nationhood:recruits',function(e){
      var list=Array.isArray(e.detail)?e.detail:[];
      var r=list[+ri[1]];
      if(r) render(r); else notFound();
    });
  } else { notFound(); }

  document.getElementById('back').addEventListener('click',function(){window.location.href='/test/tutorial/party/';});
  document.querySelectorAll('.nav__i').forEach(function(i){i.addEventListener('click',function(e){
    if(!i.getAttribute('href')){e.preventDefault();document.querySelectorAll('.nav__i').forEach(function(x){x.classList.remove('active')});i.classList.add('active');}
  });});

  mountTopbar();
  var lo=document.getElementById('logout'); if(lo){lo.addEventListener('click',logout);}
  initSidebar();
</script>
</body>
</html>
