<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Front de Sessau · Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAF8;--ink:#111114;--muted:#55555d;--soft:#8d8d95;
    --line:#E4E2DD;--accent:#5546E8;--accent-tint:#ECE9FD;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100%}
  a{color:inherit;text-decoration:none}

  .layout{display:flex;min-height:100vh}

  /* perpetual sidebar */
  .sidebar{width:264px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 14px}

  .brand{display:flex;flex-direction:column;padding:6px 8px 16px;border-bottom:1px solid var(--line)}
  .brand-row{display:flex;align-items:center;gap:11px}
  .brand .flag{width:40px;height:40px;border-radius:9px;object-fit:cover;border:1px solid var(--line);flex:none}
  .brand .who{min-width:0}
  .brand .name{font-weight:800;font-size:15px;letter-spacing:-.01em;line-height:1.1}
  .brand .sub{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-top:3px}
  .brand .party{font-weight:700}
  .brand .date{margin-top:13px;font-weight:800;font-size:13.5px;letter-spacing:-.01em;color:var(--ink)}

  .nav{display:flex;flex-direction:column;gap:2px;margin-top:14px}
  .nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-weight:600;font-size:14.5px;color:#2c2c33;cursor:pointer;transition:background .15s,color .15s}
  .nav a svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;color:var(--soft)}
  .nav a:hover{background:#f4f3f0}
  .nav a.active{background:var(--accent-tint);color:var(--accent)}
  .nav a.active svg{color:var(--accent)}

  .foot{margin-top:auto;padding:14px 12px 4px;border-top:1px solid var(--line);font-family:'Space Mono',monospace;font-size:11.5px;letter-spacing:.03em;color:var(--soft);display:flex;align-items:center;gap:9px}
  .foot .dot{width:9px;height:9px;border-radius:50%;background:#1f9d57;flex:none}
  .foot b{color:var(--ink);font-weight:700}

  /* main (blank for now) */
  .main{flex:1;min-width:0}

  /* mobile: collapse to an icon rail, still perpetual */
  @media (max-width:760px){
    .sidebar{width:72px;padding:14px 8px}
    .brand{align-items:center;padding:6px 0 14px}
    .brand .who,.brand .date{display:none}
    .nav a{justify-content:center;padding:11px 0;gap:0}
    .nav a .label{display:none}
    .foot{justify-content:center}
    .foot .label{display:none}
  }
</style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-row">
          <img class="flag" id="flag" src="/test/assets/Sessau.png" alt="Flag of the Front de Sessau">
          <div class="who">
            <div class="name">Front de Sessau</div>
            <div class="sub"><span class="party" id="party">Governing</span> · Sessau</div>
          </div>
        </div>
        <div class="date">1st Week of May, 1980</div>
      </div>

      <nav class="nav">
        <a class="active" href="/test/tutorial/home/">
          <svg viewBox="0 0 24 24"><path d="M3 10.7 12 4l9 6.7"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5h4v5"/></svg>
          <span class="label">Home</span>
        </a>
        <a aria-disabled="true">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-5 9 5"/><path d="M3 9h18M4 20h16M6 20v-9M10 20v-9M14 20v-9M18 20v-9"/></svg>
          <span class="label">Government</span>
        </a>
        <a aria-disabled="true">
          <svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.6-3.1 7.7-7 9-3.9-1.3-7-4.4-7-9V6z"/></svg>
          <span class="label">Nation</span>
        </a>
        <a aria-disabled="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
          <span class="label">World</span>
        </a>
        <a aria-disabled="true">
          <svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M7 20v-7M12 20v-12M17 20v-4"/></svg>
          <span class="label">Market</span>
        </a>
        <a aria-disabled="true">
          <svg viewBox="0 0 24 24"><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" y1="19" x2="19" y2="13"/><line x1="16" y1="16" x2="20" y2="20"/><line x1="19" y1="21" x2="21" y2="19"/><polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"/><line x1="5" y1="14" x2="9" y2="18"/><line x1="7" y1="17" x2="4" y2="20"/><line x1="3" y1="19" x2="5" y2="21"/></svg>
          <span class="label">Conflict</span>
        </a>
        <a aria-disabled="true">
          <svg viewBox="0 0 24 24"><path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"/><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"/></svg>
          <span class="label">Forum</span>
        </a>
        <a aria-disabled="true">
          <svg viewBox="0 0 24 24"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>
          <span class="label">Wiki</span>
        </a>
      </nav>

      <div class="foot">
        <span class="dot"></span>
        <span class="label">Leader · <b>Allen Droulez</b></span>
      </div>
    </aside>

    <main class="main"></main>
  </div>

  <script type="module">
    import { supabase, isConfigured } from '/test/supabase.js';

    // Hide the flag gracefully if the image is ever missing.
    const flag = document.getElementById('flag');
    if (flag) {
      const hide = () => { flag.style.display = 'none'; };
      flag.addEventListener('error', hide);
      if (flag.complete && flag.naturalWidth === 0) hide();
    }

    // Show the party the player chose in the tutorial, in its colour.
    // (Liberal is presented as "Centrist" here.)
    const PARTY = {
      Nationalist: { label: 'Nationalist', color: '#243b6b' }, // blue
      Labour:      { label: 'Labour',      color: '#c42b2b' }, // red
      Liberal:     { label: 'Centrist',    color: '#c2890b' }, // yellow
    };
    const partyEl = document.getElementById('party');
    (async () => {
      if (!isConfigured) return; // keep the default label until keys are set
      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) { window.location.href = '/test/login/'; return; }
        const { data, error } = await supabase
          .from('profiles')
          .select('tutorial_party')
          .eq('id', session.user.id)
          .single();
        if (error) return; // keep the default label
        const p = PARTY[data && data.tutorial_party];
        if (p) { partyEl.textContent = p.label; partyEl.style.color = p.color; }
      } catch (err) {
        // keep the default label
      }
    })();
  </script>
</body>
</html>
