<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nationhood Alpha | Melizea Shard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { margin: 0; padding: 0; background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Map Container and Ocean */
        #map-container { flex: 3; overflow: auto; background-color: #002b4d; position: relative; }
        svg { width: 100%; height: auto; display: block; }
        
        /* South Continent (Non-interactive background) */
        .continent-bg { 
            fill: #1a1a1a; 
            stroke: #2a2a2a;
            stroke-width: 1.5;
            pointer-events: none; 
        }

        /* Interactive Nation: Melizea */
        .land { 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            fill: #ffffff; 
            stroke: #000000;
            stroke-width: 1;
            pointer-events: all;
        }

        .land:hover { 
            fill: #fff5cc; 
            filter: drop-shadow(0 0 10px rgba(255, 245, 204, 0.5));
            transform: scale(1.01);
            transform-origin: center;
        }

        .selected-nation {
            fill: #ffcc00 !important;
            filter: drop-shadow(0 0 15px #ffcc00);
            stroke: #b8860b;
            stroke-width: 2;
        }

        /* Sidebar & UI */
        #sidebar { 
            flex: 1; 
            background-color: #1a1a1a; 
            padding: 20px; 
            border-left: 3px solid #ffcc00;
            min-width: 350px;
            max-width: 400px;
            box-shadow: -10px 0 20px rgba(0,0,0,0.5);
            overflow-y: auto;
        }

        .user-panel { 
            background: #252525; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            border-bottom: 2px solid #333; 
        }
        
        .faction-type-tag { 
            font-size: 0.7rem; 
            color: #ffcc00; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            margin-bottom: 5px; 
        }
        
        .resources { 
            display: flex; 
            justify-content: space-between; 
            margin-top: 10px; 
            font-size: 0.85rem; 
        }
        
        .resource-item { 
            background: #1a1a1a; 
            padding: 8px 12px; 
            border-radius: 4px; 
            border-left: 2px solid #ffcc00; 
        }
        
        .logout-btn { 
            background: transparent; 
            border: 1px solid #ff4444; 
            color: #ff4444; 
            padding: 6px 12px; 
            cursor: pointer; 
            border-radius: 4px; 
            transition: 0.3s; 
            margin-top: 10px; 
            font-size: 0.75rem; 
            width: 100%;
        }
        
        .logout-btn:hover { 
            background: #ff4444; 
            color: white; 
        }
        
        /* Tick Timer */
        .tick-timer {
            background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #444;
            text-align: center;
        }
        
        .tick-label {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .tick-countdown {
            font-size: 1.8rem;
            color: #ffcc00;
            font-weight: bold;
            margin: 8px 0;
            font-family: 'Courier New', monospace;
        }
        
        .tick-number {
            font-size: 0.8rem;
            color: #888;
        }
        
        /* Nation Details */
        #details { 
            background: #222; 
            padding: 15px; 
            border-radius: 4px; 
            line-height: 1.6; 
            border-left: 2px solid #444; 
            margin-bottom: 20px;
        }
        
        .stat-bar {
            margin: 10px 0;
        }
        
        .stat-label {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 3px;
        }
        
        .stat-value {
            background: #1a1a1a;
            height: 20px;
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }
        
        .stat-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffcc00, #e6b800);
            transition: width 0.3s;
        }
        
        .stat-number {
            position: absolute;
            right: 5px;
            top: 2px;
            font-size: 0.7rem;
            color: #fff;
            font-weight: bold;
        }
        
        /* Action Panel */
        .action-panel {
            background: #252525;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            border-top: 2px solid #ffcc00;
        }
        
        .action-btn {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #2a2a2a;
            border: 1px solid #ffcc00;
            color: #ffcc00;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        
        .action-btn:hover {
            background: #ffcc00;
            color: #000;
        }
        
        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        hr { border: 0; border-top: 1px solid #333; margin: 20px 0; }
        
        h3 { 
            color: #ffcc00; 
            margin-top: 0; 
            font-size: 1rem; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
        
        .submitted-action {
            background: #1a3a1a;
            border-left: 3px solid #4CAF50;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        
        .action-pending {
            color: #4CAF50;
            font-weight: bold;
        }
    </style>
</head>

<script>
    const supabaseUrl = 'https://pbumjalxclmegzckhqqr.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBidW1qYWx4Y2xtZWd6Y2tocXFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzc5MTI1NDQsImV4cCI6MjA1MzQ4ODU0NH0.rtzRaZyosjGhQ8zNpPuYZYZssdT71S5xqSSpOlnZ8tk';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let currentUser = null;
    let currentFaction = null;
    let currentNation = null;
    let selectedNation = null;
    let currentShard = null;

    async function initSession() {
        const { data: { user } } = await _supabase.auth.getUser();
        if (!user) {
            window.location.href = "login.html";
            return;
        }
        currentUser = user;

        // Load faction data
        const { data: faction, error: factionError } = await _supabase
            .from('factions')
            .select(`
                *,
                nations (
                    id,
                    name,
                    capital,
                    economy,
                    military,
                    stability,
                    technology,
                    active_parties,
                    active_military,
                    active_corps,
                    max_parties,
                    max_military_branches,
                    max_corporations
                ),
                shards (
                    id,
                    name,
                    current_tick,
                    next_tick_at
                )
            `)
            .eq('id', user.id)
            .single();

        if (factionError || !faction) {
            alert('Faction not found. Please sign up.');
            window.location.href = 'signup.html';
            return;
        }

        currentFaction = faction;
        currentNation = faction.nations;
        currentShard = faction.shards;

        // Update UI
        document.getElementById('f-name').innerText = faction.faction_name;
        document.getElementById('f-type').innerText = faction.faction_type.toUpperCase() + ' PATH';
        document.getElementById('nation-name').innerText = 'Nation: ' + currentNation.name;
        document.getElementById('influence').innerText = faction.influence;
        document.getElementById('funds').innerText = faction.funds;
        document.getElementById('current-tick').innerText = currentShard.current_tick;

        // Start countdown timer
        startCountdown(currentShard.next_tick_at);
        
        // Load submitted actions for this tick
        checkSubmittedActions();
    }

    function startCountdown(nextTickTime) {
        function updateCountdown() {
            const now = new Date();
            const target = new Date(nextTickTime);
            const diff = target - now;

            if (diff <= 0) {
                document.getElementById('countdown').innerText = 'PROCESSING...';
                return;
            }

            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('countdown').innerText = 
                `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    }

    async function handleLogout() {
        await _supabase.auth.signOut();
        window.location.href = "index.html";
    }

    // Map interaction
    document.querySelectorAll('.land').forEach(land => {
        land.addEventListener('click', async (e) => {
            e.stopPropagation();
            
            // Clear selection
            document.querySelectorAll('.land').forEach(l => l.classList.remove('selected-nation'));
            e.target.classList.add('selected-nation');
            
            const nationName = e.target.getAttribute('data-nation-name');
            
            // Load nation data
            const { data: nation } = await _supabase
                .from('nations')
                .select('*')
                .eq('name', nationName)
                .eq('shard_id', currentShard.id)
                .single();
            
            if (nation) {
                selectedNation = nation;
                displayNationDetails(nation);
                
                // Show action panel if this is player's nation
                if (nation.id === currentNation.id) {
                    document.getElementById('action-panel').style.display = 'block';
                } else {
                    document.getElementById('action-panel').style.display = 'none';
                }
            }
        });
    });

    function displayNationDetails(nation) {
        const detailsDiv = document.getElementById('details');
        
        detailsDiv.innerHTML = `
            <div style="margin-bottom: 15px;">
                <strong style="color: #ffcc00; font-size: 1.1rem;">${nation.name.toUpperCase()}</strong><br>
                <span style="color: #888; font-size: 0.85rem;">Capital: ${nation.capital}</span>
            </div>
            
            <div class="stat-bar">
                <div class="stat-label">Economy</div>
                <div class="stat-value">
                    <div class="stat-fill" style="width: ${nation.economy}%"></div>
                    <div class="stat-number">${nation.economy}</div>
                </div>
            </div>
            
            <div class="stat-bar">
                <div class="stat-label">Military</div>
                <div class="stat-value">
                    <div class="stat-fill" style="width: ${nation.military}%"></div>
                    <div class="stat-number">${nation.military}</div>
                </div>
            </div>
            
            <div class="stat-bar">
                <div class="stat-label">Stability</div>
                <div class="stat-value">
                    <div class="stat-fill" style="width: ${nation.stability}%"></div>
                    <div class="stat-number">${nation.stability}</div>
                </div>
            </div>
            
            <div class="stat-bar">
                <div class="stat-label">Technology</div>
                <div class="stat-value">
                    <div class="stat-fill" style="width: ${nation.technology}%"></div>
                    <div class="stat-number">${nation.technology}</div>
                </div>
            </div>
            
            <hr>
            
            <div style="font-size: 0.85rem; color: #888;">
                <strong>Active Factions:</strong><br>
                Political Parties: ${nation.active_parties} / ${nation.max_parties}<br>
                Military Branches: ${nation.active_military} / ${nation.max_military_branches}<br>
                Corporations: ${nation.active_corps} / ${nation.max_corporations}
            </div>
        `;
    }

    async function submitAction(actionType) {
        const actionNames = {
            'invest_economy': 'Invest in Economy',
            'build_military': 'Build Military Forces',
            'research': 'Research Technology',
            'stabilize': 'Stabilize Nation'
        };

        if (!confirm(`Submit action: ${actionNames[actionType]}?\n\nThis action will be processed during the next tick.`)) {
            return;
        }

        try {
            const { data, error } = await _supabase
                .from('actions')
                .insert([{
                    faction_id: currentUser.id,
                    shard_id: currentShard.id,
                    tick_number: currentShard.current_tick + 1,
                    action_type: actionType,
                    action_data: { submitted_at: new Date().toISOString() }
                }]);

            if (error) throw error;

            document.getElementById('action-status').innerHTML = `
                <div class="submitted-action">
                    <span class="action-pending">✓ ACTION SUBMITTED</span><br>
                    ${actionNames[actionType]}<br>
                    <span style="font-size: 0.75rem; color: #888;">
                        Will process at next tick
                    </span>
                </div>
            `;

            // Disable action buttons
            document.querySelectorAll('.action-btn').forEach(btn => btn.disabled = true);

        } catch (error) {
            alert('Error submitting action: ' + error.message);
        }
    }

    async function checkSubmittedActions() {
        const { data: actions } = await _supabase
            .from('actions')
            .select('*')
            .eq('faction_id', currentUser.id)
            .eq('tick_number', currentShard.current_tick + 1)
            .eq('processed', false);

        if (actions && actions.length > 0) {
            const actionNames = {
                'invest_economy': 'Invest in Economy',
                'build_military': 'Build Military Forces',
                'research': 'Research Technology',
                'stabilize': 'Stabilize Nation'
            };

            document.getElementById('action-status').innerHTML = `
                <div class="submitted-action">
                    <span class="action-pending">✓ ACTION PENDING</span><br>
                    ${actionNames[actions[0].action_type]}<br>
                    <span style="font-size: 0.75rem; color: #888;">
                        Submitted for tick ${actions[0].tick_number}
                    </span>
                </div>
            `;

            // Disable action buttons
            document.querySelectorAll('.action-btn').forEach(btn => btn.disabled = true);
        }
    }

    // Initialize
    initSession();
</script>

</body>
</html>
