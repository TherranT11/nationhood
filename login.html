<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nationhood | Login Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .login-card { background: #1e1e1e; padding: 40px; border-radius: 8px; border-top: 4px solid #ffcc00; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #ffcc00; margin-top: 0; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #888; }
        input { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; background: #ffcc00; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; transition: 0.2s; color: #000; margin: 5px 0; }
        .btn:hover { background: #e6b800; }
        .btn-test { background: #2196F3; }
        .btn-test:hover { background: #1976D2; }
        .signup-link { text-align: center; margin-top: 15px; font-size: 0.8rem; }
        .signup-link a { color: #ffcc00; text-decoration: none; }
        .error { color: #ff4444; font-size: 0.9rem; margin-top: 10px; padding: 10px; background: #2a1a1a; border-radius: 4px; }
        .success { color: #4CAF50; font-size: 0.9rem; margin-top: 10px; padding: 10px; background: #1a2a1a; border-radius: 4px; }
        .info { color: #888; font-size: 0.85rem; margin-top: 10px; padding: 10px; background: #1a1a1a; border-radius: 4px; white-space: pre-wrap; }
        .debug { margin-top: 20px; padding: 15px; background: #0a0a0a; border-radius: 4px; font-size: 0.8rem; line-height: 1.6; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Faction Login - TEST MODE</h2>
    
    <div class="debug" id="debug-info">
        <strong style="color: #ffcc00;">Connection Status:</strong><br>
        Checking Supabase connection...
    </div>
    
    <button class="btn btn-test" onclick="testConnection()">Test Supabase Connection</button>
    
    <hr style="border-color: #333; margin: 20px 0;">
    
    <form id="login-form">
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" value="test@test.com" required>
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" value="test123" required>
        </div>
        <button type="submit" class="btn">ENTER THE CHRONICLE</button>
        <div id="message"></div>
    </form>
    
    <div class="signup-link">
        New to the continent? <a href="signup.html">Establish a Faction</a>
    </div>
</div>

<script>
    // Your Supabase credentials
    const supabaseUrl = 'https://pbumjalxclmegzckhqqr.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBidW1qYWx4Y2xtZWd6Y2tocXFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3ODk0NTUsImV4cCI6MjA4NTM2NTQ1NX0.ykjUqdJbwF3yliond1Vz2lcNQZCWA-5SnviruXm4ypI';
    
    let _supabase = null;
    
    // Initialize and test connection
    async function initSupabase() {
        const debugDiv = document.getElementById('debug-info');
        
        try {
            debugDiv.innerHTML = '<strong style="color: #ffcc00;">Connection Status:</strong><br>Initializing Supabase client...';
            
            _supabase = supabase.createClient(supabaseUrl, supabaseKey);
            
            debugDiv.innerHTML += '<br>✓ Client created successfully<br>Testing connection...';
            
            // Test connection by checking session
            const { data, error } = await _supabase.auth.getSession();
            
            if (error) {
                debugDiv.innerHTML += '<br><span style="color: #ff4444;">✗ Connection test failed: ' + error.message + '</span>';
            } else {
                debugDiv.innerHTML += '<br><span style="color: #4CAF50;">✓ Connection successful!</span>';
                debugDiv.innerHTML += '<br><br>URL: ' + supabaseUrl;
                debugDiv.innerHTML += '<br>Key starts with: ' + supabaseKey.substring(0, 20) + '...';
            }
        } catch (err) {
            debugDiv.innerHTML = '<span style="color: #ff4444;">Error: ' + err.message + '</span>';
            console.error('Init error:', err);
        }
    }
    
    async function testConnection() {
        const debugDiv = document.getElementById('debug-info');
        
        try {
            debugDiv.innerHTML = '<strong style="color: #ffcc00;">Running Connection Tests...</strong><br><br>';
            
            // Test 1: Can we reach Supabase?
            debugDiv.innerHTML += '1. Testing API endpoint...<br>';
            const response = await fetch(supabaseUrl + '/rest/v1/', {
                headers: {
                    'apikey': supabaseKey
                }
            });
            
            if (response.ok) {
                debugDiv.innerHTML += '<span style="color: #4CAF50;">✓ API endpoint reachable</span><br><br>';
            } else {
                debugDiv.innerHTML += '<span style="color: #ff4444;">✗ API returned: ' + response.status + '</span><br><br>';
            }
            
            // Test 2: Can we query the factions table?
            debugDiv.innerHTML += '2. Testing factions table access...<br>';
            const { data, error } = await _supabase
                .from('factions')
                .select('count')
                .limit(1);
            
            if (error) {
                debugDiv.innerHTML += '<span style="color: #ff4444;">✗ Table access failed: ' + error.message + '</span><br>';
                debugDiv.innerHTML += '<br><strong>Possible fixes:</strong><br>';
                debugDiv.innerHTML += '1. Run the setup_rls.sql script in Supabase SQL Editor<br>';
                debugDiv.innerHTML += '2. Check that the factions table exists<br>';
                debugDiv.innerHTML += '3. Verify RLS policies are enabled<br>';
            } else {
                debugDiv.innerHTML += '<span style="color: #4CAF50;">✓ Table accessible</span><br><br>';
            }
            
            // Test 3: Can we access Auth?
            debugDiv.innerHTML += '3. Testing authentication system...<br>';
            const { data: sessionData, error: sessionError } = await _supabase.auth.getSession();
            
            if (sessionError) {
                debugDiv.innerHTML += '<span style="color: #ff4444;">✗ Auth failed: ' + sessionError.message + '</span><br>';
            } else {
                debugDiv.innerHTML += '<span style="color: #4CAF50;">✓ Auth system accessible</span><br>';
            }
            
            debugDiv.innerHTML += '<br><strong style="color: #4CAF50;">All tests complete!</strong>';
            
        } catch (err) {
            debugDiv.innerHTML += '<br><span style="color: #ff4444;">Unexpected error: ' + err.message + '</span>';
            console.error('Test error:', err);
        }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const messageDiv = document.getElementById('message');
        messageDiv.innerHTML = '';
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            messageDiv.innerHTML = '<div class="info">Attempting login...</div>';
            
            // Sign in with Supabase Auth
            const { data, error } = await _supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                console.error('Login error:', error);
                messageDiv.innerHTML = '<div class="error"><strong>Login Failed:</strong><br>' + error.message + '</div>';
                
                if (error.message.includes('Invalid login credentials')) {
                    messageDiv.innerHTML += '<div class="info">This usually means:<br>1. The email/password is wrong, OR<br>2. The user doesn\'t exist yet (try signing up first)</div>';
                }
            } else {
                messageDiv.innerHTML = '<div class="success">✓ Login successful! Redirecting...</div>';
                console.log('Login success:', data);
                setTimeout(() => {
                    window.location.href = "map.html";
                }, 1000);
            }
            
        } catch (error) {
            console.error('Unexpected error:', error);
            messageDiv.innerHTML = '<div class="error">Unexpected error: ' + error.message + '</div>';
        }
    });
    
    // Run initialization on page load
    initSupabase();
</script>

</body>
</html>
