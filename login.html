<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nationhood | Faction Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
<div class="page-title">Nationhood</div>
<div class="login-card">
    <div class="login-header">
        <span class="dot"></span>
        <span class="title">Faction Login</span>
    </div>
    <div class="login-body">
        <div class="initials-block">
            <div class="initials-icon">NH</div>
            <div class="initials-subtitle">Enter the Chronicle</div>
        </div>
        <div class="rule"></div>
        <form id="login-form">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required>
            </div>
            <div class="forgot-link">
                <a href="forgot-password.html">Forgot password?</a>
            </div>
            <button type="submit" class="btn-login" id="submit-btn">Enter the Chronicle</button>
            <div id="error-message" class="error"></div>
            <div id="success-message" class="success"></div>
        </form>
        <div class="signup-link">
            New to the continent? <a href="signup.html">Establish a Faction</a>
        </div>
    </div>
</div>
<script type="module">
import { _supabase } from './js/supabase-client.js';
import { isFactionInactive, getFactionDashboardUrl } from './js/game/factions.js';

    // On page load, check if user is already logged in
    (async () => {
        const { data: { user } } = await _supabase.auth.getUser();
        if (user) {
            await routeUser(user);
        }
    })();

    // Show success message if redirected from password reset
    const params = new URLSearchParams(window.location.search);
    if (params.get('reset') === 'success') {
        document.getElementById('success-message').textContent = 'Password updated! You can now log in.';
    }
    if (params.get('confirmed') === 'true') {
        document.getElementById('success-message').textContent = 'Email confirmed! You can now log in.';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const submitBtn = document.getElementById('submit-btn');
        const errorMsg = document.getElementById('error-message');
        const successMsg = document.getElementById('success-message');
        errorMsg.textContent = '';
        successMsg.textContent = '';
        submitBtn.disabled = true;
        submitBtn.textContent = 'LOGGING IN...';

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        try {
            const { data, error } = await _supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });
            if (error) throw error;
            // Clear stale game state so dashboard fetches fresh data
            sessionStorage.removeItem('nationhood_state');
            await routeUser(data.user);
        } catch (error) {
            console.error('Login error:', error);
            errorMsg.textContent = error.message || 'Login failed. Please try again.';
            submitBtn.disabled = false;
            submitBtn.textContent = 'ENTER THE CHRONICLE';
        }
    });

    async function routeUser(user) {
        try {
            // Load all factions owned by this user (primary + linked)
            const { data: allFactions, error: facErr } = await _supabase
                .from('factions')
                .select('id, faction_type, branch, nation_id, abandoned_at, is_banned')
                .or(`id.eq.${user.id},linked_user_id.eq.${user.id}`);
            // A failed read must NOT fall through to faction-select:
            // misrouting an existing player into the creation flow dead-
            // ends at "You already hold a politician in this nation"
            // (20270782). Surface the failure and let them retry instead.
            if (facErr) throw facErr;

            // Filter out dissolved/abandoned/banned factions
            const ownedFactions = (allFactions || []).filter(f => !isFactionInactive(f));

            if (ownedFactions.length === 0) {
                window.location.href = 'faction-select.html';
                return;
            }

            // Route to last active faction, or default to first owned
            const activeFactionId = sessionStorage.getItem('active_faction_id');
            const activeFaction = ownedFactions.find(f => f.id === activeFactionId) || ownedFactions[0];

            // Single-source router (js/game/factions.js): corp →
            // faction-select, party → politics, army → army-dashboard,
            // branch-less military → faction-select. Fallback covers
            // any unknown type.
            window.location.href = getFactionDashboardUrl(activeFaction) || 'dashboard.html';
        } catch (error) {
            console.error('Faction check error:', error);
            const errorMsg = document.getElementById('error-message');
            const submitBtn = document.getElementById('submit-btn');
            if (errorMsg) errorMsg.textContent = 'Signed in, but your characters failed to load — please try again.';
            if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'ENTER THE CHRONICLE'; }
        }
    }
</script>
</body>
</html>
