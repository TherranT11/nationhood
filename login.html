<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nationhood | Faction Login</title>
        <link rel="stylesheet" href="css/login.css">
</head>
<body>
<div class="login-card">
    <h2>Faction Login</h2>
    <form id="login-form">
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" required>
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" required>
        </div>
        <div class="forgot-link">
            <a href="forgot-password.html">Forgot password?</a>
        </div>
        <button type="submit" class="btn-login" id="submit-btn">ENTER THE CHRONICLE</button>
        <div id="error-message" class="error"></div>
        <div id="success-message" class="success"></div>
    </form>
    <div class="signup-link">
        New to the continent? <a href="signup.html">Establish a Faction</a>
    </div>
</div>
<script type="module">
import { _supabase } from './js/supabase-client.js';

    // Show success message if redirected from password reset
    const params = new URLSearchParams(window.location.search);
    if (params.get('reset') === 'success') {
        document.getElementById('success-message').textContent = 'Password updated! You can now log in.';
    }
    if (params.get('confirmed') === 'true') {
        document.getElementById('success-message').textContent = 'Email confirmed! You can now log in.';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const submitBtn = document.getElementById('submit-btn');
        const errorMsg = document.getElementById('error-message');
        const successMsg = document.getElementById('success-message');
        errorMsg.textContent = '';
        successMsg.textContent = '';
        submitBtn.disabled = true;
        submitBtn.textContent = 'LOGGING IN...';

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        try {
            const { data, error } = await _supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });
            if (error) throw error;
            // Clear stale game state so dashboard fetches fresh data
            sessionStorage.removeItem('nationhood_state');
            window.location.href = "dashboard.html";
        } catch (error) {
            console.error('Login error:', error);
            errorMsg.textContent = error.message || 'Login failed. Please try again.';
            submitBtn.disabled = false;
            submitBtn.textContent = 'ENTER THE CHRONICLE';
        }
    });
</script>
</body>
</html>
