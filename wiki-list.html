<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wiki Pages | Nationhood Alpha</title>
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/wiki.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="top-bar"></div>

<div class="wiki-container" id="wiki-root">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:40vh;">
    <div class="loading-container">
      <div class="loading-spinner"></div>
      <div style="color:var(--text-secondary)">Loading pages...</div>
    </div>
  </div>
</div>

<script>
// Wiki defaults to light mode — apply immediately to prevent flash
(function() {
    const saved = localStorage.getItem('nationhood_theme');
    if (saved !== 'dark') {
        document.body.classList.add('light-mode');
    }
})();
</script>
<script type="module">
import { _supabase } from './js/supabase-client.js';
import { escapeHtml } from './js/utils.js';
import { initWikiPage, renderWikiSearchBar, fetchPageList, createTagSearch, fetchPopularTags } from './js/wiki.js';

const TEMPLATE_TYPES = ['nation', 'person', 'corporation', 'religion', 'culture', 'political_party', 'law', 'agreement', 'event', 'organization', 'military_unit', 'product', 'location'];

(async () => {
    const state = await initWikiPage();
    if (!state) return;
    const { isLoggedIn } = state;
    const root = document.getElementById('wiki-root');

    let pages = [];
    try {
        pages = await fetchPageList(_supabase);
    } catch (err) {
        root.innerHTML = `<div class="wiki-empty"><h2>Error</h2><p>${escapeHtml(err.message)}</p></div>`;
        return;
    }

    // Fetch popular tags for search component
    const popularTags = await fetchPopularTags(_supabase, 10);

    let activeFilter = 'all';
    let searchTerm = '';
    let searchTags = [];

    // Check URL for pre-set tags (from reader page tag links)
    const urlParams = new URLSearchParams(window.location.search);
    const urlTags = urlParams.get('tags');
    if (urlTags) {
        searchTags = urlTags.split(',').map(t => t.trim().replace(/^#/, '').toLowerCase()).filter(Boolean);
    }

    // Tag search component
    let tagSearchComponent = null;

    function render() {
        const filtered = pages.filter(p => {
            if (activeFilter !== 'all' && p.template_type !== activeFilter) return false;
            if (searchTerm && !p.title.toLowerCase().includes(searchTerm.toLowerCase())) return false;
            // Tag filtering: AND logic — article must have ALL search tags
            if (searchTags.length > 0) {
                const pageTags = p.tags || [];
                if (!searchTags.every(t => pageTags.includes(t))) return false;
            }
            return true;
        });

        const filterBtns = ['all', ...TEMPLATE_TYPES].map(f => {
            const label = f === 'all' ? 'All' : f.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
            return `<button class="wiki-filter-btn ${f === activeFilter ? 'active' : ''}" data-filter="${f}">${label}</button>`;
        }).join('');

        const rowsHtml = filtered.length
            ? filtered.map(p => {
                const typeBadge = p.template_type
                    ? `<span class="wiki-page-row-type">${escapeHtml(p.template_type)}</span>`
                    : '';
                const lockBadge = p.locked_by
                    ? `<span class="wiki-lock-badge">Locked</span>`
                    : '';
                const updated = p.updated_at
                    ? new Date(p.updated_at).toLocaleDateString()
                    : '';
                // Show matching tags on result rows
                const pageTags = p.tags || [];
                const tagChips = pageTags.length > 0
                    ? `<span style="display:inline-flex;gap:3px;margin-left:auto;margin-right:8px;">${pageTags.slice(0, 5).map(t =>
                        `<span class="wiki-tag-chip" style="font-size:8px;padding:1px 4px;${searchTags.includes(t) ? 'color:var(--accent,#c8a64e);font-weight:700;' : ''}">#${escapeHtml(t)}</span>`
                    ).join('')}${pageTags.length > 5 ? `<span style="font-size:8px;color:var(--text-dim);">+${pageTags.length - 5}</span>` : ''}</span>`
                    : '';
                return `
                    <a href="wiki.html?slug=${encodeURIComponent(p.slug)}" class="wiki-page-row">
                        <span class="wiki-page-row-title">${escapeHtml(p.title)}</span>
                        ${lockBadge}
                        ${typeBadge}
                        ${tagChips}
                        <span class="wiki-page-row-meta">${updated}</span>
                    </a>
                `;
            }).join('')
            : searchTags.length > 0
                ? `<div class="wiki-empty" style="padding:30px"><p>No articles tagged with all of these tags.</p><p style="color:var(--text-muted);font-size:12px;margin-top:6px;">Try fewer tags to broaden your search.</p></div>`
                : `<div class="wiki-empty" style="padding:30px"><p>No pages found.</p></div>`;

        const newPageBtn = isLoggedIn
            ? '<a href="wiki-edit.html?new=1" class="wiki-btn wiki-btn-primary">New Page</a>'
            : '';

        root.innerHTML = `
            <div class="wiki-list-header">
                <h1>Wiki</h1>
                <div class="wiki-list-filters">
                    <input type="text" class="wiki-search-input" id="wiki-search" placeholder="Search pages..." value="${escapeHtml(searchTerm)}">
                    ${filterBtns}
                    <a href="wiki.html" class="wiki-btn">Wiki Home</a>
                    ${newPageBtn}
                </div>
            </div>
            <div id="tag-search-mount"></div>
            <div class="wiki-page-list" id="wiki-page-list">${rowsHtml}</div>
        `;

        // Mount tag search component
        tagSearchComponent = createTagSearch({
            onSearch: (tags) => {
                searchTags = tags;
                render();
            },
            popularTags
        });
        // Pre-populate from URL if applicable
        if (searchTags.length > 0 && tagSearchComponent) {
            // We need to set tags on the component — but createTagSearch doesn't expose setTags.
            // Instead, render handles it via the searchTags variable.
        }
        document.getElementById('tag-search-mount').appendChild(tagSearchComponent.container);

        document.getElementById('wiki-search').addEventListener('input', (e) => {
            searchTerm = e.target.value;
            render();
        });

        root.querySelectorAll('.wiki-filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                activeFilter = btn.dataset.filter;
                render();
            });
        });

        if (searchTerm) {
            const input = document.getElementById('wiki-search');
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
        }
    }

    render();
    await renderWikiSearchBar(root);
})();
</script>
</body>
</html>
