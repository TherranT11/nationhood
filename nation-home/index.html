<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nation Home · Nationhood Game</title>
<link rel="stylesheet" href="/site.css">
<script src="/theme.js"></script>
<style>
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  /* Top bar: FLAG | NATION on the left, Discord + Log out on the right. */
  .nhbrand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .nhflag { width: 42px; height: 28px; border: 1px solid var(--line); border-radius: 6px; object-fit: cover; flex: none; background: var(--surface); }
  .nhflag.ph { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .nhsep { color: var(--line); font-weight: 300; font-size: 22px; flex: none; }
  .nhname { font-size: 18px; font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .wrap4 { max-width: 1180px; margin: 0 auto; padding: 44px 24px 80px; }
  .wrap4 h1 { font-size: clamp(24px, 4vw, 34px); letter-spacing: -0.02em; font-weight: 800; margin: 0 0 8px; }
  .playas { color: var(--muted); font-size: 15px; font-weight: 600; margin: 0 0 6px; }
  .playas b { color: var(--ink); }
  .date { color: var(--muted); font-size: 14.5px; font-weight: 600; margin: 0; }
  .date b { color: var(--ink); }
  .empty { padding: 48px 24px; border: 1px dashed var(--line); border-radius: 14px; text-align: center; color: var(--muted); font-size: 14.5px; }
</style>
</head>
<body>
  <header>
    <div class="wrap nav">
      <div class="brand nhbrand">
        <span id="nhflag"></span>
        <span class="nhsep">|</span>
        <span class="nhname" id="nhname">…</span>
      </div>
      <nav class="nav-actions">
        <a class="btn btn-discord" href="https://discord.gg/HBvWxJUm8" target="_blank" rel="noopener" aria-label="Join the Discord">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.369A19.79 19.79 0 0 0 16.558 3a13.6 13.6 0 0 0-.6 1.23 18.27 18.27 0 0 0-5.487 0A13.6 13.6 0 0 0 9.87 3a19.79 19.79 0 0 0-3.76 1.369C2.72 9.046 1.79 13.605 2.255 18.1a19.9 19.9 0 0 0 6.073 3.058c.49-.668.926-1.377 1.302-2.122a12.93 12.93 0 0 1-2.05-.978c.172-.126.34-.257.502-.392a14.2 14.2 0 0 0 12.036 0c.164.135.332.266.502.392-.654.386-1.343.714-2.052.98.376.743.812 1.452 1.302 2.12a19.86 19.86 0 0 0 6.075-3.058c.546-5.21-.93-9.728-3.93-13.73ZM9.682 15.33c-1.182 0-2.157-1.086-2.157-2.42 0-1.333.955-2.42 2.157-2.42 1.21 0 2.176 1.097 2.157 2.42 0 1.334-.955 2.42-2.157 2.42Zm4.636 0c-1.182 0-2.157-1.086-2.157-2.42 0-1.333.955-2.42 2.157-2.42 1.21 0 2.176 1.097 2.157 2.42 0 1.334-.946 2.42-2.157 2.42Z"/></svg>
          <span class="btn-label">Discord</span>
        </a>
        <button class="btn btn-ghost" id="logout" type="button">Log out</button>
      </nav>
    </div>
  </header>

  <main class="wrap4">
    <div id="content"><div class="empty">Loading…</div></div>
  </main>

  <script type="module">
    import { supabase, isConfigured, logout } from '/supabase.js';
    import { mountGameDate } from '/gamedate.js';   // live game date (one source)
    import { esc } from '/util.js';

    document.getElementById('logout').addEventListener('click', logout);
    const nhName = document.getElementById('nhname');
    const nhFlag = document.getElementById('nhflag');
    const content = document.getElementById('content');
    const params = new URLSearchParams(location.search);
    const nationId = params.get('nation'), roleId = params.get('role');

    (async () => {
      if (!isConfigured) { content.innerHTML = '<div class="empty">Nation data isn’t connected yet.</div>'; return; }
      if (!nationId) { content.innerHTML = '<div class="empty">No nation selected. <a href="/nations/">Choose one.</a></div>'; return; }
      try {
        const [natRes, persRes] = await Promise.all([
          supabase.from('nationverse_nations').select('id, name, flag').eq('id', nationId).maybeSingle(),
          roleId ? supabase.from('nationverse_personalities').select('name').eq('id', roleId).maybeSingle() : Promise.resolve({ data: null })
        ]);
        if (natRes.error) throw natRes.error;
        const n = natRes.data;
        if (!n) { content.innerHTML = '<div class="empty">That nation no longer exists. <a href="/nations/">Choose another.</a></div>'; return; }

        nhName.textContent = n.name || 'Unknown';
        nhFlag.innerHTML = n.flag
          ? '<img class="nhflag" alt="Flag" src="' + esc(n.flag) + '">'
          : '<span class="nhflag ph">' + esc((n.name || '?').slice(0, 3)) + '</span>';

        const who = (persRes && persRes.data && persRes.data.name) ? persRes.data.name : null;
        content.innerHTML =
          '<h1>' + esc(n.name || 'Unknown') + '</h1>' +
          (who ? '<p class="playas">Playing as <b>' + esc(who) + '</b></p>' : '') +
          '<p class="date">Current Date: <b id="gamedate">…</b></p>';
        mountGameDate(document.getElementById('gamedate'));
      } catch (e) { content.innerHTML = '<div class="empty">Couldn’t load your nation. Try again shortly.</div>'; }
    })();
  </script>
</body>
</html>
