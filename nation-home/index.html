<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nation Home · Nationhood Game</title>
<link rel="stylesheet" href="/site.css">
<script src="/theme.js"></script>
<style>
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }

  /* Full-width, two-row top bar: [flag] [nation | economy] over [current date] · Next Elections (centre) · character (right). */
  .nhtop { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 15px 30px;
    padding: 17px 30px; border-bottom: 1px solid var(--line); background: var(--surface); }
  @media (max-width: 900px) { .nhtop { grid-template-columns: 1fr; justify-items: start; } }
  .nhleft { display: flex; align-items: center; gap: 15px; min-width: 0; justify-self: start; }
  .nhleftcol { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .nhline1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .nhright { display: flex; align-items: center; gap: 13px; flex-wrap: wrap; justify-self: end; }
  .nhmid { justify-self: center; text-align: center; color: var(--muted); font-size: 17px; font-weight: 600; }
  .nhmid b { color: var(--ink); font-weight: 700; }
  .nhflag { width: 57px; height: 39px; border: 1px solid var(--line); border-radius: 7px; object-fit: cover; flex: none; background: var(--bg); }
  .nhflag.ph { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .nhname { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; }
  .nhecon, .nhwho { color: var(--muted); font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .nhecon b, .nhwho b { color: var(--ink); font-weight: 700; }
  .nhdate { color: var(--muted); font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .nhdate b { color: var(--ink); font-weight: 700; }
  .nhsep { color: var(--line2, var(--line)); font-weight: 400; }
  .nhtbtn { padding: 10px 17px; font-size: 17px; }

  /* Body = left sidebar + main. CHARACTER is the current page; other sections are placeholders for now. */
  .nhbody { display: flex; align-items: stretch; min-height: calc(100vh - 66px); }
  .nhside { width: 216px; flex: none; border-right: 1px solid var(--line); background: var(--surface); padding: 16px 12px; }
  .nhnav { display: block; padding: 11px 14px; margin-bottom: 4px; border-radius: 10px; font-size: 13px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); text-decoration: none; cursor: pointer; }
  .nhnav:hover { background: var(--bg); color: var(--ink); }
  .nhnav.active { background: var(--bg); color: var(--ink); box-shadow: inset 3px 0 0 var(--accent); }
  .nhnav.soon { opacity: .5; cursor: default; }
  .nhnav.soon:hover { background: transparent; color: var(--muted); }
  .nhmain { flex: 1; min-width: 0; padding: 30px 24px 80px; }
  @media (max-width: 720px) {
    .nhbody { flex-direction: column; }
    .nhside { width: auto; border-right: none; border-bottom: 1px solid var(--line); display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px; }
    .nhnav { margin-bottom: 0; white-space: nowrap; }
    .nhnav.active { box-shadow: inset 0 -3px 0 var(--accent); }
  }
  .empty { padding: 48px 24px; border: 1px dashed var(--line); border-radius: 14px; text-align: center; color: var(--muted); font-size: 14.5px; }

  /* ---- Character page (the home screen). Two columns: the desk (left) + the state rail (right).
     Everything starts empty except The Nation card, which reads the nation's live stats. ---- */
  .ch-wrap { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .ch-col { display: flex; flex-direction: column; gap: 14px; }
  .ch-main { flex: 1.5 1 460px; }
  .ch-rail { flex: 1 1 300px; }
  .ch-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 15px 17px; }
  .ch-hd { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 11px; }
  .ch-micro { font-size: 10px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; font-weight: 800; }
  .ch-link { font-size: 10px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; font-weight: 700; cursor: pointer; }
  .ch-link:hover { color: var(--accent); }
  .ch-empty { color: var(--muted); font-size: 13.5px; padding: 22px 6px; text-align: center; }
  /* Stat rows: label · five segments · value */
  .ch-row { display: flex; align-items: center; gap: 12px; padding: 5px 0; }
  .ch-row .ch-lbl { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ch-segs { display: flex; gap: 3px; flex: none; }
  .ch-seg { width: 16px; height: 7px; border-radius: 3px; background: color-mix(in srgb, var(--ink) 10%, transparent); }
  .ch-val { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 12px; width: 22px; text-align: right; flex: none; }
  .ch-sub { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 11px; }
  .ch-subrow { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 3px 0; }
  .ch-subrow .k { color: var(--muted); }
  .ch-subrow .v { font-weight: 700; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <header class="nhtop">
    <div class="nhleft">
      <span id="nhflag"></span>
      <div class="nhleftcol">
        <div class="nhline1"><span class="nhname" id="nhname">…</span><span class="nhecon" id="nhecon"></span></div>
        <div class="nhdate" id="nhdate"></div>
      </div>
    </div>
    <div class="nhmid">Next Elections: <b>—</b></div>
    <div class="nhright">
      <span class="nhwho" id="nhwho"></span>
      <button class="btn btn-ghost nhtbtn" id="themeToggle" type="button">Theme</button>
      <button class="btn btn-ghost nhtbtn" id="logout" type="button">Log out</button>
    </div>
  </header>

  <div class="nhbody">
    <aside class="nhside">
      <span class="nhnav active" aria-current="page">Character</span>
      <span class="nhnav soon" title="Coming soon">Agenda</span>
      <span class="nhnav soon" title="Coming soon">Conversations</span>
      <span class="nhnav soon" title="Coming soon">Nation</span>
      <span class="nhnav soon" title="Coming soon">Legislature</span>
      <span class="nhnav soon" title="Coming soon">Conflict</span>
      <span class="nhnav soon" title="Coming soon">Wiki</span>
    </aside>
    <main class="nhmain">
      <div id="content"><div class="empty">Loading…</div></div>
    </main>
  </div>

  <script type="module">
    import { supabase, isConfigured, logout } from '/supabase.js';
    import { mountGameDate } from '/gamedate.js';   // live game date (one source)
    import { NV_STATS } from '/nationverse.js';      // the stat set (one source)
    import { esc } from '/util.js';

    document.getElementById('logout').addEventListener('click', logout);

    // Light/Dark toggle reuses theme.js (one source); the label shows the mode it will switch to.
    const themeBtn = document.getElementById('themeToggle');
    const syncThemeLabel = () => { themeBtn.textContent = (window.NHTheme && window.NHTheme.current === 'dark') ? '☀ Light' : '☾ Dark'; };
    syncThemeLabel();
    themeBtn.addEventListener('click', () => { if (window.NHTheme) window.NHTheme.toggle(); syncThemeLabel(); });

    const nhName = document.getElementById('nhname'), nhFlag = document.getElementById('nhflag');
    const nhEcon = document.getElementById('nhecon'), nhWho = document.getElementById('nhwho');
    const nhDate = document.getElementById('nhdate');
    const content = document.getElementById('content');
    const params = new URLSearchParams(location.search);
    const nationId = params.get('nation'), roleId = params.get('role');
    const SEP = ' <span class="nhsep">|</span> ';

    // Economic Growth (0–20 stat) shown as a word rating on the top bar, in paired bands:
    // 1–2 Depression … 19–20 Booming. Band index = floor((v−1)/2), clamped to the 10 labels.
    const ECON_RATINGS = ['Depression', 'Recession', 'Stagnant', 'Weak', 'Stable',
      'Healthy', 'Prosperous', 'Strong Growth', 'Rapid Growth', 'Booming'];
    function economyRating(v) {
      const n = Number(v);
      if (v == null || !isFinite(n)) return '—';
      return ECON_RATINGS[Math.max(0, Math.min(9, Math.floor((n - 1) / 2)))];
    }

    // A nation stat (0–20) shown as five colour blocks. Fill = one block per 4 points (1–4 → 1 block …
    // 17–20 → 5), and the colour runs low→high red→green (per the design: low is red, high is green).
    const SEG_COLORS = ['#e2604f', '#e0864a', '#e8b54a', '#7cc46a', '#4ecb8d'];
    function statSegs(v) {
      const n = Number(v);
      const filled = (v == null || !isFinite(n)) ? 0 : Math.max(0, Math.min(5, Math.ceil(n / 4)));
      const color = filled > 0 ? SEG_COLORS[filled - 1] : '';
      let out = '';
      for (let i = 0; i < 5; i++) out += '<span class="ch-seg"' + (i < filled ? ' style="background:' + color + '"' : '') + '></span>';
      return out;
    }

    // The Character home screen. Every panel starts empty except The Nation, which reads live stats.
    function renderCharacterPage(n) {
      const stats = n.stats || {};
      const rows = NV_STATS.map(([key, label]) => {
        const v = stats[key];
        const shown = (v == null || !isFinite(Number(v))) ? '—' : Number(v);
        return '<div class="ch-row"><span class="ch-lbl">' + esc(label) + '</span>' +
          '<span class="ch-segs">' + statSegs(v) + '</span>' +
          '<span class="ch-val">' + esc(shown) + '</span></div>';
      }).join('');
      content.innerHTML =
        '<div class="ch-wrap">' +
          '<div class="ch-col ch-main">' +
            '<div class="ch-card"><div class="ch-hd"><span class="ch-micro">Requires Your Attention</span></div>' +
              '<div class="ch-empty">Nothing needs your attention right now.</div></div>' +
            '<div class="ch-card"><div class="ch-hd"><span class="ch-micro">The Papers</span></div>' +
              '<div class="ch-empty">No headlines yet.</div></div>' +
          '</div>' +
          '<div class="ch-col ch-rail">' +
            '<div class="ch-card"><div class="ch-hd"><span class="ch-micro">Current Objective</span></div>' +
              '<div class="ch-empty">No active objective.</div></div>' +
            '<div class="ch-card"><div class="ch-hd"><span class="ch-micro">The Nation</span>' +
              '<a class="ch-link" href="/nations/">Full Nation →</a></div>' +
              rows +
              '<div class="ch-sub">' +
                '<div class="ch-subrow"><span class="k">Coalition majority</span><span class="v">—</span></div>' +
                '<div class="ch-subrow"><span class="k">Personal popularity</span><span class="v">—</span></div>' +
              '</div></div>' +
            '<div class="ch-card"><div class="ch-hd"><span class="ch-micro">The Week Ahead</span></div>' +
              '<div class="ch-empty">Nothing scheduled.</div></div>' +
          '</div>' +
        '</div>';
    }

    // Countdown to the next game tick. The tick runs on pg_cron '0 */6 * * *' (00/06/12/18 UTC — see
    // schema/60), so counting to the next 6-hour UTC boundary is anchored to the actual schedule.
    function startTickCountdown(el) {
      const TICK_H = 6, pad = n => String(n).padStart(2, '0');
      const render = () => {
        const now = new Date();
        const nb = (Math.floor(now.getUTCHours() / TICK_H) + 1) * TICK_H;
        const next = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), nb, 0, 0, 0);
        const s = Math.max(0, Math.floor((next - now.getTime()) / 1000));
        el.textContent = pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60);
      };
      render();
      setInterval(render, 1000);
    }

    (async () => {
      if (!isConfigured) { content.innerHTML = '<div class="empty">Nation data isn’t connected yet.</div>'; return; }
      try {
        // AUTHORITATIVE: a player inhabits ONLY the character they have claimed — derived from claimed_by
        // (the signed-in user), never from the URL, so nobody can inhabit a role by editing the address.
        let p = null, n = null, legacy = false;
        const { data: u } = await supabase.auth.getUser();
        const myId = u && u.user ? u.user.id : null;
        if (myId) {
          const meRes = await supabase.from('nationverse_personalities').select('*').eq('claimed_by', myId).maybeSingle();
          if (meRes.error) legacy = true;   // claimed_by column not present yet (migrations 279+ pending)
          else p = meRes.data;              // this user's claimed character (or null)
        } else { legacy = true; }           // not signed in → can't verify ownership; fall back to URL

        if (!legacy) {
          if (!p) { window.location.replace('/nations/'); return; }   // no character yet → go choose one
          const natRes = await supabase.from('nationverse_nations').select('id, name, flag, stats, parties').eq('id', p.nation_id).maybeSingle();
          if (natRes.error) throw natRes.error;
          n = natRes.data;
        } else {
          if (!nationId) { content.innerHTML = '<div class="empty">No nation selected. <a href="/nations/">Choose one.</a></div>'; return; }
          const [natRes, persRes] = await Promise.all([
            supabase.from('nationverse_nations').select('id, name, flag, stats, parties').eq('id', nationId).maybeSingle(),
            roleId ? supabase.from('nationverse_personalities').select('*').eq('id', roleId).maybeSingle() : Promise.resolve({ data: null })
          ]);
          if (natRes.error) throw natRes.error;
          n = natRes.data; p = (persRes && persRes.data) ? persRes.data : null;
        }
        if (!n) { content.innerHTML = '<div class="empty">That nation no longer exists. <a href="/nations/">Choose another.</a></div>'; return; }

        // Top bar left: flag + name + economy readouts (economy growth, budget from the nation's stats;
        // personal wealth from the character).
        nhName.textContent = n.name || 'Unknown';
        nhFlag.innerHTML = n.flag
          ? '<img class="nhflag" alt="Flag" src="' + esc(n.flag) + '">'
          : '<span class="nhflag ph">' + esc((n.name || '?').slice(0, 3)) + '</span>';

        const stats = n.stats || {};
        const economy = economyRating(stats.economic_growth);
        const budget = stats.budget != null ? stats.budget : '—';
        const wealth = (p && p.wealth != null) ? p.wealth : 0;
        nhEcon.innerHTML = SEP + 'Economy: <b>' + esc(economy) + '</b>' + SEP + 'Budget: <b>' + esc(budget) + '</b>' + SEP + 'Personal Wealth: <b>' + esc(wealth) + '</b>';

        // Top bar right: character name | role | party (party resolved for legacy politician records too).
        if (p) {
          const parties = n.parties || [];
          const isPol = p.party || p.role === 'Politician' || /^Politician of Party \d+$/.test(p.role || '');
          const roleText = (p.office && p.office !== 'No Specific Office') ? p.office : (isPol ? 'Politician' : (p.role || ''));
          let partyText = p.party || '';
          if (!partyText && isPol) { const m = /^Politician of Party (\d+)$/.exec(p.role || ''); if (m) partyText = (parties[+m[1] - 1] || {}).name || ''; }
          nhWho.innerHTML = '<b>' + esc(p.name || 'Unnamed') + '</b>' +
            (roleText ? SEP + esc(roleText) : '') + (partyText ? SEP + esc(partyText) : '');
        }

        nhDate.innerHTML = 'Current Date: <b id="gamedate">…</b>' + SEP + 'Next tick: <b id="nhtick">…</b>';
        mountGameDate(document.getElementById('gamedate'));
        startTickCountdown(document.getElementById('nhtick'));
        renderCharacterPage(n);   // Character home screen (Nation stats live; other panels empty for now)
      } catch (e) { content.innerHTML = '<div class="empty">Couldn’t load your nation. Try again shortly.</div>'; }
    })();
  </script>
</body>
</html>
