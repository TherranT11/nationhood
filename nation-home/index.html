<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nation Home · Nationhood Game</title>
<link rel="stylesheet" href="/site.css">
<script src="/theme.js"></script>
<style>
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }

  /* Full-width, two-row top bar: [flag] [nation | economy] over [current date] · Next Elections (centre) · character (right). */
  .nhtop { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 15px 30px;
    padding: 17px 30px; border-bottom: 1px solid var(--line); background: var(--surface); }
  @media (max-width: 900px) { .nhtop { grid-template-columns: 1fr; justify-items: start; } }
  .nhleft { display: flex; align-items: center; gap: 15px; min-width: 0; justify-self: start; }
  .nhleftcol { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .nhline1 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .nhright { display: flex; align-items: center; gap: 13px; flex-wrap: wrap; justify-self: end; }
  .nhmid { justify-self: center; text-align: center; color: var(--muted); font-size: 17px; font-weight: 600; }
  .nhmid b { color: var(--ink); font-weight: 700; }
  .nhflag { width: 57px; height: 39px; border: 1px solid var(--line); border-radius: 7px; object-fit: cover; flex: none; background: var(--bg); }
  .nhflag.ph { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .nhname { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; }
  .nhecon, .nhwho { color: var(--muted); font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .nhecon b, .nhwho b { color: var(--ink); font-weight: 700; }
  .nhdate { color: var(--muted); font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .nhdate b { color: var(--ink); font-weight: 700; }
  .nhsep { color: var(--line2, var(--line)); font-weight: 400; }
  .nhtbtn { padding: 10px 17px; font-size: 17px; }

  /* Body = left sidebar + main. CHARACTER is the current page; other sections are placeholders for now. */
  .nhbody { display: flex; align-items: stretch; min-height: calc(100vh - 66px); }
  .nhside { width: 216px; flex: none; border-right: 1px solid var(--line); background: var(--surface); padding: 16px 12px; }
  .nhnav { display: block; padding: 11px 14px; margin-bottom: 4px; border-radius: 10px; font-size: 13px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); text-decoration: none; cursor: pointer; }
  .nhnav:hover { background: var(--bg); color: var(--ink); }
  .nhnav.active { background: var(--bg); color: var(--ink); box-shadow: inset 3px 0 0 var(--accent); }
  .nhnav.soon { opacity: .5; cursor: default; }
  .nhnav.soon:hover { background: transparent; color: var(--muted); }
  .nhmain { flex: 1; min-width: 0; padding: 30px 24px 80px; }
  @media (max-width: 720px) {
    .nhbody { flex-direction: column; }
    .nhside { width: auto; border-right: none; border-bottom: 1px solid var(--line); display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px; }
    .nhnav { margin-bottom: 0; white-space: nowrap; }
    .nhnav.active { box-shadow: inset 0 -3px 0 var(--accent); }
  }
  .empty { padding: 48px 24px; border: 1px dashed var(--line); border-radius: 14px; text-align: center; color: var(--muted); font-size: 14.5px; }

  /* ---- Character page (the home screen). Two columns: the desk (left) + the state rail (right).
     Everything starts empty except The Nation card, which reads the nation's live stats. ---- */
  .ch-wrap { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .ch-col { display: flex; flex-direction: column; gap: 14px; }
  .ch-main { flex: 1.5 1 460px; }
  .ch-rail { flex: 1 1 300px; }
  .ch-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 15px 17px; }
  .ch-hd { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 11px; }
  .ch-micro { font-size: 10px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; font-weight: 800; }
  .ch-link { font-size: 10px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; font-weight: 700; cursor: pointer; }
  .ch-link:hover { color: var(--accent); }
  .ch-empty { color: var(--muted); font-size: 13.5px; padding: 22px 6px; text-align: center; }
  /* Stat rows: label · five segments · value */
  .ch-row { display: flex; align-items: center; gap: 12px; padding: 5px 0; }
  .ch-row .ch-lbl { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ch-segs { display: flex; gap: 3px; flex: none; }
  .ch-seg { width: 16px; height: 7px; border-radius: 3px; background: color-mix(in srgb, var(--ink) 10%, transparent); }
  .ch-sub { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 11px; }
  .ch-subrow { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 3px 0; }
  .ch-subrow .k { color: var(--muted); }
  .ch-subrow .v { font-weight: 700; font-variant-numeric: tabular-nums; }

  /* Action buttons in the Actions card */
  .ch-actions { display: flex; flex-wrap: wrap; gap: 9px; }
  .ch-actbtn { font-size: 13px; font-weight: 700; border-radius: 10px; padding: 10px 15px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .ch-actbtn:hover { border-color: var(--accent); color: var(--accent); }

  /* Requires-Your-Attention notification rows (incoming meeting requests) */
  .ch-notif { border-top: 1px solid var(--line); padding: 12px 0 4px; }
  .ch-notif:first-of-type { border-top: none; }
  .ch-notif .txt { font-size: 13.5px; line-height: 1.45; }
  .ch-notif .txt b { font-weight: 800; }
  .ch-notif .txt i { color: var(--muted); font-style: italic; }
  .ch-notifbtns { display: flex; gap: 8px; margin-top: 9px; }
  .ch-mini { font-size: 12px; font-weight: 700; border-radius: 8px; padding: 6px 13px; cursor: pointer; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .ch-mini.ok { border-color: #3ecf8e88; color: #2ba46a; }
  .ch-mini.ok:hover { background: #3ecf8e18; }
  .ch-mini.no:hover { border-color: var(--err); color: var(--err); }
  .ch-count { font-size: 10px; font-weight: 800; color: var(--muted); }

  /* Modal (Request Meeting) */
  .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .modal { width: 100%; max-width: 460px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; max-height: 88vh; display: flex; flex-direction: column; }
  .modal h2 { margin: 0 0 4px; font-size: 18px; font-weight: 800; }
  .modal .msub { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  .plist { border: 1px solid var(--line); border-radius: 12px; overflow-y: auto; max-height: 40vh; }
  .prow { display: flex; align-items: center; gap: 11px; padding: 11px 13px; border-top: 1px solid var(--line); cursor: pointer; }
  .prow:first-child { border-top: none; }
  .prow:hover { background: var(--bg); }
  .prow.sel { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .prow .pav { width: 34px; height: 34px; border-radius: 17px; flex: none; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px; color: #fff; background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #000)); }
  .prow .pnm { font-weight: 700; font-size: 14px; }
  .prow .prl { color: var(--muted); font-size: 12px; }
  .modal label { display: block; font-size: 13px; font-weight: 700; margin: 15px 0 5px; }
  .modal input[type=text] { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font-size: 14px; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 9px; margin-top: 16px; }
  .mnote { font-size: 12.5px; margin-top: 10px; min-height: 16px; }
  .mnote.error { color: var(--err); }

  /* Conversations list + chat */
  .conv-empty { padding: 40px 24px; text-align: center; color: var(--muted); }
  .conv-card { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 13px 15px; margin-bottom: 10px; cursor: pointer; display: flex; align-items: center; gap: 12px; }
  .conv-card:hover { border-color: var(--accent); }
  .conv-card.conv-static { cursor: default; }
  .conv-card.conv-static:hover { border-color: var(--line); }
  .conv-card .pav { width: 38px; height: 38px; border-radius: 19px; flex: none; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; color: #0e0e16; background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #000)); }
  .conv-card .cnm { font-weight: 700; font-size: 14.5px; }
  .conv-card .crl { color: var(--muted); font-size: 12.5px; }
  /* Outbound pending request — awaiting the other player, with a Cancel Meeting option. */
  .conv-pending { border: 1px dashed var(--line2, var(--line)); border-radius: 12px; background: var(--surface); padding: 13px 15px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
  .conv-pending .cp-txt { flex: 1; min-width: 0; font-size: 13.5px; line-height: 1.45; color: var(--muted); }
  .conv-pending .cp-txt b { color: var(--ink); font-weight: 700; }
  .conv-pending .cp-txt i { font-style: italic; }
  .conv-pending .cp-cancel { flex: none; }
  .chat { display: flex; flex-direction: column; height: calc(100vh - 200px); min-height: 380px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
  .chat-hd { display: flex; align-items: center; gap: 12px; padding: 12px 15px; border-bottom: 1px solid var(--line); }
  .chat-back { font-size: 13px; font-weight: 700; cursor: pointer; color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; background: var(--bg); }
  .chat-back:hover { color: var(--accent); border-color: var(--accent); }
  .chat-title b { font-size: 14.5px; } .chat-title span { color: var(--muted); font-size: 12.5px; }
  .chat-scroll { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .bub { max-width: 75%; padding: 9px 13px; border-radius: 14px; font-size: 13.5px; line-height: 1.4; }
  .bub.me { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 5px; }
  .bub.them { align-self: flex-start; background: var(--bg); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
  .chat-foot { display: flex; gap: 9px; padding: 12px 14px; border-top: 1px solid var(--line); }
  .chat-foot input { flex: 1; padding: 10px 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font-size: 14px; }
  .chat-tools { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 14px 0; }
  .chat-tool { font-size: 12px; font-weight: 700; border-radius: 8px; padding: 6px 12px; cursor: pointer; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .chat-tool:hover { border-color: var(--accent); color: var(--accent); }
  .chat-tool.end:hover { border-color: var(--err); color: var(--err); }
  .chat-ended { text-align: center; color: var(--muted); font-size: 13px; padding: 13px; border-top: 1px solid var(--line); }
  /* Promise = attributed, gold-bordered note; system = centred neutral line */
  .bub.promise { align-self: stretch; max-width: 100%; background: rgba(232,181,74,.10); border: 1px solid #e8b54a66; color: var(--ink); border-radius: 12px; }
  .bub.promise .plabel { display: block; font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #b98a17; margin-bottom: 3px; }
  .sysline { align-self: center; text-align: center; color: var(--muted); font-size: 12px; padding: 4px 10px; }
  /* Narrative conversation player */
  /* Narrative conversation player — typographic registers: serif italic narration, serif speech with a
     speaker avatar + name, rounded accent player bubbles, numbered pill choices. */
  .nrplay { max-width: 620px; width: 100%; display: flex; flex-direction: column; max-height: 86vh; padding: 18px 20px; }
  .nrp-chip { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .nrp-scene { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 9.5px; font-weight: 700; letter-spacing: .12em; color: var(--muted); border: 1px solid var(--line); border-radius: 7px; padding: 4px 10px; text-transform: uppercase; }
  .nrp-exit { margin-left: auto; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 9.5px; letter-spacing: .1em; color: var(--muted); cursor: pointer; background: none; border: none; text-transform: uppercase; }
  .nrp-exit:hover { color: var(--ink); }
  .nrplay-scroll { overflow-y: auto; display: flex; flex-direction: column; padding: 2px; }
  .nrp-narr { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 15px; line-height: 1.7; color: var(--muted); margin: 0 0 18px; max-width: 92%; }
  .nrp-npc { display: flex; gap: 10px; margin: 0 0 18px; max-width: 94%; }
  .nrp-av { width: 28px; height: 28px; border-radius: 14px; flex: none; margin-top: 2px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 10.5px; color: #fff; background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 45%, #000)); }
  .nrp-name { font-weight: 800; font-size: 13px; color: var(--accent); margin-bottom: 1px; }
  .nrp-line { font-family: Georgia, 'Times New Roman', serif; font-size: 15.5px; line-height: 1.65; color: var(--ink); }
  .nrp-yourow { display: flex; justify-content: flex-end; margin: 0 0 18px; }
  .nrp-you { background: var(--accent); color: #fff; font-weight: 600; font-size: 14.5px; line-height: 1.5; border-radius: 16px 16px 4px 16px; padding: 9px 15px; max-width: 75%; }
  .nrp-prompt { font-weight: 800; font-size: 15px; margin: 4px 0 6px; }
  .nrplay-foot { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; border-top: 1px solid var(--line); padding-top: 14px; }
  .nrp-pill { display: flex; align-items: center; gap: 10px; border: 1.5px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 15px; cursor: pointer; font-family: Georgia, 'Times New Roman', serif; font-size: 14.5px; font-weight: 600; color: var(--ink); text-align: left; }
  .nrp-pill:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .nrp-pill:disabled { opacity: .5; cursor: default; }
  .nrp-pill.locked { opacity: .6; cursor: not-allowed; }
  .nrp-pill.locked:hover { border-color: var(--line); background: var(--bg); }
  .nrp-pill.locked .nrp-num { color: var(--muted); }
  .nrp-lock { margin-left: auto; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 8.5px; font-weight: 800; letter-spacing: .05em; color: var(--err); border: 1px solid color-mix(in srgb, var(--err) 40%, transparent); border-radius: 5px; padding: 2px 7px; white-space: nowrap; flex: none; }
  .nrp-num { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; font-weight: 700; color: var(--accent); flex: none; }
  .nrp-hint { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 8.5px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; text-align: center; margin-top: 10px; }
  .conv-tag { margin-left: auto; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; }
</style>
</head>
<body>
  <header class="nhtop">
    <div class="nhleft">
      <span id="nhflag"></span>
      <div class="nhleftcol">
        <div class="nhline1"><span class="nhname" id="nhname">…</span><span class="nhecon" id="nhecon"></span></div>
        <div class="nhdate" id="nhdate"></div>
      </div>
    </div>
    <div class="nhmid">Next Elections: <b>—</b></div>
    <div class="nhright">
      <span class="nhwho" id="nhwho"></span>
      <button class="btn btn-ghost nhtbtn" id="themeToggle" type="button">Theme</button>
      <button class="btn btn-ghost nhtbtn" id="logout" type="button">Log out</button>
    </div>
  </header>

  <div class="nhbody">
    <aside class="nhside">
      <span class="nhnav active" data-view="character" aria-current="page">Character</span>
      <span class="nhnav" data-view="conversations">Conversations</span>
      <span class="nhnav soon" title="Coming soon">Agenda</span>
      <span class="nhnav soon" title="Coming soon">Nation</span>
      <span class="nhnav soon" title="Coming soon">Legislature</span>
      <span class="nhnav soon" title="Coming soon">Conflict</span>
      <span class="nhnav soon" title="Coming soon">Wiki</span>
    </aside>
    <main class="nhmain">
      <div id="content"><div class="empty">Loading…</div></div>
    </main>
  </div>

  <script type="module">
    import { supabase, isConfigured, logout } from '/supabase.js';
    import { mountGameDate } from '/gamedate.js';   // live game date (one source)
    import { NV_STATS, partyOf, partyIdeology } from '/nationverse.js';   // stats + party/ideology (one source)
    import { esc, tickToDate } from '/util.js';

    document.getElementById('logout').addEventListener('click', logout);

    // Light/Dark toggle reuses theme.js (one source); the label shows the mode it will switch to.
    const themeBtn = document.getElementById('themeToggle');
    const syncThemeLabel = () => { themeBtn.textContent = (window.NHTheme && window.NHTheme.current === 'dark') ? '☀ Light' : '☾ Dark'; };
    syncThemeLabel();
    themeBtn.addEventListener('click', () => { if (window.NHTheme) window.NHTheme.toggle(); syncThemeLabel(); });

    const nhName = document.getElementById('nhname'), nhFlag = document.getElementById('nhflag');
    const nhEcon = document.getElementById('nhecon'), nhWho = document.getElementById('nhwho');
    const nhDate = document.getElementById('nhdate');
    const content = document.getElementById('content');
    const params = new URLSearchParams(location.search);
    const nationId = params.get('nation'), roleId = params.get('role');
    const SEP = ' <span class="nhsep">|</span> ';
    const NATION_SELECT = 'id, name, flag, stats, parties';   // one source for the nation columns this page reads

    // Economic Growth (0–20 stat) shown as a word rating on the top bar, in paired bands:
    // 1–2 Depression … 19–20 Booming. Band index = floor((v−1)/2), clamped to the 10 labels.
    const ECON_RATINGS = ['Depression', 'Recession', 'Stagnant', 'Weak', 'Stable',
      'Healthy', 'Prosperous', 'Strong Growth', 'Rapid Growth', 'Booming'];
    function economyRating(v) {
      const n = Number(v);
      if (v == null || !isFinite(n)) return '—';
      return ECON_RATINGS[Math.max(0, Math.min(9, Math.floor((n - 1) / 2)))];
    }

    // A nation stat (0–20) shown as five colour blocks. Fill = one block per 4 points (1–4 → 1 block …
    // 17–20 → 5), and the colour runs low→high red→green (per the design: low is red, high is green).
    const SEG_COLORS = ['#e2604f', '#e0864a', '#e8b54a', '#7cc46a', '#4ecb8d'];
    function statSegs(v) {
      const n = Number(v);
      const filled = (v == null || !isFinite(n)) ? 0 : Math.max(0, Math.min(5, Math.ceil(n / 4)));
      const color = filled > 0 ? SEG_COLORS[filled - 1] : '';
      let out = '';
      for (let i = 0; i < 5; i++) out += '<span class="ch-seg"' + (i < filled ? ' style="background:' + color + '"' : '') + '></span>';
      return out;
    }

    // ---- Shared player helpers (one source for how a character reads across the page) ----
    // A short role label for a personality: their office if any, else Politician / their fixed role.
    function roleLabelOf(p) {
      if (!p) return '';
      if (p.office && p.office !== 'No Specific Office') return p.office;
      const isPol = p.party || p.role === 'Politician' || /^Politician of Party \d+$/.test(p.role || '');
      return isPol ? 'Politician' : (p.role || '');
    }
    function initialsOf(name) {
      return (name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '?';
    }
    // The narrative's speaker = the first named speaker in its sequence, else its title (one source for
    // "Requires Your Attention" and the completed-conversation list).
    function speakerOf(n) {
      const spk = ((n && n.sequence) || []).find(s => s && s.speaker);
      return spk ? spk.speaker : ((n && n.name) || 'Someone');
    }
    // Resolve personalities by id → { id: {name, role, office, party} } (one source for every list/chat lookup).
    async function peopleById(ids) {
      const byId = {}, list = [...new Set(ids)].filter(Boolean);
      if (!list.length) return byId;
      const { data } = await supabase.from('nationverse_personalities').select('id, name, role, office, party').in('id', list);
      (data || []).forEach(p => { byId[p.id] = p; });
      return byId;
    }

    let me = null, nation = null;        // the signed-in character + their nation (set on load)
    let nrRuns = {};                     // runId → narrative content, for launched narratives in Requires Your Attention

    // Decision-option requirements (Personal Wealth / Influence / National Stat, at least / at most). The
    // player's current value is read from `me` + `nation`; the server enforces the same on resolve.
    const STAT_LABEL = {}; NV_STATS.forEach(([k, l]) => { STAT_LABEL[k] = l; });
    function reqActual(r) {
      if (r.type === 'influence') return (me && me.influence != null) ? me.influence : 0;
      if (r.type === 'stat') return ((nation && nation.stats) || {})[r.stat];
      return (me && me.wealth != null) ? me.wealth : 0;   // wealth
    }
    function reqMet(r) {
      const v = Number(reqActual(r)); if (!isFinite(v)) return false;
      const need = Number(r.value) || 0;
      return r.dir === 'lower' ? v <= need : v >= need;
    }
    function reqLabel(r) {
      const name = r.type === 'influence' ? 'INFLUENCE' : r.type === 'stat' ? (STAT_LABEL[r.stat] || r.stat || 'STAT').toUpperCase() : 'WEALTH';
      const have = reqActual(r), haveStr = (have == null || !isFinite(Number(have))) ? '—' : have;
      return name + ' ' + (r.dir === 'lower' ? '≤' : '') + (r.value != null ? r.value : '') + ' — YOU HAVE ' + haveStr;
    }
    let pollTimer = null;                // active chat poll, cleared on every view change
    const stopPolling = () => { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } };

    // ---- Modal + double-fire helpers (one source, shared by every dialog and DB write) ----
    let modalEl = null;                  // at most one modal open at a time
    function closeModal() { if (modalEl) { modalEl.remove(); modalEl = null; } }
    function openModal(html) {           // backdrop + body + click-outside-to-close
      closeModal();
      modalEl = document.createElement('div');
      modalEl.className = 'modal-back';
      modalEl.innerHTML = html;
      document.body.appendChild(modalEl);
      modalEl.addEventListener('click', e => { if (e.target === modalEl) closeModal(); });
      return modalEl;
    }
    // Disable a button while its async action runs — protects every DB write from a double-click
    // (money can't be sent twice, promises can't double-post, a request can't duplicate).
    async function guard(btn, fn) {
      if (!btn || btn.disabled) return;
      btn.disabled = true;
      try { await fn(); } finally { if (btn.isConnected) btn.disabled = false; }
    }
    let navBusy = false;                  // re-entrancy lock for actions that navigate/re-render

    // The Character home screen. Every panel starts empty except The Nation (live stats); the Actions card
    // holds the player's action buttons and Requires Your Attention shows incoming meeting requests.
    function renderCharacterPage() {
      const stats = (nation && nation.stats) || {};
      const rows = NV_STATS.map(([key, label]) => {
        const v = stats[key];
        return '<div class="ch-row"><span class="ch-lbl">' + esc(label) + '</span>' +
          '<span class="ch-segs">' + statSegs(v) + '</span></div>';
      }).join('');
      content.innerHTML =
        '<div class="ch-wrap">' +
          '<div class="ch-col ch-main">' +
            '<div class="ch-card"><div class="ch-hd"><span class="ch-micro">Requires Your Attention</span>' +
              '<span class="ch-count" id="attnCount"></span></div>' +
              '<div id="attnBox"><div class="ch-empty">Nothing needs your attention right now.</div></div></div>' +
            '<div class="ch-card"><div class="ch-hd"><span class="ch-micro">Actions</span></div>' +
              '<div class="ch-actions"><button class="ch-actbtn" id="actRequestMeeting" type="button">Request Meeting</button></div></div>' +
            '<div class="ch-card"><div class="ch-hd"><span class="ch-micro">The Papers</span></div>' +
              '<div class="ch-empty">No headlines yet.</div></div>' +
          '</div>' +
          '<div class="ch-col ch-rail">' +
            '<div class="ch-card"><div class="ch-hd"><span class="ch-micro">Current Objective</span></div>' +
              '<div class="ch-empty">No active objective.</div></div>' +
            '<div class="ch-card"><div class="ch-hd"><span class="ch-micro">The Nation</span>' +
              '<a class="ch-link" href="/nations/">Full Nation →</a></div>' +
              rows +
              '<div class="ch-sub">' +
                '<div class="ch-subrow"><span class="k">Coalition majority</span><span class="v">—</span></div>' +
                '<div class="ch-subrow"><span class="k">Personal popularity</span><span class="v">—</span></div>' +
              '</div></div>' +
            '<div class="ch-card"><div class="ch-hd"><span class="ch-micro">The Week Ahead</span></div>' +
              '<div class="ch-empty">Nothing scheduled.</div></div>' +
          '</div>' +
        '</div>';
      const rmBtn = document.getElementById('actRequestMeeting');
      if (rmBtn) rmBtn.addEventListener('click', openRequestMeeting);
      if (me) loadPendingRequests();   // incoming meeting requests → Requires Your Attention
    }

    // ---- Requires Your Attention: incoming meeting requests ----
    async function loadPendingRequests() {
      const box = document.getElementById('attnBox'), count = document.getElementById('attnCount');
      if (!box) return;
      try {
        // (a) incoming p2p meeting requests; (b) narratives launched to me (a World Master wants to speak).
        const [reqRes, runRes] = await Promise.all([
          supabase.from('nationverse_conversations')
            .select('id, from_personality, reason').eq('to_personality', me.id)
            .eq('kind', 'p2p').eq('status', 'pending').order('created_at', { ascending: true }),
          supabase.from('nationverse_narrative_runs')
            .select('id, narrative_id').eq('personality_id', me.id).eq('status', 'assigned').order('created_at', { ascending: true })
        ]);
        if (reqRes.error) throw reqRes.error;
        const reqs = reqRes.data || [], runs = (runRes && runRes.data) || [];
        if (!reqs.length && !runs.length) {
          box.innerHTML = '<div class="ch-empty">Nothing needs your attention right now.</div>';
          if (count) count.textContent = ''; return;
        }
        const byId = await peopleById(reqs.map(c => c.from_personality));
        const reqRows = reqs.map(c => {
          const p = byId[c.from_personality] || {};
          const role = roleLabelOf(p), name = p.name || 'Someone';
          return '<div class="ch-notif" data-id="' + esc(c.id) + '" data-t="req"><div class="txt">' +
            (role ? '<b>' + esc(role) + ' ' + esc(name) + '</b>' : '<b>' + esc(name) + '</b>') +
            ' is requesting to meet with you' +
            (c.reason ? ' regarding <i>' + esc(c.reason) + '</i>' : '') + '.</div>' +
            '<div class="ch-notifbtns"><button class="ch-mini ok" data-act="accept">Accept</button>' +
            '<button class="ch-mini no" data-act="decline">Decline</button></div></div>';
        }).join('');
        // Resolve narrative content + the speaker's role (if the speaker is a personality in this nation).
        nrRuns = {};
        let narrRows = '';
        if (runs.length) {
          const { data: narrs } = await supabase.from('nationverse_narratives').select('id, name, sequence, decision').in('id', runs.map(r => r.narrative_id));
          const nById = {}; (narrs || []).forEach(n => { nById[n.id] = n; });
          const roleByName = {};
          if (nation) {
            const { data: pp } = await supabase.from('nationverse_personalities').select('name, role, office, party').eq('nation_id', nation.id);
            (pp || []).forEach(p => { if (p.name) roleByName[p.name] = roleLabelOf(p); });
          }
          narrRows = runs.map(run => {
            const n = nById[run.narrative_id]; if (!n) return '';
            nrRuns[run.id] = n;
            const speaker = speakerOf(n);
            const role = roleByName[speaker];
            return '<div class="ch-notif" data-run="' + esc(run.id) + '" data-t="narr"><div class="txt"><b>' +
              esc(speaker) + (role ? ' (' + esc(role) + ')' : '') + '</b> wishes to speak to you.</div>' +
              '<div class="ch-notifbtns"><button class="ch-mini ok" data-act="enter">Enter Conversation</button></div></div>';
          }).join('');
        }
        box.innerHTML = reqRows + narrRows;
        const total = reqs.length + runs.length;
        if (count) count.textContent = total + ' item' + (total === 1 ? '' : 's');
        box.querySelectorAll('.ch-notif[data-t=req]').forEach(row => {
          const id = row.dataset.id;
          row.querySelector('[data-act=accept]').addEventListener('click', () => respondMeeting(id, true));
          row.querySelector('[data-act=decline]').addEventListener('click', () => respondMeeting(id, false));
        });
        box.querySelectorAll('.ch-notif[data-t=narr] [data-act=enter]').forEach(btn =>
          btn.addEventListener('click', () => enterConversation(btn.closest('.ch-notif').dataset.run)));
      } catch (e) { box.innerHTML = '<div class="ch-empty">Couldn’t load your requests.</div>'; }
    }

    async function respondMeeting(convId, accept) {
      if (navBusy) return; navBusy = true;
      try {
        const { error } = await supabase.rpc('nationverse_respond_meeting', { p_conv: convId, p_accept: accept });
        if (error) throw error;
        if (accept) openChat(convId);   // accepted → jump into the chat (openChat sets the nav)
        else loadPendingRequests();
      } catch (e) { alert('Could not respond to the request. Try again shortly.'); }
      finally { navBusy = false; }
    }

    // ---- Narrative conversation player (first runtime slice: plays the authored sequence, then the
    // decision. Decision effects are applied server-side later; here it just records the run as done). ----
    function enterConversation(runId) {
      const n = nrRuns[runId]; if (!n) return;
      const steps = (n.sequence || []).filter(s => s && (s.text || s.speaker || (s.replies && s.replies.length)));
      const dec = n.decision || {};
      let i = 0;
      const gd = (document.getElementById('gamedate') || {}).textContent || '';
      const scene = ((nation && nation.name) ? nation.name : 'Nationverse') + (gd ? ' · ' + gd : '');
      openModal('<div class="modal nrplay">' +
        '<div class="nrp-chip"><span class="nrp-scene">' + esc(scene) + '</span><button class="nrp-exit" id="nrpExit" type="button">Exit →</button></div>' +
        '<div class="nrplay-scroll" id="nrpScroll"></div>' +
        '<div class="nrplay-foot" id="nrpFoot"></div>' +
        '<div class="nrp-hint">Your reply becomes your bubble</div></div>');
      document.getElementById('nrpExit').addEventListener('click', closeModal);   // leave without resolving; stays in your attention
      const scroll = document.getElementById('nrpScroll'), foot = document.getElementById('nrpFoot');
      const append = html => { scroll.insertAdjacentHTML('beforeend', html); scroll.scrollTop = scroll.scrollHeight; };
      const npcHTML = (speaker, text) => '<div class="nrp-npc"><span class="nrp-av">' + esc(initialsOf(speaker)) + '</span>' +
        '<div><div class="nrp-name">' + esc(speaker || 'Speaker') + '</div><div class="nrp-line">“' + esc(text || '') + '”</div></div></div>';
      const lineHTML = s => s.kind === 'speech' ? npcHTML(s.speaker, s.text) : '<p class="nrp-narr">' + esc(s.text || '') + '</p>';
      const youHTML = t => '<div class="nrp-yourow"><div class="nrp-you">' + esc(t) + '</div></div>';
      function pill(num, text, onClick) {
        const b = document.createElement('button');
        b.className = 'nrp-pill'; b.type = 'button';
        b.innerHTML = '<span class="nrp-num">' + esc(num) + '</span><span>' + esc(text) + '</span>';
        b.addEventListener('click', onClick);
        return b;
      }
      function showStep() {
        if (i >= steps.length) return showDecision();
        const s = steps[i];
        if (s.text || s.speaker) append(lineHTML(s));
        foot.innerHTML = '';
        const replies = s.replies || [];
        if (replies.length) {
          replies.forEach((r, idx) => {
            const label = (typeof r === 'string' ? r : (r && r.text)) || '…';
            const resp = (r && typeof r === 'object') ? r.response : '';
            foot.appendChild(pill(idx + 1, label, () => {
              foot.querySelectorAll('button').forEach(x => x.disabled = true);
              append(youHTML(label));
              if (resp) append(s.speaker ? npcHTML(s.speaker, resp) : '<p class="nrp-narr">“' + esc(resp) + '”</p>');
              i++; showStep();
            }));
          });
        } else {
          foot.appendChild(pill('▸', 'Continue', () => { i++; showStep(); }));
        }
      }
      function showDecision() {
        if (dec.prompt) append('<div class="nrp-prompt">' + esc(dec.prompt) + '</div>');
        foot.innerHTML = '';
        // Keep each option's ORIGINAL index so the server applies the right option's effects.
        const withLabels = (dec.options || []).map((o, idx) => ({ o, idx })).filter(x => x.o && x.o.label);
        if (!withLabels.length) { foot.appendChild(pill('▸', 'End', () => { finish(null, null); })); return; }
        withLabels.forEach(({ o, idx }, n) => {
          const unmet = (o.requires || []).find(r => !reqMet(r));
          if (unmet) {   // locked: shown greyed with the reason, not selectable
            const b = document.createElement('button');
            b.className = 'nrp-pill locked'; b.type = 'button'; b.disabled = true;
            b.innerHTML = '<span class="nrp-num">' + (n + 1) + '</span><span>' + esc(o.label) + '</span>' +
              '<span class="nrp-lock">⊘ ' + esc(reqLabel(unmet)) + '</span>';
            foot.appendChild(b);
          } else {
            foot.appendChild(pill(n + 1, o.label, () => { foot.querySelectorAll('button').forEach(x => x.disabled = true); finish(idx, o.label); }));
          }
        });
      }
      async function finish(optionIndex, choiceLabel) {
        if (choiceLabel) append('<div class="nrp-you">' + esc(choiceLabel) + '</div>');
        try { await supabase.rpc('nationverse_resolve_run', { p_run: runId, p_option: optionIndex }); } catch (e) { /* close gracefully either way */ }
        closeModal();
        // Reflect any decision stat changes: re-fetch this nation, then re-render (also reloads attention).
        try {
          if (nation) {
            const { data } = await supabase.from('nationverse_nations').select(NATION_SELECT).eq('id', nation.id).maybeSingle();
            if (data) nation = data;
          }
        } catch (e) { /* keep the last-known nation on a transient error */ }
        showView('character');
      }
      showStep();
    }

    // ---- Request Meeting modal ----
    async function openRequestMeeting() {
      if (!me) return;
      openModal(
        '<div class="modal"><h2>Request a Meeting</h2>' +
        '<p class="msub">Choose who to meet with and why.</p>' +
        '<div class="plist" id="rmPlist"><div class="ch-empty">Loading players…</div></div>' +
        '<label>Regarding:</label><input type="text" id="rmReason" maxlength="64" autocomplete="off" placeholder="e.g. the banking affair">' +
        '<div class="mnote" id="rmNote"></div>' +
        '<div class="modal-foot"><button class="ch-mini" id="rmCancel">Cancel</button>' +
        '<button class="ch-actbtn" id="rmSubmit">Submit</button></div></div>');
      document.getElementById('rmCancel').addEventListener('click', closeModal);

      let selected = null;
      const list = document.getElementById('rmPlist'), note = document.getElementById('rmNote');
      try {
        // Other players = personalities claimed by someone, excluding me.
        const { data, error } = await supabase.from('nationverse_personalities')
          .select('id, name, role, office, party').not('claimed_by', 'is', null).order('name', { ascending: true });
        if (error) throw error;
        const others = (data || []).filter(p => p.id !== me.id);
        if (!others.length) { list.innerHTML = '<div class="ch-empty">No other players to meet with yet.</div>'; return; }
        list.innerHTML = others.map(p => {
          const role = roleLabelOf(p);
          return '<div class="prow" data-id="' + esc(p.id) + '"><span class="pav">' + esc(initialsOf(p.name)) + '</span>' +
            '<div><div class="pnm">' + esc(p.name || 'Unnamed') + '</div>' +
            (role ? '<div class="prl">' + esc(role) + '</div>' : '') + '</div></div>';
        }).join('');
        list.querySelectorAll('.prow').forEach(row => row.addEventListener('click', () => {
          selected = row.dataset.id;
          list.querySelectorAll('.prow').forEach(r => r.classList.toggle('sel', r === row));
        }));
      } catch (e) { list.innerHTML = '<div class="ch-empty">Couldn’t load players.</div>'; }

      const submitBtn = document.getElementById('rmSubmit');
      submitBtn.addEventListener('click', () => guard(submitBtn, async () => {
        if (!selected) { note.textContent = 'Pick who you want to meet.'; note.className = 'mnote error'; return; }
        const reason = document.getElementById('rmReason').value.trim();
        note.textContent = 'Sending…'; note.className = 'mnote';
        try {
          const { error } = await supabase.rpc('nationverse_request_meeting', { p_to: selected, p_reason: reason });
          if (error) throw error;
          closeModal();
        } catch (e) { note.textContent = 'Could not send the request. Try again.'; note.className = 'mnote error'; }
      }));
    }

    // ---- Conversations view (list of accepted chats) ----
    async function renderConversationsView() {
      content.innerHTML = '<div class="ch-card"><div class="ch-hd"><span class="ch-micro">Conversations</span></div>' +
        '<div id="convBox"><div class="conv-empty">Loading…</div></div></div>';
      const box = document.getElementById('convBox');
      if (!me) { box.innerHTML = '<div class="conv-empty">Sign in to see your conversations.</div>'; return; }
      try {
        // My still-pending outbound requests (top) + accepted/ended p2p conversations + completed narrative
        // events (all most recent first).
        const [pendRes, convRes, doneRes] = await Promise.all([
          supabase.from('nationverse_conversations')
            .select('id, to_personality, reason, created_tick').eq('from_personality', me.id)
            .eq('kind', 'p2p').eq('status', 'pending').order('id', { ascending: false }),
          supabase.from('nationverse_conversations')
            .select('id, from_personality, to_personality, reason, status')
            .in('status', ['accepted', 'ended']).order('last_message_at', { ascending: false, nullsFirst: false }),
          supabase.from('nationverse_narrative_runs')
            .select('id, narrative_id, created_tick').eq('personality_id', me.id)
            .eq('status', 'done').order('created_tick', { ascending: false })
        ]);
        if (convRes.error) throw convRes.error;
        const pend = (pendRes && pendRes.data) || [], convs = convRes.data || [], done = (doneRes && doneRes.data) || [];
        if (!pend.length && !convs.length && !done.length) { box.innerHTML = '<div class="conv-empty">No conversations yet. Accept a meeting request or send one from your Character page.</div>'; return; }
        const byId = await peopleById([
          ...pend.map(c => c.to_personality),
          ...convs.map(c => c.from_personality === me.id ? c.to_personality : c.from_personality)
        ]);
        // Outbound pending requests — awaiting the other player, with a Cancel Meeting option.
        const pendRows = pend.map(c => {
          const p = byId[c.to_personality] || {}, role = roleLabelOf(p), name = p.name || 'a player';
          return '<div class="conv-pending" data-id="' + esc(c.id) + '"><div class="cp-txt">' +
            'Meeting requested with <b>' + (role ? esc(role) + ' ' : '') + esc(name) + '</b>' +
            (c.reason ? ' regarding: <i>' + esc(c.reason) + '</i>' : '') + '.' +
            (c.created_tick != null ? ' Meeting requested in ' + esc(tickToDate(c.created_tick)) + '.' : '') +
            '</div><button class="ch-mini no cp-cancel" type="button">Cancel Meeting</button></div>';
        }).join('');
        const convRows = convs.map(c => {
          const otherId = c.from_personality === me.id ? c.to_personality : c.from_personality;
          const p = byId[otherId] || {}, role = roleLabelOf(p);
          return '<div class="conv-card" data-id="' + esc(c.id) + '"><span class="pav">' + esc(initialsOf(p.name)) + '</span>' +
            '<div style="flex:1;min-width:0"><div class="cnm">' + esc(p.name || 'Unknown') + '</div>' +
            '<div class="crl">' + (role ? esc(role) : '') + (c.reason ? ' · ' + esc(c.reason) : '') + '</div></div>' +
            (c.status === 'ended' ? '<span class="conv-tag">Ended</span>' : '') + '</div>';
        }).join('');
        // Completed narrative events — "Conversation with {speaker}, on {Month}, {Year}." view-only.
        let doneRows = '';
        if (done.length) {
          const { data: narrs } = await supabase.from('nationverse_narratives').select('id, name, sequence').in('id', done.map(r => r.narrative_id));
          const nById = {}; (narrs || []).forEach(n => { nById[n.id] = n; });
          doneRows = done.map(run => {
            const n = nById[run.narrative_id]; if (!n) return '';
            const speaker = speakerOf(n), when = run.created_tick != null ? tickToDate(run.created_tick) : '';
            return '<div class="conv-card conv-static"><span class="pav">' + esc(initialsOf(speaker)) + '</span>' +
              '<div style="flex:1;min-width:0"><div class="cnm">Conversation with ' + esc(speaker) + '</div>' +
              '<div class="crl">' + (when ? 'on ' + esc(when) : '') + '</div></div>' +
              '<span class="conv-tag">Completed</span></div>';
          }).join('');
        }
        box.innerHTML = pendRows + convRows + doneRows;
        box.querySelectorAll('.conv-card:not(.conv-static)').forEach(card => card.addEventListener('click', () => openChat(card.dataset.id)));
        box.querySelectorAll('.conv-pending .cp-cancel').forEach(btn =>
          btn.addEventListener('click', () => guard(btn, async () => {
            try {
              const { error } = await supabase.rpc('nationverse_cancel_meeting', { p_conv: btn.closest('.conv-pending').dataset.id });
              if (error) throw error;
              renderConversationsView();
            } catch (e) { alert('Could not cancel the meeting.'); }
          })));
      } catch (e) { box.innerHTML = '<div class="conv-empty">Couldn’t load conversations.</div>'; }
    }

    // ---- Chat (a single conversation). Accepted → live (input + actions); ended → read-only. ----
    async function openChat(convId) {
      stopPolling();
      setActiveNav('conversations');
      content.innerHTML = '<div class="conv-empty">Loading…</div>';
      let conv = null, other = {};
      try {
        const { data, error } = await supabase.from('nationverse_conversations')
          .select('id, from_personality, to_personality, reason, status').eq('id', convId).maybeSingle();
        if (error) throw error;
        conv = data;
        if (!conv || (conv.status !== 'accepted' && conv.status !== 'ended')) { content.innerHTML = '<div class="conv-empty">That conversation isn’t available.</div>'; return; }
        const otherId = conv.from_personality === me.id ? conv.to_personality : conv.from_personality;
        other = (await peopleById([otherId]))[otherId] || {};
      } catch (e) { content.innerHTML = '<div class="conv-empty">Couldn’t open that conversation.</div>'; return; }
      const role = roleLabelOf(other), live = conv.status === 'accepted';
      const foot = live
        ? '<div class="chat-tools"><button class="chat-tool" id="tPromise" type="button">Promise</button>' +
            '<button class="chat-tool" id="tExchange" type="button">Exchange Wealth</button>' +
            '<button class="chat-tool end" id="tEnd" type="button">End Meeting</button></div>' +
          '<div class="chat-foot"><input type="text" id="chatInput" placeholder="Write a message…" maxlength="2000" autocomplete="off">' +
            '<button class="ch-actbtn" id="chatSend">Send</button></div>'
        : '<div class="chat-ended">This meeting has ended. You can view it, but not continue it.</div>';
      content.innerHTML =
        '<div class="chat"><div class="chat-hd"><button class="chat-back" id="chatBack">← Conversations</button>' +
          '<div class="chat-title"><b>' + esc(other.name || 'Unknown') + '</b>' + (role ? ' <span>· ' + esc(role) + '</span>' : '') + '</div></div>' +
          '<div class="chat-scroll" id="chatScroll"><div class="conv-empty">Loading messages…</div></div>' + foot + '</div>';
      document.getElementById('chatBack').addEventListener('click', () => showView('conversations'));
      const scroll = document.getElementById('chatScroll');
      if (live) {
        const input = document.getElementById('chatInput');
        const send = async () => {
          const body = input.value.trim(); if (!body) return;
          input.value = '';
          try {
            const { error } = await supabase.rpc('nationverse_send_message', { p_conv: convId, p_body: body });
            if (error) throw error;
            await loadMessages(convId, scroll, true);
          } catch (e) { input.value = body; alert('Could not send. Try again.'); }
        };
        document.getElementById('chatSend').addEventListener('click', send);
        input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); send(); } });
        document.getElementById('tPromise').addEventListener('click', () => openPromise(convId, scroll));
        document.getElementById('tExchange').addEventListener('click', () => openExchange(convId, other, scroll));
        const endBtn = document.getElementById('tEnd');
        endBtn.addEventListener('click', () => {
          if (!window.confirm('End this meeting? It can’t be continued afterwards.')) return;
          guard(endBtn, async () => {
            try { const { error } = await supabase.rpc('nationverse_end_meeting', { p_conv: convId }); if (error) throw error; openChat(convId); }
            catch (e) { alert('Could not end the meeting.'); }
          });
        });
        pollTimer = setInterval(() => loadMessages(convId, scroll, false), 4000);   // live-ish refresh
      }
      await loadMessages(convId, scroll, true);
    }

    async function loadMessages(convId, scroll, forceScroll) {
      try {
        const { data, error } = await supabase.from('nationverse_messages')
          .select('id, sender_personality, body, kind, created_at').eq('conversation_id', convId).order('created_at', { ascending: true });
        if (error) throw error;
        const msgs = data || [];
        const atBottom = scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 60;
        scroll.innerHTML = msgs.length ? msgs.map(m => {
          if (m.kind === 'system') return '<div class="sysline">' + esc(m.body) + '</div>';
          if (m.kind === 'promise') return '<div class="bub promise ' + (m.sender_personality === me.id ? 'me' : 'them') + '">' +
            '<span class="plabel">🤝 Promise' + (m.sender_personality === me.id ? ' — you' : '') + '</span>' + esc(m.body) + '</div>';
          return '<div class="bub ' + (m.sender_personality === me.id ? 'me' : 'them') + '">' + esc(m.body) + '</div>';
        }).join('') : '<div class="conv-empty">No messages yet — say hello.</div>';
        if (forceScroll || atBottom) scroll.scrollTop = scroll.scrollHeight;
      } catch (e) { /* keep the last render on a transient error */ }
    }

    // ---- Promise modal ----
    function openPromise(convId, scroll) {
      openModal('<div class="modal"><h2>Make a Promise</h2>' +
        '<p class="msub">A recorded pledge both of you will see in the transcript.</p>' +
        '<label>I promise…</label><input type="text" id="prText" maxlength="240" autocomplete="off" placeholder="e.g. to vote for your bill next week">' +
        '<div class="mnote" id="prNote"></div>' +
        '<div class="modal-foot"><button class="ch-mini" id="prCancel">Cancel</button>' +
        '<button class="ch-actbtn" id="prSubmit">Make Promise</button></div></div>');
      document.getElementById('prCancel').addEventListener('click', closeModal);
      const submitBtn = document.getElementById('prSubmit');
      submitBtn.addEventListener('click', () => guard(submitBtn, async () => {
        const text = document.getElementById('prText').value.trim();
        const note = document.getElementById('prNote');
        if (!text) { note.textContent = 'Write what you promise.'; note.className = 'mnote error'; return; }
        note.textContent = 'Recording…'; note.className = 'mnote';
        try {
          const { error } = await supabase.rpc('nationverse_make_promise', { p_conv: convId, p_text: text });
          if (error) throw error;
          note.textContent = 'Promise made.'; note.className = 'mnote';
          setTimeout(() => { closeModal(); loadMessages(convId, scroll, true); }, 650);
        } catch (e) { note.textContent = 'Could not record the promise.'; note.className = 'mnote error'; }
      }));
    }

    // ---- Exchange Wealth modal (money or corporation shares) ----
    async function openExchange(convId, other, scroll) {
      openModal('<div class="modal"><h2>Exchange Wealth</h2>' +
        '<p class="msub">Send money or a stake in a corporation to ' + esc(other.name || 'the other player') + '.</p>' +
        '<div class="ch-actions" style="margin-bottom:4px"><button class="chat-tool" id="exMoneyTab" type="button">Money</button>' +
          '<button class="chat-tool" id="exSharesTab" type="button">Corporation shares</button></div>' +
        '<div id="exBody"></div>' +
        '<div class="mnote" id="exNote"></div>' +
        '<div class="modal-foot"><button class="ch-mini" id="exCancel">Cancel</button>' +
        '<button class="ch-actbtn" id="exSubmit">Send</button></div></div>');
      document.getElementById('exCancel').addEventListener('click', closeModal);
      const body = document.getElementById('exBody'), note = document.getElementById('exNote');
      let mode = 'money', myCorps = [];

      // Corporations where I hold a stake (for the shares mode) — read from the public corp cap tables.
      try {
        const { data } = await supabase.from('nationverse_corporations').select('id, name, ownership');
        myCorps = (data || []).map(c => {
          const st = (c.ownership || []).find(o => o.type === 'personality' && o.id === me.id);
          return st ? { id: c.id, name: c.name, share: Number(st.share) || 0 } : null;
        }).filter(Boolean).filter(c => c.share > 0);
      } catch (e) { myCorps = []; }

      const renderMoney = () => {
        const wealth = (me && me.wealth != null) ? me.wealth : 0;
        body.innerHTML = '<label>Amount <span class="msub" style="margin:0">(you have ' + esc(wealth) + ')</span></label>' +
          '<input type="number" id="exAmt" min="1" step="1" max="' + esc(wealth) + '" placeholder="0">';
      };
      const renderShares = () => {
        if (!myCorps.length) { body.innerHTML = '<p class="msub">You don’t hold shares in any corporation.</p>'; return; }
        body.innerHTML = '<label>Corporation</label><select id="exCorp" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:14px">' +
          myCorps.map(c => '<option value="' + esc(c.id) + '">' + esc(c.name) + ' (you hold ' + esc(c.share) + '%)</option>').join('') + '</select>' +
          '<label>Share % to transfer</label><input type="number" id="exAmt" min="0.1" step="0.1" placeholder="0">';
      };
      const setTab = m => {
        mode = m;
        document.getElementById('exMoneyTab').classList.toggle('sel', m === 'money');
        document.getElementById('exSharesTab').classList.toggle('sel', m === 'shares');
        if (m === 'money') renderMoney(); else renderShares();
      };
      document.getElementById('exMoneyTab').addEventListener('click', () => setTab('money'));
      document.getElementById('exSharesTab').addEventListener('click', () => setTab('shares'));
      setTab('money');

      const submitBtn = document.getElementById('exSubmit');
      submitBtn.addEventListener('click', () => guard(submitBtn, async () => {
        const amt = Number((document.getElementById('exAmt') || {}).value);
        if (!isFinite(amt) || amt <= 0) { note.textContent = 'Enter an amount.'; note.className = 'mnote error'; return; }
        const corp = mode === 'shares' ? (document.getElementById('exCorp') || {}).value : null;
        if (mode === 'shares' && !corp) { note.textContent = 'Pick a corporation.'; note.className = 'mnote error'; return; }
        note.textContent = 'Sending…'; note.className = 'mnote';
        try {
          const { error } = await supabase.rpc('nationverse_exchange_wealth', { p_conv: convId, p_kind: mode, p_amount: amt, p_corp: corp });
          if (error) throw error;
          closeModal(); loadMessages(convId, scroll, true);
        } catch (e) {
          const msg = (e && e.message || '').includes('insufficient') ? 'You don’t have that much to send.' : 'Could not complete the exchange.';
          note.textContent = msg; note.className = 'mnote error';
        }
      }));
    }

    // ---- View switching ----
    function setActiveNav(view) {
      document.querySelectorAll('.nhnav[data-view]').forEach(el =>
        el.classList.toggle('active', el.dataset.view === view));
    }
    function showView(view) {
      stopPolling();
      setActiveNav(view);
      if (view === 'conversations') renderConversationsView();
      else renderCharacterPage();
    }
    document.querySelectorAll('.nhnav[data-view]').forEach(el =>
      el.addEventListener('click', () => showView(el.dataset.view)));

    // Countdown to the next game tick. The tick runs on pg_cron '0 */6 * * *' (00/06/12/18 UTC — see
    // schema/60), so counting to the next 6-hour UTC boundary is anchored to the actual schedule.
    function startTickCountdown(el) {
      const TICK_H = 6, pad = n => String(n).padStart(2, '0');
      const render = () => {
        const now = new Date();
        const nb = (Math.floor(now.getUTCHours() / TICK_H) + 1) * TICK_H;
        const next = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), nb, 0, 0, 0);
        const s = Math.max(0, Math.floor((next - now.getTime()) / 1000));
        el.textContent = pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60);
      };
      render();
      setInterval(render, 1000);
    }

    (async () => {
      if (!isConfigured) { content.innerHTML = '<div class="empty">Nation data isn’t connected yet.</div>'; return; }
      try {
        // AUTHORITATIVE: a player inhabits ONLY the character they have claimed — derived from claimed_by
        // (the signed-in user), never from the URL, so nobody can inhabit a role by editing the address.
        let p = null, n = null, legacy = false;
        const { data: u } = await supabase.auth.getUser();
        const myId = u && u.user ? u.user.id : null;
        if (myId) {
          const meRes = await supabase.from('nationverse_personalities').select('*').eq('claimed_by', myId).maybeSingle();
          if (meRes.error) legacy = true;   // claimed_by column not present yet (migrations 279+ pending)
          else p = meRes.data;              // this user's claimed character (or null)
        } else { legacy = true; }           // not signed in → can't verify ownership; fall back to URL

        if (!legacy) {
          if (!p) { window.location.replace('/nations/'); return; }   // no character yet → go choose one
          const natRes = await supabase.from('nationverse_nations').select(NATION_SELECT).eq('id', p.nation_id).maybeSingle();
          if (natRes.error) throw natRes.error;
          n = natRes.data;
        } else {
          if (!nationId) { content.innerHTML = '<div class="empty">No nation selected. <a href="/nations/">Choose one.</a></div>'; return; }
          const [natRes, persRes] = await Promise.all([
            supabase.from('nationverse_nations').select(NATION_SELECT).eq('id', nationId).maybeSingle(),
            roleId ? supabase.from('nationverse_personalities').select('*').eq('id', roleId).maybeSingle() : Promise.resolve({ data: null })
          ]);
          if (natRes.error) throw natRes.error;
          n = natRes.data; p = (persRes && persRes.data) ? persRes.data : null;
        }
        if (!n) { content.innerHTML = '<div class="empty">That nation no longer exists. <a href="/nations/">Choose another.</a></div>'; return; }

        // Top bar left: flag + name + economy readouts (economy growth, budget from the nation's stats;
        // personal wealth from the character).
        nhName.textContent = n.name || 'Unknown';
        nhFlag.innerHTML = n.flag
          ? '<img class="nhflag" alt="Flag" src="' + esc(n.flag) + '">'
          : '<span class="nhflag ph">' + esc((n.name || '?').slice(0, 3)) + '</span>';

        const stats = n.stats || {};
        const economy = economyRating(stats.economic_growth);
        const budget = stats.budget != null ? stats.budget : '—';
        const wealth = (p && p.wealth != null) ? p.wealth : 0;
        nhEcon.innerHTML = SEP + 'Economy: <b>' + esc(economy) + '</b>' + SEP + 'Budget: <b>' + esc(budget) + '</b>' + SEP + 'Personal Wealth: <b>' + esc(wealth) + '</b>';

        // Top bar right: character name | role | party | ideology (party + ideology resolved from the
        // nation's party list; legacy "Politician of Party N" records resolve by slot too).
        if (p) {
          const parties = n.parties || [];
          const isPol = p.party || p.role === 'Politician' || /^Politician of Party \d+$/.test(p.role || '');
          const roleText = (p.office && p.office !== 'No Specific Office') ? p.office : (isPol ? 'Politician' : (p.role || ''));
          const partyText = partyOf(p, parties) || '', ideoText = partyIdeology(p, parties);
          nhWho.innerHTML = '<b>' + esc(p.name || 'Unnamed') + '</b>' +
            (roleText ? SEP + esc(roleText) : '') + (partyText ? SEP + esc(partyText) : '') +
            (ideoText ? SEP + esc(ideoText) : '');
        }

        nhDate.innerHTML = 'Current Date: <b id="gamedate">…</b>' + SEP + 'Next tick: <b id="nhtick">…</b>';
        mountGameDate(document.getElementById('gamedate'));
        startTickCountdown(document.getElementById('nhtick'));

        // Expose the signed-in character + nation to the views. Only a verified (non-legacy) claim gives a
        // real `me` — the conversation feature needs the authoritative claimed personality.
        nation = n;
        me = (!legacy && p) ? p : null;
        showView('character');   // Character home screen (Nation stats live; requests + actions wired)
      } catch (e) { content.innerHTML = '<div class="empty">Couldn’t load your nation. Try again shortly.</div>'; }
    })();
  </script>
</body>
</html>
