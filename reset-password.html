<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nationhood | Set New Password</title>
        <link rel="stylesheet" href="css/reset-password.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="reset-card">
    <!-- Loading state while verifying token -->
    <div id="loading-state" class="loading-state">
        <div class="spinner"></div>
        <div class="loading-text">Verifying reset link...</div>
    </div>

    <!-- Error state if token is invalid -->
    <div id="error-state" style="display:none;" class="error-state">
        <div class="error-icon">⚠️</div>
        <div class="error-title">Invalid or Expired Link</div>
        <div class="error-desc">This reset link is no longer valid. Please request a new one.</div>
        <div class="back-link" style="margin-top:20px;">
            <a href="forgot-password.html">Request New Reset Link</a>
        </div>
    </div>

    <!-- Password form (shown after token verified) -->
    <div id="form-state" style="display:none;">
        <h2>Set New Password</h2>
        <div class="subtitle">Enter your new password below.</div>

        <form id="reset-form">
            <div class="input-group">
                <label>New Password</label>
                <input type="password" id="password" minlength="6" required>
                <div class="password-requirements">Minimum 6 characters</div>
            </div>
            <div class="input-group">
                <label>Confirm New Password</label>
                <input type="password" id="password-confirm" minlength="6" required>
            </div>
            <button type="submit" class="btn-reset" id="submit-btn">UPDATE PASSWORD</button>
            <div id="error-message" class="error"></div>
        </form>

        <div class="back-link">
            <a href="login.html">← Back to Login</a>
        </div>
    </div>
</div>
<script type="module">
const { createClient } = supabase;
const supabaseUrl = 'https://pbumjalxclmegzckhqqr.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBidW1qYWx4Y2xtZWd6Y2tocXFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3ODk0NTUsImV4cCI6MjA4NTM2NTQ1NX0.ykjUqdJbwF3yliond1Vz2lcNQZCWA-5SnviruXm4ypI';
    const _supabase = createClient(supabaseUrl, supabaseKey);

    let sessionReady = false;

    // Supabase sends the user here with a hash fragment containing the session.
    // The client library automatically picks up the token from the URL hash.
    // We listen for the PASSWORD_RECOVERY event to know the token is valid.

    _supabase.auth.onAuthStateChange(async (event, session) => {
        if (event === 'PASSWORD_RECOVERY') {
            sessionReady = true;
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('form-state').style.display = 'block';
        }
    });

    // Timeout: if no recovery event after 4 seconds, token is bad
    setTimeout(() => {
        if (!sessionReady) {
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('error-state').style.display = 'block';
        }
    }, 4000);

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const submitBtn = document.getElementById('submit-btn');
        const errorMsg = document.getElementById('error-message');
        errorMsg.textContent = '';

        const password = document.getElementById('password').value;
        const confirm = document.getElementById('password-confirm').value;

        if (password !== confirm) {
            errorMsg.textContent = 'Passwords do not match.';
            return;
        }

        if (password.length < 6) {
            errorMsg.textContent = 'Password must be at least 6 characters.';
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'UPDATING...';

        try {
            const { error } = await _supabase.auth.updateUser({ password });

            if (error) throw error;

            // Sign out so they log in fresh with new password
            await _supabase.auth.signOut();

            // Redirect to login with success message
            window.location.href = 'login.html?reset=success';
        } catch (error) {
            console.error('Password update error:', error);
            errorMsg.textContent = error.message || 'Failed to update password. Please try again.';
            submitBtn.disabled = false;
            submitBtn.textContent = 'UPDATE PASSWORD';
        }
    });
</script>
</body>
</html>
