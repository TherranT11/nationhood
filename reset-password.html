<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nationhood | Set New Password</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://pbumjalxclmegzckhqqr.supabase.co" crossorigin>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; padding: 20px; }
        .reset-card { background: #1e1e1e; padding: 40px; border-radius: 8px; border-top: 4px solid #ffcc00; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #ffcc00; margin-top: 0; }
        .subtitle { color: #888; font-size: 0.85rem; margin-bottom: 24px; line-height: 1.5; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #888; }
        input { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; }
        .btn-reset { width: 100%; padding: 15px; background: #ffcc00; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; transition: 0.2s; color: #000; }
        .btn-reset:hover { background: #e6b800; }
        .btn-reset:disabled { background: #666; cursor: not-allowed; }
        .back-link { text-align: center; margin-top: 15px; font-size: 0.8rem; }
        .back-link a { color: #ffcc00; text-decoration: none; }
        .error { color: #ff4444; font-size: 0.9rem; margin-top: 10px; text-align: center; }
        .password-requirements { font-size: 0.8rem; color: #666; margin-top: 6px; }
        .loading-state { text-align: center; padding: 40px 0; }
        .loading-state .spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid #333; border-top-color: #ffcc00; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-state .loading-text { color: #888; margin-top: 12px; font-size: 0.9rem; }
        .error-state { text-align: center; padding: 20px 0; }
        .error-state .error-icon { font-size: 2rem; margin-bottom: 12px; }
        .error-state .error-title { color: #ff4444; font-weight: bold; margin-bottom: 8px; }
        .error-state .error-desc { color: #888; font-size: 0.85rem; line-height: 1.5; }
    </style>
</head>
<body>
<div class="reset-card">
    <!-- Loading state while verifying token -->
    <div id="loading-state" class="loading-state">
        <div class="spinner"></div>
        <div class="loading-text">Verifying reset link...</div>
    </div>

    <!-- Error state if token is invalid -->
    <div id="error-state" style="display:none;" class="error-state">
        <div class="error-icon">⚠️</div>
        <div class="error-title">Invalid or Expired Link</div>
        <div class="error-desc">This reset link is no longer valid. Please request a new one.</div>
        <div class="back-link" style="margin-top:20px;">
            <a href="forgot-password.html">Request New Reset Link</a>
        </div>
    </div>

    <!-- Password form (shown after token verified) -->
    <div id="form-state" style="display:none;">
        <h2>Set New Password</h2>
        <div class="subtitle">Enter your new password below.</div>

        <form id="reset-form">
            <div class="input-group">
                <label>New Password</label>
                <input type="password" id="password" minlength="6" required>
                <div class="password-requirements">Minimum 6 characters</div>
            </div>
            <div class="input-group">
                <label>Confirm New Password</label>
                <input type="password" id="password-confirm" minlength="6" required>
            </div>
            <button type="submit" class="btn-reset" id="submit-btn">UPDATE PASSWORD</button>
            <div id="error-message" class="error"></div>
        </form>

        <div class="back-link">
            <a href="login.html">← Back to Login</a>
        </div>
    </div>
</div>
<script>
    const supabaseUrl = 'https://pbumjalxclmegzckhqqr.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBidW1qYWx4Y2xtZWd6Y2tocXFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3ODk0NTUsImV4cCI6MjA4NTM2NTQ1NX0.ykjUqdJbwF3yliond1Vz2lcNQZCWA-5SnviruXm4ypI';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let sessionReady = false;

    // Supabase sends the user here with a hash fragment containing the session.
    // The client library automatically picks up the token from the URL hash.
    // We listen for the PASSWORD_RECOVERY event to know the token is valid.

    _supabase.auth.onAuthStateChange(async (event, session) => {
        if (event === 'PASSWORD_RECOVERY') {
            sessionReady = true;
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('form-state').style.display = 'block';
        }
    });

    // Timeout: if no recovery event after 4 seconds, token is bad
    setTimeout(() => {
        if (!sessionReady) {
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('error-state').style.display = 'block';
        }
    }, 4000);

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const submitBtn = document.getElementById('submit-btn');
        const errorMsg = document.getElementById('error-message');
        errorMsg.textContent = '';

        const password = document.getElementById('password').value;
        const confirm = document.getElementById('password-confirm').value;

        if (password !== confirm) {
            errorMsg.textContent = 'Passwords do not match.';
            return;
        }

        if (password.length < 6) {
            errorMsg.textContent = 'Password must be at least 6 characters.';
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'UPDATING...';

        try {
            const { error } = await _supabase.auth.updateUser({ password });

            if (error) throw error;

            // Sign out so they log in fresh with new password
            await _supabase.auth.signOut();

            // Redirect to login with success message
            window.location.href = 'login.html?reset=success';
        } catch (error) {
            console.error('Password update error:', error);
            errorMsg.textContent = error.message || 'Failed to update password. Please try again.';
            submitBtn.disabled = false;
            submitBtn.textContent = 'UPDATE PASSWORD';
        }
    });
</script>
</body>
</html>
