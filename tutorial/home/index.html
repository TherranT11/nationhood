<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/theme.js"></script>
<title>Sessau · Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FBFAF8;--surface:#FFFFFF;--ink:#15151B;--muted:#5b5b63;--soft:#8d8d95;--line:#E7E5E0;--chip:#F4F3EF;--indigo:#5546E8;--indigo-soft:#ECE9FD}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .app{display:flex;min-height:100vh}
  .side{width:236px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
  .brand__flag{width:42px;height:26px;object-fit:cover;border:1px solid var(--line);border-radius:4px;flex:none}
  .brand__txt{display:flex;flex-direction:column;line-height:1.25;min-width:0;overflow:hidden}
  .brand__txt b{font-weight:800;font-size:14px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand__txt span{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav__i{display:flex;align-items:center;gap:13px;padding:10px 12px;border-radius:9px;color:var(--muted);text-decoration:none;border:1px solid transparent;transition:background .15s,color .15s}
  .nav__i svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .nav__i .label{font-family:'Space Mono',monospace;font-size:12.5px;letter-spacing:.04em}
  .nav__i:hover{color:var(--ink);background:var(--chip)}
  .nav__i.active{color:var(--indigo);background:var(--indigo-soft);font-weight:700}
  .main{flex:1;padding:26px clamp(16px,3vw,40px) 56px;min-width:0}
  .page{max-width:900px;margin:0 auto}
  .eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
  .page h1{font-size:clamp(26px,4vw,36px);font-weight:900;letter-spacing:-.025em;color:var(--ink);margin:6px 0 22px}
  /* The party overview — first four home containers. */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:420px){.stats{grid-template-columns:1fr}}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .stat__k{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
  .stat__v{font-size:20px;font-weight:800;letter-spacing:-.01em;color:var(--ink);margin-top:9px;line-height:1.2}
  .stat__sub{font-weight:600;font-size:15px;color:var(--muted)}
  .botnav{display:none}
  .moresheet{display:none}
  @media(max-width:760px){.side{display:none}.main{padding-bottom:80px}.botnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:50}.botnav__i{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;background:none;border:none;cursor:pointer;color:var(--soft);text-decoration:none;font-family:inherit}.botnav__i svg{width:21px;height:21px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.botnav__i span{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.02em}.botnav__i.active{color:var(--indigo)}.moresheet{display:block;position:fixed;inset:0;z-index:60;background:rgba(21,21,27,.4)}.moresheet[hidden]{display:none}.moresheet__panel{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:18px 18px 0 0;border-top:1px solid var(--line);padding:16px 14px calc(20px + env(safe-area-inset-bottom))}.moresheet__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.moresheet__grid a{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border:1px solid var(--line);border-radius:12px;color:var(--muted);text-decoration:none}.moresheet__grid a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.moresheet__grid a span{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.04em;color:var(--ink)}.moresheet__exit{width:100%;margin-top:14px;padding:14px;border-radius:12px;border:1px solid var(--red,#C42B2B);background:none;color:var(--red,#C42B2B);font-family:'Space Mono',monospace;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}}
</style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand"><img class="brand__flag" src="/assets/Sessau.png" alt="Flag of Front Sessau" onerror="this.remove()"><div class="brand__txt"><b>Front Sessau</b><span>FS &middot; Sessau</span></div></div>
      <nav class="nav">
        <a class="nav__i active" href="/tutorial/home/"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v9h14v-9"/></svg><span class="label">Home</span></a>
        <a class="nav__i" href="/tutorial/nation/"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4-3 7-7 8-4-1-7-4-7-8V6l7-3z"/></svg><span class="label">Nation</span></a>
        <a class="nav__i" href="/tutorial/inbox/"><svg viewBox="0 0 24 24"><path d="M4 13l2-8h12l2 8"/><path d="M4 13v6h16v-6"/><path d="M4 13h5l1 2h4l1-2h5"/></svg><span class="label">Inbox</span></a>
        <a class="nav__i" href="/tutorial/legislature/"><svg viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M5 21V10M9 21V10M15 21V10M19 21V10"/><path d="M12 3l9 5H3z"/></svg><span class="label">Legislature</span></a>
        <a class="nav__i" href="/tutorial/election/"><svg viewBox="0 0 24 24"><path d="M4 7h16v13H4z"/><path d="M8 7V4h8v3"/><path d="M8.5 13l2 2 4-4"/></svg><span class="label">Election</span></a>
        <a class="nav__i" href="/tutorial/trade/"><svg viewBox="0 0 24 24"><path d="M4 9h13l-3-3"/><path d="M20 15H7l3 3"/></svg><span class="label">Trade</span></a>
        <a class="nav__i" href="/tutorial/world/"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span class="label">World</span></a>
        <a class="nav__i" href="/tutorial/conflict/"><svg viewBox="0 0 24 24"><path d="M17 4l3 3-9 9-3-3z"/><path d="M7 4L4 7l9 9 3-3"/><path d="M5 16l-1 4 4-1M19 16l1 4-4-1"/></svg><span class="label">Conflict</span></a>
        <a class="nav__i" href="/tutorial/forum/"><svg viewBox="0 0 24 24"><path d="M4 5h12v8H8l-4 3z"/><path d="M18 9h2v9l-3-2h-5"/></svg><span class="label">Forum</span></a>
        <a class="nav__i" href="/tutorial/wiki/"><svg viewBox="0 0 24 24"><path d="M12 5v15"/><path d="M4 4h6a2 2 0 012 2 2 2 0 012-2h6v13h-6a2 2 0 00-2 2 2 2 0 00-2-2H4z"/></svg><span class="label">Wiki</span></a>      </nav>
    </aside>
    <main class="main">
      <div class="page">
        <div class="eyebrow">The Republic of Sessau</div>
        <h1>Front Sessau</h1>
        <div class="stats">
          <div class="stat"><div class="stat__k">Party</div><div class="stat__v">Front Sessau <span class="stat__sub">(FS)</span></div></div>
          <div class="stat"><div class="stat__k">Party Leader</div><div class="stat__v">Allen Droulez <span class="stat__sub">(42)</span></div></div>
          <div class="stat"><div class="stat__k">Seats</div><div class="stat__v">114</div></div>
          <div class="stat"><div class="stat__k">Party Approval</div><div class="stat__v">32%</div></div>
        </div>
      </div>
    </main>
  </div>
  <nav class="botnav">
    <a class="botnav__i" href="/tutorial/home/"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v9h14v-9"/></svg><span>Home</span></a>
    <a class="botnav__i" href="/tutorial/nation/"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4-3 7-7 8-4-1-7-4-7-8V6l7-3z"/></svg><span>Nation</span></a>
    <a class="botnav__i" href="/tutorial/legislature/"><svg viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M5 21V10M9 21V10M15 21V10M19 21V10"/><path d="M12 3l9 5H3z"/></svg><span>Legislature</span></a>
    <a class="botnav__i" href="/tutorial/election/"><svg viewBox="0 0 24 24"><path d="M4 7h16v13H4z"/><path d="M8 7V4h8v3"/><path d="M8.5 13l2 2 4-4"/></svg><span>Election</span></a>
    <a class="botnav__i" href="/tutorial/world/"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span>World</span></a>
    <button class="botnav__i" id="moreBtn" type="button"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>More</span></button>
  </nav>
  <div class="moresheet" id="moreSheet" hidden><div class="moresheet__panel"><div class="moresheet__grid">
    <a href="/tutorial/inbox/"><svg viewBox="0 0 24 24"><path d="M4 13l2-8h12l2 8"/><path d="M4 13v6h16v-6"/><path d="M4 13h5l1 2h4l1-2h5"/></svg><span>Inbox</span></a>
    <a href="/tutorial/trade/"><svg viewBox="0 0 24 24"><path d="M4 9h13l-3-3"/><path d="M20 15H7l3 3"/></svg><span>Trade</span></a>
    <a href="/tutorial/conflict/"><svg viewBox="0 0 24 24"><path d="M17 4l3 3-9 9-3-3z"/><path d="M7 4L4 7l9 9 3-3"/><path d="M5 16l-1 4 4-1M19 16l1 4-4-1"/></svg><span>Conflict</span></a>
    <a href="/tutorial/forum/"><svg viewBox="0 0 24 24"><path d="M4 5h12v8H8l-4 3z"/><path d="M18 9h2v9l-3-2h-5"/></svg><span>Forum</span></a>
    <a href="/tutorial/wiki/"><svg viewBox="0 0 24 24"><path d="M12 5v15"/><path d="M4 4h6a2 2 0 012 2 2 2 0 012-2h6v13h-6a2 2 0 00-2 2 2 2 0 00-2-2H4z"/></svg><span>Wiki</span></a>
  </div><button class="moresheet__exit" id="exitTutorial" type="button">Exit Tutorial</button></div></div>
<script type="module">
  import { isConfigured } from '/supabase.js';
  import { requireUser, resetTutorial } from '/tutorial/shell.js';
  if (isConfigured) requireUser();   // auth guard when connected; shell.js stays the engine to build on

  // Mobile bottom nav: highlight the current tab + wire the More sheet.
  var _p = location.pathname;
  document.querySelectorAll('.botnav__i[href]').forEach(function(a){ if (a.getAttribute('href') === _p) a.classList.add('active'); });
  var _more = ['/tutorial/inbox/','/tutorial/trade/','/tutorial/conflict/','/tutorial/forum/','/tutorial/wiki/'];
  var _mb = document.getElementById('moreBtn'), _ms = document.getElementById('moreSheet');
  if (_more.indexOf(_p) >= 0 && _mb) _mb.classList.add('active');
  if (_mb && _ms) {
    _mb.addEventListener('click', function(){ _ms.hidden = !_ms.hidden; });
    _ms.addEventListener('click', function(e){ if (e.target === _ms) _ms.hidden = true; });
  }
  var _ex = document.getElementById('exitTutorial');
  if (_ex) _ex.addEventListener('click', async function(){
    if (!confirm('Exit the tutorial and reset your progress? Next time you start the tutorial it begins from scratch.')) return;
    _ex.disabled = true; _ex.textContent = 'Exiting\u2026';
    try { await resetTutorial(); } catch (e) {}
    window.location.href = '/home/';
  });
</script>
</body>
</html>
