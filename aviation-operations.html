function closeProductionQueueModal() {
    const overlay = document.getElementById('am-production-queue-modal');
    if (overlay) overlay.classList.remove('open');
    document.body.style.overflow = '';
}

function renderProductionQueueModal() {
    const overlay = document.getElementById('am-production-queue-modal');
    if (!overlay || !_productionQueueState) return;
    const $ = (id) => overlay.querySelector('#' + id);

    const corpAbbr = (_faction.abbreviation || _faction.faction_name || 'AM').slice(0, 6);
    const cash = Math.round(Number(_faction.corp_cash_reserves) || 0);
    const aircraftDesigns = _ownDesignsCache.filter(d => d.design_type === 'aircraft');
    const engineDesigns   = _ownDesignsCache.filter(d => d.design_type === 'engine');
    $('am-q-subtitle').innerHTML = `Filing as: <strong>${escHtml(corpAbbr)}</strong> ${escHtml(_faction.faction_name || '')} ◊ Cash on hand: ${fmtCostShort(cash)} ◊ Engine catalog: ${engineDesigns.length} ◊ Aircraft catalog: ${aircraftDesigns.length}`;

    // ── Design list ─────────────────────────────────────────────
    const list = _productionQueueState.tab === 'aircraft' ? aircraftDesigns : engineDesigns;
    const listEl = $('am-q-design-list');
    if (list.length === 0) {
        listEl.innerHTML = `<div class="am-q-empty">No ${_productionQueueState.tab} designs available. Run R&amp;D first.</div>`;
    } else {
        listEl.innerHTML = list.map(d => {
            const meta = d.design_type === 'aircraft'
                ? `${(d.airframe_class || '').toUpperCase()} ◊ ${d.engine_count || 0} ENGINE${(d.engine_count || 0) === 1 ? '' : 'S'} ◊ ${d.passengers || 0} PAX`
                : `QUALITY ${Number(d.quality || 0).toFixed(1)} ◊ THRUST ${Number(d.thrust || 0).toFixed(1)} ◊ WEIGHT ${Number(d.weight || 0).toFixed(1)}`;
            return `<div class="am-q-row${d.id === _productionQueueState.designId ? ' selected' : ''}" data-design-id="${d.id}">
                <div class="am-q-radio"></div>
                <div class="am-q-row-info">
                    <div class="am-q-row-name">${escHtml(d.name)}</div>
                    <div class="am-q-row-meta">${meta}</div>
                </div>
                <div class="am-q-row-info" style="text-align:right;">
                    <div class="am-q-row-cost">${fmtCostShort(d.cost_per_unit)}</div>
                    <div class="am-q-row-meta" style="margin-top:2px;">INVENTORY: ${Number(d.inventory_on_hand) || 0}</div>
                </div>
            </div>`;
        }).join('');
        listEl.querySelectorAll('.am-q-row').forEach(row => {
            row.addEventListener('click', () => {
                _productionQueueState.designId = row.dataset.designId;
                _productionQueueState.assignedPlants = new Set();  // re-eligibility forces re-pick
                renderProductionQueueModal();
            });
        });
    }

    const design = _ownDesignsCache.find(d => d.id === _productionQueueState.designId);

    // ── Plants ──────────────────────────────────────────────────
    const plantsBlock = $('am-q-plants-block');
    if (!design) {
        plantsBlock.innerHTML = `<div class="am-q-empty">Pick a design above to see compatible plants.</div>`;
    } else {
        plantsBlock.innerHTML = (_ownPlantsCache.length === 0
            ? `<div class="am-q-empty">No industrial facilities owned. Build one from the Expansion tab.</div>`
            : _ownPlantsCache.map(p => {
                const eligible  = isPlantEligibleFor(p, design);
                const cap       = PLANT_SIMULTANEOUS_BUILDS[p.type] || 1;
                const used      = _plantOccupancyCache[p.id] || 0;
                const free      = cap - used;
                const isFull    = !plantHasFreeSlot(p);
                const isAssigned = _productionQueueState.assignedPlants.has(p.id);
                let statusCls, statusTxt;
                if (isFull && !isAssigned) { statusCls = 'busy'; statusTxt = `Full (${used}/${cap})`; }
                else if (!eligible)        { statusCls = 'incompat'; statusTxt = 'Incompatible'; }
                else                       { statusCls = 'ok'; statusTxt = `Free slot (${free}/${cap})`; }
                return `<div class="am-q-plant-row" data-plant-id="${p.id}">
                    <div>
                        <div class="am-q-plant-name">${escHtml(p.name)} <span style="font-family:var(--co-mono); font-size:9px; color:var(--co-text-tertiary); letter-spacing:0.1em; text-transform:uppercase; margin-left:6px;">${PLANT_SHORT_LABEL[p.type] || p.type}</span></div>
                        <div class="am-q-plant-meta">${escHtml(p.city || '')} ◊ ${Math.round(Number(p.condition || 0))}% CONDITION</div>
                    </div>
                    <span class="am-q-plant-status ${statusCls}">${statusTxt}</span>
                    <button type="button" class="am-q-plant-toggle${isAssigned ? ' assigned' : ''}" data-plant-id="${p.id}" ${(eligible || isAssigned) ? '' : 'disabled'}>${isAssigned ? 'Assigned' : 'Assign'}</button>
                </div>`;
            }).join(''));
        plantsBlock.querySelectorAll('.am-q-plant-toggle').forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.disabled) return;
                const pid = btn.dataset.plantId;
                if (_productionQueueState.assignedPlants.has(pid)) {
                    _productionQueueState.assignedPlants.delete(pid);
                } else {
                    _productionQueueState.assignedPlants.add(pid);
                }
                renderProductionQueueModal();
            });
        });
    }

    // ── Quantity tier highlight ────────────────────────────────
    const qty = _productionQueueState.quantity;
    $('am-q-qty').textContent = String(qty);

    // Render the tier schedule from the cached single-source array
    // and highlight the row matching the current quantity.
    const tiers = _volumeDiscountTiers || [{ min_qty: 1, mult: 1.00 }];
    const activeIdx = activeTierIndex(qty);
    $('am-q-tier-list').innerHTML = tiers.map((t, i) => {
        const next = tiers[i + 1] || null;
        const pct = Math.round(Number(t.mult) * 100);
        return `<div class="am-q-tier-row${i === activeIdx ? ' active' : ''}">
            <span class="qty">${tierLabel(t, next)}</span>
            <span class="pct">${pct}%</span>
        </div>`;
    }).join('');

    // ── Engine supply (aircraft only) ──────────────────────────
    const supplySection = $('am-q-supply-section');
    let engineDesign = null;
    let enginesNeeded = 0;
    let stockSufficient = true;
    if (design && design.design_type === 'aircraft') {
        supplySection.style.display = '';
        engineDesign = _ownDesignsCache.find(d => d.id === design.engine_design_id);
        enginesNeeded = (Number(design.engine_count) || 0) * qty;
        const stock = Number(engineDesign?.inventory_on_hand) || 0;
        const after = stock - enginesNeeded;
        stockSufficient = after >= 0;
        $('am-q-engines-need').textContent = String(enginesNeeded);
        $('am-q-engines-stock').textContent = `${stock}${engineDesign ? ' · ' + escHtml(engineDesign.name) : ''}`;
        const netEl = $('am-q-engines-net');
        netEl.textContent = stockSufficient ? `+${after}` : String(after);
        netEl.className = 'am-q-supply-cell-value' + (stockSufficient ? ' green' : ' bad');
    } else {
        supplySection.style.display = 'none';
    }

    // ── Cost / time math ───────────────────────────────────────
    const assignedPlantIds = Array.from(_productionQueueState.assignedPlants);
    const parallelCapacity = assignedPlantIds.length;
    const timePerUnit = design
        ? timePerUnitFor(design.design_type, design.airframe_class)
        : 0;
    const totalCycles = parallelCapacity > 0 && qty > 0 ? Math.ceil(qty / parallelCapacity) : 0;
    const totalTicks  = totalCycles * timePerUnit;

    let perUnitCost = 0;
    if (design) {
        const designCost = Number(design.cost_per_unit) || 0;
        if (design.design_type === 'aircraft' && engineDesign) {
            const enginePart = (Number(design.engine_count) || 0) * (Number(engineDesign.cost_per_unit) || 0);
            perUnitCost = Math.max(0, designCost - enginePart);  // engines pulled from inventory, not paid here
        } else {
            perUnitCost = designCost;
        }
    }
    const discount = volumeDiscount(qty);
    const finalPerUnit = Math.round(perUnitCost * discount);
    const totalCost  = finalPerUnit * qty;
    const costPerTick = totalTicks > 0 ? Math.round(totalCost / totalTicks) : 0;

    $('am-q-c-perunit').textContent = design ? `${fmtCostShort(finalPerUnit)} (${Math.round(discount * 100)}%)` : '—';
    $('am-q-c-qty').textContent     = `${qty} × ${fmtCostShort(finalPerUnit)}`;
    $('am-q-c-total').textContent   = fmtCostShort(totalCost);
    $('am-q-c-plants').textContent  = parallelCapacity > 0 ? `${parallelCapacity} (parallel: ${parallelCapacity}/cycle)` : '—';
    $('am-q-c-tpu').textContent     = timePerUnit > 0 ? `${timePerUnit} ticks` : '—';
    $('am-q-c-cpt').textContent     = totalTicks > 0 ? `${fmtCostShort(costPerTick)}/tick` : '—';
    $('am-q-c-total-ticks').textContent = totalTicks > 0 ? `${totalTicks} ticks` : '—';
    $('am-q-footer-cost').textContent  = fmtCostShort(totalCost);
    $('am-q-footer-cpt').textContent   = totalTicks > 0 ? fmtCostShort(costPerTick) : '—';
    $('am-q-footer-ticks').textContent = totalTicks > 0 ? String(totalTicks) : '—';

    // ── Submit gating ──────────────────────────────────────────
    // The "cross-corp engine" branch handles the case where an
    // aircraft was designed against another corp's engine (the
    // design modal allows any globally-Available engine, but the
    // production RPC currently only supports own-corp engine
    // sourcing). Without this branch the player would see a
    // misleading "Need N engines (short N)" gate instead of an
    // explanation of what's actually wrong.
    const submitBtn = $('am-q-modal-submit');
    let blockReason = null;
    if (!design) blockReason = 'Pick a design';
    else if (parallelCapacity === 0) blockReason = 'Assign at least one plant';
    else if (design.design_type === 'aircraft' && !design.engine_design_id) blockReason = 'Aircraft design has no engine reference';
    else if (design.design_type === 'aircraft' && !engineDesign) blockReason = 'This aircraft was designed with another corp\'s engine. Cross-corp engine sourcing isn\'t supported yet — pick an aircraft built around one of your own engine designs.';
    else if (design.design_type === 'aircraft' && !stockSufficient) blockReason = `Need ${enginesNeeded} engines (short ${enginesNeeded - (Number(engineDesign?.inventory_on_hand) || 0)})`;
    else if (cash < costPerTick) blockReason = `Need ${fmtCostShort(costPerTick)} cash to start (you have ${fmtCostShort(cash)})`;

    submitBtn.disabled = !!blockReason;
    submitBtn.textContent = blockReason || 'Begin Production ▸';
}

async function submitProductionQueue() {
    if (!_productionQueueState) return;
    const overlay = document.getElementById('am-production-queue-modal');
    const submitBtn = overlay.querySelector('#am-q-modal-submit');
    const errEl = overlay.querySelector('#am-q-modal-error');
    if (submitBtn.disabled) return;

    const design = _ownDesignsCache.find(d => d.id === _productionQueueState.designId);
    if (!design) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting…';
    errEl.classList.remove('show');

    try {
        const { data, error } = await _supabase.rpc('queue_production_run', {
            p_corp_id:            _faction.id,
            p_design_id:          _productionQueueState.designId,
            p_engine_design_id:   design.design_type === 'aircraft' ? design.engine_design_id : null,
            p_quantity:           _productionQueueState.quantity,
            p_plant_property_ids: Array.from(_productionQueueState.assignedPlants),
        });
        if (error) {
            errEl.textContent = error.message;
            errEl.classList.add('show');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Begin Production ▸';
            return;
        }
        if (!data?.success) {
            errEl.textContent = data?.error || 'Could not queue production.';
            errEl.classList.add('show');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Begin Production ▸';
            return;
        }
        closeProductionQueueModal();
        await Promise.all([loadDesigns(_faction.id), loadProductionRuns(_faction.id)]);
    } catch (err) {
        errEl.textContent = err?.message || 'Unknown error.';
        errEl.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Begin Production ▸';
    }
}

// ── Active production runs panel ────────────────────────────────
// Two-step fetch: corp_production_runs has two FKs to
// corp_aircraft_designs (design_id + engine_design_id) which makes
// PostgREST embeds ambiguous. Resolving the design name by hand-join.
async function loadProductionRuns(corpId) {
    const el = document.getElementById('co-production-list');
    if (!el) return;
    const { data, error } = await _supabase
        .from('corp_production_runs')
        .select('id, design_id, design_type, quantity, completed_quantity, total_ticks, ticks_remaining, cost_per_tick, status')
        .eq('corp_id', corpId)
        .eq('status', 'active')
        .order('created_at', { ascending: false });
    if (error) {
        console.warn('[aviation-ops] production runs fetch failed:', error.message);
        el.innerHTML = '<div class="co-contract-empty">Could not load production runs.</div>';
        return;
    }
    const rows = data || [];
    if (rows.length === 0) {
        el.innerHTML = '<div class="co-contract-empty">No active production runs. Click + Production Queue to start one.</div>';
        return;
    }

    // Resolve design names with one batched query.
    const designIds = [...new Set(rows.map(r => r.design_id).filter(Boolean))];
    let nameById = {};
    if (designIds.length > 0) {
        const { data: designs, error: dErr } = await _supabase
            .from('corp_aircraft_designs')
            .select('id, name')
            .in('id', designIds);
        if (dErr) console.warn('[aviation-ops] design name lookup failed:', dErr.message);
        for (const d of (designs || [])) nameById[d.id] = d.name;
    }

    el.innerHTML = rows.map(r => renderProductionRunCard(r, nameById[r.design_id] || '—')).join('');
}

function renderProductionRunCard(r, designName) {
    const total = Number(r.total_ticks) || 1;
    const remaining = Number(r.ticks_remaining) || 0;
    const progressPct = Math.max(0, Math.min(100, ((total - remaining) / total) * 100));
    const meta = `${r.design_type === 'engine' ? 'Engine' : 'Aircraft'} ◊ ${r.completed_quantity || 0} / ${r.quantity || 0} delivered ◊ ${fmtCostShort(r.cost_per_tick)}/tick`;
    return `<div class="am-q-run-card">
        <div>
            <div class="am-q-run-name">${escHtml(designName)}</div>
            <div class="am-q-run-meta">${meta}</div>
        </div>
        <div class="am-q-run-stats"><strong>${remaining}</strong> ticks left<br><span style="color:var(--co-text-tertiary);">${progressPct.toFixed(0)}% complete</span></div>
        <div class="am-q-run-progress"><div class="am-q-run-progress-fill" style="width:${progressPct.toFixed(0)}%"></div></div>
    </div>`;
}

// ── Aircraft RFPs (manufacturer side) ──────────────────────────
// Surfaces every open RFP in the world that this corp could fulfill
// (i.e., the corp owns at least one Available aircraft design of
// the right class with inventory_on_hand >= rfp.quantity). Click
// "Submit Bid" to choose a design + price.
const RFP_CLASS_LABEL = {
    regional:   'Regional',
    narrowbody: 'Narrowbody',
    widebody:   'Widebody',
};
const RFP_PRIORITY_LABEL = {
    range:    'RANGE',
    price:    'PRICE',
    quality:  'QUALITY',
    offering: 'OFFERING',
};
// Render priorities JSONB ({range:1,price:2,...}) as a chevron-
// separated list ordered by rank. Returns '' when priorities are
// missing or malformed so the caller can omit the line entirely.
function _formatRfpPriorities(priorities) {
    if (!priorities || typeof priorities !== 'object') return '';
    const entries = Object.entries(priorities)
        .filter(([k, v]) => RFP_PRIORITY_LABEL[k] && Number.isFinite(Number(v)))
        .sort((a, b) => Number(a[1]) - Number(b[1]))
        .map(([k]) => RFP_PRIORITY_LABEL[k]);
    return entries.length === 4 ? entries.join(' &gt; ') : '';
}
let _bidModalRfp = null;
let _bidModalEligibleDesigns = [];
let _bidModalInflight = false;

async function loadAircraftRfpsForBidder(corpId) {
    const el = document.getElementById('co-rfps-list');
    if (!el) return;

    // Pull this corp's Available aircraft designs first — used to
    // filter the visible RFPs to ones we could fulfill.
    const { data: myDesigns } = await _supabase
        .from('corp_aircraft_designs')
        .select('id, name, airframe_class, inventory_on_hand, range_nm, passengers, demand_score, safety_score, quality, cost_per_unit, engine_count')
        .eq('corp_id', corpId)
        .eq('design_type', 'aircraft')
        .eq('status', 'available')
        .eq('is_active', true);
    const designsByClass = {};
    for (const d of (myDesigns || [])) {
        if (Number(d.inventory_on_hand) <= 0) continue;
        if (!designsByClass[d.airframe_class]) designsByClass[d.airframe_class] = [];
        designsByClass[d.airframe_class].push(d);
    }

    const [shardRes, rfpsRes, myBidsRes] = await Promise.all([
        _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single(),
        _supabase.from('aircraft_rfps')
            .select('id, airline_corp_id, design_class, quantity, expires_at_tick, name, priorities, factions:airline_corp_id(faction_name, abbreviation)')
            .eq('status', 'open')
            .order('created_at', { ascending: false })
            .limit(50),
        _supabase.from('aircraft_rfp_bids')
            .select('rfp_id, price_per_unit, source_design_id, status')
            .eq('manufacturer_corp_id', corpId),
    ]);
    const currentTick = Number(shardRes.data?.current_tick) || 0;
    if (rfpsRes.error) {
        console.warn('[aviation-ops] RFP fetch failed:', rfpsRes.error.message);
        el.innerHTML = '<div class="co-contract-empty">Could not load RFPs.</div>';
        return;
    }
    const allRfps = rfpsRes.data || [];
    const myBidByRfp = new Map((myBidsRes.data || []).map(b => [b.rfp_id, b]));

    // Filter RFPs the bidder can fulfill (has matching class with
    // inventory_on_hand >= qty on at least one design).
    const fulfillable = allRfps.filter(r => {
        const candidates = designsByClass[r.design_class] || [];
        return candidates.some(d => Number(d.inventory_on_hand) >= Number(r.quantity));
    });

    if (fulfillable.length === 0) {
        el.innerHTML = '<div class="co-contract-empty">No open RFPs match your aircraft inventory. RFPs surface here when an airline posts one whose class matches a design you can fulfill from inventory.</div>';
        return;
    }

    el.innerHTML = fulfillable.map(r => {
        const ticksLeft = Math.max(0, Number(r.expires_at_tick) - currentTick);
        const airline = r.factions?.abbreviation || r.factions?.faction_name || '—';
        const myBid = myBidByRfp.get(r.id);
        const bidLabel = myBid
            ? `Bid placed · ${fmtCostShort(myBid.price_per_unit)}/unit (${myBid.status})`
            : 'No bid';
        const btnLabel = myBid && myBid.status === 'pending' ? 'Update Bid' : 'Submit Bid';
        const classLabel = `${r.quantity}× ${escHtml(RFP_CLASS_LABEL[r.design_class] || r.design_class)}`;
        const headline = r.name
            ? `${escHtml(r.name)} — ${classLabel}`
            : classLabel;
        const priorityLine = _formatRfpPriorities(r.priorities);
        return `<div class="am-q-run-card" style="grid-template-columns:1fr auto;align-items:center;">
            <div>
                <div class="am-q-run-name">${headline}</div>
                <div class="am-q-run-meta">FROM ${escHtml(airline)} ◊ ${ticksLeft} TICK${ticksLeft === 1 ? '' : 'S'} LEFT ◊ ${escHtml(bidLabel)}</div>
                ${priorityLine ? `<div class="am-q-run-meta" style="margin-top:2px;">PRIORITIES: ${priorityLine}</div>` : ''}
            </div>
            <button type="button" class="co-panel-action-btn co-rfp-bid-btn" data-rfp-id="${r.id}">${btnLabel}</button>
        </div>`;
    }).join('');

    el.querySelectorAll('.co-rfp-bid-btn').forEach(btn => {
        btn.addEventListener('click', () => openBidModal(btn.dataset.rfpId, designsByClass, allRfps));
    });
}

function openBidModal(rfpId, designsByClass, allRfps) {
    const rfp = allRfps.find(r => r.id === rfpId);
    if (!rfp) return;
    _bidModalRfp = rfp;
    _bidModalEligibleDesigns = (designsByClass[rfp.design_class] || [])
        .filter(d => Number(d.inventory_on_hand) >= Number(rfp.quantity));

    let overlay = document.getElementById('am-rfp-bid-modal');
    if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'am-rfp-bid-modal';
        overlay.className = 'am-modal-overlay';
        overlay.innerHTML = `
            <div class="am-modal">
                <div class="am-modal-header">
                    <div>
                        <div class="am-modal-eyebrow">— Aircraft RFP ◊ Submit Bid —</div>
                        <h2 class="am-modal-title">Submit <em>Bid</em></h2>
                        <div class="am-modal-subtitle" id="am-rfp-bid-subtitle"></div>
                    </div>
                    <button type="button" class="am-modal-close" aria-label="Close">×</button>
                </div>
                <div class="am-modal-body">
                    <div class="am-form-section">
                        <div class="am-form-section-header">
                            <h3><span class="num">I.</span>Choose Design</h3>
                            <span class="meta">Eligible Aircraft With Sufficient Inventory</span>
                        </div>
                        <div id="am-rfp-bid-designs" class="am-q-list"></div>
                    </div>
                    <div class="am-form-section">
                        <div class="am-form-section-header">
                            <h3><span class="num">II.</span>Price Per Unit</h3>
                            <span class="meta">Total = Price × Quantity</span>
                        </div>
                        <div class="am-engine-block" style="display:flex;gap:14px;align-items:center;">
                            <input type="number" id="am-rfp-bid-price" min="0" step="100000" value="0" style="flex:1;padding:10px 14px;font-family:var(--co-serif);font-size:18px;background:var(--co-bg-secondary);border:1px solid var(--co-line-bright);color:var(--co-text-primary);" />
                            <div style="font-family:var(--co-mono);font-size:11px;color:var(--co-text-secondary);">Total: <span id="am-rfp-bid-total" style="color:var(--co-accent-gold);font-weight:600;">$0</span></div>
                        </div>
                    </div>
                </div>
                <div class="am-modal-error" id="am-rfp-bid-error"></div>
                <div class="am-modal-footer">
                    <div class="am-modal-footer-summary"></div>
                    <div class="am-modal-footer-actions">
                        <button type="button" class="am-modal-btn" id="am-rfp-bid-cancel">Cancel</button>
                        <button type="button" class="am-modal-btn primary" id="am-rfp-bid-submit">Submit Bid ▸</button>
                    </div>
                </div>
            </div>`;
        document.body.appendChild(overlay);
        overlay.querySelector('.am-modal-close').addEventListener('click', closeBidModal);
        overlay.querySelector('#am-rfp-bid-cancel').addEventListener('click', closeBidModal);
        overlay.addEventListener('click', (e) => { if (e.target === overlay) closeBidModal(); });
        overlay.querySelector('#am-rfp-bid-price').addEventListener('input', renderBidTotal);
        overlay.querySelector('#am-rfp-bid-submit').addEventListener('click', submitBid);
    }

    const sublineCore = `${rfp.quantity}× ${RFP_CLASS_LABEL[rfp.design_class] || rfp.design_class} for ${rfp.factions?.abbreviation || rfp.factions?.faction_name || 'airline'}`;
    const namePrefix = rfp.name ? `${rfp.name} ◊ ` : '';
    const priorityLine = _formatRfpPriorities(rfp.priorities);
    const subtitleEl = overlay.querySelector('#am-rfp-bid-subtitle');
    // Use innerHTML so the &gt; entity in priorityLine renders as ">".
    subtitleEl.innerHTML = priorityLine
        ? `${escHtml(namePrefix)}${escHtml(sublineCore)} <span style="color:var(--co-text-tertiary);">◊ Priorities: ${priorityLine}</span>`
        : `${escHtml(namePrefix)}${escHtml(sublineCore)}`;

    overlay.querySelector('#am-rfp-bid-designs').innerHTML = _bidModalEligibleDesigns.map((d, i) => `
        <div class="am-q-row${i === 0 ? ' selected' : ''}" data-design-id="${d.id}">
            <div class="am-q-radio"></div>
            <div class="am-q-row-info">
                <div class="am-q-row-name">${escHtml(d.name)}</div>
                <div class="am-q-row-meta">RANGE ${Number(d.range_nm || 0).toFixed(1)} ◊ ${d.passengers || 0} PAX ◊ QUALITY ${Number(d.quality || 0).toFixed(1)} ◊ INVENTORY ${d.inventory_on_hand}</div>
            </div>
            <div class="am-q-row-info" style="text-align:right;">
                <div class="am-q-row-cost">${fmtCostShort(d.cost_per_unit)}</div>
                <div class="am-q-row-meta" style="margin-top:2px;">PRODUCTION COST</div>
            </div>
        </div>
    `).join('') || '<div class="am-q-empty">No eligible designs.</div>';

    overlay.querySelectorAll('#am-rfp-bid-designs .am-q-row').forEach(row => {
        row.addEventListener('click', () => {
            overlay.querySelectorAll('#am-rfp-bid-designs .am-q-row').forEach(r => r.classList.remove('selected'));
            row.classList.add('selected');
        });
    });

    // Default suggested price = the design's cost_per_unit × 1.2 markup.
    const firstDesign = _bidModalEligibleDesigns[0];
    if (firstDesign) {
        overlay.querySelector('#am-rfp-bid-price').value = Math.round(Number(firstDesign.cost_per_unit) * 1.2);
        renderBidTotal();
    }

    overlay.querySelector('#am-rfp-bid-error').classList.remove('show');
    overlay.querySelector('#am-rfp-bid-submit').disabled = false;
    overlay.querySelector('#am-rfp-bid-submit').textContent = 'Submit Bid ▸';
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
}

function closeBidModal() {
    const overlay = document.getElementById('am-rfp-bid-modal');
    if (overlay) overlay.classList.remove('open');
    document.body.style.overflow = '';
    _bidModalRfp = null;
    _bidModalEligibleDesigns = [];
}

function renderBidTotal() {
    const overlay = document.getElementById('am-rfp-bid-modal');
    if (!overlay || !_bidModalRfp) return;
    const ppu = parseInt(overlay.querySelector('#am-rfp-bid-price').value, 10) || 0;
    const total = ppu * _bidModalRfp.quantity;
    overlay.querySelector('#am-rfp-bid-total').textContent = fmtCostShort(total);
}

async function submitBid() {
    if (_bidModalInflight || !_bidModalRfp) return;
    const overlay = document.getElementById('am-rfp-bid-modal');
    const errEl = overlay.querySelector('#am-rfp-bid-error');
    errEl.classList.remove('show');

    const selectedRow = overlay.querySelector('#am-rfp-bid-designs .am-q-row.selected');
    if (!selectedRow) {
        errEl.textContent = 'Pick a design.';
        errEl.classList.add('show');
        return;
    }
    const designId = selectedRow.dataset.designId;
    const ppu = parseInt(overlay.querySelector('#am-rfp-bid-price').value, 10);
    if (!Number.isInteger(ppu) || ppu < 0) {
        errEl.textContent = 'Price must be a non-negative whole number.';
        errEl.classList.add('show');
        return;
    }

    _bidModalInflight = true;
    const submit = overlay.querySelector('#am-rfp-bid-submit');
    submit.disabled = true;
    submit.textContent = 'Submitting…';
    try {
        const { data, error } = await _supabase.rpc('bid_on_aircraft_rfp', {
            p_rfp_id:           _bidModalRfp.id,
            p_source_design_id: designId,
            p_price_per_unit:   ppu,
        });
        if (error || !data?.success) {
            errEl.textContent = error?.message || data?.error || 'Failed to submit bid.';
            errEl.classList.add('show');
            return;
        }
        closeBidModal();
        await loadAircraftRfpsForBidder(_faction.id);
    } catch (err) {
        errEl.textContent = err?.message || 'Unknown error.';
        errEl.classList.add('show');
    } finally {
        _bidModalInflight = false;
        submit.disabled = false;
        submit.textContent = 'Submit Bid ▸';
    }
}

// ── Live designs panels (R&D + Current Designs) ──────────────────
async function loadDesigns(corpId) {
    const designsEl = document.getElementById('co-designs-list');
    const rndEl     = document.getElementById('co-rnd-list');
    if (!designsEl || !rndEl) return;

    const { data: rows, error } = await _supabase
        .from('corp_aircraft_designs')
        .select('id, name, design_type, thrust, weight, efficiency, reliability, quality, cost_per_unit, inventory_on_hand, status, research_ticks_total, research_ticks_remaining, completed_at_tick, airframe_class, engine_count, passengers, range_nm, demand_score, safety_score')
        .eq('corp_id', corpId)
        .eq('is_active', true)
        .order('created_at', { ascending: false });
    if (error) {
        console.warn('[aviation-ops] designs fetch failed:', error.message);
        designsEl.innerHTML = '<div class="co-contract-empty">Could not load designs.</div>';
        rndEl.innerHTML     = '<div class="co-contract-empty">Could not load R&amp;D.</div>';
        return;
    }
    const all = rows || [];
    const researching = all.filter(r => r.status === 'researching');
    const available   = all.filter(r => r.status === 'available');

    rndEl.innerHTML = researching.length
        ? researching.map(renderDesignResearchCard).join('')
        : '<div class="co-contract-empty">No active R&amp;D. Allocate resources to begin developing a new design.</div>';

    designsEl.innerHTML = available.length
        ? available.map(renderAvailableDesignCard).join('')
        : '<div class="co-contract-empty">No designs yet. Run R&amp;D to develop your first airframe.</div>';
}

            <div class="am-design-name">${escHtml(d.name)}</div>

}

function renderAvailableDesignCard(d) {
    const isAircraft = d.design_type === 'aircraft';

    const cost = fmtCostShort(d.cost_per_unit);

async function init() {
    const { data: { user } } = await _supabase.auth.getUser();
    if (!user) { window.location.href = 'login.html'; return; }

    const url = new URL(location.href);
    const inspectFactionId = url.searchParams.get('faction_id');
    const activeId = inspectFactionId
        || sessionStorage.getItem('active_faction_id')
        || user.id;

    const [factionRes, shardRes] = await Promise.all([
        _supabase.from('factions').select('*').eq('id', activeId).maybeSingle(),
        _supabase.from('shard').select('current_tick, current_date, next_tick_at, tick_interval_hours').eq('name', 'Alpha Shard').single(),
    ]);
    if (factionRes.error) {
        document.body.innerHTML = '<div style="padding:40px;font-family:monospace;color:#c85a3a;">Could not load corporation.</div>';
        return;
    }

    // Fallback: fresh tab where sessionStorage is empty and user.id
    // mapped to the user's party row. Look up the user's Aviation
    // Manufacturing corp directly before bouncing.
    let faction = factionRes.data;
    if (!inspectFactionId && (!faction || faction.faction_type !== 'corporation' || faction.corp_sector !== 'Aviation Manufacturing')) {
        const { data: owned } = await _supabase
            .from('factions')
            .select('*')
            .or(`id.eq.${user.id},linked_user_id.eq.${user.id}`)
            .eq('faction_type', 'corporation')
            .eq('corp_sector', 'Aviation Manufacturing')
            .is('abandoned_at', null)
            .limit(1)
            .maybeSingle();
        if (owned) {
            faction = owned;
            sessionStorage.setItem('active_faction_id', owned.id);
        }
    }
    const shard = shardRes.data;
    _faction = faction;

    if (!faction || faction.faction_type !== 'corporation' || faction.corp_sector !== 'Aviation Manufacturing') {
        const qs = inspectFactionId ? `?faction_id=${encodeURIComponent(inspectFactionId)}` : '';
        window.location.href = 'corp-dashboard.html' + qs;
        return;
    }

    const { data: allFactions } = await _supabase
        .from('factions')
        .select('id, faction_name, abbreviation, faction_type, linked_user_id')
        .or(`id.eq.${user.id},linked_user_id.eq.${user.id}`)
        .is('abandoned_at', null);

    renderCorpTopBar(document.getElementById('corp-topbar'), {
        activeTab: 'operations',
        faction,
        shard,
        allUserFactions: allFactions || [],
        supabase: _supabase,
    });

    // Active Orders pill is hardcoded 0 — Phase F mechanics ship the
    // real order pipeline; for now the slot is a placeholder so the
    // page header layout matches the construction / shipping / finance
    // pages where the active-contracts pill is the headline indicator.
    renderPageShell(0);

    renderHeroStats();
    bindPanelActionButtons();

    const footerEl = document.getElementById('co-footer-date');
    if (footerEl && shard?.current_date) {
        footerEl.textContent = String(shard.current_date);
    }

    await loadFacilities(faction.id);

    // Facility gates — mirror the server-side checks in
    // start_engine_design_research / start_aircraft_design_research
    // so a stale UI can't bypass them. Engine design needs an Engine
    // Assembly Plant; aircraft design needs any of Light Assembly /
    // Aircraft Assembly Facility / Heavy Manufacturing Plant. One
    // round-trip pulls every property type we care about.
    try {
        const { data: gateProps } = await _supabase
            .from('corp_properties')
            .select('type')
            .eq('faction_id', faction.id)
            .in('type', [
                'engine_assembly_plant',
                'light_assembly_plant',
                'aircraft_assembly_facility',
                'heavy_manufacturing_plant',
            ])
            .eq('is_active', true);
        const types = new Set((gateProps || []).map(p => p.type));
        applyEngineDesignGate(types.has('engine_assembly_plant'));
        applyAircraftDesignGate(
            types.has('light_assembly_plant')
            || types.has('aircraft_assembly_facility')
            || types.has('heavy_manufacturing_plant')
        );
    } catch (gateErr) {
        console.warn('[aviation-ops] facility gate check failed:', gateErr?.message || gateErr);
        applyEngineDesignGate(false);
        applyAircraftDesignGate(false);
    }

    await loadAvailableEngineCatalog();
    await Promise.all([
        loadDesigns(faction.id),
        loadProductionRuns(faction.id),
        loadAircraftRfpsForBidder(faction.id),
    ]);
}
