<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aviation Operations | Nationhood</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/corp-topbar.css">
<link rel="stylesheet" href="css/corp-light-theme.css">
<style>
/* ──────────────────────────────────────────────────────────
   AVIATION MANUFACTURING OPERATIONS
   Mirrors the layout language of the Construction / Shipping /
   Finance ops pages so the five Ops surfaces read as one
   product family. .co-* class vocabulary matches its sibling
   pages — the rules below are a focused subset of what
   corp-operations.html ships, scoped to what this scaffold
   actually renders.
   ────────────────────────────────────────────────────────── */
body.corp-operations-aviation {
  --bg-0: #0e0e0c;
  --bg-1: #1a1a1a;
  --bg-2: #1a1a17;
  --bg-3: #252525;
  --bg-4: #24241f;
  --bg-5: #2c2c26;
  --bg-hover: #282822;
  --bg-card: #1a1a17;
  --bg-panel: #252525;
  --panel-main: #1f1f1a;
  --panel-border: rgba(255,255,255,0.08);
  --text-bright: #f0efe6;
  --text-primary: #c4c2b8;
  --text-secondary: #888;
  --text-muted: #666;
  --text-dim: #4a4940;
  --text-ghost: #333229;
  --border-hair: rgba(255,255,255,0.04);
  --border-0: rgba(255,255,255,0.06);
  --border-1: rgba(255,255,255,0.08);
  --border-2: rgba(255,255,255,0.12);
  --green: #5cb85c;
  --red: #d9534f;
  --amber: #c8a832;
  --gold: #c8a832;
  --orange: #e8724a;
  --blue: #5bc0de;
  --teal: #5aafa5;
  --font-mono:  'JetBrains Mono', monospace;
  --font-sans:  'IBM Plex Sans', sans-serif;
  --font-serif: 'IBM Plex Serif', serif;

  --co-bg-primary:    #0e0e0c;
  --co-bg-secondary:  #1a1a17;
  --co-bg-card:       #1a1a17;
  --co-bg-elevated:   #252525;
  --co-line:          rgba(255,255,255,0.06);
  --co-line-bright:   rgba(255,255,255,0.12);
  --co-text-primary:  #f0efe6;
  --co-text-secondary:#c4c2b8;
  --co-text-tertiary: #888;
  --co-accent-gold:     #c8a832;
  --co-accent-gold-dim: rgba(200,168,50,0.55);
  --co-accent-red:      #d9534f;
  --co-accent-green:    #5cb85c;
  --co-accent-blue:     #5bc0de;
  --co-accent-rust:     #e8724a;
  --co-accent-teal:     #5aafa5;
  --co-serif: 'IBM Plex Serif', Georgia, serif;
  --co-sans:  'IBM Plex Sans', system-ui, sans-serif;
  --co-mono:  'JetBrains Mono', monospace;

  background: var(--co-bg-primary);
  color: var(--co-text-secondary);
  font-family: var(--co-sans);
  font-size: 14px;
  line-height: 1.45;
  margin: 0;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
body.corp-operations-aviation * { box-sizing: border-box; }

body.corp-operations-aviation.light-mode {
  --co-bg-primary:    #faf9f5;
  --co-bg-secondary:  #f8f7f2;
  --co-bg-card:       #ffffff;
  --co-bg-elevated:   #faf9f5;
  --co-line:          #e8e7e0;
  --co-line-bright:   #e0dfd6;
  --co-text-primary:  #1a1a17;
  --co-text-secondary:#2d2d28;
  --co-text-tertiary: #6a6660;
}

.co-loading {
  font-family: var(--co-mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--co-text-tertiary);
  text-align: center;
  padding: 80px 20px;
}

.co-layout {
  max-width: 1440px;
  margin: 0 auto;
  padding: 24px 36px 60px;
  position: relative;
  z-index: 2;
}

/* ── PAGE HEADER ── */
.co-page-header {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 40px;
  align-items: end;
  padding-bottom: 28px;
  border-bottom: 1px solid var(--co-line);
  margin-bottom: 36px;
}
.co-page-title {
  font-family: var(--co-serif);
  font-weight: 500;
  font-size: 56px;
  line-height: 0.95;
  letter-spacing: -0.02em;
  color: var(--co-text-primary);
  margin: 0;
}
.co-page-title em {
  font-style: italic;
  color: var(--co-accent-gold);
}
.co-page-stats {
  display: flex;
  gap: 28px;
  text-align: right;
}
.co-page-stat-label {
  font-family: var(--co-mono);
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--co-text-tertiary);
  margin-bottom: 4px;
}
.co-page-stat-value {
  font-family: var(--co-serif);
  font-size: 28px;
  font-weight: 400;
  color: var(--co-text-primary);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

/* ── SECTION HEADERS ── */
.co-section-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 18px;
}
.co-section-header h2 {
  font-family: var(--co-serif);
  font-weight: 500;
  font-style: italic;
  font-size: 28px;
  color: var(--co-text-primary);
  letter-spacing: -0.01em;
  margin: 0;
}
.co-section-header h2 .num {
  font-family: var(--co-mono);
  font-style: normal;
  font-size: 14px;
  color: var(--co-accent-gold-dim);
  margin-right: 12px;
  letter-spacing: 0.1em;
  vertical-align: middle;
}
.co-section-header .desc {
  font-family: var(--co-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--co-text-tertiary);
}

.co-section { margin-bottom: 48px; }

/* ── HERO STATS ── */
.co-hero-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--co-line-bright);
  border: 1px solid var(--co-line-bright);
}
.co-hero-stat {
  background: var(--co-bg-card);
  padding: 32px 32px 28px;
  position: relative;
}
.co-hero-stat::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(to right, var(--co-accent-gold-dim), transparent);
}
.co-hero-stat[data-stat="capacity"]::before    { background: linear-gradient(to right, var(--co-accent-teal),  transparent); }
.co-hero-stat[data-stat="quality"]::before     { background: linear-gradient(to right, var(--co-accent-gold),  transparent); }
.co-hero-stat[data-stat="innovation"]::before  { background: linear-gradient(to right, var(--co-accent-rust),  transparent); }

.co-hero-stat-eyebrow {
  font-family: var(--co-mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--co-accent-gold-dim);
  margin-bottom: 10px;
}
.co-hero-stat[data-stat="capacity"]   .co-hero-stat-eyebrow { color: var(--co-accent-teal); }
.co-hero-stat[data-stat="quality"]    .co-hero-stat-eyebrow { color: var(--co-accent-gold-dim); }
.co-hero-stat[data-stat="innovation"] .co-hero-stat-eyebrow { color: var(--co-accent-rust); }

.co-hero-stat-name {
  font-family: var(--co-serif);
  font-weight: 500;
  font-size: 30px;
  line-height: 1;
  color: var(--co-text-primary);
  margin-bottom: 18px;
  letter-spacing: -0.015em;
}
.co-hero-stat-name em { font-style: italic; }

.co-hero-tip {
  display: inline-flex;
  width: 16px;
  height: 16px;
  border: 1px solid var(--co-line-bright);
  border-radius: 50%;
  color: var(--co-text-tertiary);
  font-family: var(--co-mono, monospace);
  font-size: 10px;
  font-weight: 700;
  font-style: normal;
  align-items: center;
  justify-content: center;
  margin-left: 10px;
  cursor: help;
  position: relative;
  vertical-align: middle;
  letter-spacing: 0;
  transition: color 0.15s, border-color 0.15s;
}
.co-hero-tip:hover { color: var(--co-accent-gold); border-color: var(--co-accent-gold); }
.co-hero-tip::after {
  content: attr(data-tip);
  position: absolute;
  bottom: calc(100% + 10px);
  left: 0;
  width: 280px;
  background: var(--co-bg-card);
  border: 1px solid var(--co-line-bright);
  color: var(--co-text-primary);
  padding: 11px 14px;
  font-family: var(--co-sans, sans-serif);
  font-weight: 400;
  font-size: 11.5px;
  line-height: 1.55;
  text-align: left;
  text-transform: none;
  letter-spacing: 0;
  white-space: normal;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s;
  z-index: 100;
  box-shadow: 0 6px 20px rgba(0,0,0,0.35);
}
.co-hero-tip:hover::after { opacity: 1; }

.co-hero-stat-value-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 18px;
}
.co-hero-stat-value {
  font-family: var(--co-serif);
  font-weight: 400;
  font-size: 64px;
  line-height: 0.9;
  color: var(--co-text-primary);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
}
.co-hero-stat-value .co-max {
  font-size: 26px;
  color: var(--co-text-tertiary);
  margin-left: 4px;
}
.co-hero-stat-trend {
  font-family: var(--co-mono);
  font-size: 11px;
  padding: 4px 9px;
  border: 1px solid var(--co-line-bright);
  background: var(--co-bg-secondary);
  color: var(--co-text-secondary);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.co-hero-meter {
  display: flex;
  gap: 4px;
  margin-bottom: 16px;
}
.co-hero-meter-cell {
  flex: 1;
  height: 14px;
  background: var(--co-bg-secondary);
  border: 1px solid var(--co-line-bright);
}
.co-hero-meter-cell.filled {
  background: var(--co-accent-gold);
  border-color: var(--co-accent-gold);
  box-shadow: 0 0 6px rgba(201, 164, 73, 0.3);
}
.co-hero-meter-cell.filled.warn {
  background: var(--co-accent-red);
  border-color: var(--co-accent-red);
  box-shadow: 0 0 6px rgba(200, 90, 58, 0.4);
}
.co-hero-meter-cell.filled.good {
  background: var(--co-accent-green);
  border-color: var(--co-accent-green);
  box-shadow: 0 0 6px rgba(138, 166, 83, 0.4);
}

.co-hero-stat-desc {
  font-size: 13px;
  line-height: 1.55;
  color: var(--co-text-secondary);
  margin-bottom: 14px;
  padding-top: 14px;
  border-top: 1px dashed var(--co-line-bright);
}
.co-hero-stat-desc strong {
  color: var(--co-text-primary);
  font-weight: 500;
}

.co-hero-stat-impact {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  font-family: var(--co-mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.co-hero-stat-impact > div { display: flex; flex-direction: column; gap: 3px; }
.co-hero-stat-impact .label { color: var(--co-text-tertiary); font-size: 9px; }
.co-hero-stat-impact .value { color: var(--co-text-primary); font-size: 12px; font-weight: 500; }
.co-hero-stat-impact .value.warn { color: var(--co-accent-red); }
.co-hero-stat-impact .value.rust { color: var(--co-accent-rust); }
.co-hero-stat-impact .value.good { color: var(--co-accent-green); }

/* ── CONTRACTS / DESIGNS / R&D / FACILITIES — list/card surface ── */
.co-contracts-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
  margin-bottom: 48px;
}
.co-contract-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.co-contract-empty {
  background: var(--co-bg-card);
  border: 1px solid var(--co-line);
  padding: 32px 18px;
  text-align: center;
  font-family: var(--co-mono);
  font-size: 10px;
  color: var(--co-text-tertiary);
  letter-spacing: 0.05em;
  font-style: italic;
}

/* List rows for the Industrial Facilities section. */
.co-asset-row {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 16px;
  background: var(--co-bg-card);
  border: 1px solid var(--co-line);
  padding: 16px 22px;
  transition: border-color 0.15s;
}
.co-asset-row:hover { border-color: var(--co-line-bright); }
.co-asset-name {
  font-family: var(--co-serif);
  font-size: 16px;
  font-weight: 500;
  color: var(--co-text-primary);
  margin-bottom: 4px;
}
.co-asset-meta {
  font-family: var(--co-mono);
  font-size: 9px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--co-text-tertiary);
}
.co-asset-value {
  font-family: var(--co-serif);
  font-size: 18px;
  font-weight: 500;
  color: var(--co-accent-green);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

/* ── Panel-footer action buttons (Design Engine / etc.) ───────── */
.co-panel-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.co-panel-action-btn {
  flex: 1;
  padding: 10px 12px;
  background: transparent;
  color: var(--co-text-secondary);
  border: 1px solid var(--co-line-bright);
  cursor: pointer;
  font-family: var(--co-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
}
.co-panel-action-btn:hover {
  background: var(--co-bg-elevated);
  color: var(--co-text-primary);
  border-color: var(--co-accent-gold);
}
.co-panel-action-btn:active { transform: translateY(1px); }

/* ── FOOTER ── */
.co-footer-strip {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 24px;
  border-top: 1px solid var(--co-line);
  margin-top: 24px;
  font-family: var(--co-mono);
  font-size: 10px;
  color: var(--co-text-tertiary);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.co-footer-strip em { font-style: normal; color: var(--co-text-secondary); }

@media (max-width: 1180px) {
  .co-hero-stats { grid-template-columns: 1fr; }
  .co-hero-stat-value { font-size: 52px; }
  .co-hero-stat { padding: 24px 22px 22px; }
  .co-contracts-grid { grid-template-columns: 1fr; }
}

/* ── Engine-design modal ────────────────────────────────────────
   Opens from the [+ Design Engine] button; .am-* prefix scopes it
   inside the .co-* page so future shared extraction is clean. */
.am-modal-gate-note {
  font-family: var(--co-mono);
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--co-accent-rust);
  padding: 8px 12px;
  border: 1px dashed rgba(232, 114, 74, 0.4);
  background: rgba(232, 114, 74, 0.05);
  text-align: center;
}
.co-panel-action-btn:disabled,
.co-panel-action-btn.disabled {
  opacity: 0.45;
  cursor: not-allowed;
  border-color: var(--co-line);
}
.co-panel-action-btn:disabled:hover,
.co-panel-action-btn.disabled:hover {
  background: transparent;
  color: var(--co-text-secondary);
  border-color: var(--co-line);
}

.am-modal-overlay {
  position: fixed; inset: 0;
  background: rgba(5, 6, 4, 0.85);
  backdrop-filter: blur(4px);
  z-index: 1000;
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding: 30px 24px;
  overflow-y: auto;
}
.am-modal-overlay.open { display: flex; }
.am-modal {
  width: 100%;
  max-width: 1040px;
  background: var(--co-bg-secondary);
  border: 1px solid var(--co-line-bright);
  box-shadow: 0 24px 80px rgba(0,0,0,0.6);
  position: relative;
}

.am-modal-header {
  padding: 26px 32px 22px;
  border-bottom: 1px solid var(--co-line);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.am-modal-eyebrow {
  font-family: var(--co-mono); font-size: 10px;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--co-accent-gold-dim); margin-bottom: 6px;
}
.am-modal-title {
  font-family: var(--co-serif); font-weight: 500;
  font-size: 36px; line-height: 1;
  letter-spacing: -0.02em; color: var(--co-text-primary);
  font-style: italic;
}
.am-modal-title em { color: var(--co-accent-gold); }
.am-modal-subtitle {
  font-family: var(--co-mono); font-size: 11px;
  letter-spacing: 0.1em; color: var(--co-text-tertiary);
  margin-top: 8px;
}
.am-modal-subtitle strong { color: var(--co-accent-gold); font-weight: 500; }
.am-modal-close {
  background: transparent;
  border: 1px solid var(--co-line-bright);
  color: var(--co-text-tertiary);
  font-family: var(--co-mono); font-size: 14px;
  width: 32px; height: 32px;
  cursor: pointer; transition: all 0.15s;
}
.am-modal-close:hover { border-color: var(--co-accent-red); color: var(--co-accent-red); }

.am-modal-body { padding: 26px 32px; }

.am-form-section { margin-bottom: 26px; }
.am-form-section:last-child { margin-bottom: 0; }
.am-form-section-header {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 14px; padding-bottom: 10px;
  border-bottom: 1px dashed var(--co-line-bright);
}
.am-form-section-header h3 {
  font-family: var(--co-serif); font-style: italic; font-weight: 500;
  font-size: 18px; color: var(--co-text-primary); letter-spacing: -0.01em;
}
.am-form-section-header h3 .num {
  font-family: var(--co-mono); font-style: normal; font-size: 11px;
  color: var(--co-accent-gold-dim); margin-right: 10px;
  letter-spacing: 0.1em;
}
.am-form-section-header .meta {
  font-family: var(--co-mono); font-size: 9px;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--co-text-tertiary);
}

.am-identity-block {
  background: var(--co-bg-card);
  border: 1px solid var(--co-line);
  padding: 16px 22px;
}
.am-identity-label {
  font-family: var(--co-mono); font-size: 9px;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--co-text-tertiary); margin-bottom: 8px;
}
.am-identity-input {
  width: 100%;
  background: var(--co-bg-secondary);
  border: 1px solid var(--co-line-bright);
  color: var(--co-text-primary);
  font-family: var(--co-serif); font-size: 24px;
  font-weight: 500; padding: 10px 14px;
  letter-spacing: -0.01em;
  outline: none;
  transition: border-color 0.15s;
}
.am-identity-input:focus { border-color: var(--co-accent-gold); }
.am-identity-input::placeholder { color: var(--co-text-tertiary); font-style: italic; }

.am-module-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.am-module-card {
  background: var(--co-bg-card);
  border: 1px solid var(--co-line);
  padding: 14px 16px;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.am-module-card:hover { border-color: var(--co-line-bright); background: var(--co-bg-elevated); }
.am-module-card.selected {
  border-color: var(--co-accent-gold);
  background: rgba(201, 168, 50, 0.05);
}
.am-module-card.selected::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--co-accent-gold);
}
.am-module-card-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 10px;
}
.am-module-name-block {
  display: flex; align-items: flex-start; gap: 8px;
  min-width: 0;
}
.am-module-radio {
  width: 13px; height: 13px;
  border: 1px solid var(--co-line-bright);
  background: var(--co-bg-secondary);
  border-radius: 50%;
  position: relative;
  margin-top: 4px;
  flex-shrink: 0;
}
.am-module-card.selected .am-module-radio { border-color: var(--co-accent-gold); }
.am-module-card.selected .am-module-radio::after {
  content: '';
  position: absolute;
  inset: 3px;
  background: var(--co-accent-gold);
  border-radius: 50%;
}
.am-module-name {
  font-family: var(--co-serif);
  font-weight: 500;
  font-size: 13.5px;
  color: var(--co-text-primary);
  line-height: 1.25;
}
.am-module-tier-tag {
  font-family: var(--co-mono);
  font-size: 8px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--co-accent-gold-dim);
  padding: 2px 5px;
  border: 1px solid rgba(201, 168, 50, 0.25);
  flex-shrink: 0;
  white-space: nowrap;
}
.am-module-stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
}
.am-module-stat {
  text-align: center;
  padding: 5px 4px;
  background: var(--co-bg-secondary);
  border: 1px solid var(--co-line);
}
.am-module-stat-label {
  font-family: var(--co-mono);
  font-size: 8px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--co-text-tertiary);
  margin-bottom: 2px;
}
.am-module-stat-value {
  font-family: var(--co-serif);
  font-weight: 500;
  font-size: 14px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.am-module-stat-value.positive  { color: var(--co-accent-green); }
.am-module-stat-value.negative  { color: var(--co-accent-red); }
.am-module-stat-value.zero      { color: var(--co-text-tertiary); }
.am-module-stat-value.weight    { color: var(--co-accent-rust); }
.am-module-cost {
  font-family: var(--co-mono);
  font-size: 10px;
  color: var(--co-text-secondary);
  letter-spacing: 0.05em;
  text-align: right;
}
.am-module-cost strong { color: var(--co-accent-gold); font-weight: 500; }

.am-summary {
  background: var(--co-bg-elevated);
  border: 1px solid var(--co-line-bright);
  padding: 22px 26px;
}
.am-summary-header-line {
  font-family: var(--co-mono); font-size: 10px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--co-text-tertiary); margin-bottom: 16px;
}
.am-summary-name-row {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 18px; margin-bottom: 6px;
}
.am-summary-name {
  font-family: var(--co-serif); font-style: italic; font-weight: 500;
  font-size: 28px; color: var(--co-accent-gold);
  letter-spacing: -0.015em;
}
.am-summary-tier-line {
  font-family: var(--co-mono); font-size: 10px;
  color: var(--co-text-tertiary); letter-spacing: 0.14em;
  text-transform: uppercase; margin-bottom: 22px;
}
.am-summary-stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}
.am-summary-stat-card {
  background: var(--co-bg-secondary);
  border: 1px solid var(--co-line-bright);
  padding: 14px 12px;
  text-align: center;
}
.am-summary-stat-card-label {
  font-family: var(--co-mono); font-size: 9px;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--co-text-tertiary); margin-bottom: 8px;
}
.am-summary-stat-card-value {
  font-family: var(--co-serif); font-weight: 500;
  font-size: 28px; line-height: 1;
  color: var(--co-text-primary); font-variant-numeric: tabular-nums;
}
.am-summary-stat-card-value.weight-stat { color: var(--co-accent-rust); }
.am-summary-stat-card-value .max {
  font-size: 13px; color: var(--co-text-tertiary); margin-left: 2px;
}
.am-summary-stat-card-bar {
  height: 3px; background: var(--co-line);
  margin-top: 10px; position: relative; overflow: hidden;
}
.am-summary-stat-card-bar-fill {
  position: absolute; top: 0; left: 0; height: 100%;
  background: var(--co-accent-gold);
  transition: width 0.2s;
}
.am-summary-stat-card-bar-fill.weight-bar { background: var(--co-accent-rust); }

.am-quality-row {
  display: grid; grid-template-columns: 1fr auto;
  gap: 18px; align-items: center;
  margin-bottom: 22px;
  padding: 14px 18px;
  background: var(--co-bg-secondary);
  border: 1px solid var(--co-accent-gold-dim);
}
.am-quality-name {
  font-family: var(--co-serif); font-style: italic; font-weight: 500;
  font-size: 16px; color: var(--co-text-primary);
}
.am-quality-name .desc {
  display: block;
  font-family: var(--co-mono); font-style: normal;
  font-size: 9px; color: var(--co-text-tertiary);
  letter-spacing: 0.12em; text-transform: uppercase;
  margin-top: 4px;
}
.am-quality-value {
  font-family: var(--co-serif); font-weight: 500;
  font-size: 30px; color: var(--co-accent-gold);
  line-height: 1; font-variant-numeric: tabular-nums;
  text-align: right;
}
.am-quality-value .max-num {
  font-family: var(--co-mono); font-size: 14px;
  color: var(--co-text-tertiary); margin-left: 2px;
}

.am-summary-breakdown {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}
.am-breakdown-title {
  font-family: var(--co-mono); font-size: 10px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--co-text-tertiary); margin-bottom: 10px;
}
.am-breakdown-line {
  display: flex; justify-content: space-between;
  padding: 5px 0;
  border-bottom: 1px dashed var(--co-line);
  font-family: var(--co-mono); font-size: 12px;
}
.am-breakdown-line:last-of-type { border-bottom: none; }
.am-breakdown-line .label { color: var(--co-text-secondary); }
.am-breakdown-line .value { color: var(--co-text-primary); font-weight: 500; font-variant-numeric: tabular-nums; }
.am-breakdown-line.total {
  margin-top: 6px; padding-top: 12px;
  border-top: 1px solid var(--co-line-bright);
  border-bottom: none;
}
.am-breakdown-line.total .label {
  font-family: var(--co-serif); font-style: italic;
  font-size: 14px; color: var(--co-text-primary);
}
.am-breakdown-line.total .value {
  font-family: var(--co-serif); font-size: 18px; font-weight: 500;
  color: var(--co-accent-gold);
}

.am-modal-footer {
  padding: 16px 32px;
  border-top: 1px solid var(--co-line);
  background: var(--co-bg-primary);
  display: flex; justify-content: space-between; align-items: center; gap: 24px;
}
.am-modal-footer-summary { display: flex; gap: 22px; }
.am-modal-footer-item { display: flex; flex-direction: column; gap: 2px; }
.am-modal-footer-label {
  font-family: var(--co-mono); font-size: 9px;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--co-text-tertiary);
}
.am-modal-footer-value {
  font-family: var(--co-serif); font-weight: 500;
  font-size: 17px; color: var(--co-text-primary);
  line-height: 1; font-variant-numeric: tabular-nums;
}
.am-modal-footer-actions { display: flex; gap: 8px; }
.am-modal-btn {
  font-family: var(--co-mono); font-size: 11px;
  letter-spacing: 0.16em; text-transform: uppercase;
  padding: 11px 22px;
  background: transparent;
  border: 1px solid var(--co-line-bright);
  color: var(--co-text-secondary);
  cursor: pointer; transition: all 0.15s;
  font-weight: 500;
}
.am-modal-btn:hover { border-color: var(--co-accent-gold); color: var(--co-accent-gold); }
.am-modal-btn.primary {
  background: var(--co-accent-gold);
  border-color: var(--co-accent-gold);
  color: var(--co-bg-primary);
  font-weight: 700;
}
.am-modal-btn.primary:hover { background: var(--co-text-primary); border-color: var(--co-text-primary); }
.am-modal-btn.primary:disabled,
.am-modal-btn.primary.disabled {
  background: var(--co-bg-secondary);
  border-color: var(--co-line-bright);
  color: var(--co-text-tertiary);
  cursor: not-allowed;
}
.am-modal-error {
  font-family: var(--co-mono); font-size: 10px;
  letter-spacing: 0.05em;
  color: var(--co-accent-red);
  padding: 0 32px 14px;
  display: none;
}
.am-modal-error.show { display: block; }

/* R&D + Current Designs panel cards */
.am-design-card {
  background: var(--co-bg-card);
  border: 1px solid var(--co-line);
  padding: 14px 18px;
  display: grid;
  gap: 8px;
}
.am-design-card-head {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 12px;
}
.am-design-name {
  font-family: var(--co-serif); font-weight: 500; font-size: 16px;
  color: var(--co-text-primary); letter-spacing: -0.005em;
}
.am-design-meta {
  font-family: var(--co-mono); font-size: 9px;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--co-text-tertiary);
}
.am-design-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  font-family: var(--co-mono); font-size: 10px;
}
.am-design-stats > div { display: flex; flex-direction: column; gap: 2px; }
.am-design-stats .label { color: var(--co-text-tertiary); font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase; }
.am-design-stats .value { color: var(--co-text-primary); font-family: var(--co-serif); font-size: 14px; font-weight: 500; }
.am-design-progress {
  height: 4px;
  background: var(--co-line);
  position: relative; overflow: hidden;
  margin-top: 4px;
}
.am-design-progress-fill {
  position: absolute; top: 0; left: 0; height: 100%;
  background: var(--co-accent-gold);
  transition: width 0.3s;
}
.am-design-countdown {
  font-family: var(--co-mono); font-size: 10px;
  color: var(--co-accent-gold);
  letter-spacing: 0.08em; text-transform: uppercase;
}

/* ── Aircraft modal — airframe grid (4 cards) ── */
.am-airframe-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
.am-airframe-card {
  background: var(--co-bg-card);
  border: 1px solid var(--co-line);
  padding: 16px 18px;
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
  display: flex; flex-direction: column; gap: 12px;
}
.am-airframe-card:hover { border-color: var(--co-line-bright); background: var(--co-bg-elevated); }
.am-airframe-card.selected { border-color: var(--co-accent-gold); background: rgba(201, 168, 50, 0.05); }
.am-airframe-card.selected::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0;
  height: 2px; background: var(--co-accent-gold);
}
.am-airframe-head { display: flex; align-items: flex-start; gap: 10px; }
.am-airframe-radio {
  width: 13px; height: 13px;
  border: 1px solid var(--co-line-bright);
  background: var(--co-bg-secondary);
  border-radius: 50%;
  position: relative; margin-top: 4px; flex-shrink: 0;
}
.am-airframe-card.selected .am-airframe-radio { border-color: var(--co-accent-gold); }
.am-airframe-card.selected .am-airframe-radio::after {
  content: ''; position: absolute; inset: 3px;
  background: var(--co-accent-gold); border-radius: 50%;
}
.am-airframe-name {
  font-family: var(--co-serif); font-style: italic; font-weight: 500;
  font-size: 18px; color: var(--co-text-primary);
  line-height: 1.1; letter-spacing: -0.01em;
}
.am-airframe-stats { display: flex; flex-direction: column; gap: 4px; }
.am-airframe-stat-row {
  display: flex; justify-content: space-between;
  font-family: var(--co-mono); font-size: 10px; letter-spacing: 0.05em;
}
.am-airframe-stat-row .label {
  color: var(--co-text-tertiary); text-transform: uppercase; letter-spacing: 0.12em;
}
.am-airframe-stat-row .value {
  color: var(--co-text-primary); font-weight: 500; font-variant-numeric: tabular-nums;
}
.am-airframe-stat-row .value.weight { color: var(--co-accent-rust, #a0633a); }
.am-airframe-cost {
  font-family: var(--co-serif); font-weight: 500;
  font-size: 20px; color: var(--co-accent-gold);
  text-align: center; padding-top: 10px;
  border-top: 1px dashed var(--co-line-bright);
  font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
}
.am-airframe-cost .small {
  font-family: var(--co-mono); font-size: 9px;
  color: var(--co-text-tertiary); letter-spacing: 0.14em;
  display: block; margin-top: 4px; text-transform: uppercase;
}

/* ── Aircraft modal — engine selection block ── */
.am-engine-block {
  background: var(--co-bg-card);
  border: 1px solid var(--co-line);
  padding: 18px 22px;
}
.am-engine-row {
  display: grid; grid-template-columns: 1fr auto;
  gap: 18px; align-items: center;
}
.am-engine-select-wrap { display: flex; flex-direction: column; gap: 6px; }
.am-engine-select-label {
  font-family: var(--co-mono); font-size: 9px;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--co-text-tertiary);
}
.am-engine-select {
  background: var(--co-bg-secondary);
  border: 1px solid var(--co-line-bright);
  color: var(--co-text-primary);
  font-family: var(--co-serif); font-style: italic; font-size: 16px;
  padding: 8px 12px; cursor: pointer; outline: none;
  transition: border-color 0.15s; font-weight: 500;
}
.am-engine-select:focus, .am-engine-select:hover { border-color: var(--co-accent-gold); }
.am-engine-preview { font-family: var(--co-mono); font-size: 9px; color: var(--co-text-tertiary); margin-top: 4px; }
.am-engine-pill {
  display: inline-block; padding: 2px 6px; margin-right: 4px;
  border: 1px solid var(--co-line-bright); background: var(--co-bg-secondary);
  color: var(--co-text-secondary);
}
.am-engine-pill.thrust { color: #8aa653; border-color: rgba(138, 166, 83, 0.3); }
.am-engine-pill.weight { color: #a0633a; border-color: rgba(160, 99, 58, 0.3); }
.am-engine-count-control {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.am-count-buttons { display: flex; gap: 6px; }
.am-count-btn {
  background: var(--co-bg-secondary);
  border: 1px solid var(--co-line-bright);
  color: var(--co-text-secondary);
  font-family: var(--co-mono); font-size: 11px;
  padding: 8px 14px; cursor: pointer;
  transition: all 0.15s; font-weight: 600;
  min-width: 44px; letter-spacing: 0.05em;
}
.am-count-btn:hover { border-color: var(--co-accent-gold-dim, #8a722f); color: var(--co-text-primary); }
.am-count-btn.selected {
  border-color: var(--co-accent-gold);
  background: rgba(201, 168, 50, 0.1);
  color: var(--co-accent-gold);
}
.am-count-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* ── Aircraft modal — multi-select stat chips ── */
.am-stat-chip {
  font-family: var(--co-mono); font-size: 9px;
  padding: 2px 6px; border: 1px solid;
  letter-spacing: 0.05em; text-transform: uppercase; line-height: 1.4;
}
.am-stat-chip.weight   { color: #a0633a; border-color: rgba(160, 99, 58, 0.4); background: rgba(160, 99, 58, 0.06); }
.am-stat-chip.safety   { color: #8aa653; border-color: rgba(138, 166, 83, 0.4); background: rgba(138, 166, 83, 0.06); }
.am-stat-chip.demand   { color: #5a7896; border-color: rgba(90, 120, 150, 0.4); background: rgba(90, 120, 150, 0.06); }
.am-stat-chip.demand-neg { color: var(--co-accent-red); border-color: rgba(200, 90, 58, 0.4); background: rgba(200, 90, 58, 0.06); }
.am-stat-chip.passengers { color: var(--co-accent-gold); border-color: rgba(201, 168, 50, 0.4); background: rgba(201, 168, 50, 0.06); }
.am-stat-chip.cost     { color: var(--co-text-secondary); border-color: var(--co-line-bright); background: var(--co-bg-secondary); }

/* ── Aircraft modal — physical-status badge + physics block ── */
.am-physical-status {
  font-family: var(--co-mono); font-size: 10px;
  letter-spacing: 0.16em; text-transform: uppercase;
  padding: 4px 10px; border: 1px solid;
}
.am-physical-status.viable  { color: #8aa653; border-color: rgba(138, 166, 83, 0.4); background: rgba(138, 166, 83, 0.06); }
.am-physical-status.invalid { color: var(--co-accent-red); border-color: rgba(200, 90, 58, 0.4); background: rgba(200, 90, 58, 0.06); }
.am-physics-block {
  background: var(--co-bg-card);
  border: 1px solid var(--co-line-bright);
  padding: 14px 18px;
  margin: 18px 0;
  display: grid; grid-template-columns: 1fr auto;
  gap: 18px; align-items: center;
}
.am-physics-info { font-size: 12px; color: var(--co-text-secondary); line-height: 1.5; }
.am-physics-info strong { color: var(--co-text-primary); font-weight: 500; }
.am-physics-display {
  font-family: var(--co-serif); font-weight: 500; font-size: 24px;
  line-height: 1; font-variant-numeric: tabular-nums;
  text-align: right; letter-spacing: -0.01em;
  color: var(--co-text-primary);
}
.am-physics-display.green { color: #8aa653; }
.am-physics-display.warn  { color: #a0633a; }
.am-physics-display.bad   { color: var(--co-accent-red); }
.am-physics-display .label {
  font-family: var(--co-mono); font-size: 9px;
  color: var(--co-text-tertiary); letter-spacing: 0.14em;
  display: block; margin-top: 4px; text-transform: uppercase;
}

/* ── Production Queue modal (.am-q-*) ── */
.am-q-tabs { display: flex; gap: 4px; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px dashed var(--co-line-bright); }
.am-q-tab {
  flex: 1;
  background: var(--co-bg-secondary);
  border: 1px solid var(--co-line-bright);
  color: var(--co-text-secondary);
  font-family: var(--co-mono); font-size: 11px;
  letter-spacing: 0.16em; text-transform: uppercase;
  padding: 10px 14px; cursor: pointer;
  transition: all 0.15s; font-weight: 500;
}
.am-q-tab:hover { color: var(--co-text-primary); }
.am-q-tab.active {
  background: rgba(201, 168, 50, 0.06);
  border-color: var(--co-accent-gold);
  color: var(--co-accent-gold);
}
.am-q-list { display: flex; flex-direction: column; gap: 6px; }
.am-q-row {
  display: grid; grid-template-columns: 18px auto 1fr auto; gap: 14px; align-items: center;
  padding: 12px 14px;
  background: var(--co-bg-secondary);
  border: 1px solid var(--co-line-bright);
  cursor: pointer; transition: all 0.15s;
}
.am-q-row:hover { background: var(--co-bg-elevated); }
.am-q-row.selected {
  border-color: var(--co-accent-gold);
  background: rgba(201, 168, 50, 0.05);
}
.am-q-radio {
  width: 14px; height: 14px;
  border: 1px solid var(--co-line-bright);
  background: var(--co-bg-card);
  border-radius: 50%; position: relative;
}
.am-q-row.selected .am-q-radio { border-color: var(--co-accent-gold); }
.am-q-row.selected .am-q-radio::after {
  content: ''; position: absolute; inset: 3px;
  background: var(--co-accent-gold); border-radius: 50%;
}
.am-q-row-info { min-width: 0; }
.am-q-row-name { font-family: var(--co-serif); font-style: italic; font-weight: 500; font-size: 16px; color: var(--co-text-primary); margin-bottom: 3px; }
.am-q-row-meta { font-family: var(--co-mono); font-size: 9px; color: var(--co-text-tertiary); letter-spacing: 0.1em; text-transform: uppercase; }
.am-q-row-cost { font-family: var(--co-serif); font-weight: 500; font-size: 14px; color: var(--co-accent-gold); text-align: right; font-variant-numeric: tabular-nums; }
.am-q-empty {
  font-family: var(--co-serif); font-style: italic; font-size: 13px;
  color: var(--co-text-tertiary); text-align: center; padding: 24px 16px;
}

.am-q-plant-row {
  display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center;
  padding: 12px 0; border-bottom: 1px dashed var(--co-line-bright);
}
.am-q-plant-row:last-child { border-bottom: none; }
.am-q-plant-name { font-family: var(--co-serif); font-weight: 500; font-size: 14px; color: var(--co-text-primary); margin-bottom: 3px; }
.am-q-plant-meta { font-family: var(--co-mono); font-size: 10px; color: var(--co-text-secondary); letter-spacing: 0.05em; }
.am-q-plant-status {
  font-family: var(--co-mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
  padding: 3px 8px; border: 1px solid; line-height: 1.4;
}
.am-q-plant-status.ok { color: #8aa653; border-color: rgba(138, 166, 83, 0.4); background: rgba(138, 166, 83, 0.06); }
.am-q-plant-status.busy { color: #a0633a; border-color: rgba(160, 99, 58, 0.4); background: rgba(160, 99, 58, 0.06); }
.am-q-plant-status.incompat { color: var(--co-text-tertiary); border-color: var(--co-line-bright); background: var(--co-bg-secondary); }
.am-q-plant-toggle {
  font-family: var(--co-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  padding: 7px 14px;
  background: var(--co-bg-secondary); border: 1px solid var(--co-line-bright);
  color: var(--co-text-secondary); cursor: pointer;
  transition: all 0.15s; font-weight: 500; min-width: 88px;
}
.am-q-plant-toggle:hover:not(:disabled) { border-color: var(--co-accent-gold); color: var(--co-accent-gold); }
.am-q-plant-toggle.assigned {
  background: var(--co-accent-gold); border-color: var(--co-accent-gold);
  color: var(--co-bg-primary); font-weight: 700;
}
.am-q-plant-toggle:disabled { opacity: 0.3; cursor: not-allowed; }

function escHtml(s) {
    if (s == null) return '';
    const d = document.createElement('div');
    d.textContent = String(s);
    return d.innerHTML;
}
function escAttr(s) { return escHtml(s).replace(/"/g, '&quot;'); }

function fmtMoneyShort(n) {
    const v = Number(n) || 0;
    if (v >= 1_000_000_000) return '$' + (v / 1_000_000_000).toFixed(2) + 'B';
    if (v >= 1_000_000)     return '$' + (v / 1_000_000).toFixed(1)  + 'M';
    if (v >= 1_000)         return '$' + (v / 1_000).toFixed(1)      + 'k';
    return '$' + Math.round(v);
}

// Mirrors corp-operations.html scoreBand: good ≥7, mid 4-6, warn <4.

    if (n >= 7) return 'good';
    if (n >= 4) return 'mid';
    return 'warn';
}

function renderHeroStats() {
    const container = document.getElementById('co-hero-stats');

function renderHeroStat(stat) {
    const score = Number(_faction[stat.column]) || 0;
    const band  = scoreBand(score);
    const display = Number.isInteger(score) ? String(score) : score.toFixed(1);

    // Per-tick stat history isn't tracked yet — neutral trend tag.
    const trendHtml = '<div class="co-hero-stat-trend">— Latest</div>';

    const meterHtml = renderHeroMeter(score, band);
    const blurb = stat.blurb[band] || '';
    const impacts = stat.impacts[band] || [];
    const impactsHtml = impacts.map(i =>
        `<div>
            <span class="label">${escHtml(i.label)}</span>
            <span class="value ${i.tone || ''}">${escHtml(i.value)}</span>
        </div>`
    ).join('');

    const tipHtml = stat.tooltip
        ? `<span class="co-hero-tip" data-tip="${escAttr(stat.tooltip)}" aria-label="What is ${escAttr(stat.name + ' ' + (stat.emName || ''))}?">?</span>`
        : '';

    return `<div class="co-hero-stat" data-stat="${stat.key}">
        <div class="co-hero-stat-eyebrow">${escHtml(stat.eyebrow)}</div>
        <div class="co-hero-stat-name">${escHtml(stat.name)} <em>${escHtml(stat.emName)}</em>${tipHtml}</div>

function renderHeroMeter(score, band) {
    const filled = Math.max(0, Math.min(10, Math.round(Number(score) || 0)));
    const fillClass = band === 'good' ? 'filled good'
                    : band === 'warn' ? 'filled warn'
                    : 'filled';
    const cells = [];
    for (let i = 0; i < 10; i++) {
        cells.push(`<div class="co-hero-meter-cell${i < filled ? ' ' + fillClass : ''}"></div>`);
    }
    return `<div class="co-hero-meter">${cells.join('')}</div>`;
}

async function loadFacilities(corpId) {
    const el = document.getElementById('co-facilities-list');
    if (!el) return;
    const { data: rows, error } = await _supabase
        .from('corp_properties')
        .select('id, name, type, city, purchase_price, monthly_maintenance, condition, purchased_at_tick')
        .eq('faction_id', corpId)
        .eq('is_active', true)
        .neq('type', 'national_hq')
        .order('purchased_at_tick', { ascending: true });
    if (error) {
        console.warn('[aviation-ops] facilities fetch failed:', error.message);
        el.innerHTML = '<div class="co-contract-empty">Could not load facilities.</div>';
        return;
    }
    if (!rows || rows.length === 0) {
        el.innerHTML = '<div class="co-contract-empty">No industrial facilities yet. Build one from the Expansion tab.</div>';
        return;
    }
    el.innerHTML = rows.map(r => {
        const label    = FACILITY_LABEL[r.type] || r.name || r.type;
        const valueTxt = fmtMoneyShort(r.purchase_price);
        const maintTxt = fmtMoneyShort(r.monthly_maintenance);
        const cond     = Math.round(Number(r.condition) || 0);
        const cityTxt  = r.city ? escHtml(r.city) : '—';
        return `<div class="co-asset-row">
            <div>
                <div class="co-asset-name">${escHtml(label)}</div>

            <div class="co-asset-value">${valueTxt}</div>

    }).join('');
}

let _designAircraftState = null;

// ── Aircraft design specs (Tier 1) ─────────────────────────────
// Single source of truth lives in SQL: aircraft_design_specs()
// returns {airframes, mechanicals, offerings} from
// aircraft_airframe_specs / aircraft_mechanical_specs /
// aircraft_offering_specs. Fetched once per session and cached.
// start_aircraft_design_research reads the same source so the
// modal preview cannot drift from what the design RPC persists.
//
// Field names use snake_case (eng_min/eng_max) to match the source
// JSONB shape directly — no transformation needed on read.
let _aircraftDesignSpecs = null;   // {airframes, mechanicals, offerings}
async function loadAircraftDesignSpecs() {
    if (_aircraftDesignSpecs) return _aircraftDesignSpecs;
    const { data, error } = await _supabase.rpc('aircraft_design_specs');
    if (error) {
        console.warn('[aviation-ops] aircraft_design_specs fetch failed:', error.message);
        _aircraftDesignSpecs = { airframes: {}, mechanicals: {}, offerings: {} };
        return _aircraftDesignSpecs;
    }
    _aircraftDesignSpecs = {
        airframes:   data?.airframes   || {},
        mechanicals: data?.mechanicals || {},
        offerings:   data?.offerings   || {},
    };
    return _aircraftDesignSpecs;
}

function fmtCostShort(n) {
    const v = Number(n) || 0;
    if (v >= 1_000_000) return '$' + (v / 1_000_000).toFixed(1).replace(/\.0$/, '') + 'M';
    if (v >= 1_000)     return '$' + (v / 1_000).toFixed(0) + 'k';
    return '$' + Math.round(v);
}

function bindPanelActionButtons() {
    document.querySelectorAll('[data-am-action]').forEach(btn => {
        btn.addEventListener('click', () => {
            const action = btn.getAttribute('data-am-action');
            if (action === 'design-engine') {
                if (!_hasEngineAssemblyPlant) return; // gate; disabled state already shown
                openDesignEngineModal();
                return;
            }
            if (action === 'design-aircraft') {
                if (!_hasAircraftAssemblyFacility) return; // gate; disabled state already shown
                openDesignAircraftModal();
                return;
            }
            if (action === 'production-queue') {
                openProductionQueueModal();
                return;
            }
            const label = PLANT_ACTION_LABELS[action] || 'This action';
            alert(label + ' will be available when Aviation Manufacturing Phase F mechanics ship.');
        });
    });
}

// ── Engine Assembly Plant gate. Read once after facilities load;
//    disables the [+ Design Engine] button and surfaces a small
//    "Requires an Engine Assembly Plant" notice in its place when
//    the corp doesn't own one. ──
function applyEngineDesignGate(hasPlant) {
    _hasEngineAssemblyPlant = !!hasPlant;
    const btn = document.querySelector('[data-am-action="design-engine"]');
    if (!btn) return;
    if (hasPlant) {
        btn.disabled = false;
        btn.classList.remove('disabled');
        btn.textContent = '+ Design Engine';
        const note = document.getElementById('co-design-engine-gate');
        if (note) note.remove();
    } else {
        btn.disabled = true;
        btn.classList.add('disabled');
        btn.textContent = '+ Design Engine';
        if (!document.getElementById('co-design-engine-gate')) {
            const note = document.createElement('div');
            note.id = 'co-design-engine-gate';
            note.className = 'am-modal-gate-note';
            note.style.flexBasis = '100%';
            note.style.order = '-1';
            note.textContent = 'Engine Assembly Plant Required for Engine Design';
            btn.parentElement.insertBefore(note, btn.parentElement.firstChild);
            // Allow the .co-panel-actions row to wrap so the note sits above.
            btn.parentElement.style.flexWrap = 'wrap';
        }

function recalcDesignEngine() {
    if (!_designEngineState) return;
    const c = ENGINE_MODULES.combustion[_designEngineState.combustion];
    const f = ENGINE_MODULES.frame[_designEngineState.frame];
    const ctrl = ENGINE_MODULES.control[_designEngineState.control];

    const thrust = +(c.thrust + f.thrust + ctrl.thrust).toFixed(2);
    const weight = +(c.weight + f.weight + ctrl.weight).toFixed(2);
    const eff = Math.min(100, Math.max(0, c.eff + f.eff + ctrl.eff));
    const rel = Math.min(100, Math.max(0, c.rel + f.rel + ctrl.rel));
    const quality = +(((Math.min(100, thrust * 10) + Math.max(0, (10 - weight) * 10) + eff + rel) / 4 / 10).toFixed(1));
    const costPerUnit = c.cost + f.cost + ctrl.cost + ENGINE_BASE_ASSEMBLY_COST;

    const $ = (id) => document.getElementById(id);
    $('am-summary-name').textContent = _designEngineState.name || 'Untitled Engine';
    $('am-summary-modules').textContent = `${c.name.toUpperCase()} ◊ ${f.name.toUpperCase()} ◊ ${ctrl.name.toUpperCase()}`;
    $('am-stat-thrust').textContent = thrust.toFixed(1);
    $('am-stat-weight').textContent = weight.toFixed(1);
    $('am-stat-eff').textContent    = eff;
    $('am-stat-rel').textContent    = rel;
    $('am-bar-thrust').style.width = Math.min(100, thrust * 10) + '%';
    $('am-bar-weight').style.width = Math.min(100, weight * 10) + '%';
    $('am-bar-eff').style.width    = eff + '%';
    $('am-bar-rel').style.width    = rel + '%';
    $('am-quality-value').textContent = quality.toFixed(1);
    $('am-cost-combustion').textContent = fmtCostShort(c.cost);
    $('am-cost-frame').textContent      = fmtCostShort(f.cost);
    $('am-cost-control').textContent    = fmtCostShort(ctrl.cost);
    $('am-cost-total').textContent      = fmtCostShort(costPerUnit);
    $('am-footer-cost').textContent     = fmtCostShort(costPerUnit);
    $('am-footer-quality').textContent  = quality.toFixed(1);
}

async function submitDesignEngine() {
    if (!_designEngineState) return;
    const overlay = document.getElementById('am-design-engine-modal');
    const submitBtn = overlay.querySelector('#am-modal-submit');
    const errEl = overlay.querySelector('#am-modal-error');
    const name = (overlay.querySelector('#am-engine-name').value || '').trim();
    if (!name) {
        errEl.textContent = 'Engine name required.';
        errEl.classList.add('show');
        return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting…';
    errEl.classList.remove('show');

    try {
        const { data, error } = await _supabase.rpc('start_engine_design_research', {
            p_corp_id:    _faction.id,
            p_name:       name,
            p_combustion: _designEngineState.combustion,
            p_frame:      _designEngineState.frame,
            p_control:    _designEngineState.control,
        });
        if (error) {
            errEl.textContent = error.message;
            errEl.classList.add('show');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Begin Research ▸';
            return;
        }
        if (!data?.success) {
            errEl.textContent = data?.error || 'Could not start research.';
            errEl.classList.add('show');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Begin Research ▸';
            return;
        }
        closeDesignEngineModal();
        await loadDesigns(_faction.id);
    } catch (err) {
        errEl.textContent = err?.message || 'Unknown error.';
        errEl.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Begin Research ▸';
    }
}

function applyAircraftDesignGate(hasFacility) {
    _hasAircraftAssemblyFacility = !!hasFacility;

        if (note) note.remove();
    } else {

            const note = document.createElement('div');
            note.id = 'co-design-aircraft-gate';

            note.style.flexBasis = '100%';
            note.style.order = '-1';
            note.textContent = 'Light Assembly Plant, Aircraft Assembly Facility, or Heavy Manufacturing Plant Required for Aircraft Design';
            btn.parentElement.insertBefore(note, btn.parentElement.firstChild);
            btn.parentElement.style.flexWrap = 'wrap';
        }
    }
}

// ── Engine catalog loader — pulls every Available engine design
//    across every Aviation Manufacturing corp in the game. RLS
//    permits SELECT on corp_aircraft_designs to all (read_all). On
//    transient fetch error we keep the prior cache rather than
//    wiping, so a single network blip can't lock the player out of
//    the modal. ──
async function loadAvailableEngineCatalog() {
    const { data, error } = await _supabase
        .from('corp_aircraft_designs')
        .select('id, name, thrust, weight, efficiency, reliability, quality, cost_per_unit, factions:corp_id(faction_name, abbreviation)')
        .eq('design_type', 'engine')
        .eq('status', 'available')
        .eq('is_active', true)
        .order('quality', { ascending: false });
    if (error) {
        console.warn('[aviation-ops] engine catalog fetch failed:', error.message);
        return;
    }
    _availableEngineCatalog = (data || []).map(row => ({
        id:           row.id,
        name:         row.name,
        thrust:       Number(row.thrust)        || 0,
        weight:       Number(row.weight)        || 0,
        efficiency:   Number(row.efficiency)    || 0,
        reliability:  Number(row.reliability)   || 0,
        quality:      Number(row.quality)       || 0,
        costPerUnit:  Number(row.cost_per_unit) || 0,
        corpAbbr:     row.factions?.abbreviation || '',
        corpName:     row.factions?.faction_name || '',
    }));
}

function recalcDesignAircraft() {
    if (!_designAircraftState) return;
    const overlay = document.getElementById('am-design-aircraft-modal');
    if (!overlay) return;

    const airframe = _aircraftDesignSpecs.airframes[_designAircraftState.airframe];
    const engine   = _availableEngineCatalog.find(e => e.id === _designAircraftState.engineId);
    if (!airframe || !engine) return;

    // Enforce engine count bounds for current airframe.
    overlay.querySelectorAll('.am-count-btn').forEach(btn => {
        const count = parseInt(btn.dataset.count, 10);
        const valid = count >= airframe.eng_min && count <= airframe.eng_max;
        btn.disabled = !valid;
        if (!valid && _designAircraftState.engineCount === count) {
            _designAircraftState.engineCount = airframe.eng_min;
        }
    });
    overlay.querySelectorAll('.am-count-btn').forEach(btn => {
        btn.classList.toggle('selected', parseInt(btn.dataset.count, 10) === _designAircraftState.engineCount);
    });

    const mechs  = Array.from(_designAircraftState.mechanicals).map(id => _aircraftDesignSpecs.mechanicals[id]).filter(Boolean);
    const offers = Array.from(_designAircraftState.offerings).map(id => _aircraftDesignSpecs.offerings[id]).filter(Boolean);

    const totalThrust = engine.thrust * _designAircraftState.engineCount;
    const engineWeight = engine.weight * _designAircraftState.engineCount;
    const moduleWeight = mechs.reduce((s,m) => s + m.weight, 0) + offers.reduce((s,o) => s + o.weight, 0);
    const totalWeight = airframe.weight + engineWeight + moduleWeight;
    const ratio = totalWeight > 0 ? (totalThrust / totalWeight) : 0;
    const isPhysical = ratio >= 1.0;

    const range = Math.min(10, Math.max(0, airframe.range * ratio));
    const passengers = airframe.pax + offers.reduce((s,o) => s + o.pax, 0);
    const reliabilityBonus = engine.reliability >= 70 ? 1 : 0;
    const offerDemand = offers.reduce((s,o) => s + o.demand, 0);
    const demand = Math.min(10, Math.max(0, 5 + offerDemand + reliabilityBonus));
    const mechSafety = mechs.reduce((s,m) => s + m.safety, 0);
    const engineSafetyMod = Math.floor((engine.reliability - 50) / 25);
    const safety = Math.min(10, Math.max(0, 5 + mechSafety + engineSafetyMod));

    const engineCost = engine.costPerUnit * _designAircraftState.engineCount;
    const mechCost   = mechs.reduce((s,m) => s + m.cost, 0);
    const offCost    = offers.reduce((s,o) => s + o.cost, 0);
    const totalCost  = airframe.cost + engineCost + mechCost + offCost;

    const engineTime = _designAircraftState.engineCount;
    const moduleTime = (mechs.length + offers.length) >= 2 ? 2 : 1;
    const totalTime  = airframe.time + engineTime + moduleTime;

    const $ = (id) => overlay.querySelector('#' + id);
    $('am-ac-summary-name').textContent = _designAircraftState.name || 'Untitled Aircraft';
    $('am-ac-summary-tier').textContent =
        `${airframe.name.toUpperCase()} ◊ ${_designAircraftState.engineCount}× ${engine.name.toUpperCase()} ENGINES ◊ TIER 1 BUILD`;

    $('am-ac-stat-range').textContent  = range.toFixed(1);
    $('am-ac-stat-pax').textContent    = String(passengers);
    $('am-ac-stat-demand').textContent = String(demand);
    $('am-ac-stat-safety').textContent = String(safety);
    $('am-ac-bar-range').style.width  = (range * 10) + '%';
    $('am-ac-bar-pax').style.width    = Math.min(100, (passengers / 60) * 100) + '%';
    $('am-ac-bar-demand').style.width = (demand * 10) + '%';
    $('am-ac-bar-safety').style.width = (safety * 10) + '%';

    const physicsDisplay = $('am-ac-physics-display');
    const physicsLabel   = $('am-ac-physics-label');
    const physicsStatus  = $('am-ac-physical-status');
    $('am-ac-physics-value').textContent = `${totalThrust.toFixed(1)} / ${totalWeight.toFixed(1)}`;
    if (ratio >= 1.5) {
        physicsDisplay.className = 'am-physics-display green';
        physicsLabel.textContent = `Ratio ${ratio.toFixed(2)} ◊ Excellent`;
        physicsStatus.className  = 'am-physical-status viable';
        physicsStatus.textContent = '◊ Physically Viable';
    } else if (ratio >= 1.0) {
        physicsDisplay.className = 'am-physics-display green';
        physicsLabel.textContent = `Ratio ${ratio.toFixed(2)} ◊ Viable`;
        physicsStatus.className  = 'am-physical-status viable';
        physicsStatus.textContent = '◊ Physically Viable';
    } else if (ratio >= 0.85) {
        physicsDisplay.className = 'am-physics-display warn';
        physicsLabel.textContent = `Ratio ${ratio.toFixed(2)} ◊ Underpowered`;
        physicsStatus.className  = 'am-physical-status invalid';
        physicsStatus.textContent = '⚠ Insufficient Thrust';
    } else {
        physicsDisplay.className = 'am-physics-display bad';
        physicsLabel.textContent = `Ratio ${ratio.toFixed(2)} ◊ Cannot Fly`;
        physicsStatus.className  = 'am-physical-status invalid';
        physicsStatus.textContent = '⚠ Cannot Fly';
    }

    $('am-ac-cost-airframe-name').textContent = airframe.name;
    $('am-ac-cost-airframe').textContent      = fmtCostShort(airframe.cost);
    $('am-ac-cost-engine-count').textContent  = String(_designAircraftState.engineCount);
    $('am-ac-cost-engine-name').textContent   = engine.name;
    $('am-ac-cost-engines').textContent       = fmtCostShort(engineCost);
    $('am-ac-cost-mech-count').textContent    = String(mechs.length);
    $('am-ac-cost-mechanical').textContent    = fmtCostShort(mechCost);
    $('am-ac-cost-off-count').textContent     = String(offers.length);
    $('am-ac-cost-offerings').textContent     = fmtCostShort(offCost);
    $('am-ac-cost-total').textContent         = fmtCostShort(totalCost);

    $('am-ac-time-airframe').textContent = `${airframe.time} ticks`;
    $('am-ac-time-engines').textContent  = `${engineTime} tick${engineTime === 1 ? '' : 's'}`;
    $('am-ac-time-modules').textContent  = `${moduleTime} tick${moduleTime === 1 ? '' : 's'}`;
    $('am-ac-time-total').textContent    = `${totalTime} ticks`;

    const footerCost = $('am-ac-footer-cost');
    footerCost.textContent = fmtCostShort(totalCost);
    footerCost.className = 'am-modal-footer-value' + (isPhysical ? '' : ' bad');
    $('am-ac-footer-range').textContent = range.toFixed(1);
    $('am-ac-footer-time').textContent  = `${totalTime} ticks`;

    $('am-engine-preview').innerHTML = `
        <span class="am-engine-pill thrust">Thrust ${engine.thrust.toFixed(1)}</span>
        <span class="am-engine-pill weight">Weight ${engine.weight.toFixed(1)}</span>
        <span class="am-engine-pill">Eff ${engine.efficiency}</span>
        <span class="am-engine-pill">Rel ${engine.reliability}</span>
        <span class="am-engine-pill">${fmtCostShort(engine.costPerUnit)} ea.</span>
    `;

    const submitBtn = $('am-ac-modal-submit');
    submitBtn.disabled = !isPhysical;
    submitBtn.textContent = isPhysical ? 'Begin Design ▸' : 'Cannot Fly — Adjust Design';
}

async function submitDesignAircraft() {
    if (!_designAircraftState) return;
    const overlay = document.getElementById('am-design-aircraft-modal');
    const submitBtn = overlay.querySelector('#am-ac-modal-submit');
    const errEl = overlay.querySelector('#am-ac-modal-error');
    const name = (overlay.querySelector('#am-aircraft-name').value || '').trim();
    if (!name) {
        errEl.textContent = 'Aircraft name required.';
        errEl.classList.add('show');
        return;
    }
    if (!_designAircraftState.engineId) {
        errEl.textContent = 'Pick an engine.';
        errEl.classList.add('show');
        return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting…';
    errEl.classList.remove('show');

    try {
        const { data, error } = await _supabase.rpc('start_aircraft_design_research', {
            p_corp_id:          _faction.id,
            p_name:             name,
            p_airframe:         _designAircraftState.airframe,
            p_engine_design_id: _designAircraftState.engineId,
            p_engine_count:     _designAircraftState.engineCount,
            p_mechanicals:      Array.from(_designAircraftState.mechanicals),
            p_offerings:        Array.from(_designAircraftState.offerings),
        });
        if (error) {
            errEl.textContent = error.message;
            errEl.classList.add('show');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Begin Design ▸';
            return;
        }
        if (!data?.success) {
            errEl.textContent = data?.error || 'Could not start design.';
            errEl.classList.add('show');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Begin Design ▸';
            return;
        }
        closeDesignAircraftModal();
        await loadDesigns(_faction.id);
    } catch (err) {
        errEl.textContent = err?.message || 'Unknown error.';
        errEl.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Begin Design ▸';
    }
}

// ── Volume discount tiers ────────────────────────────────────────
// Single source of truth lives in SQL: public.volume_discount_tiers().
// Fetched once per session, cached, and walked locally to drive the
// modal preview. Server (queue_production_run) reads the same source
// via volume_discount_for() so the preview cannot drift from the
// committed cost.
let _volumeDiscountTiers = null;   // [{min_qty, mult}] sorted ASC
async function loadVolumeDiscountTiers() {
    if (_volumeDiscountTiers) return _volumeDiscountTiers;
    const { data, error } = await _supabase.rpc('volume_discount_tiers');
    if (error) {
        console.warn('[aviation-ops] volume_discount_tiers fetch failed:', error.message);
        _volumeDiscountTiers = [{ min_qty: 1, mult: 1.00 }];
        return _volumeDiscountTiers;
    }
    _volumeDiscountTiers = (data || []).slice().sort((a, b) => a.min_qty - b.min_qty);
    return _volumeDiscountTiers;
}
function volumeDiscount(qty) {
    const tiers = _volumeDiscountTiers || [{ min_qty: 1, mult: 1.00 }];
    let mult = 1.00;
    for (const t of tiers) if (qty >= t.min_qty) mult = Number(t.mult);
    return mult;
}
function tierLabel(tier, nextTier) {
    if (!nextTier) return `${tier.min_qty}+ units`;
    const top = nextTier.min_qty - 1;
    if (top === tier.min_qty) return `${tier.min_qty} unit${tier.min_qty === 1 ? '' : 's'}`;
    return `${tier.min_qty}-${top} units`;
}
function activeTierIndex(qty) {
    const tiers = _volumeDiscountTiers || [];
    let idx = 0;
    for (let i = 0; i < tiers.length; i++) if (qty >= tiers[i].min_qty) idx = i;
    return idx;
}

// ── Time-per-unit (build ticks) per design class ────────────────
// Single source of truth: public.time_per_unit_tiers(). Returns a
// flat key→ticks map (engine + the four airframe classes).
// queue_production_run reads it via time_per_unit_for(); the client
// fetches it once per session and walks locally for the live build-
// time preview.
let _timePerUnitTiers = null;
async function loadTimePerUnitTiers() {
    if (_timePerUnitTiers) return _timePerUnitTiers;
    const { data, error } = await _supabase.rpc('time_per_unit_tiers');
    if (error) {
        console.warn('[aviation-ops] time_per_unit_tiers fetch failed:', error.message);
        _timePerUnitTiers = {};
        return _timePerUnitTiers;
    }
    _timePerUnitTiers = data || {};
    return _timePerUnitTiers;
}
function timePerUnitFor(designType, airframeClass) {
    const tiers = _timePerUnitTiers || {};
    if (designType === 'engine')   return Number(tiers.engine) || 8;
    if (designType === 'aircraft') return Number(tiers[airframeClass]) || 8;
    return 8;
}

async function loadProductionQueueData(corpId) {
    // Pull this corp's Available designs (engines + aircraft), this
    // corp's industrial facilities, and current plant occupancy
    // across all active runs (any corp's, since the property_id index
    // is global).
    const [designsRes, plantsRes, runsRes] = await Promise.all([
        _supabase.from('corp_aircraft_designs')
            .select('id, name, design_type, airframe_class, cost_per_unit, inventory_on_hand, engine_count, engine_design_id, thrust, weight, quality, passengers, range_nm')
            .eq('corp_id', corpId)
            .eq('status', 'available')
            .eq('is_active', true)
            .order('design_type', { ascending: false })
            .order('name'),
        _supabase.from('corp_properties')
            .select('id, name, type, city, condition')
            .eq('faction_id', corpId)
            .eq('is_active', true)
            .in('type', ['light_assembly_plant', 'aircraft_assembly_facility', 'heavy_manufacturing_plant', 'engine_assembly_plant']),
        _supabase.from('corp_production_run_plants')
            .select('property_id, corp_production_runs!inner(status)'),
    ]);

    if (designsRes.error) console.warn('[aviation-ops] designs fetch failed:', designsRes.error.message);
    if (plantsRes.error)  console.warn('[aviation-ops] plants fetch failed:',  plantsRes.error.message);
    if (runsRes.error)    console.warn('[aviation-ops] run-plants fetch failed:', runsRes.error.message);

    _ownDesignsCache = designsRes.data || [];
    _ownPlantsCache  = plantsRes.data || [];

    const occ = {};
    for (const row of (runsRes.data || [])) {
        if (row.corp_production_runs?.status !== 'active') continue;
        occ[row.property_id] = (occ[row.property_id] || 0) + 1;
    }
    _plantOccupancyCache = occ;
}

function plantHasFreeSlot(plant) {
    const cap = PLANT_SIMULTANEOUS_BUILDS[plant.type] || 1;
    const used = _plantOccupancyCache[plant.id] || 0;
    return used < cap;
}

function isPlantEligibleFor(plant, design) {
    if (!plant || !design) return false;
    if (!plantHasFreeSlot(plant)) return false;
    const allowed = PLANT_TYPE_COMPAT[plant.type] || [];
    if (design.design_type === 'engine')  return allowed.includes('engine');
    if (design.design_type === 'aircraft') return allowed.includes(design.airframe_class);
    return false;
}
