<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Your Party | Nationhood Alpha</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #0e0e0c;
  --bg-1: #1a1a1a;
  --bg-2: #1a1a17;
  --bg-3: #252525;
  --bg-4: #24241f;
  --bg-5: #2c2c26;
  --bg-hover: #282822;
  --text-bright: #f0efe6;
  --text-primary: #c4c2b8;
  --text-secondary: #888;
  --text-muted: #666;
  --text-dim: #4a4940;
  --text-ghost: #333229;
  --border-hair: rgba(255,255,255,0.04);
  --border-0: rgba(255,255,255,0.06);
  --border-1: rgba(255,255,255,0.08);
  --border-2: rgba(255,255,255,0.12);
  --green: #5cb85c;
  --green-faint: rgba(92,184,92,0.08);
  --green-border: rgba(92,184,92,0.18);
  --red: #d9534f;
  --red-faint: rgba(217,83,79,0.08);
  --red-border: rgba(217,83,79,0.18);
  --amber: #c8a64e;
  --amber-faint: rgba(200,166,78,0.08);
  --amber-border: rgba(200,166,78,0.18);
  --blue: #5b9bd5;
  --blue-faint: rgba(91,155,213,0.08);
  --blue-border: rgba(91,155,213,0.18);
  --purple: #8b7ec8;
  --purple-faint: rgba(139,126,200,0.08);
  --purple-border: rgba(139,126,200,0.18);
  --font-mono: 'JetBrains Mono', monospace;
  --font-ui: 'IBM Plex Sans', -apple-system, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg-0);
  color: var(--text-primary);
  font-family: var(--font-ui);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.page-header {
  text-align: center;
  padding: 48px 0 16px;
  max-width: 560px;
}
.page-header h1 {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.page-header .title {
  font-family: var(--font-ui);
  font-size: 18px;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 6px;
}
.page-header .subtitle {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  line-height: 1.5;
}

/* Ideology summary bar */
.ideo-bar {
  width: 100%;
  max-width: 560px;
  background: var(--bg-2);
  border: 1px solid var(--border-0);
  padding: 10px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.ideo-bar .label {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--text-secondary);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.ideo-bar .tags {
  display: flex;
  gap: 6px;
}
.ideo-tag {
  font-family: var(--font-mono);
  font-size: 8.5px;
  font-weight: 700;
  padding: 2px 8px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  border: 1px solid currentColor;
}

/* Form panel */
.form-panel {
  width: 100%;
  max-width: 560px;
  background: var(--bg-2);
  border: 1px solid var(--border-0);
  margin-bottom: 8px;
}
.form-panel__header {
  background: var(--bg-3);
  border-bottom: 1px solid var(--border-hair);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.form-panel__dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
}
.form-panel__title {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--text-secondary);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.form-panel__body {
  padding: 12px;
}

/* Input styling */
.input-group {
  margin-bottom: 14px;
}
.input-group:last-child {
  margin-bottom: 0;
}
.input-label {
  display: block;
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--text-secondary);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.input-label .hint {
  font-weight: 400;
  color: var(--text-muted);
  text-transform: none;
  letter-spacing: 0;
}
input[type="text"], textarea {
  width: 100%;
  padding: 8px 10px;
  background: var(--bg-1);
  border: 1px solid var(--border-1);
  color: var(--text-bright);
  font-family: var(--font-ui);
  font-size: 12px;
  transition: border-color 0.15s;
}
input[type="text"]:focus, textarea:focus {
  outline: none;
  border-color: var(--border-2);
}
textarea {
  resize: vertical;
  min-height: 48px;
  font-family: var(--font-ui);
}
.char-counter {
  text-align: right;
  font-family: var(--font-mono);
  font-size: 8px;
  color: var(--text-ghost);
  margin-top: 3px;
}
.inline-fields {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 10px;
}

/* Color palette */
.cp-color-palette {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.cp-swatch {
  width: 24px;
  height: 24px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: border-color 0.15s;
}
.cp-swatch:hover { border-color: var(--border-2); }
.cp-swatch.active { border-color: var(--text-bright); }
.cp-hex-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
}
.cp-hex-input {
  width: 72px;
  background: var(--bg-1);
  border: 1px solid var(--border-1);
  color: var(--text-bright);
  padding: 4px 6px;
  font-family: var(--font-mono);
  font-size: 10px;
}
.cp-hex-input:focus { outline: none; border-color: var(--border-2); }
.cp-color-preview {
  width: 18px;
  height: 18px;
  border: 1px solid var(--border-1);
}

/* Logo grid */
.cp-logo-grid {
  max-height: 180px;
  overflow-y: auto;
  border: 1px solid var(--border-0);
  padding: 6px;
  background: var(--bg-1);
}
.cp-icon-cat {
  font-family: var(--font-mono);
  font-size: 7px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-ghost);
  margin: 4px 0 3px;
  padding-bottom: 2px;
  border-bottom: 1px solid var(--border-hair);
}
.cp-icon-cat:first-child { margin-top: 0; }
.cp-icon-row {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  margin-bottom: 3px;
}
.cp-icon-opt {
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: 1px solid transparent;
  background: var(--bg-3);
  color: var(--text-secondary);
  transition: border-color 0.15s, background 0.15s;
}
.cp-icon-opt:hover { background: var(--bg-hover); border-color: var(--border-1); }
.cp-icon-opt.active { border-color: var(--amber); background: var(--amber-faint); }

/* Preview card */
.preview-card {
  width: 100%;
  max-width: 560px;
  background: var(--bg-2);
  border: 1px solid var(--border-0);
  margin-bottom: 12px;
}
.preview-card__header {
  background: var(--bg-3);
  border-bottom: 1px solid var(--border-hair);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.preview-card__body {
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.preview-logo {
  width: 36px;
  height: 36px;
  background: var(--bg-4);
  border: 1px solid var(--border-0);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
}
.preview-info {
  flex: 1;
}
.preview-name {
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 700;
  color: var(--text-bright);
}
.preview-abbr {
  font-family: var(--font-mono);
  font-size: 8.5px;
  font-weight: 700;
  padding: 1px 6px;
  display: inline-block;
  margin-left: 6px;
}
.preview-desc {
  font-family: var(--font-ui);
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* Action buttons */
.action-bar {
  width: 100%;
  max-width: 560px;
  display: flex;
  justify-content: space-between;
  padding-bottom: 48px;
}
.btn {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  padding: 7px 14px;
  background: var(--bg-3);
  border: 1px solid var(--border-0);
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.btn:hover {
  background: var(--bg-4);
  color: var(--text-secondary);
  border-color: var(--border-1);
}
.btn-next {
  background: var(--bg-3);
}
.btn-next:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}
.btn-next.ready {
  background: var(--green-faint);
  color: var(--green);
  border-color: var(--green-border);
}
.btn-next.ready:hover {
  background: rgba(92,184,92,0.14);
}

.error-msg {
  width: 100%;
  max-width: 560px;
  background: var(--red-faint);
  border: 1px solid var(--red-border);
  border-left: 3px solid var(--red);
  color: var(--red);
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 8px 12px;
  margin-bottom: 12px;
  display: none;
}

.loading-msg {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  text-align: center;
  padding: 80px 20px;
}

/* ── Mobile ── */
@media (max-width: 480px) {
  .inline-fields { grid-template-columns: 1fr; }
  .ideo-card { padding: 8px 10px; }
  .ideo-card .ideo-name { font-size: 11px; }
  .ideo-card .ideo-desc { font-size: 9px; }
  .form-panel { padding: 14px; }
  .cp-swatch { width: 20px; height: 20px; }
}
</style>
</head>
<body>

<div id="loading" class="loading-msg">AUTHENTICATING...</div>

<div id="page-content" style="display:none;">
  <div class="page-header">
    <h1>Step 3 of 3</h1>
    <div class="title">Build Your Party</div>
    <div class="subtitle">Name your political party, choose a color and logo. This is how other players will see you.</div>
  </div>

  <div class="ideo-bar">
    <span class="label">Ideology</span>
    <div class="tags" id="ideo-tags"></div>
  </div>

  <div id="error-message" class="error-msg"></div>

  <!-- Name + Abbreviation -->
  <div class="form-panel">
    <div class="form-panel__header">
      <div class="form-panel__dot" style="background:var(--blue)"></div>
      <span class="form-panel__title">Identity</span>
    </div>
    <div class="form-panel__body">
      <div class="inline-fields">
        <div class="input-group">
          <label class="input-label">Party Name</label>
          <input type="text" id="party-name" placeholder="The Progressive Workers Alliance" maxlength="100">
        </div>
        <div class="input-group">
          <label class="input-label">Abbreviation</label>
          <input type="text" id="party-abbr" placeholder="PWA" maxlength="4" style="text-transform:uppercase; font-family:var(--font-mono); font-weight:700; letter-spacing:0.1em;">
          <div class="char-counter"><span id="abbr-counter">0</span>/4</div>
        </div>
      </div>
      <div class="input-group">
        <label class="input-label">Description <span class="hint">(optional, max 200 chars)</span></label>
        <textarea id="party-desc" maxlength="200" rows="2" placeholder="A brief description of your party's platform..."></textarea>
      </div>
    </div>
  </div>

  <!-- Color -->
  <div class="form-panel">
    <div class="form-panel__header">
      <div class="form-panel__dot" style="background:var(--amber)"></div>
      <span class="form-panel__title">Color</span>
    </div>
    <div class="form-panel__body">
      <div id="cp-color-palette" class="cp-color-palette"></div>
      <div class="cp-hex-row">
        <span style="font-family:var(--font-mono);font-size:8px;color:var(--text-ghost);text-transform:uppercase;letter-spacing:0.08em;">Custom</span>
        <input type="text" id="cp-custom-hex" class="cp-hex-input" maxlength="7" placeholder="#E63946">
        <div id="cp-color-preview" class="cp-color-preview"></div>
      </div>
    </div>
  </div>

  <!-- Logo -->
  <div class="form-panel">
    <div class="form-panel__header">
      <div class="form-panel__dot" style="background:var(--teal)"></div>
      <span class="form-panel__title">Logo</span>
    </div>
    <div class="form-panel__body">
      <div id="cp-logo-grid" class="cp-logo-grid"></div>
    </div>
  </div>

  <!-- Preview -->
  <div class="preview-card" id="preview-card" style="display:none;">
    <div class="preview-card__header">
      <div class="form-panel__dot" style="background:var(--green)"></div>
      <span class="form-panel__title">Preview</span>
    </div>
    <div class="preview-card__body">
      <div class="preview-logo" id="preview-logo"></div>
      <div class="preview-info">
        <span class="preview-name" id="preview-name"></span>
        <span class="preview-abbr" id="preview-abbr"></span>
        <div class="preview-desc" id="preview-desc"></div>
      </div>
    </div>
  </div>

  <div class="action-bar">
    <button class="btn" onclick="goBack()">&#x25C0; BACK</button>
    <button class="btn btn-next" id="btn-next" disabled onclick="proceed()">CREATE PARTY &#x25B6;</button>
  </div>
</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { PARTY_ICONS, PARTY_COLOR_PALETTE, DEFAULT_PARTY_ICON, getPartyIconSVG, getDefaultPartyColor } from './js/party-icons.js';
import { escapeHtml } from './js/utils.js';

const urlParams = new URLSearchParams(window.location.search);
const ideology1 = urlParams.get('ideology1');
const ideology2 = urlParams.get('ideology2');

// Leader name pools (default: Crucera / Spanish)
const CRUCERA_FIRST_NAMES = [
  'Alejandro','Camila','Diego','Valentina','Mateo','Isabela','Sebastian','Luca',
  'Andres','Gabriel','Joaquin','Mariana','Carlos','Tomas','Rafael','Edwin',
  'Emilio','Catalina','Fernando','Renata'
];
const CRUCERA_LAST_NAMES = [
  'Velasco','Mendoza','Guerrero','Salazar','Castillo','Herrera','Morales','Rios',
  'Delgado','Espinoza','Guzman','Navarro','Cordoba','Echeverria','Pacheco','Montero',
  'Aguilar','Valenzuela','Carrasco','Ibarra'
];

// Calveth names (Danish)
const CALVETH_FIRST = [
  'Lukas','Noah','Victor','Oliver','Oscar','William','Emil','Alfred',
  'Magnus','Mads','Frederik','Christian','Mikkel','Anders','Lars',
  'Alma','Ida','Clara','Ella','Freja'
];
const CALVETH_LAST = [
  'Jensen','Nielsen','Hansen','Pedersen','Andersen','Christensen',
  'Larsen','Sørensen','Rasmussen','Jørgensen','Petersen','Madsen',
  'Kristensen','Olsen','Thomsen','Frederiksen','Mikkelsen','Henriksen'
];

// Flandis names (Dutch)
const FLANDIS_FIRST = [
  'Anneliese','Bregje','Clasien','Dymphna','Elske','Fenna','Grietje','Hanneke',
  'Ilse','Jobke','Karlijn','Lieselotte','Maaike','Nienke','Roos',
  'Adriaan','Bastiaan','Casper','Damiaan','Evert','Floris','Gerben','Harmen',
  'Ivo','Jasper','Klaas','Laurens','Maarten','Niels','Olaf','Pieter',
  'Quinten','Reinier','Sander','Thijs','Uwe','Valentijn','Wessel','Xander',
  'Yorick','Zeger','Arjen','Bram','Cor','Daan','Egbert','Folkert','Gijs','Hedzer','Imro'
];
const FLANDIS_LAST = [
  'Bakker','Bos','Bosman','Brouwer','De Graaf','De Jong','De Vries','De Wit',
  'Dekker','Dijkstra','Dijk','Driessen','Gerritsen','Hendriks','Hermans',
  'Hoekstra','Huisman','Jacobs','Janssen','Koster','Kuiper','Lammers','Maas',
  'Meijer','Mulder','Peters','Pieters','Pijpers','Post','Prins','Smit',
  'Smits','Snel','Snoek','Timmers','Van Dam','Van den Berg','Van den Bosch',
  'Van der Laan','Van der Meer','Van Dijk','Van Houten','Van Leeuwen','Van Rijn',
  'Vermeer','Visser','Willems','Wolff','Zijlstra','Zwart'
];

// Nation-aware name selection
const NATION_NAMES = {
  'Calveth': { first: CALVETH_FIRST, last: CALVETH_LAST },
  'Flandis': { first: FLANDIS_FIRST, last: FLANDIS_LAST }
};
function getNamePool(nationName) {
  const pool = NATION_NAMES[nationName];
  return pool || { first: CRUCERA_FIRST_NAMES, last: CRUCERA_LAST_NAMES };
}

// Ideology axis mapping
const IDEOLOGY_AXIS_MAP = {
  'Liberty':       { axis: 'liberty_equality',           dir: -1 },
  'Equality':      { axis: 'liberty_equality',           dir:  1 },
  'Tradition':     { axis: 'tradition_progress',         dir: -1 },
  'Progress':      { axis: 'tradition_progress',         dir:  1 },
  'Security':      { axis: 'security_freedom',           dir: -1 },
  'Freedom':       { axis: 'security_freedom',           dir:  1 },
  'Globalism':     { axis: 'globalism_nationalism',      dir: -1 },
  'Nationalism':   { axis: 'globalism_nationalism',      dir:  1 },
  'Individualism': { axis: 'individualism_collectivism', dir: -1 },
  'Collectivism':  { axis: 'individualism_collectivism', dir:  1 }
};

let currentUser = null;
let nationData = null;
let _cpSelectedColor = null;
let _cpSelectedLogo = DEFAULT_PARTY_ICON;

async function init() {
  const { data: { user } } = await _supabase.auth.getUser();
  if (!user) { window.location.href = 'login.html'; return; }
  currentUser = user;

  // Check if user already has a party
  const { data: faction } = await _supabase
    .from('factions').select('id, nation_id').eq('id', user.id).eq('faction_type', 'party').maybeSingle();
  if (faction && faction.nation_id) {
    window.location.href = 'dashboard.html';
    return;
  }

  // Load pending nation from sessionStorage
  const rawNation = sessionStorage.getItem('nationhood_pending_nation');
  if (!rawNation) {
    window.location.href = 'select-nation.html';
    return;
  }
  nationData = JSON.parse(rawNation);
  if (!nationData.id) {
    window.location.href = 'select-nation.html';
    return;
  }

  if (!ideology1 || !ideology2) {
    window.location.href = 'faction-select.html';
    return;
  }

  // Show ideology tags with per-ideology colors
  const IDEOLOGY_COLORS = {
    'Liberty': '#3b82f6', 'Equality': '#ef4444',
    'Tradition': '#a855f7', 'Progress': '#22c55e',
    'Security': '#f59e0b', 'Freedom': '#06b6d4',
    'Globalism': '#14b8a6', 'Nationalism': '#f97316',
    'Individualism': '#eab308', 'Collectivism': '#ec4899'
  };
  function ideoTagHtml(label) {
    const c = IDEOLOGY_COLORS[label] || 'var(--purple)';
    return `<span class="ideo-tag" style="color:${c};border-color:${c};background:${c}18">${escapeHtml(label)}</span>`;
  }
  document.getElementById('ideo-tags').innerHTML = ideoTagHtml(ideology1) + ideoTagHtml(ideology2);

  setupColorPicker();
  setupLogoPicker();
  setupValidation();

  document.getElementById('loading').style.display = 'none';
  document.getElementById('page-content').style.display = 'flex';
  document.getElementById('page-content').style.flexDirection = 'column';
  document.getElementById('page-content').style.alignItems = 'center';
  document.getElementById('page-content').style.width = '100%';
}

function setupColorPicker() {
  const paletteEl = document.getElementById('cp-color-palette');
  const defaultColor = getDefaultPartyColor(0);
  _cpSelectedColor = defaultColor;
  paletteEl.innerHTML = PARTY_COLOR_PALETTE.map(c => {
    const isActive = c.hex === defaultColor;
    return `<div class="cp-swatch ${isActive ? 'active' : ''}" data-hex="${c.hex}" style="background:${c.hex};" title="${c.label}" onclick="onCpSelectColor('${c.hex}')"></div>`;
  }).join('');
  const hexInput = document.getElementById('cp-custom-hex');
  if (hexInput) hexInput.value = defaultColor;
  const preview = document.getElementById('cp-color-preview');
  if (preview) preview.style.background = defaultColor;
}

function setupLogoPicker() {
  const logoEl = document.getElementById('cp-logo-grid');
  let html = '';
  const categories = {};
  for (const [key, icon] of Object.entries(PARTY_ICONS)) {
    if (!categories[icon.category]) categories[icon.category] = [];
    categories[icon.category].push({ key, ...icon });
  }
  for (const [cat, icons] of Object.entries(categories)) {
    html += `<div class="cp-icon-cat">${cat}</div><div class="cp-icon-row">`;
    html += icons.map(ic => {
      const isActive = ic.key === DEFAULT_PARTY_ICON;
      return `<div class="cp-icon-opt ${isActive ? 'active' : ''}" data-icon="${ic.key}" title="${ic.label}" onclick="onCpSelectLogo('${ic.key}')">${getPartyIconSVG(ic.key, 18)}</div>`;
    }).join('');
    html += `</div>`;
  }
  logoEl.innerHTML = html;
}

function setupValidation() {
  const nameInput = document.getElementById('party-name');
  const abbrInput = document.getElementById('party-abbr');
  const descInput = document.getElementById('party-desc');
  const abbrCounter = document.getElementById('abbr-counter');

  nameInput.addEventListener('input', () => { validateForm(); updatePreview(); });
  descInput.addEventListener('input', updatePreview);
  abbrInput.addEventListener('input', () => {
    abbrInput.value = abbrInput.value.toUpperCase();
    abbrCounter.textContent = abbrInput.value.length;
    validateForm();
    updatePreview();
  });
}

function validateForm() {
  const name = document.getElementById('party-name').value.trim();
  const abbr = document.getElementById('party-abbr').value.trim();
  const btn = document.getElementById('btn-next');
  const valid = name.length > 0 && abbr.length >= 2 && abbr.length <= 4;
  btn.disabled = !valid;
  btn.classList.toggle('ready', valid);
}

function updatePreview() {
  const name = document.getElementById('party-name').value.trim();
  const abbr = document.getElementById('party-abbr').value.trim();
  const desc = document.getElementById('party-desc').value.trim();
  const card = document.getElementById('preview-card');

  if (!name) { card.style.display = 'none'; return; }
  card.style.display = 'block';

  const logoEl = document.getElementById('preview-logo');
  logoEl.innerHTML = getPartyIconSVG(_cpSelectedLogo, 22);
  logoEl.style.color = _cpSelectedColor || 'var(--text-secondary)';

  const nameEl = document.getElementById('preview-name');
  nameEl.textContent = name;

  const abbrEl = document.getElementById('preview-abbr');
  if (abbr) {
    abbrEl.textContent = abbr;
    abbrEl.style.display = 'inline-block';
    abbrEl.style.background = _cpSelectedColor ? _cpSelectedColor + '22' : 'var(--blue-faint)';
    abbrEl.style.color = _cpSelectedColor || 'var(--blue)';
    abbrEl.style.border = '1px solid ' + (_cpSelectedColor ? _cpSelectedColor + '44' : 'var(--blue-border)');
  } else {
    abbrEl.style.display = 'none';
  }

  const descEl = document.getElementById('preview-desc');
  descEl.textContent = desc || '';
}

function onCpSelectColor(hex) {
  _cpSelectedColor = hex;
  document.querySelectorAll('.cp-swatch').forEach(el => {
    el.classList.toggle('active', el.dataset.hex === hex);
  });
  const hexInput = document.getElementById('cp-custom-hex');
  if (hexInput) hexInput.value = hex;
  const preview = document.getElementById('cp-color-preview');
  if (preview) preview.style.background = hex;
  updatePreview();
}

function onCpHexInput(el) {
  let val = el.value.trim();
  if (!val.startsWith('#')) val = '#' + val;
  if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
    _cpSelectedColor = val;
    document.querySelectorAll('.cp-swatch').forEach(s => {
      s.classList.toggle('active', s.dataset.hex.toUpperCase() === val.toUpperCase());
    });
    const preview = document.getElementById('cp-color-preview');
    if (preview) preview.style.background = val;
    updatePreview();
  }
}

function onCpSelectLogo(key) {
  _cpSelectedLogo = key;
  document.querySelectorAll('.cp-icon-opt').forEach(el => {
    el.classList.toggle('active', el.dataset.icon === key);
  });
  updatePreview();
}

function goBack() {
  window.location.href = 'faction-select.html';
}

async function proceed() {
  const name = document.getElementById('party-name').value.trim();
  const abbr = document.getElementById('party-abbr').value.trim();
  const desc = document.getElementById('party-desc').value.trim();

  if (!name || abbr.length < 2 || abbr.length > 4) return;

  const btn = document.getElementById('btn-next');
  btn.disabled = true;
  btn.textContent = 'CREATING...';

  // Clear cached state
  sessionStorage.removeItem('nationhood_state');

  try {
    // Get current tick
    const { data: shardData } = await _supabase
      .from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const currentTick = shardData?.current_tick || 0;

    // Generate leader (nation-aware name pool)
    const namePool = getNamePool(nationData.name);
    const leader = {
      first: namePool.first[Math.floor(Math.random() * namePool.first.length)],
      last: namePool.last[Math.floor(Math.random() * namePool.last.length)],
      age: 35 + Math.floor(Math.random() * 20)
    };

    // Create faction record
    const { error: upsertError } = await _supabase
      .from('factions')
      .upsert({
        id: currentUser.id,
        faction_type: 'party',
        faction_name: name,
        nation_id: nationData.id,
        nation: nationData.name,
        abbreviation: abbr,
        ideology_value_1: ideology1,
        ideology_value_2: ideology2,
        seats: 0,
        needs_rebuild: false,
        party_color: _cpSelectedColor || null,
        party_logo: _cpSelectedLogo || 'star',
        party_description: desc || null,
        leader_first_name: leader.first,
        leader_last_name: leader.last,
        leader_age: leader.age,
        founded_tick: currentTick,
        action_points: 5,
        abandoned_at: null
      });

    if (upsertError) throw upsertError;

    // Initialize ideology spectrum
    const m1 = IDEOLOGY_AXIS_MAP[ideology1];
    const m2 = IDEOLOGY_AXIS_MAP[ideology2];

    if (m1 && m2) {
      const { error: rpcError } = await _supabase.rpc('initialize_faction_ideology', {
        p_faction_id: currentUser.id,
        p_ideology_1: ideology1,
        p_ideology_2: ideology2
      });

      if (rpcError) {
        const row = {
          faction_id: currentUser.id,
          liberty_equality: 0,
          tradition_progress: 0,
          security_freedom: 0,
          globalism_nationalism: 0,
          individualism_collectivism: 0,
          declared_axis_1: m1.axis,
          declared_direction_1: m1.dir,
          declared_axis_2: m2.axis,
          declared_direction_2: m2.dir
        };
        row[m1.axis] = 30 * m1.dir;
        row[m2.axis] = 30 * m2.dir;

        await _supabase.from('faction_ideology').upsert(row, { onConflict: 'faction_id' });
      }
    }

    // Bloc approval seeding removed — electorate engine handles vote share now

    // Pre-cache state so dashboard loads instantly without a re-query
    // (avoids race where the faction isn't found on a fresh DB read)
    try {
      const { data: freshFaction } = await _supabase
        .from('factions').select('*').eq('id', currentUser.id).single();
      const { data: freshShard } = await _supabase
        .from('shard').select('*').eq('name', 'Alpha Shard').single();
      if (freshFaction && nationData) {
        const state = {
          user: currentUser,
          faction: freshFaction,
          nation: nationData,
          shard: freshShard,
          timestamp: Date.now()
        };
        sessionStorage.setItem('nationhood_state', JSON.stringify(state));
      }
    } catch (e) { console.warn('Pre-cache failed (non-blocking):', e); }

    // Clean up and redirect
    sessionStorage.removeItem('nationhood_pending_nation');
    sessionStorage.removeItem('nationhood_pending_party');
    window.location.href = 'dashboard.html';

  } catch (error) {
    console.error('Error creating party:', error);
    const errEl = document.getElementById('error-message');
    errEl.textContent = 'Error: ' + error.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'CREATE PARTY';
    btn.classList.add('ready');
  }
}

// Add oninput handler for custom hex
document.getElementById('cp-custom-hex').addEventListener('input', function() { onCpHexInput(this); });

init();

window.goBack = goBack;
window.proceed = proceed;
window.onCpSelectColor = onCpSelectColor;
window.onCpSelectLogo = onCpSelectLogo;
</script>
</body>
</html>
