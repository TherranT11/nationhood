<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Your Party | Nationhood Alpha</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #0e0e0c;
  --bg-1: #1a1a1a;
  --bg-2: #1a1a17;
  --bg-3: #252525;
  --bg-4: #24241f;
  --bg-5: #2c2c26;
  --bg-hover: #282822;
  --text-bright: #f0efe6;
  --text-primary: #c4c2b8;
  --text-secondary: #888;
  --text-muted: #666;
  --text-dim: #4a4940;
  --text-ghost: #333229;
  --border-hair: rgba(255,255,255,0.04);
  --border-0: rgba(255,255,255,0.06);
  --border-1: rgba(255,255,255,0.08);
  --border-2: rgba(255,255,255,0.12);
  --green: #5cb85c;
  --green-faint: rgba(92,184,92,0.08);
  --green-border: rgba(92,184,92,0.18);
  --red: #d9534f;
  --red-faint: rgba(217,83,79,0.08);
  --red-border: rgba(217,83,79,0.18);
  --amber: #c8a64e;
  --amber-faint: rgba(200,166,78,0.08);
  --amber-border: rgba(200,166,78,0.18);
  --blue: #5b9bd5;
  --blue-faint: rgba(91,155,213,0.08);
  --blue-border: rgba(91,155,213,0.18);
  --purple: #8b7ec8;
  --purple-faint: rgba(139,126,200,0.08);
  --purple-border: rgba(139,126,200,0.18);
  --font-mono: 'JetBrains Mono', monospace;
  --font-ui: 'IBM Plex Sans', -apple-system, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg-0);
  color: var(--text-primary);
  font-family: var(--font-ui);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px;
}

.page-header {
  text-align: center;
  padding: 48px 0 16px;
  max-width: 560px;
}
.page-header h1 {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.page-header .title {
  font-family: var(--font-ui);
  font-size: 18px;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 6px;
}
.page-header .subtitle {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  line-height: 1.5;
}

/* Form panel */
.form-panel {
  width: 100%;
  max-width: 560px;
  background: var(--bg-2);
  border: 1px solid var(--border-0);
  margin-bottom: 8px;
}
.form-panel__header {
  background: var(--bg-3);
  border-bottom: 1px solid var(--border-hair);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.form-panel__dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
}
.form-panel__title {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--text-secondary);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.form-panel__body {
  padding: 12px;
}

/* Input styling */
.input-group {
  margin-bottom: 14px;
}
.input-group:last-child {
  margin-bottom: 0;
}
.input-label {
  display: block;
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--text-secondary);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.input-label .hint {
  font-weight: 400;
  color: var(--text-muted);
  text-transform: none;
  letter-spacing: 0;
}
input[type="text"], textarea {
  width: 100%;
  padding: 8px 10px;
  background: var(--bg-1);
  border: 1px solid var(--border-1);
  color: var(--text-bright);
  font-family: var(--font-ui);
  font-size: 12px;
  transition: border-color 0.15s;
}
input[type="text"]:focus, textarea:focus {
  outline: none;
  border-color: var(--border-2);
}
textarea {
  resize: vertical;
  min-height: 48px;
  font-family: var(--font-ui);
}
.char-counter {
  text-align: right;
  font-family: var(--font-mono);
  font-size: 8px;
  color: var(--text-ghost);
  margin-top: 3px;
}
.inline-fields {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 10px;
}

/* Color palette */
.cp-color-palette {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.cp-swatch {
  width: 24px;
  height: 24px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: border-color 0.15s;
}
.cp-swatch:hover { border-color: var(--border-2); }
.cp-swatch.active { border-color: var(--text-bright); }
.cp-hex-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
}
.cp-hex-input {
  width: 72px;
  background: var(--bg-1);
  border: 1px solid var(--border-1);
  color: var(--text-bright);
  padding: 4px 6px;
  font-family: var(--font-mono);
  font-size: 10px;
}
.cp-hex-input:focus { outline: none; border-color: var(--border-2); }
.cp-color-preview {
  width: 18px;
  height: 18px;
  border: 1px solid var(--border-1);
}

/* Archetype grid */
.cp-archetype-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}
@media (max-width: 600px) { .cp-archetype-grid { grid-template-columns: 1fr; } }
.cp-archetype-card {
  background: var(--bg-2);
  border: 1px solid var(--border-1);
  padding: 10px 12px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.cp-archetype-card:hover { border-color: var(--border-2); }
.cp-archetype-card.active {
  border-color: var(--purple, #b794f6);
  background: rgba(183, 148, 246, 0.06);
}
.cp-archetype-name {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-bright);
  margin-bottom: 4px;
}
.cp-archetype-card.active .cp-archetype-name { color: var(--purple, #b794f6); }
.cp-archetype-desc {
  font-size: 11px;
  color: var(--text-secondary);
  line-height: 1.45;
  margin-bottom: 6px;
}
.cp-archetype-strongholds {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.cp-archetype-strongholds strong { color: var(--text-secondary); font-weight: 600; }

/* Logo grid */
.cp-logo-grid {
  max-height: 180px;
  overflow-y: auto;
  border: 1px solid var(--border-0);
  padding: 6px;
  background: var(--bg-1);
}
.cp-icon-cat {
  font-family: var(--font-mono);
  font-size: 7px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-ghost);
  margin: 4px 0 3px;
  padding-bottom: 2px;
  border-bottom: 1px solid var(--border-hair);
}
.cp-icon-cat:first-child { margin-top: 0; }
.cp-icon-row {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  margin-bottom: 3px;
}
.cp-icon-opt {
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: 1px solid transparent;
  background: var(--bg-3);
  color: var(--text-secondary);
  transition: border-color 0.15s, background 0.15s;
}
.cp-icon-opt:hover { background: var(--bg-hover); border-color: var(--border-1); }
.cp-icon-opt.active { border-color: var(--amber); background: var(--amber-faint); }

/* Preview card */
.preview-card {
  width: 100%;
  max-width: 560px;
  background: var(--bg-2);
  border: 1px solid var(--border-0);
  margin-bottom: 12px;
}
.preview-card__header {
  background: var(--bg-3);
  border-bottom: 1px solid var(--border-hair);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.preview-card__body {
  padding: 12px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.preview-logo {
  width: 36px;
  height: 36px;
  background: var(--bg-4);
  border: 1px solid var(--border-0);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
}
.preview-info {
  flex: 1;
}
.preview-name {
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 700;
  color: var(--text-bright);
}
.preview-abbr {
  font-family: var(--font-mono);
  font-size: 8.5px;
  font-weight: 700;
  padding: 1px 6px;
  display: inline-block;
  margin-left: 6px;
}
.preview-desc {
  font-family: var(--font-ui);
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* Action buttons */
.action-bar {
  width: 100%;
  max-width: 560px;
  display: flex;
  justify-content: space-between;
  padding-bottom: 48px;
}
.btn {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  padding: 7px 14px;
  background: var(--bg-3);
  border: 1px solid var(--border-0);
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.btn:hover {
  background: var(--bg-4);
  color: var(--text-secondary);
  border-color: var(--border-1);
}
.btn-next {
  background: var(--bg-3);
}
.btn-next:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}
.btn-next.ready {
  background: var(--green-faint);
  color: var(--green);
  border-color: var(--green-border);
}
.btn-next.ready:hover {
  background: rgba(92,184,92,0.14);
}

.error-msg {
  width: 100%;
  max-width: 560px;
  background: var(--red-faint);
  border: 1px solid var(--red-border);
  border-left: 3px solid var(--red);
  color: var(--red);
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 8px 12px;
  margin-bottom: 12px;
  display: none;
}

.loading-msg {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  text-align: center;
  padding: 80px 20px;
}

/* ── Mobile ── */
@media (max-width: 480px) {
  .inline-fields { grid-template-columns: 1fr; }
  .ideo-card { padding: 8px 10px; }
  .ideo-card .ideo-name { font-size: 11px; }
  .ideo-card .ideo-desc { font-size: 9px; }
  .form-panel { padding: 14px; }
  .cp-swatch { width: 20px; height: 20px; }
}
</style>
</head>
<body>

<button id="cp-logout-btn" onclick="logoutUser()" style="position:fixed;top:16px;right:16px;z-index:100;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;background:transparent;color:var(--text-muted);border:1px solid var(--border-1);padding:6px 16px;cursor:pointer;transition:color 0.15s,border-color 0.15s;" onmouseover="this.style.color='var(--red)';this.style.borderColor='var(--red)'" onmouseout="this.style.color='var(--text-muted)';this.style.borderColor='var(--border-1)'">Logout</button>

<div id="loading" class="loading-msg">AUTHENTICATING...</div>

<div id="page-content" style="display:none;">
  <div class="page-header">
    <h1>Step 3 of 3</h1>
    <div class="title">Build Your Party</div>
    <div class="subtitle">Name your political party, choose a color and logo. This is how other players will see you.</div>
  </div>

  <div id="error-message" class="error-msg"></div>

  <!-- Name + Abbreviation -->
  <div class="form-panel">
    <div class="form-panel__header">
      <div class="form-panel__dot" style="background:var(--blue)"></div>
      <span class="form-panel__title">Identity</span>
    </div>
    <div class="form-panel__body">
      <div class="inline-fields">
        <div class="input-group">
          <label class="input-label">Party Name</label>
          <input type="text" id="party-name" placeholder="The Progressive Workers Alliance" maxlength="100">
        </div>
        <div class="input-group">
          <label class="input-label">Abbreviation</label>
          <input type="text" id="party-abbr" placeholder="PWA" maxlength="4" style="text-transform:uppercase; font-family:var(--font-mono); font-weight:700; letter-spacing:0.1em;">
          <div class="char-counter"><span id="abbr-counter">0</span>/4</div>
        </div>
      </div>
      <div class="input-group">
        <label class="input-label">Description <span class="hint">(optional, max 200 chars)</span></label>
        <textarea id="party-desc" maxlength="200" rows="2" placeholder="A brief description of your party's platform..."></textarea>
      </div>
    </div>
  </div>

  <!-- Color -->
  <div class="form-panel">
    <div class="form-panel__header">
      <div class="form-panel__dot" style="background:var(--amber)"></div>
      <span class="form-panel__title">Color</span>
    </div>
    <div class="form-panel__body">
      <div id="cp-color-palette" class="cp-color-palette"></div>
      <div class="cp-hex-row">
        <span style="font-family:var(--font-mono);font-size:8px;color:var(--text-ghost);text-transform:uppercase;letter-spacing:0.08em;">Custom</span>
        <input type="text" id="cp-custom-hex" class="cp-hex-input" maxlength="7" placeholder="#E63946">
        <div id="cp-color-preview" class="cp-color-preview"></div>
      </div>
    </div>
  </div>

  <!-- Archetype -->
  <div class="form-panel">
    <div class="form-panel__header">
      <div class="form-panel__dot" style="background:var(--purple)"></div>
      <span class="form-panel__title">Archetype</span>
      <span class="form-panel__hint" style="margin-left:auto;font-family:var(--font-mono);font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.08em;">Pick one — sets your starting strongholds</span>
    </div>
    <div class="form-panel__body">
      <div id="cp-archetype-grid" class="cp-archetype-grid"></div>
    </div>
  </div>

  <!-- Logo -->
  <div class="form-panel">
    <div class="form-panel__header">
      <div class="form-panel__dot" style="background:var(--teal)"></div>
      <span class="form-panel__title">Logo</span>
    </div>
    <div class="form-panel__body">
      <div id="cp-logo-grid" class="cp-logo-grid"></div>
    </div>
  </div>

  <!-- Preview -->
  <div class="preview-card" id="preview-card" style="display:none;">
    <div class="preview-card__header">
      <div class="form-panel__dot" style="background:var(--green)"></div>
      <span class="form-panel__title">Preview</span>
    </div>
    <div class="preview-card__body">
      <div class="preview-logo" id="preview-logo"></div>
      <div class="preview-info">
        <span class="preview-name" id="preview-name"></span>
        <span class="preview-abbr" id="preview-abbr"></span>
        <div class="preview-desc" id="preview-desc"></div>
      </div>
    </div>
  </div>

  <div class="action-bar">
    <button class="btn" onclick="goBack()">&#x25C0; BACK</button>
    <button class="btn btn-next" id="btn-next" disabled onclick="proceed()">CREATE PARTY &#x25B6;</button>
  </div>
</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { PARTY_ICONS, PARTY_COLOR_PALETTE, DEFAULT_PARTY_ICON, getPartyIconSVG, getDefaultPartyColor } from './js/party-icons.js';
import { escapeHtml } from './js/utils.js';
import { ARCHETYPES, STRONGHOLD_POPULARITY_TIERS } from './js/game/archetypes.js';
import { getNationNames } from './js/game/political-actions.js';

let selectedArchetype = null; // archetype object from ARCHETYPES, or null


let currentUser = null;
let nationData = null;
let _cpSelectedColor = null;
let _cpSelectedLogo = DEFAULT_PARTY_ICON;

async function init() {
  const { data: { user } } = await _supabase.auth.getUser();
  if (!user) { window.location.href = 'login.html'; return; }
  currentUser = user;

  // Check if user already has a primary party (legacy short-circuit —
  // bounces them straight to the dashboard). Doesn't catch same-nation
  // corp conflicts; the nation-level check happens in proceed() before
  // the INSERT, after the pending-nation session value is in hand.
  const { data: faction } = await _supabase
    .from('factions').select('id, nation_id').eq('id', user.id).eq('faction_type', 'party').maybeSingle();
  if (faction && faction.nation_id) {
    window.location.href = 'dashboard.html';
    return;
  }

  // Load pending nation from sessionStorage
  const rawNation = sessionStorage.getItem('nationhood_pending_nation');
  if (!rawNation) {
    window.location.href = 'select-nation.html';
    return;
  }
  nationData = JSON.parse(rawNation);
  if (!nationData.id) {
    window.location.href = 'select-nation.html';
    return;
  }

  setupColorPicker();
  setupLogoPicker();
  setupArchetypePicker();
  setupValidation();

  document.getElementById('loading').style.display = 'none';
  document.getElementById('page-content').style.display = 'flex';
  document.getElementById('page-content').style.flexDirection = 'column';
  document.getElementById('page-content').style.alignItems = 'center';
  document.getElementById('page-content').style.width = '100%';
}

function setupColorPicker() {
  const paletteEl = document.getElementById('cp-color-palette');
  const defaultColor = getDefaultPartyColor(0);
  _cpSelectedColor = defaultColor;
  paletteEl.innerHTML = PARTY_COLOR_PALETTE.map(c => {
    const isActive = c.hex === defaultColor;
    return `<div class="cp-swatch ${isActive ? 'active' : ''}" data-hex="${c.hex}" style="background:${c.hex};" title="${c.label}" onclick="onCpSelectColor('${c.hex}')"></div>`;
  }).join('');
  const hexInput = document.getElementById('cp-custom-hex');
  if (hexInput) hexInput.value = defaultColor;
  const preview = document.getElementById('cp-color-preview');
  if (preview) preview.style.background = defaultColor;
}

function setupLogoPicker() {
  const logoEl = document.getElementById('cp-logo-grid');
  let html = '';
  const categories = {};
  for (const [key, icon] of Object.entries(PARTY_ICONS)) {
    if (!categories[icon.category]) categories[icon.category] = [];
    categories[icon.category].push({ key, ...icon });
  }
  for (const [cat, icons] of Object.entries(categories)) {
    html += `<div class="cp-icon-cat">${cat}</div><div class="cp-icon-row">`;
    html += icons.map(ic => {
      const isActive = ic.key === DEFAULT_PARTY_ICON;
      return `<div class="cp-icon-opt ${isActive ? 'active' : ''}" data-icon="${ic.key}" title="${ic.label}" onclick="onCpSelectLogo('${ic.key}')">${getPartyIconSVG(ic.key, 18)}</div>`;
    }).join('');
    html += `</div>`;
  }
  logoEl.innerHTML = html;
}

function setupValidation() {
  const nameInput = document.getElementById('party-name');
  const abbrInput = document.getElementById('party-abbr');
  const descInput = document.getElementById('party-desc');
  const abbrCounter = document.getElementById('abbr-counter');

  nameInput.addEventListener('input', () => { validateForm(); updatePreview(); });
  descInput.addEventListener('input', updatePreview);
  abbrInput.addEventListener('input', () => {
    abbrInput.value = abbrInput.value.toUpperCase();
    abbrCounter.textContent = abbrInput.value.length;
    validateForm();
    updatePreview();
  });
}

function validateForm() {
  const name = document.getElementById('party-name').value.trim();
  const abbr = document.getElementById('party-abbr').value.trim();
  const btn = document.getElementById('btn-next');
  const valid = name.length > 0 && abbr.length >= 2 && abbr.length <= 4 && selectedArchetype != null;
  btn.disabled = !valid;
  btn.classList.toggle('ready', valid);
}

function setupArchetypePicker() {
  const grid = document.getElementById('cp-archetype-grid');
  if (!grid) return;
  grid.innerHTML = ARCHETYPES.map(a => {
    const strongholdLabels = a.strongholds.map(k => k.replace(/_/g, ' ').toLowerCase().replace(/\b\w/g, c => c.toUpperCase())).join(', ');
    return `<div class="cp-archetype-card" data-archetype="${escapeHtml(a.key)}">
      <div class="cp-archetype-name">${escapeHtml(a.name)}</div>
      <div class="cp-archetype-desc">${escapeHtml(a.description)}</div>
      <div class="cp-archetype-strongholds"><strong>Strongholds:</strong> ${escapeHtml(strongholdLabels)}</div>
    </div>`;
  }).join('');
  grid.querySelectorAll('.cp-archetype-card').forEach(card => {
    card.addEventListener('click', () => {
      const key = card.dataset.archetype;
      selectedArchetype = ARCHETYPES.find(a => a.key === key) || null;
      grid.querySelectorAll('.cp-archetype-card').forEach(c => c.classList.toggle('active', c === card));
      validateForm();
    });
  });
}

function updatePreview() {
  const name = document.getElementById('party-name').value.trim();
  const abbr = document.getElementById('party-abbr').value.trim();
  const desc = document.getElementById('party-desc').value.trim();
  const card = document.getElementById('preview-card');

  if (!name) { card.style.display = 'none'; return; }
  card.style.display = 'block';

  const logoEl = document.getElementById('preview-logo');
  logoEl.innerHTML = getPartyIconSVG(_cpSelectedLogo, 22);
  logoEl.style.color = _cpSelectedColor || 'var(--text-secondary)';

  const nameEl = document.getElementById('preview-name');
  nameEl.textContent = name;

  const abbrEl = document.getElementById('preview-abbr');
  if (abbr) {
    abbrEl.textContent = abbr;
    abbrEl.style.display = 'inline-block';
    abbrEl.style.background = _cpSelectedColor ? _cpSelectedColor + '22' : 'var(--blue-faint)';
    abbrEl.style.color = _cpSelectedColor || 'var(--blue)';
    abbrEl.style.border = '1px solid ' + (_cpSelectedColor ? _cpSelectedColor + '44' : 'var(--blue-border)');
  } else {
    abbrEl.style.display = 'none';
  }

  const descEl = document.getElementById('preview-desc');
  descEl.textContent = desc || '';
}

function onCpSelectColor(hex) {
  _cpSelectedColor = hex;
  document.querySelectorAll('.cp-swatch').forEach(el => {
    el.classList.toggle('active', el.dataset.hex === hex);
  });
  const hexInput = document.getElementById('cp-custom-hex');
  if (hexInput) hexInput.value = hex;
  const preview = document.getElementById('cp-color-preview');
  if (preview) preview.style.background = hex;
  updatePreview();
}

function onCpHexInput(el) {
  let val = el.value.trim();
  if (!val.startsWith('#')) val = '#' + val;
  if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
    _cpSelectedColor = val;
    document.querySelectorAll('.cp-swatch').forEach(s => {
      s.classList.toggle('active', s.dataset.hex.toUpperCase() === val.toUpperCase());
    });
    const preview = document.getElementById('cp-color-preview');
    if (preview) preview.style.background = val;
    updatePreview();
  }
}

function onCpSelectLogo(key) {
  _cpSelectedLogo = key;
  document.querySelectorAll('.cp-icon-opt').forEach(el => {
    el.classList.toggle('active', el.dataset.icon === key);
  });
  updatePreview();
}

function goBack() {
  window.location.href = 'faction-select.html';
}

async function proceed() {
  const name = document.getElementById('party-name').value.trim();
  const abbr = document.getElementById('party-abbr').value.trim();
  const desc = document.getElementById('party-desc').value.trim();

  if (!name || abbr.length < 2 || abbr.length > 4) return;

  const btn = document.getElementById('btn-next');
  btn.disabled = true;
  btn.textContent = 'CREATING...';

  // Clear cached state
  sessionStorage.removeItem('nationhood_state');

  try {
    // Get current tick
    const { data: shardData } = await _supabase
      .from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const currentTick = shardData?.current_tick || 0;

    // Generate leader (nation-aware name pool)
    const namePool = getNationNames(nationData.name);
    const leader = {
      first: namePool.firstNames[Math.floor(Math.random() * namePool.firstNames.length)],
      last: namePool.lastNames[Math.floor(Math.random() * namePool.lastNames.length)],
      age: 35 + Math.floor(Math.random() * 20)
    };

    // One non-politician faction per user per nation. A politician in this
    // nation is FINE \u2014 they're an overlay character that can coexist with
    // the user's party/corp/military (20270371 split the unique index into
    // politician and non-politician slots). The DB-side backstop is the
    // idx_factions_one_nonpolitician_per_user_per_nation partial unique
    // index, which only fires on party/corp/military/entrepreneur dupes.
    const { data: existingInNation } = await _supabase
      .from('factions')
      .select('id, faction_type, faction_name')
      .or(`id.eq.${currentUser.id},linked_user_id.eq.${currentUser.id}`)
      .eq('nation_id', nationData.id)
      .neq('faction_type', 'politician')
      .is('abandoned_at', null)
      .maybeSingle();
    if (existingInNation) {
      const what = existingInNation.faction_type === 'party' ? 'political party' : 'corporation';
      alert(`You already have a ${what} ("${existingInNation.faction_name}") in ${nationData.name}. One faction per nation.`);
      btn.disabled = false;
      btn.textContent = 'CREATE PARTY \u25B6';
      return;
    }

    // Check if user already has a primary faction (e.g. a corporation in
    // a DIFFERENT nation). If so, create the party as a linked faction to
    // avoid overwriting the corp.
    const { data: existingPrimary } = await _supabase
      .from('factions')
      .select('id, faction_type')
      .eq('id', currentUser.id)
      .is('abandoned_at', null)
      .maybeSingle();

    const isLinkedParty = !!existingPrimary;
    const partyId = isLinkedParty ? crypto.randomUUID() : currentUser.id;

    const partyRow = {
        id: partyId,
        faction_type: 'party',
        faction_name: name,
        nation_id: nationData.id,
        nation: nationData.name,
        abbreviation: abbr,
        seats: 0,
        needs_rebuild: false,
        party_color: _cpSelectedColor || null,
        party_logo: _cpSelectedLogo || 'star',
        custom_logo_url: null,
        party_description: desc || null,
        leader_first_name: leader.first,
        leader_last_name: leader.last,
        leader_age: leader.age,
        leader_positive_traits: [],
        leader_negative_traits: [],
        founded_tick: currentTick,
        last_seen_tick: currentTick,
        abandoned_at: null,
        // Explicit nulls so an upsert into a row that was previously a corp
        // (same auth UID before the user switched faction type) can't carry
        // corp data forward. Only the fields that were actually observed
        // surviving the merge — workforce/reputation/fleet defaults are
        // schema-level and harmless on parties post chat-popover fix.
        corp_sector: null,
        corp_subsector: null,
        corp_company_type: null,
        corp_ticker: null,
        corp_cash_reserves: null,
        corp_loans: null,
    };

    if (isLinkedParty) {
        partyRow.linked_user_id = currentUser.id;
        const { error: insertError } = await _supabase.from('factions').insert(partyRow);
        if (insertError) throw insertError;
    } else {
        const { error: upsertError } = await _supabase.from('factions').upsert(partyRow);
        if (upsertError) throw upsertError;
    }

    // Apply archetype: sets factions.archetype + boosts initial sector popularity.
    // The faction insert above triggered trg_backfill_faction_popularity which
    // already created 1.0 baseline rows for every active sector; this RPC
    // raises the three strongholds with a primary→secondary→tertiary curve
    // (4.0 / 3.5 / 3.0 displayed) by passing parallel arrays — the order in
    // selectedArchetype.strongholds maps positionally to STRONGHOLD_POPULARITY_TIERS.
    if (selectedArchetype) {
        const { error: archetypeErr } = await _supabase.rpc('apply_party_archetype', {
            p_faction_id:     partyId,
            p_archetype_name: selectedArchetype.name,
            p_sector_keys:    selectedArchetype.strongholds,
            p_popularities:   STRONGHOLD_POPULARITY_TIERS,
        });
        if (archetypeErr) {
            console.error('[CreateParty] apply_party_archetype failed:', archetypeErr.message);
            // Non-fatal: party exists, but stronghold seeding failed. Player
            // can still play; admin can manually set strongholds. We surface
            // a soft warning via the error panel rather than aborting.
            const errEl = document.getElementById('error-message');
            if (errEl) {
                errEl.style.display = 'block';
                errEl.textContent = `Party created, but archetype seeding failed (${archetypeErr.message}). Contact an admin if your strongholds aren't set.`;
            }
        }
    }

    // Reset electoral standing for fresh party — momentum, credibility, governance all start at zero
    try {
      await _supabase.from('faction_electoral_standing').upsert({
        faction_id: partyId,
        nation_id: nationData.id,
        party_approval: 10,
        momentum: 0,
        credibility: 50,
        governance: 0,
        gov_approval_events: 0
      }, { onConflict: 'faction_id' });
    } catch (e) { console.warn('Electoral standing reset failed (non-blocking):', e); }

    // Clean slate: remove any leftover IPO memberships from a previous party
    try {
      await _supabase.from('ipo_members').delete().eq('faction_id', partyId);
      await _supabase.from('ipo_ballots').delete().eq('faction_id', partyId);
      await _supabase.from('ipo_invitations').delete().eq('target_faction_id', partyId);
    } catch (e) { /* non-fatal — tables may not exist */ }

    // Pre-cache state so dashboard loads instantly without a re-query
    // (avoids race where the faction isn't found on a fresh DB read)
    try {
      const { data: freshFaction } = await _supabase
        .from('factions').select('*').eq('id', partyId).single();
      const { data: freshShard } = await _supabase
        .from('shard').select('*').eq('name', 'Alpha Shard').single();
      if (freshFaction && nationData) {
        const state = {
          user: currentUser,
          faction: freshFaction,
          nation: nationData,
          shard: freshShard,
          timestamp: Date.now()
        };
        sessionStorage.setItem('nationhood_state', JSON.stringify(state));
      }
    } catch (e) { console.warn('Pre-cache failed (non-blocking):', e); }

    // Clean up and redirect to the new party's dashboard
    sessionStorage.removeItem('nationhood_pending_nation');
    sessionStorage.removeItem('nationhood_pending_party');
    sessionStorage.removeItem('pending_faction_type');
    sessionStorage.setItem('active_faction_id', partyId);
    window.location.href = 'dashboard.html';

  } catch (error) {
    console.error('Error creating party:', error);
    const errEl = document.getElementById('error-message');
    errEl.textContent = 'Error: ' + error.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'CREATE PARTY';
    btn.classList.add('ready');
  }
}

// Add oninput handler for custom hex
document.getElementById('cp-custom-hex').addEventListener('input', function() { onCpHexInput(this); });

async function logoutUser() {
    await _supabase.auth.signOut();
    window.location.href = 'login.html';
}

init();

window.goBack = goBack;
window.proceed = proceed;
window.onCpSelectColor = onCpSelectColor;
window.onCpSelectLogo = onCpSelectLogo;
window.logoutUser = logoutUser;
</script>
</body>
</html>
