async function loadAllCrises() {
    var r = await _supabase
        .from('crisis_templates')
        .select('*, crisis_triggers(*), crisis_effects(*), crisis_end_triggers(*)')
        .order('created_at', { ascending: false });
    var data = (r.error ? [] : r.data) || [];
    allCrises = data.filter(function(c) { return c.crisis_type !== 'ministry'; });
    allMinistryCrises = data.filter(function(c) { return c.crisis_type === 'ministry'; });
}

function renderCrisisList(crises) {
    var c = document.getElementById('crisis-list');
    if (!crises.length) {
        c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🛡️</div>No stat crises found. Create one to get started.</div>';
        return;
    }
    c.innerHTML = crises.map(function(cr) {
        var trigCount = (cr.crisis_triggers || []).length;
        var fxCount = (cr.crisis_effects || []).length;
        var endCount = (cr.crisis_end_triggers || []).length;
        var desc = (cr.description || '').substring(0, 100);
        return '<div class="crisis-card ' + (cr.is_active ? 'active' : 'inactive') + '" onclick="editCrisis(\'' + cr.id + '\')">' +
            '<div class="crisis-card-left">' +
                '<div class="crisis-card-name">' + escapeHtml(cr.name) + '</div>' +
                '<div class="crisis-card-meta">' +
                    '<span class="tag tag-trigger">' + trigCount + ' trigger' + (trigCount !== 1 ? 's' : '') + '</span>' +
                    '<span class="tag tag-effect">' + fxCount + ' effect' + (fxCount !== 1 ? 's' : '') + '</span>' +
                    '<span class="tag tag-end">' + endCount + ' end cond' + (endCount !== 1 ? 's' : '') + '</span>' +
                    (desc ? '<span style="color:#666;">' + escapeHtml(desc) + (cr.description && cr.description.length > 100 ? '...' : '') + '</span>' : '') +
                '</div>' +
            '</div>' +
            '<div class="crisis-card-right">' +
                '<span class="tag ' + (cr.is_active ? 'tag-active' : 'tag-inactive') + '">' + (cr.is_active ? 'ACTIVE' : 'INACTIVE') + '</span>' +
            '</div></div>';
    }).join('');
}

function applyFilters() {
    var search = (document.getElementById('filter-search').value || '').toLowerCase();
    var status = document.getElementById('filter-status').value;
    var filtered = allCrises.filter(function(cr) {
        if (search && cr.name.toLowerCase().indexOf(search) === -1 && (cr.description || '').toLowerCase().indexOf(search) === -1) return false;
        if (status === 'active' && !cr.is_active) return false;
        if (status === 'inactive' && cr.is_active) return false;
        return true;
    });
    document.getElementById('crisis-count').textContent = filtered.length + ' crises';
    renderCrisisList(filtered);
}

// ==================== STAT CRISIS CREATE / EDIT ====================
function createNewCrisis() {
    isNewCrisis = true;
    currentCrisis = { name: '', description: '', is_active: true };
    editorTriggers = [];
    editorEffects = [];
    editorEndTriggers = [];
    window.editorTriggers = editorTriggers;
    window.editorEffects = editorEffects;
    window.editorEndTriggers = editorEndTriggers;
    deletedTriggerIds = [];
    deletedEffectIds = [];
    deletedEndTriggerIds = [];
    renderEditor();
}

function editCrisis(id) {
    var cr = allCrises.find(function(c) { return c.id === id; });
    if (!cr) return;
    isNewCrisis = false;
    currentCrisis = Object.assign({}, cr);
    editorTriggers = (cr.crisis_triggers || []).map(function(t) { return Object.assign({}, t, { isNew: false }); });
    editorEffects = (cr.crisis_effects || []).map(function(e) { return Object.assign({}, e, { isNew: false }); });
    editorEndTriggers = (cr.crisis_end_triggers || []).map(function(t) { return Object.assign({}, t, { isNew: false }); });
    window.editorTriggers = editorTriggers;
    window.editorEffects = editorEffects;
    window.editorEndTriggers = editorEndTriggers;
    deletedTriggerIds = [];
    deletedEffectIds = [];
    deletedEndTriggerIds = [];
    renderEditor();
}

// ==================== TRIGGER RENDERING ====================
function renderTriggers() {
    if (!editorTriggers.length) return '<div class="empty-state" style="padding:12px;">No activation triggers. Add at least one.</div>';
    return editorTriggers.map(function(t, i) {
        return '<div class="trigger-item">' +
            '<select class="form-select" onchange="editorTriggers[' + i + '].stat_key=this.value"><option value="">-- Select Stat --</option>' +
                NATION_STATS.map(function(s) { return '<option value="' + s.key + '"' + (t.stat_key === s.key ? ' selected' : '') + '>' + s.label + '</option>'; }).join('') +
            '</select>' +
            '<select class="form-select" onchange="editorTriggers[' + i + '].operator=this.value">' +
                TRIGGER_OPERATORS.map(function(o) { return '<option value="' + o.key + '"' + (t.operator === o.key ? ' selected' : '') + '>' + o.label + '</option>'; }).join('') +
            '</select>' +
            '<input type="number" class="form-input" value="' + (t.threshold != null ? t.threshold : 0) + '" placeholder="Value" step="1" min="0" max="100" onchange="editorTriggers[' + i + '].threshold=Number(this.value)">' +
            '<button class="btn-icon" onclick="removeTrigger(' + i + ')">&#10005;</button>' +
        '</div>';
    }).join('');
}

function addTrigger() {
    if (editorTriggers.length >= 7) { alert('Maximum 7 activation triggers.'); return; }
    editorTriggers.push({ id: null, stat_key: '', operator: 'gte', threshold: 0, isNew: true });
    document.getElementById('triggers-list').innerHTML = renderTriggers();
}

function removeTrigger(i) {
    var t = editorTriggers[i];
    if (t.id && !t.isNew) deletedTriggerIds.push(t.id);
    editorTriggers.splice(i, 1);
    document.getElementById('triggers-list').innerHTML = renderTriggers();
}

// ==================== EFFECT RENDERING ====================

    if (!editorEffects.length) return '<div class="empty-state" style="padding:12px;">No effects. Add at least one.</div>';
    return editorEffects.map(function(e, i) {
        var secondCol = '';
        if (e.target === 'nation') {
            secondCol = '<select class="form-select" onchange="editorEffects[' + i + '].stat_key=this.value"><option value="">-- Select Stat --</option>' +
                NATION_STATS.map(function(s) { return '<option value="' + s.key + '"' + (e.stat_key === s.key ? ' selected' : '') + '>' + s.label + '</option>'; }).join('') +
            '</select>';
        } else if (e.target === 'minister_approval') {
            secondCol = '<select class="form-select" onchange="editorEffects[' + i + '].minister_key=this.value"><option value="">-- Select Minister --</option>' +
                MINISTRIES.map(function(m) { return '<option value="' + m.key + '"' + (e.minister_key === m.key ? ' selected' : '') + '>' + m.label + '</option>'; }).join('') +
            '</select>';
        } else if (e.target === 'pm_approval') {

// ==================== STAT CRISIS SAVE ====================
async function saveCrisis() {
    syncForm();
    var name = (currentCrisis.name || '').trim();
    if (!name) { alert('Crisis name is required.'); return; }

    var validTriggers = editorTriggers.filter(function(t) { return t.stat_key; });
    if (!validTriggers.length) { alert('Add at least one activation trigger.'); return; }

    var validEffects = editorEffects.filter(function(e) {
        if (e.target === 'nation') return e.stat_key;
        if (e.target === 'minister_approval') return e.minister_key;
        return true; // government_approval and coalition_approval don't need extra key
    });
    if (!validEffects.length) { alert('Add at least one effect.'); return; }

    // Validate effect details
    for (var ei = 0; ei < validEffects.length; ei++) {
        var eff = validEffects[ei];
        if (eff.target === 'nation' && !eff.stat_key) { alert('Effect #' + (ei + 1) + ': Select a nation stat.'); return; }
        if (eff.target === 'minister_approval' && !eff.minister_key) { alert('Effect #' + (ei + 1) + ': Select a minister.'); return; }
        if (!eff.change_per_tick || eff.change_per_tick === 0) { alert('Effect #' + (ei + 1) + ': Change per tick must be non-zero.'); return; }
    }

    var validEndTriggers = editorEndTriggers.filter(function(t) { return t.stat_key; });
    if (!validEndTriggers.length) { alert('Add at least one recovery trigger so the crisis can end.'); return; }

    try {
        var crisisId;
        var payload = {
            name: name,
            description: (currentCrisis.description || '').trim(),
            is_active: currentCrisis.is_active,
            crisis_type: 'stat'
        };

        if (isNewCrisis) {
            var r = await _supabase.from('crisis_templates').insert(payload).select().single();
            if (r.error) throw r.error;
            crisisId = r.data.id;
        } else {
            crisisId = currentCrisis.id;
            var r2 = await _supabase.from('crisis_templates').update(payload).eq('id', crisisId);
            if (r2.error) throw r2.error;
        }

        // Delete removed items
        if (deletedTriggerIds.length) await _supabase.from('crisis_triggers').delete().in('id', deletedTriggerIds);
        if (deletedEffectIds.length) await _supabase.from('crisis_effects').delete().in('id', deletedEffectIds);
        if (deletedEndTriggerIds.length) await _supabase.from('crisis_end_triggers').delete().in('id', deletedEndTriggerIds);

        // Upsert triggers
        for (var t of validTriggers) {
            var tp = { crisis_id: crisisId, stat_key: t.stat_key, operator: t.operator, threshold: t.threshold };
            if (t.isNew || !t.id) await _supabase.from('crisis_triggers').insert(tp);
            else await _supabase.from('crisis_triggers').update(tp).eq('id', t.id);
        }

        // Upsert effects
        for (var e of validEffects) {
            var ep = {
                crisis_id: crisisId,
                target: e.target,
                stat_key: (e.target === 'nation') ? e.stat_key : null,
                minister_key: (e.target === 'minister_approval') ? e.minister_key : (e.target === 'pm_approval' ? 'prime_minister' : null),
                change_per_tick: e.change_per_tick || 0,
                stat_floor: (e.stat_floor != null && e.stat_floor !== '') ? e.stat_floor : null
            };
            if (e.isNew || !e.id) await _supabase.from('crisis_effects').insert(ep);
            else await _supabase.from('crisis_effects').update(ep).eq('id', e.id);
        }

        // Upsert end triggers
        for (var et of validEndTriggers) {
            var etp = { crisis_id: crisisId, stat_key: et.stat_key, operator: et.operator, threshold: et.threshold };
            if (et.isNew || !et.id) await _supabase.from('crisis_end_triggers').insert(etp);
            else await _supabase.from('crisis_end_triggers').update(etp).eq('id', et.id);
        }

        alert(isNewCrisis ? 'Crisis created!' : 'Crisis saved!');
        await loadAllCrises();
        renderListView();
    } catch (err) {
        console.error('Save error:', err);
        alert('Error: ' + err.message);
    }
}

// ==================== STAT CRISIS DELETE ====================
async function deleteCrisis(id) {
    if (!confirm('Delete this crisis and all its data? This cannot be undone.')) return;
    try {
        await _supabase.from('active_crises').delete().eq('crisis_id', id);
        var r = await _supabase.from('crisis_templates').delete().eq('id', id);
        if (r.error) throw r.error;
        alert('Crisis deleted.');
        await loadAllCrises();
        renderListView();
    } catch (err) {
        console.error('Delete error:', err);
        alert('Error: ' + err.message);
    }
}

}

function addMCEffect() {
    if (mcEditorEffects.length >= 7) { alert('Maximum 7 effects.'); return; }
    mcEditorEffects.push({ id: null, target: 'nation', stat_key: '', minister_key: '', change_per_tick: 0, stat_floor: null, isNew: true });
    document.getElementById('mc-effects-list').innerHTML = renderMCEffects();
}

function removeMCEffect(i) {
    var e = mcEditorEffects[i];
    if (e.id && !e.isNew) mcDeletedEffectIds.push(e.id);
    mcEditorEffects.splice(i, 1);
    document.getElementById('mc-effects-list').innerHTML = renderMCEffects();
}

// ==================== MINISTRY CRISIS SAVE ====================
async function saveMC() {
    var mc = currentMinistryCrisis;
    // Sync form values
    var nameEl = document.getElementById('mc-name');
    if (nameEl) mc.name = nameEl.value;
    var descEl = document.getElementById('mc-description');
    if (descEl) mc.description = descEl.value;
    var activeEl = document.getElementById('mc-active');
    if (activeEl) mc.is_active = activeEl.checked;
    var fcEl = document.getElementById('mc-fiscal-cat');
    if (fcEl) mc.fiscal_category = fcEl.value;
    var threshEl = document.getElementById('mc-threshold');
    if (threshEl) mc.funding_threshold_pct = Number(threshEl.value);
    var recEl = document.getElementById('mc-recovery');
    if (recEl) mc.recovery_threshold_pct = Number(recEl.value);

    // Validate
    var name = (mc.name || '').trim();
    if (!name) { alert('Crisis name is required.'); return; }
    if (!mc.fiscal_category) { alert('Select a ministry.'); return; }
    if (!mc.funding_threshold_pct || mc.funding_threshold_pct < 1 || mc.funding_threshold_pct > 99) {
        alert('Activation threshold must be between 1% and 99%.'); return;
    }
    if (!mc.recovery_threshold_pct || mc.recovery_threshold_pct < 1 || mc.recovery_threshold_pct > 100) {
        alert('Recovery threshold must be between 1% and 100%.'); return;
    }
    if (mc.recovery_threshold_pct <= mc.funding_threshold_pct) {
        alert('Recovery threshold must be higher than activation threshold (hysteresis).'); return;
    }

    var validEffects = mcEditorEffects.filter(function(e) {
        if (e.target === 'nation') return e.stat_key;
        if (e.target === 'minister_approval') return e.minister_key;
        return true;
    });
    if (!validEffects.length) { alert('Add at least one effect.'); return; }

    for (var ei = 0; ei < validEffects.length; ei++) {
        var eff = validEffects[ei];
        if (eff.target === 'nation' && !eff.stat_key) { alert('Effect #' + (ei + 1) + ': Select a nation stat.'); return; }
        if (eff.target === 'minister_approval' && !eff.minister_key) { alert('Effect #' + (ei + 1) + ': Select a minister.'); return; }
        if (!eff.change_per_tick || eff.change_per_tick === 0) { alert('Effect #' + (ei + 1) + ': Change per tick must be non-zero.'); return; }
    }

    try {
        var crisisId;
        var payload = {
            name: name,
            description: (mc.description || '').trim(),
            is_active: mc.is_active,
            crisis_type: 'ministry',
            fiscal_category: mc.fiscal_category,
            funding_threshold_pct: mc.funding_threshold_pct,
            recovery_threshold_pct: mc.recovery_threshold_pct,
            institution_ids: mc.institution_ids || []
        };

        if (isNewMinistryCrisis) {
            var r = await _supabase.from('crisis_templates').insert(payload).select().single();
            if (r.error) throw r.error;
            crisisId = r.data.id;
        } else {
            crisisId = mc.id;
            var r2 = await _supabase.from('crisis_templates').update(payload).eq('id', crisisId);
            if (r2.error) throw r2.error;
        }

        // Delete removed effects
        if (mcDeletedEffectIds.length) await _supabase.from('crisis_effects').delete().in('id', mcDeletedEffectIds);

        // Upsert effects
        for (var e of validEffects) {
            var ep = {
                crisis_id: crisisId,
                target: e.target,
                stat_key: (e.target === 'nation') ? e.stat_key : null,
                minister_key: (e.target === 'minister_approval') ? e.minister_key : (e.target === 'pm_approval' ? 'prime_minister' : null),
                change_per_tick: e.change_per_tick || 0,
                stat_floor: (e.stat_floor != null && e.stat_floor !== '') ? e.stat_floor : null
            };
            if (e.isNew || !e.id) await _supabase.from('crisis_effects').insert(ep);
            else await _supabase.from('crisis_effects').update(ep).eq('id', e.id);
        }

        alert(isNewMinistryCrisis ? 'Ministry crisis created!' : 'Ministry crisis saved!');
        await loadAllCrises();
        renderMCListView();
    } catch (err) {
        console.error('Save error:', err);
        alert('Error: ' + err.message);
    }
}

// ==================== MINISTRY CRISIS DELETE ====================
async function deleteMC(id) {
    if (!confirm('Delete this ministry crisis? This cannot be undone.')) return;
    try {
        await _supabase.from('active_crises').delete().eq('crisis_id', id);
        var r = await _supabase.from('crisis_templates').delete().eq('id', id);
        if (r.error) throw r.error;
        alert('Ministry crisis deleted.');
        await loadAllCrises();
        renderMCListView();
    } catch (err) {
        console.error('Delete error:', err);
        alert('Error: ' + err.message);
    }
}
