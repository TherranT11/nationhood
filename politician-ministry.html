<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Politician — Ministry</title>
<style>
/* Topbar / nav / body base live in js/politician-topbar.js. Per-page
   styles match the section-card chrome used on politician-nation /
   politician-economy. */
.content { max-width:1200px; margin:18px auto; padding:0 20px; }

.mn-num { color:#888; font-size:10px; font-weight:600; margin-right:8px;
  font-family:monospace; letter-spacing:0.08em; }
.mn-head { display:flex; align-items:baseline; gap:10px; margin:24px 0 10px; }
.mn-head .lab { color:#fff; font-size:18px; font-weight:600; letter-spacing:0.02em; }
.mn-head .ital { font-family:Georgia, serif; font-style:italic; color:#5aafa5; margin-left:6px; }

/* Overview card — badge + title + description on the left, stats on the right. */
.mof-card { background:#0d0d0d; border:0.5px solid rgba(255,255,255,0.08); border-radius:7px;
  border-left:3px solid #5aafa5; padding:18px 22px; display:flex; gap:20px; align-items:flex-start; }
.mof-badge { width:48px; height:48px; flex-shrink:0; border-radius:6px;
  background:rgba(90,175,165,0.08); border:0.5px solid rgba(90,175,165,0.4);
  display:flex; align-items:center; justify-content:center; color:#5aafa5; font-size:22px; }
.mof-info { flex:1; min-width:0; }
.mof-eyebrow { font-size:9px; letter-spacing:0.16em; color:#5aafa5; font-weight:600; margin-bottom:5px; }
.mof-title { font-size:20px; font-weight:600; color:#fff; line-height:1.2; }
.mof-title .ital { font-family:Georgia, serif; font-style:italic; color:#a5c0d0; }
.mof-desc { color:#cfcabf; font-size:11.5px; line-height:1.6; margin-top:10px; }
.mof-desc b { color:#fff; font-weight:600; }
.mof-stats { display:flex; gap:30px; flex-shrink:0; padding-top:4px; }
.mof-stat { text-align:right; }
.mof-stat .lab { font-size:9px; letter-spacing:0.13em; color:#666; font-weight:600; margin-bottom:4px; }
.mof-stat .val { font-size:17px; font-weight:600; color:#fff; font-variant-numeric:tabular-nums; }

/* Section cards (ACTORS / AGENCIES / ASSETS / ASSIGNMENTS) — blank-state today. */
.mn-card { background:#0d0d0d; border:0.5px solid rgba(255,255,255,0.07); border-radius:7px;
  padding:24px 22px; color:#666; font-size:11px; font-style:italic; text-align:center; }

/* Actor table — slots into the .mn-card wrapper, replaces the
   blank-state message once the fetch returns rows. */
.mn-table { width:100%; border-collapse:collapse; font-size:11.5px; }
.mn-table thead th { color:#666; font-weight:600; font-size:9px; letter-spacing:0.13em;
  text-transform:uppercase; padding:14px 18px; text-align:left; border-bottom:0.5px solid rgba(255,255,255,0.07); }
.mn-table thead th.num { text-align:right; }
.mn-table tbody td { color:#cfcabf; padding:13px 18px; border-bottom:0.5px solid rgba(255,255,255,0.05);
  font-variant-numeric:tabular-nums; }
.mn-table tbody tr:last-child td { border-bottom:none; }
.mn-table tbody td.name { color:#fff; font-weight:600; font-variant-numeric:normal; }
.mn-table tbody td.num { text-align:right; }
.mn-section-host { background:#0d0d0d; border:0.5px solid rgba(255,255,255,0.07); border-radius:7px; overflow:hidden; }
.mn-section-host.empty { padding:24px 22px; color:#666; font-size:11px; font-style:italic; text-align:center; }

/* Communiqué rows — the attaché cables (20270860). */
.dcq-row { padding:13px 18px; border-bottom:0.5px solid rgba(255,255,255,0.05); }
.dcq-row:last-child { border-bottom:none; }
.dcq-date { font-family:monospace; font-size:9px; letter-spacing:0.1em; color:#666;
  margin-bottom:5px; }
.dcq-body { color:#cfcabf; font-size:11.5px; line-height:1.6; overflow-wrap:break-word; }
.dcq-body b { color:#5aafa5; font-weight:600; }
.dcq-from { color:#9a958a; }

@media (max-width:700px) {
  .mof-card { flex-direction:column; }
  .mof-stats { width:100%; justify-content:space-between; gap:14px; padding-top:8px;
    border-top:0.5px solid rgba(255,255,255,0.07); }
  .mof-stat { text-align:left; }
}
</style>
</head>
<body>

<div id="pol-topbar-container"></div>
<div id="ent-topbar"></div>

<div class="content" id="content" style="display:none;">

  <!-- Overview — populated by render() once the ministry slug resolves. -->
  <div class="mn-head">
    <span class="mn-num">I.</span>
    <span class="lab">Overview</span>
  </div>
  <div class="mof-card">
    <div class="mof-badge" id="ministry-badge">&#9742;</div>
    <div class="mof-info">
      <div class="mof-eyebrow">EXECUTIVE BRANCH · CABINET MINISTRY</div>
      <div class="mof-title" id="ministry-title">Ministry</div>
      <div class="mof-desc" id="ministry-desc">Loading…</div>
    </div>
    <div class="mof-stats">
      <div class="mof-stat"><div class="lab">ANNUAL BUDGET</div><div class="val">$0</div></div>
      <div class="mof-stat"><div class="lab">POSTS</div><div class="val">0</div></div>
      <div class="mof-stat"><div class="lab">STAFF</div><div class="val">0</div></div>
    </div>
  </div>

  <!-- The Minister (20270868) — Foreign Affairs only. -->
  <div id="fm-strip" style="display:none; margin-top:14px; padding:13px 18px; background:#0d0d0d;
       border:0.5px solid rgba(90,175,165,0.25); border-radius:7px;
       align-items:center; justify-content:space-between; gap:12px;">
    <div style="font-size:11.5px; color:#cfcabf;" id="fm-strip-text">—</div>
    <button type="button" id="fm-seek" style="display:none; padding:7px 13px; background:rgba(90,175,165,0.08);
        border:0.5px solid rgba(90,175,165,0.5); border-radius:4px; color:#5aafa5;
        font-family:monospace; font-size:8.5px; letter-spacing:0.1em; font-weight:700;
        cursor:pointer;">SEEK THE PORTFOLIO</button>
  </div>

  <!-- II. Assignments -->
  <div class="mn-head"><span class="mn-num">II.</span><span class="lab">Assignments</span></div>
  <div class="mn-card">Nothing recorded yet.</div>

  <!-- III. Communiqués — Foreign Affairs only; attaché cables
       (diplomatic_cables, 20270860) land here. -->
  <div class="mn-head" id="cables-head" style="display:none;"><span class="mn-num">III.</span><span class="lab">Communiqués</span></div>
  <div id="cables-host" class="mn-section-host empty" style="display:none;">No cables received yet.</div>

  <!-- IV. Actors -->
  <div class="mn-head"><span class="mn-num">IV.</span><span class="lab">Actors</span></div>
  <div id="actors-host" class="mn-section-host empty">Nothing recorded yet.</div>

  <!-- V. Agencies -->
  <div class="mn-head"><span class="mn-num">V.</span><span class="lab">Agencies</span></div>
  <div class="mn-card">Nothing recorded yet.</div>

  <!-- VI. Assets -->
  <div class="mn-head"><span class="mn-num">VI.</span><span class="lab">Assets</span></div>
  <div class="mn-card">Nothing recorded yet.</div>

</div>

<script type="module">
import { bootstrapPoliticianOrBusinessman } from './js/politician-topbar.js';
import { _supabase } from './js/supabase-client.js';
import { officeTitle, currentAge, escapeHtml, ministryName, MINISTRY_BLURBS, tickToDate } from './js/utils.js';

// Per-ministry page-only chrome — badge glyph + italicized-
// subordinate title HTML. Display name comes from MINISTRY_NAMES
// and the blurb comes from MINISTRY_BLURBS (both in js/utils.js,
// shared with politician-nation.html's CTA cards).
const MINISTRIES_META = {
  defense:              { badge: '&#9876;',   titleHtml: 'Ministry of <span class="ital">Defense</span>' },
  foreign_affairs:      { badge: '&#9742;',   titleHtml: 'Ministry of Foreign Affairs <span class="ital">&amp; Trade</span>' },
  economic_development: { badge: '&#128202;', titleHtml: 'Ministry of Economic <span class="ital">Development</span>' },
  interior:             { badge: '&#127963;', titleHtml: 'Ministry of the <span class="ital">Interior</span>' },
};

function resolveMinistrySlug() {
  const slug = new URLSearchParams(location.search).get('ministry');
  // Fall back to foreign_affairs so a bookmark of the old single-
  // ministry URL (or a missing param) still lands somewhere useful
  // rather than rendering an empty shell.
  return MINISTRIES_META[slug] ? slug : 'foreign_affairs';
}

function paintHeader(slug) {
  const meta = MINISTRIES_META[slug];
  document.title = `Politician — ${ministryName(slug) || 'Ministry'}`;
  document.getElementById('ministry-badge').innerHTML = meta.badge;
  document.getElementById('ministry-title').innerHTML = meta.titleHtml;
  document.getElementById('ministry-desc').textContent = MINISTRY_BLURBS[slug] || '';
}

async function renderActors(slug, nationId, currentTick) {
  const host = document.getElementById('actors-host');
  if (!host || !nationId) return;
  // Civil Servants posted to this ministry in this nation. The
  // politician_ministry slug values are set by politician_sit_the_
  // exam (20270471). Sorted by founded_tick so the most senior
  // servant lists first.
  const { data, error } = await _supabase.from('factions')
    .select('id, leader_first_name, leader_last_name, leader_age, founded_tick, politician_office, politician_influence')
    .eq('faction_type', 'politician')
    .eq('nation_id', nationId)
    .eq('politician_ministry', slug)
    .is('abandoned_at', null)
    .order('founded_tick', { ascending: true });
  if (error) {
    console.warn('[politician-ministry] actors fetch error:', error.message);
    return;
  }
  const rows = (data || []).map(a => {
    const name = [a.leader_first_name, a.leader_last_name].filter(Boolean).join(' ') || '—';
    const age = currentAge(a, currentTick);
    const position = a.politician_office ? officeTitle(a.politician_office) : 'Civil Servant';
    const pc = Math.floor(Number(a.politician_influence) || 0);
    return `<tr>
      <td class="name">${escapeHtml(name)}</td>
      <td>${age}</td>
      <td>${escapeHtml(position)}</td>
      <td class="num">${pc.toLocaleString()}</td>
    </tr>`;
  }).join('');
  if (!rows) return;  // keep the blank-state message
  host.classList.remove('empty');
  host.innerHTML = `<table class="mn-table">
      <thead><tr>
        <th>Name</th>
        <th>Age</th>
        <th>Position</th>
        <th class="num">Influence</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// The Foreign Minister strip (20270868) — who holds the portfolio,
// or the [SEEK] button when it's vacant and the viewer is a
// politician of this nation. The HoG (player or NPC roll) decides.
async function renderFmStrip(slug, ctx) {
  if (slug !== 'foreign_affairs' || !ctx?.nation?.id) return;
  const strip = document.getElementById('fm-strip');
  const text = document.getElementById('fm-strip-text');
  const btn = document.getElementById('fm-seek');
  try {
    const { data: fmRows, error } = await _supabase.from('factions')
      .select('leader_first_name, leader_last_name, nickname')
      .eq('nation_id', ctx.nation.id)
      .not('politician_foreign_minister_at_tick', 'is', null)
      .is('abandoned_at', null)
      .limit(1);
    if (error) throw error;
    strip.style.display = 'flex';
    if (fmRows?.length) {
      const f = fmRows[0];
      const nm = f.nickname || `${f.leader_first_name || ''} ${f.leader_last_name || ''}`.trim() || '—';
      text.innerHTML = `<b style="color:#5aafa5;">FOREIGN MINISTER</b> &nbsp; ${escapeHtml(nm)}`;
      return;
    }
    text.innerHTML = `<b style="color:#5aafa5;">FOREIGN MINISTER</b> &nbsp; <span style="color:#c87a7a;">The portfolio is vacant.</span>`;
    const isLocalPolitician = ctx.faction?.faction_type === 'politician'
      && ctx.faction?.nation_id === ctx.nation.id;
    if (!isLocalPolitician) return;
    btn.style.display = '';
    btn.addEventListener('click', async () => {
      if (btn.dataset.busy === '1') return;
      if (!confirm('Seek the Foreign Minister portfolio? The Head of Government decides — or the chancellery rolls.')) return;
      btn.dataset.busy = '1';
      btn.disabled = true;
      try {
        const { data, error: sErr } = await _supabase.rpc('politician_seek_fm_post',
          { p_faction_id: ctx.faction?.id || null });
        if (sErr) throw sErr;
        if (!data?.success) {
          const REASON = {
            post_filled: 'Someone holds the portfolio already.',
            application_pending: 'Your application is already on the desk.',
            already_fm: 'You hold the portfolio already.',
            arrested: 'You are under arrest.',
          };
          throw new Error(REASON[data?.reason] || data?.reason || 'unknown');
        }
        alert(data.status === 'pending_review'
          ? 'The application sits with the Head of Government.'
          : data.status === 'approved'
            ? 'The chancellery confirms — the portfolio is yours.'
            : 'The chancellery passes you over. Build the r\u00e9sum\u00e9 and try again.');
        location.reload();
      } catch (err) {
        alert('Could not apply: ' + (err?.message || err));
        btn.dataset.busy = '0';
        btn.disabled = false;
      }
    });
  } catch (err) {
    console.warn('[politician-ministry] fm strip failed:', err?.message || err);
  }
}

async function renderCables(slug, nationId) {
  // Attaché dispatches (diplomatic_cables, 20270860) — Foreign
  // Affairs receives them; other ministries keep the section hidden.
  if (slug !== 'foreign_affairs' || !nationId) return;
  document.getElementById('cables-head').style.display = '';
  const host = document.getElementById('cables-host');
  host.style.display = '';
  const { data, error } = await _supabase.from('diplomatic_cables')
    .select('body, sender_name, host_city, host_nation, sent_at_tick')
    .eq('nation_id', nationId)
    .order('created_at', { ascending: false })
    .limit(50);
  if (error) {
    console.warn('[politician-ministry] cables fetch error:', error.message);
    return;
  }
  if (!data?.length) return; // keep the blank-state message
  host.classList.remove('empty');
  host.innerHTML = data.map(c => `
    <div class="dcq-row">
      <div class="dcq-date">${escapeHtml(tickToDate(Number(c.sent_at_tick)))}</div>
      <div class="dcq-body"><b>Diplomatic Communique</b>
        &ldquo;${escapeHtml(c.body)}&rdquo;
        <span class="dcq-from">&mdash; ${escapeHtml(c.sender_name)}, Attach&eacute; in
        ${escapeHtml(c.host_city || '—')}, ${escapeHtml(c.host_nation || '—')}.</span></div>
    </div>`).join('');
}

(async () => {
  let ctx;
  try { ctx = await bootstrapPoliticianOrBusinessman('nation', 'nation'); }
  catch (e) { console.warn('[politician-ministry] bootstrap failed:', e?.message || e); return; }
  if (!ctx) return;
  const slug = resolveMinistrySlug();
  paintHeader(slug);
  document.getElementById('content').style.display = 'block';
  await Promise.all([
    renderActors(slug, ctx.nation?.id || null, Number(ctx.shard?.current_tick) || 0),
    renderCables(slug, ctx.nation?.id || null),
    renderFmStrip(slug, ctx),
  ]);
})();
</script>

</body>
</html>
