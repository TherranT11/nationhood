<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Politician | Nationhood Alpha</title>
<style>
/* Topbar / nav / body styling — same shape as the entrepreneur side
   (js/entrepreneur-topbar.js + entrepreneur-dashboard.html), just teal where
   entrepreneur uses green. Kept inline because politician-home is currently
   the only politician page; if more land, extract to a shared topbar module
   the way entrepreneur did. */
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#050505; color:#d4d4d4; font-family:-apple-system,system-ui,sans-serif; min-height:100vh; }

.pol-topbar { display:flex; align-items:center; gap:24px; padding:12px 28px;
  border-bottom:0.5px solid rgba(255,255,255,0.08); font-size:11px; letter-spacing:0.05em; }
.pol-topbar .brand { display:flex; align-items:center; gap:10px; }
.pol-topbar .crest { width:24px; height:24px; background:rgba(90,175,165,0.08); border:0.5px solid rgba(90,175,165,0.5);
  border-radius:3px; display:flex; align-items:center; justify-content:center; color:#5aafa5;
  font-size:11px; font-weight:600; letter-spacing:0.05em; }
.pol-topbar .player { color:#fff; font-weight:500; font-size:13px; }
.pol-topbar__version { font-family:monospace; font-size:10px; color:#f0efe6; letter-spacing:0.5px; opacity:0.8; }
.pol-topbar .meta { display:flex; gap:22px; color:#888; align-items:center; }
.pol-topbar .meta .label { color:#555; font-size:9px; letter-spacing:0.13em; }
.pol-topbar .meta .value { color:#d4d4d4; font-size:12px; margin-top:2px; display:flex; align-items:center; gap:6px; }
.pol-topbar .meta .flag { width:18px; height:12px; object-fit:cover; border:0.5px solid rgba(255,255,255,0.1); }
.pol-topbar .right { margin-left:auto; display:flex; align-items:center; gap:14px; position:relative; }
.pol-topbar .cash-pill { border:0.5px solid rgba(90,175,165,0.5); padding:6px 12px; border-radius:3px; font-size:11px; }
.pol-topbar .cash-pill .label { color:#888; }
.pol-topbar .cash-pill .value { color:#5aafa5; font-weight:500; }
.pol-switcher { position:relative; display:inline-block; }
.pol-pill { border:0.5px solid rgba(255,255,255,0.15); padding:6px 12px; border-radius:3px;
  font-size:11px; color:#5aafa5; cursor:pointer; white-space:nowrap; }
.pol-dd { position:absolute; right:0; top:calc(100% + 8px); background:#0f0f0f;
  border:0.5px solid rgba(255,255,255,0.15); border-radius:4px; min-width:240px; max-width:340px;
  display:none; z-index:100; overflow:hidden; }
.pol-dd.open { display:block; }
.pol-dd-item { display:flex; align-items:center; gap:10px; padding:10px 14px; font-size:11px;
  color:#d4d4d4; cursor:pointer; border-bottom:0.5px solid rgba(255,255,255,0.06); }
.pol-dd-item:last-child { border-bottom:none; }
.pol-dd-item:hover { background:#1a1a17; }
.pol-dd-badge { font-size:9px; letter-spacing:0.06em; min-width:40px; }
.pol-dd-name { flex:1; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pol-dd-empty { padding:10px; color:#666; font-size:10px; }
.pol-util { color:#666; font-size:11px; cursor:pointer; }
.pol-util:hover { color:#d4d4d4; }

/* Nav strip — single HOME entry for now. */
.pol-nav { display:flex; gap:32px; padding:0 28px; border-bottom:0.5px solid rgba(255,255,255,0.08);
  font-size:11px; letter-spacing:0.08em; }
.pol-nav a { padding:14px 0; color:#888; text-decoration:none; cursor:pointer; }
.pol-nav a:not(.active):hover { color:#d4d4d4; }
.pol-nav a.active { color:#5aafa5; border-bottom:1px solid #5aafa5; }

/* Body content — mirrors entrepreneur-dashboard.html .hero + .stats-row. */
.content { padding:32px 24px 24px; }
.hero { display:grid; grid-template-columns:1fr auto; gap:32px; margin-bottom:28px; }
.identity { display:flex; align-items:flex-start; gap:20px; }
.identity-portrait { width:88px; height:88px;
  background:linear-gradient(135deg, #2a2a25, #1a1a17);
  border:0.5px solid rgba(90,175,165,0.3); border-radius:4px;
  display:flex; align-items:center; justify-content:center;
  color:#5aafa5; font-size:28px; font-weight:500; letter-spacing:0.03em; flex-shrink:0; }
.identity-body .eyebrow { color:#5aafa5; font-size:10px; letter-spacing:0.15em; margin-bottom:6px; }
.identity-body .name { display:flex; align-items:baseline; gap:10px; margin-bottom:10px; }
.identity-body .name .first { font-size:44px; font-weight:500; color:#fff; letter-spacing:-0.02em; line-height:1; }
.identity-body .name .last  { font-family:Georgia,'Times New Roman',serif; font-size:44px; font-style:italic;
  color:#5aafa5; letter-spacing:-0.01em; line-height:1; }
.meta-row { display:flex; gap:28px; font-size:11px; letter-spacing:0.08em; color:#888; margin-bottom:12px; }
.meta-row .label { color:#555; margin-right:6px; }
.meta-row .val   { color:#d4d4d4; }

.anchor { text-align:right; padding-left:28px;
  border-left:0.5px solid rgba(255,255,255,0.08); min-width:280px; }
.anchor-label { color:#555; font-size:10px; letter-spacing:0.15em; margin-bottom:6px; }
.anchor-message { color:#888; font-size:14px; font-style:italic; line-height:1.5; max-width:280px; margin-left:auto; }

.stats-row { display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; margin-bottom:28px; }
.stat-card { background:#121212; border:0.5px solid rgba(255,255,255,0.08); border-radius:4px; padding:14px 16px; }
.stat-card.accent { border-top:2px solid #5aafa5; }
.stat-card .stat-label { color:#666; font-size:10px; letter-spacing:0.13em; margin-bottom:8px; }
.stat-card .stat-value { font-size:24px; font-weight:500; color:#fff; line-height:1; }
.stat-card .stat-value.text { font-size:18px; color:#5aafa5; }

.loading { font-family:monospace; font-size:11px; color:#4a4940; text-align:center; padding:80px 20px; }

@media (max-width:700px) {
  .pol-topbar { flex-wrap:wrap; row-gap:8px; gap:10px; padding:10px 12px; }
  .pol-topbar .brand { flex:1 1 auto; min-width:0; }
  .pol-topbar .player { font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pol-topbar .meta { order:99; width:100%; gap:14px; border-top:0.5px solid rgba(255,255,255,0.06); padding-top:8px; }
  .pol-topbar .meta .label { font-size:8px; }
  .pol-topbar .meta .value { font-size:11px; }
  .pol-topbar .right { margin-left:auto; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .pol-topbar .cash-pill, .pol-pill { font-size:10px; padding:4px 8px; }
  .pol-util { font-size:10px; }
  .pol-dd { min-width:200px; max-width:calc(100vw - 24px); }
  .pol-nav { padding:0 12px; gap:18px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .hero { grid-template-columns:1fr; gap:18px; }
  .anchor { text-align:left; padding-left:0; border-left:none; border-top:0.5px solid rgba(255,255,255,0.08); padding-top:14px; }
  .anchor-message { margin-left:0; }
  .stats-row { grid-template-columns:repeat(2, 1fr); }
  .identity-body .name .first, .identity-body .name .last { font-size:32px; }
}
</style>
</head>
<body>

<div id="loading" class="loading">LOADING...</div>

<div id="topbar" class="pol-topbar" style="display:none;">
  <div class="brand">
    <div class="crest" id="pol-crest">--</div>
    <span class="player" id="pol-name">Politician</span>
    <span class="pol-topbar__version" id="pol-version"></span>
  </div>
  <div class="meta">
    <div><div class="label">AGE</div><div class="value" id="pol-age">—</div></div>
    <div><div class="label">NATION</div><div class="value" id="pol-nation">—</div></div>
    <div><div class="label">GAME DATE</div><div class="value" id="pol-date">—</div></div>
    <div><div class="label">TICK</div><div class="value" id="pol-tick">—</div></div>
    <div><div class="label">NEXT TICK</div><div class="value" id="pol-next-tick">—</div></div>
  </div>
  <div class="right">
    <div class="cash-pill"><span class="label">POL CASH: </span><span class="value" id="pol-cash">$0</span></div>
    <div class="pol-switcher">
      <span class="pol-pill" id="pol-pill" title="Switch faction"><span id="pol-pill-label">Politician</span> &#x25BE;</span>
      <div class="pol-dd" id="pol-dd"></div>
    </div>
    <span class="pol-util" id="pol-logout">Logout</span>
  </div>
</div>

<nav id="pol-nav" class="pol-nav" style="display:none;">
  <a class="active" href="politician-home.html">HOME</a>
</nav>

<div id="content" class="content" style="display:none;">
  <div class="hero">
    <div class="identity">
      <div class="identity-portrait" id="hero-portrait">—</div>
      <div class="identity-body">
        <div class="eyebrow">— POLITICIAN —</div>
        <div class="name">
          <span class="first" id="hero-first">—</span>
          <span class="last"  id="hero-last"></span>
        </div>
        <div class="meta-row">
          <div><span class="label">AGE</span><span class="val" id="hero-age">—</span></div>
          <div><span class="label">NATION</span><span class="val" id="hero-nation">—</span></div>
          <div><span class="label">CAREER</span><span class="val" id="hero-career">—</span></div>
        </div>
      </div>
    </div>
    <div class="anchor">
      <div class="anchor-label">AFFILIATION</div>
      <div class="anchor-message" id="hero-affiliation">This character has no affiliation.</div>
    </div>
  </div>

  <div class="stats-row" id="stats-row"></div>
</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { APP_VERSION, hfFmtBig } from './js/utils.js';
import { isFactionInactive, isHiddenFromSwitcher, getFactionTypeBadge, getFactionDashboardUrl } from './js/game/factions.js';

const START_AGE = 25;
const TICKS_PER_AGE_YEAR = 12;
const NO_AFFILIATION_MESSAGE = 'This character has no affiliation.';

let politician = null;
let otherFactions = [];
let nation = null;
let countdownTimer = null;

async function init() {
  const { data: { user } } = await _supabase.auth.getUser();
  if (!user) { window.location.href = 'login.html'; return; }

  let factions = [];
  let shard = null;
  try {
    const [facRes, shardRes] = await Promise.all([
      _supabase.from('factions')
        .select('id, faction_type, faction_name, nation_id, branch, leader_first_name, leader_last_name, founded_tick, party_funds, abandoned_at, is_banned, politician_career, politician_charisma, politician_reputation, politician_credibility')
        .or(`id.eq.${user.id},linked_user_id.eq.${user.id}`),
      _supabase.from('shard').select('current_tick, current_date, next_tick_at').eq('name', 'Alpha Shard').single(),
    ]);
    if (facRes.error) throw facRes.error;
    if (shardRes.error) throw shardRes.error;
    factions = facRes.data || [];
    shard = shardRes.data || {};
  } catch (err) {
    console.error('politician-home: load failed', err);
    document.getElementById('loading').textContent = 'Failed to load. Please reload the page.';
    return;
  }

  const activeId = sessionStorage.getItem('active_faction_id');
  politician = factions.find(f => f.id === activeId && f.faction_type === 'politician' && !isFactionInactive(f))
            || factions.find(f => f.faction_type === 'politician' && !isFactionInactive(f))
            || null;

  if (!politician) {
    window.location.href = 'character-select.html';
    return;
  }

  // Fetch the politician's nation for the flag + name pill. Sequential because
  // we only know nation_id after picking the active politician above.
  if (politician.nation_id) {
    try {
      const { data, error } = await _supabase.from('nations')
        .select('id, name, flag_url, nation_profiles(flag_url)')
        .eq('id', politician.nation_id).maybeSingle();
      if (!error) nation = data;
    } catch (_) { /* nation is optional flair; absence falls back to '—' */ }
  }

  otherFactions = factions.filter(f =>
    f.id !== politician.id && !isFactionInactive(f) && !isHiddenFromSwitcher(f));

  render(shard);
  document.getElementById('loading').style.display = 'none';
  document.getElementById('topbar').style.display = 'flex';
  document.getElementById('pol-nav').style.display = 'flex';
  document.getElementById('content').style.display = 'block';
  startCountdown(shard.next_tick_at);
}

function escHtml(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
function escAttr(s) { return String(s == null ? '' : s).replace(/"/g, '&quot;'); }

function currentAge(currentTick) {
  if (politician.founded_tick == null) return START_AGE;
  const elapsed = Math.max(0, currentTick - Number(politician.founded_tick));
  return START_AGE + Math.floor(elapsed / TICKS_PER_AGE_YEAR);
}

function flagFor(n) {
  if (!n) return '';
  return (n.nation_profiles && n.nation_profiles.flag_url) || n.flag_url || `assets/flags/${n.name}.png`;
}

function render(shard) {
  const first = politician.leader_first_name || '';
  const last  = politician.leader_last_name  || '';
  const ini = (((first[0] || '') + (last[0] || '')).toUpperCase()) || '—';
  const display = (first || last) ? (first + ' ' + last).trim() : (politician.faction_name || 'Politician');
  const pillLabel = last ? `${(first[0] || '').toUpperCase()}. ${last}` : (first || 'Politician');
  const career = politician.politician_career || 'Independent';
  const age = String(currentAge(shard.current_tick || 0));

  // Topbar
  document.getElementById('pol-crest').textContent = ini;
  document.getElementById('pol-name').textContent = display;
  document.getElementById('pol-version').textContent = APP_VERSION;
  document.getElementById('pol-pill-label').textContent = pillLabel;
  document.getElementById('pol-age').textContent = age;
  document.getElementById('pol-cash').textContent = hfFmtBig(Number(politician.party_funds) || 0);
  document.getElementById('pol-date').textContent = shard.current_date || '—';
  document.getElementById('pol-tick').textContent = shard.current_tick != null ? String(shard.current_tick) : '—';

  const natEl = document.getElementById('pol-nation');
  if (nation) {
    natEl.innerHTML = `<img class="flag" src="${escAttr(flagFor(nation))}" alt="" onerror="this.style.visibility='hidden'">${escHtml(nation.name)}`;
  } else {
    natEl.textContent = '—';
  }

  // Hero (body)
  document.getElementById('hero-portrait').textContent = ini;
  document.getElementById('hero-first').textContent = first || display;
  document.getElementById('hero-last').textContent  = first ? last : '';
  document.getElementById('hero-age').textContent = age;
  document.getElementById('hero-nation').textContent = (nation && nation.name) || '—';
  document.getElementById('hero-career').textContent = career;
  // Affiliation: derived from career. Independent → the no-affiliation message;
  // any other career string IS the affiliation (party / union / movement name).
  document.getElementById('hero-affiliation').textContent =
    career === 'Independent' ? NO_AFFILIATION_MESSAGE : career;

  // Stat cards — 3 numerical (Charisma / Reputation / Credibility) + 1 text
  // (Career). First card gets the teal accent stripe, mirroring entrepreneur.
  const stats = [
    { label: 'CHARISMA',    value: politician.politician_charisma    ?? 1, kind: 'num' },
    { label: 'REPUTATION',  value: politician.politician_reputation  ?? 1, kind: 'num' },
    { label: 'CREDIBILITY', value: politician.politician_credibility ?? 1, kind: 'num' },
    { label: 'CAREER',      value: career,                                 kind: 'text' },
  ];
  document.getElementById('stats-row').innerHTML = stats.map((s, i) =>
    `<div class="stat-card${i === 0 ? ' accent' : ''}">
      <div class="stat-label">${escHtml(s.label)}</div>
      <div class="stat-value${s.kind === 'text' ? ' text' : ''}">${escHtml(s.value)}</div>
    </div>`
  ).join('');

  // Switcher dropdown. NOTE: near-duplicate of the dropdown logic in
  // common.js and entrepreneur-topbar.js — three inline copies live in the
  // codebase; a shared renderer is the right fix but touches all three
  // live topbars, so it's deferred to a focused pass.
  const dd = document.getElementById('pol-dd');
  if (!otherFactions.length) {
    dd.innerHTML = '<div class="pol-dd-empty">No other factions.</div>';
  } else {
    dd.innerHTML = otherFactions.map(f => {
      const { label, color } = getFactionTypeBadge(f.faction_type);
      return `<div class="pol-dd-item" data-id="${f.id}">
        <span class="pol-dd-badge" style="color:${color}">${label}</span>
        <span class="pol-dd-name">${escHtml(f.faction_name || 'Unnamed')}</span>
      </div>`;
    }).join('');
    dd.querySelectorAll('.pol-dd-item').forEach(el => {
      el.addEventListener('click', () => {
        const f = otherFactions.find(x => x.id === el.dataset.id);
        if (!f) return;
        sessionStorage.setItem('active_faction_id', f.id);
        window.location.href = getFactionDashboardUrl(f) || 'faction-select.html';
      });
    });
  }
}

function startCountdown(nextTickAt) {
  const el = document.getElementById('pol-next-tick');
  if (!el || !nextTickAt) return;
  const target = new Date(nextTickAt).getTime();
  const tick = () => {
    const diff = Math.max(0, target - Date.now());
    el.textContent = `${Math.floor(diff / 3600000)}h ${Math.floor((diff % 3600000) / 60000)}m ${Math.floor((diff % 60000) / 1000)}s`;
  };
  tick();
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(tick, 1000);
}

const pill = document.getElementById('pol-pill');
const dd = document.getElementById('pol-dd');
pill.addEventListener('click', (e) => { e.stopPropagation(); dd.classList.toggle('open'); });
document.addEventListener('click', (e) => {
  if (!e.target.closest('#pol-pill') && !e.target.closest('#pol-dd')) dd.classList.remove('open');
});

document.getElementById('pol-logout').addEventListener('click', async () => {
  try { await _supabase.auth.signOut(); } catch (e) { console.warn('[politician-home] signOut failed:', e?.message || e); }
  window.location.href = 'login.html';
});

init();
</script>
</body>
</html>
