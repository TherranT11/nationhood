<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Politician — Home</title>
<style>
/* Topbar / nav / body base styles live in js/politician-topbar.js — one source
   used by every politician page (mirrors the entrepreneur-topbar pattern).
   This page only styles its own body content. */
* { box-sizing:border-box; margin:0; padding:0; }
.content { padding:32px 24px 24px; }

.hero { display:grid; grid-template-columns:1fr auto; gap:32px; margin-bottom:28px; }
.identity { display:flex; align-items:flex-start; gap:20px; }
.identity-portrait { width:88px; height:88px;
  background:linear-gradient(135deg, #2a2a25, #1a1a17);
  border:0.5px solid rgba(90,175,165,0.3); border-radius:4px;
  display:flex; align-items:center; justify-content:center;
  color:#5aafa5; font-size:28px; font-weight:500; letter-spacing:0.03em; flex-shrink:0; }
.identity-body .eyebrow { color:#5aafa5; font-size:10px; letter-spacing:0.15em; margin-bottom:6px; }
.identity-body .name { display:flex; align-items:baseline; gap:10px; margin-bottom:10px; }
.identity-body .name .first { font-size:44px; font-weight:500; color:#fff; letter-spacing:-0.02em; line-height:1; }
.identity-body .name .last  { font-family:Georgia,'Times New Roman',serif; font-size:44px; font-style:italic;
  color:#5aafa5; letter-spacing:-0.01em; line-height:1; }
.meta-row { display:flex; gap:28px; font-size:11px; letter-spacing:0.08em; color:#888; margin-bottom:12px; }
.meta-row .label { color:#555; margin-right:6px; }
.meta-row .val   { color:#d4d4d4; }

.anchor { text-align:right; padding-left:28px;
  border-left:0.5px solid rgba(255,255,255,0.08); min-width:280px; }
.anchor-label   { color:#555; font-size:10px; letter-spacing:0.15em; margin-bottom:6px; }
.anchor-message { color:#888; font-size:14px; font-style:italic; line-height:1.5; max-width:280px; margin-left:auto; }
/* Player Nickname row — sits under the AFFILIATION block in the
   anchor. Toggle between display + inline edit. The pencil opens
   edit mode; ✓ saves, ✕ cancels. 12-char limit enforced both
   client-side (maxlength) and server-side (CHECK constraint). */
.anchor-nick      { margin-top:14px; padding-top:14px; border-top:0.5px solid rgba(255,255,255,0.06); }
.anchor-nick-row  { display:flex; align-items:center; gap:8px; justify-content:flex-end; }
.anchor-nick-val  { color:#cfcabf; font-size:13px; font-family:Georgia,'Times New Roman',serif;
  font-style:italic; }
.anchor-nick-val.empty { color:#555; }
.anchor-nick-btn  { background:transparent; border:0.5px solid rgba(255,255,255,0.08);
  border-radius:3px; padding:3px 6px; cursor:pointer; color:#888; font-size:11px;
  transition:color 0.15s, border-color 0.15s; }
.anchor-nick-btn:hover { color:#bbb; border-color:rgba(255,255,255,0.2); }
.anchor-nick-input { background:#080808; border:0.5px solid rgba(255,255,255,0.15);
  border-radius:3px; padding:4px 8px; color:#fff; font-size:13px; font-family:inherit;
  width:130px; outline:none; }
.anchor-nick-input:focus { border-color:#5aafa5; }

.stats-row { display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; margin-bottom:28px; }
.stat-card { background:#121212; border:0.5px solid rgba(255,255,255,0.08); border-radius:4px; padding:14px 16px; }
.stat-card.accent { border-top:2px solid #5aafa5; }
.stat-card .stat-label { color:#666; font-size:10px; letter-spacing:0.13em; margin-bottom:8px; }
.stat-card .stat-value { font-size:24px; font-weight:500; color:#fff; line-height:1; }
.stat-card .stat-value.text { font-size:18px; color:#5aafa5; }

.main-grid { display:grid; grid-template-columns:320px 1fr; gap:22px; }
.dispatch-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.dispatch-header .title { color:#5aafa5; font-size:11px; letter-spacing:0.15em; font-weight:500;
  display:flex; align-items:center; gap:6px; }
.dispatch-header .title .dot { display:inline-block; width:6px; height:6px; background:#5aafa5; border-radius:50%; }
.dispatch-header .count { color:#555; font-size:10px; letter-spacing:0.1em; }
.ev-tabs { display:flex; gap:4px; margin-bottom:12px; flex-wrap:wrap; }
.ev-tab { flex:1 1 auto; min-width:0; padding:7px 0; text-align:center; font-size:10px; letter-spacing:0.1em;
  color:#888; background:#121212; border:0.5px solid rgba(255,255,255,0.08);
  border-radius:3px; cursor:pointer; }
.ev-tab:hover:not(.active) { color:#d4d4d4; }
.ev-tab.active { color:#5aafa5; border-color:rgba(90,175,165,0.4); background:#121613; }
.ev-list { list-style:none; display:flex; flex-direction:column; max-height:600px; overflow-y:auto; }
.ev-item { padding:12px 0; border-bottom:0.5px solid rgba(255,255,255,0.06); }
.ev-item:last-child { border-bottom:none; }
.ev-meta { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
.ev-tag { font-size:9px; letter-spacing:0.08em; padding:2px 7px; border-radius:3px;
  background:rgba(90,175,165,0.10); color:#5aafa5; text-transform:uppercase; }
.ev-nation { font-size:9px; color:#888; letter-spacing:0.06em; display:flex; align-items:center; gap:4px; }
.ev-nation img { width:12px; height:9px; object-fit:cover; border-radius:1px; }
.ev-time { margin-left:auto; font-size:9px; color:#555; letter-spacing:0.1em; }
.ev-head { font-size:13px; font-weight:500; color:#fff; margin-bottom:3px; }
.ev-body { font-size:11px; color:#888; line-height:1.5; }
.ev-empty { color:#666; font-size:12px; padding:22px 4px; text-align:center; line-height:1.6; }

.section-heading { display:flex; align-items:baseline; gap:10px; margin-bottom:14px; }
.section-heading .roman { color:#555; font-size:11px; letter-spacing:0.1em; }
.section-heading .sans  { font-size:22px; font-weight:500; color:#fff; }
.section-heading .serif { font-size:22px; font-family:Georgia,'Times New Roman',serif; font-style:italic; color:#5aafa5; }
.section-heading .meta  { margin-left:auto; color:#555; font-size:10px; letter-spacing:0.1em; }
.retire-btn { margin-left:auto; font-family:monospace; font-size:10px; letter-spacing:0.08em;
  text-transform:uppercase; font-weight:600; padding:7px 13px; border-radius:4px;
  background:transparent; color:#c87a7a; border:0.5px solid rgba(200,122,122,0.4);
  cursor:pointer; transition:background 0.12s, border-color 0.12s; }
.retire-btn:hover    { background:rgba(200,122,122,0.10); border-color:#c87a7a; }
.retire-btn:disabled { color:#555; border-color:rgba(255,255,255,0.06); cursor:not-allowed; background:transparent; }
.empty { background:#121212; border:0.5px dashed rgba(255,255,255,0.10); border-radius:4px;
  padding:22px 18px; color:#666; font-size:12px; line-height:1.6; text-align:center; }

/* ─── Active Campaign card (Pressing Issues) ─────────────────────────
   Rendered when politician_active_election has a row for the current
   politician. Visual vocabulary matches the rest of the page (teal
   politician accent, monospaced labels, 0.5px borders); the partisan
   red accent appears only on the YOU side of the matchup and the
   party-name string in the description. All selectors prefixed with
   .ci- ("campaign issue") so the card is portable and won't collide
   with future Pressing-Issues sources. */
.ci-camp { background:#121212; border:0.5px solid rgba(255,255,255,0.12); border-radius:6px;
  overflow:hidden; border-left:3px solid #c8a64e; }
.ci-top { display:flex; align-items:flex-start; gap:14px; padding:14px 16px;
  border-bottom:0.5px solid rgba(255,255,255,0.06); }
.ci-top-titles { flex:1; min-width:0; }
.ci-eyebrow { font-size:8.5px; letter-spacing:0.14em; color:#c8a64e; font-weight:600; margin-bottom:4px; }
.ci-name { font-size:14px; font-weight:600; color:#fff; letter-spacing:-0.005em; line-height:1.25; }
.ci-name .serif { font-family:Georgia,serif; font-style:italic; color:#c8a64e; }
.ci-sub { font-size:10.5px; color:#888; margin-top:5px; line-height:1.5; }
.ci-sub strong { color:#c87a7a; font-weight:600; }
.ci-meta { flex-shrink:0; text-align:right; }
.ci-time { font-size:18px; font-weight:600; color:#fff; font-variant-numeric:tabular-nums; line-height:1; }
.ci-time-l { font-size:7.5px; letter-spacing:0.1em; color:#666; margin-top:4px; }
.ci-time-l.final { color:#d4b87a; font-weight:600; }

.ci-poll { padding:14px 16px; border-bottom:0.5px solid rgba(255,255,255,0.06); }
.ci-poll-lab { font-size:8.5px; letter-spacing:0.13em; color:#666; margin-bottom:9px; }
.ci-poll-nums { display:flex; justify-content:space-between; gap:8px; font-size:10px; margin-bottom:5px; }
.ci-poll-nums .v { font-family:monospace; font-size:10px; }
.ci-pn-you { color:#c87a7a; font-weight:600; }
.ci-pn-opp { color:#6ac4c4; font-weight:600; }
.ci-pn-und { color:#888; }
.ci-poll-bar { height:9px; border-radius:3px; background:#1a1a1a; overflow:hidden; display:flex; }
.ci-pb-you { background:#c87a7a; }
.ci-pb-opp { background:#6ac4c4; }
.ci-pb-und { background:#3a3a3a; }

.ci-match { padding:14px 16px; border-bottom:0.5px solid rgba(255,255,255,0.06); display:flex; align-items:center; gap:12px; }
.ci-side { flex:1; text-align:center; }
.ci-side .ci-who { font-size:8px; letter-spacing:0.08em; color:#888; margin-bottom:4px; }
.ci-side.you .ci-who { color:#c87a7a; font-weight:600; }
.ci-side.opp .ci-who { color:#6ac4c4; font-weight:600; }
.ci-portrait { width:32px; height:32px; border-radius:5px; display:flex; align-items:center; justify-content:center;
  font-size:10px; font-weight:700; margin:0 auto 5px; }
.ci-portrait.you { background:#1a0c0c; border:0.5px solid #6a2a2a; color:#c87a7a; }
.ci-portrait.opp { background:#0e1414; border:0.5px solid #2e5252; color:#6ac4c4; }
.ci-side .ci-pname { font-size:10px; color:#fff; font-weight:500; line-height:1.2; }
.ci-vs { font-size:9px; letter-spacing:0.13em; color:#666; font-weight:600; flex-shrink:0; }
.ci-stat { padding:8px 11px; background:#0a0a0a; border-radius:4px; border:0.5px solid rgba(255,255,255,0.06);
  display:flex; flex-direction:column; align-items:center; gap:4px; min-width:90px; flex-shrink:0; }
.ci-stat-lab { font-size:7.5px; letter-spacing:0.1em; color:#666; }
.ci-stat-row { display:flex; align-items:baseline; gap:8px; font-variant-numeric:tabular-nums; font-weight:600; }
.ci-stat-row .you { color:#c87a7a; font-size:15px; }
.ci-stat-row .vs  { color:#555; font-size:8px; letter-spacing:0.08em; }
.ci-stat-row .opp { color:#6ac4c4; font-size:15px; }

.ci-events { padding:14px 16px; border-bottom:0.5px solid rgba(255,255,255,0.06); }
.ci-events-lab { font-size:8.5px; letter-spacing:0.13em; color:#666; margin-bottom:9px; }
.ci-ev-row { display:flex; align-items:flex-start; gap:10px; padding:6px 0; font-size:11px; color:#bbb; line-height:1.45; }
.ci-ev-icon { width:18px; flex-shrink:0; color:#888; font-size:11px; text-align:center; padding-top:1px; }
.ci-ev-text strong { color:#fff; }

.ci-actions { padding:14px 16px; background:#0a0a0a; }
.ci-actions-lab { font-size:8.5px; letter-spacing:0.13em; color:#666; margin-bottom:9px;
  display:flex; justify-content:space-between; align-items:baseline; }
.ci-actions-lab .remind { color:#888; font-style:italic; font-size:8.5px; letter-spacing:0.04em; text-transform:none; }
.ci-act-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; }
.ci-act { padding:10px 11px; background:#121212; border:0.5px solid rgba(255,255,255,0.08); border-radius:5px;
  text-align:left; cursor:pointer; transition:all 0.15s; font:inherit; color:inherit; }
.ci-act:hover:not(:disabled) { background:#161616; border-color:rgba(255,255,255,0.16); }
.ci-act:disabled { cursor:not-allowed; opacity:0.4; }
.ci-act-head { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
.ci-act-icon { font-size:12px; }
.ci-act-name { font-size:11px; font-weight:600; color:#fff; flex:1; }
.ci-act-blurb { font-size:9.5px; color:#888; line-height:1.4; margin-bottom:6px; }
.ci-act-meta { display:flex; justify-content:space-between; font-size:8.5px; letter-spacing:0.04em; }
.ci-act-effect { color:#6ab07a; font-weight:600; }
.ci-act-effect.var { color:#d4b87a; }
.ci-act-cost { color:#666; }
.ci-act-lockmsg { padding:8px 11px; margin-top:8px; background:#0a0a0a; border-radius:4px;
  border:0.5px dashed rgba(255,255,255,0.08); font-size:10px; color:#888; text-align:center; }

/* Career log — one date-prefixed row per event, listed newest-first. Visual
   weight tuned to match the Pressing Issues card above it: same background,
   same border opacity, similar internal padding. */
.career-events { background:#121212; border:0.5px solid rgba(255,255,255,0.12); border-radius:4px;
  padding:4px 18px; }
.career-event  { display:flex; gap:14px; padding:14px 0;
  border-bottom:0.5px solid rgba(255,255,255,0.06); }
.career-event:last-child { border-bottom:none; }
.career-event .date { font-family:monospace; font-size:10px; color:#888;
  letter-spacing:0.05em; flex-shrink:0; min-width:120px; padding-top:1px; }
.career-event .text { font-size:12px; color:#d4d4d4; line-height:1.5; }

.loading { font-family:monospace; font-size:11px; color:#4a4940; text-align:center; padding:80px 20px; }

@media (max-width:700px) {
  .hero { grid-template-columns:1fr; gap:18px; }
  .anchor { text-align:left; padding-left:0; border-left:none; border-top:0.5px solid rgba(255,255,255,0.08); padding-top:14px; }
  .anchor-message { margin-left:0; }
  .stats-row { grid-template-columns:repeat(2, 1fr); }
  .identity-body .name .first, .identity-body .name .last { font-size:32px; }
  .main-grid { grid-template-columns:1fr; }
}

/* ─── Current Affiliation panel ─────────────────────────────────────
   Shows the politician's current role + the repeatable actions
   associated with it. Variant theming via --acc-* CSS vars set per
   politician_office:
     Party Member  → party teal
     Local Govt    → green (Community Organizer / City Council Member)
     Legislature   → steel-blue (Member of Parliament / Senior MP)
   All action buttons are visually present but disabled — their RPC
   wiring lands when the per-role action mechanics ship. */
.affil { background:#0d0d0d; border:0.5px solid rgba(255,255,255,0.07); border-radius:7px;
  overflow:hidden; border-left:3px solid var(--acc); margin-top:8px; }
.affil.var-party { --acc:#7a9aab; --acc-bg:#0e1218; --acc-dim:#3a5060; --acc-bright:#a5c0d0; }
.affil.var-local { --acc:#9aab7a; --acc-bg:#13160e; --acc-dim:#4a5a3a; --acc-bright:#b9c898; }
.affil.var-leg   { --acc:#7a9aab; --acc-bg:#0e1218; --acc-dim:#3a5060; --acc-bright:#a5c0d0; }

.ah-row { display:flex; align-items:flex-start; gap:14px; padding:16px 20px;
  border-bottom:0.5px solid rgba(255,255,255,0.07); background:var(--acc-bg); }
.ah-badge { width:38px; height:38px; border-radius:5px; background:#0a0a0a;
  border:0.5px solid var(--acc-dim); color:var(--acc-bright);
  display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.ah-info { flex:1; min-width:0; }
.ah-eyebrow { font-size:8px; letter-spacing:0.14em; color:var(--acc); font-weight:600; margin-bottom:4px; }
.ah-name { font-size:14px; font-weight:600; color:#fff; letter-spacing:-0.005em; line-height:1.3; }
.ah-rank { font-size:10px; color:#888; font-style:italic; margin-left:7px; font-weight:400; }
.ah-desc { font-size:10.5px; color:#bbb; margin-top:5px; line-height:1.55; }
.ah-desc strong { color:var(--acc-bright); font-weight:600; }
.ah-tenure { flex-shrink:0; text-align:right; font-size:9px; color:#888; letter-spacing:0.04em; }
.ah-tenure-val { font-size:13px; color:var(--acc-bright); font-weight:700;
  font-variant-numeric:tabular-nums; display:block; line-height:1; }
.ah-tenure-lab { font-size:8px; color:#666; margin-top:3px; }

.act-row { padding:14px 20px; }
.ar-lab { font-size:8.5px; letter-spacing:0.14em; color:#666; font-weight:600; margin-bottom:10px; }
.ar-buttons { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
.ar-buttons.cols-2 { grid-template-columns:repeat(2,1fr); }

.act-btn { background:#0a0a0a; border:0.5px solid rgba(255,255,255,0.07); border-radius:5px;
  padding:13px 14px; text-align:left; display:flex; flex-direction:column; gap:5px;
  cursor:pointer; transition:background 0.15s, border-color 0.15s; }
.act-btn:not(.disabled):hover { background:#101010; border-color:var(--acc-dim); }
.act-btn:not(.disabled):hover .act-name { color:var(--acc-bright); }
.act-btn.disabled { opacity:0.45; cursor:not-allowed; transition:none; }
.act-btn.disabled:hover { background:#0a0a0a; border-color:rgba(255,255,255,0.07); }
.act-btn.cooldown { opacity:0.55; cursor:not-allowed; }
.act-btn.cooldown:hover { background:#0a0a0a; border-color:rgba(255,255,255,0.07); }
.act-cooldown { font-size:8.5px; letter-spacing:0.1em; color:#d4b87a; font-weight:600; font-family:monospace; margin-top:3px; }
.act-head { display:flex; align-items:center; gap:8px; }
.act-ic { font-size:13px; color:var(--acc-bright); flex-shrink:0; }
.act-name { font-size:11px; font-weight:600; color:#fff; letter-spacing:0.04em; flex:1; }
.act-cost { font-size:8.5px; letter-spacing:0.1em; color:#d4b87a; font-weight:600; font-family:monospace; }
.act-desc { font-size:9.5px; color:#888; line-height:1.5; }

@media (max-width: 768px) {
  .ar-buttons { grid-template-columns:1fr; }
  .ar-buttons.cols-2 { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<div id="pol-topbar-container"></div>

<div class="content" id="content" style="display:none;">
  <div class="hero">
    <div class="identity">
      <div class="identity-portrait" id="hero-portrait">—</div>
      <div class="identity-body">
        <div class="eyebrow">— POLITICIAN —</div>
        <div class="name">
          <span class="first" id="hero-first">—</span>
          <span class="last"  id="hero-last"></span>
        </div>
        <div class="meta-row">
          <div><span class="label">AGE</span><span class="val" id="hero-age">—</span></div>
          <div><span class="label">NATION</span><span class="val" id="hero-nation">—</span></div>
          <div><span class="label">AFFILIATION</span><span class="val" id="hero-career">—</span></div>
        </div>
      </div>
    </div>
    <div class="anchor">
      <div class="anchor-label">AFFILIATION</div>
      <div class="anchor-message" id="hero-affiliation">This character has no affiliation.</div>
      <div class="anchor-nick">
        <div class="anchor-label">PLAYER NICKNAME</div>
        <div class="anchor-nick-row" id="nick-row"></div>
      </div>
    </div>
  </div>

  <div class="stats-row" id="stats-row"></div>

  <div class="main-grid">
    <div class="dispatch-side">
      <div class="dispatch-header">
        <div class="title"><span class="dot"></span>DISPATCHES</div>
        <div class="count" id="ev-count">—</div>
      </div>
      <div class="ev-tabs" id="ev-tabs">
        <div class="ev-tab active" data-tab="politics">POLITICS</div>
        <div class="ev-tab" data-tab="corporate">CORPORATE</div>
        <div class="ev-tab" data-tab="military">MILITARY</div>
        <div class="ev-tab" data-tab="nation">NATION</div>
        <div class="ev-tab" data-tab="world">WORLD</div>
      </div>
      <ul class="ev-list" id="ev-list"><li class="ev-empty">Loading…</li></ul>
    </div>
    <div class="content-right">
      <div class="section-heading">
        <span class="roman">I.</span>
        <span class="sans">Pressing</span>
        <span class="serif">Issues</span>
      </div>
      <div id="pressing-issues"></div>

      <div class="section-heading" style="margin-top:28px;">
        <span class="roman">II.</span>
        <span class="sans">Current</span>
        <span class="serif">Affiliation</span>
      </div>
      <div id="affiliation-host"></div>

      <div class="section-heading" style="margin-top:28px;">
        <span class="roman">III.</span>
        <span class="sans">Political</span>
        <span class="serif">Career</span>
        <button class="retire-btn" id="retire-btn" title="End this politician's career">Retire</button>
      </div>
      <div class="career-events" id="career-events"></div>
    </div>
  </div>
</div>

<div id="loading" class="loading">LOADING...</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { tickToDate, fmtBig, officeTitle, termEndTickFor } from './js/utils.js';
import { bootstrapPolitician } from './js/politician-topbar.js';
import { isFactionInactive, getFactionDashboardUrl } from './js/game/factions.js';

const NO_AFFILIATION_MESSAGE = 'This character has no affiliation.';
// Dispatch bucket categories — mirror entrepreneur-dashboard.html so the same
// event_log row falls into the same bucket on both surfaces.
const POLITICS_CATEGORIES  = ['politics','political','government','crisis','diplomatic','diplomacy','international','economy','executive_order','protest','bill','new_party'];
const CORPORATE_CATEGORIES = ['corporate','business','trade'];

// Career-log templates — keyed by politician_career_events.event_type. Adding
// a new beat is one entry here plus whatever inserts the row server-side.
// Each template gets (name, target_name, metadata); metadata defaults to
// {} so older entries that don't use it can ignore the third arg.
// Dissident-group joins / founds are deliberately omitted: underground
// affiliations are illegal in-fiction and the public career log isn't where
// they belong (a separate private dossier surface would house those).
const CAREER_EVENT_TEMPLATES = {
  joined_party:  (name, target) => `${name} has registered their membership in the ${target || 'a political party'}.`,
  left_party:    (name, target) => `${name} has resigned their membership in the ${target || 'their political party'}.`,
  founded_party: (name, target) => `The ${target || 'new political party'} was established by ${name}.`,
  joined_ngo:    (name, target) => `${name} has registered their membership in the ${target || 'a non-government organisation'}.`,
  founded_ngo:   (name, target) => `The ${target || 'new organisation'} was established by ${name}.`,
  // stood_for_election: written by politician_stand_for_election (20270402).
  // metadata.race_tier ('community' | 'parliament') picks the template
  // shape; metadata.opponent carries the snapshot full name. Falls back
  // gracefully if either is missing so the row still renders something
  // sensible if the metadata shape changes later.
  stood_for_election: (name, target, meta = {}) => {
    const opp  = meta.opponent || 'an opponent';
    const seat = target || 'a contested district';
    return meta.race_tier === 'parliament'
      ? `${name} has decided to stand for an election, running for the ${seat} seat against ${opp}.`
      : `${name} has decided to stand for an election, running to be a community organizer in ${seat} against ${opp}.`;
  },
  won_election:  (name, target) => `${name} won the election in ${target || 'a contested district'}.`,
  lost_election: (name, target) => `${name} lost the election in ${target || 'a contested district'}.`,
};

let politician = null;
let nation = null;
let party = null;
let allEvents = [];
let evCurrentTab = 'politics';
let evTickNow = 0;
let careerRows = [];  // persistent rows from politician_career_events; merged with the derived founding event at render time.
let activeRace = null; // politician_active_election row when one exists; drives the Pressing Issues campaign card.

async function init() {
  let ctx = null;
  try { ctx = await bootstrapPolitician('home'); }
  catch (err) {
    console.error('politician-home: bootstrap failed', err);
    document.getElementById('loading').textContent = 'Failed to load. Please reload the page.';
    return;
  }
  if (!ctx) return; // redirected by bootstrap (no auth / no politician)

  politician = ctx.faction;
  nation     = ctx.nation;
  party      = ctx.party || null;
  evTickNow  = Number(ctx.shard?.current_tick) || 0;

  // Resolve any due election so the influence card on this page is honest
  // even when the player visits home before career. The career page is
  // where the result banner is shown; here we just want the side effects
  // (influence delta + career_events row) to land. Soft-fails so a
  // missing RPC during early dev doesn't break the home page.
  try {
    const { data, error } = await _supabase.rpc('politician_resolve_due_elections');
    if (!error && data?.resolved) {
      politician.politician_influence = data.politician_influence;
    }
  } catch (_) { /* non-fatal */ }

  try {
    const [evRes, careerRes, raceRes] = await Promise.all([
      _supabase.from('event_log')
        .select('id, event_name, description_used, description_chosen, category, trigger_key, fired_at_tick, nation_id, nations(name, nation_profiles(flag_url))')
        .not('category', 'is', null)
        .order('fired_at_tick', { ascending: false })
        .limit(200),
      _supabase.from('politician_career_events')
        .select('event_tick, event_type, target_name, metadata')
        .eq('faction_id', politician.id)
        .order('event_tick', { ascending: false }),
      // Pulls only the columns the Pressing Issues card renders. resolve_due
      // ran above, so a just-resolved race has already been deleted by the
      // time this fetch runs (Promise.all does not enforce order; here
      // ordering doesn't matter because resolve happened in a prior await).
      _supabase.from('politician_active_election')
        .select('race_tier, district, opp_first, opp_last, opp_blurb, opp_party_name, your_stat, opp_stat, win_odds_pct, stake_win, stake_lose, resolve_tick, polling_you_pct, polling_opp_pct, polling_undecided_pct, created_at')
        .eq('politician_id', politician.id)
        .maybeSingle(),
    ]);
    if (evRes.error) throw evRes.error;
    if (careerRes.error) throw careerRes.error;
    if (raceRes.error) console.error('politician-home: active_election fetch failed', raceRes.error);
    allEvents  = evRes.data || [];
    careerRows = careerRes.data || [];
    activeRace = raceRes.data || null;
  } catch (err) {
    console.error('politician-home: event_log / career-events fetch failed', err);
    allEvents = [];
    careerRows = [];
    activeRace = null;
  }

  renderHero(ctx.shard);
  renderStats();
  renderPressingIssues(ctx);
  renderAffiliation(ctx);
  renderCareer();
  renderDispatches();
  bindDispatchTabs();
  bindRetireButton(ctx.allUserFactions || []);
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}

// Retire — soft-deletes the politician via the politician_retire RPC and
// hands the user off to whatever other active faction they have (via the
// shared getFactionDashboardUrl), falling back to login.html when there
// isn't one. Mirrors the topbar switcher's redirect logic so the same
// active_faction_id contract carries over.
function bindRetireButton(allFactions) {
  const btn = document.getElementById('retire-btn');
  if (!btn || !politician?.id) return;
  btn.addEventListener('click', async () => {
    const name = [politician.leader_first_name, politician.leader_last_name].filter(Boolean).join(' ') || 'this politician';
    if (!confirm(`Retire ${name}? Their career ends and the page redirects. This cannot be undone.`)) return;
    btn.disabled = true; btn.textContent = 'Retiring…';
    try {
      const { data, error } = await _supabase.rpc('politician_retire', { p_politician_id: politician.id });
      if (error) throw error;
      if (!data || !data.success) {
        alert('Could not retire: ' + (data?.reason || 'unknown'));
        btn.disabled = false; btn.textContent = 'Retire';
        return;
      }
      // Hand off to another active faction if the user has one, else login.
      const next = (allFactions || []).find(f => !isFactionInactive(f));
      if (next) {
        sessionStorage.setItem('active_faction_id', next.id);
        window.location.href = getFactionDashboardUrl(next) || 'login.html';
      } else {
        sessionStorage.removeItem('active_faction_id');
        window.location.href = 'login.html';
      }
    } catch (err) {
      console.error('politician-home: retire failed', err);
      alert('Could not retire: ' + (err.message || err));
      btn.disabled = false; btn.textContent = 'Retire';
    }
  });
}

function escHtml(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
function escAttr(s) { return String(s == null ? '' : s).replace(/"/g, '&quot;'); }

function renderHero(shard) {
  const first = politician.leader_first_name || '';
  const last  = politician.leader_last_name  || '';
  const ini = (((first[0] || '') + (last[0] || '')).toUpperCase()) || '—';
  const display = (first || last) ? (first + ' ' + last).trim() : (politician.faction_name || 'Politician');
  // Hero pill — Affiliation. Derives from the live party FK
  // (politician_party_id → `party`), not from the politician_career
  // text column. The text column was added in 20270355 with DEFAULT
  // 'Independent' and is never updated by the join / leave flow, so
  // it goes stale the moment a politician joins. Reading the joined
  // party row keeps this in agreement with the Tier 0 rung on the
  // Career page and the party-member surfaces.
  const career = party?.faction_name || 'Independent';
  // Politicians age 1 year per 12 ticks, starting at 25. Same formula as the
  // topbar's currentAge (kept inline here because this page renders age into
  // the body too; if we ever need a third reader, extract to a helper).
  const elapsed = Math.max(0, (shard?.current_tick || 0) - Number(politician.founded_tick || 0));
  const age = String(25 + Math.floor(elapsed / 12));

  document.getElementById('hero-portrait').textContent = ini;
  paintHeroName(politician, display);
  document.getElementById('hero-age').textContent = age;
  document.getElementById('hero-nation').textContent = (nation && nation.name) || '—';
  document.getElementById('hero-career').textContent = career;
  renderNicknameRow((politician.nickname || '').trim());
  // Affiliation reads from the looked-up movement_party (ctx.party set
  // by bootstrapPolitician) plus the politician's office. When an
  // office is held, the surface collapses to "{Office} · {Party}"
  // (membership is implicit in holding the office). Same source as
  // politician-career.html's affiliation block — single OFFICE_TITLES
  // map in js/utils.js so the two surfaces never disagree.
  const office = politician.politician_office || null;
  document.getElementById('hero-affiliation').textContent = party
    ? (office
        ? `${officeTitle(office)} · ${party.faction_name}`
        : `Party Member of ${party.faction_name}`)
    : NO_AFFILIATION_MESSAGE;
}

// Paint the split hero name. first goes in the bold span, last + any
// "(Nickname)" tail in the serif span. Called by renderHero on load
// and by saveNickname after a successful UPDATE so the surface stays
// in lockstep with politician.nickname without a full re-render.
function paintHeroName(p, fallbackDisplay) {
  const first = p.leader_first_name || '';
  const last  = p.leader_last_name  || '';
  const nick  = (p.nickname || '').trim();
  document.getElementById('hero-first').textContent = first || fallbackDisplay;
  document.getElementById('hero-last').textContent  = first
    ? last + (nick ? ` (${nick})` : '')
    : (nick ? `(${nick})` : '');
}

// Player nickname row in the anchor. Two states — display (current
// nickname or em-dash + pencil) and edit (input + save/cancel).
// Save UPDATEs factions.nickname via the linked_user_id RLS policy;
// CHECK constraint catches over-12-char attempts server-side.
function renderNicknameRow(currentNick) {
  const row = document.getElementById('nick-row');
  if (!row) return;
  const nick = (currentNick || '').trim();
  row.innerHTML = nick
    ? `<span class="anchor-nick-val">${escHtml(nick)}</span>
       <button class="anchor-nick-btn" data-edit-nick title="Edit nickname">&#9998;</button>`
    : `<span class="anchor-nick-val empty">— not set —</span>
       <button class="anchor-nick-btn" data-edit-nick title="Set nickname">&#9998;</button>`;
  const editBtn = row.querySelector('[data-edit-nick]');
  if (editBtn) editBtn.onclick = () => openNicknameEditor(nick);
}

function openNicknameEditor(currentNick) {
  const row = document.getElementById('nick-row');
  if (!row) return;
  row.innerHTML = `
    <input class="anchor-nick-input" type="text" id="nick-input" maxlength="12" value="${escHtml(currentNick || '')}" autocomplete="off" placeholder="Up to 12 chars">
    <button class="anchor-nick-btn" data-save-nick title="Save">&#10003;</button>
    <button class="anchor-nick-btn" data-cancel-nick title="Cancel">&times;</button>`;
  const input = row.querySelector('#nick-input');
  input?.focus();
  input?.select();
  row.querySelector('[data-save-nick]').onclick   = () => saveNickname(input.value);
  row.querySelector('[data-cancel-nick]').onclick = () => renderNicknameRow(politician.nickname);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter')  { e.preventDefault(); saveNickname(input.value); }
    if (e.key === 'Escape') { e.preventDefault(); renderNicknameRow(politician.nickname); }
  });
}

async function saveNickname(raw) {
  const next = (raw || '').trim().slice(0, 12);
  // Empty string clears the nickname (NULL).
  const value = next === '' ? null : next;
  const row = document.getElementById('nick-row');
  if (row) {
    row.querySelectorAll('button').forEach(b => b.disabled = true);
  }
  try {
    const { error } = await _supabase.from('factions')
      .update({ nickname: value })
      .eq('id', politician.id);
    if (error) throw error;
    politician.nickname = value;
    renderNicknameRow(value);
    paintHeroName(politician, politician.faction_name || 'Politician');
  } catch (err) {
    console.warn('politician-home: nickname save failed', err);
    alert('Could not save nickname. Try again.');
    renderNicknameRow(politician.nickname);
  }
}

// Career log — derived from the politician's lifecycle today. Only one event
// exists (the founding); future entries (joined party X, became MP, scandal,
// etc.) get appended as those mechanics land and can write into the same list.
// Sorted newest-first so a long career reads with the latest beat on top.
function renderCareer() {
  const first = politician.leader_first_name || '';
  const last  = politician.leader_last_name  || '';
  const display = (first || last) ? (first + ' ' + last).trim() : (politician.faction_name || 'This politician');
  const nationName = (nation && nation.name) || 'an unknown nation';

  const events = [];
  if (politician.founded_tick != null) {
    events.push({
      tick: Number(politician.founded_tick),
      text: `${display} began their career in the nation of ${nationName}.`,
    });
  }
  // Persistent career rows (joined_party / founded_party / joined_ngo /
  // founded_ngo / stood_for_election / won_election / lost_election today).
  // Unknown event_types are skipped so a future row shape lands silently
  // rather than rendering "[object Object]".
  for (const row of careerRows) {
    const fn = CAREER_EVENT_TEMPLATES[row.event_type];
    if (!fn) continue;
    events.push({ tick: Number(row.event_tick), text: fn(display, row.target_name, row.metadata || {}) });
  }
  events.sort((a, b) => b.tick - a.tick);

  const host = document.getElementById('career-events');
  if (!host) return;
  if (!events.length) {
    host.innerHTML = '<div class="career-event"><span class="text" style="color:#666; font-style:italic;">No career events recorded yet.</span></div>';
    return;
  }
  host.innerHTML = events.map(ev => `
    <div class="career-event">
      <span class="date">${escHtml(tickToDate(ev.tick))}</span>
      <span class="text">${escHtml(ev.text)}</span>
    </div>`).join('');
}

function renderStats() {
  const stats = [
    { label: 'CHARISMA',    value: politician.politician_charisma    ?? 1,           kind: 'num' },
    { label: 'REPUTATION',  value: politician.politician_reputation  ?? 1,           kind: 'num' },
    { label: 'CREDIBILITY', value: politician.politician_credibility ?? 1,           kind: 'num' },
    { label: 'INFLUENCE',   value: fmtBig(Number(politician.politician_influence) || 0), kind: 'num' },
  ];
  document.getElementById('stats-row').innerHTML = stats.map((s, i) =>
    `<div class="stat-card${i === 0 ? ' accent' : ''}">
      <div class="stat-label">${escHtml(s.label)}</div>
      <div class="stat-value${s.kind === 'text' ? ' text' : ''}">${escHtml(s.value)}</div>
    </div>`
  ).join('');
}

function renderAffiliation(ctx) {
  const host = document.getElementById('affiliation-host');
  if (!host) return;
  const office  = ctx.faction?.politician_office || null;
  const variant = office && AFFIL_VARIANTS[office] ? AFFIL_VARIANTS[office] : AFFIL_VARIANTS.party_member;
  const partyName = ctx.party?.faction_name || '';

  // Description: variant-specific descriptors, with Party Member
  // falling back to "no party" copy when politician_party_id is unset.
  const descHtml = office
    ? variant.desc
    : (partyName ? variant.descIfPartyName(partyName) : variant.descIfNoParty());

  // Term-end pill (top-right). Single source for term length is
  // termEndTickFor() in utils.js — legislature seats reseat at the
  // nation's next_election_tick; local seats run a 12-tick term from
  // when they won. Renders nothing for offices without a scheduled
  // end (no office, or office without term tracking).
  const wonAt = Number(ctx.faction?.politician_office_won_at_tick) || 0;
  const curr  = Number(ctx.shard?.current_tick) || 0;
  const endTick = termEndTickFor({
    office,
    nextGeneralElectionTick: Number(ctx.nation?.next_election_tick) || 0,
    officeWonAtTick: wonAt,
  });
  const remaining = endTick != null ? Math.max(0, endTick - curr) : null;
  const tenureHtml = endTick != null
    ? `<div class="ah-tenure">
         <span class="ah-tenure-val">${escHtml(tickToDate(endTick))}</span>
         <span class="ah-tenure-lab">TERM ENDS · ${remaining} TICK${remaining === 1 ? '' : 'S'} REMAINING</span>
       </div>`
    : '';

  // Optional rank label (placeholder — district / party abbrev would
  // come from a future "office_placement" surface).
  const rankHtml = office
    ? '' // future: " · District N · {PARTY_ABBREV}"
    : (partyName ? ` <span class="ah-rank">· ${escHtml(partyName)}</span>` : '');

  // Cooldown: shared across all three MP actions (20270433). When set
  // in the future, current_tick >= next_mp_action_tick means ready.
  // Other roles ignore this column.
  const nextActionTick = Number(ctx.faction?.next_mp_action_tick) || 0;
  const onCooldown = variant.actionsEnabled && nextActionTick > curr;
  const cooldownLeft = onCooldown ? nextActionTick - curr : 0;

  const actionsCount = variant.actions.length;
  const colsClass = actionsCount === 2 ? ' cols-2' : '';
  const actionsHtml = variant.actions.map(a => {
    const enabled = !!variant.actionsEnabled && !!a.action;
    let cls = 'act-btn';
    let attrs = '';
    if (!enabled) {
      cls += ' disabled';
      attrs = ' aria-disabled="true" title="Action mechanics coming soon"';
    } else if (onCooldown) {
      cls += ' cooldown';
      attrs = ` aria-disabled="true" title="Cooldown — ${cooldownLeft} tick${cooldownLeft === 1 ? '' : 's'} remaining"`;
    } else {
      attrs = ` data-action="${escHtml(a.action)}"`;
    }
    const cooldownLine = enabled && onCooldown
      ? `<div class="act-cooldown">Ready in ${cooldownLeft} tick${cooldownLeft === 1 ? '' : 's'}</div>`
      : '';
    return `
    <div class="${cls}"${attrs}>
      <div class="act-head">
        <span class="act-ic">${a.ic}</span>
        <span class="act-name">${escHtml(a.name)}</span>
        <span class="act-cost">${escHtml(a.cost)}</span>
      </div>
      <div class="act-desc">${escHtml(a.desc)}</div>
      ${cooldownLine}
    </div>`;
  }).join('');

  host.innerHTML = `
    <div class="affil ${variant.variant}">
      <div class="ah-row">
        <div class="ah-badge">${variant.badge}</div>
        <div class="ah-info">
          <div class="ah-eyebrow">${escHtml(variant.eyebrow)}</div>
          <div class="ah-name">${escHtml(variant.name)}${rankHtml}</div>
          <div class="ah-desc">${descHtml}</div>
        </div>
        ${tenureHtml}
      </div>
      <div class="act-row">
        <div class="ar-lab">REPEATABLE ACTIONS · PICK ONE EACH TICK</div>
        <div class="ar-buttons${colsClass}">${actionsHtml}</div>
      </div>
    </div>`;

  // Wire enabled (non-cooldown, non-disabled) buttons to their RPCs.
  // Each MP action consumes the shared 6-tick cooldown server-side; on
  // success we reload so the cooldown / stat changes show immediately.
  host.querySelectorAll('.act-btn[data-action]').forEach(btn => {
    btn.addEventListener('click', () => handleMpAction(btn));
  });
}

  'floor-speech':       'Floor Speech',
  'hold-rally':         'Hold a Rally',
  'fundraising-dinner': 'Fundraising Dinner',
};

function fmtMpResult(data) {
  // Compose a player-facing one-sentence outcome line from the RPC's
  // return jsonb. The dice + stat get surfaced so the player can see
  // why they passed / failed.
  const label = MP_ACTION_LABEL[data.action.replace(/_/g, '-')] || data.action;
  const stake = data.total != null ? ` (rolled ${data.roll} + ${data.stat} = ${data.total})` : '';
  if (data.action === 'floor_speech') {
    return data.passed
      ? `${label}: success${stake}. Your reputation is now ${data.new_reputation}.`
      : `${label}: poorly received${stake}. ${data.party_name || 'Your party'}’s popularity dropped to ${data.new_party_popularity}%.`;
  }
  if (data.action === 'hold_rally') {
    return data.passed
      ? `${label}: success${stake}. ${data.party_name || 'Your party'}’s popularity rose to ${data.new_party_popularity}%.`
      : `${label}: flopped${stake}. Your reputation dropped to ${data.new_reputation}.`;
  }
  if (data.action === 'fundraising_dinner') {
    const money = `Raised $${Number(data.money_raised || 0).toLocaleString()} for ${data.party_name || 'your party'}`;
    if (data.stat_delta === 'influence') return `${label}: ${money} — you embarrassed yourself${stake}. Influence dropped to ${data.new_influence}.`;
    if (data.stat_delta === 'charisma')  return `${label}: ${money} — you owned the room${stake}. Charisma rose to ${data.new_charisma}.`;
    return `${label}: ${money}${stake}.`;
  }
  return `${label}: done.`;
}

const MP_ACTION_REASON = {
  not_authenticated:        'Sign in to act.',
  no_politician:            'No politician on this account.',
  wrong_office:             'Only sitting MPs can do this.',
  not_in_party:             'You need to be in a party.',
  party_not_found:          'Your party can’t be found.',
  cooldown:                 'You’ve already used your action this cycle.',
  insufficient_party_funds: 'Your party can’t cover the $10K rally cost.',
};

async function handleMpAction(btn) {
  const slug = btn.dataset.action;
  const rpc  = MP_ACTION_RPC[slug];
  if (!rpc) return;
  const prevHtml = btn.innerHTML;
  btn.classList.add('cooldown');  // visually freeze
  btn.removeAttribute('data-action');
  try {
    const { data, error } = await _supabase.rpc(rpc);
    if (error) throw error;
    if (!data?.success) {
      alert(MP_ACTION_REASON[data?.reason] || ('Action failed: ' + (data?.reason || 'unknown')));
      btn.classList.remove('cooldown');
      btn.dataset.action = slug;
      btn.innerHTML = prevHtml;
      return;
    }
    alert(fmtMpResult(data));
    location.reload();
  } catch (e) {
    alert('Failed: ' + (e?.message || e));
    btn.classList.remove('cooldown');
    btn.dataset.action = slug;
    btn.innerHTML = prevHtml;
  }
}

// ── Pressing Issues ─────────────────────────────────────────────────
// Renders the active-campaign card when politician_active_election has
// a row, otherwise the empty placeholder. Only one source of Pressing
// Issues today (the active race); when other sources land (legislative
// votes, scandals, etc.) they each render their own block into the
// same container.
function renderPressingIssues(ctx) {
  const host = document.getElementById('pressing-issues');
  if (!host) return;
  if (!activeRace) {
    host.innerHTML = '<div class="empty">No pressing issues right now.</div>';
    return;
  }
  host.innerHTML = renderCampaignCard(ctx);
  bindCampaignActions(ctx);
}

// Two-or-three-letter abbreviation derived from a party name: first
// letter of each whitespace-separated word, uppercased, capped at 3.
// Returns 'IND' for empty/null (Independent challenger).
function partyAbbrFrom(name) {
  if (!name) return 'IND';
  const letters = String(name).trim().split(/\s+/).map(w => (w[0] || '')).join('').toUpperCase();
  return letters.slice(0, 3) || 'IND';
}

function renderCampaignCard(ctx) {
  const tier = activeRace.race_tier;
  const isParl = tier === 'parliament';
  const currentTick = Number(ctx.shard?.current_tick) || 0;
  // ticks_remaining is "act windows you still have including this one".
  // resolve_due fires when current > resolve_tick (strictly past), so the
  // resolve_tick itself is the player's final act window — display
  // "FINAL TICK" instead of "0 TICKS REMAINING".
  const ticksRemaining = Math.max(0, Number(activeRace.resolve_tick) - currentTick);
  const eyebrow = isParl ? 'ACTIVE CAMPAIGN · HIGH-STAKES · NATIONAL'
                         : 'ACTIVE CAMPAIGN · LOW-STAKES · COMMUNITY';
  const titleLead = isParl ? 'Member of Parliament' : 'Community Organizer';
  const partyName = ctx.party?.faction_name || 'your party';
  const oppPartyName = activeRace.opp_party_name || 'an independent challenger';
  const baseBlurb = isParl
    ? `An Assembly seat in ${escHtml(ctx.nation?.name || 'the capital')}.`
    : 'A volunteer seat on your neighborhood association.';
  const subline = `${baseBlurb} Running as a member of <strong>${escHtml(partyName)}</strong> against ${escHtml(oppPartyName)}.`;
  const timeBlock = ticksRemaining > 0
    ? `<div class="ci-time">${ticksRemaining}</div><div class="ci-time-l">TICK${ticksRemaining === 1 ? '' : 'S'} REMAINING</div>`
    : `<div class="ci-time">!</div><div class="ci-time-l final">FINAL TICK</div>`;

  // Stat label tracks the tier — community uses Credibility, parliament Charisma.
  const statLabel = isParl ? 'CHARISMA' : 'CREDIBILITY';

  const youFirst = politician.leader_first_name || '';
  const youLast  = politician.leader_last_name  || '';
  const youInit  = ((youFirst[0] || '') + (youLast[0] || '')).toUpperCase() || '—';
  const oppFirst = activeRace.opp_first || '';
  const oppLast  = activeRace.opp_last  || '';
  const oppInit  = ((oppFirst[0] || '') + (oppLast[0] || '')).toUpperCase() || '—';
  const oppFull  = `${oppFirst} ${oppLast}`.trim() || '—';

  const pollYou = Math.max(0, Math.min(100, Number(activeRace.polling_you_pct) || 0));
  const pollOpp = Math.max(0, Math.min(100, Number(activeRace.polling_opp_pct) || 0));
  const pollUnd = Math.max(0, Math.min(100, Number(activeRace.polling_undecided_pct) || 0));

  return `
    <div class="ci-camp">
      <div class="ci-top">
        <div class="ci-top-titles">
          <div class="ci-eyebrow">&#9670; ${escHtml(eyebrow)}</div>
          <div class="ci-name">${escHtml(titleLead)} &middot; <span class="serif">${escHtml(activeRace.district || '')}</span></div>
          <div class="ci-sub">${subline}</div>
        </div>
        <div class="ci-meta">${timeBlock}</div>
      </div>

      <div class="ci-poll">
        <div class="ci-poll-lab">CURRENT POLLING</div>
        <div class="ci-poll-nums">
          <span class="ci-pn-you">YOU <span class="v">${pollYou}%</span></span>
          <span class="ci-pn-und">UNDECIDED <span class="v">${pollUnd}%</span></span>
          <span class="ci-pn-opp">${escHtml((oppLast || 'OPP').toUpperCase())} <span class="v">${pollOpp}%</span></span>
        </div>
        <div class="ci-poll-bar">
          <div class="ci-pb-you" style="width:${pollYou}%"></div>
          <div class="ci-pb-und" style="width:${pollUnd}%"></div>
          <div class="ci-pb-opp" style="width:${pollOpp}%"></div>
        </div>
      </div>

      <div class="ci-match">
        <div class="ci-side you">
          <div class="ci-portrait you">${escHtml(youInit)}</div>
          <div class="ci-who">YOU</div>
          <div class="ci-pname">${escHtml(`${youFirst} ${youLast}`.trim() || '—')}</div>
        </div>
        <span class="ci-vs">VS</span>
        <div class="ci-side opp">
          <div class="ci-portrait opp">${escHtml(oppInit)}</div>
          <div class="ci-who">${escHtml(partyAbbrFrom(activeRace.opp_party_name))}</div>
          <div class="ci-pname">${escHtml(oppFull)}</div>
        </div>
        <div class="ci-stat">
          <div class="ci-stat-lab">${escHtml(statLabel)}</div>
          <div class="ci-stat-row">
            <span class="you">${Number(activeRace.your_stat) || 0}</span>
            <span class="vs">VS</span>
            <span class="opp">${Number(activeRace.opp_stat) || 0}</span>
          </div>
        </div>
      </div>

      <div class="ci-events">
        <div class="ci-events-lab">RECENT CAMPAIGN EVENTS</div>
        <div class="ci-ev-row">
          <div class="ci-ev-icon">&#9873;</div>
          <div class="ci-ev-text">You <strong>entered the race</strong> in ${escHtml(activeRace.district || 'the district')} against ${escHtml(oppFull)}.</div>
        </div>
      </div>

      ${renderCampaignActions(ctx)}
    </div>`;
}

function renderCampaignActions(ctx) {
  const partyId = ctx.party?.id || null;
  const currentTick = Number(ctx.shard?.current_tick) || 0;
  const gateTick    = Number(politician.next_member_action_tick) || 0;
  const speechTick  = Number(politician.speech_cooldown_until_tick) || 0;
  const universalLocked = gateTick > currentTick;
  const speechLocked    = universalLocked || speechTick > currentTick;
  // No party = no actions. The Stand-for-Election flow on politician-career
  // gates by the same rule, so if there's an active race the politician
  // should still be a member; this is the defensive fallback.
  if (!partyId) {
    return `<div class="ci-actions"><div class="ci-actions-lab">YOUR NEXT MOVE</div>
      <div class="ci-act-lockmsg">Rejoin a party to take campaign actions.</div></div>`;
  }
  const knockBtn = `
    <button class="ci-act" type="button" data-camp-action="knock" ${universalLocked ? 'disabled' : ''}>
      <div class="ci-act-head"><span class="ci-act-icon" style="color:#7a9aab;">&#9994;</span><span class="ci-act-name">Door Knocking</span></div>
      <div class="ci-act-blurb">Walk a district, meet voters. Slow but reliable.</div>
      <div class="ci-act-meta"><span class="ci-act-effect">+2 polling</span><span class="ci-act-cost">1 tick</span></div>
    </button>`;
  const speechBtn = `
    <button class="ci-act" type="button" data-camp-action="speech" ${speechLocked ? 'disabled' : ''}>
      <div class="ci-act-head"><span class="ci-act-icon" style="color:#d4b87a;">&#128226;</span><span class="ci-act-name">Give a Speech</span></div>
      <div class="ci-act-blurb">Rally the faithful and reach the press. High variance.</div>
      <div class="ci-act-meta"><span class="ci-act-effect var">&minus;2 to +5 polling</span><span class="ci-act-cost">3-tick cooldown</span></div>
    </button>`;
  const lockMsg = (() => {
    if (universalLocked) return `Already campaigned this tick &mdash; next action at tick ${gateTick}.`;
    if (speechLocked)    return `Speech cooling down until tick ${speechTick}; door knocking is still available.`;
    return '';
  })();
  return `
    <div class="ci-actions">
      <div class="ci-actions-lab"><span>YOUR NEXT MOVE</span><span class="remind">1 action per tick</span></div>
      <div class="ci-act-grid">${knockBtn}${speechBtn}</div>
      ${lockMsg ? `<div class="ci-act-lockmsg">${lockMsg}</div>` : ''}
    </div>`;
}

function bindCampaignActions(ctx) {
  const partyId = ctx.party?.id || null;
  if (!partyId) return;
  document.querySelectorAll('.ci-act[data-camp-action]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (btn.disabled) return;
      btn.disabled = true;
      // Disable the sibling too so the player can't double-spend the
      // 1-per-turn gate while the first call is in flight.
      btn.parentElement?.querySelectorAll('.ci-act').forEach(b => { b.disabled = true; });
      const fn = btn.dataset.campAction === 'speech'
        ? 'politician_give_speech'
        : 'politician_door_knock';
      const { data, error } = await _supabase.rpc(fn, { p_party_id: partyId });
      if (error) {
        alert('Action failed: ' + (error.message || 'unknown error'));
        location.reload();
        return;
      }
      if (!data?.success) {
        const reason = data?.reason || 'unknown';
        const human = {
          not_authenticated: 'You are not signed in.',
          not_member:        'You are no longer a member of this party.',
          party_not_found:   'Party not found.',
          no_shard:          'Shard not found.',
          cooldown:          `Action on cooldown until tick ${data?.ready_at_tick ?? '?'}.`,
        }[reason] || `Action failed (${reason}).`;
        alert(human);
        location.reload();
        return;
      }
      location.reload();
    });
  });
}

// ── Dispatches: classify, filter, render. Mirrors entrepreneur-dashboard.html
// for politics/corporate/military buckets; nation/world are scope filters.
function formatEventName(raw) {
  if (!raw) return '';
  return String(raw).replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}
function dispatchBucketForRow(row) {
  if ((row?.trigger_key || '').toLowerCase().startsWith('military_')) return 'military';
  const c = (row?.category || '').toLowerCase();
  if (CORPORATE_CATEGORIES.includes(c)) return 'corporate';
  if (POLITICS_CATEGORIES.includes(c))  return 'politics';
  return null;
}
function eventMatchesTab(row, tab) {
  if (tab === 'world')  return true;
  if (tab === 'nation') return politician.nation_id && row.nation_id === politician.nation_id;
  return dispatchBucketForRow(row) === tab;
}
function bindDispatchTabs() {
  const bar = document.getElementById('ev-tabs');
  if (!bar) return;
  bar.addEventListener('click', (e) => {
    const btn = e.target.closest('.ev-tab');
    if (!btn || btn.classList.contains('active')) return;
    bar.querySelectorAll('.ev-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    evCurrentTab = btn.dataset.tab;
    renderDispatches();
  });
}
function renderDispatches() {
  const listEl  = document.getElementById('ev-list');
  const countEl = document.getElementById('ev-count');
  if (!listEl) return;
  const rows = allEvents.filter(r => eventMatchesTab(r, evCurrentTab)).slice(0, 30);
  if (countEl) countEl.textContent = rows.length === 0 ? 'NONE' : `${rows.length} ITEM${rows.length === 1 ? '' : 'S'}`;
  if (!rows.length) {
    listEl.innerHTML = `<li class="ev-empty">No ${escHtml(evCurrentTab)} dispatches yet.</li>`;
    return;
  }
  listEl.innerHTML = rows.map(row => {
    const cat = row.category || evCurrentTab;
    const ago = Math.max(0, evTickNow - (Number(row.fired_at_tick) || 0));
    const timeStr = ago === 0 ? 'JUST NOW' : ago === 1 ? '1 TICK AGO' : `${ago} TICKS AGO`;
    const nationName = row.nations?.name || null;
    const np = row.nations?.nation_profiles;
    const flagUrl = (Array.isArray(np) ? np[0]?.flag_url : np?.flag_url) || null;
    const nationBadge = nationName
      ? `<span class="ev-nation">${flagUrl ? `<img src="${escAttr(flagUrl)}" alt="">` : ''}${escHtml(nationName)}</span>`
      : '';
    const head = formatEventName(row.event_name) || 'Untitled dispatch';
    const body = (row.description_chosen || row.description_used || '').trim();
    return `<li class="ev-item">
      <div class="ev-meta"><span class="ev-tag">${escHtml(cat)}</span>${nationBadge}<span class="ev-time">${timeStr}</span></div>
      <div class="ev-head">${escHtml(head)}</div>
      ${body ? `<div class="ev-body">${escHtml(body)}</div>` : ''}
    </li>`;
  }).join('');
}

init();
</script>
