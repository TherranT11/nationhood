<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factions | Nationhood Alpha</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/factions.css">
</head>
<body>

<!-- Top Bar (rendered by common.js) -->
<div id="top-bar"></div>

<!-- Content Area -->
<div id="content-area">
    <div class="loading-container">
        <div class="loading-spinner"></div>
        <div>Loading factions...</div>
    </div>
</div>

<!-- Shared Scripts -->

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { initPage } from './js/common.js';
import { escapeHtml } from './js/utils.js';
/**
 * Factions & Demands Page
 * Shows voter blocs, active demands, and demand history
 */

let currentNation = null;
let currentFaction = null;
let currentTick = 0;

// Initialize page using shared initPage pattern
initPage('factions', async (state) => {
    const { nation, faction, shard } = state;
    
    currentNation = nation;
    currentFaction = faction;
    currentTick = shard?.current_tick || 0;
    
    if (!nation) {
        document.getElementById('content-area').innerHTML = `
            <div class="placeholder-panel">
                <div class="ph-icon">🏛️</div>
                <h3>No Nation Selected</h3>
                <p>Your party is not assigned to a nation yet.</p>
            </div>
        `;
        return;
    }
    
    await renderFactionsPage();
});

async function renderFactionsPage() {
    // Fetch counts for header stats
    // voter_blocs table removed — electorate engine replaces this system
    const totalBlocs = 0;
    const activeDemands = 0;
    
    const html = `
        <div class="panel-padding">
            <div class="section-header">Factions & Demands — ${currentNation.name}</div>
            
            <div class="stat-grid" style="grid-template-columns: repeat(3, 1fr); margin-bottom: 24px;">
                <div class="stat-card">
                    <div class="stat-label">Voter Blocs</div>
                    <div class="stat-value">${totalBlocs}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Active Demands</div>
                    <div class="stat-value">${activeDemands}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Your Approval</div>
                    <div class="stat-value">${currentFaction.approval_rating || 0}%</div>
                </div>
            </div>
            
            <div class="sub-tabs">
                <button class="sub-tab active" onclick="showSubTab('demands')">Active Demands</button>
                <button class="sub-tab" onclick="showSubTab('blocs')">Voter Blocs</button>
                <button class="sub-tab" onclick="showSubTab('history')">History</button>
            </div>
            
            <div class="sub-content active" id="sub-demands">
                <div id="demands-list">
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <h3>No Active Demands</h3>
                        <p>The voter blocs are quiet... for now.</p>
                    </div>
                </div>
            </div>
            
            <div class="sub-content" id="sub-blocs">
                <div id="blocs-list">
                    <div class="empty-state">
                        <div class="empty-state-icon">🏛️</div>
                        <h3>No Voter Blocs</h3>
                        <p>No organized voter blocs exist in this nation yet.</p>
                    </div>
                </div>
            </div>
            
            <div class="sub-content" id="sub-history">
                <div id="history-list">
                    <div class="empty-state">
                        <div class="empty-state-icon">📜</div>
                        <h3>No History Yet</h3>
                        <p>Past demands will appear here once they are met or expire.</p>
                    </div>
                </div>
            </div>
        </div>
    `;
    
    document.getElementById('content-area').innerHTML = html;
    
    await Promise.all([
        loadActiveDemands(),
        loadVoterBlocs(),
        loadHistory()
    ]);
}

function showSubTab(name) {
    document.querySelectorAll('.sub-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.sub-content').forEach(t => t.classList.remove('active'));
    document.querySelector(`.sub-tab[onclick="showSubTab('${name}')"]`).classList.add('active');
    document.getElementById(`sub-${name}`).classList.add('active');
}

async function loadActiveDemands() {
    const container = document.getElementById('demands-list');
    
    try {
        const { data: demands, error } = await _supabase
            .from('voter_bloc_demands')
            .select('*, voter_blocs(voter_count, ideology_1, ideology_2, ideology_3, ideology_4, ideology_5)')
            .eq('nation_id', currentNation.id)
            .eq('status', 'active')
            .order('deadline_tick', { ascending: true });
        
        if (error) throw error;
        
        if (!demands || demands.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📭</div>
                    <h3>No Active Demands</h3>
                    <p>The voter blocs are quiet... for now.</p>
                </div>
            `;
            return;
        }
        
        // Get current nation stats
        const { data: nationData } = await _supabase
            .from('nations')
            .select('*')
            .eq('id', currentNation.id)
            .single();
        
        container.innerHTML = demands.map(demand => {
            const ticksLeft = demand.deadline_tick - currentTick;
            const urgency = ticksLeft <= 2 ? 'urgent' : ticksLeft <= 4 ? 'warning' : 'normal';
            const cardClass = ticksLeft <= 2 ? 'urgent' : ticksLeft <= 4 ? 'warning' : '';
            
            const currentVal = nationData ? (nationData[demand.target_stat] || 0) : 0;
            const statDisplay = demand.target_stat.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
            
            const targetClass = demand.desired_range === 'high' ? 'target-high' :
                               demand.desired_range === 'low' ? 'target-low' : 'target-moderate';
            const targetText = demand.desired_range === 'high' ? '70-100' :
                              demand.desired_range === 'low' ? '0-30' : '31-69';
            
            const voterCount = demand.voter_blocs?.voter_count || 0;
            
            const isMovingRight = (demand.desired_range === 'high' && currentVal > demand.current_value) ||
                                  (demand.desired_range === 'low' && currentVal < demand.current_value) ||
                                  (demand.desired_range === 'moderate' && Math.abs(currentVal - 50) < Math.abs(demand.current_value - 50));
            
            return `
                <div class="demand-card ${cardClass}">
                    <div class="demand-header">
                        <div>
                            <div class="demand-bloc-name">${escapeHtml(demand.bloc_name)}</div>
                            <div class="demand-bloc-voters">${voterCount.toLocaleString()} voters in this bloc</div>
                        </div>
                        <div class="demand-deadline">
                            <div class="demand-deadline-label">Deadline</div>
                            <div class="demand-deadline-value deadline-${urgency}">
                                ${ticksLeft > 0 ? ticksLeft + ' month' + (ticksLeft !== 1 ? 's' : '') : 'OVERDUE'}
                            </div>
                        </div>
                    </div>
                    
                    <div class="demand-body">
                        "${escapeHtml(demand.demand_text)}"
                    </div>
                    
                    <div class="demand-requirement">
                        <div class="demand-stat-info">
                            <span class="demand-stat-name">${statDisplay}</span>
                            <span class="demand-stat-current" style="color:${isMovingRight ? '#5cb85c' : '#d9534f'}">
                                ${currentVal}
                            </span>
                            <span class="demand-stat-arrow">→</span>
                            <span class="demand-stat-target ${targetClass}">${targetText}</span>
                        </div>
                        <div>
                            <span class="demand-penalty">⚠ -${demand.approval_penalty}% approval on failure</span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
        
    } catch (error) {
        console.error('Error loading demands:', error);
        container.innerHTML = `<div class="empty-state"><p style="color:#d9534f;">Error loading demands</p></div>`;
    }
}

async function loadVoterBlocs() {
    const container = document.getElementById('blocs-list');

    try {
        // voter_blocs table removed — show empty state
        const blocs = [];
        const error = null;
        
        if (error) throw error;
        
        if (!blocs || blocs.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">🏛️</div>
                    <h3>No Voter Blocs</h3>
                    <p>No organized voter blocs exist in this nation yet.</p>
                </div>
            `;
            return;
        }
        
        // Get demand counts per bloc
        const { data: demandCounts } = await _supabase
            .from('voter_bloc_demands')
            .select('voter_bloc_id, status')
            .eq('nation_id', currentNation.id)
            .eq('status', 'active');
        
        const demandCountMap = {};
        (demandCounts || []).forEach(d => {
            demandCountMap[d.voter_bloc_id] = (demandCountMap[d.voter_bloc_id] || 0) + 1;
        });
        
        container.innerHTML = blocs.map(bloc => {
            const ideologies = [bloc.ideology_1, bloc.ideology_2, bloc.ideology_3, bloc.ideology_4, bloc.ideology_5].filter(Boolean);
            const activeDemands = demandCountMap[bloc.id] || 0;
            
            return `
                <div class="bloc-card">
                    <div class="bloc-card-left">
                        <div class="bloc-card-name">${escapeHtml(bloc.bloc_name)}</div>
                        ${bloc.description ? `<div class="bloc-card-desc">"${escapeHtml(bloc.description)}"</div>` : ''}
                        <div class="bloc-ideology-tags">
                            ${ideologies.map(i => `<span class="bloc-ideology-tag">${i}</span>`).join('')}
                        </div>
                    </div>
                    <div class="bloc-card-right">
                        <div class="bloc-voter-count">${(bloc.voter_count || 0).toLocaleString()}</div>
                        <div class="bloc-voter-label">Voters</div>
                        <div class="bloc-demand-count" style="color:${activeDemands > 0 ? '#ffcc00' : '#666'};">
                            ${activeDemands > 0 ? `${activeDemands} active demand${activeDemands > 1 ? 's' : ''}` : 'No active demands'}
                        </div>
                    </div>
                </div>
            `;
        }).join('');
        
    } catch (error) {
        console.error('Error loading blocs:', error);
        container.innerHTML = `<div class="empty-state"><p style="color:#d9534f;">Error loading voter blocs</p></div>`;
    }
}

async function loadHistory() {
    const container = document.getElementById('history-list');
    
    try {
        const { data: history, error } = await _supabase
            .from('voter_bloc_demands')
            .select('*')
            .eq('nation_id', currentNation.id)
            .in('status', ['met', 'failed'])
            .order('resolved_at_tick', { ascending: false })
            .limit(30);
        
        if (error) throw error;
        
        if (!history || history.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📜</div>
                    <h3>No History Yet</h3>
                    <p>Past demands will appear here once they are met or expire.</p>
                </div>
            `;
            return;
        }
        
        container.innerHTML = history.map(item => {
            const statDisplay = item.target_stat.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
            const isMet = item.status === 'met';
            
            return `
                <div class="history-row">
                    <div>
                        <span class="history-bloc">${escapeHtml(item.bloc_name)}</span>
                        <span class="history-stat"> — wanted ${statDisplay} to be ${item.desired_range}</span>
                    </div>
                    <div>
                        <span class="demand-status-badge ${isMet ? 'badge-met' : 'badge-failed'}">
                            ${isMet ? '✓ MET' : '✗ FAILED'}
                        </span>
                        <span style="color:#666; font-size:0.78rem; margin-left:10px;">
                            Tick ${item.resolved_at_tick || '?'}
                        </span>
                    </div>
                </div>
            `;
        }).join('');
        
    } catch (error) {
        console.error('Error loading history:', error);
        container.innerHTML = `<div class="empty-state"><p style="color:#d9534f;">Error loading history</p></div>`;
    }
}

// Auto-refresh every 60 seconds
setInterval(() => {
    if (currentNation) {
        Promise.all([loadActiveDemands(), loadVoterBlocs(), loadHistory()]);
    }
}, 60000);

// Expose functions for HTML onclick/onchange handlers
window.showSubTab = showSubTab;
</script>

</body>
</html>
