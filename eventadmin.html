async function loadAllEvents() {
    var r = await _supabase
        .from('event_templates')
        .select('*, event_descriptions(*), event_triggers(*), event_effects(*)')
        .order('created_at', { ascending: false });
    allEvents = (r.error ? [] : r.data) || [];
}

async function loadAllMinistryTemplates() {
    var r = await _supabase
        .from('ministry_event_templates')
        .select('*')
        .order('ministry_key', { ascending: true });
    if (r.error) {
        console.warn('ministry_event_templates table may not exist yet:', r.error.message);
        allMinistryTemplates = [];
    } else {
        allMinistryTemplates = r.data || [];
    }
}

// ==================== MODE TABS (TOP-LEVEL) ====================
function renderModeTabs() {
    var c = document.getElementById('content-area');
    c.innerHTML =
        '<div class="mode-tabs">' +
            '<button class="mode-tab ' + (currentMode === 'events' ? 'active' : '') + '" onclick="switchMode(\'events\')">⚡ Random & System Events</button>' +
            '<button class="mode-tab ' + (currentMode === 'ministry' ? 'active' : '') + '" onclick="switchMode(\'ministry\')">🏛️ Ministry Inbox Events</button>' +
        '</div>' +
        '<div id="mode-content"></div>';
    if (currentMode === 'events') renderListView();
    else renderMinistryListView();
}

function switchMode(mode) {
    currentMode = mode;
    renderModeTabs();
}

function renderListView() {
    currentEvent = null;
    document.getElementById('mode-content').innerHTML =
        '<div class="admin-header"><div>' +
            '<div class="admin-title">⚡ Event Manager</div>' +
            '<div class="admin-subtitle">Random (stat-triggered) and System (game action–triggered) events</div>' +
        '</div><div class="admin-actions">' +
            '<button class="btn btn-ghost" onclick="viewRecentLog()">📋 Event Log</button>' +
            '<button class="btn btn-primary" onclick="createNewEvent()">+ New Event</button>' +
        '</div></div>' +
        '<div class="filters">' +
            '<input type="text" id="filter-search" placeholder="Search events..." oninput="applyFilters()">' +
            '<select id="filter-type" onchange="applyFilters()"><option value="">All Types</option><option value="random">Random</option><option value="system">System</option></select>' +
            '<select id="filter-category" onchange="applyFilters()"><option value="">All Categories</option>' +
                EVENT_CATEGORIES.map(function(c) { return '<option value="' + c + '">' + c + '</option>'; }).join('') +
            '</select>' +
            '<select id="filter-status" onchange="applyFilters()"><option value="">All Status</option><option value="active">Active</option><option value="inactive">Inactive</option></select>' +
            '<span class="event-count" id="event-count">' + allEvents.length + ' events</span>' +
        '</div>' +
        '<div id="event-list"></div>';
    renderEventList(allEvents);
}

function renderEventList(events) {
    var c = document.getElementById('event-list');
    if (!events.length) {
        c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div>No events found. Create one to get started.</div>';
        return;
    }
    c.innerHTML = events.map(function(ev) {
        var et = ev.event_type || 'random';
        var scopes = {};
        (ev.event_effects || []).forEach(function(e) { scopes[e.target] = 1; });
        var scopeTags = Object.keys(scopes).map(function(s) {
            if (s === 'ruling_party') return '<span class="tag tag-scope-ruling">Ruling</span>';
            if (s === 'random_faction') return '<span class="tag tag-scope-faction">Faction</span>';
            return '<span class="tag tag-scope-nation">Nation</span>';
        }).join(' ');
        var typeTag = et === 'system' ? '<span class="tag tag-system">System</span>' : '<span class="tag tag-random">Random</span>';
        var triggerInfo = '';
        if (et === 'system' && ev.system_trigger) {
            var st = SYSTEM_TRIGGERS.find(function(t) { return t.key === ev.system_trigger; });
            triggerInfo = '<span style="color:#ff9800;">→ ' + (st ? st.label : ev.system_trigger) + '</span>';
        } else {
            triggerInfo = '<span class="tag tag-prob">' + ev.probability + '%</span><span class="tag tag-cooldown">' + ev.cooldown_ticks + 't cd</span>';
        }
        var counts = (ev.event_descriptions || []).length + ' desc' + (et === 'random' ? ' · ' + (ev.event_triggers || []).length + ' trig · ' + (ev.event_effects || []).length + ' fx' : '');
        return '<div class="event-card ' + (ev.is_active ? 'active' : 'inactive') + '" onclick="editEvent(\'' + ev.id + '\')">' +
            '<div class="event-card-left"><div class="event-card-name">' + escapeHtml(ev.name) + '</div>' +
            '<div class="event-card-meta">' + typeTag + '<span class="tag tag-category">' + (ev.category || 'General') + '</span>' + triggerInfo + scopeTags + '<span style="color:#666;">' + counts + '</span></div></div>' +
            '<div class="event-card-right"><span class="tag ' + (ev.is_active ? 'tag-active' : 'tag-inactive') + '">' + (ev.is_active ? 'ACTIVE' : 'INACTIVE') + '</span></div></div>';
    }).join('');
}

function applyFilters() {
    var search = (document.getElementById('filter-search').value || '').toLowerCase();
    var type = document.getElementById('filter-type').value;
    var cat = document.getElementById('filter-category').value;
    var status = document.getElementById('filter-status').value;
    var filtered = allEvents.filter(function(ev) {
        if (search && ev.name.toLowerCase().indexOf(search) === -1) return false;
        if (type && (ev.event_type || 'random') !== type) return false;
        if (cat && ev.category !== cat) return false;
        if (status === 'active' && !ev.is_active) return false;
        if (status === 'inactive' && ev.is_active) return false;
        return true;
    });
    document.getElementById('event-count').textContent = filtered.length + ' events';
    renderEventList(filtered);
}

function createNewEvent() {
    isNewEvent = true;
    currentEvent = { name: '', category: 'General', probability: 50, cooldown_ticks: 6, is_active: true, event_type: 'random', system_trigger: '' };
    editorDescriptions = []; editorTriggers = []; editorEffects = [];
    deletedDescIds = []; deletedTriggerIds = []; deletedEffectIds = [];
    renderEditor();
}

function editEvent(id) {
    var ev = allEvents.find(function(e) { return e.id === id; });
    if (!ev) return;
    isNewEvent = false;
    currentEvent = Object.assign({}, ev);
    if (!currentEvent.event_type) currentEvent.event_type = 'random';
    editorDescriptions = (ev.event_descriptions || []).map(function(d) { return Object.assign({}, d, { isNew: false }); });
    editorTriggers = (ev.event_triggers || []).map(function(t) { return Object.assign({}, t, { isNew: false }); });
    editorEffects = (ev.event_effects || []).map(function(e) { return Object.assign({}, e, { isNew: false }); });
    deletedDescIds = []; deletedTriggerIds = []; deletedEffectIds = [];
    renderEditor();
}

            '</div>' +
            '<div class="editor-body">' +
                '<div class="type-tabs">' +
                    '<button class="type-tab ' + (!isSys ? 'active' : '') + '" onclick="switchEventType(\'random\')">🎲 Random Event</button>' +

                '</div>' +

                '</select></div></div>' +
                '<div id="random-fields" style="' + (isSys ? 'display:none;' : '') + '">' +
                    '<div class="form-row-3"><div class="form-group"><label class="form-label">Probability (%)</label><input type="number" class="form-input" id="ev-probability" value="' + (currentEvent.probability || 50) + '" min="1" max="100"><div class="form-hint">Chance per tick when triggers met</div></div>' +
                    '<div class="form-group"><label class="form-label">Cooldown (ticks)</label><input type="number" class="form-input" id="ev-cooldown" value="' + (currentEvent.cooldown_ticks || 6) + '" min="0"><div class="form-hint">Min ticks between firings</div></div>' +
                    '<div class="form-group"><label class="form-label">Status</label><div class="toggle-wrapper" style="margin-top:8px;"><label class="toggle"><input type="checkbox" id="ev-active" ' + (currentEvent.is_active ? 'checked' : '') + '><span class="toggle-slider"></span></label><span class="toggle-label" id="ev-active-label">' + (currentEvent.is_active ? 'Active' : 'Inactive') + '</span></div></div></div>' +
                '</div>' +
                '<div id="system-fields" style="' + (!isSys ? 'display:none;' : '') + '">' +
                    '<div class="system-trigger-info"><strong>System events</strong> fire automatically when a game action occurs. No stat triggers or probability roll — the game code fires them directly. Add multiple descriptions (one randomly picked). Use the placeholder tags below in your descriptions.</div>' +

function syncForm() {

function getSTDesc(key) { if (!key) return 'Select a trigger to see its description.'; var t = SYSTEM_TRIGGERS.find(function(s) { return s.key === key; }); return t ? t.desc : ''; }

function renderPlaceholders(key) {
    if (!key) return '';
    var t = SYSTEM_TRIGGERS.find(function(s) { return s.key === key; });
    if (!t || !t.placeholders) return '';
    return '<div style="margin-top:10px;"><div class="form-hint" style="margin-bottom:6px;">Available placeholders — click to copy:</div><div class="placeholder-tags">' +
        t.placeholders.map(function(p) { return '<span class="placeholder-tag" onclick="copyPlaceholder(\'' + p + '\')" title="Click to copy">' + p + '</span>'; }).join('') + '</div></div>';
}

function renderPreview(key) {
    if (!key) return '';
    var t = SYSTEM_TRIGGERS.find(function(s) { return s.key === key; });
    if (!t || !t.example) return '';
    var filled = t.example;
    if (t.exampleData) Object.keys(t.exampleData).forEach(function(tag) { filled = filled.split(tag).join('<strong style="color:#ffcc00;">' + t.exampleData[tag] + '</strong>'); });
    return '<div class="preview-box"><div class="preview-label">✨ Example Output</div><div class="preview-text">' + filled + '</div></div>';
}

function copyPlaceholder(text) { navigator.clipboard.writeText(text).catch(function() {}); }

async function saveEvent() {
    syncForm();
    var name = currentEvent.name.trim();
    var isSys = currentEvent.event_type === 'system';
    if (!name) { alert('Event name is required.'); return; }
    var validDescs = editorDescriptions.filter(function(d) { return d.description_text.trim(); });
    if (!validDescs.length) { alert('Add at least one description.'); return; }
    if (!isSys && !editorTriggers.filter(function(t) { return t.stat_key; }).length) { alert('Random events need at least one trigger.'); return; }
    if (isSys && !currentEvent.system_trigger) { alert('System events need a trigger selected.'); return; }
    try {
        var eventId;
        var payload = { name: name, category: currentEvent.category, probability: isSys ? 100 : (currentEvent.probability || 50), cooldown_ticks: isSys ? 0 : (currentEvent.cooldown_ticks || 6), is_active: currentEvent.is_active, event_type: currentEvent.event_type, system_trigger: isSys ? currentEvent.system_trigger : null };
        if (isNewEvent) { var r = await _supabase.from('event_templates').insert(payload).select().single(); if (r.error) throw r.error; eventId = r.data.id; }
        else { eventId = currentEvent.id; var r2 = await _supabase.from('event_templates').update(payload).eq('id', eventId); if (r2.error) throw r2.error; }
        if (deletedDescIds.length) await _supabase.from('event_descriptions').delete().in('id', deletedDescIds);
        if (deletedTriggerIds.length) await _supabase.from('event_triggers').delete().in('id', deletedTriggerIds);
        if (deletedEffectIds.length) await _supabase.from('event_effects').delete().in('id', deletedEffectIds);
        for (var d of validDescs) { if (d.isNew || !d.id) await _supabase.from('event_descriptions').insert({ event_id: eventId, description_text: d.description_text.trim() }); else await _supabase.from('event_descriptions').update({ description_text: d.description_text.trim() }).eq('id', d.id); }
        if (!isSys) { for (var t of editorTriggers.filter(function(t) { return t.stat_key; })) { var tp = { event_id: eventId, stat_key: t.stat_key, min_value: t.min_value, max_value: t.max_value }; if (t.isNew || !t.id) await _supabase.from('event_triggers').insert(tp); else await _supabase.from('event_triggers').update(tp).eq('id', t.id); } }
        for (var e of editorEffects.filter(function(e) { return e.stat_key; })) { var ep = { event_id: eventId, stat_key: e.stat_key, change_value: e.change_value || 0, target: e.target || 'nation' }; if (e.isNew || !e.id) await _supabase.from('event_effects').insert(ep); else await _supabase.from('event_effects').update(ep).eq('id', e.id); }
        alert(isNewEvent ? 'Event created!' : 'Event saved!');
        await loadAllEvents(); renderModeTabs();
    } catch (err) { console.error('Save error:', err); alert('Error: ' + err.message); }
}

async function deleteEvent(id) {
    if (!confirm('Delete this event and all its data? This cannot be undone.')) return;
    try { var r = await _supabase.from('event_templates').delete().eq('id', id); if (r.error) throw r.error; alert('Event deleted.'); await loadAllEvents(); renderModeTabs(); }
    catch (err) { console.error('Delete error:', err); alert('Error: ' + err.message); }
}

async function viewRecentLog() {
    document.getElementById('mode-content').innerHTML =
        '<button class="btn-back" onclick="renderModeTabs()">← Back to Events</button>' +
        '<div class="admin-header" style="border-bottom-color:#2196F3;"><div><div class="admin-title" style="color:#2196F3;">📋 Recent Event Log</div><div class="admin-subtitle">Last 50 events across all nations</div></div></div>' +
        '<div id="log-entries"><div style="text-align:center;padding:40px;color:#888;">Loading...</div></div>';
    var r = await _supabase.from('event_log').select('*, nations(name)').order('fired_at_tick', { ascending: false }).limit(50);
    if (r.error) { document.getElementById('log-entries').innerHTML = '<div class="empty-state">Error: ' + r.error.message + '</div>'; return; }
    if (!r.data || !r.data.length) { document.getElementById('log-entries').innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div>No events fired yet.</div>'; return; }
    document.getElementById('log-entries').innerHTML = r.data.map(function(log) {
        var fx = (log.effects_applied || []).map(function(e) { return e.stat + ': ' + (e.change > 0 ? '+' : '') + e.change + ' (' + e.target + ')'; }).join(' · ');
        return '<div class="log-entry"><div class="log-entry-header"><div class="log-entry-name">' + escapeHtml(log.event_name) + ' <span class="tag tag-category" style="margin-left:8px;">' + (log.category || '') + '</span></div><div class="log-entry-tick">' + (log.nations ? log.nations.name : '?') + ' · Tick ' + log.fired_at_tick + '</div></div><div class="log-entry-desc">' + escapeHtml(log.description_used || '') + '</div>' + (fx ? '<div class="log-entry-effects">Effects: ' + fx + '</div>' : '') + '</div>';
    }).join('');
}

// State for ministry editor
var mEditorVariants = { titles: [''] };
var mEditorWeightConditions = [];

function getDefaultMinistryVariant() {
    return { bodies: [''], options: [{ label: '', ap: 2, money: 0, money_scaling_stat: '', outcomes: [{ chance: 100, label: 'Result', effects: [] }] }] };
}

function canonicalGovType(govType) {
    if (!govType) return null;
    for (var i = 0; i < CANONICAL_GOV_TYPES.length; i++) {
        if (CANONICAL_GOV_TYPES[i].toLowerCase() === String(govType).toLowerCase()) return CANONICAL_GOV_TYPES[i];
    }
    return null;
}

function normalizeGovTypeList(list) {
    var deduped = [];
    (list || []).forEach(function(g) {
        var canonical = canonicalGovType(g);
        if (canonical && deduped.indexOf(canonical) === -1) deduped.push(canonical);
    });
    return deduped;
}

function getSelectedGovTypesFromForm() {
    var selected = [];
    document.querySelectorAll('.me-gov-checkbox:checked').forEach(function(el) {
        selected.push(el.getAttribute('data-gov-type'));
    });
    return selected;
}

function setGovTypeError(msg) {

}

function renderMinistryListView() {
    document.getElementById('mode-content').innerHTML =

function renderMinistryEventList(events) {
    var c = document.getElementById('m-event-list');
    if (!events.length) {
        c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div>No ministry events yet. Create one to get started.</div>';
        return;
    }
    c.innerHTML = events.map(function(ev) {
        var ministry = MINISTRIES.find(function(m) { return m.key === ev.ministry_key; });
        var priority = PRIORITIES.find(function(p) { return p.key === ev.priority; });
        var govTypes = (ev.gov_types || []).join(', ');
        var optCount = 0;
        if (ev.variants) {
            CANONICAL_GOV_TYPES.forEach(function(govType) {
                if (ev.variants[govType]) optCount += (ev.variants[govType].options || []).length;
            });
        }
        var weightConditions = (ev.variants && ev.variants.weight_conditions) || [];
        if (!weightConditions.length && ev.weight_stat) {
            weightConditions = [{ stat: ev.weight_stat, op: ev.weight_operator || '>', value: ev.weight_value }];
        }
        var weightInfo = weightConditions.length > 0
            ? '<span style="color:#888;">⚖ ' + weightConditions.map(function(c) { return c.stat + ' ' + c.op + ' ' + c.value; }).join(' & ') + '</span>'
            : '';

        return '<div class="event-card ' + (ev.is_active ? 'active' : 'inactive') + '" onclick="editMinistryEvent(\'' + ev.id + '\')">' +
            '<div class="event-card-left"><div class="event-card-name">' + escapeHtml(ev.title) + '</div>' +
            '<div class="event-card-meta">' +
                '<span class="tag tag-ministry">' + (ministry ? ministry.icon + ' ' + ministry.key : ev.ministry_key) + '</span>' +
                '<span class="tag tag-' + ev.priority + '">' + (priority ? priority.label : ev.priority) + '</span>' +
                '<span class="tag tag-cooldown">' + ev.deadline_ticks + 't deadline</span>' +
                '<span class="tag tag-cooldown">' + ev.cooldown_ticks + 't cd</span>' +
                '<span style="color:#666;">' + govTypes + ' · ' + optCount + ' options</span>' +
                weightInfo +
            '</div></div>' +
            '<div class="event-card-right"><span class="tag ' + (ev.is_active ? 'tag-active' : 'tag-inactive') + '">' + (ev.is_active ? 'ACTIVE' : 'INACTIVE') + '</span></div></div>';
    }).join('');
}

function applyMinistryFilters() {
    var search = (document.getElementById('m-filter-search').value || '').toLowerCase();
    var ministry = document.getElementById('m-filter-ministry').value;
    var priority = document.getElementById('m-filter-priority').value;
    var filtered = allMinistryTemplates.filter(function(ev) {
        if (search && ev.title.toLowerCase().indexOf(search) === -1 && ev.event_key.toLowerCase().indexOf(search) === -1) return false;
        if (ministry && ev.ministry_key !== ministry) return false;
        if (priority && ev.priority !== priority) return false;
        return true;
    });
    document.getElementById('m-event-count').textContent = filtered.length + ' events';
    renderMinistryEventList(filtered);
}

function createNewMinistryEvent() {
    isNewMinistry = true;
    var defaultVariants = { titles: [''] };
    CANONICAL_GOV_TYPES.forEach(function(govType) {
        defaultVariants[govType] = getDefaultMinistryVariant();
    });
    currentMinistryTemplate = {
        event_key: '', ministry_key: 'justice', title: '', sender: '',
        priority: 'routine', deadline_ticks: 3, cooldown_ticks: 6,
        gov_types: CANONICAL_GOV_TYPES.slice(), is_active: true,
        weight_stat: '', weight_operator: '>', weight_value: null,
        variants: defaultVariants
    };
    mEditorVariants = JSON.parse(JSON.stringify(defaultVariants));
    mEditorWeightConditions = [];
    renderMinistryEditor();
}

function editMinistryEvent(id) {
    var ev = allMinistryTemplates.find(function(e) { return e.id === id; });
    if (!ev) return;
    isNewMinistry = false;
    currentMinistryTemplate = JSON.parse(JSON.stringify(ev));
    var v = ev.variants || {};
    var normalizedGovTypes = normalizeGovTypeList(ev.gov_types || []);
    if (!normalizedGovTypes.length) normalizedGovTypes = CANONICAL_GOV_TYPES.slice();
    currentMinistryTemplate.gov_types = normalizedGovTypes;

    // Migrate old format: single body → bodies array, single title → titles array, non-canonical keys → canonical keys
    mEditorVariants = { titles: v.titles || (ev.title ? [ev.title] : ['']) };
    CANONICAL_GOV_TYPES.forEach(function(govType) {
        var direct = v[govType];
        var legacyKey = Object.keys(v).find(function(k) { return canonicalGovType(k) === govType; });
        var sourceVariant = direct || (legacyKey ? v[legacyKey] : null);
        mEditorVariants[govType] = sourceVariant ? {
            bodies: sourceVariant.bodies || (sourceVariant.body ? [sourceVariant.body] : ['']),
            options: sourceVariant.options || []
        } : { bodies: [''], options: [] };
    });

    // Load weight conditions from variants (new format) or migrate from old flat columns
    var wc = v.weight_conditions;
    if (wc && wc.length > 0) {
        mEditorWeightConditions = wc.map(function(c) { return { stat: c.stat, op: c.op, value: c.value }; });
    } else if (ev.weight_stat) {
        mEditorWeightConditions = [{ stat: ev.weight_stat, op: ev.weight_operator || '>', value: ev.weight_value }];
    } else {
        mEditorWeightConditions = [];
    }
    renderMinistryEditor();
}

function renderVariantSection(govType) {
    var variant = mEditorVariants[govType] || { bodies: [''], options: [] };
    var cssClass = govType.toLowerCase();
    var icon = (GOV_TYPE_META[govType] || {}).icon || '🏛️';
    var optionsHTML = (variant.options || []).map(function(opt, oi) {
        var letter = String.fromCharCode(65 + oi);

        // Migrate old format: flat effects → single outcome at 100%
        if (!opt.outcomes && opt.effects) {
            opt.outcomes = [{ chance: 100, label: 'Result', effects: opt.effects }];
            delete opt.effects;
            mEditorVariants[govType].options[oi] = opt;
        }
        if (!opt.outcomes) opt.outcomes = [{ chance: 100, label: 'Result', effects: [] }];

        // Calculate chance sum for validation
        var chanceSum = opt.outcomes.reduce(function(s, o) { return s + (o.chance || 0); }, 0);
        var chanceSumClass = chanceSum === 100 ? 'valid' : 'invalid';
        var chanceSumLabel = chanceSum === 100 ? '✓ 100%' : '⚠ ' + chanceSum + '%';

        // Render each outcome
        var outcomesHTML = opt.outcomes.map(function(outcome, ri) {
            var effectsHTML = (outcome.effects || []).map(function(eff, ei) {
                return '<div class="ministry-effect-row">' +
                    '<select class="form-select" onchange="updateOutcomeEffect(\'' + govType + '\',' + oi + ',' + ri + ',' + ei + ',\'stat_key\',this.value)"><option value="">-- Stat --</option>' +
                        NATION_STATS.concat(FACTION_STATS).concat([{key:'minister_approval',label:'Minister Approval'}]).map(function(s) { return '<option value="' + s.key + '"' + (eff.stat_key === s.key ? ' selected' : '') + '>' + s.label + '</option>'; }).join('') +
                    '</select>' +
                    '<input type="number" class="form-input" value="' + (eff.change != null ? eff.change : '') + '" placeholder="+/-" step="1" onchange="updateOutcomeEffect(\'' + govType + '\',' + oi + ',' + ri + ',' + ei + ',\'change\',Number(this.value))">' +
                    '<select class="form-select" onchange="updateOutcomeEffect(\'' + govType + '\',' + oi + ',' + ri + ',' + ei + ',\'target\',this.value)"><option value="nation"' + ((eff.target || 'nation') === 'nation' ? ' selected' : '') + '>Nation</option><option value="faction"' + (eff.target === 'faction' ? ' selected' : '') + '>Controlling Faction</option><option value="minister"' + (eff.target === 'minister' ? ' selected' : '') + '>Minister</option></select>' +
                    '<button class="btn-icon" onclick="removeOutcomeEffect(\'' + govType + '\',' + oi + ',' + ri + ',' + ei + ')">✕</button>' +
                '</div>';
            }).join('');

            return '<div class="outcome-card">' +
                '<div class="outcome-header">' +
                    '<div class="outcome-chance">' +
                        '<input type="number" class="form-input" value="' + (outcome.chance || 0) + '" min="0" max="100" onchange="updateOutcome(\'' + govType + '\',' + oi + ',' + ri + ',\'chance\',Number(this.value))">' +
                        '<span class="outcome-chance-pct">%</span>' +
                    '</div>' +
                    '<input type="text" class="form-input outcome-label-input" value="' + escapeAttr(outcome.label || '') + '" placeholder="Outcome label (e.g., Order Restored)" onchange="updateOutcome(\'' + govType + '\',' + oi + ',' + ri + ',\'label\',this.value)">' +
                    (opt.outcomes.length > 1 ? '<button class="btn-icon" onclick="removeOutcome(\'' + govType + '\',' + oi + ',' + ri + ')">✕</button>' : '') +
                '</div>' +
                '<textarea class="outcome-message-area" placeholder="Outcome message — describe what happens (supports placeholders)..." onchange="updateOutcome(\'' + govType + '\',' + oi + ',' + ri + ',\'message\',this.value)">' + escapeHtml(outcome.message || '') + '</textarea>' +
                effectsHTML +
                '<button class="btn btn-ghost btn-small" onclick="addOutcomeEffect(\'' + govType + '\',' + oi + ',' + ri + ')" style="margin-top:4px;">+ Add Effect</button>' +
                // Civic Event Field — optional public news story generated from this outcome
                '<div class="civic-event-box">' +
                    '<label class="civic-event-toggle">' +
                        '<input type="checkbox" ' + (outcome.civic_event_text ? 'checked' : '') + ' onchange="toggleCivicEvent(\'' + govType + '\',' + oi + ',' + ri + ',this.checked)">' +
                        '📰 Generate CIVIC News Event' +
                    '</label>' +
                    (outcome.civic_event_text || outcome.civic_event_text === '' ? (
                        '<div class="civic-event-fields">' +
                            '<label class="form-label">Category</label>' +
                            '<select class="form-select" style="background:#0e1117;border-color:#3a3a5c;color:#e2e6eb;" onchange="updateOutcome(\'' + govType + '\',' + oi + ',' + ri + ',\'civic_event_category\',this.value)">' +
                                EVENT_CATEGORIES.map(function(c) { return '<option value="' + c + '"' + ((outcome.civic_event_category || 'General') === c ? ' selected' : '') + '>' + c + '</option>'; }).join('') +
                            '</select>' +
                            '<label class="form-label">News Headline / Event Name</label>' +
                            '<input type="text" class="form-input" style="background:#0e1117;border-color:#3a3a5c;color:#e2e6eb;" value="' + escapeAttr(outcome.civic_event_name || '') + '" placeholder="e.g., Prison Break Quelled in {nation}" onchange="updateOutcome(\'' + govType + '\',' + oi + ',' + ri + ',\'civic_event_name\',this.value)">' +
                            '<label class="form-label">News Story (appears in CIVIC feed — supports placeholders)</label>' +
                            '<textarea class="civic-event-textarea" placeholder="e.g., A prison break was successfully put down in {nation} when the Minister of Justice {minister} ordered soldiers to..." onchange="updateOutcome(\'' + govType + '\',' + oi + ',' + ri + ',\'civic_event_text\',this.value)">' + escapeHtml(outcome.civic_event_text || '') + '</textarea>' +
                        '</div>'
                    ) : '') +
                '</div>' +
            '</div>';
        }).join('');

        return '<div class="ministry-option-card">' +
            '<div class="ministry-option-header">' +
                '<div class="ministry-option-label"><span class="ministry-option-letter">' + letter + '</span> ' +
                    '<input type="text" class="form-input" style="display:inline;width:300px;margin-left:8px;" value="' + escapeAttr(opt.label) + '" placeholder="Option label..." onchange="updateMOpt(\'' + govType + '\',' + oi + ',\'label\',this.value)">' +
                '</div>' +
                '<button class="btn-icon" onclick="removeMOption(\'' + govType + '\',' + oi + ')">✕</button>' +
            '</div>' +
            '<div class="form-row-3" style="margin-bottom:8px;">' +
                '<div class="form-group" style="margin-bottom:0;"><label class="form-label">AP Cost</label><input type="number" class="form-input" value="' + (opt.ap || 0) + '" min="0" onchange="updateMOpt(\'' + govType + '\',' + oi + ',\'ap\',Number(this.value))"></div>' +
                '<div class="form-group" style="margin-bottom:0;"><label class="form-label">Money ($M base)</label><input type="number" class="form-input" value="' + (opt.money || 0) + '" min="0" onchange="updateMOpt(\'' + govType + '\',' + oi + ',\'money\',Number(this.value))"></div>' +
                '<div class="form-group" style="margin-bottom:0;"><label class="form-label">Money Scaling Stat</label><select class="form-select" onchange="updateMOpt(\'' + govType + '\',' + oi + ',\'money_scaling_stat\',this.value)"><option value="">None (flat cost)</option>' +
                    NATION_STATS.map(function(s) { return '<option value="' + s.key + '"' + (opt.money_scaling_stat === s.key ? ' selected' : '') + '>' + s.label + '</option>'; }).join('') +
                '</select></div>' +
            '</div>' +
            '<div style="display:flex;align-items:center;margin-bottom:8px;">' +
                '<label class="form-label" style="margin-bottom:0;">Possible Outcomes</label>' +
                '<span class="chance-sum ' + chanceSumClass + '">' + chanceSumLabel + '</span>' +
                '<button class="btn btn-ghost btn-small" onclick="addOutcome(\'' + govType + '\',' + oi + ')" style="margin-left:auto;">+ Add Outcome</button>' +
            '</div>' +
            outcomesHTML +
        '</div>';
    }).join('');

    return '<div class="variant-section ' + cssClass + '">' +
        '<div class="variant-header ' + cssClass + '">' + icon + ' ' + govType + ' Variant</div>' +
        '<div class="editor-section" style="border:none;padding:0;margin-bottom:12px;background:none;"><div class="editor-section-header"><div class="editor-section-title" style="font-size:0.78rem;">📄 Email Body Variants</div><button class="btn btn-ghost btn-small" onclick="addMBody(\'' + govType + '\')">+ Add Variant</button></div>' +
        '<div class="form-hint" style="margin-bottom:8px;">Multiple body texts — one randomly chosen. Keeps repeat events feeling fresh.</div>' +
        '<div id="me-bodies-' + govType + '">' + renderMBodies(govType) + '</div></div>' +
        '<label class="form-label">Response Options</label>' +
        '<div id="me-options-' + govType + '">' + optionsHTML + '</div>' +
        '<button class="btn btn-ghost btn-small" onclick="addMOption(\'' + govType + '\')" style="margin-top:8px;">+ Add Option</button>' +
    '</div>';
}

// Ministry variant helpers
function updateMOpt(govType, oi, field, value) { mEditorVariants[govType].options[oi][field] = value; }

// Civic event toggle — enables/disables the civic news fields on an outcome
function toggleCivicEvent(govType, oi, ri, checked) {
    var outcome = mEditorVariants[govType].options[oi].outcomes[ri];
    if (checked) {
        outcome.civic_event_text = outcome.civic_event_text || '';
        outcome.civic_event_name = outcome.civic_event_name || '';
        outcome.civic_event_category = outcome.civic_event_category || 'General';
    } else {
        delete outcome.civic_event_text;
        delete outcome.civic_event_name;
        delete outcome.civic_event_category;
    }
    syncMinistryBody();
    renderMinistryEditor();
}

// Outcome helpers
function updateOutcome(govType, oi, ri, field, value) {
    mEditorVariants[govType].options[oi].outcomes[ri][field] = value;
    // Update the chance sum display live
    if (field === 'chance') {
        var sum = mEditorVariants[govType].options[oi].outcomes.reduce(function(s, o) { return s + (o.chance || 0); }, 0);
        // Re-render just to update the sum badge — a bit heavy but reliable
        syncMinistryBody();
        renderMinistryEditor();
    }
}

function updateOutcomeEffect(govType, oi, ri, ei, field, value) {
    mEditorVariants[govType].options[oi].outcomes[ri].effects[ei][field] = value;
}

function addOutcome(govType, oi) {
    var outcomes = mEditorVariants[govType].options[oi].outcomes;
    var remaining = 100 - outcomes.reduce(function(s, o) { return s + (o.chance || 0); }, 0);
    outcomes.push({ chance: Math.max(0, remaining), label: '', effects: [] });
    syncMinistryBody();
    renderMinistryEditor();
}

function removeOutcome(govType, oi, ri) {
    mEditorVariants[govType].options[oi].outcomes.splice(ri, 1);
    syncMinistryBody();
    renderMinistryEditor();
}

function addOutcomeEffect(govType, oi, ri) {
    mEditorVariants[govType].options[oi].outcomes[ri].effects.push({ stat_key: '', change: 0, target: 'nation' });
    syncMinistryBody();
    renderMinistryEditor();
}

function removeOutcomeEffect(govType, oi, ri, ei) {
    mEditorVariants[govType].options[oi].outcomes[ri].effects.splice(ei, 1);
    syncMinistryBody();
    renderMinistryEditor();
}

function addMOption(govType) {

function removeMOption(govType, oi) {

async function saveMinistryEvent() {
    syncMinistryBody();
    var tmpl = currentMinistryTemplate;

    // Read form fields
    var eventKey = (document.getElementById('me-key').value || '').trim();
    syncMinistryBody();
    var validTitles = (mEditorVariants.titles || []).filter(function(t) { return t.trim(); });
    var titleVal = validTitles.length > 0 ? validTitles[0] : '';
    var ministry = document.getElementById('me-ministry').value;
    var sender = (document.getElementById('me-sender').value || '').trim();
    var priority = document.getElementById('me-priority').value;
    var deadline = parseInt(document.getElementById('me-deadline').value) || 3;
    var cooldown = parseInt(document.getElementById('me-cooldown').value) || 6;
    var isActive = document.getElementById('me-active').checked;
    var selectedGovTypes = getSelectedGovTypesFromForm();
    // Collect weight conditions from editor state
    var validConditions = mEditorWeightConditions.filter(function(c) { return c.stat; });
    // Backward compat: write first condition to old flat columns
    var weightStat = validConditions.length > 0 ? validConditions[0].stat : null;
    var weightOp = validConditions.length > 0 ? validConditions[0].op : '>';
    var weightVal = validConditions.length > 0 ? validConditions[0].value : null;

    if (!eventKey) { alert('Event key is required.'); return; }
    if (!titleVal) { alert('At least one subject line is required.'); return; }
    if (!sender) { alert('Sender is required.'); return; }

    if (!selectedGovTypes.length) {
        setGovTypeError('Select at least one government type.');
        alert('Select at least one government type.');
        return;
    }

    for (var sgi = 0; sgi < selectedGovTypes.length; sgi++) {
        var maybeGovType = selectedGovTypes[sgi];
        if (CANONICAL_GOV_TYPES.indexOf(maybeGovType) === -1) {
            var invalidMsg = 'Government type "' + maybeGovType + '" is not recognized. Valid types: [' + CANONICAL_GOV_TYPES.join(', ') + '].';
            setGovTypeError(invalidMsg);
            alert(invalidMsg);
            return;
        }
    }
    setGovTypeError('');

    // Validate outcome chances sum to 100 for each option
    for (var gi = 0; gi < selectedGovTypes.length; gi++) {
        var gType = selectedGovTypes[gi];
        var opts = (mEditorVariants[gType] || {}).options || [];
        for (var oii = 0; oii < opts.length; oii++) {
            var outcomes = opts[oii].outcomes || [];
            if (outcomes.length > 0) {
                var sum = outcomes.reduce(function(s, o) { return s + (o.chance || 0); }, 0);
                if (sum !== 100) {
                    var letter = String.fromCharCode(65 + oii);
                    alert(gType + ' Option ' + letter + ': Outcome chances sum to ' + sum + '%, must equal 100%.');
                    return;
                }
            }
        }
    }

    var govTypes = selectedGovTypes.slice();

    // Clean variants — only include enabled canonical gov types, store title variants + weight conditions
    var cleanVariants = { titles: validTitles };
    govTypes.forEach(function(govType) {
        cleanVariants[govType] = mEditorVariants[govType] || { bodies: [''], options: [] };
    });
    if (validConditions.length > 0) cleanVariants.weight_conditions = validConditions;

    var payload = {
        event_key: eventKey, ministry_key: ministry, title: titleVal, sender: sender,
        priority: priority, deadline_ticks: deadline, cooldown_ticks: cooldown,
        gov_types: govTypes, is_active: isActive,
        weight_stat: weightStat, weight_operator: weightOp, weight_value: weightVal,
        variants: cleanVariants
    };

    try {
        if (isNewMinistry) {
            var r = await _supabase.from('ministry_event_templates').insert(payload).select().single();
            if (r.error) throw r.error;
        } else {
            var r2 = await _supabase.from('ministry_event_templates').update(payload).eq('id', tmpl.id);
            if (r2.error) throw r2.error;
        }
        alert(isNewMinistry ? 'Ministry event created!' : 'Ministry event saved!');
        await loadAllMinistryTemplates();
        renderModeTabs();
    } catch (err) {
        console.error('Save error:', err);
        alert('Error: ' + err.message);
    }
}

async function deleteMinistryEvent(id) {
    if (!confirm('Delete this ministry event and all fired instances? This cannot be undone.')) return;
    try {
        // Cascade: delete child rows in ministry_events that reference this template
        await _supabase.from('ministry_events').delete().eq('template_id', id);
        var r = await _supabase.from('ministry_event_templates').delete().eq('id', id);
        if (r.error) throw r.error;
        alert('Ministry event deleted.');
        await loadAllMinistryTemplates();
        renderModeTabs();
    } catch (err) { console.error('Delete error:', err); alert('Error: ' + err.message); }
}
