<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Event Admin | Nationhood Alpha</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        body { background: #0d0d0d; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; }

        .admin-container { max-width: 1400px; margin: 0 auto; padding: 24px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 2px solid #ffcc00; padding-bottom: 16px; }
        .admin-title { font-size: 1.6rem; color: #ffcc00; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        .admin-subtitle { font-size: 0.85rem; color: #888; margin-top: 4px; }
        .admin-actions { display: flex; gap: 10px; }

        .btn { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn:hover { transform: translateY(-1px); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .btn-primary { background: linear-gradient(135deg, #ffcc00, #e6b800); color: #121212; }
        .btn-primary:hover { box-shadow: 0 4px 12px rgba(255, 204, 0, 0.3); }
        .btn-danger { background: #ff4444; color: #fff; }
        .btn-danger:hover { box-shadow: 0 4px 12px rgba(255, 68, 68, 0.3); }
        .btn-ghost { background: #252525; color: #aaa; border: 1px solid #444; }
        .btn-ghost:hover { color: #fff; border-color: #666; }
        .btn-small { padding: 6px 12px; font-size: 0.75rem; }
        .btn-icon { padding: 6px 10px; font-size: 0.85rem; background: none; border: 1px solid #444; color: #888; border-radius: 4px; cursor: pointer; }
        .btn-icon:hover { color: #ff4444; border-color: #ff4444; }
        .btn-back { background: none; border: none; color: #888; cursor: pointer; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 16px; padding: 0; }
        .btn-back:hover { color: #ffcc00; }

        .filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        .filters input, .filters select { padding: 10px 14px; background: #1a1a1a; border: 1px solid #333; border-radius: 5px; color: #e0e0e0; font-size: 0.85rem; }
        .filters input { flex: 1; min-width: 200px; }
        .filters input:focus, .filters select:focus { outline: none; border-color: #ffcc00; }
        .event-count { color: #888; font-size: 0.85rem; margin-left: auto; }

        .event-card { background: #1a1a1a; border-radius: 8px; padding: 16px 20px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: all 0.2s; border-left: 4px solid #333; }
        .event-card:hover { background: #222; transform: translateX(4px); }
        .event-card.active { border-left-color: #4CAF50; }
        .event-card.inactive { border-left-color: #666; opacity: 0.6; }
        .event-card-left { flex: 1; }
        .event-card-name { font-weight: bold; color: #ffcc00; font-size: 1rem; margin-bottom: 4px; }
        .event-card-meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.78rem; color: #888; align-items: center; }
        .event-card-right { display: flex; align-items: center; gap: 12px; }
        .tag { display: inline-block; padding: 3px 10px; border-radius: 3px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .tag-category { background: #1a1a2a; color: #bb86fc; border: 1px solid #9b59b6; }
        .tag-prob { background: #1a2a1a; color: #4CAF50; border: 1px solid #4CAF50; }
        .tag-cooldown { background: #2a2a1a; color: #ff9800; border: 1px solid #ff9800; }
        .tag-scope-nation { background: #1a2a2a; color: #2196F3; border: 1px solid #2196F3; }
        .tag-scope-ruling { background: #2a1a1a; color: #ff4444; border: 1px solid #ff4444; }
        .tag-scope-faction { background: #2a1a2a; color: #e040fb; border: 1px solid #e040fb; }
        .tag-active { background: #1a2a1a; color: #4CAF50; }
        .tag-inactive { background: #2a1a1a; color: #ff4444; }
        .tag-random { background: #1a2a2a; color: #58a6ff; border: 1px solid #58a6ff; }
        .tag-system { background: #2a1a2a; color: #ff9800; border: 1px solid #ff9800; }
        .tag-ministry { background: #1a2a1a; color: #4CAF50; border: 1px solid #4CAF50; }
        .tag-urgent { background: #2a1a1a; color: #ff4444; border: 1px solid #ff4444; }
        .tag-routine { background: #2a2a1a; color: #ff9800; border: 1px solid #ff9800; }
        .tag-opportunity { background: #1a2a1a; color: #4CAF50; border: 1px solid #4CAF50; }

        .editor { background: #141414; border: 2px solid #333; border-radius: 12px; overflow: hidden; }
        .editor-header { background: #1a1a1a; padding: 20px 24px; border-bottom: 2px solid #ffcc00; display: flex; justify-content: space-between; align-items: center; }
        .editor-title { font-size: 1.2rem; color: #ffcc00; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .editor-body { padding: 24px; }
        .editor-footer { padding: 16px 24px; background: #1a1a1a; border-top: 1px solid #333; display: flex; justify-content: flex-end; gap: 10px; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .form-row-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 0.78rem; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; font-weight: bold; }
        .form-input, .form-select, .form-textarea { width: 100%; padding: 10px 14px; background: #252525; border: 1px solid #444; border-radius: 6px; color: #e0e0e0; font-size: 0.9rem; font-family: inherit; box-sizing: border-box; }
        .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: #ffcc00; }
        .form-textarea { min-height: 80px; resize: vertical; }
        .form-hint { font-size: 0.75rem; color: #666; margin-top: 4px; }

        .editor-section { background: #1a1a1a; border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; border: 1px solid #333; }
        .editor-section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .editor-section-title { font-size: 0.85rem; color: #ffcc00; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }

        .desc-item { background: #252525; border-radius: 6px; padding: 12px; margin-bottom: 8px; display: flex; gap: 10px; align-items: flex-start; }
        .desc-item .form-textarea { flex: 1; min-height: 60px; }
        .trigger-item { display: grid; grid-template-columns: 1fr 100px 100px 36px; gap: 10px; align-items: center; padding: 10px; background: #252525; border-radius: 6px; margin-bottom: 8px; }
        .effect-item { display: grid; grid-template-columns: 1fr 100px 140px 36px; gap: 10px; align-items: center; padding: 10px; background: #252525; border-radius: 6px; margin-bottom: 8px; }

        .empty-state { text-align: center; color: #666; font-style: italic; padding: 30px 20px; }
        .empty-state-icon { font-size: 2rem; margin-bottom: 8px; }

        .toggle-wrapper { display: flex; align-items: center; gap: 8px; }
        .toggle { position: relative; width: 44px; height: 24px; cursor: pointer; }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .toggle-slider { position: absolute; inset: 0; background: #444; border-radius: 12px; transition: 0.3s; }
        .toggle-slider:before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; bottom: 3px; background: #888; border-radius: 50%; transition: 0.3s; }
        .toggle input:checked + .toggle-slider { background: #4CAF50; }
        .toggle input:checked + .toggle-slider:before { transform: translateX(20px); background: #fff; }
        .toggle-label { font-size: 0.8rem; color: #888; }

        .type-tabs { display: flex; gap: 0; margin-bottom: 16px; border-radius: 6px; overflow: hidden; border: 1px solid #444; }
        .type-tab { flex: 1; text-align: center; padding: 10px 16px; font-size: 0.85rem; font-weight: 600; cursor: pointer; background: #1a1a1a; color: #888; border: none; transition: all 0.2s; }
        .type-tab:not(:last-child) { border-right: 1px solid #444; }
        .type-tab.active { background: #ffcc00; color: #121212; }
        .type-tab:hover:not(.active) { background: #252525; color: #ccc; }

        .system-trigger-info { background: #1a1a2a; border: 1px solid #3a3a5a; border-radius: 8px; padding: 14px 18px; margin-bottom: 16px; font-size: 0.82rem; color: #aaa; line-height: 1.5; }
        .system-trigger-info strong { color: #ff9800; }

        .placeholder-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .placeholder-tag { display: inline-block; background: #2a2a1a; border: 1px solid #ff9800; color: #ff9800; padding: 3px 10px; border-radius: 4px; font-size: 0.75rem; font-family: 'Courier New', monospace; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .placeholder-tag:hover { background: #ff9800; color: #121212; }

        .preview-box { background: #1a2a1a; border: 1px solid #2a4a2a; border-radius: 8px; padding: 14px 18px; margin-top: 12px; }
        .preview-label { font-size: 0.7rem; color: #4CAF50; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; font-weight: bold; }
        .preview-text { font-size: 0.88rem; color: #ccc; line-height: 1.5; font-style: italic; }

        .log-entry { background: #1a1a1a; border-radius: 6px; padding: 12px 16px; margin-bottom: 8px; border-left: 3px solid #2196F3; }
        .log-entry-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .log-entry-name { font-weight: bold; color: #ffcc00; font-size: 0.9rem; }
        .log-entry-tick { font-size: 0.75rem; color: #888; }
        .log-entry-desc { font-size: 0.85rem; color: #aaa; font-style: italic; margin-bottom: 6px; }
        .log-entry-effects { font-size: 0.78rem; color: #888; }

        /* Top-level mode tabs */
        .mode-tabs { display: flex; gap: 0; margin-bottom: 24px; border-radius: 8px; overflow: hidden; border: 2px solid #ffcc00; }
        .mode-tab { flex: 1; text-align: center; padding: 14px 20px; font-size: 0.95rem; font-weight: 700; cursor: pointer; background: #1a1a1a; color: #888; border: none; transition: all 0.2s; text-transform: uppercase; letter-spacing: 1px; }
        .mode-tab:not(:last-child) { border-right: 2px solid #ffcc00; }
        .mode-tab.active { background: #ffcc00; color: #121212; }
        .mode-tab:hover:not(.active) { background: #252525; color: #ccc; }

        /* Ministry option card */
        .ministry-option-card { background: #252525; border: 2px solid #333; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
        .ministry-option-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .ministry-option-label { font-size: 0.95rem; font-weight: bold; color: #e0e0e0; }
        .ministry-option-letter { background: #ffcc00; color: #121212; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; }
        .ministry-effect-row { display: grid; grid-template-columns: 1fr 90px 120px 36px; gap: 8px; align-items: center; padding: 6px 0; }
        .ministry-effect-row .form-input, .ministry-effect-row .form-select { padding: 8px 10px; font-size: 0.82rem; }

        /* Gov type variant section */
        .variant-section { background: #1a1a1a; border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; border: 2px solid #333; }
        .variant-section.democracy { border-color: #2196F3; }
        .variant-section.autocracy { border-color: #ff4444; }
        .variant-header { font-size: 0.9rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .variant-header.democracy { color: #2196F3; }
        .variant-header.autocracy { color: #ff4444; }

        /* Checkbox row */
        .checkbox-row { display: flex; gap: 20px; align-items: center; }
        .checkbox-item { display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .checkbox-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: #ffcc00; cursor: pointer; }
        .checkbox-item label { font-size: 0.85rem; color: #ccc; cursor: pointer; }

        /* Outcome card within option */
        .outcome-card { background: #1e1e1e; border: 1px solid #444; border-radius: 6px; padding: 12px; margin-bottom: 8px; margin-left: 16px; border-left: 3px solid #888; }
        .outcome-card:first-child { border-left-color: #4CAF50; }
        .outcome-card:nth-child(2) { border-left-color: #ff9800; }
        .outcome-card:nth-child(3) { border-left-color: #ff4444; }
        .outcome-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .outcome-chance { display: flex; align-items: center; gap: 4px; }
        .outcome-chance input { width: 60px; text-align: center; }
        .outcome-chance-pct { color: #ffcc00; font-weight: bold; font-size: 0.85rem; }
        .outcome-label-input { flex: 1; }
        .chance-sum { font-size: 0.78rem; font-weight: bold; padding: 4px 10px; border-radius: 4px; margin-left: 8px; }
        .chance-sum.valid { background: #1a2a1a; color: #4CAF50; }
        .chance-sum.invalid { background: #2a1a1a; color: #ff4444; }

        @media (max-width: 768px) {
            .form-row, .form-row-3, .form-row-4 { grid-template-columns: 1fr; }
            .trigger-item, .effect-item { grid-template-columns: 1fr; }
            .event-card { flex-direction: column; align-items: flex-start; gap: 12px; }
            .ministry-effect-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="admin-container" id="content-area">
    <div class="loading-container"><div class="loading-spinner"></div><div>Loading events...</div></div>
</div>

<script src="js/supabase-client.js"></script>
<script>
// ==================== STATE ====================

    { key: 'birth_rate', label: 'Birth Rate' },{ key: 'death_rate', label: 'Death Rate' },

    { key: 'education_quality', label: 'Education Quality' },{ key: 'literacy', label: 'Literacy' },

    { key: 'carbon_emissions', label: 'Carbon Emissions' },{ key: 'fuel_prices', label: 'Fuel Prices' },
    { key: 'military_strength', label: 'Military Strength' },{ key: 'terrorism', label: 'Terrorism' },
    { key: 'political_violence', label: 'Political Violence' },{ key: 'civil_unrest', label: 'Civil Unrest' },

    { key: 'opportunity', label: '🟢 Opportunity', color: '#4CAF50' }
];

var SYSTEM_TRIGGERS = [
    { key: 'election_completed', label: 'Election Completed', desc: 'Fires when an election finishes and results are tallied.',

async function loadAllEvents() {
    var r = await _supabase
        .from('event_templates')
        .select('*, event_descriptions(*), event_triggers(*), event_effects(*)')
        .order('created_at', { ascending: false });
    allEvents = (r.error ? [] : r.data) || [];
}

async function loadAllMinistryTemplates() {
    var r = await _supabase
        .from('ministry_event_templates')
        .select('*')
        .order('ministry_key', { ascending: true });
    if (r.error) {
        console.warn('ministry_event_templates table may not exist yet:', r.error.message);
        allMinistryTemplates = [];
    } else {
        allMinistryTemplates = r.data || [];
    }
}

function renderEventList(events) {
    var c = document.getElementById('event-list');
    if (!events.length) {
        c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div>No events found. Create one to get started.</div>';
        return;
    }
    c.innerHTML = events.map(function(ev) {
        var et = ev.event_type || 'random';
        var scopes = {};
        (ev.event_effects || []).forEach(function(e) { scopes[e.target] = 1; });
        var scopeTags = Object.keys(scopes).map(function(s) {
            if (s === 'ruling_party') return '<span class="tag tag-scope-ruling">Ruling</span>';
            if (s === 'random_faction') return '<span class="tag tag-scope-faction">Faction</span>';
            return '<span class="tag tag-scope-nation">Nation</span>';
        }).join(' ');
        var typeTag = et === 'system' ? '<span class="tag tag-system">System</span>' : '<span class="tag tag-random">Random</span>';
        var triggerInfo = '';
        if (et === 'system' && ev.system_trigger) {
            var st = SYSTEM_TRIGGERS.find(function(t) { return t.key === ev.system_trigger; });
            triggerInfo = '<span style="color:#ff9800;">→ ' + (st ? st.label : ev.system_trigger) + '</span>';
        } else {
            triggerInfo = '<span class="tag tag-prob">' + ev.probability + '%</span><span class="tag tag-cooldown">' + ev.cooldown_ticks + 't cd</span>';
        }
        var counts = (ev.event_descriptions || []).length + ' desc' + (et === 'random' ? ' · ' + (ev.event_triggers || []).length + ' trig · ' + (ev.event_effects || []).length + ' fx' : '');
        return '<div class="event-card ' + (ev.is_active ? 'active' : 'inactive') + '" onclick="editEvent(\'' + ev.id + '\')">' +
            '<div class="event-card-left"><div class="event-card-name">' + escapeHtml(ev.name) + '</div>' +
            '<div class="event-card-meta">' + typeTag + '<span class="tag tag-category">' + (ev.category || 'General') + '</span>' + triggerInfo + scopeTags + '<span style="color:#666;">' + counts + '</span></div></div>' +
            '<div class="event-card-right"><span class="tag ' + (ev.is_active ? 'tag-active' : 'tag-inactive') + '">' + (ev.is_active ? 'ACTIVE' : 'INACTIVE') + '</span></div></div>';
    }).join('');
}

function applyFilters() {
    var search = (document.getElementById('filter-search').value || '').toLowerCase();
    var type = document.getElementById('filter-type').value;
    var cat = document.getElementById('filter-category').value;
    var status = document.getElementById('filter-status').value;
    var filtered = allEvents.filter(function(ev) {
        if (search && ev.name.toLowerCase().indexOf(search) === -1) return false;
        if (type && (ev.event_type || 'random') !== type) return false;
        if (cat && ev.category !== cat) return false;
        if (status === 'active' && !ev.is_active) return false;
        if (status === 'inactive' && ev.is_active) return false;
        return true;
    });
    document.getElementById('event-count').textContent = filtered.length + ' events';
    renderEventList(filtered);
}

function createNewEvent() {
    isNewEvent = true;
    currentEvent = { name: '', category: 'General', probability: 50, cooldown_ticks: 6, is_active: true, event_type: 'random', system_trigger: '' };
    editorDescriptions = []; editorTriggers = []; editorEffects = [];
    deletedDescIds = []; deletedTriggerIds = []; deletedEffectIds = [];
    renderEditor();
}

function editEvent(id) {
    var ev = allEvents.find(function(e) { return e.id === id; });
    if (!ev) return;
    isNewEvent = false;
    currentEvent = Object.assign({}, ev);
    if (!currentEvent.event_type) currentEvent.event_type = 'random';
    editorDescriptions = (ev.event_descriptions || []).map(function(d) { return Object.assign({}, d, { isNew: false }); });
    editorTriggers = (ev.event_triggers || []).map(function(t) { return Object.assign({}, t, { isNew: false }); });
    editorEffects = (ev.event_effects || []).map(function(e) { return Object.assign({}, e, { isNew: false }); });
    deletedDescIds = []; deletedTriggerIds = []; deletedEffectIds = [];
    renderEditor();
}

function switchEventType(type) { syncForm(); currentEvent.event_type = type; renderEditor(); }

function syncForm() {
    var n = document.getElementById('ev-name'); if (n) currentEvent.name = n.value;
    var cat = document.getElementById('ev-category'); if (cat) currentEvent.category = cat.value;
    var p = document.getElementById('ev-probability'); if (p) currentEvent.probability = parseInt(p.value) || 50;
    var cd = document.getElementById('ev-cooldown'); if (cd) currentEvent.cooldown_ticks = parseInt(cd.value) || 6;
    var isSys = currentEvent.event_type === 'system';
    var activeEl = isSys ? document.getElementById('ev-active-sys') : document.getElementById('ev-active');
    if (activeEl) currentEvent.is_active = activeEl.checked;
    var st = document.getElementById('ev-system-trigger'); if (st) currentEvent.system_trigger = st.value;
    document.querySelectorAll('#descriptions-list textarea').forEach(function(el, i) { if (editorDescriptions[i]) editorDescriptions[i].description_text = el.value; });
}

function getSTDesc(key) { if (!key) return 'Select a trigger to see its description.'; var t = SYSTEM_TRIGGERS.find(function(s) { return s.key === key; }); return t ? t.desc : ''; }

function renderPlaceholders(key) {
    if (!key) return '';
    var t = SYSTEM_TRIGGERS.find(function(s) { return s.key === key; });
    if (!t || !t.placeholders) return '';
    return '<div style="margin-top:10px;"><div class="form-hint" style="margin-bottom:6px;">Available placeholders — click to copy:</div><div class="placeholder-tags">' +
        t.placeholders.map(function(p) { return '<span class="placeholder-tag" onclick="copyPlaceholder(\'' + p + '\')" title="Click to copy">' + p + '</span>'; }).join('') + '</div></div>';
}

function renderPreview(key) {
    if (!key) return '';
    var t = SYSTEM_TRIGGERS.find(function(s) { return s.key === key; });
    if (!t || !t.example) return '';
    var filled = t.example;
    if (t.exampleData) Object.keys(t.exampleData).forEach(function(tag) { filled = filled.split(tag).join('<strong style="color:#ffcc00;">' + t.exampleData[tag] + '</strong>'); });
    return '<div class="preview-box"><div class="preview-label">✨ Example Output</div><div class="preview-text">' + filled + '</div></div>';
}

function copyPlaceholder(text) { navigator.clipboard.writeText(text).catch(function() {}); }

function renderDescriptions() {
    if (!editorDescriptions.length) return '<div class="empty-state" style="padding:12px;">No descriptions yet. Add at least one.</div>';
    return editorDescriptions.map(function(d, i) {
        return '<div class="desc-item"><textarea class="form-textarea" onchange="editorDescriptions[' + i + '].description_text=this.value" placeholder="Describe the event...">' + escapeHtml(d.description_text || '') + '</textarea><button class="btn-icon" onclick="removeDescription(' + i + ')">✕</button></div>';
    }).join('');
}
function addDescription() { editorDescriptions.push({ id: null, description_text: '', isNew: true }); document.getElementById('descriptions-list').innerHTML = renderDescriptions(); }
function removeDescription(i) { var d = editorDescriptions[i]; if (d.id && !d.isNew) deletedDescIds.push(d.id); editorDescriptions.splice(i, 1); document.getElementById('descriptions-list').innerHTML = renderDescriptions(); }

function renderTriggers() {
    if (!editorTriggers.length) return '<div class="empty-state" style="padding:12px;">No triggers. Random events need at least one.</div>';
    return editorTriggers.map(function(t, i) {
        return '<div class="trigger-item"><select class="form-select" onchange="editorTriggers[' + i + '].stat_key=this.value"><option value="">-- Select Stat --</option>' +
            NATION_STATS.map(function(s) { return '<option value="' + s.key + '"' + (t.stat_key === s.key ? ' selected' : '') + '>' + s.label + '</option>'; }).join('') +
            '</select><input type="number" class="form-input" value="' + (t.min_value != null ? t.min_value : '') + '" placeholder="Min" onchange="editorTriggers[' + i + '].min_value=this.value===\'\'?null:Number(this.value)">' +
            '<input type="number" class="form-input" value="' + (t.max_value != null ? t.max_value : '') + '" placeholder="Max" onchange="editorTriggers[' + i + '].max_value=this.value===\'\'?null:Number(this.value)">' +
            '<button class="btn-icon" onclick="removeTrigger(' + i + ')">✕</button></div>';
    }).join('');
}
function addTrigger() { editorTriggers.push({ id: null, stat_key: '', min_value: null, max_value: null, isNew: true }); document.getElementById('triggers-list').innerHTML = renderTriggers(); }
function removeTrigger(i) { var t = editorTriggers[i]; if (t.id && !t.isNew) deletedTriggerIds.push(t.id); editorTriggers.splice(i, 1); document.getElementById('triggers-list').innerHTML = renderTriggers(); }

function renderEffects() {
    if (!editorEffects.length) return '<div class="empty-state" style="padding:12px;">No effects. Event will be purely informational.</div>';
    return editorEffects.map(function(e, i) {
        var isN = e.target === 'nation' || !e.target;
        var opts = isN ? NATION_STATS : FACTION_STATS;
        return '<div class="effect-item"><select class="form-select" onchange="editorEffects[' + i + '].stat_key=this.value"><option value="">-- Select Stat --</option>' +
            opts.map(function(s) { return '<option value="' + s.key + '"' + (e.stat_key === s.key ? ' selected' : '') + '>' + s.label + '</option>'; }).join('') +
            '</select><input type="number" class="form-input" value="' + (e.change_value != null ? e.change_value : '') + '" placeholder="+/- value" step="0.1" onchange="editorEffects[' + i + '].change_value=Number(this.value)">' +
            '<select class="form-select" onchange="updateEffectTarget(' + i + ',this.value)"><option value="nation"' + (e.target === 'nation' ? ' selected' : '') + '>Nation</option><option value="ruling_party"' + (e.target === 'ruling_party' ? ' selected' : '') + '>Ruling Party</option><option value="random_faction"' + (e.target === 'random_faction' ? ' selected' : '') + '>Random Faction</option></select>' +
            '<button class="btn-icon" onclick="removeEffect(' + i + ')">✕</button></div>';
    }).join('');
}
function updateEffectTarget(i, v) { editorEffects[i].target = v; editorEffects[i].stat_key = ''; document.getElementById('effects-list').innerHTML = renderEffects(); }
function addEffect() { editorEffects.push({ id: null, stat_key: '', change_value: 0, target: 'nation', isNew: true }); document.getElementById('effects-list').innerHTML = renderEffects(); }
function removeEffect(i) { var e = editorEffects[i]; if (e.id && !e.isNew) deletedEffectIds.push(e.id); editorEffects.splice(i, 1); document.getElementById('effects-list').innerHTML = renderEffects(); }

async function saveEvent() {
    syncForm();
    var name = currentEvent.name.trim();
    var isSys = currentEvent.event_type === 'system';
    if (!name) { alert('Event name is required.'); return; }
    var validDescs = editorDescriptions.filter(function(d) { return d.description_text.trim(); });
    if (!validDescs.length) { alert('Add at least one description.'); return; }
    if (!isSys && !editorTriggers.filter(function(t) { return t.stat_key; }).length) { alert('Random events need at least one trigger.'); return; }
    if (isSys && !currentEvent.system_trigger) { alert('System events need a trigger selected.'); return; }
    try {
        var eventId;
        var payload = { name: name, category: currentEvent.category, probability: isSys ? 100 : (currentEvent.probability || 50), cooldown_ticks: isSys ? 0 : (currentEvent.cooldown_ticks || 6), is_active: currentEvent.is_active, event_type: currentEvent.event_type, system_trigger: isSys ? currentEvent.system_trigger : null };
        if (isNewEvent) { var r = await _supabase.from('event_templates').insert(payload).select().single(); if (r.error) throw r.error; eventId = r.data.id; }
        else { eventId = currentEvent.id; var r2 = await _supabase.from('event_templates').update(payload).eq('id', eventId); if (r2.error) throw r2.error; }
        if (deletedDescIds.length) await _supabase.from('event_descriptions').delete().in('id', deletedDescIds);
        if (deletedTriggerIds.length) await _supabase.from('event_triggers').delete().in('id', deletedTriggerIds);
        if (deletedEffectIds.length) await _supabase.from('event_effects').delete().in('id', deletedEffectIds);
        for (var d of validDescs) { if (d.isNew || !d.id) await _supabase.from('event_descriptions').insert({ event_id: eventId, description_text: d.description_text.trim() }); else await _supabase.from('event_descriptions').update({ description_text: d.description_text.trim() }).eq('id', d.id); }
        if (!isSys) { for (var t of editorTriggers.filter(function(t) { return t.stat_key; })) { var tp = { event_id: eventId, stat_key: t.stat_key, min_value: t.min_value, max_value: t.max_value }; if (t.isNew || !t.id) await _supabase.from('event_triggers').insert(tp); else await _supabase.from('event_triggers').update(tp).eq('id', t.id); } }
        for (var e of editorEffects.filter(function(e) { return e.stat_key; })) { var ep = { event_id: eventId, stat_key: e.stat_key, change_value: e.change_value || 0, target: e.target || 'nation' }; if (e.isNew || !e.id) await _supabase.from('event_effects').insert(ep); else await _supabase.from('event_effects').update(ep).eq('id', e.id); }
        alert(isNewEvent ? 'Event created!' : 'Event saved!');
        await loadAllEvents(); renderModeTabs();
    } catch (err) { console.error('Save error:', err); alert('Error: ' + err.message); }
}

async function deleteEvent(id) {
    if (!confirm('Delete this event and all its data? This cannot be undone.')) return;
    try { var r = await _supabase.from('event_templates').delete().eq('id', id); if (r.error) throw r.error; alert('Event deleted.'); await loadAllEvents(); renderModeTabs(); }
    catch (err) { console.error('Delete error:', err); alert('Error: ' + err.message); }
}

async function viewRecentLog() {
    document.getElementById('mode-content').innerHTML =
        '<button class="btn-back" onclick="renderModeTabs()">← Back to Events</button>' +
        '<div class="admin-header" style="border-bottom-color:#2196F3;"><div><div class="admin-title" style="color:#2196F3;">📋 Recent Event Log</div><div class="admin-subtitle">Last 50 events across all nations</div></div></div>' +
        '<div id="log-entries"><div style="text-align:center;padding:40px;color:#888;">Loading...</div></div>';
    var r = await _supabase.from('event_log').select('*, nations(name)').order('fired_at_tick', { ascending: false }).limit(50);
    if (r.error) { document.getElementById('log-entries').innerHTML = '<div class="empty-state">Error: ' + r.error.message + '</div>'; return; }
    if (!r.data || !r.data.length) { document.getElementById('log-entries').innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div>No events fired yet.</div>'; return; }
    document.getElementById('log-entries').innerHTML = r.data.map(function(log) {
        var fx = (log.effects_applied || []).map(function(e) { return e.stat + ': ' + (e.change > 0 ? '+' : '') + e.change + ' (' + e.target + ')'; }).join(' · ');
        return '<div class="log-entry"><div class="log-entry-header"><div class="log-entry-name">' + escapeHtml(log.event_name) + ' <span class="tag tag-category" style="margin-left:8px;">' + (log.category || '') + '</span></div><div class="log-entry-tick">' + (log.nations ? log.nations.name : '?') + ' · Tick ' + log.fired_at_tick + '</div></div><div class="log-entry-desc">' + escapeHtml(log.description_used || '') + '</div>' + (fx ? '<div class="log-entry-effects">Effects: ' + fx + '</div>' : '') + '</div>';
    }).join('');
}

    c.innerHTML = events.map(function(ev) {

        var priority = PRIORITIES.find(function(p) { return p.key === ev.priority; });
        var govTypes = (ev.gov_types || []).join(', ');
        var optCount = 0;

            if (ev.variants.Autocracy) optCount += (ev.variants.Autocracy.options || []).length;
        }

    }).join('');
}

function applyMinistryFilters() {
    var search = (document.getElementById('m-filter-search').value || '').toLowerCase();
    var ministry = document.getElementById('m-filter-ministry').value;
    var priority = document.getElementById('m-filter-priority').value;
    var filtered = allMinistryTemplates.filter(function(ev) {
        if (search && ev.title.toLowerCase().indexOf(search) === -1 && ev.event_key.toLowerCase().indexOf(search) === -1) return false;
        if (ministry && ev.ministry_key !== ministry) return false;
        if (priority && ev.priority !== priority) return false;
        return true;
    });
    document.getElementById('m-event-count').textContent = filtered.length + ' events';
    renderMinistryEventList(filtered);
}

    isNewMinistry = true;

        gov_types: ['Democracy', 'Autocracy'], is_active: true,
        weight_stat: '', weight_operator: '>', weight_value: null,
        variants: {
            titles: [''],
            Democracy: { bodies: [''], options: [{ label: '', ap: 2, money: 0, money_scaling_stat: '', outcomes: [{ chance: 100, label: 'Result', effects: [] }] }] },
            Autocracy: { bodies: [''], options: [{ label: '', ap: 2, money: 0, money_scaling_stat: '', outcomes: [{ chance: 100, label: 'Result', effects: [] }] }] }
        }

function editMinistryEvent(id) {
    var ev = allMinistryTemplates.find(function(e) { return e.id === id; });
    if (!ev) return;
    isNewMinistry = false;
    currentMinistryTemplate = JSON.parse(JSON.stringify(ev));
    var v = ev.variants || {};
    // Migrate old format: single body → bodies array, single title → titles array
    mEditorVariants = {
        titles: v.titles || (ev.title ? [ev.title] : ['']),
        Democracy: v.Democracy ? {
            bodies: v.Democracy.bodies || (v.Democracy.body ? [v.Democracy.body] : ['']),
            options: v.Democracy.options || []
        } : { bodies: [''], options: [] },
        Autocracy: v.Autocracy ? {
            bodies: v.Autocracy.bodies || (v.Autocracy.body ? [v.Autocracy.body] : ['']),
            options: v.Autocracy.options || []
        } : { bodies: [''], options: [] }
    };
    renderMinistryEditor();
}

function renderVariantSection(govType) {
    var variant = mEditorVariants[govType] || { body: '', options: [] };
    var cssClass = govType.toLowerCase();
    var icon = govType === 'Democracy' ? '🗳️' : '👑';
    var optionsHTML = (variant.options || []).map(function(opt, oi) {
        var letter = String.fromCharCode(65 + oi);

        // Migrate old format: flat effects → single outcome at 100%
        if (!opt.outcomes && opt.effects) {
            opt.outcomes = [{ chance: 100, label: 'Result', effects: opt.effects }];
            delete opt.effects;
            mEditorVariants[govType].options[oi] = opt;
        }
        if (!opt.outcomes) opt.outcomes = [{ chance: 100, label: 'Result', effects: [] }];

        // Calculate chance sum for validation
        var chanceSum = opt.outcomes.reduce(function(s, o) { return s + (o.chance || 0); }, 0);
        var chanceSumClass = chanceSum === 100 ? 'valid' : 'invalid';
        var chanceSumLabel = chanceSum === 100 ? '✓ 100%' : '⚠ ' + chanceSum + '%';

        // Render each outcome
        var outcomesHTML = opt.outcomes.map(function(outcome, ri) {
            var effectsHTML = (outcome.effects || []).map(function(eff, ei) {
                return '<div class="ministry-effect-row">' +
                    '<select class="form-select" onchange="updateOutcomeEffect(\'' + govType + '\',' + oi + ',' + ri + ',' + ei + ',\'stat_key\',this.value)"><option value="">-- Stat --</option>' +
                        NATION_STATS.concat(FACTION_STATS).concat([{key:'minister_approval',label:'Minister Approval'}]).map(function(s) { return '<option value="' + s.key + '"' + (eff.stat_key === s.key ? ' selected' : '') + '>' + s.label + '</option>'; }).join('') +
                    '</select>' +
                    '<input type="number" class="form-input" value="' + (eff.change != null ? eff.change : '') + '" placeholder="+/-" step="1" onchange="updateOutcomeEffect(\'' + govType + '\',' + oi + ',' + ri + ',' + ei + ',\'change\',Number(this.value))">' +
                    '<select class="form-select" onchange="updateOutcomeEffect(\'' + govType + '\',' + oi + ',' + ri + ',' + ei + ',\'target\',this.value)"><option value="nation"' + ((eff.target || 'nation') === 'nation' ? ' selected' : '') + '>Nation</option><option value="faction"' + (eff.target === 'faction' ? ' selected' : '') + '>Controlling Faction</option><option value="minister"' + (eff.target === 'minister' ? ' selected' : '') + '>Minister</option></select>' +
                    '<button class="btn-icon" onclick="removeOutcomeEffect(\'' + govType + '\',' + oi + ',' + ri + ',' + ei + ')">✕</button>' +
                '</div>';
            }).join('');

            return '<div class="outcome-card">' +
                '<div class="outcome-header">' +
                    '<div class="outcome-chance">' +
                        '<input type="number" class="form-input" value="' + (outcome.chance || 0) + '" min="0" max="100" onchange="updateOutcome(\'' + govType + '\',' + oi + ',' + ri + ',\'chance\',Number(this.value))">' +
                        '<span class="outcome-chance-pct">%</span>' +
                    '</div>' +
                    '<input type="text" class="form-input outcome-label-input" value="' + escapeAttr(outcome.label || '') + '" placeholder="Outcome label (e.g., Order Restored)" onchange="updateOutcome(\'' + govType + '\',' + oi + ',' + ri + ',\'label\',this.value)">' +
                    (opt.outcomes.length > 1 ? '<button class="btn-icon" onclick="removeOutcome(\'' + govType + '\',' + oi + ',' + ri + ')">✕</button>' : '') +
                '</div>' +
                effectsHTML +
                '<button class="btn btn-ghost btn-small" onclick="addOutcomeEffect(\'' + govType + '\',' + oi + ',' + ri + ')" style="margin-top:4px;">+ Add Effect</button>' +
            '</div>';
        }).join('');

        return '<div class="ministry-option-card">' +
            '<div class="ministry-option-header">' +
                '<div class="ministry-option-label"><span class="ministry-option-letter">' + letter + '</span> ' +
                    '<input type="text" class="form-input" style="display:inline;width:300px;margin-left:8px;" value="' + escapeAttr(opt.label) + '" placeholder="Option label..." onchange="updateMOpt(\'' + govType + '\',' + oi + ',\'label\',this.value)">' +
                '</div>' +
                '<button class="btn-icon" onclick="removeMOption(\'' + govType + '\',' + oi + ')">✕</button>' +
            '</div>' +
            '<div class="form-row-3" style="margin-bottom:8px;">' +
                '<div class="form-group" style="margin-bottom:0;"><label class="form-label">AP Cost</label><input type="number" class="form-input" value="' + (opt.ap || 0) + '" min="0" onchange="updateMOpt(\'' + govType + '\',' + oi + ',\'ap\',Number(this.value))"></div>' +
                '<div class="form-group" style="margin-bottom:0;"><label class="form-label">Money ($M base)</label><input type="number" class="form-input" value="' + (opt.money || 0) + '" min="0" onchange="updateMOpt(\'' + govType + '\',' + oi + ',\'money\',Number(this.value))"></div>' +
                '<div class="form-group" style="margin-bottom:0;"><label class="form-label">Money Scaling Stat</label><select class="form-select" onchange="updateMOpt(\'' + govType + '\',' + oi + ',\'money_scaling_stat\',this.value)"><option value="">None (flat cost)</option>' +
                    NATION_STATS.map(function(s) { return '<option value="' + s.key + '"' + (opt.money_scaling_stat === s.key ? ' selected' : '') + '>' + s.label + '</option>'; }).join('') +
                '</select></div>' +
            '</div>' +
            '<div style="display:flex;align-items:center;margin-bottom:8px;">' +
                '<label class="form-label" style="margin-bottom:0;">Possible Outcomes</label>' +
                '<span class="chance-sum ' + chanceSumClass + '">' + chanceSumLabel + '</span>' +
                '<button class="btn btn-ghost btn-small" onclick="addOutcome(\'' + govType + '\',' + oi + ')" style="margin-left:auto;">+ Add Outcome</button>' +
            '</div>' +
            outcomesHTML +
        '</div>';
    }).join('');

    return '<div class="variant-section ' + cssClass + '">' +
        '<div class="variant-header ' + cssClass + '">' + icon + ' ' + govType + ' Variant</div>' +
        '<div class="editor-section" style="border:none;padding:0;margin-bottom:12px;background:none;"><div class="editor-section-header"><div class="editor-section-title" style="font-size:0.78rem;">📄 Email Body Variants</div><button class="btn btn-ghost btn-small" onclick="addMBody(\'' + govType + '\')">+ Add Variant</button></div>' +
        '<div class="form-hint" style="margin-bottom:8px;">Multiple body texts — one randomly chosen. Keeps repeat events feeling fresh.</div>' +
        '<div id="me-bodies-' + govType + '">' + renderMBodies(govType) + '</div></div>' +
        '<label class="form-label">Response Options</label>' +
        '<div id="me-options-' + govType + '">' + optionsHTML + '</div>' +
        '<button class="btn btn-ghost btn-small" onclick="addMOption(\'' + govType + '\')" style="margin-top:8px;">+ Add Option</button>' +
    '</div>';
}

// Ministry variant helpers
function updateMOpt(govType, oi, field, value) { mEditorVariants[govType].options[oi][field] = value; }

// Outcome helpers
function updateOutcome(govType, oi, ri, field, value) {
    mEditorVariants[govType].options[oi].outcomes[ri][field] = value;
    // Update the chance sum display live
    if (field === 'chance') {
        var sum = mEditorVariants[govType].options[oi].outcomes.reduce(function(s, o) { return s + (o.chance || 0); }, 0);
        // Re-render just to update the sum badge — a bit heavy but reliable
        syncMinistryBody();
        renderMinistryEditor();
    }
}

function updateOutcomeEffect(govType, oi, ri, ei, field, value) {
    mEditorVariants[govType].options[oi].outcomes[ri].effects[ei][field] = value;
}

function addOutcome(govType, oi) {
    var outcomes = mEditorVariants[govType].options[oi].outcomes;
    var remaining = 100 - outcomes.reduce(function(s, o) { return s + (o.chance || 0); }, 0);
    outcomes.push({ chance: Math.max(0, remaining), label: '', effects: [] });
    syncMinistryBody();
    renderMinistryEditor();
}

function removeOutcome(govType, oi, ri) {
    mEditorVariants[govType].options[oi].outcomes.splice(ri, 1);
    syncMinistryBody();
    renderMinistryEditor();
}

function addOutcomeEffect(govType, oi, ri) {
    mEditorVariants[govType].options[oi].outcomes[ri].effects.push({ stat_key: '', change: 0, target: 'nation' });
    syncMinistryBody();
    renderMinistryEditor();
}

function removeOutcomeEffect(govType, oi, ri, ei) {
    mEditorVariants[govType].options[oi].outcomes[ri].effects.splice(ei, 1);
    syncMinistryBody();
    renderMinistryEditor();
}

function addMOption(govType) {
    mEditorVariants[govType].options.push({ label: '', ap: 2, money: 0, money_scaling_stat: '', outcomes: [{ chance: 100, label: 'Result', effects: [] }] });
    syncMinistryBody();
    renderMinistryEditor();
}

function removeMOption(govType, oi) {
    mEditorVariants[govType].options.splice(oi, 1);
    syncMinistryBody();
    renderMinistryEditor();
}

function syncMinistryBody() {
    // Sync title variants
    document.querySelectorAll('#me-titles-list input').forEach(function(el, i) {
        if (mEditorVariants.titles[i] !== undefined) mEditorVariants.titles[i] = el.value;
    });
    // Sync body variants per gov type
    document.querySelectorAll('#me-bodies-Democracy textarea').forEach(function(el, i) {
        if (mEditorVariants.Democracy && mEditorVariants.Democracy.bodies[i] !== undefined) mEditorVariants.Democracy.bodies[i] = el.value;
    });
    document.querySelectorAll('#me-bodies-Autocracy textarea').forEach(function(el, i) {
        if (mEditorVariants.Autocracy && mEditorVariants.Autocracy.bodies[i] !== undefined) mEditorVariants.Autocracy.bodies[i] = el.value;
    });
}

// Title variant helpers
function renderMTitles() {
    var titles = mEditorVariants.titles || [''];
    if (!titles.length) return '<div class="empty-state" style="padding:12px;">No titles. Add at least one.</div>';
    return titles.map(function(t, i) {
        return '<div class="desc-item">' +
            '<input type="text" class="form-input" style="flex:1;" value="' + escapeAttr(t) + '" placeholder="' + (i === 0 ? 'Primary subject line...' : 'Alternate subject line...') + '" onchange="mEditorVariants.titles[' + i + ']=this.value">' +
            (titles.length > 1 ? '<button class="btn-icon" onclick="removeMTitle(' + i + ')">✕</button>' : '') +
        '</div>';
    }).join('');
}

function addMTitle() {
    syncMinistryBody();
    mEditorVariants.titles.push('');
    document.getElementById('me-titles-list').innerHTML = renderMTitles();
}

function removeMTitle(i) {
    syncMinistryBody();
    mEditorVariants.titles.splice(i, 1);
    document.getElementById('me-titles-list').innerHTML = renderMTitles();
}

// Body variant helpers
function renderMBodies(govType) {
    var bodies = (mEditorVariants[govType] || {}).bodies || [''];
    if (!bodies.length) return '<div class="empty-state" style="padding:12px;">No body texts. Add at least one.</div>';
    return bodies.map(function(b, i) {
        return '<div class="desc-item">' +
            '<textarea class="form-textarea" style="flex:1;min-height:80px;" placeholder="' + (i === 0 ? 'Primary email body text...' : 'Alternate email body text...') + '">' + escapeHtml(b) + '</textarea>' +
            (bodies.length > 1 ? '<button class="btn-icon" onclick="removeMBody(\'' + govType + '\',' + i + ')">✕</button>' : '') +
        '</div>';
    }).join('');
}

function addMBody(govType) {
    syncMinistryBody();
    if (!mEditorVariants[govType]) mEditorVariants[govType] = { bodies: [], options: [] };
    mEditorVariants[govType].bodies.push('');
    document.getElementById('me-bodies-' + govType).innerHTML = renderMBodies(govType);
}

function removeMBody(govType, i) {
    syncMinistryBody();
    mEditorVariants[govType].bodies.splice(i, 1);
    document.getElementById('me-bodies-' + govType).innerHTML = renderMBodies(govType);
}

async function saveMinistryEvent() {
    syncMinistryBody();
    var tmpl = currentMinistryTemplate;

    // Read form fields
    var eventKey = (document.getElementById('me-key').value || '').trim();
    syncMinistryBody();
    var validTitles = (mEditorVariants.titles || []).filter(function(t) { return t.trim(); });
    var titleVal = validTitles.length > 0 ? validTitles[0] : '';
    var ministry = document.getElementById('me-ministry').value;
    var sender = (document.getElementById('me-sender').value || '').trim();
    var priority = document.getElementById('me-priority').value;
    var deadline = parseInt(document.getElementById('me-deadline').value) || 3;
    var cooldown = parseInt(document.getElementById('me-cooldown').value) || 6;
    var isActive = document.getElementById('me-active').checked;
    var govDem = document.getElementById('me-gov-dem').checked;
    var govAut = document.getElementById('me-gov-aut').checked;
    var weightStat = document.getElementById('me-weight-stat').value || null;
    var weightOp = document.getElementById('me-weight-op').value || '>';
    var weightVal = document.getElementById('me-weight-val').value;
    weightVal = weightVal !== '' ? Number(weightVal) : null;

    if (!eventKey) { alert('Event key is required.'); return; }
    if (!titleVal) { alert('At least one subject line is required.'); return; }
    if (!sender) { alert('Sender is required.'); return; }
    if (!govDem && !govAut) { alert('Select at least one government type.'); return; }

    // Validate outcome chances sum to 100 for each option
    var govChecks = [];
    if (govDem) govChecks.push('Democracy');
    if (govAut) govChecks.push('Autocracy');
    for (var gi = 0; gi < govChecks.length; gi++) {
        var gType = govChecks[gi];
        var opts = (mEditorVariants[gType] || {}).options || [];
        for (var oii = 0; oii < opts.length; oii++) {
            var outcomes = opts[oii].outcomes || [];
            if (outcomes.length > 0) {
                var sum = outcomes.reduce(function(s, o) { return s + (o.chance || 0); }, 0);
                if (sum !== 100) {
                    var letter = String.fromCharCode(65 + oii);
                    alert(gType + ' Option ' + letter + ': Outcome chances sum to ' + sum + '%, must equal 100%.');
                    return;
                }
            }
        }
    }

    var govTypes = [];
    if (govDem) govTypes.push('Democracy');
    if (govAut) govTypes.push('Autocracy');

    // Clean variants — only include enabled gov types, store title variants
    var cleanVariants = { titles: validTitles };
    if (govDem && mEditorVariants.Democracy) cleanVariants.Democracy = mEditorVariants.Democracy;
    if (govAut && mEditorVariants.Autocracy) cleanVariants.Autocracy = mEditorVariants.Autocracy;

    var payload = {
        event_key: eventKey, ministry_key: ministry, title: titleVal, sender: sender,
        priority: priority, deadline_ticks: deadline, cooldown_ticks: cooldown,
        gov_types: govTypes, is_active: isActive,
        weight_stat: weightStat, weight_operator: weightOp, weight_value: weightVal,
        variants: cleanVariants
    };

    try {
        if (isNewMinistry) {
            var r = await _supabase.from('ministry_event_templates').insert(payload).select().single();
            if (r.error) throw r.error;
        } else {
            var r2 = await _supabase.from('ministry_event_templates').update(payload).eq('id', tmpl.id);
            if (r2.error) throw r2.error;
        }
        alert(isNewMinistry ? 'Ministry event created!' : 'Ministry event saved!');
        await loadAllMinistryTemplates();
        renderModeTabs();
    } catch (err) {
        console.error('Save error:', err);
        alert('Error: ' + err.message);
    }
}

async function deleteMinistryEvent(id) {
    if (!confirm('Delete this ministry event? This cannot be undone.')) return;
    try {
        var r = await _supabase.from('ministry_event_templates').delete().eq('id', id);
        if (r.error) throw r.error;
        alert('Ministry event deleted.');
        await loadAllMinistryTemplates();
        renderModeTabs();
    } catch (err) { console.error('Delete error:', err); alert('Error: ' + err.message); }
}

function cancelMinistryEditor() { renderModeTabs(); }


// ==================== UTILITIES ====================
function escapeHtml(t) { var d = document.createElement('div'); d.textContent = t || ''; return d.innerHTML; }
function escapeAttr(t) { return (t || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
</script>
