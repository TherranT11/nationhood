(async function() {
    await loadAllEvents();

async function loadAllEvents() {
    var r = await _supabase
        .from('event_templates')
        .select('*, event_descriptions(*), event_triggers(*), event_effects(*)')
        .order('created_at', { ascending: false });
    allEvents = (r.error ? [] : r.data) || [];
}



// ======================================================================
//  SECTION 1: RANDOM & SYSTEM EVENTS (original functionality)
// ======================================================================

function renderListView() {
    currentEvent = null;
    document.getElementById('content-area').innerHTML =
        '<div class="admin-header"><div>' +
            '<div class="admin-title">⚡ Event Manager</div>' +
            '<div class="admin-subtitle">Random (stat-triggered) and System (game action–triggered) events</div>' +
        '</div><div class="admin-actions">' +
            '<button class="btn btn-ghost" onclick="viewRecentLog()">📋 Event Log</button>' +
            '<button class="btn btn-primary" onclick="createNewEvent()">+ New Event</button>' +
        '</div></div>' +
        '<div class="filters">' +
            '<input type="text" id="filter-search" placeholder="Search events..." oninput="applyFilters()">' +
            '<select id="filter-type" onchange="applyFilters()"><option value="">All Types</option><option value="random">Random</option><option value="system">System</option></select>' +
            '<select id="filter-category" onchange="applyFilters()"><option value="">All Categories</option>' +
                EVENT_CATEGORIES.map(function(c) { return '<option value="' + c + '">' + c + '</option>'; }).join('') +
            '</select>' +
            '<select id="filter-status" onchange="applyFilters()"><option value="">All Status</option><option value="active">Active</option><option value="inactive">Inactive</option></select>' +
            '<span class="event-count" id="event-count">' + allEvents.length + ' events</span>' +
        '</div>' +
        '<div id="event-list"></div>';
    renderEventList(allEvents);
}

function renderEventList(events) {
    var c = document.getElementById('event-list');
    if (!events.length) {
        c.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div>No events found. Create one to get started.</div>';
        return;
    }
    c.innerHTML = events.map(function(ev) {
        var et = ev.event_type || 'random';
        var scopes = {};
        (ev.event_effects || []).forEach(function(e) { scopes[e.target] = 1; });
        var scopeTags = Object.keys(scopes).map(function(s) {
            if (s === 'ruling_party') return '<span class="tag tag-scope-ruling">Ruling</span>';
            if (s === 'random_faction') return '<span class="tag tag-scope-faction">Faction</span>';
            return '<span class="tag tag-scope-nation">Nation</span>';
        }).join(' ');
        var typeTag = et === 'system' ? '<span class="tag tag-system">System</span>' : '<span class="tag tag-random">Random</span>';
        var triggerInfo = '';
        if (et === 'system' && ev.system_trigger) {
            var st = SYSTEM_TRIGGERS.find(function(t) { return t.key === ev.system_trigger; });
            triggerInfo = '<span style="color:#ff9800;">→ ' + (st ? st.label : ev.system_trigger) + '</span>';
        } else {
            triggerInfo = '<span class="tag tag-prob">' + ev.probability + '%</span><span class="tag tag-cooldown">' + ev.cooldown_ticks + 't cd</span>';
        }
        var counts = (ev.event_descriptions || []).length + ' desc' + (et === 'random' ? ' · ' + (ev.event_triggers || []).length + ' trig · ' + (ev.event_effects || []).length + ' fx' : '');
        return '<div class="event-card ' + (ev.is_active ? 'active' : 'inactive') + '" onclick="editEvent(\'' + ev.id + '\')">' +
            '<div class="event-card-left"><div class="event-card-name">' + escapeHtml(ev.name) + '</div>' +
            '<div class="event-card-meta">' + typeTag + '<span class="tag tag-category">' + (ev.category || 'General') + '</span>' + triggerInfo + scopeTags + '<span style="color:#666;">' + counts + '</span></div></div>' +
            '<div class="event-card-right"><span class="tag ' + (ev.is_active ? 'tag-active' : 'tag-inactive') + '">' + (ev.is_active ? 'ACTIVE' : 'INACTIVE') + '</span></div></div>';
    }).join('');
}

function applyFilters() {
    var search = (document.getElementById('filter-search').value || '').toLowerCase();
    var type = document.getElementById('filter-type').value;
    var cat = document.getElementById('filter-category').value;
    var status = document.getElementById('filter-status').value;
    var filtered = allEvents.filter(function(ev) {
        if (search && ev.name.toLowerCase().indexOf(search) === -1) return false;
        if (type && (ev.event_type || 'random') !== type) return false;
        if (cat && ev.category !== cat) return false;
        if (status === 'active' && !ev.is_active) return false;
        if (status === 'inactive' && ev.is_active) return false;
        return true;
    });
    document.getElementById('event-count').textContent = filtered.length + ' events';
    renderEventList(filtered);
}

function createNewEvent() {
    isNewEvent = true;
    currentEvent = { name: '', category: 'General', probability: 50, cooldown_ticks: 6, is_active: true, event_type: 'random', system_trigger: '' };
    editorDescriptions = []; editorTriggers = []; editorEffects = [];
    deletedDescIds = []; deletedTriggerIds = []; deletedEffectIds = [];
    renderEditor();
}

function editEvent(id) {
    var ev = allEvents.find(function(e) { return e.id === id; });
    if (!ev) return;
    isNewEvent = false;
    currentEvent = Object.assign({}, ev);
    if (!currentEvent.event_type) currentEvent.event_type = 'random';
    editorDescriptions = (ev.event_descriptions || []).map(function(d) { return Object.assign({}, d, { isNew: false }); });
    editorTriggers = (ev.event_triggers || []).map(function(t) { return Object.assign({}, t, { isNew: false }); });
    editorEffects = (ev.event_effects || []).map(function(e) { return Object.assign({}, e, { isNew: false }); });
    deletedDescIds = []; deletedTriggerIds = []; deletedEffectIds = [];
    renderEditor();
}

function renderEditor() {
    var c = document.getElementById('content-area');
    var title = isNewEvent ? 'Create New Event' : 'Edit Event';
    var isSys = currentEvent.event_type === 'system';

    c.innerHTML =
        '<button class="btn-back" onclick="cancelEditor()">← Back to Events</button>' +
        '<div class="editor">' +
            '<div class="editor-header"><div class="editor-title">' + title + '</div>' +
                (!isNewEvent ? '<button class="btn btn-danger btn-small" onclick="deleteEvent(\'' + currentEvent.id + '\')">🗑 Delete</button>' : '') +
            '</div>' +
            '<div class="editor-body">' +
                '<div class="type-tabs">' +
                    '<button class="type-tab ' + (!isSys ? 'active' : '') + '" onclick="switchEventType(\'random\')">🎲 Random Event</button>' +
                    '<button class="type-tab ' + (isSys ? 'active' : '') + '" onclick="switchEventType(\'system\')">⚙️ System Event</button>' +
                '</div>' +
                '<div class="form-row"><div class="form-group"><label class="form-label">Event Name</label><input type="text" class="form-input" id="ev-name" value="' + escapeAttr(currentEvent.name || '') + '" placeholder="e.g., Economic Recession"></div>' +
                '<div class="form-group"><label class="form-label">Category</label><select class="form-select" id="ev-category">' +
                    EVENT_CATEGORIES.map(function(cat) { return '<option value="' + cat + '"' + (currentEvent.category === cat ? ' selected' : '') + '>' + cat + '</option>'; }).join('') +
                '</select></div></div>' +
                '<div id="random-fields" style="' + (isSys ? 'display:none;' : '') + '">' +
                    '<div class="form-row-3"><div class="form-group"><label class="form-label">Probability (%)</label><input type="number" class="form-input" id="ev-probability" value="' + (currentEvent.probability || 50) + '" min="1" max="100"><div class="form-hint">Chance per tick when triggers met</div></div>' +
                    '<div class="form-group"><label class="form-label">Cooldown (ticks)</label><input type="number" class="form-input" id="ev-cooldown" value="' + (currentEvent.cooldown_ticks || 6) + '" min="0"><div class="form-hint">Min ticks between firings</div></div>' +
                    '<div class="form-group"><label class="form-label">Status</label><div class="toggle-wrapper" style="margin-top:8px;"><label class="toggle"><input type="checkbox" id="ev-active" ' + (currentEvent.is_active ? 'checked' : '') + '><span class="toggle-slider"></span></label><span class="toggle-label" id="ev-active-label">' + (currentEvent.is_active ? 'Active' : 'Inactive') + '</span></div></div></div>' +
                '</div>' +
                '<div id="system-fields" style="' + (!isSys ? 'display:none;' : '') + '">' +
                    '<div class="system-trigger-info"><strong>System events</strong> fire automatically when a game action occurs. No stat triggers or probability roll — the game code fires them directly. Add multiple descriptions (one randomly picked). Use the placeholder tags below in your descriptions.</div>' +
                    '<div class="form-row"><div class="form-group"><label class="form-label">System Trigger</label><select class="form-select" id="ev-system-trigger"><option value="">-- Select Trigger --</option>' +
                        SYSTEM_TRIGGERS.map(function(t) { return '<option value="' + t.key + '"' + (currentEvent.system_trigger === t.key ? ' selected' : '') + '>' + t.label + '</option>'; }).join('') +
                    '</select><div class="form-hint" id="system-trigger-desc">' + getSTDesc(currentEvent.system_trigger) + '</div><div id="system-placeholders">' + renderPlaceholders(currentEvent.system_trigger) + '</div></div>' +
                    '<div class="form-group"><label class="form-label">Status</label><div class="toggle-wrapper" style="margin-top:8px;"><label class="toggle"><input type="checkbox" id="ev-active-sys" ' + (currentEvent.is_active ? 'checked' : '') + '><span class="toggle-slider"></span></label><span class="toggle-label" id="ev-active-sys-label">' + (currentEvent.is_active ? 'Active' : 'Inactive') + '</span></div></div></div>' +
                    '<div id="system-preview">' + renderPreview(currentEvent.system_trigger) + '</div>' +
                '</div>' +
                '<div class="editor-section"><div class="editor-section-header"><div class="editor-section-title">📝 Descriptions</div><button class="btn btn-ghost btn-small" onclick="addDescription()">+ Add</button></div>' +
                '<div class="form-hint" style="margin-bottom:12px;">' + (isSys ? 'Multiple descriptions — one randomly chosen each time. Use placeholder tags.' : 'Multiple descriptions — one randomly chosen each time. Use <code style="color:#ff9800;">{nation}</code> for the nation name.') + '</div>' +
                '<div id="descriptions-list">' + renderDescriptions() + '</div></div>' +
                '<div id="triggers-section" style="' + (isSys ? 'display:none;' : '') + '"><div class="editor-section"><div class="editor-section-header"><div class="editor-section-title">🎯 Triggers</div><button class="btn btn-ghost btn-small" onclick="addTrigger()">+ Add</button></div><div class="form-hint" style="margin-bottom:12px;">ALL conditions must be met.</div><div id="triggers-list">' + renderTriggers() + '</div></div></div>' +
                '<div id="effects-section" style="' + (isSys ? 'display:none;' : '') + '"><div class="editor-section"><div class="editor-section-header"><div class="editor-section-title">💥 Effects</div><button class="btn btn-ghost btn-small" onclick="addEffect()">+ Add</button></div><div class="form-hint" style="margin-bottom:12px;">Stat changes when event fires.</div><div id="effects-list">' + renderEffects() + '</div></div></div>' +
            '</div>' +
            '<div class="editor-footer"><button class="btn btn-ghost" onclick="cancelEditor()">Cancel</button><button class="btn btn-primary" onclick="saveEvent()">💾 Save Event</button></div>' +
        '</div>';

    var ea = document.getElementById('ev-active');
    if (ea) ea.onchange = function() { document.getElementById('ev-active-label').textContent = this.checked ? 'Active' : 'Inactive'; };
    var eas = document.getElementById('ev-active-sys');
    if (eas) eas.onchange = function() { document.getElementById('ev-active-sys-label').textContent = this.checked ? 'Active' : 'Inactive'; };
    var stSel = document.getElementById('ev-system-trigger');
    if (stSel) stSel.onchange = function() {
        document.getElementById('system-trigger-desc').textContent = getSTDesc(this.value);
        document.getElementById('system-placeholders').innerHTML = renderPlaceholders(this.value);
        document.getElementById('system-preview').innerHTML = renderPreview(this.value);
    };
}

function switchEventType(type) { syncForm(); currentEvent.event_type = type; renderEditor(); }

function syncForm() {
    var n = document.getElementById('ev-name'); if (n) currentEvent.name = n.value;
    var cat = document.getElementById('ev-category'); if (cat) currentEvent.category = cat.value;
    var p = document.getElementById('ev-probability'); if (p) currentEvent.probability = parseInt(p.value) || 50;
    var cd = document.getElementById('ev-cooldown'); if (cd) currentEvent.cooldown_ticks = parseInt(cd.value) || 6;
    var isSys = currentEvent.event_type === 'system';
    var activeEl = isSys ? document.getElementById('ev-active-sys') : document.getElementById('ev-active');
    if (activeEl) currentEvent.is_active = activeEl.checked;
    var st = document.getElementById('ev-system-trigger'); if (st) currentEvent.system_trigger = st.value;
    document.querySelectorAll('#descriptions-list textarea').forEach(function(el, i) { if (editorDescriptions[i]) editorDescriptions[i].description_text = el.value; });
}

function getSTDesc(key) { if (!key) return 'Select a trigger to see its description.'; var t = SYSTEM_TRIGGERS.find(function(s) { return s.key === key; }); return t ? t.desc : ''; }

function renderPlaceholders(key) {
    if (!key) return '';
    var t = SYSTEM_TRIGGERS.find(function(s) { return s.key === key; });
    if (!t || !t.placeholders) return '';
    return '<div style="margin-top:10px;"><div class="form-hint" style="margin-bottom:6px;">Available placeholders — click to copy:</div><div class="placeholder-tags">' +
        t.placeholders.map(function(p) { return '<span class="placeholder-tag" onclick="copyPlaceholder(\'' + p + '\')" title="Click to copy">' + p + '</span>'; }).join('') + '</div></div>';
}

function renderPreview(key) {
    if (!key) return '';
    var t = SYSTEM_TRIGGERS.find(function(s) { return s.key === key; });
    if (!t || !t.example) return '';
    var filled = t.example;
    if (t.exampleData) Object.keys(t.exampleData).forEach(function(tag) { filled = filled.split(tag).join('<strong style="color:#ffcc00;">' + t.exampleData[tag] + '</strong>'); });
    return '<div class="preview-box"><div class="preview-label">✨ Example Output</div><div class="preview-text">' + filled + '</div></div>';
}

function copyPlaceholder(text) { navigator.clipboard.writeText(text).catch(function() {}); }

function renderDescriptions() {
    if (!editorDescriptions.length) return '<div class="empty-state" style="padding:12px;">No descriptions yet. Add at least one.</div>';
    return editorDescriptions.map(function(d, i) {
        return '<div class="desc-item"><textarea class="form-textarea" onchange="editorDescriptions[' + i + '].description_text=this.value" placeholder="Describe the event...">' + escapeHtml(d.description_text || '') + '</textarea><button class="btn-icon" onclick="removeDescription(' + i + ')">✕</button></div>';
    }).join('');
}
function addDescription() { editorDescriptions.push({ id: null, description_text: '', isNew: true }); document.getElementById('descriptions-list').innerHTML = renderDescriptions(); }
function removeDescription(i) { var d = editorDescriptions[i]; if (d.id && !d.isNew) deletedDescIds.push(d.id); editorDescriptions.splice(i, 1); document.getElementById('descriptions-list').innerHTML = renderDescriptions(); }

function renderTriggers() {
    if (!editorTriggers.length) return '<div class="empty-state" style="padding:12px;">No triggers. Random events need at least one.</div>';
    return editorTriggers.map(function(t, i) {
        return '<div class="trigger-item"><select class="form-select" onchange="editorTriggers[' + i + '].stat_key=this.value"><option value="">-- Select Stat --</option>' +
            NATION_STATS.map(function(s) { return '<option value="' + s.key + '"' + (t.stat_key === s.key ? ' selected' : '') + '>' + s.label + '</option>'; }).join('') +
            '</select><input type="number" class="form-input" value="' + (t.min_value != null ? t.min_value : '') + '" placeholder="Min" onchange="editorTriggers[' + i + '].min_value=this.value===\'\'?null:Number(this.value)">' +
            '<input type="number" class="form-input" value="' + (t.max_value != null ? t.max_value : '') + '" placeholder="Max" onchange="editorTriggers[' + i + '].max_value=this.value===\'\'?null:Number(this.value)">' +
            '<button class="btn-icon" onclick="removeTrigger(' + i + ')">✕</button></div>';
    }).join('');
}
function addTrigger() { editorTriggers.push({ id: null, stat_key: '', min_value: null, max_value: null, isNew: true }); document.getElementById('triggers-list').innerHTML = renderTriggers(); }
function removeTrigger(i) { var t = editorTriggers[i]; if (t.id && !t.isNew) deletedTriggerIds.push(t.id); editorTriggers.splice(i, 1); document.getElementById('triggers-list').innerHTML = renderTriggers(); }

function renderEffects() {
    if (!editorEffects.length) return '<div class="empty-state" style="padding:12px;">No effects. Event will be purely informational.</div>';
    return editorEffects.map(function(e, i) {
        var isN = e.target === 'nation' || !e.target;
        var opts = isN ? NATION_STATS : FACTION_STATS;
        return '<div class="effect-item"><select class="form-select" onchange="editorEffects[' + i + '].stat_key=this.value"><option value="">-- Select Stat --</option>' +
            opts.map(function(s) { return '<option value="' + s.key + '"' + (e.stat_key === s.key ? ' selected' : '') + '>' + s.label + '</option>'; }).join('') +
            '</select><input type="number" class="form-input" value="' + (e.change_value != null ? e.change_value : '') + '" placeholder="+/- value" step="0.1" onchange="editorEffects[' + i + '].change_value=Number(this.value)">' +
            '<select class="form-select" onchange="updateEffectTarget(' + i + ',this.value)"><option value="nation"' + (e.target === 'nation' ? ' selected' : '') + '>Nation</option><option value="ruling_party"' + (e.target === 'ruling_party' ? ' selected' : '') + '>Ruling Party</option><option value="random_faction"' + (e.target === 'random_faction' ? ' selected' : '') + '>Random Faction</option></select>' +
            '<button class="btn-icon" onclick="removeEffect(' + i + ')">✕</button></div>';
    }).join('');
}
function updateEffectTarget(i, v) { editorEffects[i].target = v; editorEffects[i].stat_key = ''; document.getElementById('effects-list').innerHTML = renderEffects(); }
function addEffect() { editorEffects.push({ id: null, stat_key: '', change_value: 0, target: 'nation', isNew: true }); document.getElementById('effects-list').innerHTML = renderEffects(); }
function removeEffect(i) { var e = editorEffects[i]; if (e.id && !e.isNew) deletedEffectIds.push(e.id); editorEffects.splice(i, 1); document.getElementById('effects-list').innerHTML = renderEffects(); }

async function saveEvent() {
    syncForm();
    var name = currentEvent.name.trim();
    var isSys = currentEvent.event_type === 'system';
    if (!name) { alert('Event name is required.'); return; }
    var validDescs = editorDescriptions.filter(function(d) { return d.description_text.trim(); });
    if (!validDescs.length) { alert('Add at least one description.'); return; }
    if (!isSys && !editorTriggers.filter(function(t) { return t.stat_key; }).length) { alert('Random events need at least one trigger.'); return; }
    if (isSys && !currentEvent.system_trigger) { alert('System events need a trigger selected.'); return; }
    try {
        var eventId;
        var payload = { name: name, category: currentEvent.category, probability: isSys ? 100 : (currentEvent.probability || 50), cooldown_ticks: isSys ? 0 : (currentEvent.cooldown_ticks || 6), is_active: currentEvent.is_active, event_type: currentEvent.event_type, system_trigger: isSys ? currentEvent.system_trigger : null };
        if (isNewEvent) { var r = await _supabase.from('event_templates').insert(payload).select().single(); if (r.error) throw r.error; eventId = r.data.id; }
        else { eventId = currentEvent.id; var r2 = await _supabase.from('event_templates').update(payload).eq('id', eventId); if (r2.error) throw r2.error; }
        if (deletedDescIds.length) await _supabase.from('event_descriptions').delete().in('id', deletedDescIds);
        if (deletedTriggerIds.length) await _supabase.from('event_triggers').delete().in('id', deletedTriggerIds);
        if (deletedEffectIds.length) await _supabase.from('event_effects').delete().in('id', deletedEffectIds);
        for (var d of validDescs) { if (d.isNew || !d.id) await _supabase.from('event_descriptions').insert({ event_id: eventId, description_text: d.description_text.trim() }); else await _supabase.from('event_descriptions').update({ description_text: d.description_text.trim() }).eq('id', d.id); }
        if (!isSys) { for (var t of editorTriggers.filter(function(t) { return t.stat_key; })) { var tp = { event_id: eventId, stat_key: t.stat_key, min_value: t.min_value, max_value: t.max_value }; if (t.isNew || !t.id) await _supabase.from('event_triggers').insert(tp); else await _supabase.from('event_triggers').update(tp).eq('id', t.id); } }
        for (var e of editorEffects.filter(function(e) { return e.stat_key; })) { var ep = { event_id: eventId, stat_key: e.stat_key, change_value: e.change_value || 0, target: e.target || 'nation' }; if (e.isNew || !e.id) await _supabase.from('event_effects').insert(ep); else await _supabase.from('event_effects').update(ep).eq('id', e.id); }
        alert(isNewEvent ? 'Event created!' : 'Event saved!');
        await loadAllEvents(); renderListView();
    } catch (err) { console.error('Save error:', err); alert('Error: ' + err.message); }
}

async function deleteEvent(id) {
    if (!confirm('Delete this event and all its data? This cannot be undone.')) return;
    try { var r = await _supabase.from('event_templates').delete().eq('id', id); if (r.error) throw r.error; alert('Event deleted.'); await loadAllEvents(); renderListView(); }
    catch (err) { console.error('Delete error:', err); alert('Error: ' + err.message); }
}

async function viewRecentLog() {
    document.getElementById('content-area').innerHTML =
        '<button class="btn-back" onclick="renderListView()">← Back to Events</button>' +
        '<div class="admin-header" style="border-bottom-color:#2196F3;"><div><div class="admin-title" style="color:#2196F3;">📋 Recent Event Log</div><div class="admin-subtitle">Last 50 events across all nations</div></div></div>' +
        '<div id="log-entries"><div style="text-align:center;padding:40px;color:#888;">Loading...</div></div>';
    var r = await _supabase.from('event_log').select('*, nations(name)').order('fired_at_tick', { ascending: false }).limit(50);
    if (r.error) { document.getElementById('log-entries').innerHTML = '<div class="empty-state">Error: ' + r.error.message + '</div>'; return; }
    if (!r.data || !r.data.length) { document.getElementById('log-entries').innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div>No events fired yet.</div>'; return; }
    document.getElementById('log-entries').innerHTML = r.data.map(function(log) {
        var fx = (log.effects_applied || []).map(function(e) { return e.stat + ': ' + (e.change > 0 ? '+' : '') + e.change + ' (' + e.target + ')'; }).join(' · ');
        return '<div class="log-entry"><div class="log-entry-header"><div class="log-entry-name">' + escapeHtml(log.event_name) + ' <span class="tag tag-category" style="margin-left:8px;">' + (log.category || '') + '</span></div><div class="log-entry-tick">' + (log.nations ? log.nations.name : '?') + ' · Tick ' + log.fired_at_tick + '</div></div><div class="log-entry-desc">' + escapeHtml(log.description_used || '') + '</div>' + (fx ? '<div class="log-entry-effects">Effects: ' + fx + '</div>' : '') + '</div>';
    }).join('');
}

function cancelEditor() { renderListView(); }




// Expose functions for HTML onclick/onchange handlers
window.viewRecentLog = viewRecentLog;
window.createNewEvent = createNewEvent;
window.applyFilters = applyFilters;
window.editEvent = editEvent;
window.cancelEditor = cancelEditor;
window.deleteEvent = deleteEvent;
window.switchEventType = switchEventType;
window.addDescription = addDescription;
window.addTrigger = addTrigger;
window.addEffect = addEffect;
window.copyPlaceholder = copyPlaceholder;
window.removeDescription = removeDescription;
window.removeTrigger = removeTrigger;
window.removeEffect = removeEffect;
window.saveEvent = saveEvent;
</script>
