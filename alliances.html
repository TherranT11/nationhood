<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strategic Alliances | Nationhood Alpha</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/corp-topbar.css">
<link rel="stylesheet" href="css/corp-light-theme.css">
<style>
:root {
  --bg-0: #0e0e0c;
  --bg-1: #1a1a1a;
  --bg-2: #1a1a17;
  --bg-3: #252525;
  --bg-4: #24241f;
  --bg-5: #2c2c26;
  --bg-hover: #282822;
  --text-bright: #f0efe6;
  --text-primary: #c4c2b8;
  --text-secondary: #888;
  --text-muted: #666;
  --text-dim: #4a4940;
  --text-ghost: #333229;
  --border-hair: rgba(255,255,255,0.04);
  --border-0: rgba(255,255,255,0.06);
  --border-1: rgba(255,255,255,0.08);
  --border-2: rgba(255,255,255,0.12);
  --green: #5cb85c;
  --green-faint: rgba(92,184,92,0.08);
  --green-border: rgba(92,184,92,0.18);
  --red: #d9534f;
  --amber: #c8a64e;
  --amber-faint: rgba(200,166,78,0.08);
  --amber-border: rgba(200,166,78,0.18);
  --blue: #5b9bd5;
  --blue-faint: rgba(91,155,213,0.08);
  --blue-border: rgba(91,155,213,0.18);
  --teal: #5aafa5;
  --teal-faint: rgba(90,175,165,0.08);
  --teal-border: rgba(90,175,165,0.18);
  --gold: #c8a832;
  --font-mono: 'JetBrains Mono', monospace;
  --font-ui: 'IBM Plex Sans', -apple-system, sans-serif;
  --font-serif: 'IBM Plex Serif', Georgia, serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg-0); color: var(--text-primary); font-family: var(--font-ui); min-height: 100vh; }
.loading-msg { padding: 40px; text-align: center; font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }

.alliances-shell { max-width: 1200px; margin: 0 auto; padding: 48px 32px; }

/* ── List view (landing) ── */
.al-page-head {
    display: flex; justify-content: space-between; align-items: flex-end; gap: 32px;
}
.al-page-eyebrow {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em;
    color: var(--amber); text-transform: uppercase;
}
.al-page-context {
    margin-top: 6px;
    font-family: var(--font-serif); font-size: 22px; color: var(--text-bright);
}
.al-page-stats { display: flex; gap: 36px; align-items: flex-end; }
.al-stat__label {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.14em;
    color: var(--text-dim); text-transform: uppercase;
}
.al-stat__value {
    margin-top: 2px;
    font-family: var(--font-mono); font-size: 22px; font-weight: 700;
    color: var(--amber); letter-spacing: 0.02em;
}
.al-rule { margin-top: 20px; height: 1px; background: var(--border-0); }

/* 3-column stat grid for the expanded alliance card. Wraps cleanly
   with 5 stats (3 on top, 2 on bottom). */
.al-stat-grid {
    margin-top: 14px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}
@media (max-width: 720px) {
    .al-stat-grid { grid-template-columns: repeat(2, 1fr); }
}

.al-controls {
    margin-top: 20px;
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
}
.al-filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.al-filter-label {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em;
    color: var(--text-dim); text-transform: uppercase; margin-right: 8px;
}
.al-filter-pill {
    font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
    padding: 6px 12px; cursor: pointer;
    background: transparent; color: var(--text-dim);
    border: 1px solid var(--border-1);
    transition: all 0.1s;
}
.al-filter-pill:hover { color: var(--text-primary); border-color: var(--text-dim); }
.al-filter-pill.active {
    color: var(--amber); border-color: var(--amber); background: var(--amber-faint);
}

.al-found-btn {
    font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    padding: 9px 18px; cursor: pointer;
    background: var(--amber-faint); color: var(--amber);
    border: 1px solid var(--amber-border);
    transition: all 0.12s;
}
.al-found-btn:hover { background: var(--amber); color: #000; }

.al-section { margin-top: 32px; }
.al-section__title {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em;
    color: var(--text-dim); text-transform: uppercase; margin-bottom: 12px;
}
.al-empty {
    padding: 28px 24px;
    border: 1px dashed var(--border-1); background: transparent;
    text-align: center;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em;
    color: var(--text-dim); text-transform: uppercase;
}

/* Alliance row (collapsed + expanded shells — kept ready for when
   real alliance rows arrive; today the arrays are empty so these
   classes don't render but stay in CSS so the renderer is plug-in). */
.al-row {
    background: var(--bg-2); border: 1px solid var(--border-0);
    border-left: 3px solid var(--amber);
    margin-bottom: 12px;
}
.al-row__head {
    padding: 14px 16px; display: flex; align-items: center; gap: 12px;
    cursor: pointer;
}
.al-row__chevron {
    font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); width: 12px;
}
.al-row__name {
    font-family: var(--font-serif); font-size: 16px; font-weight: 600; color: var(--text-bright);
    /* Cap the name so a long charter title can't push the right-rail
       metrics off the row. flex-min-width:0 lets the cell actually
       shrink instead of holding the natural text width. */
    flex: 0 1 auto; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.al-row__tags { display: flex; gap: 4px; flex-wrap: wrap; }
.al-row__tag {
    font-family: var(--font-mono); font-size: 8px; font-weight: 700; letter-spacing: 0.08em;
    padding: 3px 7px; text-transform: uppercase;
    border: 1px solid var(--border-2); color: var(--text-dim);
}
.al-row__tag--cooperative  { color: var(--green); border-color: var(--green-border); background: var(--green-faint); }
.al-row__tag--coordinating { color: var(--blue);  border-color: var(--blue-border);  background: var(--blue-faint); }
.al-row__tag--cartel       { color: var(--red);   border-color: rgba(217,83,79,0.3); background: rgba(217,83,79,0.08); }
.al-row__metrics {
    margin-left: auto; display: flex; gap: 24px; align-items: baseline;
}
.al-row__metric { text-align: right; }
.al-row__metric-label {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.12em;
    color: var(--text-dim); text-transform: uppercase;
}
.al-row__metric-value {
    margin-top: 2px;
    font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--text-primary);
}
.al-row__sub {
    padding: 0 16px 12px 40px;
    font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); letter-spacing: 0.04em;
}
.al-row__expanded { padding: 0 16px 16px 40px; }

.al-actions {
    margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap;
    padding-top: 14px; border-top: 1px solid var(--border-0);
}
.al-actions .spacer { flex: 1 1 auto; }
.al-btn {
    font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; padding: 9px 16px; cursor: pointer;
    background: transparent; border: 1px solid var(--border-1); color: var(--text-primary);
    transition: all 0.1s;
}
.al-btn:hover:not(:disabled) { border-color: var(--text-bright); color: var(--text-bright); }
.al-btn:disabled { cursor: not-allowed; opacity: 0.45; }
.al-btn--primary { color: var(--amber); border-color: var(--amber-border); background: var(--amber-faint); }
.al-btn--leave   { color: var(--red);   border-color: rgba(217,83,79,0.3); background: rgba(217,83,79,0.04); }

/* ── Negotiation view ── */
.ng-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; margin-top: 16px; }
.ng-head__title { font-family: var(--font-serif); font-size: 28px; font-weight: 600; color: var(--text-bright); letter-spacing: -0.01em; }
.ng-head__sub { margin-top: 8px; display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }
.ng-head__metrics { display: flex; gap: 36px; align-items: flex-end; }
.ng-head__metric { text-align: right; }

.ng-grid { margin-top: 24px; display: grid; grid-template-columns: 320px 1fr; gap: 24px; align-items: start; }
@media (max-width: 1000px) { .ng-grid { grid-template-columns: 1fr; } }
.ng-left { display: flex; flex-direction: column; gap: 0; }

.ng-member {
    background: var(--bg-2); border: 1px solid var(--border-0);
    border-left: 3px solid var(--border-1);
    margin-bottom: 8px;
}
.ng-member__top { display: flex; gap: 10px; padding: 10px 12px; align-items: center; }
.ng-member__body { flex: 1 1 auto; min-width: 0; }
.ng-member__footer {
    display: flex; justify-content: space-between; align-items: center;
    padding: 7px 12px; border-top: 1px solid var(--border-0);
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase;
}
.ng-member__status { color: var(--text-dim); }
.ng-member__vote   { color: var(--text-primary); }

.ng-tally { margin-top: 18px; padding: 14px; background: var(--bg-2); border: 1px solid var(--border-0); }
.ng-tally__row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.ng-tally__label { flex: 0 0 130px; font-family: var(--font-mono); font-size: 10px; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ng-tally__bar   { flex: 1 1 auto; height: 4px; background: var(--bg-4); }
.ng-tally__fill  { height: 100%; transition: width 0.15s; }
.ng-tally__count { flex: 0 0 28px; text-align: right; font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--text-bright); }
.ng-tally__footer { margin-top: 12px; font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); letter-spacing: 0.04em; }

.ng-right { display: flex; flex-direction: column; gap: 0; }
.ng-articles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
@media (max-width: 720px) { .ng-articles { grid-template-columns: 1fr; } }
.ng-article {
    background: var(--bg-2); border: 1px solid var(--border-0);
    padding: 14px; cursor: pointer; transition: border-color 0.1s, background 0.1s;
}
.ng-article:hover { border-color: var(--text-dim); }
.ng-article.selected { border-color: var(--amber); background: rgba(200,166,78,0.06); }
.ng-article__head { display: flex; align-items: baseline; gap: 8px; }
.ng-article__radio { color: var(--amber); font-size: 14px; line-height: 1; flex: 0 0 auto; }
.ng-article__name  { flex: 1 1 auto; font-size: 14px; font-weight: 700; color: var(--text-bright); }
.ng-article__weight { font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); letter-spacing: 0.06em; text-transform: uppercase; }
.ng-article__body  { margin-top: 8px; font-size: 12px; color: var(--text-secondary); line-height: 1.45; }
.ng-article__meta  {
    margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border-0);
    display: flex; gap: 16px;
    font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); letter-spacing: 0.06em;
}
.ng-article__meta b { color: var(--text-primary); font-weight: 700; }
.ng-article__voters {
    margin-top: 8px; display: flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); letter-spacing: 0.06em;
}

.ng-your-vote {
    margin-top: 12px; padding: 12px 14px;
    background: var(--bg-2); border: 1px solid var(--border-0);
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
}
.ng-your-vote__value { margin-top: 2px; font-size: 14px; font-weight: 700; color: var(--green); }

.ng-chat { margin-top: 18px; background: var(--bg-2); border: 1px solid var(--border-0); display: flex; flex-direction: column; }
.ng-chat__head { padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-0); }
.ng-chat__scroll { padding: 12px 14px; max-height: 360px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.ng-chat__msg-head { display: flex; align-items: baseline; gap: 8px; }
.ng-chat__msg-author { font-size: 12px; font-weight: 700; color: var(--amber); }
.ng-chat__msg-ago    { margin-left: auto; font-family: var(--font-mono); font-size: 9px; color: var(--text-dim); }
.ng-chat__msg-body   { margin-top: 4px; font-size: 13px; color: var(--text-primary); line-height: 1.5; }
.ng-chat__compose { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--border-0); }
.ng-chat__compose .fnd-input { flex: 1 1 auto; }

/* Confirm modal (apply to open alliance) */
.al-modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: none; align-items: center; justify-content: center;
    z-index: 9700;
}
.al-modal-overlay.open { display: flex; }
.al-modal {
    width: 460px; max-width: calc(100vw - 32px);
    background: var(--bg-2); border: 1px solid var(--border-2);
    padding: 24px;
}
.al-modal__title {
    font-family: var(--font-serif); font-size: 20px; color: var(--text-bright); font-weight: 600;
}
.al-modal__body {
    margin-top: 12px; font-size: 13px; color: var(--text-secondary); line-height: 1.5;
}
.al-modal__actions {
    margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;
}

/* Aligned Interest vote modal — wider 2-column layout (vote left, chat right). */
.al-aiv-modal {
    width: 920px; max-width: calc(100vw - 24px);
    max-height: 88vh;
    background: var(--bg-2); border: 1px solid var(--border-2);
    display: flex; flex-direction: column; overflow: hidden;
}
.al-aiv-header {
    padding: 14px 18px; border-bottom: 1px solid var(--border-main, rgba(255,255,255,0.06));
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.al-aiv-title {
    font-family: var(--font-serif); font-size: 18px; color: var(--text-bright); font-weight: 600;
}
.al-aiv-subtitle {
    font-family: var(--font-mono); font-size: 10px; color: var(--text-dim);
    letter-spacing: 0.1em; text-transform: uppercase;
}
.al-aiv-body {
    display: flex; flex: 1; min-height: 0; overflow: hidden;
}
.al-aiv-vote-pane {
    flex: 1; padding: 16px 20px; overflow-y: auto;
    border-right: 1px solid var(--border-main, rgba(255,255,255,0.06));
    min-width: 0;
}
.al-aiv-chat-pane {
    width: 320px; flex-shrink: 0; display: flex; flex-direction: column; min-width: 0;
}
.al-aiv-chat-head {
    padding: 10px 14px; font-family: var(--font-mono); font-size: 9px;
    letter-spacing: 0.18em; color: var(--text-dim); text-transform: uppercase;
    border-bottom: 1px solid var(--border-main, rgba(255,255,255,0.06));
}
.al-aiv-chat-list {
    flex: 1; overflow-y: auto; padding: 10px 12px;
    display: flex; flex-direction: column; gap: 8px; min-height: 0;
}
.al-aiv-chat-msg {
    font-size: 12px; line-height: 1.45; color: var(--text-primary);
}
.al-aiv-chat-msg__head {
    font-family: var(--font-mono); font-size: 9px; color: var(--text-dim);
    letter-spacing: 0.06em; margin-bottom: 2px;
}
.al-aiv-chat-msg--observer .al-aiv-chat-msg__body { color: #6a6660; font-style: italic; }
.al-aiv-chat-msg--system   .al-aiv-chat-msg__body {
    color: var(--amber); font-family: var(--font-mono); font-size: 11px;
}
.al-aiv-chat-tag {
    display: inline-block; font-family: var(--font-mono); font-size: 8px;
    letter-spacing: 0.08em; padding: 0 4px; border: 1px solid #6a6660;
    color: #6a6660; margin-left: 4px; vertical-align: middle;
}
.al-aiv-chat-input {
    padding: 10px 12px; border-top: 1px solid var(--border-main, rgba(255,255,255,0.06));
    display: flex; gap: 6px;
}
.al-aiv-chat-input input {
    flex: 1; padding: 7px 10px; background: var(--bg-1); color: var(--text-bright);
    border: 1px solid var(--border-main, rgba(255,255,255,0.06)); font-size: 12px; outline: none;
}
.al-aiv-chat-input button {
    padding: 7px 12px; background: var(--amber); color: #000; border: none; cursor: pointer;
    font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
}
.al-aiv-chat-input button:disabled { opacity: 0.5; cursor: not-allowed; }
.al-aiv-section-label {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.18em;
    color: var(--text-dim); text-transform: uppercase; margin: 14px 0 6px;
}
.al-aiv-radios { display: flex; flex-wrap: wrap; gap: 6px; }
.al-aiv-radio {
    cursor: pointer; padding: 8px 12px; border: 1px solid var(--border-main, rgba(255,255,255,0.1));
    background: var(--bg-1); color: var(--text-secondary);
    font-family: var(--font-mono); font-size: 11px; min-width: 56px; text-align: center;
    transition: all 0.15s;
}
.al-aiv-radio:hover { border-color: var(--amber); color: var(--text-bright); }
.al-aiv-radio.selected { border-color: var(--amber); background: rgba(200,168,50,0.12); color: var(--amber); }
.al-aiv-radio.disabled { opacity: 0.4; cursor: not-allowed; }
.al-aiv-tally {
    margin-top: 14px; padding: 10px 12px; background: var(--bg-1);
    border: 1px solid var(--border-main, rgba(255,255,255,0.06));
    font-family: var(--font-mono); font-size: 11px; line-height: 1.6;
}
.al-aiv-actions {
    margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
}
.al-aiv-actions button {
    padding: 8px 14px; font-family: var(--font-mono); font-size: 10px; font-weight: 700;
    letter-spacing: 0.06em; cursor: pointer; transition: all 0.15s;
}
.al-aiv-actions button:disabled { opacity: 0.4; cursor: not-allowed; }
.al-aiv-actions .btn-submit {
    background: var(--amber); color: #000; border: 1px solid var(--amber);
}
.al-aiv-actions .btn-withdraw {
    background: transparent; color: #c55; border: 1px solid #c55;
}
.al-aiv-actions .btn-close {
    background: transparent; color: var(--text-dim); border: 1px solid var(--border-main, rgba(255,255,255,0.06));
}
.al-aiv-status {
    padding: 8px 12px; margin-bottom: 12px; border-radius: 2px;
    font-family: var(--font-mono); font-size: 11px; line-height: 1.45;
}
.al-aiv-status--info  { background: rgba(90,175,165,0.08);  border-left: 2px solid var(--accent, #5aafa5); color: var(--text-secondary); }
.al-aiv-status--warn  { background: rgba(200,150,50,0.08); border-left: 2px solid var(--amber); color: var(--text-secondary); }
.al-aiv-status--error { background: rgba(200,80,80,0.08);  border-left: 2px solid #c55; color: #c55; }
@media (max-width: 720px) {
    .al-aiv-modal { width: 100%; max-width: 100%; max-height: 100vh; border: none; }
    .al-aiv-body { flex-direction: column; overflow-y: auto; }
    .al-aiv-vote-pane { border-right: none; border-bottom: 1px solid var(--border-main, rgba(255,255,255,0.06)); }
    .al-aiv-chat-pane { width: 100%; max-height: 38vh; }
}

/* ── Found-alliance form ── */
.fnd-crumb {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-dim);
}
.fnd-crumb__link {
    color: var(--text-dim); text-decoration: none; cursor: pointer;
}
.fnd-crumb__link:hover { color: var(--text-primary); }
.fnd-crumb__sep { margin: 0 8px; color: var(--text-ghost); }
.fnd-crumb__current { color: var(--amber); }

.fnd-h1 {
    margin-top: 16px;
    font-family: var(--font-serif); font-size: 28px; font-weight: 600;
    color: var(--text-bright); letter-spacing: -0.01em;
}
.fnd-lede {
    margin-top: 8px; max-width: 720px;
    font-size: 14px; line-height: 1.5; color: var(--text-secondary);
}
.fnd-lede__highlight { color: var(--amber); }
.fnd-rule { margin-top: 28px; height: 1px; background: var(--border-0); }

.fnd-step { margin-top: 32px; }
.fnd-step__head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.fnd-step__num {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em;
    color: var(--text-dim); text-transform: uppercase;
}

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { computeCorpValuationBreakdown } from './js/game/corp-valuation.js';

// ── Constants ──

// User-facing sector label. The DB names a few sectors differently from

const SECTORS = ['Finance', 'Construction', 'Shipping', 'Airline'];

// Filter pill order for the landing view. 'all' is the default. Once

const FILTER_ORDER = ['all', ...SECTORS];
const FILTER_LABEL = {

    Finance: 'BANKING',
    Construction: 'CONSTRUCTION',
    Shipping: 'SHIPPING',

};

// Charter article relationship taxonomy. Each tag color-codes the
// article in the expanded membership card per the design.
const ARTICLE_TAG_CLASS = {

// Founding-negotiation rules.
const NEGOTIATION_DURATION_TICKS = 6;            // alliance dissolves after this many ticks without consensus
const FAILED_NEGOTIATION_REPUTATION_HIT = -1;    // applied to every member if dissolution fires

// ─── Per-sector charter articles ──────────────────────────────────
// Single source of truth for the four candidate articles a founding
// negotiation surfaces. Keyed by canonical DB sector value (Finance,
// Construction, Shipping, Airline) — the negotiation view pulls
// SECTOR_ARTICLES[n.sector] to render the candidate cards.
//
// Banking + Shipping article sets are placeholders until the design
// pass for those sectors lands. Empty arrays render the "no candidate
// articles defined" state cleanly so a Banking founding negotiation
// doesn't accidentally fall through to Construction copy.
const SECTOR_ARTICLES = {
    Construction: [
        { id: 'buyer_first', name: 'Buyer First Supply Chain', kind: 'coordinating',
          body: 'First refusal on member surplus at preferred prices. +1.5 Supply Chain when sourcing from members.',
          cartel: 0.1, chs: 0.5 },
        { id: 'joint_crews', name: 'Joint Crews', kind: 'cooperative',
          body: 'Use partner crews on cross-border projects at ~30% lower cost. Bid on foreign projects.',
          cartel: 0.0, chs: 0.4 },
        { id: 'safety', name: 'Safety & Standards Firm', kind: 'coordinating',
          body: '+1 Regulatory Standing in shared nations. Joint liability for safety failures.',
          cartel: 0.2, chs: 0.4 },
        { id: 'megaproject', name: 'Megaproject Syndicate', kind: 'coordinating',

        { id: 'codeshare', name: 'Codeshare Compact', kind: 'cooperative',

        { id: 'fleet_proc', name: 'Fleet Procurement Bloc', kind: 'coordinating',
          body: 'Pool aircraft orders for volume discounts. −15% on aircraft purchase price; standardized fleet types let members swap crews and parts in emergencies. Must order from the alliance-approved manufacturer list; a grounded type grounds everyone.',

    Finance: [
        { id: 'aligned_interest', name: 'Aligned Interest', kind: 'cartel',
          body: 'Members agree on a band of acceptable interest rates for commercial lending — a ceiling and a floor. Loans extended at rates outside the agreed band trigger −2 Cohesion for the alliance and −1 Reputation for the corporation that violated. Inside the band: protected margins and no race to the bottom on rates. Antitrust regulators in member nations notice if the band is set too tight.',
          cartel: 0.2, chs: 0.5 },
        { id: 'joint_equity', name: 'Joint Equity Ventures', kind: 'cooperative',

          cartel: 0.0, chs: 0.5 },
        { id: 'drydock', name: 'Drydock Cooperative', kind: 'coordinating',
          body: 'Members share drydocks, maintenance crews, and standardized parts inventory. −25% per-tick vessel maintenance cost. Vessel depreciation slowed from 5%/yr → 3.5%/yr while in the cooperative. Refit cycles complete in 1 tick instead of 2. Vessels must conform to alliance-approved class types — exotic hulls are excluded; drydock queue is shared, so urgent repairs wait when a partner is mid-refit.',
          cartel: 0.1, chs: 0.4 },
        { id: 'tonnage_cartel', name: 'Tonnage Cartel', kind: 'cartel',
          body: 'Members fix minimum freight rates on routes any two members operate. Freight rates on contested routes (≥2 alliance members on the same lane) lock at +20% over market base rate. +0.3 Cartel score per active member and +0.05 Cartel/tick per contested route. At alliance Antitrust Heat ≥ 7.0 / 10, every member rolls a 5%/tick chance to have their port-call licenses suspended in any participating nation — suspension grounds operations there until the alliance dissolves the article.',
          cartel: 0.3, chs: 0.6 },
    ],
};

function articlesForSector(sector) {
    return SECTOR_ARTICLES[sector] || [];
}

// Per-sector hero-stat column lookup. The first stat tuple in
// HERO_STATS doubles as the "primary" one shown on member cards in
// the negotiation view (Banking → Lending, Construction → Crews, etc).
function primaryHeroStat(sector) {
    const def = (HERO_STATS[sector] || [])[0];
    return def ? { label: def[0], col: def[1] } : { label: '—', col: null };
}

// ── State ──
let faction = null;
let shard = null;
let allUserFactions = [];
// View state. 'list' = landing, 'found' = multi-step charter form,
// 'negotiation' = live founding negotiation drill-in. Ephemeral —
// survives only while the page is mounted.
let _view = 'list';
let _negotiationId = null;             // active negotiation when _view === 'negotiation'
let _negotiationDraftVote = null;      // local-only override; cleared on view change
let _pendingNegotiations = [];   // hydrated by loadAlliancesData
let _alliancesLoading = false;   // guards parallel re-fetches
let _allianceActionInflight = false; // single-shot lock across vote / ratify / withdraw
// Form state. Held in JS so re-renders preserve user input. Per the
// design call-out: "build with state for later" so when the RPC ships
// the form values plug straight in.
let _form = {
    name: '',
    selectedInviteeIds: new Set(),
    mission: '',
};
let _candidates = [];   // candidate corps (same sector, not me, not abandoned)
// Landing-view state. Empty until the alliance backend lands; the
// renderers below already handle the populated case so plugging real
// data in later is a one-line swap.
let _myAlliances = [];      // alliances this corp is a member of
let _openAlliances = [];    // alliances accepting applications
let _otherAlliances = [];   // all other active alliances (read-only visibility)
let _sectorFilter = 'all';  // 'all' | 'Finance' | 'Construction' | 'Shipping' | 'Airline'
let _expandedAllianceIds = new Set();
let _confirmContext = null; // { allianceName, onConfirm } for the apply dialog

// ── Helpers ──
function escHtml(s) {
    if (s == null) return '';
    const d = document.createElement('div');
    d.textContent = String(s);
    return d.innerHTML;
}
function fmtMoney(n) {
    if (n == null || !Number.isFinite(n)) return '—';
    const abs = Math.abs(n);
    const sign = n < 0 ? '-' : '';
    if (abs >= 1e9) return sign + '$' + (abs / 1e9).toFixed(2) + 'B';
    if (abs >= 1e6) return sign + '$' + (abs / 1e6).toFixed(1) + 'M';
    if (abs >= 1e3) return sign + '$' + Math.round(abs / 1e3) + 'k';
    return sign + '$' + abs;
}
function fmtStat(v) {
    if (v == null) return '—';
    const n = Number(v);
    if (!Number.isFinite(n)) return '—';
    return n.toFixed(n < 10 ? 1 : 0);
}
function corpInitials(c) {
    const t = (c.corp_ticker || c.abbreviation || c.faction_name || '').toString();
    return t.replace(/[^A-Z0-9]/gi, '').slice(0, 3).toUpperCase() || '—';
}

// ── Init ──
async function init() {
    const { data: { user } } = await _supabase.auth.getUser();
    if (!user) { window.location.href = 'login.html'; return; }

    const urlFactionId = new URLSearchParams(location.search).get('faction_id');
    if (urlFactionId) {
        const { data: inspected } = await _supabase.from('factions').select('*').eq('id', urlFactionId).single();
        if (inspected?.faction_type === 'corporation') faction = inspected;
    }
    if (!faction) {
        const { data: allFactions } = await _supabase.from('factions')
            .select('*').or(`id.eq.${user.id},linked_user_id.eq.${user.id}`);
        allUserFactions = (allFactions || []).filter(f => f.nation_id);
        const activeFactionId = sessionStorage.getItem('active_faction_id');
        faction = allUserFactions.find(f => f.id === activeFactionId)
            || allUserFactions.find(f => f.faction_type === 'corporation')
            || allUserFactions[0];
        if (!faction) { await _supabase.auth.signOut(); window.location.href = 'login.html'; return; }
        if (faction.faction_type !== 'corporation') { window.location.href = 'dashboard.html'; return; }
    }

    const { data: shardData } = await _supabase.from('shard')
        .select('current_tick, current_date, next_tick_at, tick_interval_hours')
        .eq('name', 'Alpha Shard').single();
    shard = shardData;

    const topBar = document.getElementById('corp-topbar-container');
    if (topBar) {
        const { renderCorpTopBar } = await import('./js/corp-topbar.js');
        renderCorpTopBar(topBar, { faction, shard, activeTab: 'alliances', allUserFactions });
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('page-content').style.display = 'block';

    renderShell();
    // Hydrate from the alliance backend in the background. The first
    // paint shows empty-state copy ("You're not in any."), then the
    // landing re-renders once data arrives.
    loadAlliancesData().then(() => renderShell());
}

// ── Backend hydrator ─────────────────────────────────────────────
// Pulls every alliance the current corp is a member of (negotiating
// or active), reshapes it into the data model the existing renderers
// expect, and flips the empty-state copy off. Called on init and
// after every mutating RPC.
async function loadAlliancesData() {
    if (!faction?.id) { _myAlliances = []; _pendingNegotiations = []; _otherAlliances = []; return; }
    if (_alliancesLoading) return;
    _alliancesLoading = true;
    try {
        // 1. Alliances I'm an active member of.
        const { data: memberships, error: memErr } = await _supabase
            .from('alliance_members')
            .select('alliance_id, role, joined_at_tick, strategic_alliances(*)')
            .eq('faction_id', faction.id)
            .is('left_at_tick', null);
        if (memErr) {
            console.warn('[alliances] memberships fetch failed:', memErr.message);
            _myAlliances = []; _pendingNegotiations = []; _otherAlliances = [];
            return;
        }
        const myRows = (memberships || [])
            .map(m => m.strategic_alliances)
            .filter(a => a && a.status !== 'dissolved');
        const myIds = myRows.map(a => a.id);

        // 2. All OTHER active alliances — read-only visibility section.
        // Excludes the user's own (already in myRows). Negotiating ones
        // are private until ratified; only 'active' alliances surface
        // here.
        let othersQuery = _supabase.from('strategic_alliances')
            .select('*').eq('status', 'active');
        if (myIds.length > 0) {
            othersQuery = othersQuery.not('id', 'in', `(${myIds.join(',')})`);
        }
        const { data: otherRowsRaw, error: othersErr } = await othersQuery;
        if (othersErr) console.warn('[alliances] others fetch failed:', othersErr.message);
        const otherRows = otherRowsRaw || [];

        const allRows = [...myRows, ...otherRows];
        if (allRows.length === 0) {
            _myAlliances = []; _pendingNegotiations = []; _otherAlliances = [];
            return;
        }
        const ids = allRows.map(a => a.id);

        // 2. Members + their factions + nations + votes + chat + articles.
        // Members + articles use the full id list (public surfaces — the
        // "All Strategic Alliances" section displays both for non-member
        // alliances). Votes + chat are member-only displays — scope them
        // to myIds so we don't fetch (and so RLS can't be a surprise on)
        // data we never render.
        const [membersRes, votesRes, chatRes, articlesRes] = await Promise.all([
            _supabase.from('alliance_members')
                .select('alliance_id, faction_id, role, joined_at_tick, left_at_tick')
                .in('alliance_id', ids).is('left_at_tick', null),
            myIds.length === 0
                ? Promise.resolve({ data: [], error: null })
                : _supabase.from('alliance_negotiation_votes')
                    .select('alliance_id, faction_id, article_id, voted_at_tick')
                    .in('alliance_id', myIds),
            myIds.length === 0
                ? Promise.resolve({ data: [], error: null })
                : _supabase.from('alliance_chat_messages')
                    .select('alliance_id, faction_id, body, sent_at_tick, created_at')
                    .in('alliance_id', myIds).order('created_at', { ascending: true }),
            _supabase.from('alliance_articles')
                .select('alliance_id, article_id, article_name, article_kind, article_body, cartel_score, chs_bonus, ratified_at_tick')
                .in('alliance_id', ids).eq('status', 'active'),
        ]);
        if (membersRes.error) console.warn('[alliances] members:', membersRes.error.message);
        if (votesRes.error)   console.warn('[alliances] votes:',   votesRes.error.message);
        if (chatRes.error)    console.warn('[alliances] chat:',    chatRes.error.message);
        if (articlesRes.error) console.warn('[alliances] articles:', articlesRes.error.message);

        const memberRows  = membersRes.data  || [];
        const voteRows    = votesRes.data    || [];
        const chatRows    = chatRes.data     || [];
        const articleRows = articlesRes.data || [];

        // 3. Hydrate factions + nations referenced by members + chat.
        const factionIds = Array.from(new Set([
            ...memberRows.map(r => r.faction_id),
            ...chatRows.map(r => r.faction_id),
        ]));
        // Pull every per-sector hero column we know about; the renderer
        // picks the right one per alliance.sector.
        const heroCols = Object.values(HERO_STATS).flat()
            .map(([, col]) => col).filter(Boolean);
        const baseCols = ['id', 'faction_name', 'corp_ticker', 'abbreviation',
                          'corp_sector', 'corp_reputation', 'leader_first_name',
                          'leader_last_name', 'nation_id',
                          'corp_cash_reserves', 'corp_debt'];
        const factionSelect = Array.from(new Set([...baseCols, ...heroCols])).join(', ');
        const factionsRes = factionIds.length === 0
            ? { data: [] }
            : await _supabase.from('factions').select(factionSelect).in('id', factionIds);
        if (factionsRes.error) console.warn('[alliances] factions:', factionsRes.error.message);
        const factionMap = new Map((factionsRes.data || []).map(f => [f.id, f]));

        // Batched corp_properties fetch for valuation. Single query
        // covers every member faction across every alliance — same
        // formula the corp dashboard uses for the masthead price
        // (cash + property − debt × 1.30 multiplier inside
        // computeCorpValuationBreakdown).
        const memberFactionIds = Array.from(new Set(memberRows.map(r => r.faction_id)));
        const propsRes = memberFactionIds.length === 0
            ? { data: [] }
            : await _supabase.from('corp_properties')
                .select('faction_id, purchase_price, condition, is_active')
                .in('faction_id', memberFactionIds)
                .eq('is_active', true);
        if (propsRes.error) console.warn('[alliances] properties:', propsRes.error.message);
        const propsByFaction = new Map();
        for (const p of (propsRes.data || [])) {
            if (!propsByFaction.has(p.faction_id)) propsByFaction.set(p.faction_id, []);
            propsByFaction.get(p.faction_id).push(p);
        }

        const nationIds = Array.from(new Set(
            (factionsRes.data || []).map(f => f.nation_id).filter(Boolean)
        ));
        const nationsRes = nationIds.length === 0
            ? { data: [] }
            : await _supabase.from('nations').select('id, name').in('id', nationIds);
        if (nationsRes.error) console.warn('[alliances] nations:', nationsRes.error.message);
        const nationMap = new Map((nationsRes.data || []).map(n => [n.id, n.name]));

        // 4. Bucket per-alliance.
        const tick = Number(shard?.current_tick) || 0;
        const myFactionId = faction.id;
        const myLinkedUserId = await _supabase.auth.getUser().then(r => r.data?.user?.id || null);
        const isMineFn = (fid) => {
            const f = factionMap.get(fid);
            if (!f) return false;
            return fid === myFactionId
                || (myLinkedUserId && (fid === myLinkedUserId));
        };

        const membersByAlliance = new Map();
        for (const m of memberRows) {
            if (!membersByAlliance.has(m.alliance_id)) membersByAlliance.set(m.alliance_id, []);
            membersByAlliance.get(m.alliance_id).push(m);
        }
        const votesByAlliance = new Map();
        for (const v of voteRows) {
            if (!votesByAlliance.has(v.alliance_id)) votesByAlliance.set(v.alliance_id, new Map());
            votesByAlliance.get(v.alliance_id).set(v.faction_id, v.article_id);
        }
        const chatByAlliance = new Map();
        for (const c of chatRows) {
            if (!chatByAlliance.has(c.alliance_id)) chatByAlliance.set(c.alliance_id, []);
            chatByAlliance.get(c.alliance_id).push(c);
        }
        const articlesByAlliance = new Map();
        for (const a of articleRows) {
            if (!articlesByAlliance.has(a.alliance_id)) articlesByAlliance.set(a.alliance_id, []);
            articlesByAlliance.get(a.alliance_id).push(a);
        }

        // 5. Build the negotiation + membership shapes the renderers expect.
        const buildMembers = (alliance) => {
            const hero = primaryHeroStat(alliance.sector);
            const voteMap = votesByAlliance.get(alliance.id) || new Map();
            const rows = membersByAlliance.get(alliance.id) || [];
            return rows.map(m => {
                const f = factionMap.get(m.faction_id) || {};
                const nation = f.nation_id ? nationMap.get(f.nation_id) : null;
                return {
                    id: m.faction_id,
                    faction_name: f.faction_name || 'Unnamed Corp',
                    corp_ticker: f.corp_ticker || f.abbreviation || '—',
                    abbreviation: f.abbreviation || '',
                    nation_name: nation || '—',
                    stat_label: hero.label,
                    stat_value: hero.col ? f[hero.col] : null,
                    vote: voteMap.get(m.faction_id) || null,
                    is_founder: m.role === 'founder',
                    is_you: isMineFn(m.faction_id),
                    rapport: m.role === 'founder' ? 'founder' : 'friendly',
                };
            });
        };

        const buildChat = (alliance) => {
            const rows = chatByAlliance.get(alliance.id) || [];
            return rows.map(c => {
                const f = factionMap.get(c.faction_id) || {};
                const isFounder = c.faction_id === alliance.founder_faction_id;
                const ago = Math.max(0, tick - (Number(c.sent_at_tick) || 0));
                return {
                    author: f.faction_name || 'Unnamed',
                    is_founder: isFounder,
                    ago: ago === 0 ? 'just now' : (ago + ' tick' + (ago === 1 ? '' : 's') + ' ago'),
                    body: c.body,
                };
            });
        };

        const negotiations = [];
        const actives = [];
        for (const a of myRows) {
            const sectorArticles = articlesForSector(a.sector);
            const ratifiedArticles = articlesByAlliance.get(a.id) || [];
            const members = buildMembers(a);

            if (a.status === 'negotiating') {
                negotiations.push({
                    id: a.id,
                    name: a.name,
                    sector: a.sector,
                    founder_faction_id: a.founder_faction_id,
                    ticks_remaining: NEGOTIATION_DURATION_TICKS - (tick - (Number(a.proposed_at_tick) || 0)),
                    members,
                    articles: sectorArticles,
                    chat: buildChat(a),
                });
            } else if (a.status === 'active') {
                const founderMember = members.find(m => m.is_founder);
                const founderFaction = founderMember ? factionMap.get(founderMember.id) : null;
                const founderName = founderFaction
                    ? `${founderFaction.leader_first_name || ''} ${founderFaction.leader_last_name || ''}`.trim()
                    : '—';
                const founderNation = founderFaction
                    ? (founderFaction.nation_id ? nationMap.get(founderFaction.nation_id) : null)
                    : null;
                const nationCount = new Set(
                    members.map(m => factionMap.get(m.id)?.nation_id).filter(Boolean)
                ).size;
                const cartelTotal = ratifiedArticles.reduce((s, ar) => s + (Number(ar.cartel_score) || 0), 0);
                // Aligned Interest band — populated server-side when the
                // article ratifies. Surfaced on the row head's RATE FLOOR
                // metric and explicitly in the expanded card.
                const hasAlignedInterest = ratifiedArticles.some(ar => ar.article_id === 'aligned_interest');
                const aiFloor   = hasAlignedInterest ? a.aligned_interest_floor_apr   : null;
                const aiCeiling = hasAlignedInterest ? a.aligned_interest_ceiling_apr : null;
                const hasBadDebtAid = ratifiedArticles.some(ar => ar.article_id === 'bad_debt_mutual');
                const hasSyndicatedLending = ratifiedArticles.some(ar => ar.article_id === 'syndicated_portfolio');
                const hasJointEquity       = ratifiedArticles.some(ar => ar.article_id === 'joint_equity');
                actives.push({
                    id: a.id,
                    name: a.name,
                    sector: a.sector,
                    tags: [SECTOR_LABEL[a.sector] || a.sector, 'MEMBER'],
                    dues: '—',
                    rate_floor: (aiFloor != null) ? `${Number(aiFloor).toFixed(1)}%` : '—',
                    aligned_interest_band: (aiFloor != null && aiCeiling != null)
                        ? `${Number(aiFloor).toFixed(1)}% – ${Number(aiCeiling).toFixed(1)}%`
                        : null,
                    // Vote-on-Interest-Rate gate: button surfaces when
                    // the Aligned Interest article is ratified, even
                    // if the band hasn't been set yet.
                    has_aligned_interest: hasAlignedInterest,
                    bad_debt_aid_active: hasBadDebtAid,
                    syndicated_lending_active: hasSyndicatedLending,
                    joint_equity_active: hasJointEquity,
                    member_count: members.length,
                    nation_count: nationCount,
                    founded_year: a.founded_at_tick ?? '—',
                    cartel_score: Number(cartelTotal.toFixed(1)),
                    heat: Number((Number(a.antitrust_heat) || 0).toFixed(1)),
                    cohesion: Number((Number(a.cohesion) || 0).toFixed(1)),
                    founded_date: a.founded_at_tick != null ? `Tick ${a.founded_at_tick}` : '—',
                    hq: founderNation || '—',
                    chair: founderName || '—',
                    mission: a.mission || '',
                    members,
                    articles: ratifiedArticles.map(ar => ({
                        name: ar.article_name, kind: ar.article_kind, body: ar.article_body || '',
                    })),
                    represented_nations: Array.from(new Set(
                        members.map(m => factionMap.get(m.id)?.nation_id).filter(Boolean)
                    )).map(nid => ({ name: nationMap.get(nid) || '—', count: members.filter(m => factionMap.get(m.id)?.nation_id === nid).length })),
                    last_amended: ratifiedArticles.length > 0
                        ? `Tick ${Math.max(...ratifiedArticles.map(ar => Number(ar.ratified_at_tick) || 0))}`
                        : null,
                });
            }
        }

        // Build _otherAlliances shapes (read-only visibility section).
        // Valuation is the sum of each member corp's masthead valuation,
        // computed from the same primitive (computeCorpValuationBreakdown)
        // the corp dashboard's ticker price uses.
        const others = [];
        for (const a of otherRows) {
            const ratifiedArticles = articlesByAlliance.get(a.id) || [];
            const members = buildMembers(a);
            const totalValuation = members.reduce((sum, m) => {
                const f = factionMap.get(m.id);
                if (!f) return sum;
                const breakdown = computeCorpValuationBreakdown({
                    cash: f.corp_cash_reserves,
                    loans: f.corp_debt,
                    properties: propsByFaction.get(f.id) || [],
                    vessels: [],
                    financeReceivables: [],
                    currentTick: tick,
                });
                return sum + breakdown.valuation;
            }, 0);
            const founderMember = members.find(m => m.is_founder);
            const founderFaction = founderMember ? factionMap.get(founderMember.id) : null;
            const founderNation = founderFaction
                ? (founderFaction.nation_id ? nationMap.get(founderFaction.nation_id) : null)
                : null;
            others.push({
                id: a.id,
                name: a.name,
                sector: a.sector,
                member_count: members.length,
                members,
                total_valuation: totalValuation,
                articles: ratifiedArticles
                    .slice()
                    .sort((p, q) => (Number(p.ratified_at_tick) || 0) - (Number(q.ratified_at_tick) || 0))
                    .map(ar => ({
                        name: ar.article_name, kind: ar.article_kind, body: ar.article_body || '',
                    })),
                founded_at_tick: a.founded_at_tick ?? null,
                hq: founderNation || '—',
                mission: a.mission || '',
            });
        }

        _pendingNegotiations = negotiations;
        _myAlliances = actives;
        _otherAlliances = others;
    } catch (e) {
        console.warn('[alliances] hydrate failed:', e?.message || e);
    } finally {
        _alliancesLoading = false;
    }
}

// ── Top-level render dispatch ──
function renderShell() {
    const shell = document.getElementById('alliances-shell');
    if (!shell) return;
    // If a negotiation drill-in is requested but the row is gone (mock
    // cleared, future "withdraw" path) snap back to the list before
    // we render — otherwise bindShellEvents would bind the negotiation
    // branch against list-view DOM and click handlers would no-op.
    if (_view === 'negotiation'
        && !(_pendingNegotiations || []).some(n => n.id === _negotiationId)) {
        _view = 'list';
        _negotiationId = null;
        _negotiationDraftVote = null;
    }
    if (_view === 'negotiation') shell.innerHTML = renderNegotiationView();
    else if (_view === 'found')  shell.innerHTML = renderFoundView();
    else                          shell.innerHTML = renderListView();
    bindShellEvents();
}

function openNegotiation(id) {
    const n = (_pendingNegotiations || []).find(x => x.id === id);
    if (!n) return;
    _view = 'negotiation';
    _negotiationId = id;
    _negotiationDraftVote = null;
    renderShell();
}
function closeNegotiation() {
    _view = 'list';
    _negotiationId = null;
    _negotiationDraftVote = null;
    renderShell();
}

function renderListView() {
    const sectorLabel = SECTOR_LABEL[faction?.corp_sector] || faction?.corp_sector || '—';
    const filterPills = FILTER_ORDER.map(f => {
        const cls = `al-filter-pill${f === _sectorFilter ? ' active' : ''}`;
        return `<button class="${cls}" data-filter="${escHtml(f)}">${escHtml(FILTER_LABEL[f] || f.toUpperCase())}</button>`;
    }).join('');

    return `
        <div class="al-page-head">
            <div>
                <div class="al-page-eyebrow">Strategic Alliances</div>
                <div class="al-page-context">${escHtml(faction?.faction_name || '—')} · ${escHtml(sectorLabel)}</div>
            </div>
            <div class="al-page-stats">
                <div><div class="al-stat__label">Your Alliances</div><div class="al-stat__value">${_myAlliances.length || 0}</div></div>
                <div><div class="al-stat__label">Influence</div><div class="al-stat__value">—</div></div>
                <div><div class="al-stat__label">Antitrust Heat</div><div class="al-stat__value">—</div></div>
            </div>
        </div>
        <div class="al-rule"></div>
        <div class="al-controls">
            <div class="al-filter-row">
                <span class="al-filter-label">Filter</span>
                ${filterPills}
            </div>
            <button class="al-found-btn" id="open-found-btn">+ FOUND NEW ALLIANCE</button>
        </div>
        ${renderMembershipsSection()}
        ${renderPendingNegotiationsSection()}
        ${renderOpenSection()}
        ${renderAllAlliancesSection()}
    `;
}

function renderPendingNegotiationsSection() {
    const rows = _pendingNegotiations || [];
    if (rows.length === 0) return ''; // hidden when empty
    return `
        <div class="al-section">
            <div class="al-section__title">Pending Negotiations &middot; ${rows.length}</div>
            ${rows.map(n => {
                const consensus = computeConsensusState(n);
                return `
                    <div class="al-row" data-pending-id="${escHtml(n.id)}" style="border-left-color:var(--blue);cursor:pointer;">
                        <div class="al-row__head">
                            <span class="al-row__chevron">&rsaquo;</span>
                            <span class="al-row__name">${escHtml(n.name)}</span>
                            <span class="al-row__tag" style="color:var(--blue);border-color:var(--blue-border);background:var(--blue-faint);">${escHtml(SECTOR_LABEL[n.sector] || n.sector)}</span>
                            <span class="al-row__tag">FOUNDING</span>
                            <div class="al-row__metrics">
                                <div class="al-row__metric">
                                    <div class="al-row__metric-label">Votes</div>
                                    <div class="al-row__metric-value">${consensus.submitted} of ${consensus.total}</div>
                                </div>
                                <div class="al-row__metric">
                                    <div class="al-row__metric-label">Closes In</div>
                                    <div class="al-row__metric-value">${n.ticks_remaining ?? '—'} ticks</div>
                                </div>
                            </div>
                        </div>
                        <div class="al-row__sub">
                            ${n.members.length} invited · ${consensus.label}
                        </div>
                    </div>
                `;
            }).join('')}
        </div>
    `;
}

// Consensus per the founding rules: every member must vote on the same
// article. Returns the labels driving header + ratify-button gating.
// Tolerates empty member rosters so a transient zero-member fetch can't
// crash the renderer.
function computeConsensusState(n) {
    const members = (n && n.members) || [];
    const total = members.length;
    const voted = members.filter(m => m.vote);
    const submitted = voted.length;
    if (total === 0) {
        return { submitted: 0, total: 0, reached: false, article_id: null,
                 label: 'No members invited.' };
    }
    if (submitted < total) {
        const remaining = total - submitted;
        return { submitted, total, reached: false, article_id: null,
                 label: `Awaiting ${remaining} more vote${remaining === 1 ? '' : 's'} before ratification.` };
    }
    const first = voted[0].vote;
    const unanimous = voted.every(m => m.vote === first);
    if (unanimous) {
        const art = (n.articles || []).find(a => a.id === first);
        return { submitted, total, reached: true, article_id: first,
                 label: `All members agreed on ${art ? art.name : first}. Ready to ratify.` };
    }
    return { submitted, total, reached: false, article_id: null,
             label: 'Members are split — alliance can only be founded once all vote for the same article.' };
}

function filterAlliancesBySector(rows) {
    if (_sectorFilter === 'all') return rows;
    return (rows || []).filter(a => a.sector === _sectorFilter);
}

function renderMembershipsSection() {
    const rows = filterAlliancesBySector(_myAlliances);
    return `
        <div class="al-section">
            <div class="al-section__title">Your Memberships</div>
            ${rows.length === 0
                ? `<div class="al-empty">You're not in any.</div>`
                : rows.map(a => renderAllianceRow(a, /*isMember*/true)).join('')
            }
        </div>
    `;
}

function renderOpenSection() {
    const rows = filterAlliancesBySector(_openAlliances);
    return `
        <div class="al-section">
            <div class="al-section__title">Open to Join</div>
            ${rows.length === 0
                ? `<div class="al-empty">No alliances open to join yet.</div>`
                : rows.map(a => renderAllianceRow(a, /*isMember*/false)).join('')
            }
        </div>
    `;
}

// Read-only "All Strategic Alliances" listing — every active alliance
// the player is not a member of, surfaced for visibility (member roster,
// total valuation summed from each member corp's masthead price, and
// charter articles in ratification order).
function renderAllAlliancesSection() {
    const rows = filterAlliancesBySector(_otherAlliances);
    return `
        <div class="al-section">
            <div class="al-section__title">All Strategic Alliances${rows.length ? ' &middot; ' + rows.length : ''}</div>
            ${rows.length === 0
                ? `<div class="al-empty">No other active alliances yet.</div>`
                : rows.map(renderAllAllianceRow).join('')
            }
        </div>
    `;
}

// One read-only row per outside alliance. Mirrors the visual style of
// renderAllianceRow but strips action affordances (no expand/collapse,
// no buttons) since the player can't act on these alliances.
function renderAllAllianceRow(a) {
    const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX'];

    const members = a.members || [];
    const founders = members.filter(m => m.is_founder);
    const otherMembers = members.filter(m => !m.is_founder);
    const renderMemberChip = (m, opts = {}) => {
        const ticker = escHtml(m.corp_ticker || m.abbreviation || '—');
        const nation = escHtml(m.nation_name || '—');
        const tone = opts.founder
            ? 'color:var(--amber);border-color:var(--amber-border);background:var(--amber-faint);'
            : '';
        return `<span class="al-row__tag" style="${tone}" title="${escHtml(m.faction_name || '')}">${ticker} &middot; ${nation}</span>`;
    };
    const founderChips = founders.map(m => renderMemberChip(m, { founder: true })).join('');
    const memberChips = otherMembers.map(m => renderMemberChip(m)).join('');

    // Founded — derive year from tick (12 ticks/year, base 2000 — matches tickToDate)
    const foundedYear = (a.founded_at_tick != null)
        ? 2000 + Math.floor(Number(a.founded_at_tick) / 12)
        : null;

    const articlesHtml = (a.articles || []).length === 0
        ? `<div class="al-empty" style="padding:10px 0;">No ratified articles.</div>`
        : (a.articles || []).map((ar, i) => `
            <div style="padding:10px 0;border-top:1px solid var(--al-line, rgba(255,255,255,0.06));">
                <div style="font-family:var(--font-mono);font-size:9px;letter-spacing:0.18em;color:var(--text-dim);">ARTICLE ${ROMAN[i] || (i + 1)}</div>
                <div style="font-weight:600;margin-top:3px;color:var(--text-bright);">${escHtml(ar.name || '—')}</div>
                ${ar.body ? `<div style="font-size:11px;color:var(--text-secondary);margin-top:3px;line-height:1.5;">${escHtml(ar.body)}</div>` : ''}
            </div>
        `).join('');

    const subParts = [];
    subParts.push(`<span><span style="color:var(--text-dim);">Members</span> <span style="color:var(--text-bright);">${a.member_count ?? 0}</span></span>`);
    if (foundedYear) subParts.push(`<span><span style="color:var(--text-dim);">Founded</span> <span style="color:var(--text-bright);">${foundedYear}</span></span>`);
    if (a.hq && a.hq !== '—') subParts.push(`<span><span style="color:var(--text-dim);">HQ</span> <span style="color:var(--text-bright);">${escHtml(a.hq)}</span></span>`);

    return `
        <div class="al-row" style="opacity:0.95;">
            <div class="al-row__head">
                <span class="al-row__name">${escHtml(a.name)}</span>
                <span class="al-row__tag">${escHtml(SECTOR_LABEL[a.sector] || a.sector)}</span>
                <div class="al-row__metrics">
                    <div class="al-row__metric">
                        <div class="al-row__metric-label">Members</div>
                        <div class="al-row__metric-value">${a.member_count}</div>
                    </div>
                    <div class="al-row__metric">
                        <div class="al-row__metric-label">Total Valuation</div>
                        <div class="al-row__metric-value">${fmtMoney(a.total_valuation || 0)}</div>
                    </div>
                </div>
            </div>
            <div class="al-row__sub" style="display:flex;flex-wrap:wrap;gap:14px;padding:6px 0 2px;font-family:var(--font-mono);font-size:10px;letter-spacing:0.04em;">
                ${subParts.join('')}
            </div>
            ${a.mission ? `
                <div style="margin-top:10px;padding:10px 14px;border-left:2px solid var(--amber);font-style:italic;color:var(--text-secondary);font-size:12px;line-height:1.5;">
                    &ldquo;${escHtml(a.mission)}&rdquo;
                </div>

// Threshold for the red "INACTIVE (N ticks)" badge on candidate cards.
// Matches the admin.html inactive filter (>= 6 ticks since last_seen_tick).
const INACTIVITY_THRESHOLD_TICKS = 6;

// Logo chip: prefers custom_logo_url when uploaded, falls back to the
// abbreviation initials (the existing chip style). Same 36×36 footprint
// either way so the row layout doesn't shift when corps mix logos and
// initials.
function renderCorpChip(c) {
    const url = c.custom_logo_url;
    if (url) {
        return `<div class="fnd-invitee__chip" style="padding:0;overflow:hidden;background:var(--bg-1);border:1px solid var(--text-dim);">
            <img src="${escHtml(url)}" alt="${escHtml(corpInitials(c))}" style="width:100%;height:100%;object-fit:cover;display:block;"
                 onerror="this.parentElement.innerHTML='${escHtml(corpInitials(c))}';this.parentElement.style.padding='';this.parentElement.style.background='';">
        </div>`;
    }
    return `<div class="fnd-invitee__chip">${escHtml(corpInitials(c))}</div>`;
}

// Red inactivity badge below the corp name when the corp's player has
// been silent for INACTIVITY_THRESHOLD_TICKS+ ticks. Returns '' when
// active (or last_seen_tick is null — treat unknown as active until
// they actually idle out).
function renderInactivityLabel(c, currentTick) {
    const lastSeen = Number(c.last_seen_tick);
    if (!Number.isFinite(lastSeen) || lastSeen <= 0) return '';
    const ticksInactive = Number(currentTick) - lastSeen;
    if (ticksInactive < INACTIVITY_THRESHOLD_TICKS) return '';
    return `<div style="font-family:var(--font-mono);font-size:9px;color:var(--red);letter-spacing:0.04em;text-transform:uppercase;margin-top:2px;">Inactive (${ticksInactive} tick${ticksInactive === 1 ? '' : 's'})</div>`;
}

function renderInviteeCard(c) {
    const sector = c.corp_sector || 'Construction';

// Live state for an in-progress founding proposal. All buttons are
// disabled today (backend not wired); the article-radio selection +

function renderNegotiationView() {
    // Dispatcher (renderShell) already bounces missing negotiations to
    // the list view before we get here, so a falsy `n` would only mean
    // the dispatcher guard regressed — render an empty shell rather
    // than blowing up.
    const n = (_pendingNegotiations || []).find(x => x.id === _negotiationId);
    if (!n) return '';
    const sectorLabel = SECTOR_LABEL[n.sector] || n.sector;
    const consensus = computeConsensusState(n);
    const me = (n.members || []).find(m => m.is_you) || null;
    const myCurrentVote = _negotiationDraftVote || me?.vote || null;
    const canRatify = consensus.reached && me && me.id === n.founder_faction_id;

    // Per-article tally: how many members chose each one. Guard the
    // bar-width math so a zero-member negotiation can't render NaN%.
    const tally = new Map((n.articles || []).map(a => [a.id, 0]));
    for (const m of (n.members || [])) {
        if (m.vote && tally.has(m.vote)) tally.set(m.vote, tally.get(m.vote) + 1);
    }
    const pendingCount = (n.members || []).filter(m => !m.vote).length;
    const totalWeight  = (n.members || []).length;
    const pctOf = (count) => totalWeight > 0 ? Math.round((count / totalWeight) * 100) : 0;

    return `
        <div class="fnd-crumb">
            <a class="fnd-crumb__link" data-nav="list">Strategic Alliances</a>
            <span class="fnd-crumb__sep">/</span>
            <a class="fnd-crumb__link" data-nav="found">Found New Alliance</a>
            <span class="fnd-crumb__sep">/</span>
            <span class="fnd-crumb__current">Founding Negotiation</span>
        </div>

        <div class="ng-head">
            <div class="ng-head__title-block">
                <div class="ng-head__title">${escHtml(n.name)}</div>
                <div class="ng-head__sub">
                    <span class="al-row__tag" style="color:var(--blue);border-color:var(--blue-border);background:var(--blue-faint);">${escHtml(sectorLabel)}</span>
                    Founding negotiation in progress &middot; Closes in ${n.ticks_remaining ?? '—'} ticks
                </div>
            </div>
            <div class="ng-head__metrics">
                <div class="ng-head__metric">
                    <div class="al-stat__label">Votes Submitted</div>
                    <div class="al-stat__value">${consensus.submitted} of ${consensus.total}</div>
                </div>
                <div class="ng-head__metric">
                    <div class="al-stat__label">Consensus</div>
                    <div class="al-stat__value" style="color:${consensus.reached ? 'var(--green)' : 'var(--text-dim)'};">
                        ${consensus.reached ? 'Reached' : 'Pending'}
                    </div>
                </div>
            </div>
        </div>
        <div class="al-rule"></div>

        <div class="ng-grid">
            <!-- LEFT: members + tally + actions -->
            <div class="ng-left">
                <div class="al-section__title">Founding Members</div>

                <div class="ng-tally">
                    <div class="al-section__title">Vote Tally &middot; Per Article</div>
                    ${(n.articles || []).map(a => {
                        const v = tally.get(a.id) || 0;

                        return `
                            <div class="ng-tally__row">
