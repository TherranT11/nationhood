<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Party</title>
<style>
/* Politician segment party page. Loaded with ?id=<faction_id> for any
   faction_type='movement_party' row. Mirrors the structural language of
   politician-nation.html (gov-strip cards, party-badge, status-pill)
   so the surfaces feel like one product. Sections gated on real data:
   anything we don't have a column for yet doesn't render. */
* { box-sizing:border-box; margin:0; padding:0; }
.content { padding:32px 24px 24px; max-width:1400px; margin:0 auto; }

/* Two-column body grid below the identity card. The right column shows
   only when the viewer is a party member (display toggled in JS); for
   everyone else the grid collapses to a single centered column. */
.body-grid { display:grid; grid-template-columns:1fr; gap:14px; }
.body-grid.has-side { grid-template-columns:minmax(0, 1fr) 380px; }
.main-col { min-width:0; }
.side-col { display:flex; flex-direction:column; gap:14px; }
.side-panel { padding:16px 18px; }
.actions-head, .chat-head { display:flex; align-items:baseline; justify-content:space-between; }
.chat-sub { text-transform:none; letter-spacing:0.02em; font-size:9px; color:#555;
  display:inline-flex; align-items:center; gap:6px; font-weight:500; }
.chat-dot { width:6px; height:6px; border-radius:50%; background:#5aafa5; display:inline-block; }
.actions-body { display:flex; flex-direction:column; gap:8px; padding:10px 0 4px; }

/* Chat thread: scrolling column of messages, oldest at top. Newest
   slides in at the bottom via the JS append; the thread auto-scrolls
   to the bottom after each render. */
.chat-thread { max-height:380px; overflow-y:auto; padding:6px 0; display:flex;
  flex-direction:column; gap:14px; }
.chat-msg { display:grid; grid-template-columns:32px 1fr; gap:10px; }
.chat-avatar { width:32px; height:32px; border-radius:5px; display:flex;
  align-items:center; justify-content:center; font-family:monospace;
  font-size:11px; font-weight:700; letter-spacing:0.04em; flex-shrink:0; }
.chat-body { min-width:0; }
.chat-meta { display:flex; align-items:baseline; gap:7px; flex-wrap:wrap;
  font-size:11px; color:#888; line-height:1.2; margin-bottom:3px; }
.chat-name { color:#fff; font-weight:600; }
.chat-role { font-size:9px; letter-spacing:0.08em; color:#888; text-transform:uppercase; }
.chat-role.leader { color:#c87a7a; }
.chat-role.deputy { color:#c89e6e; }
.chat-role.whip   { color:#c4a86a; }
.chat-role.you    { color:#5aafa5; }
.chat-time { margin-left:auto; font-family:monospace; font-size:9px; color:#555;
  letter-spacing:0.04em; }
.chat-text { font-size:12px; color:#cfcabf; line-height:1.55; word-break:break-word; }
.chat-empty { color:#666; font-size:11px; font-style:italic; text-align:center;
  padding:24px 0; }
.chat-footnote { font-size:9px; color:#5a5040; letter-spacing:0.05em; padding:8px 0 0;
  display:flex; align-items:center; gap:6px; }
.chat-footnote::before { content:'\1F512'; font-size:10px; }
.chat-form { display:flex; gap:8px; padding-top:10px;
  border-top:0.5px solid rgba(255,255,255,0.06); margin-top:10px; }
.chat-input { flex:1; min-width:0; background:transparent;
  border:0.5px solid rgba(255,255,255,0.10); color:#fff; padding:8px 11px;
  border-radius:4px; font-family:inherit; font-size:12px; outline:none; }
.chat-input:focus { border-color:rgba(90,175,165,0.5); }
.chat-input::placeholder { color:#555; }
.chat-send { padding:8px 16px; font-size:10px; letter-spacing:0.08em;
  font-family:monospace; font-weight:600; cursor:pointer; background:transparent;
  color:#c87a7a; border:0.5px solid rgba(200,122,122,0.4); border-radius:4px;
  text-transform:uppercase; }
.chat-send:hover { background:rgba(200,122,122,0.10); border-color:#c87a7a; }
.chat-send:disabled { color:#555; border-color:rgba(255,255,255,0.06);
  cursor:not-allowed; background:transparent; }

.crumb { font-size:9px; letter-spacing:0.13em; color:#666; margin-bottom:14px; }
.crumb a { color:#888; text-decoration:none; cursor:pointer; }
.crumb a:hover { color:#5aafa5; }
.crumb .sep { margin:0 7px; color:#3a3a3a; }
.crumb .here { color:#d4d4d4; }

/* Identity card — coloured top band, big logo, name, status tags. */
.identity { background:#0d0d0d; border:0.5px solid rgba(255,255,255,0.07);
  border-radius:8px; overflow:hidden; margin-bottom:14px; }
.id-top { display:flex; gap:22px; padding:24px 26px; align-items:flex-start;
  border-bottom:0.5px solid rgba(255,255,255,0.07); }
.id-logo { width:84px; height:84px; border-radius:10px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:24px; font-weight:700; letter-spacing:0.04em;
  font-family:monospace; }
.id-titles { flex:1; min-width:0; }
.id-eyebrow { font-size:9px; letter-spacing:0.16em; margin-bottom:6px; }
.id-name { font-size:28px; font-weight:500; color:#fff; letter-spacing:-0.01em; line-height:1.1; }
.id-name .serif { font-family:Georgia,'Times New Roman',serif; font-style:italic; }
.id-tags { display:flex; gap:8px; margin-top:11px; flex-wrap:wrap; align-items:center; }
.id-tag { font-size:9px; letter-spacing:0.08em; padding:4px 9px; border-radius:3px;
  background:#161616; color:#888; border:0.5px solid rgba(255,255,255,0.07);
  text-transform:uppercase; font-weight:600; }
.id-tag.status-gov { background:#0e1611; color:#8aaa6a; border-color:rgba(122,170,106,0.35); }
.id-tag.status-opp { background:#161208; color:#c89e6e; border-color:rgba(200,158,110,0.25); }
.id-tag.you       { background:#0e1416; color:#5aafa5; border-color:rgba(90,175,165,0.4); }

.id-actions { flex-shrink:0; display:flex; flex-direction:column; gap:7px; align-items:flex-end; }
.act-btn { font-size:10px; letter-spacing:0.07em; padding:8px 14px; border-radius:4px;
  cursor:pointer; border:0.5px solid; font-family:monospace; font-weight:600;
  text-transform:uppercase; background:transparent; min-width:140px; text-align:center; }
.act-btn.join     { color:#5aafa5; border-color:rgba(90,175,165,0.4); }
.act-btn.join:hover { background:rgba(90,175,165,0.10); border-color:#5aafa5; }
.act-btn.leave    { color:#c89e6e; border-color:rgba(200,158,110,0.4); }
.act-btn.leave:hover { background:rgba(200,158,110,0.10); border-color:#c89e6e; }
.act-btn.disabled { color:#555; border-color:rgba(255,255,255,0.06); cursor:not-allowed; }

/* Stats strip below the identity card. */
.stats-strip { display:grid; grid-template-columns:repeat(5,1fr); }
.ss { padding:16px 22px; border-right:0.5px solid rgba(255,255,255,0.07); }
.ss:last-child { border-right:none; }
.ss .k { font-size:8px; letter-spacing:0.12em; color:#666; margin-bottom:6px; }
.ss .v { font-size:22px; font-weight:600; color:#fff; font-variant-numeric:tabular-nums; line-height:1; }
.ss .v .of { font-size:11px; color:#888; font-weight:500; margin-left:3px; }
.ss .d { font-size:9px; color:#888; margin-top:5px; letter-spacing:0.02em; }

/* About / Leadership / Members panels share the .panel shell. */
.panel { background:#0d0d0d; border:0.5px solid rgba(255,255,255,0.07);
  border-radius:8px; padding:20px 24px; margin-bottom:14px; }
.panel-lab { font-size:9px; letter-spacing:0.13em; color:#666; margin-bottom:10px;
  text-transform:uppercase; font-weight:600; }
.panel-lab .count { color:#888; font-weight:500; letter-spacing:0.04em;
  text-transform:none; font-size:10px; margin-left:8px; }
.about-text { font-size:13px; color:#d4d4d4; line-height:1.65; }
.about-text em { color:#888; font-style:italic; }

/* Leadership panel — Leader / Deputy / Whip rendered as a 3-up grid so
   the three named officers sit side by side under Party Leadership.
   Collapses to a single column on mobile. */
.lead-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.lead-card { display:flex; gap:14px; align-items:center; min-width:0;
  padding:6px 0; }
.lead-portrait { width:44px; height:44px; border-radius:5px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:700; font-family:monospace; }
.lead-body { min-width:0; }
.lead-name { font-size:14px; color:#fff; font-weight:600;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lead-meta { font-size:10px; color:#888; margin-top:3px; letter-spacing:0.04em; }
.lead-card.vacant .lead-portrait { color:#444; background:rgba(255,255,255,0.03);
  border:0.5px solid rgba(255,255,255,0.06); }
.lead-card.vacant .lead-name { color:#666; font-style:italic; font-weight:500; }

/* Members list — every politician faction whose politician_party_id is
   this party. Sorted by politician_influence desc. The per-member
   "Career" column was dropped along with politician_career: every row
   on this surface is by definition a member of THIS party, so the cell
   carried no per-row signal. When held-office tracking lands (MP /
   Whip / Senator / Minister), a new column slots back in here. */
.mem-row { display:grid; grid-template-columns:38px 1fr 150px 90px 60px 80px;
  gap:14px; align-items:center; padding:11px 4px;
  border-bottom:0.5px solid rgba(255,255,255,0.04); font-size:12px; }
.mem-affil { color:#cfcabf; font-size:11px; }
.mem-affil.office { color:#7a9aab; }
.mem-row:last-child { border-bottom:none; }
.mem-row.header { font-size:8px; letter-spacing:0.11em; color:#666;
  border-bottom-color:rgba(255,255,255,0.08); padding-bottom:8px;
  text-transform:uppercase; font-weight:600; }
.mem-badge { width:30px; height:30px; border-radius:4px;
  display:flex; align-items:center; justify-content:center;
  font-family:monospace; font-size:10px; font-weight:700; }
.mem-name { color:#fff; font-weight:500; }
.mem-name .you { font-size:8px; letter-spacing:0.1em; margin-left:8px;
  background:#0e1416; color:#5aafa5; border:0.5px solid rgba(90,175,165,0.4);
  padding:2px 6px; border-radius:2px; text-transform:uppercase; }
/* .mem-stat carries Allies (national panel: reputation × 3) or
   Volunteers (local panel: credibility × 3). Same N / cap shape,
   header label varies by panel kind. */
.mem-stat { color:#cfcabf; font-family:monospace; font-size:11px;
  font-variant-numeric:tabular-nums; }
.mem-stat .of { color:#666; }
.mem-age { color:#888; font-size:11px; font-variant-numeric:tabular-nums; }
.mem-cap { text-align:right; color:#cfcabf; font-family:monospace;
  font-variant-numeric:tabular-nums; }
.mem-empty { color:#666; font-size:12px; font-style:italic; text-align:center; padding:18px 0; }

.loading { font-family:monospace; font-size:11px; color:#4a4940;
  text-align:center; padding:80px 20px; }
.fail { font-family:monospace; font-size:11px; color:#c87a7a;
  text-align:center; padding:80px 20px; }

/* Identity slogan — shown under the party name when factions.party_slogan
   is set. Italic + accent-colored so it reads as a motto rather than
   a second description line. */
.id-slogan { font-size:13px; color:#9eb87a; font-style:italic;
  margin-top:4px; letter-spacing:0.02em; }

/* Party Business — proposal cards under the Members panel. Header
   row carries the 3-up card grid plus an intro line describing the
   viewer's petitioning rank. Cards inherit the .panel look at a
   smaller scale; the IDENTITY chip mirrors the archetype-badge
   accent on movements so the same "category" cue carries over. */
.biz-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
.biz-sub  { font-size:10px; color:#666; letter-spacing:0.05em;
  font-weight:500; text-transform:none; }
.biz-intro { font-size:12px; color:#888; line-height:1.6; margin:6px 0 14px;
  font-style:italic; }
.biz-intro b { color:#c8a64e; font-style:normal; font-weight:600; }
.biz-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.biz-card { background:#0a0a0a; border:0.5px solid rgba(255,255,255,0.08);
  border-radius:6px; padding:14px 16px; cursor:pointer; transition:all 0.15s;
  display:flex; flex-direction:column; gap:6px; }
.biz-card:hover { background:#101010; border-color:rgba(200,166,78,0.35); }
.biz-card.disabled { cursor:not-allowed; opacity:0.4; }
.biz-card.disabled:hover { background:#0a0a0a; border-color:rgba(255,255,255,0.08); }
.biz-tag { font-size:8px; letter-spacing:0.13em; font-weight:600;
  color:#7a9aab; text-transform:uppercase; }
.biz-title { font-size:14px; color:#fff; font-weight:500; }
.biz-meta { font-size:11px; color:#888; letter-spacing:0.02em; line-height:1.4; }

/* Party Business modal — single overlay, content swapped per motion.
   Reuses the dark-panel palette + monospace bezels of the rest of
   the page so it doesn't read as a foreign component. */
.biz-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.65);
  display:none; align-items:center; justify-content:center; z-index:100;
  padding:16px; }
.biz-overlay.open { display:flex; }
.biz-modal { background:#0d0d0d; border:0.5px solid rgba(255,255,255,0.12);
  border-radius:8px; width:100%; max-width:520px; max-height:90vh;
  display:flex; flex-direction:column; overflow:hidden; }
.biz-modal-head { display:flex; align-items:flex-start; gap:12px;
  padding:18px 22px; border-bottom:0.5px solid rgba(255,255,255,0.06); }
.biz-modal-tag { font-size:8px; letter-spacing:0.13em; font-weight:600;
  color:#7a9aab; padding:3px 8px; background:rgba(122,154,171,0.10);
  border:0.5px solid rgba(122,154,171,0.25); border-radius:3px;
  text-transform:uppercase; align-self:flex-start; }
.biz-modal-title { flex:1; font-size:16px; color:#fff; font-weight:500; }
.biz-modal-x { background:none; border:none; color:#666; font-size:24px;
  cursor:pointer; line-height:1; padding:0 4px; }
.biz-modal-x:hover { color:#fff; }
.biz-modal-body { padding:18px 22px; overflow-y:auto; }
.biz-modal-foot { display:flex; gap:10px; justify-content:flex-end;
  padding:14px 22px; border-top:0.5px solid rgba(255,255,255,0.06); }
.biz-current { font-size:11px; color:#888; line-height:1.5;
  background:#0a0a0a; border:0.5px solid rgba(255,255,255,0.06);
  border-radius:4px; padding:10px 12px; margin-bottom:14px; }
.biz-current .label { font-size:9px; letter-spacing:0.13em; color:#555;
  text-transform:uppercase; font-weight:600; margin-bottom:5px; display:block; }
.biz-field-label { font-size:10px; letter-spacing:0.1em; color:#888;
  text-transform:uppercase; font-weight:600; margin-bottom:6px; }
.biz-input, .biz-textarea { width:100%; background:#0a0a0a;
  border:0.5px solid rgba(255,255,255,0.12); border-radius:4px;
  color:#fff; font-size:14px; font-family:inherit; padding:10px 12px;
  resize:vertical; }
.biz-input:focus, .biz-textarea:focus { outline:none; border-color:#c8a64e; }
.biz-textarea { min-height:120px; line-height:1.5; }
.biz-counter { font-size:10px; color:#555; text-align:right; margin-top:4px;
  font-variant-numeric:tabular-nums; }
.biz-counter.over { color:#c87a7a; }
.biz-file { width:100%; background:#0a0a0a;
  border:0.5px dashed rgba(255,255,255,0.18); border-radius:4px;
  color:#888; font-size:12px; padding:18px 12px; cursor:pointer;
  text-align:center; transition:all 0.15s; }
.biz-file:hover { border-color:#c8a64e; color:#c8a64e; }
.biz-preview { display:flex; align-items:center; gap:14px;
  padding:12px; background:#0a0a0a;
  border:0.5px solid rgba(200,166,78,0.25); border-radius:4px;
  margin-top:10px; }
.biz-preview img { width:64px; height:64px; object-fit:contain;
  background:#000; border-radius:4px; flex-shrink:0; }
.biz-preview .name { font-size:11px; color:#d4d4d4;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
.biz-preview .size { font-size:10px; color:#888; margin-top:3px;
  font-variant-numeric:tabular-nums; }
.biz-btn { font-family:monospace; font-size:11px; letter-spacing:0.1em;
  font-weight:600; padding:10px 18px; border-radius:4px; cursor:pointer;
  text-transform:uppercase; transition:all 0.15s; }
.biz-btn-sec { background:transparent; border:0.5px solid rgba(255,255,255,0.15);
  color:#888; }
.biz-btn-sec:hover { color:#d4d4d4; border-color:rgba(255,255,255,0.3); }
.biz-btn-pri { background:rgba(200,166,78,0.08); border:0.5px solid rgba(200,166,78,0.45);
  color:#c8a64e; }
.biz-btn-pri:hover:not(:disabled) { background:rgba(200,166,78,0.18); border-color:#c8a64e; }
.biz-btn-pri:disabled { opacity:0.4; cursor:not-allowed; }
.biz-msg { font-size:12px; line-height:1.6; padding:0 22px 16px;
  letter-spacing:0.02em; }
.biz-msg.err { color:#c87a7a; }
.biz-msg.ok  { color:#9eb87a; }
.biz-msg .roll { font-family:monospace; color:#888; }

@media (max-width:700px) {
  .content { padding:18px 12px 16px; }
  .id-top { flex-direction:column; gap:14px; padding:18px; }
  .id-actions { flex-direction:row; align-items:stretch; flex-wrap:wrap; }
  .stats-strip { grid-template-columns:1fr 1fr; }
  .ss { border-right:none; border-bottom:0.5px solid rgba(255,255,255,0.07); }
  .ss:nth-child(odd) { border-right:0.5px solid rgba(255,255,255,0.07); }
  .lead-grid { grid-template-columns:1fr; }
  .body-grid.has-side { grid-template-columns:1fr; }
  .chat-thread { max-height:300px; }
  .mem-row { grid-template-columns:30px 1fr auto; }
  .mem-row .mem-age, .mem-row .mem-affil, .mem-row .mem-stat { display:none; }
  .biz-grid { grid-template-columns:1fr; }
  .biz-modal { max-width:100%; }
}

/* ── Vote of No Confidence (top-of-page leadership challenge) ── */
#ncv-host:empty { display:none; }
.ncv-panel { background:#120e0e; border:0.5px solid rgba(200,122,122,0.3); border-radius:6px;
  padding:14px 16px; margin:14px 0 0; }
.ncv-panel.open { border-color:rgba(200,122,122,0.55); }
.ncv-row { display:flex; align-items:center; justify-content:space-between; gap:14px; }
.ncv-title { font-size:13px; font-weight:700; color:#fff; display:flex; align-items:center; gap:10px; }
.ncv-live { font-family:monospace; font-size:8.5px; letter-spacing:0.12em; color:#c87a7a;
  border:0.5px solid rgba(200,122,122,0.5); border-radius:3px; padding:2px 6px; }
.ncv-sub { font-size:10.5px; color:#999; margin-top:4px; line-height:1.5; }
.ncv-sub b { color:#ddd; }
.ncv-file { flex-shrink:0; font-size:10px; letter-spacing:0.07em; padding:8px 14px; border-radius:4px;
  background:transparent; color:#c87a7a; border:0.5px solid rgba(200,122,122,0.45); cursor:pointer; }
.ncv-file:hover:not(:disabled) { background:rgba(200,122,122,0.10); border-color:#c87a7a; }
.ncv-file:disabled { opacity:0.5; cursor:not-allowed; }
.ncv-versus { display:flex; align-items:stretch; gap:12px; margin:12px 0 4px; }
.ncv-side { flex:1; min-width:0; background:#0d0d0d; border:0.5px solid rgba(255,255,255,0.08);
  border-radius:5px; padding:10px 12px; text-align:center; }
.ncv-side.pick { border-color:#7a9aab; background:#0e1218; }
.ncv-name { font-size:13px; color:#fff; font-weight:600; overflow-wrap:anywhere; }
.ncv-role { font-family:monospace; font-size:8px; letter-spacing:0.12em; color:#666; text-transform:uppercase; margin-top:3px; }
.ncv-tally { font-family:monospace; font-size:20px; color:#fff; margin-top:8px; }
.ncv-vs { align-self:center; font-family:Georgia,serif; font-style:italic; font-size:12px; color:#666; flex-shrink:0; }
.ncv-actions { display:flex; gap:8px; margin-top:10px; }
.ncv-vote { flex:1; font-size:10px; letter-spacing:0.05em; padding:8px 10px; border-radius:4px;
  background:transparent; color:#9ab; border:0.5px solid rgba(122,154,171,0.4); cursor:pointer; }
.ncv-vote.chal { color:#c89e6e; border-color:rgba(200,158,110,0.4); }
.ncv-vote:hover { background:rgba(255,255,255,0.04); }
.ncv-vote.on { background:#0e1218; border-color:#7a9aab; color:#fff; }
.ncv-vote.chal.on { background:#15110a; border-color:#c89e6e; }
.ncv-result { font-size:11px; color:#aaa; font-style:italic; margin-top:10px;
  padding-top:10px; border-top:0.5px dashed rgba(255,255,255,0.07); }
</style>
</head>
<body>

<div id="pol-topbar-container"></div>

<div class="content" id="content" style="display:none;">
  <div class="crumb" id="crumb"></div>
  <div id="identity-host"></div>
  <div id="ncv-host"></div>
  <div id="caucus-host"></div>
  <div class="body-grid" id="body-grid">
    <div class="main-col">
      <div class="panel" id="about-panel" style="display:none;">
        <div class="panel-lab">About the Party</div>
        <div class="about-text" id="about-text"></div>
      </div>
      <div class="panel">
        <div class="panel-lab">Party Leadership</div>
        <div id="leadership-host"></div>
      </div>
      <div class="panel">
        <div class="panel-lab">Party Blocs</div>
        <div class="mem-empty">No blocs on record yet.</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { bootstrapPolitician } from './js/politician-topbar.js';
import { safeHexColor, factionInitials, officeTitle, fmtMoney, displayName, isMpOffice, MP_OFFICES } from './js/utils.js';
import { PARTY_ARCHETYPES } from './js/game/party-archetypes.js';
import { callPartyAction, LEAVE_PARTY_CONFIRM } from './js/politician-party-actions.js';

function escHtml(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

let _viewerPolId = null;
let _viewerPartyId = null;
let _viewerOffice = null;
let _viewerNextMotionAt = 0;
let _shardTick = 0;
let _chatPollId = null;

async function init() {
  const params  = new URLSearchParams(location.search);
  const partyId = params.get('id');
  if (!partyId) { showFail('No party id in URL.'); return; }

  let ctx = null;
  try { ctx = await bootstrapPolitician('movements'); }
  catch (err) {
    console.error('party: bootstrap failed', err);
    showFail('Failed to load. Please reload the page.');
    return;
  }
  if (!ctx) return; // bootstrap redirected (no auth / no politician)

  _viewerPolId         = ctx.faction?.id || null;
  _viewerPartyId       = ctx.faction?.politician_party_id || null;
  _viewerOffice        = ctx.faction?.politician_office || null;
  _viewerNextMotionAt  = Number(ctx.faction?.next_party_motion_tick) || 0;
  _shardTick           = Number(ctx.shard?.current_tick) || 0;

  // Party + members in parallel. Members filter on faction_type so a
  // typo'd politician_party_id on a different faction kind can't leak in.
  const [partyRes, membersRes] = await Promise.all([
    _supabase.from('factions')
      .select('id, faction_name, abbreviation, seats, popularity_pct, popularity_cap_pct, party_color, party_description, party_slogan, custom_logo_url, leader_first_name, leader_last_name, leader_age, deputy_first_name, deputy_last_name, deputy_age, whip_first_name, whip_last_name, whip_age, party_funds, nation_id, nation:nations!nation_id(id, name, population, total_seats, government_type)')
      .eq('id', partyId)
      .eq('faction_type', 'movement_party')
      .is('abandoned_at', null)
      .maybeSingle(),
    _supabase.from('factions')
      .select('id, leader_first_name, leader_last_name, nickname, leader_age, politician_influence, politician_reputation, politician_skill, politician_office, volunteers')
      .eq('politician_party_id', partyId)
      .eq('faction_type', 'politician')
      .is('abandoned_at', null)
      .order('politician_influence', { ascending: false }),
  ]);

  if (partyRes.error) {
    console.error('party: party fetch failed', partyRes.error);
    showFail('Could not load this party.');
    return;
  }
  if (!partyRes.data) { showFail('Party not found or has been abandoned.'); return; }
  if (membersRes.error) console.error('party: members fetch failed', membersRes.error);

  render(partyRes.data, membersRes.data || []);
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}

function showFail(msg) {
  const el = document.getElementById('loading');
  if (el) { el.className = 'fail'; el.textContent = msg; }
}

function render(party, members) {
  const accent     = safeHexColor(party.party_color);
  const initials   = factionInitials(party.faction_name, party.abbreviation);
  const totalSeats = Math.max(0, Number(party.nation?.total_seats) || 0);
  const majority   = totalSeats > 0 ? Math.floor(totalSeats / 2) + 1 : 0;
  const seats      = Math.max(0, Number(party.seats) || 0);
  const isGov      = totalSeats > 0 && seats >= majority;
  const isMine     = _viewerPartyId && _viewerPartyId === party.id;
  const nationName = party.nation?.name || '—';
  const isAbsMon   = party.nation?.government_type === 'Absolute Monarchy';

  document.title = `${party.faction_name} — Party`;

  renderCrumb(party);

  // Identity card.
  const tags = [
    isGov  ? '<span class="id-tag status-gov">&#9679; Governing</span>'
           : (totalSeats > 0 ? '<span class="id-tag status-opp">&#9679; Opposition</span>' : ''),
    isMine ? '<span class="id-tag you">&#9679; You are a member</span>' : '',
    party.abbreviation ? `<span class="id-tag">${escHtml(party.abbreviation.toUpperCase())}</span>` : '',
  ].filter(Boolean).join(' ');

  // Slogan — landed with Party Business (Change Party Slogan motion).
  // Rendered as an italic motto under the party name. Hidden cleanly
  // when null/empty so a party without one doesn't ship an empty line.
  const sloganHtml = party.party_slogan
    ? `<div class="id-slogan">&ldquo;${escHtml(party.party_slogan)}&rdquo;</div>`
    : '';

  // Hero crest — custom_logo_url takes precedence when set (the
  // Modernize Party Image motion writes it), falling back to the
  // accent-tinted initials block. onerror hides a broken image so
  // a 404 doesn't render a torn-image icon over the accent square.
  const crestInner = party.custom_logo_url
    ? `<img src="${escHtml(party.custom_logo_url)}" alt="${escHtml(party.faction_name)}" style="width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit;" onerror="this.parentElement.innerHTML='${escHtml(initials).replace(/'/g, "&#39;")}'">`
    : escHtml(initials);
  const crestPadding = party.custom_logo_url ? 'padding:0;overflow:hidden;' : '';

  document.getElementById('identity-host').innerHTML = `
    <div class="identity">
      <div class="id-top">
        <div class="id-logo" style="background:${accent}1f;color:${accent};border:0.5px solid ${accent}66;${crestPadding}">${crestInner}</div>
        <div class="id-titles">
          <div class="id-eyebrow" style="color:${accent};">&mdash; POLITICAL PARTY &middot; ${escHtml(nationName.toUpperCase())} &mdash;</div>
          <div class="id-name">${escHtml(party.faction_name)}</div>
          ${sloganHtml}
          <div class="id-tags">${tags}</div>
        </div>
        <div class="id-actions" id="action-host"></div>
      </div>
      <div class="stats-strip">
        ${statCell('Seats in Assembly', totalSeats > 0 ? `${seats}<span class="of">/ ${totalSeats}</span>` : String(seats), totalSeats > 0
          ? `${pctOfChamber(seats, totalSeats)} of chamber`
          : 'No assembly')}
        ${statCell('Popularity',
          party.popularity_pct != null
            ? `${Math.round(Number(party.popularity_pct))}%<span class="of">/ ${Math.round(Number(party.popularity_cap_pct) || 40)}%</span>`
            : '—',
          party.popularity_pct != null ? `cap ${Math.round(Number(party.popularity_cap_pct) || 40)}%` : 'unrated')}
        ${statCell('Status', isGov ? 'In Power' : (totalSeats > 0 ? 'Opposition' : '—'),
          isGov ? `holds majority (${majority} needed)` : (totalSeats > 0 ? `${majority - seats} short of majority` : ''))}
        ${statCell('Party Funds', fmtMoney(Number(party.party_funds) || 0),
          'in the party treasury')}
        ${statCell('Members', fmtMembers(membershipCount(members.length, party.nation?.population)),
          `${members.length === 1 ? '1 politician' : `${members.length} politicians`} on file`)}
      </div>
    </div>`;

  renderActionButton(party, isMine, isAbsMon);
  renderNoConfidence(party, isMine).catch(err => console.warn('party: no-confidence render failed', err?.message || err));
  renderCaucusPanel(party).catch(err => console.warn('party: caucus render failed', err?.message || err));
  renderAbout(party);
  renderLeadership(party, accent);
  renderMembers(members, accent);
  renderBusinessPanel(party, isMine);
  renderSidebar(party, isMine);
}

// ── Vote of No Confidence (20270912) ────────────────────────────────
// Top-of-page leadership challenge. A member files against the NPC
// leader and becomes the challenger; the motion stays open 3 ticks while
// members vote, then resolves (NPC bloc from popularity-vs-standing +
// the weighted member votes). Resolution is lazy + idempotent — we kick
// it from here when an open motion's window has elapsed.
const NCV_REASONS = {
  not_member: 'Only party members can file.', already_open: 'A vote is already underway.',
  on_cooldown: 'The party just held a vote — try again later.', no_leader: 'This party has no leader to challenge.',
  insufficient_capital: 'You don’t have enough Influence to file.', window_closed: 'Voting has closed.',
  party_not_found: 'Party not found.', bad_choice: 'Invalid choice.',
};

// ── Caucus & Allies (20270920) — a Senior MP's bloc tools, shown on
// their own party page directly under the Vote of No Confidence panel.
const CAUCUS_REASONS = {
  not_senior_mp:          'Only a Senior MP can do this.',
  no_party:               'You need a party first.',
  cooldown:               'Still rallying — try again shortly.',
  insufficient_allies:    'Your allies must reach 10% of the party’s seats first.',
  insufficient_influence: 'You need 10 Influence to form a caucus.',
  invalid_name:           'Give the caucus a name (2–80 characters).',
  no_politician:          'No politician on this account.',
};

async function renderCaucusPanel(party) {
  const host = document.getElementById('caucus-host');
  if (!host) return;
  host.innerHTML = '';
  // Only the party's own Senior MP gets the caucus tools.
  if (_viewerOffice !== 'senior_mp' || _viewerPartyId !== party.id) return;

  let me = null;
  try {
    const { data } = await _supabase.from('factions')
      .select('politician_allies, politician_ally_recruit_cooldown_until_tick, politician_influence')
      .eq('id', _viewerPolId).maybeSingle();
    me = data;
  } catch (_) { return; }   // column/RLS issue → just hide the panel
  if (!me) return;

  const allies    = Number(me.politician_allies) || 0;
  const influence = Number(me.politician_influence) || 0;
  const seats     = Number(party.seats) || 0;
  const need      = Math.ceil(seats / 10);            // 10% of party seats
  const canForm   = allies * 10 >= seats && influence >= 10;
  const cdUntil   = Number(me.politician_ally_recruit_cooldown_until_tick) || 0;
  const onCd      = cdUntil > _shardTick;

  host.innerHTML = `
    <div class="ncv-panel">
      <div class="ncv-row">
        <div>
          <div class="ncv-title">Caucus &amp; Allies</div>
          <div class="ncv-sub"><b>${allies}</b> all${allies === 1 ? 'y' : 'ies'} &middot; a caucus needs <b>${need}</b> (10% of ${seats} seats) and <b>10</b> Influence</div>
        </div>
        <div style="display:flex; gap:8px; flex-shrink:0;">
          <button class="ncv-file" type="button" id="caucus-recruit"${onCd ? ' disabled' : ''}>${onCd ? `Recruit &middot; ${cdUntil - _shardTick}t` : 'Recruit Ally'}</button>
          <button class="ncv-file" type="button" id="caucus-form"${canForm ? '' : ' disabled'}>Form Caucus</button>
        </div>
      </div>
    </div>`;

  const recruitBtn = document.getElementById('caucus-recruit');
  if (recruitBtn) recruitBtn.addEventListener('click', async () => {
    recruitBtn.disabled = true;
    try {
      const { data, error } = await _supabase.rpc('politician_recruit_ally', { p_faction_id: _viewerPolId });
      if (error) throw error;
      if (!data?.success) throw new Error(CAUCUS_REASONS[data?.reason] || data?.reason || 'failed');
    } catch (err) { alert('Could not recruit an ally: ' + (err?.message || err)); }
    renderCaucusPanel(party);
  });

  const formBtn = document.getElementById('caucus-form');
  if (formBtn) formBtn.addEventListener('click', () => renderCaucusForm(party));
}

function renderCaucusForm(party) {
  const host = document.getElementById('caucus-host');
  if (!host) return;
  const opts = PARTY_ARCHETYPES.map(a => `<option value="${escHtml(a)}">${escHtml(a)}</option>`).join('');
  host.innerHTML = `
    <div class="ncv-panel open">
      <div class="ncv-title">Form a Caucus</div>
      <div class="ncv-sub">Name your bloc and pick its banner. <b>+2 Allies</b> &middot; costs <b>10 Influence</b>.</div>
      <div style="display:flex; flex-direction:column; gap:8px; margin:10px 0;">
        <input class="biz-input" type="text" id="caucus-name" maxlength="80" placeholder="Caucus name">
        <textarea class="biz-textarea" id="caucus-desc" maxlength="280" rows="2" placeholder="What it stands for (optional)"></textarea>
        <select class="biz-input" id="caucus-arch">${opts}</select>
      </div>
      <div class="ncv-actions">
        <button class="ncv-vote" type="button" id="caucus-cancel">Cancel</button>
        <button class="ncv-vote chal" type="button" id="caucus-submit">Form &middot; 10 Influence</button>
      </div>
      <div class="ncv-result" id="caucus-msg" style="display:none;"></div>
    </div>`;

  document.getElementById('caucus-cancel')?.addEventListener('click', () => renderCaucusPanel(party));

  const submit = document.getElementById('caucus-submit');
  if (submit) submit.addEventListener('click', async () => {
    const name = document.getElementById('caucus-name').value.trim();
    const desc = document.getElementById('caucus-desc').value.trim();
    const arch = document.getElementById('caucus-arch').value;
    const msg  = document.getElementById('caucus-msg');
    if (name.length < 2) { msg.style.display = 'block'; msg.textContent = CAUCUS_REASONS.invalid_name; return; }
    submit.disabled = true;
    try {
      const { data, error } = await _supabase.rpc('politician_form_caucus', {
        p_faction_id: _viewerPolId, p_name: name, p_description: desc, p_archetype: arch });
      if (error) throw error;
      if (!data?.success) throw new Error(CAUCUS_REASONS[data?.reason] || data?.reason || 'failed');
    } catch (err) {
      submit.disabled = false;
      msg.style.display = 'block';
      msg.textContent = 'Could not form caucus: ' + (err?.message || err);
      return;
    }
    renderCaucusPanel(party);   // back to the panel, allies refreshed
  });
}

async function renderNoConfidence(party, isMine) {
  const host = document.getElementById('ncv-host');
  host.innerHTML = '';
  let motion = null;
  try {
    const { data } = await _supabase.from('party_no_confidence_motions')
      .select('*').eq('party_faction_id', party.id)
      .order('created_at', { ascending: false }).limit(1).maybeSingle();
    motion = data || null;
  } catch (_) { return; }  // table/RLS issue → just hide the panel

  // Lazy resolve once the 3-tick window has elapsed (idempotent server-side).
  if (motion && motion.status === 'open' && _shardTick > motion.resolve_tick) {
    try {
      await _supabase.rpc('resolve_party_no_confidence', { p_motion_id: motion.id });
      const { data } = await _supabase.from('party_no_confidence_motions')
        .select('*').eq('id', motion.id).maybeSingle();
      motion = data || motion;
    } catch (_) { /* leave the open state; next load retries */ }
  }

  if (motion && motion.status === 'open') { await renderOpenMotion(host, party, motion, isMine); return; }

  // No open motion. Members get the file button (+ last result); others just see the last result.
  const resultLine = motion ? ncvResultLine(motion) : '';
  if (isMine && party.leader_first_name) {
    const leaderName = [party.leader_first_name, party.leader_last_name].filter(Boolean).join(' ') || 'the leader';
    host.innerHTML = `<div class="ncv-panel">
      <div class="ncv-row">
        <div><div class="ncv-title">Vote of No Confidence</div>
          <div class="ncv-sub">Challenge ${escHtml(leaderName)} for the party leadership. Every member votes; win and you become leader.</div></div>
        <button class="ncv-file" id="ncv-file">Vote of No Confidence</button>
      </div>${resultLine}</div>`;
    document.getElementById('ncv-file').addEventListener('click', () => fileNoConfidence(party));
  } else if (resultLine) {
    host.innerHTML = `<div class="ncv-panel">${resultLine}</div>`;
  }
}

async function renderOpenMotion(host, party, motion, isMine) {
  let votes = [];
  try {
    const { data } = await _supabase.from('party_no_confidence_votes')
      .select('choice, weight, voter_faction_id').eq('motion_id', motion.id);
    votes = data || [];
  } catch (_) { /* tally falls back to 0/0 */ }
  const sum = c => votes.filter(v => v.choice === c).reduce((s, v) => s + Number(v.weight || 0), 0);
  const leaderW = sum('leader'), chalW = sum('challenger');
  const myVote = votes.find(v => v.voter_faction_id === _viewerPolId)?.choice || null;
  const ticksLeft = Math.max(0, motion.resolve_tick - _shardTick);
  const leaderName = [motion.leader_first_name, motion.leader_last_name].filter(Boolean).join(' ') || 'The leader';
  host.innerHTML = `<div class="ncv-panel open">
    <div class="ncv-title">Vote of No Confidence <span class="ncv-live">OPEN</span></div>
    <div class="ncv-versus">
      <div class="ncv-side${myVote === 'leader' ? ' pick' : ''}">
        <div class="ncv-name">${escHtml(leaderName)}</div><div class="ncv-role">Incumbent leader</div>
        <div class="ncv-tally">${leaderW}</div></div>
      <div class="ncv-vs">vs</div>
      <div class="ncv-side${myVote === 'challenger' ? ' pick' : ''}">
        <div class="ncv-name">${escHtml(motion.challenger_name)}</div><div class="ncv-role">Challenger</div>
        <div class="ncv-tally">${chalW}</div></div>
    </div>
    <div class="ncv-sub">Weighted member votes so far. The party's NPC members decide the rest from the leader's standing when this resolves ${ticksLeft === 0 ? '<b>imminently</b>' : `in <b>${ticksLeft}</b> tick${ticksLeft === 1 ? '' : 's'}`}.</div>
    ${isMine ? `<div class="ncv-actions">
      <button class="ncv-vote${myVote === 'leader' ? ' on' : ''}" data-choice="leader">Back the leader</button>
      <button class="ncv-vote chal${myVote === 'challenger' ? ' on' : ''}" data-choice="challenger">Back ${escHtml(motion.challenger_name)}</button>
    </div>` : ''}</div>`;
  if (isMine) {
    host.querySelectorAll('.ncv-vote').forEach(b =>
      b.addEventListener('click', () => castNoConfidenceVote(motion, b.dataset.choice, party)));
  }
}

function ncvResultLine(motion) {
  // Final weighted tally (NPC bloc + member votes), cached on the motion.
  const tally = (motion.challenger_support != null && motion.leader_support != null)
    ? ` (${Math.round(motion.challenger_support)}–${Math.round(motion.leader_support)})` : '';
  if (motion.status === 'passed') {
    return `<div class="ncv-result">${escHtml(motion.challenger_name)} won a vote of no confidence${tally} and now leads the party.</div>`;
  }
  if (motion.status === 'failed') {
    const leaderName = [motion.leader_first_name, motion.leader_last_name].filter(Boolean).join(' ') || 'the leader';
    return `<div class="ncv-result">The last vote of no confidence failed${tally} — ${escHtml(leaderName)} kept the leadership.</div>`;
  }
  return '';
}

async function fileNoConfidence(party) {
  const btn = document.getElementById('ncv-file');
  if (btn) { btn.disabled = true; btn.textContent = 'Filing…'; }  // double-fire lock (costs Influence)
  try {
    const { data, error } = await _supabase.rpc('file_party_no_confidence', { p_party_id: party.id });
    if (error) throw error;
    if (!data?.success) {
      alert('Could not file: ' + (NCV_REASONS[data?.reason] || data?.reason || 'unknown'));
      if (btn) { btn.disabled = false; btn.textContent = 'Vote of No Confidence'; }
      return;
    }
    await renderNoConfidence(party, true);
  } catch (e) {
    alert('Could not file: ' + (e?.message || e));
    if (btn) { btn.disabled = false; btn.textContent = 'Vote of No Confidence'; }
  }
}

async function castNoConfidenceVote(motion, choice, party) {
  try {
    const { data, error } = await _supabase.rpc('cast_party_no_confidence_vote',
      { p_motion_id: motion.id, p_choice: choice });
    if (error) throw error;
    if (!data?.success) { alert('Vote failed: ' + (NCV_REASONS[data?.reason] || data?.reason || 'unknown')); return; }
    await renderNoConfidence(party, true);
  } catch (e) { alert('Vote failed: ' + (e?.message || e)); }
}

// Right sidebar — Actions + Party Chat. Only shown when the viewer is a
// party member. Non-members get a single-column layout instead.
function renderSidebar(party, isMine) {
  const side = document.getElementById('side-col');
  const bodyGrid = document.getElementById('body-grid');
  if (!isMine) {
    side.style.display = 'none';
    bodyGrid.classList.remove('has-side');
    if (_chatPollId) { clearInterval(_chatPollId); _chatPollId = null; }
    return;
  }
  side.style.display = 'flex';
  bodyGrid.classList.add('has-side');
  renderMpActions();
  loadAndPollChat(party).catch(err => console.warn('[party] chat init failed', err));
}

// Single MP-only action surface — [Propose New Law] — surfacing the
// committee_propose_law modal that lives on politician-statutes.html.

async function loadAndPollChat(party) {
  const { data: chatRes, error: chatErr } = await _supabase.rpc('ensure_party_chat', { p_party_id: party.id });
  if (chatErr || !chatRes || !chatRes.success) {
    console.warn('[party] ensure_party_chat:', chatErr?.message || chatRes?.reason);
    return;
  }
  const chatId = chatRes.chat_id;
  document.getElementById('chat-footnote').textContent =
    `visible to party members only · assume monitored under ${party.nation?.name || 'national'} law`;

  await refreshChat(chatId, party);

  if (_chatPollId) clearInterval(_chatPollId);
  _chatPollId = setInterval(() => refreshChat(chatId, party).catch(() => {}), 4000);

  const form = document.getElementById('chat-form');
  form.onsubmit = async (e) => {
    e.preventDefault();
    const input = document.getElementById('chat-input');
    const send  = document.getElementById('chat-send');
    const text  = input.value.trim();
    if (!text) return;
    send.disabled = true;
    try {
      const { data, error } = await _supabase.rpc('send_party_message', { p_chat_id: chatId, p_message: text });
      if (error) throw error;
      if (data?.success) {
        input.value = '';
        await refreshChat(chatId, party);
      } else {
        console.warn('[party] send rejected:', data?.reason);
      }
    } catch (err) {
      console.warn('[party] send failed:', err?.message || err);
    } finally {
      send.disabled = false;
    }
  };
}

async function refreshChat(chatId, party) {
  const { data, error } = await _supabase.from('group_chat_messages')
    .select('id, message_text, created_at, sender_id, sender:factions!sender_id(leader_first_name, leader_last_name)')
    .eq('chat_id', chatId)
    .order('created_at', { ascending: false })
    .limit(50);
  if (error) {
    console.warn('[party] chat fetch error:', error.message);
    return;
  }
  renderChatThread((data || []).slice().reverse(), party);
}

function renderChatThread(messages, party) {
  const thread = document.getElementById('chat-thread');
  if (!messages.length) {
    thread.innerHTML = '<div class="chat-empty">No messages yet. Be the first.</div>';
    return;
  }
  const accent = safeHexColor(party.party_color);
  const norm = s => (s || '').trim().toLowerCase();
  const leaderName = norm(`${party.leader_first_name || ''} ${party.leader_last_name || ''}`);
  const deputyName = norm(`${party.deputy_first_name || ''} ${party.deputy_last_name || ''}`);
  const whipName   = norm(`${party.whip_first_name   || ''} ${party.whip_last_name   || ''}`);

  thread.innerHTML = messages.map(m => {
    const senderName = [m.sender?.leader_first_name, m.sender?.leader_last_name].filter(Boolean).join(' ') || 'Unknown';
    const senderLower = norm(senderName);
    const isYou = m.sender_id === _viewerPolId;
    let role = 'Member', roleClass = '';
    if      (senderLower && senderLower === leaderName) { role = 'Leader'; roleClass = 'leader'; }
    else if (senderLower && senderLower === deputyName) { role = 'Deputy'; roleClass = 'deputy'; }
    else if (senderLower && senderLower === whipName)   { role = 'Whip';   roleClass = 'whip';   }
    else if (isYou)                                      { role = 'Member (you)'; roleClass = 'you'; }
    const ini = factionInitials(senderName, null);
    return `<div class="chat-msg">
      <div class="chat-avatar" style="background:${accent}1f; color:${accent}; border:0.5px solid ${accent}66;">${escHtml(ini)}</div>
      <div class="chat-body">
        <div class="chat-meta">
          <span class="chat-name">${escHtml(senderName)}</span>
          <span class="chat-role ${roleClass}">${escHtml(role)}</span>
          <span class="chat-time">${escHtml(formatChatTime(m.created_at))}</span>
        </div>
        <div class="chat-text">${escHtml(m.message_text)}</div>
      </div>
    </div>`;
  }).join('');

  thread.scrollTop = thread.scrollHeight;
}

function formatChatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return `${hh}:${mm}`;
}

// Card-carrying membership count. Rule: each politician on file represents
// 3% of the nation's population in members; clamped at the full population
// so very-large parties don't claim more members than there are humans.
const MEMBERS_PER_POLITICIAN_PCT = 0.03;
function membershipCount(politicianCount, population) {
  const n = Math.max(0, Number(politicianCount) || 0);
  const pop = Math.max(0, Number(population) || 0);
  return Math.round(Math.min(pop, n * MEMBERS_PER_POLITICIAN_PCT * pop));
}

// Compact number for the stats strip: 1.2M / 300K / 850 / etc. Single-decimal
// precision below 10K / 10M; round to integer above so the digit-count stays
// stable across the four stat cells. Threshold boundaries account for the
// scaled-value rounding so 999500..999999 reads "1M" instead of "1000K".
function fmtMembers(n) {
  const v = Math.round(Number(n) || 0);
  if (v >= 9_950_000) return Math.round(v / 1e6) + 'M';
  if (v >=   999_500) return (v / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  if (v >=     9_950) return Math.round(v / 1e3) + 'K';
  if (v >=       999) return (v / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
  return String(v);
}

function statCell(label, value, detail) {
  return `<div class="ss">
    <div class="k">${escHtml(label)}</div>
    <div class="v">${value}</div>
    ${detail ? `<div class="d">${escHtml(detail)}</div>` : ''}

function pctOfChamber(seats, total) {
  if (!total) return '0%';
  return `${(seats / total * 100).toFixed(1).replace(/\.0$/, '')}%`;
}

async function doLeaveOrJoin(mode, partyId) {
  if (mode === 'leave' && !confirm(LEAVE_PARTY_CONFIRM)) return;
  const btn = document.getElementById(mode === 'leave' ? 'party-leave' : 'party-join');
  if (!btn) return;
  const prev = btn.textContent;
  btn.disabled = true; btn.textContent = mode === 'leave' ? 'Leaving…' : 'Joining…';
  const res = await callPartyAction(mode, _viewerPolId, partyId);
  if (!res.ok) {
    alert((mode === 'leave' ? 'Could not leave: ' : 'Could not join: ') + res.reason);
    btn.disabled = false; btn.textContent = prev;
    return;
  }
  location.reload();
}

// Shared renderer for both panels. kind = 'national' uses Allies
// (politician_reputation × 3); 'local' uses Volunteers (politician_
// credibility × 3). Same row shape, label varies. Affiliation = office
// title when held; "Party Member" otherwise (office-holders accent-tinted).
function renderMemberPanel(host, countEl, rows, accent, emptyText, kind) {
  if (!host) return;
  if (countEl) countEl.textContent = rows.length ? `${rows.length} on file` : '';
  if (!rows.length) {
    host.innerHTML = `<div class="mem-empty">${escHtml(emptyText)}</div>`;
    return;
  }
  const isNational = kind === 'national';
  const statLabel  = isNational ? 'Allies' : 'Volunteers';
  const body = rows.map(m => {
    const baseName = [m.leader_first_name, m.leader_last_name].filter(Boolean).join(' ') || '—';
    const name = displayName(m) || '—';
    const youBadge = m.id === _viewerPolId ? ' <span class="you">You</span>' : '';
    const age = (m.leader_age != null) ? String(Number(m.leader_age)) : '—';
    const office = m.politician_office || null;
    const affilText = office ? officeTitle(office) : 'Party Member';
    const affilCls  = office ? 'mem-affil office' : 'mem-affil';
    // Allies cap = reputation × 3 (national); Volunteers cap = skill × 3 (local).
    // National Allies count isn't tracked yet — placeholder 0. Local
    // Volunteers comes from the live column written by Civic Meeting.
    const driverStat = isNational ? m.politician_reputation : m.politician_skill;
    const statCap = Math.max(0, Math.round((Number(driverStat) || 0) * 3));
    const statNow = isNational ? 0 : Math.round(Number(m.volunteers) || 0);
    return `<div class="mem-row">
      <div class="mem-badge" style="background:${accent}1f;color:${accent};border:0.5px solid ${accent}66;">${escHtml(factionInitials(baseName, null))}</div>
      <div class="mem-name">${escHtml(name)}${youBadge}</div>
      <div class="${affilCls}">${escHtml(affilText)}</div>
      <div class="mem-stat">${statNow} <span class="of">/ ${statCap}</span></div>
      <div class="mem-age">${escHtml(age)}</div>
      <div class="mem-cap">${Number(m.politician_influence) || 0}</div>
    </div>`;
  }).join('');
  host.innerHTML = `<div class="mem-row header">
    <span></span><span>Name</span><span>Affiliation</span><span>${escHtml(statLabel)}</span><span>Age</span><span style="text-align:right;">Influence</span>
  </div>${body}`;
}

// Mirrors propose_party_motion's payload contract.
let _bizActiveParty = null;
let _bizActiveMotion = null;

function renderBusinessPanel(party, isMine) {
  const panel = document.getElementById('biz-panel');
  if (!panel) return;
  if (!isMine) { panel.style.display = 'none'; return; }
  panel.style.display = '';
  _bizActiveParty = party;

  // Higher-rank politicians get direct vote-calling in a future
  // iteration; today every member is "rank-and-file" and sees the
  // same petition flow. The intro carries that nuance so the eventual
  // rank-up doesn't read as inconsistent copy.
  document.getElementById('biz-sub').textContent = 'rank-and-file proposals';

  // 3-tick cooldown shared across the three motions (20270419).
  // ticksLeft drives both the intro copy and the card-disabled state;
  // both surfaces read the same _viewerNextMotionAt so the page and
  // the server-side gate agree.
  const ticksLeft = Math.max(0, _viewerNextMotionAt - _shardTick);
  const onCooldown = ticksLeft > 0;

  document.getElementById('biz-intro').innerHTML = onCooldown
    ? `You proposed a motion recently. Next proposal in <b>${ticksLeft} tick${ticksLeft === 1 ? '' : 's'}</b>.`
    : 'As <b>a rank-and-file member</b>, you may petition for the following motions. ' +
      'Higher ranks will unlock direct vote-calling without a petition.';

  const cardCls = onCooldown ? 'biz-card disabled' : 'biz-card';
  const grid = document.getElementById('biz-grid');
  grid.innerHTML = Object.entries(BIZ_MOTIONS).map(([key, m]) => `
    <div class="${cardCls}" data-motion="${key}">
      <div class="biz-tag">${escHtml(m.tag)}</div>
      <div class="biz-title">${escHtml(m.title)}</div>
      <div class="biz-meta">${escHtml(m.meta)}</div>
    </div>`).join('');
  if (!onCooldown) {
    grid.querySelectorAll('.biz-card').forEach(card => {
      card.onclick = () => openBizModal(card.dataset.motion);
    });
  }
}

function openBizModal(motionType) {
  const m = BIZ_MOTIONS[motionType];
  if (!m || !_bizActiveParty) return;
  _bizActiveMotion = motionType;
  const overlay = document.getElementById('biz-overlay');
  const body    = document.getElementById('biz-modal-body');
  const msg     = document.getElementById('biz-msg');
  const submit  = document.getElementById('biz-submit');

  document.getElementById('biz-modal-tag').textContent   = m.tag;
  document.getElementById('biz-modal-title').textContent = m.modalTitle;
  msg.textContent = ''; msg.className = 'biz-msg';
  submit.disabled = false; submit.textContent = 'Propose';
  // renderBizResult may have rebound submit.onclick to closeBizModal
  // on a previous terminal-result state; re-attach the real submitter
  // every open so the next proposal flows correctly.
  submit.onclick = submitBizMotion;

  const currentVal = m.currentValueOf(_bizActiveParty);
  const currentHtml = motionType === 'modernize_image'
    ? (currentVal
        ? `<div class="biz-current"><span class="label">${escHtml(m.currentLabel)}</span><img src="${escHtml(currentVal)}" alt="" style="max-width:80px;max-height:80px;display:block;background:#000;border-radius:4px;"></div>`
        : `<div class="biz-current"><span class="label">${escHtml(m.currentLabel)}</span><em style="color:#666;">No custom logo on file.</em></div>`)
    : `<div class="biz-current"><span class="label">${escHtml(m.currentLabel)}</span>${
        currentVal ? escHtml(currentVal) : '<em style="color:#666;">Not set.</em>'
      }</div>`;

  let fieldHtml = '';
  if (motionType === 'modernize_image') {
    fieldHtml = `
      <div class="biz-field-label">${escHtml(m.fieldLabel)}</div>
      <label class="biz-file" for="biz-file-input">Choose an image…</label>
      <input type="file" id="biz-file-input" accept="image/png,image/jpeg,image/webp" style="display:none;">
      <div id="biz-file-preview"></div>`;
  } else if (motionType === 'change_slogan') {
    fieldHtml = `
      <div class="biz-field-label">${escHtml(m.fieldLabel)}</div>
      <input type="text" class="biz-input" id="biz-text-input" maxlength="${m.maxLength}" placeholder="${escHtml(m.placeholder)}">
      <div class="biz-counter" id="biz-counter">0 / ${m.maxLength}</div>`;
  } else {
    fieldHtml = `
      <div class="biz-field-label">${escHtml(m.fieldLabel)}</div>
      <textarea class="biz-textarea" id="biz-text-input" maxlength="${m.maxLength}" placeholder="${escHtml(m.placeholder)}">${escHtml(currentVal)}</textarea>
      <div class="biz-counter" id="biz-counter">${currentVal.length} / ${m.maxLength}</div>`;
  }

  body.innerHTML = currentHtml + fieldHtml;
  overlay.classList.add('open');

  if (motionType === 'modernize_image') {
    const input = document.getElementById('biz-file-input');
    input.addEventListener('change', () => handleFileSelect(input));
  } else {
    const input = document.getElementById('biz-text-input');
    const counter = document.getElementById('biz-counter');
    const update = () => {
      const len = input.value.length;
      counter.textContent = `${len} / ${m.maxLength}`;
      counter.classList.toggle('over', len > m.maxLength);
    };
    input.addEventListener('input', update);
    input.focus();
  }
}

function closeBizModal() {
  document.getElementById('biz-overlay').classList.remove('open');
  _bizActiveMotion = null;
}

// File handler: 2 MB limit per spec. Preview shows the selected file
// (name + size). The actual storage upload doesn't happen until
// Propose is pressed — otherwise opening + closing the modal twice
// would upload twice. The Propose handler uploads first, then calls
// the RPC with the public URL.
function handleFileSelect(input) {
  const file = input.files?.[0];
  const preview = document.getElementById('biz-file-preview');
  const msg     = document.getElementById('biz-msg');
  if (!file) { preview.innerHTML = ''; return; }
  msg.textContent = ''; msg.className = 'biz-msg';
  const MAX_BYTES = 2 * 1024 * 1024;
  if (file.size > MAX_BYTES) {
    msg.textContent = `Image is ${(file.size / 1024 / 1024).toFixed(2)} MB — must be 2 MB or smaller.`;
    msg.className = 'biz-msg err';
    input.value = '';
    preview.innerHTML = '';
    return;
  }
  const url = URL.createObjectURL(file);
  preview.innerHTML = `
    <div class="biz-preview">
      <img src="${url}" alt="">
      <div>
        <div class="name">${escHtml(file.name)}</div>
        <div class="size">${(file.size / 1024).toFixed(0)} KB · ${escHtml(file.type)}</div>
      </div>
    </div>`;
}

async function submitBizMotion() {
  const motionType = _bizActiveMotion;
  const m = BIZ_MOTIONS[motionType];
  if (!m || !_bizActiveParty) return;
  const msg    = document.getElementById('biz-msg');
  const submit = document.getElementById('biz-submit');
  msg.textContent = ''; msg.className = 'biz-msg';
  submit.disabled = true; submit.textContent = 'Working…';

  let payloadText = null;
  let payloadUrl  = null;
  try {
    if (motionType === 'modernize_image') {
      const fileInput = document.getElementById('biz-file-input');
      const file = fileInput?.files?.[0];
      if (!file) throw new Error('Choose an image first.');
      const ext = (file.name.split('.').pop() || 'png').toLowerCase();
      const path = `${_bizActiveParty.id}/logo_${Date.now()}.${ext}`;
      submit.textContent = 'Uploading…';
      const { error: upErr } = await _supabase.storage
        .from('party-logos')
        .upload(path, file, { cacheControl: '3600', upsert: true, contentType: file.type });
      if (upErr) throw new Error('Upload failed: ' + upErr.message);
      const { data: pub } = _supabase.storage.from('party-logos').getPublicUrl(path);
      payloadUrl = pub?.publicUrl;
      if (!payloadUrl) throw new Error('Could not resolve uploaded image URL.');
    } else {
      const input = document.getElementById('biz-text-input');
      payloadText = (input?.value || '').trim();
      if (!payloadText) throw new Error('Proposed text cannot be empty.');
      if (payloadText.length > m.maxLength) {
        throw new Error(`Too long — max ${m.maxLength} characters.`);
      }
    }

    submit.textContent = 'Resolving…';
    const { data, error } = await _supabase.rpc('propose_party_motion', {
      p_faction_id:   _viewerPolId,
      p_motion_type:  motionType,
      p_payload_text: payloadText,
      p_payload_url:  payloadUrl,
    });
    if (error) throw new Error(error.message);
    if (!data?.success) {
      throw new Error(BIZ_FAIL_REASONS[data?.reason] || `Could not propose: ${data?.reason || 'unknown'}.`);
    }

    renderBizResult(data);
  } catch (err) {
    msg.textContent = err.message || 'Could not propose.';
    msg.className = 'biz-msg err';
    submit.disabled = false; submit.textContent = 'Propose';
  }
}

// Renders the dice-roll narrative + final outcome inside the modal so
// the player sees the deputy cosign + member vote results before the
// page reloads. Reload only fires on pass — failures leave the page
// state intact so the player can immediately try a different motion.
function renderBizResult(data) {
  const msg    = document.getElementById('biz-msg');
  const submit = document.getElementById('biz-submit');
  const deputy = data.deputy_roll === 2
    ? `Deputy leader cosigned the motion <span class="roll">(1D2 = 2)</span>.`
    : `Deputy leader refused to cosign <span class="roll">(1D2 = 1)</span>.`;

  if (data.outcome === 'failed_petition') {
    msg.innerHTML = `${deputy}<br>The motion did not advance to a vote.`;
    msg.className = 'biz-msg err';
    submit.textContent = 'Close';
    submit.disabled = false;
    submit.onclick = closeBizModal;
    return;
  }

  const yesPct = Number(data.vote_yes_pct);
  const voteLine = `Members voted <strong>${yesPct}%</strong> yes <span class="roll">(1D100 = ${yesPct})</span>.`;
  if (data.outcome === 'passed') {
    msg.innerHTML = `${deputy}<br>${voteLine}<br>Motion <strong>passed</strong>. Reloading…`;
    msg.className = 'biz-msg ok';
    submit.textContent = 'Reloading…';
    setTimeout(() => location.reload(), 900);
  } else {
    msg.innerHTML = `${deputy}<br>${voteLine}<br>Motion failed to reach a simple majority.`;
    msg.className = 'biz-msg err';
    submit.textContent = 'Close';
    submit.disabled = false;
    submit.onclick = closeBizModal;
  }
}

// Modal wiring — bound once on page load. The submit button's onclick
// is overwritten by renderBizResult on terminal-result states (to
// turn it into a Close button), so submitBizMotion is reattached
// every time the modal opens via this rebind hook.
function bindBizModal() {
  const overlay = document.getElementById('biz-overlay');
  document.getElementById('biz-modal-x').onclick = closeBizModal;
  document.getElementById('biz-cancel').onclick  = closeBizModal;
  document.getElementById('biz-submit').onclick  = submitBizMotion;
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeBizModal(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeBizModal();
  });
}
bindBizModal();

init();
</script>
