<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose Your Archetype | Nationhood Alpha</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0:#0e0e0c; --bg-1:#1a1a1a; --bg-2:#1a1a17; --bg-3:#252525;
  --text-bright:#f0efe6; --text-primary:#c4c2b8; --text-muted:#666; --text-dim:#4a4940;
  --border-0:rgba(255,255,255,0.06); --border-1:rgba(255,255,255,0.08);
  --purple:#8b5cf6; --red:#c0564e;
  --font-mono:'JetBrains Mono',monospace; --font-ui:'IBM Plex Sans',sans-serif; --font-serif:'IBM Plex Serif',serif;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg-0); color:var(--text-primary); font-family:var(--font-ui);
  min-height:100vh; padding:40px 20px; }
.wrap { max-width:760px; margin:0 auto; }
.kicker { font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:0.12em;
  text-transform:uppercase; color:var(--purple); margin-bottom:6px; }
h1 { font-family:var(--font-serif); font-size:26px; color:var(--text-bright); margin-bottom:4px; }
.sub { font-size:12px; color:var(--text-muted); margin-bottom:24px; }
.arch-card { background:var(--bg-2); border:1px solid var(--border-1); border-left:3px solid var(--border-1);
  padding:20px; margin-bottom:12px; cursor:pointer; transition:border-color .15s, background .15s; }
.arch-card:hover { border-left-color:var(--purple); }
.arch-card.sel { border-color:var(--purple); border-left-color:var(--purple); background:var(--bg-3); }
.arch-name { font-family:var(--font-mono); font-size:15px; font-weight:800; letter-spacing:0.06em;
  color:var(--text-bright); margin-bottom:8px; }
.arch-quote { font-family:var(--font-serif); font-style:italic; font-size:13px; color:var(--purple);
  line-height:1.5; margin-bottom:10px; }
.arch-desc { font-size:12px; line-height:1.6; color:var(--text-primary); }
.stat-panel { background:var(--bg-2); border:1px solid var(--border-1); margin:18px 0; display:none; }
.stat-panel.show { display:block; }
.stat-row { display:flex; justify-content:space-between; padding:11px 18px; border-bottom:1px solid var(--border-0);
  font-size:13px; }
.stat-row:last-child { border-bottom:none; }
.stat-row .k { color:var(--text-primary); }
.stat-row .v { font-family:var(--font-mono); color:var(--text-bright); }
.stat-row.head { background:var(--bg-3); font-family:var(--font-mono); font-size:10px;
  text-transform:uppercase; letter-spacing:0.1em; color:var(--purple); }
.stat-row.total .k, .stat-row.total .v { font-weight:800; color:var(--text-bright); }
.stat-row.cash .v { color:#5cb85c; }
.btn { width:100%; padding:14px; font-family:var(--font-mono); font-size:12px; font-weight:700;
  letter-spacing:0.08em; text-transform:uppercase; background:var(--bg-3); border:1px solid var(--border-0);
  color:var(--text-dim); cursor:not-allowed; transition:all .15s; }
.btn.on { background:rgba(139,92,246,0.12); border-color:var(--purple); color:var(--text-bright); cursor:pointer; }
.err { display:none; font-family:var(--font-mono); font-size:11px; color:var(--red); margin-top:10px; line-height:1.5; }

/* Mobile refresh — single-column flow already; just tighten padding and
   shrink the heading so the card stack reads cleanly at 375px / 360px. */
@media (max-width: 640px) {
  body { padding: 24px 16px; }
  h1 { font-size: 22px; }
  .arch-card { padding: 16px; }
  .arch-name { font-size: 14px; }
  .stat-row { padding: 11px 14px; font-size: 12px; }
}
@media (max-width: 360px) {
  body { padding: 20px 12px; }
  .arch-card { padding: 14px; }
}
</style>
</head>
<body>
  <div class="wrap">
    <div class="kicker">Final Step</div>
    <h1>Choose Your Archetype</h1>
    <div class="sub" id="who">&nbsp;</div>
    <div id="cards"></div>
    <div class="stat-panel" id="stat-panel"></div>
    <button class="btn" id="create-btn" disabled>Create Entrepreneur</button>
    <div class="err" id="err"></div>
  </div>
<script type="module">
import { _supabase } from './js/supabase-client.js';
import { ENTREPRENEUR_ARCHETYPES } from './js/game/factions.js';

const setupRaw = sessionStorage.getItem('entrepreneur_setup');
let setup = null;
try { setup = setupRaw ? JSON.parse(setupRaw) : null; } catch { setup = null; }

let selectedKey = null;
let creating = false;
let currentUser = null;

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function fmtCash(n) { return '$' + (Number(n) / 1e6) + 'M'; }
function statTotal(st) { return st.influence + st.skill + st.reputation; }

function renderCards() {
  document.getElementById('cards').innerHTML = Object.entries(ENTREPRENEUR_ARCHETYPES).map(([key, a]) => `
    <div class="arch-card${selectedKey === key ? ' sel' : ''}" data-key="${key}">
      <div class="arch-name">${escapeHtml(a.name)}</div>
      <div class="arch-quote">&ldquo;${escapeHtml(a.quote)}&rdquo;</div>
      <div class="arch-desc">${escapeHtml(a.description)}</div>
    </div>`).join('');
  document.querySelectorAll('.arch-card').forEach(el =>
    el.addEventListener('click', () => selectArchetype(el.dataset.key)));
}

function selectArchetype(key) {
  selectedKey = key;
  renderCards();
  const a = ENTREPRENEUR_ARCHETYPES[key];
  const st = a.stats;
  const panel = document.getElementById('stat-panel');
  panel.innerHTML = `
    <div class="stat-row head"><span class="k">Stat</span><span class="v">Value</span></div>
    <div class="stat-row"><span class="k">Reputation</span><span class="v">${st.reputation}</span></div>
    <div class="stat-row"><span class="k">Influence</span><span class="v">${st.influence}</span></div>
    <div class="stat-row"><span class="k">Experience</span><span class="v">${st.skill}</span></div>
    <div class="stat-row total"><span class="k">Total</span><span class="v">${statTotal(st)}</span></div>
    <div class="stat-row cash"><span class="k">Capital</span><span class="v">${fmtCash(a.startingCash)}</span></div>`;
  panel.classList.add('show');
  const btn = document.getElementById('create-btn');
  btn.classList.add('on');
  btn.disabled = false;
}

async function createEntrepreneur() {
  if (creating || !selectedKey) return;
  const a = ENTREPRENEUR_ARCHETYPES[selectedKey];
  if (!a) return;
  const errEl = document.getElementById('err');
  const btn = document.getElementById('create-btn');
  creating = true;
  btn.disabled = true;
  btn.textContent = 'Creating…';
  errEl.style.display = 'none';
  try {
    // One entrepreneur per player.
    const { data: existing, error: existErr } = await _supabase
      .from('factions').select('id')
      .or(`id.eq.${currentUser.id},linked_user_id.eq.${currentUser.id}`)
      .eq('faction_type', 'entrepreneur').is('abandoned_at', null)
      .limit(1).maybeSingle();
    if (existErr) throw existErr;
    if (existing) {
      sessionStorage.removeItem('entrepreneur_setup');
      sessionStorage.removeItem('pending_faction_type');
      window.location.href = 'entrepreneur-dashboard.html';
      return;
    }

    // HARD LOCK: cannot originate in a nation where you hold a Political
    // Party or Military Branch (also enforced server-side by the
    // enforce_entrepreneur_nation_lock trigger — this is the friendly gate).
    const { data: ownFactions, error: ownErr } = await _supabase
      .from('factions')
      .select('faction_type, nation:nations!nation_id(name)')
      .or(`id.eq.${currentUser.id},linked_user_id.eq.${currentUser.id}`)
      .in('faction_type', ['party', 'military'])
      .is('abandoned_at', null);
    if (ownErr) throw ownErr;
    if ((ownFactions || []).some(f => f.nation?.name === setup.originNation)) {
      errEl.textContent = `You already hold a Political Party or Military Branch in ${setup.originNation}. An entrepreneur can't originate from a nation where you hold one — go back and pick a different origin.`;
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Create Entrepreneur'; creating = false;
      return;
    }
    // Primary slot decides primary vs linked. A swallowed error here
    // would flip isLinked and let the upsert overwrite an existing
    // primary faction — so abort on error rather than guess.
    const { data: primary, error: primErr } = await _supabase
      .from('factions').select('id').eq('id', currentUser.id).maybeSingle();
    if (primErr) throw primErr;

    const isLinked = !!primary;
    const factionId = isLinked ? crypto.randomUUID() : currentUser.id;
    const parts = String(setup.name).trim().split(/\s+/);
    const firstName = parts.shift() || setup.name;
    const lastName = parts.join(' ');
    // Per-archetype age override on the archetype object:
    //   • [min, max] tuple → random integer in the inclusive range
    //     (OPERATOR uses this — 20yr middle-management career → 45-55).
    //   • scalar number    → pinned exactly
    //     (PRODIGY uses this — quote says "twenty-five years old").
    //   • absent           → default 30 + 1d6 (31-36).
    // Without an override, PRODIGY's quote outright lied about the
    // character's age and OPERATOR's career arc started at age 11.
    const age = Array.isArray(a.age)
      ? a.age[0] + Math.floor(Math.random() * (a.age[1] - a.age[0] + 1))
      : (typeof a.age === 'number')
        ? a.age
        : 30 + (Math.floor(Math.random() * 6) + 1);

    const row = {
      id: factionId,
      faction_type: 'entrepreneur',
      faction_name: setup.name,
      nation: setup.originNation,            // current location at creation
      ent_origin_nation: setup.originNation, // immutable birthplace (20270491)
      nation_id: null,                       // nation-agnostic by design
      seats: 0,
      abandoned_at: null,
      leader_first_name: firstName,
      leader_last_name: lastName,
      leader_age: age,
      entrepreneur_archetype: selectedKey,
      ent_influence: a.stats.influence,
      ent_skill: a.stats.skill,
      ent_reputation: a.stats.reputation,
      ent_starting_cash: a.startingCash,
      party_funds: a.startingCash,  // live balance = starting cash (one source)
    };
    if (isLinked) row.linked_user_id = currentUser.id;

    const { error: writeErr } = isLinked
      ? await _supabase.from('factions').insert(row)
      : await _supabase.from('factions').upsert(row);
    if (writeErr) {
      const msg = /HARD_LOCK_ENTREPRENEUR_NATION/.test(writeErr.message || '')
        ? `You already hold a Political Party or Military Branch in ${setup.originNation}. An entrepreneur can't originate there — go back and pick a different origin.`
        : 'Could not create: ' + (writeErr.message || 'unknown error');
      errEl.textContent = msg;
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Create Entrepreneur'; creating = false;
      return;
    }
    sessionStorage.setItem('active_faction_id', factionId);
    sessionStorage.removeItem('entrepreneur_setup');
    sessionStorage.removeItem('pending_faction_type');
    sessionStorage.removeItem('nationhood_pending_nation');
    window.location.href = 'entrepreneur-dashboard.html';
  } catch (e) {
    errEl.textContent = 'Failed to create: ' + (e?.message || e);
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Create Entrepreneur'; creating = false;
  }
}

(async () => {
  try {
    const { data: { user } } = await _supabase.auth.getUser();
    if (!user) { window.location.href = 'login.html'; return; }
    currentUser = user;
    if (!setup || !setup.name || !setup.originNation) {
      // Reached without completing the prior steps — restart the flow.
      window.location.href = 'faction-select.html';
      return;
    }
    document.getElementById('who').textContent =
      `${setup.name} · from ${setup.originNation}`;
    renderCards();
    document.getElementById('create-btn').addEventListener('click', createEntrepreneur);
  } catch (e) {
    // Loud, not silent — a failed auth/init must not leave a blank page.
    const errEl = document.getElementById('err');
    errEl.textContent = 'Failed to load — please refresh. (' + (e?.message || e) + ')';
    errEl.style.display = 'block';
  }
})();
</script>
</body>
</html>
