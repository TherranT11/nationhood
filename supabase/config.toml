# supabase/config.toml — edge function auth configuration.
#
# Created 20261203 to disable inbound JWT verification on
# advance-corp-tick. advance-tick triggers it server-to-server with
# the platform-injected SUPABASE_SERVICE_ROLE_KEY, which on this
# project is the new opaque secret format (sb_secret_*), not a
# legacy JWT. The default verify_jwt=true rejects opaque tokens with
# UNAUTHORIZED_INVALID_JWT_FORMAT before the function body runs.
#
# Disabling verify_jwt keeps the platform-level apikey header check
# intact, so callers still need a valid project key to invoke the
# function. The function itself is only triggered by advance-tick
# and the pg_cron job — neither of which need JWT claims; both
# possess the service role secret.

project_id = "pbumjalxclmegzckhqqr"

[functions.advance-corp-tick]
verify_jwt = false
