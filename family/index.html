<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROME — Family</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --stone:#14110d; --stone-lit:#1e1a13; --edge:#322a1e;
    --marble:#e8e0cf; --marble-dim:#9a8f78; --faint:#5f5643;
    --gold:#c8a24a; --blood:#7a2f26;
    --display:'Cinzel',serif; --body:'EB Garamond',serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--stone); color:var(--marble); font-family:var(--body);
    font-size:18px; line-height:1.6; min-height:100vh; display:flex; flex-direction:column; }

  /* ---- top bar (matches home) ---- */
  .topbar { display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    gap:1rem; padding:0.85rem 1.5rem; background:var(--stone-lit); border-bottom:1px solid var(--edge); }
  .time { display:flex; align-items:center; flex-wrap:wrap; }
  .time .cell { display:flex; align-items:baseline; gap:0.5rem; padding:0 1.15rem; border-right:1px solid var(--edge); }
  .time .cell:first-child { padding-left:0; }
  .time .cell:last-child { border-right:none; }
  .time .lbl { font-family:var(--display); font-size:0.6rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--marble-dim); }
  .time .val { font-family:var(--display); font-weight:600; font-size:0.9rem; color:var(--marble); }
  .time .val.gold { color:var(--gold); }
  .time .val.pending { color:var(--faint); }
  .family-head { text-align:center; }
  .family-head .name { font-family:var(--display); font-weight:700; font-size:1.05rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--gold); }
  .family-head .rank { font-family:var(--display); font-size:0.58rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--marble-dim); margin-top:1px; }
  .top-right { display:flex; justify-content:flex-end; }
  .logout { font-family:var(--display); font-size:0.62rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--marble-dim); background:none; border:1px solid var(--edge); padding:0.5rem 1rem; cursor:pointer; transition:border-color 0.2s, color 0.2s; }
  .logout:hover { border-color:var(--blood); color:var(--marble); }

  /* ---- frame ---- */
  .frame { flex:1; display:flex; min-height:0; }
  .sidebar { width:190px; min-width:190px; background:var(--stone-lit); border-right:1px solid var(--edge); padding-top:0.5rem; display:flex; flex-direction:column; }
  .nav-item { display:flex; align-items:center; gap:0.75rem; width:100%; text-align:left; font-family:var(--display); font-weight:600; font-size:0.72rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--marble-dim); background:none; border:none; border-left:3px solid transparent; padding:0.9rem 1.4rem; cursor:pointer; transition:color 0.15s, background 0.15s; }
  .nav-item:hover { color:var(--marble); }
  .nav-item.on { color:var(--gold); background:#1a1509; border-left-color:var(--gold); }
  .nav-item .glyph { width:6px; height:6px; transform:rotate(45deg); background:currentColor; opacity:0.7; flex:none; }
  .sidebar-foot { margin-top:auto; padding:1rem 1.4rem; font-family:var(--display); font-size:0.55rem; letter-spacing:0.24em; text-transform:uppercase; color:var(--faint); }
  .content { flex:1; padding:2rem 1.75rem 3rem; overflow:auto; }

  .fam-wrap { width:min(1000px,100%); margin:0 auto; }
  .page-title { font-family:var(--display); font-weight:600; font-size:0.72rem; letter-spacing:0.26em; text-transform:uppercase; color:var(--marble-dim); text-align:center; margin-bottom:1.75rem; }
  .sec-title { font-family:var(--display); font-weight:600; font-size:0.62rem; letter-spacing:0.24em; text-transform:uppercase; color:var(--gold); border-bottom:1px solid var(--edge); padding-bottom:0.5rem; margin:2rem 0 1.1rem; }

  /* ---- head of household card ---- */
  .hoh { background:var(--stone-lit); border:1px solid var(--gold); display:flex; gap:0; position:relative; }
  .hoh::before, .hoh::after { content:""; position:absolute; width:14px; height:14px; border:1px solid var(--gold); opacity:0.55; }
  .hoh::before { top:6px; left:6px; border-right:none; border-bottom:none; }
  .hoh::after { bottom:6px; right:6px; border-left:none; border-top:none; }
  .hoh-body { flex:1; padding:1.75rem 2rem; }
  .hoh-name { font-family:var(--display); font-weight:700; font-size:1.5rem; letter-spacing:0.06em; }
  .hoh-title { color:var(--marble-dim); font-style:italic; margin-top:0.15rem; margin-bottom:1.3rem; }
  .stat-row { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; }
  .stat { border:1px solid var(--edge); background:var(--stone); padding:0.9rem 1rem; text-align:center; }
  .stat .lbl { display:block; font-family:var(--display); font-size:0.55rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--marble-dim); margin-bottom:0.3rem; }
  .stat .val { font-family:var(--display); font-weight:600; font-size:1.5rem; }
  .stat .val.gold { color:var(--gold); }
  .hoh-facts { display:flex; gap:2rem; margin-top:1.3rem; padding-top:1.1rem; border-top:1px solid var(--edge); flex-wrap:wrap; }
  .fact { display:flex; flex-direction:column; gap:2px; }
  .fact .k { font-family:var(--display); font-size:0.55rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--marble-dim); }
  .fact .v { color:var(--marble); }
  .fact .v.dim { color:var(--faint); }

  /* ---- household ---- */
  .tree { display:flex; flex-direction:column; align-items:center; }
  .kin-card { background:var(--stone-lit); border:1px solid var(--edge); padding:1rem 1.4rem;
    min-width:200px; text-align:center; }
  .kin-name { font-family:var(--display); font-weight:600; font-size:1rem; letter-spacing:0.06em; }
  .kin-sub { font-size:0.85rem; font-style:italic; color:var(--marble-dim); margin-top:0.15rem; }
  .kin-mini { display:flex; justify-content:center; gap:0.9rem; margin-top:0.55rem; font-size:0.78rem; color:var(--faint); }
  .kin-mini b { font-family:var(--display); font-weight:600; color:var(--marble-dim); }
  .issue-stub { width:1px; height:32px; background:linear-gradient(180deg,var(--gold),transparent); opacity:0.4; margin-top:1rem; }
  .issue-note { font-size:0.82rem; font-style:italic; color:var(--faint); margin-top:0.6rem; }
</style>
</head>
<body>

<header class="topbar">
  <div class="time">
    <span class="cell"><span class="lbl">Year</span><span class="val gold">300 BC</span></span>
    <span class="cell"><span class="lbl">Season</span><span class="val">Spring</span></span>
    <span class="cell"><span class="lbl">Countdown</span><span class="val pending">&mdash;</span></span>
  </div>
  <div class="family-head">
    <div class="name">&nbsp;</div>
    <div class="rank">&nbsp;</div>
  </div>
  <div class="top-right"><button class="logout" id="logout">Log Out</button></div>
</header>

<div class="frame">
  <nav class="sidebar" aria-label="Main navigation">
    <button class="nav-item" onclick="location.href='/home/'"><span class="glyph" aria-hidden="true"></span>Home</button>
    <button class="nav-item on"><span class="glyph" aria-hidden="true"></span>Family</button>
    <div class="sidebar-foot">S &middot; P &middot; Q &middot; R</div>
  </nav>

  <main class="content">
    <div class="fam-wrap">
      <h1 class="page-title" id="page-title">&nbsp;</h1>

      <!-- HEAD OF HOUSEHOLD -->
      <h2 class="sec-title">Head of Household</h2>
      <section class="hoh">
        <div class="hoh-body">
          <div class="hoh-name" id="hoh-name">&nbsp;</div>
          <p class="hoh-title" id="hoh-title">&nbsp;</p>

          <div class="stat-row">
            <div class="stat"><span class="lbl">Denarii</span><span class="val gold" id="hoh-denarii">&mdash;</span></div>
            <div class="stat"><span class="lbl">Influence</span><span class="val" id="hoh-influence">&mdash;</span></div>
            <div class="stat"><span class="lbl">Strategy</span><span class="val" id="hoh-strategy">&mdash;</span></div>
          </div>

          <div class="hoh-facts">
            <span class="fact"><span class="k">Standing</span><span class="v">Plebeian</span></span>
            <span class="fact"><span class="k">Office</span><span class="v dim">None held</span></span>
            <span class="fact"><span class="k">Location</span><span class="v" id="hoh-location">&mdash;</span></span>
          </div>
        </div>
      </section>

      <!-- THE HOUSEHOLD -->
      <h2 class="sec-title">The Household</h2>
      <div class="tree">
        <div class="kin-card">
          <div class="kin-name" id="kin-name">&nbsp;</div>
          <div class="kin-sub">Pater Familias</div>
          <div class="kin-mini"><span><b>Inf</b> <span id="kin-inf">&mdash;</span></span><span><b>Str</b> <span id="kin-str">&mdash;</span></span></div>
        </div>
        <div class="issue-stub" aria-hidden="true"></div>
        <p class="issue-note">The house has no spouse or children yet.</p>
      </div>

    </div>
  </main>
</div>

<script type="module">
  import { signOut, currentCharacter } from '../supabase.js';
  import { gensName, BIRTHPLACES } from '../names.js';

  const $ = (id) => document.getElementById(id);
  const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : '');

  // Gate + populate. Only a signed-in player with a founded gens belongs here.
  (async () => {
    const { data: c } = await currentCharacter();
    if (!c) { window.location.href = '/'; return; }

    const gens = gensName(c.nomen);
    const region = BIRTHPLACES.find((b) => b.key === c.birthplace);
    const fullName = c.praenomen + ' ' + c.nomen;

    document.querySelector('.family-head .name').textContent = 'Gens ' + gens;
    document.querySelector('.family-head .rank').textContent = 'Plebeian House · ' + (region ? region.name : '—');

    $('page-title').textContent = 'The Gens ' + gens;
    $('hoh-name').textContent = fullName;
    $('hoh-title').textContent = 'Head of the Gens ' + gens;
    $('hoh-denarii').textContent = c.denarii;
    $('hoh-influence').textContent = c.influence;
    $('hoh-strategy').textContent = c.strategy;
    $('hoh-location').textContent = cap(c.location);

    $('kin-name').textContent = fullName;
    $('kin-inf').textContent = c.influence;
    $('kin-str').textContent = c.strategy;
  })();

  // Log Out → shared signOut, then back to the front door. Guarded.
  const logoutBtn = $('logout');
  logoutBtn.addEventListener('click', async () => {
    if (logoutBtn.disabled) return;
    logoutBtn.disabled = true; logoutBtn.textContent = 'Departing…';
    try { await signOut(); } catch (err) { /* redirect regardless so no stuck session traps the player */ }
    window.location.href = '/';
  });
</script>

</body>
</html>
