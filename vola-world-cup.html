<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vola World Cup</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  :root{
    --bg:#080808; --panel:#0d0d0d; --panel2:#101010;
    --line:rgba(255,255,255,0.07); --txt:#d4d4d4; --mut:#888; --faint:#666;
    --teal:#7a9aab; --teal2:#a5c0d0; --gold:#d4b87a;
  }
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,system-ui,sans-serif;min-height:100vh;}
  .content{padding:30px 22px;}
  .wrap{max-width:1280px;margin:0 auto;}

  .crumb{font-size:9px;letter-spacing:0.13em;color:var(--faint);margin-bottom:16px;text-transform:uppercase;}
  .crumb a{color:var(--mut);text-decoration:none;}
  .crumb a:hover{color:var(--teal2);}
  .crumb .sep{margin:0 7px;color:#3a3a3a;}

  .page-header{margin-bottom:22px;}
  .ph-eyebrow{font-size:10px;letter-spacing:0.18em;color:var(--teal);text-transform:uppercase;
    font-family:monospace;margin-bottom:10px;}
  .ph-title{font-size:30px;font-weight:600;letter-spacing:-0.01em;color:#fff;}
  .ph-title .serif{font-family:Georgia,'Times New Roman',serif;font-style:italic;color:var(--teal2);}
  .ph-sub{font-size:11px;color:var(--mut);letter-spacing:0.05em;margin-top:9px;}
  .ph-sub b{color:var(--gold);font-weight:600;}

  /* National-team campaign summary */
  .vola-campaign{font-size:12px;color:#ccc;line-height:1.6;margin-bottom:22px;
    background:#0e1218;border-left:3px solid var(--teal);border-radius:4px;padding:11px 15px;}
  .vola-campaign b{color:#fff;}

  .section-head{font-size:10px;letter-spacing:0.16em;color:var(--mut);text-transform:uppercase;
    font-family:monospace;margin:26px 0 12px;}

  /* Groups: responsive auto-fit so 1–3 group panels sit per row by width. */
  .group-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(320px, 1fr));gap:14px;}
  .panel{background:var(--panel);border:0.5px solid var(--line);border-radius:6px;padding:14px 16px;}
  .panel .pt{font-size:9px;letter-spacing:0.14em;color:var(--faint);font-weight:700;
    font-family:monospace;text-transform:uppercase;margin-bottom:10px;}

  /* Standings table */
  .vstand{width:100%;border-collapse:collapse;}
  .vstand th{font-size:8px;letter-spacing:0.08em;color:var(--faint);font-weight:700;
    font-family:monospace;text-align:right;padding:0 6px 6px;}
  .vstand th.team{text-align:left;}
  .vstand td{font-size:11.5px;color:#bbb;text-align:right;padding:6px;
    border-top:0.5px dashed rgba(255,255,255,0.06);font-family:monospace;}
  .vstand td.team{text-align:left;font-family:inherit;color:#ddd;}
  .vstand td.team .seed{color:var(--faint);font-family:monospace;font-size:9px;margin-right:6px;}
  .vstand td.pts{color:#fff;font-weight:700;}
  .vstand tr.us td{color:var(--teal2);}
  .vstand tr.us td.team{color:var(--teal2);font-weight:700;}
  .vstand tr.qual td.team{border-left:2px solid var(--teal);padding-left:8px;}

  .qual-note{font-size:9px;color:var(--faint);font-style:italic;margin-top:8px;}

  /* Fixtures + bracket rows */
  .fix-head{font-size:8px;letter-spacing:0.12em;color:var(--faint);font-weight:700;
    font-family:monospace;margin:12px 0 6px;}
  .vrow{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#bbb;
    padding:5px 0;border-bottom:0.5px dashed rgba(255,255,255,0.05);}
  .vrow:last-child{border-bottom:none;}
  .vrow .us{color:var(--teal2);font-weight:700;}
  .vrow .score{font-family:monospace;color:#fff;flex-shrink:0;}
  .vrow .pending{font-family:monospace;color:var(--faint);flex-shrink:0;font-style:italic;}
  .vrow .rd{color:var(--faint);font-family:monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;}
  .vrow .pos{font-family:monospace;color:var(--faint);flex-shrink:0;width:24px;}

  .ko-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:14px;}

  .empty{font-size:11px;color:var(--faint);font-style:italic;font-family:monospace;padding:10px 2px;}
  .loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--mut);font-family:monospace;font-size:10px;letter-spacing:0.18em;}
</style>
</head>
<body>
<div id="pol-topbar-container"></div>
<div id="ent-topbar"></div>

<div class="content" id="content" style="display:none;">
  <div class="wrap">
    <div class="crumb" id="crumb">
      <a href="politician-nation.html">Nation</a><span class="sep">·</span>Vola World Cup
    </div>
    <div class="page-header">
      <div class="ph-eyebrow">— International Tournament —</div>
      <h1 class="ph-title">Vola <span class="serif">World Cup</span></h1>
      <div class="ph-sub" id="ph-sub">—</div>
    </div>

    <div class="vola-campaign" id="campaign"></div>

    <div class="section-head">Hosting</div>
    <div class="panel" id="hosting"></div>

    <div class="section-head">Qualifier Round</div>
    <div class="panel" id="qualifiers"></div>

    <div class="section-head">Group Stage</div>
    <div class="group-grid" id="groups"></div>

    <div class="section-head">Knockout Bracket</div>
    <div class="ko-grid" id="knockout"></div>

    <div class="section-head">Final Standings</div>
    <div class="panel" id="standings"></div>
  </div>
</div>

<div id="loading" class="loading">LOADING…</div>

<script type="module">
import { bootstrapPoliticianOrBusinessman } from './js/politician-topbar.js';
import { _supabase } from './js/supabase-client.js';
import { escapeHtml as esc, tickToDate } from './js/utils.js';

const ELIM_LABEL = { champion: 'champions of the world', final: 'beaten finalists',
  semifinal: 'eliminated in the semifinals', quarterfinal: 'eliminated in the quarterfinals',
  group_stage: 'out at the group stage', placement: 'placed in the qualifiers' };
const KO_LABEL = { QF: 'Quarterfinal', SF: 'Semifinal', F: 'The Final' };
const ORD = n => `${n}${['st','nd','rd'][n - 1] || 'th'}`;

async function init() {
  let ctx = null;
  try { ctx = await bootstrapPoliticianOrBusinessman('nation', 'nation'); }
  catch (err) {
    console.error('vola-world-cup: bootstrap failed', err);
    document.getElementById('loading').textContent = 'Failed to load. Please reload the page.';
    return;
  }
  if (!ctx) return;  // bootstrap redirected (no auth)

  const usId = ctx.nation?.id || ctx.faction?.nation_id || null;

  try {
    await loadCup(usId);
  } catch (err) {
    console.error('vola-world-cup: load failed', err);
    document.getElementById('loading').textContent = 'Could not load the cup — please reload.';
    return;
  }

  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}

async function loadCup(usId) {
  // Latest cup = highest cup_number drawn.
  const { data: latest, error: lErr } = await _supabase
    .from('vola_cup_groups').select('cup_number')
    .order('cup_number', { ascending: false }).limit(1).maybeSingle();
  if (lErr) throw lErr;
  if (!latest) {
    document.getElementById('ph-sub').textContent = 'The first Vola World Cup hasn’t been drawn yet.';
    document.getElementById('campaign').style.display = 'none';
    renderHosting(null, [], usId);
    renderQualifiers([], usId);
    renderGroups([], [], usId);
    renderKnockout([], usId);
    renderStandings([], usId);
    return;
  }
  const cup = latest.cup_number;

  const [groupsRes, matchesRes, koRes, standRes, placeRes] = await Promise.all([
    _supabase.from('vola_cup_groups')
      .select('nation_id, group_letter, seed_rank, qualified_via, nation:nations!nation_id(name)')
      .eq('cup_number', cup).order('group_letter').order('seed_rank'),
    _supabase.from('vola_cup_group_matches')
      .select('group_letter, round_number, scheduled_tick, team_a_score, team_b_score, team_a_nation_id, team_b_nation_id, winner_nation_id, team_a:nations!team_a_nation_id(name), team_b:nations!team_b_nation_id(name)')
      .eq('cup_number', cup).order('round_number'),
    _supabase.from('vola_cup_knockout')
      .select('round, match_number, scheduled_tick, team_a_score, team_b_score, team_a_nation_id, team_b_nation_id, winner_nation_id, team_a:nations!team_a_nation_id(name), team_b:nations!team_b_nation_id(name)')
      .eq('cup_number', cup).order('match_number'),
    _supabase.from('vola_cup_final_standings')
      .select('nation_id, final_position, eliminated_at, nation:nations!nation_id(name)')
      .eq('cup_number', cup).order('final_position'),
    _supabase.from('vola_placement_matches')
      .select('match_number, scheduled_tick, team_a_score, team_b_score, team_a_nation_id, team_b_nation_id, winner_nation_id, team_a:nations!team_a_nation_id(name), team_b:nations!team_b_nation_id(name)')
      .eq('cup_number', cup).order('match_number'),
  ]);
  for (const r of [groupsRes, matchesRes, koRes, standRes, placeRes]) { if (r.error) throw r.error; }
  const groups    = groupsRes.data  || [];
  const matches   = matchesRes.data || [];
  const knockout  = koRes.data      || [];
  const standings = standRes.data   || [];
  const placement = placeRes.data   || [];

  // Host + bidding race (vola_cup_hosts / vola_host_bids — both
  // authenticated-read, 20260920). Defensive: a read hiccup just drops
  // the hosting panel rather than failing the page.
  let host = null, bids = [];
  try {
    const [hRes, bRes] = await Promise.all([
      _supabase.from('vola_cup_hosts')
        .select('host_nation_id, home_advantage, winning_score, nation:nations!host_nation_id(name)')
        .eq('cup_number', cup).maybeSingle(),
      _supabase.from('vola_host_bids')
        .select('nation_id, bid_score, won, nation:nations!nation_id(name)')
        .eq('cup_number', cup).order('bid_score', { ascending: false }),
    ]);
    host = hRes.data || null;
    bids = bRes.data || [];
  } catch (_) { /* omit hosting panel */ }

  const champion = standings.find(s => s.final_position === 1);
  const mine     = groups.find(g => g.nation_id === usId);
  const myStand  = standings.find(s => s.nation_id === usId);

  // ── Header sub-line ──
  const hostName = host?.nation?.name || null;
  document.getElementById('ph-sub').innerHTML =
    `Cup <b>#${cup}</b>${hostName ? ` · Hosted by <b>${esc(hostName)}</b>` : ''} · ` +
    (champion ? `Champions: <b>${esc(champion.nation?.name || '—')}</b>` : '<b>In progress</b>');

  // ── National-team campaign line ──
  const campaignEl = document.getElementById('campaign');
  if (myStand) {
    campaignEl.innerHTML = `Your national team finished <b>${ORD(myStand.final_position)}</b> — ${ELIM_LABEL[myStand.eliminated_at] || esc(myStand.eliminated_at)}.`;
  } else if (mine) {
    // Pull the viewer's W/P from the single W-L-T source (computeStandings)
    // rather than re-counting here, so the campaign line can't drift from
    // the group table.
    const myRow = computeStandings(
      groups.filter(g => g.group_letter === mine.group_letter),
      matches.filter(m => m.group_letter === mine.group_letter),
      usId,
    ).find(r => r.nation_id === usId);
    const wins = myRow?.W || 0, played = myRow?.P || 0;
    campaignEl.innerHTML = `Your national team is seeded <b>#${mine.seed_rank}</b> in <b>Group ${esc(mine.group_letter)}</b> (${mine.qualified_via === 'auto' ? 'automatic qualifier' : 'qualified on placement'}) — <b>${wins}</b> win${wins === 1 ? '' : 's'} from ${played} played. The campaign is alive.`;
  } else {
    campaignEl.innerHTML = 'Your national team did not qualify for this cup. The next cycle is the road back.';
  }

  renderHosting(host, bids, usId);
  renderQualifiers(placement, usId);
  renderGroups(groups, matches, usId);
  renderKnockout(knockout, usId);
  renderStandings(standings, usId);
}

// Team name span, accented when it's the viewer's nation.
const nm = (n, id, usId) => `<span class="${id === usId ? 'us' : ''}">${esc(n?.name || '—')}</span>`;

function matchRow(m, usId) {
  const played = m.team_a_score != null && m.team_b_score != null;
  return `<div class="vrow">
    <span>${nm(m.team_a, m.team_a_nation_id, usId)} vs ${nm(m.team_b, m.team_b_nation_id, usId)}</span>
    ${played
      ? `<span class="score">${m.team_a_score}–${m.team_b_score}</span>`
      : `<span class="pending">${esc(tickToDate(m.scheduled_tick))}</span>`}
  </div>`;
}

// Derive W-L-T-Pts from played group matches (no stored standings table).
// A draw = equal scores; otherwise winner_nation_id (falling back to the
// higher score) takes the win. Sorted by Pts → goal difference → goals
// for → name, mirroring the knockout-seeding order.
function computeStandings(teams, groupMatches, usId) {
  const rows = teams.map(t => ({
    nation_id: t.nation_id, name: t.nation?.name || '—', seed: t.seed_rank,
    P: 0, W: 0, L: 0, T: 0, GF: 0, GA: 0, GD: 0, Pts: 0, us: t.nation_id === usId,
  }));
  const byId = Object.fromEntries(rows.map(r => [r.nation_id, r]));
  for (const m of groupMatches) {
    if (m.team_a_score == null || m.team_b_score == null) continue;  // unplayed
    const a = byId[m.team_a_nation_id], b = byId[m.team_b_nation_id];
    if (!a || !b) continue;
    a.P++; b.P++;
    a.GF += m.team_a_score; a.GA += m.team_b_score;
    b.GF += m.team_b_score; b.GA += m.team_a_score;
    if (m.team_a_score === m.team_b_score) {
      a.T++; b.T++; a.Pts++; b.Pts++;
    } else {
      const aWon = m.winner_nation_id ? m.winner_nation_id === a.nation_id : m.team_a_score > m.team_b_score;
      if (aWon) { a.W++; b.L++; a.Pts += 3; } else { b.W++; a.L++; b.Pts += 3; }
    }
  }
  rows.forEach(r => { r.GD = r.GF - r.GA; });
  rows.sort((x, y) => y.Pts - x.Pts || y.GD - x.GD || y.GF - x.GF || x.name.localeCompare(y.name));
  return rows;
}

function renderGroups(groups, matches, usId) {
  const host = document.getElementById('groups');
  const letters = [...new Set(groups.map(g => g.group_letter))].sort();
  if (!letters.length) { host.innerHTML = '<div class="empty">The draw hasn’t been made yet.</div>'; return; }

  host.innerHTML = letters.map(L => {
    const teams   = groups.filter(g => g.group_letter === L);
    const gMatches = matches.filter(m => m.group_letter === L);
    const table   = computeStandings(teams, gMatches, usId);

    const rowsHtml = table.map((r, i) => `
      <tr class="${r.us ? 'us ' : ''}${i < 2 ? 'qual' : ''}">
        <td class="team"><span class="seed">${r.seed}</span>${esc(r.name)}</td>
        <td>${r.P}</td><td>${r.W}</td><td>${r.L}</td><td>${r.T}</td><td class="pts">${r.Pts}</td>
      </tr>`).join('');

    const fixturesHtml = gMatches.length
      ? gMatches.map(m => matchRow(m, usId)).join('')
      : '<div class="empty">Not yet scheduled.</div>';

    return `<div class="panel">
      <div class="pt">Group ${esc(L)}</div>
      <table class="vstand">
        <thead><tr><th class="team">Team</th><th>P</th><th>W</th><th>L</th><th>T</th><th>Pts</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
      <div class="qual-note">Top two advance; the two best third-placed teams also qualify.</div>
      <div class="fix-head">Fixtures</div>
      ${fixturesHtml}
    </div>`;
  }).join('');
}

function renderHosting(host, bids, usId) {
  const el = document.getElementById('hosting');
  if (!host || !host.host_nation_id) {
    el.innerHTML = '<div class="empty">The host hasn’t been awarded yet.</div>';
    return;
  }
  const score = host.winning_score != null ? ` · winning bid ${Math.round(host.winning_score)}` : '';
  const hostRow = `<div class="vrow${host.host_nation_id === usId ? ' us' : ''}">
    <span>🏟️ ${nm(host.nation, host.host_nation_id, usId)} — host nation</span>
    <span class="score">+${host.home_advantage} home${score}</span>
  </div>`;
  // Optional bidding race — every nation that bid to host, strongest first.
  const bidRows = bids.length ? '<div class="fix-head">Host bids</div>' + bids.map(b => `
    <div class="vrow${b.nation_id === usId ? ' us' : ''}">
      <span>${nm(b.nation, b.nation_id, usId)}${b.won ? ' · won' : ''}</span>
      <span class="score">${b.bid_score != null ? Math.round(b.bid_score) : '—'}</span>
    </div>`).join('') : '';
  el.innerHTML = hostRow + bidRows;
}

function renderQualifiers(placement, usId) {
  const el = document.getElementById('qualifiers');
  if (!placement.length) {
    el.innerHTML = '<div class="empty">No qualifier round this cycle.</div>';
    return;
  }
  el.innerHTML = '<div class="qual-note">Bottom-three play-in round — fills the final two group slots.</div>'
    + placement.map(m => matchRow(m, usId)).join('');
}

function renderKnockout(knockout, usId) {
  const host = document.getElementById('knockout');
  if (!knockout.length) {
    host.innerHTML = '<div class="empty">The bracket forms once the group stage is decided.</div>';
    return;
  }
  host.innerHTML = ['QF', 'SF', 'F'].map(rd => {
    const ms = knockout.filter(k => k.round === rd);
    if (!ms.length) return '';
    return `<div class="panel">
      <div class="pt">${KO_LABEL[rd]}</div>
      ${ms.map(m => matchRow(m, usId)).join('')}
    </div>`;
  }).join('');
}

function renderStandings(standings, usId) {
  const host = document.getElementById('standings');
  if (!standings.length) {
    host.innerHTML = '<div class="empty">The cup is still being played.</div>';
    return;
  }
  host.innerHTML = standings.map(s => `
    <div class="vrow${s.nation_id === usId ? ' us' : ''}">
      <span class="pos">${s.final_position}.</span>
      <span style="flex:1;">${s.final_position === 1 ? '🏆 ' : ''}${nm(s.nation, s.nation_id, usId)}</span>
      <span class="rd">${esc(ELIM_LABEL[s.eliminated_at] || s.eliminated_at)}</span>
    </div>`).join('');
}

init();
</script>
</body>
</html>
