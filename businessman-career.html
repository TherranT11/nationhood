<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career | Nationhood</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root { --font-mono: 'JetBrains Mono', monospace; --font-ui: 'IBM Plex Sans', -apple-system, sans-serif; }
  /* Page chrome (topbar/nav/.ent-content) is injected by
     js/entrepreneur-topbar.js — shared with the entrepreneur pages. */
  .biz-wrap { max-width:1280px; margin:0 auto; }
  .biz-actions { display:flex; gap:10px; margin-bottom:26px; }
  .biz-btn { padding:11px 18px; background:rgba(138,170,106,0.08); border:0.5px solid #4a6a4a;
    border-radius:4px; color:#8aaa6a; font-family:var(--font-mono); font-size:10px;
    letter-spacing:0.13em; font-weight:700; cursor:pointer; }
  .biz-btn:hover:not(:disabled) { background:rgba(138,170,106,0.18); color:#aac88a; }
  .biz-btn:disabled { opacity:0.4; cursor:not-allowed; }

  .biz-section { margin-bottom:30px; }
  .biz-section .sec-lab { font-family:var(--font-mono); font-size:9px; letter-spacing:0.18em;
    color:#666; font-weight:700; margin-bottom:10px; }
  .biz-soon { padding:26px 16px; text-align:center; color:#555; font-size:11.5px;
    font-style:italic; background:#0a0a0a; border:0.5px dashed rgba(255,255,255,0.08);
    border-radius:5px; }

  .hist-list { display:flex; flex-direction:column; gap:8px; }
  .hist-row { display:flex; align-items:baseline; gap:14px; padding:13px 16px; background:#0d0d0d;
    border:0.5px solid rgba(255,255,255,0.08); border-radius:5px; }
  .hist-year { font-family:var(--font-mono); font-size:11px; color:#8aaa6a; font-weight:700;
    flex-shrink:0; width:44px; }
  .hist-info { min-width:0; }
  .hist-label { font-size:13px; color:#fff; line-height:1.4; }
  .hist-sub { font-family:var(--font-mono); font-size:10px; color:#888; margin-top:3px; }
  #loading { font-family:var(--font-mono); font-size:10px; color:#4a4940;
    text-align:center; padding:80px 20px; }
</style>
</head>
<body>

<div id="ent-topbar"></div>
<div id="loading">LOADING...</div>
<div class="ent-content" id="page-content" style="display:none;">
  <div class="biz-wrap">
    <div class="biz-actions">
      <button type="button" class="biz-btn" disabled title="Coming soon">APPLY FOR JOB</button>
      <button type="button" class="biz-btn" disabled title="Coming soon">START COMPANY</button>
    </div>

    <div class="biz-section">
      <div class="sec-lab">I. CAREER LADDERS</div>
      <div class="biz-soon">The ladders open with the first employers — join a corporation and climb.</div>
    </div>

    <div class="biz-section">
      <div class="sec-lab">II. CAREER HISTORY</div>
      <div class="hist-list" id="hist-list"></div>
    </div>
  </div>
</div>

<script type="module">
import { bootstrapBusinessman } from './js/entrepreneur-topbar.js';
import { escapeHtml as esc } from './js/utils.js';

(async () => {
  try {
    const ctx = await bootstrapBusinessman('career');
    if (!ctx) return; // redirected (no auth / no businessman faction)

    // History was rolled once at creation (20270787) and stored as
    // [{ year, label, sub }] — newest first as generated.
    const hist = Array.isArray(ctx.faction?.biz_career_history)
      ? ctx.faction.biz_career_history : [];
    const listEl = document.getElementById('hist-list');
    listEl.innerHTML = hist.length
      ? hist.map(h => `
          <div class="hist-row">
            <span class="hist-year">${esc(String(h.year ?? '—'))}</span>
            <div class="hist-info">
              <div class="hist-label">${esc(h.label || '')}</div>
              ${h.sub ? `<div class="hist-sub">${esc(h.sub)}</div>` : ''}
            </div>
          </div>`).join('')
      : '<div class="biz-soon">No recorded history — a blank page waiting for ink.</div>';

    document.getElementById('loading').style.display = 'none';
    document.getElementById('page-content').style.display = 'block';
  } catch (err) {
    console.error('businessman-career: bootstrap failed', err);
    document.getElementById('loading').textContent = 'FAILED TO LOAD — PLEASE REFRESH';
  }
})();
</script>
</body>
</html>
