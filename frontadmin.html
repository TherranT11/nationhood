<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>War Fronts Admin | Nationhood</title>
<style>
  :root{ --bg:#0e0e0c; --card:#1a1a17; --b0:rgba(255,255,255,0.06); --b1:rgba(255,255,255,0.12);
    --txt:#f0efe6; --dim:#888; --faint:#4a4940; --accent:#b6533f; --gold:#c8a832; --green:#46c46a; --red:#c47a7a; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:#c4c2b8;font-family:'IBM Plex Sans',system-ui,sans-serif;}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 24px 80px;}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
  h1{font-size:22px;color:var(--txt);font-weight:700;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.22em;color:var(--accent);font-weight:700;text-transform:uppercase;}
  .gate{padding:60px;text-align:center;font-family:'JetBrains Mono',monospace;color:var(--dim);}
  .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:18px 0;padding-bottom:14px;border-bottom:1px solid var(--b1);}
  select,input,textarea{background:#121210;border:1px solid var(--b1);border-radius:4px;color:var(--txt);font:inherit;padding:7px 9px;}
  select{font-family:'JetBrains Mono',monospace;font-size:13px;}
  button{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;
    padding:8px 14px;border-radius:4px;border:1px solid;cursor:pointer;}
  .btn-gen{background:rgba(182,83,63,0.16);border-color:var(--accent);color:#e0a090;}
  .btn-save{background:var(--gold);border-color:var(--gold);color:#1a1a17;padding:6px 12px;font-size:11px;}
  .btn-save:disabled{opacity:0.5;cursor:default;}
  .msg{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);}
  .front{margin-bottom:22px;border:1px solid var(--b0);border-radius:6px;background:var(--card);}
  .front-head{padding:11px 15px;border-bottom:1px solid var(--b0);display:flex;align-items:center;gap:10px;}
  .front-head .lab{font-size:14px;font-weight:700;color:var(--txt);}
  .front-head .meta{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:0.1em;}
  .air-status{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--gold);}
  .sec{display:grid;grid-template-columns:64px 1fr 130px 90px 1fr 70px;gap:10px;align-items:start;
    padding:10px 15px;border-bottom:1px solid var(--b0);}
  .sec:last-child{border-bottom:0;}
  .sec .code{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);padding-top:8px;}
  .sec .tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:0.1em;
    padding:2px 5px;border-radius:2px;margin-top:4px;}
  .tag.border{background:#2a1515;color:var(--red);} .tag.cap{background:#2a2410;color:var(--gold);}
  .sec input.name{width:100%;} .sec textarea{width:100%;min-height:38px;resize:vertical;font-size:12px;}
  .sec input.infra{width:100%;text-align:right;}
  .lbl{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:0.1em;color:var(--faint);text-transform:uppercase;display:block;margin-bottom:3px;}
  .cap-row{background:#15130c;}
</style>
</head>
<body>
  <div class="wrap" id="root">
    <div class="gate">Loading…</div>
  </div>

<script type="module">
import { _supabase } from './js/supabase-client.js';

const SECTOR_TYPES = ['urban','plains','mountains','desert','jungle','coastal'];
const AIR_LABEL = { a_domination:'Nation A Domination', a_superiority:'Nation A Superiority',
  contested:'Contested', b_superiority:'Nation B Superiority', b_domination:'Nation B Domination' };

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

let _nations = new Map();   // id -> { name, capital }
const root = document.getElementById('root');

async function init() {
  let authorized = false;
  try {
    const { data, error } = await _supabase.rpc('verify_admin_access');
    if (error) throw error;
    authorized = !!data?.authorized;
  } catch (e) {
    root.innerHTML = `<div class="gate">Admin verification failed. Sign in as an admin to manage war fronts.<br><span class="mono">${esc(e?.message || e)}</span></div>`;
    return;
  }
  if (!authorized) {
    root.innerHTML = '<div class="gate">Admin access required.</div>';
    return;
  }

  const { data: nats } = await _supabase.from('nations').select('id, name, capital').order('name');
  for (const n of (nats || [])) _nations.set(n.id, { name: n.name, capital: n.capital });

  renderShell();
  await refreshPairs();
}

function renderShell() {
  root.innerHTML = `
    <div class="eyebrow">— War Map —</div>
    <h1>War Fronts Admin</h1>
    <div class="bar">
      <button class="btn-gen" id="gen">Generate Missing Fronts</button>
      <select id="pair"><option value="">— Select a bordering pair —</option></select>
      <span class="msg" id="bar-msg"></span>
    </div>
    <div id="detail"></div>`;
  document.getElementById('gen').addEventListener('click', onGenerate);
  document.getElementById('pair').addEventListener('change', (e) => {
    if (e.target.value) loadPair(...e.target.value.split('|'));
    else document.getElementById('detail').innerHTML = '';
  });
}

async function onGenerate() {
  const btn = document.getElementById('gen'); const msg = document.getElementById('bar-msg');
  btn.disabled = true; msg.textContent = 'Generating…';
  try {
    const { data, error } = await _supabase.rpc('generate_war_fronts');
    if (error || (data && data.ok === false)) throw new Error((data && data.error) || error?.message);
    msg.textContent = `Done — ${data?.land_fronts_created ?? 0} new land fronts.`;
    await refreshPairs();
  } catch (e) {
    msg.textContent = 'Failed: ' + (e?.message || e);
  } finally { btn.disabled = false; }
}

async function refreshPairs() {
  const sel = document.getElementById('pair');
  const { data, error } = await _supabase.from('war_fronts')
    .select('nation_a_id, nation_b_id').eq('front_type', 'land');
  if (error) { document.getElementById('bar-msg').textContent = 'Load failed: ' + error.message; return; }
  const seen = new Set();
  const pairs = [];
  for (const f of (data || [])) {
    const key = `${f.nation_a_id}|${f.nation_b_id}`;
    if (seen.has(key)) continue; seen.add(key);
    pairs.push({ key, a: f.nation_a_id, b: f.nation_b_id });
  }
  pairs.sort((p, q) => (_nations.get(p.a)?.name || '').localeCompare(_nations.get(q.a)?.name || ''));
  const cur = sel.value;
  sel.innerHTML = '<option value="">— Select a bordering pair —</option>' + pairs.map(p =>
    `<option value="${esc(p.key)}">${esc(_nations.get(p.a)?.name || '?')} ↔ ${esc(_nations.get(p.b)?.name || '?')}</option>`).join('');
  if (cur && pairs.some(p => p.key === cur)) sel.value = cur;
}

async function loadPair(a, b) {
  const detail = document.getElementById('detail');
  detail.innerHTML = '<div class="msg">Loading fronts…</div>';
  const { data: fronts, error: fErr } = await _supabase.from('war_fronts')
    .select('id, front_type, label, sector_count, air_status')
    .eq('nation_a_id', a).eq('nation_b_id', b).order('front_type').order('label');
  if (fErr) { detail.innerHTML = `<div class="msg">Failed: ${esc(fErr.message)}</div>`; return; }

  const landIds = (fronts || []).filter(f => f.front_type === 'land').map(f => f.id);
  let sectors = [];
  if (landIds.length) {
    const { data } = await _supabase.from('war_sectors')
      .select('*').in('front_id', landIds).order('position');
    sectors = data || [];
  }
  const { data: caps } = await _supabase.from('war_sectors')
    .select('*').in('nation_id', [a, b]).eq('is_capital', true);

  const byFront = new Map();
  for (const s of sectors) { if (!byFront.has(s.front_id)) byFront.set(s.front_id, []); byFront.get(s.front_id).push(s); }

  let html = '';
  for (const f of (fronts || []).filter(f => f.front_type === 'land')) {
    html += `<div class="front"><div class="front-head">
        <span class="lab">Land Front ${esc(f.label)}</span>
        <span class="meta">${f.sector_count} sectors</span></div>
      ${(byFront.get(f.id) || []).map(sectorRow).join('')}</div>`;
  }
  // Capitals
  if ((caps || []).length) {
    html += `<div class="front"><div class="front-head"><span class="lab">Capitals</span>
        <span class="meta">war ends if captured</span></div>
      ${caps.map(c => sectorRow(c, true)).join('')}</div>`;
  }
  // Air front (read-only status — set by air battles, not here).
  const air = (fronts || []).find(f => f.front_type === 'air');
  if (air) {
    html += `<div class="front"><div class="front-head"><span class="lab">Air Front</span>
      <span class="air-status">${esc(AIR_LABEL[air.air_status] || air.air_status || '—')}</span>
      <span class="meta">status only · set by air battles</span></div></div>`;
  }
  detail.innerHTML = html || '<div class="msg">No fronts for this pair. Click “Generate Missing Fronts”.</div>';

  detail.querySelectorAll('[data-save]').forEach(btn =>
    btn.addEventListener('click', () => saveSector(btn.getAttribute('data-save'))));
}

function sectorRow(s, isCap = false) {
  const flag = s.is_capital ? '<span class="tag cap">CAPITAL</span>'
             : s.is_border ? '<span class="tag border">BORDER</span>' : '';
  const owner = _nations.get(s.nation_id)?.name || '';
  return `<div class="sec ${isCap ? 'cap-row' : ''}" data-sec="${esc(s.id)}">
      <div class="code">${esc(s.sector_code || '')}<br>${flag}<div class="lbl" style="margin-top:4px;">${esc(owner)}</div></div>
      <div><span class="lbl">Name</span><input class="name" data-f="name" value="${esc(s.name || '')}"></div>
      <div><span class="lbl">Type</span><select data-f="type">${SECTOR_TYPES.map(t =>
        `<option value="${t}"${t === s.type ? ' selected' : ''}>${t}</option>`).join('')}</select></div>
      <div><span class="lbl">Infra 0–100</span><input class="infra" type="number" min="0" max="100" data-f="infrastructure" value="${s.infrastructure ?? ''}"></div>
      <div><span class="lbl">Description</span><textarea data-f="description">${esc(s.description || '')}</textarea></div>
      <div><span class="lbl">&nbsp;</span><button class="btn-save" data-save="${esc(s.id)}">Save</button></div>
    </div>`;
}

async function saveSector(id) {
  const row = document.querySelector(`.sec[data-sec="${CSS.escape(id)}"]`);
  if (!row) return;
  const btn = row.querySelector('[data-save]');
  const get = (f) => row.querySelector(`[data-f="${f}"]`);
  const infraRaw = get('infrastructure').value;
  btn.disabled = true; const prev = btn.textContent; btn.textContent = '…';
  try {
    const { data, error } = await _supabase.rpc('upsert_war_sector', {
      p_sector_id: id,
      p_name: get('name').value,
      p_type: get('type').value,
      p_infrastructure: infraRaw === '' ? null : Number(infraRaw),
      p_description: get('description').value,
    });
    if (error || (data && data.ok === false)) throw new Error((data && data.error) || error?.message);
    btn.textContent = 'Saved ✓';
    setTimeout(() => { btn.textContent = prev; btn.disabled = false; }, 1100);
  } catch (e) {
    btn.textContent = 'Error'; btn.disabled = false;
    document.getElementById('bar-msg').textContent = 'Save failed: ' + (e?.message || e);
  }
}

init().catch(e => { root.innerHTML = `<div class="gate">Failed to load: ${esc(e?.message || e)}</div>`; });
</script>
</body>
</html>
