<div id="content-area">
    <div class="loading-container">
        <div class="loading-spinner"></div>

<script src="js/supabase-client.js"></script>
<script src="js/common.js"></script>

<script>
(function () {
    'use strict';
/**
 * Elections / Government Formation Page
 * 
 * Campaign actions (Rally, Attack Ad, Fundraiser, Lobby) have been moved to parties.html.
 * Autocracy actions (Give Speech, Spread Rumors, Seize Power) remain here.
 *
 * Formation rules:
 * - Any party with 1+ seats can propose a coalition
 * - Only coalition (invited) parties see support options
 * - A party can only support ONE coalition at a time
 * - Proposer auto-supports their own coalition
 * - Instant formation: ALL coalition members support + 51%+ seats + all ministries assigned
 * - Tick resolution: half+ coalition members support + 51%+ seats → best qualifying wins
 * - If no coalition qualifies after tick: extend 1 tick, stability -1, all parties lose 1d3 approval
 */

let currentFaction = null;
let currentNation = null;
let currentElectionId = null;
let isAutocracy = false;
let isPresidential = false;
let allParties = [];
let electionResults = [];
let activeFormationId = null;
let activeFormationPartyIds = [];
let realtimeChannel = null;
let chatMessages = [];
let supportMap = {};
let totalLegislatureSeats = 0;
const GENERAL_ELECTION_TYPE = 'parliamentary';

async function fetchLatestCompletedGeneralElection() {
    const { data: latestElection } = await _supabase
        .from('elections')
        .select('*')
        .eq('nation_id', currentNation.id)
        .eq('status', 'completed')
        .eq('election_type', GENERAL_ELECTION_TYPE)
        .order('election_tick', { ascending: false })
        .limit(1)
        .maybeSingle();

    return latestElection;
}

const MINISTRIES = [
    { key: 'prime_minister', name: 'Prime Minister', description: 'Head of government, sets national agenda and policy priorities.', locked: true },
    { key: 'interior', name: 'Ministry of the Interior', description: 'Oversees domestic affairs, local governments, and civil administration.' },
    { key: 'foreign', name: 'Foreign Ministry', description: 'Manages diplomatic relations and international treaties.' },
    { key: 'defense', name: 'Ministry of Defense', description: 'Controls military forces and national defense strategy.' },
    { key: 'finance', name: 'Ministry of Finance', description: 'Manages national budget, taxation, and economic policy.' },
    { key: 'education', name: 'Ministry of Education', description: 'Oversees schools, universities, and educational standards.' },
    { key: 'healthcare', name: 'Ministry of Healthcare', description: 'Manages hospitals, public health, and medical policy.' },
    { key: 'labor', name: 'Ministry of Labor', description: 'Handles employment law, workers\' rights, and job programs.' },
    { key: 'justice', name: 'Ministry of Justice', description: 'Oversees courts, law enforcement, and legal reform.' },
    { key: 'transportation', name: 'Ministry of Transportation', description: 'Manages roads, railways, airports, and transit systems.' },
    { key: 'security', name: 'Ministry of Security', description: 'Handles intelligence and counter-terrorism operations.', inactive: true }
];

// ===================================================================
// INIT
// ===================================================================

initPage('elections', async (state) => {
    const { nation, faction } = state;
    currentFaction = faction;
    currentNation = nation;
    initGameConfigForNation(nation);

    if (!nation) {
        document.getElementById('content-area').innerHTML = `
            <div class="placeholder-panel">
                <div class="ph-icon">🗳️</div>
                <h3>No Nation Selected</h3>
                <p>Your party is not assigned to a nation yet.</p>
            </div>`;
        return;
    }

    isAutocracy = isGovernmentAutocracy(nation);
    isPresidential = isGovernmentPresidential(nation);
    if (isAutocracy) {
        document.title = 'Internal Affairs | Nationhood Alpha';
        await renderAutocracyPage();
    } else {
        await renderDemocracyPage();
    }
});


// ===================================================================
// DEMOCRACY PAGE
// ===================================================================

async function renderDemocracyPage() {
    const { data: parties } = await _supabase
        .from('factions')
        .select('id, faction_name, seats, approval_rating, abbreviation, ideology_value_1, ideology_value_2')
        .eq('nation_id', currentNation.id)
        .eq('faction_type', 'party')
        .eq('is_npc', false)
        .order('seats', { ascending: false });
    allParties = parties || [];

    // For Presidential systems, fetch both latest parliamentary and presidential elections separately
    let election = null;
    let presidentialElection = null;
    if (isPresidential) {
        election = await fetchLatestCompletedGeneralElection();

        const { data: presElection } = await _supabase
            .from('elections')
            .select('*')
            .eq('nation_id', currentNation.id)
            .eq('status', 'completed')
            .eq('election_type', 'presidential')
            .order('election_tick', { ascending: false })
            .limit(1)
            .maybeSingle();
        presidentialElection = presElection;
    } else {
        election = await fetchLatestCompletedGeneralElection();
    }

    currentElectionId = election?.id || null;
    electionResults = election?.results?.votes || [];

    totalLegislatureSeats = electionResults.reduce((sum, r) => sum + (r.seats || 0), 0);
    if (totalLegislatureSeats === 0) {
        totalLegislatureSeats = allParties.reduce((sum, p) => sum + (p.seats || 0), 0);
    }

    let govFormed = false;
    if (currentElectionId) {
        const { data: formed } = await _supabase
            .from('government_formations')
            .select('id')
            .eq('election_id', currentElectionId)
            .in('status', ['formed', 'caretaker', 'dissolved'])
            .limit(1)
            .maybeSingle();
        govFormed = !!formed;
    }

    if (!govFormed && currentElectionId) {
        const { data: legacy } = await _supabase
            .from('active_coalitions')
            .select('id')
            .eq('election_id', currentElectionId)
            .limit(1)
            .maybeSingle();
        govFormed = !!legacy;
    }

    // Presidential systems never show coalition formation
    const showFormation = isPresidential ? false : (currentElectionId && !govFormed);

    // Check if current player has pending PM or President selection
    let hasPendingPM = false;
    let hasPendingPresident = false;
    if (currentFaction && !isPresidential) {
        const { count } = await _supabase
            .from('pm_candidates')
            .select('*', { count: 'exact', head: true })

async function renderElectionResults(election) {
    if (!election || !election.results) return;

    const { data: shard } = await _supabase.from('shard').select('current_date, current_tick').eq('name', 'Alpha Shard').single();
    if (shard) {
        const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const currentMonth = shard.current_date.split(', ')[0];
        const currentYear = parseInt(shard.current_date.split(', ')[1]);
        const currentMonthIndex = months.indexOf(currentMonth);
        const tickDiff = shard.current_tick - election.election_tick;
        let electionMonthIndex = currentMonthIndex - tickDiff;
        let electionYear = currentYear;
        while (electionMonthIndex < 0) { electionMonthIndex += 12; electionYear -= 1; }
        const dateStr = `${months[electionMonthIndex % 12]}, ${electionYear}`;
        document.getElementById('election-year').textContent = dateStr;
    }

    const results = election.results.votes || [];

    document.getElementById('election-results-list').innerHTML = results.map(r => `
        <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid #222; align-items: center;">
            <span style="font-size: 0.9rem; color: #ffcc00; font-weight: bold;">${r.party_name}</span>
            <span style="font-size: 0.85rem; color: #aaa; text-align: right;">${(r.votes || 0).toLocaleString()} Votes</span>
            <span style="font-size: 0.85rem; color: #aaa; text-align: right;">${r.vote_percentage || 0}%</span>
            <span style="font-size: 0.85rem; font-weight: bold; color: #4CAF50; text-align: right;">${r.seats || 0} Seats</span>
        </div>
    `).join('');
}

// ELECTION BREAKDOWN (per-bloc voter detail)
// ===================================================================

async function renderElectionBreakdown(election) {
    const container = document.getElementById('election-breakdown-content');
    if (!container) return;

    if (!election) {
        container.innerHTML = '<div style="color:#888; padding:16px; font-size:0.85rem;">No completed parliamentary election is available yet.</div>';
        return;
    }

    try {
        const result = await runElectionPreview(_supabase, currentNation.id);
        const blocDetails = result.bloc_details || [];
        const partyNames = result.partyNames || {};

        if (blocDetails.length === 0) {
            container.innerHTML = '<div style="color:#666; padding:16px; font-size:0.85rem;">No voter bloc data available.</div>';
            return;
        }

        const sorted = [...blocDetails].sort((a, b) => b.voter_count - a.voter_count);

        const ideologyColors = {
            'LIBERTY': '#9C27B0', 'EQUALITY': '#E91E63', 'FREEDOM': '#2196F3',
            'SECURITY': '#FF9800', 'INDIVIDUALISM': '#eab308', 'COLLECTIVISM': '#ec4899',
            'TRADITION': '#795548', 'PROGRESS': '#00BCD4', 'NATIONALISM': '#FF5722',
            'GLOBALISM': '#3F51B5'
        };

        container.innerHTML = sorted.map((bloc, idx) => {
            const blocId = 'breakdown-bloc-' + idx;

            // Ideology tags
            const tagsHtml = (bloc.tags || []).length > 0
                ? bloc.tags.map(tag => `<span class="ideology-tag tag-${tag.toLowerCase()}">${tag.toUpperCase()}</span>`).join('')
                : '<span style="font-size:0.78rem; color:#666; font-style:italic;">Unaligned</span>';

            // Party vote bars
            const voteEntries = Object.entries(bloc.blocVotes || {})
                .map(([pid, votes]) => ({ name: partyNames[pid] || pid.slice(0, 8), votes }))
                .sort((a, b) => b.votes - a.votes);
            const maxVotes = voteEntries.length > 0 ? voteEntries[0].votes : 0;

            const votesHtml = voteEntries.map(e => {
                const barWidth = maxVotes > 0 ? (e.votes / maxVotes) * 100 : 0;
                const isTop = e.votes === maxVotes;
                const barColor = isTop ? '#ffcc00' : '#555';
                const topClass = isTop ? ' top-party' : '';
                const actualVoters = bloc.voter_count - bloc.abstentions;
                const pct = actualVoters > 0 ? ((e.votes / actualVoters) * 100).toFixed(1) : '0.0';
                return `<div class="bloc-vote-row">
                    <span class="bloc-vote-name${topClass}">${e.name}</span>
                    <div class="bloc-vote-bar-wrap">
                        <div class="bloc-vote-bar" style="width:${barWidth}%; background:${barColor};"></div>
                    </div>
                    <span class="bloc-vote-count${topClass}">${e.votes.toLocaleString()} (${pct}%)</span>
                </div>`;
            }).join('');

            // Abstentions
            const abstentionsHtml = bloc.abstentions > 0
                ? `<div class="bloc-abstentions">Abstained: ${bloc.abstentions.toLocaleString()} voters</div>`
                : '';

            return `<div class="bloc-row" id="${blocId}">
                <div class="bloc-row-header" onclick="document.getElementById('${blocId}').classList.toggle('expanded')">
                    <div class="bloc-row-left">
                        <span class="bloc-row-name">${bloc.bloc_name}</span>
                        <span class="bloc-row-count">${bloc.voter_count.toLocaleString()} voters</span>
                    </div>
                    <div class="bloc-row-arrow">&#9654;</div>
                </div>
                <div class="bloc-row-content">
                    <div class="bloc-tags-row">${tagsHtml}</div>
                    <div>${votesHtml}</div>
                    ${abstentionsHtml}
                </div>
            </div>`;
        }).join('');
    } catch (err) {
        console.error('Election breakdown error:', err);
        container.innerHTML = '<div style="color:#ff6666; padding:16px; font-size:0.85rem;">Could not load election breakdown.</div>';
    }
}

// ===================================================================
// HELPER: get seats for a party
// ===================================================================

function getPartySeats(partyId) {
    const fromElection = electionResults.find(r => r.party_id === partyId);
    if (fromElection) return fromElection.seats || 0;
    const fromParty = allParties.find(p => p.id === partyId);
    return fromParty?.seats || 0;
}

function getCoalitionSeats(partyIds) {
    return partyIds.reduce((sum, pid) => sum + getPartySeats(pid), 0);
}

function getCoalitionSeatPct(partyIds) {
    if (totalLegislatureSeats === 0) return 0;
    return Math.round((getCoalitionSeats(partyIds) / totalLegislatureSeats) * 100);
}

function getCoalitionIdeologies(partyIds) {
    const ideologies = new Set();
    partyIds.forEach(pid => {
        const p = allParties.find(x => x.id === pid);
        if (p?.ideology_value_1) ideologies.add(p.ideology_value_1);
        if (p?.ideology_value_2) ideologies.add(p.ideology_value_2);
    });
    return [...ideologies];
}

function renderIdeologyChips(ideologies) {
    return ideologies.map(i =>
        `<span class="ideology-chip ${i.toLowerCase()}">${i}</span>`
    ).join('');
}

async function loadFormationsList() {
    const container = document.getElementById('gov-formation-content');

    const { data: formations } = await _supabase
        .from('government_formations')
        .select('*')
        .eq('election_id', currentElectionId)
        .eq('status', 'active')
        .order('created_at', { ascending: true });

    const formationsWithSupport = [];
    for (const f of (formations || [])) {
        const { data: supports } = await _supabase
            .from('government_formation_support')
            .select('faction_id, supports')
            .eq('formation_id', f.id);

        const coalitionPartyIds = f.party_ids || [];
        const coalitionSupports = (supports || []).filter(s => coalitionPartyIds.includes(s.faction_id));
        const supportCount = coalitionSupports.filter(s => s.supports).length;
        const coalitionSize = coalitionPartyIds.length;

        const mySupport = (supports || []).find(s => s.faction_id === currentFaction.id);
        const iAmSupporting = mySupport?.supports === true;
        const iAmInvited = coalitionPartyIds.includes(currentFaction.id);

        formationsWithSupport.push({ ...f, supportCount, coalitionSize, iAmSupporting, iAmInvited });
    }

    const { data: shard } = await _supabase.from('shard').select('current_date').eq('name', 'Alpha Shard').single();
    const gameYear = shard?.current_date || 'Unknown';

    const mySeats = getPartySeats(currentFaction.id);
    const canPropose = mySeats > 0;
    const alreadyProposed = (formations || []).some(f => f.proposed_by === currentFaction.id);

    container.innerHTML = `
        <div class="create-proposal-section" id="create-proposal-section">
            <div style="font-size: 1rem; color: #ffcc00; font-weight: bold; margin-bottom: 4px;">Propose a Government</div>
            <div style="font-size: 0.82rem; color: #888; margin-bottom: 16px;">
                Select which parties will form the coalition government. You need 51%+ of seats to form a government.
            </div>

            ${!canPropose ? `
                <div class="no-propose-note">⚠️ Your party has <strong>0 seats</strong> in the legislature. You cannot propose a coalition, but you may be invited to one.</div>
            ` : alreadyProposed ? `
                <div class="no-propose-note">You have already submitted a proposal for this election.</div>
            ` : `
                <div class="party-checkbox-grid" id="party-checkbox-grid">
                    ${allParties.map(p => {
                        const isYou = p.id === currentFaction.id;
                        const seats = getPartySeats(p.id);
                        return `
                            <div class="party-checkbox-item ${isYou ? 'checked disabled' : ''}" 
                                 data-party-id="${p.id}" data-seats="${seats}"
                                 onclick="${isYou ? '' : `toggleProposalParty(this, '${p.id}')`}">
                                <div class="party-check-box">${isYou ? '✓' : ''}</div>
                                <span class="party-check-label">${p.faction_name}</span>
                                <span class="party-check-seats">${seats} seats</span>
                            </div>`;
                    }).join('')}
                </div>
                <div class="proposal-seat-preview" id="proposal-seat-preview">
                    Coalition seats: <span class="preview-seats" id="preview-seats">${mySeats}</span> / ${totalLegislatureSeats}
                    (<span id="preview-pct">${totalLegislatureSeats ? Math.round((mySeats / totalLegislatureSeats) * 100) : 0}</span>%)
                    <span id="preview-threshold" style="margin-left: 8px; font-size: 0.8rem; color: #888;">— needs 51%</span>
                </div>
                <button class="action-btn" style="max-width: 300px; margin: 0 auto; display: block;" onclick="createProposal()">
                    Submit Proposal
                </button>
            `}
        </div>

        ${formationsWithSupport.length > 0 ? `
            <div class="section-header" style="margin-top: 8px;">Active Proposals</div>
            <div class="proposals-grid">
                ${formationsWithSupport.map(f => {
                    const proposerParty = allParties.find(p => p.id === f.proposed_by);
                    const partyIds = f.party_ids || [];
                    const coalitionSeats = getCoalitionSeats(partyIds);
                    const coalitionPct = getCoalitionSeatPct(partyIds);
                    const meetsThreshold = coalitionPct >= 51;
                    const ideologies = getCoalitionIdeologies(partyIds);
                    const partyChips = partyIds.map(pid => {

        ` : ''}
    `;

    updateSeatPreview();
}

let proposalSelectedParties = [];

function toggleProposalParty(el, partyId) {
    const idx = proposalSelectedParties.indexOf(partyId);
    if (idx > -1) {
        proposalSelectedParties.splice(idx, 1);
        el.classList.remove('checked');
        el.querySelector('.party-check-box').textContent = '';
    } else {
        proposalSelectedParties.push(partyId);
        el.classList.add('checked');
        el.querySelector('.party-check-box').textContent = '✓';
    }
    updateSeatPreview();
}

function updateSeatPreview() {
    const previewSeats = document.getElementById('preview-seats');
    const previewPct = document.getElementById('preview-pct');
    const previewThreshold = document.getElementById('preview-threshold');
    if (!previewSeats) return;

    const allIds = [currentFaction.id, ...proposalSelectedParties.filter(p => p !== currentFaction.id)];
    const seats = getCoalitionSeats(allIds);
    const pct = totalLegislatureSeats ? Math.round((seats / totalLegislatureSeats) * 100) : 0;
    const meets = pct >= 51;

    previewSeats.textContent = seats;
    previewSeats.className = 'preview-seats ' + (meets ? 'meets' : 'below');
    previewPct.textContent = pct;
    previewThreshold.textContent = meets ? '✓ Meets 51% threshold' : '— needs 51%';
    previewThreshold.style.color = meets ? '#4CAF50' : '#888';
}

async function createProposal() {
    if (getPartySeats(currentFaction.id) === 0) {
        alert('Your party has no seats — you cannot propose a coalition.');
        return;
    }

    const partyIds = [currentFaction.id, ...proposalSelectedParties.filter(p => p !== currentFaction.id)];
    const coalitionSeats = getCoalitionSeats(partyIds);
    const coalitionPct = totalLegislatureSeats ? Math.round((coalitionSeats / totalLegislatureSeats) * 100) : 0;
    if (coalitionPct < 51) {
        alert('Your coalition does not meet the 51% seat threshold. Add more parties.');
        return;
    }

    const { data: shard } = await _supabase.from('shard').select('current_date').eq('name', 'Alpha Shard').single();
    const gameYear = shard?.current_date || '';

    const { data, error } = await _supabase
        .from('government_formations')
        .insert({
            nation_id: currentNation.id,
            election_id: currentElectionId,
            proposed_by: currentFaction.id,
            party_ids: partyIds,
            status: 'active',
            game_year: gameYear
        })
        .select()
        .single();

    if (error) { alert('❌ Error creating proposal: ' + error.message); return; }

    const { error: supportError } = await _supabase.rpc('toggle_formation_support', {
        p_formation_id: data.id,
        p_faction_id: currentFaction.id,
        p_supports: true
    });
    if (supportError) console.warn('Auto-support failed (non-blocking):', supportError);

    proposalSelectedParties = [];
    openFormation(data.id);
}

async function openFormation(formationId) {
    if (realtimeChannel) { _supabase.removeChannel(realtimeChannel); realtimeChannel = null; }

    activeFormationId = formationId;

    const { data: formation, error } = await _supabase
        .from('government_formations').select('*').eq('id', formationId).single();

    if (error || !formation) { alert('Could not load this proposal.'); return; }

    activeFormationPartyIds = formation.party_ids || [];

    // Block non-invited parties from opening the detail view
    if (!activeFormationPartyIds.includes(currentFaction.id)) {
        alert('You are not invited to this coalition.');
        activeFormationId = null;
        activeFormationPartyIds = [];
        return;
    }

    const { data: supports } = await _supabase
        .from('government_formation_support').select('faction_id, supports').eq('formation_id', formationId);

    supportMap = {};
    (supports || []).forEach(s => {
        if (activeFormationPartyIds.includes(s.faction_id)) supportMap[s.faction_id] = s.supports;
    });

    const { data: msgs } = await _supabase
        .from('government_formation_chat').select('*').eq('formation_id', formationId)
        .order('created_at', { ascending: true }).limit(200);
    chatMessages = msgs || [];

    renderFormationDetail(formation);
    setupRealtimeSubscriptions(formationId);
}

function renderChatMessage(msg) {
    const isMine = msg.faction_id === currentFaction.id;
    const time = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return `
        <div class="chat-msg ${isMine ? 'mine' : ''}">
            <div class="chat-msg-author">${msg.faction_name}</div>
            <div class="chat-msg-bubble">${escapeHtml(msg.message)}</div>
            <div class="chat-msg-time">${time}</div>
        </div>`;
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function setupRealtimeSubscriptions(formationId) {
    realtimeChannel = _supabase.channel('formation-' + formationId)
        .on('postgres_changes', {
            event: 'UPDATE', schema: 'public', table: 'government_formations',
            filter: `id=eq.${formationId}`
        }, (payload) => {
            const f = payload.new;
            updateMinistriesFromRealtime(f.ministry_assignments || {}, f.minister_names || {});
            refreshFormButton(f.ministry_assignments || {});
        })
        .on('postgres_changes', {
            event: '*', schema: 'public', table: 'government_formation_support',
            filter: `formation_id=eq.${formationId}`
        }, async () => {
            const { data: supports } = await _supabase
                .from('government_formation_support').select('faction_id, supports').eq('formation_id', formationId);
            supportMap = {};
            (supports || []).forEach(s => {
                if (activeFormationPartyIds.includes(s.faction_id)) supportMap[s.faction_id] = s.supports;
            });
            refreshSupportBar();
            refreshFormButton();
        })
        .on('postgres_changes', {
            event: 'INSERT', schema: 'public', table: 'government_formation_chat',
            filter: `formation_id=eq.${formationId}`
        }, (payload) => {
            const msg = payload.new;
            if (chatMessages.find(m => m.id === msg.id)) return;
            chatMessages.push(msg);
            const chatEl = document.getElementById('chat-messages');
            if (chatEl) {
                const empty = chatEl.querySelector('.chat-empty');
                if (empty) empty.remove();
                chatEl.insertAdjacentHTML('beforeend', renderChatMessage(msg));
                chatEl.scrollTop = chatEl.scrollHeight;
            }
        })
        .subscribe();
}

function updateMinistriesFromRealtime(assignments, ministerNames) {
    MINISTRIES.forEach(m => {
        if (m.inactive) return;
        const sel = document.getElementById(`ministry-select-${m.key}`);
        if (sel && sel !== document.activeElement) sel.value = assignments[m.key] || '';

        const row = document.getElementById(`ministry-row-${m.key}`);
        if (row) {
            let nameEl = row.querySelector('.ministry-minister-name');
            const minister = ministerNames[m.key];
            if (minister) {
                const nameStr = `👤 ${minister.first_name} ${minister.last_name}, Age ${minister.age}`;
                if (nameEl) nameEl.textContent = nameStr;
                else row.querySelector('.ministry-info').insertAdjacentHTML('beforeend', `<div class="ministry-minister-name">${nameStr}</div>`);
            } else if (nameEl) { nameEl.remove(); }
        }
    });
}

function refreshSupportBar() {

    if (!bar) return;

    const coalitionParties = allParties.filter(p => activeFormationPartyIds.includes(p.id));
    const iAmInCoalition = activeFormationPartyIds.includes(currentFaction.id);

        let toggleHTML = '';
        if (isYou) {
            const currentlySupports = supportMap[currentFaction.id] === true;
            toggleHTML = currentlySupports
                ? `<button class="support-toggle-btn btn-withdraw" onclick="toggleSupport(false)">Withdraw Support</button>`
                : `<button class="support-toggle-btn btn-support" onclick="toggleSupport(true)">Support</button>`;

        return `
            <div class="support-row">
                <span class="support-party-name">${p.faction_name}${isYou ? '<span class="you-tag">(You)</span>' : ''}</span>

async function refreshFormButton(assignments) {
    if (!assignments) {
        const { data: f } = await _supabase.from('government_formations').select('ministry_assignments').eq('id', activeFormationId).single();
        assignments = f?.ministry_assignments || {};
    }

    const coalitionParties = allParties.filter(p => activeFormationPartyIds.includes(p.id));
    const coalitionPct = getCoalitionSeatPct(activeFormationPartyIds);
    const meetsThreshold = coalitionPct >= 51;

    const pmPartyId = assignments.prime_minister || null;
    const isPMParty = pmPartyId === currentFaction.id;
    const allCoalitionSupport = coalitionParties.every(p => supportMap[p.id] === true);
    const allAssigned = MINISTRIES.filter(m => !m.inactive).every(m => assignments[m.key]);
    const canForm = isPMParty && allCoalitionSupport && allAssigned && meetsThreshold;

    const blockers = [];
    if (!allAssigned) blockers.push('All ministries must be assigned.');
    if (!allCoalitionSupport) {
        const supportCount = coalitionParties.filter(p => supportMap[p.id] === true).length;
        blockers.push(`${supportCount}/${coalitionParties.length} coalition members supporting.`);
    }
    if (!meetsThreshold) blockers.push(`Coalition has ${coalitionPct}% of seats (need 51%).`);

    const section = document.getElementById('form-gov-section');
    if (!section) return;

    if (isPMParty) {
        section.innerHTML = `
            <button class="form-gov-btn" id="form-gov-btn" onclick="formGovernment()" ${canForm ? '' : 'disabled'}>🏛️ Form Government</button>
            ${!canForm ? `<div style="font-size: 0.8rem; color: #888; margin-top: 8px;">${blockers.join(' ')}</div>` : ''}`;
    } else if (pmPartyId) {
        section.innerHTML = `<div style="font-size: 0.85rem; color: #888;">Waiting for ${allParties.find(p => p.id === pmPartyId)?.faction_name || 'the PM\'s party'} to form the government.</div>`;
    } else {
        section.innerHTML = `<div style="font-size: 0.85rem; color: #888;">Assign a Prime Minister to enable government formation.</div>`;
    }
}

async function onMinistryChange(ministryKey, partyId) {
    if (!activeFormationId) return;
    try {
        const { data, error } = await _supabase.rpc('assign_ministry', {
            p_formation_id: activeFormationId, p_ministry_key: ministryKey, p_party_id: partyId || ''
        });
        if (error) throw error;
        if (!data.success) alert('❌ ' + data.message);
    } catch (err) { alert('❌ Error: ' + err.message); }
}

async function toggleSupport(supports) {
    if (!activeFormationId) return;

    if (supports) {
        try {
            const { data: allFormations } = await _supabase
                .from('government_formations').select('id, party_ids')
                .eq('election_id', currentElectionId).eq('status', 'active');

            for (const f of (allFormations || [])) {
                if (f.id === activeFormationId) continue;
                if (!(f.party_ids || []).includes(currentFaction.id)) continue;
                const { data: otherSupport } = await _supabase
                    .from('government_formation_support').select('supports')
                    .eq('formation_id', f.id).eq('faction_id', currentFaction.id).maybeSingle();
                if (otherSupport?.supports === true) {
                    await _supabase.rpc('toggle_formation_support', {
                        p_formation_id: f.id, p_faction_id: currentFaction.id, p_supports: false
                    });
                }
            }
        } catch (err) { console.warn('Error withdrawing from other coalitions:', err); }
    }

    try {
        const { data, error } = await _supabase.rpc('toggle_formation_support', {
            p_formation_id: activeFormationId, p_faction_id: currentFaction.id, p_supports: supports
        });
        if (error) throw error;
        if (!data.success) alert('❌ ' + data.message);
    } catch (err) { alert('❌ Error: ' + err.message); }
}

async function sendChatMessage() {
    const input = document.getElementById('chat-input');
    if (!input) return;
    const message = input.value.trim();
    if (!message || !activeFormationId) return;

    input.value = '';
    input.disabled = true;
    try {
        const { error } = await _supabase.from('government_formation_chat').insert({
            formation_id: activeFormationId, faction_id: currentFaction.id,
            faction_name: currentFaction.faction_name, message: message
        });
        if (error) throw error;
    } catch (err) { alert('❌ Error sending message: ' + err.message); input.value = message; }
    input.disabled = false;
    input.focus();
}

// ===== Edit Coalition Composition =====

let editSelectedParties = [];

function toggleEditCoalition() {
    const panel = document.getElementById('edit-coalition-panel');
    if (!panel) return;
    const showing = panel.style.display !== 'none';
    panel.style.display = showing ? 'none' : 'block';
    if (!showing) {
        // Initialize edit selection from current coalition
        editSelectedParties = [...activeFormationPartyIds];
        // Sync checkboxes
        document.querySelectorAll('#edit-party-grid .party-checkbox-item').forEach(el => {
            const pid = el.getAttribute('data-party-id');
            const inCoalition = editSelectedParties.includes(pid);
            el.classList.toggle('checked', inCoalition);
            el.querySelector('.party-check-box').textContent = inCoalition ? '✓' : '';
        });
        updateEditSeatPreview();
    }
    document.getElementById('edit-coalition-btn').textContent = showing ? 'Edit Coalition' : 'Cancel Edit';
}

function toggleEditParty(el, partyId) {
    const idx = editSelectedParties.indexOf(partyId);
    if (idx > -1) {
        editSelectedParties.splice(idx, 1);
        el.classList.remove('checked');
        el.querySelector('.party-check-box').textContent = '';
    } else {
        editSelectedParties.push(partyId);
        el.classList.add('checked');
        el.querySelector('.party-check-box').textContent = '✓';
    }
    updateEditSeatPreview();
}

function updateEditSeatPreview() {
    const previewSeats = document.getElementById('edit-preview-seats');
    const previewPct = document.getElementById('edit-preview-pct');
    const previewThreshold = document.getElementById('edit-preview-threshold');
    if (!previewSeats) return;

    const seats = getCoalitionSeats(editSelectedParties);
    const pct = totalLegislatureSeats ? Math.round((seats / totalLegislatureSeats) * 100) : 0;
    const meets = pct >= 51;

    previewSeats.textContent = seats;
    previewSeats.className = 'preview-seats ' + (meets ? 'meets' : 'below');
    previewPct.textContent = pct;
    previewThreshold.textContent = meets ? '✓ Meets 51% threshold' : '— needs 51%';
    previewThreshold.style.color = meets ? '#4CAF50' : '#888';
}

async function saveCoalitionEdit(formationId) {
    // Must include proposer
    if (!editSelectedParties.includes(currentFaction.id)) {
        alert('Your party must remain in the coalition.');
        return;
    }
    const editSeats = getCoalitionSeats(editSelectedParties);
    const editPct = totalLegislatureSeats ? Math.round((editSeats / totalLegislatureSeats) * 100) : 0;
    if (editPct < 51) {
        alert('Your coalition does not meet the 51% seat threshold. Add more parties.');
        return;
    }

    // Identify removed parties to clean up their support and ministry assignments
    const removedParties = activeFormationPartyIds.filter(pid => !editSelectedParties.includes(pid));

    try {
        // Remove support records for removed parties
        for (const pid of removedParties) {
            await _supabase.from('government_formation_support')
                .delete().eq('formation_id', formationId).eq('faction_id', pid);
        }

        // Clean ministry assignments: unset any ministry assigned to a removed party
        const { data: formation } = await _supabase
            .from('government_formations').select('ministry_assignments, minister_names').eq('id', formationId).single();
        const assignments = formation?.ministry_assignments || {};
        const ministerNames = formation?.minister_names || {};
        let changed = false;
        for (const [key, val] of Object.entries(assignments)) {
            if (removedParties.includes(val)) {
                assignments[key] = null;
                delete ministerNames[key];
                changed = true;
            }
        }

        // Update party_ids (and cleaned assignments if needed)
        const updatePayload = { party_ids: editSelectedParties };
        if (changed) {
            updatePayload.ministry_assignments = assignments;
            updatePayload.minister_names = ministerNames;
        }

        const { error } = await _supabase.from('government_formations')
            .update(updatePayload).eq('id', formationId);
        if (error) throw error;

        // Refresh the detail view
        activeFormationPartyIds = [...editSelectedParties];
        await openFormation(formationId);
    } catch (err) { alert('❌ Error updating coalition: ' + err.message); }
}

async function retractProposal(formationId) {
    if (!confirm('Are you sure you want to retract this coalition proposal? This will remove it for all parties.')) return;
    try {
        // Delete support records
        await _supabase.from('government_formation_support').delete().eq('formation_id', formationId);
        // Delete chat messages
        await _supabase.from('government_formation_chat').delete().eq('formation_id', formationId);
        // Delete the formation itself
        const { error } = await _supabase.from('government_formations').delete().eq('id', formationId).eq('proposed_by', currentFaction.id);
        if (error) throw error;

        if (realtimeChannel) { _supabase.removeChannel(realtimeChannel); realtimeChannel = null; }
        activeFormationId = null;
        activeFormationPartyIds = [];
        await loadFormationsList();
    } catch (err) { alert('❌ Error retracting proposal: ' + err.message); }
}

let _formingInProgress = false;
async function formGovernment() {
    if (_formingInProgress) return;
    if (!activeFormationId) return;
    if (!confirm('🏛️ Form this government? This will finalize all ministry assignments.')) return;
    _formingInProgress = true;
    try {
        const { data, error } = await _supabase.rpc('form_government', {
            p_formation_id: activeFormationId, p_caller_faction_id: currentFaction.id
        });
        if (error) throw error;
        if (data.success) {
            // Dissolve old coalition AFTER RPC succeeds (prevents orphaned dissolved state on RPC failure)
            // Exclude the new formation so it isn't dissolved along with the old one
            await dissolveCoalition(_supabase, currentNation.id, activeFormationId);

            // Cancel any other active formation proposals for this nation
            await _supabase.from('government_formations')
                .update({ status: 'cancelled' })
                .eq('nation_id', currentNation.id)
                .eq('status', 'active')
                .neq('id', activeFormationId);

            // Clear any leftover frozen bills from a previous caretaker period
            // so that inferCaretakerStatus() doesn't override the new 'formed' status
            await _supabase.from('bills')
                .update({ status: 'failed' })
                .eq('nation_id', currentNation.id)
                .eq('status', 'frozen');

            // Get the PM party and minister data from the formation
            const { data: formation } = await _supabase
                .from('government_formations')
                .select('ministry_assignments, minister_names')
                .eq('id', activeFormationId)
                .single();

            const assignments = formation?.ministry_assignments || {};
            const ministerNames = formation?.minister_names || {};
            const pmPartyId = assignments.prime_minister;

            // Populate ministries table from formation data
            // (PM is handled separately via the PM selection flow)
            const ministryDisplayNames = {
                prime_minister: 'Prime Minister', interior: 'Ministry of the Interior',
                foreign: 'Foreign Ministry', defense: 'Ministry of Defense',
                finance: 'Ministry of Finance', education: 'Ministry of Education',
                healthcare: 'Ministry of Healthcare', labor: 'Ministry of Labor',
                justice: 'Ministry of Justice', transportation: 'Ministry of Transportation',
                security: 'Ministry of Security'
            };
            for (const [ministryKey, partyId] of Object.entries(assignments)) {
                if (!partyId || ministryKey === 'prime_minister') continue;
                const minister = ministerNames[ministryKey];
                if (!minister) continue;

                const ministryData = {
                    party_id: partyId,
                    minister_first_name: minister.first_name,
                    minister_last_name: minister.last_name,
                    minister_age: minister.age,
                    minister_approval: 50
                };

                const { data: existing, error: lookupErr } = await _supabase.from('ministries')
                    .select('id').eq('nation_id', currentNation.id)
                    .eq('ministry_key', ministryKey).eq('is_active', true)
                    .maybeSingle();

                if (lookupErr) {
                    console.warn(`Ministry lookup failed for ${ministryKey}:`, lookupErr);
                    continue;
                }

                if (existing) {
                    const { error: updErr } = await _supabase.from('ministries').update(ministryData).eq('id', existing.id);
                    if (updErr) console.warn(`Ministry update failed for ${ministryKey}:`, updErr);
                } else {
                    const { error: insErr } = await _supabase.from('ministries').insert({
                        nation_id: currentNation.id,
                        ministry_key: ministryKey,
                        ministry_name: ministryDisplayNames[ministryKey] || ministryKey,
                        is_active: true,
                        ...ministryData
                    });
                    if (insErr) console.warn(`Ministry insert failed for ${ministryKey}:`, insErr);
                }
            }

            // Auto-generate/backfill Head of State when record is incomplete
            const hasValidHosAge = Number.isFinite(Number(currentNation.head_of_state_age)) && Number(currentNation.head_of_state_age) > 0;
            if (!currentNation.head_of_state_first_name || !currentNation.head_of_state_last_name || !hasValidHosAge) {
                const HOS_FIRST = ['Alejandro','Camila','Diego','Valentina','Mateo','Isabela','Sebastián','Luca','Andrés','Gabriel','Joaquín','Mariana','Carlos','Tomas','Rafael','Edwin','Emilio','Catalina','Fernando','Renata'];
                const HOS_LAST = ['Velasco','Mendoza','Guerrero','Salazar','Castillo','Herrera','Morales','Ríos','Delgado','Espinoza','Guzmán','Navarro','Córdoba','Echeverría','Pacheco','Montero','Aguilar','Valenzuela','Carrasco','Ibarra'];
                const hosFirst = currentNation.head_of_state_first_name || HOS_FIRST[Math.floor(Math.random() * HOS_FIRST.length)];
                const hosLast = currentNation.head_of_state_last_name || HOS_LAST[Math.floor(Math.random() * HOS_LAST.length)];
                const hosAge = hasValidHosAge ? Number(currentNation.head_of_state_age) : (45 + Math.floor(Math.random() * 25)); // 45-69
                try {
                    await _supabase.from('nations').update({
                        head_of_state_first_name: hosFirst,
                        head_of_state_last_name: hosLast,
                        head_of_state_age: hosAge
                    }).eq('id', currentNation.id);
                    currentNation.head_of_state_first_name = hosFirst;
                    currentNation.head_of_state_last_name = hosLast;
                    currentNation.head_of_state_age = hosAge;
                } catch (hosErr) { console.warn('Could not set head of state:', hosErr); }
            }

            if (pmPartyId) {
                // Get current tick and date
                const { data: shard } = await _supabase
                    .from('shard')
                    .select('current_tick, current_date')
                    .eq('name', 'Alpha Shard')
                    .single();

                // Close previous administration and create new one
                const { data: fullNation } = await _supabase.from('nations').select('*').eq('id', currentNation.id).single();
                const { data: allFactions } = await _supabase.from('factions')
                    .select('id, faction_name, seats, approval_rating')
                    .eq('nation_id', currentNation.id).eq('faction_type', 'party');
                const { data: newFormation } = await _supabase.from('government_formations')
                    .select('party_ids, ministry_assignments, proposed_by')
                    .eq('id', activeFormationId).single();
                if (newFormation) {
                    newFormation.lead_party_id = newFormation.ministry_assignments?.prime_minister || newFormation.proposed_by;
                }
                if (fullNation && newFormation) {
                    // Determine end reason: if there was an election recently, it's election_loss
                    const { data: recentElection } = await _supabase.from('elections')
                        .select('election_tick').eq('nation_id', currentNation.id)
                        .eq('status', 'completed').order('election_tick', { ascending: false }).limit(1).maybeSingle();
                    const endReason = (recentElection && (shard?.current_tick - recentElection.election_tick) <= 8)
                        ? 'election_loss' : 'new_coalition';

                    // Compute average coalition approval for the administration baseline
                    const coalitionFactions = (allFactions || []).filter(f =>
                        (newFormation.party_ids || []).includes(f.id));
                    const govApproval = coalitionFactions.length > 0
                        ? Math.round(coalitionFactions.reduce((sum, f) => sum + (f.approval_rating ?? 50), 0) / coalitionFactions.length)
                        : null;

                    try {
                        await rolloverAdministration(
                            _supabase,
                            currentNation.id,
                            fullNation,
                            endReason,
                            newFormation,
                            allFactions || [],
                            shard?.current_tick || 0,
                            shard?.current_date || '',
                            govApproval
                        );
                    } catch (adminErr) {
                        console.error('Administration lifecycle error (non-fatal):', adminErr);
                        // Don't throw — PM candidate generation must still proceed
                    }
                }

                // Generate 3 PM candidates for the PM party
                await generatePMCandidates(
                    _supabase,
                    currentNation.id,
                    pmPartyId,
                    shard?.current_tick || 0
                );

                // Create ministry inbox event so PM party is notified
                try {
                    await _supabase.from('ministry_events').insert({
                        nation_id: currentNation.id,
                        ministry_key: 'prime_minister',
                        controlling_faction_id: pmPartyId,
                        title: '👑 Select Your Prime Minister',
                        sender: 'Coalition Government',
                        body: 'Your party has been awarded the Prime Minister post. You must now choose who will lead the nation. Visit the PM selection page to review candidates and make your appointment.',
                        status: 'active',
                        created_at_tick: shard?.current_tick || 0
                    });
                } catch (inboxErr) {
                    console.warn('Could not create PM selection inbox event:', inboxErr);
                }
            }

            alert('🏛️ ' + data.message);
            if (realtimeChannel) { _supabase.removeChannel(realtimeChannel); realtimeChannel = null; }
            sessionStorage.removeItem('nationhood_state');

            // If current player IS the PM party, send them to candidate selection
            if (pmPartyId === currentFaction.id) {
                window.location.href = 'select-pm.html';
            } else {
                location.reload();
            }
        } else { alert('❌ ' + data.message); }
    } catch (err) { alert('❌ Error: ' + err.message); }
    finally { _formingInProgress = false; }
}

function renderShakeupUI(shakeup, allFactions) {
    const votes = shakeup.votes || [];
    const myVote = votes.find(v => v.faction_id === currentFaction.id);
    const rulingFaction = allFactions?.find(f => f.id === shakeup.ruling_faction_id);
    const seizingFaction = allFactions?.find(f => f.id === shakeup.initiated_by);
    const rulingVoters = votes.filter(v => v.side === 'ruling').map(v => { const f = allFactions?.find(af => af.id === v.faction_id); return f ? f.faction_name : 'Unknown'; });
    const seizingVoters = votes.filter(v => v.side === 'seizing').map(v => { const f = allFactions?.find(af => af.id === v.faction_id); return f ? f.faction_name : 'Unknown'; });
    const totalFactions = allFactions?.length || 0;
    const totalVotes = votes.length;
    const allVoted = totalVotes >= totalFactions;
    const majorityVoted = totalVotes >= Math.ceil(totalFactions / 2);
    const nonVoters = totalFactions - totalVotes;

    return `
        <div class="shakeup-banner">
            <div class="shakeup-title">⚔️ SHAKEUP IN PROGRESS ⚔️</div>
            <div class="shakeup-desc">
                A faction is attempting to seize power!
                <br>All factions must choose a side. <strong style="color:#ff9800;">Non-voters will be counted as abstaining at next tick.</strong>
            </div>
            <div class="shakeup-sides">
                <div class="shakeup-side ruling">
                    <div class="shakeup-side-label">Ruling Faction</div>
                    <div class="shakeup-side-name">${rulingFaction?.faction_name || 'Unknown'}</div>
                    <div class="shakeup-side-seats">${rulingFaction?.seats || 0} seats</div>
                    <div style="margin-top: 8px; font-size: 0.8rem; color: #aaa;">Supporters: ${rulingVoters.length > 0 ? rulingVoters.join(', ') : 'None yet'}</div>
                </div>
                <div class="shakeup-vs">VS</div>
                <div class="shakeup-side seizing">
                    <div class="shakeup-side-label">Challenging Faction</div>
                    <div class="shakeup-side-name">${seizingFaction?.faction_name || 'Unknown'}</div>
                    <div class="shakeup-side-seats">${seizingFaction?.seats || 0} seats</div>
                    <div style="margin-top: 8px; font-size: 0.8rem; color: #aaa;">Supporters: ${seizingVoters.length > 0 ? seizingVoters.join(', ') : 'None yet'}</div>
                </div>
            </div>
            ${myVote ? `
                <div class="shakeup-voted">✓ You sided with the ${myVote.side} faction</div>
            ` : `
                <div class="shakeup-vote-buttons">
                    <button class="shakeup-vote-btn ruling-btn" onclick="voteShakeup('${shakeup.id}', 'ruling')">Side with Ruling</button>
                    <button class="shakeup-vote-btn seizing-btn" onclick="voteShakeup('${shakeup.id}', 'seizing')">Side with Challenger</button>
                </div>
            `}
            <div style="margin-top: 16px; font-size: 0.85rem; color: #888;">
                Votes cast: ${totalVotes} / ${totalFactions}
                ${nonVoters > 0 && !allVoted ? `<br><span style="color: #ff9800;">${nonVoters} faction${nonVoters > 1 ? 's' : ''} haven't voted — they will abstain at next tick</span>` : ''}
                ${(totalVotes >= Math.ceil(totalFactions / 2) && currentFaction.id === shakeup.initiated_by) ? '<br><button class="action-btn" style="margin-top: 12px;" onclick="resolveActiveShakeup(\'' + shakeup.id + '\')">⚔️ Resolve Shakeup Now</button>' : ''}
            </div>
        </div>
    `;
}

async function voteShakeup(shakeupId, side) {
    if (!confirm(`Side with the ${side} faction? This cannot be changed.`)) return;
    try {
        const { data, error } = await _supabase.rpc('vote_on_shakeup', { p_shakeup_id: shakeupId, p_faction_id: currentFaction.id, p_side: side });

        if (data.success) { alert('✅ ' + data.message); await renderAutocracyPage(); }
        else { alert('❌ ' + data.message); }
    } catch (error) { alert('❌ Error: ' + error.message); }
}

async function resolveActiveShakeup(shakeupId) {
    if (!confirm('Resolve this shakeup? The losing side will lose seats and approval.')) return;
    try {
        const { data, error } = await _supabase.rpc('resolve_shakeup', { p_shakeup_id: shakeupId });
        if (error) throw error;
        if (data.success) { alert('⚔️ ' + data.message); await renderAutocracyPage(); }
        else { alert('❌ ' + data.message); }
    } catch (error) { alert('❌ Error: ' + error.message); }
}

async function loadElectionInfo() {
    if (!currentNation) return;
    const { data: shard } = await _supabase.from('shard').select('current_tick, current_date').eq('name', 'Alpha Shard').single();
    if (!shard) return;

    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const currentMonth = shard.current_date.split(', ')[0];
    const currentYear = parseInt(shard.current_date.split(', ')[1]);
    const currentMonthIndex = months.indexOf(currentMonth);

    function tickToDateStr(ticksAhead) {
        let mi = currentMonthIndex + ticksAhead;
        let y = currentYear;
        while (mi >= 12) { mi -= 12; y += 1; }
        return months[mi] + ', ' + y;
    }

    if (isPresidential) {
        // Check for overdue scheduled elections before fetching future ones
        const { data: overduePresElection } = await _supabase
            .from('elections').select('*').eq('nation_id', currentNation.id).eq('status', 'scheduled')
            .lte('election_tick', shard.current_tick)
            .order('election_tick', { ascending: true }).limit(1).maybeSingle();

        if (overduePresElection) {
            const parlDateEl = document.getElementById('next-parliamentary-tick');
            const parlTicksEl = document.getElementById('ticks-until-parliamentary');
            const presDateEl = document.getElementById('next-presidential-tick');
            const presTicksEl = document.getElementById('ticks-until-presidential');
            const elType = overduePresElection.election_type || 'parliamentary';
            if (elType === 'presidential') {
                if (presDateEl) presDateEl.textContent = 'Overdue — pending';
                if (presTicksEl) presTicksEl.textContent = 'Will process next tick';
            } else {
                if (parlDateEl) parlDateEl.textContent = 'Overdue — pending';
                if (parlTicksEl) parlTicksEl.textContent = 'Will process next tick';
            }
            // Still fetch the other election type normally below
        }

        // Presidential systems have dual elections — fetch both types
        let { data: parlElection, error: parlErr } = await _supabase
            .from('elections').select('*').eq('nation_id', currentNation.id).eq('status', 'scheduled')
            .eq('election_type', 'parliamentary')
            .gt('election_tick', shard.current_tick)
            .order('election_tick', { ascending: true }).limit(1).maybeSingle();
        if (parlErr) console.error('loadElectionInfo: parliamentary query error:', parlErr);

        let { data: presElection, error: presErr } = await _supabase
            .from('elections').select('*').eq('nation_id', currentNation.id).eq('status', 'scheduled')
            .eq('election_type', 'presidential')
            .gt('election_tick', shard.current_tick)
            .order('election_tick', { ascending: true }).limit(1).maybeSingle();
        if (presErr) console.error('loadElectionInfo: presidential query error:', presErr);

        // Auto-schedule fallback for parliamentary if none found
        if (!parlElection && !parlErr) {
            const { data: lastParl } = await _supabase
                .from('elections').select('election_tick').eq('nation_id', currentNation.id)
                .eq('status', 'completed').eq('election_type', 'parliamentary')
                .order('election_tick', { ascending: false }).limit(1).maybeSingle();
            const parlBase = lastParl ? lastParl.election_tick : shard.current_tick;
            let nextParl = parlBase + (GAME_CONFIG?.PARLIAMENTARY_TERM_TICKS || 24);
            if (nextParl <= shard.current_tick) nextParl = shard.current_tick + (GAME_CONFIG?.PARLIAMENTARY_TERM_TICKS || 24);
            const { data: newParl, error: insErr } = await _supabase.from('elections')
                .insert({ nation_id: currentNation.id, election_tick: nextParl, election_type: 'parliamentary', status: 'scheduled' })
                .select().single();
            if (!insErr && newParl) { parlElection = newParl; console.log('Auto-scheduled presidential parliamentary election at tick', nextParl); }
            else console.warn('Failed to auto-schedule presidential parliamentary:', insErr);
        }

        // Auto-schedule fallback for presidential if none found
        if (!presElection && !presErr) {
            const { data: lastPres } = await _supabase
                .from('elections').select('election_tick').eq('nation_id', currentNation.id)
                .eq('status', 'completed').eq('election_type', 'presidential')
                .order('election_tick', { ascending: false }).limit(1).maybeSingle();
            const presBase = lastPres ? lastPres.election_tick : shard.current_tick;
            let nextPres = presBase + (GAME_CONFIG?.PRESIDENTIAL_TERM_TICKS || 48);
            if (nextPres <= shard.current_tick) nextPres = shard.current_tick + (GAME_CONFIG?.PRESIDENTIAL_TERM_TICKS || 48);
            const { data: newPres, error: insErr } = await _supabase.from('elections')
                .insert({ nation_id: currentNation.id, election_tick: nextPres, election_type: 'presidential', status: 'scheduled' })
                .select().single();
            if (!insErr && newPres) { presElection = newPres; console.log('Auto-scheduled presidential election at tick', nextPres); }
            else console.warn('Failed to auto-schedule presidential:', insErr);
        }

        const parlDateEl = document.getElementById('next-parliamentary-tick');
        const parlTicksEl = document.getElementById('ticks-until-parliamentary');
        const presDateEl = document.getElementById('next-presidential-tick');
        const presTicksEl = document.getElementById('ticks-until-presidential');

        if (parlElection) {
            const ticksAhead = parlElection.election_tick - shard.current_tick;
            if (parlDateEl) parlDateEl.textContent = tickToDateStr(ticksAhead);
            if (parlTicksEl) parlTicksEl.textContent = ticksAhead + (ticksAhead === 1 ? ' tick' : ' ticks');
        } else {
            if (parlDateEl) parlDateEl.textContent = 'Not scheduled';
            if (parlTicksEl) parlTicksEl.textContent = '—';
        }

        if (presElection) {
            const ticksAhead = presElection.election_tick - shard.current_tick;
            if (presDateEl) presDateEl.textContent = tickToDateStr(ticksAhead);
            if (presTicksEl) presTicksEl.textContent = ticksAhead + (ticksAhead === 1 ? ' tick' : ' ticks');
        } else {
            if (presDateEl) presDateEl.textContent = 'Not scheduled';
            if (presTicksEl) presTicksEl.textContent = '—';
        }
        return;
    }

    const DEFAULT_ELECTION_INTERVAL = 48; // ticks between elections (baseline, can be changed by law)

    // Check for overdue scheduled elections (election_tick in the past but still 'scheduled')
    const { data: overdueElection } = await _supabase
        .from('elections').select('*').eq('nation_id', currentNation.id).eq('status', 'scheduled')
        .lte('election_tick', shard.current_tick)
        .order('election_tick', { ascending: true }).limit(1).maybeSingle();

    if (overdueElection) {
        // Show overdue notice — don't auto-schedule a duplicate
        const nextEl = document.getElementById('next-election-tick');
        const ticksEl = document.getElementById('ticks-until-election');
        if (nextEl) nextEl.textContent = 'Overdue — pending';
        if (ticksEl) ticksEl.textContent = 'Will process next tick';
        return;
    }

    // Only fetch elections scheduled in the future (tick > current tick)
    let { data: election } = await _supabase
        .from('elections').select('*').eq('nation_id', currentNation.id).eq('status', 'scheduled')
        .gt('election_tick', shard.current_tick)
        .order('election_tick', { ascending: true }).limit(1).maybeSingle();

    // Auto-schedule if no future election exists
    if (!election) {
        // Find the most recent completed election to base the interval on
        const { data: lastElection } = await _supabase
            .from('elections').select('election_tick').eq('nation_id', currentNation.id).eq('status', 'completed')
            .order('election_tick', { ascending: false }).limit(1).maybeSingle();

        const baseTick = lastElection ? lastElection.election_tick : shard.current_tick;
        let nextTick = baseTick + DEFAULT_ELECTION_INTERVAL;

        // Ensure it's actually in the future
        if (nextTick <= shard.current_tick) {
            nextTick = shard.current_tick + DEFAULT_ELECTION_INTERVAL;
        }

        const { data: newElection, error } = await _supabase
            .from('elections')
            .insert({
                nation_id: currentNation.id,
                election_tick: nextTick,
                status: 'scheduled'
            })
            .select()
            .single();

        if (!error && newElection) {
            election = newElection;
            console.log('Auto-scheduled next election at tick', nextTick);
        } else {
            console.warn('Failed to auto-schedule election:', error);
        }
    }

    const nextEl = document.getElementById('next-election-tick');
    const ticksEl = document.getElementById('ticks-until-election');

    if (election) {
        const ticksAhead = election.election_tick - shard.current_tick;
        if (nextEl) nextEl.textContent = tickToDateStr(ticksAhead);
        if (ticksEl) ticksEl.textContent = ticksAhead + (ticksAhead === 1 ? ' tick' : ' ticks');
    } else {
        if (nextEl) nextEl.textContent = 'Not scheduled';
        if (ticksEl) ticksEl.textContent = '—';
    }
}

// Expose handlers used by inline HTML attributes
window.createProposal = createProposal;
window.openFormation = openFormation;
window.toggleSupport = toggleSupport;
window.loadFormationsList = loadFormationsList;
window.toggleEditCoalition = toggleEditCoalition;
window.retractProposal = retractProposal;
window.saveCoalitionEdit = saveCoalitionEdit;
window.sendChatMessage = sendChatMessage;
window.formGovernment = formGovernment;
window.voteShakeup = voteShakeup;
window.resolveActiveShakeup = resolveActiveShakeup;
})();
</script>
