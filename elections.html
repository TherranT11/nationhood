<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Elections | Nationhood Alpha</title>
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Shared Styles -->
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<!-- ===== TOP BAR (rendered by common.js) ===== -->
<div id="top-bar"></div>

<!-- ===== CONTENT AREA ===== -->
<div id="content-area">
    <!-- Loading state shown initially -->
    <div class="loading-container">
        <div class="loading-spinner"></div>
        <div>Loading election data...</div>
    </div>
</div>

<!-- Shared Scripts -->
<script src="js/supabase-client.js"></script>
<script src="js/common.js"></script>

<!-- Page-Specific Script -->
<script>
/**
 * Elections Page
 * Campaign actions, election results, coalition formation
 */

// Page state
let currentFaction = null;
let currentNation = null;
let currentElectionId = null;
let coalitionParties = [];
let selectedCoalitionParties = [];
let totalSeatsInNation = 120;
let majorityThreshold = 61;

// Initialize page
initPage('elections', async (state) => {
    const { nation, faction } = state;
    
    currentFaction = faction;
    currentNation = nation;
    
    if (!nation) {
        document.getElementById('content-area').innerHTML = `
            <div class="placeholder-panel">
                <div class="ph-icon">🗳️</div>
                <h3>No Nation Selected</h3>
                <p>Your party is not assigned to a nation yet.</p>
            </div>
        `;
        return;
    }
    
    await renderElectionsPage();
});

/**
 * Render the full elections page
 */
async function renderElectionsPage() {
    const html = `
        <div class="panel-padding">
            <!-- Election Results (only shows after an election) -->
            <div id="election-results-section" style="display: none;">
                <div class="section-header">Election Results — <span id="election-year">2000</span></div>
                <div class="info-block" style="margin-bottom: 24px;">
                    <div id="election-results-list"></div>
                </div>
            </div>

            <!-- Coalition Selection Screen (shows when coalition needed) -->
            <div id="coalition-selection-section" style="display: none;">
                <div class="section-header">Form Coalition Government</div>
                <div class="info-block" style="margin-bottom: 24px; background: #1a1a1a; border-left: 3px solid #ff9800;">
                    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
                        <span style="font-size: 2rem;">⚠️</span>
                        <div>
                            <div style="font-size: 1rem; color: #ff9800; font-weight: bold;">No Majority Government</div>
                            <div style="font-size: 0.85rem; color: #aaa;">No party achieved 51%+ of seats. A coalition must be formed.</div>
                        </div>
                    </div>
                    <div style="display: flex; gap: 20px; margin-top: 16px; padding-top: 16px; border-top: 1px solid #333;">
                        <div>
                            <span class="info-label">Required Seats</span>
                            <span class="info-value gold" style="margin-left: 8px;" id="coalition-required-seats">61 / 120</span>
                        </div>
                        <div>
                            <span class="info-label">Current Selection</span>
                            <span class="info-value" id="coalition-current-seats" style="margin-left: 8px; color: #ff4444;">0</span>
                        </div>
                    </div>
                </div>

                <!-- Value Conflicts Display -->
                <div id="coalition-conflicts" style="display: none; margin-bottom: 20px;">
                    <div class="info-block" style="border-left: 3px solid #ff4444;">
                        <div style="font-size: 0.9rem; color: #ff4444; font-weight: bold; margin-bottom: 8px;">⚠ Ideological Conflicts Detected</div>
                        <div id="coalition-conflicts-list" style="font-size: 0.85rem; color: #aaa;"></div>
                        <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #333;">
                            <span class="info-label">Stability Penalty</span>
                            <span class="info-value" id="coalition-stability-penalty" style="margin-left: 8px; color: #ff4444;">-0</span>
                        </div>
                    </div>
                </div>

                <!-- Party Selection Grid -->
                <div class="section-header">Select Coalition Partners</div>
                <div id="coalition-party-grid" class="coalition-grid">
                    <!-- Parties will be inserted here by JavaScript -->
                </div>

                <!-- Propose Button -->
                <div style="margin-top: 24px; text-align: center;">
                    <button id="coalition-propose-btn" class="action-btn" style="max-width: 400px; padding: 14px;" onclick="proposeCoalition()" disabled>
                        Propose Coalition
                    </button>
                    <div style="margin-top: 8px; font-size: 0.8rem; color: #666;">
                        Select parties totaling at least 61 seats to enable
                    </div>
                </div>
            </div>

            <!-- Coalition Proposals List (shows when proposals exist) -->
            <div id="coalition-proposals-section" style="display: none;">
                <div class="section-header">Coalition Proposals</div>
                <div class="info-block" style="margin-bottom: 16px; background: #1a1a1a; border-left: 3px solid #4CAF50;">
                    <div style="font-size: 0.85rem; color: #aaa;">
                        All parties must vote on each coalition proposal. The proposal with the most votes wins.
                        If no coalition achieves majority support, a Hung Parliament occurs (-2 Stability).
                    </div>
                </div>
                <div id="coalition-proposals-list">
                    <!-- Proposals will be inserted here -->
                </div>
                
                <!-- Resolve Voting Button (only for admin/game master) -->
                <div style="margin-top: 24px; text-align: center;">
                    <button class="action-btn action-btn-risk" onclick="resolveCoalitionVoting()" style="max-width: 400px;">
                        Resolve Coalition Voting
                    </button>
                    <div style="margin-top: 8px; font-size: 0.8rem; color: #666;">
                        Only click when all parties have voted
                    </div>
                </div>
            </div>
            
            <!-- Party Stats Header -->
            <div class="section-header">Your Party Resources</div>
            <div class="stat-grid" style="grid-template-columns: repeat(3, 1fr); margin-bottom: 24px;">
                <div class="stat-card">
                    <div class="stat-label">Action Points</div>
                    <div class="stat-value" id="party-ap">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Party Funds</div>
                    <div class="stat-value" id="party-funds">—</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Approval Rating</div>
                    <div class="stat-value" id="party-approval">—</div>
                </div>
            </div>

            <!-- Campaign Actions -->
            <div class="section-header">Campaign Actions</div>
            <div class="action-grid">
                <!-- Grassroots Rally -->
                <div class="action-card">
                    <div class="action-header">
                        <div class="action-title">Grassroots Rally</div>
                        <div class="action-cost">2 AP • $50,000</div>
                    </div>
                    <div class="action-desc">Hold a rally to boost your party's approval rating. Roll 1D3 for approval gain.</div>
                    <button class="action-btn" onclick="performAction('rally')">Organize Rally</button>
                </div>

                <!-- Attack Ad -->
                <div class="action-card">
                    <div class="action-header">
                        <div class="action-title">Attack Ad</div>
                        <div class="action-cost">3 AP • $150,000</div>
                    </div>
                    <div class="action-desc">Run attack ads against a rival party. Roll 1D3 to reduce their approval.</div>
                    <div style="margin: 10px 0;">
                        <select id="attack-target" class="action-select">
                            <option value="">Select Target Party...</option>
                        </select>
                    </div>
                    <button class="action-btn" onclick="performAction('attack')">Launch Attack Ad</button>
                </div>

                <!-- Fundraiser -->
                <div class="action-card">
                    <div class="action-header">
                        <div class="action-title">Fundraiser</div>
                        <div class="action-cost">4 AP • Free</div>
                    </div>
                    <div class="action-desc">Host a fundraising event. Roll 1D2: 1 = $50k, 2 = $100k raised.</div>
                    <button class="action-btn" onclick="performAction('fundraiser')">Host Fundraiser</button>
                </div>

                <!-- Lobby Interest Group -->
                <div class="action-card">
                    <div class="action-header">
                        <div class="action-title">Lobby Interest Group</div>
                        <div class="action-cost">5 AP • Free</div>
                    </div>
                    <div class="action-desc">Lobby an interest group for funding. Roll 1D6 × $100k. Requires policy commitment!</div>
                    <div style="margin: 10px 0;">
                        <select id="lobby-target" class="action-select">
                            <option value="">Select Interest Group...</option>
                        </select>
                    </div>
                    <button class="action-btn action-btn-risk" onclick="performAction('lobby')">Lobby Group</button>
                </div>
            </div>

            <!-- Action Log -->
            <div class="section-header" style="margin-top: 30px;">Recent Actions</div>
            <div id="action-log" class="action-log">
                <div class="action-log-empty">No actions taken yet this campaign.</div>
            </div>

            <!-- Next Election -->
            <div class="section-header" style="margin-top: 30px;">Upcoming Elections</div>
            <div id="election-info" class="info-block">
                <div class="info-row">
                    <span class="info-label">Next Election</span>
                    <span class="info-value" id="next-election-tick">—</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Ticks Remaining</span>
                    <span class="info-value gold" id="ticks-until-election">—</span>
                </div>
            </div>
        </div>
    `;
    
    document.getElementById('content-area').innerHTML = html;
    
    // Load all data
    await loadElectionResults();
    await checkCoalitionStatus();
    await populatePartyStats();
    await populateDropdowns();
    await loadActionLog();
    await loadElectionInfo();
}

/**
 * Populate party resource stats
 */
async function populatePartyStats() {
    if (!currentFaction) return;
    
    document.getElementById('party-ap').textContent = currentFaction.action_points || 0;
    document.getElementById('party-funds').textContent = '$' + (currentFaction.party_funds || 0).toLocaleString();
    document.getElementById('party-approval').textContent = (currentFaction.approval_rating || 0) + '%';
}

/**
 * Populate attack target and lobby dropdowns
 */
async function populateDropdowns() {
    if (!currentFaction || !currentNation) return;
    
    // Get other parties for attack target
    const { data: parties } = await _supabase
        .from('factions')
        .select('id, faction_name')
        .eq('nation_id', currentNation.id)
        .eq('faction_type', 'party')
        .neq('id', currentFaction.id);
    
    const attackSelect = document.getElementById('attack-target');
    if (attackSelect && parties) {
        attackSelect.innerHTML = '<option value="">Select Target Party...</option>';
        parties.forEach(p => {
            attackSelect.innerHTML += `<option value="${p.id}">${p.faction_name}</option>`;
        });
    }
    
    // Get interest groups for lobbying
    const { data: groups } = await _supabase
        .from('interest_groups')
        .select('id, group_name')
        .eq('nation_id', currentNation.id);
    
    const lobbySelect = document.getElementById('lobby-target');
    if (lobbySelect) {
        lobbySelect.innerHTML = '<option value="">Select Interest Group...</option>';
        if (groups) {
            groups.forEach(g => {
                lobbySelect.innerHTML += `<option value="${g.id}">${g.group_name}</option>`;
            });
        }
    }
}

/**
 * Load recent action log
 */
async function loadActionLog() {
    if (!currentFaction) return;
    
    const { data: actions } = await _supabase
        .from('campaign_actions')
        .select('*')
        .eq('party_id', currentFaction.id)
        .order('created_at', { ascending: false })
        .limit(5);
    
    const logDiv = document.getElementById('action-log');
    if (!logDiv) return;
    
    if (!actions || actions.length === 0) {
        logDiv.innerHTML = '<div class="action-log-empty">No actions taken yet this campaign.</div>';
        return;
    }
    
    logDiv.innerHTML = actions.map(a => {
        const date = new Date(a.created_at).toLocaleString();
        let message = '';
        
        if (a.action_type === 'rally') {
            message = `Grassroots Rally: Gained ${a.result?.approval_gain || 0}% approval`;
        } else if (a.action_type === 'attack_ad') {
            message = `Attack Ad vs ${a.result?.target || 'Unknown'}: -${a.result?.approval_loss || 0}% to their approval`;
        } else if (a.action_type === 'fundraiser') {
            message = `Fundraiser: Raised $${(a.result?.money_raised || 0).toLocaleString()}`;
        } else if (a.action_type === 'lobby') {
            message = `Lobbied ${a.result?.group_name || 'Unknown'}: Received $${(a.result?.payout || 0).toLocaleString()}`;
        }
        
        return `<div class="action-log-item">
            <div class="action-log-time">Tick ${a.tick_performed} • ${date}</div>
            <div class="action-log-message">${message}</div>
        </div>`;
    }).join('');
}

/**
 * Load upcoming election info
 */
async function loadElectionInfo() {
    if (!currentNation) return;
    
    const { data: shard } = await _supabase
        .from('shard')
        .select('current_tick')
        .eq('name', 'Alpha Shard')
        .single();
    
    const { data: election } = await _supabase
        .from('elections')
        .select('*')
        .eq('nation_id', currentNation.id)
        .eq('status', 'scheduled')
        .order('election_tick', { ascending: true })
        .limit(1)
        .maybeSingle();
    
    if (election && shard) {
        const nextElectionEl = document.getElementById('next-election-tick');
        const ticksUntilEl = document.getElementById('ticks-until-election');
        
        if (nextElectionEl) nextElectionEl.textContent = 'Tick ' + election.election_tick;
        if (ticksUntilEl) ticksUntilEl.textContent = (election.election_tick - shard.current_tick) + ' ticks';
    }
}

/**
 * Load election results
 */
async function loadElectionResults() {
    if (!currentNation) return;
    
    try {
        const { data: election, error } = await _supabase
            .from('elections')
            .select('*')
            .eq('nation_id', currentNation.id)
            .eq('status', 'completed')
            .order('election_tick', { ascending: false })
            .limit(1)
            .maybeSingle();
        
        if (error) {
            console.error('Error loading election:', error);
            return;
        }
        
        if (!election || !election.results) {
            document.getElementById('election-results-section').style.display = 'none';
            return;
        }
        
        document.getElementById('election-results-section').style.display = 'block';
        
        // Get year from shard
        const { data: shard } = await _supabase
            .from('shard')
            .select('current_date')
            .eq('name', 'Alpha Shard')
            .single();
        
        if (shard) {
            const year = shard.current_date.split(', ')[1];
            document.getElementById('election-year').textContent = year;
        }
        
        const results = election.results.seats || [];
        const resultsHTML = results.map(r => {
            const votes = r.votes || 0;
            const percentage = r.vote_percentage || 0;
            const seats = r.seats || 0;
            
            return `<div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid #222; align-items: center;">
                <span style="font-size: 0.9rem; color: #ffcc00; font-weight: bold;">${r.party_name}</span>
                <span style="font-size: 0.85rem; color: #aaa; text-align: right;">${votes.toLocaleString()} Votes</span>
                <span style="font-size: 0.85rem; color: #aaa; text-align: right;">${percentage}%</span>
                <span style="font-size: 0.85rem; font-weight: bold; color: #4CAF50; text-align: right;">${seats} Seats</span>
            </div>`;
        }).join('');
        
        document.getElementById('election-results-list').innerHTML = resultsHTML;
        
    } catch (error) {
        console.error('Error in loadElectionResults:', error);
    }
}

/**
 * Perform a campaign action
 */
async function performAction(actionType) {
    if (!currentFaction) return;
    
    let result;
    
    try {
        if (actionType === 'rally') {
            const { data, error } = await _supabase.rpc('action_grassroots_rally', { 
                player_party_id: currentFaction.id 
            });
            if (error) throw error;
            result = data[0];
        } 
        else if (actionType === 'attack') {
            const targetId = document.getElementById('attack-target').value;
            if (!targetId) { alert('Please select a target party!'); return; }
            const { data, error } = await _supabase.rpc('action_attack_ad', { 
                player_party_id: currentFaction.id,
                target_party_id: targetId
            });
            if (error) throw error;
            result = data[0];
        }
        else if (actionType === 'fundraiser') {
            const { data, error } = await _supabase.rpc('action_fundraiser', { 
                player_party_id: currentFaction.id 
            });
            if (error) throw error;
            result = data[0];
        }
        else if (actionType === 'lobby') {
            const groupId = document.getElementById('lobby-target').value;
            if (!groupId) { alert('Please select an interest group!'); return; }
            const { data, error } = await _supabase.rpc('action_lobby_interest_group', { 
                player_party_id: currentFaction.id,
                interest_group_id: groupId
            });
            if (error) throw error;
            result = data[0];
        }
        
        if (result && result.success) {
            alert('✅ ' + result.message);
            
            // Update local state
            currentFaction.action_points = result.new_ap;
            currentFaction.party_funds = result.new_funds;
            if (result.new_approval) currentFaction.approval_rating = result.new_approval;
            
            // Refresh display
            await populatePartyStats();
            await loadActionLog();
            
            // Clear cache so other pages see updated data
            sessionStorage.removeItem('nationhood_state');
        } else {
            alert('❌ ' + (result ? result.message : 'Action failed'));
        }
        
    } catch (error) {
        console.error('Action error:', error);
        alert('❌ Error: ' + error.message);
    }
}

// ===== COALITION FUNCTIONS =====

/**
 * Check if coalition formation is needed
 */
async function checkCoalitionStatus() {
    if (!currentNation) return;
    
    // Get the most recent completed election
    const { data: election } = await _supabase
        .from('elections')
        .select('*')
        .eq('nation_id', currentNation.id)
        .eq('status', 'completed')
        .order('election_tick', { ascending: false })
        .limit(1)
        .maybeSingle();
    
    if (!election) return;
    
    currentElectionId = election.id;
    
    // Check if coalition needed
    const { data: coalitionCheck } = await _supabase
        .rpc('check_coalition_needed', {
            p_nation_id: currentNation.id,
            p_election_id: election.id
        });
    
    if (!coalitionCheck || coalitionCheck.length === 0) return;
    
    const check = coalitionCheck[0];
    
    if (check.needs_coalition) {
        // Load parties from election results
        coalitionParties = election.results.seats || [];
        
        // Check if proposals already exist
        const { data: existingProposals } = await _supabase
            .from('coalition_proposals')
            .select('*')
            .eq('election_id', election.id)
            .eq('status', 'pending');
        
        if (existingProposals && existingProposals.length > 0) {
            showCoalitionProposals(existingProposals);
        } else {
            showCoalitionSelection();
        }
    }
}

/**
 * Show coalition selection UI
 */
function showCoalitionSelection() {
    document.getElementById('coalition-selection-section').style.display = 'block';
    document.getElementById('coalition-proposals-section').style.display = 'none';
    
    // Calculate total seats and majority threshold
    totalSeatsInNation = coalitionParties.reduce((sum, p) => sum + (p.seats || 0), 0);
    majorityThreshold = Math.floor(totalSeatsInNation / 2) + 1;
    
    // Update the display
    document.getElementById('coalition-required-seats').textContent = `${majorityThreshold} / ${totalSeatsInNation}`;
    
    // Auto-select player's party
    selectedCoalitionParties = [currentFaction.id];
    
    // Render party grid
    const grid = document.getElementById('coalition-party-grid');
    grid.innerHTML = coalitionParties.map(party => {
        const isPlayerParty = party.party_id === currentFaction.id;
        const isSelected = selectedCoalitionParties.includes(party.party_id);
        
        return `
            <div class="coalition-party-card ${isSelected ? 'selected' : ''} ${isPlayerParty ? 'locked' : ''}" 
                 onclick="${isPlayerParty ? '' : `toggleCoalitionParty('${party.party_id}')`}"
                 data-party-id="${party.party_id}">
                <div class="coalition-party-header">
                    <div class="coalition-party-name">${party.party_name}</div>
                    <div class="coalition-party-seats">${party.seats} seats</div>
                </div>
                <div style="font-size: 0.8rem; color: #888;">
                    ${party.vote_percentage}% of vote
                </div>
                <div class="coalition-party-values" id="party-values-${party.party_id}">
                    <!-- Values will be loaded -->
                </div>
            </div>
        `;
    }).join('');
    
    // Load party ideologies
    coalitionParties.forEach(party => loadPartyValues(party.party_id));
    
    // Update seat count
    updateCoalitionSeats();
}

/**
 * Load party ideology values
 */
async function loadPartyValues(partyId) {
    const { data: party } = await _supabase
        .from('factions')
        .select('ideology_value_1, ideology_value_2')
        .eq('id', partyId)
        .single();
    
    if (party) {
        const container = document.getElementById(`party-values-${partyId}`);
        if (container) {
            const values = [party.ideology_value_1, party.ideology_value_2].filter(Boolean);
            container.innerHTML = values.map(v => 
                `<span class="ideology-tag tag-${v.toLowerCase()}">${v}</span>`
            ).join('');
        }
    }
}

/**
 * Toggle party selection for coalition
 */
function toggleCoalitionParty(partyId) {
    const index = selectedCoalitionParties.indexOf(partyId);
    if (index > -1) {
        selectedCoalitionParties.splice(index, 1);
    } else {
        selectedCoalitionParties.push(partyId);
    }
    
    // Update UI
    const card = document.querySelector(`.coalition-party-card[data-party-id="${partyId}"]`);
    if (card) {
        card.classList.toggle('selected');
    }
    
    updateCoalitionSeats();
}

/**
 * Update coalition seat count display
 */
function updateCoalitionSeats() {
    const totalSeats = selectedCoalitionParties.reduce((sum, partyId) => {
        const party = coalitionParties.find(p => p.party_id === partyId);
        return sum + (party ? party.seats : 0);
    }, 0);
    
    const seatsEl = document.getElementById('coalition-current-seats');
    if (seatsEl) {
        seatsEl.textContent = totalSeats;
        seatsEl.style.color = totalSeats >= majorityThreshold ? '#4CAF50' : '#ff4444';
    }
    
    // Enable/disable propose button
    const proposeBtn = document.getElementById('coalition-propose-btn');
    if (proposeBtn) {
        proposeBtn.disabled = totalSeats < majorityThreshold;
    }
    
    // Check for value conflicts
    if (selectedCoalitionParties.length > 1) {
        checkValueConflicts();
    } else {
        const conflictsEl = document.getElementById('coalition-conflicts');
        if (conflictsEl) conflictsEl.style.display = 'none';
    }
}

/**
 * Check for ideological conflicts in coalition
 */
async function checkValueConflicts() {
    const { data: conflicts } = await _supabase
        .rpc('calculate_value_conflicts', {
            p_party_ids: selectedCoalitionParties
        });
    
    if (conflicts && conflicts.length > 0) {
        const conflict = conflicts[0];
        
        if (conflict.stability_penalty > 0) {
            document.getElementById('coalition-conflicts').style.display = 'block';
            document.getElementById('coalition-stability-penalty').textContent = `-${conflict.stability_penalty}`;
            
            const conflictsList = JSON.parse(conflict.conflicts);
            document.getElementById('coalition-conflicts-list').innerHTML = conflictsList
                .map(c => `• ${c.conflict}`)
                .join('<br>');
        } else {
            document.getElementById('coalition-conflicts').style.display = 'none';
        }
    }
}

/**
 * Propose a coalition
 */
async function proposeCoalition() {
    if (selectedCoalitionParties.length === 0 || !currentElectionId) {
        alert('❌ Error: No parties selected');
        return;
    }
    
    try {
        const { data, error } = await _supabase.rpc('propose_coalition', {
            p_proposer_party_id: currentFaction.id,
            p_nation_id: currentNation.id,
            p_election_id: currentElectionId,
            p_party_ids: selectedCoalitionParties
        });
        
        if (error) throw error;
        
        const result = data[0];
        if (result.success) {
            alert(`✅ ${result.message}\n\nTotal Seats: ${result.total_seats}\nStability Penalty: -${result.stability_penalty}`);
            
            // Reload to show proposals
            checkCoalitionStatus();
        } else {
            alert(`❌ ${result.message}`);
        }
    } catch (error) {
        console.error('Coalition proposal error:', error);
        alert('❌ Error proposing coalition: ' + error.message);
    }
}

/**
 * Show coalition proposals UI
 */
async function showCoalitionProposals(proposals) {
    document.getElementById('coalition-selection-section').style.display = 'none';
    document.getElementById('coalition-proposals-section').style.display = 'block';
    
    const container = document.getElementById('coalition-proposals-list');
    
    // Load votes for each proposal
    const proposalsWithVotes = await Promise.all(proposals.map(async (proposal) => {
        const { data: votes } = await _supabase
            .from('coalition_votes')
            .select('*')
            .eq('coalition_proposal_id', proposal.id);
        
        const acceptVotes = votes?.filter(v => v.vote === 'accept').length || 0;
        const rejectVotes = votes?.filter(v => v.vote === 'reject').length || 0;
        const userVote = votes?.find(v => v.party_id === currentFaction.id);
        
        return { ...proposal, acceptVotes, rejectVotes, userVote };
    }));
    
    container.innerHTML = proposalsWithVotes.map(proposal => {
        const conflicts = JSON.parse(proposal.value_conflicts || '[]');
        
        return `
            <div class="coalition-proposal-card">
                <div class="coalition-proposal-header">
                    <div>
                        <div style="font-size: 1.1rem; color: #ffcc00; font-weight: bold;">
                            Coalition Proposal
                        </div>
                        <div style="font-size: 0.8rem; color: #888; margin-top: 4px;">
                            Proposed by ${getPartyName(proposal.proposer_party_id)}
                        </div>
                    </div>
                    <div style="text-align: right;">
                        <div style="font-size: 1.3rem; color: #4CAF50; font-weight: bold;">
                            ${proposal.total_seats} seats
                        </div>
                        <div style="font-size: 0.8rem; color: #888;">
                            ${proposal.seat_percentage}%
                        </div>
                    </div>
                </div>
                
                <div class="coalition-proposal-parties">
                    ${proposal.party_ids.map(id => `
                        <div class="coalition-proposal-party-tag">
                            ${getPartyName(id)}
                        </div>
                    `).join('')}
                </div>
                
                ${proposal.stability_penalty > 0 ? `
                    <div style="padding: 12px; background: #2a1a1a; border-left: 3px solid #ff4444; border-radius: 4px; margin-bottom: 16px;">
                        <div style="font-size: 0.85rem; color: #ff4444; font-weight: bold;">
                            ⚠ Stability Penalty: -${proposal.stability_penalty}
                        </div>
                        <div style="font-size: 0.8rem; color: #aaa; margin-top: 4px;">
                            ${conflicts.map(c => c.conflict).join(', ')}
                        </div>
                    </div>
                ` : ''}
                
                <div class="coalition-vote-buttons">
                    <button class="vote-btn-accept" 
                            onclick="voteOnCoalition('${proposal.id}', 'accept')"
                            ${proposal.userVote ? 'disabled' : ''}>
                        ${proposal.userVote?.vote === 'accept' ? '✓ Accepted' : 'Accept'}
                    </button>
                    <button class="vote-btn-reject" 
                            onclick="voteOnCoalition('${proposal.id}', 'reject')"
                            ${proposal.userVote ? 'disabled' : ''}>
                        ${proposal.userVote?.vote === 'reject' ? '✓ Rejected' : 'Reject'}
                    </button>
                </div>
                
                <div class="coalition-vote-count">
                    <div class="vote-count-item">
                        <span class="vote-count-accept">✓ ${proposal.acceptVotes} Accept</span>
                    </div>
                    <div class="vote-count-item">
                        <span class="vote-count-reject">✗ ${proposal.rejectVotes} Reject</span>
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

/**
 * Get party name from coalition parties list
 */
function getPartyName(partyId) {
    const party = coalitionParties.find(p => p.party_id === partyId);
    return party ? party.party_name : 'Unknown Party';
}

/**
 * Vote on a coalition proposal
 */
async function voteOnCoalition(coalitionId, vote) {
    try {
        const { data, error } = await _supabase.rpc('vote_on_coalition', {
            p_coalition_id: coalitionId,
            p_party_id: currentFaction.id,
            p_vote: vote
        });
        
        if (error) throw error;
        
        const result = data[0];
        if (result.success) {
            alert(`✅ ${result.message}`);
            
            // Reload proposals to show updated votes
            const { data: proposals } = await _supabase
                .from('coalition_proposals')
                .select('*')
                .eq('election_id', currentElectionId)
                .eq('status', 'pending');
            
            if (proposals) {
                showCoalitionProposals(proposals);
            }
        } else {
            alert(`❌ ${result.message}`);
        }
    } catch (error) {
        console.error('Vote error:', error);
        alert('❌ Error voting: ' + error.message);
    }
}

/**
 * Resolve coalition voting (admin function)
 */
async function resolveCoalitionVoting() {
    if (!confirm('Are you sure you want to resolve coalition voting? This will finalize the government formation.')) {
        return;
    }
    
    try {
        const { data, error } = await _supabase.rpc('resolve_coalition_voting', {
            p_nation_id: currentNation.id,
            p_election_id: currentElectionId
        });
        
        if (error) throw error;
        
        const result = data[0];
        alert(`${result.success ? '✅' : '❌'} ${result.message}`);
        
        if (result.success) {
            // Hide coalition sections
            document.getElementById('coalition-selection-section').style.display = 'none';
            document.getElementById('coalition-proposals-section').style.display = 'none';
            
            // Clear cache and reload
            sessionStorage.removeItem('nationhood_state');
            location.reload();
        }
    } catch (error) {
        console.error('Resolve voting error:', error);
        alert('❌ Error resolving: ' + error.message);
    }
}
</script>
