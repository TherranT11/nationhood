<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elections | Nationhood Alpha</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/elections.css">
</head>
<body>

<div id="top-bar"></div>

<div id="content-area">
    <div class="loading-container">
        <div class="loading-spinner"></div>
        <div>Loading...</div>
    </div>
</div>


<script type="module">
import { _supabase } from './js/supabase-client.js';
import { initPage, formatNumber } from './js/common.js';
import './js/guide.js';
import { escapeHtml } from './js/utils.js';
import { GAME_CONFIG, initGameConfigForNation, isGovernmentPresidential, loadSeats, runElectionPreview, getPartyAlignment, distributeVotes, allocateSeatsByVotes } from './js/game-common.js';
import { getPartyIconSVG, getPartyLogoHTML } from './js/party-icons.js';
(function () {
    'use strict';
/**
 * Elections / Government Formation Page
 * 
 * Campaign actions (Rally, Attack Ad, Fundraiser, Lobby) have been moved to politics.html.
 * Formation rules:
 * - Any party with 1+ seats can propose a coalition
 * - Only coalition (invited) parties see support options
 * - A party can only support ONE coalition at a time
 * - Proposer auto-supports their own coalition
 * - Instant formation: ALL coalition members support + majority seats + all ministries assigned
 * - Tick resolution: half+ coalition members support + majority seats → best qualifying wins
 * - If no coalition qualifies after tick: extend 1 tick, stability -1, all parties lose 1d3 approval
 */

let currentFaction = null;
let currentNation = null;
let currentElectionId = null;
let isPresidential = false;
let allParties = [];
let electionResults = [];
let totalLegislatureSeats = 0;
const GENERAL_ELECTION_TYPE = 'parliamentary';
const FALLBACK_COLORS = ['#E91E63','#5b9bd5','#5cb85c','#d48a3c','#9C27B0','#00BCD4','#d9534f','#8BC34A','#FFC107','#673AB7'];

function getPartyColor(partyId, fallbackIndex) {
    const p = allParties.find(x => x.id === partyId);
    return p?.party_color || FALLBACK_COLORS[fallbackIndex % FALLBACK_COLORS.length];
}
function getPartyLogo(partyId) {
    const p = allParties.find(x => x.id === partyId);
    return p?.party_logo || null;
}
function getPartyCustomLogoUrl(partyId) {
    const p = allParties.find(x => x.id === partyId);
    return p?.custom_logo_url || null;
}

async function fetchLatestCompletedGeneralElection() {
    const { data: latestElection } = await _supabase
        .from('elections')
        .select('*')
        .eq('nation_id', currentNation.id)
        .eq('status', 'completed')
        .eq('election_type', GENERAL_ELECTION_TYPE)
        .order('election_tick', { ascending: false })
        .limit(1)
        .maybeSingle();

    return latestElection;
}


// ===================================================================
// INIT
// ===================================================================

initPage('elections', async (state) => {
    const { nation, faction } = state;
    currentFaction = faction;
    currentNation = nation;
    initGameConfigForNation(nation);

    if (!nation) {
        document.getElementById('content-area').innerHTML = `
            <div class="placeholder-panel">
                <div class="ph-icon">🗳️</div>
                <h3>No Nation Selected</h3>
                <p>Your party is not assigned to a nation yet.</p>
            </div>`;
        return;
    }

    isPresidential = isGovernmentPresidential(nation);
    await renderDemocracyPage();
});


// ===================================================================
// DEMOCRACY PAGE
// ===================================================================

async function renderDemocracyPage() {
    const { data: parties } = await _supabase
        .from('factions')
        .select('id, faction_name, seats, abbreviation, ideology_value_1, ideology_value_2, party_color, party_logo, custom_logo_url')
        .eq('nation_id', currentNation.id)
        .eq('faction_type', 'party')
        .order('seats', { ascending: false });
    allParties = parties || [];

    // For Presidential systems, fetch both latest parliamentary and presidential elections separately
    let election = null;
    let presidentialElection = null;
    if (isPresidential) {
        election = await fetchLatestCompletedGeneralElection();

        const { data: presElection } = await _supabase
            .from('elections')
            .select('*')
            .eq('nation_id', currentNation.id)
            .eq('status', 'completed')
            .eq('election_type', 'presidential')
            .order('election_tick', { ascending: false })
            .limit(1)
            .maybeSingle();
        presidentialElection = presElection;
    } else {
        election = await fetchLatestCompletedGeneralElection();
    }

    currentElectionId = election?.id || null;
    electionResults = election?.results?.votes || [];

    totalLegislatureSeats = electionResults.reduce((sum, r) => sum + (r.seats || 0), 0);
    if (totalLegislatureSeats === 0) {
        totalLegislatureSeats = allParties.reduce((sum, p) => sum + (p.seats || 0), 0);
    }

    const html = `
        <div class="panel-padding">
            <!-- Presidential Candidate Results (Presidential systems only) -->
            ${isPresidential ? `
            <div id="presidential-results-section" style="display: ${presidentialElection ? 'block' : 'none'};">
                <div class="section-header">Presidential Election — <span id="presidential-election-year"></span></div>
                <div class="info-block" style="margin-bottom: 24px;">
                    <div id="presidential-results-list"></div>
                </div>
            </div>
            ` : ''}

            <!-- Parliamentary Election Results -->
            <div id="election-results-section" style="display: ${election ? 'block' : 'none'};">
                <div class="section-header">${isPresidential ? 'Parliamentary Election' : 'Election Results'} — <span id="election-year"></span></div>
                <div class="info-block" style="margin-bottom: 24px;">
                    <div id="election-results-list"></div>
                </div>
            </div>
            ${!election ? `
            <div class="info-block" style="margin-bottom: 24px; text-align: center; padding: 32px 16px;">
                <div style="font-size: 1.6rem; margin-bottom: 10px;">🗳️</div>
                <div style="font-size: 1rem; color: var(--text-secondary); font-weight: bold; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px;">No Election Held Yet</div>
                <div style="font-size: 0.85rem; color: #666;">The first election will be held once enough parties have joined the nation.</div>
            </div>
            ` : ''}

            <div class="section-header" style="margin-top: 30px;">Upcoming Elections</div>
            ${isPresidential ? `
            <div id="election-info" class="info-block">
                <div class="info-row">
                    <span class="info-label">Next Parliamentary Election</span>
                    <span class="info-value" id="next-parliamentary-tick">—</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Ticks Remaining</span>
                    <span class="info-value gold" id="ticks-until-parliamentary">—</span>
                </div>
                <div class="info-row" style="border-top: 1px solid #333; margin-top: 8px; padding-top: 8px;">
                    <span class="info-label">Next Presidential Election</span>
                    <span class="info-value" id="next-presidential-tick">—</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Ticks Remaining</span>
                    <span class="info-value gold" id="ticks-until-presidential">—</span>
                </div>
            </div>
            ` : `
            <div id="election-info" class="info-block">
                <div class="info-row">
                    <span class="info-label">Next Election</span>
                    <span class="info-value" id="next-election-tick">—</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Ticks Remaining</span>
                    <span class="info-value gold" id="ticks-until-election">—</span>
                </div>
            </div>
            `}

            <!-- Election Breakdown (per-bloc voting detail) -->
            <div id="election-breakdown-section" style="display: block; margin-top: 30px;">
                <div class="section-header">Election Breakdown</div>
                <div id="election-breakdown-content">
                    <div class="breakdown-loading">Loading election breakdown...</div>
                </div>
            </div>
        </div>
    `;

    document.getElementById('content-area').innerHTML = html;

    if (isPresidential && presidentialElection) {
        await renderPresidentialResults(presidentialElection);
    }
    await renderElectionResults(election);
    renderElectionBreakdown(election); // fire-and-forget
    await loadElectionInfo();
}


// ===================================================================
// ELECTION RESULTS
// ===================================================================

async function renderElectionResults(election) {
    if (!election || !election.results) return;

    const { data: shard } = await _supabase.from('shard').select('current_date, current_tick').eq('name', 'Alpha Shard').single();
    if (shard) {
        const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const currentMonth = shard.current_date.split(', ')[0];
        const currentYear = parseInt(shard.current_date.split(', ')[1]);
        const currentMonthIndex = months.indexOf(currentMonth);
        const tickDiff = shard.current_tick - election.election_tick;
        let electionMonthIndex = currentMonthIndex - tickDiff;
        let electionYear = currentYear;
        while (electionMonthIndex < 0) { electionMonthIndex += 12; electionYear -= 1; }
        const dateStr = `${months[electionMonthIndex % 12]}, ${electionYear}`;
        document.getElementById('election-year').textContent = dateStr;
    }

    const results = election.results.votes || [];

    document.getElementById('election-results-list').innerHTML = results.map((r, idx) => {
        const pColor = getPartyColor(r.party_id, idx);
        const pLogo = getPartyLogo(r.party_id);
        const pCustomLogoUrl = getPartyCustomLogoUrl(r.party_id);
        const logoHtml = (pLogo || pCustomLogoUrl) ? `<span style="display:inline-flex;vertical-align:middle;margin-right:6px;">${getPartyLogoHTML({ customLogoUrl: pCustomLogoUrl, iconKey: pLogo, size: 18, color: pColor })}</span>` : '';
        return `
        <div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid #222; align-items: center; border-left: 3px solid ${pColor}; padding-left: 10px;">
            <span style="font-size: 0.9rem; color: ${pColor}; font-weight: bold;">${logoHtml}${r.party_name}</span>
            <span style="font-size: 0.85rem; color: #aaa; text-align: right;">${(r.votes || 0).toLocaleString()} Votes</span>
            <span style="font-size: 0.85rem; color: #aaa; text-align: right;">${r.vote_percentage || 0}%</span>
            <span style="font-size: 0.85rem; font-weight: bold; color: #5cb85c; text-align: right;">${r.seats || 0} Seats</span>
        </div>`;
    }).join('');
}


// ===================================================================
// ELECTION BREAKDOWN (per-bloc voter detail)
// ===================================================================

async function renderElectionBreakdown(election) {
    const container = document.getElementById('election-breakdown-content');
    if (!container) return;
    const renderElectionId = election?.id || null;

    if (!election) {
        container.innerHTML = '<div style="color:#888; padding:16px; font-size:0.85rem;">No completed parliamentary election is available yet.</div>';
        return;
    }

    let blocDetails = election?.results?.bloc_details || [];
    let partyNames = {};

    if (!Array.isArray(blocDetails)) {
        blocDetails = [];
    }

    if (renderElectionId && currentElectionId && renderElectionId !== currentElectionId) {
        return;
    }

    if (blocDetails.length === 0) {
        container.innerHTML = '<div style="color:#666; padding:16px; font-size:0.85rem;">No historical bloc breakdown stored for this election.</div>';
        return;
    }

    try {
        // Compute and display election date
        const { data: shard } = await _supabase.from('shard').select('current_date, current_tick').eq('name', 'Alpha Shard').single();
        if (shard && election.election_tick != null) {
            const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            const currentMonth = shard.current_date.split(', ')[0];
            const currentYear = parseInt(shard.current_date.split(', ')[1]);
            const currentMonthIndex = months.indexOf(currentMonth);
            const tickDiff = shard.current_tick - election.election_tick;
            let electionMonthIndex = currentMonthIndex - tickDiff;
            let electionYear = currentYear;
            while (electionMonthIndex < 0) { electionMonthIndex += 12; electionYear -= 1; }
            const dateStr = `${months[electionMonthIndex % 12]}, ${electionYear}`;
            const section = document.getElementById('election-breakdown-section');
            const existingLabel = section?.querySelector('.breakdown-date-label');
            if (existingLabel) existingLabel.remove();
            if (section) {
                section.querySelector('.section-header')?.insertAdjacentHTML('afterend',
                    `<div class="breakdown-date-label" style="color:#888; font-size:0.78rem; margin-bottom:6px; padding:0 16px;">Last Election: ${dateStr}</div>`);
            }
        }
        if (!Object.keys(partyNames).length) {
            for (const vote of (election?.results?.votes || [])) {
                if (vote?.party_id && vote?.party_name) {
                    partyNames[vote.party_id] = vote.party_name;
                }
            }
        }

        const sorted = [...blocDetails].sort((a, b) => b.voter_count - a.voter_count);

        const ideologyColors = {
            'LIBERTY': '#9C27B0', 'EQUALITY': '#E91E63', 'FREEDOM': '#5b9bd5',
            'SECURITY': '#d48a3c', 'INDIVIDUALISM': '#eab308', 'COLLECTIVISM': '#ec4899',
            'TRADITION': '#795548', 'PROGRESS': '#00BCD4', 'NATIONALISM': '#FF5722',
            'GLOBALISM': '#3F51B5'
        };

        if (renderElectionId && currentElectionId && renderElectionId !== currentElectionId) {
            return;
        }

        container.innerHTML = sorted.map((bloc, idx) => {
            const blocId = 'breakdown-bloc-' + idx;

            // Ideology tags
            const tagsHtml = (bloc.tags || []).length > 0
                ? bloc.tags.map(tag => `<span class="ideology-tag tag-${tag.toLowerCase()}">${tag.toUpperCase()}</span>`).join('')
                : '<span style="font-size:0.78rem; color:#666; font-style:italic;">Unaligned</span>';

            // Party vote bars (normalize modern and legacy payloads)
            const normalizedPartyVotes = Array.isArray(bloc.party_votes)
                ? bloc.party_votes.map(entry => ({
                    partyId: entry?.party_id || null,
                    name: entry?.party_name || partyNames[entry?.party_id] || (entry?.party_id ? entry.party_id.slice(0, 8) : 'Unknown Party'),
                    votes: Number(entry?.votes) || 0
                }))
                : (bloc?.blocVotes && typeof bloc.blocVotes === 'object'
                    ? Object.entries(bloc.blocVotes).map(([pid, votes]) => ({
                        partyId: pid,
                        name: partyNames[pid] || pid.slice(0, 8),
                        votes: Number(votes) || 0
                    }))
                    : []);
            const voteEntries = normalizedPartyVotes.sort((a, b) => b.votes - a.votes);
            const maxVotes = voteEntries.length > 0 ? voteEntries[0].votes : 0;
            const abstentions = Number(bloc?.abstentions) || 0;
            const blocVoterCount = Number(bloc?.voter_count) || 0;
            const totalVotesFromEntries = voteEntries.reduce((sum, entry) => sum + entry.votes, 0);
            const totalVotesFromVoters = Math.max(blocVoterCount - abstentions, 0);
            const voteTotalForPct = totalVotesFromEntries > 0 ? totalVotesFromEntries : totalVotesFromVoters;

            const votesHtml = voteEntries.map((e, eIdx) => {
                const barWidth = maxVotes > 0 ? (e.votes / maxVotes) * 100 : 0;
                const isTop = e.votes === maxVotes;
                const pColor = e.partyId ? getPartyColor(e.partyId, eIdx) : (isTop ? '#ffcc00' : '#555');
                const barColor = pColor;
                const topClass = isTop ? ' top-party' : '';
                const pct = voteTotalForPct > 0 ? ((e.votes / voteTotalForPct) * 100).toFixed(1) : '0.0';
                return `<div class="bloc-vote-row">
                    <span class="bloc-vote-name${topClass}" style="color:${pColor}">${e.name}</span>
                    <div class="bloc-vote-bar-wrap">
                        <div class="bloc-vote-bar" style="width:${barWidth}%; background:${barColor};"></div>
                    </div>
                    <span class="bloc-vote-count${topClass}">${e.votes.toLocaleString()} (${pct}%)</span>
                </div>`;
            }).join('');

            // Abstentions
            const abstentionsHtml = abstentions > 0
                ? `<div class="bloc-abstentions">Abstained: ${abstentions.toLocaleString()} voters</div>`
                : '';

            return `<div class="bloc-row" id="${blocId}">
                <div class="bloc-row-header" onclick="document.getElementById('${blocId}').classList.toggle('expanded')">
                    <div class="bloc-row-left">
                        <span class="bloc-row-name">${bloc.bloc_name}</span>
                        <span class="bloc-row-count">${blocVoterCount.toLocaleString()} voters</span>
                    </div>
                    <div class="bloc-row-arrow">&#9654;</div>
                </div>
                <div class="bloc-row-content">
                    <div class="bloc-tags-row">${tagsHtml}</div>
                    <div>${votesHtml}</div>
                    ${abstentionsHtml}
                </div>
            </div>`;
        }).join('');
    } catch (err) {
        console.error('Election breakdown error:', err);
        container.innerHTML = '<div style="color:#ff6666; padding:16px; font-size:0.85rem;">Could not load election breakdown.</div>';
    }
}


/**
 * Render presidential candidate election results (candidate-level popular vote).
 */
async function renderPresidentialResults(election) {
    if (!election || !election.results) return;
    const wasRunoff = election.results.was_runoff || false;
    const round1Candidates = election.results.round_1_candidates || [];
    const runoffCandidates = election.results.runoff_candidates || [];
    // Final results: if runoff happened, show runoff results as the main table; otherwise show presidential_candidates
    const candidates = wasRunoff ? runoffCandidates : (election.results.presidential_candidates || []);
    if (candidates.length === 0 && round1Candidates.length === 0) {
        const el = document.getElementById('presidential-results-list');
        if (el) el.innerHTML = '<div style="color:#888;padding:12px 0;">No presidential election results yet.</div>';
        return;
    }

    // Calculate election date
    const { data: shard } = await _supabase.from('shard').select('current_date, current_tick').eq('name', 'Alpha Shard').single();
    if (shard) {
        const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const currentMonth = shard.current_date.split(', ')[0];
        const currentYear = parseInt(shard.current_date.split(', ')[1]);
        const currentMonthIndex = months.indexOf(currentMonth);
        const tickDiff = shard.current_tick - election.election_tick;
        let electionMonthIndex = currentMonthIndex - tickDiff;
        let electionYear = currentYear;
        while (electionMonthIndex < 0) { electionMonthIndex += 12; electionYear -= 1; }
        const dateStr = `${months[electionMonthIndex % 12]}, ${electionYear}`;
        const yearEl = document.getElementById('presidential-election-year');
        if (yearEl) yearEl.textContent = dateStr;
    }

    const ideologyColors = {
        'LIBERTY': '#9C27B0', 'EQUALITY': '#E91E63', 'FREEDOM': '#5b9bd5',
        'SECURITY': '#d48a3c', 'INDIVIDUALISM': '#eab308', 'COLLECTIVISM': '#ec4899',
        'TRADITION': '#795548', 'PROGRESS': '#00BCD4', 'NATIONALISM': '#FF5722',
        'GLOBALISM': '#3F51B5'
    };

    function renderCandidateTable(candidateList, tableLabel) {
        const sorted = [...candidateList].sort((a, b) => b.votes - a.votes);
        const tableWinner = sorted[0];
        let tbl = '';

        // Header row
        tbl += `
            <div style="font-size:0.78rem;color:#aaa;text-transform:uppercase;letter-spacing:1px;font-weight:bold;margin:12px 0 6px 0;">${tableLabel}</div>
            <div style="display:grid;grid-template-columns:2fr 1.5fr 1fr 0.8fr;gap:12px;padding:8px 0;border-bottom:2px solid #333;font-size:0.75rem;color:#888;text-transform:uppercase;letter-spacing:1px;">
                <span>Candidate</span>
                <span>Party</span>
                <span style="text-align:right;">Votes</span>
                <span style="text-align:right;">%</span>
            </div>`;

        tbl += sorted.map((c, cIdx) => {
            const ideo = (c.ideology || '').toUpperCase();
            const color = ideologyColors[ideo] || '#888';
            const isWinner = c.winner || c.candidate_id === tableWinner.candidate_id;
            const cPartyColor = getPartyColor(c.party_id || c.faction_id, cIdx);
            const cLogo = getPartyLogo(c.party_id || c.faction_id);
            const cCustomLogoUrl = getPartyCustomLogoUrl(c.party_id || c.faction_id);
            const cLogoHtml = (cLogo || cCustomLogoUrl) ? `<span style="display:inline-flex;vertical-align:middle;margin-right:5px;">${getPartyLogoHTML({ customLogoUrl: cCustomLogoUrl, iconKey: cLogo, size: 16, color: cPartyColor })}</span>` : '';
            return `
                <div style="display:grid;grid-template-columns:2fr 1.5fr 1fr 0.8fr;gap:12px;padding:12px 0;border-bottom:1px solid #222;align-items:center;border-left:3px solid ${cPartyColor};padding-left:10px;">
                    <span style="font-size:0.9rem;color:${isWinner ? '#5cb85c' : '#e0e0e0'};font-weight:bold;">
                        ${isWinner ? '&#x2713; ' : ''}${c.candidate_name}
                        <span style="display:inline-block;padding:2px 6px;border-radius:3px;font-size:0.6rem;font-weight:bold;color:#fff;background:${color};margin-left:6px;vertical-align:middle;">${c.ideology}</span>
                    </span>
                    <span style="font-size:0.85rem;color:#aaa;">${cLogoHtml}${c.party_name}</span>
                    <span style="font-size:0.85rem;color:#aaa;text-align:right;">${(c.votes || 0).toLocaleString()}</span>
                    <span style="font-size:0.85rem;color:#aaa;text-align:right;">${c.vote_percentage || 0}%</span>
                </div>`;
        }).join('');

        return tbl;
    }

    function getFirstDefined(...values) {
        for (const value of values) {
            if (value !== null && value !== undefined && value !== '') return value;
        }
        return null;
    }

    function formatSignedStat(value, suffix = '') {
        if (value === null || value === undefined || value === '') return '—';
        const num = Number(value);
        if (Number.isNaN(num)) return `${value}${suffix}`;
        const sign = num > 0 ? '+' : '';
        return `${sign}${num}${suffix}`;
    }

    // Determine the overall winner from final results
    const finalCandidates = candidates.length > 0 ? candidates : round1Candidates;
    const sorted = [...finalCandidates].sort((a, b) => b.votes - a.votes);
    const winner = sorted[0];

    const winnerIdeology = (winner.ideology || '').toUpperCase();
    const winnerColor = ideologyColors[winnerIdeology] || '#888';
    const winnerPartyColor = getPartyColor(winner.party_id || winner.faction_id, 0);
    const winnerLogo = getPartyLogo(winner.party_id || winner.faction_id);
    const winnerCustomLogoUrl = getPartyCustomLogoUrl(winner.party_id || winner.faction_id);
    const winnerLogoHtml = (winnerLogo || winnerCustomLogoUrl) ? `<span style="display:inline-flex;vertical-align:middle;margin-right:8px;">${getPartyLogoHTML({ customLogoUrl: winnerCustomLogoUrl, iconKey: winnerLogo, size: 22, color: winnerPartyColor })}</span>` : '';

    // Winner banner
    let html = `
        <div style="background:linear-gradient(135deg,#1a2a1a,#0a1a0a);border:2px solid #5cb85c;border-radius:8px;padding:16px;margin-bottom:16px;border-left:4px solid ${winnerPartyColor};">
            <div style="font-size:0.75rem;color:#5cb85c;text-transform:uppercase;letter-spacing:1px;font-weight:bold;margin-bottom:6px;">Presidential Election Winner${wasRunoff ? ' (Runoff)' : ''}</div>
            <div style="font-size:1.1rem;color:#fff;font-weight:bold;">${winner.candidate_name}</div>
            <div style="font-size:0.85rem;color:#aaa;margin-top:4px;">
                ${winnerLogoHtml}${winner.party_name}
                <span style="display:inline-block;padding:2px 8px;border-radius:3px;font-size:0.65rem;font-weight:bold;color:#fff;background:${winnerColor};margin-left:8px;vertical-align:middle;">${winner.ideology}</span>
            </div>
            <div style="font-size:0.82rem;color:#aaa;margin-top:4px;">${(winner.votes || 0).toLocaleString()} votes (${winner.vote_percentage || 0}%)</div>
        </div>`;

    if (wasRunoff) {
        // Runoff banner
        html += `
            <div style="background:linear-gradient(135deg,#2a1a0a,#1a0a00);border:1px solid #d48a3c;border-radius:6px;padding:10px 14px;margin-bottom:16px;">
                <span style="font-size:0.75rem;color:#d48a3c;font-weight:bold;text-transform:uppercase;letter-spacing:1px;">Runoff Election</span>
                <span style="font-size:0.78rem;color:#aaa;margin-left:8px;">No candidate won a majority in Round 1. The top two advanced to a runoff.</span>
            </div>`;

        // Runoff results table (final round)
        if (runoffCandidates.length > 0) {
            html += renderCandidateTable(runoffCandidates, 'Runoff Results');
        }

        // Round 1 results table (collapsed by default)
        if (round1Candidates.length > 0) {
            html += `
                <details style="margin-top:16px;">
                    <summary style="cursor:pointer;font-size:0.78rem;color:#888;text-transform:uppercase;letter-spacing:1px;font-weight:bold;padding:8px 0;">Round 1 Results (${round1Candidates.length} candidates)</summary>
                    <div style="opacity:0.8;">${renderCandidateTable(round1Candidates, 'Round 1')}</div>
                </details>`;
        }
    } else {
        // Standard single-round results
        html += renderCandidateTable(candidates, 'Results');
    }

    // Runoff transfer/endorsement details (if present in result payload)
    const winnerRound1 = round1Candidates.find(c => c.candidate_id === winner.candidate_id) || null;
    const winnerRound1Votes = winnerRound1?.votes || 0;
    const winnerTransferredVotes = Math.max(0, (winner.votes || 0) - winnerRound1Votes);
    const winnerTransferredRate = winnerRound1Votes > 0
        ? Math.round((winnerTransferredVotes / winnerRound1Votes) * 10000) / 100
        : 0;
    const runnerUp = sorted[1] || null;
    const winnerMarginVotes = runnerUp ? (winner.votes || 0) - (runnerUp.votes || 0) : 0;
    const winnerMarginPct = runnerUp ? ((winner.vote_percentage || 0) - (runnerUp.vote_percentage || 0)).toFixed(2) : '0.00';

    const runoffMeta = election.results?.runoff_meta || election.results?.runoff_details || election.results?.runoff_transfer || {};
    const endorsedPartyName = getFirstDefined(
        winner.endorsed_party_name,
        winner.endorsed_party,
        runoffMeta.endorsed_party_name,
        runoffMeta.endorsed_party,
        election.results?.endorsed_party_name,
        election.results?.endorsed_party
    );
    const abstainVotes = getFirstDefined(
        runoffMeta.abstain_votes,
        runoffMeta.abstentions,
        runoffMeta.abstain_count,
        election.results?.runoff_abstentions
    );
    const protestVotes = getFirstDefined(
        runoffMeta.protest_votes,
        runoffMeta.protest_count,
        runoffMeta.protests,
        election.results?.runoff_protest_votes
    );

    html += `
        <div style="margin-top:16px;background:#151515;border:1px solid #2b2b2b;border-radius:6px;padding:12px 14px;">
            <div style="font-size:0.74rem;color:#aaa;text-transform:uppercase;letter-spacing:1px;font-weight:bold;margin-bottom:8px;">Runoff Transfer Snapshot</div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 16px;font-size:0.82rem;color:#bbb;">
                <div><span style="color:#777;">Endorsed Party:</span> ${escapeHtml(endorsedPartyName || '—')}</div>
                <div><span style="color:#777;">Round 1 Votes (${escapeHtml(winner.candidate_name)}):</span> ${winnerRound1Votes.toLocaleString()}</div>
                <div><span style="color:#777;">Transferred Votes:</span> ${winnerTransferredVotes.toLocaleString()} (${winnerTransferredRate}%)</div>
                <div><span style="color:#777;">Abstain / Protest Split:</span> ${(abstainVotes ?? 0).toLocaleString()} / ${(protestVotes ?? 0).toLocaleString()}</div>
                <div><span style="color:#777;">Margin vs Runner-up:</span> ${winnerMarginVotes.toLocaleString()} votes (${winnerMarginPct} pp)</div>
            </div>
            <div style="margin-top:10px;font-size:0.76rem;color:#888;">Endorsement came from pre-election preference locked for this election.</div>
        </div>`;

    // Consequences (approval/polarization only; debt intentionally omitted)
    const consequenceSource = election.results?.consequences || election.results?.runoff_consequences || election.results?.effects_applied || null;
    if (consequenceSource) {
        const approvalDelta = getFirstDefined(
            consequenceSource.approval,
            consequenceSource.approval_change,
            consequenceSource.approval_delta
        );
        const polarizationDelta = getFirstDefined(
            consequenceSource.polarization,
            consequenceSource.polarization_change,
            consequenceSource.polarization_delta
        );

        if (approvalDelta !== null || polarizationDelta !== null) {
            html += `
                <div style="margin-top:12px;background:#111826;border:1px solid #2a3550;border-radius:6px;padding:12px 14px;">
                    <div style="font-size:0.74rem;color:#8ab4ff;text-transform:uppercase;letter-spacing:1px;font-weight:bold;margin-bottom:8px;">Post-Election Consequences</div>
                    <div style="display:flex;flex-wrap:wrap;gap:16px;font-size:0.82rem;color:#c0d4ff;">
                        ${approvalDelta !== null ? `<div><span style="color:#7f9ad3;">Approval:</span> ${formatSignedStat(approvalDelta, ' pts')}</div>` : ''}
                        ${polarizationDelta !== null ? `<div><span style="color:#7f9ad3;">Polarization:</span> ${formatSignedStat(polarizationDelta, ' pts')}</div>` : ''}
                    </div>
                </div>`;
        }
    }

    // Turnout info
    const turnout = election.results.turnout_pct || 0;
    const totalVotes = election.results.total_votes_cast || 0;
    const totalAbstentions = election.results.total_abstentions || 0;
    html += `
        <div style="margin-top:12px;font-size:0.78rem;color:#666;">
            Turnout: ${turnout}% &middot; ${totalVotes.toLocaleString()} votes cast &middot; ${totalAbstentions.toLocaleString()} abstentions
        </div>`;

    document.getElementById('presidential-results-list').innerHTML = html;
}




// Formation code has been moved to government.html

// ===================================================================
// SHARED FUNCTIONS (election info)
// ===================================================================

async function loadElectionInfo() {
    if (!currentNation) return;
    const { data: shard } = await _supabase.from('shard').select('current_tick, current_date').eq('name', 'Alpha Shard').single();
    if (!shard) return;

    const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const currentMonth = shard.current_date.split(', ')[0];
    const currentYear = parseInt(shard.current_date.split(', ')[1]);
    const currentMonthIndex = months.indexOf(currentMonth);

    function tickToDateStr(ticksAhead) {
        let mi = currentMonthIndex + ticksAhead;
        let y = currentYear;
        while (mi >= 12) { mi -= 12; y += 1; }
        return months[mi] + ', ' + y;
    }

    if (isPresidential) {
        // Check for overdue scheduled elections before fetching future ones
        const { data: overduePresElection } = await _supabase
            .from('elections').select('*').eq('nation_id', currentNation.id).eq('status', 'scheduled')
            .lte('election_tick', shard.current_tick)
            .order('election_tick', { ascending: true }).limit(1).maybeSingle();

        if (overduePresElection) {
            const parlDateEl = document.getElementById('next-parliamentary-tick');
            const parlTicksEl = document.getElementById('ticks-until-parliamentary');
            const presDateEl = document.getElementById('next-presidential-tick');
            const presTicksEl = document.getElementById('ticks-until-presidential');
            const elType = overduePresElection.election_type || 'parliamentary';
            if (elType === 'presidential') {
                if (presDateEl) presDateEl.textContent = 'Overdue — pending';
                if (presTicksEl) presTicksEl.textContent = 'Will process next tick';
            } else {
                if (parlDateEl) parlDateEl.textContent = 'Overdue — pending';
                if (parlTicksEl) parlTicksEl.textContent = 'Will process next tick';
            }
            // Still fetch the other election type normally below
        }

        // Presidential systems have dual elections — fetch both types
        let { data: parlElection, error: parlErr } = await _supabase
            .from('elections').select('*').eq('nation_id', currentNation.id).eq('status', 'scheduled')
            .eq('election_type', 'parliamentary')
            .gt('election_tick', shard.current_tick)
            .order('election_tick', { ascending: true }).limit(1).maybeSingle();
        if (parlErr) console.error('loadElectionInfo: parliamentary query error:', parlErr);

        let { data: presElection, error: presErr } = await _supabase
            .from('elections').select('*').eq('nation_id', currentNation.id).eq('status', 'scheduled')
            .eq('election_type', 'presidential')
            .gt('election_tick', shard.current_tick)
            .order('election_tick', { ascending: true }).limit(1).maybeSingle();
        if (presErr) console.error('loadElectionInfo: presidential query error:', presErr);

        // Auto-schedule fallback for parliamentary if none found
        if (!parlElection && !parlErr) {
            const { data: lastParl } = await _supabase
                .from('elections').select('election_tick').eq('nation_id', currentNation.id)
                .eq('status', 'completed').eq('election_type', 'parliamentary')
                .order('election_tick', { ascending: false }).limit(1).maybeSingle();
            const parlBase = lastParl ? lastParl.election_tick : shard.current_tick;
            const effectiveParlTermTicks = currentNation?.parliamentary_term_ticks || GAME_CONFIG?.PARLIAMENTARY_TERM_TICKS || 24;
            let nextParl = parlBase + effectiveParlTermTicks;
            if (nextParl <= shard.current_tick) nextParl = shard.current_tick + effectiveParlTermTicks;
            const { data: newParl, error: insErr } = await _supabase.from('elections')
                .insert({ nation_id: currentNation.id, election_tick: nextParl, election_type: 'parliamentary', status: 'scheduled' })
                .select().single();
            if (!insErr && newParl) { parlElection = newParl; console.log('Auto-scheduled presidential parliamentary election at tick', nextParl); }
            else console.warn('Failed to auto-schedule presidential parliamentary:', insErr);
        }

        // Auto-schedule fallback for presidential if none found
        if (!presElection && !presErr) {
            const { data: lastPres } = await _supabase
                .from('elections').select('election_tick').eq('nation_id', currentNation.id)
                .eq('status', 'completed').eq('election_type', 'presidential')
                .order('election_tick', { ascending: false }).limit(1).maybeSingle();
            const presBase = lastPres ? lastPres.election_tick : shard.current_tick;
            const effectivePresTermTicks = currentNation?.presidential_term_ticks || GAME_CONFIG?.PRESIDENTIAL_TERM_TICKS || 48;
            let nextPres = presBase + effectivePresTermTicks;
            if (nextPres <= shard.current_tick) nextPres = shard.current_tick + effectivePresTermTicks;
            const { data: newPres, error: insErr } = await _supabase.from('elections')
                .insert({ nation_id: currentNation.id, election_tick: nextPres, election_type: 'presidential', status: 'scheduled' })
                .select().single();
            if (!insErr && newPres) { presElection = newPres; console.log('Auto-scheduled presidential election at tick', nextPres); }
            else console.warn('Failed to auto-schedule presidential:', insErr);
        }

        const parlDateEl = document.getElementById('next-parliamentary-tick');
        const parlTicksEl = document.getElementById('ticks-until-parliamentary');
        const presDateEl = document.getElementById('next-presidential-tick');
        const presTicksEl = document.getElementById('ticks-until-presidential');

        if (parlElection) {
            const ticksAhead = parlElection.election_tick - shard.current_tick;
            if (parlDateEl) parlDateEl.textContent = tickToDateStr(ticksAhead);
            if (parlTicksEl) parlTicksEl.textContent = ticksAhead + (ticksAhead === 1 ? ' tick' : ' ticks');
        } else {
            if (parlDateEl) parlDateEl.textContent = 'Not scheduled';
            if (parlTicksEl) parlTicksEl.textContent = '—';
        }

        if (presElection) {
            const ticksAhead = presElection.election_tick - shard.current_tick;
            if (presDateEl) presDateEl.textContent = tickToDateStr(ticksAhead);
            if (presTicksEl) presTicksEl.textContent = ticksAhead + (ticksAhead === 1 ? ' tick' : ' ticks');
        } else {
            if (presDateEl) presDateEl.textContent = 'Not scheduled';
            if (presTicksEl) presTicksEl.textContent = '—';
        }
        return;
    }

    const DEFAULT_ELECTION_INTERVAL = 48; // ticks between elections (baseline, can be changed by law)

    // Check for overdue scheduled elections (election_tick in the past but still 'scheduled')
    const { data: overdueElection } = await _supabase
        .from('elections').select('*').eq('nation_id', currentNation.id).eq('status', 'scheduled')
        .lte('election_tick', shard.current_tick)
        .order('election_tick', { ascending: true }).limit(1).maybeSingle();

    if (overdueElection) {
        // Show overdue notice — don't auto-schedule a duplicate
        const nextEl = document.getElementById('next-election-tick');
        const ticksEl = document.getElementById('ticks-until-election');
        if (nextEl) nextEl.textContent = 'Overdue — pending';
        if (ticksEl) ticksEl.textContent = 'Will process next tick';
        return;
    }

    // Only fetch elections scheduled in the future (tick > current tick)
    let { data: election } = await _supabase
        .from('elections').select('*').eq('nation_id', currentNation.id).eq('status', 'scheduled')
        .gt('election_tick', shard.current_tick)
        .order('election_tick', { ascending: true }).limit(1).maybeSingle();

    // Auto-schedule if no future election exists
    if (!election) {
        // Find the most recent completed election to base the interval on
        const { data: lastElection } = await _supabase
            .from('elections').select('election_tick').eq('nation_id', currentNation.id).eq('status', 'completed')
            .order('election_tick', { ascending: false }).limit(1).maybeSingle();

        const baseTick = lastElection ? lastElection.election_tick : shard.current_tick;
        let nextTick = baseTick + DEFAULT_ELECTION_INTERVAL;

        // Ensure it's actually in the future
        if (nextTick <= shard.current_tick) {
            nextTick = shard.current_tick + DEFAULT_ELECTION_INTERVAL;
        }

        const { data: newElection, error } = await _supabase
            .from('elections')
            .insert({
                nation_id: currentNation.id,
                election_tick: nextTick,
                status: 'scheduled'
            })
            .select()
            .single();

        if (!error && newElection) {
            election = newElection;
            console.log('Auto-scheduled next election at tick', nextTick);
        } else {
            console.warn('Failed to auto-schedule election:', error);
        }
    }

    const nextEl = document.getElementById('next-election-tick');
    const ticksEl = document.getElementById('ticks-until-election');

    if (election) {
        const ticksAhead = election.election_tick - shard.current_tick;
        if (nextEl) nextEl.textContent = tickToDateStr(ticksAhead);
        if (ticksEl) ticksEl.textContent = ticksAhead + (ticksAhead === 1 ? ' tick' : ' ticks');
    } else {
        if (nextEl) nextEl.textContent = 'Not scheduled';
        if (ticksEl) ticksEl.textContent = '—';
    }
}

window.voteShakeup = voteShakeup;
window.resolveActiveShakeup = resolveActiveShakeup;
