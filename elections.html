<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Elections | Nationhood Alpha</title>
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Shared Styles -->
    <link rel="stylesheet" href="css/dashboard.css">
    
    <!-- Page-specific styles -->
    <style>
        .ministry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .ministry-card {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 16px;
            border-left: 4px solid #ffcc00;
        }
        .ministry-card.locked {
            border-left-color: #4CAF50;
            background: #1a2a1a;
        }
        .ministry-card.inactive {
            border-left-color: #666;
            opacity: 0.5;
        }
        .ministry-name {
            font-size: 0.9rem;
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 6px;
        }
        .ministry-card.locked .ministry-name {
            color: #4CAF50;
        }
        .ministry-desc {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .ministry-select {
            width: 100%;
            padding: 10px;
            background: #252525;
            border: 1px solid #444;
            color: #e0e0e0;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        .ministry-select:focus {
            outline: none;
            border-color: #ffcc00;
        }
        .ministry-select:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .allocation-summary {
            background: #252525;
            border-radius: 8px;
            padding: 16px;
            margin-top: 20px;
        }
        .allocation-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #333;
        }
        .allocation-row:last-child {
            border-bottom: none;
        }
        .allocation-party {
            font-weight: bold;
            color: #ffcc00;
        }
        .allocation-count {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .allocation-bar {
            width: 100px;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
        }
        .allocation-fill {
            height: 100%;
            background: #4CAF50;
            transition: width 0.3s;
        }
        .allocation-fill.over {
            background: #ff4444;
        }
        .allocation-fill.under {
            background: #ff9800;
        }
        .allocation-text {
            font-size: 0.8rem;
            color: #aaa;
            min-width: 80px;
            text-align: right;
        }
        .npc-preference {
            font-size: 0.7rem;
            color: #888;
            margin-top: 6px;
            font-style: italic;
        }
        .npc-preference.happy {
            color: #4CAF50;
        }
        .npc-preference.unhappy {
            color: #ff9800;
        }
        .step-indicator {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
        }
        .step {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #666;
        }
        .step.active {
            color: #ffcc00;
        }
        .step.completed {
            color: #4CAF50;
        }
        .step-number {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .step.active .step-number {
            background: #ffcc00;
            color: #000;
        }
        .step.completed .step-number {
            background: #4CAF50;
            color: #fff;
        }
        .nav-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 24px;
        }
        .nav-buttons .action-btn {
            min-width: 150px;
        }
    </style>
</head>
<body>

<!-- ===== TOP BAR (rendered by common.js) ===== -->
<div id="top-bar"></div>

<!-- ===== CONTENT AREA ===== -->
<div id="content-area">
    <!-- Loading state shown initially -->
    <div class="loading-container">
        <div class="loading-spinner"></div>
        <div>Loading election data...</div>
    </div>
</div>

<!-- Shared Scripts -->
<script src="js/supabase-client.js"></script>
<script src="js/common.js"></script>

<!-- Page-Specific Script -->

// Initialize page
initPage('elections', async (state) => {

/**
 * Populate party resource stats
 */
async function populatePartyStats() {
    if (!currentFaction) return;
    
    document.getElementById('party-ap').textContent = currentFaction.action_points || 0;
    document.getElementById('party-funds').textContent = '$' + (currentFaction.party_funds || 0).toLocaleString();
    document.getElementById('party-approval').textContent = (currentFaction.approval_rating || 0) + '%';
}

/**
 * Populate attack target and lobby dropdowns
 */
async function populateDropdowns() {
    if (!currentFaction || !currentNation) return;
    
    // Get other parties for attack target
    const { data: parties } = await _supabase
        .from('factions')
        .select('id, faction_name')
        .eq('nation_id', currentNation.id)
        .eq('faction_type', 'party')
        .neq('id', currentFaction.id);
    
    const attackSelect = document.getElementById('attack-target');
    if (attackSelect && parties) {
        attackSelect.innerHTML = '<option value="">Select Target Party...</option>';
        parties.forEach(p => {
            attackSelect.innerHTML += `<option value="${p.id}">${p.faction_name}</option>`;
        });
    }
    
    // Get interest groups for lobbying
    const { data: groups } = await _supabase
        .from('interest_groups')
        .select('id, group_name')
        .eq('nation_id', currentNation.id);
    
    const lobbySelect = document.getElementById('lobby-target');
    if (lobbySelect) {
        lobbySelect.innerHTML = '<option value="">Select Interest Group...</option>';
        if (groups) {
            groups.forEach(g => {
                lobbySelect.innerHTML += `<option value="${g.id}">${g.group_name}</option>`;
            });
        }
    }
}

/**
 * Load recent action log
 */
async function loadActionLog() {
    if (!currentFaction) return;
    
    const { data: actions } = await _supabase
        .from('campaign_actions')
        .select('*')
        .eq('party_id', currentFaction.id)
        .order('created_at', { ascending: false })
        .limit(5);
    
    const logDiv = document.getElementById('action-log');
    if (!logDiv) return;
    
    if (!actions || actions.length === 0) {
        logDiv.innerHTML = '<div class="action-log-empty">No actions taken yet this campaign.</div>';
        return;
    }
    
    logDiv.innerHTML = actions.map(a => {
        const date = new Date(a.created_at).toLocaleString();
        let message = '';
        
        if (a.action_type === 'rally') {
            message = `Grassroots Rally: Gained ${a.result?.approval_gain || 0}% approval`;
        } else if (a.action_type === 'attack_ad') {
            message = `Attack Ad vs ${a.result?.target || 'Unknown'}: -${a.result?.approval_loss || 0}% to their approval`;
        } else if (a.action_type === 'fundraiser') {
            message = `Fundraiser: Raised $${(a.result?.money_raised || 0).toLocaleString()}`;
        } else if (a.action_type === 'lobby') {
            message = `Lobbied ${a.result?.group_name || 'Unknown'}: Received $${(a.result?.payout || 0).toLocaleString()}`;
        }
        
        return `<div class="action-log-item">
            <div class="action-log-time">Tick ${a.tick_performed} • ${date}</div>
            <div class="action-log-message">${message}</div>
        </div>`;
    }).join('');
}

/**
 * Load upcoming election info
 */
async function loadElectionInfo() {
    if (!currentNation) return;
    
    const { data: shard } = await _supabase
        .from('shard')
        .select('current_tick')
        .eq('name', 'Alpha Shard')
        .single();
    
    const { data: election } = await _supabase
        .from('elections')
        .select('*')
        .eq('nation_id', currentNation.id)
        .eq('status', 'scheduled')
        .order('election_tick', { ascending: true })
        .limit(1)
        .maybeSingle();
    
    if (election && shard) {
        const nextElectionEl = document.getElementById('next-election-tick');
        const ticksUntilEl = document.getElementById('ticks-until-election');
        
        if (nextElectionEl) nextElectionEl.textContent = 'Tick ' + election.election_tick;
        if (ticksUntilEl) ticksUntilEl.textContent = (election.election_tick - shard.current_tick) + ' ticks';
    }
}

/**
 * Load election results
 */
async function loadElectionResults() {
    if (!currentNation) return;
    
    try {
        const { data: election, error } = await _supabase
            .from('elections')
            .select('*')
            .eq('nation_id', currentNation.id)
            .eq('status', 'completed')
            .order('election_tick', { ascending: false })
            .limit(1)
            .maybeSingle();
        
        if (error) {
            console.error('Error loading election:', error);
            return;
        }
        
        if (!election || !election.results) {
            document.getElementById('election-results-section').style.display = 'none';
            return;
        }
        
        document.getElementById('election-results-section').style.display = 'block';
        
        // Get date from shard based on election tick
        const { data: shard } = await _supabase
            .from('shard')
            .select('current_date, current_tick')
            .eq('name', 'Alpha Shard')
            .single();
        
        if (shard) {
            const months = ['January', 'February', 'March', 'April', 'May', 'June', 
                           'July', 'August', 'September', 'October', 'November', 'December'];
            
            const currentMonth = shard.current_date.split(', ')[0];
            const currentYear = parseInt(shard.current_date.split(', ')[1]);
            const currentMonthIndex = months.indexOf(currentMonth);
            
            const tickDiff = shard.current_tick - election.election_tick;
            
            let electionMonthIndex = currentMonthIndex - tickDiff;
            let electionYear = currentYear;
            
            while (electionMonthIndex < 0) {
                electionMonthIndex += 12;
                electionYear -= 1;
            }
            
            const electionMonth = months[electionMonthIndex % 12];
            document.getElementById('election-year').textContent = `${electionMonth}, ${electionYear}`;
        }
        
        const results = election.results.votes || [];
        const resultsHTML = results.map(r => {
            const votes = r.votes || 0;
            const percentage = r.vote_percentage || 0;
            const seats = r.seats || 0;
            
            return `<div style="display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid #222; align-items: center;">
                <span style="font-size: 0.9rem; color: #ffcc00; font-weight: bold;">${r.party_name}</span>
                <span style="font-size: 0.85rem; color: #aaa; text-align: right;">${votes.toLocaleString()} Votes</span>
                <span style="font-size: 0.85rem; color: #aaa; text-align: right;">${percentage}%</span>
                <span style="font-size: 0.85rem; font-weight: bold; color: #4CAF50; text-align: right;">${seats} Seats</span>
            </div>`;
        }).join('');
        
        document.getElementById('election-results-list').innerHTML = resultsHTML;
        
    } catch (error) {
        console.error('Error in loadElectionResults:', error);
    }
}

/**
 * Perform a campaign action
 */
async function performAction(actionType) {
    if (!currentFaction) return;
    
    let result;
    
    try {
        if (actionType === 'rally') {
            const { data, error } = await _supabase.rpc('action_grassroots_rally', { 
                player_party_id: currentFaction.id 
            });
            if (error) throw error;
            result = data[0];
        } 
        else if (actionType === 'attack') {
            const targetId = document.getElementById('attack-target').value;
            if (!targetId) { alert('Please select a target party!'); return; }
            const { data, error } = await _supabase.rpc('action_attack_ad', { 
                player_party_id: currentFaction.id,
                target_party_id: targetId
            });
            if (error) throw error;
            result = data[0];
        }
        else if (actionType === 'fundraiser') {
            const { data, error } = await _supabase.rpc('action_fundraiser', { 
                player_party_id: currentFaction.id 
            });
            if (error) throw error;
            result = data[0];
        }
        else if (actionType === 'lobby') {
            const groupId = document.getElementById('lobby-target').value;
            if (!groupId) { alert('Please select an interest group!'); return; }
            const { data, error } = await _supabase.rpc('action_lobby_interest_group', { 
                player_party_id: currentFaction.id,
                interest_group_id: groupId
            });
            if (error) throw error;
            result = data[0];
        }
        
        if (result && result.success) {
            alert('✅ ' + result.message);
            
            currentFaction.action_points = result.new_ap;
            currentFaction.party_funds = result.new_funds;
            if (result.new_approval) currentFaction.approval_rating = result.new_approval;
            
            await populatePartyStats();
            await loadActionLog();
            
            sessionStorage.removeItem('nationhood_state');
        } else {
            alert('❌ ' + (result ? result.message : 'Action failed'));
        }
        
    } catch (error) {
        console.error('Action error:', error);
        alert('❌ Error: ' + error.message);
    }
}

// ===== COALITION FUNCTIONS =====

/**
 * Check if coalition formation is needed
 */
async function checkCoalitionStatus() {
    if (!currentNation) return;
    
    const { data: election } = await _supabase
        .from('elections')
        .select('*')
        .eq('nation_id', currentNation.id)
        .eq('status', 'completed')
        .order('election_tick', { ascending: false })
        .limit(1)
        .maybeSingle();
    
    if (!election) return;
    
    currentElectionId = election.id;
    
    const { data: coalitionCheck } = await _supabase
        .rpc('check_coalition_needed', {
            p_nation_id: currentNation.id,
            p_election_id: election.id
        });
    
    if (!coalitionCheck || coalitionCheck.length === 0) return;
    
    const check = coalitionCheck[0];
    
    if (check.needs_coalition) {
        coalitionParties = election.results.votes || election.results.seats || [];
        
        const { data: activeCoalition } = await _supabase
            .from('active_coalitions')
            .select('*')
            .eq('election_id', election.id)
            .limit(1)
            .maybeSingle();
        
        if (activeCoalition) return;
        
        const { data: existingProposals } = await _supabase
            .from('coalition_proposals')
            .select('*')
            .eq('election_id', election.id)
            .eq('status', 'pending');
        
        if (existingProposals && existingProposals.length > 0) {
            showCoalitionProposals(existingProposals);
        } else {
            generateNPCPreferences();
            showCoalitionFormation();
        }
    }
}

/**
 * Generate random ministry preferences for NPC parties
 */
function generateNPCPreferences() {
    npcPreferences = {};
    
    const availableMinistries = MINISTRIES.filter(m => !m.locked && !m.inactive).map(m => m.key);
    
    coalitionParties.forEach(party => {
        if (party.party_id !== currentFaction.id) {
            const shuffled = [...availableMinistries].sort(() => Math.random() - 0.5);
            npcPreferences[party.party_id] = {
                preferred: shuffled.slice(0, 2 + Math.floor(Math.random() * 2)),
                partyName: party.party_name
            };
        }
    });
}

/**
 * Show coalition formation UI
 */
function showCoalitionFormation() {
    document.getElementById('coalition-formation-section').style.display = 'block';
    document.getElementById('coalition-proposals-section').style.display = 'none';
    
    coalitionStep = 1;
    goToStep(1);
}

/**
 * Navigate between coalition steps
 */
function goToStep(step) {
    coalitionStep = step;
    
    document.querySelectorAll('.step').forEach(s => {
        const stepNum = parseInt(s.dataset.step);
        s.classList.remove('active', 'completed');
        if (stepNum < step) s.classList.add('completed');
        if (stepNum === step) s.classList.add('active');
    });
    
    document.getElementById('coalition-step-1').style.display = step === 1 ? 'block' : 'none';
    document.getElementById('coalition-step-2').style.display = step === 2 ? 'block' : 'none';
    
    if (step === 1) {
        showCoalitionSelection();
    } else if (step === 2) {
        showMinistryAllocation();
    }
}

/**
 * Show coalition selection UI (Step 1)
 */
function showCoalitionSelection() {
    totalSeatsInNation = coalitionParties.reduce((sum, p) => sum + (p.seats || 0), 0);
    majorityThreshold = Math.floor(totalSeatsInNation / 2) + 1;
    
    document.getElementById('coalition-required-seats').textContent = `${majorityThreshold} / ${totalSeatsInNation}`;
    
    if (selectedCoalitionParties.length === 0) {
        selectedCoalitionParties = [currentFaction.id];
    }
    
    const grid = document.getElementById('coalition-party-grid');
    grid.innerHTML = coalitionParties.map(party => {
        const isPlayerParty = party.party_id === currentFaction.id;
        const isSelected = selectedCoalitionParties.includes(party.party_id);
        
        return `
            <div class="coalition-party-card ${isSelected ? 'selected' : ''} ${isPlayerParty ? 'locked' : ''}" 
                 onclick="${isPlayerParty ? '' : `toggleCoalitionParty('${party.party_id}')`}"
                 data-party-id="${party.party_id}">
                <div class="coalition-party-header">
                    <div class="coalition-party-name">${party.party_name}</div>
                    <div class="coalition-party-seats">${party.seats} seats</div>
                </div>
                <div style="font-size: 0.8rem; color: #888;">
                    ${party.vote_percentage}% of vote
                </div>
                <div class="coalition-party-values" id="party-values-${party.party_id}">
                </div>
            </div>
        `;
    }).join('');
    
    coalitionParties.forEach(party => loadPartyValues(party.party_id));
    
    updateCoalitionSeats();
}

/**
 * Load party ideology values
 */
async function loadPartyValues(partyId) {
    const { data: party } = await _supabase
        .from('factions')
        .select('ideology_value_1, ideology_value_2')
        .eq('id', partyId)
        .single();
    
    if (party) {
        const container = document.getElementById(`party-values-${partyId}`);
        if (container) {
            const values = [party.ideology_value_1, party.ideology_value_2].filter(Boolean);
            container.innerHTML = values.map(v => 
                `<span class="ideology-tag tag-${v.toLowerCase()}">${v}</span>`
            ).join('');
        }
    }
}

/**
 * Toggle party selection for coalition
 */
function toggleCoalitionParty(partyId) {
    const index = selectedCoalitionParties.indexOf(partyId);
    if (index > -1) {
        selectedCoalitionParties.splice(index, 1);
    } else {
        selectedCoalitionParties.push(partyId);
    }
    
    const card = document.querySelector(`.coalition-party-card[data-party-id="${partyId}"]`);
    if (card) {
        card.classList.toggle('selected');
    }
    
    updateCoalitionSeats();
}

/**
 * Update coalition seat count display
 */
function updateCoalitionSeats() {
    const totalSeats = selectedCoalitionParties.reduce((sum, partyId) => {
        const party = coalitionParties.find(p => p.party_id === partyId);
        return sum + (party ? party.seats : 0);
    }, 0);
    
    const seatsEl = document.getElementById('coalition-current-seats');
    if (seatsEl) {
        seatsEl.textContent = totalSeats;
        seatsEl.style.color = totalSeats >= majorityThreshold ? '#4CAF50' : '#ff4444';
    }
    
    const nextBtn = document.getElementById('step1-next-btn');
    if (nextBtn) {
        nextBtn.disabled = totalSeats < majorityThreshold;
    }
    
    if (selectedCoalitionParties.length > 1) {
        checkValueConflicts();
    } else {
        const conflictsEl = document.getElementById('coalition-conflicts');
        if (conflictsEl) conflictsEl.style.display = 'none';
    }
}

/**
 * Check for ideological conflicts in coalition
 */
async function checkValueConflicts() {
    const { data: conflicts } = await _supabase
        .rpc('calculate_value_conflicts', {
            p_party_ids: selectedCoalitionParties
        });
    
    if (conflicts && conflicts.length > 0) {
        const conflict = conflicts[0];
        
        if (conflict.stability_penalty > 0) {
            document.getElementById('coalition-conflicts').style.display = 'block';
            document.getElementById('coalition-stability-penalty').textContent = `-${conflict.stability_penalty}`;
            
            const conflictsList = JSON.parse(conflict.conflicts);
            document.getElementById('coalition-conflicts-list').innerHTML = conflictsList
                .map(c => `• ${c.conflict}`)
                .join('<br>');
        } else {
            document.getElementById('coalition-conflicts').style.display = 'none';
        }
    }
}

/**
 * Show ministry allocation UI (Step 2)
 */
function showMinistryAllocation() {
    calculateMinistryLimits();
    
    const largestParty = coalitionParties
        .filter(p => selectedCoalitionParties.includes(p.party_id))
        .sort((a, b) => b.seats - a.seats)[0];
    
    ministryAllocations = {
        prime_minister: largestParty.party_id
    };
    
    renderAllocationSummary();
    renderMinistryGrid();
    validateAllocation();
}

/**
 * Calculate ministry limits for each party
 */
function calculateMinistryLimits() {
    const totalSeats = selectedCoalitionParties.reduce((sum, partyId) => {
        const party = coalitionParties.find(p => p.party_id === partyId);
        return sum + (party ? party.seats : 0);
    }, 0);
    
    const activeMinistries = MINISTRIES.filter(m => !m.inactive).length;
    
    partyMinistryLimits = {};
    selectedCoalitionParties.forEach(partyId => {
        const party = coalitionParties.find(p => p.party_id === partyId);
        if (party) {
            const seatPercentage = party.seats / totalSeats;
            partyMinistryLimits[partyId] = {
                name: party.party_name,
                seats: party.seats,
                percentage: seatPercentage,
                min: 1,
                max: Math.max(1, Math.floor(seatPercentage * activeMinistries))
            };
        }
    });
}

/**
 * Render allocation summary
 */
function renderAllocationSummary() {
    const summaryEl = document.getElementById('allocation-summary');
    
    const rows = selectedCoalitionParties.map(partyId => {
        const limits = partyMinistryLimits[partyId];
        const currentCount = Object.values(ministryAllocations).filter(p => p === partyId).length;
        
        let fillClass = '';
        if (currentCount > limits.max) fillClass = 'over';
        else if (currentCount < limits.min) fillClass = 'under';
        
        const fillWidth = Math.min(100, (currentCount / limits.max) * 100);
        
        return `
            <div class="allocation-row">
                <span class="allocation-party">${limits.name}</span>
                <div class="allocation-count">
                    <div class="allocation-bar">
                        <div class="allocation-fill ${fillClass}" style="width: ${fillWidth}%"></div>
                    </div>
                    <span class="allocation-text">${currentCount} / ${limits.max} max</span>
                </div>
            </div>
        `;
    }).join('');
    
    summaryEl.innerHTML = `
        <div style="font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px;">
            Ministry Allocation
        </div>
        ${rows}
    `;
}

/**
 * Render ministry grid
 */
function renderMinistryGrid() {
    const gridEl = document.getElementById('ministry-grid');
    
    const cards = MINISTRIES.map(ministry => {
        const isLocked = ministry.locked;
        const isInactive = ministry.inactive;
        
        const partyOptions = selectedCoalitionParties.map(partyId => {
            const party = coalitionParties.find(p => p.party_id === partyId);
            const selected = ministryAllocations[ministry.key] === partyId ? 'selected' : '';
            return `<option value="${partyId}" ${selected}>${party?.party_name || 'Unknown'}</option>`;
        }).join('');
        
        let preferenceHint = '';
        if (!isLocked && !isInactive) {
            for (const [npcId, prefs] of Object.entries(npcPreferences)) {
                if (selectedCoalitionParties.includes(npcId) && prefs.preferred.includes(ministry.key)) {
                    const isAssigned = ministryAllocations[ministry.key] === npcId;
                    preferenceHint = `
                        <div class="npc-preference ${isAssigned ? 'happy' : 'unhappy'}">
                            ${prefs.partyName} ${isAssigned ? '✓ wants this ministry' : 'would prefer this ministry'}
                        </div>
                    `;
                    break;
                }
            }
        }
        
        return `
            <div class="ministry-card ${isLocked ? 'locked' : ''} ${isInactive ? 'inactive' : ''}">
                <div class="ministry-name">${ministry.name}</div>
                <div class="ministry-desc">${ministry.description}</div>
                ${isInactive ? `
                    <div style="font-size: 0.75rem; color: #666; font-style: italic;">
                        Requires enabling legislation
                    </div>
                ` : `
                    <select class="ministry-select" 
                            onchange="updateMinistryAllocation('${ministry.key}', this.value)"
                            ${isLocked ? 'disabled' : ''}>
                        ${isLocked ? '' : '<option value="">Select Party...</option>'}
                        ${partyOptions}
                    </select>
                    ${preferenceHint}
                `}
            </div>
        `;
    }).join('');
    
    gridEl.innerHTML = cards;
}

/**
 * Update ministry allocation
 */
function updateMinistryAllocation(ministryKey, partyId) {
    if (partyId) {
        ministryAllocations[ministryKey] = partyId;
    } else {
        delete ministryAllocations[ministryKey];
    }
    
    renderAllocationSummary();
    renderMinistryGrid();
    validateAllocation();
}

/**
 * Validate ministry allocation
 */
function validateAllocation() {
    const activeMinistries = MINISTRIES.filter(m => !m.inactive);
    const allAssigned = activeMinistries.every(m => ministryAllocations[m.key]);
    
    let withinLimits = true;
    for (const partyId of selectedCoalitionParties) {
        const limits = partyMinistryLimits[partyId];
        const count = Object.values(ministryAllocations).filter(p => p === partyId).length;
        if (count < limits.min || count > limits.max) {
            withinLimits = false;
            break;
        }
    }
    
    const proposeBtn = document.getElementById('step2-next-btn');
    if (proposeBtn) {
        proposeBtn.disabled = !allAssigned || !withinLimits;
    }
}

/**
 * Propose a coalition with ministry allocations
 */
async function proposeCoalition() {
    if (selectedCoalitionParties.length === 0 || !currentElectionId) {
        alert('❌ Error: No parties selected');
        return;
    }
    
    try {
        const { data, error } = await _supabase.rpc('propose_coalition', {
            p_proposer_party_id: currentFaction.id,
            p_nation_id: currentNation.id,
            p_election_id: currentElectionId,
            p_party_ids: selectedCoalitionParties
        });
        
        if (error) throw error;
        
        const result = data[0];
        if (result.success) {
            await _supabase
                .from('coalition_proposals')
                .update({ ministry_allocations: ministryAllocations })
                .eq('id', result.coalition_id);
            
            alert(`✅ ${result.message}\n\nTotal Seats: ${result.total_seats}\nStability Penalty: -${result.stability_penalty}`);
            
            await checkCoalitionStatus();
        } else {
            alert(`❌ ${result.message}`);
        }
    } catch (error) {
        console.error('Coalition proposal error:', error);
        alert('❌ Error proposing coalition: ' + error.message);
    }
}

/**
 * Show coalition proposals UI
 */
async function showCoalitionProposals(proposals) {
    document.getElementById('coalition-formation-section').style.display = 'none';
    document.getElementById('coalition-proposals-section').style.display = 'block';
    
    const container = document.getElementById('coalition-proposals-list');
    
    const proposalsWithVotes = await Promise.all(proposals.map(async (proposal) => {
        const { data: votes } = await _supabase
            .from('coalition_votes')
            .select('*')
            .eq('coalition_proposal_id', proposal.id);
        
        const acceptVotes = votes?.filter(v => v.vote === 'accept').length || 0;
        const rejectVotes = votes?.filter(v => v.vote === 'reject').length || 0;
        const userVote = votes?.find(v => v.party_id === currentFaction.id);
        
        return { ...proposal, acceptVotes, rejectVotes, userVote };
    }));
    
    container.innerHTML = proposalsWithVotes.map(proposal => {
        const conflicts = JSON.parse(proposal.value_conflicts || '[]');
        const ministries = proposal.ministry_allocations || {};
        
        const ministrySummary = Object.entries(ministries).map(([key, partyId]) => {
            const ministry = MINISTRIES.find(m => m.key === key);
            const party = coalitionParties.find(p => p.party_id === partyId);
            return `<div style="font-size: 0.75rem; color: #aaa; padding: 4px 0; border-bottom: 1px solid #333;">
                <span style="color: #888;">${ministry?.name || key}:</span> 
                <span style="color: #ffcc00;">${party?.party_name || 'Unknown'}</span>
            </div>`;
        }).join('');
        
        return `
            <div class="coalition-proposal-card" style="background: #1e1e1e; border-radius: 8px; padding: 20px; margin-bottom: 16px; border-left: 4px solid #ffcc00;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">
                    <div>
                        <div style="font-size: 1.1rem; color: #ffcc00; font-weight: bold;">
                            Coalition Proposal
                        </div>
                        <div style="font-size: 0.8rem; color: #888; margin-top: 4px;">
                            Proposed by ${getPartyName(proposal.proposer_party_id)}
                        </div>
                    </div>
                    <div style="text-align: right;">
                        <div style="font-size: 1.3rem; color: #4CAF50; font-weight: bold;">
                            ${proposal.total_seats} seats
                        </div>
                        <div style="font-size: 0.8rem; color: #888;">
                            ${proposal.seat_percentage}%
                        </div>
                    </div>
                </div>
                
                <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;">
                    ${proposal.party_ids.map(id => `
                        <div style="background: #333; padding: 6px 12px; border-radius: 4px; font-size: 0.8rem; color: #e0e0e0;">
                            ${getPartyName(id)}
                        </div>
                    `).join('')}
                </div>
                
                ${Object.keys(ministries).length > 0 ? `
                    <div style="background: #252525; border-radius: 6px; padding: 12px; margin-bottom: 16px;">
                        <div style="font-size: 0.7rem; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;">
                            Ministry Allocation
                        </div>
                        ${ministrySummary}
                    </div>
                ` : ''}
                
                ${proposal.stability_penalty > 0 ? `
                    <div style="padding: 12px; background: #2a1a1a; border-left: 3px solid #ff4444; border-radius: 4px; margin-bottom: 16px;">
                        <div style="font-size: 0.85rem; color: #ff4444; font-weight: bold;">
                            ⚠ Stability Penalty: -${proposal.stability_penalty}
                        </div>
                        <div style="font-size: 0.8rem; color: #aaa; margin-top: 4px;">
                            ${conflicts.map(c => c.conflict).join(', ')}
                        </div>
                    </div>
                ` : ''}
                
                <div style="display: flex; gap: 12px; margin-bottom: 12px;">
                    <button style="flex: 1; padding: 12px; background: ${proposal.userVote?.vote === 'accept' ? '#2a4a2a' : '#4CAF50'}; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: ${proposal.userVote ? 'not-allowed' : 'pointer'};"
                            onclick="voteOnCoalition('${proposal.id}', 'accept')"
                            ${proposal.userVote ? 'disabled' : ''}>
                        ${proposal.userVote?.vote === 'accept' ? '✓ Accepted' : 'Accept'}
                    </button>
                    <button style="flex: 1; padding: 12px; background: ${proposal.userVote?.vote === 'reject' ? '#4a2a2a' : '#ff4444'}; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: ${proposal.userVote ? 'not-allowed' : 'pointer'};"
                            onclick="voteOnCoalition('${proposal.id}', 'reject')"
                            ${proposal.userVote ? 'disabled' : ''}>
                        ${proposal.userVote?.vote === 'reject' ? '✓ Rejected' : 'Reject'}
                    </button>
                </div>
                
                <div style="display: flex; justify-content: center; gap: 20px; font-size: 0.85rem;">
                    <span style="color: #4CAF50;">✓ ${proposal.acceptVotes} Accept</span>
                    <span style="color: #ff4444;">✗ ${proposal.rejectVotes} Reject</span>
                </div>
            </div>
        `;
    }).join('');
}

/**
 * Get party name from coalition parties list
 */
function getPartyName(partyId) {
    const party = coalitionParties.find(p => p.party_id === partyId);
    return party ? party.party_name : 'Unknown Party';
}

/**
 * Vote on a coalition proposal
 */
async function voteOnCoalition(coalitionId, vote) {
    try {
        const { data, error } = await _supabase.rpc('vote_on_coalition', {
            p_coalition_id: coalitionId,
            p_party_id: currentFaction.id,
            p_vote: vote
        });
        
        if (error) throw error;
        
        const result = data[0];
        if (result.success) {
            alert(`✅ ${result.message}`);
            
            const { data: proposals } = await _supabase
                .from('coalition_proposals')
                .select('*')
                .eq('election_id', currentElectionId)
                .eq('status', 'pending');
            
            if (proposals) {
                showCoalitionProposals(proposals);
            }
        } else {
            alert(`❌ ${result.message}`);
        }
    } catch (error) {
        console.error('Vote error:', error);
        alert('❌ Error voting: ' + error.message);
    }
}

/**
 * Resolve coalition voting (admin function)
 */
async function resolveCoalitionVoting() {
    if (!confirm('Are you sure you want to resolve coalition voting? This will finalize the government formation.')) {
        return;
    }
    
    try {
        const { data, error } = await _supabase.rpc('resolve_coalition_voting', {
            p_nation_id: currentNation.id,
            p_election_id: currentElectionId
        });
        
        if (error) throw error;
        
        const result = data[0];
        alert(`${result.success ? '✅' : '❌'} ${result.message}`);
        
        if (result.success) {
            document.getElementById('coalition-formation-section').style.display = 'none';
            document.getElementById('coalition-proposals-section').style.display = 'none';
            
            sessionStorage.removeItem('nationhood_state');
            location.reload();
        }
    } catch (error) {
        console.error('Resolve voting error:', error);
        alert('❌ Error resolving: ' + error.message);
    }
}
