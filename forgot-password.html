<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nationhood | Reset Password</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://pbumjalxclmegzckhqqr.supabase.co" crossorigin>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; padding: 20px; }
        .reset-card { background: #1e1e1e; padding: 40px; border-radius: 8px; border-top: 4px solid #ffcc00; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #ffcc00; margin-top: 0; }
        .subtitle { color: #888; font-size: 0.85rem; margin-bottom: 24px; line-height: 1.5; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #888; }
        input { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; }
        .btn-reset { width: 100%; padding: 15px; background: #ffcc00; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; transition: 0.2s; color: #000; }
        .btn-reset:hover { background: #e6b800; }
        .btn-reset:disabled { background: #666; cursor: not-allowed; }
        .back-link { text-align: center; margin-top: 15px; font-size: 0.8rem; }
        .back-link a { color: #ffcc00; text-decoration: none; }
        .error { color: #ff4444; font-size: 0.9rem; margin-top: 10px; text-align: center; }
        .success-box {
            background: #1a2a1a;
            border-left: 3px solid #4CAF50;
            padding: 16px;
            border-radius: 4px;
            margin-top: 10px;
            display: none;
        }
        .success-box .success-title { color: #4CAF50; font-weight: bold; margin-bottom: 6px; }
        .success-box .success-desc { color: #aaa; font-size: 0.85rem; line-height: 1.5; }
    </style>
</head>
<body>
<div class="reset-card">
    <h2>Forgot Password</h2>
    <div class="subtitle">Enter the email address tied to your faction. We'll send a link to reset your password.</div>

    <form id="forgot-form">
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="commander@example.com" required>
        </div>
        <button type="submit" class="btn-reset" id="submit-btn">SEND RESET LINK</button>
        <div id="error-message" class="error"></div>
    </form>

    <div class="success-box" id="success-box">
        <div class="success-title">✓ Reset Link Sent</div>
        <div class="success-desc">Check your inbox (and spam folder). Click the link in the email to set a new password. The link expires in 1 hour.</div>
    </div>

    <div class="back-link">
        <a href="login.html">← Back to Login</a>
    </div>
</div>
<script>
    const supabaseUrl = 'https://pbumjalxclmegzckhqqr.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBidW1qYWx4Y2xtZWd6Y2tocXFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3ODk0NTUsImV4cCI6MjA4NTM2NTQ1NX0.ykjUqdJbwF3yliond1Vz2lcNQZCWA-5SnviruXm4ypI';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const submitBtn = document.getElementById('submit-btn');
        const errorMsg = document.getElementById('error-message');
        const successBox = document.getElementById('success-box');
        errorMsg.textContent = '';
        successBox.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.textContent = 'SENDING...';

        const email = document.getElementById('email').value;

        try {
            const { error } = await _supabase.auth.resetPasswordForEmail(email, {
                redirectTo: 'https://www.nationhoodgame.com/reset-password.html'
            });

            if (error) throw error;

            // Always show success (don't reveal if email exists or not)
            document.getElementById('forgot-form').style.display = 'none';
            successBox.style.display = 'block';
        } catch (error) {
            console.error('Reset error:', error);
            // Show generic success anyway to prevent email enumeration
            document.getElementById('forgot-form').style.display = 'none';
            successBox.style.display = 'block';
        }
    });
</script>
</body>
</html>
