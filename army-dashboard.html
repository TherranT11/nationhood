<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Army | Nationhood Alpha</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #0e0e0c;
  --bg-2: #1a1a17;
  --bg-3: #252525;
  --text-bright: #f0efe6;
  --text-primary: #c4c2b8;
  --text-dim: #4a4940;
  --border-0: rgba(255,255,255,0.06);
  --border-1: rgba(255,255,255,0.08);
  --amber: #c8a64e;
  --red: #d9534f;
  --red-faint: rgba(217,83,79,0.08);
  --red-border: rgba(217,83,79,0.18);
  --teal: #5aafa5;
  --font-mono: 'JetBrains Mono', monospace;
  --font-ui: 'IBM Plex Sans', -apple-system, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg-0);
  color: var(--text-primary);
  font-family: var(--font-ui);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.loading-msg {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-dim);
  text-align: center;
  padding: 80px 20px;
}

/* ── Military top bar (mirrors corp-topbar.css proportions) ── */
.mil-topbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 22px; height: 53px;
  background: var(--bg-2); border-bottom: 1px solid var(--border-0);
}
.mil-topbar__left { display: flex; align-items: center; gap: 0; }
.mil-topbar__sep {
  width: 1px; height: 31px; background: var(--border-1);
  margin: 0 16px; flex-shrink: 0;
}
.mil-topbar__badge { display: flex; align-items: center; gap: 10px; }
.mil-topbar__flag {
  width: 36px; height: 24px; object-fit: cover;
  border: 1px solid var(--border-1);
}
.mil-topbar__flag-fallback {
  width: 36px; height: 24px;
  background: var(--bg-3); border: 1px solid var(--border-1);
}
.mil-topbar__name {
  font-family: var(--font-ui); font-size: 14px; font-weight: 700;
  color: var(--text-bright);
}
.mil-topbar__ticks { display: flex; gap: 20px; }
.mil-topbar__tick { display: flex; flex-direction: column; gap: 1px; }
.mil-topbar__tick-label {
  font-family: var(--font-mono); font-size: 9.5px; font-weight: 600;
  letter-spacing: 0.8px; text-transform: uppercase; color: #7a7868;
}
.mil-topbar__tick-value {
  font-family: var(--font-mono); font-size: 13px; font-weight: 500;
  color: var(--text-bright);
}
.mil-topbar__version {
  font-family: var(--font-mono); font-size: 10px;
  color: #f0efe6; letter-spacing: 0.5px; opacity: 0.8;
}
.mil-topbar__right { display: flex; align-items: center; gap: 10px; }
.mil-topbar__switcher { position: relative; }
.mil-topbar__badge-btn {
  font-family: var(--font-mono); font-size: 12px; font-weight: 700;
  color: var(--red); padding: 4px 10px; cursor: pointer;
  background: var(--red-faint);
  border: 1px solid var(--red-border);
}
.mil-topbar__dropdown {
  display: none; position: absolute; top: 100%; right: 0;
  min-width: 260px; max-height: 60vh; overflow-y: auto;
  background: var(--bg-2); border: 1px solid var(--border-0);
  box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 100; margin-top: 4px;
}
.mil-topbar__dropdown.open { display: block; }
.mil-dd-item {
  display: flex; align-items: center; gap: 8px; padding: 8px 14px;
  cursor: pointer; border-bottom: 1px solid var(--border-0);
  font-family: var(--font-mono); font-size: 11px;
}
.mil-dd-item:hover { background: rgba(255,255,255,0.04); }
.mil-dd-item.active { background: rgba(217,83,79,0.06); }
.mil-dd-item--create { border-top: 1px solid var(--border-0); }
.mil-dd-type { font-size: 8px; font-weight: 700; letter-spacing: 0.5px; min-width: 32px; }
.mil-dd-name { color: var(--text-bright); flex: 1; }
.mil-dd-abbr { color: var(--text-dim); font-size: 9px; }
.mil-topbar__btn {
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  letter-spacing: 0.5px; padding: 5px 14px; cursor: pointer;
  background: transparent; border: 1px solid var(--border-0);
  color: var(--text-dim); transition: all 0.15s;
}
.mil-topbar__btn:hover { color: var(--text-bright); border-color: var(--text-dim); }
.mil-topbar__btn--logout:hover { color: var(--red); border-color: var(--red); }

.mil-topbar__nav {
  display: flex; gap: 0; padding: 0 22px;
  background: var(--bg-2); border-bottom: 1px solid var(--border-0);
}
.mil-nav-tab {
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  letter-spacing: 1px; padding: 8px 16px; color: var(--text-dim);
  border-bottom: 2px solid transparent; transition: all 0.15s;
  text-transform: uppercase; text-decoration: none;
}
.mil-nav-tab:hover { color: var(--text-bright); }
.mil-nav-tab.active {
  color: var(--text-bright);
  border-bottom-color: var(--red);
}

/* Coming-soon body (unchanged) */
.coming-soon {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  text-align: center;
}
.coming-soon__label {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  color: var(--text-dim);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.coming-soon__title {
  font-family: var(--font-ui);
  font-size: 22px;
  font-weight: 700;
  color: var(--text-bright);
}

/* ── Army masthead (matches the corp-dashboard masthead in size + serif) ── */
.army-masthead {
  max-width: 1440px;
  margin: 0 auto;
  padding: 32px 22px 24px;
  border-bottom: 1px solid var(--border-0);
}
.army-masthead__kicker {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.18em;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-bottom: 10px;
}
.army-masthead__title {
  font-family: 'IBM Plex Serif', Georgia, serif;
  font-size: 52px;
  font-weight: 500;
  line-height: 1.05;
  color: var(--text-bright);
  margin-bottom: 16px;
}
.army-masthead__title em {
  font-style: italic;
  font-weight: 500;
  color: var(--amber);
}
.army-masthead__meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 28px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 0.04em;
}
.army-masthead__meta-label {
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  margin-right: 6px;
}
.army-masthead__meta-value {
  color: var(--text-bright);
  font-weight: 600;
}
</style>
</head>
<body>

<div id="loading" class="loading-msg">LOADING ARMY DASHBOARD...</div>

<div id="page" style="display:none; flex-direction:column; flex:1;">
  <div id="mil-topbar-host"></div>

  <div class="army-masthead">
    <div class="army-masthead__kicker">— Army —</div>
    <div class="army-masthead__title" id="army-masthead-title">Army of <em>—</em></div>
    <div class="army-masthead__meta">
      <div>
        <span class="army-masthead__meta-label">Headquarters</span>
        <span class="army-masthead__meta-value" id="army-masthead-hq">—</span>
      </div>
      <div>
        <span class="army-masthead__meta-label">Chief of the Army</span>
        <span class="army-masthead__meta-value" id="army-masthead-chief">—</span>
      </div>
    </div>
  </div>

  <div class="coming-soon">
    <div class="coming-soon__label">Branch HQ</div>
    <div class="coming-soon__title">Coming soon</div>
  </div>
</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { isFactionInactive } from './js/game/factions.js';
import { renderMilitaryTopBar } from './js/military-topbar.js';
import { escapeHtml } from './js/utils.js';

async function init() {
  try {
    const { data: { user } } = await _supabase.auth.getUser();
    if (!user) { window.location.href = 'login.html'; return; }

    // Find this user's army faction (primary or linked). leader_* columns
    // hold the Chief of the Army — generated at join time, persisted, and
    // read here as the single source of truth for the masthead.
    const { data: faction, error: factionErr } = await _supabase
      .from('factions')
      .select('id, faction_type, faction_name, abbreviation, nation_id, abandoned_at, is_banned, branch, leader_first_name, leader_last_name, leader_age')
      .or(`id.eq.${user.id},linked_user_id.eq.${user.id}`)
      .eq('faction_type', 'military')
      .eq('branch', 'army')
      .is('abandoned_at', null)
      .maybeSingle();

    if (factionErr) {
      console.warn('Military faction lookup failed:', factionErr.message);
      window.location.href = 'dashboard.html';
      return;
    }
    if (!faction || isFactionInactive(faction)) {
      window.location.href = 'dashboard.html';
      return;
    }

    // Parallel fetch: nation (name + capital + flag), shard (game date),
    // and every other faction the user owns (for the switcher dropdown).
    const [nationRes, shardRes, allFactionsRes] = await Promise.all([
      _supabase
        .from('nations')
        .select('name, capital, flag_url, nation_profiles(flag_url)')
        .eq('id', faction.nation_id)
        .maybeSingle(),
      _supabase
        .from('shard')
        .select('current_date, current_tick')
        .eq('name', 'Alpha Shard')
        .maybeSingle(),
      _supabase
        .from('factions')
        .select('id, faction_type, faction_name, abbreviation, branch, abandoned_at, is_banned, nation_id, linked_user_id')
        .or(`id.eq.${user.id},linked_user_id.eq.${user.id}`),
    ]);

    if (nationRes.error) console.warn('Nation lookup failed:', nationRes.error.message);
    if (shardRes.error)  console.warn('Shard lookup failed:',  shardRes.error.message);
    if (allFactionsRes.error) console.warn('Factions lookup failed:', allFactionsRes.error.message);

    const nation = nationRes.data || null;
    const shard  = shardRes.data  || null;
    const allUserFactions = (allFactionsRes.data || []).filter(f => !isFactionInactive(f));

    const nationName = nation?.name || 'Unknown Nation';
    const np = nation?.nation_profiles;
    const profileFlag = Array.isArray(np) ? np[0]?.flag_url : np?.flag_url;
    const flagUrl = profileFlag || nation?.flag_url || `assets/flags/${nationName}.png`;

    renderMilitaryTopBar(document.getElementById('mil-topbar-host'), {
      faction,
      nation,
      shard,
      allUserFactions,
      activeTab: 'home',
      flagUrl,
    });

    // Masthead: nation name + capital + chief. Values come straight from
    // the faction / nation rows — no client-side derivation.
    const capital = nation?.capital || '—';
    const chiefFirst = faction.leader_first_name || '';
    const chiefLast  = faction.leader_last_name  || '';
    const chiefAge   = faction.leader_age;
    const chiefName  = (chiefFirst + ' ' + chiefLast).trim();
    const chiefLine  = chiefName
      ? (chiefAge != null ? `${chiefName}, ${chiefAge}` : chiefName)
      : '—';

    document.getElementById('army-masthead-title').innerHTML =
      'Army of <em>' + escapeHtml(nationName) + '</em>';
    document.getElementById('army-masthead-hq').textContent    = capital;
    document.getElementById('army-masthead-chief').textContent = chiefLine;

    document.getElementById('loading').style.display = 'none';
    document.getElementById('page').style.display = 'flex';
  } catch (err) {
    console.warn('Army dashboard init failed:', err?.message || err);
    document.getElementById('loading').textContent = 'FAILED TO LOAD — PLEASE REFRESH';
  }
}

init();
</script>
</body>
</html>
