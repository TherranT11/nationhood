<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Army | Nationhood Alpha</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #0e0e0c;
  --bg-2: #1a1a17;
  --bg-3: #252525;
  --text-bright: #f0efe6;
  --text-primary: #c4c2b8;
  --text-dim: #4a4940;
  --border-0: rgba(255,255,255,0.06);
  --border-1: rgba(255,255,255,0.08);
  --red: #d9534f;
  --red-faint: rgba(217,83,79,0.08);
  --red-border: rgba(217,83,79,0.18);
  --font-mono: 'JetBrains Mono', monospace;
  --font-ui: 'IBM Plex Sans', -apple-system, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg-0);
  color: var(--text-primary);
  font-family: var(--font-ui);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.loading-msg {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-dim);
  text-align: center;
  padding: 80px 20px;
}

.army-topbar {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 22px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--border-0);
}
.army-topbar__flag {
  width: 36px;
  height: 24px;
  object-fit: cover;
  border: 1px solid var(--border-1);
}
.army-topbar__flag-fallback {
  width: 36px;
  height: 24px;
  background: var(--bg-3);
  border: 1px solid var(--border-1);
}
.army-topbar__title {
  font-family: var(--font-ui);
  font-size: 16px;
  font-weight: 700;
  color: var(--text-bright);
  letter-spacing: 0.01em;
}
.army-topbar__type {
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 700;
  color: var(--red);
  background: var(--red-faint);
  border: 1px solid var(--red-border);
  padding: 3px 8px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-left: auto;
}

.coming-soon {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  text-align: center;
}
.coming-soon__label {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  color: var(--text-dim);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.coming-soon__title {
  font-family: var(--font-ui);
  font-size: 22px;
  font-weight: 700;
  color: var(--text-bright);
}
</style>
</head>
<body>

<div id="loading" class="loading-msg">LOADING ARMY DASHBOARD...</div>

<div id="page" style="display:none; flex-direction:column; flex:1;">
  <div class="army-topbar">
    <img class="army-topbar__flag" id="army-flag" alt="" onerror="this.outerHTML='<div class=&quot;army-topbar__flag-fallback&quot;></div>'">
    <div class="army-topbar__title" id="army-title">Army</div>
    <div class="army-topbar__type">Military</div>
  </div>

  <div class="coming-soon">
    <div class="coming-soon__label">Branch HQ</div>
    <div class="coming-soon__title">Coming soon</div>
  </div>
</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { isFactionInactive } from './js/game/factions.js';

async function init() {
  try {
    const { data: { user } } = await _supabase.auth.getUser();
    if (!user) { window.location.href = 'login.html'; return; }

    // Find this user's army faction (primary or linked).
    const { data: faction, error: factionErr } = await _supabase
      .from('factions')
      .select('id, faction_type, faction_name, nation_id, abandoned_at, is_banned, branch')
      .or(`id.eq.${user.id},linked_user_id.eq.${user.id}`)
      .eq('faction_type', 'military')
      .eq('branch', 'army')
      .is('abandoned_at', null)
      .maybeSingle();

    if (factionErr) {
      console.warn('Military faction lookup failed:', factionErr.message);
      window.location.href = 'dashboard.html';
      return;
    }
    if (!faction || isFactionInactive(faction)) {
      window.location.href = 'dashboard.html';
      return;
    }

    const { data: nation, error: nationErr } = await _supabase
      .from('nations')
      .select('name, flag_url, nation_profiles(flag_url)')
      .eq('id', faction.nation_id)
      .maybeSingle();
    if (nationErr) console.warn('Nation lookup failed:', nationErr.message);

    const nationName = nation?.name || 'Unknown Nation';
    const np = nation?.nation_profiles;
    const profileFlag = Array.isArray(np) ? np[0]?.flag_url : np?.flag_url;
    const flagUrl = profileFlag || nation?.flag_url || `assets/flags/${nationName}.png`;

    document.getElementById('army-flag').src = flagUrl;
    document.getElementById('army-title').textContent = 'Army of ' + nationName;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('page').style.display = 'flex';
  } catch (err) {
    console.warn('Army dashboard init failed:', err?.message || err);
    document.getElementById('loading').textContent = 'FAILED TO LOAD — PLEASE REFRESH';
  }
}

init();
</script>
</body>
</html>
