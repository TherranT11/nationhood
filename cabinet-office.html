<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cabinet Office</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  :root{
    --bg:#080808; --panel:#0d0d0d; --panel2:#101010;
    --line:rgba(255,255,255,0.07); --txt:#d4d4d4; --mut:#888; --faint:#666;
    --amber:#c8a64e; --amber-bg:#161208; --amber-dim:rgba(200,166,78,0.4);
    --teal:#5aafa5;
    --pos:#6ab07a; --pos-bg:#0e1611; --pos-dim:#3a5a42;
    --neu:#d4b87a; --neu-bg:#161208; --neu-dim:#5a4d2e;
    --neg:#c87a7a; --neg-bg:#160e0e; --neg-dim:#5a3030;
  }
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,system-ui,sans-serif;min-height:100vh;}
  .content{padding:30px 22px;}
  .wrap{max-width:1280px;margin:0 auto;}

  .crumb{font-size:9px;letter-spacing:0.13em;color:var(--faint);margin-bottom:16px;text-transform:uppercase;}
  .crumb a{color:var(--mut);text-decoration:none;}
  .crumb a:hover{color:var(--amber);}
  .crumb .sep{margin:0 7px;color:#3a3a3a;}

  .page-header{margin-bottom:28px;}
  .ph-eyebrow{font-size:10px;letter-spacing:0.18em;color:var(--amber);text-transform:uppercase;
    font-family:monospace;margin-bottom:10px;}
  .ph-title{font-size:28px;font-weight:500;letter-spacing:-0.01em;color:#fff;
    font-family:Georgia,'Times New Roman',serif;font-style:italic;}
  .ph-sub{font-size:12px;color:var(--mut);margin-top:8px;}

  /* Locked state — Cabinet Office is gated to PM + the major ministry_keys
     (defense, interior, foreign, trade). foreign + trade are merged
     player-facing as "Foreign Ministry & Trade"; either key satisfies the
     gate. See MAJOR_MINISTER_KEYS below. */
  .locked{margin-top:60px;text-align:center;color:var(--neu);font-size:14px;
    font-family:Georgia,serif;font-style:italic;}

  /* Administration block — title bar + coalition list */
  .section{background:var(--panel);border:0.5px solid var(--line);border-radius:6px;
    padding:22px;margin-bottom:18px;}
  .section-head{font-size:10px;letter-spacing:0.16em;color:var(--mut);text-transform:uppercase;
    font-family:monospace;margin-bottom:14px;}
  .admin-title{font-size:20px;font-weight:500;color:#fff;font-family:Georgia,serif;
    font-style:italic;margin-bottom:18px;}

  .coalition{display:flex;flex-direction:column;gap:8px;}
  .coalition-row{display:flex;justify-content:space-between;align-items:baseline;
    padding:8px 12px;background:var(--panel2);border:0.5px solid var(--line);border-radius:4px;}
  .coalition-name{font-size:14px;font-weight:600;}
  .coalition-pop{font-size:11px;color:var(--mut);font-family:monospace;letter-spacing:0.04em;}

  /* Administration: coalition on the left, leadership panel on the right. */
  .admin-layout{display:flex;gap:24px;align-items:flex-start;}
  .admin-main{flex:1;min-width:0;}
  .admin-leaders{flex:0 0 260px;display:flex;flex-direction:column;gap:10px;}
  @media (max-width:760px){ .admin-layout{flex-direction:column;} .admin-leaders{flex-basis:auto;width:100%;} }
  .leader-row{padding:10px 12px;background:var(--panel2);border:0.5px solid var(--line);border-radius:4px;}
  .leader-role{font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--faint);
    font-family:monospace;margin-bottom:5px;}
  .leader-name{font-size:14px;font-weight:600;color:#fff;}
  .leader-name .age{color:var(--mut);font-weight:400;}
  .leader-name .leader-vacant{color:var(--faint);font-weight:400;font-style:italic;}

  /* Cabinet — one roster card per major ministry: ministry · minister ·
     party tag. (HoG/HoS live in the Leadership panel up top.) */
  .cabinet-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));gap:10px;}
  .cab-card{padding:12px 14px;background:var(--panel2);border:0.5px solid var(--line);
    border-left:3px solid var(--amber-dim);border-radius:4px;}
  .cab-title{font-size:12px;letter-spacing:0.07em;text-transform:uppercase;color:var(--mut);
    font-family:monospace;font-weight:700;margin-bottom:8px;}
  .cab-holder{font-size:14px;font-weight:600;color:#fff;}
  .cab-holder .cab-vacant{color:var(--faint);font-weight:400;font-style:italic;}
  .cab-party-row{margin-top:8px;}
  .cab-party{display:inline-block;font-family:monospace;font-size:8.5px;font-weight:700;
    letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;border-radius:3px;
    border:0.5px solid currentColor;}

  /* Dedicated ministry containers — full-name head (with an optional
     top-right action chip) over that ministry's per-turn action rows. */
  .min-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .min-name{font-size:16px;font-weight:600;letter-spacing:0.02em;line-height:1.3;}
  .min-empty{color:var(--faint);font-size:11px;font-style:italic;}
  .cab-actions-left{flex-shrink:0;font-family:monospace;font-size:9px;letter-spacing:0.1em;
    font-weight:700;color:var(--amber);background:var(--amber-bg);
    border:0.5px solid var(--amber-dim);border-radius:4px;padding:5px 9px;}
  .cab-actions{display:flex;flex-direction:column;gap:8px;}
  .cab-action{display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:12px 14px;background:var(--panel2);border:0.5px solid var(--line);border-radius:4px;}
  .cab-action-info{min-width:0;}
  .cab-action-name{font-size:13px;font-weight:600;color:#fff;margin-bottom:4px;}
  .cab-action-desc{font-size:11px;line-height:1.55;color:var(--mut);}
  .cab-action-meta{margin-top:5px;font-family:monospace;font-size:8.5px;letter-spacing:0.1em;
    text-transform:uppercase;color:var(--faint);}
  .cab-action-btn{flex-shrink:0;padding:9px 15px;background:var(--amber-bg);
    border:0.5px solid var(--amber-dim);border-radius:4px;color:var(--amber);
    font-family:monospace;font-size:9px;letter-spacing:0.1em;font-weight:700;cursor:pointer;}
  .cab-action-btn:hover{background:rgba(200,166,78,0.16);}

  /* National Focus — three exclusive posture cards with a radio circle
     top-right; only the HoG may change focus (the current one's button
     is greyed). */
  .focus-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;}
  @media (max-width:760px){ .focus-grid{grid-template-columns:1fr;} }
  .focus-card{position:relative;padding:14px 16px;background:var(--panel2);
    border:0.5px solid var(--line);border-left:3px solid var(--line);border-radius:6px;
    display:flex;flex-direction:column;}
  .focus-card.sel{border-left-color:var(--amber);background:var(--amber-bg);}
  .focus-circle{position:absolute;top:14px;right:14px;width:15px;height:15px;border-radius:50%;
    border:2px solid var(--faint);box-sizing:border-box;}
  .focus-card.sel .focus-circle{border-color:var(--amber);
    background:radial-gradient(var(--amber) 0 3.5px, transparent 4.5px);}
  .focus-name{font-size:14px;font-weight:600;color:#fff;margin-bottom:6px;padding-right:26px;}
  .focus-desc{font-size:11.5px;line-height:1.55;color:var(--mut);flex:1;}
  .focus-perk{margin-top:8px;font-family:monospace;font-size:9px;letter-spacing:0.08em;
    text-transform:uppercase;color:var(--pos);}
  .focus-effect{margin-top:5px;font-family:monospace;font-size:9px;letter-spacing:0.08em;
    text-transform:uppercase;color:#c0696a;}
  .focus-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .focus-cd{color:var(--faint);font-size:9px;letter-spacing:0.08em;}
  .focus-btn{margin-top:12px;align-self:flex-start;padding:8px 14px;background:var(--amber-bg);
    border:0.5px solid var(--amber-dim);border-radius:4px;color:var(--amber);
    font-family:monospace;font-size:9px;letter-spacing:0.1em;font-weight:700;cursor:pointer;}
  .focus-btn:hover:not(:disabled){background:rgba(200,166,78,0.16);}
  .focus-btn:disabled{opacity:0.4;cursor:default;}

  /* State of the Nation — compact modifier cards, 4 across (collapses on narrow). */
  .ston-grid{display:grid;grid-template-columns:repeat(4, 1fr);gap:10px;}
  @media (max-width: 900px){ .ston-grid{grid-template-columns:repeat(2, 1fr);} }
  @media (max-width: 520px){ .ston-grid{grid-template-columns:1fr;} }
  .ston-card{padding:10px 12px;border:0.5px solid var(--line);border-radius:4px;
    background:var(--panel2);border-left-width:3px;}
  .ston-card.sev-green { border-left-color:var(--pos); background:linear-gradient(90deg, var(--pos-bg) 0%, var(--panel2) 50%); }
  .ston-card.sev-yellow{ border-left-color:var(--neu); background:linear-gradient(90deg, var(--neu-bg) 0%, var(--panel2) 50%); }
  .ston-card.sev-red   { border-left-color:var(--neg); background:linear-gradient(90deg, var(--neg-bg) 0%, var(--panel2) 50%); }
  .ston-name{font-size:13px;font-weight:600;color:#fff;line-height:1.25;margin-bottom:6px;}
  .ston-cat{font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--faint);
    font-family:monospace;margin-bottom:8px;}
  .ston-desc{font-size:11px;line-height:1.45;color:var(--mut);margin-bottom:10px;}
  .ston-stakes{font-family:monospace;font-size:8.5px;letter-spacing:0.06em;text-transform:uppercase;
    color:var(--mut);margin-bottom:10px;}
  .ston-sev{display:inline-block;font-size:8.5px;letter-spacing:0.08em;text-transform:uppercase;
    font-family:monospace;font-weight:700;padding:2px 6px;border-radius:2px;}
  .ston-sev.sev-green { color:var(--pos); border:0.5px solid var(--pos-dim); }
  .ston-sev.sev-yellow{ color:var(--neu); border:0.5px solid var(--neu-dim); }
  .ston-sev.sev-red   { color:var(--neg); border:0.5px solid var(--neg-dim); }

  /* Domestic Economy — commodity cards, 6 across (collapses). Same per-key
     accent colours politician-economy.html uses so the strip reads the same
     here. */
  .comm-grid{display:grid;grid-template-columns:repeat(6, 1fr);gap:10px;}
  @media (max-width: 1100px){ .comm-grid{grid-template-columns:repeat(3, 1fr);} }
  @media (max-width: 560px){ .comm-grid{grid-template-columns:repeat(2, 1fr);} }
  .comm-card{padding:12px;background:var(--panel2);border:0.5px solid var(--line);border-radius:4px;
    border-left-width:3px;}
  .comm-card.crude_oil     { border-left-color:#c87a4a; }
  .comm-card.minerals      { border-left-color:#a08a6e; }
  .comm-card.foodstuffs    { border-left-color:#7aab6a; }
  .comm-card.consumer_goods{ border-left-color:#9aab7a; }
  .comm-card.services      { border-left-color:#7a9aab; }
  .comm-card.diplomacy     { border-left-color:#b9a2d4; }
  .comm-name{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--mut);
    font-family:monospace;font-weight:700;margin-bottom:10px;}
  .comm-row{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;padding:2px 0;}
  .comm-lab{color:var(--faint);font-family:monospace;letter-spacing:0.06em;}
  .comm-val{color:#fff;font-weight:600;font-family:monospace;}

  .empty{font-size:11px;color:var(--faint);font-style:italic;font-family:monospace;padding:10px 0;}

  .loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--mut);font-family:monospace;font-size:10px;letter-spacing:0.18em;}
</style>
</head>
<body>
<div id="pol-topbar-container"></div>
<div id="ent-topbar"></div>

<div class="content">
  <div class="wrap">
    <div class="crumb" id="crumb"></div>
    <div class="page-header">
      <div class="ph-eyebrow">— CABINET OFFICE —</div>
      <h1 class="ph-title">Head Office</h1>
      <div class="ph-sub" id="ph-sub"></div>
    </div>

    <div id="locked" class="locked" style="display:none">
      You do not have access to the Cabinet office.
    </div>

    <div id="page" style="display:none">
      <section class="section">
        <div class="admin-layout">
          <div class="admin-main">
            <div class="admin-title" id="admin-title">— Administration</div>
            <div class="coalition" id="coalition"></div>
          </div>
          <div class="admin-leaders" id="admin-leaders"></div>
        </div>
      </section>

      <section class="section">
        <div class="section-head focus-head"><span>National Focus</span><span class="focus-cd">12-Tick Cooldown</span></div>
        <div class="focus-grid" id="focus-grid"></div>
      </section>

      <section class="section">
        <div class="section-head">State of the Nation</div>
        <div class="ston-grid" id="ston-grid"></div>
      </section>

      <section class="section">
        <div class="section-head">Domestic Economy</div>
        <div class="comm-grid" id="comm-grid"></div>
      </section>

      <section class="section">
        <div class="section-head">Cabinet</div>
        <div class="cabinet-grid" id="cabinet-grid"></div>
      </section>

      <!-- One dedicated container per major ministry (rendered by
           renderMinistries) — each carries that ministry's actions. -->
      <div id="ministry-containers"></div>
    </div>
  </div>
</div>

<div id="loading" class="loading">LOADING...</div>

<script type="module">
import { bootstrapPoliticianOrBusinessman } from './js/politician-topbar.js';
import { _supabase } from './js/supabase-client.js';
import { escapeHtml } from './js/utils.js';
import { COMMODITIES } from './js/game/commodities.js';
import { SEVERITY_LABELS } from './js/game/modifiers.js';

// ── Access gate ──────────────────────────────────────────────────────
// PM (head_of_government.faction_id) OR Major Minister (ministries
// row with a leader-name match on the player's faction in the active
// nation). Live ministry_key values that are politician-facing cabinet
// posts. 'foreign' is the Foreign Affairs & Trade portfolio (it covers
// trade — there is NO standalone politician-side trade ministry, so the
// 'trade' key, which exists only for the businessman-side shipping
// system, is deliberately excluded here). 'finance' is left off pending
// a separate decision on finance-minister access.
const MAJOR_MINISTER_KEYS = ['defense', 'interior', 'foreign'];

// Validate a party colour to #RRGGBB before inlining it; anything else
// falls back to white (mirrors first-steps / politician-nation).
const safeHexColor = (c) => /^#[0-9a-f]{6}$/i.test(c || '') ? c : '#fff';

async function init() {
  let ctx = null;
  try { ctx = await bootstrapPoliticianOrBusinessman('nation', 'nation'); }
  catch (err) {
    console.error('cabinet-office: bootstrap failed', err);
    document.getElementById('loading').textContent = 'Failed to load. Please reload the page.';
    return;
  }
  if (!ctx) return;

  const nation  = ctx.nation;
  const faction = ctx.faction;
  if (!nation || !faction) {
    document.getElementById('loading').textContent = 'No nation associated with this politician.';
    return;
  }

  document.title = `${nation.name} — Cabinet Office`;
  document.getElementById('ph-sub').textContent = nation.name;
  document.getElementById('crumb').innerHTML =
    `<a href="politician-nation.html">${escapeHtml((nation.name || 'NATION').toUpperCase())}</a>` +
    ` <span class="sep">·</span> CABINET OFFICE`;

  // Access check: PM by head_of_government.faction_id, or Major Minister
  // by leader-name match within the nation. Both queries run in parallel;
  // a hard failure on BOTH is treated as a load error rather than letting
  // the page silently render the locked state (which would falsely accuse
  // a genuinely-authorised user of lacking access).
  const [hogRes, minRes] = await Promise.all([
    _supabase.from('head_of_government')
      .select('faction_id')
      .eq('nation_id', nation.id)
      .eq('active', true)
      .maybeSingle(),
    _supabase.from('ministries')
      .select('ministry_key, minister_first_name, minister_last_name')
      .eq('nation_id', nation.id)
      .eq('is_active', true)
      .in('ministry_key', MAJOR_MINISTER_KEYS),
  ]);
  if (hogRes.error) console.warn('cabinet-office: head_of_government fetch failed', hogRes.error);
  if (minRes.error) console.warn('cabinet-office: ministries fetch failed', minRes.error);
  if (hogRes.error && minRes.error) {
    document.getElementById('loading').textContent = 'Failed to load. Please reload the page.';
    return;
  }

  const hog = hogRes.data || null;
  const isPM = !!(hog && hog.faction_id === faction.id);
  const isMinister = (minRes.data || []).some(m =>
    m.minister_first_name === faction.leader_first_name &&
    m.minister_last_name  === faction.leader_last_name
  );
  // Foreign Minister post (politician_foreign_minister_at_tick, 20270868) —
  // the dedicated politician-side cabinet post grants Head Office directly,
  // no ministries-table name-match needed.
  const isFM = faction.politician_foreign_minister_at_tick != null;

  if (!isPM && !isMinister && !isFM) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('locked').style.display = 'block';
    return;
  }

  // Resolve the focus first — both the focus box and the ministries'
  // per-turn action counts read it.
  nationalFocus = await fetchNationalFocus(nation.id);
  renderMinistries();
  paintFocus(nation, isPM);
  await Promise.all([
    renderCoalition(nation.id, nation.name),
    renderLeadership(nation),
    renderCabinet(nation),
    renderModifiers(nation.id),
    renderCommodities(nation.id),
  ]);

  document.getElementById('loading').style.display = 'none';
  document.getElementById('page').style.display = 'block';
}

// Coalition list + admin title. Mirrors politician-nation.html's pattern:
// active administrations row + live movement_party rows, intersected on
// the coalition_parties jsonb array, sorted by seats DESC. The admin
// title is read straight off administrations.admin_name (server-stamped
// at formation as "{PM last_name} Administration", 20270666) rather than
// reconstructed client-side — single source. Falls back to "{nation}
// Administration" when no active admin row exists.
async function renderCoalition(nationId, nationName) {
  const host  = document.getElementById('coalition');
  const title = document.getElementById('admin-title');
  try {
    const [admRes, partiesRes] = await Promise.all([
      _supabase.from('administrations')
        .select('admin_name, coalition_parties')
        .eq('nation_id', nationId)
        .is('ended_at_tick', null)
        .order('started_at_tick', { ascending:false })
        .limit(1),
      _supabase.from('factions')
        .select('id, faction_name, party_color, seats, popularity_pct')
        .eq('nation_id', nationId)
        .eq('faction_type', 'movement_party')
        .is('abandoned_at', null),
    ]);
    if (admRes.error)     throw admRes.error;
    if (partiesRes.error) throw partiesRes.error;

    const adm     = admRes.data?.[0] || null;
    const parties = partiesRes.data || [];

    title.textContent = adm?.admin_name || `${nationName} Administration`;

    const ids = new Set((adm?.coalition_parties || []).map(p => p?.party_id).filter(Boolean));
    const coalition = parties
      .filter(p => ids.has(p.id))
      .sort((a,b) => (Number(b.seats)||0) - (Number(a.seats)||0));

    if (!coalition.length) {
      host.innerHTML = '<div class="empty">No active coalition.</div>';
      return;
    }
    host.innerHTML = coalition.map(p => {
      const color = safeHexColor(p.party_color);
      const pop   = (p.popularity_pct == null) ? '—' : (Math.round(Number(p.popularity_pct)) + '%');
      return `<div class="coalition-row">
        <span class="coalition-name" style="color:${color}">${escapeHtml(p.faction_name || 'Party')}</span>
        <span class="coalition-pop">${pop} popularity</span>
      </div>`;
    }).join('');
  } catch (err) {
    console.error('cabinet-office: coalition fetch failed', err);
    title.textContent = `${nationName} Administration`;
    host.innerHTML = '<div class="empty">Could not load coalition.</div>';
  }
}

// Leadership panel (right of the administration block): Head of Government
// (Prime Minister) + Head of State (President). The HoG name lives on
// head_of_government (server-stamped first/last); its age is read off the
// linked faction (head_of_government stores no age). The HoS name/title/age
// live on nations.head_of_state_*. A Presidential nation has no separate
// premier — HoS leads the government — so the PM row is omitted there,
// mirroring politician-nation's patchHeadOfGov guard.
async function renderLeadership(nation) {
  const host = document.getElementById('admin-leaders');
  if (!host) return;
  try {
    const [hogRes, hosRes] = await Promise.all([
      _supabase.from('head_of_government')
        .select('first_name, last_name, faction_id')
        .eq('nation_id', nation.id).eq('active', true).maybeSingle(),
      _supabase.from('nations')
        .select('head_of_state_title, head_of_state_first_name, head_of_state_last_name, head_of_state_age')
        .eq('id', nation.id).maybeSingle(),
    ]);
    const hog = hogRes.data || null;
    const hos = hosRes.data || null;

    // PM age — head_of_government has no age column, so read it from the
    // linked faction's leader_age (NPC PMs without a faction just omit it).
    let pmAge = null;
    if (hog?.faction_id) {
      const { data: f } = await _supabase.from('factions')
        .select('leader_age').eq('id', hog.faction_id).maybeSingle();
      pmAge = (f && f.leader_age != null) ? f.leader_age : null;
    }

    const pmName  = hog ? `${hog.first_name || ''} ${hog.last_name || ''}`.trim() : '';
    const hosName = hos ? `${hos.head_of_state_first_name || ''} ${hos.head_of_state_last_name || ''}`.trim() : '';
    const hosTitle = (hos && hos.head_of_state_title) || 'President';

    const rows = [];
    if (nation.government_type !== 'Presidential') {
      rows.push(leaderRow('Head of Government', 'Prime Minister', pmName, pmAge));
    }
    rows.push(leaderRow('Head of State', hosTitle, hosName, hos ? hos.head_of_state_age : null));
    host.innerHTML = rows.join('');
  } catch (err) {
    console.error('cabinet-office: leadership fetch failed', err);
    host.innerHTML = '';
  }
}

// One leadership row: "{title}: {name} ({age})". Age is parenthesised only
// when known; a missing holder reads "Vacant".
function leaderRow(role, title, name, age) {
  const detail = name
    ? `${escapeHtml(title)}: ${escapeHtml(name)}${age != null ? ` <span class="age">(${escapeHtml(String(age))})</span>` : ''}`
    : `${escapeHtml(title)}: <span class="leader-vacant">Vacant</span>`;
  return `<div class="leader-row">
    <div class="leader-role">${escapeHtml(role)}</div>
    <div class="leader-name">${detail}</div>
  </div>`;
}

// The four major ministries, in display order — `label` titles the
// Cabinet roster card, `name` titles the dedicated container below.
// (Head of Government and Head of State sit in the Leadership panel up
// top, not in the cabinet.)
const MINISTRIES = [
  { key: 'foreign_affairs',      label: 'Foreign Affairs and Trade', name: 'Foreign Affairs and Trade Ministry', color: '#5aafa5' },
  { key: 'economic_development', label: 'Economic Development',       name: 'Ministry of Economic Development',   color: '#6ab07a' },
  { key: 'interior',             label: 'Interior',                   name: 'Ministry of the Interior',           color: '#c8a64e' },
  { key: 'defense',              label: 'Defense',                    name: 'Ministry of Defense',                color: '#c0696a' },
];

// Per-ministry actions, keyed by ministry. `chip` is the container
// head's top-right status (e.g. the foreign minister's one action per
// turn); an action's `meta` is a small note (e.g. a cooldown). All
// display-only for now — none of these are wired.
const MINISTRY_ACTIONS = {
  foreign_affairs: {
    actions: [{
      name: 'Trade Mission', btn: 'SET UP',
      desc: 'Set up a trade mission, determine who will be involved, how long it will take, and who will be discussed.',
    }, {
      name: 'Diplomatic Mission', btn: 'SET UP',
      desc: 'Send envoys abroad to build relations, open dialogue, and lay the groundwork for accords and cooperation between nations.',
    }, {
      name: 'Sale to the World Market', btn: 'SELL',
      desc: 'Sell your nation’s surplus commodities and production onto the global market for hard cash at the going world price.',
    }],
  },
  economic_development: {
    actions: [{
      name: 'Produce', btn: 'PRODUCE', meta: '12-tick cooldown',
      desc: 'Your nation’s major primary industries produce, adding the current production value to their on-hand number.',
    }, {
      name: 'FDI', btn: 'FDI',
      desc: 'Invest into other countries abroad, helping them to develop their national economies and hopefully get a handsome and promised return on investment in the future.',
    }, {
      name: 'Subsidize Industry', btn: 'SUBSIDIZE',
      desc: 'Inject treasury funds into a chosen sector, temporarily lifting its output and growth — paying cash now to buy production later.',
    }, {
      name: 'Infrastructure Drive', btn: 'FUND',
      desc: 'Fund the roads, ports, and power that raise the ceiling on what your industries can produce — lasting capacity, not a single batch.',
    }, {
      name: 'Diversify a Sector', btn: 'DIVERSIFY',
      desc: 'Stand up a new industry from scratch, broadening your nation’s commodity base and easing reliance on any single export over time.',
    }],
  },
};

// A ministry's per-turn action allowance: a base count plus the National
// Focus grant (Diplomatic → Foreign Affairs, Military → Defense). Ministry
// actions aren't wired to a real allowance yet, so this drives the
// container's "N Actions Remaining" chip only.
const MINISTRY_BASE_ACTIONS = { foreign_affairs: 1 };
const FOCUS_ACTION_GRANT = { diplomatic: 'foreign_affairs', military: 'defense' };

async function renderCabinet(nation) {
  const host = document.getElementById('cabinet-grid');
  if (!host) return;
  try {
    const [minRes, fmRes, partyRes] = await Promise.all([
      _supabase.from('ministries')
        .select('ministry_key, minister_first_name, minister_last_name, party_id')
        .eq('nation_id', nation.id).eq('is_active', true),
      _supabase.from('factions')
        .select('leader_first_name, leader_last_name, politician_party_id')
        .eq('nation_id', nation.id)
        .not('politician_foreign_minister_at_tick', 'is', null)
        .is('abandoned_at', null).maybeSingle(),
      _supabase.from('factions')
        .select('id, faction_name, party_color')
        .eq('nation_id', nation.id)
        .eq('faction_type', 'movement_party')
        .is('abandoned_at', null),
    ]);
    const fm = fmRes.data || null;
    const minByKey = {};
    for (const m of (minRes.data || [])) minByKey[m.ministry_key] = m;
    const partyById = {};
    for (const p of (partyRes.data || [])) partyById[p.id] = p;

    // The ministries row backing a cabinet post (foreign reads either key).
    const rowFor = (key) => key === 'foreign_affairs'
      ? (minByKey['foreign_affairs'] || minByKey['foreign'] || null)
      : (minByKey[key] || null);

    // Minister name: Foreign Affairs from the dedicated post (NPC falls
    // back to the ministries row), the rest straight from the row.
    const nameFor = (key) => {
      if (key === 'foreign_affairs' && fm) {
        return `${fm.leader_first_name || ''} ${fm.leader_last_name || ''}`.trim();
      }
      const m = rowFor(key);
      return m ? `${m.minister_first_name || ''} ${m.minister_last_name || ''}`.trim() : '';
    };

    // Party tag: the minister's party. Foreign Affairs reads the
    // post-holder's politician_party_id (covers a player minister whose
    // ministries row carries no party); everyone else the portfolio's
    // controlling party (ministries.party_id). Both resolve to a
    // movement_party faction for the name + colour.
    const partyTagFor = (key) => {
      let pid = (key === 'foreign_affairs' && fm && fm.politician_party_id) ? fm.politician_party_id : null;
      if (!pid) { const r = rowFor(key); pid = (r && r.party_id) ? r.party_id : null; }
      const party = pid ? partyById[pid] : null;
      if (!party) return '';
      const color = safeHexColor(party.party_color);
      return `<span class="cab-party" style="color:${color}">${escapeHtml(party.faction_name || 'Party')}</span>`;
    };

    host.innerHTML = MINISTRIES.map(m => {
      const name = nameFor(m.key);
      const nameHtml = name ? escapeHtml(name) : `<span class="cab-vacant">Vacant</span>`;
      const tag = partyTagFor(m.key);
      return `<div class="cab-card" style="border-left-color:${m.color}">
        <div class="cab-title" style="color:${m.color}">${escapeHtml(m.label)}</div>
        <div class="cab-holder">${nameHtml}</div>
        ${tag ? `<div class="cab-party-row">${tag}</div>` : ''}
      </div>`;
    }).join('');
  } catch (err) {
    console.error('cabinet-office: cabinet fetch failed', err);
    host.innerHTML = '<div class="empty">Could not load cabinet.</div>';
  }
}

// The dedicated ministry containers — one section each, the ministry's
// per-turn actions inside (display-only scaffolds; none are wired). An
// optional chip (e.g. the foreign minister's one action per turn) sits
// top-right of the head.
function renderMinistries() {
  const host = document.getElementById('ministry-containers');
  if (!host) return;
  host.innerHTML = MINISTRIES.map(m => {
    const act = MINISTRY_ACTIONS[m.key];
    const acts = (MINISTRY_BASE_ACTIONS[m.key] || 0) + (FOCUS_ACTION_GRANT[nationalFocus] === m.key ? 1 : 0);
    const chip = acts > 0 ? `<span class="cab-actions-left">${acts} Action${acts === 1 ? '' : 's'} Remaining</span>` : '';
    const body = act
      ? `<div class="cab-actions">${act.actions.map(a => `
          <div class="cab-action">
            <div class="cab-action-info">
              <div class="cab-action-name">${escapeHtml(a.name)}</div>
              <div class="cab-action-desc">${escapeHtml(a.desc)}</div>
              ${a.meta ? `<div class="cab-action-meta">${escapeHtml(a.meta)}</div>` : ''}
            </div>
            <button type="button" class="cab-action-btn">${escapeHtml(a.btn)}</button>
          </div>`).join('')}</div>`
      : `<div class="min-empty">No actions available yet.</div>`;
    return `<section class="section" style="border-left:3px solid ${m.color}">
      <div class="min-head"><span class="min-name" style="color:${m.color}">${escapeHtml(m.name)}</span>${chip}</div>
      ${body}
    </section>`;
  }).join('');
}

// National Focus — the administration's posture (Domestic / Diplomatic /
// Military), persisted on the active administration and changed via
// set_national_focus (20270916): HoG-only, 12-tick cooldown, and a
// Military posture costs the ruling party 2 approval.
const FOCUS_OPTIONS = [
  { key: 'domestic',   name: 'Domestic Focus',   desc: 'The administration is focusing on matters at home.' },
  { key: 'diplomatic', name: 'Diplomatic Focus', desc: 'The administration has a focus on foreign policy abroad.',
    perk: 'Foreign Affairs and Trade get +1 Action per turn.', effect: '−1% Party Approval' },
  { key: 'military',   name: 'Military Focus',    desc: 'The administration has turned its eyes to its military industrial complex.',
    perk: 'Ministry of Defense gets +1 Action per turn.', effect: '−3% Party Approval' },
];
let nationalFocus = 'domestic';

// Read the live focus off the active administration. It drives both the
// focus box and the ministries' action counts, so init resolves it first.
async function fetchNationalFocus(nationId) {
  try {
    const { data: adm, error } = await _supabase.from('administrations')
      .select('national_focus')
      .eq('nation_id', nationId).is('ended_at_tick', null)
      .order('started_at_tick', { ascending: false }).limit(1).maybeSingle();
    if (error) throw error;
    return adm?.national_focus || 'domestic';
  } catch (e) {
    console.warn('cabinet-office: focus fetch failed', e?.message || e);
    return 'domestic';
  }
}

// Only the Head of Government (isPM) gets enabled buttons; the current
// focus's button is greyed for everyone. The button calls the HoG-gated
// set_national_focus RPC (it re-checks everything server-side).
function paintFocus(nation, isPM) {
  const host = document.getElementById('focus-grid');
  if (!host) return;
  host.innerHTML = FOCUS_OPTIONS.map(o => {
    const sel = o.key === nationalFocus;
    const disabled = sel || !isPM;
    const title = !isPM ? 'Only the Head of Government can change focus'
                : sel ? 'This is the current focus' : '';
    return `<div class="focus-card${sel ? ' sel' : ''}">
      <div class="focus-circle"></div>
      <div class="focus-name">${escapeHtml(o.name)}</div>
      <div class="focus-desc">${escapeHtml(o.desc)}</div>
      ${o.perk ? `<div class="focus-perk">${escapeHtml(o.perk)}</div>` : ''}
      ${o.effect ? `<div class="focus-effect">${escapeHtml(o.effect)}</div>` : ''}
      <button type="button" class="focus-btn" data-focus="${escapeHtml(o.key)}"${disabled ? ' disabled' : ''}${title ? ` title="${escapeHtml(title)}"` : ''}>Change Focus</button>
    </div>`;
  }).join('');
  host.querySelectorAll('.focus-btn:not([disabled])').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Are you sure? Changing Focus comes with a 12 tick cooldown.')) return;
      btn.disabled = true;
      try {
        const { data, error } = await _supabase.rpc('set_national_focus',
          { p_nation_id: nation.id, p_focus: btn.dataset.focus });
        if (error) throw error;
        if (!data?.success) {
          const REASON = {
            not_head_of_government: 'Only the Head of Government can change focus.',
            on_cooldown: 'Focus was changed recently — it is on a 12-tick cooldown.',
            already_focused: 'That is already the national focus.',
            no_administration: 'No sitting administration to set a focus for.',
          };
          throw new Error(REASON[data?.reason] || data?.reason || 'unknown');
        }
        window.location.reload();
      } catch (e) {
        alert('Could not change focus: ' + (e?.message || e));
        paintFocus(nation, isPM);
      }
    });
  });
}

// State of the Nation — compact 4-across modifier cards. Same data the
// politician-modifiers page reads; this view drops description / effects
// so a glance over the cabinet covers every active condition.
async function renderModifiers(nationId) {
  const host = document.getElementById('ston-grid');
  try {
    const { data, error } = await _supabase.from('active_modifiers')
      .select('modifier_templates ( name, category, severity, description )')
      .eq('nation_id', nationId);
    if (error) throw error;
    const mods = (data || [])
      .map(r => r.modifier_templates)
      .filter(Boolean)
      .sort((a,b) => (a.category||'').localeCompare(b.category||'') || (a.name||'').localeCompare(b.name||''));
    if (!mods.length) {
      host.innerHTML = '<div class="empty">No active modifiers.</div>';
      return;
    }
    host.innerHTML = mods.map(m => {
      const sev = m.severity || 'green';
      const lab = SEVERITY_LABELS[sev] || sev;
      const desc = (m.description || '').trim();
      // The party-approval stakes of the modifier's lifecycle: losing a
      // positive one costs approval, clearing a negative one earns it.
      const stakes = sev === 'green' ? '−3% Party Approval if lost'
                   : sev === 'red'   ? '+2% Party Approval if removed'
                   : '';
      return `<div class="ston-card sev-${escapeHtml(sev)}">
        <div class="ston-name">${escapeHtml(m.name || 'Modifier')}</div>
        <div class="ston-cat">${escapeHtml(m.category || '—')}</div>
        ${desc ? `<div class="ston-desc">${escapeHtml(desc)}</div>` : ''}
        ${stakes ? `<div class="ston-stakes">${escapeHtml(stakes)}</div>` : ''}
        <span class="ston-sev sev-${escapeHtml(sev)}">${escapeHtml(lab)}</span>
      </div>`;
    }).join('');
  } catch (err) {
    console.error('cabinet-office: modifiers fetch failed', err);
    host.innerHTML = '<div class="empty">Could not load modifiers.</div>';
  }
}

// Domestic Economy — six commodity cards. Same query the economy page
// runs (nation_commodity_state, 20270692). Missing rows fall through to
// zeroed display so an unseeded shard still renders cleanly.
async function renderCommodities(nationId) {
  const host = document.getElementById('comm-grid');
  const map  = new Map();
  try {
    const { data, error } = await _supabase.from('nation_commodity_state')
      .select('commodity_key, on_hand, production_per_tick')
      .eq('nation_id', nationId);
    if (error) throw error;
    for (const r of (data || [])) map.set(r.commodity_key, r);
  } catch (err) {
    console.warn('cabinet-office: nation_commodity_state fetch failed (defaulting to 0)', err);
  }

  host.innerHTML = COMMODITIES.map(c => {
    const s       = map.get(c.key);
    const onHand  = s ? String(Number(s.on_hand) || 0) : '0';
    // production_per_tick is NULL by CHECK for consumer_goods / services /
    // diplomacy — render the row only when a number is present.
    const prod    = s ? s.production_per_tick : null;
    const prodRow = (prod == null)
      ? ''
      : `<div class="comm-row"><span class="comm-lab">Production</span><span class="comm-val">${Number(prod).toFixed(1)}</span></div>`;
    return `<div class="comm-card ${c.key}">
      <div class="comm-name">${escapeHtml(c.name)}</div>
      <div class="comm-row"><span class="comm-lab">On Hand</span><span class="comm-val">${onHand}</span></div>
      ${prodRow}
    </div>`;
  }).join('');
}

init();
</script>
