<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up — Nationhood: Rise and Fall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Unicase:wght@600&family=Gentium+Book+Plus:wght@400;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --lapis:#17386B; --lapis-deep:#0E2449;
  --papyrus:#DFD0AC; --papyrus-lift:#E9DCBD; --papyrus-sink:#CDBC95;
  --gold:#C9962F; --gold-bright:#EBC163;
  --ochre:#A8452C; --malachite:#3F7F6E; --clay:#8B5E3C;
  --ink:#2A2119; --ink-soft:#5E5040; --ink-faint:#857459;
  --on-lapis-dim:#93A9C9;
  --incise:"Cormorant Unicase",Georgia,serif;
  --read:"Gentium Book Plus",Georgia,serif;
  --meta:"Spline Sans Mono",ui-monospace,monospace;
  --hair:1px;
}
*,*::before,*::after{ box-sizing:border-box; }
body{
  margin:0; min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column;
  font-family:var(--read); font-size:17px; line-height:1.6;
  color:#DCE4F0; background-color:var(--lapis);
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,.20) 0 1px, transparent 1px 38px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.13) 0 1px, transparent 1px 76px);
  -webkit-font-smoothing:antialiased;
}
a:focus-visible,button:focus-visible,input:focus-visible{ outline:2px solid var(--gold-bright); outline-offset:2px; }

/* bar */
.bar{ background:var(--lapis-deep); border-bottom:2px solid var(--gold); }
.bar__in{
  width:min(100% - 32px,1000px); margin-inline:auto;
  display:flex; align-items:center; gap:20px; padding:13px 0;
}
.mark{ font-family:var(--incise); font-size:21px; letter-spacing:.13em;
       color:var(--papyrus-lift); text-decoration:none; margin-right:auto; }
.bar__alt{ font-family:var(--meta); font-size:11px; letter-spacing:.13em;
           color:var(--on-lapis-dim); text-decoration:none; }
.bar__alt b{ color:var(--gold); font-weight:400; }
.bar__alt:hover b{ color:var(--gold-bright); }

/* card */
.stage{ flex:1; display:flex; align-items:center; justify-content:center; padding:36px 16px 46px; }
.card{
  width:min(100%,470px);
  background:var(--papyrus); color:var(--ink);
  border:var(--hair) solid var(--papyrus-sink);
  box-shadow:0 20px 46px rgba(0,0,0,.42);
  padding:34px clamp(20px,5vw,38px) 32px;
}
.card h1{
  font-family:var(--incise); font-weight:600; font-size:32px;
  letter-spacing:.04em; margin:0 0 6px; color:var(--ink);
}
.card__sub{ margin:0 0 28px; font-size:16px; color:var(--ink-soft); }

/* fields */
.field{ margin-bottom:20px; }
.field__top{ display:flex; align-items:baseline; gap:10px; margin-bottom:6px; }
label{ font-family:var(--meta); font-size:11px; letter-spacing:.11em;
       text-transform:uppercase; color:var(--ink-soft); }
.state{ margin-left:auto; font-family:var(--meta); font-size:10.5px; white-space:nowrap; }
.state.ok{ color:var(--malachite); }
.state.no{ color:var(--ochre); }
.state.busy{ color:var(--ink-faint); }

.row{ display:flex; gap:8px; }
input{
  flex:1 1 auto; min-width:0;
  font-family:var(--meta); font-size:15.5px; color:var(--ink);
  background:rgba(255,255,255,.34);
  border:var(--hair) solid rgba(42,33,25,.32);
  padding:12px 13px;
}
input:focus{ outline:none; border-color:var(--gold); background:rgba(255,255,255,.55); }
input::placeholder{ color:rgba(133,116,89,.8); }

.peek{
  flex:0 0 auto; cursor:pointer; background:transparent; color:var(--clay);
  border:var(--hair) solid rgba(42,33,25,.32);
  font-family:var(--meta); font-size:10px; letter-spacing:.11em;
  text-transform:uppercase; padding:0 13px;
}
.peek:hover{ background:rgba(139,94,60,.13); color:var(--ochre); border-color:var(--ochre); }

.help{ font-family:var(--meta); font-size:10.5px; color:var(--ink-faint); margin:7px 0 0; }

.strength{ display:flex; gap:4px; margin-top:8px; }
.strength span{ flex:1; height:4px; background:rgba(42,33,25,.16); transition:background-color .25s; }

/* submit */
.go{
  display:inline-block; width:100%; margin-top:8px; cursor:pointer;
  font-family:var(--meta); font-size:12.5px; letter-spacing:.18em; text-transform:uppercase;
  text-align:center; text-decoration:none; box-sizing:border-box;
  padding:15px 18px;
  background:var(--clay); color:var(--papyrus-lift); border:var(--hair) solid var(--clay);
  transition:background-color .2s,border-color .2s,opacity .2s;
}
.go:hover:not(:disabled){ background:var(--ochre); border-color:var(--ochre); }
.go:disabled{ opacity:.42; cursor:not-allowed; background:transparent; color:var(--ink-faint); }
.need{ font-family:var(--meta); font-size:10.5px; color:var(--ink-faint);
       text-align:center; margin:11px 0 0; min-height:1.4em; }
.need.err{ color:var(--ochre); }
.next{ text-align:center; font-size:15px; color:var(--ink-soft); margin:16px 0 0; }
.terms{ text-align:center; font-family:var(--meta); font-size:10px;
        color:var(--ink-faint); margin:14px 0 0; line-height:1.7; }
.terms a{ color:var(--clay); }

/* success */
.success__msg{ font-size:16px; color:var(--ink-soft); margin:0 0 22px; text-align:center; }
.success__msg b{ color:var(--ink); font-weight:700; }

/* foot */
.foot{ border-top:2px solid var(--gold); background:var(--lapis-deep);
       padding:18px 0 22px; text-align:center; }
.foot a{ font-family:var(--meta); font-size:11px; letter-spacing:.13em;
         color:var(--on-lapis-dim); text-decoration:none; margin:0 12px; }
.foot a:hover{ color:var(--gold-bright); }

@media (max-width:520px){ .card{ padding:26px 18px 28px; } .card h1{ font-size:28px; } }
@media (prefers-reduced-motion:reduce){ *{ transition:none!important; } }
</style>
</head>
<body>

<header class="bar">
  <div class="bar__in">
    <a class="mark" href="/">NATIONHOOD</a>
    <a class="bar__alt" href="/login">Already have an account? <b>Log in</b></a>
  </div>
</header>

<div class="stage">
<main class="card">

  <h1>Sign up</h1>
  <p class="card__sub">Free to play. No download.</p>

  <form id="joinForm" novalidate>

    <div class="field">
      <div class="field__top">
        <label for="user">Username</label>
        <span class="state" id="userState"></span>
      </div>
      <div class="row">
        <input id="user" type="text" maxlength="18" autocomplete="username"
               spellcheck="false" placeholder="Shown publicly">
      </div>
      <p class="help">3–18 characters · letters, numbers and hyphens</p>
    </div>

    <div class="field">
      <div class="field__top">
        <label for="mail">Email</label>
        <span class="state" id="mailState"></span>
      </div>
      <div class="row">
        <input id="mail" type="email" autocomplete="email" spellcheck="false"
               placeholder="you@example.com">
      </div>
    </div>

    <div class="field">
      <div class="field__top">
        <label for="pass">Password</label>
        <span class="state" id="passState"></span>
      </div>
      <div class="row">
        <input id="pass" type="password" autocomplete="new-password" placeholder="At least 8 characters">
        <button type="button" class="peek" id="peek" aria-pressed="false">Show</button>
      </div>
      <div class="strength" id="strength" role="img" aria-label="Password strength">
        <span></span><span></span><span></span><span></span>
      </div>
    </div>

    <button class="go" id="goBtn" type="submit" disabled>Sign up</button>
    <p class="need" id="need"></p>
    <p class="next">You'll create your first civilization next.</p>
    <p class="terms">By signing up you accept the <a href="#">terms</a> and <a href="#">privacy notice</a>.</p>

  </form>

  <div class="success" id="success" hidden>
    <p class="success__msg" id="successMsg"></p>
    <a class="go" id="successCta" href="/">Continue</a>
  </div>
</main>
</div>

<footer class="foot">
  <a href="/">Home</a><a href="/about">About</a><a href="#">Wiki</a><a href="/login">Log in</a>
</footer>

<script type="module">
import { supabase } from '/supabase.js';
import { routeAfterAuth } from '/post-auth.js';
import { setStatusText, wirePasswordPeek } from '/ui-helpers.js';

(function(){
  var user = document.getElementById("user");
  var mail = document.getElementById("mail");
  var pass = document.getElementById("pass");
  var userState = document.getElementById("userState");
  var mailState = document.getElementById("mailState");
  var passState = document.getElementById("passState");
  var bars = document.getElementById("strength").children;
  var btn  = document.getElementById("goBtn");
  var need = document.getElementById("need");
  var form = document.getElementById("joinForm");
  var successPanel = document.getElementById("success");
  var successMsg = document.getElementById("successMsg");
  var successCta = document.getElementById("successCta");

  var userOK = false, userCheckTimer = null, submitting = false;

  function setState(el, text, cls){ setStatusText(el, "state", text, cls); }
  function setNeed(text, isError){ setStatusText(need, "need", text, isError ? "err" : ""); }

  function checkUser(){
    var v = user.value.trim();
    userOK = false;
    if(!v){ setState(userState,""); return refresh(); }
    if(v.length < 3){ setState(userState,"Too short","no"); return refresh(); }
    if(!/^[A-Za-z0-9-]+$/.test(v)){ setState(userState,"Letters, numbers, hyphens","no"); return refresh(); }

    setState(userState,"Checking…","busy");
    refresh();
    clearTimeout(userCheckTimer);
    userCheckTimer = setTimeout(function(){
      supabase.from("rf_profiles").select("id").ilike("username", v).limit(1)
        .then(function(res){
          if(res.error) throw res.error;
          /* the field may have changed again while this was in flight —
             don't let a slow, stale response overwrite a newer check */
          if(user.value.trim() !== v) return;
          if(res.data && res.data.length){
            setState(userState,"Already taken","no"); userOK = false;
          } else {
            setState(userState,"Available","ok"); userOK = true;
          }
          refresh();
        })
        .catch(function(){
          /* a rejected promise (network failure, etc.) previously left the
             field stuck showing "Checking..." forever with no way forward */
          if(user.value.trim() !== v) return;
          setState(userState,"Couldn't check right now","no"); userOK = false;
          refresh();
        });
    }, 420);
  }

  function mailOK(){
    var v = mail.value.trim();
    if(!v){ setState(mailState,""); return false; }
    var ok = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
    setState(mailState, ok ? "Looks good" : "Not a valid address", ok ? "ok" : "no");
    return ok;
  }

  function score(v){
    var s = 0;
    if(v.length >= 8)  s++;
    if(v.length >= 12) s++;
    if(/[A-Z]/.test(v) && /[a-z]/.test(v)) s++;
    if(/[0-9]/.test(v) || /[^A-Za-z0-9]/.test(v)) s++;
    return Math.min(s,4);
  }

  function passOK(){
    var v = pass.value;
    for(var i=0;i<4;i++){ bars[i].style.background = "rgba(42,33,25,.16)"; }
    if(!v){ setState(passState,""); return false; }
    var s = score(v);
    var tones = ["#A8452C","#8B5E3C","#C9962F","#3F7F6E"];
    var words = ["Weak","Fair","Strong","Very strong"];
    for(var j=0;j<s;j++){ bars[j].style.background = tones[s-1]; }
    if(v.length < 8){ setState(passState,"At least 8 characters","no"); return false; }
    setState(passState, words[s-1], s >= 3 ? "ok" : "");
    return true;
  }

  function refresh(){
    if(submitting) return;
    var m = mailOK(), p = passOK();
    var missing = [];
    if(!userOK) missing.push("username");
    if(!m) missing.push("email");
    if(!p) missing.push("password");
    btn.disabled = missing.length > 0;
    setNeed(missing.length ? "Still needed: " + missing.join(", ") : "", false);
  }

  user.addEventListener("input", checkUser);
  mail.addEventListener("input", refresh);
  pass.addEventListener("input", refresh);

  wirePasswordPeek(document.getElementById("peek"), pass);

  function friendlyError(err){
    var msg = (err && err.message) || "Something went wrong — try again.";
    if(/already registered|already exists/i.test(msg)) return "That email already has an account.";
    /* the username availability check and the actual account creation are two
       separate round trips — someone else can take the name in between. The
       DB's unique index is the real guard; this just explains the failure
       instead of surfacing a raw trigger/constraint error. */
    if(/duplicate key|unique constraint|database error saving new user/i.test(msg))
      return "That username was just taken — go back and pick another.";
    return msg;
  }

  /* Builds "<before><b>boldText</b><after>" without innerHTML, since
     username/email are user-supplied. Shared by both signUp() outcomes below
     instead of duplicating the same three DOM calls in each branch. */
  function setSuccessMessage(before, boldText, after){
    successMsg.textContent = "";
    successMsg.appendChild(document.createTextNode(before));
    var b = document.createElement("b");
    b.textContent = boldText;
    successMsg.appendChild(b);
    successMsg.appendChild(document.createTextNode(after));
  }

  form.addEventListener("submit", function(e){
    e.preventDefault();
    if(btn.disabled || submitting) return;

    submitting = true;
    btn.disabled = true;
    user.disabled = true; mail.disabled = true; pass.disabled = true;
    var prevLabel = btn.textContent;
    btn.textContent = "Creating your account…";
    setNeed("", false);

    var username = user.value.trim();
    var email = mail.value.trim();

    supabase.auth.signUp({
      email: email,
      password: pass.value,
      options: {
        data: { username: username },
        emailRedirectTo: window.location.origin + "/"
      }
    }).then(function(res){
      if(res.error) throw res.error;

      form.hidden = true;
      successPanel.hidden = false;
      if(res.data && res.data.session){
        setSuccessMessage("Account created. Welcome, ", username, ".");
        /* a brand new account has no civilization yet, so this resolves to
           /found — same routing decision /login makes after signing in,
           made in exactly one place rather than guessed at here too */
        routeAfterAuth().then(function(route){ successCta.href = route.dest; })
          .catch(function(){ successCta.href = "/"; });
      } else {
        setSuccessMessage("Almost there — we sent a confirmation link to ", email, ". Click it, then come back and log in.");
        successCta.href = "/login";
      }
    }).catch(function(err){
      setNeed(friendlyError(err), true);
    }).finally(function(){
      submitting = false;
      btn.disabled = false;
      user.disabled = false; mail.disabled = false; pass.disabled = false;
      btn.textContent = prevLabel;
    });
  });

  refresh();
})();
</script>
</body>
</html>
