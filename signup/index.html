<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up · Nationhood Game</title>
<link rel="stylesheet" href="/site.css">
<style>
  body {
    margin: 0; min-height: 100vh; background: #fff; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .card { width: 100%; max-width: 380px; }
  .brand { text-align: center; margin-bottom: 28px; }
  h1 {
    font-size: 26px; letter-spacing: -0.03em; font-weight: 800;
    margin: 0 0 24px; text-align: center;
  }
  label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 6px; }
  .field { margin-bottom: 16px; }
  input {
    width: 100%; font-size: 15px; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink);
    outline: none; transition: border-color .15s ease;
  }
  input:focus { border-color: #b9b9b9; }
  .actions { display: flex; gap: 10px; margin-top: 22px; }
  .actions .btn { flex: 1; padding: 12px 16px; font-size: 15px; }
  .msg { margin-top: 16px; font-size: 14px; text-align: center; min-height: 20px; }
  .msg.error { color: var(--err); }
  .msg.ok { color: var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Nationhood</div>
    <h1>Sign Up</h1>
    <form id="signup-form" novalidate>
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>
      </div>
      <div class="actions">
        <a class="btn btn-ghost" href="/" role="button">Go Back</a>
        <button class="btn btn-solid" type="submit" id="submit-btn">Sign Up</button>
      </div>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </form>
  </div>

  <script type="module">
    import { supabase, isConfigured } from '/supabase.js';

    const form = document.getElementById('signup-form');
    const btn = document.getElementById('submit-btn');
    const msg = document.getElementById('msg');

    function setMsg(text, kind) {
      msg.textContent = text;
      msg.className = 'msg' + (kind ? ' ' + kind : '');
    }

    let submitting = false; // loading lock: blocks double-fire

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (submitting) return;

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        setMsg('Please enter an e-mail and password.', 'error');
        return;
      }
      if (!isConfigured) {
        setMsg('Sign up is not connected yet (Supabase keys missing).', 'error');
        return;
      }

      submitting = true;
      btn.disabled = true;
      setMsg('Creating your account…', 'ok');

      try {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) {
          setMsg(error.message, 'error');
          submitting = false;
          btn.disabled = false;
          return;
        }
        // If email confirmation is disabled in Supabase, a session is returned
        // immediately and we can go straight to the home page.
        if (data.session) {
          window.location.href = '/home/';
          return;
        }
        // Otherwise the account exists but must confirm via email first.
        setMsg('Account created. Check your e-mail to confirm, then log in.', 'ok');
        submitting = false;
        btn.disabled = false;
      } catch (err) {
        setMsg('Something went wrong. Please try again.', 'error');
        submitting = false;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
