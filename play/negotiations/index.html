<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/theme.js"></script>
<title>Negotiations · Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/play.css">
<style>
  /* Negotiations — diplomatic chat channels between two nations (chat only; agreements are a later phase).
     Backed by diplo_channels / diplo_messages (schema/265). Theme-aware via the app's tokens. */
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .main{flex:1;padding:24px clamp(16px,4vw,56px) 56px;min-width:0}

  .eye{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--indigo)}
  .phead h1{font-weight:900;font-size:clamp(24px,3.6vw,32px);letter-spacing:-.03em;margin-top:4px}
  .phead p{color:var(--muted);font-size:14px;margin-top:6px;max-width:640px}
  .micro{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--soft)}

  /* The opener — begin a negotiation (1 Diplomacy). */
  .opener{display:inline-flex;align-items:center;gap:8px;margin:18px 0 6px;font-family:'Space Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--green);background:var(--green-soft);border:1px solid color-mix(in srgb,var(--green) 30%,transparent);border-radius:10px;padding:11px 16px;cursor:pointer}
  .opener:hover{filter:brightness(.98)}
  .opener[disabled]{opacity:.55;cursor:not-allowed;filter:none}
  .pickrow{display:flex;gap:8px;align-items:center;margin:6px 0 14px;flex-wrap:wrap}
  .picksel{background:var(--field);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 11px;font-size:12.5px;font-family:'Archivo',sans-serif;min-width:200px}
  .pickgo{background:var(--indigo);border:none;color:#fff;border-radius:9px;padding:9px 15px;font-family:'Space Mono',monospace;font-weight:700;font-size:10.5px;letter-spacing:.05em;cursor:pointer}
  .pickcancel{background:none;border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:9px 13px;font-family:'Space Mono',monospace;font-size:10.5px;cursor:pointer}

  /* Channel list */
  .clist{display:flex;flex-direction:column;gap:9px;margin-top:10px}
  .chrow{display:flex;align-items:center;gap:13px;padding:13px 16px;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:left;font:inherit;color:inherit;width:100%}
  .chrow:hover{border-color:var(--line2)}
  .chrow__body{flex:1;min-width:0}
  .chrow__body b{font-weight:700;font-size:14px}
  .chrow__sub{font-family:'Space Mono',monospace;font-size:9px;color:var(--soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.08em;border-radius:6px;padding:3px 10px;white-space:nowrap;flex:none}
  .chev{color:var(--soft);flex:none}
  .flag{border-radius:2px;flex:none;box-shadow:0 0 0 1px var(--line);object-fit:cover}

  /* Detail */
  .back{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:14px;cursor:pointer;display:inline-block}
  .back:hover{color:var(--ink)}
  .dhead{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .dhead__t{flex:1;min-width:0}
  .dhead__t b{font-weight:800;font-size:21px;letter-spacing:-.02em}
  .closebtn{font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.05em;color:var(--red);background:var(--red-soft);border:1px solid color-mix(in srgb,var(--red) 28%,transparent);border-radius:8px;padding:7px 12px;cursor:pointer}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 17px;max-width:720px}

  /* Chat */
  .chat{display:flex;flex-direction:column}
  .chat__scroll{max-height:52vh;overflow-y:auto;padding-right:4px;margin-top:10px}
  .bubble{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-width:88%;margin-bottom:9px}
  .bubble.you{background:var(--indigo-soft);border-color:color-mix(in srgb,var(--indigo) 28%,transparent);margin-left:auto}
  .bubble__who{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.08em;margin-bottom:3px}
  .bubble__who .meta{color:var(--soft)}
  .bubble__t{font-size:12.5px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
  .empty-chat{font-family:'Space Mono',monospace;font-size:10px;color:var(--soft);text-align:center;padding:34px 0;letter-spacing:.08em}

  .composer{margin-top:10px}
  .composer__row{display:flex;gap:8px;margin-top:5px}
  select.spk{background:var(--field);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 10px;font-size:10.5px;font-family:'Space Mono',monospace;font-weight:700;outline:none;max-width:250px}
  .composer input{flex:1;background:var(--field);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 13px;font-size:12.5px;font-family:'Archivo',sans-serif;outline:none;min-width:0}
  .composer input:focus,select.spk:focus{border-color:var(--indigo)}
  .composer input:disabled,select.spk:disabled{opacity:.55}
  .sendbtn{background:var(--indigo);border:none;color:#fff;border-radius:9px;padding:9px 16px;font-family:'Space Mono',monospace;font-weight:700;font-size:10.5px;letter-spacing:.05em;cursor:pointer;flex:none}
  .sendbtn:disabled{opacity:.5;cursor:not-allowed}
  .norole{font-size:12px;color:var(--muted);margin-top:10px}

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div id="sidenav"></div><!-- left rail / mobile bottom bar, injected by /sidenav.js -->

  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div id="content"><div class="micro" style="padding:40px 0;text-align:center">Loading the negotiating table…</div></div>
  </main>
</div>

<script type="module">
  import { supabase, isConfigured, requireUser } from '/supabase.js';
  import { esc } from '/util.js';
  import { mountTopbar, setTopbarActions } from '/topbar.js';
  import { mountSidenav } from '/sidenav.js';
  import { ideologyLabel } from '/archetypes.js';

  mountTopbar();
  mountSidenav();

  var content = document.getElementById('content');
  var NATION_ID = null, NATIONS = {}, ROLES = [];
  var STATE = { openId: null, roleIdx: 0, picking: false, busy: false };
  var CHANNELS = [], MSGS = [];

  function natName(id) { return (NATIONS[id] && NATIONS[id].name) || id; }
  function canOpen() { return ROLES.indexOf('Minister of Foreign Affairs') >= 0; }
  function otherNation(c) { return c.nation_a === NATION_ID ? c.nation_b : c.nation_a; }
  function fmtTime(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function natFlag(id, w, h) {
    var f = NATIONS[id] && NATIONS[id].flag;
    return f
      ? '<img class="flag" src="' + esc(f) + '" width="' + w + '" height="' + h + '" alt="">'
      : '<span class="flag" style="display:inline-block;width:' + w + 'px;height:' + h + 'px;background:var(--chip)"></span>';
  }
  function pill(text, color) {
    return '<span class="pill" style="color:' + color + ';border:1px solid color-mix(in srgb,' + color + ' 40%,transparent)">' + esc(text) + '</span>';
  }

  // ---- list view -----------------------------------------------------------
  function listView() {
    var openBtn = '<button class="opener" id="openerBtn"' + (canOpen() ? '' : ' disabled title="Only the Minister of Foreign Affairs can open a channel"') + '>🤝 Open Negotiations · 1 Diplomacy</button>';
    // Nations with no open channel yet, for the picker.
    var taken = {}; CHANNELS.forEach(function (c) { taken[otherNation(c)] = true; });
    var eligible = Object.keys(NATIONS).filter(function (id) { return id !== NATION_ID && !taken[id]; })
      .sort(function (a, b) { return natName(a).localeCompare(natName(b)); });
    var picker = STATE.picking
      ? '<div class="pickrow"><select class="picksel" id="pickSel">' +
          (eligible.length ? eligible.map(function (id) { return '<option value="' + esc(id) + '">' + esc(natName(id)) + '</option>'; }).join('')
                           : '<option value="">No nations left to open a channel with</option>') +
          '</select><button class="pickgo" id="pickGo"' + (eligible.length ? '' : ' disabled') + '>Open</button>' +
          '<button class="pickcancel" id="pickCancel">Cancel</button></div>'
      : '';
    var rows = CHANNELS.map(function (c) {
      var oid = otherNation(c);
      return '<button class="chrow" data-open="' + esc(c.id) + '">' +
          natFlag(oid, 26, 16) +
          '<span class="chrow__body"><b>Negotiations with ' + esc(natName(oid)) + '</b>' +
            '<div class="chrow__sub">' + (c.opened_by === NATION_ID ? 'You opened this channel' : natName(c.opened_by) + ' opened this channel') + '</div></span>' +
          pill('OPEN', 'var(--green)') + '<span class="chev">›</span>' +
        '</button>';
    }).join('');
    return '<div class="phead"><span class="eye">The Nation</span><h1>Negotiations</h1>' +
        '<p>The negotiating table — open a channel with a foreign power and talk. Your Head of Government, Minister of Trade, and Minister of Foreign Affairs may speak.</p></div>' +
      openBtn + picker +
      '<div class="micro">' + (CHANNELS.length ? 'Open channels — ' + CHANNELS.length : 'No open channels yet') + '</div>' +
      '<div class="clist">' + rows + '</div>';
  }

  // ---- detail view ---------------------------------------------------------
  function bubble(m) {
    var mine = m.sender_nation === NATION_ID;
    var sub = mine ? '' : ' · ' + esc(natName(m.sender_nation));
    return '<div class="bubble' + (mine ? ' you' : '') + '">' +
        '<div class="bubble__who" style="color:' + (mine ? 'var(--indigo)' : 'var(--muted)') + '">' + esc(m.role) +
          '<span class="meta">' + sub + ' · ' + esc(fmtTime(m.created_at)) + '</span></div>' +
        '<div class="bubble__t">' + esc(m.body) + '</div>' +
      '</div>';
  }
  function detailView(c) {
    var oid = otherNation(c);
    var chatHtml = MSGS.length ? MSGS.map(bubble).join('') : '<div class="empty-chat">No messages yet — say something.</div>';
    var composer;
    if (ROLES.length) {
      if (STATE.roleIdx >= ROLES.length) STATE.roleIdx = 0;
      composer = '<div class="composer"><div class="micro">Speak as</div><div class="composer__row">' +
          '<select class="spk" id="spk">' + ROLES.map(function (r, i) { return '<option value="' + i + '"' + (i === STATE.roleIdx ? ' selected' : '') + '>' + esc(r) + '</option>'; }).join('') + '</select>' +
          '<input id="msg" maxlength="1000" placeholder="Message ' + esc(natName(oid)) + '…">' +
          '<button class="sendbtn" id="sendBtn">SEND</button></div></div>';
    } else {
      composer = '<div class="norole">You hold no office that may speak here — only the Head of Government, Minister of Trade, or Minister of Foreign Affairs can post.</div>';
    }
    var closeBtn = canOpen() ? '<button class="closebtn" id="closeBtn">Close channel</button>' : '';
    return '<span class="back" data-back>‹ Negotiations</span>' +
      '<div class="dhead">' + natFlag(oid, 34, 22) +
        '<div class="dhead__t"><b>Negotiations with ' + esc(natName(oid)) + '</b>' +
          '<div class="micro" style="margin-top:3px">' + (c.opened_by === NATION_ID ? 'You opened this channel' : natName(c.opened_by) + ' opened this channel') + '</div></div>' +
        pill('OPEN', 'var(--green)') + closeBtn +
      '</div>' +
      '<div class="card chat"><div class="micro">The channel</div>' +
        '<div class="chat__scroll" id="scroll">' + chatHtml + '</div>' + composer + '</div>';
  }

  // ---- data ----------------------------------------------------------------
  async function loadChannels() {
    try {
      var res = await supabase.from('diplo_channels').select('id, nation_a, nation_b, opened_by, status')
        .or('nation_a.eq.' + NATION_ID + ',nation_b.eq.' + NATION_ID).eq('status', 'open');
      CHANNELS = res.data || [];
    } catch (e) { CHANNELS = []; }
  }
  async function loadMessages(channelId) {
    try {
      var res = await supabase.from('diplo_messages').select('sender_nation, role, body, created_at')
        .eq('channel_id', channelId).order('created_at', { ascending: true });
      MSGS = res.data || [];
    } catch (e) { MSGS = []; }
  }

  // ---- render + wiring -----------------------------------------------------
  function render() {
    var c = CHANNELS.find(function (x) { return x.id === STATE.openId; });
    content.innerHTML = c ? detailView(c) : listView();
    if (c) wireDetail(c); else wireList();
    var sc = document.getElementById('scroll'); if (sc) sc.scrollTop = sc.scrollHeight;
  }
  function wireList() {
    var ob = document.getElementById('openerBtn');
    if (ob) ob.onclick = function () { if (!canOpen()) return; STATE.picking = !STATE.picking; render(); };
    var go = document.getElementById('pickGo');
    if (go) go.onclick = function () { var sel = document.getElementById('pickSel'); if (sel && sel.value) openChannel(sel.value); };
    var cx = document.getElementById('pickCancel');
    if (cx) cx.onclick = function () { STATE.picking = false; render(); };
    content.querySelectorAll('[data-open]').forEach(function (el) {
      el.onclick = function () { openDetail(el.getAttribute('data-open')); };
    });
  }
  function wireDetail(c) {
    var back = content.querySelector('[data-back]');
    if (back) back.onclick = function () { STATE.openId = null; MSGS = []; render(); };
    var spk = document.getElementById('spk');
    if (spk) spk.onchange = function (e) { STATE.roleIdx = +e.target.value; };
    var send = document.getElementById('sendBtn');
    if (send) send.onclick = function () { sendMessage(c); };
    var input = document.getElementById('msg');
    if (input) input.onkeydown = function (e) { if (e.key === 'Enter') sendMessage(c); };
    var close = document.getElementById('closeBtn');
    if (close) close.onclick = function () { closeChannel(c); };
  }

  async function openChannel(target) {
    if (STATE.busy) return; STATE.busy = true;
    try {
      var res = await supabase.rpc('open_diplo_channel', { p_target: target });
      if (res.error) { alert(res.error.message || 'Could not open the channel.'); return; }
      STATE.picking = false;
      await loadChannels();
      openDetail((res.data && res.data.id) || null);
    } catch (e) { alert('Could not open the channel. Try again.'); }
    finally { STATE.busy = false; }
  }
  async function openDetail(id) {
    if (!id) { render(); return; }
    STATE.openId = id; STATE.roleIdx = 0;
    await loadMessages(id);
    render();
  }
  async function sendMessage(c) {
    if (STATE.busy) return;
    var input = document.getElementById('msg'); var send = document.getElementById('sendBtn');
    var body = input ? input.value.trim() : ''; if (!body) return;
    var role = ROLES[STATE.roleIdx]; if (!role) return;
    STATE.busy = true; if (send) send.disabled = true;
    try {
      var res = await supabase.rpc('post_diplo_message', { p_channel: c.id, p_role: role, p_body: body });
      if (res.error) { alert(res.error.message || 'Could not send.'); if (send) send.disabled = false; return; }
      await loadMessages(c.id);
      render();
    } catch (e) { alert('Could not send. Try again.'); if (send) send.disabled = false; }
    finally { STATE.busy = false; }
  }
  async function closeChannel(c) {
    if (STATE.busy) return;
    if (!confirm('Close this negotiation channel? It can be reopened later for 1 Diplomacy.')) return;
    STATE.busy = true;
    try {
      var res = await supabase.rpc('close_diplo_channel', { p_id: c.id });
      if (res.error) { alert(res.error.message || 'Could not close the channel.'); return; }
      STATE.openId = null; MSGS = [];
      await loadChannels();
      render();
    } catch (e) { alert('Could not close the channel. Try again.'); }
    finally { STATE.busy = false; }
  }

  (async () => {
    if (!isConfigured) { content.innerHTML = '<div class="micro" style="padding:40px 0;text-align:center">Supabase isn’t configured.</div>'; return; }
    const user = await requireUser();
    if (!user) return; // redirected to login
    try {
      const { data: party } = await supabase.from('parties').select('name, archetype, nation_id, influence').eq('user_id', user.id).single();
      if (!party) { window.location.replace('/nation-select/'); return; }
      NATION_ID = party.nation_id;
      const { data: nats } = await supabase.from('nations').select('id, name, flag');
      (nats || []).forEach(function (n) { NATIONS[n.id] = { name: n.name, flag: n.flag }; });
      const me = NATIONS[NATION_ID] || {};
      document.getElementById('pname').textContent = party.name;
      document.getElementById('psub').textContent = ideologyLabel(party) + ' · ' + (me.name || NATION_ID);
      if (me.flag) { var f = document.getElementById('flag'); f.onload = function () { f.hidden = false; }; f.src = me.flag; }
      setTopbarActions(party.influence);
      try { const r = await supabase.rpc('my_diplo_roles'); ROLES = (r && r.data) || []; } catch (e) { ROLES = []; }
      await loadChannels();
    } catch (e) { content.innerHTML = '<div class="micro" style="padding:40px 0;text-align:center">Couldn’t load negotiations. Refresh to try again.</div>'; return; }
    render();
  })();
</script>
</body>
</html>
