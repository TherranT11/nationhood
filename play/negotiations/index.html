<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/theme.js"></script>
<title>Negotiations · Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/play.css">
<style>
  /* ⚠ STATIC UI SCAFFOLD — first slice of the Negotiations tab.
     Faithful port of the diplomacy-negotiations mockup into the app's design tokens
     (theme-aware light/dark). The channels/chat/terms below are SAMPLE data that
     demonstrate the layout; there is no diplomacy backend yet. The real inter-nation
     negotiation system (tables + RPCs for terms, signing, resource transfers, and
     cross-nation chat) is a separate follow-up slice. NOTE: the existing `negotiations`
     table in the schema is COALITION formation between parties — a different domain from
     this page; do not conflate the two when the backend is wired. */
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .main{flex:1;padding:24px clamp(16px,4vw,56px) 56px;min-width:0}

  .eye{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--indigo)}
  .phead h1{font-weight:900;font-size:clamp(24px,3.6vw,32px);letter-spacing:-.03em;margin-top:4px}
  .phead p{color:var(--muted);font-size:14px;margin-top:6px;max-width:640px}

  .micro{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--soft)}

  /* The opener — begin a new negotiation (1 Diplomacy). Disabled in this scaffold. */
  .opener{display:inline-flex;align-items:center;gap:8px;margin:18px 0;font-family:'Space Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--green);background:var(--green-soft);border:1px solid color-mix(in srgb,var(--green) 30%,transparent);border-radius:10px;padding:11px 16px;cursor:pointer}
  .opener:hover{filter:brightness(.98)}
  .opener[disabled]{opacity:.55;cursor:not-allowed}

  /* Channel list */
  .clist{display:flex;flex-direction:column;gap:9px;margin-top:10px}
  .chrow{display:flex;align-items:center;gap:13px;padding:13px 16px;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:left;font:inherit;color:inherit;width:100%}
  .chrow:hover{border-color:var(--line2)}
  .chrow.stalled{opacity:.72}
  .chrow__body{flex:1;min-width:0}
  .chrow__body b{font-weight:700;font-size:14px}
  .chrow__sub{font-family:'Space Mono',monospace;font-size:9px;color:var(--soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.08em;border-radius:6px;padding:3px 10px;white-space:nowrap;flex:none}
  .dur{font-family:'Space Mono',monospace;font-size:9.5px;color:var(--muted);width:92px;text-align:right;flex:none}
  .chev{color:var(--soft);flex:none}
  .flag{border-radius:2px;flex:none;box-shadow:0 0 0 1px var(--line)}

  /* Detail */
  .back{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:14px;cursor:pointer;display:inline-block}
  .back:hover{color:var(--ink)}
  .dhead{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .dhead__t{flex:1;min-width:0}
  .dhead__t b{font-weight:800;font-size:21px;letter-spacing:-.02em}
  .cols{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 17px}

  /* Chat */
  .chat{flex:1.2 1 400px;min-width:0;display:flex;flex-direction:column}
  .chat__scroll{flex:1;max-height:340px;overflow-y:auto;padding-right:4px;margin-top:10px}
  .bubble{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-width:88%;margin-bottom:9px}
  .bubble.you{background:var(--indigo-soft);border-color:color-mix(in srgb,var(--indigo) 28%,transparent);margin-left:auto}
  .bubble__who{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.08em;margin-bottom:3px}
  .bubble__who .meta{color:var(--soft)}
  .bubble__t{font-size:12.5px;line-height:1.45}
  .empty-chat{font-family:'Space Mono',monospace;font-size:10px;color:var(--soft);text-align:center;padding:34px 0;letter-spacing:.08em}

  .composer{margin-top:10px}
  .composer__row{display:flex;gap:8px;margin-top:5px}
  select.spk{background:var(--field);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 10px;font-size:10.5px;font-family:'Space Mono',monospace;font-weight:700;outline:none;max-width:230px}
  .composer input{flex:1;background:var(--field);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 13px;font-size:12.5px;font-family:'Archivo',sans-serif;outline:none;min-width:0}
  .composer input:focus,select.spk:focus{border-color:var(--indigo)}
  .sendbtn{background:var(--indigo);border:none;color:#fff;border-radius:9px;padding:9px 16px;font-family:'Space Mono',monospace;font-weight:700;font-size:10.5px;letter-spacing:.05em;cursor:pointer;flex:none}

  /* Draft agreement */
  .terms{flex:1 1 360px;min-width:0}
  .terms__hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;gap:10px}
  .tbtn{font-family:'Space Mono',monospace;font-size:8.5px;font-weight:700;letter-spacing:.05em;border-radius:6px;padding:4px 9px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
  .term{border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-bottom:8px;background:var(--chip)}
  .term.rejected{opacity:.6}
  .term__top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .term__text{font-size:12px;line-height:1.4}
  .term.rejected .term__text{text-decoration:line-through}
  .term__status{font-family:'Space Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.06em;white-space:nowrap;flex:none}
  .term__bottom{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px}
  .term__by{font-family:'Space Mono',monospace;font-size:7.5px;letter-spacing:.1em;color:var(--soft)}
  .term__acts{display:flex;gap:5px}
  .terms__foot{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
  .signbtn{background:var(--green);border:none;color:#fff;border-radius:8px;padding:9px 20px;font-family:'Space Mono',monospace;font-weight:700;font-size:11px;letter-spacing:.05em;cursor:pointer;flex:none}
  .signbtn[disabled]{background:var(--chip);color:var(--soft);cursor:not-allowed}

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div id="sidenav"></div><!-- left rail / mobile bottom bar, injected by /sidenav.js -->

  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div id="content"><div class="micro" style="padding:40px 0;text-align:center">Loading the negotiating table…</div></div>
  </main>
</div>

<script type="module">
  import { supabase, isConfigured, requireUser } from '/supabase.js';
  import { esc } from '/util.js';
  import { mountTopbar, setTopbarActions } from '/topbar.js';
  import { mountSidenav } from '/sidenav.js';
  import { ideologyLabel } from '/archetypes.js';

  mountTopbar();
  mountSidenav();

  // ── SAMPLE SCAFFOLD DATA ─────────────────────────────────────────────────
  // Placeholder content demonstrating the layout. Replaced by real inter-nation
  // negotiations when the backend lands. See the header comment.
  var SPEAKERS = [
    { name: 'Head of Government', role: 'HEAD OF GOVERNMENT' },
    { name: 'Minister of Trade',  role: 'MINISTER OF TRADE' },
    { name: 'Foreign Minister',   role: 'FOREIGN MINISTER' },
  ];
  var SCOLOR = { AGREED: 'var(--green)', REJECTED: 'var(--red)', PROPOSED: 'var(--amber)' };
  var SGLYPH = { AGREED: '✓', REJECTED: '✕', PROPOSED: '◌' };

  var CHANNELS = [
    { id: 'sev', title: 'Negotiations with Severia',
      sub: 'CRUDE PREFERENTIAL RENEWAL · RELATIONS +6',
      status: 'ONGOING', sColor: 'var(--green)', dur: '3 MONTHS',
      flag: ['#c9302a', '#c9302a', '#d8b13c'],
      chat: [
        { who: 'ENVOY VOLKOV', role: 'SEVERIA', t: 'OCT 12',
          text: 'The preferential rate stands at ×0.9 — but the Politburo asks food in return. One Food per year, treaty term.' },
        { who: 'FOREIGN MINISTER', role: 'FOREIGN MINISTER', you: true, t: 'OCT 12',
          text: 'One Food strains a nine-million-person harvest. We can offer 1 Food every second year.' },
        { who: 'ENVOY VOLKOV', role: 'SEVERIA', t: 'OCT 20',
          text: 'Every second year is acceptable if the basing clause returns to the table.' },
        { who: 'HEAD OF GOVERNMENT', role: 'HEAD OF GOVERNMENT', you: true, t: 'OCT 26',
          text: 'Basing is not returning to the table. The rate and the food — that is the agreement.' },
      ],
      terms: [
        { text: 'Import Severian crude at preferential rate ×0.9', by: 'SEVERIA OFFERS', status: 'AGREED' },
        { text: 'Export 1 Food every second year', by: 'OUR OFFER', status: 'AGREED' },
        { text: 'Severian naval squadron basing access at Bandar Rish', by: 'SEVERIA PROPOSES', status: 'REJECTED' },
        { text: 'Duration: 5 years · renewable · exit penalty Prestige −2', by: 'STANDARD CLAUSE', status: 'PROPOSED' },
      ] },
    { id: 'haj', title: 'Negotiations with Hajjara',
      sub: 'FRONTIER DEMARCATION · RELATIONS −4',
      status: 'STALLED', sColor: 'var(--amber)', dur: '7 MONTHS',
      flag: ['#7a3038', '#e7e5e0', '#7a3038'], chat: [], terms: [] },
  ];
  // ─────────────────────────────────────────────────────────────────────────

  var content = document.getElementById('content');
  var state = { open: null, spk: 0 };

  function flagSvg(colors, w, h) {
    var band = h / colors.length;
    var rects = colors.map(function (c, i) {
      return '<rect x="0" y="' + (band * i) + '" width="' + w + '" height="' + (band + 0.5) + '" fill="' + esc(c) + '"/>';
    }).join('');
    return '<svg class="flag" width="' + w + '" height="' + h + '">' + rects + '</svg>';
  }

  function pill(text, color) {
    return '<span class="pill" style="color:' + color + ';border:1px solid color-mix(in srgb,' + color + ' 40%,transparent)">' + esc(text) + '</span>';
  }

  function listView() {
    var active = CHANNELS.filter(function (c) { return c.status !== 'STALLED'; }).length;
    var stalled = CHANNELS.length - active;
    var rows = CHANNELS.map(function (c) {
      return '<button class="chrow' + (c.status === 'STALLED' ? ' stalled' : '') + '" data-open="' + c.id + '">' +
          flagSvg(c.flag, 26, 16) +
          '<span class="chrow__body"><b>' + esc(c.title) + '</b><div class="chrow__sub">' + esc(c.sub) + '</div></span>' +
          pill(c.status, c.sColor) +
          '<span class="dur">' + esc(c.dur) + '</span>' +
          '<span class="chev">›</span>' +
        '</button>';
    }).join('');
    return '<div class="phead"><span class="eye">The Nation</span><h1>Negotiations</h1>' +
        '<p>The negotiating table — where the republic strikes its treaties and trade compacts with foreign powers.</p></div>' +
      '<button class="opener" disabled title="Backend coming soon">🤝 Open Negotiations · 1 Diplomacy</button>' +
      '<div class="micro">Open channels — ' + active + ' active · ' + stalled + ' stalled</div>' +
      '<div class="clist">' + rows + '</div>';
  }

  function bubble(m) {
    return '<div class="bubble' + (m.you ? ' you' : '') + '">' +
        '<div class="bubble__who" style="color:' + (m.you ? 'var(--indigo)' : 'var(--muted)') + '">' + esc(m.who) +
          '<span class="meta"> · ' + esc(m.role) + ' · ' + esc(m.t) + '</span></div>' +
        '<div class="bubble__t">' + esc(m.text) + '</div>' +
      '</div>';
  }

  function termCard(t) {
    var color = SCOLOR[t.status];
    var acts = t.status === 'PROPOSED'
      ? '<div class="term__acts">' +
          '<span class="tbtn" style="color:var(--green)">ACCEPT</span>' +
          '<span class="tbtn" style="color:var(--amber)">COUNTER</span>' +
          '<span class="tbtn" style="color:var(--red)">REJECT</span>' +
        '</div>'
      : '';
    return '<div class="term' + (t.status === 'REJECTED' ? ' rejected' : '') + '" style="border-color:color-mix(in srgb,' + color + ' 38%,transparent)">' +
        '<div class="term__top"><div class="term__text">' + esc(t.text) + '</div>' +
          '<span class="term__status" style="color:' + color + '">' + SGLYPH[t.status] + ' ' + t.status + '</span></div>' +
        '<div class="term__bottom"><span class="term__by">' + esc(t.by) + '</span>' + acts + '</div>' +
      '</div>';
  }

  function detailView(c) {
    var chatHtml = c.chat.length
      ? c.chat.map(bubble).join('')
      : '<div class="empty-chat">SEVEN MONTHS OF SILENCE</div>';
    var speakerOpts = SPEAKERS.map(function (s, i) {
      return '<option value="' + i + '"' + (i === state.spk ? ' selected' : '') + '>' + esc(s.name + ' — ' + s.role) + '</option>';
    }).join('');
    var composer =
      '<div class="composer"><div class="micro">Speak as — head of govt · trade · foreign</div>' +
        '<div class="composer__row">' +
          '<select class="spk" id="spk">' + speakerOpts + '</select>' +
          '<input id="msg" placeholder="Speak as ' + esc(SPEAKERS[state.spk].name) + '…">' +
          '<button class="sendbtn">SEND</button>' +
        '</div></div>';

    var chatCard = '<div class="card chat"><div class="micro">The channel — envoys speaking</div>' +
        '<div class="chat__scroll">' + chatHtml + '</div>' + composer + '</div>';

    var termsCard = '';
    if (c.terms.length) {
      var open = c.terms.filter(function (t) { return t.status === 'PROPOSED'; }).length;
      termsCard = '<div class="card terms">' +
          '<div class="terms__hd"><div class="micro">Draft Agreement</div><span class="tbtn">+ ADD TERM</span></div>' +
          c.terms.map(termCard).join('') +
          '<div class="terms__foot"><span class="micro" style="flex:1">' + open + ' term' + (open === 1 ? '' : 's') + ' open · both parties must sign</span>' +
            '<button class="signbtn"' + (open > 0 ? ' disabled' : '') + '>✍ Sign Agreement</button></div>' +
        '</div>';
    }

    return '<span class="back" data-back>‹ Negotiations</span>' +
      '<div class="dhead">' + flagSvg(c.flag, 34, 22) +
        '<div class="dhead__t"><b>' + esc(c.title) + '</b><div class="micro" style="margin-top:3px">' + esc(c.sub) + '</div></div>' +
        pill(c.status + ' · ' + c.dur, c.sColor) +
      '</div>' +
      '<div class="cols">' + chatCard + termsCard + '</div>';
  }

  function render() {
    var c = CHANNELS.find(function (x) { return x.id === state.open; });
    content.innerHTML = c ? detailView(c) : listView();
    if (c) {
      var back = content.querySelector('[data-back]');
      if (back) back.addEventListener('click', function () { state.open = null; state.spk = 0; render(); });
      var spk = content.querySelector('#spk');
      if (spk) spk.addEventListener('change', function (e) {
        state.spk = +e.target.value;
        var msg = content.querySelector('#msg');
        if (msg) msg.placeholder = 'Speak as ' + SPEAKERS[state.spk].name + '…';
      });
    } else {
      content.querySelectorAll('[data-open]').forEach(function (el) {
        el.addEventListener('click', function () { state.open = el.getAttribute('data-open'); state.spk = 0; render(); });
      });
    }
  }

  (async () => {
    if (!isConfigured) { content.innerHTML = '<div class="micro" style="padding:40px 0;text-align:center">Supabase isn’t configured.</div>'; return; }
    const user = await requireUser();
    if (!user) return; // redirected to login
    try {
      const { data: party } = await supabase.from('parties').select('name, archetype, nation_id, influence').eq('user_id', user.id).single();
      if (!party) { window.location.replace('/nation-select/'); return; }
      const { data: nation } = await supabase.from('nations').select('name, flag').eq('id', party.nation_id).single();
      const nationName = (nation && nation.name) || party.nation_id;
      document.getElementById('pname').textContent = party.name;
      document.getElementById('psub').textContent = ideologyLabel(party) + ' · ' + nationName;
      if (nation && nation.flag) { var f = document.getElementById('flag'); f.onload = function () { f.hidden = false; }; f.src = nation.flag; }
      setTopbarActions(party.influence);
    } catch (e) { /* brand fill is non-fatal; the page still renders */ }
    render();
  })();
</script>
</body>
</html>
