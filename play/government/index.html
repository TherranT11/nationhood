<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/theme.js"></script>
<title>Government · Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAF8;--surface:#FFFFFF;--ink:#15151B;--muted:#5b5b63;--soft:#8d8d95;
    --line:#E7E5E0;--line2:#D9D6D0;--chip:#F4F3EF;--field:#FCFBF9;
    --indigo:#5546E8;--indigo-soft:#ECE9FD;
    --red:#C42B2B;--red-soft:#FBEAE9;--amber:#E0820E;--amber-soft:#FBF0DD;--green:#16915a;--green-soft:#E5F4EC;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .app{display:flex;min-height:100vh}

  /* Left navigation (desktop rail + mobile bottom bar) lives in /sidenav.js */

  .main{flex:1;padding:24px clamp(16px,4vw,56px) 56px;min-width:0}
  .phead .eye{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--indigo)}
  .phead h1{font-weight:900;font-size:clamp(24px,3.6vw,32px);letter-spacing:-.03em;margin-top:4px}
  .phead p{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:620px}

  #content > .panel{margin-top:18px} #content > :first-child{margin-top:20px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
  /* Agenda + Cabinet on top, Modifiers + Crises beneath — two columns. */
  .govgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;align-items:start}
  @media(max-width:760px){.govgrid{grid-template-columns:1fr}}
  .panel h2{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:14px}

  /* government header card */
  .gov{border-top:3px solid var(--tc,var(--indigo))}
  .gov__top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .gov__emb{width:50px;height:50px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-weight:700;font-size:16px;background:color-mix(in srgb,var(--tc,var(--indigo)) 14%, var(--surface));color:var(--tc,var(--indigo))}
  .gov__id b{font-weight:900;font-size:20px;letter-spacing:-.02em;display:block}
  .gov__id span{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.04em;color:var(--soft)}
  .gtype{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:6px 12px;border-radius:20px;background:var(--indigo-soft);color:var(--indigo);margin-left:auto;white-space:nowrap}

  /* hemicycle — the National Assembly */
  .hemiwrap{position:relative;display:flex;justify-content:center;padding:2px 0 4px}
  .hemi{width:100%;max-width:440px;height:auto}
  .seatcall{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);text-align:center;line-height:1.05}
  .seatcall b{font-weight:900;font-size:26px;letter-spacing:-.02em}
  .seatcall span{display:block;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:10px}
  .lg{font-size:11.5px;color:var(--muted)} .lg.opp{opacity:.6}
  .lg b{color:var(--ink);font-weight:700}
  .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}

  .mrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
  .mrow:last-child{border-bottom:none}
  .mrow .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .mrow .nm{flex:1;min-width:0}
  .mrow .nm b{font-weight:700;font-size:14px}
  .mrow .nm small{display:block;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}
  .mrow .role{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;color:var(--indigo);background:var(--indigo-soft);padding:4px 9px;border-radius:20px;white-space:nowrap}
  .mrow .sc{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:var(--muted);min-width:34px;text-align:right}
  /* The owner's OOC nickname shown after a party name — "Centrist Union (Theo)". */
  .pnick{font-weight:600;color:var(--soft)}
  .gov__id .pnick{font-size:.7em}
  .subhd{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin:18px 0 2px}

  /* confidence rail */
  .conf__n{font-weight:900;font-size:clamp(40px,7vw,52px);line-height:.9;letter-spacing:-.04em}
  .conf__n span{font-size:20px;font-weight:800}
  .conf__band{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;margin:8px 0 14px}
  .conf__bar{height:12px;border-radius:7px;background:var(--chip);overflow:hidden;margin-bottom:6px}
  .conf__fill{height:100%;width:0;border-radius:7px;transition:width .3s}
  .conf__note{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.02em;color:var(--soft);line-height:1.5;margin-top:12px}
  .conf__break{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 2px}
  .bk{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.03em;font-weight:700;padding:4px 8px;border-radius:7px;background:var(--chip);color:var(--soft);white-space:nowrap}
  .bk.pos{background:var(--green-soft);color:var(--green)} .bk.neg{background:var(--red-soft);color:var(--red)}

  /* agenda */
  .ag{display:flex;align-items:flex-start;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}
  .ag:last-child{border-bottom:none}
  .ag__b{flex:1;min-width:0}
  .ag__b b{font-weight:700;font-size:13.5px;display:block}
  .ag__b small{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft)}
  .ag__s{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;padding:5px 10px;border-radius:20px;white-space:nowrap;flex:none}
  .ag__s.pending{color:var(--amber);background:var(--amber-soft)} .ag__s.done{color:var(--green);background:var(--green-soft)}

  .empty{text-align:center;padding:46px 20px;color:var(--soft)}
  .empty b{display:block;color:var(--muted);font-size:16px;margin-bottom:5px}
  .muted{color:var(--soft);font-size:13px;font-style:italic}
  /* The Cabinet: head of government + ministry portfolios */
  .cabrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .cabrow:last-child{border-bottom:none}
  .cabrow--hog{border-bottom:2px solid var(--line2);padding-bottom:11px;margin-bottom:2px}
  .cabrow .cabk{color:var(--muted)}
  .cabrow--hog .cabk{color:var(--ink);font-weight:700}
  .cabrow .cabv{font-weight:700;text-align:right}
  .cabrow .caba{font-weight:400;font-style:normal;color:var(--soft);font-family:'Space Mono',monospace;font-size:11px}
  .cabrow .vac{font-weight:400;font-style:italic;color:var(--soft)}
  .enact{margin-left:10px;flex:none;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;padding:6px 12px;border-radius:8px;border:1px solid var(--indigo);background:var(--indigo);color:#fff;cursor:pointer}
  .enact:hover{filter:brightness(1.06)} .enact:disabled{opacity:.45;cursor:not-allowed;filter:none}

  /* Fulfill-ministry modal: pick which of the recipient party's prominent politicians takes the seat */
  .mback{position:fixed;inset:0;background:rgba(12,12,18,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:130}
  .mback[hidden]{display:none}
  .mcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:440px;width:100%;box-shadow:0 28px 64px -24px rgba(0,0,0,.45)}
  .mcard__hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
  .mcard__hd b{font-weight:800;font-size:16px}
  .mcard__x{background:none;border:none;font-size:22px;line-height:1;color:var(--soft);cursor:pointer}
  .mcard__sub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
  .polopt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--field);cursor:pointer;margin-bottom:8px;font-size:13.5px}
  .polopt:hover{border-color:var(--indigo);background:var(--surface)}
  .polopt:disabled{opacity:.55;cursor:not-allowed}
  .polopt b{font-weight:700}
  .polopt .role{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft)}
  .mcard__empty{color:var(--soft);font-style:italic;font-size:13px;padding:8px 0}

  /* formation-window decision card */
  .decide{border-top:3px solid var(--tc,var(--indigo));margin-bottom:18px}
  .decide__eye{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--indigo);font-weight:700}
  .decide h2{font-family:inherit;text-transform:none;font-weight:900;font-size:21px;letter-spacing:-.02em;color:var(--ink);margin:6px 0 8px}
  .decide p{color:var(--muted);font-size:13.5px;line-height:1.55;max-width:640px}
  .decide p b{color:var(--ink);font-weight:700}
  .decide__btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
  .decide__hint{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.02em;color:var(--soft);margin-top:10px}
  .btn{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.04em;font-weight:700;text-transform:uppercase;padding:11px 18px;border-radius:10px;border:1px solid var(--indigo);background:var(--indigo);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;transition:filter .15s,opacity .15s}
  .btn:hover{filter:brightness(1.06)}
  .btn--ghost{background:var(--surface);color:var(--indigo)}
  .btn--danger{background:var(--red);border-color:var(--red)}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--bg);font-family:'Space Mono',monospace;font-size:12px;padding:14px 18px;border-radius:11px;box-shadow:0 18px 44px -18px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:all .35s;z-index:120;max-width:90vw;text-align:center;line-height:1.55}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div id="sidenav"></div><!-- left rail / mobile bottom bar, injected by /sidenav.js -->

  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="phead">
      <span class="eye">The Government</span>
      <h1 id="ghead">Government</h1>
      <p id="glede">Who holds power in the nation, the coalition behind them, and the agenda they’ve promised.</p>
    </div>
    <div id="content"><div class="panel"><div class="empty">Loading the government…</div></div></div>
  </main>
</div>
<div class="mback" id="fulfillModal" hidden>
  <div class="mcard">
    <div class="mcard__hd"><b id="fmTitle">Appoint a Minister</b><button class="mcard__x" id="fmX" type="button" aria-label="Close">&times;</button></div>
    <div class="mcard__sub" id="fmSub"></div>
    <div id="fmList"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
  import { supabase, isConfigured, requireUser } from '/supabase.js';
  import { esc, majority, declaredValue, loadHogTitleSlot } from '/util.js';
  import { partyColor, ideologyLabel } from '/archetypes.js';
  import { TERM_LABELS, summarizeTerm } from '/terms.js';
  import { MINISTRIES } from '/ministries.js';
  import { mountTopbar, setTopbarActions, setTopbarFunds } from '/topbar.js';
  import { mountSidenav } from '/sidenav.js';

  mountTopbar(); // shared top bar (Discord/funds/actions/date/gear) into #topbar
  mountSidenav();  // left rail (desktop) / bottom bar (mobile) into #sidenav; active item from the URL

  function typeLabel(t){ return t === 'coalition' ? 'Coalition Government' : t === 'minority' ? 'Minority Government' : 'Majority Government'; }
  // Confidence band, tied to the resolver's seat-modifier thresholds (>50 rewarded,
  // <40 punished at the next election).
  function band(c){
    if (c > 50) return { word: 'Confident', color: 'var(--green)' };   // >50 = the resolver's seat bonus
    if (c >= 40) return { word: 'Holding',   color: 'var(--amber)' };  // 40–50 = neutral
    return { word: 'In trouble', color: 'var(--red)' };                // <40 = the seat penalty
  }

  // Confidence breakdown chips, read straight from the stored conf_breakdown
  // (computed once in _seat_government) plus the movement since formation. Show
  // Base always and any non-zero part; governments seated before the breakdown
  // existed simply show none.
  function confChips(govt){
    var b = govt.conf_breakdown;
    if (!b) return '';
    var parts = [['Base', b.base], ['Crises', b.crises], ['Contradictions', b.contradictions],
                 ['Coalition size', b.majority], ['Reneged', b.renege], ['National modifier', b.modifier]];
    if (b.formed != null) parts.push(['Agenda', (Number(govt.confidence) || 0) - b.formed]);
    // Round each part to one decimal (confidence is numeric, so movement can be fractional);
    // filter zeros AFTER rounding so a sub-0.1 movement doesn't show as e.g. "Agenda 0". Whole
    // numbers render clean (no trailing .0); fractions show one decimal. Base always shows.
    var chips = parts.map(function(p){ return [p[0], Math.round((p[1] || 0) * 10) / 10]; })
      .filter(function(p){ return p[0] === 'Base' || p[1]; }).map(function(p){
      var n = p[1], cls = n > 0 ? 'pos' : n < 0 ? 'neg' : '';
      var disp = (n % 1 === 0) ? String(n) : n.toFixed(1);
      return '<span class="bk ' + cls + '">' + p[0] + ' ' + (n > 0 ? '+' : '') + disp + '</span>';
    });
    return '<div class="conf__break">' + chips.join('') + '</div>';
  }

  // The hemicycle: government parties fill the arc first (full colour), opposition
  // after (faded); a dashed line marks the majority threshold. Coloured from
  // real seats + archetypes. Geometry is a DELIBERATE standalone copy of the
  // tutorial's (tutorial/government/formed) — that walkthrough is frozen and
  // self-contained, so the two are intentionally not shared.
  function hemicycleSvg(gov, opp, total, maj){
    if (!total) return '';
    var ROWS = 9, RIN = 86, ROUT = 216, CX = 230, CY = 224, RAD = 3.6;
    var radii = []; for (var r = 0; r < ROWS; r++) radii.push(RIN + (ROUT - RIN) * r / (ROWS - 1));
    var totW = radii.reduce(function(a, b){ return a + b; }, 0);
    var per = radii.map(function(R){ return Math.max(2, Math.round(total * R / totW)); });
    var diff = total - per.reduce(function(a, b){ return a + b; }, 0), ri = ROWS - 1;
    while (diff !== 0){ per[ri] += Math.sign(diff); diff -= Math.sign(diff); ri = (ri - 1 + ROWS) % ROWS; }
    var seats = [];
    for (var r2 = 0; r2 < ROWS; r2++){ var n = per[r2], R = radii[r2];
      for (var i = 0; i < n; i++){ var th = Math.PI * (i + 0.5) / n; seats.push({ x: CX - R * Math.cos(th), y: CY - R * Math.sin(th), th: th }); } }
    seats.sort(function(a, b){ return a.th - b.th; });
    var order = gov.concat(opp).map(function(p){ return { s: p.seats || 0, c: partyColor(p), gov: p.in_government ? 1 : 0 }; })
      .filter(function(p){ return p.s > 0; });
    var circles = '', pi = 0, used = 0, boundary = null;
    seats.forEach(function(s, k){
      while (pi < order.length - 1 && used >= order[pi].s){ pi++; used = 0; }
      used++;
      var party = order[pi] || { c: 'var(--chip)', gov: 0 };
      circles += '<circle cx="' + s.x.toFixed(1) + '" cy="' + s.y.toFixed(1) + '" r="' + RAD + '" fill="' + party.c + '" opacity="' + (party.gov ? '1' : '.32') + '"/>';
      if (k === maj - 1) boundary = s.th;
    });
    var line = '';
    if (boundary != null){
      var bt = boundary - (Math.PI / total) * 0.5;
      var x1 = (CX - (RIN - 14) * Math.cos(bt)).toFixed(1), y1 = (CY - (RIN - 14) * Math.sin(bt)).toFixed(1);
      var x2 = (CX - (ROUT + 16) * Math.cos(bt)).toFixed(1), y2 = (CY - (ROUT + 16) * Math.sin(bt)).toFixed(1);
      line = '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="var(--ink)" stroke-width="1.4" stroke-dasharray="3 3" opacity=".5"/>' +
        '<text x="' + x2 + '" y="' + (Number(y2) - 4) + '" fill="var(--ink)" font-family="Space Mono, monospace" font-size="9" text-anchor="middle">' + maj + ' maj</text>';
    }
    return '<svg class="hemi" viewBox="0 0 460 250" aria-hidden="true">' + circles + line + '</svg>';
  }

  function hemiLegend(gov, opp){
    // Only seated parties — the legend describes the chart, which excludes 0-seat parties.
    return gov.concat(opp).filter(function(p){ return (p.seats || 0) > 0; }).map(function(p){
      return '<span class="lg' + (p.in_government ? '' : ' opp') + '"><span class="sw" style="background:' + partyColor(p) + '"></span>' +
        (p.in_government ? '<b>' + esc(p.name) + '</b>' : esc(p.name)) + ' ' + (p.seats || 0) + '</span>';
    }).join('');
  }

  // A party's OOC nickname suffix — " (Theo)" — when its owner has set one. ONE source.
  function nickSuffix(p){ return (p && p.handle) ? ' <span class="pnick">(' + esc(p.handle) + ')</span>' : ''; }

  function memberRow(p, role, lead){
    return '<div class="mrow"><span class="dot" style="background:' + partyColor(p) + '"></span>' +
      '<div class="nm"><b>' + esc(p.name) + '</b>' + nickSuffix(p) + '<small>' + esc(ideologyLabel(p)) + (p.abbreviation ? ' · ' + esc(p.abbreviation) : '') + '</small></div>' +
      (role ? '<span class="role"' + (lead ? '' : ' style="color:var(--muted);background:var(--chip)"') + '>' + role + '</span>' : '') +
      '<span class="sc">' + (p.seats || 0) + '</span></div>';
  }

  // The cabinet's ministry rows. A MINORITY government (the formateur governing alone, no
  // coalition deal) staffs its cabinet from its OWN roster. The eligible pool excludes the
  // leader (who is the Head of Government) and field operatives — Mayors / Grassroots
  // Organizers, who are out on local work and take no cabinet seat. The eligible take the
  // named ministries in roster order; any portfolio they don't fill shows a Non-Descript
  // minister (a placeholder, not a real person, so it can't act), and any eligible beyond the
  // last portfolio are listed as Non-Descript Ministers. Coalition/majority cabinets stay
  // Vacant until negotiated ministry terms fill them.
  // (Mayor/Grassroots roles aren't live in-game yet, but the exclusion is in place for when they are.)
  var FIELD_ROLES = ['Mayor', 'Grassroots Organizer'];
  function polFullName(p){ return ((p.first_name || '') + ' ' + (p.last_name || '')).trim(); }
  function cabRow(k, v, cls){ return '<div class="cabrow"><span class="cabk">' + esc(k) + '</span><span class="cabv' + (cls ? ' ' + cls : '') + '">' + v + '</span></div>'; }
  // The party-abbreviation tag (e.g. " (NPP)") — the one source for the cabinet's party chips,
  // used by the Head of Government row and every minister in a minority cabinet.
  function partyTag(party){ return (party && party.abbreviation) ? ' <span class="caba">(' + esc(party.abbreviation) + ')</span>' : ''; }
  // appts: { ministry → {name, abbr} } — the HoG's explicit cabinet_appoint choices, the
  // authoritative source. filled: the DONE ministry promises (agenda_fulfill_ministry). An
  // explicit appointment wins; else a coalition/majority shows the fulfilled promise (Vacant
  // otherwise) and a minority staffs the rest from its own roster.
  function cabRowMin(m, html, cls){ return cabRow('Minister of ' + m, html, cls); }
  function ministerCell(name, abbr){ return esc(name) + (abbr ? ' <span class="caba">(' + esc(abbr) + ')</span>' : ''); }
  function cabinetMinisters(govt, pols, formateur, filled, appts){
    appts = appts || {}; filled = filled || {};
    if (govt.type !== 'minority') {
      return MINISTRIES.map(function(m){
        var a = appts[m], f = filled[m];
        return a ? cabRowMin(m, ministerCell(a.name, a.abbr))
             : f ? cabRowMin(m, ministerCell(f.name, f.abbr))
                 : cabRowMin(m, 'Vacant', 'vac');
      }).join('');
    }
    var eligible = (pols || []).filter(function(p){ return p.status !== 'Party Leader' && FIELD_ROLES.indexOf(p.status) < 0; });
    var tag = partyTag(formateur);   // a minority's own roster fills any un-appointed seat
    var rows = MINISTRIES.map(function(m, i){
      var a = appts[m];
      return a ? cabRowMin(m, ministerCell(a.name, a.abbr))
        : eligible[i] ? cabRowMin(m, esc(polFullName(eligible[i])) + tag)
                      : cabRowMin(m, 'Non-Descript' + tag, 'vac');
    }).join('');
    return rows + eligible.slice(MINISTRIES.length).map(function(p){ return cabRow('Non-Descript Minister', esc(polFullName(p)) + tag); }).join('');
  }


  function render(govt, nation, parties, agenda, amPM, formation, pmLeader, formateurPols, polsByParty, appts){
    polsByParty = polsByParty || {};
    FULFILL = {};   // rebuilt below for each pending ministry the PM can fill
    var box = document.getElementById('content');
    if (!govt){
      // Two distinct "no government" reasons: a one-party state never forms a
      // coalition government, vs a multiparty nation that simply hasn't voted yet.
      var oneParty = !!(nation && nation.ruling_party);
      box.innerHTML = '<div class="panel"><div class="empty"><b>' +
        (oneParty ? 'No coalition government' : 'No government has formed yet') + '</b><span>' +
        (oneParty
          ? esc(nation.name || 'This nation') + ' is a one-party state — power isn’t shared through a coalition, so there’s no Government Confidence to track here.'
          : 'A government is seated when the nation holds its first general election.') +
        '</span></div></div>';
      return;
    }
    var byId = {}; parties.forEach(function(p){ byId[p.id] = p; });
    var formateur = byId[govt.formateur_party_id] || { name: 'A party', archetype: '', seats: 0 };
    var tc = partyColor(formateur);
    document.documentElement.style.setProperty('--tc', tc);

    // Government members: the formateur first, then by seats.
    var gov = parties.filter(function(p){ return p.in_government; }).sort(function(a,b){
      if (a.id === govt.formateur_party_id) return -1;
      if (b.id === govt.formateur_party_id) return 1;
      return (b.seats||0) - (a.seats||0);
    });
    var opp = parties.filter(function(p){ return !p.in_government; }).sort(function(a,b){ return (b.seats||0)-(a.seats||0); });
    var govSeats = gov.reduce(function(s,p){ return s + (p.seats||0); }, 0);
    var total = nation.legislature_seats || 0;
    var maj = majority(total);
    var c = Math.max(0, Math.min(100, Number(govt.confidence) || 0));
    var bd = band(c);

    var members = gov.map(function(p, i){
      var role = govt.type === 'coalition' ? (i === 0 ? 'Leading party' : 'Coalition partner')
               : (govt.type === 'minority' ? 'Minority' : 'Governing');
      return memberRow(p, role, i === 0);
    }).join('');

    // Fulfilled ministry promises seat real ministers: map ministry → {name, abbr}, plus the
    // set of politicians already holding a portfolio (so a person isn't offered for two), both
    // read from this government's DONE ministry agenda rows.
    var cabinetFilled = {}, seatedPolIds = {};
    agenda.forEach(function(a){
      if (a.type === 'ministry' && a.status === 'done' && a.params){
        if (a.params.ministry) cabinetFilled[a.params.ministry] = { name: a.params.minister_name || '—', abbr: a.params.party_abbr || '' };
        if (a.params.minister_id) seatedPolIds[a.params.minister_id] = true;
      }
    });
    // The recipient party's politicians eligible for a seat: real members who aren't field
    // operatives (Mayor / Grassroots Organizer) and don't already hold a portfolio here.
    function ministryEligible(partyId){
      return (polsByParty[partyId] || []).filter(function(p){ return FIELD_ROLES.indexOf(p.status) < 0 && !seatedPolIds[p.id]; });
    }

    // The Cabinet: the Head of Government (the formateur's leader) atop the ministry
    // portfolios. A minority government staffs from its roster; a coalition/majority cabinet
    // fills each portfolio as its ministry promise is fulfilled (cabinetFilled).
    var hogName = (pmLeader ? esc(polFullName(pmLeader)) : '') || esc(formateur.name);
    var hogAbbr = partyTag(formateur);
    var cabinetHtml = '<div class="cabrow cabrow--hog"><span class="cabk">' + esc(HOG_TITLE) + '</span>' +
        '<span class="cabv">' + hogName + hogAbbr + '</span></div>' +
      cabinetMinisters(govt, formateurPols, formateur, cabinetFilled, appts);

    var agendaHtml;
    if (govt.type === 'coalition' && agenda.length){
      agendaHtml = agenda.map(function(a){
        var done = a.status === 'done';
        var sub = esc(TERM_LABELS[a.type] || a.type);
        var action = '';
        if (a.type === 'ministry'){
          // The promised recipient party: the live party row by id is the source of truth (a
          // rename shows through); the term's snapshotted name is only a fallback for a party no
          // longer listed. Pre-feature promises carry no recipient — "recipient not set", unfillable.
          var recipId = a.params && a.params.to_party;
          var recipName = (recipId && byId[recipId] && byId[recipId].name) || (a.params && a.params.to_party_name) || null;
          sub += recipName ? ' · to ' + esc(recipName) : ' · recipient not set';
          if (done){
            sub += a.params && a.params.minister_name ? ' · ' + esc(a.params.minister_name) + (a.params.party_abbr ? ' (' + esc(a.params.party_abbr) + ')' : '') : '';
          } else if (amPM){
            var pool = recipId ? ministryEligible(recipId) : [];
            if (pool.length){
              // Stash what the modal needs so the click handler (bound after render) can populate it.
              FULFILL[a.id] = { ministry: a.params.ministry || 'Ministry', recipName: recipName,
                pool: pool.map(function(p){ return { id: p.id, name: polFullName(p), role: p.status }; }) };
              action = '<button class="enact" type="button" data-fulfill="' + esc(a.id) + '">Fulfill</button>';
            } else {
              var why = !recipId ? 'No recipient party was set in the deal' : ('No eligible politician in ' + (recipName || 'that party'));
              action = '<button class="enact" type="button" disabled title="' + esc(why) + '">Fulfill</button>';
            }
          }
        } else if (amPM && !done){
          action = '<button class="enact" type="button" data-id="' + esc(a.id) + '">Enact</button>';
        }
        return '<div class="ag"><div class="ag__b"><b>' + esc(summarizeTerm(a.type, a.params)) + '</b>' +
          '<small>' + sub + '</small></div>' +
          '<span class="ag__s ' + (done ? 'done' : 'pending') + '">' + (done ? 'Done' : 'Pending') + '</span>' + action + '</div>';
      }).join('');
      if (amPM) agendaHtml += '<p class="conf__note" style="text-align:left;margin-top:12px">Enacting a promise costs 1 party action and raises Government Confidence +3%. Filling a ministry is free and raises it +0.5%.</p>';
    } else {
      agendaHtml = '<p class="muted">No coalition agenda — this government is not bound by negotiated terms.</p>';
    }

    // Formation-window decision card (formateur only, the tick the government formed).
    var f = formation || {};
    var cardHtml = '';
    if (f.canRenege){
      cardHtml =
        '<div class="panel decide">' +
          '<span class="decide__eye">Form your government</span>' +
          '<h2>You won the most seats</h2>' +
          '<p>Your pre-agreed coalition has taken office. You can honour that deal, or tear it up and build a different majority — but only this turn. Breaking it costs <b>−5% Government Confidence</b> and <b>−5% of your Popularity</b>, and there’s no going back to the current coalition.</p>' +
          '<div class="decide__btns">' +
            '<button class="btn btn--ghost" id="enterAgreed" type="button">Enter Agreed Coalition</button>' +
            '<button class="btn btn--danger" id="formNew" type="button">Form New Coalition</button>' +
          '</div>' +
        '</div>';
    } else if (f.postRenege){
      var hasNeg = !!f.negId;
      cardHtml =
        '<div class="panel decide">' +
          '<span class="decide__eye">Form your government</span>' +
          '<h2>Governing alone</h2>' +
          '<p>You walked away from your coalition and now hold power as a minority. Assemble a new majority at the negotiating table before the turn ends — otherwise you stay a minority government. Sealing a new coalition costs <b>−5% Government Confidence</b> and <b>−5% of your Popularity</b>.</p>' +
          '<div class="decide__btns">' +
            '<a class="btn btn--ghost" href="/play/negotiate/">Go to Negotiate</a>' +
            '<button class="btn" id="installNew" type="button"' + (hasNeg ? '' : ' disabled') + '>Install New Coalition</button>' +
          '</div>' +
          (hasNeg ? '' : '<div class="decide__hint">No committed majority agreement yet — form one at Negotiate, then install it here.</div>') +
        '</div>';
    }

    box.innerHTML = cardHtml +
      // 1 — Government Confidence
      '<div class="panel"><h2>Government Confidence</h2>' +
        '<div class="conf__n" style="color:' + bd.color + '">' + c.toFixed(1) + '<span>%</span></div>' +
        '<div class="conf__band" style="color:' + bd.color + '">' + bd.word + '</div>' +
        '<div class="conf__bar"><div class="conf__fill" style="width:' + c + '%;background:' + bd.color + '"></div></div>' +
        confChips(govt) +
        '<div class="conf__note">Public approval of the sitting government. Below 40% it costs incumbents seats at the next election; above 50% it wins them. Carrying out the agenda moves it.' +
          (govt.type === 'minority' ? ' A minority government also loses 0.3% each tick — if it falls below 20%, the head of government’s party is penalised and a snap election is called.' : '') + '</div>' +
      '</div>' +
      // 2 — The National Assembly (hemicycle)
      '<div class="panel"><h2>The National Assembly</h2>' +
        '<div class="hemiwrap">' + hemicycleSvg(gov, opp, total, maj) +
          '<div class="seatcall"><b>' + govSeats + '</b><span>of ' + total + ' · majority ' + maj + (govSeats >= maj ? ' ✓' : '') + '</span></div>' +
        '</div>' +
        '<div class="legend">' + hemiLegend(gov, opp) + '</div>' +
      '</div>' +
      // 3 — Government & Coalition
      '<div class="panel gov">' +
        '<div class="gov__top"><span class="gov__emb">' + esc((formateur.abbreviation || formateur.name.slice(0,2)).toUpperCase()) + '</span>' +
          '<div class="gov__id"><b>' + esc(formateur.name) + nickSuffix(formateur) + '</b><span>Holds the premiership · ' + esc(ideologyLabel(formateur)) + '</span></div>' +
          '<span class="gtype">' + typeLabel(govt.type) + '</span></div>' +
        '<div class="subhd">In government</div>' + members +
        (opp.length ? '<div class="subhd">Opposition</div>' + opp.map(function(p){ return memberRow(p, '', false); }).join('') : '') +
      '</div>' +
      // 4–5 — two columns: Agenda + Cabinet. (National Modifiers and National Crises
      // both live on the home dashboard.)
      '<div class="govgrid">' +
        '<div class="panel"><h2>Governing Agenda</h2>' + agendaHtml + '</div>' +
        '<div class="panel"><h2>The Cabinet</h2>' + cabinetHtml + '</div>' +
      '</div>';

    box.querySelectorAll('.enact').forEach(function(b){
      if (b.disabled) return;   // a gated Fulfill (no recipient / no eligible politician)
      if (b.dataset.fulfill) b.addEventListener('click', function(){ openFulfill(b.dataset.fulfill); });
      else b.addEventListener('click', function(){ enact(b.dataset.id); });
    });
    var ea = document.getElementById('enterAgreed'); if (ea) ea.addEventListener('click', function(){ enterAgreed(govt.id); });
    var fnb = document.getElementById('formNew');     if (fnb) fnb.addEventListener('click', renege);
    var inb = document.getElementById('installNew');  if (inb && f.negId) inb.addEventListener('click', function(){ install(f.negId); });
  }

  // --- state shared by the boot + the post-enact refresh ---
  var MY_PARTY_ID = null, NATION = null, NATION_ID = null, HOG_TITLE = 'Head of Government', busy = false;
  var FULFILL = {};   // itemId → { ministry, recipName, pool:[{id,name,role}] }, rebuilt each render
  var toast = document.getElementById('toast'), toastT;
  function ping(h){ toast.textContent = h; toast.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function(){ toast.classList.remove('show'); }, 4200); }

  // The Fulfill modal: pick which of the recipient party's prominent politicians takes the seat.
  var fulfillModal = document.getElementById('fulfillModal');
  function closeFulfill(){ fulfillModal.hidden = true; }
  document.getElementById('fmX').addEventListener('click', closeFulfill);
  fulfillModal.addEventListener('click', function(e){ if (e.target === fulfillModal) closeFulfill(); });
  function openFulfill(itemId){
    var info = FULFILL[itemId];
    if (!info) return;
    document.getElementById('fmTitle').textContent = 'Minister of ' + info.ministry;
    document.getElementById('fmSub').textContent = 'Choose who from ' + info.recipName + ' takes the seat.';
    document.getElementById('fmList').innerHTML = info.pool.length
      ? info.pool.map(function(p){ return '<button class="polopt" type="button" data-pol="' + esc(p.id) + '"><b>' + esc(p.name) + '</b><span class="role">' + esc(p.role) + '</span></button>'; }).join('')
      : '<div class="mcard__empty">No eligible politician in ' + esc(info.recipName) + '.</div>';
    document.getElementById('fmList').querySelectorAll('.polopt').forEach(function(b){
      b.addEventListener('click', function(){ doFulfill(itemId, b.dataset.pol); });
    });
    fulfillModal.hidden = false;
  }
  async function doFulfill(itemId, polId){
    if (busy) return;   // writes — never let a double-click fire twice
    busy = true;
    fulfillModal.querySelectorAll('.polopt').forEach(function(b){ b.disabled = true; });
    try {
      const { data, error } = await supabase.rpc('agenda_fulfill_ministry', { p_item: itemId, p_politician: polId });
      if (error) throw error;
      closeFulfill();
      ping((data.minister || 'Minister') + ' appointed — Government Confidence +' + Number(data.delta).toFixed(1) + '% (now ' + Number(data.confidence).toFixed(1) + '%).');
      await load();
    } catch (e) { ping(e.message || 'Couldn’t fill that ministry.'); fulfillModal.querySelectorAll('.polopt').forEach(function(b){ b.disabled = false; }); }
    finally { busy = false; }
  }

  // Re-fetch the government + agenda and redraw. Called on load and after enacting.
  async function load(){
    try {
      const { data: govt } = await supabase.from('governments')
        .select('*').eq('nation_id', NATION_ID).eq('status', 'active').maybeSingle();
      const { data: parties } = await supabase.from('parties')
        .select('id, name, abbreviation, seats, archetype, in_government, color').eq('nation_id', NATION_ID);
      // Owner OOC nicknames, keyed by party (cosmetic — a failure must never block the page).
      try {
        const { data: hrows } = await supabase.rpc('nation_party_handles', { p_nation: NATION_ID });
        var handleById = {}; (hrows || []).forEach(function(h){ handleById[h.party_id] = h.handle; });
        (parties || []).forEach(function(p){ p.handle = handleById[p.id] || null; });
      } catch (e) { /* no nicknames shown */ }
      var agenda = [];
      if (govt) {
        const { data: ag } = await supabase.from('government_agenda')
          .select('id, type, params, status').eq('government_id', govt.id).order('created_at');
        agenda = ag || [];
      }
      var amPM = !!(govt && govt.formateur_party_id === MY_PARTY_ID); // only the leading party enacts
      // The formation-window choice (formateur-only, the tick it formed) — one
      // source, shared with the Home banner. Loaded lazily and defensively: this
      // optional nudge must never block the core page from rendering. render()
      // treats a missing object as "no card", so the fallback is just {}.
      var formation = {};
      try {
        const fm = await import('/formation.js');
        formation = await fm.formationState({ id: MY_PARTY_ID, nation_id: NATION_ID });
      } catch (e) { /* non-critical enhancement — fall through with no card */ }
      // Rosters of every governing party, in one query: the formateur's leader is the Head of
      // Government (cabinet top row), a minority government staffs the rest of the cabinet from
      // its own roster, and a coalition fills portfolios from the promised parties' rosters via
      // Fulfill. Non-critical — on failure the HoG row falls back to the party name, the minority
      // cabinet reads all Non-Descript, and Fulfill gates off — so isolate it.
      var pmLeader = null, formateurPols = [], polsByParty = {};
      if (govt) {
        var govPartyIds = (parties || []).filter(function(p){ return p.in_government; }).map(function(p){ return p.id; });
        if (govt.formateur_party_id && govPartyIds.indexOf(govt.formateur_party_id) < 0) govPartyIds.push(govt.formateur_party_id);
        if (govPartyIds.length) {
          try {
            const { data: pols } = await supabase.from('politicians')
              .select('id, first_name, last_name, status, party_id')
              .in('party_id', govPartyIds).order('created_at', { ascending: true });
            (pols || []).forEach(function(p){ (polsByParty[p.party_id] = polsByParty[p.party_id] || []).push(p); });
          } catch (e) { /* non-critical — cabinet shows party names; Fulfill gates off */ }
        }
        formateurPols = polsByParty[govt.formateur_party_id] || [];
        pmLeader = formateurPols.filter(function(p){ return p.status === 'Party Leader'; })[0] || null;
      }
      // Explicit cabinet appointments (cabinet_appoint) — the authoritative cabinet, overriding
      // the derived defaults. The appointee may be from any party, so resolve name + abbr via the
      // embedded join. Non-critical: on failure the cabinet falls back to the derived view.
      var appts = {};
      if (govt) {
        try {
          const { data: ca } = await supabase.from('cabinet_appointments')
            .select('ministry, politicians(first_name, last_name, parties(abbreviation))').eq('government_id', govt.id);
          (ca || []).forEach(function(c){
            var p = c.politicians; if (!p) return;
            appts[c.ministry] = { name: ((p.first_name || '') + ' ' + (p.last_name || '')).trim(), abbr: (p.parties && p.parties.abbreviation) || '' };
          });
        } catch (e) { /* cabinet falls back to the derived view */ }
      }
      render(govt, NATION || {}, parties || [], agenda, amPM, formation, pmLeader, formateurPols, polsByParty, appts);
    } catch (e) {
      document.getElementById('content').innerHTML = '<div class="panel"><div class="empty">Couldn’t load the government right now. Refresh to try again.</div></div>';
    }
  }

  async function enact(itemId){
    if (busy) return;   // every action here writes — never let a double-click fire twice
    busy = true;
    try {
      const { data, error } = await supabase.rpc('agenda_enact', { p_item: itemId });
      if (error) throw error;
      ping('Promise delivered — Government Confidence +' + Number(data.delta).toFixed(1) + '% (now ' + Number(data.confidence).toFixed(1) + '%).');
      await load();
    } catch (e) { ping(e.message || 'Couldn’t enact that item.'); }
    finally { busy = false; }
  }


  // [Form New Coalition]: burn the agreed deal, drop to a minority. Destructive
  // and one-way, so confirm first. The penalty only lands later, on install.
  async function renege(){
    if (busy) return;
    if (!confirm('Form a new coalition? This dissolves your agreed coalition immediately — you’ll govern alone until you seal a new majority, and you can’t return to the current deal. Building the replacement at the negotiating table costs party actions, so be sure you have some left this turn.')) return;
    busy = true;
    try {
      const { error } = await supabase.rpc('coalition_renege');
      if (error) throw error;
      ping('Coalition dissolved — you’re governing alone. Build a new majority before the turn ends.');
      await load();
    } catch (e) { ping(e.message || 'Couldn’t do that right now.'); }
    finally { busy = false; }
  }

  // [Install New Coalition]: seal the replacement (−5 Confidence, −5% Popularity).
  async function install(negId){
    if (busy) return;
    busy = true;
    try {
      const { data, error } = await supabase.rpc('coalition_install', { p_neg: negId });
      if (error) throw error;
      ping('New coalition installed — Government Confidence ' + Number(data.confidence).toFixed(1) + '%, Popularity −' + data.pop_delta + '%.');
      await load();
    } catch (e) { ping(e.message || 'Couldn’t install that coalition.'); }
    finally { busy = false; }
  }

  // [Enter Agreed Coalition]: keep what formed. No server action — just dismiss
  // the prompt for this government so it doesn't nag on reload.
  function enterAgreed(govId){ sessionStorage.setItem('govConfirmed', govId); load(); }

  (async () => {
    if (!isConfigured) { document.getElementById('content').innerHTML = '<div class="panel"><div class="empty">Supabase isn’t configured.</div></div>'; return; }
    const user = await requireUser();
    if (!user) return; // redirected to login
    try {
      const { data: party, error } = await supabase.from('parties').select('id, nation_id, name, archetype, funds, actions_remaining').eq('user_id', user.id).single();
      if (error || !party) { window.location.replace('/nation-select/'); return; }
      const { data: nation } = await supabase.from('nations').select('name, flag, legislature_seats, ruling_party, economy, declarations').eq('id', party.nation_id).single();
      MY_PARTY_ID = party.id; NATION_ID = party.nation_id; NATION = nation || {};
      // The declared Head of Government title (e.g. "Prime Minister"), via the
      // shared slot loader + declaredValue — one source (see util.js). Keeps the
      // generic label when the nation hasn't declared one.
      const titleSlot = await loadHogTitleSlot(supabase);
      var hogT = titleSlot ? declaredValue(titleSlot, NATION.declarations) : '';
      if (hogT && hogT !== '—') HOG_TITLE = hogT;
      var nationName = (nation && nation.name) || party.nation_id;
      document.getElementById('pname').textContent = party.name;
      document.getElementById('psub').textContent = ideologyLabel(party) + ' · ' + nationName;
      document.getElementById('ghead').textContent = 'Government of ' + nationName;
      if (nation && nation.flag) { var f = document.getElementById('flag'); f.onload = function(){ f.hidden = false; }; f.src = nation.flag; }

      var currency = (nation && nation.economy && nation.economy.currency) || '$';
      setTopbarFunds(currency, party.funds);
      setTopbarActions(party.actions_remaining);

      await load();
    } catch (e) {
      document.getElementById('content').innerHTML = '<div class="panel"><div class="empty">Couldn’t load the government right now. Refresh to try again.</div></div>';
    }
  })();
</script>
</body>
</html>
