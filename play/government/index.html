<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/theme.js"></script>
<title>Government · Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/play.css">
<style>
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}

  /* Left navigation (desktop rail + mobile bottom bar) lives in /sidenav.js */

  .main{flex:1;padding:24px clamp(16px,4vw,56px) 56px;min-width:0}
  .phead .eye{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--indigo)}
  .phead h1{font-weight:900;font-size:clamp(24px,3.6vw,32px);letter-spacing:-.03em;margin-top:4px}
  .phead p{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:620px}

  #content > .panel{margin-top:18px} #content > :first-child{margin-top:20px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
  .panel h2{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:14px}

  /* hemicycle — the National Assembly */
  .hemiwrap{position:relative;display:flex;justify-content:center;padding:2px 0 4px}
  .hemi{width:100%;max-width:440px;height:auto}
  .seatcall{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);text-align:center;line-height:1.05}
  .seatcall b{font-weight:900;font-size:26px;letter-spacing:-.02em}
  .seatcall span{display:block;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:10px}
  .lg{font-size:11.5px;color:var(--muted)} .lg.opp{opacity:.6}
  .lg b{color:var(--ink);font-weight:700}
  .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}

  /* coalition strength — hearts (tutorial shape) */
  .conf__hearts{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:4px}
  .conf__hearts .heart{width:34px;height:34px;fill:none;stroke:var(--line2,#D9D6D0);stroke-width:1.5}
  .conf__hearts .heart.on{stroke:none}
  .conf__note{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.02em;color:var(--soft);line-height:1.5;margin-top:12px}

  .empty{text-align:center;padding:46px 20px;color:var(--soft)}
  .empty b{display:block;color:var(--muted);font-size:16px;margin-bottom:5px}
  .muted{color:var(--soft);font-size:13px;font-style:italic}

  /* State of the Nation — identity declarations + cities (folded in from the retired Nation page;
     the map + nation-browser moved to World; Domestic Economy moved to the Economy page). */
  .decls{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:16px 26px}
  .dgrp__h{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:4px}
  .drow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .drow:last-child{border-bottom:none}
  .drow .dk{color:var(--muted)}
  .drow .dv{font-weight:700;text-align:right}
  .citygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:14px}
  .citycard{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--field)}
  .citycard__hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .cityname{font-weight:800;font-size:15.5px;letter-spacing:-.01em}
  .citycap{font-family:'Space Mono',monospace;font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--indigo);background:var(--indigo-soft);border-radius:20px;padding:3px 8px;flex:none}
  .citypct{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);margin-top:5px}
  .citypct b{color:var(--ink);font-weight:700}
  .citydesc{font-size:13px;color:var(--muted);line-height:1.5;margin-top:8px}
  .citygov{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
  .citygov .g{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .citygov .gk{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
  .citygov .gv{font-weight:700;font-size:13px;text-align:right}
  .citygov .mtag{font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.04em;color:var(--soft);margin-left:2px}

  /* State-of-the-Nation ministry stat groups (collapsible; placeholder "--" until the backend lands) */
  .mgroup{margin-top:22px}
  .mgroup__hd{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:none;border:none;padding:0 2px 12px;cursor:pointer;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
  .mgroup__chev{width:16px;height:16px;stroke:var(--soft);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s}
  .mgroup--closed .mgroup__chev{transform:rotate(180deg)}
  .mgroup--closed .mgroup__grid{display:none}
  .mgroup__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:760px){.mgroup__grid{grid-template-columns:1fr}}
  .mstat{background:var(--field,var(--surface));border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .mstat__k{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
  .mstat__v{font-weight:800;font-size:22px;letter-spacing:-.01em;color:var(--ink);margin-top:9px}
  a.mstat--link{display:block;text-decoration:none;transition:border-color .15s,background .15s}
  a.mstat--link:hover{border-color:var(--indigo);background:var(--indigo-soft)}
  a.mstat--link .mstat__k{display:flex;align-items:center;justify-content:space-between;gap:8px}
  a.mstat--link:hover .mstat__k{color:var(--indigo)}
  .mstat__chev{font-size:15px;color:var(--soft)}
  a.mstat--link:hover .mstat__chev{color:var(--indigo)}

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div id="sidenav"></div><!-- left rail / mobile bottom bar, injected by /sidenav.js -->

  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="phead">
      <span class="eye">The Government</span>
      <h1 id="ghead">Government</h1>
      <p id="glede">Who holds power in the nation, the assembly behind them, and the state of the nation they govern.</p>
    </div>
    <div id="content"><div class="panel"><div class="empty">Loading the government…</div></div></div>
  </main>
</div>

<script type="module">
  import { supabase, isConfigured, requireUser, currentTick } from '/supabase.js';
  import { esc, majority, declaredValue, loadHogTitleSlot, fmtPop, tickToDate } from '/util.js';
  import { fetchAdministrations, renderAdministrations } from '/administrations.js';
  import { partyColor, ideologyLabel } from '/archetypes.js';
  import { nationBudgetBalance, nationStatContributions } from '/policies.js';
  import { fetchBudgetInitiatives } from '/initiatives.js';
  import { mountTopbar, setTopbarActions } from '/topbar.js';
  import { mountSidenav } from '/sidenav.js';

  mountTopbar(); // shared top bar (Discord/Influence/budget/date/gear) into #topbar
  mountSidenav();  // left rail (desktop) / bottom bar (mobile) into #sidenav; active item from the URL

  // Coalition Strength (hearts) is fixed at formation: 2 hearts, plus 1 for every 2 parties
  // in the governing coalition (rounded down). Deterministic from the coalition size — no
  // confidence %, no per-factor breakdown.
  function coalitionHearts(govPartyCount){ return 2 + Math.floor((govPartyCount || 0) / 2); }

  // The hemicycle: government parties fill the arc first (full colour), opposition
  // after (faded); a dashed line marks the majority threshold. Coloured from
  // real seats + archetypes. Geometry is a DELIBERATE standalone copy of the
  // tutorial's (tutorial/government/formed) — that walkthrough is frozen and
  // self-contained, so the two are intentionally not shared.
  function hemicycleSvg(gov, opp, total, maj){
    if (!total) return '';
    var ROWS = 9, RIN = 86, ROUT = 216, CX = 230, CY = 224, RAD = 3.6;
    var radii = []; for (var r = 0; r < ROWS; r++) radii.push(RIN + (ROUT - RIN) * r / (ROWS - 1));
    var totW = radii.reduce(function(a, b){ return a + b; }, 0);
    var per = radii.map(function(R){ return Math.max(2, Math.round(total * R / totW)); });
    var diff = total - per.reduce(function(a, b){ return a + b; }, 0), ri = ROWS - 1;
    while (diff !== 0){ per[ri] += Math.sign(diff); diff -= Math.sign(diff); ri = (ri - 1 + ROWS) % ROWS; }
    var seats = [];
    for (var r2 = 0; r2 < ROWS; r2++){ var n = per[r2], R = radii[r2];
      for (var i = 0; i < n; i++){ var th = Math.PI * (i + 0.5) / n; seats.push({ x: CX - R * Math.cos(th), y: CY - R * Math.sin(th), th: th }); } }
    seats.sort(function(a, b){ return a.th - b.th; });
    var order = gov.concat(opp).map(function(p){ return { s: p.seats || 0, c: partyColor(p), gov: p.in_government ? 1 : 0 }; })
      .filter(function(p){ return p.s > 0; });
    var circles = '', pi = 0, used = 0, boundary = null;
    seats.forEach(function(s, k){
      while (pi < order.length - 1 && used >= order[pi].s){ pi++; used = 0; }
      used++;
      var party = order[pi] || { c: 'var(--chip)', gov: 0 };
      circles += '<circle cx="' + s.x.toFixed(1) + '" cy="' + s.y.toFixed(1) + '" r="' + RAD + '" fill="' + party.c + '" opacity="' + (party.gov ? '1' : '.32') + '"/>';
      if (k === maj - 1) boundary = s.th;
    });
    var line = '';
    if (boundary != null){
      var bt = boundary - (Math.PI / total) * 0.5;
      var x1 = (CX - (RIN - 14) * Math.cos(bt)).toFixed(1), y1 = (CY - (RIN - 14) * Math.sin(bt)).toFixed(1);
      var x2 = (CX - (ROUT + 16) * Math.cos(bt)).toFixed(1), y2 = (CY - (ROUT + 16) * Math.sin(bt)).toFixed(1);
      line = '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="var(--ink)" stroke-width="1.4" stroke-dasharray="3 3" opacity=".5"/>' +
        '<text x="' + x2 + '" y="' + (Number(y2) - 4) + '" fill="var(--ink)" font-family="Space Mono, monospace" font-size="9" text-anchor="middle">' + maj + ' maj</text>';
    }
    return '<svg class="hemi" viewBox="0 0 460 250" aria-hidden="true">' + circles + line + '</svg>';
  }

  function hemiLegend(gov, opp){
    // Only seated parties — the legend describes the chart, which excludes 0-seat parties.
    return gov.concat(opp).filter(function(p){ return (p.seats || 0) > 0; }).map(function(p){
      return '<span class="lg' + (p.in_government ? '' : ' opp') + '"><span class="sw" style="background:' + partyColor(p) + '"></span>' +
        (p.in_government ? '<b>' + esc(p.name) + '</b>' : esc(p.name)) + ' ' + (p.seats || 0) + '</span>';
    }).join('');
  }


  // ---- State of the Nation (folded in from the retired Nation page): the nation's identity
  // declarations and its cities. The world map + nation browser moved to World, and Domestic
  // Economy moved to the Economy page; this is the your-nation summary only. ----

  // Cities roster — capital first, then by population share (desc), then name. The capital is
  // the one whose name matches the declared capital_name (ONE source — the declaration). Each
  // city shows its share of the nation's population and the derived headcount. Flavour only.
  function citiesBox(cities, population, capitalName, mayorAbbr){
    function isCap(c){ return !!capitalName && !!c.name && c.name.trim().toLowerCase() === String(capitalName).trim().toLowerCase(); }
    var list = (cities || []).slice().sort(function(a, b){
      return ((isCap(b) ? 1 : 0) - (isCap(a) ? 1 : 0)) || (Number(b.pop_pct) || 0) - (Number(a.pop_pct) || 0) || ((a.name || '') < (b.name || '') ? -1 : 1);
    });
    var body = list.length
      ? '<div class="citygrid">' + list.map(function(c){
          var pct = (c.pop_pct == null || c.pop_pct === '') ? null : Number(c.pop_pct);
          var head = (pct != null && population) ? ' · ' + fmtPop(Math.round(population * pct / 100)) : '';
          var pctLine = pct != null ? '<div class="citypct"><b>' + pct + '%</b> of population' + head + '</div>' : '';
          var desc = c.description ? '<div class="citydesc">' + esc(c.description) + '</div>' : '';
          // Mayor (NPC) + their party tag ([IND] for an unaffiliated seed) + next election date.
          var govRows = '';
          if (c.mayor_name) {
            var mAbbr = (mayorAbbr && c.mayor_party_id && mayorAbbr[c.mayor_party_id]) ? mayorAbbr[c.mayor_party_id] : 'IND';
            govRows += '<div class="g"><span class="gk">Mayor</span><span class="gv">' + esc(c.mayor_name) + ' <span class="mtag">[' + esc(mAbbr) + ']</span></span></div>';
          }
          if (c.mayor_election_tick != null) govRows += '<div class="g"><span class="gk">Next election</span><span class="gv">' + esc(tickToDate(c.mayor_election_tick)) + '</span></div>';
          var gov = govRows ? '<div class="citygov">' + govRows + '</div>' : '';
          return '<div class="citycard"><div class="citycard__hd"><span class="cityname">' + esc(c.name || 'City') + '</span>' +
            (isCap(c) ? '<span class="citycap">Capital</span>' : '') + '</div>' + pctLine + desc + gov + '</div>';
        }).join('') + '</div>'
      : '<p class="empty" style="padding:20px">No cities have been added yet.</p>';
    return '<section class="panel"><h2>Cities</h2>' + body + '</section>';
  }

  // Assemble the State-of-the-Nation panels (National Identity, Cities) for the given nation,
  // reading the module-level declaration slots + cities loaded at boot. (Domestic Economy moved
  // to the Economy page, which already owns production, stockpiles and population.)
  function stateOfNation(nation){
    var vals = nation.declarations || {};
    var slotBySlug = {}; DECL_SLOTS.forEach(function(s){ slotBySlug[s.slug] = s; });
    function declValue(slug){ return declaredValue(slotBySlug[slug], vals); }

    // National Identity = every declaration slot's current value, grouped.
    var groups = [];
    DECL_SLOTS.forEach(function(s){ var g = s.grp || 'Other'; if (groups.indexOf(g) < 0) groups.push(g); });
    var declHtml = DECL_SLOTS.length
      ? '<div class="decls">' + groups.map(function(g){
          var rows = DECL_SLOTS.filter(function(s){ return (s.grp || 'Other') === g; })
            .map(function(s){ return '<div class="drow"><span class="dk">' + esc(s.label) + '</span><span class="dv">' + esc(declValue(s.slug)) + '</span></div>'; }).join('');
          return '<div class="dgrp"><div class="dgrp__h">' + esc(g) + '</div>' + rows + '</div>';
        }).join('') + '</div>'
      : '<p class="muted" style="padding:8px 0">No declarations have been defined yet.</p>';
    var identityBox = '<section class="panel"><h2>National Identity</h2>' + declHtml + '</section>';

    return identityBox + citiesBox(CITIES, nation.population, declValue('capital_name'), MAYOR_ABBR);
  }

  // State-of-the-Nation ministry stats — one collapsible group per ministry cluster. Each cell
  // computes from the nation's admin-authored ministry_stats base + in-force policy contributions
  // (policies.js), so a cell shows "--" only when nothing has set it. Every POLICY_STATS entry is
  // placed in a group here, so any stat an admin can author (or a policy can target) actually surfaces.
  var STAT_GROUPS = [
    { name: 'Head of Government', stats: ['Budget Balance', 'Growth', 'Bureaucracy'] },
    { name: 'Finance', stats: ['Tax Burden', 'Public Debt', 'Interest Rates'] },
    { name: 'Interior', stats: ['Crime', 'Immigration', 'Extremism', 'Birth Rate', 'Demographic Pressure'] },
    { name: 'Economy', stats: ['Unemployment', 'Poverty', 'Wages', 'Innovation', 'Infrastructure'] },
    { name: 'Labor, Health and Social Affairs', stats: ['Prosperity', 'Press Freedom', 'Social Integration', 'Health', 'Education', 'Pension Quality'] },
    { name: 'Society', stats: ['Rule of Law', 'Standard of Living', 'Housing Affordability', 'Equity Between Generations'] },
    { name: 'Defense', stats: ['Armed Forces Funding', 'Military Research', 'Cybersecurity'] },
    { name: 'Environment', stats: ['CO₂ Emissions', 'Global Warming', 'Energy Availability', 'Environment'] }
  ];
  // Budget Balance is the one ministry stat with its own screen (/play/budget/) — a
  // slug→href map keeps that special-case out of the generic cell loop.
  var STAT_LINKS = { 'Budget Balance': '/play/budget/', 'Bureaucracy': '/play/bureaucracy/' };
  // Ministry stat values come from the nation's admin-authored ministry_stats map (schema/150,
  // keyed by the same stat names) — the ONE source. Some cells are computed instead: Budget
  // Balance and Bureaucracy = the sum of in-force policy effects (policies.js, the same figures
  // their detail pages show), and Public Debt = economy.debt (the "Starting Debt" field).
  function ministryStats(nation){
    var MS = (nation && nation.ministry_stats) || {};
    var ec = (nation && nation.economy) || {};
    var cur = ec.currency || '$';
    function cellVal(s){
      if (s === 'Budget Balance'){
        if (BUDGET_BAL == null || !isFinite(BUDGET_BAL)) return '--';
        var b = Math.round(BUDGET_BAL * 10) / 10;
        return '<span style="color:var(--' + (b < 0 ? 'red' : 'green') + ')">' + (b < 0 ? '−' : '') + esc(cur) + Math.abs(b) +
          'bn<span style="font-size:13px;font-weight:700;color:var(--soft)"> /yr</span></span>';
      }
      if (s === 'Bureaucracy'){
        return (BUREAUCRACY == null || !isFinite(BUREAUCRACY)) ? '--' : Math.round(BUREAUCRACY) + '%';
      }
      if (s === 'Public Debt'){
        var n = Number(ec.debt);
        return (ec.debt == null || ec.debt === '' || !isFinite(n)) ? '--' : esc(cur) + Math.abs(n) + 'bn';
      }
      // Every other ministry stat: its authored base (ministry_stats) + the cumulative contribution of
      // in-force policies (policies.js) — the same model as Budget Balance/Bureaucracy. "--" only when
      // there's no base and no policy touches it.
      var contrib = nationStatContributions(STAT_POLS, STAT_OV, STAT_GDP, s).total;
      var hasBase = MS[s] != null && MS[s] !== '';
      if (!hasBase && Math.abs(contrib) < 0.0001) return '--';
      return esc(String(Math.round(((hasBase ? Number(MS[s]) : 0) + contrib) * 10) / 10));
    }
    return STAT_GROUPS.map(function (g) {
      var cells = g.stats.map(function (s) {
        var val = cellVal(s);
        var href = STAT_LINKS[s];
        if (href) {
          return '<a class="mstat mstat--link" href="' + href + '"><div class="mstat__k">' + esc(s) +
            '<span class="mstat__chev">&rsaquo;</span></div><div class="mstat__v">' + val + '</div></a>';
        }
        return '<div class="mstat"><div class="mstat__k">' + esc(s) + '</div><div class="mstat__v">' + val + '</div></div>';
      }).join('');
      return '<section class="mgroup"><button class="mgroup__hd" type="button"><span>' + esc(g.name) + '</span>' +
        '<svg class="mgroup__chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>' +
        '<div class="mgroup__grid">' + cells + '</div></section>';
    }).join('');
  }
  function wireStatGroups(box){
    box.querySelectorAll('.mgroup__hd').forEach(function (b) { b.onclick = function () { b.parentElement.classList.toggle('mgroup--closed'); }; });
  }

  function render(govt, nation, parties){
    var box = document.getElementById('content');
    if (!govt){
      // Two distinct "no government" reasons: a one-party state never forms a
      // coalition government, vs a multiparty nation that simply hasn't voted yet.
      var oneParty = !!(nation && nation.ruling_party);
      box.innerHTML = '<div class="panel"><div class="empty"><b>' +
        (oneParty ? 'No coalition government' : 'No government has formed yet') + '</b><span>' +
        (oneParty
          ? esc(nation.name || 'This nation') + ' is a one-party state — power isn’t shared through a coalition, so there’s no Government Confidence to track here.'
          : 'A government is seated when the nation holds its first general election.') +
        '</span></div></div>' +
        ministryStats(nation) + stateOfNation(nation);   // stats + economy/identity/cities still apply without a government
      wireStatGroups(box);
      return;
    }
    var byId = {}; parties.forEach(function(p){ byId[p.id] = p; });
    var formateur = byId[govt.formateur_party_id] || { name: 'A party', archetype: '', seats: 0 };
    var tc = partyColor(formateur);
    document.documentElement.style.setProperty('--tc', tc);

    // Government members: the formateur first, then by seats.
    var gov = parties.filter(function(p){ return p.in_government; }).sort(function(a,b){
      if (a.id === govt.formateur_party_id) return -1;
      if (b.id === govt.formateur_party_id) return 1;
      return (b.seats||0) - (a.seats||0);
    });
    var opp = parties.filter(function(p){ return !p.in_government; }).sort(function(a,b){ return (b.seats||0)-(a.seats||0); });
    var govSeats = gov.reduce(function(s,p){ return s + (p.seats||0); }, 0);
    var total = nation.legislature_seats || 0;
    var maj = majority(total);
    var hearts = coalitionHearts(gov.length);   // 2 + 1 per 2 coalition parties (rounded down)
    var heartsHtml = '';
    for (var hi = 0; hi < hearts; hi++) {
      heartsHtml += '<svg class="heart on" viewBox="0 0 24 24" style="fill:var(--green)">' +
        '<path d="M12 21s-8-5.3-8-11a4.6 4.6 0 0 1 8-2.9 4.6 4.6 0 0 1 8 2.9c0 5.7-8 11-8 11z"/></svg>';
    }

    box.innerHTML =
      // 1 — Coalition Strength (hearts, fixed at formation from the coalition size)
      '<div class="panel"><h2>Coalition Strength</h2>' +
        '<div class="conf__hearts">' + heartsHtml + '</div>' +
        '<div class="conf__note">Set when the government forms: 2 hearts, plus 1 for every 2 parties in the governing coalition (' +
          gov.length + ' part' + (gov.length === 1 ? 'y' : 'ies') + ' → ' + hearts + ' heart' + (hearts === 1 ? '' : 's') + ').</div>' +
      '</div>' +
      // 2 — The National Assembly (hemicycle)
      '<div class="panel"><h2>The National Assembly</h2>' +
        '<div class="hemiwrap">' + hemicycleSvg(gov, opp, total, maj) +
          '<div class="seatcall"><b>' + govSeats + '</b><span>of ' + total + ' · majority ' + maj + (govSeats >= maj ? ' ✓' : '') + '</span></div>' +
        '</div>' +
        '<div class="legend">' + hemiLegend(gov, opp) + '</div>' +
      '</div>' +
      // 3 — State-of-the-Nation ministry stats (placeholder values until the backend lands),
      // sitting above the folded-in economy / identity / cities.
      ministryStats(nation) +
      stateOfNation(nation) +
      // 4 — the collapsible Administration History (past + current governments and their events).
      '<div id="adminHistory"></div>';

    wireStatGroups(box);
  }

  // --- state shared across renders ---
  var MY_PARTY_ID = null, NATION = null, NATION_ID = null, HOG_TITLE = 'Head of Government';
  var BUDGET_BAL = null;   // computed Budget Balance ($bn/yr) — Σ in-force policy effects (policies.js); null until loaded
  var BUREAUCRACY = null;  // computed Bureaucracy (%) — Σ in-force policy Bureaucracy effects; null until loaded
  // Every other ministry stat = its authored base (ministry_stats) + Σ in-force policy contribution;
  // these hold the inputs so cellVal can compute each one (policies.js is the one source).
  var STAT_POLS = [], STAT_OV = {}, STAT_GDP = null;
  // State-of-the-Nation data, folded in from the retired Nation page (declaration slots +
  // cities + mayor party tags). Loaded once at boot; the panels read straight from these.
  var DECL_SLOTS = [], CITIES = [], MAYOR_ABBR = {};


  // State-of-the-Nation data (declaration slots + cities + mayor party tags), folded in from
  // the retired Nation page. Loaded once at boot; each fetch is non-fatal so a missing/unmigrated
  // table just leaves the corresponding panel in its empty state rather than failing the page.
  async function loadNationState(){
    try {
      const { data: slots } = await supabase.from('declarations').select('slug, label, options, default_index, custom_allowed, grp, sort_order').order('sort_order').order('created_at');
      DECL_SLOTS = slots || [];
    } catch (e) { DECL_SLOTS = []; }
    try {
      var cRes = await supabase.from('cities').select('id, name, pop_pct, description, mayor_name, mayor_election_tick, mayor_party_id').eq('nation_id', NATION_ID);
      if (cRes.error) cRes = await supabase.from('cities').select('id, name, pop_pct, description, mayor_name, mayor_election_tick').eq('nation_id', NATION_ID);   // mayor_party_id not migrated yet
      if (!cRes.error) CITIES = cRes.data || [];
    } catch (e) { CITIES = []; }
    try {
      var mpIds = Array.from(new Set(CITIES.map(function(c){ return c.mayor_party_id; }).filter(Boolean)));
      if (mpIds.length) { var mpRes = await supabase.from('parties').select('id, abbreviation').in('id', mpIds); (mpRes.data || []).forEach(function(p){ MAYOR_ABBR[p.id] = p.abbreviation; }); }
    } catch (e) {}
  }

  // Re-fetch the government + parties and redraw.
  async function load(){
    try {
      const { data: govt } = await supabase.from('governments')
        .select('*').eq('nation_id', NATION_ID).eq('status', 'active').maybeSingle();
      const { data: parties } = await supabase.from('parties')
        .select('id, name, abbreviation, seats, archetype, in_government, color').eq('nation_id', NATION_ID);
      render(govt, NATION || {}, parties || []);
      // Administration History (collapsible, past + current governments) — non-blocking enhancement.
      var ahTick = null; try { ahTick = await currentTick(); } catch (e) { /* duration falls back to the formed tick */ }
      fetchAdministrations(NATION_ID).then(function(ah){
        renderAdministrations(document.getElementById('adminHistory'), ah, { currentTick: ahTick, hogTitle: HOG_TITLE });
      }).catch(function(){ /* history is a non-critical add-on */ });
    } catch (e) {
      document.getElementById('content').innerHTML = '<div class="panel"><div class="empty">Couldn’t load the government right now. Refresh to try again.</div></div>';
    }
  }

  (async () => {
    if (!isConfigured) { document.getElementById('content').innerHTML = '<div class="panel"><div class="empty">Supabase isn’t configured.</div></div>'; return; }
    const user = await requireUser();
    if (!user) return; // redirected to login
    try {
      const { data: party, error } = await supabase.from('parties').select('id, nation_id, name, archetype, influence').eq('user_id', user.id).single();
      if (error || !party) { window.location.replace('/nation-select/'); return; }
      var nRes = await supabase.from('nations').select('name, flag, legislature_seats, ruling_party, economy, declarations, population, gdp, policies, ministry_stats').eq('id', party.nation_id).single();
      if (nRes.error) nRes = await supabase.from('nations').select('name, flag, legislature_seats, ruling_party, economy, declarations, population, gdp, policies').eq('id', party.nation_id).single();   // ministry_stats not migrated yet
      const nation = nRes.data;
      MY_PARTY_ID = party.id; NATION_ID = party.nation_id; NATION = nation || {};
      // The declared Head of Government title (e.g. "Prime Minister"), via the
      // shared slot loader + declaredValue — one source (see util.js). Keeps the
      // generic label when the nation hasn't declared one.
      const titleSlot = await loadHogTitleSlot(supabase);
      var hogT = titleSlot ? declaredValue(titleSlot, NATION.declarations) : '';
      if (hogT && hogT !== '—') HOG_TITLE = hogT;
      var nationName = (nation && nation.name) || party.nation_id;
      document.getElementById('pname').textContent = party.name;
      document.getElementById('psub').textContent = ideologyLabel(party) + ' · ' + nationName;
      document.getElementById('ghead').textContent = 'Government of ' + nationName;
      if (nation && nation.flag) { var f = document.getElementById('flag'); f.onload = function(){ f.hidden = false; }; f.src = nation.flag; }

      var currency = (nation && nation.economy && nation.economy.currency) || '$';
      setTopbarActions(party.influence);

      // Budget Balance and Bureaucracy are computed from the nation's in-force policy effects (one
      // source: policies.js) — the same figures their detail pages show. Non-fatal — cells fall back to "--".
      try {
        const { data: pols } = await supabase.from('policies').select('id, definition');
        var _ov = (nation && nation.policies) || {}, _gdp = nation && nation.gdp;
        var _inits = await fetchBudgetInitiatives(party.nation_id);
        BUDGET_BAL = nationBudgetBalance(pols || [], _ov, _gdp, _inits);
        BUREAUCRACY = nationStatContributions(pols || [], _ov, _gdp, 'Bureaucracy').total;
        STAT_POLS = pols || []; STAT_OV = _ov; STAT_GDP = _gdp;
      } catch (e) {}

      await loadNationState();   // declaration slots + cities for the State-of-the-Nation panels
      await load();
    } catch (e) {
      document.getElementById('content').innerHTML = '<div class="panel"><div class="empty">Couldn’t load the government right now. Refresh to try again.</div></div>';
    }
  })();
</script>
</body>
</html>
