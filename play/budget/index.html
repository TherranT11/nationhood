<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/theme.js"></script>
<title>Budget · Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/play.css">
<style>
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}

  /* Left navigation (desktop rail + mobile bottom bar) lives in /sidenav.js */

  .main{flex:1;padding:24px clamp(16px,4vw,56px) 56px;min-width:0}
  .page{max-width:900px}
  .back{display:inline-flex;align-items:center;gap:6px;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-decoration:none;margin-bottom:14px}
  .back:hover{color:var(--ink)}
  .phead .eye{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
  .phead h1{font-weight:900;font-size:clamp(26px,4vw,36px);letter-spacing:-.025em;margin:6px 0 22px}

  /* Budget Balance headline + sparkline. Placeholder ($--) until the backend lands. */
  .bhero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}
  .bhero__k{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-bottom:8px}
  .bhero__v{font-size:34px;font-weight:900;letter-spacing:-.03em;color:var(--ink)}
  .bhero__u{font-size:15px;font-weight:700;color:var(--soft);margin-left:4px}
  .bhero__chart{width:100%;height:56px;display:block;margin-top:10px}

  .bsum{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  .bsum__card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .bsum__k{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;margin-bottom:8px}
  .bsum__k--rev{color:var(--green)}
  .bsum__k--spend{color:var(--red)}
  .bsum__v{font-size:24px;font-weight:900;letter-spacing:-.02em;color:var(--ink)}
  .bsum__bar{height:6px;border-radius:4px;background:var(--chip);overflow:hidden;margin-top:12px}
  .bsum__bar span{display:block;height:100%;border-radius:4px;width:0}

  .bdebt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:18px}
  .bdebt__k{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-bottom:6px}
  .bdebt__v{font-size:24px;font-weight:900;letter-spacing:-.02em;color:var(--ink)}

  .budtabs{display:flex;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px}
  .budtab{flex:1;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:none;border:none;border-radius:9px;padding:10px;cursor:pointer;transition:background .15s,color .15s}
  .budtab.is-on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px -1px rgba(0,0,0,.18)}
  .budhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
  .budhead__t{font-size:17px;font-weight:900;letter-spacing:-.01em;color:var(--ink)}
  .budhead__u{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}
  .budlist{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
  .bud{padding:14px 0;border-top:1px solid var(--line)}
  .bud:first-child{border-top:none}
  .bud__row{display:flex;align-items:center;gap:11px}
  .bud__ico{width:24px;height:24px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800;line-height:1}
  .bud__ico--up{background:var(--green)}
  .bud__ico--down{background:var(--red)}
  .bud__name{flex:1;min-width:0;font-size:15px;font-weight:700;color:var(--ink)}
  .bud__val{font-family:'Space Mono',monospace;font-size:15px;font-weight:700;white-space:nowrap;color:var(--soft)}
  .bud__bar{height:6px;border-radius:4px;background:var(--chip);overflow:hidden;margin:10px 0 0 35px}
  .bud__bar span{display:block;height:100%;border-radius:4px;width:0}

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div id="sidenav"></div><!-- left rail / mobile bottom bar, injected by /sidenav.js -->

  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="page">
      <a class="back" href="/play/government/">&lsaquo; Government</a>
      <div class="phead">
        <span class="eye" id="bnation">The Nation</span>
        <h1>Budget</h1>
      </div>

      <!-- Budget Balance = the nation's Income (economy.budget — the same figure the topbar
           shows). Revenue mirrors it. Spending / Public Debt / line items stay "$--" until the
           budget backend lands. -->
      <div class="bhero">
        <div class="bhero__k">Budget Balance</div>
        <div class="bhero__v" id="balVal">$--</div>
        <svg class="bhero__chart" viewBox="0 0 300 56" preserveAspectRatio="none" aria-hidden="true">
          <line x1="0" y1="28" x2="300" y2="28" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 5" vector-effect="non-scaling-stroke"/>
        </svg>
      </div>

      <div class="bsum">
        <div class="bsum__card">
          <div class="bsum__k bsum__k--rev">Revenue</div>
          <div class="bsum__v" id="revVal">$--</div>
          <div class="bsum__bar"><span style="background:var(--green)"></span></div>
        </div>
        <div class="bsum__card">
          <div class="bsum__k bsum__k--spend">Spending</div>
          <div class="bsum__v">$--</div>
          <div class="bsum__bar"><span style="background:var(--red)"></span></div>
        </div>
      </div>

      <div class="bdebt">
        <div class="bdebt__k">Public Debt</div>
        <div class="bdebt__v" id="debtVal">$--</div>
      </div>

      <div class="budtabs">
        <button class="budtab is-on" data-tab="revenue" type="button">Revenue</button>
        <button class="budtab" data-tab="spending" type="button">Spending</button>
      </div>
      <div class="budhead"><span class="budhead__t" id="budTitle">Active Revenue Items</span><span class="budhead__u">$ / year</span></div>
      <div class="budlist" id="budList"></div>
    </div>
  </main>
</div>

<script type="module">
  import { supabase, isConfigured, requireUser } from '/supabase.js';
  import { esc, declaredValue } from '/util.js';
  import { ideologyLabel } from '/archetypes.js';
  import { mountTopbar, setTopbarActions } from '/topbar.js';
  import { mountSidenav } from '/sidenav.js';

  mountTopbar();   // shared top bar (Discord/Influence/budget/date/gear) into #topbar
  mountSidenav();  // left rail (desktop) / bottom bar (mobile) into #sidenav

  // The standard budget line items — universal revenue and spending categories. Amounts
  // are placeholders ("$--") for every nation until the budget backend is built; the
  // names and their up/down direction are the layout the numbers will later fill.
  var REVENUE = ['Sales Tax', 'Wage Tax', 'Corporate Income Tax', 'Alcohol Tax', 'Business Tax', 'Tobacco Tax', 'Capital Gains Tax', 'Inheritance Tax'];
  var SPENDING = ['Pension Insurance', 'Healthcare', 'Armed Forces Funding', 'Education Spending', 'Federal Police', 'Child Benefit', 'University Funding', 'Civil Service Pension', 'Interest on Public Debt', 'Basic Income Support'];
  var TABS = {
    revenue:  { items: REVENUE,  dir: 'up',   arrow: '↑', title: 'Active Revenue Items' },
    spending: { items: SPENDING, dir: 'down', arrow: '↓', title: 'Active Spending Items' }
  };

  function render(tab){
    var cfg = TABS[tab];
    document.getElementById('budTitle').textContent = cfg.title;
    document.getElementById('budList').innerHTML = cfg.items.map(function (name) {
      return '<div class="bud">' +
        '<div class="bud__row">' +
          '<span class="bud__ico bud__ico--' + cfg.dir + '">' + cfg.arrow + '</span>' +
          '<span class="bud__name">' + esc(name) + '</span>' +
          '<span class="bud__val">$--</span>' +
        '</div>' +
        '<div class="bud__bar"><span style="background:var(--' + (cfg.dir === 'up' ? 'green' : 'red') + ');opacity:.5"></span></div>' +
      '</div>';
    }).join('');
  }
  var tabs = document.querySelectorAll('.budtab');
  tabs.forEach(function (t) { t.addEventListener('click', function () {
    tabs.forEach(function (x) { x.classList.remove('is-on'); });
    t.classList.add('is-on');
    render(t.dataset.tab);
  }); });
  render('revenue');

  (async () => {
    if (!isConfigured) return;
    const user = await requireUser();
    if (!user) return; // redirected to login
    try {
      const { data: party, error } = await supabase.from('parties').select('id, nation_id, name, archetype, influence').eq('user_id', user.id).single();
      if (error || !party) { window.location.replace('/nation-select/'); return; }
      const { data: nation } = await supabase.from('nations').select('name, flag, declarations, economy').eq('id', party.nation_id).single();
      // Eyebrow = the nation's formal state name if declared, else its plain name.
      var nationName = (nation && nation.name) || party.nation_id;
      try {
        const { data: slots } = await supabase.from('declarations').select('slug, label, options, default_index, custom_allowed').eq('slug', 'formal_state_name').limit(1);
        var formal = (slots && slots[0]) ? declaredValue(slots[0], nation && nation.declarations) : '';
        if (formal && formal !== '—') nationName = formal;
      } catch (e) {}
      document.getElementById('bnation').textContent = nationName;
      // Fill the shared sidenav brand (flag / party name / ideology · nation).
      document.getElementById('pname').textContent = party.name;
      document.getElementById('psub').textContent = ideologyLabel(party) + ' · ' + ((nation && nation.name) || party.nation_id);
      if (nation && nation.flag) { var f = document.getElementById('flag'); f.onload = function () { f.hidden = false; }; f.src = nation.flag; }
      setTopbarActions(party.influence);

      // Budget Balance = Income (economy.budget, the same field the topbar renders as income),
      // and Revenue mirrors it. Both show the real value — including $0 — falling back to "$--"
      // only when the nation has no income figure at all.
      var ec = (nation && nation.economy) || {};
      var cur = ec.currency || '$';
      var n = Number(ec.budget);
      if (ec.budget != null && ec.budget !== '' && isFinite(n)) {   // isFinite guards a corrupt/non-numeric value
        var sign = n < 0 ? '−' : '';
        document.getElementById('balVal').innerHTML = sign + esc(cur) + Math.abs(n) + 'bn<span class="bhero__u"> /yr</span>';
        document.getElementById('balVal').style.color = n < 0 ? 'var(--red)' : 'var(--green)';
        document.getElementById('revVal').textContent = sign + cur + Math.abs(n) + 'bn';
      }
      // Public Debt = economy.debt (the "Starting Debt" field), the same source as the
      // Government page's Public Debt cell. Shown as a stock; "$--" when unset.
      var d = Number(ec.debt);
      if (ec.debt != null && ec.debt !== '' && isFinite(d)) {
        document.getElementById('debtVal').textContent = cur + Math.abs(d) + 'bn';
      }
    } catch (e) { /* placeholders already shown; topbar still renders */ }
  })();
</script>
</body>
</html>
