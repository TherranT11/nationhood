<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/theme.js"></script>
<title>Budget · Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/play.css">
<style>
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}

  /* Left navigation (desktop rail + mobile bottom bar) lives in /sidenav.js */

  .main{flex:1;padding:24px clamp(16px,4vw,56px) 56px;min-width:0}
  .page{max-width:900px}
  .back{display:inline-flex;align-items:center;gap:6px;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-decoration:none;margin-bottom:14px}
  .back:hover{color:var(--ink)}
  .phead .eye{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
  .phead h1{font-weight:900;font-size:clamp(26px,4vw,36px);letter-spacing:-.025em;margin:6px 0 22px}

  /* Budget Balance headline + sparkline. Placeholder ($--) until the backend lands. */
  .bhero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}
  .bhero__k{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-bottom:8px}
  .bhero__v{font-size:34px;font-weight:900;letter-spacing:-.03em;color:var(--ink)}
  .bhero__u{font-size:15px;font-weight:700;color:var(--soft);margin-left:4px}
  .bhero__chart{width:100%;height:56px;display:block;margin-top:10px}

  .bsum{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  .bsum__card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .bsum__k{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;margin-bottom:8px}
  .bsum__k--rev{color:var(--green)}
  .bsum__k--spend{color:var(--red)}
  .bsum__v{font-size:24px;font-weight:900;letter-spacing:-.02em;color:var(--ink)}
  .bsum__bar{height:6px;border-radius:4px;background:var(--chip);overflow:hidden;margin-top:12px}
  .bsum__bar span{display:block;height:100%;border-radius:4px;width:0}

  .bdebt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:18px}
  .bdebt__k{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-bottom:6px}
  .bdebt__v{font-size:24px;font-weight:900;letter-spacing:-.02em;color:var(--ink)}

  /* Budget History — the debt-movement + purchase ledger (kind 'budget' events + trade imports). */
  .bhist{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px 6px;margin-bottom:14px}
  .bhist__h{display:flex;align-items:baseline;gap:9px;font-size:15px;font-weight:800;letter-spacing:-.01em;color:var(--ink);margin-bottom:6px}
  .bhist__u{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);font-weight:400}
  .bhist__list{max-height:280px;overflow-y:auto;margin:0 -4px}
  .bhrow{display:flex;gap:11px;padding:10px 4px;border-top:1px solid var(--line)}
  .bhrow:first-child{border-top:none}
  .bhrow__stripe{width:3px;border-radius:2px;flex:none;background:var(--soft)}
  .bhrow__stripe--pos{background:var(--green)}
  .bhrow__stripe--neg{background:var(--red)}
  .bhrow__body{flex:1;min-width:0}
  .bhrow__date{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);margin-bottom:3px}
  .bhrow__txt{font-size:13.5px;line-height:1.4;color:var(--ink)}
  .bhist__empty{color:var(--soft);font-size:13px;padding:12px 4px}

  .budtabs{display:flex;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px}
  .budtab{flex:1;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:none;border:none;border-radius:9px;padding:10px;cursor:pointer;transition:background .15s,color .15s}
  .budtab.is-on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px -1px rgba(0,0,0,.18)}
  .budhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
  .budhead__t{font-size:17px;font-weight:900;letter-spacing:-.01em;color:var(--ink)}
  .budhead__u{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}
  .budlist{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
  .bud{padding:14px 0;border-top:1px solid var(--line)}
  .bud:first-child{border-top:none}
  .bud__row{display:flex;align-items:center;gap:11px}
  .bud__ico{width:24px;height:24px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800;line-height:1}
  .bud__ico--up{background:var(--green)}
  .bud__ico--down{background:var(--red)}
  .bud__name{flex:1;min-width:0;font-size:15px;font-weight:700;color:var(--ink)}
  .bud__val{font-family:'Space Mono',monospace;font-size:15px;font-weight:700;white-space:nowrap;color:var(--soft)}
  .bud__val--up{color:var(--green)} .bud__val--down{color:var(--red)}
  .bud__bar{height:6px;border-radius:4px;background:var(--chip);overflow:hidden;margin:10px 0 0 35px}
  .bud__bar span{display:block;height:100%;border-radius:4px;width:0}

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div id="sidenav"></div><!-- left rail / mobile bottom bar, injected by /sidenav.js -->

  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="page">
      <a class="back" href="/play/government/">&lsaquo; Government</a>
      <div class="phead">
        <span class="eye" id="bnation">The Nation</span>
        <h1>Budget</h1>
      </div>

      <!-- Budget Balance = the nation's Income (economy.budget — the same figure the topbar
           shows). Revenue mirrors it. Spending / Public Debt / line items stay "$--" until the
           budget backend lands. -->
      <div class="bhero">
        <div class="bhero__k">Budget Balance</div>
        <div class="bhero__v" id="balVal">$--</div>
        <svg class="bhero__chart" id="sparkline" viewBox="0 0 300 56" preserveAspectRatio="none" aria-hidden="true">
          <line x1="0" y1="28" x2="300" y2="28" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 5" vector-effect="non-scaling-stroke"/>
        </svg>
      </div>

      <div class="bhist">
        <div class="bhist__h">Budget History <span class="bhist__u">debt movements &amp; purchases</span></div>
        <div class="bhist__list" id="budHist"><p class="bhist__empty">Loading…</p></div>
      </div>

      <div class="bsum">
        <div class="bsum__card">
          <div class="bsum__k bsum__k--rev">Revenue</div>
          <div class="bsum__v" id="revVal">$--</div>
          <div class="bsum__bar"><span id="revBar" style="background:var(--green)"></span></div>
        </div>
        <div class="bsum__card">
          <div class="bsum__k bsum__k--spend">Spending</div>
          <div class="bsum__v" id="spendVal">$--</div>
          <div class="bsum__bar"><span id="spendBar" style="background:var(--red)"></span></div>
        </div>
      </div>

      <div class="bdebt">
        <div class="bdebt__k">Public Debt</div>
        <div class="bdebt__v" id="debtVal">$--</div>
      </div>

      <div class="budtabs">
        <button class="budtab is-on" data-tab="revenue" type="button">Revenue</button>
        <button class="budtab" data-tab="spending" type="button">Spending</button>
      </div>
      <div class="budhead"><span class="budhead__t" id="budTitle">Active Revenue Items</span><span class="budhead__u">$ / year</span></div>
      <div class="budlist" id="budList"></div>
    </div>
  </main>
</div>

<script type="module">
  import { supabase, isConfigured, requireUser } from '/supabase.js';
  import { esc, declaredValue } from '/util.js';
  import { ideologyLabel } from '/archetypes.js';
  import { mountTopbar, setTopbarActions } from '/topbar.js';
  import { mountSidenav } from '/sidenav.js';
  import { policyBudgetContribution, isTradePolicy, initiativeBudgetItems } from '/policies.js';
  import { fetchBudgetInitiatives } from '/initiatives.js';

  mountTopbar();   // shared top bar (Discord/Influence/Budget Balance/date/gear) into #topbar
  mountSidenav();  // left rail (desktop) / bottom bar (mobile) into #sidenav

  // Budget Balance = the net of every policy's in-force Budget Balance contribution — the ones
  // that ADD (revenue) minus the ones that SUBTRACT (spending). REV / SPEND are the contributing
  // policies split by sign; computed once at load, then the tabs just re-render them.
  var REV = [], SPEND = [], CUR = '$';
  function fmt(v){ return CUR + (Math.round(Math.abs(v) * 10) / 10) + 'bn'; }

  function render(tab){
    var isRev = tab === 'revenue', items = isRev ? REV : SPEND, dir = isRev ? 'up' : 'down', arrow = isRev ? '↑' : '↓';
    document.getElementById('budTitle').textContent = isRev ? 'Active Revenue Items' : 'Active Spending Items';
    var max = items.reduce(function (m, i) { return Math.max(m, Math.abs(i.amount)); }, 0) || 1;
    document.getElementById('budList').innerHTML = items.length ? items.map(function (it) {
      var w = Math.max(4, Math.round(Math.abs(it.amount) / max * 100));
      return '<div class="bud"><div class="bud__row">' +
        '<span class="bud__ico bud__ico--' + dir + '">' + arrow + '</span>' +
        '<span class="bud__name">' + esc(it.name) + '</span>' +
        '<span class="bud__val bud__val--' + dir + '">' + fmt(it.amount) + '</span></div>' +
        '<div class="bud__bar"><span class="bud__fill--' + dir + '" style="width:' + w + '%;background:var(--' + (isRev ? 'green' : 'red') + ');opacity:.5"></span></div></div>';
    }).join('') : '<div class="bud"><div class="bud__row"><span class="bud__name" style="color:var(--soft);font-weight:600">No active ' + (isRev ? 'revenue' : 'spending') + ' policies.</span></div></div>';
  }

  // Budget History — the debt-movement + purchase ledger. Newest first for the list.
  function renderHistory(rows){
    var box = document.getElementById('budHist');
    if (rows === null) { box.innerHTML = '<p class="bhist__empty">Couldn’t load budget history.</p>'; drawSparkline([]); return; }
    if (!rows.length) { box.innerHTML = '<p class="bhist__empty">No budget activity yet. Debt interest, budget-balance moves and purchases will appear here as the game runs.</p>'; drawSparkline([]); return; }
    box.innerHTML = rows.map(function (e){
      var t = e.tone === 'pos' ? 'pos' : e.tone === 'neg' ? 'neg' : '';
      return '<div class="bhrow"><span class="bhrow__stripe' + (t ? ' bhrow__stripe--' + t : '') + '"></span>' +
        '<div class="bhrow__body"><div class="bhrow__date">' + esc(e.game_date || '—') + '</div>' +
        '<div class="bhrow__txt">' + esc(e.body || '') + '</div></div></div>';
    }).join('');
    // The sparkline plots the resulting debt over time (oldest → newest).
    drawSparkline(rows.slice().reverse().map(function (e){ return Number(e.debt_after); }).filter(isFinite));
  }
  // Draw the Public-Debt trajectory into the hero SVG. Under 2 points, keep the dashed placeholder.
  function drawSparkline(series){
    var svg = document.getElementById('sparkline');
    if (!svg || !series || series.length < 2) return;
    var W = 300, H = 56, pad = 6, n = series.length;
    var min = Math.min.apply(null, series), max = Math.max.apply(null, series), span = (max - min) || 1;
    var pts = series.map(function (v, i){ return [ (i / (n - 1)) * W, H - pad - ((v - min) / span) * (H - 2 * pad) ]; });
    var line = pts.map(function (p, i){ return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
    var area = 'M' + pts[0][0].toFixed(1) + ' ' + H + ' ' + line.replace(/^M/, 'L') + ' L' + pts[n-1][0].toFixed(1) + ' ' + H + ' Z';
    svg.innerHTML =
      '<path d="' + area + '" fill="var(--indigo-soft, rgba(107,92,255,.14))" stroke="none"/>' +
      '<path d="' + line + '" fill="none" stroke="var(--indigo, #6b5cff)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="' + pts[n-1][0].toFixed(1) + '" cy="' + pts[n-1][1].toFixed(1) + '" r="2.6" fill="var(--indigo, #6b5cff)"/>';
  }

  var tabs = document.querySelectorAll('.budtab');
  tabs.forEach(function (t) { t.addEventListener('click', function () {
    tabs.forEach(function (x) { x.classList.remove('is-on'); });
    t.classList.add('is-on');
    render(t.dataset.tab);
  }); });
  render('revenue');

  (async () => {
    if (!isConfigured) return;
    const user = await requireUser();
    if (!user) return; // redirected to login
    try {
      const { data: party, error } = await supabase.from('parties').select('id, nation_id, name, archetype, influence').eq('user_id', user.id).single();
      if (error || !party) { window.location.replace('/nation-select/'); return; }
      const { data: nation } = await supabase.from('nations').select('name, flag, declarations, economy, policies, gdp').eq('id', party.nation_id).single();
      // Eyebrow = the nation's formal state name if declared, else its plain name.
      var nationName = (nation && nation.name) || party.nation_id;
      try {
        const { data: slots } = await supabase.from('declarations').select('slug, label, options, default_index, custom_allowed').eq('slug', 'formal_state_name').limit(1);
        var formal = (slots && slots[0]) ? declaredValue(slots[0], nation && nation.declarations) : '';
        if (formal && formal !== '—') nationName = formal;
      } catch (e) {}
      document.getElementById('bnation').textContent = nationName;
      // Fill the shared sidenav brand (flag / party name / ideology · nation).
      document.getElementById('pname').textContent = party.name;
      document.getElementById('psub').textContent = ideologyLabel(party) + ' · ' + ((nation && nation.name) || party.nation_id);
      if (nation && nation.flag) { var f = document.getElementById('flag'); f.onload = function () { f.hidden = false; }; f.src = nation.flag; }
      setTopbarActions(party.influence);

      var ec = (nation && nation.economy) || {};
      CUR = ec.currency || '$';

      // Compute each policy's in-force Budget Balance contribution (one source: policies.js),
      // then Budget Balance = revenue (adds) − spending (subtracts). Trade policy is skipped.
      var pols = [];
      try { const { data } = await supabase.from('policies').select('id, definition'); pols = data || []; } catch (e) {}
      var contribs = pols.filter(function (p) { return !isTradePolicy(p.definition); }).map(function (p) {
        return { name: (p.definition && p.definition.name) || 'Policy', amount: policyBudgetContribution(p.definition, nation.policies, p.id, nation.gdp) };
      }).filter(function (c) { return Math.abs(c.amount) >= 0.005; });
      // Running national initiatives are standing spending lines too (one source: policies.js).
      var initRows = [];
      try { initRows = await fetchBudgetInitiatives(party.nation_id); } catch (e) {}
      contribs = contribs.concat(initiativeBudgetItems(initRows).filter(function (c) { return Math.abs(c.amount) >= 0.005; }));
      REV = contribs.filter(function (c) { return c.amount > 0; }).sort(function (a, b) { return b.amount - a.amount; });
      SPEND = contribs.filter(function (c) { return c.amount < 0; }).sort(function (a, b) { return a.amount - b.amount; });
      var totalRev = REV.reduce(function (t, c) { return t + c.amount; }, 0);
      var totalSpend = SPEND.reduce(function (t, c) { return t + Math.abs(c.amount); }, 0);
      // Headline Budget Balance = the SERVER value (nation_stat_values → _nation_budget_balance) — the same
      // figure the Government page and the debt engine use. The client sum above is the GROSS of policy
      // contributions; the gap is Corruption's collection loss on % of GDP revenue (schema/210), surfaced as
      // a spending line so the breakdown reconciles to the headline. One source: the server.
      var serverBal = null;
      try { const { data } = await supabase.rpc('nation_stat_values', { p_nation: party.nation_id, p_stats: ['Budget Balance'] }); if (data && data['Budget Balance'] != null) serverBal = Number(data['Budget Balance']); } catch (e) {}
      var leak = (serverBal != null && isFinite(serverBal)) ? ((totalRev - totalSpend) - serverBal) : 0;
      if (leak >= 0.05) { SPEND.push({ name: 'Uncollected · Corruption & Unemployment', amount: -leak }); SPEND.sort(function (a, b) { return a.amount - b.amount; }); totalSpend += leak; }
      var balance = (serverBal != null && isFinite(serverBal)) ? serverBal : (totalRev - totalSpend), bneg = balance < 0;
      document.getElementById('balVal').innerHTML = (bneg ? '−' : '') + esc(CUR) + (Math.round(Math.abs(balance) * 10) / 10) + 'bn<span class="bhero__u"> /yr</span>';
      document.getElementById('balVal').style.color = bneg ? 'var(--red)' : 'var(--green)';
      document.getElementById('revVal').textContent = fmt(totalRev);
      document.getElementById('spendVal').textContent = fmt(totalSpend);
      var peak = Math.max(totalRev, totalSpend) || 1;
      document.getElementById('revBar').style.width = Math.round(totalRev / peak * 100) + '%';
      document.getElementById('spendBar').style.width = Math.round(totalSpend / peak * 100) + '%';
      render(document.querySelector('.budtab.is-on') ? document.querySelector('.budtab.is-on').dataset.tab : 'revenue');

      // Public Debt is the one stored figure — economy.debt (the "Starting Debt" field), the
      // same source the Government page reads. "$--" when unset.
      var d = Number(ec.debt);
      if (ec.debt != null && ec.debt !== '' && isFinite(d)) {
        document.getElementById('debtVal').textContent = fmt(d);
      }

      // Budget History — the debt-movement + purchase ledger (events carrying debt_after: the 'budget'
      // debt-interest / budget-balance lines and trade purchases). Powers the list AND the debt sparkline.
      try {
        const { data: hist } = await supabase.from('events')
          .select('body, game_date, created_at, tone, debt_after')
          .eq('nation_id', party.nation_id)
          .not('debt_after', 'is', null)
          .order('created_at', { ascending: false })
          .limit(60);
        renderHistory(hist || []);
      } catch (e) { renderHistory(null); }
    } catch (e) { /* placeholders already shown; topbar still renders */ }
  })();
</script>
</body>
</html>
