<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/theme.js"></script>
<title>Inbox · Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/play.css">
<style>
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}

  /* Left navigation (desktop rail + mobile bottom bar) lives in /sidenav.js */

  .main{flex:1;padding:24px clamp(16px,4vw,56px) 56px;min-width:0}
  .phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .phead .eye{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--indigo)}
  .phead h1{font-weight:900;font-size:clamp(24px,3.6vw,32px);letter-spacing:-.03em;margin-top:4px}
  .newbtn{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;padding:10px 16px;border-radius:10px;border:1px solid var(--indigo);background:var(--indigo);color:#fff;cursor:pointer}
  .newbtn:hover{filter:brightness(1.06)}

  .mail{display:grid;grid-template-columns:320px 1fr;gap:16px;margin-top:18px;align-items:start;min-height:60vh}
  @media(max-width:820px){.mail{grid-template-columns:1fr}.mail__view{display:none}.mail.viewing .mail__list{display:none}.mail.viewing .mail__view{display:block}}

  .mail__list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .trow{display:flex;align-items:center;gap:11px;padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:none;border-right:none;border-top:none;font-family:inherit}
  .trow:last-child{border-bottom:none}
  .trow:hover{background:var(--chip)}
  .trow.on{background:var(--indigo-soft)}
  .trow__dot{width:11px;height:11px;border-radius:50%;flex:none}
  .trow__b{min-width:0;flex:1}
  .trow__top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .trow__nm{font-weight:700;font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trow__t{font-family:'Space Mono',monospace;font-size:9.5px;color:var(--soft);flex:none}
  .trow__prev{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .trow__unread{width:8px;height:8px;border-radius:50%;background:var(--indigo);flex:none}
  .list-empty{padding:34px 18px;text-align:center;color:var(--soft);font-size:13px}

  .mail__view{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0;display:flex;flex-direction:column;min-height:60vh}
  .view-empty{margin:auto;text-align:center;color:var(--soft);font-size:14px;padding:40px 20px}
  .vhead{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}
  .vback{display:none;background:none;border:none;color:var(--indigo);font-family:'Space Mono',monospace;font-size:11px;font-weight:700;cursor:pointer;padding:0}
  @media(max-width:820px){.vback{display:inline}}
  .vhead__dot{width:12px;height:12px;border-radius:50%;flex:none}
  .vhead__nm{font-weight:800;font-size:16px;letter-spacing:-.01em}
  .vhead__sub{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}
  .vmsgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:78%;padding:10px 13px;border-radius:13px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .msg__t{display:block;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.03em;color:var(--soft);margin-top:5px}
  .msg.them{align-self:flex-start;background:var(--chip);color:var(--ink);border-bottom-left-radius:4px}
  .msg.me{align-self:flex-end;background:var(--indigo);color:#fff;border-bottom-right-radius:4px}
  .msg.me .msg__t{color:rgba(255,255,255,.75)}
  .vreply{display:flex;gap:9px;padding:13px 15px;border-top:1px solid var(--line)}
  .vreply textarea{flex:1;resize:none;font-family:'Archivo',sans-serif;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);min-height:44px;max-height:140px}
  .vsend{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;padding:0 16px;border-radius:10px;border:1px solid var(--indigo);background:var(--indigo);color:#fff;cursor:pointer;flex:none}
  .vsend:hover{filter:brightness(1.06)} .vsend:disabled{opacity:.5;cursor:not-allowed;filter:none}

  /* compose */
  .compose{padding:18px}
  .compose__hd{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:14px}
  .compose label{display:block;font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin:0 0 6px}
  .compose select,.compose textarea{width:100%;font-family:'Archivo',sans-serif;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);margin-bottom:14px}
  .compose textarea{resize:vertical;min-height:120px}
  .compose__btns{display:flex;gap:10px;justify-content:flex-end}
  .compose__cancel{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--bg);font-family:'Space Mono',monospace;font-size:12px;padding:13px 18px;border-radius:11px;opacity:0;pointer-events:none;transition:all .35s;z-index:120;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div id="sidenav"></div><!-- left rail / mobile bottom bar, injected by /sidenav.js -->

  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="phead">
      <div><span class="eye">Correspondence</span><h1>Inbox</h1></div>
      <button class="newbtn" id="newBtn" type="button">New Message</button>
    </div>
    <div class="mail" id="mail">
      <div class="mail__list" id="threadList"><p class="list-empty">Loading…</p></div>
      <div class="mail__view" id="threadView"><div class="view-empty">Select a conversation, or start a new message.</div></div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script type="module">
  import { supabase, isConfigured, requireUser } from '/supabase.js';
  import { esc } from '/util.js';
  import { mountTopbar, setTopbarActions } from '/topbar.js';
  import { mountSidenav } from '/sidenav.js';
  import { ideologyLabel, partyColor } from '/archetypes.js';

  mountTopbar(); // shared top bar (Discord/Influence/budget/date/gear) into #topbar
  mountSidenav();  // left rail (desktop) / bottom bar (mobile) into #sidenav; active item from the URL

  var MY_ID = null;
  var THREADS = [];          // [{ id, otherId, otherName, otherColor, messages:[...], myRead, unread }]
  var ALL_PARTIES = [];      // for the compose picker
  var openId = null, busy = false;
  var toast = document.getElementById('toast'), toastT;
  function ping(m) { toast.textContent = m; toast.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { toast.classList.remove('show'); }, 3600); }
  function fmtTime(iso) { try { var d = new Date(iso); return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' · ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
  function shortTime(iso) { try { var d = new Date(iso); return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); } catch (e) { return ''; } }

  function renderList() {
    var box = document.getElementById('threadList');
    if (!THREADS.length) { box.innerHTML = '<p class="list-empty">No conversations yet. Start one with New Message.</p>'; return; }
    box.innerHTML = THREADS.map(function (t) {
      var last = t.messages[t.messages.length - 1];
      var prev = last ? (last.sender_id === MY_ID ? 'You: ' : '') + last.body.replace(/\s+/g, ' ') : 'No messages yet';
      return '<button class="trow' + (t.id === openId ? ' on' : '') + '" type="button" data-id="' + esc(t.id) + '">' +
        '<span class="trow__dot" style="background:' + t.otherColor + '"></span>' +
        '<span class="trow__b"><span class="trow__top"><span class="trow__nm">' + esc(t.otherName) + '</span>' +
          '<span class="trow__t">' + (last ? shortTime(last.created_at) : '') + '</span></span>' +
          '<span class="trow__prev">' + esc(prev) + '</span></span>' +
        (t.unread ? '<span class="trow__unread" title="Unread"></span>' : '') + '</button>';
    }).join('');
    box.querySelectorAll('.trow').forEach(function (b) { b.onclick = function () { openThread(b.dataset.id); }; });
  }

  function renderThread(t) {
    var view = document.getElementById('threadView');
    var msgs = t.messages.map(function (m) {
      return '<div class="msg ' + (m.sender_id === MY_ID ? 'me' : 'them') + '">' + esc(m.body) +
        '<span class="msg__t">' + fmtTime(m.created_at) + '</span></div>';
    }).join('') || '<div class="view-empty">No messages yet — say hello.</div>';
    view.innerHTML =
      '<div class="vhead"><button class="vback" id="vback" type="button">← Inbox</button>' +
        '<span class="vhead__dot" style="background:' + t.otherColor + '"></span>' +
        '<div><div class="vhead__nm">' + esc(t.otherName) + '</div><div class="vhead__sub">Direct message</div></div></div>' +
      '<div class="vmsgs" id="vmsgs">' + msgs + '</div>' +
      '<div class="vreply"><textarea id="vtext" rows="1" maxlength="2000" placeholder="Write a reply…"></textarea>' +
        '<button class="vsend" id="vsend" type="button">Send</button></div>';
    var vm = document.getElementById('vmsgs'); if (vm) vm.scrollTop = vm.scrollHeight;
    document.getElementById('vback').onclick = function () { openId = null; document.getElementById('mail').classList.remove('viewing'); renderList(); document.getElementById('threadView').innerHTML = '<div class="view-empty">Select a conversation, or start a new message.</div>'; };
    document.getElementById('vsend').onclick = function () { send(t.otherId, document.getElementById('vtext'), document.getElementById('vsend')); };
  }

  async function openThread(id) {
    var t = THREADS.filter(function (x) { return x.id === id; })[0];
    if (!t) return;
    openId = id;
    document.getElementById('mail').classList.add('viewing');
    renderList();
    renderThread(t);
    if (t.unread) {
      t.unread = false; renderList();
      try { await supabase.rpc('dm_mark_read', { p_thread: id }); } catch (e) { /* non-fatal — reopens as read next load */ }
    }
  }

  function openCompose() {
    openId = null;
    document.getElementById('mail').classList.add('viewing');
    renderList();
    var opts = ALL_PARTIES.map(function (p) { return '<option value="' + esc(p.id) + '">' + esc(p.label) + '</option>'; }).join('');
    document.getElementById('threadView').innerHTML =
      '<div class="compose"><div class="compose__hd">New Message</div>' +
        '<label for="cto">To</label><select id="cto">' + (opts || '<option value="">No other parties</option>') + '</select>' +
        '<label for="ctext">Message</label><textarea id="ctext" maxlength="2000" placeholder="Write your message…"></textarea>' +
        '<div class="compose__btns"><button class="compose__cancel" id="ccancel" type="button">Cancel</button>' +
          '<button class="vsend" id="csend" type="button">Send</button></div></div>';
    document.getElementById('ccancel').onclick = function () { document.getElementById('mail').classList.remove('viewing'); document.getElementById('threadView').innerHTML = '<div class="view-empty">Select a conversation, or start a new message.</div>'; };
    document.getElementById('csend').onclick = function () {
      var to = document.getElementById('cto').value;
      if (!to) { ping('Pick a party to message.'); return; }
      send(to, document.getElementById('ctext'), document.getElementById('csend'));
    };
  }

  async function send(toId, textEl, btnEl) {
    if (busy) return;
    var body = (textEl.value || '').trim();
    if (!body) { ping('Write a message first.'); return; }
    busy = true; if (btnEl) btnEl.disabled = true;
    try {
      const { data: threadId, error } = await supabase.rpc('dm_send', { p_to: toId, p_body: body });
      if (error) throw error;
      textEl.value = '';
      await load();                 // refetch threads + messages
      if (threadId) openThread(threadId);
    } catch (e) { ping((e && e.message) || 'Couldn’t send the message.'); }
    finally { busy = false; if (btnEl) btnEl.disabled = false; }
  }

  // Fetch the caller's threads + every message in them (both RLS-limited to the participant), then
  // resolve the other party per thread for display. One pass builds THREADS newest-first.
  async function load() {
    var thRes = await supabase.from('dm_threads').select('id, party_lo, party_hi, read_lo, read_hi');
    if (thRes.error) throw thRes.error;
    var threads = thRes.data || [];
    var msgRes = await supabase.from('dm_messages').select('id, thread_id, sender_id, body, created_at').order('created_at', { ascending: true });
    if (msgRes.error) throw msgRes.error;
    var messages = msgRes.data || [];

    var otherIds = threads.map(function (t) { return t.party_lo === MY_ID ? t.party_hi : t.party_lo; });
    var pById = {};
    if (otherIds.length) {
      var pRes = await supabase.from('parties').select('id, name, archetype, color').in('id', otherIds);
      (pRes.data || []).forEach(function (p) { pById[p.id] = p; });
    }
    var byThread = {}; messages.forEach(function (m) { (byThread[m.thread_id] = byThread[m.thread_id] || []).push(m); });

    THREADS = threads.map(function (t) {
      var otherId = t.party_lo === MY_ID ? t.party_hi : t.party_lo;
      var myRead = t.party_lo === MY_ID ? t.read_lo : t.read_hi;
      var msgs = byThread[t.id] || [];
      var unread = msgs.some(function (m) { return m.sender_id !== MY_ID && (!myRead || m.created_at > myRead); });
      var op = pById[otherId] || {};
      return { id: t.id, otherId: otherId, otherName: op.name || 'A party', otherColor: partyColor(op), messages: msgs, unread: unread };
    }).sort(function (a, b) {
      var la = a.messages.length ? a.messages[a.messages.length - 1].created_at : '';
      var lb = b.messages.length ? b.messages[b.messages.length - 1].created_at : '';
      return la < lb ? 1 : (la > lb ? -1 : 0);
    });
    renderList();
    // Keep the open thread's view in sync after a send/reload.
    if (openId) { var cur = THREADS.filter(function (x) { return x.id === openId; })[0]; if (cur) renderThread(cur); }
  }

  (async () => {
    if (!isConfigured) { document.getElementById('threadList').innerHTML = '<p class="list-empty">Supabase isn’t configured.</p>'; return; }
    const user = await requireUser();
    if (!user) return; // redirected to login
    try {
      const { data: party } = await supabase.from('parties').select('id, name, archetype, nation_id, influence').eq('user_id', user.id).single();
      if (!party) { window.location.replace('/nation-select/'); return; }
      MY_ID = party.id;
      const { data: nation } = await supabase.from('nations').select('name, flag').eq('id', party.nation_id).single();
      var nationName = (nation && nation.name) || party.nation_id;
      document.getElementById('pname').textContent = party.name;
      document.getElementById('psub').textContent = ideologyLabel(party) + ' · ' + nationName;
      if (nation && nation.flag) { var f = document.getElementById('flag'); f.onload = function () { f.hidden = false; }; f.src = nation.flag; }
      setTopbarActions(party.influence);

      // Compose picker: every other party (name + its nation), world-readable.
      var apRes = await supabase.from('parties').select('id, name, nation_id').neq('id', MY_ID).order('name');
      var natRes = await supabase.from('nations').select('id, name');
      var natName = {}; (natRes.data || []).forEach(function (n) { natName[n.id] = n.name; });
      ALL_PARTIES = (apRes.data || []).map(function (p) { return { id: p.id, label: p.name + (natName[p.nation_id] ? ' · ' + natName[p.nation_id] : '') }; });

      document.getElementById('newBtn').onclick = openCompose;
      await load();
    } catch (e) {
      document.getElementById('threadList').innerHTML = '<p class="list-empty">Couldn’t load your inbox. Refresh to try again.</p>';
    }
  })();
</script>
</body>
</html>
