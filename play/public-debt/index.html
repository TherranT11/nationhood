<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/theme.js"></script>
<title>Public Debt · Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/play.css">
<style>
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .main{flex:1;padding:24px clamp(16px,4vw,56px) 56px;min-width:0}
  .phead .eye{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--indigo)}
  .phead h1{font-weight:900;font-size:clamp(24px,3.6vw,32px);letter-spacing:-.03em;margin-top:4px}
  .phead p{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:620px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-top:18px}
  .panel h2{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:14px}
  /* Hero value */
  .dhero{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .dhero__v{font-size:clamp(30px,5vw,44px);font-weight:900;letter-spacing:-.03em;color:var(--ink)}
  .dhero__ratio{font-family:'Space Mono',monospace;font-size:12px;color:var(--soft)}
  /* Chart */
  .dchart{width:100%;height:auto;display:block;margin-top:4px}
  .dlegend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--muted)}
  .dlegend span{display:inline-flex;align-items:center;gap:6px}
  .dlegend i{width:14px;height:0;border-top:2px solid var(--indigo);display:inline-block}
  .dlegend i.def{border-top:2px dashed var(--red)}
  /* Month-by-month timeline */
  .dtrow{padding:9px 0;border-bottom:1px solid var(--line)} .dtrow:last-child{border-bottom:none}
  .dtrow__top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .dtrow__date{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}
  .dtrow__amt{font-weight:800;font-size:14px}
  .dtrow__bar{height:6px;border-radius:4px;background:var(--chip,#f4f3ef);margin-top:7px;overflow:hidden}
  .dtrow__bar span{display:block;height:100%;border-radius:4px;opacity:.6}
  .muted{color:var(--soft);font-size:13px;font-style:italic}
</style>
</head>
<body>
<div class="app">
  <div id="sidenav"></div>
  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="phead">
      <span class="eye" id="dnation">Public Finances</span>
      <h1>Public Debt</h1>
      <p>The nation's outstanding debt over time, against the level where <b>Government Default</b> tips to 100 — a debt of 300% of GDP.</p>
    </div>

    <section class="panel">
      <h2>Current</h2>
      <div class="dhero"><span class="dhero__v" id="debtVal">$--</span><span class="dhero__ratio" id="debtRatio"></span></div>
    </section>

    <section class="panel">
      <h2>Debt over time</h2>
      <svg class="dchart" id="debtChart" viewBox="0 0 600 220" aria-label="Public debt over time"></svg>
      <div class="dlegend"><span><i></i> Public Debt</span><span><i class="def"></i> Government Default (300% of GDP)</span></div>
    </section>

    <section class="panel">
      <h2>Month by month · debt added or removed</h2>
      <div id="debtTimeline"><p class="muted">Loading…</p></div>
    </section>
  </main>
</div>

<script type="module">
  import { supabase, isConfigured, requireUser } from '/supabase.js';
  import { esc, declaredValue } from '/util.js';
  import { ideologyLabel } from '/archetypes.js';
  import { mountTopbar, setTopbarActions } from '/topbar.js';
  import { mountSidenav } from '/sidenav.js';

  mountTopbar();
  mountSidenav();

  var CUR = '$';
  // Debt is stored in $bn (economy.debt = 41 → $41bn), so amounts just carry a "bn" suffix.
  function fmtBn(v) { v = Math.round(Math.abs(v) * 10) / 10; return CUR + (v % 1 === 0 ? v : v.toFixed(1)) + 'bn'; }

  // The debt trajectory + the Government Default ceiling (debt = 3 × GDP). Y runs 0 → the taller of the
  // peak debt and that ceiling, so the dashed line is always on the chart and the curve reads as its
  // distance below (or above) default. Under 2 points, show a placeholder.
  function drawChart(series, defaultLine) {
    var svg = document.getElementById('debtChart');
    if (!svg) return;
    if (series.length < 2) { svg.innerHTML = '<text x="300" y="110" text-anchor="middle" fill="var(--soft)" font-family="Space Mono,monospace" font-size="12">Not enough debt history yet.</text>'; return; }
    var W = 600, H = 220, padL = 10, padR = 10, padT = 20, padB = 22, n = series.length;
    var maxV = Math.max.apply(null, series.map(function (s) { return s.v; }));
    var yTop = (Math.max(maxV, defaultLine || 0) * 1.08) || 1;
    function X(i) { return padL + (i / (n - 1)) * (W - padL - padR); }
    function Y(v) { return padT + (1 - v / yTop) * (H - padT - padB); }
    var pts = series.map(function (s, i) { return [X(i), Y(s.v)]; });
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
    var y0 = Y(0).toFixed(1);
    var area = 'M' + pts[0][0].toFixed(1) + ' ' + y0 + ' ' + line.replace(/^M/, 'L') + ' L' + pts[n - 1][0].toFixed(1) + ' ' + y0 + ' Z';
    var parts = '<path d="' + area + '" fill="var(--indigo-soft, rgba(107,92,255,.14))" stroke="none"/>' +
      '<path d="' + line + '" fill="none" stroke="var(--indigo, #5546E8)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="' + pts[n - 1][0].toFixed(1) + '" cy="' + pts[n - 1][1].toFixed(1) + '" r="3" fill="var(--indigo, #5546E8)"/>';
    if (defaultLine && isFinite(defaultLine) && defaultLine > 0) {
      var yd = Y(defaultLine).toFixed(1);
      parts += '<line x1="' + padL + '" y1="' + yd + '" x2="' + (W - padR) + '" y2="' + yd + '" stroke="var(--red, #C42B2B)" stroke-width="1.4" stroke-dasharray="5 4" vector-effect="non-scaling-stroke" opacity=".85"/>' +
        '<text x="' + (W - padR) + '" y="' + (Y(defaultLine) - 6).toFixed(1) + '" text-anchor="end" fill="var(--red, #C42B2B)" font-family="Space Mono, monospace" font-size="10">Government Default · ' + esc(fmtBn(defaultLine)) + '</text>';
    }
    parts += '<text x="' + padL + '" y="' + (H - 6) + '" fill="var(--soft)" font-family="Space Mono,monospace" font-size="9">' + esc(series[0].date || '') + '</text>' +
      '<text x="' + (W - padR) + '" y="' + (H - 6) + '" text-anchor="end" fill="var(--soft)" font-family="Space Mono,monospace" font-size="9">' + esc(series[n - 1].date || '') + '</text>';
    svg.innerHTML = parts;
  }

  // Month-by-month change = the difference between consecutive recorded debt levels. Added = red (▲),
  // removed = green (▼). Newest first.
  function renderTimeline(series) {
    var box = document.getElementById('debtTimeline');
    var rows = [];
    for (var i = series.length - 1; i >= 1; i--) rows.push({ date: series[i].date, delta: series[i].v - series[i - 1].v });
    if (!rows.length) { box.innerHTML = '<p class="muted">No debt movements yet. Monthly changes will appear here as the game runs.</p>'; return; }
    var maxAbs = Math.max.apply(null, rows.map(function (r) { return Math.abs(r.delta); })) || 1;
    box.innerHTML = rows.map(function (r) {
      var flat = Math.abs(r.delta) < 0.05, added = r.delta > 0;
      var col = flat ? 'soft' : (added ? 'red' : 'green');
      var w = Math.max(3, Math.round(Math.abs(r.delta) / maxAbs * 100));
      var label = flat ? 'no change' : (added ? '▲ +' : '▼ −') + fmtBn(Math.abs(r.delta));
      return '<div class="dtrow"><div class="dtrow__top"><span class="dtrow__date">' + esc(r.date || '—') + '</span>' +
        '<span class="dtrow__amt" style="color:var(--' + col + ')">' + label + '</span></div>' +
        '<div class="dtrow__bar"><span style="width:' + w + '%;background:var(--' + col + ')"></span></div></div>';
    }).join('');
  }

  (async () => {
    if (!isConfigured) { document.getElementById('debtTimeline').innerHTML = '<p class="muted">Supabase isn’t configured.</p>'; return; }
    const user = await requireUser();
    if (!user) return;   // redirected to login
    try {
      const { data: party, error } = await supabase.from('parties').select('id, nation_id, name, archetype, influence').eq('user_id', user.id).single();
      if (error || !party) { window.location.replace('/nation-select/'); return; }
      const { data: nation } = await supabase.from('nations').select('name, flag, declarations, economy, gdp').eq('id', party.nation_id).single();

      var nationName = (nation && nation.name) || party.nation_id;
      try {
        const { data: slots } = await supabase.from('declarations').select('slug, label, options, default_index, custom_allowed').eq('slug', 'formal_state_name').limit(1);
        var formal = (slots && slots[0]) ? declaredValue(slots[0], nation && nation.declarations) : '';
        if (formal && formal !== '—') nationName = formal;
      } catch (e) {}
      document.getElementById('dnation').textContent = nationName;
      document.getElementById('pname').textContent = party.name;
      document.getElementById('psub').textContent = ideologyLabel(party) + ' · ' + ((nation && nation.name) || party.nation_id);
      if (nation && nation.flag) { var f = document.getElementById('flag'); f.onload = function () { f.hidden = false; }; f.src = nation.flag; }
      setTopbarActions(party.influence);

      var ec = (nation && nation.economy) || {};
      CUR = ec.currency || '$';
      var gdp = Number(nation && nation.gdp);
      // Government Default 100 = debt at 300% of GDP. MIRRORS _nation_govt_default's (debt/gdp)*100/3 in
      // schema/201 — if that /3 divisor is ever tuned, update this 3× too (it ignores the usually-0 policy term).
      var defaultLine = (isFinite(gdp) && gdp > 0) ? gdp * 3 : null;

      var debt = Number(ec.debt);
      if (ec.debt != null && ec.debt !== '' && isFinite(debt)) {
        document.getElementById('debtVal').textContent = fmtBn(debt);
        if (defaultLine) {
          var ratio = Math.round(debt / gdp * 100);
          document.getElementById('debtRatio').textContent = ratio + '% of GDP · Government Default at 300%';
        }
      }

      // Debt ledger — every event carrying debt_after (interest, budget-balance moves, purchases). The
      // ONE source the Budget page reads too. Chronological for the chart + the month-over-month deltas.
      try {
        const { data: hist } = await supabase.from('events')
          .select('game_date, created_at, debt_after')
          .eq('nation_id', party.nation_id)
          .not('debt_after', 'is', null)
          .order('created_at', { ascending: true })
          .limit(120);
        var series = (hist || []).map(function (e) { return { v: Number(e.debt_after), date: e.game_date }; }).filter(function (s) { return isFinite(s.v); });
        drawChart(series, defaultLine);
        renderTimeline(series);
      } catch (e) {
        document.getElementById('debtTimeline').innerHTML = '<p class="muted">Couldn’t load debt history. Refresh to try again.</p>';
      }
    } catch (e) {
      document.getElementById('debtTimeline').innerHTML = '<p class="muted">Couldn’t load the debt page right now. Refresh to try again.</p>';
    }
  })();
</script>
</body>
</html>
