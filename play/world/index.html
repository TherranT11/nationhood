<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/theme.js"></script>
<title>World · Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAF8;--surface:#FFFFFF;--ink:#15151B;--muted:#5b5b63;--soft:#8d8d95;
    --line:#E7E5E0;--line2:#D9D6D0;--chip:#F4F3EF;--field:#FCFBF9;
    --indigo:#5546E8;--indigo-soft:#ECE9FD;
    --red:#C42B2B;--red-soft:#FBEAE9;--amber:#E0820E;--amber-soft:#FBF0DD;--green:#16915a;--green-soft:#E5F4EC;--blue:#1f86d6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .app{display:flex;min-height:100vh}

  /* Left navigation (desktop rail + mobile bottom bar) lives in /sidenav.js */

  .main{flex:1;padding:24px clamp(16px,4vw,56px) 56px;min-width:0}
  .phead{margin-bottom:6px}
  .phead .eye{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--indigo)}
  .phead h1{font-weight:900;font-size:clamp(24px,3.6vw,32px);letter-spacing:-.03em;margin-top:4px}
  .phead p{color:var(--muted);font-size:14px;margin-top:6px;max-width:560px}
  .empty{text-align:center;padding:40px 20px;color:var(--soft)}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:20px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}

  .wcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column}
  .wc-top{display:flex;align-items:center;gap:13px}
  .emb{width:96px;height:64px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-weight:700;font-size:26px;color:#fff;background:var(--acc)}
  .emb.img{object-fit:contain;border:1px solid var(--line);background:var(--chip)}
  .wc-id{flex:1;min-width:0}
  .wc-id h2{font-weight:900;font-size:21px;letter-spacing:-.02em;line-height:1.05}

  .figs{display:flex;gap:10px;margin:16px 0}
  .fig{flex:1;border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--field)}
  .fig .k{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
  .fig .v{font-weight:800;font-size:19px;letter-spacing:-.02em;margin-top:3px}

  .gov{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:13px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .gov .who b{font-weight:700;font-size:14.5px}
  .gov .who span{display:block;font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-top:1px}
  .govtype{margin-left:auto;font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;padding:5px 11px;border-radius:20px;background:var(--chip);color:var(--muted)}

  .acts{display:flex;gap:10px;margin-top:18px}
  .btn{flex:1;text-align:center;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:12px 14px;border-radius:10px;cursor:pointer;border:1.5px solid var(--indigo);transition:transform .12s,filter .15s,background .15s}
  .btn:hover{transform:translateY(-1px)}
  .btn.talks{color:var(--indigo);background:var(--surface)}
  .btn.talks:hover{background:var(--indigo-soft)}
  .btn.summit{color:#fff;background:var(--indigo)}
  .btn.summit:hover{filter:brightness(1.07)}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--bg);font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.02em;padding:14px 18px;border-radius:11px;box-shadow:0 18px 44px -18px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:all .35s;z-index:80;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast b{color:#a99dff}

  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div id="sidenav"></div><!-- left rail / mobile bottom bar, injected by /sidenav.js -->

  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="phead">
      <span class="eye">Diplomacy</span>
      <h1>The World</h1>
      <p id="lede">The other powers — their weight, their politics, and where you stand with each.</p>
    </div>
    <div id="content"><div class="grid"><div class="wcard"><div class="empty">Loading the world…</div></div></div></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { supabase, isConfigured, requireUser } from '/supabase.js';
  import { esc, fmtGdp, fmtPop, declaredValue, loadHogTitleSlot } from '/util.js';
  import { regimeLabel } from '/ladders.js';
  import { mountTopbar, setTopbarActions, setTopbarFunds } from '/topbar.js';
  import { mountSidenav } from '/sidenav.js';
  import { ideologyLabel } from '/archetypes.js';

  mountTopbar();
  mountSidenav();  // left rail (desktop) / bottom bar (mobile) into #sidenav; active item from the URL

  // Toast for the cosmetic diplomacy actions (no inter-nation backend yet).
  var toast = document.getElementById('toast'), tt;
  function ping(h){ toast.innerHTML = h; toast.classList.add('show'); clearTimeout(tt); tt = setTimeout(function(){ toast.classList.remove('show'); }, 3600); }

  function fail(msg){ document.getElementById('content').innerHTML = '<div class="grid"><div class="wcard"><div class="empty">' + msg + '</div></div></div>'; }
  function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

  // A small palette so each foreign nation gets a distinct accent (used for the
  // flag-fallback badge tint). Cycled by position.
  var ACCENTS = ['var(--red)', 'var(--blue)', 'var(--amber)', 'var(--green)', 'var(--indigo)'];

  function render(nations, govByNation, leaderByParty, titleSlot){
    if (!nations.length){ fail('No other nations have been founded yet.'); return; }

    var cards = nations.map(function(n, i){
      var acc = ACCENTS[i % ACCENTS.length];
      var eco = n.economy || {};
      var currency = eco.currency || '$';

      // Government type: the active government's form if one is seated, else the
      // nation's regime (numeric ladder value → label, or a stored string).
      var g = govByNation[n.id];
      var regime = eco.regime;
      var regimeTxt = (typeof regime === 'number') ? (regimeLabel(regime) + ' – ' + regime) : (regime || '—');
      var govType = g ? cap(g.type) : regimeTxt;

      var leader = (g && g.formateur_party_id) ? leaderByParty[g.formateur_party_id] : null;
      var hog = leader ? (esc((leader.first_name || '') + ' ' + (leader.last_name || '')).trim() || '—') : '—';

      // The nation's declared Head of Government title (e.g. "Prime Minister"),
      // resolved from its own declarations; the generic label is the fallback.
      var hogTitle = declaredValue(titleSlot, n.declarations);
      if (!hogTitle || hogTitle === '—') hogTitle = 'Head of Government';

      var initial = esc((n.name || '?').charAt(0).toUpperCase());
      var badge = n.flag
        ? '<img class="emb img" src="' + esc(n.flag) + '" alt="Flag of ' + esc(n.name) + '">'
        : '<div class="emb">' + initial + '</div>';

      var talks = 'Open Talks with ' + esc(n.name) + ' — begin a diplomatic channel.';
      var summit = 'Summit with ' + esc(n.name) + " — a leaders' meeting that can set alignment and trade.";

      return '<article class="wcard" style="--acc:' + acc + '">' +
        '<div class="wc-top">' + badge +
          '<div class="wc-id"><h2>' + esc(n.name) + '</h2></div></div>' +
        '<div class="figs">' +
          '<div class="fig"><div class="k">GDP</div><div class="v">' + esc(currency) + (n.gdp != null ? esc(fmtGdp(n.gdp)) : '—') + '</div></div>' +
          '<div class="fig"><div class="k">Population</div><div class="v">' + (n.population != null ? esc(fmtPop(n.population)) : '—') + '</div></div>' +
        '</div>' +
        '<div class="gov">' +
          '<div class="who"><b>' + hog + '</b><span>' + esc(hogTitle) + '</span></div>' +
          '<span class="govtype">' + esc(govType) + '</span>' +
        '</div>' +
        '<div class="acts">' +
          '<button class="btn talks" type="button" data-t="' + esc(talks) + '">Open Talks</button>' +
          '<button class="btn summit" type="button" data-t="' + esc(summit) + '">Summit</button>' +
        '</div>' +
      '</article>';
    }).join('');

    document.getElementById('content').innerHTML = '<div class="grid">' + cards + '</div>';
    document.querySelectorAll('.btn').forEach(function(b){
      b.addEventListener('click', function(){ ping(b.dataset.t.replace(/^(Open Talks|Summit)/, '<b>$1</b>')); });
    });
  }

  (async () => {
    if (!isConfigured) { fail('Supabase isn’t configured.'); return; }
    const user = await requireUser();
    if (!user) return; // redirected to login
    try {
      const { data: party } = await supabase.from('parties').select('name, archetype, nation_id, funds, actions_remaining').eq('user_id', user.id).single();
      if (!party) { window.location.replace('/nation-select/'); return; }

      // Home nation drives the sidebar brand + the topbar's currency.
      const { data: home } = await supabase.from('nations').select('name, flag, economy').eq('id', party.nation_id).maybeSingle();

      // Every OTHER nation — these are the cards.
      const { data: others } = await supabase.from('nations')
        .select('id, name, flag, population, gdp, economy, declarations')
        .neq('id', party.nation_id).order('name');
      const nations = others || [];

      // The Head of Government title slot, resolved per-nation against each
      // nation's declarations in render (one source — see util.js).
      const titleSlot = await loadHogTitleSlot(supabase);

      // Active governments for those nations (most will have none yet), and the
      // leader of each formateur party for the Head of Government line. Batched.
      var govByNation = {}, leaderByParty = {};
      const ids = nations.map(function(n){ return n.id; });
      if (ids.length) {
        const { data: govs } = await supabase.from('governments')
          .select('nation_id, type, formateur_party_id').in('nation_id', ids).eq('status', 'active');
        (govs || []).forEach(function(g){ govByNation[g.nation_id] = g; });

        const fpIds = (govs || []).map(function(g){ return g.formateur_party_id; }).filter(Boolean);
        if (fpIds.length) {
          const { data: pols } = await supabase.from('politicians')
            .select('party_id, first_name, last_name').eq('status', 'Party Leader').in('party_id', fpIds);
          (pols || []).forEach(function(p){ if (!leaderByParty[p.party_id]) leaderByParty[p.party_id] = p; });
        }
      }

      const homeName = (home && home.name) || party.nation_id;
      document.getElementById('pname').textContent = party.name;
      document.getElementById('psub').textContent = ideologyLabel(party) + ' · ' + homeName;
      document.title = homeName + ' · World';
      if (home && home.flag) { var f = document.getElementById('flag'); f.onload = function(){ f.hidden = false; }; f.src = home.flag; }

      var currency = (home && home.economy && home.economy.currency) || '$';
      setTopbarFunds(currency, party.funds);
      setTopbarActions(party.actions_remaining);
      render(nations, govByNation, leaderByParty, titleSlot);
    } catch (e) {
      fail('Couldn’t load the world right now. Refresh to try again.');
    }
  })();
</script>
</body>
</html>
