<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/theme.js"></script>
<title>World · Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/play.css">
<style>
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}

  /* Left navigation (desktop rail + mobile bottom bar) lives in /sidenav.js */

  .main{flex:1;padding:24px clamp(16px,4vw,56px) 56px;min-width:0}
  .phead{margin-bottom:6px}
  .phead .eye{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--indigo)}
  .phead h1{font-weight:900;font-size:clamp(24px,3.6vw,32px);letter-spacing:-.03em;margin-top:4px}
  .phead p{color:var(--muted);font-size:14px;margin-top:6px;max-width:560px}
  .empty{text-align:center;padding:40px 20px;color:var(--soft)}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:20px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}

  .wcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;color:inherit;text-decoration:none;cursor:pointer;transition:border-color .15s,transform .15s}
  a.wcard:hover{border-color:var(--acc);transform:translateY(-2px)}
  .wc-top{display:flex;align-items:flex-start;gap:13px}
  .emb{width:96px;height:64px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-weight:700;font-size:26px;color:#fff;background:var(--acc)}
  .emb.img{object-fit:contain;border:1px solid var(--line);background:var(--chip)}
  .wc-id{flex:1;min-width:0}
  .wc-id h2{font-weight:900;font-size:21px;letter-spacing:-.02em;line-height:1.05}

  .figs{display:flex;gap:10px;margin:16px 0}
  .fig{flex:1;border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--field)}
  .fig .k{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
  .fig .v{font-weight:800;font-size:19px;letter-spacing:-.02em;margin-top:3px}

  .gov{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:13px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .gov .who{min-width:0}
  .gov .who b{font-weight:700;font-size:14.5px}
  .gov .who .ttl{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
  .gov .who .ptag{font-family:'Space Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.04em;color:var(--soft);margin-left:4px}
  .govtype{margin-left:auto;font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;line-height:1.4;padding:5px 11px;border-radius:20px;background:var(--chip);color:var(--muted);text-align:right}

  /* The nation's five qualitative stats — number → word from the shared ladders. */
  .wstats{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:9px}
  .srow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .srow .sk{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
  .srow .sv{font-weight:700;font-size:13.5px;text-align:right;color:var(--ink)}
  .srow .sv small{font-family:'Space Mono',monospace;font-weight:700;font-size:10px;color:var(--soft);margin-left:5px}
  .srow .sv.good{color:var(--green)} .srow .sv.warn{color:var(--amber)} .srow .sv.bad{color:var(--red)}
  .rel{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px;margin-left:8px}
  .rel-dots{display:flex;gap:3px}
  .rdot{width:10px;height:10px;border-radius:50%;background:var(--chip,#F4F3EF);border:1px solid var(--line,#E7E5E0)}
  .rdot.on.good{background:var(--green);border-color:var(--green)} .rdot.on.warn{background:var(--amber);border-color:var(--amber)} .rdot.on.bad{background:var(--red);border-color:var(--red)}
  .rel-lbl{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
  .rel-lbl.good{color:var(--green)} .rel-lbl.warn{color:var(--amber)} .rel-lbl.bad{color:var(--red)}

  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div id="sidenav"></div><!-- left rail / mobile bottom bar, injected by /sidenav.js -->

  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="phead">
      <span class="eye">Diplomacy</span>
      <h1>The World</h1>
      <p id="lede">The other powers — their weight, their politics, and where you stand with each.</p>
    </div>
    <div id="content"><div class="grid"><div class="wcard"><div class="empty">Loading the world…</div></div></div></div>
  </main>
</div>

<script type="module">
  import { supabase, isConfigured, requireUser } from '/supabase.js';
  import { esc, fmtGdp, fmtPop, declaredValue, loadHogTitleSlot } from '/util.js';
  import { regimeText, nationRegime, statLabel, statName, statBand, crimeLabel, crimeBand, crimeValue } from '/ladders.js';
  import { mountTopbar, setTopbarActions } from '/topbar.js';
  import { mountSidenav } from '/sidenav.js';
  import { ideologyLabel } from '/archetypes.js';

  mountTopbar();
  mountSidenav();  // left rail (desktop) / bottom bar (mobile) into #sidenav; active item from the URL

  // The five qualitative stats shown on each nation card, in display order.
  var STATS = ['prosperity', 'growth', 'welfare', 'order', 'image'];

  function fail(msg){ document.getElementById('content').innerHTML = '<div class="grid"><div class="wcard"><div class="empty">' + msg + '</div></div></div>'; }
  function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

  // A small palette so each foreign nation gets a distinct accent (used for the
  // flag-fallback badge tint). Cycled by position.
  var ACCENTS = ['var(--red)', 'var(--blue)', 'var(--amber)', 'var(--green)', 'var(--indigo)'];

  // Relations 1–10 as a 10-dot meter (1 dot = 1), coloured + named by band: 1–3 Antagonistic (red),
  // 4–7 Neutral (yellow), 8–10 Friendly (green). Sits top-right of each nation card.
  function relBand(v){ return v <= 3 ? 'bad' : v <= 7 ? 'warn' : 'good'; }
  function relLabel(v){ return v <= 3 ? 'Antagonistic' : v <= 7 ? 'Neutral' : 'Friendly'; }
  function relMeter(v){
    var band = relBand(v), dots = '';
    for (var d = 1; d <= 10; d++) dots += '<span class="rdot' + (d <= v ? ' on ' + band : '') + '"></span>';
    return '<div class="rel"><div class="rel-dots">' + dots + '</div><span class="rel-lbl ' + band + '">' + relLabel(v) + ' &middot; ' + v + '/10</span></div>';
  }

  function render(nations, govByNation, leaderByParty, titleSlot, partyById, relMap){
    if (!nations.length){ fail('No other nations have been founded yet.'); return; }

    var cards = nations.map(function(n, i){
      var acc = ACCENTS[i % ACCENTS.length];
      var eco = n.economy || {};
      var currency = eco.currency || '$';

      // Government type: the seated government's form PLUS the nation's regime (regimeText →
      // "Flawed Democracy · Reform 4/15"), e.g. "Coalition Government — Flawed Democracy · Reform 4/15".
      // No seated government → just the regime. Unknown regime → just the form.
      var g = govByNation[n.id];
      var regimeTxt = regimeText(nationRegime(eco));
      var govType = g ? (cap(g.type) + ' Government' + (regimeTxt !== '—' ? ' — ' + regimeTxt : '')) : regimeTxt;

      var leader = (g && g.formateur_party_id) ? leaderByParty[g.formateur_party_id] : null;
      var hog = leader ? (esc((leader.first_name || '') + ' ' + (leader.last_name || '')).trim() || '—') : '—';
      // Tag the Head of Government with the governing party's abbreviation, e.g. "… [NPP]".
      var govParty = (g && g.formateur_party_id && partyById) ? partyById[g.formateur_party_id] : null;
      var hogTag = (leader && govParty && govParty.abbreviation) ? ' <span class="ptag">[' + esc(govParty.abbreviation) + ']</span>' : '';

      // The nation's declared Head of Government title (e.g. "Prime Minister"),
      // resolved from its own declarations; the generic label is the fallback.
      var hogTitle = declaredValue(titleSlot, n.declarations);
      if (!hogTitle || hogTitle === '—') hogTitle = 'Head of Government';

      // The formal state name (declared, e.g. "The Republic of Sessau") is the headline;
      // the short name (n.name) is the fallback and reads better in the action prompts.
      var formalName = (n.declarations && n.declarations.formal_state_name) || n.name;

      var initial = esc((n.name || '?').charAt(0).toUpperCase());
      var badge = n.flag
        ? '<img class="emb img" src="' + esc(n.flag) + '" alt="Flag of ' + esc(n.name) + '">'
        : '<div class="emb">' + initial + '</div>';

      // The five qualitative stats — the number is the source, the word follows it
      // (statLabel) and the colour band reads good/warn/bad (statBand) — shared ladders.js.
      // 'order' is shown as Crime, its reader-facing inverse (crime ≈ 101 − order, high crime bad),
      // matching the nation-select cards. Same source number, flipped framing — all from ladders.js.
      var st = n.stats || {};
      var statsHtml = STATS.map(function (k) {
        var raw = st[k], num = (raw != null && raw !== '') ? Number(raw) : NaN;
        var crime = k === 'order';
        var name = crime ? 'Crime' : statName(k);
        if (isNaN(num)) return '<div class="srow"><span class="sk">' + esc(name) + '</span><span class="sv">—</span></div>';
        var band = crime ? crimeBand(num) : statBand(k, num);
        var word = crime ? crimeLabel(num) : statLabel(k, num);
        var shown = crime ? crimeValue(num) : num;
        return '<div class="srow"><span class="sk">' + esc(name) + '</span>' +
          '<span class="sv ' + band + '">' + esc(word || '—') + ' <small>' + shown + '</small></span></div>';
      }).join('');

      var relVal = (relMap && relMap[n.id] != null) ? relMap[n.id] : 5;
      // The whole card links into the Nation page's read-only view of that nation (map, stats,
      // cabinet, regime…) — see play/index.html's ?view=<id> foreign mode.
      return '<a class="wcard" href="/play/?view=' + encodeURIComponent(n.id) + '" style="--acc:' + acc + '">' +
        '<div class="wc-top">' + badge +
          '<div class="wc-id"><h2>' + esc(formalName) + '</h2></div>' + relMeter(relVal) + '</div>' +
        '<div class="figs">' +
          '<div class="fig"><div class="k">GDP</div><div class="v">' + esc(currency) + (n.gdp != null ? esc(fmtGdp(n.gdp)) : '—') + '</div></div>' +
          '<div class="fig"><div class="k">Population</div><div class="v">' + (n.population != null ? esc(fmtPop(n.population)) : '—') + '</div></div>' +
        '</div>' +
        '<div class="gov">' +
          '<div class="who"><span class="ttl">' + esc(hogTitle) + '</span> &mdash; <b>' + hog + '</b>' + hogTag + '</div>' +
          '<span class="govtype">' + esc(govType) + '</span>' +
        '</div>' +
        '<div class="wstats">' + statsHtml + '</div>' +
      '</a>';
    }).join('');

    document.getElementById('content').innerHTML = '<div class="grid">' + cards + '</div>';
  }

  (async () => {
    if (!isConfigured) { fail('Supabase isn’t configured.'); return; }
    const user = await requireUser();
    if (!user) return; // redirected to login
    try {
      const { data: party } = await supabase.from('parties').select('name, archetype, nation_id, influence').eq('user_id', user.id).single();
      if (!party) { window.location.replace('/nation-select/'); return; }

      // Home nation drives the sidebar brand + the topbar's currency.
      const { data: home } = await supabase.from('nations').select('name, flag, economy').eq('id', party.nation_id).maybeSingle();

      // Every OTHER nation — these are the cards. A query ERROR (e.g. a schema not yet
      // applied) must surface loudly, not masquerade as "no nations founded" — Supabase
      // returns the error rather than throwing, so the outer try/catch never sees it.
      const { data: others, error: othersErr } = await supabase.from('nations')
        .select('id, name, flag, population, gdp, economy, stats, declarations')
        .neq('id', party.nation_id).eq('dormant', false).order('name');   // hide dormant (unactivated) nations
      if (othersErr) { fail('Couldn’t load the other nations right now. Refresh to try again.'); return; }
      const nations = others || [];

      // The Head of Government title slot, resolved per-nation against each
      // nation's declarations in render (one source — see util.js).
      const titleSlot = await loadHogTitleSlot(supabase);

      // Active governments for those nations (most will have none yet), and the
      // leader of each formateur party for the Head of Government line. Batched.
      var govByNation = {}, leaderByParty = {}, partyById = {};
      const ids = nations.map(function(n){ return n.id; });
      if (ids.length) {
        const { data: govs } = await supabase.from('governments')
          .select('nation_id, type, formateur_party_id').in('nation_id', ids).eq('status', 'active');
        (govs || []).forEach(function(g){ govByNation[g.nation_id] = g; });

        const fpIds = (govs || []).map(function(g){ return g.formateur_party_id; }).filter(Boolean);
        if (fpIds.length) {
          const { data: pols } = await supabase.from('politicians')
            .select('party_id, first_name, last_name').eq('status', 'Party Leader').in('party_id', fpIds);
          (pols || []).forEach(function(p){ if (!leaderByParty[p.party_id]) leaderByParty[p.party_id] = p; });
          // The governing party's abbreviation tags the Head of Government (e.g. "… [NPP]").
          const { data: fps } = await supabase.from('parties').select('id, abbreviation, name').in('id', fpIds);
          (fps || []).forEach(function(p){ partyById[p.id] = p; });
        }
      }

      const homeName = (home && home.name) || party.nation_id;
      document.getElementById('pname').textContent = party.name;
      document.getElementById('psub').textContent = ideologyLabel(party) + ' · ' + homeName;
      document.title = homeName + ' · World';
      if (home && home.flag) { var f = document.getElementById('flag'); f.onload = function(){ f.hidden = false; }; f.src = home.flag; }

      var currency = (home && home.economy && home.economy.currency) || '$';
      setTopbarActions(party.influence);

      // Relations 1–10 between the player's nation and each other nation (symmetric; missing = 5).
      var relMap = {};
      try {
        const { data: rels } = await supabase.from('nation_relations').select('nation_a, nation_b, value')
          .or('nation_a.eq.' + party.nation_id + ',nation_b.eq.' + party.nation_id);
        (rels || []).forEach(function (r) { relMap[r.nation_a === party.nation_id ? r.nation_b : r.nation_a] = r.value; });
      } catch (e) { relMap = {}; }
      render(nations, govByNation, leaderByParty, titleSlot, partyById, relMap);
    } catch (e) {
      fail('Couldn’t load the world right now. Refresh to try again.');
    }
  })();
</script>
</body>
</html>
