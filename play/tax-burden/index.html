<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/theme.js"></script>
<title>Tax Burden · Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/play.css">
<style>
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}

  /* Left navigation (desktop rail + mobile bottom bar) lives in /sidenav.js */

  .main{flex:1;padding:24px clamp(16px,4vw,56px) 56px;min-width:0}
  .page{max-width:900px}
  .back{display:inline-flex;align-items:center;gap:6px;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-decoration:none;margin-bottom:14px}
  .back:hover{color:var(--ink)}
  .phead .eye{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
  .phead h1{font-weight:900;font-size:clamp(26px,4vw,36px);letter-spacing:-.025em;margin:6px 0 22px}

  /* Tax Burden headline — the net pull of every active policy. */
  .bhero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px}
  .bhero__hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .bhero__k{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
  .bhero__v{font-size:34px;font-weight:900;letter-spacing:-.03em;color:var(--ink)}
  .bhero__desc{color:var(--muted);font-size:13.5px;line-height:1.55;margin-top:10px;max-width:640px}

  .lawshd{font-size:17px;font-weight:900;letter-spacing:-.01em;margin-bottom:10px}
  .lawlist{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 16px}
  .law{display:flex;align-items:center;gap:11px;padding:14px 0;border-top:1px solid var(--line)}
  .law:first-child{border-top:none}
  .law__name{flex:1;min-width:0;font-size:15px;font-weight:700;color:var(--ink)}
  .law__val{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;white-space:nowrap}
  .law__val--up{color:var(--red)} .law__val--down{color:var(--green)}
  .lawempty{padding:26px 0;text-align:center;color:var(--soft);font-size:13.5px}

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div id="sidenav"></div><!-- left rail / mobile bottom bar, injected by /sidenav.js -->

  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="page">
      <a class="back" href="/play/government/">&lsaquo; Government</a>
      <div class="phead">
        <span class="eye" id="tnation">The Nation</span>
        <h1>Tax Burden</h1>
      </div>

      <!-- Tax Burden = the sum of every in-force policy's Tax Burden effect (one source: policies.js). -->
      <div class="bhero">
        <div class="bhero__hd">
          <div class="bhero__k">Tax Burden</div>
          <div class="bhero__v" id="taxVal">--</div>
        </div>
        <p class="bhero__desc">The combined pull of every active policy on the nation’s tax burden — the sum of what each law adds or takes away. The laws driving it are listed below.</p>
      </div>

      <div class="lawshd">Laws Affecting Tax Burden</div>
      <div class="lawlist" id="lawList"><div class="lawempty">No active laws affecting Tax Burden.</div></div>
    </div>
  </main>
</div>

<script type="module">
  import { supabase, isConfigured, requireUser } from '/supabase.js';
  import { esc, declaredValue } from '/util.js';
  import { ideologyLabel } from '/archetypes.js';
  import { mountTopbar, setTopbarActions } from '/topbar.js';
  import { mountSidenav } from '/sidenav.js';
  import { nationStatContributions } from '/policies.js';

  mountTopbar();   // shared top bar (Discord/Influence/Budget Balance/date/gear) into #topbar
  mountSidenav();  // left rail (desktop) / bottom bar (mobile) into #sidenav

  (async () => {
    if (!isConfigured) return;
    const user = await requireUser();
    if (!user) return; // redirected to login
    try {
      const { data: party, error } = await supabase.from('parties').select('id, nation_id, name, archetype, influence').eq('user_id', user.id).single();
      if (error || !party) { window.location.replace('/nation-select/'); return; }
      var nRes = await supabase.from('nations').select('name, flag, declarations, policies, gdp').eq('id', party.nation_id).single();
      var nation = nRes.data || {};

      var nationName = nation.name || party.nation_id;
      try {
        const { data: slots } = await supabase.from('declarations').select('slug, label, options, default_index, custom_allowed').eq('slug', 'formal_state_name').limit(1);
        var formal = (slots && slots[0]) ? declaredValue(slots[0], nation.declarations) : '';
        if (formal && formal !== '—') nationName = formal;
      } catch (e) {}
      document.getElementById('tnation').textContent = nationName;
      document.getElementById('pname').textContent = party.name;
      document.getElementById('psub').textContent = ideologyLabel(party) + ' · ' + (nation.name || party.nation_id);
      if (nation.flag) { var f = document.getElementById('flag'); f.onload = function () { f.hidden = false; }; f.src = nation.flag; }
      setTopbarActions(party.influence);

      // Tax Burden is the SUM of every in-force policy's Tax Burden effect (one source: policies.js) —
      // the same generalisation as Budget Balance / Bureaucracy. Contributing policies are listed below.
      var pols = [];
      try { const { data } = await supabase.from('policies').select('id, definition'); pols = data || []; } catch (e) {}
      var tax = nationStatContributions(pols, nation.policies, nation.gdp, 'Tax Burden');
      var total = Math.round(tax.total * 10) / 10;
      document.getElementById('taxVal').textContent = (total > 0 ? '+' : total < 0 ? '−' : '') + Math.abs(total);

      // Laws Affecting Tax Burden — every policy contributing to the total, biggest first. Raising the
      // burden (heavier taxes) reads red; easing it reads green.
      document.getElementById('lawList').innerHTML = tax.items.length
        ? tax.items.sort(function (a, b) { return Math.abs(b.amount) - Math.abs(a.amount); }).map(function (it) {
            var up = it.amount > 0;
            return '<div class="law"><span class="law__name">' + esc(it.name) + '</span>' +
              '<span class="law__val law__val--' + (up ? 'up' : 'down') + '">' + (up ? '+' : '−') + (Math.round(Math.abs(it.amount) * 10) / 10) + '</span></div>';
          }).join('')
        : '<div class="lawempty">No active laws affecting Tax Burden.</div>';
    } catch (e) { /* placeholders already shown; topbar still renders */ }
  })();
</script>
</body>
</html>
