<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/theme.js"></script>
<title>Nation · Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAF8;--surface:#FFFFFF;--ink:#15151B;--muted:#5b5b63;--soft:#8d8d95;
    --line:#E7E5E0;--line2:#D9D6D0;--chip:#F4F3EF;--field:#FCFBF9;
    --indigo:#5546E8;--indigo-soft:#ECE9FD;
    --red:#C42B2B;--red-soft:#FBEAE9;--amber:#E0820E;--amber-soft:#FBF0DD;--green:#16915a;--green-soft:#E5F4EC;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .app{display:flex;min-height:100vh}

  /* Left navigation (desktop rail + mobile bottom bar) lives in /sidenav.js */

  .main{flex:1;padding:24px clamp(16px,4vw,56px) 56px;min-width:0}
  .phead .eye{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--indigo)}
  .phead h1{font-weight:900;font-size:clamp(24px,3.6vw,32px);letter-spacing:-.03em;margin-top:4px}
  .empty{text-align:center;padding:40px 20px;color:var(--soft)}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-top:16px}
  .panel h2{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:14px}

  /* Nation panel header: title + "View Other Nations" dropdown */
  .nhd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .nhd h2{margin-bottom:0}
  .viewwrap{position:relative}
  .viewbtn{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--indigo);background:var(--indigo-soft);border:1px solid color-mix(in srgb,var(--indigo) 30%,transparent);border-radius:8px;padding:8px 13px;cursor:pointer}
  .viewbtn:hover{filter:brightness(.97)}
  .viewmenu{position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 34px -14px rgba(0,0,0,.32);padding:6px;min-width:210px;max-height:320px;overflow:auto;z-index:30}
  .viewmenu a{display:block;padding:9px 12px;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--ink);text-decoration:none;white-space:nowrap}
  .viewmenu a:hover{background:var(--chip)}
  .viewmenu .vempty{padding:10px 12px;color:var(--soft);font-size:12.5px}

  /* identity box: map (left) + facts (right) */
  .idgrid{display:grid;grid-template-columns:390px 1fr;gap:26px;align-items:start}
  @media(max-width:760px){.idgrid{grid-template-columns:1fr}}
  .map__ph{position:relative;aspect-ratio:4/3;background:var(--chip);border:1px solid var(--line2);border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--soft);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .natmap{position:absolute;inset:0;width:100%;height:100%;display:block}
  .map__none{position:relative;z-index:1}
  .maptoggle{display:flex;gap:6px;margin-top:10px}
  .mt{flex:1;padding:8px 6px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;border:1px solid var(--line2);border-radius:8px;background:var(--surface);color:var(--muted);cursor:pointer}
  .mt.on{background:var(--indigo-soft);border-color:var(--indigo);color:var(--indigo)}
  .facts{display:flex;flex-direction:column}
  .frow{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
  .frow:last-child{border-bottom:none}
  .frow .fk{color:var(--muted);font-size:12.5px;font-family:'Space Mono',monospace;letter-spacing:.03em}
  .frow .fv{font-weight:700;font-size:14.5px;text-align:right}

  /* domestic economy strip */
  .econ{display:flex;flex-wrap:wrap;gap:10px}
  .ecell{flex:1;min-width:118px;border:1px solid var(--line);border-radius:11px;padding:11px 14px;background:var(--field)}
  .ecell .k{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
  .ecell .v{font-weight:800;font-size:19px;letter-spacing:-.01em;margin-top:3px}

  /* national identity (declarations) */
  .decls{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:16px 26px}
  .dgrp__h{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:4px}
  .drow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .drow:last-child{border-bottom:none}
  .drow .dk{color:var(--muted)}
  .drow .dv{font-weight:700;text-align:right}

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div id="sidenav"></div><!-- left rail / mobile bottom bar, injected by /sidenav.js -->

  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="phead"><span class="eye">The Nation</span><h1 id="nhead">…</h1></div>
    <div id="content"><div class="panel"><div class="empty">Loading the nation…</div></div></div>
  </main>
</div>

<script type="module">
  import { supabase, isConfigured, requireUser } from '/supabase.js';
  import { esc, fmtPop, declaredValue } from '/util.js';
  import { regimeText } from '/ladders.js';
  import { mountTopbar, setTopbarActions, setTopbarFunds } from '/topbar.js';
  import { mountSidenav } from '/sidenav.js';
  import { ideologyLabel } from '/archetypes.js';
  import { axialToPix, pixToAxial, hexPath, hexEdge, borderEdges, nationColors } from '/hexmap.js';

  mountTopbar(); // shared top bar (Discord/funds/actions/date/gear) into #topbar
  mountSidenav();  // left rail (desktop) / bottom bar (mobile) into #sidenav; active item from the URL

  function fail(msg){ document.getElementById('content').innerHTML = '<div class="panel"><div class="empty">' + msg + '</div></div>'; }
  function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

  // The domestic production resources (Diplomacy is foreign, shown elsewhere).
  var ECON = ['energy', 'food', 'minerals', 'goods', 'services', 'military'];

  // ---- World map mini-view (the Nation panel's Map box; reads the shared world_hexes) ----
  // NMAP holds the land hexes + a colour per nation; drawNatMap fits the painted world into
  // the box. Nation mode = THIS nation's hexes in colour, every other land hex greyed, sea
  // shown; Continent/World colour all nations. Geometry comes from the shared hexmap module.
  var NMAP = { hexes: [], natColor: {}, viewedId: null, mode: 'nation', focusContinent: null };
  function drawNatMap() {
    var cv = document.getElementById('natMap'), box = document.getElementById('natMapBox'), none = document.getElementById('natMapNone');
    if (!cv || !box) return;
    var land = NMAP.hexes.filter(function (h) { return h.terrain === 'land'; });
    if (!land.length) { if (none) none.style.display = ''; cv.style.display = 'none'; return; }
    if (none) none.style.display = 'none'; cv.style.display = 'block';
    var DPR = window.devicePixelRatio || 1, W = box.clientWidth, H = box.clientHeight;
    cv.width = W * DPR; cv.height = H * DPR; var ctx = cv.getContext('2d'); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var hmap = {}; land.forEach(function (h) { hmap[h.q + ',' + h.r] = h; });
    var landAt = function (q, r) { return hmap[q + ',' + r] || null; };
    // Fit/centre on the FOCUS hexes: Nation = the viewed nation's hexes; Continent = its
    // continent's hexes; World = the whole painted world. M = hexes of context around the focus.
    var fc = NMAP.focusContinent;
    var focused = NMAP.mode === 'nation' ? land.filter(function (h) { return h.nation_id === NMAP.viewedId; })
                : (NMAP.mode === 'continent' && fc) ? land.filter(function (h) { return h.continent === fc; })
                : null;
    var focus = (focused && focused.length) ? focused : land;   // no focus hexes → show the world
    var M = (focused && focused.length) ? 3 : 2.5;
    var minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity;
    focus.forEach(function (h) { var p = axialToPix(h.q, h.r, 1, 0, 0); minx = Math.min(minx, p.x); maxx = Math.max(maxx, p.x); miny = Math.min(miny, p.y); maxy = Math.max(maxy, p.y); });
    minx -= M * Math.sqrt(3); maxx += M * Math.sqrt(3); miny -= M * 1.5; maxy += M * 1.5;
    var pad = 6, bw = (maxx - minx) || 1, bh = (maxy - miny) || 1, s = Math.min((W - 2 * pad) / bw, (H - 2 * pad) / bh);
    var ox = pad - minx * s + ((W - 2 * pad) - bw * s) / 2, oy = pad - miny * s + ((H - 2 * pad) - bh * s) / 2;
    // Visible axial window = the box's four corners back-projected (so surrounding land/sea
    // fill the frame around the focus, whatever the zoom). One extra ring of margin.
    var cs = [pixToAxial(0, 0, s, ox, oy), pixToAxial(W, 0, s, ox, oy), pixToAxial(0, H, s, ox, oy), pixToAxial(W, H, s, ox, oy)];
    var qs = cs.map(function (c) { return c[0]; }), rs = cs.map(function (c) { return c[1]; });
    var QA = Math.min.apply(null, qs) - 1, QB = Math.max.apply(null, qs) + 1, RA = Math.min.apply(null, rs) - 1, RB = Math.max.apply(null, rs) + 1;
    ctx.clearRect(0, 0, W, H); ctx.fillStyle = '#bcd9e6'; ctx.fillRect(0, 0, W, H);
    for (var r = RA; r <= RB; r++) for (var q = QA; q <= QB; q++) {
      var p = axialToPix(q, r, s, ox, oy); if (p.x < -s * 2 || p.x > W + s * 2 || p.y < -s * 2 || p.y > H + s * 2) continue;
      var h = hmap[q + ',' + r];
      hexPath(ctx, p.x, p.y, s * 0.96);
      if (h) {
        if (NMAP.mode === 'nation') ctx.fillStyle = (h.nation_id && h.nation_id === NMAP.viewedId) ? (NMAP.natColor[h.nation_id] || '#5546E8') : '#cdc6b8';
        else if (NMAP.mode === 'continent' && fc && h.continent !== fc) ctx.fillStyle = '#cdc6b8';   // off-continent land greyed
        else ctx.fillStyle = h.nation_id ? (NMAP.natColor[h.nation_id] || '#9a8f7d') : '#e9e3d4';    // continent/world: each nation its colour
        ctx.fill();
      } else { ctx.fillStyle = ((q + r) % 2 === 0) ? '#bcd9e6' : '#a9cdde'; ctx.fill(); }
      ctx.lineWidth = 1; ctx.strokeStyle = h ? 'rgba(120,110,90,.25)' : 'rgba(110,150,170,.28)'; ctx.stroke();
    }
    for (var r2 = RA; r2 <= RB; r2++) for (var q2 = QA; q2 <= QB; q2++) {
      if (!landAt(q2, r2)) continue;
      var p2 = axialToPix(q2, r2, s, ox, oy); if (p2.x < -s * 2 || p2.x > W + s * 2 || p2.y < -s * 2 || p2.y > H + s * 2) continue;
      borderEdges(landAt, q2, r2).forEach(function (ed) {
        var e = hexEdge(p2.x, p2.y, s * 0.96, ed.d);
        ctx.beginPath(); ctx.moveTo(e.x1, e.y1); ctx.lineTo(e.x2, e.y2);
        if (ed.sea) { ctx.strokeStyle = '#7fa9bd'; ctx.lineWidth = 1.6; } else { ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1.2; } ctx.stroke();
      });
    }
  }
  window.addEventListener('resize', function () { if (document.getElementById('natMap')) drawNatMap(); });

  function render(nation, slots, gov, pmParty, pmPol, others, viewId){
    var vals = nation.declarations || {};
    var slotBySlug = {}; slots.forEach(function(s){ slotBySlug[s.slug] = s; });
    // This slot's current value — via the shared one-source helper (see util.js).
    function declValue(slug){ return declaredValue(slotBySlug[slug], vals); }

    var eco = nation.economy || {}, prod = nation.production || {};
    // Regime line via the shared regimeText() (one source) → e.g. "Minority — Electoral Democracy (17)".
    var regimeTxt = regimeText(eco.regime);
    var govType = (gov ? cap(gov.type) : 'No government') + (regimeTxt !== '—' ? ' — ' + regimeTxt : '');
    var hog = pmPol ? (esc((pmPol.first_name || '') + ' ' + (pmPol.last_name || '')).trim() + ', ' + (pmPol.age != null ? pmPol.age : '?') + ' (' + esc(pmParty ? pmParty.name : '—') + ')') : '—';
    var conf = gov ? (Math.round(gov.confidence) + '%') : '—';

    function frow(k, v){ return '<div class="frow"><span class="fk">' + k + '</span><span class="fv">' + v + '</span></div>'; }

    // "View Other Nations" dropdown — every other nation links to its page (?nation=id).
    var navItems = (others || []).filter(function(n){ return n.id !== viewId; })
      .map(function(n){ return '<a href="/play/nation/?nation=' + encodeURIComponent(n.id) + '">' + esc(n.name) + '</a>'; }).join('');
    var viewMenu = '<div class="viewwrap"><button class="viewbtn" id="viewBtn" type="button">View Other Nations ▾</button>' +
      '<div class="viewmenu" id="viewMenu" hidden>' + (navItems || '<div class="vempty">No other nations yet.</div>') + '</div></div>';

    var identity =
      '<section class="panel"><div class="nhd"><h2>Nation</h2>' + viewMenu + '</div><div class="idgrid">' +
        '<div><div class="map__ph" id="natMapBox"><canvas class="natmap" id="natMap"></canvas><span class="map__none" id="natMapNone">No map yet</span></div><div class="maptoggle">' +
          '<button class="mt on" type="button" data-m="nation">Nation</button>' +
          '<button class="mt" type="button" data-m="continent">Continent</button>' +
          '<button class="mt" type="button" data-m="world">World</button></div></div>' +
        '<div class="facts">' +
          frow('Official Nation Name', esc(declValue('formal_state_name'))) +
          frow('Demonym', esc(declValue('demonym'))) +
          frow('Population', fmtPop(nation.population)) +
          frow('Capital', esc(declValue('capital_name'))) +
          frow('Government Type', esc(govType)) +
          frow('Head of Government', hog) +
          frow('Government Confidence', conf) +
        '</div>' +
      '</div></section>';

    var economy =
      '<section class="panel"><h2>Domestic Economy</h2><div class="econ">' +
        ECON.map(function(k){ var v = prod[k]; return '<div class="ecell"><div class="k">' + cap(k) + ' Production</div><div class="v">' + (v != null ? v : '—') + '</div></div>'; }).join('') +
      '</div></section>';

    // National Identity = every declaration slot's current value, grouped.
    var groups = [];
    slots.forEach(function(s){ var g = s.grp || 'Other'; if (groups.indexOf(g) < 0) groups.push(g); });
    var declHtml = slots.length
      ? '<div class="decls">' + groups.map(function(g){
          var rows = slots.filter(function(s){ return (s.grp || 'Other') === g; })
            .map(function(s){ return '<div class="drow"><span class="dk">' + esc(s.label) + '</span><span class="dv">' + esc(declValue(s.slug)) + '</span></div>'; }).join('');
          return '<div class="dgrp"><div class="dgrp__h">' + esc(g) + '</div>' + rows + '</div>';
        }).join('') + '</div>'
      : '<p class="empty" style="padding:20px">No declarations have been defined yet.</p>';
    var identityBox = '<section class="panel"><h2>National Identity</h2>' + declHtml + '</section>';

    document.getElementById('content').innerHTML = identity + economy + identityBox;
    document.querySelectorAll('.maptoggle .mt').forEach(function(b){
      b.onclick = function(){ document.querySelectorAll('.maptoggle .mt').forEach(function(x){ x.classList.toggle('on', x === b); }); NMAP.mode = b.dataset.m; drawNatMap(); };
    });
    drawNatMap();
    var vb = document.getElementById('viewBtn'), vm = document.getElementById('viewMenu');
    if (vb && vm) {
      vb.onclick = function(e){ e.stopPropagation(); vm.hidden = !vm.hidden; };
      document.addEventListener('click', function(e){ if (!vm.hidden && e.target !== vb && !vm.contains(e.target)) vm.hidden = true; });
    }
  }

  (async () => {
    if (!isConfigured) { fail('Supabase isn’t configured.'); return; }
    const user = await requireUser();
    if (!user) return; // redirected to login
    try {
      const { data: party } = await supabase.from('parties').select('name, archetype, nation_id, funds, actions_remaining').eq('user_id', user.id).single();
      if (!party) { window.location.replace('/nation-select/'); return; }

      // Which nation to show: ?nation=<id> lets you view any nation; default is your own.
      var viewId = new URLSearchParams(location.search).get('nation') || party.nation_id;
      const { data: nation } = await supabase.from('nations')
        .select('name, flag, population, economy, production, declarations').eq('id', viewId).maybeSingle();
      if (!nation) { fail('That nation could not be found.'); return; }
      const { data: slots } = await supabase.from('declarations').select('slug, label, options, default_index, custom_allowed, grp, sort_order').order('sort_order').order('created_at');
      const { data: gov } = await supabase.from('governments').select('type, confidence, formateur_party_id').eq('nation_id', viewId).eq('status', 'active').maybeSingle();
      var oRes = await supabase.from('nations').select('id, name, flag, economy, color').order('name');
      if (oRes.error) oRes = await supabase.from('nations').select('id, name, flag, economy').order('name');   // color not migrated yet
      const others = oRes.data;

      var pmParty = null, pmPol = null;
      if (gov && gov.formateur_party_id) {
        var r1 = await supabase.from('parties').select('name').eq('id', gov.formateur_party_id).maybeSingle();
        pmParty = r1.data;
        var r2 = await supabase.from('politicians').select('first_name, last_name, age').eq('party_id', gov.formateur_party_id).eq('status', 'Party Leader').order('created_at').limit(1).maybeSingle();
        pmPol = r2.data;
      }

      // Sidebar + topbar always reflect YOUR party/home nation, even while viewing
      // another — read from the nations list already fetched for the dropdown.
      var home = (others || []).filter(function(n){ return n.id === party.nation_id; })[0] || {};
      document.getElementById('pname').textContent = party.name;
      document.getElementById('psub').textContent = ideologyLabel(party) + ' · ' + (home.name || party.nation_id);
      document.getElementById('nhead').textContent = nation.name || viewId;
      if (home.flag) { var f = document.getElementById('flag'); f.onload = function(){ f.hidden = false; }; f.src = home.flag; }

      var currency = (home.economy && home.economy.currency) || '$';
      setTopbarFunds(currency, party.funds);
      setTopbarActions(party.actions_remaining);
      // World map mini-view: load hexes + per-nation colours (non-fatal — the page still
      // works before the world_hexes table/data exists). Colours match the editor (palette
      // by nation name order). render() calls drawNatMap() once the canvas is in the DOM.
      var hexData = [];
      try {
        var hr = await supabase.from('world_hexes').select('q, r, terrain, nation_id, continent');
        // Fall back if the continent column isn't migrated yet, so the map (Nation/World) still
        // works — [Continent] just falls back to the world view until it's applied.
        if (hr.error) hr = await supabase.from('world_hexes').select('q, r, terrain, nation_id');
        if (!hr.error) hexData = hr.data || [];
      } catch (e) {}
      NMAP.hexes = hexData; NMAP.viewedId = viewId; NMAP.mode = 'nation';
      NMAP.natColor = nationColors(others || []);   // palette by name order — matches the editor
      // The viewed nation's continent = the one most of its hexes sit on (drives [Continent]).
      var cc = {}; hexData.forEach(function (h) { if (h.nation_id === viewId && h.continent) cc[h.continent] = (cc[h.continent] || 0) + 1; });
      NMAP.focusContinent = Object.keys(cc).sort(function (a, b) { return cc[b] - cc[a]; })[0] || null;
      render(nation, slots || [], gov, pmParty, pmPol, others || [], viewId);
    } catch (e) {
      fail('Couldn’t load the nation right now. Refresh to try again.');
    }
  })();
</script>
</body>
</html>
