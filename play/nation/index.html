<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nation · Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAF8;--surface:#FFFFFF;--ink:#15151B;--muted:#5b5b63;--soft:#8d8d95;
    --line:#E7E5E0;--line2:#D9D6D0;--chip:#F4F3EF;--field:#FCFBF9;
    --indigo:#5546E8;--indigo-soft:#ECE9FD;
    --red:#C42B2B;--red-soft:#FBEAE9;--amber:#E0820E;--amber-soft:#FBF0DD;--green:#16915a;--green-soft:#E5F4EC;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .app{display:flex;min-height:100vh}

  .side{width:236px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
  .brand__flag{width:42px;height:26px;object-fit:cover;border:1px solid var(--line);border-radius:4px;flex:none}
  .brand__txt{display:flex;flex-direction:column;line-height:1.25;overflow:hidden}
  .brand__txt b{font-weight:800;font-size:14px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand__txt span{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav__i{display:flex;align-items:center;gap:13px;padding:10px 12px;border-radius:9px;color:var(--muted);text-decoration:none;cursor:pointer;border:1px solid transparent}
  .nav__i svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .nav__i .label{font-family:'Space Mono',monospace;font-size:12.5px;letter-spacing:.04em}
  .nav__i:hover{color:var(--ink);background:var(--chip)}
  .nav__i.active{color:var(--indigo);background:var(--indigo-soft);font-weight:700}
  .nav__i.active svg{color:var(--indigo)}
  .side__foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}
  .me{display:flex;align-items:center;gap:10px;padding:8px 10px;color:var(--muted);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em}
  .me b{color:var(--ink);font-weight:700}
  .me__dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none}
  .logout{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;background:none;border:none;cursor:pointer;color:var(--soft);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em;text-align:left;transition:color .15s}
  .logout:hover{color:var(--red)}
  .logout svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  .main{flex:1;padding:24px clamp(16px,4vw,56px) 56px;min-width:0}
  .phead .eye{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--indigo)}
  .phead h1{font-weight:900;font-size:clamp(24px,3.6vw,32px);letter-spacing:-.03em;margin-top:4px}
  .empty{text-align:center;padding:40px 20px;color:var(--soft)}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-top:16px}
  .panel h2{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:14px}

  /* identity box: map (left) + facts (right) */
  .idgrid{display:grid;grid-template-columns:390px 1fr;gap:26px;align-items:start}
  @media(max-width:760px){.idgrid{grid-template-columns:1fr}}
  .map__ph{aspect-ratio:4/3;background:var(--chip);border:1px dashed var(--line2);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--soft);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .maptoggle{display:flex;gap:6px;margin-top:10px}
  .mt{flex:1;padding:8px 6px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--muted);cursor:pointer}
  .mt.on{background:var(--indigo-soft);border-color:var(--indigo);color:var(--indigo)}
  .facts{display:flex;flex-direction:column}
  .frow{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
  .frow:last-child{border-bottom:none}
  .frow .fk{color:var(--muted);font-size:12.5px;font-family:'Space Mono',monospace;letter-spacing:.03em}
  .frow .fv{font-weight:700;font-size:14.5px;text-align:right}

  /* domestic economy strip */
  .econ{display:flex;flex-wrap:wrap;gap:10px}
  .ecell{flex:1;min-width:118px;border:1px solid var(--line);border-radius:11px;padding:11px 14px;background:var(--field)}
  .ecell .k{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
  .ecell .v{font-weight:800;font-size:19px;letter-spacing:-.01em;margin-top:3px}

  /* national identity (declarations) */
  .decls{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:16px 26px}
  .dgrp__h{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:4px}
  .drow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .drow:last-child{border-bottom:none}
  .drow .dk{color:var(--muted)}
  .drow .dv{font-weight:700;text-align:right}

  @media(max-width:820px){.side{width:62px;padding:16px 8px}.nav__i .label,.brand__txt,.me .label,.logout .label{display:none}.logout{justify-content:center}.brand{justify-content:center;padding:6px 0 14px}.brand__flag{width:38px;height:24px}.nav__i{justify-content:center;padding:11px 0}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <img class="brand__flag" id="flag" alt="Nation flag" hidden>
      <div class="brand__txt"><b id="sname">…</b><span id="psub"></span></div>
    </div>
    <nav class="nav">
      <a class="nav__i" href="/play/"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v9h14v-9"/></svg><span class="label">Home</span></a>
      <a class="nav__i" href="/play/party/"><svg viewBox="0 0 24 24"><path d="M5 3v18"/><path d="M5 4h12l-2 4 2 4H5"/></svg><span class="label">Party</span></a>
      <a class="nav__i" href="/play/elections/"><svg viewBox="0 0 24 24"><path d="M4 7h16v13H4z"/><path d="M8 7V4h8v3"/><path d="M8.5 13l2 2 4-4"/></svg><span class="label">Elections</span></a>
      <a class="nav__i" href="/play/government/"><svg viewBox="0 0 24 24"><path d="M3 9l9-5 9 5"/><path d="M3 9h18M4 20h16"/><path d="M6 20v-9M10 20v-9M14 20v-9M18 20v-9"/></svg><span class="label">Government</span></a>
      <a class="nav__i" href="/play/legislature/"><svg viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M5 21V10M9 21V10M15 21V10M19 21V10"/><path d="M12 3l9 5H3z"/></svg><span class="label">Legislature</span></a>
      <a class="nav__i active" href="/play/nation/"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4-3 7-7 8-4-1-7-4-7-8V6l7-3z"/></svg><span class="label">Nation</span></a>
      <a class="nav__i" href="/play/world/"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span class="label">World</span></a>
      <a class="nav__i" href="/play/market/"><svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M6 20v-6M10 20v-10M14 20v-7M18 20v-12"/></svg><span class="label">Market</span></a>
      <a class="nav__i"><svg viewBox="0 0 24 24"><path d="M17 4l3 3-9 9-3-3z"/><path d="M7 4L4 7l9 9 3-3"/><path d="M5 16l-1 4 4-1M19 16l1 4-4-1"/></svg><span class="label">Conflict</span></a>
      <a class="nav__i"><svg viewBox="0 0 24 24"><path d="M4 5h12v8H8l-4 3z"/><path d="M18 9h2v9l-3-2h-5"/></svg><span class="label">Forum</span></a>
      <a class="nav__i"><svg viewBox="0 0 24 24"><path d="M12 5v15"/><path d="M4 4h6a2 2 0 012 2 2 2 0 012-2h6v13h-6a2 2 0 00-2 2 2 2 0 00-2-2H4z"/></svg><span class="label">Wiki</span></a>
    </nav>
    <div class="side__foot">
      <div class="me"><span class="me__dot"></span><span class="label">Leader · <b>You</b></span></div>
      <button class="logout" id="logout" type="button"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span class="label">Logout</span></button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="phead"><span class="eye">The Nation</span><h1 id="nhead">…</h1></div>
    <div id="content"><div class="panel"><div class="empty">Loading the nation…</div></div></div>
  </main>
</div>

<script type="module">
  import { supabase, isConfigured, requireUser, logout } from '/supabase.js';
  import { esc, fmtPop, declaredValue } from '/util.js';
  import { regimeLabel } from '/ladders.js';
  import { mountTopbar, setTopbarActions, setTopbarFunds } from '/topbar.js';

  document.getElementById('logout').addEventListener('click', logout);
  mountTopbar(); // shared top bar (Discord/funds/actions/date/gear) into #topbar

  function fail(msg){ document.getElementById('content').innerHTML = '<div class="panel"><div class="empty">' + msg + '</div></div>'; }
  function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

  // The 5 domestic production resources (Diplomacy is foreign, shown elsewhere).
  var ECON = ['energy', 'food', 'minerals', 'goods', 'services'];

  function render(nation, slots, gov, pmParty, pmPol){
    var vals = nation.declarations || {};
    var slotBySlug = {}; slots.forEach(function(s){ slotBySlug[s.slug] = s; });
    // This slot's current value — via the shared one-source helper (see util.js).
    function declValue(slug){ return declaredValue(slotBySlug[slug], vals); }

    var eco = nation.economy || {}, prod = nation.production || {};
    var regime = eco.regime;
    var regimeTxt = (typeof regime === 'number') ? (regimeLabel(regime) + ' – ' + regime) : (regime || '—');
    var govType = (gov ? cap(gov.type) : 'No government') + ' (' + regimeTxt + ')';
    var hog = pmPol ? (esc((pmPol.first_name || '') + ' ' + (pmPol.last_name || '')).trim() + ', ' + (pmPol.age != null ? pmPol.age : '?') + ' (' + esc(pmParty ? pmParty.name : '—') + ')') : '—';
    var conf = gov ? (gov.confidence + '%') : '—';

    function frow(k, v){ return '<div class="frow"><span class="fk">' + k + '</span><span class="fv">' + v + '</span></div>'; }

    var identity =
      '<section class="panel"><h2>Nation</h2><div class="idgrid">' +
        '<div><div class="map__ph">Map</div><div class="maptoggle">' +
          '<button class="mt on" type="button" data-m="nation">Nation</button>' +
          '<button class="mt" type="button" data-m="continent">Continent</button>' +
          '<button class="mt" type="button" data-m="world">World</button></div></div>' +
        '<div class="facts">' +
          frow('Official Nation Name', esc(declValue('formal_state_name'))) +
          frow('Demonym', esc(declValue('demonym'))) +
          frow('Population', fmtPop(nation.population)) +
          frow('Capital', esc(declValue('capital_name'))) +
          frow('Government Type', esc(govType)) +
          frow('Head of Government', hog) +
          frow('Government Confidence', conf) +
        '</div>' +
      '</div></section>';

    var economy =
      '<section class="panel"><h2>Domestic Economy</h2><div class="econ">' +
        ECON.map(function(k){ var v = prod[k]; return '<div class="ecell"><div class="k">' + cap(k) + '</div><div class="v">' + (v != null ? v : '—') + '</div></div>'; }).join('') +
      '</div></section>';

    // National Identity = every declaration slot's current value, grouped.
    var groups = [];
    slots.forEach(function(s){ var g = s.grp || 'Other'; if (groups.indexOf(g) < 0) groups.push(g); });
    var declHtml = slots.length
      ? '<div class="decls">' + groups.map(function(g){
          var rows = slots.filter(function(s){ return (s.grp || 'Other') === g; })
            .map(function(s){ return '<div class="drow"><span class="dk">' + esc(s.label) + '</span><span class="dv">' + esc(declValue(s.slug)) + '</span></div>'; }).join('');
          return '<div class="dgrp"><div class="dgrp__h">' + esc(g) + '</div>' + rows + '</div>';
        }).join('') + '</div>'
      : '<p class="empty" style="padding:20px">No declarations have been defined yet.</p>';
    var identityBox = '<section class="panel"><h2>National Identity</h2>' + declHtml + '</section>';

    document.getElementById('content').innerHTML = identity + economy + identityBox;
    document.querySelectorAll('.maptoggle .mt').forEach(function(b){
      b.onclick = function(){ document.querySelectorAll('.maptoggle .mt').forEach(function(x){ x.classList.toggle('on', x === b); }); };
    });
  }

  (async () => {
    if (!isConfigured) { fail('Supabase isn’t configured.'); return; }
    const user = await requireUser();
    if (!user) return; // redirected to login
    try {
      const { data: party } = await supabase.from('parties').select('name, archetype, nation_id, funds, actions_remaining').eq('user_id', user.id).single();
      if (!party) { window.location.replace('/nation-select/'); return; }
      const { data: nation } = await supabase.from('nations')
        .select('name, flag, population, economy, production, declarations').eq('id', party.nation_id).single();
      const { data: slots } = await supabase.from('declarations').select('slug, label, options, default_index, custom_allowed, grp, sort_order').order('sort_order').order('created_at');
      const { data: gov } = await supabase.from('governments').select('type, confidence, formateur_party_id').eq('nation_id', party.nation_id).eq('status', 'active').maybeSingle();

      var pmParty = null, pmPol = null;
      if (gov && gov.formateur_party_id) {
        var r1 = await supabase.from('parties').select('name').eq('id', gov.formateur_party_id).maybeSingle();
        pmParty = r1.data;
        var r2 = await supabase.from('politicians').select('first_name, last_name, age').eq('party_id', gov.formateur_party_id).eq('status', 'Party Leader').order('created_at').limit(1).maybeSingle();
        pmPol = r2.data;
      }

      const nationName = (nation && nation.name) || party.nation_id;
      document.getElementById('sname').textContent = party.name;
      document.getElementById('psub').textContent = party.archetype + ' · ' + nationName;
      document.getElementById('nhead').textContent = nationName;
      if (nation && nation.flag) { var f = document.getElementById('flag'); f.onload = function(){ f.hidden = false; }; f.src = nation.flag; }

      var currency = (nation && nation.economy && nation.economy.currency) || '$';
      setTopbarFunds(currency, party.funds);
      setTopbarActions(party.actions_remaining);
      render(nation || {}, slots || [], gov, pmParty, pmPol);
    } catch (e) {
      fail('Couldn’t load the nation right now. Refresh to try again.');
    }
  })();
</script>
</body>
</html>
