<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/theme.js"></script>
<title>Policies · Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAF8;--surface:#FFFFFF;--ink:#15151B;--muted:#5b5b63;--soft:#8d8d95;
    --line:#E7E5E0;--line2:#D9D6D0;--chip:#F4F3EF;--field:#FCFBF9;
    --indigo:#5546E8;--indigo-soft:#ECE9FD;
    --red:#C42B2B;--red-soft:#FBEAE9;--amber:#E0820E;--amber-soft:#FBF0DD;--green:#16915a;--green-soft:#E5F4EC;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .app{display:flex;min-height:100vh}

  /* Left navigation (desktop rail + mobile bottom bar) lives in /sidenav.js */

  .main{flex:1;padding:24px clamp(16px,4vw,56px) 56px;min-width:0}
  .phead .eye{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--indigo)}
  .phead h1{font-weight:900;font-size:clamp(24px,3.6vw,32px);letter-spacing:-.03em;margin-top:4px}
  .phead p{color:var(--muted);font-size:14px;margin-top:6px;max-width:640px}
  .empty{text-align:center;padding:40px 20px;color:var(--soft)}

  /* Policy slate: one card per authored policy, showing the option in force for this
     nation and its standing effects, with an entry into the propose flow. */
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:18px}
  .pcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column}
  .pcard__hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .pcard__hd b{font-weight:800;font-size:16px;letter-spacing:-.01em}
  .ptype{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--soft);background:var(--chip);padding:4px 9px;border-radius:20px;flex:none;white-space:nowrap}
  .pcard__desc{color:var(--muted);font-size:13px;line-height:1.5;margin-top:6px}
  .pforce{margin-top:14px;border-top:1px solid var(--line);padding-top:13px}
  .pforce__k{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
  .pforce__v{font-weight:800;font-size:16px;letter-spacing:-.01em;margin-top:4px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .pforce__v .opt{color:var(--indigo)}
  .pdot{width:8px;height:8px;border-radius:50%;background:var(--indigo);flex:none}
  .peffs{margin-top:12px;display:flex;flex-direction:column;gap:6px}
  .peff{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:12.5px}
  .peff b{font-weight:800;flex:none}
  .peff.pos b{color:var(--green)} .peff.neg b{color:var(--red)}
  .peff .cad{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);white-space:nowrap}
  /* A full-sentence effect (the trade policy) flows as a block so the sentence and its
     cadence wrap, instead of the two-column row that suits short "+2 Prosperity" effects. */
  .peff.wide{display:block;line-height:1.55}
  .peff.wide .cad{margin-left:8px}
  .peff.none{color:var(--soft);font-style:italic}
  .pcard__foot{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);display:flex}
  .pchange{margin-left:auto;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;color:var(--indigo);background:var(--indigo-soft);border:1px solid color-mix(in srgb,var(--indigo) 30%,transparent);border-radius:9px;padding:9px 14px;text-decoration:none;cursor:pointer}
  .pchange:hover{filter:brightness(.97)}

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div id="sidenav"></div><!-- left rail / mobile bottom bar, injected by /sidenav.js -->

  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="phead"><span class="eye">The Nation</span><h1>Policies</h1>
      <p>Every policy in force across the nation and what it does while it's in force. Propose a change to send it to the chamber.</p>
    </div>
    <div id="content"><div class="empty">Loading the policy slate…</div></div>
  </main>
</div>

<script type="module">
  import { supabase, isConfigured, requireUser } from '/supabase.js';
  import { esc } from '/util.js';
  import { mountTopbar, setTopbarActions, setTopbarFunds } from '/topbar.js';
  import { mountSidenav } from '/sidenav.js';
  import { ideologyLabel } from '/archetypes.js';
  import { fetchPolicies } from '/proposals.js';
  import { policyOptions, policyOptionIdx, effectText, isTradePolicy, tradeEffectText } from '/policies.js';

  mountTopbar(); // shared top bar (Discord/funds/actions/date/gear) into #topbar
  mountSidenav();  // left rail (desktop) / bottom bar (mobile) into #sidenav; active item from the URL

  function fail(msg){ document.getElementById('content').innerHTML = '<div class="empty">' + msg + '</div>'; }

  // One policy card: the option in force for THIS nation (its stored override, else the
  // policy default — same one-source rule the propose page uses) and that option's
  // standing effects, with a link into the propose flow. pop/pros scale money effects.
  function policyCard(p, overrides, pop, pros){
    var def = p.definition || {};
    var opts = policyOptions(def);
    var cur = policyOptionIdx(def, overrides, p.id);
    var o = opts[cur] || {};
    var effs = (o.effects || []).filter(function(e){ return (e && e.cad) !== 'once'; });  // standing effects (per tick / per year), not the one-time enactment ones
    // Trade rungs carry their standing modifiers (import ×, tariff) outside the effects list — surface the in-force rung's.
    var tradeLine = isTradePolicy(def) ? '<div class="peff wide"><b>' + esc(tradeEffectText(o)) + '</b><span class="cad">while in force</span></div>' : '';
    var effHtml = (tradeLine + effs.map(function(e){ var t = effectText(e, pop, pros); return '<div class="peff ' + t.cls + '"><b>' + esc(t.text) + '</b><span class="cad">' + t.cad + '</span></div>'; }).join('')) ||
      '<div class="peff none">No standing effects.</div>';
    return '<div class="pcard">' +
      '<div class="pcard__hd"><b>' + esc(def.name || 'Policy') + '</b><span class="ptype">' + esc(def.type || 'policy') + '</span></div>' +
      (def.desc ? '<div class="pcard__desc">' + esc(def.desc) + '</div>' : '') +
      '<div class="pforce"><div class="pforce__k">In force now</div>' +
        '<div class="pforce__v"><span class="pdot"></span><span class="opt">' + esc(o.name || ('Option ' + (cur + 1))) + '</span></div>' +
        '<div class="peffs">' + effHtml + '</div></div>' +
      '<div class="pcard__foot"><a class="pchange" href="/play/legislature/propose/">Propose change ▸</a></div>' +
    '</div>';
  }

  function render(policies, nation){
    var box = document.getElementById('content');
    if (!policies.length) {
      box.innerHTML = '<div class="empty">No policies have been set up yet — an admin defines the policy slate first.</div>';
      return;
    }
    var overrides = (nation && nation.policies) || {};
    var pop = nation && nation.population, pros = nation && nation.stats && nation.stats.prosperity;
    box.innerHTML = '<div class="pgrid">' + policies.map(function(p){ return policyCard(p, overrides, pop, pros); }).join('') + '</div>';
  }

  (async () => {
    if (!isConfigured) { fail('Supabase isn’t configured.'); return; }
    const user = await requireUser();
    if (!user) return; // redirected to login
    try {
      const { data: party } = await supabase.from('parties').select('name, archetype, nation_id, funds, actions_remaining').eq('user_id', user.id).single();
      if (!party) { window.location.replace('/nation-select/'); return; }
      const { data: nation } = await supabase.from('nations')
        .select('name, flag, economy, population, stats, policies').eq('id', party.nation_id).single();

      const nationName = (nation && nation.name) || party.nation_id;
      document.getElementById('pname').textContent = party.name;
      document.getElementById('psub').textContent = ideologyLabel(party) + ' · ' + nationName;
      if (nation && nation.flag) { var f = document.getElementById('flag'); f.onload = function(){ f.hidden = false; }; f.src = nation.flag; }

      var currency = (nation && nation.economy && nation.economy.currency) || '$';
      setTopbarFunds(currency, party.funds);
      setTopbarActions(party.actions_remaining);

      var policies;
      try { policies = await fetchPolicies(); }
      catch (e) { fail('Couldn’t load the policy slate. Refresh to try again.'); return; }
      render(policies || [], nation || {});
    } catch (e) {
      fail('Couldn’t load the policy slate. Refresh to try again.');
    }
  })();
</script>
</body>
</html>
