<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/theme.js"></script>
<title>Forum · Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAF8;--surface:#FFFFFF;--ink:#15151B;--muted:#5b5b63;--soft:#8d8d95;
    --line:#E7E5E0;--line2:#D9D6D0;--chip:#F4F3EF;--field:#FCFBF9;
    --indigo:#5546E8;--indigo-soft:#ECE9FD;--amber:#E0820E;--amber-soft:#FBF0DD;--red:#C42B2B;--green:#16915a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .app{display:flex;min-height:100vh}
  /* Left navigation (desktop rail + mobile bottom bar) lives in /sidenav.js */
  .main{flex:1;padding:24px clamp(16px,3vw,40px) 60px;min-width:0;max-width:1040px}
  .eye{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--indigo)}
  h1{font-weight:900;font-size:clamp(24px,3.6vw,32px);letter-spacing:-.03em;margin-top:4px}
  .lede{color:var(--muted);font-size:13.5px;margin-top:8px;max-width:74ch}

  .realmrow{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:20px}
  .realm{display:inline-flex;border:1px solid var(--line2);border-radius:11px;overflow:hidden;background:var(--field)}
  .realm button{border:none;background:transparent;padding:11px 18px;font-family:'Space Mono',monospace;font-size:11.5px;letter-spacing:.03em;cursor:pointer;color:var(--muted)}
  .realm button.on{background:var(--ink);color:#fff;font-weight:700}
  .newthread{background:var(--indigo);color:#fff;border:none;border-radius:10px;padding:11px 17px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.04em;font-weight:700;cursor:pointer}
  .newthread:hover{filter:brightness(1.12)}

  .filterrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;min-height:34px}
  .filterrow .fl{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);margin-right:4px}
  .nchip{font-family:'Space Mono',monospace;font-size:10px;border:1px solid var(--line2);background:#fff;border-radius:20px;padding:6px 11px;cursor:pointer;color:var(--muted)}
  .nchip.on{border-color:var(--indigo);color:var(--indigo);font-weight:700;background:var(--indigo-soft)}
  .filternote{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--soft);font-style:italic}

  .boards{display:flex;flex-direction:column;gap:12px;margin-top:18px}
  .board{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px 18px}
  .b-top{display:flex;align-items:flex-start;gap:14px}
  .b-ic{width:42px;height:42px;border-radius:11px;background:var(--indigo-soft);color:var(--indigo);display:grid;place-items:center;flex:none}
  .b-ic svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .b-meta{flex:1;min-width:0}
  .b-namerow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .b-name{font-weight:800;font-size:16px;letter-spacing:-.01em;cursor:pointer}
  .b-name:hover{color:var(--indigo)}
  .systag{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;color:var(--amber);background:var(--amber-soft);border-radius:20px;padding:3px 8px}
  .b-desc{color:var(--muted);font-size:12.5px;margin-top:4px}
  .b-count{font-family:'Space Mono',monospace;font-size:10px;color:var(--soft);white-space:nowrap;flex:none;text-align:right}

  .latest{margin-top:13px;border-top:1px solid var(--line);padding-top:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .latest .lt-title{font-weight:700;font-size:13px;flex:1;min-width:180px;cursor:pointer}
  .latest .lt-title:hover{color:var(--indigo)}
  .author{display:inline-flex;align-items:center;gap:7px;font-family:'Space Mono',monospace;font-size:10.5px;color:var(--muted)}
  .author .pdot{width:8px;height:8px;border-radius:50%;flex:none}
  .author .ntag{font-size:8.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--soft);background:var(--chip);border-radius:20px;padding:2px 7px}
  .lt-stats{font-family:'Space Mono',monospace;font-size:10px;color:var(--soft);white-space:nowrap}
  .lt-empty{font-family:'Space Mono',monospace;font-size:11px;color:var(--soft);font-style:italic}

  /* board view + thread list */
  .backlink{display:inline-flex;align-items:center;gap:6px;font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);cursor:pointer;background:none;border:none;padding:0;margin-top:20px}
  .backlink:hover{color:var(--indigo)}
  .bhead{display:flex;align-items:flex-start;gap:14px;margin-top:14px}
  .bhead .b-ic{width:46px;height:46px}
  .bhead h2{font-size:20px;font-weight:800;letter-spacing:-.01em}
  .tlist{margin-top:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
  .trow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;cursor:pointer;border-top:1px solid var(--line)}
  .trow:first-child{border-top:none}
  .trow:hover{background:var(--chip)}
  .trow .tt{font-weight:700;font-size:14px;flex:1;min-width:200px}
  .tlist .lt-empty{display:block;padding:18px 16px}

  /* thread view */
  .thead{margin-top:14px}
  .thead h2{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.22}
  .tsub{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);margin-top:6px}
  .posts{display:flex;flex-direction:column;gap:12px;margin-top:18px}
  .post{border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:15px 17px}
  .post.op{border-color:color-mix(in srgb,var(--indigo) 32%,var(--line))}
  .post__hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
  .post__time{font-family:'Space Mono',monospace;font-size:10px;color:var(--soft);margin-left:auto}
  .post__body{font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}

  /* composer (reply box) */
  .composer{margin-top:16px;border:1px solid var(--line);border-radius:13px;background:var(--surface);padding:14px 16px}
  .composer textarea{width:100%;border:1px solid var(--line2);border-radius:10px;padding:11px 13px;font-family:inherit;font-size:14px;background:var(--field);color:var(--ink);resize:vertical;min-height:90px;line-height:1.5}
  .composer__row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;flex-wrap:wrap}
  .composer__as{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.04em;color:var(--soft)}
  .composer__as b{color:var(--ink)}
  .btn{background:var(--indigo);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.04em;font-weight:700;cursor:pointer}
  .btn:hover{filter:brightness(1.1)}
  .btn:disabled{opacity:.55;cursor:not-allowed;filter:none}
  .handlewarn{font-family:'Space Mono',monospace;font-size:11px;line-height:1.5;color:var(--amber);background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);border-radius:10px;padding:11px 13px;margin-top:14px}

  /* new-thread modal */
  .modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(21,21,27,.45)}
  .modal[hidden]{display:none}
  .modal__panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:520px;max-height:88vh;overflow:auto;box-shadow:0 30px 70px -30px rgba(0,0,0,.5)}
  .modal__hd{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
  .modal__hd b{font-weight:900;font-size:16px}
  .modal__x{background:none;border:none;font-size:22px;color:var(--soft);cursor:pointer;line-height:1}
  .modal__bd{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
  .modal__bd label{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-top:8px}
  .modal__bd input,.modal__bd textarea,.modal__bd select{width:100%;border:1px solid var(--line2);border-radius:10px;padding:11px 13px;font-family:inherit;font-size:14px;background:var(--field);color:var(--ink)}
  .modal__bd textarea{min-height:130px;resize:vertical;line-height:1.5}
  .modal__ft{padding:0 18px 18px;display:flex;justify-content:flex-end}

  .empty{color:var(--soft);font-style:italic;font-size:13.5px;padding:14px 0}
  @media(max-width:820px){ .main{padding-bottom:78px} }
  @media(max-width:560px){ .modal{padding:0;align-items:flex-end} .modal__panel{max-width:none;max-height:90vh;border-radius:18px 18px 0 0} }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;font-family:'Space Mono',monospace;font-size:12px;padding:13px 18px;border-radius:11px;opacity:0;pointer-events:none;transition:all .3s;z-index:120;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast b{color:#a99dff}
</style>
</head>
<body>
<div class="app">
  <div id="sidenav"></div><!-- left rail / mobile bottom bar, injected by /sidenav.js -->
  <main class="main">
    <div class="topbar" id="topbar"></div>
    <span class="eye">Forum</span>
    <h1>The Forum</h1>
    <p class="lede">Two realms: speak as a player out of character, or as your politician in character. In-character boards mirror the systems you already play — and a nation tag lets you read one country’s feed without walling off the cross-border drama.</p>
    <div id="view"><p class="empty">Loading the boards…</p></div>
  </main>
</div>

<div class="modal" id="ntModal" hidden>
  <div class="modal__panel">
    <div class="modal__hd"><b>New Thread</b><button class="modal__x" id="ntClose" type="button" aria-label="Close">&times;</button></div>
    <div class="modal__bd">
      <label for="ntBoard">Board</label>
      <select id="ntBoard"></select>
      <label for="ntTitle">Title</label>
      <input id="ntTitle" type="text" maxlength="140" placeholder="A clear title">
      <label for="ntBody">Post</label>
      <textarea id="ntBody" placeholder="Say your piece…"></textarea>
      <div class="composer__as" id="ntAs"></div>
    </div>
    <div class="modal__ft"><button class="btn" id="ntSubmit" type="button">Post Thread</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { supabase, isConfigured, requireUser } from '/supabase.js';
  import { mountTopbar } from '/topbar.js';
  import { mountSidenav } from '/sidenav.js';
  import { esc } from '/util.js';
  import { fetchBoards, fetchThreads, postCounts, fetchThread, fetchPosts, postThread, postReply, ago } from '/forum.js';

  mountTopbar();
  mountSidenav();

  var toastEl = document.getElementById('toast'), toastT;
  function ping(h){ toastEl.innerHTML = h; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove('show'); }, 3000); }

  var ST = {
    view:'boards', realm:'ooc', nation:'', board:null, threadId:null,
    boards:[],            // all board defs
    nationName:{},        // nation_id -> name
    nationsList:[],       // [{id,name}] for the IC filter
    handle:null, busy:false
  };
  var viewEl = document.getElementById('view');

  function boardsIn(realm){ return ST.boards.filter(function(b){ return b.realm === realm; }); }
  function boardDef(key){ return ST.boards.filter(function(b){ return b.key === key; })[0]; }
  function ntag(id){ return ST.nationName[id] || id; }

  // Author chip — OOC (no party) shows the @handle plainly; IC shows party dot + nation tag.
  function authorChip(row){
    if(!row.author_party) return '<span class="author">' + esc(row.author) + '</span>';
    var dot = '<span class="pdot" style="background:' + (row.author_color || '#8d8d95') + '"></span>';
    var tag = row.nation_id ? '<span class="ntag">' + esc(ntag(row.nation_id)) + '</span>' : '';
    return '<span class="author">' + dot + esc(row.author) + tag + '</span>';
  }
  function icon(b){ return '<svg viewBox="0 0 24 24">' + (b && b.icon || '') + '</svg>'; }

  // ---- BOARDS VIEW -------------------------------------------------------
  async function renderBoards(){
    var realmBoards = boardsIn(ST.realm);
    var nationFilter = (ST.realm === 'ic' && ST.nation) ? ST.nation : null;
    var threads = await fetchThreads(realmBoards.map(function(b){ return b.key; }), nationFilter);
    var latest = {};
    threads.forEach(function(t){ if(!latest[t.board]) latest[t.board] = t; });   // first = newest (bumped_at desc)
    var counts = await postCounts(Object.keys(latest).map(function(k){ return latest[k].id; }));

    var filter = ST.realm === 'ooc'
      ? '<div class="filterrow"><span class="filternote">Out-of-character boards aren’t nation-specific — everyone’s in the same room.</span></div>'
      : '<div class="filterrow"><span class="fl">Nation</span>' +
          [{id:'',name:'All'}].concat(ST.nationsList).map(function(n){
            return '<span class="nchip' + (n.id === ST.nation ? ' on' : '') + '" data-n="' + esc(n.id) + '">' + esc(n.name) + '</span>';
          }).join('') + '</div>';

    var cards = realmBoards.map(function(b){
      var t = latest[b.key];
      var replies = t ? Math.max(0, (counts[t.id] || 1) - 1) : 0;
      var line = t
        ? '<div class="latest"><span class="lt-title" data-thread="' + t.id + '">' + esc(t.title) + '</span>' + authorChip(t) +
            '<span class="lt-stats">' + replies + (replies === 1 ? ' reply' : ' replies') + ' · ' + ago(t.bumped_at) + '</span></div>'
        : '<div class="latest"><span class="lt-empty">' + (nationFilter ? 'No threads from ' + esc(ntag(nationFilter)) + ' yet — be the first.' : 'No threads yet — start one.') + '</span></div>';
      return '<div class="board"><div class="b-top"><div class="b-ic">' + icon(b) + '</div>' +
        '<div class="b-meta"><div class="b-namerow"><span class="b-name" data-board="' + esc(b.key) + '">' + esc(b.name) + '</span>' +
        (b.sys ? '<span class="systag">' + esc(b.sys) + '</span>' : '') + '</div><div class="b-desc">' + esc(b.descr) + '</div></div></div>' + line + '</div>';
    }).join('');

    viewEl.innerHTML =
      '<div class="realmrow"><div class="realm" id="realm">' +
        '<button data-r="ooc" class="' + (ST.realm === 'ooc' ? 'on' : '') + '">Out of Character</button>' +
        '<button data-r="ic" class="' + (ST.realm === 'ic' ? 'on' : '') + '">In Character</button></div>' +
        '<button class="newthread" id="newBtn">+ New Thread</button></div>' +
      filter + '<div class="boards">' + cards + '</div>';

    viewEl.querySelectorAll('#realm button').forEach(function(btn){ btn.onclick = function(){ ST.realm = btn.dataset.r; ST.nation = ''; render(); }; });
    viewEl.querySelectorAll('.nchip').forEach(function(c){ c.onclick = function(){ ST.nation = c.dataset.n; render(); }; });
    viewEl.querySelectorAll('.b-name').forEach(function(n){ n.onclick = function(){ go('board', { board:n.dataset.board }); }; });
    viewEl.querySelectorAll('.lt-title').forEach(function(n){ n.onclick = function(){ go('thread', { threadId:n.dataset.thread }); }; });
    document.getElementById('newBtn').onclick = function(){ openNewThread(null); };
  }

  // ---- BOARD VIEW (one board's threads) ----------------------------------
  async function renderBoard(){
    var b = boardDef(ST.board);
    if(!b){ go('boards', {}); return; }
    var nationFilter = (b.realm === 'ic' && ST.nation) ? ST.nation : null;
    var threads = await fetchThreads([b.key], nationFilter);
    var counts = await postCounts(threads.map(function(t){ return t.id; }));

    var rows = threads.length
      ? threads.map(function(t){
          var replies = Math.max(0, (counts[t.id] || 1) - 1);
          return '<div class="trow" data-thread="' + t.id + '"><span class="tt">' + esc(t.title) + '</span>' + authorChip(t) +
            '<span class="lt-stats">' + replies + (replies === 1 ? ' reply' : ' replies') + ' · ' + ago(t.bumped_at) + '</span></div>';
        }).join('')
      : '<span class="lt-empty">No threads here yet — start one.</span>';

    viewEl.innerHTML =
      '<button class="backlink" id="back">‹ All boards</button>' +
      '<div class="bhead"><div class="b-ic">' + icon(b) + '</div><div class="b-meta">' +
        '<div class="b-namerow"><h2>' + esc(b.name) + '</h2>' + (b.sys ? '<span class="systag">' + esc(b.sys) + '</span>' : '') + '</div>' +
        '<div class="b-desc">' + esc(b.descr) + '</div></div>' +
        '<button class="newthread" id="newBtn">+ New Thread</button></div>' +
      (b.realm === 'ic' && ST.nation ? '<div class="filterrow"><span class="fl">Showing</span><span class="nchip on">' + esc(ntag(ST.nation)) + '</span><span class="nchip" data-clear="1">Clear</span></div>' : '') +
      '<div class="tlist">' + rows + '</div>';

    document.getElementById('back').onclick = function(){ go('boards', {}); };
    document.getElementById('newBtn').onclick = function(){ openNewThread(b.key); };
    var clr = viewEl.querySelector('[data-clear]'); if(clr) clr.onclick = function(){ ST.nation = ''; render(); };
    viewEl.querySelectorAll('.trow').forEach(function(r){ r.onclick = function(){ go('thread', { threadId:r.dataset.thread }); }; });
  }

  // ---- THREAD VIEW -------------------------------------------------------
  async function renderThread(){
    var t = await fetchThread(ST.threadId);
    if(!t){ ping('That thread is gone.'); go('boards', {}); return; }
    ST.board = t.board;
    var b = boardDef(t.board);
    var posts = await fetchPosts(t.id);

    var postsHtml = posts.map(function(p, i){
      return '<div class="post' + (i === 0 ? ' op' : '') + '"><div class="post__hd">' + authorChip(p) +
        '<span class="post__time">' + ago(p.created_at) + '</span></div><div class="post__body">' + esc(p.body) + '</div></div>';
    }).join('');

    var composer = '<div class="composer"><textarea id="replyBody" placeholder="Write a reply…"></textarea>' +
      '<div class="composer__row"><span class="composer__as">Posting as <b>' + (t.realm === 'ic' ? 'your party' : (ST.handle ? '@' + esc(ST.handle) : 'your handle')) + '</b></span>' +
      '<button class="btn" id="replyBtn">Reply</button></div></div>';
    if(t.realm === 'ooc' && !ST.handle)
      composer = '<div class="handlewarn">Set a nickname (the gear menu, top-right) to post out of character.</div>';

    viewEl.innerHTML =
      '<button class="backlink" id="back">‹ ' + esc(b ? b.name : 'Board') + '</button>' +
      '<div class="thead"><h2>' + esc(t.title) + '</h2><div class="tsub">' + esc(b ? b.name : '') + ' · started by ' + esc(t.author) + ' · ' + ago(t.created_at) + '</div></div>' +
      '<div class="posts">' + postsHtml + '</div>' + composer;

    document.getElementById('back').onclick = function(){ go('board', { board:t.board }); };
    var rb = document.getElementById('replyBtn');
    if(rb) rb.onclick = function(){ submitReply(t.id); };
  }

  async function submitReply(threadId){
    if(ST.busy) return;
    var ta = document.getElementById('replyBody'), body = (ta.value || '').trim();
    if(!body){ ping('Write a reply first.'); return; }
    ST.busy = true; document.getElementById('replyBtn').disabled = true;
    try { await postReply(threadId, body); await renderThread(); ping('Reply posted.'); }
    catch(e){ ping(esc(e.message || 'Couldn’t post your reply.')); var rb = document.getElementById('replyBtn'); if(rb) rb.disabled = false; }
    finally { ST.busy = false; }
  }

  // ---- NEW THREAD MODAL --------------------------------------------------
  var ntModal = document.getElementById('ntModal');
  function closeNt(){ ntModal.hidden = true; }
  document.getElementById('ntClose').onclick = closeNt;
  ntModal.addEventListener('click', function(e){ if(e.target === ntModal) closeNt(); });
  window.addEventListener('keydown', function(e){ if(e.key === 'Escape' && !ntModal.hidden) closeNt(); });

  function openNewThread(preBoard){
    var realm = preBoard ? boardDef(preBoard).realm : ST.realm;
    var opts = boardsIn(realm).map(function(b){ return '<option value="' + esc(b.key) + '"' + (b.key === preBoard ? ' selected' : '') + '>' + esc(b.name) + '</option>'; }).join('');
    var sel = document.getElementById('ntBoard');
    sel.innerHTML = opts;
    document.getElementById('ntTitle').value = '';
    document.getElementById('ntBody').value = '';
    syncNtAs();
    sel.onchange = syncNtAs;
    ntModal.hidden = false;
    document.getElementById('ntTitle').focus();
  }
  function syncNtAs(){
    var b = boardDef(document.getElementById('ntBoard').value);
    var as = document.getElementById('ntAs'), blocked = false;
    if(!b){ as.textContent = ''; }
    else if(b.realm === 'ic'){ as.innerHTML = 'Posting in character as <b>your party</b>.'; }
    else if(ST.handle){ as.innerHTML = 'Posting as <b>@' + esc(ST.handle) + '</b>.'; }
    else { as.innerHTML = '<span style="color:var(--amber)">Set a nickname (gear menu) to post out of character — you can’t post here without one.</span>'; blocked = true; }
    document.getElementById('ntSubmit').disabled = blocked;   // OOC posting is gated on a nickname
  }
  document.getElementById('ntSubmit').onclick = async function(){
    if(ST.busy) return;
    var board = document.getElementById('ntBoard').value;
    var title = (document.getElementById('ntTitle').value || '').trim();
    var body = (document.getElementById('ntBody').value || '').trim();
    if(!title){ ping('Give your thread a title.'); return; }
    if(!body){ ping('Write something in the post.'); return; }
    ST.busy = true; this.disabled = true;
    try {
      var id = await postThread(board, title, body);
      closeNt();
      ping('Thread posted.');
      go('thread', { threadId:id });
    } catch(e){ ping(esc(e.message || 'Couldn’t post your thread.')); }
    finally { ST.busy = false; document.getElementById('ntSubmit').disabled = false; }
  };

  // ---- ROUTER ------------------------------------------------------------
  function go(view, patch){ ST.view = view; Object.assign(ST, patch); window.scrollTo(0, 0); render(); }
  function render(){
    viewEl.innerHTML = '<p class="empty">Loading…</p>';
    var fn = ST.view === 'board' ? renderBoard : ST.view === 'thread' ? renderThread : renderBoards;
    Promise.resolve().then(fn).catch(function(e){ viewEl.innerHTML = '<p class="empty">Couldn’t load the forum right now. Refresh to try again.</p>'; });
  }

  (async () => {
    if(!isConfigured){ viewEl.innerHTML = '<p class="empty">Supabase isn’t configured.</p>'; return; }
    var user = await requireUser();
    if(!user) return;
    try {
      ST.boards = await fetchBoards();
      var nations = []; try { var r = await supabase.from('nations').select('id, name').order('name'); nations = r.data || []; } catch(e){}
      ST.nationsList = nations;
      nations.forEach(function(n){ ST.nationName[n.id] = n.name; });
      try { var p = await supabase.from('profiles').select('handle').eq('id', user.id).maybeSingle(); ST.handle = (p.data && p.data.handle) || null; } catch(e){}
      render();
    } catch(e){
      viewEl.innerHTML = '<p class="empty">Couldn’t load the forum right now. Refresh to try again.</p>';
    }
  })();
</script>
</body>
</html>
