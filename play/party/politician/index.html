<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/theme.js"></script>
<title>Politician · Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAF8;--surface:#FFFFFF;--ink:#15151B;--muted:#5b5b63;--soft:#8d8d95;
    --line:#E7E5E0;--chip:#F4F3EF;--indigo:#5546E8;--indigo-soft:#ECE9FD;
    --red:#C42B2B;--red-soft:#FBEAE9;--green:#16915a;--green-soft:#E5F4EC;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100%}
  .app{display:flex;min-height:100vh}

  /* Left navigation (desktop rail + mobile bottom bar) lives in /sidenav.js */

  /* main */
  .main{flex:1;padding:24px clamp(16px,4vw,56px) 56px;min-width:0;max-width:980px}
  /* top bar (Discord/funds/actions/date/settings gear) now lives in /topbar.js */

  .back{display:inline-flex;align-items:center;gap:7px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;margin-bottom:16px;text-decoration:none}
  .back:hover{color:var(--indigo)}
  .back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .kicker{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--indigo)}

  .mod{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px}
  .mod__hd{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin-bottom:16px}
  .empty{color:var(--soft);font-style:italic;font-size:13.5px}

  /* hero */
  .hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .hero__pic{width:62px;height:62px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;background:var(--indigo-soft);color:var(--indigo);font-family:'Space Mono',monospace}
  .hero__id{flex:1;min-width:220px}
  .hero__id .kicker{margin-bottom:4px}
  .hero__id h1{font-weight:900;font-size:clamp(26px,4.5vw,38px);letter-spacing:-.03em;line-height:1.02}
  .hero__id .role{font-family:'Space Mono',monospace;font-size:11.5px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;margin-top:6px}
  .htags{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  .tag{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:5px 11px;border-radius:20px;display:inline-flex;align-items:center;gap:6px}
  .tag.party{color:var(--indigo);background:var(--indigo-soft)}

  /* stats band */
  .sgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-top:16px}
  @media(max-width:680px){.sgrid{grid-template-columns:repeat(3,1fr)}}
  .stile{border:1px solid var(--line);border-radius:12px;padding:13px 8px 14px;text-align:center;background:var(--bg)}
  .stile .l{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
  .stile .v{font-weight:900;font-size:28px;letter-spacing:-.03em;display:block;margin:4px 0 0}
  .stile .v small{font-size:.45em;color:var(--soft);font-weight:700;letter-spacing:0}
  .stile.max{border-color:var(--indigo);background:var(--indigo-soft)}
  .stile.max .v{color:var(--indigo)}

  /* current task + actions (disabled until wired) */
  .task{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .task__v{font-weight:800;font-size:18px;letter-spacing:-.01em;color:var(--soft)}
  .task__btn{font-family:'Space Mono',monospace;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--indigo);color:#fff;border:none;border-radius:10px;padding:11px 18px;cursor:not-allowed;opacity:.5}
  .acts{display:flex;gap:12px;flex-wrap:wrap}
  .act{flex:1;min-width:200px;text-align:left;border-radius:12px;padding:15px 16px;cursor:not-allowed;border:1.5px solid;background:var(--surface);opacity:.6}
  .act__t{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px}
  .act__t svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .act__d{font-size:12.5px;margin-top:7px;line-height:1.45;color:var(--muted)}
  .act.dismiss{border-color:color-mix(in srgb,var(--red) 45%,transparent);color:var(--red)}
  .act.dismiss .act__d{color:#9a5050}
  .act.promote{border-color:var(--indigo);background:var(--indigo);color:#fff}
  .act.promote .act__d{color:rgba(255,255,255,.85)}

  /* character history */
  .chist{list-style:none;display:flex;flex-direction:column;gap:15px}
  .chist li{display:flex;gap:12px}
  .chist .dot{width:10px;height:10px;border-radius:50%;background:var(--soft);flex:none;margin-top:3px}
  .chist .t{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--indigo);font-weight:700}
  .chist .x{font-size:13.5px;color:var(--muted);margin-top:2px}
  .chist .x b{color:var(--ink);font-weight:700}

  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div id="sidenav"></div><!-- left rail / mobile bottom bar, injected by /sidenav.js -->

  <main class="main">
    <div class="topbar" id="topbar"></div>
    <a class="back" href="/play/party/"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Your Party</a>
    <div id="content"><section class="mod"><p class="empty">Loading&hellip;</p></section></div>
  </main>
</div>

<script type="module">
  import { supabase, isConfigured, requireUser, currentTick } from '/supabase.js';
  import { esc, COMPETENCIES, tickToDate } from '/util.js';
  import { mountTopbar, setTopbarActions } from '/topbar.js';
  import { mountSidenav } from '/sidenav.js';
  import { ideologyLabel } from '/archetypes.js';

  mountTopbar(); // shared top bar (Discord/funds/actions/date/gear) into #topbar
  mountSidenav();  // left rail (desktop) / bottom bar (mobile) into #sidenav; active item from the URL

  var id = new URLSearchParams(location.search).get('id') || '';

  function initials(name) { var p = String(name).trim().split(/\s+/); return ((p[0] || '')[0] + ((p[1] || '')[0] || '')).toUpperCase(); }
  function notFound() {
    document.getElementById('content').innerHTML = '<section class="mod"><div class="mod__hd">Politician</div><p class="empty">No such politician.</p></section>';
  }

  function render(pol, party, gameDate) {
    var name = pol.first_name + ' ' + pol.last_name;
    document.title = name + ' · Nationhood';

    var vals = COMPETENCIES.map(function (c) { return pol[c.key] || 0; });
    var mx = Math.max.apply(null, vals);
    var tiles = '<div class="stile"><span class="l">Age</span><span class="v">' + (pol.age || 0) + '<small> yrs</small></span></div>' +
      '<div class="stile"><span class="l">Exp</span><span class="v">' + (pol.experience || 0) + '</span></div>' +
      COMPETENCIES.map(function (c, i) {
        return '<div class="stile' + (vals[i] === mx && mx > 0 ? ' max' : '') + '"><span class="l">' + c.name + '</span><span class="v">' + vals[i] + '</span></div>';
      }).join('');

    // Character history starts almost empty: a founding/joining line + a birth line.
    var year = parseInt((String(gameDate).match(/\d{4}/) || ['1980'])[0], 10);
    var birth = year - (pol.age || 0);
    var firstLine = (pol.status === 'Party Leader')
      ? 'Founded <b>' + esc(party.name) + '</b> and became its leader.'
      : 'Joined <b>' + esc(party.name) + '</b>.';
    var history =
      '<li><span class="dot"></span><div><div class="t">' + esc(gameDate) + '</div><div class="x">' + firstLine + '</div></div></li>' +
      '<li><span class="dot"></span><div><div class="t">' + birth + '</div><div class="x">Born.</div></div></li>';

    document.getElementById('content').innerHTML =
      '<section class="mod"><div class="hero">' +
        '<span class="hero__pic">' + esc(initials(name)) + '</span>' +
        '<div class="hero__id"><div class="kicker">Prominent Politician</div><h1>' + esc(name) + '</h1>' +
          '<div class="role">' + esc(pol.status || 'Party Member') + ' &middot; ' + esc(party.name) + '</div>' +
          '<div class="htags"><span class="tag party">' + esc(ideologyLabel(party)) + '</span></div></div>' +
      '</div><div class="sgrid">' + tiles + '</div></section>' +

      '<section class="mod"><div class="mod__hd">Current Task</div>' +
        '<div class="task"><span class="task__v">None Assigned</span>' +
        '<button class="task__btn" type="button" disabled>Assign</button></div></section>' +

      '<section class="mod"><div class="mod__hd">Actions</div><div class="acts">' +
        '<button class="act dismiss" type="button" disabled><div class="act__t"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>Dismiss</div><div class="act__d">Remove them from the cabinet and the party. May recover Party Approval &mdash; or not.</div></button>' +
        '<button class="act promote" type="button" disabled><div class="act__t"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>Promote</div><div class="act__d">Elevate them to a higher office or party rank.</div></button>' +
      '</div></section>' +

      '<section class="mod"><div class="mod__hd">Political Modifiers</div><p class="empty">No political modifiers yet.</p></section>' +

      '<section class="mod"><div class="mod__hd">Character History</div><ul class="chist">' + history + '</ul></section>';
  }

  (async () => {
    if (!isConfigured) return;
    const user = await requireUser();
    if (!user) return;
    if (!id) { notFound(); return; }
    try {
      const { data: pol, error } = await supabase.from('politicians').select('*').eq('id', id).single();
      if (error || !pol) { notFound(); return; }
      // The politician's party drives both the role line and (for now, since you
      // only reach this from your own roster) the sidebar brand.
      const { data: party } = await supabase.from('parties').select('name, archetype, nation_id, funds, actions_remaining').eq('id', pol.party_id).single();
      const p = party || { name: '', archetype: '', nation_id: '' };
      const { data: nation } = await supabase.from('nations').select('name, flag, economy').eq('id', p.nation_id).single();
      const nationName = (nation && nation.name) || p.nation_id;

      document.getElementById('pname').textContent = p.name || 'Your Party';
      document.getElementById('psub').textContent = ideologyLabel(p) + ' · ' + nationName;
      if (nation && nation.flag) {
        var flag = document.getElementById('flag');
        flag.onload = function () { flag.hidden = false; };
        flag.src = nation.flag;
      }

      // Topbar funds + the live action budget (one source: the party row).
      var currency = (nation && nation.economy && nation.economy.currency) || '$';
      setTopbarActions(p.actions_remaining);

      var gameDate = tickToDate(await currentTick()); // for the bio timeline; the topbar owns its own date
      render(pol, p, gameDate);
    } catch (e) {
      document.getElementById('content').innerHTML = '<section class="mod"><div class="mod__hd">Politician</div><p class="empty">Could not load this politician. Refresh to try again.</p></section>';
    }
  })();
</script>
</body>
</html>
