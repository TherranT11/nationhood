<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/theme.js"></script>
<title>Party · Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/play.css">
<style>
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}

  /* Left navigation (desktop rail + mobile bottom bar) lives in /sidenav.js */

  .main{flex:1;padding:24px clamp(16px,4vw,56px) 56px;min-width:0}
  .phead .eye{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--indigo)}
  .phead h1{font-weight:900;font-size:clamp(24px,3.6vw,32px);letter-spacing:-.03em;margin-top:4px}

  /* Masthead — the party's letterhead: logo, name, abbreviation, leader, founded date. */
  .mast{position:relative;display:flex;align-items:center;gap:20px;margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;border-top:3px solid var(--pc,var(--indigo))}
  .mast__logo{width:76px;height:76px;border-radius:16px;flex:none;display:grid;place-items:center;overflow:hidden;background:var(--pc,var(--indigo));color:#fff;font-family:'Space Mono',monospace;font-weight:700;font-size:24px;letter-spacing:.02em}
  .mast__logo img{width:100%;height:100%;object-fit:cover}
  .mast__body{min-width:0;flex:1}
  .mast__abbr{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--pc,var(--indigo))}
  .mast__name{font-weight:900;font-size:clamp(22px,3.4vw,30px);letter-spacing:-.03em;line-height:1.1;margin:3px 0 0}
  .mast__meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:9px;font-size:13.5px;color:var(--muted)}
  .mast__meta b{color:var(--ink);font-weight:700}
  .mast__meta .k{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-right:5px}
  .mast__edit{position:absolute;top:16px;right:16px;font-family:'Space Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--indigo);background:var(--indigo-soft);border:1px solid color-mix(in srgb,var(--indigo) 30%,transparent);border-radius:9px;padding:8px 12px;cursor:pointer}
  .mast__edit:hover{filter:brightness(1.05)}
  .mast__edit:disabled{opacity:.5;cursor:not-allowed}
  @media(max-width:560px){.mast{flex-direction:column;align-items:flex-start;text-align:left;padding-top:52px}.mast__edit{top:14px;right:14px}}

  /* Standing — the party's vital signs: approval (+ trend + sparkline), seats, Influence. */
  .pstand{margin-top:16px}
  .pstand__h{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin:0 2px 10px}
  .appr{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
  .appr__k{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
  .appr__v{font-size:32px;font-weight:900;letter-spacing:-.02em;margin-top:6px;color:var(--ink)}
  .appr__trend{font-size:13px;font-weight:800;margin-left:8px;vertical-align:3px}
  .appr__trend--up{color:var(--green,#16915a)} .appr__trend--down{color:var(--red)}
  .appr__chart{width:100%;height:52px;display:block;margin-top:10px}
  .srow{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:14px;align-items:stretch}
  @media(max-width:560px){.srow{grid-template-columns:1fr}}
  .scard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
  .scard__k{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
  .scard__v{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-top:8px;color:var(--ink)}
  .scard__v small{font-weight:600;font-size:15px;color:var(--muted)}
  .scard__meta{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.03em;color:var(--soft);margin-top:8px;font-weight:600}
  .chamber{position:relative;height:6px;margin-top:10px;background:var(--line);border-radius:99px}
  .chamber__fill{position:absolute;left:0;top:0;height:6px;background:var(--muted);border-radius:99px}
  .chamber__fill--maj{background:var(--green,#16915a)}
  .chamber__maj{position:absolute;top:-3px;height:12px;width:2px;background:var(--ink);opacity:.5;border-radius:1px}

  /* Territory — the nation map, with selectable hexes and a detail panel on the right. */
  .pterr{margin-top:16px}
  .pterr__grid{display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:start}
  @media(max-width:760px){.pterr__grid{grid-template-columns:1fr}}
  .pterr__card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
  .pterr__map{position:relative;width:100%;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#bcd9e6}
  .pterr__map canvas{display:block;width:100%;height:100%;cursor:crosshair}
  .pterr__none{position:absolute;inset:0;display:grid;place-items:center;color:var(--soft);font-size:13px}
  .hexpanel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-height:130px}
  .hexpanel__hint{color:var(--soft);font-size:13px}
  .hexpanel__name{font-size:18px;font-weight:900;letter-spacing:-.01em;color:var(--ink)}
  .hexpanel__tag{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--indigo);background:var(--indigo-soft);border-radius:20px;padding:3px 9px;display:inline-block;margin-top:6px}
  .hexpanel__tag--mine{color:var(--green,#16915a);background:color-mix(in srgb,var(--green,#16915a) 14%,transparent)}
  .hexrow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .hexrow:last-child{border-bottom:none}
  .hexrow .k{color:var(--muted)} .hexrow .v{font-weight:700;text-align:right;color:var(--ink)}
  .hexres{margin-top:12px}
  .hexres__h{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-bottom:6px}
  .hexchips{display:flex;flex-wrap:wrap;gap:6px}
  .hexchip{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;background:var(--field,var(--bg));border:1px solid var(--line);border-radius:7px;padding:4px 8px}
  .hexchip .rk{color:var(--soft);font-weight:400}
  /* Regional politics block (seats + held-by + regional approval → amalgamated national) */
  .reg{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .reg__h{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-bottom:8px}
  .reg__seats{font-size:15px;color:var(--muted)} .reg__seats b{font-size:22px;font-weight:900;color:var(--ink);letter-spacing:-.01em;margin-right:4px}
  .reg__sub{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.03em;color:var(--soft)}
  .reg__held{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .regchip{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 42%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent);border-radius:7px;padding:3px 8px}
  .reg__ah{margin-top:14px;margin-bottom:2px;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
  .regrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  .regrow:last-child{border-bottom:none}
  .regdot{width:9px;height:9px;border-radius:2px;flex:none}
  .regnm{font-weight:700;color:var(--ink)}
  .regv{font-family:'Space Mono',monospace;font-weight:700;color:var(--ink);margin-left:auto}
  .regnat{font-family:'Space Mono',monospace;font-size:10px;color:var(--soft);min-width:62px;text-align:right}

  /* Edit Party modal */
  .emodal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:18px}
  .emodal[hidden]{display:none}
  .emodal__panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
  .emodal__hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  .emodal__hd b{font-size:17px;font-weight:900;letter-spacing:-.01em}
  .emodal__x{background:none;border:none;color:var(--soft);font-size:22px;line-height:1;cursor:pointer;padding:0 4px}
  .elbl{display:block;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:700;margin:14px 0 6px}
  .einput{width:100%;background:var(--field,var(--bg));border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font-family:'Archivo',system-ui,sans-serif;font-size:15px}
  .einput.abbr{text-transform:uppercase;letter-spacing:.16em;font-family:'Space Mono',monospace;font-weight:700;max-width:150px}
  .ecolorrow{display:flex;align-items:center;gap:12px}
  .ecolor{width:52px;height:38px;padding:0;border:1px solid var(--line);border-radius:10px;background:none;cursor:pointer}
  .ecolor::-webkit-color-swatch-wrapper{padding:3px}
  .ecolor::-webkit-color-swatch{border:none;border-radius:7px}
  .ecolorhex{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
  .elogorow{display:flex;align-items:center;gap:14px}
  .elogoprev{width:56px;height:56px;border-radius:12px;flex:none;display:grid;place-items:center;overflow:hidden;background:var(--pc,var(--indigo));color:#fff;font-family:'Space Mono',monospace;font-weight:700;font-size:16px}
  .elogoprev img{width:100%;height:100%;object-fit:cover}
  .ecost{margin-top:18px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}
  .eerr{color:var(--red);font-size:13px;margin-top:10px;min-height:1px}
  .esave{margin-top:12px;width:100%;background:var(--ink);color:var(--bg);border:none;border-radius:10px;padding:12px;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.05em;cursor:pointer}
  .esave:hover{filter:brightness(1.12)} .esave:disabled{opacity:.55;cursor:not-allowed}
</style>
</head>
<body>
<div class="app">
  <div id="sidenav"></div><!-- left rail / mobile bottom bar, injected by /sidenav.js -->

  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="phead">
      <span class="eye">Your Party</span>
      <h1>Party</h1>
    </div>

    <!-- Masthead — the party letterhead, filled by renderMasthead(). -->
    <div class="mast" id="mast" hidden>
      <div class="mast__logo" id="mastLogo"></div>
      <div class="mast__body">
        <div class="mast__abbr" id="mastAbbr"></div>
        <div class="mast__name" id="mastName"></div>
        <div class="mast__meta">
          <span><span class="k">Leader</span><b id="mastLeader">—</b></span>
          <span><span class="k">Founded</span><b id="mastFounded">—</b></span>
        </div>
      </div>
      <button class="mast__edit" id="editBtn" type="button" hidden>Edit Party · 5 Influence</button>
    </div>

    <!-- Standing — vital signs, filled by renderStanding(). Approval + Seats share one row;
         Influence isn't repeated here (it's in the top bar). -->
    <section class="pstand" id="standing" hidden>
      <div class="pstand__h">Standing</div>
      <div class="srow">
        <div class="appr">
          <div class="appr__k">Party Approval</div>
          <div class="appr__v"><span id="apprVal">—</span><span class="appr__trend" id="apprTrend" hidden></span></div>
          <svg class="appr__chart" id="apprSpark" viewBox="0 0 300 52" preserveAspectRatio="none" aria-hidden="true">
            <line x1="0" y1="26" x2="300" y2="26" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 5" vector-effect="non-scaling-stroke"/>
          </svg>
        </div>
        <div class="scard">
          <div class="scard__k">Seats</div>
          <div class="scard__v" id="seatVal">—</div>
          <div class="chamber" id="chamber" hidden><span class="chamber__fill" id="chamberFill"></span><i class="chamber__maj" id="chamberMaj"></i></div>
          <div class="scard__meta" id="seatMeta"></div>
        </div>
      </div>
    </section>

    <!-- Territory — the nation map with selectable hexes + a detail panel, filled by loadTerritory(). -->
    <section class="pterr" id="territory" hidden>
      <div class="pstand__h">Territory</div>
      <div class="pterr__grid">
        <div class="pterr__card">
          <div class="pterr__map" id="mapBox"><canvas id="natMap"></canvas><span class="pterr__none" id="mapNone">Loading map&hellip;</span></div>
        </div>
        <div class="hexpanel" id="hexPanel"><div class="hexpanel__hint">Select one of your hexes to see its details.</div></div>
      </div>
    </section>
  </main>
</div>

<!-- Edit Party modal -->
<div class="emodal" id="editModal" hidden>
  <div class="emodal__panel">
    <div class="emodal__hd"><b>Edit Party</b><button class="emodal__x" id="editClose" type="button" aria-label="Close">&times;</button></div>
    <label class="elbl" for="eName">Party name</label>
    <input class="einput" id="eName" type="text" maxlength="48" autocomplete="off">
    <label class="elbl" for="eAbbr">Abbreviation (2–4 letters)</label>
    <input class="einput abbr" id="eAbbr" type="text" maxlength="4" autocomplete="off" spellcheck="false">
    <label class="elbl" for="eColor">Colour</label>
    <div class="ecolorrow"><input class="ecolor" id="eColor" type="color"><span class="ecolorhex" id="eColorHex"></span></div>
    <label class="elbl">Logo</label>
    <div class="elogorow">
      <div class="elogoprev" id="eLogoPrev"></div>
      <input type="file" id="eLogo" accept="image/png,image/jpeg,image/webp,image/gif">
    </div>
    <div class="ecost">Costs <b>5 Influence</b></div>
    <div class="eerr" id="eErr"></div>
    <button class="esave" id="eSave" type="button">Save · 5 Influence</button>
  </div>
</div>

<script type="module">
  import { supabase, isConfigured, requireUser, currentTick, selectAll } from '/supabase.js';
  import { esc, majority, fmtPop, tickToDate } from '/util.js';
  import { ideologyLabel, partyColor } from '/archetypes.js';
  import { nationColors, drawNationMiniMap } from '/hexmap.js';
  import { mountTopbar, setTopbarActions } from '/topbar.js';
  import { mountSidenav } from '/sidenav.js';

  mountTopbar();   // shared top bar (Discord/Influence/date/gear) into #topbar
  mountSidenav();  // left rail (desktop) / bottom bar (mobile) into #sidenav

  var PARTY = null, PCOLOR = 'var(--indigo)', BUSY = false;

  function initials(s) { return String(s || '?').trim().slice(0, 3).toUpperCase(); }
  function logoInner(logoUrl, fallback) {
    return logoUrl ? '<img src="' + esc(logoUrl) + '" alt="">' : esc(initials(fallback));
  }

  function renderMasthead(party, leaderName, leaderAge, foundedText) {
    PCOLOR = partyColor(party) || 'var(--indigo)';
    var mast = document.getElementById('mast');
    mast.style.setProperty('--pc', PCOLOR);
    document.getElementById('mastLogo').innerHTML = logoInner(party.logo_url, party.abbreviation || party.name);
    document.getElementById('mastAbbr').textContent = party.abbreviation || '';
    document.getElementById('mastName').textContent = party.name || 'Your Party';
    document.getElementById('mastLeader').textContent = leaderName ? (leaderName + (leaderAge != null ? ' (' + leaderAge + ')' : '')) : '—';
    // Founded — the IN-GAME month/year (not the real-world date). See foundedInGame().
    document.getElementById('mastFounded').textContent = foundedText || '—';
    mast.hidden = false;
    document.title = party.name + ' · Nationhood';
  }

  // Standing — approval (+ momentum + sparkline) and seats-in-chamber, side by side.
  function renderStanding(party, nation, series, prevPop) {
    var raw = Number(party.popularity) || 0, appr = Math.min(100, raw);   // may be negative; only the top is clamped
    document.getElementById('apprVal').textContent = (Math.round(appr * 10) / 10) + '%';
    if (prevPop != null) {
      var d = Math.round((raw - Number(prevPop)) * 10) / 10;   // truthful delta vs the previous tick's close
      var tEl = document.getElementById('apprTrend');
      if (d > 0) { tEl.className = 'appr__trend appr__trend--up'; tEl.textContent = '▲ ' + d.toFixed(1); tEl.hidden = false; }
      else if (d < 0) { tEl.className = 'appr__trend appr__trend--down'; tEl.textContent = '▼ ' + Math.abs(d).toFixed(1); tEl.hidden = false; }
    }
    drawSparkline(series);

    // Seats in context: your seats out of the whole chamber, the majority line, and govern/oppose.
    var mySeats = party.seats || 0, total = Number(nation.legislature_seats) || 0;
    if (total > 0) {
      var maj = majority(total);
      document.getElementById('seatVal').innerHTML = mySeats + ' <small>/ ' + total + '</small>';
      var fill = document.getElementById('chamberFill');
      fill.style.width = Math.min(100, mySeats / total * 100).toFixed(1) + '%';
      if (mySeats >= maj) fill.classList.add('chamber__fill--maj');
      document.getElementById('chamberMaj').style.left = Math.min(100, maj / total * 100).toFixed(1) + '%';
      document.getElementById('chamber').hidden = false;
      document.getElementById('seatMeta').textContent = (party.in_government ? 'In government' : 'Opposition') + ' · majority ' + maj;
    } else {
      document.getElementById('seatVal').textContent = String(mySeats);
      document.getElementById('seatMeta').textContent = 'No legislature yet';
    }

    document.getElementById('standing').hidden = false;
  }

  // Draw the approval trajectory into the hero SVG (oldest → newest). Under 2 points, keep the dashed
  // placeholder (same pattern as the Budget / Growth sparklines).
  function drawSparkline(s) {
    var svg = document.getElementById('apprSpark');
    if (!svg || !s || s.length < 2) return;
    var W = 300, H = 52, pad = 6, n = s.length;
    var min = Math.min.apply(null, s), max = Math.max.apply(null, s), span = (max - min) || 1;
    var pts = s.map(function (v, i) { return [(i / (n - 1)) * W, H - pad - ((v - min) / span) * (H - 2 * pad)]; });
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
    var area = 'M' + pts[0][0].toFixed(1) + ' ' + H + ' ' + line.replace(/^M/, 'L') + ' L' + pts[n - 1][0].toFixed(1) + ' ' + H + ' Z';
    svg.innerHTML =
      '<path d="' + area + '" fill="var(--indigo-soft, rgba(107,92,255,.14))" stroke="none"/>' +
      '<path d="' + line + '" fill="none" stroke="var(--indigo, #6b5cff)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="' + pts[n - 1][0].toFixed(1) + '" cy="' + pts[n - 1][1].toFixed(1) + '" r="2.6" fill="var(--indigo, #6b5cff)"/>';
  }

  // ---- Territory: the nation map with clickable hexes + a detail panel ----
  var MAP = { cv: null, box: null, none: null, opts: null, hitAt: null, cities: [], natName: {}, mine: null,
              parties: [], totalSeats: 0, heldSeats: 0, myHexes: [], natPop: 0, amalg: {}, bias: {} };
  var HEX_RES = ['energy', 'food', 'minerals', 'goods', 'services', 'military', 'diplomacy'];
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

  // Deterministic pseudo-random in [0,1) from a string — so each region's numbers are STABLE across
  // reloads (seeded by hex + party), not re-rolled every open. (xmur3-style hash.)
  function rand01(str) {
    var h = 1779033703 ^ str.length;
    for (var i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    h = Math.imul(h ^ (h >>> 16), 2246822507); h ^= h >>> 13; h = Math.imul(h, 3266489909); h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  // A per-region swing of ±(1..5) points on a party's national approval — pure random (no archetype),
  // symmetric so the population-weighted amalgamation reconciles to the national figure.
  function regionalLean(q, r, pid) { var k = q + ',' + r + ':' + pid; return (rand01(k + ':s') < 0.5 ? -1 : 1) * (1 + rand01(k) * 4); }
  // Stored per-region tilt from policy popularity awards (schema/163) — population-weighted and
  // zero-sum, so it moves individual hexes without shifting the national amalgamation.
  function regionalBias(q, r, pid) { var b = MAP.bias[pid]; return (b && b[q + ',' + r]) || 0; }
  function regionalApproval(party, hex) { return Math.max(0, Math.min(100, (Number(party.popularity) || 0) + regionalLean(hex.q, hex.r, party.id) + regionalBias(hex.q, hex.r, party.id))); }

  function paintMap() {
    var res = drawNationMiniMap(MAP.cv, MAP.box, MAP.opts);   // truthy object (with hexAt) when land is painted
    MAP.none.style.display = res ? 'none' : ''; MAP.cv.style.display = res ? 'block' : 'none';
    MAP.hitAt = res ? res.hexAt : null;
    if (!res) MAP.none.textContent = 'No territory to map.';
  }

  function renderHexPanel(hex) {
    var el = document.getElementById('hexPanel');
    if (!hex) { el.innerHTML = '<div class="hexpanel__hint">Select one of your hexes to see its details.</div>'; return; }
    var mine = hex.nation_id && MAP.mine && hex.nation_id === MAP.mine;
    var tag = mine ? '<span class="hexpanel__tag hexpanel__tag--mine">Your territory</span>'
      : hex.nation_id ? '<span class="hexpanel__tag">' + esc(MAP.natName[hex.nation_id] || hex.nation_id) + '</span>'
      : '<span class="hexpanel__tag">Unclaimed</span>';
    var city = MAP.cities.filter(function (c) { return c.q === hex.q && c.r === hex.r; })[0];
    function row(k, v) { return v ? '<div class="hexrow"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>' : ''; }
    var resv = hex.resources || {};
    var chips = HEX_RES.filter(function (k) { return Number(resv[k]) > 0; })
      .map(function (k) { return '<span class="hexchip"><b>' + Math.round(Number(resv[k])) + '</b> <span class="rk">' + cap(k) + '</span></span>'; }).join('');
    el.innerHTML =
      '<div class="hexpanel__name">' + esc(hex.name || ('Hex ' + hex.q + ', ' + hex.r)) + '</div>' + tag +
      '<div style="margin-top:12px">' +
        row('Coordinates', hex.q + ', ' + hex.r) +
        row('Terrain', cap(hex.terrain || '')) +
        row('Continent', hex.continent ? esc(hex.continent) : '') +
        row('Population', hex.population != null ? fmtPop(hex.population) : '') +
        (city ? row('City', esc(city.name)) : '') +
      '</div>' +
      '<div class="hexres"><div class="hexres__h">Resources</div><div class="hexchips">' + (chips || '<span class="hexpanel__hint">None</span>') + '</div></div>' +
      (mine ? regionalPolitics(hex) : '');
  }

  // Regional politics for one of your hexes: seats (by population), who holds them (apportioned by
  // chamber share), and each party's regional approval (national ± a seeded per-region swing) beside
  // the amalgamated national figure those regions weight to.
  function regionalPolitics(hex) {
    if (!MAP.parties.length) return '';
    var pop = Number(hex.population) || 0;
    var seatsHere = (MAP.totalSeats > 0 && MAP.natPop > 0) ? Math.round(MAP.totalSeats * pop / MAP.natPop) : 0;
    var held = MAP.heldSeats > 0 ? MAP.parties.map(function (p) { return { p: p, n: Math.round(seatsHere * (Number(p.seats) || 0) / MAP.heldSeats) }; }).filter(function (x) { return x.n > 0; }) : [];
    var heldChips = held.length
      ? held.map(function (x) { return '<span class="regchip" style="--c:' + (partyColor(x.p) || '#8d8d95') + '">' + esc(x.p.abbreviation || x.p.name.slice(0, 3)) + ' ×' + x.n + '</span>'; }).join('')
      : '<span class="hexpanel__hint">Not enough population for a seat.</span>';
    var rows = MAP.parties.filter(function (p) { return (Number(p.seats) || 0) > 0 || (Number(p.popularity) || 0) > 0; })
      .map(function (p) { return { p: p, reg: regionalApproval(p, hex), nat: MAP.amalg[p.id] || 0 }; })
      .sort(function (a, b) { return b.reg - a.reg; });
    var apprRows = rows.length ? rows.map(function (x) {
      return '<div class="regrow"><span class="regdot" style="background:' + (partyColor(x.p) || '#8d8d95') + '"></span>' +
        '<span class="regnm">' + esc(x.p.abbreviation || x.p.name) + '</span>' +
        '<span class="regv">' + (Math.round(x.reg * 10) / 10) + '%</span>' +
        '<span class="regnat">nat’l ' + (Math.round(x.nat * 10) / 10) + '%</span></div>';
    }).join('') : '<span class="hexpanel__hint">No parties with measurable support.</span>';
    return '<div class="reg"><div class="reg__h">Regional politics</div>' +
      '<div class="reg__seats"><b>' + seatsHere + '</b>seat' + (seatsHere === 1 ? '' : 's') + ' <span class="reg__sub">of ' + MAP.totalSeats + ', by population</span></div>' +
      '<div class="reg__held">' + heldChips + '</div>' +
      '<div class="reg__ah">Regional approval <span class="reg__sub">here → national</span></div>' + apprRows +
    '</div>';
  }

  async function loadTerritory(party, nation) {
    MAP.cv = document.getElementById('natMap'); MAP.box = document.getElementById('mapBox'); MAP.none = document.getElementById('mapNone');
    MAP.mine = party.nation_id;
    MAP.totalSeats = Number(nation && nation.legislature_seats) || 0;
    var nations = [];
    try {
      var nr = await supabase.from('nations').select('id, name, color').order('name');
      if (nr.error) nr = await supabase.from('nations').select('id, name').order('name');   // color not migrated
      nations = nr.data || [];
    } catch (e) {}
    nations.forEach(function (n) { MAP.natName[n.id] = n.name; });
    var hexes = [];
    try {
      var hr = await selectAll('world_hexes', 'q, r, terrain, nation_id, continent, name, population, resources');   // paginated: past the 1000-row cap
      if (hr.error) hr = await selectAll('world_hexes', 'q, r, terrain, nation_id, continent');   // detail cols not migrated
      hexes = hr.data || [];
    } catch (e) {}
    try { var cr = await supabase.from('cities').select('name, q, r').eq('nation_id', party.nation_id).not('q', 'is', null); MAP.cities = cr.error ? [] : (cr.data || []); } catch (e) { MAP.cities = []; }
    // Your nation's parties (regional seat breakdown + approval) and land hexes (seat apportionment
    // + amalgamation denominator).
    try {
      var pr = await supabase.from('parties').select('id, name, abbreviation, color, seats, popularity').eq('nation_id', party.nation_id);
      if (pr.error) pr = await supabase.from('parties').select('id, name, abbreviation, seats, popularity').eq('nation_id', party.nation_id);
      MAP.parties = pr.data || [];
    } catch (e) { MAP.parties = []; }
    MAP.heldSeats = MAP.parties.reduce(function (a, p) { return a + (Number(p.seats) || 0); }, 0);
    // Per-region popularity tilt from policy awards (schema/163) → MAP.bias[pid]['q,r'] = points.
    // Missing table (not migrated) or no rows just leaves every bias at 0 (region = national ± swing).
    MAP.bias = {};
    try {
      var ids = MAP.parties.map(function (p) { return p.id; });
      if (ids.length) {
        var br = await supabase.from('party_hex_bias').select('party_id, q, r, bias').in('party_id', ids);
        (br.error ? [] : (br.data || [])).forEach(function (row) {
          (MAP.bias[row.party_id] || (MAP.bias[row.party_id] = {}))[row.q + ',' + row.r] = Number(row.bias) || 0;
        });
      }
    } catch (e) { MAP.bias = {}; }
    MAP.myHexes = hexes.filter(function (h) { return h.terrain === 'land' && h.nation_id === party.nation_id; });
    MAP.natPop = MAP.myHexes.reduce(function (a, h) { return a + (Number(h.population) || 0); }, 0);
    // Amalgamated national approval per party = population-weighted average of its regional approvals.
    MAP.amalg = {};
    MAP.parties.forEach(function (p) {
      if (MAP.natPop > 0) { var s = 0; MAP.myHexes.forEach(function (h) { s += regionalApproval(p, h) * (Number(h.population) || 0); }); MAP.amalg[p.id] = s / MAP.natPop; }
      else MAP.amalg[p.id] = Number(p.popularity) || 0;
    });
    MAP.opts = { hexes: hexes, natColor: nationColors(nations), viewedId: party.nation_id, mode: 'nation', cities: MAP.cities, selected: null };
    document.getElementById('territory').hidden = false;
    paintMap();
    MAP.cv.onclick = function (e) {
      if (!MAP.hitAt) return;
      var rect = MAP.cv.getBoundingClientRect();
      var hex = MAP.hitAt(e.clientX - rect.left, e.clientY - rect.top);
      if (hex && hex.nation_id !== MAP.mine) hex = null;   // strict "our territory": only your own hexes are selectable
      MAP.opts.selected = hex ? { q: hex.q, r: hex.r } : null;   // ring the picked hex (or clear on a neighbour/sea)
      paintMap();
      renderHexPanel(hex);
    };
    window.addEventListener('resize', paintMap);   // the canvas refits its box
  }

  // ---- Edit Party modal ----
  var modal = document.getElementById('editModal'), errEl = document.getElementById('eErr');
  function openEdit() {
    document.getElementById('eName').value = PARTY.name || '';
    document.getElementById('eAbbr').value = PARTY.abbreviation || '';
    // Prefill the colour with the party's current effective colour (own colour, or archetype fallback).
    var c = partyColor(PARTY) || '#5546e8';
    if (!/^#[0-9a-fA-F]{6}$/.test(c)) c = '#5546e8';
    var ci = document.getElementById('eColor'); ci.value = c.toLowerCase();
    document.getElementById('eColorHex').textContent = c.toLowerCase();
    document.getElementById('eLogo').value = '';
    NEW_LOGO_FILE = null;
    document.getElementById('eLogoPrev').style.setProperty('--pc', PCOLOR);
    document.getElementById('eLogoPrev').innerHTML = logoInner(PARTY.logo_url, PARTY.abbreviation || PARTY.name);
    errEl.textContent = '';
    modal.hidden = false;
  }
  document.getElementById('eColor').addEventListener('input', function (e) {
    document.getElementById('eColorHex').textContent = e.target.value.toLowerCase();
    document.getElementById('eLogoPrev').style.setProperty('--pc', e.target.value);   // preview the new colour on the logo swatch
  });
  function closeEdit() { if (!BUSY) modal.hidden = true; }

  var NEW_LOGO_FILE = null;
  document.getElementById('eAbbr').addEventListener('input', function (e) { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4); });
  document.getElementById('eLogo').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) { NEW_LOGO_FILE = null; return; }
    if (f.size > 2 * 1024 * 1024) { errEl.textContent = 'That image is over 2 MB — pick a smaller one.'; e.target.value = ''; NEW_LOGO_FILE = null; return; }
    NEW_LOGO_FILE = f; errEl.textContent = '';
    var r = new FileReader();
    r.onload = function () { document.getElementById('eLogoPrev').innerHTML = '<img src="' + r.result + '" alt="">'; };
    r.readAsDataURL(f);
  });

  // Upload a picked logo to the party-logos bucket (path must start with the user's id per RLS).
  async function uploadLogo(file) {
    var u = (await supabase.auth.getUser()).data.user;
    if (!u) throw new Error('Not signed in.');
    var ext = ((file.name || '').split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g, '') || 'png';
    var path = u.id + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + ext;
    var up = await supabase.storage.from('party-logos').upload(path, file, { cacheControl: '3600', upsert: false });
    if (up.error) throw new Error(up.error.message);
    return supabase.storage.from('party-logos').getPublicUrl(path).data.publicUrl;
  }

  async function saveEdit() {
    if (BUSY) return;
    var name = document.getElementById('eName').value.trim();
    var abbr = document.getElementById('eAbbr').value.trim().toUpperCase();
    var color = document.getElementById('eColor').value;
    if (!name) { errEl.textContent = 'Enter a party name.'; return; }
    if (!/^[A-Z]{2,4}$/.test(abbr)) { errEl.textContent = 'The abbreviation must be 2–4 letters.'; return; }
    BUSY = true; errEl.textContent = '';
    var btn = document.getElementById('eSave'); btn.disabled = true; btn.textContent = 'Saving…';
    try {
      var logoUrl = PARTY.logo_url || '';   // keep the existing logo unless a new one was picked
      if (NEW_LOGO_FILE) logoUrl = await uploadLogo(NEW_LOGO_FILE);
      const { data, error } = await supabase.rpc('edit_party', { p_name: name, p_abbr: abbr, p_logo_url: logoUrl, p_color: color });
      if (error) throw error;
      window.location.reload();   // refresh the masthead, sidenav brand and topbar Influence together
    } catch (e) {
      BUSY = false; btn.disabled = false; btn.textContent = 'Save · 5 Influence';
      errEl.textContent = (e && e.message) || 'Could not save your party.';
    }
  }

  document.getElementById('editClose').onclick = closeEdit;
  modal.addEventListener('click', function (e) { if (e.target === modal) closeEdit(); });
  document.getElementById('eSave').onclick = saveEdit;

  (async () => {
    if (!isConfigured) return;
    const user = await requireUser();
    if (!user) return; // redirected to login
    try {
      const { data: party, error } = await supabase.from('parties')
        .select('id, name, abbreviation, archetype, color, logo_url, influence, popularity, seats, in_government, created_at, nation_id')
        .eq('user_id', user.id).single();
      if (error || !party) { window.location.replace('/nation-select/'); return; }
      PARTY = party;
      const { data: nation } = await supabase.from('nations').select('name, flag, legislature_seats').eq('id', party.nation_id).single();

      // Fill the shared sidenav brand + the topbar Influence.
      document.getElementById('pname').textContent = party.name;
      document.getElementById('psub').textContent = ideologyLabel(party) + ' · ' + ((nation && nation.name) || party.nation_id);
      if (nation && nation.flag) { var f = document.getElementById('flag'); f.onload = function () { f.hidden = false; }; f.src = nation.flag; }
      setTopbarActions(party.influence);

      // The Party Leader (the seeded politician), for the masthead's "Led by" line.
      var leaderName = '', leaderAge = null;
      try {
        const { data: leader } = await supabase.from('politicians').select('first_name, last_name, age')
          .eq('party_id', party.id).eq('status', 'Party Leader').order('created_at').limit(1).maybeSingle();
        if (leader) { leaderName = ((leader.first_name || '') + ' ' + (leader.last_name || '')).trim(); leaderAge = leader.age; }
      } catch (e) { /* leader line falls back to — */ }

      // Founded date as the IN-GAME month/year. There's no stored founding tick, so derive it from
      // created_at against the game clock (one tick = 8h = one in-game month; tick 1 = Jan 1980):
      // foundedTick ≈ current tick − months elapsed since creation. tickToDate → "Month, Year".
      var foundedText = '—';
      try {
        var curTick = await currentTick();
        if (party.created_at) {
          var elapsed = Math.round((Date.now() - new Date(party.created_at).getTime()) / (8 * 3600 * 1000));
          foundedText = tickToDate(Math.max(1, Math.min(curTick, curTick - elapsed)));
        }
      } catch (e) { /* leave — */ }

      renderMasthead(party, leaderName, leaderAge, foundedText);
      var eb = document.getElementById('editBtn'); eb.hidden = false; eb.onclick = openEdit;

      // Standing — approval history (schema/147, world-readable) feeds the sparkline + the ▲/▼ delta.
      var series = [], prevPop = null;
      try {
        const { data: pph } = await supabase.from('party_popularity_history')
          .select('tick, popularity').eq('party_id', party.id).order('tick', { ascending: true });
        series = (pph || []).map(function (r) { return Number(r.popularity); }).filter(isFinite);
        if (series.length >= 2) prevPop = series[series.length - 2];   // previous tick's close = the trend baseline
      } catch (e) { /* no history yet → flat approval, no sparkline */ }
      renderStanding(party, nation || {}, series, prevPop);
      loadTerritory(party, nation).catch(function () { /* map is a non-critical add-on */ });
    } catch (e) { /* chrome still renders */ }
  })();
</script>
