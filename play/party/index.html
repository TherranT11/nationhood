<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Party · Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAF8;--surface:#FFFFFF;--ink:#15151B;--muted:#5b5b63;--soft:#8d8d95;
    --line:#E7E5E0;--chip:#F4F3EF;--indigo:#5546E8;--indigo-soft:#ECE9FD;
    --red:#C42B2B;--green:#16915a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100%}
  .app{display:flex;min-height:100vh}

  /* sidebar (same pattern as the rest of the instance, driven by the party) */
  .side{width:236px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
  .brand__flag{width:42px;height:26px;object-fit:cover;border:1px solid var(--line);border-radius:4px;flex:none}
  .brand__txt{display:flex;flex-direction:column;line-height:1.25;overflow:hidden}
  .brand__txt b{font-weight:800;font-size:14px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand__txt span{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav__i{display:flex;align-items:center;gap:13px;padding:10px 12px;border-radius:9px;color:var(--muted);text-decoration:none;cursor:pointer;border:1px solid transparent;transition:background .15s,color .15s}
  .nav__i svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .nav__i .label{font-family:'Space Mono',monospace;font-size:12.5px;letter-spacing:.04em}
  .nav__i:hover{color:var(--ink);background:var(--chip)}
  .nav__i.active{color:var(--indigo);background:var(--indigo-soft);font-weight:700}
  .nav__i.active svg{color:var(--indigo)}
  .side__foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}
  .me{display:flex;align-items:center;gap:10px;padding:8px 10px;color:var(--muted);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em}
  .me__dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none}
  .me b{color:var(--ink);font-weight:700}
  .logout{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;background:none;border:none;cursor:pointer;color:var(--soft);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em;text-align:left;transition:color .15s}
  .logout:hover{color:var(--red)}
  .logout svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  .main{flex:1;padding:24px clamp(16px,4vw,56px) 48px;min-width:0}

  /* instance top bar (same as Home) */
  .topbar{display:flex;align-items:center;justify-content:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:26px}
  .tb-actions{font-family:'Space Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--indigo);background:var(--indigo-soft);border:1px solid color-mix(in srgb,var(--indigo) 30%,transparent);border-radius:20px;padding:9px 15px;white-space:nowrap}
  .tb-date{display:flex;flex-direction:column;align-items:flex-end;line-height:1.12}
  .tb-date__l{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
  .tb-date__v{font-family:'Archivo',sans-serif;font-size:16px;font-weight:800;color:var(--ink);letter-spacing:.01em;white-space:nowrap}
  .tb-next{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid var(--line);background:var(--chip);border-radius:11px;padding:8px 15px;white-space:nowrap}
  .tb-next__l{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
  .tb-next__v{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--soft)}
  .kicker{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--indigo);margin-bottom:14px}

  /* party header card */
  .phead{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
  .phead__id{display:flex;align-items:center;gap:18px;flex:1;min-width:260px}
  .plogo{width:72px;height:72px;flex:none;border-radius:12px;background:var(--chip);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-weight:700;font-size:19px;letter-spacing:.04em;color:var(--soft)}
  .phead__txt{min-width:0}
  .pname-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .pname-row h1{font-weight:900;font-size:clamp(24px,3.2vw,34px);letter-spacing:-.02em;line-height:1.05}
  .pabbr{font-family:'Space Mono',monospace;font-size:15px;font-weight:700;color:var(--soft)}
  .pbadges{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:11px}
  .pbadge{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 11px;border-radius:20px;background:var(--indigo-soft);color:var(--indigo)}
  .pbadge--status{display:inline-flex;align-items:center;gap:7px;background:var(--chip);color:var(--muted)}
  .pbadge--status .dot{width:7px;height:7px;border-radius:50%;background:var(--soft)}
  .pbadge--gov{color:var(--green)}
  .pbadge--gov .dot{background:var(--green)}
  .pstats{display:flex;gap:10px;flex-wrap:wrap}
  .pstat{min-width:108px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 16px}
  .pstat__k{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-bottom:7px}
  .pstat__v{font-weight:800;font-size:24px;letter-spacing:-.02em;white-space:nowrap}
  .pstat__v small{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:var(--soft);letter-spacing:0}

  @media(max-width:820px){.side{width:62px;padding:16px 8px}.nav__i .label,.brand__txt,.me .label,.logout .label{display:none}.logout{justify-content:center}.brand{justify-content:center;padding:6px 0 14px}.brand__flag{width:38px;height:24px}.nav__i{justify-content:center;padding:11px 0}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <img class="brand__flag" id="flag" alt="Nation flag" hidden>
      <div class="brand__txt"><b id="sname">…</b><span id="psub"></span></div>
    </div>
    <nav class="nav">
      <a class="nav__i" href="/play/"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v9h14v-9"/></svg><span class="label">Home</span></a>
      <a class="nav__i active" href="/play/party/"><svg viewBox="0 0 24 24"><path d="M5 3v18"/><path d="M5 4h12l-2 4 2 4H5"/></svg><span class="label">Party</span></a>
      <a class="nav__i"><svg viewBox="0 0 24 24"><path d="M3 9l9-5 9 5"/><path d="M3 9h18M4 20h16"/><path d="M6 20v-9M10 20v-9M14 20v-9M18 20v-9"/></svg><span class="label">Government</span></a>
      <a class="nav__i"><svg viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M5 21V10M9 21V10M15 21V10M19 21V10"/><path d="M12 3l9 5H3z"/></svg><span class="label">Legislature</span></a>
      <a class="nav__i"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4-3 7-7 8-4-1-7-4-7-8V6l7-3z"/></svg><span class="label">Nation</span></a>
      <a class="nav__i"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span class="label">World</span></a>
      <a class="nav__i"><svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M6 20v-6M10 20v-10M14 20v-7M18 20v-12"/></svg><span class="label">Market</span></a>
      <a class="nav__i"><svg viewBox="0 0 24 24"><path d="M17 4l3 3-9 9-3-3z"/><path d="M7 4L4 7l9 9 3-3"/><path d="M5 16l-1 4 4-1M19 16l1 4-4-1"/></svg><span class="label">Conflict</span></a>
      <a class="nav__i"><svg viewBox="0 0 24 24"><path d="M4 5h12v8H8l-4 3z"/><path d="M18 9h2v9l-3-2h-5"/></svg><span class="label">Forum</span></a>
      <a class="nav__i"><svg viewBox="0 0 24 24"><path d="M12 5v15"/><path d="M4 4h6a2 2 0 012 2 2 2 0 012-2h6v13h-6a2 2 0 00-2 2 2 2 0 00-2-2H4z"/></svg><span class="label">Wiki</span></a>
    </nav>
    <div class="side__foot">
      <div class="me"><span class="me__dot"></span><span class="label">Leader · <b>You</b></span></div>
      <button class="logout" id="logout" type="button"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span class="label">Logout</span></button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <span class="tb-actions">Party Actions: 3 Available</span>
      <span class="tb-date"><span class="tb-date__l">Date</span><span class="tb-date__v">January, 1980</span></span>
      <span class="tb-next"><span class="tb-next__l">Next Month</span><span class="tb-next__v">Not Running</span></span>
    </div>

    <div class="kicker">Your Party</div>
    <section class="phead">
      <div class="phead__id">
        <div class="plogo" id="plogo">&mdash;</div>
        <div class="phead__txt">
          <div class="pname-row"><h1 id="pname">&hellip;</h1><span class="pabbr" id="pabbr"></span></div>
          <div class="pbadges">
            <span class="pbadge" id="archBadge">&mdash;</span>
            <span class="pbadge pbadge--status" id="statusBadge"><span class="dot"></span><span id="statusText">Opposition</span></span>
          </div>
        </div>
      </div>
      <div class="pstats">
        <div class="pstat"><div class="pstat__k">Seats</div><div class="pstat__v"><span id="st-seats">0</span> <small id="st-seatsTotal">/ 0</small></div></div>
        <div class="pstat"><div class="pstat__k">Popularity</div><div class="pstat__v"><span id="st-pop">0</span>%</div></div>
        <div class="pstat"><div class="pstat__k">Party Funds</div><div class="pstat__v" id="st-funds">0</div></div>
      </div>
    </section>
  </main>
</div>

<script type="module">
  import { supabase, isConfigured, requireUser, logout } from '/supabase.js';

  document.getElementById('logout').addEventListener('click', logout);
  // Stub nav items (screens not built) just toggle highlight; Home/Party are links.
  document.querySelectorAll('.nav__i:not([href])').forEach(function (i) {
    i.addEventListener('click', function () { document.querySelectorAll('.nav__i').forEach(function (x) { x.classList.remove('active'); }); i.classList.add('active'); });
  });

  // Party Funds: compact currency formatting (0 → "0", 375000 → "375K").
  function fmtFunds(n) {
    n = Number(n) || 0; var a = Math.abs(n);
    if (a >= 1e9) return trim(n / 1e9) + 'B';
    if (a >= 1e6) return trim(n / 1e6) + 'M';
    if (a >= 1e3) return trim(n / 1e3) + 'K';
    return String(Math.round(n));
  }
  function trim(x) { return String(Math.round(x * 10) / 10); }

  (async () => {
    if (!isConfigured) return; // local dev: leave placeholders
    const user = await requireUser();
    if (!user) return; // redirected to login
    try {
      const { data: party, error } = await supabase.from('parties').select('*').eq('user_id', user.id).single();
      if (error || !party) { window.location.replace('/nation-select/'); return; }
      const { data: nation } = await supabase.from('nations').select('name, flag, legislature_seats, economy').eq('id', party.nation_id).single();
      const nationName = (nation && nation.name) || party.nation_id;
      const currency = (nation && nation.economy && nation.economy.currency) || '₶';

      // Sidebar + title.
      document.getElementById('sname').textContent = party.name;
      document.getElementById('psub').textContent = party.archetype + ' · ' + nationName;
      document.title = party.name + ' · Nationhood';

      // Header card.
      document.getElementById('pname').textContent = party.name;
      document.getElementById('pabbr').textContent = party.abbreviation ? '(' + party.abbreviation + ')' : '';
      document.getElementById('plogo').textContent = party.abbreviation || party.name.slice(0, 2).toUpperCase();
      document.getElementById('archBadge').textContent = party.archetype;

      if (party.in_government) {
        document.getElementById('statusBadge').classList.add('pbadge--gov');
        document.getElementById('statusText').textContent = 'In Government';
      } else {
        document.getElementById('statusText').textContent = 'Opposition';
      }

      // Standings — read straight from the party/nation rows (one source).
      document.getElementById('st-seats').textContent = party.seats || 0;
      document.getElementById('st-seatsTotal').textContent = '/ ' + ((nation && nation.legislature_seats) || 0);
      document.getElementById('st-pop').textContent = party.popularity || 0;
      document.getElementById('st-funds').textContent = currency + fmtFunds(party.funds);

      if (nation && nation.flag) {
        var flag = document.getElementById('flag');
        flag.onload = function () { flag.hidden = false; };
        flag.src = nation.flag;
      }
    } catch (e) {
      document.getElementById('pname').textContent = 'Could not load your party';
    }
  })();
</script>
</body>
</html>
