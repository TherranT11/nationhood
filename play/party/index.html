<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/theme.js"></script>
<title>Party &amp; Government · Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/play.css">
<style>
  /* Internal Politics — Party + Government merged. Its own scoped canvas (light base, dark override under
     html[data-theme="dark"]); the shared sidenav + topbar keep the site theme. */
  .main{flex:1;min-width:0;padding:0}
  .ip-root{
    --bg:#eef1f6;--panel:#ffffff;--panel2:#eef1f7;--line:#dde1ea;--text:#181c26;--muted:#5b6478;--dim:#98a1b4;
    --orange:#c67f1f;--green:#1a9e6a;--red:#cf3f2b;--accent:#5158d8;--auto:#8a49c9;--reform:#1a9e6a;
    font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px clamp(16px,3vw,30px) 60px}
  html[data-theme="dark"] .ip-root{
    --bg:#0f1116;--panel:#14161d;--panel2:#1b1e28;--line:#232838;--text:#e8ebf2;--muted:#8a93a8;--dim:#5c657b;
    --orange:#f0a03c;--green:#3ecf8e;--red:#e5604c;--accent:#7c83f7;--auto:#b56af0;--reform:#3ecf8e}
  .ip-wrap{max-width:100%;margin:0}
  .mono{font-family:'JetBrains Mono',monospace}
  .ip-micro{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;color:var(--dim);text-transform:uppercase}
  .ip-title{font-weight:800;font-size:26px;margin:2px 0 4px}
  .ip-sub{font-size:12.5px;color:var(--muted);margin-bottom:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px 17px}
  .ip-row{display:flex;gap:15px;flex-wrap:wrap;margin-bottom:14px}
  .ip-row2{display:flex;gap:14px;flex-wrap:wrap}
  /* Row 1 (identity + stat cards) runs 25% larger than the base card — bigger padding, labels and figures. */
  .ip-row .card{padding:19px 21px}
  .ip-row .ip-micro{font-size:11px}

  /* identity */
  .idcard{flex:2.2 1 250px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;row-gap:12px}
  .id-logo{width:78px;height:78px;border-radius:15px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden;flex:none}
  .id-logo img{width:100%;height:100%;object-fit:cover}
  .id-name{font-weight:800;font-size:21px;margin:2px 0}
  .id-leader{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--muted)}
  .id-leader b{color:var(--text);font-weight:700}
  .id-edit{font-family:'JetBrains Mono',monospace;background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:9px 15px;font-size:12px;font-weight:800;letter-spacing:.06em;cursor:pointer;flex:none;margin-left:auto}
  .id-edit:hover{border-color:var(--accent);color:var(--accent)}

  /* stat cards */
  .statcard{flex:1 1 170px}
  .stat-big{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:800}
  .stat-big small{font-size:16px;color:var(--dim)}
  .stat-trend{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700}
  .stat-trend.up{color:var(--green)} .stat-trend.down{color:var(--red)}
  .stat-note{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);margin-top:7px}
  .hearts{font-size:28px;letter-spacing:5px;margin-top:8px}
  .heart-svg{width:28px;height:28px;vertical-align:-4px}

  /* hemicycle */
  .hemicard{flex:1 1 360px}
  .hemi-legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:6px;font-size:11.5px}
  .hemi-legend .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:0}
  .hemi-legend .n{font-family:'JetBrains Mono',monospace;color:var(--muted)}

  /* stance */
  .stancecard{flex:1.5 1 460px}
  .st-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px;flex-wrap:wrap}
  .st-poles{display:flex;gap:12px}
  .st-poles span{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.1em}
  .st-ladder{position:relative;height:66px;margin:0 10px 4px}
  .st-line{position:absolute;top:17px;left:0;right:0;height:3px;border-radius:2px}
  .st-node{position:absolute;top:0;transform:translateX(-50%);text-align:center;width:78px}
  .st-pip{width:36px;height:36px;margin:0 auto;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:15px;border:1px solid var(--line)}
  .st-pip.you{border:2px solid var(--accent);box-shadow:0 0 12px color-mix(in srgb,var(--accent) 40%,transparent)}
  .st-pip.locked{opacity:.55}
  .st-lab{font-family:'JetBrains Mono',monospace;font-size:7px;letter-spacing:.06em;color:var(--dim);margin-top:4px;line-height:1.3}
  .st-lab.you{color:var(--accent)}
  .st-here{font-family:'JetBrains Mono',monospace;font-size:7px;color:var(--accent)}
  .st-detail{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-top:10px}
  .st-dh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .st-dnm{font-weight:800;font-size:14px}
  .st-creed{font-size:11px;color:var(--muted);font-style:italic}
  .st-toolkit{font-size:11.5px;color:var(--muted);line-height:1.5;margin:8px 0}
  .st-toolkit b{color:var(--text)}
  .st-tk{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.1em;color:var(--dim)}
  .st-pass{font-size:11px;color:var(--muted);line-height:1.5;border-top:1px dashed var(--line);padding-top:8px}
  .st-pass b{color:var(--text)}
  .st-plenum{display:flex;justify-content:flex-end;margin-top:9px}
  .st-plenum button{font-family:'JetBrains Mono',monospace;background:var(--panel);border:1px dashed var(--line);color:var(--dim);border-radius:8px;padding:7px 14px;font-size:9.5px;font-weight:800;letter-spacing:.06em;cursor:not-allowed}

  /* edit modal (scoped palette) */
  .emodal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px}
  .emodal[hidden]{display:none}
  .emodal__panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:440px;padding:18px 20px 20px;color:var(--text)}
  .emodal__hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .emodal__hd b{font-weight:800;font-size:16px}
  .emodal__x{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1}
  .elbl{display:block;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:12px 0 5px}
  .einput{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;color:var(--text);font-family:inherit;font-size:14px}
  .einput.abbr{text-transform:uppercase;letter-spacing:.1em;max-width:140px}
  .ecolorrow{display:flex;align-items:center;gap:10px}
  .ecolor{width:44px;height:32px;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer}
  .ecolorhex{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
  .elogorow{display:flex;align-items:center;gap:12px}
  .elogoprev{width:44px;height:44px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);overflow:hidden;flex:none}
  .elogoprev img{width:100%;height:100%;object-fit:cover}
  .ecost{font-size:12px;color:var(--muted);margin-top:14px}
  .ecost b{color:var(--text)}
  .eerr{color:var(--red);font-size:12.5px;margin-top:8px;min-height:16px}
  .esave{width:100%;margin-top:10px;background:var(--accent);border:none;color:#fff;border-radius:9px;padding:11px;font-weight:800;font-size:13px;cursor:pointer}
  .esave:disabled{opacity:.6;cursor:default}

  @media(max-width:640px){.st-lab{font-size:6px}.st-node{width:56px}}
</style>
</head>
<body>
<div class="app">
  <div id="sidenav"></div>
  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="ip-root">
      <div class="ip-wrap">
        <div class="ip-micro" style="color:var(--accent)">Internal Politics</div>
        <div class="ip-title" id="ipTitle">Your Party &amp; Government</div>
        <div class="ip-sub">Your party, the assembly behind it, and the state of the government it leads.</div>

        <!-- ROW 1: identity + approval + coalition health + reform -->
        <div class="ip-row">
          <div class="card idcard">
            <div class="id-logo" id="idLogo">🏛</div>
            <div style="flex:1 1 140px;min-width:140px">
              <div class="ip-micro" id="idEyebrow" style="color:var(--accent)">—</div>
              <div class="id-name" id="idName">—</div>
              <div class="id-leader" id="idLeader">LEADER —</div>
            </div>
            <button class="id-edit" id="editBtn" type="button" hidden>EDIT · 1 AP</button>
          </div>

          <div class="card statcard">
            <div class="ip-micro">Party Approval</div>
            <div style="display:flex;align-items:baseline;gap:8px;margin-top:3px">
              <span class="stat-big" id="apprVal">—</span>
              <span class="stat-trend" id="apprTrend" hidden></span>
            </div>
            <svg id="apprSpark" width="100%" height="30" viewBox="0 0 300 30" preserveAspectRatio="none" style="margin-top:4px" aria-hidden="true"></svg>
          </div>

          <div class="card statcard" id="healthCard" hidden>
            <div class="ip-micro">Coalition Health <span id="healthInfo" title="A debt crisis, a vacant cabinet, or a neglected agenda each cost a heart; delivering the agenda restores one. At zero the government falls and a snap election is held." style="cursor:help;color:var(--dim)">ⓘ</span></div>
            <div class="hearts" id="healthHearts"></div>
            <div class="stat-note" id="healthNote"></div>
          </div>

          <div class="card statcard" id="reformCard" hidden>
            <div class="ip-micro">Nation · Reform</div>
            <div class="stat-big" style="margin-top:3px"><span id="reformVal">—</span><small>/15</small></div>
            <div class="stat-note" id="reformNote"></div>
          </div>
        </div>

        <!-- ROW 2: assembly + stance -->
        <div class="ip-row2">
          <div class="card hemicard" id="hemiCard">
            <div class="ip-micro" style="margin-bottom:4px">The National Assembly</div>
            <svg id="hemiSvg" viewBox="-160 -160 320 176" width="100%" style="max-height:340px"></svg>
            <div class="hemi-legend" id="hemiLegend"></div>
          </div>

          <div class="card stancecard" id="stanceCard" hidden>
            <div class="st-head">
              <div class="ip-micro" id="stanceHd">Faction Stance</div>
              <div class="st-poles"><span id="stancePoleL" style="color:var(--auto)"></span><span id="stancePoleR" style="color:var(--reform)"></span></div>
            </div>
            <div class="st-ladder" id="stanceLadder"></div>
            <div class="st-detail" id="stanceDetail"></div>
          </div>
        </div>

        <!-- Edit Party modal (inside .ip-root so it inherits the scoped palette) -->
        <div class="emodal" id="editModal" hidden>
          <div class="emodal__panel">
            <div class="emodal__hd"><b>Edit Party</b><button class="emodal__x" id="editClose" type="button" aria-label="Close">&times;</button></div>
            <label class="elbl" for="eName">Party name</label>
            <input class="einput" id="eName" type="text" maxlength="48" autocomplete="off">
            <label class="elbl" for="eAbbr">Abbreviation (2–4 letters)</label>
            <input class="einput abbr" id="eAbbr" type="text" maxlength="4" autocomplete="off" spellcheck="false">
            <label class="elbl" for="eColor">Colour</label>
            <div class="ecolorrow"><input class="ecolor" id="eColor" type="color"><span class="ecolorhex" id="eColorHex"></span></div>
            <label class="elbl">Logo</label>
            <div class="elogorow"><div class="elogoprev" id="eLogoPrev"></div><input type="file" id="eLogo" accept="image/png,image/jpeg,image/webp,image/gif"></div>
            <div class="ecost">Costs <b>1 AP</b></div>
            <div class="eerr" id="eErr"></div>
            <button class="esave" id="eSave" type="button">Save · 1 AP</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="module">
  import { supabase, isConfigured, requireUser, currentTick } from '/supabase.js';
  import { esc, majority, tickToDate, TICK_PERIOD_MS } from '/util.js';
  import { ideologyLabel, partyColor } from '/archetypes.js';
  import { nationRegime } from '/ladders.js';
  import { mountTopbar, setTopbarActions } from '/topbar.js';
  import { mountSidenav } from '/sidenav.js';

  mountTopbar();
  mountSidenav();

  var PARTY = null, PCOLOR = 'var(--accent)', BUSY = false;
  var NEW_LOGO_FILE = null;
  var modal = document.getElementById('editModal'), errEl = document.getElementById('eErr');

  // ---- identity / masthead ----
  function renderIdentity(party, leaderName, leaderAge, foundedText) {
    var logo = document.getElementById('idLogo');
    if (party.logo_url) logo.innerHTML = '<img src="' + esc(party.logo_url) + '" alt="">';
    document.getElementById('idEyebrow').textContent = (party.abbreviation || '—') + ' · Founded ' + (foundedText || '—');
    document.getElementById('idName').textContent = party.name || 'Your Party';
    document.getElementById('idLeader').innerHTML = 'LEADER <b>' + esc(leaderName || '—') + '</b>' + (leaderAge != null ? ' (' + leaderAge + ')' : '');
  }

  // ---- approval + sparkline ----
  function renderApproval(party, series, prevPop) {
    var raw = Number(party.popularity) || 0, appr = Math.min(100, raw);
    document.getElementById('apprVal').textContent = (Math.round(appr * 10) / 10) + '%';
    if (prevPop != null) {
      var d = Math.round((raw - Number(prevPop)) * 10) / 10;
      var t = document.getElementById('apprTrend');
      if (d > 0) { t.className = 'stat-trend up'; t.textContent = '▲ ' + d.toFixed(1); t.hidden = false; }
      else if (d < 0) { t.className = 'stat-trend down'; t.textContent = '▼ ' + Math.abs(d).toFixed(1); t.hidden = false; }
    }
    drawSparkline(series);
  }
  function drawSparkline(s) {
    var svg = document.getElementById('apprSpark');
    if (!svg || !s || s.length < 2) return;
    var W = 300, H = 30, pad = 4, n = s.length;
    var min = Math.min.apply(null, s), max = Math.max.apply(null, s), span = (max - min) || 1;
    var pts = s.map(function (v, i) { return [(i / (n - 1)) * W, H - pad - ((v - min) / span) * (H - 2 * pad)]; });
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
    svg.innerHTML = '<path d="' + line + '" fill="none" stroke="var(--accent)" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="' + pts[n - 1][0].toFixed(1) + '" cy="' + pts[n - 1][1].toFixed(1) + '" r="2.4" fill="var(--accent)"/>';
  }

  // ---- coalition health (hearts) — one source: the governments row (schema/165) ----
  function coalitionHearts(govCount) { return 2 + Math.floor((govCount || 0) / 2); }
  function renderHealth(govt, govCount) {
    if (!govt) { document.getElementById('healthCard').hidden = true; return; }
    var max = (govt.coalition_health_max != null) ? govt.coalition_health_max : coalitionHearts(govCount);
    var have = (govt.coalition_health != null) ? govt.coalition_health : max;
    var html = '';
    for (var i = 0; i < max; i++) {
      var on = i < have;
      html += '<svg class="heart-svg" viewBox="0 0 24 24" fill="' + (on ? 'var(--green)' : 'none') + '" stroke="' + (on ? 'none' : 'var(--line)') + '" stroke-width="1.6">' +
        '<path d="M12 21s-7.5-4.9-9.7-9.2C1 8.9 2.4 6 5.3 6c1.9 0 3.1 1.1 3.7 2.1C9.6 7.1 10.8 6 12.7 6 15.6 6 17 8.9 15.7 11.8 13.5 16.1 12 21 12 21z"/></svg>';
    }
    document.getElementById('healthHearts').innerHTML = html;
    document.getElementById('healthNote').textContent = have + ' OF ' + max + ' — AT ZERO: SNAP ELECTION';
    document.getElementById('healthCard').hidden = false;
  }

  // ---- reform + party monopoly ----
  function renderReform(regime) {
    if (!regime) return;
    document.getElementById('reformVal').textContent = regime.reform;
    // In an autocracy the framing is Party Monopoly (grip); elsewhere, reform latitude.
    var note = regime.type === 'autocracy'
      ? 'PARTY MONOPOLY ' + Math.round((1 - regime.reform / 15) * 100) + '%'
      : 'REFORM LATITUDE ' + Math.round(regime.reform / 15 * 100) + '%';
    document.getElementById('reformNote').textContent = note;
    document.getElementById('reformCard').hidden = false;
  }

  // ---- the National Assembly hemicycle (all parties' seats) ----
  function buildSeats(total) {
    var rows = 7, inner = 58, gap = 13.5, radii = [], i;
    for (i = 0; i < rows; i++) radii.push(inner + i * gap);
    var rSum = radii.reduce(function (a, b) { return a + b; }, 0);
    var counts = radii.map(function (r) { return Math.round(total * r / rSum); });
    var diff = total - counts.reduce(function (a, b) { return a + b; }, 0); counts[rows - 1] += diff;
    var seats = [];
    counts.forEach(function (n, ri) { for (var j = 0; j < n; j++) { var a = Math.PI * (1 - (j + 0.5) / n); seats.push({ x: radii[ri] * Math.cos(a), y: -radii[ri] * Math.sin(a), a: a }); } });
    seats.sort(function (s1, s2) { return s2.a - s1.a; });   // left → right
    return seats;
  }
  function renderHemicycle(party, roster, total) {
    if (!total || total < 1) { document.getElementById('hemiCard').hidden = true; return; }
    // Government parties first (full arc), then opposition — each by seats desc.
    var ordered = roster.slice().sort(function (a, b) {
      return (b.in_government ? 1 : 0) - (a.in_government ? 1 : 0) || (b.seats || 0) - (a.seats || 0);
    });
    var colors = [];
    ordered.forEach(function (p) { var c = partyColor(p); for (var k = 0; k < (p.seats || 0); k++) colors.push(c); });
    while (colors.length < total) colors.push('var(--line)');   // empty/independent seats
    var seats = buildSeats(total), maj = majority(total), mine = party.seats || 0;
    var dots = seats.map(function (s, i) { return '<circle cx="' + s.x.toFixed(1) + '" cy="' + s.y.toFixed(1) + '" r="4.4" fill="' + (colors[i] || 'var(--line)') + '"/>'; }).join('');
    document.getElementById('hemiSvg').innerHTML = dots +
      '<text x="0" y="-6" text-anchor="middle" font-size="26" font-weight="800" fill="var(--text)" font-family="\'IBM Plex Sans\',sans-serif">' + mine + '</text>' +
      '<text x="0" y="9" text-anchor="middle" font-size="8.5" fill="var(--dim)" font-family="\'JetBrains Mono\',monospace" letter-spacing="1">OF ' + total + ' · MAJORITY ' + maj + (mine >= maj ? ' ✓' : '') + '</text>';
    document.getElementById('hemiLegend').innerHTML = ordered.filter(function (p) { return (p.seats || 0) > 0; }).slice(0, 5).map(function (p) {
      return '<span><span class="sw" style="background:' + partyColor(p) + '"></span>' + esc(p.name || 'Party') + ' <span class="n">' + (p.seats || 0) + '</span></span>';
    }).join('');
    document.getElementById('hemiCard').hidden = false;
  }

  // ---- Stance: read-only ladder per regime type (the shift mechanic — Congress/Plenum — is not built yet) ----
  var STANCE_TRACKS = {
    democracy: {
      specA: '#3f7fbf', specB: 'var(--red)', poleL: '🏛 Democratic', poleR: 'Revolutionary ✊',
      plenum: 'Party Congress · coming soon', cur: 3,
      notches: [
        { id: 'D3', ic: '🏛', short: 'Constitutionalist' }, { id: 'D2', ic: '🗳', short: 'Parliamentarian' }, { id: 'D1', ic: '📣', short: 'Reformer' },
        { id: 'N', ic: '⚖', short: 'Opportunist', creed: '“We’ll see.”',
          tools: [{ n: 'Parliamentary Basics', d: 'Vote, propose bills, and make statements — the moves every party has.' }],
          passive: '<b>No stance bonus, no stance penalty.</b> Optionality is the point: you sit one step from either side’s first tools. But camp here too long and voters read you as unprincipled. A corridor, not a home.' },
        { id: 'R1', ic: '✊', short: 'Agitator' }, { id: 'R2', ic: '🔥', short: 'Militant' }, { id: 'R3', ic: '⚔', short: 'Insurrectionist' }
      ]
    },
    autocracy: {
      specA: '#9159c9', specB: 'var(--green,#16915a)', poleL: '👁 Autocratic', poleR: 'Reform 📈',
      plenum: 'Party Plenum · coming soon', cur: 3,
      notches: [
        { id: 'A3', ic: '👁', short: 'Vozhd' }, { id: 'A2', ic: '🕶', short: 'Securocrat' }, { id: 'A1', ic: '🧱', short: 'Hardliner' },
        { id: 'N', ic: '🏵', short: 'Apparatchik', creed: '“I serve the Party.” (Which faction? “The Party.”)',
          tools: [{ n: 'Congress Basics', d: 'Vote, hold ministries, and keep your head down — quiet competence earns a little standing each uneventful tick.' }],
          passive: '<b>Purge-resistant.</b> Hardliners don’t fear you and reformists don’t hate you. But you’re succession-invisible: when the Leader dies, apparatchiks are never on the shortlist. A corridor, not a home.' },
        { id: 'Ref1', ic: '📈', short: 'Technocrat' }, { id: 'Ref2', ic: '📰', short: 'Glasnostik' }, { id: 'Ref3', ic: '🕊', short: 'Transitioner' }
      ]
    }
  };
  function renderStance(regime) {
    var track = regime && STANCE_TRACKS[regime.type];
    var card = document.getElementById('stanceCard');
    if (!track) { card.hidden = true; return; }   // monarchy / unset has no ladder
    document.getElementById('stanceHd').textContent = regime.type === 'autocracy' ? 'Faction Stance — moves at a Party Plenum' : 'Party Stance — moves at a Party Congress';
    document.getElementById('stancePoleL').textContent = track.poleL;
    document.getElementById('stancePoleR').textContent = track.poleR;
    var line = document.getElementById('stanceLadder');
    line.innerHTML = '<div class="st-line" style="background:linear-gradient(90deg,' + track.specA + ',#5a5a8a 45%,' + track.specB + ')"></div>' +
      track.notches.map(function (n, i) {
        var x = i / (track.notches.length - 1) * 100, you = i === track.cur;
        return '<div class="st-node" style="left:' + x + '%">' +
          '<div class="st-pip' + (you ? ' you' : ' locked') + '">' + n.ic + '</div>' +
          '<div class="st-lab' + (you ? ' you' : '') + '">' + (n.id !== 'N' ? n.id + ' ' : '') + n.short + (you ? '' : ' 🔒') + '</div>' +
          (you ? '<div class="st-here">● YOU ARE HERE</div>' : '') + '</div>';
      }).join('');
    var d = track.notches[track.cur], t = d.tools[0];
    document.getElementById('stanceDetail').innerHTML =
      '<div class="st-dh"><span style="font-size:15px">' + d.ic + '</span><span class="st-dnm">' + d.short + '</span><span class="st-creed">' + d.creed + '</span></div>' +
      '<div class="st-toolkit"><span class="st-tk">TOOLKIT · </span><b>' + t.n + '</b> — ' + t.d + '</div>' +
      '<div class="st-pass">' + d.passive + '</div>' +
      '<div class="st-plenum"><button type="button" disabled>' + track.plenum.toUpperCase() + '</button></div>';
    card.hidden = false;
  }

  // ---- edit party ----
  function openEdit() {
    document.getElementById('eName').value = PARTY.name || '';
    document.getElementById('eAbbr').value = PARTY.abbreviation || '';
    var col = (PARTY.color && /^#[0-9a-fA-F]{6}$/.test(PARTY.color)) ? PARTY.color : '#7c83f7';
    var ec = document.getElementById('eColor'); ec.value = col; document.getElementById('eColorHex').textContent = col;
    document.getElementById('eLogoPrev').innerHTML = PARTY.logo_url ? '<img src="' + esc(PARTY.logo_url) + '" alt="">' : '';
    NEW_LOGO_FILE = null; errEl.textContent = ''; modal.hidden = false;
  }
  function closeEdit() { modal.hidden = true; }
  document.getElementById('editClose').onclick = closeEdit;
  modal.addEventListener('click', function (e) { if (e.target === modal) closeEdit(); });
  document.getElementById('eColor').addEventListener('input', function (e) { document.getElementById('eColorHex').textContent = e.target.value; });
  document.getElementById('eAbbr').addEventListener('input', function (e) { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4); });
  document.getElementById('eLogo').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) { NEW_LOGO_FILE = null; return; }
    if (f.size > 2 * 1024 * 1024) { errEl.textContent = 'That image is over 2 MB — pick a smaller one.'; e.target.value = ''; NEW_LOGO_FILE = null; return; }
    NEW_LOGO_FILE = f; errEl.textContent = '';
    var r = new FileReader();
    r.onload = function () { document.getElementById('eLogoPrev').innerHTML = '<img src="' + r.result + '" alt="">'; };
    r.readAsDataURL(f);
  });
  async function uploadLogo(file) {
    var u = (await supabase.auth.getUser()).data.user;
    if (!u) throw new Error('Not signed in.');
    var ext = ((file.name || '').split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g, '') || 'png';
    var path = u.id + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + ext;
    var up = await supabase.storage.from('party-logos').upload(path, file, { cacheControl: '3600', upsert: false });
    if (up.error) throw new Error(up.error.message);
    return supabase.storage.from('party-logos').getPublicUrl(path).data.publicUrl;
  }
  async function saveEdit() {
    if (BUSY) return;
    var name = document.getElementById('eName').value.trim();
    var abbr = document.getElementById('eAbbr').value.trim().toUpperCase();
    var color = document.getElementById('eColor').value;
    if (!name) { errEl.textContent = 'Enter a party name.'; return; }
    if (!/^[A-Z]{2,4}$/.test(abbr)) { errEl.textContent = 'The abbreviation must be 2–4 letters.'; return; }
    BUSY = true; errEl.textContent = '';
    var btn = document.getElementById('eSave'); btn.disabled = true; btn.textContent = 'Saving…';
    try {
      var logoUrl = PARTY.logo_url || '';
      if (NEW_LOGO_FILE) logoUrl = await uploadLogo(NEW_LOGO_FILE);
      const { error } = await supabase.rpc('edit_party', { p_name: name, p_abbr: abbr, p_logo_url: logoUrl, p_color: color });
      if (error) throw error;
      window.location.reload();
    } catch (e) {
      BUSY = false; btn.disabled = false; btn.textContent = 'Save · 1 AP';
      errEl.textContent = (e && e.message) || 'Could not save your party.';
    }
  }
  document.getElementById('eSave').onclick = saveEdit;

  (async () => {
    if (!isConfigured) return;
    const user = await requireUser();
    if (!user) return;
    try {
      const { data: party, error } = await supabase.from('parties')
        .select('id, name, abbreviation, archetype, color, logo_url, influence, popularity, seats, in_government, created_at, nation_id')
        .eq('user_id', user.id).single();
      if (error || !party) { window.location.replace('/nation-select/'); return; }
      PARTY = party; PCOLOR = partyColor(party);
      const { data: nation } = await supabase.from('nations').select('name, flag, legislature_seats, economy').eq('id', party.nation_id).single();

      // shared chrome
      var pn = document.getElementById('pname'); if (pn) pn.textContent = party.name;
      var ps = document.getElementById('psub'); if (ps) ps.textContent = ideologyLabel(party) + ' · ' + ((nation && nation.name) || party.nation_id);
      if (nation && nation.flag) { var f = document.getElementById('flag'); if (f) { f.onload = function () { f.hidden = false; }; f.src = nation.flag; } }
      setTopbarActions(party.influence);
      document.getElementById('ipTitle').textContent = party.name + ' & Government of ' + ((nation && nation.name) || party.nation_id);

      // leader (masthead "Led by")
      var leaderName = '', leaderAge = null;
      try {
        const { data: leader } = await supabase.from('politicians').select('first_name, last_name, age')
          .eq('party_id', party.id).eq('status', 'Party Leader').order('created_at').limit(1).maybeSingle();
        if (leader) { leaderName = ((leader.first_name || '') + ' ' + (leader.last_name || '')).trim(); leaderAge = leader.age; }
      } catch (e) {}
      // founded — derive the in-game month from created_at vs the game clock
      var foundedText = '—', curTick = 1;
      try {
        curTick = await currentTick();
        if (party.created_at) {
          var elapsed = Math.round((Date.now() - new Date(party.created_at).getTime()) / TICK_PERIOD_MS);
          foundedText = tickToDate(Math.max(1, Math.min(curTick, curTick - elapsed)));
        }
      } catch (e) {}
      renderIdentity(party, leaderName, leaderAge, foundedText);
      var eb = document.getElementById('editBtn'); eb.hidden = false; eb.onclick = openEdit;

      // approval history → sparkline + trend
      var series = [], prevPop = null;
      try {
        const { data: pph } = await supabase.from('party_popularity_history').select('tick, popularity').eq('party_id', party.id).order('tick', { ascending: true });
        series = (pph || []).map(function (r) { return Number(r.popularity); }).filter(isFinite);
        if (series.length >= 2) prevPop = series[series.length - 2];
      } catch (e) {}
      renderApproval(party, series, prevPop);

      // the assembly: every party's seats
      var roster = [];
      try {
        var pr = await supabase.from('parties').select('id, name, abbreviation, archetype, color, seats, in_government').eq('nation_id', party.nation_id);
        if (pr.error) pr = await supabase.from('parties').select('id, name, abbreviation, archetype, seats, in_government').eq('nation_id', party.nation_id);
        roster = pr.data || [];
      } catch (e) {}
      renderHemicycle(party, roster, Number(nation && nation.legislature_seats) || 0);

      // coalition health — one source: the active government row (schema/165)
      try {
        const { data: govt } = await supabase.from('governments').select('coalition_health, coalition_health_max, status').eq('nation_id', party.nation_id).eq('status', 'active').maybeSingle();
        renderHealth(govt, roster.filter(function (p) { return p.in_government; }).length);
      } catch (e) {}

      // reform + stance from the regime
      var regime = nationRegime(nation && nation.economy);
      renderReform(regime);
      try { renderStance(regime); } catch (e) {}
    } catch (e) { /* chrome still renders */ }
  })();
</script>
