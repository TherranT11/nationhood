<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/theme.js"></script>
<title>Propose a Measure · Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAF8;--surface:#FFFFFF;--ink:#15151B;--muted:#5b5b63;--soft:#8d8d95;
    --line:#E7E5E0;--line2:#D9D6D0;--chip:#F4F3EF;--field:#FCFBF9;
    --indigo:#5546E8;--indigo-soft:#ECE9FD;
    --red:#C42B2B;--red-soft:#FBEAE9;--amber:#E0820E;--amber-soft:#FBF0DD;--green:#16915a;--green-soft:#E5F4EC;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .app{display:flex;min-height:100vh}

  /* Left navigation (desktop rail + mobile bottom bar) lives in /sidenav.js */

  .main{flex:1;padding:24px clamp(16px,4vw,56px) 56px;min-width:0}
  .back{display:inline-flex;align-items:center;gap:7px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;margin-bottom:16px;text-decoration:none}
  .back:hover{color:var(--ink)}
  .back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .phead .eye{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--indigo)}
  .phead h1{font-weight:900;font-size:clamp(24px,3.6vw,32px);letter-spacing:-.03em;margin-top:4px}
  .phead p{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:620px}
  .muted{color:var(--soft);font-size:13px;font-style:italic}

  /* two-column draft layout (ported from the tutorial's propose page) */
  .grid{display:grid;grid-template-columns:1.4fr .92fr;gap:18px;align-items:start;margin-top:20px}
  @media(max-width:960px){.grid{grid-template-columns:1fr}}
  .mod{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px}
  .mod__hd{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .mod__hd .hint{text-transform:none;letter-spacing:0;font-size:11px;color:var(--soft)}

  .lbl{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-bottom:6px;display:block}
  .inp{width:100%;font-family:'Archivo',sans-serif;font-size:14.5px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
  .inp::placeholder{color:var(--soft)}
  .inp:focus{outline:none;border-color:var(--indigo);background:var(--surface);box-shadow:0 0 0 3px var(--indigo-soft)}
  .curval{font-size:15px;font-weight:700;color:var(--ink);padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:var(--chip)}
  .poldesc{color:var(--muted);font-size:13.5px;line-height:1.5;margin:10px 0 0}

  .preview{position:sticky;top:20px}
  .pvlabel{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin:0 4px 8px}
  .pvcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
  .pvcard h3{font-weight:900;font-size:19px;letter-spacing:-.02em;line-height:1.15}
  .pvcard h3.empty{color:var(--soft);font-weight:700}
  .pvarts{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
  .pvarts .ac{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-bottom:8px}
  .pvarts .none{color:var(--soft);font-style:italic;font-size:13px}

  .proj{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-top:16px}

  .actions{display:flex;flex-direction:column;gap:9px;margin-top:18px}
  .btn{display:flex;align-items:center;justify-content:center;gap:9px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:13px;border-radius:11px;cursor:pointer;border:1.5px solid var(--indigo)}
  .btn .ac{font-size:9px;letter-spacing:.04em;opacity:.8;font-weight:700}
  .btn:disabled{border-color:var(--line);background:var(--chip);color:var(--soft);cursor:not-allowed;pointer-events:none}
  .btn:disabled .ac{color:var(--soft)}
  .proposed-note{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.04em;color:var(--soft);text-align:center;margin-top:2px}
  .eff{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
  .eff:last-child{border-bottom:none}
  .eff b{font-weight:700}.eff.pos b{color:var(--green)}.eff.neg b{color:var(--red)}
  .eff .cad{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);flex:none}

  /* policy ladder — clickable rungs replace the change-to dropdown */
  .ladder{display:flex;flex-direction:column;gap:6px}
  .rung{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:10px 13px;cursor:pointer;text-align:left;width:100%;font-family:inherit;color:inherit}
  .rung:hover{border-color:var(--line2)}
  .rung:focus-visible{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px var(--indigo-soft)}
  .rung.current{border-style:dashed;opacity:.72;cursor:default}
  .rung.proposed{border-color:var(--indigo);background:var(--indigo-soft)}
  .rung .rn{font-weight:700;font-size:13.5px}
  .rung .rmeta{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.02em;color:var(--soft);margin-top:2px}
  .rung .rbadge{font-family:'Space Mono',monospace;font-size:8.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:3px 7px;flex:none}
  .rbadge.cur{color:var(--soft);background:var(--chip);border:1px solid var(--line2)}
  .rbadge.prop{color:var(--indigo);background:var(--surface);border:1px solid var(--indigo)}

  /* fiscal impact — structured income/budget/net deltas (one source: the option money effects) */
  .frow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .frow:last-child{border-bottom:none}
  .frow.net{border-top:1px solid var(--line2);margin-top:2px}
  .frow .fk{font-weight:700;font-size:13px}
  .frow .fk small{display:block;font-family:'Space Mono',monospace;font-weight:400;font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}
  .frow .fdir{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.04em;text-transform:uppercase;text-align:right}
  .frow .fval{font-family:'Space Mono',monospace;font-weight:700;font-size:13.5px;text-align:right;min-width:78px}
  .up{color:var(--green)}.dn{color:var(--red)}.flat{color:var(--soft)}
  .tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .ltag{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.03em;color:var(--amber);background:var(--amber-soft);border:1px solid #e8cfa3;border-radius:7px;padding:4px 8px}

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div id="sidenav"></div><!-- left rail / mobile bottom bar, injected by /sidenav.js -->

  <main class="main">
    <div class="topbar" id="topbar"></div>
    <a class="back" href="/play/legislature/"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>Legislature</a>
    <div class="phead">
      <span class="eye">Legislature</span>
      <h1>Propose a Measure</h1>
      <p>Bring a law or a declaration to the chamber.</p>
    </div>

    <div class="grid" id="proposeGrid">
      <section class="mod"><p class="muted">Loading…</p></section>
    </div>
  </main>
</div>

<script type="module">
  import { supabase, isConfigured, requireUser } from '/supabase.js';
  import { esc, declaredValue } from '/util.js';
  import { mountTopbar, setTopbarActions } from '/topbar.js';
  import { mountSidenav } from '/sidenav.js';
  import { fetchDeclarations, proposeDeclaration, fetchPolicies, proposeLaw, proposeRegimeChange, proposeThreshold, fetchProposals } from '/proposals.js';
  import { policyOptions, policyOptionIdx, effectText, optMoney, fiscalNet, optOneTimeMoney, isMoneyTarget, isTradePolicy, tradeEffectText, policyVotePopularity } from '/policies.js';
  import { ideologyLabel } from '/archetypes.js';
  import { isMonarchy, regimeText } from '/ladders.js';

  // The royal Head-of-State titles are reserved for the monarchy band (regime 21–25);
  // the picker greys them out elsewhere (isMonarchy, ladders.js) — flavour gate only.
  var ROYAL_TITLES = ['King', 'Queen', 'Emperor'];

  mountTopbar(); // shared top bar (Discord/Influence/budget/date/gear) into #topbar
  mountSidenav();  // left rail (desktop) / bottom bar (mobile) into #sidenav; active item from the URL

  var modeParam = new URLSearchParams(location.search).get('type');
  var isDecl = modeParam === 'declaration';
  var isRegime = modeParam === 'regime';
  var isThreshold = modeParam === 'threshold';

  // ---- Law mode: pick a policy + the option to enact, preview its effects for this
  // nation, then queue it or send it to the floor (mirrors the declaration flow). ----
  var lawBusy = false;
  async function renderLawMode(currentPolicies, nation, pendingPolicies, partySeats) {
    currentPolicies = currentPolicies || {};
    pendingPolicies = pendingPolicies || {};   // policyId → true for a bill already on the floor/agenda
    var noSeats = Number(partySeats) < 1;      // a party with no legislature seats can't author a bill (server enforces too)
    var pop = Number((nation && nation.population) || 0), pros = Number((nation && nation.stats && nation.stats.prosperity) || 10);
    document.querySelector('.phead .eye').textContent = 'Legislature · Law';
    document.querySelector('.phead h1').textContent = 'Propose a Law';
    document.querySelector('.phead p').textContent = 'Pick a policy and climb the ladder to the rung you want to put to the chamber. If it passes, the nation switches to that rung and its effects land.';
    var grid = document.getElementById('proposeGrid');
    var policies;
    try { policies = await fetchPolicies(); }
    catch (e) { grid.innerHTML = '<section class="mod"><p class="muted">Couldn’t load the policy catalogue. Refresh to try again.</p></section>'; return; }
    if (!policies.length) { grid.innerHTML = '<section class="mod"><p class="muted">No policies have been defined yet — an admin sets these up first.</p></section>'; return; }

    grid.innerHTML =
      '<div><section class="mod"><div class="mod__hd"><span>Policy</span><span class="hint">one policy per law</span></div>' +
        '<label class="lbl">Policy</label><select id="l-policy" class="inp"></select>' +
        '<p id="l-desc" class="poldesc" hidden></p>' +
        '<label class="lbl" style="margin-top:14px">In force now</label><div id="l-current" class="curval">—</div>' +
        '<label class="lbl" style="margin-top:14px">Proposed change <span class="hint" style="text-transform:none;letter-spacing:0">— pick a rung</span></label><div id="l-ladder" class="ladder"></div>' +
      '</section>' +
      '<section class="mod"><div class="mod__hd"><span>The Bill</span><span class="hint">filled in for you — edit freely</span></div>' +
        '<label class="lbl">Bill title</label><input id="l-title" class="inp" type="text" maxlength="120" placeholder="e.g. Public Health Programmes (Amendment)">' +
        '<label class="lbl" style="margin-top:14px">Introductory article</label><textarea id="l-intro" class="inp" rows="3" maxlength="400" placeholder="An Act to…" style="resize:vertical;line-height:1.55"></textarea>' +
      '</section></div>' +
      '<div class="preview"><div class="pvlabel">Live Preview</div>' +
        '<div class="pvcard"><h3 id="l-pv" class="empty">Choose a change</h3>' +
          '<div class="pvarts"><div class="ac">Fiscal impact <span class="hint">vs the rung in force</span></div><div id="l-fiscal"><p class="none">—</p></div>' +
            '<div class="ac" style="margin-top:14px">Standing effects if enacted</div><div id="l-effs"><p class="none">—</p></div><div id="l-tags" class="tagrow"></div>' +
            '<div class="ac" style="margin-top:14px">One-time cost to change <span class="hint">on enactment</span></div><div id="l-trans"><p class="none">—</p></div>' +
            '<div class="ac" style="margin-top:14px">Implementation time <span class="hint">time to take effect</span></div><div id="l-impl"><p class="none">—</p></div></div></div>' +
        '<div class="proj"><div class="actions">' +
          '<button class="btn" id="l-floor" type="button" disabled>Bring to the Floor Now <span class="ac">2 Influence</span></button>' +
          '<button class="btn" id="l-agenda" type="button" disabled>Add to Upcoming Agenda <span class="ac">Free</span></button>' +
          '<div class="proposed-note" id="l-note">Pick a rung to propose it.</div>' +
        '</div></div></div>';

    var polSel = document.getElementById('l-policy'), titleInp = document.getElementById('l-title'), introInp = document.getElementById('l-intro');
    var floorBtn = document.getElementById('l-floor'), agendaBtn = document.getElementById('l-agenda'), note = document.getElementById('l-note');
    polSel.innerHTML = policies.map(function (p, i) { return '<option value="' + i + '">' + esc((p.definition && p.definition.name) || 'Policy') + '</option>'; }).join('');

    var sel = { proposed: null };          // chosen rung index, or null
    var touched = { title: false, intro: false };
    function curPolicy() { return policies[+polSel.value] || policies[0]; }
    function curDef() { return curPolicy().definition || {}; }
    // The option in force for this nation (one source: policies.js).
    function inForceIdx() { return policyOptionIdx(curDef(), currentPolicies, curPolicy().id); }

    // Money helpers (optMoney/fiscalNet/optOneTimeMoney) live in policies.js — ONE source shared
    // with the Legislature bill view. They scale by THIS nation's pop/prosperity, passed in here.
    function rungMeta(o) {   // short fiscal summary line under a rung's name
      var m = optMoney(o, pop, pros), net = m.Income + m.Budget;
      if (Math.abs(net) < 0.05) return 'no fiscal cost';
      return net > 0 ? '₣' + net.toFixed(1) + 'B/yr revenue' : '₣' + Math.abs(net).toFixed(1) + 'B/yr cost';
    }

    function renderLadder() {
      var def = curDef(), opts = policyOptions(def), cur = inForceIdx();
      var descEl = document.getElementById('l-desc');   // the policy's description, above In force now
      descEl.textContent = def.desc || ''; descEl.hidden = !def.desc;
      document.getElementById('l-current').textContent = (opts[cur] && opts[cur].name) || '—';
      var lad = document.getElementById('l-ladder');
      lad.innerHTML = opts.map(function (o, i) {
        var isCur = i === cur, isProp = i === sel.proposed;
        var badge = isCur ? '<span class="rbadge cur">In force</span>' : isProp ? '<span class="rbadge prop">Proposed</span>' : '';
        return '<button type="button" class="rung' + (isCur ? ' current' : '') + (isProp ? ' proposed' : '') + '" data-i="' + i + '"' + (isCur ? ' disabled' : '') + '>' +
          '<span><span class="rn">' + esc(o.name || ('Option ' + (i + 1))) + '</span><span class="rmeta">' + esc(rungMeta(o)) + '</span></span>' + badge + '</button>';
      }).join('');
      lad.querySelectorAll('.rung').forEach(function (btn) {
        btn.onclick = function () { var i = +btn.dataset.i; if (i === inForceIdx()) return; sel.proposed = i; autofill(); paint(); };
      });
    }

    // One effect → one preview row. effectText gives the text + colour band; cadLabel is the timing.
    function effRow(t, cadLabel) { return '<div class="eff ' + t.cls + '"><b>' + esc(t.text) + '</b><span class="cad">' + cadLabel + '</span></div>'; }
    function fmtB(v) { return '₣' + Math.abs(v).toFixed(2) + 'B'; }
    function fRow(label, sub, delta, goodUp, isNet) {
      var flat = Math.abs(delta) < 0.005, up = delta > 0, good = goodUp ? up : !up;
      var cls = flat ? 'flat' : good ? 'up' : 'dn';
      var dir = flat ? 'No change' : up ? '▲ Increase' : '▼ Decrease';
      var sign = delta > 0 ? '+' : delta < 0 ? '−' : '';
      return '<div class="frow' + (isNet ? ' net' : '') + '"><div class="fk">' + label + (sub ? '<small>' + sub + '</small>' : '') + '</div>' +
        '<div class="fdir ' + cls + '">' + dir + '</div><div class="fval ' + cls + '">' + sign + fmtB(delta) + '</div></div>';
    }
    // Fiscal impact, as two single figures (one source: policies.js money helpers):
    //   • Net fiscal impact — the recurring change vs the rung in force, netted across Income +
    //     Budget − Debt (Debt is a liability), per year.
    //   • One-time cost — the up-front money the proposed rung applies on enactment (its 'once' /
    //     finite money), netted. Kept here (not in the effects list) so money reads as one thing.
    function renderFiscal() {
      var box = document.getElementById('l-fiscal');
      if (sel.proposed == null) { box.innerHTML = '<p class="none">—</p>'; return; }
      var opts = policyOptions(curDef());
      var netY = fiscalNet(opts[inForceIdx()], opts[sel.proposed], pop, pros);
      var oneT = optOneTimeMoney(opts[sel.proposed], pop, pros);
      var rows = [];
      if (Math.abs(netY) >= 0.005) rows.push(fRow('Net fiscal impact', 'per year', netY, true, true));
      if (Math.abs(oneT) >= 0.005) rows.push(fRow('One-time cost', 'on enactment', oneT, true));
      box.innerHTML = rows.length ? rows.join('') : '<p class="none">No change to the budget.</p>';
    }
    // Standing (non-money) effects of the proposed rung, with their cadence, plus its identity tags.
    function renderEffects() {
      var effBox = document.getElementById('l-effs'), tagBox = document.getElementById('l-tags');
      if (sel.proposed == null) { effBox.innerHTML = '<p class="none">—</p>'; tagBox.innerHTML = ''; return; }
      var def = curDef(), o = policyOptions(def)[sel.proposed] || {};
      var html = '';
      // Trade rungs carry their standing modifiers (import ×, tariff) outside the generic effects
      // list — surface the current rung and the proposed one so the change reads at a glance.
      if (isTradePolicy(def)) {
        var curOpt = policyOptions(def)[inForceIdx()] || {};
        html += effRow({ text: 'In force now · ' + tradeEffectText(curOpt), cls: '' }, 'now');
        html += effRow({ text: 'If enacted · ' + tradeEffectText(o), cls: '' }, 'while in force');
      }
      // Non-money standing effects only — ALL money (recurring, one-time and finite) is summarised
      // in the fiscal block above, so it reads as one figure instead of being split across sections.
      // Standing stat effects of the proposed rung (money is in the fiscal block; the two vote
      // popularity targets are now computed directionally below, not authored per level).
      var effs = (o.effects || []).filter(function (e) { return !isMoneyTarget(e.t) && (e.t || '').indexOf('Party Popularity') !== 0; });
      html += effs.map(function (e) { var t = effectText(e, pop, pros); return effRow(t, t.cad); }).join('');
      // Vote-popularity: computed from the direction + size of the proposed move (one source:
      // policies.js). Voting against is the mirror of voting for.
      var vp = policyVotePopularity(def, inForceIdx(), sel.proposed);
      if (vp.forVote !== 0) {
        html += effRow({ text: 'Party Popularity (if voting for) ' + (vp.forVote >= 0 ? '+' : '−') + Math.abs(vp.forVote), cls: vp.forVote > 0 ? 'pos' : 'neg' }, 'per vote');
        html += effRow({ text: 'Party Popularity (if voting against) ' + (vp.againstVote >= 0 ? '+' : '−') + Math.abs(vp.againstVote), cls: vp.againstVote > 0 ? 'pos' : 'neg' }, 'per vote');
      }
      effBox.innerHTML = html || '<p class="none">No standing effects beyond the budget.</p>';
      tagBox.innerHTML = (o.tags || []).map(function (t) { return '<span class="ltag">' + esc(t) + '</span>'; }).join('');
    }
    // The policy's implementation time — how long the change takes to take effect (def.impl
    // months; the runtime scales it by Bureaucracy later). A policy property, shown per choice.
    function renderImpl() {
      var box = document.getElementById('l-impl');
      if (sel.proposed == null) { box.innerHTML = '<p class="none">—</p>'; return; }
      var m = Number(curDef().impl);
      box.innerHTML = (isFinite(m) && m > 0)
        ? effRow({ text: m + ' month' + (m === 1 ? '' : 's'), cls: 'flat' }, 'to take effect')
        : '<p class="none">Takes effect immediately.</p>';
    }
    var transSeq = 0;
    // The one-time transition (doorway) cost of the move cur→to, from the server (ONE source:
    // _doorway_effects via the law_transition_preview RPC). Each doorway carries its own scale
    // (money targets can be per-million/×pop×prosperity), flat when absent — render with it so the
    // worked amount matches what enacts. A seq guard drops a stale response if the rung changed.
    function renderTransitionCost() {
      var box = document.getElementById('l-trans'), myseq = ++transSeq;
      if (sel.proposed == null) { box.innerHTML = '<p class="none">—</p>'; return; }
      var from = inForceIdx(), to = sel.proposed;
      box.innerHTML = '<p class="none">…</p>';
      supabase.rpc('law_transition_preview', { p_policy: curPolicy().id, p_from: from, p_to: to }).then(function (r) {
        if (myseq !== transSeq) return;
        var fx = (r && !r.error && Array.isArray(r.data)) ? r.data : [];
        // Consolidate by target (and scale, since unlike scales aren't summable) so a multi-rung
        // move shows one net line per stat — "Growth −4" — not every rung's step. Display only:
        // the server still applies each doorway effect individually (_doorway_effects). Net-zero
        // targets drop out (no net cost). Keep first-appearance order.
        var agg = [], pos = {};
        fx.forEach(function (e) {
          var scale = e.scale || 'flat', key = e.t + '|' + scale;
          if (pos[key] == null) { pos[key] = agg.length; agg.push({ t: e.t, v: 0, scale: scale }); }
          agg[pos[key]].v += (Number(e.v) || 0);
        });
        var rows = agg.filter(function (e) { return e.v !== 0; });
        box.innerHTML = rows.length
          ? rows.map(function (e) { return effRow(effectText({ t: e.t, v: e.v, scale: e.scale, cad: 'once' }, pop, pros), 'on change'); }).join('')
          : '<p class="none">No cost to change to this rung.</p>';
      }).catch(function () { if (myseq === transSeq) box.innerHTML = '<p class="none">Couldn’t load the cost — reselect to retry.</p>'; });
    }

    // Prefill the bill title + introductory article from the chosen move (unless the player
    // has typed their own — touched flags keep their edits).
    function autofill() {
      if (sel.proposed == null) return;
      var def = curDef(), opts = policyOptions(def), pname = def.name || 'this policy';
      var cur = opts[inForceIdx()], prop = opts[sel.proposed];
      if (!touched.title) titleInp.value = pname + ' (Amendment)';
      if (!touched.intro) introInp.value = 'An Act to amend the ' + pname + ', changing provision from ' +
        (cur && cur.name || 'the current rung') + ' to ' + (prop && prop.name || 'the proposed rung') + ', with effect from the next session.';
    }

    function paint() {
      var def = curDef(), o = sel.proposed == null ? null : policyOptions(def)[sel.proposed];
      var pv = document.getElementById('l-pv');
      pv.textContent = o ? ((def.name || 'Policy') + ' → ' + (o.name || ('Option ' + (sel.proposed + 1)))) : 'Choose a change';
      pv.classList.toggle('empty', !o);
      renderLadder(); renderFiscal(); renderEffects(); renderTransitionCost(); renderImpl();
      // One pending bill per policy: if this policy already has one on the floor/agenda, the
      // chamber won't take another until it resolves (the server enforces this too).
      var blocked = !!pendingPolicies[curPolicy().id];
      var ok = !noSeats && !blocked && sel.proposed != null && sel.proposed !== inForceIdx() && !lawBusy;
      floorBtn.disabled = !ok; agendaBtn.disabled = !ok;
      if (!lawBusy) note.textContent = noSeats ? 'Your party holds no legislature seats — win seats at an election before you can propose a bill.'
        : blocked ? 'A bill to change this policy is already before the chamber — it must resolve first.'
        : ok ? 'Ready to propose — choose how.' : 'Pick a rung to propose it.';
    }

    polSel.onchange = function () { sel.proposed = null; touched = { title: false, intro: false }; titleInp.value = ''; introInp.value = ''; paint(); };
    titleInp.oninput = function () { touched.title = true; };
    introInp.oninput = function () { touched.intro = true; };
    paint();

    function submit(toFloor) {
      var p = curPolicy(), idx = sel.proposed;
      if (lawBusy || idx == null || idx === inForceIdx()) return;  // guard mirrors paint()
      lawBusy = true; floorBtn.disabled = true; agendaBtn.disabled = true;
      note.textContent = toFloor ? 'Bringing it to the floor…' : 'Adding to the agenda…';
      proposeLaw(p.id, idx, toFloor, titleInp.value.trim(), introInp.value.trim())
        .then(function () { location.href = '/play/legislature/'; })
        .catch(function (e) { lawBusy = false; paint(); note.textContent = e.message || 'Couldn’t propose that.'; });
    }
    floorBtn.onclick = function () { submit(true); };
    agendaBtn.onclick = function () { submit(false); };
  }

  // ---- Declaration mode: pick a slot + name, then queue it or send to the floor ----
  var declBusy = false;
  async function renderDeclMode(currentValues, regime) {
    currentValues = currentValues || {};
    var monarchy = isMonarchy(regime);
    document.querySelector('.phead .eye').textContent = 'Legislature · Declaration';
    document.querySelector('.phead h1').textContent = 'Make a Declaration';
    document.querySelector('.phead p').textContent = 'A declaration sets a title, emblem, capital, or other name — no mechanical effect, but it still goes through the chamber.';
    var grid = document.getElementById('proposeGrid');
    var decls;
    try { decls = await fetchDeclarations(); }
    catch (e) { grid.innerHTML = '<section class="mod"><p class="muted">Couldn’t load the declarations. Refresh to try again.</p></section>'; return; }
    if (!decls.length) { grid.innerHTML = '<section class="mod"><p class="muted">No declarations have been defined yet — an admin sets these up first.</p></section>'; return; }

    grid.innerHTML =
      '<div><section class="mod"><div class="mod__hd"><span>Declaration</span><span class="hint">no mechanical effect — just a name</span></div>' +
        '<label class="lbl">What to declare</label><select id="d-slot" class="inp"></select>' +
        '<label class="lbl" style="margin-top:14px">Current</label><div id="d-current" class="curval">—</div>' +
        '<label class="lbl" style="margin-top:14px">New name</label><select id="d-opt" class="inp"></select>' +
        '<input id="d-custom" class="inp" type="text" placeholder="Type a custom name…" maxlength="80" style="margin-top:8px" hidden>' +
      '</section></div>' +
      '<div class="preview"><div class="pvlabel">Live Preview</div>' +
        '<div class="pvcard"><h3 id="d-pv" class="empty">Choose what to declare</h3></div>' +
        '<div class="proj"><div class="actions">' +
          '<button class="btn" id="d-floor" type="button" disabled>Send to the Floor Now <span class="ac">1 Influence</span></button>' +
          '<button class="btn" id="d-agenda" type="button" disabled>Add to Upcoming Agenda <span class="ac">Free</span></button>' +
          '<div class="proposed-note" id="d-note">Pick a name to propose it.</div>' +
        '</div></div></div>';

    var slotSel = document.getElementById('d-slot'), optSel = document.getElementById('d-opt'), customInp = document.getElementById('d-custom');
    var floorBtn = document.getElementById('d-floor'), agendaBtn = document.getElementById('d-agenda'), note = document.getElementById('d-note');
    slotSel.innerHTML = decls.map(function (d, i) { return '<option value="' + i + '">' + esc(d.label) + '</option>'; }).join('');

    function curDecl() { return decls[+slotSel.value] || decls[0]; }
    function curValue() { return optSel.value === '__custom__' ? customInp.value.trim() : optSel.value; }
    function fillOpts() {
      var d = curDecl();
      document.getElementById('d-current').textContent = declaredValue(d, currentValues);
      // Royal Head-of-State titles are greyed out unless the nation is a monarchy
      // (regime 21–25). Only the head_of_state_title slot has royal options to gate.
      var html = (d.options || []).map(function (o) {
        var royalLocked = d.slug === 'head_of_state_title' && !monarchy && ROYAL_TITLES.indexOf(String(o)) >= 0;
        var v = esc(String(o)).replace(/"/g, '&quot;');
        return '<option value="' + v + '"' + (royalLocked ? ' disabled' : '') + '>' +
               esc(String(o)) + (royalLocked ? ' (requires monarchy)' : '') + '</option>';
      }).join('');
      if (d.custom_allowed) html += '<option value="__custom__">Custom name…</option>';
      optSel.innerHTML = html;
      sync();
    }
    function sync() {
      customInp.hidden = !(curDecl().custom_allowed && optSel.value === '__custom__');
      var val = curValue(), pv = document.getElementById('d-pv');
      pv.textContent = val ? (curDecl().label + ' → ' + val) : 'Choose a name';
      pv.classList.toggle('empty', !val);
      // A name identical to the current one is a no-op (and would still cost an action
      // on the floor) — block it and say why.
      var same = !!val && val === declaredValue(curDecl(), currentValues);
      var ok = !!val && !same && !declBusy;
      floorBtn.disabled = !ok; agendaBtn.disabled = !ok;
      if (!declBusy) note.textContent = !val ? 'Pick a name to propose it.'
        : same ? ('That’s already the current ' + curDecl().label + '.')
        : 'Ready to propose — choose how.';
    }
    slotSel.onchange = fillOpts;
    optSel.onchange = sync;
    customInp.oninput = sync;
    fillOpts();

    function submit(toFloor) {
      var d = curDecl(), val = curValue();
      if (!val || declBusy || val === declaredValue(d, currentValues)) return;  // guard mirrors sync()
      declBusy = true; floorBtn.disabled = true; agendaBtn.disabled = true;
      note.textContent = toFloor ? 'Bringing it to the floor…' : 'Adding to the agenda…';
      proposeDeclaration(d.slug, val, toFloor)
        .then(function () { location.href = '/play/legislature/'; })
        .catch(function (e) { declBusy = false; sync(); note.textContent = e.message || 'Couldn’t propose that.'; });
    }
    floorBtn.onclick = function () { submit(true); };
    agendaBtn.onclick = function () { submit(false); };
  }

  // ---- Form-of-State mode: the monarchy special law. The one measure that crosses the
  // republic/monarchy line — proclaim a Constitutional Monarchy (republic ≤20 → 21) or
  // abolish it (Constitutional 21–23 → 20). Absolute monarchies (24–25) are crown/admin
  // territory, so the floor offers nothing there. ----
  var regimeBusy = false;
  function renderRegimeMode(regime) {
    document.querySelector('.phead .eye').textContent = 'Legislature · Form of State';
    document.querySelector('.phead h1').textContent = 'Change the Form of State';
    document.querySelector('.phead p').textContent = 'The crown is the one regime change the chamber itself can make — a republic may proclaim a constitutional monarchy, and a constitutional monarchy may abolish it. Everything else on the regime scale is set elsewhere.';
    var grid = document.getElementById('proposeGrid');
    var r = (regime == null || regime === '') ? 20 : Number(regime);
    if (isNaN(r)) r = 20;  // demo / legacy non-numeric regime → treat as a republic (server re-validates)
    // The single legal crossing from here (target value + framing), or null if none.
    var move = r <= 20 ? { target: 21, title: 'Proclaim a Constitutional Monarchy', desc: 'The head of state becomes a monarch. The crown is ceremonial — the chamber keeps its powers and the nation stays a multiparty democracy.' }
             : (r >= 21 && r <= 23) ? { target: 20, title: 'Abolish the Monarchy', desc: 'The crown is dissolved and the nation returns to a republic (Full Democracy).' }
             : null;  // Absolute monarchy (24–25) — no floor measure

    grid.innerHTML =
      '<div><section class="mod"><div class="mod__hd"><span>Form of State</span><span class="hint">a constitutional change</span></div>' +
        '<label class="lbl">Current regime</label><div class="curval">' + esc(regimeText(isNaN(Number(regime)) ? regime : r)) + '</div>' +
        '<label class="lbl" style="margin-top:14px">Proposed change</label><div class="curval">' + (move ? esc(move.title) : 'No change available') + '</div>' +
        (move ? '<p style="margin-top:12px;color:var(--muted);font-size:13px;line-height:1.5">' + esc(move.desc) + '</p>' : '') +
      '</section></div>' +
      '<div class="preview"><div class="pvlabel">Live Preview</div>' +
        '<div class="pvcard"><h3 id="r-pv"' + (move ? '' : ' class="empty"') + '>' + (move ? esc(move.title) : 'Nothing to propose') + '</h3></div>' +
        '<div class="proj"><div class="actions">' +
          '<button class="btn" id="r-floor" type="button"' + (move ? '' : ' disabled') + '>Send to the Floor Now <span class="ac">1 Influence</span></button>' +
          '<button class="btn" id="r-agenda" type="button"' + (move ? '' : ' disabled') + '>Add to Upcoming Agenda <span class="ac">Free</span></button>' +
          '<div class="proposed-note" id="r-note">' +
            (move ? 'A simple majority of the chamber carries it.'
                  : (r >= 24 ? 'An absolute monarchy’s form of state rests with the crown, not the floor.'
                             : 'There is no form-of-state change available here.')) +
          '</div>' +
        '</div></div></div>';

    if (!move) return;
    var floorBtn = document.getElementById('r-floor'), agendaBtn = document.getElementById('r-agenda'), note = document.getElementById('r-note');
    function submit(toFloor) {
      if (regimeBusy) return;
      regimeBusy = true; floorBtn.disabled = true; agendaBtn.disabled = true;
      note.textContent = toFloor ? 'Bringing it to the floor…' : 'Adding to the agenda…';
      proposeRegimeChange(move.target, toFloor)
        .then(function () { location.href = '/play/legislature/'; })
        .catch(function (e) { regimeBusy = false; floorBtn.disabled = false; agendaBtn.disabled = false; note.textContent = e.message || 'Couldn’t propose that.'; });
    }
    floorBtn.onclick = function () { submit(true); };
    agendaBtn.onclick = function () { submit(false); };
  }

  // ---- Electoral Threshold mode: pick the minimum vote share a party must clear to win any
  // seats (0/3/5/8/10/15%). Raising the bar weakens the democracy — a 5–10% floor costs one
  // rank of regime, 15% costs two; the preview shows the move's regime cost before proposing.
  // The penalty here is a display MIRROR of _apply_threshold (schema/106 stays authoritative).
  var THRESH_OPTS = [0, 3, 5, 8, 10, 15];
  function thrPenalty(p) { return p >= 15 ? 2 : p >= 5 ? 1 : 0; }
  var thrBusy = false;
  function renderThresholdMode(nation) {
    var cur = Number((nation && nation.electoral_threshold) || 0);
    document.querySelector('.phead .eye').textContent = 'Legislature · Electoral Threshold';
    document.querySelector('.phead h1').textContent = 'Set the Electoral Threshold';
    document.querySelector('.phead p').textContent = 'The minimum share of the vote a party must win to take any seats. Parties below it are shut out and their seats fall to those who cleared the bar. Raising it weakens the democracy — a 5–10% floor costs one rank of regime, 15% costs two.';
    var grid = document.getElementById('proposeGrid');
    grid.innerHTML =
      '<div><section class="mod"><div class="mod__hd"><span>Electoral Threshold</span><span class="hint">a constitutional change</span></div>' +
        '<label class="lbl">In force now</label><div class="curval">' + cur + '%</div>' +
        '<label class="lbl" style="margin-top:14px">Proposed threshold <span class="hint" style="text-transform:none;letter-spacing:0">— pick a bar</span></label><div id="t-ladder" class="ladder"></div>' +
      '</section></div>' +
      '<div class="preview"><div class="pvlabel">Live Preview</div>' +
        '<div class="pvcard"><h3 id="t-pv" class="empty">Choose a threshold</h3>' +
          '<div class="pvarts"><div class="ac">Effect if enacted</div><div id="t-effs"><p class="none">—</p></div></div></div>' +
        '<div class="proj"><div class="actions">' +
          '<button class="btn" id="t-floor" type="button" disabled>Send to the Floor Now <span class="ac">1 Influence</span></button>' +
          '<button class="btn" id="t-agenda" type="button" disabled>Add to Upcoming Agenda <span class="ac">Free</span></button>' +
          '<div class="proposed-note" id="t-note">Pick a threshold to propose it.</div>' +
        '</div></div></div>';

    var floorBtn = document.getElementById('t-floor'), agendaBtn = document.getElementById('t-agenda'), note = document.getElementById('t-note');
    var sel = { pct: null };
    function renderLadder() {
      var lad = document.getElementById('t-ladder');
      lad.innerHTML = THRESH_OPTS.map(function (p) {
        var isCur = p === cur, isProp = p === sel.pct, pen = thrPenalty(p);
        var meta = p === 0 ? 'no threshold' : (pen ? '−' + pen + ' regime' : 'no regime cost');
        var badge = isCur ? '<span class="rbadge cur">In force</span>' : isProp ? '<span class="rbadge prop">Proposed</span>' : '';
        return '<button type="button" class="rung' + (isCur ? ' current' : '') + (isProp ? ' proposed' : '') + '" data-p="' + p + '"' + (isCur ? ' disabled' : '') + '>' +
          '<span><span class="rn">' + p + '%</span><span class="rmeta">' + meta + '</span></span>' + badge + '</button>';
      }).join('');
      lad.querySelectorAll('.rung').forEach(function (btn) {
        btn.onclick = function () { var p = +btn.dataset.p; if (p === cur) return; sel.pct = p; paint(); };
      });
    }
    function paint() {
      renderLadder();
      var pv = document.getElementById('t-pv'), effs = document.getElementById('t-effs');
      if (sel.pct == null) {
        pv.textContent = 'Choose a threshold'; pv.classList.add('empty'); effs.innerHTML = '<p class="none">—</p>';
      } else {
        pv.textContent = 'Electoral Threshold → ' + sel.pct + '%'; pv.classList.remove('empty');
        var delta = thrPenalty(cur) - thrPenalty(sel.pct);   // < 0 when the bar rises (regime falls)
        var rows = ['<div class="eff"><b>' + (sel.pct === 0 ? 'No threshold — every party keeps the seats it wins' : 'Parties under ' + sel.pct + '% win no seats') + '</b><span class="cad">on election</span></div>'];
        if (delta < 0) rows.push('<div class="eff neg"><b>Regime ' + delta + ' — the democracy weakens</b><span class="cad">on enactment</span></div>');
        else if (delta > 0) rows.push('<div class="eff pos"><b>Regime +' + delta + ' — the democracy strengthens</b><span class="cad">on enactment</span></div>');
        else rows.push('<div class="eff"><b>No change to regime</b><span class="cad">on enactment</span></div>');
        effs.innerHTML = rows.join('');
      }
      var ok = sel.pct != null && sel.pct !== cur && !thrBusy;
      floorBtn.disabled = !ok; agendaBtn.disabled = !ok;
      if (!thrBusy) note.textContent = sel.pct == null ? 'Pick a threshold to propose it.' : ok ? 'Ready to propose — choose how.' : 'That’s already the threshold in force.';
    }
    paint();

    function submit(toFloor) {
      if (thrBusy || sel.pct == null || sel.pct === cur) return;
      thrBusy = true; floorBtn.disabled = true; agendaBtn.disabled = true;
      note.textContent = toFloor ? 'Bringing it to the floor…' : 'Adding to the agenda…';
      proposeThreshold(sel.pct, toFloor)
        .then(function () { location.href = '/play/legislature/'; })
        .catch(function (e) { thrBusy = false; paint(); note.textContent = e.message || 'Couldn’t propose that.'; });
    }
    floorBtn.onclick = function () { submit(true); };
    agendaBtn.onclick = function () { submit(false); };
  }

  (async () => {
    if (!isConfigured) { if (isRegime) renderRegimeMode(null); else if (isThreshold) renderThresholdMode({}); else if (isDecl) renderDeclMode({}, null); else renderLawMode({}, {}); return; }
    const user = await requireUser();
    if (!user) return; // redirected to login
    var party = null, nation = null;
    try {
      ({ data: party } = await supabase.from('parties').select('name, archetype, nation_id, influence, seats').eq('user_id', user.id).single());
      if (!party) { window.location.replace('/nation-select/'); return; }
      ({ data: nation } = await supabase.from('nations').select('name, flag, economy, declarations, policies, population, stats, electoral_threshold').eq('id', party.nation_id).single());
      const nationName = (nation && nation.name) || party.nation_id;

      document.getElementById('pname').textContent = party.name;
      document.getElementById('psub').textContent = ideologyLabel(party) + ' · ' + nationName;
      if (nation && nation.flag) { var f = document.getElementById('flag'); f.onload = function(){ f.hidden = false; }; f.src = nation.flag; }

      var currency = (nation && nation.economy && nation.economy.currency) || '$';
      setTopbarActions(party.influence);
    } catch (e) { /* chrome is best-effort; the picker below still loads */ }
    // Each mode renders here so it can show the nation's CURRENT value/option.
    var regime = nation && nation.economy && nation.economy.regime;
    if (isRegime) renderRegimeMode(regime);
    else if (isThreshold) renderThresholdMode(nation || {});
    else if (isDecl) renderDeclMode((nation && nation.declarations) || {}, regime);
    else {
      // Policies that already have a bill on the floor/agenda — the ladder greys out proposing
      // for them (the server enforces one pending bill per policy regardless). Non-fatal.
      var pendingPolicies = {};
      try {
        (await fetchProposals(party.nation_id)).forEach(function (p) {
          if (p.kind === 'law' && (p.status === 'voting' || p.status === 'agenda') && p.payload && p.payload.policy_id) pendingPolicies[p.payload.policy_id] = true;
        });
      } catch (e) { /* leave empty → server still blocks a duplicate */ }
      renderLawMode((nation && nation.policies) || {}, nation || {}, pendingPolicies, (party && party.seats) || 0);
    }
  })();
</script>
</body>
</html>
