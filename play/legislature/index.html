<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legislature · Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAF8;--surface:#FFFFFF;--ink:#15151B;--muted:#5b5b63;--soft:#8d8d95;
    --line:#E7E5E0;--line2:#D9D6D0;--chip:#F4F3EF;--field:#FCFBF9;
    --indigo:#5546E8;--indigo-soft:#ECE9FD;
    --red:#C42B2B;--red-soft:#FBEAE9;--amber:#E0820E;--amber-soft:#FBF0DD;--green:#16915a;--green-soft:#E5F4EC;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .app{display:flex;min-height:100vh}

  .side{width:236px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
  .brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
  .brand__flag{width:42px;height:26px;object-fit:cover;border:1px solid var(--line);border-radius:4px;flex:none}
  .brand__txt{display:flex;flex-direction:column;line-height:1.25;overflow:hidden}
  .brand__txt b{font-weight:800;font-size:14px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand__txt span{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav__i{display:flex;align-items:center;gap:13px;padding:10px 12px;border-radius:9px;color:var(--muted);text-decoration:none;cursor:pointer;border:1px solid transparent}
  .nav__i svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .nav__i .label{font-family:'Space Mono',monospace;font-size:12.5px;letter-spacing:.04em}
  .nav__i:hover{color:var(--ink);background:var(--chip)}
  .nav__i.active{color:var(--indigo);background:var(--indigo-soft);font-weight:700}
  .nav__i.active svg{color:var(--indigo)}
  .side__foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}
  .me{display:flex;align-items:center;gap:10px;padding:8px 10px;color:var(--muted);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em}
  .me b{color:var(--ink);font-weight:700}
  .me__dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none}
  .logout{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;background:none;border:none;cursor:pointer;color:var(--soft);font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.06em;text-align:left;transition:color .15s}
  .logout:hover{color:var(--red)}
  .logout svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  .main{flex:1;padding:24px clamp(16px,3vw,38px) 56px;min-width:0;max-width:1080px}
  .phead .eye{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--indigo)}
  .phead h1{font-weight:900;font-size:clamp(24px,3.6vw,32px);letter-spacing:-.03em;margin-top:4px}
  .phead p{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:620px}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
  .panel h2{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:14px}
  .empty{text-align:center;padding:40px 20px;color:var(--soft)}
  .empty b{display:block;color:var(--muted);font-size:16px;margin-bottom:5px}
  .empty span{display:block;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.03em;color:var(--soft);margin-top:6px}
  .muted{color:var(--soft);font-size:13px;font-style:italic}

  /* assembly summary */
  .summary{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 4px}
  .scell{flex:1;min-width:124px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
  .scell .k{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
  .scell .v{font-weight:900;font-size:22px;letter-spacing:-.02em;margin-top:3px}
  .scell .v.ind{color:var(--indigo)}

  /* two-column body: floor/agenda + history rail */
  .legcols{display:grid;grid-template-columns:1fr 300px;gap:18px;margin-top:14px;align-items:start}
  @media(max-width:920px){.legcols{grid-template-columns:1fr}}
  .secthd{display:flex;align-items:center;gap:10px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);font-weight:700;margin:8px 0 10px}
  .secthd:not(:first-child){margin-top:24px}
  .secthd .ct{background:var(--chip);color:var(--muted);border-radius:20px;padding:2px 9px;font-size:10px;font-weight:700}
  .propose{margin-left:auto;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;padding:8px 14px;border-radius:9px;border:1px solid var(--indigo);background:var(--indigo);color:#fff;cursor:pointer}
  .propose:disabled{opacity:.45;cursor:not-allowed}

  @media(max-width:820px){.side{width:62px;padding:16px 8px}.nav__i .label,.brand__txt,.me .label,.logout .label{display:none}.logout{justify-content:center}.brand{justify-content:center;padding:6px 0 14px}.brand__flag{width:38px;height:24px}.nav__i{justify-content:center;padding:11px 0}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <img class="brand__flag" id="flag" alt="Nation flag" hidden>
      <div class="brand__txt"><b id="sname">…</b><span id="psub"></span></div>
    </div>
    <nav class="nav">
      <a class="nav__i" href="/play/"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v9h14v-9"/></svg><span class="label">Home</span></a>
      <a class="nav__i" href="/play/party/"><svg viewBox="0 0 24 24"><path d="M5 3v18"/><path d="M5 4h12l-2 4 2 4H5"/></svg><span class="label">Party</span></a>
      <a class="nav__i" href="/play/elections/"><svg viewBox="0 0 24 24"><path d="M4 7h16v13H4z"/><path d="M8 7V4h8v3"/><path d="M8.5 13l2 2 4-4"/></svg><span class="label">Elections</span></a>
      <a class="nav__i" href="/play/government/"><svg viewBox="0 0 24 24"><path d="M3 9l9-5 9 5"/><path d="M3 9h18M4 20h16"/><path d="M6 20v-9M10 20v-9M14 20v-9M18 20v-9"/></svg><span class="label">Government</span></a>
      <a class="nav__i active" href="/play/legislature/"><svg viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M5 21V10M9 21V10M15 21V10M19 21V10"/><path d="M12 3l9 5H3z"/></svg><span class="label">Legislature</span></a>
      <a class="nav__i"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4-3 7-7 8-4-1-7-4-7-8V6l7-3z"/></svg><span class="label">Nation</span></a>
      <a class="nav__i"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span class="label">World</span></a>
      <a class="nav__i"><svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M6 20v-6M10 20v-10M14 20v-7M18 20v-12"/></svg><span class="label">Market</span></a>
      <a class="nav__i"><svg viewBox="0 0 24 24"><path d="M17 4l3 3-9 9-3-3z"/><path d="M7 4L4 7l9 9 3-3"/><path d="M5 16l-1 4 4-1M19 16l1 4-4-1"/></svg><span class="label">Conflict</span></a>
      <a class="nav__i"><svg viewBox="0 0 24 24"><path d="M4 5h12v8H8l-4 3z"/><path d="M18 9h2v9l-3-2h-5"/></svg><span class="label">Forum</span></a>
      <a class="nav__i"><svg viewBox="0 0 24 24"><path d="M12 5v15"/><path d="M4 4h6a2 2 0 012 2 2 2 0 012-2h6v13h-6a2 2 0 00-2 2 2 2 0 00-2-2H4z"/></svg><span class="label">Wiki</span></a>
    </nav>
    <div class="side__foot">
      <div class="me"><span class="me__dot"></span><span class="label">Leader · <b>You</b></span></div>
      <button class="logout" id="logout" type="button"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span class="label">Logout</span></button>
    </div>
  </aside>

  <main class="main">
    <div class="phead">
      <span class="eye">The Legislature</span>
      <h1 id="lhead">The National Assembly</h1>
      <p>The chamber where bills are proposed, debated, and voted into law.</p>
    </div>
    <div id="content"><div class="panel"><div class="empty">Loading the Legislature…</div></div></div>
  </main>
</div>

<script type="module">
  import { supabase, isConfigured, requireUser, logout, currentTick } from '/supabase.js';
  import { esc, majority, tickToDate } from '/util.js';

  document.getElementById('logout').addEventListener('click', logout);

  function fail(msg){ document.getElementById('content').innerHTML = '<div class="panel"><div class="empty">' + msg + '</div></div>'; }

  // The assembly snapshot (real seats) + empty scaffolds. Bills/voting aren't in
  // play yet, so On the Floor / Upcoming Agenda / Legislative History are empty.
  function render(session, nation, parties){
    var total = nation.legislature_seats || 0;
    var maj = majority(total);
    var govBloc = parties.filter(function(p){ return p.in_government; }).reduce(function(s,p){ return s + (p.seats||0); }, 0);

    document.getElementById('content').innerHTML =
      '<div class="summary">' +
        '<div class="scell"><div class="k">Session</div><div class="v">' + esc(session) + '</div></div>' +
        '<div class="scell"><div class="k">Seats</div><div class="v">' + total + '</div></div>' +
        '<div class="scell"><div class="k">Majority needed</div><div class="v">' + maj + '</div></div>' +
        '<div class="scell"><div class="k">Government bloc</div><div class="v ind">' + govBloc + (total && govBloc >= maj ? ' ✓' : '') + '</div></div>' +
      '</div>' +
      '<div class="legcols">' +
        '<div class="legmain">' +
          '<div class="secthd">On the Floor <span class="ct">0</span>' +
            '<button class="propose" type="button" disabled title="Bills aren’t in play yet">Propose New Law</button></div>' +
          '<div class="panel"><div class="empty"><b>No bills are on the floor</b><span>Proposing and voting on bills isn’t in play yet.</span></div></div>' +
          '<div class="secthd">Upcoming Agenda <span class="ct">0</span></div>' +
          '<div class="panel"><div class="empty"><b>Nothing on the agenda</b><span>Scheduled bills will appear here.</span></div></div>' +
        '</div>' +
        '<aside class="legrail">' +
          '<section class="panel"><h2>Legislative History</h2>' +
            '<p class="muted">No bills have been resolved yet.</p></section>' +
        '</aside>' +
      '</div>';
  }

  (async () => {
    if (!isConfigured) { fail('Supabase isn’t configured.'); return; }
    const user = await requireUser();
    if (!user) return; // redirected to login
    try {
      const { data: party } = await supabase.from('parties').select('id, nation_id, name, archetype').eq('user_id', user.id).single();
      if (!party) { window.location.replace('/nation-select/'); return; }
      const { data: nation } = await supabase.from('nations').select('name, flag, legislature_seats').eq('id', party.nation_id).single();
      const { data: parties } = await supabase.from('parties').select('seats, in_government').eq('nation_id', party.nation_id);
      const nationName = (nation && nation.name) || party.nation_id;

      document.getElementById('sname').textContent = party.name;
      document.getElementById('psub').textContent = party.archetype + ' · ' + nationName;
      document.getElementById('lhead').textContent = 'National Assembly of ' + nationName;
      if (nation && nation.flag) { var f = document.getElementById('flag'); f.onload = function(){ f.hidden = false; }; f.src = nation.flag; }

      const session = tickToDate(await currentTick());
      render(session, nation || {}, parties || []);
    } catch (e) {
      fail('Couldn’t load the Legislature right now. Refresh to try again.');
    }
  })();
</script>
</body>
</html>
