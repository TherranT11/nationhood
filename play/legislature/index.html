<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/theme.js"></script>
<title>Legislature · Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAF8;--surface:#FFFFFF;--ink:#15151B;--muted:#5b5b63;--soft:#8d8d95;
    --line:#E7E5E0;--line2:#D9D6D0;--chip:#F4F3EF;--field:#FCFBF9;
    --indigo:#5546E8;--indigo-soft:#ECE9FD;
    --red:#C42B2B;--red-soft:#FBEAE9;--amber:#E0820E;--amber-soft:#FBF0DD;--green:#16915a;--green-soft:#E5F4EC;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .app{display:flex;min-height:100vh}

  /* Left navigation (desktop rail + mobile bottom bar) lives in /sidenav.js */

  .main{flex:1;padding:24px clamp(16px,4vw,56px) 56px;min-width:0}
  .phead .eye{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--indigo)}
  .phead h1{font-weight:900;font-size:clamp(24px,3.6vw,32px);letter-spacing:-.03em;margin-top:4px}
  .phead p{color:var(--muted);font-size:13.5px;margin-top:5px;max-width:620px}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
  .panel h2{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-bottom:14px}
  .empty{text-align:center;padding:40px 20px;color:var(--soft)}
  .empty b{display:block;color:var(--muted);font-size:16px;margin-bottom:5px}
  .empty span{display:block;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.03em;color:var(--soft);margin-top:6px}
  .muted{color:var(--soft);font-size:13px;font-style:italic}

  /* assembly summary */
  .summary{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 4px}
  .scell{flex:1;min-width:124px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
  .scell .k{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft)}
  .scell .v{font-weight:900;font-size:22px;letter-spacing:-.02em;margin-top:3px}
  .scell .v.ind{color:var(--indigo)}

  /* two-column body: floor/agenda + history rail */
  .legcols{display:grid;grid-template-columns:1fr 300px;gap:18px;margin-top:14px;align-items:start}
  @media(max-width:920px){.legcols{grid-template-columns:1fr}}
  .secthd{display:flex;align-items:center;gap:10px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);font-weight:700;margin:8px 0 10px}
  .secthd:not(:first-child){margin-top:24px}
  .secthd .ct{background:var(--chip);color:var(--muted);border-radius:20px;padding:2px 9px;font-size:10px;font-weight:700}
  .propose{margin-left:auto;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;padding:8px 14px;border-radius:9px;border:1px solid var(--indigo);background:var(--indigo);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
  .propose:hover{filter:brightness(1.06)}

  /* a measure on the floor / agenda */
  .measure{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:10px}
  .measure__hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .measure__t{font-weight:800;font-size:15px;letter-spacing:-.01em}
  .measure__by{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);white-space:nowrap}
  .measure__intro{font-size:12.5px;font-style:italic;color:var(--muted);line-height:1.5;margin-top:6px}
  /* A law measure's Current Law → Proposed Change. */
  .lawchg{margin:11px 0 3px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .lawchg__row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px}
  .lawchg__row + .lawchg__row{border-top:1px solid var(--line)}
  .lawchg__k{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);white-space:nowrap}
  .lawchg__v{font-weight:700;font-size:14px;color:var(--ink);text-align:right}
  .lawchg__v.hl{color:var(--indigo)}
  .votebar{display:flex;height:9px;border-radius:6px;overflow:hidden;background:var(--chip);margin:11px 0 7px}
  .votebar .va{background:var(--green)}.votebar .vn{background:var(--red)}
  .votenums{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
  .votenums b{color:var(--ink)}
  /* live resolution readout under the bar */
  .reso{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.02em;margin:9px 0 2px;font-weight:700}
  .reso.pass{color:var(--green)}.reso.fail{color:var(--red)}
  /* per-party roll call */
  .rolltitle{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:13px 0 4px;border-top:1px solid var(--line);padding-top:12px}
  .roll{display:flex;flex-direction:column}
  .rollr,.rollhd{display:grid;grid-template-columns:1fr auto 58px;gap:10px;align-items:center}
  .rollhd{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);padding:2px 0 4px}
  .rollhd span:nth-child(2){text-align:right}.rollhd span:nth-child(3){text-align:center}
  .rollr{border-top:1px solid var(--line);padding:6px 0}
  .rollr .pn{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px;min-width:0}
  /* The owner's OOC nickname shown after a party name — "Centrist Union (Theo)". */
  .pnick{font-weight:600;color:var(--soft)}
  .rollr .ru{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.05em;text-transform:uppercase;background:var(--indigo-soft);color:var(--indigo);padding:1px 6px;border-radius:20px;font-weight:700;flex:none}
  .rollr .ps{font-family:'Space Mono',monospace;font-size:11.5px;color:var(--muted);text-align:right}
  .rollr .pv{font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;padding:3px 0;border-radius:20px;text-align:center}
  .pv.aye{background:var(--green-soft);color:var(--green)}.pv.nay{background:var(--red-soft);color:var(--red)}.pv.none{background:var(--chip);color:var(--soft)}
  .mrow{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
  .vb{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;font-weight:700;padding:9px 16px;border-radius:9px;cursor:pointer;border:1.5px solid var(--line2);background:var(--surface);color:var(--ink)}
  .vb.aye.on{background:var(--green-soft);border-color:var(--green);color:var(--green)}
  .vb.nay.on{background:var(--red-soft);border-color:var(--red);color:var(--red)}
  .vb:disabled{opacity:.55;cursor:not-allowed}
  .vb:not(:disabled):hover{border-color:var(--ink)}
  .youvote{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);margin-left:2px}
  .agwhen{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-top:9px}
  .agwhen b{color:var(--ink);font-weight:700}
  .sendfloor{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;padding:9px 14px;border-radius:9px;border:1.5px solid var(--indigo);background:var(--indigo);color:#fff;cursor:pointer}
  .sendfloor:hover{filter:brightness(1.06)}.sendfloor:disabled{opacity:.55;cursor:not-allowed;filter:none}
  .histrow{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .histrow:last-child{border-bottom:none}
  .histrow__top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .histrow__d{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.03em;text-transform:uppercase;color:var(--soft);margin-top:3px}
  .histrow .pf{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;flex:none}
  .pf.passed{color:var(--green)}.pf.failed{color:var(--red)}

  /* ---- expanded "full bill" view (law measures only) ---- */
  .billtoggle{margin-top:12px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;color:var(--indigo);background:none;border:none;cursor:pointer;padding:2px 0}
  .billtoggle:hover{text-decoration:underline}
  .measure.open{border-color:var(--line2)}
  .billmeta{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin:6px 0 2px}
  .billsec{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .billsec__h{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-bottom:11px;display:flex;align-items:center;gap:8px}
  .billsec__by{margin-left:auto;text-transform:none;letter-spacing:.02em;color:var(--muted)}
  .billart{font-size:13.5px;line-height:1.7;color:var(--muted)}
  .billart p{margin-bottom:10px}.billart p:last-child{margin-bottom:0}
  /* policy spectrum: every rung, with Now / Proposed pins */
  .spectrum{margin-top:13px}
  .spec-track{display:flex;gap:3px}
  .spec-seg{flex:1;min-height:34px;border:1px solid var(--line);border-radius:5px;background:var(--field);display:flex;align-items:center;justify-content:center;text-align:center;font-size:8.5px;line-height:1.15;color:var(--soft);padding:6px 2px 2px;position:relative}
  .spec-seg.cur{border-color:var(--ink);color:var(--ink);background:var(--chip)}
  .spec-seg.prop{border-color:var(--indigo);color:var(--indigo);background:var(--indigo-soft)}
  .spec-pin{position:absolute;top:-7px;font-family:'Space Mono',monospace;font-size:7px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--surface);padding:0 4px}
  .spec-seg.cur .spec-pin{color:var(--ink)}.spec-seg.prop .spec-pin{color:var(--indigo)}
  .spec-dir{font-family:'Space Mono',monospace;font-size:9.5px;color:var(--muted);text-align:center;margin-top:9px}
  /* projected impact: fiscal + effects, two columns */
  .impact{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:560px){.impact{grid-template-columns:1fr}}
  .impact__k{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-bottom:6px}
  .irow,.effrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .irow:last-child,.effrow:last-child{border-bottom:none}
  .irow.net{border-top:1px solid var(--line2);border-bottom:none;margin-top:2px;padding-top:10px}
  .irow.net .ik{color:var(--ink);font-weight:700}
  .ik,.ek{font-size:12.5px;color:var(--muted)}
  .ik small{color:var(--soft);font-size:11px}
  .iv{font-family:'Space Mono',monospace;font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:5px}
  .iv .arw{font-size:10px}
  .up{color:var(--green)}.dn{color:var(--red)}.flat{color:var(--soft)}
  .ecad{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}
  .inone{color:var(--soft);font-style:italic;font-size:12.5px;padding:8px 0}
  .btags{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .btag{font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--amber);background:var(--amber-soft);border:1px solid #e8cfa3;border-radius:6px;padding:4px 8px}

  /* propose modal */
  .modal{position:fixed;inset:0;background:rgba(12,12,18,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
  .modal[hidden]{display:none}
  .modal__card{background:var(--surface);border:1px solid var(--line);border-radius:16px;max-width:440px;width:100%;padding:22px 24px}
  .modal__hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .modal__hd b{font-weight:900;font-size:19px;letter-spacing:-.01em}
  .modal__x{background:none;border:none;font-size:22px;line-height:1;color:var(--soft);cursor:pointer}
  .modal__x:hover{color:var(--ink)}
  .modal__sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .choice{display:block;width:100%;text-align:left;border:1px solid var(--line2);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:var(--field);cursor:pointer}
  .choice:hover{border-color:var(--ink)}
  .choice b{font-weight:800;font-size:15px;display:block}
  .choice span{color:var(--muted);font-size:12.5px;display:block;margin-top:3px}

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div id="sidenav"></div><!-- left rail / mobile bottom bar, injected by /sidenav.js -->

  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="phead">
      <span class="eye">The Legislature</span>
      <h1 id="lhead">The National Assembly</h1>
      <p>The chamber where bills are proposed, debated, and voted into law.</p>
    </div>
    <div id="content"><div class="panel"><div class="empty">Loading the Legislature…</div></div></div>
  </main>
</div>

<div class="modal" id="proposeModal" hidden>
  <div class="modal__card">
    <div class="modal__hd"><b>Propose New Law</b><button class="modal__x" id="pmX" type="button" aria-label="Close">&times;</button></div>
    <p class="modal__sub">What kind of measure are you bringing to the chamber?</p>
    <button class="choice" id="pmLaw" type="button"><b>Law</b><span>A new law has effects across the nation — it moves stats and other things.</span></button>
    <button class="choice" id="pmDecl" type="button"><b>Declaration</b><span>A declaration changes the name of a title, emblem, capital, etc. It has no mechanical effect in game.</span></button>
    <button class="choice" id="pmRegime" type="button"><b>Form of State</b><span>Proclaim or abolish a constitutional monarchy — the one measure that can cross between a republic and a crown.</span></button>
    <button class="choice" id="pmThreshold" type="button"><b>Electoral Threshold</b><span>Set the minimum vote share a party must clear to win any seats. Raising the bar weakens the democracy.</span></button>
  </div>
</div>

<script type="module">
  import { supabase, isConfigured, requireUser, currentTick } from '/supabase.js';
  import { esc, majority, tickToDate } from '/util.js';
  import { mountTopbar, setTopbarActions, setTopbarFunds } from '/topbar.js';
  import { mountSidenav } from '/sidenav.js';
  import { fetchProposals, fetchVotes, proposalToFloor, castVote, tallyVotes, fetchPolicies } from '/proposals.js';
  import { ideologyLabel } from '/archetypes.js';
  import { policyOptions, policyOptionIdx, effectText, fiscalFactor, fiscalDelta } from '/policies.js';

  mountTopbar(); // shared top bar (Discord/funds/actions/date/gear) into #topbar
  mountSidenav();  // left rail (desktop) / bottom bar (mobile) into #sidenav; active item from the URL

  // Propose New Law → Law / Declaration choice, then route to the propose page.
  var modal = document.getElementById('proposeModal');
  document.getElementById('pmX').onclick = function () { modal.hidden = true; };
  modal.addEventListener('click', function (e) { if (e.target === modal) modal.hidden = true; });
  document.getElementById('pmLaw').onclick = function () { location.href = '/play/legislature/propose/'; };
  document.getElementById('pmDecl').onclick = function () { location.href = '/play/legislature/propose/?type=declaration'; };
  document.getElementById('pmRegime').onclick = function () { location.href = '/play/legislature/propose/?type=regime'; };
  document.getElementById('pmThreshold').onclick = function () { location.href = '/play/legislature/propose/?type=threshold'; };

  function fail(msg){ document.getElementById('content').innerHTML = '<div class="panel"><div class="empty">' + msg + '</div></div>'; }

  var FLOOR_WINDOW = 6;  // ticks a measure stands on the floor before failing — mirrors advance_tick (schema/60)
  var ST = { party:null, session:'', tick:0, total:0, maj:0, govBloc:0, seatsByParty:{}, partyName:{}, partyHandle:{}, proposals:[], votes:[], policyDefs:{}, nationPolicies:{}, pop:0, pros:10, billNo:{}, openBill:null, busy:false };
  // Owner OOC nickname after a party name — "Centrist Union (Theo)". One source for the suffix.
  function nickSuffix(pid){ var h = ST.partyHandle[pid]; return h ? ' <span class="pnick">(' + esc(h) + ')</span>' : ''; }

  function tallyOf(pid){
    var vs = ST.votes.filter(function(v){ return v.proposal_id === pid; });
    var t = tallyVotes(vs, ST.seatsByParty);
    var mine = vs.filter(function(v){ return v.party_id === ST.party.id; })[0];
    return { aye:t.aye, nay:t.nay, myVote: mine ? (mine.aye ? 'aye' : 'nay') : null };
  }
  function ticksLeft(p){
    if (p.opened_tick == null) return '';
    var rem = FLOOR_WINDOW - (ST.tick - p.opened_tick);
    return rem > 0 ? ' · ' + rem + ' tick' + (rem === 1 ? '' : 's') + ' left' : ' · resolves next tick';
  }
  // Per-party roll call: who voted, their seats (= their voting weight), how they
  // voted or that they're yet to. Parties with no seats are shown only once voted.
  function rollCall(pid){
    var by = {}; ST.votes.forEach(function (v) { if (v.proposal_id === pid) by[v.party_id] = v.aye; });
    var ids = Object.keys(ST.partyName)
      .filter(function (id) { return (ST.seatsByParty[id] || 0) > 0 || by[id] !== undefined; })
      .sort(function (a, b) { return (ST.seatsByParty[b] || 0) - (ST.seatsByParty[a] || 0); });
    if (!ids.length) return '';
    return '<div class="roll"><div class="rollhd"><span>Party</span><span>Seats</span><span>Vote</span></div>' +
      ids.map(function (id) {
        var v = by[id], cls = v === undefined ? 'none' : v ? 'aye' : 'nay', lbl = v === undefined ? 'Awaiting' : v ? 'Aye' : 'Nay';
        var seats = ST.seatsByParty[id] || 0, you = id === ST.party.id ? '<span class="ru">You</span>' : '';
        return '<div class="rollr"><span class="pn">' + esc(ST.partyName[id]) + nickSuffix(id) + you + '</span>' +
          '<span class="ps">' + seats + '</span><span class="pv ' + cls + '">' + lbl + '</span></div>';
      }).join('') + '</div>';
  }
  function mhead(p){
    // The proposal's title is the bill heading — the authored bill name for a law (or its
    // "Policy → Option" fallback), the "Slot → Value" for a declaration. The Current/Proposed
    // rows show below via lawChange().
    return '<div class="measure__hd"><span class="measure__t">' + esc(p.title) + '</span><span class="measure__by">by ' + esc(ST.partyName[p.party_id] || 'a party') + nickSuffix(p.party_id) + '</span></div>';
  }
  // A law bill's introductory article ("An Act to…"), authored on the propose page — shown as a
  // preamble under the heading when present.
  function introLine(p){
    var intro = p.kind === 'law' && p.payload && p.payload.intro;
    return intro ? '<div class="measure__intro">' + esc(intro) + '</div>' : '';
  }
  // For a law measure: the option currently in force (Current Law) vs the one it would
  // switch to (Proposed Change). Current is read the same way the server reads it
  // (policyOptionIdx mirrors _nation_policy_option); the proposed name rides in the payload.
  function lawChange(p){
    if (p.kind !== 'law' || !p.payload) return '';
    var def = ST.policyDefs[p.payload.policy_id];
    var proposed = p.payload.option_name || (def && (policyOptions(def)[p.payload.option_idx] || {}).name) || '—';
    var current = '—';
    if (def) { var ci = policyOptionIdx(def, ST.nationPolicies, p.payload.policy_id); current = (policyOptions(def)[ci] || {}).name || '—'; }
    return '<div class="lawchg">' +
      '<div class="lawchg__row"><span class="lawchg__k">Current Law</span><span class="lawchg__v">' + esc(current) + '</span></div>' +
      '<div class="lawchg__row"><span class="lawchg__k">Proposed Change</span><span class="lawchg__v hl">' + esc(proposed) + '</span></div></div>';
  }
  // ---- Expanded "full bill" view — law measures only. Each section reuses ONE source: the
  // policy definition (rungs/effects) + the shared fiscal helpers in policies.js (same math the
  // propose page shows), so a bill reads here exactly as it was costed when proposed. ----
  function billMeta(p){
    var no = ST.billNo[p.id];
    var label = p.status === 'voting' ? 'Division' : p.status === 'agenda' ? 'On the agenda' : p.status === 'passed' ? 'Passed' : 'Failed';
    var tk = p.opened_tick != null ? p.opened_tick : (p.resolved_tick != null ? p.resolved_tick : p.scheduled_tick);
    var date = tk != null ? tickToDate(tk) : '';
    return '<div class="billmeta">' + (no ? 'Bill №' + no : 'Bill') + (date ? ' · ' + esc(date) : '') + ' · ' + label + '</div>';
  }
  // The sponsor's introductory article ("An Act to…"), authored on the propose page, as paragraphs.
  function sponsorIntro(p){
    var intro = (p.payload && p.payload.intro || '').trim();
    if (!intro) return '';
    var paras = intro.split(/\n+/).map(function(s){ return '<p>' + esc(s.trim()) + '</p>'; }).join('');
    return '<div class="billsec"><div class="billsec__h">Sponsor’s Introduction <span class="billsec__by">' + esc(ST.partyName[p.party_id] || 'the sponsor') + '</span></div><div class="billart">' + paras + '</div></div>';
  }
  // The Current → Proposed rows (reusing lawChange — ONE source) plus the policy spectrum: every
  // rung with Now / Proposed pins. The spectrum is omitted if the policy definition didn't load.
  function billChange(p){
    if (!p.payload) return '';
    var def = ST.policyDefs[p.payload.policy_id], spec = '';
    if (def) {
      var opts = policyOptions(def), ci = policyOptionIdx(def, ST.nationPolicies, p.payload.policy_id);
      var pi = (p.payload.option_idx != null) ? +p.payload.option_idx : -1;
      if (opts.length && ci >= 0 && pi >= 0) {
        var segs = opts.map(function(o, i){
          var cls = i === ci ? 'cur' : i === pi ? 'prop' : '';
          var pin = i === ci ? '<span class="spec-pin">Now</span>' : i === pi ? '<span class="spec-pin">Proposed</span>' : '';
          return '<div class="spec-seg ' + cls + '">' + pin + '<span>' + esc(o.name || ('Option ' + (i + 1))) + '</span></div>';
        }).join('');
        var pname = (opts[pi] || {}).name || p.payload.option_name || 'the proposed rung', d = pi - ci;
        var dir = d === 0 ? 'No movement on the ladder' : Math.abs(d) + ' rung' + (Math.abs(d) === 1 ? '' : 's') + ' toward ' + esc(pname);
        spec = '<div class="spectrum"><div class="spec-track">' + segs + '</div><div class="spec-dir">' + dir + '</div></div>';
      }
    }
    return '<div class="billsec"><div class="billsec__h">The Change</div>' + lawChange(p) + spec + '</div>';
  }
  function fmtB(v){ return '₣' + Math.abs(v).toFixed(1) + 'B'; }
  function fiscalRow(label, sub, delta, goodUp, isNet){
    var flat = Math.abs(delta) < 0.05, up = delta > 0, good = goodUp ? up : !up;
    var cls = flat ? 'flat' : good ? 'up' : 'dn', arw = flat ? '' : up ? '▲' : '▼', sign = delta > 0 ? '+' : delta < 0 ? '−' : '';
    return '<div class="irow' + (isNet ? ' net' : '') + '"><span class="ik">' + label + (sub ? ' <small>' + sub + '</small>' : '') + '</span>' +
      '<span class="iv ' + cls + '">' + (arw ? '<span class="arw">' + arw + '</span>' : '') + sign + fmtB(delta) + '</span></div>';
  }
  // Fiscal delta (vs the rung in force) + the proposed rung's standing effects + its tags. Reads
  // the same policies.js helpers as the propose preview, scaled by this nation's pop × prosperity.
  function billImpact(p){
    if (!p.payload) return '';
    var def = ST.policyDefs[p.payload.policy_id];
    if (!def) return '';   // no definition → skip (the change card still shows names)
    var opts = policyOptions(def), ci = policyOptionIdx(def, ST.nationPolicies, p.payload.policy_id), pi = +p.payload.option_idx;
    var co = opts[ci], po = opts[pi];
    if (!po) return '';
    var d = fiscalDelta(co, po, ST.pop, ST.pros), frows = [];
    if (Math.abs(d.Income) >= 0.05) frows.push(fiscalRow('National Income', 'per year', d.Income, true));
    if (Math.abs(d.Budget) >= 0.05) frows.push(fiscalRow('Treasury / Budget', 'per year', d.Budget, true));
    if (Math.abs(d.Debt) >= 0.05) frows.push(fiscalRow('National Debt', 'liability', d.Debt, false));
    if (frows.length >= 2) frows.push(fiscalRow('Net annual change', '', d.Income + d.Budget - d.Debt, true, true));
    var fiscalHtml = frows.length ? frows.join('') : '<div class="inone">No change to the budget.</div>';
    var effs = (po.effects || []).filter(function(e){ return !fiscalFactor(e); });
    var effHtml = effs.length ? effs.map(function(e){
      var tx = effectText(e, ST.pop, ST.pros), c = tx.cls === 'pos' ? 'up' : tx.cls === 'neg' ? 'dn' : 'flat';
      return '<div class="effrow"><span class="ek ' + c + '">' + esc(tx.text) + '</span><span class="ecad">' + esc(tx.cad) + '</span></div>';
    }).join('') : '<div class="inone">No standing effects beyond the budget.</div>';
    var tags = (po.tags || []).map(function(t){ return '<span class="btag">' + esc(t) + '</span>'; }).join('');
    return '<div class="billsec"><div class="billsec__h">Projected Impact <span class="billsec__by">if enacted</span></div>' +
      '<div class="impact"><div><div class="impact__k">Fiscal</div>' + fiscalHtml + '</div>' +
      '<div><div class="impact__k">Effects on the nation</div>' + effHtml + (tags ? '<div class="btags">' + tags + '</div>' : '') + '</div></div></div>';
  }

  function measureCard(p){
    var t = tallyOf(p.id);
    var cast = t.aye + t.nay, notv = Math.max(0, ST.total - cast);
    var ayePct = ST.total ? Math.min(100, t.aye / ST.total * 100) : 0;
    var nayPct = ST.total ? Math.min(100, t.nay / ST.total * 100) : 0;
    // Mirrors _resolve_proposal (schema/81): an outright chamber majority carries it
    // now; otherwise a simple majority of the seats cast (Aye > Nay) carries at close.
    // A no-confidence motion is the exception — it carries UNLESS the government votes No.
    var noConf = p.kind === 'no_confidence';
    var outright = t.aye > 0 && t.aye >= ST.maj;
    var carry = noConf ? true : (outright || (t.aye > t.nay && t.aye > 0));
    var reso = noConf
      ? 'Carries unless the government votes No before the floor closes'
      : (outright
        ? 'Carrying — outright majority of the chamber'
        : (carry ? 'Would pass if voting closed now — Aye leads'
                 : (t.aye === t.nay ? 'Would fail if voting closed now — tied' : 'Would fail if voting closed now — Nay leads')));
    // Law measures can expand into the full bill (sponsor's introduction, the policy spectrum,
    // projected impact). Other kinds keep the compact card. The division below is shared.
    var isLaw = p.kind === 'law';
    var open = isLaw && ST.openBill === p.id;
    var top = open ? (billMeta(p) + sponsorIntro(p) + billChange(p) + billImpact(p)) : (introLine(p) + lawChange(p));
    var toggle = isLaw ? '<button type="button" class="billtoggle" data-bill="' + esc(p.id) + '">' + (open ? 'Hide full bill ▴' : 'View full bill ▾') + '</button>' : '';
    return '<div class="measure' + (open ? ' open' : '') + '" data-id="' + esc(p.id) + '">' + mhead(p) + top + toggle +
      '<div class="votebar"><span class="va" style="width:' + ayePct + '%"></span><span class="vn" style="width:' + nayPct + '%"></span></div>' +
      '<div class="votenums"><span>Aye <b>' + t.aye + '</b></span><span>Nay <b>' + t.nay + '</b></span><span>Not voted <b>' + notv + '</b></span><span><b>' + cast + '</b> / ' + ST.total + ' seats cast</span></div>' +
      '<div class="reso ' + (carry ? 'pass' : 'fail') + '">' + reso + ticksLeft(p) + '</div>' +
      '<div class="rolltitle">' + (noConf ? 'Roll call · the government must vote No to survive' : 'Roll call · carries on a simple majority (more Aye than Nay), or ' + ST.maj + '+ Aye outright') + '</div>' +
      rollCall(p.id) +
      '<div class="mrow"><button class="vb aye' + (t.myVote === 'aye' ? ' on' : '') + '" data-v="aye" type="button">Vote Aye</button>' +
        '<button class="vb nay' + (t.myVote === 'nay' ? ' on' : '') + '" data-v="nay" type="button">Vote Nay</button>' +
        (t.myVote ? '<span class="youvote">You voted ' + t.myVote + '</span>' : '') + '</div></div>';
  }
  function agendaCard(p){
    var mine = p.party_id === ST.party.id;
    var when = p.scheduled_tick != null ? tickToDate(p.scheduled_tick) : '—';
    return '<div class="measure" data-id="' + esc(p.id) + '">' + mhead(p) + introLine(p) + lawChange(p) +
      '<div class="agwhen">Reaches the floor · <b>' + esc(when) + '</b></div>' +
      '<div class="mrow">' + (mine ? '<button class="sendfloor" data-send="' + esc(p.id) + '" type="button">Send to the floor now (1 action)</button>' : '<span class="youvote">Awaiting its scheduled month</span>') + '</div></div>';
  }
  function emptyPanel(b, s){ return '<div class="panel"><div class="empty"><b>' + b + '</b><span>' + s + '</span></div></div>'; }

  function renderBody(){
    var floor = ST.proposals.filter(function(p){ return p.status === 'voting'; });
    var agenda = ST.proposals.filter(function(p){ return p.status === 'agenda'; })
      .sort(function(a, b){ return (a.scheduled_tick || 0) - (b.scheduled_tick || 0); });  // earliest month first
    var hist = ST.proposals.filter(function(p){ return p.status === 'passed' || p.status === 'failed'; }).slice(0, 12);
    var content = document.getElementById('content');
    content.innerHTML =
      '<div class="summary">' +
        '<div class="scell"><div class="k">Session</div><div class="v">' + esc(ST.session) + '</div></div>' +
        '<div class="scell"><div class="k">Seats</div><div class="v">' + ST.total + '</div></div>' +
        '<div class="scell"><div class="k">Outright majority</div><div class="v">' + ST.maj + '</div></div>' +
        '<div class="scell"><div class="k">Government bloc</div><div class="v ind">' + ST.govBloc + (ST.total && ST.govBloc >= ST.maj ? ' ✓' : '') + '</div></div>' +
      '</div>' +
      '<div class="legcols"><div class="legmain">' +
        '<div class="secthd">On the Floor <span class="ct">' + floor.length + '</span><button class="propose" id="proposeBtn" type="button">Propose New Law</button></div>' +
        (floor.length ? floor.map(measureCard).join('') : emptyPanel('No measures on the floor', 'Propose one, or wait for another party to bring a measure.')) +
        '<div class="secthd">Upcoming Agenda <span class="ct">' + agenda.length + '</span></div>' +
        (agenda.length ? agenda.map(agendaCard).join('') : emptyPanel('Nothing on the agenda', 'Queued measures reach the floor automatically on their scheduled month — one per month.')) +
      '</div><aside class="legrail"><section class="panel"><h2>Legislative History</h2>' +
        (hist.length ? hist.map(function(p){
          var verb = p.status === 'passed' ? 'Passed' : 'Failed';
          var when = (p.resolved_tick != null) ? tickToDate(p.resolved_tick) : '';   // null on pre-migration rows
          return '<div class="histrow"><div class="histrow__top"><span>' + esc(p.title) + '</span>' +
            '<span class="pf ' + p.status + '">' + verb + '</span></div>' +
            (when ? '<div class="histrow__d">Date ' + verb + ': ' + esc(when) + '</div>' : '') +
          '</div>';
        }).join('') : '<p class="muted">No measures resolved yet.</p>') +
      '</section></aside></div>';

    document.getElementById('proposeBtn').onclick = function () { modal.hidden = false; };
    content.querySelectorAll('.billtoggle').forEach(function (btn) {
      btn.onclick = function () { ST.openBill = (ST.openBill === btn.dataset.bill) ? null : btn.dataset.bill; renderBody(); };
    });
    content.querySelectorAll('.measure .vb').forEach(function (btn) {
      btn.onclick = function () {
        if (ST.busy) return;
        var card = btn.closest('.measure');
        ST.busy = true; card.querySelectorAll('.vb').forEach(function (b) { b.disabled = true; });
        castVote(card.dataset.id, btn.dataset.v === 'aye').then(loadProposals)
          .catch(function (e) { alert(e.message || 'Couldn’t record your vote.'); card.querySelectorAll('.vb').forEach(function (b) { b.disabled = false; }); })
          .then(function () { ST.busy = false; });
      };
    });
    content.querySelectorAll('.sendfloor').forEach(function (btn) {
      btn.onclick = function () {
        if (ST.busy) return; ST.busy = true; btn.disabled = true;
        proposalToFloor(btn.dataset.send).then(function (res) { if (res && res.actions != null) setTopbarActions(res.actions); return loadProposals(); })
          .catch(function (e) { alert(e.message || 'Couldn’t send it to the floor.'); btn.disabled = false; }).then(function () { ST.busy = false; });
      };
    });
  }

  async function loadProposals(){
    try {
      ST.proposals = await fetchProposals(ST.party.nation_id);
      ST.votes = await fetchVotes(ST.proposals.map(function (p) { return p.id; }));
      // Derived display ordinal: number every measure by creation order (oldest = №1). Display
      // only — nothing stored; it shifts only if a measure is deleted, which never happens.
      ST.billNo = {};
      ST.proposals.slice().sort(function (a, b) { return new Date(a.created_at) - new Date(b.created_at); })
        .forEach(function (p, i) { ST.billNo[p.id] = i + 1; });
      renderBody();
    } catch (e) { fail('Couldn’t load the chamber’s measures. Refresh to try again.'); }
  }

  (async () => {
    if (!isConfigured) { fail('Supabase isn’t configured.'); return; }
    const user = await requireUser();
    if (!user) return; // redirected to login
    try {
      const { data: party } = await supabase.from('parties').select('id, nation_id, name, archetype, funds, actions_remaining').eq('user_id', user.id).single();
      if (!party) { window.location.replace('/nation-select/'); return; }
      const { data: nation } = await supabase.from('nations').select('name, flag, legislature_seats, economy, policies, population, stats').eq('id', party.nation_id).single();
      const { data: parties } = await supabase.from('parties').select('id, name, seats, in_government').eq('nation_id', party.nation_id);
      const nationName = (nation && nation.name) || party.nation_id;
      // Policy definitions + this nation's in-force options — so a law measure can show
      // the Current Law it would change (proposed option is already in the proposal payload).
      // Non-fatal: if the definitions can't load, law measures just show "—" for the
      // current/proposed option — the chamber and voting still work.
      ST.nationPolicies = (nation && nation.policies) || {};
      ST.pop = Number((nation && nation.population) || 0);
      ST.pros = Number((nation && nation.stats && nation.stats.prosperity) || 10);
      try { (await fetchPolicies()).forEach(function (r) { ST.policyDefs[r.id] = r.definition; }); } catch (e) { /* leave policyDefs empty → "—" */ }

      ST.party = party;
      ST.total = (nation && nation.legislature_seats) || 0;
      ST.maj = ST.total ? majority(ST.total) : 0;
      (parties || []).forEach(function (p) { ST.seatsByParty[p.id] = p.seats || 0; ST.partyName[p.id] = p.name; if (p.in_government) ST.govBloc += (p.seats || 0); });
      // Owner OOC nicknames, keyed by party (cosmetic — a failure must never block the chamber).
      try {
        const { data: hrows } = await supabase.rpc('nation_party_handles', { p_nation: party.nation_id });
        (hrows || []).forEach(function (h) { ST.partyHandle[h.party_id] = h.handle; });
      } catch (e) { /* no nicknames shown */ }

      document.getElementById('pname').textContent = party.name;
      document.getElementById('psub').textContent = ideologyLabel(party) + ' · ' + nationName;
      document.getElementById('lhead').textContent = 'National Assembly of ' + nationName;
      if (nation && nation.flag) { var f = document.getElementById('flag'); f.onload = function(){ f.hidden = false; }; f.src = nation.flag; }

      ST.tick = await currentTick();
      ST.session = tickToDate(ST.tick); // assembly summary; the topbar owns its own date
      var currency = (nation && nation.economy && nation.economy.currency) || '$';
      setTopbarFunds(currency, party.funds);
      setTopbarActions(party.actions_remaining);
      await loadProposals();
    } catch (e) {
      fail('Couldn’t load the Legislature right now. Refresh to try again.');
    }
  })();
</script>
</body>
</html>
