<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/theme.js"></script>
<title>Committee · Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/play.css">
<style>
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .main{flex:1;padding:24px clamp(16px,4vw,56px) 56px;min-width:0}
  .page{max-width:820px}
  .back{display:inline-flex;align-items:center;gap:6px;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-decoration:none;margin-bottom:14px}
  .back:hover{color:var(--ink)}
  .phead .eye{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
  .phead h1{font-weight:900;font-size:clamp(24px,4vw,34px);letter-spacing:-.025em;margin:6px 0 4px}
  .status{display:inline-flex;align-items:center;gap:7px;font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:5px 11px;border-radius:20px;margin-bottom:18px}
  .status--committee{color:var(--amber,#E0820E);background:color-mix(in srgb,var(--amber,#E0820E) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--amber,#E0820E) 40%,var(--surface))}
  .status--floor{color:var(--indigo,#5546E8);background:var(--indigo-soft,#ECE9FD);border:1px solid color-mix(in srgb,var(--indigo,#5546E8) 40%,var(--surface))}
  .status--dead{color:var(--soft);background:var(--chip,#F4F3EF);border:1px solid var(--line)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px}
  .card h2{font-size:12px;font-family:'Space Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin:0 0 12px}
  .chg{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .chg__o{font-weight:800;font-size:15px;padding:7px 12px;border-radius:10px;background:var(--chip,#F4F3EF);color:var(--muted)}
  .chg__o.to{background:var(--indigo-soft,#ECE9FD);color:var(--indigo,#5546E8)}
  .chg__arr{color:var(--soft);font-weight:800}
  .desc{color:var(--muted);font-size:13.5px;line-height:1.55}
  .intro{font-size:14px;line-height:1.6;color:var(--ink);font-style:italic;border-left:3px solid var(--line2,#D9D6D0);padding-left:14px;margin-top:12px}

  .endr{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .endr__chip{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;border:1px solid;background:var(--surface)}
  .endr__none{color:var(--soft);font-size:13px;font-style:italic}

  .acts{display:flex;gap:10px;flex-wrap:wrap}
  .btn{border:none;border-radius:10px;padding:12px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn--end{background:var(--indigo,#5546E8);color:#fff}
  .btn--push{background:var(--ink);color:var(--bg,#fff)}
  .btn--push.warn{background:var(--red,#C42B2B);color:#fff}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .actnote{font-size:12.5px;color:var(--muted);margin-top:9px}

  .chat{display:flex;flex-direction:column;gap:11px;max-height:420px;overflow-y:auto;padding-right:4px}
  .msg{display:flex;flex-direction:column;gap:3px}
  .msg__hd{font-size:11px;font-family:'Space Mono',monospace;letter-spacing:.03em;color:var(--soft)}
  .msg__hd b{font-weight:700}
  .msg__body{font-size:14px;line-height:1.5;color:var(--ink);background:var(--field,#FCFBF9);border:1px solid var(--line);border-radius:10px;padding:9px 12px;white-space:pre-wrap;word-break:break-word}
  .chatempty{color:var(--soft);font-size:13px;font-style:italic;padding:8px 0}
  .chatbox{display:flex;gap:9px;margin-top:14px}
  .chatbox textarea{flex:1;min-height:44px;max-height:140px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;background:var(--surface);color:var(--ink)}
  .chatbox button{align-self:flex-end}
  .chatgate{color:var(--soft);font-size:13px;font-style:italic;margin-top:12px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div id="sidenav"></div>
  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="page">
      <a class="back" href="/play/legislature/">&lsaquo; Legislature</a>
      <div class="phead">
        <span class="eye" id="cNation">The Committee</span>
        <h1 id="cTitle">Bill</h1>
      </div>
      <div class="status status--committee" id="cStatus">Loading…</div>

      <div class="card" id="billCard" hidden>
        <h2>The Bill</h2>
        <div class="chg"><span class="chg__o" id="billFrom">—</span><span class="chg__arr">→</span><span class="chg__o to" id="billTo">—</span></div>
        <p class="desc" id="billDesc"></p>
        <div class="intro" id="billIntro" hidden></div>
      </div>

      <div class="card" id="endCard" hidden>
        <h2>Endorsements</h2>
        <div class="endr" id="endList"></div>
      </div>

      <div class="card" id="actCard" hidden>
        <h2>Actions</h2>
        <div class="acts" id="actBtns"></div>
        <div class="actnote" id="actNote"></div>
      </div>

      <div class="card" id="chatCard" hidden>
        <h2>Committee Chat</h2>
        <div class="chat" id="chatList"><div class="chatempty">No messages yet.</div></div>
        <div id="chatFooter"></div>
      </div>
    </div>
  </main>
</div>

<script type="module">
  import { supabase, isConfigured, requireUser } from '/supabase.js';
  import { esc, majority } from '/util.js';
  import { partyColor } from '/archetypes.js';
  import { mountTopbar, setTopbarActions } from '/topbar.js';
  import { mountSidenav } from '/sidenav.js';
  import { policyOptions, policyOptionIdx } from '/policies.js';
  import { committeeEndorse, committeePush, committeePost } from '/proposals.js';

  mountTopbar();
  mountSidenav();

  var PID = new URLSearchParams(location.search).get('id');
  var ME = null, PROP = null, DEF = null, CUR_TICK = 0, ENDORSED_BY_ME = false, POLL = null, BUSY = false;
  var NAT_POLICIES = {};   // the bill nation's in-force policy options (for the "from" rung)
  var NAT_SEATS = 0;       // the bill nation's total legislature seats — for the majority-free-push check
  var PARTY = {};          // party_id → { name, color }
  var COMMITTEE_WINDOW = 6;   // ticks a bill sits in committee — mirrors _expire_committee (schema/154)

  function statusChip() {
    var el = document.getElementById('cStatus');
    if (!PROP) { el.textContent = 'Not found'; el.className = 'status status--dead'; return; }
    if (PROP.status === 'committee') {
      var left = Math.max(0, COMMITTEE_WINDOW - (CUR_TICK - (PROP.opened_tick || CUR_TICK)));
      el.textContent = 'In Committee · ' + left + ' tick' + (left === 1 ? '' : 's') + ' left';
      el.className = 'status status--committee';
    } else if (PROP.status === 'voting') {
      el.innerHTML = 'On the Floor — <a href="/play/legislature/" style="color:inherit;text-decoration:underline">go vote</a>';
      el.className = 'status status--floor';
    } else if (PROP.status === 'passed') { el.textContent = 'Passed into law'; el.className = 'status status--floor'; }
    else if (PROP.status === 'expired') { el.textContent = 'Expired in committee'; el.className = 'status status--dead'; }
    else { el.textContent = PROP.status === 'failed' ? 'Failed on the floor' : PROP.status; el.className = 'status status--dead'; }
  }

  function renderBill() {
    var pl = PROP.payload || {};
    document.getElementById('cTitle').textContent = PROP.title || 'Bill';
    var toName = pl.option_name || (DEF && (policyOptions(DEF)[pl.option_idx] || {}).name) || '—';
    var fromName = '—';
    if (DEF) { var ci = policyOptionIdx(DEF, NAT_POLICIES, pl.policy_id); fromName = (policyOptions(DEF)[ci] || {}).name || '—'; }
    document.getElementById('billFrom').textContent = fromName;
    document.getElementById('billTo').textContent = toName;
    var desc = DEF && DEF.desc;
    var descEl = document.getElementById('billDesc');
    if (desc) descEl.textContent = desc; else descEl.hidden = true;
    if (pl.intro) { var i = document.getElementById('billIntro'); i.textContent = pl.intro; i.hidden = false; }
    document.getElementById('billCard').hidden = false;
  }

  function renderEndorsers(rows) {
    ENDORSED_BY_ME = false;
    var box = document.getElementById('endList');
    document.getElementById('endCard').hidden = false;
    if (!rows.length) { box.innerHTML = '<span class="endr__none">No endorsements yet.</span>'; return; }
    box.innerHTML = rows.map(function (r) {
      if (ME && r.party_id === ME.id) ENDORSED_BY_ME = true;
      var p = PARTY[r.party_id] || {}; var c = p.color || '#8d8d95';
      return '<span class="endr__chip" style="color:' + c + ';border-color:' + c + '">' + esc(p.name || 'Party') + '</span>';
    }).join('');
  }

  function renderActions(endorseCount) {
    var card = document.getElementById('actCard'), btns = document.getElementById('actBtns'), note = document.getElementById('actNote');
    var inNation = ME && PROP.nation_id === ME.nation_id;
    var isProposer = ME && PROP.party_id === ME.id;
    if (PROP.status !== 'committee' || !inNation) { card.hidden = true; return; }
    card.hidden = false; btns.innerHTML = ''; note.textContent = '';
    if (isProposer) {
      // A majority (≥ 51% of the chamber) can carry the bill alone, so its push is free even with no
      // endorsement — mirrors committee_push (schema/154), which uses the same _majority threshold.
      var hasMajority = NAT_SEATS > 0 && (ME.seats || 0) >= majority(NAT_SEATS);
      var free = endorseCount > 0 || hasMajority;
      var b = document.createElement('button');
      b.className = 'btn btn--push' + (free ? '' : ' warn');
      b.textContent = 'Push to the Floor · ' + (free ? 'Free' : '1 AP');
      b.onclick = doPush;
      btns.appendChild(b);
      note.textContent = hasMajority
        ? 'Your party holds a majority — you can carry this bill alone, so pushing it to the floor is free.'
        : endorseCount > 0
          ? 'This bill has an endorsement — pushing it to the floor is free.'
          : 'No endorsement yet — pushing now costs 1 AP and −2 Party Popularity.';
    } else {
      var e = document.createElement('button');
      e.className = 'btn btn--end';
      e.textContent = ENDORSED_BY_ME ? 'Endorsed ✓' : 'Endorse · 1 AP';
      e.disabled = ENDORSED_BY_ME;
      e.onclick = doEndorse;
      btns.appendChild(e);
      if (ENDORSED_BY_ME) note.textContent = 'Your party has endorsed this bill.';
    }
  }

  function renderChat(rows) {
    var box = document.getElementById('chatList');
    document.getElementById('chatCard').hidden = false;
    box.innerHTML = rows.length ? rows.map(function (m) {
      var p = PARTY[m.party_id] || {}; var c = p.color || '#8d8d95';
      var t = new Date(m.created_at);
      var when = isNaN(t) ? '' : (t.getMonth() + 1) + '/' + t.getDate() + ' ' + String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0');
      return '<div class="msg"><div class="msg__hd"><b style="color:' + c + '">' + esc(p.name || 'Party') + '</b> · ' + when + '</div>' +
        '<div class="msg__body">' + esc(m.body) + '</div></div>';
    }).join('') : '<div class="chatempty">No messages yet.</div>';
    box.scrollTop = box.scrollHeight;   // keep the latest message in view across polls

    // chat input only for parties in the nation, while it's in committee
    var footer = document.getElementById('chatFooter');
    var inNation = ME && PROP.nation_id === ME.nation_id;
    if (PROP.status === 'committee' && inNation) {
      if (!document.getElementById('chatSend')) {
        footer.innerHTML = '<div class="chatbox"><textarea id="chatInput" maxlength="1000" placeholder="Make your case to the committee…"></textarea>' +
          '<button class="btn btn--end" id="chatSend" type="button">Send</button></div>';
        document.getElementById('chatSend').onclick = doPost;
      }
    } else {
      footer.innerHTML = '<div class="chatgate">' + (inNation ? 'The debate is closed.' : 'Only parties in this nation can post.') + '</div>';
    }
  }

  async function loadDynamic() {
    // endorsements + chat + a fresh status (in case it was pushed/expired elsewhere)
    try {
      var [endR, msgR, propR] = await Promise.all([
        supabase.from('committee_endorsements').select('party_id, created_at').eq('proposal_id', PID).order('created_at'),
        supabase.from('committee_messages').select('party_id, body, created_at').eq('proposal_id', PID).order('created_at'),
        supabase.from('proposals').select('status, opened_tick').eq('id', PID).maybeSingle()
      ]);
      if (propR.data) { PROP.status = propR.data.status; PROP.opened_tick = propR.data.opened_tick; }
      statusChip();
      renderEndorsers(endR.data || []);
      renderChat(msgR.data || []);
      renderActions((endR.data || []).length);
      if (PROP.status !== 'committee' && POLL) { clearInterval(POLL); POLL = null; }
    } catch (e) { /* keep what's shown */ }
  }

  async function doEndorse() {
    if (BUSY) return; BUSY = true;
    try { var r = await committeeEndorse(PID); if (r && r.actions != null) setTopbarActions(r.actions); await loadDynamic(); }
    catch (e) { document.getElementById('actNote').textContent = e.message || 'Could not endorse.'; }
    BUSY = false;
  }
  async function doPush() {
    if (BUSY) return;
    if (!window.confirm('Push this bill to the floor for a vote?')) return;
    BUSY = true;
    try { var r = await committeePush(PID); if (r && r.actions != null) setTopbarActions(r.actions); location.href = '/play/legislature/'; }
    catch (e) { document.getElementById('actNote').textContent = e.message || 'Could not push to the floor.'; BUSY = false; }
  }
  async function doPost() {
    if (BUSY) return;
    var inp = document.getElementById('chatInput'); var body = (inp.value || '').trim();
    if (!body) return; BUSY = true;
    var btn = document.getElementById('chatSend'); btn.disabled = true;
    try { await committeePost(PID, body); inp.value = ''; await loadDynamic(); }
    catch (e) { alert(e.message || 'Could not post.'); }
    btn.disabled = false; BUSY = false;
  }

  (async () => {
    if (!isConfigured || !PID) return;
    var user = await requireUser();
    if (!user) return;
    try {
      var { data: party } = await supabase.from('parties').select('id, nation_id, name, archetype, color, influence, seats').eq('user_id', user.id).maybeSingle();
      ME = party || null;
      if (ME) setTopbarActions(ME.influence);

      var { data: prop } = await supabase.from('proposals').select('id, nation_id, party_id, kind, title, payload, status, opened_tick').eq('id', PID).maybeSingle();
      if (!prop) { document.getElementById('cTitle').textContent = 'Bill not found'; statusChip(); return; }
      PROP = prop;

      var [gsR, defR, natR, partiesR] = await Promise.all([
        supabase.from('game_state').select('current_tick').maybeSingle(),
        supabase.from('policies').select('definition').eq('id', prop.payload && prop.payload.policy_id).maybeSingle(),
        supabase.from('nations').select('name, policies, legislature_seats').eq('id', prop.nation_id).maybeSingle(),
        supabase.from('parties').select('id, name, color, archetype').eq('nation_id', prop.nation_id)
      ]);
      CUR_TICK = (gsR.data && gsR.data.current_tick) || 0;
      DEF = defR.data && defR.data.definition;
      NAT_POLICIES = (natR.data && natR.data.policies) || {};
      NAT_SEATS = (natR.data && natR.data.legislature_seats) || 0;
      document.getElementById('cNation').textContent = (natR.data && natR.data.name) || prop.nation_id;
      (partiesR.data || []).forEach(function (p) { PARTY[p.id] = { name: p.name, color: partyColor(p) }; });

      renderBill();
      await loadDynamic();
      if (PROP.status === 'committee') POLL = setInterval(loadDynamic, 10000);
    } catch (e) { statusChip(); }
  })();
</script>
</body>
</html>
