<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/theme.js"></script>
<title>Organization · Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/play.css">
<style>
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  .main{flex:1;padding:24px clamp(16px,4vw,56px) 56px;min-width:0}
  .back{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);text-decoration:none}
  .back:hover{color:var(--ink)}

  /* status header */
  .status{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 22px;margin:12px 0 18px}
  .strow{display:flex;align-items:center;gap:15px;flex-wrap:wrap}
  .strow .oic{font-size:28px;line-height:1}
  .strow .onm{font-size:19px;font-weight:800;letter-spacing:-.01em}
  .strow .osub{font-family:'Space Mono',monospace;font-size:8.5px;color:var(--soft);letter-spacing:.05em;text-transform:uppercase;margin-top:3px}
  .spacer{flex:1}
  .hstat{text-align:right;font-family:'Space Mono',monospace;min-width:74px}
  .hstat .v{font-size:14px;font-weight:700}
  .hstat .k{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin-top:2px}
  .stage{font-family:'Space Mono',monospace;font-size:8.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:color-mix(in srgb,var(--blue) 70%,var(--ink));background:color-mix(in srgb,var(--blue) 12%,transparent);border:1px solid color-mix(in srgb,var(--blue) 40%,var(--line));border-radius:7px;padding:5px 10px}
  .stage.ready{color:color-mix(in srgb,var(--green) 70%,var(--ink));background:color-mix(in srgb,var(--green) 12%,transparent);border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
  .charterline{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
  .art{font-family:'Space Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--field);border:1px solid var(--line2);border-radius:6px;padding:5px 10px}

  .layout{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start}
  .layout.solo{grid-template-columns:1fr}   /* active view: chat sits above, full width */
  @media(max-width:1000px){.layout{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px}
  .sect{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin:0 0 13px;display:flex;align-items:baseline;gap:10px}
  .sect .note{letter-spacing:.03em;font-size:9px;font-weight:400;text-transform:none;color:var(--soft)}

  /* convention voting */
  .article{border:1px solid var(--line2);border-radius:12px;background:var(--field);padding:12px 14px;margin-bottom:10px}
  .arttop{display:flex;align-items:baseline;gap:9px;margin-bottom:9px}
  .artnm{font-size:13px;font-weight:700}
  .artst{margin-left:auto;font-family:'Space Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
  .artst.decided{color:color-mix(in srgb,var(--green) 72%,var(--ink))}
  .opts{display:flex;gap:8px;flex-wrap:wrap}
  .opt{flex:1 1 150px;text-align:left;border:1px solid var(--line2);border-radius:9px;background:var(--surface);padding:9px 11px;cursor:pointer;color:var(--ink)}
  .opt:hover:not(:disabled){border-color:var(--soft)}
  .opt:disabled{cursor:default}
  .opt.mine{border-color:color-mix(in srgb,var(--amber) 55%,var(--line));background:color-mix(in srgb,var(--amber) 8%,var(--surface))}
  .opt.win{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--green) 45%,transparent)}
  .opt .ol{font-size:12px;font-weight:600}
  .optb{display:flex;align-items:center;gap:7px;margin-top:6px}
  .obar{flex:1;height:6px;background:var(--field);border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .obar > i{display:block;height:100%;background:color-mix(in srgb,var(--blue) 55%,var(--line))}
  .ocount{font-family:'Space Mono',monospace;font-size:9px;font-weight:700;color:var(--soft)}
  .ballotnote{font-family:'Space Mono',monospace;font-size:9px;color:var(--soft);margin-top:4px;line-height:1.6}

  .frow{display:flex;align-items:center;gap:13px;margin-top:6px;flex-wrap:wrap}
  .btn{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:9px;padding:10px 18px;cursor:pointer;border:1px solid var(--line2);background:var(--field);color:var(--ink)}
  .btn.ratify{color:color-mix(in srgb,var(--blue) 74%,var(--ink));background:color-mix(in srgb,var(--blue) 10%,transparent);border-color:color-mix(in srgb,var(--blue) 42%,var(--line))}
  .btn.go{color:color-mix(in srgb,var(--green) 72%,var(--ink));background:color-mix(in srgb,var(--green) 10%,transparent);border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
  .btn.no{color:color-mix(in srgb,var(--red) 72%,var(--ink));background:color-mix(in srgb,var(--red) 8%,transparent);border-color:color-mix(in srgb,var(--red) 36%,var(--line))}
  .btn:hover:not(:disabled){filter:brightness(1.15)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .fnote{font-family:'Space Mono',monospace;font-size:9px;color:var(--soft);line-height:1.6}

  /* roster */
  .roster{display:flex;flex-direction:column;gap:0}
  .rrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .rrow:first-child{border-top:none}
  .rname{font-size:13px;font-weight:600}
  .rrole{margin-left:auto;font-family:'Space Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
  .rrole.founder{color:var(--amber)}

  /* laws of the assembly */
  .branch{border:1px solid var(--line2);border-radius:12px;background:var(--field);margin-bottom:12px;overflow:hidden}
  .brhead{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--line)}
  .brdot{width:9px;height:9px;border-radius:3px;flex:none}
  .brnm{font-size:13px;font-weight:700}
  .brtag{font-family:'Space Mono',monospace;font-size:7.5px;color:var(--soft);letter-spacing:.05em;text-transform:uppercase}
  .brlock{margin-left:auto;font-family:'Space Mono',monospace;font-size:7.5px;color:var(--soft);letter-spacing:.05em}
  .brlaws{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
  .blaw{padding:11px 14px;border-top:1px solid var(--line);border-left:1px solid var(--line)}
  .blaw:first-child{border-left:none}
  .blaw .bn{font-size:12.5px;font-weight:700}
  .blaw .bd{font-family:'Space Mono',monospace;font-size:8px;color:var(--soft);line-height:1.5;margin-top:3px;letter-spacing:.02em}
  .blaw .brow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
  .lbtn{font-family:'Space Mono',monospace;font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:7px;padding:6px 11px;cursor:pointer;border:1px solid var(--line2);background:var(--surface);color:var(--ink)}
  .lbtn.aye{color:color-mix(in srgb,var(--green) 72%,var(--ink));border-color:color-mix(in srgb,var(--green) 40%,var(--line))}
  .lbtn.nay{color:color-mix(in srgb,var(--red) 72%,var(--ink));border-color:color-mix(in srgb,var(--red) 36%,var(--line))}
  .lbtn.aye.on{background:color-mix(in srgb,var(--green) 14%,transparent)}
  .lbtn.nay.on{background:color-mix(in srgb,var(--red) 12%,transparent)}
  .lbtn:hover:not(:disabled){filter:brightness(1.15)}
  .lbtn:disabled{opacity:.45;cursor:not-allowed}
  .enacted{font-family:'Space Mono',monospace;font-size:8.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--green) 72%,var(--ink))}
  .agtally{font-family:'Space Mono',monospace;font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
  .lnote{font-family:'Space Mono',monospace;font-size:8px;color:var(--soft);letter-spacing:.04em}
  .govnote{font-size:11px;color:var(--muted);line-height:1.55;padding:11px 14px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--indigo) 5%,transparent)}
  .govnote b{color:color-mix(in srgb,var(--indigo) 55%,var(--ink))}

  /* upcoming agenda (read-only summary of the open law votes) */
  .dk{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-top:1px solid var(--line)}
  .dk:first-child{border-top:none}
  .dk .dic{font-size:15px;width:22px;text-align:center;flex:none}
  .dk .dn{font-size:12.5px;font-weight:700}
  .dk .dd{font-family:'Space Mono',monospace;font-size:8.5px;color:var(--soft);margin-top:2px;letter-spacing:.03em;line-height:1.5}
  .dk .dwhen{margin-left:auto;font-family:'Space Mono',monospace;font-size:8px;font-weight:700;letter-spacing:.08em;color:var(--blue);white-space:nowrap}
  .dkempty{font-family:'Space Mono',monospace;font-size:9.5px;color:var(--soft);letter-spacing:.03em;padding:4px 0}

  /* assembly floor chat */
  .chat{background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;height:600px;position:sticky;top:16px}
  .chat.top{position:static;height:340px;margin-bottom:16px}   /* active view: floor above the laws */
  .chead{padding:13px 17px;border-bottom:1px solid var(--line)}
  .chead .cn{font-size:14px;font-weight:800}
  .chead .cr{font-family:'Space Mono',monospace;font-size:8.5px;color:var(--soft);letter-spacing:.05em;text-transform:uppercase;margin-top:2px}
  .msgs{flex:1;overflow-y:auto;padding:14px 15px;display:flex;flex-direction:column;gap:9px}
  .msg{max-width:90%;padding:8px 12px;border-radius:11px;font-size:12.5px;line-height:1.5;align-self:flex-start;background:var(--field);border:1px solid var(--line2);border-bottom-left-radius:4px}
  .msg.you{align-self:flex-end;background:color-mix(in srgb,var(--amber) 8%,var(--surface));border-color:color-mix(in srgb,var(--amber) 30%,var(--line));border-bottom-left-radius:11px;border-bottom-right-radius:4px}
  .msg .who{font-family:'Space Mono',monospace;font-size:7.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--blue);margin-bottom:3px}
  .msg.you .who{color:var(--amber)}
  .msg .tm{font-family:'Space Mono',monospace;font-size:7px;color:var(--soft);margin-left:6px}
  .cempty{margin:auto;text-align:center;font-family:'Space Mono',monospace;font-size:9.5px;color:var(--soft);line-height:1.8;padding:0 20px}
  .cinput{display:flex;gap:8px;padding:11px 13px;border-top:1px solid var(--line)}
  .cinput input{flex:1;background:var(--field);border:1px solid var(--line2);border-radius:9px;color:var(--ink);font-size:12.5px;padding:9px 12px;outline:none;font-family:'Archivo',sans-serif}
  .cinput input:focus{border-color:var(--soft)}
  .cinput input:disabled{opacity:.5}
  .send{font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--field);border:1px solid var(--line2);border-radius:9px;padding:0 15px;cursor:pointer}
  .send:disabled{opacity:.4;cursor:not-allowed}

  .empty{border:1px dashed var(--line2);border-radius:14px;padding:26px 20px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="app">
  <div id="sidenav"></div>

  <main class="main">
    <div class="topbar" id="topbar"></div>
    <a class="back" href="/play/organizations/">← International Organizations</a>

    <div id="statusWrap"><div class="empty">Loading…</div></div>

    <div id="topSlot"></div><!-- active view: the Assembly Floor is moved here, above the laws -->

    <div class="layout" id="layout" style="display:none">
      <div id="leftcol"></div>
      <div class="chat" id="chatBox">
        <div class="chead"><div class="cn">The Assembly Floor</div><div class="cr" id="floorMembers"></div></div>
        <div class="msgs" id="msgs"></div>
        <div class="cinput">
          <input type="text" id="chatIn" placeholder="Address the Assembly…" maxlength="500" disabled>
          <button class="send" id="sendBtn" disabled>Send</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="module">
  import { supabase, isConfigured, requireUser } from '/supabase.js';
  import { esc, tickToDate } from '/util.js';
  import { mountTopbar } from '/topbar.js';
  import { mountSidenav } from '/sidenav.js';

  mountTopbar();
  mountSidenav();

  // The six charter articles + their options — labels only; the ids mirror schema/189's catalog (the
  // server validates every vote, so this list is display, not authority).
  var ARTICLES = [
    { id:'accession', label:'Accession', opts:[{id:'open',label:'Open — any nation may apply'},{id:'closed',label:'Closed — invitation only'}] },
    { id:'voting',    label:'Voting',    opts:[{id:'equal',label:'One Member, One Vote'},{id:'gdp',label:'Weighted by GDP'}] },
    { id:'admission', label:'Admission', opts:[{id:'majority',label:'Simple Majority'},{id:'unanimous',label:'Unanimous'}] },
    { id:'chair',     label:'Chair / Seat', opts:[{id:'rotating',label:'Rotating host'},{id:'fixed',label:'Fixed — the founder'}] },
    { id:'expulsion', label:'Expulsion', opts:[{id:'unanimous',label:'Unanimous − Accused'},{id:'majority',label:'Simple Majority'},{id:'none',label:'None'}] },
    { id:'dues',      label:'Dues',      opts:[{id:'gdp',label:'Flat % of GDP'},{id:'fixed',label:'Fixed sum'},{id:'none',label:'None'}] }
  ];
  var ARTLABEL = {}; ARTICLES.forEach(function (a) { ARTLABEL[a.id] = {}; ARTLABEL[a.id]._ = a.label; a.opts.forEach(function (o) { ARTLABEL[a.id][o.id] = o.label; }); });
  var MIN_ACCEPT = 2;

  // The six law sectors and their Level I laws — labels only; the ids mirror schema/190's catalog (the
  // server validates every proposal). Levels II–V are age-gated (deferred), so only Level I is proposable.
  var LAWS_CAT = [
    { id:'gov', nm:'Governance', col:'#b07cf0', tag:'the constitutional sector', laws:[
      { id:'secretariat', nm:'The Standing Secretariat', d:'Permanent staff and budget · the Assembly acts between sessions' },
      { id:'sessions',    nm:'Standing Sessions',        d:'The Assembly convenes every month · agenda capacity +1' },
      { id:'chapters',    nm:'Regional Chapters',        d:'Charter regional sub-assemblies — siblings, continent by continent' } ],
      note: '<b>The road to a world organization runs up this ladder.</b> Locked above: <b>II — The Council</b> (permanent seats &amp; veto), the Tribunal, Observer Status · <b>III — Peacekeeping</b>, Compulsory Arbitration · <b>IV — Collective Security</b> · <b>V — sealed.</b> Levels unlock with the Assembly’s age.' },
    { id:'eco', nm:'Economic', col:'#4caf6d', tag:'trade among members', laws:[
      { id:'tariff', nm:'Tariff Courtesy', d:'Members cut tariffs 10% for each other' },
      { id:'fair',   nm:'The Trade Fair',  d:'Annual exposition, rotating host · Prosperity +1 each year' },
      { id:'ports',  nm:'Open Ports',      d:'No member may embargo another · disputes go to the floor' } ] },
    { id:'dip', nm:'Diplomatic', col:'#57a5e0', tag:'the members abroad', laws:[
      { id:'recognition', nm:'Mutual Recognition', d:'All members recognize all members' },
      { id:'legations',   nm:'Shared Legations',   d:'Joint embassies in third countries · a Budget saving each' },
      { id:'bloc',        nm:'Bloc Voting',        d:'Members coordinate external votes · influence, pooled' } ] },
    { id:'mil', nm:'Military', col:'#e04444', tag:'arms among members', laws:[
      { id:'nonaggression', nm:'Non-Aggression Compact', d:'Members renounce force among themselves' },
      { id:'officer',       nm:'Officer Exchange',       d:'Academies swap cadets · Military Research + over time' },
      { id:'exercises',     nm:'Joint Exercises',        d:'Annual maneuvers · Armed Forces efficiency +' } ] },
    { id:'fin', nm:'Financial', col:'#e8c84a', tag:'money among members', laws:[
      { id:'settlement', nm:'The Settlement Bank', d:'Trade clears in members’ own currencies' },
      { id:'devpool',    nm:'Development Pool',    d:'Small joint fund · the poorest member draws grants' },
      { id:'debt',       nm:'Debt Courtesy',       d:'No member sanctions another’s default' } ] },
    { id:'res', nm:'Resource', col:'#e0920e', tag:'the ground beneath members', laws:[
      { id:'survey',    nm:'Survey Sharing',     d:'Geological data pooled · Innovation + for resource states' },
      { id:'reserves',  nm:'Emergency Reserves', d:'Members cover each other’s Energy shortfalls at cost' },
      { id:'pricenote', nm:'Price Notification', d:'Advance notice before quota or price moves' } ] }
  ];

  var ORG_ID = new URLSearchParams(location.search).get('id');
  var ME = null, CUR_TICK = 1, AM_FA = false, NATIONS = {}, BUSY = false;
  var O = null, MEMBERS = [], INVITES = [], VOTES = [], MSGS = [], LAWS = [], LAWVOTES = [];

  function natName(id) { return NATIONS[id] || id; }
  function amMember() { return MEMBERS.some(function (m) { return m.nation_id === ME; }); }
  function isHost() { return O && O.host_nation === ME; }

  // Strict-plurality winner of an article among current votes, or null (no votes / tie) — mirrors the server.
  function winnerOf(article) {
    var t = {};
    VOTES.forEach(function (v) { if (v.article === article) t[v.option] = (t[v.option] || 0) + 1; });
    var max = -1, who = null, tied = false;
    Object.keys(t).forEach(function (opt) { if (t[opt] > max) { max = t[opt]; who = opt; tied = false; } else if (t[opt] === max) { tied = true; } });
    return tied || who === null ? null : who;
  }
  function countOf(article, opt) { return VOTES.filter(function (v) { return v.article === article && v.option === opt; }).length; }
  function myVote(article) { var v = VOTES.find(function (x) { return x.article === article && x.nation_id === ME; }); return v && v.option; }
  function acceptedCount() { return INVITES.filter(function (i) { return i.status === 'accepted'; }).length; }
  function allDecided() { return ARTICLES.every(function (a) { return winnerOf(a.id) !== null; }); }

  async function run(fn) {
    if (BUSY) return; BUSY = true;
    try { const { error } = await fn(); if (error) throw error; await load(); }
    catch (e) { alert((e && e.message) || 'That action failed.'); }
    finally { BUSY = false; }
  }
  function castVote(article, opt) { run(function () { return supabase.rpc('cast_charter_ballot', { p_org: ORG_ID, p_votes: (function () { var o = {}; o[article] = opt; return o; })() }); }); }
  function ratify() { run(function () { return supabase.rpc('ratify_organization', { p_org: ORG_ID }); }); }
  function respond(accept) { run(function () { return supabase.rpc('respond_invitation', { p_org: ORG_ID, p_accept: accept }); }); }
  // Cancel a founding charter (host only): deletes the org + its invitations/votes/messages, then leaves
  // for the register — the detail page has nothing left to show.
  async function cancelCharter() {
    if (BUSY) return;
    if (!confirm('Cancel this charter? The organization, its invitations and any votes are deleted. This cannot be undone.')) return;
    BUSY = true;
    try {
      const { error } = await supabase.rpc('cancel_organization', { p_org: ORG_ID });
      if (error) throw error;
      window.location.href = '/play/organizations/';
    } catch (e) { alert((e && e.message) || 'Could not cancel the charter.'); BUSY = false; }
  }
  function proposeLaw(sector, law) { run(function () { return supabase.rpc('propose_org_law', { p_org: ORG_ID, p_sector: sector, p_law: law }); }); }
  function voteLaw(sector, law, aye) { run(function () { return supabase.rpc('vote_org_law', { p_org: ORG_ID, p_sector: sector, p_law: law, p_aye: aye }); }); }
  function lawRow(sector, law) { return LAWS.find(function (l) { return l.sector === sector && l.law_id === law; }); }
  function lawTally(sector, law) {
    var a = 0, n = 0, mine = null;
    LAWVOTES.forEach(function (v) { if (v.sector === sector && v.law_id === law) { if (v.vote === 'aye') a++; else n++; if (v.nation_id === ME) mine = v.vote; } });
    return { aye: a, nay: n, mine: mine };
  }

  function ageText() {
    if (!O || O.founded_tick == null) return '';
    var d = Math.max(0, CUR_TICK - O.founded_tick), y = Math.floor(d / 12), t = d % 12;
    return 'Age ' + y + 'y ' + t + 't';
  }
  function myStatus() {
    if (isHost()) return 'Founder';
    if (amMember()) return 'Member';
    var inv = INVITES.find(function (i) { return i.nation_id === ME; });
    if (inv) return inv.status === 'pending' ? 'Invited' : (inv.status === 'accepted' ? 'Accepted' : 'Declined');
    return 'Observer';
  }

  function renderStatus() {
    var founding = O.status === 'founding';
    var ca = O.charter_articles || {};
    var accession = ca.accession === 'closed' ? 'Closed Organization' : (ca.accession === 'open' ? 'Open Organization' : null);
    var sub = founding
      ? (O.org_type || 'General') + ' · Charter Convention · Host ' + esc(natName(O.host_nation))
      : (O.org_type || 'General') + (accession ? ' · ' + accession : '') + ' · Founded ' + esc(O.founded_tick != null ? tickToDate(O.founded_tick) : '—') + ' · ' + ageText();
    // Members + Your Status always; an active org also shows Applications and Secretary-General (both
    // deferred subsystems — honest current values: no applications yet, no S-G elected). A founding org
    // shows its convention stage instead.
    var stats = '<div class="hstat"><div class="v">' + MEMBERS.length + '</div><div class="k">Members</div></div>';
    if (!founding) stats += '<div class="hstat"><div class="v">0</div><div class="k">Applications</div></div>';
    stats += '<div class="hstat"><div class="v" style="color:var(--amber)">' + esc(myStatus()) + '</div><div class="k">Your Status</div></div>';
    if (!founding) stats += '<div class="hstat"><div class="v" style="color:var(--soft)">Vacant</div><div class="k">Secretary-General</div></div>';
    if (founding) {
      var ready = acceptedCount() >= MIN_ACCEPT && allDecided();
      stats += '<span class="stage' + (ready ? ' ready' : '') + '">◉ ' + (ready ? 'Ready to Ratify' : 'In Convention') + '</span>';
    }
    document.getElementById('statusWrap').innerHTML =
      '<div class="status"><div class="strow"><span class="oic">' + esc(O.emblem || '🕊') + '</span>' +
        '<div><div class="onm">' + esc(O.name) + '</div><div class="osub">' + sub + '</div></div>' +
        '<div class="spacer"></div>' + stats + '</div>' +
        (!founding && O.charter_articles ? '<div class="charterline">' + ARTICLES.map(function (a) {
          var pick = O.charter_articles[a.id];
          return '<span class="art">' + esc(a.label) + ': ' + esc((ARTLABEL[a.id] && ARTLABEL[a.id][pick]) || pick || '—') + '</span>';
        }).join('') + '</div>' : '') +
      '</div>';
  }

  function renderConvention() {
    // The Convention: members' Foreign Affairs ministers vote on each article; a strict plurality decides.
    var canVote = amMember() && AM_FA;
    var rows = ARTICLES.map(function (a) {
      var win = winnerOf(a.id), mine = myVote(a.id);
      var opts = a.opts.map(function (o) {
        var c = countOf(a.id, o.id), tot = MEMBERS.length || 1;
        return '<button class="opt' + (mine === o.id ? ' mine' : '') + (win === o.id ? ' win' : '') + '"' +
          ' data-art="' + a.id + '" data-opt="' + o.id + '"' + (canVote ? '' : ' disabled') + '>' +
          '<div class="ol">' + esc(o.label) + '</div>' +
          '<div class="optb"><span class="obar"><i style="width:' + Math.round(100 * c / tot) + '%"></i></span>' +
          '<span class="ocount">' + c + '</span></div></button>';
      }).join('');
      return '<div class="article"><div class="arttop"><span class="artnm">' + esc(a.label) + '</span>' +
        '<span class="artst' + (win ? ' decided' : '') + '">' + (win ? 'Decided · ' + esc(ARTLABEL[a.id][win]) : 'Undecided') + '</span></div>' +
        '<div class="opts">' + opts + '</div></div>';
    }).join('');

    var canRatify = isHost() && AM_FA && acceptedCount() >= MIN_ACCEPT && allDecided();
    var actionNote = !allDecided() ? 'every article needs a clear majority'
      : acceptedCount() < MIN_ACCEPT ? (acceptedCount() + ' of ' + MIN_ACCEPT + ' acceptances needed')
      : 'charter settled · ' + acceptedCount() + ' members';
    var myInv = INVITES.find(function (i) { return i.nation_id === ME; });
    var action = '';
    if (isHost() && AM_FA) {
      action = '<div class="frow"><button class="btn ratify" id="ratifyBtn"' + (canRatify ? '' : ' disabled') + '>Ratify — Found the Organization →</button>' +
        '<button class="btn no" id="cancelBtn">Cancel Charter</button><span class="fnote">' + actionNote + '</span></div>';
    } else if (myInv && myInv.status === 'pending' && AM_FA) {
      action = '<div class="frow"><button class="btn go" id="accBtn">Accept — Join</button><button class="btn no" id="decBtn">Decline</button><span class="fnote">answering costs 1 AP</span></div>';
    } else if (!AM_FA && (amMember() || (myInv && myInv.status === 'pending'))) {
      action = '<div class="frow"><span class="fnote">Your Minister of Foreign Affairs casts your nation’s votes and answers for you.</span></div>';
    }

    return '<div class="card"><div class="sect">Charter Convention <span class="note">' +
        (canVote ? 'cast your nation’s vote on each article — a clear majority decides' : 'members vote on each article — a clear majority decides') + '</span></div>' +
      rows +
      '<div class="ballotnote">' + (amMember()
        ? (AM_FA ? 'You vote for ' + esc(natName(ME)) + '. Change a vote any time before ratification.' : 'Only your Foreign Affairs minister may vote.')
        : 'Only member nations vote in the convention.') + '</div>' +
      action + '</div>';
  }

  function renderRoster() {
    var rows = MEMBERS.slice().sort(function (a, b) { return (a.role === 'founder' ? 0 : 1) - (b.role === 'founder' ? 0 : 1) || natName(a.nation_id).localeCompare(natName(b.nation_id)); })
      .map(function (m) {
        return '<div class="rrow"><span class="rname">' + esc(natName(m.nation_id)) + (m.nation_id === ME ? ' — you' : '') + '</span>' +
          '<span class="rrole' + (m.role === 'founder' ? ' founder' : '') + '">' + (m.role === 'founder' ? 'Founder' : 'Member') + '</span></div>';
      }).join('');
    return '<div class="card"><div class="sect">Members <span class="note">' + MEMBERS.length + ' seated</span></div><div class="roster">' + rows + '</div></div>';
  }

  function renderChat() {
    var floor = document.getElementById('floorMembers');
    floor.textContent = MEMBERS.map(function (m) { return natName(m.nation_id); }).join(' · ');
    var box = document.getElementById('msgs');
    if (!amMember()) {
      box.innerHTML = '<div class="cempty">The Assembly Floor is open to member nations.<br>Join the organization to take the floor.</div>';
      return;
    }
    box.innerHTML = MSGS.length ? MSGS.map(function (m) {
      var you = m.nation_id === ME;
      return '<div class="msg' + (you ? ' you' : '') + '"><div class="who">' + esc(natName(m.nation_id)) +
        '<span class="tm">' + esc((m.created_at || '').slice(11, 16)) + '</span></div>' + esc(m.body) + '</div>';
    }).join('') : '<div class="cempty">No one has spoken yet.<br>Open the floor.</div>';
    box.scrollTop = box.scrollHeight;
    var input = document.getElementById('chatIn'), btn = document.getElementById('sendBtn');
    input.disabled = false; btn.disabled = false;
  }

  // Laws of the Assembly (active orgs): six sectors of Level I laws — propose, vote Aye/Nay, a majority
  // enacts. Levels II–V are age-gated (deferred) and shown locked.
  function renderLaws() {
    var canAct = amMember() && AM_FA;
    var enacted = LAWS.filter(function (l) { return l.status === 'enacted'; }).length;
    var agenda = LAWS.filter(function (l) { return l.status === 'proposed'; }).length;
    var branches = LAWS_CAT.map(function (br) {
      var laws = br.laws.map(function (l) {
        var row = lawRow(br.id, l.id), st = row && row.status, action;
        if (st === 'enacted') {
          action = '<span class="enacted">✓ Enacted</span>';
        } else if (st === 'proposed') {
          var t = lawTally(br.id, l.id);
          // Non-members can't read the vote rows (RLS), so don't show them a misleading 0/0 tally.
          var tally = '<span class="agtally">On the agenda' + (amMember() ? ' · ' + t.aye + ' aye · ' + t.nay + ' nay' : '') + '</span>';
          action = canAct
            ? tally + '<button class="lbtn aye' + (t.mine === 'aye' ? ' on' : '') + '" data-vote="aye" data-s="' + br.id + '" data-l="' + l.id + '">Aye</button>' +
                      '<button class="lbtn nay' + (t.mine === 'nay' ? ' on' : '') + '" data-vote="nay" data-s="' + br.id + '" data-l="' + l.id + '">Nay</button>'
            : tally;
        } else {
          action = canAct
            ? '<button class="lbtn" data-prop="1" data-s="' + br.id + '" data-l="' + l.id + '">Propose</button>' + (st === 'rejected' ? '<span class="lnote">last vote failed</span>' : '')
            : '<span class="lnote">' + (st === 'rejected' ? 'not adopted' : 'not yet moved') + '</span>';
        }
        return '<div class="blaw"><div class="bn">' + esc(l.nm) + '</div><div class="bd">' + esc(l.d) + '</div><div class="brow">' + action + '</div></div>';
      }).join('');
      return '<div class="branch"><div class="brhead"><span class="brdot" style="background:' + br.col + '"></span>' +
        '<span class="brnm">' + esc(br.nm) + ' · Level I</span><span class="brtag">' + esc(br.tag) + '</span>' +
        '<span class="brlock">🔒 II–V · with age</span></div>' +
        '<div class="brlaws">' + laws + '</div>' +
        (br.note ? '<div class="govnote">' + br.note + '</div>' : '') + '</div>';
    }).join('');
    return '<div class="card"><div class="sect">Laws of the Assembly <span class="note">Level I · propose a law, members vote, a majority enacts it' +
      (enacted ? ' · ' + enacted + ' enacted' : '') + (agenda ? ' · ' + agenda + ' on the agenda' : '') + '</span></div>' + branches + '</div>';
  }

  // Upcoming Agenda — a READ-ONLY summary of the laws currently on the floor (the Aye/Nay voting itself
  // stays inline on each law above: one source). No fabricated tick items; the org's business is its votes.
  function renderAgenda() {
    var open = [];
    LAWS_CAT.forEach(function (br) { br.laws.forEach(function (l) {
      var row = lawRow(br.id, l.id);
      if (row && row.status === 'proposed') open.push({ br: br, l: l });
    }); });
    var body = open.length ? open.map(function (o) {
      var t = lawTally(o.br.id, o.l.id);
      var dd = o.br.nm + ' · Level I' + (amMember() ? ' · ' + t.aye + ' aye · ' + t.nay + ' nay' : '');
      return '<div class="dk"><span class="dic">📜</span><div><div class="dn">Law Vote: ' + esc(o.l.nm) + '</div>' +
        '<div class="dd">' + esc(dd) + '</div></div><span class="dwhen">On the floor</span></div>';
    }).join('') : '<div class="dkempty">No business before the Assembly — move a law from the sectors above.</div>';
    return '<div class="card"><div class="sect">Upcoming Agenda <span class="note">open votes on the floor · cast Aye or Nay on each law above</span></div>' + body + '</div>';
  }

  function wire() {
    document.querySelectorAll('.opt[data-art]').forEach(function (b) {
      b.onclick = function () { if (!b.disabled) castVote(b.dataset.art, b.dataset.opt); };
    });
    var r = document.getElementById('ratifyBtn'); if (r) r.onclick = function () { if (!r.disabled) ratify(); };
    var cx = document.getElementById('cancelBtn'); if (cx) cx.onclick = cancelCharter;
    var a = document.getElementById('accBtn'); if (a) a.onclick = function () { respond(true); };
    var d = document.getElementById('decBtn'); if (d) d.onclick = function () { if (confirm('Decline this invitation?')) respond(false); };
    document.querySelectorAll('[data-prop]').forEach(function (b) { b.onclick = function () { if (!b.disabled) proposeLaw(b.dataset.s, b.dataset.l); }; });
    document.querySelectorAll('[data-vote]').forEach(function (b) { b.onclick = function () { if (!b.disabled) voteLaw(b.dataset.s, b.dataset.l, b.dataset.vote === 'aye'); }; });
  }

  async function load() {
    var org = (await supabase.from('organizations').select('id, host_nation, name, emblem, org_type, status, founded_tick, charter_articles').eq('id', ORG_ID).maybeSingle()).data;
    if (!org) { document.getElementById('statusWrap').innerHTML = '<div class="empty">Organization not found.</div>'; return; }
    O = org;
    MEMBERS = (await supabase.from('organization_members').select('nation_id, role').eq('org_id', ORG_ID)).data || [];
    INVITES = (await supabase.from('organization_invitations').select('nation_id, status').eq('org_id', ORG_ID)).data || [];
    VOTES = (await supabase.from('organization_charter_votes').select('nation_id, article, option').eq('org_id', ORG_ID)).data || [];   // RLS: members only
    MSGS = (await supabase.from('organization_messages').select('nation_id, body, created_at').eq('org_id', ORG_ID).order('created_at', { ascending: true }).limit(200)).data || [];
    LAWS = (await supabase.from('organization_laws').select('sector, law_id, status').eq('org_id', ORG_ID)).data || [];   // public register
    LAWVOTES = (await supabase.from('organization_law_votes').select('sector, law_id, nation_id, vote').eq('org_id', ORG_ID)).data || [];   // RLS: members only

    document.title = (O.name || 'Organization') + ' · Nationhood';
    renderStatus();
    // Founding: convention + roster on the left, the Floor as a right sidebar. Active: the Floor moves
    // full-width above, and the left column becomes the laws + the agenda summary (mockup layout).
    var founding = O.status === 'founding';
    var layout = document.getElementById('layout'), chatBox = document.getElementById('chatBox');
    if (founding) {
      layout.classList.remove('solo'); chatBox.classList.remove('top'); layout.appendChild(chatBox);
      document.getElementById('leftcol').innerHTML = renderConvention() + renderRoster();
    } else {
      layout.classList.add('solo'); chatBox.classList.add('top'); document.getElementById('topSlot').appendChild(chatBox);
      document.getElementById('leftcol').innerHTML = renderLaws() + renderAgenda();
    }
    layout.style.display = '';
    wire();
    renderChat();
  }

  async function sendMsg() {
    var input = document.getElementById('chatIn'); var body = input.value.trim();
    if (!body || BUSY) return;
    input.value = '';
    await run(function () { return supabase.rpc('post_org_message', { p_org: ORG_ID, p_body: body }); });
  }

  (async () => {
    if (!isConfigured) return;
    const user = await requireUser();
    if (!user) return;
    if (!ORG_ID) { document.getElementById('statusWrap').innerHTML = '<div class="empty">No organization selected.</div>'; return; }
    try {
      const { data: party } = await supabase.from('parties').select('nation_id').eq('user_id', user.id).single();
      if (!party) { window.location.replace('/nation-select/'); return; }
      ME = party.nation_id;
      try { const { data: gs } = await supabase.from('game_state').select('current_tick').maybeSingle(); CUR_TICK = (gs && gs.current_tick) || 1; } catch (e) {}
      const { data: nats } = await supabase.from('nations').select('id, name');
      (nats || []).forEach(function (n) { NATIONS[n.id] = n.name; });
      try { const { data: fa } = await supabase.rpc('is_foreign_affairs_minister'); AM_FA = fa === true; } catch (e) {}

      document.getElementById('sendBtn').onclick = sendMsg;
      document.getElementById('chatIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') sendMsg(); });

      await load();
    } catch (e) {
      document.getElementById('statusWrap').innerHTML = '<div class="empty">Couldn’t load this organization. Refresh to try again.</div>';
    }
  })();
</script>
</body>
</html>
