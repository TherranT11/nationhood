<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/theme.js"></script>
<title>Events · Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/play.css">
<style>
  /* The Events page is deliberately its own dark canvas (a self-contained look), scoped to .evroot so the
     shared sidenav + topbar keep the site theme. Palette + type mirror the streamlined mockup. */
  .main{flex:1;min-width:0;padding:0}
  .evroot{--bg:#0f1116;--panel:#14161d;--panel2:#1b1e28;--line:#232838;--text:#e8ebf2;--muted:#8a93a8;
    --dim:#5c657b;--orange:#f0a03c;--green:#3ecf8e;--red:#e5604c;--accent:#7c83f7;
    font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:22px clamp(16px,3vw,28px) 56px}
  .ev-wrap{max-width:1180px;margin:0 auto}
  .ev-mono{font-family:'JetBrains Mono',monospace}
  .ev-micro{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.15em;color:var(--dim);text-transform:uppercase}

  /* header + tempo strip */
  .ev-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;flex-wrap:wrap;gap:12px}
  .ev-title{font-weight:800;font-size:24px}
  .ev-tempo{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .ev-tchip{display:flex;align-items:center;gap:5px;padding:4px 8px;border-radius:8px;background:var(--panel);border:1.5px solid var(--line)}
  .ev-tchip.you{border-color:var(--orange)}
  .ev-tchip .pos{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--dim)}
  .ev-tchip .dot{width:8px;height:8px;border-radius:2px;flex:none}
  .ev-tchip .abbr{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:800}
  .ev-pass{font-family:'JetBrains Mono',monospace;margin-left:6px;background:var(--panel);border:1.5px solid var(--green);
    color:var(--green);border-radius:8px;padding:6px 12px;font-size:9.5px;font-weight:800;letter-spacing:.06em;cursor:pointer}
  .ev-pass.on{background:var(--green);color:#0a0d13}
  .ev-pass[disabled]{opacity:.5;cursor:default}

  /* columns */
  .ev-cols{display:flex;gap:18px;flex-wrap:wrap}
  /* bases sized to sit side-by-side alongside the shared sidenav (narrower than the mockup's full width) */
  .ev-tablecol{flex:2 1 440px;min-width:420px}
  .ev-feedcol{flex:1 1 300px;min-width:280px}
  .ev-panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .ev-panelhd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .ev-tablegrid{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap}
  .ev-colhd{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
  .ev-divider{width:1px;align-self:stretch;border-left:1px dashed #2e3448;margin:22px 2px 0}
  .ev-cardrow{display:flex;gap:16px;flex-wrap:wrap}

  /* game card */
  .gamecard{width:236px;background:linear-gradient(180deg,#1a1d27,#14161d);border:1px solid var(--line);
    border-radius:14px;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.45);transition:transform .15s}
  .gamecard:hover{transform:translateY(-5px)}
  .gamecard.up{border:1px dashed #2e3448;opacity:.95}
  .gc-band{height:5px}
  .gc-body{padding:11px 13px 13px}
  .gc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .gc-tag{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.12em;border-radius:5px;padding:2px 7px;display:inline-flex;align-items:center;gap:3px}
  .gc-ap{width:26px;height:26px;border-radius:13px;background:var(--orange);color:#0a0d13;display:flex;align-items:center;
    justify-content:center;font-weight:800;font-family:'JetBrains Mono',monospace;font-size:12px;box-shadow:0 0 0 3px rgba(240,160,60,.18);flex:none}
  .gc-well{height:74px;background:radial-gradient(circle at 50% 40%,#232838,#181b24);border-radius:10px;margin:10px 0;
    display:flex;align-items:center;justify-content:center;font-size:32px;border:1px solid #20242f;overflow:hidden}
  .gc-well img{width:100%;height:100%;object-fit:cover}
  .gc-title{font-weight:800;font-size:15px;line-height:1.2}
  .gc-flavor{font-size:11px;color:var(--muted);line-height:1.45;margin:6px 0 11px;min-height:48px;font-style:italic}
  .gc-claims{display:flex;gap:5px}
  .claimbtn{flex:1;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:800;letter-spacing:.04em;
    padding:7px 4px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer;text-align:center;line-height:1.3}
  .claimbtn:hover:not([disabled]){border-color:var(--orange);color:var(--orange)}
  .claimbtn.on{border-color:var(--orange);color:var(--orange);background:rgba(240,160,60,.12)}
  .claimbtn[disabled]{opacity:.5;cursor:default}
  .gc-hold{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.1em;color:var(--dim);
    border:1px dashed var(--line);border-radius:7px;padding:9px 4px;text-align:center}
  .gc-others{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--dim);margin-top:7px;letter-spacing:.04em}

  /* feed */
  .ev-tabs{display:flex;gap:4px;margin-bottom:10px}
  .ev-tab{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;padding:6px 13px;cursor:pointer;color:var(--dim);border-radius:7px;font-weight:700}
  .ev-tab.on{background:var(--panel2);color:var(--text)}
  .ev-row{padding:8px 0;border-top:1px solid #1c212e}
  .ev-row:first-child{border-top:none}
  .ev-row .when{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.1em;color:var(--dim);margin-bottom:3px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  .ev-row .body{font-size:12.5px;line-height:1.45;color:var(--text)}
  .ev-empty{color:var(--dim);font-size:12px;padding:12px 2px}

  /* government decisions banner */
  .ev-decisions{margin-bottom:16px}
  .deccard{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;padding:14px 16px;margin-bottom:10px}
  .deccard.mine{border-left-color:var(--orange)}
  .dechd{font-weight:800;font-size:15px}
  .decdesc{font-size:12px;color:var(--muted);line-height:1.45;margin-top:4px}
  .decwho{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;margin:8px 0}
  .decwho.mine{color:var(--orange)}
  .decopts{display:flex;gap:8px;flex-wrap:wrap}
  .decopt{font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
  .decopt:hover:not(:disabled){border-color:var(--accent)}
  .decopt.wait{color:var(--dim);cursor:default}
  .decopt:disabled{opacity:.5}
  .reltag{font-family:'JetBrains Mono',monospace;font-size:8.5px;color:var(--dim)}
  .relpickrow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .rplab{font-size:11px;color:var(--muted)}
  .relselect{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-family:inherit;font-size:12px}
  .relgo,.relcancel{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:6px 12px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
  .relgo{border-color:var(--green);color:var(--green)}

  /* nation flag chips + coloured mentions in the feed/decisions */
  .nflag{width:13px;height:9px;object-fit:cover;border-radius:1px;vertical-align:-1px;margin-right:3px}
  .ntag{font-weight:700;display:inline-flex;align-items:center}
  .nmention{font-weight:700}
  .ev-err{color:var(--red);font-size:13px;padding:16px 2px}

  @media(max-width:920px){.ev-tablecol{min-width:0;flex:1 1 100%}.ev-feedcol{flex:1 1 100%}.ev-divider{display:none}}
</style>
</head>
<body>
<div class="app">
  <div id="sidenav"></div>

  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="evroot">
      <div class="ev-wrap">

        <!-- header + tempo strip -->
        <div class="ev-head">
          <div>
            <div class="ev-title">Events</div>
            <div class="ev-micro" id="evMicro" style="margin-top:3px">Loading…</div>
          </div>
          <div class="ev-tempo" id="evTempo"></div>
        </div>

        <!-- Government decisions (a played Choice card demands a call) — the first thing shown when pending. -->
        <div class="ev-decisions">
          <div class="ev-micro" id="evDecLabel" style="display:none;margin-bottom:8px">Government Decisions · a played card demands a choice</div>
          <div id="evDecisions"></div>
        </div>

        <div class="ev-cols">
          <!-- THE TABLE -->
          <div class="ev-tablecol">
            <div class="ev-panel">
              <div class="ev-panelhd">
                <div class="ev-micro">On the table — one claim per party, in tempo order</div>
                <span class="ev-mono" style="font-size:9px;color:var(--dim)" title="EVENT plays the card (−5 tempo) · AP banks its Action Points (−3 tempo) · BOTH takes both and drops you last · PASS jumps first next turn">? claims</span>
              </div>
              <div class="ev-tablegrid">
                <div>
                  <div class="ev-colhd"><div class="ev-micro">On the table</div></div>
                  <div class="ev-cardrow" id="evOnTable"><div class="ev-empty">Loading cards…</div></div>
                </div>
                <div class="ev-divider"></div>
                <div>
                  <div class="ev-colhd"><div class="ev-micro">Next turn</div></div>
                  <div class="ev-cardrow" id="evNextTurn"><div class="ev-empty">Loading…</div></div>
                </div>
              </div>
            </div>
          </div>

          <!-- THE FEED -->
          <div class="ev-feedcol">
            <div class="ev-panel">
              <div class="ev-tabs" id="evTabs">
                <div class="ev-tab on" data-tab="nation">NATION</div>
                <div class="ev-tab" data-tab="world">WORLD</div>
              </div>
              <div id="evFeed"><div class="ev-empty">Loading…</div></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>
</div>

<script type="module">
  import { supabase, isConfigured, requireUser } from '/supabase.js';
  import { mountTopbar, setTopbarActions } from '/topbar.js';
  import { mountSidenav } from '/sidenav.js';
  import { esc, tickToDate } from '/util.js';
  import { ideologyLabel, partyColor } from '/archetypes.js';

  mountTopbar();
  mountSidenav();

  var PARTY = null, NATION_ID = null, NATION_NAME = '', BUSY = false;
  var CUR_TICK = 1;               // current month, for the header line
  var NATIONS = {};               // nation id → name, for the world feed tags + inline mentions
  var NATION_FLAGS = {};          // nation id → flag URL
  var PARTY_NATION = {};          // party id → nation id, to attribute broadcast events to their AUTHOR nation
  var EVENTS = [], WORLD = [], FEED_TAB = 'nation';   // the two feeds + which tab is showing
  // Party micro-actions stay off the World feed — it's for nation-scale news.
  var LOCAL_KINDS = { rally:1, fundraise:1, attack:1, adblitz:1, recruit:1, party:1 };

  // ---- Government decisions (from played Choice cards) ---------------------------------------------
  function partyLabel(id) { var p = (window.__roster || []).find(function (x) { return x.id === id; }); return p ? (p.abbreviation || p.name) : 'a party'; }
  function renderDecisions(decs) {
    var wrap = document.getElementById('evDecisions'), label = document.getElementById('evDecLabel');
    if (!decs.length) { label.style.display = 'none'; wrap.innerHTML = ''; return; }
    label.style.display = '';
    wrap.innerHTML = decs.map(function (d) {
      var mine = PARTY && d.resolver_party_id === PARTY.id;
      var opts = Array.isArray(d.options) ? d.options : [];
      var hdlr = d.handler === 'hog' ? 'the Head of Government'
        : (d.handler && d.handler !== 'player') ? 'the ' + esc(d.handler) + ' minister' : null;
      var who = mine ? 'Your call' : ('Awaiting ' + (hdlr ? hdlr + ' (' + esc(partyLabel(d.resolver_party_id)) + ')' : esc(partyLabel(d.resolver_party_id))));
      return '<div class="deccard' + (mine ? ' mine' : '') + '"><div class="dechd">' + esc(d.card_name || 'A decision') + '</div>' +
        (d.card_desc ? '<div class="decdesc">' + esc(d.card_desc) + '</div>' : '') +
        '<div class="decwho' + (mine ? ' mine' : '') + '">' + who + '</div>' +
        '<div class="decopts">' + opts.map(function (o, i) {
          var lbl = esc((o && o.txt) || ('Option ' + (i + 1)));
          var needN = optNeedsNation(o) ? ' <span class="reltag">· pick a nation</span>' : '';
          return mine
            ? '<button class="decopt" data-dec="' + d.id + '" data-opt="' + i + '"' + (optNeedsNation(o) ? ' data-relpick="1"' : '') + '>' + lbl + needN + '</button>'
            : '<span class="decopt wait">' + lbl + '</span>';
        }).join('') + '</div></div>';
    }).join('');
    wrap.querySelectorAll('[data-dec]').forEach(function (b) {
      b.onclick = function () {
        if (b.dataset.relpick) { openNationPick(b.dataset.dec, +b.dataset.opt, b); return; }
        decideCard(b.dataset.dec, +b.dataset.opt);
      };
    });
  }
  // An option carrying a rel_pick effect must name the nation before it resolves.
  function optNeedsNation(o) {
    var fx = (o && Array.isArray(o.fx)) ? o.fx : (o && o.kind ? [o] : []);
    return fx.some(function (e) { return e && e.kind === 'rel_pick'; });
  }
  function openNationPick(id, opt, btn) {
    var card = btn.closest('.deccard'); if (!card || card.querySelector('.relpickrow')) return;
    var others = Object.keys(NATIONS).filter(function (nid) { return nid !== NATION_ID; })
      .sort(function (a, b) { return (NATIONS[a] || '').localeCompare(NATIONS[b] || ''); });
    if (!others.length) { alert('No other nation to improve relations with.'); return; }
    card.querySelectorAll('.decopt').forEach(function (x) { x.disabled = true; });
    var row = document.createElement('div'); row.className = 'relpickrow';
    row.innerHTML = '<label class="rplab">Improve relations with</label>' +
      '<select class="relselect">' + others.map(function (nid) { return '<option value="' + esc(nid) + '">' + esc(NATIONS[nid]) + '</option>'; }).join('') + '</select>' +
      '<button class="relgo" type="button">Confirm</button><button class="relcancel" type="button">Cancel</button>';
    card.appendChild(row);
    row.querySelector('.relcancel').onclick = function () { row.remove(); card.querySelectorAll('.decopt').forEach(function (x) { x.disabled = false; }); };
    row.querySelector('.relgo').onclick = function () { var nid = row.querySelector('.relselect').value; if (nid) decideCard(id, opt, nid); };
  }

  // ---- feed helpers (nation-coloured mentions + flags) --------------------------------------------
  function nationColor(id) {
    var h = 0; String(id || '').split('').forEach(function (c) { h = (h * 31 + c.charCodeAt(0)) >>> 0; });
    return 'hsl(' + (h % 360) + ' 68% 62%)';
  }
  function escapeRegex(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  function flagChip(id) { var f = NATION_FLAGS[id]; return f ? '<img class="nflag" src="' + esc(f) + '" alt="">' : ''; }
  function nationTag(id) {
    if (!id) return '';
    return '<span class="ntag" style="color:' + nationColor(id) + '">' + flagChip(id) + esc(NATIONS[id] || id) + '</span>';
  }
  function decorateBody(body) {
    var safe = esc(body || '').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
    var names = Object.keys(NATIONS).map(function (id) { return { id: id, name: NATIONS[id] }; })
      .filter(function (x) { return x.name; }).sort(function (a, b) { return b.name.length - a.name.length; });
    if (!names.length) return safe;
    var byName = {}; names.forEach(function (x) { byName[x.name] = x.id; });
    var re = new RegExp('\\b(' + names.map(function (x) { return escapeRegex(esc(x.name)); }).join('|') + ')\\b', 'g');
    return safe.replace(re, function (m) {
      var id = byName[m]; if (!id) return m;
      return '<span class="nmention" style="color:' + nationColor(id) + '">' + flagChip(id) + m + '</span>';
    });
  }
  // The tabbed feed reads the already-loaded EVENTS / WORLD arrays — no refetch on tab switch.
  function renderFeed() {
    var el = document.getElementById('evFeed'), world = FEED_TAB === 'world', list = world ? WORLD : EVENTS;
    document.querySelectorAll('#evTabs .ev-tab').forEach(function (t) { t.classList.toggle('on', t.dataset.tab === FEED_TAB); });
    if (!list.length) { el.innerHTML = '<div class="ev-empty">No events yet.</div>'; return; }
    el.innerHTML = list.map(function (e) {
      var tag = world ? nationTag(e.author_nation || e.nation_id) : '';
      return '<div class="ev-row"><div class="when">' + esc((e.game_date || '').replace(',', '')) + tag + '</div>' +
        '<div class="body">' + decorateBody(e.body || '') + '</div></div>';
    }).join('');
  }
  document.getElementById('evTabs').addEventListener('click', function (ev) {
    var t = ev.target.closest('.ev-tab'); if (!t) return; FEED_TAB = t.dataset.tab; renderFeed();
  });

  // ---- tempo strip + the card table ---------------------------------------------------------------
  // Claim order = real Tempo standing (schema/206), highest first; id breaks ties. The pass button rides
  // in the strip (one party may pass per turn; it jumps first next turn).
  function renderTempo(parties, mine) {
    var row = document.getElementById('evTempo');
    var order = parties.slice().sort(function (a, b) { return (Number(b.tempo) || 0) - (Number(a.tempo) || 0) || String(a.id).localeCompare(String(b.id)); });
    var chips = order.map(function (p, i) {
      var you = PARTY && p.id === PARTY.id, col = partyColor(p);
      return '<div class="ev-tchip' + (you ? ' you' : '') + '" title="' + esc(p.name || '') + '">' +
        '<span class="pos">' + (i + 1) + '</span><span class="dot" style="background:' + col + '"></span>' +
        '<span class="abbr" style="color:' + (you ? 'var(--orange)' : col) + '">' + esc(p.abbreviation || p.name || '—') + '</span></div>';
    }).join('');
    var passOn = mine && mine.action === 'pass';
    var pass = '<button class="ev-pass js-claim' + (passOn ? ' on' : '') + '" data-card="" data-action="pass"' + (BUSY ? ' disabled' : '') + '>🕊 PASS → FIRST NEXT TURN</button>';
    row.innerHTML = '<span class="ev-micro" style="margin-right:2px">Tempo</span>' + (chips || '<span class="ev-micro">no parties yet</span>') + pass;
  }

  function cardKind(def) {
    if (def.lim === 'nation') return { label: 'Nation · ' + (NATION_NAME || 'this nation'), nation: true };
    if (def.type === 'ar' || def.type === 'dr') return { label: 'Stance', nation: false };
    return { label: 'Generic', nation: false };
  }
  function cardAP(def) { return Math.max(1, Math.min(10, Number(def.acts) || 1)); }   // 1–10, the AP the resolver banks
  // Hex accent per kind (this page is its own palette, so no theme vars): nation green, stance orange, generic accent.
  function cardColor(def) { return def.lim === 'nation' ? '#2c8c5a' : (def.type === 'ar' || def.type === 'dr' ? '#f0a03c' : '#7c83f7'); }
  // The art well: the nation's flag for a Nation card, else a kind glyph (decorative — cards carry no art).
  function cardIcon(def) {
    if (def.lim === 'nation') return NATION_FLAGS[NATION_ID] ? '<img src="' + esc(NATION_FLAGS[NATION_ID]) + '" alt="">' : '🏛️';
    return (def.type === 'ar' || def.type === 'dr') ? '⚖️' : '📜';
  }

  // One game card. `upcoming` swaps the claim row for a hold banner (claims open at the next tick).
  function gcCard(c, ctx) {
    var def = c.definition || {}, k = cardKind(def), ap = cardAP(def), col = cardColor(def), upcoming = ctx.upcoming;
    var mine = ctx.mine, claims = ctx.claims || [], abbr = ctx.abbr || {};
    function cbtn(action, label) {
      var on = mine && mine.action === action && String(mine.deck_card_id) === String(c.id);
      return '<button class="claimbtn js-claim' + (on ? ' on' : '') + '" data-card="' + esc(c.id) + '" data-action="' + action + '"' + (BUSY ? ' disabled' : '') + '>' + label + '</button>';
    }
    var others = claims.filter(function (x) { return String(x.deck_card_id) === String(c.id) && (!mine || x.party_id !== mine.party_id); })
      .map(function (x) { return esc(abbr[x.party_id] || '?') + '·' + String(x.action).toUpperCase(); });
    var foot = upcoming
      ? '<div class="gc-hold">⏳ IN PLAY NEXT TURN — CLAIMS OPEN AT TICK</div>'
      : '<div class="gc-claims">' + cbtn('event', '★ EVENT<br>−5 TEMPO') + cbtn('ap', '⚡ AP ×' + ap + '<br>−3 TEMPO') + cbtn('both', '🔥 BOTH<br>→ LAST') + '</div>' +
        (others.length ? '<div class="gc-others">also claimed: ' + others.join(' · ') + '</div>' : '');
    return '<div class="gamecard' + (upcoming ? ' up' : '') + '">' +
      '<div class="gc-band" style="background:' + col + '"></div>' +
      '<div class="gc-body">' +
        '<div class="gc-top"><span class="gc-tag" style="color:' + col + ';border:1px solid ' + col + '55">' +
          (k.nation ? flagChip(NATION_ID) : '') + esc(k.label).toUpperCase() + '</span>' +
          '<span class="gc-ap" title="Action Points on play">' + ap + '</span></div>' +
        '<div class="gc-well">' + cardIcon(def) + '</div>' +
        '<div class="gc-title">' + esc(def.name || 'Untitled card') + '</div>' +
        '<div class="gc-flavor">' + (def.desc ? esc(def.desc) : 'No description.') + '</div>' +
        foot +
      '</div></div>';
  }

  function renderTable(active, upcoming, ctx) {
    document.getElementById('evOnTable').innerHTML = active.length
      ? active.map(function (c) { return gcCard(c, { claims: ctx.claims, mine: ctx.mine, abbr: ctx.abbr }); }).join('')
      : '<div class="ev-empty">The market is empty this turn — no cards on the table.</div>';
    document.getElementById('evNextTurn').innerHTML = upcoming.length
      ? upcoming.map(function (c) { return gcCard(c, { upcoming: true }); }).join('')
      : '<div class="ev-empty">No further cards queued this turn.</div>';
  }

  // ---- claims + decisions go through run() for the shared BUSY lock + reload ----------------------
  async function claim(cardId, action) {
    await run(function () { return supabase.rpc('claim_card', { p_deck_card: (action === 'pass' ? null : cardId), p_action: action }); });
  }
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest && ev.target.closest('.js-claim');
    if (!b || b.disabled) return;
    claim(b.dataset.card || null, b.dataset.action);
  });
  async function decideCard(id, opt, nation) { await run(function () { return supabase.rpc('card_decide', { p_decision: id, p_option: opt, p_nation: nation || null }); }); }
  async function run(fn) {
    if (BUSY) return; BUSY = true; setDisabled(true);
    try {
      const { error } = await fn();
      if (error) throw error;
      await loadAll();
    } catch (e) {
      alert((e && e.message) || 'That action failed.');
    } finally { BUSY = false; setDisabled(false); }
  }
  function setDisabled(on) { document.querySelectorAll('.js-claim, .decopt').forEach(function (b) { b.disabled = on; }); }

  function setMicro() {
    document.getElementById('evMicro').textContent = esc(NATION_NAME) + ' · ' + esc(tickToDate(CUR_TICK)) + ' · claim resolves at next tick';
  }

  async function loadAll() {
    try {
      const { data: p } = await supabase.from('parties').select('id, influence').eq('user_id', PARTY.user_id).single();
      if (p) { PARTY = Object.assign(PARTY, p); setTopbarActions(PARTY.influence); }
    } catch (e) { /* keep the last known party */ }

    var roster = [], events = [], world = [], decisions = [], cards = [], claims = [], mine = null, abbr = {};
    try {
      // One party read powers the decision labels AND the Tempo strip. Resilient to drift: fall back if the
      // tempo columns (schema/206) aren't deployed yet.
      var pq = await supabase.from('parties').select('id, name, abbreviation, archetype, color, seats, tempo, tempo_miss').eq('nation_id', NATION_ID).order('name', { ascending: true }).order('id', { ascending: true });
      if (pq.error) pq = await supabase.from('parties').select('id, name, abbreviation, archetype, color, seats, tempo').eq('nation_id', NATION_ID).order('name', { ascending: true }).order('id', { ascending: true });
      if (pq.error) pq = await supabase.from('parties').select('id, name, abbreviation, archetype, color, seats').eq('nation_id', NATION_ID).order('name', { ascending: true }).order('id', { ascending: true });
      roster = pq.data || [];
    } catch (e) {}
    window.__roster = roster;
    roster.forEach(function (p) { abbr[p.id] = p.abbreviation || p.name; });
    try {
      const { data } = await supabase.from('deck_cards').select('id, created_at, cards(definition)').eq('nation_id', NATION_ID).eq('status', 'on_block').order('created_at', { ascending: true });
      cards = (data || []).map(function (r) { return { id: r.id, definition: (r.cards && r.cards.definition) || {} }; });
    } catch (e) {}
    try {
      const { data } = await supabase.from('card_claims').select('party_id, deck_card_id, action').eq('nation_id', NATION_ID).eq('tick', CUR_TICK);
      claims = data || [];
      mine = claims.find(function (x) { return PARTY && x.party_id === PARTY.id; }) || null;
    } catch (e) {}
    try {
      const { data } = await supabase.from('events').select('kind, body, game_date, created_at').eq('nation_id', NATION_ID).order('created_at', { ascending: false }).limit(25);
      events = data || [];
    } catch (e) {}
    try {
      // World feed: nation-scale news from OTHER nations, party micro-actions filtered out, deduped by body,
      // each row re-tagged with its AUTHOR nation (via party_id); the player's own broadcasts drop out.
      const { data } = await supabase.from('events').select('kind, body, game_date, created_at, nation_id, party_id').neq('nation_id', NATION_ID).order('created_at', { ascending: false }).limit(60);
      var seen = {};
      world = (data || []).map(function (e) {
        return Object.assign({}, e, { author_nation: (e.party_id && PARTY_NATION[e.party_id]) || e.nation_id });
      }).filter(function (e) {
        if (LOCAL_KINDS[e.kind]) return false;
        if (e.author_nation === NATION_ID) return false;
        if (seen[e.body]) return false;
        seen[e.body] = 1; return true;
      }).slice(0, 15);
    } catch (e) {}
    try {
      var decSel = 'id, card_name, card_desc, options, handler, resolver_party_id';
      var q = await supabase.from('card_decisions').select(decSel).eq('nation_id', NATION_ID).eq('status', 'pending').order('created_at', { ascending: true });
      if (q.error) q = await supabase.from('card_decisions').select('id, card_name, options, handler, resolver_party_id').eq('nation_id', NATION_ID).eq('status', 'pending').order('created_at', { ascending: true });
      decisions = q.data || [];
    } catch (e) {}

    EVENTS = events; WORLD = world;
    setMicro();
    renderDecisions(decisions);
    renderFeed();
    renderTempo(roster, mine);
    renderTable(cards.slice(0, 2), cards.slice(2, 4), { claims: claims, mine: mine, abbr: abbr });
  }

  (async () => {
    if (!isConfigured) return;
    const user = await requireUser();
    if (!user) return;
    try {
      const { data: party } = await supabase.from('parties').select('id, name, archetype, nation_id, influence').eq('user_id', user.id).maybeSingle();
      if (!party) { window.location.replace('/nation-select/'); return; }
      PARTY = Object.assign({ user_id: user.id }, party);
      NATION_ID = party.nation_id;
      setTopbarActions(party.influence);
      try {
        const { data: gs } = await supabase.from('game_state').select('current_tick').maybeSingle();
        CUR_TICK = (gs && gs.current_tick) || 1;
      } catch (e) {}
      try {
        const { data: nats } = await supabase.from('nations').select('id, name, flag');
        (nats || []).forEach(function (n) { NATIONS[n.id] = n.name; if (n.flag) NATION_FLAGS[n.id] = n.flag; });
      } catch (e) {}
      try {
        const { data: pn } = await supabase.from('parties').select('id, nation_id');
        (pn || []).forEach(function (p) { PARTY_NATION[p.id] = p.nation_id; });
      } catch (e) {}
      // The own nation's name + flag are already in the all-nations maps above — no extra fetch.
      NATION_NAME = NATIONS[NATION_ID] || NATION_ID;
      var nameEl = document.getElementById('pname'); if (nameEl) nameEl.textContent = party.name;
      var subEl = document.getElementById('psub'); if (subEl) subEl.textContent = ideologyLabel(party) + ' · ' + NATION_NAME;
      var myFlag = NATION_FLAGS[NATION_ID];
      if (myFlag) { const f = document.getElementById('flag'); if (f) { f.onload = function () { f.hidden = false; }; f.src = myFlag; } }
      await loadAll();
    } catch (e) {
      var el = document.getElementById('evFeed'); if (el) el.innerHTML = '<div class="ev-err">Couldn’t load the Events page. Refresh to try again.</div>';
    }
  })();
</script>
</body>
