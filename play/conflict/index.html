<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/theme.js"></script>
<title>Conflict · Nationhood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAF8;--surface:#FFFFFF;--ink:#15151B;--muted:#5b5b63;--soft:#8d8d95;
    --line:#E7E5E0;--line2:#D9D6D0;--chip:#F4F3EF;--field:#FCFBF9;
    --indigo:#5546E8;--indigo-soft:#ECE9FD;--amber:#E0820E;--amber-soft:#FBF0DD;--red:#C42B2B;--red-soft:#FBEAE9;--green:#16915a;--green-soft:#E5F4EC;--navy:#2b3a7a;--navy-soft:#E7EAF4;--blue:#1f86d6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .app{display:flex;min-height:100vh}
  .main{flex:1;padding:24px clamp(16px,3vw,38px) 60px;min-width:0;max-width:920px}
  .eye{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--indigo)}
  h1{font-weight:900;font-size:clamp(24px,3.6vw,32px);letter-spacing:-.03em;margin-top:4px}
  .lede{color:var(--muted);font-size:13px;margin-top:7px;max-width:64ch}
  .empty{color:var(--soft);font-style:italic;font-size:13px;margin-top:18px}

  .cont{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:14px;overflow:hidden}
  .cont__h{display:flex;align-items:center;gap:13px;padding:15px 18px;cursor:pointer;user-select:none}
  .cont__h:hover{background:var(--chip)}
  .caret{width:11px;height:11px;border-right:2px solid var(--soft);border-bottom:2px solid var(--soft);transform:rotate(-45deg);transition:transform .2s;flex:none;margin-right:2px}
  .cont.open .caret{transform:rotate(45deg)}
  .cont__name{font-weight:800;font-size:16px;letter-spacing:-.01em;flex:1}
  .cont__tags{display:flex;gap:8px;align-items:center}
  .ctag{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.03em;padding:4px 9px;border-radius:20px;font-weight:700}
  .ctag.calm{color:var(--soft);background:var(--chip)}
  .ctag.mil{color:var(--navy);background:var(--navy-soft)}

  .cont__body{display:none;border-top:1px solid var(--line);padding:6px 18px 16px}
  .cont.open .cont__body{display:block}

  .subh{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:14px 0 8px}
  .nation{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px}
  .nation .nn{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:9px}
  .nation .nn .self{font-family:'Space Mono',monospace;font-size:8.5px;font-weight:700;letter-spacing:.04em;color:var(--indigo);background:var(--indigo-soft);border-radius:5px;padding:2px 6px}
  .nstat{font-family:'Space Mono',monospace;font-size:11px;text-align:right}
  .nstat .nk{font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);display:block}
  .nstat .nv{font-weight:700;font-size:14px;color:var(--ink)}

  .nowar{font-family:'Space Mono',monospace;font-size:11px;color:var(--soft);padding:10px 13px;border:1px dashed var(--line2);border-radius:10px;text-align:center}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div id="sidenav"></div>
  <main class="main">
    <div class="topbar" id="topbar"></div>
    <span class="eye">The World · At Arms</span>
    <h1>Conflict</h1>
    <p class="lede">The military standing of every nation, gathered by continent. Expand a continent to see its garrisons. Wars between nations will appear here as the world takes up arms.</p>
    <div id="continents"><div class="empty">Loading the world…</div></div>
  </main>
</div>

<script type="module">
  import { supabase, isConfigured, requireUser } from '/supabase.js';
  import { esc } from '/util.js';
  import { mountTopbar } from '/topbar.js';
  import { mountSidenav } from '/sidenav.js';

  mountTopbar();
  mountSidenav();

  // Continents come from the hex map: the continents registry is the list (so empty continents
  // still show), and nation_continents() (schema/124) says which continent each nation's land
  // sits on. One source — geography is painted on the map, never set twice.
  var num = function(v){ return Number(v) || 0; };

  function fail(msg){ document.getElementById('continents').innerHTML = '<div class="empty">' + msg + '</div>'; }

  function nationRow(n, myId){
    return '<div class="nation"><div class="nn">' + esc(n.name) + (n.id === myId ? '<span class="self">You</span>' : '') + '</div>' +
      '<div class="nstat"><span class="nk">Military Bases</span><span class="nv">' + num(n.military_bases) + '</span></div></div>';
  }

  function continentCard(name, nations, myId, open){
    var bases = nations.reduce(function(a, n){ return a + num(n.military_bases); }, 0);
    var tags = '<span class="ctag calm">At peace</span>' + (nations.length ? '<span class="ctag mil">' + bases + ' base' + (bases === 1 ? '' : 's') + '</span>' : '');
    var body = (nations.length
        ? '<div class="subh">Nations &amp; Garrisons</div>' + nations.map(function(n){ return nationRow(n, myId); }).join('')
        : '') +
      '<div class="subh">Conflicts</div><div class="nowar">No active conflicts on this continent.</div>';
    return '<div class="cont' + (open ? ' open' : '') + '">' +
      '<div class="cont__h"><span class="caret"></span><span class="cont__name">' + esc(name) + '</span><span class="cont__tags">' + tags + '</span></div>' +
      '<div class="cont__body">' + body + '</div></div>';
  }

  function render(nations, contOf, registry, myId){
    // Group nations by their map-derived continent; a nation with no continent-painted land
    // falls under "Unassigned" so nothing is silently dropped.
    var byCont = {};
    nations.forEach(function(n){ var c = contOf[n.id] || 'Unassigned'; (byCont[c] = byCont[c] || []).push(n); });
    // Order: the painted continents (registry), then any extra that turned up, Unassigned last.
    var order = registry.slice();
    Object.keys(byCont).forEach(function(c){ if (c !== 'Unassigned' && order.indexOf(c) < 0) order.push(c); });
    if (byCont['Unassigned']) order.push('Unassigned');
    document.getElementById('continents').innerHTML = order.map(function(c){
      var ns = (byCont[c] || []).slice().sort(function(a, b){ return (a.name || '').localeCompare(b.name || ''); });
      return continentCard(c, ns, myId, ns.length > 0);   // continents with nations open by default
    }).join('') || '<div class="empty">No continents mapped yet — paint the map’s Continents layer to populate this.</div>';
    document.querySelectorAll('.cont__h').forEach(function(h){ h.onclick = function(){ h.parentElement.classList.toggle('open'); }; });
  }

  (async () => {
    if (!isConfigured){ fail('Supabase isn’t configured.'); return; }
    var user = await requireUser();
    if (!user) return;
    try {
      var { data: party } = await supabase.from('parties').select('nation_id').eq('user_id', user.id).single();
      if (!party){ window.location.replace('/nation-select/'); return; }
      var [nat, con, nc] = await Promise.all([
        supabase.from('nations').select('id, name, military_bases').eq('dormant', false).order('name'),
        supabase.from('continents').select('name').order('name'),         // the painted continents (the list)
        supabase.rpc('nation_continents')                                  // which continent each nation sits on
      ]);
      var contOf = {}; (nc.data || []).forEach(function(r){ contOf[r.nation_id] = r.continent; });
      render(nat.data || [], contOf, (con.data || []).map(function(c){ return c.name; }), party.nation_id);
    } catch (e){ fail('Couldn’t load the world right now. Refresh to try again.'); }
  })();
</script>
</body>
</html>
