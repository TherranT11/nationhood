<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home2 · Nationhood</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101018; --side:#14141c; --panel:#1a1a26; --line:#26263a;
    --text:#e8ebf2; --muted:#8a93a8; --dim:#5c657b;
    --accent:#8f8ff5; --orange:#f0a03c; --green:#3ecf8e; --red:#e5604c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  .hp-root{font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--text);background:var(--bg);
    height:100vh;display:flex;overflow:hidden}
  .mono{font-family:'JetBrains Mono',monospace}

  /* sidebar */
  .side{width:216px;min-width:216px;background:var(--side);border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:14px 10px}
  .brand{display:flex;gap:10px;align-items:flex-start;padding:2px 6px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .brand__crest{width:36px;height:36px;border-radius:6px;background:#123524;border:1px solid #2c5c40;
    display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
  .brand__name{font-weight:700;font-size:13px;line-height:1.25}
  .brand__sub{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;color:var(--dim);margin-top:3px}
  .nav{overflow-y:auto;flex:1}
  .nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;color:var(--muted);
    font-family:'JetBrains Mono',monospace;font-size:12.5px;cursor:pointer;position:relative;text-decoration:none}
  .nav-item:hover{color:var(--text);background:#1c1c2a}
  .nav-item.on{background:#232336;color:var(--accent)}
  .nav-item svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .nav-item .dot{width:6px;height:6px;border-radius:3px;background:var(--orange);position:absolute;right:10px}
  .side__foot{border-top:1px solid var(--line);padding-top:10px;display:flex;gap:10px;align-items:center}
  .side__avatar{width:34px;height:34px;border-radius:17px;background:#2a2a3e;display:flex;align-items:center;
    justify-content:center;font-weight:700;font-size:12px;color:var(--accent)}

  /* map area */
  .map-area{flex:1;position:relative;overflow:hidden;background:#a9cfdd;cursor:grab;user-select:none}
  .map-area.grabbing{cursor:grabbing}
  .map-area svg.world{display:block;width:100%;height:100%}
  .pulse{animation:pulse 1.8s ease-out infinite}
  @keyframes pulse{0%{r:11;opacity:.7}70%{r:20;opacity:0}100%{r:20;opacity:0}}

  .chip{font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 8px;border-radius:5px;
    border:1px solid var(--line);background:var(--panel);color:var(--muted)}
  .zoombtn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:var(--panel);
    border:1px solid var(--line);color:var(--muted);cursor:pointer;border-radius:8px;font-size:18px;line-height:1}
  .zoombtn:hover{color:var(--text)}

  /* topbar */
  .topbar{position:absolute;top:0;left:0;right:0;height:46px;z-index:10;background:rgba(14,14,22,.88);
    backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:14px}
  .tb-stat .k{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;color:var(--dim)}
  .tb-stat .v{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700}

  /* event popup */
  .evpop{position:absolute;width:260px;z-index:20;background:#181820;border:1px solid var(--line);border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);overflow:hidden}
  .evpop__hd{padding:7px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .evpop__body{padding:10px 12px}
  .evpop__bang{width:22px;height:22px;min-width:22px;border-radius:11px;background:#e5604c;display:flex;align-items:center;
    justify-content:center;font-weight:900;font-size:13px;color:#fff}
</style>
</head>
<body>
<div class="hp-root">
  <!-- ============ SIDEBAR ============ -->
  <aside class="side">
    <div class="brand">
      <div class="brand__crest">🦅</div>
      <div>
        <div class="brand__name">The National Justice Party</div>
        <div class="brand__sub">FAITH / RELIGIOUS · AL-QADIR</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side__foot">
      <div class="side__avatar">AB</div>
      <div>
        <div style="font-size:12px;font-weight:600">Chapter II</div>
        <div class="mono" style="font-size:9px;color:var(--dim)">TERM 1 · MONTH 7</div>
      </div>
    </div>
  </aside>

  <!-- ============ MAP AREA ============ -->
  <main class="map-area" id="mapArea">
    <svg class="world" id="worldSvg"></svg>

    <!-- topbar -->
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:20px;height:20px;border-radius:4px;background:#123524;border:1px solid #2c5c40;font-size:11px;display:flex;align-items:center;justify-content:center">🦅</div>
        <span style="font-weight:700;font-size:13px">The National Justice Party</span>
      </div>
      <div style="width:1px;height:22px;background:var(--line)"></div>
      <div style="display:flex;gap:16px;align-items:center;flex:1">
        <div class="tb-stat"><span class="k">ECONOMIC GROWTH </span><span class="v" style="color:var(--green)">+3.1%</span></div>
        <div class="tb-stat"><span class="k">BUDGET </span><span class="v" style="color:var(--red)">−$0.1bn</span></div>
        <div class="tb-stat"><span class="k">APPROVAL </span><span class="v">41%</span></div>
      </div>
      <div class="chip" style="display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--text)">
        NEWS <span id="newsCount" style="background:var(--red);color:#fff;border-radius:8px;font-size:9px;padding:1px 6px;font-weight:700">0</span>
      </div>
    </div>

    <!-- zoom controls -->
    <div style="position:absolute;right:14px;top:58px;display:flex;flex-direction:column;gap:6px;z-index:10">
      <div class="zoombtn" id="zoomIn">+</div>
      <div class="zoombtn" id="zoomOut">−</div>
    </div>

    <!-- hover chip + hint -->
    <div class="chip" id="hoverChip" style="position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:10;color:var(--text);font-size:11px;display:none"></div>
    <div class="mono" style="position:absolute;bottom:14px;right:14px;z-index:10;font-size:9px;letter-spacing:.12em;color:rgba(20,20,30,.55)">DRAG TO PAN · CLICK ! FOR EVENTS</div>

    <div id="popRoot"></div>
  </main>
</div>

<script>
(function () {
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); };

  /* ---------------- NAV ---------------- */
  var NAV = [
    ['Home','/play/news/','<path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/>'],
    ['Party','/play/party/','<path d="M4 21V4"/><path d="M4 4c3-2 6 2 9 0s6-2 9 0v9c-3 2-6-2-9 0s-6 2-9 0"/>'],
    ['Nation','/play/','<path d="M3 11l9-7 9 7"/><path d="M5 10v9h14v-9"/>'],
    ['Government','/play/government/','<path d="M3 9l9-5 9 5"/><path d="M3 9h18M4 20h16"/><path d="M6 20v-9M10 20v-9M14 20v-9M18 20v-9"/>'],
    ['Coalition','/play/coalition/','<circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M2 20a6 6 0 0 1 10-4M22 20a6 6 0 0 0-10-4"/>'],
    ['Legislature','/play/legislature/','<path d="M3 21h18"/><path d="M5 21V10M9 21V10M15 21V10M19 21V10"/><path d="M12 3l9 5H3z"/>'],
    ['Policies','/play/policies/','<path d="M7 3h10a1 1 0 011 1v16l-3-2-3 2-3-2-3 2V4a1 1 0 011-1z"/><path d="M9 8h6M9 12h5"/>'],
    ['Elections','/play/elections/','<path d="M4 7h16v13H4z"/><path d="M8 7V4h8v3"/><path d="M8.5 13l2 2 4-4"/>'],
    ['Economy','/play/economy/','<path d="M4 19h16"/><path d="M4 15l4-4 3 3 5-6"/><path d="M16 8h2v2"/>'],
    ['Corporations','/play/corporations/','<path d="M3 21h18"/><path d="M6 21V5a1 1 0 011-1h6a1 1 0 011 1v16"/><path d="M14 21V10h4a1 1 0 011 1v10"/><path d="M9 8h2M9 12h2M9 16h2"/>'],
    ['Intl. Organizations','/play/organizations/','<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2"/><path d="M12 3v5.8M12 15.2V21M3 12h5.8M15.2 12H21"/>',true],
    ['World','/play/world/','<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>'],
    ['Conflict','/play/conflict/','<path d="M17 4l3 3-9 9-3-3z"/><path d="M7 4L4 7l9 9 3-3"/><path d="M5 16l-1 4 4-1M19 16l1 4-4-1"/>'],
    ['Forum','/play/forum/','<path d="M4 5h12v8H8l-4 3z"/><path d="M18 9h2v9l-3-2h-5"/>'],
    ['Wiki','/play/wiki/','<path d="M12 5v15"/><path d="M4 4h6a2 2 0 012 2 2 2 0 012-2h6v13h-6a2 2 0 00-2 2 2 2 0 00-2-2H4z"/>'],
    ['Home2','/play/home2/','<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>']
  ];
  document.getElementById('nav').innerHTML = NAV.map(function (n) {
    var on = n[1] === '/play/home2/';
    return '<a class="nav-item' + (on ? ' on' : '') + '" href="' + n[1] + '">' +
      '<svg viewBox="0 0 24 24" aria-hidden="true">' + n[2] + '</svg>' + esc(n[0]) +
      (n[3] ? '<span class="dot"></span>' : '') + '</a>';
  }).join('');

  /* ---------------- HEX GRID ---------------- */
  var COLS = 42, ROWS = 27, S = 17;
  var hexX = function (q, r) { return Math.sqrt(3) * S * (q + (r % 2 ? 0.5 : 0)) + S; };
  var hexY = function (r) { return 1.5 * S * r + S; };
  var kk = function (q, r) { return q + ',' + r; };
  var corners = function (cx, cy) {
    var out = [];
    for (var i = 0; i < 6; i++) { var a = Math.PI / 180 * (60 * i - 30); out.push((cx + S * Math.cos(a)).toFixed(1) + ',' + (cy + S * Math.sin(a)).toFixed(1)); }
    return out.join(' ');
  };
  var neighbors = function (q, r) {
    return (r % 2 === 0)
      ? [[q+1,r],[q-1,r],[q,r-1],[q-1,r-1],[q,r+1],[q-1,r+1]]
      : [[q+1,r],[q-1,r],[q+1,r-1],[q,r-1],[q+1,r+1],[q,r+1]];
  };
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  /* ---------------- WORLD ---------------- */
  var NATION_DEFS = [
    { name:'Al-Qadir',  color:'#d9a944', seed:[20,18], size:26, player:true },
    { name:'Ostmark',   color:'#4a4a52', seed:[23,9],  size:18 },
    { name:'Seyonne',   color:'#6b4fd0', seed:[17,11], size:18 },
    { name:'Rosmoor',   color:'#e05c5c', seed:[12,7],  size:13 },
    { name:'Calcordia', color:'#3b4fd9', seed:[13,3],  size:7 },
    { name:'Inisvane',  color:'#3ecf8e', seed:[6,4],   size:7 },
    { name:'Calveth',   color:'#2fa39a', seed:[26,5],  size:8 },
    { name:'Aontas',    color:'#c9cc4e', seed:[32,3],  size:16 },
    { name:'Aranzar',   color:'#d94f4f', seed:[4,17],  size:11 },
    { name:'Estrella',  color:'#d4c944', seed:[7,20],  size:15 },
    { name:'Etelia',    color:'#7a72c9', seed:[28,21], size:14 },
    { name:'Unclaimed', color:'#e6dfc8', seed:[34,13], size:12, neutral:true },
    { name:'Unclaimed', color:'#e6dfc8', seed:[12,16], size:10, neutral:true },
    { name:'Unclaimed', color:'#e6dfc8', seed:[38,21], size:8,  neutral:true }
  ];
  var CITIES = [
    { name:'Madinat al-Qadir', q:20, r:18, capital:true },
    { name:'Bandar Rish',      q:22, r:20 },
    { name:'Ostgrad',          q:23, r:9 },
    { name:'Aubertin',         q:18, r:10 },
    { name:'Marivelle',        q:17, r:13 },
    { name:'Loxbridge',        q:12, r:6 },
    { name:'Vella Estrella',   q:7,  r:20 }
  ];
  var EVENTS = [
    { id:'wra', q:20, r:18, nation:'Al-Qadir', tag:'LEGISLATURE', title:"Workers' Rights Act",
      desc:"Sign or veto the Workers' Rights Act that was approved by the Grand National Assembly." },
    { id:'garrison', q:23, r:9, nation:'Ostmark', tag:'CONFLICT', title:'Garrison on the Frontier',
      desc:'Ostmark has moved two divisions to your shared border. The General Staff requests instructions.' },
    { id:'trade', q:17, r:13, nation:'Seyonne', tag:'TRADE', title:'Ports-for-Grain Offer',
      desc:'Seyonne proposes harbor access in exchange for wheat quotas. The Bazaar is watching.' },
    { id:'ships', q:7, r:20, nation:'Estrella', tag:'INTERIOR', title:'Refugee Ships',
      desc:'Three vessels fleeing the Estrellan civil war request harbor. Four thousand souls aboard.' }
  ];

  function buildWorld() {
    var rng = mulberry32(42), owner = {};
    NATION_DEFS.forEach(function (n, idx) {
      var frontier = [n.seed], grown = 0;
      while (grown < n.size && frontier.length) {
        var i = Math.floor(rng() * frontier.length);
        var cell = frontier.splice(i, 1)[0], q = cell[0], r = cell[1], k = kk(q, r);
        if (owner[k] !== undefined) continue;
        if (q < 1 || r < 1 || q >= COLS - 1 || r >= ROWS - 1) continue;
        owner[k] = idx; grown++;
        neighbors(q, r).forEach(function (nb) { if (owner[kk(nb[0], nb[1])] === undefined) frontier.push(nb); });
      }
    });
    return owner;
  }
  var owner = buildWorld();
  var waterTone = function (q, r) { return ((q * 7 + r * 13) % 5 < 2) ? '#b9dae6' : '#a9cfdd'; };

  /* ---------------- RENDER MAP ---------------- */
  var svgEl = document.getElementById('worldSvg');
  var body = '';
  for (var r = 0; r < ROWS; r++) for (var q = 0; q < COLS; q++) {
    var o = owner[kk(q, r)], n = o !== undefined ? NATION_DEFS[o] : null;
    var fill = n ? n.color : waterTone(q, r);
    body += '<polygon points="' + corners(hexX(q, r), hexY(r)) + '" fill="' + fill + '" stroke="#fff" stroke-opacity="' + (n ? 0.35 : 0.25) + '" stroke-width="1" data-nation="' + (n && !n.neutral ? esc(n.name) : '') + '"/>';
  }
  // player-nation outline glow
  Object.keys(owner).forEach(function (k) {
    if (!NATION_DEFS[owner[k]].player) return;
    var p = k.split(',').map(Number);
    body += '<polygon points="' + corners(hexX(p[0], p[1]), hexY(p[1])) + '" fill="none" stroke="#f0a03c" stroke-opacity=".5" stroke-width="1.4"/>';
  });
  // cities
  CITIES.forEach(function (c) {
    var x = hexX(c.q, c.r), y = hexY(c.r);
    body += '<circle cx="' + x + '" cy="' + y + '" r="' + (c.capital ? 3.4 : 2.4) + '" fill="#1a1a1a"/>' +
      '<text x="' + (x + 6) + '" y="' + (y + 4) + '" font-size="' + (c.capital ? 12 : 10.5) + '" font-weight="700" fill="#1a1a1a" stroke="#fff" stroke-width="3" paint-order="stroke" style="font-family:\'IBM Plex Sans\',sans-serif">' + (c.capital ? '★ ' : '') + esc(c.name) + '</text>';
  });
  // event markers
  EVENTS.forEach(function (ev) {
    var x = hexX(ev.q, ev.r), y = hexY(ev.r) - 14;
    body += '<g class="evmarker" data-id="' + ev.id + '" style="cursor:pointer">' +
      '<circle class="pulse" cx="' + x + '" cy="' + y + '" r="11" fill="none" stroke="#e5604c" stroke-width="2"/>' +
      '<circle cx="' + x + '" cy="' + y + '" r="10" fill="#e5604c" stroke="#fff" stroke-width="2"/>' +
      '<text x="' + x + '" y="' + (y + 4.5) + '" text-anchor="middle" font-size="13" font-weight="900" fill="#fff" style="font-family:\'JetBrains Mono\',monospace">!</text></g>';
  });
  svgEl.innerHTML = '<g id="world">' + body + '</g>';
  var worldG = document.getElementById('world');
  document.getElementById('newsCount').textContent = EVENTS.length;

  /* ---------------- PAN / ZOOM ---------------- */
  var pan = { x: -150, y: -120 }, zoom = 1.15, drag = null, openEvent = null;
  var mapArea = document.getElementById('mapArea'), popRoot = document.getElementById('popRoot');

  function applyTransform() {
    worldG.setAttribute('transform', 'translate(' + pan.x + ',' + pan.y + ') scale(' + zoom + ')');
    if (openEvent) positionPopup();
  }
  applyTransform();

  mapArea.addEventListener('mousedown', function (e) {
    if (e.target.closest('.evmarker')) return;   // markers handle their own click
    drag = { sx: e.clientX, sy: e.clientY, px: pan.x, py: pan.y };
    mapArea.classList.add('grabbing');
  });
  window.addEventListener('mousemove', function (e) {
    if (!drag) return;
    pan = { x: drag.px + (e.clientX - drag.sx), y: drag.py + (e.clientY - drag.sy) };
    applyTransform();
  });
  window.addEventListener('mouseup', function () { drag = null; mapArea.classList.remove('grabbing'); });

  document.getElementById('zoomIn').onclick = function () { zoom = Math.min(2.2, Math.round((zoom + 0.2) * 100) / 100); applyTransform(); };
  document.getElementById('zoomOut').onclick = function () { zoom = Math.max(0.6, Math.round((zoom - 0.2) * 100) / 100); applyTransform(); };

  // hover nation chip (delegated)
  var hoverChip = document.getElementById('hoverChip');
  worldG.addEventListener('mouseover', function (e) {
    if (e.target.tagName !== 'polygon') return;
    var nm = e.target.getAttribute('data-nation');
    if (nm) { hoverChip.textContent = nm; hoverChip.style.display = ''; } else { hoverChip.style.display = 'none'; }
  });
  mapArea.addEventListener('mouseleave', function () { hoverChip.style.display = 'none'; });

  /* ---------------- EVENT POPUP ---------------- */
  function positionPopup() {
    var ev = EVENTS.filter(function (e) { return e.id === openEvent; })[0];
    var pop = document.getElementById('evpop'); if (!ev || !pop) return;
    pop.style.left = (hexX(ev.q, ev.r) * zoom + pan.x - 130) + 'px';
    pop.style.top = ((hexY(ev.r) - 14) * zoom + pan.y - 128) + 'px';
  }
  function renderPopup() {
    var ev = EVENTS.filter(function (e) { return e.id === openEvent; })[0];
    if (!ev) { popRoot.innerHTML = ''; return; }
    popRoot.innerHTML =
      '<div class="evpop" id="evpop">' +
        '<div class="evpop__hd"><span class="mono" style="font-size:10px;letter-spacing:.12em;color:var(--orange)">★ ' + esc(ev.nation.toUpperCase()) + '</span><span class="chip">' + esc(ev.tag) + '</span></div>' +
        '<div class="evpop__body"><div style="display:flex;gap:8px;align-items:flex-start">' +
          '<div class="evpop__bang">!</div>' +
          '<div><div style="font-weight:700;font-size:13px">' + esc(ev.title) + '</div>' +
          '<div style="font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45">' + esc(ev.desc) + '</div></div></div>' +
          '<div style="display:flex;gap:6px;margin-top:10px;justify-content:flex-end">' +
            '<button class="chip" id="evLater" style="cursor:pointer">LATER</button>' +
            '<button class="chip" style="cursor:pointer;color:#0a0d13;background:var(--orange);border:none;font-weight:700">OPEN</button>' +
          '</div></div></div>';
    positionPopup();
    document.getElementById('evLater').onclick = function () { openEvent = null; renderPopup(); };
  }
  // marker clicks
  Array.prototype.forEach.call(document.querySelectorAll('.evmarker'), function (g) {
    g.addEventListener('click', function (e) {
      e.stopPropagation();
      var id = g.getAttribute('data-id');
      openEvent = (openEvent === id) ? null : id;
      renderPopup();
    });
  });
})();
</script>
</body>
</html>
