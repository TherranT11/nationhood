<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home2 · Nationhood</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101018; --side:#14141c; --panel:#1a1a26; --line:#26263a;
    --text:#e8ebf2; --muted:#8a93a8; --dim:#5c657b;
    --accent:#8f8ff5; --orange:#f0a03c; --green:#3ecf8e; --red:#e5604c;
    /* Aliases so the shared /sidenav.js CSS resolves against Home2's dark palette. */
    --surface:#14141c; --ink:#e8ebf2; --soft:#5c657b; --chip:#1c1c2a;
    --indigo:#8f8ff5; --indigo-soft:#232336; --amber:#f0a03c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  .hp-root{font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--text);background:var(--bg);
    height:100vh;display:flex;overflow:hidden}
  .mono{font-family:'JetBrains Mono',monospace}

  /* The left navigation now comes from the shared /sidenav.js (rail + mobile bottom bar).
     Only the topbar's nation crest keeps its own style. */
  .brand__crest{width:36px;height:36px;border-radius:6px;background:#123524;border:1px solid #2c5c40;
    display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;overflow:hidden}
  .brand__crest img{width:100%;height:100%;object-fit:cover}

  /* map area */
  .map-area{flex:1;position:relative;overflow:hidden;background:#a9cfdd;cursor:grab;user-select:none;
    touch-action:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  .map-area.grabbing{cursor:grabbing}
  .map-area svg.world{display:block;width:100%;height:100%}

  @media (max-width:640px){
    .topbar{padding:0 10px;gap:10px}
    .zoombtn{width:38px;height:38px;font-size:22px}
  }

  /* Constant-size label overlay (positioned by JS from world coords → screen). */
  .labels{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
  .natlabel,.citylabel{position:absolute;left:0;top:0;white-space:nowrap;font-family:'IBM Plex Sans',sans-serif;
    font-weight:700;color:#15151b;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff;transition:opacity .28s ease;will-change:transform}
  .natlabel{font-size:15px;letter-spacing:.02em}
  .citylabel{font-size:11.5px}
  .citylabel.cap{font-size:12.5px}
  /* Level of detail: nation names by default; fade to cities once zoomed in. */
  .natlabel{opacity:1}.labels.zoomed .natlabel{opacity:0}
  .citylabel{opacity:0}.labels.zoomed .citylabel{opacity:1}
  /* City dots ride with the map but only show once zoomed in. pointer-events:none so they never
     intercept a click meant for the nation hex beneath them (even while invisible at opacity 0). */
  svg.world .citydot{opacity:0;pointer-events:none;transition:opacity .28s ease}
  svg.world.zoomed .citydot{opacity:1}
  /* Political / Military map filter (top-left). Political = the base map; Military overlays unit counters. */
  .mapmode{position:absolute;left:14px;top:58px;z-index:10;display:flex;background:rgba(255,255,255,.92);
    border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .mm-btn{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    padding:6px 12px;border:none;background:transparent;color:var(--muted);cursor:pointer}
  .mm-btn.on{background:#4a5cd0;color:#fff}
  /* Unit counters ride with the SVG; their names live in the constant-size overlay. Both show only in
     Military mode (a class on .map-area), so Political stays a clean territorial map. */
  svg.world .unitctr{opacity:0;pointer-events:none;transition:opacity .2s ease}
  .map-area.milmode svg.world .unitctr{opacity:1}
  .unitlabel{position:absolute;left:0;top:0;white-space:nowrap;font-family:'IBM Plex Sans',sans-serif;
    font-weight:700;font-size:10.5px;color:#15151b;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff;
    opacity:0;transition:opacity .2s ease;will-change:transform;pointer-events:none}
  .map-area.milmode .unitlabel{opacity:1}

  /* Intl Orgs map mode: a row of org chips under the mode toggle, and a legend card bottom-left.
     Home2 is a light-sea map, so both are white/light cards matching the mapmode toggle. */
  .orgchips{position:absolute;left:14px;top:92px;z-index:10;display:none;flex-wrap:wrap;gap:6px;max-width:min(62vw,340px)}
  .orgchips.show{display:flex}
  .org-chip{display:inline-flex;align-items:center;gap:6px;font-family:'Space Mono','JetBrains Mono',monospace;
    font-size:10px;letter-spacing:.04em;padding:5px 9px;border:1px solid var(--line);border-left:3px solid transparent;
    border-radius:7px;background:rgba(255,255,255,.92);color:#3a3f4c;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.16);
    -webkit-tap-highlight-color:transparent}
  .org-chip .oc-em{font-size:12px;line-height:1}
  .org-chip .oc-key{font-weight:700;text-transform:uppercase}
  .org-chip .oc-cnt{font-size:9px;color:#8a8f9c;background:#eef0f4;border-radius:8px;padding:1px 5px;min-width:15px;text-align:center}
  .org-chip.on{color:#15151b;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.24)}
  .org-empty{font-family:'Space Mono','JetBrains Mono',monospace;font-size:10px;color:rgba(20,20,30,.62);
    background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:7px;padding:5px 9px}
  .orglegend{position:absolute;left:14px;bottom:14px;z-index:11;width:242px;max-width:calc(100% - 28px);
    background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.28);
    overflow:hidden;display:none;color:#15151b}
  .orglegend.show{display:block}
  .ol-accent{height:3px}
  .ol-body{padding:11px 13px}
  .ol-head{display:flex;gap:9px;align-items:center}
  .ol-em{font-size:20px;line-height:1;flex:none}
  .ol-name{font-weight:700;font-size:14px;line-height:1.15}
  .ol-count{font-family:'Space Mono','JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;color:#8a8f9c;
    margin-top:8px;text-transform:uppercase}
  .ol-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;max-height:132px;overflow-y:auto}
  .ol-chip{font-family:'Space Mono','JetBrains Mono',monospace;font-size:10px;padding:2px 7px;border-radius:5px;
    border:1px solid #e2e2ea;background:#f4f5f8;color:#3a3f4c}
  /* Non-member nation labels dim while an org is highlighted (grey + lowered opacity). */
  .natlabel.org-dim{opacity:.55;color:#8a8a8a;text-shadow:0 0 3px #fff,0 0 3px #fff}

  /* Nation snapshot panel (click a nation) — real data, styled to Home2's dark theme. */
  .natpanel{position:absolute;top:58px;right:14px;width:290px;max-width:calc(100% - 28px);z-index:15;
    background:#181820;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.45);
    overflow-y:auto;max-height:calc(100vh - 72px);display:none;font-size:13px}
  .natpanel.show{display:block}
  .np-accent{height:3px}
  .np-body{padding:12px 14px}
  .np-head{display:flex;gap:10px;align-items:center}
  .np-flag{width:36px;height:24px;border-radius:3px;flex:none;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
  .np-name{font-weight:700;font-size:15px;line-height:1.1}
  .np-sub{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--dim);margin-top:2px}
  .np-x{margin-left:auto;flex:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;
    width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;
    border:1px solid var(--line);background:var(--panel);-webkit-tap-highlight-color:transparent}
  .np-x:hover{color:var(--text)}
  @media(max-width:640px){
    .np-x{width:40px;height:40px;font-size:20px}
    .natpanel{font-size:14px}
  }
  .np-figs{display:flex;gap:8px;margin-top:10px}
  .np-fig{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel)}
  .np-fig .k{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.1em;color:var(--dim)}
  .np-fig .v{font-weight:800;font-size:16px;margin-top:2px}
  .np-who{margin-top:10px;padding:9px 0;border-top:1px solid #22222f;border-bottom:1px solid #22222f;font-size:12.5px}
  .np-who .ttl{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
  .np-stats{margin-top:10px;display:flex;flex-direction:column;gap:7px}
  .np-srow{display:flex;justify-content:space-between;gap:10px}
  .np-srow .sk{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.08em;color:var(--dim)}
  .np-srow .sv{font-weight:700;font-size:12.5px}
  .np-srow .sv small{font-family:'JetBrains Mono',monospace;color:var(--dim);margin-left:5px;font-size:10px}
  .np-srow .sv.good{color:var(--green)} .np-srow .sv.warn{color:var(--orange)} .np-srow .sv.bad{color:var(--red)}

  /* Event markers: an orange pulsing "!" over a nation's capital when something is happening there
     this in-game month. Constant on-screen size (positioned by JS), clickable to open the nation. */
  .markers{position:absolute;inset:0;pointer-events:none;z-index:7;overflow:hidden}
  .evmarker{position:absolute;left:0;top:0;width:24px;height:24px;margin:-12px 0 0 -12px;pointer-events:auto;cursor:pointer;will-change:transform}
  .evmarker .dot{position:absolute;inset:0;border-radius:50%;background:#e5604c;border:2px solid #fff;
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:14px;
    font-family:'JetBrains Mono',monospace;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .evmarker .ring{position:absolute;inset:0;border-radius:50%;border:2px solid #e5604c;animation:evpulse 1.8s ease-out infinite}
  .evmarker .cnt{position:absolute;top:-5px;right:-5px;min-width:15px;height:15px;border-radius:8px;background:#fff;
    color:#e5604c;font-family:'JetBrains Mono',monospace;font-weight:900;font-size:9px;line-height:1;
    display:flex;align-items:center;justify-content:center;padding:0 3px;box-shadow:0 1px 3px rgba(0,0,0,.35)}
  @keyframes evpulse{0%{transform:scale(1);opacity:.7}70%{transform:scale(2.2);opacity:0}100%{transform:scale(2.2);opacity:0}}
  @media(prefers-reduced-motion:reduce){.evmarker .ring{animation:none;opacity:0}}

  /* Event review popup (click a ! marker): list this month's events, open one, exit to mark it reviewed. */
  .evpop{position:absolute;z-index:16;width:272px;max-width:calc(100% - 16px);background:#181820;border:1px solid var(--line);
    border-radius:10px;box-shadow:0 12px 34px rgba(0,0,0,.5);overflow:hidden;display:none}
  .evpop.show{display:block}
  .ep-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
  .ep-title{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;color:var(--orange);display:flex;align-items:center;gap:6px}
  .ep-back{cursor:pointer;color:var(--muted);font-size:15px;line-height:1}
  .ep-x{cursor:pointer;color:var(--dim);font-size:13px;flex:none}
  .ep-list{padding:5px 6px 7px}
  .ep-row{display:flex;align-items:center;gap:8px;padding:8px;border-radius:7px;cursor:pointer}
  .ep-row:hover{background:#20202e}
  .ep-bang{color:var(--red);font-weight:900;flex:none;align-self:flex-start;line-height:1.3}
  .ep-rtxt{flex:1;font-size:12.5px;font-weight:600;color:var(--text);line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ep-tag{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
    border:1px solid var(--line);border-radius:5px;padding:2px 6px;white-space:nowrap;flex:none}
  .ep-chev{color:var(--dim);flex:none}
  .ep-detail{padding:12px 14px}
  .ep-drow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .ep-dtag{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
    border:1px solid var(--line);border-radius:5px;padding:2px 6px}
  .ep-dbody{font-size:12.5px;color:var(--muted);line-height:1.5}

  .chip{font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 8px;border-radius:5px;
    border:1px solid var(--line);background:var(--panel);color:var(--muted)}
  .zoombtn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:var(--panel);
    border:1px solid var(--line);color:var(--muted);cursor:pointer;border-radius:8px;font-size:18px;line-height:1}
  .zoombtn:hover{color:var(--text)}

  /* topbar */
  .topbar{position:absolute;top:0;left:0;right:0;height:46px;z-index:10;background:rgba(14,14,22,.88);
    backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:14px}
  .tb-stat{display:flex;align-items:center;gap:4px;white-space:nowrap}
  .tb-stat .k{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.12em;color:var(--dim)}
  .tb-stat .v{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700}
  .tbic{width:12px;height:12px;flex:none;fill:var(--orange)}

  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim);background:#a9cfdd;z-index:5}
</style>
</head>
<body>
<div class="hp-root">
  <div id="sidenav"></div><!-- shared left rail / mobile bottom bar, injected by /sidenav.js -->

  <!-- ============ MAP AREA ============ -->
  <main class="map-area" id="mapArea">
    <svg class="world" id="worldSvg"></svg>
    <div class="labels" id="labels"></div>
    <div class="markers" id="markers"></div>
    <div class="loading" id="loading">Loading the world…</div>

    <!-- topbar -->
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:8px">
        <div class="brand__crest" style="width:20px;height:20px;border-radius:4px;font-size:11px" id="tbCrest">🦅</div>
        <span style="font-weight:700;font-size:13px" id="tbName">Nationhood</span>
      </div>
      <div style="width:1px;height:22px;background:var(--line)"></div>
      <div style="display:flex;gap:14px;align-items:center;flex:1;min-width:0;overflow:hidden">
        <div class="tb-stat" title="Action Points — actions you can take this turn"><span class="k">AP</span><span class="v" id="tbAP">—</span></div>
        <div class="tb-stat" title="Influence — banked to bid on cards"><span style="font-size:13px;line-height:1" aria-hidden="true">⚡</span><span class="v" id="tbInf">—</span></div>
        <div class="tb-stat" title="Current in-game month"><svg class="tbic" style="fill:none;stroke:var(--muted);stroke-width:1.9" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg><span class="v" id="tbDate">—</span></div>
        <div class="tb-stat" title="Time to the next tick (the clock advances every 6h)"><svg class="tbic" style="fill:none;stroke:var(--muted);stroke-width:1.9" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9.5V13l2.5 1.6M9 2.5h6"/></svg><span class="v" id="tbNext">—:—:—</span></div>
      </div>
    </div>

    <!-- zoom controls -->
    <div style="position:absolute;right:14px;top:58px;display:flex;flex-direction:column;gap:6px;z-index:10">
      <div class="zoombtn" id="zoomIn">+</div>
      <div class="zoombtn" id="zoomOut">−</div>
    </div>

    <!-- Political / Military / Intl Orgs map filter -->
    <div class="mapmode" id="mapMode">
      <button class="mm-btn on" data-mode="pol" type="button">Political</button>
      <button class="mm-btn" data-mode="mil" type="button">Military</button>
      <button class="mm-btn" data-mode="orgs" type="button">Intl Orgs</button>
    </div>

    <!-- Intl Orgs: one chip per active organization (shown only in Intl Orgs mode) -->
    <div class="orgchips" id="orgChips"></div>

    <!-- Intl Orgs legend (bottom-left; shown while an org is selected) -->
    <div class="orglegend" id="orgLegend"></div>

    <!-- nation snapshot panel (click a nation) -->
    <div class="natpanel" id="natPanel"></div>

    <!-- event review popup (click a ! marker) -->
    <div class="evpop" id="evPop"></div>

    <!-- hover chip + hint -->
    <div class="chip" id="hoverChip" style="position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:10;color:var(--text);font-size:11px;display:none"></div>
    <div class="mono" style="position:absolute;bottom:14px;right:14px;z-index:10;font-size:9px;letter-spacing:.12em;color:rgba(20,20,30,.55)">DRAG TO PAN · SCROLL / ± TO ZOOM</div>
  </main>
</div>

<script type="module">
import { supabase, isConfigured, requireUser, selectAll } from '/supabase.js';
import { esc, declaredValue, fmtGdp, fmtPop, loadHogTitleSlot, tickToDate, msUntilNextTick, fmtCountdown } from '/util.js';
import { axialToPix, nationColors } from '/hexmap.js';
import { regimeText, nationRegime, statName, statLabel, statBand, crimeLabel, crimeBand, crimeValue } from '/ladders.js';
import { mountSidenav } from '/sidenav.js';

mountSidenav();  // shared left rail (desktop) / bottom bar (mobile) into #sidenav

/* ---------------- HEX GEOMETRY ---------------- */
const S = 16;   // hex size (px, at zoom 1)
// Pointy-top hexagon corners around a centre, matching axialToPix's pointy-top layout.
function corners(cx, cy) {
  var out = [];
  for (var i = 0; i < 6; i++) { var a = Math.PI / 180 * (60 * i - 30); out.push((cx + S * Math.cos(a)).toFixed(1) + ',' + (cy + S * Math.sin(a)).toFixed(1)); }
  return out.join(' ');
}

var pan = { x: 0, y: 0 }, zoom = 1.1, minZoom = 0.35, drag = null;
var svgEl = document.getElementById('worldSvg'), worldG = null;
var mapArea = document.getElementById('mapArea'), hoverChip = document.getElementById('hoverChip');
var overlayEl = document.getElementById('labels');
var markerEl = document.getElementById('markers');
var natPanel = document.getElementById('natPanel');
var evPop = document.getElementById('evPop');
var pointerMoved = false;   // set while dragging/pinching so a pan doesn't register as a nation click
var handleMapTap = null;    // set once the world loads: opens/closes the nation panel for a tapped element
var evPopReposition = null; // set while the event popup is open: keeps it anchored to its marker on pan/zoom
var ZOOM_CITY = 1.6;   // at/above this zoom, nation names fade out and city names + dots fade in
function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
// Map glyphs for a settlement, sized in world units (they ride with the SVG + fade in when zoomed, via
// the .citydot class). A capital gets a gold star; a plain city gets a small pitched-roof house. Both
// carry a white halo (double stroke) so they stay legible over any nation colour.
function starPoints(cx, cy, outer, inner) {
  var pts = [];
  for (var i = 0; i < 10; i++) {
    var a = Math.PI / 5 * i - Math.PI / 2, rad = (i % 2) ? inner : outer;
    pts.push((cx + rad * Math.cos(a)).toFixed(1) + ',' + (cy + rad * Math.sin(a)).toFixed(1));
  }
  return pts.join(' ');
}
function cityGlyph(isCap, x, y) {
  if (isCap) {
    // Gold star: a white halo stroke underneath, a thin dark edge on top (same points, drawn twice).
    var pts = starPoints(x, y - 0.5, 6, 2.6);
    return '<polygon class="citydot" points="' + pts + '" fill="#f0a03c" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>' +
      '<polygon class="citydot" points="' + pts + '" fill="#f0a03c" stroke="#7a4a12" stroke-width="0.6" stroke-linejoin="round"/>';
  }
  // medieval hamlet: a little cluster of two steep-gabled timber cottages — a taller one behind and
  // a shorter one in front (with a door). White halo underneath so it reads over any nation colour.
  var halo = '<rect x="' + (x - 5.4) + '" y="' + (y - 5.6) + '" width="10.8" height="10.4" rx="1.8" fill="#fff" opacity="0.5"/>';
  // back-left cottage (taller, narrow)
  var h1roof = '<polygon points="' + (x - 5) + ',' + (y - 1) + ' ' + (x - 2.5) + ',' + (y - 5.2) + ' ' + (x) + ',' + (y - 1) +
    '" fill="#7a4a2c" stroke="#4a3a2c" stroke-width="0.7" stroke-linejoin="round"/>';
  var h1body = '<rect x="' + (x - 4.4) + '" y="' + (y - 1) + '" width="3.8" height="4.6" fill="#e7ddc6" stroke="#4a3a2c" stroke-width="0.7"/>';
  // front-right cottage (shorter, wider) + door
  var h2roof = '<polygon points="' + (x - 0.4) + ',' + (y + 0.4) + ' ' + (x + 2.2) + ',' + (y - 2.8) + ' ' + (x + 4.8) + ',' + (y + 0.4) +
    '" fill="#8f5a34" stroke="#4a3a2c" stroke-width="0.7" stroke-linejoin="round"/>';
  var h2body = '<rect x="' + (x + 0.2) + '" y="' + (y + 0.4) + '" width="4" height="3.4" fill="#efe7d4" stroke="#4a3a2c" stroke-width="0.7"/>';
  var door = '<rect x="' + (x + 1.6) + '" y="' + (y + 1.7) + '" width="1.3" height="2.1" fill="#5c4326"/>';
  return '<g class="citydot">' + halo + h1roof + h1body + h2roof + h2body + door + '</g>';
}
// A NATO-style unit counter (schema/199), sized in world units so it rides with the map. Fill = allegiance
// (green for your units, red for foreign), symbol = type (Infantry crossed lines / Armor oval), corner
// badge = strength. Shown only in Military map mode (.unitctr, via CSS).
function unitCounter(u, x, y, mine) {
  var w = 16, h = 11;
  var fill = mine ? '#1d5a34' : '#8f2320', stroke = mine ? '#c2ead1' : '#ffb4ac';
  var g = '<rect x="' + (x - w / 2) + '" y="' + (y - h / 2) + '" width="' + w + '" height="' + h + '" rx="2" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1"/>';
  if (u.unit_type === 'armor') {
    g += '<ellipse cx="' + x + '" cy="' + y + '" rx="' + (w * 0.28) + '" ry="' + (h * 0.26) + '" fill="none" stroke="' + stroke + '" stroke-width="1.1"/>';
  } else {
    g += '<line x1="' + (x - w / 2 + 2.6) + '" y1="' + (y - h / 2 + 2) + '" x2="' + (x + w / 2 - 2.6) + '" y2="' + (y + h / 2 - 2) + '" stroke="' + stroke + '" stroke-width="1.1"/>' +
         '<line x1="' + (x - w / 2 + 2.6) + '" y1="' + (y + h / 2 - 2) + '" x2="' + (x + w / 2 - 2.6) + '" y2="' + (y - h / 2 + 2) + '" stroke="' + stroke + '" stroke-width="1.1"/>';
  }
  var bx = x + w / 2, by = y - h / 2;   // strength badge, top-right corner
  g += '<circle cx="' + bx + '" cy="' + by + '" r="3.6" fill="' + (mine ? '#0f3a20' : '#5c120f') + '" stroke="' + stroke + '" stroke-width="0.8"/>' +
    '<text x="' + bx + '" y="' + (by + 1.9) + '" text-anchor="middle" font-size="5" font-weight="800" fill="' + stroke +
    '" style="font-family:\'Space Mono\',monospace">' + (u.strength || '') + '</text>';
  return '<g class="unitctr">' + g + '</g>';
}
function closeEventPop() { if (evPop) { evPop.classList.remove('show'); evPop.innerHTML = ''; } }
// Reviewed-event memory is per in-game month: {date, ids}. A new month resets it (fresh events to review).
function loadReviewed(date) {
  try { var s = JSON.parse(localStorage.getItem('home2_reviewed') || '{}'); if (s && s.date === date && Array.isArray(s.ids)) return new Set(s.ids.map(String)); } catch (e) {}
  return new Set();
}
function saveReviewed(date, set) { try { localStorage.setItem('home2_reviewed', JSON.stringify({ date: date, ids: Array.from(set) })); } catch (e) {} }

// Position every overlay label from its stored world coords (data-x/data-y) → screen space, so the
// text stays a constant on-screen size while the SVG map scales underneath it.
function positionLabels() {
  if (!overlayEl) return;
  var kids = overlayEl.children;
  for (var i = 0; i < kids.length; i++) {
    var el = kids[i];
    var x = parseFloat(el.getAttribute('data-x')) * zoom + pan.x;
    var y = parseFloat(el.getAttribute('data-y')) * zoom + pan.y;
    var anchor = el.className.indexOf('natlabel') >= 0 ? ' translate(-50%,-50%)' : ' translateY(-50%)';
    el.style.transform = 'translate(' + x + 'px,' + y + 'px)' + anchor;
  }
}
// Event markers keep a constant on-screen size too — place each over its capital's world coords.
function positionMarkers() {
  if (!markerEl) return;
  var kids = markerEl.children;
  for (var i = 0; i < kids.length; i++) {
    var el = kids[i];
    el.style.transform = 'translate(' + (parseFloat(el.getAttribute('data-x')) * zoom + pan.x) + 'px,' +
      (parseFloat(el.getAttribute('data-y')) * zoom + pan.y) + 'px)';
  }
}
// Level of detail: below the threshold show nation names; at/above it show city names + dots.
function updateLod() {
  var zoomed = zoom >= ZOOM_CITY;
  if (overlayEl) overlayEl.classList.toggle('zoomed', zoomed);
  if (svgEl) svgEl.classList.toggle('zoomed', zoomed);
}

function applyTransform() {
  if (worldG) worldG.setAttribute('transform', 'translate(' + pan.x + ',' + pan.y + ') scale(' + zoom + ')');
  positionLabels();
  positionMarkers();
  if (evPop && evPop.classList.contains('show') && evPopReposition) evPopReposition();
  updateLod();
}

/* ---------------- LOAD + RENDER ---------------- */
(async function () {
  if (!isConfigured) { document.getElementById('loading').textContent = 'Supabase isn’t configured.'; return; }
  const user = await requireUser();
  if (!user) return;   // redirected to login

  var myNation = null, myPartyName = '', myAP = null, myInf = null;
  try {
    const { data: party } = await supabase.from('parties').select('name, nation_id, action_points, influence').eq('user_id', user.id).maybeSingle();
    if (party) { myNation = party.nation_id; myPartyName = party.name || ''; myAP = party.action_points; myInf = party.influence; }
  } catch (e) {}

  // The shared game clock — advanced by pg_cron every 6h (00/06/12/18 UTC, schema/60) and by the admin's
  // "Advance Tick". One source: tickToDate mirrors public.current_game_date().
  var curTick = null;
  try { const { data: gs } = await supabase.from('game_state').select('current_tick').maybeSingle(); if (gs) curTick = gs.current_tick; } catch (e) {}

  var nations = [], hexes = [], cities = [], capSlot = null;
  try { const { data } = await supabase.from('nations').select('id, name, color, flag, declarations, population, gdp, economy, stats'); nations = data || []; } catch (e) {}
  // world_hexes can exceed PostgREST's 1000-row cap on a large map, so page through it (selectAll) —
  // a plain .select() would silently drop hexes past 1000 and render them as open sea.
  try { const { data } = await selectAll('world_hexes', 'q, r, terrain, nation_id, name, population'); hexes = data || []; } catch (e) {}
  try { const { data } = await selectAll('cities', 'nation_id, name, q, r'); cities = data || []; } catch (e) {}
  // Military units (schema/199) — public-readable; drawn as counters in Military map mode.
  var units = [];
  try { const { data } = await selectAll('military_units', 'nation_id, name, unit_type, strength, q, r'); units = data || []; } catch (e) {}
  // International organizations (public — RLS is select-using-true) for the Intl Orgs map mode: keep the
  // active ones and their membership so a chip can highlight its member nations. Fetched once at load.
  var orgs = [], orgMembers = [];
  try { const { data } = await supabase.from('organizations').select('id, name, emblem, org_type, host_nation, status'); orgs = (data || []).filter(function (o) { return o.status === 'active'; }); } catch (e) {}
  try { const { data } = await supabase.from('organization_members').select('org_id, nation_id'); orgMembers = data || []; } catch (e) {}
  try { const { data } = await supabase.from('declarations').select('slug, options, default_index, custom_allowed').eq('slug', 'capital_name').maybeSingle(); capSlot = data || null; } catch (e) {}

  var natById = {}; nations.forEach(function (n) { natById[n.id] = n; });
  var colorOf = nationColors(nations);   // { nationId: '#rrggbb' } — stored colour or stable palette
  // Each nation's capital name (one source: the capital_name declaration), for the ★ marker.
  var capitalByNation = {};
  nations.forEach(function (n) { var c = capSlot ? declaredValue(capSlot, n.declarations || {}) : null; if (c && c !== '—') capitalByNation[n.id] = c; });

  // Extra data for the nation-snapshot panel — same sources the World page reads (one source of truth):
  // seated government → its formateur party's leader (Head of Government) + abbreviation, and the
  // player's 1–10 relation with each nation. Batched once up front so a click renders instantly.
  var govByNation = {}, leaderByParty = {}, partyById = {}, relMap = {}, titleSlot = null;
  try { titleSlot = await loadHogTitleSlot(supabase); } catch (e) {}
  var ids = nations.map(function (n) { return n.id; });
  if (ids.length) {
    try {
      const { data: govs } = await supabase.from('governments').select('nation_id, type, formateur_party_id').in('nation_id', ids).eq('status', 'active');
      (govs || []).forEach(function (g) { govByNation[g.nation_id] = g; });
      var fpIds = (govs || []).map(function (g) { return g.formateur_party_id; }).filter(Boolean);
      if (fpIds.length) {
        const { data: pols } = await supabase.from('politicians').select('party_id, first_name, last_name').eq('status', 'Party Leader').in('party_id', fpIds);
        (pols || []).forEach(function (p) { if (!leaderByParty[p.party_id]) leaderByParty[p.party_id] = p; });
        const { data: fps } = await supabase.from('parties').select('id, abbreviation, name').in('id', fpIds);
        (fps || []).forEach(function (p) { partyById[p.id] = p; });
      }
    } catch (e) {}
  }
  if (myNation) {
    try {
      const { data: rels } = await supabase.from('nation_relations').select('nation_a, nation_b, value').or('nation_a.eq.' + myNation + ',nation_b.eq.' + myNation);
      (rels || []).forEach(function (r) { relMap[r.nation_a === myNation ? r.nation_b : r.nation_a] = r.value; });
    } catch (e) {}
  }

  // Brand: the sidebar identity lives in the shared /sidenav.js (#pname / #psub / #flag); the topbar
  // keeps its own compact crest + name.
  var myNat = myNation ? natById[myNation] : null;
  var pnameEl = document.getElementById('pname'); if (pnameEl) pnameEl.textContent = myPartyName || (myNat ? myNat.name : 'Nationhood');
  var psubEl = document.getElementById('psub'); if (psubEl) psubEl.textContent = myNat ? myNat.name : 'The World';
  document.getElementById('tbName').textContent = myNat ? myNat.name : 'The World';
  if (myNat && myNat.flag) {
    var flagEl = document.getElementById('flag'); if (flagEl) { flagEl.src = myNat.flag; flagEl.hidden = false; }
    document.getElementById('tbCrest').innerHTML = '<img src="' + esc(myNat.flag) + '" alt="">';
  }
  document.getElementById('tbAP').textContent = (myAP != null ? myAP : '—');
  document.getElementById('tbInf').textContent = (myInf != null ? myInf : '—');
  document.getElementById('tbDate').textContent = (curTick != null ? tickToDate(curTick) : '—');

  var land = hexes.filter(function (h) { return h.terrain === 'land'; });
  if (!land.length) { document.getElementById('loading').textContent = 'No world map has been drawn yet (adminsetup → World Map).'; return; }

  // Water fill mirrors the shared renderer's tint (hexmap.js): a subtle 2-tone by (q+r) parity.
  var waterTone = function (q, r) { return ((q + r) % 2 === 0) ? '#b9dae6' : '#a9cfdd'; };
  var LAND_NEUTRAL = '#e9e3d4';   // unclaimed land

  // Sea hexes are drawn only where a 'sea' row exists; everywhere else the page background is the sea,
  // so a big sparse world stays light. Draw land + any authored sea rows.
  var body = '';
  var bMinX = Infinity, bMaxX = -Infinity, bMinY = Infinity, bMaxY = -Infinity;   // land bounds → fit zoom
  var natSum = {};   // nation_id → { x, y, n } running centroid of its land hexes (for the nation label)
  hexes.forEach(function (h) {
    var p = axialToPix(h.q, h.r, S, 0, 0);
    var isLand = h.terrain === 'land';
    if (isLand) {
      if (p.x < bMinX) bMinX = p.x; if (p.x > bMaxX) bMaxX = p.x; if (p.y < bMinY) bMinY = p.y; if (p.y > bMaxY) bMaxY = p.y;
      if (h.nation_id) { var s = natSum[h.nation_id] || (natSum[h.nation_id] = { x: 0, y: 0, n: 0 }); s.x += p.x; s.y += p.y; s.n++; }
    }
    var fill = isLand ? (h.nation_id ? (colorOf[h.nation_id] || '#9a8f7d') : LAND_NEUTRAL) : waterTone(h.q, h.r);
    var nm = h.nation_id && natById[h.nation_id] ? natById[h.nation_id].name : (isLand ? 'Unclaimed' : '');
    body += '<polygon points="' + corners(p.x, p.y) + '" fill="' + fill + '" stroke="#fff" stroke-opacity="' + (isLand ? 0.35 : 0.22) + '" stroke-width="1" data-nation="' + esc(nm) + '" data-nid="' + esc(h.nation_id || '') + '"/>';
  });
  // Player-nation outline glow.
  if (myNation) {
    land.filter(function (h) { return h.nation_id === myNation; }).forEach(function (h) {
      var p = axialToPix(h.q, h.r, S, 0, 0);
      body += '<polygon points="' + corners(p.x, p.y) + '" fill="none" stroke="#f0a03c" stroke-opacity=".55" stroke-width="1.6" pointer-events="none"/>';
    });
  }
  // Cities (real rows with coordinates). Dots ride with the SVG (fade in when zoomed); the NAMES live
  // in the constant-size overlay so they don't overlap or shrink. ★ marks the nation's declared capital.
  var cityLabels = [];
  cities.filter(function (c) { return c.q != null && c.r != null; }).forEach(function (c) {
    var p = axialToPix(c.q, c.r, S, 0, 0);
    var isCap = capitalByNation[c.nation_id] && capitalByNation[c.nation_id] === c.name;
    body += cityGlyph(isCap, p.x, p.y);   // ★ capital / 🏠 city icon (rides with the SVG, fades in when zoomed)
    cityLabels.push({ x: p.x + 7, y: p.y, text: c.name, cap: isCap });
  });

  // Military units — NATO counters at each unit's hex (Military map mode only). Units sharing a hex stack
  // diagonally so they stay distinguishable. Names go in the constant-size overlay next to the counter.
  var unitLabels = [], uByHex = {};
  units.filter(function (u) { return u.q != null && u.r != null; }).forEach(function (u) {
    var k = u.q + ',' + u.r; (uByHex[k] = uByHex[k] || []).push(u);
  });
  Object.keys(uByHex).forEach(function (k) {
    uByHex[k].forEach(function (u, i) {
      var p = axialToPix(u.q, u.r, S, 0, 0), cx = p.x + i * 4, cy = p.y - i * 4;   // diagonal stack
      body += unitCounter(u, cx, cy, u.nation_id === myNation);
      unitLabels.push({ x: cx + 11, y: cy, text: u.name });
    });
  });

  // A dashed frame around the inhabited world so the map's edge is legible. non-scaling-stroke keeps it a
  // crisp constant-width line at every zoom; drawn last so it reads above the hex fills.
  if (isFinite(bMinX)) {
    var mpad = S * 2.2;
    body += '<rect x="' + (bMinX - mpad).toFixed(1) + '" y="' + (bMinY - mpad).toFixed(1) +
      '" width="' + ((bMaxX - bMinX) + mpad * 2).toFixed(1) + '" height="' + ((bMaxY - bMinY) + mpad * 2).toFixed(1) +
      '" rx="' + S + '" fill="none" stroke="#2f3e48" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="7 6" vector-effect="non-scaling-stroke" pointer-events="none"/>';
  }

  svgEl.innerHTML = '<g id="world">' + body + '</g>';
  worldG = document.getElementById('world');
  document.getElementById('loading').style.display = 'none';

  // Build the constant-size label overlay: one nation name at each nation's centroid, plus every city
  // name. CSS cross-fades the two sets as the LOD threshold is crossed; positionLabels() places them.
  var natLabels = [];
  Object.keys(natSum).forEach(function (nid) {
    var s = natSum[nid], nm = natById[nid] ? natById[nid].name : '';
    if (nm && s.n) natLabels.push({ x: s.x / s.n, y: s.y / s.n, text: nm, nid: nid });
  });
  overlayEl.innerHTML =
    natLabels.map(function (l) { return '<div class="natlabel" data-nid="' + esc(l.nid) + '" data-x="' + l.x + '" data-y="' + l.y + '">' + esc(l.text) + '</div>'; }).join('') +
    cityLabels.map(function (l) { return '<div class="citylabel' + (l.cap ? ' cap' : '') + '" data-x="' + l.x + '" data-y="' + l.y + '">' + esc(l.text) + '</div>'; }).join('') +
    unitLabels.map(function (l) { return '<div class="unitlabel" data-x="' + l.x + '" data-y="' + l.y + '">' + esc(l.text) + '</div>'; }).join('');

  /* ---------------- INTL ORGS MAP MODE ---------------- */
  // A third map filter: highlight one organization's member nations at a time. Organizations have no
  // colour column, so each active org gets a stable accent by cycling a small palette in sorted order.
  var ORG_PALETTE = ['#f0a03c', '#4a4af0', '#2c9c8a', '#d8344a', '#8a5fd0', '#e07f2c'];
  var orgChips = document.getElementById('orgChips'), orgLegend = document.getElementById('orgLegend');
  var activeOrgs = orgs.slice().sort(function (a, b) { return String(a.name || '').localeCompare(String(b.name || '')); });
  var orgById = {}, orgColor = {}, orgMemberSet = {};
  activeOrgs.forEach(function (o, i) { orgById[o.id] = o; orgColor[o.id] = ORG_PALETTE[i % ORG_PALETTE.length]; orgMemberSet[o.id] = {}; });
  orgMembers.forEach(function (m) { if (orgMemberSet[m.org_id]) orgMemberSet[m.org_id][m.nation_id] = 1; });
  var selectedOrg = null;

  // A compact key for the chip: initials for a multi-word name, else the (truncated) name. Connective
  // words (of/the/and/…) are skipped so "Organization of Crude Exporting Nations" reads OCEN, not OOCEN.
  // The legend carries the full name, so this only needs to be recognisable at a glance.
  var ORG_STOPWORDS = { of:1, the:1, and:1, for:1, a:1, an:1, to:1, in:1, on:1 };
  function orgKey(o) {
    var n = String(o.name || '').trim(), words = n.split(/\s+/).filter(Boolean);
    var big = words.filter(function (w) { return !ORG_STOPWORDS[w.toLowerCase()]; });
    var initialsFrom = big.length >= 2 ? big : words;   // fall back to all words if stripping leaves <2
    if (words.length >= 2) return initialsFrom.map(function (w) { return w.charAt(0); }).join('').toUpperCase().slice(0, 5);
    return n.toUpperCase().slice(0, 6);
  }

  // Mix a colour toward the light sea (#a9cfdd) — used to fade non-member land while an org is selected.
  function mixHex(a, b, t) {
    var pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    var r = Math.round(((pa >> 16) & 255) * (1 - t) + ((pb >> 16) & 255) * t);
    var g = Math.round(((pa >> 8) & 255) * (1 - t) + ((pb >> 8) & 255) * t);
    var bl = Math.round((pa & 255) * (1 - t) + (pb & 255) * t);
    return '#' + (0x1000000 + (r << 16) + (g << 8) + bl).toString(16).slice(1);
  }
  function desaturate(hex) {
    if (!hex || hex.charAt(0) !== '#' || hex.length !== 7) return '#cfd8dd';
    return mixHex(hex, '#a9cfdd', 0.55);
  }

  // Render the chip row (one per active org), or a small note when there are none.
  if (!activeOrgs.length) {
    orgChips.innerHTML = '<span class="org-empty">No organizations yet</span>';
  } else {
    orgChips.innerHTML = activeOrgs.map(function (o) {
      var cnt = Object.keys(orgMemberSet[o.id]).length;
      return '<button class="org-chip" data-org="' + esc(o.id) + '" type="button">' +
        '<span class="oc-em">' + esc(o.emblem || '🏛') + '</span>' +
        '<span class="oc-key">' + esc(orgKey(o)) + '</span>' +
        '<span class="oc-cnt">' + cnt + '</span></button>';
    }).join('');
  }

  // Highlight the selected org's members (normal fill + a thick org-accent border) and fade everyone
  // else (desaturated fill, muted border); dim non-member nation labels. Originals are stashed on each
  // polygon the first time so restorePolitical() can put the base map back exactly.
  function applyOrgHighlight(orgId) {
    var members = orgMemberSet[orgId] || {}, accent = orgColor[orgId] || '#4a5cd0';
    Array.prototype.forEach.call(svgEl.querySelectorAll('polygon[data-nid]'), function (p) {
      if (p.getAttribute('data-ofill') === null) {
        p.setAttribute('data-ofill', p.getAttribute('fill'));
        p.setAttribute('data-ostroke', p.getAttribute('stroke') || '');
        p.setAttribute('data-osw', p.getAttribute('stroke-width') || '');
        p.setAttribute('data-oso', p.getAttribute('stroke-opacity') || '');
      }
      var nid = p.getAttribute('data-nid'), ofill = p.getAttribute('data-ofill');
      if (nid && members[nid]) {
        p.setAttribute('fill', ofill);
        p.setAttribute('stroke', accent);
        p.setAttribute('stroke-width', '2.4');
        p.setAttribute('stroke-opacity', '0.95');
      } else {
        p.setAttribute('fill', ofill === LAND_NEUTRAL ? '#e4ded2' : desaturate(ofill));
        p.setAttribute('stroke', '#fff');
        p.setAttribute('stroke-width', p.getAttribute('data-osw') || '1');
        p.setAttribute('stroke-opacity', '0.12');
      }
    });
    Array.prototype.forEach.call(overlayEl.querySelectorAll('.natlabel'), function (el) {
      var nid = el.getAttribute('data-nid');
      el.classList.toggle('org-dim', !(nid && members[nid]));
    });
  }
  // Put the base political map back: restore each hex's stashed fill/stroke and un-dim every label.
  function restorePolitical() {
    Array.prototype.forEach.call(svgEl.querySelectorAll('polygon[data-nid]'), function (p) {
      if (p.getAttribute('data-ofill') === null) return;
      p.setAttribute('fill', p.getAttribute('data-ofill'));
      p.setAttribute('stroke', p.getAttribute('data-ostroke'));
      p.setAttribute('stroke-width', p.getAttribute('data-osw'));
      p.setAttribute('stroke-opacity', p.getAttribute('data-oso'));
    });
    Array.prototype.forEach.call(overlayEl.querySelectorAll('.natlabel'), function (el) { el.classList.remove('org-dim'); });
  }
  function hideLegend() { orgLegend.classList.remove('show'); orgLegend.innerHTML = ''; }
  function renderLegend(orgId) {
    var o = orgById[orgId]; if (!o) return;
    var accent = orgColor[orgId];
    var names = Object.keys(orgMemberSet[orgId] || {}).map(function (nid) { return natById[nid] ? natById[nid].name : null; })
      .filter(Boolean).sort(function (a, b) { return a.localeCompare(b); });
    orgLegend.innerHTML =
      '<div class="ol-accent" style="background:' + accent + '"></div>' +
      '<div class="ol-body">' +
        '<div class="ol-head"><span class="ol-em">' + esc(o.emblem || '🏛') + '</span>' +
          '<div class="ol-name">' + esc(o.name || '') + '</div></div>' +
        '<div class="ol-count">' + names.length + ' MEMBER NATION' + (names.length === 1 ? '' : 'S') + ' — HIGHLIGHTED ON MAP</div>' +
        '<div class="ol-chips">' + (names.length ? names.map(function (nm) { return '<span class="ol-chip">' + esc(nm) + '</span>'; }).join('') : '<span class="ol-chip">No members yet</span>') + '</div>' +
      '</div>';
    orgLegend.classList.add('show');
  }
  // Apply the current selection to the map (highlight if one is picked, else the plain political map).
  function refreshOrgView() {
    if (selectedOrg) { applyOrgHighlight(selectedOrg); renderLegend(selectedOrg); }
    else { restorePolitical(); hideLegend(); }
  }
  // Click a chip: toggle it (exactly one org selected at a time), then repaint.
  orgChips.addEventListener('click', function (e) {
    var btn = e.target.closest('.org-chip'); if (!btn) return;
    var id = btn.getAttribute('data-org');
    selectedOrg = (selectedOrg === id) ? null : id;
    Array.prototype.forEach.call(orgChips.querySelectorAll('.org-chip'), function (c) {
      var on = c.getAttribute('data-org') === selectedOrg;
      c.classList.toggle('on', on);
      c.style.borderLeftColor = on ? orgColor[c.getAttribute('data-org')] : 'transparent';
    });
    refreshOrgView();
  });

  // The single map-mode switch (replaces the load-time pol/mil handler): Political/Military behave as
  // before; Intl Orgs reveals the chip row and applies any current org selection. Leaving orgs mode
  // hides the chips + legend and restores the political colours.
  function setMode(mode) {
    Array.prototype.forEach.call(document.querySelectorAll('#mapMode .mm-btn'), function (x) { x.classList.toggle('on', x.dataset.mode === mode); });
    mapArea.classList.toggle('milmode', mode === 'mil');
    var orgsOn = mode === 'orgs';
    orgChips.classList.toggle('show', orgsOn);
    if (orgsOn) refreshOrgView();
    else { restorePolitical(); hideLegend(); }
  }
  document.querySelectorAll('#mapMode .mm-btn').forEach(function (b) { b.onclick = function () { setMode(b.dataset.mode); }; });

  // Floor the zoom-out at "the whole world roughly fills the viewport" (with a little sea margin), so
  // the map can never shrink to a distant speck. Falls back to the default floor if bounds are empty.
  if (isFinite(bMinX)) {
    var worldW = (bMaxX - bMinX) + S * 4, worldH = (bMaxY - bMinY) + S * 4;
    var fitZoom = Math.min(mapArea.clientWidth / worldW, mapArea.clientHeight / worldH);
    minZoom = Math.max(0.3, fitZoom * 0.9);
    if (zoom < minZoom) zoom = minZoom;
  }

  // Centre the view on the player's nation (else the whole world's centroid).
  var focus = (myNation ? land.filter(function (h) { return h.nation_id === myNation; }) : []);
  if (!focus.length) focus = land;
  var cx = 0, cy = 0;
  focus.forEach(function (h) { var p = axialToPix(h.q, h.r, S, 0, 0); cx += p.x; cy += p.y; });
  cx /= focus.length; cy /= focus.length;
  pan = { x: mapArea.clientWidth / 2 - cx * zoom, y: mapArea.clientHeight / 2 - cy * zoom };
  applyTransform();

  // Hover-nation chip (delegated).
  worldG.addEventListener('mouseover', function (e) {
    if (e.target.tagName !== 'polygon') return;
    var nm = e.target.getAttribute('data-nation');
    if (nm) { hoverChip.textContent = nm; hoverChip.style.display = ''; } else { hoverChip.style.display = 'none'; }
  });

  /* ---------------- NATION SNAPSHOT PANEL ---------------- */
  function relBand(v) { return v <= 3 ? 'bad' : v <= 7 ? 'warn' : 'good'; }
  function relLabel(v) { return v <= 3 ? 'Antagonistic' : v <= 7 ? 'Neutral' : 'Friendly'; }
  var REL_VAR = { bad: 'red', warn: 'orange', good: 'green' };
  var STATS = ['prosperity', 'growth', 'welfare', 'order', 'image'];   // 'order' is shown as its inverse, Crime

  function closeNation() { natPanel.classList.remove('show'); natPanel.innerHTML = ''; natPanel.dataset.nid = ''; }

  function openNation(nid) {
    var n = natById[nid]; if (!n) return;
    closeEventPop();
    var eco = n.economy || {}, currency = eco.currency || '$';
    var g = govByNation[nid];
    var regimeTxt = regimeText(nationRegime(eco));
    var govType = g ? (cap(g.type) + ' Government' + (regimeTxt !== '—' ? ' — ' + regimeTxt : '')) : regimeTxt;
    var leader = (g && g.formateur_party_id) ? leaderByParty[g.formateur_party_id] : null;
    var hog = leader ? ((leader.first_name || '') + ' ' + (leader.last_name || '')).trim() : '';
    if (!hog) hog = '—';
    var govParty = (g && g.formateur_party_id) ? partyById[g.formateur_party_id] : null;
    var hogTag = (leader && govParty && govParty.abbreviation) ? ' [' + govParty.abbreviation + ']' : '';
    var hogTitle = declaredValue(titleSlot, n.declarations || {});
    if (!hogTitle || hogTitle === '—') hogTitle = 'Head of Government';
    var formalName = (n.declarations && n.declarations.formal_state_name) || n.name;
    var accent = colorOf[nid] || '#555';

    var relChip = (nid === myNation)
      ? '<span class="chip" style="color:var(--orange)">YOUR NATION</span>'
      : (function () { var v = (relMap[nid] != null) ? relMap[nid] : 5, b = relBand(v);
          return '<span class="chip" style="color:var(--' + REL_VAR[b] + ')">' + relLabel(v).toUpperCase() + ' · ' + v + '/10</span>'; })();

    var st = n.stats || {};
    // One renderer for a stat's value span — reused by the initial paint and the async Growth patch below.
    function statSpan(k, num, idAttr) {
      var crime = k === 'order';
      if (isNaN(num)) return '<span class="sv"' + idAttr + '>—</span>';
      var band = crime ? crimeBand(num) : statBand(k, num);
      var word = crime ? crimeLabel(num) : statLabel(k, num);
      var shown = crime ? crimeValue(num) : num;
      return '<span class="sv ' + band + '"' + idAttr + '>' + esc(word || '—') + ' <small>' + shown + '</small></span>';
    }
    var statsHtml = STATS.map(function (k) {
      var crime = k === 'order', name = crime ? 'Crime' : statName(k);
      // Growth is fully DERIVED (schema/221) — the raw stats.growth mirror is stale. Paint a placeholder
      // now and fill it from nation_stat_values (the ONE source the Government/Nation pages read), so the
      // number matches everywhere. The other four stats keep their authored mirror base.
      if (k === 'growth') return '<div class="np-srow"><span class="sk">' + esc(name) + '</span><span class="sv" id="npGrowth">…</span></div>';
      var raw = st[k], num = (raw != null && raw !== '') ? Number(raw) : NaN;
      return '<div class="np-srow"><span class="sk">' + esc(name) + '</span>' + statSpan(k, num, '') + '</div>';
    }).join('');

    var flagHtml = n.flag ? '<img class="np-flag" src="' + esc(n.flag) + '" alt="">' : '<div class="np-flag" style="background:' + accent + '"></div>';

    natPanel.innerHTML =
      '<div class="np-accent" style="background:' + accent + '"></div>' +
      '<div class="np-body">' +
        '<div class="np-head">' + flagHtml +
          '<div style="min-width:0"><div class="np-name">' + esc(formalName) + '</div>' +
            '<div class="np-sub">' + esc((govType || '—').toUpperCase()) + '</div></div>' +
          '<span class="np-x" id="npClose">✕</span></div>' +
        '<div style="margin-top:8px">' + relChip + '</div>' +
        '<div class="np-figs">' +
          '<div class="np-fig"><div class="k">GDP</div><div class="v">' + esc(currency) + (n.gdp != null ? esc(fmtGdp(n.gdp)) : '—') + '</div></div>' +
          '<div class="np-fig"><div class="k">POPULATION</div><div class="v">' + (n.population != null ? esc(fmtPop(n.population)) : '—') + '</div></div>' +
        '</div>' +
        '<div class="np-who"><span class="ttl">' + esc(hogTitle) + '</span> — <b>' + esc(hog) + '</b>' + esc(hogTag) + '</div>' +
        '<div class="np-stats">' + statsHtml + '</div>' +
      '</div>';
    natPanel.classList.add('show');
    natPanel.scrollTop = 0;
    natPanel.dataset.nid = nid;
    document.getElementById('npClose').onclick = closeNation;

    // Fill in the DERIVED Growth (one source: nation_stat_values RPC, schema/177 — same as the
    // Government/Nation pages). Guarded against a race where another nation was opened before this
    // resolves; falls back to the raw mirror only if the RPC is unavailable.
    var fbGrowth = (st.growth != null && st.growth !== '') ? Number(st.growth) : NaN;
    function paintGrowth(v) {
      if (natPanel.dataset.nid !== nid) return;
      var el = document.getElementById('npGrowth'); if (!el) return;
      el.outerHTML = statSpan('growth', v, ' id="npGrowth"');
    }
    supabase.rpc('nation_stat_values', { p_nation: nid, p_stats: ['Growth'] })
      .then(function (r) { paintGrowth((r && r.data && r.data.Growth != null) ? Number(r.data.Growth) : fbGrowth); })
      .catch(function () { paintGrowth(fbGrowth); });
  }

  // Open the snapshot for a tapped/clicked map element: a nation hex opens, empty land/sea closes,
  // anything else (city dot, label) is left alone. Shared by mouse click and the touch tap handler.
  handleMapTap = function (target) {
    if (!target || target.tagName !== 'polygon') return;
    closeEventPop();
    var nid = target.getAttribute('data-nid');
    if (nid) openNation(nid); else closeNation();
  };
  worldG.addEventListener('click', function (e) { if (!pointerMoved) handleMapTap(e.target); });

  /* ---------------- EVENT MARKERS (what's happening this in-game month) ---------------- */
  // Capital pixel position per nation: its declared capital city if we have one, else the land centroid.
  var capPos = {};
  cities.forEach(function (c) {
    if (c.q == null || c.r == null) return;
    if (capitalByNation[c.nation_id] && capitalByNation[c.nation_id] === c.name) {
      var cp = axialToPix(c.q, c.r, S, 0, 0); capPos[c.nation_id] = { x: cp.x, y: cp.y };
    }
  });
  Object.keys(natSum).forEach(function (nid) { if (!capPos[nid]) { var s = natSum[nid]; if (s.n) capPos[nid] = { x: s.x / s.n, y: s.y / s.n }; } });

  try {
    // "Now" = the current in-game month (already fetched as curTick; tickToDate mirrors the server).
    var curDate = (curTick != null) ? tickToDate(curTick) : null;
    if (curDate) {
      const { data: evs } = await supabase.from('events').select('id, nation_id, party_id, kind, body').eq('game_date', curDate);
      var curEvents = evs || [];
      // Author nation for each event's party (statements are broadcast under the author's party_id).
      var partyNation = {}, pids = curEvents.map(function (e) { return e.party_id; }).filter(Boolean);
      if (pids.length) {
        const { data: ps } = await supabase.from('parties').select('id, nation_id').in('id', pids);
        (ps || []).forEach(function (p) { partyNation[p.id] = p.nation_id; });
      }
      // Group this month's events per nation (its domestic events; a statement counts for its author AND
      // any nation it names). Broadcast statement copies (same author + body) collapse to one. Keep the
      // event objects so the review popup can list and open them.
      var eventsByNation = {}, seenDecl = {};
      curEvents.forEach(function (e) {
        var targets = {};
        if (e.kind === 'declaration') {
          var key = (e.party_id || '') + '|' + (e.body || '');
          if (seenDecl[key]) return; seenDecl[key] = 1;
          var author = partyNation[e.party_id];
          if (author) targets[author] = 1;
          nations.forEach(function (N) { if (N.name && e.body && e.body.indexOf(N.name) >= 0) targets[N.id] = 1; });
        } else if (e.nation_id) {
          targets[e.nation_id] = 1;
        }
        Object.keys(targets).forEach(function (nid) { (eventsByNation[nid] = eventsByNation[nid] || []).push({ id: e.id, kind: e.kind, body: e.body }); });
      });

      var reviewed = loadReviewed(curDate);
      function unreviewedFor(nid) { return (eventsByNation[nid] || []).filter(function (e) { return !reviewed.has(String(e.id)); }); }

      // Anchor the popup near the clicked marker's on-screen position, clamped inside the map. Re-run on
      // pan/zoom (via applyTransform) so it follows the marker while open.
      var anchor = null;
      function placePop() {
        if (!anchor || !evPop.classList.contains('show')) return;
        var sx = anchor.x * zoom + pan.x, sy = anchor.y * zoom + pan.y;
        var pw = evPop.offsetWidth, ph = evPop.offsetHeight, w = mapArea.clientWidth, h = mapArea.clientHeight;
        var left = Math.max(8, Math.min(sx - pw / 2, w - pw - 8));
        var top = sy - ph - 22; if (top < 52) top = Math.min(sy + 26, h - ph - 8);
        evPop.style.left = left + 'px'; evPop.style.top = Math.max(52, top) + 'px';
      }
      evPopReposition = placePop;

      function openEventPop(nid) {
        if (!unreviewedFor(nid).length) { closeEventPop(); return; }
        closeNation();
        var pos = capPos[nid]; anchor = pos ? { x: pos.x, y: pos.y } : null;
        evPop.classList.add('show');
        renderEventList(nid);
      }
      function renderEventList(nid) {
        var u = unreviewedFor(nid);
        if (!u.length) { closeEventPop(); return; }
        var nm = natById[nid] ? natById[nid].name : nid;
        evPop.innerHTML =
          '<div class="ep-head"><span class="ep-title">★ ' + esc(nm.toUpperCase()) + ' · ' + u.length + ' EVENT' + (u.length > 1 ? 'S' : '') + '</span><span class="ep-x" id="epX">✕</span></div>' +
          '<div class="ep-list">' + u.map(function (e) {
            return '<div class="ep-row" data-id="' + esc(String(e.id)) + '"><span class="ep-bang">!</span><span class="ep-rtxt">' + esc(e.body) + '</span>' +
              (e.kind ? '<span class="ep-tag">' + esc(e.kind) + '</span>' : '') + '<span class="ep-chev">›</span></div>';
          }).join('') + '</div>';
        document.getElementById('epX').onclick = closeEventPop;
        Array.prototype.forEach.call(evPop.querySelectorAll('.ep-row'), function (row) {
          row.onclick = function () { openEventDetail(nid, row.getAttribute('data-id')); };
        });
        placePop();
      }
      function openEventDetail(nid, id) {
        var e = (eventsByNation[nid] || []).find(function (x) { return String(x.id) === String(id); });
        if (!e) return;
        var nm = natById[nid] ? natById[nid].name : nid;
        evPop.innerHTML =
          '<div class="ep-head"><span class="ep-title"><span class="ep-back" id="epBack">‹</span> ★ ' + esc(nm.toUpperCase()) + '</span><span class="ep-x" id="epX">✕</span></div>' +
          '<div class="ep-detail"><div class="ep-drow"><span class="ep-bang">!</span>' + (e.kind ? '<span class="ep-dtag">' + esc(e.kind) + '</span>' : '') + '</div>' +
            '<div class="ep-dbody">' + esc(e.body) + '</div></div>';
        // Exiting the detail marks the event reviewed — it drops off the list; when the list empties the
        // marker disappears. Back → return to the (shorter) list; ✕ → close the popup entirely.
        document.getElementById('epBack').onclick = function () { reviewEvent(nid, id); renderEventList(nid); };
        document.getElementById('epX').onclick = function () { reviewEvent(nid, id); closeEventPop(); };
        placePop();
      }
      function reviewEvent(nid, id) { reviewed.add(String(id)); saveReviewed(curDate, reviewed); renderMarkers(); }

      function renderMarkers() {
        var mk = '';
        Object.keys(eventsByNation).forEach(function (nid) {
          var pos = capPos[nid]; if (!pos) return;
          var u = unreviewedFor(nid); if (!u.length) return;
          mk += '<div class="evmarker" data-x="' + pos.x + '" data-y="' + pos.y + '" data-nid="' + esc(nid) + '" title="' + esc(natById[nid] ? natById[nid].name : nid) + '">' +
            '<span class="ring"></span><span class="dot">!</span>' + (u.length > 1 ? '<span class="cnt">' + u.length + '</span>' : '') + '</div>';
        });
        markerEl.innerHTML = mk;
        Array.prototype.forEach.call(markerEl.querySelectorAll('.evmarker'), function (el) {
          el.addEventListener('click', function (ev) { ev.stopPropagation(); openEventPop(el.getAttribute('data-nid')); });
        });
        positionMarkers();
      }
      renderMarkers();
    }
  } catch (e) {}
})();

/* ---------------- PAN / ZOOM ---------------- */
mapArea.addEventListener('mousedown', function (e) { drag = { sx: e.clientX, sy: e.clientY, px: pan.x, py: pan.y }; pointerMoved = false; mapArea.classList.add('grabbing'); });
window.addEventListener('mousemove', function (e) { if (!drag) return; var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy; if (Math.abs(dx) + Math.abs(dy) > 3) pointerMoved = true; pan = { x: drag.px + dx, y: drag.py + dy }; applyTransform(); });
window.addEventListener('mouseup', function () { drag = null; mapArea.classList.remove('grabbing'); });
mapArea.addEventListener('mouseleave', function () { hoverChip.style.display = 'none'; });

function zoomAt(factor, cxp, cyp) {
  var nz = Math.max(minZoom, Math.min(3, Math.round(zoom * factor * 100) / 100));
  // keep the point under the cursor fixed
  pan.x = cxp - (cxp - pan.x) * (nz / zoom);
  pan.y = cyp - (cyp - pan.y) * (nz / zoom);
  zoom = nz; applyTransform();
}
document.getElementById('zoomIn').onclick = function () { zoomAt(1.2, mapArea.clientWidth / 2, mapArea.clientHeight / 2); };
document.getElementById('zoomOut').onclick = function () { zoomAt(1 / 1.2, mapArea.clientWidth / 2, mapArea.clientHeight / 2); };
// The map-mode filter (Political / Military / Intl Orgs) is wired inside the load block via setMode(),
// which needs the loaded org data + hex handles to highlight members.
mapArea.addEventListener('wheel', function (e) { e.preventDefault(); var rect = mapArea.getBoundingClientRect(); zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - rect.left, e.clientY - rect.top); }, { passive: false });

/* ---------------- TOUCH: one finger pans, two fingers pinch-zoom ---------------- */
var touch = null;   // { px, py, sx, sy } for a 1-finger pan, or { dist, mx, my } for a 2-finger pinch
function touchDist(t) { var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY; return Math.hypot(dx, dy); }
function touchMid(t, rect) { return { x: (t[0].clientX + t[1].clientX) / 2 - rect.left, y: (t[0].clientY + t[1].clientY) / 2 - rect.top }; }
mapArea.addEventListener('touchstart', function (e) {
  var rect = mapArea.getBoundingClientRect();
  pointerMoved = false;
  if (e.touches.length === 1) { touch = { mode: 'pan', sx: e.touches[0].clientX, sy: e.touches[0].clientY, px: pan.x, py: pan.y }; }
  else if (e.touches.length >= 2) { var m = touchMid(e.touches, rect); touch = { mode: 'pinch', dist: touchDist(e.touches), mx: m.x, my: m.y }; }
}, { passive: true });
mapArea.addEventListener('touchmove', function (e) {
  if (!touch) return;
  e.preventDefault();
  var rect = mapArea.getBoundingClientRect();
  if (touch.mode === 'pan' && e.touches.length === 1) {
    var dx = e.touches[0].clientX - touch.sx, dy = e.touches[0].clientY - touch.sy;
    if (Math.abs(dx) + Math.abs(dy) > 8) pointerMoved = true;   // only a real drag counts — a tap must still register
    pan = { x: touch.px + dx, y: touch.py + dy };
    applyTransform();
  } else if (touch.mode === 'pinch' && e.touches.length >= 2) {
    pointerMoved = true;
    var m = touchMid(e.touches, rect), d = touchDist(e.touches);
    // Follow the fingers (pan by the midpoint's drift) and zoom by the spread ratio around that midpoint.
    pan.x += m.x - touch.mx; pan.y += m.y - touch.my;
    if (touch.dist > 0) zoomAt(d / touch.dist, m.x, m.y); else applyTransform();
    touch.dist = d; touch.mx = m.x; touch.my = m.y;
  }
}, { passive: false });
function resetTouch(e) {
  // If one finger of a pinch lifts, hand the remaining finger a fresh pan anchor (no jump).
  if (touch && e.touches.length === 1) { touch = { mode: 'pan', sx: e.touches[0].clientX, sy: e.touches[0].clientY, px: pan.x, py: pan.y }; }
  else if (!e.touches.length) { touch = null; }
}
mapArea.addEventListener('touchend', function (e) {
  // A clean single-finger tap (no drag) on a map hex → open/close the nation under the finger. Touch
  // doesn't reliably synthesize a click on the SVG hex, so hit-test the lift point directly. Only act
  // when the tap actually lands on a hex — taps on the hamburger, zoom, markers, or the panel must keep
  // their native click, so we must NOT preventDefault on those.
  if (touch && !pointerMoved && !e.touches.length && handleMapTap && e.changedTouches.length) {
    var t = e.changedTouches[0];
    var el = document.elementFromPoint(t.clientX, t.clientY);
    if (el && el.tagName === 'polygon') {
      handleMapTap(el);
      e.preventDefault();   // suppress the compat click so we don't double-fire — hexes only
    }
  }
  resetTouch(e);
});
mapArea.addEventListener('touchcancel', resetTouch);

/* ---------------- NEXT-TICK COUNTDOWN ---------------- */
// The server advances the clock via pg_cron at 00/06/12/18 UTC (schema/60). The next tick is simply the
// next TICK_PERIOD_MS boundary — pure wall-clock, no round-trip. msUntilNextTick + fmtCountdown are the
// shared helpers in util.js (one source, same as the topbar).
async function refreshGameDate() {
  try {
    const { data: gs } = await supabase.from('game_state').select('current_tick').maybeSingle();
    var el = document.getElementById('tbDate');
    if (el && gs && gs.current_tick != null) el.textContent = tickToDate(gs.current_tick);
  } catch (e) {}
}
(function () {
  var el = document.getElementById('tbNext'); if (!el) return;
  var remaining = msUntilNextTick(new Date());
  el.textContent = fmtCountdown(remaining);
  setInterval(function () {
    var prev = remaining; remaining = msUntilNextTick(new Date());
    if (remaining > prev) { refreshGameDate(); setTimeout(refreshGameDate, 6000); }   // boundary passed → the server ticked; re-pull the date
    el.textContent = fmtCountdown(remaining);
  }, 1000);
})();
</script>
</body>
</html>
