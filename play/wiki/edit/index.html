<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/theme.js"></script>
<title>Write an entry · Nationpedia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFAF8;--surface:#FFFFFF;--ink:#15151B;--muted:#5b5b63;--soft:#8d8d95;
    --line:#E7E5E0;--line2:#D9D6D0;--chip:#F4F3EF;--field:#FCFBF9;
    --indigo:#5546E8;--indigo-soft:#ECE9FD;
    --red:#C42B2B;--red-soft:#FBEAE9;--amber:#E0820E;--amber-soft:#FBF0DD;--green:#16915a;--green-soft:#E5F4EC;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .app{display:flex;min-height:100vh}
  .main{flex:1;padding:24px clamp(16px,3vw,40px) 64px;min-width:0}
  .ehead{margin-bottom:18px}
  .ehead .backlink{display:inline-flex;align-items:center;gap:6px;font-family:'Space Mono',monospace;font-size:11px;color:var(--indigo);cursor:pointer;margin-bottom:10px}
  .ehead .backlink svg{width:13px;height:13px;stroke:var(--indigo);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ehead h1{font-weight:900;font-size:clamp(22px,3.4vw,28px);letter-spacing:-.03em}
  .ehead p{color:var(--muted);font-size:13px;margin-top:5px;max-width:640px}
  .ehead p code{font-family:'Space Mono',monospace;font-size:11px;background:var(--chip);padding:1px 5px;border-radius:5px}
  .wksplit{display:grid;grid-template-columns:minmax(320px,460px) 1fr;gap:24px;align-items:start}
  @media(max-width:900px){.wksplit{grid-template-columns:1fr}.wkpv-col{position:static}}
  .wkpv-col{position:sticky;top:16px}
  .wkpv-hd{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:700;margin:0 0 10px}
  .wkpv{border:1px solid var(--line);border-radius:14px;padding:24px clamp(16px,2vw,28px);background:var(--surface);overflow:hidden}
</style>
</head>
<body>
<div class="app">
  <div id="sidenav"></div>
  <main class="main">
    <div class="topbar" id="topbar"></div>
    <div class="ehead">
      <span class="backlink" id="ehBack"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Nationpedia</span>
      <h1 id="ehTitle">Write a Nationpedia entry</h1>
      <p>Markup: <code>[[Title]]</code> or <code>[[Title|label]]</code> to link another article, <code>**bold**</code>, <code>[1]</code> for a reference marker, and a blank line for a new paragraph. The preview updates as you type.</p>
    </div>
    <div class="wksplit">
      <div id="wkFormHost"></div>
      <div class="wkpv-col">
        <div class="wkpv-hd">Live preview</div>
        <div class="wkpv wk-article" id="wkPreview"></div>
      </div>
    </div>
  </main>
</div>

<script type="module">
  import { supabase, isConfigured, requireUser } from '/supabase.js';
  import { ideologyLabel } from '/archetypes.js';
  import { mountTopbar } from '/topbar.js';
  import { mountSidenav } from '/sidenav.js';
  import { mountWikiEditor } from '/wiki-editor.js';

  mountTopbar();
  mountSidenav();

  document.getElementById('ehBack').onclick = function () { location.href = '/play/wiki/'; };

  var known = new Set();

  async function setBrand(userId) {
    try {
      const { data: party } = await supabase.from('parties').select('name, archetype, nation_id').eq('user_id', userId).single();
      if (!party) return;
      document.getElementById('pname').textContent = party.name;
      const { data: nation } = await supabase.from('nations').select('name, flag').eq('id', party.nation_id).single();
      document.getElementById('psub').textContent = ideologyLabel(party) + (nation && nation.name ? ' · ' + nation.name : '');
      if (nation && nation.flag) { var f = document.getElementById('flag'); f.onload = function () { f.hidden = false; }; f.src = nation.flag; }
    } catch (e) { /* brand is cosmetic */ }
  }

  (async () => {
    if (!isConfigured) { document.getElementById('ehTitle').textContent = 'Nationpedia isn’t connected yet.'; return; }
    const user = await requireUser();
    if (!user) return;
    setBrand(user.id);

    // Known titles (for cross-link liveness in the preview) — all existing article titles.
    try {
      const { data: titles } = await supabase.from('wiki_articles').select('title');
      (titles || []).forEach(function (t) { known.add(t.title.toLowerCase()); });
    } catch (e) { /* preview links just render muted */ }

    var editor = mountWikiEditor({
      supabase: supabase,
      host: document.getElementById('wkFormHost'),
      previewEl: document.getElementById('wkPreview'),
      knownTitles: function () { return new Set(known); },
      userId: user.id,
      canDelete: false, // deletes are admin-only (adminsetup); players create + edit their own
      onSaved: function (title) { if (title) location.href = '/play/wiki/?a=' + encodeURIComponent(title); }
    });

    // Edit an existing entry: ?id=<uuid>. RLS still gates whether the save succeeds (own/admin).
    var id = new URLSearchParams(location.search).get('id');
    if (id) {
      try {
        const { data: row, error } = await supabase.from('wiki_articles').select('id, title, kind, definition').eq('id', id).single();
        if (!error && row) { editor.loadRow(row); document.getElementById('ehTitle').textContent = 'Edit · ' + row.title; }
      } catch (e) { /* fall through to a blank new entry */ }
    }
  })();
</script>
</body>
</html>
