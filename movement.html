<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Politician — Movement</title>
<style>
/* Topbar / nav / body base live in js/politician-topbar.js. This page only
   styles its own body content. Mirrors politician-movements.html's
   visual language (teal accents, monospace meta). */
* { box-sizing:border-box; margin:0; padding:0; }
.content { padding:32px 24px 24px; }

.crumb { display:inline-flex; align-items:center; gap:6px; font-size:11px;
  letter-spacing:0.06em; color:#666; text-decoration:none; margin-bottom:20px;
  font-family:monospace; }
.crumb:hover { color:#5aafa5; }
.crumb .arrow { font-size:13px; }

/* Header card: bigger version of politician-movements.html's .mv-card, with
   stats stacked on the right. Same left-rail accent in the party color. */
.mh-card { background:#0e1212; border:0.5px solid rgba(255,255,255,0.08);
  border-left:3px solid #5aafa5; border-radius:6px;
  padding:28px 32px; margin-bottom:28px; }
.mh-top { display:flex; align-items:flex-start; gap:20px; margin-bottom:14px; }
.mh-badge { width:64px; height:64px; flex-shrink:0; border-radius:5px;
  display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,0.04); color:#d4d4d4;
  font-size:22px; font-weight:600; font-family:monospace; letter-spacing:0.05em; }
.mh-titles { flex:1; min-width:0; padding-top:4px; }
.mh-title  { font-size:28px; color:#fff; font-weight:500; line-height:1.2;
  margin-bottom:6px; word-break:break-word; }
.mh-leader { font-size:13px; color:#888; line-height:1.5; }
.mh-stats  { display:flex; gap:32px; flex-shrink:0; font-family:monospace;
  font-size:11px; color:#666; letter-spacing:0.08em; text-transform:uppercase;
  text-align:right; }
.mh-stats strong { display:block; color:#d4d4d4; font-size:22px;
  font-weight:600; margin-top:4px; font-variant-numeric:tabular-nums; }
.mh-desc { color:#cfcabf; font-size:14px; line-height:1.6;
  padding-top:16px; border-top:0.5px solid rgba(255,255,255,0.06); }
.mh-desc.empty { color:#666; font-style:italic; }

/* Members section. .mb-row mirrors .jp-row's grid shape from
   politician-movements.html so the two list surfaces feel related. */
.section-heading { display:flex; align-items:baseline; gap:10px; margin:28px 0 14px; }
.section-heading .sans  { font-size:18px; font-weight:500; color:#fff; }
.section-heading .serif { font-size:18px; font-family:Georgia,'Times New Roman',serif;
  font-style:italic; color:#5aafa5; }
.section-heading .meta  { margin-left:auto; color:#555; font-size:10px;
  letter-spacing:0.1em; font-family:monospace; }

.mb-list { background:#0d0d0d; border:0.5px solid rgba(255,255,255,0.08);
  border-radius:6px; overflow:hidden; }
.mb-row { display:grid; grid-template-columns:38px 1fr auto;
  gap:14px; align-items:center; padding:12px 18px;
  border-bottom:0.5px solid rgba(255,255,255,0.05); }
.mb-row:last-child { border-bottom:none; }
.mb-logo { width:38px; height:38px; border-radius:5px; display:flex;
  align-items:center; justify-content:center;
  background:rgba(255,255,255,0.05); color:#cfcabf;
  font-size:12px; font-weight:700; font-family:monospace; letter-spacing:0.04em; }
.mb-name { font-size:13px; font-weight:600; color:#fff; line-height:1.2; }
.mb-sub  { font-size:10px; color:#888; margin-top:2px; letter-spacing:0.04em; }
.mb-tag  { font-size:9px; color:#5aafa5; letter-spacing:0.08em; font-family:monospace;
  text-transform:uppercase; }

.mb-empty { padding:36px 18px; text-align:center; color:#666; font-size:12px;
  font-style:italic; }

.loading { font-family:monospace; font-size:11px; color:#4a4940; text-align:center;
  padding:80px 20px; }
.error { font-family:monospace; font-size:12px; color:#c98a8a; text-align:center;
  padding:80px 20px; }

@media (max-width:700px) {
  .mh-card { padding:20px 22px; }
  .mh-top { flex-direction:column; gap:14px; }
  .mh-badge { width:54px; height:54px; font-size:18px; }
  .mh-title { font-size:22px; }
  .mh-stats { width:100%; justify-content:space-between; text-align:left; }
}
</style>
</head>
<body>

<div id="pol-topbar-container"></div>

<div class="content" id="content" style="display:none;">
  <a class="crumb" href="politician-movements.html"><span class="arrow">&larr;</span> Movements</a>
  <div id="detail"></div>
</div>
<div id="loading" class="loading">Loading movement…</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { bootstrapPolitician } from './js/politician-topbar.js';

function escHtml(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

// Hex-color sanitiser. Mirrors politician-movements.html so a stray
// non-hex party_color never escapes into the style attribute.
function safeHexColor(c) {
  return /^#[0-9a-f]{3}([0-9a-f]{3}([0-9a-f]{2})?)?$/i.test(c || '') ? c : '#5aafa5';
}

async function init() {
  let ctx = null;
  try { ctx = await bootstrapPolitician('movements'); }
  catch (err) {
    console.error('movement: bootstrap failed', err);
    document.getElementById('loading').textContent = 'Failed to load. Please reload the page.';
    return;
  }
  if (!ctx) return;

  const params = new URLSearchParams(window.location.search);
  const movementId = params.get('id');
  if (!movementId) {
    showError('No movement id in the URL.');
    return;
  }

  // Movement row + members in parallel. The movement must be a
  // movement_party in the politician's nation; the members are every
  // politician whose politician_party_id points at this movement.
  // Abandoned movements aren't reachable from the list (which filters
  // them out) — a stale link still gets a clean "not found" message
  // rather than rendering ghost state.
  const [movRes, memRes] = await Promise.all([
    _supabase.from('factions')
      .select('id, faction_name, faction_type, nation_id, abbreviation, seats, popularity_pct, '
            + 'party_color, party_description, leader_first_name, leader_last_name')
      .eq('id', movementId)
      .is('abandoned_at', null)
      .maybeSingle(),
    _supabase.from('factions')
      .select('id, faction_name, leader_first_name, leader_last_name, founded_tick')
      .eq('faction_type', 'politician')
      .eq('politician_party_id', movementId)
      .is('abandoned_at', null)
      .order('founded_tick', { ascending: true }),
  ]);

  if (movRes.error)  { showError('Could not load movement: ' + movRes.error.message); return; }
  if (memRes.error)  console.warn('[movement] members fetch error:', memRes.error.message);

  const movement = movRes.data;
  if (!movement || movement.faction_type !== 'movement_party') {
    showError('Movement not found.');
    return;
  }

  document.getElementById('detail').innerHTML =
    renderHeader(movement) + renderMembers(memRes.data || []);
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}

function renderHeader(m) {
  const accent = safeHexColor(m.party_color);
  const leader = [m.leader_first_name, m.leader_last_name].filter(Boolean).join(' ');
  const leaderLine = leader ? `Led by ${escHtml(leader)}` : '<em>No leader on record.</em>';
  const pop = (m.popularity_pct != null)
    ? `<div>Popularity<strong>${Math.round(Number(m.popularity_pct))}%</strong></div>`
    : '';
  const desc = m.party_description
    ? `<div class="mh-desc">${escHtml(m.party_description)}</div>`
    : `<div class="mh-desc empty">No description on record.</div>`;
  return `<div class="mh-card" style="border-left-color:${accent};">
    <div class="mh-top">
      <div class="mh-badge">${escHtml(m.abbreviation || '—')}</div>
      <div class="mh-titles">
        <div class="mh-title">${escHtml(m.faction_name)}</div>
        <div class="mh-leader">${leaderLine}</div>
      </div>
      <div class="mh-stats">
        <div>Seats<strong>${Number(m.seats) || 0}</strong></div>
        ${pop}
      </div>
    </div>
    ${desc}
  </div>`;
}

function renderMembers(members) {
  const head = `<div class="section-heading">
    <span class="sans">Members</span>
    <span class="serif">Roster</span>
    <span class="meta">${members.length} ${members.length === 1 ? 'politician' : 'politicians'}</span>
  </div>`;
  if (!members.length) {
    return head + `<div class="mb-list"><div class="mb-empty">No politicians have joined this movement yet.</div></div>`;
  }
  const rows = members.map(p => {
    const fullName = [p.leader_first_name, p.leader_last_name].filter(Boolean).join(' ')
      || p.faction_name || 'Unknown politician';
    const initials = ((p.leader_first_name?.[0] || '') + (p.leader_last_name?.[0] || ''))
      .toUpperCase() || '?';
    const founded = (p.founded_tick != null) ? `Joined as of T${p.founded_tick}` : '';
    return `<div class="mb-row">
      <div class="mb-logo">${escHtml(initials)}</div>
      <div>
        <div class="mb-name">${escHtml(fullName)}</div>
        ${founded ? `<div class="mb-sub">${escHtml(founded)}</div>` : ''}
      </div>
      <div class="mb-tag">Member</div>
    </div>`;
  }).join('');
  return head + `<div class="mb-list">${rows}</div>`;
}

function showError(msg) {
  const el = document.getElementById('loading');
  el.className = 'error';
  el.textContent = msg;
}

init();
</script>
</body>
</html>
