<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Nation | Nationhood Alpha</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg-0: #0e0e0c;
  --bg-1: #141412;
  --bg-2: #1a1a17;
  --bg-3: #1e1e1a;
  --bg-4: #24241f;
  --bg-5: #2c2c26;
  --bg-hover: #282822;
  --text-bright: #e2e0d6;
  --text-primary: #c4c2b8;
  --text-secondary: #8a8778;
  --text-muted: #6b6a5e;
  --text-dim: #4a4940;
  --text-ghost: #333229;
  --border-hair: rgba(255,255,255,0.04);
  --border-0: rgba(255,255,255,0.06);
  --border-1: rgba(255,255,255,0.08);
  --border-2: rgba(255,255,255,0.12);
  --green: #5cb85c;
  --green-faint: rgba(92,184,92,0.08);
  --green-border: rgba(92,184,92,0.18);
  --red: #d9534f;
  --red-faint: rgba(217,83,79,0.08);
  --red-border: rgba(217,83,79,0.18);
  --amber: #c8a64e;
  --amber-faint: rgba(200,166,78,0.08);
  --amber-border: rgba(200,166,78,0.18);
  --blue: #5b9bd5;
  --blue-faint: rgba(91,155,213,0.08);
  --blue-border: rgba(91,155,213,0.18);
  --purple: #8b7ec8;
  --purple-faint: rgba(139,126,200,0.08);
  --purple-border: rgba(139,126,200,0.18);
  --teal: #5aafa5;
  --teal-faint: rgba(90,175,165,0.08);
  --teal-border: rgba(90,175,165,0.18);
  --orange: #d48a3c;
  --orange-faint: rgba(212,138,60,0.08);
  --orange-border: rgba(212,138,60,0.18);
  --font-mono: 'JetBrains Mono', monospace;
  --font-ui: 'IBM Plex Sans', -apple-system, sans-serif;
  --font-serif: 'IBM Plex Serif', Georgia, serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg-0);
  color: var(--text-primary);
  font-family: var(--font-ui);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.page-header {
  text-align: center;
  padding: 48px 20px 16px;
  max-width: 900px;
}
.page-header h1 {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.page-header .title {
  font-family: var(--font-ui);
  font-size: 18px;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 6px;
}
.page-header .subtitle {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  line-height: 1.5;
}

/* Nation cards grid */
.nations-grid {
  width: 100%;
  max-width: 900px;
  padding: 0 16px 48px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 12px;
}

.nation-card {
  background: var(--bg-2);
  border: 1px solid var(--border-0);
  cursor: pointer;
  transition: border-color 0.15s;
}
.nation-card:hover {
  border-color: var(--border-2);
}
.nation-card.disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* Card header */
.nation-card__header {
  background: var(--bg-3);
  border-bottom: 1px solid var(--border-hair);
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.nation-card__flag {
  width: 36px;
  height: 24px;
  object-fit: cover;
  border: 1px solid var(--border-0);
}
.nation-card__name {
  font-family: var(--font-ui);
  font-size: 14px;
  font-weight: 700;
  color: var(--text-bright);
  flex: 1;
}
.nation-card__gov-type {
  font-family: var(--font-mono);
  font-size: 8.5px;
  font-weight: 700;
  padding: 2px 6px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.gov-democracy {
  background: var(--green-faint);
  color: var(--green);
  border: 1px solid var(--green-border);
}
.gov-autocracy {
  background: var(--red-faint);
  color: var(--red);
  border: 1px solid var(--red-border);
}
.gov-presidential {
  background: var(--blue-faint);
  color: var(--blue);
  border: 1px solid var(--blue-border);
}

/* Card body */
.nation-card__body {
  padding: 10px 12px;
}

/* Stat row */
.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 3px 0;
  font-family: var(--font-mono);
  font-size: 10.5px;
}
.stat-row__label {
  color: var(--text-secondary);
}
.stat-row__value {
  font-weight: 600;
}

/* Seat bar */
.seat-bar {
  margin: 8px 0;
}
.seat-bar__label {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.seat-bar__track {
  display: flex;
  height: 6px;
  gap: 2px;
  overflow: hidden;
}
.seat-bar__segment {
  height: 100%;
}
.seat-bar__empty {
  flex: 1;
  height: 100%;
  background: var(--bg-5);
}
.seat-bar__legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 4px;
}
.seat-legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-secondary);
}
.seat-legend-dot {
  width: 6px;
  height: 6px;
}

/* Party list inside card */
.party-list {
  margin-top: 8px;
}
.party-list__header {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 4px;
  padding-bottom: 3px;
  border-bottom: 1px solid var(--border-hair);
}
.party-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 0;
  border-bottom: 1px solid var(--border-hair);
}
.party-row:last-child {
  border-bottom: none;
}
.party-row__dot {
  width: 6px;
  height: 6px;
  flex-shrink: 0;
}
.party-row__name {
  font-family: var(--font-ui);
  font-size: 10.5px;
  font-weight: 600;
  color: var(--text-primary);
  flex: 1;
}
.party-row__abbr {
  font-family: var(--font-mono);
  font-size: 8px;
  font-weight: 700;
  padding: 1px 4px;
  color: var(--text-muted);
  background: var(--bg-4);
  border: 1px solid var(--border-0);
}
.party-row__ideo {
  font-family: var(--font-mono);
  font-size: 8px;
  color: var(--text-dim);
}
.party-row__seats {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  color: var(--text-secondary);
  min-width: 30px;
  text-align: right;
}

/* Crisis section */
.crisis-section {
  margin-top: 8px;
}
.crisis-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 0;
}
.crisis-pip {
  width: 3px;
  height: 14px;
  background: var(--red);
  flex-shrink: 0;
}
.crisis-name {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  color: var(--red);
}
.no-crisis {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-muted);
  padding: 2px 0;
  font-style: italic;
}

/* Card footer */
.nation-card__footer {
  background: var(--bg-3);
  border-top: 1px solid var(--border-hair);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: background 0.15s ease;
}
.nation-card__footer:hover {
  background: var(--bg-4);
}
.join-label {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--text-secondary);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.join-arrow {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
}
.nation-card:hover .join-label {
  color: var(--green);
}
.nation-card:hover .join-arrow {
  color: var(--green);
}
.nation-card.disabled .nation-card__footer {
  cursor: default;
}
.nation-card.disabled:hover .nation-card__footer {
  background: var(--bg-3);
}
.nation-card.disabled:hover .join-label,
.nation-card.disabled:hover .join-arrow {
  color: var(--text-dim);
}

/* Confirm modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
.modal-overlay.active {
  display: flex;
}
.modal {
  background: var(--bg-2);
  border: 1px solid var(--border-1);
  max-width: 400px;
  width: 90%;
}
.modal__header {
  background: var(--bg-3);
  border-bottom: 1px solid var(--border-hair);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.modal__dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--amber);
}
.modal__title {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.modal__body {
  padding: 14px;
}
.modal__text {
  font-family: var(--font-ui);
  font-size: 12px;
  color: var(--text-primary);
  margin-bottom: 6px;
}
.modal__nation-name {
  font-family: var(--font-ui);
  font-size: 16px;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 4px;
}
.modal__gov-badge {
  font-family: var(--font-mono);
  font-size: 8.5px;
  font-weight: 700;
  padding: 2px 6px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  display: inline-block;
  margin-bottom: 12px;
}
.modal__actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}
.modal__btn {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  padding: 7px 14px;
  border: 1px solid var(--border-0);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.modal__btn--cancel {
  background: var(--bg-3);
  color: var(--text-muted);
}
.modal__btn--cancel:hover {
  background: var(--bg-4);
  color: var(--text-secondary);
}
.modal__btn--confirm {
  background: var(--green-faint);
  color: var(--green);
  border-color: var(--green-border);
}
.modal__btn--confirm:hover {
  background: rgba(92,184,92,0.14);
}

.loading-msg {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  text-align: center;
  padding: 80px 20px;
}

.error-msg {
  width: 100%;
  max-width: 900px;
  padding: 0 16px;
  margin-bottom: 12px;
}
.error-msg__inner {
  background: var(--red-faint);
  border: 1px solid var(--red-border);
  border-left: 3px solid var(--red);
  color: var(--red);
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 8px 12px;
  display: none;
}

@media (max-width: 480px) {
  .nations-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<div id="loading" class="loading-msg">LOADING NATIONS...</div>

<div id="page-content" style="display:none; width:100%; flex-direction:column; align-items:center;">
  <div class="page-header">
    <h1>Nationhood</h1>
    <div class="title">Choose Your Nation</div>
    <div class="subtitle">Select a nation to join. Each nation has its own government type, parties, and crises. Your path forward depends on the nation's government.</div>
  </div>

  <div class="error-msg"><div class="error-msg__inner" id="error-message"></div></div>

  <div class="nations-grid" id="nations-grid"></div>
</div>

<!-- Confirm Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal__header">
      <div class="modal__dot"></div>
      <span class="modal__title">Confirm Nation</span>
    </div>
    <div class="modal__body">
      <div class="modal__text">You are about to join:</div>
      <div class="modal__nation-name" id="modal-nation-name"></div>
      <div id="modal-gov-badge" class="modal__gov-badge"></div>
      <div class="modal__text" id="modal-flow-hint" style="font-size:10px; color:var(--text-muted); font-family:var(--font-mono);"></div>
      <div class="modal__actions">
        <button class="modal__btn modal__btn--cancel" onclick="closeModal()">CANCEL</button>
        <button class="modal__btn modal__btn--confirm" id="modal-confirm-btn" onclick="confirmNation()">CONTINUE</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { escapeHtml, countEligibleParties } from './js/utils.js';

const FALLBACK_COLORS = ['#5b9bd5','#d48a3c','#5aafa5','#8b7ec8','#5cb85c','#d9534f','#c8a64e'];

const IDEOLOGY_COLORS = {
  'Liberty': '#3b82f6', 'Equality': '#ef4444',
  'Tradition': '#a855f7', 'Progress': '#22c55e',
  'Security': '#f59e0b', 'Freedom': '#06b6d4',
  'Globalism': '#14b8a6', 'Nationalism': '#f97316',
  'Individualism': '#eab308', 'Collectivism': '#ec4899'
};

let currentUser = null;
let allNations = [];
let selectedNationId = null;

async function init() {
  const { data: { user } } = await _supabase.auth.getUser();
  if (!user) { window.location.href = 'login.html'; return; }
  currentUser = user;

  // Check if user already has a party
  const { data: faction } = await _supabase
    .from('factions').select('id, nation_id').eq('id', user.id).eq('faction_type', 'party').maybeSingle();
  if (faction && faction.nation_id) {
    window.location.href = 'dashboard.html';
    return;
  }

  await loadNations();

  document.getElementById('loading').style.display = 'none';
  const content = document.getElementById('page-content');
  content.style.display = 'flex';
}

async function loadNations() {
  const [nationsRes, partiesRes, crisesRes, ideologiesRes] = await Promise.all([
    _supabase.from('nations').select('*'),
    _supabase.from('factions').select('id, faction_type, faction_name, abbreviation, seats, nation_id, party_color, ideology_value_1, ideology_value_2').eq('faction_type', 'party'),
    _supabase.from('active_crises').select('nation_id, crisis_id, crisis_templates(name)'),
    _supabase.from('faction_ideology').select('faction_id, liberty_equality, tradition_progress, security_freedom, globalism_nationalism, individualism_collectivism')
  ]);

  const nations = nationsRes.data || [];
  const parties = partiesRes.data || [];
  const crises = crisesRes.data || [];
  const ideologies = ideologiesRes.data || [];

  const partiesByNation = {};
  const crisesByNation = {};
  const ideoByFaction = {};

  for (const p of parties) {
    if (!partiesByNation[p.nation_id]) partiesByNation[p.nation_id] = [];
    partiesByNation[p.nation_id].push(p);
  }
  for (const c of crises) {
    if (!crisesByNation[c.nation_id]) crisesByNation[c.nation_id] = [];
    crisesByNation[c.nation_id].push(c);
  }
  for (const i of ideologies) {
    ideoByFaction[i.faction_id] = i;
  }

  allNations = nations;
  renderNations(nations, partiesByNation, crisesByNation, ideoByFaction);
}

function getGovTypeClass(govType) {
  if (govType === 'Autocracy') return 'gov-autocracy';
  if (govType === 'Presidential') return 'gov-presidential';
  return 'gov-democracy';
}

function getGovTypeLabel(govType) {
  if (govType === 'Autocracy') return 'AUTOCRACY';
  if (govType === 'Presidential') return 'PRESIDENTIAL';
  return 'PARLIAMENTARY';
}

function getIdeologyLabel(ideo) {
  if (!ideo) return '';
  const axes = [
    { key: 'liberty_equality', neg: 'Liberty', pos: 'Equality' },
    { key: 'tradition_progress', neg: 'Tradition', pos: 'Progress' },
    { key: 'security_freedom', neg: 'Security', pos: 'Freedom' },
    { key: 'globalism_nationalism', neg: 'Globalism', pos: 'Nationalism' },
    { key: 'individualism_collectivism', neg: 'Individualism', pos: 'Collectivism' }
  ];
  const labels = [];
  for (const ax of axes) {
    const val = ideo[ax.key] || 0;
    if (Math.abs(val) >= 20) {
      labels.push(val < 0 ? ax.neg : ax.pos);
    }
  }
  return labels.slice(0, 2).join(', ');
}

function colorizeIdeology(text) {
  if (!text) return '';
  return text.split(', ').map(w => {
    const color = IDEOLOGY_COLORS[w];
    return color ? `<span style="color:${color}">${escapeHtml(w)}</span>` : escapeHtml(w);
  }).join('<span style="color:var(--text-dim)">, </span>');
}

function renderNations(nations, partiesByNation, crisesByNation, ideoByFaction) {
  const grid = document.getElementById('nations-grid');

  grid.innerHTML = nations.map(nation => {
    const nParties = partiesByNation[nation.id] || [];
    const nCrises = crisesByNation[nation.id] || [];
    const totalSeats = nation.total_seats || 100;
    const maxParties = nation.max_parties || 8;
    const eligiblePartyCount = countEligibleParties(nParties, nation.id);
    const isFull = eligiblePartyCount >= maxParties;
    const flagUrl = nation.flag_url || '';
    const govClass = getGovTypeClass(nation.government_type);
    const govLabel = getGovTypeLabel(nation.government_type);

    const sortedParties = [...nParties].sort((a, b) => (b.seats || 0) - (a.seats || 0));
    const usedSeats = nParties.reduce((sum, p) => sum + (p.seats || 0), 0);

    const seatSegments = sortedParties.filter(p => p.seats > 0).map((p, i) => {
      const pct = ((p.seats / totalSeats) * 100).toFixed(1);
      const color = p.party_color || FALLBACK_COLORS[i % FALLBACK_COLORS.length];
      return `<div class="seat-bar__segment" style="width:${pct}%;background:${color};" title="${escapeHtml(p.faction_name)}: ${p.seats} seats"></div>`;
    }).join('');

    const seatLegend = sortedParties.filter(p => p.seats > 0).map((p, i) => {
      const color = p.party_color || FALLBACK_COLORS[i % FALLBACK_COLORS.length];
      return `<span class="seat-legend-item"><span class="seat-legend-dot" style="background:${color};"></span>${escapeHtml(p.abbreviation || '?')} ${p.seats}</span>`;
    }).join('');

    const partyRows = sortedParties.map((p, i) => {
      const color = p.party_color || FALLBACK_COLORS[i % FALLBACK_COLORS.length];
      const ideo = ideoByFaction[p.id];
      const ideoLabel = p.ideology_value_1 && p.ideology_value_2
        ? `${p.ideology_value_1}, ${p.ideology_value_2}`
        : getIdeologyLabel(ideo);
      return `
        <div class="party-row">
          <span class="party-row__dot" style="background:${color};"></span>
          <span class="party-row__name">${escapeHtml(p.faction_name)}</span>
          <span class="party-row__abbr">${escapeHtml(p.abbreviation || '?')}</span>
          ${ideoLabel ? `<span class="party-row__ideo">${colorizeIdeology(ideoLabel)}</span>` : ''}
          <span class="party-row__seats">${p.seats || 0}</span>
        </div>
      `;
    }).join('');

    const crisisRows = nCrises.length > 0
      ? nCrises.map(c => `
        <div class="crisis-row">
          <span class="crisis-pip"></span>
          <span class="crisis-name">${escapeHtml(c.crisis_templates?.name || 'Unknown Crisis')}</span>
        </div>
      `).join('')
      : '<div class="no-crisis">No active crises</div>';

    return `
      <div class="nation-card ${isFull ? 'disabled' : ''}" data-nation-id="${nation.id}" onclick="${isFull ? '' : 'selectNation(\'' + nation.id + '\')'}">
        <div class="nation-card__header">
          ${flagUrl ? `<img class="nation-card__flag" src="${flagUrl}" alt="${escapeHtml(nation.name)}">` : ''}
          <span class="nation-card__name">${escapeHtml(nation.name)}</span>
          <span class="nation-card__gov-type ${govClass}">${govLabel}</span>
        </div>
        <div class="nation-card__body">
          <div class="stat-row">
            <span class="stat-row__label">Total Seats</span>
            <span class="stat-row__value" style="color:var(--text-secondary);">${totalSeats}</span>
          </div>
          <div class="stat-row">
            <span class="stat-row__label">Factions</span>
            <span class="stat-row__value" style="color:${isFull ? 'var(--red)' : 'var(--text-secondary)'};">${eligiblePartyCount}${maxParties ? ' / ' + maxParties : ''}</span>
          </div>
          <div class="stat-row">
            <span class="stat-row__label">Stability</span>
            <span class="stat-row__value" style="color:${(nation.stability || 50) >= 60 ? 'var(--green)' : (nation.stability || 50) >= 40 ? 'var(--amber)' : 'var(--red)'};">${nation.stability || 50}</span>
          </div>

          ${nParties.some(p => p.seats > 0) ? `
          <div class="seat-bar">
            <div class="seat-bar__label">Seat Distribution</div>
            <div class="seat-bar__track">
              ${seatSegments}
              ${usedSeats < totalSeats ? '<div class="seat-bar__empty"></div>' : ''}
            </div>
            <div class="seat-bar__legend">${seatLegend}</div>
          </div>
          ` : ''}

          ${nParties.length > 0 ? `
          <div class="party-list">
            <div class="party-list__header">Factions &mdash; ${eligiblePartyCount}</div>
            ${partyRows}
          </div>
          ` : '<div style="font-family:var(--font-mono);font-size:9px;color:var(--text-ghost);padding:6px 0;">No factions yet — be the first</div>'}

          <div class="crisis-section">
            <div class="party-list__header">Active Crises</div>
            ${crisisRows}
          </div>
        </div>
        <div class="nation-card__footer">
          <span class="join-label">${isFull ? 'NATION FULL' : 'JOIN THIS NATION'}</span>
          ${!isFull ? '<span class="join-arrow">&#x25B6;</span>' : ''}
        </div>
      </div>
    `;
  }).join('');
}

function selectNation(nationId) {
  selectedNationId = nationId;
  const nation = allNations.find(n => n.id === nationId);
  if (!nation) return;

  document.getElementById('modal-nation-name').textContent = nation.name;

  const govBadge = document.getElementById('modal-gov-badge');
  const govClass = getGovTypeClass(nation.government_type);
  const govLabel = getGovTypeLabel(nation.government_type);
  govBadge.className = 'modal__gov-badge ' + govClass;
  govBadge.textContent = govLabel;

  const hint = document.getElementById('modal-flow-hint');
  if (nation.government_type === 'Autocracy') {
    hint.textContent = 'You will choose your ideology and faction name next.';
  } else {
    hint.textContent = 'You will choose your ideology, then name and customize your party.';
  }

  document.getElementById('modal-overlay').classList.add('active');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('active');
  selectedNationId = null;
}

function confirmNation() {
  if (!selectedNationId) return;
  const nation = allNations.find(n => n.id === selectedNationId);
  if (!nation) return;

  // Store selected nation in sessionStorage for the next pages
  sessionStorage.setItem('nationhood_pending_nation', JSON.stringify({
    id: nation.id,
    name: nation.name,
    government_type: nation.government_type
  }));

  // Route based on government type
  if (nation.government_type === 'Autocracy') {
    window.location.href = 'autocracy-setup.html';
  } else {
    window.location.href = 'faction-select.html';
  }
}

init();

window.selectNation = selectNation;
window.closeModal = closeModal;
window.confirmNation = confirmNation;
</script>
</body>
</html>
