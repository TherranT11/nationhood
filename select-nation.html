<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Nation | Nationhood Alpha</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg-0: #0e0e0c;
  --bg-1: #141412;
  --bg-2: #1a1a17;
  --bg-3: #1e1e1a;
  --bg-4: #24241f;
  --bg-5: #2c2c26;
  --bg-hover: #282822;
  --text-bright: #e2e0d6;
  --text-primary: #c4c2b8;
  --text-secondary: #8a8778;
  --text-muted: #6b6a5e;
  --text-dim: #4a4940;
  --text-ghost: #333229;
  --border-hair: rgba(255,255,255,0.04);
  --border-0: rgba(255,255,255,0.06);
  --border-1: rgba(255,255,255,0.08);
  --border-2: rgba(255,255,255,0.12);
  --green: #5cb85c;
  --green-faint: rgba(92,184,92,0.08);
  --green-border: rgba(92,184,92,0.18);
  --red: #d9534f;
  --red-faint: rgba(217,83,79,0.08);
  --red-border: rgba(217,83,79,0.18);
  --amber: #c8a64e;
  --amber-faint: rgba(200,166,78,0.08);
  --amber-border: rgba(200,166,78,0.18);
  --blue: #5b9bd5;
  --blue-faint: rgba(91,155,213,0.08);
  --blue-border: rgba(91,155,213,0.18);
  --purple: #8b7ec8;
  --purple-faint: rgba(139,126,200,0.08);
  --purple-border: rgba(139,126,200,0.18);
  --teal: #5aafa5;
  --teal-faint: rgba(90,175,165,0.08);
  --teal-border: rgba(90,175,165,0.18);
  --orange: #d48a3c;
  --orange-faint: rgba(212,138,60,0.08);
  --orange-border: rgba(212,138,60,0.18);
  --font-mono: 'JetBrains Mono', monospace;
  --font-ui: 'IBM Plex Sans', -apple-system, sans-serif;
  --font-serif: 'IBM Plex Serif', Georgia, serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg-0);
  color: var(--text-primary);
  font-family: var(--font-ui);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.page-header {
  text-align: center;
  padding: 48px 20px 16px;
  max-width: 900px;
}
.page-header h1 {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.page-header .title {
  font-family: var(--font-ui);
  font-size: 18px;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 6px;
}
.page-header .subtitle {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  line-height: 1.5;
}

/* Party identity bar */
.party-bar {
  width: 100%;
  max-width: 900px;
  padding: 0 16px;
  margin-bottom: 16px;
}
.party-bar__inner {
  background: var(--bg-2);
  border: 1px solid var(--border-0);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.party-bar__label {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.party-bar__name {
  font-family: var(--font-ui);
  font-size: 12px;
  font-weight: 700;
  color: var(--text-bright);
}
.party-bar__abbr {
  font-family: var(--font-mono);
  font-size: 8.5px;
  font-weight: 700;
  padding: 1px 6px;
  background: var(--blue-faint);
  color: var(--blue);
  border: 1px solid var(--blue-border);
}
.party-bar__ideo {
  font-family: var(--font-mono);
  font-size: 8.5px;
  font-weight: 700;
  padding: 1px 6px;
  background: var(--purple-faint);
  color: var(--purple);
  border: 1px solid var(--purple-border);
}
.party-bar__sep {
  width: 1px;
  height: 14px;
  background: var(--border-0);
}

/* Nation cards grid */
.nations-grid {
  width: 100%;
  max-width: 900px;
  padding: 0 16px 48px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 12px;
}

.nation-card {
  background: var(--bg-2);
  border: 1px solid var(--border-0);
  cursor: pointer;
  transition: border-color 0.15s;
}
.nation-card:hover {
  border-color: var(--border-2);
}
.nation-card.disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* Card header */
.nation-card__header {
  background: var(--bg-3);
  border-bottom: 1px solid var(--border-hair);
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.nation-card__flag {
  width: 36px;
  height: 24px;
  object-fit: cover;
  border: 1px solid var(--border-0);
}
.nation-card__name {
  font-family: var(--font-ui);
  font-size: 14px;
  font-weight: 700;
  color: var(--text-bright);
  flex: 1;
}
.nation-card__gov-type {
  font-family: var(--font-mono);
  font-size: 8.5px;
  font-weight: 700;
  padding: 2px 6px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.gov-democracy {
  background: var(--green-faint);
  color: var(--green);
  border: 1px solid var(--green-border);
}
.gov-autocracy {
  background: var(--red-faint);
  color: var(--red);
  border: 1px solid var(--red-border);
}

/* Card body */
.nation-card__body {
  padding: 10px 12px;
}

/* Stat row */
.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 3px 0;
  font-family: var(--font-mono);
  font-size: 10.5px;
}
.stat-row__label {
  color: var(--text-muted);
}
.stat-row__value {
  font-weight: 600;
}

/* Seat bar */
.seat-bar {
  margin: 8px 0;
}
.seat-bar__label {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.seat-bar__track {
  display: flex;
  height: 6px;
  gap: 2px;
  overflow: hidden;
}
.seat-bar__segment {
  height: 100%;
}
.seat-bar__empty {
  flex: 1;
  height: 100%;
  background: var(--bg-5);
}
.seat-bar__legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 4px;
}
.seat-legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-secondary);
}
.seat-legend-dot {
  width: 6px;
  height: 6px;
}

/* Party list inside card */
.party-list {
  margin-top: 8px;
}
.party-list__header {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 4px;
  padding-bottom: 3px;
  border-bottom: 1px solid var(--border-hair);
}
.party-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 0;
  border-bottom: 1px solid var(--border-hair);
}
.party-row:last-child {
  border-bottom: none;
}
.party-row__dot {
  width: 6px;
  height: 6px;
  flex-shrink: 0;
}
.party-row__name {
  font-family: var(--font-ui);
  font-size: 10.5px;
  font-weight: 600;
  color: var(--text-primary);
  flex: 1;
}
.party-row__abbr {
  font-family: var(--font-mono);
  font-size: 8px;
  font-weight: 700;
  padding: 1px 4px;
  color: var(--text-muted);
  background: var(--bg-4);
  border: 1px solid var(--border-0);
}
.party-row__ideo {
  font-family: var(--font-mono);
  font-size: 8px;
  color: var(--text-dim);
}
.party-row__seats {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  color: var(--text-secondary);
  min-width: 30px;
  text-align: right;
}

/* Crisis section */
.crisis-section {
  margin-top: 8px;
}
.crisis-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 0;
}
.crisis-pip {
  width: 3px;
  height: 14px;
  background: var(--red);
  flex-shrink: 0;
}
.crisis-name {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  color: var(--red);
}
.no-crisis {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text-ghost);
  padding: 2px 0;
}

/* Card footer */
.nation-card__footer {
  background: var(--bg-3);
  border-top: 1px solid var(--border-hair);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.join-label {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.join-arrow {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
}
.nation-card:hover .join-label {
  color: var(--green);
}
.nation-card:hover .join-arrow {
  color: var(--green);
}
.nation-card.disabled:hover .join-label,
.nation-card.disabled:hover .join-arrow {
  color: var(--text-dim);
}

/* Back button */
.back-bar {
  width: 100%;
  max-width: 900px;
  padding: 0 16px 32px;
}
.btn-back {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  padding: 7px 14px;
  background: var(--bg-3);
  border: 1px solid var(--border-0);
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.btn-back:hover {
  background: var(--bg-4);
  color: var(--text-secondary);
  border-color: var(--border-1);
}

/* Confirm modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
.modal-overlay.active {
  display: flex;
}
.modal {
  background: var(--bg-2);
  border: 1px solid var(--border-1);
  max-width: 400px;
  width: 90%;
}
.modal__header {
  background: var(--bg-3);
  border-bottom: 1px solid var(--border-hair);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.modal__dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--amber);
}
.modal__title {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.modal__body {
  padding: 14px;
}
.modal__text {
  font-family: var(--font-ui);
  font-size: 12px;
  color: var(--text-primary);
  margin-bottom: 6px;
}
.modal__nation-name {
  font-family: var(--font-ui);
  font-size: 16px;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 12px;
}
.modal__actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}
.modal__btn {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  padding: 7px 14px;
  border: 1px solid var(--border-0);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.modal__btn--cancel {
  background: var(--bg-3);
  color: var(--text-muted);
}
.modal__btn--cancel:hover {
  background: var(--bg-4);
  color: var(--text-secondary);
}
.modal__btn--confirm {
  background: var(--green-faint);
  color: var(--green);
  border-color: var(--green-border);
}
.modal__btn--confirm:hover {
  background: rgba(92,184,92,0.14);
}
.modal__btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.loading-msg {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  text-align: center;
  padding: 80px 20px;
}

.error-msg {
  width: 100%;
  max-width: 900px;
  padding: 0 16px;
  margin-bottom: 12px;
}
.error-msg__inner {
  background: var(--red-faint);
  border: 1px solid var(--red-border);
  border-left: 3px solid var(--red);
  color: var(--red);
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 8px 12px;
  display: none;
}

@media (max-width: 480px) {
  .nations-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<div id="loading" class="loading-msg">LOADING NATIONS...</div>

<div id="page-content" style="display:none; width:100%; flex-direction:column; align-items:center;">
  <div class="page-header">
    <h1>Step 3 of 3</h1>
    <div class="title">Choose Your Nation</div>
    <div class="subtitle">Select a nation to enter. Each nation has its own government, parties, and crises. Your party will start with zero seats and must earn voter support through elections.</div>
  </div>

  <div class="party-bar">
    <div class="party-bar__inner" id="party-bar"></div>
  </div>

  <div class="error-msg"><div class="error-msg__inner" id="error-message"></div></div>

  <div class="nations-grid" id="nations-grid"></div>

  <div class="back-bar">
    <button class="btn-back" onclick="goBack()">&#x25C0; BACK TO PARTY</button>
  </div>
</div>

<!-- Confirm Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal__header">
      <div class="modal__dot"></div>
      <span class="modal__title">Confirm Nation</span>
    </div>
    <div class="modal__body">
      <div class="modal__text">You are about to create your party in:</div>
      <div class="modal__nation-name" id="modal-nation-name"></div>
      <div class="modal__text" id="modal-party-summary" style="font-size:10px; color:var(--text-muted); font-family:var(--font-mono);"></div>
      <div class="modal__actions">
        <button class="modal__btn modal__btn--cancel" onclick="closeModal()">CANCEL</button>
        <button class="modal__btn modal__btn--confirm" id="modal-confirm-btn" onclick="confirmJoin()">CREATE PARTY</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { escapeHtml } from './js/utils.js';
import { getPartyIconSVG } from './js/party-icons.js';

// Leader name pools
const FIRST_NAMES = [
  'Alejandro','Camila','Diego','Valentina','Mateo','Isabela','Sebastian','Luca',
  'Andres','Gabriel','Joaquin','Mariana','Carlos','Tomas','Rafael','Edwin',
  'Emilio','Catalina','Fernando','Renata'
];
const LAST_NAMES = [
  'Velasco','Mendoza','Guerrero','Salazar','Castillo','Herrera','Morales','Rios',
  'Delgado','Espinoza','Guzman','Navarro','Cordoba','Echeverria','Pacheco','Montero',
  'Aguilar','Valenzuela','Carrasco','Ibarra'
];

// Ideology axis mapping
const IDEOLOGY_AXIS_MAP = {
  'Liberty':       { axis: 'liberty_equality',           dir: -1 },
  'Equality':      { axis: 'liberty_equality',           dir:  1 },
  'Tradition':     { axis: 'tradition_progress',         dir: -1 },
  'Progress':      { axis: 'tradition_progress',         dir:  1 },
  'Security':      { axis: 'security_freedom',           dir: -1 },
  'Freedom':       { axis: 'security_freedom',           dir:  1 },
  'Globalism':     { axis: 'globalism_nationalism',      dir: -1 },
  'Nationalism':   { axis: 'globalism_nationalism',      dir:  1 },
  'Individualism': { axis: 'individualism_collectivism', dir: -1 },
  'Collectivism':  { axis: 'individualism_collectivism', dir:  1 }
};

// Default party colors for seat bar (when party has no custom color)
const FALLBACK_COLORS = ['#5b9bd5','#d48a3c','#5aafa5','#8b7ec8','#5cb85c','#d9534f','#c8a64e'];

let currentUser = null;
let partyData = null;
let allNations = [];
let selectedNationId = null;

async function init() {
  const { data: { user } } = await _supabase.auth.getUser();
  if (!user) { window.location.href = 'login.html'; return; }
  currentUser = user;

  // Check if user already has a party
  const { data: faction } = await _supabase
    .from('factions').select('id, nation_id').eq('id', user.id).eq('faction_type', 'party').maybeSingle();
  if (faction && faction.nation_id) {
    window.location.href = 'dashboard.html';
    return;
  }

  // Load pending party data from sessionStorage
  const raw = sessionStorage.getItem('nationhood_pending_party');
  if (!raw) {
    window.location.href = 'faction-select.html';
    return;
  }
  partyData = JSON.parse(raw);
  if (!partyData.name || !partyData.abbreviation || !partyData.ideology1 || !partyData.ideology2) {
    window.location.href = 'faction-select.html';
    return;
  }

  renderPartyBar();
  await loadNations();

  document.getElementById('loading').style.display = 'none';
  const content = document.getElementById('page-content');
  content.style.display = 'flex';
}

function renderPartyBar() {
  const bar = document.getElementById('party-bar');
  const colorStyle = partyData.color ? `background:${partyData.color}22;color:${partyData.color};border:1px solid ${partyData.color}44;` : '';
  bar.innerHTML = `
    <span class="party-bar__label">Your Party</span>
    <span class="party-bar__sep"></span>
    <span class="party-bar__name">${escapeHtml(partyData.name)}</span>
    <span class="party-bar__abbr" style="${colorStyle || ''}">${escapeHtml(partyData.abbreviation)}</span>
    <span class="party-bar__ideo">${escapeHtml(partyData.ideology1)}</span>
    <span class="party-bar__ideo">${escapeHtml(partyData.ideology2)}</span>
  `;
}

async function loadNations() {
  // Fetch nations, parties, and crises in parallel
  const [nationsRes, partiesRes, crisesRes, ideologiesRes] = await Promise.all([
    _supabase.from('nations').select('*'),
    _supabase.from('factions').select('id, faction_name, abbreviation, seats, nation_id, party_color, ideology_value_1, ideology_value_2, is_npc').eq('faction_type', 'party'),
    _supabase.from('active_crises').select('nation_id, crisis_id, crisis_templates(name)'),
    _supabase.from('faction_ideology').select('faction_id, liberty_equality, tradition_progress, security_freedom, globalism_nationalism, individualism_collectivism')
  ]);

  const nations = nationsRes.data || [];
  const parties = partiesRes.data || [];
  const crises = crisesRes.data || [];
  const ideologies = ideologiesRes.data || [];

  // Build lookup maps
  const partiesByNation = {};
  const crisesByNation = {};
  const ideoByFaction = {};

  for (const p of parties) {
    if (!partiesByNation[p.nation_id]) partiesByNation[p.nation_id] = [];
    partiesByNation[p.nation_id].push(p);
  }
  for (const c of crises) {
    if (!crisesByNation[c.nation_id]) crisesByNation[c.nation_id] = [];
    crisesByNation[c.nation_id].push(c);
  }
  for (const i of ideologies) {
    ideoByFaction[i.faction_id] = i;
  }

  allNations = nations;
  renderNations(nations, partiesByNation, crisesByNation, ideoByFaction);
}

function getIdeologyLabel(ideo) {
  if (!ideo) return '';
  const axes = [
    { key: 'liberty_equality', neg: 'Liberty', pos: 'Equality' },
    { key: 'tradition_progress', neg: 'Tradition', pos: 'Progress' },
    { key: 'security_freedom', neg: 'Security', pos: 'Freedom' },
    { key: 'globalism_nationalism', neg: 'Globalism', pos: 'Nationalism' },
    { key: 'individualism_collectivism', neg: 'Individualism', pos: 'Collectivism' }
  ];
  const labels = [];
  for (const ax of axes) {
    const val = ideo[ax.key] || 0;
    if (Math.abs(val) >= 20) {
      labels.push(val < 0 ? ax.neg : ax.pos);
    }
  }
  return labels.slice(0, 2).join(', ');
}

function renderNations(nations, partiesByNation, crisesByNation, ideoByFaction) {
  const grid = document.getElementById('nations-grid');

  grid.innerHTML = nations.map(nation => {
    const nParties = partiesByNation[nation.id] || [];
    const nCrises = crisesByNation[nation.id] || [];
    const totalSeats = nation.total_seats || 100;
    const isAuto = nation.government_type === 'Autocracy';
    const maxParties = nation.max_parties || 8;
    const isFull = nParties.filter(p => !p.is_npc).length >= maxParties;

    // Flag URL
    const flagUrl = nation.flag_url || '';

    // Seat bar segments
    const sortedParties = [...nParties].sort((a, b) => (b.seats || 0) - (a.seats || 0));
    const usedSeats = nParties.reduce((sum, p) => sum + (p.seats || 0), 0);

    const seatSegments = sortedParties.filter(p => p.seats > 0).map((p, i) => {
      const pct = ((p.seats / totalSeats) * 100).toFixed(1);
      const color = p.party_color || FALLBACK_COLORS[i % FALLBACK_COLORS.length];
      return `<div class="seat-bar__segment" style="width:${pct}%;background:${color};" title="${escapeHtml(p.faction_name)}: ${p.seats} seats"></div>`;
    }).join('');

    const seatLegend = sortedParties.filter(p => p.seats > 0).map((p, i) => {
      const color = p.party_color || FALLBACK_COLORS[i % FALLBACK_COLORS.length];
      return `<span class="seat-legend-item"><span class="seat-legend-dot" style="background:${color};"></span>${escapeHtml(p.abbreviation || '?')} ${p.seats}</span>`;
    }).join('');

    // Party rows
    const partyRows = sortedParties.map((p, i) => {
      const color = p.party_color || FALLBACK_COLORS[i % FALLBACK_COLORS.length];
      const ideo = ideoByFaction[p.id];
      const ideoLabel = p.ideology_value_1 && p.ideology_value_2
        ? `${p.ideology_value_1}, ${p.ideology_value_2}`
        : getIdeologyLabel(ideo);
      return `
        <div class="party-row">
          <span class="party-row__dot" style="background:${color};"></span>
          <span class="party-row__name">${escapeHtml(p.faction_name)}</span>
          <span class="party-row__abbr">${escapeHtml(p.abbreviation || '?')}</span>
          ${ideoLabel ? `<span class="party-row__ideo">${escapeHtml(ideoLabel)}</span>` : ''}
          <span class="party-row__seats">${p.seats || 0}</span>
        </div>
      `;
    }).join('');

    // Crisis rows
    const crisisRows = nCrises.length > 0
      ? nCrises.map(c => `
        <div class="crisis-row">
          <span class="crisis-pip"></span>
          <span class="crisis-name">${escapeHtml(c.crisis_templates?.name || 'Unknown Crisis')}</span>
        </div>
      `).join('')
      : '<div class="no-crisis">No active crises</div>';

    return `
      <div class="nation-card ${isFull ? 'disabled' : ''}" data-nation-id="${nation.id}" onclick="${isFull ? '' : 'selectNation(\'' + nation.id + '\')'}">
        <div class="nation-card__header">
          ${flagUrl ? `<img class="nation-card__flag" src="${flagUrl}" alt="${escapeHtml(nation.name)}">` : ''}
          <span class="nation-card__name">${escapeHtml(nation.name)}</span>
          <span class="nation-card__gov-type ${isAuto ? 'gov-autocracy' : 'gov-democracy'}">${isAuto ? 'AUTOCRACY' : nation.government_type || 'DEMOCRACY'}</span>
        </div>
        <div class="nation-card__body">
          <div class="stat-row">
            <span class="stat-row__label">Total Seats</span>
            <span class="stat-row__value" style="color:var(--text-secondary);">${totalSeats}</span>
          </div>
          <div class="stat-row">
            <span class="stat-row__label">Parties</span>
            <span class="stat-row__value" style="color:${isFull ? 'var(--red)' : 'var(--text-secondary)'};">${nParties.filter(p => !p.is_npc).length}${maxParties ? ' / ' + maxParties : ''}</span>
          </div>
          <div class="stat-row">
            <span class="stat-row__label">Stability</span>
            <span class="stat-row__value" style="color:${(nation.stability || 50) >= 60 ? 'var(--green)' : (nation.stability || 50) >= 40 ? 'var(--amber)' : 'var(--red)'};">${nation.stability || 50}</span>
          </div>

          ${nParties.some(p => p.seats > 0) ? `
          <div class="seat-bar">
            <div class="seat-bar__label">Seat Distribution</div>
            <div class="seat-bar__track">
              ${seatSegments}
              ${usedSeats < totalSeats ? '<div class="seat-bar__empty"></div>' : ''}
            </div>
            <div class="seat-bar__legend">${seatLegend}</div>
          </div>
          ` : ''}

          ${nParties.length > 0 ? `
          <div class="party-list">
            <div class="party-list__header">Parties &mdash; ${nParties.length}</div>
            ${partyRows}
          </div>
          ` : '<div style="font-family:var(--font-mono);font-size:9px;color:var(--text-ghost);padding:6px 0;">No parties yet — be the first</div>'}

          <div class="crisis-section">
            <div class="party-list__header">Active Crises</div>
            ${crisisRows}
          </div>
        </div>
        <div class="nation-card__footer">
          <span class="join-label">${isFull ? 'NATION FULL' : 'JOIN THIS NATION'}</span>
          ${!isFull ? '<span class="join-arrow">&#x25B6;</span>' : ''}
        </div>
      </div>
    `;
  }).join('');
}

function selectNation(nationId) {
  selectedNationId = nationId;
  const nation = allNations.find(n => n.id === nationId);
  if (!nation) return;

  document.getElementById('modal-nation-name').textContent = nation.name;
  document.getElementById('modal-party-summary').textContent =
    `${partyData.name} [${partyData.abbreviation}] — ${partyData.ideology1} + ${partyData.ideology2}`;
  document.getElementById('modal-overlay').classList.add('active');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('active');
  selectedNationId = null;
}

async function confirmJoin() {
  if (!selectedNationId || !partyData) return;

  const btn = document.getElementById('modal-confirm-btn');
  btn.disabled = true;
  btn.textContent = 'CREATING...';

  // Clear cached state
  sessionStorage.removeItem('nationhood_state');

  try {
    const nation = allNations.find(n => n.id === selectedNationId);
    if (!nation) throw new Error('Nation not found');

    // Get current tick
    const { data: shardData } = await _supabase
      .from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const currentTick = shardData?.current_tick || 0;

    // Generate leader
    const leader = {
      first: FIRST_NAMES[Math.floor(Math.random() * FIRST_NAMES.length)],
      last: LAST_NAMES[Math.floor(Math.random() * LAST_NAMES.length)],
      age: 35 + Math.floor(Math.random() * 20)
    };

    // Create faction record
    const { error: upsertError } = await _supabase
      .from('factions')
      .upsert({
        id: currentUser.id,
        faction_type: 'party',
        faction_name: partyData.name,
        nation_id: nation.id,
        nation: nation.name,
        abbreviation: partyData.abbreviation,
        ideology_value_1: partyData.ideology1,
        ideology_value_2: partyData.ideology2,
        seats: 0,
        needs_rebuild: false,
        party_color: partyData.color || null,
        party_logo: partyData.logo || 'star',
        party_description: partyData.description || null,
        leader_first_name: leader.first,
        leader_last_name: leader.last,
        leader_age: leader.age,
        founded_tick: currentTick,
        action_points: 5,
        approval_rating: null
      });

    if (upsertError) throw upsertError;

    // Initialize ideology spectrum
    const m1 = IDEOLOGY_AXIS_MAP[partyData.ideology1];
    const m2 = IDEOLOGY_AXIS_MAP[partyData.ideology2];

    if (m1 && m2) {
      // Try RPC first
      const { error: rpcError } = await _supabase.rpc('initialize_faction_ideology', {
        p_faction_id: currentUser.id,
        p_ideology_1: partyData.ideology1,
        p_ideology_2: partyData.ideology2
      });

      if (rpcError) {
        // Fallback: direct insert
        const row = {
          faction_id: currentUser.id,
          liberty_equality: 0,
          tradition_progress: 0,
          security_freedom: 0,
          globalism_nationalism: 0,
          individualism_collectivism: 0,
          declared_axis_1: m1.axis,
          declared_direction_1: m1.dir,
          declared_axis_2: m2.axis,
          declared_direction_2: m2.dir
        };
        row[m1.axis] = 30 * m1.dir;
        row[m2.axis] = 30 * m2.dir;

        await _supabase.from('faction_ideology').upsert(row, { onConflict: 'faction_id' });
      }
    }

    // Seed bloc approvals
    try {
      const { data: blocs } = await _supabase
        .from('voter_blocs')
        .select('id, axis_liberty_equality, axis_tradition_progress, axis_security_freedom, axis_globalism_nationalism, axis_individualism_collectivism')
        .eq('nation_id', nation.id)
        .eq('is_active', true);

      if (blocs && blocs.length > 0) {
        const { data: ideo } = await _supabase.from('faction_ideology')
          .select('liberty_equality, tradition_progress, security_freedom, globalism_nationalism, individualism_collectivism')
          .eq('faction_id', currentUser.id)
          .maybeSingle();

        const rows = blocs.map(bloc => {
          let mult = 1.0;
          if (ideo) {
            const axes = ['liberty_equality','tradition_progress','security_freedom','globalism_nationalism','individualism_collectivism'];
            let opposed = 0, aligned = 0;
            for (const ax of axes) {
              const ps = ideo[ax] || 0;
              const bs = bloc['axis_' + ax] ?? 50;
              if (Math.abs(ps) < 20 || Math.abs(bs - 50) < 10) continue;
              if ((ps < 0 ? 'L' : 'R') === (bs < 50 ? 'L' : 'R')) aligned++; else opposed++;
            }
            if (opposed >= 2) mult = 0.70;
            else if (opposed === 1) mult = 0.80;
            else if (aligned === 0) mult = 0.90;
          }
          return {
            faction_id: currentUser.id,
            bloc_id: bloc.id,
            preference_score: Math.round(40 * mult * 100) / 100
          };
        });

        await _supabase.from('faction_bloc_approval')
          .upsert(rows, { onConflict: 'faction_id,bloc_id', ignoreDuplicates: true });
      }
    } catch (e) { console.warn('Bloc approval seeding non-blocking:', e); }

    // Clean up and redirect
    sessionStorage.removeItem('nationhood_pending_party');
    sessionStorage.removeItem('nationhood_state');
    window.location.href = 'dashboard.html';

  } catch (error) {
    console.error('Error creating party:', error);
    const errEl = document.getElementById('error-message');
    errEl.textContent = 'Error: ' + error.message;
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'CREATE PARTY';
    closeModal();
  }
}

function goBack() {
  // Go back to createparty with ideology params preserved
  const params = new URLSearchParams();
  if (partyData) {
    params.set('ideology1', partyData.ideology1);
    params.set('ideology2', partyData.ideology2);
  }
  window.location.href = 'createparty.html?' + params.toString();
}

init();

window.selectNation = selectNation;
window.closeModal = closeModal;
window.confirmJoin = confirmJoin;
window.goBack = goBack;
</script>
