<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nationhood — Choose your path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@400&family=Spectral:wght@300;400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#0F1417; --ink2:#151C20; --ink3:#1B2429; --line:#33413F;
    --vellum:#E6E0D0; --vellum-dim:#9AA39B;
    --brass:#C8A15A; --brass-dim:#8A6E3C; --seal:#9B3B33; --plague:#8DA85C;
    --display:'Grenze Gotisch','Iowan Old Style',Georgia,serif;
    --body:'Spectral','Iowan Old Style',Georgia,serif;
    --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--vellum); font-family:var(--body); padding:56px 24px 140px; }
  :focus-visible { outline:1px solid var(--brass); outline-offset:3px; }
  .mono { font-family:var(--mono); }

  .wrap { max-width:720px; margin:0 auto; }
  .head { text-align:center; margin-bottom:12px; }
  .step { font-family:var(--mono); font-size:11px; letter-spacing:0.24em; text-transform:uppercase; color:var(--vellum-dim); margin-bottom:18px; }
  .title { font-family:var(--display); font-size:56px; font-weight:400; line-height:0.95; margin:0; }
  .lede { font-size:15px; line-height:1.75; color:var(--vellum-dim); font-weight:300; max-width:460px; margin:18px auto 0; }

  .paths { margin-top:44px; display:flex; flex-direction:column; gap:14px; }

  .card { text-align:left; width:100%; background:transparent; border:1px solid var(--line);
    padding:22px; color:var(--vellum); font-family:inherit;
    transition:border-color 160ms ease, background 160ms ease; }
  .card.open { cursor:pointer; }
  .card.open:hover { border-color:var(--brass-dim); background:var(--ink2); }
  .card.locked { cursor:not-allowed; opacity:0.42; }
  .card.picked { background:var(--ink3); border-color:var(--align); }

  .card-inner { display:flex; gap:20px; align-items:flex-start; }
  .sigil { width:58px; height:58px; flex-shrink:0; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-family:var(--display);
    font-size:30px; color:var(--vellum-dim); }
  .card.picked .sigil { border-color:var(--align); color:var(--align); }

  .card-body { flex:1; }
  .card-top { display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap; }
  .card-name { font-size:21px; color:var(--vellum); }
  .card-align { font-family:var(--mono); font-size:10px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--align); white-space:nowrap; }
  .card-blurb { font-size:14px; line-height:1.75; color:var(--vellum-dim); font-weight:300; margin:10px 0 0; }
  .card-trait { font-family:var(--mono); font-size:11px; line-height:1.7; color:var(--vellum-dim);
    margin-top:12px; padding-top:12px; border-top:1px solid var(--line); }
  .card-lock { display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11px;
    letter-spacing:0.14em; text-transform:uppercase; color:var(--vellum); margin-top:12px; }

  /* confirm bar */
  .bar { position:fixed; left:0; right:0; bottom:0; background:var(--ink2); border-top:1px solid var(--line); padding:16px 24px; }
  .bar-inner { max-width:720px; margin:0 auto; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .bar-path { flex:1; min-width:180px; }
  .bar-k { font-family:var(--mono); font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--vellum-dim); }
  .bar-v { font-size:16px; margin-top:4px; color:var(--vellum-dim); font-style:italic; }
  .btn { padding:13px 0; font-size:13px; letter-spacing:0.16em; text-transform:uppercase; font-family:inherit;
    cursor:pointer; transition:background 160ms ease, color 160ms ease, border-color 160ms ease, opacity 160ms ease; }
  .btn-quiet { width:110px; background:transparent; color:var(--vellum-dim); border:1px solid var(--line); }
  .btn-quiet:hover { color:var(--brass); border-color:var(--brass); }
  .btn-solid { width:200px; background:var(--brass); color:var(--ink); border:1px solid var(--brass); }
  .btn-solid:hover:not(:disabled) { background:var(--vellum); border-color:var(--vellum); }
  .btn:disabled { cursor:not-allowed; opacity:0.4; }

  @media (max-width:620px) {
    .title { font-size:40px; }
    .card-inner { flex-direction:column; gap:14px; }
    .sigil { width:46px; height:46px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="step">Step 1 of 2 · Founding</div>
      <h1 class="title">Choose your path</h1>
      <p class="lede">Your people decide who will trade with you, who will answer your call to arms, and what victory means for you. The choice holds until the age turns.</p>
    </div>

    <div class="paths" id="paths"></div>
  </div>

  <!-- confirm bar -->
  <div class="bar">
    <div class="bar-inner">
      <div class="bar-path">
        <div class="bar-k">Your path</div>
        <div class="bar-v" id="chosen">Not yet chosen</div>
      </div>
      <button class="btn btn-quiet" id="back">Back</button>
      <button class="btn btn-solid" id="take" disabled>Take this path</button>
    </div>
  </div>

  <script>
    const ALIGN = {
      good: { label: 'Locked to Forces of Good',               color: 'var(--brass)' },
      evil: { label: 'Locked to Forces of Evil',               color: 'var(--seal)' },
      end:  { label: 'Locked to Forces of the End Prophecy',   color: 'var(--plague)' },
    };

    const PATHS = [
      { key:'humans', name:'Human Kingdom', align:'good', sigil:'H',
        blurb:'Rich, populous, and rotting from the center. Your granaries are full and your walls are unrepaired. No people can outproduce you; none has further to fall.',
        trait:'Trade routes yield +15% coin · Levies cost 1 turn to muster', locked:null },
      { key:'elves', name:'Elves of the Highborn', align:'good', sigil:'E',
        blurb:'Few, old, and unwilling. The Highborn remember the First Age and have spent every year since deciding whether this one is worth defending.',
        trait:'Immune to the first plague wave · Population grows slowly', locked:'Unlocks after you complete one age' },
      { key:'dwarves', name:'Dwarves of Karrowmoor', align:'good', sigil:'D', noAlignLabel:true,
        blurb:'Holds cut into the mountain, gates that have never been forced, and a grudge ledger going back nine hundred years. Slow to march, impossible to move.',
        trait:'Fortifications cost half stone · Armies march one leg slower', locked:'Unlocks at Renown II' },
      { key:'orcs', name:'Orcs of the Ashen Compact', align:'evil', sigil:'O',
        blurb:'Beaten at the end of the First Age and left to breed in the ash wastes. The clans have finished arguing. They are coming down out of the hills.',
        trait:'Levies muster in a single tick · Holdings grow by conquest, not building', locked:null },
      { key:'undead', name:'The Quiet Court', align:'end', sigil:'U',
        blurb:'Not a people. An outcome. The Court does not raise armies so much as inherit them, and it grows fastest wherever the rot is worst.',
        trait:'Plague deaths become levies · Cannot trade, ever', locked:'Unlocks when the prophecy reaches the Third Seal' },
    ];

    const LOCK_SVG = '<svg width="12" height="14" viewBox="0 0 12 14" fill="none" aria-hidden="true" style="flex-shrink:0"><rect x="1" y="6" width="10" height="7" stroke="currentColor" stroke-width="1.2"/><path d="M3.5 6V4a2.5 2.5 0 015 0v2" stroke="currentColor" stroke-width="1.2"/></svg>';

    const box = document.getElementById('paths');
    PATHS.forEach((p) => {
      const align = ALIGN[p.align];
      const locked = Boolean(p.locked);
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'card ' + (locked ? 'locked' : 'open');
      card.dataset.key = p.key;
      card.disabled = locked;
      card.setAttribute('aria-pressed', 'false');
      card.style.setProperty('--align', align.color);
      card.innerHTML =
        '<div class="card-inner">' +
          '<div class="sigil">' + p.sigil + '</div>' +
          '<div class="card-body">' +
            '<div class="card-top">' +
              '<div class="card-name">' + p.name + '</div>' +
              (p.noAlignLabel ? '' : '<div class="card-align">' + align.label + '</div>') +
            '</div>' +
            '<p class="card-blurb">' + p.blurb + '</p>' +
            '<div class="card-trait">' + p.trait + '</div>' +
            (locked ? '<div class="card-lock">' + LOCK_SVG + p.locked + '</div>' : '') +
          '</div>' +
        '</div>';
      if (!locked) card.addEventListener('click', () => select(p.key));
      box.appendChild(card);
    });

    let picked = null;
    const chosenEl = document.getElementById('chosen');
    const takeBtn = document.getElementById('take');

    function select(key) {
      picked = (picked === key) ? null : key;
      document.querySelectorAll('.card').forEach((c) => {
        const on = c.dataset.key === picked;
        c.classList.toggle('picked', on);
        c.setAttribute('aria-pressed', String(on));
      });
      const chosen = picked ? PATHS.find((p) => p.key === picked) : null;
      if (chosen) {
        chosenEl.textContent = chosen.name;
        chosenEl.style.color = ALIGN[chosen.align].color;
        chosenEl.style.fontStyle = 'normal';
      } else {
        chosenEl.textContent = 'Not yet chosen';
        chosenEl.style.color = 'var(--vellum-dim)';
        chosenEl.style.fontStyle = 'italic';
      }
      takeBtn.disabled = !picked;
    }

    // "Take this path" leads to founding step 2 — wired once that step exists.
    takeBtn.addEventListener('click', () => {});
  </script>

  <script type="module">
    // Gate: only a signed-in ruler belongs on the founding screen.
    import { currentUser, signOut } from '../supabase.js';
    (async () => {
      const user = await currentUser();
      if (!user) window.location.href = '/login/';
    })();

    // Back = leave founding → sign out and return to the front door.
    const back = document.getElementById('back');
    back.addEventListener('click', async () => {
      if (back.disabled) return;
      back.disabled = true; back.textContent = 'Leaving…';
      try { await signOut(); } catch (err) { /* redirect regardless */ }
      window.location.href = '/';
    });
  </script>
</body>
</html>
