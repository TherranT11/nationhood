<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nation Select · Nationhood Game</title>
<link rel="stylesheet" href="/site.css">
<style>
  body {
    margin: 0; background: #fff; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .select { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 48px 24px 72px; }
  .select-head { text-align: center; margin-bottom: 26px; }
  .select-head h1 { font-size: clamp(26px, 4.5vw, 36px); letter-spacing: -0.03em; font-weight: 800; margin: 0 0 8px; }
  .select-head p { color: var(--muted); font-size: 15px; margin: 0; }
  .gamedate { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: #5546E8; background: #ECE9FD; border-radius: 999px; padding: 8px 13px; white-space: nowrap; }

  /* nation card */
  .nation { width: 100%; max-width: 460px; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: #fff; }
  .nation-banner {
    min-height: 120px; display: flex; align-items: center; justify-content: center; overflow: hidden;
    background: repeating-linear-gradient(45deg, #fafafa, #fafafa 12px, #f3f3f3 12px, #f3f3f3 24px);
    border-bottom: 1px solid var(--line);
  }
  .nation-banner img { display: block; width: 100%; height: auto; }
  .nation-banner .ph { color: #9a9a9a; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
  .nation-body { padding: 22px 22px 24px; }
  .nation-name { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
  .nation-desc { color: var(--muted); font-size: 14.5px; line-height: 1.5; margin: 6px 0 18px; }

  .nstats { border-top: 1px solid var(--line); margin-bottom: 20px; }
  .nstat { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .nstat .k { color: var(--muted); font-size: 13.5px; }
  .nstat .v { font-weight: 700; font-size: 14.5px; text-align: right; }
  .nstat .v.tbd { color: #9a9a9a; font-weight: 400; }
  .nstat .v.good { color: #16915a; }   /* green */
  .nstat .v.warn { color: #c0860a; }   /* amber (readable "yellow" on white) */
  .nstat .v.bad  { color: #c0341d; }   /* red */

  .nation-join { width: 100%; padding: 13px; font-size: 15px; }
  .note { margin-top: 12px; text-align: center; font-size: 13.5px; color: var(--muted); min-height: 18px; }
  .note.error { color: var(--err); }

  @media (max-width: 560px) { .select { padding: 32px 16px 56px; } .gamedate { display: none; } }
</style>
</head>
<body>
  <header>
    <div class="wrap nav">
      <div class="brand">Nationhood</div>
      <nav class="nav-actions">
        <a class="btn btn-discord" href="https://discord.gg/HBvWxJUm8" target="_blank" rel="noopener" aria-label="Join the Discord">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.369A19.79 19.79 0 0 0 16.558 3a13.6 13.6 0 0 0-.6 1.23 18.27 18.27 0 0 0-5.487 0A13.6 13.6 0 0 0 9.87 3a19.79 19.79 0 0 0-3.76 1.369C2.72 9.046 1.79 13.605 2.255 18.1a19.9 19.9 0 0 0 6.073 3.058c.49-.668.926-1.377 1.302-2.122a12.93 12.93 0 0 1-2.05-.978c.172-.126.34-.257.502-.392a14.2 14.2 0 0 0 12.036 0c.164.135.332.266.502.392-.654.386-1.343.714-2.052.98.376.743.812 1.452 1.302 2.12a19.86 19.86 0 0 0 6.075-3.058c.546-5.21-.93-9.728-3.93-13.73ZM9.682 15.33c-1.182 0-2.157-1.086-2.157-2.42 0-1.333.955-2.42 2.157-2.42 1.21 0 2.176 1.097 2.157 2.42 0 1.334-.955 2.42-2.157 2.42Zm4.636 0c-1.182 0-2.157-1.086-2.157-2.42 0-1.333.955-2.42 2.157-2.42 1.21 0 2.176 1.097 2.157 2.42 0 1.334-.946 2.42-2.157 2.42Z"/></svg>
          <span class="btn-label">Discord</span>
        </a>
        <button class="btn btn-ghost" id="logout" type="button">Log out</button>
        <span class="gamedate">January, 1980</span>
      </nav>
    </div>
  </header>

  <main class="select">
    <div class="select-head">
      <h1>Choose your nation</h1>
      <p>Found your party or corporation in a living nation.</p>
    </div>

    <article class="nation">
      <div class="nation-banner">
        <img id="flag" alt="Flag" hidden>
        <span class="ph" id="flagPh">&hellip;</span>
      </div>
      <div class="nation-body">
        <h2 class="nation-name" id="nName">&hellip;</h2>
        <p class="nation-desc" id="nDesc"></p>
        <div class="nstats">
          <div class="nstat"><span class="k">Population</span><span class="v" id="v-pop">&hellip;</span></div>
          <div class="nstat"><span class="k">GDP</span><span class="v" id="v-gdp">&hellip;</span></div>
          <div class="nstat"><span class="k">Prosperity</span><span class="v tbd" id="v-prosperity">&hellip;</span></div>
          <div class="nstat"><span class="k">Welfare</span><span class="v tbd" id="v-welfare">&hellip;</span></div>
          <div class="nstat"><span class="k">Order</span><span class="v tbd" id="v-order">&hellip;</span></div>
          <div class="nstat"><span class="k">Image</span><span class="v tbd" id="v-image">&hellip;</span></div>
          <div class="nstat"><span class="k">Growth</span><span class="v tbd" id="v-growth">&hellip;</span></div>
          <div class="nstat"><span class="k">Active Parties</span><span class="v" id="v-parties">&hellip;</span></div>
        </div>
        <button class="btn btn-solid nation-join" id="join" type="button">Join Nation</button>
        <div class="note" id="note" role="status" aria-live="polite"></div>
      </div>
    </article>
  </main>

  <script type="module">
    import { supabase, isConfigured, logout } from '/supabase.js';
    import { statLabel } from '/ladders.js';

    document.getElementById('logout').addEventListener('click', logout);

    var LADDER_STATS = ['prosperity', 'welfare', 'order', 'image', 'growth'];
    var note = document.getElementById('note');
    var flag = document.getElementById('flag');
    var flagPh = document.getElementById('flagPh');

    function err(msg) { note.textContent = msg; note.className = 'note error'; }

    // Population/GDP are stored raw; format to a readable scale.
    function fmtBig(n) {
      n = Number(n) || 0;
      if (n >= 1e12) return trim(n / 1e12) + ' Trillion';
      if (n >= 1e9)  return trim(n / 1e9)  + ' Billion';
      if (n >= 1e6)  return trim(n / 1e6)  + ' Million';
      return n.toLocaleString();
    }
    function trim(x) { return String(Math.round(x * 10) / 10); }

    // Colour for a stat value. Growth has its own bands (contracting → red,
    // around the 10 midpoint → amber, strong → green); the others just go green
    // once they're strong (upper half).
    function statClass(stat, v) {
      if (stat === 'growth') return 'v ' + (v >= 13 ? 'good' : v >= 10 ? 'warn' : 'bad');
      return 'v' + (v >= 11 ? ' good' : '');
    }

    function render(n) {
      document.getElementById('nName').textContent = n.name || 'Unknown';
      document.getElementById('nDesc').textContent = n.description || '';
      document.getElementById('v-pop').textContent = fmtBig(n.population);
      document.getElementById('v-gdp').textContent = '₶' + fmtBig(n.gdp); // ₶ = French livre
      document.getElementById('v-parties').textContent = (n.active_parties != null ? n.active_parties : 0);

      // The five ladder stats: the number is the source, the word is derived.
      var stats = n.stats || {};
      LADDER_STATS.forEach(function (k) {
        var el = document.getElementById('v-' + k);
        var v = stats[k];
        if (typeof v !== 'number') { el.textContent = '—'; el.className = 'v tbd'; return; }
        el.textContent = statLabel(k, v) || '—';
        el.className = statClass(k, v);
      });

      // Flag, with a text fallback if the asset is missing.
      if (n.flag) {
        flag.onerror = function () { flag.hidden = true; flagPh.textContent = n.name || ''; flagPh.hidden = false; };
        flag.onload = function () { flagPh.hidden = true; flag.hidden = false; };
        flag.src = n.flag;
      } else {
        flagPh.textContent = n.name || '';
      }
    }

    (async () => {
      if (!isConfigured) { err('Nation data isn’t connected yet.'); return; }
      try {
        const { data, error } = await supabase.from('nations').select('*').eq('id', 'sessau').single();
        if (error || !data) { err('Couldn’t load this nation. Try again shortly.'); return; }
        render(data);
      } catch (e) {
        err('Couldn’t load this nation. Try again shortly.');
      }
    })();

    // Joining isn't wired yet — acknowledge rather than dead-click.
    document.getElementById('join').addEventListener('click', function () {
      note.className = 'note';
      note.textContent = 'Sessau opens to players soon — joining isn’t live yet.';
    });
  </script>
</body>
</html>
