<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/theme.js"></script>
<title>Nation Select · Nationhood Game</title>
<link rel="stylesheet" href="/site.css">
<style>
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .select { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 48px 24px 72px; }
  .select-head { text-align: center; margin-bottom: 26px; }
  .select-head h1 { font-size: clamp(26px, 4.5vw, 36px); letter-spacing: -0.03em; font-weight: 800; margin: 0 0 8px; }
  .select-head p { color: var(--muted); font-size: 15px; margin: 0; }

  /* nation card */
  .nation { flex: 1 1 340px; max-width: 440px; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--surface); }
  .nation-banner {
    min-height: 120px; display: flex; align-items: center; justify-content: center; overflow: hidden;
    background: repeating-linear-gradient(45deg, var(--surface), var(--surface) 12px, color-mix(in srgb, var(--surface) 92%, var(--ink)) 12px, color-mix(in srgb, var(--surface) 92%, var(--ink)) 24px);
    border-bottom: 1px solid var(--line);
  }
  .nation-banner img { display: block; width: 100%; height: auto; }
  .nation-banner .ph { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
  .nation-body { padding: 22px 22px 24px; }
  .nation-name { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
  .nation-desc { color: var(--muted); font-size: 14.5px; line-height: 1.5; margin: 6px 0 4px; }
  .nation-analog { color: var(--muted); font-size: 13px; font-style: italic; margin: 0 0 16px; }
  .onep { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--err); background: color-mix(in srgb, var(--err) 14%, var(--surface)); border-radius: 999px; padding: 4px 11px; margin: 0 0 14px; }
  .nations { width: 100%; max-width: 1100px; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 22px; }

  .nstats { border-top: 1px solid var(--line); }
  .nstat { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .nstat .k { color: var(--muted); font-size: 13.5px; }
  .nstat .v { font-weight: 700; font-size: 14.5px; text-align: right; }
  .nstat .v.tbd { color: #9a9a9a; font-weight: 400; }
  .nstat .v.good { color: #16915a; }   /* green */
  .nstat .v.warn { color: #c0860a; }   /* amber (readable "yellow" on white) */
  .nstat .v.bad  { color: #c0341d; }   /* red */

  /* The roster: the "Active Parties" row is itself the collapsible toggle. The
     summary is styled to match a stat row; expanding it reveals the party list. */
  .proster { margin: 0 0 20px; }
  .plist > summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .plist > summary::-webkit-details-marker { display: none; }
  .plist > summary .k { color: var(--muted); }
  .plist > summary .v { font-weight: 700; display: inline-flex; align-items: center; gap: 7px; }
  .plist > summary .v::after { content: '▾'; color: var(--muted); font-size: 11px; }
  .plist[open] > summary .v::after { content: '▴'; }
  .plist .prow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  .plist .prow:last-child { border-bottom: 0; }
  .plist .pn { font-weight: 700; color: var(--ink); }
  .plist .pa { color: var(--muted); font-size: 12.5px; }
  .pempty { color: #9a9a9a; font-size: 13px; font-style: italic; padding: 9px 0; border-bottom: 1px solid var(--line); }

  .nation-join { width: 100%; padding: 13px; font-size: 15px; }
  .note { margin-top: 12px; text-align: center; font-size: 13.5px; color: var(--muted); min-height: 18px; }
  .note.error { color: var(--err); }

  @media (max-width: 560px) { .select { padding: 32px 16px 56px; } .nation-body { padding: 18px 16px 20px; } .nation-name { font-size: 21px; } .nation-banner { min-height: 96px; } }
</style>
</head>
<body>
  <header>
    <div class="wrap nav">
      <div class="brand">Nationhood</div>
      <nav class="nav-actions">
        <a class="btn btn-discord" href="https://discord.gg/HBvWxJUm8" target="_blank" rel="noopener" aria-label="Join the Discord">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.369A19.79 19.79 0 0 0 16.558 3a13.6 13.6 0 0 0-.6 1.23 18.27 18.27 0 0 0-5.487 0A13.6 13.6 0 0 0 9.87 3a19.79 19.79 0 0 0-3.76 1.369C2.72 9.046 1.79 13.605 2.255 18.1a19.9 19.9 0 0 0 6.073 3.058c.49-.668.926-1.377 1.302-2.122a12.93 12.93 0 0 1-2.05-.978c.172-.126.34-.257.502-.392a14.2 14.2 0 0 0 12.036 0c.164.135.332.266.502.392-.654.386-1.343.714-2.052.98.376.743.812 1.452 1.302 2.12a19.86 19.86 0 0 0 6.075-3.058c.546-5.21-.93-9.728-3.93-13.73ZM9.682 15.33c-1.182 0-2.157-1.086-2.157-2.42 0-1.333.955-2.42 2.157-2.42 1.21 0 2.176 1.097 2.157 2.42 0 1.334-.955 2.42-2.157 2.42Zm4.636 0c-1.182 0-2.157-1.086-2.157-2.42 0-1.333.955-2.42 2.157-2.42 1.21 0 2.176 1.097 2.157 2.42 0 1.334-.946 2.42-2.157 2.42Z"/></svg>
          <span class="btn-label">Discord</span>
        </a>
        <button class="btn btn-ghost" id="logout" type="button">Log out</button>
        <span class="gamedate"></span>
      </nav>
    </div>
  </header>

  <main class="select">
    <div class="select-head">
      <h1>Choose your nation</h1>
      <p>Found your party or corporation in a living nation.</p>
    </div>

    <div class="nations" id="nations"></div>
    <div class="note" id="note" role="status" aria-live="polite"></div>
  </main>

  <script type="module">
    import { supabase, isConfigured, logout, currentParty } from '/supabase.js';
    import { statLabel, statBand, statName } from '/ladders.js';
    import { esc, MAX_PARTIES_PER_NATION as MAX_PARTIES, fmtGdp, fmtPop } from '/util.js';
    import { mountGameDate } from '/gamedate.js';

    mountGameDate(document.querySelector('.gamedate')); // live game date (one source)
    document.getElementById('logout').addEventListener('click', logout);

    var LADDER_STATS = ['prosperity', 'welfare', 'order', 'image', 'growth'];
    var note = document.getElementById('note');
    var nationsBox = document.getElementById('nations');

    function err(msg) { note.textContent = msg; note.className = 'note error'; }

    // One card's markup. The five ladder stats: the number is the source, the
    // word + colour band are derived (statLabel/statBand) — never stored.
    function statsHTML(n) {
      var stats = n.stats || {};
      var currency = (n.economy && n.economy.currency) || '$'; // nation's currency symbol
      var rows = '<div class="nstat"><span class="k">Population</span><span class="v">' + fmtPop(n.population) + '</span></div>' +
        '<div class="nstat"><span class="k">GDP</span><span class="v">' + currency + fmtGdp(n.gdp) + '</span></div>';
      LADDER_STATS.forEach(function (k) {
        var v = stats[k];
        if (typeof v !== 'number') { rows += '<div class="nstat"><span class="k">' + statName(k) + '</span><span class="v tbd">—</span></div>'; return; }
        rows += '<div class="nstat"><span class="k">' + statName(k) + '</span><span class="' + ('v ' + statBand(k, v)).trim() + '">' + esc(statLabel(k, v) || '—') + '</span></div>';
      });
      return rows; // Active Parties is rendered as the collapsible roster header (loadParties)
    }

    function cardHTML(n) {
      return '<article class="nation" data-id="' + esc(n.id) + '">' +
        '<div class="nation-banner">' +
          (n.flag ? '<img class="flag" alt="Flag" src="' + esc(n.flag) + '">' : '<span class="ph">' + esc(n.name || '') + '</span>') +
        '</div>' +
        '<div class="nation-body">' +
          '<h2 class="nation-name">' + esc(n.name || 'Unknown') + '</h2>' +
          (n.description ? '<p class="nation-desc">' + esc(n.description) + '</p>' : '') +
          (n.analogous ? '<p class="nation-analog">Analogous to: ' + esc(n.analogous) + '</p>' : '') +
          (n.ruling_party ? '<div><span class="onep" title="' + esc(n.ruling_party) + '">One-party state</span></div>' : '') +
          '<div class="nstats">' + statsHTML(n) + '</div>' +
          '<div class="proster"></div>' +
          '<button class="btn btn-solid nation-join">Join Nation</button>' +
        '</div></article>';
    }

    // The parties already founded in a nation: count toward the cap + roster.
    // Derived live from the shared parties table (this is one multiplayer world).
    async function loadParties(card, n) {
      var elRoster = card.querySelector('.proster');
      try {
        const { data, error } = await supabase
          .from('parties').select('name, archetype')
          .eq('nation_id', n.id).order('created_at', { ascending: true });
        if (error) throw error;
        var list = data || [];
        // The "Active Parties N / cap" row is the collapsible toggle; expanding it
        // reveals the roster (keeps a full nation from making the card tower).
        var unit = n.ruling_party ? 'Factions' : 'Parties';
        var inner = list.length
          ? list.map(function (p) {
              return '<div class="prow"><span class="pn">' + esc(p.name) +
                     '</span><span class="pa">' + esc(p.archetype || '') + '</span></div>';
            }).join('')
          : '<div class="pempty">No ' + unit.toLowerCase() + ' yet — be the first to ' + (n.ruling_party ? 'form one' : 'found one') + '.</div>';
        elRoster.innerHTML =
          '<details class="plist"><summary class="nstat"><span class="k">Active ' + unit + '</span>' +
          '<span class="v">' + list.length + ' / ' + MAX_PARTIES + '</span></summary>' +
          '<div class="prows">' + inner + '</div></details>';
        if (list.length >= MAX_PARTIES) {
          var join = card.querySelector('.nation-join');
          join.disabled = true;
          join.textContent = 'Nation Full';
        }
      } catch (e) {
        elRoster.innerHTML = '<div class="pempty">Couldn’t load parties.</div>';
      }
    }

    (async () => {
      // Already have a party? You're committed to a nation — go to your instance,
      // not the join screen (re-joining would overwrite your party).
      const mine = await currentParty();
      if (mine) { window.location.replace('/play/'); return; }
      if (!isConfigured) { err('Nation data isn’t connected yet.'); return; }
      try {
        const { data, error } = await supabase.from('nations').select('*').order('created_at', { ascending: true });
        if (error) throw error;
        var nations = data || [];
        if (!nations.length) { note.textContent = 'No nations are open yet.'; note.className = 'note'; return; }
        nationsBox.innerHTML = nations.map(cardHTML).join('');
        nations.forEach(function (n) {
          var card = nationsBox.querySelector('.nation[data-id="' + (window.CSS && CSS.escape ? CSS.escape(n.id) : n.id) + '"]');
          if (!card) return;
          // Flag fallback: if the asset 404s, swap in the name placeholder.
          var img = card.querySelector('.flag');
          if (img) img.onerror = function () { img.replaceWith(Object.assign(document.createElement('span'), { className: 'ph', textContent: n.name || '' })); };
          card.querySelector('.nation-join').addEventListener('click', function () {
            window.location.href = '/party-creation/?nation=' + encodeURIComponent(n.id);
          });
          loadParties(card, n);
        });
      } catch (e) {
        err('Couldn’t load nations. Try again shortly.');
      }
    })();
  </script>
</body>
</html>
