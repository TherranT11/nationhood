    const text = textEl?.value?.trim() || '[statement]';
    previewEl.innerHTML = 'Regarding the nation of ' + escapeHtml(targetNation) + ', the Foreign Office of ' + escapeHtml(currentNation?.name || '...') + ' has issued the following statement: &ldquo;' + escapeHtml(text) + '&rdquo;';
}
window.updateStatementPreview = updateStatementPreview;

async function submitIssueStatement() {
    if (_submitStatementLock) return;

    const nationEl = document.getElementById('statement-target-nation');
    const textEl = document.getElementById('statement-text');
    const targetNation = nationEl?.value?.trim();
    const statement = textEl?.value?.trim();

    if (!targetNation) { alert('No target nation selected.'); return; }
    if (!statement) { alert('Please enter the statement text.'); return; }
    if (statement.length > 400) { alert('Statement exceeds 400 character limit.'); return; }

    const apCost = 1;
    if ((currentFaction?.action_points ?? 0) < apCost) {
        alert('Not enough AP (1 required). Current AP: ' + (currentFaction?.action_points ?? 0));
        return;
    }

    _submitStatementLock = true;
    const btn = document.getElementById('submit-statement-btn');
    if (btn) btn.disabled = true;

    try {
        // Deduct AP
        const apResult = await deductAP(_supabase, currentFaction.id, apCost);
        if (!apResult.success) {
            if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
            alert('Not enough AP (1 needed). Current AP: ' + (apResult.currentAp ?? '?'));
            return;
        }

        
        const currentTick = shardTick;

        const description = 'Regarding the nation of ' + targetNation + ', the Foreign Office of ' + currentNation.name + ' has issued the following statement: \u201c' + statement + '\u201d';

        // Post to event_log (visible in World Events for other nations, domestic events for own nation)
        const { error: eventErr } = await _supabase.from('event_log').insert({
            nation_id: currentNation.id,
            event_name: 'Official Statement: ' + targetNation,
            trigger_key: 'issue_statement',
            category: 'Diplomacy',
            description_chosen: description,
            fired_at_tick: currentTick
        });
        if (eventErr) {
            console.error('Failed to post statement event:', eventErr.message);
            alert('Error posting statement: ' + eventErr.message);
            return;
        }

        // +1 momentum for the ambassador's party (non-blocking)
        _supabase.rpc('adjust_momentum', {
            p_faction_id: currentFaction.id,
            p_delta: 1,
            p_label: 'Issued official statement (+1)',
            p_tick: currentTick
        }).then(null, e => console.error('adjust_momentum failed:', e));

        // Update AP display
        currentFaction.action_points = apResult.newAp;
        const apEl = document.getElementById('diplo-ap');
        if (apEl) apEl.textContent = currentFaction.action_points + ' AP';

        alert('Statement issued regarding ' + targetNation + ' — posted to World Events.');
        cancelDraft();
        await renderDiploHeader();

    } catch (err) {
        console.error('Submit issue statement error:', err);
        alert('Error: ' + err.message);
    } finally {
        _submitStatementLock = false;
        if (btn) btn.disabled = false;
    }
}
window.submitIssueStatement = submitIssueStatement;

/**
 * Render the full Minor Diplomatic Initiative draft panel.
 * Target nation is auto-filled from ambassador posting (read-only).
 */
function renderMinorInitiativeDraftPanel(body, statusEl) {
    if (statusEl) statusEl.textContent = 'Drafting';

    const ambPostings = diplomaticRoles.ambassadorTo || [];

        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Requires Ambassador posting.</div></div>';
        return;
    }

    // If only one ambassador posting, auto-select; otherwise show selector
    if (!activeDraftTarget && ambPostings.length === 1) {
        activeDraftTarget = { id: ambPostings[0].target_nation_id, name: ambPostings[0].target_nation_name };
    }

    let html = '<div class="draft-panel">';

    // ── Header fields ──
    html += '<div class="draft-header">';
    html += '<div class="draft-field"><div class="draft-field-label">Action</div><div class="draft-field-input">' +
        escapeHtml(activeDraftAction.label) + ' <span style="font-family:var(--font-mono);font-size:10px;font-weight:600;color:var(--teal);">' + MINOR_INITIATIVE_CONFIG.AP_COST + ' AP</span></div></div>';

    // Target nation — read-only if single posting, dropdown if multiple
    if (ambPostings.length === 1) {
        html += '<div class="draft-field"><div class="draft-field-label">Target</div><div class="draft-field-input">' +
            escapeHtml(ambPostings[0].target_nation_name) + '</div></div>';
    } else {
        html += '<div class="draft-field"><div class="draft-field-label">Target</div>' +
            '<select class="selector-dropdown" onchange="selectMinorInitiativeTarget(this.value)">' +
            '<option value="">Select posting...</option>';
        ambPostings.forEach(a => {
            const sel = activeDraftTarget && activeDraftTarget.id === a.target_nation_id ? ' selected' : '';
            html += '<option value="' + a.target_nation_id + '"' + sel + '>' + escapeHtml(a.target_nation_name) + '</option>';
        });
        html += '</select></div>';
    }

    // Initiative name
    html += '<div class="draft-field"><div class="draft-field-label">Name</div>' +
        '<input type="text" id="initiative-name-input" class="draft-field-input" ' +
        'placeholder="e.g. ' + escapeHtml((currentNation?.name || '') + '-' + (activeDraftTarget?.name || '') + ' Friendship Accord') + '" ' +
        'value="' + escapeHtml(wizardName) + '" oninput="setWizardName(this.value)" ' +
        'style="border:1px solid var(--border-subtle);background:var(--bg-3);color:var(--text-primary);padding:6px 10px;font-family:var(--font-sans);font-size:12px;width:100%;"></div>';
    html += '</div>';

    html += '<div class="draft-articles" style="flex:1;overflow-y:auto;padding:10px 14px;">';
    if (wizardArticles.length === 0) {
        html += '<div class="empty-state" style="padding:20px 0;"><div class="empty-state-text">No articles added yet.<br>Use the selector below to add articles.</div></div>';
    } else {
        wizardArticles.forEach((art, i) => {
            html += renderInitiativeArticleCard(art, i, true, 'removeMinorInitiativeArticle');
        });
    }
    html += '</div>';

    // ── Article selector ──
    html += '<div class="article-selector">';
    html += '<select class="selector-dropdown" id="initiative-article-selector">';
    html += '<option value="">Add article...</option>';
    for (const [key, typeInfo] of Object.entries(INITIATIVE_ARTICLE_TYPES)) {
        // Check if max per initiative reached
        if (typeInfo.max_per_initiative) {
            const count = wizardArticles.filter(a => a.type === key).length;
            if (count >= typeInfo.max_per_initiative) continue;
        }
        html += '<option value="' + key + '">' + escapeHtml(typeInfo.label) + '</option>';
    }
    html += '</select>';
    html += '<button class="btn btn--primary btn--sm" onclick="addMinorInitiativeArticle()">Add</button>';

    // ── Action bar ──
    const totalEffects = computeInitiativeTotals(wizardArticles);

    html += '<div class="action-bar">';

    html += '</div>';

    html += '</div>';
    body.innerHTML = html;

function selectMinorInitiativeTarget(nationId) {
    if (!nationId) { activeDraftTarget = null; renderDraftBox(); return; }
    const posting = (diplomaticRoles.ambassadorTo || []).find(a => a.target_nation_id === nationId);

/**
 * Add a new article to the minor initiative draft.
 */
function addMinorInitiativeArticle() {
    const sel = document.getElementById('initiative-article-selector');
    if (!sel || !sel.value) return;
    const typeKey = sel.value;
    const typeInfo = INITIATIVE_ARTICLE_TYPES[typeKey];
    if (!typeInfo) return;

    // Enforce max per initiative
    if (typeInfo.max_per_initiative) {
        const count = wizardArticles.filter(a => a.type === typeKey).length;
        if (count >= typeInfo.max_per_initiative) {
            alert('Only one ' + typeInfo.label + ' per initiative.');
            return;
        }
    }

    // Create article with default config
    const article = {
        id: crypto.randomUUID ? crypto.randomUUID() : 'art-' + Date.now() + '-' + Math.random().toString(36).slice(2,8),
        type: typeKey,
        label: typeInfo.label,
        config: JSON.parse(JSON.stringify(typeInfo.default_config)),
        status: 'active'
    };

    wizardArticles.push(article);
    renderDraftBox();
}

function renderInitiativeArticleCard(art, index, editable, removeFn = 'removeMajorInitiativeArticle') {
    const typeInfo = INITIATIVE_ARTICLE_TYPES[art.type] || MAJOR_INITIATIVE_ARTICLE_TYPES[art.type];
    if (!typeInfo) return '';

    const struckClass = art.status === 'struck' ? ' initiative-article--struck' : '';
    let html = '<div class="initiative-article' + struckClass + '">';

    // Header: article number + type + remove button
    html += '<div class="initiative-article-head">';

    html += '<span class="initiative-article-type">' + escapeHtml(typeInfo.label).toUpperCase();

    if (editable) {

/**
 * Compute effects for a single article based on its type and config.
 */
function computeArticleEffects(art) {
    const typeInfo = INITIATIVE_ARTICLE_TYPES[art.type] || MAJOR_INITIATIVE_ARTICLE_TYPES[art.type];
    if (!typeInfo || !typeInfo.calculateEffects) return {};
    try {
        return typeInfo.calculateEffects(art.config);
    } catch (e) {
        console.warn('Error computing effects for article:', art.type, e);
        return {};
    }
}

/**
 * Render effect tags for an article.
 */
function renderEffectTags(effects, articleType) {
    let html = '<div class="article-effects">';

    if (articleType === 'joint_statement') {
        html += '<span class="effect-tag effect-tag--neutral">No stat effects</span>';
        html += '</div>';
        return html;
    }

    // For visa, use .summary if available
    const e = effects.summary || effects;
    const tags = [];

    if (e.relations) tags.push({ label: (e.relations > 0 ? '+' : '') + e.relations + ' Relations', cls: 'effect-tag--positive' });
    if (e.revenue > 0) tags.push({ label: '+$' + (e.revenue / 1e6).toFixed(0) + 'M Revenue', cls: 'effect-tag--money-pos' });
    if (e.cost_proposer > 0 || e.cost_target > 0) {
        const total = (e.cost_proposer || 0) + (e.cost_target || 0);
        tags.push({ label: '-$' + (total / 1e6).toFixed(1) + 'M Cost', cls: 'effect-tag--money-neg' });
    }
    if (e.intl_reputation || e.international_reputation) {
        const val = e.intl_reputation || e.international_reputation;
        tags.push({ label: (val > 0 ? '+' : '') + val + ' Int\'l Rep', cls: val > 0 ? 'effect-tag--positive' : 'effect-tag--warning' });
    }
    if (e.immigration) tags.push({ label: '+' + e.immigration + ' Immigration', cls: 'effect-tag--positive' });
    if (e.higher_education) tags.push({ label: '+' + e.higher_education + ' Higher Ed', cls: 'effect-tag--positive' });
    if (e.soft_power) tags.push({ label: '+' + e.soft_power + ' Soft Power', cls: 'effect-tag--info' });
    if (e.soft_power_per_year) tags.push({ label: '+' + e.soft_power_per_year + ' Soft Power/yr', cls: 'effect-tag--info' });
    if (e.permanent_soft_power) tags.push({ label: '+' + e.permanent_soft_power + ' Permanent Soft Power', cls: 'effect-tag--info' });
    if (e.technology_bonus) tags.push({ label: '+' + e.technology_bonus + ' Technology', cls: 'effect-tag--info' });
    if (e.polarization) tags.push({ label: '+' + e.polarization + ' Polarization', cls: 'effect-tag--warning' });
    if (e.terrorism_risk) tags.push({ label: '+' + e.terrorism_risk + ' Terrorism Risk', cls: 'effect-tag--warning' });
    if (e.terrorism && !e.terrorism_risk) tags.push({ label: (e.terrorism > 0 ? '+' : '') + e.terrorism + ' Terrorism', cls: e.terrorism > 0 ? 'effect-tag--warning' : 'effect-tag--positive' });
    if (e.ongoing_per_tick) tags.push({ label: '-$' + (e.ongoing_per_tick / 1e6).toFixed(0) + 'M/tick Ongoing', cls: 'effect-tag--money-neg' });
    // Major initiative stat tags
    if (e.gdp_growth) tags.push({ label: (e.gdp_growth > 0 ? '+' : '') + e.gdp_growth + ' GDP Growth', cls: e.gdp_growth > 0 ? 'effect-tag--positive' : 'effect-tag--warning' });
    if (e.labor_force_participation) tags.push({ label: '+' + e.labor_force_participation + ' Labor Force', cls: 'effect-tag--positive' });
    if (e.civil_unrest) tags.push({ label: '+' + e.civil_unrest + ' Civil Unrest', cls: 'effect-tag--warning' });
    if (e.housing_affordability) tags.push({ label: e.housing_affordability + ' Housing', cls: e.housing_affordability > 0 ? 'effect-tag--positive' : 'effect-tag--warning' });
    if (e.cost_of_living) tags.push({ label: '+' + e.cost_of_living + ' Cost of Living', cls: 'effect-tag--warning' });
    if (e.crime_rate) tags.push({ label: e.crime_rate + ' Crime Rate', cls: e.crime_rate < 0 ? 'effect-tag--positive' : 'effect-tag--warning' });
    if (e.corruption) tags.push({ label: e.corruption + ' Corruption', cls: e.corruption < 0 ? 'effect-tag--positive' : 'effect-tag--warning' });
    if (e.judicial_independence) tags.push({ label: (e.judicial_independence > 0 ? '+' : '') + e.judicial_independence + ' Judicial Ind.', cls: e.judicial_independence > 0 ? 'effect-tag--positive' : 'effect-tag--warning' });
    if (e.freedom_index) tags.push({ label: e.freedom_index + ' Freedom Index', cls: e.freedom_index > 0 ? 'effect-tag--positive' : 'effect-tag--warning' });
    if (e.press_freedom) tags.push({ label: e.press_freedom + ' Press Freedom', cls: e.press_freedom > 0 ? 'effect-tag--positive' : 'effect-tag--warning' });
    if (e.pollution) tags.push({ label: e.pollution + ' Pollution', cls: e.pollution < 0 ? 'effect-tag--positive' : 'effect-tag--warning' });
    if (e.manufacturing_output) tags.push({ label: e.manufacturing_output + ' Manufacturing', cls: e.manufacturing_output > 0 ? 'effect-tag--positive' : 'effect-tag--warning' });

    if (tags.length === 0) {
        tags.push({ label: 'No stat effects', cls: 'effect-tag--neutral' });
    }

    tags.forEach(t => { html += '<span class="effect-tag ' + t.cls + '">' + t.label + '</span>'; });
    html += '</div>';
    return html;
}

/**
 * Render a read-only config summary for an article in the negotiations view.
 * Shows the key config choices as a compact text summary.
 */
function renderArticleConfigSummary(art) {
    const c = art.config;
    if (!c) return '';
    let lines = [];

    switch (art.type) {
        case 'visa_agreement': {
            const dur = VISA_DURATION_OPTIONS.find(d => d.key === c.duration);
            const scope = VISA_SCOPE_OPTIONS.find(s => s.key === c.scope);
            const dir = VISA_DIRECTION_OPTIONS.find(d => d.key === c.direction);
            if (dur) lines.push(dur.label);
            if (scope) lines.push(scope.label);
            if (dir) lines.push(dir.label);
            const excludes = (c.excludes || []).map(k => {
                const ex = VISA_EXCLUDES.find(e => e.key === k);
                return ex ? ex.label : k;
            });
            if (excludes.length) lines.push('Excludes: ' + excludes.join(', '));
            break;
        }
        case 'cultural_exchange': {
            const dur = CULTURAL_DURATION_OPTIONS.find(d => d.key === c.duration);
            const fund = CULTURAL_FUNDING_OPTIONS.find(f => f.key === c.funding);
            if (dur) lines.push(dur.label);
            if (fund) lines.push('Funding: ' + fund.label);
            const progs = (c.programmes || []).map(k => {
                const p = CULTURAL_PROGRAMMES.find(p => p.key === k);
                return p ? p.label : k;
            });
            if (progs.length) lines.push('Programmes: ' + progs.join(', '));
            break;
        }
        case 'student_exchange': {
            const lvl = STUDENT_LEVEL_OPTIONS.find(l => l.key === c.level);
            const dur = STUDENT_DURATION_OPTIONS.find(d => d.key === c.duration);
            const fund = STUDENT_FUNDING_OPTIONS.find(f => f.key === c.funding);
            if (lvl) lines.push(lvl.label);
            if (dur) lines.push(dur.label);
            if (c.seats) lines.push(c.seats + ' seats');
            if (fund) lines.push('Funding: ' + fund.label);
            const fields = (c.fields || []).map(k => {
                const f = STUDENT_FIELDS.find(sf => sf.key === k);
                return f ? f.label : k;
            });
            if (fields.length) lines.push('Fields: ' + fields.join(', '));
            break;
        }
        case 'joint_statement': {
            const vis = STATEMENT_VISIBILITY_OPTIONS.find(v => v.key === c.visibility);
            if (vis) lines.push(vis.label);
            if (c.text) lines.push('"' + (c.text.length > 120 ? c.text.substring(0, 120) + '…' : c.text) + '"');
            break;
        }
        case 'open_borders': {
            const scope = OPEN_BORDERS_SCOPE_OPTIONS.find(s => s.key === c.scope);
            const dir = OPEN_BORDERS_DIRECTION_OPTIONS.find(d => d.key === c.direction);
            const prot = OPEN_BORDERS_WORKER_PROTECTIONS.find(p => p.key === c.worker_protections);
            const trans = OPEN_BORDERS_TRANSITION_OPTIONS.find(t => t.key === c.transition);
            if (scope) lines.push(scope.label);
            if (dir) lines.push(dir.label);
            if (prot) lines.push(prot.label);
            if (trans) lines.push(trans.label);
            break;
        }
        case 'mutual_extradition': {
            const scopes = (c.scope || []).map(k => {
                const opt = EXTRADITION_SCOPE_OPTIONS.find(o => o.key === k);
                return opt ? opt.label : k;
            });
            if (scopes.length) lines.push('Scope: ' + scopes.join(', '));
            const dc = EXTRADITION_DUAL_CRIMINALITY_OPTIONS.find(d => d.key === c.dual_criminality);
            if (dc) lines.push(dc.label);
            const ap = EXTRADITION_APPEAL_OPTIONS.find(a => a.key === c.appeal_process);
            if (ap) lines.push(ap.label);
            const excs = (c.exceptions || []).map(k => {
                const opt = EXTRADITION_EXCEPTION_OPTIONS.find(o => o.key === k);
                return opt ? opt.label : k;
            });
            if (excs.length) lines.push('Exceptions: ' + excs.join(', '));
            break;
        }
        case 'environmental_accord': {
            const em = ENVIRONMENT_EMISSION_TARGET_OPTIONS.find(e => e.key === c.emission_target);
            const ren = ENVIRONMENT_RENEWABLE_TARGET_OPTIONS.find(r => r.key === c.renewable_target);
            const pol = ENVIRONMENT_POLLUTION_STANDARDS.find(p => p.key === c.pollution_standards);
            if (em) lines.push(em.label);
            if (ren && ren.key > 0) lines.push(ren.label + ' Renewable');
            if (pol) lines.push(pol.label);
            const cons = (c.conservation || []).map(k => {
                const opt = ENVIRONMENT_CONSERVATION_OPTIONS.find(o => o.key === k);
                return opt ? opt.label : k;
            });
            if (cons.length) lines.push('Conservation: ' + cons.join(', '));
            const rev = ENVIRONMENT_REVIEW_INTERVAL_OPTIONS.find(r => r.key === c.review_interval);
            if (rev) lines.push(rev.label);
            const pen = ENVIRONMENT_PENALTY_OPTIONS.find(p => p.key === c.penalty);
            if (pen) lines.push('Penalty: ' + pen.label);
            break;
        }
    }

    if (lines.length === 0) return '';
    return '<div style="font-family:var(--font-mono);font-size:9px;color:var(--text-2);line-height:1.5;">' +
        lines.map(l => escapeHtml(l)).join(' · ') + '</div>';
}

/**
 * Render effect tags from a stored effects object (used in negotiations view).
 * Unlike renderEffectTags() which computes effects fresh, this reads from the stored proposal_data.
 */
function renderEffectTagsFromEffects(effects, articleType) {
    if (!effects) return '';
    // Reuse the same rendering logic — the stored effects have the same shape
    return renderEffectTags(effects, articleType);
}

/**
 * Compute combined totals across all articles in the initiative.
 */
function computeInitiativeTotals(articles) {
    const totals = { relations: 0, revenue: 0, cost_proposer: 0, cost_target: 0, intl_reputation: 0 };
    for (const art of articles) {
        if (art.status === 'struck') continue;
        const effects = computeArticleEffects(art);
        const e = effects.summary || effects;
        totals.relations += e.relations || 0;
        totals.revenue += e.revenue || 0;
        totals.cost_proposer += e.cost_proposer || 0;
        totals.cost_target += e.cost_target || 0;
        totals.intl_reputation += e.intl_reputation || 0;
    }
    return totals;
}

// RECALL AMBASSADOR PANEL
// ══════════════════════════════════════════════════════
async function renderRecallAmbassadorPanel(body, statusEl) {
    if (statusEl) statusEl.textContent = 'Recall Ambassador';

    // Fetch active ambassadors (cached to avoid re-fetching on reason selection)
    if (!recallCachedAmbassadors) {
        const { data, error } = await _supabase
            .from('ambassadors')
            .select('*, factions(abbreviation)')
            .eq('nation_id', currentNation.id)
            .eq('is_active', true)
            .eq('status', 'active');
        if (error) console.error('Recall ambassador query error:', error);
        // Attach nation names from the nations table
        if (data && data.length > 0) {
            const targetIds = data.map(a => a.target_nation_id);
            const { data: nations } = await _supabase.from('nations').select('id, name').in('id', targetIds);

            (nations || []).forEach(n => { nationMap[n.id] = n; });
            data.forEach(a => { a.nations = nationMap[a.target_nation_id] || null; });
        }

    let html = '<div class="draft-panel">';

    // Header
    html += '<div class="draft-header">';
    html += '<div class="draft-field"><div class="draft-field-label">Action</div><div class="draft-field-input">Recall Ambassador <span style="color:var(--teal);">(' + DIPLOMACY_CONFIG.RECALL_AMBASSADOR_AP + ' AP)</span></div></div>';

    // Target dropdown — only nations with active ambassadors
    if (!activeAmbs || activeAmbs.length === 0) {
        html += '</div>';
        html += '<div class="empty-state"><div class="empty-state-text">No active ambassadors to recall.</div></div>';
        html += '<div class="detail-actions" style="margin-top:auto;padding-top:10px;border-top:1px solid var(--border-hair);">';
        html += '<button class="detail-btn" onclick="cancelDraft()">Cancel</button>';
        html += '</div></div>';
        body.innerHTML = html;
        return;
    }

    html += '<div class="draft-field"><div class="draft-field-label">Target</div>';
    html += '<select id="recall-target-select" style="flex:1;background:var(--bg-3);border:1px solid var(--border-subtle);color:var(--text-primary);font-family:var(--font-sans);font-size:12px;padding:4px 8px;" onchange="selectRecallTarget(this.value)">';
    html += '<option value="">Select nation...</option>';
    activeAmbs.forEach(a => {
        const nationName = a.nations?.name || 'Unknown';
        const sel = recallTargetAmbassador && recallTargetAmbassador.id === a.id ? ' selected' : '';
        html += '<option value="' + a.id + '"' + sel + '>' + escapeHtml(nationName) + '</option>';
    });
    html += '</select></div>';
    html += '</div>';

    // Ambassador info card (shown when target selected)
    if (recallTargetAmbassador) {
        const amb = recallTargetAmbassador;
        const ambName = ((amb.ambassador_first_name || '') + ' ' + (amb.ambassador_last_name || '')).trim();
        const partyAbbr = amb.factions?.abbreviation || '—';
        const approval = amb.ambassador_approval ?? '—';
        const termLen = amb.term_length || 60;
        const termRemaining = Math.max(0, termLen - (shardTick - (amb.appointed_at_tick || 0)));
        const targetNationName = amb.nations?.name || 'Unknown';

        // Relation data
        const relScore = recallTargetRelation ? recallTargetRelation.relation_score : 30;
        const projectedScore = recallSelectedReason
            ? Math.max(-100, Math.min(100, relScore - RECALL_REASONS[recallSelectedReason].relationPenalty))
            : relScore;

        html += '<div class="recall-info-card">';
        html += '<div style="font-family:var(--font-mono);font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);margin-bottom:8px;">Ambassador Details</div>';
        html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:11.5px;">';
        html += '<div><span style="color:var(--text-dim);">Name:</span> <span style="color:var(--text-primary);font-weight:500;">' + escapeHtml(ambName) + '</span></div>';
        html += '<div><span style="color:var(--text-dim);">Party:</span> <span style="color:var(--text-primary);">' + escapeHtml(partyAbbr) + '</span></div>';
        html += '<div><span style="color:var(--text-dim);">Approval:</span> <span style="color:var(--text-primary);">' + approval + '%</span></div>';
        html += '<div><span style="color:var(--text-dim);">Term Left:</span> <span style="color:var(--text-primary);">' + termRemaining + ' ticks</span></div>';
        html += '</div>';

        // Relation bar

        html += '<div style="display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:8px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);margin-bottom:4px;">';
        html += '<span>Relations with ' + escapeHtml(targetNationName) + '</span>';
        html += '<span>' + relScore + (recallSelectedReason ? ' → ' + projectedScore : '') + '</span>';
        html += '</div>';
        html += '<div class="recall-rel-bar">';

        const currentPct = Math.max(0, Math.min(100, (relScore + 100) / 2));
        html += '<div class="recall-rel-bar-fill" style="width:' + currentPct + '%;background:' + getRelationColor(relScore) + ';"></div>';

            const projPct = Math.max(0, Math.min(100, (projectedScore + 100) / 2));
            html += '<div class="recall-rel-bar-projected" style="left:' + projPct + '%;border-color:var(--red);"></div>';

    Object.values(RECALL_REASONS).forEach(r => {
        const isSelected = recallSelectedReason === r.key;

        html += '<div class="recall-reason-card' + selectedClass + '" onclick="selectRecallReason(\'' + r.key + '\')">';

        html += '<div style="flex:1;">';
        html += '<div style="display:flex;align-items:center;gap:6px;">';
        html += '<span style="font-size:12px;font-weight:500;color:var(--text-primary);">' + r.label + '</span>';
        if (isSevere) html += '<span style="font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--red);background:rgba(239,68,68,0.1);padding:1px 5px;border-radius:2px;">Severe</span>';
        html += '</div>';
        html += '<div style="font-size:11px;color:var(--text-muted);font-style:italic;margin-top:2px;">' + r.signal + '</div>';
        html += '<div style="display:flex;gap:8px;margin-top:4px;">';
        html += '<span style="font-family:var(--font-mono);font-size:8.5px;color:var(--red);">Relations -' + r.relationPenalty + '</span>';
        if (r.hostApprovalPenalty > 0) html += '<span style="font-family:var(--font-mono);font-size:8.5px;color:var(--amber);">Host Approval -' + r.hostApprovalPenalty + '</span>';
        if (r.pressEvent) html += '<span style="font-family:var(--font-mono);font-size:8.5px;color:var(--amber);">Press Event</span>';
        if (r.cascadeEffect) html += '<span style="font-family:var(--font-mono);font-size:8.5px;color:var(--red);">Allied Cascade ' + r.cascadeAmount + '</span>';
        html += '</div>';
        html += '</div></div>';
    });
    html += '</div>';

    // Warning box
    if (recallSelectedReason) {
        const reason = RECALL_REASONS[recallSelectedReason];
        const isSevere = reason.key === 'pre_war_posture';
        const borderColor = isSevere ? 'var(--red)' : 'var(--amber)';
        const bgColor = isSevere ? 'rgba(239,68,68,0.06)' : 'rgba(245,158,11,0.06)';
        html += '<div class="recall-warning" style="border-color:' + borderColor + ';background:' + bgColor + ';">';
        html += '<div style="font-family:var(--font-mono);font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:' + borderColor + ';margin-bottom:4px;">&#9888; Consequences</div>';
        html += '<ul style="margin:0;padding-left:16px;font-size:11px;color:var(--text-muted);line-height:1.6;">';
        html += '<li>Ambassador deactivated and embassy status set to "recalled"</li>';
        html += '<li>Relations reduced by ' + reason.relationPenalty + ' points</li>';
        html += '<li>1-3 Momentum loss to ambassador\'s party</li>';
        html += '<li>Active diplomatic initiatives cancelled</li>';
        if (reason.hostApprovalPenalty > 0) html += '<li>Host nation loses ' + reason.hostApprovalPenalty + ' Government Approval</li>';
        if (reason.cascadeEffect) html += '<li style="color:var(--red);font-weight:500;">Target\'s allies (relations ≥ 70) lose ' + Math.abs(reason.cascadeAmount) + ' relations with your nation</li>';
        html += '</ul>';
        html += '<div style="font-size:10px;color:var(--text-dim);margin-top:6px;font-style:italic;">This action is irreversible.</div>';
        html += '</div>';
    }

    // Action bar
    const canConfirm = recallTargetAmbassador && recallSelectedReason;
    html += '<div class="detail-actions" style="margin-top:auto;padding-top:10px;border-top:1px solid var(--border-hair);">';
    html += '<button class="detail-btn" style="color:var(--text-muted);" onclick="cancelDraft()">Cancel</button>';

    html += '</div>';

    html += '</div>';
    body.innerHTML = html;
}

function getRelationColor(score) {
    if (score >= 70) return 'var(--green)';
    if (score >= 40) return 'var(--teal)';
    if (score >= 10) return 'var(--amber)';
    return 'var(--red)';
}

async function selectRecallTarget(ambassadorId) {
    if (!ambassadorId) {
        recallTargetAmbassador = null;
        recallTargetRelation = null;
        recallSelectedReason = null;
        renderDraftBox();
        return;
    }
    // Fetch ambassador details
    const { data: amb } = await _supabase
        .from('ambassadors')
        .select('*, factions(abbreviation)')
        .eq('id', ambassadorId)
        .single();
    if (!amb) { recallTargetAmbassador = null; renderDraftBox(); return; }
    // Attach target nation name
    if (amb.target_nation_id) {
        const { data: nation } = await _supabase.from('nations').select('id, name').eq('id', amb.target_nation_id).single();
        amb.nations = nation || null;
    }
    recallTargetAmbassador = amb;

    // Fetch relation
    const targetId = amb.target_nation_id;
    const natA = currentNation.id < targetId ? currentNation.id : targetId;
    const natB = currentNation.id < targetId ? targetId : currentNation.id;
    const { data: rel } = await _supabase
        .from('diplomatic_relations')
        .select('*')
        .eq('nation_a_id', natA)
        .eq('nation_b_id', natB)
        .maybeSingle();
    recallTargetRelation = rel;
    renderDraftBox();
}

function selectRecallReason(key) {
    recallSelectedReason = recallSelectedReason === key ? null : key;
    renderDraftBox();
}

// APPOINT AMBASSADOR PANEL
// ══════════════════════════════════════════════════════
async function renderAppointAmbassadorPanel(body, statusEl) {
    if (statusEl) statusEl.textContent = 'Appoint Ambassador';

    // Fetch existing active/pending ambassadors (cached)
    if (!appointCachedExistingAmbs) {
        const { data } = await _supabase
            .from('ambassadors')
            .select('target_nation_id')
            .eq('nation_id', currentNation.id)
            .eq('is_active', true);
        appointCachedExistingAmbs = (data || []).map(a => a.target_nation_id);
    }

    // Filter nations: exclude those with existing ambassadors
    const eligibleNations = cachedOtherNations.filter(n => !appointCachedExistingAmbs.includes(n.id));

        html += '<div class="draft-field-input" style="color:var(--text-dim);">All nations already have ambassadors</div>';
        html += '</div></div>';
        html += '<div class="detail-actions" style="margin-top:auto;padding-top:10px;border-top:1px solid var(--border-hair);">';
        html += '<button class="detail-btn" onclick="cancelDraft()">Cancel</button>';
        html += '</div></div>';

    }
    html += '<select id="appoint-target-select" style="flex:1;background:var(--bg-3);border:1px solid var(--border-subtle);color:var(--text-primary);font-family:var(--font-sans);font-size:12px;padding:4px 8px;" onchange="selectAppointTarget(this.value)">';
    html += '<option value="">Select a nation...</option>';
    eligibleNations.forEach(n => {
        const sel = appointTargetNation && appointTargetNation.id === n.id ? ' selected' : '';
        html += '<option value="' + n.id + '"' + sel + '>' + escapeHtml(n.name) + '</option>';
    });
    html += '</select></div></div>';

    // Status bar + candidate table (shown when target selected)
    if (appointTargetNation) {
        const relScore = appointTargetRelation ? appointTargetRelation.relation_score : 35;
        const relTier = getRelationTier(relScore);
        const isNationA = currentNation.id < appointTargetNation.id;
        const embStatus = appointTargetRelation
            ? (isNationA ? appointTargetRelation.embassy_status_a : appointTargetRelation.embassy_status_b) || 'None'
            : 'None';
        const agreementCount = 0; // active_treaties not in SELECT — removed nonexistent field read

        // Status bar
        html += '<div class="appoint-status-bar">';
        html += '<div class="appoint-status-item"><span class="appoint-status-label">Status</span> <span class="appoint-status-value" style="color:var(--green);border-color:var(--green-border);">Vacant</span></div>';
        html += '<div class="appoint-status-item"><span class="appoint-status-label">Relations</span> <span class="appoint-status-value ' + relTier.cssClass + '">' + relTier.label.toUpperCase() + '</span> <span style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);">' + (relScore >= 0 ? '+' : '') + relScore + '</span></div>';
        html += '<div class="appoint-status-item"><span class="appoint-status-label">Embassy</span> <span class="appoint-status-value" style="font-weight:600;">' + embStatus.charAt(0).toUpperCase() + embStatus.slice(1) + '</span></div>';
        html += '<div class="appoint-status-item"><span class="appoint-status-label">Agreements</span> <span class="appoint-status-value" style="color:var(--teal);font-weight:700;">' + agreementCount + '</span></div>';
        html += '</div>';

        // Candidate table
        html += '<div style="padding:0 14px;"><div style="font-family:var(--font-mono);font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);margin-bottom:6px;">Select Candidate</div></div>';

        if (appointCandidates.length === 0) {
            html += '<div class="empty-state" style="padding:20px 0;"><div class="empty-state-text">No candidates available.</div></div>';

            html += '<div style="flex:0.7;text-align:center;">Age</div>';

            appointCandidates.forEach((c, i) => {

                html += '<div style="width:28px;display:flex;align-items:center;justify-content:center;">';

                html += '</div>';
                html += '<div style="flex:2;font-weight:500;color:var(--text-primary);">' + escapeHtml(c.firstName) + ' ' + escapeHtml(c.lastName) + '</div>';
                html += '<div style="flex:0.7;text-align:center;color:var(--text-muted);">' + c.age + '</div>';
                html += '<div style="flex:1;text-align:center;"><span class="appoint-party-badge" style="border-color:' + c.partyColor + ';"><span class="appoint-party-dot" style="background:' + c.partyColor + ';"></span>' + escapeHtml(c.partyAbbr) + '</span></div>';

    // Appointment Details (shown when candidate selected)
    if (appointSelectedIndex !== null && appointCandidates[appointSelectedIndex] && appointTargetNation) {
        const c = appointCandidates[appointSelectedIndex];
        const termTicks = DIPLOMACY_CONFIG.AMBASSADOR_TERM_LENGTH || 60;
        const termYears = Math.round(termTicks / 12);
        html += '<div class="appoint-details">';
        html += '<div style="font-family:var(--font-mono);font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--teal);margin-bottom:8px;">&#9679; Appointment Details</div>';
        html += '<div class="appoint-detail-row"><span class="appoint-detail-label">Nominee</span><span class="appoint-detail-value">' + escapeHtml(c.firstName) + ' ' + escapeHtml(c.lastName) + '</span></div>';
        html += '<div class="appoint-detail-row"><span class="appoint-detail-label">Party</span><span class="appoint-detail-value"><span class="appoint-party-badge" style="border-color:' + c.partyColor + ';"><span class="appoint-party-dot" style="background:' + c.partyColor + ';"></span>' + escapeHtml(c.partyAbbr) + '</span></span></div>';
        html += '<div class="appoint-detail-row"><span class="appoint-detail-label">Posting</span><span class="appoint-detail-value">' + escapeHtml(appointTargetNation.name) + '</span></div>';
        html += '<div class="appoint-detail-row"><span class="appoint-detail-label">Term</span><span class="appoint-detail-value" style="font-family:var(--font-mono);font-size:11px;">' + termTicks + ' ticks (' + termYears + ' years)</span></div>';
        html += '<div class="appoint-detail-row"><span class="appoint-detail-label">AP Cost</span><span class="appoint-detail-value" style="font-family:var(--font-mono);font-size:11px;">' + APPOINT_AMBASSADOR_AP + ' AP</span></div>';
        html += '</div>';
    }

    // Footer bar (below appointment details)
    html += '<div class="detail-actions" style="margin-top:auto;padding-top:10px;border-top:1px solid var(--border-hair);">';
    if (appointSelectedIndex !== null && appointCandidates[appointSelectedIndex]) {
        const c = appointCandidates[appointSelectedIndex];
        const exp = Math.max(1, c.age - 26);
        html += '<span style="font-family:var(--font-mono);font-size:8.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);flex:1;">' + escapeHtml(c.firstName) + ' ' + escapeHtml(c.lastName) + ' / ' + escapeHtml(c.partyAbbr) + ' / ' + exp + ' yr exp.</span>';
    } else {
        html += '<span style="flex:1;"></span>';
    }
    html += '<button class="detail-btn" style="color:var(--text-muted);" onclick="cancelDraft()">Cancel</button>';
    const canNominate = appointTargetNation && appointSelectedIndex !== null;
    html += '<button class="detail-btn" style="color:' + (canNominate ? 'var(--teal)' : 'var(--text-dim)') + ';border-color:' + (canNominate ? 'var(--teal-border)' : 'var(--border-subtle)') + ';" ' + (canNominate ? 'onclick="executeAppointAmbassador()"' : 'disabled') + '>Nominate (' + APPOINT_AMBASSADOR_AP + ' AP)</button>';
    html += '</div>';

    html += '</div>';
    body.innerHTML = html;
}

async function selectAppointTarget(nationId) {
    if (!nationId) {
        appointTargetNation = null;
        appointTargetRelation = null;
        appointCandidates = [];
        appointSelectedIndex = null;
        renderDraftBox();
        return;
    }

    // Fetch nation
    const nation = cachedOtherNations.find(n => n.id === nationId);
    if (!nation) {
        const { data } = await _supabase.from('nations').select('*').eq('id', nationId).single();
        appointTargetNation = data;
    } else {
        appointTargetNation = nation;
    }

    // Fetch relation
    const natA = currentNation.id < nationId ? currentNation.id : nationId;
    const natB = currentNation.id < nationId ? nationId : currentNation.id;
    const { data: rel } = await _supabase
        .from('diplomatic_relations')
        .select('*')
        .eq('nation_a_id', natA)
        .eq('nation_b_id', natB)
        .maybeSingle();
    appointTargetRelation = rel;

    // Generate candidates from all parties in current nation
    const { data: parties } = await _supabase
        .from('factions')
        .select('id, faction_name, abbreviation, color')
        .eq('nation_id', currentNation.id);

    appointCandidates = (parties || []).map(p => ({
        partyId: p.id,
        partyName: p.faction_name,
        partyAbbr: p.abbreviation || p.faction_name.substring(0, 3).toUpperCase(),
        partyColor: p.color || '#888',
        firstName: AMB_FIRST_NAMES[Math.floor(Math.random() * AMB_FIRST_NAMES.length)],
        lastName: AMB_LAST_NAMES[Math.floor(Math.random() * AMB_LAST_NAMES.length)],
        age: 35 + Math.floor(Math.random() * 31)
    }));
    appointSelectedIndex = null;
    renderDraftBox();
}

function selectAppointCandidate(index) {
    appointSelectedIndex = appointSelectedIndex === index ? null : index;
    renderDraftBox();
}

async function executeAppointAmbassador() {
    // 1. Auth check
    await refreshRoles();
    if (!diplomaticRoles.isFM) {
        alert('Only the Foreign Minister can appoint ambassadors.');
        return;
    }

    // 2. Guard
    if (!appointTargetNation || appointSelectedIndex === null) {
        alert('Please select a target nation and candidate.');
        return;
    }

    const candidate = appointCandidates[appointSelectedIndex];
    if (!candidate) { alert('Invalid candidate selection.'); return; }

    // 3. Double-click protection
    const confirmBtns = document.querySelectorAll('.detail-btn');
    confirmBtns.forEach(btn => { if (btn.textContent.includes('Nominate')) { btn.disabled = true; btn.style.opacity = '0.5'; } });

    try {
        // 4. Check for existing ambassador (race condition prevention)
        const { data: existing } = await _supabase
            .from('ambassadors')
            .select('id')
            .eq('nation_id', currentNation.id)
            .eq('target_nation_id', appointTargetNation.id)
            .eq('is_active', true)
            .maybeSingle();
        if (existing) {
            alert('An ambassador is already active or pending for ' + appointTargetNation.name + '.');
            return;
        }

        // Check caretaker
        const coalition = await fetchActiveCoalition(_supabase, currentNation.id);
        if (coalition?.status === 'caretaker') {
            alert('Appointments are suspended during caretaker government.');
            return;
        }

        // 5. Deduct AP
        const apResult = await deductAP(_supabase, currentFaction.id, APPOINT_AMBASSADOR_AP);
        if (!apResult.success) {
            if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
            alert('Not enough AP (' + APPOINT_AMBASSADOR_AP + ' needed). Current AP: ' + (apResult.currentAp ?? '?'));
            return;
        }
        currentFaction.action_points = apResult.newAp;

        const currentTick = shardTick;

        // 7. Create confirmation bill
        let confirmationBillId = null;
        {
            const billName = 'Confirmation of ' + candidate.firstName + ' ' + candidate.lastName + ' as Ambassador to ' + appointTargetNation.name;
            const preamble = 'This motion, filed by the ' + currentFaction.faction_name + ', confirms the appointment of ' + candidate.firstName + ' ' + candidate.lastName + ' (' + candidate.partyName + ') as Ambassador to ' + appointTargetNation.name + '. A simple majority (51%) is required for confirmation.';

            const { data: nominationResult, error: nominationError } = await _supabase.rpc('create_ambassador_nomination_with_bill', {
                p_nation_id: currentNation.id,
                p_target_nation_id: appointTargetNation.id,
                p_faction_id: candidate.partyId,
                p_proposed_by: currentFaction.id,
                p_first_name: candidate.firstName,
                p_last_name: candidate.lastName,
                p_age: candidate.age,
                p_current_tick: currentTick,
                p_bill_name: billName,
                p_preamble: preamble,
                p_voting_ends_tick: currentTick + (DIPLOMACY_CONFIG.AMBASSADOR_CONFIRMATION_VOTING_TICKS || 6)
            });
            if (nominationError) throw nominationError;

            const nominationRow = Array.isArray(nominationResult) ? nominationResult[0] : nominationResult;
            if (!nominationRow?.ambassador_id || !nominationRow?.bill_id) {
                throw new Error('Ambassador nomination failed: server did not return expected IDs.');
            }
            confirmationBillId = nominationRow.bill_id;

            // Auto-cast FM's party votes on confirmation bill
            const { data: parties } = await _supabase
                .from('factions')
                .select('id, faction_name')
                .eq('nation_id', currentNation.id);
            const seatData = await loadSeats(_supabase, currentNation.id, parties || [], currentFaction.id);
            const mySeats = seatData.allPartySeats[currentFaction.id] || 0;

            if (mySeats > 0) {
                await _supabase.from('bill_support').upsert({
                    bill_id: confirmationBillId,
                    faction_id: currentFaction.id,
                    stance: 'yes',
                    seat_count: mySeats
                });
            }
            await syncVoteTallies(_supabase, confirmationBillId);
        }

        // 8. Momentum bonus
        await _supabase.rpc('adjust_momentum', { p_faction_id: candidate.partyId, p_delta: 1, p_label: 'Ambassador selected (+1)', p_tick: currentTick || 0 });

        // 9. Alert result
        const msg = candidate.firstName + ' ' + candidate.lastName + ' has been nominated as Ambassador to ' + appointTargetNation.name + '.\nA confirmation vote has been filed in Parliament.';
        alert('Ambassador Nominated\n\n' + msg + '\n\n+1 Momentum to ' + candidate.partyName + '\nCost: ' + APPOINT_AMBASSADOR_AP + ' AP');

        // 10. Reset state
        appointTargetNation = null;
        appointCandidates = [];
        appointSelectedIndex = null;
        appointTargetRelation = null;
        appointCachedExistingAmbs = null;
        activeDraftAction = null;
        activeDraftTarget = null;
        document.querySelectorAll('.action-item.is-active').forEach(el => el.classList.remove('is-active'));

        // Refresh UI
        diplomaticRoles = await detectDiplomaticRoles(currentFaction, currentNation, currentCoalition);
        const apEl = document.getElementById('diplo-ap');
        if (apEl) apEl.textContent = (currentFaction?.action_points ?? 0) + ' AP';
        await Promise.all([renderRelationsTab(), renderDraftBox()]);

    } catch (e) {
        console.error('Error appointing ambassador:', e);
        alert('Error: ' + e.message);
    }
}

let _submitMinorLock = false;
async function submitMinorInitiative() {
    if (_submitMinorLock) return;
    if (!activeDraftTarget) { alert('Please select a target nation.'); return; }
    if (!wizardName.trim()) { alert('Please enter a name for the initiative.'); return; }
    if (wizardArticles.length === 0) { alert('Please add at least one article.'); return; }

    const apCost = MINOR_INITIATIVE_CONFIG.AP_COST;

    _submitMinorLock = true;
    const submitBtn = document.querySelector('[onclick*="submitMinorInitiative"]');
    if (submitBtn) submitBtn.disabled = true;

    try {

    // Validate: hostile nations blocked
    const targetId = activeDraftTarget.id;
    const natA = currentNation.id < targetId ? currentNation.id : targetId;
    const natB = currentNation.id < targetId ? targetId : currentNation.id;
    const { data: rel } = await _supabase
        .from('diplomatic_relations')
        .select('relation_score')
        .eq('nation_a_id', natA)
        .eq('nation_b_id', natB)
        .maybeSingle();
    if (rel && rel.relation_score <= MINOR_INITIATIVE_CONFIG.HOSTILE_RELATION_THRESHOLD) {
        alert('Cannot propose diplomatic initiative to hostile nation (relations: ' + rel.relation_score + ').');
        return;
    }

    // Validate: one visa agreement per initiative
    const visaCount = wizardArticles.filter(a => a.type === 'visa_agreement').length;
    if (visaCount > 1) {
        alert('Only one Visa Agreement per initiative.');
        return;
    }

    // Validate: cultural exchange must have at least 1 programme
    for (const art of wizardArticles) {
        if (art.type === 'cultural_exchange' && (!art.config.programmes || art.config.programmes.length === 0)) {
            alert('Cultural Exchange requires at least one programme selected.');
            return;
        }
        if (art.type === 'student_exchange' && (!art.config.fields || art.config.fields.length === 0)) {
            alert('Student Exchange requires at least one field selected.');
            return;
        }
    }

    // Build proposal_data with computed effects
    const articles = wizardArticles.map((art, i) => {
        const effects = computeArticleEffects(art);
        return {
            id: art.id,
            type: art.type,
            title: art.label || INITIATIVE_ARTICLE_TYPES[art.type]?.label || art.type,
            config: art.config,
            effects: effects.summary || effects,
            proposer_effects: effects.proposer || null,
            target_effects: effects.target || null,
            status: 'active'
        };
    });

    // Compute totals for the proposal
    const totals = computeInitiativeTotals(wizardArticles);

    const proposalData = {
        name: wizardName.trim(),
        classification: 'MINOR',
        version: 2,   // v2 = rich article config format
        articles: articles,
        proposer_nation_name: currentNation.name,
        target_nation_name: activeDraftTarget.name,
        proposer_faction_id: currentFaction.id,
        totals: totals
    };

        // Deduct AP
        const apResult = await deductAP(_supabase, currentFaction.id, apCost);
        if (!apResult.success) {
            if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
            alert('Not enough AP (' + apCost + ' needed). Current AP: ' + (apResult.currentAp ?? '?'));
            return;
        }

        
        const currentTick = shardTick;

        const { error } = await _supabase.from('diplomatic_proposals').insert({
            proposing_nation_id: currentNation.id,
            target_nation_id: activeDraftTarget.id,
            proposed_by_faction_id: currentFaction.id,
            proposal_type: MINOR_INITIATIVE_CONFIG.TYPE,
            proposal_tier: MINOR_INITIATIVE_CONFIG.TIER,
            status: 'proposed',
            proposed_at_tick: currentTick,
            proposal_data: proposalData
        });

        if (error) {
            console.error('Submit error:', error);
            alert('Error submitting initiative: ' + error.message);
            return;
        }

        // Update AP display
        currentFaction.action_points = apResult.newAp;
        const apEl = document.getElementById('diplo-ap');
        if (apEl) apEl.textContent = currentFaction.action_points + ' AP';

        alert('Initiative "' + proposalData.name + '" submitted to ' + activeDraftTarget.name + '!');
        cancelDraft();
        await renderNegotiationsBox();
        await renderDiploHeader();
    } catch (err) {
        console.error('Submit minor initiative error:', err);
        alert('Error: ' + err.message);
    } finally {
        _submitMinorLock = false;
        if (submitBtn) submitBtn.disabled = false;
    }
}
window.submitMinorInitiative = submitMinorInitiative;

/**
 * Render the FM's draft panel for composing a Major Diplomatic Initiative.
 */
function renderMajorInitiativeDraftPanel(body, statusEl) {
    if (statusEl) statusEl.textContent = 'Major Diplomatic Initiative';

    // Check role: FM or HoG fallback
    const isFM = diplomaticRoles.isFM;
    const isHoG = diplomaticRoles.isHoG;
    if (!isFM && !isHoG) {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Only the Foreign Minister or Head of Government can propose Major Diplomatic Initiatives.</div></div>';
        return;
    }

    const apCost = isFM ? MAJOR_INITIATIVE_CONFIG.AP_COST : MAJOR_INITIATIVE_CONFIG.AP_COST + MAJOR_INITIATIVE_CONFIG.HOG_FALLBACK_AP_PENALTY;

    let html = '<div class="draft-panel">';

    // ── Header fields ──
    html += '<div class="draft-header">';
    html += '<div class="draft-field"><div class="draft-field-label">Action</div><div class="draft-field-input">' +
        escapeHtml(activeDraftAction.label) + ' <span style="font-family:var(--font-mono);font-size:10px;font-weight:600;color:var(--teal);">' + apCost + ' AP</span>';
    if (!isFM && isHoG) {
        html += ' <span style="font-family:var(--font-mono);font-size:9px;color:#ef4444;">(+' + MAJOR_INITIATIVE_CONFIG.HOG_FALLBACK_AP_PENALTY + ' AP: no FM)</span>';
    }
    html += '</div></div>';

    // Target nation — dropdown of all other nations (FM isn't restricted to ambassador postings)
    html += '<div class="draft-field"><div class="draft-field-label">Target</div>' +
        '<select class="selector-dropdown" onchange="selectMajorInitiativeTarget(this.value)">' +
        '<option value="">Select nation...</option>';
    cachedOtherNations.forEach(n => {
        const sel = activeDraftTarget && activeDraftTarget.id === n.id ? ' selected' : '';
        html += '<option value="' + n.id + '"' + sel + '>' + escapeHtml(n.name) + '</option>';
    });
    html += '</select></div>';

    // Initiative name
    html += '<div class="draft-field"><div class="draft-field-label">Name</div>' +
        '<input type="text" id="major-initiative-name-input" class="draft-field-input" ' +
        'placeholder="e.g. ' + escapeHtml((currentNation?.name || '') + '-' + (activeDraftTarget?.name || '') + ' Comprehensive Partnership') + '" ' +
        'value="' + escapeHtml(wizardName) + '" oninput="setWizardName(this.value)" ' +
        'style="border:1px solid var(--border-subtle);background:var(--bg-3);color:var(--text-primary);padding:6px 10px;font-family:var(--font-sans);font-size:12px;width:100%;"></div>';
    html += '</div>';

    // ── Articles section ──
    html += '<div class="draft-articles" style="flex:1;overflow-y:auto;padding:10px 14px;">';
    if (wizardArticles.length === 0) {
        html += '<div class="empty-state" style="padding:20px 0;"><div class="empty-state-text">No articles added yet.<br>Use the selector below to add articles.</div></div>';
    } else {
        wizardArticles.forEach((art, i) => {
            html += renderInitiativeArticleCard(art, i, true);
        });
    }
    html += '</div>';

    // ── Article selector ──
    html += '<div class="article-selector">';
    html += '<select class="selector-dropdown" id="major-initiative-article-selector">';
    html += '<option value="">Add article...</option>';
    for (const [key, typeInfo] of Object.entries(MAJOR_INITIATIVE_ARTICLE_TYPES)) {
        if (typeInfo.max_per_initiative) {
            const count = wizardArticles.filter(a => a.type === key).length;
            if (count >= typeInfo.max_per_initiative) continue;
        }
        html += '<option value="' + key + '">' + escapeHtml(typeInfo.label) + '</option>';
    }
    html += '</select>';
    html += '<button class="btn btn--primary btn--sm" onclick="addMajorInitiativeArticle()">Add</button>';
    html += '</div>';

    // ── Cost summary for major initiatives ──
    if (wizardArticles.length > 0) {
        const costSummary = computeMajorInitiativeCosts(wizardArticles);
        html += '<div style="padding:4px 14px;font-family:var(--font-mono);font-size:9px;color:var(--text-2);border-top:1px solid var(--border-hair);">';
        html += 'Ratification cost: <span style="color:#ef4444;">$' + (costSummary.ratification / 1e6).toFixed(0) + 'M</span> each · ';
        html += 'Ongoing: <span style="color:#ef4444;">$' + (costSummary.ongoing / 1e6).toFixed(0) + 'M/yr</span> each · ';
        html += 'Requires bilateral parliamentary ratification (' + MAJOR_INITIATIVE_CONFIG.RATIFICATION_VOTING_TICKS + ' ticks)';
        html += '</div>';
    }

    // ── Action bar ──
    const articleCount = wizardArticles.length;
    const hasEnoughAP = (currentFaction?.action_points ?? 0) >= apCost;
    const canSend = articleCount > 0 && activeDraftTarget && wizardName.trim() && hasEnoughAP;

    html += '<div class="action-bar">';
    html += '<span class="action-bar-info">' + articleCount + ' article' + (articleCount !== 1 ? 's' : '') + ' / Major / Tier 3</span>';
    html += '<div class="action-bar-spacer"></div>';
    html += '<button class="btn btn--dim" onclick="cancelDraft()">Cancel</button>';
    html += '<button class="btn btn--send' + (canSend ? '' : '" disabled') + '" onclick="submitMajorInitiative()"' +
        (!canSend ? ' title="' + (!activeDraftTarget ? 'Select a target nation' : articleCount === 0 ? 'Add at least one article' : !wizardName.trim() ? 'Enter an initiative name' : 'Not enough AP (' + apCost + ' required)') + '"' : '') +
        '>Send Initiative (' + apCost + ' AP)</button>';
    html += '</div>';

    html += '</div>';
    body.innerHTML = html;
}

/**
 * Compute combined costs across major initiative articles.
 */
function computeMajorInitiativeCosts(articles) {
    let ratification = 0, ongoing = 0;
    for (const art of articles) {
        if (art.status === 'struck') continue;
        const effects = computeArticleEffects(art);
        if (effects.costs) {
            ratification += effects.costs.ratification_proposer || 0;
            ongoing += effects.costs.ongoing_per_year || 0;
        }
    }
    return { ratification, ongoing };
}

        type: typeKey,

/**
 * Submit a Major Diplomatic Initiative.
 */
let _submitMajorLock = false;
async function submitMajorInitiative() {
    if (_submitMajorLock) return;
    if (!activeDraftTarget) { alert('Please select a target nation.'); return; }
    if (!wizardName.trim()) { alert('Please enter a name for the initiative.'); return; }
    if (wizardArticles.length === 0) { alert('Please add at least one article.'); return; }

    _submitMajorLock = true;
    const submitBtn = document.querySelector('[onclick*="submitMajorInitiative"]');
    if (submitBtn) submitBtn.disabled = true;

    try {

    const isFM = diplomaticRoles.isFM;
    const apCost = isFM ? MAJOR_INITIATIVE_CONFIG.AP_COST : MAJOR_INITIATIVE_CONFIG.AP_COST + MAJOR_INITIATIVE_CONFIG.HOG_FALLBACK_AP_PENALTY;

    // Validate: hostile nations blocked
    const targetId = activeDraftTarget.id;
    const natA = currentNation.id < targetId ? currentNation.id : targetId;
    const natB = currentNation.id < targetId ? targetId : currentNation.id;
    const { data: rel } = await _supabase
        .from('diplomatic_relations')
        .select('relation_score')
        .eq('nation_a_id', natA)
        .eq('nation_b_id', natB)
        .maybeSingle();
    if (rel && rel.relation_score <= MAJOR_INITIATIVE_CONFIG.HOSTILE_RELATION_THRESHOLD) {
        alert('Cannot propose diplomatic initiative to hostile nation (relations: ' + rel.relation_score + ').');
        return;
    }

    // Validate: extradition must have at least 1 scope
    for (const art of wizardArticles) {
        if (art.type === 'mutual_extradition' && (!art.config.scope || art.config.scope.length === 0)) {
            alert('Mutual Extradition Treaty requires at least one scope selected.');
            return;
        }
    }

    // Build proposal_data with computed effects
    const articles = wizardArticles.map((art, i) => {
        const effects = computeArticleEffects(art);
        return {
            id: art.id,
            type: art.type,
            title: art.label || MAJOR_INITIATIVE_ARTICLE_TYPES[art.type]?.label || art.type,
            config: art.config,
            effects: effects.summary || effects,
            proposer_effects: effects.proposer || null,
            target_effects: effects.target || null,
            costs: effects.costs || null,
            compliance: effects.compliance || null,
            warnings: effects.warnings || null,
            status: 'active'
        };
    });

    const totals = computeInitiativeTotals(wizardArticles);
    const costSummary = computeMajorInitiativeCosts(wizardArticles);

    const proposalData = {
        name: wizardName.trim(),
        classification: 'MAJOR',
        version: 2,
        articles: articles,
        proposer_nation_name: currentNation.name,
        target_nation_name: activeDraftTarget.name,
        proposer_faction_id: currentFaction.id,
        totals: totals,
        costs: costSummary,
        duration_years: 5
    };

    try {
        const apResult = await deductAP(_supabase, currentFaction.id, apCost);
        if (!apResult.success) {
            if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
            alert('Not enough AP (' + apCost + ' needed). Current AP: ' + (apResult.currentAp ?? '?'));
            return;
        }

        
        const currentTick = shardTick;

        const { error } = await _supabase.from('diplomatic_proposals').insert({
            proposing_nation_id: currentNation.id,
            target_nation_id: activeDraftTarget.id,
            proposed_by_faction_id: currentFaction.id,
            proposal_type: MAJOR_INITIATIVE_CONFIG.TYPE,
            proposal_tier: MAJOR_INITIATIVE_CONFIG.TIER,
            status: 'proposed',
            proposed_at_tick: currentTick,
            proposal_data: proposalData
        });

        if (error) {
            console.error('Submit error:', error);
            alert('Error submitting initiative: ' + error.message);
            return;
        }

        currentFaction.action_points = apResult.newAp;
        const apEl = document.getElementById('diplo-ap');
        if (apEl) apEl.textContent = currentFaction.action_points + ' AP';

        alert('Major Initiative "' + proposalData.name + '" submitted to ' + activeDraftTarget.name + '!\nThis will require bilateral parliamentary ratification.');
        cancelDraft();
        await renderNegotiationsBox();
        await renderDiploHeader();
    } catch (err) {
        console.error('Submit major initiative error:', err);
        alert('Error: ' + err.message);
    }

    } finally {
        _submitMajorLock = false;
        const btn = document.querySelector('[onclick*="submitMajorInitiative"]');
        if (btn) btn.disabled = false;
    }
}

/**
 * Shared helper: fetch org + members, build the preview HTML.
 * Returns { org, members, headerHtml } or null if org not found.
 */
async function buildOrgPreviewData(orgId) {
    const [orgResult, membersResult] = await Promise.all([
        _supabase.from('international_orgs').select('*').eq('id', orgId).single(),
        _supabase.from('ipo_members')
            .select('id, faction_id, role, factions:faction_id ( id, faction_name, nation_id )')
            .eq('org_id', orgId)
            .eq('is_active', true)
    ]);

    const org = orgResult.data;
    if (!org) return null;

    const members = membersResult.data || [];
    const charter = org.charter || {};
    const description = org.description || charter.description || 'No description provided.';

    // Fetch nation names for members
    const nationIds = [...new Set(members.map(m => m.factions?.nation_id).filter(Boolean))];
    const nationMap = {};
    if (nationIds.length > 0) {
        const { data: nations } = await _supabase.from('nations').select('id, name').in('id', nationIds);
        (nations || []).forEach(n => { nationMap[n.id] = n.name; });
    }

    const presidentMember = members.find(m => m.faction_id === org.president_id);
    const presidentName = presidentMember?.factions?.faction_name || 'Unknown';

    const memberRows = members.map(m => {
        const f = m.factions;
        if (!f) return '';
        const nation = nationMap[f.nation_id] || '';
        const isMemberPres = m.faction_id === org.president_id;
        const role = isMemberPres ? '\u2605 President' : m.role === 'observer' ? 'Observer' : 'Member';
        const roleClass = isMemberPres ? 'ipo-preview-member-role ipo-preview-member-role--president' : 'ipo-preview-member-role';
        return '<div class="ipo-preview-member"><span class="ipo-preview-member-name">' + escapeHtml(f.faction_name) + '</span>'
            + (nation ? '<span class="ipo-preview-member-nation"> · ' + escapeHtml(nation) + '</span>' : '')
            + '<span class="' + roleClass + '">' + role + '</span></div>';
    }).join('');

    const headerHtml = `
        <div class="ipo-preview-header">
            ${renderIPOLogo(org, 'ipo-header-logo', '')}
            <div class="ipo-preview-header-info">
                <div class="ipo-header-name">${escapeHtml(org.name)}</div>
                <div class="ipo-header-meta">
                    <span>${members.length} member${members.length !== 1 ? 's' : ''}</span>
                    <span>President: ${escapeHtml(presidentName)}</span>
                    <span>Est. Tick ${org.founded_at_tick}</span>
                </div>
            </div>
        </div>
        <div class="ipo-preview-desc">${escapeHtml(description)}</div>
        <div class="ipo-preview-section-label">Members</div>
        <div class="ipo-preview-members">${memberRows || '<div style="color:var(--text-dim);font-size:12px;">No members.</div>'}</div>`;

    return { org, members, headerHtml };
}

/**
 * Request to join an organisation. Creates a membership vote based on charter rules.
 */
async function requestToJoinOrg(orgId) {
    if (_ipoActionLock) return;
    _ipoActionLock = true;

    try {
        const { data: org } = await _supabase
            .from('international_orgs')
            .select('id, name, charter, president_id')
            .eq('id', orgId)
            .single();
        if (!org) { alert('Organisation not found.'); return; }

        const admission = org.charter?.membership?.admission || 'vote';

        // Duplicate guard — prevent double-submission
        const { data: existingVote } = await _supabase
            .from('ipo_votes')
            .select('id')
            .eq('org_id', orgId)
            .eq('vote_type', 'membership')
            .eq('status', 'open')
            .eq('proposed_by', currentFaction.id)
            .limit(1)
            .maybeSingle();
        if (existingVote) { alert('You already have a pending join request for this organisation.'); return; }

        // Determine requested role from charter (default: member)
        const requestedRole = org.charter?.membership?.joinRequestRole || 'member';

        // Check open vote limit
        if (!await _checkOpenVoteLimit(orgId)) {
            alert(`This organisation already has ${IPO_MAX_OPEN_VOTES} open votes. Please try again later.`);
            return;
        }

        if (admission === 'vote') {
            // Create a membership vote for existing members to decide
            const { error: voteErr } = await _supabase.from('ipo_votes').insert({
                org_id: orgId,
                title: `Admit ${currentFaction.faction_name} as ${requestedRole}`,
                vote_type: 'membership',
                meta: {
                    target_faction_id: currentFaction.id,
                    target_faction_name: currentFaction.faction_name,
                    requested_role: requestedRole,
                    join_request: true
                },
                status: 'open',
                opened_at_tick: shardTick,
                closes_at_tick: shardTick + IPO_VOTE_DURATION,
                proposed_by: currentFaction.id
            });
            if (voteErr) { console.error('[IPO] Vote insert failed:', voteErr.message); alert('Failed to create join request. You may not have permission.'); return; }

            const { error: chatErr } = await _supabase.from('ipo_chat').insert({
                org_id: orgId,
                faction_id: null,
                is_system: true,
                message_text: `${currentFaction.faction_name} has requested to join as ${requestedRole}. A membership vote has been opened.`,
                tick_posted: shardTick
            });
            if (chatErr) console.error('[IPO] Chat insert failed:', chatErr.message);

            alert('Your request has been submitted. The organisation will vote on your membership.');
        } else {
            // President-decides admission — auto-generate a vote for president to review
            const { error: voteErr } = await _supabase.from('ipo_votes').insert({
                org_id: orgId,
                title: `Admit ${currentFaction.faction_name} as ${requestedRole}`,
                vote_type: 'membership',
                meta: {
                    target_faction_id: currentFaction.id,
                    target_faction_name: currentFaction.faction_name,
                    requested_role: requestedRole,
                    join_request: true,
                    president_decides: true
                },
                status: 'open',
                opened_at_tick: shardTick,
                closes_at_tick: shardTick + IPO_VOTE_DURATION,
                proposed_by: currentFaction.id
            });
            if (voteErr) { console.error('[IPO] Vote insert failed:', voteErr.message); alert('Failed to create join request. You may not have permission.'); return; }

            const { error: chatErr } = await _supabase.from('ipo_chat').insert({
                org_id: orgId,
                faction_id: null,
                is_system: true,
                message_text: `${currentFaction.faction_name} has requested to join as ${requestedRole}. The President will decide on admission.`,
                tick_posted: shardTick
            });
            if (chatErr) console.error('[IPO] Chat insert failed:', chatErr.message);

            alert('Your request has been submitted. The President will decide on your admission.');
        }

        // Refresh the preview to show "Request Pending" state
        await previewExistingOrg(orgId);
    } catch (e) {
        console.error('[IPO] Request to join error:', e);
        alert('Failed to submit join request.');
    } finally {
        _ipoActionLock = false;
    }
}
