                        lineLabel = c.status;
                    }
                    const priorityChip = c.delivery_priority
                        ? `<span style="font-family:var(--font-mono);font-size:7px;letter-spacing:0.5px;text-transform:uppercase;color:var(--text-dim);padding:1px 5px;border:1px solid var(--border-main);">${escapeHtml(c.delivery_priority)}</span>`
                        : '';
                    html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;font-family:var(--font-mono);font-size:10px;">
                        <span style="color:${lineColor};">${escapeHtml(lineLabel)}</span>
                        ${priorityChip}
                    </div>`;
                    // MoT-only pending bid review (20270238 + 20270388 +
                    // 20270389). Empty string for non-ministers; the
                    // loader leaves the bucket empty for them.
                    html += _renderMinisterBidReview(c.id);
                }
                html += `</div>`;
            }

            if (ag.status === 'active' && nationId && (ag.nation_a_id === nationId || ag.nation_b_id === nationId)) {
                html += `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border-main);text-align:right;">
                    <button data-action="withdraw-ag" data-ag-id="${ag.id}" style="font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:1px;color:#c55;background:rgba(197,85,85,0.08);border:1px solid rgba(197,85,85,0.35);padding:6px 16px;cursor:pointer;text-transform:uppercase;">Withdraw</button>
                </div>`;
            }

            html += `</div>`;
        }

        html += `</div>`;
    }

    html += `</div>`;

    left.innerHTML = html;

    // Click handler for expand/collapse + withdraw + MoT bid actions
    left.onclick = (e) => {
        const wbtn = e.target.closest('[data-action="withdraw-ag"]');
        if (wbtn) {
            e.stopPropagation();
            withdrawTradeAgreement(wbtn.dataset.agId);
            return;
        }
        const accept = e.target.closest('[data-action="accept-bid"]');
        if (accept && !accept.disabled) {
            e.stopPropagation();
            setMinisterBidAction(accept.dataset.bidId, 'accept');
            return;
        }
        const reject = e.target.closest('[data-action="reject-bid"]');
        if (reject && !reject.disabled) {
            e.stopPropagation();
            setMinisterBidAction(reject.dataset.bidId, 'reject');
            return;
        }
        const row = e.target.closest('.tr-agreement-row');
        if (!row) return;
        const agId = row.dataset.agId;
        _tradeExpandedAgreement = _tradeExpandedAgreement === agId ? null : agId;
        renderTradeAgreements();
    };
}

// Accept (force-award) or Reject (veto) a single shipping bid. Both
// RPCs are MoT-only and SECURITY DEFINER (20270238 / 20270389), so
// there's no client-side gate to run. The two flags are server-side
// mutex: accepting clears any prior veto and vice versa. Re-loads the
// minister bid bucket so the row re-renders without a full page
// refresh. A single in-flight flag prevents double-fire — adequate for
// one-action-at-a-time interaction.
let _ministerBidInflight = false;
async function setMinisterBidAction(bidId, action) {
    if (_ministerBidInflight || !bidId) return;
    _ministerBidInflight = true;
    try {
        const result = action === 'accept'
            ? await _supabase.rpc('accept_shipping_bid', { p_bid_id: bidId, p_accepted: true })
            : await _supabase.rpc('veto_shipping_bid',   { p_bid_id: bidId, p_vetoed: true });
        if (result.error) throw result.error;
        if (!result.data || !result.data.success) {
            alert('Could not ' + action + ' bid: ' + (result.data?.reason || 'unknown'));
            return;
        }
        await loadMinisterBids();
        renderTradeAgreements();
    } catch (err) {
        console.error('[diplomacy] minister bid action failed:', err);
        alert('Could not ' + action + ' bid: ' + (err?.message || err));
    } finally {
        _ministerBidInflight = false;
    }
}

// Withdraw from an active trade agreement. The cancel_trade_agreement
// RPC (SECURITY DEFINER) sets status='withdrawn' (the 20260621 trigger
// then cancels the spawned shipping contracts), emits the Politics
// Nation/World dispatch, and files the shipping corp's Pressing Issue
// — atomically. Single source of truth: all consequence logic lives
// in the RPC; this only gates + calls + refreshes.
let _withdrawAgInflight = false;
async function withdrawTradeAgreement(agId) {
    if (_withdrawAgInflight) return;
    const ag = (_tradeAgreementsList || []).find(a => a.id === agId);
    if (!ag) return;
    const actingId = _worldState?.nation?.id;
    if (ag.status !== 'active') { alert('This agreement is no longer active.'); return; }
    if (!actingId || (ag.nation_a_id !== actingId && ag.nation_b_id !== actingId)) {
        alert('Only a signatory nation can withdraw from this agreement.');
        return;
    }
    const agName = ag.agreement_name || 'this trade agreement';
    if (!confirm(`Withdraw from "${agName}"?\n\nThis ends the agreement immediately and stops trading these resources. Shipping contracts under it are cancelled. This cannot be undone.`)) return;

    _withdrawAgInflight = true;
    try {
        const { data, error } = await _supabase.rpc('cancel_trade_agreement', {
            p_agreement_id: agId,
            p_by_nation_id: actingId,
        });
        if (error) { alert('Failed to withdraw: ' + error.message); return; }
        if (data && data.success === false) {
            alert(data.error || 'Failed to withdraw from this agreement.');
        } else {
            alert(`Withdrawn from "${agName}".`);
        }
        loadTradeAgreements().then(() => { renderTradeAgreements(); renderTradePartners(); }).catch(() => {});
    } finally {
        _withdrawAgInflight = false;
    }
}

// ── All-nations trade flow data for partner analysis ──
let _allNationFlows = {}; // nationId → { sector → { export_capacity, import_demand } }

async function loadAllNationFlows() {
    // Phase 10A: trade_flows table dropped. computeCompatibility +
    // getNationSurplusesAndDeficits fall through to "no overlap" with
    // an empty map until the goods-trade rebuild lands.
    _allNationFlows = {};
}

function computeCompatibility(myNationId, theirNationId) {
    const myFlows = _allNationFlows[myNationId] || {};
    const theirFlows = _allNationFlows[theirNationId] || {};
    let matchScore = 0;
    let totalSectors = 0;

    for (const sector of Object.keys({ ...myFlows, ...theirFlows })) {
        if (sector === 'food_agriculture' && (myFlows.grains_staples || theirFlows.grains_staples)) continue;
        const myBal = Number(myFlows[sector]?.net_flow) || 0;
        const theirBal = Number(theirFlows[sector]?.net_flow) || 0;
        totalSectors++;
        // Complementary: we have surplus + they have deficit (or vice versa)
        if ((myBal > 0 && theirBal < 0) || (myBal < 0 && theirBal > 0)) {
            matchScore += Math.min(Math.abs(myBal), Math.abs(theirBal));
        }
    }
    if (totalSectors === 0) return 0;
    // Normalize to 0-100 scale based on total trade volume
    const totalVol = Object.values(myFlows).reduce((s, f) => s + (f.export_capacity || 0) + (f.import_demand || 0), 0) || 1;
    return Math.min(99, Math.round((matchScore / totalVol) * 200));
}

// Signed trading volumes per commodity, from MY nation's perspective.
//   positive = net importer of this commodity from active agreements
//   negative = net exporter
//
// Used by both the Trade-tab commodity table and the negotiation modal's
// "Your Economy" panel so net = prod − dem + trading is computed from
// the same source on both surfaces. Previously only Energy had a helper
// (getEnergyTradingVolume), and the modal didn't apply trading at all
// — Energy net could disagree between the two screens, and no other
// commodity ever reflected its trade agreements.
//
// Returns a plain object keyed by commodity (same keys as
// _computeStatCommodities: energy / minerals / food / consumer_goods /
// luxury_goods). Missing keys default to 0.
//
// Energy keeps the Phase-4 shipping-contract delivered-volume override
// (sum of actively delivered units/tick across all carriers wins over the
// agreement's stated volume). Other commodities use the article's stated
// volume directly — they have no per-commodity logistics override today.
function getTradingVolumesByCommodity() {
    const out = { energy: 0, minerals: 0, food: 0, consumer_goods: 0, luxury_goods: 0 };
    const myId = _worldState?.nation?.id;
    if (!myId) return out;
    const active = (_tradeAgreementsList || []).filter(a => a.status === 'active');
    for (const ag of active) {
        const partnerId = ag.nation_a_id === myId ? ag.nation_b_id : ag.nation_a_id;
        if (!partnerId) continue;
        const shipNeed = _shippingNeedForPartner(partnerId) || { needsShipping: true };
        // Logistics-in-place: legacy shipping_routes (organic) OR a
        // Phase 4 awarded shipping_contracts row tied to this agreement.
        // Phase 7: _shippingContractsByAgreement now carries all statuses
        // (open / awarded / completed / cancelled) for the agreement card
        // surfacing — filter to 'awarded' here so the Trading column
        // only counts contracts that are actually delivering Energy.
        const hasLegacyLogistics = !!getAgreementShippingInfo(ag.id)?.hasLogistics;
        const phase4Contracts    = (_shippingContractsByAgreement[ag.id] || [])
            .filter(isShippingContractActive);
        const hasPhase4Logistics = phase4Contracts.length > 0;
        const shippingOk = !shipNeed.needsShipping || hasLegacyLogistics || hasPhase4Logistics;
        if (!shippingOk) continue;

        for (const art of (ag.articles || [])) {
            if (art.article_type !== 'trade_flow') continue;
            const d = art.data || {};
            const commodity = d.commodity;
            if (!commodity || !(commodity in out)) continue;

            const statedVolume = Number(d.volume) || 0;
            if (statedVolume <= 0) continue;

            // Phase 4 shipping contracts only override Energy volume —
            // their actual per-tick delivery (multi-winner sum, or the
            // legacy single-winner full-volume) takes precedence over the
            // article's stated volume. Other commodities have no override.
            let volume = statedVolume;
            if (commodity === 'energy' && hasPhase4Logistics) {
                volume = phase4Contracts.reduce((s, c) => s + shippingContractDeliveredPerTick(c), 0);
            }
            if (volume <= 0) continue;

            // Resolve buyer/seller relative to MY nation. direction is
            // author-relative \u2014 author is partyA, the other party is partyB.
            const authorIsMe = art.author_nation_id
                ? art.author_nation_id === myId
                : (ag.nation_a_id === myId);
            const partyAId = authorIsMe ? myId : partnerId;
            const buyerNationId = d.direction === 'a_buys_b' ? partyAId : (authorIsMe ? partnerId : myId);
            if (buyerNationId === myId) out[commodity] += volume;
            else                        out[commodity] -= volume;
        }
    }
    return out;
}

// Compute a nation's Energy production / demand / net using the same
// formula as the YOUR ECONOMY panel. Stat-based, not dollar.
//   Production = energy / 3
//   Demand     = ((infrastructure + industry) \u00D7 standard_of_living
//                 \u00D7 \u221Apopulation_M) / 3500
function getNationEnergyBalance(nation) {
    const n = nation || {};
    const energyStat   = Number(n.energy)             || 0;
    const infraStat    = Number(n.infrastructure)     || 0;
    const industryStat = Number(n.industry)           || 0;
    const solStat      = Number(n.standard_of_living) || 0;
    const popMillions  = (Number(n.population) || 0) / 1_000_000;
    const production   = energyStat / 3;
    const demand       = ((infraStat + industryStat) * solStat * Math.sqrt(popMillions)) / 3500;
    return { production, demand, net: production - demand };
}

// Same shape for Minerals \u2014 mirrors the YOUR ECONOMY panel:
//   Production = (minerals / 3) \u00D7 ((unskilled + industry) / 200)
//   Demand     = (infrastructure / 10) + (industry / 16)
function getNationMineralsBalance(nation) {
    const n = nation || {};
    const mineralsStat  = Number(n.minerals)       || 0;
    // Mining is unskilled extraction labour.
    const unskilledStat = Number(n.unskilled_workers) || 0;
    const industryStat  = Number(n.industry)       || 0;
    const infraStat     = Number(n.infrastructure) || 0;
    const production    = (mineralsStat / 3) * ((unskilledStat + industryStat) / 200);
    const demand        = (infraStat / 10) + (industryStat / 16);
    return { production, demand, net: production - demand };
}

// Same shape for Food \u2014 mirrors the YOUR ECONOMY panel:
//   Production = (farmland / 2) \u00D7 (unskilled / 100)
//   Demand     = population_M / 3
function getNationFoodBalance(nation) {
    const n = nation || {};
    const farmlandStat  = Number(n.farmland)  || 0;
    // Agriculture runs on the unskilled tier.
    const unskilledStat = Number(n.unskilled_workers) || 0;
    const popMillions   = (Number(n.population) || 0) / 1_000_000;
    const production    = (farmlandStat / 2) * (unskilledStat / 100);
    const demand        = popMillions / 3;
    return { production, demand, net: production - demand };
}

// Same shape for Consumer Goods \u2014 mirrors the YOUR ECONOMY panel:
//   Production = (industry / 3) \u00D7 (unskilled / 100)
//   Demand     = (standard_of_living / 100) \u00D7 population_M / 2
function getNationConsumerGoodsBalance(nation) {
    const n = nation || {};
    const industryStat  = Number(n.industry)           || 0;
    // Mass-production manufacturing is unskilled labour.
    const unskilledStat = Number(n.unskilled_workers) || 0;
    const solStat       = Number(n.standard_of_living) || 0;
    const popMillions   = (Number(n.population) || 0) / 1_000_000;
    const production    = (industryStat / 3) * (unskilledStat / 100);
    const demand        = (solStat / 100) * popMillions / 2;
    return { production, demand, net: production - demand };
}

// Same shape for Luxury Goods \u2014 mirrors the YOUR ECONOMY panel:
//   Production = (standard_of_living / 6) \u00D7 ((education \u00D7 service_sector) / 10000)
//   Demand     = (standard_of_living / 100)\u00B2 \u00D7 population_M
function getNationLuxuryGoodsBalance(nation) {
    const n = nation || {};
    const solStat       = Number(n.standard_of_living) || 0;
    const educationStat = Number(n.education)          || 0;
    const serviceStat   = Number(n.service_sector)     || 0;
    const popMillions   = (Number(n.population) || 0) / 1_000_000;
    const production    = (solStat / 6) * ((educationStat * serviceStat) / 10000);
    const demand        = Math.pow(solStat / 100, 2) * popMillions;
    return { production, demand, net: production - demand };
}

// Build a nation's surplus / deficit list. Energy + Minerals + Food are
// the tradeable commodities right now, all stat-derived.
function getNationSurplusesAndDeficits(nationId) {
    const nation = (_worldAllNations || []).find(n => n.id === nationId);
    const surpluses = [];
    const deficits = [];

    const goods = [
        { sector: 'energy',   icon: '\u26A1', name: 'Energy',   balance: getNationEnergyBalance(nation)   },
        { sector: 'minerals', icon: '\u26CF', name: 'Minerals', balance: getNationMineralsBalance(nation) },
        { sector: 'food',           icon: '\uD83C\uDF3E', name: 'Food',           balance: getNationFoodBalance(nation)           },
        { sector: 'consumer_goods', icon: '\uD83D\uDCE6', name: 'Consumer Goods', balance: getNationConsumerGoodsBalance(nation) },
        { sector: 'luxury_goods',   icon: '\uD83D\uDC8E', name: 'Luxury Goods',   balance: getNationLuxuryGoodsBalance(nation)   },
    ];
    for (const g of goods) {
        const net = g.balance.net;
        if (net === 0) continue;
        const entry = {
            sector:    g.sector,
            icon:      g.icon,
            name:      g.name,
            amount:    Math.abs(net),
            statBased: true,
        };
        if (net > 0) surpluses.push(entry);
        else         deficits.push(entry);
    }

    return { surpluses, deficits };
}

let _tradeExpandedNation = null;
let _tradePartnerSort = 'compatibility';

function renderTradePartners() {
    const right = document.getElementById('trade-right');
    if (!right) return;
    const myNationId = _worldState?.nation?.id;
    if (!myNationId) { right.innerHTML = ''; return; }

    const nations = (_worldAllNations || []).filter(n => n.id !== myNationId);
    const relations = _worldRelations || [];

    // Compute compatibility for each nation
    const partnerData = nations.map(n => {
        const compat = computeCompatibility(myNationId, n.id);

        // Diplomatic relation
        const a = myNationId < n.id ? myNationId : n.id;
        const b = myNationId < n.id ? n.id : myNationId;
        const rel = relations.find(r => r.nation_a_id === a && r.nation_b_id === b);
        const relScore = rel ? Number(rel.relation_score ?? 0) : 0;
        let relLabel = 'Neutral';
        if (relScore >= 60) relLabel = 'Friendly';
        else if (relScore >= 30) relLabel = 'Warm';
        else if (relScore >= -10) relLabel = 'Neutral';
        else if (relScore >= -40) relLabel = 'Cold';
        else relLabel = 'Hostile';

        return { ...n, compat, relLabel, relScore };
    });

    // Sort
    if (_tradePartnerSort === 'compatibility') {
        partnerData.sort((a, b) => b.compat - a.compat);
    } else {
        partnerData.sort((a, b) => a.name.localeCompare(b.name));
    }

    const RELATION_COLORS = { Friendly: 'var(--green)', Warm: 'var(--green)', Neutral: 'var(--blue)', Cold: 'var(--blue)', Hostile: 'var(--red)' };
    const filterComm = _tradeCommodityFilter;

    // Header
    let html = `<div class="tr-panel" style="padding:8px 14px;display:flex;justify-content:space-between;align-items:center;">
        <div style="display:flex;align-items:center;gap:8px;">
            <span class="tr-panel-title">TRADE PARTNERS</span>`;
    if (filterComm) {
        html += `<div style="display:flex;align-items:center;gap:4px;padding:2px 8px;background:var(--bg-card);border:1px solid var(--border-main);">
            <span style="font-size:9px;">${TRADE_SECTOR_ICONS[filterComm] || ''}</span>
            <span style="font-family:var(--font-mono);font-size:8px;color:var(--text-bright);">${escapeHtml(TRADE_SECTOR_LABELS[filterComm] || filterComm)}</span>
            <span class="tr-filter-clear" style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);cursor:pointer;margin-left:4px;">\u2715</span>
        </div>`;
    }
    html += `</div>
        <div style="display:flex;gap:3px;">
            <span style="font-family:var(--font-mono);font-size:7px;color:var(--text-dim);margin-right:4px;">SORT:</span>
            <div class="tr-sort-btn${_tradePartnerSort === 'compatibility' ? ' active' : ''}" data-sort="compatibility">COMPATIBILITY</div>
            <div class="tr-sort-btn${_tradePartnerSort === 'name' ? ' active' : ''}" data-sort="name">NAME</div>
        </div>
    </div>`;

    // Nation cards
    for (const n of partnerData) {
        const relColor = RELATION_COLORS[n.relLabel] || 'var(--text-dim)';
        const isExp = _tradeExpandedNation === n.id;
        const { surpluses, deficits } = getNationSurplusesAndDeficits(n.id);

        // Commodity filter matching
        let hasMatch = true;
        let matchType = null;
        if (filterComm) {
            const myFlow = _tradeFlows[filterComm];
            const myBal = Number(myFlow?.net_flow) || 0;
            const theyNeed = deficits.find(d => d.sector === filterComm);
            const theyHave = surpluses.find(s => s.sector === filterComm);
            if (myBal > 0 && theyNeed) matchType = 'export';
            else if (myBal < 0 && theyHave) matchType = 'import';
            else hasMatch = false;
        }

        const compatColor = n.compat >= 75 ? 'var(--green)' : n.compat >= 50 ? 'var(--amber)' : 'var(--orange)';
        const flagSrc = n.flag_url || `assets/flags/${n.name}.png`;
        const initials = n.name.slice(0, 2).toUpperCase();
        const pop = Number(n.population || 0);
        const popLabel = pop >= 1e6 ? (pop / 1e6).toFixed(1) + 'M' : pop.toLocaleString();

        html += `<div class="tr-partner-card${isExp ? ' expanded' : ''}" data-nation="${n.id}" style="opacity:${filterComm && !hasMatch ? '0.3' : '1'};border-color:${isExp ? relColor + '44' : ''};">
            <div class="tr-partner-header">
                <div style="display:flex;align-items:center;gap:10px;">
                    <img src="${escapeHtml(flagSrc)}" alt="" style="width:36px;height:24px;object-fit:cover;border:1px solid var(--border-main);" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">

                    <div>

            const mySurpluses = Object.entries(_tradeFlows).filter(([, f]) => (f.export_capacity || 0) > (f.import_demand || 0)).map(([k]) => k);

            html += `<div style="border-top:1px solid var(--border-main);">

                        <div style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--teal);margin-bottom:6px;display:flex;align-items:center;gap:5px;"><span style="width:7px;height:7px;background:var(--teal);"></span>THEY CAN OFFER</div>`;
            for (const s of surpluses.slice(0, 6)) {
                const isWeNeed = myDeficits.includes(s.sector);
                const amountDisplay = s.statBased ? Number(s.amount).toFixed(0) : fmtBudgetCurrency(s.amount);

                html += `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(42,42,36,0.15);">

            // Active trade agreements with this partner
            const partnerAgreements = (_tradeAgreementsList || []).filter(ag =>

                    html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(42,42,36,0.1);">

                            <span class="tr-badge" style="font-size:7px;color:var(--green);background:rgba(92,204,92,0.06);border-color:rgba(92,204,92,0.15);">ACTIVE</span>
                        </div>
                        <span style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);">${durLabel}</span>
                    </div>`;
                }
                html += '</div>';
            }

            // Action buttons — check for ongoing negotiation with this partner
            const hasOngoingNeg = _tradeNegotiationsList.some(neg =>
                (neg.nation_a_id === n.id || neg.nation_b_id === n.id));
            const tradeBtn = hasOngoingNeg
                ? `<div class="tr-action-btn tr-action-btn--primary" onclick="event.stopPropagation();openTradeNegModal('${n.id}');">TRADE DISCUSSIONS</div>`
                : `<div class="tr-action-btn tr-action-btn--primary" onclick="event.stopPropagation();openTradeNegModal('${n.id}');">DRAFT TRADE AGREEMENT</div>`;
            html += `<div style="padding:10px 18px;border-top:1px solid var(--border-main);background:var(--bg-card);display:flex;justify-content:flex-end;gap:6px;">
                <div class="tr-action-btn" onclick="event.stopPropagation();selectWorldNation('${n.id}');_diploActiveSubtab='world';renderDiploSubtabs();showDiploSubtab();">NATION INFO</div>
                ${tradeBtn}
            </div>`;

            html += `</div>`;
        }

        html += `</div>`;
    }

    right.innerHTML = html;

    // Click handlers
    right.onclick = (e) => {
        // Sort buttons
        const sortBtn = e.target.closest('.tr-sort-btn');
        if (sortBtn) {
            _tradePartnerSort = sortBtn.dataset.sort;
            renderTradePartners();
            return;
        }
        // Clear filter
        if (e.target.closest('.tr-filter-clear')) {
            _tradeCommodityFilter = null;

        // Nation card expand
        const card = e.target.closest('.tr-partner-card');
        if (card && !e.target.closest('.tr-action-btn')) {
            const nid = card.dataset.nation;
            _tradeExpandedNation = _tradeExpandedNation === nid ? null : nid;
            renderTradePartners();
        }
    };
}

// ═══════════════════════════════════════════════════
// WORLD MAP — Pan + Zoom
// ═══════════════════════════════════════════════════

async function initWorldMap() {
    const panel = document.getElementById('world-map-panel');
    let img = document.getElementById('world-map-img');
    if (!panel || !img) return;

    // Upgrade <img src="*.svg"> → inline <svg> so high-zoom renders
    // stay sharp. Browsers rasterize SVG-via-<img> ONCE at the natural
    // display size, then transform-scale the bitmap — produces visible
    // pixelation past ~150% zoom. Inline <svg> keeps the vector
    // representation; the browser re-rasterizes at every scale.
    //
    // On fetch / parse failure the original <img> stays in place
    // (still functional, just pixelates at high zoom), so the panel
    // never goes blank. After the swap, the new <svg> keeps the same
    // id="world-map-img" so the pan/zoom code below operates on it
    // unchanged — every property used (offsetWidth, style.transform,
    // etc.) works on SVG block elements just like on img.
    try {
        const src = img.getAttribute('src') || '';
        if (src) {
            const res = await fetch(src);
            if (res.ok) {
                const svgText = await res.text();
                const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
                const root = doc.documentElement;
                if (root && root.tagName.toLowerCase() === 'svg') {
                    const svgEl = document.importNode(root, true);
                    svgEl.id = 'world-map-img';
                    // Strip Inkscape-set width/height so CSS width:100%
                    // controls layout; viewBox handles aspect ratio.
                    svgEl.removeAttribute('width');
                    svgEl.removeAttribute('height');
                    // No will-change:transform — see comment in world.css; the
                    // GPU layer promotion makes Chrome bitmap-cache the SVG and
                    // re-introduces blur at high zoom.
                    svgEl.style.cssText = 'display:block;transform-origin:0 0;width:100%;height:auto;pointer-events:none;';
                    img.replaceWith(svgEl);
                    img = svgEl;
                }
            }
        }
    } catch (err) {
        console.warn('[WorldMap] inline-SVG upgrade failed, using <img> fallback:', err?.message || err);
    }

    let scale = 1, panX = 0, panY = 0, dragging = false, startX = 0, startY = 0;
    const minScale = 1, maxScale = 4;

    // Edge lock: clamp panX/panY so the image's visual rect always covers
    // the panel — no panning past the map into the panel's blue background.
    // CSS gives us 'transform-origin: 0 0' and 'width: 100%' on the img,
    // so visual size = layoutSize × scale, anchored at (panX, panY).
    // For coverage:  panX ∈ [panelW − visualW, 0],  same for Y.
    // If the image is smaller than the panel in either axis (e.g., at
    // scale=1 with a wide-aspect map shorter than the panel), the
    // coverage range collapses — lock that axis at 0 (top/left).
    function clampPan() {
        const panelW = panel.clientWidth;
        const panelH = panel.clientHeight;
        // BCR works for both <img> and inline <svg>; offsetWidth/offsetHeight
        // are HTMLElement-only and return undefined on SVGElement, which
        // produced NaN translations after the SVG upgrade and silently
        // disabled pan/zoom. BCR returns post-transform size, which is
        // exactly what visualW/visualH need to be.
        const r = img.getBoundingClientRect();
        const visualW = r.width;
        const visualH = r.height;
        if (visualW <= panelW) panX = 0;
        else panX = Math.max(panelW - visualW, Math.min(0, panX));
        if (visualH <= panelH) panY = 0;
        else panY = Math.max(panelH - visualH, Math.min(0, panY));
    }

    function applyTransform() {
        clampPan();
        img.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        const label = document.getElementById('map-zoom-label');
        if (label) label.textContent = Math.round(scale * 100) + '%';
    }

    // Scroll to zoom
    panel.addEventListener('wheel', (e) => {
        e.preventDefault();
        const rect = panel.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const oldScale = scale;
        const delta = e.deltaY > 0 ? 0.9 : 1.1;
        scale = Math.max(minScale, Math.min(maxScale, scale * delta));
        // Zoom toward mouse position
        panX = mx - (mx - panX) * (scale / oldScale);
        panY = my - (my - panY) * (scale / oldScale);
        applyTransform();
    }, { passive: false });

    // Drag to pan
    panel.addEventListener('mousedown', (e) => {
        dragging = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        panel.style.cursor = 'grabbing';
    });
    window.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        applyTransform();
    });
    window.addEventListener('mouseup', () => {
        dragging = false;
        panel.style.cursor = 'grab';
    });

    // Touch support
    let lastTouchDist = 0;
    panel.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
            dragging = true;
            startX = e.touches[0].clientX - panX;
            startY = e.touches[0].clientY - panY;
        } else if (e.touches.length === 2) {
            lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        }
    }, { passive: true });
    panel.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && dragging) {
            panX = e.touches[0].clientX - startX;
            panY = e.touches[0].clientY - startY;
            applyTransform();
        } else if (e.touches.length === 2) {
            const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            if (lastTouchDist > 0) {
                scale = Math.max(minScale, Math.min(maxScale, scale * (dist / lastTouchDist)));
                applyTransform();
            }
            lastTouchDist = dist;
        }
    }, { passive: true });
    panel.addEventListener('touchend', () => { dragging = false; lastTouchDist = 0; });

    // Button controls
    document.getElementById('map-zoom-in')?.addEventListener('click', () => {
        scale = Math.min(maxScale, scale * 1.25);
        applyTransform();
    });
    document.getElementById('map-zoom-out')?.addEventListener('click', () => {
        scale = Math.max(minScale, scale * 0.8);
        applyTransform();
    });
    document.getElementById('map-zoom-reset')?.addEventListener('click', () => {
        scale = 1; panX = 0; panY = 0;
        applyTransform();
    });

    applyTransform();
}

let _worldSelectedNationId = null;

function initNationHighlight(allNations, state) {
    const body = document.getElementById('world-highlight-body');
    if (!body || !allNations.length) return;

    const myNationId = state.nation?.id;
    _worldAllNations = allNations;
    _worldState = state;

    // Show your own nation by default (also renders the nation list)
    const myNation = allNations.find(n => n.id === myNationId);
    if (myNation) {
        selectWorldNation(myNation.id);
    } else {
        // No player nation — just render the clickable list
        renderNationList(allNations, myNationId);
    }
}

function renderNationList(allNations, myNationId, filter) {
    // Renders into the static #world-nations-grid container below the map.
    // (List previously lived inside #world-highlight as a sibling of the
    // selected-nation body — moved out so the right-side card carries only
    // the search input + selected-nation details.)
    const grid = document.getElementById('world-nations-grid');
    if (!grid) return;

    const filtered = filter
        ? allNations.filter(n => n.name.toLowerCase().includes(filter.toLowerCase()))
        : allNations;

    const cellsHtml = filtered.map(n => {
        const isYou = n.id === myNationId;
        const isSelected = n.id === _worldSelectedNationId;
        const cellClasses = ['wn-grid-cell'];
        if (isSelected) cellClasses.push('is-selected');
        if (isYou) cellClasses.push('is-you');
        const flagUrl = n.flag_url || `assets/flags/${n.name}.png`;
        return `<div class="${cellClasses.join(' ')}" data-nation-id="${n.id}">
            <img class="wn-grid-flag" src="${flagUrl}" alt="" onerror="this.style.display='none'">
            <div class="wn-grid-info">
                <div class="wn-grid-name">${escapeHtml(n.name)}${isYou ? ' (You)' : ''}${isSelected ? ' ◀' : ''}</div>
                <div class="wn-grid-gov">${escapeHtml(n.government_type || '')}</div>
            </div>
        </div>`;
    }).join('');

    grid.innerHTML = cellsHtml || '<div class="wn-grid-empty">No nations match your search.</div>';

    // Bind the click handler once — re-renders on filter/select shouldn't
    // pile up listeners.
    if (!grid.dataset.clickBound) {
        grid.addEventListener('click', (e) => {
            const cell = e.target.closest('[data-nation-id]');
            if (cell) selectWorldNation(cell.dataset.nationId);
        });
        grid.dataset.clickBound = '1';
    }

    // Wire up search input (once)
    const searchInput = document.getElementById('world-nation-search');
    if (searchInput && !searchInput._wired) {
        searchInput._wired = true;
        searchInput.addEventListener('input', () => {
            renderNationList(allNations, myNationId, searchInput.value);
        });
    }
}

let _worldAllNations = [];
let _worldState = null;
let _worldRelations = null;
let _worldAgreements = null;

async function selectWorldNation(nationId) {
    const nation = _worldAllNations.find(n => n.id === nationId);
    if (!nation) return;

    const myNationId = _worldState.nation?.id;
    const isYou = nation.id === myNationId;

    // Track selected nation for list highlighting
    _worldSelectedNationId = nationId;
    renderNationList(_worldAllNations, myNationId);

    // Fetch diplomatic data if not cached
    if (!_worldRelations) {
        const [relResult, agreeResult] = await Promise.all([
            _supabase.from('diplomatic_relations').select('*'),
            _supabase.from('trade_agreements').select('*').eq('status', 'active'),
        ]);
        _worldRelations = relResult.data || [];
        _worldAgreements = agreeResult.data || [];
    }

    // Fetch government data for the selected nation
    const govData = await fetchNationGovernmentData(nation.id);
    const extraData = { gov: govData, tradeData: null };
    renderNationHighlight(nation, _worldState, _worldRelations, _worldAgreements, extraData);

    // Fetch bilateral trade data async, then patch just the trade section
    if (!isYou && myNationId) {
        fetchBilateralTrade(myNationId, nation.id).then(tradeData => {
            // Only patch if this nation is still selected
            if (_worldSelectedNationId !== nationId) return;
            const tradeEl = document.getElementById('world-trade-section');
            if (tradeEl) {
                tradeEl.innerHTML = buildTradeHTML(tradeData);
            }
        }).catch(err => {
            console.error('[World] Bilateral trade fetch failed:', err);
        });
    }
}

/**
 * Fetch head of government and coalition parties for a nation.
 * Returns { leader, leaderParty, coalitionParties }
 *
 * Crisis sunset (Phase 3): the active_crises read + crises return field
 * are gone, along with the Active Crises render block below.
 */
async function fetchNationGovernmentData(nationId) {
    try {
    const [hogRes, presRes, coalRes, partiesRes] = await Promise.all([
        _supabase.from('head_of_government')
            .select('first_name, last_name, faction_id')
            .eq('nation_id', nationId)
            .eq('active', true)
            .limit(1)
            .maybeSingle(),
        _supabase.from('presidents')
            .select('first_name, last_name, faction_id')
            .eq('nation_id', nationId)
            .eq('is_active', true)
            .limit(1)
            .maybeSingle(),
        _supabase.from('government_formations')
            .select('party_ids, ministry_assignments, proposed_by, status')
            .eq('nation_id', nationId)
            .in('status', ['formed', 'caretaker'])
            .order('formed_at', { ascending: false })
            .limit(1)
            .maybeSingle(),
        _supabase.from('factions')
            .select('id, faction_name, abbreviation, party_color, seats')
            .eq('nation_id', nationId)
            .order('seats', { ascending: false }),
    ]);

    const allParties = partiesRes.data || [];
    const partyMap = {};
    for (const p of allParties) partyMap[p.id] = p;

    // Determine leader: prefer president for presidential, else HOG
    const nation = _worldAllNations.find(n => n.id === nationId);
    const isPresidential = (nation?.government_type || '').toLowerCase().includes('presidential');
    const pres = presRes.data;
    const hog = hogRes.data;
    let leader = null;
    let leaderParty = null;

    if (isPresidential && pres) {
        leader = { name: `${pres.first_name} ${pres.last_name}`, title: 'President' };
        leaderParty = partyMap[pres.faction_id] || null;
    } else if (hog) {
        leader = { name: `${hog.first_name} ${hog.last_name}`, title: 'Prime Minister' };
        leaderParty = partyMap[hog.faction_id] || null;
    } else if (pres) {
        leader = { name: `${pres.first_name} ${pres.last_name}`, title: 'President' };
        leaderParty = partyMap[pres.faction_id] || null;
    }

    // Coalition parties
    const coal = coalRes.data;
    let coalitionParties = [];
    if (coal && coal.party_ids) {
        coalitionParties = coal.party_ids
            .map(id => partyMap[id])
            .filter(Boolean);
    }

    return { leader, leaderParty, coalitionParties };
    } catch (err) {
        console.error('[World] fetchNationGovernmentData failed:', err);
        return { leader: null, leaderParty: null, coalitionParties: [] };
    }
}

const AGREE_TYPE_LABELS = {
    fta: 'Free Trade Agreement',
    free_trade: 'Free Trade Agreement',
    pta: 'Preferential Trade',
    preferential_trade: 'Preferential Trade',
    goods_trade: 'Goods & Services Trade Agreement',
    resource_supply: 'Resource Supply Contract',
    export_subsidy: 'Export Subsidy',
    economic_aid: 'Economic Aid',
    stockpile_purchase: 'Stockpile Purchase',
    retaliatory_tariff: 'Retaliatory Tariff',
    impose_embargo: 'Embargo',
};

/**
 * Recompute the singular `agreement_type` for a negotiation from its
 * draft_articles. Call before every draft_articles UPDATE.
 *
 * Today this only catches one drift case: a negotiation opened as 'fta' (or
 * with no type yet) that has since been filled with structured articles from
 * the modern article modal (trade_flow / transfer / market_access /
 * tariff_reduction / exit_terms). An FTA stored like that was being treated
 * by the tick processor as "eliminate all tariffs", which is wrong — it was
 * really a product-flow agreement.
 *
 * We preserve non-mismatched types (pta, resource_supply, economic_aid, etc.)
 * as-is because their required_articles already match the articles the modal
 * produces for them.
 */
const STRUCTURED_ARTICLE_TYPES = new Set([
    'trade_flow', 'transfer', 'market_access', 'tariff_reduction', 'exit_terms',
]);
function inferAgreementType(articles, currentType) {
    const nonDuration = (articles || []).filter(a => (a.article_type || a.type) !== 'duration');
    if (nonDuration.length === 0) return currentType || null;
    const allStructured = nonDuration.every(a => STRUCTURED_ARTICLE_TYPES.has(a.article_type || a.type));
    if (allStructured && (currentType === 'fta' || currentType === null || currentType === undefined || currentType === 'pending')) {
        return 'goods_trade';
    }
    return currentType;
}

// TRADE_SECTOR_LABELS defined above (line ~224) — shared by both trade tab and bilateral trade panel

/**
 * Build trade section inner HTML (used for both initial render and async patch).
 */
function buildTradeHTML(tradeData) {
    if (!tradeData) {
        return `<div class="world-trade-loading">Loading trade data\u2026</div>`;
    }
    if (tradeData.totalExports === 0 && tradeData.totalImports === 0) {
        return `<div style="font-family:var(--font-mono);font-size:8px;color:var(--text-dim);font-style:italic;">No active trade routes.</div>`;
    }

    const allSectors = new Set([
        ...Object.keys(tradeData.exportsToThem),
        ...Object.keys(tradeData.importsFromThem),
    ]);
    const sectorRows = [];
    for (const sector of allSectors) {
        const exp = tradeData.exportsToThem[sector] || 0;
        const imp = tradeData.importsFromThem[sector] || 0;
        sectorRows.push({ sector, exp, imp, total: exp + imp });
    }
    sectorRows.sort((a, b) => b.total - a.total);

    let h = `<table class="world-trade-table">
        <thead><tr><th>Sector</th><th>Exports</th><th>Imports</th><th>Net</th></tr></thead><tbody>`;
    for (const row of sectorRows) {
        const net = row.exp - row.imp;
        const netClass = net > 0 ? 'trade-positive' : net < 0 ? 'trade-negative' : 'trade-zero';
        const netPrefix = net > 0 ? '+' : '';
        h += `<tr>
            <td>${escapeHtml(TRADE_SECTOR_LABELS[row.sector] || row.sector)}</td>
            <td>${fmtBudgetCurrency(row.exp)}</td>
            <td>${fmtBudgetCurrency(row.imp)}</td>
            <td class="${netClass}">${netPrefix}${fmtBudgetCurrency(net)}</td>
        </tr>`;
    }
    h += `</tbody></table>`;

    const balance = tradeData.balance;
    const balClass = balance > 0 ? 'trade-positive' : balance < 0 ? 'trade-negative' : 'trade-zero';
    const balPrefix = balance > 0 ? '+' : '';
    h += `<div class="world-trade-balance">
        <span class="world-trade-balance-label">Trade Balance</span>
        <span class="world-trade-balance-value ${balClass}">${balPrefix}${fmtBudgetCurrency(balance)}</span>
    </div>`;
    h += `<div style="font-family:var(--font-mono);font-size:7px;color:var(--text-dim);margin-top:2px;">
        Total exports: ${fmtBudgetCurrency(tradeData.totalExports)} &middot;
        Total imports: ${fmtBudgetCurrency(tradeData.totalImports)}
    </div>`;
    return h;
}

function renderNationHighlight(nation, state, relations, agreements, extraData) {
    const body = document.getElementById('world-highlight-body');
    if (!body) return;

    const myNationId = state.nation?.id;
    const isYou = nation.id === myNationId;
    const gov = extraData?.gov || {};
    const tradeData = extraData?.tradeData;

    // Population
    const pop = Number(nation.population || 0);
    const popLabel = pop >= 1e6 ? (pop / 1e6).toFixed(1) + 'M' : pop.toLocaleString();

    // Flag URL
    const flagSrc = nation.flag_url || `assets/flags/${nation.name}.png`;

    // ── HEADER: Flag + Name + Government Type ──
    let html = `<div class="world-hl-header-row">
        <img class="world-hl-flag" src="${escapeHtml(flagSrc)}" alt="" onerror="this.style.display='none'">
        <div>
            <div class="world-highlight-name">${escapeHtml(nation.name)}${isYou ? ' <span style="font-family:var(--font-mono);font-size:8px;color:var(--green);font-weight:700;">YOU</span>' : ''}</div>
            <div class="world-highlight-meta">${escapeHtml(nation.government_type || 'Unknown')}</div>
        </div>
    </div>`;

    // ── HEAD OF GOVERNMENT ──
    if (gov.leader) {
        const partyAbbr = gov.leaderParty?.abbreviation || gov.leaderParty?.faction_name || '';
        const partyColor = gov.leaderParty?.party_color || 'var(--text-dim)';
        html += `<div style="margin:6px 0 4px;padding:8px 10px;background:var(--bg-card);border:1px solid var(--border-main);border-left:3px solid ${partyColor};">
            <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:3px;">${escapeHtml(gov.leader.title)}</div>
            <div style="font-size:14px;font-weight:700;color:var(--text-bright);">${escapeHtml(gov.leader.name)} <span style="font-family:var(--font-mono);font-size:11px;color:${partyColor};font-weight:700;">${partyAbbr ? '[' + escapeHtml(partyAbbr) + ']' : ''}</span></div>
        </div>`;
    }

    // ── COALITION ──
    if (gov.coalitionParties && gov.coalitionParties.length > 0) {
        html += `<div style="display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 4px;">`;
        for (const p of gov.coalitionParties) {
            const color = p.party_color || '#888';
            html += `<span style="font-family:var(--font-mono);font-size:7px;padding:2px 6px;border:1px solid ${color};color:${color};letter-spacing:0.03em;">${escapeHtml(p.abbreviation || p.faction_name)}${p.seats ? ' \u00B7 ' + p.seats : ''}</span>`;
        }
        html += `</div>`;
    }

    // ── KEY STATS ──
    html += `<div class="world-highlight-section">KEY STATS</div>`;

    const stateApparatus = nation.state_apparatus ?? 0;
    const stateApparatusColor = stateApparatus >= 50 ? 'var(--green)' : stateApparatus >= 30 ? 'var(--amber)' : 'var(--red)';
    const stats = [
        { label: 'Population', value: popLabel },
        { label: 'State Apparatus', value: stateApparatus.toFixed(1), color: stateApparatusColor },
    ];
    html += stats.map(s => `<div class="world-highlight-stat-row">
        <span class="world-highlight-stat-label">${escapeHtml(s.label)}</span>
        <span class="world-highlight-stat-value" style="${s.color ? 'color:' + s.color : ''}">${s.value}</span>
    </div>`).join('');

    // Crisis sunset (Phase 3): the Active Crises row in the world
    // highlight panel is gone — fetchNationGovernmentData no longer
    // reads active_crises.


    // ── DIPLOMATIC RELATIONS (foreign nations only) ──
    let relScore = null;
    let proximity = null;
    if (!isYou && myNationId) {
        const a = myNationId < nation.id ? myNationId : nation.id;
        const b = myNationId < nation.id ? nation.id : myNationId;
        const rel = (relations || []).find(r => r.nation_a_id === a && r.nation_b_id === b);
        if (rel) {
            relScore = Number(rel.relation_score ?? 0);
            proximity = Number(rel.proximity ?? 0);
        }
    }

    if (!isYou && relScore !== null) {
        let relLabel = '', relColor = 'var(--text-dim)';
        if (relScore >= 60) { relLabel = 'FRIENDLY'; relColor = 'var(--green)'; }
        else if (relScore >= 30) { relLabel = 'WARM'; relColor = 'var(--green)'; }
        else if (relScore >= -10) { relLabel = 'NEUTRAL'; relColor = 'var(--amber)'; }
        else if (relScore >= -40) { relLabel = 'COOL'; relColor = 'var(--orange)'; }
        else { relLabel = 'HOSTILE'; relColor = 'var(--red)'; }

        html += `<div class="world-highlight-section">DIPLOMATIC RELATIONS</div>`;
        html += `<div class="world-highlight-stat-row">
            <span class="world-highlight-stat-label">Relation Score</span>
            <span class="world-highlight-stat-value" style="color:${relColor};">${relScore} \u2014 ${relLabel}</span>
        </div>`;
        if (proximity !== null) {
            html += `<div class="world-highlight-stat-row">
                <span class="world-highlight-stat-label">Proximity</span>
                <span class="world-highlight-stat-value">${proximity}</span>
            </div>`;
        }
    }

    // ── AGREEMENTS ──
    const bilateralAgreements = isYou ? [] : (agreements || []).filter(ag =>
        (ag.nation_a_id === myNationId && ag.nation_b_id === nation.id) ||
        (ag.nation_a_id === nation.id && ag.nation_b_id === myNationId)
    );
    const allNationAgreements = isYou ? (agreements || []).filter(ag =>
        ag.nation_a_id === nation.id || ag.nation_b_id === nation.id
    ) : [];

    if (!isYou && bilateralAgreements.length > 0) {
        html += `<div class="world-highlight-section">ACTIVE AGREEMENTS (${bilateralAgreements.length})</div>`;
        for (const ag of bilateralAgreements) {
            const typeLabel = AGREE_TYPE_LABELS[ag.agreement_type] || ag.agreement_type;
            const isHostile = ag.agreement_type === 'retaliatory_tariff' || ag.agreement_type === 'impose_embargo';
            html += `<div style="padding:4px 0;border-bottom:1px solid var(--border-light);">
                <div style="font-size:9px;font-weight:600;color:${isHostile ? 'var(--red)' : 'var(--text-bright)'};">${escapeHtml(ag.agreement_name || typeLabel)}</div>
                <div style="font-family:var(--font-mono);font-size:7px;color:var(--text-dim);">${escapeHtml(typeLabel)}</div>
            </div>`;
        }
    } else if (!isYou && bilateralAgreements.length === 0) {
        html += `<div class="world-highlight-section">AGREEMENTS</div>`;
        html += `<div style="font-family:var(--font-mono);font-size:8px;color:var(--text-dim);font-style:italic;">No active agreements.</div>`;
    }

    if (isYou && allNationAgreements.length > 0) {
        html += `<div class="world-highlight-section">YOUR AGREEMENTS (${allNationAgreements.length})</div>`;
        for (const ag of allNationAgreements.slice(0, 8)) {
            const otherNationId = ag.nation_a_id === nation.id ? ag.nation_b_id : ag.nation_a_id;
            const otherNation = _worldAllNations.find(n => n.id === otherNationId);
            const typeLabel = AGREE_TYPE_LABELS[ag.agreement_type] || ag.agreement_type;
            html += `<div style="padding:3px 0;border-bottom:1px solid var(--border-light);">
                <div style="font-size:9px;font-weight:600;color:var(--text-bright);">${escapeHtml(ag.agreement_name || typeLabel)}</div>
                <div style="font-family:var(--font-mono);font-size:7px;color:var(--text-dim);">with ${escapeHtml(otherNation?.name || 'Unknown')} \u00B7 ${escapeHtml(typeLabel)}</div>
            </div>`;
        }
        if (allNationAgreements.length > 8) {
            html += `<div style="font-family:var(--font-mono);font-size:7px;color:var(--text-dim);margin-top:4px;">+ ${allNationAgreements.length - 8} more</div>`;
        }
    }

    // ── BILATERAL TRADE (foreign nations, async-patched) ──
    if (!isYou) {
        html += `<div class="world-highlight-section">BILATERAL TRADE</div>`;
        html += `<div id="world-trade-section">${buildTradeHTML(tradeData)}</div>`;
    }

    body.innerHTML = html;
}

/**
 * Shared helper: fetch org + members, build the preview HTML.
 * Returns { org, members, headerHtml } or null if org not found.
 */
async function buildOrgPreviewData(orgId) {
    const [orgResult, membersResult] = await Promise.all([
        _supabase.from('international_orgs').select('*').eq('id', orgId).single(),
        _supabase.from('ipo_members')
            .select('id, faction_id, role, factions:faction_id ( id, faction_name, nation_id )')
            .eq('org_id', orgId)
            .eq('is_active', true)
    ]);

    const org = orgResult.data;
    if (!org) return null;

    const members = membersResult.data || [];
    const charter = org.charter || {};
    const description = org.description || charter.description || 'No description provided.';

    // Fetch nation names for members
    const nationIds = [...new Set(members.map(m => m.factions?.nation_id).filter(Boolean))];
    const nationMap = {};
    if (nationIds.length > 0) {
        const { data: nations } = await _supabase.from('nations').select('id, name').in('id', nationIds);
        (nations || []).forEach(n => { nationMap[n.id] = n.name; });
    }

    const presidentMember = members.find(m => m.faction_id === org.president_id);
    const presidentName = presidentMember?.factions?.faction_name || 'Unknown';

    const memberRows = members.map(m => {
        const f = m.factions;
        if (!f) return '';
        const nation = nationMap[f.nation_id] || '';
        const isMemberPres = m.faction_id === org.president_id;
        const role = isMemberPres ? '\u2605 President' : m.role === 'observer' ? 'Observer' : 'Member';
        const roleClass = isMemberPres ? 'ipo-preview-member-role ipo-preview-member-role--president' : 'ipo-preview-member-role';
        return '<div class="ipo-preview-member"><span class="ipo-preview-member-name">' + escapeHtml(f.faction_name) + '</span>'
            + (nation ? '<span class="ipo-preview-member-nation"> · ' + escapeHtml(nation) + '</span>' : '')
            + '<span class="' + roleClass + '">' + role + '</span></div>';
    }).join('');

    const headerHtml = `
        <div class="ipo-preview-header">
            ${renderIPOLogo(org, 'ipo-header-logo', '')}
            <div class="ipo-preview-header-info">
                <div class="ipo-header-name">${escapeHtml(org.name)}</div>
                <div class="ipo-header-meta">
                    <span>${members.length} member${members.length !== 1 ? 's' : ''}</span>
                    <span>President: ${escapeHtml(presidentName)}</span>
                    <span>Est. Tick ${org.founded_at_tick}</span>
                </div>
            </div>
        </div>
        <div class="ipo-preview-desc">${escapeHtml(description)}</div>

    return { org, members, headerHtml };
}

/**
 * Request to join an organisation. Creates a membership vote based on charter rules.
 */
async function requestToJoinOrg(orgId) {
    if (_ipoActionLock) return;
    _ipoActionLock = true;

    try {
        const { data: org } = await _supabase
            .from('international_orgs')
            .select('id, name, charter, president_id')
            .eq('id', orgId)
            .single();
        if (!org) { alert('Organisation not found.'); return; }

        const admission = org.charter?.membership?.admission || 'vote';

        // Duplicate guard — prevent double-submission
        const { data: existingVote } = await _supabase
            .from('ipo_votes')
            .select('id')
            .eq('org_id', orgId)
            .eq('vote_type', 'membership')
            .eq('status', 'open')
            .eq('proposed_by', currentFaction.id)
            .limit(1)
            .maybeSingle();
        if (existingVote) { alert('You already have a pending join request for this organisation.'); return; }

        // Determine requested role from charter (default: member)
        const requestedRole = org.charter?.membership?.joinRequestRole || 'member';

        // Check open vote limit
        if (!await _checkOpenVoteLimit(orgId)) {
            alert(`This organisation already has ${IPO_MAX_OPEN_VOTES} open votes. Please try again later.`);
            return;
        }

        if (admission === 'vote') {
            // Create a membership vote for existing members to decide
            const { error: voteErr } = await _supabase.from('ipo_votes').insert({
                org_id: orgId,
                title: `Admit ${currentFaction.faction_name} as ${requestedRole}`,
                vote_type: 'membership',
                meta: {
                    target_faction_id: currentFaction.id,
                    target_faction_name: currentFaction.faction_name,
                    requested_role: requestedRole,
                    join_request: true
                },
                status: 'open',
                opened_at_tick: shardTick,
                closes_at_tick: shardTick + IPO_VOTE_DURATION,
                proposed_by: currentFaction.id
            });
            if (voteErr) { console.error('[IPO] Vote insert failed:', voteErr.message); alert('Failed to create join request. You may not have permission.'); return; }

            const { error: chatErr } = await _supabase.from('ipo_chat').insert({
                org_id: orgId,
                faction_id: null,
                is_system: true,
                message_text: `${currentFaction.faction_name} has requested to join as ${requestedRole}. A membership vote has been opened.`,
                tick_posted: shardTick
            });
            if (chatErr) console.error('[IPO] Chat insert failed:', chatErr.message);

            alert('Your request has been submitted. The organisation will vote on your membership.');
        } else {
            // President-decides admission — auto-generate a vote for president to review
            const { error: voteErr } = await _supabase.from('ipo_votes').insert({
                org_id: orgId,
                title: `Admit ${currentFaction.faction_name} as ${requestedRole}`,
                vote_type: 'membership',
                meta: {
                    target_faction_id: currentFaction.id,
                    target_faction_name: currentFaction.faction_name,
                    requested_role: requestedRole,
                    join_request: true,
                    president_decides: true
                },
                status: 'open',
                opened_at_tick: shardTick,
                closes_at_tick: shardTick + IPO_VOTE_DURATION,
                proposed_by: currentFaction.id
            });
            if (voteErr) { console.error('[IPO] Vote insert failed:', voteErr.message); alert('Failed to create join request. You may not have permission.'); return; }

            const { error: chatErr } = await _supabase.from('ipo_chat').insert({
                org_id: orgId,
                faction_id: null,
                is_system: true,
                message_text: `${currentFaction.faction_name} has requested to join as ${requestedRole}. The President will decide on admission.`,
                tick_posted: shardTick
            });
            if (chatErr) console.error('[IPO] Chat insert failed:', chatErr.message);

            alert('Your request has been submitted. The President will decide on your admission.');
        }

        // Refresh the preview to show "Request Pending" state
        await previewExistingOrg(orgId);
    } catch (e) {
        console.error('[IPO] Request to join error:', e);
        alert('Failed to submit join request.');
    } finally {
        _ipoActionLock = false;
    }
}

/**
 * Load and render the full IPO view:
 *  - Sidebar: list of orgs the player belongs to + Create button
 *  - Main panel: selected org detail (or empty state)
 */
async function renderIPOView() {
    const container = document.getElementById('ipo-view');
    if (!container || !currentFaction) return;

    // Fetch memberships (joined with org data) — always re-fetch to avoid stale state
    try {
        const { data: memberships, error } = await _supabase
            .from('ipo_members')
            .select(`
                id, role, joined_at_tick, chat_color,
                org:international_orgs (
                    id, name, logo_symbol, logo_text, logo_image_url, description,
                    founded_at_tick, founding_party_id,
                    president_id, president_term_start_tick, emergency_power_used_tick,
                    headquarters_nation_id, solidarity_fund_balance,
                    charter, is_active,
                    symposium_cooldown_remaining, pending_symposium
                )
            `)
            .eq('faction_id', currentFaction.id)
            .eq('is_active', true);

        if (error) {
            console.error('[IPO] Failed to load memberships:', error.message);
            ipoMemberships = [];
        } else {
            // Filter out any rows where the org is dissolved
            ipoMemberships = (memberships || []).filter(m => m.org && m.org.is_active);
        }
    } catch (e) {
        console.error('[IPO] Membership fetch error:', e);
        ipoMemberships = [];
    }

    // Count members per org (for sidebar meta)
    const memberCounts = {};
    const orgIds = ipoMemberships.map(m => m.org.id);
    if (orgIds.length > 0) {
        const { data: counts } = await _supabase
            .from('ipo_members')
            .select('org_id')
            .in('org_id', orgIds)
            .eq('is_active', true);
        (counts || []).forEach(c => {
            memberCounts[c.org_id] = (memberCounts[c.org_id] || 0) + 1;
        });
    }

    // Auto-select first org if none selected (or if selected org was left)
    if (ipoMemberships.length > 0) {
        const selectedStillValid = ipoMemberships.some(m => m.org.id === ipoSelectedOrgId);
        if (!ipoSelectedOrgId || !selectedStillValid) {
            ipoSelectedOrgId = ipoMemberships[0].org.id;
        }
    } else {
        ipoSelectedOrgId = null;
    }

    // Check for pending invitations
    let pendingInvites = [];
    try {
        const { data: invites } = await _supabase
            .from('ipo_invitations')
            .select(`
                id, invited_role, invited_at_tick, status,
                org:international_orgs ( id, name, logo_symbol, logo_text, logo_image_url ),
                inviter:invited_by ( id, faction_name )
            `)
            .eq('target_faction_id', currentFaction.id)
            .in('status', ['pending']);
        pendingInvites = invites || [];
    } catch (e) { /* non-fatal */ }

    // ── Fetch all existing orgs the player is NOT a member of ──
    let browseOrgs = [];
    try {
        const myOrgIds = ipoMemberships.map(m => m.org.id);
        const { data: allOrgs } = await _supabase
            .from('international_orgs')
            .select('id, name, logo_symbol, logo_text, logo_image_url, description, president_id, charter')
            .eq('is_active', true)
            .order('name');
        browseOrgs = (allOrgs || []).filter(o => !myOrgIds.includes(o.id));
        // Count members for browse orgs
        if (browseOrgs.length > 0) {
            const browseIds = browseOrgs.map(o => o.id);
            const { data: browseCounts } = await _supabase
                .from('ipo_members')
                .select('org_id')
                .in('org_id', browseIds)
                .eq('is_active', true);
            (browseCounts || []).forEach(c => {
                memberCounts[c.org_id] = (memberCounts[c.org_id] || 0) + 1;
            });
        }
    } catch (e) { /* non-fatal */ }

    // ── Fetch pending vote counts per org (open votes where player hasn't voted) ──
    const pendingVoteCounts = {};
    let totalPendingVotes = 0;
    if (orgIds.length > 0) {
        try {
            const { data: openVotes } = await _supabase
                .from('ipo_votes')
                .select('id, org_id')
                .in('org_id', orgIds)
                .eq('status', 'open');
            if (openVotes && openVotes.length > 0) {
                const voteIds = openVotes.map(v => v.id);
                const { data: myBallots } = await _supabase
                    .from('ipo_ballots')
                    .select('vote_id')
                    .in('vote_id', voteIds)
                    .eq('faction_id', currentFaction.id);
                const votedSet = new Set((myBallots || []).map(b => b.vote_id));
                // Only count votes where player is a member (not observer)
                const memberOrgIds = new Set(ipoMemberships.filter(m => m.role === 'member').map(m => m.org.id));
                for (const v of openVotes) {
                    if (!votedSet.has(v.id) && memberOrgIds.has(v.org_id)) {
                        pendingVoteCounts[v.org_id] = (pendingVoteCounts[v.org_id] || 0) + 1;
                        totalPendingVotes++;
                    }
                }
            }
        } catch (e) { /* non-fatal */ }
    }

    // ── Build sidebar ──
    const sidebarItems = ipoMemberships.map(m => {
        const org = m.org;
        const isActive = org.id === ipoSelectedOrgId;
        const count = memberCounts[org.id] || 1;
        const roleLabel = org.president_id === currentFaction.id ? 'President'
            : m.role === 'observer' ? 'Observer' : 'Member';
        const pvCount = pendingVoteCounts[org.id] || 0;
        const pvBadge = pvCount > 0
            ? `<span class="badge badge--amber" style="margin-left:auto;flex-shrink:0;font-size:9px;min-width:16px;text-align:center;padding:1px 5px;">${pvCount}</span>`
            : '';
        return `
            <div class="ipo-sidebar-item ${isActive ? 'is-active' : ''}"
                 onclick="selectIPOOrg('${org.id}')">
                ${renderIPOLogo(org, 'ipo-sidebar-logo', isActive ? 'is-active' : '')}
                <div class="ipo-sidebar-info" style="flex:1;min-width:0;">
                    <span class="ipo-sidebar-name ${isActive ? 'is-active' : ''}">${escapeHtml(org.name)}</span>
                    <span class="ipo-sidebar-meta">${count} member${count !== 1 ? 's' : ''} · ${roleLabel}</span>
                </div>
                ${pvBadge}
            </div>`;
    }).join('');

    // ── Pending invitations in sidebar ──
    const inviteItems = pendingInvites.map(inv => {
        const org = inv.org;
        const inviterName = inv.inviter?.faction_name || 'Unknown';
        return `
            <div class="ipo-sidebar-invite">
                <div class="ipo-sidebar-invite-header">
                    ${renderIPOLogo(org, 'ipo-sidebar-logo', '')}
                    <span class="ipo-sidebar-name">${escapeHtml(org.name)}</span>
                </div>
                <span class="ipo-sidebar-invite-from">Invited by ${escapeHtml(inviterName)} · ${inv.invited_role}</span>
                <div class="ipo-sidebar-invite-actions">
                    <button class="ipo-btn ipo-btn--accept" onclick="acceptIPOInvite('${inv.id}')">Accept</button>
                    <button class="ipo-btn ipo-btn--decline" onclick="declineIPOInvite('${inv.id}')">Decline</button>
                    <button class="ipo-btn ipo-btn--view" onclick="previewIPOInviteOrg('${org.id}','${inv.id}')">View</button>
                </div>
            </div>`;
    }).join('');

    // ── Existing organisations (browse) ──
    let browseSection = '';
    if (browseOrgs.length > 0) {
        const browseItems = browseOrgs.map(o => {
            const count = memberCounts[o.id] || 1;
            return `
                <div class="ipo-sidebar-item" onclick="previewExistingOrg('${o.id}')">
                    ${renderIPOLogo(o, 'ipo-sidebar-logo', '')}
                    <div class="ipo-sidebar-info">
                        <span class="ipo-sidebar-name">${escapeHtml(o.name)}</span>
                        <span class="ipo-sidebar-meta">${count} member${count !== 1 ? 's' : ''}</span>
                    </div>
                </div>`;
        }).join('');
        browseSection = `
            <div class="ipo-sidebar-header" style="margin-top:8px;">
                <span class="ipo-sidebar-dot" style="background:var(--damber);"></span>
                <span class="ipo-sidebar-label">EXISTING ORGANISATIONS</span>
            </div>
            <div class="ipo-sidebar-list">${browseItems}</div>`;
    }

    // ── Main panel ──
    let mainContent = '';
    if (ipoMemberships.length === 0) {
        // Empty state
        mainContent = `
            <div class="ipo-empty-state">
                <div class="ipo-empty-icon">◈</div>
                <div class="ipo-empty-title">International Party Organisations</div>
                <div class="ipo-empty-desc">
                    Join or create an international organisation to coordinate with like-minded parties across nations.
                    Share resources, hold rallies, issue joint statements, and project soft power across borders.
                </div>
                <button class="ipo-btn ipo-btn--create-large" onclick="openIPOCreationModal()">
                    + Create Organisation — $200k
                </button>
            </div>`;
    } else {
        // Render selected org detail
        mainContent = await renderIPOMainPanel(memberCounts);
    }

    container.innerHTML = `
        <div class="ipo-sidebar">
            <div class="ipo-sidebar-header">
                <span class="ipo-sidebar-dot"></span>
                <span class="ipo-sidebar-label">YOUR ORGANISATIONS</span>
            </div>
            <div class="ipo-sidebar-list">
                ${sidebarItems}
                ${inviteItems}
            </div>
            ${browseSection}
            <button class="ipo-btn ipo-btn--create" onclick="openIPOCreationModal()">
                + Create Organisation — $200k
            </button>
        </div>
        <div class="ipo-main" id="ipo-main">
            ${mainContent}
        </div>`;

    ipoLoaded = true;

    // Update International Orgs sub-tab badge with pending invite count + pending vote count
    updateIPOInviteTabBadge(pendingInvites.length + totalPendingVotes);

    // Load chat, votes, and actions after DOM is set (only if an org is selected)
    if (ipoSelectedOrgId && ipoMemberships.length > 0) {
        loadIPOChat(ipoSelectedOrgId);
        loadIPOVotes(ipoSelectedOrgId).then(() => renderIPOActionsPanel());
    }
}
