// ── Trade-lane efficiency helpers (shared by commodity detail + agreements) ──
// Base 85% for every bilateral lane; +3% per active shipping presence on
// agreements between this nation and partnerId, capped at 100%. Reads from
// _shippingContractsByAgreement (System B), which carries awarded trade-
// agreement-spawned contracts. Sector-specific filtering was dropped when
// organic shipping_routes was retired — agreement contracts carry commodity,
// not the lane sector mapping the old system used. If a tighter sector
// filter is needed later, add a commodity↔trade_sector resolver.
function _laneShipCountFor(partnerId, sector) {
    const myId = _worldState?.nation?.id;
    if (!myId || !partnerId) return 0;
    let count = 0;
    for (const ag of (_tradeAgreementsList || [])) {
        const matchesPair = (ag.nation_a_id === myId && ag.nation_b_id === partnerId)
            || (ag.nation_b_id === myId && ag.nation_a_id === partnerId);
        if (!matchesPair) continue;
        for (const c of (_shippingContractsByAgreement[ag.id] || [])) {
            // Same fix as _agreementEfficiency / getAgreementShippingInfo —
            // multi-winner contracts deliver via winning_bids[] without ever
            // flipping to status='awarded', so a legacy-only filter undercounts.
            if (isShippingContractActive(c)) count++;
        }
    }
    return count;
}
// Resolve the shipping need for a lane between our nation and partnerId.
// Wraps the _worldState / _worldAllNations / _worldRelations lookups so every
// caller (efficiency badge, logistics badge, anywhere else) reads the same
// source of truth instead of re-doing the find() dance.
function _shippingNeedForPartner(partnerId) {
    const myId = _worldState?.nation?.id;
    const myNation = (_worldAllNations || []).find(n => n.id === myId);
    const partner = (_worldAllNations || []).find(n => n.id === partnerId);
    const rel = (_worldRelations || []).find(r =>
        (r.nation_a_id === myId && r.nation_b_id === partnerId) ||
        (r.nation_b_id === myId && r.nation_a_id === partnerId));
    // Defensive default: shippingNeedFor always returns an object, but
    // if the import ever drifts or partnerId is bogus, callers crashed
    // on `null.needsShipping`. Fall back to a safe maritime default.
    return shippingNeedFor(myNation, partner, rel?.border_types)
        || { needsShipping: true, reason: null };
}

function _laneEfficiencyFor(partnerId, sector) {
    const shipNeed = _shippingNeedForPartner(partnerId) || { needsShipping: true, reason: null };
    if (!shipNeed.needsShipping) {
        return { pct: 100, ships: 0, reason: shipNeed.reason };
    }
    const ships = _laneShipCountFor(partnerId, sector);
    return { pct: Math.min(100, 85 + ships * 3), ships, reason: null };
}

// Agreement-level aggregate — an agreement typically spans multiple sectors,
// each with its own route and its own efficiency. Returns a volume-weighted
// average pct across the agreement's routes with a total ship count, so the
// single _efficiencyBadge in the agreement view reflects the agreement's
// real overall throughput. Land lanes (landlocked / land border) contribute
// 100% and don't need shipping.
function _agreementEfficiency(agreementId, partnerId) {
    const contracts = _shippingContractsByAgreement[agreementId] || [];
    // BUG FIX: was filtering `status === 'awarded'`, which only counts
    // legacy single-winner contracts. Multi-winner contracts (winning_bids[]
    // populated by the new allocator) were invisible — efficiency dropped
    // to the 85% default whenever every article had moved off the legacy
    // path. isShippingContractActive() is the canonical "is this delivering?"
    // check, same one shippingContractDeliveredPerTick() and the Phase 4
    // render block use, so all three surfaces agree on what counts.
    const awarded = contracts.filter(isShippingContractActive);
    if (awarded.length === 0) {
        // No shipping awarded on this agreement yet. Land-adjacent pairs
        // still read 100% via the partner's shipping need; everyone else
        // stays at the baseline 85% maritime efficiency.
        const shipNeed = partnerId ? _shippingNeedForPartner(partnerId) : null;
        if (shipNeed && !shipNeed.needsShipping) {
            return { pct: 100, ships: 0, reason: shipNeed.reason };
        }
        return { pct: 85, ships: 0, reason: null };
    }
    // Each awarded contract counts as one "ship" for the badge — System B
    // tracks contracts per article, not freighters per claim. Cap at 100%.
    return {
        pct: Math.min(100, 85 + awarded.length * 3),
        ships: awarded.length,
        reason: null,
    };
}
function _efficiencyBadge(eff) {
    const { pct, ships, reason } = eff;
    // Land lanes (landlocked / land border) are always 100%.
    // Maritime lanes: red at 85% baseline, amber while building, green at 100%.
    const color = pct >= 100 ? 'var(--green)' : pct > 85 ? 'var(--amber)' : 'var(--red)';
    let note;
    if (reason === 'landlocked') note = 'landlocked';
    else if (reason === 'land_border') note = 'land border';
    else if (ships === 0) note = 'no active shipping';
    else note = `+${ships * 3} for ${ships} ship${ships !== 1 ? 's' : ''} on trade route`;
    return `<span style="font-family:var(--font-mono);font-size:9px;color:${color};white-space:nowrap;">[${pct}% \u2014 ${escapeHtml(note)}]</span>`;
}

// Stat-based commodity flows for any nation. Single source of truth
// for the production/demand math used by the Trade economy table AND
// the trade-negotiation modal's Your Economy / They Can Offer / They
// Need panels. _tradeFlows was wiped in Phase 10A; these formulas
// operate on raw nation stats so every surface stays in sync.
//
// Returns [{ key, name, icon, prod, dem }] in stat units (not dollars).
function _computeStatCommodities(nation) {
    if (!nation) return [];
    const energyStat     = Number(nation.energy)             || 0;
    const infraStat      = Number(nation.infrastructure)     || 0;
    const industryStat   = Number(nation.industry)           || 0;
    const solStat        = Number(nation.standard_of_living) || 0;
    const popMillions    = (Number(nation.population) || 0) / 1_000_000;
    const mineralsStat   = Number(nation.minerals)        || 0;
    // Canonical-stats Phase 4: workforce split → tier per commodity.
    // Minerals (extraction), Food (agriculture), and Consumer Goods
    // (manufacturing) all use the unskilled tier. Luxury Goods has no
    // workforce term — Education × Services stands in for the skilled
    // / knowledge tier. Mirror political-actions.js commodity engine.
    const unskilledStat  = Number(nation.unskilled_workers) || 0;
    const farmlandStat   = Number(nation.farmland)        || 0;
    const educationStat  = Number(nation.education)       || 0;
    const serviceStat    = Number(nation.service_sector)  || 0;
    // potential = production with all multiplier stats (the / 100 or / 200
    // terms) clamped to 1.0. Surfaces "what could you make if your operational
    // stats were maxed out" against the natural endowment / industrial base.
    // Energy has no multiplier so potential === prod.
    return [
        { key: 'energy',         name: 'Energy',         icon: '⚡',
          prod: energyStat / 3,
          potential: energyStat / 3,
          dem:  ((infraStat + industryStat) * solStat * Math.sqrt(popMillions)) / 3500 },
        { key: 'minerals',       name: 'Minerals',       icon: '⛏',
          prod: (mineralsStat / 3) * ((unskilledStat + industryStat) / 200),
          potential: mineralsStat / 3,
          dem:  (infraStat / 10) + (industryStat / 16) },
        { key: 'food',           name: 'Food',           icon: '🌾',
          prod: (farmlandStat / 2) * (unskilledStat / 100),
          potential: farmlandStat / 2,
          dem:  popMillions / 3 },
        { key: 'consumer_goods', name: 'Consumer Goods', icon: '📦',
          prod: (industryStat / 3) * (unskilledStat / 100),
          potential: industryStat / 3,
          dem:  (solStat / 100) * popMillions / 2 },
        { key: 'luxury_goods',   name: 'Luxury Goods',   icon: '💎',
          prod: (solStat / 6) * ((educationStat * serviceStat) / 10000),
          potential: solStat / 6,
          dem:  Math.pow(solStat / 100, 2) * popMillions },
    ];
}

function renderTradeEconomy() {
    const left = document.getElementById('trade-left');
    if (!left) return;

    // Build commodity rows from the shared stat-based helper +
    // the shared trading-volumes helper (single source of truth for
    // signed import/export deltas across MY active trade agreements).
    // Both the Trade tab and the negotiation modal's Your Economy
    // panel pull from the same trading map so the net column matches
    // on both surfaces. statBased=true tells the formatter to render
    // integers instead of dollar amounts.
    const _n = _worldState?.nation || {};
    const trading = getTradingVolumesByCommodity();
    const commodities = _computeStatCommodities(_n).map(c => {
        const tradingDelta = Number(trading[c.key]) || 0;
        return {
            key:    c.key,
            icon:   c.icon,
            name:   c.name,
            production:     c.prod,
            potential:      c.potential,
            domesticDemand: c.dem,
            demand:         0,
            trading:        tradingDelta,
            netFlow:        c.prod - c.dem + tradingDelta,
            selfSufficiencyBalance: null,
            statBased: true,
        };
    });

    for (const [sector, flow] of Object.entries(_tradeFlows)) {
        // Skip parent food_agriculture if subsectors exist
        if (sector === 'food_agriculture' && (_tradeFlows.grains_staples || _tradeFlows.livestock_dairy)) continue;
        commodities.push({
            key: sector,
            icon: TRADE_SECTOR_ICONS[sector] || '\uD83D\uDCE6',
            name: TRADE_SECTOR_LABELS[sector] || sector,
            // production = gross domestic production (what the nation
            // actually makes each tick). Previously read export_capacity,
            // which is the exportable surplus — a petro-state that consumed
            // all its own oil showed the $10M floor even at 88 oil_and_gas.
            production: Number(flow.domestic_production) || 0,
            // domesticDemand = gross consumption before domestic-coverage
            // offset. Currently only fuel_energy populates this; other
            // sectors render the value as '-' in the table row below.
            domesticDemand: Number(flow.domestic_demand) || 0,
            demand: Number(flow.import_demand) || 0,
            // netFlow = export_volume − import_volume, computed once by the
            // trade engine and stored on trade_flows.net_flow.
            netFlow: Number(flow.net_flow) || 0,
            // selfSufficiencyBalance = domestic_production − domestic_demand.
            // Only meaningful where domestic demand is populated.
            selfSufficiencyBalance: (Number(flow.domestic_demand) || 0) > 0
                ? (Number(flow.domestic_production) || 0) - (Number(flow.domestic_demand) || 0)
                : null,
        });
    }
    // Sort by total volume descending — but keep stat-based commodities
    // (Energy, etc.) pinned to the top regardless of magnitude since
    // they're on a different scale than the dollar-denominated rows.
    commodities.sort((a, b) => {
        if (!!a.statBased !== !!b.statBased) return a.statBased ? -1 : 1;
        return (b.production + b.demand) - (a.production + a.demand);
    });

    // Net trade position = trade_flows.net_flow (export_volume − import_volume)
    // computed once at tick time. Same source as getNationSurplusesAndDeficits
    // so YOUR ECONOMY and partner views agree. Stat-derived rows (Energy,
    // etc.) are included but formatted as unit-less numbers in the rendering
    // below so they don't print as dollar amounts.
    const surpluses = commodities.filter(c => c.netFlow > 0).sort((a, b) => b.netFlow - a.netFlow);
    const deficits = commodities.filter(c => c.netFlow < 0).sort((a, b) => a.netFlow - b.netFlow);

    let html = '';

    // ── Commodity table ──
    // Corp-dashboard-aligned section: Roman-numeral header + serif title
    // + 3-column table (Production / Demand / Net). Stat-based rows
    // render unit-less integers; trade-flow rows use fmtBudgetCurrency.
    html += `<div class="tr-econ-section">
        <div class="tr-econ-header">
            <h2><span class="tr-econ-num">I.</span>Your <em>Economy</em></h2>
            <span class="tr-econ-meta">${commodities.length} commodit${commodities.length === 1 ? 'y' : 'ies'}</span>
        </div>
        <div class="tr-econ-card">
            <div class="tr-econ-col-header">
                <span>Commodity</span>
                <span>Production/Potential Prod.</span>
                <span>Demand</span>
                <span>Trading</span>
                <span>Net</span>
            </div>`;

    const nationId = _worldState?.nation?.id;
    // Stat-based rows render as unit-less integers; dollar rows use the
    // standard currency formatter. fmtProd routes both through one call.
    const fmtProd = (c, n) => c.statBased ? Number(n).toFixed(0) : fmtBudgetCurrency(n);
    // Per-commodity production-formula disclosure. Mirrors the math in
    // _computeStatCommodities() — keep the strings here in sync if the
    // formulas change. Only stat-based rows show a formula; trade-flow
    // sub-sectors (grains, livestock, manufactured, etc.) come from the
    // tick-time trade_flows pipeline rather than a closed-form stat eq.
    const PRODUCTION_FORMULAS = {
        energy:         '(Energy / 3)',
        minerals:       '(Minerals / 3) × ((Unskilled + Industry) / 200)',
        food:           '(Farmland / 2) × (Unskilled / 100)',
        consumer_goods: '(Industry / 3) × (Unskilled / 100)',
        luxury_goods:   '(SoL / 6) × ((Education × Services) / 10000)',
    };
    for (const c of commodities) {
        // Total demand = own consumption + foreign demand on our exports.
        // Trading  = signed import/export delta from active agreements
        //            (+ = imports, − = exports). Only Energy carries it
        //            today; trade-flow commodities default to 0.
        // Net      = production − totalDemand + trading.
        const totalDemand = (Number(c.domesticDemand) || 0) + (Number(c.demand) || 0);
        const trading = Number(c.trading) || 0;
        const net = (Number(c.production) || 0) - totalDemand + trading;
        const netCls = net > 0 ? 'positive' : net < 0 ? 'negative' : 'zero';
        const tradingCls = trading > 0 ? 'positive' : trading < 0 ? 'negative' : 'zero';
        const isExp = _expandedCommodity === c.key;
        const rowAttrs = c.statBased ? ' data-statbased="1"' : '';
        const rowStyle = c.statBased ? 'cursor:default;' : '';
        const prodFormula = c.statBased ? PRODUCTION_FORMULAS[c.key] : null;
        html += `<div class="tr-econ-row tr-commodity-row" data-sector="${c.key}"${rowAttrs} style="${rowStyle}">
            <div class="tr-econ-name-cell">
                <span class="tr-econ-icon">${c.icon}</span>
                <div style="display:flex;flex-direction:column;gap:2px;min-width:0;">
                    <span class="tr-econ-name">${escapeHtml(c.name)}</span>
                    ${prodFormula
                        ? `<span class="tr-econ-formula" title="Production formula: ${escapeHtml(prodFormula)}">${escapeHtml(prodFormula)}</span>`
                        : ''}
                </div>
            </div>
            <span class="tr-econ-value">${fmtProd(c, c.production)}${
                (c.statBased && c.key !== 'energy' && Number.isFinite(Number(c.potential)))
                    ? ` <span class="tr-econ-potential" title="Production if multiplier stats were maxed at 100">(${fmtProd(c, c.potential)})</span>`
                    : ''
            }</span>
            <span class="tr-econ-value${totalDemand > 0 ? '' : ' tr-econ-muted'}">${totalDemand > 0 ? fmtProd(c, totalDemand) : '—'}</span>
            <span class="tr-econ-net ${tradingCls}">${trading === 0 ? '0' : (trading > 0 ? '+' : '−') + fmtProd(c, Math.abs(trading))}</span>
            <span class="tr-econ-net ${netCls}">${net === 0 ? '—' : (net > 0 ? '+' : '−') + fmtProd(c, Math.abs(net))}</span>
        </div>`;

        // Expanded detail panel
        if (isExp) {
            const flow = _tradeFlows[c.key] || {};
            // domProd = gross domestic production (label: DOMESTIC PRODUCTION).
            // expCap = exportable surplus — used for the unmet-demand check.
            const domProd = Number(flow.domestic_production) || 0;
            const domDem = Number(flow.domestic_demand) || 0;
            const expCap = Number(flow.export_capacity) || 0;
            const impDem = Number(flow.import_demand) || 0;
            const expVol = Number(flow.export_volume) || 0;
            const impVol = Number(flow.import_volume) || 0;
            const selfSuffBal = domDem > 0 ? (domProd - domDem) : null;
            const tradeCashflow = expVol - impVol;

            // Unmet demand = import gap not satisfied by actual imports + any
            // un-exported surplus the nation could self-supply if redirected.
            const unmetDemand = Math.max(0, impDem - expCap - impVol);

            // Unit formatting
            const unitProd = formatSectorVolume(domProd, c.key);
            const unitDomDem = formatSectorVolume(domDem, c.key);
            const unitDem = formatSectorVolume(impDem, c.key);
            const unitImp = formatSectorVolume(impVol, c.key);
            const unitExp = formatSectorVolume(expVol, c.key);
            const unitUnmet = formatSectorVolume(unmetDemand, c.key);

            // Bilateral partners
            const importPartners = _tradePartnersBilateral
                .filter(p => p.importer_nation_id === nationId && p.sector === c.key && p.trade_volume > 0)
                .sort((a, b) => b.trade_volume - a.trade_volume);
            const exportPartners = _tradePartnersBilateral
                .filter(p => p.exporter_nation_id === nationId && p.sector === c.key && p.trade_volume > 0)
                .sort((a, b) => b.trade_volume - a.trade_volume);

            html += `<div style="padding:10px 18px 14px;background:var(--bg-card);border-bottom:2px solid var(--border-main);">`;

            // Global price per unit
            const ECON_UNIT_PRICES = {
                fuel_energy: { price: 85, unit: 'barrel' }, minerals: { price: 120, unit: 'tonne' },
                grains_staples: { price: 235, unit: 'tonne' }, livestock_dairy: { price: 2800, unit: 'tonne' },
                fruits_vegetables: { price: 900, unit: 'tonne' }, cash_crops: { price: 1400, unit: 'tonne' },
                manufactured_goods: { price: 2200, unit: 'TEU' }, arms: { price: 45000, unit: 'unit' },
            };
            const globalUnitInfo = ECON_UNIT_PRICES[c.key];
            if (globalUnitInfo) {
                html += `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(42,42,36,0.2);">
                    <span style="font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--text-dim);letter-spacing:0.5px;">GLOBAL PRICE</span>
                    <span style="font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--amber);">$${globalUnitInfo.price.toLocaleString()} <span style="font-weight:400;color:var(--text-dim);font-size:10px;">per ${globalUnitInfo.unit}</span></span>
                </div>`;
            }

            // Domestic Production
            html += `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(42,42,36,0.2);">
                <span style="font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--text-dim);letter-spacing:0.5px;">DOMESTIC PRODUCTION</span>
                <span style="font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--teal);">${fmtBudgetCurrency(domProd)}${unitProd ? ' <span style="font-weight:400;color:var(--text-dim);font-size:10px;">(' + unitProd + ')</span>' : ''}</span>
            </div>`;

            // Domestic Demand — only shown when populated (currently fuel_energy only).
            if (domDem > 0) {
                html += `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(42,42,36,0.2);">
                    <span style="font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--text-dim);letter-spacing:0.5px;">DOMESTIC DEMAND</span>
                    <span style="font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--blue);">${fmtBudgetCurrency(domDem)}${unitDomDem ? ' <span style="font-weight:400;color:var(--text-dim);font-size:10px;">(' + unitDomDem + ')</span>' : ''}</span>
                </div>`;
            }

            // Import Demand
            html += `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(42,42,36,0.2);">
                <span style="font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--text-dim);letter-spacing:0.5px;">IMPORT DEMAND</span>
                <span style="font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--amber);">${fmtBudgetCurrency(impDem)}${unitDem ? ' <span style="font-weight:400;color:var(--text-dim);font-size:10px;">(' + unitDem + ')</span>' : ''}</span>
            </div>`;

            // Self-sufficiency balance
            html += `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(42,42,36,0.2);">
                <span style="font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--text-dim);letter-spacing:0.5px;">SELF-SUFFICIENCY BALANCE</span>
                <span style="font-family:var(--font-mono);font-size:12px;font-weight:700;color:${selfSuffBal === null ? 'var(--text-dim)' : selfSuffBal > 0 ? 'var(--green)' : selfSuffBal < 0 ? 'var(--red)' : 'var(--text-dim)'};">${selfSuffBal === null ? '—' : (selfSuffBal > 0 ? '+' : '') + fmtBudgetCurrency(selfSuffBal)}</span>
            </div>`;

            // Trade cashflow (actual exports − imports)
            html += `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(42,42,36,0.2);">
                <span style="font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--text-dim);letter-spacing:0.5px;">TRADE CASHFLOW</span>
                <span style="font-family:var(--font-mono);font-size:12px;font-weight:700;color:${tradeCashflow > 0 ? 'var(--green)' : tradeCashflow < 0 ? 'var(--red)' : 'var(--text-dim)'};">${tradeCashflow === 0 ? '—' : (tradeCashflow > 0 ? '+' : '') + fmtBudgetCurrency(tradeCashflow)}</span>
            </div>`;

            // Importing
            html += `<div style="margin-top:8px;">
                <div style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--red);letter-spacing:0.5px;margin-bottom:4px;">IMPORTING: ${fmtBudgetCurrency(impVol)}${unitImp ? ' (' + unitImp + ')' : ''}</div>`;
            if (importPartners.length > 0) {
                for (const p of importPartners) {
                    const partnerNation = (_worldAllNations || []).find(n => n.id === p.exporter_nation_id);
                    const pName = partnerNation?.name || 'Unknown';
                    const pUnit = formatSectorVolume(p.trade_volume, c.key);
                    const eff = _laneEfficiencyFor(p.exporter_nation_id, c.key);
                    html += `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 0 2px 12px;">
                        <span style="font-size:12px;color:var(--text-secondary);">\u2022 ${escapeHtml(pName)}</span>
                        <span style="display:flex;align-items:center;gap:8px;">
                            ${_efficiencyBadge(eff)}
                            <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);">${fmtBudgetCurrency(p.trade_volume)}${pUnit ? ' <span style="font-size:9px;">(' + pUnit + ')</span>' : ''}</span>
                        </span>
                    </div>`;
                }
            } else if (impVol > 0) {
                html += `<div style="font-size:11px;color:var(--text-dim);font-style:italic;padding-left:12px;">Distributed across multiple trading partners</div>`;
            } else {
                html += `<div style="font-size:11px;color:var(--text-dim);font-style:italic;padding-left:12px;">No imports</div>`;
            }
            html += `</div>`;

            // Unmet Demand
            if (unmetDemand > 0) {
                html += `<div style="display:flex;justify-content:space-between;padding:4px 0;margin-top:4px;border-top:1px solid rgba(42,42,36,0.2);">
                    <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--red);letter-spacing:0.5px;">UNMET DEMAND</span>
                    <span style="font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--red);">${fmtBudgetCurrency(unmetDemand)}${unitUnmet ? ' <span style="font-weight:400;font-size:9px;">(' + unitUnmet + ')</span>' : ''}</span>
                </div>`;
            }

            // Exporting
            html += `<div style="margin-top:8px;">
                <div style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--green);letter-spacing:0.5px;margin-bottom:4px;">EXPORTING: ${fmtBudgetCurrency(expVol)}${unitExp ? ' (' + unitExp + ')' : ''}</div>`;
            if (exportPartners.length > 0) {
                for (const p of exportPartners) {
                    const partnerNation = (_worldAllNations || []).find(n => n.id === p.importer_nation_id);
                    const pName = partnerNation?.name || 'Unknown';
                    const pUnit = formatSectorVolume(p.trade_volume, c.key);
                    const eff = _laneEfficiencyFor(p.importer_nation_id, c.key);
                    html += `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 0 2px 12px;">
                        <span style="font-size:12px;color:var(--text-secondary);">\u2022 ${escapeHtml(pName)}</span>
                        <span style="display:flex;align-items:center;gap:8px;">
                            ${_efficiencyBadge(eff)}
                            <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);">${fmtBudgetCurrency(p.trade_volume)}${pUnit ? ' <span style="font-size:9px;">(' + pUnit + ')</span>' : ''}</span>
                        </span>
                    </div>`;
                }
            } else if (expVol > 0) {
                html += `<div style="font-size:11px;color:var(--text-dim);font-style:italic;padding-left:12px;">Distributed across multiple trading partners</div>`;
            } else {
                html += `<div style="font-size:11px;color:var(--text-dim);font-style:italic;padding-left:12px;">No exports</div>`;
            }
            html += `</div>`;

            html += `</div>`;
        }
    }
    // Empty-state when there are no commodities at all (no Energy stat
    // and no trade flows). Energy is always injected, so this is mostly
    // defensive — but cheap to render.
    if (commodities.length === 0) {
        html += `<div class="tr-econ-empty">No commodities · no production data yet</div>`;
    }
    html += `</div></div>`;

    // ── Surpluses / Deficits ──
    html += `<div style="display:flex;gap:6px;">`;

    // Surpluses
    html += `<div class="tr-panel" style="flex:1;padding:12px 14px;">
        <div style="font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--green);margin-bottom:8px;">SURPLUSES</div>`;
    for (const c of surpluses.slice(0, 5)) {
        const val = c.statBased ? Number(c.netFlow).toFixed(0) : fmtBudgetCurrency(c.netFlow);
        html += `<div style="display:flex;justify-content:space-between;margin-bottom:4px;">
            <span style="font-size:13px;color:var(--text-dim);">${c.icon} ${escapeHtml(c.name)}</span>
            <span style="font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--green);">+${val}</span>
        </div>`;
    }
    if (surpluses.length === 0) html += `<div style="font-size:13px;color:var(--text-dim);font-style:italic;">None</div>`;
    html += `</div>`;

    // Deficits
    html += `<div class="tr-panel" style="flex:1;padding:12px 14px;">
        <div style="font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--red);margin-bottom:8px;">DEFICITS</div>`;
    for (const c of deficits.slice(0, 5)) {
        const val = c.statBased ? Number(c.netFlow).toFixed(0) : fmtBudgetCurrency(c.netFlow);
        html += `<div style="display:flex;justify-content:space-between;margin-bottom:4px;">
            <span style="font-size:13px;color:var(--text-dim);">${c.icon} ${escapeHtml(c.name)}</span>
            <span style="font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--red);">${val}</span>
        </div>`;
    }
    if (deficits.length === 0) html += `<div style="font-size:13px;color:var(--text-dim);font-style:italic;">None</div>`;
    html += `</div>`;

    html += `</div>`; // close surpluses/deficits row

    // ── Demand Effects (per-tick consequences by supply level) ──
    // Informational panel — lists every commodity's stat impact for
    // under-supplied / over-supplied buckets. Structured to expand
    // as additional trade goods get demand-met effects wired up.
    const DEMAND_EFFECTS = [
        {
            key: 'energy',
            icon: '⚡',
            name: 'Energy',
            under: [
                { label: 'Standard of Living', delta: -0.1 },
                { label: 'Public Approval',    delta: -0.1 },
                { label: 'Industry',           delta: -0.1 },
            ],
            over: [
                { label: 'Standard of Living', delta:  0.05 },
                { label: 'Cost of Living',     delta: -0.05 },
                { label: 'Public Approval',    delta:  0.05 },
                { label: 'Service Sector',     delta:  0.05 },
            ],
        },
        {
            key: 'minerals',
            icon: '⛏',
            name: 'Minerals',
            under: [
                { label: 'Infrastructure', delta: -0.1 },
                { label: 'Industry',       delta: -0.1 },
                { label: 'GDP Growth',     delta: -0.1 },
            ],
            over: [
                { label: 'Standard of Living', delta:  0.05 },
                { label: 'Infrastructure',     delta:  0.05 },
                { label: 'Industry',           delta:  0.05 },
                { label: 'GDP Growth',         delta:  0.05 },
            ],
        },
        {
            key: 'food',
            icon: '🌾',
            name: 'Food',
            under: [
                { label: 'Health',          delta: -0.2 },
                { label: 'Public Approval', delta: -0.2 },
                { label: 'Unrest',          delta:  0.2 },
                { label: 'Crime',                delta:  0.1 },
                { label: 'Unskilled Workers',    delta: -0.1 },
            ],
            over: [
                { label: 'Health',             delta:  0.1 },
                { label: 'Public Approval',    delta:  0.1 },
                { label: 'Standard of Living', delta:  0.05 },
                { label: 'Cost of Living',     delta: -0.05 },
            ],
        },
    ];
    // Lower-is-better stats — a negative delta on these is GOOD for
    // the nation (cost going down, unrest dropping, crime falling).
    // Color them green on negatives, red on positives.
    const LOWER_IS_BETTER_LABELS = new Set(['Cost of Living', 'Unrest', 'Crime']);
    const fmtDelta = (d) => (d > 0 ? '+' : '') + d.toFixed(2).replace(/\.?0+$/, m => m.includes('.') ? m.replace(/0+$/, '') : '');
    const tone = (label, d) => {
        if (d === 0) return 'var(--text-dim)';
        const lowerIsBetter = LOWER_IS_BETTER_LABELS.has(label);
        const isGood = lowerIsBetter ? d < 0 : d > 0;
        return isGood ? 'var(--green)' : 'var(--red)';
    };
    html += `<div class="tr-econ-effects-block">
        <div class="tr-econ-effects-header">DEMAND EFFECTS · PER TICK</div>`;
    for (const g of DEMAND_EFFECTS) {
        html += `<div class="tr-econ-effects-good">
            <div class="tr-econ-effects-good-name">${g.icon} ${escapeHtml(g.name)}</div>
            <div class="tr-econ-effects-cols">
                <div class="tr-econ-effects-col">
                    <div class="tr-econ-effects-col-head under">If demand not met</div>
                    ${g.under.map(e => `<div class="tr-econ-effects-row">
                        <span class="label">${escapeHtml(e.label)}</span>
                        <span class="value" style="color:${tone(e.label, e.delta)};">${fmtDelta(e.delta)}</span>
                    </div>`).join('')}
                </div>
                <div class="tr-econ-effects-col">
                    <div class="tr-econ-effects-col-head over">If supply ≥ 120%</div>
                    ${g.over.map(e => `<div class="tr-econ-effects-row">
                        <span class="label">${escapeHtml(e.label)}</span>
                        <span class="value" style="color:${tone(e.label, e.delta)};">${fmtDelta(e.delta)}</span>
                    </div>`).join('')}
                </div>
            </div>
        </div>`;
    }
    html += `<div class="tr-econ-effects-placeholder">More commodity effects unlock as demand models land.</div>`;
    html += `</div>`;

    left.innerHTML = html;

    // Commodity click handler: expand/collapse detail + filter partners
    left.onclick = (e) => {
        const row = e.target.closest('.tr-commodity-row');
        if (!row) return;
        // Stat-derived rows (Energy etc.) have no trade-flow detail to
        // expand — bail before toggling so the empty panel never opens.
        if (row.dataset.statbased === '1') return;
        const sector = row.dataset.sector;
        // Toggle expansion
        _expandedCommodity = _expandedCommodity === sector ? null : sector;
        // Also set the filter for partner highlighting
        _tradeCommodityFilter = _expandedCommodity;
        renderTradeEconomy();
        renderTradePartners();
    };
}

// TRADE AGREEMENTS PANEL
// ═══════════════════════════════════════════════════

let _tradeAgreementsList = [];
let _tradeNegotiationsList = [];
// negotiation_id → boolean, true when the OTHER nation has posted a
// non-system message since this side's last_seen_at_<a|b> was stamped.
// Drives the red unread dot in the AGREEMENTS panel.
let _tradeNegUnreadById = {};
let _tradeExpandedAgreement = null;

async function loadTradeAgreements() {
    const nationId = _worldState?.nation?.id;
    if (!nationId) return;

    const [agResult, negResult] = await Promise.all([
        _supabase.from('trade_agreements')
            .select('*')
            .or(`nation_a_id.eq.${nationId},nation_b_id.eq.${nationId}`)
            .order('enacted_at_tick', { ascending: false }),
        _supabase.from('trade_negotiations')
            .select('id, nation_a_id, nation_b_id, status, agreement_type, opened_at_tick, approved_by_a, approved_by_b, last_seen_at_a, last_seen_at_b')
            .or(`nation_a_id.eq.${nationId},nation_b_id.eq.${nationId}`)
            .in('status', ['open', 'active', 'ratification'])
            .order('opened_at_tick', { ascending: false }),
    ]);
    _tradeAgreementsList = agResult.data || [];
    _tradeNegotiationsList = negResult.data || [];

    // Compute per-negotiation unread state for the red dot. Pulls the
    // most recent non-system message from the OTHER nation per neg,
    // compares its created_at to last_seen_at_<my-side>. One batched
    // query keeps this O(1) for the panel render.
    const negIds = _tradeNegotiationsList.map(n => n.id);
    const unread = {};
    if (negIds.length > 0) {
        const { data: latestMsgs, error: msgsErr } = await _supabase.from('negotiation_messages')
            .select('negotiation_id, sender_nation_id, created_at')
            .in('negotiation_id', negIds)
            .neq('sender_nation_id', nationId)
            .eq('is_system', false)
            .order('created_at', { ascending: false });
        if (msgsErr) {
            console.warn('[loadTradeAgreements] unread-state fetch failed:', msgsErr.message);
        }
        const latestByNeg = {};
        for (const m of (latestMsgs || [])) {
            if (!latestByNeg[m.negotiation_id]) latestByNeg[m.negotiation_id] = m.created_at;
        }
        for (const neg of _tradeNegotiationsList) {
            const weAreA = neg.nation_a_id === nationId;
            const lastSeen = weAreA ? neg.last_seen_at_a : neg.last_seen_at_b;
            const latest   = latestByNeg[neg.id];
            if (latest && (!lastSeen || new Date(latest) > new Date(lastSeen))) {
                unread[neg.id] = true;
            }
        }
    }
    _tradeNegUnreadById = unread;

    // Phase 4: cache awarded trade-agreement-spawned shipping contracts
    // and their winning bids so getTradingVolumesByCommodity can
    // recognize shipping-in-place and read actual delivered energy/tick
    // instead of the agreement's stated volume.
    await loadAgreementShippingContracts();

    // Minister of Trade pending-bid review (20270238). Server-side
    // RPC checks the ministry role and 404s for non-ministers; the
    // result here is empty for non-MoT users, so the bid-review
    // section just doesn't render. No client-side ministry check.
    await loadMinisterBids();
}

let _shippingContractsByAgreement = {};  // agreementId → [{ id, status, volume_required, commodity, winner_faction_name, winning_bids[], total_units_won, ... }]
async function loadAgreementShippingContracts() {
    _shippingContractsByAgreement = {};
    const agreementIds = (_tradeAgreementsList || [])
        .filter(a => a.status === 'active')
        .map(a => a.id);
    if (agreementIds.length === 0) return;

    // Single source: get_trade_agreement_shipping ranks pending bids via
    // the shipping_contract_winners helper, so the nation card sees the
    // same live winners the entrepreneur dashboard does. Legacy fields
    // (winner_faction_name, revenue_per_tick) are still returned so any
    // old single-winner 'awarded' contract keeps rendering.
    const { data, error } = await _supabase.rpc('get_trade_agreement_shipping', { p_agreement_ids: agreementIds });
    if (error) {
        console.warn('[diplomacy] agreement shipping RPC failed:', error.message);
        return;
    }
    if (!data || !data.success) {
        console.warn('[diplomacy] agreement shipping RPC returned no success:', data?.reason);
        return;
    }
    for (const c of (data.contracts || [])) {
        if (!c.trade_agreement_id) continue;
        const list = _shippingContractsByAgreement[c.trade_agreement_id] || [];
        list.push({
            id:                          c.id,
            status:                      c.status,
            volume_required:             Number(c.volume_required) || 0,
            delivery_priority:           c.delivery_priority || null,
            expires_at_tick:             Number(c.expires_at_tick) || null,
            commodity:                   c.commodity || null,
            winner_faction_id:           c.winner_faction_id,
            winner_faction_name:         c.winner_faction_name || null,
            revenue_per_tick:            Number(c.revenue_per_tick) || 0,
            consecutive_missed_payments: Number(c.consecutive_missed_payments) || 0,
            winning_bids:                Array.isArray(c.winning_bids) ? c.winning_bids : [],
            total_units_won:             Number(c.total_units_won) || 0,
        });
        _shippingContractsByAgreement[c.trade_agreement_id] = list;
    }
}

// Pending bids on the viewing nation's open trade-agreement shipping
// contracts. Populated by loadMinisterBids() via get_route_bids_for_minister
// (server checks the ministry role; non-MoT users get an empty map and
// the review block doesn't render). Bucketed by contract_id; each entry
// carries ticks_until_window_close (server-derived — the 3-tick window
// constant lives only in SQL) plus the rate-sorted bid list with each
// bid's vetoed / manually_accepted flags.
let _ministerBidsByContract = {};
async function loadMinisterBids() {
    _ministerBidsByContract = {};
    const nid = _worldState?.nation?.id;
    if (!nid) return;
    const { data, error } = await _supabase.rpc('get_route_bids_for_minister', { p_nation_id: nid });
    if (error) {
        console.warn('[diplomacy] minister bids RPC failed:', error.message);
        return;
    }
    if (!data || !data.success) return;   // not_trade_minister lands here too — silent
    for (const r of (data.routes || [])) {
        _ministerBidsByContract[r.id] = {
            ticks_until_window_close: Number(r.ticks_until_window_close) || 0,
            bids: Array.isArray(r.bids) ? r.bids : [],
        };
    }
}

// Per-contract minister bid review block. Renders a row per pending bid
// (sealed-bid rule is for rival carriers — the buyer's minister is the
// legitimate audience for the rate) with [Accept] / [Reject] buttons.
// Accept calls accept_shipping_bid (force-award; bypasses the 3-tick
// window for this contract); Reject calls veto_shipping_bid (excludes
// from the fill). The two flags are mutex server-side: accepting a
// bid clears any prior veto and vice versa, so the three displayed
// states (PENDING / ACCEPTED / REJECTED) are always disjoint. Returns
// '' when there are no bids OR the viewer isn't this nation's MoT
// (the loader leaves the bucket empty in that case).
function _renderMinisterBidReview(contractId) {
    const entry = _ministerBidsByContract[contractId];
    if (!entry || !entry.bids.length) return '';
    const ticksLeft   = entry.ticks_until_window_close;
    const anyAccepted = entry.bids.some(b => b.manually_accepted);
    const windowChip = anyAccepted
        ? `<span style="font-family:var(--font-mono);font-size:7px;color:var(--green);letter-spacing:0.5px;text-transform:uppercase;padding:1px 5px;border:1px solid var(--green);">Minister override · allocator live</span>`
        : ticksLeft > 0
            ? `<span style="font-family:var(--font-mono);font-size:7px;color:var(--amber, #b8860b);letter-spacing:0.5px;text-transform:uppercase;padding:1px 5px;border:1px solid var(--amber, #b8860b);">Bidding · closes in ${ticksLeft} tick${ticksLeft === 1 ? '' : 's'}</span>`
            : `<span style="font-family:var(--font-mono);font-size:7px;color:var(--text-dim);letter-spacing:0.5px;text-transform:uppercase;">Window closed · allocator live</span>`;
    let rows = '';
    for (const b of entry.bids) {
        const carrier  = b.carrier || 'Carrier';
        const rate     = Number(b.rate) || 0;
        const freight  = Number(b.freighters) || 0;
        const rep      = Number(b.reputation) || 0;
        const vetoed   = !!b.vetoed;
        const accepted = !!b.manually_accepted;
        const rateStr  = rate > 0 ? `$${Math.round(rate).toLocaleString()}/unit/tick` : 'rate —';
        const stateLabel = accepted ? 'ACCEPTED' : vetoed ? 'REJECTED' : 'PENDING';
        const stateColor = accepted ? 'var(--green)' : vetoed ? 'var(--red)' : 'var(--text-dim)';
        const acceptBtn = `<button data-action="accept-bid" data-bid-id="${b.bid_id}" ${accepted ? 'disabled' : ''}
            style="font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:0.5px;color:${accepted ? 'var(--text-dim)' : 'var(--green)'};background:${accepted ? 'transparent' : 'rgba(92,197,92,0.08)'};border:1px solid ${accepted ? 'var(--border-main)' : 'var(--green)'};padding:3px 10px;cursor:${accepted ? 'default' : 'pointer'};text-transform:uppercase;">Accept</button>`;
        const rejectBtn = `<button data-action="reject-bid" data-bid-id="${b.bid_id}" ${vetoed ? 'disabled' : ''}
            style="font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:0.5px;color:${vetoed ? 'var(--text-dim)' : 'var(--red)'};background:${vetoed ? 'transparent' : 'rgba(197,85,85,0.08)'};border:1px solid ${vetoed ? 'var(--border-main)' : 'var(--red)'};padding:3px 10px;cursor:${vetoed ? 'default' : 'pointer'};text-transform:uppercase;">Reject</button>`;
        rows += `<div style="display:grid;grid-template-columns:1fr auto;gap:6px;padding:4px 6px;margin-top:3px;background:var(--bg-card);border:1px solid var(--border-main);align-items:center;">
            <div>
                <div style="font-family:var(--font-mono);font-size:9px;font-weight:700;color:var(--text-bright);">
                    ${escapeHtml(carrier)} <span style="color:var(--text-dim);font-weight:400;">· Rep ${rep}</span>
                </div>
                <div style="font-family:var(--font-mono);font-size:8px;color:var(--text-dim);margin-top:1px;">
                    ${freight} freighter${freight === 1 ? '' : 's'} @ ${rateStr} · <span style="color:${stateColor};font-weight:700;">${stateLabel}</span>
                </div>
            </div>
            <div style="display:flex;gap:4px;">${acceptBtn}${rejectBtn}</div>
        </div>`;
    }
    return `<div style="margin-top:6px;padding-top:6px;border-top:1px dashed var(--border-main);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;">
            <span style="font-family:var(--font-mono);font-size:7px;font-weight:700;letter-spacing:1px;color:var(--text-dim);">PENDING BIDS · ${entry.bids.length}</span>
            ${windowChip}
        </div>
        ${rows}
    </div>`;
}

// Single source — every consumer of "is this shipping contract delivering"
// and "how much per tick" reads through these two helpers. Covers both the
// multi-winner allocator's live state (winning_bids[], total_units_won) and
// the legacy single-winner snapshot (status='awarded' + winner_faction_name).
function isShippingContractActive(c) {
    return (Array.isArray(c?.winning_bids) && c.winning_bids.length > 0)
        || (c?.status === 'awarded' && !!c?.winner_faction_name);
}
function shippingContractDeliveredPerTick(c) {
    if (Array.isArray(c?.winning_bids) && c.winning_bids.length > 0) {
        return Number(c.total_units_won) || 0;
    }
    if (c?.status === 'awarded' && c?.winner_faction_name) {
        return Number(c.volume_required) || 0;
    }
    return 0;
}

// Minimal shape compatible with the legacy callers (agreement-card
// badges) — derived from awarded System B contracts instead of the
// retired shipping_routes / shipping_claims tables. corps[] only
// carries the winner display info the badge needs.
function getAgreementShippingInfo(agreementId) {
    const contracts = _shippingContractsByAgreement[agreementId] || [];
    // BUG FIX: was filtering `status === 'awarded'` and reading only
    // winner_faction_id — that missed every multi-winner contract (which
    // carries winners in winning_bids[] instead of the single
    // winner_faction_name field). Result: Route Efficiency showed only
    // legacy single-winner carriers and silently dropped every Calder /
    // Starliner pair. Now uses the same isShippingContractActive() filter
    // as the rest of the surface and walks winning_bids[] when present,
    // falling back to the legacy single-winner snapshot otherwise.
    const active = contracts.filter(isShippingContractActive);
    if (active.length === 0) return null;
    const corps = [];
    const seen = new Set();
    for (const c of active) {
        if (Array.isArray(c.winning_bids) && c.winning_bids.length > 0) {
            for (const w of c.winning_bids) {
                const name = w.corp_name || 'Corp';
                if (seen.has(name)) continue;
                seen.add(name);
                corps.push({ name, color: '#5cc55c' });
            }
        } else if (c.winner_faction_name) {
            if (seen.has(c.winner_faction_name)) continue;
            seen.add(c.winner_faction_name);
            corps.push({ name: c.winner_faction_name, color: '#5cc55c' });
        }
    }
    return {
        routeCount: active.length,
        corps,
        hasLogistics: corps.length > 0,
    };
}

function renderTradeAgreements() {
    const left = document.getElementById('trade-agreements-row');
    if (!left) return;
    const nationId = _worldState?.nation?.id;
    const currentTk = _worldState?.shard?.current_tick || 0;
    const agreements = _tradeAgreementsList;

    const active = agreements.filter(a => a.status === 'active');
    const expired = agreements.filter(a => a.status !== 'active');

    let html = `<div class="tr-panel">
        <div class="tr-panel-header">
            <span class="tr-panel-title">AGREEMENTS</span>
            <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);">${active.length} active${expired.length > 0 ? ' \u00B7 ' + expired.length + ' expired' : ''}</span>
        </div>`;

    // Ongoing trade negotiations (shown before agreements)
    const ongoingNegs = _tradeNegotiationsList || [];
    for (const neg of ongoingNegs) {
        const partnerId = neg.nation_a_id === nationId ? neg.nation_b_id : neg.nation_a_id;
        const partner = (_worldAllNations || []).find(n => n.id === partnerId);
        const partnerName = partner?.name || 'Unknown';
        const myName = _worldState?.nation?.name || 'Your Nation';
        const myFlag = _worldState?.nation?.flag_url || `assets/flags/${myName}.png`;
        const partnerFlag = partner?.flag_url || `assets/flags/${partnerName}.png`;

        // Three-state badge:
        //   RATIFICATION    — bill in parliament (status='ratification')
        //   READY TO RATIFY — both sides approved but not yet sent to parliament
        //   ONGOING         — negotiation in progress (default)
        const isRatifying = neg.status === 'ratification';
        const bothApproved = !isRatifying && !!neg.approved_by_a && !!neg.approved_by_b;
        const hasUnread    = !!_tradeNegUnreadById[neg.id];
        let negBadgeColor, negBadgeLabel, negBadgeBg, negBadgeBorder, negBorderColor;
        if (isRatifying) {
            negBadgeLabel  = 'RATIFICATION';
            negBadgeColor  = 'var(--green)';
            negBadgeBg     = 'rgba(92,204,92,0.08)';
            negBadgeBorder = 'rgba(92,204,92,0.2)';
            negBorderColor = 'var(--green)';
        } else if (bothApproved) {
            negBadgeLabel  = 'READY TO RATIFY';
            negBadgeColor  = 'var(--teal)';
            negBadgeBg     = 'rgba(90,175,165,0.08)';
            negBadgeBorder = 'rgba(90,175,165,0.25)';
            negBorderColor = 'var(--teal)';
        } else {
            negBadgeLabel  = 'ONGOING';
            negBadgeColor  = 'var(--amber)';
            negBadgeBg     = 'rgba(184,134,11,0.08)';
            negBadgeBorder = 'rgba(184,134,11,0.2)';
            negBorderColor = 'var(--amber)';
        }

        // Red unread dot when the other nation has posted a non-system
        // message since this side last opened the modal. Cleared by
        // mark_trade_negotiation_seen on next open.
        const unreadDot = hasUnread
            ? '<span title="New message from the other nation" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:4px;flex-shrink:0;"></span>'
            : '';

        html += `<div style="padding:12px 18px;border-bottom:1px solid var(--border-main);cursor:pointer;border-left:3px solid ${negBorderColor};"
            onclick="openTradeNegModal('${partnerId}')">
            <div style="display:flex;justify-content:space-between;align-items:center;">
                <div style="display:flex;align-items:center;gap:8px;">
                    ${unreadDot}
                    <img src="${escapeHtml(myFlag)}" alt="" style="width:24px;height:16px;object-fit:cover;border:1px solid var(--border-main);" onerror="this.style.display='none'">
                    <span style="font-size:13px;font-weight:600;color:var(--text-bright);">${escapeHtml(myName)}</span>
                    <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);">${isRatifying ? 'Ratification' : 'Trade Discussions'}</span>
                    <span style="font-size:13px;font-weight:600;color:var(--text-bright);">${escapeHtml(partnerName)}</span>
                    <img src="${escapeHtml(partnerFlag)}" alt="" style="width:24px;height:16px;object-fit:cover;border:1px solid var(--border-main);" onerror="this.style.display='none'">
                </div>
                <span class="tr-badge" style="font-size:10px;padding:3px 10px;color:${negBadgeColor};background:${negBadgeBg};border-color:${negBadgeBorder};">${negBadgeLabel}</span>
            </div>
        </div>`;
    }

    if (agreements.length === 0 && ongoingNegs.length === 0) {
        html += `<div style="padding:20px;text-align:center;font-family:var(--font-mono);font-size:12px;color:var(--text-dim);font-style:italic;">No trade agreements.</div>`;
    }

    for (let i = 0; i < agreements.length; i++) {
        const ag = agreements[i];
        const isActive = ag.status === 'active';
        const isHostile = ag.agreement_type === 'retaliatory_tariff' || ag.agreement_type === 'impose_embargo';
        const isExp = _tradeExpandedAgreement === ag.id;
        const statusColor = isActive ? (isHostile ? 'var(--red)' : 'var(--green)') : 'var(--text-dim)';
        const statusLabel = isActive ? (isHostile ? 'HOSTILE' : 'ACTIVE') : ag.status?.toUpperCase() || 'ENDED';

        // Partner nation
        const partnerId = ag.nation_a_id === nationId ? ag.nation_b_id : ag.nation_a_id;
        const partner = (_worldAllNations || []).find(n => n.id === partnerId);
        const partnerName = partner?.name || 'Unknown';
        const typeLabel = AGREE_TYPE_LABELS[ag.agreement_type] || ag.agreement_type;

        // Duration info
        const remaining = ag.expires_at_tick ? Math.max(0, ag.expires_at_tick - currentTk) : null;
        const durationLabel = ag.duration_type === 'indefinite' ? 'Ongoing' : (ag.duration_ticks ? ag.duration_ticks + ' ticks' : 'Unknown');

        const agShipInfo = getAgreementShippingInfo(ag.id);
        const agIsTradeType = ag.agreement_type !== 'retaliatory_tariff' && ag.agreement_type !== 'impose_embargo';
        // Land routes (landlocked / land border) don't need logistics — skip the orange
        // NO LOGISTICS warning and show a neutral land-trade tag instead.
        const agShipNeed = _shippingNeedForPartner(partnerId) || { needsShipping: true, reason: null };
        const logisticsBadge = !agIsTradeType
            ? ''
            : agShipInfo?.hasLogistics
                ? `<span class="tr-badge" style="color:var(--green);background:rgba(92,204,92,0.06);border-color:rgba(92,204,92,0.15);font-size:5px;">\uD83D\uDEA2 ${escapeHtml(agShipInfo.corps[0]?.name || 'Corp')}</span>`
                : !agShipNeed.needsShipping
                    ? `<span class="tr-badge" style="color:var(--green);background:rgba(92,204,92,0.06);border-color:rgba(92,204,92,0.15);font-size:5px;">LAND TRADE</span>`
                    : `<span class="tr-badge" style="color:var(--orange);background:rgba(200,136,68,0.06);border-color:rgba(200,136,68,0.15);font-size:5px;">\u26A0 NO LOGISTICS</span>`;

        // Phase 7: Energy shipping badge for trade-agreement contracts.
        // Surfaces "ENERGY \u25CA N/tick" when shipping is awarded, or
        // "ENERGY \u25CA AWAITING" when contracts are open with no winner yet.
        // Only renders for agreements with Energy trade_flow articles.
        const hasEnergyArticle = (ag.articles || []).some(a =>
            a.article_type === 'trade_flow' && a.data?.commodity === 'energy');
        const phase4Contracts = _shippingContractsByAgreement[ag.id] || [];
        const phase4Active    = phase4Contracts.filter(isShippingContractActive);
        let energyBadge = '';
        if (hasEnergyArticle) {
            const totalDelivered = phase4Active.reduce((s, c) => s + shippingContractDeliveredPerTick(c), 0);
            // Missed-payment heads-up if ANY contract (multi-winner or legacy)
            // has a non-zero counter — overrides the regular delivery badge.
            const anyMissed = phase4Contracts.some(c => (Number(c.consecutive_missed_payments) || 0) > 0);
            if (anyMissed) {
                energyBadge = `<span class="tr-badge" style="color:var(--red);background:rgba(200,90,58,0.08);border-color:rgba(200,90,58,0.25);font-size:5px;">\u26A0 PAYMENT DELAYED</span>`;
            } else if (totalDelivered > 0) {
                energyBadge = `<span class="tr-badge" style="color:var(--gold,#c8a832);background:rgba(200,168,50,0.08);border-color:rgba(200,168,50,0.25);font-size:5px;">\u26A1 ${totalDelivered}/TICK</span>`;
            } else {
                energyBadge = `<span class="tr-badge" style="color:var(--orange);background:rgba(200,136,68,0.06);border-color:rgba(200,136,68,0.15);font-size:5px;">\u26A1 AWAITING SHIPPING</span>`;
            }
        }

        html += `<div class="tr-agreement-row" data-ag-id="${ag.id}" style="border-left:3px solid ${statusColor};">
            <div class="tr-agreement-header" style="background:${isExp ? 'var(--bg-card)' : 'transparent'};padding:14px 18px;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                    <div style="display:flex;align-items:center;gap:6px;">
                        <span style="font-size:14px;font-weight:600;color:var(--text-bright);">${escapeHtml(ag.agreement_name || typeLabel)}</span>
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;">
                        ${energyBadge}
                        ${logisticsBadge}
                        <span class="tr-badge" style="font-size:11px;padding:3px 10px;color:${statusColor};background:${statusColor}0a;border-color:${statusColor}25;">${statusLabel}</span>
                    </div>
                </div>
                <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);">
                    ${escapeHtml(partnerName)} \u00B7 ${escapeHtml(typeLabel)} \u00B7 ${durationLabel}${remaining !== null ? ' \u00B7 ' + remaining + ' ticks left' : ''}
                </div>
            </div>`;

        // Expanded: articles + effects
        if (isExp) {
            const articles = ag.articles || [];
            html += `<div style="padding:0 18px 14px;">`;

            // Render articles (supports both old-style { type, data } and new-style { article_type, data } + { text })
            if (articles.length > 0) {
                html += `<div style="font-family:var(--font-mono);font-size:9px;font-weight:700;color:var(--text-dim);letter-spacing:0.5px;margin:8px 0 6px;">ARTICLES</div>`;
                const ROMAN_AG = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX'];
                for (let ai = 0; ai < articles.length; ai++) {
                    const art = articles[ai];
                    if (art._struck) continue;
                    const num = ROMAN_AG[ai] || (ai + 1);

                    let artLabel, summary;
                    if (art.article_type) {
                        artLabel = art.article_type.replace(/_/g, ' ').toUpperCase();
                        summary = negStructuredArticleSummary(art);
                    } else if (art.text) {
                        artLabel = 'TEXT';
                        summary = art.text;
                    } else {
                        artLabel = TRADE_ARTICLE_TYPES?.[art.type]?.label || art.type || 'Article';
                        summary = renderTradeArticleSummary(art, nationId);
                    }

                    html += `<div style="padding:3px 6px;margin-bottom:2px;background:var(--bg-card);border:1px solid var(--border-main);">
                        <div style="font-family:var(--font-mono);font-size:7px;font-weight:700;color:var(--text-secondary);">Art. ${num} \u2014 ${escapeHtml(artLabel)}</div>

                    </div>`;
                }
            }

            // Duration + auto-renew
            html += `<div style="display:flex;gap:6px;margin-top:6px;">
                <div style="padding:4px 6px;background:var(--bg-card);border:1px solid var(--border-main);">
                    <div style="font-family:var(--font-mono);font-size:6px;color:var(--text-dim);">ENACTED</div>
                    <div style="font-family:var(--font-mono);font-size:8px;font-weight:700;color:var(--text-bright);">${tickToDate(ag.enacted_at_tick)}</div>
                </div>
                ${ag.expires_at_tick ? `<div style="padding:4px 6px;background:var(--bg-card);border:1px solid var(--border-main);">
                    <div style="font-family:var(--font-mono);font-size:6px;color:var(--text-dim);">EXPIRES</div>
                    <div style="font-family:var(--font-mono);font-size:8px;font-weight:700;color:var(--text-bright);">${tickToDate(ag.expires_at_tick)}</div>
                </div>` : ''}
                ${ag.auto_renew ? `<div style="padding:4px 6px;background:var(--bg-card);border:1px solid var(--border-main);">
                    <div style="font-family:var(--font-mono);font-size:7px;color:var(--green);">AUTO-RENEW</div>
                </div>` : ''}
                <div style="padding:4px 8px;background:var(--bg-card);border:1px solid var(--border-main);display:flex;align-items:center;">
                    ${_efficiencyBadge(_agreementEfficiency(ag.id, partnerId))}

            </div>`;

            // Logistics / shipping corporations
            const shipInfo = getAgreementShippingInfo(ag.id);
            const isTradeType = ag.agreement_type !== 'retaliatory_tariff' && ag.agreement_type !== 'impose_embargo';

            // Logistics summary — single block covering both states.
            // Awarded contracts come from System B (loadAgreementShippingContracts);
            // pre-award shows the bid-window note instead of the legacy
            // "pending applications" badge that lived on the retired
            // shipping_applications table.
            if (isTradeType) {
                html += `<div style="margin-top:6px;background:var(--bg-card);border:1px solid var(--border-main);padding:8px 10px;">
                    <div style="font-family:var(--font-mono);font-size:7px;font-weight:700;letter-spacing:1px;color:var(--text-dim);margin-bottom:4px;">LOGISTICS & TRANSPORT</div>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                        <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);">Route Efficiency</span>
                        ${_efficiencyBadge(_agreementEfficiency(ag.id, partnerId))}
                    </div>`;
                if (shipInfo && shipInfo.hasLogistics) {
                    for (const corp of shipInfo.corps) {
                        html += `<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;">
                            <div style="width:24px;height:24px;background:${corp.color}15;border:1px solid ${corp.color}33;display:flex;align-items:center;justify-content:center;font-size:12px;">🚢</div>
                            <div style="font-size:9px;font-weight:700;color:var(--text-bright);">${escapeHtml(corp.name)}</div>

                    }
                    html += `<div style="font-family:var(--font-mono);font-size:7px;color:var(--text-dim);margin-top:4px;">${shipInfo.routeCount} awarded contract${shipInfo.routeCount !== 1 ? 's' : ''}</div>`;
                } else {
                    html += `<div style="font-size:11px;color:var(--text-dim);">Awaiting bids — corporations have a 3-tick window to offer; the cheapest / fastest / safest bid wins per agreement preference.</div>`;
                }
                html += `</div>`;
            }

            // Phase 7: Trade-shipping detail block. Lists every
            // shipping_contracts row spawned by this agreement (one
            // per trade_flow article, any commodity since the widened
            // 20260939 trigger), with status, winner corp, and live
            // delivery rate. The Minister of Trade additionally gets a
            // per-bid review row under each contract (20270238 +
            // 20270388 + 20270389): bids accumulate during a 3-tick
            // window; the MoT can [Accept] specific bids (force-award,
            // bypasses the window) or [Reject] any (excludes from the
            // fill). With nothing accepted, the cheapest non-rejected
            // bid wins per tick after the window closes. Each
            // freighter carries 3 units/tick (20270389), so a single
            // bid's freighters × 3 caps how much of demand it covers.
            if (phase4Contracts.length > 0) {
                html += `<div style="margin-top:6px;background:var(--bg-card);border:1px solid var(--border-main);padding:8px 10px;">
                    <div style="font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:1px;color:var(--text-dim);margin-bottom:6px;">🚢 TRADE SHIPPING</div>`;
                for (const c of phase4Contracts) {
                    let lineColor, lineLabel;
                    const missed = Number(c.consecutive_missed_payments) || 0;
                    const commodityLabel = (c.commodity || 'units').replace(/_/g, ' ');
                    const winners = Array.isArray(c.winning_bids) ? c.winning_bids : [];
                    if (winners.length > 0) {
                        // Live multi-winner: list each carrier and the units they deliver.
                        // Units, not freighters — 20270389 changed the helper to report
                        // units_won at 3 units/freighter, so the suffix has to say so.
                        const totalWon = Number(c.total_units_won) || 0;
                        const demand   = Number(c.volume_required) || 0;
                        const carriers = winners
                            .map(w => `${w.corp_name || 'Corp'} ${Number(w.units_won) || 0}u`)
                            .join(', ');
                        const prefix = missed > 0 ? `⚠ ` : '';
                        lineColor = missed > 0 ? 'var(--red)'
                                  : (totalWon >= demand ? 'var(--green)' : 'var(--amber, #b8860b)');
                        lineLabel = `${prefix}${totalWon}/${demand} ${commodityLabel}/tick · ${carriers}` +
                                    (missed > 0 ? ` · ${missed} missed payment${missed === 1 ? '' : 's'}` : '');
                    } else if (c.status === 'awarded' && c.winner_faction_name) {
                        // Legacy single-winner fallback (older 'awarded' contracts).
                        if (missed > 0) {
                            lineColor = 'var(--red)';
                            lineLabel = `⚠ ${c.volume_required} ${commodityLabel}/tick · ${c.winner_faction_name} · ${missed} missed payment${missed === 1 ? '' : 's'}`;
                        } else {
                            lineColor = 'var(--green)';
                            lineLabel = `${c.volume_required} ${commodityLabel}/tick · ${c.winner_faction_name}`;
                        }
                    } else if (c.status === 'open') {
                        lineColor = 'var(--amber, #b8860b)';
                        const ticksLeft = c.expires_at_tick != null ? Math.max(0, c.expires_at_tick - currentTk) : 0;
                        lineLabel = `Awaiting offers · ${c.volume_required} ${commodityLabel}/tick · closes in ${ticksLeft} tick${ticksLeft === 1 ? '' : 's'}`;
                    } else if (c.status === 'completed') {
                        lineColor = 'var(--text-dim)';
                        lineLabel = `Completed`;
                    } else if (c.status === 'cancelled') {
                        lineColor = 'var(--text-dim)';
                        lineLabel = `Cancelled`;
