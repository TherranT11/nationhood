// NEGOTIATIONS BOX
// ══════════════════════════════════════════════════════
async function renderNegotiationsBox() {
    const body = document.getElementById('negotiations-body');
    if (!body) return;
    body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading...</div></div>';

    if (!currentNation) {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">No nation data.</div></div>';
        return;
    }

    try {
        // Fetch pending/active diplomatic proposals
        const { data: proposals } = await _supabase
            .from('diplomatic_proposals')
            .select('*')
            .in('status', ['proposed', 'revised', 'fm_review', 'ratification', 'ratification_failed'])
            .or('proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + currentNation.id)
            .order('proposed_at_tick', { ascending: false });

        // Fetch open/active trade negotiations
        const { data: tradeNegs } = await _supabase
            .from('trade_negotiations')
            .select('*')
            .in('status', ['open', 'active'])
            .or('nation_a_id.eq.' + currentNation.id + ',nation_b_id.eq.' + currentNation.id);

        const allProposals = proposals || [];
        const allTradeNegs = tradeNegs || [];
        const totalCount = allProposals.length + allTradeNegs.length;

        const countEl = document.getElementById('negotiations-count');
        if (countEl) countEl.textContent = totalCount > 0 ? totalCount : '';

        if (totalCount === 0) {
            body.innerHTML = '<div class="empty-state"><div class="empty-state-text">No active negotiations.</div></div>';
            return;
        }

        let html = '';

        // Diplomatic proposals
        for (const p of allProposals) {
            const pd = p.proposal_data || {};
            const isOutgoing = p.proposing_nation_id === currentNation.id;
            const isIncoming = p.target_nation_id === currentNation.id;

            // Determine if we need to act
            const isRevised = p.status === 'revised';
            const revisedByUs = isRevised && (pd.revised_by_nation_id ? pd.revised_by_nation_id === currentNation.id : !isIncoming);
            const needsOurAction = (p.status === 'proposed' && isIncoming) || (isRevised && !revisedByUs);
            const isFmReview = p.status === 'fm_review';
            const isRatification = p.status === 'ratification' || p.status === 'ratification_failed';

            // Status badge
            let statusBadge = '';
            if (needsOurAction) {
                statusBadge = '<span class="badge badge--amber">Your Turn</span>';
            } else if (isFmReview && diplomaticRoles.isFM) {
                statusBadge = '<span class="badge badge--blue">FM Review</span>';
            } else if (isRatification) {
                statusBadge = '<span class="badge badge--dim">Parliament</span>';
            } else {
                statusBadge = '<span class="badge badge--dim">Awaiting</span>';
            }

            const dirClass = isOutgoing ? 'neg-direction--out' : 'neg-direction--in';
            const dirLabel = isOutgoing ? 'OUT' : 'IN';
            const title = pd.name || 'Unnamed Proposal';
            const otherNation = isOutgoing ? (pd.target_nation_name || 'Unknown') : (pd.proposer_nation_name || 'Unknown');

            // Classification
            const classification = pd.classification || '';
            const classTag = classification ? ' · ' + classification : '';

            html += `
                <div class="neg-row" data-neg-id="${p.id}" onclick="toggleNegRow('${p.id}')">
                    <span class="neg-direction ${dirClass}">${dirLabel}</span>
                    <div class="neg-info">
                        <div class="neg-title">${escapeHtml(title)}</div>
                        <div class="neg-sub">${escapeHtml(otherNation)}${classTag}</div>
                    </div>
                    <div class="neg-meta">
                        ${statusBadge}
                        <span class="neg-expand">&#9654;</span>
                    </div>
                </div>
                <div class="neg-detail" id="neg-detail-${p.id}">
                    ${renderNegDetailContent(p, pd, needsOurAction, isFmReview, isRatification)}
                </div>
            `;
        }

        // Trade negotiations
        for (const neg of allTradeNegs) {
            const isParticipant = (neg.participants || []).some(p => p.nation_id === currentNation.id);
            const needsAction = !isParticipant && neg.status === 'open';
            const isOutgoing = neg.initiated_by_nation === currentNation.id;

            const statusBadge = needsAction
                ? '<span class="badge badge--amber">Join</span>'
                : '<span class="badge badge--dim">' + (neg.status === 'open' ? 'Pending' : 'Active') + '</span>';

            const dirClass = isOutgoing ? 'neg-direction--out' : 'neg-direction--in';
            const dirLabel = isOutgoing ? 'OUT' : 'IN';
            const typeInfo = neg.agreement_type && neg.agreement_type !== 'pending' ? TRADE_AGREEMENT_TYPES[neg.agreement_type] : null;
            const typeLabel = typeInfo ? typeInfo.shortLabel : 'Trade';

            html += `
                <div class="neg-row" data-neg-id="trade-${neg.id}" onclick="toggleNegRow('trade-${neg.id}')">
                    <span class="neg-direction ${dirClass}">${dirLabel}</span>
                    <div class="neg-info">
                        <div class="neg-title">${escapeHtml(neg.agreement_name || 'Trade Negotiation')}</div>
                        <div class="neg-sub">${escapeHtml(typeLabel)}</div>
                    </div>
                    <div class="neg-meta">
                        ${statusBadge}
                        <span class="neg-expand">&#9654;</span>
                    </div>
                </div>
                <div class="neg-detail" id="neg-detail-trade-${neg.id}">
                    <div class="neg-detail-header">
                        <div class="neg-detail-title">${escapeHtml(neg.agreement_name || 'Trade Negotiation')}</div>
                        <span class="badge badge--dim">${escapeHtml(typeLabel)}</span>
                    </div>
                    <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;">
                        Status: ${neg.status} · Expires in ${Math.max(0, (neg.expires_at_tick || 0) - shardTick)} ticks
                    </div>
                    <div class="detail-actions">
                        ${needsAction && diplomaticRoles && diplomaticRoles.isMoT ? '<button class="detail-btn" onclick="joinTradeNegotiation(\'' + neg.id + '\', \'trade_minister\', ' + DIPLOMACY_CONFIG.JOIN_NEGOTIATION_MOT_AP + ')">Join as Min. of Trade (' + DIPLOMACY_CONFIG.JOIN_NEGOTIATION_MOT_AP + ' AP)</button>' : ''}
                        ${needsAction && diplomaticRoles && diplomaticRoles.isHoG ? '<button class="detail-btn" onclick="joinTradeNegotiation(\'' + neg.id + '\', \'prime_minister\', ' + DIPLOMACY_CONFIG.JOIN_NEGOTIATION_PM_AP + ')">Join as PM (' + DIPLOMACY_CONFIG.JOIN_NEGOTIATION_PM_AP + ' AP)</button>' : ''}
                        ${needsAction && diplomaticRoles && diplomaticRoles.isFM && !diplomaticRoles.isHoG ? '<button class="detail-btn" onclick="joinTradeNegotiation(\'' + neg.id + '\', \'foreign_minister\', ' + DIPLOMACY_CONFIG.JOIN_NEGOTIATION_FM_AP + ')">Join as FM (' + DIPLOMACY_CONFIG.JOIN_NEGOTIATION_FM_AP + ' AP)</button>' : ''}
                        ${isParticipant ? '<button class="detail-btn" onclick="openTradeNegotiation(\'' + neg.id + '\')">Open</button>' : ''}
                    </div>
                </div>
            `;
        }

        body.innerHTML = html;
    } catch (err) {
        console.error('Error rendering negotiations box:', err);
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Error loading negotiations.</div></div>';
    }
}

// ── Render negotiation detail content (diplomatic proposals) ──
function renderNegDetailContent(p, pd, needsOurAction, isFmReview, isRatification) {
    const articles = pd.articles || [];
    const struckIndices = new Set(pd.struck_articles || []);
    const addedArticles = pd.added_articles || [];
    const classification = pd.classification || '';
    const isTradeAgreement = p.proposal_type === 'trade_agreement';

    let html = '<div class="neg-detail-header">';
    html += '<div class="neg-detail-title">' + escapeHtml(pd.name || 'Unnamed') + '</div>';
    if (classification) html += '<span class="badge badge--dim">' + classification + '</span>';
    if (isTradeAgreement && pd.agreement_type) {
        const typeInfo = TRADE_AGREEMENT_TYPES[pd.agreement_type];
        if (typeInfo) html += '<span class="badge badge--dim" style="margin-left:4px;">' + escapeHtml(typeInfo.shortLabel) + '</span>';
    }
    html += '</div>';

    // Articles
    if (articles.length > 0) {
        for (let i = 0; i < articles.length; i++) {
            const art = articles[i];
            const isStruck = struckIndices.has(i);
            // Use trade article summary for trade agreements, fallback to text/label for diplomatic
            const artLabel = isTradeAgreement
                ? renderTradeArticleSummary(art)
                : escapeHtml(art.text || art.label || art.type || 'Unknown');
            const artTypeName = isTradeAgreement ? (TRADE_ARTICLE_TYPES[art.type]?.label || art.type) : '';
            const cardClass = isStruck ? 'article-card article-card--struck' : 'article-card';
            html += `
                <div class="${cardClass}">
                    <div class="article-card-type">Art. ${toRoman(i + 1)}${artTypeName ? ' — ' + escapeHtml(artTypeName) : ''}${isStruck ? ' — STRUCK' : ''}</div>
                    <div class="article-card-title">${isTradeAgreement ? artLabel : escapeHtml(art.text || art.label || '')}</div>
                </div>
            `;
        }
    }

    // Show added articles from counter-party
    if (addedArticles.length > 0) {
        html += '<div style="font-size:10px;color:var(--green);margin:8px 0 4px;">Counter-party additions:</div>';
        for (let i = 0; i < addedArticles.length; i++) {
            const art = addedArticles[i];
            const artLabel = isTradeAgreement ? renderTradeArticleSummary(art) : escapeHtml(art.text || art.label || 'Unknown');
            const artTypeName = isTradeAgreement ? (TRADE_ARTICLE_TYPES[art.type]?.label || art.type) : '';
            html += `
                <div class="article-card article-card--added">
                    <div class="article-card-type">Added ${toRoman(i + 1)}${artTypeName ? ' — ' + escapeHtml(artTypeName) : ''}</div>
                    <div class="article-card-title">${artLabel}</div>
                </div>
            `;
        }
    }

    // Effects summary (for diplomatic initiatives with relation/money effects)
    if (!isTradeAgreement) {
        let totalRel = 0, totalMoney = 0;
        articles.forEach((art, i) => {
            if (!struckIndices.has(i)) {
                totalRel += art.relations || 0;
                totalMoney += art.money || 0;
            }
        });
        if (totalRel || totalMoney) {
            html += '<div style="font-size:10px;color:var(--text-dim);margin:6px 0;">';
            if (totalRel) html += (totalRel > 0 ? '+' : '') + totalRel + ' Relations ';
            if (totalMoney) html += (totalMoney > 0 ? '+$' : '-$') + (Math.abs(totalMoney) / 1e6).toFixed(0) + 'M';
            html += '</div>';
        }
    }

    // Counter panel for trade agreements (hidden by default, toggled by Counter button)
    if (needsOurAction && isTradeAgreement) {
        html += '<div id="counter-panel-' + p.id + '" style="display:none;margin:8px 0;border:1px solid var(--border-subtle);padding:8px;background:var(--bg-3);">';
        html += '<div style="font-size:10px;color:var(--text-dim);margin-bottom:6px;">Strike articles and/or add new ones:</div>';

        // Strike checkboxes for original articles
        for (let i = 0; i < articles.length; i++) {
            if (struckIndices.has(i)) continue; // already struck, skip
            const art = articles[i];
            const artLabel = renderTradeArticleSummary(art);
            const artTypeName = TRADE_ARTICLE_TYPES[art.type]?.label || art.type;
            html += '<div style="display:flex;align-items:flex-start;gap:6px;margin:4px 0;">' +
                '<input type="checkbox" class="strike-checkbox" data-proposal-id="' + p.id + '" data-article-index="' + i + '" style="margin-top:2px;" />' +
                '<div style="font-size:11px;"><span style="color:var(--text-dim);">Art. ' + toRoman(i + 1) + ' — ' + escapeHtml(artTypeName) + ':</span> ' + artLabel + '</div>' +
            '</div>';
        }

        // Added articles list (from counter)
        html += '<div id="counter-added-list-' + p.id + '"></div>';

        // Add article dropdown
        const agreementType = pd.agreement_type;
        if (agreementType) {
            const existingArticles = [...articles, ...addedArticles, ...counterTradeArticles];
            const availableTypes = getAvailableArticleTypes(agreementType, existingArticles);
            if (availableTypes.length > 0) {
                html += '<div style="margin-top:8px;">';
                html += '<select id="counter-article-type-' + p.id + '" style="width:100%;background:var(--bg-3);border:1px solid var(--border-subtle);color:var(--text-primary);font-size:11px;padding:4px 8px;">';
                html += '<option value="">Add an article...</option>';
                availableTypes.forEach(at => {
                    html += '<option value="' + at.key + '">' + escapeHtml(at.label) + (at.required ? ' (required)' : '') + '</option>';
                });
                html += '</select>';
                html += '<button class="detail-btn" style="margin-top:4px;" onclick="showCounterArticleEditor(\'' + p.id + '\', \'' + agreementType + '\')">Add</button>';
                html += '</div>';
                html += '<div id="counter-article-editor-' + p.id + '"></div>';
            }
        }

        // Confirm counter button
        html += '<div style="margin-top:8px;display:flex;gap:6px;">';
        html += '<button class="detail-btn" style="color:var(--teal);border-color:var(--teal-border);" onclick="strikeTradeArticles(\'' + p.id + '\')">Send Counter</button>';
        html += '<button class="detail-btn" onclick="toggleCounterPanel(\'' + p.id + '\')">Cancel</button>';
        html += '</div>';
        html += '</div>';
    }

    // Action buttons
    html += '<div class="detail-actions">';
    if (needsOurAction) {
        html += '<button class="detail-btn" onclick="acceptProposal(\'' + p.id + '\')">Accept</button>';
        if (isTradeAgreement) {
            html += '<button class="detail-btn" onclick="toggleCounterPanel(\'' + p.id + '\')">Counter</button>';
        } else {
            html += '<button class="detail-btn" onclick="inboxStrikeArticles(\'' + p.id + '\')">Counter</button>';
        }
        html += '<button class="detail-btn" onclick="rejectProposal(\'' + p.id + '\')">Reject</button>';
    } else if (isFmReview && diplomaticRoles.isFM) {
        html += '<button class="detail-btn" onclick="fmApprove(\'' + p.id + '\')">Approve</button>';
        html += '<button class="detail-btn" onclick="fmEscalate(\'' + p.id + '\')">Escalate</button>';
        html += '<button class="detail-btn" onclick="fmReject(\'' + p.id + '\')">Reject</button>';
    } else if (isRatification && (diplomaticRoles.isFM || diplomaticRoles.isHoG)) {
        html += '<button class="detail-btn" onclick="fmEscalate(\'' + p.id + '\')">Resubmit</button>';
        html += '<button class="detail-btn" onclick="fmReject(\'' + p.id + '\')">Abandon</button>';
    }
    html += '</div>';

    return html;
}

// ══════════════════════════════════════════════════════
// DRAFT INITIATIVE BOX
// ══════════════════════════════════════════════════════
function renderDraftBox() {
    const body = document.getElementById('draft-body');
    if (!body) return;

    const statusEl = document.getElementById('draft-status');

    if (!activeDraftAction) {
        if (statusEl) statusEl.textContent = '';
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Select an action from the right panel to begin drafting.</div></div>';
        return;
    }

    if (statusEl) statusEl.textContent = 'Drafting';

    // Special branch for Recall Ambassador
    if (activeDraftAction.key === 'recall_ambassador') {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading...</div></div>';
        renderRecallAmbassadorPanel(body, statusEl);
        return;
    }

    // Special branch for Appoint Ambassador
    if (activeDraftAction.key === 'appoint_ambassador') {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading...</div></div>';
        renderAppointAmbassadorPanel(body, statusEl);
        return;
    }

    // Special branch for Trade Agreement
    if (activeDraftAction.key === 'trade_agreement') {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading...</div></div>';
        renderTradeAgreementDraftPanel(body, statusEl);
        return;
    }

    // Special branch for Retaliatory Tariff (unilateral)
    if (activeDraftAction.key === 'retaliatory_tariff_draft') {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading...</div></div>';
        renderRetaliatoryTariffDraftPanel(body, statusEl);
        return;
    }

    // Special branch for Export Subsidy (unilateral)
    if (activeDraftAction.key === 'export_subsidy_draft') {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading...</div></div>';
        renderExportSubsidyDraftPanel(body, statusEl);
        return;
    }

    const targetName = activeDraftTarget ? escapeHtml(activeDraftTarget.name) : 'None selected';

    let html = '<div class="draft-panel">';

    // Header fields
    html += '<div class="draft-header">';
    html += '<div class="draft-field"><div class="draft-field-label">Action</div><div class="draft-field-input">' + escapeHtml(activeDraftAction.label) + ' <span style="color:var(--teal);">(' + activeDraftAction.apCost + ' AP)</span></div></div>';
    let targetFieldHtml = '<select id="draft-target-select" style="width:100%;background:var(--bg-3);border:1px solid var(--border-subtle);color:var(--text-primary);font-family:var(--font-sans);font-size:12px;padding:4px 8px;" onchange="selectDraftTarget(this.value)">';
    targetFieldHtml += '<option value="">Select a nation...</option>';
    cachedOtherNations.forEach(n => {
        const sel = activeDraftTarget && activeDraftTarget.id === n.id ? ' selected' : '';
        targetFieldHtml += '<option value="' + n.id + '"' + sel + '>' + escapeHtml(n.name) + '</option>';
    });
    targetFieldHtml += '</select>';
    html += '<div class="draft-field"><div class="draft-field-label">Target Nation</div>' + targetFieldHtml + '</div>';
    html += '<div class="draft-field"><div class="draft-field-label">Name</div><input type="text" id="draft-name-input" class="draft-field-input" placeholder="Initiative name..." value="' + escapeHtml(wizardName) + '" oninput="wizardName=this.value" style="border:1px solid var(--border-subtle);background:var(--bg-3);color:var(--text-primary);padding:4px 8px;font-family:var(--font-sans);font-size:12px;width:100%;"></div>';
    html += '</div>';

    // Articles section
    html += '<div class="draft-articles">';
    if (wizardArticles.length === 0) {
        html += '<div class="empty-state" style="padding:20px 0;"><div class="empty-state-text">No articles added yet.</div></div>';
    } else {
        wizardArticles.forEach((art, i) => {
            const artLabel = art.text || art.label || art.type || 'Article ' + (i + 1);
            html += `
                <div class="draft-article">
                    <div class="draft-article-type">Art. ${toRoman(i + 1)}</div>
                    <div class="draft-article-title">${escapeHtml(artLabel)}</div>
                    <button class="draft-article-remove" onclick="removeDraftArticle(${i})">&#10005;</button>
                </div>
            `;
        });
    }
    html += '</div>';

    // Add article row
    html += '<div class="draft-add-row">';
    html += '<select id="draft-article-type" style="flex:1;background:var(--bg-3);border:1px solid var(--border-subtle);color:var(--text-primary);font-family:var(--font-sans);font-size:11px;padding:4px 8px;">';
    html += '<option value="">Select article type...</option>';
    Object.keys(INITIATIVE_TYPES).forEach(key => {
        html += '<option value="' + key + '">' + escapeHtml(INITIATIVE_TYPES[key].label) + '</option>';
    });
    html += '</select>';
    html += '<button class="detail-btn" onclick="addDraftArticle()">Add</button>';
    html += '</div>';

    // Action bar
    html += '<div class="detail-actions" style="margin-top:auto;padding-top:10px;border-top:1px solid var(--border-hair);">';
    html += '<button class="detail-btn" onclick="cancelDraft()">Cancel</button>';
    html += '<button class="detail-btn" style="color:var(--teal);border-color:var(--teal-border);" onclick="submitDraft()">Send Initiative</button>';
    html += '</div>';

    html += '</div>';
    body.innerHTML = html;
}

// ── Trade Agreement Draft Panel ──
var draftTradeMode = false;  // flag so saveWizardTradeArticle/removeWizardTradeArticle know to re-render draft panel

function renderTradeAgreementDraftPanel(body, statusEl) {
    if (statusEl) statusEl.textContent = 'Trade Agreement';
    draftTradeMode = true;

    // Reset trade state when first entering (no type selected yet)
    if (!wizardTradeAgreementType) {
        tradeArticles = [];
        wizardName = '';
    }

    let html = '<div class="draft-panel">';

    // Header: action label
    html += '<div class="draft-header">';
    html += '<div class="draft-field"><div class="draft-field-label">Action</div><div class="draft-field-input">' + escapeHtml(activeDraftAction.label) + ' <span style="color:var(--teal);">(' + activeDraftAction.apCost + ' AP)</span></div></div>';

    // Target Nation dropdown
    let targetFieldHtml = '<select id="draft-target-select" style="width:100%;background:var(--bg-3);border:1px solid var(--border-subtle);color:var(--text-primary);font-family:var(--font-sans);font-size:12px;padding:4px 8px;" onchange="selectDraftTradeTarget(this.value)">';
    targetFieldHtml += '<option value="">Select a nation...</option>';
    cachedOtherNations.forEach(n => {
        const sel = activeDraftTarget && activeDraftTarget.id === n.id ? ' selected' : '';
        targetFieldHtml += '<option value="' + n.id + '"' + sel + '>' + escapeHtml(n.name) + '</option>';
    });
    targetFieldHtml += '</select>';
    html += '<div class="draft-field"><div class="draft-field-label">Target Nation</div>' + targetFieldHtml + '</div>';
    html += '</div>';

    if (!activeDraftTarget) {
        html += '<div class="empty-state" style="padding:20px 0;"><div class="empty-state-text">Select a target nation to continue.</div></div>';
        html += '</div>';
        body.innerHTML = html;
        return;
    }

    // Trade type selection cards (bilateral only — unilateral types use separate flows)
    if (!wizardTradeAgreementType) {
        html += '<div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:10px;">Choose agreement type:</div>';
        html += '<div class="type-card-grid">';
        for (const [key, typeInfo] of Object.entries(TRADE_AGREEMENT_TYPES)) {
            if (!typeInfo.bilateral) continue;
            html += `
                <div class="type-card" onclick="selectDraftTradeType('${key}')">
                    <div class="type-card-short">${escapeHtml(typeInfo.shortLabel)}</div>
                    <div class="type-card-title">${escapeHtml(typeInfo.label)}</div>
                    <div class="type-card-effects"><span class="trade-type-tag bilateral">BILATERAL</span></div>
                </div>`;
        }
        html += '</div>';

        // Cancel
        html += '<div class="detail-actions" style="margin-top:auto;padding-top:10px;border-top:1px solid var(--border-hair);">';
        html += '<button class="detail-btn" onclick="cancelDraft()">Cancel</button>';
        html += '</div>';
        html += '</div>';
        body.innerHTML = html;
        return;
    }

    // Type selected — show article builder
    const typeInfo = TRADE_AGREEMENT_TYPES[wizardTradeAgreementType];
    const typeName = typeInfo?.label || wizardTradeAgreementType;
    const availableTypes = getAvailableArticleTypes(wizardTradeAgreementType, tradeArticles);
    const hasRequired = checkRequiredArticles(wizardTradeAgreementType, tradeArticles);

    html += '<div class="draft-field"><div class="draft-field-label">Type</div><div class="draft-field-input">' + escapeHtml(typeName) + ' <span class="badge badge--dim" style="margin-left:4px;">' + escapeHtml(typeInfo?.shortLabel || '') + '</span></div></div>';

    // Agreement name
    html += '<div class="draft-field"><div class="draft-field-label">Name</div><input type="text" id="trade-neg-name" class="draft-field-input" placeholder="e.g. ' + escapeHtml(currentNation.name) + '-' + escapeHtml(activeDraftTarget.name) + ' ' + escapeHtml(typeInfo?.shortLabel || 'Trade') + ' Agreement" value="' + escapeHtml(wizardName || '') + '" oninput="wizardName=this.value" style="border:1px solid var(--border-subtle);background:var(--bg-3);color:var(--text-primary);padding:4px 8px;font-family:var(--font-sans);font-size:12px;width:100%;"></div>';

    // Type explainer
    const explainer = getTradeTypeExplainer(wizardTradeAgreementType);
    if (explainer) {
        html += '<div class="trade-info-box info" style="margin-top:8px;">' + explainer + '</div>';
    }

    // Existing articles
    html += '<div class="draft-articles">';
    if (tradeArticles.length === 0) {
        html += '<div class="empty-state" style="padding:20px 0;"><div class="empty-state-text">No articles added yet.</div></div>';
    } else {
        for (let i = 0; i < tradeArticles.length; i++) {
            const art = tradeArticles[i];
            const summary = renderTradeArticleSummary(art);
            const artTypeInfo = TRADE_ARTICLE_TYPES[art.type];
            const artLabel = artTypeInfo?.label || art.type;
            const artDesc = artTypeInfo?.description || '';
            const isRequired = (typeInfo.required_articles || []).includes(art.type);
            html += `
                <div class="draft-article">
                    <div class="draft-article-type">
                        <span>Art. ${toRoman(i + 1)} — ${escapeHtml(artLabel)} ${isRequired ? '<span class="badge badge--teal" style="margin-left:4px;">Required</span>' : '<span class="badge badge--dim" style="margin-left:4px;">Optional</span>'}</span>
                        <span class="draft-article-remove" onclick="removeDraftTradeArticle(${i})">Remove</span>
                    </div>
                    <div class="draft-article-title" style="font-size:0.75rem;">${summary}</div>
                    <div class="draft-article-body">${escapeHtml(artDesc)}</div>
                </div>`;
        }
    }
    html += '</div>';

    // Add article dropdown + editor
    if (availableTypes.length > 0) {
        html += '<div class="draft-add-row">';
        html += '<select id="wizard-trade-article-type" style="flex:1;background:var(--bg-3);border:1px solid var(--border-subtle);color:var(--text-primary);font-family:var(--font-sans);font-size:11px;padding:4px 8px;">';
        html += '<option value="">Add article...</option>';
        availableTypes.forEach(t => {
            html += '<option value="' + t.key + '">' + escapeHtml(t.label) + (t.required ? ' (required)' : '') + '</option>';
        });
        html += '</select>';
        html += '<button class="detail-btn" onclick="showDraftTradeArticleEditor()">Add</button>';
        html += '</div>';
        html += '<div id="wizard-trade-article-editor"></div>';
    }

    // Required articles warning
    if (!hasRequired) {
        const missing = (typeInfo.required_articles || []).filter(req => !tradeArticles.some(a => a.type === req));
        const missingLabels = missing.map(m => TRADE_ARTICLE_TYPES[m]?.label || m).join(', ');
        html += '<div style="font-size:0.72rem;color:#f97316;margin-top:8px;">Required: ' + escapeHtml(missingLabels) + '</div>';
    }

    // Action bar
    html += '<div class="detail-actions" style="margin-top:auto;padding-top:10px;border-top:1px solid var(--border-hair);">';
    html += '<button class="detail-btn" onclick="cancelDraft()">Cancel</button>';
    html += '<button class="detail-btn" style="margin-left:4px;font-size:0.7rem;color:var(--text-muted);" onclick="wizardTradeAgreementType=null;tradeArticles=[];reRenderTradeDraft()">Change Type</button>';
    html += '<button class="detail-btn" style="color:var(--teal);border-color:var(--teal-border);" ' + (hasRequired ? '' : 'disabled') + ' onclick="submitDraftTradeProposal()">Send Proposal</button>';
    html += '</div>';

    html += '</div>';
    body.innerHTML = html;
}

function selectDraftTradeTarget(nationId) {
    if (!nationId) { activeDraftTarget = null; }
    else {
        const nation = cachedOtherNations.find(n => n.id === nationId);
        activeDraftTarget = nation || null;
    }
    reRenderTradeDraft();
}
window.selectDraftTradeTarget = selectDraftTradeTarget;

function selectDraftTradeType(typeKey) {
    wizardTradeAgreementType = typeKey;
    tradeArticles = [];
    wizardName = '';
    reRenderTradeDraft();
}
window.selectDraftTradeType = selectDraftTradeType;

function showDraftTradeArticleEditor() {
    const select = document.getElementById('wizard-trade-article-type');
    const articleType = select?.value;
    if (!articleType) { alert('Select an article type first.'); return; }
    const container = document.getElementById('wizard-trade-article-editor');
    if (!container) return;
    renderTradeArticleEditorLocal(container, articleType);
}
window.showDraftTradeArticleEditor = showDraftTradeArticleEditor;

function removeDraftTradeArticle(index) {
    tradeArticles.splice(index, 1);
    reRenderTradeDraft();
}
window.removeDraftTradeArticle = removeDraftTradeArticle;

function reRenderTradeDraft() {
    const body = document.getElementById('draft-body');
    const statusEl = document.getElementById('draft-status');
    if (body) renderTradeAgreementDraftPanel(body, statusEl);
}

async function submitDraftTradeProposal() {
    // Bridge draft state into wizard state for submitTradeProposal()
    wizardTargetNation = activeDraftTarget?.id;
    submitTradeProposal();
}
window.submitDraftTradeProposal = submitDraftTradeProposal;

// ══════════════════════════════════════════════════════
// RETALIATORY TARIFF — Streamlined Draft Panel
// ══════════════════════════════════════════════════════
async function renderRetaliatoryTariffDraftPanel(body, statusEl) {
    if (statusEl) { statusEl.textContent = 'Drafting'; statusEl.className = 'badge badge--amber'; }

    const apCost = 2;

    // Nation selector
    let html = '<div class="draft-panel"><div class="draft-header">';
    html += '<div class="draft-field"><div class="draft-field-label">Action</div><div class="draft-field-input">Retaliatory Tariff <span style="color:var(--red);">' + apCost + ' AP</span></div></div>';

    let targetFieldHtml = '<select id="rt-draft-target" style="width:100%;background:var(--bg-3);border:1px solid var(--border-subtle);color:var(--text-primary);font-family:var(--font-sans);font-size:12px;padding:4px 8px;" onchange="updateRTDraftTarget(this.value)">';
    targetFieldHtml += '<option value="">Select target nation...</option>';
    cachedOtherNations.forEach(n => {
        const sel = activeDraftTarget && activeDraftTarget.id === n.id ? ' selected' : '';
        targetFieldHtml += '<option value="' + n.id + '"' + sel + '>' + escapeHtml(n.name) + '</option>';
    });
    targetFieldHtml += '</select>';
    html += '<div class="draft-field"><div class="draft-field-label">Target</div>' + targetFieldHtml + '</div>';
    html += '</div>';

    if (!activeDraftTarget) {
        html += '<div class="empty-state" style="padding:20px 0;"><div class="empty-state-text">Select a target nation.</div></div></div>';
        body.innerHTML = html;
        return;
    }

    // Check for existing active RT
    const { data: existingRT } = await _supabase
        .from('trade_agreements')
        .select('id')
        .eq('status', 'active')
        .eq('agreement_type', 'retaliatory_tariff')
        .eq('nation_a_id', currentNation.id)
        .eq('nation_b_id', activeDraftTarget.id);

    if (existingRT && existingRT.length > 0) {
        html += '<div class="trade-info-box warning" style="margin:12px 14px;">You already have an active retaliatory tariff against ' + escapeHtml(activeDraftTarget.name) + '. Withdraw the existing one first.</div></div>';
        body.innerHTML = html;
        return;
    }

    html += '<div class="trade-info-box info" style="margin:8px 14px;">Impose a tariff surcharge on imports from ' + escapeHtml(activeDraftTarget.name) + '. No negotiation — your parliament ratifies.</div>';

    // Sectors
    const sectorOpts = TRADEABLE_SECTORS.map(s =>
        '<label class="trade-checkbox-option" style="margin-bottom:2px;padding:0 14px;">' +
            '<input type="checkbox" name="rt-draft-sector" value="' + s.key + '" onchange="updateRTDraftSummary()" /> ' +
            escapeHtml(s.label) +
        '</label>'
    ).join('');
    html += '<div style="padding:8px 14px 0;"><div class="draft-field-label">Sectors</div></div>';

async function submitRTDraft() {
    const btn = document.getElementById('rt-draft-submit');
    if (btn) btn.disabled = true;

    const checked = document.querySelectorAll('input[name="rt-draft-sector"]:checked');
    if (checked.length === 0) { alert('Select at least one sector.'); if (btn) btn.disabled = false; return; }

    const pct = Math.min(50, Math.max(5, parseInt(document.getElementById('rt-draft-pct')?.value || '25')));
    const durType = document.querySelector('input[name="rt-draft-dur"]:checked')?.value || 'fixed';
    const durTicks = durType === 'fixed' ? Math.min(48, Math.max(4, parseInt(document.getElementById('rt-draft-ticks')?.value || '12'))) : null;
    const apCost = 2;
    const targetId = activeDraftTarget?.id;
    const targetName = activeDraftTarget?.name || 'Unknown';

    const apResult = await deductAP(_supabase, currentFaction.id, apCost);
    if (!apResult.success) {
        alert('Not enough AP (' + apCost + ' needed).');
        if (btn) btn.disabled = false;
        return;
    }

    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const currentTick = shard?.current_tick || 0;

    const articles = [];
    checked.forEach(cb => {
        articles.push({ type: 'tariff_surcharge', data: { sector: cb.value, surcharge_pct: pct, imposer_nation_id: currentNation.id } });
    });
    articles.push({ type: 'duration', data: { duration_type: durType, duration_ticks: durTicks, auto_renew: false, withdrawal_notice_ticks: 1 } });

    const sectorNames = [];
    checked.forEach(cb => { const s = TRADEABLE_SECTORS.find(ts => ts.key === cb.value); if (s) sectorNames.push(s.label); });

    const agreementName = 'Retaliatory Tariff on ' + targetName;
    const billTitle = 'Ratify: ' + agreementName;
    const billPreamble = 'Ratification of retaliatory tariff against ' + targetName + '. Imposes +' + pct + '% tariff surcharge on ' + sectorNames.join(', ') + ' imports. ' +
        (durType === 'permanent' ? 'Duration: until revoked.' : 'Duration: ' + durTicks + ' ticks.');

    const { data: bill, error: billErr } = await _supabase.from('bills').insert({
        nation_id: currentNation.id,
        bill_type: 'ratification',
        bill_name: billTitle,
        preamble: billPreamble,
        proposed_by: currentFaction.id,
        status: 'floor',
        proposed_tick: currentTick,
        floor_tick: currentTick,
        voting_ends_tick: currentTick + GAME_CONFIG.VOTING_WINDOW_TICKS,
        trade_agreement_data: {
            type: 'retaliatory_tariff',
            imposer_nation_id: currentNation.id,
            target_nation_id: targetId,
            agreement_name: agreementName,
            articles: articles,
            duration_type: durType,
            duration_ticks: durTicks
        }
    }).select('id').single();

    if (billErr) { alert('Error: ' + billErr.message); if (btn) btn.disabled = false; return; }

    try {
        await _supabase.from('event_log').insert({
            nation_id: currentNation.id, event_name: agreementName + ' — Proposed', category: 'Trade',
            description_chosen: currentNation.name + ' has submitted a retaliatory tariff bill targeting ' + targetName + ' (' + sectorNames.join(', ') + ' at +' + pct + '%).',
            fired_at_tick: currentTick
        });
        await _supabase.from('event_log').insert({
            nation_id: targetId, event_name: 'Retaliatory Tariff Proposed', category: 'Trade',
            description_chosen: currentNation.name + ' has proposed a retaliatory tariff on your ' + sectorNames.join(', ') + ' exports (+' + pct + '%).',
            fired_at_tick: currentTick
        });
    } catch (e) { /* non-blocking */ }

    alert('Retaliatory tariff bill submitted to parliament!');
    cancelDraft();
}
window.submitRTDraft = submitRTDraft;

async function renderRecallAmbassadorPanel(body, statusEl) {
    if (statusEl) statusEl.textContent = 'Recall Ambassador';

    // Fetch active ambassadors (cached to avoid re-fetching on reason selection)
    if (!recallCachedAmbassadors) {
        const { data, error } = await _supabase
            .from('ambassadors')
            .select('*, factions(abbreviation)')
            .eq('nation_id', currentNation.id)
            .eq('is_active', true)
            .eq('status', 'active');
        if (error) console.error('Recall ambassador query error:', error);
        // Attach nation names from the nations table
        if (data && data.length > 0) {
            const targetIds = data.map(a => a.target_nation_id);
            const { data: nations } = await _supabase.from('nations').select('id, name').in('id', targetIds);
            const nationMap = {};
            (nations || []).forEach(n => { nationMap[n.id] = n; });
            data.forEach(a => { a.nations = nationMap[a.target_nation_id] || null; });
        }
        recallCachedAmbassadors = data;
    }
    const activeAmbs = recallCachedAmbassadors;

    let html = '<div class="draft-panel">';

    // Header
    html += '<div class="draft-header">';
    html += '<div class="draft-field"><div class="draft-field-label">Action</div><div class="draft-field-input">Recall Ambassador <span style="color:var(--teal);">(' + DIPLOMACY_CONFIG.RECALL_AMBASSADOR_AP + ' AP)</span></div></div>';

    // Target dropdown — only nations with active ambassadors
    if (!activeAmbs || activeAmbs.length === 0) {
        html += '</div>';
        html += '<div class="empty-state"><div class="empty-state-text">No active ambassadors to recall.</div></div>';
        html += '<div class="detail-actions" style="margin-top:auto;padding-top:10px;border-top:1px solid var(--border-hair);">';
        html += '<button class="detail-btn" onclick="cancelDraft()">Cancel</button>';
        html += '</div></div>';
        body.innerHTML = html;
        return;
    }

    html += '<div class="draft-field"><div class="draft-field-label">Target</div>';
    html += '<select id="recall-target-select" style="flex:1;background:var(--bg-3);border:1px solid var(--border-subtle);color:var(--text-primary);font-family:var(--font-sans);font-size:12px;padding:4px 8px;" onchange="selectRecallTarget(this.value)">';
    html += '<option value="">Select nation...</option>';
    activeAmbs.forEach(a => {
        const nationName = a.nations?.name || 'Unknown';
        const sel = recallTargetAmbassador && recallTargetAmbassador.id === a.id ? ' selected' : '';
        html += '<option value="' + a.id + '"' + sel + '>' + escapeHtml(nationName) + '</option>';
    });
    html += '</select></div>';
    html += '</div>';

    // Ambassador info card (shown when target selected)
    if (recallTargetAmbassador) {
        const amb = recallTargetAmbassador;
        const ambName = ((amb.ambassador_first_name || '') + ' ' + (amb.ambassador_last_name || '')).trim();
        const partyAbbr = amb.factions?.abbreviation || '—';
        const approval = amb.ambassador_approval ?? '—';
        const termLen = amb.term_length || 60;
        const termRemaining = Math.max(0, termLen - (shardTick - (amb.appointed_at_tick || 0)));
        const targetNationName = amb.nations?.name || 'Unknown';

        // Relation data
        const relScore = recallTargetRelation ? recallTargetRelation.relation_score : 30;
        const projectedScore = recallSelectedReason
            ? Math.max(-100, Math.min(100, relScore - RECALL_REASONS[recallSelectedReason].relationPenalty))
            : relScore;

        html += '<div class="recall-info-card">';
        html += '<div style="font-family:var(--font-mono);font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);margin-bottom:8px;">Ambassador Details</div>';
        html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:11.5px;">';
        html += '<div><span style="color:var(--text-dim);">Name:</span> <span style="color:var(--text-primary);font-weight:500;">' + escapeHtml(ambName) + '</span></div>';
        html += '<div><span style="color:var(--text-dim);">Party:</span> <span style="color:var(--text-primary);">' + escapeHtml(partyAbbr) + '</span></div>';
        html += '<div><span style="color:var(--text-dim);">Approval:</span> <span style="color:var(--text-primary);">' + approval + '%</span></div>';
        html += '<div><span style="color:var(--text-dim);">Term Left:</span> <span style="color:var(--text-primary);">' + termRemaining + ' ticks</span></div>';
        html += '</div>';

        // Relation bar
        html += '<div style="margin-top:10px;">';
        html += '<div style="display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:8px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);margin-bottom:4px;">';
        html += '<span>Relations with ' + escapeHtml(targetNationName) + '</span>';
        html += '<span>' + relScore + (recallSelectedReason ? ' → ' + projectedScore : '') + '</span>';
        html += '</div>';
        html += '<div class="recall-rel-bar">';
        // Current score marker
        const currentPct = Math.max(0, Math.min(100, (relScore + 100) / 2));
        html += '<div class="recall-rel-bar-fill" style="width:' + currentPct + '%;background:' + getRelationColor(relScore) + ';"></div>';
        if (recallSelectedReason) {
            const projPct = Math.max(0, Math.min(100, (projectedScore + 100) / 2));
            html += '<div class="recall-rel-bar-projected" style="left:' + projPct + '%;border-color:var(--red);"></div>';
        }
        html += '</div>';
        html += '</div>';
        html += '</div>';
    }

    // Reason selector
    html += '<div class="recall-reasons">';
    html += '<div style="font-family:var(--font-mono);font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);margin-bottom:8px;padding:0 14px;">Reason for Recall</div>';
    Object.values(RECALL_REASONS).forEach(r => {
        const isSelected = recallSelectedReason === r.key;
        const selectedClass = isSelected ? ' recall-reason-selected' : '';
        const isSevere = r.key === 'pre_war_posture';
        html += '<div class="recall-reason-card' + selectedClass + '" onclick="selectRecallReason(\'' + r.key + '\')">';
        html += '<div class="recall-reason-radio">' + (isSelected ? '<div class="recall-reason-radio-dot"></div>' : '') + '</div>';
        html += '<div style="flex:1;">';
        html += '<div style="display:flex;align-items:center;gap:6px;">';
        html += '<span style="font-size:12px;font-weight:500;color:var(--text-primary);">' + r.label + '</span>';
        if (isSevere) html += '<span style="font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--red);background:rgba(239,68,68,0.1);padding:1px 5px;border-radius:2px;">Severe</span>';
        html += '</div>';
        html += '<div style="font-size:11px;color:var(--text-muted);font-style:italic;margin-top:2px;">' + r.signal + '</div>';
        html += '<div style="display:flex;gap:8px;margin-top:4px;">';
        html += '<span style="font-family:var(--font-mono);font-size:8.5px;color:var(--red);">Relations -' + r.relationPenalty + '</span>';
        if (r.hostApprovalPenalty > 0) html += '<span style="font-family:var(--font-mono);font-size:8.5px;color:var(--amber);">Host Approval -' + r.hostApprovalPenalty + '</span>';
        if (r.pressEvent) html += '<span style="font-family:var(--font-mono);font-size:8.5px;color:var(--amber);">Press Event</span>';
        if (r.cascadeEffect) html += '<span style="font-family:var(--font-mono);font-size:8.5px;color:var(--red);">Allied Cascade ' + r.cascadeAmount + '</span>';
        html += '</div>';
        html += '</div></div>';
    });
    html += '</div>';

    // Warning box
    if (recallSelectedReason) {
        const reason = RECALL_REASONS[recallSelectedReason];
        const isSevere = reason.key === 'pre_war_posture';
        const borderColor = isSevere ? 'var(--red)' : 'var(--amber)';
        const bgColor = isSevere ? 'rgba(239,68,68,0.06)' : 'rgba(245,158,11,0.06)';
        html += '<div class="recall-warning" style="border-color:' + borderColor + ';background:' + bgColor + ';">';
        html += '<div style="font-family:var(--font-mono);font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:' + borderColor + ';margin-bottom:4px;">&#9888; Consequences</div>';
        html += '<ul style="margin:0;padding-left:16px;font-size:11px;color:var(--text-muted);line-height:1.6;">';
        html += '<li>Ambassador deactivated and embassy status set to "recalled"</li>';
        html += '<li>Relations reduced by ' + reason.relationPenalty + ' points</li>';
        html += '<li>1-3 Momentum loss to ambassador\'s party</li>';
        html += '<li>Active diplomatic initiatives cancelled</li>';
        if (reason.hostApprovalPenalty > 0) html += '<li>Host nation loses ' + reason.hostApprovalPenalty + ' Government Approval</li>';
        if (reason.cascadeEffect) html += '<li style="color:var(--red);font-weight:500;">Target\'s allies (relations ≥ 70) lose ' + Math.abs(reason.cascadeAmount) + ' relations with your nation</li>';
        html += '</ul>';
        html += '<div style="font-size:10px;color:var(--text-dim);margin-top:6px;font-style:italic;">This action is irreversible.</div>';
        html += '</div>';
    }

    // Action bar
    const canConfirm = recallTargetAmbassador && recallSelectedReason;
    html += '<div class="detail-actions" style="margin-top:auto;padding-top:10px;border-top:1px solid var(--border-hair);">';
    html += '<button class="detail-btn" style="color:var(--text-muted);" onclick="cancelDraft()">Cancel</button>';
    html += '<button class="detail-btn" style="color:' + (canConfirm ? 'var(--red)' : 'var(--text-dim)') + ';border-color:' + (canConfirm ? 'var(--red-border)' : 'var(--border-subtle)') + ';" ' + (canConfirm ? 'onclick="executeRecallAmbassador()"' : 'disabled') + '>Recall Ambassador (' + DIPLOMACY_CONFIG.RECALL_AMBASSADOR_AP + ' AP)</button>';
    html += '</div>';

    html += '</div>';
    body.innerHTML = html;
}

function getRelationColor(score) {
    if (score >= 70) return 'var(--green)';
    if (score >= 40) return 'var(--teal)';
    if (score >= 10) return 'var(--amber)';
    return 'var(--red)';
}

async function selectRecallTarget(ambassadorId) {
    if (!ambassadorId) {
        recallTargetAmbassador = null;
        recallTargetRelation = null;
        recallSelectedReason = null;
        renderDraftBox();
        return;
    }
    // Fetch ambassador details
    const { data: amb } = await _supabase
        .from('ambassadors')
        .select('*, factions(abbreviation)')
        .eq('id', ambassadorId)
        .single();
    if (!amb) { recallTargetAmbassador = null; renderDraftBox(); return; }
    // Attach target nation name
    if (amb.target_nation_id) {
        const { data: nation } = await _supabase.from('nations').select('id, name').eq('id', amb.target_nation_id).single();
        amb.nations = nation || null;
    }
    recallTargetAmbassador = amb;

    // Fetch relation
    const targetId = amb.target_nation_id;
    const natA = currentNation.id < targetId ? currentNation.id : targetId;
    const natB = currentNation.id < targetId ? targetId : currentNation.id;
    const { data: rel } = await _supabase
        .from('diplomatic_relations')
        .select('*')
        .eq('nation_a_id', natA)
        .eq('nation_b_id', natB)
        .maybeSingle();
    recallTargetRelation = rel;
    renderDraftBox();
}

function selectRecallReason(key) {
    recallSelectedReason = recallSelectedReason === key ? null : key;
    renderDraftBox();
}

async function executeRecallAmbassador() {
    // 1. Auth check
    await refreshRoles();
    if (!diplomaticRoles.isFM && !diplomaticRoles.isHoG) {
        alert('Only the Foreign Minister or Head of Government can recall ambassadors.');
        return;
    }

    // 2. Guard
    if (!recallTargetAmbassador || !recallSelectedReason) {
        alert('Please select a target and reason for recall.');
        return;
    }

    // Disable confirm button to prevent double-clicks
    const confirmBtns = document.querySelectorAll('.detail-btn');
    confirmBtns.forEach(btn => { if (btn.textContent.includes('Recall Ambassador')) { btn.disabled = true; btn.style.opacity = '0.5'; } });

    const reason = RECALL_REASONS[recallSelectedReason];
    const amb = recallTargetAmbassador;
    const targetNationId = amb.target_nation_id;
    const targetNationName = amb.nations?.name || 'Unknown';
    const ambName = ((amb.ambassador_first_name || '') + ' ' + (amb.ambassador_last_name || '')).trim();

    try {
        // 3. Get current tick
        const { data: shard } = await _supabase
            .from('shard')
            .select('current_tick')
            .eq('name', 'Alpha Shard')
            .single();
        const currentTick = shard?.current_tick || 0;

        // 4. Deduct AP
        const apResult = await deductAP(_supabase, currentFaction.id, DIPLOMACY_CONFIG.RECALL_AMBASSADOR_AP);
        if (!apResult.success) {
            alert(apResult.error || 'Insufficient AP.');
            return;
        }
        currentFaction.action_points = apResult.newAp;

        // 5. Update ambassador: recalled
        await _supabase
            .from('ambassadors')
            .update({ status: 'recalled', is_active: false, recalled_at_tick: currentTick })
            .eq('id', amb.id);

        // 6. Update embassy status + relation score
        const natA = currentNation.id < targetNationId ? currentNation.id : targetNationId;
        const natB = currentNation.id < targetNationId ? targetNationId : currentNation.id;
        const isNationA = currentNation.id < targetNationId;
        const embassyField = isNationA ? 'embassy_status_a' : 'embassy_status_b';

        const { data: relRow } = await _supabase
            .from('diplomatic_relations')
            .select('*')
            .eq('nation_a_id', natA)
            .eq('nation_b_id', natB)
            .maybeSingle();

        let oldScore = relRow ? relRow.relation_score : 30;
        let newScore = Math.max(-100, Math.min(100, oldScore - reason.relationPenalty));

        if (relRow) {
            const updateObj = { relation_score: newScore };
            updateObj[embassyField] = 'recalled';
            await _supabase.from('diplomatic_relations')
                .update(updateObj)
                .eq('nation_a_id', natA)
                .eq('nation_b_id', natB);
        } else {
            const insertObj = {
                nation_a_id: natA,
                nation_b_id: natB,
                relation_score: Math.max(-100, 30 - reason.relationPenalty)
            };
            insertObj[embassyField] = 'recalled';
            await _supabase.from('diplomatic_relations').insert(insertObj);
            newScore = insertObj.relation_score;
        }

        // 7. Security Concern: reduce target nation's gov_approval
        let approvalPenaltyApplied = false;
        if (reason.hostApprovalPenalty > 0) {
            const { data: targetNation } = await _supabase
                .from('nations')
                .select('gov_approval')
                .eq('id', targetNationId)
                .single();
            if (targetNation) {
                const newApproval = Math.max(0, Math.min(100, Math.round(Number(targetNation.gov_approval ?? 50) - reason.hostApprovalPenalty)));
                await _supabase.from('nations')
                    .update({ gov_approval: newApproval })
                    .eq('id', targetNationId);
                approvalPenaltyApplied = true;
            }
        }

        // 8. Pre-War Posture cascade: reduce relations with target's allies
        let cascadeCount = 0;
        if (reason.cascadeEffect) {
            // Find target's allies (relation_score >= 70)
            const { data: alliedRels } = await _supabase
                .from('diplomatic_relations')
                .select('nation_a_id, nation_b_id, relation_score')
                .or('nation_a_id.eq.' + targetNationId + ',nation_b_id.eq.' + targetNationId)
                .gte('relation_score', 70);

            if (alliedRels && alliedRels.length > 0) {
                for (const ar of alliedRels) {
                    const allyId = ar.nation_a_id === targetNationId ? ar.nation_b_id : ar.nation_a_id;
                    if (allyId === currentNation.id) continue; // skip self

                    // Update relation between recalling nation and this ally
                    const cA = currentNation.id < allyId ? currentNation.id : allyId;
                    const cB = currentNation.id < allyId ? allyId : currentNation.id;
                    const { data: allyRel } = await _supabase
                        .from('diplomatic_relations')
                        .select('relation_score')
                        .eq('nation_a_id', cA)
                        .eq('nation_b_id', cB)
                        .maybeSingle();

                    if (allyRel) {
                        const allyNewScore = Math.max(-100, Math.min(100, allyRel.relation_score + reason.cascadeAmount));
                        await _supabase.from('diplomatic_relations')
                            .update({ relation_score: allyNewScore })
                            .eq('nation_a_id', cA)
                            .eq('nation_b_id', cB);
                    } else {
                        await _supabase.from('diplomatic_relations').insert({
                            nation_a_id: cA,
                            nation_b_id: cB,
                            relation_score: Math.max(-100, 30 + reason.cascadeAmount)
                        });
                    }
                    cascadeCount++;
                }
            }
        }

        // 9. Cancel active diplomatic initiatives (cultural exchanges, etc.) between these nations
        // Ambassador recall invalidates all active diplomatic initiatives since they require ambassadors
        await _supabase
            .from('diplomatic_proposals')
            .update({ status: 'expired' })
            .eq('status', 'active')
            .eq('proposal_type', 'diplomatic_initiative')
            .or(
                'and(proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + targetNationId + '),' +
                'and(proposing_nation_id.eq.' + targetNationId + ',target_nation_id.eq.' + currentNation.id + ')'
            );

        // 10. Momentum penalty: 1d3 loss
        const momentumLoss = Math.floor(Math.random() * 3) + 1;
        await adjustMomentumAll(_supabase, currentNation.id, amb.faction_id, -momentumLoss, 'diplomacy:ambassador_recalled');

        // 11. Log to diplomatic_action_log
        await _supabase.from('diplomatic_action_log').insert({
            nation_id: currentNation.id,
            target_nation_id: targetNationId,
            faction_id: currentFaction.id,
            action_type: 'recall_ambassador',
            action_data: {
                ambassador_name: ambName,
                ambassador_id: amb.id,
                reason: reason.key,
                reason_label: reason.label,
                relation_penalty: reason.relationPenalty,
                old_score: oldScore,
                new_score: newScore,
                momentum_loss: momentumLoss,
                cascade_count: cascadeCount,
                host_approval_penalty: reason.hostApprovalPenalty
            },
            ap_cost: DIPLOMACY_CONFIG.RECALL_AMBASSADOR_AP,
            applied_at_tick: currentTick,
            processed: true
        });

        // 12. Fire event_log entries for all nations
        try {
            const { data: allNations } = await _supabase.from('nations').select('id');
            if (allNations && allNations.length > 0) {
                const tier = reason.key === 'pre_war_posture' ? 1 : (reason.pressEvent ? 2 : 3);
                const eventRows = allNations.map(n => ({
                    nation_id: n.id,
                    event_name: 'Ambassador Recalled',
                    event_type: 'ambassador_recalled',
                    category: 'Diplomatic',
                    description_chosen: currentNation.name + ' has recalled its ambassador from ' + targetNationName +
                        ' citing ' + reason.label.toLowerCase() + '. ' + reason.signal,
                    fired_at_tick: currentTick,
                    effects: {
                        nation_a: currentNation.name,
                        nation_b: targetNationName,
                        reason: reason.key,
                        reason_label: reason.label,
                        ambassador_name: ambName,
                        relation_change: -reason.relationPenalty,
                        tier: tier
                    }
                }));
                await _supabase.from('event_log').insert(eventRows);
            }
        } catch (e) {
            console.warn('Error firing recall event:', e);
        }

        // 13. Alert result + refresh UI
        let resultMsg = 'Ambassador Recalled\n\n' +
            ambName + ' recalled from ' + targetNationName + '\n' +
            'Reason: ' + reason.label + '\n\n' +
            'Effects:\n' +
            '  Relations: ' + oldScore + ' → ' + newScore + ' (-' + reason.relationPenalty + ')\n' +
            '  Momentum: -' + momentumLoss + ' to ' + (amb.factions?.abbreviation || 'party') + '\n';
        if (approvalPenaltyApplied) resultMsg += '  Host Approval: -' + reason.hostApprovalPenalty + '\n';
        if (cascadeCount > 0) resultMsg += '  Cascade: ' + cascadeCount + ' allied nation(s) affected (' + reason.cascadeAmount + ' relations)\n';
        resultMsg += '\nCost: ' + DIPLOMACY_CONFIG.RECALL_AMBASSADOR_AP + ' AP';

        alert(resultMsg);

        // Reset state
        recallSelectedReason = null;
        recallTargetAmbassador = null;
        recallTargetRelation = null;
        recallCachedAmbassadors = null;
        activeDraftAction = null;
        activeDraftTarget = null;
        document.querySelectorAll('.action-item.is-active').forEach(el => el.classList.remove('is-active'));

        // Refresh UI
        diplomaticRoles = await detectDiplomaticRoles(currentFaction, currentNation, currentCoalition);
        const apEl = document.getElementById('diplo-ap');
        if (apEl) apEl.textContent = (currentFaction?.action_points ?? 0) + ' AP';
        await Promise.all([renderRelationsTab(), renderDraftBox()]);

    } catch (e) {
        console.error('Error recalling ambassador:', e);
        alert('Error: ' + e.message);
    }
}

        const c = appointCandidates[appointSelectedIndex];
        const exp = Math.max(1, c.age - 26);
        html += '<span style="font-family:var(--font-mono);font-size:8.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-dim);flex:1;">' + escapeHtml(c.firstName) + ' ' + escapeHtml(c.lastName) + ' / ' + escapeHtml(c.partyAbbr) + ' / ' + exp + ' yr exp.</span>';
    } else {
        html += '<span style="flex:1;"></span>';
    }
    html += '<button class="detail-btn" style="color:var(--text-muted);" onclick="cancelDraft()">Cancel</button>';
    const canNominate = appointTargetNation && appointSelectedIndex !== null;
    html += '<button class="detail-btn" style="color:' + (canNominate ? 'var(--teal)' : 'var(--text-dim)') + ';border-color:' + (canNominate ? 'var(--teal-border)' : 'var(--border-subtle)') + ';" ' + (canNominate ? 'onclick="executeAppointAmbassador()"' : 'disabled') + '>Nominate (' + APPOINT_AMBASSADOR_AP + ' AP)</button>';
    html += '</div>';

    html += '</div>';
    body.innerHTML = html;
}

async function selectAppointTarget(nationId) {
    if (!nationId) {
        appointTargetNation = null;
        appointTargetRelation = null;
        appointCandidates = [];
        appointSelectedIndex = null;
        renderDraftBox();
        return;
    }

    // Fetch nation
    const nation = cachedOtherNations.find(n => n.id === nationId);
    if (!nation) {
        const { data } = await _supabase.from('nations').select('*').eq('id', nationId).single();
        appointTargetNation = data;
    } else {
        appointTargetNation = nation;
    }

    // Fetch relation
    const natA = currentNation.id < nationId ? currentNation.id : nationId;
    const natB = currentNation.id < nationId ? nationId : currentNation.id;
    const { data: rel } = await _supabase
        .from('diplomatic_relations')
        .select('*')
        .eq('nation_a_id', natA)
        .eq('nation_b_id', natB)
        .maybeSingle();
    appointTargetRelation = rel;

    // Generate candidates from all parties in current nation
    const { data: parties } = await _supabase
        .from('factions')
        .select('id, faction_name, abbreviation, color')
        .eq('nation_id', currentNation.id);

    appointCandidates = (parties || []).map(p => ({
        partyId: p.id,
        partyName: p.faction_name,
        partyAbbr: p.abbreviation || p.faction_name.substring(0, 3).toUpperCase(),
        partyColor: p.color || '#888',
        firstName: AMB_FIRST_NAMES[Math.floor(Math.random() * AMB_FIRST_NAMES.length)],
        lastName: AMB_LAST_NAMES[Math.floor(Math.random() * AMB_LAST_NAMES.length)],
        age: 35 + Math.floor(Math.random() * 31)
    }));
    appointSelectedIndex = null;
    renderDraftBox();
}

function selectAppointCandidate(index) {
    appointSelectedIndex = appointSelectedIndex === index ? null : index;
    renderDraftBox();
}

async function executeAppointAmbassador() {
    // 1. Auth check
    await refreshRoles();
    if (!diplomaticRoles.isFM) {
        alert('Only the Foreign Minister can appoint ambassadors.');
        return;
    }

    // 2. Guard
    if (!appointTargetNation || appointSelectedIndex === null) {
        alert('Please select a target nation and candidate.');
        return;
    }

    const candidate = appointCandidates[appointSelectedIndex];
    if (!candidate) { alert('Invalid candidate selection.'); return; }

    // 3. Double-click protection
    const confirmBtns = document.querySelectorAll('.detail-btn');
    confirmBtns.forEach(btn => { if (btn.textContent.includes('Nominate')) { btn.disabled = true; btn.style.opacity = '0.5'; } });

    try {
        // 4. Check for existing ambassador (race condition prevention)
        const { data: existing } = await _supabase
            .from('ambassadors')
            .select('id')
            .eq('nation_id', currentNation.id)
            .eq('target_nation_id', appointTargetNation.id)
            .eq('is_active', true)
            .maybeSingle();
        if (existing) {
            alert('An ambassador is already active or pending for ' + appointTargetNation.name + '.');
            return;
        }

        // Check caretaker
        const coalition = await fetchActiveCoalition(_supabase, currentNation.id);
        const isAutocracy = isGovernmentAutocracy(currentNation);
        if (!isAutocracy && coalition?.status === 'caretaker') {
            alert('Appointments are suspended during caretaker government.');
            return;
        }

        // 5. Deduct AP
        const apResult = await deductAP(_supabase, currentFaction.id, APPOINT_AMBASSADOR_AP);
        if (!apResult.success) {
            alert(apResult.error || 'Insufficient AP.');
            return;
        }
        currentFaction.action_points = apResult.newAp;

        // 6. Get current tick
        const { data: shard } = await _supabase
            .from('shard')
            .select('current_tick')
            .eq('name', 'Alpha Shard')
            .single();
        const currentTick = shard?.current_tick || 0;

        // 7. Autocracy vs Democracy
        let confirmationBillId = null;
        if (isAutocracy) {
            const { error: ambError } = await _supabase
                .from('ambassadors')
                .insert({
                    nation_id: currentNation.id,
                    target_nation_id: appointTargetNation.id,
                    faction_id: candidate.partyId,
                    ambassador_first_name: candidate.firstName,
                    ambassador_last_name: candidate.lastName,
                    ambassador_age: candidate.age,
                    status: 'active',
                    is_active: true,
                    appointed_at_tick: currentTick
                });
            if (ambError) throw ambError;
        } else {
            const billName = 'Confirmation of ' + candidate.firstName + ' ' + candidate.lastName + ' as Ambassador to ' + appointTargetNation.name;
            const preamble = 'This motion, filed by the ' + currentFaction.faction_name + ', confirms the appointment of ' + candidate.firstName + ' ' + candidate.lastName + ' (' + candidate.partyName + ') as Ambassador to ' + appointTargetNation.name + '. A simple majority (51%) is required for confirmation.';

            const { data: nominationResult, error: nominationError } = await _supabase.rpc('create_ambassador_nomination_with_bill', {
                p_nation_id: currentNation.id,
                p_target_nation_id: appointTargetNation.id,
                p_faction_id: candidate.partyId,
                p_proposed_by: currentFaction.id,
                p_first_name: candidate.firstName,
                p_last_name: candidate.lastName,
                p_age: candidate.age,
                p_current_tick: currentTick,
                p_bill_name: billName,
                p_preamble: preamble,
                p_voting_ends_tick: currentTick + (DIPLOMACY_CONFIG.AMBASSADOR_CONFIRMATION_VOTING_TICKS || 6)
            });
            if (nominationError) throw nominationError;

            const nominationRow = Array.isArray(nominationResult) ? nominationResult[0] : nominationResult;
            if (!nominationRow?.ambassador_id || !nominationRow?.bill_id) {
                throw new Error('Ambassador nomination failed: server did not return expected IDs.');
            }
            confirmationBillId = nominationRow.bill_id;

            // Auto-cast FM's party votes on confirmation bill
            const { data: parties } = await _supabase
                .from('factions')
                .select('id, faction_name')
                .eq('nation_id', currentNation.id);
            const seatData = await loadSeats(_supabase, currentNation.id, false, parties || [], currentFaction.id);
            const mySeats = seatData.allPartySeats[currentFaction.id] || 0;

            if (mySeats > 0) {
                await _supabase.from('bill_support').upsert({
                    bill_id: confirmationBillId,
                    faction_id: currentFaction.id,
                    stance: 'yes',
                    seat_count: mySeats
                });
            }
            await syncVoteTallies(_supabase, confirmationBillId);
        }

        // 8. Momentum bonus
        await adjustMomentumAll(_supabase, currentNation.id, candidate.partyId, 1, 'diplomacy:ambassador_selected');

        // 9. Alert result
        const msg = isAutocracy
            ? candidate.firstName + ' ' + candidate.lastName + ' has been appointed Ambassador to ' + appointTargetNation.name + '!'
            : candidate.firstName + ' ' + candidate.lastName + ' has been nominated as Ambassador to ' + appointTargetNation.name + '.\nA confirmation vote has been filed in Parliament.';
        alert('Ambassador ' + (isAutocracy ? 'Appointed' : 'Nominated') + '\n\n' + msg + '\n\n+1 Momentum to ' + candidate.partyName + '\nCost: ' + APPOINT_AMBASSADOR_AP + ' AP');

        // 10. Reset state
        appointTargetNation = null;
        appointCandidates = [];
        appointSelectedIndex = null;
        appointTargetRelation = null;
        appointCachedExistingAmbs = null;
        activeDraftAction = null;
        activeDraftTarget = null;
        document.querySelectorAll('.action-item.is-active').forEach(el => el.classList.remove('is-active'));

        // Refresh UI
        diplomaticRoles = await detectDiplomaticRoles(currentFaction, currentNation, currentCoalition);
        const apEl = document.getElementById('diplo-ap');
        if (apEl) apEl.textContent = (currentFaction?.action_points ?? 0) + ' AP';
        await Promise.all([renderRelationsTab(), renderDraftBox()]);

    } catch (e) {
        console.error('Error appointing ambassador:', e);
        alert('Error: ' + e.message);
    }
}

function cancelDraft() {
    activeDraftAction = null;
    activeDraftTarget = null;
    wizardArticles = [];
    wizardName = '';
    recallSelectedReason = null;
    recallTargetAmbassador = null;
    recallTargetRelation = null;
    recallCachedAmbassadors = null;
    appointTargetNation = null;
    appointCandidates = [];
    appointSelectedIndex = null;
    appointTargetRelation = null;
    appointCachedExistingAmbs = null;
    wizardTradeAgreementType = null;
    tradeArticles = [];
    draftTradeMode = false;
    document.querySelectorAll('.action-item.is-active').forEach(el => el.classList.remove('is-active'));
    renderDraftBox();
}
window.cancelDraft = cancelDraft;

async function submitDraft() {
    if (!activeDraftAction || !activeDraftTarget) {
        alert('Please select an action and target nation.');
        return;
    }
    if (!wizardName.trim()) {
        alert('Please enter a name for the initiative.');
        return;
    }
    if (wizardArticles.length === 0) {
        alert('Please add at least one article.');
        return;
    }

    // Check AP
    const apCost = activeDraftAction.apCost;
    if ((currentFaction?.action_points ?? 0) < apCost) {
        alert('Not enough AP. You need ' + apCost + ' AP.');
        return;
    }

    // Use existing wizard state variables for compatibility with submitInitiative
    wizardTargetNation = activeDraftTarget;
    wizardCategory = 'diplomatic';

    // Determine classification
    const hasMajor = wizardArticles.some(art => {
        const typeInfo = INITIATIVE_TYPES[art.type];
        return typeInfo && typeInfo.classification === 'MAJOR';
    });
    const classification = hasMajor ? 'MAJOR' : 'MINOR';

    try {
        // Deduct AP
        const apResult = await deductAP(_supabase, currentFaction.id, apCost);
        if (!apResult.success) { alert('Failed to deduct AP: ' + (apResult.error || 'Insufficient AP')); return; }

        // Build proposal
        const proposalData = {
            name: wizardName.trim(),
            classification: classification,
            articles: wizardArticles,
            proposer_nation_name: currentNation.name,
            target_nation_name: activeDraftTarget.name,
            duration_years: wizardDuration || 1,
            proposer_faction_id: currentFaction.id
        };

        const { error } = await _supabase.from('diplomatic_proposals').insert({
            proposing_nation_id: currentNation.id,
            target_nation_id: activeDraftTarget.id,
            proposed_by_faction_id: currentFaction.id,
            proposal_type: 'diplomatic_initiative',
            proposal_tier: hasMajor ? 2 : 1,
            status: 'proposed',
            proposed_at_tick: shardTick,
            proposal_data: proposalData
        });

        if (error) {
            console.error('Submit error:', error);
            alert('Error submitting initiative: ' + error.message);
            return;
        }

        // Update AP display
        currentFaction.action_points = apResult.newAp;
        const apEl = document.getElementById('diplo-ap');
        if (apEl) apEl.textContent = currentFaction.action_points + ' AP';

        alert('Initiative submitted!');
        cancelDraft();
        await renderNegotiationsBox();
    } catch (err) {
        console.error('Submit draft error:', err);
        alert('Error: ' + err.message);
    }
}
window.submitDraft = submitDraft;
