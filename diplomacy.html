// ── Articles: Add / Delete / Strike — shared lock guard ──
//
// Mirrors the server-side trigger in 20261005_trade_negotiation_lock_trigger.sql.
// Re-fetches the latest negotiation state and aborts the action if the row is
// locked (both parties approved OR status='ratification'). Belt-and-suspenders:
// the trigger blocks the UPDATE anyway, but catching it client-side gives the
// player a clean message instead of a generic 'check_violation' from PostgREST.
async function _negFetchLockState(negotiationId) {
    const { data, error } = await _supabase.from('trade_negotiations')
        .select('status, approved_by_a, approved_by_b')
        .eq('id', negotiationId)
        .single();
    if (error || !data) return { locked: false, fetchFailed: true };
    const locked = data.status === 'ratification'
        || (!!data.approved_by_a && !!data.approved_by_b);
    return { locked, fetchFailed: false, status: data.status };
}

// ── Articles: Add ──

let _negArticleAdding = false;

async function negArticleAdd() {
    if (_negArticleAdding || !_activeNegModal) return;
    const textarea = document.getElementById('trade-neg-article-text');
    if (!textarea) return;
    const text = textarea.value.trim();
    if (!text) return;

    _negArticleAdding = true;

    const lockState = await _negFetchLockState(_activeNegModal.negotiationId);
    if (lockState.locked) {
        alert('This agreement is locked — both parties have approved and ratification is in motion. To edit articles, the agreement would need to fail in parliament first.');
        _negArticleAdding = false;
        negArticleCancelForm();
        return;
    }

    const newArticle = {
        id: crypto.randomUUID(),
        text: text,
        author_nation_id: _activeNegModal.myNationId,
        author_nation_name: _activeNegModal.myNationName,
        added_at_tick: 0,
        strike_requested_by: null,
        strike_requested_by_name: null,
    };

    // Get current tick
    const { data: shardData } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    newArticle.added_at_tick = shardData?.current_tick || 0;

    // Fetch current articles from DB (avoid stale state)
    const { data: negRow, error: fetchErr } = await _supabase.from('trade_negotiations')
        .select('draft_articles, agreement_type')
        .eq('id', _activeNegModal.negotiationId)
        .single();

    if (fetchErr) { alert('Failed to load articles: ' + fetchErr.message); _negArticleAdding = false; return; }

    const current = negRow?.draft_articles || [];
    const updated = [...current, newArticle];

    const { error: updateErr } = await _supabase.from('trade_negotiations')
        .update({ draft_articles: updated, agreement_type: inferAgreementType(updated, negRow.agreement_type) })
        .eq('id', _activeNegModal.negotiationId);

    if (updateErr) { alert('Failed to add article: ' + updateErr.message); _negArticleAdding = false; return; }

    _activeNegModal.articles = updated;
    negArticleCancelForm();
    negArticlesRender();
    _negArticleAdding = false;
}

// ── Articles: Delete (author only) ──

let _negArticleDeleting = false;
async function negArticleDelete(articleId) {
    if (!_activeNegModal || _negArticleDeleting) return;
    if (!confirm('Delete this article?')) return;
    _negArticleDeleting = true;

    const lockState = await _negFetchLockState(_activeNegModal.negotiationId);
    if (lockState.locked) {
        alert('This agreement is locked — both parties have approved and ratification is in motion. Articles cannot be deleted.');
        _negArticleDeleting = false;
        return;
    }

    const { data: negRow, error: fetchErr } = await _supabase.from('trade_negotiations')
        .select('draft_articles, agreement_type')
        .eq('id', _activeNegModal.negotiationId)
        .single();
    if (fetchErr || !negRow) { alert('Failed to load articles.'); _negArticleDeleting = false; return; }

    const current = negRow.draft_articles || [];
    const updated = current.filter(a => a.id !== articleId);

    const { error } = await _supabase.from('trade_negotiations')
        .update({ draft_articles: updated, agreement_type: inferAgreementType(updated, negRow.agreement_type) })
        .eq('id', _activeNegModal.negotiationId);

    if (error) { alert('Failed to delete article: ' + error.message); _negArticleDeleting = false; return; }

    _activeNegModal.articles = updated;
    negArticlesRender();
    _negArticleDeleting = false;
}

// ── Articles: Request to Strike (other party's articles) ──

let _negArticleStriking = false;
async function negArticleRequestStrike(articleId) {
    if (!_activeNegModal || _negArticleStriking) return;
    _negArticleStriking = true;

    const lockState = await _negFetchLockState(_activeNegModal.negotiationId);
    if (lockState.locked) {
        alert('This agreement is locked — both parties have approved and ratification is in motion. Articles cannot be struck.');
        _negArticleStriking = false;
        return;
    }

    const { data: negRow, error: fetchErr } = await _supabase.from('trade_negotiations')
        .select('draft_articles, agreement_type')
        .eq('id', _activeNegModal.negotiationId)
        .single();
    if (fetchErr || !negRow) { alert('Failed to load articles.'); _negArticleStriking = false; return; }

    const current = negRow.draft_articles || [];
    const updated = current.map(a => {
        if (a.id !== articleId) return a;
        return {
            ...a,
            strike_requested_by: _activeNegModal.myNationId,
            strike_requested_by_name: _activeNegModal.myNationName,
        };
    });

    const { error } = await _supabase.from('trade_negotiations')
        .update({ draft_articles: updated, agreement_type: inferAgreementType(updated, negRow.agreement_type) })
        .eq('id', _activeNegModal.negotiationId);

    if (error) { alert('Failed to request strike: ' + error.message); _negArticleStriking = false; return; }

    _activeNegModal.articles = updated;
    negArticlesRender();
    _negArticleStriking = false;
}

// ── Agreement voting [0/2] → [1/2] → [2/2] → ratification bills ──

function negAgreementRender() {
    const btn = document.getElementById('trade-neg-agreement-btn');
    if (!btn || !_activeNegModal) return;

    const myApproved = _activeNegModal.weAreA ? _activeNegModal.approvedByA : _activeNegModal.approvedByB;
    const theirApproved = _activeNegModal.weAreA ? _activeNegModal.approvedByB : _activeNegModal.approvedByA;
    const count = (myApproved ? 1 : 0) + (theirApproved ? 1 : 0);

    // Disable article buttons at 2/2
    const addStructBtn = document.getElementById('trade-neg-add-structured-btn');
    const addTextBtn = document.getElementById('trade-neg-add-article-btn');
    const nameAgreementBtn = document.getElementById('trade-neg-name-btn');
    if (count === 2) {
        if (addStructBtn) { addStructBtn.disabled = true; addStructBtn.style.opacity = '0.3'; }
        if (addTextBtn) { addTextBtn.disabled = true; addTextBtn.style.opacity = '0.3'; }
        if (nameAgreementBtn) { nameAgreementBtn.disabled = true; nameAgreementBtn.style.opacity = '0.3'; }
    } else {
        if (addStructBtn) { addStructBtn.disabled = false; addStructBtn.style.opacity = '1'; }
        if (addTextBtn) { addTextBtn.disabled = false; addTextBtn.style.opacity = '1'; }
        if (nameAgreementBtn) { nameAgreementBtn.disabled = false; nameAgreementBtn.style.opacity = '1'; }
    }

    if (count === 2) {
        btn.textContent = 'Agreement [2/2]';
        btn.style.color = '#4ade80';
        btn.style.borderColor = 'rgba(74,222,128,0.3)';
        btn.disabled = true;
    } else if (myApproved) {
        btn.textContent = 'Agreement [' + count + '/2]';
        btn.style.color = '#5aafa5';
        btn.style.borderColor = 'rgba(90,175,165,0.3)';
        btn.disabled = false;
    } else {
        btn.textContent = 'Not in Agreement [' + count + '/2]';
        btn.style.color = 'var(--text-dim)';
        btn.style.borderColor = 'var(--border-main)';
        btn.disabled = false;
    }

    // Send to Parliament — appears only once both sides have approved and the
    // negotiation hasn't already been sent. Ratification status hides it entirely.
    const sendBtn = document.getElementById('trade-neg-send-parliament-btn');
    if (sendBtn) {
        const alreadyRatifying = _activeNegModal.status === 'ratification';
        sendBtn.style.display = (count === 2 && !alreadyRatifying) ? '' : 'none';
    }
}

async function sendTradeToParliamentFromModal() {
    if (!_activeNegModal || !_activeNegModal.negotiationId) return;
    if (!_activeNegModal.chatRole?.canChat) {
        alert('You need a diplomatic role to send the agreement to parliament.');
        return;
    }
    const m = _activeNegModal;
    // Defensive: hide-condition already gates this on count=2 and
    // status != 'ratification', but a stale local state could let
    // the click through. Skip if already ratifying.
    if (m.status === 'ratification') return;

    const sendBtn = document.getElementById('trade-neg-send-parliament-btn');
    if (sendBtn) { sendBtn.disabled = true; sendBtn.textContent = 'Sending…'; }
    try {
        const factionId = _worldState?.faction?.id;
        const { data: shardData } = await _supabase.from('shard')
            .select('current_tick').eq('name', 'Alpha Shard').single();
        const tick = shardData?.current_tick || 0;

        const billIds = await createTradeRatificationBills(m, tick, factionId);

        const { error } = await _supabase.from('trade_negotiations').update({
            status:     'ratification',
            bill_a_id:  billIds.bill_a_id,
            bill_b_id:  billIds.bill_b_id,
        }).eq('id', m.negotiationId);
        if (error) { alert('Failed: ' + error.message); return; }

        m.status    = 'ratification';
        m.bill_a_id = billIds.bill_a_id;
        m.bill_b_id = billIds.bill_b_id;
        negAgreementRender();
    } catch (err) {
        alert(err.message || 'Failed to send to parliament.');
    } finally {
        if (sendBtn) { sendBtn.disabled = false; sendBtn.textContent = 'Send to Parliament'; }
    }
}
window.sendTradeToParliamentFromModal = sendTradeToParliamentFromModal;

let _negAgreementToggling = false;

// Bill creation for trade-agreement ratification. Called from two
// sites: negAgreementToggle (when the second party approves) and
// sendTradeToParliamentFromModal (the manual recovery button —
// shown when count=2 but status somehow didn't flip).
//
// Inserts a ratification bill into each party's parliament and
// fires the matching event_log entry. Returns { bill_a_id,
// bill_b_id } so the caller can write them into the negotiation
// row. Throws on insert failure.
async function createTradeRatificationBills(m, tick, factionId) {
    const [{ data: nationARow }, { data: nationBRow }] = await Promise.all([
        _supabase.from('nations').select('name').eq('id', m.weAreA ? m.myNationId : m.partnerNationId).single(),
        _supabase.from('nations').select('name').eq('id', m.weAreA ? m.partnerNationId : m.myNationId).single(),
    ]);
    const nameA = nationARow?.name || 'Unknown';
    const nameB = nationBRow?.name || 'Unknown';
    const agreementName = m.agreementName || 'Trade Agreement';
    const billTitle = 'Ratify: ' + agreementName;
    const billPreamble = 'Ratification of the trade agreement "' + agreementName + '" between ' +
        nameA + ' and ' + nameB + '. A YES vote enacts the agreement; a NO vote rejects it.';

    const VOTING_WINDOW = 3;
    const billBase = {
        bill_type: 'ratification', bill_name: billTitle, preamble: billPreamble,
        trade_negotiation_id: m.negotiationId, status: 'floor',
        proposed_tick: tick, floor_tick: tick,
        voting_ends_tick: tick + VOTING_WINDOW,
    };

    const nationAId = m.weAreA ? m.myNationId : m.partnerNationId;
    const nationBId = m.weAreA ? m.partnerNationId : m.myNationId;
    const approverA = m.weAreA ? factionId : m.approvedByA;
    const approverB = m.weAreA ? m.approvedByB : factionId;

    const billA = { ...billBase, nation_id: nationAId, proposed_by: approverA };
    const billB = { ...billBase, nation_id: nationBId, proposed_by: approverB };

    const [resultA, resultB] = await Promise.all([
        _supabase.from('bills').insert(billA).select('id').single(),
        _supabase.from('bills').insert(billB).select('id').single(),
    ]);

    if (resultA.error) throw new Error('Error creating ratification bill: ' + resultA.error.message);
    if (resultB.error) throw new Error('Error creating ratification bill: ' + resultB.error.message);

    // "Sent for ratification" event. The actual "signed" event fires
    // from resolveTradeRatificationBill (bills.js) once both bills pass.
    const ratifyDesc = 'The ' + agreementName + ' has been sent to both parliaments for ratification.';
    _supabase.from('event_log').insert([nationAId, nationBId].map(nid => ({
        nation_id: nid,
        event_name: agreementName + ' — Ratification',
        category: 'trade',
        description_chosen: ratifyDesc,
        fired_at_tick: tick,
    }))).then(() => {});

    return {
        bill_a_id: resultA.data?.id || null,
        bill_b_id: resultB.data?.id || null,
    };
}

async function negAgreementToggle() {
    if (_negAgreementToggling || !_activeNegModal) return;
    if (!_activeNegModal.chatRole?.canChat) {
        alert('You need a diplomatic role to vote on the agreement.');
        return;
    }
    if (_activeNegModal.status === 'cancelled' || _activeNegModal.status === 'ratification') {
        return;
    }
    if (!_activeNegModal.agreementName || !_activeNegModal.agreementName.trim()) {
        alert('The agreement must be named before both parties can agree. Click "Name Agreement" first.');
        return;
    }
    const m = _activeNegModal;
    const myApproved = m.weAreA ? m.approvedByA : m.approvedByB;
    const approveCol = m.weAreA ? 'approved_by_a' : 'approved_by_b';
    const approveRoleCol = m.weAreA ? 'approved_by_a_role' : 'approved_by_b_role';
    const approveTickCol = m.weAreA ? 'approved_at_a_tick' : 'approved_at_b_tick';

    _negAgreementToggling = true;

    const { data: shardData } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const tick = shardData?.current_tick || 0;

    if (myApproved) {
        // Revoke approval
        const updateData = { [approveCol]: null, [approveRoleCol]: null, [approveTickCol]: null };
        const { error } = await _supabase.from('trade_negotiations').update(updateData).eq('id', m.negotiationId);
        if (error) { alert('Failed to revoke agreement: ' + error.message); _negAgreementToggling = false; return; }
        if (m.weAreA) { m.approvedByA = null; } else { m.approvedByB = null; }
    } else {
        // Grant approval
        const factionId = _worldState?.faction?.id;
        const role = m.chatRole?.role || 'trade_minister';
        const updateData = { [approveCol]: factionId, [approveRoleCol]: role, [approveTickCol]: tick };

        // Check if other side already approved — if so, generate ratification bills
        const theirApproved = m.weAreA ? m.approvedByB : m.approvedByA;
        if (theirApproved) {
            updateData.status = 'ratification';
            try {
                const billIds = await createTradeRatificationBills(m, tick, factionId);
                updateData.bill_a_id = billIds.bill_a_id;
                updateData.bill_b_id = billIds.bill_b_id;
            } catch (err) {
                alert(err.message || 'Failed to create ratification bills.');
                _negAgreementToggling = false;
                return;
            }
        }

        const { error } = await _supabase.from('trade_negotiations').update(updateData).eq('id', m.negotiationId);
        if (error) { alert('Failed to approve: ' + error.message); _negAgreementToggling = false; return; }
        if (m.weAreA) { m.approvedByA = factionId; } else { m.approvedByB = factionId; }

        if (theirApproved) {
            m.status = 'ratification';
            alert('Both sides have approved! Ratification bills have been submitted to both parliaments.');
        }
    }

    negAgreementRender();
    _negAgreementToggling = false;
}

window.negArticleShowForm = negArticleShowForm;
window.negArticleCancelForm = negArticleCancelForm;
window.negArticleAdd = negArticleAdd;
window.negArticleDelete = negArticleDelete;
window.negArticleRequestStrike = negArticleRequestStrike;
window.negAgreementToggle = negAgreementToggle;

// ── Modal close ──

function closeTradeNegModal() {
    document.getElementById('trade-neg-modal').classList.remove('active');
    if (_negChatChannel) {
        _supabase.removeChannel(_negChatChannel);
        _negChatChannel = null;
    }
    _activeNegModal = null;
    _negChatSending = false;
    _negWithdrawing = false;
    _negModalOpening = false;
    _negArticleAdding = false;
    _negArticleDeleting = false;
    _negArticleStriking = false;
    _negAgreementToggling = false;
    _negStructuredAdding = false;
    _negStructuredType = null;
    _negNaming = false;

    // Re-paint the agreements panel so the unread dot openTradeNegModal
    // optimistically removed from _tradeNegUnreadById actually leaves the
    // DOM. Cheap — uses the cached list, no refetch.
    renderTradeAgreements();

    // Refresh trade notification badge (user may have read messages or agreed)
    checkTradeNotifications().then(() => renderDiploSubtabs()).catch(() => {});
}

let _negWithdrawing = false;

async function withdrawFromNegotiations() {
    if (!_activeNegModal || _negWithdrawing) return;
    if (_activeNegModal.status === 'cancelled') {
        alert('This negotiation has already been ended.');
        return;
    }
    const chatRole = _activeNegModal.chatRole;
    if (!chatRole?.canChat) {
        alert('You need a diplomatic role to withdraw from negotiations.');
        return;
    }

    const partnerName = _activeNegModal.partnerNationName || 'Unknown';
    if (!confirm('Withdraw from trade negotiations with ' + partnerName + '?\n\nThis will end the negotiation and cannot be undone.')) return;

    _negWithdrawing = true;

    const negId = _activeNegModal.negotiationId;
    const myNationId = _activeNegModal.myNationId;
    const partnerNationId = _activeNegModal.partnerNationId;

    // Get current tick
    const { data: shardData } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const tick = shardData?.current_tick || 0;

    // 1. Update negotiation status to cancelled
    const { error: statusErr } = await _supabase.from('trade_negotiations')
        .update({ status: 'cancelled', concluded_at_tick: tick })
        .eq('id', negId);
    if (statusErr) { alert('Failed to withdraw: ' + statusErr.message); _negWithdrawing = false; return; }

    // 2. Insert system message into chat
    await _supabase.from('negotiation_messages').insert({
        negotiation_id: negId,
        sender_nation_id: myNationId,
        sender_faction_id: _worldState.faction.id,
        sender_role: chatRole.role,
        sender_display_name: 'System',
        message_text: chatRole.displayName + ' has withdrawn from negotiations.',
        is_system: true,
        sent_at_tick: tick,
    });

    // 3. Build event text — always attribute to Minister of Trade in the event
    const withdrawerName = chatRole.displayName.split(' (')[0];
    const roleSuffix = chatRole.role === 'trade_minister' ? 'Minister of Trade '
        : 'Prime Minister ';
    const eventText = roleSuffix + withdrawerName + ' has decided to end trade negotiations with ' + partnerName + '.';

    // 4. Log events for BOTH nations (visible on Nation Local, Nation World, Executive Timeline)
    await _supabase.from('event_log').insert([
        {
            nation_id: myNationId,
            event_name: 'Trade Negotiations Withdrawn',
            trigger_key: 'trade_negotiation_withdrawn',
            category: 'trade',
            description_chosen: eventText,
            fired_at_tick: tick,
        },
        {
            nation_id: partnerNationId,
            event_name: 'Trade Negotiations Withdrawn',
            trigger_key: 'trade_negotiation_withdrawn',
            category: 'trade',
            description_chosen: eventText,
            fired_at_tick: tick,
        },
    ]);

    // 5. Close modal and refresh agreements list
    _activeNegModal.status = 'cancelled';
    _negWithdrawing = false;
    closeTradeNegModal();

    // Refresh the trade data so the ongoing negotiation disappears
    try { await loadTradeAgreements(); } catch (_) {}
    renderTradeAgreements();
    renderTradePartners();
}

window.openTradeNegModal = openTradeNegModal;
window.closeTradeNegModal = closeTradeNegModal;
window.withdrawFromNegotiations = withdrawFromNegotiations;
</script>
