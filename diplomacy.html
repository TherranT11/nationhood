// ==================== ROLE DETECTION ====================

async function detectDiplomaticRoles(faction, nation, coalition) {
    const roles = {
        isHoG: false,
        isFM: false,
        isMoT: false,
        ambassadorTo: []  // array of { target_nation_id, target_nation_name }
    };

    if (!faction || !nation) return roles;

    // Head of Government
    if (isGovernmentAutocracy(nation)) {
        roles.isHoG = nation.ruling_faction_id === faction.id;
    } else if (isGovernmentPresidential(nation)) {
        // Presidential: president's faction is stored as lead_party_id in virtual coalition
        roles.isHoG = coalition?.lead_party_id === faction.id;
    } else {
        // Parliamentary: prime minister from coalition allocations
        const alloc = coalition?.ministry_allocations || {};
        roles.isHoG = alloc.prime_minister === faction.id;
    }

    // Foreign Minister: check coalition allocation first, then fall back to ministries table
    const alloc = coalition?.ministry_allocations || {};
    roles.isFM = alloc.foreign === faction.id;

    // Minister of Trade: check coalition allocation first, then fall back to ministries table
    roles.isMoT = alloc.trade === faction.id;

    // In autocracies, ministers are stored in the ministries table, not coalition allocations
    if (!roles.isFM || !roles.isMoT) {
        const { data: ministryEntries } = await _supabase
            .from('ministries')
            .select('ministry_key, party_id')
            .eq('nation_id', nation.id)
            .in('ministry_key', ['foreign', 'trade'])
            .eq('is_active', true);
        (ministryEntries || []).forEach(entry => {
            if (entry.party_id === faction.id) {
                if (entry.ministry_key === 'foreign') roles.isFM = true;
                if (entry.ministry_key === 'trade') roles.isMoT = true;
            }
        });
    }

    // Ambassadors: fetch ALL active ambassadors from this nation, then filter by faction in JS
    // (avoids compound .eq() filter issues with RLS policies)
    try {
        const { data: allNationAmbassadors, error: ambErr } = await _supabase
            .from('ambassadors')
            .select('*, factions(abbreviation)')
            .eq('nation_id', nation.id)
            .eq('is_active', true)
            .eq('status', 'active');

        if (ambErr) {
            console.warn('Ambassador query error:', JSON.stringify(ambErr));
        } else if (allNationAmbassadors && allNationAmbassadors.length > 0) {
            // Filter to ambassadors belonging to this faction
            const myAmbassadors = allNationAmbassadors.filter(a => a.faction_id === faction.id);

            console.log('[Diplo] Active ambassadors from nation:', allNationAmbassadors.length,
                '| Matched to faction ' + faction.id + ':', myAmbassadors.length,
                '| Faction IDs in DB:', allNationAmbassadors.map(a => a.faction_id));

            if (myAmbassadors.length > 0) {
                // Look up target nation names separately (avoids FK join issues)
                const targetIds = myAmbassadors.map(a => a.target_nation_id);
                const { data: targetNations } = await _supabase
                    .from('nations')
                    .select('id, name')
                    .in('id', targetIds);
                const nationNameMap = {};
                (targetNations || []).forEach(n => { nationNameMap[n.id] = n.name; });

                roles.ambassadorTo = myAmbassadors.map(a => ({
                    id: a.id,
                    target_nation_id: a.target_nation_id,
                    target_nation_name: nationNameMap[a.target_nation_id] || 'Unknown',
                    appointed_at_tick: a.appointed_at_tick,
                    term_length: a.term_length || 60,
                    ambassador_first_name: a.ambassador_first_name,
                    ambassador_last_name: a.ambassador_last_name,
                    factions: a.factions
                }));
            }
        }
    } catch (e) {
        console.warn('Could not load ambassadors:', e);
    }

    return roles;
}

// Re-fetch roles fresh from DB before critical actions (prevents stale cache exploits)
async function refreshRoles() {
    diplomaticRoles = await detectDiplomaticRoles(currentFaction, currentNation, currentCoalition);
    await renderDiploHeader();
    return diplomaticRoles;

// Check if the current player has any qualifying diplomatic role
function hasAnyDiplomaticRole() {
    return diplomaticRoles && (
        diplomaticRoles.isHoG ||
        diplomaticRoles.isFM ||
        diplomaticRoles.isMoT ||
        (diplomaticRoles.ambassadorTo && diplomaticRoles.ambassadorTo.length > 0)
    );
}

async function renderDiploHeader() {
    const header = document.getElementById('diplo-header');
    if (!header || !currentNation) return;

    // Count active agreements and pending proposals for our nation
    let activeCount = 0;
    let pendingCount = 0;
    try {
        const { count: ac } = await _supabase
            .from('diplomatic_proposals')
            .select('*', { count: 'exact', head: true })
            .eq('status', 'active')
            .or('proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + currentNation.id);
        activeCount = ac || 0;

        const { count: pc } = await _supabase
            .from('diplomatic_proposals')
            .select('*', { count: 'exact', head: true })
            .in('status', ['proposed', 'revised'])
            .or('proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + currentNation.id);
        pendingCount = pc || 0;
    } catch (e) { console.warn('Error fetching header counts:', e); }

    const roleBadges = [];
    if (diplomaticRoles.isHoG) {
        const hogLabel = isGovernmentAutocracy(currentNation) ? 'Head of Government' : isGovernmentPresidential(currentNation) ? 'President' : 'Prime Minister';
        roleBadges.push('<span class="diplo-role-badge role-hog">' + hogLabel + '</span>');
    }
    if (diplomaticRoles.isFM)  roleBadges.push('<span class="diplo-role-badge role-fm">Foreign Minister</span>');
    if (diplomaticRoles.isMoT) roleBadges.push('<span class="diplo-role-badge role-mot">Minister of Trade</span>');
    diplomaticRoles.ambassadorTo.forEach(a => {
        roleBadges.push('<span class="diplo-role-badge role-amb">Ambassador to ' + escapeHtml(a.target_nation_name) + '</span>');
    });
    if (roleBadges.length === 0) {
        roleBadges.push('<span class="diplo-role-badge role-none">No Diplomatic Role</span>');
    }

    header.innerHTML = `
        <div class="diplo-header-roles">${roleBadges.join('')}</div>
        <div class="diplo-header-stats">
            <span class="diplo-header-stat">${activeCount} Active Agreement${activeCount !== 1 ? 's' : ''}</span>
            <span class="diplo-header-stat">${pendingCount} Pending</span>
        </div>
    `;

    // Populate ambassador dropdown in toolbar (if element exists)
    const dropdown = document.getElementById('diplo-amb-dropdown');
    const select = document.getElementById('amb-select');
    if (dropdown && select) {
        if (diplomaticRoles.ambassadorTo.length > 0) {
            dropdown.style.display = '';
            select.innerHTML = '<option value="">Select...</option>' +
                diplomaticRoles.ambassadorTo.map(a =>
                    '<option value="' + a.target_nation_id + '">' + a.target_nation_name + '</option>'
                ).join('');
        } else {
            dropdown.style.display = 'none';
        }
    }

    // Refresh tab notification badges
    updateTabBadges();
}

// ==================== TAB BADGES ====================

async function updateTabBadges() {
    if (!currentNation) return;
    try {
        // Count items needing action on Initiative tab:
        // Open trade negotiations where we're the recipient (not yet in participants)
        const { data: openNegs } = await _supabase
            .from('trade_negotiations')
            .select('participants')
            .eq('status', 'open')
            .or('nation_a_id.eq.' + currentNation.id + ',nation_b_id.eq.' + currentNation.id);

        let initiativeCount = 0;
        (openNegs || []).forEach(n => {
            const participants = n.participants || [];
            if (!participants.some(p => p.nation_id === currentNation.id)) {
                initiativeCount++;
            }
        });

        const initBadge = document.getElementById('initiative-badge');
        if (initBadge) initBadge.textContent = initiativeCount > 0 ? initiativeCount : '';

        // Count items needing action on Inbox tab:
        // Incoming proposals needing our response + revised proposals sent back to us
        const { data: inboxProposals } = await _supabase
            .from('diplomatic_proposals')
            .select('status, proposing_nation_id, target_nation_id')
            .in('status', ['proposed', 'revised', 'fm_review', 'ratification', 'ratification_failed'])
            .or('proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + currentNation.id);

        let inboxCount = 0;
        (inboxProposals || []).forEach(p => {
            const isIncoming = p.target_nation_id === currentNation.id;
            const isRevised = p.status === 'revised';
            const pd = p.proposal_data || {};
            const revisedByUs = isRevised && (pd.revised_by_nation_id ? pd.revised_by_nation_id === currentNation.id : !isIncoming);
            if ((p.status === 'proposed' && isIncoming) || (isRevised && !revisedByUs)) {
                inboxCount++;
            } else if (p.status === 'fm_review' && diplomaticRoles.isFM) {
                inboxCount++;
            } else if ((p.status === 'ratification' || p.status === 'ratification_failed') && (diplomaticRoles.isFM || diplomaticRoles.isHoG)) {
                inboxCount++;
            }
        });

        const inboxBadge = document.getElementById('inbox-badge');
        if (inboxBadge) inboxBadge.textContent = inboxCount > 0 ? inboxCount : '';
    } catch (e) {
        console.warn('Error updating tab badges:', e);
    }
}

async function renderRelationsTab() {
    const panel = document.getElementById('tab-relations');
    if (!panel) return;
    panel.innerHTML = '<p style="color:#6b6a5e;font-style:italic;text-align:center;padding:20px;">Loading nations...</p>';

    if (!currentNation) {
        panel.innerHTML = '<p class="diplo-tab-placeholder">No nation data available.</p>';
        return;
    }

    try {
        // Parallel fetch: all nations, relations, ambassadors (ours + theirs), active agreements
        const [nationsRes, relationsRes, ambassadorsRes, theirAmbassadorsRes, agreementsRes] = await Promise.all([
            _supabase.from('nations').select('*').order('name'),
            _supabase.from('diplomatic_relations').select('*')
                .or('nation_a_id.eq.' + currentNation.id + ',nation_b_id.eq.' + currentNation.id),
            _supabase.from('ambassadors').select('*, factions(abbreviation)')
                .eq('nation_id', currentNation.id).eq('is_active', true).eq('status', 'active'),
            _supabase.from('ambassadors').select('*, factions(abbreviation)')
                .eq('target_nation_id', currentNation.id).eq('is_active', true).eq('status', 'active'),
            _supabase.from('diplomatic_proposals').select('proposing_nation_id, target_nation_id')
                .eq('status', 'active')
                .or('proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + currentNation.id)
        ]);

        if (nationsRes.error) {
            console.error('Nations query error:', nationsRes.error);
            panel.innerHTML = '<p style="color:#f44;text-align:center;padding:20px;">Error loading nations: ' + escapeHtml(nationsRes.error.message) + '</p>';
            return;
        }

        const allNations = nationsRes.data || [];
        const allRelations = relationsRes.data || [];
        const ourAmbassadors = ambassadorsRes.data || [];
        const theirAmbassadors = theirAmbassadorsRes.data || [];
        const activeAgreements = agreementsRes.data || [];

        // Filter out own nation
        const otherNations = allNations.filter(n => n.id !== currentNation.id);

        if (otherNations.length === 0) {
            panel.innerHTML = '<p class="diplo-tab-placeholder">No other nations found. (' + allNations.length + ' total in database)</p>';
            return;
        }

        let cardsHTML = '';
        for (const nation of otherNations) {
            // Find relation for this pair
            const relation = allRelations.find(r =>
                (r.nation_a_id === currentNation.id && r.nation_b_id === nation.id) ||
                (r.nation_a_id === nation.id && r.nation_b_id === currentNation.id)
            );

            // Check for ceasefire among active agreements
            // (Simple heuristic: not available from this query, default false)
            const hasCeasefire = false;

            const score = relation?.relation_score ?? 35;
            const tier = getRelationTier(score, hasCeasefire);

            // Find our ambassador to this nation
            const ambassador = ourAmbassadors.find(a => a.target_nation_id === nation.id);
            const ambName = ambassador
                ? ((ambassador.ambassador_first_name || '') + ' ' + (ambassador.ambassador_last_name || '')).trim()
                : null;
            const ambParty = ambassador?.factions?.abbreviation ? ' (' + ambassador.factions.abbreviation + ')' : '';
            const isMyAmbassadorship = ambassador && ambassador.faction_id === currentFaction?.id;

            // Find their ambassador to us
            const theirAmb = theirAmbassadors.find(a => a.nation_id === nation.id);
            const theirAmbName = theirAmb
                ? ((theirAmb.ambassador_first_name || '') + ' ' + (theirAmb.ambassador_last_name || '')).trim()
                : null;
            const theirAmbParty = theirAmb?.factions?.abbreviation ? ' (' + theirAmb.factions.abbreviation + ')' : '';

            // Embassy status: open only if both nations have an active ambassador to each other
            const embassyStatus = (ambassador && theirAmb) ? 'open' : 'closed';
            const embassyColor = embassyStatus === 'open' ? '#4ade80' : '#ef4444';

            // Count agreements with this nation
            const agreementCount = activeAgreements.filter(a =>

            ).length;

            const flagUrl = FLAG_URLS[nation.name] || null;
            const barWidth = Math.max(0, Math.min(100, score));
            const barColor = getRelationBarColor(score);

            cardsHTML += `
                <div class="nation-card" data-nation-name="${escapeHtml(nation.name)}" data-nation-id="${nation.id}" id="nation-card-${nation.id}">
                    <div class="nation-card-header" onclick="toggleNationCard('${nation.id}')">
                        ${flagUrl ? '<img src="' + flagUrl + '" class="nation-card-flag" />' : '<div class="nation-card-flag-placeholder"></div>'}
                        <div class="nation-card-info">
                            <div class="nation-card-name">${escapeHtml(nation.name)}</div>
                            <div class="nation-card-meta">
                                <span class="relation-badge ${tier.cssClass}">${tier.label}</span>
                                <span class="nation-card-embassy" style="color:${embassyColor};">${embassyStatus === 'open' ? 'Embassy Open' : embassyStatus === 'closed' ? 'Embassy Closed' : 'No Embassy'}</span>
                                ${agreementCount > 0 ? '<span class="nation-card-agreements">' + agreementCount + ' agreement' + (agreementCount > 1 ? 's' : '') + '</span>' : ''}
                            </div>
                            <div class="nation-card-ambassadors">
                                <span class="nation-card-amb">${ambName ? 'Our Amb: ' + escapeHtml(ambName) + '<span class="amb-party-tag">' + escapeHtml(ambParty) + '</span>' + (isMyAmbassadorship ? ' <em>(you)</em>' : '') : '<span style="color:#666;">No Ambassador</span>'}</span>
                                <span class="nation-card-amb">${theirAmbName ? 'Their Amb: ' + escapeHtml(theirAmbName) + '<span class="amb-party-tag">' + escapeHtml(theirAmbParty) + '</span>' : '<span style="color:#666;">No Counterpart</span>'}</span>
                            </div>
                            <div class="relations-bar">

                        </div>

    } catch (err) {

        panel.innerHTML = '<p style="color:#f44;text-align:center;padding:20px;">Error loading nations.</p>';
    }
}

// ==================== AGREEMENTS TAB ====================

async function renderAgreementsTab() {
    const panel = document.getElementById('tab-agreements');
    if (!panel) return;
    panel.innerHTML = '<p style="color:#6b6a5e;font-style:italic;text-align:center;padding:20px;">Loading agreements...</p>';

    if (!currentNation) {
        panel.innerHTML = '<p class="diplo-tab-placeholder">No nation data available.</p>';
        return;
    }

    try {
        const { data: agreements } = await _supabase
            .from('diplomatic_proposals')
            .select('*')
            .eq('status', 'active')
            .or('proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + currentNation.id)
            .order('activated_at_tick', { ascending: false });

        let html = '';
        for (const ag of (agreements || [])) {
            const pd = ag.proposal_data || {};
            const articles = pd.articles || [];
            const struckIndices = new Set(pd.struck_articles || []);

            // Determine classification from proposal data or infer from articles
            let classification = pd.classification || null;
            if (!classification && articles.length > 0) {
                // Check if any article is MAJOR
                const hasMajor = articles.some((art, i) => {
                    if (struckIndices.has(i)) return false;
                    const typeInfo = INITIATIVE_TYPES[art.type];
                    return typeInfo && typeInfo.classification === 'MAJOR';
                });
                classification = hasMajor ? 'MAJOR' : 'MINOR';
            }

            // Parties
            const proposerName = pd.proposer_nation_name || 'Unknown';
            const targetName = pd.target_nation_name || 'Unknown';

            // Dates
            const signedTick = ag.activated_at_tick;
            const durationYears = pd.duration_years || 0;
            const expiresTick = signedTick != null && durationYears > 0
                ? signedTick + (durationYears * GAME_CONFIG.TICKS_PER_YEAR)
                : null;

            // Active articles and effects
            let totalRel = 0, totalMoney = 0;
            const termsHTML = articles.map((art, i) => {
                const isStruck = struckIndices.has(i);
                if (!isStruck) {
                    totalRel += art.relations || 0;
                    totalMoney += art.money || 0;
                }
                // Backwards-compatible: old proposals may have art.type, new ones have art.text
                const artLabel = art.text || art.label || art.type || 'Unknown';
                return '<div class="agreement-card-term' + (isStruck ? ' term-struck' : '') + '">' +
                    '<span class="proposal-article-num">Art. ' + toRoman(i + 1) + '</span> ' +
                    '<span class="proposal-article-label">' + escapeHtml(artLabel) + '</span>' +
                    (isStruck ? ' <span class="struck-label">STRUCK</span>' : '') +
                '</div>';
            }).join('');

            // Effects tags
            const relStr = totalRel > 0 ? '+' + totalRel + ' Relations' : totalRel < 0 ? totalRel + ' Relations' : '';
            const moneyStr = totalMoney > 0 ? '+$' + (totalMoney / 1e6).toFixed(0) + 'M' : totalMoney < 0 ? '-$' + (Math.abs(totalMoney) / 1e6).toFixed(0) + 'M' : '';
            let effectsHTML = '';
            if (relStr) effectsHTML += '<span class="effect-tag effect-rel">' + relStr + '</span>';
            if (moneyStr) effectsHTML += '<span class="effect-tag effect-money">' + moneyStr + '</span>';

            // Withdraw button — only FM or HoG can withdraw
            let withdrawHTML = '';
            if (diplomaticRoles.isFM || diplomaticRoles.isHoG) {
                const penalty = totalRel * 2;
                const penaltyStr = penalty > 0 ? '-' + penalty + ' Relations penalty' : '';
                withdrawHTML = '<button class="agreement-withdraw-btn" onclick="withdrawAgreement(\'' + ag.id + '\')" title="' + escapeHtml(penaltyStr) + '">Withdraw</button>';
            }

            // Classification badge
            const classBadge = classification
                ? '<span class="classification-badge classification-' + classification.toLowerCase() + '">' + classification + '</span>'
                : '';

            // Agreement type badge (from ag.proposal_data.agreement_type or inferred)
            const agreementType = pd.agreement_type || ag.proposal_type || 'diplomatic_initiative';
            const typeLabel = INITIATIVE_TYPES[agreementType]?.label || '';

            html += `
                <div class="agreement-card">
                    <div class="agreement-card-header">
                        <div class="agreement-card-name">${escapeHtml(pd.name || 'Unnamed Agreement')}</div>
                        <div class="agreement-card-badges">
                            ${classBadge}
                            ${withdrawHTML}
                        </div>
                    </div>
                    <div class="agreement-card-meta">
                        ${escapeHtml(proposerName)} &amp; ${escapeHtml(targetName)}
                        ${typeLabel ? ' &middot; ' + escapeHtml(typeLabel) : ''}
                        ${durationYears ? ' &middot; ' + durationYears + ' year' + (durationYears !== 1 ? 's' : '') : ''}
                    </div>
                    ${termsHTML ? '<div class="agreement-card-terms">' + termsHTML + '</div>' : ''}
                    ${effectsHTML ? '<div class="agreement-card-effects">' + effectsHTML + '</div>' : ''}
                    <div class="agreement-card-dates">
                        <span>Signed: ${signedTick != null ? tickToDate(signedTick) : '—'}</span>
                        <span>Expires: ${expiresTick != null ? tickToDate(expiresTick) : '—'}</span>
                    </div>
                </div>
            `;
        }

        // ── Trade Agreements Section ──
        let tradeHtml = '';
        try {
            const { data: tradeAgs } = await _supabase
                .from('trade_agreements')
                .select('*')
                .eq('status', 'active')
                .or('nation_a_id.eq.' + currentNation.id + ',nation_b_id.eq.' + currentNation.id)
                .order('enacted_at_tick', { ascending: false });

            if (tradeAgs && tradeAgs.length > 0) {
                tradeHtml += '<div class="diplo-section-title" style="margin-top:20px;">Active Trade Agreements</div>';

                // Fetch nation names
                const tradeNationIds = new Set();
                tradeAgs.forEach(a => { tradeNationIds.add(a.nation_a_id); tradeNationIds.add(a.nation_b_id); });
                const { data: tradeNations } = await _supabase.from('nations').select('id, name').in('id', [...tradeNationIds]);
                const tradeNameMap = {};
                (tradeNations || []).forEach(n => tradeNameMap[n.id] = n.name);

                for (const ta of tradeAgs) {
                    const typeInfo = TRADE_AGREEMENT_TYPES[ta.agreement_type];
                    const partnerId = ta.nation_a_id === currentNation.id ? ta.nation_b_id : ta.nation_a_id;
                    const partnerName = tradeNameMap[partnerId] || 'Unknown';
                    const ticksLeft = ta.expires_at_tick ? ta.expires_at_tick - shardTick : null;
                    const statusClass = !ticksLeft ? '' : ticksLeft <= 3 ? 'expiring' : 'active';
                    const iconHtml = typeInfo ? (TRADE_TYPE_ICONS[typeInfo.icon] || '') : '';

                    const articlesHtml = (ta.articles || []).map((art, i) =>
                        '<div class="agreement-card-term">' +
                            '<span class="proposal-article-num">Art. ' + toRoman(i + 1) + '</span> ' +
                            '<span class="proposal-article-label">' + escapeHtml(renderTradeArticleSummary(art)) + '</span>' +
                        '</div>'
                    ).join('');

                    // Withdraw button (hide if withdrawal already pending)
                    const withdrawalPending = ta.withdrawn_at_tick != null && ta.withdrawn_at_tick > shardTick;
                    const withdrawalTicksLeft = withdrawalPending ? ta.withdrawn_at_tick - shardTick : 0;
                    let withdrawBtn = '';
                    if (withdrawalPending) {
                        withdrawBtn = '<span class="trade-neg-status-value expiring" title="Withdrawal notice filed">Withdrawing in ' + withdrawalTicksLeft + ' tick' + (withdrawalTicksLeft !== 1 ? 's' : '') + '</span>';
                    } else if (diplomaticRoles.isFM || diplomaticRoles.isHoG) {
                        const noticeLabel = ta.withdrawal_notice_ticks ? ta.withdrawal_notice_ticks + ' tick notice' : 'immediate';
                        withdrawBtn = '<button class="agreement-withdraw-btn" onclick="withdrawTradeAgreement(\'' + ta.id + '\')" title="' + noticeLabel + '">Withdraw</button>';
                    }

                    tradeHtml += `
                        <div class="agreement-card">
                            <div class="agreement-card-header">
                                <div class="agreement-card-name" style="display:flex;align-items:center;gap:8px;">
                                    ${typeInfo ? '<div class="trade-type-icon ' + typeInfo.icon + '" style="width:24px;height:24px;font-size:0.8rem;">' + iconHtml + '</div>' : ''}
                                    ${escapeHtml(ta.agreement_name || 'Unnamed')}
                                </div>
                                <div class="agreement-card-badges">
                                    <span class="trade-type-short">${typeInfo ? escapeHtml(typeInfo.shortLabel) : ''}</span>
                                    ${withdrawBtn}
                                </div>
                            </div>
                            <div class="agreement-card-meta">
                                ${ta.agreement_type === 'retaliatory_tariff'
                                    ? (ta.nation_a_id === currentNation.id
                                        ? 'Imposed on ' + escapeHtml(partnerName)
                                        : 'Imposed by ' + escapeHtml(partnerName))
                                    : escapeHtml(currentNation.name) + ' &amp; ' + escapeHtml(partnerName)}
                                ${typeInfo ? ' &middot; ' + escapeHtml(typeInfo.label) : ''}
                                ${ta.duration_ticks ? ' &middot; ' + ta.duration_ticks + ' ticks' : ' &middot; Permanent'}
                                ${ta.auto_renew ? ' (auto-renew)' : ''}
                            </div>
                            ${articlesHtml ? '<div class="agreement-card-terms">' + articlesHtml + '</div>' : ''}
                            <div class="agreement-card-dates">
                                <span>Enacted: ${ta.enacted_at_tick != null ? tickToDate(ta.enacted_at_tick) : '—'}</span>
                                <span>Expires: ${ta.expires_at_tick != null ? tickToDate(ta.expires_at_tick) : 'Never'}</span>
                                ${ticksLeft != null && ticksLeft <= 5 ? '<span class="trade-neg-status-value expiring">' + ticksLeft + ' ticks left</span>' : ''}
                            </div>
                        </div>
                    `;
                }
            }
        } catch (e) { console.warn('Error loading trade agreements:', e); }

        if (!html && !tradeHtml) {
            panel.innerHTML = '<p class="diplo-tab-placeholder">No active agreements.</p>';
        } else {
            if (html) html = '<div class="diplo-section-title">Diplomatic Agreements</div>' + html;
            panel.innerHTML = html + tradeHtml;
        }
    } catch (err) {
        console.error('Error rendering agreements tab:', err);
        panel.innerHTML = '<p style="color:#f44;text-align:center;padding:20px;">Error loading agreements.</p>';
    }
}

async function withdrawTradeAgreement(agreementId) {
    await refreshRoles();
    if (!diplomaticRoles.isFM && !diplomaticRoles.isHoG) {
        alert('Only the Foreign Minister or Head of Government can withdraw trade agreements.');
        return;
    }

    const { data: ta } = await _supabase.from('trade_agreements').select('*').eq('id', agreementId).single();
    if (!ta) { alert('Could not load agreement.'); return; }

    // Nation guard: only parties to the agreement can withdraw
    if (ta.nation_a_id !== currentNation.id && ta.nation_b_id !== currentNation.id) {
        alert('Your nation is not a party to this agreement.');
        return;
    }

    if (ta.status !== 'active') {
        alert('This agreement is not active (status: ' + ta.status + ').');
        return;
    }

    const isRetaliatory = ta.agreement_type === 'retaliatory_tariff';
    const noticeTicks = isRetaliatory ? 0 : (ta.withdrawal_notice_ticks || 3);
    const articles = ta.articles || [];

    // Retaliatory tariffs: lifting them improves relations (no penalties)
    if (isRetaliatory) {
        // Calculate relations bonus: +maxSurcharge/4 (partial recovery)
        let maxSurcharge = 0;
        for (const art of articles) {
            if (art.type === 'tariff_surcharge') {
                maxSurcharge = Math.max(maxSurcharge, art.data?.surcharge_pct || 0);
            }
        }
        const relBonus = Math.round(maxSurcharge / 4);

        let confirmMsg = 'Lift "' + (ta.agreement_name || 'retaliatory tariff') + '"?\n\n' +
            'This will take effect immediately.\n';
        if (relBonus > 0) confirmMsg += 'Relations improvement: +' + relBonus + '\n';
        if (!confirm(confirmMsg)) return;

        // Immediately withdraw (no notice period for unilateral actions)
        await _supabase.from('trade_agreements').update({
            status: 'withdrawn',
            withdrawn_at_tick: shardTick,
            withdrawal_notice_at: shardTick,
            withdrawn_by_nation: currentNation.id
        }).eq('id', agreementId);

        // Apply relations improvement
        if (relBonus > 0) {
            const otherNationId = (ta.nation_a_id === currentNation.id) ? ta.nation_b_id : ta.nation_a_id;
            const nA = currentNation.id < otherNationId ? currentNation.id : otherNationId;
            const nB = currentNation.id < otherNationId ? otherNationId : currentNation.id;
            const { data: rel } = await _supabase.from('diplomatic_relations')
                .select('id, relation_score')
                .eq('nation_a_id', nA).eq('nation_b_id', nB).maybeSingle();
            if (rel) {
                const newScore = Math.max(-100, Math.min(100, (rel.relation_score || 0) + relBonus));
                await _supabase.from('diplomatic_relations')
                    .update({ relation_score: newScore }).eq('id', rel.id);
            }
        }

        alert('Retaliatory tariff lifted immediately.' + (relBonus > 0 ? ' Relations improved by +' + relBonus + '.' : ''));
        await renderAgreementsTab();
        return;
    }

    // Check for negotiated breach_penalty article
    const breachArt = articles.find(a => a.type === 'breach_penalty');
    const breachData = breachArt ? breachArt.data : null;

    // Use negotiated penalties if available, otherwise fall back to generic formula
    const relPenalty = breachData ? (breachData.relations_penalty || 0) : (noticeTicks <= 1 ? 5 : noticeTicks <= 3 ? 3 : 1);
    const financialPenalty = breachData ? (breachData.financial_penalty || 0) : 0;

    let confirmMsg = 'Withdraw from "' + (ta.agreement_name || 'trade agreement') + '"?\n\n' +
        'Notice period: ' + noticeTicks + ' ticks\n';
    if (relPenalty > 0) confirmMsg += 'Relations penalty: -' + relPenalty + '\n';
    if (financialPenalty > 0) confirmMsg += 'Financial penalty: $' + financialPenalty + 'M\n';
    confirmMsg += '\nThis action cannot be undone.';

    if (!confirm(confirmMsg)) return;

    // File withdrawal notice — agreement stays active through the notice period.
    // The tick processor will set status='withdrawn' when withdrawn_at_tick is reached.
    await _supabase.from('trade_agreements').update({
        withdrawn_at_tick: shardTick + noticeTicks,
        withdrawal_notice_at: shardTick,
        withdrawn_by_nation: currentNation.id
    }).eq('id', agreementId);

    // Apply breach penalties
    const otherNationId = (ta.nation_a_id === currentNation.id) ? ta.nation_b_id : ta.nation_a_id;
    const nA = currentNation.id < otherNationId ? currentNation.id : otherNationId;
    const nB = currentNation.id < otherNationId ? otherNationId : currentNation.id;

    // Apply relations penalty
    if (relPenalty > 0) {
        const { data: rel } = await _supabase.from('diplomatic_relations')
            .select('id, relation_score')
            .eq('nation_a_id', nA).eq('nation_b_id', nB).maybeSingle();
        if (rel) {
            const newScore = Math.max(-100, Math.min(100, (rel.relation_score || 0) - relPenalty));
            await _supabase.from('diplomatic_relations')
                .update({ relation_score: newScore }).eq('id', rel.id);
        }
    }

    // Apply financial penalty (deduct from withdrawing nation's treasury)
    if (financialPenalty > 0) {
        const { data: nation } = await _supabase.from('nations')
            .select('id, treasury').eq('id', currentNation.id).single();
        if (nation) {
            const newTreasury = Math.max(0, (Number(nation.treasury) || 0) - financialPenalty);
            await _supabase.from('nations')
                .update({ treasury: newTreasury }).eq('id', currentNation.id);
        }
    }

    alert('Withdrawal notice filed. Agreement will terminate in ' + noticeTicks + ' ticks.' +
        (financialPenalty > 0 ? ' $' + financialPenalty + 'M deducted from treasury.' : ''));
    await renderAgreementsTab();
}

async function withdrawAgreement(agreementId) {
    // Authorization: must be FM or HoG
    await refreshRoles();
    if (!diplomaticRoles.isFM && !diplomaticRoles.isHoG) {
        alert('Only the Foreign Minister or Head of Government can withdraw agreements.');
        return;
    }

    // Fetch the agreement
    const { data: ag, error: fetchErr } = await _supabase
        .from('diplomatic_proposals')
        .select('*')
        .eq('id', agreementId)
        .single();

    if (fetchErr || !ag) { alert('Could not load agreement.'); return; }

    const pd = ag.proposal_data || {};
    const articles = pd.articles || [];
    const struckIndices = new Set(pd.struck_articles || []);

    // Calculate relations penalty (2x the bonus)
    let totalRel = 0;
    articles.forEach((art, i) => {
        if (!struckIndices.has(i)) totalRel += art.relations || 0;
    });
    const penalty = totalRel * 2;

    if (!confirm(
        'Withdraw from "' + (pd.name || 'Agreement') + '"?\n\n' +
        (penalty > 0 ? 'This will cost -' + penalty + ' Relations (2x the bonus).\n' : '') +
        'This action cannot be undone.'
    )) return;

    // Get current tick
    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const currentTick = shard?.current_tick || 0;

    // Set agreement to withdrawn
    const { error: updateErr } = await _supabase
        .from('diplomatic_proposals')
        .update({ status: 'withdrawn', withdrawn_at_tick: currentTick })
        .eq('id', agreementId);

    if (updateErr) { alert('Error withdrawing: ' + updateErr.message); return; }

    // Apply relations penalty
    if (penalty > 0) {
        const nationA = ag.proposing_nation_id < ag.target_nation_id ? ag.proposing_nation_id : ag.target_nation_id;
        const nationB = ag.proposing_nation_id < ag.target_nation_id ? ag.target_nation_id : ag.proposing_nation_id;

        const { data: rel } = await _supabase
            .from('diplomatic_relations')
            .select('id, relation_score, active_treaties')
            .eq('nation_a_id', nationA)
            .eq('nation_b_id', nationB)
            .maybeSingle();

        if (rel) {
            const newScore = Math.max(-100, Math.min(100, (rel.relation_score || 0) - penalty));
            const treaties = Array.isArray(rel.active_treaties)
                ? rel.active_treaties.filter(t => t !== agreementId)
                : [];
            await _supabase.from('diplomatic_relations')
                .update({ relation_score: newScore, active_treaties: treaties })
                .eq('id', rel.id);
        }
    }

    alert('"' + (pd.name || 'Agreement') + '" withdrawn.');

    // Refresh
    await renderAgreementsTab();
    { const _apEl = document.getElementById('diplo-ap'); if (_apEl) _apEl.textContent = (currentFaction?.action_points ?? 0) + ' AP'; };
}

// ==================== INBOX TAB ====================

let inboxFilter = 'all'; // all, action, pending, fm_review, ratification

async function renderInboxTab(filter) {
    const panel = document.getElementById('tab-inbox');
    if (!panel) return;

    if (filter) inboxFilter = filter;

    panel.innerHTML = '<p style="color:#6b6a5e;font-style:italic;text-align:center;padding:20px;">Loading inbox...</p>';

    if (!currentNation) {
        panel.innerHTML = '<p class="diplo-tab-placeholder">No nation data available.</p>';
        return;
    }

    try {
        // Fetch all non-active, non-rejected proposals involving our nation
        const { data: proposals } = await _supabase
            .from('diplomatic_proposals')
            .select('*')
            .in('status', ['proposed', 'revised', 'fm_review', 'ratification', 'ratification_failed'])
            .or('proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + currentNation.id)
            .order('proposed_at_tick', { ascending: false });

        const allProposals = proposals || [];

        // Count by category for filter badges
        const counts = { all: allProposals.length, action: 0, pending: 0, fm_review: 0, ratification: 0 };
        allProposals.forEach(p => {
            const isIncoming = p.target_nation_id === currentNation.id;
            const isRevised = p.status === 'revised';
            const rpd = p.proposal_data || {};
            const revisedByUs = isRevised && (rpd.revised_by_nation_id ? rpd.revised_by_nation_id === currentNation.id : !isIncoming);
            const needsOurAction = (p.status === 'proposed' && isIncoming) || (isRevised && !revisedByUs);
            const isFmReview = p.status === 'fm_review';
            const isRatification = p.status === 'ratification' || p.status === 'ratification_failed';

            if (needsOurAction) counts.action++;
            else if (isFmReview) counts.fm_review++;
            else if (isRatification) counts.ratification++;
            else counts.pending++;
        });

        // Build filter bar
        let filterHTML = '<div class="inbox-filters">';
        const filters = [
            { key: 'all', label: 'All', count: counts.all },
            { key: 'action', label: 'Action Needed', count: counts.action },
            { key: 'pending', label: 'Pending', count: counts.pending },
            { key: 'fm_review', label: 'FM Review', count: counts.fm_review },
            { key: 'ratification', label: 'Ratification', count: counts.ratification }
        ];
        filters.forEach(f => {
            const countBadge = f.count > 0 ? '<span class="inbox-filter-count">' + f.count + '</span>' : '';
            filterHTML += '<button class="inbox-filter-btn ' + (inboxFilter === f.key ? 'active' : '') + '" onclick="filterInbox(\'' + f.key + '\')">' + f.label + countBadge + '</button>';
        });
        filterHTML += '</div>';

        // Filter proposals
        const filtered = allProposals.filter(p => {
            if (inboxFilter === 'all') return true;
            const isIncoming = p.target_nation_id === currentNation.id;
            const isRevised = p.status === 'revised';
            const fpd = p.proposal_data || {};
            const revisedByUs = isRevised && (fpd.revised_by_nation_id ? fpd.revised_by_nation_id === currentNation.id : !isIncoming);
            const needsOurAction = (p.status === 'proposed' && isIncoming) || (isRevised && !revisedByUs);

            if (inboxFilter === 'action') return needsOurAction;
            if (inboxFilter === 'fm_review') return p.status === 'fm_review';
            if (inboxFilter === 'ratification') return p.status === 'ratification' || p.status === 'ratification_failed';
            if (inboxFilter === 'pending') return !needsOurAction && p.status !== 'fm_review' && p.status !== 'ratification' && p.status !== 'ratification_failed';
            return true;
        });

        if (filtered.length === 0) {
            panel.innerHTML = filterHTML + '<p class="diplo-tab-placeholder">No proposals in this category.</p>';
            return;
        }

        let cardsHTML = '';
        for (const p of filtered) {
            cardsHTML += renderInboxCard(p);
        }

        panel.innerHTML = filterHTML + cardsHTML;
    } catch (err) {
        console.error('Error rendering inbox tab:', err);
        panel.innerHTML = '<p style="color:#f44;text-align:center;padding:20px;">Error loading inbox.</p>';
    }
}

function filterInbox(filter) {
    inboxFilter = filter;
    renderInboxTab(filter);
}

function renderInboxCard(p) {
    const pd = p.proposal_data || {};

    // ── State visit proposal — render specialized card ──
    if (p.proposal_type === 'state_visit') {
        return renderStateVisitInboxCard(p, pd);
    }

    // ── Trade negotiation proposal — render specialized card ──
    if (p.proposal_type === 'trade_negotiation') {
        return renderTradeNegInboxCard(p, pd);
    }

    const articles = pd.articles || [];
    const struckIndices = new Set(pd.struck_articles || []);
    const isIncoming = p.target_nation_id === currentNation.id;
    const isRevised = p.status === 'revised';
    // For trade_agreement proposals, track who revised using revised_by_nation_id
    const revisedByUs = isRevised && (
        pd.revised_by_nation_id ? pd.revised_by_nation_id === currentNation.id : p.target_nation_id !== currentNation.id
    );
    const revisedByThem = isRevised && !revisedByUs;
    const needsOurAction = (p.status === 'proposed' && isIncoming) || (isRevised && !revisedByUs);

    // Classification
    const classification = pd.classification || null;
    const classBadge = classification
        ? '<span class="classification-badge classification-' + classification.toLowerCase() + '">' + classification + '</span>'
        : '';

    // Status badge
    let statusBadge = '';
    if (p.status === 'proposed' && isIncoming) {
        statusBadge = '<span class="proposal-status-badge badge-action">Awaiting Your Response</span>';
    } else if (p.status === 'proposed' && !isIncoming) {
        statusBadge = '<span class="proposal-status-badge badge-waiting">Awaiting Response</span>';
    } else if (isRevised && !revisedByUs) {
        statusBadge = '<span class="proposal-status-badge badge-action">Revised — Your Turn</span>';
    } else if (isRevised && revisedByUs) {
        statusBadge = '<span class="proposal-status-badge badge-waiting">Revision Sent</span>';
    } else if (p.status === 'fm_review') {
        statusBadge = '<span class="proposal-status-badge" style="background:rgba(96,165,250,0.08);color:#60a5fa;border:1px solid rgba(96,165,250,0.2);">FM Review</span>';
    } else if (p.status === 'ratification') {
        statusBadge = '<span class="proposal-status-badge" style="background:rgba(167,139,250,0.08);color:#a78bfa;border:1px solid rgba(167,139,250,0.2);">Parliament</span>';
    } else if (p.status === 'ratification_failed') {
        statusBadge = '<span class="proposal-status-badge" style="background:rgba(239,68,68,0.08);color:#ef4444;border:1px solid rgba(239,68,68,0.2);">Ratification Failed</span>';
    }

    // Pipeline tracker for MAJOR proposals
    let pipelineHTML = '';
    if (classification === 'MAJOR') {
        pipelineHTML = renderPipelineTracker(p);
    }

    // Articles display
    let articlesHTML = '';
    if (articles.length > 0) {
        articlesHTML = '<div class="agreement-card-terms">';
        articles.forEach((art, i) => {
            const isStruck = struckIndices.has(i);
            const artLabel = art.text || art.label || art.type || 'Unknown';
            articlesHTML += '<div class="agreement-card-term' + (isStruck ? ' term-struck' : '') + '">' +
                '<span class="proposal-article-num">Art. ' + toRoman(i + 1) + '</span> ' +
                '<span class="proposal-article-label">' + escapeHtml(artLabel) + '</span>' +
                (isStruck ? ' <span class="struck-label">STRUCK</span>' : '') +
            '</div>';
        });
        articlesHTML += '</div>';
    }

    // Effects
    let totalRel = 0, totalMoney = 0;
    articles.forEach((art, i) => {
        if (!struckIndices.has(i)) {
            totalRel += art.relations || 0;
            totalMoney += art.money || 0;
        }
    });
    const relStr = totalRel > 0 ? '+' + totalRel + ' Relations' : totalRel < 0 ? totalRel + ' Relations' : '';
    const moneyStr = totalMoney > 0 ? '+$' + (totalMoney / 1e6).toFixed(0) + 'M' : totalMoney < 0 ? '-$' + (Math.abs(totalMoney) / 1e6).toFixed(0) + 'M' : '';
    let effectsHTML = '';
    if (relStr || moneyStr) {
        effectsHTML = '<div class="agreement-card-effects">';
        if (relStr) effectsHTML += '<span class="effect-tag effect-rel">' + relStr + '</span>';
        if (moneyStr) effectsHTML += '<span class="effect-tag effect-money">' + moneyStr + '</span>';
        effectsHTML += '</div>';
    }

    // Action buttons based on status and role
    let actionsHTML = '';
    if (needsOurAction) {
        // Ambassador can accept/reject/strike
        actionsHTML = '<div class="inbox-card-actions">' +
            '<button class="proposal-accept-btn" onclick="acceptProposal(\'' + p.id + '\')">Accept</button>' +
            '<button class="proposal-strike-btn" onclick="inboxStrikeArticles(\'' + p.id + '\')">Strike Articles</button>' +
            '<button class="proposal-reject-btn" onclick="rejectProposal(\'' + p.id + '\')">Reject</button>' +
        '</div>';
    } else if (p.status === 'fm_review' && diplomaticRoles.isFM) {
        // FM can approve (MINOR → activate, MAJOR → escalate to parliament)
        actionsHTML = '<div class="inbox-card-actions">' +
            '<button class="fm-approve-btn" onclick="fmApprove(\'' + p.id + '\')">Approve</button>' +
            '<button class="fm-escalate-btn" onclick="fmEscalate(\'' + p.id + '\')">Escalate to Parliament</button>' +
            '<button class="fm-reject-btn" onclick="fmReject(\'' + p.id + '\')">Reject</button>' +
        '</div>';
    } else if (p.status === 'ratification_failed' && (diplomaticRoles.isFM || diplomaticRoles.isHoG)) {
        actionsHTML = '<div class="inbox-card-actions">' +
            '<button class="fm-escalate-btn" onclick="fmEscalate(\'' + p.id + '\')">Resubmit to Parliament</button>' +
            '<button class="fm-reject-btn" onclick="fmReject(\'' + p.id + '\')">Abandon</button>' +
        '</div>';
    }

    // Strike checkboxes for action-needed proposals
    let strikeArticlesHTML = '';
    if (needsOurAction && articles.length > 0) {
        strikeArticlesHTML = '<div class="proposal-articles-list" id="inbox-articles-' + p.id + '" style="display:none;">';
        articles.forEach((art, i) => {
            const artLabel = art.text || art.label || art.type || 'Unknown';
            strikeArticlesHTML += '<div class="proposal-article-row">' +
                '<input type="checkbox" class="strike-checkbox" data-proposal-id="' + p.id + '" data-article-index="' + i + '" />' +
                '<div class="proposal-article-content">' +
                    '<span class="proposal-article-num">Art. ' + toRoman(i + 1) + '.</span> ' +
                    '<span class="proposal-article-label">' + escapeHtml(artLabel) + '</span>' +
                '</div>' +
            '</div>';
        });
        strikeArticlesHTML += '<div class="proposal-btn-row" style="margin-top:6px;">' +
            '<button class="proposal-strike-btn" onclick="strikeArticles(\'' + p.id + '\'); renderInboxTab();">Confirm Strike</button>' +
        '</div></div>';
    }

    return `
        <div class="inbox-card ${needsOurAction ? 'requires-action' : ''}">
            <div class="inbox-card-header">
                <div class="inbox-card-name">${escapeHtml(pd.name || 'Unnamed Proposal')}</div>
                <div class="inbox-card-badges">
                    ${classBadge}
                    ${statusBadge}
                </div>
            </div>
            <div class="inbox-card-meta">
                ${escapeHtml(pd.proposer_nation_name || 'Unknown')} &amp; ${escapeHtml(pd.target_nation_name || 'Unknown')}
                &middot; ${pd.duration_years || '?'} year${(pd.duration_years || 0) !== 1 ? 's' : ''}
                &middot; Proposed ${p.proposed_at_tick != null ? tickToDate(p.proposed_at_tick) : '—'}
            </div>
            ${pipelineHTML}
            ${articlesHTML}
            ${effectsHTML}
            ${strikeArticlesHTML}
            ${actionsHTML}
        </div>
    `;
}

function renderStateVisitInboxCard(p, pd) {

// ==================== TRADE NEGOTIATION HELPERS ====================

async function fetchNegotiation(negotiationId, fields) {
    const { data, error } = await _supabase
        .from('trade_negotiations')
        .select(fields || '*')
        .eq('id', negotiationId)
        .single();
    if (error || !data) {
        alert('Could not load negotiation: ' + (error?.message || 'not found'));
        return null;
    }
    return data;
}

async function requireNegStatus(negotiationId, allowedStatuses, refreshFn) {
    const neg = await fetchNegotiation(negotiationId, 'status');
    if (!neg) return null;
    if (!allowedStatuses.includes(neg.status)) {
        alert('This negotiation is no longer available (status: ' + neg.status + ').');
        if (refreshFn) await refreshFn();
        return null;
    }
    return neg;
}

async function findProposalByNegotiationId(negotiationId) {
    const { data: proposals } = await _supabase
        .from('diplomatic_proposals')
        .select('id, proposal_data')
        .eq('proposal_type', 'trade_negotiation')
        .in('status', ['proposed', 'revised'])
        .or('target_nation_id.eq.' + currentNation.id + ',proposing_nation_id.eq.' + currentNation.id);
    const match = (proposals || []).find(p => p.proposal_data?.negotiation_id === negotiationId);
    return match ? match.id : null;
}

function renderTradeNegInboxCard(p, pd) {
    const needsOurAction = p.status === 'proposed' && p.target_nation_id === currentNation.id;
    const negId = pd.negotiation_id || '';
    const proposer = escapeHtml(pd.proposer_nation_name || 'Unknown');
    const target = escapeHtml(pd.target_nation_name || 'Unknown');

    return `
        <div class="inbox-card ${needsOurAction ? 'requires-action' : ''}">
            <div class="inbox-card-header">
                <div class="inbox-card-name">&#128220; ${escapeHtml(pd.name || 'Trade Negotiations')}</div>
                <div class="inbox-card-badges">
                    <span class="classification-badge" style="background:#1a3a5c;color:#90caf9;">TRADE</span>
                    <span class="proposal-status-badge ${needsOurAction ? 'badge-action' : 'badge-waiting'}">${needsOurAction ? 'Awaiting Your Response' : 'Awaiting Response'}</span>
                </div>
            </div>
            <div class="inbox-card-meta">
                ${proposer} &amp; ${target}
                &middot; Proposed ${p.proposed_at_tick != null ? tickToDate(p.proposed_at_tick) : '—'}
                ${pd.expires_at_tick ? ' &middot; Expires tick ' + pd.expires_at_tick : ''}
            </div>
            <div style="font-size:0.78rem;color:var(--text-muted);padding:8px 0;line-height:1.5;">
                ${proposer} proposes opening trade negotiations.
                ${needsOurAction ? 'If you accept, both sides can choose an agreement type and draft terms together.' : 'Waiting for the other side to respond.'}
            </div>
            ${needsOurAction ? `
                <div class="inbox-card-actions">
                    <button class="proposal-accept-btn" onclick="acceptTradeNegotiation('${p.id}', '${negId}')">Accept (${DIPLOMACY_CONFIG.ACCEPT_TRADE_NEGOTIATION_AP} AP)</button>
                    <button class="proposal-reject-btn" onclick="rejectTradeNegotiation('${p.id}', '${negId}')">Reject</button>
                </div>
            ` : ''}
        </div>
    `;
}

async function acceptTradeNegotiation(proposalId, negotiationId) {
    if (!negotiationId) { alert('Missing negotiation ID.'); return; }

    const neg = await fetchNegotiation(negotiationId);
    if (!neg) return;
    if (neg.status !== 'open') {
        alert('This negotiation is no longer awaiting acceptance (status: ' + neg.status + ').');
        await refreshDiplomacyUI();
        return;
    }

    const apCost = DIPLOMACY_CONFIG.ACCEPT_TRADE_NEGOTIATION_AP;
    if (!confirm('Accept trade negotiations? This costs ' + apCost + ' AP.\n\nOnce accepted, the negotiation table opens and both sides can choose an agreement type and draft articles.')) return;

    const apResult = await deductAP(_supabase, currentFaction.id, apCost, currentFaction.action_points);
    if (!apResult.success) {
        alert('Not enough AP. Need ' + apCost + ' AP, have ' + (currentFaction.action_points || 0) + '.');
        return;
    }
    currentFaction.action_points = apResult.newAp;

    if (!proposalId) proposalId = await findProposalByNegotiationId(negotiationId);

    // Determine our highest-priority role for this negotiation
    const ourAmb = diplomaticRoles.ambassadorTo.find(a =>
        a.target_nation_id === neg.nation_a_id || a.target_nation_id === neg.nation_b_id
    );
    const role = ourAmb ? 'ambassador'
        : diplomaticRoles.isMoT ? 'trade_minister'
        : diplomaticRoles.isFM ? 'foreign_minister'
        : 'head_of_government';

    const participants = neg.participants || [];
    participants.push({ faction_id: currentFaction.id, role, joined_at_tick: shardTick, nation_id: currentNation.id });

    const { error: updateErr } = await _supabase.from('trade_negotiations')
        .update({ status: 'active', participants })
        .eq('id', negotiationId);
    if (updateErr) { alert('Error accepting negotiation: ' + updateErr.message); return; }

    if (proposalId) {
        await _supabase.from('diplomatic_proposals').update({ status: 'active' }).eq('id', proposalId);
    }

    // Fire event (non-blocking)
    const partnerId = neg.nation_a_id === currentNation.id ? neg.nation_b_id : neg.nation_a_id;
    const { data: partnerNation } = await _supabase.from('nations').select('name').eq('id', partnerId).single();
    _supabase.from('event_log').insert({
        nation_id: currentNation.id,
        event_name: 'Trade Negotiations Accepted',
        category: 'Trade',
        description_chosen: currentNation.name + ' has accepted trade negotiations with ' + (partnerNation?.name || 'Unknown') + '. The negotiation table is now open.',
        fired_at_tick: shardTick
    }).then(() => {});

    alert('Trade negotiations accepted! The negotiation table is now open.\n\nGo to the Initiative tab to choose an agreement type and begin drafting articles.');
    await refreshDiplomacyUI();
}

async function rejectTradeNegotiation(proposalId, negotiationId) {
    if (negotiationId) {
        if (!await requireNegStatus(negotiationId, ['open'], refreshDiplomacyUI)) return;
    }

    if (!confirm('Reject these trade negotiations? This cannot be undone.')) return;

    if (negotiationId) {
        await _supabase.from('trade_negotiations').update({
            status: 'cancelled', concluded_at_tick: shardTick
        }).eq('id', negotiationId);
    }

    if (!proposalId && negotiationId) {
        proposalId = await findProposalByNegotiationId(negotiationId);
    }

    if (proposalId) {
        await _supabase.from('diplomatic_proposals').update({ status: 'rejected' }).eq('id', proposalId);
    }

    alert('Trade negotiations rejected.');
    await refreshDiplomacyUI();
}

function inboxStrikeArticles(proposalId) {
    // Toggle visibility of the strike checkboxes section
    const section = document.getElementById('inbox-articles-' + proposalId);
    if (section) {
        section.style.display = section.style.display === 'none' ? '' : 'none';
    }
}

// ==================== PIPELINE TRACKER ====================

function renderPipelineTracker(proposal) {
    const pd = proposal.proposal_data || {};
    const pipeline = pd.pipeline || {};
    const status = proposal.status;

    // Pipeline stages for MAJOR: Ambassador Accepted → FM Review → Parliament Ratification → Active
    const stages = [
        { key: 'ambassador', label: 'Ambassador' },
        { key: 'fm_review', label: 'FM Review' },
        { key: 'parliament', label: 'Parliament' },
        { key: 'active', label: 'Active' }
    ];

    // Determine which stages are completed/active
    const stageStates = {};

    if (status === 'proposed' || status === 'revised') {
        stageStates.ambassador = 'active';
    } else if (status === 'fm_review') {
        stageStates.ambassador = 'completed';
        stageStates.fm_review = 'active';
    } else if (status === 'ratification') {
        stageStates.ambassador = 'completed';
        stageStates.fm_review = 'completed';
        stageStates.parliament = 'active';
    } else if (status === 'ratification_failed') {
        stageStates.ambassador = 'completed';
        stageStates.fm_review = 'completed';
        stageStates.parliament = 'rejected';
    } else if (status === 'active') {
        stageStates.ambassador = 'completed';
        stageStates.fm_review = 'completed';
        stageStates.parliament = 'completed';
        stageStates.active = 'completed';
    } else if (status === 'rejected') {
        // Find where it was rejected
        if (pipeline.rejected_at === 'fm') {
            stageStates.ambassador = 'completed';
            stageStates.fm_review = 'rejected';
        } else if (pipeline.rejected_at === 'parliament') {
            stageStates.ambassador = 'completed';
            stageStates.fm_review = 'completed';
            stageStates.parliament = 'rejected';
        } else {
            stageStates.ambassador = 'rejected';
        }
    }

    let html = '<div class="pipeline-tracker">';
    stages.forEach((stage, i) => {
        const state = stageStates[stage.key] || '';
        if (i > 0) {
            const prevCompleted = stageStates[stages[i - 1].key] === 'completed';
            html += '<div class="pipeline-connector ' + (prevCompleted ? 'completed' : '') + '"></div>';
        }
        html += '<div class="pipeline-stage ' + state + '">' +
            '<div class="pipeline-stage-dot"></div><br>' +
            stage.label +
        '</div>';
    });
    html += '</div>';
    return html;
}

// ==================== FM ACTION FUNCTIONS ====================

async function fmApprove(proposalId) {
    // Authorization: must be FM or HoG
    await refreshRoles();
    if (!diplomaticRoles.isFM && !diplomaticRoles.isHoG) {
        alert('Only the Foreign Minister or Head of Government can approve proposals.');
        return;
    }

    const { data: proposal, error: fetchErr } = await _supabase
        .from('diplomatic_proposals')
        .select('*')
        .eq('id', proposalId)
        .single();

    if (fetchErr || !proposal) { alert('Could not load proposal.'); return; }

    // Status check: must be in fm_review
    if (proposal.status !== 'fm_review') {
        alert('This proposal is not currently in FM review status.');
        return;
    }

    const pd = proposal.proposal_data || {};
    const classification = pd.classification || 'MINOR';

    if (classification === 'MAJOR') {
        // MAJOR agreements must go through parliament — use escalate instead
        alert('MAJOR agreements cannot be directly approved. Use "Escalate to Parliament" instead.');
        return;
    }

    // MINOR: FM can directly activate
    if (!confirm(
        'Approve "' + (pd.name || 'Agreement') + '" as Foreign Minister?\n\n' +
        'This MINOR agreement will become active immediately.'
    )) return;

    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const currentTick = shard?.current_tick || 0;

    // Activate the proposal
    const updatedPipeline = { ...(pd.pipeline || {}), fm_approved_at: currentTick, fm_approved_by: currentFaction.id };
    pd.pipeline = updatedPipeline;

    const { error: updateErr } = await _supabase
        .from('diplomatic_proposals')
        .update({ status: 'active', activated_at_tick: currentTick, proposal_data: pd })
        .eq('id', proposalId);

    if (updateErr) { alert('Error approving: ' + updateErr.message); return; }

    // For trade_agreement proposals, create the trade_agreements row
    if (proposal.proposal_type === 'trade_agreement') {
        if (!await activateTradeAgreement(proposal, currentTick)) return;
    }

    // Apply relation effects
    await applyProposalEffects(proposal, currentTick);

    // Fire CIVIC news event
    await fireProposalEvent(pd, currentTick, 'approved',
        'Foreign Minister approved "' + (pd.name || 'Agreement') + '" between ' +
        pd.proposer_nation_name + ' and ' + pd.target_nation_name + '. The agreement is now active.');

    alert('"' + (pd.name || 'Agreement') + '" approved and is now active!');
    await renderNegotiationsBox();
    { const _apEl = document.getElementById('diplo-ap'); if (_apEl) _apEl.textContent = (currentFaction?.action_points ?? 0) + ' AP'; };
}

async function fmEscalate(proposalId) {
    // Authorization: must be FM or HoG
    await refreshRoles();
    if (!diplomaticRoles.isFM && !diplomaticRoles.isHoG) {
        alert('Only the Foreign Minister or Head of Government can escalate proposals.');
        return;
    }

    const { data: proposal, error: fetchErr } = await _supabase
        .from('diplomatic_proposals')
        .select('*')
        .eq('id', proposalId)
        .single();

    if (fetchErr || !proposal) { alert('Could not load proposal.'); return; }

    // Status check: must be in fm_review
    if (proposal.status !== 'fm_review') {
        alert('This proposal is not currently in FM review status.');
        return;
    }

    const pd = proposal.proposal_data || {};

    if (!confirm(
        'Escalate "' + (pd.name || 'Agreement') + '" to Parliament for ratification?\n\n' +
        'A ratification bill will be submitted to the legislature.'
    )) return;

    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const currentTick = shard?.current_tick || 0;

    // Create a ratification bill
    const billTitle = 'Ratify: ' + (pd.name || 'Diplomatic Agreement');
    const billDescription = 'Ratification of the ' + (pd.classification || '') + ' diplomatic agreement "' +
        (pd.name || 'Agreement') + '" between ' + (pd.proposer_nation_name || 'Unknown') + ' and ' +
        (pd.target_nation_name || 'Unknown') + '. Duration: ' + (pd.duration_years || '?') + ' year(s).';

    const { data: bill, error: billErr } = await _supabase
        .from('bills')
        .insert({
            nation_id: currentNation.id,
            bill_type: 'ratification',
            bill_name: billTitle,
            preamble: billDescription,
            proposed_by: currentFaction.id,
            diplomatic_proposal_id: proposalId,
            status: 'committee',
            proposed_tick: currentTick,
            voting_ends_tick: currentTick + GAME_CONFIG.VOTING_WINDOW_TICKS
        })
        .select('id')
        .single();

    if (billErr) {
        console.error('Error creating ratification bill:', billErr);
        alert('Error submitting to parliament: ' + billErr.message);
        return;
    }

    // Update proposal status
    const updatedPipeline = { ...(pd.pipeline || {}), escalated_at: currentTick, escalated_by: currentFaction.id, ratification_bill_id: bill?.id };
    pd.pipeline = updatedPipeline;

    await _supabase
        .from('diplomatic_proposals')
        .update({ status: 'ratification', proposal_data: pd })
        .eq('id', proposalId);

    // Fire CIVIC news event
    await fireProposalEvent(pd, currentTick, 'escalated',
        'The diplomatic agreement "' + (pd.name || 'Agreement') + '" has been escalated to Parliament for ratification. ' +
        'A ratification bill has been introduced in committee.');

    alert('"' + (pd.name || 'Agreement') + '" escalated to Parliament. Ratification bill submitted.');
    await renderNegotiationsBox();
    { const _apEl = document.getElementById('diplo-ap'); if (_apEl) _apEl.textContent = (currentFaction?.action_points ?? 0) + ' AP'; };
}

async function fmReject(proposalId) {
    // Authorization: must be FM or HoG
    await refreshRoles();
    if (!diplomaticRoles.isFM && !diplomaticRoles.isHoG) {
        alert('Only the Foreign Minister or Head of Government can reject proposals.');
        return;
    }

    const { data: proposal, error: fetchErr } = await _supabase
        .from('diplomatic_proposals')
        .select('*')
        .eq('id', proposalId)
        .single();

    if (fetchErr || !proposal) { alert('Could not load proposal.'); return; }

    // Status check: must be in fm_review or ratification_failed
    if (!['fm_review', 'ratification_failed'].includes(proposal.status)) {
        alert('This proposal cannot be rejected at this stage.');
        return;
    }

    const pd = proposal.proposal_data || {};
    const action = proposal.status === 'ratification_failed' ? 'abandon' : 'reject';

    if (!confirm(
        (action === 'abandon' ? 'Abandon' : 'Reject') + ' "' + (pd.name || 'Agreement') + '" as Foreign Minister?\n\n' +
        'This cannot be undone.'
    )) return;

    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const currentTick = shard?.current_tick || 0;

    const updatedPipeline = { ...(pd.pipeline || {}), rejected_at: 'fm', rejected_at_tick: currentTick };
    pd.pipeline = updatedPipeline;

    await _supabase
        .from('diplomatic_proposals')
        .update({ status: 'rejected', proposal_data: pd })
        .eq('id', proposalId);

    // Fire CIVIC news event
    await fireProposalEvent(pd, currentTick, 'rejected',
        'The Foreign Minister has ' + action + 'ed the diplomatic agreement "' + (pd.name || 'Agreement') +
        '" between ' + pd.proposer_nation_name + ' and ' + pd.target_nation_name + '.');

    alert('"' + (pd.name || 'Agreement') + '" ' + action + 'ed.');
    await renderNegotiationsBox();
    { const _apEl = document.getElementById('diplo-ap'); if (_apEl) _apEl.textContent = (currentFaction?.action_points ?? 0) + ' AP'; };
}

// ==================== PROPOSAL EFFECT HELPERS ====================

async function applyProposalEffects(proposal, currentTick) {
    const pd = proposal.proposal_data || {};
    const articles = pd.articles || [];
    const struckIndices = new Set(pd.struck_articles || []);

    let totalRel = 0, totalMoney = 0;
    const activeArticles = [];
    articles.forEach((art, i) => {
        if (!struckIndices.has(i)) {
            totalRel += art.relations || 0;
            totalMoney += art.money || 0;
            activeArticles.push(art);
        }
    });

    // Update relations score
    if (totalRel !== 0) {
        const nationA = proposal.proposing_nation_id < proposal.target_nation_id ? proposal.proposing_nation_id : proposal.target_nation_id;
        const nationB = proposal.proposing_nation_id < proposal.target_nation_id ? proposal.target_nation_id : proposal.proposing_nation_id;

        const { data: rel } = await _supabase
            .from('diplomatic_relations')
            .select('id, relation_score, active_treaties')
            .eq('nation_a_id', nationA)
            .eq('nation_b_id', nationB)
            .maybeSingle();

        if (rel) {
            const newScore = Math.max(-100, Math.min(100, (rel.relation_score || 0) + totalRel));
            const treaties = Array.isArray(rel.active_treaties) ? [...rel.active_treaties, proposal.id] : [proposal.id];
            await _supabase.from('diplomatic_relations')
                .update({ relation_score: newScore, active_treaties: treaties })
                .eq('id', rel.id);
        }
    }
}

async function fireProposalEvent(pd, currentTick, stage, description) {
    try {
        const { data: allNations } = await _supabase.from('nations').select('id');
        if (allNations && allNations.length > 0) {
            const eventRows = allNations.map(n => ({
                nation_id: n.id,
                event_name: (pd.name || 'Diplomatic Agreement') + ' — ' + stage.charAt(0).toUpperCase() + stage.slice(1),
                category: 'Diplomatic',
                description_chosen: description,
                fired_at_tick: currentTick
            }));
            await _supabase.from('event_log').insert(eventRows);
        }
    } catch (e) {
        console.warn('Error firing proposal event:', e);
    }
}

async function toggleNationCard(nationId) {
    const body = document.getElementById('nation-card-body-' + nationId);
    if (!body) return;

    const card = body.closest('.nation-card');
    const isExpanded = body.style.display !== 'none';

    // Collapse all cards and clear their content
    document.querySelectorAll('.nation-card-body').forEach(b => {
        b.style.display = 'none';
        b.innerHTML = '';
    });
    document.querySelectorAll('.nation-card').forEach(c => {
        c.classList.remove('expanded');
        c.classList.remove('highlighted');
    });

    // Clear map highlight
    document.querySelectorAll('.land').forEach(l => l.classList.remove('selected-nation'));

    if (!isExpanded) {
        body.style.display = '';
        body.innerHTML = '<p style="color:#6b6a5e;font-style:italic;font-size:0.82rem;padding:8px 0;">Loading details...</p>';
        card.classList.add('expanded');

        // Highlight corresponding nation on the map
        const nationName = card.getAttribute('data-nation-name');
        if (nationName) {
            const mapPath = document.querySelector('.land[data-nation-name="' + nationName + '"]');
            if (mapPath) mapPath.classList.add('selected-nation');
        }

        await renderNationCardBody(nationId);
    }
}

// ==================== NATION CARD BODY (expanded detail) ====================

async function renderNationCardBody(nationId) {
    const body = document.getElementById('nation-card-body-' + nationId);
    if (!body) return;

    try {
        // Fetch the full nation
        const { data: targetNation, error: natErr } = await _supabase
            .from('nations').select('*').eq('id', nationId).single();
        if (natErr || !targetNation) {
            body.innerHTML = '<p style="color:#f44;">Nation not found.</p>';
            return;
        }

        // Set module state for initiative form
        selectedTargetNation = targetNation;

        // Parallel data fetch
        const [relation, proposals, ambassador, pendingAmbassador, theirAmbassador, pendingDiploProposals] = await Promise.all([
            fetchDiplomaticRelation(currentNation?.id, targetNation.id),
            fetchActiveProposals(currentNation?.id, targetNation.id),
            fetchAmbassador(currentNation?.id, targetNation.id),
            fetchPendingAmbassador(currentNation?.id, targetNation.id),
            fetchAmbassador(targetNation.id, currentNation?.id),
            fetchPendingDiploProposals(currentNation?.id, targetNation.id)
        ]);
        selectedTheirAmbassador = theirAmbassador;

        const flagUrl = FLAG_URLS[targetNation.name] || null;
        const hasCeasefire = proposals.some(p => p.proposal_type === 'ceasefire');
        const score = relation?.relation_score ?? 35;
        const tier = getRelationTier(score, hasCeasefire);

        // Embassy status: open only if both nations have an active ambassador to each other
        const embassyStatus = (ambassador && theirAmbassador) ? 'open' : 'closed';

        // Build body HTML
        let html = '';

        // Key stats
        html += `
            <div class="info-block">
                <div class="info-row">
                    <span class="info-label">Population</span>
                    <span class="info-value gold">${formatNumber(targetNation.population)}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Stability</span>
                    <span class="info-value" style="color:${getStatColor(targetNation.stability)}">${targetNation.stability ?? '—'}%</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Civil Unrest</span>
                    <span class="info-value" style="color:${getStatColor(100 - (targetNation.civil_unrest || 0))}">${targetNation.civil_unrest ?? '—'}%</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Military Strength</span>
                    <span class="info-value">${targetNation.military_strength ?? '—'}</span>
                </div>
            </div>
        `;

        // Nation Info link
        if (targetNation.name) {
            html += `<a href="${nationInfoUrl(targetNation.name)}" class="nation-info-link">Nation Info</a>`;
        }

        // Relation section
        html += renderRelationSection(tier.label, tier.cssClass, embassyStatus, ambassador);

        // Active proposals
        if (proposals.length > 0) {
            html += renderActiveProposals(proposals);
        }

        // Pending diplomatic proposals
        if (pendingDiploProposals.length > 0) {
            html += renderPendingProposals(pendingDiploProposals, targetNation);
        }

        // Ongoing trade negotiations with this nation
        html += await renderNationTradeNegotiations(targetNation.id);

        // Action panel
        html += renderActionPanel(targetNation, diplomaticRoles, ambassador, pendingAmbassador, theirAmbassador);

        body.innerHTML = html;

        // Render chat section (async, appended after)
        const chatHTML = await renderChatSection(targetNation, diplomaticRoles, ambassador, theirAmbassador);
        body.innerHTML += chatHTML;

        // Scroll chat to bottom if present
        const chatBox = body.querySelector('#diplo-chat-box');
        if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;

    } catch (err) {
        console.error('Error loading nation card details:', err);
        body.innerHTML = '<p style="color:#f44;">Error loading details.</p>';
    }
}
