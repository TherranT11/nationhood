        if (svState.agenda.length > newMax) svState.agenda = svState.agenda.slice(0, newMax);
        renderStateVisitHTML(body);
    }));
    body.querySelectorAll('[data-delegation]').forEach(el => el.addEventListener('click', () => {
        svState.delegation = el.dataset.delegation;
        renderStateVisitHTML(body);
    }));
    // Agenda checkboxes
    body.querySelectorAll('.sv-agenda-tick-box').forEach(el => el.addEventListener('click', () => {
        const key = el.dataset.agendaKey;
        const item = STATE_VISIT_AGENDA_ITEMS.find(a => a.key === key);
        if (item?.requires === 'pending_treaty' && !svContext.hasPendingTreaty) return;
        const idx = svState.agenda.indexOf(key);
        if (idx >= 0) {
            svState.agenda.splice(idx, 1);
        } else {
            const maxA = STATE_VISIT_DURATIONS[svState.duration].maxAgenda;
            if (svState.agenda.length >= maxA) return;
            svState.agenda.push(key);
        }
        renderStateVisitHTML(body);
    }));
    // Remove buttons
    body.querySelectorAll('.sv-agenda-remove').forEach(el => el.addEventListener('click', () => {
        const key = el.dataset.agendaKey;
        const idx = svState.agenda.indexOf(key);
        if (idx >= 0) svState.agenda.splice(idx, 1);
        renderStateVisitHTML(body);
    }));
    // Cancel
    document.getElementById('sv-cancel-btn')?.addEventListener('click', () => {
        svState = null; svContext = null;
        activeDraftAction = null;
        renderDraftBox();
    });
    // Submit
    document.getElementById('sv-submit-btn')?.addEventListener('click', () => submitStateVisit());
}

let _svSubmitLock = false;
async function submitStateVisit() {
    if (_svSubmitLock) return;
    if (!svState || !svContext) return;
    _svSubmitLock = true;
    const ctx = svContext;
    const computed = computeStateVisitEffects(svState, ctx);

    // Validate
    if (!ctx.hasAmbassador) { _svSubmitLock = false; alert('No ambassador posted to ' + ctx.targetNation.name + '.'); return; }
    if (!ctx.noConflict) { _svSubmitLock = false; alert('Cannot visit during active conflict.'); return; }
    if (ctx.cooldownActive) { _svSubmitLock = false; alert(ctx.targetNation.name + ' was recently visited. Cooldown: ' + ctx.cooldownTicks + ' tick(s) remaining.'); return; }
    if (ctx.alreadyPending) { _svSubmitLock = false; alert('A State Visit invitation to ' + ctx.targetNation.name + ' is already pending.'); return; }

    const apResult = await deductAP(_supabase, currentFaction.id, computed.totalAp);
    if (!apResult.success) {
        _svSubmitLock = false;
        if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
        alert('Not enough AP. Need ' + computed.totalAp + ', have ' + (apResult.currentAp ?? '?') + '.');
        return;
    }
    currentFaction.action_points = apResult.newAp;

    // Visitor is the Head of Government (PM/President), not Head of State
    const { data: hog } = await _supabase.from('head_of_government')
        .select('first_name, last_name')
        .eq('nation_id', currentNation.id)
        .eq('active', true)
        .maybeSingle();
    const hogName = hog
        ? [hog.first_name, hog.last_name].filter(Boolean).join(' ')
        : [currentNation.head_of_state_first_name, currentNation.head_of_state_last_name].filter(Boolean).join(' ') || 'Head of Government';

    const { error: proposalErr } = await _supabase
        .from('diplomatic_proposals')
        .insert({
            proposing_nation_id: currentNation.id,
            target_nation_id: ctx.targetNation.id,
            proposed_by_faction_id: currentFaction.id,
            proposal_type: 'state_visit',
            proposal_tier: 2,
            status: 'proposed',
            proposal_data: {
                name: hogName + ' — State Visit to ' + ctx.targetNation.name,
                visitor_leader: hogName,
                visitor_nation: currentNation.name,
                host_nation: ctx.targetNation.name,
                proposer_nation_name: currentNation.name,
                target_nation_name: ctx.targetNation.name,
                visit_type: svState.visitType,
                duration: svState.duration,
                delegation_size: svState.delegation,
                agenda: svState.agenda,
                computed_effects: computed.effects,
                total_debt: computed.totalDebt,
                risks: computed.risks,
                unlocks: computed.unlocks,
                ap_cost: computed.totalAp,
                is_first: ctx.isFirstVisit,
                is_target_autocracy: isGovernmentAutocracy(ctx.targetNation),
                relation_score: ctx.relScore
            },
            fm_review_expires_tick: ctx.currentTick + DIPLOMACY_CONFIG.STATE_VISIT_ACCEPT_WINDOW,
            proposed_at_tick: ctx.currentTick
        });

    if (proposalErr) {
        _svSubmitLock = false;
        alert('Error proposing State Visit: ' + proposalErr.message);
        return;
    }

    // Fire event for all nations
    try {
        const { data: allNations } = await _supabase.from('nations').select('id');
        if (allNations && allNations.length > 0) {
            const eventRows = allNations.map(n => ({
                nation_id: n.id,
                event_name: 'State Visit Proposed',
                trigger_key: 'state_visit',
                event_type: 'state_visit',
                category: 'Diplomatic',
                description_chosen: hogName + ' of ' + currentNation.name + ' has proposed a state visit to ' + ctx.targetNation.name + '.',
                fired_at_tick: ctx.currentTick,
                effects_applied: {
                    nation_a: currentNation.name,
                    nation_b: ctx.targetNation.name,
                    leader: hogName,
                }
            }));
            await _supabase.from('event_log').insert(eventRows);
        }
    } catch (e) {
        console.warn('Error firing state visit proposal event:', e);
    }

    _svSubmitLock = false;
    alert('State Visit invitation sent to ' + ctx.targetNation.name + '!\n\nThey have ' + DIPLOMACY_CONFIG.STATE_VISIT_ACCEPT_WINDOW + ' ticks to accept.');

    svState = null; svContext = null;
    activeDraftAction = null;
    await renderDraftBox();
    if (selectedTargetNation) await renderNationCardBody(selectedTargetNation.id);
    await renderNegotiationsBox();
    { const _apEl = document.getElementById('diplo-ap'); if (_apEl) _apEl.textContent = (currentFaction?.action_points ?? 0) + ' AP'; }
}

let _svAcceptLock = {};
async function acceptStateVisit(proposalId) {
    if (_svAcceptLock[proposalId]) return;
    _svAcceptLock[proposalId] = true;
    // Fetch proposal
    const { data: proposal, error: fetchErr } = await _supabase
        .from('diplomatic_proposals')
        .select('*')
        .eq('id', proposalId)
        .single();

    if (fetchErr || !proposal) { _svAcceptLock[proposalId] = false; alert('Could not load proposal.'); return; }
    if (proposal.proposal_type !== 'state_visit') { _svAcceptLock[proposalId] = false; alert('Not a state visit proposal.'); return; }

    // Authorization: FM in democracies, ruling faction in autocracies
    await refreshRoles();
    if (proposal.target_nation_id !== currentNation.id || !canHandleStateVisit()) {
        _svAcceptLock[proposalId] = false;
        const roleLabel = isGovernmentAutocracy(currentNation) ? 'ruling faction' : 'Foreign Minister';
        alert('Only the ' + roleLabel + ' of the visited nation can accept a State Visit.');
        return;
    }

    // Check if accept window expired
    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const currentTick = shard?.current_tick || 0;
    const pd = proposal.proposal_data || {};

    if (proposal.fm_review_expires_tick && currentTick > proposal.fm_review_expires_tick) {
        _svAcceptLock[proposalId] = false;
        alert('This State Visit invitation has expired.');
        await _supabase.from('diplomatic_proposals').update({ status: 'expired' }).eq('id', proposalId);
        await renderNegotiationsBox();
        return;
    }

    // Fetch both nations for stat updates
    const visitorNationId = proposal.proposing_nation_id;
    const hostNationId = proposal.target_nation_id;

    const [visitorRes, hostRes] = await Promise.all([
        _supabase.from('nations').select('*').eq('id', visitorNationId).single(),
        _supabase.from('nations').select('*').eq('id', hostNationId).single()
    ]);
    const visitorNation = visitorRes.data;
    const hostNation = hostRes.data;
    if (!visitorNation || !hostNation) { alert('Could not load nation data.'); return; }

    // Re-check conditional bonuses at acceptance time
    const natA = visitorNationId < hostNationId ? visitorNationId : hostNationId;
    const natB = visitorNationId < hostNationId ? hostNationId : visitorNationId;

    const [relRes, tradeRes, pastRes] = await Promise.all([
        _supabase.from('diplomatic_relations').select('relation_score').eq('nation_a_id', natA).eq('nation_b_id', natB).maybeSingle(),
        _supabase.from('trade_agreements').select('id').eq('status', 'active').eq('nation_a_id', natA).eq('nation_b_id', natB).limit(1),
        _supabase.from('diplomatic_action_log').select('id').eq('nation_id', visitorNationId).eq('target_nation_id', hostNationId).eq('action_type', 'state_visit').limit(1)
    ]);

    const relScore = relRes.data?.relation_score ?? 30;
    const hasTradeAgreement = tradeRes.data && tradeRes.data.length > 0;
    const isFirstVisit = !pastRes.data || pastRes.data.length === 0;
    const isTargetAutocracy = isGovernmentAutocracy(hostNation);
    const isVisitorAutocracy = isGovernmentAutocracy(visitorNation);

    // ── Read computed effects from proposal data (new data-driven approach) ──
    // Fall back to old hardcoded values if proposal was created before the rich draft panel
    const hasNewData = pd.computed_effects && Object.keys(pd.computed_effects).length > 0;
    const computedEffects = hasNewData ? pd.computed_effects : {
        relations: DIPLOMACY_CONFIG.STATE_VISIT_RELATION_BOOST,
        soft_power: DIPLOMACY_CONFIG.STATE_VISIT_REP_BOOST,
        stability: DIPLOMACY_CONFIG.STATE_VISIT_STABILITY_BOOST
    };
    const totalDebt = pd.total_debt || 0;
    const proposalRisks = pd.risks || [];
    const visitType = pd.visit_type || 'official_state_visit';
    const duration = pd.duration || 'moderate';
    const agenda = pd.agenda || [];
    const apCost = pd.ap_cost || DIPLOMACY_CONFIG.STATE_VISIT_AP;

    // ── Build confirmation with full visit details ──
    const vtLabel = STATE_VISIT_TYPES[visitType]?.label || 'State Visit';
    const durLabel = STATE_VISIT_DURATIONS[duration]?.label || 'Moderate';
    let confirmMsg = 'Accept ' + vtLabel + ' from ' + (pd.visitor_nation || 'Unknown') + '?\n\n';
    confirmMsg += 'Duration: ' + durLabel + ' (' + agenda.length + ' agenda items)\n';
    if (Object.keys(computedEffects).length > 0) {
        confirmMsg += '\nProjected Effects:\n';
        for (const [stat, val] of Object.entries(computedEffects)) {
            confirmMsg += '  ' + (val > 0 ? '+' : '') + val + ' ' + stat.replace(/_/g, ' ') + '\n';
        }
    }
    if (totalDebt > 0) {
        confirmMsg += '\nEmbassy budget cost: $' + (totalDebt / 1000000).toFixed(1) + 'M\n';
    }
    if (!confirm(confirmMsg)) return;

    _diploActionLock = true;
    try {

    // ── Apply computed effects to both nations ──
    const visitorUpdates = {};
    const hostUpdates = {};
    let bonusSummary = [];

    // Map effect keys to nation stat columns
    const effectToColumn = {
        relations: null, // handled separately via diplomatic_relations
        public_awareness: 'public_awareness',
        public_opinion: 'public_opinion',
        gov_approval: 'gov_approval',
        trade_relations: 'trade_balance',
        soft_power: 'international_reputation',
        education_approval: 'education_approval',
        military_trust: 'military_strength',
        stability: 'stability'
    };

    for (const [stat, val] of Object.entries(computedEffects)) {
        const col = effectToColumn[stat];
        if (!col) continue; // relations handled below, unknown stats skipped
        visitorUpdates[col] = Math.max(0, Math.min(100, Math.round(Number(visitorNation[col] || 0) + val)));
        hostUpdates[col] = Math.max(0, Math.min(100, Math.round(Number(hostNation[col] || 0) + val)));
        bonusSummary.push((val > 0 ? '+' : '') + val + ' ' + stat.replace(/_/g, ' '));
    }

    // ── Relation boost from computed effects ──
    const relBoost = computedEffects.relations || DIPLOMACY_CONFIG.STATE_VISIT_RELATION_BOOST;

    // ── First visit bonus (keep existing logic) ──
    if (isFirstVisit) {
        const firstStab = DIPLOMACY_CONFIG.STATE_VISIT_FIRST_STABILITY;
        visitorUpdates.stability = Math.min(100, (visitorUpdates.stability ?? Math.round(Number(visitorNation.stability || 0))) + firstStab);
        hostUpdates.stability = Math.min(100, (hostUpdates.stability ?? Math.round(Number(hostNation.stability || 0))) + firstStab);
        bonusSummary.push('+' + firstStab + ' Stability (first visit)');
    }

    // ── Autocracy approval dice roll ──
    const acDie = DIPLOMACY_CONFIG.STATE_VISIT_AUTOCRACY_DIE;
    const acThreshold = DIPLOMACY_CONFIG.STATE_VISIT_AUTOCRACY_THRESHOLD;
    const acChange = DIPLOMACY_CONFIG.STATE_VISIT_AUTOCRACY_CHANGE;
    let autocracyResult = null;
    if (isTargetAutocracy) {
        const roll = Math.floor(Math.random() * acDie) + 1;
        const approvalChange = roll <= acThreshold ? -acChange : acChange;
        visitorUpdates.gov_approval = Math.max(0, Math.min(100, Math.round(Number(visitorNation.gov_approval ?? 40) + approvalChange)));
        autocracyResult = { roll, change: approvalChange };
        bonusSummary.push('Autocracy dice: rolled ' + roll + ' → ' + (approvalChange > 0 ? '+' : '') + approvalChange + ' Gov Approval (visitor)');
    }
    if (isVisitorAutocracy) {
        const roll = Math.floor(Math.random() * acDie) + 1;
        const approvalChange = roll <= acThreshold ? -acChange : acChange;
        hostUpdates.gov_approval = Math.max(0, Math.min(100, Math.round(Number(hostNation.gov_approval ?? 40) + approvalChange)));
        if (!autocracyResult) autocracyResult = {};
        autocracyResult.host_roll = roll;
        autocracyResult.host_change = approvalChange;
        bonusSummary.push('Autocracy dice (host): rolled ' + roll + ' → ' + (approvalChange > 0 ? '+' : '') + approvalChange + ' Gov Approval (host)');

        // Regime health cost: the strongman leaving home weakens the regime
        const regimeDie = DIPLOMACY_CONFIG.STATE_VISIT_AUTOCRACY_REGIME_DIE;
        const regimeRoll = Math.floor(Math.random() * regimeDie) + 1;
        visitorUpdates.regime_health = Math.max(0, Math.round(Number(visitorNation.regime_health ?? 80) - regimeRoll));
        autocracyResult.regime_roll = regimeRoll;
        bonusSummary.push('Regime health: -' + regimeRoll + ' (1D10, strongman abroad)');
    }

    // ── Track debt for logging (actual budget cost applied via addEmbassyCost below) ──
    if (totalDebt > 0) {
        bonusSummary.push('Embassy budget cost: +$' + (totalDebt / 1000000).toFixed(1) + 'M (visitor)');
    }

    // ── Process risks: roll dice for each risk ──
    // risk.chance is stored as a decimal (e.g. 0.08 = 8%), so compare against Math.random()
    const triggeredRisks = [];
    for (const risk of proposalRisks) {
        if (risk.chance && typeof risk.chance === 'number') {
            const roll = Math.random();
            if (roll < risk.chance) {
                triggeredRisks.push(risk);
                // Gaffe: -2 gov_approval for visitor
                if (risk.key === 'gaffe') {
                    visitorUpdates.gov_approval = Math.max(0, (visitorUpdates.gov_approval ?? Math.round(Number(visitorNation.gov_approval ?? 40))) - 2);
                    bonusSummary.push('Risk triggered: ' + risk.source + ' gaffe (-2 Gov Approval)');
                }
            }
        }
        if (risk.flag) {
            triggeredRisks.push(risk);
            bonusSummary.push('Risk flag: ' + risk.source + ' (' + risk.key + ')');
        }
    }

    // ── Apply all updates ──
    await Promise.all([
        _supabase.from('nations').update(visitorUpdates).eq('id', visitorNationId),
        _supabase.from('nations').update(hostUpdates).eq('id', hostNationId)
    ]);

    // ── Charge costs to FM embassy budget (visitor pays) ──
    if (totalDebt > 0) {
        await addEmbassyCost(visitorNationId, totalDebt);
    }

    // Update relations
    const newRelScore = Math.min(100, relScore + relBoost);
    if (relRes.data) {
        await _supabase.from('diplomatic_relations').update({ relation_score: newRelScore }).eq('nation_a_id', natA).eq('nation_b_id', natB);
    } else {
        await _supabase.from('diplomatic_relations').insert({ nation_a_id: natA, nation_b_id: natB, relation_score: newRelScore });
    }

    // Mark proposal as active
    await _supabase.from('diplomatic_proposals').update({
        status: 'active',
        activated_at_tick: currentTick
    }).eq('id', proposalId);

    // Write to diplomatic_action_log for cooldown tracking
    await _supabase.from('diplomatic_action_log').insert({
        nation_id: visitorNationId,
        target_nation_id: hostNationId,
        faction_id: proposal.proposed_by_faction_id,
        action_type: 'state_visit',
        action_data: {
            visitor_leader: pd.visitor_leader,
            visitor_nation: pd.visitor_nation,
            host_nation: pd.host_nation,
            visit_type: visitType,
            duration: duration,
            delegation_size: pd.delegation_size,
            agenda: agenda,
            computed_effects: computedEffects,
            total_debt: totalDebt,
            is_first: isFirstVisit,
            has_trade_agreement: hasTradeAgreement,
            relation_boost: relBoost,
            autocracy_result: autocracyResult,
            triggered_risks: triggeredRisks,
            bonuses: bonusSummary
        },
        ap_cost: apCost,
        applied_at_tick: currentTick,
        cooldown_until_tick: currentTick + DIPLOMACY_CONFIG.STATE_VISIT_COOLDOWN,
        processed: true
    });

    // Fire events for all nations: one "accepted" and one "happened"
    try {
        const agendaTitles = agenda.map(k => {
            const item = STATE_VISIT_AGENDA_ITEMS.find(a => a.key === k);
            return item ? item.title : k;
        });
        const svEffects = {
            visitor_leader: pd.visitor_leader,
            visitor_nation: pd.visitor_nation,
            host_nation: pd.host_nation,
            host: pd.host_nation,
            visitor: pd.visitor_nation,
            nation_a: pd.visitor_nation,
            nation_b: pd.host_nation,
            leader: pd.visitor_leader,
            visit_type: visitType,
            agenda: agenda,
            computed_effects: computedEffects,
            is_first: isFirstVisit,
            triggered_risks: triggeredRisks
        };
        const { data: allNations } = await _supabase.from('nations').select('id');
        if (allNations && allNations.length > 0) {
            // "Accepted" event
            const acceptRows = allNations.map(n => ({
                nation_id: n.id,
                event_name: 'State Visit Accepted',
                trigger_key: 'state_visit',
                event_type: 'state_visit',
                category: 'Diplomatic',
                description_chosen: pd.host_nation + ' has accepted a ' + vtLabel.toLowerCase() + ' from ' + pd.visitor_leader + ' of ' + pd.visitor_nation + '.',
                fired_at_tick: currentTick,
                effects_applied: svEffects
            }));
            // "Happened" event
            const happenedRows = allNations.map(n => ({
                nation_id: n.id,
                event_name: 'State Visit',
                trigger_key: 'state_visit',
                event_type: 'state_visit',
                category: 'Diplomatic',
                description_chosen: pd.visitor_leader + ' of ' + pd.visitor_nation + ' conducted a ' + vtLabel + ' to ' + pd.host_nation + '.' +
                    ' The ' + durLabel.toLowerCase() + ' visit included ' + agendaTitles.join(', ') + '.' +
                    (isFirstVisit ? ' This historic first visit marks a new chapter in bilateral relations.' : '') +
                    (triggeredRisks.length > 0 ? ' The visit was not without incident.' : ''),
                fired_at_tick: currentTick,
                effects_applied: svEffects
            }));
            await _supabase.from('event_log').insert([...acceptRows, ...happenedRows]);
        }
    } catch (e) {
        console.warn('Error firing state visit event:', e);
    }

    // Build result message
    let resultMsg = 'State Visit Accepted!\n\n' +
        pd.visitor_leader + ' visited ' + pd.host_nation + '\n' +
        vtLabel + ' · ' + durLabel + ' · ' + agenda.length + ' agenda items\n\n' +
        'Effects Applied:\n';

    for (const [stat, val] of Object.entries(computedEffects)) {
        resultMsg += '  ' + (val > 0 ? '+' : '') + val + ' ' + stat.replace(/_/g, ' ') + '\n';
    }
    resultMsg += '  +' + relBoost + ' Relations (' + relScore + ' → ' + newRelScore + ')\n';

    if (totalDebt > 0) {
        resultMsg += '\nEmbassy budget cost: +$' + (totalDebt / 1000000).toFixed(1) + 'M (visitor)\n';
    }

    if (triggeredRisks.length > 0) {
        resultMsg += '\nRisks Triggered:\n';
        for (const r of triggeredRisks) {
            resultMsg += '  ⚠ ' + r.source + ': ' + r.key + '\n';
        }
    }

    if (bonusSummary.length > 0) {
        resultMsg += '\nAll Bonuses:\n  ' + bonusSummary.join('\n  ') + '\n';
    }

    resultMsg += '\n' + pd.host_nation + ' is now on a ' + DIPLOMACY_CONFIG.STATE_VISIT_COOLDOWN + '-tick visit cooldown.';

    _svAcceptLock[proposalId] = false;
    alert(resultMsg);
    location.reload();
}

let _svDeclineLock = {};
async function declineStateVisit(proposalId) {
    if (_svDeclineLock[proposalId]) return;
    _svDeclineLock[proposalId] = true;
    // Validate proposal is still actionable
    const { data: proposal } = await _supabase.from('diplomatic_proposals')
        .select('status, proposal_data').eq('id', proposalId).single();
    if (!proposal || proposal.status !== 'proposed') {
        _svDeclineLock[proposalId] = false;
        alert('This invitation is no longer actionable (status: ' + (proposal?.status || 'unknown') + ').');
        await renderNegotiationsBox();
        return;
    }

    // Authorization: FM in democracies, ruling faction in autocracies
    await refreshRoles();
    if (!canHandleStateVisit()) {
        _svDeclineLock[proposalId] = false;
        const roleLabel = isGovernmentAutocracy(currentNation) ? 'ruling faction' : 'Foreign Minister';
        alert('Only the ' + roleLabel + ' can decline a State Visit.');
        return;
    }

    if (!confirm('Decline this State Visit invitation? The visiting nation will not be refunded their AP.')) {
        _svDeclineLock[proposalId] = false;
        return;
    }

    await _supabase.from('diplomatic_proposals').update({ status: 'rejected' }).eq('id', proposalId);

    // Fire event for all nations
    try {
        const pd = proposal.proposal_data || {};
        const { data: shard } = await _supabase.from('game_shards').select('current_tick').eq('id', currentNation.shard_id).single();
        const tick = shard?.current_tick || 0;
        const { data: allNations } = await _supabase.from('nations').select('id');
        if (allNations && allNations.length > 0) {
            const eventRows = allNations.map(n => ({
                nation_id: n.id,
                event_name: 'State Visit Rejected',
                event_type: 'state_visit',
                category: 'Diplomatic',
                description_chosen: (currentNation.name || 'A nation') + ' has declined a state visit from ' + (pd.visitor_nation || 'an unknown nation') + '.',
                fired_at_tick: tick,
                effects_applied: {
                    nation_a: pd.visitor_nation || '',
                    nation_b: currentNation.name || '',
                    leader: pd.visitor_leader || '',
                    host: currentNation.name || '',
                    visitor: pd.visitor_nation || '',
                }
            }));
            await _supabase.from('event_log').insert(eventRows);
        }
    } catch (e) {
        console.warn('Error firing state visit rejection event:', e);
    }

    _svDeclineLock[proposalId] = false;
    alert('State Visit declined.');
    await renderNegotiationsBox();
    { const _apEl = document.getElementById('diplo-ap'); if (_apEl) _apEl.textContent = (currentFaction?.action_points ?? 0) + ' AP'; };
    if (selectedTargetNation) await renderNationCardBody(selectedTargetNation.id);
}

// ── Helper: map tier to pill class ──
function tierToPillClass(tier) {
    const label = tier.label.toLowerCase();
    if (label === 'allied') return 'pill--allied';
    if (label === 'friendly') return 'pill--friendly';
    if (label === 'hostile' || label === 'adversarial') return 'pill--hostile';
    if (label === 'ceasefire') return 'pill--war';
    return 'pill--neutral'; // Warm, Neutral, Cold
}

// ── Helper: map tier to dot color ──
function tierToDotColor(tier) {
    const label = tier.label.toLowerCase();
    if (label === 'allied') return 'var(--green)';
    if (label === 'friendly') return 'var(--teal)';
    if (label === 'hostile') return 'var(--amber)';
    if (label === 'adversarial' || label === 'ceasefire') return 'var(--red)';
    return 'var(--text-dim)';
}
