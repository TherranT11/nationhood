let _submitMinorLock = false;
async function submitMinorInitiative() {
    if (_submitMinorLock) return;
    if (!activeDraftTarget) { alert('Please select a target nation.'); return; }
    if (!wizardName.trim()) { alert('Please enter a name for the initiative.'); return; }
    if (wizardArticles.length === 0) { alert('Please add at least one article.'); return; }

    const apCost = MINOR_INITIATIVE_CONFIG.AP_COST;

    _submitMinorLock = true;
    const submitBtn = document.querySelector('[onclick*="submitMinorInitiative"]');
    if (submitBtn) submitBtn.disabled = true;

    try {

    // Validate: hostile nations blocked
    const targetId = activeDraftTarget.id;
    const natA = currentNation.id < targetId ? currentNation.id : targetId;
    const natB = currentNation.id < targetId ? targetId : currentNation.id;
    const { data: rel } = await _supabase
        .from('diplomatic_relations')
        .select('relation_score')
        .eq('nation_a_id', natA)
        .eq('nation_b_id', natB)
        .maybeSingle();
    if (rel && rel.relation_score <= MINOR_INITIATIVE_CONFIG.HOSTILE_RELATION_THRESHOLD) {
        alert('Cannot propose diplomatic initiative to hostile nation (relations: ' + rel.relation_score + ').');
        return;
    }

    // Validate: one visa agreement per initiative
    const visaCount = wizardArticles.filter(a => a.type === 'visa_agreement').length;
    if (visaCount > 1) {
        alert('Only one Visa Agreement per initiative.');
        return;
    }

    // Validate: cultural exchange must have at least 1 programme
    for (const art of wizardArticles) {
        if (art.type === 'cultural_exchange' && (!art.config.programmes || art.config.programmes.length === 0)) {
            alert('Cultural Exchange requires at least one programme selected.');
            return;
        }
        if (art.type === 'student_exchange' && (!art.config.fields || art.config.fields.length === 0)) {
            alert('Student Exchange requires at least one field selected.');
            return;
        }
    }

    // Build proposal_data with computed effects
    const articles = wizardArticles.map((art, i) => {
        const effects = computeArticleEffects(art);
        return {
            id: art.id,
            type: art.type,
            title: art.label || INITIATIVE_ARTICLE_TYPES[art.type]?.label || art.type,
            config: art.config,
            effects: effects.summary || effects,
            proposer_effects: effects.proposer || null,
            target_effects: effects.target || null,
            status: 'active'
        };
    });

    // Compute totals for the proposal
    const totals = computeInitiativeTotals(wizardArticles);

    const proposalData = {
        name: wizardName.trim(),
        classification: 'MINOR',
        version: 2,   // v2 = rich article config format
        articles: articles,
        proposer_nation_name: currentNation.name,
        target_nation_name: activeDraftTarget.name,
        proposer_faction_id: currentFaction.id,
        totals: totals
    };

        // Deduct AP
        const apResult = await deductAP(_supabase, currentFaction.id, apCost);
        if (!apResult.success) {
            if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
            alert('Not enough AP (' + apCost + ' needed). Current AP: ' + (apResult.currentAp ?? '?'));
            return;
        }

        const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const currentTick = shard?.current_tick || shardTick;

        const { error } = await _supabase.from('diplomatic_proposals').insert({
            proposing_nation_id: currentNation.id,
            target_nation_id: activeDraftTarget.id,
            proposed_by_faction_id: currentFaction.id,
            proposal_type: MINOR_INITIATIVE_CONFIG.TYPE,
            proposal_tier: MINOR_INITIATIVE_CONFIG.TIER,
            status: 'proposed',
            proposed_at_tick: currentTick,
            proposal_data: proposalData
        });

        if (error) {
            console.error('Submit error:', error);
            alert('Error submitting initiative: ' + error.message);
            return;
        }

        // Update AP display
        currentFaction.action_points = apResult.newAp;
        const apEl = document.getElementById('diplo-ap');
        if (apEl) apEl.textContent = currentFaction.action_points + ' AP';

        alert('Initiative "' + proposalData.name + '" submitted to ' + activeDraftTarget.name + '!');
        cancelDraft();
        await renderNegotiationsBox();
        await renderDiploHeader();
    } catch (err) {
        console.error('Submit minor initiative error:', err);
        alert('Error: ' + err.message);
    } finally {
        _submitMinorLock = false;
        if (submitBtn) submitBtn.disabled = false;
    }
}
window.submitMinorInitiative = submitMinorInitiative;

/**
 * Render the FM's draft panel for composing a Major Diplomatic Initiative.
 */
function renderMajorInitiativeDraftPanel(body, statusEl) {
    if (statusEl) statusEl.textContent = 'Major Diplomatic Initiative';

    // Check role: FM or HoG fallback
    const isFM = diplomaticRoles.isFM;
    const isHoG = diplomaticRoles.isHoG;
    if (!isFM && !isHoG) {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Only the Foreign Minister or Head of Government can propose Major Diplomatic Initiatives.</div></div>';
        return;
    }

    const apCost = isFM ? MAJOR_INITIATIVE_CONFIG.AP_COST : MAJOR_INITIATIVE_CONFIG.AP_COST + MAJOR_INITIATIVE_CONFIG.HOG_FALLBACK_AP_PENALTY;

    let html = '<div class="draft-panel">';

    // ── Header fields ──
    html += '<div class="draft-header">';
    html += '<div class="draft-field"><div class="draft-field-label">Action</div><div class="draft-field-input">' +
        escapeHtml(activeDraftAction.label) + ' <span style="font-family:var(--font-mono);font-size:10px;font-weight:600;color:var(--teal);">' + apCost + ' AP</span>';
    if (!isFM && isHoG) {
        html += ' <span style="font-family:var(--font-mono);font-size:9px;color:#ef4444;">(+' + MAJOR_INITIATIVE_CONFIG.HOG_FALLBACK_AP_PENALTY + ' AP: no FM)</span>';
    }
    html += '</div></div>';

    // Target nation — dropdown of all other nations (FM isn't restricted to ambassador postings)
    html += '<div class="draft-field"><div class="draft-field-label">Target</div>' +
        '<select class="selector-dropdown" onchange="selectMajorInitiativeTarget(this.value)">' +
        '<option value="">Select nation...</option>';
    cachedOtherNations.forEach(n => {
        const sel = activeDraftTarget && activeDraftTarget.id === n.id ? ' selected' : '';
        html += '<option value="' + n.id + '"' + sel + '>' + escapeHtml(n.name) + '</option>';
    });
    html += '</select></div>';

    // Initiative name
    html += '<div class="draft-field"><div class="draft-field-label">Name</div>' +
        '<input type="text" id="major-initiative-name-input" class="draft-field-input" ' +
        'placeholder="e.g. ' + escapeHtml((currentNation?.name || '') + '-' + (activeDraftTarget?.name || '') + ' Comprehensive Partnership') + '" ' +
        'value="' + escapeHtml(wizardName) + '" oninput="setWizardName(this.value)" ' +
        'style="border:1px solid var(--border-subtle);background:var(--bg-3);color:var(--text-primary);padding:6px 10px;font-family:var(--font-sans);font-size:12px;width:100%;"></div>';
    html += '</div>';

    // ── Articles section ──
    html += '<div class="draft-articles" style="flex:1;overflow-y:auto;padding:10px 14px;">';
    if (wizardArticles.length === 0) {
        html += '<div class="empty-state" style="padding:20px 0;"><div class="empty-state-text">No articles added yet.<br>Use the selector below to add articles.</div></div>';
    } else {
        wizardArticles.forEach((art, i) => {
            html += renderInitiativeArticleCard(art, i, true);
        });
    }
    html += '</div>';

    // ── Article selector ──
    html += '<div class="article-selector">';
    html += '<select class="selector-dropdown" id="major-initiative-article-selector">';
    html += '<option value="">Add article...</option>';
    for (const [key, typeInfo] of Object.entries(MAJOR_INITIATIVE_ARTICLE_TYPES)) {
        if (typeInfo.max_per_initiative) {
            const count = wizardArticles.filter(a => a.type === key).length;
            if (count >= typeInfo.max_per_initiative) continue;
        }
        html += '<option value="' + key + '">' + escapeHtml(typeInfo.label) + '</option>';
    }
    html += '</select>';
    html += '<button class="btn btn--primary btn--sm" onclick="addMajorInitiativeArticle()">Add</button>';
    html += '</div>';

    // ── Cost summary for major initiatives ──
    if (wizardArticles.length > 0) {
        const costSummary = computeMajorInitiativeCosts(wizardArticles);
        html += '<div style="padding:4px 14px;font-family:var(--font-mono);font-size:9px;color:var(--text-2);border-top:1px solid var(--border-hair);">';
        html += 'Ratification cost: <span style="color:#ef4444;">$' + (costSummary.ratification / 1e6).toFixed(0) + 'M</span> each · ';
        html += 'Ongoing: <span style="color:#ef4444;">$' + (costSummary.ongoing / 1e6).toFixed(0) + 'M/yr</span> each · ';
        html += 'Requires bilateral parliamentary ratification (' + MAJOR_INITIATIVE_CONFIG.RATIFICATION_VOTING_TICKS + ' ticks)';
        html += '</div>';
    }

    // ── Action bar ──
    const articleCount = wizardArticles.length;
    const hasEnoughAP = (currentFaction?.action_points ?? 0) >= apCost;
    const canSend = articleCount > 0 && activeDraftTarget && wizardName.trim() && hasEnoughAP;

    html += '<div class="action-bar">';
    html += '<span class="action-bar-info">' + articleCount + ' article' + (articleCount !== 1 ? 's' : '') + ' / Major / Tier 3</span>';
    html += '<div class="action-bar-spacer"></div>';
    html += '<button class="btn btn--dim" onclick="cancelDraft()">Cancel</button>';
    html += '<button class="btn btn--send' + (canSend ? '' : '" disabled') + '" onclick="submitMajorInitiative()"' +
        (!canSend ? ' title="' + (!activeDraftTarget ? 'Select a target nation' : articleCount === 0 ? 'Add at least one article' : !wizardName.trim() ? 'Enter an initiative name' : 'Not enough AP (' + apCost + ' required)') + '"' : '') +
        '>Send Initiative (' + apCost + ' AP)</button>';
    html += '</div>';

    html += '</div>';
    body.innerHTML = html;
}

/**
 * Compute combined costs across major initiative articles.
 */
function computeMajorInitiativeCosts(articles) {
    let ratification = 0, ongoing = 0;
    for (const art of articles) {
        if (art.status === 'struck') continue;
        const effects = computeArticleEffects(art);
        if (effects.costs) {
            ratification += effects.costs.ratification_proposer || 0;
            ongoing += effects.costs.ongoing_per_year || 0;
        }
    }
    return { ratification, ongoing };
}

/**
 * Select target nation for major initiative.
 */
function selectMajorInitiativeTarget(nationId) {
    if (!nationId) { activeDraftTarget = null; renderDraftBox(); return; }
    const nation = cachedOtherNations.find(n => n.id === nationId);
    if (nation) {
        activeDraftTarget = { id: nation.id, name: nation.name };
    }
    renderDraftBox();
}
window.selectMajorInitiativeTarget = selectMajorInitiativeTarget;

function addMajorInitiativeArticle() {
    const sel = document.getElementById('major-initiative-article-selector');
    if (!sel || !sel.value) return;
    const typeKey = sel.value;
    const typeInfo = MAJOR_INITIATIVE_ARTICLE_TYPES[typeKey];
    if (!typeInfo) return;

    if (typeInfo.max_per_initiative) {
        const count = wizardArticles.filter(a => a.type === typeKey).length;
        if (count >= typeInfo.max_per_initiative) {
            alert('Only one ' + typeInfo.label + ' per initiative.');
            return;
        }
    }

    const article = {
        id: crypto.randomUUID ? crypto.randomUUID() : 'art-' + Date.now() + '-' + Math.random().toString(36).slice(2,8),
        type: typeKey,
        label: typeInfo.label,
        config: JSON.parse(JSON.stringify(typeInfo.default_config)),
        status: 'active'
    };

    wizardArticles.push(article);
    renderDraftBox();
}

async function submitDraft() {
    if (!activeDraftAction || !activeDraftTarget) {
        alert('Please select an action and target nation.');
        return;
    }
    if (!wizardName.trim()) {
        alert('Please enter a name for the initiative.');
        return;
    }
    if (wizardArticles.length === 0) {
        alert('Please add at least one article.');
        return;
    }

    // Check AP — server is the source of truth; deductAP below will validate
    const apCost = activeDraftAction.apCost;

    // Use existing wizard state variables for compatibility with submitInitiative
    wizardTargetNation = activeDraftTarget;
    wizardCategory = 'diplomatic';

    // Determine classification
    const hasMajor = wizardArticles.some(art => {
        const typeInfo = INITIATIVE_TYPES[art.type];
        return typeInfo && typeInfo.classification === 'MAJOR';
    });
    const classification = hasMajor ? 'MAJOR' : 'MINOR';

    try {
        // Deduct AP
        const apResult = await deductAP(_supabase, currentFaction.id, apCost);
        if (!apResult.success) {
            if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
            alert('Not enough AP (' + apCost + ' needed). Current AP: ' + (apResult.currentAp ?? '?'));
            return;
        }

        // Build proposal
        const proposalData = {
            name: wizardName.trim(),
            classification: classification,
            articles: wizardArticles,
            proposer_nation_name: currentNation.name,
            target_nation_name: activeDraftTarget.name,
            duration_years: wizardDuration || 1,
            proposer_faction_id: currentFaction.id
        };

        const { error } = await _supabase.from('diplomatic_proposals').insert({
            proposing_nation_id: currentNation.id,
            target_nation_id: activeDraftTarget.id,
            proposed_by_faction_id: currentFaction.id,
            proposal_type: 'diplomatic_initiative',
            proposal_tier: hasMajor ? 2 : 1,
            status: 'proposed',
            proposed_at_tick: shardTick,
            proposal_data: proposalData
        });

        if (error) {
            console.error('Submit error:', error);
            alert('Error submitting initiative: ' + error.message);
            return;
        }

        // Update AP display
        currentFaction.action_points = apResult.newAp;
        const apEl = document.getElementById('diplo-ap');
        if (apEl) apEl.textContent = currentFaction.action_points + ' AP';

        alert('Initiative submitted!');
        cancelDraft();
        await renderNegotiationsBox();
    } catch (err) {
        console.error('Submit draft error:', err);
        alert('Error: ' + err.message);
    }
}
