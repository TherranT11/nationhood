    }

    const { data: proposal, error: fetchErr } = await _supabase
        .from('diplomatic_proposals')
        .select('*')
        .eq('id', proposalId)
        .single();

    if (fetchErr || !proposal) { alert('Could not load proposal.'); return; }

    // Status check: must be in fm_review, ratification_failed, or proposed/revised (for major_diplomatic_initiative)
    const rejectableStatuses = ['fm_review', 'ratification_failed'];
    if (proposal.proposal_type === 'major_diplomatic_initiative') {
        rejectableStatuses.push('proposed', 'revised');
    }
    if (!rejectableStatuses.includes(proposal.status)) {
        alert('This proposal cannot be rejected at this stage.');
        return;
    }

    const pd = proposal.proposal_data || {};
    const action = proposal.status === 'ratification_failed' ? 'abandon' : 'reject';

    if (!confirm(
        (action === 'abandon' ? 'Abandon' : 'Reject') + ' "' + (pd.name || 'Agreement') + '" as Foreign Minister?\n\n' +
        'This cannot be undone.'
    )) return;
    _diploActionLock = true;
    try {

    const currentTick = shardTick;

    const updatedPipeline = { ...(pd.pipeline || {}), rejected_at: 'fm', rejected_at_tick: currentTick };
    pd.pipeline = updatedPipeline;

    await _supabase
        .from('diplomatic_proposals')
        .update({ status: 'rejected', proposal_data: pd })
        .eq('id', proposalId);

    // Fire CIVIC news event
    await fireProposalEvent(pd, currentTick, 'rejected',
        'The Foreign Minister has ' + action + 'ed the diplomatic agreement "' + (pd.name || 'Agreement') +
        '" between ' + pd.proposer_nation_name + ' and ' + pd.target_nation_name + '.',
        [proposal.proposing_nation_id, proposal.target_nation_id]);

    alert('"' + (pd.name || 'Agreement') + '" ' + action + 'ed.');
    await renderNegotiationsBox();
    { const _apEl = document.getElementById('diplo-ap'); if (_apEl) _apEl.textContent = (currentFaction?.action_points ?? 0) + ' AP'; };
    } finally { _diploActionLock = false; }
}

// ==================== MAJOR DIPLOMATIC INITIATIVE — FM ACTIONS ====================

/**
 * Forward a Major Diplomatic Initiative to both parliaments for bilateral ratification.
/**
 * Send a counter-proposal for a Major Diplomatic Initiative.
 * Allows the target FM to strike articles and send back to proposer.
 */
let _counterMajorLock = false;
async function counterMajorInitiative(proposalId) {
    if (_counterMajorLock) return;
    await refreshRoles();
    if (!diplomaticRoles.isFM && !diplomaticRoles.isHoG) {
        alert('Only the Foreign Minister or Head of Government can counter-propose.');
        return;
    }

    const apCost = MAJOR_INITIATIVE_CONFIG.AP_COST;

    const { data: proposal, error: fetchErr } = await _supabase
        .from('diplomatic_proposals')
        .select('*')
        .eq('id', proposalId)
        .single();

    if (fetchErr || !proposal) { alert('Could not load proposal.'); return; }

    if (!['proposed', 'revised'].includes(proposal.status)) {
        alert('This proposal is not in a state that can be countered.');
        return;
    }

    const pd = proposal.proposal_data || {};
    const articles = pd.articles || [];

    // Collect strike selections from the inbox card's strike checkboxes
    const strikeChecks = document.querySelectorAll('.strike-checkbox[data-proposal-id="' + proposalId + '"]');
    const struckArticleIds = [];
    strikeChecks.forEach(cb => {
        if (cb.checked) {
            const artIdx = parseInt(cb.dataset.articleIndex);
            if (!isNaN(artIdx) && articles[artIdx]) {
                struckArticleIds.push(articles[artIdx].id);
            }
        }
    });

    // Mark struck articles
    articles.forEach(art => {
        if (struckArticleIds.includes(art.id)) {
            art.status = 'struck';
        }
    });

    const activeCount = articles.filter(a => a.status !== 'struck').length;
    if (activeCount === 0) {
        alert('Counter-proposal must have at least one active article. Use Reject instead.');
        return;
    }

    if (struckArticleIds.length === 0) {
        alert('Select at least one article to strike for a counter-proposal.');
        return;
    }

    if (!confirm(
        'Send counter-proposal for "' + (pd.name || 'Initiative') + '"?\n\n' +
        struckArticleIds.length + ' article(s) struck.\n' +
        activeCount + ' article(s) remaining.\n' +
        'Cost: ' + apCost + ' AP'
    )) return;

    _counterMajorLock = true;
    try {

    const currentTick = shardTick;

    // Deduct AP
    const apResult = await deductAP(_supabase, currentFaction.id, apCost);
    if (!apResult.success) {
        if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
        alert('Not enough AP. Need ' + apCost + ' AP, have ' + (apResult.currentAp ?? '?') + '.');
        return;
    }

    // Add counter to history
    const counterHistory = pd.counter_history || [];
    counterHistory.push({
        tick: currentTick,
        by_nation_id: currentNation.id,
        by_faction_id: currentFaction.id,
        struck_articles: struckArticleIds,
        active_count: activeCount
    });

    pd.articles = articles;
    pd.counter_history = counterHistory;

    const { error: counterErr } = await _supabase
        .from('diplomatic_proposals')
        .update({
            status: 'revised',
            proposal_data: { ...pd, revised_by_nation_id: currentNation.id }
        })
        .eq('id', proposalId);

    if (counterErr) {
        console.error('Counter-proposal update error:', counterErr);
        alert('Error sending counter-proposal: ' + counterErr.message);
        return;
    }

    currentFaction.action_points = apResult.newAp;

    await fireProposalEvent(pd, currentTick, 'counter_proposal',
        'The Foreign Minister of ' + currentNation.name + ' has sent a counter-proposal for "' +
        (pd.name || 'Initiative') + '", striking ' + struckArticleIds.length + ' article(s).',
        [proposal.proposing_nation_id, proposal.target_nation_id]);

    alert('Counter-proposal sent. ' + struckArticleIds.length + ' article(s) struck.');
    await renderNegotiationsBox();
    { const _apEl = document.getElementById('diplo-ap'); if (_apEl) _apEl.textContent = (currentFaction?.action_points ?? 0) + ' AP'; };

    } finally {
        _counterMajorLock = false;
    }
}
window.counterMajorInitiative = counterMajorInitiative;

// ==================== PROPOSAL EFFECT HELPERS ====================

async function applyProposalEffects(proposal, currentTick) {
    const pd = proposal.proposal_data || {};
    const articles = pd.articles || [];
    const isV2 = pd.version === 2;

    // V2: filter by article status; V1: filter by struck_articles indices
    let totalRel = 0, totalMoney = 0;
    const activeArticles = [];

    if (isV2) {
        articles.forEach(art => {
            if (art.status !== 'struck') {
                const e = art.effects || {};
                totalRel += e.relations || 0;
                totalMoney += (e.revenue || 0) - (e.cost_proposer || 0);
                activeArticles.push(art);
            }
        });
    } else {
        const struckIndices = new Set(pd.struck_articles || []);
        articles.forEach((art, i) => {
            if (!struckIndices.has(i)) {
                totalRel += art.relations || 0;
                totalMoney += art.money || 0;
                activeArticles.push(art);
            }
        });
    }

    // Update relations score
    if (totalRel !== 0) {
        const nationA = proposal.proposing_nation_id < proposal.target_nation_id ? proposal.proposing_nation_id : proposal.target_nation_id;
        const nationB = proposal.proposing_nation_id < proposal.target_nation_id ? proposal.target_nation_id : proposal.proposing_nation_id;

        const { data: rel } = await _supabase
            .from('diplomatic_relations')
            .select('id, relation_score, active_treaties')
            .eq('nation_a_id', nationA)
            .eq('nation_b_id', nationB)
            .maybeSingle();

        if (rel) {
            const newScore = Math.max(-100, Math.min(100, (rel.relation_score || 0) + totalRel));
            const treaties = Array.isArray(rel.active_treaties) ? [...rel.active_treaties, proposal.id] : [proposal.id];
            await _supabase.from('diplomatic_relations')
                .update({ relation_score: newScore, active_treaties: treaties })
                .eq('id', rel.id);
        }
    }

    // V2: Apply stat effects and budget costs to Embassies & Consulates institution
    if (isV2 && activeArticles.length > 0) {
        // Apply one-time stat modifiers to proposer nation
        const proposerStatUpdates = {};
        const targetStatUpdates = {};

        for (const art of activeArticles) {
            const pe = art.proposer_effects || art.effects || {};
            const te = art.target_effects || art.effects || {};

            // Proposer stat changes
            if (pe.intl_reputation) proposerStatUpdates.international_reputation = (proposerStatUpdates.international_reputation || 0) + pe.intl_reputation;
            if (pe.immigration) proposerStatUpdates.immigration = (proposerStatUpdates.immigration || 0) + pe.immigration;
            if (pe.polarization) proposerStatUpdates.polarization = (proposerStatUpdates.polarization || 0) + pe.polarization;
            if (pe.terrorism_risk) proposerStatUpdates.terrorism = (proposerStatUpdates.terrorism || 0) + pe.terrorism_risk;

            // Target stat changes
            if (te.intl_reputation) targetStatUpdates.international_reputation = (targetStatUpdates.international_reputation || 0) + te.intl_reputation;
            if (te.immigration) targetStatUpdates.immigration = (targetStatUpdates.immigration || 0) + te.immigration;
            if (te.polarization) targetStatUpdates.polarization = (targetStatUpdates.polarization || 0) + te.polarization;
            if (te.terrorism_risk) targetStatUpdates.terrorism = (targetStatUpdates.terrorism || 0) + te.terrorism_risk;

            // Higher education (applies to both)
            const e = art.effects || {};
            if (e.higher_education) {
                proposerStatUpdates.higher_education = (proposerStatUpdates.higher_education || 0) + e.higher_education;
                targetStatUpdates.higher_education = (targetStatUpdates.higher_education || 0) + e.higher_education;
            }
        }

        // Apply stat changes via RPC-style increments
        if (Object.keys(proposerStatUpdates).length > 0) {
            await applyStatIncrements(proposal.proposing_nation_id, proposerStatUpdates);
        }
        if (Object.keys(targetStatUpdates).length > 0) {
            await applyStatIncrements(proposal.target_nation_id, targetStatUpdates);
        }

        // Apply costs to Embassies & Consulates institution (increase needed_amount)
        let proposerCost = 0, targetCost = 0;
        for (const art of activeArticles) {
            const e = art.effects || {};
            proposerCost += e.cost_proposer || 0;
            targetCost += e.cost_target || 0;
        }
        if (proposerCost > 0) await addEmbassyCost(proposal.proposing_nation_id, proposerCost);
        if (targetCost > 0) await addEmbassyCost(proposal.target_nation_id, targetCost);

        // Add revenue to proposer's FM institution (decrease needed_amount — more budget headroom)
        let proposerRevenue = 0, targetRevenue = 0;
        for (const art of activeArticles) {
            const pe = art.proposer_effects || art.effects || {};
            const te = art.target_effects || {};
            proposerRevenue += pe.revenue || 0;
            targetRevenue += te.revenue || 0;
        }
        // Revenue offsets cost (negative needed_amount adjustment)
        if (proposerRevenue > 0) await addEmbassyCost(proposal.proposing_nation_id, -proposerRevenue);
        if (targetRevenue > 0) await addEmbassyCost(proposal.target_nation_id, -targetRevenue);

        // Check for existing visa agreements between these nations and supersede them
        const hasVisa = activeArticles.some(a => a.type === 'visa_agreement');
        if (hasVisa) {
            const { data: existingVisas } = await _supabase
                .from('diplomatic_proposals')
                .select('id, proposal_data')
                .eq('status', 'active')
                .neq('id', proposal.id)
                .or('proposing_nation_id.eq.' + proposal.proposing_nation_id + ',target_nation_id.eq.' + proposal.proposing_nation_id)
                .or('proposing_nation_id.eq.' + proposal.target_nation_id + ',target_nation_id.eq.' + proposal.target_nation_id);

            for (const existing of (existingVisas || [])) {
                const epd = existing.proposal_data || {};
                const eArticles = epd.articles || [];
                const hasExistingVisa = eArticles.some(a => a.type === 'visa_agreement' && a.status !== 'struck');
                if (hasExistingVisa) {
                    // Check it's between the same two nations
                    const involves = (existing.proposing_nation_id === proposal.proposing_nation_id && existing.target_nation_id === proposal.target_nation_id) ||
                        (existing.proposing_nation_id === proposal.target_nation_id && existing.target_nation_id === proposal.proposing_nation_id);
                    if (!involves) continue;
                    await _supabase.from('diplomatic_proposals')
                        .update({ status: 'superseded' })
                        .eq('id', existing.id);
                }
            }
        }
    }
}

/**
 * Apply stat increments to a nation (add values to current stats, clamped 0-100).
 */
async function applyStatIncrements(nationId, increments) {
    if (!nationId || Object.keys(increments).length === 0) return;
    const { data: nation } = await _supabase.from('nations').select('*').eq('id', nationId).single();
    if (!nation) return;
    const updates = {};
    for (const [key, delta] of Object.entries(increments)) {
        const current = Number(nation[key] || 0);
        updates[key] = Math.max(0, Math.min(100, current + delta));
    }
    if (Object.keys(updates).length > 0) {
        await _supabase.from('nations').update(updates).eq('id', nationId);
    }
}

/**
 * Add cost to the Embassies & Consulates institution's needed_amount
 * in budget_item_allocations for the active budget bill.
 */
async function addEmbassyCost(nationId, amount) {
    if (!nationId || !amount) return;
    try {
        // Find the active budget bill's allocation for embassies
        const { data: alloc } = await _supabase
            .from('budget_item_allocations')
            .select('id, needed_amount')
            .eq('nation_id', nationId)
            .eq('item_type', 'institution')
            .eq('item_id', 'embassies')
            .order('created_at', { ascending: false })
            .limit(1)
            .maybeSingle();

        if (alloc) {
            const newNeeded = Math.max(0, Number(alloc.needed_amount || 0) + amount);
            await _supabase.from('budget_item_allocations')
                .update({ needed_amount: newNeeded })
                .eq('id', alloc.id);
        }
    } catch (e) {
        console.warn('Error updating embassy cost for nation', nationId, e);
    }
}

async function fireProposalEvent(pd, currentTick, stage, description, involvedNationIds) {
    try {
        // Map stage to trigger_key
        const triggerMap = {
            'activated': 'diplomatic_initiative_accepted',
            'ambassador_accepted': 'diplomatic_initiative_accepted',
            'rejected': 'diplomatic_initiative_rejected',
            'proposed': 'diplomatic_initiative_proposed',
        };
        const triggerKey = triggerMap[stage] || 'diplomatic_initiative_proposed';

        // Only send to the involved nations (not every nation in the game)
        let targetNationIds = involvedNationIds;
        if (!targetNationIds || targetNationIds.length === 0) {
            // Fallback: use current nation only
            targetNationIds = currentNation?.id ? [currentNation.id] : [];
        }

        if (targetNationIds.length > 0) {
            const eventRows = targetNationIds.map(nId => ({
                nation_id: nId,
                event_name: (pd.name || 'Diplomatic Agreement') + ' — ' + stage.charAt(0).toUpperCase() + stage.slice(1),
                trigger_key: triggerKey,
                category: 'Diplomatic',
                description_chosen: description,
                fired_at_tick: currentTick
            }));
            await _supabase.from('event_log').insert(eventRows);
        }
    } catch (e) {
        console.warn('Error firing proposal event:', e);
    }
}

// ==================== NATION CARD TOGGLE ====================

async function toggleNationCard(nationId) {
    const body = document.getElementById('nation-card-body-' + nationId);
    if (!body) return;

    const card = body.closest('.nation-card');
    const isExpanded = body.style.display !== 'none';

    // Collapse all cards and clear their content
    document.querySelectorAll('.nation-card-body').forEach(b => {
        b.style.display = 'none';
        b.innerHTML = '';
    });
    document.querySelectorAll('.nation-card').forEach(c => {
        c.classList.remove('expanded');
        c.classList.remove('highlighted');
    });

    // Clear map highlight
    document.querySelectorAll('.land').forEach(l => l.classList.remove('selected-nation'));

    if (!isExpanded) {
        body.style.display = '';
        body.innerHTML = '<p style="color:#666;font-style:italic;font-size:0.82rem;padding:8px 0;">Loading details...</p>';
        card.classList.add('expanded');

        // Highlight corresponding nation on the map
        const nationName = card.getAttribute('data-nation-name');
        if (nationName) {
            const mapPath = document.querySelector('.land[data-nation-name="' + nationName + '"]');
            if (mapPath) mapPath.classList.add('selected-nation');
        }

        await renderNationCardBody(nationId);
    }
}

        const hasCeasefire = proposals.some(p => p.proposal_type === 'ceasefire');

        const tier = getRelationTier(score, hasCeasefire);

        // Embassy status: open only if both nations have an active ambassador to each other
        const embassyStatus = (ambassador && theirAmbassador) ? 'open' : 'closed';

        // Build body HTML
        let html = '';

        // Key stats
        html += `
            <div class="info-block">
                <div class="info-row">
                    <span class="info-label">Population</span>
                    <span class="info-value gold">${formatNumber(targetNation.population)}</span>

                <div class="info-row">
                    <span class="info-label">Stability</span>
                    <span class="info-value" style="color:${getStatColor(targetNation.stability)}">${targetNation.stability != null ? Number(targetNation.stability).toFixed(1) : '—'}%</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Civil Unrest</span>
                    <span class="info-value" style="color:${getStatColor(100 - (targetNation.civil_unrest || 0))}">${targetNation.civil_unrest ?? '—'}%</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Military Strength</span>
                    <span class="info-value">${targetNation.military_strength ?? '—'}</span>
                </div>
            </div>
        `;

        // Nation Info link
        if (targetNation.name) {
            html += `<a href="${nationInfoUrl(targetNation.name)}" class="nation-info-link">Nation Info</a>`;
        }

        // Relation section
        html += renderRelationSection(tier.label, tier.cssClass, embassyStatus, ambassador);

        // Active proposals
        if (proposals.length > 0) {
            html += renderActiveProposals(proposals);
        }

        // Pending diplomatic proposals
        if (pendingDiploProposals.length > 0) {
            html += renderPendingProposals(pendingDiploProposals, targetNation);
        }

        // Ongoing trade negotiations with this nation
        html += await renderNationTradeNegotiations(targetNation.id);

        // Action panel
        html += renderActionPanel(targetNation, diplomaticRoles, ambassador, pendingAmbassador, theirAmbassador);

        body.innerHTML = html;

        // Render chat section (async, appended after)
        const chatHTML = await renderChatSection(targetNation, diplomaticRoles, ambassador, theirAmbassador);
        body.innerHTML += chatHTML;

        // Scroll chat to bottom if present
        const chatBox = body.querySelector('#diplo-chat-box');
        if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;

    } catch (err) {
        console.error('Error loading nation card details:', err);
        body.innerHTML = '<p style="color:#f44;">Error loading details.</p>';
    }
}

// ==================== MAP → CARD HIGHLIGHT ====================

function getRelationTier(score, hasCeasefire) {
    if (hasCeasefire)  return { label: 'Ceasefire',     cssClass: 'rel-ceasefire' };
    if (score >= 90)   return { label: 'Allied',        cssClass: 'rel-allied' };
    if (score >= 70)   return { label: 'Friendly',      cssClass: 'rel-friendly' };
    if (score >= 50)   return { label: 'Warm',          cssClass: 'rel-warm' };
    if (score >= 35)   return { label: 'Neutral',       cssClass: 'rel-neutral' };
    if (score >= 20)   return { label: 'Cold',          cssClass: 'rel-cold' };
    if (score >= 5)    return { label: 'Hostile',       cssClass: 'rel-hostile' };
    return                     { label: 'Adversarial',   cssClass: 'rel-adversarial' };
}

function getRelationBarColor(score) {
    if (score >= 90) return 'var(--green)';
    if (score >= 70) return 'var(--teal)';
    if (score >= 50) return 'var(--blue)';
    if (score >= 35) return 'var(--text-dim)';
    if (score >= 20) return 'var(--amber)';
    if (score >= 5)  return 'var(--red)';
    return 'var(--red)';
}

// ==================== RELATION SECTION ====================

function renderRelationSection(relType, relClass, embassyStatus, ambassador) {
    const embassyColor = embassyStatus === 'open' ? '#4ade80' : '#ef4444';
    const ambName = ambassador
        ? (ambassador.ambassador_first_name || '') + ' ' + (ambassador.ambassador_last_name || '')
        : null;
    const ambParty = ambassador?.factions?.abbreviation ? ' (' + ambassador.factions.abbreviation + ')' : '';

    // Ambassador term info
    let termHTML = '';
    if (ambassador && ambassador.appointed_at_tick != null) {
        const termLength = ambassador.term_length || 60;
        const ticksServed = shardTick - ambassador.appointed_at_tick;
        const ticksRemaining = Math.max(0, termLength - ticksServed);
        const expiryTick = ambassador.appointed_at_tick + termLength;
        const remainingYears = Math.floor(ticksRemaining / 12);
        const remainingMonths = ticksRemaining % 12;
        const remainingStr = remainingYears > 0
            ? remainingYears + 'y ' + remainingMonths + 'mo'
            : remainingMonths + ' month' + (remainingMonths !== 1 ? 's' : '');

        termHTML = `
            <div class="info-row">
                <span class="info-label">Appointed</span>
                <span class="info-value" style="font-size:0.78rem;">${tickToDate(ambassador.appointed_at_tick)}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Term Expires</span>
                <span class="info-value" style="font-size:0.78rem;">${tickToDate(expiryTick)}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Remaining</span>
                <span class="info-value" style="font-size:0.78rem;color:${ticksRemaining <= 3 ? '#ef4444' : ticksRemaining <= 6 ? '#f97316' : '#4ade80'};">${remainingStr}</span>
            </div>`;
    }

    // Retirement warning
    let warningHTML = '';
    if (ambassador && ambassador.appointed_at_tick != null) {
        const termLength = ambassador.term_length || 60;
        const ticksRemaining = Math.max(0, termLength - (shardTick - ambassador.appointed_at_tick));
        if (ticksRemaining <= DIPLOMACY_CONFIG.AMBASSADOR_RETIREMENT_WARNING && ticksRemaining > 0) {
            warningHTML = `
                <div style="background:rgba(249,115,22,0.08);border:1px solid rgba(249,115,22,0.2);border-radius:6px;padding:8px 10px;margin-top:8px;font-size:0.78rem;color:#f97316;">
                    &#9888; Ambassador ${ambName ? ambName.trim() : ''} will retire in ${ticksRemaining} tick${ticksRemaining !== 1 ? 's' : ''}. Conclude any active negotiations.
                </div>`;
        }
    }

    return `
        <div class="diplo-section-title">Diplomatic Relations</div>
        <div class="info-block">
            <div class="info-row">
                <span class="info-label">Relation</span>
                <span class="relation-badge ${relClass}">${relType}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Embassy</span>
                <span class="info-value" style="color:${embassyColor};text-transform:capitalize;">${embassyStatus}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Ambassador</span>
                <span class="info-value" style="font-size:0.85rem;">${ambName ? ambName.trim() + '<span class="amb-party-tag">' + escapeHtml(ambParty) + '</span>' : '<span style="color:#666;">None assigned</span>'}</span>
            </div>
            ${termHTML}
        </div>
        ${warningHTML}
    `;
}

// ==================== ACTIVE PROPOSALS ====================

function renderActiveProposals(proposals) {
    const proposalTypeLabels = {
        diplomatic_initiative: 'Diplomatic Initiative',
        trade_negotiation: 'Trade Agreement',
        cultural_exchange: 'Cultural Exchange',
        visa_agreement: 'Visa Agreement',
        joint_statement: 'Joint Statement',
        student_exchange: 'Student Exchange',
        non_aggression_pact: 'Non-Aggression Pact',
        military_alliance: 'Military Alliance',
        embargo: 'Embargo',
        ceasefire: 'Ceasefire',
        open_borders: 'Open Borders',
        close_embassy: 'Close Embassy'
    };

    const rows = proposals.map(p => {
        const pd = p.proposal_data || {};
        const name = pd.name || proposalTypeLabels[p.proposal_type] || p.proposal_type;
        const typeLabel = proposalTypeLabels[p.proposal_type] || p.proposal_type;
        const tierBadge = p.proposal_tier === 3 ? 'T3' : p.proposal_tier === 2 ? 'T2' : 'T1';
        const enacted = p.activated_at_tick != null ? tickToDate(p.activated_at_tick) : '';
        return `
            <div style="background:var(--bg-card);padding:8px 10px;border-radius:4px;margin-bottom:6px;">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <span style="font-size:0.82rem;color:var(--text-primary);">${escapeHtml(name)}</span>

    return `
        <div class="diplo-section-title">Active Treaties &amp; Agreements</div>
        <div class="info-block">${rows}</div>
    `;
}

// ==================== TRADE NEGOTIATIONS ON NATION CARD ====================

async function renderNationTradeNegotiations(targetNationId) {
    if (!currentNation) return '';

    try {
        // Canonical ordering
        const aId = currentNation.id < targetNationId ? currentNation.id : targetNationId;
        const bId = currentNation.id < targetNationId ? targetNationId : currentNation.id;

        const { data: negotiations } = await _supabase
            .from('trade_negotiations')
            .select('id, agreement_type, agreement_name, status, expires_at_tick, participants')
            .in('status', ['open', 'active'])
            .eq('nation_a_id', aId)
            .eq('nation_b_id', bId);

        if (!negotiations || negotiations.length === 0) return '';

        let html = '<div class="diplo-section-title">Trade Negotiations</div>';

        for (const neg of negotiations) {
            const typeInfo = neg.agreement_type && neg.agreement_type !== 'pending' ? TRADE_AGREEMENT_TYPES[neg.agreement_type] : null;
            const ticksLeft = neg.expires_at_tick - shardTick;
            const statusClass = ticksLeft <= 2 ? 'expiring' : 'active';
            const iconHtml = typeInfo ? (TRADE_TYPE_ICONS[typeInfo.icon] || '') : '&#128220;';

            const subLabel = typeInfo ? escapeHtml(typeInfo.shortLabel) : 'Type pending';

            html += `
                <div class="trade-neg-status" style="cursor:pointer;margin-bottom:8px;" onclick="openTradeNegotiation('${neg.id}')">
                    <div style="display:flex;align-items:center;gap:8px;">
                        <div class="trade-type-icon ${typeInfo ? typeInfo.icon : 'chart'}" style="width:22px;height:22px;font-size:0.75rem;">${iconHtml}</div>
                        <div>
                            <div style="font-size:0.82rem;font-weight:bold;color:var(--text-primary);">
                                ${escapeHtml(neg.agreement_name || 'Unnamed')}
                            </div>
                            <div style="font-size:0.65rem;color:var(--text-muted);">
                                ${subLabel} &middot; ${neg.status === 'open' ? 'Awaiting acceptance' : 'Negotiating'}
                            </div>
                        </div>
                    </div>
                    <div style="text-align:right;">
                        <div class="trade-neg-status-value ${statusClass}" style="font-size:0.75rem;">
                            ${neg.status === 'open' ? 'PENDING' : ticksLeft + 't left'}
                        </div>
                        <div style="font-size:0.58rem;color:var(--accent);font-weight:bold;">OPEN</div>
                    </div>
                </div>
            `;
        }

        return html;
    } catch (e) {
        console.warn('Error loading nation trade negotiations:', e);
        return '';
    }
}

// ==================== ACTION PANEL (role-based) ====================

function renderActionPanel(targetNation, roles, ambassador, pendingAmbassador, theirAmbassador) {
    if (!roles) return '';

    let actions = '';

    // Ambassador actions first (only if ambassador to this specific nation)
    const isAmbToTarget = roles.ambassadorTo.some(a => a.target_nation_id === targetNation.id);
    if (isAmbToTarget) {
        const hasTargetAmb = theirAmbassador && theirAmbassador.status === 'active';
        const initiativeDisabled = !hasTargetAmb ? 'disabled style="opacity:0.6;"' : '';
        const initiativeHint = !hasTargetAmb ? '<p style="font-size:0.78rem;color:#f97316;margin:6px 0 2px;">Target nation has no ambassador to negotiate with.</p>' : '';

        // Retirement warning for the player's own ambassador
        let ambWarningHTML = '';
        const myAmb = roles.ambassadorTo.find(a => a.target_nation_id === targetNation.id);
        if (myAmb && myAmb.appointed_at_tick != null) {
            const tl = myAmb.term_length || 60;
            const remaining = Math.max(0, tl - (shardTick - myAmb.appointed_at_tick));
            if (remaining <= DIPLOMACY_CONFIG.AMBASSADOR_RETIREMENT_WARNING && remaining > 0) {
                const ambFullName = ((myAmb.ambassador_first_name || '') + ' ' + (myAmb.ambassador_last_name || '')).trim() + (myAmb.factions?.abbreviation ? ' (' + myAmb.factions.abbreviation + ')' : '');
                ambWarningHTML = `<div style="background:rgba(249,115,22,0.08);border:1px solid rgba(249,115,22,0.2);border-radius:6px;padding:8px 10px;margin-top:8px;font-size:0.78rem;color:#f97316;">&#9888; Ambassador ${ambFullName} will retire in ${remaining} tick${remaining !== 1 ? 's' : ''}. Conclude any active negotiations.</div>`;
            }
        }

        actions += `
            <div class="action-card" style="margin-bottom:10px;">
                <div class="action-header">
                    <span class="action-title" style="color:#ba68c8;">Ambassador Actions</span>
                </div>
                <p class="action-desc">As Ambassador to ${escapeHtml(targetNation.name)}, you can negotiate directly.</p>
                ${ambWarningHTML}
                ${initiativeHint}
                <button class="action-btn" ${initiativeDisabled} onclick="showDiploTab('initiative')">New Initiative</button>
                <button class="action-btn" style="margin-top:8px;" disabled>Formal Protest (Coming Soon)</button>
                <button class="action-btn" style="margin-top:8px;" disabled>Gather Intel (Coming Soon)</button>
                <button class="action-btn" style="margin-top:8px;background:#5a1a1a;border-color:#8b3030;" onclick="resignAmbassador('${myAmb?.id}', '${escapeHtml(targetNation.name)}')">Resign as Ambassador</button>
            </div>
        `;
    }

    // HoG actions
    const _isIsolationist = currentFaction && (currentFaction.leader_negative_traits || []).includes('isolationist');
    if (roles.isHoG) {
        actions += `
            <div class="action-card" style="margin-bottom:10px;">
                <div class="action-header">
                    <span class="action-title" style="color:#ffb74d;">Head of Government Actions</span>
                </div>
                <p class="action-desc">As Head of Government, you may authorize major diplomatic decisions.</p>
                <button class="action-btn" disabled>Declare War (Coming Soon)</button>
                <button class="action-btn" style="margin-top:8px;" disabled>Propose Alliance (Coming Soon)</button>
                <button class="action-btn state-visit-btn" style="margin-top:8px;" ${_isIsolationist ? 'disabled title="Blocked by Isolationist trait"' : `onclick="selectDraftAction('state_visit','State Visit',${DIPLOMACY_CONFIG.STATE_VISIT_AP},'hog','hog')"`}>State Visit (${DIPLOMACY_CONFIG.STATE_VISIT_AP} AP)${_isIsolationist ? ' <span style="color:var(--red);font-size:0.7rem;"> — Blocked (Isolationist)</span>' : ''}</button>
            </div>
        `;
    }

    // FM actions
    if (roles.isFM) {
        const isCaretaker = currentCoalition?.status === 'caretaker';
        let fmButtons = '';
        if (isCaretaker) {
            fmButtons = `<button class="action-btn" disabled style="opacity:0.6;">Appointments suspended — caretaker government</button>`;
        } else if (ambassador && ambassador.status === 'active') {
            const ambName = (ambassador.ambassador_first_name || '') + ' ' + (ambassador.ambassador_last_name || '');
            const ambPartyFM = ambassador?.factions?.abbreviation ? ' (' + ambassador.factions.abbreviation + ')' : '';
            fmButtons = `
                <button class="action-btn" disabled style="opacity:0.6;">Ambassador Active: ${escapeHtml(ambName.trim())}${escapeHtml(ambPartyFM)}</button>`;
            if (roles.isHoG) {
                fmButtons += `<button class="action-btn" style="margin-top:8px;" onclick="selectDraftAction('recall_ambassador','Recall Ambassador',${DIPLOMACY_CONFIG.RECALL_AMBASSADOR_AP},'hog','hog')">Recall Ambassador</button>`;
            }
        } else if (pendingAmbassador) {
            const pendName = (pendingAmbassador.ambassador_first_name || '') + ' ' + (pendingAmbassador.ambassador_last_name || '');
            const pendPartyFM = pendingAmbassador?.factions?.abbreviation ? ' (' + pendingAmbassador.factions.abbreviation + ')' : '';
            fmButtons = `
                <button class="action-btn" disabled style="opacity:0.6;">Awaiting Confirmation: ${escapeHtml(pendName.trim())}${escapeHtml(pendPartyFM)}</button>
                <button class="action-btn" style="margin-top:8px;" onclick="cancelPendingAmbassador('${pendingAmbassador.id}', '${targetNation.name}')">Cancel Nomination</button>`;
        } else {
            fmButtons = `<button class="action-btn" onclick="selectDraftAction('appoint_ambassador','Appoint Ambassador',${APPOINT_AMBASSADOR_AP},'fm','fm')">Appoint Ambassador</button>`;
        }

        actions += `
            <div class="action-card" style="margin-bottom:10px;">
                <div class="action-header">
                    <span class="action-title" style="color:#64b5f6;">Foreign Minister Actions</span>
                </div>
                <p class="action-desc">As Foreign Minister, you oversee diplomatic proposals and ambassador assignments.</p>
                ${fmButtons}
            </div>
        `;
    }

    // No role — show observer message
    if (!roles.isHoG && !roles.isFM && !isAmbToTarget) {
        actions += `
            <div class="action-card" style="margin-bottom:10px;">
                <div class="action-header">
                    <span class="action-title">No Diplomatic Authority</span>
                </div>
                <p class="action-desc">Your party does not currently hold a diplomatic role in the coalition. You need to be Head of Government, Foreign Minister, or an Ambassador to take diplomatic actions.</p>
            </div>
        `;
    }

    return `
        <div class="diplo-section-title">Actions</div>
        ${actions}
    `;
}

// ==================== DATA FETCHERS ====================

async function fetchDiplomaticRelation(myNationId, targetNationId) {
    if (!myNationId || !targetNationId || myNationId === targetNationId) return null;

    // Canonical ordering: lower UUID = nation_a
    const nationA = myNationId < targetNationId ? myNationId : targetNationId;
    const nationB = myNationId < targetNationId ? targetNationId : myNationId;

    try {
        const { data } = await _supabase
            .from('diplomatic_relations')
            .select('*')
            .eq('nation_a_id', nationA)
            .eq('nation_b_id', nationB)
            .maybeSingle();
        return data;
    } catch (e) {
        console.warn('Error fetching diplomatic relation:', e);
        return null;
    }
}

async function fetchActiveProposals(myNationId, targetNationId) {
    if (!myNationId || !targetNationId || myNationId === targetNationId) return [];

    try {
        const { data } = await _supabase
            .from('diplomatic_proposals')
            .select('proposal_type, proposal_tier, status, activated_at_tick, proposal_data')
            .or(
                'and(proposing_nation_id.eq.' + myNationId + ',target_nation_id.eq.' + targetNationId + '),' +
                'and(proposing_nation_id.eq.' + targetNationId + ',target_nation_id.eq.' + myNationId + ')'
            )
            .eq('status', 'active');
        return data || [];
    } catch (e) {
        console.warn('Error fetching proposals:', e);
        return [];
    }
}

async function fetchAmbassador(myNationId, targetNationId) {
    if (!myNationId || !targetNationId || myNationId === targetNationId) return null;

    try {
        const { data } = await _supabase
            .from('ambassadors')
            .select('*, factions(abbreviation)')
            .eq('nation_id', myNationId)
            .eq('target_nation_id', targetNationId)
            .eq('is_active', true)
            .eq('status', 'active')
            .maybeSingle();
        return data;
    } catch (e) {
        console.warn('Error fetching ambassador:', e);
        return null;
    }
}

// ==================== HELPERS ====================

function getStatColor(value) {
    if (value == null) return '#666';
    if (value >= 70) return '#4ade80';
    if (value >= 40) return '#facc15';
    return '#ef4444';
}

// ==================== PENDING AMBASSADOR FETCH ====================

async function fetchPendingAmbassador(myNationId, targetNationId) {
    if (!myNationId || !targetNationId || myNationId === targetNationId) return null;

    try {
        const { data: pendingAmbassador } = await _supabase
            .from('ambassadors')
            .select('*, factions(abbreviation)')
            .eq('nation_id', myNationId)
            .eq('target_nation_id', targetNationId)
            .eq('is_active', true)
            .eq('status', 'pending_confirmation')
            .maybeSingle();

        if (!pendingAmbassador) return null;

        const activeBillStatuses = ['floor', 'committee'];
        let billQuery = _supabase
            .from('bills')
            .select('id')
            .eq('bill_type', 'confirmation')
            .in('status', activeBillStatuses);

        if (pendingAmbassador.confirmation_bill_id) {
            billQuery = billQuery.eq('id', pendingAmbassador.confirmation_bill_id);
        } else {
            billQuery = billQuery.eq('ambassador_id', pendingAmbassador.id);
        }

        const { data: liveBill } = await billQuery.maybeSingle();

        if (liveBill) return pendingAmbassador;

        await _supabase
            .from('ambassadors')
            .update({ status: 'rejected', is_active: false })
            .eq('id', pendingAmbassador.id);

        console.warn(`Ambassador confirmation desync detected for ${myNationId} → ${targetNationId}. Resetting state.`);
        return null;
    } catch (e) {
        console.warn('Error fetching pending ambassador:', e);
        return null;
    }
}

// ==================== RESIGN AMBASSADOR ====================

async function resignAmbassador(ambassadorId, nationName) {
    if (!ambassadorId) { alert('No ambassador found.'); return; }

    // Authorization: must actually be this ambassador (faction owns it)
    const isMyAmb = diplomaticRoles?.ambassadorTo?.some(a => a.id === ambassadorId);
    if (!isMyAmb) {
        alert('You are not this ambassador.');
        return;
    }

    if (!confirm(
        `Resign as Ambassador to ${nationName}?\n\n` +
        `Your party will lose 1 Approval.\n` +
        `Any pending negotiations will be affected.`
    )) return;

    try {
        const tick = shardTick;

        // Get ambassador details
        const { data: amb } = await _supabase
            .from('ambassadors')
            .select('faction_id, ambassador_first_name, ambassador_last_name')
            .eq('id', ambassadorId)
            .single();

        if (!amb) { alert('Ambassador not found.'); return; }

        // Deactivate ambassador
        await _supabase
            .from('ambassadors')
            .update({ status: 'resigned', is_active: false, recalled_at_tick: tick })
            .eq('id', ambassadorId);

        // 1 momentum loss for resigning
        await _supabase.rpc('adjust_momentum', { p_faction_id: amb.faction_id, p_delta: -1, p_label: 'Ambassador recalled (-1)', p_tick: currentTick || 0 });

        const ambName = ((amb.ambassador_first_name || '') + ' ' + (amb.ambassador_last_name || '')).trim();
        alert(`Ambassador ${ambName} has resigned from ${nationName}.\n-1 Approval to your party.`);

        // Refresh roles, header, and re-render
        diplomaticRoles = await detectDiplomaticRoles(currentFaction, currentNation, currentCoalition);
        { const _apEl = document.getElementById('diplo-ap'); if (_apEl) _apEl.textContent = (currentFaction?.action_points ?? 0) + ' AP'; };
        invalidateTabCache('relations'); await renderRelationsTab();

    } catch (e) {
        console.error('Error resigning ambassador:', e);
        alert('Error: ' + e.message);
    }
}

async function cancelPendingAmbassador(ambassadorId, nationName) {
    // Authorization: must be FM or HoG
    await refreshRoles();
    if (!diplomaticRoles.isFM && !diplomaticRoles.isHoG) {
        alert('Only the Foreign Minister or Head of Government can cancel ambassador nominations.');
        return;
    }

    if (!confirm(`Cancel this ambassador nomination to ${nationName}?\n\nThis cannot be undone.`)) return;

    try {
        const { data: amb } = await _supabase
            .from('ambassadors')
            .select('id, ambassador_first_name, ambassador_last_name')
            .eq('id', ambassadorId)
            .maybeSingle();

        if (!amb) { alert('Pending ambassador nomination not found.'); return; }

        await _supabase
            .from('ambassadors')
            .update({ status: 'withdrawn', is_active: false })
            .eq('id', ambassadorId)
            .eq('status', 'pending_confirmation');

        const { data: confirmationBill } = await _supabase
            .from('bills')
            .select('id, status')
            .eq('ambassador_id', ambassadorId)
            .in('status', ['committee', 'floor'])
            .maybeSingle();

        if (confirmationBill) {
            await _supabase
                .from('bills')
                .update({ status: 'failed' })
                .eq('id', confirmationBill.id);
        }

        const ambName = ((amb.ambassador_first_name || '') + ' ' + (amb.ambassador_last_name || '')).trim();
        alert(`Nomination withdrawn: ${ambName} to ${nationName}.`);

        diplomaticRoles = await detectDiplomaticRoles(currentFaction, currentNation, currentCoalition);
        { const _apEl = document.getElementById('diplo-ap'); if (_apEl) _apEl.textContent = (currentFaction?.action_points ?? 0) + ' AP'; };
        invalidateTabCache('relations'); await renderRelationsTab();

    } catch (e) {
        console.error('Error canceling pending ambassador:', e);
        alert('Error: ' + e.message);
    }
}

// ==================== MARK MESSAGES READ ====================

/**
 * Mark incoming diplomatic messages as read by the current faction.
 * Updates the DB, clears the [Incoming Message] badge on the nation card,
 * and decrements the nav badge count.
 * @param {Array} messages - Full message array for this conversation
 * @param {string} fromNationId - The nation that sent the messages
 */
function markDiploMessagesRead(messages, fromNationId) {
    if (!currentFaction || !currentNation) return;

    const unreadIds = messages
        .filter(m => m.to_nation_id === currentNation.id && m.from_nation_id === fromNationId)
        .filter(m => !(m.read_by_factions || []).includes(currentFaction.id))
        .map(m => m.id);

    if (unreadIds.length === 0) return;

    Promise.all(unreadIds.map(msgId => {
        // Use RPC-style atomic append to avoid lost-update race if two
        // factions mark the same message read concurrently.
        return _supabase.rpc('append_read_faction', {
            p_message_id: msgId,
            p_faction_id: currentFaction.id
        });
    })).then(() => {
        // Clear [Incoming Message] badge on this nation card
        const card = document.getElementById('nation-card-' + fromNationId);
        if (card) {
            const badge = card.querySelector('.diplo-incoming-msg');
            if (badge) badge.remove();
        }
        // Update Send Message action badge
        totalUnreadMessages = Math.max(0, totalUnreadMessages - unreadIds.length);
        const sendMsgBadge = document.querySelector('.action-item[data-action="send_message"] .action-badge');
        if (sendMsgBadge) {
            if (totalUnreadMessages > 0) {
                sendMsgBadge.textContent = totalUnreadMessages;
            } else {
                sendMsgBadge.remove();
            }
        }
        // Update the nav badge count
        const navBadge = document.getElementById('diplomacy-badge');
        if (navBadge && navBadge.style.display !== 'none') {
            const current = parseInt(navBadge.textContent) || 0;
            const newCount = Math.max(0, current - unreadIds.length);
            if (newCount > 0) {
                navBadge.textContent = newCount;
            } else {
                navBadge.style.display = 'none';
            }
        }
    }).catch(e => console.warn('Error marking messages as read:', e));
}

async function renderChatSection(targetNation, roles, ourAmbassador, theirAmbassador) {
    // Determine if there's a diplomatic channel
    const hasOurAmb = ourAmbassador && ourAmbassador.status === 'active';
    const hasTheirAmb = theirAmbassador && theirAmbassador.status === 'active';

    if (!hasOurAmb && !hasTheirAmb) {
        return `
            <div class="diplo-section-title">Diplomatic Channel</div>
            <div class="diplo-chat-empty">No diplomatic channel established.<br>An ambassador must be posted to enable communication.</div>
        `;
    }

    // Can the current player send messages?
    const isAmbToTarget = roles.ambassadorTo.some(a => a.target_nation_id === targetNation.id);
    const canSend = isAmbToTarget && hasOurAmb;
    const canView = roles.isFM || roles.isHoG || isAmbToTarget;

    if (!canView) {
        return `
            <div class="diplo-section-title">Diplomatic Channel</div>
            <div class="diplo-chat-empty">Diplomatic messages are visible to the Foreign Minister, Head of Government, and Ambassadors.</div>
        `;
    }

    // Fetch messages
    let messages = [];
    try {
        const { data } = await _supabase
            .from('diplomatic_messages')
            .select('*')
            .or(
                'and(from_nation_id.eq.' + currentNation.id + ',to_nation_id.eq.' + targetNation.id + '),' +
                'and(from_nation_id.eq.' + targetNation.id + ',to_nation_id.eq.' + currentNation.id + ')'
            )
            .order('sent_at_tick', { ascending: true })
            .order('created_at', { ascending: true })
            .limit(100);
        messages = data || [];
    } catch (e) {
        console.warn('Error fetching diplomatic messages:', e);
    }

    // Mark unread incoming messages as read by this faction
    markDiploMessagesRead(messages, targetNation.id);

    const msgsHTML = messages.length > 0
        ? messages.map(m => {
            const isMine = m.from_nation_id === currentNation.id;
            return `
                <div class="diplo-msg ${isMine ? 'mine' : 'theirs'}">
                    <div class="diplo-msg-sender">
                        ${escapeHtml(m.sender_name || 'Unknown')}
                        <span class="role-badge" style="background:${isMine ? 'rgba(96,165,250,0.08)' : 'rgba(74,222,128,0.08)'};color:${isMine ? '#60a5fa' : '#4ade80'};border:1px solid ${isMine ? 'rgba(96,165,250,0.2)' : 'rgba(74,222,128,0.2)'};">${escapeHtml(m.sender_role || 'diplomat')}</span>
                    </div>
                    <div class="diplo-msg-text">${escapeHtml(m.message_text)}</div>
                    <div class="diplo-msg-tick">Tick ${m.sent_at_tick}</div>
                </div>`;
        }).join('')
        : '<div class="diplo-chat-empty">No messages yet. Start the conversation.</div>';

    const inputHTML = canSend ? `
        <div class="diplo-chat-input">
            <input type="text" id="diplo-msg-input" placeholder="Type a message..." maxlength="500"
                onkeydown="if(event.key==='Enter')sendDiploMessage('${targetNation.id}','${targetNation.name}')" />
            <button onclick="sendDiploMessage('${targetNation.id}','${targetNation.name}')">Send</button>
        </div>
    ` : '<div style="font-size:0.72rem;color:var(--text-dim);text-align:center;padding:6px;">View only — only ambassadors can send messages.</div>';

    return `
        <div class="diplo-section-title">Diplomatic Channel</div>
        <div class="diplo-chat-box" id="diplo-chat-box">${msgsHTML}</div>
        ${inputHTML}
    `;
}

async function sendDiploMessage(targetNationId, targetNationName) {
    if (_diploActionLock) return;
    const input = document.getElementById('diplo-msg-input');
    if (!input) return;
    const text = input.value.trim();
    if (!text) return;

    // Authorization: must have an active ambassador to the target nation, or be FM/HoG
    const isAmbToTarget = diplomaticRoles.ambassadorTo.some(a => a.target_nation_id === targetNationId);
    if (!isAmbToTarget && !diplomaticRoles.isFM && !diplomaticRoles.isHoG) {
        alert('You must have an active ambassador to send diplomatic messages.');
        return;
    }
    _diploActionLock = true;

    try {
        const tick = shardTick;

        // Get our ambassador's last name for sender display
        const { data: amb } = await _supabase
            .from('ambassadors')
            .select('ambassador_last_name')
            .eq('nation_id', currentNation.id)
            .eq('target_nation_id', targetNationId)
            .eq('is_active', true)
            .eq('status', 'active')
            .single();

        const senderName = 'Amb. ' + (amb?.ambassador_last_name || currentFaction.faction_name);

        await _supabase.from('diplomatic_messages').insert({
            from_nation_id: currentNation.id,
            to_nation_id: targetNationId,
            from_faction_id: currentFaction.id,
            sender_role: 'ambassador',
            sender_name: senderName,
            message_text: text,
            sent_at_tick: tick
        });

        // Append message locally
        const chatBox = document.getElementById('diplo-chat-box');
        if (chatBox) {
            // Remove empty state if present
            const empty = chatBox.querySelector('.diplo-chat-empty');
            if (empty) empty.remove();

            chatBox.innerHTML += `
                <div class="diplo-msg mine">
                    <div class="diplo-msg-sender">
                        ${escapeHtml(senderName)}
                        <span class="role-badge" style="background:rgba(96,165,250,0.08);color:#60a5fa;border:1px solid rgba(96,165,250,0.2);">ambassador</span>
                    </div>
                    <div class="diplo-msg-text">${escapeHtml(text)}</div>
                    <div class="diplo-msg-tick">Tick ${tick}</div>
                </div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        input.value = '';
    } catch (e) {
        console.error('Error sending message:', e);
        alert('Failed to send message: ' + e.message);
    } finally { _diploActionLock = false; }
}

async function renderOngoingTradeNegotiations() {
    // Fetch active trade negotiations involving our nation
    const { data: negotiations } = await _supabase
        .from('trade_negotiations')
        .select('*')
        .in('status', ['open', 'active'])
        .or('nation_a_id.eq.' + currentNation.id + ',nation_b_id.eq.' + currentNation.id);

    if (!negotiations || negotiations.length === 0) return '';

    // Fetch nation names for display
    const nationIds = new Set();
    negotiations.forEach(n => { nationIds.add(n.nation_a_id); nationIds.add(n.nation_b_id); });
    const { data: nationNames } = await _supabase.from('nations').select('id, name').in('id', [...nationIds]);
    const nameMap = {};
    (nationNames || []).forEach(n => nameMap[n.id] = n.name);

    // For open negotiations where we're the recipient, fetch the associated proposals
    const openNegsWeReceived = negotiations.filter(n => {
        if (n.status !== 'open') return false;
        const participants = n.participants || [];
        return !participants.some(p => p.nation_id === currentNation.id);
    });
    let proposalMap = {}; // negotiation_id → proposal
    if (openNegsWeReceived.length > 0) {
        const { data: proposals } = await _supabase
            .from('diplomatic_proposals')
            .select('*')
            .eq('proposal_type', 'trade_negotiation')
            .eq('status', 'proposed')
            .eq('target_nation_id', currentNation.id);
        (proposals || []).forEach(p => {
            const negId = p.proposal_data?.negotiation_id;
            if (negId) proposalMap[negId] = p;
        });
    }

    let html = '<div class="diplo-section-title">Ongoing Trade Negotiations</div>';

    for (const neg of negotiations) {
        const partnerId = neg.nation_a_id === currentNation.id ? neg.nation_b_id : neg.nation_a_id;
        const partnerName = nameMap[partnerId] || 'Unknown';
        const typeInfo = neg.agreement_type && neg.agreement_type !== 'pending' ? TRADE_AGREEMENT_TYPES[neg.agreement_type] : null;
        const ticksLeft = (neg.expires_at_tick || 0) - shardTick;
        const statusClass = ticksLeft <= 0 ? 'expired' : ticksLeft <= 2 ? 'expiring' : 'active';

        // Check who has joined
        const participants = neg.participants || [];
        const participantRoles = participants.map(p => p.role).join(', ');

        // Determine if we're the recipient of an open negotiation (not yet in participants)
        const isRecipientOfOpen = neg.status === 'open' && !participants.some(p => p.nation_id === currentNation.id);
        const linkedProposal = proposalMap[neg.id];

        const negTitle = typeInfo
            ? escapeHtml(typeInfo.shortLabel) + ': ' + escapeHtml(neg.agreement_name || 'Unnamed')
            : escapeHtml(neg.agreement_name || 'Unnamed');
        const negSubtext = neg.status === 'open'
            ? (isRecipientOfOpen ? 'Awaiting your response' : 'Awaiting acceptance')
            : !typeInfo ? 'Type not yet selected'
            : participantRoles || 'Negotiating';

        // Build action area based on recipient/proposer status
        let actionHtml = '';
        if (isRecipientOfOpen && linkedProposal) {
            const apCost = DIPLOMACY_CONFIG.ACCEPT_TRADE_NEGOTIATION_AP;
            actionHtml = `
                <div class="inbox-card-actions" style="margin-top:8px;">
                    <button class="proposal-accept-btn" onclick="event.stopPropagation(); acceptTradeNegotiation('${linkedProposal.id}', '${neg.id}')">Begin Negotiations (${apCost} AP)</button>
                    <button class="proposal-reject-btn" onclick="event.stopPropagation(); rejectTradeNegotiation('${linkedProposal.id}', '${neg.id}')">Reject</button>
                </div>
            `;
        }

        html += `
            <div class="trade-neg-status ${isRecipientOfOpen ? 'requires-action' : ''}" style="cursor:pointer;${isRecipientOfOpen ? 'flex-wrap:wrap;' : ''}" onclick="openTradeNegotiation('${neg.id}')">
                <div>
                    <div style="font-size:0.85rem;font-weight:bold;color:var(--text-primary);">
                        ${negTitle}
                    </div>
                    <div style="font-size:0.7rem;color:var(--text-muted);margin-top:2px;">
                        with ${escapeHtml(partnerName)} &middot; ${negSubtext}
                    </div>
                </div>
                <div>
                    <div class="trade-neg-status-value ${statusClass}">
                        ${neg.status === 'open' ? 'PENDING' : ticksLeft + ' ticks left'}
                    </div>
                    <div style="font-size:0.62rem;color:var(--text-dim);text-align:right;">
                        ${neg.status === 'active' ? '[OPEN NEGOTIATIONS]' : (isRecipientOfOpen ? '' : '[VIEW]')}
                    </div>
                </div>
                ${actionHtml}
            </div>
        `;
    }

    return html;
}

function updateWizardStepIndicators(step) {
    for (let i = 1; i <= 3; i++) {
        const el = document.getElementById('wizard-step-ind-' + i);
        if (!el) continue;
        el.classList.remove('active', 'completed');
        if (i < step) el.classList.add('completed');
        if (i === step) el.classList.add('active');
    }
    for (let i = 1; i <= 3; i++) {
        const p = document.getElementById('wizard-panel-' + i);
        if (!p) continue;
        p.classList.toggle('active', i === step);
    }
}

async function renderWizardStep1() {
    const panel = document.getElementById('wizard-panel-1');
    if (!panel) return;

    panel.innerHTML = '<p style="color:#666;font-style:italic;font-size:0.82rem;">Loading nations...</p>';

    // Fetch nations we have ambassadors to (with active counterpart ambassadors)
    const ambNationIds = diplomaticRoles.ambassadorTo.map(a => a.target_nation_id);
    const hasAmbassador = ambNationIds.length > 0;

    // Also fetch ALL other nations for HoG fallback
    const { data: allNations } = await _supabase.from('nations').select('id, name').neq('id', currentNation.id);

    let theirAmbs = [];
    if (hasAmbassador) {
        const { data } = await _supabase.from('ambassadors').select('nation_id, target_nation_id, status, is_active')
            .eq('target_nation_id', currentNation.id)
            .eq('is_active', true)
            .eq('status', 'active')
            .in('nation_id', ambNationIds);
        theirAmbs = data || [];
    }
    const nationsWithCounterAmb = new Set(theirAmbs.map(a => a.nation_id));

    // Determine AP cost
    const isHoGOnly = diplomaticRoles.isHoG && !hasAmbassador && !diplomaticRoles.isMoT && !diplomaticRoles.isFM;
    const isMoTOnly = diplomaticRoles.isMoT && !hasAmbassador && !diplomaticRoles.isHoG;
    const isFMOnly = diplomaticRoles.isFM && !hasAmbassador && !diplomaticRoles.isMoT && !diplomaticRoles.isHoG;
    const canSelectAny = isHoGOnly || isMoTOnly || isFMOnly; // HoG, MoT, or FM can select any nation
    const apCost = isHoGOnly ? DIPLOMACY_CONFIG.HOG_DRAFT_INITIATIVE_AP : DIPLOMACY_CONFIG.PROPOSE_TRADE_NEGOTIATION_AP;

    let html = '';
    if (isHoGOnly) {
        html += '<div class="trade-info-box warning" style="margin-bottom:12px;">No Trade Minister, Foreign Minister, or ambassador appointed. As Head of Government, you can propose at a higher AP cost (' + apCost + ' AP instead of ' + DIPLOMACY_CONFIG.PROPOSE_TRADE_NEGOTIATION_AP + ' AP).</div>';
    }
    if (isMoTOnly) {
        html += '<div class="trade-info-box info" style="margin-bottom:12px;">As Minister of Trade, you can propose trade negotiations to any nation. Diplomatic initiatives still require an ambassador.</div>';
    }
    if (isFMOnly) {
        html += '<div class="trade-info-box info" style="margin-bottom:12px;">As Foreign Minister, you can propose trade negotiations to any nation. Diplomatic initiatives still require an ambassador.</div>';
    }
    html += '<p style="font-size:0.78rem;color:var(--text-muted);margin-bottom:12px;">Select a nation to negotiate with. Trade Ministers, Ambassadors, Foreign Ministers, and Heads of Government can initiate trade talks.</p>';

    const nations = allNations || [];
    for (const nation of nations) {
        const weHaveAmb = ambNationIds.includes(nation.id);
        const hasCounter = nationsWithCounterAmb.has(nation.id);
        const mutualAmbs = weHaveAmb && hasCounter;
        const canSelect = mutualAmbs || canSelectAny;
        const flagUrl = FLAG_URLS[nation.name] || null;
        const ambInfo = diplomaticRoles.ambassadorTo.find(a => a.target_nation_id === nation.id);
        const ambName = ambInfo ? ((ambInfo.ambassador_first_name || '') + ' ' + (ambInfo.ambassador_last_name || '')).trim() : '';
        const ambPartyInit = ambInfo?.factions?.abbreviation ? ' (' + ambInfo.factions.abbreviation + ')' : '';

        let statusNote = '';
        if (!weHaveAmb && !canSelectAny) statusNote = '<span style="color:#f97316;">No ambassador posted</span>';
        else if (weHaveAmb && !hasCounter) statusNote = '<span style="color:#f97316;">No counterpart ambassador</span>';

        const roleLabel = ambName ? 'Your Amb: ' + escapeHtml(ambName + ambPartyInit) : isHoGOnly ? 'Drafting as HoG' : isMoTOnly ? 'Drafting as Min. of Trade' : isFMOnly ? 'Drafting as FM' : 'No ambassador';

        html += `
            <div class="wizard-nation-item ${canSelect ? '' : 'disabled'}" data-nation-id="${nation.id}" onclick="wizardSelectNation('${nation.id}')">
                ${flagUrl ? '<img src="' + flagUrl + '" class="nation-card-flag" />' : '<div class="nation-card-flag-placeholder"></div>'}
                <div>
                    <div class="wizard-nation-name">${escapeHtml(nation.name)}</div>
                    <div class="wizard-nation-detail">
                        ${roleLabel}
                        ${statusNote ? ' &middot; ' + statusNote : ''}
                    </div>
                </div>
            </div>
        `;
    }

    html += '<div class="wizard-nav"><button class="wizard-next-btn" id="wizard-next-1" disabled onclick="wizardGoToStep2()">Next</button></div>';
    panel.innerHTML = html;
}

}

function wizardBackToStep1() {
    wizardStep = 1;
    wizardCategory = null;
    wizardAgreementType = null;
    updateWizardStepIndicators(1);
}

async function wizardGoToStep3() {
    if (!wizardCategory) return;

    // Block MoT-only players from the diplomatic initiative path
    if (wizardCategory === 'diplomatic') {
        const hasAmbassador = diplomaticRoles && diplomaticRoles.ambassadorTo.length > 0;
        const isMoTOnly = diplomaticRoles.isMoT && !hasAmbassador && !diplomaticRoles.isFM && !diplomaticRoles.isHoG;
        if (isMoTOnly) {
            alert('The Minister of Trade can only propose Trade Agreements, not Diplomatic Initiatives.');
            return;
        }
    }

    wizardStep = 3;
    updateWizardStepIndicators(3);
    if (wizardCategory === 'diplomatic') {
        await renderWizardStep3Diplomatic();
    } else if (wizardCategory === 'economic_aid') {
        // Economic aid skips type selection — go straight to proposal with pre-set type
        wizardAgreementType = 'economic_aid';
        await renderWizardStep3AidProposal();
    } else {
        await renderWizardStep3TradeProposal();
    }
}

// ==================== STEP 3A: DIPLOMATIC INITIATIVE TYPE SELECTION ====================
async function renderWizardStep3Diplomatic() {
    const panel = document.getElementById('wizard-panel-3');
    if (!panel) return;

    panel.innerHTML = '<p style="color:#666;font-style:italic;font-size:0.82rem;">Loading...</p>';

    // Fetch existing active/pending agreements between these nations to disable used types
    const usedTypes = new Set();
    try {
        const { data: existing } = await _supabase
            .from('diplomatic_proposals')
            .select('proposal_data, status')
            .eq('proposal_type', 'diplomatic_initiative')
            .in('status', ['proposed', 'revised', 'active'])
            .or(
                'and(proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + wizardTargetNation + '),' +
                'and(proposing_nation_id.eq.' + wizardTargetNation + ',target_nation_id.eq.' + currentNation.id + ')'
            );
        if (existing) {
            for (const prop of existing) {
                const agType = prop.proposal_data?.agreement_type;
                if (agType) usedTypes.add(agType);
                const arts = prop.proposal_data?.articles || [];
                const struck = new Set(prop.proposal_data?.struck_articles || []);
                arts.forEach((art, i) => {
                    if (prop.status === 'active' && struck.has(i)) return;
                    if (art.type) usedTypes.add(art.type);
                });
            }
        }
    } catch (e) { console.warn('Error checking existing agreements:', e); }

    let html = '<p style="font-size:0.78rem;color:var(--text-muted);margin-bottom:12px;">Choose the type of diplomatic initiative.</p>';
    html += '<div class="type-card-grid">';

    for (const [key, info] of Object.entries(INITIATIVE_TYPES)) {
        const isUsed = usedTypes.has(key);
        const classBadge = '<span class="classification-badge classification-' + info.classification.toLowerCase() + '">' + info.classification + '</span>';
        const relStr = info.relations > 0 ? '+' + info.relations + ' Rel' : info.relations < 0 ? info.relations + ' Rel' : '';
        const moneyStr = info.money > 0 ? '+$' + (info.money / 1e6).toFixed(0) + 'M' : info.money < 0 ? '-$' + (Math.abs(info.money) / 1e6).toFixed(0) + 'M' : '';

        html += `
            <div class="type-card ${isUsed ? 'disabled' : ''}" data-type-key="${key}" onclick="wizardSelectDiploType('${key}')">
                <div class="type-card-title">${escapeHtml(info.label)} ${classBadge}</div>
                <div class="type-card-desc">${escapeHtml(info.description || '')}</div>
                <div class="type-card-effects">
                    ${relStr ? '<span class="effect-tag effect-rel">' + relStr + '</span>' : ''}
                    ${moneyStr ? '<span class="effect-tag effect-money">' + moneyStr + '</span>' : ''}
                    ${!relStr && !moneyStr ? '<span class="effect-tag" style="background:var(--bg-hover);color:var(--text-muted);">No effects</span>' : ''}
                </div>
                ${isUsed ? '<div class="type-card-already">Already active or pending</div>' : ''}
            </div>
        `;
    }

    html += '</div>';
    html += '<div id="diplo-draft-section"></div>';
    html += `<div class="wizard-nav">
        <button class="wizard-back-btn" onclick="wizardBackToStep2()">Back</button>
    </div>`;

    panel.innerHTML = html;
}

async function wizardSelectDiploType(typeKey) {
    document.querySelectorAll('#wizard-panel-3 .type-card').forEach(el => el.classList.remove('selected'));
    const card = document.querySelector('#wizard-panel-3 .type-card[data-type-key="' + typeKey + '"]');
    if (card && !card.classList.contains('disabled')) {
        card.classList.add('selected');
        wizardAgreementType = typeKey;
        // Expand the article drafting form inline
        await renderDiploDraftSection();
    }
}

                ${classBadge}
            </div>

            <div class="initiative-field">

            </div>

            <div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:12px;line-height:1.5;padding:8px 10px;background:var(--bg-body);border-radius:4px;border:1px solid var(--border-light);">
                ${preamble}

            <div class="initiative-field">
                <label>Duration</label>
                <select id="wizard-duration" onchange="wizardUpdatePreview()">${durationOptions}</select>
            </div>

            <div class="initiative-effects">
                ${relStr ? '<span class="effect-tag effect-rel">' + relStr + '</span>' : ''}
                ${moneyStr ? '<span class="effect-tag effect-money">' + moneyStr + '</span>' : ''}
            </div>

            <div class="diplo-section-title">Articles</div>
            <div id="wizard-articles-list"></div>
            <button class="action-btn" style="font-size:0.72rem;margin-top:4px;" onclick="wizardAddArticle()">+ Add Article</button>

            <div id="wizard-preview" class="initiative-preview" style="display:none;margin-top:12px;"></div>

            <div class="initiative-btn-row" style="margin-top:12px;">
                <button class="wizard-next-btn" id="wizard-submit-btn" disabled onclick="wizardSubmit()">Submit Proposal</button>
