async function updateRTDraftTarget(nationId) {
    if (!nationId) { activeDraftTarget = null; }
    else {
        const nation = cachedOtherNations.find(n => n.id === nationId);
        activeDraftTarget = nation || null;
    }
    const body = document.getElementById('draft-body');
    const statusEl = document.getElementById('draft-status');
    if (body) await renderRetaliatoryTariffDraftPanel(body, statusEl);
}
window.updateRTDraftTarget = updateRTDraftTarget;

function toggleRTDraftDuration() {
    const isPermanent = document.querySelector('input[name="rt-draft-dur"][value="permanent"]')?.checked;
    const fields = document.getElementById('rt-draft-dur-fields');
    if (fields) fields.style.display = isPermanent ? 'none' : 'block';
}
window.toggleRTDraftDuration = toggleRTDraftDuration;

function updateRTDraftSummary() {
    const pct = parseInt(document.getElementById('rt-draft-pct')?.value || '25');
    const display = document.getElementById('rt-draft-pct-display');
    if (display) display.textContent = pct + '%';

    const checked = document.querySelectorAll('input[name="rt-draft-sector"]:checked');
    const btn = document.getElementById('rt-draft-submit');
    const summary = document.getElementById('rt-draft-summary');

    if (checked.length === 0) {
        if (summary) { summary.className = 'trade-info-box info'; summary.textContent = 'Select sectors to see impact.'; }
        if (btn) btn.disabled = true;
        return;
    }
    if (btn) btn.disabled = false;

    const sectorNames = [];
    checked.forEach(cb => { const s = TRADEABLE_SECTORS.find(ts => ts.key === cb.value); if (s) sectorNames.push(s.label); });
    const relPenalty = Math.round(pct / 2);

    if (summary) {
        summary.className = 'trade-info-box ' + (pct >= 35 ? 'warning' : 'info');
        summary.innerHTML = '<strong>+' + pct + '% surcharge</strong> on ' + sectorNames.join(', ') + ' imports. Diplomatic impact: <strong>-' + relPenalty + ' Relations</strong>.';
    }
}
window.updateRTDraftSummary = updateRTDraftSummary;

async function submitRTDraft() {
    const btn = document.getElementById('rt-draft-submit');
    if (btn) btn.disabled = true;

    const checked = document.querySelectorAll('input[name="rt-draft-sector"]:checked');
    if (checked.length === 0) { alert('Select at least one sector.'); if (btn) btn.disabled = false; return; }

    const pct = Math.min(50, Math.max(5, parseInt(document.getElementById('rt-draft-pct')?.value || '25')));
    const durType = document.querySelector('input[name="rt-draft-dur"]:checked')?.value || 'fixed';
    const durTicks = durType === 'fixed' ? Math.min(48, Math.max(4, parseInt(document.getElementById('rt-draft-ticks')?.value || '12'))) : null;
    const apCost = 2;
    const targetId = activeDraftTarget?.id;
    const targetName = activeDraftTarget?.name || 'Unknown';
    if (!targetId) { alert('Select a target nation.'); if (btn) btn.disabled = false; return; }

    const apResult = await deductAP(_supabase, currentFaction.id, apCost);
    if (!apResult.success) {
        if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
        alert('Not enough AP (' + apCost + ' needed). Current AP: ' + (apResult.currentAp ?? '?'));
        if (btn) btn.disabled = false;
        return;
    }

    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const currentTick = shard?.current_tick || 0;

    const articles = [];
    checked.forEach(cb => {
        articles.push({ type: 'tariff_surcharge', data: { sector: cb.value, surcharge_pct: pct, imposer_nation_id: currentNation.id } });
    });
    articles.push({ type: 'duration', data: { duration_type: durType, duration_ticks: durTicks, auto_renew: false, withdrawal_notice_ticks: 1 } });

    const sectorNames = [];
    checked.forEach(cb => { const s = TRADEABLE_SECTORS.find(ts => ts.key === cb.value); if (s) sectorNames.push(s.label); });

    const agreementName = 'Retaliatory Tariff on ' + targetName;
    const billTitle = 'Ratify: ' + agreementName;
    const billPreamble = 'Ratification of retaliatory tariff against ' + targetName + '. Imposes +' + pct + '% tariff surcharge on ' + sectorNames.join(', ') + ' imports. ' +
        (durType === 'permanent' ? 'Duration: until revoked.' : 'Duration: ' + durTicks + ' ticks.');

    const { data: bill, error: billErr } = await _supabase.from('bills').insert({
        nation_id: currentNation.id,
        bill_type: 'ratification',
        bill_name: billTitle,
        preamble: billPreamble,
        proposed_by: currentFaction.id,
        status: 'floor',
        proposed_tick: currentTick,
        floor_tick: currentTick,
        voting_ends_tick: currentTick + GAME_CONFIG.VOTING_WINDOW_TICKS,
        trade_agreement_data: {
            type: 'retaliatory_tariff',
            imposer_nation_id: currentNation.id,
            target_nation_id: targetId,
            agreement_name: agreementName,
            articles: articles,
            duration_type: durType,
            duration_ticks: durTicks
        }
    }).select('id').single();

    if (billErr) { alert('Error: ' + billErr.message); if (btn) btn.disabled = false; return; }

    try {
        await _supabase.from('event_log').insert({
            nation_id: currentNation.id, event_name: agreementName + ' — Proposed', category: 'Trade',
            description_chosen: currentNation.name + ' has submitted a retaliatory tariff bill targeting ' + targetName + ' (' + sectorNames.join(', ') + ' at +' + pct + '%).',
            fired_at_tick: currentTick
        });
        await _supabase.from('event_log').insert({
            nation_id: targetId, event_name: 'Retaliatory Tariff Proposed', category: 'Trade',
            description_chosen: currentNation.name + ' has proposed a retaliatory tariff on your ' + sectorNames.join(', ') + ' exports (+' + pct + '%).',
            fired_at_tick: currentTick
        });
    } catch (e) { /* non-blocking */ }

    alert('Retaliatory tariff bill submitted to parliament!');
    cancelDraft();
}
window.submitRTDraft = submitRTDraft;

function updateESDraftSummary() {

async function submitESDraft() {
    const btn = document.getElementById('es-draft-submit');
    if (btn) btn.disabled = true;

    const sector = document.getElementById('es-draft-sector')?.value;
    if (!sector) { alert('Select a sector.'); if (btn) btn.disabled = false; return; }

    const pct = Math.min(30, Math.max(5, parseInt(document.getElementById('es-draft-pct')?.value || '15')));
    const fundSource = document.querySelector('input[name="es-draft-fund"]:checked')?.value || 'general_treasury';
    const durType = document.querySelector('input[name="es-draft-dur"]:checked')?.value || 'fixed';
    const durTicks = durType === 'fixed' ? Math.min(24, Math.max(4, parseInt(document.getElementById('es-draft-ticks')?.value || '12'))) : null;
    const apCost = 2;

    const apResult = await deductAP(_supabase, currentFaction.id, apCost);
    if (!apResult.success) {
        if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
        alert('Not enough AP (' + apCost + ' needed). Current AP: ' + (apResult.currentAp ?? '?'));
        if (btn) btn.disabled = false;
        return;
    }

    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const currentTick = shard?.current_tick || 0;

    const sectorLabel = TRADEABLE_SECTORS.find(s => s.key === sector)?.label || sector;
    const agreementName = sectorLabel + ' Export Subsidy';

    const articles = [
        { type: 'subsidized_sector', data: { sector: sector, subsidy_pct: pct } },
        { type: 'funding_source', data: { source: fundSource } },
        { type: 'duration', data: { duration_type: durType, duration_ticks: durTicks, auto_renew: false, withdrawal_notice_ticks: 1 } }
    ];

    const billTitle = 'Ratify: ' + agreementName;
    const billPreamble = 'Ratification of export subsidy. Subsidizes ' + sectorLabel + ' exports at ' + pct + '%, funded from ' +
        (fundSource === 'general_treasury' ? 'the general treasury' : 'Ministry of Trade budget') + '. ' +
        (durType === 'permanent' ? 'Duration: until revoked.' : 'Duration: ' + durTicks + ' ticks.');

    const { error: billErr } = await _supabase.from('bills').insert({
        nation_id: currentNation.id,
        bill_type: 'ratification',
        bill_name: billTitle,
        preamble: billPreamble,
        proposed_by: currentFaction.id,
        status: 'floor',
        proposed_tick: currentTick,
        floor_tick: currentTick,
        voting_ends_tick: currentTick + GAME_CONFIG.VOTING_WINDOW_TICKS,
        trade_agreement_data: {
            type: 'export_subsidy',
            imposer_nation_id: currentNation.id,
            target_nation_id: null,
            agreement_name: agreementName,
            articles: articles,
            duration_type: durType,
            duration_ticks: durTicks
        }
    }).select('id').single();

    if (billErr) { alert('Error: ' + billErr.message); if (btn) btn.disabled = false; return; }

    try {
        await _supabase.from('event_log').insert({
            nation_id: currentNation.id, event_name: agreementName + ' — Proposed', category: 'Trade',
            description_chosen: currentNation.name + ' has submitted an export subsidy bill for ' + sectorLabel + ' at ' + pct + '%.',
            fired_at_tick: currentTick
        });
    } catch (e) { /* non-blocking */ }

    alert('Export subsidy bill submitted to parliament!');
    cancelDraft();
}
window.submitESDraft = submitESDraft;

// ── Impose Embargo (unilateral) ──

var _embargoTradeData = {};  // cached trade flow data per target: { sectorKey: { imports, exports } }

async function renderEmbargoDraftPanel(body, statusEl) {
    if (statusEl) { statusEl.textContent = 'Drafting'; statusEl.className = 'badge badge--amber'; }

    const apCost = 5;

    let html = '<div class="draft-panel"><div class="draft-header">';
    html += '<div class="draft-field"><div class="draft-field-label">Action</div><div class="draft-field-input">Impose Embargo <span style="float:right;font-size:10px;color:var(--text-dim);">Minister of Trade</span></div></div>';
    html += '<div style="display:flex;gap:6px;justify-content:flex-end;margin-top:-2px;margin-bottom:4px;">';
    html += '<span class="badge badge--amber" style="font-size:7px;">Unilateral</span>';
    html += '<span class="badge badge--amber" style="font-size:7px;">Requires Parliament</span>';
    html += '<span style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);">' + apCost + ' AP</span>';
    html += '</div>';

    // Target selector
    let targetFieldHtml = '<select id="emb-draft-target" style="width:100%;background:var(--bg-3);border:1px solid var(--border-subtle);color:var(--text-primary);font-family:var(--font-sans);font-size:12px;padding:4px 8px;" onchange="updateEmbargoDraftTarget(this.value)">';
    targetFieldHtml += '<option value="">Select target nation...</option>';
    cachedOtherNations.forEach(n => {
        const sel = activeDraftTarget && activeDraftTarget.id === n.id ? ' selected' : '';
        targetFieldHtml += '<option value="' + n.id + '"' + sel + '>' + escapeHtml(n.name) + '</option>';
    });
    targetFieldHtml += '</select>';
    html += '<div class="draft-field"><div class="draft-field-label">Target</div>' + targetFieldHtml + '</div>';
    html += '</div>';  // close draft-header

    if (!activeDraftTarget) {
        html += '<div class="empty-state" style="padding:20px 0;"><div class="empty-state-text">Select a target nation.</div></div></div>';
        body.innerHTML = html;
        return;
    }

    // Check for existing active embargo
    const { data: existingEmb } = await _supabase
        .from('trade_agreements')
        .select('id')
        .eq('status', 'active')
        .eq('agreement_type', 'impose_embargo')
        .eq('nation_a_id', currentNation.id)
        .eq('nation_b_id', activeDraftTarget.id);

    if (existingEmb && existingEmb.length > 0) {
        html += '<div class="trade-info-box warning" style="margin:12px 14px;">You already have an active embargo against ' + escapeHtml(activeDraftTarget.name) + '. Wait for it to expire or withdraw it first.</div></div>';
        body.innerHTML = html;
        return;
    }

    // Fetch trade flow data between our nation and target
    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const latestTick = shard?.current_tick || 0;

    const { data: tradeRows } = await _supabase
        .from('trade_partners')
        .select('sector, trade_volume, exporter_nation_id, importer_nation_id')
        .eq('tick', latestTick)
        .or('and(exporter_nation_id.eq.' + currentNation.id + ',importer_nation_id.eq.' + activeDraftTarget.id + '),' +
            'and(exporter_nation_id.eq.' + activeDraftTarget.id + ',importer_nation_id.eq.' + currentNation.id + ')');

    _embargoTradeData = {};
    if (tradeRows) {
        for (var i = 0; i < tradeRows.length; i++) {
            var row = tradeRows[i];
            if (!_embargoTradeData[row.sector]) _embargoTradeData[row.sector] = { imports: 0, exports: 0 };
            if (row.exporter_nation_id === activeDraftTarget.id) {
                // Target exports to us = our imports from target
                _embargoTradeData[row.sector].imports += Number(row.trade_volume) || 0;
            } else {
                // We export to target = our exports to target
                _embargoTradeData[row.sector].exports += Number(row.trade_volume) || 0;
            }
        }
    }

    // Scope
    html += '<div style="padding:8px 14px 0;">';
    html += '<div class="draft-field-label">Scope</div>';
    html += '<div class="trade-radio-group" style="margin-top:4px;">';
    html += '<label class="trade-radio-option" onclick="selectRadioOption(this);toggleEmbargoScope()"><input type="radio" name="emb-draft-scope" value="targeted" /><div><div class="trade-radio-label">Targeted</div></div></label>';
    html += '<label class="trade-radio-option selected" onclick="selectRadioOption(this);toggleEmbargoScope()"><input type="radio" name="emb-draft-scope" value="partial" checked /><div><div class="trade-radio-label">Partial</div></div></label>';
    html += '<label class="trade-radio-option" onclick="selectRadioOption(this);toggleEmbargoScope()"><input type="radio" name="emb-draft-scope" value="total" /><div><div class="trade-radio-label">Total</div></div></label>';
    html += '</div>';
    html += '<div style="font-size:0.62rem;color:var(--text-dim);margin-top:2px;">Partial: select sectors. Total: all trade blocked.</div>';
    html += '</div>';

    // Duration
    html += '<div style="padding:8px 14px;">';
    html += '<div class="draft-field-label">Duration</div>';
    html += '<div style="display:flex;align-items:center;gap:8px;margin-top:4px;">';
    html += '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);"></span>';
    html += '<input type="number" id="emb-draft-ticks" value="12" min="4" max="48" style="width:60px;background:var(--bg-3);border:1px solid var(--border-subtle);color:var(--text-primary);padding:4px 8px;font-size:12px;" oninput="updateEmbargoDraftSummary()" />';
    html += '<span style="font-size:0.72rem;color:var(--text-primary);">ticks</span>';
    html += '<span style="font-size:0.62rem;color:var(--text-dim);margin-left:4px;">Range: 4\u201348 ticks</span>';
    html += '</div></div>';

    // Sector selection
    html += '<div id="emb-draft-sectors-wrap" style="padding:4px 14px;">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;">';
    html += '<div class="draft-field-label" style="color:var(--text-dim);">Select Sectors to Embargo</div>';
    html += '<div id="emb-draft-sector-count" style="font-size:0.62rem;color:var(--text-dim);"></div>';
    html += '</div>';

    var targetName = escapeHtml(activeDraftTarget.name);
    TRADEABLE_SECTORS.forEach(function(s) {
        var td = _embargoTradeData[s.key] || { imports: 0, exports: 0 };
        var annualImports = td.imports * 12;  // per-tick to annual approximation
        var annualExports = td.exports * 12;
        var impactVal = annualImports + annualExports;
        html += '<label class="emb-sector-row" style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border-hair);cursor:pointer;">';
        html += '<input type="checkbox" name="emb-draft-sector" value="' + s.key + '" onchange="updateEmbargoDraftSummary()" style="accent-color:var(--red);" />';
        html += '<div style="flex:1;">';
        html += '<div style="font-size:0.78rem;font-weight:600;color:var(--text-primary);">' + escapeHtml(s.label) + '</div>';
        html += '<div style="font-size:0.62rem;color:var(--text-dim);">Imports ' + fmtBudgetCurrency(annualImports) + '/yr from ' + targetName + ' / Exports ' + fmtBudgetCurrency(annualExports) + '/yr</div>';
        html += '</div>';
        html += '<div style="font-family:var(--font-mono);font-size:11px;color:var(--red);min-width:60px;text-align:right;">' + (impactVal > 0 ? '-' + fmtBudgetCurrency(impactVal) : '') + '</div>';
        html += '</label>';
    });
    html += '</div>';

    // Hostile action warning
    html += '<div class="trade-info-box danger" style="margin:10px 14px;">';
    html += '<strong style="text-transform:uppercase;font-size:0.68rem;">Hostile Action Warning</strong><br>';
    html += 'Imposing an embargo is a major escalation. ' + targetName + ' will lose significant trade revenue and may retaliate with their own embargo, tariffs, or diplomatic severance. Existing trade agreements with ' + targetName + ' in embargoed sectors will be suspended for the embargo\'s duration.';
    html += '</div>';

    // Footer summary + actions
    html += '<div id="emb-draft-footer" style="font-family:var(--font-mono);font-size:0.68rem;color:var(--text-dim);padding:6px 14px;text-transform:uppercase;letter-spacing:0.06em;"></div>';
    html += '<div class="detail-actions" style="margin-top:auto;padding-top:10px;border-top:1px solid var(--border-hair);">';
    html += '<button class="detail-btn" onclick="cancelDraft()">Cancel</button>';
    html += '<button class="detail-btn" id="emb-draft-submit" style="color:var(--teal);border-color:var(--teal-border);" disabled onclick="submitEmbargoDraft()">Submit to Parliament (' + apCost + ' AP)</button>';
    html += '</div></div>';
    body.innerHTML = html;

    updateEmbargoDraftSummary();
}

async function updateEmbargoDraftTarget(nationId) {
    if (!nationId) { activeDraftTarget = null; }
    else {
        var nation = cachedOtherNations.find(function(n) { return n.id === nationId; });
        activeDraftTarget = nation || null;
    }
    var body = document.getElementById('draft-body');
    var statusEl = document.getElementById('draft-status');
    if (body) await renderEmbargoDraftPanel(body, statusEl);
}
window.updateEmbargoDraftTarget = updateEmbargoDraftTarget;

function toggleEmbargoScope() {
    var scope = document.querySelector('input[name="emb-draft-scope"]:checked')?.value || 'partial';
    var checkboxes = document.querySelectorAll('input[name="emb-draft-sector"]');
    var wrap = document.getElementById('emb-draft-sectors-wrap');

    if (scope === 'total') {
        // Select all, disable checkboxes
        checkboxes.forEach(function(cb) { cb.checked = true; cb.disabled = true; });
        if (wrap) wrap.style.opacity = '0.6';
    } else {
        // Enable checkboxes, uncheck all so user can pick
        checkboxes.forEach(function(cb) { cb.disabled = false; cb.checked = false; });
        if (wrap) wrap.style.opacity = '1';
    }
    updateEmbargoDraftSummary();
}
window.toggleEmbargoScope = toggleEmbargoScope;

function updateEmbargoDraftSummary() {
    var scope = document.querySelector('input[name="emb-draft-scope"]:checked')?.value || 'partial';
    var checked = document.querySelectorAll('input[name="emb-draft-sector"]:checked');
    var durTicks = Math.min(48, Math.max(4, parseInt(document.getElementById('emb-draft-ticks')?.value || '12')));
    var btn = document.getElementById('emb-draft-submit');
    var footer = document.getElementById('emb-draft-footer');
    var countEl = document.getElementById('emb-draft-sector-count');

    var sectorCount = checked.length;
    var totalSectors = TRADEABLE_SECTORS.length;

    if (countEl) countEl.textContent = sectorCount + ' of ' + totalSectors + ' sectors selected';

    // Determine scope label
    var scopeLabel = scope === 'total' ? 'Total' : scope === 'targeted' ? 'Targeted' : 'Partial';

    // Validate based on scope
    var valid = false;
    if (scope === 'targeted') valid = sectorCount === 1;
    else if (scope === 'partial') valid = sectorCount >= 2 && sectorCount < totalSectors;
    else if (scope === 'total') valid = sectorCount === totalSectors;

    if (btn) btn.disabled = !valid;
    if (footer) footer.textContent = scopeLabel + ' / ' + sectorCount + ' sector' + (sectorCount !== 1 ? 's' : '') + ' / ' + durTicks + ' ticks';
}
window.updateEmbargoDraftSummary = updateEmbargoDraftSummary;

async function submitEmbargoDraft() {
    var btn = document.getElementById('emb-draft-submit');
    if (btn) btn.disabled = true;

    var scope = document.querySelector('input[name="emb-draft-scope"]:checked')?.value || 'partial';
    var checked = document.querySelectorAll('input[name="emb-draft-sector"]:checked');
    var durTicks = Math.min(48, Math.max(4, parseInt(document.getElementById('emb-draft-ticks')?.value || '12')));
    var apCost = 5;
    var targetId = activeDraftTarget?.id;
    var targetName = activeDraftTarget?.name || 'Unknown';

    if (!targetId) { alert('Select a target nation.'); if (btn) btn.disabled = false; return; }

    var sectorCount = checked.length;
    var totalSectors = TRADEABLE_SECTORS.length;

    // Validate scope
    if (scope === 'targeted' && sectorCount !== 1) { alert('Targeted embargo requires exactly 1 sector.'); if (btn) btn.disabled = false; return; }
    if (scope === 'partial' && (sectorCount < 2 || sectorCount >= totalSectors)) { alert('Partial embargo requires 2 to ' + (totalSectors - 1) + ' sectors.'); if (btn) btn.disabled = false; return; }
    if (scope === 'total' && sectorCount !== totalSectors) { alert('Total embargo requires all sectors.'); if (btn) btn.disabled = false; return; }

    var apResult = await deductAP(_supabase, currentFaction.id, apCost);
    if (!apResult.success) {
        if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
        alert('Not enough AP (' + apCost + ' needed). Current AP: ' + (apResult.currentAp ?? '?'));
        if (btn) btn.disabled = false;
        return;
    }

    var { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    var currentTick = shard?.current_tick || 0;

    var articles = [];
    var sectorNames = [];
    checked.forEach(function(cb) {
        articles.push({ type: 'embargo_sector', data: { sector: cb.value, imposer_nation_id: currentNation.id } });
        var s = TRADEABLE_SECTORS.find(function(ts) { return ts.key === cb.value; });
        if (s) sectorNames.push(s.label);
    });
    articles.push({ type: 'duration', data: { duration_type: 'fixed', duration_ticks: durTicks, auto_renew: false, withdrawal_notice_ticks: 1 } });

    var scopeLabel = scope === 'total' ? 'Total' : scope === 'targeted' ? 'Targeted' : 'Partial';
    var agreementName = scopeLabel + ' Embargo on ' + targetName;
    var billTitle = 'Ratify: ' + agreementName;
    var billPreamble = scopeLabel + ' embargo on ' + targetName + '. Blocks trade in ' + sectorNames.join(', ') + '. Duration: ' + durTicks + ' ticks.';

    var { data: bill, error: billErr } = await _supabase.from('bills').insert({
        nation_id: currentNation.id,
        bill_type: 'ratification',
        bill_name: billTitle,
        preamble: billPreamble,
        proposed_by: currentFaction.id,
        status: 'floor',
        proposed_tick: currentTick,
        floor_tick: currentTick,
        voting_ends_tick: currentTick + GAME_CONFIG.VOTING_WINDOW_TICKS,
        trade_agreement_data: {
            type: 'impose_embargo',
            imposer_nation_id: currentNation.id,
            target_nation_id: targetId,
            agreement_name: agreementName,
            articles: articles,
            scope: scope,
            duration_type: 'fixed',
            duration_ticks: durTicks
        }
    }).select('id').single();

    if (billErr) { alert('Error: ' + billErr.message); if (btn) btn.disabled = false; return; }

    try {
        await _supabase.from('event_log').insert({
            nation_id: currentNation.id, event_name: agreementName + ' — Proposed', category: 'Trade',
            description_chosen: currentNation.name + ' has submitted an embargo bill targeting ' + targetName + ' (' + sectorNames.join(', ') + ').',
            fired_at_tick: currentTick
        });
        await _supabase.from('event_log').insert({
            nation_id: targetId, event_name: 'Embargo Proposed', category: 'Trade',
            description_chosen: currentNation.name + ' has proposed a ' + scopeLabel.toLowerCase() + ' embargo on your ' + sectorNames.join(', ') + ' trade.',
            fired_at_tick: currentTick
        });
    } catch (e) { /* non-blocking */ }

    alert('Embargo bill submitted to parliament!');
    cancelDraft();
}
window.submitEmbargoDraft = submitEmbargoDraft;

// ── Send Message Panel ──
async function renderSendMessagePanel(body, statusEl) {
    if (statusEl) statusEl.textContent = 'Send Message';

    // Check which nations we have ambassadors to
    const ambTargets = (diplomaticRoles.ambassadorTo || []).map(a => a.target_nation_id);
    if (ambTargets.length === 0) {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">You need an active ambassador to send messages. Ask your Foreign Minister to appoint one.</div></div>';
        return;
    }

    // Fetch nation names for ambassador targets
    const { data: ambNations } = await _supabase.from('nations').select('id, name').in('id', ambTargets);
    const nations = (ambNations || []).sort((a, b) => a.name.localeCompare(b.name));

    // Build target selector
    let html = '<div class="draft-panel">';
    html += '<div class="draft-header">';
    html += '<div class="draft-field"><div class="draft-field-label">Action</div><div class="draft-field-input">Send Message <span style="color:var(--teal);">(Free)</span></div></div>';
    html += '<div class="draft-field"><div class="draft-field-label">To Nation</div><div class="draft-field-input">';
    html += '<select id="msg-target-select" style="width:100%;background:var(--bg-3);border:1px solid var(--border-subtle);color:var(--text-primary);font-family:var(--font-sans);font-size:12px;padding:4px 8px;" onchange="selectMessageTarget(this.value)">';
    html += '<option value="">Select a nation...</option>';
    nations.forEach(n => {
        const sel = activeDraftTarget && activeDraftTarget.id === n.id ? ' selected' : '';
        html += '<option value="' + n.id + '"' + sel + '>' + escapeHtml(n.name) + '</option>';
    });
    html += '</select></div></div>';
    html += '</div>';

    if (activeDraftTarget) {
        // Fetch messages
        let messages = [];
        try {
            const { data } = await _supabase
                .from('diplomatic_messages')
                .select('*')
                .or(
                    'and(from_nation_id.eq.' + currentNation.id + ',to_nation_id.eq.' + activeDraftTarget.id + '),' +
                    'and(from_nation_id.eq.' + activeDraftTarget.id + ',to_nation_id.eq.' + currentNation.id + ')'
                )
                .order('sent_at_tick', { ascending: true })
                .order('created_at', { ascending: true })
                .limit(100);
            messages = data || [];
        } catch (e) { /* */ }

        // Mark unread incoming messages as read by this faction
        if (activeDraftTarget) {
            markDiploMessagesRead(messages, activeDraftTarget.id);
        }

        const msgsHTML = messages.length > 0
            ? messages.map(m => {
                const isMine = m.from_nation_id === currentNation.id;
                return '<div class="diplo-msg ' + (isMine ? 'mine' : 'theirs') + '">' +
                    '<div class="diplo-msg-sender">' + escapeHtml(m.sender_name || 'Unknown') +
                    ' <span class="role-badge" style="background:' + (isMine ? 'rgba(96,165,250,0.08)' : 'rgba(74,222,128,0.08)') +
                    ';color:' + (isMine ? '#60a5fa' : '#4ade80') +
                    ';border:1px solid ' + (isMine ? 'rgba(96,165,250,0.2)' : 'rgba(74,222,128,0.2)') + ';">' +
                    escapeHtml(m.sender_role || 'diplomat') + '</span></div>' +
                    '<div class="diplo-msg-text">' + escapeHtml(m.message_text) + '</div>' +
                    '<div class="diplo-msg-tick">Tick ' + m.sent_at_tick + '</div></div>';
            }).join('')
            : '<div class="diplo-chat-empty">No messages yet. Start the conversation.</div>';

        html += '<div class="diplo-chat-box" id="diplo-chat-box" style="max-height:280px;overflow-y:auto;margin:8px 0;">' + msgsHTML + '</div>';
        html += '<div class="diplo-chat-input" style="display:flex;gap:6px;padding:0;">';
        html += '<input type="text" id="diplo-msg-input" placeholder="Type a message..." maxlength="500" style="flex:1;background:var(--bg-3);border:1px solid var(--border-subtle);color:var(--text-primary);padding:6px 10px;font-size:12px;font-family:var(--font-sans);" onkeydown="if(event.key===\'Enter\')sendDiploMessage(\'' + activeDraftTarget.id + '\',\'' + escapeHtml(activeDraftTarget.name).replace(/'/g, "\\'") + '\')" />';
        html += '<button class="draft-submit-btn" style="padding:6px 14px;" onclick="sendDiploMessage(\'' + activeDraftTarget.id + '\',\'' + escapeHtml(activeDraftTarget.name).replace(/'/g, "\\'") + '\')">Send</button>';
        html += '</div>';
    } else {
        html += '<div class="empty-state"><div class="empty-state-text">Select a nation to open the diplomatic channel.</div></div>';
    }

    html += '</div>';
    html += '<div class="draft-actions"><button class="draft-cancel-btn" onclick="cancelDraft()">Close</button></div>';
    body.innerHTML = html;

    // Auto-scroll chat to bottom
    const chatBox = document.getElementById('diplo-chat-box');
    if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;
}

function selectMessageTarget(nationId) {
    if (!nationId) { activeDraftTarget = null; renderDraftBox(); return; }
    const n = cachedOtherNations.find(n => n.id === nationId);
    if (!n) {
        // Might not be in cachedOtherNations, fetch name from the select
        const sel = document.getElementById('msg-target-select');
        const name = sel?.options[sel.selectedIndex]?.text || 'Unknown';
        activeDraftTarget = { id: nationId, name: name };
    } else {
        activeDraftTarget = n;
    }
    renderDraftBox();
}

/**
 * Render the full Minor Diplomatic Initiative draft panel.
 * Target nation is auto-filled from ambassador posting (read-only).
 */
function renderMinorInitiativeDraftPanel(body, statusEl) {
    if (statusEl) statusEl.textContent = 'Drafting';

    // Determine the target nation from ambassador posting
    const ambPostings = diplomaticRoles.ambassadorTo || [];
    if (ambPostings.length === 0) {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Requires Ambassador posting.</div></div>';
        return;
    }

    // If only one ambassador posting, auto-select; otherwise show selector
    if (!activeDraftTarget && ambPostings.length === 1) {
        activeDraftTarget = { id: ambPostings[0].target_nation_id, name: ambPostings[0].target_nation_name };
    }

    let html = '<div class="draft-panel">';

    // ── Header fields ──
    html += '<div class="draft-header">';
    html += '<div class="draft-field"><div class="draft-field-label">Action</div><div class="draft-field-input">' +
        escapeHtml(activeDraftAction.label) + ' <span style="font-family:var(--font-mono);font-size:10px;font-weight:600;color:var(--teal);">' + MINOR_INITIATIVE_CONFIG.AP_COST + ' AP</span></div></div>';

    // Target nation — read-only if single posting, dropdown if multiple
    if (ambPostings.length === 1) {
        html += '<div class="draft-field"><div class="draft-field-label">Target</div><div class="draft-field-input">' +
            escapeHtml(ambPostings[0].target_nation_name) + '</div></div>';
    } else {
        html += '<div class="draft-field"><div class="draft-field-label">Target</div>' +
            '<select class="selector-dropdown" onchange="selectMinorInitiativeTarget(this.value)">' +
            '<option value="">Select posting...</option>';
        ambPostings.forEach(a => {
            const sel = activeDraftTarget && activeDraftTarget.id === a.target_nation_id ? ' selected' : '';
            html += '<option value="' + a.target_nation_id + '"' + sel + '>' + escapeHtml(a.target_nation_name) + '</option>';
        });
        html += '</select></div>';
    }

    // Initiative name
    html += '<div class="draft-field"><div class="draft-field-label">Name</div>' +
        '<input type="text" id="initiative-name-input" class="draft-field-input" ' +
        'placeholder="e.g. ' + escapeHtml((currentNation?.name || '') + '-' + (activeDraftTarget?.name || '') + ' Friendship Accord') + '" ' +
        'value="' + escapeHtml(wizardName) + '" oninput="setWizardName(this.value)" ' +
        'style="border:1px solid var(--border-subtle);background:var(--bg-3);color:var(--text-primary);padding:6px 10px;font-family:var(--font-sans);font-size:12px;width:100%;"></div>';
    html += '</div>';

    // ── Articles section ──
    html += '<div class="draft-articles" style="flex:1;overflow-y:auto;padding:10px 14px;">';
    if (wizardArticles.length === 0) {
        html += '<div class="empty-state" style="padding:20px 0;"><div class="empty-state-text">No articles added yet.<br>Use the selector below to add articles.</div></div>';
    } else {
        wizardArticles.forEach((art, i) => {
            html += renderInitiativeArticleCard(art, i, true);
        });
    }
    html += '</div>';

    // ── Article selector ──
    html += '<div class="article-selector">';
    html += '<select class="selector-dropdown" id="initiative-article-selector">';
    html += '<option value="">Add article...</option>';
    for (const [key, typeInfo] of Object.entries(INITIATIVE_ARTICLE_TYPES)) {
        // Check if max per initiative reached
        if (typeInfo.max_per_initiative) {
            const count = wizardArticles.filter(a => a.type === key).length;
            if (count >= typeInfo.max_per_initiative) continue;
        }
        html += '<option value="' + key + '">' + escapeHtml(typeInfo.label) + '</option>';
    }
    html += '</select>';
    html += '<button class="btn btn--primary btn--sm" onclick="addMinorInitiativeArticle()">Add</button>';
    html += '</div>';

    // ── Action bar ──
    const totalEffects = computeInitiativeTotals(wizardArticles);
    const articleCount = wizardArticles.length;
    const apCost = MINOR_INITIATIVE_CONFIG.AP_COST;
    const hasEnoughAP = (currentFaction?.action_points ?? 0) >= apCost;
    const canSend = articleCount > 0 && activeDraftTarget && wizardName.trim() && hasEnoughAP;

    html += '<div class="action-bar">';
    html += '<span class="action-bar-info">' + articleCount + ' article' + (articleCount !== 1 ? 's' : '') + ' / Minor / Tier 1</span>';
    html += '<div class="action-bar-spacer"></div>';
    html += '<button class="btn btn--dim" onclick="cancelDraft()">Cancel</button>';
    html += '<button class="btn btn--send' + (canSend ? '' : '" disabled') + '" onclick="submitMinorInitiative()"' +
        (!canSend ? ' title="' + (!activeDraftTarget ? 'Select a target nation' : articleCount === 0 ? 'Add at least one article' : !wizardName.trim() ? 'Enter an initiative name' : 'Not enough AP (' + apCost + ' required)') + '"' : '') +
        '>Send Initiative (' + apCost + ' AP)</button>';
    html += '</div>';

    html += '</div>';
    body.innerHTML = html;
}

/**
 * Select target nation for minor initiative (multi-posting case).
 */
function selectMinorInitiativeTarget(nationId) {
    if (!nationId) { activeDraftTarget = null; renderDraftBox(); return; }
    const posting = (diplomaticRoles.ambassadorTo || []).find(a => a.target_nation_id === nationId);
    if (posting) {
        activeDraftTarget = { id: posting.target_nation_id, name: posting.target_nation_name };
    }
    renderDraftBox();
}
window.selectMinorInitiativeTarget = selectMinorInitiativeTarget;

/**
 * Add a new article to the minor initiative draft.
 */
function addMinorInitiativeArticle() {
    const sel = document.getElementById('initiative-article-selector');
    if (!sel || !sel.value) return;
    const typeKey = sel.value;
    const typeInfo = INITIATIVE_ARTICLE_TYPES[typeKey];
    if (!typeInfo) return;

    // Enforce max per initiative
    if (typeInfo.max_per_initiative) {
        const count = wizardArticles.filter(a => a.type === typeKey).length;
        if (count >= typeInfo.max_per_initiative) {
            alert('Only one ' + typeInfo.label + ' per initiative.');
            return;
        }
    }

    // Create article with default config
    const article = {
        id: crypto.randomUUID ? crypto.randomUUID() : 'art-' + Date.now() + '-' + Math.random().toString(36).slice(2,8),
        type: typeKey,
        label: typeInfo.label,
        config: JSON.parse(JSON.stringify(typeInfo.default_config)),
        status: 'active'
    };

    wizardArticles.push(article);
    renderDraftBox();
}
window.addMinorInitiativeArticle = addMinorInitiativeArticle;

/**

 */
function updateArticleConfig(index, field, value) {

    wizardArticles[index].config[field] = value;
    renderDraftBox();
}

/**
 * Toggle a value in an array config field (for checkboxes/multi-select).
 */
function toggleArticleConfigArray(index, field, value) {
    if (!wizardArticles[index]) return;
    const arr = wizardArticles[index].config[field] || [];
    const idx = arr.indexOf(value);
    if (idx >= 0) arr.splice(idx, 1);
    else arr.push(value);
    wizardArticles[index].config[field] = arr;
    renderDraftBox();
}
window.toggleArticleConfigArray = toggleArticleConfigArray;

/**
 * Render a single initiative article card with config controls and effect tags.
 * @param {Object} art - article object with type, config, id
 * @param {number} index - index in wizardArticles
 * @param {boolean} editable - whether config controls are shown
 */
function renderInitiativeArticleCard(art, index, editable) {
    const typeInfo = INITIATIVE_ARTICLE_TYPES[art.type] || MAJOR_INITIATIVE_ARTICLE_TYPES[art.type];
    if (!typeInfo) return '';

    const struckClass = art.status === 'struck' ? ' initiative-article--struck' : '';
    let html = '<div class="initiative-article' + struckClass + '">';

    // Header: article number + type + remove button
    html += '<div class="initiative-article-head">';
    html += '<div><span class="initiative-article-num">Art. ' + toRoman(index + 1) + '</span> ';
    html += '<span class="initiative-article-type">' + escapeHtml(typeInfo.label).toUpperCase();
    if (art.type === 'joint_statement') {
        html += ' <span class="badge badge--dim" style="font-size:7px;">No Mechanical Effect</span>';
    }
    html += '</span></div>';
    if (editable) {
        html += '<button class="initiative-article-remove" onclick="removeMajorInitiativeArticle(' + index + ')">REMOVE</button>';
    }
    html += '</div>';

    // Config controls
    if (editable && art.status !== 'struck') {
        html += '<div class="config-grid">';
        html += renderArticleConfigControls(art, index);
        html += '</div>';
    }

    // Effect tags
    const effects = computeArticleEffects(art);
    html += renderEffectTags(effects, art.type);

    // Article note for joint statement
    if (art.type === 'joint_statement') {
        html += '<div class="article-note">Joint Statements have no mechanical effect. They exist for roleplay and diplomatic signalling.</div>';
    }

    html += '</div>';
    return html;
}

/**
 * Render config controls for an article type.

function renderArticleConfigControls(art, index) {
    switch (art.type) {
        case 'visa_agreement': return renderVisaConfig(art, index);
        case 'cultural_exchange': return renderCulturalConfig(art, index);
        case 'student_exchange': return renderStudentConfig(art, index);
        case 'joint_statement': return renderStatementConfig(art, index);
        case 'open_borders': return renderOpenBordersConfig(art, index);
        case 'mutual_extradition': return renderExtraditionConfig(art, index);
        case 'environmental_accord': return renderEnvironmentalConfig(art, index);
        default: return '';
    }
}

/**
 * Render a toggle group (single-select radio-like buttons).
 */
function renderToggleGroup(options, selectedValue, index, field) {
    let html = '<div class="toggle-group">';
    options.forEach(opt => {
        const sel = (opt.key === selectedValue || opt.key === Number(selectedValue)) ? ' is-selected' : '';
        html += '<button class="toggle-opt' + sel + '" onclick="updateArticleConfig(' + index + ',\'' + field + '\',' +
            (typeof opt.key === 'string' ? '\'' + opt.key + '\'' : opt.key) + ')">' + escapeHtml(opt.label) + '</button>';
    });
    html += '</div>';
    return html;
}

/**
 * Render a check group (multi-select toggle buttons).
 */
function renderCheckGroup(options, selectedArray, index, field) {
    let html = '<div class="check-group">';
    options.forEach(opt => {
        const sel = (selectedArray || []).includes(opt.key) ? ' is-selected' : '';
        html += '<button class="check-opt' + sel + '" onclick="toggleArticleConfigArray(' + index + ',\'' + field + '\',\'' + opt.key + '\')">' + escapeHtml(opt.label) + '</button>';
    });
    html += '</div>';
    return html;
}

    html += '<div class="config-row"><span class="config-label">Compliance Review</span>' +
        renderToggleGroup(ENVIRONMENT_REVIEW_INTERVAL_OPTIONS, c.review_interval, index, 'review_interval') + '</div>';
    html += '<div class="config-row"><span class="config-label">Non-Compliance Penalty</span>' +
        renderToggleGroup(ENVIRONMENT_PENALTY_OPTIONS, c.penalty, index, 'penalty') + '</div>';
    return html;
}

/**
 * Compute effects for a single article based on its type and config.
 */
function computeArticleEffects(art) {
    const typeInfo = INITIATIVE_ARTICLE_TYPES[art.type] || MAJOR_INITIATIVE_ARTICLE_TYPES[art.type];
    if (!typeInfo || !typeInfo.calculateEffects) return {};
    try {
        return typeInfo.calculateEffects(art.config);
    } catch (e) {
        console.warn('Error computing effects for article:', art.type, e);
        return {};
    }
}

/**
 * Render effect tags for an article.
 */
function renderEffectTags(effects, articleType) {
    let html = '<div class="article-effects">';

    if (articleType === 'joint_statement') {
        html += '<span class="effect-tag effect-tag--neutral">No stat effects</span>';
        html += '</div>';
        return html;
    }

    // For visa, use .summary if available
    const e = effects.summary || effects;
    const tags = [];

    if (e.relations) tags.push({ label: (e.relations > 0 ? '+' : '') + e.relations + ' Relations', cls: 'effect-tag--positive' });
    if (e.revenue > 0) tags.push({ label: '+$' + (e.revenue / 1e6).toFixed(0) + 'M Revenue', cls: 'effect-tag--money-pos' });
    if (e.cost_proposer > 0 || e.cost_target > 0) {
        const total = (e.cost_proposer || 0) + (e.cost_target || 0);
        tags.push({ label: '-$' + (total / 1e6).toFixed(1) + 'M Cost', cls: 'effect-tag--money-neg' });
    }
    if (e.intl_reputation || e.international_reputation) {
        const val = e.intl_reputation || e.international_reputation;
        tags.push({ label: (val > 0 ? '+' : '') + val + ' Int\'l Rep', cls: val > 0 ? 'effect-tag--positive' : 'effect-tag--warning' });
    }
    if (e.immigration) tags.push({ label: '+' + e.immigration + ' Immigration', cls: 'effect-tag--positive' });
    if (e.higher_education) tags.push({ label: '+' + e.higher_education + ' Higher Ed', cls: 'effect-tag--positive' });
    if (e.soft_power) tags.push({ label: '+' + e.soft_power + ' Soft Power', cls: 'effect-tag--info' });
    if (e.soft_power_per_year) tags.push({ label: '+' + e.soft_power_per_year + ' Soft Power/yr', cls: 'effect-tag--info' });
    if (e.permanent_soft_power) tags.push({ label: '+' + e.permanent_soft_power + ' Permanent Soft Power', cls: 'effect-tag--info' });
    if (e.technology_bonus) tags.push({ label: '+' + e.technology_bonus + ' Technology', cls: 'effect-tag--info' });
    if (e.polarization) tags.push({ label: '+' + e.polarization + ' Polarization', cls: 'effect-tag--warning' });
    if (e.terrorism_risk) tags.push({ label: '+' + e.terrorism_risk + ' Terrorism Risk', cls: 'effect-tag--warning' });
    if (e.terrorism && !e.terrorism_risk) tags.push({ label: (e.terrorism > 0 ? '+' : '') + e.terrorism + ' Terrorism', cls: e.terrorism > 0 ? 'effect-tag--warning' : 'effect-tag--positive' });
    if (e.ongoing_per_tick) tags.push({ label: '-$' + (e.ongoing_per_tick / 1e6).toFixed(0) + 'M/tick Ongoing', cls: 'effect-tag--money-neg' });
    // Major initiative stat tags
    if (e.gdp_growth) tags.push({ label: (e.gdp_growth > 0 ? '+' : '') + e.gdp_growth + ' GDP Growth', cls: e.gdp_growth > 0 ? 'effect-tag--positive' : 'effect-tag--warning' });
    if (e.labor_force_participation) tags.push({ label: '+' + e.labor_force_participation + ' Labor Force', cls: 'effect-tag--positive' });
    if (e.civil_unrest) tags.push({ label: '+' + e.civil_unrest + ' Civil Unrest', cls: 'effect-tag--warning' });
    if (e.housing_affordability) tags.push({ label: e.housing_affordability + ' Housing', cls: e.housing_affordability > 0 ? 'effect-tag--positive' : 'effect-tag--warning' });
    if (e.cost_of_living) tags.push({ label: '+' + e.cost_of_living + ' Cost of Living', cls: 'effect-tag--warning' });
    if (e.crime_rate) tags.push({ label: e.crime_rate + ' Crime Rate', cls: e.crime_rate < 0 ? 'effect-tag--positive' : 'effect-tag--warning' });
    if (e.corruption) tags.push({ label: e.corruption + ' Corruption', cls: e.corruption < 0 ? 'effect-tag--positive' : 'effect-tag--warning' });
    if (e.judicial_independence) tags.push({ label: (e.judicial_independence > 0 ? '+' : '') + e.judicial_independence + ' Judicial Ind.', cls: e.judicial_independence > 0 ? 'effect-tag--positive' : 'effect-tag--warning' });
    if (e.freedom_index) tags.push({ label: e.freedom_index + ' Freedom Index', cls: e.freedom_index > 0 ? 'effect-tag--positive' : 'effect-tag--warning' });
    if (e.press_freedom) tags.push({ label: e.press_freedom + ' Press Freedom', cls: e.press_freedom > 0 ? 'effect-tag--positive' : 'effect-tag--warning' });
    if (e.pollution) tags.push({ label: e.pollution + ' Pollution', cls: e.pollution < 0 ? 'effect-tag--positive' : 'effect-tag--warning' });
    if (e.manufacturing_output) tags.push({ label: e.manufacturing_output + ' Manufacturing', cls: e.manufacturing_output > 0 ? 'effect-tag--positive' : 'effect-tag--warning' });

    if (tags.length === 0) {
        tags.push({ label: 'No stat effects', cls: 'effect-tag--neutral' });
    }

    tags.forEach(t => { html += '<span class="effect-tag ' + t.cls + '">' + t.label + '</span>'; });
    html += '</div>';
    return html;
}

/**
 * Render a read-only config summary for an article in the negotiations view.
 * Shows the key config choices as a compact text summary.
 */
function renderArticleConfigSummary(art) {
    const c = art.config;
    if (!c) return '';
    let lines = [];

    switch (art.type) {
        case 'visa_agreement': {
            const dur = VISA_DURATION_OPTIONS.find(d => d.key === c.duration);
            const scope = VISA_SCOPE_OPTIONS.find(s => s.key === c.scope);
            const dir = VISA_DIRECTION_OPTIONS.find(d => d.key === c.direction);
            if (dur) lines.push(dur.label);
            if (scope) lines.push(scope.label);
            if (dir) lines.push(dir.label);
            const excludes = (c.excludes || []).map(k => {
                const ex = VISA_EXCLUDES.find(e => e.key === k);
                return ex ? ex.label : k;
            });
            if (excludes.length) lines.push('Excludes: ' + excludes.join(', '));
            break;
        }
        case 'cultural_exchange': {
            const dur = CULTURAL_DURATION_OPTIONS.find(d => d.key === c.duration);
            const fund = CULTURAL_FUNDING_OPTIONS.find(f => f.key === c.funding);
            if (dur) lines.push(dur.label);
            if (fund) lines.push('Funding: ' + fund.label);
            const progs = (c.programmes || []).map(k => {
                const p = CULTURAL_PROGRAMMES.find(p => p.key === k);
                return p ? p.label : k;
            });
            if (progs.length) lines.push('Programmes: ' + progs.join(', '));
            break;
        }
        case 'student_exchange': {
            const lvl = STUDENT_LEVEL_OPTIONS.find(l => l.key === c.level);
            const dur = STUDENT_DURATION_OPTIONS.find(d => d.key === c.duration);
            const fund = STUDENT_FUNDING_OPTIONS.find(f => f.key === c.funding);
            if (lvl) lines.push(lvl.label);
            if (dur) lines.push(dur.label);
            if (c.seats) lines.push(c.seats + ' seats');
            if (fund) lines.push('Funding: ' + fund.label);
            const fields = (c.fields || []).map(k => {
                const f = STUDENT_FIELDS.find(sf => sf.key === k);
                return f ? f.label : k;
            });
            if (fields.length) lines.push('Fields: ' + fields.join(', '));
            break;
        }
        case 'joint_statement': {
            const vis = STATEMENT_VISIBILITY_OPTIONS.find(v => v.key === c.visibility);
            if (vis) lines.push(vis.label);
            if (c.text) lines.push('"' + (c.text.length > 120 ? c.text.substring(0, 120) + '…' : c.text) + '"');
            break;
        }
        case 'open_borders': {
            const scope = OPEN_BORDERS_SCOPE_OPTIONS.find(s => s.key === c.scope);
            const dir = OPEN_BORDERS_DIRECTION_OPTIONS.find(d => d.key === c.direction);
            const prot = OPEN_BORDERS_WORKER_PROTECTIONS.find(p => p.key === c.worker_protections);
            const trans = OPEN_BORDERS_TRANSITION_OPTIONS.find(t => t.key === c.transition);
            if (scope) lines.push(scope.label);
            if (dir) lines.push(dir.label);
            if (prot) lines.push(prot.label);
            if (trans) lines.push(trans.label);
            break;
        }
        case 'mutual_extradition': {
            const scopes = (c.scope || []).map(k => {
                const opt = EXTRADITION_SCOPE_OPTIONS.find(o => o.key === k);
                return opt ? opt.label : k;
            });
            if (scopes.length) lines.push('Scope: ' + scopes.join(', '));
            const dc = EXTRADITION_DUAL_CRIMINALITY_OPTIONS.find(d => d.key === c.dual_criminality);
            if (dc) lines.push(dc.label);
            const ap = EXTRADITION_APPEAL_OPTIONS.find(a => a.key === c.appeal_process);
            if (ap) lines.push(ap.label);
            const excs = (c.exceptions || []).map(k => {
                const opt = EXTRADITION_EXCEPTION_OPTIONS.find(o => o.key === k);
                return opt ? opt.label : k;
            });
            if (excs.length) lines.push('Exceptions: ' + excs.join(', '));
            break;
        }
        case 'environmental_accord': {
            const em = ENVIRONMENT_EMISSION_TARGET_OPTIONS.find(e => e.key === c.emission_target);
            const ren = ENVIRONMENT_RENEWABLE_TARGET_OPTIONS.find(r => r.key === c.renewable_target);
            const pol = ENVIRONMENT_POLLUTION_STANDARDS.find(p => p.key === c.pollution_standards);
            if (em) lines.push(em.label);
            if (ren && ren.key > 0) lines.push(ren.label + ' Renewable');
            if (pol) lines.push(pol.label);
            const cons = (c.conservation || []).map(k => {
                const opt = ENVIRONMENT_CONSERVATION_OPTIONS.find(o => o.key === k);
                return opt ? opt.label : k;
            });
            if (cons.length) lines.push('Conservation: ' + cons.join(', '));
            const rev = ENVIRONMENT_REVIEW_INTERVAL_OPTIONS.find(r => r.key === c.review_interval);
            if (rev) lines.push(rev.label);
            const pen = ENVIRONMENT_PENALTY_OPTIONS.find(p => p.key === c.penalty);
            if (pen) lines.push('Penalty: ' + pen.label);
            break;
        }
    }

    if (lines.length === 0) return '';
    return '<div style="font-family:var(--font-mono);font-size:9px;color:var(--text-2);line-height:1.5;">' +
        lines.map(l => escapeHtml(l)).join(' · ') + '</div>';
}

/**
 * Render effect tags from a stored effects object (used in negotiations view).
 * Unlike renderEffectTags() which computes effects fresh, this reads from the stored proposal_data.
 */
function renderEffectTagsFromEffects(effects, articleType) {
    if (!effects) return '';
    // Reuse the same rendering logic — the stored effects have the same shape
    return renderEffectTags(effects, articleType);
}

/**
 * Compute combined totals across all articles in the initiative.
 */
function computeInitiativeTotals(articles) {
    const totals = { relations: 0, revenue: 0, cost_proposer: 0, cost_target: 0, intl_reputation: 0 };
    for (const art of articles) {
        if (art.status === 'struck') continue;
        const effects = computeArticleEffects(art);
        const e = effects.summary || effects;
        totals.relations += e.relations || 0;
        totals.revenue += e.revenue || 0;
        totals.cost_proposer += e.cost_proposer || 0;
        totals.cost_target += e.cost_target || 0;
        totals.intl_reputation += e.intl_reputation || 0;
    }
    return totals;
}

async function renderRecallAmbassadorPanel(body, statusEl) {
    if (statusEl) statusEl.textContent = 'Recall Ambassador';

    // Fetch active ambassadors (cached to avoid re-fetching on reason selection)

            .select('*, factions(abbreviation)')

    html += '</select></div>';
    html += '</div>';

        const termRemaining = Math.max(0, termLen - (shardTick - (amb.appointed_at_tick || 0)));
        const targetNationName = amb.nations?.name || 'Unknown';

        // Relation data
        const relScore = recallTargetRelation ? recallTargetRelation.relation_score : 30;
        const projectedScore = recallSelectedReason
            ? Math.max(-100, Math.min(100, relScore - RECALL_REASONS[recallSelectedReason].relationPenalty))
            : relScore;

        html += '<div style="font-family:var(--font-mono);font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);margin-bottom:8px;">Ambassador Details</div>';

        html += '<li>Active diplomatic initiatives cancelled</li>';
        if (reason.hostApprovalPenalty > 0) html += '<li>Host nation loses ' + reason.hostApprovalPenalty + ' Government Approval</li>';
        if (reason.cascadeEffect) html += '<li style="color:var(--red);font-weight:500;">Target\'s allies (relations ≥ 70) lose ' + Math.abs(reason.cascadeAmount) + ' relations with your nation</li>';
        html += '</ul>';
        html += '<div style="font-size:10px;color:var(--text-dim);margin-top:6px;font-style:italic;">This action is irreversible.</div>';
        html += '</div>';
    }

    // Action bar
    const canConfirm = recallTargetAmbassador && recallSelectedReason;
    html += '<div class="detail-actions" style="margin-top:auto;padding-top:10px;border-top:1px solid var(--border-hair);">';

    html += '</div>';

function getRelationColor(score) {
    if (score >= 70) return 'var(--green)';
    if (score >= 40) return 'var(--teal)';
    if (score >= 10) return 'var(--amber)';
    return 'var(--red)';
}

async function selectRecallTarget(ambassadorId) {
    if (!ambassadorId) {
        recallTargetAmbassador = null;
        recallTargetRelation = null;
        recallSelectedReason = null;
        renderDraftBox();
        return;
    }
    // Fetch ambassador details
    const { data: amb } = await _supabase
        .from('ambassadors')
        .select('*, factions(abbreviation)')
        .eq('id', ambassadorId)
        .single();
    if (!amb) { recallTargetAmbassador = null; renderDraftBox(); return; }
    // Attach target nation name
    if (amb.target_nation_id) {
        const { data: nation } = await _supabase.from('nations').select('id, name').eq('id', amb.target_nation_id).single();
        amb.nations = nation || null;
    }
    recallTargetAmbassador = amb;

    // Fetch relation
    const targetId = amb.target_nation_id;
    const natA = currentNation.id < targetId ? currentNation.id : targetId;
    const natB = currentNation.id < targetId ? targetId : currentNation.id;
    const { data: rel } = await _supabase
        .from('diplomatic_relations')
        .select('*')
        .eq('nation_a_id', natA)
        .eq('nation_b_id', natB)
        .maybeSingle();
    recallTargetRelation = rel;
    renderDraftBox();
}

function selectRecallReason(key) {
    recallSelectedReason = recallSelectedReason === key ? null : key;
    renderDraftBox();
}

async function executeRecallAmbassador() {
    // 1. Auth check
    await refreshRoles();
    if (!diplomaticRoles.isFM && !diplomaticRoles.isHoG) {
        alert('Only the Foreign Minister or Head of Government can recall ambassadors.');
        return;
    }

    // 2. Guard
    if (!recallTargetAmbassador || !recallSelectedReason) {
        alert('Please select a target and reason for recall.');
        return;
    }

    // Disable confirm button to prevent double-clicks
    const confirmBtns = document.querySelectorAll('.detail-btn');
    confirmBtns.forEach(btn => { if (btn.textContent.includes('Recall Ambassador')) { btn.disabled = true; btn.style.opacity = '0.5'; } });

    const reason = RECALL_REASONS[recallSelectedReason];
    const amb = recallTargetAmbassador;
    const targetNationId = amb.target_nation_id;
    const targetNationName = amb.nations?.name || 'Unknown';
    const ambName = ((amb.ambassador_first_name || '') + ' ' + (amb.ambassador_last_name || '')).trim();

    try {
        // 3. Get current tick
        const { data: shard } = await _supabase
            .from('shard')
            .select('current_tick')
            .eq('name', 'Alpha Shard')
            .single();
        const currentTick = shard?.current_tick || 0;

        // 4. Deduct AP
        const apResult = await deductAP(_supabase, currentFaction.id, DIPLOMACY_CONFIG.RECALL_AMBASSADOR_AP);
        if (!apResult.success) {
            if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
            alert('Not enough AP (' + DIPLOMACY_CONFIG.RECALL_AMBASSADOR_AP + ' needed). Current AP: ' + (apResult.currentAp ?? '?'));
            return;
        }
        currentFaction.action_points = apResult.newAp;

        // 5. Update ambassador: recalled
        await _supabase
            .from('ambassadors')
            .update({ status: 'recalled', is_active: false, recalled_at_tick: currentTick })
            .eq('id', amb.id);

        // 6. Update embassy status + relation score
        const natA = currentNation.id < targetNationId ? currentNation.id : targetNationId;
        const natB = currentNation.id < targetNationId ? targetNationId : currentNation.id;
        const isNationA = currentNation.id < targetNationId;
        const embassyField = isNationA ? 'embassy_status_a' : 'embassy_status_b';

        const { data: relRow } = await _supabase
            .from('diplomatic_relations')
            .select('*')
            .eq('nation_a_id', natA)
            .eq('nation_b_id', natB)
            .maybeSingle();

        let oldScore = relRow ? relRow.relation_score : 30;
        let newScore = Math.max(-100, Math.min(100, oldScore - reason.relationPenalty));

        if (relRow) {
            const updateObj = { relation_score: newScore };
            updateObj[embassyField] = 'recalled';
            await _supabase.from('diplomatic_relations')
                .update(updateObj)
                .eq('nation_a_id', natA)
                .eq('nation_b_id', natB);
        } else {
            const insertObj = {
                nation_a_id: natA,
                nation_b_id: natB,
                relation_score: Math.max(-100, 30 - reason.relationPenalty)
            };
            insertObj[embassyField] = 'recalled';
            await _supabase.from('diplomatic_relations').insert(insertObj);
            newScore = insertObj.relation_score;
        }

        // 7. Security Concern: reduce target nation's gov_approval
        let approvalPenaltyApplied = false;
        if (reason.hostApprovalPenalty > 0) {
            const { data: targetNation } = await _supabase
                .from('nations')
                .select('gov_approval')
                .eq('id', targetNationId)
                .single();
            if (targetNation) {
                const newApproval = Math.max(0, Math.min(100, Math.round(Number(targetNation.gov_approval ?? 40) - reason.hostApprovalPenalty)));
                await _supabase.from('nations')
                    .update({ gov_approval: newApproval })
                    .eq('id', targetNationId);
                approvalPenaltyApplied = true;
            }
        }

        // 8. Pre-War Posture cascade: reduce relations with target's allies
        let cascadeCount = 0;
        if (reason.cascadeEffect) {
            // Find target's allies (relation_score >= 70)
            const { data: alliedRels } = await _supabase
                .from('diplomatic_relations')
                .select('nation_a_id, nation_b_id, relation_score')
                .or('nation_a_id.eq.' + targetNationId + ',nation_b_id.eq.' + targetNationId)
                .gte('relation_score', 70);

            if (alliedRels && alliedRels.length > 0) {
                for (const ar of alliedRels) {
                    const allyId = ar.nation_a_id === targetNationId ? ar.nation_b_id : ar.nation_a_id;
                    if (allyId === currentNation.id) continue; // skip self

                    // Update relation between recalling nation and this ally
                    const cA = currentNation.id < allyId ? currentNation.id : allyId;
                    const cB = currentNation.id < allyId ? allyId : currentNation.id;
                    const { data: allyRel } = await _supabase
                        .from('diplomatic_relations')
                        .select('relation_score')
                        .eq('nation_a_id', cA)
                        .eq('nation_b_id', cB)
                        .maybeSingle();

                    if (allyRel) {
                        const allyNewScore = Math.max(-100, Math.min(100, allyRel.relation_score + reason.cascadeAmount));
                        await _supabase.from('diplomatic_relations')
                            .update({ relation_score: allyNewScore })
                            .eq('nation_a_id', cA)
                            .eq('nation_b_id', cB);
                    } else {
                        await _supabase.from('diplomatic_relations').insert({
                            nation_a_id: cA,
                            nation_b_id: cB,
                            relation_score: Math.max(-100, 30 + reason.cascadeAmount)
                        });
                    }
                    cascadeCount++;
                }
            }
        }

        // 9. Cancel active diplomatic initiatives (cultural exchanges, etc.) between these nations
        // Ambassador recall invalidates all active diplomatic initiatives since they require ambassadors
        await _supabase
            .from('diplomatic_proposals')
            .update({ status: 'expired' })
            .eq('status', 'active')
            .eq('proposal_type', 'diplomatic_initiative')
            .or(
                'and(proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + targetNationId + '),' +
                'and(proposing_nation_id.eq.' + targetNationId + ',target_nation_id.eq.' + currentNation.id + ')'
            );

        // 10. Momentum penalty: 1d3 loss
        const momentumLoss = Math.floor(Math.random() * 3) + 1;
        await adjustMomentumAll(_supabase, currentNation.id, amb.faction_id, -momentumLoss, 'diplomacy:ambassador_recalled');

        // 11. Log to diplomatic_action_log
        await _supabase.from('diplomatic_action_log').insert({
            nation_id: currentNation.id,
            target_nation_id: targetNationId,
            faction_id: currentFaction.id,
            action_type: 'recall_ambassador',
            action_data: {
                ambassador_name: ambName,
                ambassador_id: amb.id,
                reason: reason.key,
                reason_label: reason.label,
                relation_penalty: reason.relationPenalty,
                old_score: oldScore,
                new_score: newScore,
                momentum_loss: momentumLoss,
                cascade_count: cascadeCount,
                host_approval_penalty: reason.hostApprovalPenalty
            },
            ap_cost: DIPLOMACY_CONFIG.RECALL_AMBASSADOR_AP,
            applied_at_tick: currentTick,
            processed: true
        });

        // 12. Fire event_log entries for all nations
        try {
            const { data: allNations } = await _supabase.from('nations').select('id');
            if (allNations && allNations.length > 0) {
                const tier = reason.key === 'pre_war_posture' ? 1 : (reason.pressEvent ? 2 : 3);
                const eventRows = allNations.map(n => ({
                    nation_id: n.id,
                    event_name: 'Ambassador Recalled',
                    event_type: 'ambassador_recalled',
                    category: 'Diplomatic',
                    description_chosen: currentNation.name + ' has recalled its ambassador from ' + targetNationName +
                        ' citing ' + reason.label.toLowerCase() + '. ' + reason.signal,
                    fired_at_tick: currentTick,
                    effects: {
                        nation_a: currentNation.name,
                        nation_b: targetNationName,
                        reason: reason.key,
                        reason_label: reason.label,
                        ambassador_name: ambName,
                        relation_change: -reason.relationPenalty,
                        tier: tier
                    }
                }));
                await _supabase.from('event_log').insert(eventRows);
            }
        } catch (e) {
            console.warn('Error firing recall event:', e);
        }

        // 13. Alert result + refresh UI
        let resultMsg = 'Ambassador Recalled\n\n' +
            ambName + ' recalled from ' + targetNationName + '\n' +
            'Reason: ' + reason.label + '\n\n' +
            'Effects:\n' +
            '  Relations: ' + oldScore + ' → ' + newScore + ' (-' + reason.relationPenalty + ')\n' +
            '  Momentum: -' + momentumLoss + ' to ' + (amb.factions?.abbreviation || 'party') + '\n';
        if (approvalPenaltyApplied) resultMsg += '  Host Approval: -' + reason.hostApprovalPenalty + '\n';
        if (cascadeCount > 0) resultMsg += '  Cascade: ' + cascadeCount + ' allied nation(s) affected (' + reason.cascadeAmount + ' relations)\n';
        resultMsg += '\nCost: ' + DIPLOMACY_CONFIG.RECALL_AMBASSADOR_AP + ' AP';

        alert(resultMsg);

        // Reset state
        recallSelectedReason = null;
        recallTargetAmbassador = null;
        recallTargetRelation = null;
        recallCachedAmbassadors = null;
        activeDraftAction = null;
        activeDraftTarget = null;
        document.querySelectorAll('.action-item.is-active').forEach(el => el.classList.remove('is-active'));

        // Refresh UI
        diplomaticRoles = await detectDiplomaticRoles(currentFaction, currentNation, currentCoalition);
        const apEl = document.getElementById('diplo-ap');
        if (apEl) apEl.textContent = (currentFaction?.action_points ?? 0) + ' AP';
        await Promise.all([renderRelationsTab(), renderDraftBox()]);

    } catch (e) {
        console.error('Error recalling ambassador:', e);
        alert('Error: ' + e.message);
    }
}

async function selectAppointTarget(nationId) {
    if (!nationId) {
        appointTargetNation = null;
        appointTargetRelation = null;
        appointCandidates = [];
        appointSelectedIndex = null;
        renderDraftBox();
        return;
    }

    // Fetch nation
    const nation = cachedOtherNations.find(n => n.id === nationId);
    if (!nation) {
        const { data } = await _supabase.from('nations').select('*').eq('id', nationId).single();
        appointTargetNation = data;
    } else {
        appointTargetNation = nation;
    }

    // Fetch relation
    const natA = currentNation.id < nationId ? currentNation.id : nationId;
    const natB = currentNation.id < nationId ? nationId : currentNation.id;
    const { data: rel } = await _supabase
        .from('diplomatic_relations')
        .select('*')
        .eq('nation_a_id', natA)
        .eq('nation_b_id', natB)
        .maybeSingle();
    appointTargetRelation = rel;

    // Generate candidates from all parties in current nation
    const { data: parties } = await _supabase
        .from('factions')
        .select('id, faction_name, abbreviation, color')
        .eq('nation_id', currentNation.id);

    appointCandidates = (parties || []).map(p => ({
        partyId: p.id,
        partyName: p.faction_name,
        partyAbbr: p.abbreviation || p.faction_name.substring(0, 3).toUpperCase(),
        partyColor: p.color || '#888',
        firstName: AMB_FIRST_NAMES[Math.floor(Math.random() * AMB_FIRST_NAMES.length)],
        lastName: AMB_LAST_NAMES[Math.floor(Math.random() * AMB_LAST_NAMES.length)],
        age: 35 + Math.floor(Math.random() * 31)
    }));
    appointSelectedIndex = null;
    renderDraftBox();
}

function selectAppointCandidate(index) {
    appointSelectedIndex = appointSelectedIndex === index ? null : index;
    renderDraftBox();
}

async function executeAppointAmbassador() {
    // 1. Auth check
    await refreshRoles();
    if (!diplomaticRoles.isFM) {
        alert('Only the Foreign Minister can appoint ambassadors.');
        return;
    }

    // 2. Guard
    if (!appointTargetNation || appointSelectedIndex === null) {
        alert('Please select a target nation and candidate.');
        return;
    }

    const candidate = appointCandidates[appointSelectedIndex];
    if (!candidate) { alert('Invalid candidate selection.'); return; }

    // 3. Double-click protection
    const confirmBtns = document.querySelectorAll('.detail-btn');
    confirmBtns.forEach(btn => { if (btn.textContent.includes('Nominate')) { btn.disabled = true; btn.style.opacity = '0.5'; } });

    try {
        // 4. Check for existing ambassador (race condition prevention)
        const { data: existing } = await _supabase
            .from('ambassadors')
            .select('id')
            .eq('nation_id', currentNation.id)
            .eq('target_nation_id', appointTargetNation.id)
            .eq('is_active', true)
            .maybeSingle();
        if (existing) {
            alert('An ambassador is already active or pending for ' + appointTargetNation.name + '.');
            return;
        }

        // Check caretaker
        const coalition = await fetchActiveCoalition(_supabase, currentNation.id);
        const isAutocracy = isGovernmentAutocracy(currentNation);
        if (!isAutocracy && coalition?.status === 'caretaker') {
            alert('Appointments are suspended during caretaker government.');
            return;
        }

        // 5. Deduct AP
        const apResult = await deductAP(_supabase, currentFaction.id, APPOINT_AMBASSADOR_AP);
        if (!apResult.success) {
            if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
            alert('Not enough AP (' + APPOINT_AMBASSADOR_AP + ' needed). Current AP: ' + (apResult.currentAp ?? '?'));
            return;
        }
        currentFaction.action_points = apResult.newAp;

        // 6. Get current tick
        const { data: shard } = await _supabase
            .from('shard')
            .select('current_tick')
            .eq('name', 'Alpha Shard')
            .single();
        const currentTick = shard?.current_tick || 0;

        // 7. Autocracy vs Democracy
        let confirmationBillId = null;
        if (isAutocracy) {
            const { error: ambError } = await _supabase
                .from('ambassadors')
                .insert({
                    nation_id: currentNation.id,
                    target_nation_id: appointTargetNation.id,
                    faction_id: candidate.partyId,
                    ambassador_first_name: candidate.firstName,
                    ambassador_last_name: candidate.lastName,
                    ambassador_age: candidate.age,
                    status: 'active',
                    is_active: true,
                    appointed_at_tick: currentTick
                });
            if (ambError) throw ambError;
        } else {
            const billName = 'Confirmation of ' + candidate.firstName + ' ' + candidate.lastName + ' as Ambassador to ' + appointTargetNation.name;
            const preamble = 'This motion, filed by the ' + currentFaction.faction_name + ', confirms the appointment of ' + candidate.firstName + ' ' + candidate.lastName + ' (' + candidate.partyName + ') as Ambassador to ' + appointTargetNation.name + '. A simple majority (51%) is required for confirmation.';

            const { data: nominationResult, error: nominationError } = await _supabase.rpc('create_ambassador_nomination_with_bill', {
                p_nation_id: currentNation.id,
                p_target_nation_id: appointTargetNation.id,
                p_faction_id: candidate.partyId,
                p_proposed_by: currentFaction.id,
                p_first_name: candidate.firstName,
                p_last_name: candidate.lastName,
                p_age: candidate.age,
                p_current_tick: currentTick,
                p_bill_name: billName,
                p_preamble: preamble,
                p_voting_ends_tick: currentTick + (DIPLOMACY_CONFIG.AMBASSADOR_CONFIRMATION_VOTING_TICKS || 6)
            });
            if (nominationError) throw nominationError;

            const nominationRow = Array.isArray(nominationResult) ? nominationResult[0] : nominationResult;
            if (!nominationRow?.ambassador_id || !nominationRow?.bill_id) {
                throw new Error('Ambassador nomination failed: server did not return expected IDs.');
            }
            confirmationBillId = nominationRow.bill_id;

            // Auto-cast FM's party votes on confirmation bill
            const { data: parties } = await _supabase
                .from('factions')
                .select('id, faction_name')
                .eq('nation_id', currentNation.id);
            const seatData = await loadSeats(_supabase, currentNation.id, false, parties || [], currentFaction.id);
            const mySeats = seatData.allPartySeats[currentFaction.id] || 0;

            if (mySeats > 0) {
                await _supabase.from('bill_support').upsert({
                    bill_id: confirmationBillId,
                    faction_id: currentFaction.id,
                    stance: 'yes',
                    seat_count: mySeats
                });
            }
            await syncVoteTallies(_supabase, confirmationBillId);
        }

        // 8. Momentum bonus
        await adjustMomentumAll(_supabase, currentNation.id, candidate.partyId, 1, 'diplomacy:ambassador_selected');

        // 9. Alert result
        const msg = isAutocracy
            ? candidate.firstName + ' ' + candidate.lastName + ' has been appointed Ambassador to ' + appointTargetNation.name + '!'
            : candidate.firstName + ' ' + candidate.lastName + ' has been nominated as Ambassador to ' + appointTargetNation.name + '.\nA confirmation vote has been filed in Parliament.';
        alert('Ambassador ' + (isAutocracy ? 'Appointed' : 'Nominated') + '\n\n' + msg + '\n\n+1 Momentum to ' + candidate.partyName + '\nCost: ' + APPOINT_AMBASSADOR_AP + ' AP');

        // 10. Reset state
        appointTargetNation = null;
        appointCandidates = [];
        appointSelectedIndex = null;
        appointTargetRelation = null;
        appointCachedExistingAmbs = null;
        activeDraftAction = null;
        activeDraftTarget = null;
        document.querySelectorAll('.action-item.is-active').forEach(el => el.classList.remove('is-active'));

        // Refresh UI
        diplomaticRoles = await detectDiplomaticRoles(currentFaction, currentNation, currentCoalition);
        const apEl = document.getElementById('diplo-ap');
        if (apEl) apEl.textContent = (currentFaction?.action_points ?? 0) + ' AP';
        await Promise.all([renderRelationsTab(), renderDraftBox()]);

    } catch (e) {
        console.error('Error appointing ambassador:', e);
        alert('Error: ' + e.message);
    }
}
