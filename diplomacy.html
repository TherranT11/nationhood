function getSeenProposals() {

    try { return JSON.parse(localStorage.getItem('nationhood_seen_proposals_' + currentFaction.id) || '[]'); }

function markProposalSeen(proposalId) {
    if (!currentFaction || !proposalId) return;
    const seen = getSeenProposals();
    if (seen.includes(proposalId)) return;
    seen.push(proposalId);
    localStorage.setItem('nationhood_seen_proposals_' + currentFaction.id, JSON.stringify(seen));
    // Update the unseen count badge in the Agreements header
    updateUnseenBadge();
}

function isProposalUnseen(proposalId) {
    return !getSeenProposals().includes(proposalId);
}

function cleanSeenProposals(activeIds) {
    if (!currentFaction) return;
    const seen = getSeenProposals();
    const cleaned = seen.filter(id => activeIds.includes(id));
    localStorage.setItem('nationhood_seen_proposals_' + currentFaction.id, JSON.stringify(cleaned));
}

// ==================== ROLE DETECTION ====================

async function detectDiplomaticRoles(faction, nation, coalition) {
    const roles = {
        isHoG: false,
        isFM: false,
        isMoT: false,
        ambassadorTo: []  // array of { target_nation_id, target_nation_name }
    };

    if (!faction || !nation) return roles;

    // Head of Government
    if (isGovernmentAutocracy(nation)) {
        roles.isHoG = nation.ruling_faction_id === faction.id;
    } else if (isGovernmentPresidential(nation)) {
        // Presidential: president's faction is stored as lead_party_id in virtual coalition
        roles.isHoG = coalition?.lead_party_id === faction.id;
    } else {
        // Parliamentary: prime minister from coalition allocations
        const alloc = coalition?.ministry_allocations || {};
        roles.isHoG = alloc.prime_minister === faction.id;
    }

    // Foreign Minister: check coalition allocation first, then fall back to ministries table
    const alloc = coalition?.ministry_allocations || {};
    roles.isFM = alloc.foreign === faction.id;

    // Minister of Trade: check coalition allocation first, then fall back to ministries table
    roles.isMoT = alloc.trade === faction.id;

    // In autocracies, ministers are stored in the ministries table, not coalition allocations
    if (!roles.isFM || !roles.isMoT) {
        const { data: ministryEntries } = await _supabase
            .from('ministries')
            .select('ministry_key, party_id')
            .eq('nation_id', nation.id)
            .in('ministry_key', ['foreign', 'trade'])
            .eq('is_active', true);
        (ministryEntries || []).forEach(entry => {
            if (entry.party_id === faction.id) {
                if (entry.ministry_key === 'foreign') roles.isFM = true;
                if (entry.ministry_key === 'trade') roles.isMoT = true;
            }
        });
    }

    // Ambassadors: fetch ALL active ambassadors from this nation, then filter by faction in JS
    // (avoids compound .eq() filter issues with RLS policies)
    try {
        const { data: allNationAmbassadors, error: ambErr } = await _supabase
            .from('ambassadors')
            .select('*, factions(abbreviation)')
            .eq('nation_id', nation.id)
            .eq('is_active', true)
            .eq('status', 'active');

        if (ambErr) {
            console.warn('Ambassador query error:', JSON.stringify(ambErr));
        } else if (allNationAmbassadors && allNationAmbassadors.length > 0) {
            // Filter to ambassadors belonging to this faction
            const myAmbassadors = allNationAmbassadors.filter(a => a.faction_id === faction.id);

            console.log('[Diplo] Active ambassadors from nation:', allNationAmbassadors.length,
                '| Matched to faction ' + faction.id + ':', myAmbassadors.length,
                '| Faction IDs in DB:', allNationAmbassadors.map(a => a.faction_id));

            if (myAmbassadors.length > 0) {
                // Look up target nation names separately (avoids FK join issues)
                const targetIds = myAmbassadors.map(a => a.target_nation_id);
                const { data: targetNations } = await _supabase
                    .from('nations')
                    .select('id, name')
                    .in('id', targetIds);
                const nationNameMap = {};
                (targetNations || []).forEach(n => { nationNameMap[n.id] = n.name; });

                roles.ambassadorTo = myAmbassadors.map(a => ({
                    id: a.id,
                    target_nation_id: a.target_nation_id,
                    target_nation_name: nationNameMap[a.target_nation_id] || 'Unknown',
                    appointed_at_tick: a.appointed_at_tick,
                    term_length: a.term_length || 60,
                    ambassador_first_name: a.ambassador_first_name,
                    ambassador_last_name: a.ambassador_last_name,
                    factions: a.factions
                }));
            }
        }
    } catch (e) {
        console.warn('Could not load ambassadors:', e);
    }

    return roles;
}

// Re-fetch roles fresh from DB before critical actions (prevents stale cache exploits)
async function refreshRoles() {
    diplomaticRoles = await detectDiplomaticRoles(currentFaction, currentNation, currentCoalition);
    await renderDiploHeader();
    return diplomaticRoles;

/** Can this faction accept/reject incoming state visits?
 *  Autocracy: ruling faction (HoG). Democracy/Presidential: Foreign Minister. */
function canHandleStateVisit() {
    if (isGovernmentAutocracy(currentNation)) return diplomaticRoles.isHoG;
    return diplomaticRoles.isFM;
}

// Check if the current player has any qualifying diplomatic role
function hasAnyDiplomaticRole() {
    return diplomaticRoles && (
        diplomaticRoles.isHoG ||
        diplomaticRoles.isFM ||
        diplomaticRoles.isMoT ||
        (diplomaticRoles.ambassadorTo && diplomaticRoles.ambassadorTo.length > 0)
    );
}

    }

    btns.forEach(btn => {

}

async function renderWorldNations() {
    const grid = document.getElementById('world-nations-view');
    if (!grid) return;
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-text">Loading nations...</div></div>';

    if (!currentNation) {
        grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-text">No nation data available.</div></div>';
        return;
    }

    try {
        const [nationsRes, factionsRes, crisesRes, relationsRes, ambassadorsRes, theirAmbassadorsRes, ceasefireRes] = await Promise.all([
            _supabase.from('nations').select('*').order('name'),
            _supabase.from('factions').select('id, faction_type, faction_name, abbreviation, seats, nation_id, party_color, ideology_value_1, ideology_value_2').eq('faction_type', 'party'),
            _supabase.from('active_crises').select('nation_id, crisis_id, crisis_templates(name)'),
            _supabase.from('diplomatic_relations').select('*')
                .or('nation_a_id.eq.' + currentNation.id + ',nation_b_id.eq.' + currentNation.id),
            _supabase.from('ambassadors').select('target_nation_id')
                .eq('nation_id', currentNation.id).eq('is_active', true).eq('status', 'active'),
            _supabase.from('ambassadors').select('nation_id')
                .eq('target_nation_id', currentNation.id).eq('is_active', true).eq('status', 'active'),
            _supabase.from('diplomatic_proposals').select('proposing_nation_id, target_nation_id')
                .eq('proposal_type', 'ceasefire').eq('status', 'active')
                .or('proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + currentNation.id)
        ]);

        if (nationsRes.error) {
            grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-text">Error loading nations.</div></div>';
            return;
        }

        if (factionsRes.error) console.warn('World Nations: factions query error:', factionsRes.error);
        if (crisesRes.error) console.warn('World Nations: crises query error:', crisesRes.error);
        if (relationsRes.error) console.warn('World Nations: relations query error:', relationsRes.error);
        if (ambassadorsRes.error) console.warn('World Nations: ambassadors query error:', ambassadorsRes.error);
        if (theirAmbassadorsRes.error) console.warn('World Nations: their ambassadors query error:', theirAmbassadorsRes.error);
        if (ceasefireRes.error) console.warn('World Nations: ceasefire query error:', ceasefireRes.error);

        const allNations = (nationsRes.data || []).filter(n => n.id !== currentNation.id);
        const factions = factionsRes.data || [];
        const crises = crisesRes.data || [];
        const relations = relationsRes.data || [];
        const ourAmbs = ambassadorsRes.data || [];
        const theirAmbs = theirAmbassadorsRes.data || [];

        // Index data by nation
        const factionsByNation = {};
        for (const f of factions) {
            if (!factionsByNation[f.nation_id]) factionsByNation[f.nation_id] = [];
            factionsByNation[f.nation_id].push(f);
        }
        const crisesByNation = {};
        for (const c of crises) {
            if (!crisesByNation[c.nation_id]) crisesByNation[c.nation_id] = [];
            crisesByNation[c.nation_id].push(c);
        }

        const ourAmbSet = new Set(ourAmbs.map(a => a.target_nation_id));
        const theirAmbSet = new Set(theirAmbs.map(a => a.nation_id));

        // Build ceasefire set: nation IDs that have an active ceasefire with us
        const ceasefireNations = new Set();
        for (const cf of (ceasefireRes.data || [])) {
            const otherId = cf.proposing_nation_id === currentNation.id ? cf.target_nation_id : cf.proposing_nation_id;
            ceasefireNations.add(otherId);
        }

        if (allNations.length === 0) {
            grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-text">No other nations found.</div></div>';
            return;
        }

        let html = '';
        for (const nation of allNations) {
            const nFactions = (factionsByNation[nation.id] || []).sort((a, b) => (b.seats || 0) - (a.seats || 0));
            const nCrises = crisesByNation[nation.id] || [];
            const totalSeats = nation.total_seats || 100;

            // Relation
            const rel = relations.find(r =>
                (r.nation_a_id === currentNation.id && r.nation_b_id === nation.id) ||
                (r.nation_a_id === nation.id && r.nation_b_id === currentNation.id)
            );
            const score = rel?.relation_score ?? 35;
            const hasCeasefire = ceasefireNations.has(nation.id);
            const tier = getRelationTier(score, hasCeasefire);
            const dotColor = tierToDotColor(tier);
            const pillClass = tierToPillClass(tier);

            // Embassy
            const hasOurAmb = ourAmbSet.has(nation.id);
            const hasTheirAmb = theirAmbSet.has(nation.id);
            let embassyClass = 'wn-embassy-tag--none';
            let embassyLabel = 'No Embassy';
            if (hasOurAmb && hasTheirAmb) { embassyClass = 'wn-embassy-tag--open'; embassyLabel = 'Embassy Open'; }
            else if (hasOurAmb || hasTheirAmb) { embassyClass = 'wn-embassy-tag--closed'; embassyLabel = 'Embassy Closed'; }

            // Gov badge
            const govClass = wnGetGovClass(nation.government_type);
            const govLabel = wnGetGovLabel(nation.government_type);
            const flagUrl = nation.flag_url || '';

            // Head of state
            const hosName = ((nation.head_of_state_first_name || '') + ' ' + (nation.head_of_state_last_name || '')).trim();
            const hosTitle = nation.head_of_state_title || (nation.government_type === 'Autocracy' ? 'Ruler' : nation.government_type === 'Presidential' ? 'President' : 'PM');

            // Stats
            const pop = nation.population ? formatNumber(nation.population) : '—';
            const gdp = nation.gdp ? fmtBudgetCurrency(nation.gdp) : '—';
            const unemp = nation.unemployment != null ? nation.unemployment.toFixed(1) + '%' : '—';
            const stabRaw = nation.stability;
            const stab = stabRaw != null ? Math.round(stabRaw) : '—';
            const stabColor = stabRaw != null
                ? (stabRaw >= 60 ? 'var(--green)' : stabRaw >= 40 ? 'var(--amber)' : 'var(--red)')
                : 'var(--text-primary)';
            const approval = nation.gov_approval != null ? Math.round(nation.gov_approval) + '%' : '—';

            // Seat bar
            const usedSeats = nFactions.reduce((s, p) => s + (p.seats || 0), 0);
            const seatSegments = nFactions.filter(p => p.seats > 0).map((p, i) => {
                const pct = ((p.seats / totalSeats) * 100).toFixed(1);
                const color = p.party_color || WN_FALLBACK_COLORS[i % WN_FALLBACK_COLORS.length];
                return '<div class="wn-seat-bar__segment" style="width:' + pct + '%;background:' + color + ';" title="' + escapeHtml(p.faction_name) + ': ' + p.seats + ' seats"></div>';
            }).join('');

            const seatLegend = nFactions.filter(p => p.seats > 0).map((p, i) => {
                const color = p.party_color || WN_FALLBACK_COLORS[i % WN_FALLBACK_COLORS.length];
                return '<span class="wn-seat-legend-item"><span class="wn-seat-legend-dot" style="background:' + color + ';"></span>' + escapeHtml(p.abbreviation || '?') + ' ' + p.seats + '</span>';
            }).join('');

            // Party rows
            const partyRows = nFactions.map((p, i) => {
                const color = p.party_color || WN_FALLBACK_COLORS[i % WN_FALLBACK_COLORS.length];
                const ideoLabel = wnGetIdeologyLabel(p);
                return '<div class="wn-party-row">' +
                    '<span class="wn-party-row__dot" style="background:' + color + ';"></span>' +
                    '<span class="wn-party-row__name">' + escapeHtml(p.faction_name) + '</span>' +
                    '<span class="wn-party-row__abbr">' + escapeHtml(p.abbreviation || '?') + '</span>' +
                    (ideoLabel ? '<span class="wn-party-row__ideo">' + wnColorizeIdeology(ideoLabel) + '</span>' : '') +
                    '<span class="wn-party-row__seats">' + (p.seats || 0) + '</span>' +
                '</div>';
            }).join('');

            // Crisis rows
            const crisisRows = nCrises.length > 0
                ? nCrises.map(c => '<div class="wn-crisis-row"><span class="wn-crisis-pip"></span><span class="wn-crisis-name">' + escapeHtml(c.crisis_templates?.name || 'Unknown Crisis') + '</span></div>').join('')
                : '<div class="wn-no-crisis">No active crises</div>';

            html += '<div class="wn-card">' +
                // Header
                '<div class="wn-card__header">' +
                    (flagUrl ? '<img class="wn-card__flag" src="' + flagUrl + '" alt="' + escapeHtml(nation.name) + '">' : '') +
                    '<span class="wn-card__name">' + escapeHtml(nation.name) + '</span>' +
                    '<span class="wn-card__gov ' + govClass + '">' + govLabel + '</span>' +
                '</div>' +
                // Body
                '<div class="wn-card__body">' +
                    (hosName ? '<div class="wn-stat-row"><span class="wn-stat-row__label">' + escapeHtml(hosTitle) + '</span><span class="wn-stat-row__value">' + escapeHtml(hosName) + '</span></div>' : '') +
                    '<div class="wn-stat-row"><span class="wn-stat-row__label">Population</span><span class="wn-stat-row__value">' + pop + '</span></div>' +
                    '<div class="wn-stat-row"><span class="wn-stat-row__label">GDP</span><span class="wn-stat-row__value">' + gdp + '</span></div>' +
                    '<div class="wn-stat-row"><span class="wn-stat-row__label">Unemployment</span><span class="wn-stat-row__value">' + unemp + '</span></div>' +
                    '<div class="wn-stat-row"><span class="wn-stat-row__label">Stability</span><span class="wn-stat-row__value" style="color:' + stabColor + '">' + stab + '</span></div>' +
                    '<div class="wn-stat-row"><span class="wn-stat-row__label">Gov. Approval</span><span class="wn-stat-row__value">' + approval + '</span></div>' +
                    // Seat bar
                    (nFactions.some(p => p.seats > 0) ?
                        '<div class="wn-seat-bar">' +
                            '<div class="wn-seat-bar__label">Seat Distribution</div>' +
                            '<div class="wn-seat-bar__track">' + seatSegments + (usedSeats < totalSeats ? '<div class="wn-seat-bar__empty"></div>' : '') + '</div>' +
                            '<div class="wn-seat-bar__legend">' + seatLegend + '</div>' +
                        '</div>'
                    : '') +
                    // Party list
                    (nFactions.length > 0 ?
                        '<div class="wn-party-list">' +
                            '<div class="wn-party-list__header">Factions &mdash; ' + nFactions.length + '</div>' +
                            partyRows +
                        '</div>'
                    : '') +
                    // Crises
                    '<div class="wn-crisis-section">' +
                        '<div class="wn-party-list__header">Active Crises</div>' +
                        crisisRows +
                    '</div>' +
                '</div>' +
                // Footer — relation
                '<div class="wn-card__footer">' +
                    '<span class="wn-relation-dot" style="background:' + dotColor + '"></span>' +
                    '<span class="wn-relation-label pill ' + pillClass + '">' + tier.label + '</span>' +
                    '<span class="wn-relation-score">(' + score + ')</span>' +
                    '<span class="wn-embassy-tag ' + embassyClass + '">' + embassyLabel + '</span>' +
                '</div>' +
            '</div>';
        }

        grid.innerHTML = html;
    } catch (err) {
        console.warn('Error rendering world nations:', err);
        worldNationsLoaded = false; // allow retry on next toggle
        grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-text">Error loading nations.</div></div>';
    }
}

// ==================== HEADER PANEL ====================

async function renderDiploHeader() {
    const header = document.getElementById('diplo-header');
    if (!header || !currentNation) return;

    // Count active agreements and pending proposals for our nation
    let activeCount = 0;
    let pendingCount = 0;
    try {
        const { count: ac } = await _supabase
            .from('diplomatic_proposals')
            .select('*', { count: 'exact', head: true })
            .eq('status', 'active')
            .or('proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + currentNation.id);
        activeCount = ac || 0;

        // Also count active trade agreements
        const { count: tac } = await _supabase
            .from('trade_agreements')
            .select('*', { count: 'exact', head: true })
            .eq('status', 'active')
            .or('nation_a_id.eq.' + currentNation.id + ',nation_b_id.eq.' + currentNation.id);
        activeCount += tac || 0;

        const { count: pc } = await _supabase
            .from('diplomatic_proposals')
            .select('*', { count: 'exact', head: true })
            .in('status', ['proposed', 'revised'])
            .or('proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + currentNation.id);
        pendingCount = pc || 0;
    } catch (e) { console.warn('Error fetching header counts:', e); }

    const roleBadges = [];
    if (diplomaticRoles.isHoG) {
        const hogLabel = isGovernmentAutocracy(currentNation) ? 'Head of Government' : isGovernmentPresidential(currentNation) ? 'President' : 'Prime Minister';
        roleBadges.push('<span class="diplo-role-badge role-hog">' + hogLabel + '</span>');
    }
    if (diplomaticRoles.isFM)  roleBadges.push('<span class="diplo-role-badge role-fm">Foreign Minister</span>');
    if (diplomaticRoles.isMoT) roleBadges.push('<span class="diplo-role-badge role-mot">Minister of Trade</span>');
    diplomaticRoles.ambassadorTo.forEach(a => {
        roleBadges.push('<span class="diplo-role-badge role-amb">Ambassador to ' + escapeHtml(a.target_nation_name) + '</span>');
    });
    if (roleBadges.length === 0) {
        roleBadges.push('<span class="diplo-role-badge role-none">No Diplomatic Role</span>');
    }

    header.innerHTML = `
        <div class="diplo-header-roles">${roleBadges.join('')}</div>
        <div class="diplo-view-toggle">
            <button class="diplo-view-btn ${currentDiploView === 'diplomacy' ? 'is-active' : ''}" data-view="diplomacy" onclick="switchDiploView('diplomacy')">Diplomacy</button>
            <button class="diplo-view-btn ${currentDiploView === 'nations' ? 'is-active' : ''}" data-view="nations" onclick="switchDiploView('nations')">World Nations</button>
        </div>
        <div class="diplo-header-stats">
            <span class="diplo-header-stat">${activeCount} Active Agreement${activeCount !== 1 ? 's' : ''}</span>
            <span class="diplo-header-stat">${pendingCount} Pending</span>
        </div>
    `;

    // Populate ambassador dropdown in toolbar (if element exists)
    const dropdown = document.getElementById('diplo-amb-dropdown');
    const select = document.getElementById('amb-select');
    if (dropdown && select) {
        if (diplomaticRoles.ambassadorTo.length > 0) {
            dropdown.style.display = '';
            select.innerHTML = '<option value="">Select...</option>' +
                diplomaticRoles.ambassadorTo.map(a =>
                    '<option value="' + a.target_nation_id + '">' + a.target_nation_name + '</option>'
                ).join('');
        } else {
            dropdown.style.display = 'none';
        }
    }

    // Refresh tab notification badges
    updateTabBadges();
}

// ==================== TAB BADGES ====================

async function updateTabBadges() {
    if (!currentNation) return;
    try {
        const _fm = diplomaticRoles && diplomaticRoles.isFM;
        const _mot = diplomaticRoles && diplomaticRoles.isMoT;
        const _ambIds = (diplomaticRoles && diplomaticRoles.ambassadorTo || []).map(a => a.target_nation_id);
        const _hasDiploRole = _fm || _mot || _ambIds.length > 0;

        // Count items needing action on Initiative tab:
        // Open trade negotiations where we're the recipient (not yet in participants)
        let initiativeCount = 0;
        if (_hasDiploRole) {
            const { data: openNegs } = await _supabase
                .from('trade_negotiations')
                .select('participants, initiated_by_nation')
                .eq('status', 'open')
                .or('nation_a_id.eq.' + currentNation.id + ',nation_b_id.eq.' + currentNation.id);

            (openNegs || []).forEach(n => {
                const participants = n.participants || [];
                if (participants.some(p => p.nation_id === currentNation.id)) return;
                const fromNation = n.initiated_by_nation;
                if (_fm || _mot || _ambIds.includes(fromNation)) initiativeCount++;
            });
        }

        const initBadge = document.getElementById('initiative-badge');
        if (initBadge) initBadge.textContent = initiativeCount > 0 ? initiativeCount : '';

        // Count items needing action on Inbox tab:
        // Incoming proposals needing our response + revised proposals sent back to us
        let inboxCount = 0;
        if (_hasDiploRole) {
            const { data: inboxProposals } = await _supabase
                .from('diplomatic_proposals')
                .select('status, proposing_nation_id, target_nation_id')
                .in('status', ['proposed', 'revised', 'fm_review', 'ratification', 'ratification_failed'])
                .or('proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + currentNation.id);

            (inboxProposals || []).forEach(p => {
                const isIncoming = p.target_nation_id === currentNation.id;
                const fromNation = p.proposing_nation_id;
                const isRevised = p.status === 'revised';
                const pd = p.proposal_data || {};
                const revisedByUs = isRevised && (pd.revised_by_nation_id ? pd.revised_by_nation_id === currentNation.id : !isIncoming);
                if ((p.status === 'proposed' && isIncoming) && (_fm || _mot || _ambIds.includes(fromNation))) {
                    inboxCount++;
                } else if (isRevised && !revisedByUs && (_fm || _mot || _ambIds.includes(fromNation))) {
                    inboxCount++;
                } else if (p.status === 'fm_review' && _fm) {
                    inboxCount++;
                } else if ((p.status === 'ratification' || p.status === 'ratification_failed') && (_fm || (diplomaticRoles && diplomaticRoles.isHoG))) {
                    inboxCount++;
                }
            });
        }

        const inboxBadge = document.getElementById('inbox-badge');
        if (inboxBadge) inboxBadge.textContent = inboxCount > 0 ? inboxCount : '';
    } catch (e) {
        console.warn('Error updating tab badges:', e);
    }
}

function showDiploTab(tabName) {

    document.querySelectorAll('.diplo-tab').forEach(btn => {

    });
    // Update tab panels
    document.querySelectorAll('.diplo-tab-panel').forEach(panel => {
