// ==================== ROLE DETECTION ====================

async function detectDiplomaticRoles(faction, nation, coalition) {
    const roles = {
        isHoG: false,
        isFM: false,
        ambassadorTo: []  // array of { target_nation_id, target_nation_name }
    };

    if (!faction || !nation) return roles;

    // Head of Government
    if (isGovernmentAutocracy(nation)) {
        roles.isHoG = nation.ruling_faction_id === faction.id;
    } else {
        const alloc = coalition?.ministry_allocations || {};
        roles.isHoG = alloc.prime_minister === faction.id;
    }

    // Foreign Minister: check coalition allocation first, then fall back to ministries table
    const alloc = coalition?.ministry_allocations || {};
    roles.isFM = alloc.foreign === faction.id;

    // In autocracies, ministers are stored in the ministries table, not coalition allocations
    if (!roles.isFM) {
        const { data: fmEntry } = await _supabase
            .from('ministries')
            .select('party_id')
            .eq('nation_id', nation.id)
            .eq('ministry_key', 'foreign')
            .eq('is_active', true)
            .maybeSingle();
        if (fmEntry && fmEntry.party_id === faction.id) {
            roles.isFM = true;
        }
    }

    // Ambassadors: query ambassadors table for active ambassadors belonging to this faction
    try {
        const { data: ambassadors } = await _supabase
            .from('ambassadors')
            .select('target_nation_id, appointed_at_tick, term_length, ambassador_first_name, ambassador_last_name, nations!ambassadors_target_nation_id_fkey(name)')
            .eq('faction_id', faction.id)
            .eq('nation_id', nation.id)
            .eq('is_active', true)
            .eq('status', 'active');

        if (ambassadors && ambassadors.length > 0) {
            roles.ambassadorTo = ambassadors.map(a => ({
                target_nation_id: a.target_nation_id,
                target_nation_name: a.nations?.name || 'Unknown',
                appointed_at_tick: a.appointed_at_tick,
                term_length: a.term_length || 36,
                ambassador_first_name: a.ambassador_first_name,
                ambassador_last_name: a.ambassador_last_name
            }));
        }
    } catch (e) {
        console.warn('Could not load ambassadors:', e);
    }

    return roles;
}

// ==================== HEADER PANEL ====================

async function renderDiploHeader() {
    const header = document.getElementById('diplo-header');
    if (!header) return;

    // Count active agreements and pending proposals for our nation
    let activeCount = 0;
    let pendingCount = 0;
    try {
        const { count: ac } = await _supabase
            .from('diplomatic_proposals')
            .select('*', { count: 'exact', head: true })
            .eq('status', 'active')
            .or('proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + currentNation.id);
        activeCount = ac || 0;

        const { count: pc } = await _supabase
            .from('diplomatic_proposals')
            .select('*', { count: 'exact', head: true })
            .in('status', ['proposed', 'revised'])
            .or('proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + currentNation.id);
        pendingCount = pc || 0;
    } catch (e) { console.warn('Error fetching header counts:', e); }

    const roleBadges = [];
    if (diplomaticRoles.isHoG) roleBadges.push('<span class="diplo-role-badge role-hog">Head of Gov</span>');
    if (diplomaticRoles.isFM)  roleBadges.push('<span class="diplo-role-badge role-fm">Foreign Minister</span>');
    diplomaticRoles.ambassadorTo.forEach(a => {
        roleBadges.push('<span class="diplo-role-badge role-amb">Amb. to ' + escapeHtml(a.target_nation_name) + '</span>');
    });
    if (roleBadges.length === 0) {
        roleBadges.push('<span class="diplo-role-badge role-none">No Diplomatic Role</span>');
    }

    header.innerHTML = `
        <div class="diplo-header-roles">${roleBadges.join('')}</div>
        <div class="diplo-header-stats">
            <span class="diplo-header-stat">${activeCount} Active Agreement${activeCount !== 1 ? 's' : ''}</span>
            <span class="diplo-header-stat">${pendingCount} Pending</span>
        </div>
    `;

    // Populate ambassador dropdown in toolbar
    const dropdown = document.getElementById('diplo-amb-dropdown');
    const select = document.getElementById('amb-select');
    if (diplomaticRoles.ambassadorTo.length > 0) {
        dropdown.style.display = '';
        select.innerHTML = '<option value="">Select...</option>' +
            diplomaticRoles.ambassadorTo.map(a =>
                '<option value="' + a.target_nation_id + '">' + a.target_nation_name + '</option>'
            ).join('');
    } else {
        dropdown.style.display = 'none';
    }
}

// ==================== TAB SWITCHING ====================

function showDiploTab(tabName) {
    // Update tab buttons
    document.querySelectorAll('.diplo-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tabName);
    });
    // Update tab panels
    document.querySelectorAll('.diplo-tab-panel').forEach(panel => {
        panel.style.display = panel.id === 'tab-' + tabName ? '' : 'none';
    });
    // Lazy-load tab content
    if (tabName === 'agreements') renderAgreementsTab();
    if (tabName === 'initiative') renderInitiativeWizard();
    if (tabName === 'inbox') renderInboxTab();
}

// ==================== RELATIONS TAB ====================

async function renderRelationsTab() {
    const panel = document.getElementById('tab-relations');
    if (!panel) return;
    panel.innerHTML = '<p style="color:#888;font-style:italic;text-align:center;padding:20px;">Loading nations...</p>';

    if (!currentNation) {
        panel.innerHTML = '<p class="diplo-tab-placeholder">No nation data available.</p>';
        return;
    }

    try {
        // Parallel fetch: all nations, relations, ambassadors, active agreements
        const [nationsRes, relationsRes, ambassadorsRes, agreementsRes] = await Promise.all([
            _supabase.from('nations').select('id, name, population, stability, civil_unrest, military_strength, capital').order('name'),
            _supabase.from('diplomatic_relations').select('*')
                .or('nation_a_id.eq.' + currentNation.id + ',nation_b_id.eq.' + currentNation.id),
            _supabase.from('ambassadors').select('target_nation_id, ambassador_first_name, ambassador_last_name, appointed_at_tick, term_length')
                .eq('nation_id', currentNation.id).eq('is_active', true).eq('status', 'active'),
            _supabase.from('diplomatic_proposals').select('proposing_nation_id, target_nation_id')
                .eq('status', 'active')
                .or('proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + currentNation.id)
        ]);

        const allNations = nationsRes.data || [];
        const allRelations = relationsRes.data || [];
        const ourAmbassadors = ambassadorsRes.data || [];
        const activeAgreements = agreementsRes.data || [];

        // Filter out own nation
        const otherNations = allNations.filter(n => n.id !== currentNation.id);

        if (otherNations.length === 0) {
            panel.innerHTML = '<p class="diplo-tab-placeholder">No other nations found.</p>';
            return;
        }

        let cardsHTML = '';
        for (const nation of otherNations) {
            // Find relation for this pair
            const relation = allRelations.find(r =>
                (r.nation_a_id === currentNation.id && r.nation_b_id === nation.id) ||
                (r.nation_a_id === nation.id && r.nation_b_id === currentNation.id)
            );

            // Check for ceasefire among active agreements
            // (Simple heuristic: not available from this query, default false)
            const hasCeasefire = false;

            const score = relation?.relation_score ?? 35;
            const tier = getRelationTier(score, hasCeasefire);

            // Find our ambassador to this nation
            const ambassador = ourAmbassadors.find(a => a.target_nation_id === nation.id);
            const ambName = ambassador
                ? ((ambassador.ambassador_first_name || '') + ' ' + (ambassador.ambassador_last_name || '')).trim()
                : null;

            // Count agreements with this nation
            const agreementCount = activeAgreements.filter(a =>
                (a.proposing_nation_id === currentNation.id && a.target_nation_id === nation.id) ||
                (a.proposing_nation_id === nation.id && a.target_nation_id === currentNation.id)
            ).length;

            const flagUrl = FLAG_URLS[nation.name] || null;
            const barWidth = Math.max(0, Math.min(100, score));
            const barColor = getRelationBarColor(score);

            cardsHTML += `
                <div class="nation-card" data-nation-name="${escapeHtml(nation.name)}" data-nation-id="${nation.id}" id="nation-card-${nation.id}">
                    <div class="nation-card-header" onclick="toggleNationCard('${nation.id}')">
                        ${flagUrl ? '<img src="' + flagUrl + '" class="nation-card-flag" />' : '<div class="nation-card-flag-placeholder"></div>'}
                        <div class="nation-card-info">
                            <div class="nation-card-name">${escapeHtml(nation.name)}</div>
                            <div class="nation-card-meta">
                                <span class="relation-badge ${tier.cssClass}">${tier.label}</span>
                                ${ambName ? '<span class="nation-card-amb">Amb: ' + escapeHtml(ambName) + '</span>' : ''}
                                ${agreementCount > 0 ? '<span class="nation-card-agreements">' + agreementCount + ' agreement' + (agreementCount > 1 ? 's' : '') + '</span>' : ''}
                            </div>
                            <div class="relations-bar">
                                <div class="relations-bar-fill" style="width:${barWidth}%;background:${barColor};"></div>
                            </div>
                        </div>
                    </div>
                    <div class="nation-card-body" id="nation-card-body-${nation.id}" style="display:none;"></div>
                </div>
            `;
        }

        panel.innerHTML = cardsHTML;
    } catch (err) {
        console.error('Error rendering relations tab:', err);
        panel.innerHTML = '<p style="color:#f44;text-align:center;padding:20px;">Error loading nations.</p>';
    }
}

async function renderAgreementsTab() {
    const panel = document.getElementById('tab-agreements');
    if (!panel) return;
    panel.innerHTML = '<p style="color:#888;font-style:italic;text-align:center;padding:20px;">Loading agreements...</p>';

    if (!currentNation) {
        panel.innerHTML = '<p class="diplo-tab-placeholder">No nation data available.</p>';
        return;
    }

    try {
        const { data: agreements } = await _supabase
            .from('diplomatic_proposals')
            .select('*')
            .eq('status', 'active')
            .or('proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + currentNation.id)
            .order('activated_at_tick', { ascending: false });

        if (!agreements || agreements.length === 0) {
            panel.innerHTML = '<p class="diplo-tab-placeholder">No active agreements.</p>';
            return;
        }

        let html = '';
        for (const ag of agreements) {
            const pd = ag.proposal_data || {};
            const articles = pd.articles || [];
            const struckIndices = new Set(pd.struck_articles || []);

            // Determine classification from proposal data or infer from articles
            let classification = pd.classification || null;
            if (!classification && articles.length > 0) {
                // Check if any article is MAJOR
                const hasMajor = articles.some((art, i) => {
                    if (struckIndices.has(i)) return false;
                    const typeInfo = INITIATIVE_TYPES[art.type];
                    return typeInfo && typeInfo.classification === 'MAJOR';
                });
                classification = hasMajor ? 'MAJOR' : 'MINOR';
            }

            // Parties
            const proposerName = pd.proposer_nation_name || 'Unknown';
            const targetName = pd.target_nation_name || 'Unknown';

            // Dates
            const signedTick = ag.activated_at_tick;
            const durationYears = pd.duration_years || 0;
            const expiresTick = signedTick != null && durationYears > 0
                ? signedTick + (durationYears * GAME_CONFIG.TICKS_PER_YEAR)
                : null;

            // Active articles and effects
            let totalRel = 0, totalMoney = 0;
            const termsHTML = articles.map((art, i) => {
                const isStruck = struckIndices.has(i);
                if (!isStruck) {
                    totalRel += art.relations || 0;
                    totalMoney += art.money || 0;
                }
                // Backwards-compatible: old proposals may have art.type, new ones have art.text
                const artLabel = art.text || art.label || art.type || 'Unknown';
                return '<div class="agreement-card-term' + (isStruck ? ' term-struck' : '') + '">' +
                    '<span class="proposal-article-num">Art. ' + toRoman(i + 1) + '</span> ' +
                    '<span class="proposal-article-label">' + escapeHtml(artLabel) + '</span>' +
                    (isStruck ? ' <span class="struck-label">STRUCK</span>' : '') +
                '</div>';
            }).join('');

            // Effects tags
            const relStr = totalRel > 0 ? '+' + totalRel + ' Relations' : totalRel < 0 ? totalRel + ' Relations' : '';
            const moneyStr = totalMoney > 0 ? '+$' + (totalMoney / 1e6).toFixed(0) + 'M' : totalMoney < 0 ? '-$' + (Math.abs(totalMoney) / 1e6).toFixed(0) + 'M' : '';
            let effectsHTML = '';
            if (relStr) effectsHTML += '<span class="effect-tag effect-rel">' + relStr + '</span>';
            if (moneyStr) effectsHTML += '<span class="effect-tag effect-money">' + moneyStr + '</span>';

            // Withdraw button — only FM or HoG can withdraw
            let withdrawHTML = '';
            if (diplomaticRoles.isFM || diplomaticRoles.isHoG) {
                const penalty = totalRel * 2;
                const penaltyStr = penalty > 0 ? '-' + penalty + ' Relations penalty' : '';
                withdrawHTML = '<button class="agreement-withdraw-btn" onclick="withdrawAgreement(\'' + ag.id + '\')" title="' + escapeHtml(penaltyStr) + '">Withdraw</button>';
            }

            // Classification badge
            const classBadge = classification
                ? '<span class="classification-badge classification-' + classification.toLowerCase() + '">' + classification + '</span>'
                : '';

            // Agreement type badge (from ag.proposal_data.agreement_type or inferred)
            const agreementType = pd.agreement_type || ag.proposal_type || 'diplomatic_initiative';
            const typeLabel = INITIATIVE_TYPES[agreementType]?.label || '';

            html += `
                <div class="agreement-card">
                    <div class="agreement-card-header">
                        <div class="agreement-card-name">${escapeHtml(pd.name || 'Unnamed Agreement')}</div>
                        <div class="agreement-card-badges">
                            ${classBadge}
                            ${withdrawHTML}
                        </div>
                    </div>
                    <div class="agreement-card-meta">
                        ${escapeHtml(proposerName)} &amp; ${escapeHtml(targetName)}
                        ${typeLabel ? ' &middot; ' + escapeHtml(typeLabel) : ''}
                        ${durationYears ? ' &middot; ' + durationYears + ' year' + (durationYears !== 1 ? 's' : '') : ''}
                    </div>
                    ${termsHTML ? '<div class="agreement-card-terms">' + termsHTML + '</div>' : ''}
                    ${effectsHTML ? '<div class="agreement-card-effects">' + effectsHTML + '</div>' : ''}
                    <div class="agreement-card-dates">
                        <span>Signed: ${signedTick != null ? tickToDate(signedTick) : '—'}</span>
                        <span>Expires: ${expiresTick != null ? tickToDate(expiresTick) : '—'}</span>
                    </div>
                </div>
            `;
        }

        panel.innerHTML = html;
    } catch (err) {
        console.error('Error rendering agreements tab:', err);
        panel.innerHTML = '<p style="color:#f44;text-align:center;padding:20px;">Error loading agreements.</p>';
    }
}

async function withdrawAgreement(agreementId) {
    // Fetch the agreement
    const { data: ag, error: fetchErr } = await _supabase
        .from('diplomatic_proposals')
        .select('*')
        .eq('id', agreementId)
        .single();

    if (fetchErr || !ag) { alert('Could not load agreement.'); return; }

    const pd = ag.proposal_data || {};
    const articles = pd.articles || [];
    const struckIndices = new Set(pd.struck_articles || []);

    // Calculate relations penalty (2x the bonus)
    let totalRel = 0;
    articles.forEach((art, i) => {
        if (!struckIndices.has(i)) totalRel += art.relations || 0;
    });
    const penalty = totalRel * 2;

    if (!confirm(
        'Withdraw from "' + (pd.name || 'Agreement') + '"?\n\n' +
        (penalty > 0 ? 'This will cost -' + penalty + ' Relations (2x the bonus).\n' : '') +
        'This action cannot be undone.'
    )) return;

    // Get current tick
    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const currentTick = shard?.current_tick || 0;

    // Set agreement to withdrawn
    const { error: updateErr } = await _supabase
        .from('diplomatic_proposals')
        .update({ status: 'withdrawn', withdrawn_at_tick: currentTick })
        .eq('id', agreementId);

    if (updateErr) { alert('Error withdrawing: ' + updateErr.message); return; }

    // Apply relations penalty
    if (penalty > 0) {
        const nationA = ag.proposing_nation_id < ag.target_nation_id ? ag.proposing_nation_id : ag.target_nation_id;
        const nationB = ag.proposing_nation_id < ag.target_nation_id ? ag.target_nation_id : ag.proposing_nation_id;

        const { data: rel } = await _supabase
            .from('diplomatic_relations')
            .select('id, relation_score, active_treaties')
            .eq('nation_a_id', nationA)
            .eq('nation_b_id', nationB)
            .maybeSingle();

        if (rel) {
            const newScore = Math.max(0, Math.min(100, (rel.relation_score || 35) - penalty));
            const treaties = Array.isArray(rel.active_treaties)
                ? rel.active_treaties.filter(t => t !== agreementId)
                : [];
            await _supabase.from('diplomatic_relations')
                .update({ relation_score: newScore, active_treaties: treaties })
                .eq('id', rel.id);
        }
    }

    alert('"' + (pd.name || 'Agreement') + '" withdrawn.');

    // Refresh
    await renderAgreementsTab();
    await renderDiploHeader();
}

let inboxFilter = 'all'; // all, action, pending, fm_review, ratification

async function renderInboxTab(filter) {
    const panel = document.getElementById('tab-inbox');
    if (!panel) return;

    if (filter) inboxFilter = filter;

    panel.innerHTML = '<p style="color:#888;font-style:italic;text-align:center;padding:20px;">Loading inbox...</p>';

    if (!currentNation) {
        panel.innerHTML = '<p class="diplo-tab-placeholder">No nation data available.</p>';
        return;
    }

    try {
        // Fetch all non-active, non-rejected proposals involving our nation
        const { data: proposals } = await _supabase
            .from('diplomatic_proposals')
            .select('*')
            .in('status', ['proposed', 'revised', 'fm_review', 'ratification', 'ratification_failed'])
            .or('proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + currentNation.id)
            .order('proposed_at_tick', { ascending: false });

        const allProposals = proposals || [];

        // Count by category for filter badges
        const counts = { all: allProposals.length, action: 0, pending: 0, fm_review: 0, ratification: 0 };
        allProposals.forEach(p => {
            const isIncoming = p.target_nation_id === currentNation.id;
            const isRevised = p.status === 'revised';
            const revisedByThem = isRevised && p.target_nation_id === currentNation.id;
            const needsOurAction = (p.status === 'proposed' && isIncoming) || (isRevised && !revisedByThem);
            const isFmReview = p.status === 'fm_review';
            const isRatification = p.status === 'ratification' || p.status === 'ratification_failed';

            if (needsOurAction) counts.action++;
            else if (isFmReview) counts.fm_review++;
            else if (isRatification) counts.ratification++;
            else counts.pending++;
        });

        // Build filter bar
        let filterHTML = '<div class="inbox-filters">';
        const filters = [
            { key: 'all', label: 'All', count: counts.all },
            { key: 'action', label: 'Action Needed', count: counts.action },
            { key: 'pending', label: 'Pending', count: counts.pending },
            { key: 'fm_review', label: 'FM Review', count: counts.fm_review },
            { key: 'ratification', label: 'Ratification', count: counts.ratification }
        ];
        filters.forEach(f => {
            const countBadge = f.count > 0 ? '<span class="inbox-filter-count">' + f.count + '</span>' : '';
            filterHTML += '<button class="inbox-filter-btn ' + (inboxFilter === f.key ? 'active' : '') + '" onclick="filterInbox(\'' + f.key + '\')">' + f.label + countBadge + '</button>';
        });
        filterHTML += '</div>';

        // Filter proposals
        const filtered = allProposals.filter(p => {
            if (inboxFilter === 'all') return true;
            const isIncoming = p.target_nation_id === currentNation.id;
            const isRevised = p.status === 'revised';
            const revisedByThem = isRevised && p.target_nation_id === currentNation.id;
            const needsOurAction = (p.status === 'proposed' && isIncoming) || (isRevised && !revisedByThem);

            if (inboxFilter === 'action') return needsOurAction;
            if (inboxFilter === 'fm_review') return p.status === 'fm_review';
            if (inboxFilter === 'ratification') return p.status === 'ratification' || p.status === 'ratification_failed';
            if (inboxFilter === 'pending') return !needsOurAction && p.status !== 'fm_review' && p.status !== 'ratification' && p.status !== 'ratification_failed';
            return true;
        });

        if (filtered.length === 0) {
            panel.innerHTML = filterHTML + '<p class="diplo-tab-placeholder">No proposals in this category.</p>';
            return;
        }

        let cardsHTML = '';
        for (const p of filtered) {
            cardsHTML += renderInboxCard(p);
        }

        panel.innerHTML = filterHTML + cardsHTML;
    } catch (err) {
        console.error('Error rendering inbox tab:', err);
        panel.innerHTML = '<p style="color:#f44;text-align:center;padding:20px;">Error loading inbox.</p>';
    }
}

function filterInbox(filter) {
    inboxFilter = filter;
    renderInboxTab(filter);
}

function renderInboxCard(p) {
    const pd = p.proposal_data || {};
    const articles = pd.articles || [];
    const struckIndices = new Set(pd.struck_articles || []);
    const isIncoming = p.target_nation_id === currentNation.id;
    const isRevised = p.status === 'revised';
    const revisedByUs = isRevised && p.target_nation_id !== currentNation.id;
    const revisedByThem = isRevised && p.target_nation_id === currentNation.id;
    const needsOurAction = (p.status === 'proposed' && isIncoming) || (isRevised && !revisedByUs);

    // Classification
    const classification = pd.classification || null;
    const classBadge = classification
        ? '<span class="classification-badge classification-' + classification.toLowerCase() + '">' + classification + '</span>'
        : '';

    // Status badge
    let statusBadge = '';
    if (p.status === 'proposed' && isIncoming) {
        statusBadge = '<span class="proposal-status-badge badge-action">Awaiting Your Response</span>';
    } else if (p.status === 'proposed' && !isIncoming) {
        statusBadge = '<span class="proposal-status-badge badge-waiting">Awaiting Response</span>';
    } else if (isRevised && !revisedByUs) {
        statusBadge = '<span class="proposal-status-badge badge-action">Revised — Your Turn</span>';
    } else if (isRevised && revisedByUs) {
        statusBadge = '<span class="proposal-status-badge badge-waiting">Revision Sent</span>';
    } else if (p.status === 'fm_review') {
        statusBadge = '<span class="proposal-status-badge" style="background:#1a5276;color:#85c1e9;">FM Review</span>';
    } else if (p.status === 'ratification') {
        statusBadge = '<span class="proposal-status-badge" style="background:#6a1b9a;color:#ce93d8;">Parliament</span>';
    } else if (p.status === 'ratification_failed') {
        statusBadge = '<span class="proposal-status-badge" style="background:#b71c1c;color:#ef9a9a;">Ratification Failed</span>';
    }

    // Pipeline tracker for MAJOR proposals
    let pipelineHTML = '';
    if (classification === 'MAJOR') {
        pipelineHTML = renderPipelineTracker(p);
    }

    // Articles display
    let articlesHTML = '';
    if (articles.length > 0) {
        articlesHTML = '<div class="agreement-card-terms">';
        articles.forEach((art, i) => {
            const isStruck = struckIndices.has(i);
            const artLabel = art.text || art.label || art.type || 'Unknown';
            articlesHTML += '<div class="agreement-card-term' + (isStruck ? ' term-struck' : '') + '">' +
                '<span class="proposal-article-num">Art. ' + toRoman(i + 1) + '</span> ' +
                '<span class="proposal-article-label">' + escapeHtml(artLabel) + '</span>' +
                (isStruck ? ' <span class="struck-label">STRUCK</span>' : '') +
            '</div>';
        });
        articlesHTML += '</div>';
    }

    // Effects
    let totalRel = 0, totalMoney = 0;
    articles.forEach((art, i) => {
        if (!struckIndices.has(i)) {
            totalRel += art.relations || 0;
            totalMoney += art.money || 0;
        }
    });
    const relStr = totalRel > 0 ? '+' + totalRel + ' Relations' : totalRel < 0 ? totalRel + ' Relations' : '';
    const moneyStr = totalMoney > 0 ? '+$' + (totalMoney / 1e6).toFixed(0) + 'M' : totalMoney < 0 ? '-$' + (Math.abs(totalMoney) / 1e6).toFixed(0) + 'M' : '';
    let effectsHTML = '';
    if (relStr || moneyStr) {
        effectsHTML = '<div class="agreement-card-effects">';
        if (relStr) effectsHTML += '<span class="effect-tag effect-rel">' + relStr + '</span>';
        if (moneyStr) effectsHTML += '<span class="effect-tag effect-money">' + moneyStr + '</span>';
        effectsHTML += '</div>';
    }

    // Action buttons based on status and role
    let actionsHTML = '';
    if (needsOurAction) {
        // Ambassador can accept/reject/strike
        actionsHTML = '<div class="inbox-card-actions">' +
            '<button class="proposal-accept-btn" onclick="acceptProposal(\'' + p.id + '\')">Accept</button>' +
            '<button class="proposal-strike-btn" onclick="inboxStrikeArticles(\'' + p.id + '\')">Strike Articles</button>' +
            '<button class="proposal-reject-btn" onclick="rejectProposal(\'' + p.id + '\')">Reject</button>' +
        '</div>';
    } else if (p.status === 'fm_review' && diplomaticRoles.isFM) {
        // FM can approve (MINOR → activate, MAJOR → escalate to parliament)
        actionsHTML = '<div class="inbox-card-actions">' +
            '<button class="fm-approve-btn" onclick="fmApprove(\'' + p.id + '\')">Approve</button>' +
            '<button class="fm-escalate-btn" onclick="fmEscalate(\'' + p.id + '\')">Escalate to Parliament</button>' +
            '<button class="fm-reject-btn" onclick="fmReject(\'' + p.id + '\')">Reject</button>' +
        '</div>';
    } else if (p.status === 'ratification_failed' && (diplomaticRoles.isFM || diplomaticRoles.isHoG)) {
        actionsHTML = '<div class="inbox-card-actions">' +
            '<button class="fm-escalate-btn" onclick="fmEscalate(\'' + p.id + '\')">Resubmit to Parliament</button>' +
            '<button class="fm-reject-btn" onclick="fmReject(\'' + p.id + '\')">Abandon</button>' +
        '</div>';
    }

    // Strike checkboxes for action-needed proposals
    let strikeArticlesHTML = '';
    if (needsOurAction && articles.length > 0) {
        strikeArticlesHTML = '<div class="proposal-articles-list" id="inbox-articles-' + p.id + '" style="display:none;">';
        articles.forEach((art, i) => {
            const artLabel = art.text || art.label || art.type || 'Unknown';
            strikeArticlesHTML += '<div class="proposal-article-row">' +
                '<input type="checkbox" class="strike-checkbox" data-proposal-id="' + p.id + '" data-article-index="' + i + '" />' +
                '<div class="proposal-article-content">' +
                    '<span class="proposal-article-num">Art. ' + toRoman(i + 1) + '.</span> ' +
                    '<span class="proposal-article-label">' + escapeHtml(artLabel) + '</span>' +
                '</div>' +
            '</div>';
        });
        strikeArticlesHTML += '<div class="proposal-btn-row" style="margin-top:6px;">' +
            '<button class="proposal-strike-btn" onclick="strikeArticles(\'' + p.id + '\'); renderInboxTab();">Confirm Strike</button>' +
        '</div></div>';
    }

    return `
        <div class="inbox-card ${needsOurAction ? 'requires-action' : ''}">
            <div class="inbox-card-header">
                <div class="inbox-card-name">${escapeHtml(pd.name || 'Unnamed Proposal')}</div>
                <div class="inbox-card-badges">
                    ${classBadge}
                    ${statusBadge}
                </div>
            </div>
            <div class="inbox-card-meta">
                ${escapeHtml(pd.proposer_nation_name || 'Unknown')} &amp; ${escapeHtml(pd.target_nation_name || 'Unknown')}
                &middot; ${pd.duration_years || '?'} year${(pd.duration_years || 0) !== 1 ? 's' : ''}
                &middot; Proposed ${p.proposed_at_tick != null ? tickToDate(p.proposed_at_tick) : '—'}
            </div>
            ${pipelineHTML}
            ${articlesHTML}
            ${effectsHTML}
            ${strikeArticlesHTML}
            ${actionsHTML}
        </div>
    `;
}

// ==================== PIPELINE TRACKER ====================

function renderPipelineTracker(proposal) {
    const pd = proposal.proposal_data || {};
    const pipeline = pd.pipeline || {};
    const status = proposal.status;

    // Pipeline stages for MAJOR: Ambassador Accepted → FM Review → Parliament Ratification → Active
    const stages = [
        { key: 'ambassador', label: 'Ambassador' },
        { key: 'fm_review', label: 'FM Review' },
        { key: 'parliament', label: 'Parliament' },
        { key: 'active', label: 'Active' }
    ];

    // Determine which stages are completed/active
    const stageStates = {};

    if (status === 'proposed' || status === 'revised') {
        stageStates.ambassador = 'active';
    } else if (status === 'fm_review') {
        stageStates.ambassador = 'completed';
        stageStates.fm_review = 'active';
    } else if (status === 'ratification') {
        stageStates.ambassador = 'completed';
        stageStates.fm_review = 'completed';
        stageStates.parliament = 'active';
    } else if (status === 'ratification_failed') {
        stageStates.ambassador = 'completed';
        stageStates.fm_review = 'completed';
        stageStates.parliament = 'rejected';
    } else if (status === 'active') {
        stageStates.ambassador = 'completed';
        stageStates.fm_review = 'completed';
        stageStates.parliament = 'completed';
        stageStates.active = 'completed';
    } else if (status === 'rejected') {
        // Find where it was rejected
        if (pipeline.rejected_at === 'fm') {
            stageStates.ambassador = 'completed';
            stageStates.fm_review = 'rejected';
        } else if (pipeline.rejected_at === 'parliament') {
            stageStates.ambassador = 'completed';
            stageStates.fm_review = 'completed';
            stageStates.parliament = 'rejected';
        } else {
            stageStates.ambassador = 'rejected';
        }
    }

    let html = '<div class="pipeline-tracker">';
    stages.forEach((stage, i) => {
        const state = stageStates[stage.key] || '';
        if (i > 0) {
            const prevCompleted = stageStates[stages[i - 1].key] === 'completed';
            html += '<div class="pipeline-connector ' + (prevCompleted ? 'completed' : '') + '"></div>';
        }
        html += '<div class="pipeline-stage ' + state + '">' +
            '<div class="pipeline-stage-dot"></div><br>' +
            stage.label +
        '</div>';
    });
    html += '</div>';
    return html;
}

// ==================== FM ACTION FUNCTIONS ====================

async function fmApprove(proposalId) {
    const { data: proposal, error: fetchErr } = await _supabase
        .from('diplomatic_proposals')
        .select('*')
        .eq('id', proposalId)
        .single();

    if (fetchErr || !proposal) { alert('Could not load proposal.'); return; }

    const pd = proposal.proposal_data || {};
    const classification = pd.classification || 'MINOR';

    if (classification === 'MAJOR') {
        // MAJOR agreements must go through parliament — use escalate instead
        alert('MAJOR agreements cannot be directly approved. Use "Escalate to Parliament" instead.');
        return;
    }

    // MINOR: FM can directly activate
    if (!confirm(
        'Approve "' + (pd.name || 'Agreement') + '" as Foreign Minister?\n\n' +
        'This MINOR agreement will become active immediately.'
    )) return;

    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const currentTick = shard?.current_tick || 0;

    // Activate the proposal
    const updatedPipeline = { ...(pd.pipeline || {}), fm_approved_at: currentTick, fm_approved_by: currentFaction.id };
    pd.pipeline = updatedPipeline;

    const { error: updateErr } = await _supabase
        .from('diplomatic_proposals')
        .update({ status: 'active', activated_at_tick: currentTick, proposal_data: pd })
        .eq('id', proposalId);

    if (updateErr) { alert('Error approving: ' + updateErr.message); return; }

    // Apply relation effects
    await applyProposalEffects(proposal, currentTick);

    // Fire CIVIC news event
    await fireProposalEvent(pd, currentTick, 'approved',
        'Foreign Minister approved "' + (pd.name || 'Agreement') + '" between ' +
        pd.proposer_nation_name + ' and ' + pd.target_nation_name + '. The agreement is now active.');

    alert('"' + (pd.name || 'Agreement') + '" approved and is now active!');
    await renderInboxTab();
    await renderDiploHeader();
}

async function fmEscalate(proposalId) {
    const { data: proposal, error: fetchErr } = await _supabase
        .from('diplomatic_proposals')
        .select('*')
        .eq('id', proposalId)
        .single();

    if (fetchErr || !proposal) { alert('Could not load proposal.'); return; }

    const pd = proposal.proposal_data || {};

    if (!confirm(
        'Escalate "' + (pd.name || 'Agreement') + '" to Parliament for ratification?\n\n' +
        'A ratification bill will be submitted to the legislature.'
    )) return;

    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const currentTick = shard?.current_tick || 0;

    // Create a ratification bill
    const billTitle = 'Ratify: ' + (pd.name || 'Diplomatic Agreement');
    const billDescription = 'Ratification of the ' + (pd.classification || '') + ' diplomatic agreement "' +
        (pd.name || 'Agreement') + '" between ' + (pd.proposer_nation_name || 'Unknown') + ' and ' +
        (pd.target_nation_name || 'Unknown') + '. Duration: ' + (pd.duration_years || '?') + ' year(s).';

    const { data: bill, error: billErr } = await _supabase
        .from('bills')
        .insert({
            nation_id: currentNation.id,
            bill_type: 'ratification',
            title: billTitle,
            description: billDescription,
            introduced_by_faction_id: currentFaction.id,
            proposal_id: proposalId,
            status: 'committee',
            introduced_at_tick: currentTick
        })
        .select('id')
        .single();

    if (billErr) {
        console.error('Error creating ratification bill:', billErr);
        alert('Error submitting to parliament: ' + billErr.message);
        return;
    }

    // Update proposal status
    const updatedPipeline = { ...(pd.pipeline || {}), escalated_at: currentTick, escalated_by: currentFaction.id, ratification_bill_id: bill?.id };
    pd.pipeline = updatedPipeline;

    await _supabase
        .from('diplomatic_proposals')
        .update({ status: 'ratification', proposal_data: pd })
        .eq('id', proposalId);

    // Fire CIVIC news event
    await fireProposalEvent(pd, currentTick, 'escalated',
        'The diplomatic agreement "' + (pd.name || 'Agreement') + '" has been escalated to Parliament for ratification. ' +
        'A ratification bill has been introduced in committee.');

    alert('"' + (pd.name || 'Agreement') + '" escalated to Parliament. Ratification bill submitted.');
    await renderInboxTab();
    await renderDiploHeader();
}

async function fmReject(proposalId) {
    const { data: proposal, error: fetchErr } = await _supabase
        .from('diplomatic_proposals')
        .select('*')
        .eq('id', proposalId)
        .single();

    if (fetchErr || !proposal) { alert('Could not load proposal.'); return; }

    const pd = proposal.proposal_data || {};
    const action = proposal.status === 'ratification_failed' ? 'abandon' : 'reject';

    if (!confirm(
        (action === 'abandon' ? 'Abandon' : 'Reject') + ' "' + (pd.name || 'Agreement') + '" as Foreign Minister?\n\n' +
        'This cannot be undone.'
    )) return;

    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const currentTick = shard?.current_tick || 0;

    const updatedPipeline = { ...(pd.pipeline || {}), rejected_at: 'fm', rejected_at_tick: currentTick };
    pd.pipeline = updatedPipeline;

    await _supabase
        .from('diplomatic_proposals')
        .update({ status: 'rejected', proposal_data: pd })
        .eq('id', proposalId);

    // Fire CIVIC news event
    await fireProposalEvent(pd, currentTick, 'rejected',
        'The Foreign Minister has ' + action + 'ed the diplomatic agreement "' + (pd.name || 'Agreement') +
        '" between ' + pd.proposer_nation_name + ' and ' + pd.target_nation_name + '.');

    alert('"' + (pd.name || 'Agreement') + '" ' + action + 'ed.');
    await renderInboxTab();
    await renderDiploHeader();
}

// ==================== PROPOSAL EFFECT HELPERS ====================

async function applyProposalEffects(proposal, currentTick) {
    const pd = proposal.proposal_data || {};
    const articles = pd.articles || [];
    const struckIndices = new Set(pd.struck_articles || []);

    let totalRel = 0, totalMoney = 0;
    const activeArticles = [];
    articles.forEach((art, i) => {
        if (!struckIndices.has(i)) {
            totalRel += art.relations || 0;
            totalMoney += art.money || 0;
            activeArticles.push(art);
        }
    });

    // Update relations score
    if (totalRel !== 0) {
        const nationA = proposal.proposing_nation_id < proposal.target_nation_id ? proposal.proposing_nation_id : proposal.target_nation_id;
        const nationB = proposal.proposing_nation_id < proposal.target_nation_id ? proposal.target_nation_id : proposal.proposing_nation_id;

        const { data: rel } = await _supabase
            .from('diplomatic_relations')
            .select('id, relation_score, active_treaties')
            .eq('nation_a_id', nationA)
            .eq('nation_b_id', nationB)
            .maybeSingle();

        if (rel) {
            const newScore = Math.max(-100, Math.min(100, (rel.relation_score || 0) + totalRel));
            const treaties = Array.isArray(rel.active_treaties) ? [...rel.active_treaties, proposal.id] : [proposal.id];
            await _supabase.from('diplomatic_relations')
                .update({ relation_score: newScore, active_treaties: treaties })
                .eq('id', rel.id);
        }
    }
}

async function fireProposalEvent(pd, currentTick, stage, description) {
    try {
        const { data: allNations } = await _supabase.from('nations').select('id');
        if (allNations && allNations.length > 0) {
            const eventRows = allNations.map(n => ({
                nation_id: n.id,
                event_name: (pd.name || 'Diplomatic Agreement') + ' — ' + stage.charAt(0).toUpperCase() + stage.slice(1),
                category: 'Diplomatic',
                description_chosen: description,
                fired_at_tick: currentTick
            }));
            await _supabase.from('event_log').insert(eventRows);
        }
    } catch (e) {
        console.warn('Error firing proposal event:', e);
    }
}

// ==================== RELATION TIER (score-driven) ====================

function getRelationTier(score, hasCeasefire) {
    if (hasCeasefire)  return { label: 'Ceasefire',     cssClass: 'rel-ceasefire' };
    if (score >= 90)   return { label: 'Allied',        cssClass: 'rel-allied' };
    if (score >= 70)   return { label: 'Friendly',      cssClass: 'rel-friendly' };
    if (score >= 50)   return { label: 'Warm',          cssClass: 'rel-warm' };
    if (score >= 35)   return { label: 'Neutral',       cssClass: 'rel-neutral' };
    if (score >= 20)   return { label: 'Cold',          cssClass: 'rel-cold' };
    if (score >= 5)    return { label: 'Hostile',       cssClass: 'rel-hostile' };
    return                     { label: 'Adversarial',   cssClass: 'rel-adversarial' };
}

function getRelationBarColor(score) {
    if (score >= 90) return '#1b5e20';
    if (score >= 70) return '#2e7d32';
    if (score >= 50) return '#558b2f';
    if (score >= 35) return '#827717';
    if (score >= 20) return '#e65100';
    if (score >= 5)  return '#b71c1c';
    return '#4a0000';
}

// ==================== RELATION SECTION ====================

function renderRelationSection(relType, relClass, embassyStatus, ambassador) {
    const embassyColor = embassyStatus === 'open' ? '#4CAF50' : embassyStatus === 'closed' ? '#f44' : '#888';
    const ambName = ambassador
        ? (ambassador.ambassador_first_name || '') + ' ' + (ambassador.ambassador_last_name || '')
        : null;

    // Ambassador term info
    let termHTML = '';
    if (ambassador && ambassador.appointed_at_tick != null) {
        const termLength = ambassador.term_length || 36;
        const ticksServed = shardTick - ambassador.appointed_at_tick;
        const ticksRemaining = Math.max(0, termLength - ticksServed);
        const expiryTick = ambassador.appointed_at_tick + termLength;
        const remainingYears = Math.floor(ticksRemaining / 12);
        const remainingMonths = ticksRemaining % 12;
        const remainingStr = remainingYears > 0
            ? remainingYears + 'y ' + remainingMonths + 'mo'
            : remainingMonths + ' month' + (remainingMonths !== 1 ? 's' : '');

        termHTML = `
            <div class="info-row">
                <span class="info-label">Appointed</span>
                <span class="info-value" style="font-size:0.78rem;">${tickToDate(ambassador.appointed_at_tick)}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Term Expires</span>
                <span class="info-value" style="font-size:0.78rem;">${tickToDate(expiryTick)}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Remaining</span>
                <span class="info-value" style="font-size:0.78rem;color:${ticksRemaining <= 3 ? '#f44' : ticksRemaining <= 6 ? '#ff9800' : '#4CAF50'};">${remainingStr}</span>
            </div>`;
    }

    // Retirement warning
    let warningHTML = '';
    if (ambassador && ambassador.appointed_at_tick != null) {
        const termLength = ambassador.term_length || 36;
        const ticksRemaining = Math.max(0, termLength - (shardTick - ambassador.appointed_at_tick));
        if (ticksRemaining <= DIPLOMACY_CONFIG.AMBASSADOR_RETIREMENT_WARNING && ticksRemaining > 0) {
            warningHTML = `
                <div style="background:#3a2a00;border:1px solid #ff9800;border-radius:6px;padding:8px 10px;margin-top:8px;font-size:0.78rem;color:#ff9800;">
                    &#9888; Ambassador ${ambName ? ambName.trim() : ''} will retire in ${ticksRemaining} tick${ticksRemaining !== 1 ? 's' : ''}. Conclude any active negotiations.
                </div>`;
        }
    }

    return `
        <div class="diplo-section-title">Diplomatic Relations</div>
        <div class="info-block">
            <div class="info-row">
                <span class="info-label">Relation</span>
                <span class="relation-badge ${relClass}">${relType}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Embassy</span>
                <span class="info-value" style="color:${embassyColor};text-transform:capitalize;">${embassyStatus}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Ambassador</span>
                <span class="info-value" style="font-size:0.85rem;">${ambName ? ambName.trim() : '<span style="color:#666;">None assigned</span>'}</span>
            </div>
            ${termHTML}
        </div>
        ${warningHTML}
    `;
}

            const remaining = Math.max(0, tl - (shardTick - myAmb.appointed_at_tick));
            if (remaining <= DIPLOMACY_CONFIG.AMBASSADOR_RETIREMENT_WARNING && remaining > 0) {
                const ambFullName = ((myAmb.ambassador_first_name || '') + ' ' + (myAmb.ambassador_last_name || '')).trim();
                ambWarningHTML = `<div style="background:#3a2a00;border:1px solid #ff9800;border-radius:6px;padding:8px 10px;margin-top:8px;font-size:0.78rem;color:#ff9800;">&#9888; Ambassador ${ambFullName} will retire in ${remaining} tick${remaining !== 1 ? 's' : ''}. Conclude any active negotiations.</div>`;
            }
        }

        actions += `
            <div class="action-card" style="margin-bottom:10px;">
                <div class="action-header">
                    <span class="action-title">Ambassador Actions</span>
                </div>
                <p class="action-desc">As Ambassador to ${targetNation.name}, you can negotiate directly.</p>
                ${ambWarningHTML}
                <button class="action-btn" ${initiativeDisabled} onclick="openInitiativeForm()">Diplomatic Initiative</button>
                ${initiativeHint}
                <button class="action-btn" style="margin-top:8px;" disabled>Gather Intel (Coming Soon)</button>
            </div>
            <div id="initiative-form-container"></div>
        `;
    }

    // No role — show observer message
    if (!roles.isHoG && !roles.isFM && !isAmbToTarget) {
        actions += `
            <div class="action-card" style="margin-bottom:10px;">
                <div class="action-header">
                    <span class="action-title">No Diplomatic Authority</span>
                </div>
                <p class="action-desc">Your party does not currently hold a diplomatic role in the coalition. You need to be Head of Government, Foreign Minister, or an Ambassador to take diplomatic actions.</p>
            </div>
        `;
    }

    return `
        <div class="diplo-section-title">Actions</div>
        ${actions}
    `;
}

// ==================== DATA FETCHERS ====================

async function fetchDiplomaticRelation(myNationId, targetNationId) {
    if (!myNationId || !targetNationId || myNationId === targetNationId) return null;

    // Canonical ordering: lower UUID = nation_a
    const nationA = myNationId < targetNationId ? myNationId : targetNationId;
    const nationB = myNationId < targetNationId ? targetNationId : myNationId;

    try {
        const { data } = await _supabase
            .from('diplomatic_relations')
            .select('*')
            .eq('nation_a_id', nationA)
            .eq('nation_b_id', nationB)
            .maybeSingle();
        return data;
    } catch (e) {
        console.warn('Error fetching diplomatic relation:', e);
        return null;
    }
}

async function fetchActiveProposals(myNationId, targetNationId) {
    if (!myNationId || !targetNationId || myNationId === targetNationId) return [];

    try {
        const { data } = await _supabase
            .from('diplomatic_proposals')
            .select('proposal_type, proposal_tier, status, activated_at_tick')
            .or(
                'and(proposing_nation_id.eq.' + myNationId + ',target_nation_id.eq.' + targetNationId + '),' +
                'and(proposing_nation_id.eq.' + targetNationId + ',target_nation_id.eq.' + myNationId + ')'
            )
            .eq('status', 'active');
        return data || [];
    } catch (e) {
        console.warn('Error fetching proposals:', e);
        return [];
    }
}

async function fetchAmbassador(myNationId, targetNationId) {
    if (!myNationId || !targetNationId || myNationId === targetNationId) return null;

    try {
        const { data } = await _supabase
            .from('ambassadors')
            .select('*')
            .eq('nation_id', myNationId)
            .eq('target_nation_id', targetNationId)
            .eq('is_active', true)
            .eq('status', 'active')
            .maybeSingle();
        return data;
    } catch (e) {
        console.warn('Error fetching ambassador:', e);
        return null;
    }
}

// ==================== HELPERS ====================

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function tickToDate(tick) {
    if (tick == null) return '—';
    const y = 2000 + Math.floor(tick / 12);
    return MONTHS[tick % 12] + ' ' + y;
}

function getStatColor(value) {
    if (value == null) return '#888';
    if (value >= 70) return '#4CAF50';
    if (value >= 40) return '#ffcc00';
    return '#f44';
}

// ==================== PENDING AMBASSADOR FETCH ====================

async function fetchPendingAmbassador(myNationId, targetNationId) {
    if (!myNationId || !targetNationId || myNationId === targetNationId) return null;

    try {
        const { data: pendingAmbassador } = await _supabase
            .from('ambassadors')
            .select('*')
            .eq('nation_id', myNationId)
            .eq('target_nation_id', targetNationId)
            .eq('is_active', true)
            .eq('status', 'pending_confirmation')
            .maybeSingle();

        if (!pendingAmbassador) return null;

        const activeBillStatuses = ['floor', 'committee'];
        let billQuery = _supabase
            .from('bills')
            .select('id')
            .eq('bill_type', 'confirmation')
            .in('status', activeBillStatuses);

        if (pendingAmbassador.confirmation_bill_id) {
            billQuery = billQuery.eq('id', pendingAmbassador.confirmation_bill_id);
        } else {
            billQuery = billQuery.eq('ambassador_id', pendingAmbassador.id);
        }

        const { data: liveBill } = await billQuery.maybeSingle();

        if (liveBill) return pendingAmbassador;

        await _supabase
            .from('ambassadors')
            .update({ status: 'rejected', is_active: false })
            .eq('id', pendingAmbassador.id);

        console.warn(`Ambassador confirmation desync detected for ${myNationId} → ${targetNationId}. Resetting state.`);
        return null;
    } catch (e) {
        console.warn('Error fetching pending ambassador:', e);
        return null;
    }
}

// ==================== RECALL AMBASSADOR ====================

async function recallAmbassador(ambassadorId, nationName) {
    if (!confirm(
        `Recall your Ambassador from ${nationName}?\n\n` +
        `The ambassador's party will lose 1-3 Approval.`
    )) return;

    try {
        const { data: shard } = await _supabase
            .from('shard')
            .select('current_tick')
            .eq('name', 'Alpha Shard')
            .single();
        const tick = shard?.current_tick || 0;

        // Get ambassador details for approval penalty
        const { data: amb } = await _supabase
            .from('ambassadors')
            .select('faction_id, ambassador_first_name, ambassador_last_name, factions(approval_rating)')
            .eq('id', ambassadorId)
            .single();

        if (!amb) { alert('Ambassador not found.'); return; }

        // Deactivate ambassador
        await _supabase
            .from('ambassadors')
            .update({ status: 'recalled', is_active: false, recalled_at_tick: tick })
            .eq('id', ambassadorId);

        // 1d3 approval loss
        const loss = Math.floor(Math.random() * 3) + 1;
        await adjustBlocApproval(_supabase, amb.faction_id, -loss);

        const ambName = ((amb.ambassador_first_name || '') + ' ' + (amb.ambassador_last_name || '')).trim();
        alert(`Ambassador ${ambName} recalled from ${nationName}.\n-${loss} Approval to their party.`);

        // Refresh roles, header, and re-render expanded card
        diplomaticRoles = await detectDiplomaticRoles(currentFaction, currentNation, currentCoalition);
        await renderDiploHeader();
        await renderRelationsTab();

    } catch (e) {
        console.error('Error recalling ambassador:', e);
        alert('Error: ' + e.message);
    }
}

async function cancelPendingAmbassador(ambassadorId, nationName) {
    if (!confirm(`Cancel this ambassador nomination to ${nationName}?\n\nThis cannot be undone.`)) return;

    try {
        const { data: amb } = await _supabase
            .from('ambassadors')
            .select('id, ambassador_first_name, ambassador_last_name')
            .eq('id', ambassadorId)
            .maybeSingle();

        if (!amb) { alert('Pending ambassador nomination not found.'); return; }

        await _supabase
            .from('ambassadors')
            .update({ status: 'withdrawn', is_active: false })
            .eq('id', ambassadorId)
            .eq('status', 'pending_confirmation');

        const { data: confirmationBill } = await _supabase
            .from('bills')
            .select('id, status')
            .eq('ambassador_id', ambassadorId)
            .in('status', ['committee', 'floor'])
            .maybeSingle();

        if (confirmationBill) {
            await _supabase
                .from('bills')
                .update({ status: 'failed' })
                .eq('id', confirmationBill.id);
        }

        const ambName = ((amb.ambassador_first_name || '') + ' ' + (amb.ambassador_last_name || '')).trim();
        alert(`Nomination withdrawn: ${ambName} to ${nationName}.`);

        diplomaticRoles = await detectDiplomaticRoles(currentFaction, currentNation, currentCoalition);
        await renderDiploHeader();
        await renderRelationsTab();

    } catch (e) {
        console.error('Error canceling pending ambassador:', e);
        alert('Error: ' + e.message);
    }
}

// ==================== DIPLOMATIC CHAT ====================

async function renderChatSection(targetNation, roles, ourAmbassador, theirAmbassador) {
    // Determine if there's a diplomatic channel
    const hasOurAmb = ourAmbassador && ourAmbassador.status === 'active';
    const hasTheirAmb = theirAmbassador && theirAmbassador.status === 'active';

    if (!hasOurAmb && !hasTheirAmb) {
        return `
            <div class="diplo-section-title">Diplomatic Channel</div>
            <div class="diplo-chat-empty">No diplomatic channel established.<br>An ambassador must be posted to enable communication.</div>
        `;
    }

    // Can the current player send messages?
    const isAmbToTarget = roles.ambassadorTo.some(a => a.target_nation_id === targetNation.id);
    const canSend = isAmbToTarget && hasOurAmb;
    const canView = roles.isFM || roles.isHoG || isAmbToTarget;

    if (!canView) {
        return `
            <div class="diplo-section-title">Diplomatic Channel</div>
            <div class="diplo-chat-empty">Diplomatic messages are visible to the Foreign Minister, Head of Government, and Ambassadors.</div>
        `;
    }

    // Fetch messages
    let messages = [];
    try {
        const { data } = await _supabase
            .from('diplomatic_messages')
            .select('*')
            .or(
                'and(from_nation_id.eq.' + currentNation.id + ',to_nation_id.eq.' + targetNation.id + '),' +
                'and(from_nation_id.eq.' + targetNation.id + ',to_nation_id.eq.' + currentNation.id + ')'
            )
            .order('sent_at_tick', { ascending: true })
            .order('created_at', { ascending: true })
            .limit(100);
        messages = data || [];
    } catch (e) {
        console.warn('Error fetching diplomatic messages:', e);
    }

    const msgsHTML = messages.length > 0
        ? messages.map(m => {
            const isMine = m.from_nation_id === currentNation.id;
            return `
                <div class="diplo-msg ${isMine ? 'mine' : 'theirs'}">
                    <div class="diplo-msg-sender">
                        ${m.sender_name || 'Unknown'}
                        <span class="role-badge" style="background:${isMine ? '#1a5276' : '#2e7d32'};color:#fff;">${m.sender_role || 'diplomat'}</span>
                    </div>
                    <div class="diplo-msg-text">${escapeHtml(m.message_text)}</div>
                    <div class="diplo-msg-tick">Tick ${m.sent_at_tick}</div>
                </div>`;
        }).join('')
        : '<div class="diplo-chat-empty">No messages yet. Start the conversation.</div>';

    const inputHTML = canSend ? `
        <div class="diplo-chat-input">
            <input type="text" id="diplo-msg-input" placeholder="Type a message..." maxlength="500"
                onkeydown="if(event.key==='Enter')sendDiploMessage('${targetNation.id}','${targetNation.name}')" />
            <button onclick="sendDiploMessage('${targetNation.id}','${targetNation.name}')">Send</button>
        </div>
    ` : '<div style="font-size:0.72rem;color:var(--text-dim);text-align:center;padding:6px;">View only — only ambassadors can send messages.</div>';

    return `
        <div class="diplo-section-title">Diplomatic Channel</div>
        <div class="diplo-chat-box" id="diplo-chat-box">${msgsHTML}</div>
        ${inputHTML}
    `;
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

async function sendDiploMessage(targetNationId, targetNationName) {
    const input = document.getElementById('diplo-msg-input');
    if (!input) return;
    const text = input.value.trim();
    if (!text) return;

    try {
        // Get current tick
        const { data: shard } = await _supabase
            .from('shard')
            .select('current_tick')
            .eq('name', 'Alpha Shard')
            .single();
        const tick = shard?.current_tick || 0;

        // Get our ambassador's last name for sender display
        const { data: amb } = await _supabase
            .from('ambassadors')
            .select('ambassador_last_name')
            .eq('nation_id', currentNation.id)
            .eq('target_nation_id', targetNationId)
            .eq('is_active', true)
            .eq('status', 'active')
            .single();

        const senderName = 'Amb. ' + (amb?.ambassador_last_name || currentFaction.faction_name);

        await _supabase.from('diplomatic_messages').insert({
            from_nation_id: currentNation.id,
            to_nation_id: targetNationId,
            from_faction_id: currentFaction.id,
            sender_role: 'ambassador',
            sender_name: senderName,
            message_text: text,
            sent_at_tick: tick
        });

        // Append message locally
        const chatBox = document.getElementById('diplo-chat-box');
        if (chatBox) {
            // Remove empty state if present
            const empty = chatBox.querySelector('.diplo-chat-empty');
            if (empty) empty.remove();

            chatBox.innerHTML += `
                <div class="diplo-msg mine">
                    <div class="diplo-msg-sender">
                        ${senderName}
                        <span class="role-badge" style="background:#1a5276;color:#fff;">ambassador</span>
                    </div>
                    <div class="diplo-msg-text">${escapeHtml(text)}</div>
                    <div class="diplo-msg-tick">Tick ${tick}</div>
                </div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        input.value = '';
    } catch (e) {
        console.error('Error sending message:', e);
        alert('Failed to send message: ' + e.message);
    }
}

async function renderInitiativeWizard() {
    const panel = document.getElementById('tab-initiative');
    if (!panel) return;

    // Reset wizard state
    wizardStep = 1;
    wizardTargetNation = null;
    wizardAgreementType = null;
    wizardArticles = [];
    wizardName = '';
    wizardDuration = 1;

    // Check if player has any diplomatic role that can propose
    const canPropose = diplomaticRoles && (diplomaticRoles.isFM || diplomaticRoles.ambassadorTo.length > 0);
    if (!canPropose) {
        panel.innerHTML = '<p class="diplo-tab-placeholder">You need to be a Foreign Minister or Ambassador to propose initiatives.</p>';
        return;
    }

    panel.innerHTML = buildWizardShell();
    await renderWizardStep1();
}

function buildWizardShell() {
    return `
        <div class="wizard-steps">
            <div class="wizard-step active" id="wizard-step-ind-1">
                <span class="wizard-step-num">1</span> Select Nation
            </div>
            <div class="wizard-step" id="wizard-step-ind-2">
                <span class="wizard-step-num">2</span> Agreement Type
            </div>
            <div class="wizard-step" id="wizard-step-ind-3">
                <span class="wizard-step-num">3</span> Draft Articles
            </div>
        </div>
        <div id="wizard-panel-1" class="wizard-panel active"></div>
        <div id="wizard-panel-2" class="wizard-panel"></div>
        <div id="wizard-panel-3" class="wizard-panel"></div>
    `;
}

function updateWizardStepIndicators(step) {
    for (let i = 1; i <= 3; i++) {
        const el = document.getElementById('wizard-step-ind-' + i);
        if (!el) continue;
        el.classList.remove('active', 'completed');
        if (i < step) el.classList.add('completed');
        if (i === step) el.classList.add('active');
    }
    for (let i = 1; i <= 3; i++) {
        const p = document.getElementById('wizard-panel-' + i);
        if (!p) continue;
        p.classList.toggle('active', i === step);
    }
}

async function renderWizardStep1() {
    const panel = document.getElementById('wizard-panel-1');
    if (!panel) return;

    panel.innerHTML = '<p style="color:#888;font-style:italic;font-size:0.82rem;">Loading nations...</p>';

    // Fetch nations we have ambassadors to (with active counterpart ambassadors)
    const ambNationIds = diplomaticRoles.ambassadorTo.map(a => a.target_nation_id);

    if (ambNationIds.length === 0) {
        panel.innerHTML = '<p class="diplo-tab-placeholder">You have no ambassador postings. An ambassador must be active to propose initiatives.</p>';
        return;
    }

    // Fetch nations + check if they have ambassadors back to us
    const [nationsRes, theirAmbRes] = await Promise.all([
        _supabase.from('nations').select('id, name').in('id', ambNationIds),
        _supabase.from('ambassadors').select('nation_id, target_nation_id, status, is_active')
            .eq('target_nation_id', currentNation.id)
            .eq('is_active', true)
            .eq('status', 'active')
            .in('nation_id', ambNationIds)
    ]);

    const nations = nationsRes.data || [];
    const theirAmbs = theirAmbRes.data || [];
    const nationsWithCounterAmb = new Set(theirAmbs.map(a => a.nation_id));

    let html = '<p style="font-size:0.78rem;color:var(--text-muted);margin-bottom:12px;">Select a nation to negotiate with. Both nations must have active ambassadors.</p>';

    for (const nation of nations) {
        const hasCounter = nationsWithCounterAmb.has(nation.id);
        const flagUrl = FLAG_URLS[nation.name] || null;
        const ambInfo = diplomaticRoles.ambassadorTo.find(a => a.target_nation_id === nation.id);
        const ambName = ambInfo ? ((ambInfo.ambassador_first_name || '') + ' ' + (ambInfo.ambassador_last_name || '')).trim() : '';

        html += `
            <div class="wizard-nation-item ${hasCounter ? '' : 'disabled'}" data-nation-id="${nation.id}" onclick="wizardSelectNation('${nation.id}')">
                ${flagUrl ? '<img src="' + flagUrl + '" class="nation-card-flag" />' : '<div class="nation-card-flag-placeholder"></div>'}
                <div>
                    <div class="wizard-nation-name">${escapeHtml(nation.name)}</div>
                    <div class="wizard-nation-detail">
                        Your Amb: ${ambName ? escapeHtml(ambName) : 'None'}
                        ${!hasCounter ? ' &middot; <span style="color:#ff9800;">No counterpart ambassador</span>' : ''}
                    </div>
                </div>
            </div>
        `;
    }

    html += '<div class="wizard-nav"><button class="wizard-next-btn" id="wizard-next-1" disabled onclick="wizardGoToStep2()">Next</button></div>';
    panel.innerHTML = html;
}

function wizardSelectNation(nationId) {
    // Toggle selection
    document.querySelectorAll('.wizard-nation-item').forEach(el => el.classList.remove('selected'));
    const item = document.querySelector('.wizard-nation-item[data-nation-id="' + nationId + '"]');
    if (item && !item.classList.contains('disabled')) {
        item.classList.add('selected');
        wizardTargetNation = nationId;
        const btn = document.getElementById('wizard-next-1');
        if (btn) btn.disabled = false;
    }
}

async function wizardGoToStep2() {
    if (!wizardTargetNation) return;
    wizardStep = 2;
    updateWizardStepIndicators(2);
    await renderWizardStep2();
}

async function renderWizardStep2() {
    const panel = document.getElementById('wizard-panel-2');
    if (!panel) return;

    panel.innerHTML = '<p style="color:#888;font-style:italic;font-size:0.82rem;">Loading agreement types...</p>';

    // Fetch existing active/pending agreements between these nations to disable used types
    const usedTypes = new Set();
    try {
        const { data: existing } = await _supabase
            .from('diplomatic_proposals')
            .select('proposal_data, status')
            .eq('proposal_type', 'diplomatic_initiative')
            .in('status', ['proposed', 'revised', 'active'])
            .or(
                'and(proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + wizardTargetNation + '),' +
                'and(proposing_nation_id.eq.' + wizardTargetNation + ',target_nation_id.eq.' + currentNation.id + ')'
            );
        if (existing) {
            for (const prop of existing) {
                const agType = prop.proposal_data?.agreement_type;
                if (agType) usedTypes.add(agType);
                // Also check old-style articles for type
                const arts = prop.proposal_data?.articles || [];
                const struck = new Set(prop.proposal_data?.struck_articles || []);
                arts.forEach((art, i) => {
                    if (prop.status === 'active' && struck.has(i)) return;
                    if (art.type) usedTypes.add(art.type);
                });
            }
        }
    } catch (e) { console.warn('Error checking existing agreements:', e); }

    let html = '<p style="font-size:0.78rem;color:var(--text-muted);margin-bottom:12px;">Choose the type of agreement to propose.</p>';
    html += '<div class="type-card-grid">';

    for (const [key, info] of Object.entries(INITIATIVE_TYPES)) {
        const isUsed = usedTypes.has(key);
        const classBadge = '<span class="classification-badge classification-' + info.classification.toLowerCase() + '">' + info.classification + '</span>';
        const relStr = info.relations > 0 ? '+' + info.relations + ' Rel' : info.relations < 0 ? info.relations + ' Rel' : '';
        const moneyStr = info.money > 0 ? '+$' + (info.money / 1e6).toFixed(0) + 'M' : info.money < 0 ? '-$' + (Math.abs(info.money) / 1e6).toFixed(0) + 'M' : '';

        html += `
            <div class="type-card ${isUsed ? 'disabled' : ''}" data-type-key="${key}" onclick="wizardSelectType('${key}')">
                <div class="type-card-title">${escapeHtml(info.label)} ${classBadge}</div>
                <div class="type-card-desc">${escapeHtml(info.description)}</div>
                <div class="type-card-effects">
                    ${relStr ? '<span class="effect-tag effect-rel">' + relStr + '</span>' : ''}
                    ${moneyStr ? '<span class="effect-tag effect-money">' + moneyStr + '</span>' : ''}
                    ${!relStr && !moneyStr ? '<span class="effect-tag" style="background:var(--bg-hover);color:var(--text-muted);">No effects</span>' : ''}
                </div>
                ${isUsed ? '<div class="type-card-already">Already active or pending</div>' : ''}
            </div>
        `;
    }

    html += '</div>';
    html += `<div class="wizard-nav">
        <button class="wizard-back-btn" onclick="wizardBackToStep1()">Back</button>
        <button class="wizard-next-btn" id="wizard-next-2" disabled onclick="wizardGoToStep3()">Next</button>
    </div>`;

    panel.innerHTML = html;
}

function wizardSelectType(typeKey) {
    document.querySelectorAll('.type-card').forEach(el => el.classList.remove('selected'));
    const card = document.querySelector('.type-card[data-type-key="' + typeKey + '"]');
    if (card && !card.classList.contains('disabled')) {
        card.classList.add('selected');
        wizardAgreementType = typeKey;
        const btn = document.getElementById('wizard-next-2');
        if (btn) btn.disabled = false;
    }
}

function wizardBackToStep1() {
    wizardStep = 1;
    wizardAgreementType = null;
    updateWizardStepIndicators(1);
}

async function wizardGoToStep3() {
    if (!wizardAgreementType) return;
    wizardStep = 3;
    wizardArticles = [];
    wizardName = '';
    wizardDuration = 1;
    updateWizardStepIndicators(3);
    await renderWizardStep3();
}

async function renderWizardStep3() {
    const panel = document.getElementById('wizard-panel-3');
    if (!panel) return;

    const ourAmb = diplomaticRoles.ambassadorTo.find(a => a.target_nation_id === wizardTargetNation);
    const ourAmbName = ourAmb ? ((ourAmb.ambassador_first_name || '') + ' ' + (ourAmb.ambassador_last_name || '')).trim() : '?';

    // Get their ambassador
    const { data: theirAmb } = await _supabase
        .from('ambassadors')
        .select('ambassador_first_name, ambassador_last_name')
        .eq('nation_id', wizardTargetNation)
        .eq('target_nation_id', currentNation.id)
        .eq('is_active', true)
        .eq('status', 'active')
        .maybeSingle();
    const theirAmbName = theirAmb ? ((theirAmb.ambassador_first_name || '') + ' ' + (theirAmb.ambassador_last_name || '')).trim() : '?';

    const moneyStr = typeInfo.money > 0 ? '+$' + (typeInfo.money / 1e6).toFixed(0) + 'M FM Fund' : typeInfo.money < 0 ? '-$' + (Math.abs(typeInfo.money) / 1e6).toFixed(0) + 'M FM Fund' : '';

    let html = `
        <div style="margin-bottom:12px;">
            <span style="font-size:0.82rem;font-weight:bold;color:var(--text-primary);">${escapeHtml(typeInfo.label)}</span>
            ${classBadge}
        </div>

        <div class="initiative-field">
            <label>Name of Agreement</label>
            <input type="text" id="wizard-name" placeholder="e.g. The Concordia Accord" maxlength="120" oninput="wizardUpdatePreview()" />
        </div>

        <div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:12px;line-height:1.5;padding:8px 10px;background:var(--bg-body);border-radius:4px;border:1px solid var(--border-light);">
            ${preamble}
        </div>

        <div class="initiative-field">
            <label>Articles <button class="action-btn" style="font-size:0.68rem;padding:3px 10px;margin-left:8px;" onclick="wizardAddArticle()">+ Add Article</button></label>
        </div>
        <div id="wizard-articles-list">
            <div style="color:#666;font-size:0.78rem;font-style:italic;padding:4px 0;">No articles added yet. Add at least one article.</div>
        </div>

        <div class="initiative-field">
            <label>Duration</label>
            <select id="wizard-duration" onchange="wizardUpdatePreview()">${durationOptions}</select>
        </div>

        <div id="wizard-preview" class="initiative-preview" style="display:none;"></div>
        <div id="wizard-effects" class="initiative-effects">
            ${relStr ? '<span class="effect-tag effect-rel">' + relStr + '</span>' : ''}
            ${moneyStr ? '<span class="effect-tag effect-money">' + moneyStr + '</span>' : ''}
            ${!relStr && !moneyStr ? '<span class="effect-tag" style="background:var(--bg-hover);color:var(--text-muted);">No mechanical effects</span>' : ''}

        <div class="wizard-nav">

function wizardBackToStep2() {

    wizardArticles = [];
    updateWizardStepIndicators(2);
}

function wizardAddArticle() {
    wizardArticles.push({ text: '' });
    wizardRenderArticles();
    wizardUpdatePreview();
}

function wizardRemoveArticle(index) {
    wizardArticles.splice(index, 1);
    wizardRenderArticles();
    wizardUpdatePreview();
}

function wizardUpdateArticleText(index, text) {

        wizardArticles[index].text = text;
    }
    wizardUpdatePreview();
}

function wizardRenderArticles() {
    const list = document.getElementById('wizard-articles-list');
    if (!list) return;

    if (wizardArticles.length === 0) {
        list.innerHTML = '<div style="color:#666;font-size:0.78rem;font-style:italic;padding:4px 0;">No articles added yet. Add at least one article.</div>';
        return;
    }

    list.innerHTML = wizardArticles.map((art, i) => `
        <div class="freeform-article">
            <div class="freeform-article-header">
                <span class="initiative-article-num">Article ${toRoman(i + 1)}</span>
                <button class="initiative-article-remove" onclick="wizardRemoveArticle(${i})">X</button>
            </div>
