async function submitIPOAmend() {
    if (!currentFaction || !ipoSelectedOrgId || !ipoAmendArticles) return;
    if (_ipoActionLock) return;

    // Build proposed charter from amend articles
    const proposedCharter = {};
    for (const art of ipoAmendArticles) {
        switch (art.type) {
            case 'mission': proposedCharter.mission = art.config.text || ''; break;
            case 'leadership':
                proposedCharter.leadership = {
                    type: art.config.type,
                    termYears: Number(art.config.termYears),
                    votingWeight: art.config.votingWeight,
                    votePass: art.config.votePass
                }; break;
            case 'membership':
                proposedCharter.membership = {
                    admission: art.config.admission,
                    ideologicalThreshold: art.config.ideologicalThreshold || { enabled: false, directions: [] },
                    expulsionClause: art.config.expulsionClause || null
                }; break;
            case 'governance':
                proposedCharter.governance = {
                    actionLeadership: art.config.actionLeadership || 'unilateral',
                    voteTransparency: art.config.voteTransparency,
                    observerStatus: !!art.config.observerStatus,
                    vetoRight: art.config.vetoRight || null,
                    emergencyPowers: !!art.config.emergencyPowers
                }; break;
            case 'resources':
                proposedCharter.resources = {
                    solidarityFund: art.config.solidarityFund || { enabled: false, contributionPerQuarter: 1 },
                    resourceSharingCap: art.config.resourceSharingCap ?? null,
                    jointStatementClause: art.config.jointStatementClause || 'vote',
                    headquarters: art.config.headquarters === '__self__' ? currentNation.id : (art.config.headquarters || null)
                }; break;
        }
    }

    // Defaults for missing articles
    if (!proposedCharter.leadership) proposedCharter.leadership = { type: 'rotation', termYears: 2, votingWeight: 'equal', votePass: 'majority' };
    if (!proposedCharter.membership) proposedCharter.membership = { admission: 'vote', ideologicalThreshold: { enabled: false, directions: [] }, expulsionClause: null };
    if (!proposedCharter.governance) proposedCharter.governance = { voteTransparency: 'public', observerStatus: false, vetoRight: null, emergencyPowers: false };
    if (!proposedCharter.resources) proposedCharter.resources = { solidarityFund: { enabled: false, contributionPerQuarter: 1 }, resourceSharingCap: null, jointStatementClause: 'vote', headquarters: null };

    // Summarize changes for the vote description
    const changedArticles = ipoAmendArticles.map(a => a.type).join(', ');
    const description = 'Amend charter articles: ' + changedArticles;

    _ipoActionLock = true;
    try {
        // Deduct 1 AP
        const apResult = await deductAP(_supabase, currentFaction.id, 1);
        if (!apResult?.success) {
            alert('Not enough AP. Charter amendments cost 1 AP.');
            return;
        }

        // Check open vote limit
        if (!await _checkOpenVoteLimit(ipoSelectedOrgId)) {
            alert(`This organisation already has ${IPO_MAX_OPEN_VOTES} open votes. Wait for some to close.`);
            return;
        }

        // Upload logo image if a new file was selected
        let proposedLogoImageUrl = ipoAmendLogo?.image_url || null;
        if (ipoAmendLogoFile) {
            const ext = ipoAmendLogoFile.name.split('.').pop().toLowerCase();
            const filePath = `ipo-logos/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
            const { error: upErr } = await _supabase.storage.from('public-assets').upload(filePath, ipoAmendLogoFile, { upsert: true });
            if (upErr) {
                console.error('[IPO] Logo upload error:', upErr);
                alert('Failed to upload logo: ' + upErr.message);
                return;
            }
            const { data: urlData } = _supabase.storage.from('public-assets').getPublicUrl(filePath);
            proposedLogoImageUrl = urlData?.publicUrl || null;
        }

        // Build proposed logo change
        const proposedLogo = {
            symbol: ipoAmendLogo?.symbol || '',
            text: ipoAmendLogo?.text || '',
            image_url: proposedLogoImageUrl,
        };

        // Include logo change info in title if logo was modified
        const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
        const currentOrg = membership?.org;
        const logoChanged = currentOrg && (
            proposedLogo.symbol !== (currentOrg.logo_symbol || '') ||
            proposedLogo.text !== (currentOrg.logo_text || '') ||
            proposedLogo.image_url !== (currentOrg.logo_image_url || null)
        );
        const titleParts = [];
        if (changedArticles) titleParts.push(changedArticles);
        if (logoChanged) titleParts.push('logo');
        const voteTitle = 'Charter Amendment: ' + (titleParts.join(', ') || 'no changes');

        // Create a charter_amendment VOTE — not a direct update
        const { error } = await _supabase.from('ipo_votes').insert({
            org_id: ipoSelectedOrgId,
            title: voteTitle,
            vote_type: 'charter_amendment',
            meta: { description, proposed_charter: proposedCharter, proposed_logo: proposedLogo },
            status: 'open',
            opened_at_tick: shardTick,
            closes_at_tick: shardTick + IPO_VOTE_DURATION,
            proposed_by: currentFaction.id
        });

        if (error) {
            console.error('[IPO] Amend charter vote error:', error);
            alert('Failed to propose charter amendment: ' + error.message);
            return;
        }

        await _supabase.from('ipo_chat').insert({
            org_id: ipoSelectedOrgId,
            faction_id: null,
            is_system: true,
            message_text: `${currentFaction.faction_name} proposed a charter amendment (${changedArticles}). Members must vote to approve.`,
            tick_posted: shardTick
        });

        closeIPOAmendModal();
        await loadIPOVotes(ipoSelectedOrgId);
        renderIPOView();
    } catch (e) {
        console.error('[IPO] Amend error:', e);
        alert('Failed to propose charter amendment.');
    } finally {
        _ipoActionLock = false;
    }
}

// ==================== IPO VOTING SYSTEM (Phase 7a) ====================

let ipoVotes = [];           // cached votes for current org
let ipoVoteBallots = {};     // { vote_id: [ballot, ...] }
let ipoVoteMembers = [];     // cached full members (voters) for ballot context
let ipoAllMembers = [];      // cached all members including observers (for expulsion targets)
let _ipoActionLock = false;  // debounce lock for all IPO actions that write to DB
const IPO_VOTE_DURATION = 8; // ticks until vote closes
const IPO_MAX_OPEN_VOTES = 5; // max concurrent open votes per org

async function _checkOpenVoteLimit(orgId) {
    const { count, error } = await _supabase
        .from('ipo_votes')
        .select('id', { count: 'exact', head: true })
        .eq('org_id', orgId)
        .eq('status', 'open');
    if (error) return true; // allow on error
    return (count || 0) < IPO_MAX_OPEN_VOTES;
}

const IPO_VOTE_TYPE_LABELS = {
    membership:          'Membership',
    expulsion:           'Expulsion',
    joint_statement:     'Joint Statement',
    fund_draw:           'Fund Draw',
    charter_amendment:   'Charter Amendment',
    change_headquarters: 'Change Headquarters',
    symposium:           'Symposium',
    leadership_election: 'Leadership Election'
};

const IPO_VOTE_TYPE_DESCRIPTIONS = {
    membership:          'Vote to admit a new member party.',
    expulsion:           'Vote to expel a current member.',
    joint_statement:     'Vote to issue a public statement on behalf of the organisation.',
    fund_draw:           'Vote to withdraw AP from the solidarity fund.',
    charter_amendment:   'Vote to amend the organisation charter.',
    change_headquarters: 'Vote to relocate the organisation headquarters.',
    symposium:           'Vote to hold a symposium influencing a nation\'s ideology.',
    leadership_election: 'Elect a new president from the member parties.'
};

/**
 * Load all votes (open + recent closed) for the selected org.
 */
async function loadIPOVotes(orgId) {
    const container = document.getElementById('ipo-votes-body');
    if (!container || !orgId) return;

    try {
        // Fetch votes (open first, then recent resolved, limit 20)
        const { data: votes, error } = await _supabase
            .from('ipo_votes')
            .select('*')
            .eq('org_id', orgId)
            .order('status', { ascending: true })       // 'open' before 'failed'/'passed'
            .order('opened_at_tick', { ascending: false })
            .limit(20);

        if (error) { console.error('[IPO Votes] Fetch error:', error.message); return; }
        ipoVotes = votes || [];

        // Fetch all ballots for these votes
        if (ipoVotes.length > 0) {
            const voteIds = ipoVotes.map(v => v.id);
            const { data: ballots } = await _supabase
                .from('ipo_ballots')
                .select('*')
                .in('vote_id', voteIds);
            ipoVoteBallots = {};
            (ballots || []).forEach(b => {
                if (!ipoVoteBallots[b.vote_id]) ipoVoteBallots[b.vote_id] = [];
                ipoVoteBallots[b.vote_id].push(b);
            });
        } else {
            ipoVoteBallots = {};
        }

        // Fetch active members for voter count
        const { data: members } = await _supabase
            .from('ipo_members')
            .select('faction_id, role, is_active, factions:faction_id ( faction_name, nation_id )')
            .eq('org_id', orgId)
            .eq('is_active', true);
        ipoAllMembers = members || [];
        ipoVoteMembers = ipoAllMembers.filter(m => m.role === 'member');

    } catch (e) {
        console.error('[IPO Votes] Load exception:', e);
    }

    renderIPOVotesPanel();

    // Subscribe to realtime changes on votes, ballots, and members
    if (ipoVotesChannel) {
        _supabase.removeChannel(ipoVotesChannel);
        ipoVotesChannel = null;
    }
    ipoVotesChannel = _supabase
        .channel('ipo_org_' + orgId)
        .on('postgres_changes', {
            event: '*',
            schema: 'public',
            table: 'ipo_votes',
            filter: 'org_id=eq.' + orgId
        }, () => { loadIPOVotes(orgId).then(() => renderIPOActionsPanel()); })
        .on('postgres_changes', {
            event: 'INSERT',
            schema: 'public',
            table: 'ipo_ballots'
        }, () => { loadIPOVotes(orgId); })
        .on('postgres_changes', {
            event: '*',
            schema: 'public',
            table: 'ipo_members',
            filter: 'org_id=eq.' + orgId
        }, () => { loadIPOVotes(orgId).then(() => renderIPOActionsPanel()); })
        .on('postgres_changes', {
            event: 'UPDATE',
            schema: 'public',
            table: 'international_orgs',
            filter: 'id=eq.' + orgId
        }, () => { renderIPOView(); })
        .subscribe();
}

/**
 * Render the votes panel content.
 */
/**
 * Tally an election's ballots by candidate. Returns { voteTally, abstainCount, winnerId, maxVotes }.
 * Tie-break: current president wins ties; else first candidate alphabetically.
 */
function tallyElectionBallots(ballots, currentPresidentId) {
    const voteTally = {};
    let abstainCount = 0;
    for (const b of ballots) {
        if (b.ballot === 'abstain') { abstainCount++; continue; }
        voteTally[b.ballot] = (voteTally[b.ballot] || 0) + 1;
    }
    let winnerId = null;
    let maxVotes = 0;
    for (const [candidateId, count] of Object.entries(voteTally)) {
        if (count > maxVotes || (count === maxVotes && candidateId === currentPresidentId)) {
            maxVotes = count;
            winnerId = candidateId;
        }
    }
    if (!winnerId) winnerId = currentPresidentId;
    return { voteTally, abstainCount, winnerId, maxVotes };
}

function renderIPOVotesPanel() {
    const container = document.getElementById('ipo-votes-body');
    if (!container) return;

    if (ipoVotes.length === 0) {
        container.innerHTML = '<div class="ipo-votes-empty">No votes yet. Use <strong>+ Propose</strong> to start one.</div>';
        return;
    }

    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    const org = membership?.org;
    const charter = org?.charter || {};
    const governance = charter.governance || {};
    const leadership = charter.leadership || {};
    const isSecret = governance.voteTransparency === 'secret';
    const isObserver = membership?.role === 'observer';

    // Sort: open first, then by tick desc
    const sorted = [...ipoVotes].sort((a, b) => {
        if (a.status === 'open' && b.status !== 'open') return -1;
        if (a.status !== 'open' && b.status === 'open') return 1;
        return b.opened_at_tick - a.opened_at_tick;
    });

    container.innerHTML = sorted.map(vote => {
        const ballots = ipoVoteBallots[vote.id] || [];
        const myBallot = ballots.find(b => b.faction_id === currentFaction.id);
        const isOpen = vote.status === 'open';
        const isPassed = vote.status === 'passed';
        const typeLabel = IPO_VOTE_TYPE_LABELS[vote.vote_type] || vote.vote_type;

        const isElection = vote.vote_type === 'leadership_election';
        const candidates = (vote.meta && vote.meta.candidates) || [];

        // Tally
        const totalEligible = ipoVoteMembers.length;
        const totalCast = ballots.length;
        let tallyBar = '';

        if (isElection) {
            // Candidate-based tally (use shared helper for counts)
            const { voteTally: candidateTally, abstainCount } = tallyElectionBallots(ballots, null);
            // Ensure all candidates appear even if they got 0 votes
            for (const c of candidates) { if (candidateTally[c.faction_id] === undefined) candidateTally[c.faction_id] = 0; }
            const candidateRows = candidates.map(c => {
                const count = candidateTally[c.faction_id] || 0;
                const pct = totalCast > 0 ? (count / totalCast * 100) : 0;
                return `<div class="ipo-election-candidate-row">
                    <span class="ipo-election-candidate-name">${escapeHtml(c.faction_name)}</span>
                    <div class="ipo-election-candidate-bar"><div class="ipo-election-candidate-fill" style="width:${pct}%"></div></div>
                    <span class="ipo-election-candidate-count">${count}</span>
                </div>`;
            }).join('');
            tallyBar = `<div class="ipo-vote-tally ipo-election-tally">
                ${candidateRows}
                <div class="ipo-vote-tally-labels">
                    <span class="ipo-vote-tally-label--abstain">${abstainCount} Abstain</span>
                    <span class="ipo-vote-tally-label--total">${totalCast}/${totalEligible}</span>
                </div>
            </div>`;
        } else {
            // Standard yes/no/abstain tally
            const yes = ballots.filter(b => b.ballot === 'yes').length;
            const no = ballots.filter(b => b.ballot === 'no').length;
            const abstain = ballots.filter(b => b.ballot === 'abstain').length;
            const yPct = totalCast > 0 ? (yes / totalCast * 100) : 0;
            const nPct = totalCast > 0 ? (no / totalCast * 100) : 0;
            const aPct = totalCast > 0 ? (abstain / totalCast * 100) : 0;
            tallyBar = `<div class="ipo-vote-tally">
                <div class="ipo-vote-tally-bar">
                    <div class="ipo-vote-tally-seg ipo-vote-tally-seg--yes" style="width:${yPct}%"></div>
                    <div class="ipo-vote-tally-seg ipo-vote-tally-seg--no" style="width:${nPct}%"></div>
                    <div class="ipo-vote-tally-seg ipo-vote-tally-seg--abstain" style="width:${aPct}%"></div>
                </div>
                <div class="ipo-vote-tally-labels">
                    <span class="ipo-vote-tally-label--yes">${yes} Yes</span>
                    <span class="ipo-vote-tally-label--no">${no} No</span>
                    <span class="ipo-vote-tally-label--abstain">${abstain} Abstain</span>
                    <span class="ipo-vote-tally-label--total">${totalCast}/${totalEligible}</span>
                </div>
            </div>`;
        }

        // Status badge
        let statusBadge;
        if (isOpen) {
            const ticksLeft = vote.closes_at_tick - shardTick;
            statusBadge = `<span class="ipo-vote-badge ipo-vote-badge--open">OPEN · ${ticksLeft > 0 ? ticksLeft + ' ticks left' : 'closing...'}</span>`;
        } else if (isPassed) {
            statusBadge = '<span class="ipo-vote-badge ipo-vote-badge--passed">PASSED</span>';
        } else {
            statusBadge = '<span class="ipo-vote-badge ipo-vote-badge--failed">FAILED</span>';
        }

        // Meta summary
        const metaSummary = renderVoteMetaSummary(vote);

        // Ballot buttons (only if open, member, and hasn't voted)
        let ballotHtml = '';
        if (isOpen && !isObserver) {
            if (myBallot) {
                if (isElection) {
                    const chosenCandidate = candidates.find(c => c.faction_id === myBallot.ballot);
                    const chosenLabel = myBallot.ballot === 'abstain' ? 'ABSTAIN' : (chosenCandidate?.faction_name || myBallot.ballot);
                    ballotHtml = `<div class="ipo-vote-my-ballot">Your vote: <strong>${escapeHtml(chosenLabel)}</strong></div>`;
                } else {
                    ballotHtml = `<div class="ipo-vote-my-ballot">Your vote: <strong>${myBallot.ballot.toUpperCase()}</strong></div>`;
                }
            } else if (isElection) {
                const candidateBtns = candidates.map(c =>
                    `<button class="ipo-vote-btn ipo-vote-btn--candidate" onclick="selectIPOBallot('${vote.id}','${c.faction_id}')" data-candidate-name="${escapeHtml(c.faction_name)}">${escapeHtml(c.faction_name)}</button>`
                ).join('');
                ballotHtml = `
                    <div class="ipo-vote-ballot-row ipo-election-ballot-row" id="ipo-ballot-row-${vote.id}">
                        ${candidateBtns}
                        <button class="ipo-vote-btn ipo-vote-btn--abstain" onclick="selectIPOBallot('${vote.id}','abstain')">Abstain</button>
                    </div>
                    <div class="ipo-vote-confirm-row" id="ipo-ballot-confirm-${vote.id}" style="display:none">
                        <span class="ipo-vote-confirm-label">Vote for <strong id="ipo-ballot-choice-${vote.id}"></strong>?</span>
                        <button class="ipo-vote-btn ipo-vote-btn--confirm" onclick="confirmIPOBallot('${vote.id}')">Confirm</button>
                        <button class="ipo-vote-btn ipo-vote-btn--cancel" onclick="cancelIPOBallot('${vote.id}')">Cancel</button>
                    </div>`;
            } else {
                ballotHtml = `
                    <div class="ipo-vote-ballot-row" id="ipo-ballot-row-${vote.id}">
                        <button class="ipo-vote-btn ipo-vote-btn--yes" onclick="selectIPOBallot('${vote.id}','yes')">Yes</button>
                        <button class="ipo-vote-btn ipo-vote-btn--no" onclick="selectIPOBallot('${vote.id}','no')">No</button>
                        <button class="ipo-vote-btn ipo-vote-btn--abstain" onclick="selectIPOBallot('${vote.id}','abstain')">Abstain</button>
                    </div>
                    <div class="ipo-vote-confirm-row" id="ipo-ballot-confirm-${vote.id}" style="display:none">
                        <span class="ipo-vote-confirm-label">Vote <strong id="ipo-ballot-choice-${vote.id}"></strong>?</span>
                        <button class="ipo-vote-btn ipo-vote-btn--confirm" onclick="confirmIPOBallot('${vote.id}')">Confirm</button>
                        <button class="ipo-vote-btn ipo-vote-btn--cancel" onclick="cancelIPOBallot('${vote.id}')">Cancel</button>
                    </div>`;
            }
        }

        // Voter breakdown (public ballot only, for resolved or if voted)
        let voterBreakdown = '';
        if (!isSecret && ballots.length > 0 && (!isOpen || myBallot)) {
            if (isElection) {
                voterBreakdown = '<div class="ipo-vote-voters">' + ballots.map(b => {
                    const member = ipoVoteMembers.find(m => m.faction_id === b.faction_id);
                    const voterName = member?.factions?.faction_name || 'Unknown';
                    if (b.ballot === 'abstain') {
                        return `<span class="ipo-vote-voter ipo-vote-voter--abstain">${escapeHtml(voterName)}: Abstain</span>`;
                    }
                    const chosenCandidate = candidates.find(c => c.faction_id === b.ballot);
                    const candidateName = chosenCandidate?.faction_name || 'Unknown';
                    return `<span class="ipo-vote-voter ipo-vote-voter--yes">${escapeHtml(voterName)} → ${escapeHtml(candidateName)}</span>`;
                }).join('') + '</div>';
            } else {
                voterBreakdown = '<div class="ipo-vote-voters">' + ballots.map(b => {
                    const member = ipoVoteMembers.find(m => m.faction_id === b.faction_id);
                    const name = member?.factions?.faction_name || 'Unknown';
                    return `<span class="ipo-vote-voter ipo-vote-voter--${b.ballot}">${escapeHtml(name)}: ${b.ballot}</span>`;
                }).join('') + '</div>';
            }
        }

        // Resolve button — show if open and all members voted OR closes_at_tick reached
        let resolveBtn = '';
        if (isOpen && !isObserver && (totalCast >= totalEligible || shardTick >= vote.closes_at_tick)) {
            resolveBtn = `<button class="ipo-vote-btn ipo-vote-btn--resolve" onclick="resolveIPOVote('${vote.id}')">Resolve Vote</button>`;
        }

        return `
            <div class="ipo-vote-card ${isOpen ? 'ipo-vote-card--open' : ''} ${isPassed ? 'ipo-vote-card--passed' : ''} ${vote.status === 'failed' ? 'ipo-vote-card--failed' : ''}">
                <div class="ipo-vote-card-header">
                    <span class="ipo-vote-type-badge">${typeLabel}</span>
                    ${statusBadge}
                </div>
                <div class="ipo-vote-card-title">${escapeHtml(vote.title)}</div>
                ${metaSummary}
                ${tallyBar}
                ${voterBreakdown}
                ${ballotHtml}
                ${resolveBtn}
            </div>`;
    }).join('');
}

/**
 * Render a short summary line based on vote meta.
 */
function renderVoteMetaSummary(vote) {
    const meta = vote.meta || {};
    let text = '';
    switch (vote.vote_type) {
        case 'membership': {
            const name = meta.target_faction_name || 'a party';
            const role = meta.requested_role === 'observer' ? 'an observer' : 'a member';
            text = `Admit <strong>${escapeHtml(name)}</strong> as ${role}.`;
            break;
        }
        case 'expulsion': {
            const name = meta.target_faction_name || 'a member';
            text = `Expel <strong>${escapeHtml(name)}</strong> from the organisation.`;
            break;
        }
        case 'joint_statement':
            if (meta.statement_text) {
                const escaped = escapeHtml(meta.statement_text);
                if (meta.statement_text.length > 120) {
                    const preview = escapeHtml(meta.statement_text.substring(0, 120));
                    text = `<div class="ipo-statement-text">
                        <span class="ipo-statement-preview">"${preview}…"</span>
                        <span class="ipo-statement-full">"${escaped}"</span>
                        <button class="ipo-statement-toggle" onclick="this.parentElement.classList.toggle('expanded'); this.textContent = this.parentElement.classList.contains('expanded') ? 'Show less' : 'Read more'">Read more</button>
                    </div>`;
                } else {
                    text = `"${escaped}"`;
                }
            }
            break;
        case 'fund_draw':
            text = `<strong>${escapeHtml(meta.proposer_name || 'A member')}</strong> requests <strong>${meta.amount_requested || 0} AP</strong> from the solidarity fund.`;
            if (meta.purpose) text += `<br><span style="color:var(--text-muted);font-size:0.8em;">Purpose: ${escapeHtml(meta.purpose)}</span>`;
            break;
        case 'charter_amendment':
            text = `Amend <strong>${meta.article_type || 'charter'}</strong>: ${escapeHtml((meta.description || '').substring(0, 100))}`;
            break;
        case 'change_headquarters':
            text = `Relocate HQ to <strong>${escapeHtml(meta.proposed_nation_name || 'a new nation')}</strong>.`;
            break;
        case 'symposium':
            text = `Hold symposium in <strong>${escapeHtml(meta.target_nation_name || 'a nation')}</strong> (${meta.axis || 'ideology'} ${meta.direction || ''}).`;
            break;
        case 'leadership_election': {
            const numCandidates = (meta.candidates || []).length;
            text = `Elect the next president from <strong>${numCandidates}</strong> candidate${numCandidates !== 1 ? 's' : ''}.`;
            break;
        }
    }
    return text ? `<div class="ipo-vote-meta-summary">${text}</div>` : '';
}

// ── Vote Creation Modal ──

let ipoVoteModalType = null;

function openIPOVoteModal() {
    if (!currentFaction || !ipoSelectedOrgId) return;
    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    if (!membership || membership.role === 'observer') return;

    ipoVoteModalType = null;
    const modal = document.getElementById('ipo-create-modal');
    modal.classList.add('active');
    renderIPOVoteModalTypeSelect();
}

function closeIPOVoteModal() {
    document.getElementById('ipo-create-modal').classList.remove('active');
    ipoVoteModalType = null;
}

function renderIPOVoteModalTypeSelect() {
    const inner = document.getElementById('ipo-create-modal-inner');
    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    const org = membership?.org;
    const charter = org?.charter || {};

    // Determine which vote types are available
    const available = [];
    // membership — only if admission is 'vote'
    if ((charter.membership?.admission || 'vote') === 'vote') {
        available.push('membership');
    }
    // expulsion — only if expulsion clause allows voting
    if (charter.membership?.expulsionClause === 'majority' || charter.membership?.expulsionClause === 'unanimous') {
        available.push('expulsion');
    }
    // joint_statement — only if clause is 'vote'
    if ((charter.resources?.jointStatementClause || 'vote') === 'vote') {
        available.push('joint_statement');
    }
    // fund_draw — only if solidarity fund is enabled
    if (charter.resources?.solidarityFund?.enabled) {
        available.push('fund_draw');
    }
    // charter_amendment — always available
    available.push('charter_amendment');
    // change_headquarters — always available
    available.push('change_headquarters');
    // symposium — only if not on cooldown and no pending symposium
    if ((org.symposium_cooldown_remaining || 0) <= 0 && !org.pending_symposium) {
        available.push('symposium');
    }

    const typeCards = available.map(t => `
        <button class="ipo-vote-type-card" onclick="selectIPOVoteType('${t}')">
            <span class="ipo-vote-type-card-label">${IPO_VOTE_TYPE_LABELS[t]}</span>
            <span class="ipo-vote-type-card-desc">${IPO_VOTE_TYPE_DESCRIPTIONS[t]}</span>
        </button>
    `).join('');

    inner.innerHTML = `
        <div class="ipo-modal-header">
            <span class="ipo-modal-title">Propose a Vote</span>
            <button class="modal-close" onclick="closeIPOVoteModal()">&times;</button>
        </div>
        <div class="ipo-modal-body">
            <div class="ipo-vote-type-grid">${typeCards}</div>
        </div>`;
}

async function selectIPOVoteType(type) {
    ipoVoteModalType = type;
    await renderIPOVoteModalForm();
}

async function renderIPOVoteModalForm() {
    const inner = document.getElementById('ipo-create-modal-inner');
    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    const org = membership?.org;
    const typeLabel = IPO_VOTE_TYPE_LABELS[ipoVoteModalType];

    let formFields = '';

    switch (ipoVoteModalType) {
        case 'membership': {
            // Fetch pending vote_pending invitations
            const { data: invites } = await _supabase
                .from('ipo_invitations')
                .select('id, target_faction_id, status, factions:target_faction_id ( faction_name )') // Fixed: was invited_faction_id
                .eq('org_id', ipoSelectedOrgId)
                .eq('status', 'vote_pending');
            const inviteOptions = (invites || []).map(inv =>
                `<option value="${inv.id}" data-name="${escapeHtml(inv.factions?.faction_name || 'Unknown')}" data-fid="${inv.target_faction_id}">${escapeHtml(inv.factions?.faction_name || 'Unknown')}</option>`
            ).join('');
            if (!inviteOptions) {
                formFields = '<div class="ipo-vote-form-note">No pending membership applications.</div>';
            } else {
                formFields = `
                    <label class="ipo-vote-form-label">Applicant</label>
                    <select id="ipo-vote-meta-invite" class="ipo-vote-form-select">${inviteOptions}</select>`;
            }
            break;
        }
        case 'expulsion': {
            const memberOptions = ipoAllMembers
                .filter(m => m.faction_id !== currentFaction.id)
                .map(m => {
                    const roleTag = m.role === 'observer' ? ' (Observer)' : '';
                    return `<option value="${m.faction_id}">${escapeHtml(m.factions?.faction_name || 'Unknown')}${roleTag}</option>`;
                })
                .join('');
            formFields = `
                <label class="ipo-vote-form-label">Member to Expel</label>
                <select id="ipo-vote-meta-target" class="ipo-vote-form-select">${memberOptions}</select>`;
            break;
        }
        case 'joint_statement':
            formFields = `
                <label class="ipo-vote-form-label">Statement Text</label>
                <textarea id="ipo-vote-meta-statement" class="ipo-vote-form-textarea" rows="4" maxlength="500" placeholder="Draft the statement text..."></textarea>
                <label class="ipo-vote-form-label">Visibility</label>
                <select id="ipo-vote-meta-visibility" class="ipo-vote-form-select">
                    <option value="public">Public — visible to all nations</option>
                    <option value="private">Private — organisation only</option>
                </select>`;
            break;
        case 'fund_draw': {
            const balance = org?.solidarity_fund_balance || 0;
            formFields = `
                <label class="ipo-vote-form-label">Amount (AP) · Fund Balance: ${balance} AP</label>
                <input type="number" id="ipo-vote-meta-amount" class="ipo-vote-form-input" min="1" max="${balance}" value="1" />
                <label class="ipo-vote-form-label">Purpose</label>
                <input type="text" id="ipo-vote-meta-purpose" class="ipo-vote-form-input" maxlength="200" placeholder="Describe the purpose..." />`;
            break;
        }
        case 'charter_amendment':
            formFields = `
                <label class="ipo-vote-form-label">Article to Amend</label>
                <select id="ipo-vote-meta-article" class="ipo-vote-form-select">
                    <option value="mission">Article I — Mission</option>
                    <option value="leadership">Article II — Leadership</option>
                    <option value="membership">Article III — Membership</option>
                    <option value="governance">Article IV — Governance</option>
                    <option value="resources">Article V — Resources</option>
                </select>
                <label class="ipo-vote-form-label">Description of Changes</label>
                <textarea id="ipo-vote-meta-desc" class="ipo-vote-form-textarea" rows="3" maxlength="500" placeholder="Describe the proposed changes..."></textarea>`;
            break;
        case 'change_headquarters': {
            const { data: nations } = await _supabase.from('nations').select('id, name').order('name');
            const nationOpts = (nations || []).map(n => `<option value="${n.id}">${escapeHtml(n.name)}</option>`).join('');
            formFields = `
                <label class="ipo-vote-form-label">New Headquarters Nation</label>
                <select id="ipo-vote-meta-nation" class="ipo-vote-form-select">${nationOpts}</select>`;
            break;
        }
        case 'symposium': {
            const { data: nations } = await _supabase.from('nations').select('id, name').order('name');
            const nationOpts = (nations || []).map(n => `<option value="${n.id}">${escapeHtml(n.name)}</option>`).join('');
            formFields = `
                <label class="ipo-vote-form-label">Target Nation</label>
                <select id="ipo-vote-meta-nation" class="ipo-vote-form-select">${nationOpts}</select>
                <label class="ipo-vote-form-label">Ideology Axis</label>
                <select id="ipo-vote-meta-axis" class="ipo-vote-form-select">
                    <option value="economic">Economic</option>
                    <option value="social">Social</option>
                    <option value="foreign">Foreign Policy</option>
                </select>
                <label class="ipo-vote-form-label">Direction</label>
                <select id="ipo-vote-meta-direction" class="ipo-vote-form-select">
                    <option value="left">Left / Progressive / Dovish</option>
                    <option value="right">Right / Conservative / Hawkish</option>
                </select>`;
            break;
        }
    }

    // Title field (auto-generated but editable)
    const defaultTitle = `${typeLabel} Vote`;

    inner.innerHTML = `
        <div class="ipo-modal-header">
            <span class="ipo-modal-title">Propose: ${typeLabel}</span>
            <button class="modal-close" onclick="closeIPOVoteModal()">&times;</button>
        </div>
        <div class="ipo-modal-body">
            <label class="ipo-vote-form-label">Vote Title</label>
            <input type="text" id="ipo-vote-title" class="ipo-vote-form-input" value="${defaultTitle}" maxlength="120" />
            ${formFields}
            <div class="wizard-nav" style="margin-top:16px;">
                <button class="wizard-back-btn" onclick="renderIPOVoteModalTypeSelect()">Back</button>
                <button class="ipo-btn ipo-btn--create-large" onclick="submitIPOVote()">Propose Vote</button>
            </div>
        </div>`;
}

/**
 * Submit a new vote proposal.
 */
async function submitIPOVote() {
    if (_ipoActionLock) return;
    if (!currentFaction || !ipoSelectedOrgId || !ipoVoteModalType) return;

    const title = document.getElementById('ipo-vote-title')?.value?.trim();
    if (!title) { alert('Please enter a vote title.'); return; }

    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    const org = membership?.org;

    // Build meta based on vote type
    const meta = {};
    switch (ipoVoteModalType) {
        case 'membership': {
            const sel = document.getElementById('ipo-vote-meta-invite');
            if (!sel || !sel.value) { alert('No applicant selected.'); return; }
            meta.invite_id = sel.value;
            meta.target_faction_id = sel.selectedOptions[0]?.dataset.fid || null;
            meta.target_faction_name = sel.selectedOptions[0]?.dataset.name || 'Unknown';
            break;
        }
        case 'expulsion': {
            const sel = document.getElementById('ipo-vote-meta-target');
            if (!sel || !sel.value) { alert('No member selected.'); return; }
            meta.target_faction_id = sel.value;
            const member = ipoVoteMembers.find(m => m.faction_id === sel.value);
            meta.target_faction_name = member?.factions?.faction_name || 'Unknown';
            break;
        }
        case 'joint_statement': {
            const stmt = document.getElementById('ipo-vote-meta-statement')?.value?.trim();
            if (!stmt) { alert('Please write the statement text.'); return; }
            meta.statement_text = stmt;
            meta.visibility = document.getElementById('ipo-vote-meta-visibility')?.value || 'public';
            break;
        }
        case 'fund_draw': {
            const amount = parseInt(document.getElementById('ipo-vote-meta-amount')?.value);
            if (!amount || amount < 1) { alert('Enter a valid amount.'); return; }
            const balance = org?.solidarity_fund_balance || 0;
            if (amount > balance) { alert('Amount exceeds fund balance.'); return; }
            meta.amount_requested = amount;
            meta.proposer_name = currentFaction.faction_name;
            meta.purpose = document.getElementById('ipo-vote-meta-purpose')?.value?.trim() || '';
            break;
        }
        case 'charter_amendment': {
            meta.article_type = document.getElementById('ipo-vote-meta-article')?.value || 'mission';
            meta.description = document.getElementById('ipo-vote-meta-desc')?.value?.trim() || '';
            if (!meta.description) { alert('Please describe the proposed changes.'); return; }
            break;
        }
        case 'change_headquarters': {
            const sel = document.getElementById('ipo-vote-meta-nation');
            if (!sel || !sel.value) { alert('Select a nation.'); return; }
            meta.proposed_nation_id = sel.value;
            meta.proposed_nation_name = sel.selectedOptions[0]?.textContent || '';
            break;
        }
        case 'symposium': {
            const sel = document.getElementById('ipo-vote-meta-nation');
            if (!sel || !sel.value) { alert('Select a target nation.'); return; }
            meta.target_nation_id = sel.value;
            meta.target_nation_name = sel.selectedOptions[0]?.textContent || '';
            meta.axis = document.getElementById('ipo-vote-meta-axis')?.value || 'economic';
            meta.direction = document.getElementById('ipo-vote-meta-direction')?.value || 'left';
            break;
        }
    }

    _ipoActionLock = true;
    try {
        if (!await _checkOpenVoteLimit(ipoSelectedOrgId)) {
            alert(`This organisation already has ${IPO_MAX_OPEN_VOTES} open votes. Wait for some to close before proposing new ones.`);
            return;
        }
        const { error } = await _supabase.from('ipo_votes').insert({
            org_id: ipoSelectedOrgId,
            title: title,
            vote_type: ipoVoteModalType,
            meta: meta,
            status: 'open',
            opened_at_tick: shardTick,
            closes_at_tick: shardTick + IPO_VOTE_DURATION,
            proposed_by: currentFaction.id
        });

        if (error) {
            console.error('[IPO Vote] Insert error:', error);
            alert('Failed to propose vote: ' + error.message);
            return;
        }

        // System chat message
        await _supabase.from('ipo_chat').insert({
            org_id: ipoSelectedOrgId,
            faction_id: null,
            is_system: true,
            message_text: `${currentFaction.faction_name} proposed a vote: ${title}`,
            tick_posted: shardTick
        });

        closeIPOVoteModal();
        await loadIPOVotes(ipoSelectedOrgId);
    } catch (e) {
        console.error('[IPO Vote] Submit exception:', e);
        alert('Failed to propose vote.');
    } finally {
        _ipoActionLock = false;
    }
}

// ── Ballot Casting ──

let _pendingBallot = {};  // { voteId: ballotValue }

function selectIPOBallot(voteId, ballotValue) {
    _pendingBallot[voteId] = ballotValue;
    const row = document.getElementById(`ipo-ballot-row-${voteId}`);
    const confirm = document.getElementById(`ipo-ballot-confirm-${voteId}`);
    const choiceEl = document.getElementById(`ipo-ballot-choice-${voteId}`);
    if (row) row.style.display = 'none';
    if (confirm) confirm.style.display = 'flex';
    if (choiceEl) {
        // For leadership elections, show candidate name instead of raw ID
        const btn = row?.querySelector(`[onclick*="'${ballotValue}'"]`);
        const candidateName = btn?.getAttribute('data-candidate-name');
        choiceEl.textContent = candidateName || ballotValue.toUpperCase();
        choiceEl.className = candidateName ? 'ipo-vote-choice--candidate' : `ipo-vote-choice--${ballotValue}`;
    }
}

function cancelIPOBallot(voteId) {
    delete _pendingBallot[voteId];
    const row = document.getElementById(`ipo-ballot-row-${voteId}`);
    const confirm = document.getElementById(`ipo-ballot-confirm-${voteId}`);
    if (row) row.style.display = 'flex';
    if (confirm) confirm.style.display = 'none';
}

async function confirmIPOBallot(voteId) {
    const ballotValue = _pendingBallot[voteId];
    if (!ballotValue) return;
    delete _pendingBallot[voteId];
    await castIPOBallot(voteId, ballotValue);
}

/**
 * Cast a ballot on an open vote.
 */
async function castIPOBallot(voteId, ballotValue) {
    if (_ipoActionLock) return;
    if (!currentFaction || !ipoSelectedOrgId) return;

    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    if (!membership || membership.role === 'observer') return;

    const org = membership.org;
    const charter = org?.charter || {};
    const isSecret = charter.governance?.voteTransparency === 'secret';

    _ipoActionLock = true;
    try {
        const insertData = {
            vote_id: voteId,
            ballot: ballotValue,
            cast_at_tick: shardTick
        };

        // Always store faction_id for DB uniqueness enforcement.
        // For secret ballots, the UI hides voter identity (breakdown not shown).
        insertData.faction_id = currentFaction.id;

        const { error } = await _supabase.from('ipo_ballots').insert(insertData);

        if (error) {
            console.error('[IPO Ballot] Insert error:', error);
            if (error.code === '23505') {
                alert('You have already voted on this measure.');
            } else {
                alert('Failed to cast ballot: ' + error.message);
            }
            return;
        }

        // Post ballot to chat (secret ballots show "a member voted", public show faction name)
        const voteForChat = ipoVotes.find(v => v.id === voteId);
        const voteTitle = voteForChat?.title || 'a vote';
        let ballotLabel;
        if (voteForChat?.vote_type === 'leadership_election' && ballotValue !== 'abstain') {
            const candidates = (voteForChat.meta && voteForChat.meta.candidates) || [];
            const chosen = candidates.find(c => c.faction_id === ballotValue);
            ballotLabel = `for ${chosen?.faction_name || 'a candidate'}`;
        } else {
            ballotLabel = ballotValue === 'yes' ? 'YES' : ballotValue === 'no' ? 'NO' : 'ABSTAIN';
        }
        if (isSecret) {
            await _supabase.from('ipo_chat').insert({
                org_id: ipoSelectedOrgId, faction_id: null, is_system: true,
                message_text: `A member cast a ballot on "${voteTitle}".`,
                tick_posted: shardTick
            });
        } else {
            await _supabase.from('ipo_chat').insert({
                org_id: ipoSelectedOrgId, faction_id: null, is_system: true,
                message_text: `${currentFaction.faction_name} voted ${ballotLabel} on "${voteTitle}".`,
                tick_posted: shardTick
            });
        }

        // President-decides: if this is a membership vote with president_decides flag,
        // and the president just voted yes, auto-resolve immediately (admit the member)
        const vote = voteForChat;
        if (vote && vote.meta?.president_decides && org.president_id === currentFaction.id && (ballotValue === 'yes' || ballotValue === 'no')) {
            const approved = ballotValue === 'yes';
            try {
                await _supabase.from('ipo_votes').update({
                    status: approved ? 'passed' : 'failed',
                    result: { yes: approved ? 1 : 0, no: approved ? 0 : 1, abstain: 0, passed: approved, president_approved: approved },
                    resolved_at_tick: shardTick
                }).eq('id', voteId).eq('status', 'open');

                if (approved) {
                    await applyVoteEffects(vote, org);
                }

                await _supabase.from('ipo_chat').insert({
                    org_id: ipoSelectedOrgId,
                    faction_id: null,
                    is_system: true,
                    message_text: approved
                        ? `The President has approved the admission of ${vote.meta.target_faction_name || 'a faction'}.`
                        : `The President has denied the admission of ${vote.meta.target_faction_name || 'a faction'}.`,
                    tick_posted: shardTick
                });
            } catch (resolveErr) {
                console.error('[IPO] President auto-resolve failed:', resolveErr);
            }
        }

        // Reload votes to reflect the new ballot
        await loadIPOVotes(ipoSelectedOrgId);
    } catch (e) {
        console.error('[IPO Ballot] Cast exception:', e);
        alert('Failed to cast ballot.');
    } finally {
        _ipoActionLock = false;
    }
}

// ── Vote Resolution ──

/**
 * Resolve an open vote: tally ballots, check threshold + veto, update result.
 */
async function resolveIPOVote(voteId) {
    if (_ipoActionLock) return;
    if (!currentFaction || !ipoSelectedOrgId) return;

    const vote = ipoVotes.find(v => v.id === voteId);
    if (!vote || vote.status !== 'open') return;
    if (!confirm(`Resolve vote "${vote.title}"? This will tally ballots and determine the outcome.`)) return;

    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    const org = membership?.org;
    const charter = org?.charter || {};
    const leadership = charter.leadership || {};
    const governance = charter.governance || {};
    const votePass = leadership.votePass || 'majority';

    // Tally ballots
    const ballots = ipoVoteBallots[voteId] || [];
    const totalEligible = ipoVoteMembers.length;
    const isElection = vote.vote_type === 'leadership_election';

    let result, newStatus;

    if (isElection) {
        // Candidate-based tally (shared helper)
        const { voteTally, abstainCount, winnerId, maxVotes } = tallyElectionBallots(ballots, org.president_id);

        result = { tally: voteTally, winner: winnerId, abstain: abstainCount, total_ballots: ballots.length };
        newStatus = 'passed'; // Elections always "pass" — they produce a winner

        _ipoActionLock = true;
        try {
            const { error, data } = await _supabase
                .from('ipo_votes')
                .update({ status: newStatus, result, resolved_at_tick: shardTick })
                .eq('id', voteId)
                .eq('status', 'open')
                .select();

            if (error) {
                console.error('[IPO Vote] Resolve error:', error);
                alert('Failed to resolve vote: ' + error.message);
                return;
            }
            if (!data || data.length === 0) {
                alert('Could not resolve vote. It may have already been resolved, or you may lack permission.');
                await loadIPOVotes(ipoSelectedOrgId);
                return;
            }

            // Update president
            // NOTE: RLS on international_orgs may block client-side updates if
            // president_id column doesn't match auth.uid(). The auto-resolution
            // in advance-tick (service role) handles this reliably as a fallback.
            const { error: presErr } = await _supabase.from('international_orgs')
                .update({ president_id: winnerId, president_term_start_tick: shardTick })
                .eq('id', org.id);
            if (presErr) console.error('[IPO Vote] President update error (may be RLS):', presErr);

            const candidates = (vote.meta && vote.meta.candidates) || [];
            const winnerCandidate = candidates.find(c => c.faction_id === winnerId);
            const winnerName = winnerCandidate?.faction_name || 'Unknown';

            await _supabase.from('ipo_chat').insert({
                org_id: ipoSelectedOrgId, faction_id: null, is_system: true,
                message_text: `Leadership Election Result: ${winnerName} elected president with ${maxVotes} vote${maxVotes !== 1 ? 's' : ''} (${ballots.length} total ballots).`,
                tick_posted: shardTick
            });

            await loadIPOVotes(ipoSelectedOrgId);
        } catch (e) {
            console.error('[IPO Vote] Resolve exception:', e);
            alert('Failed to resolve vote.');
        } finally {
            _ipoActionLock = false;
        }
        return;
    }

    // Standard yes/no/abstain tally
    const yes = ballots.filter(b => b.ballot === 'yes').length;
    const no = ballots.filter(b => b.ballot === 'no').length;
    const abstain = ballots.filter(b => b.ballot === 'abstain').length;

    // Determine if passed
    const totalCast = yes + no + abstain;
    let passed = false;
    if (totalCast === 0) {
        passed = false;
    } else if (votePass === 'unanimous') {
        passed = yes === totalCast && no === 0;
    } else {
        passed = (yes / totalCast) > 0.5;
    }

    // Veto check
    if (passed && governance.vetoRight) {
        const vetoHolderId = getVetoHolder(org, governance.vetoRight);
        if (vetoHolderId) {
            const vetoBallot = ballots.find(b => b.faction_id === vetoHolderId);
            if (vetoBallot && vetoBallot.ballot === 'no') {
                passed = false;
            }
        }
    }

    // For expulsion votes, check the expulsion clause threshold too
    if (vote.vote_type === 'expulsion' && totalEligible > 0) {
        const expClause = charter.membership?.expulsionClause;
        if (expClause === 'unanimous') {
            passed = yes === totalEligible && no === 0;
        }
    }

    result = { yes, no, abstain, passed };
    newStatus = passed ? 'passed' : 'failed';

    _ipoActionLock = true;
    try {
        const { error, data } = await _supabase
            .from('ipo_votes')
            .update({ status: newStatus, result: result, resolved_at_tick: shardTick })
            .eq('id', voteId)
            .eq('status', 'open')
            .select();

        if (error) {
            console.error('[IPO Vote] Resolve error:', error);
            alert('Failed to resolve vote: ' + error.message);
            return;
        }

        if (!data || data.length === 0) {
            alert('Could not resolve vote. It may have already been resolved, or you may lack permission. Please refresh the page and try again.');
            await loadIPOVotes(ipoSelectedOrgId);
            return;
        }

        if (passed) {
            try {
                await applyVoteEffects(vote, org);
            } catch (effectErr) {
                console.error('[IPO Vote] Effect application error:', effectErr);
            }
        }

        // Reject membership invite if vote failed
        if (!passed && vote.vote_type === 'membership' && vote.meta?.invite_id) {
            await _supabase.from('ipo_invitations')
                .update({ status: 'declined', responded_at_tick: shardTick })
                .eq('id', vote.meta.invite_id);
        }

        const outcomeText = passed ? 'PASSED' : 'FAILED';
        await _supabase.from('ipo_chat').insert({
            org_id: ipoSelectedOrgId, faction_id: null, is_system: true,
            message_text: `Vote "${vote.title}" has ${outcomeText} (${yes}Y / ${no}N / ${abstain}A).`,
            tick_posted: shardTick
        });

        await loadIPOVotes(ipoSelectedOrgId);
    } catch (e) {
        console.error('[IPO Vote] Resolve exception:', e);
        alert('Failed to resolve vote.');
    } finally {
        _ipoActionLock = false;
    }
}

/**
 * Get the faction ID of whoever holds veto power.
 */
function getVetoHolder(org, vetoRight) {
    switch (vetoRight) {
        case 'president': return org.president_id;
        case 'founding': return org.founding_party_id;
        case 'hq': {
            // The member party whose nation matches the HQ nation
            if (!org.headquarters_nation_id) return null;
            const hqMember = ipoVoteMembers.find(m => m.factions?.nation_id === org.headquarters_nation_id);
            return hqMember?.faction_id || null;
        }
        default: return null;
    }
}

/**
 * Apply side-effects when a vote passes.
 */
async function applyVoteEffects(vote, org) {
    const meta = vote.meta || {};

    switch (vote.vote_type) {
        case 'membership': {
            if (!meta.target_faction_id) break;

            // If invite-based, mark the invitation as accepted
            if (meta.invite_id) {
                await _supabase.from('ipo_invitations')
                    .update({ status: 'accepted', responded_at_tick: shardTick })
                    .eq('id', meta.invite_id);
            }

            const admitRole = meta.requested_role || 'member';
            const chatColor = await assignIPOChatColor(ipoSelectedOrgId);

            let factionsToAdmit = [{ id: meta.target_faction_id, name: meta.target_faction_name }];

            for (const f of factionsToAdmit) {
                const color = await assignIPOChatColor(ipoSelectedOrgId);
                await _supabase.from('ipo_members').insert({
                    org_id: ipoSelectedOrgId,
                    faction_id: f.id,
                    role: admitRole,
                    joined_at_tick: shardTick,
                    chat_color: color
                });
            }

            const admitMsg = `${meta.target_faction_name || 'A new party'} has been admitted as ${admitRole === 'observer' ? 'an observer' : 'a member'}.`;
            await _supabase.from('ipo_chat').insert({
                org_id: ipoSelectedOrgId,
                faction_id: null,
                is_system: true,
                message_text: admitMsg,
                tick_posted: shardTick
            });
            break;
        }
        case 'expulsion': {
            if (meta.target_faction_id) {
                await _supabase.from('ipo_members')
                    .update({ is_active: false, left_at_tick: shardTick })
                    .eq('org_id', ipoSelectedOrgId)
                    .eq('faction_id', meta.target_faction_id)
                    .eq('is_active', true);

                await _supabase.from('ipo_chat').insert({
                    org_id: ipoSelectedOrgId,
                    faction_id: null,
                    is_system: true,
                    message_text: `${meta.target_faction_name || 'A member'} has been expelled from the organisation.`,
                    tick_posted: shardTick
                });

                // If the expelled member was the president, auto-succeed to next member
                if (org.president_id === meta.target_faction_id) {
                    const remaining = ipoVoteMembers.filter(m => m.faction_id !== meta.target_faction_id);
                    if (remaining.length > 0) {
                        const newPresId = remaining[0].faction_id;
                        await _supabase.from('international_orgs')
                            .update({ president_id: newPresId, president_term_start_tick: shardTick })
                            .eq('id', ipoSelectedOrgId);
                        const newPresName = remaining[0].factions?.faction_name || 'A member';
                        await _supabase.from('ipo_chat').insert({
                            org_id: ipoSelectedOrgId,
                            faction_id: null,
                            is_system: true,
                            message_text: `${newPresName} is now president (previous president expelled).`,
                            tick_posted: shardTick
                        });
                    }
                }
            }
            break;
        }
        case 'fund_draw': {
            if (meta.amount_requested && meta.amount_requested > 0) {
                const currentBalance = org.solidarity_fund_balance || 0;
                const actualDraw = Math.min(meta.amount_requested, currentBalance);
                if (actualDraw <= 0) break;

                const newBalance = currentBalance - actualDraw;
                await _supabase.from('international_orgs')
                    .update({ solidarity_fund_balance: newBalance })
                    .eq('id', ipoSelectedOrgId);

                // Credit the drawn AP to the proposing faction
                if (vote.proposed_by) {
                    const { data: proposerFaction } = await _supabase
                        .from('factions').select('action_points').eq('id', vote.proposed_by).single();
                    if (proposerFaction) {
                        await _supabase.from('factions')
                            .update({ action_points: (proposerFaction.action_points || 0) + actualDraw })
                            .eq('id', vote.proposed_by);
                    }
                }

                await _supabase.from('ipo_fund_transactions').insert({
                    org_id: ipoSelectedOrgId,
                    faction_id: vote.proposed_by,
                    transaction_type: 'draw',
                    amount: -actualDraw,
                    description: meta.purpose || 'Fund draw',
                    tick: shardTick
                });

                await _supabase.from('ipo_chat').insert({
                    org_id: ipoSelectedOrgId,
                    faction_id: null,
                    is_system: true,
                    message_text: `Fund draw approved: ${actualDraw} AP withdrawn and credited. ${meta.purpose ? 'Purpose: ' + meta.purpose : ''}`,
                    tick_posted: shardTick
                });
            }
            break;
        }
        case 'change_headquarters': {
            if (meta.proposed_nation_id) {
                await _supabase.from('international_orgs')
                    .update({ headquarters_nation_id: meta.proposed_nation_id })
                    .eq('id', ipoSelectedOrgId);
            }
            break;
        }
        case 'joint_statement': {
            // Post the statement as a system chat message
            if (meta.statement_text) {
                const visibility = meta.visibility === 'private' ? ' (private)' : '';
                await _supabase.from('ipo_chat').insert({
                    org_id: ipoSelectedOrgId,
                    faction_id: null,
                    is_system: true,
                    message_text: `JOINT STATEMENT${visibility}: "${meta.statement_text}"`,
                    tick_posted: shardTick
                });

                // Log the action
                await _supabase.from('ipo_action_log').insert({
                    org_id: ipoSelectedOrgId,
                    faction_id: currentFaction.id,
                    action_type: 'joint_statement',
                    action_data: { statement_text: meta.statement_text, visibility: meta.visibility || 'public' },
                    ap_cost: 0,
                    performed_at_tick: shardTick
                });

                // Post to world events for every member nation (unless private)
                if (meta.visibility !== 'private') {
                    try {
                        const { data: members } = await _supabase.from('ipo_members')
                            .select('nation_id')
                            .eq('org_id', ipoSelectedOrgId);
                        const nationIds = [...new Set((members || []).map(m => m.nation_id).filter(Boolean))];
                        for (const nid of nationIds) {
                            await _supabase.from('event_log').insert({
                                nation_id: nid,
                                event_name: 'Joint Statement',
                                description_chosen: `${org.name || 'International Organisation'}: "${meta.statement_text}"`,
                                category: 'DIPLOMATIC',
                                fired_at_tick: shardTick
                            });
                        }
                    } catch (evErr) {
                        console.warn('[IPO] Joint statement event_log failed (non-blocking):', evErr);
                    }
                }
            }
            break;
        }
        case 'charter_amendment': {
            // Apply the proposed charter changes now that the vote passed
            const proposedCharter = meta.proposed_charter;
            if (proposedCharter) {
                const { error: charterErr } = await _supabase
                    .from('international_orgs')
                    .update({ charter: proposedCharter })
                    .eq('id', org.id);
                if (charterErr) console.error('[IPO] Charter amendment apply error:', charterErr);
            }

            // Apply logo changes if proposed
            const proposedLogo = meta.proposed_logo;
            if (proposedLogo) {
                const logoUpdate = {};
                if (proposedLogo.symbol !== undefined) logoUpdate.logo_symbol = proposedLogo.symbol;
                if (proposedLogo.text !== undefined) logoUpdate.logo_text = proposedLogo.text;
                if (proposedLogo.image_url !== undefined) logoUpdate.logo_image_url = proposedLogo.image_url;
                if (Object.keys(logoUpdate).length > 0) {
                    const { error: logoErr } = await _supabase
                        .from('international_orgs')
                        .update(logoUpdate)
                        .eq('id', org.id);
                    if (logoErr) console.error('[IPO] Logo amendment apply error:', logoErr);
                }
            }

            const changeSummary = [];
            if (proposedCharter) changeSummary.push('charter');
            if (proposedLogo) changeSummary.push('logo');

            await _supabase.from('ipo_chat').insert({
                org_id: ipoSelectedOrgId,
                faction_id: null,
                is_system: true,
                message_text: `Amendment approved and applied (${changeSummary.join(', ')}): "${(meta.description || '').substring(0, 200)}".`,
                tick_posted: shardTick
            });

            await _supabase.from('ipo_action_log').insert({
                org_id: ipoSelectedOrgId,
                faction_id: currentFaction.id,
                action_type: 'charter_amendment',
                action_data: { description: meta.description, proposed_charter: proposedCharter, proposed_logo: proposedLogo },
                ap_cost: 1,
                performed_at_tick: shardTick
            });
            break;
        }
        case 'symposium': {
            // Set pending_symposium on the org — fires after a cooldown
            const SYMPOSIUM_DELAY = 4; // ticks until effect fires
            const SYMPOSIUM_COOLDOWN = 20; // ticks before next symposium allowed
            const SYMPOSIUM_SHIFT = 3; // ideology shift amount

            const pendingSymposium = {
                targetNation: meta.target_nation_id,
                axis: meta.axis || 'economic',
                direction: meta.direction || 'left',
                ideologyShift: SYMPOSIUM_SHIFT,
                firesOnTick: shardTick + SYMPOSIUM_DELAY
            };

            await _supabase.from('international_orgs')
                .update({
                    pending_symposium: pendingSymposium,
                    symposium_cooldown_remaining: SYMPOSIUM_COOLDOWN
                })
                .eq('id', ipoSelectedOrgId);

            await _supabase.from('ipo_chat').insert({
                org_id: ipoSelectedOrgId,
                faction_id: null,
                is_system: true,
                message_text: `Symposium approved! Targeting ${meta.target_nation_name || 'a nation'} (${meta.axis} ${meta.direction}). Effect fires in ${SYMPOSIUM_DELAY} ticks.`,
                tick_posted: shardTick
            });

            await _supabase.from('ipo_action_log').insert({
                org_id: ipoSelectedOrgId,
                faction_id: currentFaction.id,
                action_type: 'symposium',
                action_data: pendingSymposium,
                ap_cost: 0,
                performed_at_tick: shardTick
            });
            break;
        }
    }
}
