async function renderRelationsBox() {
    const body = document.getElementById('relations-body');
    if (!body) return;
    body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading nations...</div></div>';

    if (!currentNation) {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">No nation data available.</div></div>';
        return;
    }

    try {
        const [nationsRes, relationsRes, ambassadorsRes, theirAmbassadorsRes, agreementsRes] = await Promise.all([
            _supabase.from('nations').select('*').order('name'),
            _supabase.from('diplomatic_relations').select('*')
                .or('nation_a_id.eq.' + currentNation.id + ',nation_b_id.eq.' + currentNation.id),
            _supabase.from('ambassadors').select('*, factions(abbreviation)')
                .eq('nation_id', currentNation.id).eq('is_active', true).eq('status', 'active'),
            _supabase.from('ambassadors').select('*, factions(abbreviation)')
                .eq('target_nation_id', currentNation.id).eq('is_active', true).eq('status', 'active'),
            _supabase.from('diplomatic_proposals').select('proposing_nation_id, target_nation_id')
                .eq('status', 'active')
                .or('proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + currentNation.id)
        ]);

        if (nationsRes.error) {
            body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Error loading nations.</div></div>';
            return;
        }

        const allNations = nationsRes.data || [];
        const allRelations = relationsRes.data || [];
        const ourAmbassadors = ambassadorsRes.data || [];
        const theirAmbassadors = theirAmbassadorsRes.data || [];
        const activeAgreements = agreementsRes.data || [];

        const otherNations = allNations.filter(n => n.id !== currentNation.id);
        cachedOtherNations = otherNations.map(n => ({ id: n.id, name: n.name }));
        const countEl = document.getElementById('relations-count');
        if (countEl) countEl.textContent = otherNations.length;

        if (otherNations.length === 0) {
            body.innerHTML = '<div class="empty-state"><div class="empty-state-text">No other nations found.</div></div>';
            return;
        }

        let html = '';
        for (const nation of otherNations) {
            const relation = allRelations.find(r =>
                (r.nation_a_id === currentNation.id && r.nation_b_id === nation.id) ||
                (r.nation_a_id === nation.id && r.nation_b_id === currentNation.id)
            );
            const score = relation?.relation_score ?? 35;
            const tier = getRelationTier(score, false);

            const ambassador = ourAmbassadors.find(a => a.target_nation_id === nation.id);
            const theirAmb = theirAmbassadors.find(a => a.nation_id === nation.id);

            // Embassy status
            let embassyClass = 'embassy-tag--none';
            let embassyLabel = 'No Embassy';
            if (ambassador && theirAmb) {
                embassyClass = 'embassy-tag--open';
                embassyLabel = 'Embassy Open';
            } else if (ambassador || theirAmb) {
                embassyClass = 'embassy-tag--closed';
                embassyLabel = 'Embassy Closed';
            }

            const agreementCount = activeAgreements.filter(a =>
                (a.proposing_nation_id === currentNation.id && a.target_nation_id === nation.id) ||
                (a.proposing_nation_id === nation.id && a.target_nation_id === currentNation.id)
            ).length;

            const dotColor = tierToDotColor(tier);
            const pillClass = tierToPillClass(tier);

            html += `
                <div class="nation-row" data-nation-id="${nation.id}" onclick="toggleRelationRow('${nation.id}')">
                    <div class="nation-dot" style="background:${dotColor}"></div>
                    <span class="nation-name" ${getNationMapColor(nation.name) ? 'style="color:' + getNationMapColor(nation.name) + '"' : ''}>${escapeHtml(nation.name)}</span>
                    <div class="nation-meta">
                        <span class="pill ${pillClass}">${tier.label}</span>
                        <span class="embassy-tag ${embassyClass}">${embassyLabel}</span>
                        ${agreementCount > 0 ? '<span class="agreements-count">' + agreementCount + ' treaty' + (agreementCount > 1 ? 's' : '') + '</span>' : ''}
                        <span class="expand-arrow">&#9654;</span>
                    </div>
                </div>
                <div class="nation-detail" id="nation-detail-${nation.id}" data-loaded="0">
                    <div class="empty-state"><div class="empty-state-text">Loading...</div></div>
                </div>
            `;
        }

        body.innerHTML = html;
    } catch (err) {
        console.error('Error rendering relations box:', err);
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Error loading nations.</div></div>';
    }
}

// ── Toggle nation row expand / collapse ──
async function toggleRelationRow(nationId) {
    const row = document.querySelector('.nation-row[data-nation-id="' + nationId + '"]');
    const detail = document.getElementById('nation-detail-' + nationId);
    if (!row || !detail) return;

    const wasExpanded = row.classList.contains('is-expanded');

    // Collapse all
    document.querySelectorAll('.nation-row.is-expanded').forEach(r => r.classList.remove('is-expanded'));

    if (wasExpanded) return; // just collapse

    // Expand this one
    row.classList.add('is-expanded');

    // Lazy-load detail content
    if (detail.dataset.loaded === '0') {
        detail.dataset.loaded = '1';
        await renderRelationDetail(nationId);
    }
}
window.toggleRelationRow = toggleRelationRow;

// ── Render nation detail panel ──
async function renderRelationDetail(nationId) {
    const detail = document.getElementById('nation-detail-' + nationId);
    if (!detail) return;

    try {
        const { data: targetNation } = await _supabase.from('nations').select('*').eq('id', nationId).single();
        if (!targetNation) { detail.innerHTML = '<div class="empty-state"><div class="empty-state-text">Nation not found.</div></div>'; return; }

        // Set module state for potential draft/initiative use
        selectedTargetNation = targetNation;

        const [relation, proposals, ambassador, theirAmbassador] = await Promise.all([
            fetchDiplomaticRelation(currentNation?.id, targetNation.id),
            fetchActiveProposals(currentNation?.id, targetNation.id),
            fetchAmbassador(currentNation?.id, targetNation.id),
            fetchAmbassador(targetNation.id, currentNation?.id)
        ]);

        const hasCeasefire = proposals.some(p => p.proposal_type === 'ceasefire');
        const score = relation?.relation_score ?? 35;
        const tier = getRelationTier(score, hasCeasefire);
        const barColor = getRelationBarColor(score);

        // Ambassador info
        const ambName = ambassador ? ((ambassador.ambassador_first_name || '') + ' ' + (ambassador.ambassador_last_name || '')).trim() : null;
        const ambParty = ambassador?.factions?.abbreviation ? ' (' + ambassador.factions.abbreviation + ')' : '';
        const theirAmbName = theirAmbassador ? ((theirAmbassador.ambassador_first_name || '') + ' ' + (theirAmbassador.ambassador_last_name || '')).trim() : null;
        const theirAmbParty = theirAmbassador?.factions?.abbreviation ? ' (' + theirAmbassador.factions.abbreviation + ')' : '';

        // Term expiry helper
        function ambTermStr(amb) {
            if (!amb || amb.appointed_at_tick == null) return '';
            const termLength = amb.term_length || 60;
            const ticksRemaining = Math.max(0, termLength - (shardTick - amb.appointed_at_tick));
            if (ticksRemaining === 0) return ' (Term Expired)';
            const months = ticksRemaining; // 1 tick = 1 month
            return ' (Term Expires in ' + months + ' Month' + (months !== 1 ? 's' : '') + ')';
        }

        let html = '<div class="detail-grid">';
        html += '<div><div class="detail-label">Our Ambassador' + ambTermStr(ambassador) + '</div><div class="detail-value">' + (ambName ? escapeHtml(ambName) + escapeHtml(ambParty) : 'None') + '</div></div>';
        html += '<div><div class="detail-label">Their Ambassador' + ambTermStr(theirAmbassador) + '</div><div class="detail-value">' + (theirAmbName ? escapeHtml(theirAmbName) + escapeHtml(theirAmbParty) : 'None') + '</div></div>';
        html += '<div><div class="detail-label">Population</div><div class="detail-value">' + formatNumber(targetNation.population) + '</div></div>';
        html += '<div><div class="detail-label">Stability</div><div class="detail-value">' + (targetNation.stability ?? '—') + '%</div></div>';
        html += '</div>';

        // Relation bar
        const barWidth = Math.max(0, Math.min(100, score));
        html += `
            <div class="relation-bar-label"><span>${tier.label}</span><span>${score}/100</span></div>
            <div class="relation-bar-track">
                <div class="relation-bar-center"></div>
                <div class="relation-bar-fill" style="width:${barWidth}%;background:${barColor};left:0;"></div>
            </div>
        `;

        // Active treaties
        if (proposals.length > 0) {
            html += '<div style="margin-top:6px;">';
            for (const p of proposals) {
                const pd = p.proposal_data || {};
                const name = pd.name || p.proposal_type;
                html += '<div class="treaty-item"><div class="treaty-dot"></div>' + escapeHtml(name) + '</div>';
            }
            html += '</div>';
        }

        // Action buttons
        html += '<div class="detail-actions">';
        html += '<button class="detail-btn" onclick="selectDraftTarget(\'' + nationId + '\')">Draft Initiative</button>';
        html += '<a class="detail-btn" href="' + nationInfoUrl(targetNation.name) + '">Nation Info</a>';
        html += '</div>';

        detail.innerHTML = html;
    } catch (err) {
        console.error('Error rendering relation detail:', err);
        detail.innerHTML = '<div class="empty-state"><div class="empty-state-text">Error loading details.</div></div>';
    }
}

// ── Select target nation for draft panel ──
async function selectDraftTarget(nationId) {
    if (!nationId) {
        activeDraftTarget = null;
        selectedTargetNation = null;
        renderDraftBox();
        return;
    }
    const { data: nation } = await _supabase.from('nations').select('*').eq('id', nationId).single();
    if (nation) {
        activeDraftTarget = nation;
        selectedTargetNation = nation;

        // Auto-select the appropriate initiative action if none is active
        if (!activeDraftAction) {
            const hasAmb = diplomaticRoles && diplomaticRoles.ambassadorTo.some(a => a.target_nation_id === nationId);
            const hasFM = diplomaticRoles && diplomaticRoles.isFM;
            if (hasAmb) {
                activeDraftAction = { key: 'minor_initiative', label: 'Minor Diplomatic Initiative', apCost: DIPLOMACY_CONFIG.PROPOSE_INITIATIVE_AP || 2, type: 'amb', role: 'amb' };
            } else if (hasFM) {
                activeDraftAction = { key: 'major_initiative', label: 'Major Diplomatic Initiative', apCost: DIPLOMACY_CONFIG.PROPOSE_INITIATIVE_AP || 2, type: 'fm', role: 'fm' };
            }
            // Highlight the corresponding action in the right panel
            if (activeDraftAction) {
                document.querySelectorAll('.action-item.is-active').forEach(el => el.classList.remove('is-active'));
                const el = document.querySelector('.action-item[data-action="' + activeDraftAction.key + '"]');
                if (el) el.classList.add('is-active');
            }
        }

        renderDraftBox();
    }
}
window.selectDraftTarget = selectDraftTarget;

// ══════════════════════════════════════════════════════
// DIPLOMATIC ACTIONS BOX
// ══════════════════════════════════════════════════════
async function renderActionsBox() {
    const body = document.getElementById('actions-body');
    if (!body) return;

    // Fetch unread message count for the Send Message badge (role-gated)
    if (currentNation && currentFaction && diplomaticRoles) {
        try {
            const _fm = diplomaticRoles.isFM;
            const _mot = diplomaticRoles.isMoT;
            const _ambIds = (diplomaticRoles.ambassadorTo || []).map(a => a.target_nation_id);
            if (_fm || _mot || _ambIds.length > 0) {
                const { data: msgs } = await _supabase
                    .from('diplomatic_messages')
                    .select('id, from_nation_id, read_by_factions')
                    .eq('to_nation_id', currentNation.id)
                    .neq('from_nation_id', currentNation.id);
                let count = 0;
                for (const msg of (msgs || [])) {
                    if ((msg.read_by_factions || []).includes(currentFaction.id)) continue;
                    if (_fm || _mot || _ambIds.includes(msg.from_nation_id)) count++;
                }
                totalUnreadMessages = count;
            } else {
                totalUnreadMessages = 0;
            }
        } catch (e) { /* non-blocking */ }
    }

    const hasHoG = diplomaticRoles && diplomaticRoles.isHoG;
    const hasFM = diplomaticRoles && diplomaticRoles.isFM;
    const hasMoT = diplomaticRoles && diplomaticRoles.isMoT;
    const hasAmb = diplomaticRoles && diplomaticRoles.ambassadorTo && diplomaticRoles.ambassadorTo.length > 0;

    let html = '';

    // Helper: render a single action item (enabled or disabled)
    function actionHtml(a, enabled, role) {
        const isDisabled = !enabled || a.comingSoon;
        const disabledClass = isDisabled ? ' action-disabled' : '';
        const onclick = !isDisabled ? `onclick="selectDraftAction('${a.key}','${escapeHtml(a.label)}',${a.ap},'${a.type}','${role}')"` : '';
        const costLabel = a.ap > 0 ? a.ap + ' AP' : 'Free';
        const badgeHtml = a.badge ? '<span class="action-badge">' + a.badge + '</span>' : '';
        return `<div class="action-item${disabledClass}" data-action="${a.key}" ${onclick}>
                <span class="action-name">${a.label}${badgeHtml}</span>
                <span class="action-cost">${costLabel}</span>
            </div>`;
    }

    // Ambassador
    html += '<div class="role-header role-header-amb' + (hasAmb ? '' : ' role-disabled') + '">Ambassador</div>';
    [
        { key: 'minor_initiative', label: 'Minor Diplomatic Initiative', ap: 2, type: 'amb' },
        { key: 'formal_protest', label: 'Formal Protest', ap: 2, type: 'amb', comingSoon: true },
        { key: 'send_message', label: 'Send Message', ap: 0, type: 'amb', badge: totalUnreadMessages > 0 ? totalUnreadMessages : 0 }
    ].forEach(a => { html += actionHtml(a, hasAmb, 'amb'); });

    // Head of Government
    html += '<div class="role-header role-header-hog' + (hasHoG ? '' : ' role-disabled') + '">Head of Government</div>';
    [
        { key: 'declare_war', label: 'Declare War', ap: 8, type: 'hog', comingSoon: true },
        { key: 'call_ceasefire', label: 'Call for Ceasefire', ap: 4, type: 'hog', comingSoon: true },
        { key: 'sign_alliance', label: 'Sign Alliance', ap: 6, type: 'hog', comingSoon: true },
        { key: 'state_visit', label: 'State Visit', ap: DIPLOMACY_CONFIG.STATE_VISIT_AP || 4, type: 'hog' }
    ].forEach(a => { html += actionHtml(a, hasHoG, 'hog'); });

    // Foreign Minister
    html += '<div class="role-header role-header-fm' + (hasFM ? '' : ' role-disabled') + '">Foreign Minister</div>';
    [
        { key: 'appoint_ambassador', label: 'Appoint Ambassador', ap: 1, type: 'fm' },
        { key: 'recall_ambassador', label: 'Recall Ambassador', ap: 1, type: 'fm' },
        { key: 'major_initiative', label: 'Major Diplomatic Initiative', ap: 2, type: 'fm' },
        { key: 'foreign_aid', label: 'Foreign Aid Proposal', ap: 4, type: 'fm', comingSoon: true }
    ].forEach(a => { html += actionHtml(a, hasFM, 'fm'); });

    // Minister of Trade
    html += '<div class="role-header role-header-mot' + (hasMoT ? '' : ' role-disabled') + '">Minister of Trade</div>';
    [
        { key: 'trade_agreement', label: 'Trade Agreement', ap: 2, type: 'mot' }
    ].forEach(a => { html += actionHtml(a, hasMoT, 'mot'); });
    // Unilateral actions under MoT
    html += '<div style="padding:2px 14px 4px;"><span style="font-family:var(--font-mono);font-size:7.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-faint);">Unilateral</span></div>';
    [
        { key: 'retaliatory_tariff_draft', label: 'Retaliatory Tariff', ap: 2, type: 'mot' },
        { key: 'export_subsidy_draft', label: 'Export Subsidy', ap: 2, type: 'mot' },
        { key: 'impose_embargo_draft', label: 'Impose Embargo', ap: 5, type: 'mot' }
    ].forEach(a => { html += actionHtml(a, hasMoT, 'mot'); });

    body.innerHTML = html;
}

// ── Select action for draft panel ──
function selectDraftAction(key, label, apCost, type, role) {
    // Clear previous active
    document.querySelectorAll('.action-item.is-active').forEach(el => el.classList.remove('is-active'));
    // Set new active
    const el = document.querySelector('.action-item[data-action="' + key + '"]');
    if (el) el.classList.add('is-active');

    activeDraftAction = { key, label, apCost, type, role };
    renderDraftBox();
}
window.selectDraftAction = selectDraftAction;

// ══════════════════════════════════════════════════════
// NEGOTIATIONS BOX
// ══════════════════════════════════════════════════════
async function renderNegotiationsBox() {
    const body = document.getElementById('negotiations-body');
    if (!body) return;
    body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading...</div></div>';

    if (!currentNation) {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">No nation data.</div></div>';
        return;
    }

    try {
        // Fetch pending/active diplomatic proposals
        const { data: proposals } = await _supabase
            .from('diplomatic_proposals')
            .select('*')
            .in('status', ['proposed', 'revised', 'fm_review', 'ratification', 'ratification_failed'])
            .or('proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + currentNation.id)
            .order('proposed_at_tick', { ascending: false });

        // Fetch open/active/ratification trade negotiations
        const { data: tradeNegs } = await _supabase
            .from('trade_negotiations')
            .select('*')
            .in('status', ['open', 'active', 'ratification'])
            .or('nation_a_id.eq.' + currentNation.id + ',nation_b_id.eq.' + currentNation.id);

        // Fetch active (signed) diplomatic agreements
        const { data: activeAgreements } = await _supabase
            .from('diplomatic_proposals')
            .select('*')
            .eq('status', 'active')
            .or('proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + currentNation.id)
            .order('activated_at_tick', { ascending: false });

        // Fetch active (signed) trade agreements
        const { data: activeTradeAgs } = await _supabase
            .from('trade_agreements')
            .select('*')
            .eq('status', 'active')
            .or('nation_a_id.eq.' + currentNation.id + ',nation_b_id.eq.' + currentNation.id)
            .order('enacted_at_tick', { ascending: false });

        const allProposals = proposals || [];
        const allTradeNegs = tradeNegs || [];
        const allActiveAgreements = activeAgreements || [];
        const allActiveTradeAgs = activeTradeAgs || [];
        const totalCount = allProposals.length + allTradeNegs.length + allActiveAgreements.length + allActiveTradeAgs.length;

        const countEl = document.getElementById('negotiations-count');
        if (countEl) countEl.textContent = totalCount > 0 ? totalCount : '';

        if (totalCount === 0) {
            body.innerHTML = '<div class="empty-state"><div class="empty-state-text">No agreements or negotiations.</div></div>';
            return;
        }

        let html = '';

        // ── Active (signed) diplomatic agreements — shown first, green ──
        for (const ag of allActiveAgreements) {
            const pd = ag.proposal_data || {};
            const title = pd.name || 'Unnamed Agreement';
            const proposerName = pd.proposer_nation_name || 'Unknown';
            const targetName = pd.target_nation_name || 'Unknown';
            const isOutgoing = ag.proposing_nation_id === currentNation.id;
            const otherNation = isOutgoing ? targetName : proposerName;
            const classification = pd.classification || '';
            const classTag = classification ? ' · ' + classification : '';
            const durationYears = pd.duration_years || 0;
            const expiresTick = ag.activated_at_tick != null && durationYears > 0
                ? ag.activated_at_tick + (durationYears * GAME_CONFIG.TICKS_PER_YEAR) : null;

            // Articles summary
            const articles = pd.articles || [];
            const struckIndices = new Set(pd.struck_articles || []);
            let totalRel = 0;
            articles.forEach((art, i) => { if (!struckIndices.has(i) && art.status !== 'struck') totalRel += (art.effects?.relations || art.relations || 0); });

            // Withdraw button
            let withdrawBtn = '';
            if (diplomaticRoles.isFM || diplomaticRoles.isHoG) {
                withdrawBtn = '<button class="detail-btn" onclick="event.stopPropagation(); withdrawAgreement(\'' + ag.id + '\')">Withdraw</button>';
            }

            html += `
                <div class="neg-row neg-row--active" data-neg-id="${ag.id}" onclick="toggleNegRow('${ag.id}')">
                    <span class="neg-direction neg-direction--active">&#10003;</span>
                    <div class="neg-info">
                        <div class="neg-title">${escapeHtml(title)}</div>
                        <div class="neg-sub">${escapeHtml(otherNation)}${classTag}</div>
                    </div>
                    <div class="neg-meta">
                        <span class="badge badge--green">Active</span>
                        <span class="neg-expand">&#9654;</span>
                    </div>
                </div>
                <div class="neg-detail" id="neg-detail-${ag.id}">
                    <div class="neg-detail-header">
                        <div class="neg-detail-title">${escapeHtml(title)}</div>
                        <span class="badge badge--green">Active</span>
                    </div>
                    <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;">
                        ${escapeHtml(proposerName)} &amp; ${escapeHtml(targetName)}
                        ${durationYears ? ' · ' + durationYears + ' year' + (durationYears !== 1 ? 's' : '') : ''}
                        ${totalRel ? ' · ' + (totalRel > 0 ? '+' : '') + totalRel + ' Relations' : ''}
                    </div>
                    <div style="font-size:11px;color:var(--text-dim);margin-bottom:6px;">
                        Signed: ${ag.activated_at_tick != null ? tickToDate(ag.activated_at_tick) : '—'}
                        · Expires: ${expiresTick != null ? tickToDate(expiresTick) : '—'}
                    </div>
                    <div class="detail-actions">
                        <button class="detail-btn" onclick="viewActiveAgreement('${ag.id}')">View</button>
                        ${withdrawBtn}
                    </div>
                </div>
            `;
        }

        // ── Active (signed) trade agreements — green ──
        if (allActiveTradeAgs.length > 0) {
            // Fetch nation names for trade agreements
            const tradeNationIds = new Set();
            allActiveTradeAgs.forEach(a => { tradeNationIds.add(a.nation_a_id); tradeNationIds.add(a.nation_b_id); });
            const { data: tradeNations } = await _supabase.from('nations').select('id, name').in('id', [...tradeNationIds]);
            const tradeNameMap = {};
            (tradeNations || []).forEach(n => tradeNameMap[n.id] = n.name);

            for (const ta of allActiveTradeAgs) {
                const typeInfo = TRADE_AGREEMENT_TYPES[ta.agreement_type];
                const partnerId = ta.nation_a_id === currentNation.id ? ta.nation_b_id : ta.nation_a_id;
                const partnerName = tradeNameMap[partnerId] || 'Unknown';
                const typeLabel = typeInfo ? typeInfo.shortLabel : 'Trade';
                const ticksLeft = ta.expires_at_tick ? ta.expires_at_tick - shardTick : null;
                const withdrawalPending = ta.withdrawn_at_tick != null && ta.withdrawn_at_tick > shardTick;

                let withdrawBtn = '';
                const canWithdraw = diplomaticRoles.isFM || diplomaticRoles.isHoG ||
                    (diplomaticRoles.isMoT && (ta.agreement_type === 'impose_embargo' || ta.agreement_type === 'retaliatory_tariff' || ta.agreement_type === 'export_subsidy'));
                if (withdrawalPending) {
                    withdrawBtn = '<span style="font-size:10px;color:var(--amber);">Withdrawing in ' + (ta.withdrawn_at_tick - shardTick) + ' ticks</span>';
                } else if (canWithdraw) {
                    const btnLabel = ta.agreement_type === 'impose_embargo' ? 'Lift Embargo' : 'Withdraw';
                    withdrawBtn = '<button class="detail-btn" onclick="event.stopPropagation(); withdrawTradeAgreement(\'' + ta.id + '\')">' + btnLabel + '</button>';
                }

                html += `
                    <div class="neg-row neg-row--active" data-neg-id="ta-${ta.id}" onclick="toggleNegRow('ta-${ta.id}')">
                        <span class="neg-direction neg-direction--active">&#10003;</span>
                        <div class="neg-info">
                            <div class="neg-title">${escapeHtml(ta.agreement_name || 'Unnamed')}</div>
                            <div class="neg-sub">${escapeHtml(partnerName)} · ${escapeHtml(typeLabel)}</div>
                        </div>
                        <div class="neg-meta">
                            <span class="badge badge--green">Active</span>
                            <span class="neg-expand">&#9654;</span>
                        </div>
                    </div>
                    <div class="neg-detail" id="neg-detail-ta-${ta.id}">
                        <div class="neg-detail-header">
                            <div class="neg-detail-title">${escapeHtml(ta.agreement_name || 'Unnamed')}</div>
                            <span class="badge badge--green">${typeInfo ? escapeHtml(typeInfo.shortLabel) : 'Trade'}</span>
                        </div>
                        <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;">
                            ${escapeHtml(currentNation.name)} &amp; ${escapeHtml(partnerName)}
                            ${typeInfo ? ' · ' + escapeHtml(typeInfo.label) : ''}
                            ${ta.duration_ticks ? ' · ' + ta.duration_ticks + ' ticks' : ' · Permanent'}
                            ${ta.auto_renew ? ' (auto-renew)' : ''}
                        </div>
                        <div style="font-size:11px;color:var(--text-dim);margin-bottom:6px;">
                            Enacted: ${ta.enacted_at_tick != null ? tickToDate(ta.enacted_at_tick) : '—'}
                            · Expires: ${ta.expires_at_tick != null ? tickToDate(ta.expires_at_tick) : 'Never'}
                            ${ticksLeft != null && ticksLeft <= 5 ? ' · <span style="color:var(--amber);">' + ticksLeft + ' ticks left</span>' : ''}
                        </div>
                        <div class="detail-actions">
                            <button class="detail-btn" onclick="viewActiveTradeAgreement('${ta.id}')">View</button>
                            ${withdrawBtn}
                        </div>
                    </div>
                `;
            }
        }

        // ── Separator between active and in-progress if both exist ──
        const hasActive = allActiveAgreements.length > 0 || allActiveTradeAgs.length > 0;
        const hasPending = allProposals.length > 0 || allTradeNegs.length > 0;
        if (hasActive && hasPending) {
            html += '<div style="border-top:1px solid var(--border-hair);margin:4px 14px;"></div>';
        }

        // Track all active proposal IDs for localStorage cleanup, and unseen count
        const allActiveIds = [];
        let _unseenCount = 0;

        // Diplomatic proposals (in-progress)
        for (const p of allProposals) {
            const pd = p.proposal_data || {};
            const isOutgoing = p.proposing_nation_id === currentNation.id;
            const isIncoming = p.target_nation_id === currentNation.id;

            // Determine if we need to act
            const isRevised = p.status === 'revised';
            const revisedByUs = isRevised && (pd.revised_by_nation_id ? pd.revised_by_nation_id === currentNation.id : !isIncoming);
            const needsOurAction = (p.status === 'proposed' && isIncoming) || (isRevised && !revisedByUs);
            const isFmReview = p.status === 'fm_review';
            const isRatification = p.status === 'ratification' || p.status === 'ratification_failed';

            // Check if this item needs our action based on our role and is unseen
            const requiresRoleAction = needsOurAction || (isFmReview && diplomaticRoles.isFM) || (isRatification && (diplomaticRoles.isFM || diplomaticRoles.isHoG));
            const unseen = requiresRoleAction && isProposalUnseen(p.id);
            if (requiresRoleAction) allActiveIds.push(p.id);
            if (unseen) _unseenCount++;

            // Status badge
            let statusBadge = '';
            if (needsOurAction) {
                statusBadge = '<span class="badge badge--amber">Your Turn</span>';
            } else if (isFmReview && diplomaticRoles.isFM) {
                statusBadge = '<span class="badge badge--blue">FM Review</span>';
            } else if (isRatification) {
                statusBadge = '<span class="badge badge--teal">Parliament</span>';
            } else {
                statusBadge = '<span class="badge badge--amber">Awaiting</span>';
            }

            const unseenBadge = unseen ? '<span class="neg-unseen-dot"></span>' : '';

            const dirClass = isOutgoing ? 'neg-direction--out' : 'neg-direction--in';
            const dirLabel = isOutgoing ? 'OUT' : 'IN';
            const title = pd.name || 'Unnamed Proposal';
            const otherNation = isOutgoing ? (pd.target_nation_name || 'Unknown') : (pd.proposer_nation_name || 'Unknown');

            // Classification
            const classification = pd.classification || '';
            const classTag = classification ? ' · ' + classification : '';

            html += `
                <div class="neg-row${unseen ? ' neg-row--unseen' : ''}" data-neg-id="${p.id}" onclick="toggleNegRow('${p.id}')">
                    ${unseenBadge}
                    <span class="neg-direction ${dirClass}">${dirLabel}</span>
                    <div class="neg-info">
                        <div class="neg-title">${escapeHtml(title)}</div>
                        <div class="neg-sub">${escapeHtml(otherNation)}${classTag}</div>
                    </div>
                    <div class="neg-meta">
                        ${statusBadge}
                        <span class="neg-expand">&#9654;</span>
                    </div>
                </div>
                <div class="neg-detail" id="neg-detail-${p.id}">
                    ${renderNegDetailContent(p, pd, needsOurAction, isFmReview, isRatification)}
                </div>
            `;
        }

        // Trade negotiations
        for (const neg of allTradeNegs) {
            const isParticipant = (neg.participants || []).some(p => p.nation_id === currentNation.id);
            const needsAction = !isParticipant && neg.status === 'open';
            const isOutgoing = neg.initiated_by_nation === currentNation.id;

            // Check if unseen
            const tradeNegId = 'trade-' + neg.id;
            const requiresRoleAction = needsAction || (neg.status === 'ratification' && (diplomaticRoles.isFM || diplomaticRoles.isHoG));
            const unseen = requiresRoleAction && isProposalUnseen(tradeNegId);
            if (requiresRoleAction) allActiveIds.push(tradeNegId);
            if (unseen) _unseenCount++;

            let statusBadge;
            if (needsAction) {
                statusBadge = '<span class="badge badge--amber">Join</span>';
            } else if (neg.status === 'ratification') {
                statusBadge = '<span class="badge badge--teal">Parliament</span>';
            } else {
                statusBadge = neg.status === 'open'
                    ? '<span class="badge badge--amber">Pending</span>'
                    : '<span class="badge badge--green">Active</span>';
            }

            const unseenBadge = unseen ? '<span class="neg-unseen-dot"></span>' : '';

            const dirClass = isOutgoing ? 'neg-direction--out' : 'neg-direction--in';
            const dirLabel = isOutgoing ? 'OUT' : 'IN';
            const typeInfo = neg.agreement_type && neg.agreement_type !== 'pending' ? TRADE_AGREEMENT_TYPES[neg.agreement_type] : null;
            const typeLabel = typeInfo ? typeInfo.shortLabel : 'Trade';

            html += `
                <div class="neg-row${unseen ? ' neg-row--unseen' : ''}" data-neg-id="${tradeNegId}" onclick="toggleNegRow('${tradeNegId}')">
                    ${unseenBadge}
                    <span class="neg-direction ${dirClass}">${dirLabel}</span>
                    <div class="neg-info">
                        <div class="neg-title">${escapeHtml(neg.agreement_name || 'Trade Negotiation')}</div>
                        <div class="neg-sub">${escapeHtml(typeLabel)}</div>
                    </div>
                    <div class="neg-meta">
                        ${statusBadge}
                        <span class="neg-expand">&#9654;</span>
                    </div>
                </div>
                <div class="neg-detail" id="neg-detail-trade-${neg.id}">
                    <div class="neg-detail-header">
                        <div class="neg-detail-title">${escapeHtml(neg.agreement_name || 'Trade Negotiation')}</div>
                        <span class="badge badge--dim">${escapeHtml(typeLabel)}</span>
                    </div>
                    <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;">
                        Status: ${neg.status === 'ratification' ? 'Awaiting Parliament' : neg.status} ${neg.status !== 'ratification' ? '· Expires in ' + Math.max(0, (neg.expires_at_tick || 0) - shardTick) + ' ticks' : '· Both sides approved'}
                    </div>
                    <div class="detail-actions">
                        ${needsAction && diplomaticRoles && diplomaticRoles.isMoT ? '<button class="detail-btn" onclick="joinTradeNegotiation(\'' + neg.id + '\', \'trade_minister\', ' + DIPLOMACY_CONFIG.JOIN_NEGOTIATION_MOT_AP + ')">Join as Min. of Trade (' + DIPLOMACY_CONFIG.JOIN_NEGOTIATION_MOT_AP + ' AP)</button>' : ''}
                        ${needsAction && diplomaticRoles && diplomaticRoles.isHoG ? '<button class="detail-btn" onclick="joinTradeNegotiation(\'' + neg.id + '\', \'prime_minister\', ' + DIPLOMACY_CONFIG.JOIN_NEGOTIATION_PM_AP + ')">Join as PM (' + DIPLOMACY_CONFIG.JOIN_NEGOTIATION_PM_AP + ' AP)</button>' : ''}
                        ${needsAction && diplomaticRoles && diplomaticRoles.isFM && !diplomaticRoles.isHoG ? '<button class="detail-btn" onclick="joinTradeNegotiation(\'' + neg.id + '\', \'foreign_minister\', ' + DIPLOMACY_CONFIG.JOIN_NEGOTIATION_FM_AP + ')">Join as FM (' + DIPLOMACY_CONFIG.JOIN_NEGOTIATION_FM_AP + ' AP)</button>' : ''}
                        ${isParticipant || neg.status === 'ratification' ? '<button class="detail-btn" onclick="openTradeNegotiation(\'' + neg.id + '\')">' + (neg.status === 'ratification' ? 'View' : 'Open') + '</button>' : ''}
                    </div>
                </div>
            `;
        }

        body.innerHTML = html;

        // Update unseen tracking
        cleanSeenProposals(allActiveIds);
        unseenProposalCount = _unseenCount;
        updateUnseenBadge();
    } catch (err) {
        console.error('Error rendering negotiations box:', err);
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Error loading negotiations.</div></div>';
    }
}

// ── Toggle negotiation row expand / collapse ──
function toggleNegRow(negId) {
    const row = document.querySelector('.neg-row[data-neg-id="' + negId + '"]');
    if (!row) return;
    const wasExpanded = row.classList.contains('is-expanded');
    document.querySelectorAll('.neg-row.is-expanded').forEach(r => r.classList.remove('is-expanded'));
    if (!wasExpanded) {
        row.classList.add('is-expanded');
        // Mark as seen and remove unseen indicator
        if (row.classList.contains('neg-row--unseen')) {
            row.classList.remove('neg-row--unseen');
            const dot = row.querySelector('.neg-unseen-dot');
            if (dot) dot.remove();
            unseenProposalCount = Math.max(0, unseenProposalCount - 1);
            updateUnseenBadge();
        }
        markProposalSeen(negId);
    }
}
window.toggleNegRow = toggleNegRow;

// ── Render state visit detail inside the negotiations panel ──
function renderStateVisitNegDetail(p, pd, needsOurAction) {
    const isIncoming = p.target_nation_id === currentNation.id;
    const vtLabel = STATE_VISIT_TYPES[pd.visit_type]?.label || 'State Visit';
    const durLabel = STATE_VISIT_DURATIONS[pd.duration]?.label || 'Moderate';
    const delLabel = STATE_VISIT_DELEGATIONS[pd.delegation_size]?.label || 'Standard (8)';
    const agenda = pd.agenda || [];
    const computedEffects = pd.computed_effects || {};

    const deadlineTick = p.fm_review_expires_tick;
    const ticksLeft = deadlineTick != null ? Math.max(0, deadlineTick - shardTick) : '?';
    const expired = deadlineTick != null && shardTick > deadlineTick;

    let html = '<div class="neg-detail-header">';
    html += '<div class="neg-detail-title">' + escapeHtml(stateVisitLabel(pd)) + '</div>';
    html += '<span class="badge badge--dim" style="background:#5c3a1a;color:#FFD700;">STATE VISIT</span>';
    html += '</div>';

    // Leader & direction
    html += '<div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;line-height:1.5;">';
    html += '<strong>' + escapeHtml(pd.visitor_leader || 'Unknown') + '</strong> of <strong>' + escapeHtml(pd.visitor_nation || 'Unknown') + '</strong>';
    html += ' &rarr; ' + escapeHtml(pd.host_nation || 'Unknown');
    html += '<br>Proposed ' + (p.proposed_at_tick != null ? tickToDate(p.proposed_at_tick) : '—');
    if (expired) {
        html += ' · <span style="color:var(--red);">Expired</span>';
    } else if (deadlineTick != null) {
        html += ' · Expires in ' + ticksLeft + ' tick(s)';
    }
    html += '</div>';

    // Visit configuration tags
    html += '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;">';
    html += '<span class="sv-effect-tag sv-effect-tag--info">' + escapeHtml(vtLabel) + '</span>';
    html += '<span class="sv-effect-tag sv-effect-tag--info">' + escapeHtml(durLabel) + '</span>';
    html += '<span class="sv-effect-tag sv-effect-tag--info">' + escapeHtml(delLabel) + '</span>';
    html += '</div>';

    // Agenda items
    if (agenda.length > 0) {
        html += '<div style="font-size:10px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;">Agenda (' + agenda.length + ' items)</div>';
        for (const key of agenda) {
            const item = STATE_VISIT_AGENDA_ITEMS.find(a => a.key === key);
            if (!item) continue;
            html += '<div style="font-size:11px;padding:4px 0;border-bottom:1px solid var(--border-subtle);display:flex;justify-content:space-between;align-items:flex-start;">';
            html += '<div><span style="color:var(--text-dim);">Day ' + item.day + ' · ' + escapeHtml(item.slot) + '</span><br><span style="color:var(--text-primary);">' + escapeHtml(item.title) + '</span></div>';
            // Effect tags
            const effTags = [];
            if (item.effects) {
                for (const [stat, val] of Object.entries(item.effects)) {
                    if (val) effTags.push('<span style="color:#5cb85c;font-size:10px;">+' + val + ' ' + stat.replace(/_/g, ' ') + '</span>');
                }
            }
            if (item.costs?.debt) effTags.push('<span style="color:#f97316;font-size:10px;">$' + (item.costs.debt / 1e6).toFixed(1) + 'M</span>');
            if (item.risks?.gaffe) effTags.push('<span style="color:var(--red);font-size:10px;">' + Math.round(item.risks.gaffe * 100) + '% gaffe</span>');
            if (item.risks?.hostiles_alarmed) effTags.push('<span style="color:var(--red);font-size:10px;">hostiles alarmed</span>');
            if (effTags.length) html += '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">' + effTags.join('') + '</div>';
            html += '</div>';
        }
    }

    // Projected total effects
    const effectEntries = Object.entries(computedEffects).filter(([, v]) => v !== 0);
    if (effectEntries.length > 0) {
        html += '<div style="font-size:10px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;margin:10px 0 4px;">Projected Effects (both nations)</div>';
        html += '<div style="display:flex;gap:6px;flex-wrap:wrap;">';
        for (const [stat, val] of effectEntries) {
            const sign = val > 0 ? '+' : '';
            const color = val > 0 ? '#5cb85c' : '#f44';
            html += '<span class="sv-effect-tag" style="border-color:' + color + '44;color:' + color + ';">' + sign + val + ' ' + escapeHtml(stat.replace(/_/g, ' ')) + '</span>';
        }
        html += '</div>';
    }

    // Budget cost
    if (pd.total_debt && pd.total_debt > 0) {
        html += '<div style="margin-top:8px;"><span class="sv-effect-tag sv-effect-tag--cost">Embassy Budget: $' + (pd.total_debt / 1e6).toFixed(1) + 'M (visitor pays)</span></div>';
    }

    // Risks
    if (pd.risks && pd.risks.length > 0) {
        html += '<div style="font-size:10px;color:var(--text-dim);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;margin:10px 0 4px;">Risks</div>';
        for (const r of pd.risks) {
            if (r.chance) {
                html += '<span class="sv-effect-tag sv-effect-tag--risk">' + escapeHtml(r.source) + ': ' + Math.round(r.chance * 100) + '% ' + escapeHtml(r.key) + '</span> ';
            }
            if (r.flag) {
                html += '<span class="sv-effect-tag sv-effect-tag--risk">' + escapeHtml(r.source) + ': ' + escapeHtml(r.key) + '</span> ';
            }
        }
    }

    // Special flags
    if (pd.is_first) {
        html += '<div style="margin-top:8px;color:#FFD700;font-size:11px;">★ First-ever visit between these nations — bonus stability!</div>';
    }
    if (pd.is_target_autocracy) {
        html += '<div style="margin-top:4px;color:#f97316;font-size:11px;">⚠ Autocracy domestic risk: 1D12 dice roll on visitor\'s gov approval</div>';
    }

    // Action buttons — FM in democracies, ruling faction in autocracies
    html += '<div class="detail-actions" style="margin-top:10px;">';
    const detailSvRole = isGovernmentAutocracy(currentNation) ? 'Ruling Faction' : 'Foreign Minister';
    if (needsOurAction && !expired && canHandleStateVisit()) {
        html += '<button class="detail-btn" onclick="acceptStateVisit(\'' + p.id + '\')">Accept Visit</button>';
        html += '<button class="detail-btn" onclick="declineStateVisit(\'' + p.id + '\')">Decline</button>';
    } else if (needsOurAction && !expired) {
        html += '<div style="font-size:11px;color:var(--text-muted);">Only the ' + detailSvRole + ' can accept or decline this visit.</div>';
    } else if (expired) {
        html += '<div style="color:var(--red);font-size:11px;">Invitation has expired.</div>';
    } else if (!isIncoming) {
        html += '<div style="font-size:11px;color:var(--text-muted);">Awaiting response from ' + escapeHtml(pd.host_nation || 'target') + '.</div>';
    }
    html += '</div>';

    return html;
}

// ── Render negotiation detail content (diplomatic proposals) ──
function renderNegDetailContent(p, pd, needsOurAction, isFmReview, isRatification) {
    // ── State visit proposals get their own detail renderer ──
    if (p.proposal_type === 'state_visit') {
        return renderStateVisitNegDetail(p, pd, needsOurAction);
    }

    const articles = pd.articles || [];
    const struckIndices = new Set(pd.struck_articles || []);
    const addedArticles = pd.added_articles || [];
    const classification = pd.classification || '';
    const isTradeAgreement = p.proposal_type === 'trade_agreement';
    const isV2 = pd.version === 2;

    let html = '<div class="neg-detail-header">';
    html += '<div class="neg-detail-title">' + escapeHtml(pd.name || 'Unnamed') + '</div>';
    if (classification) html += '<span class="badge badge--dim">' + classification + '</span>';
    if (isTradeAgreement && pd.agreement_type) {
        const typeInfo = TRADE_AGREEMENT_TYPES[pd.agreement_type];
        if (typeInfo) html += '<span class="badge badge--dim" style="margin-left:4px;">' + escapeHtml(typeInfo.shortLabel) + '</span>';
    }
    html += '</div>';

    // Articles
    if (articles.length > 0) {
        for (let i = 0; i < articles.length; i++) {
            const art = articles[i];
            const isStruck = isV2 ? (art.status === 'struck') : struckIndices.has(i);

            if (isV2) {
                // Rich v2 article rendering
                const typeInfo = INITIATIVE_ARTICLE_TYPES[art.type] || MAJOR_INITIATIVE_ARTICLE_TYPES[art.type];
                const typeName = typeInfo ? typeInfo.label : art.type;
                const cardClass = isStruck ? 'initiative-article initiative-article--struck' : 'initiative-article';
                html += '<div class="' + cardClass + '">';
                html += '<div class="initiative-article-head">';
                html += '<div><span class="initiative-article-num">Art. ' + toRoman(i + 1) + '</span> ';
                html += '<span class="initiative-article-type">' + escapeHtml(typeName).toUpperCase();
                if (isStruck) html += ' — STRUCK';
                html += '</span></div></div>';

                // Config summary (read-only)
                if (art.config && !isStruck) {
                    html += '<div style="margin:4px 0 2px;">';
                    html += renderArticleConfigSummary(art);
                    html += '</div>';
                }

                // Effect tags
                if (art.effects && !isStruck) {
                    html += renderEffectTagsFromEffects(art.effects, art.type);
                }

                // Strike checkbox (only for incoming proposals needing action)
                if (needsOurAction && !isStruck) {
                    html += '<div style="margin-top:6px;display:flex;align-items:center;gap:6px;">' +
                        '<input type="checkbox" class="strike-checkbox" data-proposal-id="' + p.id + '" data-article-index="' + i + '" data-article-id="' + (art.id || '') + '">' +
                        '<span style="font-family:var(--font-mono);font-size:8px;color:var(--red);text-transform:uppercase;">Strike</span></div>';
                }

                html += '</div>';
            } else {
                // V1 legacy rendering
                const artLabel = isTradeAgreement
                    ? renderTradeArticleSummary(art)
                    : escapeHtml(art.text || art.label || art.type || 'Unknown');
                const artTypeName = isTradeAgreement ? (TRADE_ARTICLE_TYPES[art.type]?.label || art.type) : '';
                const cardClass = isStruck ? 'article-card article-card--struck' : 'article-card';
                html += `
                    <div class="${cardClass}">
                        <div class="article-card-type">Art. ${toRoman(i + 1)}${artTypeName ? ' — ' + escapeHtml(artTypeName) : ''}${isStruck ? ' — STRUCK' : ''}</div>
                        <div class="article-card-title">${isTradeAgreement ? artLabel : escapeHtml(art.text || art.label || '')}</div>
                    </div>
                `;
            }
        }
    }

    // Show added articles from counter-party
    if (addedArticles.length > 0) {
        html += '<div style="font-size:10px;color:var(--green);margin:8px 0 4px;">Counter-party additions:</div>';
        for (let i = 0; i < addedArticles.length; i++) {
            const art = addedArticles[i];
            const artLabel = isTradeAgreement ? renderTradeArticleSummary(art) : escapeHtml(art.text || art.label || 'Unknown');
            const artTypeName = isTradeAgreement ? (TRADE_ARTICLE_TYPES[art.type]?.label || art.type) : '';
            html += `
                <div class="article-card article-card--added">
                    <div class="article-card-type">Added ${toRoman(i + 1)}${artTypeName ? ' — ' + escapeHtml(artTypeName) : ''}</div>
                    <div class="article-card-title">${artLabel}</div>
                </div>
            `;
        }
    }

    // Effects summary
    if (!isTradeAgreement) {
        if (isV2) {
            // V2: compute totals from active articles
            const totals = { relations: 0, revenue: 0, cost: 0 };
            articles.forEach(art => {
                if (art.status !== 'struck' && art.effects) {
                    const e = art.effects;
                    totals.relations += e.relations || 0;
                    totals.revenue += e.revenue || 0;
                    totals.cost += (e.cost_proposer || 0) + (e.cost_target || 0);
                }
            });
            if (totals.relations || totals.revenue || totals.cost) {
                html += '<div class="article-effects" style="margin:6px 0;">';
                if (totals.relations) html += '<span class="effect-tag effect-tag--positive">+' + totals.relations + ' Relations</span>';
                if (totals.revenue > 0) html += '<span class="effect-tag effect-tag--money-pos">+$' + (totals.revenue / 1e6).toFixed(0) + 'M Revenue</span>';
                if (totals.cost > 0) html += '<span class="effect-tag effect-tag--money-neg">-$' + (totals.cost / 1e6).toFixed(1) + 'M Cost</span>';
                html += '</div>';
            }
        } else {
            let totalRel = 0, totalMoney = 0;
            articles.forEach((art, i) => {
                if (!struckIndices.has(i)) {
                    totalRel += art.relations || 0;
                    totalMoney += art.money || 0;
                }
            });
            if (totalRel || totalMoney) {
                html += '<div style="font-size:10px;color:var(--text-dim);margin:6px 0;">';
                if (totalRel) html += (totalRel > 0 ? '+' : '') + totalRel + ' Relations ';
                if (totalMoney) html += (totalMoney > 0 ? '+$' : '-$') + (Math.abs(totalMoney) / 1e6).toFixed(0) + 'M';
                html += '</div>';
            }
        }
    }

    // Counter panel for trade agreements (hidden by default, toggled by Counter button)
    if (needsOurAction && isTradeAgreement) {
        html += '<div id="counter-panel-' + p.id + '" style="display:none;margin:8px 0;border:1px solid var(--border-subtle);padding:8px;background:var(--bg-3);">';
        html += '<div style="font-size:10px;color:var(--text-dim);margin-bottom:6px;">Strike articles and/or add new ones:</div>';

        // Strike checkboxes for original articles
        for (let i = 0; i < articles.length; i++) {
            if (struckIndices.has(i)) continue; // already struck, skip
            const art = articles[i];
            const artLabel = renderTradeArticleSummary(art);
            const artTypeName = TRADE_ARTICLE_TYPES[art.type]?.label || art.type;
            html += '<div style="display:flex;align-items:flex-start;gap:6px;margin:4px 0;">' +
                '<input type="checkbox" class="strike-checkbox" data-proposal-id="' + p.id + '" data-article-index="' + i + '" style="margin-top:2px;" />' +
                '<div style="font-size:11px;"><span style="color:var(--text-dim);">Art. ' + toRoman(i + 1) + ' — ' + escapeHtml(artTypeName) + ':</span> ' + artLabel + '</div>' +
            '</div>';
        }

        // Added articles list (from counter)
        html += '<div id="counter-added-list-' + p.id + '"></div>';

        // Add article dropdown
        const agreementType = pd.agreement_type;
        if (agreementType) {
            const existingArticles = [...articles, ...addedArticles, ...counterTradeArticles];
            const availableTypes = getAvailableArticleTypes(agreementType, existingArticles);
            if (availableTypes.length > 0) {
                html += '<div style="margin-top:8px;">';
                html += '<select id="counter-article-type-' + p.id + '" style="width:100%;background:var(--bg-3);border:1px solid var(--border-subtle);color:var(--text-primary);font-size:11px;padding:4px 8px;">';
                html += '<option value="">Add an article...</option>';
                availableTypes.forEach(at => {
                    html += '<option value="' + at.key + '">' + escapeHtml(at.label) + (at.required ? ' (required)' : '') + '</option>';
                });
                html += '</select>';
                html += '<button class="detail-btn" style="margin-top:4px;" onclick="showCounterArticleEditor(\'' + p.id + '\', \'' + agreementType + '\')">Add</button>';
                html += '</div>';
                html += '<div id="counter-article-editor-' + p.id + '"></div>';
            }
        }

        // Confirm counter button
        html += '<div style="margin-top:8px;display:flex;gap:6px;">';
        html += '<button class="detail-btn" style="color:var(--teal);border-color:var(--teal-border);" onclick="strikeTradeArticles(\'' + p.id + '\')">Send Counter</button>';
        html += '<button class="detail-btn" onclick="toggleCounterPanel(\'' + p.id + '\')">Cancel</button>';
        html += '</div>';
        html += '</div>';
    }

    // Action buttons
    html += '<div class="detail-actions">';
    if (needsOurAction) {
        html += '<button class="detail-btn" onclick="acceptProposal(\'' + p.id + '\')">Accept</button>';
        if (isTradeAgreement) {
            html += '<button class="detail-btn" onclick="toggleCounterPanel(\'' + p.id + '\')">Counter</button>';
        } else {
            html += '<button class="detail-btn" onclick="inboxStrikeArticles(\'' + p.id + '\')">Counter</button>';
        }
        html += '<button class="detail-btn" onclick="rejectProposal(\'' + p.id + '\')">Reject</button>';
    } else if (isFmReview && diplomaticRoles.isFM) {
        html += '<button class="detail-btn" onclick="fmApprove(\'' + p.id + '\')">Approve</button>';
        html += '<button class="detail-btn" onclick="fmEscalate(\'' + p.id + '\')">Escalate</button>';
        html += '<button class="detail-btn" onclick="fmReject(\'' + p.id + '\')">Reject</button>';
    } else if (isRatification && (diplomaticRoles.isFM || diplomaticRoles.isHoG)) {
        html += '<button class="detail-btn" onclick="fmEscalate(\'' + p.id + '\')">Resubmit</button>';
        html += '<button class="detail-btn" onclick="fmReject(\'' + p.id + '\')">Abandon</button>';
    }
    html += '</div>';

    return html;
}

// ══════════════════════════════════════════════════════
// DRAFT INITIATIVE BOX
// ══════════════════════════════════════════════════════
async function renderDraftBox() {
    const body = document.getElementById('draft-body');
    if (!body) return;

    const statusEl = document.getElementById('draft-status');

    if (!activeDraftAction) {
        if (statusEl) statusEl.textContent = '';
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Select an action from the right panel to begin drafting.</div></div>';
        return;
    }

    if (statusEl) statusEl.textContent = 'Drafting';

    // Special branch for Recall Ambassador
    if (activeDraftAction.key === 'recall_ambassador') {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading...</div></div>';
        renderRecallAmbassadorPanel(body, statusEl);
        return;
    }

    // Special branch for Appoint Ambassador
    if (activeDraftAction.key === 'appoint_ambassador') {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading...</div></div>';
        renderAppointAmbassadorPanel(body, statusEl);
        return;
    }

    // Special branch for Trade Agreement
    if (activeDraftAction.key === 'trade_agreement') {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading...</div></div>';
        renderTradeAgreementDraftPanel(body, statusEl);
        return;
    }

    // Special branch for Retaliatory Tariff (unilateral)
    if (activeDraftAction.key === 'retaliatory_tariff_draft') {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading...</div></div>';
        await renderRetaliatoryTariffDraftPanel(body, statusEl);
        return;
    }

    // Special branch for Export Subsidy (unilateral)
    if (activeDraftAction.key === 'export_subsidy_draft') {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading...</div></div>';
        await renderExportSubsidyDraftPanel(body, statusEl);
        return;
    }

    // Special branch for Impose Embargo (unilateral)
    if (activeDraftAction.key === 'impose_embargo_draft') {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading...</div></div>';
        await renderEmbargoDraftPanel(body, statusEl);
        return;
    }

    // Special branch for State Visit — rich two-panel builder
    if (activeDraftAction.key === 'state_visit') {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading...</div></div>';
        await renderStateVisitDraftPanel(body, statusEl);
        return;
    }

    // Special branch for Send Message — show diplomatic chat
    if (activeDraftAction.key === 'send_message') {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading...</div></div>';
        await renderSendMessagePanel(body, statusEl);
        return;
    }

    // Special branch for Minor Diplomatic Initiative — rich article config UI
    if (activeDraftAction.key === 'minor_initiative') {
        renderMinorInitiativeDraftPanel(body, statusEl);
        return;
    }

    // Special branch for Major Diplomatic Initiative — FM-only rich article config UI
    if (activeDraftAction.key === 'major_initiative') {
        renderMajorInitiativeDraftPanel(body, statusEl);
        return;
    }

    // Fallback: generic draft panel (should not reach here for known actions)
    body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Unknown action: ' + escapeHtml(activeDraftAction.key) + '</div></div>';
}

// ── Trade Agreement Draft Panel ──
var draftTradeMode = false;  // flag so saveWizardTradeArticle/removeWizardTradeArticle know to re-render draft panel

function renderTradeAgreementDraftPanel(body, statusEl) {
    if (statusEl) statusEl.textContent = 'Trade Agreement';
    draftTradeMode = true;

    // Sync state: if no agreements, clear wizard pointers
    if (draftAgreements.length === 0) {
        wizardTradeAgreementType = null;
        tradeArticles = [];
    }

    let html = '<div class="draft-panel">';

    // Header: action label
    html += '<div class="draft-header">';
    html += '<div class="draft-field"><div class="draft-field-label">Action</div><div class="draft-field-input">' + escapeHtml(activeDraftAction.label) + ' <span style="color:var(--teal);">(' + activeDraftAction.apCost + ' AP)</span></div></div>';

    // Target Nation dropdown
    let targetFieldHtml = '<select id="draft-target-select" style="width:100%;background:var(--bg-3);border:1px solid var(--border-subtle);color:var(--text-primary);font-family:var(--font-sans);font-size:12px;padding:4px 8px;" onchange="selectDraftTradeTarget(this.value)">';
    targetFieldHtml += '<option value="">Select a nation...</option>';
    cachedOtherNations.forEach(n => {
        const sel = activeDraftTarget && activeDraftTarget.id === n.id ? ' selected' : '';
        targetFieldHtml += '<option value="' + n.id + '"' + sel + '>' + escapeHtml(n.name) + '</option>';
    });
    targetFieldHtml += '</select>';
    html += '<div class="draft-field"><div class="draft-field-label">Target Nation</div>' + targetFieldHtml + '</div>';
    html += '</div>';

    if (!activeDraftTarget) {
        html += '<div class="empty-state" style="padding:20px 0;"><div class="empty-state-text">Select a target nation to continue.</div></div>';
        html += '</div>';
        body.innerHTML = html;
        return;
    }

    // ── Type selector (shown when no agreements yet, or adding a new one to bundle) ──
    const usedTypes = draftAgreements.map(a => a.type);
    const showTypeSelector = draftAgreements.length === 0 || addingNewAgreement;

    if (showTypeSelector) {
        const prompt = draftAgreements.length === 0 ? 'Choose agreement type:' : 'Add another agreement to the package:';
        html += '<div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:10px;">' + prompt + '</div>';
        html += '<div class="type-card-grid">';
        for (const [key, typeInfo] of Object.entries(TRADE_AGREEMENT_TYPES)) {
            if (!typeInfo.bilateral) continue;
            if (usedTypes.includes(key)) continue;
            html += `
                <div class="type-card" onclick="selectDraftTradeType('${key}')">
                    <div class="type-card-short">${escapeHtml(typeInfo.shortLabel)}</div>
                    <div class="type-card-title">${escapeHtml(typeInfo.label)}</div>
                    <div class="type-card-effects"><span class="trade-type-tag bilateral">BILATERAL</span></div>
                </div>`;
        }
        html += '</div>';

        // Show existing agreement tabs if we're adding to a bundle
        if (draftAgreements.length > 0) {
            html += renderAgreementTabs(true);
        }

        html += '<div class="detail-actions" style="margin-top:auto;padding-top:10px;border-top:1px solid var(--border-hair);">';
        html += '<button class="detail-btn" onclick="cancelDraft()">Cancel</button>';
        if (draftAgreements.length > 0) {
            html += '<button class="detail-btn" style="margin-left:4px;" onclick="cancelAddAgreement()">Back</button>';
        }
        html += '</div>';
        html += '</div>';
        body.innerHTML = html;
        return;
    }

    // ── Agreement name (shared across entire package) ──
    const activeType = draftAgreements.length === 1 ? TRADE_AGREEMENT_TYPES[draftAgreements[0].type] : null;
    const placeholderSuffix = draftAgreements.length > 1 ? 'Trade Package' : (activeType?.shortLabel || 'Trade') + ' Agreement';
    const placeholderName = (currentNation?.name || '') + '-' + (activeDraftTarget?.name || '') + ' ' + placeholderSuffix;
    html += '<div class="draft-field"><div class="draft-field-label">Name</div><input type="text" id="trade-neg-name" class="draft-field-input" placeholder="e.g. ' + escapeHtml(placeholderName) + '" value="' + escapeHtml(wizardName || '') + '" oninput="setWizardName(this.value)" style="border:1px solid var(--border-subtle);background:var(--bg-3);color:var(--text-primary);padding:4px 8px;font-family:var(--font-sans);font-size:12px;width:100%;"></div>';

    // ── Agreement Tabs ──
    html += renderAgreementTabs(false);

    // ── Active tab: article builder ──
    const typeInfo = TRADE_AGREEMENT_TYPES[wizardTradeAgreementType];
    const availableTypes = getAvailableArticleTypes(wizardTradeAgreementType, tradeArticles);
    const hasRequired = checkRequiredArticles(wizardTradeAgreementType, tradeArticles);

    // Type explainer
    const explainer = getTradeTypeExplainer(wizardTradeAgreementType);
    if (explainer) {
        html += '<div class="trade-info-box info" style="margin-top:8px;">' + explainer + '</div>';
    }

    // Existing articles for active tab
    html += '<div class="draft-articles">';
    if (tradeArticles.length === 0) {
        html += '<div class="empty-state" style="padding:14px 0;"><div class="empty-state-text">No articles added yet.</div></div>';
    } else {
        for (let i = 0; i < tradeArticles.length; i++) {
            const art = tradeArticles[i];
            const summary = renderTradeArticleSummary(art);
            const artTypeInfo = TRADE_ARTICLE_TYPES[art.type];
            const artLabel = artTypeInfo?.label || art.type;
            const artDesc = artTypeInfo?.description || '';
            const isRequired = (typeInfo.required_articles || []).includes(art.type);
            html += `
                <div class="draft-article">
                    <div class="draft-article-type">
                        <span>Art. ${toRoman(i + 1)} — ${escapeHtml(artLabel)} ${isRequired ? '<span class="badge badge--teal" style="margin-left:4px;">Required</span>' : '<span class="badge badge--dim" style="margin-left:4px;">Optional</span>'}</span>
                        <span class="draft-article-remove" onclick="removeDraftTradeArticle(${i})">Remove</span>
                    </div>
                    <div class="draft-article-title" style="font-size:0.75rem;">${summary}</div>
                    <div class="draft-article-body">${escapeHtml(artDesc)}</div>
                </div>`;
        }
    }
    html += '</div>';

    // Add article dropdown + editor
    if (availableTypes.length > 0) {
        html += '<div class="draft-add-row">';
        html += '<select id="wizard-trade-article-type" style="flex:1;background:var(--bg-3);border:1px solid var(--border-subtle);color:var(--text-primary);font-family:var(--font-sans);font-size:11px;padding:4px 8px;">';
        html += '<option value="">Add article...</option>';
        availableTypes.forEach(t => {
            html += '<option value="' + t.key + '">' + escapeHtml(t.label) + (t.required ? ' (required)' : '') + '</option>';
        });
        html += '</select>';
        html += '<button class="detail-btn" onclick="showDraftTradeArticleEditor()">Add</button>';
        html += '</div>';
        html += '<div id="wizard-trade-article-editor"></div>';
    }

    // Required articles warning for active tab
    if (!hasRequired) {
        const missing = (typeInfo.required_articles || []).filter(req => !tradeArticles.some(a => a.type === req));
        const missingLabels = missing.map(m => TRADE_ARTICLE_TYPES[m]?.label || m).join(', ');
        html += '<div style="font-size:0.72rem;color:#f97316;margin-top:8px;">Required: ' + escapeHtml(missingLabels) + '</div>';
    }

    // Check if ALL agreements in the bundle are complete
    const allComplete = draftAgreements.every(ag => checkRequiredArticles(ag.type, ag.articles));

    // Action bar
    html += '<div class="detail-actions" style="margin-top:auto;padding-top:10px;border-top:1px solid var(--border-hair);">';
    html += '<button class="detail-btn" onclick="cancelDraft()">Cancel</button>';
    if (draftAgreements.length > 1) {
        html += '<button class="detail-btn" style="margin-left:4px;font-size:0.7rem;color:var(--red);" onclick="removeAgreementTab(' + activeAgreementTab + ')">Remove</button>';
    }
    html += '<button class="detail-btn" style="color:var(--teal);border-color:var(--teal-border);" ' + (allComplete ? '' : 'disabled') + ' onclick="submitDraftTradeProposal()">Send Proposal</button>';
    html += '</div>';

    html += '</div>';
    body.innerHTML = html;
}

// ── Agreement Tabs renderer ──
function renderAgreementTabs(isAddingNew) {
    if (draftAgreements.length === 0) return '';
    let html = '<div class="agreement-tabs">';
    draftAgreements.forEach((ag, i) => {
        const ti = TRADE_AGREEMENT_TYPES[ag.type];
        const isActive = !isAddingNew && i === activeAgreementTab;
        const complete = checkRequiredArticles(ag.type, ag.articles);
        html += '<div class="agreement-tab' + (isActive ? ' active' : '') + '" onclick="switchAgreementTab(' + i + ')">';
        html += '<span class="agreement-tab-label">' + escapeHtml(ti?.shortLabel || 'AGR') + '</span>';
        html += '<span class="agreement-tab-count">' + ag.articles.length + ' art.</span>';
        if (complete) html += '<span class="agreement-tab-check">\u2713</span>';
        html += '</div>';
    });
    // "+ Add" tab if more bilateral types available
    const usedTypes = draftAgreements.map(a => a.type);
    const hasMore = Object.entries(TRADE_AGREEMENT_TYPES).some(([k, v]) => v.bilateral && !usedTypes.includes(k));
    if (hasMore) {
        html += '<div class="agreement-tab agreement-tab--add' + (isAddingNew ? ' active' : '') + '" onclick="showAddAgreementSelector()">+ Add</div>';
    }
    html += '</div>';
    return html;
}

function selectDraftTradeTarget(nationId) {
    if (!nationId) { activeDraftTarget = null; }
    else {
        const nation = cachedOtherNations.find(n => n.id === nationId);
        activeDraftTarget = nation || null;
    }
    // Reset agreements when target changes
    draftAgreements = [];
    activeAgreementTab = -1;
    addingNewAgreement = false;
    wizardTradeAgreementType = null;
    tradeArticles = [];
    reRenderTradeDraft();
}
window.selectDraftTradeTarget = selectDraftTradeTarget;

function selectDraftTradeType(typeKey) {
    const newAg = { type: typeKey, articles: [] };
    draftAgreements.push(newAg);
    activeAgreementTab = draftAgreements.length - 1;
    wizardTradeAgreementType = typeKey;
    tradeArticles = newAg.articles; // reference — mutations flow through
    addingNewAgreement = false;
    if (draftAgreements.length === 1) wizardName = '';
    reRenderTradeDraft();
}
window.selectDraftTradeType = selectDraftTradeType;

function switchAgreementTab(index) {
    if (index < 0 || index >= draftAgreements.length) return;
    activeAgreementTab = index;
    wizardTradeAgreementType = draftAgreements[index].type;
    tradeArticles = draftAgreements[index].articles;
    addingNewAgreement = false;
    reRenderTradeDraft();
}
window.switchAgreementTab = switchAgreementTab;

function showAddAgreementSelector() {
    addingNewAgreement = true;
    reRenderTradeDraft();
}
window.showAddAgreementSelector = showAddAgreementSelector;

function cancelAddAgreement() {
    addingNewAgreement = false;
    if (activeAgreementTab >= 0 && activeAgreementTab < draftAgreements.length) {
        wizardTradeAgreementType = draftAgreements[activeAgreementTab].type;
        tradeArticles = draftAgreements[activeAgreementTab].articles;
    }
    reRenderTradeDraft();
}
window.cancelAddAgreement = cancelAddAgreement;

function removeAgreementTab(index) {
    if (draftAgreements.length <= 1) return;
    draftAgreements.splice(index, 1);
    if (activeAgreementTab >= draftAgreements.length) {
        activeAgreementTab = draftAgreements.length - 1;
    }
    wizardTradeAgreementType = draftAgreements[activeAgreementTab].type;
    tradeArticles = draftAgreements[activeAgreementTab].articles;
    reRenderTradeDraft();
}
window.removeAgreementTab = removeAgreementTab;

function showDraftTradeArticleEditor() {
    const select = document.getElementById('wizard-trade-article-type');
    const articleType = select?.value;
    if (!articleType) { alert('Select an article type first.'); return; }
    const container = document.getElementById('wizard-trade-article-editor');
    if (!container) return;
    renderTradeArticleEditorLocal(container, articleType);
}
window.showDraftTradeArticleEditor = showDraftTradeArticleEditor;

function removeDraftTradeArticle(index) {
    tradeArticles.splice(index, 1);
    reRenderTradeDraft();
}
window.removeDraftTradeArticle = removeDraftTradeArticle;

function reRenderTradeDraft() {
    const body = document.getElementById('draft-body');
    const statusEl = document.getElementById('draft-status');
    if (body) renderTradeAgreementDraftPanel(body, statusEl);
}

async function submitDraftTradeProposal() {
    // Validate all agreements in the bundle have required articles
    for (const ag of draftAgreements) {
        if (!checkRequiredArticles(ag.type, ag.articles)) {
            const ti = TRADE_AGREEMENT_TYPES[ag.type];
            alert('Missing required articles for ' + (ti?.label || ag.type) + '.');
            return;
        }
    }

    // Merge all articles from all agreements, tagging each with its parent agreement type
    const mergedArticles = [];
    for (const ag of draftAgreements) {
        for (const art of ag.articles) {
            mergedArticles.push({ ...art, agreementType: ag.type });
        }
    }

    // Bridge into wizard state for submitTradeProposal()
    wizardTargetNation = activeDraftTarget?.id;
    wizardTradeAgreementType = draftAgreements[0].type; // primary type
    tradeArticles = mergedArticles;
    submitTradeProposal();
}
window.submitDraftTradeProposal = submitDraftTradeProposal;

async function renderRetaliatoryTariffDraftPanel(body, statusEl) {
    if (statusEl) { statusEl.textContent = 'Drafting'; statusEl.className = 'badge badge--amber'; }

    const apCost = 2;

    // Nation selector
    let html = '<div class="draft-panel"><div class="draft-header">';
    html += '<div class="draft-field"><div class="draft-field-label">Action</div><div class="draft-field-input">Retaliatory Tariff <span style="color:var(--red);">' + apCost + ' AP</span></div></div>';

    let targetFieldHtml = '<select id="rt-draft-target" style="width:100%;background:var(--bg-3);border:1px solid var(--border-subtle);color:var(--text-primary);font-family:var(--font-sans);font-size:12px;padding:4px 8px;" onchange="updateRTDraftTarget(this.value)">';
    targetFieldHtml += '<option value="">Select target nation...</option>';
    cachedOtherNations.forEach(n => {
        const sel = activeDraftTarget && activeDraftTarget.id === n.id ? ' selected' : '';
        targetFieldHtml += '<option value="' + n.id + '"' + sel + '>' + escapeHtml(n.name) + '</option>';
    });
    targetFieldHtml += '</select>';
    html += '<div class="draft-field"><div class="draft-field-label">Target</div>' + targetFieldHtml + '</div>';
    html += '</div>';

    if (!activeDraftTarget) {
        html += '<div class="empty-state" style="padding:20px 0;"><div class="empty-state-text">Select a target nation.</div></div></div>';
        body.innerHTML = html;
        return;
    }

    // Check for existing active RT
    const { data: existingRT } = await _supabase
        .from('trade_agreements')
        .select('id')
        .eq('status', 'active')
        .eq('agreement_type', 'retaliatory_tariff')
        .eq('nation_a_id', currentNation.id)
        .eq('nation_b_id', activeDraftTarget.id);

    if (existingRT && existingRT.length > 0) {
        html += '<div class="trade-info-box warning" style="margin:12px 14px;">You already have an active retaliatory tariff against ' + escapeHtml(activeDraftTarget.name) + '. Withdraw the existing one first.</div></div>';
        body.innerHTML = html;
        return;
    }

    html += '<div class="trade-info-box info" style="margin:8px 14px;">Impose a tariff surcharge on imports from ' + escapeHtml(activeDraftTarget.name) + '. No negotiation — your parliament ratifies.</div>';

    // Sectors
    const sectorOpts = TRADEABLE_SECTORS.map(s =>
        '<label class="trade-checkbox-option" style="margin-bottom:2px;padding:0 14px;">' +
            '<input type="checkbox" name="rt-draft-sector" value="' + s.key + '" onchange="updateRTDraftSummary()" /> ' +
            escapeHtml(s.label) +
        '</label>'
    ).join('');
    html += '<div style="padding:8px 14px 0;"><div class="draft-field-label">Sectors</div></div>';
    html += sectorOpts;

    // Surcharge rate
    html += '<div style="padding:8px 14px;">';
    html += '<div class="draft-field-label">Surcharge Rate</div>';
    html += '<div style="display:flex;align-items:center;gap:10px;margin-top:4px;">';
    html += '<input type="range" id="rt-draft-pct" min="5" max="50" value="25" style="flex:1;" oninput="updateRTDraftSummary()" />';
    html += '<span id="rt-draft-pct-display" style="font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--text-primary);min-width:36px;">25%</span>';
    html += '</div></div>';

    // Duration
    html += '<div style="padding:4px 14px;">';
    html += '<div class="draft-field-label">Duration</div>';
    html += '<div class="trade-radio-group" style="margin-top:4px;margin-bottom:6px;">';
    html += '<label class="trade-radio-option selected" onclick="selectRadioOption(this);toggleRTDraftDuration()"><input type="radio" name="rt-draft-dur" value="fixed" checked /><div><div class="trade-radio-label">Fixed Term</div></div></label>';
    html += '<label class="trade-radio-option" onclick="selectRadioOption(this);toggleRTDraftDuration()"><input type="radio" name="rt-draft-dur" value="permanent" /><div><div class="trade-radio-label">Until Revoked</div></div></label>';
    html += '</div>';
    html += '<div id="rt-draft-dur-fields"><input type="number" id="rt-draft-ticks" value="12" min="4" max="48" style="width:80px;background:var(--bg-3);border:1px solid var(--border-subtle);color:var(--text-primary);padding:4px 8px;font-size:12px;" /> <span style="font-size:0.72rem;color:var(--text-dim);">ticks</span></div>';
    html += '</div>';

    // Summary
    html += '<div id="rt-draft-summary" class="trade-info-box info" style="margin:8px 14px;">Select sectors to see impact.</div>';

    // Action bar
    html += '<div class="detail-actions" style="margin-top:auto;padding-top:10px;border-top:1px solid var(--border-hair);">';
    html += '<button class="detail-btn" onclick="cancelDraft()">Cancel</button>';
    html += '<button class="detail-btn" id="rt-draft-submit" style="color:var(--teal);border-color:var(--teal-border);" disabled onclick="submitRTDraft()">Submit for Ratification (' + apCost + ' AP)</button>';
    html += '</div></div>';
    body.innerHTML = html;
