import { DIPLOMACY_CONFIG, PROPOSAL_TYPES, WAR_JUSTIFICATIONS, TRADE_AGREEMENT_TYPES, TRADEABLE_SECTORS, TRADEABLE_SECTOR_MAP, TRADE_ARTICLE_TYPES, AID_CONDITION_STATS, MINOR_INITIATIVE_CONFIG, INITIATIVE_ARTICLE_TYPES, VISA_DURATION_OPTIONS, VISA_SCOPE_OPTIONS, VISA_DIRECTION_OPTIONS, VISA_EXCLUDES, CULTURAL_PROGRAMMES, CULTURAL_DURATION_OPTIONS, CULTURAL_FUNDING_OPTIONS, STUDENT_LEVEL_OPTIONS, STUDENT_DURATION_OPTIONS, STUDENT_FUNDING_OPTIONS, STUDENT_FIELDS, STATEMENT_VISIBILITY_OPTIONS, calculateVisaEffects, calculateCulturalEffects, calculateStudentEffects, STATE_VISIT_AGENDA_ITEMS, STATE_VISIT_TYPES, STATE_VISIT_DURATIONS, STATE_VISIT_DELEGATIONS, MAJOR_INITIATIVE_CONFIG, MAJOR_INITIATIVE_ARTICLE_TYPES, OPEN_BORDERS_SCOPE_OPTIONS, OPEN_BORDERS_DIRECTION_OPTIONS, OPEN_BORDERS_WORKER_PROTECTIONS, OPEN_BORDERS_TRANSITION_OPTIONS, EXTRADITION_SCOPE_OPTIONS, EXTRADITION_DUAL_CRIMINALITY_OPTIONS, EXTRADITION_APPEAL_OPTIONS, EXTRADITION_EXCEPTION_OPTIONS, ENVIRONMENT_EMISSION_TARGET_OPTIONS, ENVIRONMENT_RENEWABLE_TARGET_OPTIONS, ENVIRONMENT_POLLUTION_STANDARDS, ENVIRONMENT_CONSERVATION_OPTIONS, ENVIRONMENT_REVIEW_INTERVAL_OPTIONS, ENVIRONMENT_PENALTY_OPTIONS, calculateOpenBordersEffects, calculateExtraditionEffects, calculateEnvironmentalEffects, SOVEREIGNTY_CONSTRAINTS, checkCreditForTradeAgreement } from './js/game/diplomacy-constants.js';
import { syncVoteTallies } from './js/game/bills.js';
import { TRADE_SECTOR_MAP, calculateExportCapacity, calculateImportDemand, formatSectorVolume, FOOD_SUBSECTOR_MAP, isFoodSubsector, calculateFoodExportCapacity, calculateFoodImportDemand, DEFAULT_FOOD_ALLOCATION, getGlobalAverageUnitPrice, formatPricePerTonne, SECTOR_DISPLAY_UNITS } from './js/game/trade-constants.js';
import { adjustGovernmentApprovalEvent } from './js/game/momentum.js';

/**
 * Diplomacy Page
 * World map + nation sidebar with role-based diplomatic actions
 */

// ═══════════════════════════════════════════════════
// WORLD/TRADE SUBTAB NAVIGATION
// ═══════════════════════════════════════════════════

const DIPLO_SUBTABS = [
    { id: 'world', label: 'WORLD' },
    { id: 'trade', label: 'TRADE' },
];
let _diploActiveSubtab = 'world';
let _tradeInitialized = false;

let _tradeTabNeedsAttention = false;

function renderDiploSubtabs() {
    const container = document.getElementById('diplo-subtabs');
    if (!container) return;
    container.innerHTML = DIPLO_SUBTABS.map(tab => {
        const dot = ((tab.id === 'trade' || tab.id === 'world') && _tradeTabNeedsAttention)
            ? '<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);margin-left:5px;vertical-align:middle;"></span>'
            : '';
        return `<div class="diplo-subtab${_diploActiveSubtab === tab.id ? ' active' : ''}" data-tab="${tab.id}">${tab.label}${dot}</div>`;
    }).join('');
    container.onclick = (e) => {
        const el = e.target.closest('.diplo-subtab');
        if (!el || el.dataset.tab === _diploActiveSubtab) return;
        _diploActiveSubtab = el.dataset.tab;
        renderDiploSubtabs();
        showDiploSubtab();
    };
}

async function checkTradeNotifications() {
    const nationId = _worldState?.nation?.id;
    const factionId = _worldState?.faction?.id;
    if (!nationId || !factionId) { _tradeTabNeedsAttention = false; return; }

    try {
        // Load active/open negotiations for this nation
        const { data: negs } = await _supabase.from('trade_negotiations')
            .select('id, nation_a_id, nation_b_id, approved_by_a, approved_by_b')
            .or(`nation_a_id.eq.${nationId},nation_b_id.eq.${nationId}`)
            .in('status', ['open', 'active']);

        if (!negs || negs.length === 0) { _tradeTabNeedsAttention = false; return; }

        // Check 1: other party agreed but we haven't
        const weNeedToAgree = negs.some(neg => {
            const weAreA = neg.nation_a_id === nationId;
            const myApproved = weAreA ? neg.approved_by_a : neg.approved_by_b;
            const theirApproved = weAreA ? neg.approved_by_b : neg.approved_by_a;
            return theirApproved && !myApproved;
        });

        if (weNeedToAgree) { _tradeTabNeedsAttention = true; return; }

        // Check 2: recent messages from the other side (last 2 ticks)
        const currentTick = _worldState?.shard?.current_tick || 0;
        const negIds = negs.map(n => n.id);
        const { data: recentMsgs } = await _supabase.from('negotiation_messages')
            .select('id, negotiation_id, sender_nation_id')
            .in('negotiation_id', negIds)
            .neq('sender_nation_id', nationId)
            .eq('is_system', false)
            .gte('sent_at_tick', currentTick - 2)
            .limit(1);

        _tradeTabNeedsAttention = (recentMsgs && recentMsgs.length > 0);
    } catch (_) {
        _tradeTabNeedsAttention = false;
    }
}

function showDiploSubtab() {
    const worldEl = document.getElementById('subtab-world');
    const tradeEl = document.getElementById('subtab-trade');
    if (!worldEl || !tradeEl) return;

    if (_diploActiveSubtab === 'world') {
        worldEl.style.display = '';
        tradeEl.style.display = 'none';
    } else {
        worldEl.style.display = 'none';
        tradeEl.style.display = '';
        // Lazy-init trade tab on first view
        if (!_tradeInitialized) {
            _tradeInitialized = true;
            initTradeTab();
        }
    }
}

// ═══════════════════════════════════════════════════
// TRADE TAB — DATA + RENDERING
// ═══════════════════════════════════════════════════

const TRADE_SECTOR_ICONS = {
    fuel_energy: '\u26FD', minerals: '\u26CF\uFE0F', food_agriculture: '\uD83C\uDF3E',
    grains_staples: '\uD83C\uDF3E', livestock_dairy: '\uD83E\uDD6C', fruits_vegetables: '\uD83C\uDF4E',
    cash_crops: '\uD83C\uDF3F', manufactured_goods: '\uD83C\uDFED', technology: '\uD83D\uDCBB',
    arms: '\u2694\uFE0F', tourism: '\u2708\uFE0F', services_finance: '\uD83C\uDFE6',
};
const TRADE_SECTOR_LABELS = {
    fuel_energy: 'Fuel & Energy', minerals: 'Minerals', food_agriculture: 'Food & Agriculture',
    grains_staples: 'Grains & Staples', livestock_dairy: 'Livestock & Dairy',
    fruits_vegetables: 'Fruits & Veg', cash_crops: 'Cash Crops',
    manufactured_goods: 'Manufactured', technology: 'Technology',
    arms: 'Arms', tourism: 'Tourism', services_finance: 'Services & Finance',
};

let _tradeFlows = {};       // sector → { export_capacity, import_demand, export_volume, import_volume, net_flow }
let _tradeSummary = null;   // latest trade_summary row
let _tradeCommodityFilter = null;  // selected commodity key for partner highlighting
let _expandedCommodity = null;     // sector key of expanded commodity row
let _tradePartnersBilateral = [];  // trade_partners rows for this nation (import + export)

async function initTradeTab() {
    const left = document.getElementById('trade-left');
    const right = document.getElementById('trade-right');
    if (!left || !right) return;

    left.innerHTML = '<div style="padding:20px;text-align:center;font-family:var(--font-mono);font-size:9px;color:var(--text-dim);">Loading trade data...</div>';
    right.innerHTML = '';

    try {
        await loadTradeFlowData();
    } catch (err) {
        console.error('[Trade] Failed to load trade data:', err);
    }

    // Load all nations' flows for partner analysis
    try {
        await loadAllNationFlows();
    } catch (err) {
        console.error('[Trade] Failed to load partner flows:', err);
    }

    // Ensure diplomatic data is cached (same as World tab uses)
    if (!_worldRelations) {
        try {
            const [relRes, agreeRes, ambRes] = await Promise.all([
                _supabase.from('diplomatic_relations').select('*'),
                _supabase.from('trade_agreements').select('*').eq('status', 'active'),
                _supabase.from('ambassadors').select('*').eq('status', 'active'),
            ]);
            _worldRelations = relRes.data || [];
            _worldAgreements = agreeRes.data || [];
            _worldAmbassadors = ambRes.data || [];
        } catch (_) {}
    }

    // Load trade agreements + shipping data
    try {
        await Promise.all([loadTradeAgreements(), loadShippingData(), refreshTradeMinisterFlag()]);
    } catch (err) {
        console.error('[Trade] Failed to load agreements/shipping:', err);
    }

    renderTradeHeaderStats();
    renderTradeEconomy();
    renderTradeAgreements();
    renderTradePartners();
}

function renderTradeHeaderStats() {
    const el = document.getElementById('trade-header-stats');
    if (!el) return;

    // Total exports / imports / balance live on the Economy page; this header
    // only carries the agreement count, which is a diplomacy-specific figure.
    const activeCount = _tradeAgreementsList.filter(a => a.status === 'active').length;

    el.innerHTML = `<div class="tr-header-stats">
        <div class="tr-header-stat">
            <div class="tr-header-stat-label">AGREEMENTS</div>
            <div class="tr-header-stat-value">${activeCount} active</div>
        </div>
    </div>`;
}

async function loadTradeFlowData() {
    const nationId = _worldState?.nation?.id;
    if (!nationId) return;

    // Get latest trade_summary tick
    const { data: sumRows } = await _supabase.from('trade_summary')
        .select('*')
        .eq('nation_id', nationId)
        .order('tick', { ascending: false })
        .limit(1);
    _tradeSummary = sumRows?.[0] || null;

    if (!_tradeSummary) return;

    // Get trade flows for that tick
    const { data: flowRows } = await _supabase.from('trade_flows')
        .select('sector, export_capacity, export_volume, import_demand, import_volume, net_flow, price_modifier')
        .eq('nation_id', nationId)
        .eq('tick', _tradeSummary.tick);

    _tradeFlows = {};
    if (flowRows) {
        for (const row of flowRows) {
            _tradeFlows[row.sector] = row;
        }
    }

    // Load bilateral trade partners (imports to us + exports from us)
    const { data: partnerRows } = await _supabase.from('trade_partners')
        .select('exporter_nation_id, importer_nation_id, sector, trade_volume')
        .eq('tick', _tradeSummary.tick)
        .or(`exporter_nation_id.eq.${nationId},importer_nation_id.eq.${nationId}`);
    _tradePartnersBilateral = partnerRows || [];
}

// ── Trade-lane efficiency helpers (shared by commodity detail + agreements) ──
// Base 85% for every bilateral lane; +3% per active shipping claim on a route
// between our nation and the partner, capped at 100%. Counts claims across
// ALL sectors for that pair — one ship helps every commodity on that lane.
function _laneShipCountFor(partnerId) {
    const myId = _worldState?.nation?.id;
    if (!myId || !partnerId) return 0;
    let count = 0;
    for (const r of (_allShippingRoutes || [])) {
        const touchesUs = r.origin_nation_id === myId || r.destination_nation_id === myId;
        const touchesThem = r.origin_nation_id === partnerId || r.destination_nation_id === partnerId;
        if (!touchesUs || !touchesThem) continue;
        const claims = _shippingClaimsByRoute[r.id] || [];
        count += claims.length;
    }
    return count;
}
function _laneEfficiencyFor(partnerId) {
    const ships = _laneShipCountFor(partnerId);
    const pct = Math.min(100, 85 + ships * 3);
    return { pct, ships };
}
function _efficiencyBadge(eff) {
    const { pct, ships } = eff;
    // Red when still at 85% (no shipping), amber while building up, green at max.
    const color = pct >= 100 ? 'var(--green)' : pct > 85 ? 'var(--amber)' : 'var(--red)';
    const note = ships === 0
        ? 'no active shipping'
        : `+${ships * 3} for ${ships} ship${ships !== 1 ? 's' : ''} on trade route`;
    return `<span style="font-family:var(--font-mono);font-size:9px;color:${color};white-space:nowrap;">[${pct}% \u2014 ${escapeHtml(note)}]</span>`;
}

function renderTradeEconomy() {
    const left = document.getElementById('trade-left');
    if (!left) return;

    // Build commodity rows from trade flows
    const commodities = [];
    for (const [sector, flow] of Object.entries(_tradeFlows)) {
        // Skip parent food_agriculture if subsectors exist
        if (sector === 'food_agriculture' && (_tradeFlows.grains_staples || _tradeFlows.livestock_dairy)) continue;
        commodities.push({
            key: sector,
            icon: TRADE_SECTOR_ICONS[sector] || '\uD83D\uDCE6',
            name: TRADE_SECTOR_LABELS[sector] || sector,
            production: Number(flow.export_capacity) || 0,
            demand: Number(flow.import_demand) || 0,
        });
    }
    // Sort by total volume descending
    commodities.sort((a, b) => (b.production + b.demand) - (a.production + a.demand));

    const surpluses = commodities.filter(c => c.production > c.demand).sort((a, b) => (b.production - b.demand) - (a.production - a.demand));
    const deficits = commodities.filter(c => c.demand > c.production).sort((a, b) => (b.demand - b.production) - (a.demand - a.production));

    let html = '';

    // ── Commodity table ──
    html += `<div class="tr-panel">
        <div class="tr-panel-header">
            <span class="tr-panel-title">YOUR ECONOMY</span>
            <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);">${commodities.length} commodities</span>
        </div>
        <div class="tr-commodity-header">
            <span style="flex:1;">COMMODITY</span>
            <span style="width:75px;text-align:right;">PROD /MO</span>
            <span style="width:75px;text-align:right;">DEMAND /MO</span>
            <span style="width:75px;text-align:right;">BAL /MO</span>
        </div>`;

    const nationId = _worldState?.nation?.id;
    for (const c of commodities) {
        const bal = c.production - c.demand;
        const isExp = _expandedCommodity === c.key;
        const isSelected = _tradeCommodityFilter === c.key;
        const bgStyle = isExp ? 'background:var(--bg-card);' : isSelected ? (bal > 0 ? 'background:rgba(92,204,92,0.04);' : 'background:rgba(204,85,85,0.04);') : '';
        html += `<div class="tr-commodity-row" data-sector="${c.key}" style="${bgStyle}">
            <div style="flex:1;display:flex;align-items:center;gap:8px;">
                <span style="font-size:16px;">${c.icon}</span>
                <span style="font-size:14px;color:${isExp || isSelected ? 'var(--text-bright)' : 'var(--text-secondary)'};font-weight:${isExp || isSelected ? '700' : '400'};">${escapeHtml(c.name)}</span>
                ${!isExp ? '<span style="font-family:var(--font-mono);font-size:8px;color:var(--text-dim);opacity:0.5;margin-left:2px;">click to expand</span>' : ''}
            </div>
            <span style="width:75px;font-family:var(--font-mono);font-size:13px;color:var(--text-dim);text-align:right;">${fmtBudgetCurrency(c.production)}</span>
            <span style="width:75px;font-family:var(--font-mono);font-size:13px;color:var(--text-dim);text-align:right;">${fmtBudgetCurrency(c.demand)}</span>
            <span style="width:75px;font-family:var(--font-mono);font-size:14px;font-weight:700;text-align:right;color:${bal > 0 ? 'var(--green)' : bal < 0 ? 'var(--red)' : 'var(--text-dim)'};">
                ${bal === 0 ? '\u2014' : (bal > 0 ? '+' : '') + fmtBudgetCurrency(bal)}
            </span>
        </div>`;

        // Expanded detail panel
        if (isExp) {
            const flow = _tradeFlows[c.key] || {};
            const expCap = Number(flow.export_capacity) || 0;
            const impDem = Number(flow.import_demand) || 0;
            const expVol = Number(flow.export_volume) || 0;
            const impVol = Number(flow.import_volume) || 0;
            // Unmet demand = demand not covered by production + imports
            // (import_demand is theoretical; domestic production may already cover it)
            const unmetDemand = Math.max(0, impDem - expCap - impVol);

            // Unit formatting
            const unitProd = formatSectorVolume(expCap, c.key);
            const unitDem = formatSectorVolume(impDem, c.key);
            const unitImp = formatSectorVolume(impVol, c.key);
            const unitExp = formatSectorVolume(expVol, c.key);
            const unitUnmet = formatSectorVolume(unmetDemand, c.key);

            // Bilateral partners
            const importPartners = _tradePartnersBilateral
                .filter(p => p.importer_nation_id === nationId && p.sector === c.key && p.trade_volume > 0)
                .sort((a, b) => b.trade_volume - a.trade_volume);

let _shippingRoutesByAgreement = {}; // agreementId → [routes]
let _shippingClaimsByRoute = {};     // routeId → [claims with faction data]
let _shippingAppsByRoute = {};       // routeId → [pending applications]
let _allShippingRoutes = [];         // flat list of routes involving our nation
let _shippingRowExpanded = null;     // id of the currently-expanded shipping contract row
let _isTradeMinister = false;        // current faction holds the trade ministry

// The diplomacy refactor (9733595) dropped the initPage assignment to
// currentFaction/currentNation, so diplomaticRoles never populates on first
// load — which means diplomaticRoles?.isMoT is permanently false. Until that
// is restored at the page level, this flag is the authoritative MoT check for
// the shipping-accept flow. Refreshed on tab init and before every approve/reject.
async function refreshTradeMinisterFlag() {
    _isTradeMinister = false;
    const nationId = _worldState?.nation?.id;
    const factionId = _worldState?.faction?.id;
    if (!nationId || !factionId) return;
    try {
        const { data } = await _supabase.from('ministries')
            .select('party_id')
            .eq('nation_id', nationId)
            .eq('ministry_key', 'trade')
            .eq('is_active', true)
            .maybeSingle();
        _isTradeMinister = !!data && data.party_id === factionId;
    } catch (_) { _isTradeMinister = false; }
}

async function loadShippingData() {
    const nationId = _worldState?.nation?.id;
    if (!nationId) return;

    _shippingRoutesByAgreement = {};
    _allShippingRoutes = [];
    _shippingClaimsByRoute = {};
    _shippingAppsByRoute = {};

    try {
        // Pull routes that touch our nation, plus all pending applications
        // and active claims (embedded with their routes). Filter the apps +
        // claims client-side to those whose route involves our nation —
        // simpler and more reliable than pushing an or() filter onto the
        // embedded table, which has historically been flaky in postgrest.
        const routeColumns = 'id, origin_nation_id, destination_nation_id, origin_port, destination_port, trade_sector, cargo_category, goods_name, trade_volume, estimated_revenue, transit_ticks, demand_level, trade_agreement_id, trade_agreement_name, status, competition_count';
        const corpAppColumns = 'id, nation_id, faction_name, abbreviation, party_color, corp_sector, corp_subsector, corp_ticker, custom_logo_url, shipping_fleet_capacity, shipping_fleet_deployed, corp_reputation, corp_cash_reserves';
        const corpClaimColumns = 'id, nation_id, faction_name, abbreviation, party_color, corp_sector, corp_subsector, corp_ticker, custom_logo_url, corp_reputation, corp_cash_reserves';

        const [routesRes, appsRes, claimsRes] = await Promise.all([
            _supabase.from('shipping_routes')
                .select(routeColumns)
                .or(`origin_nation_id.eq.${nationId},destination_nation_id.eq.${nationId}`),
            _supabase.from('shipping_applications')
                .select(`id, route_id, faction_id, proposed_rate, status, applied_at_tick, factions!faction_id(${corpAppColumns}), shipping_routes!inner(${routeColumns})`)
                .eq('status', 'pending'),
            _supabase.from('shipping_claims')
                .select(`id, route_id, faction_id, market_share_pct, revenue_per_transit, total_revenue, transits_completed, status, factions!faction_id(${corpClaimColumns}), shipping_routes!inner(${routeColumns})`)
                .eq('status', 'active'),
        ]);

        if (routesRes.error) console.warn('[Shipping] routes query error:', routesRes.error.message);
        if (appsRes.error)   console.warn('[Shipping] apps query error:',   appsRes.error.message);
        if (claimsRes.error) console.warn('[Shipping] claims query error:', claimsRes.error.message);

        // Client-side filter: keep only apps + claims whose route touches our nation.
        const ourNation = (r) => r && (r.origin_nation_id === nationId || r.destination_nation_id === nationId);
        const apps   = (appsRes.data   || []).filter(a => ourNation(a.shipping_routes));
        const claims = (claimsRes.data || []).filter(c => ourNation(c.shipping_routes));

        // Index routes (from the dedicated query and any embedded in apps/claims).
        const routeMap = new Map();
        for (const r of (routesRes.data || [])) routeMap.set(r.id, r);
        for (const a of apps) {
            const r = a.shipping_routes;
            if (r && !routeMap.has(r.id)) routeMap.set(r.id, r);
        }
        for (const c of claims) {
            const r = c.shipping_routes;
            if (r && !routeMap.has(r.id)) routeMap.set(r.id, r);
        }

        _allShippingRoutes = Array.from(routeMap.values());
        for (const r of _allShippingRoutes) {
            if (r.trade_agreement_id) {
                if (!_shippingRoutesByAgreement[r.trade_agreement_id]) _shippingRoutesByAgreement[r.trade_agreement_id] = [];
                _shippingRoutesByAgreement[r.trade_agreement_id].push(r);
            }
        }

        for (const a of apps) {
            if (!_shippingAppsByRoute[a.route_id]) _shippingAppsByRoute[a.route_id] = [];
            _shippingAppsByRoute[a.route_id].push(a);
        }
        for (const c of claims) {
            if (!_shippingClaimsByRoute[c.route_id]) _shippingClaimsByRoute[c.route_id] = [];
            _shippingClaimsByRoute[c.route_id].push(c);
        }
    } catch (err) {
        console.warn('[Shipping] loadShippingData failed:', err);
    }
}

function getAgreementShippingInfo(agreementId) {
    const routes = _shippingRoutesByAgreement[agreementId] || [];
    if (routes.length === 0) return null;

    // Collect all unique corps servicing this agreement's routes
    const corps = [];
    const seen = new Set();
    let totalRevenue = 0;
    let totalTransits = 0;
    for (const r of routes) {
        const claims = _shippingClaimsByRoute[r.id] || [];
        for (const c of claims) {
            totalRevenue += Number(c.total_revenue) || 0;
            totalTransits += c.transits_completed || 0;
            if (c.factions && !seen.has(c.faction_id)) {
                seen.add(c.faction_id);
                corps.push({
                    name: c.factions.faction_name || 'Unknown',
                    abbr: c.factions.abbreviation || '',
                    color: c.factions.party_color || '#888',
                    sector: c.factions.corp_subsector || c.factions.corp_sector || 'Shipping',
                    share: c.market_share_pct || 0,
                    revenue: Number(c.revenue_per_transit) || 0,
                });
            }
        }
    }

    return {
        routeCount: routes.length,
        corps,
        totalRevenue,
        totalTransits,
        hasLogistics: corps.length > 0,
    };
}

// ── Shipping Application Approve / Reject ──

let _shippingApprovalPending = false;

// Core approval logic — does not prompt, alert, or toggle the pending lock.
// Callers (approveShippingApp, awardShippingContract) own UX + locking so the
// AWARD-many flow can reuse this without triggering a cascade of confirm()s.
// Returns { ok: true, eventText? } | { ok: false, error }.
async function _doApproveShippingApp(appId, routeId, corpFactionId) {
    const tick = _worldState?.shard?.current_tick || 0;

    // Read the application first so we know which vessel the corp put on offer
    // AND the service rate they proposed. Read failure is non-fatal.
    const { data: appRow, error: appReadErr } = await _supabase.from('shipping_applications')
        .select('vessel_id, proposed_rate').eq('id', appId).maybeSingle();
    if (appReadErr) console.warn('[ShippingApproval] app lookup failed:', appReadErr.message);
    const vesselId = appRow?.vessel_id || null;
    const proposedRate = Number(appRow?.proposed_rate) || 0;

    const { error: appErr } = await _supabase.from('shipping_applications')
        .update({ status: 'approved', reviewed_at_tick: tick, reviewed_by_faction_id: _worldState?.faction?.id })
        .eq('id', appId);
    if (appErr) return { ok: false, error: appErr.message };

    const { data: claimData, error: claimErr } = await _supabase.rpc('claim_shipping_route', {
        p_faction_id: corpFactionId,
        p_route_id: routeId,
        p_current_tick: tick,
    });
    const claimFailureMsg = claimErr?.message || (claimData && claimData.success === false ? claimData.error : null);
    if (claimFailureMsg) {
        // Revert the app back to pending so the MoT can try a different corp
        // (the unique index on route_id/faction_id blocks re-accept while approved).
        await _supabase.from('shipping_applications')
            .update({ status: 'pending', reviewed_at_tick: null, reviewed_by_faction_id: null })
            .eq('id', appId);
        return { ok: false, error: claimFailureMsg };
    }

    if (claimData?.claim_id) {
        // Bid becomes the per-transit payout, clamped to the service-rate band.
        if (proposedRate > 0) {
            const MIN_RATE = 250000, MAX_RATE = 750000;
            const clamped = Math.round(Math.min(MAX_RATE, Math.max(MIN_RATE, proposedRate)));
            const share   = Number(claimData.market_share) || 100;
            const revPerT = Math.round(clamped * (share / 100));
            const { error: rateErr } = await _supabase.from('shipping_claims')
                .update({ revenue_per_transit: revPerT })
                .eq('id', claimData.claim_id);
            if (rateErr) console.warn('[ShippingApproval] Service-rate update failed:', rateErr.message);
        }

        if (vesselId) {
            // Assign the offered vessel only if it's still idle; otherwise the corp
            // reassigns from their Active Voyages view.
            const { data: vesselUpd, error: vesselErr } = await _supabase.from('corp_vessels').update({
                status: 'in_transit',
                active_claim_id: claimData.claim_id,
                current_port_nation_id: null,
            })
                .eq('id', vesselId)
                .eq('faction_id', corpFactionId)
                .is('active_claim_id', null)
                .eq('status', 'in_port')
                .select('id');
            if (vesselErr) {
                console.warn('[ShippingApproval] Vessel assignment failed:', vesselErr.message);
            } else if (!vesselUpd || vesselUpd.length === 0) {
                console.warn('[ShippingApproval] Offered vessel no longer idle; corp must assign manually.');
            }
        }
    }

    // Non-critical event log.
    try {
        await _supabase.from('event_log').insert({
            nation_id: _worldState?.nation?.id,
            event_name: 'Shipping application accepted',
            category: 'trade',
            description_chosen: 'A shipping corporation has been accepted to service a trade route. Route efficiency will increase.',
            fired_at_tick: tick,
        });
    } catch (_) { /* event log failure must not surface as an approval failure */ }

    return { ok: true };
}

// Core rejection logic — parallel to _doApproveShippingApp. Reason is optional
// (awardShippingContract passes a standardised "another bid was awarded" string
// when bulk-rejecting losers).
async function _doRejectShippingApp(appId, reason) {
    const tick = _worldState?.shard?.current_tick || 0;
    const { error } = await _supabase.from('shipping_applications')
        .update({
            status: 'rejected',
            reviewed_at_tick: tick,
            reviewed_by_faction_id: _worldState?.faction?.id,
            rejection_reason: reason || null,
        })
        .eq('id', appId);
    if (error) return { ok: false, error: error.message };
    return { ok: true };
}

window.approveShippingApp = async function(appId, routeId, corpFactionId) {
    if (_shippingApprovalPending) return;
    await refreshTradeMinisterFlag();
    if (!_isTradeMinister) { alert('Only the Minister of Trade can accept shipping applications.'); return; }
    if (!confirm('Accept this shipping corporation to service this route?')) return;
    _shippingApprovalPending = true;

    try {
        const res = await _doApproveShippingApp(appId, routeId, corpFactionId);
        if (!res.ok) {
            alert('Could not activate the route: ' + res.error);
            await loadShippingData();
            renderTradeAgreements();
            return;
        }
        await loadShippingData();
        renderTradeAgreements();
    } catch (err) {
        console.error('[ShippingApproval] Error:', err);
        alert('Failed to accept application.');
    } finally {
        _shippingApprovalPending = false;
    }
};

window.rejectShippingApp = async function(appId) {
    if (_shippingApprovalPending) return;
    await refreshTradeMinisterFlag();
    if (!_isTradeMinister) { alert('Only the Minister of Trade can reject shipping applications.'); return; }
    const reason = prompt('Rejection reason (optional):') || '';
    _shippingApprovalPending = true;

    try {
        const res = await _doRejectShippingApp(appId, reason);
        if (!res.ok) { alert('Failed to reject: ' + res.error); return; }

        await loadShippingData();
        renderTradeAgreements();
    } catch (err) {
        console.error('[ShippingReject] Error:', err);
        alert('Failed to reject application.');
    } finally {
        _shippingApprovalPending = false;
    }
};
