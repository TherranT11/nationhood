// ==================== TRADE NEGOTIATION PANEL ====================
async function openTradeNegotiation(negotiationId) {
    // Show the negotiation details in the draft initiative box
    const panel = document.getElementById('draft-body');
    if (!panel) return;

    activeDraftAction = null;

    // Scroll the draft box into view
    const draftBox = document.getElementById('box-draft');
    if (draftBox) draftBox.scrollIntoView({ behavior: 'smooth', block: 'start' });

    // Update draft status badge
    const statusEl = document.getElementById('draft-status');
    if (statusEl) statusEl.textContent = 'Viewing';

    const { data: neg, error } = await _supabase
        .from('trade_negotiations')
        .select('*')
        .eq('id', negotiationId)
        .single();

    if (error || !neg) {
        alert('Could not load negotiation.');
        return;
    }

    const typeInfo = neg.agreement_type && neg.agreement_type !== 'pending' ? TRADE_AGREEMENT_TYPES[neg.agreement_type] : null;
    const typePending = !typeInfo;  // true if agreement type hasn't been chosen yet

    // Fetch nation names
    const partnerId = neg.nation_a_id === currentNation.id ? neg.nation_b_id : neg.nation_a_id;
    const { data: partnerNation } = await _supabase.from('nations').select('id, name').eq('id', partnerId).single();
    const partnerName = partnerNation?.name || 'Unknown';

    const ticksLeft = neg.expires_at_tick - shardTick;
    const statusClass = ticksLeft <= 2 ? 'expiring' : ticksLeft <= 0 ? 'expired' : 'active';
    const participants = neg.participants || [];
    const draftArticles = neg.draft_articles || [];

    const iconHtml = typeInfo ? (TRADE_TYPE_ICONS[typeInfo.icon] || '') : '&#128220;';
    const typeLabel = typeInfo ? escapeHtml(typeInfo.label) : 'Trade Negotiations';
    const typeIconClass = typeInfo ? typeInfo.icon : 'chart';

    // Determine if we're the recipient of an open negotiation (not yet in participants)
    const isRecipientOfOpen = neg.status === 'open' && !participants.some(p => p.nation_id === currentNation.id);

    // Fetch linked proposal if we're the recipient (needed for accept/reject)
    let linkedProposal = null;
    if (isRecipientOfOpen) {
        // Try target_nation_id first (standard case), then proposing_nation_id as fallback
        const { data: proposals, error: propErr } = await _supabase
            .from('diplomatic_proposals')
            .select('*')
            .eq('proposal_type', 'trade_negotiation')
            .in('status', ['proposed', 'revised'])
            .or('target_nation_id.eq.' + currentNation.id + ',proposing_nation_id.eq.' + currentNation.id);
        if (proposals) {
            linkedProposal = proposals.find(p => p.proposal_data?.negotiation_id === neg.id) || null;
        }
    }

    const openStatusText = isRecipientOfOpen ? 'AWAITING YOUR RESPONSE' : 'AWAITING ACCEPTANCE';

    let html = `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
            <button class="wizard-back-btn" onclick="renderInitiativeWizard()" style="padding:5px 10px;font-size:0.72rem;">Back</button>
            <div class="trade-type-icon ${typeIconClass}" style="width:28px;height:28px;font-size:0.9rem;">${iconHtml}</div>
            <div>
                <div style="font-size:0.95rem;font-weight:bold;color:var(--text-primary);">${escapeHtml(neg.agreement_name || 'Unnamed')}</div>
                <div style="font-size:0.7rem;color:var(--text-muted);">${typeLabel} with ${escapeHtml(partnerName)}</div>
            </div>
        </div>

        <div class="trade-neg-status">
            <div>
                <div class="trade-neg-status-label">Negotiations</div>
                <div style="font-size:0.7rem;color:var(--text-muted);">Opened tick ${neg.opened_at_tick}</div>
            </div>
            <div style="text-align:right;">
                <div class="trade-neg-status-value ${neg.status === 'ratification' ? 'active' : neg.status === 'ratification_failed' ? 'expiring' : neg.status === 'concluded' ? 'active' : statusClass}">
                    ${neg.status === 'open' ? openStatusText : neg.status === 'ratification' ? 'AWAITING PARLIAMENT' : neg.status === 'ratification_failed' ? 'RATIFICATION FAILED' : neg.status === 'concluded' ? 'RATIFIED &amp; ACTIVE' : ticksLeft + ' ticks remaining'}
                </div>
                <div style="font-size:0.62rem;color:var(--text-dim);">${neg.status === 'ratification' || neg.status === 'concluded' || neg.status === 'ratification_failed' ? 'Both sides approved' : 'Expires tick ' + neg.expires_at_tick}</div>
            </div>
        </div>
    `;

    // Participants
    html += '<div class="diplo-section-title">Participants</div>';
    if (participants.length === 0) {
        html += '<div style="color:var(--text-dim);font-size:0.78rem;font-style:italic;padding:4px 0;">No participants yet.</div>';
    } else {
        for (const p of participants) {
            const roleLabel = p.role === 'ambassador' ? 'Ambassador' : p.role === 'trade_minister' ? 'Minister of Trade' : p.role === 'foreign_minister' ? 'Foreign Minister' : p.role === 'prime_minister' ? 'Prime Minister' : 'Head of Government';
            const roleClass = p.role === 'ambassador' ? 'role-amb' : p.role === 'trade_minister' ? 'role-mot' : p.role === 'foreign_minister' ? 'role-fm' : 'role-hog';
            const isOurNation = p.nation_id === currentNation.id;
            html += `
                <div style="display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--bg-body);border:1px solid var(--border-light);border-radius:4px;margin-bottom:4px;">
                    <span class="diplo-role-badge ${roleClass}">${roleLabel}</span>
                    <span style="font-size:0.78rem;color:var(--text-primary);">${isOurNation ? escapeHtml(currentNation.name) : escapeHtml(partnerName)}</span>
                    <span style="font-size:0.68rem;color:var(--text-dim);margin-left:auto;">Joined tick ${p.joined_at_tick}</span>
                </div>
            `;
        }
    }

    // Check if MoT has joined for each nation
    const ourMoTJoined = participants.some(p => p.nation_id === currentNation.id && p.role === 'trade_minister');
    const partnerMoTJoined = participants.some(p => p.nation_id === partnerId && p.role === 'trade_minister');

    // Show MoT requirement warning if ambassador-initiated and MoT hasn't joined
    if (neg.status === 'active' && (!ourMoTJoined || !partnerMoTJoined)) {
        const motDeadline = DIPLOMACY_CONFIG.MOT_JOIN_DEADLINE_TICKS;
        const ticksSinceActive = shardTick - neg.opened_at_tick;
        const ticksRemaining = motDeadline - ticksSinceActive;
        let warningMsg = '';
        if (!ourMoTJoined && !partnerMoTJoined) {
            warningMsg = 'Both nations\' Ministers of Trade must join within ' + motDeadline + ' tick' + (motDeadline !== 1 ? 's' : '') + ' or negotiations will be cancelled.';
        } else if (!ourMoTJoined) {
            warningMsg = 'Your Minister of Trade must join within ' + motDeadline + ' tick' + (motDeadline !== 1 ? 's' : '') + ' or negotiations will be cancelled.';
        } else {
            warningMsg = escapeHtml(partnerName) + '\'s Minister of Trade must join within ' + motDeadline + ' tick' + (motDeadline !== 1 ? 's' : '') + ' or negotiations will be cancelled.';
        }
        if (ticksRemaining > 0) {
            warningMsg += ' (' + ticksRemaining + ' tick' + (ticksRemaining !== 1 ? 's' : '') + ' remaining)';
        }
        html += '<div class="trade-info-box warning" style="margin-top:8px;">' + warningMsg + '</div>';
    }

    // Can FM, PM, or MoT join?
    const myParticipant = participants.find(p => p.faction_id === currentFaction.id);
    if (!myParticipant && neg.status === 'active') {
        const isFM = diplomaticRoles.isFM;
        const isPM = diplomaticRoles.isHoG;
        const isMoT = diplomaticRoles.isMoT;
        if (isMoT) {
            const joinCost = DIPLOMACY_CONFIG.JOIN_NEGOTIATION_MOT_AP;
            html += `
                <div style="margin-top:8px;">
                    <button class="wizard-next-btn" onclick="joinTradeNegotiation('${neg.id}', 'trade_minister', ${joinCost})">
                        Join as Minister of Trade (${joinCost} AP)
                    </button>
                </div>
            `;
        }
        if (isFM || isPM) {
            const joinCost = isPM ? DIPLOMACY_CONFIG.JOIN_NEGOTIATION_PM_AP : DIPLOMACY_CONFIG.JOIN_NEGOTIATION_FM_AP;
            const joinRole = isPM ? 'Prime Minister' : 'Foreign Minister';
            html += `
                <div style="margin-top:8px;">
                    <button class="wizard-next-btn" onclick="joinTradeNegotiation('${neg.id}', '${isPM ? 'prime_minister' : 'foreign_minister'}', ${joinCost})">
                        Join as ${joinRole} (${joinCost} AP)
                    </button>
                </div>
            `;
        }
    }

    // ── If status is 'open', show accept buttons for recipient or waiting message for proposer ──
    if (neg.status === 'open') {
        if (isRecipientOfOpen) {
            // Recipient view: show accept/reject buttons
            html += `
                <div class="trade-info-box info" style="margin-top:16px;">
                    ${escapeHtml(partnerName)} has proposed opening trade negotiations with your nation.
                    If you accept, the negotiation table opens and both sides can choose an agreement type and draft terms together.
                </div>
            `;
            if (hasAnyDiplomaticRole()) {
                const apCost = DIPLOMACY_CONFIG.ACCEPT_TRADE_NEGOTIATION_AP;
                const proposalId = linkedProposal ? linkedProposal.id : '';
                html += `
                    <div class="inbox-card-actions" style="margin-top:12px;">
                        <button class="proposal-accept-btn" onclick="acceptTradeNegotiation('${proposalId}', '${neg.id}')">Begin Negotiations (${apCost} AP)</button>
                        <button class="proposal-reject-btn" onclick="rejectTradeNegotiation('${proposalId}', '${neg.id}')">Reject</button>
                    </div>
                `;
            }
        } else {
            // Proposer view: show waiting message
            html += `
                <div class="trade-info-box info" style="margin-top:16px;">
                    Waiting for ${escapeHtml(partnerName)}'s ambassador to accept these negotiations.
                    Once they accept, the negotiation table opens and you can choose an agreement type together.
                </div>
            `;

            // Cancel button for the proposer (requires a diplomatic role)
            const myPart = participants.find(p => p.nation_id === currentNation.id);
            if (myPart && hasAnyDiplomaticRole()) {
                html += `
                    <div style="margin-top:12px;">
                        <button class="proposal-reject-btn" style="font-size:0.72rem;padding:5px 12px;" onclick="cancelTradeNegotiation('${neg.id}')">Cancel Negotiations</button>
                    </div>
                `;
            }
        }

        panel.innerHTML = html;
        return;
    }

    // ── If status is 'active' and agreement type not yet chosen, show type selection cards ──
    if (neg.status === 'active' && typePending && myParticipant) {
        html += '<div class="diplo-section-title" style="margin-top:16px;">Choose Agreement Type</div>';
        html += '<p style="font-size:0.78rem;color:var(--text-muted);margin-bottom:10px;">Select what kind of trade agreement to negotiate:</p>';
        html += '<div class="trade-type-grid">';

        for (const [key, tInfo] of Object.entries(TRADE_AGREEMENT_TYPES)) {
            // Skip unilateral-only types (retaliatory tariff, export subsidy) — those use MoT draft panels
            if (tInfo.category === 'unilateral') continue;
            const tIconHtml = TRADE_TYPE_ICONS[tInfo.icon] || '';
            html += `
                <div class="trade-type-card" onclick="selectNegotiationType('${neg.id}', '${key}')">
                    <div class="trade-type-icon ${tInfo.icon}">${tIconHtml}</div>
                    <div class="trade-type-label">${escapeHtml(tInfo.label)}</div>
                    <div class="trade-type-short">${escapeHtml(tInfo.shortLabel)}</div>
                    <div class="trade-type-desc">${escapeHtml(tInfo.description)}</div>
                    <div style="margin-top:6px;font-size:0.62rem;color:var(--text-dim);">${tInfo.bilateral ? 'Bilateral' : 'Unilateral'}</div>
                </div>
            `;
        }
        html += '</div>';

        // Cancel button (requires a diplomatic role)
        if (hasAnyDiplomaticRole()) {
            html += `
                <div style="margin-top:12px;">
                    <button class="proposal-reject-btn" style="font-size:0.72rem;padding:5px 12px;" onclick="cancelTradeNegotiation('${neg.id}')">Cancel Negotiations</button>
                </div>
            `;
        }

        panel.innerHTML = html;
        return;
    }

    // ── If type pending but user is not a participant, show waiting ──
    if (typePending) {
        html += '<div class="trade-info-box info" style="margin-top:16px;">Waiting for a participant to select the agreement type.</div>';
        panel.innerHTML = html;
        return;
    }

    // ── Agreement type is set — show article drafting ──
    // Draft Articles
    html += '<div class="diplo-section-title" style="margin-top:16px;">Draft Articles</div>';
    if (draftArticles.length === 0) {
        html += '<div style="color:var(--text-dim);font-size:0.78rem;font-style:italic;padding:4px 0;">No articles drafted yet. Add articles below.</div>';
    } else {
        for (let i = 0; i < draftArticles.length; i++) {
            const art = draftArticles[i];
            const artType = TRADE_ARTICLE_TYPES[art.type];
            html += `
                <div class="trade-article-card">
                    <div class="trade-article-card-header">
                        <span class="trade-article-card-type">Art. ${toRoman(i + 1)} &mdash; ${escapeHtml(artType?.label || art.type)}</span>
                        <button class="initiative-article-remove" onclick="removeTradeNegArticle('${neg.id}', ${i})">X</button>
                    </div>
                    <div class="trade-article-card-summary">${renderTradeArticleSummary(art)}</div>
                </div>
            `;
        }
    }

    // Add article button (only if user is a participant)
    if (myParticipant && neg.status === 'active') {
        const availableTypes = getAvailableArticleTypes(neg.agreement_type, draftArticles);
        if (availableTypes.length > 0) {
            const opts = availableTypes.map(t =>
                '<option value="' + t.key + '">' + escapeHtml(t.label) + (t.required ? ' (Required)' : ' (Optional)') + '</option>'
            ).join('');
            html += `
                <div class="trade-add-article-bar" style="margin-top:8px;">
                    <select id="trade-add-article-select">${opts}</select>
                    <button onclick="addTradeNegArticle('${neg.id}')">+ Add Article</button>
                </div>
                <div id="trade-article-editor"></div>
            `;
        }
    }

    // Extend / Approve / Cancel buttons
    if (neg.status === 'active' && myParticipant) {
        html += '<div class="diplo-section-title" style="margin-top:16px;">Actions</div>';
        html += '<div style="display:flex;gap:6px;flex-wrap:wrap;">';

        // Extend negotiations (requires a diplomatic role)
        const weAreA = currentNation.id === neg.nation_a_id;
        const alreadyRequested = weAreA ? neg.extension_requested_a : neg.extension_requested_b;
        if (hasAnyDiplomaticRole()) {
            if (!alreadyRequested && neg.extensions_used < DIPLOMACY_CONFIG.NEGOTIATION_MAX_EXTENSIONS) {
                html += '<button class="wizard-next-btn" style="font-size:0.72rem;padding:5px 12px;" onclick="extendNegotiation(\'' + neg.id + '\')">Extend Negotiations (+' + DIPLOMACY_CONFIG.NEGOTIATION_EXTENSION_TICKS + ' ticks)</button>';
            } else if (alreadyRequested) {
                html += '<span style="font-size:0.72rem;color:var(--text-muted);padding:5px 0;">Extension requested — waiting for partner</span>';
            }
        }

        // Approve (highest representative)
        const hasRequiredArticles = checkRequiredArticles(neg.agreement_type, draftArticles);
        if (hasRequiredArticles) {
            const weApproved = weAreA ? neg.approved_by_a : neg.approved_by_b;
            if (!weApproved) {
                html += '<button class="proposal-accept-btn" style="font-size:0.72rem;padding:5px 12px;" onclick="approveTradeNegotiation(\'' + neg.id + '\')">Approve Agreement</button>';
            } else {
                html += '<span style="font-size:0.72rem;color:#4ade80;padding:5px 0;">You have approved &mdash; awaiting partner</span>';
            }
        }

        // Cancel (requires a diplomatic role)
        if (hasAnyDiplomaticRole()) {
            html += '<button class="proposal-reject-btn" style="font-size:0.72rem;padding:5px 12px;" onclick="cancelTradeNegotiation(\'' + neg.id + '\')">Cancel Negotiations</button>';
        }
        html += '</div>';
    }

    // Ratification status display
    if (neg.status === 'ratification') {
        html += '<div class="diplo-section-title" style="margin-top:16px;">Parliament Ratification</div>';
        html += '<div class="trade-info-box info" style="margin-bottom:8px;">Both sides have approved this agreement. Ratification bills are now before both parliaments.</div>';

        // Show bill links/status for each nation
        const nationALabel = neg.nation_a_id === currentNation.id ? currentNation.name : partnerName;
        const nationBLabel = neg.nation_b_id === currentNation.id ? currentNation.name : partnerName;
        const billIds = [
            { label: nationALabel, billId: neg.bill_a_id, nationId: neg.nation_a_id },
            { label: nationBLabel, billId: neg.bill_b_id, nationId: neg.nation_b_id }
        ];

        // Fetch bill statuses
        for (const entry of billIds) {
            let billStatus = 'unknown';
            if (entry.billId) {
                const { data: bData } = await _supabase.from('bills').select('status').eq('id', entry.billId).single();
                billStatus = bData?.status || 'unknown';
            }
            const statusColor = billStatus === 'passed' ? '#4ade80' : billStatus === 'failed' ? '#ef4444' : billStatus === 'floor' ? '#facc15' : '#666';
            const statusText = billStatus === 'passed' ? 'RATIFIED' : billStatus === 'failed' ? 'REJECTED' : billStatus === 'floor' ? 'VOTING' : 'PENDING';
            const isOurs = entry.nationId === currentNation.id;
            const linkHtml = isOurs && entry.billId ? ' <a href="bill.html?id=' + entry.billId + '" style="color:var(--accent);font-size:0.7rem;text-decoration:underline;">View Bill</a>' : '';
            html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--bg-body);border:1px solid var(--border-light);border-radius:4px;margin-bottom:4px;">';
            html += '<span style="font-size:0.8rem;color:var(--text-primary);">' + (isOurs ? escapeHtml(currentNation.name) : escapeHtml(entry.label)) + '\'s Parliament' + linkHtml + '</span>';
            html += '<span style="font-size:0.72rem;font-weight:bold;color:' + statusColor + ';">' + statusText + '</span>';
            html += '</div>';
        }
    }

    if (neg.status === 'ratification_failed') {
        html += '<div class="diplo-section-title" style="margin-top:16px;">Ratification Failed</div>';
        html += '<div class="trade-info-box warning">One or both parliaments rejected the ratification bill. This trade agreement will not take effect.</div>';
    }

    if (neg.status === 'concluded') {
        html += '<div class="diplo-section-title" style="margin-top:16px;">Agreement Active</div>';
        html += '<div class="trade-info-box info">Both parliaments have ratified this agreement. The trade agreement is now active and in effect.</div>';
    }

    panel.innerHTML = html;
}

// ── Select agreement type during active negotiations ──
async function selectNegotiationType(negotiationId, agreementType) {
    const typeInfo = TRADE_AGREEMENT_TYPES[agreementType];
    if (!typeInfo) return;

    if (!confirm('Set this negotiation to "' + typeInfo.label + '"? Both sides will draft articles for this type.')) return;

    const { error } = await _supabase.from('trade_negotiations').update({
        agreement_type: agreementType
    }).eq('id', negotiationId);

    if (error) {
        console.error('Error setting agreement type:', error);
        alert('Error: ' + error.message);
        return;
    }

    // Re-render the negotiation panel
    await openTradeNegotiation(negotiationId);
}

function renderTradeEffectSummary(articles) {
    if (!articles || !articles.length) return '';
    const tags = [];
    for (const art of articles) {
        const d = (art.data && Object.keys(art.data).length > 0) ? art.data : art;
        switch (art.type) {
            case 'tariff_reduction': {
                const sec = TRADEABLE_SECTOR_MAP[d.sector];
                tags.push({ label: (sec?.label || d.sector || '?') + ' -' + (d.reduction_pct || 0) + '%' + (d.direction === 'mutual' ? ' (mutual)' : ''), cls: 'effect-tag--positive' });
                break;
            }
            case 'subsidized_sector': {
                const sec = TRADEABLE_SECTOR_MAP[d.sector];
                tags.push({ label: (sec?.label || d.sector || '?') + ' +' + (d.subsidy_pct || 0) + '% Subsidy', cls: 'effect-tag--info' });
                break;
            }
            case 'aid_terms': {
                const amt = Number(d.annual_amount || 0);
                const amtStr = amt >= 1e9 ? '$' + (amt / 1e9).toFixed(1) + 'B' : '$' + (amt / 1e6).toFixed(0) + 'M';
                const dir = d.aid_direction === 'request' ? 'Receive ' : 'Provide ';
                tags.push({ label: dir + amtStr + '/yr', cls: d.aid_direction === 'request' ? 'effect-tag--money-pos' : 'effect-tag--money-neg' });
                break;
            }
            case 'breach_penalty':
                if (d.relations_penalty) tags.push({ label: '-' + d.relations_penalty + ' Rel penalty', cls: 'effect-tag--warning' });
                if (d.financial_penalty) tags.push({ label: '$' + d.financial_penalty + 'M penalty', cls: 'effect-tag--warning' });
                break;
            case 'supply_commitment':
                tags.push({ label: (d.commitment_pct || 0) + '% Commitment', cls: 'effect-tag--neutral' });
                break;
        }
    }
    if (!tags.length) return '';
    return '<div class="article-effects">' + tags.map(t => '<span class="effect-tag ' + t.cls + '">' + escapeHtml(t.label) + '</span>').join('') + '</div>';
}

function renderTradeArticleSummary(article) {
    if (!article || !article.type) return 'Unknown article';

    // Defensive: support both { type, data: {...} } and flat { type, sector, ... } formats
    const d = (article.data && Object.keys(article.data).length > 0) ? article.data : article;

    switch (article.type) {
        case 'duration': {
            if (d.duration_type === 'permanent') return 'Permanent (until one party withdraws). Withdrawal notice: ' + (d.withdrawal_notice_ticks || 3) + ' ticks.';
            return 'Fixed term: ' + (d.duration_ticks || '?') + ' ticks' + (d.auto_renew ? ' (auto-renew)' : '') + '. Withdrawal notice: ' + (d.withdrawal_notice_ticks || 3) + ' ticks.';
        }
        case 'sector_exemption': {
            const sector = TRADEABLE_SECTOR_MAP[d.sector];
            return 'Exempt: ' + (sector?.label || d.sector || 'Unknown') + (d.reason ? ' — ' + escapeHtml(d.reason) : '');
        }
        case 'tariff_reduction': {
            const sector = TRADEABLE_SECTOR_MAP[d.sector];
            const dirLabel = d.direction === 'mutual' ? 'Mutual' : d.direction === 'your_exports' ? 'Your exports' : 'Their exports';
            return (sector?.label || d.sector || 'Unknown') + ': ' + dirLabel + ' tariff reduction of ' + (d.reduction_pct || 0) + '%';
        }
        case 'supply_commitment': {
            const sector = TRADEABLE_SECTOR_MAP[d.sector];
            const dirLabel = d.direction === 'we_buy' ? 'We buy from them' : 'We sell to them';
            return (sector?.label || d.sector || 'Unknown') + ': ' + dirLabel + ', min ' + (d.commitment_pct || 0) + '% commitment';
        }
        case 'price_terms': {
            const labels = { market: 'Market rate', fixed: 'Fixed rate', discounted: 'Discounted (' + (d.modifier_pct || 0) + '% below market)', premium: 'Premium (' + (d.modifier_pct || 0) + '% above market)' };
            return labels[d.price_type] || 'Unknown pricing';
        }
        case 'breach_penalty': {
            const parts = [];
            if (d.relations_penalty) parts.push('-' + d.relations_penalty + ' Relations');
            if (d.reputation_penalty) parts.push('-' + d.reputation_penalty + ' Reputation');
            if (d.financial_penalty) parts.push('$' + d.financial_penalty + 'M penalty');
            return parts.join(', ') || 'No penalties defined';
        }
        case 'subsidized_sector': {
            const sector = TRADEABLE_SECTOR_MAP[d.sector];
            return (sector?.label || d.sector || 'Unknown') + ' exports subsidized at ' + (d.subsidy_pct || 0) + '%';
        }
        case 'funding_source': {
            return d.source === 'ministry_budget' ? 'Funded from Ministry of Trade budget' : 'Funded from general treasury';
        }
        case 'text_article': {
            return (d.title ? escapeHtml(d.title) + ': ' : '') + escapeHtml(d.body || '');
        }
        case 'aid_terms': {
            const amt = Number(d.annual_amount || 0);
            const amtLabel = amt >= 1e9 ? '$' + (amt / 1e9).toFixed(1) + 'B' : amt >= 1e6 ? '$' + (amt / 1e6).toFixed(0) + 'M' : '$' + amt.toLocaleString();
            const dirLabel = d.aid_direction === 'request' ? 'We receive' : 'We provide';
            return dirLabel + ': ' + amtLabel + '/yr (GDP cap: ' + (d.gdp_cap_pct || 10) + '%)';
        }
        case 'aid_condition': {
            const stat = AID_CONDITION_STATS.find(s => s.key === d.stat_key);
            const label = stat ? stat.label : (d.stat_key || 'Unknown');
            const op = d.operator === 'lte' ? '\u2264' : '\u2265';
            const failLabels = { suspend: 'Suspend', terminate: 'Terminate', reduce: 'Reduce' };
            return escapeHtml(label) + ' ' + op + ' ' + (d.threshold || 0) + ' (on failure: ' + (failLabels[d.on_failure] || d.on_failure) + ', grace: ' + (d.grace_periods || 0) + ')';
        }
        case 'tariff_surcharge': {
            const sector = TRADEABLE_SECTOR_MAP[d.sector];
            return (sector?.label || d.sector || 'Unknown') + ': +' + (d.surcharge_pct || 0) + '% tariff surcharge';
        }
        default:
            return 'Unknown article type: ' + article.type;
    }
}

function getTradeTypeExplainer(agreementType) {
    switch (agreementType) {
        case 'fta':
            return 'An FTA eliminates tariffs on <strong>all 6 trade sectors</strong> by default. '
                + 'You only need a Duration article. Optionally add <strong>Sector Exemption</strong> articles to protect specific industries from free trade.';
        case 'pta':
            return 'A PTA lets you negotiate <strong>sector-by-sector</strong> tariff reductions. '
                + 'Add one or more <strong>Tariff Reduction</strong> articles specifying which sectors get reduced tariffs and by how much.';
        case 'resource_supply':
            return 'An RSC guarantees a <strong>minimum purchase volume</strong> of a raw resource (fuel, minerals, or food). '
                + 'You must set the <strong>Supply Commitment</strong> (who buys/sells and how much) and <strong>Price Terms</strong> (market, fixed, discount, or premium).';
        case 'economic_aid':
            return 'An aid agreement commits the <strong>donor</strong> to annual funding that appears as revenue in the <strong>recipient\'s</strong> budget. '
                + 'Optionally attach <strong>Conditions</strong> (e.g. maintain corruption below 40) — failure triggers suspension or termination at annual review.';
        default:
            return '';
    }
}

function getAvailableArticleTypes(agreementType, existingArticles) {
    const typeConfig = TRADE_AGREEMENT_TYPES[agreementType];
    if (!typeConfig) return [];

    const allArticleKeys = [...(typeConfig.required_articles || []), ...(typeConfig.optional_articles || [])];
    const existingTypes = existingArticles.map(a => a.type);

    const available = [];
    for (const key of allArticleKeys) {
        const artType = TRADE_ARTICLE_TYPES[key];
        if (!artType) continue;
        // If not repeatable and already exists, skip
        if (!artType.repeatable && existingTypes.includes(key)) continue;
        const isRequired = (typeConfig.required_articles || []).includes(key);
        available.push({ key: key, label: artType.label, required: isRequired });
    }
    return available;
}

function checkRequiredArticles(agreementType, draftArticles) {
    const typeConfig = TRADE_AGREEMENT_TYPES[agreementType];
    if (!typeConfig) return false;
    const existingTypes = new Set(draftArticles.map(a => a.type));
    return (typeConfig.required_articles || []).every(req => existingTypes.has(req));
}

async function joinTradeNegotiation(negotiationId, role, apCost) {
    if (!await requireNegStatus(negotiationId, ['active'], () => openTradeNegotiation(negotiationId))) return;
    if (!confirm('Join trade negotiations as ' + role.replace('_', ' ') + '? This costs ' + apCost + ' AP.')) return;

    const apResult = await deductAP(_supabase, currentFaction.id, apCost);
    if (!apResult.success) {
        if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
        alert('Not enough AP. Need ' + apCost + ' AP, have ' + (apResult.currentAp ?? '?') + '.');
        return;
    }
    currentFaction.action_points = apResult.newAp;

    const neg = await fetchNegotiation(negotiationId, 'participants');
    if (!neg) return;
    const participants = neg.participants || [];
    participants.push({ faction_id: currentFaction.id, role, joined_at_tick: shardTick, nation_id: currentNation.id });

    await _supabase.from('trade_negotiations').update({ participants }).eq('id', negotiationId);
    await openTradeNegotiation(negotiationId);
}

async function extendNegotiation(negotiationId) {
    await refreshRoles();
    if (!hasAnyDiplomaticRole()) {
        alert('You need a diplomatic role to extend negotiations.');
        return;
    }

    const neg = await fetchNegotiation(negotiationId);
    if (!neg) return;

    const weAreA = currentNation.id === neg.nation_a_id;
    const updateCol = weAreA ? 'extension_requested_a' : 'extension_requested_b';
    const otherRequested = weAreA ? neg.extension_requested_b : neg.extension_requested_a;

    if (otherRequested) {
        // Both sides agreed — extend
        const newExpiry = neg.expires_at_tick + DIPLOMACY_CONFIG.NEGOTIATION_EXTENSION_TICKS;
        await _supabase.from('trade_negotiations').update({
            expires_at_tick: newExpiry,
            extension_requested_a: false,
            extension_requested_b: false,
            extensions_used: (neg.extensions_used || 0) + 1
        }).eq('id', negotiationId);
        alert('Negotiations extended by ' + DIPLOMACY_CONFIG.NEGOTIATION_EXTENSION_TICKS + ' ticks!');
    } else {
        await _supabase.from('trade_negotiations').update({ [updateCol]: true }).eq('id', negotiationId);
        alert('Extension requested. Waiting for the other party to agree.');
    }

    await openTradeNegotiation(negotiationId);
}

async function cancelTradeNegotiation(negotiationId) {
    await refreshRoles();
    if (!hasAnyDiplomaticRole()) {
        alert('You need a diplomatic role to cancel negotiations.');
        return;
    }
    if (!await requireNegStatus(negotiationId, ['open', 'active'], renderInitiativeWizard)) return;
    if (!confirm('Cancel these trade negotiations? This cannot be undone.')) return;

    await _supabase.from('trade_negotiations').update({
        status: 'cancelled', concluded_at_tick: shardTick
    }).eq('id', negotiationId);

    // Reject any linked proposals still pending
    await _supabase.from('diplomatic_proposals')
        .update({ status: 'rejected' })
        .eq('proposal_type', 'trade_negotiation')
        .in('status', ['proposed', 'revised'])
        .or('target_nation_id.eq.' + currentNation.id + ',proposing_nation_id.eq.' + currentNation.id);

    alert('Trade negotiations cancelled.');
    await renderInitiativeWizard();
}

async function addTradeNegArticle(negotiationId) {

}

async function removeTradeNegArticle(negotiationId, index) {
    if (!confirm('Remove this article?')) return;

    const neg = await fetchNegotiation(negotiationId, 'draft_articles');
    if (!neg) return;

    const articles = neg.draft_articles || [];
    articles.splice(index, 1);

    await _supabase.from('trade_negotiations').update({ draft_articles: articles }).eq('id', negotiationId);
    await openTradeNegotiation(negotiationId);
}

async function approveTradeNegotiation(negotiationId) {
    const neg = await fetchNegotiation(negotiationId);
    if (!neg) return;
    if (neg.status !== 'active') {
        alert('This negotiation is not active (status: ' + neg.status + ').');
        await openTradeNegotiation(negotiationId);
        return;
    }
    if (!checkRequiredArticles(neg.agreement_type, neg.draft_articles || [])) {
        alert('Cannot approve: missing required articles.');
        return;
    }
    if (!confirm('Approve this trade agreement? Once both sides approve, ratification bills will be auto-generated in both parliaments.')) return;

    const weAreA = currentNation.id === neg.nation_a_id;
    const side = weAreA ? 'a' : 'b';
    const myRole = (neg.participants || []).find(p => p.faction_id === currentFaction.id)?.role || 'ambassador';

    const updateData = {
        ['approved_by_' + side]: currentFaction.id,
        ['approved_by_' + side + '_role']: myRole,
        ['approved_at_' + side + '_tick']: shardTick
    };

    const otherApproved = weAreA ? neg.approved_by_b : neg.approved_by_a;
    if (otherApproved) {
        updateData.status = 'ratification';

        // Fetch both nation names in parallel
        const [{ data: nationA }, { data: nationB }] = await Promise.all([
            _supabase.from('nations').select('name').eq('id', neg.nation_a_id).single(),
            _supabase.from('nations').select('name').eq('id', neg.nation_b_id).single()
        ]);
        const nameA = nationA?.name || 'Unknown';
        const nameB = nationB?.name || 'Unknown';
        const typeLabel = TRADE_AGREEMENT_TYPES[neg.agreement_type]?.label || 'Trade Agreement';
        const agreementName = neg.agreement_name || 'Unnamed Agreement';

        const billTitle = 'Ratify: ' + (neg.agreement_name || typeLabel);
        const billPreamble = 'Ratification of the ' + typeLabel + ' "' + agreementName + '" between ' +
            nameA + ' and ' + nameB + '. This agreement was negotiated by diplomatic representatives of both nations. ' +
            'A YES vote enacts the agreement; a NO vote rejects it.';

        const billBase = {
            bill_type: 'ratification', bill_name: billTitle, preamble: billPreamble,
            trade_negotiation_id: negotiationId, status: 'floor',
            proposed_tick: shardTick, floor_tick: shardTick,
            voting_ends_tick: shardTick + GAME_CONFIG.VOTING_WINDOW_TICKS
        };

        // Create both ratification bills in parallel
        // Use the current approver's faction for our side (not yet written to DB), and the stored approver for the other side
        const approverA = weAreA ? currentFaction.id : neg.approved_by_a;
        const approverB = weAreA ? neg.approved_by_b : currentFaction.id;
        const [resultA, resultB] = await Promise.all([
            _supabase.from('bills').insert({ ...billBase, nation_id: neg.nation_a_id, proposed_by: approverA }).select('id').single(),
            _supabase.from('bills').insert({ ...billBase, nation_id: neg.nation_b_id, proposed_by: approverB }).select('id').single()
        ]);

        if (resultA.error) { alert('Error creating ratification bill: ' + resultA.error.message); return; }
        if (resultB.error) { alert('Error creating ratification bill: ' + resultB.error.message); return; }

        updateData.bill_a_id = resultA.data?.id || null;
        updateData.bill_b_id = resultB.data?.id || null;

        // Fire events (non-blocking)
        const eventDesc = 'The ' + typeLabel + ' "' + (neg.agreement_name || 'Unnamed') + '" between ' + nameA + ' and ' + nameB + ' has been sent to both parliaments for ratification.';
        _supabase.from('event_log').insert([neg.nation_a_id, neg.nation_b_id].map(nid => ({
            nation_id: nid,
            event_name: (neg.agreement_name || typeLabel) + ' — Ratification',
            category: 'Diplomatic', description_chosen: eventDesc, fired_at_tick: shardTick
        }))).then(() => {});
    }

    await _supabase.from('trade_negotiations').update(updateData).eq('id', negotiationId);

    alert(otherApproved
        ? 'Both sides have approved! Ratification bills have been submitted to both parliaments.'
        : 'You have approved the agreement. Waiting for the other side to approve.');
    location.reload();
}

function updateConditionDefaults() {
