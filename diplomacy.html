function updateWizardStepIndicators(step) {
    for (let i = 1; i <= 3; i++) {
        const el = document.getElementById('wizard-step-ind-' + i);
        if (!el) continue;
        el.classList.remove('active', 'completed');
        if (i < step) el.classList.add('completed');
        if (i === step) el.classList.add('active');
    }
    for (let i = 1; i <= 3; i++) {
        const p = document.getElementById('wizard-panel-' + i);
        if (!p) continue;
        p.classList.toggle('active', i === step);
    }
}

async function renderWizardStep1() {
    const panel = document.getElementById('wizard-panel-1');
    if (!panel) return;

    panel.innerHTML = '<p style="color:#666;font-style:italic;font-size:0.82rem;">Loading nations...</p>';

    // Fetch nations we have ambassadors to (with active counterpart ambassadors)
    const ambNationIds = diplomaticRoles.ambassadorTo.map(a => a.target_nation_id);
    const hasAmbassador = ambNationIds.length > 0;

    // Also fetch ALL other nations for HoG fallback
    const { data: allNations } = await _supabase.from('nations').select('id, name').neq('id', currentNation.id);

    let theirAmbs = [];
    if (hasAmbassador) {
        const { data } = await _supabase.from('ambassadors').select('nation_id, target_nation_id, status, is_active')
            .eq('target_nation_id', currentNation.id)
            .eq('is_active', true)
            .eq('status', 'active')
            .in('nation_id', ambNationIds);
        theirAmbs = data || [];
    }
    const nationsWithCounterAmb = new Set(theirAmbs.map(a => a.nation_id));

    // Determine AP cost
    const isHoGOnly = diplomaticRoles.isHoG && !hasAmbassador && !diplomaticRoles.isMoT && !diplomaticRoles.isFM;
    const isMoTOnly = diplomaticRoles.isMoT && !hasAmbassador && !diplomaticRoles.isHoG;
    const isFMOnly = diplomaticRoles.isFM && !hasAmbassador && !diplomaticRoles.isMoT && !diplomaticRoles.isHoG;
    const canSelectAny = isHoGOnly || isMoTOnly || isFMOnly; // HoG, MoT, or FM can select any nation
    const apCost = isHoGOnly ? DIPLOMACY_CONFIG.HOG_DRAFT_INITIATIVE_AP : DIPLOMACY_CONFIG.PROPOSE_TRADE_NEGOTIATION_AP;

    let html = '';
    if (isHoGOnly) {
        html += '<div class="trade-info-box warning" style="margin-bottom:12px;">No Trade Minister, Foreign Minister, or ambassador appointed. As Head of Government, you can propose at a higher AP cost (' + apCost + ' AP instead of ' + DIPLOMACY_CONFIG.PROPOSE_TRADE_NEGOTIATION_AP + ' AP).</div>';
    }
    if (isMoTOnly) {
        html += '<div class="trade-info-box info" style="margin-bottom:12px;">As Minister of Trade, you can propose trade negotiations to any nation. Diplomatic initiatives still require an ambassador.</div>';
    }
    if (isFMOnly) {
        html += '<div class="trade-info-box info" style="margin-bottom:12px;">As Foreign Minister, you can propose trade negotiations to any nation. Diplomatic initiatives still require an ambassador.</div>';
    }
    html += '<p style="font-size:0.78rem;color:var(--text-muted);margin-bottom:12px;">Select a nation to negotiate with. Trade Ministers, Ambassadors, Foreign Ministers, and Heads of Government can initiate trade talks.</p>';

    const nations = allNations || [];
    for (const nation of nations) {
        const weHaveAmb = ambNationIds.includes(nation.id);
        const hasCounter = nationsWithCounterAmb.has(nation.id);
        const mutualAmbs = weHaveAmb && hasCounter;
        const canSelect = mutualAmbs || canSelectAny;
        const flagUrl = FLAG_URLS[nation.name] || null;
        const ambInfo = diplomaticRoles.ambassadorTo.find(a => a.target_nation_id === nation.id);
        const ambName = ambInfo ? ((ambInfo.ambassador_first_name || '') + ' ' + (ambInfo.ambassador_last_name || '')).trim() : '';
        const ambPartyInit = ambInfo?.factions?.abbreviation ? ' (' + ambInfo.factions.abbreviation + ')' : '';

        let statusNote = '';
        if (!weHaveAmb && !canSelectAny) statusNote = '<span style="color:#f97316;">No ambassador posted</span>';
        else if (weHaveAmb && !hasCounter) statusNote = '<span style="color:#f97316;">No counterpart ambassador</span>';

        const roleLabel = ambName ? 'Your Amb: ' + escapeHtml(ambName + ambPartyInit) : isHoGOnly ? 'Drafting as HoG' : isMoTOnly ? 'Drafting as Min. of Trade' : isFMOnly ? 'Drafting as FM' : 'No ambassador';

        html += `
            <div class="wizard-nation-item ${canSelect ? '' : 'disabled'}" data-nation-id="${nation.id}" onclick="wizardSelectNation('${nation.id}')">
                ${flagUrl ? '<img src="' + flagUrl + '" class="nation-card-flag" />' : '<div class="nation-card-flag-placeholder"></div>'}
                <div>
                    <div class="wizard-nation-name">${escapeHtml(nation.name)}</div>
                    <div class="wizard-nation-detail">
                        ${roleLabel}
                        ${statusNote ? ' &middot; ' + statusNote : ''}
                    </div>
                </div>
            </div>
        `;
    }

    html += '<div class="wizard-nav"><button class="wizard-next-btn" id="wizard-next-1" disabled onclick="wizardGoToStep2()">Next</button></div>';
    panel.innerHTML = html;
}

function wizardSelectNation(nationId) {
    document.querySelectorAll('.wizard-nation-item').forEach(el => el.classList.remove('selected'));
    const item = document.querySelector('.wizard-nation-item[data-nation-id="' + nationId + '"]');
    if (item && !item.classList.contains('disabled')) {
        item.classList.add('selected');
        wizardTargetNation = nationId;
        const btn = document.getElementById('wizard-next-1');
        if (btn) btn.disabled = false;
    }
}

    html += `

            <div class="type-card-title" style="color:var(--accent);">Trade Agreement</div>
            <div class="type-card-desc">Free trade agreements, preferential tariffs, resource supply contracts, and export subsidies.</div>
            <div class="type-card-effects">
                <span class="trade-type-tag bilateral">BILATERAL</span>
                <span class="trade-type-tag unilateral">UNILATERAL</span>
            </div>
        </div>
    `;

    // Economic Aid category
    html += `
        <div class="type-card" data-category="economic_aid" onclick="wizardSelectCategory('economic_aid')">
            <div class="type-card-title" style="color:#5cb85c;">Economic Aid</div>
            <div class="type-card-desc">Offer or request financial assistance. The donor provides annual funding to the recipient's budget, with optional conditions.</div>
            <div class="type-card-effects">
                <span class="trade-type-tag bilateral">BILATERAL</span>
                <span class="trade-type-tag" style="background:rgba(76,175,80,0.15);color:#5cb85c;">CONDITIONAL</span>
            </div>
        </div>
    `;

    // Unilateral actions (Retaliatory Tariff, Export Subsidy) are accessed via MoT draft panels, not the wizard

    html += '</div>';
    html += `<div class="wizard-nav">
        <button class="wizard-back-btn" onclick="wizardBackToStep1()">Back</button>
        <button class="wizard-next-btn" id="wizard-next-2" disabled onclick="wizardGoToStep3()">Next</button>
    </div>`;

    panel.innerHTML = html;
}

function wizardSelectCategory(category) {
    // MoT-only players cannot select diplomatic initiatives
    if (category === 'diplomatic') {
        const hasAmbassador = diplomaticRoles && diplomaticRoles.ambassadorTo.length > 0;
        const isMoTOnly = diplomaticRoles.isMoT && !hasAmbassador && !diplomaticRoles.isFM && !diplomaticRoles.isHoG;
        if (isMoTOnly) return;
    }

    document.querySelectorAll('#wizard-panel-2 .type-card').forEach(el => el.classList.remove('selected'));
    const card = document.querySelector('#wizard-panel-2 .type-card[data-category="' + category + '"]');
    if (card) {
        card.classList.add('selected');
        wizardCategory = category;
        const btn = document.getElementById('wizard-next-2');
        if (btn) btn.disabled = false;
    }
}

function wizardBackToStep1() {
    wizardStep = 1;
    wizardCategory = null;
    wizardAgreementType = null;
    updateWizardStepIndicators(1);
}

async function wizardGoToStep3() {
    if (!wizardCategory) return;

    // Block MoT-only players from the diplomatic initiative path
    if (wizardCategory === 'diplomatic') {
        const hasAmbassador = diplomaticRoles && diplomaticRoles.ambassadorTo.length > 0;
        const isMoTOnly = diplomaticRoles.isMoT && !hasAmbassador && !diplomaticRoles.isFM && !diplomaticRoles.isHoG;
        if (isMoTOnly) {
            alert('The Minister of Trade can only propose Trade Agreements, not Diplomatic Initiatives.');
            return;
        }
    }

    wizardStep = 3;
    updateWizardStepIndicators(3);
    if (wizardCategory === 'diplomatic') {
        await renderWizardStep3Diplomatic();
    } else if (wizardCategory === 'economic_aid') {
        // Economic aid skips type selection — go straight to proposal with pre-set type
        wizardAgreementType = 'economic_aid';
        await renderWizardStep3AidProposal();
    } else {
        await renderWizardStep3TradeProposal();
    }
}

// ==================== STEP 3A: DIPLOMATIC INITIATIVE TYPE SELECTION ====================
async function renderWizardStep3Diplomatic() {
    const panel = document.getElementById('wizard-panel-3');
    if (!panel) return;

    panel.innerHTML = '<p style="color:#666;font-style:italic;font-size:0.82rem;">Loading...</p>';

    // Fetch existing active/pending agreements between these nations to disable used types
    const usedTypes = new Set();
    try {
        const { data: existing } = await _supabase
            .from('diplomatic_proposals')
            .select('proposal_data, status')
            .eq('proposal_type', 'diplomatic_initiative')
            .in('status', ['proposed', 'revised', 'active'])
            .or(
                'and(proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + wizardTargetNation + '),' +
                'and(proposing_nation_id.eq.' + wizardTargetNation + ',target_nation_id.eq.' + currentNation.id + ')'
            );
        if (existing) {
            for (const prop of existing) {
                const agType = prop.proposal_data?.agreement_type;
                if (agType) usedTypes.add(agType);
                const arts = prop.proposal_data?.articles || [];
                const struck = new Set(prop.proposal_data?.struck_articles || []);
                arts.forEach((art, i) => {
                    if (prop.status === 'active' && struck.has(i)) return;
                    if (art.type) usedTypes.add(art.type);
                });
            }
        }
    } catch (e) { console.warn('Error checking existing agreements:', e); }

    let html = '<p style="font-size:0.78rem;color:var(--text-muted);margin-bottom:12px;">Choose the type of diplomatic initiative.</p>';
    html += '<div class="type-card-grid">';

    for (const [key, info] of Object.entries(INITIATIVE_TYPES)) {
        const isUsed = usedTypes.has(key);
        const classBadge = '<span class="classification-badge classification-' + info.classification.toLowerCase() + '">' + info.classification + '</span>';
        const relStr = info.relations > 0 ? '+' + info.relations + ' Rel' : info.relations < 0 ? info.relations + ' Rel' : '';
        const moneyStr = info.money > 0 ? '+$' + (info.money / 1e6).toFixed(0) + 'M' : info.money < 0 ? '-$' + (Math.abs(info.money) / 1e6).toFixed(0) + 'M' : '';

        html += `
            <div class="type-card ${isUsed ? 'disabled' : ''}" data-type-key="${key}" onclick="wizardSelectDiploType('${key}')">
                <div class="type-card-title">${escapeHtml(info.label)} ${classBadge}</div>
                <div class="type-card-desc">${escapeHtml(info.description)}</div>
                <div class="type-card-effects">
                    ${relStr ? '<span class="effect-tag effect-rel">' + relStr + '</span>' : ''}
                    ${moneyStr ? '<span class="effect-tag effect-money">' + moneyStr + '</span>' : ''}
                    ${!relStr && !moneyStr ? '<span class="effect-tag" style="background:var(--bg-hover);color:var(--text-muted);">No effects</span>' : ''}
                </div>
                ${isUsed ? '<div class="type-card-already">Already active or pending</div>' : ''}
            </div>
        `;
    }

    html += '</div>';
    html += '<div id="diplo-draft-section"></div>';
    html += `<div class="wizard-nav">
        <button class="wizard-back-btn" onclick="wizardBackToStep2()">Back</button>
    </div>`;

    panel.innerHTML = html;
}

async function wizardSelectDiploType(typeKey) {
    document.querySelectorAll('#wizard-panel-3 .type-card').forEach(el => el.classList.remove('selected'));
    const card = document.querySelector('#wizard-panel-3 .type-card[data-type-key="' + typeKey + '"]');
    if (card && !card.classList.contains('disabled')) {
        card.classList.add('selected');
        wizardAgreementType = typeKey;
        // Expand the article drafting form inline
        await renderDiploDraftSection();
    }
}

async function renderDiploDraftSection() {
    const section = document.getElementById('diplo-draft-section');
    if (!section || !wizardAgreementType) return;

    const typeInfo = INITIATIVE_TYPES[wizardAgreementType];

    const { data: targetNation } = await _supabase.from('nations').select('id, name').eq('id', wizardTargetNation).single();

    const ourAmb = diplomaticRoles.ambassadorTo.find(a => a.target_nation_id === wizardTargetNation);
    const ourAmbName = ourAmb ? ((ourAmb.ambassador_first_name || '') + ' ' + (ourAmb.ambassador_last_name || '')).trim() : '?';
    const ourAmbParty = ourAmb?.factions?.abbreviation ? ' (' + ourAmb.factions.abbreviation + ')' : '';

    const { data: theirAmb } = await _supabase
        .from('ambassadors')
        .select('ambassador_first_name, ambassador_last_name, factions(abbreviation)')
        .eq('nation_id', wizardTargetNation)
        .eq('target_nation_id', currentNation.id)
        .eq('is_active', true)
        .eq('status', 'active')
        .maybeSingle();
    const theirAmbName = theirAmb ? ((theirAmb.ambassador_first_name || '') + ' ' + (theirAmb.ambassador_last_name || '')).trim() : '?';

        '<option value="' + y + '">' + y + ' Year' + (y > 1 ? 's' : '') + '</option>'
    ).join('');

    const preamble = 'Ambassador ' + escapeHtml(ourAmbName + ourAmbParty) + ' of ' + escapeHtml(currentNation.name) +
        ', in collaboration with Ambassador ' + escapeHtml(theirAmbName + theirAmbParty) + ' of ' + escapeHtml(targetName) +
        ', hereby propose the following ' + escapeHtml(typeInfo.label) + ':';

    const relStr = typeInfo.relations > 0 ? '+' + typeInfo.relations + ' Relations' : typeInfo.relations < 0 ? typeInfo.relations + ' Relations' : '';
    const moneyStr = typeInfo.money > 0 ? '+$' + (typeInfo.money / 1e6).toFixed(0) + 'M FM Fund' : typeInfo.money < 0 ? '-$' + (Math.abs(typeInfo.money) / 1e6).toFixed(0) + 'M FM Fund' : '';

    section.innerHTML = `
        <div class="trade-article-builder" style="margin-top:14px;">
            <div style="margin-bottom:12px;">
                <span style="font-size:0.82rem;font-weight:bold;color:var(--text-primary);">${escapeHtml(typeInfo.label)}</span>
                ${classBadge}
            </div>

            <div class="initiative-field">
                <label>Name of Agreement</label>
                <input type="text" id="wizard-name" placeholder="e.g. The Concordia Accord" maxlength="120" oninput="wizardUpdatePreview()" />
            </div>

            <div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:12px;line-height:1.5;padding:8px 10px;background:var(--bg-body);border-radius:4px;border:1px solid var(--border-light);">
                ${preamble}
            </div>

            <div class="initiative-field">
                <label>Duration</label>
                <select id="wizard-duration" onchange="wizardUpdatePreview()">${durationOptions}</select>
            </div>

            <div class="initiative-effects">
                ${relStr ? '<span class="effect-tag effect-rel">' + relStr + '</span>' : ''}
                ${moneyStr ? '<span class="effect-tag effect-money">' + moneyStr + '</span>' : ''}
            </div>

            <div class="diplo-section-title">Articles</div>
            <div id="wizard-articles-list"></div>
            <button class="action-btn" style="font-size:0.72rem;margin-top:4px;" onclick="wizardAddArticle()">+ Add Article</button>

            <div id="wizard-preview" class="initiative-preview" style="display:none;margin-top:12px;"></div>

            <div class="initiative-btn-row" style="margin-top:12px;">
                <button class="wizard-next-btn" id="wizard-submit-btn" disabled onclick="wizardSubmit()">Submit Proposal</button>
            </div>
        </div>
    `;

    wizardArticles = [];
    wizardRenderArticles();
}

// ==================== STEP 3B: PROPOSE TRADE NEGOTIATIONS ====================
var wizardTradeAgreementType = null;  // selected trade agreement type key
var counterTradeArticles = [];  // articles added during counter-proposal

async function renderWizardStep3TradeProposal() {
    const panel = document.getElementById('wizard-panel-3');
    if (!panel) return;

    panel.innerHTML = '<p style="color:#666;font-style:italic;font-size:0.82rem;">Loading...</p>';

    const { data: targetNation } = await _supabase.from('nations').select('id, name').eq('id', wizardTargetNation).single();
    const targetName = targetNation?.name || 'Unknown';

    // Check for existing pending trade proposals with this nation
    const { data: existingProposals } = await _supabase
        .from('diplomatic_proposals')
        .select('id, status, proposal_data')
        .eq('proposal_type', 'trade_agreement')
        .in('status', ['proposed', 'revised', 'fm_review', 'ratification'])
        .or('proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + currentNation.id);

    const existingWithTarget = (existingProposals || []).filter(p => {
        const pd = p.proposal_data || {};
        return pd.target_nation_id === wizardTargetNation || pd.proposer_nation_id === wizardTargetNation;
    });

    if (existingWithTarget.length > 0) {
        panel.innerHTML = `
            <div class="trade-info-box warning">
                You already have a pending trade proposal with ${escapeHtml(targetName)}. Check the Negotiations panel.
            </div>
            <div class="wizard-nav" style="margin-top:12px;">
                <button class="wizard-back-btn" onclick="wizardBackToStep2()">Back</button>
            </div>
        `;
        return;
    }

    const ourAmb = diplomaticRoles.ambassadorTo.find(a => a.target_nation_id === wizardTargetNation);
    const isHoGOnly = diplomaticRoles.isHoG && !ourAmb && !diplomaticRoles.isMoT && !diplomaticRoles.isFM;
    const apCost = isHoGOnly ? DIPLOMACY_CONFIG.HOG_DRAFT_INITIATIVE_AP : DIPLOMACY_CONFIG.PROPOSE_TRADE_NEGOTIATION_AP;

    // If no agreement type selected yet, show type selection
    if (!wizardTradeAgreementType) {
        let html = `
            <div class="trade-article-builder">
                <div class="trade-article-header">
                    <span class="trade-article-title">Propose Trade Agreement with ${escapeHtml(targetName)}</span>
                </div>
                <p style="font-size:0.78rem;color:var(--text-muted);line-height:1.5;margin-bottom:14px;">
                    Choose the type of trade agreement to propose. You will draft the articles before sending.
                </p>
                ${isHoGOnly ? '<div class="trade-info-box warning" style="margin-bottom:12px;">No Trade Minister, Foreign Minister, or ambassador appointed. Drafting as Head of Government costs ' + apCost + ' AP.</div>' : ''}
                <div class="type-card-grid">`;

        // Show bilateral trade agreement types (unilateral types have their own wizard path)
        for (const [key, typeInfo] of Object.entries(TRADE_AGREEMENT_TYPES)) {
            if (!typeInfo.bilateral) continue;
            html += `
                <div class="type-card" onclick="selectTradeAgreementType('${key}')">
                    <div class="type-card-short">${escapeHtml(typeInfo.shortLabel)}</div>
                    <div class="type-card-title">${escapeHtml(typeInfo.label)}</div>
                    <div class="type-card-effects"><span class="trade-type-tag bilateral">BILATERAL</span></div>
                </div>`;
        }
        html += '</div></div>';
        html += '<div class="wizard-nav" style="margin-top:12px;"><button class="wizard-back-btn" onclick="wizardBackToStep2()">Back</button></div>';
        panel.innerHTML = html;
        return;
    }

    // Agreement type selected — show article drafting
    const typeInfo = TRADE_AGREEMENT_TYPES[wizardTradeAgreementType];
    const typeName = typeInfo?.label || wizardTradeAgreementType;
    const availableTypes = getAvailableArticleTypes(wizardTradeAgreementType, tradeArticles);
    const hasRequired = checkRequiredArticles(wizardTradeAgreementType, tradeArticles);

    let html = `
        <div class="trade-article-builder">
            <div class="trade-article-header">
                <span class="trade-article-title">${escapeHtml(typeName)} with ${escapeHtml(targetName)}</span>
                <span class="badge badge--dim" style="margin-left:8px;">${typeInfo?.shortLabel || ''}</span>
            </div>

            <div class="trade-field">
                <label>Agreement Name</label>
                <input type="text" id="trade-neg-name" placeholder="e.g. ${escapeHtml(currentNation.name)}-${escapeHtml(targetName)} ${escapeHtml(typeInfo?.shortLabel || 'Trade')} Agreement" maxlength="120" value="${escapeHtml(wizardName || '')}" onchange="setWizardName(this.value)" />
            </div>`;

    // Type explainer
    const explainer = getTradeTypeExplainer(wizardTradeAgreementType);
    if (explainer) {
        html += '<div class="trade-info-box info" style="margin-top:8px;">' + explainer + '</div>';
    }

    // Show existing articles
    if (tradeArticles.length > 0) {
        html += '<div style="margin-top:12px;">';
        for (let i = 0; i < tradeArticles.length; i++) {
            const art = tradeArticles[i];
            const summary = renderTradeArticleSummary(art);
            const artTypeInfo = TRADE_ARTICLE_TYPES[art.type];
            const artLabel = artTypeInfo?.label || art.type;
            const artDesc = artTypeInfo?.description || '';
            const isRequired = (typeInfo.required_articles || []).includes(art.type);
            html += `
                <div class="draft-article">
                    <div class="draft-article-type">
                        <span>Art. ${toRoman(i + 1)} — ${escapeHtml(artLabel)} ${isRequired ? '<span class="badge badge--teal" style="margin-left:4px;">Required</span>' : '<span class="badge badge--dim" style="margin-left:4px;">Optional</span>'}</span>
                        <span class="draft-article-remove" onclick="removeWizardTradeArticle(${i})">Remove</span>
                    </div>
                    <div class="draft-article-title" style="font-size:0.75rem;">${summary}</div>
                    <div class="draft-article-body">${escapeHtml(artDesc)}</div>
                </div>`;
        }
        html += '</div>';
    }

    // Add article dropdown
    if (availableTypes.length > 0) {
        html += `
            <div style="margin-top:12px;display:flex;gap:8px;align-items:center;">
                <select id="wizard-trade-article-type" style="font-size:0.75rem;padding:4px 8px;background:var(--bg-1);color:var(--text-primary);border:1px solid var(--border-hair);border-radius:3px;">
                    <option value="">Add article...</option>
                    ${availableTypes.map(t => '<option value="' + t.key + '">' + escapeHtml(t.label) + (t.required ? ' (required)' : '') + '</option>').join('')}
                </select>
                <button class="wizard-next-btn" style="font-size:0.72rem;padding:4px 12px;" onclick="showWizardTradeArticleEditor()">Add</button>
            </div>
            <div id="wizard-trade-article-editor"></div>`;
    }

    // Required articles check
    if (!hasRequired) {
        const missing = (typeInfo.required_articles || []).filter(req => !tradeArticles.some(a => a.type === req));
        const missingLabels = missing.map(m => TRADE_ARTICLE_TYPES[m]?.label || m).join(', ');
        html += `<div class="trade-info-box warning" style="margin-top:12px;">Required articles missing: ${escapeHtml(missingLabels)}</div>`;
    }

    html += `
            <div style="font-size:0.75rem;color:var(--text-muted);margin-top:14px;line-height:1.5;">
                <strong>What happens next:</strong><br/>
                1. You send the complete proposal with articles (${apCost} AP)<br/>
                2. ${escapeHtml(targetName)} reviews the articles<br/>
                3. They can accept, reject, or counter (strike/add articles)<br/>
                4. If countered, you review their changes and accept or reject
            </div>
        </div>

        <div class="wizard-nav" style="margin-top:12px;">
            <button class="wizard-back-btn" onclick="wizardTradeAgreementType=null;tradeArticles=[];renderWizardStep3TradeProposal()">Back (Change Type)</button>
            <button class="wizard-next-btn" id="trade-propose-btn" ${hasRequired ? '' : 'disabled'} onclick="submitTradeProposal()">
                Send Trade Proposal (${apCost} AP)
            </button>
        </div>`;

    panel.innerHTML = html;
}

function selectTradeAgreementType(typeKey) {
    wizardTradeAgreementType = typeKey;
    tradeArticles = [];
    wizardName = '';
    renderWizardStep3TradeProposal();
}

function showWizardTradeArticleEditor() {
    const select = document.getElementById('wizard-trade-article-type');
    const articleType = select?.value;
    if (!articleType) { alert('Select an article type first.'); return; }
    const container = document.getElementById('wizard-trade-article-editor');
    if (!container) return;
    renderTradeArticleEditorLocal(container, articleType);
}

function renderTradeArticleEditorLocal(container, articleType) {
    const artTypeInfo = TRADE_ARTICLE_TYPES[articleType];
    if (!artTypeInfo) return;

    let html = '<div class="trade-article-builder" style="margin-top:10px;border-color:var(--accent);">';
    html += '<div class="trade-article-header"><span class="trade-article-title">New: ' + escapeHtml(artTypeInfo.label) + '</span></div>';

    switch (articleType) {
        case 'duration': html += renderDurationEditor(); break;
        case 'sector_exemption': html += renderSectorExemptionEditor(); break;
        case 'tariff_reduction': html += renderTariffReductionEditor(); break;
        case 'supply_commitment': html += renderSupplyCommitmentEditor(); break;
        case 'price_terms': html += renderPriceTermsEditor(); break;
        case 'breach_penalty': html += renderBreachPenaltyEditor(); break;
        case 'subsidized_sector': html += renderSubsidizedSectorEditor(); break;
        case 'funding_source': html += renderFundingSourceEditor(); break;
        case 'text_article': html += renderTextArticleEditor(); break;
        case 'aid_terms': html += renderAidTermsEditor(); break;
        case 'aid_condition': html += renderAidConditionEditor(); break;
        case 'tariff_surcharge': html += renderTariffSurchargeEditor(); break;
    }

    html += `
        <div style="display:flex;gap:8px;margin-top:12px;">
            <button class="wizard-next-btn" style="font-size:0.75rem;padding:6px 14px;" onclick="saveWizardTradeArticle('${articleType}')">Add Article</button>
            <button class="wizard-back-btn" style="font-size:0.75rem;padding:6px 14px;" onclick="document.getElementById('wizard-trade-article-editor').innerHTML=''">Cancel</button>
        </div>
    `;
    html += '</div>';
    container.innerHTML = html;
}

function saveWizardTradeArticle(articleType) {
    let articleData = {};

    switch (articleType) {
        case 'duration': {
            const durType = document.querySelector('input[name="dur-type"]:checked')?.value || 'fixed';
            const ticks = Math.min(240, Math.max(4, parseInt(document.getElementById('dur-ticks')?.value || '12')));
            const autoRenew = document.getElementById('dur-autorenew')?.checked || false;
            const withdrawal = Math.min(6, Math.max(1, parseInt(document.getElementById('dur-withdrawal')?.value || '3')));
            articleData = { duration_type: durType, duration_ticks: durType === 'fixed' ? ticks : null, auto_renew: autoRenew, withdrawal_notice_ticks: withdrawal };
            break;
        }
        case 'sector_exemption': {
            const sector = document.getElementById('exempt-sector')?.value;
            const reason = document.getElementById('exempt-reason')?.value?.trim() || '';
            if (!sector) { alert('Please select a sector.'); return; }
            articleData = { sector, reason };
            break;
        }
        case 'tariff_reduction': {
            const sector = document.getElementById('tariff-sector')?.value;
            const direction = document.querySelector('input[name="tariff-dir"]:checked')?.value || 'mutual';
            const pct = Math.min(100, Math.max(0, parseInt(document.getElementById('tariff-pct')?.value || '50')));
            if (!sector) { alert('Please select a sector.'); return; }
            articleData = { sector, direction, reduction_pct: pct, author_nation_id: currentNation.id };
            break;
        }
        case 'supply_commitment': {
            const sector = document.getElementById('supply-sector')?.value;
            const direction = document.querySelector('input[name="supply-dir"]:checked')?.value || 'we_buy';
            const pct = Math.min(90, Math.max(10, parseInt(document.getElementById('supply-pct')?.value || '60')));
            if (!sector) { alert('Please select a resource.'); return; }
            articleData = { sector, direction, commitment_pct: pct, author_nation_id: currentNation.id };
            break;
        }
        case 'price_terms': {
            const priceType = document.querySelector('input[name="price-type"]:checked')?.value || 'market';
            const modifier = Math.min(25, Math.max(0, parseInt(document.getElementById('price-modifier')?.value || '10')));
            articleData = { price_type: priceType, modifier_pct: (priceType === 'discounted' || priceType === 'premium') ? modifier : 0 };
            break;
        }
        case 'breach_penalty': {
            articleData = {
                relations_penalty: Math.min(8, Math.max(1, parseInt(document.getElementById('breach-relations')?.value || '5'))),
                reputation_penalty: Math.min(4, Math.max(0, parseInt(document.getElementById('breach-reputation')?.value || '2'))),
                financial_penalty: Math.min(500, Math.max(0, parseInt(document.getElementById('breach-financial')?.value || '200')))
            };
            break;
        }
        case 'subsidized_sector': {
            const sector = document.getElementById('subsidy-sector')?.value;
            const pct = Math.min(30, Math.max(5, parseInt(document.getElementById('subsidy-pct')?.value || '15')));
            if (!sector) { alert('Please select a sector.'); return; }
            articleData = { sector, subsidy_pct: pct, author_nation_id: currentNation.id };
            break;
        }
        case 'funding_source': {
            const source = document.querySelector('input[name="fund-source"]:checked')?.value || 'general_treasury';
            articleData = { source };
            break;
        }
        case 'text_article': {
            const title = document.getElementById('text-art-title')?.value?.trim() || '';
            const body = document.getElementById('text-art-body')?.value?.trim() || '';
            if (!body) { alert('Please enter article body text.'); return; }
            articleData = { title, body };
            break;
        }
        case 'aid_terms': {
            const aidDir = document.querySelector('input[name="aid-direction"]:checked')?.value || 'provide';
            const donorId = aidDir === 'provide' ? currentNation.id : (activeDraftTarget?.id || wizardTargetNation);
            const amount = Number(document.getElementById('aid-amount')?.value || 0);
            const gdpCap = Math.min(25, Math.max(1, parseInt(document.getElementById('aid-gdp-cap')?.value || '10')));
            if (amount < DIPLOMACY_CONFIG.AID_MIN_AMOUNT) {
                alert('Minimum aid amount is $' + (DIPLOMACY_CONFIG.AID_MIN_AMOUNT / 1e9).toFixed(0) + 'B.');
                return;
            }
            articleData = { donor_nation_id: donorId, aid_direction: aidDir, annual_amount: amount, gdp_cap_pct: gdpCap };
            break;
        }
        case 'aid_condition': {
            const statKey = document.getElementById('cond-stat')?.value;
            const operator = document.querySelector('input[name="cond-op"]:checked')?.value || 'gte';
            const threshold = Math.min(100, Math.max(0, parseInt(document.getElementById('cond-threshold')?.value || '50')));
            const onFailure = document.querySelector('input[name="cond-fail"]:checked')?.value || 'suspend';
            const grace = Math.min(2, Math.max(0, parseInt(document.getElementById('cond-grace')?.value || '1')));
            if (!statKey) { alert('Please select a stat to monitor.'); return; }
            const existingConditions = tradeArticles.filter(a => a.type === 'aid_condition');
            if (existingConditions.length >= DIPLOMACY_CONFIG.AID_MAX_CONDITIONS) {
                alert('Maximum ' + DIPLOMACY_CONFIG.AID_MAX_CONDITIONS + ' conditions per agreement.');
                return;
            }
            articleData = { stat_key: statKey, operator, threshold, on_failure: onFailure, grace_periods: grace };
            break;
        }
        case 'tariff_surcharge': {
            const sector = document.getElementById('surcharge-sector')?.value;
            const pct = Math.min(50, Math.max(5, parseInt(document.getElementById('surcharge-pct')?.value || '25')));
            if (!sector) { alert('Please select a sector.'); return; }
            articleData = { sector, surcharge_pct: pct, imposer_nation_id: currentNation.id };
            break;
        }
    }

    // Add to local state
    const artDef = TRADE_ARTICLE_TYPES[articleType];
    if (artDef && !artDef.repeatable) {
        const existingIdx = tradeArticles.findIndex(a => a.type === articleType);
        if (existingIdx >= 0) {
            tradeArticles[existingIdx] = { type: articleType, data: articleData };
        } else {
            tradeArticles.push({ type: articleType, data: articleData });
        }
    } else {
        tradeArticles.push({ type: articleType, data: articleData });
    }

    // Re-render the appropriate view
    if (draftTradeMode) {
        reRenderTradeDraft();
    } else {
        renderWizardStep3TradeProposal();
    }
}

var wizardAidDirection = null;

function selectAidDirection(direction) {
    wizardAidDirection = direction;
    // Toggle card selection
    const offerCard = document.getElementById('aid-dir-offer');
    const requestCard = document.getElementById('aid-dir-request');
    if (offerCard) offerCard.classList.toggle('selected', direction === 'offer');
    if (requestCard) requestCard.classList.toggle('selected', direction === 'request');
    // Enable the propose button
    const btn = document.getElementById('aid-propose-btn');
    if (btn) btn.disabled = false;
}

async function submitAidProposal() {
    if (!wizardAidDirection) return;
    const btn = document.getElementById('aid-propose-btn');
    if (btn) btn.disabled = true;

    const nameInput = document.getElementById('aid-neg-name');
    const agreementName = (nameInput?.value || '').trim() || 'Economic Aid Negotiations';

    const ourAmb = diplomaticRoles.ambassadorTo.find(a => a.target_nation_id === wizardTargetNation);
    const isHoGOnly = diplomaticRoles.isHoG && !ourAmb && !diplomaticRoles.isFM && !diplomaticRoles.isMoT;
    const apCost = isHoGOnly ? DIPLOMACY_CONFIG.HOG_DRAFT_INITIATIVE_AP : DIPLOMACY_CONFIG.PROPOSE_TRADE_NEGOTIATION_AP;

    // Deduct AP
    const apResult = await deductAP(_supabase, currentFaction.id, apCost);
    if (!apResult.success) {
        if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
        alert('Not enough AP (' + apCost + ' needed). Current AP: ' + (apResult.currentAp ?? '?'));
        if (btn) btn.disabled = false;
        return;
    }

    // Determine role
    let myRole = 'ambassador';
    if (diplomaticRoles.isFM) myRole = 'foreign_minister';
    if (diplomaticRoles.isHoG) myRole = 'prime_minister';

    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const currentTick = shard?.current_tick || 0;

    // Canonical ordering
    const aId = currentNation.id < wizardTargetNation ? currentNation.id : wizardTargetNation;
    const bId = currentNation.id < wizardTargetNation ? wizardTargetNation : currentNation.id;

    // Determine donor based on direction selection
    const donorNationId = wizardAidDirection === 'offer' ? currentNation.id : wizardTargetNation;

    // Create the trade_negotiations row with type pre-set to economic_aid
    const { data: neg, error: negErr } = await _supabase.from('trade_negotiations').insert({
        nation_a_id: aId,
        nation_b_id: bId,
        agreement_type: 'economic_aid',
        status: 'open',
        participants: [{ faction_id: currentFaction.id, role: myRole, joined_at_tick: currentTick, nation_id: currentNation.id }],
        draft_articles: [{
            type: 'aid_terms',
            data: { donor_nation_id: donorNationId, annual_amount: 0, gdp_cap_pct: 10 }
        }],
        agreement_name: agreementName,
        expires_at_tick: currentTick + DIPLOMACY_CONFIG.NEGOTIATION_DEFAULT_DURATION,
        opened_at_tick: currentTick
    }).select('id').single();

    if (negErr) {
        console.error('Error creating aid negotiation:', negErr);
        alert('Failed to create negotiation: ' + negErr.message);
        if (btn) btn.disabled = false;
        return;
    }

    // Create the diplomatic proposal so the target nation sees it in their inbox
    const { error: proposalErr } = await _supabase.from('diplomatic_proposals').insert({
        proposing_nation_id: currentNation.id,
        target_nation_id: wizardTargetNation,
        proposed_by_faction_id: currentFaction.id,
        proposal_type: 'trade_negotiation',
        proposal_tier: 1,
        status: 'proposed',
        proposal_data: {
            name: agreementName,
            negotiation_id: neg.id,
            proposer_nation_name: currentNation.name,
            target_nation_name: (await _supabase.from('nations').select('name').eq('id', wizardTargetNation).single()).data?.name || '',
            expires_at_tick: currentTick + DIPLOMACY_CONFIG.NEGOTIATION_DEFAULT_DURATION,
            agreement_type: 'economic_aid',
            aid_direction: wizardAidDirection,
            donor_nation_id: donorNationId
        },
        proposed_at_tick: currentTick
    });
    if (proposalErr) { alert('Error creating proposal: ' + proposalErr.message); return; }

    // Fire event
    try {
        await _supabase.rpc('fire_system_event', {
            p_trigger_key: 'trade_negotiation_proposed',
            p_nation_id: currentNation.id,
            p_tick: currentTick,
            p_placeholders: { nation: currentNation.name, agreement_name: agreementName, target_nation: '' }
        });
    } catch (e) { /* non-blocking */ }

    // Redirect to the negotiation
    alert('Aid negotiation proposed! Awaiting acceptance from ' + ((await _supabase.from('nations').select('name').eq('id', wizardTargetNation).single()).data?.name || 'the target nation') + '.');
    openTradeNegotiation(neg.id);
}

async function wizardSubmit() {
    if (_diploActionLock) return;
    if (!wizardName) { alert('Please enter a name for the agreement.'); return; }
    const filledArticles = wizardArticles.filter(a => a.text.trim());
    if (filledArticles.length === 0) { alert('Please add at least one article with content.'); return; }
    if (!wizardTargetNation || !wizardAgreementType) { alert('Missing target nation or agreement type.'); return; }

    // MoT-only players cannot submit diplomatic initiatives
    await refreshRoles();
    const hasAmbassador = diplomaticRoles && diplomaticRoles.ambassadorTo.length > 0;
    const isMoTOnly = diplomaticRoles.isMoT && !hasAmbassador && !diplomaticRoles.isFM && !diplomaticRoles.isHoG;
    if (isMoTOnly) {
        alert('The Minister of Trade can only propose Trade Agreements, not Diplomatic Initiatives.');
        return;
    }

    const typeInfo = INITIATIVE_TYPES[wizardAgreementType];
    if (!typeInfo) { alert('Invalid agreement type.'); return; }

    const ourAmb = diplomaticRoles.ambassadorTo.find(a => a.target_nation_id === wizardTargetNation);
    if (!ourAmb) { alert('You are not ambassador to this nation.'); return; }
    _diploActionLock = true;
    try {

    // Deduct AP for diplomatic initiative
    const apCost = DIPLOMACY_CONFIG.PROPOSE_INITIATIVE_AP;
    const apResult = await deductAP(_supabase, currentFaction.id, apCost);
    if (!apResult.success) {
        if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
        alert('Not enough AP (' + apCost + ' needed). Current AP: ' + (apResult.currentAp ?? '?'));
        return;
    }
    currentFaction.action_points = apResult.newAp;

    // Get their ambassador
    const { data: theirAmb } = await _supabase
        .from('ambassadors')
        .select('ambassador_first_name, ambassador_last_name, factions(abbreviation)')
        .eq('nation_id', wizardTargetNation)
        .eq('target_nation_id', currentNation.id)
        .eq('is_active', true)
        .eq('status', 'active')
        .maybeSingle();

    if (!theirAmb) { alert('Target nation has no active ambassador to negotiate with.'); return; }

    const { data: targetNation } = await _supabase.from('nations').select('name').eq('id', wizardTargetNation).single();

    const ourAmbName = ((ourAmb.ambassador_first_name || '') + ' ' + (ourAmb.ambassador_last_name || '')).trim() + (ourAmb.factions?.abbreviation ? ' (' + ourAmb.factions.abbreviation + ')' : '');
    const theirAmbName = ((theirAmb.ambassador_first_name || '') + ' ' + (theirAmb.ambassador_last_name || '')).trim() + (theirAmb.factions?.abbreviation ? ' (' + theirAmb.factions.abbreviation + ')' : '');

    // Get current tick
    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const currentTick = shard?.current_tick || 0;

    // Determine proposal tier based on classification
    const proposalTier = typeInfo.classification === 'MAJOR' ? 3 : 1;

    const proposalData = {
        name: wizardName,
        agreement_type: wizardAgreementType,
        classification: typeInfo.classification,
        duration_years: wizardDuration,
        articles: filledArticles.map(a => ({
            text: a.text.trim(),
            type: wizardAgreementType,
            label: typeInfo.label,
            description: typeInfo.description,
            relations: typeInfo.relations,
            money: typeInfo.money
        })),
        proposer_ambassador_name: ourAmbName,
        target_ambassador_name: theirAmbName,
        proposer_nation_name: currentNation.name,
        target_nation_name: targetNation?.name || 'Unknown'
    };

    const { error } = await _supabase.from('diplomatic_proposals').insert({
        proposing_nation_id: currentNation.id,
        target_nation_id: wizardTargetNation,
        proposed_by_faction_id: currentFaction.id,
        proposal_type: 'diplomatic_initiative',
        proposal_tier: proposalTier,
        status: 'proposed',
        proposal_data: proposalData,
        proposed_at_tick: currentTick
    });

    if (error) {
        console.error('Error submitting initiative:', error);
        alert('Error submitting initiative: ' + error.message);
        return;
    }

    // Fire timeline event for diplomatic initiative proposed
    try {
        await _supabase.rpc('fire_system_event', {
            p_trigger_key: 'diplomatic_initiative_proposed',
            p_nation_id: currentNation.id,
            p_tick: currentTick,
            p_placeholders: { name: wizardName, type: typeInfo.label, target_nation: targetNation?.name || 'Unknown', classification: typeInfo.classification }
        });
    } catch (e) { /* non-blocking */ }

    alert('Diplomatic Initiative "' + wizardName + '" proposed!\n\n' +
        (typeInfo.classification === 'MINOR' ? 'As a MINOR agreement, it can be accepted directly by the target ambassador.' :
        'As a MAJOR agreement, it will require escalation through the legislative pipeline after ambassador acceptance.'));

    // Reset and re-render wizard
    await renderInitiativeWizard();
    { const _apEl = document.getElementById('diplo-ap'); if (_apEl) _apEl.textContent = (currentFaction?.action_points ?? 0) + ' AP'; };

    } finally {
        _diploActionLock = false;
    }
}

async function submitTradeProposal() {
    if (!wizardTargetNation || !wizardTradeAgreementType) {
        alert('Missing target nation or agreement type.');
        return;
    }

    if (!checkRequiredArticles(wizardTradeAgreementType, tradeArticles)) {
        alert('Please add all required articles before sending.');
        return;
    }

    const nameInput = document.getElementById('trade-neg-name');
    const agreementName = (nameInput?.value?.trim() || wizardName || '').trim();
    if (!agreementName) {
        alert('Please enter a name for the agreement.');
        return;
    }

    const ourAmb = diplomaticRoles.ambassadorTo.find(a => a.target_nation_id === wizardTargetNation);
    const isHoGOnly = diplomaticRoles.isHoG && !ourAmb && !diplomaticRoles.isMoT && !diplomaticRoles.isFM;
    const apCost = isHoGOnly ? DIPLOMACY_CONFIG.HOG_DRAFT_INITIATIVE_AP : DIPLOMACY_CONFIG.PROPOSE_TRADE_NEGOTIATION_AP;

    // Deduct AP
    const apResult = await deductAP(_supabase, currentFaction.id, apCost);
    if (!apResult.success) {
        if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
        alert('Not enough AP. Need ' + apCost + ' AP, have ' + (apResult.currentAp ?? '?') + '.');
        return;
    }
    currentFaction.action_points = apResult.newAp;

    // Get current tick
    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const currentTick = shard?.current_tick || 0;

    // Fetch target nation name
    const { data: targetNation } = await _supabase.from('nations').select('name').eq('id', wizardTargetNation).single();
    const targetName = targetNation?.name || 'Unknown';

    // Determine classification based on agreement type
    const typeInfo = TRADE_AGREEMENT_TYPES[wizardTradeAgreementType];
    const classification = 'MAJOR';  // All trade agreements go through FM review + ratification

    // Build proposal_data with trade articles
    const allAgreementTypes = draftAgreements.length > 0
        ? draftAgreements.map(a => a.type)
        : [wizardTradeAgreementType];
    const proposalData = {
        name: agreementName,
        classification: classification,
        agreement_type: wizardTradeAgreementType,
        agreement_types: allAgreementTypes,
        agreement_name: agreementName,
        articles: tradeArticles,
        proposer_nation_name: currentNation.name,
        target_nation_name: targetName,
        proposer_faction_id: currentFaction.id,
        duration_years: null  // duration is in the articles
    };

    // Get duration from articles for display
    const durationArt = tradeArticles.find(a => a.type === 'duration');
    if (durationArt?.data) {
        const dt = durationArt.data;
        proposalData.duration_years = dt.duration_type === 'permanent' ? 'Permanent' : Math.round((dt.duration_ticks || 12) / 12);
    }

    const { error: propErr } = await _supabase.from('diplomatic_proposals').insert({
        proposing_nation_id: currentNation.id,
        target_nation_id: wizardTargetNation,
        proposed_by_faction_id: currentFaction.id,
        proposal_type: 'trade_agreement',
        proposal_tier: 2,  // trade agreements are tier 2 (MAJOR)
        status: 'proposed',
        proposal_data: proposalData,
        proposed_at_tick: currentTick
    });

    if (propErr) {
        console.error('Error creating trade proposal:', propErr);
        alert('Error proposing trade agreement: ' + propErr.message);
        return;
    }

    // Fire event
    await _supabase.from('event_log').insert({
        nation_id: currentNation.id,
        event_name: 'Trade Agreement Proposed',
        trigger_key: 'trade_agreement_proposed',
        category: 'Trade',
        description_chosen: currentNation.name + ' has proposed a ' + (allAgreementTypes.length > 1 ? 'trade package' : (typeInfo?.label || 'trade agreement')) + ' ("' + agreementName + '") with ' + targetName + '.',
        fired_at_tick: currentTick
    });

    const typeLabels = allAgreementTypes.map(t => TRADE_AGREEMENT_TYPES[t]?.shortLabel || t).join(' + ');
    alert('"' + agreementName + '" (' + typeLabels + ') proposed to ' + targetName + ' with ' + tradeArticles.length + ' article(s).\n\nThey can accept, reject, or counter with modifications.');

    // Reset state and re-render
    wizardTradeAgreementType = null;
    tradeArticles = [];
    wizardName = '';
    draftAgreements = [];
    activeAgreementTab = -1;
    addingNewAgreement = false;
    if (draftTradeMode) {
        cancelDraft();
        await renderNegotiationsBox();
    } else {
        await renderInitiativeWizard();
    }
    { const _apEl = document.getElementById('diplo-ap'); if (_apEl) _apEl.textContent = (currentFaction?.action_points ?? 0) + ' AP'; };
}

// ==================== VIEW ACTIVE AGREEMENT IN DRAFT BOX ====================
async function viewActiveAgreement(agreementId) {
    const panel = document.getElementById('draft-body');
    if (!panel) return;

    // Clear any active draft action so Back returns to empty state
    activeDraftAction = null;

    const draftBox = document.getElementById('box-draft');
    if (draftBox) draftBox.scrollIntoView({ behavior: 'smooth', block: 'start' });

    const statusEl = document.getElementById('draft-status');
    if (statusEl) statusEl.textContent = 'Viewing';

    panel.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading...</div></div>';

    const { data: ag, error } = await _supabase
        .from('diplomatic_proposals')
        .select('*')
        .eq('id', agreementId)
        .single();

    if (error || !ag) {
        panel.innerHTML = '<div class="empty-state"><div class="empty-state-text">Could not load agreement.</div></div>';
        return;
    }

    const pd = ag.proposal_data || {};
    const articles = pd.articles || [];
    const struckIndices = new Set(pd.struck_articles || []);
    const isV2 = pd.version === 2;
    const isTradeAgreement = ag.proposal_type === 'trade_agreement' || !!pd.agreement_type;
    const isStateVisit = ag.proposal_type === 'state_visit';
    const classification = pd.classification || '';
    const proposerName = pd.proposer_nation_name || 'Unknown';
    const targetName = pd.target_nation_name || 'Unknown';
    const durationYears = pd.duration_years || 0;
    const signedTick = ag.activated_at_tick;
    const expiresTick = signedTick != null && durationYears > 0
        ? signedTick + (durationYears * GAME_CONFIG.TICKS_PER_YEAR) : null;

    const typeInfo = isTradeAgreement ? TRADE_AGREEMENT_TYPES[pd.agreement_type] : null;
    const iconHtml = typeInfo ? (TRADE_TYPE_ICONS[typeInfo.icon] || '') : '';
    const durationLabel = durationYears === 'Permanent' ? 'Permanent' : durationYears ? durationYears + ' year' + (durationYears !== 1 ? 's' : '') : '—';

    let html = `
        <div class="sv-box-header" style="margin:-1px -1px 0;border-radius:0;">
            <div class="sv-box-dot sv-box-dot--teal"></div>
            <span class="sv-box-label">${isStateVisit ? 'State Visit' : 'Active Agreement'}</span>
            <div class="sv-box-header-right"><span class="sv-badge sv-badge--green">${isStateVisit ? 'Completed' : 'Active'}</span></div>
        </div>
        <div style="padding:14px;">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
                <button class="wizard-back-btn" onclick="renderDraftBox()" style="padding:5px 10px;font-size:0.72rem;">Back</button>
                ${typeInfo ? '<div class="trade-type-icon ' + typeInfo.icon + '" style="width:28px;height:28px;font-size:0.9rem;">' + iconHtml + '</div>' : ''}
                <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
                    ${FLAG_URLS[proposerName] ? '<img src="' + FLAG_URLS[proposerName] + '" alt="' + escapeHtml(proposerName) + '" style="width:30px;height:20px;object-fit:cover;border:1px solid rgba(255,255,255,0.08);border-radius:2px;">' : ''}
                    <span style="color:var(--text-faint);font-size:10px;">${isStateVisit ? '&#8594;' : '&amp;'}</span>
                    ${FLAG_URLS[targetName] ? '<img src="' + FLAG_URLS[targetName] + '" alt="' + escapeHtml(targetName) + '" style="width:30px;height:20px;object-fit:cover;border:1px solid rgba(255,255,255,0.08);border-radius:2px;">' : ''}
                </div>
                <div style="min-width:0;">
                    <div style="font-size:0.95rem;font-weight:bold;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${isStateVisit ? escapeHtml(stateVisitLabel(pd, proposerName, targetName)) : escapeHtml(pd.name || 'Unnamed Agreement')}</div>
                    <div style="font-size:0.7rem;color:var(--text-muted);">
                        ${escapeHtml(pd.visitor_nation || proposerName)} ${isStateVisit ? '&rarr;' : '&amp;'} ${escapeHtml(pd.host_nation || targetName)}
                        ${classification ? ' · ' + escapeHtml(classification) : ''}
                    </div>
                </div>
            </div>
            <div class="sv-summary-section" style="padding-top:0;">
                <div class="sv-summary-section-label">Agreement Details</div>
                <div class="sv-stat-row"><span class="sv-stat-label">Status</span><span class="sv-stat-value sv-stat-value--positive">Active</span></div>
                <div class="sv-stat-row"><span class="sv-stat-label">${isStateVisit ? 'Occurred' : 'Signed'}</span><span class="sv-stat-value">${signedTick != null ? tickToDate(signedTick) : '—'}</span></div>
                ${!isStateVisit ? '<div class="sv-stat-row"><span class="sv-stat-label">Expires</span><span class="sv-stat-value">' + (expiresTick != null ? tickToDate(expiresTick) : '—') + '</span></div>' : ''}
                ${!isStateVisit ? '<div class="sv-stat-row"><span class="sv-stat-label">Duration</span><span class="sv-stat-value">' + durationLabel + '</span></div>' : ''}
                ${typeInfo ? '<div class="sv-stat-row"><span class="sv-stat-label">Type</span><span class="sv-stat-value">' + escapeHtml(typeInfo.label) + '</span></div>' : ''}
            </div>
    `;

    // ── State Visit: show visit config, agenda, effects, costs, risks ──
    if (isStateVisit) {
        const vtLabel = STATE_VISIT_TYPES[pd.visit_type]?.label || 'State Visit';
        const svDurLabel = STATE_VISIT_DURATIONS[pd.duration]?.label || 'Moderate';
        const delLabel = STATE_VISIT_DELEGATIONS[pd.delegation_size]?.label || 'Standard (8)';
        const agenda = pd.agenda || [];
        const computedEffects = pd.computed_effects || {};

        // Visit configuration tags
        html += '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;">';
        html += '<span class="sv-effect-tag sv-effect-tag--info">' + escapeHtml(vtLabel) + '</span>';
        html += '<span class="sv-effect-tag sv-effect-tag--info">' + escapeHtml(svDurLabel) + '</span>';
        html += '<span class="sv-effect-tag sv-effect-tag--info">' + escapeHtml(delLabel) + '</span>';
        if (pd.visitor_leader) html += '<span class="sv-effect-tag sv-effect-tag--info">Led by ' + escapeHtml(pd.visitor_leader) + '</span>';
        html += '</div>';

        // Agenda items
        if (agenda.length > 0) {
            html += '<div class="sv-summary-section">';
            html += '<div class="sv-summary-section-label">Agenda (' + agenda.length + ' items)</div>';
            for (const key of agenda) {
                const item = STATE_VISIT_AGENDA_ITEMS.find(a => a.key === key);
                if (!item) continue;
                html += '<div style="font-size:11px;padding:5px 0;border-bottom:1px solid var(--border-subtle);display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">';
                html += '<div style="min-width:0;"><span style="color:var(--text-dim);font-size:10px;">Day ' + item.day + ' &middot; ' + escapeHtml(item.slot) + '</span><br><span style="color:var(--text-primary);">' + escapeHtml(item.title) + '</span>';
                html += '<div style="font-size:10px;color:var(--text-muted);margin-top:2px;">' + escapeHtml(item.desc) + '</div></div>';
                // Effect tags
                const effTags = [];
                if (item.effects) {
                    for (const [stat, val] of Object.entries(item.effects)) {
                        if (val) effTags.push('<span class="sv-effect-tag sv-effect-tag--positive">+' + val + ' ' + stat.replace(/_/g, ' ') + '</span>');
                    }
                }
                if (item.costs?.debt) effTags.push('<span class="sv-effect-tag sv-effect-tag--cost">$' + (item.costs.debt / 1e6).toFixed(1) + 'M</span>');
                if (item.risks?.gaffe) effTags.push('<span class="sv-effect-tag sv-effect-tag--risk">' + Math.round(item.risks.gaffe * 100) + '% gaffe</span>');
                if (item.risks?.hostiles_alarmed) effTags.push('<span class="sv-effect-tag sv-effect-tag--risk">hostiles alarmed</span>');
                if (effTags.length) html += '<div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center;flex-shrink:0;">' + effTags.join('') + '</div>';
                html += '</div>';
            }
            html += '</div>';
        }

        // Projected total effects
        const effectEntries = Object.entries(computedEffects).filter(([, v]) => v !== 0);
        if (effectEntries.length > 0) {
            html += '<div class="sv-summary-section">';
            html += '<div class="sv-summary-section-label">Projected Effects</div>';
            html += '<div style="display:flex;gap:6px;flex-wrap:wrap;">';
            for (const [stat, val] of effectEntries) {
                const sign = val > 0 ? '+' : '';
                const color = val > 0 ? '#5cb85c' : '#f44';
                html += '<span class="sv-effect-tag" style="border-color:' + color + '44;color:' + color + ';">' + sign + val + ' ' + escapeHtml(stat.replace(/_/g, ' ')) + '</span>';
            }
            html += '</div></div>';
        }

        // Budget cost
        if (pd.total_debt && pd.total_debt > 0) {
            html += '<div class="sv-summary-section">';
            html += '<div class="sv-summary-section-label">Embassy Budget Cost</div>';
            html += '<div class="sv-stat-row"><span class="sv-stat-label">Total Cost</span><span class="sv-stat-value sv-stat-value--negative">$' + (pd.total_debt / 1e6).toFixed(1) + 'M</span></div>';
            html += '</div>';
        }

        // Risks
        if (pd.risks && pd.risks.length > 0) {
            html += '<div class="sv-summary-section">';
            html += '<div class="sv-summary-section-label">Risks</div>';
            html += '<div style="display:flex;gap:6px;flex-wrap:wrap;">';
            for (const r of pd.risks) {
                if (r.chance) html += '<span class="sv-effect-tag sv-effect-tag--risk">' + escapeHtml(r.source) + ': ' + Math.round(r.chance * 100) + '% ' + escapeHtml(r.key) + '</span>';
                if (r.flag) html += '<span class="sv-effect-tag sv-effect-tag--risk">' + escapeHtml(r.source) + ': ' + escapeHtml(r.key) + '</span>';
            }
            html += '</div></div>';
        }

        // Special flags
        if (pd.is_first || pd.is_target_autocracy) {
            html += '<div class="sv-summary-section">';
            if (pd.is_first) html += '<div style="color:#FFD700;font-size:11px;margin-bottom:4px;">&#9733; First-ever visit between these nations — bonus stability!</div>';
            if (pd.is_target_autocracy) html += '<div style="color:#f97316;font-size:11px;">&#9888; Autocracy domestic risk: 1D12 dice roll on visitor\'s gov approval</div>';
            html += '</div>';
        }
    }

    // Articles
    if (articles.length > 0) {
        html += '<div class="sv-summary-section"><div class="sv-summary-section-label">Articles</div>';
        for (let i = 0; i < articles.length; i++) {
            const art = articles[i];
            const isStruck = isV2 ? (art.status === 'struck') : struckIndices.has(i);

            if (isTradeAgreement && art.type && TRADE_ARTICLE_TYPES[art.type]) {
                // Trade agreement articles — render with full sector/percentage details
                const artType = TRADE_ARTICLE_TYPES[art.type];
                const cardClass = isStruck ? 'trade-article-card trade-article-card--struck' : 'trade-article-card';
                html += `
                    <div class="${cardClass}">
                        <div class="trade-article-card-header">
                            <span class="trade-article-card-type">Art. ${toRoman(i + 1)} &mdash; ${escapeHtml(artType.label)}${isStruck ? ' — STRUCK' : ''}</span>
                        </div>
                        ${!isStruck ? '<div class="trade-article-card-summary">' + renderTradeArticleSummary(art) + '</div>' : ''}
                    </div>
                `;
            } else if (isV2) {
                const artTypeInfo = INITIATIVE_ARTICLE_TYPES[art.type] || MAJOR_INITIATIVE_ARTICLE_TYPES[art.type];
                const typeName = artTypeInfo ? artTypeInfo.label : art.type;
                const cardClass = isStruck ? 'initiative-article initiative-article--struck' : 'initiative-article';
                html += '<div class="' + cardClass + '">';
                html += '<div class="initiative-article-head">';
                html += '<div><span class="initiative-article-num">Art. ' + toRoman(i + 1) + '</span> ';
                html += '<span class="initiative-article-type">' + escapeHtml(typeName).toUpperCase();
                if (isStruck) html += ' — STRUCK';
                html += '</span></div></div>';
                if (artTypeInfo && artTypeInfo.description && !isStruck) {
                    html += '<div class="initiative-article-title">' + escapeHtml(artTypeInfo.description) + '</div>';
                }
                if (art.config && !isStruck) {
                    html += '<div style="margin:4px 0 2px;">' + renderArticleConfigSummary(art) + '</div>';
                }
                if (!isStruck) {
                    if (art.effects) {
                        html += renderEffectTagsFromEffects(art.effects, art.type);
                    } else {
                        const effects = computeArticleEffects(art);
                        html += renderEffectTags(effects, art.type);
                    }
                }
                html += '</div>';
            } else {
                const artLabel = escapeHtml(art.text || art.label || art.type || 'Unknown');
                const cardClass = isStruck ? 'initiative-article initiative-article--struck' : 'initiative-article';
                html += '<div class="' + cardClass + '">';
                html += '<div class="initiative-article-head">';
                html += '<div><span class="initiative-article-num">Art. ' + toRoman(i + 1) + '</span>';
                if (isStruck) html += ' <span class="initiative-article-type"> — STRUCK</span>';
                html += '</div></div>';
                html += '<div class="initiative-article-title">' + artLabel + '</div>';
                html += '</div>';
            }
        }
        html += '</div>'; // close sv-summary-section for Articles
    }

    // Trade effect summary tags
    if (isTradeAgreement && articles.length > 0) {
        html += renderTradeEffectSummary(articles);
    }

    // Effects summary (for non-trade diplomatic initiatives)
    if (!isTradeAgreement) {
        if (isV2) {
            const totals = { relations: 0, revenue: 0, cost_proposer: 0, cost_target: 0, intl_reputation: 0, immigration: 0, higher_education: 0, soft_power: 0, soft_power_per_year: 0, permanent_soft_power: 0, technology_bonus: 0, polarization: 0, terrorism_risk: 0, ongoing_per_tick: 0 };
            articles.forEach(art => {
                if (art.status !== 'struck' && art.effects) {
                    for (const k in totals) totals[k] += art.effects[k] || 0;
                }
            });
            html += '<div style="margin:10px 0;">' + renderEffectTags(totals, null) + '</div>';
        } else {
            let totalRel = 0, totalMoney = 0;
            articles.forEach((art, i) => {
                if (!struckIndices.has(i)) { totalRel += art.relations || 0; totalMoney += art.money || 0; }
            });
            if (totalRel || totalMoney) {
                const legacyEffects = {};
                if (totalRel) legacyEffects.relations = totalRel;
                if (totalMoney > 0) legacyEffects.revenue = totalMoney;
                if (totalMoney < 0) legacyEffects.cost_proposer = Math.abs(totalMoney);
                html += '<div style="margin:10px 0;">' + renderEffectTags(legacyEffects, null) + '</div>';
            }
        }
    }

    // Withdraw button (not shown for state visits — they are one-time events, not ongoing agreements)
    if ((diplomaticRoles.isFM || diplomaticRoles.isHoG) && !isStateVisit) {
        html += '<div class="sv-summary-section">';
        html += '<button class="detail-btn" style="color:var(--red);border-color:var(--red);" onclick="withdrawAgreement(\'' + ag.id + '\')">Withdraw Agreement</button>';
        html += '</div>';
    }

    html += '</div>'; // close padding wrapper

    panel.innerHTML = html;
}
window.viewActiveAgreement = viewActiveAgreement;

            const artType = TRADE_ARTICLE_TYPES[art.type];
            html += `

                    <div class="trade-article-card-header">
