async function renderRelationsBox() {
    const body = document.getElementById('relations-body');
    if (!body) return;
    body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading nations...</div></div>';

    if (!currentNation) {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">No nation data available.</div></div>';
        return;
    }

    try {
        const [nationsRes, relationsRes, ambassadorsRes, theirAmbassadorsRes, agreementsRes] = await Promise.all([
            _supabase.from('nations').select('*').order('name'),
            _supabase.from('diplomatic_relations').select('*')
                .or('nation_a_id.eq.' + currentNation.id + ',nation_b_id.eq.' + currentNation.id),
            _supabase.from('ambassadors').select('*, factions(abbreviation)')
                .eq('nation_id', currentNation.id).eq('is_active', true).eq('status', 'active'),
            _supabase.from('ambassadors').select('*, factions(abbreviation)')
                .eq('target_nation_id', currentNation.id).eq('is_active', true).eq('status', 'active'),
            _supabase.from('diplomatic_proposals').select('proposing_nation_id, target_nation_id')
                .eq('status', 'active')
                .or('proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + currentNation.id)
        ]);

        if (nationsRes.error) {
            body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Error loading nations.</div></div>';
            return;
        }

        const allNations = nationsRes.data || [];
        const allRelations = relationsRes.data || [];
        const ourAmbassadors = ambassadorsRes.data || [];
        const theirAmbassadors = theirAmbassadorsRes.data || [];
        const activeAgreements = agreementsRes.data || [];

        const otherNations = allNations.filter(n => n.id !== currentNation.id);
        cachedOtherNations = otherNations.map(n => ({ id: n.id, name: n.name }));
        const countEl = document.getElementById('relations-count');
        if (countEl) countEl.textContent = otherNations.length;

        if (otherNations.length === 0) {
            body.innerHTML = '<div class="empty-state"><div class="empty-state-text">No other nations found.</div></div>';
            return;
        }

        let html = '';
        for (const nation of otherNations) {
            const relation = allRelations.find(r =>
                (r.nation_a_id === currentNation.id && r.nation_b_id === nation.id) ||
                (r.nation_a_id === nation.id && r.nation_b_id === currentNation.id)
            );
            const score = relation?.relation_score ?? 35;
            const tier = getRelationTier(score, false);

            const ambassador = ourAmbassadors.find(a => a.target_nation_id === nation.id);
            const theirAmb = theirAmbassadors.find(a => a.nation_id === nation.id);

            // Embassy status
            let embassyClass = 'embassy-tag--none';
            let embassyLabel = 'No Embassy';
            if (ambassador && theirAmb) {
                embassyClass = 'embassy-tag--open';
                embassyLabel = 'Embassy Open';
            } else if (ambassador || theirAmb) {
                embassyClass = 'embassy-tag--closed';
                embassyLabel = 'Embassy Closed';
            }

            const agreementCount = activeAgreements.filter(a =>
                (a.proposing_nation_id === currentNation.id && a.target_nation_id === nation.id) ||
                (a.proposing_nation_id === nation.id && a.target_nation_id === currentNation.id)
            ).length;

            const dotColor = tierToDotColor(tier);
            const pillClass = tierToPillClass(tier);

            html += `
                <div class="nation-row" data-nation-id="${nation.id}" onclick="toggleRelationRow('${nation.id}')">
                    <div class="nation-dot" style="background:${dotColor}"></div>
                    <span class="nation-name" ${getNationMapColor(nation.name) ? 'style="color:' + getNationMapColor(nation.name) + '"' : ''}>${escapeHtml(nation.name)}</span>
                    <div class="nation-meta">
                        <span class="pill ${pillClass}">${tier.label}</span>
                        <span class="embassy-tag ${embassyClass}">${embassyLabel}</span>
                        ${agreementCount > 0 ? '<span class="agreements-count">' + agreementCount + ' treaty' + (agreementCount > 1 ? 's' : '') + '</span>' : ''}
                        <span class="expand-arrow">&#9654;</span>
                    </div>
                </div>
                <div class="nation-detail" id="nation-detail-${nation.id}" data-loaded="0">
                    <div class="empty-state"><div class="empty-state-text">Loading...</div></div>
                </div>
            `;
        }

        body.innerHTML = html;
    } catch (err) {
        console.error('Error rendering relations box:', err);
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Error loading nations.</div></div>';
    }
}

// ── Toggle nation row expand / collapse ──
async function toggleRelationRow(nationId) {
    const row = document.querySelector('.nation-row[data-nation-id="' + nationId + '"]');
    const detail = document.getElementById('nation-detail-' + nationId);
    if (!row || !detail) return;

    const wasExpanded = row.classList.contains('is-expanded');

    // Collapse all
    document.querySelectorAll('.nation-row.is-expanded').forEach(r => r.classList.remove('is-expanded'));

    if (wasExpanded) return; // just collapse

    // Expand this one
    row.classList.add('is-expanded');

    // Lazy-load detail content
    if (detail.dataset.loaded === '0') {
        detail.dataset.loaded = '1';
        await renderRelationDetail(nationId);
    }
}
window.toggleRelationRow = toggleRelationRow;

// ── Select target nation for draft panel ──
async function hasBilateralTalksDiscount(targetNationId) {
    if (!currentNation?.id || !targetNationId) return false;
    try {
        const tick = shardTick;
        const { data: logs } = await _supabase
            .from('diplomatic_action_log')
            .select('action_data')
            .eq('nation_id', currentNation.id)
            .eq('target_nation_id', targetNationId)
            .eq('action_type', 'state_visit')
            .eq('applied_at_tick', tick)
            .limit(1);
        return (logs || []).some(l => l.action_data?.bilateral_talks_discount);
    } catch (_) { return false; }
}

async function renderActionsBox() {
    const body = document.getElementById('actions-body');
    if (!body) return;

    // Check for bilateral talks AP discount with the selected target nation
    let _btDiscount = false;
    if (activeDraftTarget) {
        _btDiscount = await hasBilateralTalksDiscount(activeDraftTarget.id);
    }

    // Fetch unread message count for the Send Message badge (role-gated)
    if (currentNation && currentFaction && diplomaticRoles) {
        try {
            const _fm = diplomaticRoles.isFM;
            const _mot = diplomaticRoles.isMoT;
            const _ambIds = (diplomaticRoles.ambassadorTo || []).map(a => a.target_nation_id);
            if (_fm || _mot || _ambIds.length > 0) {
                const { data: msgs } = await _supabase
                    .from('diplomatic_messages')
                    .select('id, from_nation_id, read_by_factions')
                    .eq('to_nation_id', currentNation.id)
                    .neq('from_nation_id', currentNation.id);
                let count = 0;
                for (const msg of (msgs || [])) {
                    if ((msg.read_by_factions || []).includes(currentFaction.id)) continue;
                    if (_fm || _mot || _ambIds.includes(msg.from_nation_id)) count++;
                }
                totalUnreadMessages = count;
            } else {
                totalUnreadMessages = 0;
            }
        } catch (e) { /* non-blocking */ }
    }

    const hasHoG = diplomaticRoles && diplomaticRoles.isHoG;
    const hasFM = diplomaticRoles && diplomaticRoles.isFM;
    const hasMoT = diplomaticRoles && diplomaticRoles.isMoT;
    const hasAmb = diplomaticRoles && diplomaticRoles.ambassadorTo && diplomaticRoles.ambassadorTo.length > 0;

    let html = '';

    // Show bilateral talks discount banner if active
    if (_btDiscount) {
        html += `<div style="background:var(--teal-faint);border:1px solid var(--teal-border);border-radius:4px;padding:6px 10px;margin-bottom:8px;font-family:var(--font-mono);font-size:9.5px;color:var(--teal);line-height:1.4;">
            🤝 <strong>Bilateral Talks Active</strong> — All diplomatic actions with this nation cost <strong>-1 AP</strong> this tick.
        </div>`;
    }

    // Helper: render a single action item (enabled or disabled)
    function actionHtml(a, enabled, role) {
        const isDisabled = !enabled || a.comingSoon;
        const disabledClass = isDisabled ? ' action-disabled' : '';
        // Bilateral talks discount: -1 AP on non-state-visit actions (state visit has its own cost calc)
        const discounted = _btDiscount && a.ap > 0 && a.key !== 'state_visit';
        const effectiveAp = discounted ? Math.max(0, a.ap - 1) : a.ap;
        const onclick = !isDisabled ? `onclick="selectDraftAction('${a.key}','${escapeHtml(a.label)}',${effectiveAp},'${a.type}','${role}')"` : '';
        let costLabel;
        if (discounted && a.ap > 0) {
            costLabel = `<s style="opacity:0.5">${a.ap}</s> ${effectiveAp} AP <span style="color:var(--teal);font-size:9px;">🤝</span>`;
        } else {
            costLabel = a.ap > 0 ? a.ap + ' AP' : 'Free';
        }
        const badgeHtml = a.badge ? '<span class="action-badge">' + a.badge + '</span>' : '';
        return `<div class="action-item${disabledClass}" data-action="${a.key}" ${onclick}>
                <span class="action-name">${a.label}${badgeHtml}</span>
                <span class="action-cost">${costLabel}</span>
            </div>`;
    }

    // Ambassador
    html += '<div class="role-header role-header-amb' + (hasAmb ? '' : ' role-disabled') + '">Ambassador</div>';
    [
        { key: 'issue_statement', label: 'Issue Statement', ap: 1, type: 'amb' },
        { key: 'minor_initiative', label: 'Minor Diplomatic Initiative', ap: 2, type: 'amb' },
        { key: 'foreign_aid', label: 'Foreign Aid Proposal', ap: 4, type: 'amb', comingSoon: true },
        { key: 'formal_protest', label: 'Formal Protest', ap: 2, type: 'amb', comingSoon: true },
        { key: 'send_message', label: 'Send Message', ap: 0, type: 'amb', badge: totalUnreadMessages > 0 ? totalUnreadMessages : 0 }
    ].forEach(a => { html += actionHtml(a, hasAmb, 'amb'); });

    // Head of Government
    html += '<div class="role-header role-header-hog' + (hasHoG ? '' : ' role-disabled') + '">Head of Government</div>';
    [
        { key: 'declare_war', label: 'Declare War', ap: 8, type: 'hog', comingSoon: true },
        { key: 'call_ceasefire', label: 'Call for Ceasefire', ap: 4, type: 'hog', comingSoon: true },
        { key: 'sign_alliance', label: 'Sign Alliance', ap: 6, type: 'hog', comingSoon: true },
        { key: 'state_visit', label: 'State Visit', ap: DIPLOMACY_CONFIG.STATE_VISIT_AP || 4, type: 'hog' }
    ].forEach(a => { html += actionHtml(a, hasHoG, 'hog'); });

    // Foreign Minister
    html += '<div class="role-header role-header-fm' + (hasFM ? '' : ' role-disabled') + '">Foreign Minister</div>';
    [
        { key: 'appoint_ambassador', label: 'Appoint Ambassador', ap: 1, type: 'fm' },
        { key: 'recall_ambassador', label: 'Recall Ambassador', ap: 1, type: 'fm' },
        { key: 'major_initiative', label: 'Major Diplomatic Initiative', ap: 2, type: 'fm' }
    ].forEach(a => { html += actionHtml(a, hasFM, 'fm'); });

    // Minister of Trade
    html += '<div class="role-header role-header-mot' + (hasMoT ? '' : ' role-disabled') + '">Minister of Trade</div>';
    [
        { key: 'trade_agreement', label: 'Trade Agreement', ap: 2, type: 'mot' }
    ].forEach(a => { html += actionHtml(a, hasMoT, 'mot'); });
    // Unilateral actions under MoT
    html += '<div style="padding:2px 14px 4px;"><span style="font-family:var(--font-mono);font-size:7.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-faint);">Unilateral</span></div>';
    [
        { key: 'retaliatory_tariff_draft', label: 'Retaliatory Tariff', ap: 2, type: 'mot' },
        { key: 'export_subsidy_draft', label: 'Export Subsidy', ap: 2, type: 'mot' },
        { key: 'utr_draft', label: 'Tariff Reduction', ap: 3, type: 'mot' },
        { key: 'impose_embargo_draft', label: 'Impose Embargo', ap: 5, type: 'mot' }
    ].forEach(a => { html += actionHtml(a, hasMoT, 'mot'); });

    body.innerHTML = html;
}

// ── Select action for draft panel ──
function selectDraftAction(key, label, apCost, type, role) {
    // Clear previous active
    document.querySelectorAll('.action-item.is-active').forEach(el => el.classList.remove('is-active'));
    // Set new active
    const el = document.querySelector('.action-item[data-action="' + key + '"]');
    if (el) el.classList.add('is-active');

    activeDraftAction = { key, label, apCost, type, role };
    renderDraftBox();
}
window.selectDraftAction = selectDraftAction;

// ── Toggle negotiation row expand / collapse ──
async function renderDraftBox() {
    const body = document.getElementById('draft-body');
    if (!body) return;

    const statusEl = document.getElementById('draft-status');

    if (!activeDraftAction) {
        if (statusEl) statusEl.textContent = '';
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Select an action from the right panel to begin drafting.</div></div>';
        return;
    }

    if (statusEl) statusEl.textContent = 'Drafting';

    // Special branch for Recall Ambassador
    if (activeDraftAction.key === 'recall_ambassador') {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading...</div></div>';
        renderRecallAmbassadorPanel(body, statusEl);
        return;
    }

    // Special branch for Appoint Ambassador
    if (activeDraftAction.key === 'appoint_ambassador') {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading...</div></div>';
        renderAppointAmbassadorPanel(body, statusEl);
        return;
    }

    // Special branch for Trade Agreement
    if (activeDraftAction.key === 'trade_agreement') {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading...</div></div>';
        renderTradeAgreementDraftPanel(body, statusEl);
        return;
    }

    // Special branch for Retaliatory Tariff (unilateral)
    if (activeDraftAction.key === 'retaliatory_tariff_draft') {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading...</div></div>';
        await renderRetaliatoryTariffDraftPanel(body, statusEl);
        return;
    }

    // Special branch for Export Subsidy (unilateral)
    if (activeDraftAction.key === 'export_subsidy_draft') {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading...</div></div>';
        await renderExportSubsidyDraftPanel(body, statusEl);
        return;
    }

    // Special branch for Unilateral Tariff Reduction
    if (activeDraftAction.key === 'utr_draft') {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading...</div></div>';
        await renderUTRDraftPanel(body, statusEl);
        return;
    }

    // Special branch for Impose Embargo (unilateral)
    if (activeDraftAction.key === 'impose_embargo_draft') {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading...</div></div>';
        await renderEmbargoDraftPanel(body, statusEl);
        return;
    }

    // Special branch for State Visit — rich two-panel builder
    if (activeDraftAction.key === 'state_visit') {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading...</div></div>';
        await renderStateVisitDraftPanel(body, statusEl);
        return;
    }

    // Special branch for Send Message — show diplomatic chat
    if (activeDraftAction.key === 'send_message') {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading...</div></div>';
        await renderSendMessagePanel(body, statusEl);
        return;
    }

    // Special branch for Issue Statement — simple free-text statement
    if (activeDraftAction.key === 'issue_statement') {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading...</div></div>';
        renderIssueStatementPanel(body, statusEl);
        return;
    }

    // Special branch for Minor Diplomatic Initiative — rich article config UI
    if (activeDraftAction.key === 'minor_initiative') {
        renderMinorInitiativeDraftPanel(body, statusEl);
        return;
    }

    // Special branch for Major Diplomatic Initiative — FM-only rich article config UI
    if (activeDraftAction.key === 'major_initiative') {
        renderMajorInitiativeDraftPanel(body, statusEl);
        return;
    }

    // Fallback: generic draft panel (should not reach here for known actions)
    body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Unknown action: ' + escapeHtml(activeDraftAction.key) + '</div></div>';
}

// ── Trade Agreement Draft Panel ──
var draftTradeMode = false;  // flag so saveWizardTradeArticle/removeWizardTradeArticle know to re-render draft panel

function renderTradeAgreementDraftPanel(body, statusEl) {
    if (statusEl) statusEl.textContent = 'Trade Agreement';
    draftTradeMode = true;

    // Sync state: if no agreements, clear wizard pointers
    if (draftAgreements.length === 0) {
        wizardTradeAgreementType = null;
        tradeArticles = [];
    }

    let html = '<div class="draft-panel">';

    // Header: action label
    html += '<div class="draft-header">';
    html += '<div class="draft-field"><div class="draft-field-label">Action</div><div class="draft-field-input">' + escapeHtml(activeDraftAction.label) + ' <span style="color:var(--teal);">(' + activeDraftAction.apCost + ' AP)</span></div></div>';

    // Target Nation dropdown
    let targetFieldHtml = '<select id="draft-target-select" style="width:100%;background:var(--bg-3);border:1px solid var(--border-subtle);color:var(--text-primary);font-family:var(--font-sans);font-size:12px;padding:4px 8px;" onchange="selectDraftTradeTarget(this.value)">';
    targetFieldHtml += '<option value="">Select a nation...</option>';
    cachedOtherNations.forEach(n => {
        const sel = activeDraftTarget && activeDraftTarget.id === n.id ? ' selected' : '';
        targetFieldHtml += '<option value="' + n.id + '"' + sel + '>' + escapeHtml(n.name) + '</option>';
    });
    targetFieldHtml += '</select>';
    html += '<div class="draft-field"><div class="draft-field-label">Target Nation</div>' + targetFieldHtml + '</div>';
    html += '</div>';

    if (!activeDraftTarget) {
        html += '<div class="empty-state" style="padding:20px 0;"><div class="empty-state-text">Select a target nation to continue.</div></div>';
        html += '</div>';
        body.innerHTML = html;
        return;
    }

    // ── Type selector (shown when no agreements yet, or adding a new one to bundle) ──
    const usedTypes = draftAgreements.map(a => a.type);
    const showTypeSelector = draftAgreements.length === 0 || addingNewAgreement;

    if (showTypeSelector) {
        const prompt = draftAgreements.length === 0 ? 'Choose agreement type:' : 'Add another agreement to the package:';
        html += '<div style="font-size:0.78rem;color:var(--text-muted);margin-bottom:10px;">' + prompt + '</div>';
        html += '<div class="type-card-grid">';
        for (const [key, typeInfo] of Object.entries(TRADE_AGREEMENT_TYPES)) {
            if (!typeInfo.bilateral) continue;
            if (usedTypes.includes(key)) continue;
            html += `
                <div class="type-card" onclick="selectDraftTradeType('${key}')">
                    <div class="type-card-short">${escapeHtml(typeInfo.shortLabel)}</div>
                    <div class="type-card-title">${escapeHtml(typeInfo.label)}</div>
                    <div class="type-card-effects"><span class="trade-type-tag bilateral">BILATERAL</span></div>
                </div>`;
        }
        html += '</div>';

        // Show existing agreement tabs if we're adding to a bundle
        if (draftAgreements.length > 0) {
            html += renderAgreementTabs(true);
        }

        html += '<div class="detail-actions" style="margin-top:auto;padding-top:10px;border-top:1px solid var(--border-hair);">';
        html += '<button class="detail-btn" onclick="cancelDraft()">Cancel</button>';
        if (draftAgreements.length > 0) {
            html += '<button class="detail-btn" style="margin-left:4px;" onclick="cancelAddAgreement()">Back</button>';
        }
        html += '</div>';
        html += '</div>';
        body.innerHTML = html;
        return;
    }

    // ── Agreement name (shared across entire package) ──
    const activeType = draftAgreements.length === 1 ? TRADE_AGREEMENT_TYPES[draftAgreements[0].type] : null;
    const placeholderSuffix = draftAgreements.length > 1 ? 'Trade Package' : (activeType?.shortLabel || 'Trade') + ' Agreement';
    const placeholderName = (currentNation?.name || '') + '-' + (activeDraftTarget?.name || '') + ' ' + placeholderSuffix;
    html += '<div class="draft-field"><div class="draft-field-label">Name</div><input type="text" id="trade-neg-name" class="draft-field-input" placeholder="e.g. ' + escapeHtml(placeholderName) + '" value="' + escapeHtml(wizardName || '') + '" oninput="setWizardName(this.value)" style="border:1px solid var(--border-subtle);background:var(--bg-3);color:var(--text-primary);padding:4px 8px;font-family:var(--font-sans);font-size:12px;width:100%;"></div>';

    // ── Agreement Tabs ──
    html += renderAgreementTabs(false);

    // ── Active tab: article builder ──
    const typeInfo = TRADE_AGREEMENT_TYPES[wizardTradeAgreementType];
    const availableTypes = getAvailableArticleTypes(wizardTradeAgreementType, tradeArticles);
    const hasRequired = checkRequiredArticles(wizardTradeAgreementType, tradeArticles);

    // Type explainer
    const explainer = getTradeTypeExplainer(wizardTradeAgreementType);
    if (explainer) {
        html += '<div class="trade-info-box info" style="margin-top:8px;">' + explainer + '</div>';
    }

    // Existing articles for active tab
    html += '<div class="draft-articles">';
    if (tradeArticles.length === 0) {
        html += '<div class="empty-state" style="padding:14px 0;"><div class="empty-state-text">No articles added yet.</div></div>';
    } else {
        for (let i = 0; i < tradeArticles.length; i++) {
            const art = tradeArticles[i];
            const summary = renderTradeArticleSummary(art, currentNation.id);
            const artTypeInfo = TRADE_ARTICLE_TYPES[art.type];
            const artLabel = artTypeInfo?.label || art.type;
            const artDesc = artTypeInfo?.description || '';
            const isRequired = (typeInfo.required_articles || []).includes(art.type);
            html += `
                <div class="draft-article">
                    <div class="draft-article-type">
                        <span>Art. ${toRoman(i + 1)} — ${escapeHtml(artLabel)} ${isRequired ? '<span class="badge badge--teal" style="margin-left:4px;">Required</span>' : '<span class="badge badge--dim" style="margin-left:4px;">Optional</span>'}</span>
                        <span class="draft-article-remove" onclick="removeDraftTradeArticle(${i})">Remove</span>
                    </div>
                    <div class="draft-article-title" style="font-size:0.75rem;">${summary}</div>
                    <div class="draft-article-body">${escapeHtml(artDesc)}</div>
                </div>`;
        }
    }
    html += '</div>';

    // Add article dropdown + editor
    if (availableTypes.length > 0) {
        html += '<div class="draft-add-row">';
        html += '<select id="wizard-trade-article-type" style="flex:1;background:var(--bg-3);border:1px solid var(--border-subtle);color:var(--text-primary);font-family:var(--font-sans);font-size:11px;padding:4px 8px;">';
        html += '<option value="">Add article...</option>';
        availableTypes.forEach(t => {
            html += '<option value="' + t.key + '">' + escapeHtml(t.label) + (t.required ? ' (required)' : '') + '</option>';
        });
        html += '</select>';
        html += '<button class="detail-btn" onclick="showDraftTradeArticleEditor()">Add</button>';
        html += '</div>';
        html += '<div id="wizard-trade-article-editor"></div>';
    }

    // Required articles warning for active tab
    if (!hasRequired) {
        const missing = (typeInfo.required_articles || []).filter(req => !tradeArticles.some(a => a.type === req));
        const missingLabels = missing.map(m => TRADE_ARTICLE_TYPES[m]?.label || m).join(', ');
        html += '<div style="font-size:0.72rem;color:#f97316;margin-top:8px;">Required: ' + escapeHtml(missingLabels) + '</div>';
    }

    // Check if ALL agreements in the bundle are complete
    const allComplete = draftAgreements.every(ag => checkRequiredArticles(ag.type, ag.articles));

    // Action bar
    html += '<div class="detail-actions" style="margin-top:auto;padding-top:10px;border-top:1px solid var(--border-hair);">';
    html += '<button class="detail-btn" onclick="cancelDraft()">Cancel</button>';
    if (draftAgreements.length > 1) {
        html += '<button class="detail-btn" style="margin-left:4px;font-size:0.7rem;color:var(--red);" onclick="removeAgreementTab(' + activeAgreementTab + ')">Remove</button>';
    }
    html += '<button class="detail-btn" style="color:var(--teal);border-color:var(--teal-border);" ' + (allComplete ? '' : 'disabled') + ' onclick="submitDraftTradeProposal()">Send Proposal</button>';
    html += '</div>';

    html += '</div>';
    body.innerHTML = html;
}

// ── Agreement Tabs renderer ──
function renderAgreementTabs(isAddingNew) {
    if (draftAgreements.length === 0) return '';
    let html = '<div class="agreement-tabs">';
    draftAgreements.forEach((ag, i) => {
        const ti = TRADE_AGREEMENT_TYPES[ag.type];
        const isActive = !isAddingNew && i === activeAgreementTab;
        const complete = checkRequiredArticles(ag.type, ag.articles);
        html += '<div class="agreement-tab' + (isActive ? ' active' : '') + '" onclick="switchAgreementTab(' + i + ')">';
        html += '<span class="agreement-tab-label">' + escapeHtml(ti?.shortLabel || 'AGR') + '</span>';
        html += '<span class="agreement-tab-count">' + ag.articles.length + ' art.</span>';
        if (complete) html += '<span class="agreement-tab-check">\u2713</span>';
        html += '</div>';
    });
    // "+ Add" tab if more bilateral types available
    const usedTypes = draftAgreements.map(a => a.type);
    const hasMore = Object.entries(TRADE_AGREEMENT_TYPES).some(([k, v]) => v.bilateral && !usedTypes.includes(k));
    if (hasMore) {
        html += '<div class="agreement-tab agreement-tab--add' + (isAddingNew ? ' active' : '') + '" onclick="showAddAgreementSelector()">+ Add</div>';
    }
    html += '</div>';
    return html;
}

function selectDraftTradeTarget(nationId) {
    if (!nationId) { activeDraftTarget = null; }
    else {
        const nation = cachedOtherNations.find(n => n.id === nationId);
        activeDraftTarget = nation || null;
    }
    // Reset agreements when target changes
    draftAgreements = [];
    activeAgreementTab = -1;
    addingNewAgreement = false;
    wizardTradeAgreementType = null;
    tradeArticles = [];
    reRenderTradeDraft();
}
window.selectDraftTradeTarget = selectDraftTradeTarget;

function selectDraftTradeType(typeKey) {
    const newAg = { type: typeKey, articles: [] };
    draftAgreements.push(newAg);
    activeAgreementTab = draftAgreements.length - 1;
    wizardTradeAgreementType = typeKey;
    tradeArticles = newAg.articles; // reference — mutations flow through
    addingNewAgreement = false;
    if (draftAgreements.length === 1) wizardName = '';
    reRenderTradeDraft();
}
window.selectDraftTradeType = selectDraftTradeType;

function switchAgreementTab(index) {
    if (index < 0 || index >= draftAgreements.length) return;
    activeAgreementTab = index;
    wizardTradeAgreementType = draftAgreements[index].type;
    tradeArticles = draftAgreements[index].articles;
    addingNewAgreement = false;
    reRenderTradeDraft();
}
window.switchAgreementTab = switchAgreementTab;

function showAddAgreementSelector() {
    addingNewAgreement = true;
    reRenderTradeDraft();
}
window.showAddAgreementSelector = showAddAgreementSelector;

function cancelAddAgreement() {
    addingNewAgreement = false;
    if (activeAgreementTab >= 0 && activeAgreementTab < draftAgreements.length) {
        wizardTradeAgreementType = draftAgreements[activeAgreementTab].type;
        tradeArticles = draftAgreements[activeAgreementTab].articles;
    }
    reRenderTradeDraft();
}
window.cancelAddAgreement = cancelAddAgreement;

function removeAgreementTab(index) {
    if (draftAgreements.length <= 1) return;
    draftAgreements.splice(index, 1);
    if (activeAgreementTab >= draftAgreements.length) {
        activeAgreementTab = draftAgreements.length - 1;
    }
    wizardTradeAgreementType = draftAgreements[activeAgreementTab].type;
    tradeArticles = draftAgreements[activeAgreementTab].articles;
    reRenderTradeDraft();
}
window.removeAgreementTab = removeAgreementTab;

function showDraftTradeArticleEditor() {
    const select = document.getElementById('wizard-trade-article-type');
    const articleType = select?.value;
    if (!articleType) { alert('Select an article type first.'); return; }
    const container = document.getElementById('wizard-trade-article-editor');
    if (!container) return;
    renderTradeArticleEditorLocal(container, articleType);
}
window.showDraftTradeArticleEditor = showDraftTradeArticleEditor;

function removeDraftTradeArticle(index) {
    tradeArticles.splice(index, 1);
    reRenderTradeDraft();
}
window.removeDraftTradeArticle = removeDraftTradeArticle;

function reRenderTradeDraft() {
    const body = document.getElementById('draft-body');
    const statusEl = document.getElementById('draft-status');
    if (body) renderTradeAgreementDraftPanel(body, statusEl);
}

async function submitDraftTradeProposal() {
    // Validate all agreements in the bundle have required articles
    for (const ag of draftAgreements) {
        if (!checkRequiredArticles(ag.type, ag.articles)) {
            const ti = TRADE_AGREEMENT_TYPES[ag.type];
            alert('Missing required articles for ' + (ti?.label || ag.type) + '.');
            return;
        }
    }

    // Merge all articles from all agreements, tagging each with its parent agreement type
    const mergedArticles = [];
    for (const ag of draftAgreements) {
        for (const art of ag.articles) {
            mergedArticles.push({ ...art, agreementType: ag.type });
        }
    }

    // Bridge into wizard state for submitTradeProposal()
    wizardTargetNation = activeDraftTarget?.id;
    wizardTradeAgreementType = draftAgreements[0].type; // primary type
    tradeArticles = mergedArticles;
    submitTradeProposal();
}
window.submitDraftTradeProposal = submitDraftTradeProposal;

// ══════════════════════════════════════════════════════
// RETALIATORY TARIFF — Streamlined Draft Panel
// ══════════════════════════════════════════════════════
async function renderRetaliatoryTariffDraftPanel(body, statusEl) {
    if (statusEl) { statusEl.textContent = 'Drafting'; statusEl.className = 'badge badge--amber'; }

    const apCost = 2;

    // Nation selector
    let html = '<div class="draft-panel"><div class="draft-header">';
    html += '<div class="draft-field"><div class="draft-field-label">Action</div><div class="draft-field-input">Retaliatory Tariff <span style="color:var(--red);">' + apCost + ' AP</span></div></div>';

    let targetFieldHtml = '<select id="rt-draft-target" style="width:100%;background:var(--bg-3);border:1px solid var(--border-subtle);color:var(--text-primary);font-family:var(--font-sans);font-size:12px;padding:4px 8px;" onchange="updateRTDraftTarget(this.value)">';
    targetFieldHtml += '<option value="">Select target nation...</option>';
    cachedOtherNations.forEach(n => {
        const sel = activeDraftTarget && activeDraftTarget.id === n.id ? ' selected' : '';
        targetFieldHtml += '<option value="' + n.id + '"' + sel + '>' + escapeHtml(n.name) + '</option>';
    });
    targetFieldHtml += '</select>';
    html += '<div class="draft-field"><div class="draft-field-label">Target</div>' + targetFieldHtml + '</div>';
    html += '</div>';

    if (!activeDraftTarget) {
        html += '<div class="empty-state" style="padding:20px 0;"><div class="empty-state-text">Select a target nation.</div></div></div>';
        body.innerHTML = html;
        return;
    }

    // Check for existing active RT
    const { data: existingRT } = await _supabase
        .from('trade_agreements')
        .select('id')
        .eq('status', 'active')
        .eq('agreement_type', 'retaliatory_tariff')
        .eq('nation_a_id', currentNation.id)
        .eq('nation_b_id', activeDraftTarget.id);

    if (existingRT && existingRT.length > 0) {
        html += '<div class="trade-info-box warning" style="margin:12px 14px;">You already have an active retaliatory tariff against ' + escapeHtml(activeDraftTarget.name) + '. Withdraw the existing one first.</div></div>';
        body.innerHTML = html;
        return;
    }

    html += '<div class="trade-info-box info" style="margin:8px 14px;">Impose a tariff surcharge on imports from ' + escapeHtml(activeDraftTarget.name) + '. No negotiation — your parliament ratifies.</div>';

    // Sectors
    const sectorOpts = TRADEABLE_SECTORS.map(s =>
        '<label class="trade-checkbox-option" style="margin-bottom:2px;padding:0 14px;">' +
            '<input type="checkbox" name="rt-draft-sector" value="' + s.key + '" onchange="updateRTDraftSummary()" /> ' +
            escapeHtml(s.label) +
        '</label>'
    ).join('');
    html += '<div style="padding:8px 14px 0;"><div class="draft-field-label">Sectors</div></div>';
    html += sectorOpts;

    // Surcharge rate
    html += '<div style="padding:8px 14px;">';
    html += '<div class="draft-field-label">Surcharge Rate</div>';
    html += '<div style="display:flex;align-items:center;gap:10px;margin-top:4px;">';
    html += '<input type="range" id="rt-draft-pct" min="5" max="50" value="25" style="flex:1;" oninput="updateRTDraftSummary()" />';
    html += '<span id="rt-draft-pct-display" style="font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--text-primary);min-width:36px;">25%</span>';
    html += '</div></div>';

    // Duration
    html += '<div style="padding:4px 14px;">';
    html += '<div class="draft-field-label">Duration</div>';
    html += '<div class="trade-radio-group" style="margin-top:4px;margin-bottom:6px;">';
    html += '<label class="trade-radio-option selected" onclick="selectRadioOption(this);toggleRTDraftDuration()"><input type="radio" name="rt-draft-dur" value="fixed" checked /><div><div class="trade-radio-label">Fixed Term</div></div></label>';
    html += '<label class="trade-radio-option" onclick="selectRadioOption(this);toggleRTDraftDuration()"><input type="radio" name="rt-draft-dur" value="permanent" /><div><div class="trade-radio-label">Until Revoked</div></div></label>';
    html += '</div>';
    html += '<div id="rt-draft-dur-fields"><input type="number" id="rt-draft-ticks" value="12" min="4" max="48" style="width:80px;background:var(--bg-3);border:1px solid var(--border-subtle);color:var(--text-primary);padding:4px 8px;font-size:12px;" /> <span style="font-size:0.72rem;color:var(--text-dim);">ticks</span></div>';
    html += '</div>';

    // Summary
    html += '<div id="rt-draft-summary" class="trade-info-box info" style="margin:8px 14px;">Select sectors to see impact.</div>';

    // Action bar
    html += '<div class="detail-actions" style="margin-top:auto;padding-top:10px;border-top:1px solid var(--border-hair);">';
    html += '<button class="detail-btn" onclick="cancelDraft()">Cancel</button>';
    html += '<button class="detail-btn" id="rt-draft-submit" style="color:var(--teal);border-color:var(--teal-border);" disabled onclick="submitRTDraft()">Submit for Ratification (' + apCost + ' AP)</button>';
    html += '</div></div>';
    body.innerHTML = html;
}

async function updateRTDraftTarget(nationId) {
    if (!nationId) { activeDraftTarget = null; }
    else {
        const nation = cachedOtherNations.find(n => n.id === nationId);
        activeDraftTarget = nation || null;
    }
    const body = document.getElementById('draft-body');
    const statusEl = document.getElementById('draft-status');
    if (body) await renderRetaliatoryTariffDraftPanel(body, statusEl);
}
window.updateRTDraftTarget = updateRTDraftTarget;

function toggleRTDraftDuration() {
    const isPermanent = document.querySelector('input[name="rt-draft-dur"][value="permanent"]')?.checked;
    const fields = document.getElementById('rt-draft-dur-fields');
    if (fields) fields.style.display = isPermanent ? 'none' : 'block';
}
window.toggleRTDraftDuration = toggleRTDraftDuration;

function updateRTDraftSummary() {
    const pct = parseInt(document.getElementById('rt-draft-pct')?.value || '25');
    const display = document.getElementById('rt-draft-pct-display');
    if (display) display.textContent = pct + '%';

    const checked = document.querySelectorAll('input[name="rt-draft-sector"]:checked');
    const btn = document.getElementById('rt-draft-submit');
    const summary = document.getElementById('rt-draft-summary');

    if (checked.length === 0) {
        if (summary) { summary.className = 'trade-info-box info'; summary.textContent = 'Select sectors to see impact.'; }
        if (btn) btn.disabled = true;
        return;
    }
    if (btn) btn.disabled = false;

    const sectorNames = [];
    checked.forEach(cb => { const s = TRADEABLE_SECTORS.find(ts => ts.key === cb.value); if (s) sectorNames.push(s.label); });
    const relPenalty = Math.round(pct / 2);

    if (summary) {
        summary.className = 'trade-info-box ' + (pct >= 35 ? 'warning' : 'info');
        summary.innerHTML = '<strong>+' + pct + '% surcharge</strong> on ' + sectorNames.join(', ') + ' imports. Diplomatic impact: <strong>-' + relPenalty + ' Relations</strong>.';
    }
}
window.updateRTDraftSummary = updateRTDraftSummary;

async function submitRTDraft() {
    const btn = document.getElementById('rt-draft-submit');
    if (btn) btn.disabled = true;

    const checked = document.querySelectorAll('input[name="rt-draft-sector"]:checked');
    if (checked.length === 0) { alert('Select at least one sector.'); if (btn) btn.disabled = false; return; }

    const pct = Math.min(50, Math.max(5, parseInt(document.getElementById('rt-draft-pct')?.value || '25')));
    const durType = document.querySelector('input[name="rt-draft-dur"]:checked')?.value || 'fixed';
    const durTicks = durType === 'fixed' ? Math.min(48, Math.max(4, parseInt(document.getElementById('rt-draft-ticks')?.value || '12'))) : null;
    const apCost = 2;
    const targetId = activeDraftTarget?.id;
    const targetName = activeDraftTarget?.name || 'Unknown';
    if (!targetId) { alert('Select a target nation.'); if (btn) btn.disabled = false; return; }

    const apResult = await deductAP(_supabase, currentFaction.id, apCost);
    if (!apResult.success) {
        if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
        alert('Not enough AP (' + apCost + ' needed). Current AP: ' + (apResult.currentAp ?? '?'));
        if (btn) btn.disabled = false;
        return;
    }

    const currentTick = shardTick;

    const articles = [];
    checked.forEach(cb => {
        articles.push({ type: 'tariff_surcharge', data: { sector: cb.value, surcharge_pct: pct, imposer_nation_id: currentNation.id } });
    });
    articles.push({ type: 'duration', data: { duration_type: durType, duration_ticks: durTicks, auto_renew: false, withdrawal_notice_ticks: 1 } });

    const sectorNames = [];
    checked.forEach(cb => { const s = TRADEABLE_SECTORS.find(ts => ts.key === cb.value); if (s) sectorNames.push(s.label); });

    const agreementName = 'Retaliatory Tariff on ' + targetName;
    const billTitle = 'Ratify: ' + agreementName;
    const billPreamble = 'Ratification of retaliatory tariff against ' + targetName + '. Imposes +' + pct + '% tariff surcharge on ' + sectorNames.join(', ') + ' imports. ' +
        (durType === 'permanent' ? 'Duration: until revoked.' : 'Duration: ' + durTicks + ' ticks.');

    const { data: bill, error: billErr } = await _supabase.from('bills').insert({
        nation_id: currentNation.id,
        bill_type: 'ratification',
        bill_name: billTitle,
        preamble: billPreamble,
        proposed_by: currentFaction.id,
        proposer_name: currentFaction.faction_name,
        proposer_color: currentFaction.party_color,
        status: 'floor',
        proposed_tick: currentTick,
        floor_tick: currentTick,
        voting_ends_tick: currentTick + GAME_CONFIG.VOTING_WINDOW_TICKS,
        trade_agreement_data: {
            type: 'retaliatory_tariff',
            imposer_nation_id: currentNation.id,
            target_nation_id: targetId,
            agreement_name: agreementName,
            articles: articles,
            duration_type: durType,
            duration_ticks: durTicks
        }
    }).select('id').single();

    if (billErr) { alert('Error: ' + billErr.message); if (btn) btn.disabled = false; return; }

    try {
        await _supabase.from('event_log').insert({
            nation_id: currentNation.id, event_name: agreementName + ' — Proposed', category: 'Trade',
            description_chosen: currentNation.name + ' has submitted a retaliatory tariff bill targeting ' + targetName + ' (' + sectorNames.join(', ') + ' at +' + pct + '%).',
            fired_at_tick: currentTick
        });
        await _supabase.from('event_log').insert({
            nation_id: targetId, event_name: 'Retaliatory Tariff Proposed', category: 'Trade',
            description_chosen: currentNation.name + ' has proposed a retaliatory tariff on your ' + sectorNames.join(', ') + ' exports (+' + pct + '%).',
            fired_at_tick: currentTick
        });
    } catch (e) { /* non-blocking */ }

    alert('Retaliatory tariff bill submitted to parliament!');
    cancelDraft();
}
window.submitRTDraft = submitRTDraft;

// ── Unilateral Tariff Reduction (UTR) ──

async function renderUTRDraftPanel(body, statusEl) {
    if (statusEl) { statusEl.textContent = 'Drafting'; statusEl.className = 'badge badge--amber'; }

    const apCost = 3;

    let html = '<div class="draft-panel"><div class="draft-header">';
    html += '<div class="draft-field"><div class="draft-field-label">Action</div><div class="draft-field-input">Unilateral Tariff Reduction <span style="float:right;font-size:10px;color:var(--text-dim);">' + apCost + ' AP</span></div></div>';
    html += '<div style="display:flex;gap:6px;justify-content:flex-end;margin-top:-2px;margin-bottom:4px;">';
    html += '<span class="badge badge--green" style="font-size:7px;">Unilateral</span>';
    html += '<span class="badge badge--green" style="font-size:7px;">Immediate</span>';
    html += '</div>';

    // Target selector
    let targetFieldHtml = '<select id="utr-draft-target" style="width:100%;background:var(--bg-3);border:1px solid var(--border-subtle);color:var(--text-primary);font-family:var(--font-sans);font-size:12px;padding:4px 8px;" onchange="updateUTRDraftTarget(this.value)">';
    targetFieldHtml += '<option value="">Select target nation...</option>';
    cachedOtherNations.forEach(n => {
        const sel = activeDraftTarget && activeDraftTarget.id === n.id ? ' selected' : '';
        targetFieldHtml += '<option value="' + n.id + '"' + sel + '>' + escapeHtml(n.name) + '</option>';
    });
    targetFieldHtml += '</select>';
    html += '<div class="draft-field"><div class="draft-field-label">Target Nation</div>' + targetFieldHtml + '</div>';
    html += '</div>';  // close draft-header

    if (!activeDraftTarget) {
        html += '<div class="empty-state" style="padding:20px 0;"><div class="empty-state-text">Select a nation to reduce tariffs on.</div></div></div>';
        body.innerHTML = html;
        return;
    }

    // Check for existing active UTR ISSUED BY US with this target
    // Uses canonical ordering (nation_a_id < nation_b_id) — issuer tracked in articles JSONB
    const { data: existingUtr } = await _supabase
        .from('trade_agreements')
        .select('id, articles')
        .eq('status', 'active')
        .eq('agreement_type', 'unilateral_tariff_reduction')
        .or('and(nation_a_id.eq.' + currentNation.id + ',nation_b_id.eq.' + activeDraftTarget.id + '),' +
            'and(nation_a_id.eq.' + activeDraftTarget.id + ',nation_b_id.eq.' + currentNation.id + ')');

    // Only block if WE are the issuer — the target nation can issue their own UTR independently
    const ourExistingUtr = (existingUtr || []).filter(function(u) {
        var art = (u.articles || [])[0];
        return art && art.data && art.data.issuer_nation_id === currentNation.id;
    });

    if (ourExistingUtr.length > 0) {
        html += '<div class="trade-info-box warning" style="margin:12px 14px;">You already have an active tariff reduction for ' + escapeHtml(activeDraftTarget.name) + '. Withdraw it first to issue a new one.</div></div>';
        body.innerHTML = html;
        return;
    }

    // Fetch current trade flows with target + our tariff rate
    var baseTariff = Number(currentNation.tariffs ?? 0);
    var latestTick = shardTick;
    var { data: tradeRows } = await _supabase.from('trade_partners')
        .select('sector, trade_volume, exporter_nation_id, importer_nation_id')
        .eq('tick', latestTick)
        .or('and(exporter_nation_id.eq.' + activeDraftTarget.id + ',importer_nation_id.eq.' + currentNation.id + '),' +
            'and(exporter_nation_id.eq.' + currentNation.id + ',importer_nation_id.eq.' + activeDraftTarget.id + ')');

    // Check for existing agreements that modify tariffs with this target (FTA/PTA)
    var { data: existingAgreements } = await _supabase.from('trade_agreements')
        .select('agreement_type, articles')
        .eq('status', 'active')
        .or('and(nation_a_id.eq.' + currentNation.id + ',nation_b_id.eq.' + activeDraftTarget.id + '),' +
            'and(nation_a_id.eq.' + activeDraftTarget.id + ',nation_b_id.eq.' + currentNation.id + ')');

    // Build per-sector existing reduction map from FTA/PTA articles
    var existingReductions = {};
    if (existingAgreements) {
        for (var ag of existingAgreements) {
            if (ag.agreement_type === 'free_trade') {
                // FTA = 100% reduction on all sectors
                TRADEABLE_SECTORS.forEach(function(s) { existingReductions[s.key] = 100; });
            } else if (ag.articles && Array.isArray(ag.articles)) {
                for (var art of ag.articles) {
                    if (art.type === 'tariff_reduction' && art.data?.sector) {
                        var pct = Number(art.data.reduction_pct || 0);
                        existingReductions[art.data.sector] = Math.max(existingReductions[art.data.sector] || 0, pct);
                    }
                }
            }
        }
    }

    // Build sector import data
    var sectorImports = {};
    if (tradeRows) {
        for (var row of tradeRows) {
            if (!sectorImports[row.sector]) sectorImports[row.sector] = { imports: 0, exports: 0 };
            if (row.exporter_nation_id === activeDraftTarget.id) {
                sectorImports[row.sector].imports += Number(row.trade_volume) || 0;
            } else {
                sectorImports[row.sector].exports += Number(row.trade_volume) || 0;
            }
        }
    }

    // Current tariffs overview per sector
    html += '<div style="padding:8px 14px;">';
    html += '<div class="draft-field-label">Current Tariff Situation</div>';
    html += '<div style="font-size:0.6rem;color:var(--text-dim);margin:4px 0 6px;">Your base tariff rate: <strong style="color:var(--text-primary);">' + baseTariff.toFixed(0) + '%</strong></div>';
    html += '<div style="max-height:200px;overflow-y:auto;">';
    TRADEABLE_SECTORS.forEach(function(s) {
        var td = sectorImports[s.key] || { imports: 0, exports: 0 };
        var existingPct = existingReductions[s.key] || 0;
        var effectiveRate = Math.max(0, baseTariff * (1 - existingPct / 100));
        var hasAgreement = existingPct > 0;
        html += '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border-hair);font-size:0.72rem;">';
        html += '<div style="flex:1;font-weight:600;color:var(--text-primary);">' + escapeHtml(s.label) + '</div>';
        html += '<div style="min-width:70px;text-align:right;color:var(--text-dim);">' + (td.imports > 0 ? fmtBudgetCurrency(td.imports) + '/tick' : '—') + '</div>';
        html += '<div style="min-width:55px;text-align:right;font-family:var(--font-mono);font-size:0.65rem;' + (hasAgreement ? 'color:var(--green);' : 'color:var(--text-muted);') + '">';
        html += effectiveRate.toFixed(0) + '%' + (hasAgreement ? ' <span style="font-size:0.55rem;opacity:0.7;">(' + existingPct + '% off)</span>' : '');
        html += '</div></div>';
    });
    html += '</div></div>';

    // Reduction % selector
    html += '<div style="padding:8px 14px;">';
    html += '<div class="draft-field-label">Reduction Percentage</div>';
    html += '<div class="trade-radio-group" style="margin-top:4px;">';
    html += '<label class="trade-radio-option" onclick="selectRadioOption(this)"><input type="radio" name="utr-draft-pct" value="25" /><div><div class="trade-radio-label">25%</div><div class="trade-radio-desc">Modest gesture</div></div></label>';
    html += '<label class="trade-radio-option selected" onclick="selectRadioOption(this)"><input type="radio" name="utr-draft-pct" value="50" checked /><div><div class="trade-radio-label">50%</div><div class="trade-radio-desc">Significant opening</div></div></label>';
    html += '<label class="trade-radio-option" onclick="selectRadioOption(this)"><input type="radio" name="utr-draft-pct" value="75" /><div><div class="trade-radio-label">75%</div><div class="trade-radio-desc">Major concession</div></div></label>';
    html += '<label class="trade-radio-option" onclick="selectRadioOption(this)"><input type="radio" name="utr-draft-pct" value="100" /><div><div class="trade-radio-label">100%</div><div class="trade-radio-desc">Full removal</div></div></label>';
    html += '</div></div>';

    // Effects summary
    html += '<div style="padding:8px 14px;">';
    html += '<div class="draft-field-label">Per-Tick Effects</div>';
    html += '<div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px;">';
    html += '<span class="effect-tag effect-tag--positive">↓ Cost of Living</span>';
    html += '<span class="effect-tag effect-tag--positive">↓ Inflation</span>';
    html += '<span class="effect-tag effect-tag--positive">↑ Happiness</span>';
    html += '<span class="effect-tag effect-tag--positive">↑ Foreign Investment</span>';
    html += '<span class="effect-tag effect-tag--negative">↓ Manufacturing Output</span>';
    html += '<span class="effect-tag effect-tag--negative">↓ Tariff Revenue</span>';
    html += '<span class="effect-tag effect-tag--negative">↓ Union Strength</span>';
    html += '</div>';
    html += '<div style="font-size:0.62rem;color:var(--text-dim);margin-top:6px;">A diplomatic gesture that reduces import costs but pressures domestic industry. Takes effect immediately — no parliamentary approval needed.</div>';
    html += '</div>';

    // Submit button
    html += '<div style="padding:12px 14px;display:flex;justify-content:flex-end;">';
    html += '<button class="detail-btn" style="color:var(--green);border-color:var(--green);" onclick="submitUTRDraft()">Execute — ' + apCost + ' AP</button>';
    html += '</div>';

    html += '</div>';
    body.innerHTML = html;
}

function updateUTRDraftTarget(val) {
    if (!val) { activeDraftTarget = null; }
    else {
        var match = cachedOtherNations.find(n => n.id === val);
        activeDraftTarget = match || null;
    }
    renderDraftBox();
}
window.updateUTRDraftTarget = updateUTRDraftTarget;

var _utrDraftLock = false;
async function submitUTRDraft() {
    if (_utrDraftLock) return;

    var targetId = activeDraftTarget?.id;
    if (!targetId) { alert('Select a target nation.'); return; }
    if (!currentFaction || !currentNation) return;

    var pctEl = document.querySelector('input[name="utr-draft-pct"]:checked');
    var reductionPct = pctEl ? Number(pctEl.value) : 50;
    var targetName = escapeHtml(activeDraftTarget.name);

    if (!confirm('Reduce tariffs on ' + activeDraftTarget.name + ' by ' + reductionPct + '%?\n\nCost: 3 AP\n\nThis takes effect immediately.')) return;

    _utrDraftLock = true;
    try {
        var apResult = await deductAP(_supabase, currentFaction.id, 3);
        if (!apResult.success) { alert(apResult.error || 'Not enough AP.'); _utrDraftLock = false; return; }

        var currentTick = shardTick;

        // Canonical nation ordering (lexicographic UUID — required by check constraint)
        var issuerId = currentNation.id;
        var natA = currentNation.id < targetId ? currentNation.id : targetId;
        var natB = currentNation.id < targetId ? targetId : currentNation.id;

        var { error } = await _supabase.from('trade_agreements').insert({
            nation_a_id: natA,
            nation_b_id: natB,
            agreement_type: 'unilateral_tariff_reduction',
            agreement_name: currentNation.name + ' Tariff Reduction on ' + activeDraftTarget.name,
            articles: [{ type: 'tariff_reduction', data: { reduction_pct: reductionPct, direction: 'their_exports', sector: 'all', issuer_nation_id: issuerId } }],
            status: 'active',
            enacted_at_tick: currentTick
        });

        if (error) { alert('Failed: ' + error.message); _utrDraftLock = false; return; }

        // Fire nation events (issuer + target) and world event (all other nations)
        try {
            var desc = currentNation.name + ' has unilaterally reduced tariffs on ' + activeDraftTarget.name + '\'s exports by ' + reductionPct + '%.';
            var eventRows = [
                // Issuer nation event
                { nation_id: currentNation.id, event_name: 'Tariff Reduction Enacted', category: 'trade', description_chosen: desc, fired_at_tick: currentTick },
                // Target nation event
                { nation_id: targetId, event_name: 'Tariff Reduction Received', category: 'trade', description_chosen: desc, fired_at_tick: currentTick }
            ];
            await _supabase.from('event_log').insert(eventRows);
        } catch (e) { /* non-blocking */ }

        alert('Tariff reduction enacted!');
        cancelDraft();
    } catch (e) {
        alert('An error occurred.');
    } finally {
        _utrDraftLock = false;
    }
}
window.submitUTRDraft = submitUTRDraft;

// ── Impose Embargo (unilateral) ──

var _embargoTradeData = {};  // cached trade flow data per target: { sectorKey: { imports, exports } }

async function renderEmbargoDraftPanel(body, statusEl) {
    if (statusEl) { statusEl.textContent = 'Drafting'; statusEl.className = 'badge badge--amber'; }

    const apCost = 5;

    let html = '<div class="draft-panel"><div class="draft-header">';
    html += '<div class="draft-field"><div class="draft-field-label">Action</div><div class="draft-field-input">Impose Embargo <span style="float:right;font-size:10px;color:var(--text-dim);">Minister of Trade</span></div></div>';
    html += '<div style="display:flex;gap:6px;justify-content:flex-end;margin-top:-2px;margin-bottom:4px;">';
    html += '<span class="badge badge--amber" style="font-size:7px;">Unilateral</span>';
    html += '<span class="badge badge--amber" style="font-size:7px;">Requires Parliament</span>';
    html += '<span style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);">' + apCost + ' AP</span>';
    html += '</div>';

    // Target selector
    let targetFieldHtml = '<select id="emb-draft-target" style="width:100%;background:var(--bg-3);border:1px solid var(--border-subtle);color:var(--text-primary);font-family:var(--font-sans);font-size:12px;padding:4px 8px;" onchange="updateEmbargoDraftTarget(this.value)">';
    targetFieldHtml += '<option value="">Select target nation...</option>';
    cachedOtherNations.forEach(n => {
        const sel = activeDraftTarget && activeDraftTarget.id === n.id ? ' selected' : '';
        targetFieldHtml += '<option value="' + n.id + '"' + sel + '>' + escapeHtml(n.name) + '</option>';
    });
    targetFieldHtml += '</select>';
    html += '<div class="draft-field"><div class="draft-field-label">Target</div>' + targetFieldHtml + '</div>';
    html += '</div>';  // close draft-header

    if (!activeDraftTarget) {
        html += '<div class="empty-state" style="padding:20px 0;"><div class="empty-state-text">Select a target nation.</div></div></div>';
        body.innerHTML = html;
        return;
    }

    // Check for existing active embargo
    const { data: existingEmb } = await _supabase
        .from('trade_agreements')
        .select('id')
        .eq('status', 'active')
        .eq('agreement_type', 'impose_embargo')
        .eq('nation_a_id', currentNation.id)
        .eq('nation_b_id', activeDraftTarget.id);

    if (existingEmb && existingEmb.length > 0) {
        html += '<div class="trade-info-box warning" style="margin:12px 14px;">You already have an active embargo against ' + escapeHtml(activeDraftTarget.name) + '. Wait for it to expire or withdraw it first.</div></div>';
        body.innerHTML = html;
        return;
    }

    // Fetch trade flow data between our nation and target
    
    const latestTick = shardTick;

    const { data: tradeRows } = await _supabase
        .from('trade_partners')
        .select('sector, trade_volume, exporter_nation_id, importer_nation_id')
        .eq('tick', latestTick)
        .or('and(exporter_nation_id.eq.' + currentNation.id + ',importer_nation_id.eq.' + activeDraftTarget.id + '),' +
            'and(exporter_nation_id.eq.' + activeDraftTarget.id + ',importer_nation_id.eq.' + currentNation.id + ')');

    _embargoTradeData = {};
    if (tradeRows) {
        for (var i = 0; i < tradeRows.length; i++) {
            var row = tradeRows[i];
            if (!_embargoTradeData[row.sector]) _embargoTradeData[row.sector] = { imports: 0, exports: 0 };
            if (row.exporter_nation_id === activeDraftTarget.id) {
                // Target exports to us = our imports from target
                _embargoTradeData[row.sector].imports += Number(row.trade_volume) || 0;
            } else {
                // We export to target = our exports to target
                _embargoTradeData[row.sector].exports += Number(row.trade_volume) || 0;
            }
        }
    }

    // Scope
    html += '<div style="padding:8px 14px 0;">';
    html += '<div class="draft-field-label">Scope</div>';
    html += '<div class="trade-radio-group" style="margin-top:4px;">';
    html += '<label class="trade-radio-option" onclick="selectRadioOption(this);toggleEmbargoScope()"><input type="radio" name="emb-draft-scope" value="targeted" /><div><div class="trade-radio-label">Targeted</div></div></label>';
    html += '<label class="trade-radio-option selected" onclick="selectRadioOption(this);toggleEmbargoScope()"><input type="radio" name="emb-draft-scope" value="partial" checked /><div><div class="trade-radio-label">Partial</div></div></label>';
    html += '<label class="trade-radio-option" onclick="selectRadioOption(this);toggleEmbargoScope()"><input type="radio" name="emb-draft-scope" value="total" /><div><div class="trade-radio-label">Total</div></div></label>';
    html += '</div>';
    html += '<div style="font-size:0.62rem;color:var(--text-dim);margin-top:2px;">Partial: select sectors. Total: all trade blocked.</div>';
    html += '</div>';

    // Duration
    html += '<div style="padding:8px 14px;">';
    html += '<div class="draft-field-label">Duration</div>';
    html += '<div style="display:flex;align-items:center;gap:8px;margin-top:4px;">';
    html += '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);"></span>';
    html += '<input type="number" id="emb-draft-ticks" value="12" min="4" max="48" style="width:60px;background:var(--bg-3);border:1px solid var(--border-subtle);color:var(--text-primary);padding:4px 8px;font-size:12px;" oninput="updateEmbargoDraftSummary()" />';
    html += '<span style="font-size:0.72rem;color:var(--text-primary);">ticks</span>';
    html += '<span style="font-size:0.62rem;color:var(--text-dim);margin-left:4px;">Range: 4\u201348 ticks</span>';
    html += '</div></div>';

    // Sector selection
    html += '<div id="emb-draft-sectors-wrap" style="padding:4px 14px;">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;">';
    html += '<div class="draft-field-label" style="color:var(--text-dim);">Select Sectors to Embargo</div>';
    html += '<div id="emb-draft-sector-count" style="font-size:0.62rem;color:var(--text-dim);"></div>';
    html += '</div>';

    var targetName = escapeHtml(activeDraftTarget.name);
    TRADEABLE_SECTORS.forEach(function(s) {
        var td = _embargoTradeData[s.key] || { imports: 0, exports: 0 };
        var annualImports = td.imports * 12;  // per-tick to annual approximation
        var annualExports = td.exports * 12;
        var impactVal = annualImports + annualExports;
        html += '<label class="emb-sector-row" style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border-hair);cursor:pointer;">';
        html += '<input type="checkbox" name="emb-draft-sector" value="' + s.key + '" onchange="updateEmbargoDraftSummary()" style="accent-color:var(--red);" />';
        html += '<div style="flex:1;">';
        html += '<div style="font-size:0.78rem;font-weight:600;color:var(--text-primary);">' + escapeHtml(s.label) + '</div>';
        html += '<div style="font-size:0.62rem;color:var(--text-dim);">Imports ' + fmtBudgetCurrency(annualImports) + '/yr from ' + targetName + ' / Exports ' + fmtBudgetCurrency(annualExports) + '/yr</div>';
        html += '</div>';
        html += '<div style="font-family:var(--font-mono);font-size:11px;color:var(--red);min-width:60px;text-align:right;">' + (impactVal > 0 ? '-' + fmtBudgetCurrency(impactVal) : '') + '</div>';
        html += '</label>';
    });
    html += '</div>';

    // Hostile action warning
    html += '<div class="trade-info-box danger" style="margin:10px 14px;">';
    html += '<strong style="text-transform:uppercase;font-size:0.68rem;">Hostile Action Warning</strong><br>';
    html += 'Imposing an embargo is a major escalation. ' + targetName + ' will lose significant trade revenue and may retaliate with their own embargo, tariffs, or diplomatic severance. Existing trade agreements with ' + targetName + ' in embargoed sectors will be suspended for the embargo\'s duration.';
    html += '</div>';

    // Footer summary + actions
    html += '<div id="emb-draft-footer" style="font-family:var(--font-mono);font-size:0.68rem;color:var(--text-dim);padding:6px 14px;text-transform:uppercase;letter-spacing:0.06em;"></div>';
    html += '<div class="detail-actions" style="margin-top:auto;padding-top:10px;border-top:1px solid var(--border-hair);">';
    html += '<button class="detail-btn" onclick="cancelDraft()">Cancel</button>';
    html += '<button class="detail-btn" id="emb-draft-submit" style="color:var(--teal);border-color:var(--teal-border);" disabled onclick="submitEmbargoDraft()">Submit to Parliament (' + apCost + ' AP)</button>';
    html += '</div></div>';
    body.innerHTML = html;

    updateEmbargoDraftSummary();
}

async function updateEmbargoDraftTarget(nationId) {
    if (!nationId) { activeDraftTarget = null; }
    else {
        var nation = cachedOtherNations.find(function(n) { return n.id === nationId; });
        activeDraftTarget = nation || null;
    }
    var body = document.getElementById('draft-body');
    var statusEl = document.getElementById('draft-status');
    if (body) await renderEmbargoDraftPanel(body, statusEl);
}
window.updateEmbargoDraftTarget = updateEmbargoDraftTarget;

function toggleEmbargoScope() {
    var scope = document.querySelector('input[name="emb-draft-scope"]:checked')?.value || 'partial';
    var checkboxes = document.querySelectorAll('input[name="emb-draft-sector"]');
    var wrap = document.getElementById('emb-draft-sectors-wrap');

    if (scope === 'total') {
        // Select all, disable checkboxes
        checkboxes.forEach(function(cb) { cb.checked = true; cb.disabled = true; });
        if (wrap) wrap.style.opacity = '0.6';
    } else {
        // Enable checkboxes, uncheck all so user can pick
        checkboxes.forEach(function(cb) { cb.disabled = false; cb.checked = false; });
        if (wrap) wrap.style.opacity = '1';
    }
    updateEmbargoDraftSummary();
}
window.toggleEmbargoScope = toggleEmbargoScope;

function updateEmbargoDraftSummary() {
    var scope = document.querySelector('input[name="emb-draft-scope"]:checked')?.value || 'partial';
    var checked = document.querySelectorAll('input[name="emb-draft-sector"]:checked');
    var durTicks = Math.min(48, Math.max(4, parseInt(document.getElementById('emb-draft-ticks')?.value || '12')));
    var btn = document.getElementById('emb-draft-submit');
    var footer = document.getElementById('emb-draft-footer');
    var countEl = document.getElementById('emb-draft-sector-count');

    var sectorCount = checked.length;
    var totalSectors = TRADEABLE_SECTORS.length;

    if (countEl) countEl.textContent = sectorCount + ' of ' + totalSectors + ' sectors selected';

    // Determine scope label
    var scopeLabel = scope === 'total' ? 'Total' : scope === 'targeted' ? 'Targeted' : 'Partial';

    // Validate based on scope
    var valid = false;
    if (scope === 'targeted') valid = sectorCount === 1;
    else if (scope === 'partial') valid = sectorCount >= 2 && sectorCount < totalSectors;
    else if (scope === 'total') valid = sectorCount === totalSectors;

    if (btn) btn.disabled = !valid;
    if (footer) footer.textContent = scopeLabel + ' / ' + sectorCount + ' sector' + (sectorCount !== 1 ? 's' : '') + ' / ' + durTicks + ' ticks';
}
window.updateEmbargoDraftSummary = updateEmbargoDraftSummary;

async function submitEmbargoDraft() {
    var btn = document.getElementById('emb-draft-submit');
    if (btn) btn.disabled = true;

    var scope = document.querySelector('input[name="emb-draft-scope"]:checked')?.value || 'partial';
    var checked = document.querySelectorAll('input[name="emb-draft-sector"]:checked');
    var durTicks = Math.min(48, Math.max(4, parseInt(document.getElementById('emb-draft-ticks')?.value || '12')));
    var apCost = 5;
    var targetId = activeDraftTarget?.id;
    var targetName = activeDraftTarget?.name || 'Unknown';

    if (!targetId) { alert('Select a target nation.'); if (btn) btn.disabled = false; return; }

    var sectorCount = checked.length;
    var totalSectors = TRADEABLE_SECTORS.length;

    // Validate scope
    if (scope === 'targeted' && sectorCount !== 1) { alert('Targeted embargo requires exactly 1 sector.'); if (btn) btn.disabled = false; return; }
    if (scope === 'partial' && (sectorCount < 2 || sectorCount >= totalSectors)) { alert('Partial embargo requires 2 to ' + (totalSectors - 1) + ' sectors.'); if (btn) btn.disabled = false; return; }
    if (scope === 'total' && sectorCount !== totalSectors) { alert('Total embargo requires all sectors.'); if (btn) btn.disabled = false; return; }

    var apResult = await deductAP(_supabase, currentFaction.id, apCost);
    if (!apResult.success) {
        if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
        alert('Not enough AP (' + apCost + ' needed). Current AP: ' + (apResult.currentAp ?? '?'));
        if (btn) btn.disabled = false;
        return;
    }

    var currentTick = shardTick;

    var articles = [];
    var sectorNames = [];
    checked.forEach(function(cb) {
        articles.push({ type: 'embargo_sector', data: { sector: cb.value, imposer_nation_id: currentNation.id } });
        var s = TRADEABLE_SECTORS.find(function(ts) { return ts.key === cb.value; });
        if (s) sectorNames.push(s.label);
    });
    articles.push({ type: 'duration', data: { duration_type: 'fixed', duration_ticks: durTicks, auto_renew: false, withdrawal_notice_ticks: 1 } });

    var scopeLabel = scope === 'total' ? 'Total' : scope === 'targeted' ? 'Targeted' : 'Partial';
    var agreementName = scopeLabel + ' Embargo on ' + targetName;
    var billTitle = 'Ratify: ' + agreementName;
    var billPreamble = scopeLabel + ' embargo on ' + targetName + '. Blocks trade in ' + sectorNames.join(', ') + '. Duration: ' + durTicks + ' ticks.';

    var { data: bill, error: billErr } = await _supabase.from('bills').insert({
        nation_id: currentNation.id,
        bill_type: 'ratification',
        bill_name: billTitle,
        preamble: billPreamble,
        proposed_by: currentFaction.id,
        proposer_name: currentFaction.faction_name,
        proposer_color: currentFaction.party_color,
        status: 'floor',
        proposed_tick: currentTick,
        floor_tick: currentTick,
        voting_ends_tick: currentTick + GAME_CONFIG.VOTING_WINDOW_TICKS,
        trade_agreement_data: {
            type: 'impose_embargo',
            imposer_nation_id: currentNation.id,
            target_nation_id: targetId,
            agreement_name: agreementName,
            articles: articles,
            scope: scope,
            duration_type: 'fixed',
            duration_ticks: durTicks
        }
    }).select('id').single();

    if (billErr) { alert('Error: ' + billErr.message); if (btn) btn.disabled = false; return; }

    try {
        await _supabase.from('event_log').insert({
            nation_id: currentNation.id, event_name: agreementName + ' — Proposed', category: 'Trade',
            description_chosen: currentNation.name + ' has submitted an embargo bill targeting ' + targetName + ' (' + sectorNames.join(', ') + ').',
            fired_at_tick: currentTick
        });
        await _supabase.from('event_log').insert({
            nation_id: targetId, event_name: 'Embargo Proposed', category: 'Trade',
            description_chosen: currentNation.name + ' has proposed a ' + scopeLabel.toLowerCase() + ' embargo on your ' + sectorNames.join(', ') + ' trade.',
            fired_at_tick: currentTick
        });
    } catch (e) { /* non-blocking */ }

    alert('Embargo bill submitted to parliament!');
    cancelDraft();
}
window.submitEmbargoDraft = submitEmbargoDraft;

// ── Send Message Panel ──
async function renderSendMessagePanel(body, statusEl) {
    if (statusEl) statusEl.textContent = 'Send Message';

    // Check which nations we have ambassadors to
    const ambTargets = (diplomaticRoles.ambassadorTo || []).map(a => a.target_nation_id);
    if (ambTargets.length === 0) {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">You need an active ambassador to send messages. Ask your Foreign Minister to appoint one.</div></div>';
        return;
    }

    // Fetch nation names for ambassador targets
    const { data: ambNations } = await _supabase.from('nations').select('id, name').in('id', ambTargets);
    const nations = (ambNations || []).sort((a, b) => a.name.localeCompare(b.name));

    // Build target selector
    let html = '<div class="draft-panel">';
    html += '<div class="draft-header">';
    html += '<div class="draft-field"><div class="draft-field-label">Action</div><div class="draft-field-input">Send Message <span style="color:var(--teal);">(Free)</span></div></div>';
    html += '<div class="draft-field"><div class="draft-field-label">To Nation</div><div class="draft-field-input">';
    html += '<select id="msg-target-select" style="width:100%;background:var(--bg-3);border:1px solid var(--border-subtle);color:var(--text-primary);font-family:var(--font-sans);font-size:12px;padding:4px 8px;" onchange="selectMessageTarget(this.value)">';
    html += '<option value="">Select a nation...</option>';
    nations.forEach(n => {
        const sel = activeDraftTarget && activeDraftTarget.id === n.id ? ' selected' : '';
        html += '<option value="' + n.id + '"' + sel + '>' + escapeHtml(n.name) + '</option>';
    });
    html += '</select></div></div>';
    html += '</div>';

    if (activeDraftTarget) {
        // Fetch messages
        let messages = [];
        try {
            const { data } = await _supabase
                .from('diplomatic_messages')
                .select('*')
                .or(
                    'and(from_nation_id.eq.' + currentNation.id + ',to_nation_id.eq.' + activeDraftTarget.id + '),' +
                    'and(from_nation_id.eq.' + activeDraftTarget.id + ',to_nation_id.eq.' + currentNation.id + ')'
                )
                .order('sent_at_tick', { ascending: true })
                .order('created_at', { ascending: true })
                .limit(100);
            messages = data || [];
        } catch (e) { /* */ }

        // Mark unread incoming messages as read by this faction
        if (activeDraftTarget) {
            markDiploMessagesRead(messages, activeDraftTarget.id);
        }

        const msgsHTML = messages.length > 0
            ? messages.map(m => {
                const isMine = m.from_nation_id === currentNation.id;
                return '<div class="diplo-msg ' + (isMine ? 'mine' : 'theirs') + '">' +
                    '<div class="diplo-msg-sender">' + escapeHtml(m.sender_name || 'Unknown') +
                    ' <span class="role-badge" style="background:' + (isMine ? 'rgba(96,165,250,0.08)' : 'rgba(74,222,128,0.08)') +
                    ';color:' + (isMine ? '#60a5fa' : '#4ade80') +
                    ';border:1px solid ' + (isMine ? 'rgba(96,165,250,0.2)' : 'rgba(74,222,128,0.2)') + ';">' +
                    escapeHtml(m.sender_role || 'diplomat') + '</span></div>' +
                    '<div class="diplo-msg-text">' + escapeHtml(m.message_text) + '</div>' +
                    '<div class="diplo-msg-tick">Tick ' + m.sent_at_tick + '</div></div>';
            }).join('')
            : '<div class="diplo-chat-empty">No messages yet. Start the conversation.</div>';

        html += '<div class="diplo-chat-box" id="diplo-chat-box" style="max-height:280px;overflow-y:auto;margin:8px 0;">' + msgsHTML + '</div>';
        html += '<div class="diplo-chat-input" style="display:flex;gap:6px;padding:0;">';
        html += '<input type="text" id="diplo-msg-input" placeholder="Type a message..." maxlength="500" style="flex:1;background:var(--bg-3);border:1px solid var(--border-subtle);color:var(--text-primary);padding:6px 10px;font-size:12px;font-family:var(--font-sans);" onkeydown="if(event.key===\'Enter\')sendDiploMessage(\'' + activeDraftTarget.id + '\',\'' + escapeHtml(activeDraftTarget.name).replace(/'/g, "\\'") + '\')" />';
        html += '<button class="draft-submit-btn" style="padding:6px 14px;" onclick="sendDiploMessage(\'' + activeDraftTarget.id + '\',\'' + escapeHtml(activeDraftTarget.name).replace(/'/g, "\\'") + '\')">Send</button>';
        html += '</div>';
    } else {
        html += '<div class="empty-state"><div class="empty-state-text">Select a nation to open the diplomatic channel.</div></div>';
    }

    html += '</div>';
    html += '<div class="draft-actions"><button class="draft-cancel-btn" onclick="cancelDraft()">Close</button></div>';
    body.innerHTML = html;

    // Auto-scroll chat to bottom
    const chatBox = document.getElementById('diplo-chat-box');
    if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;
}

function selectMessageTarget(nationId) {
    if (!nationId) { activeDraftTarget = null; renderDraftBox(); return; }
    const n = cachedOtherNations.find(n => n.id === nationId);
    if (!n) {
        // Might not be in cachedOtherNations, fetch name from the select
        const sel = document.getElementById('msg-target-select');
        const name = sel?.options[sel.selectedIndex]?.text || 'Unknown';
        activeDraftTarget = { id: nationId, name: name };
    } else {
        activeDraftTarget = n;
    }
    renderDraftBox();
}
window.selectMessageTarget = selectMessageTarget;

// ── Draft helpers (legacy — kept for backward compat) ──
function renderIssueStatementPanel(body, statusEl) {

    const ambPostings = diplomaticRoles.ambassadorTo || [];
    if (ambPostings.length === 0) {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Requires Ambassador posting.</div></div>';
        return;
    }

    const apCost = 1;
    const maxChars = 400;
    const hasEnoughAP = (currentFaction?.action_points ?? 0) >= apCost;
    const defaultNation = ambPostings[0]?.target_nation_name || '...';

    let html = '<div class="draft-panel">';

    // Header
    html += '<div class="draft-header">';
    html += '<div class="draft-field"><div class="draft-field-label">Action</div><div class="draft-field-input">Issue Statement <span style="font-family:var(--font-mono);font-size:10px;font-weight:600;color:var(--teal);">1 AP</span></div></div>';
    html += '</div>';

    // Regarding nation (restricted to ambassador postings)
    html += '<div style="padding:10px 14px 0;">';
    html += '<div class="draft-field"><div class="draft-field-label">Regarding Nation</div>';
    if (ambPostings.length === 1) {
        html += '<div class="draft-field-input" style="font-weight:600;">' + escapeHtml(defaultNation) + '</div>';
        html += '<input type="hidden" id="statement-target-nation" value="' + escapeHtml(defaultNation) + '">';
