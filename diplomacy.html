<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diplomacy | Nationhood Alpha</title>

    <!-- Supabase SDK -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://pbumjalxclmegzckhqqr.supabase.co" crossorigin>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Shared Styles -->
    <link rel="stylesheet" href="css/dashboard.css">

    <style>
        /* ===== DIPLOMACY LAYOUT ===== */
        #diplomacy-content { display: flex; height: calc(100vh - 88px); }

        /* Map: 2/3 width */
        #diplo-map-container {
            flex: 2; background: var(--ocean-bg); display: flex; flex-direction: column;
            align-items: center; overflow: auto; position: relative;
        }
        #diplo-map-container svg { width: 100%; max-width: 1280px; height: auto; display: block; margin: auto; }

        /* Sidebar: 1/3 width */
        #diplo-sidebar {
            flex: 1; max-width: 380px; min-width: 300px; flex-shrink: 0;
            background: var(--sidebar-bg); border-left: 2px solid var(--sidebar-border);
            padding: 20px; overflow-y: auto;
        }
        #diplo-sidebar h3 {
            color: var(--accent); font-size: 0.88rem; text-transform: uppercase;
            letter-spacing: 1px; margin-bottom: 12px;
        }
        #diplo-intel p { color: var(--text-muted); font-style: italic; font-size: 0.85rem; }

        /* ===== TOOLBAR ===== */
        #diplo-toolbar {
            width: 100%; padding: 10px 16px; display: flex; align-items: center;
            gap: 10px; background: var(--bg-panel); border-bottom: 1px solid var(--border-light);
            flex-shrink: 0; flex-wrap: wrap;
        }
        #diplo-toolbar label {
            font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .diplo-filter {
            padding: 6px 10px; background: var(--bg-card); border: 1px solid var(--party-badge-border);
            border-radius: 4px; color: var(--text-primary); font-size: 0.8rem; cursor: pointer;
        }
        .diplo-filter:hover { border-color: var(--accent); }

        /* ===== ROLE BADGE ===== */
        .diplo-role-badge {
            display: inline-block; padding: 3px 10px; border-radius: 4px;
            font-size: 0.65rem; font-weight: bold; text-transform: uppercase;
            letter-spacing: 0.8px; margin-right: 6px;
        }
        .role-hog  { background: #8B0000; color: #fff; }
        .role-fm   { background: #1a5276; color: #fff; }
        .role-amb  { background: #2e7d32; color: #fff; }
        .role-none { background: var(--bg-hover); color: var(--text-muted); }

        /* ===== RELATION BADGE ===== */
        .relation-badge {
            display: inline-block; padding: 3px 10px; border-radius: 4px;
            font-size: 0.7rem; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .rel-neutral  { background: #555; color: #ccc; }
        .rel-friendly { background: #1b5e20; color: #81c784; }
        .rel-hostile   { background: #b71c1c; color: #ef9a9a; }
        .rel-war      { background: #ff0000; color: #fff; }
        .rel-allied   { background: #0d47a1; color: #90caf9; }

        /* ===== NATION FILL COLORS (reused from world) ===== */
        #Melizea.land { fill: #e6c84b; }
        #Avelia.land { fill: #d98a9b; }
        #Sangreza.land { fill: #4a9edd; }
        #Montequilla.land { fill: #e07020; }
        #Melizea.land.selected-nation { fill: #ffd700; }
        #Avelia.land.selected-nation { fill: #ff6b81; }
        #Sangreza.land.selected-nation { fill: #2196F3; }
        #Montequilla.land.selected-nation { fill: #ff6600; }

        .nation-label {
            font-family: sans-serif; font-size: 7px; fill: #000; font-weight: bold;
            text-anchor: middle; pointer-events: none;
            text-shadow: 0 0 3px rgba(255,255,255,0.6);
        }

        /* ===== SECTION DIVIDERS ===== */
        .diplo-section-title {
            font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase;
            letter-spacing: 1px; margin: 16px 0 8px 0; padding-bottom: 4px;
            border-bottom: 1px solid var(--border-light);
        }

        /* ===== DIPLOMATIC CHAT ===== */
        .diplo-chat-box {
            max-height: 300px;
            overflow-y: auto;
            background: var(--bg-body);
            border: 1px solid var(--border-main);
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 8px;
        }
        .diplo-msg {
            margin-bottom: 8px;
            padding: 6px 10px;
            border-radius: 6px;
            max-width: 90%;
        }
        .diplo-msg.mine {
            background: #1a2a3a;
            border: 1px solid #2a4a6a;
            margin-left: auto;
        }
        .diplo-msg.theirs {
            background: var(--bg-card);
            border: 1px solid var(--border-main);
        }
        .diplo-msg-sender {
            font-size: 0.68rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }
        .diplo-msg-sender .role-badge {
            font-size: 0.6rem;
            padding: 1px 5px;
            border-radius: 3px;
            margin-left: 4px;
        }
        .diplo-msg-text {
            font-size: 0.82rem;
            color: var(--text-primary);
            line-height: 1.4;
        }
        .diplo-msg-tick {
            font-size: 0.62rem;
            color: var(--text-dim);
            margin-top: 2px;
            text-align: right;
        }
        .diplo-chat-input {
            display: flex;
            gap: 6px;
        }
        .diplo-chat-input input {
            flex: 1;
            padding: 8px 10px;
            background: var(--bg-card);
            border: 1px solid var(--border-main);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 0.82rem;
        }
        .diplo-chat-input input:focus {
            border-color: var(--accent);
            outline: none;
        }
        .diplo-chat-input button {
            padding: 8px 14px;
            background: var(--accent);
            border: none;
            border-radius: 4px;
            color: #121212;
            font-weight: bold;
            font-size: 0.78rem;
            cursor: pointer;
        }
        .diplo-chat-input button:hover { opacity: 0.9; }
        .diplo-chat-empty {
            text-align: center;
            padding: 20px;
            color: var(--text-dim);
            font-size: 0.82rem;
            font-style: italic;
        }
    </style>
</head>
<body>

<!-- ===== TOP BAR (rendered by common.js) ===== -->
<div id="top-bar"></div>

<!-- ===== CONTENT AREA ===== -->
<div id="content-area">
    <div id="diplomacy-content">
        <!-- ===== MAP PANEL (2/3) ===== -->

            <!-- Toolbar -->

                <label>Filter:</label>
                <select class="diplo-filter" id="filter-type">

                    <option value="conflict">Conflicts</option>
                    <option value="embargo">Embargoes</option>
                </select>
                <div id="diplo-amb-dropdown" style="display:none;margin-left:8px;">
                    <label>Ambassador:</label>
                    <select class="diplo-filter" id="amb-select" onchange="jumpToAmbNation(this.value)">
                        <option value="">Select...</option>
                    </select>
                </div>
                <div id="diplo-role-display" style="margin-left:auto;"></div>
            </div>

<!-- Page-Specific Script -->
<script>
/**
 * Diplomacy Page
 * World map + nation sidebar with role-based diplomatic actions
 */

let currentFaction = null;
let currentNation  = null;
let currentCoalition = null;
let diplomaticRoles = null;

// ==================== INIT ====================

initPage('diplomacy', async (state) => {
    currentFaction = state.faction;
    currentNation  = state.nation;

    // Load coalition for role detection
    if (currentNation) {
        currentCoalition = await fetchActiveCoalition(_supabase, currentNation.id);
    }

    // Detect roles
    diplomaticRoles = await detectDiplomaticRoles(currentFaction, currentNation, currentCoalition);
    renderRoleBadges(diplomaticRoles);

    // Setup map
    setupDiplomacyMap();
});

// ==================== ROLE DETECTION ====================

async function detectDiplomaticRoles(faction, nation, coalition) {
    const roles = {
        isHoG: false,
        isFM: false,
        ambassadorTo: []  // array of { target_nation_id, target_nation_name }
    };

    if (!faction || !nation) return roles;

    // Head of Government
    if (nation.government_type === 'Autocracy') {
        roles.isHoG = nation.ruling_faction_id === faction.id;
    } else {
        const alloc = coalition?.ministry_allocations || {};
        roles.isHoG = alloc.prime_minister === faction.id;
    }

    // Foreign Minister: always check actual ministry allocation
    const alloc = coalition?.ministry_allocations || {};
    roles.isFM = alloc.foreign === faction.id;

    // Ambassadors: query ambassadors table for active ambassadors belonging to this faction
    try {
        const { data: ambassadors } = await _supabase
            .from('ambassadors')
            .select('target_nation_id, nations!ambassadors_target_nation_id_fkey(name)')
            .eq('faction_id', faction.id)
            .eq('nation_id', nation.id)
            .eq('is_active', true)
            .eq('status', 'active');

        if (ambassadors && ambassadors.length > 0) {
            roles.ambassadorTo = ambassadors.map(a => ({
                target_nation_id: a.target_nation_id,
                target_nation_name: a.nations?.name || 'Unknown'
            }));
        }
    } catch (e) {
        console.warn('Could not load ambassadors:', e);
    }

    return roles;
}

// ==================== ROLE BADGES ====================

function renderRoleBadges(roles) {
    const container = document.getElementById('diplo-role-display');
    if (!container) return;

    const badges = [];
    if (roles.isHoG) badges.push('<span class="diplo-role-badge role-hog">Head of Gov</span>');
    if (roles.isFM)  badges.push('<span class="diplo-role-badge role-fm">Foreign Minister</span>');
    if (roles.ambassadorTo.length > 0) {
        roles.ambassadorTo.forEach(a => {
            badges.push('<span class="diplo-role-badge role-amb">Amb. to ' + a.target_nation_name + '</span>');
        });
    }
    if (badges.length === 0) {
        badges.push('<span class="diplo-role-badge role-none">No Diplomatic Role</span>');
    }

    container.innerHTML = badges.join('');

    // Populate ambassador dropdown
    const dropdown = document.getElementById('diplo-amb-dropdown');
    const select = document.getElementById('amb-select');
    if (roles.ambassadorTo.length > 0) {
        dropdown.style.display = '';
        select.innerHTML = '<option value="">Select...</option>' +
            roles.ambassadorTo.map(a =>
                '<option value="' + a.target_nation_id + '">' + a.target_nation_name + '</option>'
            ).join('');
    } else {
        dropdown.style.display = 'none';
    }
}

// ==================== MAP SETUP ====================

function setupDiplomacyMap() {
    document.querySelectorAll('.land').forEach(path => {
        path.addEventListener('click', async (e) => {
            e.stopPropagation();

            // Toggle selection
            document.querySelectorAll('.land').forEach(l => l.classList.remove('selected-nation'));
            e.target.classList.add('selected-nation');

            const name = e.target.getAttribute('data-nation-name');
            const sidebar = document.getElementById('diplo-intel');
            sidebar.innerHTML = '<p style="color:#888;font-style:italic;">Loading ' + name + '...</p>';

            try {
                const { data: nation, error } = await _supabase
                    .from('nations')
                    .select('*')
                    .eq('name', name)
                    .single();

                if (error || !nation) {
                    sidebar.innerHTML = '<p style="color:#f44;">Nation not found.</p>';
                    return;
                }

                await renderDiplomacySidebar(nation);
            } catch (err) {
                console.error('Error loading nation:', err);
                sidebar.innerHTML = '<p style="color:#f44;">Error loading data.</p>';
            }
        });
    });
}

// ==================== SIDEBAR RENDERING ====================

async function renderDiplomacySidebar(targetNation) {
    const sidebar = document.getElementById('diplo-intel');

    // Is this the player's own nation?
    const isOwnNation = currentNation && currentNation.id === targetNation.id;

    // Parallel fetch: relation, active proposals, our ambassador, pending ambassador, their ambassador
    const [relation, proposals, ambassador, pendingAmbassador, theirAmbassador] = await Promise.all([
        fetchDiplomaticRelation(currentNation?.id, targetNation.id),
        fetchActiveProposals(currentNation?.id, targetNation.id),
        fetchAmbassador(currentNation?.id, targetNation.id),
        fetchPendingAmbassador(currentNation?.id, targetNation.id),
        fetchAmbassador(targetNation.id, currentNation?.id)
    ]);

    // Flag URLs (same as world.html)
    const flagUrls = {
        'Melizea': 'https://raw.githubusercontent.com/TherranT11/nationhood/main/assets/flags/Melizea.png',
        'Avelia': 'https://raw.githubusercontent.com/TherranT11/nationhood/main/assets/flags/Avelia1.png',
        'Sangreza': 'https://raw.githubusercontent.com/TherranT11/nationhood/main/assets/flags/sangreza.png',
        'Montequilla': 'https://raw.githubusercontent.com/TherranT11/nationhood/main/assets/flags/Montequilla.png'
    };
    const flagUrl = flagUrls[targetNation.name] || null;

    // Relation type
    const relType = relation?.relation_type || 'neutral';
    const relClass = 'rel-' + relType;

    // Embassy status (depends on which side we are)
    let embassyStatus = 'N/A';
    if (relation) {
        if (currentNation && currentNation.id === relation.nation_a_id) {
            embassyStatus = relation.embassy_status_a || 'open';
        } else {
            embassyStatus = relation.embassy_status_b || 'open';
        }
    }

    sidebar.innerHTML = `
        <!-- Nation Header -->
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">
            <div>
                <h3 style="color:#ffcc00;font-size:1.2rem;margin-bottom:4px;">${targetNation.name}</h3>
                <p style="color:#888;font-size:0.78rem;margin:0;font-style:italic;">${targetNation.capital || 'Unknown Capital'}</p>
            </div>
            ${flagUrl ? '<img src="' + flagUrl + '" alt="' + targetNation.name + ' flag" style="width:56px;height:auto;border:1px solid #444;border-radius:3px;" />' : ''}
        </div>

        ${isOwnNation ? '<div style="background:#1a2a1a;border:1px solid #4CAF50;border-radius:6px;padding:10px;margin-bottom:14px;text-align:center;font-size:0.8rem;color:#4CAF50;font-weight:bold;">YOUR NATION</div>' : ''}

        <!-- Key Stats -->
        <div class="info-block">
            <div class="info-row">
                <span class="info-label">Population</span>
                <span class="info-value gold">${formatNumber(targetNation.population)}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Stability</span>
                <span class="info-value" style="color:${getStatColor(targetNation.stability)}">${targetNation.stability ?? '—'}%</span>
            </div>
            <div class="info-row">
                <span class="info-label">Civil Unrest</span>
                <span class="info-value" style="color:${getStatColor(100 - (targetNation.civil_unrest || 0))}">${targetNation.civil_unrest ?? '—'}%</span>
            </div>
            <div class="info-row">
                <span class="info-label">Military Strength</span>
                <span class="info-value">${targetNation.military_strength ?? '—'}</span>
            </div>
        </div>

        ${!isOwnNation ? renderRelationSection(relType, relClass, embassyStatus, ambassador) : ''}

        ${!isOwnNation && proposals.length > 0 ? renderActiveProposals(proposals) : ''}

        ${!isOwnNation ? renderActionPanel(targetNation, diplomaticRoles, ambassador, pendingAmbassador) : ''}
    `;

    // Render chat section after the main sidebar HTML is set
    if (!isOwnNation) {
        const chatHTML = await renderChatSection(targetNation, diplomaticRoles, ambassador, theirAmbassador);
        sidebar.innerHTML += chatHTML;
    }
}

// ==================== RELATION SECTION ====================

function renderRelationSection(relType, relClass, embassyStatus, ambassador) {
    const embassyColor = embassyStatus === 'open' ? '#4CAF50' : embassyStatus === 'closed' ? '#f44' : '#888';
    const ambName = ambassador
        ? (ambassador.ambassador_first_name || '') + ' ' + (ambassador.ambassador_last_name || '')
        : null;

    return `
        <div class="diplo-section-title">Diplomatic Relations</div>
        <div class="info-block">
            <div class="info-row">
                <span class="info-label">Relation</span>
                <span class="relation-badge ${relClass}">${relType}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Embassy</span>
                <span class="info-value" style="color:${embassyColor};text-transform:capitalize;">${embassyStatus}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Ambassador</span>
                <span class="info-value" style="font-size:0.85rem;">${ambName ? ambName.trim() : '<span style="color:#666;">None assigned</span>'}</span>
            </div>
        </div>
    `;
}

// ==================== ACTIVE PROPOSALS ====================

function renderActiveProposals(proposals) {
    const proposalTypeLabels = {
        cultural_exchange: 'Cultural Exchange',
        visa_agreement: 'Visa Agreement',
        joint_statement: 'Joint Statement',
        student_exchange: 'Student Exchange',
        trade_agreement: 'Trade Agreement',
        non_aggression_pact: 'Non-Aggression Pact',
        military_alliance: 'Military Alliance',
        embargo: 'Embargo',
        ceasefire: 'Ceasefire',
        open_borders: 'Open Borders',
        close_embassy: 'Close Embassy'
    };

    const rows = proposals.map(p => {
        const label = proposalTypeLabels[p.proposal_type] || p.proposal_type;
        const tierBadge = p.proposal_tier === 3 ? 'T3' : p.proposal_tier === 2 ? 'T2' : 'T1';
        return `
            <div style="background:var(--bg-card);padding:8px 10px;border-radius:4px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;">
                <span style="font-size:0.82rem;color:var(--text-primary);">${label}</span>
                <span style="font-size:0.65rem;color:var(--text-muted);background:var(--bg-hover);padding:2px 8px;border-radius:3px;">${tierBadge} &middot; ${p.status}</span>
            </div>
        `;
    }).join('');

    return `
        <div class="diplo-section-title">Active Treaties &amp; Agreements</div>
        <div class="info-block">${rows}</div>
    `;
}

// ==================== ACTION PANEL (role-based) ====================

function renderActionPanel(targetNation, roles, ambassador, pendingAmbassador) {
    if (!roles) return '';

    let actions = '';

    // HoG actions
    if (roles.isHoG) {
        actions += `
            <div class="action-card" style="margin-bottom:10px;">
                <div class="action-header">
                    <span class="action-title">Head of Government Actions</span>
                </div>
                <p class="action-desc">As Head of Government, you may authorize major diplomatic decisions.</p>
                <button class="action-btn" disabled>Declare War (Coming Soon)</button>
                <button class="action-btn" style="margin-top:8px;" disabled>Propose Alliance (Coming Soon)</button>
                <button class="action-btn" style="margin-top:8px;" disabled>State Visit (Coming Soon)</button>
            </div>
        `;
    }

    // FM actions
    if (roles.isFM) {
        let fmButtons = '';
        if (ambassador && ambassador.status === 'active') {
            const ambName = (ambassador.ambassador_first_name || '') + ' ' + (ambassador.ambassador_last_name || '');
            fmButtons = `
                <button class="action-btn" disabled style="opacity:0.6;">Ambassador Active: ${ambName.trim()}</button>
                <button class="action-btn" style="margin-top:8px;" onclick="recallAmbassador('${ambassador.id}', '${targetNation.name}')">Recall Ambassador</button>`;
        } else if (pendingAmbassador) {
            const pendName = (pendingAmbassador.ambassador_first_name || '') + ' ' + (pendingAmbassador.ambassador_last_name || '');
            fmButtons = `<button class="action-btn" disabled style="opacity:0.6;">Awaiting Confirmation: ${pendName.trim()}</button>`;
        } else {
            const adminParams = [getAdminNationOverride() ? 'nation_id=' + getAdminNationOverride() : '', getAdminFactionOverride() ? 'faction_id=' + getAdminFactionOverride() : ''].filter(Boolean).join('&');
            const ambUrl = 'select-ambassador.html?target=' + targetNation.id + (adminParams ? '&' + adminParams : '');
            fmButtons = `<button class="action-btn" onclick="window.location.href='${ambUrl}'">Appoint Ambassador</button>`;
        }
        fmButtons += `<button class="action-btn" style="margin-top:8px;" disabled>Formal Protest (Coming Soon)</button>`;

        actions += `
            <div class="action-card" style="margin-bottom:10px;">
                <div class="action-header">
                    <span class="action-title">Foreign Minister Actions</span>
                </div>
                <p class="action-desc">As Foreign Minister, you oversee diplomatic proposals and ambassador assignments.</p>
                ${fmButtons}
            </div>
        `;
    }

    // Ambassador actions (only if ambassador to this specific nation)
    const isAmbToTarget = roles.ambassadorTo.some(a => a.target_nation_id === targetNation.id);
    if (isAmbToTarget) {
        actions += `
            <div class="action-card" style="margin-bottom:10px;">
                <div class="action-header">
                    <span class="action-title">Ambassador Actions</span>
                </div>
                <p class="action-desc">As Ambassador to ${targetNation.name}, you can negotiate directly.</p>
                <button class="action-btn" disabled>Propose Treaty (Coming Soon)</button>
                <button class="action-btn" style="margin-top:8px;" disabled>Gather Intel (Coming Soon)</button>
            </div>
        `;
    }

    // No role — show observer message
    if (!roles.isHoG && !roles.isFM && !isAmbToTarget) {
        actions += `
            <div class="action-card" style="margin-bottom:10px;">
                <div class="action-header">
                    <span class="action-title">No Diplomatic Authority</span>
                </div>
                <p class="action-desc">Your party does not currently hold a diplomatic role in the coalition. You need to be Head of Government, Foreign Minister, or an Ambassador to take diplomatic actions.</p>
            </div>
        `;
    }

    return `
        <div class="diplo-section-title">Actions</div>
        ${actions}
    `;
}

// ==================== DATA FETCHERS ====================

async function fetchDiplomaticRelation(myNationId, targetNationId) {
    if (!myNationId || !targetNationId || myNationId === targetNationId) return null;

    // Canonical ordering: lower UUID = nation_a
    const nationA = myNationId < targetNationId ? myNationId : targetNationId;
    const nationB = myNationId < targetNationId ? targetNationId : myNationId;

    try {
        const { data } = await _supabase
            .from('diplomatic_relations')
            .select('*')
            .eq('nation_a_id', nationA)
            .eq('nation_b_id', nationB)
            .maybeSingle();
        return data;
    } catch (e) {
        console.warn('Error fetching diplomatic relation:', e);
        return null;
    }
}

async function fetchActiveProposals(myNationId, targetNationId) {
    if (!myNationId || !targetNationId || myNationId === targetNationId) return [];

    try {
        const { data } = await _supabase
            .from('diplomatic_proposals')
            .select('proposal_type, proposal_tier, status, activated_at_tick')
            .or(
                'and(proposing_nation_id.eq.' + myNationId + ',target_nation_id.eq.' + targetNationId + '),' +
                'and(proposing_nation_id.eq.' + targetNationId + ',target_nation_id.eq.' + myNationId + ')'
            )
            .eq('status', 'active');
        return data || [];
    } catch (e) {
        console.warn('Error fetching proposals:', e);
        return [];
    }
}

async function fetchAmbassador(myNationId, targetNationId) {
    if (!myNationId || !targetNationId || myNationId === targetNationId) return null;

    try {
        const { data } = await _supabase
            .from('ambassadors')
            .select('*')
            .eq('nation_id', myNationId)
            .eq('target_nation_id', targetNationId)
            .eq('is_active', true)
            .eq('status', 'active')
            .maybeSingle();
        return data;
    } catch (e) {
        console.warn('Error fetching ambassador:', e);
        return null;
    }
}

// ==================== HELPERS ====================

function getStatColor(value) {
    if (value == null) return '#888';
    if (value >= 70) return '#4CAF50';
    if (value >= 40) return '#ffcc00';
    return '#f44';
}

// ==================== PENDING AMBASSADOR FETCH ====================

async function fetchPendingAmbassador(myNationId, targetNationId) {
    if (!myNationId || !targetNationId || myNationId === targetNationId) return null;

    try {
        const { data } = await _supabase
            .from('ambassadors')
            .select('*')
            .eq('nation_id', myNationId)
            .eq('target_nation_id', targetNationId)
            .eq('is_active', true)
            .eq('status', 'pending_confirmation')
            .maybeSingle();
        return data;
    } catch (e) {
        console.warn('Error fetching pending ambassador:', e);
        return null;
    }
}

// ==================== RECALL AMBASSADOR ====================

async function recallAmbassador(ambassadorId, nationName) {
    if (!confirm(
        `Recall your Ambassador from ${nationName}?\n\n` +
        `The ambassador's party will lose 1-3 Approval.`
    )) return;

    try {
        const { data: shard } = await _supabase
            .from('shard')
            .select('current_tick')
            .eq('name', 'Alpha Shard')
            .single();
        const tick = shard?.current_tick || 0;

        // Get ambassador details for approval penalty
        const { data: amb } = await _supabase
            .from('ambassadors')
            .select('faction_id, ambassador_first_name, ambassador_last_name, factions(approval_rating)')
            .eq('id', ambassadorId)
            .single();

        if (!amb) { alert('Ambassador not found.'); return; }

        // Deactivate ambassador
        await _supabase
            .from('ambassadors')
            .update({ status: 'recalled', is_active: false, recalled_at_tick: tick })
            .eq('id', ambassadorId);

        // 1d3 approval loss
        const loss = Math.floor(Math.random() * 3) + 1;
        const currentApproval = amb.factions?.approval_rating ?? 50;
        const newApproval = Math.max(0, currentApproval - loss);
        await _supabase
            .from('factions')
            .update({ approval_rating: newApproval })
            .eq('id', amb.faction_id);

        const ambName = ((amb.ambassador_first_name || '') + ' ' + (amb.ambassador_last_name || '')).trim();
        alert(`Ambassador ${ambName} recalled from ${nationName}.\n-${loss} Approval to their party.`);

        // Refresh roles and re-render
        diplomaticRoles = await detectDiplomaticRoles(currentFaction, currentNation, currentCoalition);
        renderRoleBadges(diplomaticRoles);

        // Re-select the nation to refresh sidebar
        const targetPath = document.querySelector('.land.selected-nation');
        if (targetPath) targetPath.dispatchEvent(new Event('click', { bubbles: true }));

    } catch (e) {
        console.error('Error recalling ambassador:', e);
        alert('Error: ' + e.message);
    }
}

// ==================== DIPLOMATIC CHAT ====================

async function renderChatSection(targetNation, roles, ourAmbassador, theirAmbassador) {
    // Determine if there's a diplomatic channel
    const hasOurAmb = ourAmbassador && ourAmbassador.status === 'active';
    const hasTheirAmb = theirAmbassador && theirAmbassador.status === 'active';

    if (!hasOurAmb && !hasTheirAmb) {
        return `
            <div class="diplo-section-title">Diplomatic Channel</div>
            <div class="diplo-chat-empty">No diplomatic channel established.<br>An ambassador must be posted to enable communication.</div>
        `;
    }

    // Can the current player send messages?
    const isAmbToTarget = roles.ambassadorTo.some(a => a.target_nation_id === targetNation.id);
    const canSend = isAmbToTarget && hasOurAmb;
    const canView = roles.isFM || roles.isHoG || isAmbToTarget;

    if (!canView) {
        return `
            <div class="diplo-section-title">Diplomatic Channel</div>
            <div class="diplo-chat-empty">Diplomatic messages are visible to the Foreign Minister, Head of Government, and Ambassadors.</div>
        `;
    }

    // Fetch messages
    let messages = [];
    try {
        const { data } = await _supabase
            .from('diplomatic_messages')
            .select('*')
            .or(
                'and(from_nation_id.eq.' + currentNation.id + ',to_nation_id.eq.' + targetNation.id + '),' +
                'and(from_nation_id.eq.' + targetNation.id + ',to_nation_id.eq.' + currentNation.id + ')'
            )
            .order('sent_at_tick', { ascending: true })
            .order('created_at', { ascending: true })
            .limit(100);
        messages = data || [];
    } catch (e) {
        console.warn('Error fetching diplomatic messages:', e);
    }

    const msgsHTML = messages.length > 0
        ? messages.map(m => {
            const isMine = m.from_nation_id === currentNation.id;
            return `
                <div class="diplo-msg ${isMine ? 'mine' : 'theirs'}">
                    <div class="diplo-msg-sender">
                        ${m.sender_name || 'Unknown'}
                        <span class="role-badge" style="background:${isMine ? '#1a5276' : '#2e7d32'};color:#fff;">${m.sender_role || 'diplomat'}</span>
                    </div>
                    <div class="diplo-msg-text">${escapeHtml(m.message_text)}</div>
                    <div class="diplo-msg-tick">Tick ${m.sent_at_tick}</div>
                </div>`;
        }).join('')
        : '<div class="diplo-chat-empty">No messages yet. Start the conversation.</div>';

    const inputHTML = canSend ? `
        <div class="diplo-chat-input">
            <input type="text" id="diplo-msg-input" placeholder="Type a message..." maxlength="500"
                onkeydown="if(event.key==='Enter')sendDiploMessage('${targetNation.id}','${targetNation.name}')" />
            <button onclick="sendDiploMessage('${targetNation.id}','${targetNation.name}')">Send</button>
        </div>
    ` : '<div style="font-size:0.72rem;color:var(--text-dim);text-align:center;padding:6px;">View only — only ambassadors can send messages.</div>';

    return `
        <div class="diplo-section-title">Diplomatic Channel</div>
        <div class="diplo-chat-box" id="diplo-chat-box">${msgsHTML}</div>
        ${inputHTML}
    `;
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

async function sendDiploMessage(targetNationId, targetNationName) {
    const input = document.getElementById('diplo-msg-input');
    if (!input) return;
    const text = input.value.trim();
    if (!text) return;

    try {
        // Get current tick
        const { data: shard } = await _supabase
            .from('shard')
            .select('current_tick')
            .eq('name', 'Alpha Shard')
            .single();
        const tick = shard?.current_tick || 0;

        // Get our ambassador's last name for sender display
        const { data: amb } = await _supabase
            .from('ambassadors')
            .select('ambassador_last_name')
            .eq('nation_id', currentNation.id)
            .eq('target_nation_id', targetNationId)
            .eq('is_active', true)
            .eq('status', 'active')
            .single();

        const senderName = 'Amb. ' + (amb?.ambassador_last_name || currentFaction.faction_name);

        await _supabase.from('diplomatic_messages').insert({
            from_nation_id: currentNation.id,
            to_nation_id: targetNationId,
            from_faction_id: currentFaction.id,
            sender_role: 'ambassador',
            sender_name: senderName,
            message_text: text,
            sent_at_tick: tick
        });

        // Append message locally
        const chatBox = document.getElementById('diplo-chat-box');
        if (chatBox) {
            // Remove empty state if present
            const empty = chatBox.querySelector('.diplo-chat-empty');
            if (empty) empty.remove();

            chatBox.innerHTML += `
                <div class="diplo-msg mine">
                    <div class="diplo-msg-sender">
                        ${senderName}
                        <span class="role-badge" style="background:#1a5276;color:#fff;">ambassador</span>
                    </div>
                    <div class="diplo-msg-text">${escapeHtml(text)}</div>
                    <div class="diplo-msg-tick">Tick ${tick}</div>
                </div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        input.value = '';
    } catch (e) {
        console.error('Error sending message:', e);
        alert('Failed to send message: ' + e.message);
    }
}

// ==================== AMBASSADOR DROPDOWN NAV ====================

function jumpToAmbNation(targetNationId) {
    if (!targetNationId) return;
    // Find the matching land path on the map and click it
    const paths = document.querySelectorAll('.land');
    for (const path of paths) {
        // We need to match by nation name — fetch from roles
        const ambInfo = diplomaticRoles.ambassadorTo.find(a => a.target_nation_id === targetNationId);
        if (ambInfo) {
            const nationName = ambInfo.target_nation_name;
            const matchPath = document.querySelector('.land[data-nation-name="' + nationName + '"]');
            if (matchPath) {
                matchPath.click();
                return;
            }
        }
    }
}
