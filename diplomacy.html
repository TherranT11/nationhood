                    symposium_cooldown_remaining, pending_symposium
                )
            `)
            .eq('faction_id', currentFaction.id)
            .eq('is_active', true);

        if (error) {
            console.error('[IPO] Failed to load memberships:', error.message);
            ipoMemberships = [];
        } else {
            // Filter out any rows where the org is dissolved
            ipoMemberships = (memberships || []).filter(m => m.org && m.org.is_active);
        }
    } catch (e) {
        console.error('[IPO] Membership fetch error:', e);
        ipoMemberships = [];
    }

    // Count members per org (for sidebar meta)
    const memberCounts = {};
    const orgIds = ipoMemberships.map(m => m.org.id);
    if (orgIds.length > 0) {
        const { data: counts } = await _supabase
            .from('ipo_members')
            .select('org_id')
            .in('org_id', orgIds)
            .eq('is_active', true);
        (counts || []).forEach(c => {
            memberCounts[c.org_id] = (memberCounts[c.org_id] || 0) + 1;
        });
    }

    // Auto-select first org if none selected (or if selected org was left)
    if (ipoMemberships.length > 0) {
        const selectedStillValid = ipoMemberships.some(m => m.org.id === ipoSelectedOrgId);
        if (!ipoSelectedOrgId || !selectedStillValid) {
            ipoSelectedOrgId = ipoMemberships[0].org.id;
        }
    } else {
        ipoSelectedOrgId = null;
    }

    // Check for pending invitations
    let pendingInvites = [];
    try {
        const { data: invites } = await _supabase
            .from('ipo_invitations')
            .select(`
                id, invited_role, invited_at_tick, status,
                org:international_orgs ( id, name, logo_symbol, logo_text, logo_image_url ),
                inviter:invited_by ( id, faction_name )
            `)
            .eq('target_faction_id', currentFaction.id)
            .in('status', ['pending']);
        pendingInvites = invites || [];
    } catch (e) { /* non-fatal */ }

    // ── Fetch all existing orgs the player is NOT a member of ──
    let browseOrgs = [];
    try {
        const myOrgIds = ipoMemberships.map(m => m.org.id);
        const { data: allOrgs } = await _supabase
            .from('international_orgs')
            .select('id, name, logo_symbol, logo_text, logo_image_url, description, president_id, charter')
            .eq('is_active', true)
            .order('name');
        browseOrgs = (allOrgs || []).filter(o => !myOrgIds.includes(o.id));
        // Count members for browse orgs
        if (browseOrgs.length > 0) {
            const browseIds = browseOrgs.map(o => o.id);
            const { data: browseCounts } = await _supabase
                .from('ipo_members')
                .select('org_id')
                .in('org_id', browseIds)
                .eq('is_active', true);
            (browseCounts || []).forEach(c => {
                memberCounts[c.org_id] = (memberCounts[c.org_id] || 0) + 1;
            });
        }
    } catch (e) { /* non-fatal */ }

    // ── Fetch pending vote counts per org (open votes where player hasn't voted) ──
    const pendingVoteCounts = {};
    let totalPendingVotes = 0;
    if (orgIds.length > 0) {
        try {
            const { data: openVotes } = await _supabase
                .from('ipo_votes')
                .select('id, org_id')
                .in('org_id', orgIds)
                .eq('status', 'open');
            if (openVotes && openVotes.length > 0) {
                const voteIds = openVotes.map(v => v.id);
                const { data: myBallots } = await _supabase
                    .from('ipo_ballots')
                    .select('vote_id')
                    .in('vote_id', voteIds)
                    .eq('faction_id', currentFaction.id);
                const votedSet = new Set((myBallots || []).map(b => b.vote_id));
                // Only count votes where player is a member (not observer)
                const memberOrgIds = new Set(ipoMemberships.filter(m => m.role === 'member').map(m => m.org.id));
                for (const v of openVotes) {
                    if (!votedSet.has(v.id) && memberOrgIds.has(v.org_id)) {
                        pendingVoteCounts[v.org_id] = (pendingVoteCounts[v.org_id] || 0) + 1;
                        totalPendingVotes++;
                    }
                }
            }
        } catch (e) { /* non-fatal */ }
    }

    // ── Build sidebar ──
    const sidebarItems = ipoMemberships.map(m => {
        const org = m.org;
        const isActive = org.id === ipoSelectedOrgId;
        const count = memberCounts[org.id] || 1;
        const roleLabel = org.president_id === currentFaction.id ? 'President'
            : m.role === 'observer' ? 'Observer' : 'Member';
        const pvCount = pendingVoteCounts[org.id] || 0;
        const pvBadge = pvCount > 0
            ? `<span class="badge badge--amber" style="margin-left:auto;flex-shrink:0;font-size:9px;min-width:16px;text-align:center;padding:1px 5px;">${pvCount}</span>`
            : '';
        return `
            <div class="ipo-sidebar-item ${isActive ? 'is-active' : ''}"
                 onclick="selectIPOOrg('${org.id}')">
                ${renderIPOLogo(org, 'ipo-sidebar-logo', isActive ? 'is-active' : '')}
                <div class="ipo-sidebar-info" style="flex:1;min-width:0;">
                    <span class="ipo-sidebar-name ${isActive ? 'is-active' : ''}">${escapeHtml(org.name)}</span>
                    <span class="ipo-sidebar-meta">${count} member${count !== 1 ? 's' : ''} · ${roleLabel}</span>
                </div>
                ${pvBadge}
            </div>`;
    }).join('');

    // ── Pending invitations in sidebar ──
    const inviteItems = pendingInvites.map(inv => {
        const org = inv.org;
        const inviterName = inv.inviter?.faction_name || 'Unknown';
        return `
            <div class="ipo-sidebar-invite">
                <div class="ipo-sidebar-invite-header">
                    ${renderIPOLogo(org, 'ipo-sidebar-logo', '')}
                    <span class="ipo-sidebar-name">${escapeHtml(org.name)}</span>
                </div>
                <span class="ipo-sidebar-invite-from">Invited by ${escapeHtml(inviterName)} · ${inv.invited_role}</span>
                <div class="ipo-sidebar-invite-actions">
                    <button class="ipo-btn ipo-btn--accept" onclick="acceptIPOInvite('${inv.id}')">Accept</button>
                    <button class="ipo-btn ipo-btn--decline" onclick="declineIPOInvite('${inv.id}')">Decline</button>
                    <button class="ipo-btn ipo-btn--view" onclick="previewIPOInviteOrg('${org.id}','${inv.id}')">View</button>
                </div>
            </div>`;
    }).join('');

    // ── Existing organisations (browse) ──
    let browseSection = '';
    if (browseOrgs.length > 0) {
        const browseItems = browseOrgs.map(o => {
            const count = memberCounts[o.id] || 1;
            return `
                <div class="ipo-sidebar-item" onclick="previewExistingOrg('${o.id}')">
                    ${renderIPOLogo(o, 'ipo-sidebar-logo', '')}
                    <div class="ipo-sidebar-info">
                        <span class="ipo-sidebar-name">${escapeHtml(o.name)}</span>
                        <span class="ipo-sidebar-meta">${count} member${count !== 1 ? 's' : ''}</span>
                    </div>
                </div>`;
        }).join('');
        browseSection = `
            <div class="ipo-sidebar-header" style="margin-top:8px;">
                <span class="ipo-sidebar-dot" style="background:var(--damber);"></span>
                <span class="ipo-sidebar-label">EXISTING ORGANISATIONS</span>
            </div>
            <div class="ipo-sidebar-list">${browseItems}</div>`;
    }

    // ── Main panel ──
    let mainContent = '';
    if (ipoMemberships.length === 0) {
        // Empty state
        mainContent = `
            <div class="ipo-empty-state">
                <div class="ipo-empty-icon">◈</div>
                <div class="ipo-empty-title">International Party Organisations</div>
                <div class="ipo-empty-desc">
                    Join or create an international organisation to coordinate with like-minded parties across nations.
                    Share resources, hold rallies, issue joint statements, and project soft power across borders.
                </div>
                <button class="ipo-btn ipo-btn--create-large" onclick="openIPOCreationModal()">
                    + Create Organisation — 4 AP
                </button>
            </div>`;
    } else {
        // Render selected org detail
        mainContent = await renderIPOMainPanel(memberCounts);
    }

    container.innerHTML = `
        <div class="ipo-sidebar">
            <div class="ipo-sidebar-header">
                <span class="ipo-sidebar-dot"></span>
                <span class="ipo-sidebar-label">YOUR ORGANISATIONS</span>
            </div>
            <div class="ipo-sidebar-list">
                ${sidebarItems}
                ${inviteItems}
            </div>
            ${browseSection}
            <button class="ipo-btn ipo-btn--create" onclick="openIPOCreationModal()">
                + Create Organisation — 4 AP
            </button>
        </div>
        <div class="ipo-main" id="ipo-main">
            ${mainContent}
        </div>`;

    ipoLoaded = true;

    // Update International Orgs sub-tab badge with pending invite count + pending vote count
    updateIPOInviteTabBadge(pendingInvites.length + totalPendingVotes);

    // Load chat, votes, and actions after DOM is set (only if an org is selected)
    if (ipoSelectedOrgId && ipoMemberships.length > 0) {
        loadIPOChat(ipoSelectedOrgId);
        loadIPOVotes(ipoSelectedOrgId).then(() => renderIPOActionsPanel());
    }
}

// ==================== IPO CHAT SYSTEM ====================

let ipoChatMessages = [];       // cached messages for current org
let ipoChatMemberMap = {};      // { faction_id: { name, color } } for rendering

/**
 * Load chat messages for the selected org, render them, and subscribe to realtime.
 */
async function loadIPOChat(orgId) {
    const container = document.getElementById('ipo-chat-messages');
    if (!container || !orgId) return;

    // Unsubscribe from previous channel
    if (ipoRealtimeChannel) {
        _supabase.removeChannel(ipoRealtimeChannel);
        ipoRealtimeChannel = null;
    }

    // Build member map (for names and colors)
    try {
        const { data: members } = await _supabase
            .from('ipo_members')
            .select('faction_id, chat_color, factions:faction_id ( faction_name )')
            .eq('org_id', orgId)
            .eq('is_active', true);
        ipoChatMemberMap = {};
        (members || []).forEach(m => {
            ipoChatMemberMap[m.faction_id] = {
                name: m.factions?.faction_name || 'Unknown',
                color: m.chat_color || '#6b6a5e'
            };
        });
    } catch (e) { console.warn('[IPO Chat] Member map error:', e); }

    // Fetch messages (most recent 100, then reverse for display)
    try {
        const { data: messages, error } = await _supabase
            .from('ipo_chat')
            .select('id, faction_id, is_system, message_text, tick_posted, created_at')
            .eq('org_id', orgId)
            .order('created_at', { ascending: false })
            .limit(100);

        if (error) {
            console.error('[IPO Chat] Fetch error:', error.message);
            ipoChatMessages = [];
        } else {
            // Reverse so oldest is first (chat reads top-to-bottom)
            ipoChatMessages = (messages || []).reverse();
        }
    } catch (e) {
        console.error('[IPO Chat] Fetch exception:', e);
        ipoChatMessages = [];
    }

    renderIPOChatMessages();

    // Subscribe to realtime inserts
    ipoRealtimeChannel = _supabase
        .channel('ipo_chat_' + orgId)
        .on('postgres_changes', {
            event: 'INSERT',
            schema: 'public',
            table: 'ipo_chat',
            filter: 'org_id=eq.' + orgId
        }, (payload) => {
            const msg = payload.new;
            if (!ipoChatMessages.find(m => m.id === msg.id)) {
                ipoChatMessages.push(msg);
                renderIPOChatMessages();
            }
        })
        .subscribe();
}

/**
 * Render chat messages into the chat container.
 */
function renderIPOChatMessages() {
    const container = document.getElementById('ipo-chat-messages');
    if (!container) return;

    if (ipoChatMessages.length === 0) {
        container.innerHTML = '<div class="ipo-chat-system">— No messages yet —</div>';
        return;
    }

    container.innerHTML = ipoChatMessages.map(msg => {
        if (msg.is_system) {
            return `<div class="ipo-chat-system">— ${escapeHtml(msg.message_text)} —</div>`;
        }

        const member = ipoChatMemberMap[msg.faction_id];
        const partyName = member?.name || 'Unknown';
        const partyColor = member?.color || '#6b6a5e';
        const timeStr = formatIPOChatTime(msg.created_at);

        return `<div class="ipo-chat-msg">
            <span class="ipo-chat-msg-party" style="color:${partyColor};">${escapeHtml(partyName)}</span>
            <span class="ipo-chat-msg-text">${escapeHtml(msg.message_text)}</span>
            <span class="ipo-chat-msg-time">${timeStr}</span>
        </div>`;
    }).join('');

    // Auto-scroll to bottom
    container.scrollTop = container.scrollHeight;
}

/**
 * Format chat timestamp (relative or absolute).
 */
function formatIPOChatTime(isoStr) {
    if (!isoStr) return '';
    const d = new Date(isoStr);
    const now = new Date();
    const diff = (now - d) / 1000;
    if (diff < 60) return 'now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h';
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

/**
 * Send a chat message to the current org.
 */
async function sendIPOChat() {
    const input = document.getElementById('ipo-chat-input');
    if (!input || !currentFaction || !ipoSelectedOrgId) return;

    const text = input.value.trim();
    if (!text) return;

    // Check membership is active and role is 'member' (not observer)
    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    if (!membership || membership.role === 'observer') return;

    input.value = '';
    input.disabled = true;

    try {
        const { data, error } = await _supabase.from('ipo_chat').insert({
            org_id: ipoSelectedOrgId,
            faction_id: currentFaction.id,
            is_system: false,
            message_text: text,
            tick_posted: shardTick
        }).select();

        if (error) {
            console.error('[IPO Chat] Send error:', error.message, error.code, error.details);
            input.value = text; // restore on failure
            alert('Message failed to send: ' + error.message);
        } else if (!data || data.length === 0) {
            console.error('[IPO Chat] Send returned no data — RLS may have blocked the insert');
            input.value = text;
            alert('Message may not have been saved. Please try again.');
        } else {
            // Optimistic UI update — show the message immediately rather than
            // waiting for the realtime subscription (which requires the table
            // to be in the supabase_realtime publication).
            const inserted = data?.[0];
            if (inserted && !ipoChatMessages.find(m => m.id === inserted.id)) {
                ipoChatMessages.push(inserted);
                renderIPOChatMessages();
            }
        }
    } catch (e) {
        console.error('[IPO Chat] Send exception:', e);
        input.value = text;
    } finally {
        input.disabled = false;
        input.focus();
    }
}

// ==================== IPO INVITE & EXPULSION (Phase 10) ====================

/**
 * Open the invite modal — allows inviting a faction as member or observer.
 */
async function openIPOInviteModal() {
    if (!currentFaction || !ipoSelectedOrgId) return;
    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    if (!membership || membership.role === 'observer') return;
    _ipoIdeoFilters = new Set();

    // Fetch all factions not already members or with pending invites
    const { data: existingMembers, error: memErr } = await _supabase
        .from('ipo_members')
        .select('faction_id')
        .eq('org_id', ipoSelectedOrgId)
        .eq('is_active', true);
    if (memErr) console.error('[IPO Invite] Members query error:', memErr.message);
    const memberIds = new Set((existingMembers || []).map(m => m.faction_id));

    const { data: allInvites, error: invErr } = await _supabase
        .from('ipo_invitations')
        .select('target_faction_id, status, responded_at_tick')
        .eq('org_id', ipoSelectedOrgId);
    if (invErr) console.error('[IPO Invite] Invitations query error:', invErr.message);

    // Build a map: faction_id → latest invitation status
    const inviteMap = {};
    (allInvites || []).forEach(i => {
        const prev = inviteMap[i.target_faction_id];
        // Keep the most relevant status: pending/vote_pending > declined > accepted
        if (!prev || i.status === 'pending' || i.status === 'vote_pending') {
            inviteMap[i.target_faction_id] = i;
        }
    });

    const IPO_INVITE_COOLDOWN = 10;

    const { data: allFactions, error: facErr } = await _supabase
        .from('factions')
        .select('id, faction_name, nation_id, ideology_value_1, ideology_value_2')
        .order('faction_name');
    if (facErr) console.error('[IPO Invite] Factions query error:', facErr.message);

    const allFactionsList = allFactions || [];
    const nationIds = [...new Set(allFactionsList.map(f => f.nation_id).filter(Boolean))];
    const nationMap = {};
    if (nationIds.length > 0) {
        const { data: nations } = await _supabase.from('nations').select('id, name').in('id', nationIds);
        (nations || []).forEach(n => { nationMap[n.id] = n.name; });
    }

    function ideoTag(name) {
        const c = WN_IDEOLOGY_COLORS[name];
        if (!c) return '';
        return '<span style="display:inline-block;padding:1px 6px;border-radius:3px;font-size:11px;line-height:16px;background:' + c + '22;color:' + c + ';border:1px solid ' + c + '55;">' + escapeHtml(name) + '</span>';
    }

    function statusBadge(f) {
        if (memberIds.has(f.id)) {
            return '<span class="ipo-invite-badge ipo-invite-badge--accepted">Accepted</span>';
        }
        const inv = inviteMap[f.id];
        if (!inv) return '';
        if (inv.status === 'pending' || inv.status === 'vote_pending') {
            return '<span class="ipo-invite-badge ipo-invite-badge--invited">Invited</span>';
        }
        if (inv.status === 'declined') {
            const ticksSince = shardTick - (inv.responded_at_tick || 0);
            if (ticksSince < IPO_INVITE_COOLDOWN) {
                const remaining = IPO_INVITE_COOLDOWN - ticksSince;
                return '<span class="ipo-invite-badge ipo-invite-badge--rejected">Rejected · ' + remaining + ' Tick Cooldown</span>';
            }
        }
        return '';
    }

    function isDisabled(f) {
        if (memberIds.has(f.id)) return true;
        const inv = inviteMap[f.id];
        if (!inv) return false;
        if (inv.status === 'pending' || inv.status === 'vote_pending') return true;
        if (inv.status === 'declined') {
            const ticksSince = shardTick - (inv.responded_at_tick || 0);
            if (ticksSince < IPO_INVITE_COOLDOWN) return true;
        }
        return false;
    }

    // Find first selectable faction
    const firstSelectable = allFactionsList.find(f => !isDisabled(f));

    const listItems = allFactionsList.map(f => {
        const nation = nationMap[f.nation_id] ? ' <span style="color:var(--text-dim);font-size:12px;">· ' + escapeHtml(nationMap[f.nation_id]) + '</span>' : '';
        const ideo1 = f.ideology_value_1 ? ideoTag(f.ideology_value_1) : '';
        const ideo2 = f.ideology_value_2 ? ideoTag(f.ideology_value_2) : '';
        const ideoHtml = (ideo1 || ideo2) ? '<div style="display:flex;gap:4px;margin-top:2px;">' + ideo1 + ideo2 + '</div>' : '';
        const badge = statusBadge(f);
        const disabled = isDisabled(f);
        const selectedClass = (!disabled && firstSelectable && f.id === firstSelectable.id) ? ' selected' : '';
        const disabledClass = disabled ? ' disabled' : '';
        const ideos = [f.ideology_value_1, f.ideology_value_2].filter(Boolean).join(',');
        return '<div class="ipo-invite-item' + selectedClass + disabledClass + '" data-faction-id="' + f.id + '" data-ideologies="' + ideos + '"'
            + (disabled ? '' : ' onclick="selectIPOInviteTarget(this)"')
            + '>'
            + '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">'
            + '<span style="font-size:13px;">' + escapeHtml(f.faction_name) + nation + '</span>'
            + badge
            + '</div>'
            + ideoHtml
            + '</div>';
    }).join('');

    // Build ideology filter bar
    const ideoNames = Object.keys(WN_IDEOLOGY_COLORS);
    const ideoFilterBtns = ideoNames.map(name => {
        const c = WN_IDEOLOGY_COLORS[name];
        return '<button class="ipo-ideo-filter-btn" data-ideology="' + name + '" onclick="toggleIPOIdeoFilter(this)" style="background:' + c + '18;color:' + c + ';border:1px solid ' + c + '44;">' + name + '</button>';
    }).join('');

    const inner = document.getElementById('ipo-create-modal-inner');
    document.getElementById('ipo-create-modal').classList.add('active');
    inner.innerHTML = `
        <div class="ipo-modal-header">
            <span class="ipo-modal-title">Invite to Organisation</span>
            <button class="modal-close" onclick="closeIPOActionModal()">&times;</button>
        </div>
        <div class="ipo-modal-body">
            <label class="ipo-vote-form-label">Party to Invite</label>
            <div id="ipo-ideo-filter-bar" style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;">${ideoFilterBtns}</div>
            <input type="hidden" id="ipo-invite-target" value="${firstSelectable?.id || ''}">
            <div id="ipo-invite-list" style="max-height:260px;overflow-y:auto;border:1px solid var(--border-color, rgba(255,255,255,0.12));border-radius:6px;background:var(--bg-darker, rgba(0,0,0,0.2));">${listItems}</div>
            <label class="ipo-vote-form-label">Role</label>
            <select id="ipo-invite-role" class="ipo-vote-form-select">
                <option value="member">Member — full voting and action rights</option>
                <option value="observer">Observer — read-only access, no voting</option>
            </select>
            <div class="ipo-vote-form-note">The invited party will see this invitation and can accept or decline.</div>
            <div class="wizard-nav" style="margin-top:16px;">
                <button class="wizard-back-btn" onclick="closeIPOActionModal()">Cancel</button>
                <button class="ipo-btn ipo-btn--create-large" onclick="submitIPOInvite()">Send Invitation</button>
            </div>
        </div>`;
}

function selectIPOInviteTarget(el) {
    if (el.classList.contains('disabled')) return;
    document.querySelectorAll('#ipo-invite-list .ipo-invite-item.selected').forEach(item => item.classList.remove('selected'));
    el.classList.add('selected');
    document.getElementById('ipo-invite-target').value = el.dataset.factionId;
}

let _ipoIdeoFilters = new Set();
function toggleIPOIdeoFilter(btn) {
    const ideo = btn.dataset.ideology;
    if (_ipoIdeoFilters.has(ideo)) {
        _ipoIdeoFilters.delete(ideo);
        btn.classList.remove('active');
    } else {
        _ipoIdeoFilters.add(ideo);
        btn.classList.add('active');
    }
    // Filter the list
    document.querySelectorAll('#ipo-invite-list .ipo-invite-item').forEach(item => {
        if (_ipoIdeoFilters.size === 0) {
            item.style.display = '';
            return;
        }
        const ideos = (item.dataset.ideologies || '').split(',');
        const match = ideos.some(i => _ipoIdeoFilters.has(i));
        item.style.display = match ? '' : 'none';
    });
}

/**
 * Submit an invitation to the selected faction.
 */
async function submitIPOInvite() {
    if (_ipoActionLock) return;
    const targetId = document.getElementById('ipo-invite-target')?.value;
    const role = document.getElementById('ipo-invite-role')?.value || 'member';
    if (!targetId) { alert('Select a party to invite.'); return; }

    _ipoActionLock = true;
    try {
        const { error } = await _supabase.from('ipo_invitations').insert({
            org_id: ipoSelectedOrgId,
            invited_by: currentFaction.id,
            target_faction_id: targetId,
            invited_role: role,
            status: 'pending',
            invited_at_tick: shardTick
        });

        if (error) {
            if (error.code === '23505') {
                alert('This party already has a pending invitation.');
            } else {
                alert('Failed to send invitation: ' + error.message);
            }
            return;
        }

        // Get target name for chat
        const { data: targetFaction } = await _supabase
            .from('factions')
            .select('faction_name')
            .eq('id', targetId)
            .single();
        const targetName = targetFaction?.faction_name || 'A party';

        await _supabase.from('ipo_chat').insert({
            org_id: ipoSelectedOrgId,
            faction_id: null,
            is_system: true,
            message_text: `${currentFaction.faction_name} invited ${targetName} as ${role}.`,
            tick_posted: shardTick
        });

        closeIPOActionModal();
        alert(`Invitation sent to ${targetName}.`);
    } catch (e) {
        console.error('[IPO] Invite error:', e);
        alert('Failed to send invitation.');
    } finally {
        _ipoActionLock = false;
    }
}

/**
 * Expel a member — president direct if charter allows, otherwise opens a vote.
 */
async function openIPOExpelModal() {
    if (!currentFaction || !ipoSelectedOrgId) return;
    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    if (!membership) return;

    const org = membership.org;
    const charter = org?.charter || {};
    const expClause = charter.membership?.expulsionClause;
    const isPresident = org.president_id === currentFaction.id;

    if (!expClause) {
        alert('Expulsion is disabled in this organisation\'s charter.');
        return;
    }

    // If president-only expulsion, only president can do it
    if (expClause === 'president' && !isPresident) {
        alert('Only the president can expel members under this charter.');
        return;
    }

    // Fetch members (exclude self) — include observers so they can be expelled too
    const otherMembers = ipoAllMembers.filter(m => m.faction_id !== currentFaction.id);
    if (otherMembers.length === 0) {
        alert('No other members to expel.');
        return;
    }

    const memberOpts = otherMembers.map(m => {
        const roleTag = m.role === 'observer' ? ' (Observer)' : '';
        return `<option value="${m.faction_id}">${escapeHtml(m.factions?.faction_name || 'Unknown')}${roleTag}</option>`;
    }).join('');

    const modeLabel = expClause === 'president'
        ? 'As president, you can expel a member immediately.'
        : `Expulsion requires a ${expClause} vote. This will create a vote proposal.`;

    const inner = document.getElementById('ipo-create-modal-inner');
    document.getElementById('ipo-create-modal').classList.add('active');
    inner.innerHTML = `
        <div class="ipo-modal-header">
            <span class="ipo-modal-title">Expel Member</span>
            <button class="modal-close" onclick="closeIPOActionModal()">&times;</button>
        </div>
        <div class="ipo-modal-body">
            <div class="ipo-vote-form-note">${modeLabel}</div>
            <label class="ipo-vote-form-label">Member to Expel</label>
            <select id="ipo-expel-target" class="ipo-vote-form-select">${memberOpts}</select>
            <div class="wizard-nav" style="margin-top:16px;">
                <button class="wizard-back-btn" onclick="closeIPOActionModal()">Cancel</button>
                <button class="ipo-btn ipo-btn--create-large" style="background:rgba(217,83,79,0.15);border-color:rgba(217,83,79,0.3);color:#d9534f;" onclick="submitIPOExpel()">
                    ${expClause === 'president' ? 'Expel Now' : 'Propose Expulsion Vote'}
                </button>
            </div>
        </div>`;
}

async function submitIPOExpel() {
    if (_ipoActionLock) return;
    const targetId = document.getElementById('ipo-expel-target')?.value;
    if (!targetId) { alert('Select a member.'); return; }

    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    const org = membership?.org;
    const expClause = org?.charter?.membership?.expulsionClause;

    const targetMember = ipoAllMembers.find(m => m.faction_id === targetId);
    const targetName = targetMember?.factions?.faction_name || 'Unknown';

    _ipoActionLock = true;
    if (expClause === 'president') {
        // Direct expulsion by president
        if (!confirm(`Expel ${targetName} from the organisation? This is immediate and cannot be undone.`)) return;

        try {
            await _supabase.from('ipo_members')
                .update({ is_active: false, left_at_tick: shardTick })
                .eq('org_id', ipoSelectedOrgId)
                .eq('faction_id', targetId)
                .eq('is_active', true);

            await _supabase.from('ipo_chat').insert({
                org_id: ipoSelectedOrgId,
                faction_id: null,
                is_system: true,
                message_text: `${targetName} has been expelled by the president.`,
                tick_posted: shardTick
            });

            await _supabase.from('ipo_action_log').insert({
                org_id: ipoSelectedOrgId,
                faction_id: currentFaction.id,
                target_faction_id: targetId,
                action_type: 'expulsion',
                action_data: { type: 'expulsion', target_name: targetName, by_president: true },
                ap_cost: 0,
                performed_at_tick: shardTick
            });

            closeIPOActionModal();
            renderIPOView();
        } catch (e) {
            console.error('[IPO] Expulsion error:', e);
            alert('Failed to expel member.');
        } finally {
            _ipoActionLock = false;
        }
    } else {
        // Create expulsion vote
        try {
            if (!await _checkOpenVoteLimit(ipoSelectedOrgId)) {
                alert(`This organisation already has ${IPO_MAX_OPEN_VOTES} open votes. Wait for some to close before proposing new ones.`);
                _ipoActionLock = false;
                return;
            }
            await _supabase.from('ipo_votes').insert({
                org_id: ipoSelectedOrgId,
                title: `Expel ${targetName}`,
                vote_type: 'expulsion',
                meta: { target_faction_id: targetId, target_faction_name: targetName },
                status: 'open',
                opened_at_tick: shardTick,
                closes_at_tick: shardTick + IPO_VOTE_DURATION,
                proposed_by: currentFaction.id
            });

            await _supabase.from('ipo_chat').insert({
                org_id: ipoSelectedOrgId,
                faction_id: null,
                is_system: true,
                message_text: `${currentFaction.faction_name} proposed to expel ${targetName}. A vote has been opened.`,
                tick_posted: shardTick
            });

            closeIPOActionModal();
            await loadIPOVotes(ipoSelectedOrgId);
        } catch (e) {
            console.error('[IPO] Expulsion vote error:', e);
            alert('Failed to propose expulsion vote.');
        } finally {
            _ipoActionLock = false;
        }
    }
}

// openIPOAmendModal() defined below in IPO AMEND CHARTER section
async function leaveIPOOrg() {
    if (!currentFaction || !ipoSelectedOrgId) return;

    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    const org = membership?.org;
    const isPresident = org?.president_id === currentFaction.id;

    let confirmMsg = 'Are you sure you want to leave this organisation? Your solidarity fund contributions will not be returned.';
    if (isPresident) {
        confirmMsg += '\n\nYou are the PRESIDENT. Leadership will pass to the next eligible member.';
    }
    if (!confirm(confirmMsg)) return;

    try {
        const { error: leaveErr } = await _supabase.from('ipo_members')
            .update({ is_active: false, left_at_tick: shardTick })
            .eq('org_id', ipoSelectedOrgId)
            .eq('faction_id', currentFaction.id)
            .eq('is_active', true);
        if (leaveErr) { alert('Failed to leave organisation: ' + leaveErr.message); return; }

        // System message
        await _supabase.from('ipo_chat').insert({
            org_id: ipoSelectedOrgId,
            faction_id: null,
            is_system: true,
            message_text: `${currentFaction.faction_name} has left the organisation.`,
            tick_posted: shardTick
        });

        // Check remaining members
        const { data: remaining } = await _supabase
            .from('ipo_members')
            .select('faction_id, role')
            .eq('org_id', ipoSelectedOrgId)
            .eq('is_active', true);

        const remainingMembers = (remaining || []).filter(m => m.role === 'member');

        if (!remaining || remaining.length === 0) {
            // No one left — dissolve org
            await _supabase.from('international_orgs')
                .update({ is_active: false, dissolved_at_tick: shardTick })
                .eq('id', ipoSelectedOrgId);

            // Cancel all pending/vote_pending invitations
            await _supabase.from('ipo_invitations')
                .update({ status: 'expired', responded_at_tick: shardTick })
                .eq('org_id', ipoSelectedOrgId)
                .in('status', ['pending', 'vote_pending']);

            // Close all open votes as failed
            await _supabase.from('ipo_votes')
                .update({ status: 'failed', resolved_at_tick: shardTick, result: { yes: 0, no: 0, abstain: 0, passed: false, reason: 'Organisation dissolved' } })
                .eq('org_id', ipoSelectedOrgId)
                .eq('status', 'open');

            await _supabase.from('ipo_chat').insert({
                org_id: ipoSelectedOrgId,
                faction_id: null,
                is_system: true,
                message_text: 'Organisation dissolved — no members remaining.',
                tick_posted: shardTick
            });
        } else if (isPresident && remainingMembers.length > 0) {
            // President leaving — hand off to next member
            const newPresId = remainingMembers[0].faction_id;
            await _supabase.from('international_orgs')
                .update({ president_id: newPresId, president_term_start_tick: shardTick })
                .eq('id', ipoSelectedOrgId);

            const { data: newPres } = await _supabase
                .from('factions').select('faction_name').eq('id', newPresId).single();

            await _supabase.from('ipo_chat').insert({
                org_id: ipoSelectedOrgId,
                faction_id: null,
                is_system: true,
                message_text: `${newPres?.faction_name || 'A member'} is now president (previous president departed).`,
                tick_posted: shardTick
            });
        }

        // Clear HQ if the departing member was the HQ nation's party
        if (org?.headquarters_nation_id) {
            const { data: hqMembers } = await _supabase
                .from('ipo_members')
                .select('faction_id, factions:faction_id ( nation_id )')
                .eq('org_id', ipoSelectedOrgId)
                .eq('is_active', true);
            const hasHqMember = (hqMembers || []).some(m => m.factions?.nation_id === org.headquarters_nation_id);
            if (!hasHqMember) {
                await _supabase.from('international_orgs')
                    .update({ headquarters_nation_id: null })
                    .eq('id', ipoSelectedOrgId);

                await _supabase.from('ipo_chat').insert({
                    org_id: ipoSelectedOrgId,
                    faction_id: null,
                    is_system: true,
                    message_text: 'Headquarters vacated — no member party remains in the HQ nation.',
                    tick_posted: shardTick
                });
            }
        }

        ipoSelectedOrgId = null;
        renderIPOView();
    } catch (e) {
        console.error('[IPO] Leave org error:', e);
        alert('Failed to leave organisation.');
    }
}

/**
 * Accept an IPO invitation.
 */
async function acceptIPOInvite(inviteId) {
    if (!currentFaction) return;
    try {
        // Fetch invite details
        const { data: invite, error: fetchErr } = await _supabase
            .from('ipo_invitations')
            .select('id, org_id, invited_role, status')
            .eq('id', inviteId)
            .single();
        if (fetchErr || !invite || invite.status !== 'pending') {
            alert('This invitation is no longer valid.');
            renderIPOView();
            return;
        }

        // Check if org charter requires a vote for admission
        const { data: org } = await _supabase
            .from('international_orgs')
            .select('charter')
            .eq('id', invite.org_id)
            .single();
        const admission = org?.charter?.membership?.admission || 'vote';

        if (admission === 'vote' && invite.invited_role === 'member') {
            // Check open vote limit
            if (!await _checkOpenVoteLimit(invite.org_id)) {
                alert(`This organisation already has ${IPO_MAX_OPEN_VOTES} open votes. Please try again later.`);
                _ipoActionLock = false;
                return;
            }
            // Mark invite as vote_pending and auto-create a membership vote
            await _supabase.from('ipo_invitations')
                .update({ status: 'vote_pending', responded_at_tick: shardTick })
                .eq('id', inviteId);

            // Create the membership vote automatically
            await _supabase.from('ipo_votes').insert({
                org_id: invite.org_id,
                title: `Admit ${currentFaction.faction_name}`,
                vote_type: 'membership',
                meta: {
                    invite_id: inviteId,
                    target_faction_id: currentFaction.id,
                    target_faction_name: currentFaction.faction_name
                },
                status: 'open',
                opened_at_tick: shardTick,
                closes_at_tick: shardTick + IPO_VOTE_DURATION,
                proposed_by: currentFaction.id
            });

            // System chat message
            await _supabase.from('ipo_chat').insert({
                org_id: invite.org_id,
                faction_id: null,
                is_system: true,
                message_text: `${currentFaction.faction_name} has applied for membership. A vote has been opened.`,
                tick_posted: shardTick
            });

            alert('Your application has been submitted. The organisation will vote on your membership.');
        } else {
            // Direct admission (president decides, or observer role)
            let factionsToAdmit = [{ id: currentFaction.id, name: currentFaction.faction_name }];

            for (const f of factionsToAdmit) {
                const chatColor = await assignIPOChatColor(invite.org_id);
                await _supabase.from('ipo_members').insert({
                    org_id: invite.org_id,
                    faction_id: f.id,
                    role: invite.invited_role,
                    joined_at_tick: shardTick,
                    chat_color: chatColor
                });
            }

            await _supabase.from('ipo_invitations')
                .update({ status: 'accepted', responded_at_tick: shardTick })
                .eq('id', inviteId);

            // System chat message
            const admitMsg = factionsToAdmit.length > 1
                ? `${currentFaction.faction_name} and its ${factionsToAdmit.length - 1} faction(s) have joined the organisation.`
                : `${currentFaction.faction_name} has joined the organisation.`;
            await _supabase.from('ipo_chat').insert({
                org_id: invite.org_id,
                faction_id: null,
                is_system: true,
                message_text: admitMsg,
                tick_posted: shardTick
            });
        }
        renderIPOView();
    } catch (e) {
        console.error('[IPO] Accept invite error:', e);
        alert('Failed to accept invitation.');
    }
}

/**
 * Decline an IPO invitation.
 */
async function declineIPOInvite(inviteId) {
    if (!currentFaction) return;
    try {
        // Look up the invite to find the org
        const { data: invite } = await _supabase.from('ipo_invitations')
            .select('org_id')
            .eq('id', inviteId)
            .single();

        await _supabase.from('ipo_invitations')
            .update({ status: 'declined', responded_at_tick: shardTick })
            .eq('id', inviteId);

        // Post to chat
        if (invite?.org_id) {
            await _supabase.from('ipo_chat').insert({
                org_id: invite.org_id,
                faction_id: null,
                is_system: true,
                message_text: `${currentFaction.faction_name} declined the invitation to join.`,
                tick_posted: shardTick
            });
        }

        renderIPOView();
    } catch (e) {
        console.error('[IPO] Decline invite error:', e);
    }
}

// ==================== IPO CHARTER DISPLAY ====================

/**
 * Render the charter panel contents for the selected org.
 */
function renderIPOCharterPanel(charter, org) {
    if (!charter || Object.keys(charter).length === 0) {
        return '<span class="ipo-main-placeholder-text">No charter defined.</span>';
    }

    const sections = [];

    // Article I — Mission Statement
    if (charter.mission != null) {
        sections.push(renderCharterSection('Article I — Mission Statement',
            `<div class="ipo-charter-text">${escapeHtml(charter.mission)}</div>`));
    }

    // Article II — Leadership
    if (charter.leadership) {
        const l = charter.leadership;
        const typeLabels = { vote: 'Vote', rotation: 'Rotation', most_seats: 'Most Seats', random: 'Random' };
        const weightLabels = { equal: 'Equal (one vote per member)', seat_share: 'By Seat Share' };
        const passLabels = { majority: 'Majority (>50%)', unanimous: 'Unanimous' };
        sections.push(renderCharterSection('Article II — Leadership', `
            ${charterRow('Leadership Type', typeLabels[l.type] || l.type)}
            ${charterRow('Succession Term', (l.termYears || 2) + ' Year' + ((l.termYears||2) > 1 ? 's' : ''))}
            ${charterRow('Voting Weight', weightLabels[l.votingWeight] || l.votingWeight)}
            ${charterRow('Vote Pass Threshold', passLabels[l.votePass] || l.votePass)}
        `));
    }

    // Article III — Membership
    if (charter.membership) {
        const m = charter.membership;
        const admLabels = { vote: 'Vote Required', president: 'President Decides' };
        let membershipRows = charterRow('New Member Admission', admLabels[m.admission] || m.admission);

        if (m.ideologicalThreshold?.enabled && m.ideologicalThreshold.directions?.length > 0) {
            const dirs = m.ideologicalThreshold.directions.map(d =>
                `<span class="ipo-charter-tag">${escapeHtml(d.charAt(0).toUpperCase() + d.slice(1))}</span>`
            ).join(' ');
            membershipRows += charterRow('Ideological Requirements', dirs);
        } else {
            membershipRows += charterRow('Ideological Threshold', 'None');
        }

        if (m.expulsionClause) {
            const expLabels = { president: 'President Only', majority: 'Majority Vote', unanimous: 'Unanimous Vote' };
            membershipRows += charterRow('Expulsion Clause', expLabels[m.expulsionClause] || m.expulsionClause);
        } else {
            membershipRows += charterRow('Expulsion Clause', 'Disabled');
        }

        sections.push(renderCharterSection('Article III — Membership', membershipRows));
    }

    // Article IV — Transparency & Governance
    if (charter.governance) {
        const g = charter.governance;
        const actionLabels = {
            unilateral: 'Unilateral — any member can execute actions',
            committee: 'Committee — all actions require a vote (funded from solidarity fund)',
            presidential: 'Presidential — only the president can execute actions',
            delegated: 'Delegated — president + officers can act, others must vote',
            tiered: 'Tiered — actions ≤2 AP are unilateral, higher cost requires a vote'
        };
        const transLabels = { public: 'Public Ballot', secret: 'Secret Ballot' };
        const vetoLabels = { founding: 'Founding Party', president: 'Current President', hq: 'HQ Nation Party' };
        sections.push(renderCharterSection('Article IV — Transparency & Governance', `
            ${charterRow('Action Leadership', actionLabels[g.actionLeadership] || actionLabels.unilateral)}
            ${charterRow('Vote Transparency', transLabels[g.voteTransparency] || g.voteTransparency)}
            ${charterRow('Observer Status', g.observerStatus ? 'Enabled' : 'Disabled')}
            ${charterRow('Veto Right', g.vetoRight ? vetoLabels[g.vetoRight] || g.vetoRight : 'None')}
            ${charterRow('Emergency Powers', g.emergencyPowers ? 'Enabled — President can act once per term without a vote' : 'Disabled')}
        `));
    }

    // Article V — Resources & External Relations
    if (charter.resources) {
        const r = charter.resources;
        const stmtLabels = { president: 'President Alone', vote: 'Majority Vote Required' };
        let resourceRows = '';

        if (r.solidarityFund?.enabled) {
            resourceRows += charterRow('Solidarity Fund', r.solidarityFund.contributionPerQuarter + ' AP / Quarter');
        } else {
            resourceRows += charterRow('Solidarity Fund', 'Disabled');
        }

        if (r.resourceSharingCap != null) {
            resourceRows += charterRow('Resource Sharing Cap', r.resourceSharingCap + ' per member per term');
        } else {
            resourceRows += charterRow('Resource Sharing Cap', 'No limit');
        }

        resourceRows += charterRow('Joint Statements', stmtLabels[r.jointStatementClause] || r.jointStatementClause);
        resourceRows += charterRow('Headquarters', r.headquarters ? 'Active' : 'Not designated');

        sections.push(renderCharterSection('Article V — Resources & External Relations', resourceRows));
    }

    return sections.join('<div class="ipo-charter-divider"></div>');
}

function renderCharterSection(title, body) {
    return `
        <div class="ipo-charter-section">
            <div class="ipo-charter-article-label">${title}</div>
            ${body}
        </div>`;
}

function charterRow(label, value) {
    return `<div class="ipo-charter-row">
        <span class="ipo-charter-row-label">${label}</span>
        <span class="ipo-charter-row-value">${value}</span>
    </div>`;
}

function ipoAmendAddArticle() {
    const sel = document.getElementById('ipo-add-article-select');

    const defaults = {
        leadership:  { type: 'rotation', termYears: 2, votingWeight: 'equal', votePass: 'majority' },
        membership:  { admission: 'vote', ideologicalThreshold: { enabled: false, directions: [] }, expulsionClause: null },
        governance:  { actionLeadership: 'unilateral', voteTransparency: 'public', observerStatus: false, vetoRight: null, emergencyPowers: false },
