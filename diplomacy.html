// ==================== RELATION TIER (score-driven) ====================

function getRelationTier(score, hasCeasefire) {
    if (hasCeasefire)  return { label: 'Ceasefire',     cssClass: 'rel-ceasefire' };
    if (score >= 90)   return { label: 'Allied',        cssClass: 'rel-allied' };
    if (score >= 70)   return { label: 'Friendly',      cssClass: 'rel-friendly' };
    if (score >= 50)   return { label: 'Warm',          cssClass: 'rel-warm' };
    if (score >= 35)   return { label: 'Neutral',       cssClass: 'rel-neutral' };
    if (score >= 20)   return { label: 'Cold',          cssClass: 'rel-cold' };
    if (score >= 5)    return { label: 'Hostile',       cssClass: 'rel-hostile' };
    return                     { label: 'Adversarial',   cssClass: 'rel-adversarial' };
}

function getRelationBarColor(score) {
    if (score >= 90) return 'var(--green)';
    if (score >= 70) return 'var(--teal)';
    if (score >= 50) return 'var(--blue)';
    if (score >= 35) return 'var(--text-dim)';
    if (score >= 20) return 'var(--amber)';
    if (score >= 5)  return 'var(--red)';
    return 'var(--red)';
}

// ==================== RELATION SECTION ====================

function renderRelationSection(relType, relClass, embassyStatus, ambassador) {
    const embassyColor = embassyStatus === 'open' ? '#4ade80' : '#ef4444';
    const ambName = ambassador
        ? (ambassador.ambassador_first_name || '') + ' ' + (ambassador.ambassador_last_name || '')
        : null;
    const ambParty = ambassador?.factions?.abbreviation ? ' (' + ambassador.factions.abbreviation + ')' : '';

    // Ambassador term info
    let termHTML = '';
    if (ambassador && ambassador.appointed_at_tick != null) {
        const termLength = ambassador.term_length || 60;
        const ticksServed = shardTick - ambassador.appointed_at_tick;
        const ticksRemaining = Math.max(0, termLength - ticksServed);
        const expiryTick = ambassador.appointed_at_tick + termLength;
        const remainingYears = Math.floor(ticksRemaining / 12);
        const remainingMonths = ticksRemaining % 12;
        const remainingStr = remainingYears > 0
            ? remainingYears + 'y ' + remainingMonths + 'mo'
            : remainingMonths + ' month' + (remainingMonths !== 1 ? 's' : '');

        termHTML = `
            <div class="info-row">
                <span class="info-label">Appointed</span>
                <span class="info-value" style="font-size:0.78rem;">${tickToDate(ambassador.appointed_at_tick)}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Term Expires</span>
                <span class="info-value" style="font-size:0.78rem;">${tickToDate(expiryTick)}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Remaining</span>
                <span class="info-value" style="font-size:0.78rem;color:${ticksRemaining <= 3 ? '#ef4444' : ticksRemaining <= 6 ? '#f97316' : '#4ade80'};">${remainingStr}</span>
            </div>`;
    }

    // Retirement warning
    let warningHTML = '';
    if (ambassador && ambassador.appointed_at_tick != null) {
        const termLength = ambassador.term_length || 60;
        const ticksRemaining = Math.max(0, termLength - (shardTick - ambassador.appointed_at_tick));
        if (ticksRemaining <= DIPLOMACY_CONFIG.AMBASSADOR_RETIREMENT_WARNING && ticksRemaining > 0) {
            warningHTML = `
                <div style="background:rgba(249,115,22,0.08);border:1px solid rgba(249,115,22,0.2);border-radius:6px;padding:8px 10px;margin-top:8px;font-size:0.78rem;color:#f97316;">
                    &#9888; Ambassador ${ambName ? ambName.trim() : ''} will retire in ${ticksRemaining} tick${ticksRemaining !== 1 ? 's' : ''}. Conclude any active negotiations.
                </div>`;
        }
    }

    return `
        <div class="diplo-section-title">Diplomatic Relations</div>
        <div class="info-block">
            <div class="info-row">
                <span class="info-label">Relation</span>
                <span class="relation-badge ${relClass}">${relType}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Embassy</span>
                <span class="info-value" style="color:${embassyColor};text-transform:capitalize;">${embassyStatus}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Ambassador</span>
                <span class="info-value" style="font-size:0.85rem;">${ambName ? ambName.trim() + '<span class="amb-party-tag">' + escapeHtml(ambParty) + '</span>' : '<span style="color:#666;">None assigned</span>'}</span>
            </div>
            ${termHTML}
        </div>
        ${warningHTML}
    `;
}

// ==================== TRADE NEGOTIATIONS ON NATION CARD ====================

async function renderNationTradeNegotiations(targetNationId) {
    if (!currentNation) return '';

    try {
        // Canonical ordering
        const aId = currentNation.id < targetNationId ? currentNation.id : targetNationId;
        const bId = currentNation.id < targetNationId ? targetNationId : currentNation.id;

        const { data: negotiations } = await _supabase
            .from('trade_negotiations')
            .select('id, agreement_type, agreement_name, status, expires_at_tick, participants')
            .in('status', ['open', 'active'])
            .eq('nation_a_id', aId)
            .eq('nation_b_id', bId);

        if (!negotiations || negotiations.length === 0) return '';

        let html = '<div class="diplo-section-title">Trade Negotiations</div>';

        for (const neg of negotiations) {
            const typeInfo = neg.agreement_type && neg.agreement_type !== 'pending' ? TRADE_AGREEMENT_TYPES[neg.agreement_type] : null;
            const ticksLeft = neg.expires_at_tick - shardTick;
            const statusClass = ticksLeft <= 2 ? 'expiring' : 'active';
            const iconHtml = typeInfo ? (TRADE_TYPE_ICONS[typeInfo.icon] || '') : '&#128220;';

            const subLabel = typeInfo ? escapeHtml(typeInfo.shortLabel) : 'Type pending';

            html += `
                <div class="trade-neg-status" style="cursor:pointer;margin-bottom:8px;" onclick="showDiploTab('initiative');setTimeout(()=>openTradeNegotiation('${neg.id}'),100)">
                    <div style="display:flex;align-items:center;gap:8px;">
                        <div class="trade-type-icon ${typeInfo ? typeInfo.icon : 'chart'}" style="width:22px;height:22px;font-size:0.75rem;">${iconHtml}</div>
                        <div>
                            <div style="font-size:0.82rem;font-weight:bold;color:var(--text-primary);">
                                ${escapeHtml(neg.agreement_name || 'Unnamed')}
                            </div>
                            <div style="font-size:0.65rem;color:var(--text-muted);">
                                ${subLabel} &middot; ${neg.status === 'open' ? 'Awaiting acceptance' : 'Negotiating'}
                            </div>
                        </div>
                    </div>
                    <div style="text-align:right;">
                        <div class="trade-neg-status-value ${statusClass}" style="font-size:0.75rem;">
                            ${neg.status === 'open' ? 'PENDING' : ticksLeft + 't left'}
                        </div>
                        <div style="font-size:0.58rem;color:var(--accent);font-weight:bold;">OPEN</div>
                    </div>
                </div>
            `;
        }

        return html;
    } catch (e) {
        console.warn('Error loading nation trade negotiations:', e);
        return '';
    }
}

            const ambPartyFM = ambassador?.factions?.abbreviation ? ' (' + ambassador.factions.abbreviation + ')' : '';
            fmButtons = `
                <button class="action-btn" disabled style="opacity:0.6;">Ambassador Active: ${escapeHtml(ambName.trim())}${escapeHtml(ambPartyFM)}</button>`;
            if (roles.isHoG) {
                fmButtons += `<button class="action-btn" style="margin-top:8px;" onclick="selectDraftAction('recall_ambassador','Recall Ambassador',${DIPLOMACY_CONFIG.RECALL_AMBASSADOR_AP},'hog','hog')">Recall Ambassador</button>`;
            }
        } else if (pendingAmbassador) {
            const pendName = (pendingAmbassador.ambassador_first_name || '') + ' ' + (pendingAmbassador.ambassador_last_name || '');
            const pendPartyFM = pendingAmbassador?.factions?.abbreviation ? ' (' + pendingAmbassador.factions.abbreviation + ')' : '';
            fmButtons = `
                <button class="action-btn" disabled style="opacity:0.6;">Awaiting Confirmation: ${escapeHtml(pendName.trim())}${escapeHtml(pendPartyFM)}</button>
                <button class="action-btn" style="margin-top:8px;" onclick="cancelPendingAmbassador('${pendingAmbassador.id}', '${targetNation.name}')">Cancel Nomination</button>`;
        } else {
            fmButtons = `<button class="action-btn" onclick="selectDraftAction('appoint_ambassador','Appoint Ambassador',${APPOINT_AMBASSADOR_AP},'fm','fm')">Appoint Ambassador</button>`;
        }
        fmButtons += `<button class="action-btn" style="margin-top:8px;" disabled>Formal Protest (Coming Soon)</button>`;

        actions += `
            <div class="action-card" style="margin-bottom:10px;">
                <div class="action-header">
                    <span class="action-title">Foreign Minister Actions</span>
                </div>
                <p class="action-desc">As Foreign Minister, you oversee diplomatic proposals and ambassador assignments.</p>
                ${fmButtons}
            </div>
        `;
    }

    // Ambassador actions (only if ambassador to this specific nation)
    const isAmbToTarget = roles.ambassadorTo.some(a => a.target_nation_id === targetNation.id);
    if (isAmbToTarget) {
        const hasTargetAmb = theirAmbassador && theirAmbassador.status === 'active';
        const initiativeDisabled = !hasTargetAmb ? 'disabled style="opacity:0.6;"' : '';
        const initiativeHint = !hasTargetAmb ? '<p class="action-hint">Target nation has no ambassador to negotiate with.</p>' : '';

        // Retirement warning for the player's own ambassador
        let ambWarningHTML = '';
        const myAmb = roles.ambassadorTo.find(a => a.target_nation_id === targetNation.id);
        if (myAmb && myAmb.appointed_at_tick != null) {
            const tl = myAmb.term_length || 60;
            const remaining = Math.max(0, tl - (shardTick - myAmb.appointed_at_tick));
            if (remaining <= DIPLOMACY_CONFIG.AMBASSADOR_RETIREMENT_WARNING && remaining > 0) {
                const ambFullName = ((myAmb.ambassador_first_name || '') + ' ' + (myAmb.ambassador_last_name || '')).trim() + (myAmb.factions?.abbreviation ? ' (' + myAmb.factions.abbreviation + ')' : '');
                ambWarningHTML = `<div style="background:rgba(249,115,22,0.08);border:1px solid rgba(249,115,22,0.2);border-radius:6px;padding:8px 10px;margin-top:8px;font-size:0.78rem;color:#f97316;">&#9888; Ambassador ${ambFullName} will retire in ${remaining} tick${remaining !== 1 ? 's' : ''}. Conclude any active negotiations.</div>`;
            }
        }

        actions += `
            <div class="action-card" style="margin-bottom:10px;">
                <div class="action-header">
                    <span class="action-title">Ambassador Actions</span>
                </div>
                <p class="action-desc">As Ambassador to ${escapeHtml(targetNation.name)}, you can negotiate directly.</p>
                ${ambWarningHTML}
                <button class="action-btn" onclick="showDiploTab('initiative')">New Initiative</button>
                <button class="action-btn" style="margin-top:8px;" disabled>Gather Intel (Coming Soon)</button>
                <button class="action-btn" style="margin-top:8px;background:#5a1a1a;border-color:#8b3030;" onclick="resignAmbassador('${myAmb?.id}', '${escapeHtml(targetNation.name)}')">Resign as Ambassador</button>
            </div>
        `;
    }

    // No role — show observer message
    if (!roles.isHoG && !roles.isFM && !isAmbToTarget) {
        actions += `
            <div class="action-card" style="margin-bottom:10px;">
                <div class="action-header">
                    <span class="action-title">No Diplomatic Authority</span>
                </div>
                <p class="action-desc">Your party does not currently hold a diplomatic role in the coalition. You need to be Head of Government, Foreign Minister, or an Ambassador to take diplomatic actions.</p>
            </div>
        `;
    }

    return `
        <div class="diplo-section-title">Actions</div>
        ${actions}
    `;
}

// ==================== DATA FETCHERS ====================

async function fetchDiplomaticRelation(myNationId, targetNationId) {
    if (!myNationId || !targetNationId || myNationId === targetNationId) return null;

    // Canonical ordering: lower UUID = nation_a
    const nationA = myNationId < targetNationId ? myNationId : targetNationId;
    const nationB = myNationId < targetNationId ? targetNationId : myNationId;

    try {
        const { data } = await _supabase
            .from('diplomatic_relations')
            .select('*')
            .eq('nation_a_id', nationA)
            .eq('nation_b_id', nationB)
            .maybeSingle();
        return data;
    } catch (e) {
        console.warn('Error fetching diplomatic relation:', e);
        return null;
    }
}

async function fetchActiveProposals(myNationId, targetNationId) {
    if (!myNationId || !targetNationId || myNationId === targetNationId) return [];

    try {
        const { data } = await _supabase
            .from('diplomatic_proposals')
            .select('proposal_type, proposal_tier, status, activated_at_tick, proposal_data')
            .or(
                'and(proposing_nation_id.eq.' + myNationId + ',target_nation_id.eq.' + targetNationId + '),' +
                'and(proposing_nation_id.eq.' + targetNationId + ',target_nation_id.eq.' + myNationId + ')'
            )
            .eq('status', 'active');
        return data || [];
    } catch (e) {
        console.warn('Error fetching proposals:', e);
        return [];
    }
}

async function fetchAmbassador(myNationId, targetNationId) {
    if (!myNationId || !targetNationId || myNationId === targetNationId) return null;

    try {
        const { data } = await _supabase
            .from('ambassadors')
            .select('*, factions(abbreviation)')
            .eq('nation_id', myNationId)
            .eq('target_nation_id', targetNationId)
            .eq('is_active', true)
            .eq('status', 'active')
            .maybeSingle();
        return data;
    } catch (e) {
        console.warn('Error fetching ambassador:', e);
        return null;
    }
}

    if (value >= 70) return '#4ade80';
    if (value >= 40) return '#facc15';

}

// ==================== PENDING AMBASSADOR FETCH ====================

async function fetchPendingAmbassador(myNationId, targetNationId) {
    if (!myNationId || !targetNationId || myNationId === targetNationId) return null;

    try {
        const { data: pendingAmbassador } = await _supabase
            .from('ambassadors')
            .select('*, factions(abbreviation)')
            .eq('nation_id', myNationId)
            .eq('target_nation_id', targetNationId)
            .eq('is_active', true)
            .eq('status', 'pending_confirmation')
            .maybeSingle();

        if (!pendingAmbassador) return null;

        const activeBillStatuses = ['floor', 'committee'];
        let billQuery = _supabase
            .from('bills')
            .select('id')
            .eq('bill_type', 'confirmation')
            .in('status', activeBillStatuses);

        if (pendingAmbassador.confirmation_bill_id) {
            billQuery = billQuery.eq('id', pendingAmbassador.confirmation_bill_id);
        } else {
            billQuery = billQuery.eq('ambassador_id', pendingAmbassador.id);
        }

        const { data: liveBill } = await billQuery.maybeSingle();

        if (liveBill) return pendingAmbassador;

        await _supabase
            .from('ambassadors')
            .update({ status: 'rejected', is_active: false })
            .eq('id', pendingAmbassador.id);

        console.warn(`Ambassador confirmation desync detected for ${myNationId} → ${targetNationId}. Resetting state.`);
        return null;
    } catch (e) {
        console.warn('Error fetching pending ambassador:', e);
        return null;
    }
}

// ==================== RESIGN AMBASSADOR ====================

async function resignAmbassador(ambassadorId, nationName) {
    if (!ambassadorId) { alert('No ambassador found.'); return; }

    // Authorization: must actually be this ambassador (faction owns it)
    const isMyAmb = diplomaticRoles?.ambassadorTo?.some(a => a.id === ambassadorId);
    if (!isMyAmb) {
        alert('You are not this ambassador.');
        return;
    }

    if (!confirm(
        `Resign as Ambassador to ${nationName}?\n\n` +
        `Your party will lose 1 Approval.\n` +
        `Any pending negotiations will be affected.`
    )) return;

    try {
        const { data: shard } = await _supabase
            .from('shard')
            .select('current_tick')
            .eq('name', 'Alpha Shard')
            .single();
        const tick = shard?.current_tick || 0;

        // Get ambassador details
        const { data: amb } = await _supabase
            .from('ambassadors')
            .select('faction_id, ambassador_first_name, ambassador_last_name')
            .eq('id', ambassadorId)
            .single();

        if (!amb) { alert('Ambassador not found.'); return; }

        // Deactivate ambassador
        await _supabase
            .from('ambassadors')
            .update({ status: 'resigned', is_active: false, recalled_at_tick: tick })
            .eq('id', ambassadorId);

        // 1 momentum loss for resigning
        await adjustMomentumAll(_supabase, currentNation.id, amb.faction_id, -1, 'diplomacy:ambassador_recall');

        const ambName = ((amb.ambassador_first_name || '') + ' ' + (amb.ambassador_last_name || '')).trim();
        alert(`Ambassador ${ambName} has resigned from ${nationName}.\n-1 Approval to your party.`);

        // Refresh roles, header, and re-render
        diplomaticRoles = await detectDiplomaticRoles(currentFaction, currentNation, currentCoalition);
        { const _apEl = document.getElementById('diplo-ap'); if (_apEl) _apEl.textContent = (currentFaction?.action_points ?? 0) + ' AP'; };
        await renderRelationsTab();

    } catch (e) {
        console.error('Error resigning ambassador:', e);
        alert('Error: ' + e.message);
    }
}

async function cancelPendingAmbassador(ambassadorId, nationName) {
    // Authorization: must be FM or HoG
    await refreshRoles();
    if (!diplomaticRoles.isFM && !diplomaticRoles.isHoG) {
        alert('Only the Foreign Minister or Head of Government can cancel ambassador nominations.');
        return;
    }

    if (!confirm(`Cancel this ambassador nomination to ${nationName}?\n\nThis cannot be undone.`)) return;

    try {
        const { data: amb } = await _supabase
            .from('ambassadors')
            .select('id, ambassador_first_name, ambassador_last_name')
            .eq('id', ambassadorId)
            .maybeSingle();

        if (!amb) { alert('Pending ambassador nomination not found.'); return; }

        await _supabase
            .from('ambassadors')
            .update({ status: 'withdrawn', is_active: false })
            .eq('id', ambassadorId)
            .eq('status', 'pending_confirmation');

        const { data: confirmationBill } = await _supabase
            .from('bills')
            .select('id, status')
            .eq('ambassador_id', ambassadorId)
            .in('status', ['committee', 'floor'])
            .maybeSingle();

        if (confirmationBill) {
            await _supabase
                .from('bills')
                .update({ status: 'failed' })
                .eq('id', confirmationBill.id);
        }

        const ambName = ((amb.ambassador_first_name || '') + ' ' + (amb.ambassador_last_name || '')).trim();
        alert(`Nomination withdrawn: ${ambName} to ${nationName}.`);

        diplomaticRoles = await detectDiplomaticRoles(currentFaction, currentNation, currentCoalition);
        { const _apEl = document.getElementById('diplo-ap'); if (_apEl) _apEl.textContent = (currentFaction?.action_points ?? 0) + ' AP'; };
        await renderRelationsTab();

    } catch (e) {
        console.error('Error canceling pending ambassador:', e);
        alert('Error: ' + e.message);
    }
}

// ==================== DIPLOMATIC CHAT ====================

async function renderChatSection(targetNation, roles, ourAmbassador, theirAmbassador) {
    // Determine if there's a diplomatic channel
    const hasOurAmb = ourAmbassador && ourAmbassador.status === 'active';
    const hasTheirAmb = theirAmbassador && theirAmbassador.status === 'active';

    if (!hasOurAmb && !hasTheirAmb) {
        return `
            <div class="diplo-section-title">Diplomatic Channel</div>
            <div class="diplo-chat-empty">No diplomatic channel established.<br>An ambassador must be posted to enable communication.</div>
        `;
    }

    // Can the current player send messages?
    const isAmbToTarget = roles.ambassadorTo.some(a => a.target_nation_id === targetNation.id);
    const canSend = isAmbToTarget && hasOurAmb;
    const canView = roles.isFM || roles.isHoG || isAmbToTarget;

    if (!canView) {
        return `
            <div class="diplo-section-title">Diplomatic Channel</div>
            <div class="diplo-chat-empty">Diplomatic messages are visible to the Foreign Minister, Head of Government, and Ambassadors.</div>
        `;
    }

    // Fetch messages
    let messages = [];
    try {
        const { data } = await _supabase
            .from('diplomatic_messages')
            .select('*')
            .or(
                'and(from_nation_id.eq.' + currentNation.id + ',to_nation_id.eq.' + targetNation.id + '),' +
                'and(from_nation_id.eq.' + targetNation.id + ',to_nation_id.eq.' + currentNation.id + ')'
            )
            .order('sent_at_tick', { ascending: true })
            .order('created_at', { ascending: true })
            .limit(100);
        messages = data || [];
    } catch (e) {
        console.warn('Error fetching diplomatic messages:', e);
    }

    const msgsHTML = messages.length > 0
        ? messages.map(m => {
            const isMine = m.from_nation_id === currentNation.id;
            return `
                <div class="diplo-msg ${isMine ? 'mine' : 'theirs'}">
                    <div class="diplo-msg-sender">
                        ${escapeHtml(m.sender_name || 'Unknown')}
                        <span class="role-badge" style="background:${isMine ? 'rgba(96,165,250,0.08)' : 'rgba(74,222,128,0.08)'};color:${isMine ? '#60a5fa' : '#4ade80'};border:1px solid ${isMine ? 'rgba(96,165,250,0.2)' : 'rgba(74,222,128,0.2)'};">${escapeHtml(m.sender_role || 'diplomat')}</span>
                    </div>
                    <div class="diplo-msg-text">${escapeHtml(m.message_text)}</div>
                    <div class="diplo-msg-tick">Tick ${m.sent_at_tick}</div>
                </div>`;
        }).join('')
        : '<div class="diplo-chat-empty">No messages yet. Start the conversation.</div>';

    const inputHTML = canSend ? `
        <div class="diplo-chat-input">
            <input type="text" id="diplo-msg-input" placeholder="Type a message..." maxlength="500"
                onkeydown="if(event.key==='Enter')sendDiploMessage('${targetNation.id}','${targetNation.name}')" />
            <button onclick="sendDiploMessage('${targetNation.id}','${targetNation.name}')">Send</button>
        </div>
    ` : '<div style="font-size:0.72rem;color:var(--text-dim);text-align:center;padding:6px;">View only — only ambassadors can send messages.</div>';

    return `
        <div class="diplo-section-title">Diplomatic Channel</div>
        <div class="diplo-chat-box" id="diplo-chat-box">${msgsHTML}</div>
        ${inputHTML}
    `;
}

async function sendDiploMessage(targetNationId, targetNationName) {
    const input = document.getElementById('diplo-msg-input');
    if (!input) return;
    const text = input.value.trim();
    if (!text) return;

    // Authorization: must have an active ambassador to the target nation, or be FM/HoG
    const isAmbToTarget = diplomaticRoles.ambassadorTo.some(a => a.target_nation_id === targetNationId);
    if (!isAmbToTarget && !diplomaticRoles.isFM && !diplomaticRoles.isHoG) {
        alert('You must have an active ambassador to send diplomatic messages.');
        return;
    }

    try {
        // Get current tick
        const { data: shard } = await _supabase
            .from('shard')
            .select('current_tick')
            .eq('name', 'Alpha Shard')
            .single();
        const tick = shard?.current_tick || 0;

        // Get our ambassador's last name for sender display
        const { data: amb } = await _supabase
            .from('ambassadors')
            .select('ambassador_last_name')
            .eq('nation_id', currentNation.id)
            .eq('target_nation_id', targetNationId)
            .eq('is_active', true)
            .eq('status', 'active')
            .single();

        const senderName = 'Amb. ' + (amb?.ambassador_last_name || currentFaction.faction_name);

        await _supabase.from('diplomatic_messages').insert({
            from_nation_id: currentNation.id,
            to_nation_id: targetNationId,
            from_faction_id: currentFaction.id,
            sender_role: 'ambassador',
            sender_name: senderName,
            message_text: text,
            sent_at_tick: tick
        });

        // Append message locally
        const chatBox = document.getElementById('diplo-chat-box');
        if (chatBox) {
            // Remove empty state if present
            const empty = chatBox.querySelector('.diplo-chat-empty');
            if (empty) empty.remove();

            chatBox.innerHTML += `
                <div class="diplo-msg mine">
                    <div class="diplo-msg-sender">
                        ${escapeHtml(senderName)}
                        <span class="role-badge" style="background:rgba(96,165,250,0.08);color:#60a5fa;border:1px solid rgba(96,165,250,0.2);">ambassador</span>
                    </div>
                    <div class="diplo-msg-text">${escapeHtml(text)}</div>
                    <div class="diplo-msg-tick">Tick ${tick}</div>
                </div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        input.value = '';
    } catch (e) {
        console.error('Error sending message:', e);
        alert('Failed to send message: ' + e.message);
    }
}

async function renderInitiativeWizard() {
    const panel = document.getElementById('tab-initiative');
    if (!panel) return;

    // Reset wizard state
    wizardStep = 1;
    wizardTargetNation = null;
    wizardCategory = null;
    wizardAgreementType = null;
    wizardArticles = [];
    tradeArticles = [];
    editingTradeArticle = null;
    wizardName = '';
    wizardDuration = 1;

    // Check if player has any diplomatic role that can propose
    // HoG can draft at 3 AP penalty if no ambassador exists
    // MoT can propose trade negotiations directly
    const hasAmbassador = diplomaticRoles && diplomaticRoles.ambassadorTo.length > 0;
    const canPropose = diplomaticRoles && (diplomaticRoles.isFM || diplomaticRoles.isMoT || hasAmbassador || diplomaticRoles.isHoG);
    if (!canPropose) {
        panel.innerHTML = '<p class="diplo-tab-placeholder">You need to be a Foreign Minister, Minister of Trade, Ambassador, or Head of Government to propose initiatives.</p>';

async function renderOngoingTradeNegotiations() {
    // Fetch active trade negotiations involving our nation
    const { data: negotiations } = await _supabase
        .from('trade_negotiations')
        .select('*')
        .in('status', ['open', 'active'])
        .or('nation_a_id.eq.' + currentNation.id + ',nation_b_id.eq.' + currentNation.id);

    if (!negotiations || negotiations.length === 0) return '';

    // Fetch nation names for display
    const nationIds = new Set();
    negotiations.forEach(n => { nationIds.add(n.nation_a_id); nationIds.add(n.nation_b_id); });
    const { data: nationNames } = await _supabase.from('nations').select('id, name').in('id', [...nationIds]);
    const nameMap = {};
    (nationNames || []).forEach(n => nameMap[n.id] = n.name);

    // For open negotiations where we're the recipient, fetch the associated proposals
    const openNegsWeReceived = negotiations.filter(n => {
        if (n.status !== 'open') return false;
        const participants = n.participants || [];
        return !participants.some(p => p.nation_id === currentNation.id);
    });
    let proposalMap = {}; // negotiation_id → proposal
    if (openNegsWeReceived.length > 0) {
        const { data: proposals } = await _supabase
            .from('diplomatic_proposals')
            .select('*')
            .eq('proposal_type', 'trade_negotiation')
            .eq('status', 'proposed')
            .eq('target_nation_id', currentNation.id);
        (proposals || []).forEach(p => {
            const negId = p.proposal_data?.negotiation_id;
            if (negId) proposalMap[negId] = p;
        });
    }

    let html = '<div class="diplo-section-title">Ongoing Trade Negotiations</div>';

    for (const neg of negotiations) {
        const partnerId = neg.nation_a_id === currentNation.id ? neg.nation_b_id : neg.nation_a_id;
        const partnerName = nameMap[partnerId] || 'Unknown';
        const typeInfo = neg.agreement_type && neg.agreement_type !== 'pending' ? TRADE_AGREEMENT_TYPES[neg.agreement_type] : null;
        const ticksLeft = (neg.expires_at_tick || 0) - shardTick;
        const statusClass = ticksLeft <= 0 ? 'expired' : ticksLeft <= 2 ? 'expiring' : 'active';

        // Check who has joined
        const participants = neg.participants || [];
        const participantRoles = participants.map(p => p.role).join(', ');

        // Determine if we're the recipient of an open negotiation (not yet in participants)
        const isRecipientOfOpen = neg.status === 'open' && !participants.some(p => p.nation_id === currentNation.id);
        const linkedProposal = proposalMap[neg.id];

        const negTitle = typeInfo
            ? escapeHtml(typeInfo.shortLabel) + ': ' + escapeHtml(neg.agreement_name || 'Unnamed')
            : escapeHtml(neg.agreement_name || 'Unnamed');
        const negSubtext = neg.status === 'open'
            ? (isRecipientOfOpen ? 'Awaiting your response' : 'Awaiting acceptance')
            : !typeInfo ? 'Type not yet selected'
            : participantRoles || 'Negotiating';

        // Build action area based on recipient/proposer status
        let actionHtml = '';
        if (isRecipientOfOpen && linkedProposal) {
            const apCost = DIPLOMACY_CONFIG.ACCEPT_TRADE_NEGOTIATION_AP;
            actionHtml = `
                <div class="inbox-card-actions" style="margin-top:8px;">
                    <button class="proposal-accept-btn" onclick="event.stopPropagation(); acceptTradeNegotiation('${linkedProposal.id}', '${neg.id}')">Begin Negotiations (${apCost} AP)</button>
                    <button class="proposal-reject-btn" onclick="event.stopPropagation(); rejectTradeNegotiation('${linkedProposal.id}', '${neg.id}')">Reject</button>
                </div>
            `;
        }

        html += `
            <div class="trade-neg-status ${isRecipientOfOpen ? 'requires-action' : ''}" style="cursor:pointer;${isRecipientOfOpen ? 'flex-wrap:wrap;' : ''}" onclick="openTradeNegotiation('${neg.id}')">
                <div>
                    <div style="font-size:0.85rem;font-weight:bold;color:var(--text-primary);">
                        ${negTitle}
                    </div>
                    <div style="font-size:0.7rem;color:var(--text-muted);margin-top:2px;">
                        with ${escapeHtml(partnerName)} &middot; ${negSubtext}
                    </div>
                </div>
                <div>
                    <div class="trade-neg-status-value ${statusClass}">
                        ${neg.status === 'open' ? 'PENDING' : ticksLeft + ' ticks left'}
                    </div>
                    <div style="font-size:0.62rem;color:var(--text-dim);text-align:right;">
                        ${neg.status === 'active' ? '[OPEN NEGOTIATIONS]' : (isRecipientOfOpen ? '' : '[VIEW]')}
                    </div>
                </div>
                ${actionHtml}
            </div>
        `;
    }

    return html;
}

function buildWizardShell() {
    return `
        <div class="diplo-section-title" style="margin-top:16px;">New Initiative</div>
        <div class="wizard-steps">
            <div class="wizard-step active" id="wizard-step-ind-1">
                <span class="wizard-step-num">1</span> Nation
            </div>
            <div class="wizard-step" id="wizard-step-ind-2">
                <span class="wizard-step-num">2</span> Category
            </div>
            <div class="wizard-step" id="wizard-step-ind-3">
                <span class="wizard-step-num">3</span> Details
            </div>
        </div>
        <div id="wizard-panel-1" class="wizard-panel active"></div>
        <div id="wizard-panel-2" class="wizard-panel"></div>
        <div id="wizard-panel-3" class="wizard-panel"></div>
    `;
}

function updateWizardStepIndicators(step) {
    for (let i = 1; i <= 3; i++) {
        const el = document.getElementById('wizard-step-ind-' + i);
        if (!el) continue;
        el.classList.remove('active', 'completed');
        if (i < step) el.classList.add('completed');
        if (i === step) el.classList.add('active');
    }
    for (let i = 1; i <= 3; i++) {
        const p = document.getElementById('wizard-panel-' + i);
        if (!p) continue;
        p.classList.toggle('active', i === step);
    }
}

async function renderWizardStep1() {
    const panel = document.getElementById('wizard-panel-1');
    if (!panel) return;

    panel.innerHTML = '<p style="color:#6b6a5e;font-style:italic;font-size:0.82rem;">Loading nations...</p>';

    // Fetch nations we have ambassadors to (with active counterpart ambassadors)
    const ambNationIds = diplomaticRoles.ambassadorTo.map(a => a.target_nation_id);
    const hasAmbassador = ambNationIds.length > 0;

    // Also fetch ALL other nations for HoG fallback
    const { data: allNations } = await _supabase.from('nations').select('id, name').neq('id', currentNation.id);

    let theirAmbs = [];
    if (hasAmbassador) {
        const { data } = await _supabase.from('ambassadors').select('nation_id, target_nation_id, status, is_active')
            .eq('target_nation_id', currentNation.id)
            .eq('is_active', true)
            .eq('status', 'active')
            .in('nation_id', ambNationIds);
        theirAmbs = data || [];
    }
    const nationsWithCounterAmb = new Set(theirAmbs.map(a => a.nation_id));

    // Determine AP cost
    const isHoGOnly = diplomaticRoles.isHoG && !hasAmbassador && !diplomaticRoles.isMoT && !diplomaticRoles.isFM;
    const isMoTOnly = diplomaticRoles.isMoT && !hasAmbassador && !diplomaticRoles.isHoG;
    const isFMOnly = diplomaticRoles.isFM && !hasAmbassador && !diplomaticRoles.isMoT && !diplomaticRoles.isHoG;
    const canSelectAny = isHoGOnly || isMoTOnly || isFMOnly; // HoG, MoT, or FM can select any nation
    const apCost = isHoGOnly ? DIPLOMACY_CONFIG.HOG_DRAFT_INITIATIVE_AP : DIPLOMACY_CONFIG.PROPOSE_TRADE_NEGOTIATION_AP;

    let html = '';
    if (isHoGOnly) {
        html += '<div class="trade-info-box warning" style="margin-bottom:12px;">No Trade Minister, Foreign Minister, or ambassador appointed. As Head of Government, you can propose at a higher AP cost (' + apCost + ' AP instead of ' + DIPLOMACY_CONFIG.PROPOSE_TRADE_NEGOTIATION_AP + ' AP).</div>';
    }
    if (isMoTOnly) {
        html += '<div class="trade-info-box info" style="margin-bottom:12px;">As Minister of Trade, you can propose trade negotiations to any nation. Diplomatic initiatives still require an ambassador.</div>';
    }
    if (isFMOnly) {
        html += '<div class="trade-info-box info" style="margin-bottom:12px;">As Foreign Minister, you can propose trade negotiations to any nation. Diplomatic initiatives still require an ambassador.</div>';
    }
    html += '<p style="font-size:0.78rem;color:var(--text-muted);margin-bottom:12px;">Select a nation to negotiate with. Trade Ministers, Ambassadors, Foreign Ministers, and Heads of Government can initiate trade talks.</p>';

    const nations = allNations || [];
    for (const nation of nations) {
        const weHaveAmb = ambNationIds.includes(nation.id);
        const hasCounter = nationsWithCounterAmb.has(nation.id);
        const mutualAmbs = weHaveAmb && hasCounter;
        const canSelect = mutualAmbs || canSelectAny;
        const flagUrl = FLAG_URLS[nation.name] || null;
        const ambInfo = diplomaticRoles.ambassadorTo.find(a => a.target_nation_id === nation.id);
        const ambName = ambInfo ? ((ambInfo.ambassador_first_name || '') + ' ' + (ambInfo.ambassador_last_name || '')).trim() : '';
        const ambPartyInit = ambInfo?.factions?.abbreviation ? ' (' + ambInfo.factions.abbreviation + ')' : '';

        let statusNote = '';
        if (!weHaveAmb && !canSelectAny) statusNote = '<span style="color:#f97316;">No ambassador posted</span>';
        else if (weHaveAmb && !hasCounter) statusNote = '<span style="color:#f97316;">No counterpart ambassador</span>';

        const roleLabel = ambName ? 'Your Amb: ' + escapeHtml(ambName + ambPartyInit) : isHoGOnly ? 'Drafting as HoG' : isMoTOnly ? 'Drafting as Min. of Trade' : isFMOnly ? 'Drafting as FM' : 'No ambassador';

        html += `
            <div class="wizard-nation-item ${canSelect ? '' : 'disabled'}" data-nation-id="${nation.id}" onclick="wizardSelectNation('${nation.id}')">
                ${flagUrl ? '<img src="' + flagUrl + '" class="nation-card-flag" />' : '<div class="nation-card-flag-placeholder"></div>'}
                <div>
                    <div class="wizard-nation-name">${escapeHtml(nation.name)}</div>
                    <div class="wizard-nation-detail">
                        ${roleLabel}
                        ${statusNote ? ' &middot; ' + statusNote : ''}
                    </div>
                </div>
            </div>
        `;
    }

    html += '<div class="wizard-nav"><button class="wizard-next-btn" id="wizard-next-1" disabled onclick="wizardGoToStep2()">Next</button></div>';
    panel.innerHTML = html;
}

function wizardSelectNation(nationId) {
    document.querySelectorAll('.wizard-nation-item').forEach(el => el.classList.remove('selected'));
    const item = document.querySelector('.wizard-nation-item[data-nation-id="' + nationId + '"]');
    if (item && !item.classList.contains('disabled')) {
        item.classList.add('selected');
        wizardTargetNation = nationId;
        const btn = document.getElementById('wizard-next-1');
        if (btn) btn.disabled = false;
    }
}

async function wizardGoToStep2() {

}

function wizardSelectCategory(category) {
    // MoT-only players cannot select diplomatic initiatives
    if (category === 'diplomatic') {
        const hasAmbassador = diplomaticRoles && diplomaticRoles.ambassadorTo.length > 0;
        const isMoTOnly = diplomaticRoles.isMoT && !hasAmbassador && !diplomaticRoles.isFM && !diplomaticRoles.isHoG;
        if (isMoTOnly) return;
    }

    document.querySelectorAll('#wizard-panel-2 .type-card').forEach(el => el.classList.remove('selected'));
    const card = document.querySelector('#wizard-panel-2 .type-card[data-category="' + category + '"]');
    if (card) {
        card.classList.add('selected');
        wizardCategory = category;
        const btn = document.getElementById('wizard-next-2');
        if (btn) btn.disabled = false;
    }
}

function wizardBackToStep1() {
    wizardStep = 1;
    wizardCategory = null;
    wizardAgreementType = null;
    updateWizardStepIndicators(1);
}

async function wizardGoToStep3() {
    if (!wizardCategory) return;

    // Block MoT-only players from the diplomatic initiative path
    if (wizardCategory === 'diplomatic') {
        const hasAmbassador = diplomaticRoles && diplomaticRoles.ambassadorTo.length > 0;
        const isMoTOnly = diplomaticRoles.isMoT && !hasAmbassador && !diplomaticRoles.isFM && !diplomaticRoles.isHoG;
        if (isMoTOnly) {
            alert('The Minister of Trade can only propose Trade Agreements, not Diplomatic Initiatives.');
            return;
        }
    }

    wizardStep = 3;
    updateWizardStepIndicators(3);
    if (wizardCategory === 'diplomatic') {
        await renderWizardStep3Diplomatic();
    } else if (wizardCategory === 'economic_aid') {
        // Economic aid skips type selection — go straight to proposal with pre-set type
        wizardAgreementType = 'economic_aid';
        await renderWizardStep3AidProposal();
    } else if (wizardCategory === 'unilateral') {
        wizardAgreementType = 'retaliatory_tariff';
        await renderWizardStep3Unilateral();
    } else {
        await renderWizardStep3TradeProposal();
    }
}

async function renderWizardStep3Diplomatic() {
    const panel = document.getElementById('wizard-panel-3');
    if (!panel) return;

    panel.innerHTML = '<p style="color:#6b6a5e;font-style:italic;font-size:0.82rem;">Loading...</p>';

    // Fetch existing active/pending agreements between these nations to disable used types
    const usedTypes = new Set();
    try {
        const { data: existing } = await _supabase
            .from('diplomatic_proposals')
            .select('proposal_data, status')
            .eq('proposal_type', 'diplomatic_initiative')
            .in('status', ['proposed', 'revised', 'active'])
            .or(
                'and(proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + wizardTargetNation + '),' +
                'and(proposing_nation_id.eq.' + wizardTargetNation + ',target_nation_id.eq.' + currentNation.id + ')'
            );
        if (existing) {
            for (const prop of existing) {
                const agType = prop.proposal_data?.agreement_type;
                if (agType) usedTypes.add(agType);
                const arts = prop.proposal_data?.articles || [];
                const struck = new Set(prop.proposal_data?.struck_articles || []);
                arts.forEach((art, i) => {
                    if (prop.status === 'active' && struck.has(i)) return;
                    if (art.type) usedTypes.add(art.type);
                });
            }
        }
    } catch (e) { console.warn('Error checking existing agreements:', e); }

    let html = '<p style="font-size:0.78rem;color:var(--text-muted);margin-bottom:12px;">Choose the type of diplomatic initiative.</p>';
    html += '<div class="type-card-grid">';

    for (const [key, info] of Object.entries(INITIATIVE_TYPES)) {
        const isUsed = usedTypes.has(key);
        const classBadge = '<span class="classification-badge classification-' + info.classification.toLowerCase() + '">' + info.classification + '</span>';
        const relStr = info.relations > 0 ? '+' + info.relations + ' Rel' : info.relations < 0 ? info.relations + ' Rel' : '';
        const moneyStr = info.money > 0 ? '+$' + (info.money / 1e6).toFixed(0) + 'M' : info.money < 0 ? '-$' + (Math.abs(info.money) / 1e6).toFixed(0) + 'M' : '';

        html += `
            <div class="type-card ${isUsed ? 'disabled' : ''}" data-type-key="${key}" onclick="wizardSelectDiploType('${key}')">
                <div class="type-card-title">${escapeHtml(info.label)} ${classBadge}</div>
                <div class="type-card-desc">${escapeHtml(info.description)}</div>
                <div class="type-card-effects">
                    ${relStr ? '<span class="effect-tag effect-rel">' + relStr + '</span>' : ''}
                    ${moneyStr ? '<span class="effect-tag effect-money">' + moneyStr + '</span>' : ''}
                    ${!relStr && !moneyStr ? '<span class="effect-tag" style="background:var(--bg-hover);color:var(--text-muted);">No effects</span>' : ''}
                </div>
                ${isUsed ? '<div class="type-card-already">Already active or pending</div>' : ''}
            </div>
        `;
    }

    html += '</div>';
    html += '<div id="diplo-draft-section"></div>';
    html += `<div class="wizard-nav">
        <button class="wizard-back-btn" onclick="wizardBackToStep2()">Back</button>
    </div>`;

    panel.innerHTML = html;
}

    const card = document.querySelector('#wizard-panel-3 .type-card[data-type-key="' + typeKey + '"]');

var wizardTradeAgreementType = null;  // selected trade agreement type key
var counterTradeArticles = [];  // articles added during counter-proposal

async function renderWizardStep3TradeProposal() {
    const panel = document.getElementById('wizard-panel-3');
    if (!panel) return;

    panel.innerHTML = '<p style="color:#6b6a5e;font-style:italic;font-size:0.82rem;">Loading...</p>';

        .from('diplomatic_proposals')
        .select('id, status, proposal_data')
        .eq('proposal_type', 'trade_agreement')
        .in('status', ['proposed', 'revised', 'fm_review', 'ratification'])
        .or('proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + currentNation.id);

    const existingWithTarget = (existingProposals || []).filter(p => {
        const pd = p.proposal_data || {};

            <div class="trade-info-box warning">

            </div>
            <div class="wizard-nav" style="margin-top:12px;">
                <button class="wizard-back-btn" onclick="wizardBackToStep2()">Back</button>
            </div>

    }

    const ourAmb = diplomaticRoles.ambassadorTo.find(a => a.target_nation_id === wizardTargetNation);

    // Agreement type selected — show article drafting

    let html = `

    // Show existing articles

            const artLabel = artTypeInfo?.label || art.type;
            const artDesc = artTypeInfo?.description || '';
            const isRequired = (typeInfo.required_articles || []).includes(art.type);
            html += `
                <div class="draft-article">
                    <div class="draft-article-type">
                        <span>Art. ${toRoman(i + 1)} — ${escapeHtml(artLabel)} ${isRequired ? '<span class="badge badge--teal" style="margin-left:4px;">Required</span>' : '<span class="badge badge--dim" style="margin-left:4px;">Optional</span>'}</span>
                        <span class="draft-article-remove" onclick="removeWizardTradeArticle(${i})">Remove</span>
                    </div>
                    <div class="draft-article-title" style="font-size:0.75rem;">${summary}</div>
                    <div class="draft-article-body">${escapeHtml(artDesc)}</div>
                </div>`;
        }
        html += '</div>';
    }

    // Add article dropdown
    if (availableTypes.length > 0) {
        html += `
            <div style="margin-top:12px;display:flex;gap:8px;align-items:center;">
                <select id="wizard-trade-article-type" style="font-size:0.75rem;padding:4px 8px;background:var(--bg-1);color:var(--text-primary);border:1px solid var(--border-hair);border-radius:3px;">
                    <option value="">Add article...</option>
                    ${availableTypes.map(t => '<option value="' + t.key + '">' + escapeHtml(t.label) + (t.required ? ' (required)' : '') + '</option>').join('')}
                </select>
                <button class="wizard-next-btn" style="font-size:0.72rem;padding:4px 12px;" onclick="showWizardTradeArticleEditor()">Add</button>
            </div>
            <div id="wizard-trade-article-editor"></div>`;
    }

    // Required articles check
    if (!hasRequired) {
        const missing = (typeInfo.required_articles || []).filter(req => !tradeArticles.some(a => a.type === req));
        const missingLabels = missing.map(m => TRADE_ARTICLE_TYPES[m]?.label || m).join(', ');
        html += `<div class="trade-info-box warning" style="margin-top:12px;">Required articles missing: ${escapeHtml(missingLabels)}</div>`;
    }

    html += `
            <div style="font-size:0.75rem;color:var(--text-muted);margin-top:14px;line-height:1.5;">
                <strong>What happens next:</strong><br/>
                1. You send the complete proposal with articles (${apCost} AP)<br/>
                2. ${escapeHtml(targetName)} reviews the articles<br/>
                3. They can accept, reject, or counter (strike/add articles)<br/>
                4. If countered, you review their changes and accept or reject
            </div>
        </div>

        <div class="wizard-nav" style="margin-top:12px;">
            <button class="wizard-back-btn" onclick="wizardTradeAgreementType=null;tradeArticles=[];renderWizardStep3TradeProposal()">Back (Change Type)</button>
            <button class="wizard-next-btn" id="trade-propose-btn" ${hasRequired ? '' : 'disabled'} onclick="submitTradeProposal()">
                Send Trade Proposal (${apCost} AP)
            </button>
        </div>`;

    panel.innerHTML = html;
}

function selectTradeAgreementType(typeKey) {
    wizardTradeAgreementType = typeKey;
    tradeArticles = [];
    wizardName = '';
    renderWizardStep3TradeProposal();
}

function showWizardTradeArticleEditor() {
    const select = document.getElementById('wizard-trade-article-type');
    const articleType = select?.value;
    if (!articleType) { alert('Select an article type first.'); return; }
    const container = document.getElementById('wizard-trade-article-editor');
    if (!container) return;
    renderTradeArticleEditorLocal(container, articleType);
}

function renderTradeArticleEditorLocal(container, articleType) {
    const artTypeInfo = TRADE_ARTICLE_TYPES[articleType];
    if (!artTypeInfo) return;

    let html = '<div class="trade-article-builder" style="margin-top:10px;border-color:var(--accent);">';
    html += '<div class="trade-article-header"><span class="trade-article-title">New: ' + escapeHtml(artTypeInfo.label) + '</span></div>';

    switch (articleType) {
        case 'duration': html += renderDurationEditor(); break;
        case 'sector_exemption': html += renderSectorExemptionEditor(); break;
        case 'tariff_reduction': html += renderTariffReductionEditor(); break;
        case 'supply_commitment': html += renderSupplyCommitmentEditor(); break;
        case 'price_terms': html += renderPriceTermsEditor(); break;
        case 'breach_penalty': html += renderBreachPenaltyEditor(); break;
        case 'subsidized_sector': html += renderSubsidizedSectorEditor(); break;
        case 'funding_source': html += renderFundingSourceEditor(); break;
        case 'text_article': html += renderTextArticleEditor(); break;
        case 'aid_terms': html += renderAidTermsEditor(); break;
        case 'aid_condition': html += renderAidConditionEditor(); break;
        case 'tariff_surcharge': html += renderTariffSurchargeEditor(); break;
    }

    html += `
        <div style="display:flex;gap:8px;margin-top:12px;">

    html += '</div>';

function saveWizardTradeArticle(articleType) {
    let articleData = {};

    switch (articleType) {
        case 'duration': {
            const durType = document.querySelector('input[name="dur-type"]:checked')?.value || 'fixed';
            const ticks = Math.min(240, Math.max(4, parseInt(document.getElementById('dur-ticks')?.value || '12')));
            const autoRenew = document.getElementById('dur-autorenew')?.checked || false;
            const withdrawal = Math.min(6, Math.max(1, parseInt(document.getElementById('dur-withdrawal')?.value || '3')));
            articleData = { duration_type: durType, duration_ticks: durType === 'fixed' ? ticks : null, auto_renew: autoRenew, withdrawal_notice_ticks: withdrawal };
            break;
        }
        case 'sector_exemption': {
            const sector = document.getElementById('exempt-sector')?.value;
            const reason = document.getElementById('exempt-reason')?.value?.trim() || '';
            if (!sector) { alert('Please select a sector.'); return; }
            articleData = { sector, reason };
            break;
        }
        case 'tariff_reduction': {
            const sector = document.getElementById('tariff-sector')?.value;
            const direction = document.querySelector('input[name="tariff-dir"]:checked')?.value || 'mutual';
            const pct = Math.min(100, Math.max(0, parseInt(document.getElementById('tariff-pct')?.value || '50')));
            if (!sector) { alert('Please select a sector.'); return; }
            articleData = { sector, direction, reduction_pct: pct, author_nation_id: currentNation.id };
            break;
        }
        case 'supply_commitment': {
            const sector = document.getElementById('supply-sector')?.value;
            const direction = document.querySelector('input[name="supply-dir"]:checked')?.value || 'we_buy';
            const pct = Math.min(90, Math.max(10, parseInt(document.getElementById('supply-pct')?.value || '60')));
            if (!sector) { alert('Please select a resource.'); return; }
            articleData = { sector, direction, commitment_pct: pct, author_nation_id: currentNation.id };
            break;
        }
        case 'price_terms': {
            const priceType = document.querySelector('input[name="price-type"]:checked')?.value || 'market';
            const modifier = Math.min(25, Math.max(0, parseInt(document.getElementById('price-modifier')?.value || '10')));
            articleData = { price_type: priceType, modifier_pct: (priceType === 'discounted' || priceType === 'premium') ? modifier : 0 };
            break;
        }
        case 'breach_penalty': {
            articleData = {
                relations_penalty: Math.min(8, Math.max(1, parseInt(document.getElementById('breach-relations')?.value || '5'))),
                reputation_penalty: Math.min(4, Math.max(0, parseInt(document.getElementById('breach-reputation')?.value || '2'))),
                financial_penalty: Math.min(500, Math.max(0, parseInt(document.getElementById('breach-financial')?.value || '200')))
            };
            break;
        }
        case 'subsidized_sector': {
            const sector = document.getElementById('subsidy-sector')?.value;
            const pct = Math.min(30, Math.max(5, parseInt(document.getElementById('subsidy-pct')?.value || '15')));
            if (!sector) { alert('Please select a sector.'); return; }
            articleData = { sector, subsidy_pct: pct, author_nation_id: currentNation.id };
            break;
        }
        case 'funding_source': {
            const source = document.querySelector('input[name="fund-source"]:checked')?.value || 'general_treasury';
            articleData = { source };
            break;
        }
        case 'text_article': {
            const title = document.getElementById('text-art-title')?.value?.trim() || '';
            const body = document.getElementById('text-art-body')?.value?.trim() || '';
            if (!body) { alert('Please enter article body text.'); return; }
            articleData = { title, body };
            break;
        }
        case 'aid_terms': {
            const amount = Number(document.getElementById('aid-amount')?.value || 0);
            const gdpCap = Math.min(25, Math.max(1, parseInt(document.getElementById('aid-gdp-cap')?.value || '10')));
            if (amount < DIPLOMACY_CONFIG.AID_MIN_AMOUNT) {
                alert('Minimum aid amount is $' + (DIPLOMACY_CONFIG.AID_MIN_AMOUNT / 1e9).toFixed(0) + 'B.');
                return;
            }
            articleData = { donor_nation_id: currentNation.id, annual_amount: amount, gdp_cap_pct: gdpCap };
            break;
        }
        case 'aid_condition': {
            const statKey = document.getElementById('cond-stat')?.value;
            const operator = document.querySelector('input[name="cond-op"]:checked')?.value || 'gte';
            const threshold = Math.min(100, Math.max(0, parseInt(document.getElementById('cond-threshold')?.value || '50')));
            const onFailure = document.querySelector('input[name="cond-fail"]:checked')?.value || 'suspend';
            const grace = Math.min(2, Math.max(0, parseInt(document.getElementById('cond-grace')?.value || '1')));
            if (!statKey) { alert('Please select a stat to monitor.'); return; }
            const existingConditions = tradeArticles.filter(a => a.type === 'aid_condition');
            if (existingConditions.length >= DIPLOMACY_CONFIG.AID_MAX_CONDITIONS) {
                alert('Maximum ' + DIPLOMACY_CONFIG.AID_MAX_CONDITIONS + ' conditions per agreement.');
                return;
            }
            articleData = { stat_key: statKey, operator, threshold, on_failure: onFailure, grace_periods: grace };
            break;
        }
        case 'tariff_surcharge': {
            const sector = document.getElementById('surcharge-sector')?.value;
            const pct = Math.min(50, Math.max(5, parseInt(document.getElementById('surcharge-pct')?.value || '25')));
            if (!sector) { alert('Please select a sector.'); return; }
            articleData = { sector, surcharge_pct: pct, imposer_nation_id: currentNation.id };
            break;
        }
    }

    // Add to local state
    const artDef = TRADE_ARTICLE_TYPES[articleType];
    if (artDef && !artDef.repeatable) {
        const existingIdx = tradeArticles.findIndex(a => a.type === articleType);
        if (existingIdx >= 0) {
            tradeArticles[existingIdx] = { type: articleType, data: articleData };
        } else {
            tradeArticles.push({ type: articleType, data: articleData });
        }
    } else {
        tradeArticles.push({ type: articleType, data: articleData });
    }

    // Re-render the appropriate view
    if (draftTradeMode) {
        reRenderTradeDraft();
    } else {
        renderWizardStep3TradeProposal();
    }
}

function removeWizardTradeArticle(index) {
    tradeArticles.splice(index, 1);
    renderWizardStep3TradeProposal();
}

// ==================== STEP 3C: PROPOSE ECONOMIC AID NEGOTIATIONS ====================
async function renderWizardStep3AidProposal() {
    const panel = document.getElementById('wizard-panel-3');

    panel.innerHTML = '<p style="color:#6b6a5e;font-style:italic;font-size:0.82rem;">Loading...</p>';

    const bId = currentNation.id < wizardTargetNation ? wizardTargetNation : currentNation.id;
    const { data: existingNegs } = await _supabase
        .from('trade_negotiations')
        .select('id, status, agreement_name, agreement_type')
        .in('status', ['open', 'active'])
        .eq('nation_a_id', aId)
        .eq('nation_b_id', bId)
        .eq('agreement_type', 'economic_aid');

    if (existingNegs && existingNegs.length > 0) {
        panel.innerHTML = `
            <div class="trade-info-box warning">
                You already have active aid negotiations with ${escapeHtml(targetName)}. Open the existing negotiation from the list above.
            </div>

                <button class="wizard-back-btn" onclick="wizardBackToStep2()">Back</button>
            </div>
        `;
        return;
    }

    const ourAmb = diplomaticRoles.ambassadorTo.find(a => a.target_nation_id === wizardTargetNation);
    const isHoGOnly = diplomaticRoles.isHoG && !ourAmb && !diplomaticRoles.isFM && !diplomaticRoles.isMoT;
    const apCost = isHoGOnly ? DIPLOMACY_CONFIG.HOG_DRAFT_INITIATIVE_AP : DIPLOMACY_CONFIG.PROPOSE_TRADE_NEGOTIATION_AP;

    let html = `
        <div class="trade-article-builder">
            <div class="trade-article-header">
                <span class="trade-article-title" style="color:#4caf50;">Propose Economic Aid Agreement</span>
            </div>

            <p style="font-size:0.78rem;color:var(--text-muted);line-height:1.5;margin-bottom:14px;">
                Open negotiations for economic aid with ${escapeHtml(targetName)}. Choose whether you are offering or requesting aid.
                Once open, both sides can negotiate the amount, duration, and conditions.
            </p>

            <div class="trade-field">
                <label>Agreement Name</label>
                <input type="text" id="aid-neg-name" placeholder="e.g. ${escapeHtml(currentNation.name)} Aid Package for ${escapeHtml(targetName)}" maxlength="120" />
            </div>

            <div class="trade-field" style="margin-top:12px;">
                <label>Direction</label>
                <div class="type-card-grid" style="gap:8px;">
                    <div class="type-card" id="aid-dir-offer" style="padding:10px;cursor:pointer;" onclick="selectAidDirection('offer')">
                        <div class="type-card-title" style="font-size:0.82rem;color:#4caf50;">Offering Aid</div>
                        <div class="type-card-desc" style="font-size:0.72rem;">We provide financial assistance to ${escapeHtml(targetName)}</div>
                    </div>

                        <div class="type-card-title" style="font-size:0.82rem;color:#2196f3;">Requesting Aid</div>
                        <div class="type-card-desc" style="font-size:0.72rem;">${escapeHtml(targetName)} provides financial assistance to us</div>
                    </div>
                </div>
            </div>

            <div style="font-size:0.78rem;color:var(--text-muted);margin:12px 0;line-height:1.6;">

var wizardAidDirection = null;

function selectAidDirection(direction) {
    wizardAidDirection = direction;
    // Toggle card selection
    const offerCard = document.getElementById('aid-dir-offer');
    const requestCard = document.getElementById('aid-dir-request');
    if (offerCard) offerCard.classList.toggle('selected', direction === 'offer');
    if (requestCard) requestCard.classList.toggle('selected', direction === 'request');
    // Enable the propose button
    const btn = document.getElementById('aid-propose-btn');
    if (btn) btn.disabled = false;
}

async function submitAidProposal() {
    if (!wizardAidDirection) return;
    const btn = document.getElementById('aid-propose-btn');
    if (btn) btn.disabled = true;

    const nameInput = document.getElementById('aid-neg-name');
    const agreementName = (nameInput?.value || '').trim() || 'Economic Aid Negotiations';

    const ourAmb = diplomaticRoles.ambassadorTo.find(a => a.target_nation_id === wizardTargetNation);
    const isHoGOnly = diplomaticRoles.isHoG && !ourAmb && !diplomaticRoles.isFM && !diplomaticRoles.isMoT;
    const apCost = isHoGOnly ? DIPLOMACY_CONFIG.HOG_DRAFT_INITIATIVE_AP : DIPLOMACY_CONFIG.PROPOSE_TRADE_NEGOTIATION_AP;

    // Deduct AP
    const apResult = await deductAP(_supabase, currentFaction.id, apCost);
    if (!apResult.success) {
        alert('Not enough AP (' + apCost + ' needed). Current AP: ' + (currentFaction.action_points || 0));
        if (btn) btn.disabled = false;
        return;
    }

    // Determine role
    let myRole = 'ambassador';
    if (diplomaticRoles.isFM) myRole = 'foreign_minister';
    if (diplomaticRoles.isHoG) myRole = 'prime_minister';

    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const currentTick = shard?.current_tick || 0;

    // Canonical ordering
    const aId = currentNation.id < wizardTargetNation ? currentNation.id : wizardTargetNation;
    const bId = currentNation.id < wizardTargetNation ? wizardTargetNation : currentNation.id;

    // Determine donor based on direction selection
    const donorNationId = wizardAidDirection === 'offer' ? currentNation.id : wizardTargetNation;

    // Create the trade_negotiations row with type pre-set to economic_aid
    const { data: neg, error: negErr } = await _supabase.from('trade_negotiations').insert({
        nation_a_id: aId,
        nation_b_id: bId,
        agreement_type: 'economic_aid',
        status: 'open',
        participants: [{ faction_id: currentFaction.id, role: myRole, joined_at_tick: currentTick, nation_id: currentNation.id }],
        draft_articles: [{
            type: 'aid_terms',
            data: { donor_nation_id: donorNationId, annual_amount: 0, gdp_cap_pct: 10 }
        }],
        agreement_name: agreementName,
        expires_at_tick: currentTick + DIPLOMACY_CONFIG.NEGOTIATION_DEFAULT_DURATION,
        opened_at_tick: currentTick
    }).select('id').single();

    if (negErr) {
        console.error('Error creating aid negotiation:', negErr);
        alert('Failed to create negotiation: ' + negErr.message);
        if (btn) btn.disabled = false;
        return;
    }

    // Create the diplomatic proposal so the target nation sees it in their inbox
    const { error: proposalErr } = await _supabase.from('diplomatic_proposals').insert({
        proposing_nation_id: currentNation.id,
        target_nation_id: wizardTargetNation,
        proposed_by_faction_id: currentFaction.id,
        proposal_type: 'trade_negotiation',
        proposal_tier: 1,
        status: 'proposed',
        proposal_data: {
            name: agreementName,
            negotiation_id: neg.id,
            proposer_nation_name: currentNation.name,
            target_nation_name: (await _supabase.from('nations').select('name').eq('id', wizardTargetNation).single()).data?.name || '',
            expires_at_tick: currentTick + DIPLOMACY_CONFIG.NEGOTIATION_DEFAULT_DURATION,
            agreement_type: 'economic_aid',
            aid_direction: wizardAidDirection,
            donor_nation_id: donorNationId
        },
        proposed_at_tick: currentTick
    });
    if (proposalErr) { alert('Error creating proposal: ' + proposalErr.message); return; }

    // Fire event
    try {
        await _supabase.rpc('fire_system_event', {
            p_trigger_key: 'trade_negotiation_proposed',
            p_nation_id: currentNation.id,
            p_tick: currentTick,
            p_placeholders: { nation: currentNation.name, agreement_name: agreementName, target_nation: '' }
        });
    } catch (e) { /* non-blocking */ }

    // Redirect to the negotiation
    alert('Aid negotiation proposed! Awaiting acceptance from ' + ((await _supabase.from('nations').select('name').eq('id', wizardTargetNation).single()).data?.name || 'the target nation') + '.');
    openTradeNegotiation(neg.id);
}

                        </div>
                    </label>
                    <label class="trade-radio-option" onclick="this.querySelector('input').checked=true;toggleRTDuration()">
                        <input type="radio" name="rt-dur-type" value="permanent" />
                        <div>
                            <div class="trade-radio-label">Until Revoked</div>
                            <div class="trade-radio-hint">Stays active until you withdraw</div>
                        </div>
                    </label>
                </div>
                <div id="rt-dur-fixed-fields">
                    <input type="number" id="rt-dur-ticks" value="12" min="4" max="48" style="width:80px;" />
                    <span style="font-size:0.72rem;color:var(--text-dim);margin-left:4px;">ticks (min 4, max 48)</span>
                </div>
            </div>

            <div id="rt-summary" class="trade-info-box warning" style="margin-top:12px;">
                Select sectors to see the impact summary.
            </div>

            <div style="font-size:0.78rem;color:var(--text-muted);margin:12px 0;line-height:1.6;">
                <strong>What happens:</strong><br/>
                1. You submit this action (${apCost} AP)<br/>
                2. A ratification bill goes to YOUR parliament only<br/>
                3. If ratified, the surcharge takes effect immediately<br/>
                4. Diplomatic relations with ${escapeHtml(targetName)} decrease<br/>
                5. You earn tariff revenue on affected imports
            </div>
        </div>

        <div class="wizard-nav" style="margin-top:12px;">
            <button class="wizard-back-btn" onclick="wizardBackToStep2()">Back</button>
            <button class="wizard-next-btn" id="rt-submit-btn" disabled onclick="submitRetaliatory()">
                Submit for Ratification (${apCost} AP)
            </button>
        </div>
    `;

    panel.innerHTML = html;
}

function toggleRTDuration() {
    const isPermanent = document.querySelector('input[name="rt-dur-type"][value="permanent"]')?.checked;
    const fields = document.getElementById('rt-dur-fixed-fields');
    if (fields) fields.style.display = isPermanent ? 'none' : 'block';
}

function updateRetaliatorySummary() {
    const pct = parseInt(document.getElementById('rt-pct')?.value || '25');
    document.getElementById('rt-pct-display').textContent = pct + '%';

    const checked = document.querySelectorAll('input[name="rt-sector"]:checked');
    const sectorCount = checked.length;
    const relPenalty = Math.round(pct / 2);

    const summary = document.getElementById('rt-summary');
    const btn = document.getElementById('rt-submit-btn');

    if (sectorCount === 0) {
        if (summary) { summary.className = 'trade-info-box info'; summary.textContent = 'Select sectors to see the impact summary.'; }
        if (btn) btn.disabled = true;
        return;
    }

    if (btn) btn.disabled = false;

    const sectorNames = [];
    checked.forEach(cb => {
        const s = TRADEABLE_SECTORS.find(ts => ts.key === cb.value);
        if (s) sectorNames.push(s.label);
    });

    let severity = 'warning';
    if (pct >= 35) severity = 'danger';
    else if (pct <= 15) severity = 'info';

    if (summary) {
        summary.className = 'trade-info-box ' + severity;
        summary.innerHTML = '<strong>+' + pct + '% surcharge</strong> on ' + sectorNames.join(', ') +
            ' imports.<br/>Diplomatic impact: <strong>-' + relPenalty + ' Relations</strong> with target nation.';
    }
}

async function submitRetaliatory() {
    const btn = document.getElementById('rt-submit-btn');
    if (btn) btn.disabled = true;

    const checked = document.querySelectorAll('input[name="rt-sector"]:checked');
    if (checked.length === 0) { alert('Select at least one sector.'); if (btn) btn.disabled = false; return; }

    const pct = Math.min(50, Math.max(5, parseInt(document.getElementById('rt-pct')?.value || '25')));
    const nameInput = document.getElementById('rt-name');
    const agreementName = (nameInput?.value || '').trim() || 'Retaliatory Tariff';

    const durType = document.querySelector('input[name="rt-dur-type"]:checked')?.value || 'fixed';
    const durTicks = durType === 'fixed' ? Math.min(48, Math.max(4, parseInt(document.getElementById('rt-dur-ticks')?.value || '12'))) : null;

    const ourAmb = diplomaticRoles.ambassadorTo.find(a => a.target_nation_id === wizardTargetNation);
    const isHoGOnly = diplomaticRoles.isHoG && !ourAmb && !diplomaticRoles.isFM && !diplomaticRoles.isMoT;
    const apCost = isHoGOnly ? DIPLOMACY_CONFIG.HOG_DRAFT_INITIATIVE_AP : DIPLOMACY_CONFIG.PROPOSE_TRADE_NEGOTIATION_AP;

    // Deduct AP
    const apResult = await deductAP(_supabase, currentFaction.id, apCost);
    if (!apResult.success) {
        alert('Not enough AP (' + apCost + ' needed). Current AP: ' + (currentFaction.action_points || 0));
        if (btn) btn.disabled = false;
        return;
    }

    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const currentTick = shard?.current_tick || 0;

    // Build articles: one tariff_surcharge per selected sector + duration
    const articles = [];
    checked.forEach(cb => {
        articles.push({
            type: 'tariff_surcharge',
            data: { sector: cb.value, surcharge_pct: pct, imposer_nation_id: currentNation.id }
        });
    });
    articles.push({
        type: 'duration',
        data: {
            duration_type: durType === 'permanent' ? 'permanent' : 'fixed',
            duration_ticks: durTicks,
            auto_renew: false,
            withdrawal_notice_ticks: 1
        }
    });

    // Fetch target nation name
    const { data: targetNation } = await _supabase.from('nations').select('id, name').eq('id', wizardTargetNation).single();
    const targetName = targetNation?.name || 'Unknown';

    const billTitle = 'Ratify: ' + agreementName;
    const sectorNames = [];
    checked.forEach(cb => {
        const s = TRADEABLE_SECTORS.find(ts => ts.key === cb.value);
        if (s) sectorNames.push(s.label);
    });
    const billPreamble = 'Ratification of retaliatory tariff against ' + targetName + '. ' +
        'Imposes a +' + pct + '% tariff surcharge on ' + sectorNames.join(', ') + ' imports from ' + targetName + '. ' +
        (durType === 'permanent' ? 'Duration: until revoked.' : 'Duration: ' + durTicks + ' ticks.') + ' ' +
        'A YES vote enacts the tariff; a NO vote blocks it.';

    // Create ratification bill in OWN parliament only
    const { data: bill, error: billErr } = await _supabase.from('bills').insert({
        nation_id: currentNation.id,
        bill_type: 'ratification',
        bill_name: billTitle,
        preamble: billPreamble,
        proposed_by: currentFaction.id,
        status: 'floor',
        proposed_tick: currentTick,
        floor_tick: currentTick,
        voting_ends_tick: currentTick + GAME_CONFIG.VOTING_WINDOW_TICKS,
        trade_agreement_data: {
            type: 'retaliatory_tariff',
            imposer_nation_id: currentNation.id,
            target_nation_id: wizardTargetNation,
            agreement_name: agreementName,
            articles: articles,
            duration_type: durType === 'permanent' ? 'permanent' : 'fixed',
            duration_ticks: durTicks
        }
    }).select('id').single();

    if (billErr) {
        console.error('Error creating retaliatory tariff bill:', billErr);
        alert('Error: ' + billErr.message);
        if (btn) btn.disabled = false;
        return;
    }

    // Fire event
    try {
        await _supabase.from('event_log').insert({
            nation_id: currentNation.id,
            event_name: agreementName + ' — Proposed',
            category: 'Trade',
            description_chosen: currentNation.name + ' has submitted a retaliatory tariff bill targeting ' + targetName + ' (' + sectorNames.join(', ') + ' at +' + pct + '%).',
            fired_at_tick: currentTick
        });
        // Also fire event for target nation
        await _supabase.from('event_log').insert({
            nation_id: wizardTargetNation,
            event_name: 'Retaliatory Tariff Proposed',
            category: 'Trade',
            description_chosen: currentNation.name + ' has proposed a retaliatory tariff on your ' + sectorNames.join(', ') + ' exports (+' + pct + '%). Their parliament is voting on ratification.',
            fired_at_tick: currentTick
        });
    } catch (e) { /* non-blocking */ }

    alert('Retaliatory tariff bill submitted to parliament! A YES vote will enact the tariff against ' + targetName + '.');
    await renderInitiativeWizard();
}
