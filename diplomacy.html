    }).join('');

    // Footer buttons — role-gated
    const expulsionEnabled = !!charter.membership?.expulsionClause;
    const canExpel = expulsionEnabled && (
        charter.membership.expulsionClause === 'president' ? isPresident : !isObserver
    );

    const footerHtml = `
        <div class="ipo-footer">
            <div class="ipo-footer-members">${memberBadges}</div>
            <div class="ipo-footer-actions">
                ${!isObserver ? '<button class="ipo-btn ipo-btn--invite" onclick="openIPOInviteModal()">Invite</button>' : ''}
                ${!isObserver ? '<button class="ipo-btn ipo-btn--amend" onclick="openIPOAmendModal()">Amend Charter</button>' : ''}
                ${canExpel ? '<button class="ipo-btn ipo-btn--expel" onclick="openIPOExpelModal()">Expel</button>' : ''}
                <button class="ipo-btn ipo-btn--leave" onclick="leaveIPOOrg()">Leave</button>
            </div>
        </div>`;

    return headerHtml + chatHtml + bottomHtml + footerHtml;
}

// ==================== IPO CHAT SYSTEM ====================

let ipoChatMessages = [];       // cached messages for current org
let ipoChatMemberMap = {};      // { faction_id: { name, color } } for rendering

/**
 * Load chat messages for the selected org, render them, and subscribe to realtime.
 */
async function loadIPOChat(orgId) {
    const container = document.getElementById('ipo-chat-messages');
    if (!container || !orgId) return;

    // Unsubscribe from previous channel
    if (ipoRealtimeChannel) {
        _supabase.removeChannel(ipoRealtimeChannel);
        ipoRealtimeChannel = null;
    }

    // Build member map (for names and colors)
    try {
        const { data: members } = await _supabase
            .from('ipo_members')
            .select('faction_id, chat_color, factions:faction_id ( faction_name )')
            .eq('org_id', orgId)
            .eq('is_active', true);
        ipoChatMemberMap = {};
        (members || []).forEach(m => {
            ipoChatMemberMap[m.faction_id] = {
                name: m.factions?.faction_name || 'Unknown',
                color: m.chat_color || '#6b6a5e'
            };
        });
    } catch (e) { console.warn('[IPO Chat] Member map error:', e); }

    // Fetch messages (most recent 100, then reverse for display)
    try {
        const { data: messages, error } = await _supabase
            .from('ipo_chat')
            .select('id, faction_id, is_system, message_text, tick_posted, created_at')
            .eq('org_id', orgId)
            .order('created_at', { ascending: false })
            .limit(100);

        if (error) {
            console.error('[IPO Chat] Fetch error:', error.message);
            ipoChatMessages = [];
        } else {
            // Reverse so oldest is first (chat reads top-to-bottom)
            ipoChatMessages = (messages || []).reverse();
        }
    } catch (e) {
        console.error('[IPO Chat] Fetch exception:', e);
        ipoChatMessages = [];
    }

    renderIPOChatMessages();

    // Subscribe to realtime inserts
    ipoRealtimeChannel = _supabase
        .channel('ipo_chat_' + orgId)
        .on('postgres_changes', {
            event: 'INSERT',
            schema: 'public',
            table: 'ipo_chat',
            filter: 'org_id=eq.' + orgId
        }, (payload) => {
            const msg = payload.new;
            if (!ipoChatMessages.find(m => m.id === msg.id)) {
                ipoChatMessages.push(msg);
                renderIPOChatMessages();
            }
        })
        .subscribe();
}

/**
 * Render chat messages into the chat container.
 */
function renderIPOChatMessages() {
    const container = document.getElementById('ipo-chat-messages');
    if (!container) return;

    if (ipoChatMessages.length === 0) {
        container.innerHTML = '<div class="ipo-chat-system">— No messages yet —</div>';
        return;
    }

    container.innerHTML = ipoChatMessages.map(msg => {
        if (msg.is_system) {
            return `<div class="ipo-chat-system">— ${escapeHtml(msg.message_text)} —</div>`;
        }

        const member = ipoChatMemberMap[msg.faction_id];
        const partyName = member?.name || 'Unknown';
        const partyColor = member?.color || '#6b6a5e';
        const timeStr = formatIPOChatTime(msg.created_at);

        return `<div class="ipo-chat-msg">
            <span class="ipo-chat-msg-party" style="color:${partyColor};">${escapeHtml(partyName)}</span>
            <span class="ipo-chat-msg-text">${escapeHtml(msg.message_text)}</span>
            <span class="ipo-chat-msg-time">${timeStr}</span>
        </div>`;
    }).join('');

    // Auto-scroll to bottom
    container.scrollTop = container.scrollHeight;
}

/**
 * Format chat timestamp (relative or absolute).
 */
function formatIPOChatTime(isoStr) {
    if (!isoStr) return '';
    const d = new Date(isoStr);
    const now = new Date();
    const diff = (now - d) / 1000;
    if (diff < 60) return 'now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h';
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

/**
 * Send a chat message to the current org.
 */
async function sendIPOChat() {
    const input = document.getElementById('ipo-chat-input');
    if (!input || !currentFaction || !ipoSelectedOrgId) return;

    const text = input.value.trim();
    if (!text) return;

    // Check membership is active and role is 'member' (not observer)
    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    if (!membership || membership.role === 'observer') return;

    input.value = '';
    input.disabled = true;

    try {
        const { data, error } = await _supabase.from('ipo_chat').insert({
            org_id: ipoSelectedOrgId,
            faction_id: currentFaction.id,
            is_system: false,
            message_text: text,
            tick_posted: shardTick
        }).select();

        if (error) {
            console.error('[IPO Chat] Send error:', error.message, error.code, error.details);
            input.value = text; // restore on failure
            alert('Message failed to send: ' + error.message);
        } else if (!data || data.length === 0) {
            console.error('[IPO Chat] Send returned no data — RLS may have blocked the insert');
            input.value = text;
            alert('Message may not have been saved. Please try again.');
        } else {
            // Optimistic UI update — show the message immediately rather than
            // waiting for the realtime subscription (which requires the table
            // to be in the supabase_realtime publication).
            const inserted = data?.[0];
            if (inserted && !ipoChatMessages.find(m => m.id === inserted.id)) {
                ipoChatMessages.push(inserted);
                renderIPOChatMessages();
            }
        }
    } catch (e) {
        console.error('[IPO Chat] Send exception:', e);
        input.value = text;
    } finally {
        input.disabled = false;
        input.focus();
    }
}

// ==================== IPO INVITE & EXPULSION (Phase 10) ====================

/**
 * Open the invite modal — allows inviting a faction as member or observer.
 */
async function openIPOInviteModal() {
    if (!currentFaction || !ipoSelectedOrgId) return;
    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    if (!membership || membership.role === 'observer') return;

    // Fetch all factions not already members or with pending invites
    const { data: existingMembers, error: memErr } = await _supabase
        .from('ipo_members')
        .select('faction_id')
        .eq('org_id', ipoSelectedOrgId)
        .eq('is_active', true);
    if (memErr) console.error('[IPO Invite] Members query error:', memErr.message);
    const memberIds = new Set((existingMembers || []).map(m => m.faction_id));

    const { data: allInvites, error: invErr } = await _supabase
        .from('ipo_invitations')
        .select('target_faction_id, status, responded_at_tick')
        .eq('org_id', ipoSelectedOrgId);
    if (invErr) console.error('[IPO Invite] Invitations query error:', invErr.message);

    // Build a map: faction_id → latest invitation status
    const inviteMap = {};
    (allInvites || []).forEach(i => {
        const prev = inviteMap[i.target_faction_id];
        // Keep the most relevant status: pending/vote_pending > declined > accepted
        if (!prev || i.status === 'pending' || i.status === 'vote_pending') {
            inviteMap[i.target_faction_id] = i;
        }
    });

    const IPO_INVITE_COOLDOWN = 10;

    const { data: allFactions, error: facErr } = await _supabase
        .from('factions')
        .select('id, faction_name, nation_id')
        .eq('faction_type', 'party')
        .is('abandoned_at', null)
        .order('faction_name');
    if (facErr) console.error('[IPO Invite] Factions query error:', facErr.message);

    const allFactionsList = allFactions || [];
    const nationIds = [...new Set(allFactionsList.map(f => f.nation_id).filter(Boolean))];
    const nationMap = {};
    if (nationIds.length > 0) {
        const { data: nations } = await _supabase.from('nations').select('id, name').in('id', nationIds);
        (nations || []).forEach(n => { nationMap[n.id] = n.name; });
    }

    function statusBadge(f) {
        if (memberIds.has(f.id)) {
            return '<span class="ipo-invite-badge ipo-invite-badge--accepted">Accepted</span>';
        }
        const inv = inviteMap[f.id];
        if (!inv) return '';
        if (inv.status === 'pending' || inv.status === 'vote_pending') {
            return '<span class="ipo-invite-badge ipo-invite-badge--invited">Invited</span>';
        }
        if (inv.status === 'declined') {
            const ticksSince = shardTick - (inv.responded_at_tick || 0);
            if (ticksSince < IPO_INVITE_COOLDOWN) {
                const remaining = IPO_INVITE_COOLDOWN - ticksSince;
                return '<span class="ipo-invite-badge ipo-invite-badge--rejected">Rejected · ' + remaining + ' Tick Cooldown</span>';
            }
        }
        return '';
    }

    function isDisabled(f) {
        if (memberIds.has(f.id)) return true;
        const inv = inviteMap[f.id];
        if (!inv) return false;
        if (inv.status === 'pending' || inv.status === 'vote_pending') return true;
        if (inv.status === 'declined') {
            const ticksSince = shardTick - (inv.responded_at_tick || 0);
            if (ticksSince < IPO_INVITE_COOLDOWN) return true;
        }
        return false;
    }

    // Find first selectable faction
    const firstSelectable = allFactionsList.find(f => !isDisabled(f));

    const listItems = allFactionsList.map(f => {
        const nation = nationMap[f.nation_id] ? ' <span style="color:var(--text-dim);font-size:12px;">· ' + escapeHtml(nationMap[f.nation_id]) + '</span>' : '';
        const badge = statusBadge(f);
        const disabled = isDisabled(f);
        const selectedClass = (!disabled && firstSelectable && f.id === firstSelectable.id) ? ' selected' : '';
        const disabledClass = disabled ? ' disabled' : '';
        return '<div class="ipo-invite-item' + selectedClass + disabledClass + '" data-faction-id="' + f.id + '"'
            + (disabled ? '' : ' onclick="selectIPOInviteTarget(this)"')
            + '>'
            + '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">'
            + '<span style="font-size:13px;">' + escapeHtml(f.faction_name) + nation + '</span>'
            + badge
            + '</div>'
            + '</div>';
    }).join('');

    const inner = document.getElementById('ipo-create-modal-inner');
    document.getElementById('ipo-create-modal').classList.add('active');
    inner.innerHTML = `
        <div class="ipo-modal-header">
            <span class="ipo-modal-title">Invite to Organisation</span>
            <button class="modal-close" onclick="closeIPOActionModal()">&times;</button>
        </div>
        <div class="ipo-modal-body">
            <label class="ipo-vote-form-label">Party to Invite</label>
            <input type="hidden" id="ipo-invite-target" value="${firstSelectable?.id || ''}">
            <div id="ipo-invite-list" style="max-height:260px;overflow-y:auto;border:1px solid var(--border-color, rgba(255,255,255,0.12));border-radius:6px;background:var(--bg-darker, rgba(0,0,0,0.2));">${listItems}</div>
            <label class="ipo-vote-form-label">Role</label>
            <select id="ipo-invite-role" class="ipo-vote-form-select">
                <option value="member">Member — full voting and action rights</option>
                <option value="observer">Observer — read-only access, no voting</option>
            </select>
            <div class="ipo-vote-form-note">The invited party will see this invitation and can accept or decline.</div>
            <div class="wizard-nav" style="margin-top:16px;">
                <button class="wizard-back-btn" onclick="closeIPOActionModal()">Cancel</button>
                <button class="ipo-btn ipo-btn--create-large" onclick="submitIPOInvite()">Send Invitation</button>
            </div>
        </div>`;
}

function selectIPOInviteTarget(el) {
    if (el.classList.contains('disabled')) return;
    document.querySelectorAll('#ipo-invite-list .ipo-invite-item.selected').forEach(item => item.classList.remove('selected'));
    el.classList.add('selected');
    document.getElementById('ipo-invite-target').value = el.dataset.factionId;
}

/**
 * Submit an invitation to the selected faction.
 */
async function submitIPOInvite() {
    if (_ipoActionLock) return;
    const targetId = document.getElementById('ipo-invite-target')?.value;
    const role = document.getElementById('ipo-invite-role')?.value || 'member';
    if (!targetId) { alert('Select a party to invite.'); return; }

    _ipoActionLock = true;
    try {
        const { error } = await _supabase.from('ipo_invitations').insert({
            org_id: ipoSelectedOrgId,
            invited_by: currentFaction.id,
            target_faction_id: targetId,
            invited_role: role,
            status: 'pending',
            invited_at_tick: shardTick
        });

        if (error) {
            if (error.code === '23505') {
                alert('This party already has a pending invitation.');
            } else {
                alert('Failed to send invitation: ' + error.message);
            }
            return;
        }

        // Get target name for chat
        const { data: targetFaction } = await _supabase
            .from('factions')
            .select('faction_name')
            .eq('id', targetId)
            .single();
        const targetName = targetFaction?.faction_name || 'A party';

        await _supabase.from('ipo_chat').insert({
            org_id: ipoSelectedOrgId,
            faction_id: null,
            is_system: true,
            message_text: `${currentFaction.faction_name} invited ${targetName} as ${role}.`,
            tick_posted: shardTick
        });

        closeIPOActionModal();
        alert(`Invitation sent to ${targetName}.`);
    } catch (e) {
        console.error('[IPO] Invite error:', e);
        alert('Failed to send invitation.');
    } finally {
        _ipoActionLock = false;
    }
}

/**
 * Expel a member — president direct if charter allows, otherwise opens a vote.
 */
async function openIPOExpelModal() {
    if (!currentFaction || !ipoSelectedOrgId) return;
    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    if (!membership) return;

    const org = membership.org;
    const charter = org?.charter || {};
    const expClause = charter.membership?.expulsionClause;
    const isPresident = org.president_id === currentFaction.id;

    if (!expClause) {
        alert('Expulsion is disabled in this organisation\'s charter.');
        return;
    }

    // If president-only expulsion, only president can do it
    if (expClause === 'president' && !isPresident) {
        alert('Only the president can expel members under this charter.');
        return;
    }

    // Fetch members (exclude self) — include observers so they can be expelled too
    const otherMembers = ipoAllMembers.filter(m => m.faction_id !== currentFaction.id);
    if (otherMembers.length === 0) {
        alert('No other members to expel.');
        return;
    }

    const memberOpts = otherMembers.map(m => {
        const roleTag = m.role === 'observer' ? ' (Observer)' : '';
        return `<option value="${m.faction_id}">${escapeHtml(m.factions?.faction_name || 'Unknown')}${roleTag}</option>`;
    }).join('');

    const modeLabel = expClause === 'president'
        ? 'As president, you can expel a member immediately.'
        : `Expulsion requires a ${expClause} vote. This will create a vote proposal.`;

    const inner = document.getElementById('ipo-create-modal-inner');
    document.getElementById('ipo-create-modal').classList.add('active');
    inner.innerHTML = `
        <div class="ipo-modal-header">
            <span class="ipo-modal-title">Expel Member</span>
            <button class="modal-close" onclick="closeIPOActionModal()">&times;</button>
        </div>
        <div class="ipo-modal-body">
            <div class="ipo-vote-form-note">${modeLabel}</div>
            <label class="ipo-vote-form-label">Member to Expel</label>
            <select id="ipo-expel-target" class="ipo-vote-form-select">${memberOpts}</select>
            <div class="wizard-nav" style="margin-top:16px;">
                <button class="wizard-back-btn" onclick="closeIPOActionModal()">Cancel</button>
                <button class="ipo-btn ipo-btn--create-large" style="background:rgba(217,83,79,0.15);border-color:rgba(217,83,79,0.3);color:#d9534f;" onclick="submitIPOExpel()">
                    ${expClause === 'president' ? 'Expel Now' : 'Propose Expulsion Vote'}
                </button>
            </div>
        </div>`;
}

async function submitIPOExpel() {
    if (_ipoActionLock) return;
    const targetId = document.getElementById('ipo-expel-target')?.value;
    if (!targetId) { alert('Select a member.'); return; }

    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    const org = membership?.org;
    const expClause = org?.charter?.membership?.expulsionClause;

    const targetMember = ipoAllMembers.find(m => m.faction_id === targetId);
    const targetName = targetMember?.factions?.faction_name || 'Unknown';

    _ipoActionLock = true;
    if (expClause === 'president') {
        // Direct expulsion by president
        if (!confirm(`Expel ${targetName} from the organisation? This is immediate and cannot be undone.`)) return;

        try {
            await _supabase.from('ipo_members')
                .update({ is_active: false, left_at_tick: shardTick })
                .eq('org_id', ipoSelectedOrgId)
                .eq('faction_id', targetId)
                .eq('is_active', true);

            await _supabase.from('ipo_chat').insert({
                org_id: ipoSelectedOrgId,
                faction_id: null,
                is_system: true,
                message_text: `${targetName} has been expelled by the president.`,
                tick_posted: shardTick
            });

            await _supabase.from('ipo_action_log').insert({
                org_id: ipoSelectedOrgId,
                faction_id: currentFaction.id,
                target_faction_id: targetId,
                action_type: 'expulsion',
                action_data: { type: 'expulsion', target_name: targetName, by_president: true },
                ap_cost: 0,
                performed_at_tick: shardTick
            });

            closeIPOActionModal();
            renderIPOView();
        } catch (e) {
            console.error('[IPO] Expulsion error:', e);
            alert('Failed to expel member.');
        } finally {
            _ipoActionLock = false;
        }
    } else {
        // Create expulsion vote
        try {
            if (!await _checkOpenVoteLimit(ipoSelectedOrgId)) {
                alert(`This organisation already has ${IPO_MAX_OPEN_VOTES} open votes. Wait for some to close before proposing new ones.`);
                _ipoActionLock = false;
                return;
            }
            await _supabase.from('ipo_votes').insert({
                org_id: ipoSelectedOrgId,
                title: `Expel ${targetName}`,
                vote_type: 'expulsion',
                meta: { target_faction_id: targetId, target_faction_name: targetName },
                status: 'open',
                opened_at_tick: shardTick,
                closes_at_tick: shardTick + IPO_VOTE_DURATION,
                proposed_by: currentFaction.id
            });

            await _supabase.from('ipo_chat').insert({
                org_id: ipoSelectedOrgId,
                faction_id: null,
                is_system: true,
                message_text: `${currentFaction.faction_name} proposed to expel ${targetName}. A vote has been opened.`,
                tick_posted: shardTick
            });

            closeIPOActionModal();
            await loadIPOVotes(ipoSelectedOrgId);
        } catch (e) {
            console.error('[IPO] Expulsion vote error:', e);
            alert('Failed to propose expulsion vote.');
        } finally {
            _ipoActionLock = false;
        }
    }
}

// openIPOAmendModal() defined below in IPO AMEND CHARTER section
async function leaveIPOOrg() {
    if (!currentFaction || !ipoSelectedOrgId) return;

    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    const org = membership?.org;
    const isPresident = org?.president_id === currentFaction.id;

    let confirmMsg = 'Are you sure you want to leave this organisation? Your solidarity fund contributions will not be returned.';
    if (isPresident) {
        confirmMsg += '\n\nYou are the PRESIDENT. Leadership will pass to the next eligible member.';
    }
    if (!confirm(confirmMsg)) return;

    try {
        const { error: leaveErr } = await _supabase.from('ipo_members')
            .update({ is_active: false, left_at_tick: shardTick })
            .eq('org_id', ipoSelectedOrgId)
            .eq('faction_id', currentFaction.id)
            .eq('is_active', true);
        if (leaveErr) { alert('Failed to leave organisation: ' + leaveErr.message); return; }

        // System message
        await _supabase.from('ipo_chat').insert({
            org_id: ipoSelectedOrgId,
            faction_id: null,
            is_system: true,
            message_text: `${currentFaction.faction_name} has left the organisation.`,
            tick_posted: shardTick
        });

        // Check remaining members
        const { data: remaining } = await _supabase
            .from('ipo_members')
            .select('faction_id, role')
            .eq('org_id', ipoSelectedOrgId)
            .eq('is_active', true);

        const remainingMembers = (remaining || []).filter(m => m.role === 'member');

        if (!remaining || remaining.length === 0) {
            // No one left — dissolve org
            await _supabase.from('international_orgs')
                .update({ is_active: false, dissolved_at_tick: shardTick })
                .eq('id', ipoSelectedOrgId);

            // Cancel all pending/vote_pending invitations
            await _supabase.from('ipo_invitations')
                .update({ status: 'expired', responded_at_tick: shardTick })
                .eq('org_id', ipoSelectedOrgId)
                .in('status', ['pending', 'vote_pending']);

            // Close all open votes as failed
            await _supabase.from('ipo_votes')
                .update({ status: 'failed', resolved_at_tick: shardTick, result: { yes: 0, no: 0, abstain: 0, passed: false, reason: 'Organisation dissolved' } })
                .eq('org_id', ipoSelectedOrgId)
                .eq('status', 'open');

            await _supabase.from('ipo_chat').insert({
                org_id: ipoSelectedOrgId,
                faction_id: null,
                is_system: true,
                message_text: 'Organisation dissolved — no members remaining.',
                tick_posted: shardTick
            });
        } else if (isPresident && remainingMembers.length > 0) {
            // President leaving — hand off to next member
            const newPresId = remainingMembers[0].faction_id;
            await _supabase.from('international_orgs')
                .update({ president_id: newPresId, president_term_start_tick: shardTick })
                .eq('id', ipoSelectedOrgId);

            const { data: newPres } = await _supabase
                .from('factions').select('faction_name').eq('id', newPresId).single();

            await _supabase.from('ipo_chat').insert({
                org_id: ipoSelectedOrgId,
                faction_id: null,
                is_system: true,
                message_text: `${newPres?.faction_name || 'A member'} is now president (previous president departed).`,
                tick_posted: shardTick
            });
        }

        // Clear HQ if the departing member was the HQ nation's party
        if (org?.headquarters_nation_id) {
            const { data: hqMembers } = await _supabase
                .from('ipo_members')
                .select('faction_id, factions:faction_id ( nation_id )')
                .eq('org_id', ipoSelectedOrgId)
                .eq('is_active', true);
            const hasHqMember = (hqMembers || []).some(m => m.factions?.nation_id === org.headquarters_nation_id);
            if (!hasHqMember) {
                await _supabase.from('international_orgs')
                    .update({ headquarters_nation_id: null })
                    .eq('id', ipoSelectedOrgId);

                await _supabase.from('ipo_chat').insert({
                    org_id: ipoSelectedOrgId,
                    faction_id: null,
                    is_system: true,
                    message_text: 'Headquarters vacated — no member party remains in the HQ nation.',
                    tick_posted: shardTick
                });
            }
        }

        ipoSelectedOrgId = null;
        renderIPOView();
    } catch (e) {
        console.error('[IPO] Leave org error:', e);
        alert('Failed to leave organisation.');
    }
}

/**

}

/**
 * Accept an IPO invitation.
 */
async function acceptIPOInvite(inviteId) {
    if (!currentFaction) return;
    try {
        // Fetch invite details
        const { data: invite, error: fetchErr } = await _supabase
            .from('ipo_invitations')
            .select('id, org_id, invited_role, status')
            .eq('id', inviteId)
            .single();
        if (fetchErr || !invite || invite.status !== 'pending') {
            alert('This invitation is no longer valid.');
            renderIPOView();
            return;
        }

        // Check if org charter requires a vote for admission
        const { data: org } = await _supabase
            .from('international_orgs')
            .select('charter')
            .eq('id', invite.org_id)
            .single();
        const admission = org?.charter?.membership?.admission || 'vote';

        if (admission === 'vote' && invite.invited_role === 'member') {
            // Check open vote limit
            if (!await _checkOpenVoteLimit(invite.org_id)) {
                alert(`This organisation already has ${IPO_MAX_OPEN_VOTES} open votes. Please try again later.`);
                _ipoActionLock = false;
                return;
            }
            // Mark invite as vote_pending and auto-create a membership vote
            await _supabase.from('ipo_invitations')
                .update({ status: 'vote_pending', responded_at_tick: shardTick })
                .eq('id', inviteId);

            // Create the membership vote automatically
            await _supabase.from('ipo_votes').insert({
                org_id: invite.org_id,
                title: `Admit ${currentFaction.faction_name}`,
                vote_type: 'membership',
                meta: {
                    invite_id: inviteId,
                    target_faction_id: currentFaction.id,
                    target_faction_name: currentFaction.faction_name
                },
                status: 'open',
                opened_at_tick: shardTick,
                closes_at_tick: shardTick + IPO_VOTE_DURATION,
                proposed_by: currentFaction.id
            });

            // System chat message
            await _supabase.from('ipo_chat').insert({
                org_id: invite.org_id,
                faction_id: null,
                is_system: true,
                message_text: `${currentFaction.faction_name} has applied for membership. A vote has been opened.`,
                tick_posted: shardTick
            });

            alert('Your application has been submitted. The organisation will vote on your membership.');
        } else {
            // Direct admission (president decides, or observer role)
            let factionsToAdmit = [{ id: currentFaction.id, name: currentFaction.faction_name }];

            for (const f of factionsToAdmit) {
                const chatColor = await assignIPOChatColor(invite.org_id);
                await _supabase.from('ipo_members').insert({
                    org_id: invite.org_id,
                    faction_id: f.id,
                    role: invite.invited_role,
                    joined_at_tick: shardTick,
                    chat_color: chatColor
                });
            }

            await _supabase.from('ipo_invitations')
                .update({ status: 'accepted', responded_at_tick: shardTick })
                .eq('id', inviteId);

            // System chat message
            const admitMsg = factionsToAdmit.length > 1
                ? `${currentFaction.faction_name} and its ${factionsToAdmit.length - 1} faction(s) have joined the organisation.`
                : `${currentFaction.faction_name} has joined the organisation.`;
            await _supabase.from('ipo_chat').insert({
                org_id: invite.org_id,
                faction_id: null,
                is_system: true,
                message_text: admitMsg,
                tick_posted: shardTick
            });
        }
        renderIPOView();
    } catch (e) {
        console.error('[IPO] Accept invite error:', e);
        alert('Failed to accept invitation.');
    }
}

/**
 * Decline an IPO invitation.
 */
async function declineIPOInvite(inviteId) {
    if (!currentFaction) return;
    try {
        // Look up the invite to find the org
        const { data: invite } = await _supabase.from('ipo_invitations')
            .select('org_id')
            .eq('id', inviteId)
            .single();

        await _supabase.from('ipo_invitations')
            .update({ status: 'declined', responded_at_tick: shardTick })
            .eq('id', inviteId);

        // Post to chat
        if (invite?.org_id) {
            await _supabase.from('ipo_chat').insert({
                org_id: invite.org_id,
                faction_id: null,
                is_system: true,
                message_text: `${currentFaction.faction_name} declined the invitation to join.`,
                tick_posted: shardTick
            });
        }

        renderIPOView();
    } catch (e) {
        console.error('[IPO] Decline invite error:', e);
    }
}

// ==================== IPO CHARTER DISPLAY ====================

/**
 * Render the charter panel contents for the selected org.
 */
function renderIPOCharterPanel(charter, org) {
    if (!charter || Object.keys(charter).length === 0) {
        return '<span class="ipo-main-placeholder-text">No charter defined.</span>';
    }

    const sections = [];

    // Article I — Mission Statement
    if (charter.mission != null) {
        sections.push(renderCharterSection('Article I — Mission Statement',
            `<div class="ipo-charter-text">${escapeHtml(charter.mission)}</div>`));
    }

    // Article II — Leadership
    if (charter.leadership) {
        const l = charter.leadership;
        const typeLabels = { vote: 'Vote', rotation: 'Rotation', most_seats: 'Most Seats', random: 'Random' };
        const weightLabels = { equal: 'Equal (one vote per member)', seat_share: 'By Seat Share' };
        const passLabels = { majority: 'Majority (>50%)', unanimous: 'Unanimous' };
        sections.push(renderCharterSection('Article II — Leadership', `
            ${charterRow('Leadership Type', typeLabels[l.type] || l.type)}
            ${charterRow('Succession Term', (l.termYears || 2) + ' Year' + ((l.termYears||2) > 1 ? 's' : ''))}
            ${charterRow('Voting Weight', weightLabels[l.votingWeight] || l.votingWeight)}
            ${charterRow('Vote Pass Threshold', passLabels[l.votePass] || l.votePass)}
        `));
    }

    // Article III — Membership
    if (charter.membership) {
        const m = charter.membership;
        const admLabels = { vote: 'Vote Required', president: 'President Decides' };
        let membershipRows = charterRow('New Member Admission', admLabels[m.admission] || m.admission);

        if (m.ideologicalThreshold?.enabled && m.ideologicalThreshold.directions?.length > 0) {
            const dirs = m.ideologicalThreshold.directions.map(d =>
                `<span class="ipo-charter-tag">${escapeHtml(d.charAt(0).toUpperCase() + d.slice(1))}</span>`
            ).join(' ');
            membershipRows += charterRow('Ideological Requirements', dirs);
        } else {
            membershipRows += charterRow('Ideological Threshold', 'None');
        }

        if (m.expulsionClause) {
            const expLabels = { president: 'President Only', majority: 'Majority Vote', unanimous: 'Unanimous Vote' };
            membershipRows += charterRow('Expulsion Clause', expLabels[m.expulsionClause] || m.expulsionClause);
        } else {
            membershipRows += charterRow('Expulsion Clause', 'Disabled');
        }

        sections.push(renderCharterSection('Article III — Membership', membershipRows));
    }

    // Article IV — Transparency & Governance
    if (charter.governance) {
        const g = charter.governance;
        const actionLabels = {
            unilateral: 'Unilateral — any member can execute actions',
            committee: 'Committee — all actions require a vote (funded from solidarity fund)',
            presidential: 'Presidential — only the president can execute actions',
            delegated: 'Delegated — president + officers can act, others must vote',
            tiered: `Tiered — actions ≤${fmtIPOCash(2 * IPO_AP_TO_CASH)} are unilateral, higher cost requires a vote`
        };
        const transLabels = { public: 'Public Ballot', secret: 'Secret Ballot' };
        const vetoLabels = { founding: 'Founding Party', president: 'Current President', hq: 'HQ Nation Party' };
        sections.push(renderCharterSection('Article IV — Transparency & Governance', `
            ${charterRow('Action Leadership', actionLabels[g.actionLeadership] || actionLabels.unilateral)}
            ${charterRow('Vote Transparency', transLabels[g.voteTransparency] || g.voteTransparency)}
            ${charterRow('Observer Status', g.observerStatus ? 'Enabled' : 'Disabled')}
            ${charterRow('Veto Right', g.vetoRight ? vetoLabels[g.vetoRight] || g.vetoRight : 'None')}
            ${charterRow('Emergency Powers', g.emergencyPowers ? 'Enabled — President can act once per term without a vote' : 'Disabled')}
        `));
    }

    // Article V — Resources & External Relations
    if (charter.resources) {
        const r = charter.resources;
        const stmtLabels = { president: 'President Alone', vote: 'Majority Vote Required' };
        let resourceRows = '';

        if (r.solidarityFund?.enabled) {
            const perQuarter = (Number(r.solidarityFund.contributionPerQuarter) || 1) * IPO_AP_TO_CASH;
            resourceRows += charterRow('Solidarity Fund', fmtIPOCash(perQuarter) + ' / Quarter');
        } else {
            resourceRows += charterRow('Solidarity Fund', 'Disabled');
        }

        if (r.resourceSharingCap != null) {
            resourceRows += charterRow('Resource Sharing Cap', r.resourceSharingCap + ' per member per term');
        } else {
            resourceRows += charterRow('Resource Sharing Cap', 'No limit');
        }

        resourceRows += charterRow('Joint Statements', stmtLabels[r.jointStatementClause] || r.jointStatementClause);
        resourceRows += charterRow('Headquarters', r.headquarters ? 'Active' : 'Not designated');

        sections.push(renderCharterSection('Article V — Resources & External Relations', resourceRows));
    }

    return sections.join('<div class="ipo-charter-divider"></div>');
}

function renderCharterSection(title, body) {
    return `
        <div class="ipo-charter-section">
            <div class="ipo-charter-article-label">${title}</div>
            ${body}
        </div>`;
}

function charterRow(label, value) {
    return `<div class="ipo-charter-row">
        <span class="ipo-charter-row-label">${label}</span>
        <span class="ipo-charter-row-value">${value}</span>
    </div>`;
}

let ipoAmendArticles = null; // copy of charter articles for editing

// Amend modal state for logo changes
let ipoAmendLogo = null; // { symbol, text, image_url } or null (no logo change)
let ipoAmendLogoFile = null;
let ipoAmendLogoPreviewUrl = null;

function openIPOAmendModal() {
    if (!currentFaction || !ipoSelectedOrgId) return;

    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    if (!membership) return;

    const org = membership.org;
    const charter = org.charter || {};

    if (membership.role === 'observer') {
        alert('Observers cannot amend the charter.');
        return;
    }

    // Deep clone charter into editable articles array
    ipoAmendArticles = [];
    if (charter.mission != null) ipoAmendArticles.push({ type: 'mission', config: { text: charter.mission } });
    if (charter.leadership) ipoAmendArticles.push({ type: 'leadership', config: { ...charter.leadership } });
    if (charter.membership) ipoAmendArticles.push({ type: 'membership', config: JSON.parse(JSON.stringify(charter.membership)) });
    if (charter.governance) ipoAmendArticles.push({ type: 'governance', config: { ...charter.governance } });
    if (charter.resources) ipoAmendArticles.push({ type: 'resources', config: JSON.parse(JSON.stringify(charter.resources)) });

    if (!ipoAmendArticles.find(a => a.type === 'mission')) {
        ipoAmendArticles.unshift({ type: 'mission', config: { text: '' } });
    }

    // Init logo state from current org
    ipoAmendLogo = { symbol: org.logo_symbol || '', text: org.logo_text || '', image_url: org.logo_image_url || null };
    ipoAmendLogoFile = null;
    ipoAmendLogoPreviewUrl = org.logo_image_url || null;

    const modal = document.getElementById('ipo-create-modal');
    modal.classList.add('active');
    renderIPOAmendStep();
}

    // Reuse creation article card renderer — swap the ipoCreateArticles temporarily
    const savedArticles = ipoCreateArticles;

    const articleCards = ipoAmendArticles.map((art, i) => renderIPOArticleCard(art, i)).join('');

        : `<span style="display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;background:var(--bg-3);border:1px solid var(--border-0);border-radius:6px;font-family:var(--font-mono);font-size:14px;color:var(--text-dim);">${escapeHtml((ipoAmendLogo?.symbol || '') + ' ' + (ipoAmendLogo?.text || ''))}</span>`;

    const logoSection = `
        <div style="background:var(--bg-2);border:1px solid var(--border-0);border-radius:4px;padding:12px;margin-bottom:12px;">
            <div style="font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;">Organisation Logo</div>
            <div style="display:flex;gap:12px;align-items:flex-start;">
                <div>${logoPreview}</div>
                <div style="flex:1;">
                    <div style="display:flex;gap:6px;margin-bottom:6px;">
                        <div style="flex:1;">
                            <label style="display:block;font-family:var(--font-mono);font-size:8px;color:var(--text-dim);text-transform:uppercase;margin-bottom:2px;">Symbol</label>
                            <input type="text" id="ipo-amend-logo-symbol" value="${escapeHtml(ipoAmendLogo?.symbol || '')}" maxlength="2" placeholder="🌐"
                                style="width:100%;padding:4px 6px;background:var(--bg-4);border:1px solid var(--border-0);border-radius:3px;color:var(--text-bright);font-size:14px;text-align:center;"
                                oninput="ipoAmendLogo.symbol=this.value">
                        </div>
                        <div style="flex:2;">
                            <label style="display:block;font-family:var(--font-mono);font-size:8px;color:var(--text-dim);text-transform:uppercase;margin-bottom:2px;">Text</label>
                            <input type="text" id="ipo-amend-logo-text" value="${escapeHtml(ipoAmendLogo?.text || '')}" maxlength="6" placeholder="IPO"
                                style="width:100%;padding:4px 6px;background:var(--bg-4);border:1px solid var(--border-0);border-radius:3px;color:var(--text-bright);font-family:var(--font-mono);font-size:11px;"
                                oninput="ipoAmendLogo.text=this.value">

                        ${ipoAmendLogoPreviewUrl ? '<button onclick="ipoAmendRemoveLogo()" style="font-family:var(--font-mono);font-size:8px;padding:3px 8px;background:none;border:1px solid rgba(217,83,79,0.3);color:var(--red);cursor:pointer;border-radius:2px;">Remove</button>' : ''}

        </div>

    // Restore creation articles

function ipoAmendHandleLogoFile(input) {
    const file = input?.files?.[0];
    if (!file) return;
    if (file.size > 512 * 1024) { alert('Logo must be under 512KB.'); return; }
    ipoAmendLogoFile = file;
    ipoAmendLogoPreviewUrl = URL.createObjectURL(file);
    renderIPOAmendStep(); // re-render to show preview
}

function ipoAmendRemoveLogo() {
    ipoAmendLogoFile = null;
    ipoAmendLogoPreviewUrl = null;
    if (ipoAmendLogo) ipoAmendLogo.image_url = null;
    renderIPOAmendStep();
}

function ipoAmendAddArticle() {
    const sel = document.getElementById('ipo-add-article-select');
    if (!sel || !sel.value) return;
    const key = sel.value;
    const defaults = {
        leadership:  { type: 'rotation', termYears: 2, votingWeight: 'equal', votePass: 'majority' },
        membership:  { admission: 'vote', ideologicalThreshold: { enabled: false, directions: [] }, expulsionClause: null },
        governance:  { actionLeadership: 'unilateral', voteTransparency: 'public', observerStatus: false, vetoRight: null, emergencyPowers: false },
        resources:   { solidarityFund: { enabled: false, contributionPerQuarter: 1 }, resourceSharingCap: null, jointStatementClause: 'vote', headquarters: null }
    };
    ipoAmendArticles.push({ type: key, config: defaults[key] || {} });
    // Temporarily swap so card renderers work
    const saved = ipoCreateArticles;
    ipoCreateArticles = ipoAmendArticles;
    renderIPOAmendStep();
    ipoCreateArticles = saved;
}

function closeIPOAmendModal() {
    document.getElementById('ipo-create-modal').classList.remove('active');
    ipoAmendArticles = null;
}

async function submitIPOAmend() {
    if (!currentFaction || !ipoSelectedOrgId || !ipoAmendArticles) return;
    if (_ipoActionLock) return;

    // Build proposed charter from amend articles
    const proposedCharter = {};
    for (const art of ipoAmendArticles) {
        switch (art.type) {
            case 'mission': proposedCharter.mission = art.config.text || ''; break;
            case 'leadership':
                proposedCharter.leadership = {
                    type: art.config.type,
                    termYears: Number(art.config.termYears),
                    votingWeight: art.config.votingWeight,
                    votePass: art.config.votePass
                }; break;
            case 'membership':
                proposedCharter.membership = {
                    admission: art.config.admission,
                    ideologicalThreshold: art.config.ideologicalThreshold || { enabled: false, directions: [] },
                    expulsionClause: art.config.expulsionClause || null
                }; break;
            case 'governance':
                proposedCharter.governance = {
                    actionLeadership: art.config.actionLeadership || 'unilateral',
                    voteTransparency: art.config.voteTransparency,
                    observerStatus: !!art.config.observerStatus,
                    vetoRight: art.config.vetoRight || null,
                    emergencyPowers: !!art.config.emergencyPowers
                }; break;
            case 'resources':
                proposedCharter.resources = {
                    solidarityFund: art.config.solidarityFund || { enabled: false, contributionPerQuarter: 1 },
                    resourceSharingCap: art.config.resourceSharingCap ?? null,
                    jointStatementClause: art.config.jointStatementClause || 'vote',
                    headquarters: art.config.headquarters === '__self__' ? currentNation.id : (art.config.headquarters || null)
                }; break;
        }
    }

    // Defaults for missing articles
    if (!proposedCharter.leadership) proposedCharter.leadership = { type: 'rotation', termYears: 2, votingWeight: 'equal', votePass: 'majority' };
    if (!proposedCharter.membership) proposedCharter.membership = { admission: 'vote', ideologicalThreshold: { enabled: false, directions: [] }, expulsionClause: null };
    if (!proposedCharter.governance) proposedCharter.governance = { voteTransparency: 'public', observerStatus: false, vetoRight: null, emergencyPowers: false };
    if (!proposedCharter.resources) proposedCharter.resources = { solidarityFund: { enabled: false, contributionPerQuarter: 1 }, resourceSharingCap: null, jointStatementClause: 'vote', headquarters: null };

    // Summarize changes for the vote description
    const changedArticles = ipoAmendArticles.map(a => a.type).join(', ');
    const description = 'Amend charter articles: ' + changedArticles;

    _ipoActionLock = true;
    try {
        // Deduct cash for charter amendment
        const amendCost = IPO_AP_TO_CASH;
        const cashResult = await deductIPOCash(currentFaction.id, amendCost);
        if (!cashResult.success) {
            alert('Not enough cash. Charter amendments cost ' + fmtIPOCash(amendCost) + '.');
            return;
        }
        currentFaction.party_funds = cashResult.newFunds;

        // Check open vote limit
        if (!await _checkOpenVoteLimit(ipoSelectedOrgId)) {
            alert(`This organisation already has ${IPO_MAX_OPEN_VOTES} open votes. Wait for some to close.`);
            return;
        }

        // Upload logo image if a new file was selected
        let proposedLogoImageUrl = ipoAmendLogo?.image_url || null;
        if (ipoAmendLogoFile) {
            const ext = ipoAmendLogoFile.name.split('.').pop().toLowerCase();
            const filePath = `ipo-logos/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
            const { error: upErr } = await _supabase.storage.from('public-assets').upload(filePath, ipoAmendLogoFile, { upsert: true });
            if (upErr) {
                console.error('[IPO] Logo upload error:', upErr);
                alert('Failed to upload logo: ' + upErr.message);
                return;
            }
            const { data: urlData } = _supabase.storage.from('public-assets').getPublicUrl(filePath);
            proposedLogoImageUrl = urlData?.publicUrl || null;
        }

        // Build proposed logo change
        const proposedLogo = {
            symbol: ipoAmendLogo?.symbol || '',
            text: ipoAmendLogo?.text || '',
            image_url: proposedLogoImageUrl,
        };

        // Include logo change info in title if logo was modified
        const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
        const currentOrg = membership?.org;
        const logoChanged = currentOrg && (
            proposedLogo.symbol !== (currentOrg.logo_symbol || '') ||
            proposedLogo.text !== (currentOrg.logo_text || '') ||
            proposedLogo.image_url !== (currentOrg.logo_image_url || null)
        );
        const titleParts = [];
        if (changedArticles) titleParts.push(changedArticles);
        if (logoChanged) titleParts.push('logo');
        const voteTitle = 'Charter Amendment: ' + (titleParts.join(', ') || 'no changes');

        // Create a charter_amendment VOTE — not a direct update
        const { error } = await _supabase.from('ipo_votes').insert({
            org_id: ipoSelectedOrgId,
            title: voteTitle,
            vote_type: 'charter_amendment',
            meta: { description, proposed_charter: proposedCharter, proposed_logo: proposedLogo },
            status: 'open',
            opened_at_tick: shardTick,
            closes_at_tick: shardTick + IPO_VOTE_DURATION,
            proposed_by: currentFaction.id
        });

        if (error) {
            console.error('[IPO] Amend charter vote error:', error);
            alert('Failed to propose charter amendment: ' + error.message);
            return;
        }

        await _supabase.from('ipo_chat').insert({
            org_id: ipoSelectedOrgId,
            faction_id: null,
            is_system: true,
            message_text: `${currentFaction.faction_name} proposed a charter amendment (${changedArticles}). Members must vote to approve.`,
            tick_posted: shardTick
        });

        closeIPOAmendModal();
        await loadIPOVotes(ipoSelectedOrgId);
        renderIPOView();
    } catch (e) {
        console.error('[IPO] Amend error:', e);
        alert('Failed to propose charter amendment.');
    } finally {
        _ipoActionLock = false;
    }
}

async function _checkOpenVoteLimit(orgId) {

/**
 * Load all votes (open + recent closed) for the selected org.
 */
async function loadIPOVotes(orgId) {
    const container = document.getElementById('ipo-votes-body');
    if (!container || !orgId) return;

    try {
        // Fetch votes (open first, then recent resolved, limit 20)
        const { data: votes, error } = await _supabase
            .from('ipo_votes')
            .select('*')
            .eq('org_id', orgId)
            .order('status', { ascending: true })       // 'open' before 'failed'/'passed'
            .order('opened_at_tick', { ascending: false })
            .limit(20);

        if (error) { console.error('[IPO Votes] Fetch error:', error.message); return; }
        ipoVotes = votes || [];

        // Fetch all ballots for these votes
        if (ipoVotes.length > 0) {
            const voteIds = ipoVotes.map(v => v.id);
            const { data: ballots } = await _supabase
                .from('ipo_ballots')
                .select('*')
                .in('vote_id', voteIds);
            ipoVoteBallots = {};
            (ballots || []).forEach(b => {
                if (!ipoVoteBallots[b.vote_id]) ipoVoteBallots[b.vote_id] = [];
                ipoVoteBallots[b.vote_id].push(b);
            });
        } else {
            ipoVoteBallots = {};
        }

        // Fetch active members for voter count
        const { data: members } = await _supabase
            .from('ipo_members')
            .select('faction_id, role, is_active, factions:faction_id ( faction_name, nation_id )')
            .eq('org_id', orgId)
            .eq('is_active', true);
        ipoAllMembers = members || [];
        ipoVoteMembers = ipoAllMembers.filter(m => m.role === 'member');

    } catch (e) {
        console.error('[IPO Votes] Load exception:', e);
    }

    renderIPOVotesPanel();

    // Subscribe to realtime changes on votes, ballots, and members
    if (ipoVotesChannel) {
        _supabase.removeChannel(ipoVotesChannel);
        ipoVotesChannel = null;
    }
    ipoVotesChannel = _supabase
        .channel('ipo_org_' + orgId)
        .on('postgres_changes', {
            event: '*',
            schema: 'public',
            table: 'ipo_votes',
            filter: 'org_id=eq.' + orgId
        }, () => { loadIPOVotes(orgId).then(() => renderIPOActionsPanel()); })
        .on('postgres_changes', {
            event: 'INSERT',
            schema: 'public',
            table: 'ipo_ballots'
        }, () => { loadIPOVotes(orgId); })
        .on('postgres_changes', {
            event: '*',
            schema: 'public',
            table: 'ipo_members',
            filter: 'org_id=eq.' + orgId
        }, () => { loadIPOVotes(orgId).then(() => renderIPOActionsPanel()); })
        .on('postgres_changes', {
            event: 'UPDATE',
            schema: 'public',
            table: 'international_orgs',
            filter: 'id=eq.' + orgId
        }, () => { renderIPOView(); })
        .subscribe();
}

/**
 * Tally an election's ballots by candidate. Returns { voteTally, abstainCount, winnerId, maxVotes }.
 * Tie-break: current president wins ties; else first candidate alphabetically.
 */
function tallyElectionBallots(ballots, currentPresidentId) {
    const voteTally = {};
    let abstainCount = 0;
    for (const b of ballots) {
        if (b.ballot === 'abstain') { abstainCount++; continue; }
        voteTally[b.ballot] = (voteTally[b.ballot] || 0) + 1;
    }
    let winnerId = null;
    let maxVotes = 0;
    for (const [candidateId, count] of Object.entries(voteTally)) {
        if (count > maxVotes || (count === maxVotes && candidateId === currentPresidentId)) {
            maxVotes = count;
            winnerId = candidateId;
        }
    }
    if (!winnerId) winnerId = currentPresidentId;
    return { voteTally, abstainCount, winnerId, maxVotes };
}

function renderIPOVotesPanel() {
    const container = document.getElementById('ipo-votes-body');
    if (!container) return;

    if (ipoVotes.length === 0) {
        container.innerHTML = '<div class="ipo-votes-empty">No votes yet. Use <strong>+ Propose</strong> to start one.</div>';
        return;
    }

    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    const org = membership?.org;
    const charter = org?.charter || {};
    const governance = charter.governance || {};
    const leadership = charter.leadership || {};
    const isSecret = governance.voteTransparency === 'secret';
    const isObserver = membership?.role === 'observer';

    // Sort: open first, then by tick desc
    const sorted = [...ipoVotes].sort((a, b) => {
        if (a.status === 'open' && b.status !== 'open') return -1;
        if (a.status !== 'open' && b.status === 'open') return 1;
        return b.opened_at_tick - a.opened_at_tick;
    });

    container.innerHTML = sorted.map(vote => {
        const ballots = ipoVoteBallots[vote.id] || [];
        const myBallot = ballots.find(b => b.faction_id === currentFaction.id);
        const isOpen = vote.status === 'open';
        const isPassed = vote.status === 'passed';
        const typeLabel = IPO_VOTE_TYPE_LABELS[vote.vote_type] || vote.vote_type;

        const isElection = vote.vote_type === 'leadership_election';
        const candidates = (vote.meta && vote.meta.candidates) || [];

        // Tally
        const totalEligible = ipoVoteMembers.length;
        const totalCast = ballots.length;
        let tallyBar = '';

        if (isElection) {
            // Candidate-based tally (use shared helper for counts)
            const { voteTally: candidateTally, abstainCount } = tallyElectionBallots(ballots, null);
            // Ensure all candidates appear even if they got 0 votes
            for (const c of candidates) { if (candidateTally[c.faction_id] === undefined) candidateTally[c.faction_id] = 0; }
            const candidateRows = candidates.map(c => {
                const count = candidateTally[c.faction_id] || 0;
                const pct = totalCast > 0 ? (count / totalCast * 100) : 0;
                return `<div class="ipo-election-candidate-row">
                    <span class="ipo-election-candidate-name">${escapeHtml(c.faction_name)}</span>
                    <div class="ipo-election-candidate-bar"><div class="ipo-election-candidate-fill" style="width:${pct}%"></div></div>
                    <span class="ipo-election-candidate-count">${count}</span>
                </div>`;
            }).join('');
            tallyBar = `<div class="ipo-vote-tally ipo-election-tally">
                ${candidateRows}
                <div class="ipo-vote-tally-labels">
                    <span class="ipo-vote-tally-label--abstain">${abstainCount} Abstain</span>
                    <span class="ipo-vote-tally-label--total">${totalCast}/${totalEligible}</span>
                </div>
            </div>`;
        } else {
            // Standard yes/no/abstain tally
            const yes = ballots.filter(b => b.ballot === 'yes').length;
            const no = ballots.filter(b => b.ballot === 'no').length;
            const abstain = ballots.filter(b => b.ballot === 'abstain').length;
            const yPct = totalCast > 0 ? (yes / totalCast * 100) : 0;
            const nPct = totalCast > 0 ? (no / totalCast * 100) : 0;
            const aPct = totalCast > 0 ? (abstain / totalCast * 100) : 0;
            tallyBar = `<div class="ipo-vote-tally">
                <div class="ipo-vote-tally-bar">
                    <div class="ipo-vote-tally-seg ipo-vote-tally-seg--yes" style="width:${yPct}%"></div>
                    <div class="ipo-vote-tally-seg ipo-vote-tally-seg--no" style="width:${nPct}%"></div>
                    <div class="ipo-vote-tally-seg ipo-vote-tally-seg--abstain" style="width:${aPct}%"></div>
                </div>
                <div class="ipo-vote-tally-labels">
                    <span class="ipo-vote-tally-label--yes">${yes} Yes</span>
                    <span class="ipo-vote-tally-label--no">${no} No</span>
                    <span class="ipo-vote-tally-label--abstain">${abstain} Abstain</span>
                    <span class="ipo-vote-tally-label--total">${totalCast}/${totalEligible}</span>
                </div>
            </div>`;
        }

        // Status badge
        let statusBadge;
        if (isOpen) {
            const ticksLeft = vote.closes_at_tick - shardTick;
            statusBadge = `<span class="ipo-vote-badge ipo-vote-badge--open">OPEN · ${ticksLeft > 0 ? ticksLeft + ' ticks left' : 'closing...'}</span>`;
        } else if (isPassed) {
            statusBadge = '<span class="ipo-vote-badge ipo-vote-badge--passed">PASSED</span>';
        } else {
            statusBadge = '<span class="ipo-vote-badge ipo-vote-badge--failed">FAILED</span>';
        }

        // Meta summary
        const metaSummary = renderVoteMetaSummary(vote);

        // Ballot buttons (only if open, member, and hasn't voted)
        let ballotHtml = '';
        if (isOpen && !isObserver) {
            if (myBallot) {
                if (isElection) {
                    const chosenCandidate = candidates.find(c => c.faction_id === myBallot.ballot);
                    const chosenLabel = myBallot.ballot === 'abstain' ? 'ABSTAIN' : (chosenCandidate?.faction_name || myBallot.ballot);
                    ballotHtml = `<div class="ipo-vote-my-ballot">Your vote: <strong>${escapeHtml(chosenLabel)}</strong></div>`;
                } else {
                    ballotHtml = `<div class="ipo-vote-my-ballot">Your vote: <strong>${myBallot.ballot.toUpperCase()}</strong></div>`;
                }
            } else if (isElection) {
                const candidateBtns = candidates.map(c =>
                    `<button class="ipo-vote-btn ipo-vote-btn--candidate" onclick="selectIPOBallot('${vote.id}','${c.faction_id}')" data-candidate-name="${escapeHtml(c.faction_name)}">${escapeHtml(c.faction_name)}</button>`
                ).join('');
                ballotHtml = `
                    <div class="ipo-vote-ballot-row ipo-election-ballot-row" id="ipo-ballot-row-${vote.id}">
                        ${candidateBtns}
                        <button class="ipo-vote-btn ipo-vote-btn--abstain" onclick="selectIPOBallot('${vote.id}','abstain')">Abstain</button>
                    </div>
                    <div class="ipo-vote-confirm-row" id="ipo-ballot-confirm-${vote.id}" style="display:none">
                        <span class="ipo-vote-confirm-label">Vote for <strong id="ipo-ballot-choice-${vote.id}"></strong>?</span>
                        <button class="ipo-vote-btn ipo-vote-btn--confirm" onclick="confirmIPOBallot('${vote.id}')">Confirm</button>
                        <button class="ipo-vote-btn ipo-vote-btn--cancel" onclick="cancelIPOBallot('${vote.id}')">Cancel</button>
                    </div>`;
            } else {
                ballotHtml = `
                    <div class="ipo-vote-ballot-row" id="ipo-ballot-row-${vote.id}">
                        <button class="ipo-vote-btn ipo-vote-btn--yes" onclick="selectIPOBallot('${vote.id}','yes')">Yes</button>
                        <button class="ipo-vote-btn ipo-vote-btn--no" onclick="selectIPOBallot('${vote.id}','no')">No</button>
                        <button class="ipo-vote-btn ipo-vote-btn--abstain" onclick="selectIPOBallot('${vote.id}','abstain')">Abstain</button>
                    </div>
                    <div class="ipo-vote-confirm-row" id="ipo-ballot-confirm-${vote.id}" style="display:none">
                        <span class="ipo-vote-confirm-label">Vote <strong id="ipo-ballot-choice-${vote.id}"></strong>?</span>
                        <button class="ipo-vote-btn ipo-vote-btn--confirm" onclick="confirmIPOBallot('${vote.id}')">Confirm</button>
                        <button class="ipo-vote-btn ipo-vote-btn--cancel" onclick="cancelIPOBallot('${vote.id}')">Cancel</button>
                    </div>`;
            }
        }

        // Voter breakdown (public ballot only, for resolved or if voted)
        let voterBreakdown = '';
        if (!isSecret && ballots.length > 0 && (!isOpen || myBallot)) {
            if (isElection) {
                voterBreakdown = '<div class="ipo-vote-voters">' + ballots.map(b => {
                    const member = ipoVoteMembers.find(m => m.faction_id === b.faction_id);
                    const voterName = member?.factions?.faction_name || 'Unknown';
                    if (b.ballot === 'abstain') {
                        return `<span class="ipo-vote-voter ipo-vote-voter--abstain">${escapeHtml(voterName)}: Abstain</span>`;
                    }
                    const chosenCandidate = candidates.find(c => c.faction_id === b.ballot);
                    const candidateName = chosenCandidate?.faction_name || 'Unknown';
                    return `<span class="ipo-vote-voter ipo-vote-voter--yes">${escapeHtml(voterName)} → ${escapeHtml(candidateName)}</span>`;
                }).join('') + '</div>';
            } else {
                voterBreakdown = '<div class="ipo-vote-voters">' + ballots.map(b => {
                    const member = ipoVoteMembers.find(m => m.faction_id === b.faction_id);
                    const name = member?.factions?.faction_name || 'Unknown';
                    return `<span class="ipo-vote-voter ipo-vote-voter--${b.ballot}">${escapeHtml(name)}: ${b.ballot}</span>`;
                }).join('') + '</div>';
            }
        }

        // Resolve button — show if open and all members voted OR closes_at_tick reached
        let resolveBtn = '';
        if (isOpen && !isObserver && (totalCast >= totalEligible || shardTick >= vote.closes_at_tick)) {
            resolveBtn = `<button class="ipo-vote-btn ipo-vote-btn--resolve" onclick="resolveIPOVote('${vote.id}')">Resolve Vote</button>`;
        }

        return `
            <div class="ipo-vote-card ${isOpen ? 'ipo-vote-card--open' : ''} ${isPassed ? 'ipo-vote-card--passed' : ''} ${vote.status === 'failed' ? 'ipo-vote-card--failed' : ''}">
                <div class="ipo-vote-card-header">
                    <span class="ipo-vote-type-badge">${typeLabel}</span>
                    ${statusBadge}
                </div>
                <div class="ipo-vote-card-title">${escapeHtml(vote.title)}</div>
                ${metaSummary}
                ${tallyBar}
                ${voterBreakdown}
                ${ballotHtml}
                ${resolveBtn}
            </div>`;
    }).join('');
}

/**
 * Render a short summary line based on vote meta.
 */
function renderVoteMetaSummary(vote) {
    const meta = vote.meta || {};
    let text = '';
    switch (vote.vote_type) {
        case 'membership': {
            const name = meta.target_faction_name || 'a party';
            const role = meta.requested_role === 'observer' ? 'an observer' : 'a member';
            text = `Admit <strong>${escapeHtml(name)}</strong> as ${role}.`;
            break;
        }
        case 'expulsion': {
            const name = meta.target_faction_name || 'a member';
            text = `Expel <strong>${escapeHtml(name)}</strong> from the organisation.`;
            break;
        }
        case 'joint_statement':
            if (meta.statement_text) {
                const escaped = escapeHtml(meta.statement_text);
                if (meta.statement_text.length > 120) {
                    const preview = escapeHtml(meta.statement_text.substring(0, 120));
                    text = `<div class="ipo-statement-text">
                        <span class="ipo-statement-preview">"${preview}…"</span>
                        <span class="ipo-statement-full">"${escaped}"</span>
                        <button class="ipo-statement-toggle" onclick="this.parentElement.classList.toggle('expanded'); this.textContent = this.parentElement.classList.contains('expanded') ? 'Show less' : 'Read more'">Read more</button>
                    </div>`;
                } else {
                    text = `"${escaped}"`;
                }
            }
            break;
        case 'fund_draw':
            text = `<strong>${escapeHtml(meta.proposer_name || 'A member')}</strong> requests <strong>${fmtIPOCash(meta.amount_requested || 0)}</strong> from the solidarity fund.`;
            if (meta.purpose) text += `<br><span style="color:var(--text-muted);font-size:0.8em;">Purpose: ${escapeHtml(meta.purpose)}</span>`;
            break;
        case 'charter_amendment':
            text = `Amend <strong>${meta.article_type || 'charter'}</strong>: ${escapeHtml((meta.description || '').substring(0, 100))}`;
            break;
        case 'change_headquarters':
            text = `Relocate HQ to <strong>${escapeHtml(meta.proposed_nation_name || 'a new nation')}</strong>.`;
            break;
        case 'symposium':
            text = `Hold symposium in <strong>${escapeHtml(meta.target_nation_name || 'a nation')}</strong> (${meta.axis || 'ideology'} ${meta.direction || ''}).`;
            break;
        case 'leadership_election': {
            const numCandidates = (meta.candidates || []).length;
            text = `Elect the next president from <strong>${numCandidates}</strong> candidate${numCandidates !== 1 ? 's' : ''}.`;
            break;
        }
        case 'change_logo': {
            const proposed = meta.proposed_logo || {};
            const membership = ipoMemberships.find(m => m.org.id === vote.org_id || m.org.id === ipoSelectedOrgId);
            const org = membership?.org;
            const currentLogo = { logo_symbol: org?.logo_symbol || '', logo_text: org?.logo_text || '', logo_image_url: org?.logo_image_url || null };
            const proposedLogo = { logo_symbol: proposed.symbol || '', logo_text: proposed.text || '', logo_image_url: proposed.image_url || null };
            text = `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <span style="font-size:0.85em;color:var(--text-muted);">Change logo:</span>
                ${renderIPOLogo(currentLogo, 'ipo-vote-logo-preview', '')}
                <span style="color:var(--text-muted);">→</span>
                ${renderIPOLogo(proposedLogo, 'ipo-vote-logo-preview', '')}
            </div>`;
            break;
        }
    }
    return text ? `<div class="ipo-vote-meta-summary">${text}</div>` : '';
}

function renderIPOVoteModalTypeSelect() {
    const inner = document.getElementById('ipo-create-modal-inner');
    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    const org = membership?.org;
    const charter = org?.charter || {};

    // Determine which vote types are available
    const available = [];
    // membership — only if admission is 'vote'
    if ((charter.membership?.admission || 'vote') === 'vote') {
        available.push('membership');
    }
    // expulsion — only if expulsion clause allows voting
    if (charter.membership?.expulsionClause === 'majority' || charter.membership?.expulsionClause === 'unanimous') {
        available.push('expulsion');
    }
    // joint_statement — only if clause is 'vote'
    if ((charter.resources?.jointStatementClause || 'vote') === 'vote') {
        available.push('joint_statement');
    }
    // fund_draw — only if solidarity fund is enabled
    if (charter.resources?.solidarityFund?.enabled) {
        available.push('fund_draw');
    }
    // charter_amendment — always available
    available.push('charter_amendment');
    // change_logo — always available (cosmetic-only, follows charter votePass)
    available.push('change_logo');
    // change_headquarters — always available
    available.push('change_headquarters');
    // symposium — only if not on cooldown and no pending symposium
    if ((org.symposium_cooldown_remaining || 0) <= 0 && !org.pending_symposium) {
        available.push('symposium');
    }

    const typeCards = available.map(t => `
        <button class="ipo-vote-type-card" onclick="selectIPOVoteType('${t}')">
            <span class="ipo-vote-type-card-label">${IPO_VOTE_TYPE_LABELS[t]}</span>
            <span class="ipo-vote-type-card-desc">${IPO_VOTE_TYPE_DESCRIPTIONS[t]}</span>
        </button>
    `).join('');

    inner.innerHTML = `
        <div class="ipo-modal-header">
            <span class="ipo-modal-title">Propose a Vote</span>
            <button class="modal-close" onclick="closeIPOVoteModal()">&times;</button>
        </div>
        <div class="ipo-modal-body">
            <div class="ipo-vote-type-grid">${typeCards}</div>
        </div>`;
}

async function selectIPOVoteType(type) {
    ipoVoteModalType = type;
    if (type === 'change_logo') {
        const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
        const org = membership?.org;
        ipoVoteLogo = {
            symbol: org?.logo_symbol || '',
            text: org?.logo_text || '',
            image_url: org?.logo_image_url || null
        };
        ipoVoteLogoFile = null;
        ipoVoteLogoPreviewUrl = org?.logo_image_url || null;
    }
    await renderIPOVoteModalForm();
}

async function renderIPOVoteModalForm() {
    const inner = document.getElementById('ipo-create-modal-inner');
    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    const org = membership?.org;
    const typeLabel = IPO_VOTE_TYPE_LABELS[ipoVoteModalType];

    let formFields = '';

    switch (ipoVoteModalType) {
        case 'membership': {
            // Fetch pending vote_pending invitations
            const { data: invites } = await _supabase
                .from('ipo_invitations')
                .select('id, target_faction_id, status, factions:target_faction_id ( faction_name )') // Fixed: was invited_faction_id
                .eq('org_id', ipoSelectedOrgId)
                .eq('status', 'vote_pending');
            const inviteOptions = (invites || []).map(inv =>
                `<option value="${inv.id}" data-name="${escapeHtml(inv.factions?.faction_name || 'Unknown')}" data-fid="${inv.target_faction_id}">${escapeHtml(inv.factions?.faction_name || 'Unknown')}</option>`
            ).join('');
            if (!inviteOptions) {
                formFields = '<div class="ipo-vote-form-note">No pending membership applications.</div>';
            } else {
                formFields = `
                    <label class="ipo-vote-form-label">Applicant</label>
                    <select id="ipo-vote-meta-invite" class="ipo-vote-form-select">${inviteOptions}</select>`;
            }
            break;
        }
        case 'expulsion': {
            const memberOptions = ipoAllMembers
                .filter(m => m.faction_id !== currentFaction.id)
                .map(m => {
                    const roleTag = m.role === 'observer' ? ' (Observer)' : '';
                    return `<option value="${m.faction_id}">${escapeHtml(m.factions?.faction_name || 'Unknown')}${roleTag}</option>`;
                })
                .join('');
            formFields = `
                <label class="ipo-vote-form-label">Member to Expel</label>
                <select id="ipo-vote-meta-target" class="ipo-vote-form-select">${memberOptions}</select>`;
            break;
        }
        case 'joint_statement':
            formFields = `
                <label class="ipo-vote-form-label">Statement Text</label>
                <textarea id="ipo-vote-meta-statement" class="ipo-vote-form-textarea" rows="4" maxlength="500" placeholder="Draft the statement text..."></textarea>
                <label class="ipo-vote-form-label">Visibility</label>
                <select id="ipo-vote-meta-visibility" class="ipo-vote-form-select">
                    <option value="public">Public — visible to all nations</option>
                    <option value="private">Private — organisation only</option>
                </select>`;
            break;
        case 'fund_draw': {
            const balance = Number(org?.solidarity_fund_balance) || 0;
            formFields = `
                <label class="ipo-vote-form-label">Amount ($, in $50k increments) · Fund Balance: ${fmtIPOCash(balance)}</label>
                <input type="number" id="ipo-vote-meta-amount" class="ipo-vote-form-input" min="${IPO_AP_TO_CASH}" max="${balance}" step="${IPO_AP_TO_CASH}" value="${IPO_AP_TO_CASH}" />
                <label class="ipo-vote-form-label">Purpose</label>
                <input type="text" id="ipo-vote-meta-purpose" class="ipo-vote-form-input" maxlength="200" placeholder="Describe the purpose..." />`;
            break;
        }
        case 'charter_amendment':
            formFields = `
                <label class="ipo-vote-form-label">Article to Amend</label>
                <select id="ipo-vote-meta-article" class="ipo-vote-form-select">
                    <option value="mission">Article I — Mission</option>
                    <option value="leadership">Article II — Leadership</option>
                    <option value="membership">Article III — Membership</option>
                    <option value="governance">Article IV — Governance</option>
                    <option value="resources">Article V — Resources</option>
                </select>
                <label class="ipo-vote-form-label">Description of Changes</label>
                <textarea id="ipo-vote-meta-desc" class="ipo-vote-form-textarea" rows="3" maxlength="500" placeholder="Describe the proposed changes..."></textarea>`;
            break;
        case 'change_headquarters': {
            const { data: nations } = await _supabase.from('nations').select('id, name').order('name');
            const nationOpts = (nations || []).map(n => `<option value="${n.id}">${escapeHtml(n.name)}</option>`).join('');
            formFields = `
                <label class="ipo-vote-form-label">New Headquarters Nation</label>
                <select id="ipo-vote-meta-nation" class="ipo-vote-form-select">${nationOpts}</select>`;
            break;
        }
        case 'symposium': {
            const { data: nations } = await _supabase.from('nations').select('id, name').order('name');
            const nationOpts = (nations || []).map(n => `<option value="${n.id}">${escapeHtml(n.name)}</option>`).join('');
            formFields = `
                <label class="ipo-vote-form-label">Target Nation</label>
                <select id="ipo-vote-meta-nation" class="ipo-vote-form-select">${nationOpts}</select>
                <label class="ipo-vote-form-label">Ideology Axis</label>
                <select id="ipo-vote-meta-axis" class="ipo-vote-form-select">
                    <option value="economic">Economic</option>
                    <option value="social">Social</option>
                    <option value="foreign">Foreign Policy</option>
                </select>
                <label class="ipo-vote-form-label">Direction</label>
                <select id="ipo-vote-meta-direction" class="ipo-vote-form-select">
                    <option value="left">Left / Progressive / Dovish</option>
                    <option value="right">Right / Conservative / Hawkish</option>
                </select>`;
            break;
        }
        case 'change_logo': {
            const logoPreview = ipoVoteLogoPreviewUrl
                ? `<img src="${escapeHtml(ipoVoteLogoPreviewUrl)}" style="width:48px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--border-0);" />`
                : `<span style="display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;background:var(--bg-3);border:1px solid var(--border-0);border-radius:6px;font-family:var(--font-mono);font-size:14px;color:var(--text-dim);">${escapeHtml((ipoVoteLogo?.symbol || '') + ' ' + (ipoVoteLogo?.text || ''))}</span>`;
            formFields = `
                <div class="ipo-vote-form-note">Proposes a cosmetic logo change. Cost: ${fmtIPOCash(IPO_AP_TO_CASH)} on submission. Same vote threshold as charter amendments.</div>
                <div style="display:flex;gap:12px;align-items:flex-start;margin-top:8px;">
                    <div>${logoPreview}</div>
                    <div style="flex:1;">
                        <div style="display:flex;gap:6px;margin-bottom:6px;">
                            <div style="flex:1;">
                                <label style="display:block;font-family:var(--font-mono);font-size:8px;color:var(--text-dim);text-transform:uppercase;margin-bottom:2px;">Symbol</label>
                                <input type="text" id="ipo-vote-logo-symbol" value="${escapeHtml(ipoVoteLogo?.symbol || '')}" maxlength="2" placeholder="🌐"
                                    style="width:100%;padding:4px 6px;background:var(--bg-4);border:1px solid var(--border-0);border-radius:3px;color:var(--text-bright);font-size:14px;text-align:center;"
                                    oninput="ipoVoteSetLogoSymbol(this.value)">
                            </div>
                            <div style="flex:2;">
                                <label style="display:block;font-family:var(--font-mono);font-size:8px;color:var(--text-dim);text-transform:uppercase;margin-bottom:2px;">Text</label>
                                <input type="text" id="ipo-vote-logo-text" value="${escapeHtml(ipoVoteLogo?.text || '')}" maxlength="6" placeholder="IPO"
                                    style="width:100%;padding:4px 6px;background:var(--bg-4);border:1px solid var(--border-0);border-radius:3px;color:var(--text-bright);font-family:var(--font-mono);font-size:11px;"
                                    oninput="ipoVoteSetLogoText(this.value)">
