/**
 * Apply an IPO rally approval change through the proper electorate system.
 * Updates faction_electoral_standing.party_approval and logs to party_approval_log.
 */
async function ipoNudgeApproval(factionId, nationId, delta, source) {
    if (!delta || delta === 0) return;
    const { data: standing } = await _supabase
        .from('faction_electoral_standing')
        .select('id, party_approval')
        .eq('faction_id', factionId)
        .eq('nation_id', nationId)
        .maybeSingle();
    if (!standing) return;

    const old = Number(standing.party_approval ?? 40);
    const newApproval = Math.round(Math.min(100, Math.max(0, old + delta)) * 100) / 100;

    await _supabase.from('faction_electoral_standing')
        .update({ party_approval: newApproval })
        .eq('id', standing.id);

    // Audit log (non-fatal)
    try {
        await _supabase.from('party_approval_log').insert({
            faction_id: factionId,
            nation_id: nationId,
            amount: delta,
            source: source || 'ipo:rally',
            tick: shardTick || 0
        });
    } catch (e) { /* non-blocking */ }
}

/**
 * Render the actions panel with available action buttons.
 */
function renderIPOActionsPanel() {
    const container = document.getElementById('ipo-actions-body');
    if (!container) return;

    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    if (!membership) {
        container.innerHTML = '<span class="ipo-main-placeholder-text">Select an organisation.</span>';
        return;
    }

    const org = membership.org;
    const charter = org?.charter || {};
    const isPresident = org.president_id === currentFaction.id;
    const isObserver = membership.role === 'observer';

    if (isObserver) {
        container.innerHTML = '<div class="ipo-actions-empty">Observers cannot perform actions.</div>';
        return;
    }

    const actions = [];
    const currentAp = currentFaction?.action_points ?? 0;

    // Hold Rally — any member, targets another member
    actions.push({
        key: 'hold_rally',
        label: 'Hold Rally',
        desc: 'Spend AP to rally support for another member party.',
        cost: IPO_ACTION_COSTS.hold_rally,
        icon: '📢',
        available: ipoAllMembers.filter(m => m.faction_id !== currentFaction.id && m.is_active).length > 0 && currentAp >= IPO_ACTION_COSTS.hold_rally
    });

    // Rally All Members — president only
    actions.push({
        key: 'rally_all',
        label: 'Rally All Members',
        desc: 'Coordinate rallies across all member nations.',
        cost: IPO_ACTION_COSTS.rally_all,
        icon: '📣',
        available: isPresident && currentAp >= IPO_ACTION_COSTS.rally_all
    });

    // Back Channel Resources — any member, always available (personal AP) or with fund
    const fundEnabled = charter.resources?.solidarityFund?.enabled;
    actions.push({
        key: 'back_channel',
        label: 'Back-Channel Resources',
        desc: 'Transfer AP to another member. Personal: 2 AP, no risk. Fund: 1 AP from fund, 25% exposure.',
        cost: 2, // minimum personal cost (2 overhead + transfer)
        icon: '🤝',
        available: currentAp >= 3 // 2 overhead + at least 1 to transfer
    });

    // Joint Statement — president or if charter allows vote (vote handled in Votes panel)
    const stmtClause = charter.resources?.jointStatementClause || 'vote';
    actions.push({
        key: 'joint_statement',
        label: 'Issue Joint Statement',
        desc: stmtClause === 'president' ? 'Issue a statement on behalf of the org (president only).' : 'Issue a statement (requires a vote — use Votes panel).',
        cost: IPO_ACTION_COSTS.joint_statement,
        icon: '📜',
        available: stmtClause === 'president' && isPresident && currentAp >= IPO_ACTION_COSTS.joint_statement
    });

    // Solidarity Fund Draw — always requires a vote (proposed via Votes panel)
    actions.push({
        key: 'fund_draw',
        label: 'Draw from Fund',
        desc: fundEnabled && (org.solidarity_fund_balance || 0) > 0
            ? `Withdraw AP from fund (${org.solidarity_fund_balance} AP available). Requires vote — use Votes panel.`
            : fundEnabled ? 'Fund is empty.' : 'Solidarity fund is not enabled.',
        cost: 0,
        icon: '💰',
        available: false  // always route through vote panel
    });

    // ── Enforce Action Leadership charter rules ──
    const actionMode = charter.governance?.actionLeadership || 'unilateral';
    const hasEmergencyPowers = !!charter.governance?.emergencyPowers;
    const emergencyUsedTick = org.emergency_power_used_tick || 0;
    const termStartTick = org.president_term_start_tick || 0;
    // Emergency available if: powers enabled, is president, and hasn't been used since current term started
    // (emergencyUsedTick === 0 means never used → always available)
    const emergencyAvailable = hasEmergencyPowers && isPresident && (emergencyUsedTick === 0 || emergencyUsedTick < termStartTick);

    // Actions with no vote equivalent — always allow direct execution regardless of governance mode
    const directOnlyActions = new Set(['hold_rally', 'rally_all', 'back_channel']);

    for (const a of actions) {
        if (!a.available || a.key === 'fund_draw') continue;

        let blocked = false;
        let blockReason = '';

        if (directOnlyActions.has(a.key)) {
            // These actions have no vote pathway — always allow direct execution
        } else if (actionMode === 'committee') {
            blocked = true;
            blockReason = 'Charter requires a vote — use Votes panel';
        } else if (actionMode === 'presidential' && !isPresident) {
            blocked = true;
            blockReason = 'Only the president can execute actions';
        } else if (actionMode === 'delegated' && !isPresident) {
            blocked = true;
            blockReason = 'Only the president or officers can execute actions';
        } else if (actionMode === 'tiered' && a.cost > 2) {
            blocked = true;
            blockReason = 'Costs >2 AP — charter requires a vote';
        }

        if (blocked) {
            a.available = false;
            a.desc = `${a.desc} (${blockReason})`;
            // Tag as emergency-eligible if president has unused emergency powers
            if (emergencyAvailable) {
                a._emergencyEligible = true;
            }
        }
    }

    const actionCardsHtml = actions.map(a => {
        const emergencyBtn = a._emergencyEligible
            ? `<button class="ipo-action-exec-btn" style="background:rgba(217,83,79,0.15);border-color:rgba(217,83,79,0.3);color:#d9534f;" onclick="executeIPOAction('${a.key}', true)">⚡ EMERGENCY</button>`
            : '';
        return `<div class="ipo-action-card ${a.available ? '' : 'ipo-action-card--disabled'}">
            <div class="ipo-action-card-top">
                <span class="ipo-action-icon">${a.icon}</span>
                <div class="ipo-action-info">
                    <span class="ipo-action-label">${a.label}</span>
                    <span class="ipo-action-desc">${a.desc}</span>
                </div>
            </div>
            <div class="ipo-action-card-bottom">
                ${a.cost > 0 ? `<span class="ipo-action-cost">${a.cost} AP</span>` : '<span class="ipo-action-cost">Free</span>'}
                ${a.available
                    ? `<button class="ipo-action-exec-btn" onclick="executeIPOAction('${a.key}')">Execute</button>`
                    : emergencyBtn || '<button class="ipo-action-exec-btn" disabled>Unavailable</button>'}
            </div>
        </div>`;
    }).join('');

    // Split layout: scrollable action cards on top, scrollable event log on bottom
    container.innerHTML = `
        <div class="ipo-actions-split">
            <div class="ipo-actions-cards">${actionCardsHtml}</div>
            <div id="ipo-event-log" class="ipo-event-log"></div>
        </div>`;
    loadIPOEventLog(ipoSelectedOrgId);
}

const IPO_ACTION_TYPE_ICONS = {
    hold_rally: '📢', rally_all: '📣', back_channel: '🤝',
    joint_statement: '📜', fund_draw: '💰'
};

async function loadIPOEventLog(orgId) {
    const container = document.getElementById('ipo-event-log');
    if (!container || !orgId) return;

    try {
        const { data: logs } = await _supabase
            .from('ipo_action_log')
            .select('action_type, faction_id, target_faction_id, action_data, ap_cost, performed_at_tick, factions:faction_id ( faction_name )')
            .eq('org_id', orgId)
            .order('performed_at_tick', { ascending: false })
            .limit(8);

        if (!logs || logs.length === 0) {
            container.innerHTML = '<div class="ipo-event-log-empty">No recent activity.</div>';
            return;
        }

        container.innerHTML = `
            <div class="ipo-event-log-header">Recent Activity</div>
            ${logs.map(log => {
                const icon = IPO_ACTION_TYPE_ICONS[log.action_type] || '●';
                const who = log.factions?.faction_name || 'Unknown';
                const data = log.action_data || {};
                let desc = '';

                switch (log.action_type) {
                    case 'hold_rally':
                        desc = data.type === 'expulsion'
                            ? `expelled ${data.target_name || 'a member'}`
                            : `held a rally: ${data.outcome_name || '?'} (${data.approval_change >= 0 ? '+' : ''}${data.approval_change || 0})`;
                        break;
                    case 'rally_all':
                        desc = `rallied all members (${(data.results || []).length} parties)`;
                        break;
                    case 'back_channel':
                        desc = data.exposed
                            ? `EXPOSED: transferred ${data.amount || '?'} AP to ${data.target_name || '?'}`
                            : `transferred resources`;
                        break;
                    case 'joint_statement':
                        if (data.statement_text && data.statement_text.length > 80) {
                            const preview = escapeHtml(data.statement_text.substring(0, 80));
                            const full = escapeHtml(data.statement_text);
                            desc = `issued a joint statement: <span class="ipo-statement-text"><span class="ipo-statement-preview">"${preview}…"</span><span class="ipo-statement-full" style="display:none">"${full}"</span><button class="ipo-statement-toggle" onclick="this.parentElement.classList.toggle('expanded'); this.textContent = this.parentElement.classList.contains('expanded') ? 'Less' : 'More'">More</button></span>`;
                        } else if (data.statement_text) {
                            desc = `issued a joint statement: "${escapeHtml(data.statement_text)}"`;
                        } else {
                            desc = 'issued a joint statement';
                        }
                        break;
                    case 'fund_draw':
                        desc = `withdrew ${data.amount || '?'} AP from fund`;
                        break;
                    default:
                        desc = log.action_type;
                }

                return `<div class="ipo-event-log-row">
                    <span class="ipo-event-log-icon">${icon}</span>
                    <span class="ipo-event-log-text"><strong>${escapeHtml(who)}</strong> ${desc}</span>
                    <span class="ipo-event-log-tick">T${log.performed_at_tick}</span>
                </div>`;
            }).join('')}`;
    } catch (e) {
        console.error('[IPO] Event log error:', e);
    }
}

/**
 * Execute an IPO action — routes to the appropriate handler.
 */
async function executeIPOAction(actionKey, useEmergencyPowers = false) {
    if (!currentFaction || !ipoSelectedOrgId) return;

    // If invoking emergency powers, confirm and record usage
    if (useEmergencyPowers) {
        if (!confirm('⚡ INVOKE EMERGENCY POWERS?\n\nThis bypasses the charter\'s action leadership rules.\nYou can only use this once per presidential term.\n\nProceed?')) return;

        // Record emergency power usage on the org
        try {
            await _supabase.from('international_orgs')
                .update({ emergency_power_used_tick: shardTick })
                .eq('id', ipoSelectedOrgId);

            // Post to chat
            await _supabase.from('ipo_chat').insert({
                org_id: ipoSelectedOrgId,
                faction_id: null,
                is_system: true,
                message_text: `⚡ ${currentFaction.faction_name} has invoked EMERGENCY POWERS to execute: ${actionKey.replace(/_/g, ' ')}.`,
                tick_posted: shardTick
            });

            // World event for every member nation (non-blocking — don't prevent action if this fails)
            try {
                const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
                const orgName = membership?.org?.name || 'An organisation';
                const { data: members } = await _supabase.from('ipo_members')
                    .select('nation_id').eq('org_id', ipoSelectedOrgId);
                const nationIds = [...new Set((members || []).map(m => m.nation_id).filter(Boolean))];
                for (const nid of nationIds) {
                    await _supabase.from('event_log').insert({
                        nation_id: nid,
                        event_name: 'Emergency Powers Invoked',
                        description_chosen: `${orgName}: ${currentFaction.faction_name} invoked emergency powers to ${actionKey.replace(/_/g, ' ')}.`,
                        category: 'DIPLOMATIC',
                        fired_at_tick: shardTick
                    });
                }
            } catch (_) { /* world event is non-blocking */ }
        } catch (e) {
            alert('Failed to invoke emergency powers: ' + (e.message || 'Unknown error'));
            return;
        }
    }

    switch (actionKey) {
        case 'hold_rally':      await executeHoldRally(); break;
        case 'rally_all':       await executeRallyAll(); break;
        case 'back_channel':    openBackChannelModal(); break;
        case 'joint_statement': openDirectStatementModal(); break;
        case 'fund_draw':       openDirectFundDrawModal(); break;
    }
}

// ── Hold Rally ──

async function executeHoldRally() {
    if (_ipoActionLock) return;
    const cost = IPO_ACTION_COSTS.hold_rally;

    // Build list of other members to target
    const otherMembers = ipoAllMembers.filter(m => m.faction_id !== currentFaction.id && m.is_active);
    if (otherMembers.length === 0) {
        alert('No other members in this organisation to rally for.');
        return;
    }

    // Show member picker via modal
    const options = otherMembers.map(m =>
        `<option value="${m.faction_id}">${escapeHtml(m.factions?.faction_name || 'Unknown')}</option>`
    ).join('');

    const inner = document.getElementById('ipo-create-modal-inner');
    document.getElementById('ipo-create-modal').classList.add('active');
    inner.innerHTML = `
        <div class="ipo-modal-header">
            <span class="ipo-modal-title">Hold Rally</span>
            <button class="modal-close" onclick="closeIPOActionModal()">&times;</button>
        </div>
        <div class="ipo-modal-body">
            <p class="ipo-action-desc" style="margin-bottom:12px;">
                Spend ${cost} AP to rally support for another member party. A dice roll determines the outcome.
            </p>
            <label class="ipo-vote-form-label">Rally for which party?</label>
            <select id="ipo-rally-target" class="ipo-vote-form-select">${options}</select>
            <div class="wizard-nav" style="margin-top:16px;">
                <button class="wizard-back-btn" onclick="closeIPOActionModal()">Cancel</button>
                <button class="ipo-btn ipo-btn--create-large" onclick="confirmHoldRally()">Hold Rally — ${cost} AP</button>
            </div>
        </div>`;
}

async function confirmHoldRally() {
    if (_ipoActionLock) return;
    const cost = IPO_ACTION_COSTS.hold_rally;
    const targetId = document.getElementById('ipo-rally-target')?.value;
    if (!targetId) { alert('Select a party to rally for.'); return; }

    const targetMember = ipoAllMembers.find(m => m.faction_id === targetId);
    const targetName = targetMember?.factions?.faction_name || 'Unknown';

    _ipoActionLock = true;
    try {
        // Deduct AP from the executing faction
        const apResult = await deductAP(_supabase, currentFaction.id, cost);
        if (!apResult.success) {
            if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
            alert(`Insufficient AP. You need ${cost} AP. ${apResult.currentAp !== undefined ? 'You have ' + apResult.currentAp + ' AP.' : ''}`);
            return;
        }
        currentFaction.action_points = apResult.newAp;

        // Roll outcome
        const outcome = rollRallyOutcome();
        const approvalChange = randomInt(outcome.min, outcome.max);

        // Apply approval change to the TARGET faction via electorate system
        const targetNationId = targetMember?.factions?.nation_id;
        if (targetNationId) {
            await ipoNudgeApproval(targetId, targetNationId, approvalChange, 'ipo:hold_rally');
        }

        // Log the action
        const actionData = {
            target_faction_id: targetId,
            target_faction_name: targetName,
            outcome_id: outcome.id,
            outcome_name: outcome.name,
            approval_change: approvalChange
        };

        await _supabase.from('ipo_action_log').insert({
            org_id: ipoSelectedOrgId,
            faction_id: currentFaction.id,
            action_type: 'hold_rally',
            action_data: actionData,
            ap_cost: cost,
            performed_at_tick: shardTick
        });

        // System chat message
        await _supabase.from('ipo_chat').insert({
            org_id: ipoSelectedOrgId,
            faction_id: null,
            is_system: true,
            message_text: `${currentFaction.faction_name} rallied support for ${targetName}: ${outcome.name} (${approvalChange >= 0 ? '+' : ''}${approvalChange} approval).`,
            tick_posted: shardTick
        });

        closeIPOActionModal();
        renderIPOActionsPanel();
        showIPOActionResult('Hold Rally for ' + targetName, outcome, approvalChange);
    } catch (e) {
        console.error('[IPO Action] Hold rally error:', e);
        alert('Failed to execute rally.');
    } finally {
        _ipoActionLock = false;
    }
}

// ── Rally All Members ──

async function executeRallyAll() {
    if (_ipoActionLock) return;
    const cost = IPO_ACTION_COSTS.rally_all;
    const memberCount = ipoVoteMembers.length;
    if (!confirm(`Rally all ${memberCount} member parties? This costs ${cost} AP. Each member gets an independent dice roll.`)) return;
    _ipoActionLock = true;

    try {
        const apResult = await deductAP(_supabase, currentFaction.id, cost);
        if (!apResult.success) {
            if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
            alert(`Insufficient AP. You need ${cost} AP.`);
            return;
        }
        currentFaction.action_points = apResult.newAp;

        // Roll for each member
        const results = ipoVoteMembers.map(m => {
            const outcome = rollRallyOutcome();
            const change = randomInt(outcome.min, outcome.max);
            return {
                faction_id: m.faction_id,
                nation_id: m.factions?.nation_id,
                faction_name: m.factions?.faction_name || 'Unknown',
                outcome_id: outcome.id,
                outcome_name: outcome.name,
                approval_change: change
            };
        });

        // Apply approval changes via electorate system
        for (const r of results) {
            if (r.nation_id) {
                await ipoNudgeApproval(r.faction_id, r.nation_id, r.approval_change, 'ipo:rally_all');
            }
        }

        await _supabase.from('ipo_action_log').insert({
            org_id: ipoSelectedOrgId,
            faction_id: currentFaction.id,
            action_type: 'rally_all',
            action_data: { results },
            ap_cost: cost,
            performed_at_tick: shardTick
        });

        // Build summary
        const summaryLines = results.map(r =>
            `${r.faction_name}: ${r.outcome_name} (${r.approval_change >= 0 ? '+' : ''}${r.approval_change})`
        ).join(', ');

        await _supabase.from('ipo_chat').insert({
            org_id: ipoSelectedOrgId,
            faction_id: null,
            is_system: true,
            message_text: `${currentFaction.faction_name} rallied all members! ${summaryLines}`,
            tick_posted: shardTick
        });

        // Show combined result
        renderIPOActionsPanel();
        showIPOActionResultMulti('Rally All Members', results);
    } catch (e) {
        console.error('[IPO Action] Rally all error:', e);
        alert('Failed to execute coordinated rally.');
    } finally {
        _ipoActionLock = false;
    }
}

// ── Back-Channel Resources ──

let backChannelTargetId = null;
let backChannelAmount = 1;

function openBackChannelModal() {
    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    const org = membership?.org;
    const charter = org?.charter || {};
    const cap = charter.resources?.resourceSharingCap;
    const fundEnabled = charter.resources?.solidarityFund?.enabled;
    const fundBalance = org?.solidarity_fund_balance || 0;

    backChannelTargetId = null;
    backChannelAmount = 1;

    const otherMembers = ipoAllMembers.filter(m => m.faction_id !== currentFaction.id && m.is_active);
    if (otherMembers.length === 0) { alert('No other members to transfer to.'); return; }

    const memberOpts = otherMembers.map(m =>
        `<option value="${m.faction_id}">${escapeHtml(m.factions?.faction_name || 'Unknown')}</option>`
    ).join('');

    const capNote = cap ? `<div class="ipo-vote-form-note">Resource sharing cap: ${cap} transfers per term.</div>` : '';
    const fundOption = fundEnabled && fundBalance > 0
        ? `<option value="fund">Solidarity Fund (1 AP from fund · 25% exposure risk)</option>`
        : '';

    const inner = document.getElementById('ipo-create-modal-inner');
    document.getElementById('ipo-create-modal').classList.add('active');
    inner.innerHTML = `
        <div class="ipo-modal-header">
            <span class="ipo-modal-title">Back-Channel Resources</span>
            <button class="modal-close" onclick="closeIPOActionModal()">&times;</button>
        </div>
        <div class="ipo-modal-body">
            <div class="ipo-vote-form-note">Secretly transfer AP to another member.</div>
            ${capNote}
            <label class="ipo-vote-form-label">Funding Source</label>
            <select id="ipo-bc-source" class="ipo-vote-form-select">
                <option value="personal">Personal AP (2 AP · no exposure risk)</option>
                ${fundOption}
            </select>
            <label class="ipo-vote-form-label">Recipient</label>
            <select id="ipo-bc-target" class="ipo-vote-form-select" onchange="backChannelTargetId=this.value">${memberOpts}</select>
            <label class="ipo-vote-form-label">Amount (AP to transfer)</label>
            <input type="number" id="ipo-bc-amount" class="ipo-vote-form-input" min="1" max="20" value="1" onchange="backChannelAmount=Number(this.value)" />
            <div class="wizard-nav" style="margin-top:16px;">
                <button class="wizard-back-btn" onclick="closeIPOActionModal()">Cancel</button>
                <button class="ipo-btn ipo-btn--create-large" onclick="executeBackChannel()">Transfer</button>
            </div>
        </div>`;

    backChannelTargetId = otherMembers[0].faction_id;
}

async function executeBackChannel() {
    if (_ipoActionLock) return;
    if (!backChannelTargetId) { alert('Select a recipient.'); return; }
    const amount = Number(document.getElementById('ipo-bc-amount')?.value) || backChannelAmount;
    if (amount < 1) { alert('Enter a valid amount.'); return; }
    const source = document.getElementById('ipo-bc-source')?.value || 'personal';

    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    const org = membership?.org;
    const charter = org?.charter || {};

    // Check resource sharing cap
    const cap = charter.resources?.resourceSharingCap;
    if (cap) {
        const { data: recent } = await _supabase
            .from('ipo_action_log')
            .select('id')
            .eq('org_id', ipoSelectedOrgId)
            .eq('faction_id', currentFaction.id)
            .eq('action_type', 'back_channel')
            .gte('performed_at_tick', shardTick - (charter.leadership?.termYears || 2) * 12);
        if (recent && recent.length >= cap) {
            alert(`You have reached the resource sharing cap (${cap} per term).`);
            return;
        }
    }

    _ipoActionLock = true;

    try {
        const targetMember = ipoVoteMembers.find(m => m.faction_id === backChannelTargetId);
        const targetName = targetMember?.factions?.faction_name || 'Unknown';
        let exposed = false;
        let apCostPaid = 0;

        if (source === 'fund') {
            // Fund source: 1 AP from solidarity fund, 25% exposure risk
            const fundBalance = org?.solidarity_fund_balance || 0;
            if (amount > fundBalance) {
                alert(`Fund only has ${fundBalance} AP available.`);
                return;
            }

            // Deduct from fund
            const newBalance = fundBalance - amount;
            const { error: fundErr } = await _supabase.from('international_orgs')
                .update({ solidarity_fund_balance: newBalance })
                .eq('id', ipoSelectedOrgId);
            if (fundErr) throw fundErr;

            apCostPaid = 0; // no personal AP cost for fund source
            exposed = Math.random() < IPO_BACK_CHANNEL_EXPOSURE_CHANCE; // 25% risk
        } else {
            // Personal source: 2 AP overhead + transfer amount, no exposure risk
            const cost = 2 + amount;
            const apResult = await deductAP(_supabase, currentFaction.id, cost);
            if (!apResult.success) {
                if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
                alert(`Insufficient AP. You need ${cost} AP (2 overhead + ${amount} transfer).`);
                return;
            }
            currentFaction.action_points = apResult.newAp;
            apCostPaid = cost;
            exposed = false; // personal AP = no exposure risk
        }

        // Credit recipient
        const { data: recipient } = await _supabase
            .from('factions')
            .select('action_points')
            .eq('id', backChannelTargetId)
            .single();
        if (recipient) {
            await _supabase.from('factions')
                .update({ action_points: (recipient.action_points || 0) + amount })
                .eq('id', backChannelTargetId);
        }

        await _supabase.from('ipo_action_log').insert({
            org_id: ipoSelectedOrgId,
            faction_id: currentFaction.id,
            target_faction_id: backChannelTargetId,
            action_type: 'back_channel',
            action_data: { amount, exposed, target_name: targetName, source },
            ap_cost: apCostPaid,
            performed_at_tick: shardTick
        });

        if (exposed) {
            // Public exposure — world event + chat
            await _supabase.from('ipo_chat').insert({
                org_id: ipoSelectedOrgId,
                faction_id: null,
                is_system: true,
                message_text: `EXPOSED: ${currentFaction.faction_name} used solidarity funds to secretly transfer ${amount} AP to ${targetName}!`,
                tick_posted: shardTick
            });
            // World event for every member nation
            try {
                const { data: members } = await _supabase.from('ipo_members')
                    .select('nation_id').eq('org_id', ipoSelectedOrgId);
                const nationIds = [...new Set((members || []).map(m => m.nation_id).filter(Boolean))];
                for (const nid of nationIds) {
                    await _supabase.from('event_log').insert({
                        nation_id: nid,
                        event_name: 'Back-Channel Scandal',
                        description_chosen: `${org.name || 'An organisation'}: ${currentFaction.faction_name} was caught secretly funneling ${amount} AP to ${targetName} from the solidarity fund!`,
                        category: 'DIPLOMATIC',
                        fired_at_tick: shardTick
                    });
                }
            } catch (_) { /* non-blocking */ }
        } else {
            // Private — vague system message
            await _supabase.from('ipo_chat').insert({
                org_id: ipoSelectedOrgId,
                faction_id: null,
                is_system: true,
                message_text: `Resources were transferred within the organisation.`,
                tick_posted: shardTick
            });
        }

        closeIPOActionModal();
        renderIPOActionsPanel();
        alert(`Transferred ${amount} AP to ${targetName}.${exposed ? ' WARNING: The transfer was EXPOSED publicly!' : ' Transfer completed secretly.'}`);
    } catch (e) {
        console.error('[IPO Action] Back-channel error:', e);
        alert('Failed to transfer resources.');
    } finally {
        _ipoActionLock = false;
    }
}

function openDirectStatementModal() {

    document.getElementById('ipo-create-modal').classList.add('active');
    inner.innerHTML = `

                <button class="ipo-btn ipo-btn--create-large" onclick="executeDirectStatement()">Publish</button>
            </div>
        </div>`;

async function executeDirectStatement() {
    if (_ipoActionLock) return;
    const text = document.getElementById('ipo-direct-stmt')?.value?.trim();
    if (!text) { alert('Please write the statement.'); return; }

    const cost = IPO_ACTION_COSTS.joint_statement;
    _ipoActionLock = true;

    try {
        const apResult = await deductAP(_supabase, currentFaction.id, cost);
        if (!apResult.success) {
            if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
            alert(`Insufficient AP. You need ${cost} AP.`);
            return;
        }
        currentFaction.action_points = apResult.newAp;

        await _supabase.from('ipo_action_log').insert({
            org_id: ipoSelectedOrgId,
            faction_id: currentFaction.id,
            action_type: 'joint_statement',
            action_data: { statement_text: text, by_president: true },
            ap_cost: cost,
            performed_at_tick: shardTick
        });

        await _supabase.from('ipo_chat').insert({
            org_id: ipoSelectedOrgId,
            faction_id: null,
            is_system: true,
            message_text: `JOINT STATEMENT (by president): "${text}"`,
            tick_posted: shardTick
        });

        // Post to world events for every member nation
        const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
        const orgName = membership?.org?.name || 'International Organisation';
        try {
            const { data: members } = await _supabase.from('ipo_members')
                .select('nation_id')
                .eq('org_id', ipoSelectedOrgId);
            const nationIds = [...new Set((members || []).map(m => m.nation_id).filter(Boolean))];
            for (const nid of nationIds) {
                await _supabase.from('event_log').insert({
                    nation_id: nid,
                    event_name: 'Joint Statement',
                    description_chosen: `${orgName}: "${text}"`,
                    category: 'DIPLOMATIC',
                    fired_at_tick: shardTick
                });
            }
        } catch (evErr) {
            console.warn('[IPO] Joint statement event_log insert failed (non-blocking):', evErr);
        }

        closeIPOActionModal();
        renderIPOActionsPanel();
        alert('Statement published.');
    } catch (e) {
        console.error('[IPO Action] Statement error:', e);
        alert('Failed to publish statement.');
    } finally {
        _ipoActionLock = false;
    }
}

function openDirectFundDrawModal() {
    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);

    const inner = document.getElementById('ipo-create-modal-inner');

            <label class="ipo-vote-form-label">Amount (AP)</label>
            <input type="number" id="ipo-direct-draw-amount" class="ipo-vote-form-input" min="1" max="${balance}" value="1" />

                <button class="wizard-back-btn" onclick="closeIPOActionModal()">Cancel</button>
                <button class="ipo-btn ipo-btn--create-large" onclick="executeDirectFundDraw()">Withdraw</button>
            </div>
        </div>`;
}

async function executeDirectFundDraw() {
    if (_ipoActionLock) return;
    const amount = parseInt(document.getElementById('ipo-direct-draw-amount')?.value);
    const purpose = document.getElementById('ipo-direct-draw-purpose')?.value?.trim() || '';
    if (!amount || amount < 1) { alert('Enter a valid amount.'); return; }

    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    const balance = membership?.org?.solidarity_fund_balance || 0;
    if (amount > balance) { alert('Amount exceeds fund balance.'); return; }

    _ipoActionLock = true;

    try {
        // KNOWN ISSUE: read-modify-write on cached balance is not atomic across sessions.
        // A server-side RPC for atomic fund decrement would eliminate this race.
        // The _ipoActionLock guard protects against same-tab double-fire only.
        const newBalance = balance - amount;
        await _supabase.from('international_orgs')
            .update({ solidarity_fund_balance: newBalance })
            .eq('id', ipoSelectedOrgId);

        // Credit the president's faction (fresh read to avoid overwriting concurrent AP changes)
        const { data: faction } = await _supabase
            .from('factions')
            .select('action_points')
            .eq('id', currentFaction.id)
            .single();
        if (faction) {
            await _supabase.from('factions')
                .update({ action_points: (faction.action_points || 0) + amount })
                .eq('id', currentFaction.id);
        }

        await _supabase.from('ipo_fund_transactions').insert({
            org_id: ipoSelectedOrgId,
            faction_id: currentFaction.id,
            transaction_type: 'draw',
            amount: -amount,
            description: purpose || 'Presidential fund draw',
            tick: shardTick
        });

        await _supabase.from('ipo_action_log').insert({
            org_id: ipoSelectedOrgId,
            faction_id: currentFaction.id,
            action_type: 'fund_draw',
            action_data: { amount, purpose },
            ap_cost: 0,
            performed_at_tick: shardTick
        });

        await _supabase.from('ipo_chat').insert({
            org_id: ipoSelectedOrgId,
            faction_id: null,
            is_system: true,
            message_text: `President ${currentFaction.faction_name} withdrew ${amount} AP from the solidarity fund. ${purpose ? 'Purpose: ' + purpose : ''}`,
            tick_posted: shardTick
        });

        closeIPOActionModal();
        renderIPOActionsPanel();
        alert(`Withdrew ${amount} AP from the solidarity fund.`);
    } catch (e) {
        console.error('[IPO Action] Fund draw error:', e);
        alert('Failed to withdraw from fund.');
    } finally {
        _ipoActionLock = false;
    }
}

// ── Utility: Rally Dice Roll ──

function rollRallyOutcome() {
    const totalWeight = IPO_RALLY_OUTCOMES.reduce((sum, o) => sum + o.weight, 0);
    let roll = Math.random() * totalWeight;
    for (const outcome of IPO_RALLY_OUTCOMES) {
        roll -= outcome.weight;
        if (roll <= 0) return outcome;
    }
    return IPO_RALLY_OUTCOMES[1]; // fallback: solid
}

function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function ipoSelectSymbol(s) {
    ipoCreateLogoSymbol = s;
    // Update symbol buttons in-place instead of re-rendering the whole step
    document.querySelectorAll('.ipo-symbol-btn').forEach(btn => {
        btn.classList.toggle('selected', btn.textContent.trim() === s);

    if (previewEl) previewEl.innerHTML = `Preview: ${ipoCreateLogoSymbol} ${escapeHtml(ipoCreateLogoText) || '...'}`;
}

function ipoHandleLogoUpload(input) {
    const file = input.files[0];
    const errEl = document.getElementById('ipo-logo-upload-error');
    if (!file) return;
    if (!['image/png','image/jpeg','image/webp'].includes(file.type)) {
        if (errEl) { errEl.textContent = 'Only PNG, JPG, or WebP images allowed.'; errEl.style.display = ''; }
        input.value = '';
        return;
    }
    if (file.size > 2 * 1024 * 1024) {
        if (errEl) { errEl.textContent = 'Image must be under 2 MB.'; errEl.style.display = ''; }
        input.value = '';
        return;
    }
    if (errEl) errEl.style.display = 'none';
    ipoCreateLogoFile = file;
    const reader = new FileReader();
    reader.onload = function(e) {
        ipoCreateLogoPreviewUrl = e.target.result;
        const zone = document.getElementById('ipo-logo-upload-zone');
        if (zone) {
            zone.innerHTML = `<img src="${ipoCreateLogoPreviewUrl}" class="ipo-logo-upload-preview" alt="preview" />
                <div style="font-size:9px;color:var(--text-tertiary);margin-top:4px;">Click to replace</div>`;
        }
        // Show remove button by re-rendering just after the zone
        const existing = zone?.parentElement?.querySelector('.ipo-logo-remove-btn');
        if (!existing && zone?.parentElement) {
            const btn = document.createElement('button');
            btn.className = 'ipo-logo-remove-btn';
            btn.style.cssText = 'margin-top:4px;font-size:9px;color:#d9534f;background:none;border:1px solid #d9534f33;padding:2px 8px;border-radius:3px;cursor:pointer;';
            btn.textContent = 'Remove Image';
            btn.onclick = function() { ipoRemoveLogoUpload(); };
            zone.parentElement.insertBefore(btn, zone.nextSibling);
        }
    };
    reader.readAsDataURL(file);
}

function ipoRemoveLogoUpload() {
    ipoCreateLogoFile = null;
    ipoCreateLogoPreviewUrl = null;
    const zone = document.getElementById('ipo-logo-upload-zone');
    if (zone) {
        zone.innerHTML = `<div style="font-size:18px;color:var(--text-tertiary);">⬆</div>
            <div style="font-size:10px;color:var(--text-tertiary);">Click to upload</div>

    const rmBtn = document.querySelector('.ipo-logo-remove-btn');
    if (rmBtn) rmBtn.remove();
    const fileInput = document.getElementById('ipo-logo-file-input');
    if (fileInput) fileInput.value = '';
    const errEl = document.getElementById('ipo-logo-upload-error');
    if (errEl) errEl.style.display = 'none';
}

    const sel = document.getElementById('ipo-add-article-select');
    if (!sel || !sel.value) return;
    const key = sel.value;
    const defaults = {
        leadership:  { type: 'rotation', termYears: 2, votingWeight: 'equal', votePass: 'majority' },
        membership:  { admission: 'vote', ideologicalThreshold: { enabled: false, directions: [] }, expulsionClause: null },
        governance:  { actionLeadership: 'unilateral', voteTransparency: 'public', observerStatus: false, vetoRight: null, emergencyPowers: false },
        resources:   { solidarityFund: { enabled: false, contributionPerQuarter: 1 }, resourceSharingCap: null, jointStatementClause: 'vote', headquarters: null }
    };
    ipoActiveArticles().push({ type: key, config: defaults[key] || {} });
    ipoReRenderActiveEditor();
}

function ipoRemoveArticle(index) {
    const articles = ipoActiveArticles();
    if (articles[index]?.type === 'mission') return; // Cannot remove mission
    articles.splice(index, 1);
    ipoReRenderActiveEditor();
}

function renderIPOArticleCard(art, index) {
    const typeDef = IPO_ARTICLE_TYPES.find(t => t.key === art.type);
    const label = typeDef?.label || art.type;
    const canRemove = art.type !== 'mission';
    const removeBtn = canRemove ? `<button class="ipo-article-remove" onclick="ipoRemoveArticle(${index})">&times;</button>` : '';

    let fields = '';
    switch (art.type) {
        case 'mission': fields = renderMissionFields(art, index); break;
        case 'leadership': fields = renderLeadershipFields(art, index); break;
        case 'membership': fields = renderMembershipFields(art, index); break;
        case 'governance': fields = renderGovernanceFields(art, index); break;
        case 'resources': fields = renderResourcesFields(art, index); break;
    }

    return `
        <div class="ipo-article-card">
            <div class="ipo-article-card-header">
                <span class="ipo-article-label">${label}</span>
                ${removeBtn}
            </div>
            <div class="ipo-article-card-body">${fields}</div>
        </div>`;
}

function renderMembershipFields(art, idx) {
    const c = art.config;
    const thresh = c.ideologicalThreshold || { enabled: false, directions: [] };
    const dirs = thresh.directions || [];

    const ideologyCheckboxes = IPO_IDEOLOGY_AXES.map(axis => {
        const checks = axis.poles.map(pole => {
            const checked = dirs.includes(pole.toLowerCase());
            // Check if the opposite pole is already selected
            const oppositePole = axis.poles.find(p => p !== pole);
            const oppositeChecked = dirs.includes(oppositePole.toLowerCase());
            return `<label class="ipo-ideology-check ${oppositeChecked ? 'ipo-disabled' : ''}" style="margin-right:12px;">
                <input type="checkbox" ${checked ? 'checked' : ''} ${oppositeChecked ? 'disabled' : ''}
                    onchange="ipoToggleIdeology(${idx},'${pole.toLowerCase()}',this.checked)" />
                ${pole}
            </label>`;
        }).join('');
        return `<div class="ipo-ideology-axis"><span class="ipo-ideology-axis-name">${axis.axis}</span>${checks}</div>`;
    }).join('');

    return `
        ${ipoRadioGroup('New Member Admission', idx, 'admission', [
            { value: 'vote', label: 'Vote Required', hint: 'Majority vote among members' },
            { value: 'president', label: 'President Decides', hint: 'President admits unilaterally' }
        ], c.admission)}
        ${ipoToggleField('Ideological Threshold', idx, 'ideologicalThreshold.enabled', thresh.enabled)}
        ${thresh.enabled ? `<div class="ipo-ideology-grid">${ideologyCheckboxes}</div>` : ''}
        ${ipoToggleField('Expulsion Clause', idx, 'expulsionClauseEnabled', !!c.expulsionClause)}
        ${c.expulsionClause ? ipoRadioGroup('Expulsion Method', idx, 'expulsionClause', [
            { value: 'president', label: 'President Only', hint: '' },
            { value: 'majority', label: 'Majority Vote', hint: '' },
            { value: 'unanimous', label: 'Unanimous Vote', hint: '' }
        ], c.expulsionClause) : ''}`;
}

function renderGovernanceFields(art, idx) {

            { value: 'committee', label: 'Committee', hint: 'All actions require a vote. Funded from solidarity fund' },
            { value: 'presidential', label: 'Presidential', hint: 'Only the president can execute actions' },

// ── Field setters ──

// Returns whichever articles array is currently being edited (create or amend)
function ipoActiveArticles() {
    return ipoAmendArticles || ipoCreateArticles;
}

function ipoReRenderActiveEditor() {
    if (ipoAmendArticles) renderIPOAmendStep();
    else renderIPOCreateStep();
}

function ipoSetArticleField(artIdx, key, value) {
    const art = ipoActiveArticles()[artIdx];
    if (!art) return;
    // Handle nested keys like 'solidarityFund.contributionPerQuarter'
    const parts = key.split('.');
    let target = art.config;
    for (let i = 0; i < parts.length - 1; i++) {
        if (!target[parts[i]]) target[parts[i]] = {};
        target = target[parts[i]];
    }
    // Try to convert to number
    const numVal = Number(value);
    target[parts[parts.length - 1]] = isNaN(numVal) ? value : numVal;
    ipoReRenderActiveEditor();
}

function ipoToggleArticleField(artIdx, key) {
    const art = ipoActiveArticles()[artIdx];
    if (!art) return;

    // Special handling for complex toggle fields
    if (key === 'ideologicalThreshold.enabled') {
        if (!art.config.ideologicalThreshold) art.config.ideologicalThreshold = { enabled: false, directions: [] };
        art.config.ideologicalThreshold.enabled = !art.config.ideologicalThreshold.enabled;
    } else if (key === 'expulsionClauseEnabled') {
        art.config.expulsionClause = art.config.expulsionClause ? null : 'majority';
    } else if (key === 'vetoRightEnabled') {
        art.config.vetoRight = art.config.vetoRight ? null : 'president';
    } else if (key === 'resourceSharingCapEnabled') {
        art.config.resourceSharingCap = art.config.resourceSharingCap != null ? null : 2;
    } else if (key === 'headquartersEnabled') {
        art.config.headquarters = art.config.headquarters != null ? null : '__self__';
    } else if (key === 'solidarityFund.enabled') {
        if (!art.config.solidarityFund) art.config.solidarityFund = { enabled: false, contributionPerQuarter: 1 };
        art.config.solidarityFund.enabled = !art.config.solidarityFund.enabled;
    } else {
        // Simple boolean toggle
        const parts = key.split('.');
        let target = art.config;
        for (let i = 0; i < parts.length - 1; i++) {
            if (!target[parts[i]]) target[parts[i]] = {};
            target = target[parts[i]];
        }
        target[parts[parts.length - 1]] = !target[parts[parts.length - 1]];
    }
    ipoReRenderActiveEditor();
}

function ipoToggleIdeology(artIdx, direction, checked) {
    const art = ipoActiveArticles()[artIdx];
    if (!art) return;
    const thresh = art.config.ideologicalThreshold;
    if (!thresh) return;
    if (checked) {
        if (!thresh.directions.includes(direction)) thresh.directions.push(direction);
    } else {
        thresh.directions = thresh.directions.filter(d => d !== direction);
    }
    ipoReRenderActiveEditor();
}

    const apCost = 4 + Math.max(0, ipoCreateArticles.length - 1);

        return `<div class="ipo-confirm-article">
            <span class="ipo-confirm-article-label">${typeDef?.label || art.type}</span>

    }).join('');

    return `
        <div class="ipo-confirm-preview">
            <div class="ipo-confirm-identity">
                ${ipoCreateLogoPreviewUrl
                    ? `<img src="${ipoCreateLogoPreviewUrl}" class="ipo-header-logo ipo-logo-img" alt="" />`
                    : `<span class="ipo-header-logo">${escapeHtml(ipoCreateLogoSymbol)} ${escapeHtml(ipoCreateLogoText)}</span>`}
                <div>
                    <div style="font-family:var(--font-sans);font-size:13px;font-weight:700;color:#e2d9b4;">${escapeHtml(ipoCreateName)}</div>
                    ${ipoCreateDesc ? `<div style="font-family:var(--font-sans);font-size:10px;color:#6b6a5e;margin-top:2px;">${escapeHtml(ipoCreateDesc)}</div>` : ''}
                </div>
            </div>
            <div class="ipo-confirm-articles">${articleSummary}</div>
            <div class="ipo-confirm-cost">
                <div class="ipo-confirm-cost-row">
                    <span>Base cost</span><span>4 AP</span>
                </div>
                ${ipoCreateArticles.length > 1 ? `<div class="ipo-confirm-cost-row">
                    <span>Extra articles (${ipoCreateArticles.length - 1})</span><span>${ipoCreateArticles.length - 1} AP</span>
                </div>` : ''}
                <div class="ipo-confirm-cost-row ipo-confirm-cost-total">
                    <span>Total</span><span>${apCost} AP</span>
                </div>
            </div>
        </div>
        <div class="wizard-nav">
            <button class="wizard-back-btn" onclick="ipoSetCreateStep(2)">Back</button>
            <button class="ipo-btn ipo-btn--create-large" onclick="submitIPOCreation()">
                Create Organisation — ${apCost} AP
            </button>
        </div>`;
}

function getArticleSummary(art) {
    const c = art.config;
    switch (art.type) {
        case 'mission': return escapeHtml((c.text || '').substring(0, 80)) + ((c.text||'').length > 80 ? '...' : '');
        case 'leadership': {
            const labels = { rotation: 'Rotation', most_seats: 'Most Seats', random: 'Random' };
            return `${labels[c.type] || c.type} · ${c.termYears}yr · ${c.votingWeight === 'equal' ? 'Equal' : 'Seat Share'} · ${c.votePass === 'unanimous' ? 'Unanimous' : 'Majority'}`;
        }
        case 'membership': {
            const parts = [c.admission === 'vote' ? 'Vote admission' : 'President admits'];
            if (c.ideologicalThreshold?.enabled && c.ideologicalThreshold.directions?.length)
                parts.push('Ideology: ' + c.ideologicalThreshold.directions.join(', '));
            if (c.expulsionClause) parts.push('Expulsion: ' + c.expulsionClause);
            return parts.join(' · ');
        }
        case 'governance': {
            const parts = [c.voteTransparency === 'public' ? 'Public ballot' : 'Secret ballot'];
            if (c.observerStatus) parts.push('Observers');
            if (c.vetoRight) parts.push('Veto: ' + c.vetoRight);
            if (c.emergencyPowers) parts.push('Emergency powers');
            return parts.join(' · ');
        }
        case 'resources': {
            const parts = [];
            if (c.solidarityFund?.enabled) parts.push('Fund: ' + c.solidarityFund.contributionPerQuarter + ' AP/qtr');
            if (c.resourceSharingCap != null) parts.push('Cap: ' + c.resourceSharingCap + '/term');
            parts.push('Statements: ' + (c.jointStatementClause === 'president' ? 'President' : 'Vote'));
            if (c.headquarters != null) parts.push('HQ enabled');
            return parts.join(' · ');
        }
        default: return '';
    }
}

// ── Submit creation ──
async function submitIPOCreation() {
    if (!currentFaction || !currentNation) return;
    if (_ipoActionLock) return;
    _ipoActionLock = true;

    const apCost = 4 + Math.max(0, ipoCreateArticles.length - 1);

    // Build charter JSONB
    const charter = {};
    for (const art of ipoCreateArticles) {
        switch (art.type) {
            case 'mission':
                charter.mission = art.config.text || '';
                break;
            case 'leadership':
                charter.leadership = {
                    type: art.config.type,
                    termYears: Number(art.config.termYears),
                    votingWeight: art.config.votingWeight,
                    votePass: art.config.votePass
                };
                break;
            case 'membership':
                charter.membership = {
                    admission: art.config.admission,
                    ideologicalThreshold: art.config.ideologicalThreshold || { enabled: false, directions: [] },
                    expulsionClause: art.config.expulsionClause || null
                };
                break;
            case 'governance':
                charter.governance = {
                    voteTransparency: art.config.voteTransparency,
                    observerStatus: !!art.config.observerStatus,
                    vetoRight: art.config.vetoRight || null,
                    emergencyPowers: !!art.config.emergencyPowers
                };
                break;
            case 'resources':
                charter.resources = {
                    solidarityFund: art.config.solidarityFund || { enabled: false, contributionPerQuarter: 1 },
                    resourceSharingCap: art.config.resourceSharingCap ?? null,
                    jointStatementClause: art.config.jointStatementClause || 'vote',
                    headquarters: art.config.headquarters === '__self__' ? currentNation.id : (art.config.headquarters || null)
                };
                break;
        }
    }

    // Set defaults for articles not added
    if (!charter.leadership) charter.leadership = { type: 'rotation', termYears: 2, votingWeight: 'equal', votePass: 'majority' };
    if (!charter.membership) charter.membership = { admission: 'vote', ideologicalThreshold: { enabled: false, directions: [] }, expulsionClause: null };
    if (!charter.governance) charter.governance = { voteTransparency: 'public', observerStatus: false, vetoRight: null, emergencyPowers: false };
    if (!charter.resources) charter.resources = { solidarityFund: { enabled: false, contributionPerQuarter: 1 }, resourceSharingCap: null, jointStatementClause: 'vote', headquarters: null };

    try {
        // Upload custom logo image BEFORE deducting AP (failable, no side effects to undo)
        let logoImageUrl = null;
        if (ipoCreateLogoFile) {
            const ext = ipoCreateLogoFile.name.split('.').pop() || 'png';
            const filePath = `ipo-logos/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
            const { error: uploadErr } = await _supabase.storage
                .from('public-assets')
                .upload(filePath, ipoCreateLogoFile, { contentType: ipoCreateLogoFile.type, upsert: true });
            if (uploadErr) {
                console.error('[IPO] Logo upload failed:', uploadErr.message);
                alert('Logo upload failed: ' + uploadErr.message);
                return;
            }
            const { data: urlData } = _supabase.storage.from('public-assets').getPublicUrl(filePath);
            logoImageUrl = urlData?.publicUrl || null;
        }

        // Deduct AP (after logo upload succeeds, before org creation)
        const apResult = await deductAP(_supabase, currentFaction.id, apCost);
        if (!apResult.success) {
            alert('Insufficient AP. You need ' + apCost + ' AP to create this organisation.');
            return;
        }

        // Create org
        const { data: newOrg, error: orgErr } = await _supabase
            .from('international_orgs')
            .insert({
                name: ipoCreateName.trim(),
                description: ipoCreateDesc.trim() || null,
                logo_symbol: ipoCreateLogoSymbol,
                logo_text: ipoCreateLogoText.trim().toUpperCase(),
                logo_image_url: logoImageUrl,
                founded_at_tick: shardTick,
                founding_party_id: currentFaction.id,
                president_id: currentFaction.id,
                president_term_start_tick: shardTick,
                headquarters_nation_id: charter.resources.headquarters,
                solidarity_fund_balance: 0,
                charter: charter
            })
            .select('id')
            .single();

        if (orgErr) {
            console.error('[IPO] Create org error:', orgErr);
            // Refund AP since org creation failed
            await _supabase.from('factions').update({ action_points: (currentFaction.action_points || 0) + apCost }).eq('id', currentFaction.id);
            alert('Failed to create organisation: ' + orgErr.message);
            return;
        }

        // Add founding member (critical — org is broken without this)
        const chatColor = IPO_CHAT_COLORS[0];
        const { error: memberErr } = await _supabase.from('ipo_members').insert({
            org_id: newOrg.id,
            faction_id: currentFaction.id,
            role: 'member',
            joined_at_tick: shardTick,
            chat_color: chatColor
        });
        if (memberErr) {
            console.error('[IPO] Failed to add founding member:', memberErr.message);
        }

        // System chat message
        await _supabase.from('ipo_chat').insert({
            org_id: newOrg.id,
            faction_id: null,
            is_system: true,
            message_text: `${escapeHtml(ipoCreateName.trim())} has been founded by ${currentFaction.faction_name}.`,
            tick_posted: shardTick
        });

        // Event log entry
        await _supabase.from('event_log').insert({
            nation_id: currentNation.id,
            event_name: `${currentFaction.faction_name} has founded ${ipoCreateName.trim()}.`,
            trigger_key: 'ipo_founded',
            category: 'international',
            effects_applied: { org_name: ipoCreateName.trim(), party: currentFaction.faction_name },
            fired_at_tick: shardTick
        });

        closeIPOCreationModal();
        ipoSelectedOrgId = newOrg.id;
        renderIPOView();
    } catch (e) {
        console.error('[IPO] Creation error:', e);
        alert('Failed to create organisation.');
    } finally {
        _ipoActionLock = false;
    }
}
