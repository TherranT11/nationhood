                        </div>
                        <div style="display:flex;gap:6px;align-items:center;">

                            ${ipoVoteLogoPreviewUrl ? '<button onclick="ipoVoteRemoveLogo()" style="font-family:var(--font-mono);font-size:8px;padding:3px 8px;background:none;border:1px solid rgba(217,83,79,0.3);color:var(--red);cursor:pointer;border-radius:2px;">Remove</button>' : ''}
                            <input type="file" accept="image/png,image/jpeg,image/webp" id="ipo-vote-logo-file" style="display:none" onchange="ipoVoteHandleLogoFile(this)">
                        </div>
                    </div>
                </div>`;
            break;
        }
    }

    // Title field (auto-generated but editable)
    const defaultTitle = `${typeLabel} Vote`;

    inner.innerHTML = `
        <div class="ipo-modal-header">
            <span class="ipo-modal-title">Propose: ${typeLabel}</span>
            <button class="modal-close" onclick="closeIPOVoteModal()">&times;</button>
        </div>
        <div class="ipo-modal-body">
            <label class="ipo-vote-form-label">Vote Title</label>
            <input type="text" id="ipo-vote-title" class="ipo-vote-form-input" value="${defaultTitle}" maxlength="120" />
            ${formFields}
            <div class="wizard-nav" style="margin-top:16px;">
                <button class="wizard-back-btn" onclick="renderIPOVoteModalTypeSelect()">Back</button>
                <button class="ipo-btn ipo-btn--create-large" onclick="submitIPOVote()">Propose Vote</button>
            </div>
        </div>`;
}

/**
 * Submit a new vote proposal.
 */
async function submitIPOVote() {
    if (_ipoActionLock) return;
    if (!currentFaction || !ipoSelectedOrgId || !ipoVoteModalType) return;

    const title = document.getElementById('ipo-vote-title')?.value?.trim();
    if (!title) { alert('Please enter a vote title.'); return; }

    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    const org = membership?.org;

    // Build meta based on vote type
    const meta = {};
    switch (ipoVoteModalType) {
        case 'membership': {
            const sel = document.getElementById('ipo-vote-meta-invite');
            if (!sel || !sel.value) { alert('No applicant selected.'); return; }
            meta.invite_id = sel.value;
            meta.target_faction_id = sel.selectedOptions[0]?.dataset.fid || null;
            meta.target_faction_name = sel.selectedOptions[0]?.dataset.name || 'Unknown';
            break;
        }
        case 'expulsion': {
            const sel = document.getElementById('ipo-vote-meta-target');
            if (!sel || !sel.value) { alert('No member selected.'); return; }
            meta.target_faction_id = sel.value;
            const member = ipoVoteMembers.find(m => m.faction_id === sel.value);
            meta.target_faction_name = member?.factions?.faction_name || 'Unknown';
            break;
        }
        case 'joint_statement': {
            const stmt = document.getElementById('ipo-vote-meta-statement')?.value?.trim();
            if (!stmt) { alert('Please write the statement text.'); return; }
            meta.statement_text = stmt;
            meta.visibility = document.getElementById('ipo-vote-meta-visibility')?.value || 'public';
            break;
        }
        case 'fund_draw': {
            const amount = parseInt(document.getElementById('ipo-vote-meta-amount')?.value);
            if (!amount || amount < IPO_AP_TO_CASH) { alert('Enter at least ' + fmtIPOCash(IPO_AP_TO_CASH) + '.'); return; }
            const balance = Number(org?.solidarity_fund_balance) || 0;
            if (amount > balance) { alert('Amount exceeds fund balance.'); return; }
            meta.amount_requested = amount;
            meta.proposer_name = currentFaction.faction_name;
            meta.purpose = document.getElementById('ipo-vote-meta-purpose')?.value?.trim() || '';
            break;
        }
        case 'charter_amendment': {
            meta.article_type = document.getElementById('ipo-vote-meta-article')?.value || 'mission';
            meta.description = document.getElementById('ipo-vote-meta-desc')?.value?.trim() || '';
            if (!meta.description) { alert('Please describe the proposed changes.'); return; }
            break;
        }
        case 'change_headquarters': {
            const sel = document.getElementById('ipo-vote-meta-nation');
            if (!sel || !sel.value) { alert('Select a nation.'); return; }
            meta.proposed_nation_id = sel.value;
            meta.proposed_nation_name = sel.selectedOptions[0]?.textContent || '';
            break;
        }
        case 'symposium': {
            const sel = document.getElementById('ipo-vote-meta-nation');
            if (!sel || !sel.value) { alert('Select a target nation.'); return; }
            meta.target_nation_id = sel.value;
            meta.target_nation_name = sel.selectedOptions[0]?.textContent || '';
            meta.axis = document.getElementById('ipo-vote-meta-axis')?.value || 'economic';
            meta.direction = document.getElementById('ipo-vote-meta-direction')?.value || 'left';
            break;
        }
        case 'change_logo': {
            const symbol = (ipoVoteLogo?.symbol || '').trim();
            const text = (ipoVoteLogo?.text || '').trim();
            const currentSymbol = (org?.logo_symbol || '').trim();
            const currentText = (org?.logo_text || '').trim();
            const currentImage = org?.logo_image_url || null;
            const willUploadNewImage = !!ipoVoteLogoFile;
            const proposedImage = willUploadNewImage ? '__pending__' : (ipoVoteLogo?.image_url || null);
            const symbolChanged = symbol !== currentSymbol;
            const textChanged = text !== currentText;
            const imageChanged = willUploadNewImage || (proposedImage !== currentImage);
            if (!symbolChanged && !textChanged && !imageChanged) {
                alert('No changes to propose. Edit the symbol, text, or image first.');
                return;
            }
            // Defer cash + upload until after open-vote-limit check below.
            break;
        }
    }

    _ipoActionLock = true;
    try {
        if (!await _checkOpenVoteLimit(ipoSelectedOrgId)) {
            alert(`This organisation already has ${IPO_MAX_OPEN_VOTES} open votes. Wait for some to close before proposing new ones.`);
            return;
        }

        // change_logo: charge $50k, upload image if any, finalise meta.proposed_logo
        if (ipoVoteModalType === 'change_logo') {
            const cashResult = await deductIPOCash(currentFaction.id, IPO_AP_TO_CASH);
            if (!cashResult.success) {
                alert('Not enough cash. Logo change votes cost ' + fmtIPOCash(IPO_AP_TO_CASH) + '.');
                return;
            }
            currentFaction.party_funds = cashResult.newFunds;

            let proposedLogoImageUrl = ipoVoteLogo?.image_url || null;
            if (ipoVoteLogoFile) {
                const ext = ipoVoteLogoFile.name.split('.').pop().toLowerCase();
                const filePath = `ipo-logos/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
                const { error: upErr } = await _supabase.storage.from('public-assets').upload(filePath, ipoVoteLogoFile, { upsert: true });
                if (upErr) {
                    console.error('[IPO] Logo upload error:', upErr);
                    alert('Failed to upload logo: ' + upErr.message);
                    return;
                }
                const { data: urlData } = _supabase.storage.from('public-assets').getPublicUrl(filePath);
                proposedLogoImageUrl = urlData?.publicUrl || null;
            }

            meta.proposed_logo = {
                symbol: ipoVoteLogo?.symbol || '',
                text: ipoVoteLogo?.text || '',
                image_url: proposedLogoImageUrl
            };
        }

        const { error } = await _supabase.from('ipo_votes').insert({
            org_id: ipoSelectedOrgId,
            title: title,
            vote_type: ipoVoteModalType,
            meta: meta,
            status: 'open',
            opened_at_tick: shardTick,
            closes_at_tick: shardTick + IPO_VOTE_DURATION,
            proposed_by: currentFaction.id
        });

        if (error) {
            console.error('[IPO Vote] Insert error:', error);
            alert('Failed to propose vote: ' + error.message);
            return;
        }

        // System chat message
        await _supabase.from('ipo_chat').insert({
            org_id: ipoSelectedOrgId,
            faction_id: null,
            is_system: true,
            message_text: `${currentFaction.faction_name} proposed a vote: ${title}`,
            tick_posted: shardTick
        });

        closeIPOVoteModal();
        await loadIPOVotes(ipoSelectedOrgId);
    } catch (e) {
        console.error('[IPO Vote] Submit exception:', e);
        alert('Failed to propose vote.');
    } finally {
        _ipoActionLock = false;
    }
}

// ── Ballot Casting ──

let _pendingBallot = {};  // { voteId: ballotValue }

function selectIPOBallot(voteId, ballotValue) {
    _pendingBallot[voteId] = ballotValue;
    const row = document.getElementById(`ipo-ballot-row-${voteId}`);
    const confirm = document.getElementById(`ipo-ballot-confirm-${voteId}`);
    const choiceEl = document.getElementById(`ipo-ballot-choice-${voteId}`);
    if (row) row.style.display = 'none';
    if (confirm) confirm.style.display = 'flex';
    if (choiceEl) {
        // For leadership elections, show candidate name instead of raw ID
        const btn = row?.querySelector(`[onclick*="'${ballotValue}'"]`);
        const candidateName = btn?.getAttribute('data-candidate-name');
        choiceEl.textContent = candidateName || ballotValue.toUpperCase();
        choiceEl.className = candidateName ? 'ipo-vote-choice--candidate' : `ipo-vote-choice--${ballotValue}`;
    }
}

function cancelIPOBallot(voteId) {
    delete _pendingBallot[voteId];
    const row = document.getElementById(`ipo-ballot-row-${voteId}`);
    const confirm = document.getElementById(`ipo-ballot-confirm-${voteId}`);
    if (row) row.style.display = 'flex';
    if (confirm) confirm.style.display = 'none';
}

async function confirmIPOBallot(voteId) {
    const ballotValue = _pendingBallot[voteId];
    if (!ballotValue) return;
    delete _pendingBallot[voteId];
    await castIPOBallot(voteId, ballotValue);
}

/**
 * Cast a ballot on an open vote.
 */
async function castIPOBallot(voteId, ballotValue) {
    if (_ipoActionLock) return;
    if (!currentFaction || !ipoSelectedOrgId) return;

    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    if (!membership || membership.role === 'observer') return;

    const org = membership.org;
    const charter = org?.charter || {};
    const isSecret = charter.governance?.voteTransparency === 'secret';

    _ipoActionLock = true;
    try {
        const insertData = {
            vote_id: voteId,
            ballot: ballotValue,
            cast_at_tick: shardTick
        };

        // Always store faction_id for DB uniqueness enforcement.
        // For secret ballots, the UI hides voter identity (breakdown not shown).
        insertData.faction_id = currentFaction.id;

        const { error } = await _supabase.from('ipo_ballots').insert(insertData);

        if (error) {
            console.error('[IPO Ballot] Insert error:', error);
            if (error.code === '23505') {
                alert('You have already voted on this measure.');
            } else {
                alert('Failed to cast ballot: ' + error.message);
            }
            return;
        }

        // Post ballot to chat (secret ballots show "a member voted", public show faction name)
        const voteForChat = ipoVotes.find(v => v.id === voteId);
        const voteTitle = voteForChat?.title || 'a vote';
        let ballotLabel;
        if (voteForChat?.vote_type === 'leadership_election' && ballotValue !== 'abstain') {
            const candidates = (voteForChat.meta && voteForChat.meta.candidates) || [];
            const chosen = candidates.find(c => c.faction_id === ballotValue);
            ballotLabel = `for ${chosen?.faction_name || 'a candidate'}`;
        } else {
            ballotLabel = ballotValue === 'yes' ? 'YES' : ballotValue === 'no' ? 'NO' : 'ABSTAIN';
        }
        if (isSecret) {
            await _supabase.from('ipo_chat').insert({
                org_id: ipoSelectedOrgId, faction_id: null, is_system: true,
                message_text: `A member cast a ballot on "${voteTitle}".`,
                tick_posted: shardTick
            });
        } else {
            await _supabase.from('ipo_chat').insert({
                org_id: ipoSelectedOrgId, faction_id: null, is_system: true,
                message_text: `${currentFaction.faction_name} voted ${ballotLabel} on "${voteTitle}".`,
                tick_posted: shardTick
            });
        }

        // President-decides: if this is a membership vote with president_decides flag,
        // and the president just voted yes, auto-resolve immediately (admit the member)
        const vote = voteForChat;
        if (vote && vote.meta?.president_decides && org.president_id === currentFaction.id && (ballotValue === 'yes' || ballotValue === 'no')) {
            const approved = ballotValue === 'yes';
            try {
                await _supabase.from('ipo_votes').update({
                    status: approved ? 'passed' : 'failed',
                    result: { yes: approved ? 1 : 0, no: approved ? 0 : 1, abstain: 0, passed: approved, president_approved: approved },
                    resolved_at_tick: shardTick
                }).eq('id', voteId).eq('status', 'open');

                if (approved) {
                    await applyVoteEffects(vote, org);
                }

                await _supabase.from('ipo_chat').insert({
                    org_id: ipoSelectedOrgId,
                    faction_id: null,
                    is_system: true,
                    message_text: approved
                        ? `The President has approved the admission of ${vote.meta.target_faction_name || 'a faction'}.`
                        : `The President has denied the admission of ${vote.meta.target_faction_name || 'a faction'}.`,
                    tick_posted: shardTick
                });
            } catch (resolveErr) {
                console.error('[IPO] President auto-resolve failed:', resolveErr);
            }
        }

        // Reload votes to reflect the new ballot
        await loadIPOVotes(ipoSelectedOrgId);
    } catch (e) {
        console.error('[IPO Ballot] Cast exception:', e);
        alert('Failed to cast ballot.');
    } finally {
        _ipoActionLock = false;
    }
}

// ── Vote Resolution ──

/**
 * Resolve an open vote: tally ballots, check threshold + veto, update result.
 */
async function resolveIPOVote(voteId) {
    if (_ipoActionLock) return;
    if (!currentFaction || !ipoSelectedOrgId) return;

    const vote = ipoVotes.find(v => v.id === voteId);
    if (!vote || vote.status !== 'open') return;
    if (!confirm(`Resolve vote "${vote.title}"? This will tally ballots and determine the outcome.`)) return;

    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    const org = membership?.org;
    const charter = org?.charter || {};
    const leadership = charter.leadership || {};
    const governance = charter.governance || {};
    const votePass = leadership.votePass || 'majority';

    // Tally ballots
    const ballots = ipoVoteBallots[voteId] || [];
    const totalEligible = ipoVoteMembers.length;
    const isElection = vote.vote_type === 'leadership_election';

    let result, newStatus;

    if (isElection) {
        // Candidate-based tally (shared helper)
        const { voteTally, abstainCount, winnerId, maxVotes } = tallyElectionBallots(ballots, org.president_id);

        result = { tally: voteTally, winner: winnerId, abstain: abstainCount, total_ballots: ballots.length };
        newStatus = 'passed'; // Elections always "pass" — they produce a winner

        _ipoActionLock = true;
        try {
            const { error, data } = await _supabase
                .from('ipo_votes')
                .update({ status: newStatus, result, resolved_at_tick: shardTick })
                .eq('id', voteId)
                .eq('status', 'open')
                .select();

            if (error) {
                console.error('[IPO Vote] Resolve error:', error);
                alert('Failed to resolve vote: ' + error.message);
                return;
            }
            if (!data || data.length === 0) {
                alert('Could not resolve vote. It may have already been resolved, or you may lack permission.');
                await loadIPOVotes(ipoSelectedOrgId);
                return;
            }

            // Update president
            // NOTE: RLS on international_orgs may block client-side updates if
            // president_id column doesn't match auth.uid(). The auto-resolution
            // in advance-tick (service role) handles this reliably as a fallback.
            const { error: presErr } = await _supabase.from('international_orgs')
                .update({ president_id: winnerId, president_term_start_tick: shardTick })
                .eq('id', org.id);
            if (presErr) console.error('[IPO Vote] President update error (may be RLS):', presErr);

            const candidates = (vote.meta && vote.meta.candidates) || [];
            const winnerCandidate = candidates.find(c => c.faction_id === winnerId);
            const winnerName = winnerCandidate?.faction_name || 'Unknown';

            await _supabase.from('ipo_chat').insert({
                org_id: ipoSelectedOrgId, faction_id: null, is_system: true,
                message_text: `Leadership Election Result: ${winnerName} elected president with ${maxVotes} vote${maxVotes !== 1 ? 's' : ''} (${ballots.length} total ballots).`,
                tick_posted: shardTick
            });

            await loadIPOVotes(ipoSelectedOrgId);
        } catch (e) {
            console.error('[IPO Vote] Resolve exception:', e);
            alert('Failed to resolve vote.');
        } finally {
            _ipoActionLock = false;
        }
        return;
    }

    // Standard yes/no/abstain tally
    const yes = ballots.filter(b => b.ballot === 'yes').length;
    const no = ballots.filter(b => b.ballot === 'no').length;
    const abstain = ballots.filter(b => b.ballot === 'abstain').length;

    // Determine if passed
    const totalCast = yes + no + abstain;
    let passed = false;
    if (totalCast === 0) {
        passed = false;
    } else if (votePass === 'unanimous') {
        passed = yes === totalCast && no === 0;
    } else {
        passed = (yes / totalCast) > 0.5;
    }

    // Veto check
    if (passed && governance.vetoRight) {
        const vetoHolderId = getVetoHolder(org, governance.vetoRight);
        if (vetoHolderId) {
            const vetoBallot = ballots.find(b => b.faction_id === vetoHolderId);
            if (vetoBallot && vetoBallot.ballot === 'no') {
                passed = false;
            }
        }
    }

    // For expulsion votes, check the expulsion clause threshold too
    if (vote.vote_type === 'expulsion' && totalEligible > 0) {
        const expClause = charter.membership?.expulsionClause;
        if (expClause === 'unanimous') {
            passed = yes === totalEligible && no === 0;
        }
    }

    result = { yes, no, abstain, passed };
    newStatus = passed ? 'passed' : 'failed';

    _ipoActionLock = true;
    try {
        const { error, data } = await _supabase
            .from('ipo_votes')
            .update({ status: newStatus, result: result, resolved_at_tick: shardTick })
            .eq('id', voteId)
            .eq('status', 'open')
            .select();

        if (error) {
            console.error('[IPO Vote] Resolve error:', error);
            alert('Failed to resolve vote: ' + error.message);
            return;
        }

        if (!data || data.length === 0) {
            alert('Could not resolve vote. It may have already been resolved, or you may lack permission. Please refresh the page and try again.');
            await loadIPOVotes(ipoSelectedOrgId);
            return;
        }

        if (passed) {
            try {
                await applyVoteEffects(vote, org);
            } catch (effectErr) {
                console.error('[IPO Vote] Effect application error:', effectErr);
            }
        }

        // Reject membership invite if vote failed
        if (!passed && vote.vote_type === 'membership' && vote.meta?.invite_id) {
            await _supabase.from('ipo_invitations')
                .update({ status: 'declined', responded_at_tick: shardTick })
                .eq('id', vote.meta.invite_id);
        }

        const outcomeText = passed ? 'PASSED' : 'FAILED';
        await _supabase.from('ipo_chat').insert({
            org_id: ipoSelectedOrgId, faction_id: null, is_system: true,
            message_text: `Vote "${vote.title}" has ${outcomeText} (${yes}Y / ${no}N / ${abstain}A).`,
            tick_posted: shardTick
        });

        await loadIPOVotes(ipoSelectedOrgId);
    } catch (e) {
        console.error('[IPO Vote] Resolve exception:', e);
        alert('Failed to resolve vote.');
    } finally {
        _ipoActionLock = false;
    }
}

/**
 * Get the faction ID of whoever holds veto power.
 */
function getVetoHolder(org, vetoRight) {
    switch (vetoRight) {
        case 'president': return org.president_id;
        case 'founding': return org.founding_party_id;
        case 'hq': {
            // The member party whose nation matches the HQ nation
            if (!org.headquarters_nation_id) return null;
            const hqMember = ipoVoteMembers.find(m => m.factions?.nation_id === org.headquarters_nation_id);
            return hqMember?.faction_id || null;
        }
        default: return null;
    }
}

/**
 * Apply side-effects when a vote passes.
 */
async function applyVoteEffects(vote, org) {
    const meta = vote.meta || {};

    switch (vote.vote_type) {
        case 'membership': {
            if (!meta.target_faction_id) break;

            // If invite-based, mark the invitation as accepted
            if (meta.invite_id) {
                await _supabase.from('ipo_invitations')
                    .update({ status: 'accepted', responded_at_tick: shardTick })
                    .eq('id', meta.invite_id);
            }

            const admitRole = meta.requested_role || 'member';

            let factionsToAdmit = [{ id: meta.target_faction_id, name: meta.target_faction_name }];

            // Track failures so we can surface them. Previously the INSERT had
            // no error capture and no .select() — RLS silent rejects (and any
            // other zero-row failure) let the "admitted" chat message fire even
            // when no row landed in ipo_members. The chat lied to the player.
            const admitFailures = [];

            for (const f of factionsToAdmit) {
                const color = await assignIPOChatColor(ipoSelectedOrgId);
                const { data: insertedRows, error: insertErr } = await _supabase.from('ipo_members')
                    .insert({
                        org_id: ipoSelectedOrgId,
                        faction_id: f.id,
                        role: admitRole,
                        joined_at_tick: shardTick,
                        chat_color: color
                    })
                    .select('id');

                if (insertErr) {
                    console.error(`[IPO] Failed to admit ${f.name}:`, insertErr);
                    admitFailures.push({ name: f.name, reason: insertErr.message });
                } else if (!insertedRows || insertedRows.length === 0) {
                    // RLS check returned 0 rows without raising an error — silent permission denial.
                    console.error(`[IPO] Admit ${f.name} returned 0 rows — RLS silently rejected the insert.`);
                    admitFailures.push({ name: f.name, reason: 'permission denied' });
                }
            }

            if (admitFailures.length > 0) {
                const msg = admitFailures.map(x => `${x.name}: ${x.reason}`).join('\n');
                alert(`Failed to admit:\n\n${msg}\n\nNo membership row was created. Check console for details.`);
                break;
            }

            const admitMsg = `${meta.target_faction_name || 'A new party'} has been admitted as ${admitRole === 'observer' ? 'an observer' : 'a member'}.`;
            await _supabase.from('ipo_chat').insert({
                org_id: ipoSelectedOrgId,
                faction_id: null,
                is_system: true,
                message_text: admitMsg,
                tick_posted: shardTick
            });
            break;
        }
        case 'expulsion': {
            if (meta.target_faction_id) {
                await _supabase.from('ipo_members')
                    .update({ is_active: false, left_at_tick: shardTick })
                    .eq('org_id', ipoSelectedOrgId)
                    .eq('faction_id', meta.target_faction_id)
                    .eq('is_active', true);

                await _supabase.from('ipo_chat').insert({
                    org_id: ipoSelectedOrgId,
                    faction_id: null,
                    is_system: true,
                    message_text: `${meta.target_faction_name || 'A member'} has been expelled from the organisation.`,
                    tick_posted: shardTick
                });

                // If the expelled member was the president, auto-succeed to next member
                if (org.president_id === meta.target_faction_id) {
                    const remaining = ipoVoteMembers.filter(m => m.faction_id !== meta.target_faction_id);
                    if (remaining.length > 0) {
                        const newPresId = remaining[0].faction_id;
                        await _supabase.from('international_orgs')
                            .update({ president_id: newPresId, president_term_start_tick: shardTick })
                            .eq('id', ipoSelectedOrgId);
                        const newPresName = remaining[0].factions?.faction_name || 'A member';
                        await _supabase.from('ipo_chat').insert({
                            org_id: ipoSelectedOrgId,
                            faction_id: null,
                            is_system: true,
                            message_text: `${newPresName} is now president (previous president expelled).`,
                            tick_posted: shardTick
                        });
                    }
                }
            }
            break;
        }
        case 'fund_draw': {
            if (meta.amount_requested && meta.amount_requested > 0 && vote.proposed_by) {
                const currentBalance = Number(org.solidarity_fund_balance) || 0;
                const actualDraw = Math.min(meta.amount_requested, currentBalance);
                if (actualDraw <= 0) break;

                // Debit the fund via RPC (RLS would otherwise require president).
                const { error: debitErr } = await _supabase.rpc('ipo_debit_solidarity_fund', {
                    p_org_id: ipoSelectedOrgId,
                    p_amount: actualDraw
                });
                if (debitErr) {
                    console.error('[IPO] Fund-draw debit failed:', debitErr);
                    alert('Failed to draw from fund: ' + debitErr.message);
                    break;
                }

                // Credit the proposer via RPC (RLS would otherwise block cross-faction write).
                const { error: creditErr } = await _supabase.rpc('ipo_credit_party_funds', {
                    p_target_faction_id: vote.proposed_by,
                    p_amount: actualDraw,
                    p_org_id: ipoSelectedOrgId
                });
                if (creditErr) {
                    console.error('[IPO] Fund-draw credit failed:', creditErr);
                    alert('Fund debited but proposer credit FAILED — contact an admin to reconcile. Error: ' + creditErr.message);
                }

                await _supabase.from('ipo_fund_transactions').insert({
                    org_id: ipoSelectedOrgId,
                    faction_id: vote.proposed_by,
                    transaction_type: 'draw',
                    amount: -actualDraw,
                    description: meta.purpose || 'Fund draw',
                    tick: shardTick
                });

                await _supabase.from('ipo_chat').insert({
                    org_id: ipoSelectedOrgId,
                    faction_id: null,
                    is_system: true,
                    message_text: `Fund draw approved: ${fmtIPOCash(actualDraw)} withdrawn and credited. ${meta.purpose ? 'Purpose: ' + meta.purpose : ''}`,
                    tick_posted: shardTick
                });
            }
            break;
        }
        case 'change_headquarters': {
            if (meta.proposed_nation_id) {
                await _supabase.from('international_orgs')
                    .update({ headquarters_nation_id: meta.proposed_nation_id })
                    .eq('id', ipoSelectedOrgId);
            }
            break;
        }
        case 'joint_statement': {
            // Post the statement as a system chat message
            if (meta.statement_text) {
                const visibility = meta.visibility === 'private' ? ' (private)' : '';
                await _supabase.from('ipo_chat').insert({
                    org_id: ipoSelectedOrgId,
                    faction_id: null,
                    is_system: true,
                    message_text: `JOINT STATEMENT${visibility}: "${meta.statement_text}"`,
                    tick_posted: shardTick
                });

                // Log the action
                await _supabase.from('ipo_action_log').insert({
                    org_id: ipoSelectedOrgId,
                    faction_id: currentFaction.id,
                    action_type: 'joint_statement',
                    action_data: { statement_text: meta.statement_text, visibility: meta.visibility || 'public' },
                    ap_cost: 0,
                    performed_at_tick: shardTick
                });

                // Post to world events for every member nation (unless private)
                if (meta.visibility !== 'private') {
                    try {
                        const { data: members } = await _supabase.from('ipo_members')
                            .select('nation_id')
                            .eq('org_id', ipoSelectedOrgId);
                        const nationIds = [...new Set((members || []).map(m => m.nation_id).filter(Boolean))];
                        for (const nid of nationIds) {
                            await _supabase.from('event_log').insert({
                                nation_id: nid,
                                event_name: 'Joint Statement',
                                description_chosen: `${org.name || 'International Organisation'}: "${meta.statement_text}"`,
                                category: 'DIPLOMATIC',
                                fired_at_tick: shardTick
                            });
                        }
                    } catch (evErr) {
                        console.warn('[IPO] Joint statement event_log failed (non-blocking):', evErr);
                    }
                }
            }
            break;
        }
        case 'charter_amendment': {
            // Apply the proposed charter changes now that the vote passed
            const proposedCharter = meta.proposed_charter;
            if (proposedCharter) {
                const { error: charterErr } = await _supabase
                    .from('international_orgs')
                    .update({ charter: proposedCharter })
                    .eq('id', org.id);
                if (charterErr) console.error('[IPO] Charter amendment apply error:', charterErr);
            }

            // Apply logo changes if proposed
            const proposedLogo = meta.proposed_logo;
            if (proposedLogo) {
                const logoUpdate = {};
                if (proposedLogo.symbol !== undefined) logoUpdate.logo_symbol = proposedLogo.symbol;
                if (proposedLogo.text !== undefined) logoUpdate.logo_text = proposedLogo.text;
                if (proposedLogo.image_url !== undefined) logoUpdate.logo_image_url = proposedLogo.image_url;
                if (Object.keys(logoUpdate).length > 0) {
                    const { error: logoErr } = await _supabase
                        .from('international_orgs')
                        .update(logoUpdate)
                        .eq('id', org.id);
                    if (logoErr) console.error('[IPO] Logo amendment apply error:', logoErr);
                }
            }

            const changeSummary = [];
            if (proposedCharter) changeSummary.push('charter');
            if (proposedLogo) changeSummary.push('logo');

            await _supabase.from('ipo_chat').insert({
                org_id: ipoSelectedOrgId,
                faction_id: null,
                is_system: true,
                message_text: `Amendment approved and applied (${changeSummary.join(', ')}): "${(meta.description || '').substring(0, 200)}".`,
                tick_posted: shardTick
            });

            await _supabase.from('ipo_action_log').insert({
                org_id: ipoSelectedOrgId,
                faction_id: currentFaction.id,
                action_type: 'charter_amendment',
                action_data: { description: meta.description, proposed_charter: proposedCharter, proposed_logo: proposedLogo },
                ap_cost: 1,
                performed_at_tick: shardTick
            });
            break;
        }
        case 'change_logo': {
            const proposedLogo = meta.proposed_logo;
            if (proposedLogo) {
                const logoUpdate = {};
                if (proposedLogo.symbol !== undefined) logoUpdate.logo_symbol = proposedLogo.symbol;
                if (proposedLogo.text !== undefined) logoUpdate.logo_text = proposedLogo.text;
                if (proposedLogo.image_url !== undefined) logoUpdate.logo_image_url = proposedLogo.image_url;
                if (Object.keys(logoUpdate).length > 0) {
                    const { error: logoErr } = await _supabase
                        .from('international_orgs')
                        .update(logoUpdate)
                        .eq('id', org.id);
                    if (logoErr) console.error('[IPO] Logo change apply error:', logoErr);
                }
            }
            await _supabase.from('ipo_chat').insert({
                org_id: ipoSelectedOrgId,
                faction_id: null,
                is_system: true,
                message_text: 'Logo change approved and applied.',
                tick_posted: shardTick
            });
            await _supabase.from('ipo_action_log').insert({
                org_id: ipoSelectedOrgId,
                faction_id: currentFaction.id,
                action_type: 'change_logo',
                action_data: { proposed_logo: proposedLogo },
                ap_cost: 1,
                performed_at_tick: shardTick
            });
            break;
        }
        case 'symposium': {
            // Set pending_symposium on the org — fires after a cooldown
            const SYMPOSIUM_DELAY = 4; // ticks until effect fires
            const SYMPOSIUM_COOLDOWN = 20; // ticks before next symposium allowed
            const SYMPOSIUM_SHIFT = 3; // ideology shift amount

            const pendingSymposium = {
                targetNation: meta.target_nation_id,
                axis: meta.axis || 'economic',
                direction: meta.direction || 'left',
                ideologyShift: SYMPOSIUM_SHIFT,
                firesOnTick: shardTick + SYMPOSIUM_DELAY
            };

            await _supabase.from('international_orgs')
                .update({
                    pending_symposium: pendingSymposium,
                    symposium_cooldown_remaining: SYMPOSIUM_COOLDOWN
                })
                .eq('id', ipoSelectedOrgId);

            await _supabase.from('ipo_chat').insert({
                org_id: ipoSelectedOrgId,
                faction_id: null,
                is_system: true,
                message_text: `Symposium approved! Targeting ${meta.target_nation_name || 'a nation'} (${meta.axis} ${meta.direction}). Effect fires in ${SYMPOSIUM_DELAY} ticks.`,
                tick_posted: shardTick
            });

            await _supabase.from('ipo_action_log').insert({
                org_id: ipoSelectedOrgId,
                faction_id: currentFaction.id,
                action_type: 'symposium',
                action_data: pendingSymposium,
                ap_cost: 0,
                performed_at_tick: shardTick
            });
            break;
        }
    }
}

// IPO economy is denominated in cash (faction.party_funds). 1 AP = $50,000.
const IPO_AP_TO_CASH = 50000;

const IPO_ACTION_COSTS = {
    hold_rally:      4 * IPO_AP_TO_CASH,  // $200K
    rally_all:       7 * IPO_AP_TO_CASH,  // $350K
    back_channel:    2 * IPO_AP_TO_CASH,  // $100K (personal); fund source uses fund cash directly
    joint_statement: 1 * IPO_AP_TO_CASH,  // $50K
    fund_draw:       0                    // free — draws from solidarity fund
};

// (HQ upkeep is enforced server-side in advance-tick; not exposed to the client.)

// Format a dollar amount the same way the topbar does ($X.YM / $Xk / $X).
function fmtIPOCash(val) {
    val = Number(val) || 0;
    if (val >= 1000000) return '$' + (val / 1000000).toFixed(1) + 'M';
    if (val >= 1000)    return '$' + Math.round(val / 1000) + 'k';
    return '$' + val;
}

/**
 * Atomically deduct cash from the current faction's party_funds.
 * Returns { success: true, newFunds } or { success: false, error, currentFunds }.
 */
async function deductIPOCash(factionId, amount) {
    const { data: row, error: readErr } = await _supabase
        .from('factions')
        .select('party_funds')
        .eq('id', factionId)
        .single();
    if (readErr || !row) return { success: false, error: 'Could not read funds' };
    const current = Number(row.party_funds) || 0;
    if (current < amount) return { success: false, error: 'Insufficient cash', currentFunds: current };
    const newFunds = current - amount;
    const { error: updErr } = await _supabase
        .from('factions')
        .update({ party_funds: newFunds })
        .eq('id', factionId);
    if (updErr) return { success: false, error: updErr.message };
    return { success: true, newFunds };
}

const IPO_BACK_CHANNEL_EXPOSURE_CHANCE = 0.25; // 25% chance of being exposed

/**
 * Render the actions panel with available action buttons.
 */
function renderIPOActionsPanel() {
    const container = document.getElementById('ipo-actions-body');
    if (!container) return;

    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    if (!membership) {
        container.innerHTML = '<span class="ipo-main-placeholder-text">Select an organisation.</span>';
        return;
    }

    const org = membership.org;
    const charter = org?.charter || {};
    const isPresident = org.president_id === currentFaction.id;
    const isObserver = membership.role === 'observer';

    if (isObserver) {
        container.innerHTML = '<div class="ipo-actions-empty">Observers cannot perform actions.</div>';
        return;
    }

    const actions = [];
    const currentCash = Number(currentFaction?.party_funds) || 0;

    // Hold Rally — any member, targets another member
    actions.push({
        key: 'hold_rally',
        label: 'Hold Rally',
        desc: `Spend ${fmtIPOCash(IPO_ACTION_COSTS.hold_rally)} to rally support for another member party.`,
        cost: IPO_ACTION_COSTS.hold_rally,
        icon: '📢',
        available: ipoAllMembers.filter(m => m.faction_id !== currentFaction.id && m.is_active).length > 0 && currentCash >= IPO_ACTION_COSTS.hold_rally
    });

    // Rally All Members — president only
    actions.push({
        key: 'rally_all',
        label: 'Rally All Members',
        desc: 'Coordinate rallies across all member nations.',
        cost: IPO_ACTION_COSTS.rally_all,
        icon: '📣',
        available: isPresident && currentCash >= IPO_ACTION_COSTS.rally_all
    });

    // Back Channel Resources — any member, always available (personal cash) or with fund
    const fundEnabled = charter.resources?.solidarityFund?.enabled;
    const minBackChannelTransfer = IPO_AP_TO_CASH; // can't transfer less than $50K
    actions.push({
        key: 'back_channel',
        label: 'Back-Channel Resources',
        desc: `Transfer cash to another member. Personal: ${fmtIPOCash(IPO_ACTION_COSTS.back_channel)} overhead, no risk. Fund: drawn from solidarity fund, 25% exposure.`,
        cost: IPO_ACTION_COSTS.back_channel, // minimum personal cost (overhead + transfer)
        icon: '🤝',
        available: currentCash >= (IPO_ACTION_COSTS.back_channel + minBackChannelTransfer)
    });

    // Joint Statement — president or if charter allows vote (vote handled in Votes panel)
    const stmtClause = charter.resources?.jointStatementClause || 'vote';
    actions.push({
        key: 'joint_statement',
        label: 'Issue Joint Statement',
        desc: stmtClause === 'president' ? 'Issue a statement on behalf of the org (president only).' : 'Issue a statement (requires a vote — use Votes panel).',
        cost: IPO_ACTION_COSTS.joint_statement,
        icon: '📜',
        available: stmtClause === 'president' && isPresident && currentCash >= IPO_ACTION_COSTS.joint_statement
    });

    // Solidarity Fund Draw — always requires a vote (proposed via Votes panel)
    const fundBalCash = Number(org.solidarity_fund_balance) || 0;
    actions.push({
        key: 'fund_draw',
        label: 'Draw from Fund',
        desc: fundEnabled && fundBalCash > 0
            ? `Withdraw cash from fund (${fmtIPOCash(fundBalCash)} available). Requires vote — use Votes panel.`
            : fundEnabled ? 'Fund is empty.' : 'Solidarity fund is not enabled.',
        cost: 0,
        icon: '💰',
        available: false  // always route through vote panel
    });

    // ── Enforce Action Leadership charter rules ──
    const actionMode = charter.governance?.actionLeadership || 'unilateral';
    const hasEmergencyPowers = !!charter.governance?.emergencyPowers;
    const emergencyUsedTick = org.emergency_power_used_tick || 0;
    const termStartTick = org.president_term_start_tick || 0;
    // Emergency available if: powers enabled, is president, and hasn't been used since current term started
    // (emergencyUsedTick === 0 means never used → always available)
    const emergencyAvailable = hasEmergencyPowers && isPresident && (emergencyUsedTick === 0 || emergencyUsedTick < termStartTick);

    // Actions with no vote equivalent — always allow direct execution regardless of governance mode
    const directOnlyActions = new Set(['hold_rally', 'rally_all', 'back_channel']);

    for (const a of actions) {
        if (!a.available || a.key === 'fund_draw') continue;

        let blocked = false;
        let blockReason = '';

        if (directOnlyActions.has(a.key)) {
            // These actions have no vote pathway — always allow direct execution
        } else if (actionMode === 'committee') {
            blocked = true;
            blockReason = 'Charter requires a vote — use Votes panel';
        } else if (actionMode === 'presidential' && !isPresident) {
            blocked = true;
            blockReason = 'Only the president can execute actions';
        } else if (actionMode === 'delegated' && !isPresident) {
            blocked = true;
            blockReason = 'Only the president or officers can execute actions';
        } else if (actionMode === 'tiered' && a.cost > (2 * IPO_AP_TO_CASH)) {
            blocked = true;
            blockReason = `Costs >${fmtIPOCash(2 * IPO_AP_TO_CASH)} — charter requires a vote`;
        }

        if (blocked) {
            a.available = false;
            a.desc = `${a.desc} (${blockReason})`;
            // Tag as emergency-eligible if president has unused emergency powers
            if (emergencyAvailable) {
                a._emergencyEligible = true;
            }
        }
    }

    const actionCardsHtml = actions.map(a => {
        const emergencyBtn = a._emergencyEligible
            ? `<button class="ipo-action-exec-btn" style="background:rgba(217,83,79,0.15);border-color:rgba(217,83,79,0.3);color:#d9534f;" onclick="executeIPOAction('${a.key}', true)">⚡ EMERGENCY</button>`
            : '';
        return `<div class="ipo-action-card ${a.available ? '' : 'ipo-action-card--disabled'}">
            <div class="ipo-action-card-top">
                <span class="ipo-action-icon">${a.icon}</span>
                <div class="ipo-action-info">
                    <span class="ipo-action-label">${a.label}</span>
                    <span class="ipo-action-desc">${a.desc}</span>
                </div>
            </div>
            <div class="ipo-action-card-bottom">
                ${a.cost > 0 ? `<span class="ipo-action-cost">${fmtIPOCash(a.cost)}</span>` : '<span class="ipo-action-cost">Free</span>'}
                ${a.available
                    ? `<button class="ipo-action-exec-btn" onclick="executeIPOAction('${a.key}')">Execute</button>`
                    : emergencyBtn || '<button class="ipo-action-exec-btn" disabled>Unavailable</button>'}
            </div>
        </div>`;
    }).join('');

    // Split layout: scrollable action cards on top, scrollable event log on bottom
    container.innerHTML = `
        <div class="ipo-actions-split">
            <div class="ipo-actions-cards">${actionCardsHtml}</div>
            <div id="ipo-event-log" class="ipo-event-log"></div>
        </div>`;
    loadIPOEventLog(ipoSelectedOrgId);
}

const IPO_ACTION_TYPE_ICONS = {
    hold_rally: '📢', rally_all: '📣', back_channel: '🤝',
    joint_statement: '📜', fund_draw: '💰'
};

async function loadIPOEventLog(orgId) {
    const container = document.getElementById('ipo-event-log');
    if (!container || !orgId) return;

    try {
        const { data: logs } = await _supabase
            .from('ipo_action_log')
            .select('action_type, faction_id, target_faction_id, action_data, ap_cost, performed_at_tick, factions:faction_id ( faction_name )')
            .eq('org_id', orgId)
            .order('performed_at_tick', { ascending: false })
            .limit(8);

        if (!logs || logs.length === 0) {
            container.innerHTML = '<div class="ipo-event-log-empty">No recent activity.</div>';
            return;
        }

        container.innerHTML = `
            <div class="ipo-event-log-header">Recent Activity</div>
            ${logs.map(log => {
                const icon = IPO_ACTION_TYPE_ICONS[log.action_type] || '●';
                const who = log.factions?.faction_name || 'Unknown';
                const data = log.action_data || {};
                let desc = '';

                switch (log.action_type) {
                    case 'hold_rally': {
                        const change = data.momentum_change ?? data.approval_change ?? 0;
                        desc = data.type === 'expulsion'
                            ? `expelled ${data.target_name || 'a member'}`
                            : `held a rally: ${data.outcome_name || '?'} (${change >= 0 ? '+' : ''}${change})`;
                        break;
                    }
                    case 'rally_all':
                        desc = `rallied all members (${(data.results || []).length} parties)`;
                        break;
                    case 'back_channel':
                        desc = data.exposed
                            ? `EXPOSED: transferred ${data.amount || '?'} AP to ${data.target_name || '?'}`
                            : `transferred resources`;
                        break;
                    case 'joint_statement':
                        if (data.statement_text && data.statement_text.length > 80) {
                            const preview = escapeHtml(data.statement_text.substring(0, 80));
                            const full = escapeHtml(data.statement_text);
                            desc = `issued a joint statement: <span class="ipo-statement-text"><span class="ipo-statement-preview">"${preview}…"</span><span class="ipo-statement-full" style="display:none">"${full}"</span><button class="ipo-statement-toggle" onclick="this.parentElement.classList.toggle('expanded'); this.textContent = this.parentElement.classList.contains('expanded') ? 'Less' : 'More'">More</button></span>`;
                        } else if (data.statement_text) {
                            desc = `issued a joint statement: "${escapeHtml(data.statement_text)}"`;
                        } else {
                            desc = 'issued a joint statement';
                        }
                        break;
                    case 'fund_draw':
                        desc = `withdrew ${data.amount ? fmtIPOCash(data.amount) : '?'} from fund`;
                        break;
                    default:
                        desc = log.action_type;
                }

                return `<div class="ipo-event-log-row">
                    <span class="ipo-event-log-icon">${icon}</span>
                    <span class="ipo-event-log-text"><strong>${escapeHtml(who)}</strong> ${desc}</span>
                    <span class="ipo-event-log-tick">T${log.performed_at_tick}</span>
                </div>`;
            }).join('')}`;
    } catch (e) {
        console.error('[IPO] Event log error:', e);
    }
}

/**
 * Execute an IPO action — routes to the appropriate handler.
 */
async function executeIPOAction(actionKey, useEmergencyPowers = false) {
    if (!currentFaction || !ipoSelectedOrgId) return;

    // If invoking emergency powers, confirm and record usage
    if (useEmergencyPowers) {
        if (!confirm('⚡ INVOKE EMERGENCY POWERS?\n\nThis bypasses the charter\'s action leadership rules.\nYou can only use this once per presidential term.\n\nProceed?')) return;

        // Record emergency power usage on the org
        try {
            await _supabase.from('international_orgs')
                .update({ emergency_power_used_tick: shardTick })
                .eq('id', ipoSelectedOrgId);

            // Post to chat
            await _supabase.from('ipo_chat').insert({
                org_id: ipoSelectedOrgId,
                faction_id: null,
                is_system: true,
                message_text: `⚡ ${currentFaction.faction_name} has invoked EMERGENCY POWERS to execute: ${actionKey.replace(/_/g, ' ')}.`,
                tick_posted: shardTick
            });

            // World event for every member nation (non-blocking — don't prevent action if this fails)
            try {
                const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
                const orgName = membership?.org?.name || 'An organisation';
                const { data: members } = await _supabase.from('ipo_members')
                    .select('nation_id').eq('org_id', ipoSelectedOrgId);
                const nationIds = [...new Set((members || []).map(m => m.nation_id).filter(Boolean))];
                for (const nid of nationIds) {
                    await _supabase.from('event_log').insert({
                        nation_id: nid,
                        event_name: 'Emergency Powers Invoked',
                        description_chosen: `${orgName}: ${currentFaction.faction_name} invoked emergency powers to ${actionKey.replace(/_/g, ' ')}.`,
                        category: 'DIPLOMATIC',
                        fired_at_tick: shardTick
                    });
                }
            } catch (_) { /* world event is non-blocking */ }
        } catch (e) {
            alert('Failed to invoke emergency powers: ' + (e.message || 'Unknown error'));
            return;
        }
    }

    switch (actionKey) {
        case 'hold_rally':      await executeHoldRally(); break;
        case 'rally_all':       await executeRallyAll(); break;
        case 'back_channel':    openBackChannelModal(); break;
        case 'joint_statement': openDirectStatementModal(); break;
        case 'fund_draw':       openDirectFundDrawModal(); break;
    }
}

async function executeHoldRally() {
    if (_ipoActionLock) return;
    const cost = IPO_ACTION_COSTS.hold_rally;

    // Build list of other members to target
    const otherMembers = ipoAllMembers.filter(m => m.faction_id !== currentFaction.id && m.is_active);
    if (otherMembers.length === 0) {
        alert('No other members in this organisation to rally for.');
        return;
    }

    // Show member picker via modal
    const options = otherMembers.map(m =>
        `<option value="${m.faction_id}">${escapeHtml(m.factions?.faction_name || 'Unknown')}</option>`
    ).join('');

    const inner = document.getElementById('ipo-create-modal-inner');
    document.getElementById('ipo-create-modal').classList.add('active');
    inner.innerHTML = `
        <div class="ipo-modal-header">

            <button class="modal-close" onclick="closeIPOActionModal()">&times;</button>
        </div>
        <div class="ipo-modal-body">

                Spend ${fmtIPOCash(cost)} to rally support for another member party. A dice roll determines the outcome.
            </p>

            <select id="ipo-rally-target" class="ipo-vote-form-select">${options}</select>

                <button class="wizard-back-btn" onclick="closeIPOActionModal()">Cancel</button>

async function confirmHoldRally() {
    if (_ipoActionLock) return;
    const cost = IPO_ACTION_COSTS.hold_rally;
    const targetId = document.getElementById('ipo-rally-target')?.value;
    if (!targetId) { alert('Select a party to rally for.'); return; }

    const targetMember = ipoAllMembers.find(m => m.faction_id === targetId);
    const targetName = targetMember?.factions?.faction_name || 'Unknown';

    _ipoActionLock = true;
    try {
        // Deduct cash from the executing faction
        const cashResult = await deductIPOCash(currentFaction.id, cost);
        if (!cashResult.success) {
            alert(`Insufficient cash. You need ${fmtIPOCash(cost)}. ${cashResult.currentFunds !== undefined ? 'You have ' + fmtIPOCash(cashResult.currentFunds) + '.' : ''}`);
            return;
        }
        currentFaction.party_funds = cashResult.newFunds;

        // Roll outcome
        const outcome = rollRallyOutcome();
        const momentumChange = randomInt(outcome.min, outcome.max);

        // Apply momentum change to the TARGET faction
        if (momentumChange !== 0) {
            try {
                await _supabase.rpc('adjust_momentum', {
                    p_faction_id: targetId,
                    p_delta: momentumChange,
                    p_label: `IPO rally by ${currentFaction.faction_name} (${outcome.name})`,
                    p_tick: shardTick || 0
                });
            } catch (e) {
                console.error('[IPO Action] adjust_momentum failed:', e);
            }
        }

        // Log the action
        const actionData = {
            target_faction_id: targetId,
            target_faction_name: targetName,
            outcome_id: outcome.id,
            outcome_name: outcome.name,
            momentum_change: momentumChange
        };

        await _supabase.from('ipo_action_log').insert({
            org_id: ipoSelectedOrgId,
            faction_id: currentFaction.id,
            action_type: 'hold_rally',
            action_data: actionData,
            ap_cost: cost,
            performed_at_tick: shardTick
        });

        // System chat message
        await _supabase.from('ipo_chat').insert({
            org_id: ipoSelectedOrgId,
            faction_id: null,
            is_system: true,
            message_text: `${currentFaction.faction_name} rallied support for ${targetName}: ${outcome.name} (${momentumChange >= 0 ? '+' : ''}${momentumChange} momentum).`,
            tick_posted: shardTick
        });

        closeIPOActionModal();
        renderIPOActionsPanel();
        showIPOActionResult('Hold Rally for ' + targetName, outcome, momentumChange);
    } catch (e) {
        console.error('[IPO Action] Hold rally error:', e);
        alert('Failed to execute rally.');
    } finally {
        _ipoActionLock = false;
    }
}

// ── Rally All Members ──

async function executeRallyAll() {
    if (_ipoActionLock) return;
    const cost = IPO_ACTION_COSTS.rally_all;
    const memberCount = ipoVoteMembers.length;
    if (!confirm(`Rally all ${memberCount} member parties? This costs ${fmtIPOCash(cost)}. Each member gets an independent dice roll.`)) return;
    _ipoActionLock = true;

    try {
        const cashResult = await deductIPOCash(currentFaction.id, cost);
        if (!cashResult.success) {
            alert(`Insufficient cash. You need ${fmtIPOCash(cost)}.`);
            return;
        }
        currentFaction.party_funds = cashResult.newFunds;

        // Roll for each member
        const results = ipoVoteMembers.map(m => {
            const outcome = rollRallyOutcome();
            const change = randomInt(outcome.min, outcome.max);
            return {
                faction_id: m.faction_id,
                nation_id: m.factions?.nation_id,
                faction_name: m.factions?.faction_name || 'Unknown',
                outcome_id: outcome.id,
                outcome_name: outcome.name,
                momentum_change: change
            };
        });

        // Apply momentum changes
        for (const r of results) {
            if (r.momentum_change === 0) continue;
            try {
                await _supabase.rpc('adjust_momentum', {
                    p_faction_id: r.faction_id,
                    p_delta: r.momentum_change,
                    p_label: `IPO rally-all by ${currentFaction.faction_name} (${r.outcome_name})`,
                    p_tick: shardTick || 0
                });
            } catch (e) {
                console.error('[IPO Action] adjust_momentum failed:', e);
            }
        }

        await _supabase.from('ipo_action_log').insert({
            org_id: ipoSelectedOrgId,
            faction_id: currentFaction.id,
            action_type: 'rally_all',
            action_data: { results },
            ap_cost: cost,
            performed_at_tick: shardTick
        });

        // Build summary
        const summaryLines = results.map(r =>
            `${r.faction_name}: ${r.outcome_name} (${r.momentum_change >= 0 ? '+' : ''}${r.momentum_change})`
        ).join(', ');

        await _supabase.from('ipo_chat').insert({
            org_id: ipoSelectedOrgId,
            faction_id: null,
            is_system: true,
            message_text: `${currentFaction.faction_name} rallied all members! ${summaryLines}`,
            tick_posted: shardTick
        });

        // Show combined result
        renderIPOActionsPanel();
        showIPOActionResultMulti('Rally All Members', results);
    } catch (e) {
        console.error('[IPO Action] Rally all error:', e);
        alert('Failed to execute coordinated rally.');
    } finally {
        _ipoActionLock = false;
    }
}

// ── Back-Channel Resources ──

let backChannelTargetId = null;
let backChannelAmount = 1;

function openBackChannelModal() {
    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    const org = membership?.org;
    const charter = org?.charter || {};
    const cap = charter.resources?.resourceSharingCap;
    const fundEnabled = charter.resources?.solidarityFund?.enabled;
    const fundBalance = Number(org?.solidarity_fund_balance) || 0;

    backChannelTargetId = null;
    backChannelAmount = IPO_AP_TO_CASH; // default $50K

    const otherMembers = ipoAllMembers.filter(m => m.faction_id !== currentFaction.id && m.is_active);
    if (otherMembers.length === 0) { alert('No other members to transfer to.'); return; }

    const memberOpts = otherMembers.map(m =>
        `<option value="${m.faction_id}">${escapeHtml(m.factions?.faction_name || 'Unknown')}</option>`
    ).join('');

    const capNote = cap ? `<div class="ipo-vote-form-note">Resource sharing cap: ${cap} transfers per term.</div>` : '';
    const fundOption = fundEnabled && fundBalance > 0
        ? `<option value="fund">Solidarity Fund (drawn from fund · 25% exposure risk)</option>`
        : '';

    const inner = document.getElementById('ipo-create-modal-inner');
    document.getElementById('ipo-create-modal').classList.add('active');
    inner.innerHTML = `
        <div class="ipo-modal-header">
            <span class="ipo-modal-title">Back-Channel Resources</span>
            <button class="modal-close" onclick="closeIPOActionModal()">&times;</button>
        </div>
        <div class="ipo-modal-body">
            <div class="ipo-vote-form-note">Secretly transfer cash to another member.</div>
            ${capNote}
            <label class="ipo-vote-form-label">Funding Source</label>
            <select id="ipo-bc-source" class="ipo-vote-form-select">
                <option value="personal">Personal Cash (${fmtIPOCash(IPO_ACTION_COSTS.back_channel)} overhead · no exposure risk)</option>
                ${fundOption}
            </select>
            <label class="ipo-vote-form-label">Recipient</label>
            <select id="ipo-bc-target" class="ipo-vote-form-select" onchange="backChannelTargetId=this.value">${memberOpts}</select>
            <label class="ipo-vote-form-label">Amount to transfer ($, in $50k increments)</label>
            <input type="number" id="ipo-bc-amount" class="ipo-vote-form-input" min="${IPO_AP_TO_CASH}" max="${20 * IPO_AP_TO_CASH}" step="${IPO_AP_TO_CASH}" value="${IPO_AP_TO_CASH}" onchange="backChannelAmount=Number(this.value)" />
            <div class="wizard-nav" style="margin-top:16px;">
                <button class="wizard-back-btn" onclick="closeIPOActionModal()">Cancel</button>
                <button class="ipo-btn ipo-btn--create-large" onclick="executeBackChannel()">Transfer</button>
            </div>
        </div>`;

    backChannelTargetId = otherMembers[0].faction_id;
}

async function executeBackChannel() {
    if (_ipoActionLock) return;
    if (!backChannelTargetId) { alert('Select a recipient.'); return; }
    const amount = Number(document.getElementById('ipo-bc-amount')?.value) || backChannelAmount;
    if (amount < IPO_AP_TO_CASH) { alert('Enter at least ' + fmtIPOCash(IPO_AP_TO_CASH) + '.'); return; }
    const source = document.getElementById('ipo-bc-source')?.value || 'personal';

    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    const org = membership?.org;
    const charter = org?.charter || {};

    // Check resource sharing cap
    const cap = charter.resources?.resourceSharingCap;
    if (cap) {
        const { data: recent } = await _supabase
            .from('ipo_action_log')
            .select('id')
            .eq('org_id', ipoSelectedOrgId)
            .eq('faction_id', currentFaction.id)
            .eq('action_type', 'back_channel')
            .gte('performed_at_tick', shardTick - (charter.leadership?.termYears || 2) * 12);
        if (recent && recent.length >= cap) {
            alert(`You have reached the resource sharing cap (${cap} per term).`);
            return;
        }
    }

    _ipoActionLock = true;

    try {
        const targetMember = ipoVoteMembers.find(m => m.faction_id === backChannelTargetId);
        const targetName = targetMember?.factions?.faction_name || 'Unknown';
        let exposed = false;
        let cashCostPaid = 0;

        if (source === 'fund') {
            // Fund source: amount drawn from solidarity fund via SECURITY DEFINER RPC
            // (RLS on international_orgs only allows the president to UPDATE; the RPC
            // permits any active member while validating membership server-side).
            const { error: debitErr } = await _supabase.rpc('ipo_debit_solidarity_fund', {
                p_org_id: ipoSelectedOrgId,
                p_amount: amount
            });
            if (debitErr) {
                alert('Failed to draw from fund: ' + debitErr.message);
                return;
            }
            cashCostPaid = 0; // no personal cost for fund source
            exposed = Math.random() < IPO_BACK_CHANNEL_EXPOSURE_CHANCE; // 25% risk
        } else {
            // Personal source: $100K overhead + transfer amount, no exposure risk
            const totalCost = IPO_ACTION_COSTS.back_channel + amount;
            const cashResult = await deductIPOCash(currentFaction.id, totalCost);
            if (!cashResult.success) {
                alert(`Insufficient cash. You need ${fmtIPOCash(totalCost)} (${fmtIPOCash(IPO_ACTION_COSTS.back_channel)} overhead + ${fmtIPOCash(amount)} transfer).`);
                return;
            }
            currentFaction.party_funds = cashResult.newFunds;
            cashCostPaid = totalCost;
            exposed = false; // personal cash = no exposure risk
        }

        // Credit recipient via SECURITY DEFINER RPC (RLS blocks direct cross-faction UPDATE).
        // If credit fails after sender was already debited, surface loudly so the player
        // can flag it — the alternative is silent disappearance of cash.
        const { error: creditErr } = await _supabase.rpc('ipo_credit_party_funds', {
            p_target_faction_id: backChannelTargetId,
            p_amount: amount,
            p_org_id: ipoSelectedOrgId
        });
        if (creditErr) {
            console.error('[IPO] Back-channel credit failed:', creditErr);
            alert('Transfer initiated but the recipient credit FAILED — please contact an admin to reconcile. Error: ' + creditErr.message);
            // Don't return — still log the action so the failure is in the audit trail.
        }

        await _supabase.from('ipo_action_log').insert({
            org_id: ipoSelectedOrgId,
            faction_id: currentFaction.id,
            target_faction_id: backChannelTargetId,
            action_type: 'back_channel',
            action_data: { amount, exposed, target_name: targetName, source },
            ap_cost: cashCostPaid,
            performed_at_tick: shardTick
        });

        if (exposed) {
            // Public exposure — world event + chat
            await _supabase.from('ipo_chat').insert({
                org_id: ipoSelectedOrgId,
                faction_id: null,
                is_system: true,
                message_text: `EXPOSED: ${currentFaction.faction_name} used solidarity funds to secretly transfer ${fmtIPOCash(amount)} to ${targetName}!`,
                tick_posted: shardTick
            });
            // World event for every member nation
            try {
                const { data: members } = await _supabase.from('ipo_members')
                    .select('nation_id').eq('org_id', ipoSelectedOrgId);
                const nationIds = [...new Set((members || []).map(m => m.nation_id).filter(Boolean))];
                for (const nid of nationIds) {
                    await _supabase.from('event_log').insert({
                        nation_id: nid,
                        event_name: 'Back-Channel Scandal',
                        description_chosen: `${org.name || 'An organisation'}: ${currentFaction.faction_name} was caught secretly funneling ${fmtIPOCash(amount)} to ${targetName} from the solidarity fund!`,
                        category: 'DIPLOMATIC',
                        fired_at_tick: shardTick
                    });
                }
            } catch (_) { /* non-blocking */ }
        } else {
            // Private — vague system message
            await _supabase.from('ipo_chat').insert({
                org_id: ipoSelectedOrgId,
                faction_id: null,
                is_system: true,
                message_text: `Resources were transferred within the organisation.`,
                tick_posted: shardTick
            });
        }

        closeIPOActionModal();
        renderIPOActionsPanel();
        alert(`Transferred ${fmtIPOCash(amount)} to ${targetName}.${exposed ? ' WARNING: The transfer was EXPOSED publicly!' : ' Transfer completed secretly.'}`);
    } catch (e) {
        console.error('[IPO Action] Back-channel error:', e);
        alert('Failed to transfer resources.');
    } finally {
        _ipoActionLock = false;
    }
}

async function executeDirectStatement() {
    if (_ipoActionLock) return;
    const text = document.getElementById('ipo-direct-stmt')?.value?.trim();
    if (!text) { alert('Please write the statement.'); return; }

    const cost = IPO_ACTION_COSTS.joint_statement;
    _ipoActionLock = true;

    try {
        const cashResult = await deductIPOCash(currentFaction.id, cost);
        if (!cashResult.success) {
            alert(`Insufficient cash. You need ${fmtIPOCash(cost)}.`);
            return;
        }
        currentFaction.party_funds = cashResult.newFunds;

        await _supabase.from('ipo_action_log').insert({
            org_id: ipoSelectedOrgId,
            faction_id: currentFaction.id,
            action_type: 'joint_statement',
            action_data: { statement_text: text, by_president: true },
            ap_cost: cost,
            performed_at_tick: shardTick
        });

        await _supabase.from('ipo_chat').insert({
            org_id: ipoSelectedOrgId,
            faction_id: null,
            is_system: true,
            message_text: `JOINT STATEMENT (by president): "${text}"`,
            tick_posted: shardTick
        });

        // Post to world events for every member nation
        const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
        const orgName = membership?.org?.name || 'International Organisation';
        try {
            const { data: members } = await _supabase.from('ipo_members')
                .select('nation_id')
                .eq('org_id', ipoSelectedOrgId);
            const nationIds = [...new Set((members || []).map(m => m.nation_id).filter(Boolean))];
            for (const nid of nationIds) {
                await _supabase.from('event_log').insert({
                    nation_id: nid,
                    event_name: 'Joint Statement',
                    description_chosen: `${orgName}: "${text}"`,
                    category: 'DIPLOMATIC',
                    fired_at_tick: shardTick
                });
            }
        } catch (evErr) {
            console.warn('[IPO] Joint statement event_log insert failed (non-blocking):', evErr);
        }

        closeIPOActionModal();
        renderIPOActionsPanel();
        alert('Statement published.');
    } catch (e) {
        console.error('[IPO Action] Statement error:', e);
        alert('Failed to publish statement.');
    } finally {
        _ipoActionLock = false;
    }
}

            <input type="number" id="ipo-direct-draw-amount" class="ipo-vote-form-input" min="${IPO_AP_TO_CASH}" max="${balance}" step="${IPO_AP_TO_CASH}" value="${IPO_AP_TO_CASH}" />
            <label class="ipo-vote-form-label">Purpose</label>

                <button class="wizard-back-btn" onclick="closeIPOActionModal()">Cancel</button>
                <button class="ipo-btn ipo-btn--create-large" onclick="executeDirectFundDraw()">Withdraw</button>
            </div>
        </div>`;

async function executeDirectFundDraw() {
    if (_ipoActionLock) return;
    const amount = parseInt(document.getElementById('ipo-direct-draw-amount')?.value);
    const purpose = document.getElementById('ipo-direct-draw-purpose')?.value?.trim() || '';
    if (!amount || amount < IPO_AP_TO_CASH) { alert('Enter at least ' + fmtIPOCash(IPO_AP_TO_CASH) + '.'); return; }

    const membership = ipoMemberships.find(m => m.org.id === ipoSelectedOrgId);
    const balance = Number(membership?.org?.solidarity_fund_balance) || 0;
    if (amount > balance) { alert('Amount exceeds fund balance.'); return; }

    _ipoActionLock = true;

    try {
        // KNOWN ISSUE: read-modify-write on cached balance is not atomic across sessions.
        // A server-side RPC for atomic fund decrement would eliminate this race.
        // The _ipoActionLock guard protects against same-tab double-fire only.
        const newBalance = balance - amount;
        await _supabase.from('international_orgs')
            .update({ solidarity_fund_balance: newBalance })
            .eq('id', ipoSelectedOrgId);

        // Credit the president's faction (fresh read to avoid overwriting concurrent cash changes)
        const { data: faction } = await _supabase
            .from('factions')
            .select('party_funds')
            .eq('id', currentFaction.id)
            .single();
        if (faction) {
            await _supabase.from('factions')
                .update({ party_funds: (Number(faction.party_funds) || 0) + amount })
                .eq('id', currentFaction.id);
        }

        await _supabase.from('ipo_fund_transactions').insert({
            org_id: ipoSelectedOrgId,
            faction_id: currentFaction.id,
            transaction_type: 'draw',
            amount: -amount,
            description: purpose || 'Presidential fund draw',
            tick: shardTick
        });

        await _supabase.from('ipo_action_log').insert({
            org_id: ipoSelectedOrgId,
            faction_id: currentFaction.id,
            action_type: 'fund_draw',
            action_data: { amount, purpose },
            ap_cost: 0,
            performed_at_tick: shardTick
        });

        await _supabase.from('ipo_chat').insert({
            org_id: ipoSelectedOrgId,
            faction_id: null,
            is_system: true,
            message_text: `President ${currentFaction.faction_name} withdrew ${fmtIPOCash(amount)} from the solidarity fund. ${purpose ? 'Purpose: ' + purpose : ''}`,
            tick_posted: shardTick
        });

        closeIPOActionModal();
        renderIPOActionsPanel();
        alert(`Withdrew ${fmtIPOCash(amount)} from the solidarity fund.`);
    } catch (e) {
        console.error('[IPO Action] Fund draw error:', e);
        alert('Failed to withdraw from fund.');
    } finally {
        _ipoActionLock = false;
    }
}

// ── Utility: Rally Dice Roll ──

function rollRallyOutcome() {
    const totalWeight = IPO_RALLY_OUTCOMES.reduce((sum, o) => sum + o.weight, 0);
    let roll = Math.random() * totalWeight;
    for (const outcome of IPO_RALLY_OUTCOMES) {
        roll -= outcome.weight;
        if (roll <= 0) return outcome;
    }
    return IPO_RALLY_OUTCOMES[1]; // fallback: solid
}

function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function ipoHandleLogoUpload(input) {
    const file = input.files[0];
    const errEl = document.getElementById('ipo-logo-upload-error');
    if (!file) return;
    if (!['image/png','image/jpeg','image/webp'].includes(file.type)) {
        if (errEl) { errEl.textContent = 'Only PNG, JPG, or WebP images allowed.'; errEl.style.display = ''; }
        input.value = '';
        return;
    }
    if (file.size > 2 * 1024 * 1024) {
        if (errEl) { errEl.textContent = 'Image must be under 2 MB.'; errEl.style.display = ''; }
        input.value = '';
        return;
    }
    if (errEl) errEl.style.display = 'none';
    ipoCreateLogoFile = file;
    const reader = new FileReader();
    reader.onload = function(e) {
        ipoCreateLogoPreviewUrl = e.target.result;
        const zone = document.getElementById('ipo-logo-upload-zone');
        if (zone) {
            zone.innerHTML = `<img src="${ipoCreateLogoPreviewUrl}" class="ipo-logo-upload-preview" alt="preview" />
                <div style="font-size:9px;color:var(--text-tertiary);margin-top:4px;">Click to replace</div>`;
        }
        // Show remove button by re-rendering just after the zone
        const existing = zone?.parentElement?.querySelector('.ipo-logo-remove-btn');
        if (!existing && zone?.parentElement) {
            const btn = document.createElement('button');
            btn.className = 'ipo-logo-remove-btn';
            btn.style.cssText = 'margin-top:4px;font-size:9px;color:#d9534f;background:none;border:1px solid #d9534f33;padding:2px 8px;border-radius:3px;cursor:pointer;';
            btn.textContent = 'Remove Image';
            btn.onclick = function() { ipoRemoveLogoUpload(); };
            zone.parentElement.insertBefore(btn, zone.nextSibling);
        }
    };
    reader.readAsDataURL(file);
}

function ipoRemoveLogoUpload() {
    ipoCreateLogoFile = null;
    ipoCreateLogoPreviewUrl = null;
    const zone = document.getElementById('ipo-logo-upload-zone');

function renderIPOArticleCard(art, index) {
    const typeDef = IPO_ARTICLE_TYPES.find(t => t.key === art.type);

    let fields = '';

        case 'mission': fields = renderMissionFields(art, index); break;
        case 'leadership': fields = renderLeadershipFields(art, index); break;
        case 'membership': fields = renderMembershipFields(art, index); break;

    return `

function renderLeadershipFields(art, idx) {

            { value: 'rotation', label: 'Rotation', hint: 'Presidency rotates in fixed order' },

        ], c.type)}
        ${ipoSelectField('Succession Term', idx, 'termYears', [1,2,3,4,5,6,7].map(n => ({ value: n, label: n + ' Year' + (n>1?'s':'') })), c.termYears)}

function renderMembershipFields(art, idx) {
    const c = art.config;
    const thresh = c.ideologicalThreshold || { enabled: false, directions: [] };
    const dirs = thresh.directions || [];

    const ideologyCheckboxes = IPO_IDEOLOGY_AXES.map(axis => {
        const checks = axis.poles.map(pole => {
            const checked = dirs.includes(pole.toLowerCase());
            // Check if the opposite pole is already selected
            const oppositePole = axis.poles.find(p => p !== pole);
            const oppositeChecked = dirs.includes(oppositePole.toLowerCase());
            return `<label class="ipo-ideology-check ${oppositeChecked ? 'ipo-disabled' : ''}" style="margin-right:12px;">
                <input type="checkbox" ${checked ? 'checked' : ''} ${oppositeChecked ? 'disabled' : ''}
                    onchange="ipoToggleIdeology(${idx},'${pole.toLowerCase()}',this.checked)" />
                ${pole}
            </label>`;
        }).join('');
        return `<div class="ipo-ideology-axis"><span class="ipo-ideology-axis-name">${axis.axis}</span>${checks}</div>`;
    }).join('');

function ipoRadioGroup(label, artIdx, key, options, current) {
    const radios = options.map(opt =>
        `<label class="trade-radio-option ${opt.value === current ? 'selected' : ''}"
            onclick="ipoSetArticleField(${artIdx},'${key}','${opt.value}')">

                ${opt.hint ? `<div class="trade-radio-hint">${opt.hint}</div>` : ''}

            <label>${label}</label>
            <div class="trade-radio-group" style="flex-wrap:wrap;gap:6px;">${radios}</div>
        </div>`;
