async function loadTradeAgreements() {
    const nationId = _worldState?.nation?.id;
    if (!nationId) return;

    const [agResult, negResult] = await Promise.all([
        _supabase.from('trade_agreements')
            .select('*')
            .or(`nation_a_id.eq.${nationId},nation_b_id.eq.${nationId}`)
            .order('enacted_at_tick', { ascending: false }),
        _supabase.from('trade_negotiations')
            .select('id, nation_a_id, nation_b_id, status, agreement_type, opened_at_tick, approved_by_a, approved_by_b')
            .or(`nation_a_id.eq.${nationId},nation_b_id.eq.${nationId}`)
            .in('status', ['open', 'active', 'ratification'])
            .order('opened_at_tick', { ascending: false }),
    ]);
    _tradeAgreementsList = agResult.data || [];
    _tradeNegotiationsList = negResult.data || [];
}

// ── Shipping Contracts block (pending applications + active claims) ──
//
// Rendered at the top of the AGREEMENTS panel so government-side users can
// accept/reject applications and see live active shipping contracts without
// having to expand each trade agreement row.
//
// Pending side uses the bidding-modal rework:
//   - Each route with pending bids shows a one-line summary row with bid
//     count + "closes in N ticks" countdown (3-tick window from the earliest
//     bid's applied_at_tick).
//   - Clicking the row opens the shipping-bid modal (see
//     openShippingBidModal) which will carry the full bid comparison UI.
// Active-claim rows below still use the inline expand via _shippingRowExpanded.
function renderShippingContractsBlock() {
    const routeMap = new Map();
    for (const r of (_allShippingRoutes || [])) routeMap.set(r.id, r);

    // Only the Minister of Trade can accept/reject shipping applications.
    // Everyone else in the nation sees the row and terms but gets an
    // "awaiting decision" notice instead of action buttons.
    // (diplomaticRoles is unreliable on this page — see refreshTradeMinisterFlag.)
    const canAct = !!_isTradeMinister;

    // Group pending applications BY ROUTE so every route with pending bids
    // collapses into one summary row (regardless of how many corps applied).
    // Skip any app whose route has expired / been deleted.
    const pendingByRoute = new Map();
    let pendingBidTotal = 0;
    for (const [routeId, apps] of Object.entries(_shippingAppsByRoute || {})) {
        if (!apps || apps.length === 0) continue;
        const route = routeMap.get(routeId);
        if (!route) continue;
        pendingByRoute.set(routeId, { route, apps });
        pendingBidTotal += apps.length;
    }

    const activeClaims = [];
    for (const [routeId, claims] of Object.entries(_shippingClaimsByRoute || {})) {
        const route = routeMap.get(routeId);
        for (const c of (claims || [])) activeClaims.push({ ...c, route });
    }

    if (pendingByRoute.size === 0 && activeClaims.length === 0) return '';

    const fmt = (n) => (typeof fmtBudgetCurrency === 'function')
        ? fmtBudgetCurrency(n)
        : ('$' + Math.round(Number(n) || 0).toLocaleString());

    // 1 tick = 30 game days = 1 month.
    const TICKS_PER_MONTH = 1;

    let html = '';

    // Section header: count ROUTES pending (not individual bids) so the headline
    // matches what the list actually shows; individual bid count follows in parens.
    html += `<div style="padding:10px 18px;background:var(--bg-card);border-bottom:1px solid var(--border-main);display:flex;justify-content:space-between;align-items:center;">
        <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:1.2px;color:var(--text-muted);">SHIPPING CONTRACTS</span>
        <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);">
            ${pendingByRoute.size} route${pendingByRoute.size !== 1 ? 's' : ''} open${pendingBidTotal > 0 ? ' · ' + pendingBidTotal + ' bid' + (pendingBidTotal !== 1 ? 's' : '') : ''}${activeClaims.length > 0 ? ' · ' + activeClaims.length + ' active' : ''}
        </span>
    </div>`;

    // Pending routes — one collapsible row per route. Phase 2 will replace the
    // expanded-state rendering below with a dedicated modal.
    const pendingRowColor = '#c8a832'; // amber — consistent with the pending bid badge

    for (const [routeId, { route: r, apps }] of pendingByRoute) {
        const bidCount = apps.length;
        const routeLabel = (r.origin_port && r.destination_port)
            ? `${r.origin_port} → ${r.destination_port}`
            : (r.goods_name || 'route');

        // Bidding deadline: 3 ticks after the earliest bid landed. Deterministic
        // per-route so the same countdown shows no matter which bid opened it.
        const earliestBidTick = apps.reduce(
            (min, a) => Math.min(min, Number(a.applied_at_tick) || 0),
            Number.POSITIVE_INFINITY
        );
        const currentTick = _worldState?.shard?.current_tick || 0;
        const closesInTicks = Number.isFinite(earliestBidTick) ? Math.max(0, (earliestBidTick + 3) - currentTick) : null;
        const closesLabel = closesInTicks === null ? '' :
            closesInTicks === 0 ? 'closing this tick' :
            `closes in ${closesInTicks} tick${closesInTicks !== 1 ? 's' : ''}`;

        html += `<div style="border-bottom:1px solid var(--border-main);border-left:3px solid ${pendingRowColor};">
            <div onclick="openShippingBidModal('${routeId}')"
                 style="padding:12px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;">
                <div style="display:flex;align-items:center;gap:10px;">
                    <div style="width:28px;height:28px;background:${pendingRowColor}15;border:1px solid ${pendingRowColor}33;display:flex;align-items:center;justify-content:center;border-radius:4px;font-size:14px;">\u2693</div>
                    <div>
                        <div style="font-size:13px;font-weight:600;color:var(--text-bright);">
                            ${escapeHtml(routeLabel)}
                        </div>
                        <div style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);margin-top:2px;">
                            ${escapeHtml(r.goods_name || 'Trade goods')} \u00B7 ${bidCount} bid${bidCount !== 1 ? 's' : ''} pending${closesLabel ? ' \u00B7 ' + closesLabel : ''}
                        </div>
                    </div>
                </div>
                <span class="tr-badge" style="font-size:10px;padding:3px 10px;color:#c8a832;background:rgba(200,168,50,0.08);border-color:rgba(200,168,50,0.2);">${bidCount} PENDING</span>
            </div>
        </div>`;
    }

    // Active shipping contracts (claims) — collapsible rows
    for (const claim of activeClaims) {
        const corp = claim.factions || {};
        const color = corp.party_color || '#5cc55c';
        const ticker = (corp.corp_ticker || corp.abbreviation || '').toUpperCase();
        const logoHtml = corp.custom_logo_url
            ? `<img src="${escapeHtml(corp.custom_logo_url)}" style="width:100%;height:100%;object-fit:cover;border-radius:3px;" />`
            : `<span style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:${color};">${escapeHtml(ticker.slice(0,2) || '??')}</span>`;
        const r = claim.route || {};
        const routeLabel = (r.origin_port && r.destination_port)
            ? `${r.origin_port} → ${r.destination_port}`
            : (r.goods_name || 'route');
        const isExp = _shippingRowExpanded === 'claim:' + claim.id;

        const rate = Number(claim.revenue_per_transit || 0);
        const transitTicks = Math.max(1, Number(r.transit_ticks || 1));
        const transitsPerMonth = TICKS_PER_MONTH / transitTicks;
        const monthlyCost = rate * transitsPerMonth;
        const transits = Number(claim.transits_completed || 0);
        const totalPaid = Number(claim.total_revenue || 0);
        const marketShare = Number(claim.market_share_pct || 0);

        html += `<div style="border-bottom:1px solid var(--border-main);border-left:3px solid ${color};">
            <div onclick="toggleShippingRow('claim:${claim.id}')"
                 style="padding:12px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;${isExp ? 'background:var(--bg-card);' : ''}">
                <div style="display:flex;align-items:center;gap:10px;">
                    <div style="width:28px;height:28px;background:${color}15;border:1px solid ${color}33;display:flex;align-items:center;justify-content:center;border-radius:4px;overflow:hidden;">${logoHtml}</div>
                    <div>
                        <div style="font-size:13px;font-weight:600;color:var(--text-bright);">
                            ${escapeHtml(corp.faction_name || 'Unknown Corp')}
                            <span style="color:var(--text-dim);font-weight:400;"> servicing </span>
                            <span style="color:var(--text-bright);">${escapeHtml(routeLabel)}</span>
                        </div>
                        <div style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);margin-top:2px;">
                            ${escapeHtml(r.goods_name || 'Trade goods')} · ${fmt(rate)}/trip · ${transits} trips completed
                        </div>
                    </div>
                </div>
                <span class="tr-badge" style="font-size:10px;padding:3px 10px;color:var(--green);background:rgba(92,204,92,0.08);border-color:rgba(92,204,92,0.2);">ACTIVE CONTRACT</span>
            </div>
            ${isExp ? `<div style="padding:0 18px 14px 34px;">
                <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:4px 0 4px;font-family:var(--font-mono);font-size:10px;">
                    <div>
                        <div style="color:var(--text-dim);font-size:8px;letter-spacing:1px;margin-bottom:2px;">MARKET SHARE</div>
                        <div style="color:var(--text-bright);font-size:14px;font-weight:700;">${marketShare}%</div>
                    </div>
                    <div>
                        <div style="color:var(--text-dim);font-size:8px;letter-spacing:1px;margin-bottom:2px;">PRICE PER TRIP</div>
                        <div style="color:var(--accent);font-size:14px;font-weight:700;">${fmt(rate)}</div>
                    </div>
                    <div>
                        <div style="color:var(--text-dim);font-size:8px;letter-spacing:1px;margin-bottom:2px;">MONTHLY COST</div>
                        <div style="color:#d06a6a;font-size:14px;font-weight:700;">${fmt(monthlyCost)}</div>
                        <div style="color:var(--text-dim);font-size:8px;">~${transitsPerMonth.toFixed(1)} trips/mo</div>
                    </div>
                    <div>
                        <div style="color:var(--text-dim);font-size:8px;letter-spacing:1px;margin-bottom:2px;">TOTAL PAID</div>
                        <div style="color:var(--text-bright);font-size:14px;font-weight:700;">${fmt(totalPaid)}</div>
                        <div style="color:var(--text-dim);font-size:8px;">${transits} transit${transits === 1 ? '' : 's'}</div>
                    </div>
                </div>
            </div>` : ''}
        </div>`;
    }

    return html;
}

window.toggleShippingRow = function(id) {
    _shippingRowExpanded = (_shippingRowExpanded === id) ? null : id;
    renderTradeAgreements();
};

// ═══════════════════════════════════════════════════
// SHIPPING BID MODAL (Phase 2 shell — bids table + actions land in Phase 3/4)
// ═══════════════════════════════════════════════════
//
// Opens on a pending-route click. Shell-only for now: header (route +
// selling nation + MoT name), stats bar (total bids / bid range / median
// / trips projected), an empty bids-table scaffold, and the footer with
// SELECTED / CONTRACT VALUE / TERM and the three action buttons (all
// stubbed until later phases).

let _shippingBidModal = null; // { routeId, route, apps, mot: {first, last} } | null

window.openShippingBidModal = async function(routeId) {
    const route = (_allShippingRoutes || []).find(r => r.id === routeId);
    if (!route) return;
    const apps = _shippingAppsByRoute[routeId] || [];

    // Selling nation's Minister of Trade display name (non-blocking — a
    // failed lookup just shows "Minister of Trade" with no personal name).
    let mot = { first: '', last: '' };
    try {
        const { data: mr, error: motErr } = await _supabase.from('ministries')
            .select('minister_first_name, minister_last_name')
            .eq('nation_id', route.origin_nation_id)
            .eq('ministry_key', 'trade')
            .eq('is_active', true)
            .maybeSingle();
        if (motErr) console.warn('[ShippingBidModal] MoT lookup failed:', motErr.message);
        if (mr) { mot.first = mr.minister_first_name || ''; mot.last = mr.minister_last_name || ''; }
    } catch (e) {
        console.warn('[ShippingBidModal] MoT lookup threw:', e?.message || e);
    }

    // Per-corp badge data. Non-blocking — missing sets just mean no badges.
    const activeCorpSet = new Set();
    const incumbentCorpSet = new Set();
    try {
        const factionIds = [...new Set(apps.map(a => a.faction_id).filter(Boolean))];
        if (factionIds.length > 0) {
            const [activeRes, incRes] = await Promise.all([
                _supabase.from('shipping_claims').select('faction_id').eq('status', 'active').in('faction_id', factionIds),
                _supabase.from('shipping_claims').select('faction_id').eq('route_id', routeId).eq('status', 'released').in('faction_id', factionIds),
            ]);
            if (activeRes.error)   console.warn('[ShippingBidModal] active-claim fetch error:', activeRes.error.message);
            if (incRes.error)      console.warn('[ShippingBidModal] incumbent fetch error:', incRes.error.message);
            for (const c of (activeRes.data || [])) activeCorpSet.add(c.faction_id);
            for (const c of (incRes.data    || [])) incumbentCorpSet.add(c.faction_id);
        }
    } catch (e) {
        console.warn('[ShippingBidModal] badge fetch threw:', e?.message || e);
    }

    _shippingBidModal = {
        routeId, route, apps, mot,
        sort: 'lowest_bid',
        activeCorps: activeCorpSet,
        incumbentCorps: incumbentCorpSet,
    };
    _renderShippingBidModalOverlay();
    document.body.style.overflow = 'hidden';
};

window.closeShippingBidModal = function() {
    _shippingBidModal = null;
    _renderShippingBidModalOverlay();
    document.body.style.overflow = '';
};

window.setShippingBidSort = function(key) {
    if (!_shippingBidModal) return;
    if (_shippingBidModal.sort === key) return;
    _shippingBidModal.sort = key;
    _renderShippingBidModalOverlay();
};

window.selectShippingBid = function(appId) {
    if (!_shippingBidModal || _shippingBidModal.awardPending) return;
    // Toggle: clicking the already-selected row clears the selection.
    _shippingBidModal.selectedAppId = _shippingBidModal.selectedAppId === appId ? null : appId;
    _renderShippingBidModalOverlay();
};

// Award the selected bid and bulk-reject the remaining ones on the same route.
// Winner first — if the claim RPC fails, losers are NOT rejected so the MoT
// can retry or pick a different bid.
window.awardShippingContract = async function() {
    if (!_shippingBidModal) return;
    if (_shippingBidModal.awardPending || _shippingApprovalPending) return;

    await refreshTradeMinisterFlag();
    if (!_isTradeMinister) { alert('Only the Minister of Trade can award contracts.'); return; }

    const sel = (_shippingBidModal.apps || []).find(a => a.id === _shippingBidModal.selectedAppId);
    if (!sel) { alert('Select a bid first.'); return; }

    const losers = (_shippingBidModal.apps || []).filter(a => a.id !== sel.id);
    const corpName = sel.factions?.faction_name || 'selected corporation';
    const loserNote = losers.length > 0
        ? `\n\nThe other ${losers.length} bid${losers.length !== 1 ? 's' : ''} on this route will be rejected.`
        : '';
    if (!confirm(`Award this route to ${corpName}?${loserNote}`)) return;

    _shippingBidModal.awardPending = true;
    _shippingApprovalPending = true;
    _renderShippingBidModalOverlay();

    try {
        const winRes = await _doApproveShippingApp(sel.id, sel.route_id, sel.faction_id);
        if (!winRes.ok) {
            alert('Could not award the contract: ' + (winRes.error || 'unknown error') + '\n\nNo bids were rejected.');
            return;
        }

        // Bulk-reject losers in parallel. Individual failures get logged but
        // don't unwind the award — the winning claim is already active.
        if (losers.length > 0) {
            const rejectResults = await Promise.all(losers.map(l =>
                _doRejectShippingApp(l.id, 'Another bid was awarded for this route.')
            ));
            const failed = rejectResults.filter(r => !r.ok).length;
            if (failed > 0) console.warn(`[ShippingAward] ${failed}/${losers.length} loser rejections failed`);
        }

        window.closeShippingBidModal();
        await loadShippingData();
        renderTradeAgreements();
    } catch (e) {
        console.error('[ShippingAward] Error:', e);
        alert('Award failed: ' + (e?.message || 'unknown error'));
    } finally {
        if (_shippingBidModal) {
            _shippingBidModal.awardPending = false;
            _renderShippingBidModalOverlay();
        }
        _shippingApprovalPending = false;
    }
};

// Bind ESC + overlay click once. The rendered overlay stops propagation on
// its inner content so clicks inside the modal don't trigger dismissal.
if (!window._shippingBidModalEscBound) {
    window._shippingBidModalEscBound = true;
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && _shippingBidModal) window.closeShippingBidModal();
    });
}

// Sort-tab chip for the bids header. Active tab gets the accent underline.
function _renderBidSortTab(key, label, activeKey) {
    const isActive = activeKey === key;
    return `<button onclick="setShippingBidSort('${key}')" style="padding:6px 12px;font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:1px;color:${isActive ? 'var(--text-bright)' : 'var(--text-dim)'};background:${isActive ? 'var(--bg-card)' : 'transparent'};border:1px solid ${isActive ? 'var(--border-main)' : 'transparent'};cursor:pointer;">${escapeHtml(label)}</button>`;
}

// Single bid row. Computes derived fields (badges, tier, monthly cost, margin)
// locally so the comparator in _renderShippingBidModalOverlay only has to sort
// the raw app rows, not a pre-built view model.
function _renderShippingBidRow(app, r, bidMin, bidMedian, tripsPerMonth, fmt, originNation, activeCorps, incumbentCorps, selectedAppId, canAct) {
    const corp = app.factions || {};
    const color = corp.party_color || '#5a8aaa';
    const ticker = (corp.corp_ticker || corp.abbreviation || '').toUpperCase();
    const logoHtml = corp.custom_logo_url
        ? `<img src="${escapeHtml(corp.custom_logo_url)}" style="width:100%;height:100%;object-fit:cover;border-radius:3px;" />`
        : `<span style="font-family:var(--font-mono);font-size:10px;font-weight:700;color:${color};">${escapeHtml(ticker.slice(0,2) || '??')}</span>`;

    const rate = Number(app.proposed_rate) || 0;
    const monthlyCost = rate * tripsPerMonth;
    // Est. margin: selling-nation perspective — positive % = savings vs median,
    // negative = premium over median. Dim when within ±2%.
    const marginPct = bidMedian > 0 ? ((bidMedian - rate) / bidMedian) * 100 : 0;
    const marginColor = Math.abs(marginPct) < 2 ? 'var(--text-dim)' : marginPct > 0 ? 'var(--green)' : 'var(--red)';
    const marginLabel = (marginPct > 0 ? '+' : '') + marginPct.toFixed(1) + '%';

    const rep = Math.round(Number(corp.corp_reputation) || 0);
    const repColor = rep >= 80 ? 'var(--green)' : rep >= 60 ? 'var(--accent)' : rep >= 40 ? 'var(--amber)' : 'var(--red)';
    const repLabel = rep >= 80 ? 'Excellent' : rep >= 60 ? 'Good' : rep >= 40 ? 'Fair' : rep >= 20 ? 'Unproven' : 'Poor';

    const fleetCap = Number(corp.shipping_fleet_capacity) || 0;
    const fleetDep = Number(corp.shipping_fleet_deployed) || 0;
    const activeShips = Math.max(0, fleetDep);

    // Badges: BEST (lowest bid), ACTIVE (has any active claim), LOCAL (corp HQ
    // nation matches route origin or destination but NOT the selling nation).
    // Skipped per Phase 3 scope: NEW (needs age threshold), FLAGGED (needs rep/sanction threshold).
    const badges = [];
    if (bidMin > 0 && rate === bidMin) badges.push({ label: 'BEST', color: 'var(--green)' });
    if (activeCorps?.has(app.faction_id))   badges.push({ label: 'ACTIVE', color: 'var(--accent)' });
    const corpNationId = corp.nation_id;
    const corpIsLocal = corpNationId && (corpNationId === r.origin_nation_id || corpNationId === r.destination_nation_id);
    if (corpIsLocal) badges.push({ label: 'LOCAL', color: 'var(--amber)' });

    // Tier line below the corp name.
    //   INCUMBENT — previously held a released claim on this exact route
    //   DOMESTIC  — corp HQ is the selling (origin) nation
    //   MAJOR/REGIONAL — fleet-capacity heuristic for everyone else
    let tier;
    if (incumbentCorps?.has(app.faction_id)) tier = 'INCUMBENT';
    else if (corpNationId && corpNationId === r.origin_nation_id) tier = 'DOMESTIC';
    else if (fleetCap >= 20) tier = 'MAJOR';
    else if (fleetCap >= 6)  tier = 'REGIONAL';
    else                     tier = 'MINOR';

    // Corp's home-nation abbreviation for the subline (falls back to the corp ticker).
    const corpNation = corpNationId ? (_worldAllNations || []).find(n => n.id === corpNationId) : null;
    const corpNationAbbr = (corpNation?.abbreviation || corpNation?.name || ticker || '').toUpperCase();

    const badgeHtml = badges.map(b =>
        `<span style="font-family:var(--font-mono);font-size:7px;font-weight:700;letter-spacing:0.5px;padding:1px 5px;color:${b.color};background:${b.color === 'var(--green)' ? 'rgba(92,204,92,0.08)' : b.color === 'var(--amber)' ? 'rgba(200,168,50,0.08)' : 'rgba(90,138,170,0.08)'};border:1px solid ${b.color};">${b.label}</span>`
    ).join('');

    const isSelected = selectedAppId === app.id;
    const rowBg = isSelected ? `background:${color}12;` : '';
    const selectBtnHtml = canAct
        ? `<button onclick="selectShippingBid('${app.id}')" style="padding:8px 14px;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:1px;color:${isSelected ? '#000' : 'var(--text-bright)'};background:${isSelected ? color : 'transparent'};border:1px solid ${color};cursor:pointer;">${isSelected ? 'SELECTED' : 'SELECT'}</button>`
        : `<button disabled style="padding:8px 14px;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:1px;color:var(--text-dim);background:transparent;border:1px solid var(--border-main);cursor:not-allowed;opacity:0.55;">SELECT</button>`;

    return `<div style="display:grid;grid-template-columns:36px minmax(0,1fr) 120px 140px 110px 120px 110px 110px;gap:12px;padding:14px 22px;border-bottom:1px solid var(--border-main);align-items:center;border-left:3px solid ${color};${rowBg}">
        <div style="width:36px;height:36px;background:${color}15;border:1px solid ${color}33;display:flex;align-items:center;justify-content:center;border-radius:4px;overflow:hidden;">${logoHtml}</div>
        <div style="min-width:0;">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                <span style="font-size:14px;font-weight:700;color:var(--text-bright);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(corp.faction_name || 'Unknown Corp')}</span>
                ${badgeHtml}
            </div>
            <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);letter-spacing:0.5px;margin-top:3px;">${escapeHtml(corpNationAbbr)} \u00B7 ${tier}</div>
        </div>
        <div style="text-align:right;">
            <div style="font-family:var(--font-mono);font-size:15px;font-weight:700;color:${rate === bidMin && bidMin > 0 ? 'var(--green)' : 'var(--text-bright)'};">${fmt(rate)}</div>
            <div style="font-family:var(--font-mono);font-size:8px;color:var(--text-dim);margin-top:1px;">per trip</div>
        </div>
        <div style="text-align:right;">
            <div style="font-family:var(--font-mono);font-size:15px;font-weight:700;color:${repColor};">${rep}</div>
            <div style="height:3px;background:var(--border-main);margin-top:3px;position:relative;">
                <div style="position:absolute;left:0;top:0;height:100%;width:${Math.max(0, Math.min(100, rep))}%;background:${repColor};"></div>
            </div>
            <div style="font-family:var(--font-mono);font-size:8px;color:var(--text-dim);margin-top:2px;">${repLabel}</div>
        </div>
        <div style="text-align:right;">
            <div style="font-family:var(--font-mono);font-size:15px;font-weight:700;color:var(--text-bright);">${activeShips}</div>
            <div style="font-family:var(--font-mono);font-size:8px;color:var(--text-dim);margin-top:1px;">active fleet</div>
        </div>
        <div style="text-align:right;">
            <div style="font-family:var(--font-mono);font-size:15px;font-weight:700;color:var(--text-bright);">${fmt(monthlyCost)}</div>
            <div style="font-family:var(--font-mono);font-size:8px;color:var(--text-dim);margin-top:1px;">${tripsPerMonth} trips/mo</div>
        </div>
        <div style="text-align:right;">
            <div style="font-family:var(--font-mono);font-size:14px;font-weight:700;color:${marginColor};">${marginLabel}</div>
            <div style="font-family:var(--font-mono);font-size:8px;color:var(--text-dim);margin-top:1px;">vs. median</div>
        </div>
        <div style="text-align:right;">
            ${selectBtnHtml}
        </div>
    </div>`;
}

function _renderShippingBidModalOverlay() {
    const existing = document.getElementById('shipping-bid-modal-overlay');
    if (!_shippingBidModal) {
        if (existing) existing.remove();
        return;
    }

    const { route: r, apps, mot } = _shippingBidModal;
    const currentTick = _worldState?.shard?.current_tick || 0;

    const originNation = (_worldAllNations || []).find(n => n.id === r.origin_nation_id);
    const destNation   = (_worldAllNations || []).find(n => n.id === r.destination_nation_id);
    const originName = originNation?.name || 'Unknown';
    const destName   = destNation?.name || 'Unknown';
    const sellingFlag = originNation?.flag_url || (originNation?.name ? `assets/flags/${originNation.name}.png` : '');

    // Closing countdown: 3 ticks from the earliest bid.
    const earliestBidTick = apps.length > 0
        ? apps.reduce((m, a) => Math.min(m, Number(a.applied_at_tick) || 0), Number.POSITIVE_INFINITY)
        : null;
    const closesInTicks = earliestBidTick !== null && Number.isFinite(earliestBidTick)
        ? Math.max(0, (earliestBidTick + 3) - currentTick)
        : null;
    const closesLabel = closesInTicks === null ? 'OPEN BIDDING'
        : closesInTicks === 0 ? 'CLOSING THIS TICK'
        : `CLOSES IN ${closesInTicks} TICK${closesInTicks !== 1 ? 'S' : ''}`;

    // Stats: total bids, bid range, median, trips projected for this route.
    const rates = apps.map(a => Number(a.proposed_rate) || 0).filter(v => v > 0).sort((a, b) => a - b);
    const bidMin = rates.length ? rates[0] : 0;
    const bidMax = rates.length ? rates[rates.length - 1] : 0;
    const bidMedian = rates.length
        ? (rates.length % 2 === 1
            ? rates[(rates.length - 1) / 2]
            : Math.round((rates[rates.length / 2 - 1] + rates[rates.length / 2]) / 2))
        : 0;
    // Trips per month per ship = 30 / (transit_ticks × 30 days), or unrestricted
    // when transit is 0 ticks (instant) — in that case we cap the display at 30.
    const transitTicks = Number(r.transit_ticks) || 0;
    const tripsPerMonth = transitTicks <= 0 ? 30 : Math.max(1, Math.round(1 / transitTicks));

    const fmt = (n) => (typeof fmtBudgetCurrency === 'function')
        ? fmtBudgetCurrency(n)
        : ('$' + Math.round(Number(n) || 0).toLocaleString());

    const motName = (mot.first || mot.last) ? `${mot.first} ${mot.last}`.trim() : '—';

    // Only the Minister of Trade can SELECT / AWARD / REJECT-ALL. Everyone
    // else in the nation sees read-only bids.
    const canAct = !!_isTradeMinister;
    const awardPending = !!_shippingBidModal.awardPending;
    const selectedApp = (apps || []).find(a => a.id === _shippingBidModal.selectedAppId) || null;
    const contractTermTicks = 36;
    const contractValue = selectedApp
        ? (Number(selectedApp.proposed_rate) || 0) * tripsPerMonth * contractTermTicks
        : 0;

    // Sorted bid list. Sort keys correspond to the four tabs below.
    const sortKey = _shippingBidModal.sort || 'lowest_bid';
    const tripsPerMonthCached = tripsPerMonth; // alias so the comparator reads naturally
    const sortedApps = [...apps].sort((a, b) => {
        const aRate = Number(a.proposed_rate) || 0;
        const bRate = Number(b.proposed_rate) || 0;
        const aCorp = a.factions || {};
        const bCorp = b.factions || {};
        switch (sortKey) {
            case 'reputation':
                return (Number(bCorp.corp_reputation) || 0) - (Number(aCorp.corp_reputation) || 0);
            case 'capacity':
                return (Number(bCorp.shipping_fleet_capacity) || 0) - (Number(aCorp.shipping_fleet_capacity) || 0);
            case 'monthly':
                return (aRate * tripsPerMonthCached) - (bRate * tripsPerMonthCached);
            case 'lowest_bid':
            default:
                return aRate - bRate;
        }
    });

    // Route permit code: derived from origin nation abbreviation + route-ID tail.
    const originAbbr = (originNation?.abbreviation || originName.slice(0, 3)).toUpperCase();
    const permitCode = `${originAbbr}-RT-${(r.id || '').slice(-4).toUpperCase()}`;

    const overlay = existing || (() => {
        const el = document.createElement('div');
        el.id = 'shipping-bid-modal-overlay';
        el.addEventListener('click', (e) => { if (e.target === el) window.closeShippingBidModal(); });
        document.body.appendChild(el);
        return el;
    })();

    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;';

    overlay.innerHTML = `
        <div onclick="event.stopPropagation();" style="width:100%;max-width:1280px;background:var(--bg-panel);border:1px solid var(--border-mid);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,0.5);">

            <!-- Header: route + selling nation -->
            <div style="padding:18px 22px;border-bottom:1px solid var(--border-main);display:flex;justify-content:space-between;align-items:flex-start;gap:20px;">
                <div style="min-width:0;flex:1;">
                    <div style="display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--text-dim);margin-bottom:6px;">
                        <span>SHIPPING APPLICATIONS</span>
                        <span>\u203A</span>
                        <span style="color:var(--accent);">${escapeHtml(closesLabel)}</span>
                    </div>
                    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
                        <div>
                            <div style="font-size:22px;font-weight:700;color:var(--text-bright);line-height:1;">${escapeHtml(r.origin_port || 'Origin Port')}</div>
                            <div style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);letter-spacing:1px;margin-top:4px;">${escapeHtml(originName.toUpperCase())}</div>
                        </div>
                        <span style="font-size:22px;color:var(--text-dim);">\u2192</span>
                        <div>
                            <div style="font-size:22px;font-weight:700;color:var(--text-bright);line-height:1;">${escapeHtml(r.destination_port || 'Destination Port')}</div>
                            <div style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);letter-spacing:1px;margin-top:4px;">${escapeHtml(destName.toUpperCase())}</div>
                        </div>
                    </div>
                    <div style="display:flex;gap:22px;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-top:14px;flex-wrap:wrap;">
                        <span><span style="color:var(--text-muted);">CARGO</span> <span style="color:var(--text-bright);font-weight:600;">${escapeHtml(r.goods_name || 'Trade goods')}</span></span>
                        <span><span style="color:var(--text-muted);">TARIFF</span> <span style="color:var(--text-bright);font-weight:600;">${Math.round(Number(r.tariff_rate) || 0)}%</span></span>
                        <span><span style="color:var(--text-muted);">ROUTE PERMIT</span> <span style="color:var(--text-bright);font-weight:600;">${escapeHtml(permitCode)}</span></span>
                    </div>
                </div>
                <div style="display:flex;align-items:center;gap:12px;flex-shrink:0;">
                    ${sellingFlag ? `<img src="${escapeHtml(sellingFlag)}" alt="" style="width:42px;height:28px;object-fit:cover;border:1px solid var(--border-main);" onerror="this.style.display='none'">` : ''}
                    <div style="text-align:right;">
                        <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);letter-spacing:1px;">SELLING NATION</div>
                        <div style="font-size:14px;font-weight:700;color:var(--text-bright);margin-top:2px;">${escapeHtml(originName)}</div>
                        <div style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);margin-top:2px;">Minister of Trade \u00B7 ${escapeHtml(motName)}</div>
                    </div>
                    <button onclick="window.closeShippingBidModal()" style="font-family:var(--font-mono);font-size:16px;color:var(--text-dim);background:transparent;border:none;cursor:pointer;padding:0 4px;">\u00D7</button>
                </div>
            </div>

            <!-- Stats bar -->
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-bottom:1px solid var(--border-main);">
                <div style="padding:14px 22px;border-right:1px solid var(--border-main);">
                    <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);letter-spacing:1px;">TOTAL BIDS</div>
                    <div style="font-family:var(--font-mono);font-size:20px;font-weight:700;color:var(--text-bright);margin-top:3px;">${apps.length}</div>
                </div>
                <div style="padding:14px 22px;border-right:1px solid var(--border-main);">
                    <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);letter-spacing:1px;">BID RANGE</div>
                    <div style="font-family:var(--font-mono);font-size:16px;font-weight:700;color:var(--text-bright);margin-top:3px;">${rates.length ? `${fmt(bidMin)} \u2013 ${fmt(bidMax)}` : '—'}</div>
                </div>
                <div style="padding:14px 22px;border-right:1px solid var(--border-main);">
                    <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);letter-spacing:1px;">MEDIAN</div>
                    <div style="font-family:var(--font-mono);font-size:20px;font-weight:700;color:var(--accent);margin-top:3px;">${rates.length ? fmt(bidMedian) : '—'}</div>
                </div>
                <div style="padding:14px 22px;">
                    <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);letter-spacing:1px;">TRIPS PROJECTED</div>
                    <div style="font-family:var(--font-mono);font-size:20px;font-weight:700;color:var(--text-bright);margin-top:3px;">${tripsPerMonth} <span style="font-size:11px;color:var(--text-dim);font-weight:400;">/ mo</span></div>
                </div>
            </div>

            <!-- Bids header + sort tabs -->
            <div style="padding:14px 22px 8px;display:flex;justify-content:space-between;align-items:center;">
                <span style="font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--text-muted);">\u25A0 BIDS</span>
                <div style="display:flex;gap:2px;">
                    ${_renderBidSortTab('lowest_bid', 'LOWEST BID', sortKey)}
                    ${_renderBidSortTab('reputation', 'REPUTATION', sortKey)}
                    ${_renderBidSortTab('capacity',   'CAPACITY',   sortKey)}
                    ${_renderBidSortTab('monthly',    'MONTHLY COST', sortKey)}
                </div>
            </div>

            <!-- Column headers -->
            <div style="display:grid;grid-template-columns:36px minmax(0,1fr) 120px 140px 110px 120px 110px 110px;gap:12px;padding:10px 22px;border-bottom:1px solid var(--border-main);background:var(--bg-card);font-family:var(--font-mono);font-size:8px;font-weight:700;letter-spacing:1px;color:var(--text-dim);">
                <span></span>
                <span>CORPORATION</span>
                <span style="text-align:right;">BID ($/TRIP)</span>
                <span style="text-align:right;">REPUTATION</span>
                <span style="text-align:right;">ACTIVE SHIPS</span>
                <span style="text-align:right;">MONTHLY COST</span>
                <span style="text-align:right;">EST. MARGIN</span>
                <span style="text-align:right;">ACTION</span>
            </div>

            <!-- Bids rows -->
            <div id="shipping-bid-modal-bids">
                ${apps.length === 0
                    ? `<div style="padding:40px 22px;text-align:center;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);letter-spacing:1px;">NO PENDING BIDS</div>`
                    : sortedApps.map(app => _renderShippingBidRow(app, r, bidMin, bidMedian, tripsPerMonth, fmt, originNation, _shippingBidModal.activeCorps, _shippingBidModal.incumbentCorps, _shippingBidModal.selectedAppId, canAct)).join('')}
            </div>

            <!-- Footer -->
            <div style="padding:14px 22px;border-top:1px solid var(--border-main);background:var(--bg-card);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;">
                <div style="display:flex;gap:22px;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);">
                    <span><span style="color:var(--text-muted);letter-spacing:1px;">SELECTED</span> <span style="color:var(--text-bright);font-weight:600;">${selectedApp ? escapeHtml(selectedApp.factions?.faction_name || 'Corp') : 'NONE'}</span></span>
                    <span><span style="color:var(--text-muted);letter-spacing:1px;">CONTRACT VALUE</span> <span style="color:var(--text-bright);font-weight:600;">${selectedApp ? fmt(contractValue) : '—'}</span></span>
                    <span><span style="color:var(--text-muted);letter-spacing:1px;">TERM</span> <span style="color:var(--text-bright);font-weight:600;">${contractTermTicks} TICKS</span></span>
                </div>
                <div style="display:flex;gap:8px;">
                    <button disabled title="Phase 5" style="padding:8px 18px;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:1px;color:var(--text-dim);background:transparent;border:1px solid var(--border-main);cursor:not-allowed;opacity:0.5;">REQUEST MORE BIDS</button>
                    <button disabled title="Phase 5" style="padding:8px 18px;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:1px;color:#d44a4a;background:transparent;border:1px solid #d44a4a44;cursor:not-allowed;opacity:0.5;">REJECT ALL</button>
                    <button
                        ${(!canAct || !selectedApp || awardPending) ? 'disabled' : ''}
                        onclick="window.awardShippingContract()"
                        style="padding:8px 18px;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:1px;color:#000;background:#5cc55c;border:none;cursor:${(!canAct || !selectedApp || awardPending) ? 'not-allowed' : 'pointer'};opacity:${(!canAct || !selectedApp || awardPending) ? 0.5 : 1};">
                        ${awardPending ? 'AWARDING\u2026' : 'AWARD CONTRACT'}
                    </button>
                </div>
            </div>
        </div>`;
}

function renderTradeAgreements() {
    const left = document.getElementById('trade-agreements-row');
    if (!left) return;
    const nationId = _worldState?.nation?.id;
    const currentTk = _worldState?.shard?.current_tick || 0;
    const agreements = _tradeAgreementsList;

    const active = agreements.filter(a => a.status === 'active');
    const expired = agreements.filter(a => a.status !== 'active');

    let html = `<div class="tr-panel">
        <div class="tr-panel-header">
            <span class="tr-panel-title">AGREEMENTS</span>
            <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);">${active.length} active${expired.length > 0 ? ' \u00B7 ' + expired.length + ' expired' : ''}</span>
        </div>`;

    // Shipping contracts (pending applications + active claims) — rendered at top
    html += renderShippingContractsBlock();

    // Ongoing trade negotiations (shown before agreements)
    const ongoingNegs = _tradeNegotiationsList || [];
    for (const neg of ongoingNegs) {
        const partnerId = neg.nation_a_id === nationId ? neg.nation_b_id : neg.nation_a_id;
        const partner = (_worldAllNations || []).find(n => n.id === partnerId);
        const partnerName = partner?.name || 'Unknown';
        const myName = _worldState?.nation?.name || 'Your Nation';
        const myFlag = _worldState?.nation?.flag_url || `assets/flags/${myName}.png`;
        const partnerFlag = partner?.flag_url || `assets/flags/${partnerName}.png`;

        // Three-state badge:
        //   RATIFICATION    — bill in parliament (status='ratification')
        //   READY TO RATIFY — both sides approved but not yet sent to parliament
        //   ONGOING         — negotiation in progress (default)
        const isRatifying = neg.status === 'ratification';
        const bothApproved = !isRatifying && !!neg.approved_by_a && !!neg.approved_by_b;
        let negBadgeColor, negBadgeLabel, negBadgeBg, negBadgeBorder, negBorderColor;
        if (isRatifying) {
            negBadgeLabel  = 'RATIFICATION';
            negBadgeColor  = 'var(--green)';
            negBadgeBg     = 'rgba(92,204,92,0.08)';
            negBadgeBorder = 'rgba(92,204,92,0.2)';
            negBorderColor = 'var(--green)';
        } else if (bothApproved) {
            negBadgeLabel  = 'READY TO RATIFY';
            negBadgeColor  = 'var(--teal)';
            negBadgeBg     = 'rgba(90,175,165,0.08)';
            negBadgeBorder = 'rgba(90,175,165,0.25)';
            negBorderColor = 'var(--teal)';
        } else {
            negBadgeLabel  = 'ONGOING';
            negBadgeColor  = 'var(--amber)';
            negBadgeBg     = 'rgba(184,134,11,0.08)';
            negBadgeBorder = 'rgba(184,134,11,0.2)';
            negBorderColor = 'var(--amber)';
        }

        html += `<div style="padding:12px 18px;border-bottom:1px solid var(--border-main);cursor:pointer;border-left:3px solid ${negBorderColor};"
            onclick="openTradeNegModal('${partnerId}')">
            <div style="display:flex;justify-content:space-between;align-items:center;">
                <div style="display:flex;align-items:center;gap:8px;">
                    <img src="${escapeHtml(myFlag)}" alt="" style="width:24px;height:16px;object-fit:cover;border:1px solid var(--border-main);" onerror="this.style.display='none'">
                    <span style="font-size:13px;font-weight:600;color:var(--text-bright);">${escapeHtml(myName)}</span>
                    <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);">${isRatifying ? 'Ratification' : 'Trade Discussions'}</span>
                    <span style="font-size:13px;font-weight:600;color:var(--text-bright);">${escapeHtml(partnerName)}</span>
                    <img src="${escapeHtml(partnerFlag)}" alt="" style="width:24px;height:16px;object-fit:cover;border:1px solid var(--border-main);" onerror="this.style.display='none'">
                </div>
                <span class="tr-badge" style="font-size:10px;padding:3px 10px;color:${negBadgeColor};background:${negBadgeBg};border-color:${negBadgeBorder};">${negBadgeLabel}</span>
            </div>
        </div>`;
    }

    if (agreements.length === 0 && ongoingNegs.length === 0) {
        html += `<div style="padding:20px;text-align:center;font-family:var(--font-mono);font-size:12px;color:var(--text-dim);font-style:italic;">No trade agreements.</div>`;
    }

    for (let i = 0; i < agreements.length; i++) {
        const ag = agreements[i];
        const isActive = ag.status === 'active';
        const isHostile = ag.agreement_type === 'retaliatory_tariff' || ag.agreement_type === 'impose_embargo';
        const isExp = _tradeExpandedAgreement === ag.id;
        const statusColor = isActive ? (isHostile ? 'var(--red)' : 'var(--green)') : 'var(--text-dim)';
        const statusLabel = isActive ? (isHostile ? 'HOSTILE' : 'ACTIVE') : ag.status?.toUpperCase() || 'ENDED';

        // Partner nation
        const partnerId = ag.nation_a_id === nationId ? ag.nation_b_id : ag.nation_a_id;
        const partner = (_worldAllNations || []).find(n => n.id === partnerId);
        const partnerName = partner?.name || 'Unknown';
        const typeLabel = AGREE_TYPE_LABELS[ag.agreement_type] || ag.agreement_type;

        // Duration info
        const remaining = ag.expires_at_tick ? Math.max(0, ag.expires_at_tick - currentTk) : null;
        const durationLabel = ag.duration_type === 'indefinite' ? 'Ongoing' : (ag.duration_ticks ? ag.duration_ticks + ' ticks' : 'Unknown');

        const agShipInfo = getAgreementShippingInfo(ag.id);
        const agIsTradeType = ag.agreement_type !== 'retaliatory_tariff' && ag.agreement_type !== 'impose_embargo';
        const logisticsBadge = agIsTradeType
            ? (agShipInfo?.hasLogistics
                ? `<span class="tr-badge" style="color:var(--green);background:rgba(92,204,92,0.06);border-color:rgba(92,204,92,0.15);font-size:5px;">\uD83D\uDEA2 ${escapeHtml(agShipInfo.corps[0]?.name || 'Corp')}</span>`
                : `<span class="tr-badge" style="color:var(--orange);background:rgba(200,136,68,0.06);border-color:rgba(200,136,68,0.15);font-size:5px;">\u26A0 NO LOGISTICS</span>`)
            : '';

        html += `<div class="tr-agreement-row" data-ag-id="${ag.id}" style="border-left:3px solid ${statusColor};">
            <div class="tr-agreement-header" style="background:${isExp ? 'var(--bg-card)' : 'transparent'};padding:14px 18px;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                    <div style="display:flex;align-items:center;gap:6px;">
                        <span style="font-size:14px;font-weight:600;color:var(--text-bright);">${escapeHtml(ag.agreement_name || typeLabel)}</span>
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;">
                        ${logisticsBadge}
                        <span class="tr-badge" style="font-size:11px;padding:3px 10px;color:${statusColor};background:${statusColor}0a;border-color:${statusColor}25;">${statusLabel}</span>
                    </div>
                </div>
                <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);">
                    ${escapeHtml(partnerName)} \u00B7 ${escapeHtml(typeLabel)} \u00B7 ${durationLabel}${remaining !== null ? ' \u00B7 ' + remaining + ' ticks left' : ''}
                </div>
            </div>`;

        // Expanded: articles + effects
        if (isExp) {
            const articles = ag.articles || [];
            html += `<div style="padding:0 18px 14px;">`;

            // Render articles (supports both old-style { type, data } and new-style { article_type, data } + { text })
            if (articles.length > 0) {
                html += `<div style="font-family:var(--font-mono);font-size:9px;font-weight:700;color:var(--text-dim);letter-spacing:0.5px;margin:8px 0 6px;">ARTICLES</div>`;
                const ROMAN_AG = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX'];
                for (let ai = 0; ai < articles.length; ai++) {
                    const art = articles[ai];
                    if (art._struck) continue;
                    const num = ROMAN_AG[ai] || (ai + 1);

                    let artLabel, summary;
                    if (art.article_type) {
                        artLabel = art.article_type.replace(/_/g, ' ').toUpperCase();
                        summary = negStructuredArticleSummary(art);
                    } else if (art.text) {
                        artLabel = 'TEXT';
                        summary = art.text;
                    } else {
                        artLabel = TRADE_ARTICLE_TYPES?.[art.type]?.label || art.type || 'Article';
                        summary = renderTradeArticleSummary(art, nationId);
                    }

                    html += `<div style="padding:3px 6px;margin-bottom:2px;background:var(--bg-card);border:1px solid var(--border-main);">
                        <div style="font-family:var(--font-mono);font-size:7px;font-weight:700;color:var(--text-secondary);">Art. ${num} \u2014 ${escapeHtml(artLabel)}</div>
                        <div style="font-family:var(--font-mono);font-size:7px;color:var(--text-dim);">${escapeHtml(summary || '')}</div>
                    </div>`;
                }
            }

            // Duration + auto-renew
            html += `<div style="display:flex;gap:6px;margin-top:6px;">
                <div style="padding:4px 6px;background:var(--bg-card);border:1px solid var(--border-main);">
                    <div style="font-family:var(--font-mono);font-size:6px;color:var(--text-dim);">ENACTED</div>
                    <div style="font-family:var(--font-mono);font-size:8px;font-weight:700;color:var(--text-bright);">${tickToDate(ag.enacted_at_tick)}</div>
                </div>

// ── All-nations trade flow data for partner analysis ──
let _allNationFlows = {}; // nationId → { sector → { export_capacity, import_demand } }

async function loadAllNationFlows() {
    if (!_tradeSummary) return;
    const { data: allFlows } = await _supabase.from('trade_flows')
        .select('nation_id, sector, export_capacity, import_demand')
        .eq('tick', _tradeSummary.tick);
    _allNationFlows = {};
    if (allFlows) {
        for (const row of allFlows) {
            if (!_allNationFlows[row.nation_id]) _allNationFlows[row.nation_id] = {};
            _allNationFlows[row.nation_id][row.sector] = {
                export_capacity: Number(row.export_capacity) || 0,
                import_demand: Number(row.import_demand) || 0,
            };
        }
    }
}

function computeCompatibility(myNationId, theirNationId) {
    const myFlows = _allNationFlows[myNationId] || {};
    const theirFlows = _allNationFlows[theirNationId] || {};
    let matchScore = 0;
    let totalSectors = 0;

    for (const sector of Object.keys({ ...myFlows, ...theirFlows })) {
        if (sector === 'food_agriculture' && (myFlows.grains_staples || theirFlows.grains_staples)) continue;
        const myBal = (myFlows[sector]?.export_capacity || 0) - (myFlows[sector]?.import_demand || 0);
        const theirBal = (theirFlows[sector]?.export_capacity || 0) - (theirFlows[sector]?.import_demand || 0);
        totalSectors++;
        // Complementary: we have surplus + they have deficit (or vice versa)
        if ((myBal > 0 && theirBal < 0) || (myBal < 0 && theirBal > 0)) {
            matchScore += Math.min(Math.abs(myBal), Math.abs(theirBal));
        }
    }
    if (totalSectors === 0) return 0;
    // Normalize to 0-100 scale based on total trade volume
    const totalVol = Object.values(myFlows).reduce((s, f) => s + (f.export_capacity || 0) + (f.import_demand || 0), 0) || 1;
    return Math.min(99, Math.round((matchScore / totalVol) * 200));
}

function getNationSurplusesAndDeficits(nationId) {
    const flows = _allNationFlows[nationId] || {};
    const surpluses = [];
    const deficits = [];
    for (const [sector, flow] of Object.entries(flows)) {
        if (sector === 'food_agriculture' && (flows.grains_staples || flows.livestock_dairy)) continue;
        const bal = flow.export_capacity - flow.import_demand;
        const entry = {
            sector,
            icon: TRADE_SECTOR_ICONS[sector] || '\uD83D\uDCE6',
            name: TRADE_SECTOR_LABELS[sector] || sector,
            amount: Math.abs(bal),
        };
        if (bal > 0) surpluses.push(entry);
        else if (bal < 0) deficits.push(entry);
    }
    surpluses.sort((a, b) => b.amount - a.amount);
    deficits.sort((a, b) => b.amount - a.amount);
    return { surpluses, deficits };
}

function initWorldMap() {
    const panel = document.getElementById('world-map-panel');
    const img = document.getElementById('world-map-img');
    if (!panel || !img) return;

    let scale = 1, panX = 0, panY = 0, dragging = false, startX = 0, startY = 0;
    const minScale = 1, maxScale = 4;

    function applyTransform() {
        img.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        const label = document.getElementById('map-zoom-label');
        if (label) label.textContent = Math.round(scale * 100) + '%';
    }

    // Scroll to zoom
    panel.addEventListener('wheel', (e) => {
        e.preventDefault();
        const rect = panel.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const oldScale = scale;
        const delta = e.deltaY > 0 ? 0.9 : 1.1;
        scale = Math.max(minScale, Math.min(maxScale, scale * delta));
        // Zoom toward mouse position
        panX = mx - (mx - panX) * (scale / oldScale);
        panY = my - (my - panY) * (scale / oldScale);
        applyTransform();
    }, { passive: false });

    // Drag to pan
    panel.addEventListener('mousedown', (e) => {
        dragging = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        panel.style.cursor = 'grabbing';
    });
    window.addEventListener('mousemove', (e) => {
        if (!dragging) return;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        applyTransform();
    });
    window.addEventListener('mouseup', () => {
        dragging = false;
        panel.style.cursor = 'grab';
    });

    // Touch support
    let lastTouchDist = 0;
    panel.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
            dragging = true;
            startX = e.touches[0].clientX - panX;
            startY = e.touches[0].clientY - panY;
        } else if (e.touches.length === 2) {
            lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        }
    }, { passive: true });
    panel.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && dragging) {
            panX = e.touches[0].clientX - startX;
            panY = e.touches[0].clientY - startY;
            applyTransform();
        } else if (e.touches.length === 2) {
            const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            if (lastTouchDist > 0) {
                scale = Math.max(minScale, Math.min(maxScale, scale * (dist / lastTouchDist)));
                applyTransform();
            }
            lastTouchDist = dist;
        }
    }, { passive: true });
    panel.addEventListener('touchend', () => { dragging = false; lastTouchDist = 0; });

    // Button controls
    document.getElementById('map-zoom-in')?.addEventListener('click', () => {
        scale = Math.min(maxScale, scale * 1.25);
        applyTransform();
    });
    document.getElementById('map-zoom-out')?.addEventListener('click', () => {
        scale = Math.max(minScale, scale * 0.8);
        applyTransform();
    });
    document.getElementById('map-zoom-reset')?.addEventListener('click', () => {
        scale = 1; panX = 0; panY = 0;
        applyTransform();
    });

    applyTransform();
}

function renderNationList(allNations, myNationId, filter) {
    const body = document.getElementById('world-highlight-body');
    if (!body) return;

    // Remove old list if it exists
    const oldList = document.getElementById('world-nation-list');
    if (oldList) oldList.remove();

    const filtered = filter
        ? allNations.filter(n => n.name.toLowerCase().includes(filter.toLowerCase()))
        : allNations;

    const listHtml = filtered.map(n => {
        const isYou = n.id === myNationId;
        const isSelected = n.id === _worldSelectedNationId;
        const nameColor = isSelected ? 'var(--accent)' : isYou ? 'var(--accent)' : 'var(--text-bright)';
        const nameWeight = isSelected || isYou ? '700' : '500';
        const indicator = isSelected ? ' \u25C0' : '';
        const flagUrl = n.flag_url || `assets/flags/${n.name}.png`;
        return `<div class="world-highlight-stat-row" style="cursor:pointer;padding:6px 0;display:flex;align-items:center;gap:8px;" data-nation-id="${n.id}">
            <img src="${flagUrl}" alt="" style="width:24px;height:16px;object-fit:cover;border:1px solid var(--border-main);flex-shrink:0;" onerror="this.style.display='none'">
            <div style="flex:1;min-width:0;">
                <div style="font-size:12px;font-weight:${nameWeight};color:${nameColor};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(n.name)}${isYou ? ' (You)' : ''}${indicator}</div>
                <div style="font-family:var(--font-mono);font-size:9px;color:var(--text-dim);">${escapeHtml(n.government_type || '')}</div>
            </div>
        </div>`;
    }).join('');

    const listDiv = document.createElement('div');
    listDiv.id = 'world-nation-list';
    listDiv.style.cssText = 'padding:0 14px 14px;border-top:1px solid var(--border-main);';
    listDiv.innerHTML = `<div class="world-highlight-section" style="margin-top:8px;">ALL NATIONS</div>${listHtml}`;
    body.after(listDiv);

    listDiv.addEventListener('click', (e) => {
        const row = e.target.closest('[data-nation-id]');

    });

    if (searchInput && !searchInput._wired) {
        searchInput._wired = true;
        searchInput.addEventListener('input', () => {
            renderNationList(allNations, myNationId, searchInput.value);
        });

}

async function selectWorldNation(nationId) {
    const nation = _worldAllNations.find(n => n.id === nationId);
    if (!nation) return;

    const myNationId = _worldState.nation?.id;
    const isYou = nation.id === myNationId;

    // Track selected nation for list highlighting
    _worldSelectedNationId = nationId;
    renderNationList(_worldAllNations, myNationId);

    // Fetch diplomatic data if not cached
    if (!_worldRelations) {
        const [relResult, agreeResult, ambResult] = await Promise.all([
            _supabase.from('diplomatic_relations').select('*'),
            _supabase.from('trade_agreements').select('*').eq('status', 'active'),
            _supabase.from('ambassadors').select('*').eq('status', 'active'),
        ]);
        _worldRelations = relResult.data || [];
        _worldAgreements = agreeResult.data || [];
        _worldAmbassadors = ambResult.data || [];
    }

    // Fetch government + crisis data for the selected nation
    const govData = await fetchNationGovernmentData(nation.id);
    const extraData = { gov: govData, tradeData: null };
    renderNationHighlight(nation, _worldState, _worldRelations, _worldAgreements, _worldAmbassadors, extraData);

    // Fetch bilateral trade data async, then patch just the trade section
    if (!isYou && myNationId) {
        fetchBilateralTrade(myNationId, nation.id).then(tradeData => {
            // Only patch if this nation is still selected
            if (_worldSelectedNationId !== nationId) return;
            const tradeEl = document.getElementById('world-trade-section');
            if (tradeEl) {
                tradeEl.innerHTML = buildTradeHTML(tradeData);
            }
        }).catch(err => {
            console.error('[World] Bilateral trade fetch failed:', err);
        });
    }
}

/**
 * Fetch head of government, coalition parties, and active crises for a nation.
 * Returns { leader, leaderParty, coalitionParties, crises }
 */
async function fetchNationGovernmentData(nationId) {
    try {
    const [hogRes, presRes, coalRes, crisisRes, partiesRes] = await Promise.all([
        _supabase.from('head_of_government')
            .select('first_name, last_name, faction_id')
            .eq('nation_id', nationId)
            .eq('active', true)
            .limit(1)
            .maybeSingle(),
        _supabase.from('presidents')
            .select('first_name, last_name, faction_id')
            .eq('nation_id', nationId)
            .eq('is_active', true)
            .limit(1)
            .maybeSingle(),
        _supabase.from('government_formations')
            .select('party_ids, ministry_assignments, proposed_by, status')
            .eq('nation_id', nationId)
            .in('status', ['formed', 'caretaker'])
            .order('formed_at', { ascending: false })
            .limit(1)
            .maybeSingle(),
        _supabase.from('active_crises')
            .select('crisis_id, crisis_templates(name)')
            .eq('nation_id', nationId),
        _supabase.from('factions')
            .select('id, faction_name, abbreviation, party_color, seats')
            .eq('nation_id', nationId)
            .order('seats', { ascending: false }),
    ]);

    const allParties = partiesRes.data || [];
    const partyMap = {};
    for (const p of allParties) partyMap[p.id] = p;

    // Determine leader: prefer president for presidential, else HOG
    const nation = _worldAllNations.find(n => n.id === nationId);
    const isPresidential = (nation?.government_type || '').toLowerCase().includes('presidential');
    const pres = presRes.data;
    const hog = hogRes.data;
    let leader = null;
    let leaderParty = null;

    if (isPresidential && pres) {
        leader = { name: `${pres.first_name} ${pres.last_name}`, title: 'President' };
        leaderParty = partyMap[pres.faction_id] || null;
    } else if (hog) {
        leader = { name: `${hog.first_name} ${hog.last_name}`, title: 'Prime Minister' };
        leaderParty = partyMap[hog.faction_id] || null;
    } else if (pres) {
        leader = { name: `${pres.first_name} ${pres.last_name}`, title: 'President' };
        leaderParty = partyMap[pres.faction_id] || null;
    }

    // Coalition parties
    const coal = coalRes.data;
    let coalitionParties = [];
    if (coal && coal.party_ids) {
        coalitionParties = coal.party_ids
            .map(id => partyMap[id])
            .filter(Boolean);
    }

    // Crises
    const crises = (crisisRes.data || [])
        .map(c => c.crisis_templates?.name || 'Unknown Crisis')
        .filter(Boolean);

    return { leader, leaderParty, coalitionParties, crises };
    } catch (err) {
        console.error('[World] fetchNationGovernmentData failed:', err);
        return { leader: null, leaderParty: null, coalitionParties: [], crises: [] };
    }
}

let _worldAmbassadors = [];

/**
 * Fetch bilateral trade data between two nations for the latest tick.
 * Returns { exportsToThem, importsFromThem, totalExports, totalImports, balance, tick }
 */
async function fetchBilateralTrade(myNationId, theirNationId) {
    const currentTick = _worldState.shard?.current_tick || 0;
    if (currentTick <= 0) return null;

    // Get the latest tick with trade_partners data (might be 1 tick behind)
    const { data: latestRow } = await _supabase.from('trade_partners')
        .select('tick')
        .or(`exporter_nation_id.eq.${myNationId},exporter_nation_id.eq.${theirNationId}`)
        .order('tick', { ascending: false })
        .limit(1);
    const tradeTick = latestRow?.[0]?.tick ?? currentTick;

    // Fetch what we export TO them and what we import FROM them (at the same tick)
    const [exportsRes, importsRes] = await Promise.all([
        _supabase.from('trade_partners')
            .select('sector, trade_volume')
            .eq('exporter_nation_id', myNationId)
            .eq('importer_nation_id', theirNationId)
            .eq('tick', tradeTick),
        _supabase.from('trade_partners')
            .select('sector, trade_volume')
            .eq('exporter_nation_id', theirNationId)
            .eq('importer_nation_id', myNationId)
            .eq('tick', tradeTick),
    ]);

    const exportsToThem = {};   // sector → volume (what we sell to them)
    const importsFromThem = {}; // sector → volume (what they sell to us)
    let totalExports = 0;
    let totalImports = 0;

    if (exportsRes.data) {
        for (const row of exportsRes.data) {
            const vol = Number(row.trade_volume) || 0;
            exportsToThem[row.sector] = (exportsToThem[row.sector] || 0) + vol;
            totalExports += vol;
        }
    }
    if (importsRes.data) {
        for (const row of importsRes.data) {
            const vol = Number(row.trade_volume) || 0;
            importsFromThem[row.sector] = (importsFromThem[row.sector] || 0) + vol;
            totalImports += vol;
        }
    }

    return {
        exportsToThem,
        importsFromThem,
        totalExports,
        totalImports,
        balance: totalExports - totalImports,
        tick: tradeTick,
    };
}

/**
 * Build trade section inner HTML (used for both initial render and async patch).
 */
function buildTradeHTML(tradeData) {
    if (!tradeData) {
        return `<div class="world-trade-loading">Loading trade data\u2026</div>`;
    }
    if (tradeData.totalExports === 0 && tradeData.totalImports === 0) {
        return `<div style="font-family:var(--font-mono);font-size:8px;color:var(--text-dim);font-style:italic;">No active trade routes.</div>`;
    }

    const allSectors = new Set([
        ...Object.keys(tradeData.exportsToThem),
        ...Object.keys(tradeData.importsFromThem),
    ]);
    const sectorRows = [];
    for (const sector of allSectors) {
        const exp = tradeData.exportsToThem[sector] || 0;
        const imp = tradeData.importsFromThem[sector] || 0;
        sectorRows.push({ sector, exp, imp, total: exp + imp });
    }
    sectorRows.sort((a, b) => b.total - a.total);

    let h = `<table class="world-trade-table">
        <thead><tr><th>Sector</th><th>Exports</th><th>Imports</th><th>Net</th></tr></thead><tbody>`;
    for (const row of sectorRows) {
        const net = row.exp - row.imp;
        const netClass = net > 0 ? 'trade-positive' : net < 0 ? 'trade-negative' : 'trade-zero';
        const netPrefix = net > 0 ? '+' : '';
        h += `<tr>
            <td>${escapeHtml(TRADE_SECTOR_LABELS[row.sector] || row.sector)}</td>
            <td>${fmtBudgetCurrency(row.exp)}</td>
            <td>${fmtBudgetCurrency(row.imp)}</td>
            <td class="${netClass}">${netPrefix}${fmtBudgetCurrency(net)}</td>
        </tr>`;
    }
    h += `</tbody></table>`;

    const balance = tradeData.balance;
    const balClass = balance > 0 ? 'trade-positive' : balance < 0 ? 'trade-negative' : 'trade-zero';
    const balPrefix = balance > 0 ? '+' : '';
    h += `<div class="world-trade-balance">
        <span class="world-trade-balance-label">Trade Balance</span>
        <span class="world-trade-balance-value ${balClass}">${balPrefix}${fmtBudgetCurrency(balance)}</span>
    </div>`;
    h += `<div style="font-family:var(--font-mono);font-size:7px;color:var(--text-dim);margin-top:2px;">
        Total exports: ${fmtBudgetCurrency(tradeData.totalExports)} &middot;
        Total imports: ${fmtBudgetCurrency(tradeData.totalImports)}
    </div>`;
    return h;
}

            const color = p.party_color || '#888';
            html += `<span style="font-family:var(--font-mono);font-size:7px;padding:2px 6px;border:1px solid ${color};color:${color};letter-spacing:0.03em;">${escapeHtml(p.abbreviation || p.faction_name)}${p.seats ? ' \u00B7 ' + p.seats : ''}</span>`;
        }
        html += `</div>`;
    }

    // ── KEY STATS ──
    html += `<div class="world-highlight-section">KEY STATS</div>`;

    const stability = nation.stability ?? 0;
    const stabColor = stability >= 50 ? 'var(--green)' : stability >= 30 ? 'var(--amber)' : 'var(--red)';
    const stats = [
        { label: 'Population', value: popLabel },
        { label: 'GDP', value: gdpLabel },
        { label: 'Stability', value: stability.toFixed(1), color: stabColor },
    ];
    html += stats.map(s => `<div class="world-highlight-stat-row">
        <span class="world-highlight-stat-label">${escapeHtml(s.label)}</span>
        <span class="world-highlight-stat-value" style="${s.color ? 'color:' + s.color : ''}">${s.value}</span>
    </div>`).join('');

    // ── ACTIVE CRISES ──
    if (gov.crises && gov.crises.length > 0) {
        html += `<div class="world-highlight-stat-row">
            <span class="world-highlight-stat-label">Active Crises</span>
            <span class="world-highlight-stat-value" style="color:var(--red);">${gov.crises.length}</span>
        </div>`;
        for (const c of gov.crises) {
            html += `<div style="font-family:var(--font-mono);font-size:8px;color:var(--red);padding:1px 0 1px 8px;">\u26A0 ${escapeHtml(c)}</div>`;
        }
    } else {
        html += `<div class="world-highlight-stat-row">
            <span class="world-highlight-stat-label">Active Crises</span>
            <span class="world-highlight-stat-value" style="color:var(--green);">None</span>
        </div>`;
    }

    // ── DIPLOMATIC RELATIONS (foreign nations only) ──
    let relScore = null;
    let proximity = null;
    if (!isYou && myNationId) {
        const a = myNationId < nation.id ? myNationId : nation.id;
        const b = myNationId < nation.id ? nation.id : myNationId;
        const rel = (relations || []).find(r => r.nation_a_id === a && r.nation_b_id === b);
        if (rel) {
            relScore = Number(rel.relation_score ?? 0);
            proximity = Number(rel.proximity ?? 0);
        }
    }

    const ourAmbassador = !isYou ? (ambassadors || []).find(a => a.home_nation_id === myNationId && a.host_nation_id === nation.id) : null;
    const theirAmbassador = !isYou ? (ambassadors || []).find(a => a.home_nation_id === nation.id && a.host_nation_id === myNationId) : null;

    if (!isYou && relScore !== null) {
        let relLabel = '', relColor = 'var(--text-dim)';
        if (relScore >= 60) { relLabel = 'FRIENDLY'; relColor = 'var(--green)'; }
        else if (relScore >= 30) { relLabel = 'WARM'; relColor = 'var(--green)'; }
        else if (relScore >= -10) { relLabel = 'NEUTRAL'; relColor = 'var(--amber)'; }
        else if (relScore >= -40) { relLabel = 'COOL'; relColor = 'var(--orange)'; }
        else { relLabel = 'HOSTILE'; relColor = 'var(--red)'; }

        html += `<div class="world-highlight-section">DIPLOMATIC RELATIONS</div>`;
        html += `<div class="world-highlight-stat-row">
            <span class="world-highlight-stat-label">Relation Score</span>
            <span class="world-highlight-stat-value" style="color:${relColor};">${relScore} \u2014 ${relLabel}</span>
        </div>`;
        if (proximity !== null) {
            html += `<div class="world-highlight-stat-row">
                <span class="world-highlight-stat-label">Proximity</span>
                <span class="world-highlight-stat-value">${proximity}</span>
            </div>`;
        }
        html += `<div class="world-highlight-stat-row">
            <span class="world-highlight-stat-label">Our Ambassador</span>
            <span class="world-highlight-stat-value" style="color:${ourAmbassador ? 'var(--green)' : 'var(--text-dim)'};">${ourAmbassador ? 'Posted' : 'None'}</span>
        </div>`;
        html += `<div class="world-highlight-stat-row">
            <span class="world-highlight-stat-label">Their Ambassador</span>
            <span class="world-highlight-stat-value" style="color:${theirAmbassador ? 'var(--green)' : 'var(--text-dim)'};">${theirAmbassador ? 'Posted' : 'None'}</span>
        </div>`;
    }

    // ── AGREEMENTS ──
    const bilateralAgreements = isYou ? [] : (agreements || []).filter(ag =>
        (ag.nation_a_id === myNationId && ag.nation_b_id === nation.id) ||
        (ag.nation_a_id === nation.id && ag.nation_b_id === myNationId)
    );
    const allNationAgreements = isYou ? (agreements || []).filter(ag =>
        ag.nation_a_id === nation.id || ag.nation_b_id === nation.id
    ) : [];

    if (!isYou && bilateralAgreements.length > 0) {
        html += `<div class="world-highlight-section">ACTIVE AGREEMENTS (${bilateralAgreements.length})</div>`;
        for (const ag of bilateralAgreements) {
            const typeLabel = AGREE_TYPE_LABELS[ag.agreement_type] || ag.agreement_type;
            const isHostile = ag.agreement_type === 'retaliatory_tariff' || ag.agreement_type === 'impose_embargo';
            html += `<div style="padding:4px 0;border-bottom:1px solid var(--border-light);">
                <div style="font-size:9px;font-weight:600;color:${isHostile ? 'var(--red)' : 'var(--text-bright)'};">${escapeHtml(ag.agreement_name || typeLabel)}</div>
                <div style="font-family:var(--font-mono);font-size:7px;color:var(--text-dim);">${escapeHtml(typeLabel)}</div>
            </div>`;
        }
    } else if (!isYou && bilateralAgreements.length === 0) {
        html += `<div class="world-highlight-section">AGREEMENTS</div>`;
        html += `<div style="font-family:var(--font-mono);font-size:8px;color:var(--text-dim);font-style:italic;">No active agreements.</div>`;
    }

    if (isYou && allNationAgreements.length > 0) {
        html += `<div class="world-highlight-section">YOUR AGREEMENTS (${allNationAgreements.length})</div>`;
        for (const ag of allNationAgreements.slice(0, 8)) {
            const otherNationId = ag.nation_a_id === nation.id ? ag.nation_b_id : ag.nation_a_id;
            const otherNation = _worldAllNations.find(n => n.id === otherNationId);
            const typeLabel = AGREE_TYPE_LABELS[ag.agreement_type] || ag.agreement_type;
            html += `<div style="padding:3px 0;border-bottom:1px solid var(--border-light);">
                <div style="font-size:9px;font-weight:600;color:var(--text-bright);">${escapeHtml(ag.agreement_name || typeLabel)}</div>
                <div style="font-family:var(--font-mono);font-size:7px;color:var(--text-dim);">with ${escapeHtml(otherNation?.name || 'Unknown')} \u00B7 ${escapeHtml(typeLabel)}</div>
            </div>`;
        }
        if (allNationAgreements.length > 8) {
            html += `<div style="font-family:var(--font-mono);font-size:7px;color:var(--text-dim);margin-top:4px;">+ ${allNationAgreements.length - 8} more</div>`;
        }
    }

    // ── BILATERAL TRADE (foreign nations, async-patched) ──
    if (!isYou) {
        html += `<div class="world-highlight-section">BILATERAL TRADE</div>`;
        html += `<div id="world-trade-section">${buildTradeHTML(tradeData)}</div>`;
    }

    body.innerHTML = html;
}
