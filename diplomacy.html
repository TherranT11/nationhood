async function fetchPendingDiploProposals(myNationId, targetNationId) {
    if (!myNationId || !targetNationId || myNationId === targetNationId) return [];
    try {
        const { data } = await _supabase
            .from('diplomatic_proposals')
            .select('*')
            .eq('proposal_type', 'diplomatic_initiative')
            .in('status', ['proposed', 'revised'])
            .or(
                'and(proposing_nation_id.eq.' + myNationId + ',target_nation_id.eq.' + targetNationId + '),' +
                'and(proposing_nation_id.eq.' + targetNationId + ',target_nation_id.eq.' + myNationId + ')'
            );
        return data || [];
    } catch (e) {
        console.warn('Error fetching pending diplomatic proposals:', e);
        return [];
    }
}

function renderPendingProposals(proposals, targetNation) {
    if (!proposals || proposals.length === 0) return '';

    const cards = proposals.map(p => {
        const pd = p.proposal_data || {};
        const articles = pd.articles || [];
        const struckIndices = new Set(pd.struck_articles || []);
        const isIncoming = p.target_nation_id === currentNation.id;
        const isRevised = p.status === 'revised';
        const revisedByUs = isRevised && (pd.revised_by_nation_id ? pd.revised_by_nation_id === currentNation.id : !isIncoming);
        const revisedByThem = isRevised && !revisedByUs;

        // Determine who needs to act
        let statusBadge = '';
        let actionButtons = '';

        if (p.status === 'proposed' && isIncoming) {
            // We are the target — we can Accept/Reject/Strike
            statusBadge = '<span class="proposal-status-badge badge-action">Awaiting Your Response</span>';
            const articleRows = articles.map((art, i) => {
                const moneyStr = art.money > 0 ? '+$' + (art.money / 1e6).toFixed(0) + 'M' : art.money < 0 ? '-$' + (Math.abs(art.money) / 1e6).toFixed(0) + 'M' : '';
                const relStr = art.relations > 0 ? '+' + art.relations + ' Relations' : '';
                const effectParts = [relStr, moneyStr].filter(Boolean).join(', ');
                return '<div class="proposal-article-row">' +
                    '<input type="checkbox" class="strike-checkbox" data-proposal-id="' + p.id + '" data-article-index="' + i + '" />' +
                    '<div class="proposal-article-content">' +
                        '<span class="proposal-article-num">Article ' + toRoman(i + 1) + '.</span> ' +
                        '<span class="proposal-article-label">' + escapeHtml(art.text || art.label) + '</span>' +
                        (effectParts ? '<span class="proposal-article-effects">' + effectParts + '</span>' : '') +
                    '</div>' +
                '</div>';
            }).join('');

            actionButtons = '<div class="proposal-articles-list">' + articleRows + '</div>' +
                '<div class="proposal-btn-row">' +
                    '<button class="proposal-accept-btn" onclick="acceptProposal(\'' + p.id + '\')">Accept</button>' +
                    '<button class="proposal-strike-btn" onclick="strikeArticles(\'' + p.id + '\')">Strike Selected</button>' +
                    '<button class="proposal-reject-btn" onclick="rejectProposal(\'' + p.id + '\')">Reject</button>' +
                '</div>';
        } else if (p.status === 'proposed' && !isIncoming) {
            // We sent it — waiting
            statusBadge = '<span class="proposal-status-badge badge-waiting">Awaiting Response</span>';
            const articleRows = articles.map((art, i) =>
                '<div class="proposal-article-row"><div class="proposal-article-content">' +
                    '<span class="proposal-article-num">Article ' + toRoman(i + 1) + '.</span> ' +
                    '<span class="proposal-article-label">' + escapeHtml(art.text || art.label) + '</span>' +
                '</div></div>'
            ).join('');
            actionButtons = '<div class="proposal-articles-list">' + articleRows + '</div>';
        } else if (isRevised && !revisedByUs) {
            // They struck articles and sent it back — we need to accept/reject
            statusBadge = '<span class="proposal-status-badge badge-action">Revised — Awaiting Your Response</span>';
            const articleRows = articles.map((art, i) => {
                const isStruck = struckIndices.has(i);
                const moneyStr = art.money > 0 ? '+$' + (art.money / 1e6).toFixed(0) + 'M' : art.money < 0 ? '-$' + (Math.abs(art.money) / 1e6).toFixed(0) + 'M' : '';
                const relStr = art.relations > 0 ? '+' + art.relations + ' Relations' : '';
                const effectParts = [relStr, moneyStr].filter(Boolean).join(', ');
                return '<div class="proposal-article-row' + (isStruck ? ' proposal-article-struck' : '') + '">' +
                    '<div class="proposal-article-content">' +
                        (isStruck ? '<span class="struck-label">STRUCK</span> ' : '') +
                        '<span class="proposal-article-num">Article ' + toRoman(i + 1) + '.</span> ' +
                        '<span class="proposal-article-label">' + escapeHtml(art.text || art.label) + '</span>' +
                        (!isStruck && effectParts ? '<span class="proposal-article-effects">' + effectParts + '</span>' : '') +
                    '</div>' +
                '</div>';
            }).join('');

            actionButtons = '<div class="proposal-articles-list">' + articleRows + '</div>' +
                '<div class="proposal-btn-row">' +
                    '<button class="proposal-accept-btn" onclick="acceptProposal(\'' + p.id + '\')">Accept Revised</button>' +
                    '<button class="proposal-reject-btn" onclick="rejectProposal(\'' + p.id + '\')">Reject</button>' +
                '</div>';
        } else if (isRevised && revisedByUs) {
            // We struck articles — waiting for them
            statusBadge = '<span class="proposal-status-badge badge-waiting">Revision Sent — Awaiting Response</span>';
            const articleRows = articles.map((art, i) => {
                const isStruck = struckIndices.has(i);
                return '<div class="proposal-article-row' + (isStruck ? ' proposal-article-struck' : '') + '">' +
                    '<div class="proposal-article-content">' +
                        (isStruck ? '<span class="struck-label">STRUCK</span> ' : '') +
                        '<span class="proposal-article-num">Article ' + toRoman(i + 1) + '.</span> ' +
                        '<span class="proposal-article-label">' + escapeHtml(art.text || art.label) + '</span>' +
                    '</div>' +
                '</div>';
            }).join('');
            actionButtons = '<div class="proposal-articles-list">' + articleRows + '</div>';
        }

        // Calculate totals from active (non-struck) articles
        let totalRel = 0, totalMoney = 0;
        articles.forEach((art, i) => { if (!struckIndices.has(i)) { totalRel += art.relations || 0; totalMoney += art.money || 0; } });
        const totalRelStr = totalRel > 0 ? '+' + totalRel + ' Relations' : totalRel < 0 ? totalRel + ' Relations' : '';
        const totalMoneyStr = totalMoney > 0 ? '+$' + (totalMoney / 1e6).toFixed(0) + 'M FM Fund' : totalMoney < 0 ? '-$' + (Math.abs(totalMoney) / 1e6).toFixed(0) + 'M FM Fund' : '';
        const totalEffects = [totalRelStr, totalMoneyStr].filter(Boolean).join(' | ');

        return '<div class="pending-proposal-card">' +
            '<div class="pending-proposal-header">' +
                '<div class="pending-proposal-name">' + escapeHtml(pd.name || 'Unnamed Initiative') + '</div>' +
                statusBadge +
            '</div>' +
            '<div class="pending-proposal-meta">' +
                escapeHtml(pd.proposer_ambassador_name || '') + ' of ' + escapeHtml(pd.proposer_nation_name || '') +
                ' &amp; ' + escapeHtml(pd.target_ambassador_name || '') + ' of ' + escapeHtml(pd.target_nation_name || '') +
                ' &middot; ' + (pd.duration_years || '?') + ' year' + ((pd.duration_years || 0) !== 1 ? 's' : '') +
            '</div>' +
            (totalEffects ? '<div class="pending-proposal-effects">' + totalEffects + '</div>' : '') +
            actionButtons +
        '</div>';
    }).join('');

    return '<div class="diplo-section-title">Pending Proposals</div>' + cards;
}

function toRoman(num) {
    const map = [[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
    let result = '';
    for (const [val, sym] of map) { while (num >= val) { result += sym; num -= val; } }
    return result;
}

async function openInitiativeForm() {
    const target = selectedTargetNation;
    const theirAmb = selectedTheirAmbassador;
    if (!target || !theirAmb) return;

    const ourAmb = diplomaticRoles.ambassadorTo.find(a => a.target_nation_id === target.id);
    if (!ourAmb) return;

    // Fetch our ambassador's full name
    const ourAmbName = ((ourAmb.ambassador_first_name || '') + ' ' + (ourAmb.ambassador_last_name || '')).trim() + (ourAmb.factions?.abbreviation ? ' (' + ourAmb.factions.abbreviation + ')' : '');
    const theirAmbName = ((theirAmb.ambassador_first_name || '') + ' ' + (theirAmb.ambassador_last_name || '')).trim() + (theirAmb.factions?.abbreviation ? ' (' + theirAmb.factions.abbreviation + ')' : '');

    initiativeArticles = [];

    // Fetch article types already used in active or pending proposals between these nations
    usedArticleTypes = new Set();
    try {
        const { data: existing } = await _supabase
            .from('diplomatic_proposals')
            .select('proposal_data, status')
            .eq('proposal_type', 'diplomatic_initiative')
            .in('status', ['proposed', 'revised', 'active'])
            .or(
                'and(proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + target.id + '),' +
                'and(proposing_nation_id.eq.' + target.id + ',target_nation_id.eq.' + currentNation.id + ')'
            );
        if (existing) {
            for (const prop of existing) {
                const arts = prop.proposal_data?.articles || [];
                const struck = new Set(prop.proposal_data?.struck_articles || []);
                arts.forEach((art, i) => {
                    // For active: skip struck articles. For proposed/revised: all articles count.
                    if (prop.status === 'active' && struck.has(i)) return;
                    if (art.type) usedArticleTypes.add(art.type);
                });
            }
        }
    } catch (e) {
        console.warn('Error fetching existing proposals for type check:', e);
    }

    const container = document.getElementById('initiative-form-container');
    if (!container) return;

    const typeOptions = Object.entries(INITIATIVE_TYPES).map(([key, t]) =>
        '<option value="' + key + '"' + (usedArticleTypes.has(key) ? ' disabled' : '') + '>' +
        t.label + (usedArticleTypes.has(key) ? ' (Already Active)' : '') + '</option>'
    ).join('');

    const durationOptions = [1,2,3,4,5,6,7].map(y =>
        '<option value="' + y + '">' + y + ' Year' + (y > 1 ? 's' : '') + '</option>'
    ).join('');

    container.innerHTML = `
        <div class="initiative-form">
            <div class="initiative-form-title">Diplomatic Initiative</div>
            <div class="initiative-form-subtitle">
                Ambassador ${escapeHtml(ourAmbName.trim())} of ${escapeHtml(currentNation.name)}
                in collaboration with Ambassador ${escapeHtml(theirAmbName.trim())} of ${escapeHtml(target.name)}
            </div>

            <div class="initiative-field">
                <label>Name of Initiative / Agreement</label>
                <input type="text" id="initiative-name" placeholder="e.g. The Concordia Accord" maxlength="120" oninput="updateInitiativePreview()" />
            </div>

            <div class="initiative-field">
                <label>Add Article</label>
                <div style="display:flex;gap:6px;">
                    <select id="initiative-type-select" style="flex:1;">${typeOptions}</select>
                    <button class="action-btn" style="white-space:nowrap;" onclick="addInitiativeArticle()">+ Add</button>
                </div>
            </div>

            <div id="initiative-articles-list" class="initiative-articles-list"></div>

            <div class="initiative-field">
                <label>Duration</label>
                <select id="initiative-duration" onchange="updateInitiativePreview()">${durationOptions}</select>
            </div>

            <div id="initiative-preview" class="initiative-preview" style="display:none;"></div>
            <div id="initiative-effects" class="initiative-effects"></div>

            <div class="initiative-btn-row">
                <button class="proposal-accept-btn" id="initiative-submit-btn" onclick="submitInitiative()" disabled>Submit</button>
                <button class="proposal-reject-btn" onclick="closeInitiativeForm()">Exit</button>
            </div>
        </div>
    `;
}

function addInitiativeArticle() {
    const sel = document.getElementById('initiative-type-select');
    if (!sel) return;
    const key = sel.value;
    const typeInfo = INITIATIVE_TYPES[key];
    if (!typeInfo) return;

    // Block if already used in an active/pending proposal between these nations
    if (usedArticleTypes.has(key)) {
        alert(typeInfo.label + ' is already part of an active or pending agreement with this nation.');
        return;
    }

    // Block duplicates within the same proposal
    if (initiativeArticles.some(a => a.type === key)) {
        alert(typeInfo.label + ' is already included in this initiative.');
        return;
    }

    initiativeArticles.push({
        type: key,
        label: typeInfo.label,
        description: typeInfo.description,
        relations: typeInfo.relations,
        money: typeInfo.money
    });
    renderInitiativeArticles();
    updateInitiativePreview();
    refreshInitiativeDropdown();
}

function refreshInitiativeDropdown() {
    const sel = document.getElementById('initiative-type-select');
    if (!sel) return;
    const currentInProposal = new Set(initiativeArticles.map(a => a.type));
    Array.from(sel.options).forEach(opt => {
        const blocked = usedArticleTypes.has(opt.value) || currentInProposal.has(opt.value);
        opt.disabled = blocked;
        const base = INITIATIVE_TYPES[opt.value]?.label || opt.value;
        opt.textContent = base + (usedArticleTypes.has(opt.value) ? ' (Already Active)' : currentInProposal.has(opt.value) ? ' (Added)' : '');
    });
    // Auto-select first available option
    const firstAvail = Array.from(sel.options).find(o => !o.disabled);
    if (firstAvail) sel.value = firstAvail.value;
}

function removeInitiativeArticle(index) {
    initiativeArticles.splice(index, 1);
    renderInitiativeArticles();
    updateInitiativePreview();
    refreshInitiativeDropdown();
}

function renderInitiativeArticles() {
    const list = document.getElementById('initiative-articles-list');
    if (!list) return;

    if (initiativeArticles.length === 0) {
        list.innerHTML = '<div style="color:#666;font-size:0.78rem;font-style:italic;padding:8px 0;">No articles added yet.</div>';
        return;
    }

    list.innerHTML = initiativeArticles.map((art, i) => {
        const moneyStr = art.money > 0 ? '+$' + (art.money / 1e6).toFixed(0) + 'M' : art.money < 0 ? '-$' + (Math.abs(art.money) / 1e6).toFixed(0) + 'M' : '';
        const relStr = art.relations > 0 ? '+' + art.relations + ' Rel' : '';
        const effectParts = [relStr, moneyStr].filter(Boolean).join(', ');
        return '<div class="initiative-article-item">' +
            '<span class="initiative-article-num">Art. ' + toRoman(i + 1) + '</span>' +
            '<span class="initiative-article-label">' + escapeHtml(art.label) + '</span>' +
            (effectParts ? '<span class="initiative-article-effects">' + effectParts + '</span>' : '') +
            '<button class="initiative-article-remove" onclick="removeInitiativeArticle(' + i + ')">X</button>' +
        '</div>';
    }).join('');
}

function updateInitiativePreview() {
    const nameInput = document.getElementById('initiative-name');
    const durationSelect = document.getElementById('initiative-duration');
    const previewEl = document.getElementById('initiative-preview');
    const effectsEl = document.getElementById('initiative-effects');
    const submitBtn = document.getElementById('initiative-submit-btn');
    if (!previewEl || !effectsEl) return;

    const name = nameInput?.value?.trim() || '';
    const duration = parseInt(durationSelect?.value || '1');

    if (initiativeArticles.length === 0 || !name) {
        previewEl.style.display = 'none';
        effectsEl.innerHTML = '';
        if (submitBtn) submitBtn.disabled = true;
        return;
    }

    if (submitBtn) submitBtn.disabled = false;

    const target = selectedTargetNation;
    const theirAmb = selectedTheirAmbassador;
    const ourAmb = diplomaticRoles.ambassadorTo.find(a => a.target_nation_id === target?.id);
    const ourAmbName = ourAmb ? ((ourAmb.ambassador_first_name || '') + ' ' + (ourAmb.ambassador_last_name || '')).trim() + (ourAmb.factions?.abbreviation ? ' (' + ourAmb.factions.abbreviation + ')' : '') : '?';
    const theirAmbName = theirAmb ? ((theirAmb.ambassador_first_name || '') + ' ' + (theirAmb.ambassador_last_name || '')).trim() + (theirAmb.factions?.abbreviation ? ' (' + theirAmb.factions.abbreviation + ')' : '') : '?';

    const articlesHtml = initiativeArticles.map((art, i) =>
        '<div class="preview-article"><span class="preview-article-num">Article ' + toRoman(i + 1) + '.</span> ' +
        '<strong>' + escapeHtml(art.label) + '</strong> — ' + escapeHtml(art.description) + '</div>'
    ).join('');

    previewEl.style.display = 'block';
    previewEl.innerHTML =
        '<div class="preview-title">' + escapeHtml(name) + '</div>' +
        '<div class="preview-subtitle">' +
            'Ambassador ' + escapeHtml(ourAmbName) + ' of ' + escapeHtml(currentNation?.name || '') +
            ' in collaboration with Ambassador ' + escapeHtml(theirAmbName) + ' of ' + escapeHtml(target?.name || '') +
        '</div>' +
        '<div class="preview-label">Proposes:</div>' +
        articlesHtml +
        '<div class="preview-duration">To last a sum of ' + duration + ' year' + (duration !== 1 ? 's' : '') + '.</div>';

    // Compute totals
    let totalRel = 0, totalMoney = 0;
    initiativeArticles.forEach(a => { totalRel += a.relations || 0; totalMoney += a.money || 0; });
    const relStr = totalRel > 0 ? '+' + totalRel + ' Relations' : totalRel < 0 ? totalRel + ' Relations' : '0 Relations';
    const moneyStr = totalMoney > 0 ? '+$' + (totalMoney / 1e6).toFixed(0) + 'M FM Fund' : totalMoney < 0 ? '-$' + (Math.abs(totalMoney) / 1e6).toFixed(0) + 'M FM Fund' : '$0 FM Fund';
    effectsEl.innerHTML = '<span class="effect-tag effect-rel">' + relStr + '</span><span class="effect-tag effect-money">' + moneyStr + '</span>';
}

function closeInitiativeForm() {
    const container = document.getElementById('initiative-form-container');
    if (container) container.innerHTML = '';
    initiativeArticles = [];
}

async function submitInitiative() {
    const nameInput = document.getElementById('initiative-name');
    const durationSelect = document.getElementById('initiative-duration');
    const name = nameInput?.value?.trim();
    const duration = parseInt(durationSelect?.value || '1');

    if (!name) { alert('Please enter a name for the initiative.'); return; }
    if (initiativeArticles.length === 0) { alert('Please add at least one article.'); return; }

    const target = selectedTargetNation;
    const theirAmb = selectedTheirAmbassador;
    if (!target || !theirAmb) { alert('No target nation or ambassador.'); return; }

    const ourAmb = diplomaticRoles.ambassadorTo.find(a => a.target_nation_id === target.id);
    if (!ourAmb) { alert('You are not ambassador to this nation.'); return; }

    // Deduct AP for diplomatic initiative
    const apCost = DIPLOMACY_CONFIG.PROPOSE_INITIATIVE_AP;
    const apResult = await deductAP(_supabase, currentFaction.id, apCost);
    if (!apResult.success) {
        alert('Not enough AP (' + apCost + ' needed). Current AP: ' + (currentFaction.action_points || 0));
        return;
    }
    currentFaction.action_points = apResult.newAp;

    const ourAmbName = ((ourAmb.ambassador_first_name || '') + ' ' + (ourAmb.ambassador_last_name || '')).trim() + (ourAmb.factions?.abbreviation ? ' (' + ourAmb.factions.abbreviation + ')' : '');
    const theirAmbName = ((theirAmb.ambassador_first_name || '') + ' ' + (theirAmb.ambassador_last_name || '')).trim() + (theirAmb.factions?.abbreviation ? ' (' + theirAmb.factions.abbreviation + ')' : '');

    // Get current tick
    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const currentTick = shard?.current_tick || 0;

    // Determine classification: MAJOR if any article is MAJOR type
    const hasMajorArticle = initiativeArticles.some(a => {
        const typeInfo = INITIATIVE_TYPES[a.type];
        return typeInfo && typeInfo.classification === 'MAJOR';
    });
    const classification = hasMajorArticle ? 'MAJOR' : 'MINOR';
    const proposalTier = hasMajorArticle ? 3 : 1;

    const proposalData = {
        name: name,
        classification: classification,
        duration_years: duration,
        articles: initiativeArticles.map(a => ({ type: a.type, label: a.label, description: a.description, relations: a.relations, money: a.money })),
        proposer_ambassador_name: ourAmbName,
        target_ambassador_name: theirAmbName,
        proposer_nation_name: currentNation.name,
        target_nation_name: target.name
    };

    const { error } = await _supabase.from('diplomatic_proposals').insert({
        proposing_nation_id: currentNation.id,
        target_nation_id: target.id,
        proposed_by_faction_id: currentFaction.id,
        proposal_type: 'diplomatic_initiative',
        proposal_tier: proposalTier,
        status: 'proposed',
        proposal_data: proposalData,
        proposed_at_tick: currentTick
    });

    if (error) {
        console.error('Error submitting initiative:', error);
        alert('Error submitting initiative: ' + error.message);
        return;
    }

    alert('Diplomatic Initiative "' + name + '" proposed to ' + target.name + '!');
    closeInitiativeForm();

    // Refresh the expanded card
    if (selectedTargetNation) await renderNationCardBody(selectedTargetNation.id);
}

// ==================== ACTIVATE TRADE AGREEMENT ====================
async function activateTradeAgreement(proposal, currentTick) {
    const pd = proposal.proposal_data || {};
    const allArticles = pd.articles || [];
    const struckIndices = new Set(pd.struck_articles || []);

    // Collect non-struck original articles
    const activeArticles = allArticles.filter((_, i) => !struckIndices.has(i));
    // Add counter-party's added articles
    if (pd.added_articles && pd.added_articles.length > 0) {
        activeArticles.push(...pd.added_articles);
    }

    // Get duration from articles
    const durationArt = activeArticles.find(a => a.type === 'duration');
    const dt = durationArt?.data || {};
    const durationTicks = dt.duration_type === 'permanent' ? null : (dt.duration_ticks || 480);
    const expiresAt = durationTicks ? currentTick + durationTicks : null;

    // Canonical nation ordering (lexicographic for UUID strings)
    const nationAId = proposal.proposing_nation_id < proposal.target_nation_id ? proposal.proposing_nation_id : proposal.target_nation_id;
    const nationBId = proposal.proposing_nation_id < proposal.target_nation_id ? proposal.target_nation_id : proposal.proposing_nation_id;

    const { error } = await _supabase.from('trade_agreements').insert({
        nation_a_id: nationAId,
        nation_b_id: nationBId,
        agreement_type: pd.agreement_type,
        agreement_name: pd.agreement_name || pd.name || 'Trade Agreement',
        articles: activeArticles,
        status: 'active',
        enacted_at_tick: currentTick,
        expires_at_tick: expiresAt,
        auto_renew: dt.auto_renew || false,
        withdrawal_notice_ticks: dt.withdrawal_notice_ticks || 3,
        diplomatic_proposal_id: proposal.id
    });

    if (error) {
        console.error('Error creating trade agreement:', error);
        alert('Error activating trade agreement: ' + error.message);
        return false;
    }
    return true;
}

async function acceptProposal(proposalId) {
    // Fetch the proposal
    const { data: proposal, error: fetchErr } = await _supabase
        .from('diplomatic_proposals')
        .select('*')
        .eq('id', proposalId)
        .single();

    if (fetchErr || !proposal) { alert('Could not load proposal.'); return; }

    // Status guard: only accept proposals that are still actionable
    if (!['proposed', 'revised'].includes(proposal.status)) {
        alert('This proposal is no longer actionable (status: ' + proposal.status + ').');
        if (selectedTargetNation) await renderNationCardBody(selectedTargetNation.id);
        return;
    }

    // Authorization: caller must be target nation's ambassador to proposer, FM, HoG, or MoT (for trade)
    await refreshRoles();
    const isTargetNation = proposal.target_nation_id === currentNation.id;
    const isAmbToProposer = diplomaticRoles.ambassadorTo.some(a => a.target_nation_id === proposal.proposing_nation_id);
    const isMoTForTrade = proposal.proposal_type === 'trade_agreement' && diplomaticRoles.isMoT;
    if (!isTargetNation || (!isAmbToProposer && !diplomaticRoles.isFM && !diplomaticRoles.isHoG && !isMoTForTrade)) {
        alert('You are not authorized to accept this proposal.');
        return;
    }

    const pd = proposal.proposal_data || {};
    const articles = pd.articles || [];
    const struckIndices = new Set(pd.struck_articles || []);
    const classification = pd.classification || 'MINOR';

    // Calculate totals from active (non-struck) articles
    let totalRel = 0, totalMoney = 0;
    const activeArticles = [];
    articles.forEach((art, i) => {
        if (!struckIndices.has(i)) {
            totalRel += art.relations || 0;
            totalMoney += art.money || 0;
            activeArticles.push(art);
        }
    });

    const articleCount = activeArticles.length;
    const effectSummary = (totalRel ? (totalRel > 0 ? '+' : '') + totalRel + ' Relations' : '') +
        (totalRel && totalMoney ? ', ' : '') +
        (totalMoney ? (totalMoney > 0 ? '+' : '-') + '$' + (Math.abs(totalMoney) / 1e6).toFixed(0) + 'M FM Fund' : '');

    // MAJOR agreements go to FM review after ambassador acceptance
    const isMajor = classification === 'MAJOR';
    const confirmMsg = isMajor
        ? 'Accept "' + (pd.name || 'Initiative') + '"?\n\n' +
          articleCount + ' article(s).\n' +
          (effectSummary || 'No mechanical effects.') + '\n\n' +
          'Duration: ' + (pd.duration_years || '?') + ' year(s)\n\n' +
          'Note: As a MAJOR agreement, this will be sent to the Foreign Minister for review before taking effect.'
        : 'Accept "' + (pd.name || 'Initiative') + '"?\n\n' +
          articleCount + ' article(s) will take effect.\n' +
          (effectSummary || 'No mechanical effects.') + '\n\n' +
          'Duration: ' + (pd.duration_years || '?') + ' year(s)';

    if (!confirm(confirmMsg)) return;

    // Get current tick
    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const currentTick = shard?.current_tick || 0;

    if (isMajor) {
        // MAJOR pipeline: Ambassador accepted → FM review
        const updatedPipeline = { ...(pd.pipeline || {}), ambassador_accepted_at: currentTick };
        pd.pipeline = updatedPipeline;

        const { error: updateErr } = await _supabase
            .from('diplomatic_proposals')
            .update({ status: 'fm_review', proposal_data: pd })
            .eq('id', proposalId);

        if (updateErr) { alert('Error accepting proposal: ' + updateErr.message); return; }

        // Fire CIVIC news event for FM review stage
        await fireProposalEvent(pd, currentTick, 'ambassador_accepted',
            'Ambassadors have agreed on "' + (pd.name || 'Agreement') + '" between ' +
            pd.proposer_nation_name + ' and ' + pd.target_nation_name +
            '. The MAJOR agreement now awaits Foreign Minister review.');

        alert('"' + (pd.name || 'Initiative') + '" accepted by ambassadors.\n\nAs a MAJOR agreement, it has been forwarded to the Foreign Minister for review.');
    } else {
        // MINOR: activate immediately (original flow)
        const { error: updateErr } = await _supabase
            .from('diplomatic_proposals')
            .update({ status: 'active', activated_at_tick: currentTick })
            .eq('id', proposalId);

        if (updateErr) { alert('Error accepting proposal: ' + updateErr.message); return; }

        // For trade_agreement proposals, create the trade_agreements row
        if (proposal.proposal_type === 'trade_agreement') {
            if (!await activateTradeAgreement(proposal, currentTick)) return;
        }

        // Apply effects (for diplomatic initiatives with relation/money effects)
        await applyProposalEffects(proposal, currentTick);

        // Fire event for ALL nations
        const articleNames = activeArticles.map(a => a.label || a.text || '').join(', ');
        await fireProposalEvent(pd, currentTick, 'activated',
            pd.proposer_nation_name + ' and ' + pd.target_nation_name +
            ' have signed "' + (pd.name || 'Diplomatic Initiative') + '". ' +
            'The ' + articleCount + '-article agreement (' + articleNames + ') is effective for ' + (pd.duration_years || '?') + ' year(s).');

        alert('"' + (pd.name || 'Initiative') + '" has been accepted and is now active!');
    }

    // Refresh the expanded card + inbox
    if (selectedTargetNation) await renderNationCardBody(selectedTargetNation.id);
    { const _apEl = document.getElementById('diplo-ap'); if (_apEl) _apEl.textContent = (currentFaction?.action_points ?? 0) + ' AP'; };
}

    const isAmbToProposer = diplomaticRoles.ambassadorTo.some(a => a.target_nation_id === proposal.proposing_nation_id);

async function strikeArticles(proposalId) {
    const checkboxes = document.querySelectorAll('.strike-checkbox[data-proposal-id="' + proposalId + '"]:checked');
    if (checkboxes.length === 0) { alert('Select at least one article to strike.'); return; }

    const struckIndices = [];
    checkboxes.forEach(cb => struckIndices.push(parseInt(cb.dataset.articleIndex)));

    // Fetch proposal to get current data
    const { data: proposal } = await _supabase
        .from('diplomatic_proposals')
        .select('*')
        .eq('id', proposalId)
        .single();

    if (!proposal) { alert('Could not load proposal.'); return; }

    // Authorization: caller must be target nation's ambassador to proposer, or FM/HoG
    await refreshRoles();
    const isTargetNation = proposal.target_nation_id === currentNation.id;
    const isAmbToProposer = diplomaticRoles.ambassadorTo.some(a => a.target_nation_id === proposal.proposing_nation_id);
    if (!isTargetNation || (!isAmbToProposer && !diplomaticRoles.isFM && !diplomaticRoles.isHoG)) {
        alert('You are not authorized to revise this proposal.');
        return;
    }

    const pd = proposal.proposal_data || {};
    const totalArticles = (pd.articles || []).length;

    if (struckIndices.length >= totalArticles) {
        alert('Cannot strike all articles. Use Reject instead.');
        return;
    }

    // Merge any previously struck articles
    const existingStruck = pd.struck_articles || [];
    const allStruck = [...new Set([...existingStruck, ...struckIndices])];

    if (!confirm('Strike ' + struckIndices.length + ' article(s) and send revised agreement back?')) return;

    pd.struck_articles = allStruck;
    pd.revised_by_nation_id = currentNation.id;

    const { error } = await _supabase
        .from('diplomatic_proposals')
        .update({ status: 'revised', proposal_data: pd })
        .eq('id', proposalId);

    if (error) { alert('Error sending revision: ' + error.message); return; }

    alert('Revised agreement sent back with ' + struckIndices.length + ' article(s) struck.');
    if (selectedTargetNation) await renderNationCardBody(selectedTargetNation.id);
}

function renderCounterArticleEditor(container, articleType, proposalId) {
    const artTypeInfo = TRADE_ARTICLE_TYPES[articleType];
    if (!artTypeInfo) return;

    let html = '<div class="trade-article-builder" style="margin-top:10px;border-color:var(--accent);">';
    html += '<div class="trade-article-header"><span class="trade-article-title">New: ' + escapeHtml(artTypeInfo.label) + '</span></div>';

    switch (articleType) {
        case 'duration': html += renderDurationEditor(); break;
        case 'sector_exemption': html += renderSectorExemptionEditor(); break;
        case 'tariff_reduction': html += renderTariffReductionEditor(); break;
        case 'supply_commitment': html += renderSupplyCommitmentEditor(); break;
        case 'price_terms': html += renderPriceTermsEditor(); break;
        case 'breach_penalty': html += renderBreachPenaltyEditor(); break;
        case 'subsidized_sector': html += renderSubsidizedSectorEditor(); break;
        case 'funding_source': html += renderFundingSourceEditor(); break;
        case 'text_article': html += renderTextArticleEditor(); break;
        case 'aid_terms': html += renderAidTermsEditor(); break;
        case 'aid_condition': html += renderAidConditionEditor(); break;
        case 'tariff_surcharge': html += renderTariffSurchargeEditor(); break;
    }

    html += `
        <div style="display:flex;gap:8px;margin-top:12px;">
            <button class="wizard-next-btn" style="font-size:0.75rem;padding:6px 14px;" onclick="saveCounterTradeArticle('${articleType}', '${proposalId}')">Add Article</button>
            <button class="wizard-back-btn" style="font-size:0.75rem;padding:6px 14px;" onclick="document.getElementById('counter-article-editor-${proposalId}').innerHTML=''">Cancel</button>
        </div>
    `;
    html += '</div>';
    container.innerHTML = html;
}

function saveCounterTradeArticle(articleType, proposalId) {
    // Reuse the same parsing logic as saveWizardTradeArticle
    let articleData = {};

    switch (articleType) {
        case 'duration': {
            const durType = document.querySelector('input[name="dur-type"]:checked')?.value || 'fixed';
            const ticks = Math.min(240, Math.max(4, parseInt(document.getElementById('dur-ticks')?.value || '12')));
            const autoRenew = document.getElementById('dur-autorenew')?.checked || false;
            const withdrawal = Math.min(6, Math.max(1, parseInt(document.getElementById('dur-withdrawal')?.value || '3')));
            articleData = { duration_type: durType, duration_ticks: durType === 'fixed' ? ticks : null, auto_renew: autoRenew, withdrawal_notice_ticks: withdrawal };
            break;
        }
        case 'sector_exemption': {
            const sector = document.getElementById('exempt-sector')?.value;
            const reason = document.getElementById('exempt-reason')?.value?.trim() || '';
            if (!sector) { alert('Please select a sector.'); return; }
            articleData = { sector, reason };
            break;
        }
        case 'tariff_reduction': {
            const sector = document.getElementById('tariff-sector')?.value;
            const direction = document.querySelector('input[name="tariff-dir"]:checked')?.value || 'mutual';
            const pct = Math.min(100, Math.max(0, parseInt(document.getElementById('tariff-pct')?.value || '50')));
            if (!sector) { alert('Please select a sector.'); return; }
            articleData = { sector, direction, reduction_pct: pct, author_nation_id: currentNation.id };
            break;
        }
        case 'supply_commitment': {
            const sector = document.getElementById('supply-sector')?.value;
            const direction = document.querySelector('input[name="supply-dir"]:checked')?.value || 'we_buy';
            const pct = Math.min(90, Math.max(10, parseInt(document.getElementById('supply-pct')?.value || '60')));
            if (!sector) { alert('Please select a resource.'); return; }
            articleData = { sector, direction, commitment_pct: pct, author_nation_id: currentNation.id };
            break;
        }
        case 'price_terms': {
            const priceType = document.querySelector('input[name="price-type"]:checked')?.value || 'market';
            const modifier = Math.min(25, Math.max(0, parseInt(document.getElementById('price-modifier')?.value || '10')));
            articleData = { price_type: priceType, modifier_pct: (priceType === 'discounted' || priceType === 'premium') ? modifier : 0 };
            break;
        }
        case 'breach_penalty': {
            articleData = {
                relations_penalty: Math.min(8, Math.max(1, parseInt(document.getElementById('breach-relations')?.value || '5'))),
                reputation_penalty: Math.min(4, Math.max(0, parseInt(document.getElementById('breach-reputation')?.value || '2'))),
                financial_penalty: Math.min(500, Math.max(0, parseInt(document.getElementById('breach-financial')?.value || '200')))
            };
            break;
        }
        case 'subsidized_sector': {
            const sector = document.getElementById('subsidy-sector')?.value;
            const pct = Math.min(30, Math.max(5, parseInt(document.getElementById('subsidy-pct')?.value || '15')));
            if (!sector) { alert('Please select a sector.'); return; }
            articleData = { sector, subsidy_pct: pct, author_nation_id: currentNation.id };
            break;
        }
        case 'funding_source': {
            const source = document.querySelector('input[name="fund-source"]:checked')?.value || 'general_treasury';
            articleData = { source };
            break;
        }
        case 'text_article': {
            const title = document.getElementById('text-art-title')?.value?.trim() || '';
            const body = document.getElementById('text-art-body')?.value?.trim() || '';
            if (!body) { alert('Please enter article body text.'); return; }
            articleData = { title, body };
            break;
        }
        case 'aid_terms': {
            const amount = Number(document.getElementById('aid-amount')?.value || 0);
            const gdpCap = Math.min(25, Math.max(1, parseInt(document.getElementById('aid-gdp-cap')?.value || '10')));
            if (amount < DIPLOMACY_CONFIG.AID_MIN_AMOUNT) {
                alert('Minimum aid amount is $' + (DIPLOMACY_CONFIG.AID_MIN_AMOUNT / 1e9).toFixed(0) + 'B.');
                return;
            }
            articleData = { donor_nation_id: currentNation.id, annual_amount: amount, gdp_cap_pct: gdpCap };
            break;
        }
        case 'aid_condition': {
            const statKey = document.getElementById('cond-stat')?.value;
            const operator = document.querySelector('input[name="cond-op"]:checked')?.value || 'gte';
            const threshold = Math.min(100, Math.max(0, parseInt(document.getElementById('cond-threshold')?.value || '50')));
            const onFailure = document.querySelector('input[name="cond-fail"]:checked')?.value || 'suspend';
            const grace = Math.min(2, Math.max(0, parseInt(document.getElementById('cond-grace')?.value || '1')));
            if (!statKey) { alert('Please select a stat to monitor.'); return; }
            // Check max conditions
            const existingConditions = counterTradeArticles.filter(a => a.type === 'aid_condition');
            if (existingConditions.length >= DIPLOMACY_CONFIG.AID_MAX_CONDITIONS) {
                alert('Maximum ' + DIPLOMACY_CONFIG.AID_MAX_CONDITIONS + ' conditions per agreement.');
                return;
            }
            articleData = { stat_key: statKey, operator, threshold, on_failure: onFailure, grace_periods: grace };
            break;
        }
        case 'tariff_surcharge': {
            const sector = document.getElementById('surcharge-sector')?.value;
            const pct = Math.min(50, Math.max(5, parseInt(document.getElementById('surcharge-pct')?.value || '25')));
            if (!sector) { alert('Please select a sector.'); return; }
            articleData = { sector, surcharge_pct: pct, imposer_nation_id: currentNation.id };
            break;
        }
    }

    // Check non-repeatable constraint
    const artDef = TRADE_ARTICLE_TYPES[articleType];
    if (artDef && !artDef.repeatable) {
        if (counterTradeArticles.some(a => a.type === articleType)) {
            alert('This article type can only be added once.');
            return;
        }
    }

    const article = { type: articleType, data: articleData };
    counterTradeArticles.push(article);

    // Update the added articles list display
    renderCounterAddedList(proposalId);

    // Clear editor
    const editor = document.getElementById('counter-article-editor-' + proposalId);
    if (editor) editor.innerHTML = '';
}

function removeCounterTradeArticle(index, proposalId) {
    counterTradeArticles.splice(index, 1);
    renderCounterAddedList(proposalId);
}

function renderCounterAddedList(proposalId) {
    const list = document.getElementById('counter-added-list-' + proposalId);
    if (!list) return;
    if (counterTradeArticles.length === 0) { list.innerHTML = ''; return; }

    let html = '<div style="font-size:10px;color:var(--green);margin:8px 0 4px;">Your additions:</div>';
    counterTradeArticles.forEach((art, i) => {
        const artLabel = renderTradeArticleSummary(art);
        const artTypeName = TRADE_ARTICLE_TYPES[art.type]?.label || art.type;
        html += `
            <div class="article-card article-card--added" style="display:flex;align-items:flex-start;justify-content:space-between;">
                <div>
                    <div class="article-card-type">Added ${toRoman(i + 1)} — ${escapeHtml(artTypeName)}</div>
                    <div class="article-card-title">${artLabel}</div>
                </div>
                <button style="background:none;border:none;color:var(--red);cursor:pointer;font-size:14px;" onclick="removeCounterTradeArticle(${i}, '${proposalId}')">&#10005;</button>
            </div>
        `;
    });
    list.innerHTML = html;
}

async function strikeTradeArticles(proposalId) {
    const checkboxes = document.querySelectorAll('.strike-checkbox[data-proposal-id="' + proposalId + '"]:checked');
    const struckIndices = [];
    checkboxes.forEach(cb => struckIndices.push(parseInt(cb.dataset.articleIndex)));

    if (struckIndices.length === 0 && counterTradeArticles.length === 0) {
        alert('Strike at least one article or add new articles to counter.');
        return;
    }

    // Fetch proposal
    const { data: proposal } = await _supabase
        .from('diplomatic_proposals')
        .select('*')
        .eq('id', proposalId)
        .single();

    if (!proposal) { alert('Could not load proposal.'); return; }

    // Authorization: caller must be an authorized diplomat and it must be their turn
    await refreshRoles();
    const pd0 = proposal.proposal_data || {};
    const isProposer = proposal.proposing_nation_id === currentNation.id;
    const isTarget = proposal.target_nation_id === currentNation.id;
    // Use revised_by_nation_id to determine whose turn it is
    const revisedByUs = pd0.revised_by_nation_id === currentNation.id;
    const isOurTurn = (proposal.status === 'proposed' && isTarget) ||
        (proposal.status === 'revised' && !revisedByUs && (isProposer || isTarget));
    // Allow ambassadors, FM, HoG, or MoT to counter
    const otherNationId = isProposer ? proposal.target_nation_id : proposal.proposing_nation_id;
    const isAmbToOther = diplomaticRoles.ambassadorTo.some(a => a.target_nation_id === otherNationId);
    if (!isOurTurn || (!isAmbToOther && !diplomaticRoles.isFM && !diplomaticRoles.isHoG && !diplomaticRoles.isMoT)) {
        alert('You are not authorized to counter this proposal.');
        return;
    }

    const pd = proposal.proposal_data || {};
    const totalArticles = (pd.articles || []).length;
    const existingStruck = pd.struck_articles || [];
    const allStruck = [...new Set([...existingStruck, ...struckIndices])];

    // Can't strike all articles unless adding new ones
    if (allStruck.length >= totalArticles && counterTradeArticles.length === 0) {
        alert('Cannot strike all articles without adding alternatives. Use Reject instead.');
        return;
    }

    const strikeSummary = struckIndices.length > 0 ? struckIndices.length + ' article(s) struck' : '';
    const addSummary = counterTradeArticles.length > 0 ? counterTradeArticles.length + ' article(s) added' : '';
    const summary = [strikeSummary, addSummary].filter(Boolean).join(', ');
    if (!confirm('Send counter-proposal? ' + summary)) return;

    pd.struck_articles = allStruck;
    pd.revised_by_nation_id = currentNation.id;

    // Merge counter articles into added_articles
    const existingAdded = pd.added_articles || [];
    pd.added_articles = [...existingAdded, ...counterTradeArticles];

    const { error } = await _supabase
        .from('diplomatic_proposals')
        .update({ status: 'revised', proposal_data: pd })
        .eq('id', proposalId);

    if (error) { alert('Error sending counter: ' + error.message); return; }

    counterTradeArticles = [];
    alert('Counter-proposal sent. ' + summary + '.');
    if (selectedTargetNation) await renderNationCardBody(selectedTargetNation.id);
}

// ==================== STATE VISIT ====================

async function initiateStateVisit(targetNationId) {
    if (!currentNation || !currentFaction) { alert('No nation/faction loaded.'); return; }
    if (!diplomaticRoles.isHoG) { alert('Only the Head of Government can initiate a State Visit.'); return; }

    // Fetch target nation
    const { data: targetNation } = await _supabase.from('nations').select('*').eq('id', targetNationId).single();
    if (!targetNation) { alert('Target nation not found.'); return; }

    // Get current tick
    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const currentTick = shard?.current_tick || 0;

    // Check cooldown — target nation cannot be visited if cooldown active
    const { data: recentVisit } = await _supabase
        .from('diplomatic_action_log')
        .select('id, cooldown_until_tick')
        .eq('target_nation_id', targetNationId)
        .eq('action_type', 'state_visit')
        .gt('cooldown_until_tick', currentTick)
        .order('cooldown_until_tick', { ascending: false })
        .limit(1)
        .maybeSingle();

    if (recentVisit) {
        const ticksLeft = recentVisit.cooldown_until_tick - currentTick;
        alert(targetNation.name + ' was recently visited. Cooldown: ' + ticksLeft + ' tick(s) remaining.');
        return;
    }

    // Check if there's already a pending state visit proposal from us to this nation
    const { data: pendingVisit } = await _supabase
        .from('diplomatic_proposals')
        .select('id')
        .eq('proposing_nation_id', currentNation.id)
        .eq('target_nation_id', targetNationId)
        .eq('proposal_type', 'state_visit')
        .eq('status', 'proposed')
        .maybeSingle();

    if (pendingVisit) {
        alert('A State Visit invitation to ' + targetNation.name + ' is already pending.');
        return;
    }

    // Gather preview data
    const relation = await fetchDiplomaticRelation(currentNation.id, targetNationId);
    const relScore = relation?.relation_score ?? 30;

    // Check for active trade agreement between the two nations
    const natA = currentNation.id < targetNationId ? currentNation.id : targetNationId;
    const natB = currentNation.id < targetNationId ? targetNationId : currentNation.id;
    const { data: tradeAgs } = await _supabase
        .from('trade_agreements')
        .select('id')
        .eq('status', 'active')
        .eq('nation_a_id', natA)
        .eq('nation_b_id', natB)
        .limit(1);
    const hasTradeAgreement = tradeAgs && tradeAgs.length > 0;

    // Check if first-ever visit
    const { data: pastVisits } = await _supabase
        .from('diplomatic_action_log')
        .select('id')
        .eq('nation_id', currentNation.id)
        .eq('target_nation_id', targetNationId)
        .eq('action_type', 'state_visit')
        .limit(1);
    const isFirstVisit = !pastVisits || pastVisits.length === 0;

    const highRelations = relScore > 70;

    // Check autocracy
    const isTargetAutocracy = isGovernmentAutocracy(targetNation);

    // Build preview
    const hosName = ((currentNation.head_of_state_first_name || '') + ' ' + (currentNation.head_of_state_last_name || '')).trim() || 'Head of State';

    let previewLines = [
        'STATE VISIT PREVIEW',
        '═══════════════════════════════',
        hosName + ' visits ' + targetNation.name,
        '',
        'Cost: ' + DIPLOMACY_CONFIG.STATE_VISIT_AP + ' AP (deducted now)',
        'Accept Window: ' + DIPLOMACY_CONFIG.STATE_VISIT_ACCEPT_WINDOW + ' ticks for ' + targetNation.name + ' to accept',
        '',
        '── BASE BENEFITS (on acceptance) ──',
        '+' + DIPLOMACY_CONFIG.STATE_VISIT_REP_BOOST + ' International Reputation (both nations)',
        '+' + DIPLOMACY_CONFIG.STATE_VISIT_STABILITY_BOOST + ' Stability (both nations)',
        '+' + DIPLOMACY_CONFIG.STATE_VISIT_RELATION_BOOST + ' Relations',
        '',
        '── CONDITIONAL BONUSES ──',
    ];

    if (hasTradeAgreement) {
        previewLines.push('[ACTIVE] Trade Agreement: +' + DIPLOMACY_CONFIG.STATE_VISIT_TRADE_BONUS + ' Trade Balance (both)');
    } else {
        previewLines.push('[  --  ] Trade Agreement: +' + DIPLOMACY_CONFIG.STATE_VISIT_TRADE_BONUS + ' Trade Balance (requires active agreement)');
    }

    if (highRelations) {
        previewLines.push('[ACTIVE] High Relations (>' + 70 + '): +' + DIPLOMACY_CONFIG.STATE_VISIT_HIGH_REL_GDP_BONUS + ' GDP Growth (both)');
    } else {
        previewLines.push('[  --  ] High Relations (>' + 70 + '): +' + DIPLOMACY_CONFIG.STATE_VISIT_HIGH_REL_GDP_BONUS + ' GDP Growth (current: ' + relScore + ')');
    }

    if (isFirstVisit) {
        previewLines.push('[ACTIVE] First Visit Ever: +' + DIPLOMACY_CONFIG.STATE_VISIT_FIRST_STABILITY + ' Stability (both) + Hero Story');
    } else {
        previewLines.push('[  --  ] First Visit Ever: already visited');
    }

    if (isTargetAutocracy) {
        previewLines.push('');
        previewLines.push('WARNING: ' + targetNation.name + ' is an Autocracy.');
        previewLines.push('Domestic approval dice roll (1D12): 1-6 = -3 gov approval, 7-12 = +3 gov approval');
    }

    previewLines.push('');
    previewLines.push('If declined or expired: nothing happens, AP still spent.');

    if (!confirm(previewLines.join('\n'))) return;

    // Deduct AP
    const apResult = await deductAP(_supabase, currentFaction.id, DIPLOMACY_CONFIG.STATE_VISIT_AP, currentFaction.action_points);
    if (!apResult.success) {
        alert('Not enough AP. Need ' + DIPLOMACY_CONFIG.STATE_VISIT_AP + ', have ' + (currentFaction.action_points || 0) + '.');
        return;
    }
    currentFaction.action_points = apResult.newAp;

    // Create diplomatic_proposals entry for target nation's inbox
    const { error: proposalErr } = await _supabase
        .from('diplomatic_proposals')
        .insert({
            proposing_nation_id: currentNation.id,
            target_nation_id: targetNationId,
            proposed_by_faction_id: currentFaction.id,
            proposal_type: 'state_visit',
            proposal_tier: 2,
            status: 'proposed',
            proposal_data: {
                name: 'State Visit from ' + currentNation.name,
                visitor_pm: hosName,
                visitor_nation: currentNation.name,
                host_nation: targetNation.name,
                proposer_nation_name: currentNation.name,
                target_nation_name: targetNation.name,
                is_first: isFirstVisit,
                has_trade_agreement: hasTradeAgreement,
                high_relations: highRelations,
                is_target_autocracy: isTargetAutocracy,
                accept_deadline_tick: currentTick + DIPLOMACY_CONFIG.STATE_VISIT_ACCEPT_WINDOW,
                relation_score: relScore
            },
            fm_review_expires_tick: currentTick + DIPLOMACY_CONFIG.STATE_VISIT_ACCEPT_WINDOW,
            proposed_at_tick: currentTick
        });

    if (proposalErr) {
        alert('Error proposing State Visit: ' + proposalErr.message);
        return;
    }

    alert('State Visit invitation sent to ' + targetNation.name + '!\n\nThey have ' + DIPLOMACY_CONFIG.STATE_VISIT_ACCEPT_WINDOW + ' ticks to accept.');

    // Refresh the nation card and inbox
    if (selectedTargetNation) await renderNationCardBody(selectedTargetNation.id);
    { const _apEl = document.getElementById('diplo-ap'); if (_apEl) _apEl.textContent = (currentFaction?.action_points ?? 0) + ' AP'; };
}

async function acceptStateVisit(proposalId) {
    // Fetch proposal
    const { data: proposal, error: fetchErr } = await _supabase
        .from('diplomatic_proposals')
        .select('*')
        .eq('id', proposalId)
        .single();

    if (fetchErr || !proposal) { alert('Could not load proposal.'); return; }
    if (proposal.proposal_type !== 'state_visit') { alert('Not a state visit proposal.'); return; }

    // Authorization: caller must be target nation's HoG
    await refreshRoles();
    if (!diplomaticRoles.isHoG || proposal.target_nation_id !== currentNation.id) {
        alert('Only the Head of Government of the visited nation can accept a State Visit.');
        return;
    }

    // Check if accept window expired
    const { data: shard } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const currentTick = shard?.current_tick || 0;
    const pd = proposal.proposal_data || {};

    if (pd.accept_deadline_tick && currentTick > pd.accept_deadline_tick) {
        alert('This State Visit invitation has expired.');
        await _supabase.from('diplomatic_proposals').update({ status: 'expired' }).eq('id', proposalId);
        await renderNegotiationsBox();
        return;
    }

    if (!confirm('Accept State Visit from ' + (pd.visitor_nation || 'Unknown') + '?\n\nBoth nations will receive diplomatic benefits.')) return;

    // Fetch both nations for stat updates
    const visitorNationId = proposal.proposing_nation_id;
    const hostNationId = proposal.target_nation_id;

    const [visitorRes, hostRes] = await Promise.all([
        _supabase.from('nations').select('*').eq('id', visitorNationId).single(),
        _supabase.from('nations').select('*').eq('id', hostNationId).single()
    ]);
    const visitorNation = visitorRes.data;
    const hostNation = hostRes.data;
    if (!visitorNation || !hostNation) { alert('Could not load nation data.'); return; }

    // Re-check conditional bonuses at acceptance time
    const natA = visitorNationId < hostNationId ? visitorNationId : hostNationId;
    const natB = visitorNationId < hostNationId ? hostNationId : visitorNationId;

    const [relRes, tradeRes, pastRes] = await Promise.all([
        _supabase.from('diplomatic_relations').select('relation_score').eq('nation_a_id', natA).eq('nation_b_id', natB).maybeSingle(),
        _supabase.from('trade_agreements').select('id').eq('status', 'active').eq('nation_a_id', natA).eq('nation_b_id', natB).limit(1),
        _supabase.from('diplomatic_action_log').select('id').eq('nation_id', visitorNationId).eq('target_nation_id', hostNationId).eq('action_type', 'state_visit').limit(1)
    ]);

    const relScore = relRes.data?.relation_score ?? 30;
    const hasTradeAgreement = tradeRes.data && tradeRes.data.length > 0;
    const isFirstVisit = !pastRes.data || pastRes.data.length === 0;
    const highRelations = relScore > 70;
    const isTargetAutocracy = isGovernmentAutocracy(hostNation);
    const isVisitorAutocracy = isGovernmentAutocracy(visitorNation);

    // ── Apply base benefits ──
    const repBoost = DIPLOMACY_CONFIG.STATE_VISIT_REP_BOOST;
    const stabBoost = DIPLOMACY_CONFIG.STATE_VISIT_STABILITY_BOOST;
    const relBoost = DIPLOMACY_CONFIG.STATE_VISIT_RELATION_BOOST;

    // Build stat updates for both nations
    const visitorUpdates = {
        international_reputation: Math.min(100, (visitorNation.international_reputation || 0) + repBoost),
        stability: Math.min(100, Math.round(Number(visitorNation.stability || 0) + stabBoost))
    };
    const hostUpdates = {
        international_reputation: Math.min(100, (hostNation.international_reputation || 0) + repBoost),
        stability: Math.min(100, Math.round(Number(hostNation.stability || 0) + stabBoost))
    };

    // ── Conditional bonuses ──
    let bonusSummary = [];

    // Trade agreement bonus
    if (hasTradeAgreement) {
        const tradeBonus = DIPLOMACY_CONFIG.STATE_VISIT_TRADE_BONUS;
        visitorUpdates.trade_balance = Math.min(100, (visitorNation.trade_balance || 0) + tradeBonus);
        hostUpdates.trade_balance = Math.min(100, (hostNation.trade_balance || 0) + tradeBonus);
        bonusSummary.push('+' + tradeBonus + ' Trade Balance (trade agreement)');
    }

    // High relations bonus
    if (highRelations) {
        const gdpBonus = DIPLOMACY_CONFIG.STATE_VISIT_HIGH_REL_GDP_BONUS;
        visitorUpdates.gdp_growth = Math.min(100, (visitorNation.gdp_growth || 0) + gdpBonus);
        hostUpdates.gdp_growth = Math.min(100, (hostNation.gdp_growth || 0) + gdpBonus);
        bonusSummary.push('+' + gdpBonus + ' GDP Growth (high relations)');
    }

    // First visit bonus
    if (isFirstVisit) {
        const firstStab = DIPLOMACY_CONFIG.STATE_VISIT_FIRST_STABILITY;
        visitorUpdates.stability = Math.min(100, visitorUpdates.stability + firstStab);
        hostUpdates.stability = Math.min(100, hostUpdates.stability + firstStab);
        bonusSummary.push('+' + firstStab + ' Stability (first visit)');
    }

    // Autocracy approval dice roll — applies to the visiting PM's nation if target is autocracy
    let autocracyResult = null;
    if (isTargetAutocracy) {
        const roll = Math.floor(Math.random() * 12) + 1; // 1D12
        const approvalChange = roll <= 6 ? -3 : 3;
        visitorUpdates.gov_approval = Math.max(0, Math.min(100, Math.round(Number(visitorNation.gov_approval ?? 50) + approvalChange)));
        autocracyResult = { roll, change: approvalChange };
        bonusSummary.push('Autocracy dice: rolled ' + roll + ' → ' + (approvalChange > 0 ? '+' : '') + approvalChange + ' Gov Approval (visitor)');
    }
    if (isVisitorAutocracy) {
        const roll = Math.floor(Math.random() * 12) + 1;
        const approvalChange = roll <= 6 ? -3 : 3;
        hostUpdates.gov_approval = Math.max(0, Math.min(100, Math.round(Number(hostNation.gov_approval ?? 50) + approvalChange)));
        if (!autocracyResult) autocracyResult = {};
        autocracyResult.host_roll = roll;
        autocracyResult.host_change = approvalChange;
        bonusSummary.push('Autocracy dice (host): rolled ' + roll + ' → ' + (approvalChange > 0 ? '+' : '') + approvalChange + ' Gov Approval (host)');
    }

    // ── Apply all updates ──
    await Promise.all([
        _supabase.from('nations').update(visitorUpdates).eq('id', visitorNationId),
        _supabase.from('nations').update(hostUpdates).eq('id', hostNationId)
    ]);

    // Update relations
    const newRelScore = Math.min(100, relScore + relBoost);
    if (relRes.data) {
        await _supabase.from('diplomatic_relations').update({ relation_score: newRelScore }).eq('nation_a_id', natA).eq('nation_b_id', natB);
    } else {
        await _supabase.from('diplomatic_relations').insert({ nation_a_id: natA, nation_b_id: natB, relation_score: newRelScore });
    }

    // Mark proposal as active
    await _supabase.from('diplomatic_proposals').update({
        status: 'active',
        activated_at_tick: currentTick
    }).eq('id', proposalId);

    // Write to diplomatic_action_log for cooldown tracking
    await _supabase.from('diplomatic_action_log').insert({
        nation_id: visitorNationId,
        target_nation_id: hostNationId,
        faction_id: proposal.proposed_by_faction_id,
        action_type: 'state_visit',
        action_data: {
            visitor_pm: pd.visitor_pm,
            visitor_nation: pd.visitor_nation,
            host_nation: pd.host_nation,
            is_first: isFirstVisit,
            has_trade_agreement: hasTradeAgreement,
            high_relations: highRelations,
            relation_boost: relBoost,
            rep_boost: repBoost,
            stability_boost: stabBoost,
            autocracy_result: autocracyResult,
            bonuses: bonusSummary
        },
        ap_cost: DIPLOMACY_CONFIG.STATE_VISIT_AP,
        applied_at_tick: currentTick,
        cooldown_until_tick: currentTick + DIPLOMACY_CONFIG.STATE_VISIT_COOLDOWN,
        processed: true
    });

    // Fire event for all nations
    try {
        const { data: allNations } = await _supabase.from('nations').select('id');
        if (allNations && allNations.length > 0) {
            const eventRows = allNations.map(n => ({
                nation_id: n.id,
                event_name: 'State Visit',
                event_type: 'state_visit',
                category: 'Diplomatic',
                description_chosen: pd.visitor_pm + ' of ' + pd.visitor_nation + ' conducted a State Visit to ' + pd.host_nation + '.' +
                    (isFirstVisit ? ' This historic first visit marks a new chapter in bilateral relations.' : '') +
                    (hasTradeAgreement ? ' Trade discussions featured prominently.' : '') +
                    (highRelations ? ' The warm reception reflected strong bilateral ties.' : ''),
                fired_at_tick: currentTick,
                effects: {
                    visitor_pm: pd.visitor_pm,
                    visitor_nation: pd.visitor_nation,
                    host_nation: pd.host_nation,
                    is_first: isFirstVisit
                }
            }));
            await _supabase.from('event_log').insert(eventRows);
        }
    } catch (e) {
        console.warn('Error firing state visit event:', e);
    }

    // Build result message
    let resultMsg = 'State Visit Accepted!\n\n' +
        pd.visitor_pm + ' visited ' + pd.host_nation + '\n\n' +
        'Base Effects:\n' +
        '  +' + repBoost + ' International Reputation (both)\n' +
        '  +' + stabBoost + ' Stability (both)\n' +
        '  +' + relBoost + ' Relations (' + relScore + ' → ' + newRelScore + ')\n';

    if (bonusSummary.length > 0) {
        resultMsg += '\nBonuses:\n  ' + bonusSummary.join('\n  ') + '\n';
    }

    resultMsg += '\n' + pd.host_nation + ' is now on a ' + DIPLOMACY_CONFIG.STATE_VISIT_COOLDOWN + '-tick visit cooldown.';

    alert(resultMsg);

    // Refresh
    await renderNegotiationsBox();
    { const _apEl = document.getElementById('diplo-ap'); if (_apEl) _apEl.textContent = (currentFaction?.action_points ?? 0) + ' AP'; };
    if (selectedTargetNation) await renderNationCardBody(selectedTargetNation.id);
}

async function declineStateVisit(proposalId) {
    // Validate proposal is still actionable
    const { data: proposal } = await _supabase.from('diplomatic_proposals')
        .select('status').eq('id', proposalId).single();
    if (!proposal || proposal.status !== 'proposed') {
        alert('This invitation is no longer actionable (status: ' + (proposal?.status || 'unknown') + ').');
        await renderNegotiationsBox();
        return;
    }

    if (!confirm('Decline this State Visit invitation? The visiting nation will not be refunded their AP.')) return;

    await _supabase.from('diplomatic_proposals').update({ status: 'rejected' }).eq('id', proposalId);

    alert('State Visit declined.');
    await renderNegotiationsBox();
    { const _apEl = document.getElementById('diplo-ap'); if (_apEl) _apEl.textContent = (currentFaction?.action_points ?? 0) + ' AP'; };
    if (selectedTargetNation) await renderNationCardBody(selectedTargetNation.id);
}

// ── Helper: map tier to pill class ──
function tierToPillClass(tier) {
    const label = tier.label.toLowerCase();
    if (label === 'allied') return 'pill--allied';
    if (label === 'friendly') return 'pill--friendly';
    if (label === 'hostile' || label === 'adversarial') return 'pill--hostile';
    if (label === 'ceasefire') return 'pill--war';
    return 'pill--neutral'; // Warm, Neutral, Cold
}

// ── Helper: map tier to dot color ──
function tierToDotColor(tier) {
    const label = tier.label.toLowerCase();
    if (label === 'allied') return 'var(--green)';
    if (label === 'friendly') return 'var(--teal)';
    if (label === 'hostile') return 'var(--amber)';
    if (label === 'adversarial' || label === 'ceasefire') return 'var(--red)';
    return 'var(--text-dim)';
}

const NATION_MAP_COLORS = {

    'san estrella':'#ffb380',

    'palvera':     '#5599ff'
};
function getNationMapColor(name) {

async function renderRelationsBox() {
    const body = document.getElementById('relations-body');
    if (!body) return;
    body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Loading nations...</div></div>';

    if (!currentNation) {
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">No nation data available.</div></div>';
        return;
    }

    try {
        const [nationsRes, relationsRes, ambassadorsRes, theirAmbassadorsRes, agreementsRes] = await Promise.all([
            _supabase.from('nations').select('*').order('name'),
            _supabase.from('diplomatic_relations').select('*')
                .or('nation_a_id.eq.' + currentNation.id + ',nation_b_id.eq.' + currentNation.id),
            _supabase.from('ambassadors').select('*, factions(abbreviation)')
                .eq('nation_id', currentNation.id).eq('is_active', true).eq('status', 'active'),
            _supabase.from('ambassadors').select('*, factions(abbreviation)')
                .eq('target_nation_id', currentNation.id).eq('is_active', true).eq('status', 'active'),
            _supabase.from('diplomatic_proposals').select('proposing_nation_id, target_nation_id')
                .eq('status', 'active')
                .or('proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + currentNation.id)
        ]);

        if (nationsRes.error) {
            body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Error loading nations.</div></div>';
            return;
        }

        const allNations = nationsRes.data || [];
        const allRelations = relationsRes.data || [];
        const ourAmbassadors = ambassadorsRes.data || [];
        const theirAmbassadors = theirAmbassadorsRes.data || [];
        const activeAgreements = agreementsRes.data || [];

        const otherNations = allNations.filter(n => n.id !== currentNation.id);
        cachedOtherNations = otherNations.map(n => ({ id: n.id, name: n.name }));
        const countEl = document.getElementById('relations-count');
        if (countEl) countEl.textContent = otherNations.length;

        if (otherNations.length === 0) {
            body.innerHTML = '<div class="empty-state"><div class="empty-state-text">No other nations found.</div></div>';
            return;
        }

        let html = '';
        for (const nation of otherNations) {
            const relation = allRelations.find(r =>
                (r.nation_a_id === currentNation.id && r.nation_b_id === nation.id) ||
                (r.nation_a_id === nation.id && r.nation_b_id === currentNation.id)
            );
            const score = relation?.relation_score ?? 35;
            const tier = getRelationTier(score, false);

            const ambassador = ourAmbassadors.find(a => a.target_nation_id === nation.id);
            const theirAmb = theirAmbassadors.find(a => a.nation_id === nation.id);

            // Embassy status
            let embassyClass = 'embassy-tag--none';
            let embassyLabel = 'No Embassy';
            if (ambassador && theirAmb) {
                embassyClass = 'embassy-tag--open';
                embassyLabel = 'Embassy Open';
            } else if (ambassador || theirAmb) {
                embassyClass = 'embassy-tag--closed';
                embassyLabel = 'Embassy Closed';
            }

            const agreementCount = activeAgreements.filter(a =>
                (a.proposing_nation_id === currentNation.id && a.target_nation_id === nation.id) ||
                (a.proposing_nation_id === nation.id && a.target_nation_id === currentNation.id)
            ).length;

            const dotColor = tierToDotColor(tier);
            const pillClass = tierToPillClass(tier);

            html += `
                <div class="nation-row" data-nation-id="${nation.id}" onclick="toggleRelationRow('${nation.id}')">
                    <div class="nation-dot" style="background:${dotColor}"></div>
                    <span class="nation-name" ${getNationMapColor(nation.name) ? 'style="color:' + getNationMapColor(nation.name) + '"' : ''}>${escapeHtml(nation.name)}</span>
                    <div class="nation-meta">
                        <span class="pill ${pillClass}">${tier.label}</span>
                        <span class="embassy-tag ${embassyClass}">${embassyLabel}</span>
                        ${agreementCount > 0 ? '<span class="agreements-count">' + agreementCount + ' treaty' + (agreementCount > 1 ? 's' : '') + '</span>' : ''}
                        <span class="expand-arrow">&#9654;</span>
                    </div>
                </div>
                <div class="nation-detail" id="nation-detail-${nation.id}" data-loaded="0">
                    <div class="empty-state"><div class="empty-state-text">Loading...</div></div>
                </div>
            `;
        }

        body.innerHTML = html;
    } catch (err) {
        console.error('Error rendering relations box:', err);
        body.innerHTML = '<div class="empty-state"><div class="empty-state-text">Error loading nations.</div></div>';
    }
}

// ── Toggle nation row expand / collapse ──
async function toggleRelationRow(nationId) {
    const row = document.querySelector('.nation-row[data-nation-id="' + nationId + '"]');
    const detail = document.getElementById('nation-detail-' + nationId);
    if (!row || !detail) return;

    const wasExpanded = row.classList.contains('is-expanded');

    // Collapse all
    document.querySelectorAll('.nation-row.is-expanded').forEach(r => r.classList.remove('is-expanded'));

    if (wasExpanded) return; // just collapse

    // Expand this one
    row.classList.add('is-expanded');

    // Lazy-load detail content
    if (detail.dataset.loaded === '0') {
        detail.dataset.loaded = '1';
        await renderRelationDetail(nationId);
    }
}
window.toggleRelationRow = toggleRelationRow;

// ── Render nation detail panel ──
async function renderRelationDetail(nationId) {
    const detail = document.getElementById('nation-detail-' + nationId);
    if (!detail) return;

    try {
        const { data: targetNation } = await _supabase.from('nations').select('*').eq('id', nationId).single();
        if (!targetNation) { detail.innerHTML = '<div class="empty-state"><div class="empty-state-text">Nation not found.</div></div>'; return; }

        // Set module state for potential draft/initiative use
        selectedTargetNation = targetNation;

        const [relation, proposals, ambassador, theirAmbassador] = await Promise.all([
            fetchDiplomaticRelation(currentNation?.id, targetNation.id),
            fetchActiveProposals(currentNation?.id, targetNation.id),
            fetchAmbassador(currentNation?.id, targetNation.id),
            fetchAmbassador(targetNation.id, currentNation?.id)
        ]);

        const hasCeasefire = proposals.some(p => p.proposal_type === 'ceasefire');
        const score = relation?.relation_score ?? 35;
        const tier = getRelationTier(score, hasCeasefire);
        const barColor = getRelationBarColor(score);

        // Ambassador info
        const ambName = ambassador ? ((ambassador.ambassador_first_name || '') + ' ' + (ambassador.ambassador_last_name || '')).trim() : null;
        const ambParty = ambassador?.factions?.abbreviation ? ' (' + ambassador.factions.abbreviation + ')' : '';
        const theirAmbName = theirAmbassador ? ((theirAmbassador.ambassador_first_name || '') + ' ' + (theirAmbassador.ambassador_last_name || '')).trim() : null;
        const theirAmbParty = theirAmbassador?.factions?.abbreviation ? ' (' + theirAmbassador.factions.abbreviation + ')' : '';

        let html = '<div class="detail-grid">';
        html += '<div><div class="detail-label">Our Ambassador</div><div class="detail-value">' + (ambName ? escapeHtml(ambName) + escapeHtml(ambParty) : 'None') + '</div></div>';
        html += '<div><div class="detail-label">Their Ambassador</div><div class="detail-value">' + (theirAmbName ? escapeHtml(theirAmbName) + escapeHtml(theirAmbParty) : 'None') + '</div></div>';
        html += '<div><div class="detail-label">Population</div><div class="detail-value">' + formatNumber(targetNation.population) + '</div></div>';
        html += '<div><div class="detail-label">Stability</div><div class="detail-value">' + (targetNation.stability ?? '—') + '%</div></div>';
        html += '</div>';

        // Relation bar
        const barWidth = Math.max(0, Math.min(100, score));
        html += `
            <div class="relation-bar-label"><span>${tier.label}</span><span>${score}/100</span></div>
            <div class="relation-bar-track">
                <div class="relation-bar-center"></div>
                <div class="relation-bar-fill" style="width:${barWidth}%;background:${barColor};left:0;"></div>
            </div>
        `;

        // Active treaties
        if (proposals.length > 0) {
            html += '<div style="margin-top:6px;">';
            for (const p of proposals) {
                const pd = p.proposal_data || {};
                const name = pd.name || p.proposal_type;
                html += '<div class="treaty-item"><div class="treaty-dot"></div>' + escapeHtml(name) + '</div>';
            }
            html += '</div>';
        }

        // Action buttons
        html += '<div class="detail-actions">';
        html += '<button class="detail-btn" onclick="selectDraftTarget(\'' + nationId + '\')">Draft Initiative</button>';
        html += '<a class="detail-btn" href="' + nationInfoUrl(targetNation.name) + '">Nation Info</a>';
        html += '</div>';

        detail.innerHTML = html;
    } catch (err) {
        console.error('Error rendering relation detail:', err);
        detail.innerHTML = '<div class="empty-state"><div class="empty-state-text">Error loading details.</div></div>';
    }
}

// DIPLOMATIC ACTIONS BOX
// ══════════════════════════════════════════════════════
function renderActionsBox() {
    const body = document.getElementById('actions-body');
    if (!body) return;

    const hasHoG = diplomaticRoles && diplomaticRoles.isHoG;
    const hasFM = diplomaticRoles && diplomaticRoles.isFM;
    const hasMoT = diplomaticRoles && diplomaticRoles.isMoT;
    const hasAmb = diplomaticRoles && diplomaticRoles.ambassadorTo && diplomaticRoles.ambassadorTo.length > 0;

    let html = '';

    // Helper: render a single action item (enabled or disabled)
    function actionHtml(a, enabled, role) {
        const isDisabled = !enabled || a.comingSoon;
        const disabledClass = isDisabled ? ' action-disabled' : '';
        const onclick = !isDisabled ? `onclick="selectDraftAction('${a.key}','${escapeHtml(a.label)}',${a.ap},'${a.type}','${role}')"` : '';
        const costLabel = a.ap > 0 ? a.ap + ' AP' : 'Free';
        return `<div class="action-item${disabledClass}" data-action="${a.key}" ${onclick}>
                <span class="action-name">${a.label}</span>
                <span class="action-cost">${costLabel}</span>
            </div>`;
    }

    // Head of Government
    html += '<div class="role-header' + (hasHoG ? '' : ' role-disabled') + '">Head of Government</div>';
    [
        { key: 'declare_war', label: 'Declare War', ap: 8, type: 'hog', comingSoon: true },
        { key: 'call_ceasefire', label: 'Call for Ceasefire', ap: 4, type: 'hog', comingSoon: true },
        { key: 'sign_alliance', label: 'Sign Alliance', ap: 6, type: 'hog', comingSoon: true },
        { key: 'state_visit', label: 'State Visit', ap: DIPLOMACY_CONFIG.STATE_VISIT_AP || 4, type: 'hog', comingSoon: true }
    ].forEach(a => { html += actionHtml(a, hasHoG, 'hog'); });

    // Foreign Minister
    html += '<div class="role-header' + (hasFM ? '' : ' role-disabled') + '">Foreign Minister</div>';
    [
        { key: 'appoint_ambassador', label: 'Appoint Ambassador', ap: 1, type: 'fm' },
        { key: 'recall_ambassador', label: 'Recall Ambassador', ap: 1, type: 'fm' },
        { key: 'major_initiative', label: 'Major Diplomatic Initiative', ap: 2, type: 'fm', comingSoon: true },
        { key: 'formal_protest', label: 'Formal Protest', ap: 2, type: 'fm', comingSoon: true },
        { key: 'covert_ops', label: 'Covert Operations', ap: 4, type: 'fm', comingSoon: true },
        { key: 'foreign_aid', label: 'Foreign Aid Proposal', ap: 4, type: 'fm', comingSoon: true }
    ].forEach(a => { html += actionHtml(a, hasFM, 'fm'); });

    // Minister of Trade
    html += '<div class="role-header' + (hasMoT ? '' : ' role-disabled') + '">Minister of Trade</div>';
    [
        { key: 'trade_agreement', label: 'Trade Agreement', ap: 2, type: 'mot' }
    ].forEach(a => { html += actionHtml(a, hasMoT, 'mot'); });
    // Unilateral actions under MoT
    html += '<div style="padding:2px 14px 4px;"><span style="font-family:var(--font-mono);font-size:7.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-faint);">Unilateral</span></div>';
    [
        { key: 'retaliatory_tariff_draft', label: 'Retaliatory Tariff', ap: 2, type: 'mot' },
        { key: 'export_subsidy_draft', label: 'Export Subsidy', ap: 2, type: 'mot' }
    ].forEach(a => { html += actionHtml(a, hasMoT, 'mot'); });

    // Ambassador
    html += '<div class="role-header' + (hasAmb ? '' : ' role-disabled') + '">Ambassador</div>';
    [
        { key: 'minor_initiative', label: 'Minor Diplomatic Initiative', ap: 2, type: 'amb' },
        { key: 'state_visit_amb', label: 'State Visit', ap: DIPLOMACY_CONFIG.STATE_VISIT_AP || 4, type: 'amb' },
        { key: 'send_message', label: 'Send Message', ap: 0, type: 'amb' }
    ].forEach(a => { html += actionHtml(a, hasAmb, 'amb'); });

    body.innerHTML = html;
}
