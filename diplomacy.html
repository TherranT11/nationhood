// ==================== STEP 3B: PROPOSE TRADE NEGOTIATIONS ====================
let wizardTradeAgreementType = null;  // selected trade agreement type key

async function renderWizardStep3TradeProposal() {
    const panel = document.getElementById('wizard-panel-3');
    if (!panel) return;

    panel.innerHTML = '<p style="color:#666;font-style:italic;font-size:0.82rem;">Loading...</p>';

    const { data: targetNation } = await _supabase.from('nations').select('id, name').eq('id', wizardTargetNation).single();
    const targetName = targetNation?.name || 'Unknown';

    // Check for existing pending trade proposals with this nation
    const { data: existingProposals } = await _supabase
        .from('diplomatic_proposals')
        .select('id, status, proposal_data')
        .eq('proposal_type', 'trade_agreement')
        .in('status', ['proposed', 'revised', 'fm_review', 'ratification'])
        .or('proposing_nation_id.eq.' + currentNation.id + ',target_nation_id.eq.' + currentNation.id);

    const existingWithTarget = (existingProposals || []).filter(p => {
        const pd = p.proposal_data || {};
        return pd.target_nation_id === wizardTargetNation || pd.proposer_nation_id === wizardTargetNation;
    });

    if (existingWithTarget.length > 0) {
        panel.innerHTML = `
            <div class="trade-info-box warning">
                You already have a pending trade proposal with ${escapeHtml(targetName)}. Check the Negotiations panel.
            </div>
            <div class="wizard-nav" style="margin-top:12px;">
                <button class="wizard-back-btn" onclick="wizardBackToStep2()">Back</button>
            </div>
        `;
        return;
    }

    const ourAmb = diplomaticRoles.ambassadorTo.find(a => a.target_nation_id === wizardTargetNation);
    const isHoGOnly = diplomaticRoles.isHoG && !ourAmb && !diplomaticRoles.isMoT && !diplomaticRoles.isFM;
    const baseApCost = isHoGOnly ? DIPLOMACY_CONFIG.HOG_DRAFT_INITIATIVE_AP : DIPLOMACY_CONFIG.PROPOSE_TRADE_NEGOTIATION_AP;
    const apCost = baseApCost + getArticleEscalationCost(tradeArticles.length);

    // If no agreement type selected yet, show type selection
    if (!wizardTradeAgreementType) {
        let html = `
            <div class="trade-article-builder">
                <div class="trade-article-header">
                    <span class="trade-article-title">Propose Trade Agreement with ${escapeHtml(targetName)}</span>
                </div>
                <p style="font-size:0.78rem;color:var(--text-muted);line-height:1.5;margin-bottom:14px;">
                    Choose the type of trade agreement to propose. You will draft the articles before sending.
                </p>
                ${isHoGOnly ? '<div class="trade-info-box warning" style="margin-bottom:12px;">No Trade Minister, Foreign Minister, or ambassador appointed. Drafting as Head of Government costs ' + apCost + ' AP.</div>' : ''}
                <div class="type-card-grid">`;

        // Show bilateral trade agreement types (unilateral types have their own wizard path)
        const ourCredit = Number(currentNation.credit ?? 50);
        for (const [key, typeInfo] of Object.entries(TRADE_AGREEMENT_TYPES)) {
            if (!typeInfo.bilateral) continue;
            const isAidDonor = key === 'economic_aid'; // assume proposer is donor
            const creditCheck = checkCreditForTradeAgreement(ourCredit, key, isAidDonor);
            if (!creditCheck.allowed) {
                html += `
                <div class="type-card" style="opacity:0.45;cursor:not-allowed;position:relative;" title="${escapeHtml(creditCheck.reason)}">
                    <div class="type-card-short">${escapeHtml(typeInfo.shortLabel)}</div>
                    <div class="type-card-title">${escapeHtml(typeInfo.label)}</div>
                    <div class="type-card-effects"><span class="trade-type-tag bilateral">BILATERAL</span></div>
                    <div style="font-size:0.7rem;color:var(--red);margin-top:4px;">Credit ${Math.round(ourCredit)}/${Math.round(creditCheck.required)} required</div>
                </div>`;
            } else {
                html += `
                <div class="type-card" onclick="selectTradeAgreementType('${key}')">
                    <div class="type-card-short">${escapeHtml(typeInfo.shortLabel)}</div>
                    <div class="type-card-title">${escapeHtml(typeInfo.label)}</div>
                    <div class="type-card-effects"><span class="trade-type-tag bilateral">BILATERAL</span></div>
                </div>`;
            }
        }
        html += '</div></div>';
        html += '<div class="wizard-nav" style="margin-top:12px;"><button class="wizard-back-btn" onclick="wizardBackToStep2()">Back</button></div>';
        panel.innerHTML = html;
        return;
    }

    // Agreement type selected — show article drafting
    const typeInfo = TRADE_AGREEMENT_TYPES[wizardTradeAgreementType];
    const typeName = typeInfo?.label || wizardTradeAgreementType;
    const availableTypes = getAvailableArticleTypes(wizardTradeAgreementType, tradeArticles);
    const hasRequired = checkRequiredArticles(wizardTradeAgreementType, tradeArticles);

    let html = `
        <div class="trade-article-builder">
            <div class="trade-article-header">
                <span class="trade-article-title">${escapeHtml(typeName)} with ${escapeHtml(targetName)}</span>
                <span class="badge badge--dim" style="margin-left:8px;">${typeInfo?.shortLabel || ''}</span>
            </div>

            <div class="trade-field">
                <label>Agreement Name</label>
                <input type="text" id="trade-neg-name" placeholder="e.g. ${escapeHtml(currentNation.name)}-${escapeHtml(targetName)} ${escapeHtml(typeInfo?.shortLabel || 'Trade')} Agreement" maxlength="120" value="${escapeHtml(wizardName || '')}" onchange="setWizardName(this.value)" />
            </div>`;

    // Type explainer
    const explainer = getTradeTypeExplainer(wizardTradeAgreementType);
    if (explainer) {
        html += '<div class="trade-info-box info" style="margin-top:8px;">' + explainer + '</div>';
    }

    // Show existing articles
    if (tradeArticles.length > 0) {
        html += '<div style="margin-top:12px;">';
        for (let i = 0; i < tradeArticles.length; i++) {
            const art = tradeArticles[i];
            const summary = renderTradeArticleSummary(art, currentNation.id);
            const artTypeInfo = TRADE_ARTICLE_TYPES[art.type];
            const artLabel = artTypeInfo?.label || art.type;
            const artDesc = artTypeInfo?.description || '';
            const isRequired = (typeInfo.required_articles || []).includes(art.type);
            html += `
                <div class="draft-article">
                    <div class="draft-article-type">
                        <span>Art. ${toRoman(i + 1)} — ${escapeHtml(artLabel)} ${isRequired ? '<span class="badge badge--teal" style="margin-left:4px;">Required</span>' : '<span class="badge badge--dim" style="margin-left:4px;">Optional</span>'}</span>
                        <span class="draft-article-remove" onclick="removeWizardTradeArticle(${i})">Remove</span>
                    </div>
                    <div class="draft-article-title" style="font-size:0.75rem;">${summary}</div>
                    <div class="draft-article-body">${escapeHtml(artDesc)}</div>
                </div>`;
        }
        html += '</div>';
        if (tradeArticles.length > 3) {
            html += `<div class="trade-info-box warning" style="margin-top:8px;font-size:0.72rem;">Extra articles: +${getArticleEscalationCost(tradeArticles.length)} AP added (each article beyond 3 costs +2 AP)</div>`;
        }
    }

    // Add article dropdown
    if (availableTypes.length > 0) {
        html += `
            <div style="margin-top:12px;display:flex;gap:8px;align-items:center;">
                <select id="wizard-trade-article-type" style="font-size:0.75rem;padding:4px 8px;background:var(--bg-1);color:var(--text-primary);border:1px solid var(--border-hair);border-radius:3px;">
                    <option value="">Add article...</option>
                    ${availableTypes.map(t => '<option value="' + t.key + '">' + escapeHtml(t.label) + (t.required ? ' (required)' : '') + '</option>').join('')}
                </select>
                <button class="wizard-next-btn" style="font-size:0.72rem;padding:4px 12px;" onclick="showWizardTradeArticleEditor()">Add</button>
            </div>
            <div id="wizard-trade-article-editor"></div>`;
    }

    // Required articles check
    if (!hasRequired) {
        const missing = (typeInfo.required_articles || []).filter(req => !tradeArticles.some(a => a.type === req));
        const missingLabels = missing.map(m => TRADE_ARTICLE_TYPES[m]?.label || m).join(', ');
        html += `<div class="trade-info-box warning" style="margin-top:12px;">Required articles missing: ${escapeHtml(missingLabels)}</div>`;
    }

    const escalation = getArticleEscalationCost(tradeArticles.length);
    html += `
            <div style="font-size:0.75rem;color:var(--text-muted);margin-top:14px;line-height:1.5;">
                <strong>What happens next:</strong><br/>
                1. You send the complete proposal with articles (${apCost} AP${escalation > 0 ? ' — includes +' + escalation + ' AP for extra articles' : ''})<br/>
                2. ${escapeHtml(targetName)} reviews the articles<br/>
                3. They can accept, reject, or counter (strike/add articles)<br/>
                4. If countered, you review their changes and accept or reject
            </div>
        </div>

        <div class="wizard-nav" style="margin-top:12px;">
            <button class="wizard-back-btn" onclick="wizardTradeAgreementType=null;tradeArticles=[];renderWizardStep3TradeProposal()">Back (Change Type)</button>
            <button class="wizard-next-btn" id="trade-propose-btn" ${hasRequired ? '' : 'disabled'} onclick="submitTradeProposal()">
                Send Trade Proposal (${apCost} AP)
            </button>
        </div>`;

    panel.innerHTML = html;
}

function selectTradeAgreementType(typeKey) {
    wizardTradeAgreementType = typeKey;
    tradeArticles = [];
    wizardName = '';
    renderWizardStep3TradeProposal();
}

function showWizardTradeArticleEditor() {
    const select = document.getElementById('wizard-trade-article-type');
    const articleType = select?.value;
    if (!articleType) { alert('Select an article type first.'); return; }
    const container = document.getElementById('wizard-trade-article-editor');
    if (!container) return;
    renderTradeArticleEditorLocal(container, articleType);
}

    if (!artTypeInfo) return;

    switch (articleType) {
        case 'duration': html += renderDurationEditor(); break;
        case 'sector_exemption': html += renderSectorExemptionEditor(); break;
        case 'tariff_reduction': html += renderTariffReductionEditor(); break;
        case 'supply_commitment': html += renderSupplyCommitmentEditor(); break;
        case 'price_terms': html += renderPriceTermsEditor(); break;
        case 'breach_penalty': html += renderBreachPenaltyEditor(); break;
        case 'subsidized_sector': html += renderSubsidizedSectorEditor(); break;
        case 'funding_source': html += renderFundingSourceEditor(); break;
        case 'text_article': html += renderTextArticleEditor(); break;
        case 'aid_terms': html += renderAidTermsEditor(); break;
        case 'aid_condition': html += renderAidConditionEditor(); break;

    }

    html += `
        <div style="display:flex;gap:8px;margin-top:12px;">

        </div>

function saveWizardTradeArticle(articleType) {
    let articleData = {};

    switch (articleType) {
        case 'duration': {
            const durType = document.querySelector('input[name="dur-type"]:checked')?.value || 'fixed';
            const ticks = Math.min(240, Math.max(4, parseInt(document.getElementById('dur-ticks')?.value || '12')));
            const autoRenew = document.getElementById('dur-autorenew')?.checked || false;
            const withdrawal = Math.min(6, Math.max(1, parseInt(document.getElementById('dur-withdrawal')?.value || '3')));
            articleData = { duration_type: durType, duration_ticks: durType === 'fixed' ? ticks : null, auto_renew: autoRenew, withdrawal_notice_ticks: withdrawal };
            break;
        }
        case 'sector_exemption': {
            const sector = document.getElementById('exempt-sector')?.value;
            const reason = document.getElementById('exempt-reason')?.value?.trim() || '';
            if (!sector) { alert('Please select a sector.'); return; }
            articleData = { sector, reason };
            break;
        }
        case 'tariff_reduction': {
            const sector = document.getElementById('tariff-sector')?.value;
            const direction = document.querySelector('input[name="tariff-dir"]:checked')?.value || 'mutual';
            const pct = Math.min(100, Math.max(0, parseInt(document.getElementById('tariff-pct')?.value || '50')));
            if (!sector) { alert('Please select a sector.'); return; }
            articleData = { sector, direction, reduction_pct: pct, author_nation_id: currentNation.id };
            break;
        }
        case 'supply_commitment': {
            const sector = document.getElementById('supply-sector')?.value;
            const direction = document.querySelector('input[name="supply-dir"]:checked')?.value || 'we_buy';
            const pct = Math.min(90, Math.max(10, parseInt(document.getElementById('supply-pct')?.value || '60')));
            if (!sector) { alert('Please select a resource.'); return; }
            articleData = { sector, direction, commitment_pct: pct, author_nation_id: currentNation.id };
            break;
        }
        case 'price_terms': {
            const priceType = document.querySelector('input[name="price-type"]:checked')?.value || 'market';
            const modifier = Math.min(25, Math.max(0, parseInt(document.getElementById('price-modifier')?.value || '10')));
            articleData = { price_type: priceType, modifier_pct: (priceType === 'discounted' || priceType === 'premium') ? modifier : 0 };
            break;
        }
        case 'breach_penalty': {
            articleData = {
                relations_penalty: Math.min(8, Math.max(1, parseInt(document.getElementById('breach-relations')?.value || '5'))),
                reputation_penalty: Math.min(4, Math.max(0, parseInt(document.getElementById('breach-reputation')?.value || '2'))),
                financial_penalty: Math.min(500, Math.max(0, parseInt(document.getElementById('breach-financial')?.value || '200')))
            };
            break;
        }
        case 'subsidized_sector': {
            const sector = document.getElementById('subsidy-sector')?.value;
            const pct = Math.min(30, Math.max(5, parseInt(document.getElementById('subsidy-pct')?.value || '15')));
            if (!sector) { alert('Please select a sector.'); return; }
            articleData = { sector, subsidy_pct: pct, author_nation_id: currentNation.id };
            break;
        }
        case 'funding_source': {
            const source = document.querySelector('input[name="fund-source"]:checked')?.value || 'general_treasury';
            articleData = { source };
            break;
        }
        case 'text_article': {
            const title = document.getElementById('text-art-title')?.value?.trim() || '';
            const body = document.getElementById('text-art-body')?.value?.trim() || '';
            if (!body) { alert('Please enter article body text.'); return; }
            articleData = { title, body };
            break;
        }
        case 'aid_terms': {
            const aidDir = document.querySelector('input[name="aid-direction"]:checked')?.value || 'provide';
            const donorId = aidDir === 'provide' ? currentNation.id : (activeDraftTarget?.id || wizardTargetNation);
            const amount = Number(document.getElementById('aid-amount')?.value || 0);
            const gdpCap = Math.min(25, Math.max(1, parseInt(document.getElementById('aid-gdp-cap')?.value || '10')));
            if (amount < DIPLOMACY_CONFIG.AID_MIN_AMOUNT) {
                alert('Minimum aid amount is $' + (DIPLOMACY_CONFIG.AID_MIN_AMOUNT / 1e9).toFixed(0) + 'B.');
                return;
            }
            articleData = { donor_nation_id: donorId, aid_direction: aidDir, annual_amount: amount, gdp_cap_pct: gdpCap };
            break;
        }
        case 'aid_condition': {
            const statKey = document.getElementById('cond-stat')?.value;
            const operator = document.querySelector('input[name="cond-op"]:checked')?.value || 'gte';
            const threshold = Math.min(100, Math.max(0, parseInt(document.getElementById('cond-threshold')?.value || '50')));
            const onFailure = document.querySelector('input[name="cond-fail"]:checked')?.value || 'suspend';
            const grace = Math.min(2, Math.max(0, parseInt(document.getElementById('cond-grace')?.value || '1')));
            if (!statKey) { alert('Please select a stat to monitor.'); return; }
            const existingConditions = tradeArticles.filter(a => a.type === 'aid_condition');
            if (existingConditions.length >= DIPLOMACY_CONFIG.AID_MAX_CONDITIONS) {
                alert('Maximum ' + DIPLOMACY_CONFIG.AID_MAX_CONDITIONS + ' conditions per agreement.');
                return;
            }
            articleData = { stat_key: statKey, operator, threshold, on_failure: onFailure, grace_periods: grace };
            break;
        }
        case 'tariff_surcharge': {
            const sector = document.getElementById('surcharge-sector')?.value;
            const pct = Math.min(50, Math.max(5, parseInt(document.getElementById('surcharge-pct')?.value || '25')));
            if (!sector) { alert('Please select a sector.'); return; }
            articleData = { sector, surcharge_pct: pct, imposer_nation_id: currentNation.id };
            break;
        }
        case 'stockpile_transfer': {
            const sector = document.getElementById('stockpile-sector')?.value;
            const direction = document.querySelector('input[name="stockpile-dir"]:checked')?.value || 'we_buy';
            const quantity = Math.max(1000000, parseInt(document.getElementById('stockpile-quantity')?.value || '100000000'));
            const price = Math.max(10, Math.min(500, parseInt(document.getElementById('stockpile-price')?.value || '100')));
            if (!sector) { alert('Please select a commodity.'); return; }
            articleData = { sector, direction, quantity_value: quantity, price_per_tonne: price, author_nation_id: currentNation.id };
            break;
        }
    }

    // Add to local state
    const artDef = TRADE_ARTICLE_TYPES[articleType];
    if (artDef && !artDef.repeatable) {
        const existingIdx = tradeArticles.findIndex(a => a.type === articleType);
        if (existingIdx >= 0) {
            tradeArticles[existingIdx] = { type: articleType, data: articleData };
        } else {
            tradeArticles.push({ type: articleType, data: articleData });
        }
    } else {
        tradeArticles.push({ type: articleType, data: articleData });
    }

    // Re-render the appropriate view
    if (draftTradeMode) {
        reRenderTradeDraft();
    } else {
        renderWizardStep3TradeProposal();
    }
}

let wizardAidDirection = null;

function selectAidDirection(direction) {
    wizardAidDirection = direction;
    // Toggle card selection
    const offerCard = document.getElementById('aid-dir-offer');
    const requestCard = document.getElementById('aid-dir-request');
    if (offerCard) offerCard.classList.toggle('selected', direction === 'offer');
    if (requestCard) requestCard.classList.toggle('selected', direction === 'request');
    // Enable the propose button
    const btn = document.getElementById('aid-propose-btn');
    if (btn) btn.disabled = false;
}

async function submitAidProposal() {
    if (!wizardAidDirection) return;
    const btn = document.getElementById('aid-propose-btn');
    if (btn) btn.disabled = true;

    const nameInput = document.getElementById('aid-neg-name');
    const agreementName = (nameInput?.value || '').trim() || 'Economic Aid Negotiations';

    const ourAmb = diplomaticRoles.ambassadorTo.find(a => a.target_nation_id === wizardTargetNation);
    const isHoGOnly = diplomaticRoles.isHoG && !ourAmb && !diplomaticRoles.isFM && !diplomaticRoles.isMoT;
    const apCost = isHoGOnly ? DIPLOMACY_CONFIG.HOG_DRAFT_INITIATIVE_AP : DIPLOMACY_CONFIG.PROPOSE_TRADE_NEGOTIATION_AP;

    // Deduct AP
    const apResult = await deductAP(_supabase, currentFaction.id, apCost);
    if (!apResult.success) {
        if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
        alert('Not enough AP (' + apCost + ' needed). Current AP: ' + (apResult.currentAp ?? '?'));
        if (btn) btn.disabled = false;
        return;
    }

    // Determine role
    let myRole = 'ambassador';
    if (diplomaticRoles.isFM) myRole = 'foreign_minister';
    if (diplomaticRoles.isHoG) myRole = 'prime_minister';

    const currentTick = shardTick;

    // Canonical ordering
    const aId = currentNation.id < wizardTargetNation ? currentNation.id : wizardTargetNation;
    const bId = currentNation.id < wizardTargetNation ? wizardTargetNation : currentNation.id;

    // Determine donor based on direction selection
    const donorNationId = wizardAidDirection === 'offer' ? currentNation.id : wizardTargetNation;

    // Create the trade_negotiations row with type pre-set to economic_aid
    const { data: neg, error: negErr } = await _supabase.from('trade_negotiations').insert({
        nation_a_id: aId,
        nation_b_id: bId,
        agreement_type: 'economic_aid',
        status: 'open',
        participants: [{ faction_id: currentFaction.id, role: myRole, joined_at_tick: currentTick, nation_id: currentNation.id }],
        draft_articles: [{
            type: 'aid_terms',
            data: { donor_nation_id: donorNationId, annual_amount: 0, gdp_cap_pct: 10 }
        }],
        agreement_name: agreementName,
        expires_at_tick: currentTick + DIPLOMACY_CONFIG.NEGOTIATION_DEFAULT_DURATION,
        opened_at_tick: currentTick
    }).select('id').single();

    if (negErr) {
        console.error('Error creating aid negotiation:', negErr);
        alert('Failed to create negotiation: ' + negErr.message);
        if (btn) btn.disabled = false;
        return;
    }

    // Create the diplomatic proposal so the target nation sees it in their inbox
    const { error: proposalErr } = await _supabase.from('diplomatic_proposals').insert({
        proposing_nation_id: currentNation.id,
        target_nation_id: wizardTargetNation,
        proposed_by_faction_id: currentFaction.id,
        proposal_type: 'trade_negotiation',
        proposal_tier: 1,
        status: 'proposed',
        proposal_data: {
            name: agreementName,
            negotiation_id: neg.id,
            proposer_nation_name: currentNation.name,
            target_nation_name: (await _supabase.from('nations').select('name').eq('id', wizardTargetNation).single()).data?.name || '',
            expires_at_tick: currentTick + DIPLOMACY_CONFIG.NEGOTIATION_DEFAULT_DURATION,
            agreement_type: 'economic_aid',
            aid_direction: wizardAidDirection,
            donor_nation_id: donorNationId
        },
        proposed_at_tick: currentTick
    });
    if (proposalErr) { alert('Error creating proposal: ' + proposalErr.message); return; }

    // Fire event
    try {
        await _supabase.rpc('fire_system_event', {
            p_trigger_key: 'trade_negotiation_proposed',
            p_nation_id: currentNation.id,
            p_tick: currentTick,
            p_placeholders: { nation: currentNation.name, agreement_name: agreementName, target_nation: '' }
        });
    } catch (e) { /* non-blocking */ }

    // Redirect to the negotiation
    alert('Aid negotiation proposed! Awaiting acceptance from ' + ((await _supabase.from('nations').select('name').eq('id', wizardTargetNation).single()).data?.name || 'the target nation') + '.');
    openTradeNegotiation(neg.id);
}

async function wizardSubmit() {
    if (_diploActionLock) return;
    if (!wizardName) { alert('Please enter a name for the agreement.'); return; }
    const filledArticles = wizardArticles.filter(a => a.text.trim());
    if (filledArticles.length === 0) { alert('Please add at least one article with content.'); return; }
    if (!wizardTargetNation || !wizardAgreementType) { alert('Missing target nation or agreement type.'); return; }

    // MoT-only players cannot submit diplomatic initiatives
    await refreshRoles();
    const hasAmbassador = diplomaticRoles && diplomaticRoles.ambassadorTo.length > 0;
    const isMoTOnly = diplomaticRoles.isMoT && !hasAmbassador && !diplomaticRoles.isFM && !diplomaticRoles.isHoG;
    if (isMoTOnly) {
        alert('The Minister of Trade can only propose Trade Agreements, not Diplomatic Initiatives.');
        return;
    }

    const typeInfo = INITIATIVE_TYPES[wizardAgreementType];
    if (!typeInfo) { alert('Invalid agreement type.'); return; }

    const ourAmb = diplomaticRoles.ambassadorTo.find(a => a.target_nation_id === wizardTargetNation);
    if (!ourAmb) { alert('You are not ambassador to this nation.'); return; }
    _diploActionLock = true;
    try {

    // Deduct AP for diplomatic initiative
    const apCost = DIPLOMACY_CONFIG.PROPOSE_INITIATIVE_AP;
    const apResult = await deductAP(_supabase, currentFaction.id, apCost);
    if (!apResult.success) {
        if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
        alert('Not enough AP (' + apCost + ' needed). Current AP: ' + (apResult.currentAp ?? '?'));
        return;
    }
    currentFaction.action_points = apResult.newAp;

    // Get their ambassador
    const { data: theirAmb } = await _supabase
        .from('ambassadors')
        .select('ambassador_first_name, ambassador_last_name, factions(abbreviation)')
        .eq('nation_id', wizardTargetNation)
        .eq('target_nation_id', currentNation.id)
        .eq('is_active', true)
        .eq('status', 'active')
        .maybeSingle();

    if (!theirAmb) { alert('Target nation has no active ambassador to negotiate with.'); return; }

    const { data: targetNation } = await _supabase.from('nations').select('name').eq('id', wizardTargetNation).single();

    const ourAmbName = ((ourAmb.ambassador_first_name || '') + ' ' + (ourAmb.ambassador_last_name || '')).trim() + (ourAmb.factions?.abbreviation ? ' (' + ourAmb.factions.abbreviation + ')' : '');
    const theirAmbName = ((theirAmb.ambassador_first_name || '') + ' ' + (theirAmb.ambassador_last_name || '')).trim() + (theirAmb.factions?.abbreviation ? ' (' + theirAmb.factions.abbreviation + ')' : '');

    // Get current tick
    const currentTick = shardTick;

    // Determine proposal tier based on classification
    const proposalTier = typeInfo.classification === 'MAJOR' ? 3 : 1;

    const proposalData = {
        name: wizardName,
        agreement_type: wizardAgreementType,
        classification: typeInfo.classification,
        duration_years: wizardDuration,
        articles: filledArticles.map(a => ({
            text: a.text.trim(),
            type: wizardAgreementType,
            label: typeInfo.label,
            description: typeInfo.description,
            relations: typeInfo.relations,
            money: typeInfo.money
        })),
        proposer_ambassador_name: ourAmbName,
        target_ambassador_name: theirAmbName,
        proposer_nation_name: currentNation.name,
        target_nation_name: targetNation?.name || 'Unknown'
    };

    const { error } = await _supabase.from('diplomatic_proposals').insert({
        proposing_nation_id: currentNation.id,
        target_nation_id: wizardTargetNation,
        proposed_by_faction_id: currentFaction.id,
        proposal_type: 'diplomatic_initiative',
        proposal_tier: proposalTier,
        status: 'proposed',
        proposal_data: proposalData,
        proposed_at_tick: currentTick
    });

    if (error) {
        console.error('Error submitting initiative:', error);
        alert('Error submitting initiative: ' + error.message);
        return;
    }

    // Fire timeline event for diplomatic initiative proposed
    try {
        await _supabase.rpc('fire_system_event', {
            p_trigger_key: 'diplomatic_initiative_proposed',
            p_nation_id: currentNation.id,
            p_tick: currentTick,
            p_placeholders: { name: wizardName, type: typeInfo.label, target_nation: targetNation?.name || 'Unknown', classification: typeInfo.classification }
        });
    } catch (e) { /* non-blocking */ }

    alert('Diplomatic Initiative "' + wizardName + '" proposed!\n\n' +
        (typeInfo.classification === 'MINOR' ? 'As a MINOR agreement, it can be accepted directly by the target ambassador.' :
        'As a MAJOR agreement, it will require escalation through the legislative pipeline after ambassador acceptance.'));

    // Reset and re-render wizard
    await renderInitiativeWizard();
    { const _apEl = document.getElementById('diplo-ap'); if (_apEl) _apEl.textContent = (currentFaction?.action_points ?? 0) + ' AP'; };

    } finally {
        _diploActionLock = false;
    }
}

// (Step 4B removed — trade type selection now happens inside negotiations)

async function submitTradeProposal() {
    if (_diploActionLock) return;
    if (!wizardTargetNation || !wizardTradeAgreementType) {
        alert('Missing target nation or agreement type.');
        return;
    }

    // Credit rating gate — prevent proposals if credit too low for this agreement type
    const isAidDonor = wizardTradeAgreementType === 'economic_aid';
    const creditCheck = checkCreditForTradeAgreement(currentNation.credit, wizardTradeAgreementType, isAidDonor);
    if (!creditCheck.allowed) {
        alert(creditCheck.reason);
        return;
    }

    if (!checkRequiredArticles(wizardTradeAgreementType, tradeArticles)) {
        alert('Please add all required articles before sending.');
        return;
    }

    const nameInput = document.getElementById('trade-neg-name');
    const agreementName = (nameInput?.value?.trim() || wizardName || '').trim();
    if (!agreementName) {
        alert('Please enter a name for the agreement.');
        return;
    }

    const ourAmb = diplomaticRoles.ambassadorTo.find(a => a.target_nation_id === wizardTargetNation);
    const isHoGOnly = diplomaticRoles.isHoG && !ourAmb && !diplomaticRoles.isMoT && !diplomaticRoles.isFM;
    const baseApCost = isHoGOnly ? DIPLOMACY_CONFIG.HOG_DRAFT_INITIATIVE_AP : DIPLOMACY_CONFIG.PROPOSE_TRADE_NEGOTIATION_AP;
    const apCost = baseApCost + getArticleEscalationCost(tradeArticles.length);

    _diploActionLock = true;
    try {
    // Deduct AP
    const apResult = await deductAP(_supabase, currentFaction.id, apCost);
    if (!apResult.success) {
        if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
        alert('Not enough AP. Need ' + apCost + ' AP, have ' + (apResult.currentAp ?? '?') + '.');
        return;
    }
    currentFaction.action_points = apResult.newAp;

    // Get current tick
    const currentTick = shardTick;

    // Fetch target nation name
    const { data: targetNation } = await _supabase.from('nations').select('name').eq('id', wizardTargetNation).single();
    const targetName = targetNation?.name || 'Unknown';

    // Determine classification based on agreement type
    const typeInfo = TRADE_AGREEMENT_TYPES[wizardTradeAgreementType];
    const classification = 'MAJOR';  // All trade agreements go through FM review + ratification

    // Build proposal_data with trade articles
    const allAgreementTypes = draftAgreements.length > 0
        ? draftAgreements.map(a => a.type)
        : [wizardTradeAgreementType];
    const proposalData = {
        name: agreementName,
        classification: classification,
        agreement_type: wizardTradeAgreementType,
        agreement_types: allAgreementTypes,
        agreement_name: agreementName,
        articles: tradeArticles,
        proposer_nation_name: currentNation.name,
        target_nation_name: targetName,
        proposer_faction_id: currentFaction.id,
        duration_years: null  // duration is in the articles
    };

    // Get duration from articles for display
    const durationArt = tradeArticles.find(a => a.type === 'duration');
    if (durationArt?.data) {
        const dt = durationArt.data;
        proposalData.duration_years = dt.duration_type === 'permanent' ? 'Permanent' : Math.round((dt.duration_ticks || 12) / 12);
    }

    const { error: propErr } = await _supabase.from('diplomatic_proposals').insert({
        proposing_nation_id: currentNation.id,
        target_nation_id: wizardTargetNation,
        proposed_by_faction_id: currentFaction.id,
        proposal_type: 'trade_agreement',
        proposal_tier: 2,  // trade agreements are tier 2 (MAJOR)
        status: 'proposed',
        proposal_data: proposalData,
        proposed_at_tick: currentTick
    });

    if (propErr) {
        console.error('Error creating trade proposal:', propErr);
        alert('Error proposing trade agreement: ' + propErr.message);
        return;
    }

    // Fire event
    await _supabase.from('event_log').insert({
        nation_id: currentNation.id,
        event_name: 'Trade Agreement Proposed',
        trigger_key: 'trade_agreement_proposed',
        category: 'Trade',
        description_chosen: currentNation.name + ' has proposed a ' + (allAgreementTypes.length > 1 ? 'trade package' : (typeInfo?.label || 'trade agreement')) + ' ("' + agreementName + '") with ' + targetName + '.',
        fired_at_tick: currentTick
    });

    const typeLabels = allAgreementTypes.map(t => TRADE_AGREEMENT_TYPES[t]?.shortLabel || t).join(' + ');
    alert('"' + agreementName + '" (' + typeLabels + ') proposed to ' + targetName + ' with ' + tradeArticles.length + ' article(s).\n\nThey can accept, reject, or counter with modifications.');

    // Reset state and re-render
    wizardTradeAgreementType = null;
    tradeArticles = [];
    wizardName = '';
    draftAgreements = [];
    activeAgreementTab = -1;
    addingNewAgreement = false;
    if (draftTradeMode) {
        cancelDraft();
        await renderNegotiationsBox();
    } else {
        await renderInitiativeWizard();
    }
    { const _apEl = document.getElementById('diplo-ap'); if (_apEl) _apEl.textContent = (currentFaction?.action_points ?? 0) + ' AP'; };
    } finally {
        _diploActionLock = false;
    }
}

// ==================== VIEW ACTIVE TRADE AGREEMENT IN DRAFT BOX ====================
async function openTradeNegotiation(negotiationId) {
    // Show the negotiation details in the draft initiative box
    const panel = document.getElementById('draft-body');
    if (!panel) return;

    activeDraftAction = null;

    // Scroll the draft box into view
    const draftBox = document.getElementById('box-draft');
    if (draftBox) draftBox.scrollIntoView({ behavior: 'smooth', block: 'start' });

    // Update draft status badge
    const statusEl = document.getElementById('draft-status');
    if (statusEl) statusEl.textContent = 'Viewing';

    const { data: neg, error } = await _supabase
        .from('trade_negotiations')
        .select('*')
        .eq('id', negotiationId)
        .single();

    if (error || !neg) {
        alert('Could not load negotiation.');
        return;
    }

    const typeInfo = neg.agreement_type && neg.agreement_type !== 'pending' ? TRADE_AGREEMENT_TYPES[neg.agreement_type] : null;
    const typePending = !typeInfo;  // true if agreement type hasn't been chosen yet

    // Fetch nation names
    const partnerId = neg.nation_a_id === currentNation.id ? neg.nation_b_id : neg.nation_a_id;
    const { data: partnerNation } = await _supabase.from('nations').select('id, name').eq('id', partnerId).single();
    const partnerName = partnerNation?.name || 'Unknown';

    const ticksLeft = neg.expires_at_tick - shardTick;
    const statusClass = ticksLeft <= 0 ? 'expired' : ticksLeft <= 2 ? 'expiring' : 'active'; // Fixed: expired check must come first
    const participants = neg.participants || [];
    const draftArticles = neg.draft_articles || [];

    const iconHtml = typeInfo ? (TRADE_TYPE_ICONS[typeInfo.icon] || '') : '&#128220;';
    const typeLabel = typeInfo ? escapeHtml(typeInfo.label) : 'Trade Negotiations';
    const typeIconClass = typeInfo ? typeInfo.icon : 'chart';

    // Determine if we're the recipient of an open negotiation (not yet in participants)
    const isRecipientOfOpen = neg.status === 'open' && !participants.some(p => p.nation_id === currentNation.id);

    // Fetch linked proposal if we're the recipient (needed for accept/reject)
    let linkedProposal = null;
    if (isRecipientOfOpen) {
        // Try target_nation_id first (standard case), then proposing_nation_id as fallback
        const { data: proposals, error: propErr } = await _supabase
            .from('diplomatic_proposals')
            .select('*')
            .eq('proposal_type', 'trade_negotiation')
            .in('status', ['proposed', 'revised'])
            .or('target_nation_id.eq.' + currentNation.id + ',proposing_nation_id.eq.' + currentNation.id);
        if (proposals) {
            linkedProposal = proposals.find(p => p.proposal_data?.negotiation_id === neg.id) || null;
        }
    }

    const openStatusText = isRecipientOfOpen ? 'AWAITING YOUR RESPONSE' : 'AWAITING ACCEPTANCE';

    let html = `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
            <button class="wizard-back-btn" onclick="renderInitiativeWizard()" style="padding:5px 10px;font-size:0.72rem;">Back</button>
            <div class="trade-type-icon ${typeIconClass}" style="width:28px;height:28px;font-size:0.9rem;">${iconHtml}</div>
            <div>
                <div style="font-size:0.95rem;font-weight:bold;color:var(--text-primary);">${escapeHtml(neg.agreement_name || 'Unnamed')}</div>
                <div style="font-size:0.7rem;color:var(--text-muted);">${typeLabel} with ${escapeHtml(partnerName)}</div>
            </div>
        </div>

        <div class="trade-neg-status">
            <div>
                <div class="trade-neg-status-label">Negotiations</div>
                <div style="font-size:0.7rem;color:var(--text-muted);">Opened tick ${neg.opened_at_tick}</div>
            </div>
            <div style="text-align:right;">
                <div class="trade-neg-status-value ${neg.status === 'ratification' ? 'active' : neg.status === 'ratification_failed' ? 'expiring' : neg.status === 'concluded' ? 'active' : statusClass}">
                    ${neg.status === 'open' ? openStatusText : neg.status === 'ratification' ? 'AWAITING PARLIAMENT' : neg.status === 'ratification_failed' ? 'RATIFICATION FAILED' : neg.status === 'concluded' ? 'RATIFIED &amp; ACTIVE' : ticksLeft + ' ticks remaining'}
                </div>
                <div style="font-size:0.62rem;color:var(--text-dim);">${neg.status === 'ratification' || neg.status === 'concluded' || neg.status === 'ratification_failed' ? 'Both sides approved' : 'Expires tick ' + neg.expires_at_tick}</div>
            </div>
        </div>
    `;

    // Participants
    html += '<div class="diplo-section-title">Participants</div>';
    if (participants.length === 0) {
        html += '<div style="color:var(--text-dim);font-size:0.78rem;font-style:italic;padding:4px 0;">No participants yet.</div>';
    } else {
        for (const p of participants) {
            const roleLabel = p.role === 'ambassador' ? 'Ambassador' : p.role === 'trade_minister' ? 'Minister of Trade' : p.role === 'foreign_minister' ? 'Foreign Minister' : p.role === 'prime_minister' ? 'Prime Minister' : 'Head of Government';
            const roleClass = p.role === 'ambassador' ? 'role-amb' : p.role === 'trade_minister' ? 'role-mot' : p.role === 'foreign_minister' ? 'role-fm' : 'role-hog';
            const isOurNation = p.nation_id === currentNation.id;
            html += `
                <div style="display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--bg-body);border:1px solid var(--border-light);border-radius:4px;margin-bottom:4px;">
                    <span class="diplo-role-badge ${roleClass}">${roleLabel}</span>
                    <span style="font-size:0.78rem;color:var(--text-primary);">${isOurNation ? escapeHtml(currentNation.name) : escapeHtml(partnerName)}</span>
                    <span style="font-size:0.68rem;color:var(--text-dim);margin-left:auto;">Joined tick ${p.joined_at_tick}</span>
                </div>
            `;
        }
    }

    // Check if MoT has joined for each nation
    const ourMoTJoined = participants.some(p => p.nation_id === currentNation.id && p.role === 'trade_minister');
    const partnerMoTJoined = participants.some(p => p.nation_id === partnerId && p.role === 'trade_minister');

    // Show MoT requirement warning if ambassador-initiated and MoT hasn't joined
    if (neg.status === 'active' && (!ourMoTJoined || !partnerMoTJoined)) {
        const motDeadline = DIPLOMACY_CONFIG.MOT_JOIN_DEADLINE_TICKS;
        const ticksSinceActive = shardTick - neg.opened_at_tick;
        const ticksRemaining = motDeadline - ticksSinceActive;
        let warningMsg = '';
        if (!ourMoTJoined && !partnerMoTJoined) {
            warningMsg = 'Both nations\' Ministers of Trade must join within ' + motDeadline + ' tick' + (motDeadline !== 1 ? 's' : '') + ' or negotiations will be cancelled.';
        } else if (!ourMoTJoined) {
            warningMsg = 'Your Minister of Trade must join within ' + motDeadline + ' tick' + (motDeadline !== 1 ? 's' : '') + ' or negotiations will be cancelled.';
        } else {
            warningMsg = escapeHtml(partnerName) + '\'s Minister of Trade must join within ' + motDeadline + ' tick' + (motDeadline !== 1 ? 's' : '') + ' or negotiations will be cancelled.';
        }
        if (ticksRemaining > 0) {
            warningMsg += ' (' + ticksRemaining + ' tick' + (ticksRemaining !== 1 ? 's' : '') + ' remaining)';
        }
        html += '<div class="trade-info-box warning" style="margin-top:8px;">' + warningMsg + '</div>';
    }

    // Can FM, PM, or MoT join?
    const myParticipant = participants.find(p => p.faction_id === currentFaction.id);
    if (!myParticipant && neg.status === 'active') {
        const isFM = diplomaticRoles.isFM;
        const isPM = diplomaticRoles.isHoG;
        const isMoT = diplomaticRoles.isMoT;
        if (isMoT) {
            const joinCost = DIPLOMACY_CONFIG.JOIN_NEGOTIATION_MOT_AP;
            html += `
                <div style="margin-top:8px;">
                    <button class="wizard-next-btn" onclick="joinTradeNegotiation('${neg.id}', 'trade_minister', ${joinCost})">
                        Join as Minister of Trade (${joinCost} AP)
                    </button>
                </div>
            `;
        }
        if (isFM || isPM) {
            const joinCost = isPM ? DIPLOMACY_CONFIG.JOIN_NEGOTIATION_PM_AP : DIPLOMACY_CONFIG.JOIN_NEGOTIATION_FM_AP;
            const joinRole = isPM ? 'Prime Minister' : 'Foreign Minister';
            html += `
                <div style="margin-top:8px;">
                    <button class="wizard-next-btn" onclick="joinTradeNegotiation('${neg.id}', '${isPM ? 'prime_minister' : 'foreign_minister'}', ${joinCost})">
                        Join as ${joinRole} (${joinCost} AP)
                    </button>
                </div>
            `;
        }
    }

    // ── If status is 'open', show accept buttons for recipient or waiting message for proposer ──
    if (neg.status === 'open') {
        if (isRecipientOfOpen) {
            // Recipient view: show accept/reject buttons
            html += `
                <div class="trade-info-box info" style="margin-top:16px;">
                    ${escapeHtml(partnerName)} has proposed opening trade negotiations with your nation.
                    If you accept, the negotiation table opens and both sides can choose an agreement type and draft terms together.
                </div>
            `;
            if (hasAnyDiplomaticRole()) {
                const apCost = DIPLOMACY_CONFIG.ACCEPT_TRADE_NEGOTIATION_AP;
                const proposalId = linkedProposal ? linkedProposal.id : '';
                html += `
                    <div class="inbox-card-actions" style="margin-top:12px;">
                        <button class="proposal-accept-btn" onclick="acceptTradeNegotiation('${proposalId}', '${neg.id}')">Begin Negotiations (${apCost} AP)</button>
                        <button class="proposal-reject-btn" onclick="rejectTradeNegotiation('${proposalId}', '${neg.id}')">Reject</button>
                    </div>
                `;
            }
        } else {
            // Proposer view: show waiting message
            html += `
                <div class="trade-info-box info" style="margin-top:16px;">
                    Waiting for ${escapeHtml(partnerName)}'s ambassador to accept these negotiations.
                    Once they accept, the negotiation table opens and you can choose an agreement type together.
                </div>
            `;

            // Cancel button for the proposer (requires a diplomatic role)
            const myPart = participants.find(p => p.nation_id === currentNation.id);
            if (myPart && hasAnyDiplomaticRole()) {
                html += `
                    <div style="margin-top:12px;">
                        <button class="proposal-reject-btn" style="font-size:0.72rem;padding:5px 12px;" onclick="cancelTradeNegotiation('${neg.id}')">Cancel Negotiations</button>
                    </div>
                `;
            }
        }

        panel.innerHTML = html;
        return;
    }

    // ── If status is 'active' and agreement type not yet chosen, show type selection cards ──
    if (neg.status === 'active' && typePending && myParticipant) {
        html += '<div class="diplo-section-title" style="margin-top:16px;">Choose Agreement Type</div>';
        html += '<p style="font-size:0.78rem;color:var(--text-muted);margin-bottom:10px;">Select what kind of trade agreement to negotiate:</p>';
        html += '<div class="trade-type-grid">';

        for (const [key, tInfo] of Object.entries(TRADE_AGREEMENT_TYPES)) {
            // Skip unilateral-only types (retaliatory tariff, export subsidy) — those use MoT draft panels
            if (tInfo.category === 'unilateral') continue;
            const tIconHtml = TRADE_TYPE_ICONS[tInfo.icon] || '';
            html += `
                <div class="trade-type-card" onclick="selectNegotiationType('${neg.id}', '${key}')">
                    <div class="trade-type-icon ${tInfo.icon}">${tIconHtml}</div>
                    <div class="trade-type-label">${escapeHtml(tInfo.label)}</div>
                    <div class="trade-type-short">${escapeHtml(tInfo.shortLabel)}</div>
                    <div class="trade-type-desc">${escapeHtml(tInfo.description)}</div>
                    <div style="margin-top:6px;font-size:0.62rem;color:var(--text-dim);">${tInfo.bilateral ? 'Bilateral' : 'Unilateral'}</div>
                </div>
            `;
        }
        html += '</div>';

        // Cancel button (requires a diplomatic role)
        if (hasAnyDiplomaticRole()) {
            html += `
                <div style="margin-top:12px;">
                    <button class="proposal-reject-btn" style="font-size:0.72rem;padding:5px 12px;" onclick="cancelTradeNegotiation('${neg.id}')">Cancel Negotiations</button>
                </div>
            `;
        }

        panel.innerHTML = html;
        return;
    }

    // ── If type pending but user is not a participant, show waiting ──
    if (typePending) {
        html += '<div class="trade-info-box info" style="margin-top:16px;">Waiting for a participant to select the agreement type.</div>';
        panel.innerHTML = html;
        return;
    }

    // ── Agreement type is set — show article drafting ──
    // Draft Articles
    html += '<div class="diplo-section-title" style="margin-top:16px;">Draft Articles</div>';
    if (draftArticles.length === 0) {
        html += '<div style="color:var(--text-dim);font-size:0.78rem;font-style:italic;padding:4px 0;">No articles drafted yet. Add articles below.</div>';
    } else {
        for (let i = 0; i < draftArticles.length; i++) {
            const art = draftArticles[i];
            const artType = TRADE_ARTICLE_TYPES[art.type];
            html += `
                <div class="trade-article-card">
                    <div class="trade-article-card-header">
                        <span class="trade-article-card-type">Art. ${toRoman(i + 1)} &mdash; ${escapeHtml(artType?.label || art.type)}</span>
                        <button class="initiative-article-remove" onclick="removeTradeNegArticle('${neg.id}', ${i})">X</button>
                    </div>
                    <div class="trade-article-card-summary">${renderTradeArticleSummary(art, currentNation.id)}</div>
                </div>
            `;
        }
    }

    // Add article button (only if user is a participant)
    if (myParticipant && neg.status === 'active') {
        const availableTypes = getAvailableArticleTypes(neg.agreement_type, draftArticles);
        if (availableTypes.length > 0) {
            const opts = availableTypes.map(t =>
                '<option value="' + t.key + '">' + escapeHtml(t.label) + (t.required ? ' (Required)' : ' (Optional)') + '</option>'
            ).join('');
            html += `
                <div class="trade-add-article-bar" style="margin-top:8px;">
                    <select id="trade-add-article-select">${opts}</select>
                    <button onclick="addTradeNegArticle('${neg.id}')">+ Add Article</button>
                </div>
                <div id="trade-article-editor"></div>
            `;
        }
    }

    // Extend / Approve / Cancel buttons
    if (neg.status === 'active' && myParticipant) {
        html += '<div class="diplo-section-title" style="margin-top:16px;">Actions</div>';
        html += '<div style="display:flex;gap:6px;flex-wrap:wrap;">';

        // Extend negotiations (requires a diplomatic role)
        const weAreA = currentNation.id === neg.nation_a_id;
        const alreadyRequested = weAreA ? neg.extension_requested_a : neg.extension_requested_b;
        if (hasAnyDiplomaticRole()) {
            if (!alreadyRequested && neg.extensions_used < DIPLOMACY_CONFIG.NEGOTIATION_MAX_EXTENSIONS) {
                html += '<button class="wizard-next-btn" style="font-size:0.72rem;padding:5px 12px;" onclick="extendNegotiation(\'' + neg.id + '\')">Extend Negotiations (+' + DIPLOMACY_CONFIG.NEGOTIATION_EXTENSION_TICKS + ' ticks)</button>';
            } else if (alreadyRequested) {
                html += '<span style="font-size:0.72rem;color:var(--text-muted);padding:5px 0;">Extension requested — waiting for partner</span>';
            }
        }

        // Approve + Send to Parliament flow
        const hasRequiredArticles = checkRequiredArticles(neg.agreement_type, draftArticles);
        if (hasRequiredArticles) {
            const weApproved = weAreA ? neg.approved_by_a : neg.approved_by_b;
            const theyApproved = weAreA ? neg.approved_by_b : neg.approved_by_a;
            const bothApproved = weApproved && theyApproved;

            html += '<div style="display:flex;flex-direction:column;gap:6px;margin-top:8px;">';

            // Approval status for both sides
            html += '<div style="display:flex;gap:8px;align-items:center;font-family:var(--font-mono);font-size:0.65rem;">';
            html += '<span style="color:' + (weApproved ? '#4ade80' : 'var(--text-dim)') + ';">' + (weApproved ? '&#10003; ' : '&#9675; ') + 'Your side</span>';
            html += '<span style="color:' + (theyApproved ? '#4ade80' : 'var(--text-dim)') + ';">' + (theyApproved ? '&#10003; ' : '&#9675; ') + 'Partner</span>';
            html += '</div>';

            if (!weApproved) {
                html += '<button class="proposal-accept-btn" style="font-size:0.72rem;padding:5px 12px;" onclick="approveTradeNegotiation(\'' + neg.id + '\')">Approve Agreement</button>';
            }

            // Send to Parliament button — greyed out until both approve
            if (bothApproved) {
                html += '<button class="proposal-accept-btn" style="font-size:0.72rem;padding:6px 14px;background:var(--green);color:#000;font-weight:700;" onclick="sendTradeToParliament(\'' + neg.id + '\')">Send to Parliament</button>';
            } else {
                html += '<button disabled style="font-size:0.72rem;padding:6px 14px;font-family:var(--font-mono);font-weight:700;color:var(--text-dim);background:var(--bg-3);border:1px solid var(--border-main);cursor:not-allowed;opacity:0.5;">Send to Parliament</button>';
            }

            html += '</div>';
        }

        // Cancel (requires a diplomatic role)
        if (hasAnyDiplomaticRole()) {
            html += '<button class="proposal-reject-btn" style="font-size:0.72rem;padding:5px 12px;" onclick="cancelTradeNegotiation(\'' + neg.id + '\')">Cancel Negotiations</button>';
        }
        html += '</div>';
    }

    // Ratification status display
    if (neg.status === 'ratification') {
        html += '<div class="diplo-section-title" style="margin-top:16px;">Parliament Ratification</div>';
        html += '<div class="trade-info-box info" style="margin-bottom:8px;">Both sides have approved this agreement. Ratification bills are now before both parliaments.</div>';

        // Show bill links/status for each nation
        const nationALabel = neg.nation_a_id === currentNation.id ? currentNation.name : partnerName;
        const nationBLabel = neg.nation_b_id === currentNation.id ? currentNation.name : partnerName;
        const billIds = [
            { label: nationALabel, billId: neg.bill_a_id, nationId: neg.nation_a_id },
            { label: nationBLabel, billId: neg.bill_b_id, nationId: neg.nation_b_id }
        ];

        // Fetch bill statuses
        for (const entry of billIds) {
            let billStatus = 'unknown';
            if (entry.billId) {
                const { data: bData } = await _supabase.from('bills').select('status').eq('id', entry.billId).single();
                billStatus = bData?.status || 'unknown';
            }
            const statusColor = billStatus === 'passed' ? '#4ade80' : billStatus === 'failed' ? '#ef4444' : billStatus === 'floor' ? '#facc15' : '#666';
            const statusText = billStatus === 'passed' ? 'RATIFIED' : billStatus === 'failed' ? 'REJECTED' : billStatus === 'floor' ? 'VOTING' : 'PENDING';
            const isOurs = entry.nationId === currentNation.id;
            const linkHtml = isOurs && entry.billId ? ' <a href="bill.html?id=' + entry.billId + '" style="color:var(--accent);font-size:0.7rem;text-decoration:underline;">View Bill</a>' : '';
            html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--bg-body);border:1px solid var(--border-light);border-radius:4px;margin-bottom:4px;">';
            html += '<span style="font-size:0.8rem;color:var(--text-primary);">' + (isOurs ? escapeHtml(currentNation.name) : escapeHtml(entry.label)) + '\'s Parliament' + linkHtml + '</span>';
            html += '<span style="font-size:0.72rem;font-weight:bold;color:' + statusColor + ';">' + statusText + '</span>';
            html += '</div>';
        }
    }

    if (neg.status === 'ratification_failed') {
        html += '<div class="diplo-section-title" style="margin-top:16px;">Ratification Failed</div>';
        html += '<div class="trade-info-box warning">One or both parliaments rejected the ratification bill. This trade agreement will not take effect.</div>';
    }

    if (neg.status === 'concluded') {
        html += '<div class="diplo-section-title" style="margin-top:16px;">Agreement Active</div>';
        html += '<div class="trade-info-box info">Both parliaments have ratified this agreement. The trade agreement is now active and in effect.</div>';
    }

    panel.innerHTML = html;
}

// ── Select agreement type during active negotiations ──
async function selectNegotiationType(negotiationId, agreementType) {
    const typeInfo = TRADE_AGREEMENT_TYPES[agreementType];
    if (!typeInfo) return;

    if (!confirm('Set this negotiation to "' + typeInfo.label + '"? Both sides will draft articles for this type.')) return;

    const { error } = await _supabase.from('trade_negotiations').update({
        agreement_type: agreementType
    }).eq('id', negotiationId);

    if (error) {
        console.error('Error setting agreement type:', error);
        alert('Error: ' + error.message);
        return;
    }

    // Re-render the negotiation panel
    await openTradeNegotiation(negotiationId);
}

function renderTradeArticleSummary(article, viewerNationId, authorNationId) {
    if (!article || !article.type) return 'Unknown article';

    // Defensive: support both { type, data: {...} } and flat { type, sector, ... } formats
    const d = (article.data && Object.keys(article.data).length > 0) ? article.data : article;
    // Flip perspective if we know the author and the viewer is a different nation
    const author = d.author_nation_id || authorNationId;
    const flipPerspective = viewerNationId && author && author !== viewerNationId;

    switch (article.type) {
        case 'duration': {
            if (d.duration_type === 'permanent') return 'Permanent (until one party withdraws). Withdrawal notice: ' + (d.withdrawal_notice_ticks || 3) + ' ticks.';
            return 'Fixed term: ' + (d.duration_ticks || '?') + ' ticks' + (d.auto_renew ? ' (auto-renew)' : '') + '. Withdrawal notice: ' + (d.withdrawal_notice_ticks || 3) + ' ticks.';
        }
        case 'sector_exemption': {
            const sector = TRADEABLE_SECTOR_MAP[d.sector];
            return 'Exempt: ' + (sector?.label || d.sector || 'Unknown') + (d.reason ? ' — ' + escapeHtml(d.reason) : '');
        }
        case 'tariff_reduction': {
            const sector = TRADEABLE_SECTOR_MAP[d.sector];
            let trDir = d.direction;
            if (flipPerspective && trDir !== 'mutual') trDir = trDir === 'your_exports' ? 'their_exports' : 'your_exports';
            const dirLabel = trDir === 'mutual' ? 'Mutual' : trDir === 'your_exports' ? 'Your exports' : 'Their exports';
            return (sector?.label || d.sector || 'Unknown') + ': ' + dirLabel + ' tariff reduction of ' + (d.reduction_pct || 0) + '%';
        }
        case 'supply_commitment': {
            const sector = TRADEABLE_SECTOR_MAP[d.sector];
            let scDir = d.direction;
            if (flipPerspective) scDir = scDir === 'we_buy' ? 'we_sell' : 'we_buy';
            const dirLabel = scDir === 'we_buy' ? 'We buy from them' : 'We sell to them';
            return (sector?.label || d.sector || 'Unknown') + ': ' + dirLabel + ', min ' + (d.commitment_pct || 0) + '% commitment';
        }
        case 'price_terms': {
            const labels = { market: 'Market rate', fixed: 'Fixed rate', discounted: 'Discounted (' + (d.modifier_pct || 0) + '% below market)', premium: 'Premium (' + (d.modifier_pct || 0) + '% above market)' };
            return labels[d.price_type] || 'Unknown pricing';
        }
        case 'breach_penalty': {
            const parts = [];
            if (d.relations_penalty) parts.push('-' + d.relations_penalty + ' Relations');
            if (d.reputation_penalty) parts.push('-' + d.reputation_penalty + ' Reputation');
            if (d.financial_penalty) parts.push('$' + d.financial_penalty + 'M penalty');
            return parts.join(', ') || 'No penalties defined';
        }
        case 'subsidized_sector': {
            const sector = TRADEABLE_SECTOR_MAP[d.sector];
            return (sector?.label || d.sector || 'Unknown') + ' exports subsidized at ' + (d.subsidy_pct || 0) + '%';
        }
        case 'funding_source': {
            return d.source === 'ministry_budget' ? 'Funded from Ministry of Trade budget' : 'Funded from general treasury';
        }
        case 'text_article': {
            return (d.title ? escapeHtml(d.title) + ': ' : '') + escapeHtml(d.body || '');
        }
        case 'aid_terms': {
            const amt = Number(d.annual_amount || 0);
            const amtLabel = amt >= 1e9 ? '$' + (amt / 1e9).toFixed(1) + 'B' : amt >= 1e6 ? '$' + (amt / 1e6).toFixed(0) + 'M' : '$' + amt.toLocaleString();
            // Use donor_nation_id to determine perspective — viewer is donor or recipient
            const viewerIsDonor = d.donor_nation_id && viewerNationId && d.donor_nation_id === viewerNationId;
            const dirLabel = viewerIsDonor ? 'We provide' : 'We receive';
            return dirLabel + ': ' + amtLabel + '/yr (GDP cap: ' + (d.gdp_cap_pct || 10) + '%)';
        }
        case 'aid_condition': {
            const stat = AID_CONDITION_STATS.find(s => s.key === d.stat_key);
            const label = stat ? stat.label : (d.stat_key || 'Unknown');
            const op = d.operator === 'lte' ? '\u2264' : '\u2265';
            const failLabels = { suspend: 'Suspend', terminate: 'Terminate', reduce: 'Reduce' };
            return escapeHtml(label) + ' ' + op + ' ' + (d.threshold || 0) + ' (on failure: ' + (failLabels[d.on_failure] || d.on_failure) + ', grace: ' + (d.grace_periods || 0) + ')';
        }
        case 'tariff_surcharge': {
            const sector = TRADEABLE_SECTOR_MAP[d.sector];
            return (sector?.label || d.sector || 'Unknown') + ': +' + (d.surcharge_pct || 0) + '% tariff surcharge';
        }
        case 'stockpile_transfer': {
            const sector = TRADEABLE_SECTOR_MAP[d.sector];
            let stDir = d.direction;
            if (flipPerspective) stDir = stDir === 'we_buy' ? 'we_sell' : 'we_buy';
            const dirLabel = stDir === 'we_buy' ? 'We purchase' : 'We sell';
            const qty = Number(d.quantity_value) || 0;
            const qtyLabel = qty >= 1e9 ? '$' + (qty / 1e9).toFixed(1) + 'B' : '$' + (qty / 1e6).toFixed(0) + 'M';
            const price = Number(d.price_per_tonne) || 100;
            return dirLabel + ' ' + qtyLabel + ' of ' + (sector?.label || d.sector || '?') + ' at $' + price + '/tonne';
        }
        default:
            return 'Unknown article type: ' + article.type;
    }
}

function getTradeTypeExplainer(agreementType) {
    switch (agreementType) {
        case 'fta':
            return 'An FTA eliminates tariffs on <strong>all 6 trade sectors</strong> by default. '
                + 'You only need a Duration article. Optionally add <strong>Sector Exemption</strong> articles to protect specific industries from free trade.';
        case 'pta':
            return 'A PTA lets you negotiate <strong>sector-by-sector</strong> tariff reductions. '
                + 'Add one or more <strong>Tariff Reduction</strong> articles specifying which sectors get reduced tariffs and by how much.';
        case 'resource_supply':
            return 'An RSC guarantees a <strong>minimum purchase volume</strong> of a raw resource (fuel, minerals, or food). '
                + 'You must set the <strong>Supply Commitment</strong> (who buys/sells and how much) and <strong>Price Terms</strong> (market, fixed, discount, or premium).';
        case 'economic_aid':
            return 'An aid agreement commits the <strong>donor</strong> to annual funding that appears as revenue in the <strong>recipient\'s</strong> budget. '
                + 'Optionally attach <strong>Conditions</strong> (e.g. maintain corruption below 40) — failure triggers suspension or termination at annual review.';
        default:
            return '';
    }
}

function getArticleEscalationCost(articleCount) {
    // Articles beyond 3 cost +2 AP each (4th = +2, 5th = +4, etc.)
    return Math.max(0, articleCount - 3) * 2;
}

function getAvailableArticleTypes(agreementType, existingArticles) {
    const typeConfig = TRADE_AGREEMENT_TYPES[agreementType];
    if (!typeConfig) return [];

    const allArticleKeys = [...(typeConfig.required_articles || []), ...(typeConfig.optional_articles || [])];
    const existingTypes = existingArticles.map(a => a.type);

    const available = [];
    for (const key of allArticleKeys) {
        const artType = TRADE_ARTICLE_TYPES[key];
        if (!artType) continue;
        // If not repeatable and already exists, skip
        if (!artType.repeatable && existingTypes.includes(key)) continue;
        const isRequired = (typeConfig.required_articles || []).includes(key);
        available.push({ key: key, label: artType.label, required: isRequired });
    }
    return available;
}

function checkRequiredArticles(agreementType, draftArticles) {
    const typeConfig = TRADE_AGREEMENT_TYPES[agreementType];
    if (!typeConfig) return false;
    const existingTypes = new Set(draftArticles.map(a => a.type));
    return (typeConfig.required_articles || []).every(req => existingTypes.has(req));
}

async function joinTradeNegotiation(negotiationId, role, apCost) {
    if (!await requireNegStatus(negotiationId, ['active'], () => openTradeNegotiation(negotiationId))) return;
    if (!confirm('Join trade negotiations as ' + role.replace('_', ' ') + '? This costs ' + apCost + ' AP.')) return;

    const apResult = await deductAP(_supabase, currentFaction.id, apCost);
    if (!apResult.success) {
        if (apResult.currentAp !== undefined) currentFaction.action_points = apResult.currentAp;
        alert('Not enough AP. Need ' + apCost + ' AP, have ' + (apResult.currentAp ?? '?') + '.');
        return;
    }
    currentFaction.action_points = apResult.newAp;

    const neg = await fetchNegotiation(negotiationId, 'participants');
    if (!neg) return;
    const participants = neg.participants || [];
    participants.push({ faction_id: currentFaction.id, role, joined_at_tick: shardTick, nation_id: currentNation.id });

    const { error: joinErr } = await _supabase.from('trade_negotiations').update({ participants }).eq('id', negotiationId);
    if (joinErr) { alert('Failed to join negotiation: ' + joinErr.message); return; }
    await openTradeNegotiation(negotiationId);
}

async function extendNegotiation(negotiationId) {
    await refreshRoles();
    if (!hasAnyDiplomaticRole()) {
        alert('You need a diplomatic role to extend negotiations.');
        return;
    }

    const neg = await fetchNegotiation(negotiationId);
    if (!neg) return;

    const weAreA = currentNation.id === neg.nation_a_id;
    const updateCol = weAreA ? 'extension_requested_a' : 'extension_requested_b';
    const otherRequested = weAreA ? neg.extension_requested_b : neg.extension_requested_a;

    if (otherRequested) {
        // Both sides agreed — extend
        const newExpiry = neg.expires_at_tick + DIPLOMACY_CONFIG.NEGOTIATION_EXTENSION_TICKS;
        const { error: extErr } = await _supabase.from('trade_negotiations').update({
            expires_at_tick: newExpiry,
            extension_requested_a: false,
            extension_requested_b: false,
            extensions_used: (neg.extensions_used || 0) + 1
        }).eq('id', negotiationId);
        if (extErr) { alert('Extension failed: ' + extErr.message); return; }
        alert('Negotiations extended by ' + DIPLOMACY_CONFIG.NEGOTIATION_EXTENSION_TICKS + ' ticks!');
    } else {
        const { error: reqErr } = await _supabase.from('trade_negotiations').update({ [updateCol]: true }).eq('id', negotiationId);
        if (reqErr) { alert('Extension request failed: ' + reqErr.message); return; }
        alert('Extension requested. Waiting for the other party to agree.');
    }

    await openTradeNegotiation(negotiationId);
}

async function cancelTradeNegotiation(negotiationId) {
    await refreshRoles();
    if (!hasAnyDiplomaticRole()) {
        alert('You need a diplomatic role to cancel negotiations.');
        return;
    }
    if (!await requireNegStatus(negotiationId, ['open', 'active'], renderInitiativeWizard)) return;
    if (!confirm('Cancel these trade negotiations? This cannot be undone.')) return;

    await _supabase.from('trade_negotiations').update({
        status: 'cancelled', concluded_at_tick: shardTick
    }).eq('id', negotiationId);

    // Reject any linked proposals still pending
    await _supabase.from('diplomatic_proposals')
        .update({ status: 'rejected' })
        .eq('proposal_type', 'trade_negotiation')
        .in('status', ['proposed', 'revised'])
        .or('target_nation_id.eq.' + currentNation.id + ',proposing_nation_id.eq.' + currentNation.id);

    alert('Trade negotiations cancelled.');
    await renderInitiativeWizard();
}

async function addTradeNegArticle(negotiationId) {
    const select = document.getElementById('trade-add-article-select');
    if (!select) return;
    const articleType = select.value;
    if (!articleType) return;

    // Show the article editor inline
    const editor = document.getElementById('trade-article-editor');
    if (!editor) return;

    renderTradeArticleEditor(editor, articleType, negotiationId);
}

async function removeTradeNegArticle(negotiationId, index) {
    if (!confirm('Remove this article?')) return;

    const neg = await fetchNegotiation(negotiationId, 'draft_articles');
    if (!neg) return;

    const articles = neg.draft_articles || [];
    articles.splice(index, 1);

    await _supabase.from('trade_negotiations').update({ draft_articles: articles }).eq('id', negotiationId);
    await openTradeNegotiation(negotiationId);
}

async function approveTradeNegotiation(negotiationId) {
    const neg = await fetchNegotiation(negotiationId);
    if (!neg) return;
    if (neg.status !== 'active') {
        alert('This negotiation is not active (status: ' + neg.status + ').');
        await openTradeNegotiation(negotiationId);
        return;
    }
    if (!checkRequiredArticles(neg.agreement_type, neg.draft_articles || [])) {
        alert('Cannot approve: missing required articles.');
        return;
    }
    if (!confirm('Approve this trade agreement? Once both sides approve, ratification bills will be auto-generated in both parliaments.')) return;

    const weAreA = currentNation.id === neg.nation_a_id;
    const side = weAreA ? 'a' : 'b';
    const myRole = (neg.participants || []).find(p => p.faction_id === currentFaction.id)?.role || 'ambassador';

    const updateData = {
        ['approved_by_' + side]: currentFaction.id,
        ['approved_by_' + side + '_role']: myRole,
        ['approved_at_' + side + '_tick']: shardTick
    };

    const { error: approveErr } = await _supabase.from('trade_negotiations').update(updateData).eq('id', negotiationId);
    if (approveErr) { alert('Failed to approve: ' + approveErr.message); return; }

    const otherApproved = weAreA ? neg.approved_by_b : neg.approved_by_a;
    alert(otherApproved
        ? 'Both sides have approved! Click "Send to Parliament" to submit ratification bills.'
        : 'You have approved the agreement. Waiting for the other side to approve.');
    await openTradeNegotiation(negotiationId);
}

async function sendTradeToParliament(negotiationId) {
    const neg = await fetchNegotiation(negotiationId);
    if (!neg) return;
    if (neg.status === 'ratification') { alert('Already sent to parliament.'); return; }
    if (!neg.approved_by_a || !neg.approved_by_b) { alert('Both sides must approve before sending to parliament.'); return; }
    if (!confirm('Send this agreement to both parliaments for ratification? Each parliament will vote independently.')) return;

    const [{ data: nationA }, { data: nationB }] = await Promise.all([
        _supabase.from('nations').select('name').eq('id', neg.nation_a_id).single(),
        _supabase.from('nations').select('name').eq('id', neg.nation_b_id).single()
    ]);
    const nameA = nationA?.name || 'Unknown';
    const nameB = nationB?.name || 'Unknown';
    const typeLabel = TRADE_AGREEMENT_TYPES[neg.agreement_type]?.label || 'Trade Agreement';
    const agreementName = neg.agreement_name || 'Unnamed Agreement';

    const billTitle = 'Ratify: ' + (neg.agreement_name || typeLabel);
    const billPreamble = 'Ratification of the ' + typeLabel + ' "' + agreementName + '" between ' +
        nameA + ' and ' + nameB + '. This agreement was negotiated by diplomatic representatives of both nations. ' +
        'A YES vote enacts the agreement; a NO vote rejects it.';

    const billBase = {
        bill_type: 'ratification', bill_name: billTitle, preamble: billPreamble,
        trade_negotiation_id: negotiationId, status: 'floor',
        proposed_tick: shardTick, floor_tick: shardTick,
        voting_ends_tick: shardTick + GAME_CONFIG.VOTING_WINDOW_TICKS
    };

    const billA = { ...billBase, nation_id: neg.nation_a_id, proposed_by: neg.approved_by_a };
    const billB = { ...billBase, nation_id: neg.nation_b_id, proposed_by: neg.approved_by_b };

    const [resultA, resultB] = await Promise.all([
        _supabase.from('bills').insert(billA).select('id').single(),
        _supabase.from('bills').insert(billB).select('id').single()
    ]);

    if (resultA.error) { alert('Error creating ratification bill: ' + resultA.error.message); return; }
    if (resultB.error) { alert('Error creating ratification bill: ' + resultB.error.message); return; }

    const { error: updateErr } = await _supabase.from('trade_negotiations').update({
        status: 'ratification',
        bill_a_id: resultA.data?.id || null,
        bill_b_id: resultB.data?.id || null
    }).eq('id', negotiationId);
    if (updateErr) { alert('Failed to update negotiation: ' + updateErr.message); return; }

    _supabase.from('event_log').insert([neg.nation_a_id, neg.nation_b_id].map(nid => ({
        nation_id: nid,
        event_name: (neg.agreement_name || typeLabel) + ' — Ratification',
        category: 'Diplomatic',
        description_chosen: 'The ' + typeLabel + ' "' + (neg.agreement_name || 'Unnamed') + '" between ' + nameA + ' and ' + nameB + ' has been sent to both parliaments for ratification.',
        fired_at_tick: shardTick
    }))).then(() => {});

    alert('Ratification bills submitted to both parliaments!');
    await openTradeNegotiation(negotiationId);
}

function updateSupplyWarning(val) {
    // Rebuild the pct display preserving the hint span
    const display = document.getElementById('supply-pct-display');
    if (display) {
        const hint = document.getElementById('supply-volume-hint');
        display.textContent = val + '% ';
        if (hint) display.appendChild(hint);
    }
    const warn = document.getElementById('supply-warning');
    if (!warn) return;
    const v = parseInt(val);
    if (v <= 30) {
        warn.className = 'trade-info-box info';
        warn.textContent = 'At ' + v + '%, low dependency. Flexible. Partner may reject as too low.';
    } else if (v <= 60) {
        warn.className = 'trade-info-box warning';
        warn.textContent = 'At ' + v + '%, moderate dependency. Balanced. Standard range.';
    } else {
        warn.className = 'trade-info-box danger';
        warn.textContent = 'At ' + v + '%, high dependency. Partner has significant leverage. Better price, bigger risk.';
    }
    updateSupplyVolumeHint();
}

function updateSupplyVolumeHint() {
    const hint = document.getElementById('supply-volume-hint');
    if (!hint) return;
    const sector = document.getElementById('supply-sector')?.value;
    const dir = document.querySelector('input[name="supply-dir"]:checked')?.value || 'we_buy';
    const pct = parseInt(document.getElementById('supply-pct')?.value || '60');
    if (!sector || !currentNation) { hint.textContent = ''; return; }
    var baseVal;
    if (isFoodSubsector(sector)) {
        var foodSub = FOOD_SUBSECTOR_MAP[sector];
        if (!foodSub) { hint.textContent = ''; return; }
        baseVal = dir === 'we_sell'
            ? calculateFoodExportCapacity(currentNation, foodSub, DEFAULT_FOOD_ALLOCATION)
            : calculateFoodImportDemand(currentNation, foodSub, DEFAULT_FOOD_ALLOCATION);
    } else {
        const sectorDef = TRADE_SECTOR_MAP[sector];
        if (!sectorDef) { hint.textContent = ''; return; }
        baseVal = dir === 'we_sell'
            ? calculateExportCapacity(currentNation, sectorDef)
            : calculateImportDemand(currentNation, sectorDef);
    }
    const committedVal = baseVal * pct / 100;
    const unitStr = formatSectorVolume(committedVal, sector);
    hint.textContent = unitStr ? '\u2248\u00a0' + unitStr : '';
}
