function ipoSelectField(label, artIdx, key, options, current) {
    const opts = options.map(o =>
        `<option value="${o.value}" ${o.value == current ? 'selected' : ''}>${o.label}</option>`
    ).join('');
    return `

}

function ipoToggleField(label, artIdx, key, isOn) {

            <label style="margin-bottom:0;flex:1;">${label}</label>
            <button class="ipo-toggle-btn ${isOn ? 'is-on' : ''}"

// ── Field setters ──

// Returns whichever articles array is currently being edited (create or amend)
function ipoActiveArticles() {
    return ipoAmendArticles || ipoCreateArticles;
}

function ipoReRenderActiveEditor() {
    if (ipoAmendArticles) renderIPOAmendStep();
    else renderIPOCreateStep();
}

function ipoSetArticleField(artIdx, key, value) {
    const art = ipoActiveArticles()[artIdx];
    if (!art) return;
    // Handle nested keys like 'solidarityFund.contributionPerQuarter'
    const parts = key.split('.');
    let target = art.config;
    for (let i = 0; i < parts.length - 1; i++) {
        if (!target[parts[i]]) target[parts[i]] = {};
        target = target[parts[i]];
    }
    // Try to convert to number
    const numVal = Number(value);
    target[parts[parts.length - 1]] = isNaN(numVal) ? value : numVal;
    ipoReRenderActiveEditor();
}

function ipoToggleArticleField(artIdx, key) {
    const art = ipoActiveArticles()[artIdx];
    if (!art) return;

    // Special handling for complex toggle fields
    if (key === 'ideologicalThreshold.enabled') {
        if (!art.config.ideologicalThreshold) art.config.ideologicalThreshold = { enabled: false, directions: [] };
        art.config.ideologicalThreshold.enabled = !art.config.ideologicalThreshold.enabled;
    } else if (key === 'expulsionClauseEnabled') {
        art.config.expulsionClause = art.config.expulsionClause ? null : 'majority';
    } else if (key === 'vetoRightEnabled') {
        art.config.vetoRight = art.config.vetoRight ? null : 'president';
    } else if (key === 'resourceSharingCapEnabled') {
        art.config.resourceSharingCap = art.config.resourceSharingCap != null ? null : 2;
    } else if (key === 'headquartersEnabled') {
        art.config.headquarters = art.config.headquarters != null ? null : '__self__';
    } else if (key === 'solidarityFund.enabled') {
        if (!art.config.solidarityFund) art.config.solidarityFund = { enabled: false, contributionPerQuarter: 1 };
        art.config.solidarityFund.enabled = !art.config.solidarityFund.enabled;
    } else {
        // Simple boolean toggle
        const parts = key.split('.');
        let target = art.config;
        for (let i = 0; i < parts.length - 1; i++) {
            if (!target[parts[i]]) target[parts[i]] = {};
            target = target[parts[i]];
        }
        target[parts[parts.length - 1]] = !target[parts[parts.length - 1]];
    }
    ipoReRenderActiveEditor();
}

function ipoToggleIdeology(artIdx, direction, checked) {
    const art = ipoActiveArticles()[artIdx];
    if (!art) return;
    const thresh = art.config.ideologicalThreshold;
    if (!thresh) return;
    if (checked) {
        if (!thresh.directions.includes(direction)) thresh.directions.push(direction);
    } else {
        thresh.directions = thresh.directions.filter(d => d !== direction);
    }
    ipoReRenderActiveEditor();
}

function renderIPOCreateStep3() {
    const baseCash = 4 * IPO_AP_TO_CASH;

    const extraCash = extraArticles * IPO_AP_TO_CASH;

        const typeDef = IPO_ARTICLE_TYPES.find(t => t.key === art.type);
        return `<div class="ipo-confirm-article">
            <span class="ipo-confirm-article-label">${typeDef?.label || art.type}</span>
            <span class="ipo-confirm-article-detail">${getArticleSummary(art)}</span>
        </div>`;
    }).join('');

    return `
        <div class="ipo-confirm-preview">
            <div class="ipo-confirm-identity">
                ${ipoCreateLogoPreviewUrl
                    ? `<img src="${ipoCreateLogoPreviewUrl}" class="ipo-header-logo ipo-logo-img" alt="" />`
                    : `<span class="ipo-header-logo">${escapeHtml(ipoCreateLogoSymbol)} ${escapeHtml(ipoCreateLogoText)}</span>`}
                <div>
                    <div style="font-family:var(--font-sans);font-size:13px;font-weight:700;color:#e2d9b4;">${escapeHtml(ipoCreateName)}</div>
                    ${ipoCreateDesc ? `<div style="font-family:var(--font-sans);font-size:10px;color:#6b6a5e;margin-top:2px;">${escapeHtml(ipoCreateDesc)}</div>` : ''}
                </div>
            </div>

            <div class="ipo-confirm-cost">
                <div class="ipo-confirm-cost-row">
                    <span>Base cost</span><span>${fmtIPOCash(baseCash)}</span>
                </div>
                ${extraArticles > 0 ? `<div class="ipo-confirm-cost-row">
                    <span>Extra articles (${extraArticles})</span><span>${fmtIPOCash(extraCash)}</span>
                </div>` : ''}
                <div class="ipo-confirm-cost-row ipo-confirm-cost-total">
                    <span>Total</span><span>${fmtIPOCash(totalCash)}</span>
                </div>
            </div>
        </div>
        <div class="wizard-nav">
            <button class="wizard-back-btn" onclick="ipoSetCreateStep(2)">Back</button>
            <button class="ipo-btn ipo-btn--create-large" onclick="submitIPOCreation()">
                Create Organisation — ${fmtIPOCash(totalCash)}
            </button>

function getArticleSummary(art) {
    const c = art.config;
    switch (art.type) {
        case 'mission': return escapeHtml((c.text || '').substring(0, 80)) + ((c.text||'').length > 80 ? '...' : '');
        case 'leadership': {
            const labels = { rotation: 'Rotation', most_seats: 'Most Seats', random: 'Random' };
            return `${labels[c.type] || c.type} · ${c.termYears}yr · ${c.votingWeight === 'equal' ? 'Equal' : 'Seat Share'} · ${c.votePass === 'unanimous' ? 'Unanimous' : 'Majority'}`;
        }
        case 'membership': {
            const parts = [c.admission === 'vote' ? 'Vote admission' : 'President admits'];
            if (c.ideologicalThreshold?.enabled && c.ideologicalThreshold.directions?.length)
                parts.push('Ideology: ' + c.ideologicalThreshold.directions.join(', '));
            if (c.expulsionClause) parts.push('Expulsion: ' + c.expulsionClause);
            return parts.join(' · ');
        }
        case 'governance': {
            const parts = [c.voteTransparency === 'public' ? 'Public ballot' : 'Secret ballot'];
            if (c.observerStatus) parts.push('Observers');
            if (c.vetoRight) parts.push('Veto: ' + c.vetoRight);
            if (c.emergencyPowers) parts.push('Emergency powers');
            return parts.join(' · ');
        }
        case 'resources': {
            const parts = [];
            if (c.solidarityFund?.enabled) parts.push('Fund: ' + fmtIPOCash((Number(c.solidarityFund.contributionPerQuarter) || 1) * IPO_AP_TO_CASH) + '/qtr');
            if (c.resourceSharingCap != null) parts.push('Cap: ' + c.resourceSharingCap + '/term');
            parts.push('Statements: ' + (c.jointStatementClause === 'president' ? 'President' : 'Vote'));
            if (c.headquarters != null) parts.push('HQ enabled');
            return parts.join(' · ');
        }
        default: return '';
    }
}

// ── Submit creation ──
async function submitIPOCreation() {
    if (!currentFaction || !currentNation) return;
    if (_ipoActionLock) return;
    _ipoActionLock = true;

    const cashCost = (4 + Math.max(0, ipoCreateArticles.length - 1)) * IPO_AP_TO_CASH;

    // Build charter JSONB
    const charter = {};
    for (const art of ipoCreateArticles) {
        switch (art.type) {
            case 'mission':
                charter.mission = art.config.text || '';
                break;
            case 'leadership':
                charter.leadership = {
                    type: art.config.type,
                    termYears: Number(art.config.termYears),
                    votingWeight: art.config.votingWeight,
                    votePass: art.config.votePass
                };
                break;
            case 'membership':
                charter.membership = {
                    admission: art.config.admission,
                    ideologicalThreshold: art.config.ideologicalThreshold || { enabled: false, directions: [] },
                    expulsionClause: art.config.expulsionClause || null
                };
                break;
            case 'governance':
                charter.governance = {
                    voteTransparency: art.config.voteTransparency,
                    observerStatus: !!art.config.observerStatus,
                    vetoRight: art.config.vetoRight || null,
                    emergencyPowers: !!art.config.emergencyPowers
                };
                break;
            case 'resources':
                charter.resources = {
                    solidarityFund: art.config.solidarityFund || { enabled: false, contributionPerQuarter: 1 },
                    resourceSharingCap: art.config.resourceSharingCap ?? null,
                    jointStatementClause: art.config.jointStatementClause || 'vote',
                    headquarters: art.config.headquarters === '__self__' ? currentNation.id : (art.config.headquarters || null)
                };
                break;
        }
    }

    // Set defaults for articles not added
    if (!charter.leadership) charter.leadership = { type: 'rotation', termYears: 2, votingWeight: 'equal', votePass: 'majority' };
    if (!charter.membership) charter.membership = { admission: 'vote', ideologicalThreshold: { enabled: false, directions: [] }, expulsionClause: null };
    if (!charter.governance) charter.governance = { voteTransparency: 'public', observerStatus: false, vetoRight: null, emergencyPowers: false };
    if (!charter.resources) charter.resources = { solidarityFund: { enabled: false, contributionPerQuarter: 1 }, resourceSharingCap: null, jointStatementClause: 'vote', headquarters: null };

    try {
        // Upload custom logo image BEFORE deducting AP (failable, no side effects to undo)
        let logoImageUrl = null;
        if (ipoCreateLogoFile) {
            const ext = ipoCreateLogoFile.name.split('.').pop() || 'png';
            const filePath = `ipo-logos/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
            const { error: uploadErr } = await _supabase.storage
                .from('public-assets')
                .upload(filePath, ipoCreateLogoFile, { contentType: ipoCreateLogoFile.type, upsert: true });
            if (uploadErr) {
                console.error('[IPO] Logo upload failed:', uploadErr.message);
                alert('Logo upload failed: ' + uploadErr.message);
                return;
            }
            const { data: urlData } = _supabase.storage.from('public-assets').getPublicUrl(filePath);
            logoImageUrl = urlData?.publicUrl || null;
        }

        // Deduct cash (after logo upload succeeds, before org creation)
        const cashResult = await deductIPOCash(currentFaction.id, cashCost);
        if (!cashResult.success) {
            alert('Insufficient cash. You need ' + fmtIPOCash(cashCost) + ' to create this organisation.');
            return;
        }
        currentFaction.party_funds = cashResult.newFunds;

        // Create org
        const { data: newOrg, error: orgErr } = await _supabase
            .from('international_orgs')
            .insert({
                name: ipoCreateName.trim(),
                description: ipoCreateDesc.trim() || null,
                logo_symbol: ipoCreateLogoSymbol,
                logo_text: ipoCreateLogoText.trim().toUpperCase(),
                logo_image_url: logoImageUrl,
                founded_at_tick: shardTick,
                founding_party_id: currentFaction.id,
                president_id: currentFaction.id,
                president_term_start_tick: shardTick,
                headquarters_nation_id: charter.resources.headquarters,
                solidarity_fund_balance: 0,
                charter: charter
            })
            .select('id')
            .single();

        if (orgErr) {
            console.error('[IPO] Create org error:', orgErr);
            // Refund cash since org creation failed. Fresh read avoids clobbering
            // any concurrent cash updates that landed between deduction and refund.
            const { data: fresh } = await _supabase
                .from('factions').select('party_funds').eq('id', currentFaction.id).single();
            const refunded = (Number(fresh?.party_funds) || 0) + cashCost;
            const { error: refundErr } = await _supabase
                .from('factions').update({ party_funds: refunded }).eq('id', currentFaction.id);
            if (refundErr) console.error('[IPO] Refund failed (manual reconciliation may be needed):', refundErr);
            currentFaction.party_funds = refunded;
            alert('Failed to create organisation: ' + orgErr.message);
            return;
        }

        // Add founding member (critical — org is broken without this)
        const chatColor = IPO_CHAT_COLORS[0];
        const { error: memberErr } = await _supabase.from('ipo_members').insert({
            org_id: newOrg.id,
            faction_id: currentFaction.id,
            role: 'member',
            joined_at_tick: shardTick,
            chat_color: chatColor
        });
        if (memberErr) {
            console.error('[IPO] Failed to add founding member:', memberErr.message);
        }

        // System chat message
        await _supabase.from('ipo_chat').insert({
            org_id: newOrg.id,
            faction_id: null,
            is_system: true,
            message_text: `${escapeHtml(ipoCreateName.trim())} has been founded by ${currentFaction.faction_name}.`,
            tick_posted: shardTick
        });

        // ── News event ──
        // One row per affected nation; category='political' so it lands in the
        // Politics tab. trigger_key is set so the world-events feed picks it up
        // (so the same row also reads as Political | World).
        const orgName = ipoCreateName.trim();
        const founderNationName = currentNation.name || 'their nation';
        let hqNationName = founderNationName;
        if (charter.resources.headquarters && charter.resources.headquarters !== currentNation.id) {
            try {
                const { data: hqNation } = await _supabase
                    .from('nations').select('name').eq('id', charter.resources.headquarters).maybeSingle();
                if (hqNation?.name) hqNationName = hqNation.name;
            } catch (_) { /* fall back to founder */ }
        }
        const eventName = `${currentFaction.faction_name} founds ${orgName}`;
        const description = `The ${currentFaction.faction_name} of ${founderNationName} has created the ${orgName}, headquartered in ${hqNationName}.`;
        const effects = {
            org_name: orgName,
            party: currentFaction.faction_name,
            founder_nation: founderNationName,
            hq_nation: hqNationName
        };

        // Founding nation entry
        await _supabase.from('event_log').insert({
            nation_id: currentNation.id,
            event_name: eventName,
            description_chosen: description,
            trigger_key: 'ipo_founded',
            category: 'political',
            effects_applied: effects,
            fired_at_tick: shardTick
        });

        // HQ-nation entry (only if HQ is in a different nation than the founder).
        // Same description so the HQ nation's local news mentions the new org too.
        if (charter.resources.headquarters && charter.resources.headquarters !== currentNation.id) {
            await _supabase.from('event_log').insert({
                nation_id: charter.resources.headquarters,
                event_name: eventName,
                description_chosen: description,
                trigger_key: 'ipo_founded',
                category: 'political',
                effects_applied: effects,
                fired_at_tick: shardTick
            });
        }

        closeIPOCreationModal();
        ipoSelectedOrgId = newOrg.id;
        renderIPOView();
    } catch (e) {
        console.error('[IPO] Creation error:', e);
        alert('Failed to create organisation.');
    } finally {
        _ipoActionLock = false;
    }
}

let _activeNegModal = null;
let _negChatChannel = null;

// Priority: Minister of Trade > PM

async function resolveNegotiationChatRole(partnerNationId) {
    const faction = _worldState?.faction;
    const nation = _worldState?.nation;
    if (!faction || !nation) return { canChat: false, role: null, displayName: null };

    // Check Minister of Trade
    const { data: motEntry } = await _supabase.from('ministries')
        .select('minister_first_name, minister_last_name')
        .eq('nation_id', nation.id)
        .eq('ministry_key', 'trade')
        .eq('party_id', faction.id)
        .eq('is_active', true)
        .maybeSingle();

    if (motEntry) {
        const name = ((motEntry.minister_first_name || '') + ' ' + (motEntry.minister_last_name || '')).trim() || 'Minister';
        return { canChat: true, role: 'trade_minister', displayName: name + ' (Minister of Trade)' };
    }

    // Check PM / Head of Government
    const coalition = await fetchActiveCoalition(_supabase, nation.id);
    let isPM = false;
    if (isGovernmentPresidential(nation)) {
        isPM = coalition?.lead_party_id === faction.id;
    } else {
        const alloc = coalition?.ministry_allocations || {};
        isPM = alloc.prime_minister === faction.id;
    }

    if (isPM) {
        const name = ((nation.head_of_state_first_name || '') + ' ' + (nation.head_of_state_last_name || '')).trim() || 'PM';
        return { canChat: true, role: 'prime_minister', displayName: name + ' (PM)' };
    }

    return { canChat: false, role: null, displayName: null };
}

let _negModalOpening = false;

async function openTradeNegModal(partnerNationId) {
    if (_negModalOpening) return;
    if (_activeNegModal) closeTradeNegModal();
    _negModalOpening = true;

    try {
    const myNation = _worldState?.nation;
    if (!myNation) { alert('Nation data not loaded.'); return; }
    const partner = (_worldAllNations || []).find(n => n.id === partnerNationId);
    if (!partner) { alert('Partner nation not found.'); return; }

    // Check or create a trade_negotiations row
    const a = myNation.id < partnerNationId ? myNation.id : partnerNationId;
    const b = myNation.id < partnerNationId ? partnerNationId : myNation.id;

    // Include 'ratification' so re-opening the modal after Send to Parliament
    // surfaces the existing articles in read-only mode instead of spawning a
    // fresh empty negotiation row.
    let { data: neg, error: negErr } = await _supabase.from('trade_negotiations')
        .select('id, status, draft_articles, approved_by_a, approved_by_b, nation_a_id, nation_b_id, agreement_type, agreement_name')
        .eq('nation_a_id', a).eq('nation_b_id', b)
        .in('status', ['open', 'active', 'ratification'])
        .order('created_at', { ascending: false })
        .limit(1)
        .maybeSingle();

    if (negErr) { alert('Failed to load negotiations: ' + negErr.message); return; }

    if (!neg) {
        const { data: shardData } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
        const tick = shardData?.current_tick || 0;
        const { data: created, error: createErr } = await _supabase.from('trade_negotiations').insert({
            nation_a_id: a,
            nation_b_id: b,
            status: 'open',
            agreement_type: 'fta',
            agreement_name: myNation.name + '-' + partner.name + ' Trade Agreement',
            opened_at_tick: tick,
            expires_at_tick: tick + 48,
        }).select('id, status, draft_articles, approved_by_a, approved_by_b, nation_a_id, nation_b_id, agreement_type, agreement_name').single();
        if (createErr) { alert('Failed to start negotiation: ' + createErr.message); return; }
        neg = created;

        // Fire event: trade negotiations begun
        const eventText = 'Trade Minister of ' + myNation.name + ' has begun trade negotiations with the nation of ' + partner.name + '.';
        _supabase.from('event_log').insert([myNation.id, partnerNationId].map(nid => ({
            nation_id: nid,
            event_name: 'Trade Negotiations Opened',
            trigger_key: 'trade_negotiation_opened',
            category: 'trade',
            description_chosen: eventText,
            fired_at_tick: tick,
        }))).then(() => {});
    }

    // Resolve chat role
    const chatRole = await resolveNegotiationChatRole(partnerNationId);

    const myFlag = myNation.flag_url || `assets/flags/${myNation.name}.png`;
    const partnerFlag = partner.flag_url || `assets/flags/${partner.name}.png`;

    const weAreA = neg.nation_a_id === myNation.id;

    // Mark the negotiation as seen by this nation so the AGREEMENTS
    // panel's red unread dot clears. Optimistic local clear first; the
    // RPC persists the timestamp so the dot stays cleared on next load.
    if (_tradeNegUnreadById[neg.id]) {
        delete _tradeNegUnreadById[neg.id];
    }
    _supabase.rpc('mark_trade_negotiation_seen', { p_neg_id: neg.id })
        .then(({ error }) => {
            if (error) console.warn('[trade-neg] mark_seen failed:', error.message);
        });

    _activeNegModal = {
        negotiationId: neg.id,
        myNationId: myNation.id,
        partnerNationId: partnerNationId,
        myNationName: myNation.name,
        partnerNationName: partner.name,
        myFlag,
        partnerFlag,
        status: neg.status,
        chatRole,
        articles: neg.draft_articles || [],
        weAreA,
        agreementType: neg.agreement_type,
        agreementName: neg.agreement_name,
        approvedByA: neg.approved_by_a,
        approvedByB: neg.approved_by_b,
    };

    // Render header
    const header = document.getElementById('trade-neg-header');
    header.innerHTML = `
        <div class="trade-neg-header__nations">
            <div class="trade-neg-header__nation">
                <img src="${escapeHtml(myFlag)}" alt="" class="trade-neg-header__flag" onerror="this.style.display='none'">
                <span class="trade-neg-header__name">${escapeHtml(myNation.name)}</span>
            </div>
            <div class="trade-neg-header__title" id="trade-neg-title-text">${escapeHtml(neg.agreement_name || (myNation.name + '-' + partner.name + ' Trade Agreement'))}</div>
            <div class="trade-neg-header__nation">
                <span class="trade-neg-header__name">${escapeHtml(partner.name)}</span>
                <img src="${escapeHtml(partnerFlag)}" alt="" class="trade-neg-header__flag" onerror="this.style.display='none'">
            </div>
        </div>
        <span class="trade-neg-header__close" onclick="closeTradeNegModal()">&times;</span>
    `;

    document.getElementById('trade-neg-modal').classList.add('active');

    // Configure chat input based on role
    const inputBar = document.getElementById('trade-neg-chat-input-bar');
    const chatMessages = document.getElementById('trade-neg-chat-messages');

    if (chatRole.canChat) {
        inputBar.style.display = 'flex';
        inputBar.innerHTML = `
            <input type="text" id="trade-neg-chat-input" placeholder="Chatting as ${escapeHtml(chatRole.displayName)}..." maxlength="2000">
            <button id="trade-neg-chat-send" disabled>Send</button>
        `;
        // Wire input events
        const input = document.getElementById('trade-neg-chat-input');
        const sendBtn = document.getElementById('trade-neg-chat-send');
        input.addEventListener('input', () => { sendBtn.disabled = !input.value.trim(); });
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey && input.value.trim()) {
                e.preventDefault();
                negChatSend();
            }
        });
        sendBtn.addEventListener('click', () => negChatSend());
    } else {
        inputBar.style.display = 'none';
    }

    // Render articles in main panel + economy side panels + agreement button
    negArticlesRender();
    negEconomyRender();
    negAgreementRender();

    // Update Name Agreement button state
    const nameBtn = document.getElementById('trade-neg-name-btn');
    if (nameBtn && _activeNegModal.agreementName && _activeNegModal.agreementName.trim()) {
        nameBtn.style.borderColor = 'var(--green)';
        nameBtn.style.color = 'var(--green)';
        nameBtn.textContent = 'Rename Agreement';
    }

    // Load existing messages + start realtime
    await negChatLoad(neg.id);
    negChatSubscribe(neg.id);

    } catch (err) {
        alert('Trade negotiation error: ' + (err.message || err));
    } finally {
        _negModalOpening = false;
    }
}

// ── Chat: Render a single message ──

function negChatRenderMsg(msg) {
    const factionId = _worldState?.faction?.id;
    if (msg.is_system) {
        return `<div class="trade-neg-msg trade-neg-msg--system">${escapeHtml(msg.message_text)}</div>`;
    }
    const isMine = msg.sender_faction_id === factionId;
    const cls = isMine ? 'trade-neg-msg trade-neg-msg--sent' : 'trade-neg-msg trade-neg-msg--received';
    const senderHtml = !isMine
        ? `<div class="trade-neg-msg__sender">${escapeHtml(msg.sender_display_name)}</div>`
        : '';
    const time = msg.created_at ? new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
    return `<div class="${cls}">
        ${senderHtml}
        <div>${escapeHtml(msg.message_text)}</div>
        <div class="trade-neg-msg__time">${time}</div>
    </div>`;
}

// ── Chat: Load existing messages ──

async function negChatLoad(negotiationId) {
    const container = document.getElementById('trade-neg-chat-messages');
    if (!container) return;

    const { data: messages, error } = await _supabase
        .from('negotiation_messages')
        .select('*')
        .eq('negotiation_id', negotiationId)
        .order('created_at', { ascending: true })
        .limit(200);

    if (error) {
        container.innerHTML = '<div style="padding:20px;text-align:center;color:#c55;font-family:var(--font-mono);font-size:10px;">Failed to load messages.</div>';
        return;
    }

    if (!messages || messages.length === 0) {
        const canChat = _activeNegModal?.chatRole?.canChat;
        const partnerName = _activeNegModal?.partnerNationName || 'the partner nation';
        container.innerHTML = canChat
            ? '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-dim);font-family:var(--font-mono);font-size:10px;">No messages yet. Start the conversation.</div>'
            : `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;padding:20px;">
                <div style="color:var(--text-dim);font-family:var(--font-mono);font-size:10px;text-align:center;">No messages yet.</div>
                <div style="color:var(--text-ghost);font-family:var(--font-mono);font-size:9px;text-align:center;line-height:1.5;max-width:220px;">
                    You need to hold the position of PM or Minister of Trade to participate in this chat.
                </div>
            </div>`;
        return;
    }

    container.innerHTML = messages.map(m => negChatRenderMsg(m)).join('');
    container.scrollTop = container.scrollHeight;
}

// ── Chat: Send a message ──

let _negChatSending = false;

async function negChatSend() {
    if (_negChatSending || !_activeNegModal?.chatRole?.canChat) return;
    const input = document.getElementById('trade-neg-chat-input');
    const sendBtn = document.getElementById('trade-neg-chat-send');
    if (!input) return;
    const text = input.value.trim();
    if (!text) return;

    _negChatSending = true;
    if (sendBtn) sendBtn.disabled = true;
    input.value = '';

    const { data: shardData } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    const tick = shardData?.current_tick || 0;

    const msgRow = {
        negotiation_id: _activeNegModal.negotiationId,
        sender_nation_id: _activeNegModal.myNationId,
        sender_faction_id: _worldState.faction.id,
        sender_role: _activeNegModal.chatRole.role,
        sender_display_name: _activeNegModal.chatRole.displayName,
        message_text: text,
        is_system: false,
        sent_at_tick: tick,
    };

    const { error } = await _supabase.from('negotiation_messages').insert(msgRow);

    if (error) {
        input.value = text;
        alert('Failed to send: ' + error.message);
    } else {
        // Optimistic render
        const container = document.getElementById('trade-neg-chat-messages');
        if (container) {
            const empty = container.querySelector('[style*="justify-content:center"]');
            if (empty && !container.querySelector('.trade-neg-msg')) empty.remove();
            container.insertAdjacentHTML('beforeend', negChatRenderMsg({
                ...msgRow,
                created_at: new Date().toISOString(),
            }));
            container.scrollTop = container.scrollHeight;
        }
    }

    _negChatSending = false;
    if (sendBtn) sendBtn.disabled = !input.value.trim();
    input.focus();
}

// ── Chat: Realtime subscription ──

function negChatSubscribe(negotiationId) {
    if (_negChatChannel) {
        _supabase.removeChannel(_negChatChannel);
        _negChatChannel = null;
    }

    _negChatChannel = _supabase
        .channel('neg-chat-' + negotiationId)
        .on('postgres_changes', {
            event: 'INSERT',
            schema: 'public',
            table: 'negotiation_messages',
            filter: `negotiation_id=eq.${negotiationId}`,
        }, (payload) => {
            const msg = payload.new;
            if (!msg) return;
            // Skip own messages (already optimistically rendered)
            if (msg.sender_faction_id === _worldState?.faction?.id) return;

            const container = document.getElementById('trade-neg-chat-messages');
            if (!container) return;
            const empty = container.querySelector('[style*="justify-content:center"]');
            if (empty && !container.querySelector('.trade-neg-msg')) empty.remove();
            container.insertAdjacentHTML('beforeend', negChatRenderMsg(msg));
            container.scrollTop = container.scrollHeight;

            // If the other side withdrew, close the modal
            if (msg.is_system && msg.message_text?.includes('withdrawn')) {
                if (_activeNegModal) _activeNegModal.status = 'cancelled';
                setTimeout(() => {
                    closeTradeNegModal();
                    alert('The other party has withdrawn from negotiations.');
                    loadTradeAgreements().then(() => { renderTradeAgreements(); renderTradePartners(); }).catch(() => {});
                }, 500);
            }
        })
        .subscribe();
}

// ── Economy side panels (your flows + their surpluses/deficits) ──
//
// Reuses the Trade tab's already-loaded data:
//   _tradeFlows         — my nation's per-sector flows (production+demand)
//   _allNationFlows     — every nation's flows, used for partner surplus/deficit
// All numbers are monthly ($) so we append "/mo" affordances to the headers.

function negEconomyRender() {
    if (!_activeNegModal) return;
    const partnerId = _activeNegModal.partnerNationId;

    const myEl = document.getElementById('trade-neg-my-econ');
    if (myEl) myEl.innerHTML = _negRenderMyEconomyHtml();

    const theirEl = document.getElementById('trade-neg-their-econ');
    if (theirEl) theirEl.innerHTML = _negRenderTheirEconomyHtml(partnerId);
}

function _negRenderMyEconomyHtml() {
    // Same shared helpers the Trade tab uses, so the modal's Your Economy
    // panel matches the Trade page's commodity table exactly. Stat units
    // (small integers), not dollars — render as plain Math.round.
    //
    // Bal = prod − dem + trading. The trading term is the signed
    // import/export delta from MY active trade agreements (positive =
    // net importer, negative = net exporter). Critical for negotiation
    // UX: a surplus that's already committed to another partner isn't
    // available to offer here. Previously this panel ignored trading
    // entirely and showed a phantom surplus.
    const trading = getTradingVolumesByCommodity();
    const rows = _computeStatCommodities(_worldState?.nation)
        .map(c => ({ ...c, tradingDelta: Number(trading[c.key]) || 0 }))
        .sort((a, b) => {
            const balA = Math.abs(a.prod - a.dem + a.tradingDelta);
            const balB = Math.abs(b.prod - b.dem + b.tradingDelta);
            return balB - balA;
        });

    const fmt = (v) => Math.round(Number(v) || 0).toString();
    const fmtBal = (v) => {
        if (Math.abs(v) < 0.5) return '—';
        return (v > 0 ? '+' : '-') + Math.abs(Math.round(v));
    };

    let html = `<div class="trade-neg-econ__head">
        <span class="trade-neg-econ__head-dot"></span>Your Economy
    </div>
    <div class="trade-neg-econ__cols">
        <span>Commodity</span><span>Prod</span><span>Dem</span><span>Bal</span>
    </div>
    <div class="trade-neg-econ__list">`;
    if (rows.length === 0) {
        html += `<div class="trade-neg-econ__empty">No flow data yet.</div>`;
    } else {
        for (const r of rows) {
            const bal = r.prod - r.dem + r.tradingDelta;
            const bclass = bal > 0.5 ? 'trade-neg-econ__bal--pos'
                         : bal < -0.5 ? 'trade-neg-econ__bal--neg'
                         : 'trade-neg-econ__bal--neu';
            html += `<div class="trade-neg-econ__row">
                <div class="trade-neg-econ__name">
                    <span class="trade-neg-econ__glyph">${r.icon}</span>
                    <span>${escapeHtml(r.name)}</span>
                </div>
                <span class="trade-neg-econ__num">${fmt(r.prod)}</span>
                <span class="trade-neg-econ__num">${fmt(r.dem)}</span>
                <span class="trade-neg-econ__bal ${bclass}">${fmtBal(bal)}</span>
            </div>`;
        }
    }
    html += `</div>`;
    return html;
}

function _negRenderTheirEconomyHtml(partnerId) {
    // Partner's surpluses = they can offer. Deficits = they need.
    // Pulls partner's nation row from _worldAllNations (loaded with
    // select('*'), so all stat columns are present) and runs the same
    // stat-based commodity helper as the Trade tab + my-economy panel.
    // Match flags highlight commodities where their surplus aligns with
    // my deficit (or their deficit with my surplus) — quick visual cue
    // for "useful trade pairs".
    const partner = (_worldAllNations || []).find(n => n.id === partnerId);
    const partnerRows = _computeStatCommodities(partner);
    const myRows      = _computeStatCommodities(_worldState?.nation);
    const myDeficits  = new Set(myRows.filter(r => (r.dem - r.prod) > 0.5).map(r => r.key));
    const mySurpluses = new Set(myRows.filter(r => (r.prod - r.dem) > 0.5).map(r => r.key));

    const surpluses = [];
    const deficits  = [];
    for (const r of partnerRows) {
        const bal = r.prod - r.dem;
        const entry = { key: r.key, name: r.name, icon: r.icon, amount: Math.abs(bal) };
        if (bal > 0.5) surpluses.push(entry);
        else if (bal < -0.5) deficits.push(entry);
    }
    surpluses.sort((a, b) => b.amount - a.amount);
    deficits.sort((a, b) => b.amount - a.amount);

    const fmtStat = (v) => Math.round(Number(v) || 0).toString();
    const renderSection = (title, dotClass, items, matchSet) => {
        let h = `<div class="trade-neg-econ__section">
            <div class="trade-neg-econ__head ${dotClass}">
                <span class="trade-neg-econ__head-dot"></span>${title}
            </div>
            <div class="trade-neg-econ__list">`;
        if (items.length === 0) {
            h += `<div class="trade-neg-econ__empty">No data</div>`;
        } else {
            for (const it of items) {
                const match = matchSet.has(it.key);
                h += `<div class="trade-neg-econ__row--simple ${match ? 'trade-neg-econ__row--match' : ''}">
                    <div class="trade-neg-econ__name">
                        <span class="trade-neg-econ__glyph">${it.icon}</span>
                        <span>${escapeHtml(it.name)}${match ? '<span class="trade-neg-econ__match">match</span>' : ''}</span>
                    </div>
                    <span class="trade-neg-econ__val">${fmtStat(it.amount)}</span>
                </div>`;
            }
        }
        h += `</div></div>`;
        return h;
    };

    return renderSection('They Can Offer', 'trade-neg-econ__head--offer', surpluses, myDeficits)
         + renderSection('They Need',      'trade-neg-econ__head--need',  deficits,  mySurpluses);
}

// ── Articles: Render ──

function negArticlesRender() {
    const container = document.getElementById('trade-neg-articles');
    if (!container || !_activeNegModal) return;

    const articles = _activeNegModal.articles || [];
    const myNationId = _activeNegModal.myNationId;
    // Lock per-article actions (Delete / Request to Strike) once both parties
    // have approved or the negotiation has moved to ratification. Mirrors the
    // server-side lock in 20261005_trade_negotiation_lock_trigger.sql.
    const isLocked = _activeNegModal.status === 'ratification'
        || (!!_activeNegModal.approvedByA && !!_activeNegModal.approvedByB);

    if (articles.length === 0) {
        container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;min-height:200px;color:var(--text-dim);font-family:var(--font-mono);font-size:11px;">No articles yet. Click "Add Text Article" to begin drafting.</div>';
        return;
    }

    const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX'];

    let html = '';
    for (let i = 0; i < articles.length; i++) {
        const art = articles[i];
        const num = ROMAN[i] || (i + 1);
        const isMine = art.author_nation_id === myNationId;

        const hasStrike = !!art.strike_requested_by;
        const strikeIsMine = art.strike_requested_by === myNationId;

        const artContent = art.article_type
            ? negStructuredArticleSummary(art)
            : escapeHtml(art.text);
        const typeTag = art.article_type
            ? `<span style="font-family:var(--font-mono);font-size:7px;font-weight:700;letter-spacing:0.5px;padding:1px 5px;color:var(--accent);background:rgba(90,175,165,0.08);border:1px solid rgba(90,175,165,0.15);margin-left:6px;vertical-align:middle;">${escapeHtml(art.article_type.replace('_',' ').toUpperCase())}</span>`
            : '';

        // Demand context for trade_flow articles
        let demandCtxHtml = '';
        if (art.article_type === 'trade_flow' && art.data) {
            const d = art.data;
            // direction is author-relative (party A = article author); resolve via
            // art.author_nation_id so both viewers identify the same buyer.
            const authorIsMe = art.author_nation_id
                ? art.author_nation_id === _activeNegModal.myNationId
                : true;
            const partyAId = authorIsMe ? _activeNegModal.myNationId : _activeNegModal.partnerNationId;
            const partyBId = authorIsMe ? _activeNegModal.partnerNationId : _activeNegModal.myNationId;
            const partyAName = authorIsMe ? _activeNegModal.myNationName : _activeNegModal.partnerNationName;
            const partyBName = authorIsMe ? _activeNegModal.partnerNationName : _activeNegModal.myNationName;
            const buyerNationId = d.direction === 'a_buys_b' ? partyAId : partyBId;
            const buyerName = d.direction === 'a_buys_b' ? partyAName : partyBName;
            const isBuyerMe = buyerNationId === _activeNegModal.myNationId;

            if (isBuyerMe && _tradeFlows[d.commodity]) {
                const flow = _tradeFlows[d.commodity];
                // Local "remaining demand" = total import demand minus what's
                // already flowing in — i.e. the gap still needing coverage
                // from this negotiation. Previously mis-named `domesticDemand`;
                // that name now collides with the real trade_flows.domestic_demand
                // column (the gross domestic-consumption metric), so renamed
                // here for clarity.
                const totalImportDemand = Number(flow.import_demand || 0);
                const alreadyImporting = Number(flow.import_volume || 0);
                const remaining = Math.max(0, totalImportDemand - alreadyImporting);
                const tradeVol = Number(d.volume || 0);
                const overshoot = tradeVol > remaining;
                const color = overshoot ? 'var(--amber)' : 'var(--green)';
                demandCtxHtml = `<div style="font-family:var(--font-mono);font-size:9px;color:${color};margin-top:4px;">
                    ${escapeHtml(buyerName)}'s remaining demand: ${formatNegMoney(remaining)}/tick
                    ${remaining > 0 ? '(after domestic production and existing trade)' : '(fully supplied)'}
                </div>`;
            }
        }

        html += `<div class="trade-neg-article">
            <div class="trade-neg-article__num">Article ${num}.${typeTag}</div>
            <div class="trade-neg-article__text">${artContent}</div>
            ${demandCtxHtml}
            <div class="trade-neg-article__meta">
                <span>Added by ${escapeHtml(art.author_nation_name || 'Unknown')}</span>
                ${isLocked
                    ? ''
                    : (isMine
                        ? `<span class="trade-neg-article__action" onclick="negArticleDelete('${art.id}')">Delete</span>`
                        : (hasStrike && strikeIsMine
                            ? `<span style="font-family:var(--font-mono);font-size:8px;color:var(--amber);opacity:0.7;">Strike Requested</span>`
                            : (!hasStrike
                                ? `<span class="trade-neg-article__action" style="color:var(--amber);border-color:rgba(184,134,11,0.2);background:rgba(184,134,11,0.04);" onclick="negArticleRequestStrike('${art.id}')">Request to Strike</span>`
                                : '')))
                }
            </div>`;

        if (hasStrike && !strikeIsMine) {
            const requesterName = art.strike_requested_by_name || 'The other party';
            html += `<div class="trade-neg-article__strike">${escapeHtml(requesterName)} is requesting this article be removed.</div>`;
        }

        html += '</div>';
    }
    container.innerHTML = html;
}

// ── Structured Articles: Summary renderer ──

function negStructuredArticleSummary(art) {
    const d = art.data || {};
    // direction fields (a_buys_b, a_to_b, a_tariff_from, ...) are stored relative to
    // the article's AUTHOR: party A = whoever added the article. Resolve nameA/nameB
    // via art.author_nation_id so both viewers render the same labels. Legacy rows
    // without author_nation_id fall back to the viewer's perspective.
    const authorIsMe = art.author_nation_id
        ? art.author_nation_id === _activeNegModal?.myNationId
        : true;
    const nameA = authorIsMe
        ? (_activeNegModal?.myNationName || 'Nation A')
        : (_activeNegModal?.partnerNationName || 'Nation A');
    const nameB = authorIsMe
        ? (_activeNegModal?.partnerNationName || 'Nation B')
        : (_activeNegModal?.myNationName || 'Nation B');
    const sectorLabel = (k) => TRADEABLE_SECTOR_MAP[k]?.label || TRADE_SECTOR_LABELS[k] || k || 'Unknown';

    switch (art.article_type) {
        case 'transfer': {
            const dir = d.direction === 'a_to_b' ? (nameA + ' → ' + nameB) : (nameB + ' → ' + nameA);
            const typeLabel = d.transfer_type === 'recurring' ? 'Recurring' : 'One-Time';
            const interval = d.transfer_type === 'recurring' ? ' per tick' : '';
            return `${typeLabel} Transfer: $${formatNegMoney(d.amount)} ${dir}${interval}`;
        }
        case 'trade_flow': {
            const dir = d.direction === 'a_buys_b' ? (nameA + ' buys from ' + nameB) : (nameB + ' buys from ' + nameA);
            const durLabel = d.duration === 0 ? 'Continuous' : d.duration + ' ticks';
            const priorityLabel = d.delivery_priority
                ? ` · Delivery: ${d.delivery_priority.charAt(0).toUpperCase() + d.delivery_priority.slice(1)}`
                : '';
            // Volume is integer commodity units/tick (the spawn trigger
            // casts it to INT and renders it as "X units/tick" on the
            // shipping contract). Render it the same way here so the
            // article summary matches the engine's interpretation.
            const vol = Math.round(Number(d.volume) || 0).toLocaleString();
            return `${sectorLabel(d.commodity)}: ${dir}, ${vol} units/tick. Duration: ${durLabel}${priorityLabel}`;
        }
        case 'tariff_reduction': {
            const sec = sectorLabel(d.sector);
            const modeLabel = d.mode === 'reciprocal' ? 'Reciprocal' : 'One-sided';
            return `${sec} Tariff Reduction (${modeLabel}): ${nameA}→${nameB} ${d.a_tariff_from || '?'}% → ${d.a_tariff_to || '?'}%, ${nameB}→${nameA} ${d.b_tariff_from || '?'}% → ${d.b_tariff_to || '?'}%`;
        }
        case 'market_access': {
            const scopeLabel = d.scope === 'all_goods' ? 'All Goods' : sectorLabel(d.scope_sector);
            const levels = { restricted: 'Restricted', preferential: 'Preferential (reduced tariffs)', free_trade: 'Free Trade (0%)' };
            const extras = [];
            if (d.volume_priority) extras.push('Volume priority');
            if (d.price_priority) extras.push('Price priority');
            return `Market Access — ${scopeLabel}: ${levels[d.level] || d.level}${extras.length ? '. ' + extras.join(', ') : ''}`;
        }
        case 'exit_terms': {
            const parts = [];
            parts.push('Min duration: ' + (d.min_duration || 0) + ' ticks');
            parts.push('Exit notice: ' + (d.exit_notice || 0) + ' ticks');
            const penalties = { none: 'No penalty', fixed: 'Fixed $' + formatNegMoney(d.penalty_amount || 0), percentage: (d.penalty_pct || 0) + '% of remaining value' };
            parts.push(penalties[d.penalty_type] || 'No penalty');
            return `Exit Terms: ${parts.join(', ')}`;
        }
        default: return art.text || 'Unknown article type';
    }
}

function formatNegMoney(v) {
    const n = Number(v) || 0;
    if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(0) + 'k';
    return n.toLocaleString();
}

// Delivery preference is the BUYER's choice — they pay the freight.
// If the article author isn't on the buyer side, lock the picker to
// 'cheapest' (the default tiebreaker) and visually disable it so the
// seller can't pick the buyer's auction criterion. Re-evaluated when
// the direction selector changes.
function negFlowSyncPriorityLock() {
    const dirSel = document.getElementById('neg-flow-direction');
    const picker = document.getElementById('neg-flow-delivery-picker');
    const note   = document.getElementById('neg-flow-priority-note');
    if (!dirSel || !picker) return;
    const direction = dirSel.value || 'a_buys_b';
    // Direction is author-relative. a_buys_b ⇒ author IS the buyer.
    const authorIsBuyer = direction === 'a_buys_b';
    if (!authorIsBuyer) {
        negFlowSetPriority('cheapest');
    }
    picker.style.opacity      = authorIsBuyer ? '1'    : '0.45';
    picker.style.pointerEvents = authorIsBuyer ? 'auto' : 'none';
    if (note) {
        note.textContent = authorIsBuyer
            ? 'After ratification, every shipping corp can offer a route. The system auto-awards based on this preference (cheapest is also the universal tiebreaker).'
            : 'Locked — only the buyer chooses delivery preference (they pay the freight). Defaults to cheapest.';
    }
}
window.negFlowSyncPriorityLock = negFlowSyncPriorityLock;

// trade_flow article. Read by negStructuredArticleConfirm and persisted

let _negFlowDeliveryPriority = 'cheapest';
function negFlowSetPriority(priority) {
    if (!['fastest', 'safest', 'cheapest'].includes(priority)) return;
    _negFlowDeliveryPriority = priority;
    const picker = document.getElementById('neg-flow-delivery-picker');

        btn.style.color      = isActive ? '#000'                  : 'var(--text-dim)';
    }
}

// Fetch organic per-sector flows for the user and the partner. Cached on
// _activeNegModal._capacityFlows so the network round-trip happens at
// most once per open negotiation. Returns a promise resolving when the
// cache is populated (or the fetch silently fails — we degrade to no
// warnings rather than blocking the form).
async function negFlowFetchFlowsOnce() {
    if (!_activeNegModal) return;
    if (_activeNegModal._capacityFlows) return;
    const myId      = _activeNegModal.myNationId;
    const partnerId = _activeNegModal.partnerNationId;
    if (!myId || !partnerId) return;
    // Phase 10A: trade_flows table dropped. Capacity-warning overlay
    // is suppressed (empty map → negFlowEvaluateWarnings hides itself)
    // until the goods-trade rebuild lands.
    _activeNegModal._capacityFlows = { [myId]: {}, [partnerId]: {} };
}

// Evaluate buyer/seller capacity vs the user's contracted volume and
// render an inline warning. Reads form state directly so it can be
// wired to onchange/oninput on the inputs.
function negFlowEvaluateWarnings() {
    const wrap = document.getElementById('neg-flow-warnings');
    if (!wrap) return;
    const flowsMap = _activeNegModal?._capacityFlows;
    if (!flowsMap) { wrap.style.display = 'none'; return; }

    const commodity = document.getElementById('neg-flow-commodity')?.value || '';
    const direction = document.getElementById('neg-flow-direction')?.value || 'a_buys_b';
    const volume    = Number(document.getElementById('neg-flow-volume')?.value) || 0;
    if (!commodity || volume <= 0) { wrap.style.display = 'none'; return; }

    const myId      = _activeNegModal.myNationId;
    const partnerId = _activeNegModal.partnerNationId;
    // Direction is relative to the AUTHOR (= me). a_buys_b: I'm the buyer.
    const buyerId   = direction === 'a_buys_b' ? myId : partnerId;
    const sellerId  = direction === 'a_buys_b' ? partnerId : myId;
    const buyerName = (buyerId === myId  ? _activeNegModal.myNationName : _activeNegModal.partnerNationName) || 'Buyer';
    const sellerName= (sellerId === myId ? _activeNegModal.myNationName : _activeNegModal.partnerNationName) || 'Seller';

    const buyerFlow  = flowsMap[buyerId]?.[commodity];
    const sellerFlow = flowsMap[sellerId]?.[commodity];

    const fmtMoney = (n) => n >= 1e9 ? '$' + (n / 1e9).toFixed(1) + 'B' : n >= 1e6 ? '$' + (n / 1e6).toFixed(0) + 'M' : '$' + Math.round(n).toLocaleString();
    const messages = [];
    if (sellerFlow) {
        const cap = sellerFlow.export_capacity;
        if (volume > cap) {
            const shortfall = volume - cap;
            messages.push(`<strong>${escapeHtml(sellerName)}</strong> has ${fmtMoney(cap)}/tick organic export capacity for this commodity — short by ${fmtMoney(shortfall)}/tick. The contract will still fire (the engine treats the gap as off-the-books supply / re-export), but expect lower fulfillment if the seller's capacity drops further.`);
        }
    }
    if (buyerFlow) {
        const dem = buyerFlow.import_demand;
        if (dem === 0 && volume > 0) {
            messages.push(`<strong>${escapeHtml(buyerName)}</strong> has no organic demand for this commodity (already net-exporter or self-sufficient). The contract creates the demand — ${escapeHtml(buyerName)} will pay for ${fmtMoney(volume)}/tick they don't currently need.`);
        } else if (volume > dem * 5 && dem > 0) {
            messages.push(`<strong>${escapeHtml(buyerName)}</strong>'s organic demand for this commodity is only ${fmtMoney(dem)}/tick — your contract is ${(volume / dem).toFixed(1)}× that. The contract will fire but the buyer is committing to far more than their natural usage.`);
        }
    }
    if (messages.length === 0) { wrap.style.display = 'none'; return; }
    wrap.innerHTML = messages.map(m => '⚠ ' + m).join('<br><br>');
    wrap.style.display = 'block';
}

let _negStructuredAdding = false;

async function negStructuredArticleConfirm() {
    if (_negStructuredAdding || !_activeNegModal || !_negStructuredType) return;

    let data = {};

    if (_negStructuredType === 'transfer') {
        const amount = Number(document.getElementById('neg-transfer-amount')?.value || 0);
        if (amount <= 0) { alert('Enter a valid amount.'); return; }
        data = {
            transfer_type: document.getElementById('neg-transfer-type')?.value || 'one_time',
            amount: amount,
            direction: document.getElementById('neg-transfer-direction')?.value || 'a_to_b',
        };
    } else if (_negStructuredType === 'trade_flow') {
        const volume = Number(document.getElementById('neg-flow-volume')?.value || 0);
        if (volume <= 0) { alert('Enter a valid volume.'); return; }
        const direction = document.getElementById('neg-flow-direction')?.value || 'a_buys_b';
        // Delivery preference is the buyer's call (they pay the freight).
        // If the author is on the seller side, server-trust their picker
        // selection anyway — pin to cheapest. Mirrors the UI lock in
        // negFlowSyncPriorityLock so the data payload can't drift even
        // if the lock is bypassed via devtools.
        const authorIsBuyer = direction === 'a_buys_b';
        const requestedPriority = ['fastest', 'safest', 'cheapest'].includes(_negFlowDeliveryPriority)
            ? _negFlowDeliveryPriority
            : 'cheapest';
        const deliveryPriority = authorIsBuyer ? requestedPriority : 'cheapest';
        data = {
            commodity: document.getElementById('neg-flow-commodity')?.value || 'fuel_energy',
            direction: direction,
            volume: volume,
            duration: Number(document.getElementById('neg-flow-duration')?.value || 0),
            // Buyer-side preference that drives the auto-award. Written
            // into the article so it survives both sides' approval and
            // lands on the spawned shipping_contract.
            delivery_priority: deliveryPriority,
        };
    } else if (_negStructuredType === 'tariff_reduction') {
        const aFrom = Number(document.getElementById('neg-tariff-a-from')?.value);
        const aTo = Number(document.getElementById('neg-tariff-a-to')?.value);
        const bFrom = Number(document.getElementById('neg-tariff-b-from')?.value);
        const bTo = Number(document.getElementById('neg-tariff-b-to')?.value);
        if (isNaN(aFrom) || isNaN(aTo) || isNaN(bFrom) || isNaN(bTo)) { alert('Fill in all tariff values.'); return; }
        data = {
            sector: document.getElementById('neg-tariff-sector')?.value || 'fuel_energy',
            a_tariff_from: aFrom,
            a_tariff_to: aTo,
            b_tariff_from: bFrom,
            b_tariff_to: bTo,
            mode: document.getElementById('neg-tariff-mode')?.value || 'reciprocal',
        };
    } else if (_negStructuredType === 'market_access') {
        const scope = document.getElementById('neg-market-scope')?.value || 'all_goods';
        data = {
            scope: scope,
            scope_sector: scope === 'sector' ? (document.getElementById('neg-market-sector')?.value || 'fuel_energy') : null,
            level: document.getElementById('neg-market-level')?.value || 'preferential',
            volume_priority: document.getElementById('neg-market-volume-priority')?.checked || false,
            price_priority: document.getElementById('neg-market-price-priority')?.checked || false,
        };
    } else if (_negStructuredType === 'exit_terms') {
        const penaltyType = document.getElementById('neg-exit-penalty-type')?.value || 'none';
        data = {
            min_duration: Number(document.getElementById('neg-exit-min-duration')?.value || 12),
            exit_notice: Number(document.getElementById('neg-exit-notice')?.value || 3),
            penalty_type: penaltyType,
            penalty_amount: penaltyType === 'fixed' ? Number(document.getElementById('neg-exit-penalty-amount')?.value || 0) : 0,
            penalty_pct: penaltyType === 'percentage' ? Number(document.getElementById('neg-exit-penalty-pct')?.value || 0) : 0,
        };
    }

    _negStructuredAdding = true;

    const lockState = await _negFetchLockState(_activeNegModal.negotiationId);
    if (lockState.locked) {
        alert('This agreement is locked — both parties have approved and ratification is in motion. Articles cannot be added.');
        _negStructuredAdding = false;
        negArticleCancelForm();
        return;
    }

    const newArticle = {
        id: crypto.randomUUID(),
        article_type: _negStructuredType,
        data: data,
        author_nation_id: _activeNegModal.myNationId,
        author_nation_name: _activeNegModal.myNationName,
        added_at_tick: 0,
        strike_requested_by: null,
        strike_requested_by_name: null,
    };

    const { data: shardData } = await _supabase.from('shard').select('current_tick').eq('name', 'Alpha Shard').single();
    newArticle.added_at_tick = shardData?.current_tick || 0;

    const { data: negRow, error: fetchErr } = await _supabase.from('trade_negotiations')
        .select('draft_articles, agreement_type')
        .eq('id', _activeNegModal.negotiationId)
        .single();

    if (fetchErr || !negRow) { alert('Failed to load articles.'); _negStructuredAdding = false; return; }

    const current = negRow.draft_articles || [];
    const updated = [...current, newArticle];

    const { error: updateErr } = await _supabase.from('trade_negotiations')
        .update({ draft_articles: updated, agreement_type: inferAgreementType(updated, negRow.agreement_type) })
        .eq('id', _activeNegModal.negotiationId);

    if (updateErr) { alert('Failed to add article: ' + updateErr.message); _negStructuredAdding = false; return; }

    _activeNegModal.articles = updated;
    negArticleCancelForm();
    negArticlesRender();
    _negStructuredAdding = false;
}
