import { syncVoteTallies } from './js/game/bills.js';
import { TRADE_SECTOR_MAP, calculateExportCapacity, calculateImportDemand, formatSectorVolume, FOOD_SUBSECTOR_MAP, isFoodSubsector, calculateFoodExportCapacity, calculateFoodImportDemand, DEFAULT_FOOD_ALLOCATION, getGlobalAverageUnitPrice, formatPricePerTonne, SECTOR_DISPLAY_UNITS, shippingNeedFor } from './js/game/trade-constants.js';

// ═══════════════════════════════════════════════════
// WORLD/TRADE SUBTAB NAVIGATION
// ═══════════════════════════════════════════════════

const DIPLO_SUBTABS = [
    { id: 'world',     label: 'WORLD'     },
    { id: 'diplomacy', label: 'DIPLOMACY' },
    { id: 'trade',     label: 'TRADE'     },
    { id: 'ipo',       label: 'IPO'       },
    { id: 'sports',    label: 'SPORTS'    },
];
let _diploActiveSubtab = 'world';
let _tradeInitialized = false;

let _tradeTabNeedsAttention = false;
let _ipoTabBadgeCount = 0;

function renderDiploSubtabs() {
    const container = document.getElementById('diplo-subtabs');
    if (!container) return;
    container.innerHTML = DIPLO_SUBTABS.map(tab => {
        let dot = '';
        if ((tab.id === 'trade' || tab.id === 'world') && _tradeTabNeedsAttention) {
            dot = '<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);margin-left:5px;vertical-align:middle;"></span>';
        } else if (tab.id === 'ipo' && _ipoTabBadgeCount > 0) {
            dot = `<span class="badge badge--amber" style="margin-left:6px;">${_ipoTabBadgeCount}</span>`;
        }
        return `<div class="diplo-subtab${_diploActiveSubtab === tab.id ? ' active' : ''}" data-tab="${tab.id}">${tab.label}${dot}</div>`;
    }).join('');
    container.onclick = (e) => {
        const el = e.target.closest('.diplo-subtab');
        if (!el || el.dataset.tab === _diploActiveSubtab) return;
        _diploActiveSubtab = el.dataset.tab;
        renderDiploSubtabs();
        showDiploSubtab();
    };
}

async function checkTradeNotifications() {
    const nationId = _worldState?.nation?.id;
    const factionId = _worldState?.faction?.id;
    if (!nationId || !factionId) { _tradeTabNeedsAttention = false; return; }

    try {
        // Load active/open negotiations for this nation
        const { data: negs } = await _supabase.from('trade_negotiations')
            .select('id, nation_a_id, nation_b_id, approved_by_a, approved_by_b')
            .or(`nation_a_id.eq.${nationId},nation_b_id.eq.${nationId}`)
            .in('status', ['open', 'active']);

        if (!negs || negs.length === 0) { _tradeTabNeedsAttention = false; return; }

        // Check 1: other party agreed but we haven't
        const weNeedToAgree = negs.some(neg => {
            const weAreA = neg.nation_a_id === nationId;
            const myApproved = weAreA ? neg.approved_by_a : neg.approved_by_b;
            const theirApproved = weAreA ? neg.approved_by_b : neg.approved_by_a;
            return theirApproved && !myApproved;
        });

        if (weNeedToAgree) { _tradeTabNeedsAttention = true; return; }

        // Check 2: recent messages from the other side (last 2 ticks)
        const currentTick = _worldState?.shard?.current_tick || 0;
        const negIds = negs.map(n => n.id);
        const { data: recentMsgs } = await _supabase.from('negotiation_messages')
            .select('id, negotiation_id, sender_nation_id')
            .in('negotiation_id', negIds)
            .neq('sender_nation_id', nationId)
            .eq('is_system', false)
            .gte('sent_at_tick', currentTick - 2)
            .limit(1);

        _tradeTabNeedsAttention = (recentMsgs && recentMsgs.length > 0);
    } catch (_) {
        _tradeTabNeedsAttention = false;
    }
}

function showDiploSubtab() {
    const worldEl     = document.getElementById('subtab-world');
    const diplomacyEl = document.getElementById('subtab-diplomacy');
    const tradeEl     = document.getElementById('subtab-trade');
    const ipoEl       = document.getElementById('subtab-ipo');
    const sportsEl    = document.getElementById('subtab-sports');
    if (!worldEl || !diplomacyEl || !tradeEl || !ipoEl || !sportsEl) return;

    worldEl.style.display     = (_diploActiveSubtab === 'world')     ? '' : 'none';
    diplomacyEl.style.display = (_diploActiveSubtab === 'diplomacy') ? '' : 'none';
    tradeEl.style.display     = (_diploActiveSubtab === 'trade')     ? '' : 'none';
    ipoEl.style.display       = (_diploActiveSubtab === 'ipo')       ? '' : 'none';
    sportsEl.style.display    = (_diploActiveSubtab === 'sports')    ? '' : 'none';

    if (_diploActiveSubtab === 'trade' && !_tradeInitialized) {
        _tradeInitialized = true;
        initTradeTab();
    }

    if (_diploActiveSubtab === 'sports') {
        renderSportsTab();
    }

    if (_diploActiveSubtab === 'ipo') {
        if (typeof renderIPOView === 'function' && currentFaction) {
            renderIPOView();
        }
    } else {
        // Tear down IPO realtime when leaving
        if (typeof ipoRealtimeChannel !== 'undefined' && ipoRealtimeChannel) {
            try { _supabase.removeChannel(ipoRealtimeChannel); } catch (_) {}
            ipoRealtimeChannel = null;
        }
        if (typeof ipoVotesChannel !== 'undefined' && ipoVotesChannel) {
            try { _supabase.removeChannel(ipoVotesChannel); } catch (_) {}
            ipoVotesChannel = null;
        }
    }
}

// ═══════════════════════════════════════════════════
// SPORTS TAB — VOLA PROGRAM
// ═══════════════════════════════════════════════════

const VOLA_DECAY_RATE = 0.03;

// Vola tournament calendar — every 24 ticks starting at tick 84.
// Qualifiers are pinned exactly 12 ticks before each cup (tick 72, 96, 120…).
// Pure tick math; no DB schedule table needed.
const VOLA_CUP_FIRST_TICK = 84;
const VOLA_CUP_PERIOD     = 24;
const VOLA_QUAL_OFFSET    = 12;

function ordinalSuffix(n) {
    if (!n) return String(n);
    const s = ['th','st','nd','rd'];
    const v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

// Cup-stage display helpers. SSoT for the two ladders that turn a
// (stage, isActive) pair into header text + tab states. Used by
// renderVolaCup (theoretical schedule placeholder) AND by
// loadAndRenderVolaSchedule (actual scheduled_tick from the DB) so
// the two never drift.
//   stage = currentTick - cupStart  (-∞..-1 upcoming; 0..2 group; 3 QF;
//                                    4 SF; 5 F; 6+ complete)
//   isActive = stage >= 0 && stage <= 5
function _volaStatusForStage(stage, isActive) {
    if (!isActive && stage < 0) return 'UPCOMING';
    if (stage <= 2)              return `GROUP STAGE — ROUND ${stage + 1} IN PROGRESS`;
    if (stage === 3)             return 'QUARTERFINALS IN PROGRESS';
    if (stage === 4)             return 'SEMIFINALS IN PROGRESS';
    if (stage === 5)             return 'FINAL IN PROGRESS';
    return 'COMPLETE';
}
function _volaTabStateForStage(idx, stage, isActive) {
    if (!isActive && stage < 0) return 'pending';
    if (idx === 0) return 'done';                                  // placement always done by GS1
    if (idx === 1) return stage <= 2 ? 'active' : 'done';
    if (idx === 2) return stage <= 2 ? 'pending' : (stage <= 4 ? 'active' : 'done');
    // FINAL tab: 'active' during the final tick (stage 5), 'done' once
    // the cup is complete (stage 6+). Earlier this returned 'pending'
    // for everything except stage===5, which made completed cups
    // render the FINAL tab as if it hadn't happened.
    if (idx === 3) return stage === 5 ? 'active' : (stage > 5 ? 'done' : 'pending');
    return 'pending';
}

// Returns the cup currently being played, or the next upcoming cup if
// there's no active one. Each cup spans 6 ticks (GS1..F). The window
// closes the tick AFTER F passes — i.e. tick > cupStart+5 rolls forward.
function computeActiveOrNextCup(currentTick) {
    const tick = Number(currentTick) || 0;

    // Prefer the most recently started cup over the next upcoming one.
    // Earlier this function returned the NEXT cup as soon as the
    // current one ended (tick > cupEnd), which made an entire just-
    // completed cup's standings + bracket evaporate on the next tick
    // — bad UX, especially since the next cup is two in-game years
    // away. Now: walk to the latest cup whose start tick is ≤ current
    // tick (active OR completed) and return that; fall back to the
    // first upcoming cup only when no cup has started yet.
    let lastStartedN = -1;
    for (let n = 0; n < 1000; n++) {
        const cupStart = VOLA_CUP_FIRST_TICK + VOLA_CUP_PERIOD * n;
        if (cupStart > tick) break;
        lastStartedN = n;
    }

    const buildCup = (n) => {
        const cupStart = VOLA_CUP_FIRST_TICK + VOLA_CUP_PERIOD * n;
        const cupEnd   = cupStart + 5;
        const stage    = tick < cupStart ? -1 : (tick - cupStart);
        const isActive = stage >= 0 && stage <= 5;
        return {
            cupNum: n + 1,
            cupStart, cupEnd,
            isActive,
            stage, // -1 upcoming, 0..5 active, 6+ complete
            gs1: cupStart,
            gs2: cupStart + 1,
            gs3: cupStart + 2,
            qf:  cupStart + 3,
            sf:  cupStart + 4,
            f:   cupStart + 5,
        };
    };

    if (lastStartedN >= 0) return buildCup(lastStartedN);
    return buildCup(0); // pre-first-cup: show cup 1 as upcoming
}

function renderSportsTab() {
    const subtitleEl = document.getElementById('sports-subtitle');
    const cardsEl = document.getElementById('sports-cards');
    const cupEl = document.getElementById('vola-cup');
    const teamEl = document.getElementById('vola-team');
    if (!subtitleEl || !cardsEl) return;

    const nation = _worldState?.nation;
    const tick = _worldState?.shard?.current_tick ?? 0;
    if (!nation) {
        subtitleEl.textContent = '';
        cardsEl.innerHTML = '<div class="sports-empty">No nation selected.</div>';
        if (cupEl) cupEl.innerHTML = '';
        if (teamEl) teamEl.innerHTML = '';
        return;
    }

    const value = Math.max(0, Math.min(100, Number(nation.national_vola_culture) || 0));
    const nextLoss = Math.round(value * VOLA_DECAY_RATE * 10) / 10;
    const nationName = (nation.name || '').toUpperCase();

    subtitleEl.textContent = `${nationName} NATIONAL VOLA AUTHORITY · TICK ${tick}`;

    const vwcRank      = Math.max(0, Number(nation.vwc_ranking) || 0);
    const teamProwess  = Math.max(0, Number(nation.national_team_prowess) || 0);
    const stadiums     = Math.max(0, Number(nation.vola_stadiums) || 0);

    // Next-event ticks. Walk the schedule until we land on a cup/qual
    // tick at or after the current tick. 200-iteration cap is a safety
    // net so this can't spin if the math goes pathological.
    let nextCupTick = null, nextQualTick = null, nextCupNum = null, nextQualCupNum = null;
    for (let n = 0; n < 200 && (nextCupTick === null || nextQualTick === null); n++) {
        const cupTick  = VOLA_CUP_FIRST_TICK + VOLA_CUP_PERIOD * n;
        const qualTick = cupTick - VOLA_QUAL_OFFSET;
        if (nextQualTick === null && qualTick >= tick) { nextQualTick = qualTick; nextQualCupNum = n + 1; }
        if (nextCupTick  === null && cupTick  >= tick) { nextCupTick  = cupTick;  nextCupNum     = n + 1; }
    }
    // Compact "Jan 2007" form so the value fits in a narrow card at the
    // same 36px serif as "10th" / "33" / "0" — avoids two-line wrap.
    const _shortDate = (t) => {
        if (t == null) return '—';
        const full = tickToDate(t);  // "January, 2007"
        const [mon, yr] = full.split(', ');
        return `${(mon || '').slice(0, 3)} ${yr || ''}`.trim();
    };
    const nextCupDate  = _shortDate(nextCupTick);
    const nextQualDate = _shortDate(nextQualTick);
    const nextCupSub   = nextCupTick  != null ? `${ordinalSuffix(nextCupNum)} World Vola Cup · tick ${nextCupTick}` : 'no cup scheduled';
    const nextQualSub  = nextQualTick != null ? `${ordinalSuffix(nextQualCupNum)} cup qualifiers · tick ${nextQualTick}` : 'no qualifiers scheduled';

    cardsEl.innerHTML = `
        <div class="sports-card">
            <div class="sports-card-header">
                <span class="sports-card-icon">&#x1F4CA;</span>
                <span class="sports-card-label">NATIONAL SPORTS CULTURE</span>
            </div>
            <div class="sports-card-value">${value}</div>
            <div class="sports-card-decay">&#x25BC; &minus;${nextLoss.toFixed(1)} next tick (3% decay)</div>
            <div class="sports-bar-track">
                <div class="sports-bar-fill" style="width:${value}%;"></div>
            </div>
            <div class="sports-bar-labels">
                <span>0</span>
                <span class="sports-bar-current">CURRENT ${value}</span>
                <span>100</span>
            </div>
        </div>
        <div class="sports-stat-grid">
            <div class="sports-stat-card sports-stat-card--clickable" id="vwc-ranking-card" role="button" tabindex="0" aria-expanded="false" aria-controls="vwc-ranking-panel">
                <div class="sports-stat-card-header">
                    <span class="sports-stat-card-icon">&#x1F3C6;</span>
                    <span class="sports-stat-card-label">VWC RANKING</span>
                    <span class="sports-stat-card-chevron" aria-hidden="true">&#x25BE;</span>
                </div>
                <div class="sports-stat-card-value">${vwcRank > 0 ? ordinalSuffix(vwcRank) : '—'}</div>
                <div class="sports-stat-card-sub">${vwcRank > 0 ? 'of 12 qualified' : 'unranked'}</div>
            </div>
            <div class="sports-stat-card">
                <div class="sports-stat-card-header">
                    <span class="sports-stat-card-icon">&#x26A1;</span>
                    <span class="sports-stat-card-label">TEAM PROWESS</span>
                </div>
                <div class="sports-stat-card-value">${teamProwess.toLocaleString()}</div>
                <div class="sports-stat-card-sub sports-stat-card-sub--accent">${teamProwess > 0 ? 'avg ' + Math.round(teamProwess / 3) + ' per player' : 'no roster'}</div>
            </div>
            <div class="sports-stat-card">
                <div class="sports-stat-card-header">
                    <span class="sports-stat-card-icon">&#x1F3DF;</span>
                    <span class="sports-stat-card-label">STADIUMS BUILT</span>
                </div>
                <div class="sports-stat-card-value">${stadiums}</div>
                <div class="sports-stat-card-sub">${stadiums > 0 ? 'across the nation' : 'none yet'}</div>
            </div>
            <div class="sports-stat-card">
                <div class="sports-stat-card-header">
                    <span class="sports-stat-card-icon">&#x1F4C5;</span>
                    <span class="sports-stat-card-label">NEXT VOLA WORLD CUP QUALIFIERS</span>
                </div>
                <div class="sports-stat-card-value">${nextQualDate}</div>
                <div class="sports-stat-card-sub">${nextQualSub}</div>
            </div>
            <div class="sports-stat-card">
                <div class="sports-stat-card-header">
                    <span class="sports-stat-card-icon">&#x1F3C6;</span>
                    <span class="sports-stat-card-label">NEXT VOLA WORLD CUP</span>
                </div>
                <div class="sports-stat-card-value">${nextCupDate}</div>
                <div class="sports-stat-card-sub">${nextCupSub}</div>
            </div>
        </div>
        <div class="vwc-ranking-panel" id="vwc-ranking-panel" hidden>
            <div class="vwc-ranking-panel-header">
                <span class="vwc-ranking-panel-title">VWC RANKING &mdash; ALL NATIONS</span>
                <span class="vwc-ranking-panel-meta">Top 3 are <span class="vwc-ranking-panel-tag">[WORLD CLASS]</span></span>
            </div>
            <div class="vwc-ranking-panel-list" id="vwc-ranking-panel-list"></div>
        </div>
    `;

    // Build the all-nations ranking list (uses _worldAllNations populated
    // by initNationHighlight). Top 3 by vwc_ranking get the WORLD CLASS tag.
    renderVwcRankingPanel();

    if (cupEl) {
        cupEl.innerHTML = renderVolaCup(tick);
        // Kick off the async placement fetch that fills the
        // SCHEDULED QUALIFIERS box renderVolaCup leaves as a stub.
        const cupForPlacement = computeActiveOrNextCup(tick);
        if (cupForPlacement?.cupNum) {
            loadAndRenderVolaPlacement(cupForPlacement.cupNum).catch(err =>
                console.warn('[Sports] placement render failed:', err?.message || err)
            );
            loadAndRenderVolaGroups(cupForPlacement.cupNum).catch(err =>
                console.warn('[Sports] group render failed:', err?.message || err)
            );
            loadAndRenderVolaHost(cupForPlacement.cupNum).catch(err =>
                console.warn('[Sports] host render failed:', err?.message || err)
            );
            loadAndRenderVolaKnockout(cupForPlacement.cupNum).catch(err =>
                console.warn('[Sports] knockout render failed:', err?.message || err)
            );
            loadAndRenderVolaSchedule(cupForPlacement.cupNum, tick).catch(err =>
                console.warn('[Sports] schedule render failed:', err?.message || err)
            );
        }
    }

    if (teamEl) {
        teamEl.innerHTML = `
            <div class="vola-team-header">
                <span class="vola-team-title"><span class="vola-team-icon">&#x274C;</span> NATIONAL VOLA TEAM</span>
                <span class="vola-team-meta" id="vola-team-meta">&hellip;</span>
            </div>
            <div class="vola-team-grid" id="vola-team-grid">
                <div class="sports-empty">Loading roster&hellip;</div>
            </div>
            <div class="vola-team-footer" id="vola-team-footer"></div>
        `;
        loadAndRenderVolaTeam(tick).catch(err =>
            console.warn('[Sports] team render failed:', err?.message || err)
        );
    }

}

// Render the all-nations VWC ranking list inside the collapsible
// panel triggered by the VWC RANKING stat card. Sorted by ranking
// (lowest = best, 0 = unranked → bottom). Top 3 carry [WORLD CLASS].
async function renderVwcRankingPanel() {
    const list = document.getElementById('vwc-ranking-panel-list');
    if (!list) return;
    let all = Array.isArray(_worldAllNations) ? _worldAllNations : [];
    if (all.length === 0) {
        // Lazy fetch — covers the case where the World tab hasn't been
        // visited yet so initNationHighlight never populated the cache.
        list.innerHTML = '<div class="sports-empty">Loading rankings&hellip;</div>';
        try {
            const { data } = await _supabase.from('nations')
                .select('id, name, flag_url, vwc_ranking')
                .order('name');
            all = data || [];
            _worldAllNations = all;
        } catch (err) {
            list.innerHTML = `<div class="sports-empty">Failed to load: ${escapeHtml(err?.message || '')}</div>`;
            return;
        }
    }
    if (all.length === 0) {
        list.innerHTML = '<div class="sports-empty">No nation data available.</div>';
        return;
    }
    const ranked = all.slice().sort((a, b) => {
        const ra = Number(a?.vwc_ranking) || 0;
        const rb = Number(b?.vwc_ranking) || 0;
        // Unranked (0) sorts to the bottom; otherwise ascending rank.
        if (ra === 0 && rb === 0) return (a.name || '').localeCompare(b.name || '');
        if (ra === 0) return 1;
        if (rb === 0) return -1;
        return ra - rb;
    });
    const myId = _worldState?.nation?.id;
    list.innerHTML = ranked.map((n, idx) => {
        const rank = Number(n.vwc_ranking) || 0;
        const flagImg = _volaFlagImg(n, 'vwc-ranking-flag');
        const rankLabel = rank > 0 ? ordinalSuffix(rank) : '—';
        const tier = (rank > 0 && rank <= 3) ? '<span class="vwc-ranking-tag">[WORLD CLASS]</span>' : '';
        const isMe = n.id && myId && n.id === myId ? ' vwc-ranking-row--me' : '';
        return `
            <div class="vwc-ranking-row${isMe}">
                <span class="vwc-ranking-rank">${rankLabel}</span>
                ${flagImg}
                <span class="vwc-ranking-name">${escapeHtml(n.name || 'Unknown')}</span>
                ${tier}
            </div>
        `;
    }).join('');
}

// Wire the VWC Ranking card click → toggle panel + chevron rotation.
// Single delegated handler; idempotent on re-render because we always
// query fresh elements on click.
document.addEventListener('click', (ev) => {
    const card = ev.target.closest && ev.target.closest('#vwc-ranking-card');
    if (!card) return;
    const panel = document.getElementById('vwc-ranking-panel');
    if (!panel) return;
    const isOpen = !panel.hidden;
    panel.hidden = isOpen;
    card.setAttribute('aria-expanded', String(!isOpen));
    card.classList.toggle('sports-stat-card--open', !isOpen);
});
// Keyboard parity: Enter / Space on the focused card toggles too.
document.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    const card = ev.target && ev.target.id === 'vwc-ranking-card' ? ev.target : null;
    if (!card) return;
    ev.preventDefault();
    card.click();
});

// Renders the Vola World Cup container — title/host/schedule header,
// stage-tab strip, 3 group standings, 4-2-1 knockout bracket, champion
// card. All team data is intentionally blank (placeholder slots) — only
// the frame, dates, group letters, and stage state are tick-driven.
function renderVolaCup(currentTick) {
    const cup = computeActiveOrNextCup(currentTick);
    if (!cup) return '';

    // Title differs only for a true upcoming cup (stage < 0). An active
    // or completed cup both read as "{nth} World Vola Cup"; the status
    // pill below tells the player which one (LIVE / COMPLETE / a stage).
    const isUpcoming = cup.stage < 0;
    const titleHtml = isUpcoming
        ? `Next World Cup &mdash; <span class="vola-cup-title-date">${tickToDate(cup.gs1)}</span>`
        : `${ordinalSuffix(cup.cupNum)} World <span class="vola-cup-title-accent">Vola</span> Cup`;

    const livePill = cup.isActive
        ? `<span class="vola-cup-live">&bullet; LIVE</span>`
        : '';

    const statusText = _volaStatusForStage(cup.stage, cup.isActive);

    const tabIcon = (state) => state === 'done' ? '&check;' : state === 'active' ? '&times;' : '&#9675;';
    const tabHtml = (idx, label) => {
        const state = _volaTabStateForStage(idx, cup.stage, cup.isActive);
        return `<div class="vola-cup-tab vola-cup-tab--${state}">
            <span class="vola-cup-tab-icon">${tabIcon(state)}</span> ${label}
        </div>`;
    };

    const blankRow = (rank) => `
        <div class="vola-cup-group-row">
            <span class="vola-cup-group-rank">${rank}.</span>
            <span class="vola-cup-group-team vola-cup-group-team--blank">&mdash;</span>
            <span class="vola-cup-group-stat vola-cup-group-stat--blank">&mdash;</span>
            <span class="vola-cup-group-stat vola-cup-group-stat--blank">&mdash;</span>
            <span class="vola-cup-group-stat vola-cup-group-stat--blank">&mdash;</span>
        </div>
    `;
    const groupCard = (letter) => `
        <div class="vola-cup-group vola-cup-group--${letter.toLowerCase()}" data-cup-num="${cup.cupNum}" data-group-letter="${letter}">
            <div class="vola-cup-group-header">GROUP <span class="vola-cup-group-letter">${letter}</span></div>
            <div class="vola-cup-group-table">
                <div class="vola-cup-group-row vola-cup-group-row--head">
                    <span class="vola-cup-group-rank"></span>
                    <span class="vola-cup-group-team"></span>
                    <span class="vola-cup-group-stat-label">W-L</span>
                    <span class="vola-cup-group-stat-label">PTS</span>
                    <span class="vola-cup-group-stat-label">RANK</span>
                </div>
                <div class="vola-cup-group-rows">
                    ${[1,2,3,4].map(blankRow).join('')}
                </div>
            </div>
        </div>
    `;

    const matchSlot = (round, matchNum, defaultA = '&mdash;', defaultB = '&mdash;') => `
        <div class="vola-cup-match" data-cup-num="${cup.cupNum}" data-round="${round}" data-match-num="${matchNum}">
            <div class="vola-cup-match-team" data-side="a">${defaultA}</div>
            <div class="vola-cup-match-team" data-side="b">${defaultB}</div>
            <div class="vola-cup-match-status">PENDING</div>
        </div>
    `;

    return `
        <div class="vola-cup-header">
            <div class="vola-cup-header-left">
                <div class="vola-cup-title-row">
                    ${livePill}
                    <span class="vola-cup-title">${titleHtml}</span>
                </div>
                <div class="vola-cup-meta">
                    <span class="vola-cup-meta-icon">&#x1F4CD;</span>
                    HOSTED BY <span class="vola-cup-meta-host">[NO HOST]</span>
                    &middot; 12 TEAMS
                </div>
            </div>
            <div class="vola-cup-header-right">
                <div class="vola-cup-status" data-cup-sched="status">${statusText}</div>
                <div class="vola-cup-schedule">
                    <div data-cup-sched="qf">${tickToDate(cup.qf)} &mdash; Quarterfinals begin</div>
                    <div data-cup-sched="sf">${tickToDate(cup.sf)} &mdash; Semifinals</div>
                    <div data-cup-sched="f">${tickToDate(cup.f)} &mdash; Final</div>
                </div>
            </div>
        </div>

        <div class="vola-cup-tabs" data-cup-sched="tabs">
            ${tabHtml(0, 'PLACEMENT MATCHES')}
            ${tabHtml(1, 'GROUP STAGE')}
            ${tabHtml(2, 'KNOCKOUT ROUND')}
            ${tabHtml(3, 'FINAL')}
        </div>

        <div class="vola-cup-section-label">
            <span class="vola-cup-section-icon">&#x1F4CA;</span> GROUP STAGE FINAL STANDINGS
        </div>
        <div class="vola-cup-groups">
            ${groupCard('A')}
            ${groupCard('B')}
            ${groupCard('C')}
        </div>

        <div class="vola-cup-section-label vola-cup-section-label--knockout">
            <span class="vola-cup-section-icon">&times;</span> KNOCKOUT ROUND
        </div>
        <div class="vola-cup-bracket" data-cup-num="${cup.cupNum}">
            <div class="vola-cup-bracket-col">
                <div class="vola-cup-bracket-col-label" data-cup-sched="bracket-qf">QUARTERFINALS &middot; ${tickToDate(cup.qf)}</div>
                ${matchSlot('QF', 1)}
                ${matchSlot('QF', 2)}
                ${matchSlot('QF', 3)}
                ${matchSlot('QF', 4)}
            </div>
            <div class="vola-cup-bracket-col">
                <div class="vola-cup-bracket-col-label" data-cup-sched="bracket-sf">SEMIFINALS &middot; ${tickToDate(cup.sf)}</div>
                ${matchSlot('SF', 1, 'Winner QF1', 'Winner QF2')}
                ${matchSlot('SF', 2, 'Winner QF3', 'Winner QF4')}
            </div>
            <div class="vola-cup-bracket-col">
                <div class="vola-cup-bracket-col-label" data-cup-sched="bracket-f">FINAL &middot; ${tickToDate(cup.f)}</div>
                ${matchSlot('F', 1, 'Winner SF1', 'Winner SF2')}
                <div class="vola-cup-champion">
                    <div class="vola-cup-champion-icon">&#x1F3C6;</div>
                    <div class="vola-cup-champion-label">VWC CHAMPION</div>
                    <div class="vola-cup-champion-text">To Be Crowned</div>
                </div>
            </div>
        </div>

        <!-- Scheduled Qualifiers box: bottom-3 round-robin lined up at
             the qualifier tick. Populated async by loadVolaPlacement
             so the synchronous render stays cheap. -->
        <div class="vola-cup-placement" id="vola-cup-placement-${cup.cupNum}">
            <div class="vola-cup-section-label">
                <span class="vola-cup-section-icon">&times;</span> SCHEDULED QUALIFIERS
            </div>
            <div class="vola-cup-placement-body" data-cup-num="${cup.cupNum}">
                <div class="sports-empty">Loading placement matches&hellip;</div>
            </div>
        </div>
    `;
}

// Deterministic per-name color hash so the same nation always gets the
// same accent in the cup UI. Cheap "djb2-ish" rolling hash → palette
// lookup. Used by placement matches today; group standings + bracket
// once team data populates.
const _VOLA_NATION_PALETTE = [
    '#d65a5a', '#e07a3a', '#e8b13a', '#cdd055', '#9ac84e',
    '#5eb564', '#4ab59c', '#5aa9d6', '#6e8ad6', '#9070cf',
    '#b46ac5', '#d66aaa', '#cc8866',
];
function _volaNationColor(name) {
    if (!name) return 'var(--text-bright)';
    let h = 0;
    for (let i = 0; i < name.length; i++) h = ((h * 31) + name.charCodeAt(i)) | 0;
    return _VOLA_NATION_PALETTE[Math.abs(h) % _VOLA_NATION_PALETTE.length];
}

// Build an <img> for a nation's flag. Falls back through nations.flag_url →
// FLAG_URLS[name] → assets/flags/{name}.png so any seeded nation gets a
// flag whether or not the column is populated. Caller controls the CSS
// class so each surface can size the flag appropriately.
function _volaFlagImg(nation, className) {
    if (!nation) return '';
    const name = nation.name || '';
    const url = nation.flag_url || FLAG_URLS[name] || (name ? `assets/flags/${name}.png` : '');
    if (!url) return '';
    return `<img class="${className}" src="${escapeHtml(url)}" alt="" loading="lazy" onerror="this.style.display='none'">`;
}

// Fetch the host for this cup and patch the [NO HOST] placeholder. The
// initial renderVolaCup call ships the placeholder synchronously; this
// updates it once vola_cup_hosts comes back. Leaving the placeholder
// when no host has been awarded yet is the expected fallback.
async function loadAndRenderVolaHost(cupNum) {
    const hostEl = document.querySelector('.vola-cup-meta-host');
    if (!hostEl) return;

    const { data, error } = await _supabase
        .from('vola_cup_hosts')
        .select('host_nation_id, nations:host_nation_id(name)')
        .eq('cup_number', cupNum)
        .maybeSingle();

    if (error) {
        console.warn('[Sports] host fetch failed:', error.message);
        return;
    }
    const name = data?.nations?.name;
    if (name) hostEl.textContent = name.toUpperCase();
}

// SSoT: actual cup_start = MIN(scheduled_tick) on vola_cup_group_matches
// for this cup. The synchronous renderVolaCup uses the theoretical
// formula (cup_start = 84 + 24×(n-1)) as a placeholder; if the placement
// matches caught up late, the draw inserts ticks that diverge from the
// formula and the schedule header / bracket labels / status / tabs
// rendered above are stale.
//
// This hydrator queries the actual ticks and updates the [data-cup-sched]
// nodes in place. If the DB rows haven't landed yet (pre-draw window),
// the function no-ops and the placeholder stays.
async function loadAndRenderVolaSchedule(cupNum, currentTick) {
    const { data: groupMatches, error } = await _supabase
        .from('vola_cup_group_matches')
        .select('scheduled_tick')
        .eq('cup_number', cupNum)
        .eq('round_number', 1)
        .order('scheduled_tick', { ascending: true })
        .limit(1);
    if (error) {
        console.warn('[Sports] schedule fetch failed:', error.message || error);
        return;
    }
    if (!groupMatches || groupMatches.length === 0) return;
    const actualCupStart = Number(groupMatches[0].scheduled_tick);
    if (!Number.isFinite(actualCupStart)) return;

    const qf = actualCupStart + 3, sf = actualCupStart + 4, f = actualCupStart + 5;

    const setText = (sel, txt) => {
        const el = document.querySelector(`[data-cup-sched="${sel}"]`);
        if (el) el.textContent = txt;
    };
    setText('qf',          `${tickToDate(qf)} — Quarterfinals begin`);
    setText('sf',          `${tickToDate(sf)} — Semifinals`);
    setText('f',           `${tickToDate(f)} — Final`);
    setText('bracket-qf',  `QUARTERFINALS · ${tickToDate(qf)}`);
    setText('bracket-sf',  `SEMIFINALS · ${tickToDate(sf)}`);
    setText('bracket-f',   `FINAL · ${tickToDate(f)}`);

    // Status + tabs. Stage / isActive derived from actual cup_start;
    // strings + tab states come from the shared SSoT helpers so this
    // can't drift from renderVolaCup.
    const tick = Number(currentTick) || 0;
    const stage = tick - actualCupStart;
    const isActive = stage >= 0 && stage <= 5;
    setText('status', _volaStatusForStage(stage, isActive));

    const tabsEl = document.querySelector('[data-cup-sched="tabs"]');
    if (tabsEl) {
        const tabIcon = (s) => s === 'done' ? '✓' : s === 'active' ? '×' : '○';
        tabsEl.querySelectorAll('.vola-cup-tab').forEach((el, idx) => {
            const s = _volaTabStateForStage(idx, stage, isActive);
            el.className = `vola-cup-tab vola-cup-tab--${s}`;
            const iconEl = el.querySelector('.vola-cup-tab-icon');
            if (iconEl) iconEl.textContent = tabIcon(s);
        });
    }
}

// Fetch placement matches for the active/next cup and render them into
// the .vola-cup-placement-body slot that renderVolaCup left in the DOM.
// Called from renderSportsTab right after the cup HTML is written.
async function loadAndRenderVolaPlacement(cupNum) {
    const body = document.querySelector(`.vola-cup-placement-body[data-cup-num="${cupNum}"]`);
    if (!body) return;

    const { data: matches, error } = await _supabase
        .from('vola_placement_matches')
        .select('match_number, scheduled_tick, team_a_score, team_b_score, winner_nation_id, team_a:team_a_nation_id(id, name, flag_url), team_b:team_b_nation_id(id, name, flag_url)')
        .eq('cup_number', cupNum)
        .order('match_number', { ascending: true });

    if (error) {
        body.innerHTML = `<div class="sports-empty">Failed to load placement matches: ${escapeHtml(error.message || '')}</div>`;
        return;
    }

    if (!matches || matches.length === 0) {
        body.innerHTML = `<div class="sports-empty">Placement schedule not yet generated. The bottom 3 nations face a 3-tick round-robin starting at the qualifier tick.</div>`;
        return;
    }

    body.innerHTML = matches.map(m => {
        const teamA  = m.team_a?.name || 'TBD';
        const teamB  = m.team_b?.name || 'TBD';
        const flagA  = _volaFlagImg(m.team_a, 'vola-flag');
        const flagB  = _volaFlagImg(m.team_b, 'vola-flag');
        const colorA = _volaNationColor(teamA);
        const colorB = _volaNationColor(teamB);
        const sa = m.team_a_score, sb = m.team_b_score;
        const played = sa != null && sb != null;
        const winnerId = m.winner_nation_id;
        const aWon = played && winnerId === m.team_a?.id;
        const bWon = played && winnerId === m.team_b?.id;
        const aColor = aWon ? colorA : (played ? 'var(--text-dim)' : colorA);
        const bColor = bWon ? colorB : (played ? 'var(--text-dim)' : colorB);
        const aGlow  = aWon ? `text-shadow:0 0 8px ${colorA}55;` : '';
        const bGlow  = bWon ? `text-shadow:0 0 8px ${colorB}55;` : '';
        return `
            <div class="vola-placement-row ${played ? 'played' : 'pending'}">
                <div class="vola-placement-meta">
                    <span class="vola-placement-num">MATCH ${m.match_number}</span>
                    <span class="vola-placement-tick">${tickToDate(m.scheduled_tick)} &middot; tick ${m.scheduled_tick}</span>
                </div>
                <div class="vola-placement-teams">
                    <span class="vola-placement-team ${aWon ? 'won' : ''}" style="color:${aColor};${aGlow}">${flagA}${escapeHtml(teamA)}</span>
                    <span class="vola-placement-score">${played ? `<strong style="color:${colorA};">${sa}</strong> &mdash; <strong style="color:${colorB};">${sb}</strong>` : 'vs'}</span>
                    <span class="vola-placement-team ${bWon ? 'won' : ''}" style="color:${bColor};${bGlow}">${flagB}${escapeHtml(teamB)}</span>
                </div>
            </div>
        `;
    }).join('');
}

// Phase 1+2 of the VWC pipeline: fill the 3 group cards with the
// team names + flags drawn into each group, plus live W-L / PTS / RANK
// standings derived from vola_cup_group_matches. Rows reorder as wins
// accumulate (wins DESC, points DESC, vwc_ranking ASC, name ASC).
async function loadAndRenderVolaGroups(cupNum) {
    const cards = document.querySelectorAll(`.vola-cup-group[data-cup-num="${cupNum}"]`);
    if (!cards.length) return;

    const [drawRes, matchRes] = await Promise.all([
        _supabase.from('vola_cup_groups')
            .select('group_letter, seed_rank, qualified_via, nation:nation_id(id, name, flag_url, vwc_ranking)')
            .eq('cup_number', cupNum),
        _supabase.from('vola_cup_group_matches')
            .select('group_letter, team_a_nation_id, team_b_nation_id, team_a_score, team_b_score, winner_nation_id, resolved_at_tick')
            .eq('cup_number', cupNum),
    ]);

    if (drawRes.error) {
        console.warn('[Sports] vola_cup_groups fetch failed:', drawRes.error.message || drawRes.error);
        return;
    }
    if (matchRes.error) {
        // Standings are best-effort — if matches fetch fails, render the
        // draw with blank stats rather than nothing.
        console.warn('[Sports] vola_cup_group_matches fetch failed:', matchRes.error.message || matchRes.error);
    }
    const draw = drawRes.data || [];
    if (draw.length === 0) return; // Draw hasn't fired yet — leave placeholders.

    // Per-team standings: wins, losses, points (sum of own scores in
    // resolved matches). RANK is the static vwc_ranking from the draw
    // join — lower is better, 0/null means unranked (treated as worst).
    const stats = new Map();
    const ensure = (id) => {
        if (!stats.has(id)) stats.set(id, { wins: 0, losses: 0, points: 0, played: 0 });
        return stats.get(id);
    };
    for (const m of (matchRes.data || [])) {
        if (m.resolved_at_tick == null) continue;
        const a = m.team_a_nation_id, b = m.team_b_nation_id;
        const sA = Number(m.team_a_score) || 0;
        const sB = Number(m.team_b_score) || 0;
        const sa = ensure(a), sb = ensure(b);
        sa.points += sA; sb.points += sB;
        sa.played++;     sb.played++;
        if (m.winner_nation_id === a)      { sa.wins++; sb.losses++; }
        else if (m.winner_nation_id === b) { sb.wins++; sa.losses++; }
    }

    // Bucket draw rows by group letter, attach live stats.
    const byGroup = { A: [], B: [], C: [] };
    for (const row of draw) {
        if (!byGroup[row.group_letter]) continue;
        const id = row.nation?.id;
        const s = id && stats.get(id);
        byGroup[row.group_letter].push({
            ...row,
            wins:   s ? s.wins   : 0,
            losses: s ? s.losses : 0,
            points: s ? s.points : 0,
            played: s ? s.played : 0,
            ranking: Number(row.nation?.vwc_ranking) || 0,
        });
    }

    cards.forEach(card => {
        const letter = card.getAttribute('data-group-letter');
        const rowsEl = card.querySelector('.vola-cup-group-rows');
        if (!rowsEl) return;
        const teams = (byGroup[letter] || []).slice();
        if (teams.length === 0) return;

        // Sort: wins DESC, points DESC, ranking ASC (lower rank wins),
        // name ASC. Unranked nations (0/null) get treated as worst.
        // Final tiebreaker is name to match seedVolaCupKnockout's
        // server-side comparator so the displayed group order stays
        // identical to the bracket-seed order in the rare all-stats-
        // tied case.
        const sortRank = r => r > 0 ? r : Number.POSITIVE_INFINITY;
        teams.sort((a, b) => {
            if (b.wins !== a.wins) return b.wins - a.wins;
            if (b.points !== a.points) return b.points - a.points;
            const ar = sortRank(a.ranking), br = sortRank(b.ranking);
            if (ar !== br) return ar - br;
            const an = a.nation?.name || '';
            const bn = b.nation?.name || '';
            return an.localeCompare(bn);
        });

        rowsEl.innerHTML = teams.map((row, i) => {
            const n = row.nation || {};
            const name = n.name || 'TBD';
            const flagImg = _volaFlagImg(n, 'vola-cup-group-flag');
            const color = _volaNationColor(name);
            const viaTag = row.qualified_via === 'placement'
                ? '<span class="vola-cup-group-via" title="Qualified via placement round">P</span>'
                : '';
            const wl = row.played > 0
                ? `${row.wins}-${row.losses}`
                : '<span class="vola-cup-group-stat--blank">&mdash;</span>';
            const pts = row.played > 0
                ? String(row.points)
                : '<span class="vola-cup-group-stat--blank">&mdash;</span>';
            const rank = row.ranking > 0 ? String(row.ranking) : '<span class="vola-cup-group-stat--blank">&mdash;</span>';
            return `
                <div class="vola-cup-group-row">
                    <span class="vola-cup-group-rank">${i + 1}.</span>
                    <span class="vola-cup-group-team" style="color:${color};">${flagImg}${escapeHtml(name)}${viaTag}</span>
                    <span class="vola-cup-group-stat">${wl}</span>
                    <span class="vola-cup-group-stat">${pts}</span>
                    <span class="vola-cup-group-stat">${rank}</span>
                </div>
            `;
        }).join('');
    });
}

// Phase 3 of the VWC pipeline: fill the QF / SF / F slots in the
// bracket from vola_cup_knockout. QF rows have both team_a/b set
// at seed time, so those slots show real teams + flags as soon as
// the seeding lands. SF/F rows have feeder_a_match / feeder_b_match
// references but no teams yet — Phase 4 will fill those when the
// upstream match resolves; until then they keep the static
// "Winner QF1" / "Winner SF1" defaults from renderVolaCup.
async function loadAndRenderVolaKnockout(cupNum) {
    const bracket = document.querySelector(`.vola-cup-bracket[data-cup-num="${cupNum}"]`);
    if (!bracket) return;

    const { data, error } = await _supabase
        .from('vola_cup_knockout')
        .select('round, match_number, team_a_seed, team_b_seed, feeder_a_match, feeder_b_match, team_a_score, team_b_score, winner_nation_id, resolved_at_tick, team_a:team_a_nation_id(id, name, flag_url), team_b:team_b_nation_id(id, name, flag_url)')
        .eq('cup_number', cupNum);

    if (error) {
        console.warn('[Sports] vola_cup_knockout fetch failed:', error.message || error);
        return;
    }
    if (!data || data.length === 0) return;

    // Champion card lives outside the per-match loop. If the F row is
    // resolved, swap the placeholder for the winning team's name + flag.
    const finalRow = data.find(m => m.round === 'F');
    const champEl = bracket.querySelector('.vola-cup-champion-text');
    if (champEl) {
        if (finalRow?.winner_nation_id && (finalRow.team_a || finalRow.team_b)) {
            const championNation = finalRow.winner_nation_id === finalRow.team_a?.id
                ? finalRow.team_a
                : finalRow.team_b;
            if (championNation?.name) {
                const flag = _volaFlagImg(championNation, 'vola-cup-champion-flag');
                const color = _volaNationColor(championNation.name);
                champEl.innerHTML = `${flag}<span style="color:${color};">${escapeHtml(championNation.name)}</span>`;
                bracket.classList.add('vola-cup-bracket--crowned');
            }
        } else {
            champEl.textContent = 'To Be Crowned';
            bracket.classList.remove('vola-cup-bracket--crowned');
        }
    }

    for (const m of data) {
        const slot = bracket.querySelector(
            `.vola-cup-match[data-round="${m.round}"][data-match-num="${m.match_number}"]`
        );
        if (!slot) continue;

        const aEl = slot.querySelector('[data-side="a"]');
        const bEl = slot.querySelector('[data-side="b"]');
        const statusEl = slot.querySelector('.vola-cup-match-status');
        if (!aEl || !bEl) continue;

        const renderSide = (team, sideLabel, feederMatch) => {
            if (team?.id) {
                const flag = _volaFlagImg(team, 'vola-cup-match-flag');
                const color = _volaNationColor(team.name);
                return `<span style="color:${color};">${flag}${escapeHtml(team.name || 'TBD')}</span>`;
            }
            // Pre-resolution placeholder using feeder reference.
            if (feederMatch != null) {
                const upstream = m.round === 'SF' ? `QF${feederMatch}` : `SF${feederMatch}`;
                return `Winner ${upstream}`;
            }
            return sideLabel;
        };

        aEl.innerHTML = renderSide(m.team_a, '&mdash;', m.feeder_a_match);
        bEl.innerHTML = renderSide(m.team_b, '&mdash;', m.feeder_b_match);

        // Reset state-driven classes before re-applying so a stale "played"
        // class from a prior render can't cling to a now-pending slot.
        slot.classList.remove('vola-cup-match--played', 'vola-cup-match--win-a', 'vola-cup-match--win-b');
        if (statusEl) {
            if (m.resolved_at_tick != null && m.winner_nation_id) {
                const sa = Number(m.team_a_score) || 0;
                const sb = Number(m.team_b_score) || 0;
                statusEl.textContent = `${sa} – ${sb}`;
                slot.classList.add('vola-cup-match--played');
                const winSide = m.winner_nation_id === m.team_a?.id ? 'a' : 'b';
                slot.classList.add(`vola-cup-match--win-${winSide}`);
            } else {
                statusEl.textContent = 'PENDING';
            }
        }
    }
}

// Render the National Vola Team — 3 player cards + total prowess footer.
// Reads from vola_team_players for the player's nation. Auto-generated
// by the tick processor + the SQL backfill, so we expect exactly 3 rows;
// any drift (e.g., 0 or 1 players) shows a graceful empty state.
async function loadAndRenderVolaTeam(currentTick) {
    const grid    = document.getElementById('vola-team-grid');
    const meta    = document.getElementById('vola-team-meta');
    const footer  = document.getElementById('vola-team-footer');
    if (!grid) return;

    const nation = _worldState?.nation;
    if (!nation?.id) {
        grid.innerHTML = '<div class="sports-empty">No nation selected.</div>';
        if (meta) meta.textContent = '';
        if (footer) footer.innerHTML = '';
        return;
    }

    const { data: players, error } = await _supabase.from('vola_team_players')
        .select('id, position_number, position_name, first_name, last_name, age, rating, recruited_at_tick, recruited_at_culture, retires_at_tick, is_captain')
        .eq('nation_id', nation.id)
        .order('position_number', { ascending: true });

    if (error) {
        grid.innerHTML = `<div class="sports-empty">Failed to load roster: ${escapeHtml(error.message || '')}</div>`;
        if (meta) meta.textContent = '';
        if (footer) footer.innerHTML = '';
        return;
    }

    if (!players || players.length === 0) {
        grid.innerHTML = '<div class="sports-empty">Roster pending — players generate next tick.</div>';
        if (meta) meta.textContent = '';
        if (footer) footer.innerHTML = '';
        return;
    }

    const totalProwess = players.reduce((s, p) => s + (Number(p.rating) || 0), 0);
    if (meta) meta.textContent = `${players.length} PLAYERS · TOTAL PROWESS ${totalProwess}`;

    grid.innerHTML = players.map(p => {
        const ticksRemaining = Math.max(0, Number(p.retires_at_tick) - Number(currentTick));
        const retiresNext    = ticksRemaining === 1;
        const fullName       = `${p.first_name || ''} ${p.last_name || ''}`.trim() || 'Unnamed';
        const culture        = Number(p.recruited_at_culture).toFixed(0);
        const cardCls        = retiresNext ? 'vola-player-card vola-player-card--retiring' : 'vola-player-card';
        const remainingHtml = retiresNext
            ? `<div class="vola-player-retire-warn"><span>&#9888;</span> RETIRES NEXT TICK</div>`
            : `<div class="vola-player-remaining"><span>&#x29D6;</span> ${ticksRemaining} tick${ticksRemaining === 1 ? '' : 's'} remaining</div>`;
        const recruitBtn = retiresNext
            ? `<button class="vola-player-recruit-btn" data-position="${p.position_number}">RECRUIT REPLACEMENT &rarr;</button>`
            : '';
        const positionLabel = p.is_captain
            ? `CAPTAIN &middot; POS ${p.position_number}`
            : `POSITION ${p.position_number}`;
        return `
            <div class="${cardCls}">
                <div class="vola-player-pos">${positionLabel}</div>
                <div class="vola-player-name">${escapeHtml(fullName)}</div>
                <div class="vola-player-meta">${escapeHtml(p.position_name || '').toUpperCase()} &middot; AGE ${Number(p.age) || '?'}</div>
                <div class="vola-player-rating"><span class="vola-player-rating-num">${Number(p.rating) || 0}</span> <span class="vola-player-rating-label">RATING</span></div>
                ${remainingHtml}
                <div class="vola-player-recruit-line">recruited at Culture ${escapeHtml(culture)} &middot; tick ${Number(p.recruited_at_tick) || 0}</div>
                ${recruitBtn}
            </div>
        `;
    }).join('');

    if (footer) {
        const breakdown = players.map(p => Number(p.rating) || 0).join(' + ');
        footer.innerHTML = `
            <div class="vola-team-footer-left">
                <div class="vola-team-footer-label">TEAM PROWESS (sum)</div>
                <div class="vola-team-footer-formula">${breakdown} = ${totalProwess}</div>
            </div>
            <div class="vola-team-footer-total">${totalProwess}</div>
        `;
    }

    // Wire the manual recruit button — calls the RPC, then re-renders.
    grid.querySelectorAll('[data-position]').forEach(btn => {
        if (btn.tagName !== 'BUTTON') return;
        btn.addEventListener('click', async () => {
            const pos = Number(btn.dataset.position);
            if (!pos) return;
            if (!confirm('Force-retire this player and recruit a replacement at current culture?')) return;
            btn.disabled = true;
            btn.textContent = 'RECRUITING…';
            try {
                const { data, error: rpcErr } = await _supabase.rpc('recruit_vola_player_replacement', { p_position_number: pos });
                if (rpcErr) throw rpcErr;
                if (!data?.success) throw new Error(data?.reason || 'Recruit failed');
            } catch (err) {
                alert('Recruit failed: ' + (err?.message || err));
                btn.disabled = false;
                btn.textContent = 'RECRUIT REPLACEMENT →';
                return;
            }
            // Re-fetch + re-render so the new player appears.
            await loadAndRenderVolaTeam(currentTick);
        });
    });
}
