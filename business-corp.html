<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corporation | Nationhood</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root { --font-mono: 'JetBrains Mono', monospace; --font-ui: 'IBM Plex Sans', -apple-system, sans-serif; }
  /* Page chrome (topbar/nav/.ent-content) is injected by
     js/entrepreneur-topbar.js — shared with the entrepreneur pages. */
  .bc-wrap { max-width:1280px; margin:0 auto; display:flex; gap:26px; align-items:flex-start; }
  .bc-main { flex:1; min-width:0; }
  .bc-title { font-family:Georgia,serif; font-size:28px; color:#fff; margin:0 0 4px; font-weight:500; }
  .bc-sub { font-family:var(--font-mono); font-size:10px; letter-spacing:0.14em; color:#666;
    font-weight:700; margin-bottom:22px; }
  /* ── Executive Actions panel ── */
  .ea-panel { background:#0b0d0a; border:0.5px solid rgba(138,170,106,0.25);
    border-radius:6px; padding:16px 18px 18px; position:relative; }
  .ea-head { display:flex; align-items:center; gap:14px; margin-bottom:16px; }
  .ea-head .rule { flex:1; height:1px; background:rgba(138,170,106,0.25); }
  .ea-head .t { font-family:var(--font-mono); font-size:11px; letter-spacing:0.3em;
    color:#aac88a; font-weight:700; white-space:nowrap; }
  .ea-remaining { position:absolute; top:14px; right:16px; font-family:Georgia,serif;
    font-style:italic; font-size:11px; color:#8aaa6a; border:0.5px solid #4a6a4a;
    border-radius:3px; padding:3px 9px; background:rgba(138,170,106,0.06); }
  .ea-grid { display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:12px; }
  @media (max-width:980px) { .ea-grid { grid-template-columns:repeat(2, minmax(0,1fr)); } }
  .ea-card { background:#0d0d0d; border:0.5px solid rgba(255,255,255,0.07); border-radius:4px;
    padding:22px 10px; text-align:center; opacity:0.65; }
  .ea-card .ic { font-size:13px; color:#555; margin-bottom:8px; }
  .ea-card .nm { font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.16em;
    color:#888; font-weight:700; margin-bottom:5px; }
  .ea-card .soon { font-family:Georgia,serif; font-style:italic; font-size:10.5px; color:#4a4940; }

  /* ── Core Metrics: the three pillars ── */
  .pl-section { margin-top:22px; }
  .pl-panel { background:#0b0d0a; border:0.5px solid rgba(138,170,106,0.25);
    border-radius:6px; padding:16px 18px 18px; }
  .pl-grid { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; }
  @media (max-width:860px) { .pl-grid { grid-template-columns:1fr; } }
  .pl-card { background:#0d0d0d; border:0.5px solid rgba(255,255,255,0.07); border-radius:4px;
    padding:16px; display:flex; flex-direction:column; min-width:0; }
  .pl-name { font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.16em; color:#aac88a;
    font-weight:700; }
  .pl-kind { font-family:Georgia,serif; font-style:italic; font-size:11px; color:#666;
    margin:2px 0 10px; }
  .pl-val { font-family:var(--font-mono); font-size:30px; color:#fff; line-height:1;
    margin-bottom:10px; }
  .pl-desc { font-size:11px; color:#888; line-height:1.55; }

  /* ── Departments (per-industry tier containers) ──
     Horizontal bars, same wide shape as the Executive Actions panel:
     one full-width container per department, stacked. */
  .dp-section { margin-top:22px; }
  .dp-grid { display:flex; flex-direction:column; gap:12px; }
  .dp-card { background:#0b0d0a; border:0.5px solid rgba(138,170,106,0.25); border-radius:6px;
    padding:14px 18px; display:flex; align-items:center; gap:22px; min-width:0; }
  .dp-card.empty { opacity:0.5; justify-content:center; border-style:dashed; }
  .dp-id { width:200px; flex-shrink:0; }
  .dp-dept { font-family:var(--font-mono); font-size:8.5px; letter-spacing:0.16em; color:#666;
    font-weight:700; margin-bottom:5px; }
  .dp-tier { font-size:14px; color:#fff; font-weight:600; line-height:1.35; }
  .dp-desc { font-size:11.5px; color:#888; line-height:1.6; flex:1; min-width:0; }
  .dp-effect { font-family:var(--font-mono); font-size:9.5px; color:#8aaa6a; line-height:1.5;
    width:220px; flex-shrink:0; text-align:right; padding-left:18px;
    border-left:0.5px solid rgba(255,255,255,0.06); }
  .dp-card.empty .soon { font-family:Georgia,serif; font-style:italic; font-size:11px; color:#4a4940; }
  @media (max-width:860px) {
    .dp-card { flex-direction:column; align-items:stretch; gap:9px; }
    .dp-id { width:auto; }
    .dp-effect { width:auto; text-align:left; padding-left:0; border-left:none;
      padding-top:9px; border-top:0.5px solid rgba(255,255,255,0.06); }
  }

  /* ── Roles ── */
  .rl-section { margin-top:22px; }
  .rl-panel { background:#0b0d0a; border:0.5px solid rgba(138,170,106,0.25);
    border-radius:6px; padding:16px 18px 18px; position:relative; }
  .rl-post { position:absolute; top:12px; right:16px; padding:7px 14px;
    background:rgba(138,170,106,0.08); border:0.5px solid #4a6a4a; border-radius:4px;
    color:#8aaa6a; font-family:var(--font-mono); font-size:9.5px; letter-spacing:0.13em;
    font-weight:700; cursor:pointer; }
  .rl-post:hover:not(:disabled) { background:rgba(138,170,106,0.18); color:#aac88a; }
  .rl-post:disabled { opacity:0.4; cursor:not-allowed; }
  .rl-empty { padding:24px 16px; text-align:center; color:#555; font-size:11.5px;
    font-style:italic; background:#0d0d0d; border:0.5px dashed rgba(255,255,255,0.08);
    border-radius:4px; }
  .rl-card { background:#0d0d0d; border:0.5px solid rgba(255,255,255,0.07); border-radius:4px;
    margin-bottom:7px; }
  .rl-row { display:flex; align-items:center; gap:14px; padding:11px 14px; }
  .rl-row > div:first-child { min-width:0; overflow-wrap:break-word; }
  .rl-row .nm { font-size:12.5px; color:#fff; font-weight:600; }
  .rl-row .meta { font-family:var(--font-mono); font-size:9.5px; color:#888; margin-top:3px; }
  .rl-row .meta .pay { color:#8aaa6a; }
  .rl-row .ago { margin-left:auto; font-family:Georgia,serif; font-style:italic; font-size:10.5px;
    color:#666; white-space:nowrap; }
  .rl-withdraw { padding:6px 10px; background:transparent; border:0.5px solid #5a3030;
    border-radius:3px; color:#c87a7a; font-family:var(--font-mono); font-size:8.5px;
    letter-spacing:0.1em; font-weight:700; cursor:pointer; flex-shrink:0; }
  .rl-withdraw:hover:not(:disabled) { background:#1a0a0a; }
  .rl-withdraw:disabled { opacity:0.4; cursor:not-allowed; }

  /* Applicants under each posting (owner view) */
  .rl-apps { border-top:0.5px solid rgba(255,255,255,0.07); padding:9px 14px 11px; }
  .rl-apps-h { font-family:var(--font-mono); font-size:8.5px; letter-spacing:0.16em; color:#888;
    font-weight:700; margin-bottom:7px; }
  .ap-grid { display:grid; grid-template-columns: 1.3fr 0.8fr 1.2fr 1fr 0.5fr auto;
    gap:4px 12px; align-items:center; }
  .ap-grid .h { font-family:var(--font-mono); font-size:8px; letter-spacing:0.12em; color:#555;
    font-weight:700; }
  .ap-grid .c { font-size:11px; color:#ccc; min-width:0; overflow-wrap:break-word; }
  .ap-grid .c .tag { font-family:var(--font-mono); font-size:8.5px; color:#8aaa6a; }
  .ap-btns { display:flex; gap:5px; justify-content:flex-end; }
  .ap-btn { padding:4px 8px; border-radius:3px; font-family:var(--font-mono); font-size:8px;
    letter-spacing:0.08em; font-weight:700; cursor:pointer; background:transparent; }
  .ap-btn:disabled { opacity:0.4; cursor:not-allowed; }
  .ap-btn.iv  { border:0.5px solid #4a5a6a; color:#7a9ac8; }
  .ap-btn.iv:hover:not(:disabled)  { background:#0a0f14; }
  .ap-btn.rej { border:0.5px solid #5a3030; color:#c87a7a; }
  .ap-btn.rej:hover:not(:disabled) { background:#1a0a0a; }
  .ap-btn.hr  { border:0.5px solid #4a6a4a; color:#8aaa6a; }
  .ap-btn.hr:hover:not(:disabled)  { background:rgba(138,170,106,0.1); }
  .ap-none { font-size:10.5px; color:#555; font-style:italic; }

  /* ── Registry infobox (right column) ── */
  .bc-box { width:300px; flex-shrink:0; background:#0d0d0d;
    border:0.5px solid rgba(138,170,106,0.35); border-radius:6px; overflow:hidden; }
  .bc-logo { width:100%; aspect-ratio:16/9; background:#10140e; display:flex;
    align-items:center; justify-content:center; border-bottom:0.5px solid rgba(138,170,106,0.25); }
  .bc-logo img { max-width:80%; max-height:80%; object-fit:contain; }
  .bc-logo .ini { font-family:Georgia,serif; font-size:34px; color:#4a6a4a; }
  .bc-rows { padding:14px 16px; }
  .bc-row { padding:8px 0; border-bottom:0.5px solid rgba(255,255,255,0.05); }
  .bc-row:last-child { border-bottom:none; }
  .bc-row .k { font-family:var(--font-mono); font-size:8.5px; letter-spacing:0.14em;
    color:#666; font-weight:700; margin-bottom:3px; }
  .bc-row .v { font-size:12.5px; color:#fff; line-height:1.45; overflow-wrap:break-word; }
  .bc-row .v .dim { color:#888; font-size:11px; }
  .bc-row .v.money { font-family:var(--font-mono); color:#8aaa6a; }
  .bc-row .v a { color:#8aaa6a; text-decoration:none; }
  .bc-foot { padding:12px 16px; border-top:0.5px solid rgba(138,170,106,0.2); }
  .bc-btn { width:100%; padding:10px; background:rgba(138,170,106,0.08);
    border:0.5px solid #4a6a4a; border-radius:4px; color:#8aaa6a;
    font-family:var(--font-mono); font-size:10px; letter-spacing:0.13em; font-weight:700;
    cursor:pointer; }
  .bc-btn:hover:not(:disabled) { background:rgba(138,170,106,0.18); color:#aac88a; }
  .bc-btn:disabled { opacity:0.4; cursor:not-allowed; }
  .bc-foot .err { color:#d9534f; font-size:10px; font-family:var(--font-mono);
    margin-top:6px; min-height:12px; }

  /* ── Post Job Opening modal ── */
  #jm-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.78); display:none;
    align-items:center; justify-content:center; padding:20px; z-index:1000; }
  #jm-overlay.open { display:flex; }
  .jm-modal { width:100%; max-width:640px; background:#0d0d0d;
    border:0.5px solid rgba(138,170,106,0.45); border-radius:8px;
    max-height:90vh; display:flex; flex-direction:column; overflow:hidden; }
  .jm-head { padding:16px 20px 13px; border-bottom:0.5px solid rgba(138,170,106,0.3);
    background:#10140e; }
  .jm-title { font-family:Georgia,serif; font-size:18px; color:#fff; }
  .jm-title em { font-style:italic; color:#aac88a; }
  .jm-body { padding:18px 20px; overflow-y:auto; overflow-x:hidden; }
  .jm-tracks { display:flex; gap:8px; margin-bottom:16px; }
  .jm-track { flex:1; padding:10px; font-family:var(--font-mono); font-size:10.5px;
    letter-spacing:0.08em; font-weight:700; background:#0a0a0a; color:#888;
    border:1px solid rgba(255,255,255,0.1); border-radius:4px; cursor:pointer; text-align:center; }
  .jm-track.sel { background:#10140e; border-color:#8aaa6a; color:#aac88a; }
  .jm-track.locked { opacity:0.35; cursor:not-allowed; }
  .jm-rung { background:#0a0a0a; border:1px solid rgba(255,255,255,0.1); border-radius:4px;
    padding:12px 14px; margin-bottom:8px; cursor:pointer; }
  .jm-rung:hover:not(.locked) { border-color:rgba(138,170,106,0.4); }
  .jm-rung.sel { background:#10140e; border-color:#8aaa6a; }
  .jm-rung.locked { opacity:0.45; cursor:not-allowed; }
  .jm-rung .top { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .jm-rung .nm { font-size:13px; color:#fff; font-weight:600; }
  .jm-rung .rung-no { font-family:var(--font-mono); font-size:8.5px; letter-spacing:0.14em;
    color:#666; font-weight:700; }
  .jm-rung .staff { font-family:var(--font-mono); font-size:9px; color:#8aaa6a; white-space:nowrap; }
  .jm-rung .ds { font-size:11px; color:#888; line-height:1.55; margin-top:5px; }
  .jm-rung .resp { font-family:var(--font-mono); font-size:9px; color:#aac88a; margin-top:6px; }
  .jm-rung .resp .k { color:#666; }
  .jm-lab { font-family:var(--font-mono); font-size:9px; letter-spacing:0.14em; color:#888;
    font-weight:700; margin:14px 0 6px; }
  .jm-expected { font-family:var(--font-mono); font-size:12px; color:#8aaa6a; }
  .jm-expected .dim { color:#666; font-size:10px; }
  .jm-select { width:100%; box-sizing:border-box; padding:10px 12px; background:#0a0a0a;
    border:1px solid rgba(255,255,255,0.1); border-radius:4px; color:#fff; font-size:12px;
    font-family:var(--font-mono); }
  .jm-pills { display:flex; gap:8px; }
  .jm-pill { flex:1; padding:9px; font-family:var(--font-mono); font-size:10px;
    letter-spacing:0.08em; font-weight:700; background:#0a0a0a; color:#888;
    border:1px solid rgba(255,255,255,0.1); border-radius:4px; cursor:pointer; text-align:center; }
  .jm-pill.sel { background:#10140e; border-color:#8aaa6a; color:#aac88a; }
  .jm-foot { padding:13px 20px; background:#10140e; border-top:0.5px solid rgba(138,170,106,0.25);
    display:flex; gap:10px; justify-content:flex-end; }
  .jm-btn { padding:9px 16px; background:rgba(138,170,106,0.08); border:0.5px solid #4a6a4a;
    border-radius:4px; color:#8aaa6a; font-family:var(--font-mono); font-size:10px;
    letter-spacing:0.13em; font-weight:700; cursor:pointer; }
  .jm-btn:hover:not(:disabled) { background:rgba(138,170,106,0.18); color:#aac88a; }
  .jm-btn:disabled { opacity:0.4; cursor:not-allowed; }
  .jm-btn.secondary { background:transparent; border-color:#3a3a3a; color:#888; }

  @media (max-width:860px) {
    .bc-wrap { flex-direction:column-reverse; }
    .bc-box { width:100%; }
  }
  #loading { font-family:var(--font-mono); font-size:10px; color:#4a4940;
    text-align:center; padding:80px 20px; }
</style>
</head>
<body>

<div id="ent-topbar"></div>
<div id="loading">LOADING...</div>
<div class="ent-content" id="page-content" style="display:none;">
  <div class="bc-wrap">
    <div class="bc-main">
      <h1 class="bc-title" id="bc-name">—</h1>
      <div class="bc-sub" id="bc-tagline">—</div>
      <div id="bc-ops"></div>
      <div class="pl-section" id="bc-pillars"></div>
      <div class="dp-section" id="bc-departments"></div>
      <div class="rl-section" id="bc-roles"></div>
    </div>
    <div class="bc-box">
      <div class="bc-logo" id="bc-logo"><span class="ini">—</span></div>
      <div class="bc-rows" id="bc-rows"></div>
      <div class="bc-foot" id="bc-foot" style="display:none;">
        <button type="button" class="bc-btn" id="bc-rebrand">REBRAND</button>
        <input type="file" id="bc-logo-file" accept="image/png,image/jpeg,image/svg+xml,image/webp" style="display:none;">
        <div class="err" id="bc-rebrand-err"></div>
      </div>
    </div>
  </div>
</div>

<div id="jm-overlay">
  <div class="jm-modal">
    <div class="jm-head"><div class="jm-title">Post a <em>Job Opening</em></div></div>
    <div class="jm-body">
      <div class="jm-tracks">
        <div class="jm-track sel" data-track="operations">OPERATIONS</div>
        <div class="jm-track locked" title="Coming soon">FINANCE</div>
        <div class="jm-track locked" title="Coming soon">LEADERSHIP</div>
      </div>
      <div id="jm-rungs"></div>
      <div class="jm-lab">EXPECTED SALARY</div>
      <div class="jm-expected" id="jm-expected">—</div>
      <div class="jm-lab">YOUR SALARY OFFERING</div>
      <select class="jm-select" id="jm-offer"></select>
      <div class="jm-lab">GLOBAL CANDIDATES OR LOCAL?</div>
      <div class="jm-pills">
        <div class="jm-pill sel" data-reach="local">LOCAL</div>
        <div class="jm-pill" data-reach="global">GLOBAL</div>
      </div>
    </div>
    <div class="jm-foot">
      <button type="button" class="jm-btn secondary" id="jm-cancel">CANCEL</button>
      <button type="button" class="jm-btn" id="jm-post" disabled title="Select a rung first">POST OPENING</button>
    </div>
  </div>
</div>

<script type="module">
import { _supabase } from './js/supabase-client.js';
import { bootstrapBusinessman } from './js/entrepreneur-topbar.js';
import { hfFmtBig, escapeHtml as esc, industryTitleLabel, postedMonthsAgo, displayName } from './js/utils.js';
import { openInterviewChat } from './js/job-interview-chat.js';

(async () => {
  try {
    const ctx = await bootstrapBusinessman('corporations');
    if (!ctx) return; // redirected (no auth / no businessman faction)

    const corpId = new URLSearchParams(window.location.search).get('id');
    if (!corpId) {
      document.getElementById('loading').textContent = 'NO CORPORATION SPECIFIED';
      return;
    }

    const { data: corp, error } = await _supabase.from('entrepreneur_corps')
      .select(`id, name, industry, listing, hq_city, logo_url, employee_count, owner_faction_id, pillar_speed, pillar_efficiency, pillar_quality,
               nation:nations!hq_nation_id(name, wages, standard_of_living),
               owner:factions!owner_faction_id(faction_name, leader_first_name, leader_last_name, nickname)`)
      .eq('id', corpId).maybeSingle();
    if (error) throw error;
    if (!corp) {
      document.getElementById('loading').textContent = 'CORPORATION NOT FOUND';
      return;
    }

    const isOwner = corp.owner_faction_id === ctx.faction.id;
    const currentTick = Number(ctx.shard?.current_tick) || 0;

    // Revenue (current year) from the one source — corp_revenue_by_year
    // reads the stamp accumulator (20270780). Soft-fails to $0.
    let revenueYtd = 0;
    try {
      const { data: rev, error: revErr } = await _supabase.rpc('corp_revenue_by_year', {
        p_corp_id: corp.id, p_current_tick: currentTick,
      });
      if (revErr) throw revErr;
      if (rev?.success) revenueYtd = Number(rev.this_year_delta) || 0;
    } catch (e) {
      console.warn('[business-corp] revenue fetch failed:', e?.message || e);
    }

    const ownerName = [corp.owner?.leader_first_name, corp.owner?.leader_last_name]
      .filter(Boolean).join(' ') || corp.owner?.faction_name || '—';
    const hqLine  = `${corp.hq_city || '—'}, ${corp.nation?.name || '—'}`;
    // Type starts Private; Public via IPO; State is a future status.
    const typeLabel = corp.listing === 'public' ? 'Public' : 'Private';
    // {corpname}.nh — lowercase alphanumerics of the corp name.
    const site = (corp.name || '').toLowerCase().replace(/[^a-z0-9]+/g, '') + '.nh';

    document.title = `${corp.name} | Nationhood`;
    document.getElementById('bc-name').textContent = corp.name;
    document.getElementById('bc-tagline').textContent =
      `${industryTitleLabel(corp.industry).toUpperCase()} · ${(corp.hq_city || corp.nation?.name || '—').toUpperCase()}`;

    const logoEl = document.getElementById('bc-logo');
    if (corp.logo_url) {
      logoEl.innerHTML = `<img src="${esc(corp.logo_url)}" alt="${esc(corp.name)} logo"
        onerror="this.parentElement.innerHTML='<span class=&quot;ini&quot;>${esc((corp.name || '?')[0])}</span>'">`;
    } else {
      logoEl.innerHTML = `<span class="ini">${esc((corp.name || '?').slice(0, 2).toUpperCase())}</span>`;
    }

    document.getElementById('bc-rows').innerHTML = `
      <div class="bc-row"><div class="k">CORPORATION</div>
        <div class="v">${esc(corp.name)}</div></div>
      <div class="bc-row"><div class="k">HEADQUARTERS</div>
        <div class="v">${esc(hqLine)}</div></div>
      <div class="bc-row"><div class="k">NUMBER OF EMPLOYEES</div>
        <div class="v">${esc(String(corp.employee_count ?? 1))}</div></div>
      <div class="bc-row"><div class="k">TYPE</div>
        <div class="v">${esc(typeLabel)}</div></div>
      <div class="bc-row"><div class="k">SECTOR</div>
        <div class="v">${esc(industryTitleLabel(corp.industry))}</div></div>
      <div class="bc-row"><div class="k">KEY PEOPLE</div>
        <div class="v">${esc(ownerName)} <span class="dim">· Owner</span></div></div>
      <div class="bc-row"><div class="k">REVENUE</div>
        <div class="v money">${esc(hfFmtBig(revenueYtd))} <span class="dim">(current year)</span></div></div>
      <div class="bc-row"><div class="k">WEBSITE</div>
        <div class="v"><a>${esc(site)}</a></div></div>`;

    // Core Metrics — the three pillars. VALUES come from the corp's
    // pillar columns (20270794, all start at 1; upgrades increment
    // there); the per-industry LABELS and copy live here. Only
    // construction's trio is chartered so far.
    const PILLARS = {
      construction: [
        { col: 'pillar_speed', name: 'STRUCTURAL SPEED', kind: 'Throughput',
          desc: 'Decreases the baseline number of ticks required to deliver a finished building. Faster completion liquidates contracts quickly, avoiding penalties and freeing up your project queue.' },
        { col: 'pillar_efficiency', name: 'PROCUREMENT EFFICIENCY', kind: 'Cost Reduction',
          desc: 'Reflects your vertical supply-chain dominance. Higher efficiency permanently slashes the baseline corporate cash you must spend out-of-pocket on the raw steel, concrete, and aggregates a project requires.' },
        { col: 'pillar_quality', name: 'ENGINEERING QUALITY', kind: 'Value-Add',
          desc: 'Applies a permanent, positive performance modifier to the completed building. A high-tier builder delivers an Assembly Plant granting +0.3 GDP growth instead of the baseline +0.2 — and charges premium margins for it.' },
      ],
    };
    const pillars = PILLARS[corp.industry];
    if (pillars) {
      document.getElementById('bc-pillars').innerHTML = `
        <div class="pl-panel">
          <div class="ea-head"><span class="rule"></span><span class="t">CORE METRICS</span><span class="rule"></span></div>
          <div class="pl-grid">
            ${pillars.map(p => `
              <div class="pl-card">
                <div class="pl-name">${esc(p.name)}</div>
                <div class="pl-kind">${esc(p.kind)}</div>
                <div class="pl-val">${esc(String(corp[p.col] ?? 1))}</div>
                <div class="pl-desc">${esc(p.desc)}</div>
              </div>`).join('')}
          </div>
        </div>`;
    }

    // Departments — five per-industry tier containers. Every corp
    // starts at its industry's entry tier; these baselines are
    // display copy until upgrade mechanics land (tier state moves to
    // columns then). Construction has four chartered so far — the
    // fifth slot (and the automotive set) render as placeholders
    // until designed.
    const DEPARTMENTS = {
      construction: [
        { dept: 'PROJECT MANAGEMENT', tier: 'The Truck & Clipboard',
          desc: 'You handle all local permitting, contract estimates, and safety compliance yourself out of the cab of your truck. Administrative bottlenecks limit you to chasing one tiny contract at a time.',
          effect: 'Number of Active Projects: 1' },
        { dept: 'HEAVY EQUIPMENT', tier: 'Level 0: Commercial Rental Yard',
          desc: 'Your physical yard is completely empty. You own zero iron. Every time you secure a contract, you must lease skid-steers or excavators at a high per-turn premium.',
          effect: 'Construction Project costs require equipment rentals.' },
        { dept: 'SUPPLY & MATERIAL', tier: 'Retail Hardware Store',
          desc: 'You buy concrete mix, lumber, and rebar directly from retail commercial distributors or local suppliers at standard market prices with zero bulk discounts.',
          effect: 'Construction Project costs require standard upfront prices.' },
        { dept: 'SYSTEM DESIGN', tier: 'CAD System & Laptop',
          desc: 'You implement your own designs, limited by your own project expertise.',
          effect: 'You gain Experience at +3 per completed project.' },
        { dept: 'REGULATORY COMPLIANCE', tier: 'City Permits',
          desc: 'Your licensing stops at the city clerk\u2019s counter. You\u2019re cleared for small-scale municipal work \u2014 anything bigger needs certifications you don\u2019t hold yet.',
          effect: 'Can only build \u2018Residential\u2019 and \u2018Tier I Commercial\u2019.' },
      ],
      automotive: [null, null, null, null, null],
    };
    const depts = DEPARTMENTS[corp.industry];
    if (depts) {
      document.getElementById('bc-departments').innerHTML =
        '<div class="dp-grid">' + depts.map(d => d
          ? `<div class="dp-card">
              <div class="dp-id">
                <div class="dp-dept">${esc(d.dept)}</div>
                <div class="dp-tier">${esc(d.tier)}</div>
              </div>
              <div class="dp-desc">${esc(d.desc)}</div>
              <div class="dp-effect">${esc(d.effect)}</div>
            </div>`
          : `<div class="dp-card empty" title="Coming soon">
              <div class="soon">(To be chartered)</div>
            </div>`).join('') + '</div>';
    }

    // Roles — the corp's job board. Openings will list here and on the
    // career page's Available Roles. The posting button (owner-only,
    // construction corps for now — its ladder is the only one
    // chartered) opens the Post Job Opening modal.
    const canPost = isOwner && corp.industry === 'construction';
    document.getElementById('bc-roles').innerHTML = `
      <div class="rl-panel">
        ${isOwner ? `<button type="button" class="rl-post" id="rl-post-btn"${canPost ? '' : ' disabled title="Coming soon"'}>POST JOB OPENING</button>` : ''}
        <div class="ea-head"><span class="rule"></span><span class="t">ROLES</span><span class="rule"></span></div>
        <div id="rl-list"><div class="rl-empty">Loading…</div></div>
      </div>`;

    // Applicant name cell: players carry their live nickname in
    // parens — or a [player] tag when they haven't set one — so the
    // owner can tell them apart from the NPC pool at a glance.
    function applicantNameHtml(a) {
      const base = esc(a.name);
      if (!a.applicant_faction_id) return base;
      const nick = (a.applicant?.nickname || '').trim();
      return nick ? `${base} <span class="tag">(${esc(nick)})</span>`
                  : `${base} <span class="tag">[player]</span>`;
    }

    async function loadRoles() {
      const host = document.getElementById('rl-list');
      try {
        const { data, error: rlErr } = await _supabase.from('job_openings')
          .select('id, title, salary_yearly, reach, posted_at_tick')
          .eq('corp_id', corp.id).eq('status', 'open')
          .order('rung');
        if (rlErr) throw rlErr;
        if (!data?.length) {
          host.innerHTML = '<div class="rl-empty">No open positions.</div>';
          return;
        }

        // The applicant stack is the owner's hiring desk; everyone
        // else just sees the posting.
        let appsByOpening = {};
        if (isOwner) {
          const { data: apps, error: apErr } = await _supabase.from('job_applicants')
            .select('id, opening_id, name, city, current_employment, current_title, years_experience, applicant_faction_id, applicant:factions!applicant_faction_id(nickname)')
            .in('opening_id', data.map(o => o.id))
            .eq('status', 'applied')
            .order('created_at');
          if (apErr) throw apErr;
          for (const a of (apps || [])) {
            (appsByOpening[a.opening_id] ||= []).push(a);
          }
        }

        host.innerHTML = data.map(o => {
          const apps = appsByOpening[o.id] || [];
          const appsHtml = !isOwner ? '' : `
            <div class="rl-apps">
              <div class="rl-apps-h">APPLICANTS (${apps.length})</div>
              ${!apps.length ? '<div class="ap-none">No applicants yet.</div>' : `
              <div class="ap-grid">
                <div class="h">NAME</div><div class="h">CITY</div><div class="h">CURRENT EMPLOYMENT</div><div class="h">CURRENT TITLE</div><div class="h">YRS EXP</div><div class="h"></div>
                ${apps.map(a => `
                  <div class="c">${applicantNameHtml(a)}</div>
                  <div class="c">${esc(a.city)}</div>
                  <div class="c">${esc(a.current_employment)}</div>
                  <div class="c">${esc(a.current_title)}</div>
                  <div class="c">${esc(String(a.years_experience))}</div>
                  <div class="ap-btns">
                    ${a.applicant_faction_id ? `<button type="button" class="ap-btn iv" data-app="${esc(a.id)}">INTERVIEW</button>` : ''}
                    <button type="button" class="ap-btn rej" data-app="${esc(a.id)}">REJECT</button>
                    <button type="button" class="ap-btn hr" data-app="${esc(a.id)}">HIRE</button>
                  </div>`).join('')}
              </div>`}
            </div>`;
          return `
          <div class="rl-card">
            <div class="rl-row">
              <div>
                <div class="nm">${esc(o.title)}</div>
                <div class="meta"><span class="pay">${esc(hfFmtBig(Number(o.salary_yearly) || 0))} / year</span> &middot; ${o.reach === 'global' ? 'Global candidates' : 'Local candidates'}</div>
              </div>
              <span class="ago">${esc(postedMonthsAgo(o.posted_at_tick, currentTick))}</span>
              ${isOwner ? `<button type="button" class="rl-withdraw" data-opening="${esc(o.id)}">WITHDRAW</button>` : ''}
            </div>
            ${appsHtml}
          </div>`;
        }).join('');

        const flatApps = Object.values(appsByOpening).flat();
        const titleByOpening = Object.fromEntries(data.map(o => [o.id, o.title]));

        // [HIRE] fills the opening and bumps the headcount shown in
        // the registry box — full reload keeps every surface honest.
        host.querySelectorAll('.ap-btn.hr').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (!confirm('Hire this applicant? This fills the opening.')) return;
            btn.disabled = true;
            try {
              const { data: res, error: hErr } = await _supabase.rpc('hire_job_applicant',
                { p_applicant_id: btn.dataset.app });
              if (hErr) throw hErr;
              if (!res?.success) throw new Error(res?.reason || 'unknown');
              window.location.reload();
            } catch (e) {
              alert('Could not hire: ' + (e?.message || e));
              btn.disabled = false;
            }
          });
        });

        host.querySelectorAll('.ap-btn.rej').forEach(btn => {
          btn.addEventListener('click', async () => {
            btn.disabled = true;
            try {
              const { data: res, error: rErr } = await _supabase.rpc('reject_job_applicant',
                { p_applicant_id: btn.dataset.app });
              if (rErr) throw rErr;
              if (!res?.success) throw new Error(res?.reason || 'unknown');
              loadRoles();
            } catch (e) {
              alert('Could not reject: ' + (e?.message || e));
              btn.disabled = false;
            }
          });
        });

        // [INTERVIEW] — player applicants only; opens (or reopens)
        // the private chat.
        host.querySelectorAll('.ap-btn.iv').forEach(btn => {
          btn.addEventListener('click', async () => {
            const app = flatApps.find(a => a.id === btn.dataset.app);
            if (!app) return;
            btn.disabled = true;
            try {
              const { data: res, error: sErr } = await _supabase.rpc('start_job_interview',
                { p_applicant_id: app.id });
              if (sErr) throw sErr;
              if (!res?.success) throw new Error(res?.reason || 'unknown');
              openInterviewChat({
                interviewId: res.interview_id,
                applicantId: app.id,
                heading: `JOB INTERVIEW — ${titleByOpening[app.opening_id] || 'Role'} for ${corp.name}`,
                canManage: true,
                myFactionId: ctx.faction.id,
                names: {
                  [corp.owner_faction_id]: displayName(corp.owner),
                  [app.applicant_faction_id]: app.name,
                },
                onHired: () => window.location.reload(),
              });
            } catch (e) {
              alert('Could not start interview: ' + (e?.message || e));
            } finally {
              btn.disabled = false;
            }
          });
        });

        host.querySelectorAll('.rl-withdraw').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (btn.dataset.busy === '1') return;
            if (!confirm('Withdraw this opening?')) return;
            btn.dataset.busy = '1'; btn.disabled = true;
            try {
              const { data: res, error: wErr } = await _supabase.rpc('withdraw_job_opening',
                { p_opening_id: btn.dataset.opening });
              if (wErr) throw wErr;
              if (!res?.success) throw new Error(res?.reason || 'unknown');
              loadRoles();
            } catch (e) {
              alert('Withdraw failed: ' + (e?.message || e));
              btn.dataset.busy = '0'; btn.disabled = false;
            }
          });
        });
      } catch (e) {
        host.innerHTML = `<div class="rl-empty">Could not load openings — ${esc(e?.message || 'try again')}.</div>`;
      }
    }
    loadRoles();

    // ── Post Job Opening modal ─────────────────────────────────────
    // The Operations ladder, six rungs. Rungs with full charters are
    // postable; the ones still being designed render dimmed with
    // their placeholders. On-staff counts default to 0 — there is no
    // per-rung staff yet; hiring will count real rows here.
    const OPS_LADDER = [
      { rung: 1, name: 'Project Manager (PM)', postable: true,
        desc: 'You own the execution of a single contract from start to finish. You handle the scheduling, solve logistical bottlenecks on-site, and aggressively push the Advance Build action to deliver the project on time.',
        resp: 'Required to have an active project.' },
      { rung: 2, name: 'Senior Project Manager', postable: true,
        desc: 'You manage multiple simultaneous sub-contracts. You coordinate the allocation of the firm\u2019s shared resources, ensuring that a single rented excavator is seamlessly moved between sites without sitting idle for a single tick.',
        resp: 'Required to have an active project, but often works quicker.' },
      { rung: 3, name: 'Regional Director of Operations', postable: true,
        desc: 'You oversee the entire field portfolio of the firm. You establish construction standard operating procedures, negotiate long-term agreements with specialized labor crews, and manage macro-level capacity bottlenecks.',
        resp: 'Required to oversee multiple projects.' },
      { rung: 4, name: 'National Director of Operations', postable: false,
        desc: '(Description pending)', resp: '???' },
      { rung: 5, name: 'Global Director of Operations', postable: false,
        desc: '(Description pending)', resp: '???' },
      { rung: 6, name: 'Chief Operating Officer (COO)', postable: false,
        desc: 'The ultimate operational authority. You sit next to the founder and dictate corporate execution velocity. You decide how to split the firm\u2019s construction capacity across player B2B contracts and high-yield infrastructure builds.',
        resp: '???' },
    ];
    let jmRung = null;

    function jmRenderSalary(expectedYearly) {
      const exp = document.getElementById('jm-expected');
      const sel = document.getElementById('jm-offer');
      if (!jmRung) {
        exp.innerHTML = '<span class="dim">Select a rung above.</span>';
        sel.innerHTML = '<option>Select a rung first</option>';
        sel.disabled = true;
        return;
      }
      exp.innerHTML = `${esc(hfFmtBig(expectedYearly))} / year <span class="dim">(${esc(hfFmtBig(Math.round(expectedYearly / 12)))} per tick)</span>`;
      sel.disabled = false;
      sel.innerHTML = [0.5, 0.75, 1, 1.25, 1.5].map(m => {
        const v = Math.round(expectedYearly * m);
        return `<option value="${v}"${m === 1 ? ' selected' : ''}>${hfFmtBig(v)} / year${m === 1 ? ' — expected' : ` (${Math.round(m * 100)}% of expected)`}</option>`;
      }).join('');
    }

    function openJobModal() {
      jmRung = null;
      // Expected salary = wages × standard_of_living × 30 — the
      // original × 100 anchor cut by 70% to fit small-economy nations
      // like Sierramar. Must match post_job_opening's server band.
      // Stats ride the corp query's nation embed — no extra fetch.
      const w   = Math.max(1, Number(corp.nation?.wages) || 50);
      const sol = Math.max(1, Number(corp.nation?.standard_of_living) || 50);
      const expectedYearly = Math.round(w * sol * 30);
      const host = document.getElementById('jm-rungs');
      host.innerHTML = OPS_LADDER.map(r => `
        <div class="jm-rung${r.postable ? '' : ' locked'}" data-rung="${r.rung}" ${r.postable ? '' : 'title="Being chartered"'}>
          <div class="top">
            <div>
              <div class="rung-no">RUNG ${r.rung}</div>
              <div class="nm">${esc(r.name)}</div>
            </div>
            <span class="staff">ON STAFF: 0</span>
          </div>
          <div class="ds">${esc(r.desc)}</div>
          <div class="resp"><span class="k">RESPONSIBILITIES:</span> ${esc(r.resp)}</div>
        </div>`).join('');
      host.querySelectorAll('.jm-rung:not(.locked)').forEach(row => {
        row.addEventListener('click', () => {
          jmRung = Number(row.dataset.rung);
          host.querySelectorAll('.jm-rung').forEach(x => x.classList.toggle('sel', x === row));
          jmRenderSalary(expectedYearly);
          const postBtn = document.getElementById('jm-post');
          postBtn.disabled = false;
          postBtn.title = '';
        });
      });
      jmRenderSalary(expectedYearly);
      const postBtn = document.getElementById('jm-post');
      postBtn.disabled = true;
      postBtn.title = 'Select a rung first';
      document.getElementById('jm-overlay').classList.add('open');
    }

    if (canPost) {
      document.getElementById('rl-post-btn').addEventListener('click', openJobModal);
      document.getElementById('jm-cancel').addEventListener('click', () =>
        document.getElementById('jm-overlay').classList.remove('open'));
      document.getElementById('jm-overlay').addEventListener('click', (e) => {
        if (e.target?.id === 'jm-overlay') document.getElementById('jm-overlay').classList.remove('open');
      });
      document.querySelectorAll('.jm-pill').forEach(p => {
        p.addEventListener('click', () => {
          document.querySelectorAll('.jm-pill').forEach(x => x.classList.toggle('sel', x === p));
        });
      });
      let jmInFlight = false;
      document.getElementById('jm-post').addEventListener('click', async () => {
        if (jmInFlight || !jmRung) return;
        const btn = document.getElementById('jm-post');
        jmInFlight = true; btn.disabled = true;
        const prev = btn.textContent; btn.textContent = 'POSTING…';
        try {
          const salary = Number(document.getElementById('jm-offer').value) || 0;
          const reach = document.querySelector('.jm-pill.sel')?.dataset.reach || 'local';
          const { data, error: pErr } = await _supabase.rpc('post_job_opening', {
            p_corp_id: corp.id, p_track: 'operations', p_rung: jmRung,
            p_salary_yearly: salary, p_reach: reach,
          });
          if (pErr) throw pErr;
          if (!data?.success) {
            const REASON = {
              invalid_track: 'That track is not hiring yet.',
              invalid_rung: 'That rung is not chartered yet.',
              invalid_reach: 'Pick Local or Global.',
              corp_not_found: 'Corporation not found.',
              industry_not_chartered: 'Only Construction corps can post openings right now.',
              not_owner: 'Only the owner can post openings.',
              arrested: 'You are under arrest — your assets are frozen.',
              salary_out_of_band: 'That offer is too far from the expected salary.',
              already_open: 'This role already has an open posting.',
            };
            throw new Error(REASON[data?.reason] || data?.reason || 'unknown');
          }
          document.getElementById('jm-overlay').classList.remove('open');
          loadRoles();
        } catch (e) {
          alert('Could not post: ' + (e?.message || e));
        } finally {
          jmInFlight = false; btn.disabled = false; btn.textContent = prev;
        }
      });
    }

    // Rebrand — owner-only: pick an image (2MB cap, same corp-logos
    // bucket the founding modal uses), upload, stamp logo_url via the
    // owner-writes RLS policy, and swap the logo in place.
    if (isOwner) {
      const foot = document.getElementById('bc-foot');
      const fileEl = document.getElementById('bc-logo-file');
      const btn = document.getElementById('bc-rebrand');
      const errEl = document.getElementById('bc-rebrand-err');
      foot.style.display = 'block';
      btn.addEventListener('click', () => { errEl.textContent = ''; fileEl.click(); });
      fileEl.addEventListener('change', async () => {
        const file = fileEl.files?.[0];
        if (!file) return;
        if (file.size > 2 * 1024 * 1024) {
          errEl.textContent = 'Logo is over 2MB — choose a smaller image.';
          fileEl.value = '';
          return;
        }
        btn.disabled = true;
        btn.textContent = 'UPLOADING…';
        try {
          const ext = (file.name.split('.').pop() || 'png').toLowerCase();
          const path = `${ctx.faction.id}/${Date.now()}.${ext}`;
          const { error: upErr } = await _supabase.storage.from('corp-logos')
            .upload(path, file, { contentType: file.type || 'image/png' });
          if (upErr) throw new Error('Upload failed: ' + upErr.message);
          const logoUrl = _supabase.storage.from('corp-logos').getPublicUrl(path)?.data?.publicUrl;
          if (!logoUrl) throw new Error('Could not resolve logo URL.');
          const { data: updated, error: updErr } = await _supabase.from('entrepreneur_corps')
            .update({ logo_url: logoUrl }).eq('id', corp.id).select('id');
          if (updErr) throw updErr;
          if (!updated?.length) throw new Error('Not authorized to rebrand this corporation.');
          logoEl.innerHTML = `<img src="${esc(logoUrl)}" alt="${esc(corp.name)} logo">`;
        } catch (e) {
          errEl.textContent = e?.message || 'Rebrand failed.';
        } finally {
          btn.disabled = false;
          btn.textContent = 'REBRAND';
          fileEl.value = '';
        }
      });
    }

    // Executive Actions — owner-only surface. Five slots, all coming
    // soon; the "1 remaining" allowance is the per-tick default and
    // becomes derived state when the first action lands.
    if (isOwner) {
      document.getElementById('bc-ops').innerHTML = `
        <div class="ea-panel">
          <span class="ea-remaining">1 remaining</span>
          <div class="ea-head"><span class="rule"></span><span class="t">EXECUTIVE ACTIONS</span><span class="rule"></span></div>
          <div class="ea-grid">
            ${Array.from({ length: 5 }, () => `
              <div class="ea-card" title="Coming soon">
                <div class="ic">—</div>
                <div class="nm">ACTION</div>
                <div class="soon">(Coming Soon)</div>
              </div>`).join('')}
          </div>
        </div>`;
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('page-content').style.display = 'block';
  } catch (err) {
    console.error('business-corp: load failed', err);
    document.getElementById('loading').textContent = 'FAILED TO LOAD — PLEASE REFRESH';
  }
})();
</script>
</body>
</html>
