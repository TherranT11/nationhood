// ==================== DECAY TABLE ====================
// Funding % -> decay per tick (your adjusted version: <100% starts losing)
function getDecayRate(pct) {
    if (pct >= 100) return null;
    if (pct >= 90)  return { primary: '-0.3/tick', secondary: null };
    if (pct >= 75)  return { primary: '-0.5/tick', secondary: '-0.2/tick' };
    if (pct >= 50)  return { primary: '-0.9/tick', secondary: '-0.5/tick' };
    if (pct >= 25)  return { primary: '-1.7/tick', secondary: '-0.9/tick' };
    return { primary: '-2.7/tick', secondary: '-1.7/tick' };
}

function getFundingLabel(pct) {
    if (pct >= 100) return { label: 'FULLY FUNDED', color: '#22c55e', bg: 'rgba(34,197,94,0.1)' };
    if (pct >= 90)  return { label: 'STRETCHED',    color: '#a3e635', bg: 'rgba(163,230,53,0.08)' };
    if (pct >= 75)  return { label: 'STRAINED',     color: '#facc15', bg: 'rgba(250,204,21,0.08)' };
    if (pct >= 50)  return { label: 'UNDERFUNDED',   color: '#f97316', bg: 'rgba(249,115,22,0.08)' };
    if (pct >= 25)  return { label: 'CRITICAL',      color: '#ef4444', bg: 'rgba(239,68,68,0.1)' };
    return { label: 'COLLAPSED', color: '#dc2626', bg: 'rgba(220,38,38,0.15)' };
}

// ==================== STATE ====================
let currentNation = null;
let currentFaction = null;
let isPresidential = false;
let ministryData = [];
let budgetAllocations = {};
let budgetItemAllocations = {};  // { itemId: { allocated, needed } } from budget_item_allocations
let selectedMinistryKey = null;
let activeDetailTab = 'institutions';
let policyUsage = {};     // { action_key: count }
let policyCooldowns = {}; // { action_key: tickWhenReady }

// ==================== INIT ====================
initPage('ministry-actions', async (state) => {
    currentNation = state.nation;
    currentFaction = state.faction;
    isPresidential = isGovernmentPresidential(currentNation);

    // Fetch all active ministries
    const { data } = await _supabase.from('ministries')
        .select('*, factions(faction_name, party_color, party_logo)')
        .eq('nation_id', currentNation.id)
        .eq('is_active', true);
    ministryData = data || [];

    // Fetch current budget allocations (from last passed budget bill)
    if (currentNation.last_budget_bill_id) {
        const { data: allocs } = await _supabase.from('budget_allocations')
            .select('fiscal_category, allocation_amount, fulfilled_cost, discretionary_amount')
            .eq('bill_id', currentNation.last_budget_bill_id);
        if (allocs) {
            for (const a of allocs) {
                budgetAllocations[a.fiscal_category] = {
                    allocated: Number(a.allocation_amount) || 0,
                    needed: Number(a.fulfilled_cost) || 0,
                    discretionary: Number(a.discretionary_amount) || 0
                };
            }
        }

        // Fetch per-institution allocations from budget_item_allocations
        const { data: itemAllocs } = await _supabase.from('budget_item_allocations')
            .select('item_id, allocation_amount, needed_amount')
            .eq('bill_id', currentNation.last_budget_bill_id)
            .eq('item_type', 'institution');
        if (itemAllocs) {
            for (const ia of itemAllocs) {
                budgetItemAllocations[ia.item_id] = {
                    allocated: Number(ia.allocation_amount) || 0,
                    needed: Number(ia.needed_amount) || 0
                };
            }
        }
    }

    // Load admin-configured institution overrides from DB
    const { data: instConfig, error: instConfigErr } = await _supabase.from('ministry_institution_config').select('*');
    if (!instConfigErr && instConfig && instConfig.length > 0) {
        for (const row of instConfig) {
            const insts = MINISTRY_INSTITUTIONS[row.ministry_key];
            if (!insts) continue;
            const inst = insts.find(i => i.id === row.id);
            if (!inst) continue;
            inst.baseCostPerCapita = Number(row.base_cost_per_capita) || inst.baseCostPerCapita;
            inst.scalingType = row.scaling_type || 'population';
            if (inst.scalingType === 'gdp') {
                inst.baseCostFormula = inst.baseCostPerCapita + '% \u00D7 GDP';
            } else {
                inst.baseCostFormula = '$' + inst.baseCostPerCapita + ' \u00D7 population';
            }
            inst.costShare = Number(row.cost_share) || inst.costShare;
            if (row.primary_stat) inst.primaryStat = { key: row.primary_stat, label: row.primary_stat.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) };
            if (row.secondary_stat) inst.secondaryStat = { key: row.secondary_stat, label: row.secondary_stat.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) };
        }
    }

    // Fetch policy usage counts from ministry_action_log
    const { data: actionLogs } = await _supabase.from('ministry_action_log')
        .select('action_key, applied_at_tick, processed')
        .eq('nation_id', currentNation.id);
    if (actionLogs) {
        for (const log of actionLogs) {
            policyUsage[log.action_key] = (policyUsage[log.action_key] || 0) + 1;
            // Track cooldowns: find the most recent use
            if (!log.processed) {
                policyCooldowns[log.action_key] = log.applied_at_tick;
            }
        }
    }

    renderPage();
});

// ==================== FORMAT HELPERS ====================
function fmtCurrency(val) {
    if (val == null) return '$0';
    val = Number(val);
    const sign = val < 0 ? '-' : '';
    const abs = Math.abs(val);
    if (abs >= 1e12) return sign + '$' + (abs / 1e12).toFixed(1) + 'T';
    if (abs >= 1e9)  return sign + '$' + (abs / 1e9).toFixed(1) + 'B';
    if (abs >= 1e6)  return sign + '$' + (abs / 1e6).toFixed(1) + 'M';
    return sign + '$' + Math.round(abs).toLocaleString();
}

function esc(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
}

function renderPage() {
    const area = document.getElementById('content-area');
    const keys = isPresidential
        ? MINISTRY_KEYS.filter(k => k !== 'prime_minister')
        : MINISTRY_KEYS;

    if (!selectedMinistryKey || !keys.includes(selectedMinistryKey)) {
        selectedMinistryKey = keys[0];
    }

    let h = '';

    // ===== MINISTRY SELECTOR BAR =====
    h += '<div class="ministry-selector-bar">';
    h += '<div class="ministry-selector-scroll">';
    for (const key of keys) {
        const label = getButtonLabel(key);
        const icon = MINISTRY_ICONS[key] || '';
        const isActive = key === selectedMinistryKey;
        const ministry = ministryData.find(m => m.ministry_key === key);
        const isFilled = ministry && ministry.minister_first_name;
        const isMyMinistry = ministry && ministry.party_id === currentFaction?.id;
        const pColor = ministry?.factions?.party_color || null;
        const pName = ministry?.factions?.faction_name || null;
        const dot = isFilled ? '<span class="msb-dot filled"></span>' : '<span class="msb-dot vacant"></span>';

        h += `<button class="msb-btn${isActive ? ' active' : ''}${isMyMinistry ? ' mine' : ''}" data-key="${key}" onclick="selectMinistry('${key}')">`;
        h += `<span class="msb-icon">${icon}</span>`;
        h += `<span class="msb-label">${label}</span>`;
        h += dot;
        h += '</button>';
    }
    h += '</div>';

    // Mobile dropdown
    h += '<div class="ministry-selector-mobile">';
    h += '<select class="ministry-dropdown" onchange="selectMinistry(this.value)">';
    for (const key of keys) {
        const label = getButtonLabel(key);
        const ministry = ministryData.find(m => m.ministry_key === key);
        const isFilled = ministry && ministry.minister_first_name;
        const marker = isFilled ? '\u25CF' : '\u25CB';
        const sel = key === selectedMinistryKey ? ' selected' : '';
        h += `<option value="${key}"${sel}>${marker} ${label}</option>`;
    }
    h += '</select>';
    h += '</div>';
    h += '</div>';

    // ===== CONTENT =====
    h += '<div id="ministry-content">';
    h += renderMinistryContent(selectedMinistryKey);
    h += '</div>';

    area.innerHTML = h;
}

function getButtonLabel(key) {
    if (key === 'prime_minister') return isPresidential ? 'President' : 'Prime Minister';

// ==================== INSTITUTIONS TAB ====================
function renderInstitutionsTab(ministryKey, institutions, alloc) {
    let h = '';
    h += '<div class="mdet-tab-intro">Institutions maintain stats &mdash; they prevent decay but don\'t improve anything. Fund them at 100% to hold steady. Below that, stats rot. The lower the funding, the faster the decline.</div>';

    if (institutions.length === 0) {
        h += '<div class="mdet-empty">No institution data available for this ministry yet.</div>';
        return h;
    }

    for (const inst of institutions) {
        // Use actual per-institution allocations from budget_item_allocations if available
        const itemAlloc = budgetItemAllocations[inst.id];
        let instAllocated, instNeeded;
        if (itemAlloc) {
            instAllocated = itemAlloc.allocated;
            instNeeded = itemAlloc.needed;
        } else {
            // Fallback: estimate from ministry-level allocation × costShare
            instAllocated = alloc.allocated * inst.costShare;
            if (inst.baseCostPerCapita) {
                if (inst.scalingType === 'gdp') {
                    instNeeded = (inst.baseCostPerCapita / 100) * Number(currentNation.gdp ?? currentNation.GDP ?? 0);
                } else {
                    instNeeded = inst.baseCostPerCapita * (currentNation.population || 0);
                }
            } else {
                instNeeded = alloc.needed * inst.costShare;
            }
        }
        const pct = instNeeded > 0 ? Math.round((instAllocated / instNeeded) * 100) : 0;
        const funding = getFundingLabel(pct);
        const decay = getDecayRate(pct);

        // Get live stat values from the nation
        const priVal = currentNation[inst.primaryStat.key] != null ? Math.round(Number(currentNation[inst.primaryStat.key])) : '?';
        const secVal = currentNation[inst.secondaryStat.key] != null ? Math.round(Number(currentNation[inst.secondaryStat.key])) : '?';

        h += `<div class="inst-card" style="border-left-color:${funding.color}">`;

        // Top: name + funding badge
        h += '<div class="inst-card-top">';
        h += '<div class="inst-card-info">';
        h += `<div class="inst-card-title"><span class="inst-icon">${inst.icon}</span> ${esc(inst.name)}</div>`;
        h += `<div class="inst-card-desc">${esc(inst.description)}</div>`;
        h += '</div>';
        h += '<div class="inst-card-funding">';
        h += `<span class="inst-funding-badge" style="color:${funding.color};background:${funding.bg}">${funding.label}</span>`;
        h += `<div class="inst-funding-pct" style="color:${funding.color}">${pct}%</div>`;
        h += '</div>';
        h += '</div>';

        // Funding bar
        h += '<div class="inst-bar-track">';
        h += `<div class="inst-bar-fill" style="width:${Math.min(pct, 100)}%;background:${funding.color};box-shadow:0 0 8px ${funding.color}44"></div>`;
        h += '</div>';

        // Budget line
        h += '<div class="inst-budget-line">';
        h += `<span>${fmtCurrency(instAllocated)} allocated / ${fmtCurrency(instNeeded)} needed</span>`;
        h += `<span>Base: ${esc(inst.baseCostFormula)}</span>`;
        h += '</div>';

        // Stat pills
        h += '<div class="inst-stat-pills">';
        h += renderStatPill(inst.primaryStat.label, priVal, decay?.primary, true);
        h += renderStatPill(inst.secondaryStat.label, secVal, decay?.secondary, false);
        h += '</div>';

        h += '</div>'; // .inst-card
    }

    // Decay reference table
    h += '<div class="decay-table">';
    h += '<div class="decay-table-title">DECAY REFERENCE TABLE</div>';
    h += '<div class="decay-table-grid">';
    h += '<span class="decay-hdr">Funding</span><span class="decay-hdr">Status</span><span class="decay-hdr">Primary</span><span class="decay-hdr">Secondary</span>';

    const rows = [
        { range: '100%', status: 'Fully Funded', color: '#22c55e', pri: 'No decay', sec: 'No decay' },
        { range: '90-99%', status: 'Stretched', color: '#a3e635', pri: '-0.3/tick', sec: '\u2014' },
        { range: '75-89%', status: 'Strained', color: '#facc15', pri: '-0.5/tick', sec: '-0.2/tick' },
        { range: '50-74%', status: 'Underfunded', color: '#f97316', pri: '-0.9/tick', sec: '-0.5/tick' },
        { range: '25-49%', status: 'Critical', color: '#ef4444', pri: '-1.7/tick', sec: '-0.9/tick' },
        { range: '0-24%', status: 'Collapsed', color: '#dc2626', pri: '-2.7/tick', sec: '-1.7/tick' }
    ];
    for (const r of rows) {
        h += `<span style="color:${r.color}">${r.range}</span>`;
        h += `<span style="color:${r.color}">${r.status}</span>`;
        h += `<span style="color:${r.pri.includes('-') ? r.color : '#6b6a5e'}">${r.pri}</span>`;
        h += `<span style="color:${r.sec.includes('-') ? r.color : '#6b6a5e'}">${r.sec}</span>`;
    }
    h += '</div></div>';

    return h;
}

function renderStatPill(label, value, decayStr, isPrimary) {
    const isDecaying = decayStr && decayStr !== '\u2014' && decayStr != null;
    const bgCls = isDecaying ? 'stat-pill-decay' : 'stat-pill-normal';

    let h = `<div class="stat-pill ${bgCls}">`;
    h += `<div class="stat-pill-label">${isPrimary ? '\u25B8 ' : ''}${esc(label)}</div>`;
    h += '<div class="stat-pill-row">';
    h += `<span class="stat-pill-value">${value}</span>`;
    if (isDecaying) {
        h += `<span class="stat-pill-decay-rate">${decayStr}</span>`;
    }
    h += '</div></div>';
    return h;
}

// ==================== POLICY COST & EFFECT HELPERS ====================

/**
 * Compute population-scaled cost for a policy at a given use count.
 * Uses costPerCapita if available, else falls back to costAmount.
 * Diminishing returns: cost × (1.5 ^ timesUsed)
 */
function getPolicyCost(policy, timesUsed) {
    const pop = currentNation?.population || 1;
    const baseCost = policy.costPerCapita != null
        ? policy.costPerCapita * pop
        : (policy.costAmount || 0);
    return baseCost * Math.pow(1.5, timesUsed);
}

/**
 * Compute diminished effect rate at a given use count.
 * effect × (0.6 ^ timesUsed)
 */
function getDiminishedRate(baseRate, timesUsed) {
    return baseRate * Math.pow(0.6, timesUsed);
}

function fmtRate(rate, direction) {
    const sign = direction === 'down' ? '-' : '+';
    const val = Math.round(rate * 100) / 100;
    return sign + val;
}

const REACTION_META = {
    strong_positive: { label: 'STRONG +', color: '#5cb85c', bg: 'rgba(92,184,92,0.08)', border: 'rgba(92,184,92,0.18)' },
    positive:        { label: 'POSITIVE', color: '#5cb85c', bg: 'rgba(92,184,92,0.06)', border: 'rgba(92,184,92,0.12)' },
    mild_positive:   { label: 'MILD +',  color: '#8a9a5c', bg: 'rgba(138,154,92,0.06)', border: 'rgba(138,154,92,0.12)' },
    mixed:           { label: 'MIXED',   color: '#c8a64e', bg: 'rgba(200,166,78,0.06)', border: 'rgba(200,166,78,0.12)' },
    neutral:         { label: 'NEUTRAL', color: '#6b6a5e', bg: 'rgba(255,255,255,0.02)', border: 'rgba(255,255,255,0.06)' },
    mild_negative:   { label: 'MILD -',  color: '#b87c4e', bg: 'rgba(184,124,78,0.06)', border: 'rgba(184,124,78,0.12)' },
    negative:        { label: 'NEGATIVE', color: '#d9534f', bg: 'rgba(217,83,79,0.06)', border: 'rgba(217,83,79,0.12)' },
    strong_negative: { label: 'STRONG -', color: '#d9534f', bg: 'rgba(217,83,79,0.08)', border: 'rgba(217,83,79,0.18)' }
};

// ==================== POLICIES TAB ====================
function renderPoliciesTab(policies, ministryKey) {
    let h = '';
    h += '<div class="mdet-tab-intro">Policies actively improve stats — but each use yields less return and costs more. Institutions maintain; policies push forward.</div>';

    if (policies.length === 0) {
        h += '<div class="mdet-empty">No policies available for this ministry yet.</div>';
        return h;
    }

    const fiscalCat = MINISTRY_FISCAL_MAP[ministryKey];
    const alloc = budgetAllocations[fiscalCat] || { allocated: 0, needed: 0 };

    for (const policy of policies) {
        const timesUsed = policyUsage[policy.id] || 0;
        const isExhausted = timesUsed >= policy.maxUses;
        const isOnCooldown = policyCooldowns[policy.id] != null;
        const currentCost = getPolicyCost(policy, timesUsed);
        const canAfford = alloc.allocated >= currentCost;

        let btnLabel = 'ENACT';
        let btnDisabled = false;
        if (isExhausted) { btnLabel = 'EXHAUSTED'; btnDisabled = true; }
        else if (isOnCooldown) { btnLabel = 'ON COOLDOWN'; btnDisabled = true; }
        else if (!canAfford) { btnLabel = 'NO BUDGET'; btnDisabled = true; }

        h += `<div class="pol-card${isExhausted ? ' exhausted' : ''}${!canAfford && !isExhausted ? ' no-budget' : ''}">`;

        h += '<div class="pol-card-top">';
        h += '<div class="pol-card-info">';

        // Title with icon glyph
        h += `<div class="pol-card-title"><span class="pol-icon-glyph">${policy.icon}</span><span>${esc(policy.name)}</span></div>`;

        // Ideology axes
        if (policy.ideologyAxes && policy.ideologyAxes.length > 0) {
            h += '<div class="pol-ideology-row">';
            for (const axis of policy.ideologyAxes) {
                h += `<span class="pol-ideo-tag pol-ideo-align">${axis}</span>`;
            }
            if (policy.ideologyConflicts) {
                h += '<span class="pol-ideo-vs">vs</span>';
                for (const axis of policy.ideologyConflicts) {
                    h += `<span class="pol-ideo-tag pol-ideo-oppose">${axis}</span>`;
                }
            }
            h += '</div>';
        }

        h += `<div class="pol-card-desc">${esc(policy.description)}</div>`;

        // Stat effects with diminishing returns
        h += '<div class="pol-effects">';
        for (const a of policy.affects) {
            const currentRate = getDiminishedRate(a.rate, timesUsed);
            const isNeg = a.negative;
            const displayVal = fmtRate(currentRate, a.direction);
            const baseVal = fmtRate(a.rate, a.direction);
            const wasStr = timesUsed > 0 ? ` <span class="pol-was">(base ${baseVal})</span>` : '';
            const pillCls = isNeg ? 'pol-effect-pill pol-effect-neg' : 'pol-effect-pill';
            const valCls = isNeg ? 'pol-effect-val pol-val-neg' : 'pol-effect-val';
            h += `<span class="${pillCls}"><span class="pol-effect-stat">${esc(a.stat)}</span> <span class="${valCls}">${displayVal}</span>${wasStr}</span>`;
        }
        h += '</div>';
        h += '</div>'; // .pol-card-info

        // Right: cost + button
        h += '<div class="pol-card-right">';
        h += `<div class="pol-cost">${fmtCurrency(currentCost)}</div>`;
        if (timesUsed > 0) {
            const baseCost = getPolicyCost(policy, 0);
            h += `<div class="pol-cost-base">base ${fmtCurrency(baseCost)}</div>`;
        }
        h += `<div class="pol-cooldown">${policy.cooldownLabel}</div>`;
        h += `<button class="pol-enact-btn${btnDisabled ? ' disabled' : ''}" ${btnDisabled ? 'disabled' : ''} onclick="enactPolicy('${policy.id}', '${ministryKey}')">${btnLabel}</button>`;
        h += '</div>';

        h += '</div>'; // .pol-card-top

        // Diminishing returns bar
        h += '<div class="pol-diminishing">';
        h += '<div class="pol-dim-header">';
        h += '<span>DIMINISHING RETURNS</span>';
        h += `<span>${timesUsed}/${policy.maxUses} uses</span>`;
        h += '</div>';
        h += '<div class="pol-dim-bar">';
        for (let i = 0; i < policy.maxUses; i++) {
            const filled = i < timesUsed;
            const pct = (i + 1) / policy.maxUses;
            const color = filled
                ? (pct >= 0.8 ? '#d9534f' : pct >= 0.6 ? '#c8a64e' : '#5cb85c')
                : 'rgba(255,255,255,0.04)';
            h += `<div class="pol-dim-seg" style="background:${color}"></div>`;
        }
        h += '</div>';

        // Cost/effect scaling preview
        if (!isExhausted) {
            const nextCost = getPolicyCost(policy, timesUsed + 1);
            const sampleEffect = policy.affects.find(a => !a.negative);
            const nextEffectStr = sampleEffect
                ? fmtRate(getDiminishedRate(sampleEffect.rate, timesUsed + 1), sampleEffect.direction)
                : '';
            h += '<div class="pol-dim-preview">';
            h += `<span>Next use: ${fmtCurrency(nextCost)}</span>`;
            if (nextEffectStr) h += `<span>${esc(sampleEffect.stat)}: ${nextEffectStr}</span>`;
            h += '</div>';
        }
        h += '</div>'; // .pol-diminishing

        // Voter bloc reactions (collapsible)
        if (policy.blocReactions && policy.blocReactions.length > 0) {
            h += `<details class="pol-bloc-reactions">`;
            h += `<summary class="pol-bloc-summary">VOTER BLOC REACTIONS</summary>`;
            h += '<div class="pol-bloc-grid">';
            for (const br of policy.blocReactions) {
                const meta = REACTION_META[br.reaction] || REACTION_META.neutral;
                h += `<div class="pol-bloc-row" style="border-left:3px solid ${meta.color};background:${meta.bg}">`;
                h += `<div class="pol-bloc-name">${esc(br.bloc)} <span class="pol-bloc-pct">${br.pct}%</span></div>`;
                h += `<div class="pol-bloc-reaction"><span class="pol-bloc-badge" style="color:${meta.color};border-color:${meta.border}">${meta.label}</span></div>`;
                h += `<div class="pol-bloc-desc">${esc(br.desc)}</div>`;
                h += '</div>';
            }
            h += '</div></details>';
        }

        h += '</div>'; // .pol-card
    }

    return h;
}

// ==================== CRISES TAB ====================
function renderCrisesTab() {
    let h = '';
    h += '<div class="mdet-tab-intro">Crises emerge when institutions decay past critical thresholds. They inflict immediate stat damage and persist until the underlying funding is restored.</div>';
    h += '<div class="mdet-empty">No active crises. Crisis events will be generated by the system when institution funding drops to critical levels.</div>';
    return h;
}

// ==================== GLOBAL HANDLERS ====================
window.selectMinistry = function(key) {
    selectedMinistryKey = key;
    activeDetailTab = 'institutions'; // reset tab on ministry switch
    document.querySelectorAll('.msb-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.key === key);
    });
    const dd = document.querySelector('.ministry-dropdown');
    if (dd) dd.value = key;
    const content = document.getElementById('ministry-content');
    if (content) content.innerHTML = renderMinistryContent(key);
};

window.switchDetailTab = function(tab) {
    activeDetailTab = tab;
    const content = document.getElementById('ministry-content');
    if (content) content.innerHTML = renderMinistryContent(selectedMinistryKey);
};

window.enactPolicy = async function(policyId, ministryKey) {
    const policies = MINISTRY_POLICIES[ministryKey] || [];
    const policy = policies.find(p => p.id === policyId);
    if (!policy) return;

    const timesUsed = policyUsage[policyId] || 0;
    if (timesUsed >= policy.maxUses) return;

    // Compute population-scaled cost with diminishing returns
    const currentCost = getPolicyCost(policy, timesUsed);

    // Budget check
    const fiscalCat = MINISTRY_FISCAL_MAP[ministryKey];
    const alloc = budgetAllocations[fiscalCat] || { allocated: 0, needed: 0 };
    if (alloc.allocated < currentCost) {
        alert('Insufficient budget allocated to this ministry.');
        return;
    }

    // Cooldown check
    if (policyCooldowns[policyId] != null) {
        alert('This policy is still on cooldown.');
        return;
    }

    // Find the ministry's faction_id
    const ministry = ministryData.find(m => m.ministry_key === ministryKey);
    const factionId = ministry?.party_id || currentFaction?.id;
    if (!factionId) {
        alert('No minister assigned to this ministry.');
        return;
    }

    // Build stat_effects with exponential diminishing returns: rate × (0.6 ^ timesUsed)
    const statEffects = policy.affects.map(a => ({
        stat_key: a.statKey,
        direction: a.direction,
        rate: getDiminishedRate(a.rate, timesUsed),
        delay_ticks: 0,
        duration_ticks: policy.durationTicks,
        target: 'nation'
    }));

    const currentTick = currentNation.current_tick || 0;

    const { error } = await _supabase.from('ministry_action_log').insert({
        nation_id: currentNation.id,
        faction_id: factionId,
        ministry_key: ministryKey,
        action_key: policyId,
        applied_at_tick: currentTick,
        cost: currentCost,
        stat_effects: statEffects,
        processed: false
    });

    if (error) {
        console.error('[enactPolicy] Insert failed:', error.message);
        alert('Failed to enact policy: ' + error.message);
        return;
    }

    // Update local state
    policyUsage[policyId] = timesUsed + 1;
    policyCooldowns[policyId] = currentTick;

    // Re-render
    const content = document.getElementById('ministry-content');
    if (content) content.innerHTML = renderMinistryContent(selectedMinistryKey);
};

// ==================== COST TUNER ====================

function getPerCapitaCost(inst) {
    if (inst.baseCostPerCapita != null) return inst.baseCostPerCapita;
    const m = inst.baseCostFormula?.match(/\$([\d.]+)/);
    return m ? parseFloat(m[1]) : 0;
}

function setPerCapitaCost(inst, val) {
    inst.baseCostPerCapita = val;
    inst.baseCostFormula = `$${val} \u00D7 population`;
}

function fmtShort(n) {
    if (n >= 1e12) return (n / 1e12).toFixed(1) + 'T';
    if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
    return String(Math.round(n));
}

function renderCostTuner() {
    const pop = currentNation?.population || 0;
    const body = document.getElementById('ct-body');
    const popInfo = document.getElementById('ct-pop-info');
    if (!body) return;

    popInfo.textContent = `Population: ${pop.toLocaleString()}`;

    let html = '';
    html += '<div class="ct-col-header"><span>Institution</span><span style="text-align:right">$/capita</span><span style="text-align:right">Total</span></div>';

    let grandTotal = 0;

    // Order: ministries that have institutions
    const ministryOrder = ['healthcare','education','defense','labor','justice','energy','transportation','finance','foreign','interior','trade'];

    for (const mk of ministryOrder) {
        const insts = MINISTRY_INSTITUTIONS[mk];
        if (!insts || insts.length === 0) continue;

        let ministryTotal = 0;
        let rows = '';

        for (const inst of insts) {
            const pc = getPerCapitaCost(inst);
            const total = pc * pop;
            ministryTotal += total;

            rows += `<div class="ct-row">`;
            rows += `<span class="ct-inst-name"><span class="ct-inst-icon">${inst.icon}</span>${esc(inst.name)}</span>`;
            rows += `<input class="ct-input" type="number" step="0.05" min="0" value="${pc}" data-ministry="${mk}" data-inst="${inst.id}">`;
            rows += `<span class="ct-computed" data-total-for="${mk}_${inst.id}">${fmtShort(total)}</span>`;
            rows += `</div>`;
        }

        grandTotal += ministryTotal;

        const label = MINISTRY_LABELS[mk] || mk;
        html += `<div class="ct-ministry-group">`;
        html += `<div class="ct-ministry-label"><span>${MINISTRY_ICONS[mk] || ''} ${label}</span><span class="ct-ministry-subtotal" data-subtotal="${mk}">${fmtShort(ministryTotal)}</span></div>`;
        html += rows;
        html += `</div>`;
    }

    body.innerHTML = html;
    document.getElementById('ct-grand-total').textContent = fmtShort(grandTotal);

    // Attach input listeners
    body.querySelectorAll('.ct-input').forEach(inp => {
        inp.addEventListener('input', onCostInput);
    });
}

function onCostInput(e) {
    const inp = e.target;
    const mk = inp.dataset.ministry;
    const instId = inp.dataset.inst;
    const val = parseFloat(inp.value) || 0;
    const pop = currentNation?.population || 0;

    // Update the institution data
    const insts = MINISTRY_INSTITUTIONS[mk];
    if (!insts) return;
    const inst = insts.find(i => i.id === instId);
    if (!inst) return;
    setPerCapitaCost(inst, val);

    // Update this row's total
    const totalEl = document.querySelector(`[data-total-for="${mk}_${instId}"]`);
    if (totalEl) totalEl.textContent = fmtShort(val * pop);

    // Update ministry subtotal
    let ministryTotal = 0;
    for (const i of insts) ministryTotal += getPerCapitaCost(i) * pop;
    const subEl = document.querySelector(`[data-subtotal="${mk}"]`);
    if (subEl) subEl.textContent = fmtShort(ministryTotal);

    // Update grand total
    let grandTotal = 0;
    for (const mkey of Object.keys(MINISTRY_INSTITUTIONS)) {
        for (const i of MINISTRY_INSTITUTIONS[mkey]) {
            grandTotal += getPerCapitaCost(i) * pop;
        }
    }
    document.getElementById('ct-grand-total').textContent = fmtShort(grandTotal);

    // Re-render the ministry detail if it's currently displayed
    if (selectedMinistryKey === mk) {
        const contentEl = document.getElementById('ministry-content');
        if (contentEl) contentEl.innerHTML = renderMinistryContent(selectedMinistryKey);
    }
}

// Wire up FAB and overlay click handlers — only in dev mode (?dev=1)
if (new URLSearchParams(window.location.search).get('dev') === '1') {
    document.getElementById('cost-tuner-fab').addEventListener('click', () => {
        document.getElementById('cost-tuner-overlay').classList.remove('hidden');
        renderCostTuner();
    });
    document.getElementById('ct-close').addEventListener('click', () => {
        document.getElementById('cost-tuner-overlay').classList.add('hidden');
    });
    document.getElementById('cost-tuner-overlay').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) {
            document.getElementById('cost-tuner-overlay').classList.add('hidden');
        }
    });
}
