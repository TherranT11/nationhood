// ==================== HELPERS ====================
function formatMoneyDisplay(m) {
    if (!m || m <= 0) return '';
    const dollars = m * 1000000;
    if (dollars >= 1000000) return '$' + (dollars / 1000000) + 'M';
    return '$' + Math.round(dollars).toLocaleString();
}

// Dice roll resolver: "1D6", "2D6+2", "1D3-1" etc.
function rollDice(formula) {
    if (typeof formula === 'number') return formula;
    if (!formula || typeof formula !== 'string') return 0;
    const match = formula.match(/^(\d+)[dD](\d+)([+-]\d+)?$/);
    if (!match) return parseInt(formula, 10) || 0;
    const count = parseInt(match[1], 10);
    const sides = parseInt(match[2], 10);
    const modifier = match[3] ? parseInt(match[3], 10) : 0;
    let total = 0;
    for (let i = 0; i < count; i++) total += Math.floor(Math.random() * sides) + 1;
    return total + modifier;
}

// Clone stat_effects and resolve rateFormula/durationFormula to concrete numbers
function resolveStatEffects(effects) {
    if (!effects || !Array.isArray(effects)) return [];
    return effects.map(e => {
        const r = Object.assign({}, e);
        if (r.rateFormula !== undefined) { r.rate = rollDice(r.rateFormula); delete r.rateFormula; }
        if (r.durationFormula !== undefined) { r.duration_ticks = rollDice(r.durationFormula); delete r.durationFormula; }
        return r;
    });
}

async function ensureWelcomeEvent(nationId, ministryKey, factionId, tick) {
    const welcome = MINISTRY_WELCOME_MESSAGES[ministryKey];
    if (!welcome) return;

    const { data: existing } = await _supabase.from('ministry_events')
        .select('id')
        .eq('nation_id', nationId)
        .eq('ministry_key', ministryKey)
        .eq('controlling_faction_id', factionId)
        .eq('title', welcome.title)
        .limit(1);

    if (existing && existing.length > 0) return;

    await _supabase.from('ministry_events').insert({
        nation_id: nationId,
        ministry_key: ministryKey,
        controlling_faction_id: factionId,
        title: welcome.title,
        sender: welcome.sender,
        body: welcome.body,
        priority: 'low',
        status: 'resolved',
        created_at_tick: tick,
        expires_at_tick: null,
        options: [],
        chosen_option: null,
        resolved_effects: null,
        resolved_at_tick: tick
    });
}

                    { stat_key: 'civil_unrest', direction: 'down', rate: 2, delay_ticks: 0, duration_ticks: 8 }
                ]
            }
        ]
    }
};

// Interior ministry conditional action state
let interiorState = {
    sealedBordersActive: false,
    sealedBordersLogId: null,
    registryExploitActive: false,
    registryExploitExpiresAtTick: null
};

async function fetchInteriorState() {
    interiorState = { sealedBordersActive: false, sealedBordersLogId: null,
                      registryExploitActive: false, registryExploitExpiresAtTick: null };
    if (!currentNation || !currentFaction) return;
    try {
        const { data: sealedEntries } = await _supabase.from('ministry_action_log')
            .select('id, applied_at_tick')
            .eq('nation_id', currentNation.id)
            .eq('ministry_key', 'interior')
            .eq('action_key', 'sealed_borders')
            .eq('processed', false)
            .limit(1);
        if (sealedEntries && sealedEntries.length > 0) {
            interiorState.sealedBordersActive = true;
            interiorState.sealedBordersLogId = sealedEntries[0].id;
        }

        const { data: registryEntries } = await _supabase.from('ministry_action_log')
            .select('id, applied_at_tick')
            .eq('nation_id', currentNation.id)
            .eq('ministry_key', 'interior')
            .eq('action_key', 'population_registry')
            .eq('processed', false)
            .limit(1);
        if (registryEntries && registryEntries.length > 0) {
            const expiresAt = registryEntries[0].applied_at_tick + 8;
            if (currentTick <= expiresAt) {
                interiorState.registryExploitActive = true;
                interiorState.registryExploitExpiresAtTick = expiresAt;
            }
        }
    } catch (e) {
        console.warn('Could not load interior state:', e);
    }
}

// ==================== INBOX EVENTS ====================
async function loadInboxEvents(ministryKey) {
    try {
        const { data } = await _supabase.from('ministry_events')
            .select('*').eq('nation_id', currentNation.id).eq('ministry_key', ministryKey)
            .eq('controlling_faction_id', currentFaction.id)
            .order('created_at_tick', { ascending: false });
        inboxEvents = data || [];
    } catch (e) {
        console.warn('Could not load inbox events:', e);
        inboxEvents = [];
    }
    renderInboxList();
}

function renderInboxList() {
    let filtered = inboxEvents;
    if (inboxFilter === 'active') filtered = inboxEvents.filter(e => e.status === 'active');
    else if (inboxFilter === 'resolved') filtered = inboxEvents.filter(e => e.status !== 'active');

    document.getElementById('inbox-count').textContent = filtered.length + ' event' + (filtered.length !== 1 ? 's' : '');

    if (!filtered.length) {
        document.getElementById('inbox-list').innerHTML = '<div style="text-align:center;padding:40px;color:#555;"><div style="font-size:2rem;margin-bottom:8px;">📭</div>No events</div>';
        return;
    }

    document.getElementById('inbox-list').innerHTML = filtered.map(ev => {
        const isSelected = ev.id === selectedEventId;
        const ticksLeft = ev.expires_at_tick ? ev.expires_at_tick - currentTick : null;
        const isCritical = ticksLeft !== null && ticksLeft <= 1;
        let statusClass = '';
        if (ev.status === 'resolved') statusClass = 'resolved';
        else if (ev.status === 'expired') statusClass = 'expired';

        return '<div class="inbox-item' + (isSelected ? ' selected' : '') +
            (ev.status === 'active' ? ' unread' : '') +
            (statusClass ? ' ' + statusClass : '') +
            '" onclick="selectEvent(\'' + ev.id + '\')">' +
            '<div class="inbox-item-top">' +
                '<div class="inbox-item-sender">' + escapeHtml(ev.sender) + '</div>' +
                '<div class="inbox-item-tick">Tick ' + ev.created_at_tick + '</div>' +
            '</div>' +
            '<div class="inbox-item-subject">' + escapeHtml(ev.title) + '</div>' +
            '<div class="inbox-item-bottom">' +
                '<span class="inbox-item-priority priority-' + ev.priority + '">' + ev.priority.toUpperCase() + '</span>' +
                (ev.status !== 'active'
                    ? '<span class="inbox-item-status status-' + ev.status + '">' + ev.status.toUpperCase() + '</span>'
                    : '') +
                (ev.status === 'active' && ticksLeft !== null
                    ? '<span class="inbox-item-deadline' + (isCritical ? ' critical' : '') + '">⏱ ' + ticksLeft + ' tick' + (ticksLeft !== 1 ? 's' : '') + '</span>'
                    : '') +
            '</div>' +
        '</div>';
    }).join('');
}

function setFilter(f) {
    inboxFilter = f;
    document.querySelectorAll('.inbox-filter').forEach(el => {
        el.classList.toggle('active', el.textContent.toLowerCase() === f);
    });
    renderInboxList();
}

                '<div style="font-size:0.8rem;color:#aaa;margin-bottom:4px;">Outcome: <strong style="color:var(--accent);">' + escapeHtml(outcomeLabel) + '</strong></div>' +
                (outcomeMessage ? '<div style="font-size:0.82rem;color:#ccc;margin-bottom:6px;font-style:italic;line-height:1.4;">' + escapeHtml(outcomeMessage) + '</div>' : '') +
                (effectsStr ? '<div class="resolved-effects">Effects: ' + effectsStr + '</div>' : '') +
            '</div>';
    } else if (ev.status === 'expired') {
        const resolved = ev.resolved_effects || {};
        const effects = resolved.effects || (Array.isArray(ev.resolved_effects) ? ev.resolved_effects : []);
        const effectsStr = effects.map(e =>
            e.stat_key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase()) + ': ' + (e.change > 0 ? '+' : '') + e.change
        ).join(' · ');

        bottomSection =
            '<div class="resolved-banner expired">' +
                '<div class="resolved-title expired">✕ Expired — Auto-resolved with worst outcome</div>' +
                (effectsStr ? '<div class="resolved-effects">Effects: ' + effectsStr + '</div>' : '') +
            '</div>';
    }

    document.getElementById('email-panel').innerHTML =
        '<div style="flex:1;display:flex;flex-direction:column;min-height:0;">' +

                    (ev.status !== 'active' ? '<span class="inbox-item-status status-' + ev.status + '">' + ev.status.toUpperCase() + '</span>' : '') +

// ==================== PLACEHOLDER RESOLUTION ====================
function resolveOutcomePlaceholders(message, context) {
    if (!message) return '';
    return message
        .replace(/\{nation\}/g, context.nation || '')
        .replace(/\{minister\}/g, context.minister || '')
        .replace(/\{party\}/g, context.party || '')
        .replace(/\{sender\}/g, context.sender || '')
        .replace(/\{outcome\}/g, context.outcome || '')
        .replace(/\{cost\}/g, context.cost || '');
}

// ==================== RESPOND TO EVENT ====================
async function respondToEvent(eventId, optionIndex) {
    if (isCaretaker) { alert('Ministry actions are restricted during caretaker government.'); return; }
    const ev = inboxEvents.find(e => e.id === eventId);
    if (!ev || ev.status !== 'active') return;

    const option = ev.options[optionIndex];
    if (!option) return;

    const apCost = option.ap || 0;
    if ((currentFaction?.action_points || 0) < apCost) { alert('Not enough AP.'); return; }

    const letter = String.fromCharCode(65 + optionIndex);
    if (!confirm('Choose Option ' + letter + ': ' + (option.label || '') + '?\n\nCost: ' + apCost + ' AP' + (option.money ? ' + ' + formatMoneyDisplay(option.money) : ''))) return;

    if (apCost > 0) {
        const apResult = await deductAP(_supabase, currentFaction.id, apCost);
        if (!apResult.success) { alert('Not enough AP.'); return; }
        currentFaction.action_points = apResult.newAp;
        sessionStorage.removeItem('nationhood_state');
    }

    try {
        const outcomes = option.outcomes || [{ chance: 100, label: 'Result', effects: [] }];
        const roll = Math.random() * 100;
        let cumulative = 0;
        let chosenOutcome = outcomes[0];
        for (const oc of outcomes) {
            cumulative += (oc.chance || 0);
            if (roll < cumulative) { chosenOutcome = oc; break; }
        }

        const appliedEffects = [];
        for (const eff of (chosenOutcome.effects || [])) {
            const change = eff.change || 0;
            if (eff.target === 'nation' || !eff.target) {
                const { data: nation } = await _supabase.from('nations').select(eff.stat_key).eq('id', currentNation.id).single();
                if (nation) {
                    const current = nation[eff.stat_key] || 0;
                    await _supabase.from('nations').update({ [eff.stat_key]: Math.max(0, Math.min(100, current + change)) }).eq('id', currentNation.id);
                }
            } else if (eff.target === 'minister') {
                const ministry = myMinistries.find(m => m.ministry_key === activeMinistryKey);
                if (ministry) {
                    const current = ministry.minister_approval || 50;
                    await _supabase.from('ministries').update({ minister_approval: Math.max(0, Math.min(100, current + change)) }).eq('id', ministry.id);
                }
            } else if (eff.target === 'faction') {
                await adjustBlocApproval(_supabase, currentFaction.id, change);
            }
            appliedEffects.push({ stat_key: eff.stat_key, change: change, target: eff.target || 'nation' });
        }

        // Resolve outcome message placeholders
        const placeholderCtx = {
            nation: currentNation?.name || '',
            minister: currentFaction?.name || '',
            party: currentFaction?.name || '',
            sender: ev.sender || '',
            outcome: chosenOutcome.label || 'Result',
            cost: option.money ? formatMoneyDisplay(option.money) : '$0'
        };
        const resolvedMessage = resolveOutcomePlaceholders(chosenOutcome.message || '', placeholderCtx);

        await _supabase.from('ministry_events').update({
            chosen_option: optionIndex,
            resolved_effects: { outcome_label: chosenOutcome.label || 'Result', outcome_message: resolvedMessage || null, effects: appliedEffects },
            status: 'resolved',
            resolved_at_tick: currentTick
        }).eq('id', eventId);

        await markFactionActive(_supabase, currentFaction.id);

        // If outcome has a civic event, insert into event_log for the CIVIC feed
        if (chosenOutcome.civic_event_text) {
            const civicText = resolveOutcomePlaceholders(chosenOutcome.civic_event_text, placeholderCtx);
            const civicName = resolveOutcomePlaceholders(chosenOutcome.civic_event_name || chosenOutcome.label || 'Ministry Event', placeholderCtx);
            const civicCategory = chosenOutcome.civic_event_category || 'General';
            await _supabase.from('event_log').insert({
                nation_id: currentNation.id,
                event_name: civicName,
                description_used: civicText,
                effects_applied: appliedEffects,
                category: civicCategory,
                fired_at_tick: currentTick
            });
        }

        const effectsStr = appliedEffects.map(e =>
            e.stat_key.replace(/_/g, ' ') + ': ' + (e.change > 0 ? '+' : '') + e.change
        ).join('\n');

        alert('📋 ' + chosenOutcome.label + (resolvedMessage ? '\n\n' + resolvedMessage : '') + (effectsStr ? '\n\n' + effectsStr : ''));

        await loadInboxEvents(activeMinistryKey);
        selectEvent(eventId);
        await renderMinistryHeader(activeMinistryKey);
        renderMinistryTabs();

    } catch (err) {
        console.error('Response error:', err);
        alert('Error: ' + err.message);
    }
}

// ==================== MINISTRY ACTIONS (PROACTIVE) ====================
function openActionModal(actionKey) {
    const govType = isAutocracy ? CANONICAL_GOVERNMENT_TYPES.AUTOCRACY : CANONICAL_GOVERNMENT_TYPES.PARLIAMENTARY_DEMOCRACY;
    const actions = (MINISTRY_ACTIONS[activeMinistryKey] || {})[govType] || [];
    const action = actions.find(a => a.key === actionKey);
    if (!action) return;

    pendingActionKey = actionKey;
    pendingTargetFactionId = null;

    document.getElementById('action-modal-title').textContent = action.icon + ' ' + action.label;

    let bodyHtml = '<p>' + action.description + '</p>';
    let costLabel = '';
    if (action.moneyFormula) costLabel = '<span class="cost-tag money">$' + action.moneyFormula + '</span>';
    else if (action.money) costLabel = '<span class="cost-tag money">' + formatMoneyDisplay(action.money) + '</span>';
    bodyHtml += '<div class="modal-cost-row">' +
        '<span class="cost-tag ap">' + action.ap + ' AP</span>' + costLabel +
    '</div>';

    if (action.stat_effects && action.stat_effects.length > 0) {
        // Group effects into phases for cleaner display
        const immediate = action.stat_effects.filter(e => e.delay_ticks === 0 && (e.duration_ticks === 1 && !e.durationFormula));
        const ongoing = action.stat_effects.filter(e => !immediate.includes(e) && e.delay_ticks <= 1);
        const rebound = action.stat_effects.filter(e => e.delay_ticks > 1);

        bodyHtml += '<div style="margin-top:10px;padding:8px 10px;background:#1a1a1a;border-radius:6px;border:1px solid #333;">';

        if (immediate.length > 0) {
            bodyHtml += '<div style="font-size:0.7rem;color:#888;text-transform:uppercase;font-weight:bold;margin-bottom:4px;">Immediate Effects</div>';
            immediate.forEach(e => {
                const arrow = e.direction === 'up' ? '▲' : '▼';
                const color = e.direction === 'up' ? '#4caf50' : '#f44336';
                const statLabel = (e.target === 'minister' ? 'Minister ' : '') + e.stat_key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                const rateDisplay = e.rateFormula || ((e.direction === 'up' ? '+' : '-') + (e.rate || 1));
                bodyHtml += '<div style="font-size:0.8rem;color:' + color + ';margin:2px 0;">' + arrow + ' ' + statLabel + ' ' + rateDisplay + '</div>';
            });
        }

        if (ongoing.length > 0) {
            bodyHtml += '<div style="font-size:0.7rem;color:#888;text-transform:uppercase;font-weight:bold;margin:6px 0 4px;">Ongoing Effects</div>';
            ongoing.forEach(e => {
                const arrow = e.direction === 'up' ? '▲' : '▼';
                const color = e.direction === 'up' ? '#4caf50' : '#f44336';
                const statLabel = (e.target === 'minister' ? 'Minister ' : '') + e.stat_key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                const rateDisplay = e.rateFormula || ((e.direction === 'up' ? '+' : '-') + (e.rate || 1));
                const durDisplay = e.durationFormula ? e.durationFormula : (e.duration_ticks === 9999 ? '∞' : e.duration_ticks);
                const delay = e.delay_ticks > 1 ? ' (after ' + e.delay_ticks + 't)' : '';
                bodyHtml += '<div style="font-size:0.8rem;color:' + color + ';margin:2px 0;">' + arrow + ' ' + statLabel + ' ' + rateDisplay + '/tick for ' + durDisplay + 't' + delay + '</div>';
            });
        }

        if (rebound.length > 0) {
            bodyHtml += '<div style="font-size:0.7rem;color:#888;text-transform:uppercase;font-weight:bold;margin:6px 0 4px;">Rebound</div>';
            rebound.forEach(e => {
                const arrow = e.direction === 'up' ? '▲' : '▼';
                const color = e.direction === 'up' ? '#4caf50' : '#f44336';
                const statLabel = e.stat_key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                const rateDisplay = (e.direction === 'up' ? '+' : '-') + (e.rate || 1);
                bodyHtml += '<div style="font-size:0.8rem;color:' + color + ';margin:2px 0;">' + arrow + ' ' + statLabel + ' ' + rateDisplay + '/tick for ' + e.duration_ticks + 't (after ' + e.delay_ticks + 't)</div>';
            });
        }

        bodyHtml += '</div>';
    }

    if (action.needsTarget) {
        const others = allParties.filter(p => p.id !== currentFaction.id);
        bodyHtml += '<label style="font-size:0.8rem;color:#888;font-weight:bold;text-transform:uppercase;">Target Faction:</label>';
        bodyHtml += '<select class="target-select" id="action-target-select" onchange="pendingTargetFactionId=this.value">';
        bodyHtml += '<option value="">-- Select Target --</option>';
        others.forEach(p => {
            bodyHtml += '<option value="' + p.id + '">' + escapeHtml(p.faction_name) + '</option>';
        });
        bodyHtml += '</select>';
    }

    document.getElementById('action-modal-body').innerHTML = bodyHtml;
    document.getElementById('action-modal').classList.add('active');
}

function closeActionModal() {
    document.getElementById('action-modal').classList.remove('active');
    pendingActionKey = null;
    pendingTargetFactionId = null;
}

async function confirmAction() {
    if (isCaretaker) { alert('Ministry actions are restricted during caretaker government.'); return; }
    const govType = isAutocracy ? CANONICAL_GOVERNMENT_TYPES.AUTOCRACY : CANONICAL_GOVERNMENT_TYPES.PARLIAMENTARY_DEMOCRACY;
    const actions = (MINISTRY_ACTIONS[activeMinistryKey] || {})[govType] || [];
    const action = actions.find(a => a.key === pendingActionKey);
    if (!action) return;

    if (action.needsTarget && !pendingTargetFactionId) {
        alert('Select a target faction.'); return;
    }

    if ((currentFaction?.action_points || 0) < action.ap) { alert('Not enough AP.'); return; }

    // Calculate money cost (logged, not yet deducted from budget)
    let moneyCost = 0;
    // Apply Registry Exploitation 20% discount for Interior actions
    if (activeMinistryKey === 'interior' && interiorState.registryExploitActive && moneyCost > 0) {
        moneyCost = Math.floor(moneyCost * 0.8);
    }

    const apResult = await deductAP(_supabase, currentFaction.id, action.ap);
    if (!apResult.success) { alert('Not enough AP.'); return; }
    currentFaction.action_points = apResult.newAp;
    sessionStorage.removeItem('nationhood_state');

    try {
        const cooldownUntil = action.cooldownTicks ? currentTick + action.cooldownTicks : null;
        const hasEffects = action.stat_effects && action.stat_effects.length > 0;
        // Resolve dice formulas to concrete numbers before DB insert
        const resolvedEffects = hasEffects ? resolveStatEffects(action.stat_effects) : null;

        await _supabase.from('ministry_action_log').insert({
            nation_id: currentNation.id,
            ministry_key: activeMinistryKey,
            action_key: action.key,
            faction_id: currentFaction.id,
            ap_cost: action.ap,
            money_cost: moneyCost,
            target_faction_id: pendingTargetFactionId || null,
            applied_at_tick: currentTick,
            timing: 'immediate',
            processed: !hasEffects,
            cooldown_until_tick: cooldownUntil,
            stat_effects: resolvedEffects,
            effects_applied_through_tick: hasEffects ? currentTick - 1 : null
        });

        // Unseal Borders: cancel the active sealed_borders entry
        if (action.key === 'unseal_borders' && interiorState.sealedBordersLogId) {
            await _supabase.from('ministry_action_log')
                .update({ processed: true })
                .eq('id', interiorState.sealedBordersLogId);
            interiorState.sealedBordersActive = false;
            interiorState.sealedBordersLogId = null;
        }

        if (cooldownUntil) {
            actionCooldowns[activeMinistryKey + ':' + action.key] = cooldownUntil;
        }

        closeActionModal();
        await markFactionActive(_supabase, currentFaction.id);

        // Refresh interior state after interior actions
        if (activeMinistryKey === 'interior') await fetchInteriorState();

        alert('✦ ' + action.label + ' executed!');
        await renderMinistryHeader(activeMinistryKey);

    } catch (err) {
        console.error('Action error:', err);
        alert('Error: ' + err.message);
    }
}

// ==================== UTILITIES ====================
function escapeHtml(t) { var d = document.createElement('div'); d.textContent = t || ''; return d.innerHTML; }

// Expose handlers used by inline HTML attributes
window.setFilter = setFilter;
window.closeActionModal = closeActionModal;
window.confirmAction = confirmAction;
window.selectMinistry = selectMinistry;
window.onMobileMinistrySelect = onMobileMinistrySelect;
window.openActionModal = openActionModal;
window.selectEvent = selectEvent;
window.respondToEvent = respondToEvent;
})();
</script>
