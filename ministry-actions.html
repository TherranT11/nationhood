// ==================== DECAY TABLE ====================
// Funding % -> decay per tick (your adjusted version: <100% starts losing)
function getDecayRate(pct) {
    if (pct >= 100) return null;
    if (pct >= 90)  return { primary: '-0.3/tick', secondary: null };
    if (pct >= 75)  return { primary: '-0.5/tick', secondary: '-0.2/tick' };
    if (pct >= 50)  return { primary: '-0.9/tick', secondary: '-0.5/tick' };
    if (pct >= 25)  return { primary: '-1.7/tick', secondary: '-0.9/tick' };
    return { primary: '-2.7/tick', secondary: '-1.7/tick' };
}

function getFundingLabel(pct) {
    if (pct >= 100) return { label: 'FULLY FUNDED', color: '#22c55e', bg: 'rgba(34,197,94,0.1)' };
    if (pct >= 90)  return { label: 'STRETCHED',    color: '#a3e635', bg: 'rgba(163,230,53,0.08)' };
    if (pct >= 75)  return { label: 'STRAINED',     color: '#facc15', bg: 'rgba(250,204,21,0.08)' };
    if (pct >= 50)  return { label: 'UNDERFUNDED',   color: '#f97316', bg: 'rgba(249,115,22,0.08)' };
    if (pct >= 25)  return { label: 'CRITICAL',      color: '#ef4444', bg: 'rgba(239,68,68,0.1)' };
    return { label: 'COLLAPSED', color: '#dc2626', bg: 'rgba(220,38,38,0.15)' };
}

// ==================== INIT ====================
initPage('ministry-actions', async (state) => {
    currentNation = state.nation;
    currentFaction = state.faction;
    isPresidential = isGovernmentPresidential(currentNation);

    // Fetch all active ministries
    const { data } = await _supabase.from('ministries')
        .select('*, factions(faction_name, party_color, party_logo, custom_logo_url)')
        .eq('nation_id', currentNation.id)
        .eq('is_active', true);
    ministryData = data || [];

    // No budget bill system — all institutions auto-fund at 100%

    // Load admin-configured institution overrides from DB
    const { data: instConfig, error: instConfigErr } = await _supabase.from('ministry_institution_config').select('*');
    if (!instConfigErr && instConfig && instConfig.length > 0) {
        for (const row of instConfig) {
            const insts = MINISTRY_INSTITUTIONS[row.ministry_key];
            if (!insts) continue;
            const inst = insts.find(i => i.id === row.id);
            if (!inst) continue;
            inst.baseCostPerCapita = Number(row.base_cost_per_capita) || inst.baseCostPerCapita;
            inst.scalingType = row.scaling_type || 'population';
            if (inst.scalingType === 'gdp') {
                inst.baseCostFormula = inst.baseCostPerCapita + '% \u00D7 GDP';
            } else {
                inst.baseCostFormula = '$' + inst.baseCostPerCapita + ' \u00D7 population';
            }
            inst.costShare = Number(row.cost_share) || inst.costShare;
            if (row.primary_stat) inst.primaryStat = { key: row.primary_stat, label: row.primary_stat.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) };
            if (row.secondary_stat) inst.secondaryStat = { key: row.secondary_stat, label: row.secondary_stat.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) };
        }
    }

    // Load energy dispatch state from the energy ministry record
    const energyMinistry = ministryData.find(m => m.ministry_key === 'energy');
    if (energyMinistry) {
        energyDispatchState = {
            deckOrder: energyMinistry.energy_deck_order,
            deckIndex: energyMinistry.energy_deck_index ?? 0,
            pendingCardId: energyMinistry.energy_pending_card_id,
            pendingSinceTick: energyMinistry.energy_pending_since_tick,
            lastResult: energyMinistry.energy_last_result
        };
    }

    renderPage();
});

// ==================== FORMAT HELPERS ====================
function fmtCurrency(val) {
    if (val == null) return '$0';
    val = Number(val);
    const sign = val < 0 ? '-' : '';
    const abs = Math.abs(val);
    if (abs >= 1e12) return sign + '$' + (abs / 1e12).toFixed(1) + 'T';
    if (abs >= 1e9)  return sign + '$' + (abs / 1e9).toFixed(1) + 'B';
    if (abs >= 1e6)  return sign + '$' + (abs / 1e6).toFixed(1) + 'M';
    return sign + '$' + Math.round(abs).toLocaleString();
}

function esc(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
}

function renderPage() {

        : MINISTRY_KEYS;

        selectedMinistryKey = keys[0];
    }

    let h = '';

    // ===== MINISTRY SELECTOR BAR =====
    h += '<div class="ministry-selector-bar">';
    h += '<div class="ministry-selector-scroll">';
    for (const key of keys) {
        const label = getButtonLabel(key);
        const icon = MINISTRY_ICONS[key] || '';
        const isActive = key === selectedMinistryKey;
        const ministry = ministryData.find(m => m.ministry_key === key);
        const isFilled = ministry && ministry.minister_first_name;
        const isMyMinistry = ministry && ministry.party_id === currentFaction?.id;
        const pColor = ministry?.factions?.party_color || null;
        const pName = ministry?.factions?.faction_name || null;
        const dot = isFilled ? '<span class="msb-dot filled"></span>' : '<span class="msb-dot vacant"></span>';

        // Energy dispatch badge: red [1] when a card is pending and unresolved
        const dispatchBadge = (key === 'energy' && energyDispatchState &&
            energyDispatchState.pendingCardId != null && !energyDispatchState.lastResult)
            ? '<span class="msb-dispatch-badge">1</span>' : '';

        h += `<button class="msb-btn${isActive ? ' active' : ''}${isMyMinistry ? ' mine' : ''}" data-key="${key}" onclick="selectMinistry('${key}')">`;
        h += `<span class="msb-icon">${icon}</span>`;
        h += `<span class="msb-label">${label}</span>`;
        h += dot;
        h += dispatchBadge;
        h += '</button>';
    }
    h += '</div>';

    // Mobile dropdown
    h += '<div class="ministry-selector-mobile">';
    h += '<select class="ministry-dropdown" onchange="selectMinistry(this.value)">';
    for (const key of keys) {
        const label = getButtonLabel(key);
        const ministry = ministryData.find(m => m.ministry_key === key);
        const isFilled = ministry && ministry.minister_first_name;
        const marker = isFilled ? '\u25CF' : '\u25CB';
        const sel = key === selectedMinistryKey ? ' selected' : '';
        h += `<option value="${key}"${sel}>${marker} ${label}</option>`;

    // ===== CONTENT =====
    h += '<div id="ministry-content">';

}

function getButtonLabel(key) {
    if (key === 'prime_minister') return isPresidential ? 'President' : 'Prime Minister';
    return MINISTRY_LABELS[key] || key;
}

// ==================== MINISTRY CONTENT ====================
function renderMinistryContent(key) {
    const ministry = ministryData.find(m => m.ministry_key === key);
    const fullName = MINISTRY_FULL_NAMES[key] || getButtonLabel(key);
    const icon = MINISTRY_ICONS[key] || '';
    // Compute actual institution costs — auto-fund at 100% (no budget bill system)
    let totalNeeded = 0;
    for (const inst of (MINISTRY_INSTITUTIONS[key] || [])) {
        if (inst.baseCostPerCapita) {
            if (inst.scalingType === 'gdp') {
                totalNeeded += (inst.baseCostPerCapita / 100) * Number(currentNation.gdp ?? currentNation.GDP ?? 0);
            } else {
                totalNeeded += inst.baseCostPerCapita * (currentNation.population || 0);
            }
        }
    }
    const alloc = { allocated: totalNeeded, needed: totalNeeded };
    const overallPct = alloc.needed > 0 ? Math.round((alloc.allocated / alloc.needed) * 100) : 100;
    const overallFunding = getFundingLabel(overallPct);
    const institutions = MINISTRY_INSTITUTIONS[key] || [];
    const activeCrises = getActiveCrises(key, institutions).length;
    const hasEnergyDispatch = key === 'energy';
    const hasPendingDispatch = hasEnergyDispatch && energyDispatchState &&
        energyDispatchState.pendingCardId != null && !energyDispatchState.lastResult;

    let h = '';

    // ===== MINISTRY HEADER =====
    h += '<div class="mdet-header">';
    h += '<div class="mdet-header-inner">';

    h += `<div class="mdet-header-name">${esc(fullName.replace('Ministry of ', '').replace('Ministry of the ', ''))}</div>`;
    h += '<div class="mdet-header-meta">';
    if (ministry && ministry.minister_first_name) {
        const pColor = ministry.factions?.party_color || '#888';
        const pName = ministry.factions?.faction_name || 'Unknown';
        const pLogo = ministry.factions?.party_logo;

        const pLogoHtml = (pLogo || pCustomLogo) ? `<span style="display:inline-flex;vertical-align:middle;margin-right:4px;">${getPartyLogoHTML({ customLogoUrl: pCustomLogo, iconKey: pLogo, size: 14, color: pColor })}</span>` : '';
        h += `<span>Minister: <strong>${esc(ministry.minister_first_name)} ${esc(ministry.minister_last_name)}</strong></span>`;
        h += '<span class="mdet-sep">|</span>';
        h += `<span>Party: ${pLogoHtml}<strong style="color:${pColor}">${esc(pName)}</strong></span>`;
        const appr = ministry.minister_approval ?? 50;
        const apprCls = appr < 35 ? 'low' : appr < 50 ? 'mid' : 'high';
        h += '<span class="mdet-sep">|</span>';
        h += `<span>Approval: <strong class="mdet-appr-${apprCls}">${Math.round(appr)}%</strong></span>`;
    } else {
        h += '<span class="mdet-vacant-label">No minister appointed</span>';
    }
    h += '</div>';
    h += '</div>';

    // Budget summary (right side)
    h += '<div class="mdet-header-right">';
    h += '<div class="mdet-budget-label">MINISTRY BUDGET</div>';
    h += `<div class="mdet-budget-value" style="color:${overallFunding.color}">${fmtCurrency(alloc.allocated)}</div>`;
    h += `<div class="mdet-budget-sub">of ${fmtCurrency(alloc.needed)} needed &mdash; <span style="color:${overallFunding.color};font-weight:700">${overallPct}% funded</span></div>`;
    h += '</div>';

    h += '</div>'; // .mdet-header-inner
    h += '</div>'; // .mdet-header

    // ===== TAB NAVIGATION =====
    h += '<div class="mdet-tabs">';
    const tabs = [
        { key: 'institutions', label: 'INSTITUTIONS', count: institutions.length },
        { key: 'crises', label: 'CRISIS EVENTS', count: activeCrises }
    ];
    if (hasEnergyDispatch) {
        tabs.splice(1, 0, { key: 'dispatch', label: 'DISPATCH', pending: hasPendingDispatch });
    }
    for (const tab of tabs) {
        const isActive = activeDetailTab === tab.key;
        let badge = '';
        if (tab.key === 'crises' && tab.count > 0) {
            badge = `<span class="mdet-tab-badge-alert">${tab.count}</span>`;
        } else if (tab.key === 'dispatch' && tab.pending) {
            badge = '<span class="mdet-tab-badge-dispatch">1</span>';
        } else if (tab.count != null) {
            badge = `<span class="mdet-tab-count">${tab.count}</span>`;
        }
        h += `<button class="mdet-tab${isActive ? ' active' : ''}" onclick="switchDetailTab('${tab.key}')">${tab.label} ${badge}</button>`;
    }

    if (activeDetailTab === 'institutions') {
        h += renderInstitutionsTab(key, institutions, alloc);
    } else if (activeDetailTab === 'dispatch' && hasEnergyDispatch) {
        h += renderEnergyDispatchTab();
    } else if (activeDetailTab === 'crises') {
        h += renderCrisesTab();
    }

    h += '</div>'; // .mdet-body
    return h;
}

// ==================== INSTITUTIONS TAB ====================
function renderInstitutionsTab(ministryKey, institutions, alloc) {
    let h = '';
    h += '<div class="mdet-tab-intro">Institutions maintain stats &mdash; they prevent decay but don\'t improve anything. Fund them at 100% to hold steady. Below that, stats rot. The lower the funding, the faster the decline.</div>';

    if (institutions.length === 0) {
        h += '<div class="mdet-empty">No institution data available for this ministry yet.</div>';
        return h;
    }

    for (const inst of institutions) {
        // Use per-institution allocations if available, otherwise auto-fund at 100%
        const itemAlloc = budgetItemAllocations[inst.id];
        let instAllocated, instNeeded;
        if (itemAlloc) {
            instAllocated = itemAlloc.allocated;
            instNeeded = itemAlloc.needed;
        } else {
            // No per-institution allocation — compute needed cost and auto-fund at 100%
            if (inst.baseCostPerCapita) {
                if (inst.scalingType === 'gdp') {
                    instNeeded = (inst.baseCostPerCapita / 100) * Number(currentNation.gdp ?? currentNation.GDP ?? 0);
                } else {
                    instNeeded = inst.baseCostPerCapita * (currentNation.population || 0);
                }
            } else {
                instNeeded = alloc.needed * inst.costShare;
            }
            instAllocated = instNeeded; // Auto-fund at 100%
        }
        const pct = instNeeded > 0 ? Math.round((instAllocated / instNeeded) * 100) : 100;
        const funding = getFundingLabel(pct);
        const decay = getDecayRate(pct);

        // Get live stat values from the nation
        const priVal = currentNation[inst.primaryStat.key] != null ? Math.round(Number(currentNation[inst.primaryStat.key])) : '?';
        const secVal = currentNation[inst.secondaryStat.key] != null ? Math.round(Number(currentNation[inst.secondaryStat.key])) : '?';

        h += `<div class="inst-card" style="border-left-color:${funding.color}">`;

        // Top: name + funding badge
        h += '<div class="inst-card-top">';
        h += '<div class="inst-card-info">';
        h += `<div class="inst-card-title"><span class="inst-icon">${inst.icon}</span> ${esc(inst.name)}</div>`;
        h += `<div class="inst-card-desc">${esc(inst.description)}</div>`;
        h += '</div>';
        h += '<div class="inst-card-funding">';
        h += `<span class="inst-funding-badge" style="color:${funding.color};background:${funding.bg}">${funding.label}</span>`;
        h += `<div class="inst-funding-pct" style="color:${funding.color}">${pct}%</div>`;
        h += '</div>';
        h += '</div>';

        // Funding bar
        h += '<div class="inst-bar-track">';
        h += `<div class="inst-bar-fill" style="width:${Math.min(pct, 100)}%;background:${funding.color};box-shadow:0 0 8px ${funding.color}44"></div>`;
        h += '</div>';

        // Budget line
        h += '<div class="inst-budget-line">';
        h += `<span>${fmtCurrency(instAllocated)} allocated / ${fmtCurrency(instNeeded)} needed</span>`;
        h += `<span>Base: ${esc(inst.baseCostFormula)}</span>`;
        h += '</div>';

        // Stat pills
        h += '<div class="inst-stat-pills">';
        h += renderStatPill(inst.primaryStat.label, priVal, decay?.primary, true);
        h += renderStatPill(inst.secondaryStat.label, secVal, decay?.secondary, false);
        h += '</div>';

        h += '</div>'; // .inst-card
    }

    // Decay reference table
    h += '<div class="decay-table">';
    h += '<div class="decay-table-title">DECAY REFERENCE TABLE</div>';
    h += '<div class="decay-table-grid">';
    h += '<span class="decay-hdr">Funding</span><span class="decay-hdr">Status</span><span class="decay-hdr">Primary</span><span class="decay-hdr">Secondary</span>';

    const rows = [
        { range: '100%', status: 'Fully Funded', color: '#22c55e', pri: 'No decay', sec: 'No decay' },
        { range: '90-99%', status: 'Stretched', color: '#a3e635', pri: '-0.3/tick', sec: '\u2014' },
        { range: '75-89%', status: 'Strained', color: '#facc15', pri: '-0.5/tick', sec: '-0.2/tick' },
        { range: '50-74%', status: 'Underfunded', color: '#f97316', pri: '-0.9/tick', sec: '-0.5/tick' },
        { range: '25-49%', status: 'Critical', color: '#ef4444', pri: '-1.7/tick', sec: '-0.9/tick' },
        { range: '0-24%', status: 'Collapsed', color: '#dc2626', pri: '-2.7/tick', sec: '-1.7/tick' }
    ];
    for (const r of rows) {
        h += `<span style="color:${r.color}">${r.range}</span>`;
        h += `<span style="color:${r.color}">${r.status}</span>`;
        h += `<span style="color:${r.pri.includes('-') ? r.color : '#6b6a5e'}">${r.pri}</span>`;
        h += `<span style="color:${r.sec.includes('-') ? r.color : '#6b6a5e'}">${r.sec}</span>`;
    }
    h += '</div></div>';

    return h;
}

function renderStatPill(label, value, decayStr, isPrimary) {
    const isDecaying = decayStr && decayStr !== '\u2014' && decayStr != null;
    const bgCls = isDecaying ? 'stat-pill-decay' : 'stat-pill-normal';

    let h = `<div class="stat-pill ${bgCls}">`;
    h += `<div class="stat-pill-label">${isPrimary ? '\u25B8 ' : ''}${esc(label)}</div>`;
    h += '<div class="stat-pill-row">';
    h += `<span class="stat-pill-value">${value}</span>`;
    if (isDecaying) {
        h += `<span class="stat-pill-decay-rate">${decayStr}</span>`;
    }
    h += '</div></div>';
    return h;
}

// Compute per-institution funding percentage
function getInstitutionFundingPct(instId, ministryKey) {
    const institutions = MINISTRY_INSTITUTIONS[ministryKey] || [];
    const inst = institutions.find(i => i.id === instId);
    if (!inst) return 100;

    const itemAlloc = budgetItemAllocations[instId];

    let instAllocated, instNeeded;
    if (itemAlloc) {
        instAllocated = itemAlloc.allocated;
        instNeeded = itemAlloc.needed;
    } else {
        // No budget bill system — compute needed and auto-fund at 100%
        if (inst.baseCostPerCapita) {
            if (inst.scalingType === 'gdp') {
                instNeeded = (inst.baseCostPerCapita / 100) * Number(currentNation.gdp ?? currentNation.GDP ?? 0);
            } else {
                instNeeded = inst.baseCostPerCapita * (currentNation.population || 0);
            }
        } else {
            instNeeded = 0;
        }
        instAllocated = instNeeded; // Auto-fund at 100%
    }

    return instNeeded > 0 ? Math.round((instAllocated / instNeeded) * 100) : 100;
}

// Determine which crises are active for the current ministry
function getActiveCrises(ministryKey, institutions) {
    if (ministryKey !== 'education') return [];

    const active = [];
    for (const crisis of EDUCATION_CRISES) {
        const trigger = crisis.trigger;
        let allBelow = true;
        for (const instId of trigger.institutions) {
            const pct = getInstitutionFundingPct(instId, 'education');
            if (pct >= trigger.threshold) {
                allBelow = false;
                break;
            }
        }
        if (allBelow) {
            active.push(crisis);
        }
    }
    return active;
}

function renderCrisesTab() {
    const institutions = MINISTRY_INSTITUTIONS[selectedMinistryKey] || [];
    const crises = getActiveCrises(selectedMinistryKey, institutions);
    let h = '';

    h += '<div class="mdet-tab-intro">Crises emerge when institutions decay past critical thresholds. They inflict ongoing stat damage each tick until resolved. Options follow a pattern: A = expensive real fix, B = moderate alternative, C = cheap but regret later.</div>';

    if (crises.length === 0) {
        h += '<div class="mdet-empty">No active crises. Crisis events will trigger when institution funding drops below critical thresholds for consecutive ticks.</div>';

        // Show upcoming thresholds for education
        if (selectedMinistryKey === 'education') {
            h += '<div class="crisis-thresholds">';
            h += '<div class="crisis-thresholds-title">CRISIS THRESHOLDS</div>';
            for (const crisis of EDUCATION_CRISES) {
                const instPcts = crisis.trigger.institutions.map(id => {
                    const inst = (MINISTRY_INSTITUTIONS.education || []).find(i => i.id === id);
                    const pct = getInstitutionFundingPct(id, 'education');
                    return { name: inst?.name || id, pct, threshold: crisis.trigger.threshold };
                });
                const allBelow = instPcts.every(i => i.pct < i.threshold);
                const anyClose = instPcts.some(i => i.pct < i.threshold + 15);
                const statusCls = allBelow ? 'triggered' : anyClose ? 'warning' : 'safe';

                h += `<div class="crisis-threshold-row ${statusCls}">`;
                h += `<span class="crisis-threshold-sev ${crisis.severity.toLowerCase()}">${crisis.severity}</span>`;
                h += `<span class="crisis-threshold-name">${esc(crisis.title)}</span>`;
                h += '<span class="crisis-threshold-inst">';
                h += instPcts.map(i => {
                    const color = i.pct < i.threshold ? 'var(--red, #d9534f)' : i.pct < i.threshold + 15 ? 'var(--amber, #c8a64e)' : 'var(--green, #5cb85c)';
                    return `<span style="color:${color}">${esc(i.name)}: ${i.pct}%</span>`;
                }).join(' / ');
                h += '</span>';
                h += `<span class="crisis-threshold-trigger">${esc(crisis.trigger.label)}</span>`;
                h += '</div>';
            }
            h += '</div>';
        }
        return h;
    }

    for (const crisis of crises) {
        const sevColor = crisis.severity === 'CRITICAL' ? 'var(--red, #d9534f)' : 'var(--amber, #c8a64e)';
        const sevBg = crisis.severity === 'CRITICAL' ? 'var(--red-faint, rgba(217,83,79,0.08))' : 'var(--amber-faint, rgba(200,166,78,0.08))';
        const sevBorder = crisis.severity === 'CRITICAL' ? 'var(--red-border, rgba(217,83,79,0.18))' : 'var(--amber-border, rgba(200,166,78,0.18))';

        h += `<div class="crisis-card" style="border-left:3px solid ${sevColor};background:${sevBg};border:1px solid ${sevBorder};border-left:3px solid ${sevColor}">`;

        // Header
        h += '<div class="crisis-card-header">';
        h += `<div class="crisis-card-title">${esc(crisis.title)}</div>`;
        h += `<span class="crisis-severity-badge" style="color:${sevColor};background:${sevBg};border:1px solid ${sevBorder}">${crisis.severity}</span>`;
        h += '</div>';

        // Headline
        h += `<div class="crisis-headline">"${esc(crisis.headline)}"</div>`;

        // Description
        h += `<div class="crisis-description">${esc(crisis.description)}</div>`;

        // Ongoing effects
        h += '<div class="crisis-ongoing">';
        h += '<div class="crisis-section-label">ONGOING DAMAGE PER TICK</div>';
        h += '<div class="crisis-effects-grid">';
        for (const eff of crisis.ongoingEffects) {
            const isNeg = eff.change < 0 || (eff.stat === 'unemployment' || eff.stat === 'crime_rate' || eff.stat === 'civil_unrest');
            const color = isNeg ? 'var(--red, #d9534f)' : 'var(--amber, #c8a64e)';
            const arrow = eff.change > 0 ? '+' : '';
            h += `<div class="crisis-effect-item"><span class="crisis-effect-label">${esc(eff.label)}</span><span class="crisis-effect-value" style="color:${color}">${arrow}${eff.change}/tick</span></div>`;
        }
        if (crisis.approvalHit) {
            h += `<div class="crisis-effect-item"><span class="crisis-effect-label">Minister Approval</span><span class="crisis-effect-value" style="color:var(--red, #d9534f)">${crisis.approvalHit}% (on trigger)</span></div>`;
        }
        h += '</div>';
        h += '</div>';

        // Cross-ministry cascade
        if (crisis.crossMinistry) {
            h += `<div class="crisis-cascade"><span class="crisis-cascade-label">CROSS-MINISTRY</span> ${esc(crisis.crossMinistry)}</div>`;
        }

        // Options
        h += '<div class="crisis-options">';
        h += '<div class="crisis-section-label">RESPONSE OPTIONS</div>';
        for (const opt of crisis.options) {
            const optLabel = opt.id;
            const resolveCls = opt.resolves === true ? 'resolves' : opt.resolves === 'partial' || opt.resolves === 'superficial' ? 'partial' : 'fails';
            const resolveText = opt.resolves === true ? 'RESOLVES CRISIS' : opt.resolves === 'partial' ? 'PARTIALLY RESOLVES' : opt.resolves === 'superficial' ? 'SUPERFICIAL FIX' : 'DOES NOT RESOLVE';

            h += `<div class="crisis-option ${resolveCls}">`;
            h += '<div class="crisis-option-header">';
            h += `<span class="crisis-option-id">[${optLabel}]</span>`;
            h += `<span class="crisis-option-label">${esc(opt.label)}</span>`;
            h += `<span class="crisis-option-cost">${esc(opt.cost)}</span>`;
            h += '</div>';

            h += `<div class="crisis-option-desc">${esc(opt.description)}</div>`;

            // Effects
            h += '<div class="crisis-option-effects">';
            for (const eff of opt.effects) {
                const color = eff.direction === 'up' ? 'var(--green, #5cb85c)' : 'var(--red, #d9534f)';
                const arrow = eff.direction === 'up' ? '\u25B2' : '\u25BC';
                h += `<span class="crisis-opt-effect" style="color:${color}">${arrow} ${esc(eff.stat.replace(/_/g, ' '))}: ${esc(eff.change)}</span>`;
            }
            h += '</div>';

            // Requirements
            if (opt.requiresVote) {
                h += '<div class="crisis-option-req">REQUIRES PARLIAMENTARY VOTE</div>';
            }
            if (opt.requiresCooperation) {
                h += `<div class="crisis-option-req">REQUIRES ${esc(opt.requiresCooperation.toUpperCase())}</div>`;
            }

            // Resolution status
            h += `<div class="crisis-option-resolve ${resolveCls}">${resolveText}</div>`;

            // Warning
            if (opt.warning) {
                h += `<div class="crisis-option-warning">/! ${esc(opt.warning)}</div>`;
            }

            // Select button (for the minister of this ministry only)
            const isMyMinistry = currentFaction && ministryData.find(m => m.ministry_key === selectedMinistryKey && m.party_id === currentFaction.id);
            if (isMyMinistry) {
                h += `<button class="crisis-option-btn" onclick="selectCrisisOption('${crisis.id}', '${opt.id}')">${esc(opt.label)} <span class="crisis-opt-cost-badge">${esc(opt.cost)}</span></button>`;
            }

            h += '</div>';
        }
        h += '</div>';

        // Voter Bloc Reactions
        h += '<div class="crisis-voters">';
        h += '<div class="crisis-section-label">VOTER BLOC REACTIONS</div>';
        h += '<div class="crisis-voters-grid">';
        for (const vr of crisis.voterReactions) {
            const arrow = vr.reaction === 'strong_negative' ? '\u25BC\u25BC' : vr.reaction === 'negative' ? '\u25BC' : vr.reaction === 'positive' || vr.reaction === 'strong_positive' ? '\u25B2' : '\u25CF';
            const color = vr.reaction.includes('negative') ? 'var(--red, #d9534f)' : vr.reaction.includes('positive') ? 'var(--green, #5cb85c)' : 'var(--text-muted, #6b6a5e)';
            h += `<div class="crisis-voter-item"><span class="crisis-voter-arrow" style="color:${color}">${arrow}</span><span class="crisis-voter-bloc">${esc(vr.bloc)} (${vr.pct}%)</span><span class="crisis-voter-desc">${esc(vr.desc)}</span></div>`;
        }
        h += '</div>';
        h += '</div>';

        h += '</div>'; // .crisis-card
    }

    return h;
}

// ==================== ENERGY DISPATCH TAB ====================

function renderEnergyDispatchTab() {
    let h = '';

    if (!energyDispatchState) {
        h += '<div class="mdet-empty">Energy dispatch system not initialized. Check back next tick.</div>';
        return h;
    }

    // If last result exists, show the result overlay (terminal for this tick)
    if (energyDispatchState.lastResult) {
        h += renderEnergyResult(energyDispatchState.lastResult);
        return h;
    }

    // If a card is pending, show the card UI
    if (energyDispatchState.pendingCardId != null) {
        const card = ENERGY_CARDS[energyDispatchState.pendingCardId];
        if (!card) {
            h += '<div class="mdet-empty">Invalid dispatch card. Contact an administrator.</div>';
            return h;
        }

        const nationName = currentNation?.name || 'your nation';
        const contextText = card.context.replace(/\{nation\}/g, nationName);

        h += '<div class="energy-dispatch">';

        // Dispatch panel header
        h += '<div class="ed-panel">';
        h += `<div class="ed-panel-source">${esc(card.source)}</div>`;
        h += `<div class="ed-panel-title">${esc(card.title)}</div>`;
        h += `<div class="ed-panel-context">${esc(contextText)}</div>`;
        h += '</div>';

        // Two choice cards
        h += '<div class="ed-choices">';
        h += renderEnergyChoiceCard(card, 'left');
        h += renderEnergyChoiceCard(card, 'right');
        h += '</div>';

        // Confirm bar (visible only when a choice is selected)
        h += `<div class="ed-confirm-bar${energySelectedChoice ? '' : ' hidden'}" id="ed-confirm-bar">`;
        h += `<span class="ed-confirm-label">Confirm: <strong id="ed-confirm-choice-label">${energySelectedChoice ? esc(card[energySelectedChoice].label) : ''}</strong></span>`;
        h += '<button class="ed-confirm-btn" onclick="confirmEnergyChoice()">CONFIRM DECISION</button>';
        h += '<button class="ed-cancel-btn" onclick="cancelEnergyChoice()">CANCEL</button>';
        h += '</div>';

        // Card counter
        const deckIdx = energyDispatchState.deckIndex || 0;
        h += `<div class="ed-deck-counter">Card ${deckIdx} of ${ENERGY_CARDS.length}</div>`;

        h += '</div>'; // .energy-dispatch
        return h;
    }

    // No pending card
    h += '<div class="mdet-empty">No dispatch pending. A new energy decision will arrive next month.</div>';
    return h;
}

function renderEnergyChoiceCard(card, dir) {
    const choice = card[dir];
    const isSelected = energySelectedChoice === dir;
    const isDimmed = energySelectedChoice && energySelectedChoice !== dir;
    let h = '';

    h += `<div class="ed-card${isSelected ? ' selected' : ''}${isDimmed ? ' dimmed' : ''}" onclick="selectEnergyChoice('${dir}')">`;
    h += `<div class="ed-card-dir">${dir === 'left' ? 'OPTION A' : 'OPTION B'}</div>`;
    h += `<div class="ed-card-label">${esc(choice.label)}</div>`;

    // Stat deltas
    h += '<div class="ed-card-stats">';
    for (const [key, delta] of Object.entries(choice.statDeltas)) {
        const label = key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        const sign = delta > 0 ? '+' : '';
        const cls = delta > 0 ? 'ed-stat-up' : 'ed-stat-down';
        h += `<span class="ed-stat-pill ${cls}">${esc(label)} ${sign}${delta}</span>`;
    }
    h += '</div>';

    // Bloc approval tags
    h += '<div class="ed-card-blocs">';
    for (const [bloc, delta] of Object.entries(choice.blocApprovals)) {
        const cls = delta > 0 ? 'ed-bloc-pos' : 'ed-bloc-neg';
        const sign = delta > 0 ? '+' : '';
        h += `<span class="ed-bloc-tag ${cls}">${esc(bloc)} ${sign}${delta}</span>`;
    }
    h += '</div>';

    h += '</div>'; // .ed-card
    return h;
}

function renderEnergyResult(result) {
    let h = '';
    h += '<div class="ed-result">';
    h += '<div class="ed-result-header">DISPATCH RESOLVED</div>';
    h += `<div class="ed-result-choice">Decision: <strong>${esc(result.chosenLabel)}</strong></div>`;

    // Stat changes
    h += '<div class="ed-result-section">';
    h += '<div class="ed-result-section-title">STAT CHANGES</div>';
    h += '<div class="ed-result-stats">';
    for (const [key, delta] of Object.entries(result.statDeltas || {})) {
        const label = key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        const sign = delta > 0 ? '+' : '';
        const cls = delta > 0 ? 'ed-stat-up' : 'ed-stat-down';
        h += `<span class="ed-stat-pill ${cls}">${esc(label)} ${sign}${delta}</span>`;
    }
    h += '</div></div>';

    // Two-column bloc approval grid
    h += '<div class="ed-result-section">';
    h += '<div class="ed-result-section-title">VOTER BLOC IMPACT</div>';
    h += '<div class="ed-result-blocs-grid">';
    h += '<div class="ed-result-blocs-header"><span>Bloc</span><span>Your Party</span><span>PM\'s Party</span></div>';
    for (const entry of (result.blocResults || [])) {
        const yourCls = entry.yourDelta > 0 ? 'ed-stat-up' : entry.yourDelta < 0 ? 'ed-stat-down' : '';
        const pmCls = entry.pmDelta > 0 ? 'ed-stat-up' : entry.pmDelta < 0 ? 'ed-stat-down' : '';
        const yourSign = entry.yourDelta > 0 ? '+' : '';
        const pmSign = entry.pmDelta > 0 ? '+' : '';
        h += '<div class="ed-result-bloc-row">';
        h += `<span class="ed-result-bloc-name">${esc(entry.bloc)}</span>`;
        h += `<span class="${yourCls}">${yourSign}${entry.yourDelta}</span>`;
        h += `<span class="${pmCls}">${pmSign}${entry.pmDelta}</span>`;
        h += '</div>';
    }
    h += '</div></div>';

    h += '<div class="ed-result-footer">Event finished. Next dispatch arrives next month.</div>';
    h += '</div>'; // .ed-result
    return h;
}

// ==================== ENERGY DISPATCH ACTIONS ====================

window.selectEnergyChoice = function(dir) {
    energySelectedChoice = dir;
    const content = document.getElementById('ministry-content');
    if (content) content.innerHTML = renderMinistryContent(selectedMinistryKey);
};

window.cancelEnergyChoice = function() {
    energySelectedChoice = null;
    const content = document.getElementById('ministry-content');
    if (content) content.innerHTML = renderMinistryContent(selectedMinistryKey);
};

window.confirmEnergyChoice = async function() {
    // State-based guard against double-click / concurrent tabs
    if (energyConfirmInFlight) return;
    if (!energySelectedChoice || !energyDispatchState || energyDispatchState.pendingCardId == null) return;

    const card = ENERGY_CARDS[energyDispatchState.pendingCardId];
    if (!card) return;
    const choice = card[energySelectedChoice];
    if (!choice) return;

    const energyMinistry = ministryData.find(m => m.ministry_key === 'energy');
    if (!energyMinistry) return;

    energyConfirmInFlight = true;
    const btn = document.querySelector('.ed-confirm-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'PROCESSING...'; }

    // Track what was written so we can show accurate results
    const blocResults = [];
    let statUpdateSucceeded = false;

    try {
        // 0. Verify the pending card hasn't been changed by the tick processor (race guard)
        const { data: freshMinistry } = await _supabase.from('ministries')
            .select('energy_pending_card_id')
            .eq('id', energyMinistry.id)
            .single();
        if (!freshMinistry || freshMinistry.energy_pending_card_id !== card.id) {
            // Card was replaced by the tick — reload state and re-render
            const { data: fullMinistry } = await _supabase.from('ministries')
                .select('*')
                .eq('id', energyMinistry.id)
                .single();
            if (fullMinistry) {
                Object.assign(energyMinistry, fullMinistry);
                energyDispatchState = {
                    deckOrder: fullMinistry.energy_deck_order,
                    deckIndex: fullMinistry.energy_deck_index ?? 0,
                    pendingCardId: fullMinistry.energy_pending_card_id,
                    pendingSinceTick: fullMinistry.energy_pending_since_tick,
                    lastResult: fullMinistry.energy_last_result
                };
            }
            energySelectedChoice = null;
            energyConfirmInFlight = false;
            const content = document.getElementById('ministry-content');
            if (content) content.innerHTML = renderMinistryContent(selectedMinistryKey);
            return;
        }

        // 1. Apply stat deltas to nations table (server-side, clamped 0-100)
        const nationUpdates = {};
        for (const [key, delta] of Object.entries(choice.statDeltas)) {
            const currentVal = Number(currentNation[key] ?? 50);
            nationUpdates[key] = Math.max(0, Math.min(100, currentVal + delta));
        }
        const { error: nationErr } = await _supabase.from('nations')
            .update(nationUpdates)
            .eq('id', currentNation.id);
        if (nationErr) throw new Error('Failed to update nation stats: ' + nationErr.message);
        statUpdateSucceeded = true;

        // Update local state
        for (const [key, val] of Object.entries(nationUpdates)) {
            currentNation[key] = val;
        }

        // 2. Apply bloc approval deltas
        const playerFactionId = currentFaction?.id;
        const pmMinistry = ministryData.find(m => m.ministry_key === 'prime_minister');
        const pmFactionId = pmMinistry?.party_id || null;

        const { data: voterBlocs } = await _supabase.from('voter_blocs')
            .select('id, bloc_name')
            .eq('nation_id', currentNation.id)
            .eq('is_active', true);

        if (voterBlocs && voterBlocs.length > 0) {
            const blocMap = {};
            for (const vb of voterBlocs) blocMap[vb.bloc_name] = vb.id;

            for (const [blocName, delta] of Object.entries(choice.blocApprovals)) {
                const blocId = blocMap[blocName];
                if (!blocId) {
                    console.warn(`[confirmEnergyChoice] Bloc "${blocName}" not found in voter_blocs — skipping`);
                    continue;
                }

                const sign = delta > 0 ? 1 : -1;
                const yourRoll = sign * (Math.floor(Math.random() * 4) + 2);
                const pmRoll = sign * (Math.floor(Math.random() * 4) + 2);

                // Update player's faction bloc approval (upsert pattern)
                if (playerFactionId) {
                    const { error: yourErr } = await _supabase.from('faction_bloc_approval')
                        .upsert(
                            { faction_id: playerFactionId, bloc_id: blocId, preference_score: 50 },
                            { onConflict: 'faction_id,bloc_id', ignoreDuplicates: true }
                        );
                    if (!yourErr) {
                        // Now update with the delta (read-then-write to clamp properly)
                        const { data: fbaRow } = await _supabase.from('faction_bloc_approval')
                            .select('id, preference_score')
                            .eq('faction_id', playerFactionId)
                            .eq('bloc_id', blocId)
                            .single();
                        if (fbaRow) {
                            const newScore = Math.max(0, Math.min(100, (fbaRow.preference_score ?? 50) + yourRoll));
                            await _supabase.from('faction_bloc_approval')
                                .update({ preference_score: newScore })
                                .eq('id', fbaRow.id);
                        }
                    }
                }

                // Update PM's faction bloc approval (if different from player)
                let actualPmRoll = pmRoll;
                if (pmFactionId && pmFactionId !== playerFactionId) {
                    const { error: pmErr } = await _supabase.from('faction_bloc_approval')
                        .upsert(
                            { faction_id: pmFactionId, bloc_id: blocId, preference_score: 50 },
                            { onConflict: 'faction_id,bloc_id', ignoreDuplicates: true }
                        );
                    if (!pmErr) {
                        const { data: pmFbaRow } = await _supabase.from('faction_bloc_approval')
                            .select('id, preference_score')
                            .eq('faction_id', pmFactionId)
                            .eq('bloc_id', blocId)
                            .single();
                        if (pmFbaRow) {
                            const newScore = Math.max(0, Math.min(100, (pmFbaRow.preference_score ?? 50) + pmRoll));
                            await _supabase.from('faction_bloc_approval')
                                .update({ preference_score: newScore })
                                .eq('id', pmFbaRow.id);
                        }
                    }
                } else {
                    actualPmRoll = yourRoll;
                }

                blocResults.push({ bloc: blocName, yourDelta: yourRoll, pmDelta: actualPmRoll });
            }
        }

        // 3. Store result and clear pending card
        const resultData = {
            cardId: card.id,
            chosenDirection: energySelectedChoice,
            chosenLabel: choice.label,
            statDeltas: choice.statDeltas,
            blocResults: blocResults
        };

        const { error: updateErr } = await _supabase.from('ministries')
            .update({
                energy_pending_card_id: null,
                energy_pending_since_tick: null,
                energy_last_result: resultData
            })
            .eq('id', energyMinistry.id);
        if (updateErr) throw new Error('Failed to update ministry: ' + updateErr.message);

        // Update local state
        energyDispatchState.pendingCardId = null;
        energyDispatchState.pendingSinceTick = null;
        energyDispatchState.lastResult = resultData;
        energySelectedChoice = null;

        // Re-render
        const content = document.getElementById('ministry-content');
        if (content) content.innerHTML = renderMinistryContent(selectedMinistryKey);

    } catch (err) {
        console.error('[confirmEnergyChoice]', err);
        // If stats were committed but blocs failed, still show partial result
        if (statUpdateSucceeded && blocResults.length > 0) {
            console.warn('[confirmEnergyChoice] Partial success: stats committed, some bloc updates may have failed');
        }
        alert('Failed to process energy dispatch: ' + err.message);
        if (btn) { btn.disabled = false; btn.textContent = 'CONFIRM DECISION'; }
    } finally {
        energyConfirmInFlight = false;
    }
};

// Handle crisis option selection
window.selectCrisisOption = async function(crisisId, optionId) {
    const crisis = EDUCATION_CRISES.find(c => c.id === crisisId);
    if (!crisis) return;
    const option = crisis.options.find(o => o.id === optionId);
    if (!option) return;

    const confirmMsg = `Select "${option.label}" for ${crisis.title}?\n\nCost: ${option.cost}\n${option.resolves === true ? 'This RESOLVES the crisis.' : option.resolves ? 'This PARTIALLY resolves the crisis.' : 'This does NOT resolve the crisis.'}\n\n${option.warning || ''}`;
    if (!confirm(confirmMsg)) return;

    // Log the crisis response to ministry_action_log
    try {
        await _supabase.from('ministry_action_log').insert({
            nation_id: currentNation.id,
            ministry_key: 'education',
            action_key: `crisis_${crisisId}_${optionId}`,
            faction_id: currentFaction.id,
            applied_at_tick: currentNation.current_tick || 0,
            action_data: {
                crisis_id: crisisId,
                crisis_title: crisis.title,
                option_id: optionId,
                option_label: option.label,
                cost_pct: option.costPct,
                resolves: option.resolves
            }
        });
        alert(`Response selected: ${option.label}\n\nEffects will be applied on the next tick.`);
        // Re-render
        const content = document.getElementById('ministry-content');
        if (content) content.innerHTML = renderMinistryContent(selectedMinistryKey);
    } catch (err) {
        alert('Failed to submit crisis response. Please try again.');
    }
};

// ==================== GLOBAL HANDLERS ====================
window.selectMinistry = function(key) {
    selectedMinistryKey = key;
    energySelectedChoice = null; // clear any pending energy choice selection
    // Auto-switch to dispatch tab if energy ministry has a pending unresolved card
    if (key === 'energy' && energyDispatchState &&
        energyDispatchState.pendingCardId != null && !energyDispatchState.lastResult) {
        activeDetailTab = 'dispatch';
    } else {
        activeDetailTab = 'institutions';
    }
    document.querySelectorAll('.msb-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.key === key);
    });
    const dd = document.querySelector('.ministry-dropdown');
    if (dd) dd.value = key;
    const content = document.getElementById('ministry-content');
    if (content) content.innerHTML = renderMinistryContent(key);
};

window.switchDetailTab = function(tab) {
    activeDetailTab = tab;
    const content = document.getElementById('ministry-content');
    if (content) content.innerHTML = renderMinistryContent(selectedMinistryKey);
};

// ==================== COST TUNER ====================

function getPerCapitaCost(inst) {
    if (inst.baseCostPerCapita != null) return inst.baseCostPerCapita;
    const m = inst.baseCostFormula?.match(/\$([\d.]+)/);
    return m ? parseFloat(m[1]) : 0;
}

function setPerCapitaCost(inst, val) {
    inst.baseCostPerCapita = val;
    inst.baseCostFormula = `$${val} \u00D7 population`;
}

function fmtShort(n) {
    if (n >= 1e12) return (n / 1e12).toFixed(1) + 'T';
    if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
    return String(Math.round(n));
}

function renderCostTuner() {
    const pop = currentNation?.population || 0;
    const body = document.getElementById('ct-body');
    const popInfo = document.getElementById('ct-pop-info');
    if (!body) return;

    popInfo.textContent = `Population: ${pop.toLocaleString()}`;

    let html = '';
    html += '<div class="ct-col-header"><span>Institution</span><span style="text-align:right">$/capita</span><span style="text-align:right">Total</span></div>';

    let grandTotal = 0;

    // Order: ministries that have institutions
    const ministryOrder = ['healthcare','education','defense','labor','justice','energy','transportation','finance','foreign','interior','trade'];

    for (const mk of ministryOrder) {
        const insts = MINISTRY_INSTITUTIONS[mk];
        if (!insts || insts.length === 0) continue;

        let ministryTotal = 0;
        let rows = '';

        for (const inst of insts) {
            const pc = getPerCapitaCost(inst);
            const total = pc * pop;
            ministryTotal += total;

            rows += `<div class="ct-row">`;
            rows += `<span class="ct-inst-name"><span class="ct-inst-icon">${inst.icon}</span>${esc(inst.name)}</span>`;
            rows += `<input class="ct-input" type="number" step="0.05" min="0" value="${pc}" data-ministry="${mk}" data-inst="${inst.id}">`;
            rows += `<span class="ct-computed" data-total-for="${mk}_${inst.id}">${fmtShort(total)}</span>`;
            rows += `</div>`;
        }

        grandTotal += ministryTotal;

        const label = MINISTRY_LABELS[mk] || mk;
        html += `<div class="ct-ministry-group">`;
        html += `<div class="ct-ministry-label"><span>${MINISTRY_ICONS[mk] || ''} ${label}</span><span class="ct-ministry-subtotal" data-subtotal="${mk}">${fmtShort(ministryTotal)}</span></div>`;
        html += rows;
        html += `</div>`;
    }

    body.innerHTML = html;
    document.getElementById('ct-grand-total').textContent = fmtShort(grandTotal);

    // Attach input listeners
    body.querySelectorAll('.ct-input').forEach(inp => {
        inp.addEventListener('input', onCostInput);
    });
}

function onCostInput(e) {
    const inp = e.target;
    const mk = inp.dataset.ministry;
    const instId = inp.dataset.inst;
    const val = parseFloat(inp.value) || 0;
    const pop = currentNation?.population || 0;

    // Update the institution data
    const insts = MINISTRY_INSTITUTIONS[mk];
    if (!insts) return;
    const inst = insts.find(i => i.id === instId);
    if (!inst) return;
    setPerCapitaCost(inst, val);

    // Update this row's total
    const totalEl = document.querySelector(`[data-total-for="${mk}_${instId}"]`);
    if (totalEl) totalEl.textContent = fmtShort(val * pop);

    // Update ministry subtotal
    let ministryTotal = 0;
    for (const i of insts) ministryTotal += getPerCapitaCost(i) * pop;
    const subEl = document.querySelector(`[data-subtotal="${mk}"]`);
    if (subEl) subEl.textContent = fmtShort(ministryTotal);

    // Update grand total
    let grandTotal = 0;
    for (const mkey of Object.keys(MINISTRY_INSTITUTIONS)) {
        for (const i of MINISTRY_INSTITUTIONS[mkey]) {
            grandTotal += getPerCapitaCost(i) * pop;
        }
    }
    document.getElementById('ct-grand-total').textContent = fmtShort(grandTotal);

    // Re-render the ministry detail if it's currently displayed
    if (selectedMinistryKey === mk) {
        const contentEl = document.getElementById('ministry-content');
        if (contentEl) contentEl.innerHTML = renderMinistryContent(selectedMinistryKey);
    }
}

// Wire up FAB and overlay click handlers — only in dev mode (?dev=1)
if (new URLSearchParams(window.location.search).get('dev') === '1') {
    document.getElementById('cost-tuner-fab').addEventListener('click', () => {
        document.getElementById('cost-tuner-overlay').classList.remove('hidden');
        renderCostTuner();
    });
    document.getElementById('ct-close').addEventListener('click', () => {
        document.getElementById('cost-tuner-overlay').classList.add('hidden');
    });
    document.getElementById('cost-tuner-overlay').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) {
            document.getElementById('cost-tuner-overlay').classList.add('hidden');
        }
    });
}
